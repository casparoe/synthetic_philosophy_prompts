  to get straight on a conceptual issue that our readings on nuclear deterrence keep
  circling. Our instructor introduced a distinction between chosen escalation and
  chance-loaded escalation. In the first, a state threatens to retaliate if attacked
  and retains the decision to do so; in the second, the state arranges its forces,
  commands, and procedures so that retaliation becomes a live probability rather than
  a deliberate choice, for example through pre-delegated launch authority, automated
  response systems, or a tripwire that makes escalation nearly automatic once certain
  thresholds are crossed. The suggestion is that the second kind of threat can be
  more credible than the first precisely because it does not require anyone to choose
  catastrophe at the moment of decision. I can follow the slogan but not the underlying
  machinery. Please explain, in a self-contained way, what it means for a threat to
  leave the final step to chance, how that differs from a conditional intention to
  retaliate, and why the difference is supposed to solve the credibility problem without
  simply replacing it with a different irrationality. Then lay out the main objections:
  that chance-loaded escalation may be indistinguishable in practice from a loss of
  control; that it can create incentives for the other side to pre-empt; that it may
  be self-defeating if both sides adopt it; and that credibility may mean different
  things depending on whether we are asking whether a threat is believed, whether
  it is rational, or whether it is morally permissible. Finally, apply the analysis
  to a hypothetical: a conventionally weak state with a small nuclear arsenal faces
