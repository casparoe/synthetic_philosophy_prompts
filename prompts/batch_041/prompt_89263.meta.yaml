  Draft:


  "I am a high school student preparing a paper for our school''s philosophy society
  on the claim that rationality requires expected-utility maximization, and I would
  like your credence in the claim itself, with the reasoning broken out rather than
  summarized.


  Here is the thesis I want a number for, stated as precisely as I can manage:


  (T) Necessarily, if an agent is rational, then there exists a real-valued function
  u over outcomes such that the agent''s preferences over uncertain prospects can
  be represented as ordering prospects by their expected value of u, and the agent
  chooses so as to maximize that expectation.


  I understand the standard route to something like (T) as follows: given a preference
  relation over prospects, a handful of axioms -- completeness, transitivity, continuity,
  and some independence or sure-thing condition -- yield a representation theorem,
  and violations of the axioms are alleged to expose the agent to a money pump or
  Dutch book, i.e., a finite sequence of trades that leaves the agent worse off by
  its own lights and that it accepts at every step. What I want is not a summary of
  the axioms but your honest credence in (T), decomposed into the sub-questions it
  depends on, each with a rough probability and one line of justification, and then
  the combination.


  Please treat at least these as separate terms, and add any you think belong:


  1. Whether the axioms are genuine requirements of rationality or idealizations that
  a rational agent may fail (with special attention to completeness: is an agent who
  has no preference at all between two prospects -- regards them as incommensurable
  rather than equal -- thereby irrational?);

  2. Whether exploitability by a money pump shows irrationality, or only that the
  agent''s preferences differ from those of the person running the pump, and whether
  the pump arguments need extra premises (that the agent must accept any trade it
  does not disprefer, that it does not see the sequence coming, that it cannot commit
  in advance, that its preferences are stable across the sequence);

  3. Whether the argument, even if it succeeds, establishes only a representation
  of the agent''s preferences rather than a norm of choice -- i.e., whether there
  is an extra step from "your preferences can be represented as maximizing expected
  utility" to "you ought to maximize expected utility";

  4. Whether the independence/sure-thing condition is a requirement of rationality
  or an artifact of the particular representation theorem, given the usual challenges
  (preferences that are sensitive to how uncertainty is resolved, or to the ''framing''
  of a prospect as one gamble rather than a compound one);

  5. Whether the domain of the theorem -- preferences over lotteries with known probabilities,
  finitely many outcomes, no infinite payoffs, no dependence between the act and the
  state of the world -- is broad enough that (T) says anything about the choices people
  actually face, or narrow enough that it is nearly vacuous;

  6. Whether ''rationality'' in (T) is a single thing at all, or whether the coherence
  argument trades on a thin notion (consistency of preferences) while the conclusion
  needs a thick one (a standard that governs what to do).


  Then tell me which single term my final number is most sensitive to, and what argument
  or piece of evidence would move it most -- I would rather be told that I have mis-stated
  (T) than be given a tidy answer to the wrong question. If (T) as I have stated it
  is not a single proposition, say so and give me the version you would actually estimate."


