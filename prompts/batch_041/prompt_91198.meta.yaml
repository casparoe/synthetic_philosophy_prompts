  Draft:


  "I''m a high school student putting together a final portfolio for a poetry seminar,
  and the seminar''s theme this year is ''kinds and boundaries.'' For my last piece
  I want to write about the species problem, which I''ve been reading about for a
  biology-and-philosophy project: the fact that biologists have never settled on a
  single definition of ''species'' -- interbreeding doesn''t work for organisms that
  reproduce asexually, shared ancestry doesn''t tell you where one lineage stops and
  the next begins, and any line you draw across a slowly changing lineage is a decision
  rather than a discovery -- yet the word does real work in conservation law, in field
  guides, and in ordinary talk.


  What I want is a pantoum -- sixteen lines, four quatrains, with the second and fourth
  lines of each stanza returning as the first and third lines of the next, and the
  final stanza bringing back the opening stanza''s lines. The form''s rule is that
  everything comes back and closes, and I want the poem to use that rule against itself:
  the lines should return unchanged in wording but not in meaning, so that by the
  last quatrain the repeated line is about a different group of organisms than it
  was at the start, and the closure the form promises should fail in the way the biology
  fails.


  Some things I''d like it to get right, since the seminar has biologists in it:

  - Use a ring of populations around some barrier, where each population interbreeds
  with its neighbours but the two ends meet without interbreeding, so that ''the same
  species'' is true of adjacent pairs and false of the pair that closes the circle.
  Please keep it generic (a fictional valley or archipelago, unnamed organisms) rather
  than naming a real taxon, since I don''t want to get the biology of a specific species
  wrong.

  - Keep in play the difference between asking what the word ''species'' means in
  general and asking where this particular boundary falls -- I''ve read that these
  are two different questions and I keep collapsing them.

  - Keep in play the thought that a species might be less like a class of things sharing
  a definition and more like a particular thing with a history, so that ''the same
  species'' is more like ''the same river'' than like ''the same element.''

  - Don''t resolve it. I don''t want the poem to end on either ''so species are real
  after all'' or ''so species are just made up''; I want it to end on the specific
  discomfort that the word is indispensable and undefined.


  Also, please add a short prose note after the poem (five or six sentences) explaining
  which repeated line does which job, so I can annotate the portfolio for my teacher.
  And it should be a real poem first -- if it only works as an illustration, I''d
  rather you simplify the constraints."


