  I run a small neighborhood association — about a dozen members, but the decisions
  that matter get made by a five-person steering group — and we settle our choices
  by ranking the options rather than just voting for one. Our rule, which we adopted
  years ago and have never revisited, works in two steps: each member ranks all the
  options; we then strike the option that finishes last on the largest number of ballots;
  and between the two options that remain, the winner is the one that more members
  rank higher. We thought this was fair because nobody''s first choice is ever simply
  thrown away, and because the second step is just majority rule.


  I''ve since read that there is a result — I''ve seen it called the Gibbard–Satterthwaite
  theorem — which says, roughly, that any way of turning individual rankings into
  a single group choice is either open to manipulation (some member can get a better
  result by submitting a ranking that isn''t their honest one) or is essentially a
  dictatorship. I''d like to see this made concrete with our own rule, so I can understand
  what it actually forbids and whether we can escape it.


