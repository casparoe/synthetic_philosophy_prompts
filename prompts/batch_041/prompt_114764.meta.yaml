  Draft:


  "I''ve been working through the problem of logical omniscience for a seminar, and
  I''ve ended up defending a fairly hard line that I want stress-tested. The line
  is this: logical omniscience is not a fixable defect of epistemic logic but a consequence
  of what epistemic logic is about — the objects of knowledge are propositions, propositions
  are individuated by their truth conditions, and an agent who knows p knows whatever
  is true in exactly the worlds where p is true. On this view, all the standard repairs
  — impossible worlds, awareness operators, implicit/explicit belief pairs, proof-theoretic
  or syntactic belief states — either smuggle back full closure somewhere in the machinery
  or stop modeling knowledge and start modeling something else (a computation, a proof
  search, a database). So the position I want to defend is: the only genuinely omniscient-free
  semantics are ones that have changed the subject, and there''s nothing left to fix.
  I''m not asking for a reading list — I know the literature exists and I don''t want
  citations. What I want is a map of what this view is exposed to: which results,
  cases, or arguments would count against it, and how decisive each would be. In particular,
  I''d like you to tell me (a) whether any of the repair strategies manages to block
  closure while still treating the objects of the attitudes as truth-conditionally
  individuated propositions — if one does, the ''changed the subject'' move collapses,
  and I want to know what exactly it does and where the cost is paid; (b) whether
  there''s a case where the idealization is not merely false of real agents but distorts
  what the theory predicts about agents we care about — for instance, does it make
  ''knowing that you don''t know'' or learning-by-elimination unrepresentable in a
  way that isn''t just an idealization? (c) whether closure plus other principles
  I''d want to keep (factivity, positive introspection, distribution over conjunction)
  generates a paradox or collapse that I can''t blame on the idealization; and (d)
  how much of my position survives if someone shows that non-omniscient, resource-bounded
  belief states can be provably coherent — e.g., a computable procedure that assigns
  coherent prices to logical sentences and never blows up on contradiction, even though
  it isn''t deductively closed. Then rank the defeaters from fatal to merely awkward,
  and tell me which of them a defender of my line would concede as a real cost and
  which they''d dismiss as not counting, and why. I''d find it most persuasive if
  you tell me which of these is the one that would actually make me give up the view,
  rather than a list of everything anyone has ever said."


