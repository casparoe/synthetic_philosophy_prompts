  Draft:


  I have no academic background in this area, but I have been reading popular accounts
  of the scientific revolution and I keep running into the clockwork universe analogy.
  The story is usually that Newton gave us a universe like a clock: God is the clockmaker,
  he winds it up and sets it going, and then it runs by itself according to laws.
  This is then used to license a larger conclusion: that Newton was a deist, that
  his God is the absent God of deism, and that the clockwork universe is the ancestor
  of a purely secular, law-governed view of nature. But I have also read that Newton
  wrote far more on theology and prophecy than most people realise, that he was an
  anti-Trinitarian, that he thought Christ was a mediator but not co-equal with God,
  that he thought space is the sensorium of God, and that he believed God sustains
  the world at every moment and is not a distant craftsman. I am not sure how to fit
  these two pictures together.


  I would like you to act as a historian of early modern science and a philosopher
  of religion, and to audit the clockwork analogy as an argument. Please think carefully
  before you answer, and begin with a short brainstorming section in which you list
  the features of the clockwork picture and the features of Newton''s actual theological
  views that seem relevant. Then give me the audit itself. I am not asking for a bibliography,
  reading list, or citations; I want the reasoning, and I would rather you flag uncertainty
  than guess at a specific text or date.


  In the audit, please do the following. First, set out a correspondence table: what
  plays the role of the clock, the clockmaker, the winding, the initial conditions,
  the laws, the regular motion, the maintenance, the workshop, the owner, and the
  observer, and what in Newton''s theology or metaphysics, if anything, corresponds
  to each. Second, identify where the mapping breaks. Third, separate the disanalogies
  that matter for the conclusion the analogy is being used to support from the ones
  that do not. Fourth, say which features of the source analogy are quietly imported
  into the target: for example, deism, divine absence, the autonomy of nature, a craftsman
  rather than a governor, or a sharp separation between creation and creator. Fifth,
  tell me whether the conclusion survives once the disanalogies are on the table:
  was Newton a deist, is his God the absent clockmaker, and is the clockwork universe
  a fair label for his view? Finally, if the analogy is not salvageable, suggest a
  better one, and explain what work the better analogy can and cannot do. Please define
  any technical terms you use, since I am not a specialist.


