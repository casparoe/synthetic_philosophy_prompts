  I have been reading a primer on philosophy of mind written for people with a neuroscience
  background, and its chapter on the causal exclusion argument ends with a summary
  that I suspect is doing something clever but I cannot tell what. It runs as follows:


  "Jaegwon Kim''s causal exclusion argument shows that mental causation is an illusion.
  The reasoning is simple. Every physical event has a sufficient physical cause, since
  physics is causally closed — a result that centuries of physical science have established.
  Mental properties supervene on physical properties: fix the brain and you have fixed
  the mind. But if a mental property is genuinely distinct from the physical property
  it supervenes on, then the neural event that causes my arm to rise is already fully
  caused by its physical predecessor, and the mental cause is at best a redundant
  extra. Nothing can be caused twice over in that way, so the mental cause is excluded
  and the mental property is left with nothing to do. Kim''s own conclusion is thus
  epiphenomenalism: thoughts and desires never cause anything. He grants that a commentator
  might reply that the argument does not even need the causal closure premise, since
  supervenience plus the ban on overdetermination does the excluding by itself; he
  regards this as a strengthening of his case. The only remaining escapes, he thinks,
  are eliminativism, which denies that the mental exists, or dualism, which gives
  the mental a separate realm of its own. He also observes that anyone persuaded by
  the argument should stop speaking of the causal powers of beliefs, economies, or
  genes, and he treats this generalization as a bonus rather than a cost."


  I am not a philosopher, and I do not want to dismiss the chapter out of hand — the
  exclusion problem is, as far as I can tell, a real problem, and I am prepared to
  believe that non-reductive physicalism cannot have everything it wants. But the
