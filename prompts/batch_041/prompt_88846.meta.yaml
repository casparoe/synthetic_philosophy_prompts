  Setup: two students in an epistemology seminar. The professor (or a reading group)
  claimed the preface paradox and the lottery paradox are "the same paradox in different
  clothes," and that any solution must treat them alike. One student (A) agrees: both
  arise from combining (i) a high-probability threshold for rational belief with (ii)
  closure of belief under conjunction; a preface author is just a lottery player who
  has bought many tickets (each claim = a ticket, at least one is false = someone
  wins). So a solution must give up one of the two principles, and any solution that
  gives up closure for the lottery but not the preface (or vice versa) is ad hoc.
  The other student (B) resists: in the lottery case, the negation of the conjunction
  is *known with certainty* (someone will win, given the setup — it''s a logical truth
  of the setup), whereas the preface author''s "at least one of my claims is false"
  is a defeasible inductive generalization about their own track record; so the two
  paradoxes involve different kinds of commitment — in the lottery you''re forced
  to accept a disjunction you can identify, in the preface you accept a bare existential.
  Also: in the lottery, each belief is grounded in a *statistical* fact about the
  same setup (the beliefs are "structurally" identical and symmetric), while the preface
  beliefs are heterogeneous and independently evidenced. And: the lottery''s "each
  ticket loses" beliefs are each held *because of* the very fact that makes the conjunction
  false; the preface has no such coupling. Then A counters: the preface author''s
  belief in each claim is also partly grounded in the very fact (their fallibility)
