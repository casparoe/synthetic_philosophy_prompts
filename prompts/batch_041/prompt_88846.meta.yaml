  the correct adjudication looks like. Key considerations a good answer would include:


  1. The structural parallel: both cases involve a set of individually well-supported
  beliefs whose conjunction is (or is taken to be) improbable/false; if rational belief
  is closed under conjunction and high probability suffices, both generate inconsistency.
  So the "same structure" claim has real force.


