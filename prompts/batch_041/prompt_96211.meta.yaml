  Modern collapse debate positions:

  1. Collapse as catastrophic decline / societal failure (Diamond''s Collapse; Tainter''s
  complexity-decline).

  2. Collapse as transformation / reorganisation: "collapse" of a political system,
  not of the population (McAnany & Yoffee, "Questioning Collapse"); resilience thinking.

  3. Maya: "collapse" of the Classic lowland kingdoms (divine kingship) c. 800–1000
  CE, but the northern Yucatán (Chichén Itzá, later Mayapán) continued; population
  didn''t vanish. Postclassic Maya continued. So "collapse" is partial/regional.

  4. Easter Island (Rapa Nui): Diamond''s ecocide story (overexploitation, statue-building,
  warfare, cannibalism) challenged by Hunt & Lipo (rats, obsidian, gradual, and European
  contact as major factor). Population collapse largely post-contact.

  5. Bronze Age collapse (~1200 BCE): multiple eastern Mediterranean kingdoms fell
  (Hittites, Mycenaeans, Ugarit), "systems collapse" via interconnectedness (Cline''s
  "1177 B.C."). Sea Peoples, drought, earthquakes, etc.


