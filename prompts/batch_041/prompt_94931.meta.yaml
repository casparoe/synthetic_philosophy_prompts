  at the center of his market-socialist scheme is just the program the whole machine
  runs — the Central Planning Board in Lange''s model is simply the auctioneer, and
  the auctioneer is an algorithm. On his reading, Mises''s impossibility claim and
  Hayek''s point about dispersed knowledge of local circumstances were really claims
  about the hardware of the 1930s: no single processor could hold the data, no channel
  could carry it fast enough, and no one could solve the system. He thinks that is
  why Lange''s answer looked so plausible at the time and also why it lost the argument
  in the literature: the critics were right about the machines they had, and wrong
  about the machines we would get. He added, as a clincher, that firms already do
  internally what he wants the state to do — a large company allocates capital, sets
  transfer prices, and coordinates thousands of activities without internal markets,
  and nobody thinks it is ''impossible''.


