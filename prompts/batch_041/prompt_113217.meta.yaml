  This is a genuinely puzzling passage: she tells us to be free of prejudice (préjugés),
  yet to cultivate illusion and thicken the varnish that illusion puts over objects,
  and not to dispel it with the torch of reason. Tension: reason vs. illusion; also
  the metaphor "le vernis qu''elle met" — the pronoun "elle" is ambiguous: does "elle"
  refer to illusion or to reason? Grammatically, "la faire disparoître par le flambeau
  de la raison" — "la" = l''illusion; "le vernis qu''elle met sur la plupart des objets"
  — "elle" could be "illusion" (the varnish that illusion puts on objects) or "la
  raison" (the varnish reason puts on objects) — which would be weird. Actually I
  think "elle" = illusion: "try to thicken the varnish which it [illusion] puts on
  most objects." So the puzzle is: she says we owe most of our pleasures to illusion,
  and we should thicken it rather than dispel it with reason — yet she also says we
  must rid ourselves of préjugés and be vertueux. Is she advocating self-deception?
  How is "illusion" different from "préjugé"? That''s a genuinely in-the- weeds philosophical
  question, and one with real scholarly discussion.


  Also the earlier: "Il faut commencer par se bien dire à soi-même, et par se bien
  convaincre que nous n''avons rien à faire en ce monde qu''à nous y procurer des
  sensations et des sentimens agréables. Les moralistes qui disent aux humains : Réprimez
  vos passions et maîtrisez vos desirs, si vous voulez être heureux, ne connoissent
  pas le chemin du bonheur."


  That''s a striking Epicurean/anti-Stoic claim. Plus the odd "Le Nôtre" anecdote
  (André Le Nôtre asking the pope for temptations instead of indulgences) — a joke.


  2. The passage about passions: "les malheureux sont intéressans ; les gens heureux
  sont inconnus" — an epistemic point about why we overestimate the misery caused
  by passions: a selection/observation bias! That''s a lovely in-the-weeds passage:
  she gives an argument about why the ledger of passion-caused misery is skewed —
  the unhappy are conspicuous because they need others, the happy are silent. That''s
  essentially a selection-bias argument, 1740s. And then: "Mais supposons, pour un
  moment, que les passions fassent plus de malheureux que d''heureux, je dis qu''elles
  seroient encore à desirer ; parce que c''est la condition sans laquelle on ne peut
  avoir de grands plaisirs" — a striking claim: even if passions on balance make more
  people miserable, they''d still be desirable, because they''re a necessary condition
  for great pleasures. That''s an interesting axiological claim — a kind of "great
  pleasures require the risk of great misery" argument, and arguably a form of "lexical
  superiority" or a rejection of expected-value reasoning. Genuinely puzzling: is
  she saying that even a gamble with negative expected happiness is worth taking?
  That''s philosophically meaty and in the weeds.


