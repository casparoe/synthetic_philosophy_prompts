  I am a graduate student working on a seminar paper about the rhetoric and argumentation
  of abolitionist writing, and I have been slowly working through Albert Camus''s
  1957 essay "Reflections on the Guillotine." There is a passage early in the essay
  that I find both striking and philosophically puzzling, and I would like help understanding
  exactly what Camus is claiming and whether the claim holds up. The passage reads:


  "When the Nazis in Poland indulged in public executions of hostages, to keep those
  hostages from shouting words of revolt and liberty they muzzled them with a plaster-coated
  gag. It would be shocking to compare the fate of those innocent victims with that
  of condemned criminals. But, aside from the fact that criminals are not the only
  ones to be guillotined in our country, the method is the same. We smother under
  padded words a penalty whose legitimacy we could assert only after we had examined
  the penalty in reality. Instead of saying that the death penalty is first of all
  necessary and then adding that it is better not to talk about it, it is essential
  to say what it really is and then say whether, being what it is, it is to be considered
  as necessary."


  My confusion is twofold. First, I cannot quite see how the analogy to the muzzled
  hostages is supposed to work. Camus concedes that comparing the fate of innocent
  hostages to that of condemned criminals would be shocking, yet he insists that "the
  method is the same." What exactly is the "method" he has in mind? Is it the use
  of physical or verbal constraints to prevent certain utterances? If so, is the analogy
  meant to be literal, or is it a rhetorical device designed to shock the reader into
  noticing the euphemisms we use for state killing? I am also unsure whether the analogy
  is supposed to establish a substantive moral conclusion or merely to diagnose a
  kind of collective self-deception.


  Second, I am puzzled by the final sentence''s ordering of priorities. Camus says
  that instead of first asserting the death penalty is necessary and then saying it
  is better not to talk about it, we must first say what it really is and only then
  ask whether it is necessary. This seems to invert the usual structure of justification:
  normally, we determine whether a practice is necessary (or justified) and then decide
  how to talk about it. Why does Camus think the descriptive task must come first?
  Is he making an epistemic point (that we cannot assess necessity without a clear-eyed
  view of the practice), a rhetorical point (that euphemism corrupts judgment), or
  something else? I would appreciate a careful unpacking of both the analogy and the
  ordering claim, including any unstated premises that Camus seems to rely on.


