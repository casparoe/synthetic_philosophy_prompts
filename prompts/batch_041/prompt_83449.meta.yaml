  Commitment set:

  1. Physicalism: Every fact about phenomenal experience is fixed by physical facts
  about the brain; there are no non-physical phenomenal properties.

  2. Scientific realism: When a mature science posits a state or process, there is
  a fact of the matter whether it occurred, even if it is unobservable in principle.

  3. Phenomenal realism about timing: For any subject and any time t, there is a fact
  of the matter about what the subject was phenomenally experiencing at t—not just
  about what they later report or remember.

  4. Color phi realism: In the standard color phi setup, the subject really does undergo
  an experience as of the first disk changing to the second disk''s color; the experience
  is not merely a memory error or a post hoc confabulation.

  5. Orwellian/Stalinesque as a substantive distinction: In any given revision case,
  exactly one of the following is true: either the experience itself is revised after
  the fact (Orwellian), or the experience was accurate and only the memory/report
  is revised (Stalinesque).

  6. Probe pessimism: Any experimental probe of what was experienced at t must be
  implemented by neural processes that occur after t and are themselves subject to
  revision, so no experiment can in principle distinguish an Orwellian from a Stalinesque
  account of a given case.

  7. Temporal order by neural order: The temporal order of experiences is fixed by
  the temporal order of the neural events that realize them, not by the order in which
  the represented contents are (re)constructed.

  8. Fallibility: Subjects can be systematically wrong about the temporal order of
  their own experiences, even under optimal attention.


