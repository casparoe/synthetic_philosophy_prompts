  Potential draft:


  I am a retired experimental scientist, now several years into reading philosophy
  of mind, and I would like a consistency audit of my current position on the timing
  of experience before I try to write it up. The case that started me thinking is
  the color phi phenomenon: two disks are flashed in quick succession at different
  locations and in different colors; subjects report seeing a single disk move from
  the first location to the second and change to the second color, with the change
  apparently occurring before the second disk is flashed. Here is where I have landed:


  1. Physicalism. Every fact about phenomenal experience is fixed by physical facts
  about the brain; there are no non-physical phenomenal properties.

  2. Scientific realism. When a mature science posits a state or process, there is
  a fact of the matter whether it occurred, even if it cannot be observed directly.

  3. Phenomenal realism about timing. For any subject and any time t, there is a fact
  of the matter about what that subject was phenomenally experiencing at t, not merely
  about what they later report or remember.

  4. Color phi realism. In the standard color phi case, the subject really does undergo
  an experience as of the first disk changing into the second disk''s color; this
  is not merely a memory error or a post hoc confabulation.

  5. Orwellian/Stalinesque as a substantive distinction. In any given revision case,
  exactly one of two things is true: either the experience itself is revised after
  the fact (the Orwellian reading), or the experience was accurate and only the memory
  or report is revised (the Stalinesque reading).

  6. Probe pessimism. Any experimental probe of what was experienced at t must be
  implemented by neural processes occurring after t, and those processes are themselves
  subject to the same kind of revision; so no experiment can in principle distinguish
  an Orwellian from a Stalinesque account of a given case.

  7. Temporal order by neural order. The temporal order of a subject''s experiences
  is fixed by the temporal order of the neural events that realize them, not by the
  order in which the represented contents are reconstructed.

  8. Fallibility. Subjects can be systematically wrong about the temporal order of
  their own experiences, even under optimal attention.


