  Let''s recall color phi: two spots in different positions, different colors, flashed
  in succession; subjects report seeing the first spot move and change color before
  the second appears. The second color seems to be experienced before the second stimulus
  is presented? This suggests either Orwellian revision (conscious experience is delayed
  until after the second stimulus, then constructed as if the first had the second''s
  color) or Stalinesque revision (a "memory" or report is revised, but conscious experience
  at the time was accurate). Dennett argues the distinction between Orwellian and
  Stalinesque is not empirically resolvable because any "early" probe would itself
  be subject to revision. The debate is about whether there is a fact of the matter
  about the timing/content of conscious experience.


  Commitments for a retired scientist:

  - I''m a scientific realist about unobservables, including neural states.

  - I think there''s a fact of the matter about what a subject experiences at a time,
  independent of what they can report.

  - I accept the color phi phenomenon as showing that the content of experience at
  a time can depend on later stimuli.

  - I think the distinction between Orwellian and Stalinesque revisions is a real
  empirical distinction, not merely a verbal one, and that some experiment could in
  principle settle it.

  - I think phenomenal consciousness is not just access consciousness; there can be
  unreportable experiences.

  - I think temporal order of experience is fixed by the order of neural events, not
  by the content of the experience.

  - I think a subject can be wrong about the temporal order of their own experiences.


