  2. The question: is the lamp on or off at the limit?

  3. The original argument that this shows supertasks are impossible (reductio: it
  must be both on and off, contradiction, so no such sequence of acts).

  4. The standard reply: no contradiction; the description simply fails to determine
  the final state; the sequence of states has a limit only if you stipulate it (e.g.,
  if the lamp is off at each even-numbered stage and on at each odd, the sequence
  of states at stage n doesn''t converge in any canonical sense — actually the "state
  at time t" for t < limit is well-defined for each stage; the limit at t = limit
  is not determined by the earlier values, since the state function isn''t continuous).
  Benacerraf''s point: the question "is it on or off?" presupposes that the physical
  description determines the final state; it doesn''t; there''s no answer, and that''s
  not a contradiction. Analogy: the sequence 1, 0, 1, 0, ... has no limit; a function
  defined on [0, 2) by this oscillation has no limit at 2. If you add a continuity
  requirement (a real lamp''s state can''t jump instantaneously), then a continuous
  state at the limit would be forced — e.g., a filament whose temperature must be
