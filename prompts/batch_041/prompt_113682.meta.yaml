reasoning_summary: "The task: pick a domain and type. Type options: grade an answer,\
  \ dialogue, restate in another framework. I need to write an elaborate, casual prompt,\
  \ with a student answer to grade (mixed quality with subtle mistakes), asking for\
  \ grade + comments, hard length limit, committed response.\n\nDomain: Let's pick\
  \ \"Superrationality\" or \"Wittgenstein's views on religious belief\" or \"Disjunctivism\
  \ and the argument from illusion\" or \"Honor/dignity/victimhood cultures\". \n\n\
  Type: \"Present a question and a student's answer to it, and ask the model to grade\
  \ the answer.\" This combines well with a domain where I can inject niche/new ideas\
  \ so it's not just regurgitation.\n\nLet me pick disjunctivism and the argument\
  \ from illusion — good technical content, subtle mistakes possible (conflating disjunctivism\
  \ about perception with disjunctivism about hallucination; the \"screening off\"\
