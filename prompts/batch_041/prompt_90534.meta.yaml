  I have a set of verdicts about freedom, agency, and responsibility in cases that
  cluster around Libet-style experiments, and I want to know what principle, if any,
  unifies them. I am not asking for a literature review, a history of the debate,
  or citations; I want the principle, its consequences, and an honest accounting of
  where my verdicts come apart. Here are the cases and my verdicts.


  1. In a Libet-style setup, a subject spontaneously flexes a wrist. A readiness potential
  precedes the reported urge to move by a fraction of a second, and the movement itself
  is underway before the subject is consciously aware of deciding. I regard the movement
  as the subject''s own free action, at least in the thin sense that matters for ordinary
  responsibility. The timing does not by itself make it unfree.


  2. In the same setup, the subject is hypnotized and instructed to flex when a tone
  sounds. The subject feels no urge and later says the hand moved on its own. I regard
  the movement as not free.


  3. A pulse of transcranial magnetic stimulation to the motor cortex makes the subject''s
  hand move. The subject says the hand moved, not they. I regard the movement as not
  free.


  4. A person with alien hand syndrome finds one hand acting against their stated
  intentions, sometimes grasping objects or undoing buttons. I regard those actions
  as not free, even when the hand''s movements are complex and seemingly purposeful.


  5. A person with a deep brain stimulator develops a sudden urge to gamble. They
  act on it, and later say the urge came from the device and did not feel like theirs.
  I regard the gambling as not free.


  6. A person with the same stimulator develops the same sudden urge, acts on it,
  and later says that although the urge came from the device, they endorsed it and
  would not have wanted to be without it. I am inclined to regard the gambling as
  free, or at least as attributable to them in the way that matters for responsibility.


  7. A person acts under a credible threat of immediate death, handing over money
  that is not theirs. They could not have done otherwise in any ordinary sense. I
  regard them as responsible for the act, though perhaps excused or diminished in
  blameworthiness, and I do not think the mere fact that they could not have done
  otherwise settles the matter.


  8. A brain scanner predicts a person''s decision several seconds before the person
  becomes aware of it. The prediction is a correlate of the person''s own deliberation,
  not an external cause. I regard the eventual decision as free.


  9. A neuroscientist secretly implants a desire in a person, a desire the person
  would not have had otherwise. The person acts on it, endorses it, and would not
  want to be rid of it. I regard the action as not free, because the desire was put
  there by someone else.


  My tentative principle is this: an action is free when it flows from the agent''s
  own standing values and reasons, and not from a state that bypasses or alienates
  the agent; conscious awareness before the act is not necessary, but the agent must
  have been able to veto or endorse the action in the relevant way. I can already
  see that this principle may not survive cases 6 and 9, since both involve an induced
  desire that the agent endorses, yet I want opposite verdicts. I also suspect cases
  1 and 3 are in tension: both involve a movement whose neural cause precedes conscious
  awareness, but I want one to be free and the other not. And case 7 seems to pull
  against any principle that makes free action depend on the ability to do otherwise.


  What I want from you is a principle, or a small set of candidate principles, stated
  precisely enough that I can see what each clause is doing. For each clause, tell
  me which case motivates it. Tell me what the principle predicts for cases I have
  not listed: a person whose preferences are changed by a brain tumor but who endorses
