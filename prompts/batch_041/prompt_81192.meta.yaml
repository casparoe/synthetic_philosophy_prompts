  The careenium, as I understand it, is a vast flat arena containing an enormous number
  of tiny magnetic balls — Hofstadter calls them simms — that careen around, collide,
  and occasionally stick together into clusters. The clusters form, dissolve, and
  re-form; the individual simms are chaotic in their details, but from a distance
  you can see stable higher-order formations — simmballs — that seem to track features
