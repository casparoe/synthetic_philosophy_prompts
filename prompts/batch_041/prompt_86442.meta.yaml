  The version I read last week ran it to a cheerful conclusion: cryptanalysts never
  understood the messages they broke, so understanding was never the point, and the
  complaint that machine translation is shallow is just nostalgia for a human mystique.
  Someone else in the same book ran the same analogy the other way -- that only a
  being who already knew roughly what the message was about could break the code at
  all, so a machine that doesn''t know can''t.


