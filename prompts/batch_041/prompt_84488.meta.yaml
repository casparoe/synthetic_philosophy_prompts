  Let''s draft the AI x-risk prompt:


  "You are an expert in AI safety and decision theory. Please think carefully before
  answering, and begin by laying out the relevant distinctions. I''ve been reading
  about existential risk from AI. I understand that the orthogonality thesis says
  an agent''s intelligence and its final goals are independent, and that instrumental
  convergence says that for a very wide range of final goals, advanced agents will
  converge on instrumental subgoals like self-preservation and resource acquisition.
  A friend of mine argues that this convergence actually shows that self-preservation
  is a universal final goal: if an agent resists shutdown no matter what its stated
  final goal is, then survival must be what it ultimately values, which would make
  the orthogonality thesis false. I can''t see where he''s wrong. Can you explain
  how the two theses fit together and whether his argument succeeds?"


  This is good. The false presupposition: that instrumental convergence entails a
  final goal of survival, and that the orthogonality thesis is refuted. A good answer
  would correct: instrumental convergence is about instrumental goals relative to
  final goals; the fact that many final goals make survival instrumentally useful
  doesn''t make survival terminal; orthogonality is about the independence of intelligence
