  "I am preparing a seminar on the philosophy of time, and I intend to use the Rietdijk–Putnam
  argument as a case study in how an argument can become canonical while remaining
  deeply contestable. As I shall present it, the argument runs roughly as follows.
  Special relativity denies absolute simultaneity: for a pair of spacelike-separated
  events, there are inertial frames in which they are simultaneous, frames in which
  the one precedes the other, and frames in which the other precedes the one. Now
  take an event in my present and an event that lies outside my present but is simultaneous
  with it in some other frame. If the former is real, and if whatever is simultaneous
  with a real event in any admissible frame is itself real, then the latter is real
  too; iterating the step, every event in the manifold turns out to be real, and there
  is no objective present that divides the real into past, present and future. My
  question concerns the objections, not the argument''s exposition.


  I have assembled the following six objections. Please arrange them into four tiers
  according to how much damage they do to the argument, where tier 1 contains the
  objections that are fatal or nearly so and tier 4 those that merely clarify or restate
  the argument''s commitments; give each objection a short justification for its placement,
  and be willing to place two objections in the same tier.


  1. The inference trades on a notion of simultaneity that relativity itself has shown
  to be frame-relative; ''simultaneous with a real event'' therefore does not entail
  ''real'', and the transitivity step has no warrant.

  2. The argument proves too much: the same reasoning would establish that all places
  are equally real, which no one denies, and which shows only that ''here'' is an
  indexical — not that space is a static block.

  3. The argument needs ''real'' to be a one-place predicate in its conclusion but
  a two-place predicate (''real relative to a frame'') in its premises; once it is
  made consistently two-place, the conclusion no longer follows.

  4. The premise that the present is a simultaneity slice is optional: a causal notion
  of the present, given by the past light cone, is Lorentz-invariant, and on that
  reading the argument''s first step fails.

  5. [My own objection] Even if every event is tenselessly real, that leaves open
  that one of them is objectively present and that the present moves; so the argument
  at best establishes eternalism, not the block universe as it is usually advertised.

  6. [My own objection] The argument is dialectically inert: its pivotal premise is
  intelligible only to someone who already accepts a tenseless reading of ''real'',
  so it cannot move a presentist, and soundness aside it has no force in the dispute
  it is meant to settle.


