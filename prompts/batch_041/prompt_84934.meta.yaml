  The unilateralist''s curse: Suppose N actors, each can take action A or not. A''s
  true value is V, unknown. Each actor i has estimate v_i = V + noise. They act if
  v_i > 0 (say, act if they think it''s worth it). The act is "unilateral" — one actor
  acting suffices. Then P(someone acts) = 1 - prod_i P(v_i ≤ 0) = 1 - prod_i F(-V).
  As N grows, this → 1 for any V. So even if V < 0 (act is bad), someone likely acts.
  The curse: conditional on someone acting, the expected value of the act is negative,
  because the actor is selected for overestimation.


