  Löb''s theorem: if PA ⊢ □(□A → A) → □A... more precisely, for any sentence A, if
  PA ⊢ □A → A then PA ⊢ A. Consequence: a consistent system extending PA cannot prove
  □⊥ → ⊥, i.e., cannot prove its own consistency (Gödel''s second incompleteness is
  a corollary). The "Löbian obstacle" to self-trusting agents (from MIRI / Löb''s
  theorem in decision theory, e.g., "Robust cooperation in the Prisoner''s Dilemma",
  Tiling agents): an agent that trusts its own conclusions and uses them in reasoning
  about its own actions can be led to inconsistency. The "tiling" problem: a successor
  agent built by a predecessor, with the predecessor trusting the successor. The obstacle:
  if an agent A trusts that "whatever B (a successor/modified version) proves is true",
  and A can prove "if B proves X then X", then by Löb A proves X for arbitrary X.
  So an agent cannot have a blanket self-trust axiom without proving everything (and
  being inconsistent if it also has Peano-arithmetic-ish strength).


  Also relevant: the "Löbian obstacle" means no consistent theory extending PA can
  prove "if I prove something, it''s true" in general (well, the schema is: it can''t
  have the schema "Prov(⌜A⌝) → A" for all A — actually that schema is inconsistent:
  it implies Prov(⊥)→⊥ which gives consistency, contradicting G2). Right: the uniform
  reflection principle / local reflection schema implies consistency, so it''s unprovable.
