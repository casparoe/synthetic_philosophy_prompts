  typical level for its species and age class (setting aside the environment-induced
  and the universal-design states). On this view ''disease'' belongs to biology and
  pathology, and calling something a disease is a claim about how the body works,
  not about whether the state is bad or unwanted.


  The normativist line says that no such notion can be extracted: the judgements of
  ''dysfunction'' and ''subnormality'' are already evaluative, because what counts
  as the function of a part, and what counts as normal, are fixed by purposes and
  interests rather than by biology alone. The standard evidence is a list of cases:
  states that are statistically typical yet treated as disease, states that are atypical
  yet not disease, and states that were once diseases and are now not (or the reverse)
  after a shift in social attitudes alone.


