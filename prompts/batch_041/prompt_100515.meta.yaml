  fully stated for decades, each side has absorbed the other''s cases and explained
  them away, and no one switches. My working hypothesis is that the dispute is not
  really about values at all but about which job the word ''disease'' is being asked
  to do. Suppose we separate two projects. Project A is explanatory: we want a kind
  that figures in causal and predictive generalizations -- something pathology, epidemiology
  and physiology can use, in which the classification does not depend on anyone''s
  preferences, because otherwise the generalizations won''t hold across changes in
