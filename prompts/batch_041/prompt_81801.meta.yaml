  The reason this has become urgent is an encounter I had a fortnight before. My car
  died on a county road with no signal, and a retired farmer stopped, loaded my bicycle
  and my dog into the back of her truck, drove ninety minutes out of her way, and
  refused the cash I offered at the town garage. She said she''d rather have the money
  when I got home, and when I pressed her she said something I can''t get out of my
  head: that she''d been burned before by people who were perfectly gracious at the
  roadside, and that what she was really doing was betting on the sort of person who
  would bother to send it. I sent it that week. But I noticed, sitting in her truck,
