  My thesis, in outline: the question of how tightly a society should regulate conduct
  is usually posed as a question about *content* — which rules are justified — and
  I want to argue it is at least as much a question about *quantity and enforcement*.
  I distinguish two quantities. "Compliance capital" is the stock of willingness to
  comply with rules as such — the disposition to obey a norm you privately find pointless,
  because obeying norms is what one does. Every additional demand on conduct draws
  on that stock; it is replenished by the experience of living among people who mostly
  comply, and it is spent fastest when rules are announced and then visibly unenforced.
  "Enforcement yield" is the fraction of a rule''s intended effect actually achieved
  per unit of monitoring cost. My claim is that these two quantities trade off against
  each other, and that the trade-off has an asymmetric consequence: the marginal rule
  must clear a higher justificatory bar than the average rule, because it is paid
  for out of a stock that the earlier rules have already drawn down. A culture can
  therefore be *too tight even by its own lights* — too tight to enforce what it has
  already demanded. I also claim the reverse is true: a culture that demands few rules
  but enforces them reliably can sustain more total regulation-in-effect than a culture
  that demands many and enforces them sporadically, so comparisons of "how regulated"
  two societies are cannot be read off the statute book. I call the second half the
  *substitution thesis* and the first the *declining marginal authority* claim. I
  have some cross-national evidence (rule counts vs. self-reported compliance) that
  is suggestive but not decisive, and I concede the measurement of "compliance capital"
  is indirect.


  Audience: the panel is five people. Two are cultural psychologists who have spent
  their careers measuring how much latitude societies give in everyday conduct — dress,
  punctuality, courtship, deference — and they will hear my "compliance capital" as
  a relabelling of their construct with a story attached, and they will want to know
  what it predicts that their measure doesn''t. One is a legal philosopher whose work
  is on the moral significance of legitimate authority, and who thinks the interesting
  question is never "how many rules" but "who gets to make them and whether the subject
  has reason to comply". One is a behavioural economist who will want the trade-off
  written as a cost function and will ask why the marginal bar should be higher rather
  than lower if compliance is habit-forming (i.e. if compliance capital appreciates
  with use rather than depreciating). One is a public-health official who has watched
  voluntary guidance fail during an emergency and will take my thesis as an argument
  against ever issuing guidance that cannot be enforced.


