  Ok so this is a question I''ve had kicking around since forever and I''ve never
  seen it done properly. Everybody in the rationalist-adjacent corner of the internet
  knows the two standard moves on the neolithic transition: Sahlins''s "original affluent
  society" (foragers worked like 15-20 hours a week, few wants, so they were rich)
