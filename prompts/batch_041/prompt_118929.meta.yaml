  thing — it''s the stats dept''s Bayesian reading group plus the history and philosophy
  of science crowd, joint session, about 25 people, 20 min talk plus Q&A. Roughly
  who''s in the room: maybe six or seven people who do Bayesian stats for a living
  and are pretty unsympathetic to the idea that there''s any problem here at all;
  three or four HPS people who think Bayesian confirmation theory is a toy that never
  touches actual episodes in the history of science; one formal epistemologist who
  works on measures of confirmation and will absolutely ask about difference vs ratio
  measures; and my supervisor, who thinks my chapter is fine but keeps saying I''m
  ''reinventing'' something.


