  a bug in how we specify the evidence. I want to say confirmation should be relative
  to a partition — the set of distinctions the agent''s evidence lets her draw — not
  relative to a time or to a set of propositions she already believes. On that view,
  old evidence confirming a newly formulated hypothesis is completely unremarkable:
  the evidence confirms H relative to the partition H itself makes salient, and the
  reason it looked like a problem is that everyone was trying to fix it with probabilities
  (the counterfactual ur-prior move, or the trick of treating the discovery that H
  entails E as itself a new piece of evidence) when they should have been fixing the
  evidence relation. I also think the counterfactual move is circular, in a specific
  way: to compute what my probability in H would have been if I hadn''t known E, I
  already have to know what counts as my evidence, which is exactly the thing in dispute.
  And I want to insist there''s a real difference between the case where E is merely
  already known and the case where E is entailed by H — the ur-prior fix treats them
  as the same kind of thing and I don''t think they are.


