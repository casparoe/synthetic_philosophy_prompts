  is the wrong place to put the weight. He says even if you handed the linguist a
  perfect brain scanner that read off every disposition and every internal state of
  the speaker, the choice would still be underdetermined, because the two hypotheses
  are related by a systematic reshuffling of what refers to what — you can permute
  the whole reference scheme, sending rabbit-parts to rabbit-holes and so on, in a
  way that leaves every sentence''s truth value exactly as it was, and there''s no
  further fact that could break the tie. So for him the behaviorism is a red herring,
  and the thesis is really about the nonexistence of any fact of the matter about
  reference, not about our ignorance. He also thinks it applies to two native English
  speakers talking to each other, not just to exotic cases.


