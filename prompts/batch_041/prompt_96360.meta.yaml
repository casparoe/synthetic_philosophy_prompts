  7. A trait that used to be for X but now does Y: feathers originally for thermoregulation,
  now for flight. Does feather have function of flight, thermoregulation, or both?

  8. Learned/intentional: a person''s habit of humming — function?

  9. A trait that is currently harmful but was selected for: e.g., human sweet tooth
  in an environment of abundance — function is to seek sugar, but it now harms. Etiological:
  still function. Causal-role: doesn''t contribute now → not a function. Good hard
  case.

