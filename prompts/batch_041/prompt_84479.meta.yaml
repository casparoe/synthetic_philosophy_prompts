  to make housing affordable is counterproductive, so we should never help. But this
  is well-trodden. Could be made more in the weeds with a specific argument about
  "if you accept that rent control causes a housing shortage, then by the same logic
  you must accept that minimum wage causes unemployment, and therefore any labor market
  intervention is wrong; but that proves too much because it would also rule out laws
  against slavery? Hmm."


