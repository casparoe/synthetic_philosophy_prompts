  **Unilateralist''s curse**: This is a concept from Nick Bostrom et al. about situations
  where multiple actors can undertake an action unilaterally; if the action is harmful
  when wrong, and each actor''s estimate of whether it''s a good idea is noisy, the
  probability that at least one actor acts wrongly increases with the number of actors.
  The "curse" is that even if each individual is more likely right than wrong, the
  collective may be more likely to do the wrong thing. An argument that proves too
  much might be: if unilateral action is cursed, then any decentralized decision-making
  is irrational, so we should centralize all decisions — which seems to prove too
  much because it would justify totalitarianism. Or maybe an argument that the unilateralist''s
  curse makes it irrational to act on any controversial moral issue. Need subtle flaw.


  **Minimum wages and rent control**: ethics and economics of price controls. An argument
  that proves too much: e.g., if interfering with voluntary transactions is wrong
  because it reduces total welfare, then any regulation (including banning child labor,
