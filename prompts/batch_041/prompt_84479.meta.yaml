  Let''s flesh out the language of thought domain. The language of thought hypothesis
  (LOT) is the idea that thought has a syntactic structure similar to language, with
  compositional representations. It''s associated with Jerry Fodor. The debate with
  connectionism is classic. A software engineer might encounter this in discussions
  of AI. The argument could be:


  A colleague argues:

  (1) Any system that genuinely thinks must have a language of thought: a representational
  system with compositional syntax and semantics.

  (2) Large language models (LLMs) process tokens and vector embeddings; they do not
  have a symbolic, compositional representational system of the kind LOT requires.

  (3) Therefore, LLMs do not genuinely think.

  (4) But LLMs can solve novel problems, generalize to unseen tasks, and produce reasoning
  that looks like thought.

  (5) If a system can solve novel problems and generalize, it must be thinking (or
  at least, it is doing something that we should call thinking).

  (6) So either (1) is false or (2) is false.

  (7) If (1) is false, then the computational theory of mind (that thinking is computation
  over representations) is false, because computation requires a representational
  system.

  (8) If (2) is false, then LLMs do have a LOT, but it''s implemented in vectors,
  which seems to stretch the notion of LOT beyond recognition.

  (9) Either way, the LOT hypothesis is either false or vacuous.

  (10) Therefore, we should abandon LOT.


