  account of betterness. On this view, a judgment that one thing is better than another
  is never made in a vacuum; it is always made relative to a set of alternatives that
  are genuinely available to the agent — a menu, in her idiom — and the standard of
  comparison is partly fixed by what is on that menu. Transitivity, on this account,
  holds within any single menu, because within a fixed menu there is a stable background
  against which options can be ranked; but it need not hold across menus, and the
  spectrum arguments are, on her reading, chains in which each link is evaluated against
  a different background, so that the appearance of a contradiction is an artifact
  of sliding from one comparison class to another. I would like you to make the strongest
