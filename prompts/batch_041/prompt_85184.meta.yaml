  shortest. Argument: (1) If simplicity is machine-relative, then for any two hypotheses
  there''s a machine where either is simpler. (2) Solomonoff induction converges to
  the truth regardless of machine. (3) But convergence is only asymptotic and the
  additive constant is unbounded, so for any finite amount of data the prior can be
  arbitrarily bad. (4) And "in the limit of infinite data" never happens. (5) So Solomonoff''s
  claim that simplicity is objective fails, OR the convergence guarantee is empty.
