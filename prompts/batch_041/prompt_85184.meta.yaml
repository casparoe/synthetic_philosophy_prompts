  cell builds from it. That''s the least controversial thing in molecular biology.
  (2) For X to carry information about Y is just for the state of X to reduce uncertainty
  about the state of Y — a reliable correlation and nothing more; whatever else people
  mean by "information" they don''t mean anything the cell could cash out. (3) Wherever
  there''s a reliable correlation like that, there''s a mapping from states of one
  thing to states of another, and that mapping is a code. (4) The mapping from codons
  to amino acids isn''t forced by physics or chemistry — the same codon means different
  things in different lineages, so nothing about the chemistry pins the assignment
  down. It''s arbitrary. (5) An arbitrary mapping of that kind is a code in the full
