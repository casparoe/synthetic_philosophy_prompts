  - "tells him he must first weigh the two outcomes without giving his wife special
  weight; only then may he save her, and only if the numbers favor it" — this is roughly
  the standard reading, though the precise point is subtler: the utilitarian can permit
  saving the wife, but requires a justification of a certain form ("in cases of this
  kind it is permissible to save one''s own wife"). Williams''s complaint is about
  the *justification* being the ground of the action, not the outcome of the calculation.
  Also Williams''s example is that the man *has* the thought "she is my wife" and
  Williams says that''s the right thought; the utilitarian insists on a further thought.
  Actually the subtlety: it''s not that utilitarianism forbids saving her unless numbers
  favor; it''s that utilitarianism requires that the man''s reason be the general
  principle, not the particular attachment.

  - "self-contradictory" — Williams''s objection is that utilitarianism fails to respect
  integrity; it''s not that it''s self-contradictory. Williams''s "integrity" objection
  is that it makes the agent a mere "channel" for general welfare, alienating him
