  "A colleague sent me a post summarizing Bernard Williams''s famous objection to
  utilitarianism. It runs roughly: Williams asks us to imagine a man who can save
  either his wife or a stranger from drowning. Utilitarianism, being impartial, tells
  him he must first weigh the two outcomes without giving his wife special weight;
  only then may he save her, and only if the numbers favor it. Williams says this
  is absurd -- the man who saves his wife simply because she is his wife is doing
  the right thing, and any theory that requires him to add a further impartial justification
  before he may act imposes one thought too many. From this Williams concludes that
  utilitarianism is not just demanding but actually self-contradictory, and that the
  correct lesson is that we should drop the pretense of impartial morality and give
  our own projects and loved ones absolute priority over strangers. The post adds
  that this same argument shows any ''effective altruism'' style demand to justify
  your choices by global impact is incoherent, since it alienates you from your own
  life."


