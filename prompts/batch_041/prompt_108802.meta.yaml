  taxonomy/argument: either (a) constitutive justification succeeds and the least-restrictive-alternative
  objection is defeated; or (b) it fails because communicative use is impermissible;
  or (c) it succeeds only under conditions X (e.g., universality, non-selectivity,
  exit options). And failure = if the question collapses into the ordinary just-war
  debate about conscription, or if "constitutive" turns out to be doing no work beyond
  "instrumental but unusually effective".


  Method: conceptual analysis + a small structured comparison of the postures (militia
  vs. professional vs. selective conscription) using a single analytical device: ask
  in each case what the conscript is being used *for* (fighting, deterring, signalling,
  constituting), and whether the justification survives when the use is not fighting.
  Why this rather than obvious alternatives: because empirical work on deterrence
