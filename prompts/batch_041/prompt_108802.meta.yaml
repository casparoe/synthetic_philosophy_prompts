  Then explain the two injected thoughts:

  - universality of service functions as a costly signal of defensive-only intent:
  a militia cannot project force, a professional army is a general-purpose instrument,
  so the very feature that makes conscription onerous (its universality, its poor
  fit for offensive operations) is what makes the posture credible.

  - neutrality is a status others must confer; you cannot achieve it unilaterally;
  so the state conscripts in order to change how *others* classify it.


  And the sharp twist: if the justification is partly that conscription is a message,
  then the conscripts are being used as communicative means, and the standard "least
  restrictive alternative" test (would a professional army do?) fails — which cuts
  both ways: it might rescue conscription from the usual liberal objection, or it
  might make conscription worse than ordinary defence conscription, because ordinary
  conscripts are at least used to defend themselves.


  Also the third element: the burden profile. In neutrality the risk is latent (deterrence
  may hold; the war may never come), while the cost in time, career, and autonomy
  is certain. So the ethics of "imposing a small certain burden to avert a large probabilistic
  one" arises, plus the question of whether a never-used army''s conscripts have been
  wronged.


