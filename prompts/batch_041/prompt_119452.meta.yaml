  Standard setup (Piccione & Rubinstein 1997, "On the Interpretation of Decision Problems
  with Imperfect Recall," Games and Economic Behavior): A driver is driving home along
  a road with two intersections. At each intersection she can either continue (EXIT?
  no—continue) or exit (take the exit). Actually the standard: at the first intersection,
  if she exits she gets 0; if she continues, she arrives at the second intersection.
  At the second intersection, if she exits she gets 4; if she continues she gets 1
  (lost, or ends up somewhere bad). The catch: at each intersection she cannot tell
  whether it is the first or the second — she has imperfect recall / no memory of
  having passed an intersection. So she must choose the same action at both. Wait,
  more precisely: she cannot distinguish the two decision nodes, so she must use the
  same strategy at both. If she exits at the first intersection she gets 0. If she
  exits at the second she gets 4. If she continues past the second she gets 1. If
  she plans to exit at both... hmm, but she can''t tell which is which, so any deterministic
  strategy: "exit" at both → she exits at the first intersection, getting 0. "Continue"
  at both → she continues past both, getting 1. So deterministically, continue is
  better (1 > 0).


  But she can randomize: choose exit with probability p at each node (same p at both
  since she can''t distinguish). Expected payoff: she exits at the first intersection
  with probability p, getting 0. With probability (1-p) she continues to the second
  intersection, where she exits with probability p getting 4, and continues with probability
  (1-p) getting 1. So expected payoff = p·0 + (1-p)[p·4 + (1-p)·1] = (1-p)(4p + 1
  - p) = (1-p)(3p+1) = 3p + 1 - 3p² - p = 1 + 2p - 3p². Maximize: derivative 2 - 6p
  = 0 → p = 1/3. Expected value = 1 + 2/3 - 3/9 = 1 + 2/3 - 1/3 = 4/3. Yes, 4/3. Good,
  my recollection is right: p = 1/3, payoff 4/3.


