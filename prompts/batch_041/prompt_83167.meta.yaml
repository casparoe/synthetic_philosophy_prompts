  hmm, careful. Kripke: proper names are rigid designators; the object need not exist
  in all worlds; statements of existence involving names are contingent (if the name
  is "weakly rigid" / has a merely possible referent). Kripke allows that a rigid
  designator can fail to refer in some worlds (e.g., "Aristotle might not have existed"
  is true — well, Kripke discusses "Hitler might never have existed"; the name is
  rigid and empty in those worlds). Also the distinction between rigid designation
  and essentialism (Kripke in Naming and Necessity, Lecture III, distinguishes essential
  properties of individuals from rigidity; he notes that the essentialist thesis doesn''t
  follow from rigidity). Also Salmon''s "weak rigidity". Also the distinction between
  rigid designators and "persisting" across worlds — the object itself is the same,
  but its existence is contingent.


