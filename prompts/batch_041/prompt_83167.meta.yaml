  that presents one school''s reading as the consensus. British English please."


  That''s decent. It has the false presupposition (ladder + critical is best + iconoclast
  side), plus a genuine sub-question. The correction: no ladder, each mode has its
  own soil and dangers, Nietzsche''s worry is the excess of history ("the historical
  culture"), critical history is presented as the hardest and most dangerous for life
  too (it puts the past on trial and can leave you rootless), and Nietzsche isn''t
  straightforwardly pro-iconoclasm — the essay''s rhetoric is about the *balance*
  of the historical and the unhistorical, and about "life" as the standard. Also,
  the three modes are not methods for professional historians but stances toward the
  past serving different needs (the man of action, the preserver/reverer, the sufferer
  seeking liberation). Also worth noting: Nietzsche says the critical mode is the
  one that "sits in judgment" and is dangerous; and his real target is the "historical
  education" of his contemporaries. Also: whether "critical" is his preferred mode
  is contested; some read the essay as finally calling for something beyond all three
  (a "suprahistorical" or the health of "life"), and the relation to his later thought
  is contested.


