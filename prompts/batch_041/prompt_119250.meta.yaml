  Draft prompt:


  "Act as a cliodynamicist who is also a historian of revolutionary France, and think
  carefully before you write. I want you to run the French Revolution — from the fiscal
  crisis of the 1780s through the Terror to the consolidation under Napoleon — through
  Peter Turchin''s secular-cycle model, and then tell me where the model strains.
  Here is the model as I understand it, so we''re working from the same machinery:
  polities pass through long integrative and disintegrative phases; the disintegrative
  phase is driven by the interaction of (i) demographic expansion pressing against
  a fixed resource base and immiserating the common population, (ii) elite overproduction
  — too many aspirants competing for too few elite positions, producing intra-elite
  conflict and factional violence, and (iii) the state''s fiscal distress as its revenues
  lag its commitments; Turchin bundles proxies for these into a political stress index
  that is supposed to rise measurably before breakdowns. Please do four things. First,
  map the actors and quantities: who are the elites being overproduced, what are the
  rents they compete for, what does immiseration look like on the ground, and what
  does the state''s fiscal position look like. Second, say what the model explains
  that a plain political narrative does not, and what it explains away that it shouldn''t
  — in particular what the model does with the Enlightenment, with the Church, and
  with the choices of particular people. Third, address the dating problem: the model
  predicts a breakdown, but the episode has several candidate breakdowns (1789, 1792,
  1793–94, 1799) and an unmistakable reconsolidation afterward; does the flexibility
  of the cycle''s phase boundaries make the model unfalsifiable, and if not, what
  would count as a failed prediction for France? Fourth, end with a verdict on the
  case as a test of cliodynamics: does the Revolution confirm the secular-cycle model,
  refute it, or leave it untouched because the model was never precise enough to be
  at risk? Be disciplined about the mapping and explicit where the theory is silent;
  do not retreat into either cheerleading for quantitative history or reflexive scepticism
  about it."


