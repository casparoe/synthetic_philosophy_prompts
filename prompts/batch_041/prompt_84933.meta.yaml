  Rashomon: four mutually incompatible accounts of a rape and a murder, each presented
  as a flashback re-enactment with distinct visual style. The film gives no master
  version. The philosophical lens: Dennett''s Orwellian/Stalinesque distinction applied
  to the film. Key question: are the narrators reporting experiences they had and
  then distorted in memory (Orwellian), or were their experiences themselves constructed
  so that no distortion is required (Stalinesque)? And the deeper point: the film''s
  own formal device — showing us each testimony as a vivid present-tense scene, not
  as an obviously "recounted" scene — enacts the Stalinesque option: we never see
  the original perception, only the edited broadcast. Also the woodcutter''s final
  version (he saw it, omitted the theft of the dagger) — the film''s "closest to truth"
  version is itself a revised one, and the film never gives the audience the original.


