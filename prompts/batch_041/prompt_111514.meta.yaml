  \ something. Fine, keep it.\n\nLet me now write the final prompt. Aim ~450-600 words,\
  \ 3 paragraphs, formal/polished, first person lay.\n\nCareful: \"Write the prompt\
  \ from the perspective of someone without any academic background\" — so avoid sounding\
