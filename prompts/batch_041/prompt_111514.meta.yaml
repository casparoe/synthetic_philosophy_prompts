  \ make it \"a self-published writer\" or better, keep the crank fictional entirely.\
  \ Actually the prompt's fictional dossier will be constructed by the model; I just\
  \ need to give the flavor. I could say \"the theory that a whole stretch of the\
  \ written record is a duplicate of an earlier stretch, argued with statistics\"\
  \ — that's describing the *type* without attributing. Let me just describe it as\
  \ a type and let the model instantiate.\n\nHmm, but the domain is \"Pseudohistory\
  \ and demarcation (Atlantis, ancient aliens, Fomenko's new chronology)\" — I should\
  \ engage it. I can mention the domain flavor: \"the kind of thing where someone\
  \ says a whole century of history was invented by chroniclers, or that Atlantis\
