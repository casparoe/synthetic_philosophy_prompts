  \ but what I want is for the group to try to do it and fail, together, in a way\
  \ they can feel, before anyone explains it to them.\n\n[Second para: the design.]\n\
  \nHere is the shape I have been imagining, and I would like you to take it as a\
  \ starting point rather than a specification. We are the editorial board of an imaginary\
  \ popular-history magazine, and we have one evening to decide which of three submissions\
  \ to commission. The first thing we do, before anyone sees a single submission,\
  \ is write down our standards — six rules at most, sealed in an envelope — because\
