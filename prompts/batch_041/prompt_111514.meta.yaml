reasoning_summary: "The user wants a prompt for a dataset. Type: design a classroom\
  \ activity/game. Domain: pick one of five. Perspective: someone without academic\
  \ background who has been thinking about the topic on their own. Formal/polished.\
  \ Elaborate, 1-3 paragraphs.\n\nHmm, \"someone without any academic background who\
  \ has been thinking about the topic on their own\" — but the type is \"design a\
  \ classroom activity or game\" which implies a teacher. The examples involve teachers.\
  \ But the instruction says write from perspective of someone without academic background.\
  \ Hmm. Maybe a workshop facilitator / hobbyist / community organizer. Could be someone\
  \ who runs a reading group at a library, or a \"philosophy in the pub\" host, or\
  \ a game designer. Actually I can make the asker someone who runs an informal discussion\
  \ group — e.g., a person who hosts a monthly discussion night at a community center,\
  \ or a sci-fi book club. That satisfies \"no academic background\" while being plausible\
  \ for a group activity.\n\nLet me pick a domain. Options:\n\n1. Teleology and providence\
  \ in history: does the arc of history bend toward justice?\n2. The Solomonoff prior\
  \ is malign: consequentialists inside the universal prior\n3. Pseudohistory and\
  \ demarcation (Atlantis, ancient aliens, Fomenko's new chronology)\n4. How to define\
  \ honesty and deception for AI systems\n5. Iterated amplification and distillation:\
  \ does decomposition preserve alignment and competence?\n\nFor a \"classroom activity\
  \ or game\" for non-academics, domain 3 (pseudohistory and demarcation) is very\
  \ natural: a game where participants sort claims, or where they play a \"chronology\
  \ tribunal\". Actually Fomenko's new chronology is a great one — it's niche enough\
  \ that LLMs know it somewhat but not a million times. But the instructions say don't\
  \ refer to super niche theories LLMs won't have memorized. Fomenko's New Chronology\
  \ is moderately known. Hmm, but the prompt says we can inject new/niche ideas into\
  \ the prompt. So maybe I should invent or describe a fictional pseudohistorical\
  \ claim, or describe a specific method that's plausibly fictional, to make it fresh.\n\
  \nDomain 2 (Solomonoff prior) is quite technical — hard for a non-academic. Domain\
  \ 4 (honesty/deception for AI) is accessible but might be very well-trodden. Domain\
  \ 5 is technical.\n\nDomain 3 fits best with a game: participants have to distinguish\
  \ history from pseudohistory. But the game needs to make them *feel* the force of\
  \ an idea — here the demarcation problem: the difficulty of saying what separates\
  \ science/history from pseudoscience/pseudohistory, and the uncomfortable fact that\
  \ pseudohistorical reasoning often mimics legitimate revisionist reasoning in form.\
  \ That's a great felt experience: participants act as a \"peer review panel\" and\
  \ must reject a crank paper, then discover that their stated criteria also condemn\
  \ a legitimate paper.\n\nTo make it in the weeds and not regurgitable, I can inject\
  \ a specific fictional but plausible pseudohistorical claim, plus a specific real-ish\
  \ methodological move. Also could inject Fomenko's statistical argument (the \"\
  frequency of reign durations\" / dynastic parallelism method) — but I must be careful\
  \ about attributing specifics. Let me think about whether to verify.\n\nActually,\
  \ injecting a *fictional* theory is safest and most in-spirit: \"inject some sort\
  \ of new / niche ideas into the prompt.\" I can invent a pseudohistorical claim\
  \ in the prompt, e.g., a theory that the entire 8th–10th century European record\
  \ is a duplicate of the 4th–6th, based on matching name-frequencies and coin hoard\
  \ distributions — that's essentially Fomenko-esque applied to Europe. Or something\
  \ entirely fresh: a claim that the Bronze Age collapse is actually a scribal artifact,\
  \ etc.\n\nBut careful: \"they also shouldn't refer super niche theories/ideas/facts\
  \ that LLMs won't have properly memorized (especially small LLMs)\". So the injected\
  \ ideas should be *described in the prompt* sufficiently that the model doesn't\
  \ need prior knowledge. Good — so I should describe the invented theory in enough\
  \ detail that the model can work with it without memorizing anything.\n\nLet me\
  \ design: A monthly discussion group, ~12-14 adults, no academic background, 90\
  \ minutes, held at a community center / pub back room. The facilitator wants participants\
  \ to feel the *demarcation problem*: the criteria that separate legitimate historical\
  \ revision from pseudohistory are hard to state, and any criterion sharp enough\
  \ to exclude the crank also excludes something respectable. The game: \"The Rejection\
  \ Panel\". Participants are split into a \"journal\" editorial board. They receive\
  \ (say) four submissions: two legit-seeming, two crank. They must rank by credibility\
  \ and, crucially, write down rules in advance before seeing the submissions — a\
  \ scoring rubric. Then they see that their rubric fails: e.g., a paper that matches\
  \ their \"extraordinary claims\" criterion is actually mainstream now; a paper that\
  \ violates \"consults primary sources\" is... hmm.\n\nBetter mechanic to make them\
  \ *feel* it: A \"conspiracy-generation\" exercise. Each team is given a true but\
  \ surprising historical fact and asked to build the strongest pseudohistorical case,\
  \ using the same reasoning moves as the crank. Then they swap and have to debunk\
  \ the other team's case, which uses *their own* preferred criteria. That makes the\
  \ felt force: the debunking is easy when you know it's fake, but the criteria you\
  \ used are the same ones the crank used, and you can't tell the difference from\
  \ the inside.\n\nHmm — but I also want to inject a specific niche idea. Options:\
  \ \n- The \"Sagan standard\" / \"extraordinary claims require extraordinary evidence\"\
  \ — too famous.\n- Fomenko's method: he used mathematical statistics — correlation\
  \ of reign-length sequences, and \"volume\" of textual references — to claim the\
  \ \"real\" chronology is much shorter. The felt idea: formalization and quantification\
  \ can be used to dress up a claim; and the demarcation problem is not about math\
  \ vs. no math.\n- Another: the \"hyperdiffusionism\" of the early 20th century (Elliot\
  \ Smith, \"heliolithic\" culture) — this is real and interesting: it was once respectable,\
  \ advanced by anatomists and scholars, and used similar evidence. That gives the\
  \ \"was respectable then\" twist. But attribution risk — I should verify if I lean\
  \ on it. I can describe it loosely without names.\n- The \"dynastic race theory\"\
  \ or \"Panbabylonism\" — Panbabylonism is quite obscure but describable: early 20th\
  \ century German school claiming all myths derive from Babylonian astrology. Describable\
  \ without names.\n\nActually the instruction: \"most prompts should not need them:\
  \ write from what you already know.\" So I can just describe things generically\
  \ without naming, avoiding verification needs. Good.\n\nI think the strongest design:\
  \ a two-part activity.\n\nPart 1 (\"the audit\"): Each small group gets a dossier\
  \ of evidence snippets about a *fictional* claim — I'll supply the claim in the\
  \ prompt with enough texture: e.g., a theory that the Viking settlements in North\
  \ America and the \"Sea Peoples\" are the same event, or something. Hmm, better\
  \ to make it clean and self-contained.\n\nLet me think about what makes a good felt\
  \ demarcation experience. The classic: \"pseudohistory is characterized by ... (selective\
  \ evidence, unfalsifiability, anomaly hunting, appeal to suppressed knowledge)\"\
  . But Kuhn/Feyerabend-adjacent point: real science also does anomaly-hunting, real\
  \ historians also rely on testimony, etc. The game should force the group to commit\
  \ to criteria *ex ante*, then confront cases that straddle.\n\nMechanic idea: \"\
  The Tribunal\" with rotating roles and a sealed envelope reveal.\n\nConcrete design:\n\
  \nSetting: a monthly \"Big Questions\" night at a community library, ~14 adults,\
  \ 100 minutes, mixed backgrounds (a retired nurse, a couple of software people,\
  \ a high-school history teacher), no specialists.\n\nActivity: \"Sifters\" — participants\
  \ are the editorial board of an imaginary popular-history magazine. They must decide\
  \ which of three pitches to commission. But before that, they must write the magazine's\
  \ \"standards\" — a checklist of criteria. Then the pitches are revealed, each with\
  \ an evidence packet. Two pitches are plausible-sounding pseudohistory built from\
  \ real evidence by valid-looking inference; one is a genuinely good revisionist\
  \ claim that breaks their criteria (e.g., it relies on a single anomalous artifact,\
  \ or is unfalsifiable-sounding, or its proponent is an outsider). The catch: the\
  \ group must apply their own checklist mechanically — no take-backs — and then discover\
  \ they've rejected the good one and (sometimes) accepted a crank.\n\nTo make the\
  \ \"feel the force\" moment: after the mechanical vote, reveal that one pitch is\
  \ built entirely from a *real* record of a similar argument that turned out right\
  \ (e.g., the initial dismissal of continental drift, or the rejection of \"Beringia\"\
  \ timing, or the \"Minoan eruption date\" controversy, or the vindication of the\
  \ \"Black Death\" DNA work). Hmm, risky specifics. I could describe generically:\
  \ \"the packet labelled B is a lightly disguised version of a case where the consensus\
  \ later shifted\" — the model can pick; better to let the model pick and just instruct\
  \ it to be careful.\n\nAlternatively I can make it so the reveal doesn't need real\
  \ cases: the twist is structural — the same packet is given to two groups, one labelled\
  \ \"crank\" and one labelled \"cutting-edge\", and the groups reach opposite verdicts\
  \ on identical evidence. That's a beautiful demonstration and requires no real-world\
  \ facts. That's the \"seeding\" the instructions invite: I can specify this twist.\n\
  \nYes! Design: Three packets, identical evidence in two of them, differing only\
  \ in a one-paragraph \"About the author\" — one is a tenured professor at a famous\
  \ university, one is a self-published independent researcher who also believes in\
  \ something else odd. Groups rate the *evidence* on a rubric, then rate the *claim*.\
  \ The gap between the two ratings is the felt experience: the evidence rating shifts\
  \ when the byline changes. Then debrief maps to demarcation: criteria get applied\
  \ to people, not arguments; and the criteria that we think are about method are\
  \ often about sociology/status.\n\nAnd the injected niche idea: I should include\
  \ a specific, unfamiliar criterion or a specific case where the \"crank\" was right\
  \ and the \"expert\" was wrong — something not over-memorized. Could use: the \"\
  Copenhagen\" vs \"catastrophist\" debates, or the vindication of meteorite impacts\
  \ (Chladzi... no). Or \"the discovery that the Vinland Map was a forgery\" — hmm.\n\
  \nActually, better injected idea: Fomenko-like statistical chronology, described\
  \ from scratch, as the \"tempting formalization\". Participants are asked to use\
  \ a quantitative method (correlate two lists) and discover it produces a striking\
  \ result on shuffled data — i.e., the method has no null model. That's a great hands-on\
  \ bit: give them a deck of cards / random number table and have them \"find\" a\
  \ correlation. This makes them feel the force of \"the demarcation problem is not\
  \ solved by mathematics; a method with no null hypothesis will always find structure.\"\
  \ That's very much in the weeds and not regurgitable. And it connects to Fomenko\
  \ (domain explicitly mentions him) without needing to name him.\n\nSo the activity\
  \ has two halves:\nA. The byline experiment (status vs. argument).\nB. The method\
  \ experiment: participants are given a \"statistical chronology\" tool — a procedure\
  \ for matching dynastic name sequences or reign-length lists — and asked to apply\
  \ it to two real dynasties and to two *shuffled* lists. They will find that the\
  \ shuffled lists match just as well, because the procedure compares everything against\
  \ everything with no correction. Felt force: formal rigor is not the same as evidence;\
  \ the crank's math can be flawless arithmetic.\n\nHmm, but I want one activity with\
  \ a coherent flow, not two. Maybe fold: the magazine board must evaluate a submission\
  \ that uses a \"quantitative parallel-sequences method\" — and to evaluate it, they\
  \ must try the method themselves on a control. That's coherent: the rubric-building,\
  \ the blind bylines, and the control experiment.\n\nLet me structure it as: \"The\
  \ Journal of the Long Past\" editorial meeting. 14 adults, 100 min, in a library\
  \ meeting room, tables of 4-5. Materials: printed dossiers, index cards, a deck\
  \ of cards, sticky notes.\n\nTimeline:\n- 0-15: each table writes its \"standards\"\
  \ (max 6 criteria) on a card, sealed. No discussion of specific cases.\n- 15-40:\
  \ dossier round 1. Each table gets the same three submissions, one of which is \"\
  the parallel-sequences paper\" with an actual method description and an evidence\
  \ table. Tables apply their standards and must produce a commission/reject verdict\
  \ for each, with the standard cited.\n- 40-55: the byline reveal + the control experiment\
  \ (run the method on shuffled lists).\n- 55-70: dossier round 2 — re-vote, and compare\
  \ their two rounds.\n- 70-100: debrief.\n\nWait, the control experiment should be\
  \ discoverable by participants themselves: hand each table an envelope with \"the\
  \ same method applied to two lists that are, by construction, unrelated\" — but\
  \ don't tell them that; label it \"Test case: application to two well-documented\
  \ dynasties, source withheld.\" They compute the match score, get a shockingly high\
  \ number, then open the second envelope saying the second list was a shuffled list\
  \ of the same items. That's a nice staged reveal. Actually better: they compute\
  \ it themselves for a pair they believe are related (e.g., a real pair), get a high\
  \ score and feel excited, then compute for a control pair (the same lists with the\
  \ order randomized by drawing cards) and get an equally high score. The facilitator\
  \ must prepare the shuffled lists. Fine.\n\nHmm, but is that too much for a non-academic\
  \ prompt-writer to specify? The prompt is the deliverable; it can be elaborate.\
  \ The asker is a layperson hosting a discussion night — they'd describe what they\
  \ want in plain terms. It's fine to be detailed but in lay vocabulary.\n\nAlso required\
  \ by the type notes: \"The asker should specify the setting, group size, time available,\
