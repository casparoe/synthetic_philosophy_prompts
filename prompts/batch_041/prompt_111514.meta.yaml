  \ rewrite of chronology — but then I'd be leaning on Fomenko attribution. I can\
  \ avoid the name and describe it: \"a self-taught mathematician in the Soviet Union\
  \ in the 1970s who claimed the written record was massively duplicated and that\
  \ his proof was statistical.\" That's describing without naming; is the description\
  \ accurate? Fomenko is a real mathematician, Soviet, 1970s-80s, claimed the \"new\
  \ chronology\" with statistical methods. I'm fairly confident. But the instruction\
