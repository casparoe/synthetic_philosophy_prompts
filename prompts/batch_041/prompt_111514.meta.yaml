  \ bibliographies/citations requests — fine. Avoid asking for reading lists. Good.\n\
  \nLet me draft the final text.\n\n---\n\nDraft:\n\nI run a monthly discussion night\
  \ in the community room of our public library. We are fourteen or so adults — no\
  \ researchers among us, though there is a retired surveyor, two nurses, a high-school\
  \ history teacher who mostly does administrative work now, and a man who has read\
