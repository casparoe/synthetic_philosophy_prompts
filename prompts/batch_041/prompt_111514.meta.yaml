  \ frank note. So the ask should request those explicitly.\n\nAlso should I ask them\
  \ to design the actual dossier contents? Yes: \"write the actual dossiers\" — but\
  \ that makes it long. I'll ask for the submissions in summary form (the evidence\
  \ bullets), which is reasonable.\n\nAlso, note: the asker is a layperson, so they\
  \ may not know terms like \"demarcation problem\". Should they? The instruction\
