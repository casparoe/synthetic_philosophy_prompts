  \ over time and community scrutiny — which the activity can't reproduce. Good.\n\
  \nAlso, I should include the requested elements: \"what will predictably go wrong\
  \ the first time I run it\" — include in the ask.\n\nAlso, small LLMs: avoid jargon-heavy\
  \ references. Use plain language.\n\nLet me also consider adding a rule that participants\
  \ must not be told the point. And a \"no lecture up front\" analog.\n\nLength: 3\
  \ paragraphs, fairly long. Let me draft.\n\nDraft:\n\n\"I host a monthly discussion\
  \ night at our public library — about fourteen adults, no one with a research background,\
  \ though a few are retired teachers and one is a local archivist; we meet in the\
  \ community room for a hundred minutes and the group is used to being put to work\
