  The color phi phenomenon: Dennett''s discussion in Consciousness Explained, chapter
  6, "Time and Experience". He distinguishes Orwellian revision (the memory of the
  experience is revised after the fact) vs Stalinesque revision (the experience itself
  is delayed and constructed after the fact, with a "show trial" where the actual
  events are hidden and a fabricated narrative is presented). The color phi phenomenon:
  two dots flashed, one at position A, then another at position B, with the second
  dot a different color. Subjects report seeing the dot move from A to B and, crucially,
  report seeing the color change midway — before the second dot is even presented.
  Dennett argues this shows that the "filling in" of the intervening motion and the
  color change must be either Orwellian (memory revised after) or Stalinesque (experience
  delayed), and that there''s no fact of the matter distinguishing them because both
  are cases of post-hoc revision. He argues the distinction between Orwellian and
  Stalinesque is not empirically discoverable — the "presentation" is all there is.


