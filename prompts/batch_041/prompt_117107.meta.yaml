  Let me think about the content of the desiderata for a theory of dispositions.


  The area: "a theory of dispositional properties / of disposition ascriptions" —
  e.g., what makes it true that a glass is fragile, that a sugar cube is soluble,
  etc. A theory has to:


  1. Get the core cases right: the glass is fragile even when it never breaks; solubility
  is present when dry.

  2. Handle finks: an external agent (or internal change) that would prevent the manifestation
  upon the trigger (a sorcerer who would make the glass unbreakable if struck; a fragile
  glass that becomes non-fragile exactly when struck). The simple conditional analysis
  ("x is fragile iff if x were struck, x would break") fails because the fink case:
  the glass is fragile but would not break if struck (because of the fink). So the
  analysis gets the wrong answer. A theory must say the glass is still fragile.

  3. Handle masks: an external agent that prevents the manifestation without removing
  the disposition (a sorcerer who would catch the glass; a glass wrapped in packing
  material). The glass is fragile but wouldn''t break if struck. Again the conditional
  fails.

  4. Handle mimics: an object that is not fragile but would break if struck (because
  a sorcerer would shatter it upon striking). The conditional says it''s fragile;
  a theory must say it isn''t.

  5. Reverse cases / reverse-cycles: dispositions that manifest only if *not* triggered,
  or that prevent their own manifestation. E.g., a "reverse-fink": an object that
  would become fragile only if struck (so if struck it breaks, but it''s not fragile
  before). The conditional says fragile; theory must say not fragile (or handle it).

  6. The relation to counterfactuals: a theory must say what the connection is (entailment?
  mere correlation? the disposition grounds the counterfactual?). And handle the "would"
  vs "might" and the context-sensitivity of the counterfactual.

  7. Intrinsicness: is fragility intrinsic to the glass? Some say yes; but if the
  disposition''s manifestation depends on external masks/finks, can it be intrinsic?
  The "intrinsicness" desideratum vs. the "disposition ascriptions are analysable
  by counterfactuals" desideratum — tension.

  8. The disposition/categorical distinction: must the theory preserve the distinction,
  or is it a false dichotomy? The "categoricalist"/"Humean" says dispositions reduce
  to categorical bases; the "dispositionalist" says they don''t. Is preserving the
  distinction a desideratum?

  9. Causal efficacy: dispositions must be causally efficacious (the fragility causes
  the breaking); a theory must not make them epiphenomenal. But also must not make
  them "occult powers."

  10. The connection to laws of nature: dispositions and laws (the "governing" vs
  "dispositional essentialist" view).

  11. The possibility of ungrounded/"bare" dispositions, and of dispositions with
  no possible manifestation (e.g., a disposition to do something impossible).

  12. Probabilistic/indeterministic dispositions: a radioactive atom''s disposition
  to decay.

  13. Multi-track dispositions: a disposition that manifests in different ways.

  14. The "always-manifesting" dispositions: e.g., mass (a disposition to resist acceleration)
  that manifests whenever it exists.

  15. The epistemology: how we know about dispositions.

  16. Consistency with physics: e.g., the "categorical" properties of fundamental
  physics (charge, mass, spin) — are they dispositions or categorical? A theory must
  be consistent with fundamental physics.

  17. The "finkish" problem for any "pure disposition" ontology: if dispositions are
  the fundamental properties, and there are finks/masks, then the manifestation isn''t
  guaranteed — so the dispositional essentialist must say the manifestation is part
  of the essence but then finks are impossible? Tension.


  Then the "jointly unsatisfiable" part: e.g., (a) dispositions are intrinsic and
  (b) disposition ascriptions are equivalent to counterfactuals that depend on external
  conditions (masks/finks) — these conflict. Or (a) dispositions are the fundamental
  properties (dispositional monism) and (b) finks and masks are possible — these conflict
  (if the essence of a disposition guarantees its manifestation, finks are impossible;
  but finks seem possible). Or (a) dispositions are causally efficacious and (b) dispositions
  are reducible to categorical bases with their own causal powers — conflict.


  Then which requirement excludes the most theories: probably the "handle finks and
  masks without ad hocery" or "the disposition is intrinsic" or "dispositions are
  causally efficacious."


