  Tolstoy''s theory (as I know it and as confirmed by the fetched article):

  - Rejects beauty as the criterion.

  - Art = the communication/infection (zarazhenie) of feeling. Art begins when someone,
  having once experienced a feeling, calls it up again in himself and expresses it
  in external signs so that others are infected by it. The receiver experiences the
  same feeling.

  - The strength of infection depends on (a) the greater or lesser individuality/peculiarity
  of the feeling, (b) the greater or lesser clarity of the transmission, (c) the sincerity
  of the artist, i.e., the degree to which the artist himself experiences the feeling
  he conveys. Sincerity is the most important, and it is the one condition always
  present in true art and its absence always producing counterfeit art.

  - Art is distinguished from non-art by infectivity, not by technique or beauty.

  - The conception of art is broad and amoral — any feeling, good or bad, if it infects,
  is art. But "good" art is judged by religious perception of the age: the feeling
  must conduce to the union/brotherhood of man (Christian art) or at least be universal,
  accessible to all, not partisan by class, nation, style.

  - Counterfeit art: borrowing, imitation, striking effects (effectfulness), and diversion
  (distraction) — these simulate the effect of art without infection.

  - Obscurity: art should be comprehensible to all; Tolstoy attacks the "charm of
  obscurity," euphemisms, allusions.

  - He rejects the upper-class notion of art as a pastime; art is a condition of life,
  a means of union.

  - He notoriously dismisses Beethoven''s late works, Shakespeare, Wagner, Dante,
  and most of his own work. Also he praises Dickens, Hugo, Uncle Tom''s Cabin, Schiller''s
  The Robbers, Dostoevsky''s House of the Dead, the story of Joseph in Genesis; universal
  feelings of mirth, tenderness, cheerfulness, peacefulness; in music he commends
  a Bach violin aria, a Chopin nocturne, selected passages of Schubert, Haydn, Mozart.


