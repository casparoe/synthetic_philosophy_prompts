  observer" argument — the former doesn''t require the veil and yields arbitrary positive
  weights; only the latter gives equal weights (utilitarianism proper). A common misrepresentation:
  "Harsanyi proved that utilitarianism follows from rational choice theory" — actually
  the theorem gives a weighted sum with arbitrary weights, which includes non-utilitarian
  ones; you need the additional assumption of identical preferences under the veil
  of ignorance (or equiprobability) to get equal weights.

  2. Confusing Harsanyi''s theorem with Arrow''s impossibility theorem — the summary
  might say Harsanyi showed that Arrow''s problem can be solved by extending preferences
  to lotteries. Actually there''s a relation: Harsanyi''s theorem uses cardinal/ordinal
  preferences over lotteries and avoids Arrow''s conditions — Arrow''s theorem requires
  the independence of irrelevant alternatives and no interpersonal comparability;
