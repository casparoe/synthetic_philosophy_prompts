  sum of individual utility functions (with non-negative weights). This is the "aggregation
  theorem." A common misreading: it shows utilitarianism is entailed — but weights
  are arbitrary and there''s no interpersonal comparability requirement in the usual
  formalization (which is a criticism: it''s "utilitarian" only in a thin sense).


