  I think Harsanyi''s aggregation theorem is nice: it''s genuinely in the weeds (not
  regurgitated much), and there are subtle things: Harsanyi''s theorem derives utilitarianism
  (weighted sum of individual utilities) from the assumptions of (i) individual preferences
  satisfying expected utility (von Neumann–Morgenstern) and (ii) the social preference
  being a weighted sum of individual utilities... Actually Harsanyi''s "aggregation
  theorem" is: if each individual''s preferences satisfy the vNM axioms and social
  preferences satisfy them too, and there''s a "social welfare function" satisfying
  the Pareto (weak) condition... Harsanyi derives that social utility is a weighted
  sum of individual utilities — where weights correspond to... The theorem has two
  parts: Harsanyi''s "impartial observer" argument (veil of ignorance, everyone''s
  preferences identical) giving equal weights, and the aggregation theorem giving
  weighted sum with arbitrary weights.


  Key subtleties to exploit in a plausible-but-wrong summary:

