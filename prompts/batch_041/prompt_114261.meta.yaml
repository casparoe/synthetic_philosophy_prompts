  Let me recall more carefully. Harsanyi''s 1955 paper "Cardinal welfare, individualistic
  ethics, and interpersonal comparisons of utility" (Journal of Political Economy).
  Two arguments:


  (A) The "impartial observer" / equiprobability model: A moral preference is what
  you''d have if you had an equal chance of being anyone in society; given Bayesian
  decision theory, you maximize expected utility = average utility. This is the "veil
  of ignorance" argument with equal probabilities (not Rawls''s maximin).


  (B) The aggregation theorem: if individual preferences and social preferences both
  satisfy the vNM expected-utility axioms, and social preferences satisfy the Pareto
  principle (weak Pareto: if everyone prefers A to B, society prefers A to B), then
  the social utility function is a weighted sum of the individual utility functions.
  Harsanyi noted weights reflect the relative "importance" of different individuals''
  interests, and one way to fix them is the equiprobability assumption, which gives
  equal weights.


  Common critiques: John Broome''s discussion; the "Harsanyi''s theorem doesn''t prove
  utilitarianism" — weights can be anything; also there''s a subtlety: the theorem
  is about the social welfare function being a positive weighted sum, and the "utilitarian"
  conclusion is only with equal weights. Also there''s a famous criticism (e.g., by
  Amartya Sen? or by "Harsanyi''s aggregation theorem and the Pareto principle") —
  the Pareto assumption in Harsanyi is applied to the individuals'' ex ante preferences
