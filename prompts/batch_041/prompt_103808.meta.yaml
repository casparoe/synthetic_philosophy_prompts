  I am a PhD student in philosophy of biology, and I keep running into a puzzle about
  what taxonomic practice commits us to. I would like you to work out the implicit
  metaphysics of a cluster of nomenclatural conventions, rather than to tell me what
  taxonomists say about species concepts.


  Here is the practice. The codes that govern the naming of animals, plants, fungi,
  and bacteria require that every scientific name at the species level be permanently
  attached to a type — normally a single preserved specimen, though an illustration,
  a culture, or (in bacteriology) a published description can serve in its place.
  The type is explicitly described by the codes as name-bearing only: it is not required
  to be a typical member of the species, and it may be an aberrant, juvenile, or deformed
  individual; the codes are careful to say that they regulate names and leave the
  delimitation of taxa to the taxonomist''s judgment. When a species is later divided
  into two, the original name stays with whichever lineage contains the type, even
  if that lineage is the smaller, less familiar, or less representative one, and the
  other lineage must receive a new name. Priority of publication decides which of
  two names is correct, and a commission can vote to set priority aside and conserve
  a familiar name for the thing that has long been called by it. And in current work,
  names are increasingly applied by matching short DNA sequences to reference libraries,
  and occasionally new species are proposed from photographs or from sequences alone,
  with no voucher specimen preserved anywhere.


