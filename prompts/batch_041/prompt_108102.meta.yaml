  I am a novelist, and I have been asked to open a symposium on how fiction means
  things with a short statement of first principles. I would like an audit of my position
  before I commit it to print, because I have a suspicion that I assembled it from
  incompatible sources and would rather learn that now than from the audience.


  Here is the position.


  1. Nothing written is meaningful in itself. Marks on a page become a message only
  relative to a decoder and relative to a world the message can be mapped onto; meaning
  lives in that mapping, not in the ink.


