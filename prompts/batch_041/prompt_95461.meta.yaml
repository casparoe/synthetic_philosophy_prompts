  Aumann''s agreement theorem is quite rich and nicely formal. The decision tree could
  start from "Two agents disagree after discussing; both are Bayesians." Branch nodes:
  Do they share a common prior? Is the disagreement common knowledge? Are they logically
  omniscient / can they compute the same consequences? Are the partitions the same
  refinement... Actually key branch questions:


  1. Does the disagreement persist after the agents'' posteriors become common knowledge
  (i.e., after each announces their posterior)? If yes → something in the theorem''s
  assumptions must fail.

  2. Which assumption fails? Options: (a) common prior; (b) common knowledge of each
  other''s posteriors/rationality — i.e., the disagreement isn''t fully "out in the
  open"; (c) perfect rationality / logical omniscience (agents can''t compute); (d)
  the agents'' information is partitional (no non-partitional information, no unawareness
  — e.g., unawareness breaks the theorem: "agreeing to disagree with unawareness");
  (e) truth-aimed Bayesianism itself (agents who aren''t expected-utility maximizers
  about truth, e.g., prefer to disagree, or "practical" reasons); (f) the "Aumannian"
  framework of common knowledge is the wrong idealization entirely (deflationary/instrumentalist:
  the theorem tells us about an ideal nobody occupies).


