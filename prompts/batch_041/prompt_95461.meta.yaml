  and say briefly whether that is because the view is incoherent, unattractive, or
  simply unexplored; flag any pair of leaves the tree cannot separate and say what
  further question would be needed to pull them apart. Close with a paragraph on what
  the tree implies for the move I started with — when, if ever, it is legitimate to
  tell a colleague that the theorem obliges them to agree with you."


