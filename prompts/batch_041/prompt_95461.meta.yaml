  "I run a fortnightly reading group for graduate students in economics and philosophy
  who have all seen the statement of Aumann''s agreement theorem once and remember
  the punchline. The recurring frustration is that the theorem gets used as a conversation-stopper:
  whenever two of us disagree about something quantitative, someone says that if we
  were both rational Bayesians with a shared prior and our credences were common knowledge,
  we couldn''t disagree, so at least one of us must be failing to be rational. I want
  to replace that move with a proper diagnostic instrument.


