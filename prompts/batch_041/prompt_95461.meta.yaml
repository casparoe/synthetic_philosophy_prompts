  is supposed to cover and ends at a named position on where the pressure to agree
  actually fails. Fix the starting point as follows: two people assign different credences
  to the same proposition, each has publicly stated their credence, each knows the
  other has heard and understood the statement, and they still disagree. The root
  of the tree is what follows from that; the first few branch nodes should be questions
  about this and similar concrete situations, phrased so that a reader can answer
  them without knowing which position they lead to — no node may be ''do you accept
  the common prior assumption?''


  Build the tree from the assumption space first, not from a list of names: a shared
  prior; common knowledge of each other''s credences and of each other''s rationality;
  logical omniscience, or at least the ability in principle to check each other''s
  reasoning; the parties'' being Bayesians who want to get the proposition right rather
  than to hold a convenient belief; and the presupposition that both are assigning
  credence to one and the same proposition on one and the same state space. Denying
  each of these should generate a family of positions; the leaves are where the actual
  views sit, labeled descriptively rather than by author name (we won''t be looking
  anything up), each with one sentence on its most awkward commitment.


  The following cases must each do work somewhere in the tree, and it should be clear
  which node they are there to settle:

  - two people who share a prior, one of whom has strictly more information than the
  other, and who still disagree (is this a counterexample to the theorem, or a sign
  that the theorem is being misread?);

  - two mathematicians who disagree about an unproved conjecture, each convinced the
  other''s argument contains an error neither can locate;

  - two people who disagree about whether a policy worked, where one of them does
  not know that a subgroup exists which the other is talking about, or is using a
  different vocabulary for the same subject matter;

  - two people whose disagreement is privately resolvable but who have reasons not
  to disclose what would resolve it, so the public standoff persists.


