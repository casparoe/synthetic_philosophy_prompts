  agreement pressure." "Common knowledge failure — the disagreement is real because
  you can''t get to common knowledge (e.g., you can''t verify the other''s reasoning)."
  "Bounded rationality / logical non-omniscience — Aumann requires that each can simulate
  the other; without it agreement isn''t forced (and there are results showing disagreement
  is rational with computational limits — e.g., ''the value of disagreement,'' the
  ''Garrabrant'' / logical induction angle)." "Unawareness / non-partitional information
