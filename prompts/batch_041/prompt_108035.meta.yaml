  Case: "Ruth, 58, was diagnosed with early-onset Alzheimer''s four years ago. Two
  years before her diagnosis — after nursing her own father through the last years
  of his dementia — she signed a notarized advance directive stating that if she ever
  developed dementia severe enough that she no longer recognized her family, she wanted
  no life-prolonging treatment, including antibiotics, artificial nutrition, or hospitalization,
  and that she wanted to be kept comfortable at home. She discussed it with her two
  children at the time and was, by all accounts, clear and unambivalent. She is now
  in the moderate-to-severe stage. She does not reliably recognize her daughter, though
  she is often cheerful, enjoys music and pudding, and — when she has a UTI — swallows
  her antibiotics without protest and says she wants to feel better. She is, by her
  physicians'' judgment, not competent to make medical decisions. She now has aspiration
  pneumonia. Antibiotics would probably resolve it; without them she will likely die
  within a week or two, though not necessarily uncomfortably if she''s kept sedated
  and comfortable. Her son wants to follow the directive and keep her at home with
  comfort care. Her daughter wants to treat the pneumonia, arguing that her mother
  is happy and doesn''t seem to be suffering, and that the person who signed that
  document isn''t the person sitting in that chair.


  Question: (a) Reconstruct the two most prominent positions on whether an advance
  directive of this kind retains its authority after the person who wrote it has lost
  the capacities that made her autonomous, and (b) say how each would resolve Ruth''s
  case and what the disagreement between them actually turns on. Be explicit about
  what work the idea of the earlier self is doing in each position."


  Good. That''s the question, self-contained.


  Student answer (mixed, ~300-380 words):


  "Both positions agree that an advance directive is an exercise of autonomy, but
  they disagree about whose autonomy counts.


  On the precedent-autonomy view, associated with Dworkin, we distinguish between
  experiential interests — interests in having pleasant experiences and avoiding pain
  — and critical interests, which are interests in having a life that goes well as
  a whole, and which depend on the person''s own convictions about what makes life
  worth living. Ruth''s directive expresses a critical interest: she had a considered
  view about what kind of life she could tolerate. Because critical interests are
  the ones that give a life its shape, they don''t evaporate when someone loses the
  capacity to hold them in mind; the earlier Ruth, so to speak, outlives the later
  one for the purposes of authority. On this view, the directive governs, and Ruth
  should stay at home with comfort care. The daughter''s argument — that Ruth is cheerful
  and enjoys her pudding — appeals to experiential interests only, and that is exactly
  the kind of consideration this view says cannot be decisive.


  On the current-welfare view, defended by critics of precedent autonomy, the person
  in the chair now is the patient, and what matters is her present experience. The
  earlier self''s preferences are, at best, evidence of what the later self would
  want; they don''t bind her, because the authority to direct one''s treatment is
  an authority that belongs to a competent person, and Ruth is no longer competent.
  Her daughter is right that the woman who signed the document is not the woman who
  now reaches for the spoon. The current-welfare view would treat the pneumonia, since
  Ruth is not distressed and antibiotics will let her go on having the experiences
  she currently enjoys.


  The disagreement turns on personal identity. If we accept a Parfitian picture on
  which psychological continuity comes in degrees, Ruth''s earlier and later selves
  are not the same person, so the earlier self has no more authority over the later
  one than a stranger would; the current-welfare view is what you get if you take
  that seriously. If instead we think the person persists, the directive binds. I''d
  add that the directive is a refusal of treatment rather than a request for it, and
  refusals and requests have the same standing in advance care planning, so Ruth''s
  document is enforceable on either view. My conclusion is that the case really can''t
  be decided without settling the metaphysics of personal identity first."


  That''s a good mixed answer. Errors:

  1. "the earlier self, so to speak, outlives the later one" — fine-ish, but the claim
  that critical interests "don''t evaporate" is a reasonable rendering. OK.

  2. Making the whole disagreement turn on personal identity (Parfit) — non-sequitur/overstatement:
  the debate is normative (whose autonomy has authority; can a competent person bind
  her future self), and one can accept continuity and still deny authority (or deny
  continuity and still affirm authority via promises/self-determination/advance planning).
  Also overstates Parfit: for Parfit, identity isn''t what matters; discontinuity
  doesn''t automatically strip authority. That''s the subtle step that doesn''t follow.

  3. "The earlier self''s preferences are, at best, evidence of what the later self
  would want" — this is a mischaracterization of the current-welfare view''s structure?
  Hmm, that phrasing is more like a "substituted judgment" reading; critics of precedent
  autonomy generally don''t treat the directive as evidence about the now-self''s
  wants — they emphasize the now-self''s independent interests, and some argue the
  directive has *some* weight as evidence of what the patient would have wanted. It''s
  arguably okay. Maybe leave it, or better plant the substituted-judgment/best-interests
  conflation explicitly: have the student say "if a directive is silent, clinicians
  use substituted judgment — deciding what''s best for the patient in her current
  condition — and this is the same test as best interests." That''s a clean conflation.
  Let me insert it, replacing/augmenting: e.g., "Note that where a directive is silent
  about a particular intervention, the standard move is substituted judgment, i.e.,
  asking what would be in the patient''s best interests right now; that''s why the
  daughter''s appeal isn''t frivolous." Yes — that''s a conflation of substituted
  judgment (what the patient would have wanted / would choose) with best interests
  (what is objectively good for the patient), and it also muddles the fact that substituted
  judgment looks to the patient''s values, often including the earlier self''s.


  Hmm, careful: some literature treats substituted judgment as "what the patient would
