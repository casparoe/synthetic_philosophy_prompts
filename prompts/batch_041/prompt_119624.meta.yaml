  population describe themselves, behave, or present to clinicians.

  Loop-Responsive — the classification changes the vocabulary people use about themselves,
  but does not change measured prevalence or symptom profile.

  Loop-Generative — the classification substantially amplifies or produces the very
  condition it purports to describe.


  Under the current rule, only the first two bands are admissible. A Loop-Generative
  rating is an automatic bar to admission. The rationale, as minuted at the time,
  was that a category which helps produce its own instances cannot be tracking anything
  that was there before the classification, so prevalence estimates, natural-history
