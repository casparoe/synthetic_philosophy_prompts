  The surprise exam (surprise quiz / unexpected hanging) paradox: Teacher announces
  a quiz next week that will be unexpected. Students reason it can''t be Friday (if
  no quiz by Thursday, they''d expect it Friday → not unexpected), then can''t be
  Thursday, ..., so can''t be any day. Teacher gives quiz Wednesday; students are
  surprised. The standard resolutions: (a) the backward induction is invalid because
  the students'' "knowledge" at each step depends on the announcement''s reliability,
  and by the time they reach Friday they''d have derived a contradiction, so one of
  their premises must be false — but which? (b) The announcement is self-referential
  / the notion of surprise is about the students'' epistemic state, which the students
  can influence; if they genuinely believe the exam won''t happen, then the exam on
  any day is a surprise, so the announcement is consistent. (c) The backward induction
  step at Friday: the students reason "if no quiz by Thursday, it must be Friday,
  so it wouldn''t be a surprise, so it can''t be Friday." But that reasoning requires
  trusting the announcement that there *will* be a quiz. If the announcement is trustworthy,
  then yes Friday would be predictable. The standard "resolution": the students''
