  Question draft:


  "Question 3 (25 points). In this unit we proved the Gibbard–Satterthwaite theorem
  for social choice functions on strict preferences.


  (a) State the theorem, being explicit about every condition it places on the voting
  rule and on the number of voters and alternatives.

  (b) Define strategy-proofness and explain, in your own words, why the theorem is
  bad news for anyone trying to design a voting rule that can''t be gamed.

  (c) Is there any way out? Discuss at least two proposed escapes from the theorem
  (e.g. restricting which preference profiles are allowed, or letting voters report
  more than a ranking) and say whether you think each one works."


  Student''s answer draft (needs to be well-written, mixed):


  "3(a). Gibbard–Satterthwaite says: if there are at least three alternatives and
  at least two voters, then any voting rule that is strategy-proof must be dictatorial.
  (A rule is dictatorial if there is some voter whose top-ranked alternative is always
  the winner, whatever everyone else reports.) So with three or more options, the
  only rule that can''t be manipulated is one where a single voter gets their way
  every time.


  3(b). Strategy-proofness means no voter can ever do better by reporting a ranking
  other than their true one, no matter what the other voters report — i.e., reporting
  truthfully is a weakly dominant strategy. Equivalently, truthful voting is a Nash
  equilibrium of the game the rule induces: since nobody can gain by lying, everyone
  votes their real preferences, so the winner is the one the rule would pick from
  the true profile. This is why the theorem hurts: manipulability isn''t a design
  flaw of particular rules like plurality or Borda, it''s built into the whole setup.
  Any rule you write down that satisfies the theorem''s conditions is either gameable
  or a dictatorship, so the choice is between manipulation and a single voter deciding
  everything.


  3(c). Two escapes. First, we can restrict the domain of allowed preferences. If
  preferences are single-peaked — everyone agrees on a left-right ordering of the
  alternatives and each voter''s favourite is their peak — then the median voter rule
  (elect the peak of the median voter) is strategy-proof and not dictatorial, so the
  theorem doesn''t apply. Second, we can let voters report more than their ranking.
  GS is a theorem about rules that take rankings as input, so if the rule can look
  at cardinal utilities, e.g. by electing whichever alternative maximises the sum
  of reported utilities, we are outside the theorem''s scope, and that rule is not
  dictatorial. So the theorem doesn''t rule out good voting rules after all; it just
  rules out good rules of the ranking-only kind."


