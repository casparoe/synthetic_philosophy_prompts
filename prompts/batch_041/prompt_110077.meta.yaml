  Draft:


  I teach a final-year undergraduate seminar on decision theory and multi-agent systems,
  twenty students, one ninety-minute session. I want an activity that makes them feel
  the force of the commitment-race dynamic — the way a set of agents who would each
  prefer a negotiated division to a fight, and each prefer winning to losing, can
  be driven by the sheer availability of binding commitments into an outcome worse
  for all of them than what they could have had — without my having to say the words
  "commitment race" until the debrief.


  I have a rough mechanism and I want you to build the activity around it, or around
  a better one, but not to treat mine as fixed. The pool: a fixed pot of a hundred
  points that three teams claim against one another; each round, teams play commitment
  cards of graded strength, publicly and in an order drawn at random that round; a
  team''s claim on the pot is fixed by the strongest card it has played and cannot
  be withdrawn without a penalty; if the total claims exceed the pot the round collapses
  and everyone receives a small consolation; a team may instead spend its turn proposing
  a division, which takes effect only if all three accept it. I would like the first
  half of the session to be played with non-binding declarations only, and binding
  cards introduced only after a few rounds, so that the group sees a workable arrangement
  destroyed by the arrival of a tool that ought to help them. Teams should have to
  reach internal unanimity before playing a card; I suspect this matters and I''d
  like your view on whether it earns its complexity. No real money; a scoreboard,
  cards, and a secretariat of two or three students who record commitments and enforce
  the penalties.


  What I want back: the full rules, materials, a payoff scheme and the numbers behind
  it, a session timeline, and a debrief that maps specific moments onto the structure
  — why escalation was not caused by anyone''s greed or confusion, what the random
  order does, why the mutual preference for a deal does not by itself make a deal
  reachable, and what an external enforcer would and would not fix. Say what will
  predictably go wrong the first time I run it and how I should handle it, and be
  honest about which feature of the idea the game cannot reproduce and that I will
  have to supply in the debrief myself.


  I would also like one rule change I can make in a replay — a single dial, such as
  making commitments costly or reversible, or adding a fourth claimant — with your
  prediction of how the group''s behaviour shifts and why. Finally, tell me where
  this design is most likely to fail as a teaching device: which step of the causal
  chain from the rules to the insight you would abandon first, and what you would
  want to see in a trial run that would change your mind about it.


