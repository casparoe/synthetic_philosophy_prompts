  Draft:


  For most of the last year I have been arguing with my sister about what happened
  at a family gathering we both attended. The details don''t matter; what matters
  is that the argument never got anywhere, because each of us treated our own recollection
  as something that could not itself be called into question, and the more we tried
  to settle it the more obvious it became that the disagreement was not about evidence
  but about which things we were refusing to put in doubt. That sent me back to Wittgenstein''s
  later remarks on certainty, and I have since been reading around the debates they
  started — but I keep discovering that the labels I find (hinge epistemology, framework
  propositions, entitlements, quasi-fideism, relativism) do not tell me which view
  I actually hold, because I agree with different writers about different cases.


  I would like you to build me a sorting instrument: a quiz, in the style of a magazine
  personality test, that sorts its taker into one of the positions in this debate
  on the strength of what they say about concrete cases, not on the strength of which
  label they find congenial. Eight to ten questions. Each question should present
  a short, concrete scenario or a single claim and offer two or three mutually exclusive
  responses, phrased so that a thoughtful reader can choose one without knowing which
  theoretical position it corresponds to; no question should simply ask whether hinges
  are propositions, or whether hinge commitments are rational, or which author the
  taker prefers.


  Please write the questions, and then a scoring key that maps answer patterns onto
  the following positions, which I would like to appear as the possible outcomes:

  1. Hinges are not propositions or beliefs at all — they are ways of acting, a kind
  of animal certainty that shows itself in practice and cannot be stated, doubted,
  or justified.

  2. Hinges are genuine propositions, but constitutive of rational inquiry rather
  than justified within it; they are held with certainty and are exempt from doubt
  without being arbitrary.

  3. Hinges are neither known nor justified, but we are entitled to them anyway: there
  is a non-evidential warrant for adopting them, so they are rationally permissible
  even though nothing supports them.

  4. Hinges can be knowledge, because knowledge does not require the ability to defend
  what one knows; scepticism about them is unmotivated because doubt, to be meaningful,
  needs a method and a context, and the radical sceptic has neither.

  5. The demand to justify hinges is a philosophical confusion rather than a problem
  with an answer; the right response is to dissolve the question rather than to defend
  or refute anything.

  6. Hinges are necessary conditions of inquiry, and the sceptical question about
  them is a real question that cannot be answered from within inquiry — so the honest
  position is that scepticism is neither refuted nor shown to be nonsense, only set
  aside in practice.

  7. Which propositions function as hinges varies between communities, and there is
  no neutral standpoint from which one community''s hinges can be judged better than
  another''s; rationality itself is local.

  8. Hinge commitments are held on trust, in something like the way religious commitments
  are, and this is not a defect: they are not rationally grounded, but they are not
  for that reason irrational.


  Then, for each outcome, one or two sentences explaining what a person in that position
  is committed to denying, and which of the other outcomes they will most often be
  confused with.


  I also want the instrument to press on a distinction that the popular summaries
  tend to blur: the difference between losing a hinge and revising one. Please make
  sure at least two questions turn on cases in which someone stops being able to treat
  something as certain — through conversion, grief, or a breakdown — and asks whether
  that transition can be assessed as rational, arational, or a matter of brute change,
  and whether the person who undergoes it has lost a commitment or merely exchanged
  one.


  Two further requests. First, include cases that test whether the taker thinks there
  are practical and moral hinges as well as epistemic ones, and whether they behave
  the same way — I am thinking of things like the wrongness of cruelty to a child,
  or the reliability of one''s own memory, rather than only the standard examples
  about hands and tables. Second, wherever the quiz cannot in principle separate two
  of the eight positions, say so explicitly and explain why, rather than inventing
  a question that pretends to do it.


  Finally, since I suspect the space of answers contains combinations nobody defends,
