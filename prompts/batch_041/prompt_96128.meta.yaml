  ---


  I''m a backend engineer with no formal training in philosophy, and I''ve been trying
  to get straight on the consciousness literature that keeps getting cited in AI discussions.
  Recently I read a blog post (the author is anonymous, it''s a fairly popular "explainers"
  site) that summarizes the global workspace theory of consciousness and its relationship
  to the access/phenomenal distinction. I''ve reproduced the substance of its central
  section below, paraphrased and condensed, with the author''s key claims intact.
  I''d like an audit of how much of it I should believe.


  The summary runs roughly as follows. Global workspace theory, developed by Bernard
  Baars and given a neural implementation by Stanislas Dehaene and others, holds that
  the brain is a collection of many specialized unconscious processors competing to
  get their output into a limited-capacity "workspace." Information that wins this
  competition is broadcast widely, and that broadcast is what we call conscious experience;
  information that stays local is unconscious. Dehaene''s experiments on masking show
  that a stimulus that reaches awareness produces a sudden, widespread "ignition"
  of prefrontal and parietal networks, while the same stimulus presented subliminally
  stays confined to sensory areas — so the theory has real experimental support. The
  author then argues that this makes the older distinction between "access consciousness"
  (what''s available for report and reasoning) and "phenomenal consciousness" (what
  it''s like to experience something), associated with Ned Block, largely obsolete:
  the global workspace is exactly the thing whose contents we can report, and its
  contents are what we experience, so the two are one phenomenon described at different
  levels of description. The author concludes that because everything science can
  measure about the mind is a matter of information being made available to the right
  systems, there is nothing left over for phenomenal consciousness to be, and the
  "hard problem" is dissolved rather than solved. He also notes that the global workspace
  is essentially the brain''s working memory, housed in the prefrontal cortex, which
  is why frontal damage disrupts consciousness.


  I''m inclined to accept this because it''s the only mechanistic, testable story
  about consciousness I''ve come across. But I have a nagging sense that the author
  is moving faster than the evidence allows. Please go claim by claim: what a researcher
  working on this would accept, what they''d wince at, and what is straightforwardly
  wrong. In particular I want to know whether the move from "the workspace is what
  we can report" to "the workspace is what we experience" is a result or a stipulation,
  whether the hard problem can be dismissed that way, and whether the identification
  of the workspace with prefrontal working memory is the theory or a caricature of
  it. Finally, tell me what would change your mind: which argument or piece of evidence
  would push you toward the author''s verdict rather than against it, and where your
  own reasoning is most likely to be wrong.


  ---


