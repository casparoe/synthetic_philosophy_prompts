  Now the essay''s content. Let me write it.


  Title: "Question-Drift: Why Cross-Cultural Variation in Intuition Reports Is Evidence
  About Questionnaires"


  Section 1. The setup.

  Experimental philosophy probes intuitions by presenting a case and asking a question.
  The finding of cross-cultural variation has been taken to support two opposite conclusions:
  (a) restrictionists — intuitions vary across cultures, so they can''t be treated
  as data about the phenomena; (b) pluralists — different cultures have different
  concepts, so there is no single correct answer and philosophy must become comparative.
  I argue both conclusions rest on a mistake about what the subjects are doing.


  Section 2. Three loci.

  When a subject answers "Does S know that p?" after reading a vignette, variation
  in the answer can originate at three distinct places:

  (1) Case-comprehension: the subject does not represent the case as the experimenter
  intended. E.g., the subject reads the case as a story about a mistake, or as a story
  about luck, or fails to register that the evidence is misleading.

  (2) Question-selection: the subject represents the case correctly but takes a different
  question to be at issue — whether S is justified, whether S is blameworthy, whether
  it would be reasonable to rely on S, whether S is *certain*, whether S''s belief
  is *knowledge* in the sense of a socially licensed claim, etc.

  (3) Normative output: the subject represents the case correctly and identifies the
  same question, but applies a different standard to it — e.g., weights evidential
  luck differently.

  Call variation of type (2) question-drift.


  Thesis: what has been reported as cross-cultural variation in intuitions is, in
  the main, variation of types (1) and (2), not (3); and this makes the data philosophically
  much less interesting than either camp wants.


  Section 3. Why question-drift is invisible.

  The experimental instrument fixes the question by fiat — the words on the page.
  But the words underdetermine the question, because the same sentence ("Does S know?")
  can be used to raise different questions, and which question a subject hears it
  as raising depends on what the subject takes the conversational point of the exchange
  to be: is this a test? a request for advice? an invitation to moralize? And the
  vignette supplies no information about the point, because it is presented without
  a purpose. The subject has to supply one, and the supplying is culturally saturated.
  So the instrument measures an answer to a question the experimenter did not control.


  Also note: the standard remedy — more detail in the vignette — cannot fix this.
  Detail fixes the case, not the question. If anything, more detail gives the subject
  more material for inferring an unstated purpose.


  Section 4. What follows.

  If the variation is mostly (1) and (2), then:

  - The restrictionist inference fails: from "answers vary" it does not follow that
  the underlying competence varies, any more than variation in answers to "Is this
  a heap?" across contexts shows that heaps have no nature. Wait — careful, this analogy
  is a bit odd. Better: it doesn''t follow that intuitions are not evidence, since
  the variation may be variance in the measurement rather than in the measured.

  - The pluralist inference fails too: you cannot infer concept-variation from answer-variation
  when the question is uncontrolled. To infer that two groups have different concepts
  of knowledge you need them to have answered the same question differently; the data
  do not establish that they answered the same question.

  - So the empirical work is neither a refutation of armchair method nor a vindication
  of it; it is evidence about the pragmatics of questionnaires, which is a topic in
  survey methodology.


  Section 5. The residual worry.

  Two concessions. First, this is not a claim that all variation is artifact: some
  differences plausibly survive (e.g., where the vignette is written to remove question-ambiguity
  — hmm, is that possible? I''d need an example). Second, question-drift is itself
  a cultural fact of some philosophical interest — it tells us that "what is being
  asked" is not culturally invariant — but it is a fact about conversational norms,
  not about knowledge, reference, or free will.


  Section 6. Upshot.

  Both camps resist the deflationary reading because it makes the empirical literature
  inert with respect to the philosophical questions. That resistance is itself a reason
  to take the deflation seriously.


