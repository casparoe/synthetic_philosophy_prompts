  Activity idea (Gödel): "The Chronology Board." Participants are given cards representing
  locally-observed events with local timestamps, and constraints: for each pair of
  events connected by a possible light signal, the sender must be earlier. Locally
  the data is consistent — each participant''s chain is a nice linear order — but
  when the constraints are laid out as a cycle, the transitive closure forces a contradiction:
  the "earliest" event is forced to be later than itself. Participants first try to
  find a global ordering (a global "now"-sequence); they fail; then they must decide
  whether to (a) reject some data, (b) accept that there is no global order but only
  a partial order. Debrief: this is the structure of a causal partial order without
  a global time function; Gödel''s rotating universe is the physical realization —
  general relativity''s causal structure is exactly this kind of partial order, and
  Gödel found a solution where the "rotating" matter makes the causal cones tip around
  a loop, so no global time function exists, yet nothing locally is anomalous. Then
  the philosophical step (which the facilitator must supply): Gödel''s claim that
  this shows that "time" in the sense of an objective lapse of time is not part of
  reality; and the objection that a global time function isn''t needed for time to
  be real (the dispute).


