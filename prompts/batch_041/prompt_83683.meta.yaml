  Draft (Type B, national character):


  "I work with population statistics, so I spend my life making generalisations about
  groups, and I''ve been trying to work out where my own line falls. I''d like you
  to tell me what principle, if any, fits the verdicts below, and what to do about
  the cases that don''t fit.


  Take it as given that the statistical claims I mention are true — I''m asking about
  what may be said, not about what the data show.


  - ''Norwegian men are on average taller than Guatemalan men.'' Fine, no hesitation
  at all. I''d put it in a report without a second thought.

  - ''Danes are more likely to cycle to work than Britons.'' Fine.

  - ''Men are more likely to die by suicide than women.'' Fine, and I write it.

  - ''Men are violent.'' Not fine. Same data, roughly.

  - ''The Japanese are more group-oriented than Americans.'' Fine if I hedge it —
  ''tend to be'', ''on average''. Unhedged, it starts to feel like I''m claiming something
  about the Japanese character, and I don''t want to.

  - ''Brazilians are warm.'' Fine. And note that I''ve dropped the hedge — this is
  a bare generalisation with no ''on average'' anywhere in it. It also feels like
  a compliment, and I notice that this may be doing the work.

  - ''Germans are humourless.'' Not fine, and again I can''t see that the form is
  any different from the Brazilian one.

  - ''The French are rude.'' Not fine. ''Parisian waiters are rude'' — fine, or at
  least I say it.

  - ''The Irish are good talkers.'' Fine. ''The Irish are drunks.'' Not fine. The
  second isn''t even the more common trait, as far as I know, so accuracy doesn''t
  seem to be what''s going on.

  - I''m a Scot, and I say ''we Scots are dour'' without a qualm. When my English
  colleague says ''Scots are dour'', the same proposition, I bristle. I can''t explain
  this by the content, because the content is identical.

  - ''He''s late because he''s Brazilian.'' Not fine. ''She''s blunt because she''s
  Dutch.'' Fine, or nearly.

  - The one I keep going back and forth on: ''Nigerians are entrepreneurial.'' I say
  it, and I think it''s fine, and then I catch myself wondering whether it''s the
  same move as ''the Irish are drunks'' with a friendlier adjective, and whether the
  friendliness is the problem rather than the excuse.


  What I want is the principle behind this pattern, if there is one: state it as precisely
  as you can, tell me which clause of it each of these verdicts is doing the work
  for, and tell me honestly which of my verdicts it can''t save. If the honest answer
  is that no single principle fits and I have to choose between a complicated account
  that keeps every verdict and a simpler one that overturns one or two, say which
  verdicts you''d overturn and why. Then apply whatever you settle on to two cases
  I haven''t mentioned: a generalisation about a group I belong to that is unflattering
  and that I assert as a statistical fact, and a generalisation about an out-group
  that is flattering and that I use to explain an individual''s behaviour. I''d also
  like to know whether the account is about the content of what is said, the speaker,
  the audience, or the effects — I have a suspicion that my verdicts are tracking
  several different things at once and that I''ve been treating them as one."


