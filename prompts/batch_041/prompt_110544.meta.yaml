  I''m a PhD student working on skepticism and selfhood in early Chinese thought,
  and I keep running into a difficulty with the closing stretch of the second chapter
  of the Zhuangzi (the "Qiwulun" or "Adjustment of Controversies" chapter, in the
  received text). I''d like help getting clear on the argumentative structure rather
  than on the imagery, which I think I understand well enough.


  The relevant material, paraphrased rather than quoted, since I don''t have a critical
  edition at hand: earlier in the chapter the text worries about whether the self
  has a "true governor" (真宰) behind its various faculties, and it notes that we can
  affirm such a thing''s activity but never find its traces. It also insists that
  self and other, this and that, are mutually dependent — without an "other" there
  is no "I," and yet it claims not to know what makes this so. Then, at the very end,
  we get the dream: Zhuang Zhou dreams he is a butterfly, is wholly a butterfly, and
  when he wakes he is "undeniably" Zhou — the text then says he cannot tell whether
  he was Zhou dreaming he was a butterfly or is now a butterfly dreaming it is Zhou.
  But then, immediately, the text grants that between Zhou and the butterfly there
  must be some distinction (有分), and it calls the whole thing the "transformation
  of things" (物化).


  My problem is that this last move seems to disarm the doubt just as it is raised,
  and I can''t tell whether that is a feature or a bug. Three readings seem live to
  me:


  (A) The skepticism is local and diagnostic: the point is not that we cannot know
  whether we are dreaming but that our confidence in a fixed, self-identical "self"
  is unwarranted; the closing insistence on a distinction between Zhou and the butterfly
  is not a refutation but a refusal of the question — the doubt only looks threatening
  if you assume selves are the kind of thing that must be either identical or not,
  whereas 物化 treats them as phases of a process.


  (B) The skepticism is genuinely global and the closing line is concessive: Zhuangzi
  concedes only that there is a difference in the dream and waking states, not that
  we can know which state we are in now; "transformation of things" names the fact
  that the boundary between states is real but epistemically inaccessible, so the
  chapter ends in an unresolved suspension.


  (C) The dream passage is not about skepticism at all but about the fluidity of perspective
  and the impossibility of a standpoint outside transformation; on this reading the
  "true governor" material earlier is the key, and the dream is an illustration of
  the failure of the demand for a single ruler/self behind experience, so the closing
  distinction is a distinction between perspectives, not between worlds.


