  Draft:


  I am a doctoral candidate in moral psychology, and I have been trying to make precise
  a distinction that my field often invokes but rarely defines: the distinction between
  a moral preference and a moral bias. My supervisor says the difference is that a
  bias rationalizes or stabilizes an unjust social hierarchy, while a preference merely
  expresses a contestable ideal of how to live. I am not sure that survives the cases.
  Here are my verdicts. A person who prefers monogamy and thinks polyamory is a lesser
  form of life: preference. A person who feels disgust at interracial marriage and
  thinks it wrong: bias. A person raised in a community that regards meat-eating as
  defiling, who now judges it immoral though they can give no independent argument:
  I want to say preference, but it has the same visceral, unargued texture as the
  disgust case. A wealthy heir who believes the poor are lazy and that welfare should
  be cut, where the belief conveniently protects his inheritance: bias. A poor person
  who holds the same anti-welfare belief, not because it benefits him but because
  it is what everyone around him says: I want to call it a bias too, but my supervisor''s
  principle makes it a preference, and that feels wrong. A person who thinks it is
  morally better to have children than to be childfree and feels a pang of contempt
  at the childfree: preference, though an unlovely one. A person who thinks women
  should not serve in combat, not because he dislikes women but because he was raised
  in a military family and has a visceral sense of propriety: bias. A person who thinks
  it is wrong to eat octopus because she has a strong intuition that octopuses are
  persons, though she cannot defend it: I lean preference, but weakly.


  My tentative principle is the one my supervisor offers: a moral judgment is a bias
  when it functions to rationalize or stabilize an unjust hierarchy, and a preference
  when it merely expresses a contestable ideal of how to live. But that principle
  makes the octopus case a preference, the interracial marriage case a bias, and the
  childfree-contempt case a preference, while the combat case is a bias only because
  of hierarchy. It also makes the poor person''s anti-welfare judgment a preference
  and the rich heir''s a bias, even though the two judgments have the same content.
  And it seems to leave no room for a judgment that is visceral, unargued, and demeaning
  without being hierarchical. I would like a principle, or a small set of candidate
