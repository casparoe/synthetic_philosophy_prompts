  Draft:


  I am a retired observational cosmologist. For thirty years I fit models to data,
  and I have lately been reading philosophy of science in an attempt to understand
  what I was actually doing. There is one practice from my former field that now strikes
  me as philosophically strange, and I would like you to reconstruct the commitments
  it presupposes.


  The practice is this. When we estimate a parameter — a rate, a mass, a curvature,
  a proportionality constant — we routinely adopt a ''flat'' or ''uninformative''
  prior over that parameter and then report the resulting posterior as a neutral,
  objective summary of what the data say. The flat prior is supposed to let the data
  speak. It is the default in much of the physical sciences, and it is often described
  as the expression of a principle of indifference: with no information favoring one
  value over another, we assign equal prior probability to equal ranges of the parameter.


  The trouble is that the practice is not invariant under a change of parameterization.
  If I put a flat prior on a rate λ, and a colleague puts a flat prior on log λ, we
  will obtain different posteriors for the same physical quantity, even though we
  agree on the likelihood and the data. If we try to be indifferent over the predictions
  instead — choosing the prior that makes the prior predictive distribution as flat
  as possible — we get a third answer. The principle of indifference seems to underwrite
  the practice, but it gives no unique rule for which quantity to be indifferent over.
  And yet the practice persists, and it is rarely treated as a scandal.


  I would like you to reconstruct the philosophical commitments this practice presupposes.
  In particular:


  - What view of probability does it require? Does it commit us to a logical interpretation
  of probability, on which ignorance has a determinate numerical representation, or
  is it compatible with a thoroughgoing subjectivism on which any prior is permissible?

  - What view of ignorance does it require? Does it presuppose that there is a fact
  of the matter about the correct parameterization, or does it quietly help itself
  to a privileged description of the system under study?

  - Which rival views does the practice rule out? For example, does it rule out a
  frequentist view that rejects priors altogether, or a subjectivist view that treats
  the flat prior as merely one arbitrary choice among many?

  - Is the practice internally consistent? Or does it harbor a tension between its
  objectivist rhetoric and its parameterization-dependent mechanics?


  Please also assess a proposed fix from a junior colleague. She suggests that instead
  of being indifferent over parameters, we should choose the prior that makes the
  prior predictive distribution as flat as possible, so that the model is indifferent
  over the observable outcomes it might encounter. Is that a coherent way to rescue
  the principle of indifference, or does it simply relocate the problem? If it relocates
  it, where exactly does the problem reappear? And would a Jeffreys prior, which is
  designed to be invariant under reparameterization, solve the difficulty or merely
  trade it for another one?


  Finally, tell me what would have to change in the practice if we adopted a consistently
  subjective Bayesian view, and what would have to change if we adopted a frequentist
  view that rejects priors altogether. Distinguish what the practice strictly presupposes
  from what it merely fits well with, and say where the practice is philosophically
  underdetermined, so that several theories would license it.


  After your analysis, give me a table with the following columns, one row per commitment,
  and no more than six rows:


  | Commitment | Where in the practice it surfaces | Rival view it rules out | Strictly
  presupposed or merely convenient? | What would change if it were replaced |


  Keep the table compact and make the entries specific to the practice, not generic.


