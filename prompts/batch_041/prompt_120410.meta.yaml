  Belief set for the novelist:

  1. Radical freedom: people are always free, no excuse, anguish, responsibility —
  Sartrean.

  2. Bad faith is always possible and always self-inflicted — no social conditions
  excuse it.

  3. But also: I think social situations can make certain self-interpretations genuinely
  unavailable — e.g., scarcity, oppression, "serial" existence.

  4. I think bad faith and good faith aren''t just individual: a whole society can
  be in bad faith (e.g., a society that naturalizes something).

  5. I think the novelist''s job is to show characters choosing, so my novels must
  be written as if radical freedom is true — no determinism.

  6. But I also want to write about people whose options are structurally constrained
  (seriality).


  Genuine tension 1: Radical freedom (1) vs. social constitution of the self / seriality
