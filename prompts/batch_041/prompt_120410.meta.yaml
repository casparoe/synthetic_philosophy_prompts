  the "always free, no excuse" is compromised. Cheapest fix: distinguish freedom of
  choice from freedom of the field of options; Sartre already gestures at this in
  the Critique but it costs the purity of "condemned to be free."


  Genuine tension 2: "A whole society can be in bad faith" (4) vs. bad faith as an
