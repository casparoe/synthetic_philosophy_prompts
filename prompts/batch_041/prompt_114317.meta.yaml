  A colleague of mine defends the epistemic authority of markets with a simple picture.
  A market price, she says, is like a thermometer: it does not create the fact it
  registers, it merely reports it, and the rational response to a reading is to believe
  it and act on it. On this view the price of a prediction-market contract, a bond,
  or a stock is a readout of what is the case — the aggregate of whatever the participants
  privately know — and the appropriate attitude towards it is deference: if the market
  says the probability is 0.3, believe 0.3. She uses the picture to argue that we
  should trust prices over pundits, over our own hunches, and (in the political version
  of the argument) over deliberative procedures that are slower and more parochial.


