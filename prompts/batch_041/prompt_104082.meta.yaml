  Readings menu:

  1. Definitional/legal: as a matter of the common law, courts will not give effect
  to an attempt by one Parliament to bind a future one — a claim about what courts
  will do, i.e., about the rule of recognition.

  2. Conceptual/sovereignty: a sovereign legislature is by definition one whose power
  is unlimited; a limit that cannot be repealed isn''t a law but a moral/political
  constraint. So entrenchment is conceptually impossible.

  3. Normative/political: it would be wrong/dangerous for one generation to bind another
  (democratic presentism; "the dead hand").

  4. Empirical/predictive: future Parliaments will just repeal it anyway, so the entrenchment
  won''t stick.

  5. Moral-constitutional: continuity of the state; the sovereign is one continuous
  body, so "successor" is a fiction — Parliament as a continuing institution binding
  itself (like a person binding their future self, which is exactly a Ulysses contract).
  This reading undermines the slogan: a person can bind their future self; why not
  a Parliament?

  6. Rhetorical: nothing about law at all; just "you can''t stop us".

  And the Ulysses frame: the whole point of a precommitment is to bind your future
  self; the slogan says self-binding is impossible for a legislature — but is that
  true, given manner-and-form provisions, referendum locks, international treaties,
  devolution statutes that are practically entrenched, and constitutional courts?
  And the question whether legal entrenchment is necessary for precommitment to work
  (Elster''s point: precommitment works by raising the cost of reversal, not necessarily
