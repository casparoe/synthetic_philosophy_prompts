  I am a doctoral candidate in philosophy working on the moral limits of the criminal
  law, and I have been trying to state a version of legal moralism that is precise
  enough to be argued about. The version I want to defend runs roughly as follows.
  Criminalisation requires wrongdoing, but the wrongdoing need not consist in harm
  to any determinate person. Among the wrongs that can justify prohibition is the
  erosion of what I call the moral environment: the background of shared norms, expectations
  and dispositions on which individuals depend if they are to form and sustain the
  commitments that give their lives shape — trustworthiness, fidelity, truthfulness,
  restraint in the use of others. I treat that environment as a public good with the
  familiar structure of environmental public goods: non-excludable benefits, cumulative
  and diffuse degradation, thresholds below which the good collapses, and high costs
  of repair once it has. On this view, a person who acts against the environment wrongs
  others even when no one is made worse off in a way that a harm-based account can
  register, because the wrong consists in a change in what it is reasonable for everyone
  else to expect — a shift in the default. The view is, I take it, a descendant of
  the position Devlin defended against Hart, though I want to rest it on the structure
  of the good rather than on the cohesion-and-disintegration argument or on the sentiments
  of the ordinary person.


  What I want is a map of its exposure. What would count against it? I would like
  the defeaters ranked by how decisive they would be, with a distinction between those
  that would show the view false, those that would show it redundant (that is, that
  everything it licenses is already licensed by a plausible harm principle), those
  that would show it unjust or dangerous, and those that would show it unfalsifiable.
  I am particularly interested in what a committed defender of this kind of view would
  themselves concede as counting against it, as opposed to what critics say from outside.
  And I want the empirical question pressed: what would the world have to look like
  — which comparisons between jurisdictions, which trends in trust or in the incidence
  of the relevant practices, which natural experiments — for the claim about erosion
  to be disconfirmed rather than merely restated?


  Two further things I would like addressed. First, I am aware that the view is most
  exposed where it tries to distinguish enforcing a morality from enforcing a majority''s
  preferences; I would like to know whether the distinction can be sustained once
  the account is stated this precisely, or whether the moral environment is simply
  whatever the majority happens to want preserved. Second, tell me whether the view''s
  difficulty in specifying what would refute it is a defect peculiar to legal moralism
  or a feature of any account that treats diffuse social goods as objects of criminal
  protection — and, if it is a defect, whether it is fatal.


  Maybe also add: "For what it''s worth, I do not think I could be moved by a bare
  restatement of the harm principle, since that is what is in dispute; but I could
  be moved by a demonstration that the moral-environment apparatus does no work that
  a harm-based account cannot do."


