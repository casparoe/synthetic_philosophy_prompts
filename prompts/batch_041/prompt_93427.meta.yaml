  I am a high school junior and the student facilitator of our school''s philosophy
  club, which meets once a week for seventy-five minutes; we usually have between
  sixteen and twenty students, most of whom have had one ethics unit but no formal
  philosophy beyond that. For our next meeting I want to run an activity that makes
  everyone feel the pull of a question we keep circling without ever resolving: are
  everyday conventions—how to queue, whether to tip, when to cross the street—genuine
  moral obligations, and are visitors from elsewhere bound by local ones? I do not
  want to open with a lecture or even name the problem; I want the rules and roles
  to put them in a situation where they have to act, and where the friction does the
  teaching. To keep this from being the usual abstract debate, I have invented a small
  coastal town called Kestrel Bay and three of its norms. In Kestrel Bay, queues are
  not single-file but loose clusters, and the person who has waited longest is responsible
  for calling out whose turn it is; stepping forward without being called is a serious
  breach. Cafes add a service charge, and any extra money is expected to go into a
  communal jar for the dishwashers rather than to the server; handing a tip directly
  to a server implies that the employer underpays them and is taken as an insult.
  At one particular intersection, pedestrians are expected to cross against the light
  when no cars are coming, because the light cycle is long and the town treats waiting
  as a kind of civic laziness or distrust of neighbors. The visitors in the activity
  come from a large city with the opposite expectations: strict first-come-first-served
  queues, personal tipping at twenty percent, and a firm rule against jaywalking.


  Please design the full activity for me: the materials, the roles, the secret norm
  sheets, the sequence of the seventy-five minutes, and a payoff scheme that uses
  tokens or points rather than real money. I want the visitors to have concrete errands—buy
  bread, return a library book, catch a bus—and the locals to play bakers, librarians,
  bus drivers, fellow queue members, and a crossing guard, with the locals privately
  knowing the Kestrel Bay norms and the visitors privately knowing only their home
  norms. The scoring should reward both completing errands and earning social approval,
  and it should make the visitors feel that a breach has a cost even when no one can
  articulate why. The activity should produce at least one moment where a visitor
  sincerely follows their home norm and causes a real rupture, and one moment where
  a local enforces a Kestrel Bay norm and a visitor experiences it as arbitrary or
  humiliating. Then give me a debrief that maps those moments onto the philosophical
  distinctions: convention as a coordination equilibrium versus convention as a socially
  meaningful rule with moral force; the difference between a visitor being rude and
  a visitor being unjust; whether outsiders have an obligation to learn local conventions
  before acting; and when a local convention is itself criticizable rather than binding.
  Tell me what will predictably go wrong the first time I run this—especially if the
  visitors simply comply, or if the locals become cartoonishly punitive—and how to
  handle it without rescuing the tension too quickly. Finally, be honest about which
  part of the idea the activity cannot reproduce and that I as facilitator will have
  to supply in the debrief.


