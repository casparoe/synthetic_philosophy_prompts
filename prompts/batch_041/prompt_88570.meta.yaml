  I am a novelist, and for the past month I have been reading a book about prose style
  by an essayist I admire — not a scholar, but a careful and widely trusted one —
  and I have reached the chapter on Orwell. Stripped to its argument, the chapter
  says this. Orwell''s subject in his 1946 essay on politics and the English language
  is not style but thought: bad writing causes bad politics. Vague, inflated, exhausted
  language produces vague, inflated, exhausted thinking, and a public that cannot
  say what it means can be brought to believe anything; the tyrannies of the century
  were built on exactly this, and Orwell says so. The remedy is the list of rules
