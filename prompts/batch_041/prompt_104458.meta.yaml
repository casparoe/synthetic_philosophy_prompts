  as "parameter identity up to permutation symmetry" — that''s actually a real thing
  (neural network symmetry, permutation of hidden units). Good in-the-weeds item.

  7. Same training history / developmental lineage (etiological criterion: mechanism
  identity by causal history).

  8. Same causal pathway / same set of edges in the computational graph, at a coarse
  grain.


