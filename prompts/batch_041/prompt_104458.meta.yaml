  Context: You''re auditing a trained network; you detect an anomalous behaviour on
  some input; you want to know whether the mechanism producing it is "the same mechanism"
  as one you already understand/labelled. Candidate criteria:


  1. Behavioural/IO equivalence on a task distribution (the two cases agree on all
  inputs in some reference distribution).

  2. Causal-graph isomorphism over the variables in a causal model of the computation
  (Pearl-style).

  3. Causal abstraction / approximate abstraction: the high-level algorithm is a valid
  (approximate) abstraction of the low-level network, with the abstraction relation
  holding under interchange interventions.

  4. Interventional equivalence: the two mechanisms respond identically to the same
  set of interventions (activation patching, ablations).

  5. Computational-role individuation: same mechanism iff they implement the same
  input-output function within the wider system, i.e., same "computational role" as
  defined by what downstream components do with the output (teleological/functional
  individuation).

