  Draft:


  "I have been reading around the interpretability literature on what is sometimes
  called mechanistic anomaly detection, and I keep running into a problem that I suspect
  is more philosophical than technical. The setting, as I understand it, is this:
  we have a model whose behaviour we have characterised on some distribution of inputs,
  we have some account of the internal machinery that produces that behaviour, and
  we want to flag cases where a new input is handled by machinery that is importantly
  different from the machinery we thought we understood -- even though the model''s
  outward response looks perfectly normal, and even though every behavioural test
  we can run comes back clean. That project only gets off the ground if we can say
  when two pieces of internal machinery count as the same mechanism, and I cannot
  find any principled answer that does not either collapse into behaviourism at one
  end or into a criterion so fine-grained that every forward pass is a fresh mechanism
  at the other.


  I would like you to rank a list of candidate criteria for mechanism-identity by
  how well each would serve as the working test in such a pipeline -- not in the abstract,
  but as something an interpretability team could actually apply to a trained network
  to decide whether the mechanism behind an anomalous-looking case is the one they
  already have an account of. Assume the team has whatever tools you think are realistic:
  activation patching and ablations, causal scrubbing-style tests, sparse probes,
  access to weights and to the training data. The candidates, in no particular order:
  (a) input-output equivalence over a reference distribution; (b) isomorphism between
  causal graphs over the variables of an explicit causal model of the computation;
  (c) the existence of a valid (possibly approximate) high-level abstraction of the
  low-level computation, in the sense of a mapping that commutes with a suitable class
  of interventions; (d) equality of response profiles across a fixed battery of interventions;
  (e) sameness of computational role, where two subcomputations count as the same
  just in case the rest of the system uses their outputs in the same way; (f) identity
  up to the symmetries of the architecture, such as permutations of hidden units that
  leave the function unchanged; (g) sameness of causal lineage, i.e. whether the two
  pieces of machinery descend from the same training signal or the same data.


  Please give me a tier list -- say four tiers, best to worst -- with each candidate
  placed in a tier, a score out of ten for each if that helps you separate items within
  a tier, and a short defence of each placement. Then tell me which single criterion
  you would adopt as the default operational test and why, which two of the candidates
  are most often conflated in practice and what the confusion costs, and what empirical
  or conceptual development would most change your ordering. I care less about the
  ranking itself than about the criteria you are ranking by: I want to know what you
  take the purpose of a mechanism-identity test to be, whether you think that purpose
  is unitary, and where your ranking would have to move if it turned out that anomaly
  detection has to serve two incompatible masters -- catching novel mechanisms and
