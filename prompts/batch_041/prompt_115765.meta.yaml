  WKR structure:

  1. Buck-passing / fitting-attitude analysis (FA): for X to be good is for X to be
  such that there are reasons to favour X. Value is not a reason-giving property;
  rather, the reasons are prior.

  2. The WKR objection (the "strike of the demon"): The demon says: unless you admire
  this demon, I''ll strike you. Now there''s a reason to admire the demon. If buck-passing
  is right, then admiring the demon is fitting... but intuitively the demon is not
  admirable; the reason is of the wrong kind. So buck-passing overgenerates: any reason
  for an attitude would make the object valuable, including prudential/sanction-based
  reasons. Hence FA needs to restrict to the "right kind of reasons."

  3. But then: what makes a reason the right kind? Options: (a) reasons that bear
  on the object rather than the state (object-given vs state-given); (b) Hieronymi''s:
  the right kind of reason is one that bears on the question the attitude answers
  (for belief: "is p true?"); the wrong kind settles a different question. Hieronymi''s
  account: the reason must be the kind of consideration that bears on the constitutive
  aim / the question at issue. (c) The "right kind of reasons" might just be circular
  / unanalyzable. (d) Deflationists: maybe there''s no deep distinction; maybe it''s
  just that reasons have different weights in different deliberative contexts; or
  "the WKR is not a special class of reasons but a special class of explanations of
  why something is a reason."

  4. Also there''s the contrast: fittingness vs. the "should" of correctness. And
  the "ought implies can" issue: you can''t believe at will, so reasons for belief
  that can''t be acted on are odd. But the WKR problem bites even for attitudes you
  can control (admiration is partly controllable?).


  Now, restating in RL/decision-theory vocabulary:

  - "Attitude" → a state of the agent (a belief, a preference, a policy disposition).

  - "Reason" → a consideration that counts in favour of something; in decision theory,
  reasons = features that make an action/state have higher expected utility.

  - "Object-given reason for attitude A toward X" → hmm, in decision-theoretic terms:
  a feature of X itself, i.e., a feature of the object that makes the state "accurate"?
  There''s no "accuracy" for preferences. For beliefs, "accuracy" = truth, which in
  RL terms = the belief''s calibration / correspondence to the environment. So an
  object-given reason for belief P = evidence that P is true = information about the
  world that makes the belief likely true. A state-given reason for belief P = a reason
  that the state of believing P is beneficial (Pascal''s wager, belief pills, self-fulfilling).

  - For desire: object-given reason for desiring X = X is good/desirable. State-given
  reason for desiring X = having that desire will get you the reward (e.g., the "desire
  pill").

  - In decision theory, all of this collapses: the agent''s job is to maximize expected
  utility given its beliefs and desires; there''s no further question of whether the
  belief is "fitting" beyond whether it''s accurate, and accuracy matters only because
  it helps get the world right (instrumental). The "fittingness" of a desire has no
  decision-theoretic counterpart at all, because desires are the input to the decision
  rule, not something evaluated for correctness.


