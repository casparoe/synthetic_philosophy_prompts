  1. "Gödel proved that there are true statements that can never be proved." (Overstatement:
  not provable *within a given system*; "true" needs a model/standard interpretation;
  and there are provable true statements obviously.)

  2. "He showed this by constructing a sentence that says of itself ''this sentence
  is unprovable,'' a version of the liar paradox." (Mostly right, but the mechanism
  is arithmetization/diagonalization, and the liar sentence is not the Gödel sentence
  — the Gödel sentence is not paradoxical; it''s true.)

  3. "The upshot is that any formal system rich enough for arithmetic is either incomplete
  or inconsistent." (Right, but the summary might say "any system of thought" — overreach;
  also misses the effective-axiomatization requirement.)

  4. "This is why a computer can never be as smart as a human, since a human can see
  the truth of the Gödel sentence." (Lucas–Penrose; contested: requires the human''s
  reasoning to be consistent, sound, and effectively enumerable.)

  5. "It also shows that no system can prove its own consistency — so mathematics
  can never be certain of itself." (Second theorem; but caveats: consistency must
  be expressed in a particular way, Hilbert–Bernays–Löb derivability conditions, Rosser
  strengthening; and "certainty" is a psychological/epistemic claim, not what the
  theorem says.)

  6. "Physicists have used it to argue there can be no final theory of everything."
  (Common but dubious: physics theories aren''t formal systems of the relevant kind,
  and incompleteness is about provability, not about predictive completeness. Also,
  a theory of everything could be complete in the relevant physical sense.)

  7. "Because of Gödel, we know that mathematics can''t be finished / that Hilbert''s
  program was refuted." (Right-ish: Hilbert''s program as originally conceived is
  refuted; but there''s a nuance: Hilbert''s program in a weaker form — finitistic
  consistency proofs — is arguably alive in the form of ordinal analysis / Gentzen''s
