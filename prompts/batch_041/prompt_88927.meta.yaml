  During a reading group session on the mathematics of the infinite, a participant
  who holds finitist sympathies repeatedly deployed a single line against every argument
  we considered. Presented with Hilbert''s hotel, and with the proof that the even
  numbers can be put in one-to-one correspondence with all the natural numbers, he
  would say, in the manner of someone producing a trump card: "The whole is greater
  than the part." (I later found that the sentence is Common Notion 5 in Euclid''s
  Elements.) He takes it as an axiom of common sense that no theory of collections
  may deny, so that any theory which countenances a collection equinumerous with one
  of its proper parts — as these examples appear to — has refuted itself before it
  begins.


  I believe something is wrong with this, but I cannot say exactly what. Please set
  out for me the distinct precise claims that the sentence could be making, ranging
  from the trivial to the radical, and give a verdict on each. In particular, I would
  like the readings separated along these lines: what "greater" could mean (proper
  containment or parthood as such; greater cardinality; greater magnitude or measure;
  the existence of a nonzero remainder when the part is removed; greater ordinal rank
  or position in a well-ordering); whether the principle is a stipulation about the
  meaning of "greater," an axiom that fixes what "whole" and "part" mean, a theorem
  that follows from a definition of finiteness, or a substantive metaphysical constraint
  on what collections there can be; and whether the slogan read as a claim about composition
  — a whole exceeding the sum of its parts — is the same principle or a different
  one that has been conflated with it. For each reading, say whether it is trivially
  true, true but confined to finite or measurable cases, substantive and defensible,
  or simply false. Then say which reading the slogan needs in order to function as
  a genuine objection to Hilbert''s hotel and to the equinumerosity of the naturals
  with one of their proper parts, whether that reading is available, and whether it
  begs the question. Finally, tell me which reading the people who repeat the line
  are most likely to have in mind, since that is the one I will have to address.


  Lay the readings out as a menu, not as a defense of any one of them. Please answer
  in American English.


