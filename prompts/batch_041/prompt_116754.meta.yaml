  I am a high school student, and I have been trying to work out how we ought to judge
  historical figures such as Jefferson, Churchill, and Columbus. In a history class
  discussion I found myself defending a particular version of the so-called ''man
  of his time'' defence, and I would like you to tell me what would count against
  it.


  The version I hold is roughly this: a person from the past is fairly blamed for
  an act only if the moral objection to that act was genuinely available to them —
  only if someone in their time and place could have put the objection in terms they
  could have understood and had some reason to accept. Where the objection depends
  on moral discoveries that had not yet been made, blame seems misplaced. I do not
  intend this as a blanket excuse; I intend it as a claim about what it is fair to
  hold someone responsible for.


  Please tell me what would count against this position, ranked from the considerations
  that would be fatal to it to those that would be merely awkward. I would particularly
  like to know: what sorts of historical facts show that the objection really was
  available to a given figure, and how much weight should the existence of dissenting
  contemporaries carry — especially those who were marginalised or ignored at the
  time? Can the position distinguish someone who genuinely could not have known better
  from someone who arranged not to know, and what evidence would settle that? Does
  the position, taken seriously, prove too much, exonerating nearly everyone and making
  any moral criticism of the past impossible? And are there internal tensions — for
  instance, could a figure be condemned by the standards they themselves professed,
  or by the standards of the community they claimed to belong to? I am also unsure
  what to make of the thought that, if our own moral outlook is shaped by our time,
  this position may undercut our standing to judge anyone at all; I would like to
