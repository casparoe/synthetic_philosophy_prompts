  Finally, I would like an honest assessment of whether the position I have described
  is a substantive moral claim or whether, once stated carefully, it has been qualified
  into something nearly empty — and, if the latter, whether that is a defect or simply
  what any reasonable position of this kind must look like. Where the defence''s own
  defenders would concede a point, I would like to hear that too, not only the critics''
