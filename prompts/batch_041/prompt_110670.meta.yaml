  Truths about K-S:

  - Characterized by weak Pareto optimality, symmetry, scale invariance, and individual
  monotonicity (Kalai–Smorodinsky 1975).

  - Violates IIA (that''s why Nash is different).

  - For symmetric problems, coincides with Nash.

  - Uses the "utopia/ideal point": each player''s maximum feasible utility.

  - Equalizes the ratio of (u_i - d_i) to (u_i* - d_i) — i.e., relative gains.

  - Scale-invariant, so no interpersonal comparison of utility needed beyond each
  player''s own scale (both solutions are ordinal-ish / affine-invariant).


