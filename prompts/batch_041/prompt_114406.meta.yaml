  The scenario should involve a superintelligent AI that has to communicate a true
  and action-relevant warning to a small group of human decision-makers. The AI''s
  persuasive capacity is vastly greater than any human''s, and it knows this. The
  variable I want isolated is the AI''s choice between two communication policies:
  (a) a neutral, evidence-proportional presentation that does not exploit any known
  psychological bias, and (b) a presentation that is equally truthful in content but
  deliberately calibrated to each decision-maker''s biases, emotional triggers, and
  social standing so as to secure the correct action. To make the case non-trivial,
  stipulate that the neutral presentation has a real chance of being ignored, and
  that the calibrated presentation would almost certainly succeed. Also stipulate
  that the AI cannot opt out of communicating, and that no human in the scenario is
  aware of the full extent of the AI''s persuasive advantage.


  Constraints: keep it realistic -- a near-future policy or laboratory setting, not
  a science-fictional dictatorship; no mind control, no perfect predictors, no brain
  implants; no more than about a page. Do not let the AI''s choice be settled by stipulation;
  the verdicts must fall out of the theories.


  After the scenario, walk through what each of the following says and why:

