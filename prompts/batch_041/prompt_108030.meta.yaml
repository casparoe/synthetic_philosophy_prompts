  So the argument:


  (1) Our only access to the distant past is through surviving traces (texts, objects,
  ruins).

  (2) A trace tells us about the past only when we can rule out the alternative explanations
  of why it exists.

  (3) Ruling those out means using other things we already accept about that past
  — i.e., other traces.

  (4) So any claim about the distant past is supported only by other claims about
  the distant past. There''s no outside to stand on.

  (5) When a claim is supported only by claims of its own kind, the support is circular,
  and circular support gives no reason to prefer one story to another.

  (6) So among stories that fit all the traces, none is better supported than any
  other. And "fits the traces" is cheap, since we can always adjust the rest of the
  story to save a detail (or: any detail can be accommodated by adding auxiliary claims).

  (7) So my novel, if I''m careful with my invented details, is as good an account
  of the past as a historian''s monograph — and the historian''s confidence is just
  a convention. (Maybe: and the friend says the difference between my novel and the
  monograph is a matter of marketing.)


