  I have just returned from a long argument with a friend about imprecise probabilities.
  He holds that an imprecise probability is either just a set of ordinary probabilities,
  in which case it is a description of your uncertainty about which ordinary probability
  is correct, or else a decision-theoretic heuristic, in which case it is not a doxastic
  state at all. I think there is a third possibility: a credal state can be imprecise
