  What translates: epiphenomenalist qualia become a byproduct (spandrel) of the machinery
  that generates judgments; the judgments themselves are the trait under selection
  (they''re what has effects on behavior). The paradox becomes: if the capacity to
  make phenomenal judgments is an adaptation, what was it selected *for*? If it''s
  selected for tracking qualia, and qualia are byproducts, then selection on the judgment
  doesn''t require qualia to do anything — the judgment could be selected because
  it reliably co-occurs with the states that matter (the brain states), so it''s a
  reliable indicator even without causal mediation. That''s actually a nice resolution:
  the judgment is an adaptation that tracks the brain state (the common cause), and
  qualia ride along. Hmm — but then the judgment is *about* the brain state, not about
  qualia. Or: the judgment is about the qualia only if the qualia are what''s being
  tracked.


  Residue: (1) evolutionary vocabulary is about populations and heritable variation;
  epiphenomenalism is about token causal relations in an individual — the "trait"
  vs "token" mismatch; (2) selection requires heritable variation and differential
  reproduction — qualia''s heritability is undefined; (3) "function" in biology is
  etiological (selected effect) vs. the phenomenal judgment''s *content* being about
  qualia — content/representation has no place in the selectionist vocabulary; (4)
  the vocabulary assumes the trait has effects (else it can''t be selected), so it
  presupposes causal efficacy — which means epiphenomenalism cannot even be stated:
  a trait with no effects is invisible to selection, indistinguishable from drift
  or noise, i.e., it translates into "not a trait at all." That''s a nice finding:
  the translation makes epiphenomenal qualia either vanish or become a spandrel, and
  the spandrel framing is a *different* claim from epiphenomenalism.


  And the residue verdict: partly a defect of the target framework (no representation/content;
  no token causation) and partly a sign that the epiphenomenalist''s claim was less
  clear than it looked (what is the "trait" whose selection we''re asking about?).


