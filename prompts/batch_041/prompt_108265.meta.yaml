  Draft:


  I am a high school senior and the editor of my school''s literary magazine, and
  I have volunteered to write the closing piece for our philosophy club''s end-of-year
  reading. This semester the club has been working through higher-order theories of
  consciousness, and I want the poem to be something a reader could enjoy without
  already knowing the debate, while still being accurate enough that our faculty advisor,
  who works on philosophy of mind, would recognize the theory in the poem''s bones
  rather than merely in its vocabulary. The part of the debate that has stuck with
  me is the idea that a mental state becomes conscious when a higher-order representation—a
  thought or an inner perception—takes it as its object, and the objection that such
  a higher-order representation might be targetless: it could represent a first-order
  experience that is not actually occurring, in which case the theory seems to give
  us consciousness of a state that isn''t there. I would like the poem to make that
  possibility feel like a genuine psychological predicament rather than a technical
  curiosity.


  Please write the poem as a three-voice round, or canon, of roughly eighteen to twenty-four
  lines total. The first voice should be a plain first-order experience—something
  like a sting in the palm or the smell of rain on hot pavement—and it should speak
  in short, unadorned lines. The second voice should enter one line late and represent
  that experience to itself; it is allowed to be more articulate and more confident
  than the first voice, and it should sometimes get the first voice wrong. The third
  voice should enter one line after the second and represent the second voice in turn,
  so that the poem''s staggered entries enact the way higher-order theories pile representation
  upon representation. The ending should let the three voices overlap in a way that
  makes it impossible to say which one, if any, is the conscious one, and whether
  the first voice was ever there or whether the second and third voices generated
  it between them. The form should do the philosophical work: the round''s late entries
  should track the structure of the theory, and the final overlap should leave the
  targetless possibility open rather than resolving it. The poem should not explain
  the theory in footnotes or asides, and it should not need any citations; I want
  it to stand on its own as a poem.


