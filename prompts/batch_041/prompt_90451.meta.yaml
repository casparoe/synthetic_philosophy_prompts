  Standard: Simpson''s paradox: an association holds in every subpopulation but reverses
  when pooled. Classic example: treatment A better for both small and large kidney
  stones, but B better overall (because A used more on severe cases). Here severity
  is a confounder of treatment and outcome — so you should condition (stratify) →
  A is better. Conversely, if the third variable is a mediator (treatment → mediator
  → outcome), stratifying on it is wrong — you''d block the effect. So the resolution:
  the correct analysis depends on the causal graph; there''s no purely statistical
  resolution.


  Also the "in-the-weeds" bit: the paradox''s dependence on the choice of which variable
  is the "grouping" variable and the fact that it can be generated by mere arithmetic
  — e.g., there''s a general algebraic condition for reversal. And the non-collapsibility
  point: even with no confounding, odds ratios can reverse under conditioning on a
  variable that''s not a confounder (e.g., conditioning on a collider or on a mediator
  or on a variable associated with outcome only). That''s the deep point: "Simpson''s
  paradox" for odds ratios is partly a mathematical artifact of non-collapsibility
  (the "non-collapsibility" of the odds ratio means the marginal OR isn''t a weighted
  average of the conditional ORs even without confounding). This is a genuinely in-the-weeds,
  non-memorized point, and it''s a real thing (Greenland, Pearl, etc.). Good.


