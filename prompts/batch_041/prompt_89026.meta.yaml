  I''m a third-year CS student taking a seminar on alignment, and for my placement
  I''m helping a small lab decide how to supervise the models we''re fine-tuning.
  We keep having the same fight: for some tasks we pay annotators to check every reasoning
  step (process supervision), for others we just grade the final answer (outcome supervision),
  and right now it''s basically whoever yells loudest in the standup. I need a decision
  procedure my team can actually run on a new task before we start collecting data.
  The team is 4 people, annotator budget is small, and I have to get sign-off from
  the PI, who knows the theory but not the day-to-day. The decisions come up maybe
  once every two weeks and they lock in a labeling scheme for months, so getting it
  wrong is expensive.


  Write me the procedure: the questions to ask in order, what counts as a sufficient
  answer to each, where it stops with "process", where it stops with "outcome", and
  where it has to hand the decision to a human because it''s really a values call
  (e.g., how much we care about a model that gets the right answer for bad reasons).
  I want it usable by someone who hasn''t read the theory. Keep whatever distinctions
  from the process-vs-outcome literature actually matter and drop the rest.


  One thing I''ve been calling the legibility tax: the extra cost (annotation time,
  latency, engineering) of making the model''s reasoning checkable step by step. Also
  the difference between an execution error (wrong step, final answer happens to be
  right) and an intent error (right final answer, but the reasoning would generalize
  badly). The procedure should say when the legibility tax is worth paying and when
  it isn''t, and how to tell execution errors from intent errors when you only have
  outcome labels.


