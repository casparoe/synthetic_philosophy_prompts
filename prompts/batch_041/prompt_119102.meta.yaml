  keep it from being a memorized recitation, I want the question built around a variant
  I have been using in class: the auctioneer is a charity, and every dollar paid by
  either bidder is donated to a cause that both bidders independently value at some
  rate α, where 0 < α < 1. So a bidder who pays x receives a warm-glow benefit of
  αx in addition to whatever else they get. The question should ask whether this charitable
  feature eliminates, mitigates, or exacerbates escalation; it should require the
  student to set up the payoffs of the second-highest bidder at an arbitrary stage,
  compare stopping with raising the bid, and derive the condition under which continuing
  is rational. It should also ask what the result implies about the popular claim
  that dollar-auction escalation is just the sunk-cost fallacy, and it should ask
  what changes if α is private information rather than common knowledge. Please write
