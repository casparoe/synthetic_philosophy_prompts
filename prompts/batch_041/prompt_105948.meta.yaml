  "For an essay I''m writing on what testimony can and can''t establish, I''ve been
  rereading Graham Greene''s The End of the Affair through Hume''s chapter on miracles,
  and I''d like a reading that holds both ends. The novel arranges its supernatural
  evidence the way a lawyer would: the founding ''miracle'' — Bendrix walking out
  of the V-1 blast after Sarah''s vow to give him up — is known to the reader only
  through Sarah''s diary, an interested party''s private testimony that Bendrix himself
  reads after her death, while the later cures (the detective''s child, the birthmark
  that fades) are public but secondhand. Hume''s wise man proportions belief to evidence
  and finds the testimony for any miracle outweighed by the uniform testimony of nature;
  but Greene''s subject is not really evidence. Sarah''s vow is a bargain, not an
  observation, and Bendrix''s final, grudging assent to God is not the conclusion
  of an argument but something that happens to him against his will. So: where does
  the novel confirm Hume''s account — the interested witnesses, the reports that grow
  in the telling, the miracles conveniently of the Catholic kind that Hume says cancel
  out their rivals — and where does it dramatize something the essay has no room for,
  a belief that arrives through desire, promise and resistance rather than through
  the weighing of testimony? I''d like the reading to take the epistemology seriously
  rather than treating the novel as a case study, and to say plainly whether Greene
  is doing philosophy of testimony here or something else that Hume''s essay, by its
  own terms, cannot reach."


