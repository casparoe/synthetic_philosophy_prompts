  Design idea: A game simulating an economy where money is introduced as receipts/tokens,
  and then players discover that the tokens themselves become desired as wealth —
  hoarding, deflation, unemployment — and then a moment where they must act on the
  insight that money is a ticket/counter (a claim on real goods and on others'' labor)
  rather than wealth itself. Berkeley''s Querist point: money is a means of transferring
  wealth, a ticket/counter, and the true wealth is the industry and labor of the people;
  he thought Ireland suffered from want of a circulating medium, and he favored a
  national bank / paper credit. Also his immaterialism gives a metaphysical spin:
  money''s value is mind-dependent — it exists as an idea, sustained by trust/convention.
  That''s a nice bridge: for Berkeley, the coin''s value is not in the metal (a "material
  substance") but in the convention, the idea, the agreement — parallel to his denial
  of material substance.


  Classroom activity design: ~20 students, 75 minutes, upper-level seminar on Berkeley
  / history of philosophy / early modern philosophy or a seminar on philosophy of
  economics.


  Game: "Cloyne Market." Students get roles: farmers, weavers, bakers, landlords,
  laborers, a banker/issuer. Round 1: barter — the double coincidence of wants problem.
  Round 2: introduce tokens (paper notes) issued by a banker, redeemable for a basket
  of goods. Round 3: banker issues too many / hoards / recall, prices fall, activity
  seizes up; or one player accumulates notes and sits on them. Round 4: someone proposes
  to melt the tokens or buy silver — reveal that the tokens are just tickets. Debrief
  mapping: money as ticket/counter; wealth as command over labor/industry; Berkeley''s
  argument that a poor country with plenty of people and provisions but no circulating
  medium is like a body with blood but no circulation; his national bank proposal;
  the immaterialist connection — value is an idea, the coin''s material substrate
  is dispensable.


