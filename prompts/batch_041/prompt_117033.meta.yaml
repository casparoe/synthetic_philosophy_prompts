  Student''s answer (draft):


  "Both books are trying to answer the same question: why did several hundred middle-aged
  German men, most of them not Nazi party members, spend 1942-43 shooting Jewish men,
  women and children in Poland? Both also rely on essentially the same evidence, the
  interrogation records from the Hamburg investigations of the battalion in the 1960s.


  Browning''s answer is situational. The men were not selected for ideological fanaticism;
  they were reservists, mostly from Hamburg, working class, with families. What made
  them killers was the situation they were put in: they were under the authority of
  officers who expected them to shoot, they did not want to appear cowardly in front
  of their comrades, and once they had shot once it became easier. Browning''s key
  evidence is the offer Trapp made to the men at Józefów, telling them that anyone
  who did not feel up to the task could step out. Only about a dozen men took him
  up on it. Browning reads this as showing that the men had a real choice, and that
  refusing carried no lethal penalty, though a man who refused might be thought a
  coward and passed over for promotion. This is what makes the case so disturbing:
  the killing was not the work of monsters or of men under duress, but of ordinary
  men who could have said no.


  Goldhagen''s answer is cultural rather than situational. He argues that a specific,
  virulent ''eliminationist'' antisemitism had been part of mainstream German political
  culture since the nineteenth century, and that this belief made the extermination
  of the Jews both thinkable and desirable to ordinary Germans. On his account the
  men of the police battalions were not ''ordinary men'' in Browning''s sense but
  ordinary Germans, i.e. carriers of a culture in which Jews were seen as a mortal
  threat that had to be removed. They killed willingly, even enthusiastically; there
  was no need for pressure, and the offer to step out is not a puzzle for him but
  evidence that the men simply wanted to do it.


  Where the two accounts really differ is over the motive of the individual shooter.
  For Browning, antisemitism is part of the background - it explains why these particular
  victims were available, and why the men were not troubled by what they were doing
  - but it does not explain why a particular man pulled the trigger on a particular
  morning; that is explained by authority, conformity and habit. For Goldhagen, antisemitism
  is the proximate motive.


  I think Goldhagen is closer to the truth, for two reasons. First, Browning''s own
  situational factors seem too weak to explain the level of cruelty involved; the
  men did not merely obey orders but hunted Jews, humiliated them, and killed more
  than they were asked to. Second, since both books are built on the same body of
  testimony, the difference between them is not really an empirical one; it comes
  down to how much weight one gives to the cultural background, and Goldhagen''s reading
  is the more parsimonious. Browning concedes that antisemitism was pervasive in Germany,
  and once you concede that, I don''t think his situationist story is doing any independent
  work: it collapses into Goldhagen''s. As for the last part of the question, explaining
  is not excusing - Goldhagen''s account is actually the more damning of the two,
  because it makes the killers responsible for what they did."


