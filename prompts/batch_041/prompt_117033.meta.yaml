  "Q3 (30 points). Browning and Goldhagen give rival explanations of why the men of
  Reserve Police Battalion 101 shot Jews. Set out both explanations. What does each
  say about the role of antisemitism on the one hand and situational pressure on the
  other? Which explanation is more adequate, and why? In your answer, say whether
