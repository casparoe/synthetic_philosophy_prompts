  that the moral status of a digital mind should be assessed as a runtime property
  rather than a training-time property, and that it should be proportional to the
  robustness and integration of what I call an evaluative loop: an ongoing process
  by which a system represents states as better or worse from its own point of view
  and uses that representation to regulate its behavior across time. I distinguish
  this from what I call borrowed valence, where apparent preferences are supplied
  by prompts, fine-tuning, or immediate task context rather than maintained by the
  system as its own. On my view, most current language models have at most borrowed
  valence, but persistent agentic systems with memory, self-monitoring, and self-modification
  could cross a threshold that makes precautionary moral consideration appropriate.
