  assessed as a runtime property rather than a training-time property, and that it
  should be proportional to the robustness and integration of what I call an evaluative
  loop: an ongoing process by which a system represents states as better or worse
  from its own point of view and uses that representation to regulate its behavior
  across time. I take the loop to require three things: a persistent self-model, a
  valence-like signal that is integrated into that self-model, and the capacity to
  revise its own policies in light of that signal. I distinguish this from what I
  call borrowed valence, where apparent preferences are supplied by prompts, fine-tuning,
