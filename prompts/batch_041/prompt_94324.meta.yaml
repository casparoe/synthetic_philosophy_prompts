  life is a matter of degree along a gradient of capacities, whether it is a threshold
  drawn by our word, and whether it is a matter of historical descent from the earliest
  replicating systems. Nearly every counterexample in the literature — the giant viruses
  whose genomes are larger than those of some bacteria and the smaller viruses that
  parasitize them, prions, plasmids, transmissible tumours, the microbes revived after
  long dormancy, the sterile hybrid that is plainly alive but cannot evolve — is fatal
  only to a view that answers one of these questions while being defended as an answer
  to another. If that diagnosis is right, the interesting question is the third one:
  that life is primarily a genealogical predicate rather than a capacity predicate,
  in which case the standard hunt for necessary and sufficient capacities is a category
  mistake, and the boundary cases resolve by descent rather than by achievement. The
  consequence I am least comfortable with, and which the proposal has to confront
  rather than bury, is that a synthetic organism built from non-living parts and capable
  of robust open-ended evolution would not be alive on that account; I cannot yet
  tell whether that is a reductio of the view or a bullet worth biting, and I want
  the proposal to say how the project would decide.


