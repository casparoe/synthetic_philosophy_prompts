  universals, or whether properties are just names, or classes of resembling things,
  or bundles of particular features, and there''s that useful-sounding split between
  the properties that carve nature at its joints and the ones that are just convenient
  groupings. I want to know if any of that survives translation into something my
  team can actually run on a Tuesday.


