  ---


  I chair the case-handling committee of our national competition authority, and in
  three weeks the committee votes on whether to open proceedings in a matter that
  has divided the staff. Six firms supply a standard industrial input in a small,
  transparent market. Their list prices have moved in near-lockstep for four years
  — the maximum gap between any two of them has not exceeded one percent — and margins
  across the industry have risen by a third. We have no evidence that any employee
  of any firm ever discussed prices, output or market division with a competitor.
  What we have is this: all six license the same third-party pricing engine, which
  each morning recommends a price computed from that firm''s own cost and inventory
  data. The engine''s objective function was set by the vendor, not by the firms;
  the firms follow its recommendation about nine times in ten; and every firm knows
  its rivals use the same engine. Our statute prohibits ''agreements and concerted
  practices'' between undertakings, and our tribunal has read that language to require
  some form of contact or meeting of minds between the parties. The chief economist
  argues that a common cost shock plus the transparency of the market fully explains
  the parallelism, and that we would be punishing firms for an outcome they neither
  intended nor controlled.


  I want the opinion to engage two arguments that invert the ordinary order of explanation.
  The first is Darwin''s: design-like adaptation is produced by a mindless process
  of variation and selection, so that hunting for a designer is not merely unnecessary
  but a mistake once the process is understood. The second is Turing''s: rather than
  ask whether a machine really thinks, ask whether it can do the things we take thinking
  to enable — a move that treats comprehension as something we may attribute on the
  evidence of competent performance rather than as a precondition of it. Both bear
  directly on what our statute is asking for when it asks for an agreement.


  Please draft the committee''s written opinion. It should recommend a concrete course
  of action — open proceedings against the firms, open them against the vendor as
  well, close the file, or decline to prosecute while referring a rule-change to the
  board — with a timetable the staff can work to. It should state the test the authority
  should apply to cases of this kind in future, in terms an investigator could apply
  without having read the opinion''s philosophy. It should say what work the agreement
  requirement is doing: whether it is epistemic (a proxy for the coordination we actually
  care about), constitutive (the wrong just is the meeting of minds, so that no minds
  means no wrong), or attributive (it is what makes it fair to blame and fine these
  particular firms). And it should give the chief economist''s position its strongest
  form before saying why it does or does not carry the day. No citations, please —
  I will add references before it circulates.


