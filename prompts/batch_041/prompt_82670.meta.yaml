  Paragraph 1: I am a professor of philosophy, and I have been asked to deliver the
  memorial address for my colleague and friend, [name], who died last month. The occasion
  is a memorial service in the department. The audience is mixed: his wife and two
  teenage children, who are not philosophers and who are grieving; and his colleagues,
  several of whom work on the foundations of quantum mechanics. [Name] spent the last
  decade defending a version of quantum immortality. He believed that under a many-worlds
  interpretation of quantum mechanics, there is always a branch in which he survives
  any fatal event, so from his own first-person perspective he never experiences death.
  He was not a sensationalist about it; he thought quantum suicide was a flawed argument
  if it was meant to prove that death is an illusion, and he insisted that the measure
  of branches in which one survives in good health could be vanishingly small. He
  also held a deflationary view of personal identity: the ''I'' that survives is not
  a soul or a persistent ego but a pattern of continuity, and he thought that this
  made the first-person/third-person gap even harder to close. He would have wanted
  his memorial address to be honest about all of this, and he would have considered
  it a betrayal to be comforted by a lie.


