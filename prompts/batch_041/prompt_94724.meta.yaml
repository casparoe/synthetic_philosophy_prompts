  and got basically full marks. Which is definately too easy, and I think it''s also
  skipping the only interesting step.


  Here''s what I want them to have to do. The NFL results for learning say, roughly:
  average uniformly over all possible target functions, and every learning algorithm
  has the same expected error on points outside its training set. So a learner that
  always predicts 0 and a learner that predicts the parity function consistent with
  the data come out identical on that averaging. Everyone reads this off as ''induction
  has no rational foundation''. But the averaging is over a uniform measure on the
  space of all functions, and a uniform measure is a prior. So I want the question
  to force them to say what has actually been shown and about whom: is the theorem
  a formalisation of Hume''s problem, a refutation of it (because it shows the demand
  for a bias-free method was incoherent — any learner that generalises at all must
  already have a bias), or a change of subject (it''s about expected performance under
  a prior, whereas Hume is asking what justifies the prior)? And they have to pick
  one and defend it, not list all three.


  The second thing I want is for them to say what would have to be different in the
  theorem''s set-up for it to bear on an actual scientist with a finite dataset and
  one particular problem, as opposed to the average learner across all possible worlds.
  That''s the bit where the wheels usually come off.


