  Thesis sketch (asker''s): Machiavelli''s fortuna is standardly read as chance, contingency,
  or the residual unpredictability of the world; virtù as the human capacity to resist
  it. I want to argue that both readings miss what the two terms are doing in the
  Prince and the Discourses. On my reading, fortuna names, not chance as such, but
  *the portion of one''s situation that is constituted by other people''s unconstrained
  wills* — the fact that what happens to you is largely settled by agents whose choices
  you do not control. The flood imagery in the fortune chapter is a red herring if
  taken meteorologically: what actually ruins princes in Machiavelli''s examples is
  not weather but the defection of allies, the disloyalty of mercenary captains, the
  shift of the people''s favor, the intervention of foreign powers. Correspondingly,
  virtù is not courage or skill in general; it is the specific art of *converting
  dependence into asymmetry*: making others need you, owe you, or fear you more than
  you need them — hence the arguments about avoiding auxiliaries and mercenaries,
  about fortresses (which are useless if the people hate you), about keeping the people
  indebted rather than the nobles, about not making a prince too strong. On this reading,
  the famous claim that fortune governs half our actions is not a claim about luck''s
  share but about the share of one''s fate that runs through other wills; and Machiavelli''s
  advice is not "be bold" but "be the one others must come to." Corollary: virtù is
  not a virtue of character but a *relational position*, which is why it can be lost
  without any change in the prince''s own qualities, and why the same man can be virtùoso
  in one city and not in another.


