  Draft:


  Next month I am presenting a paper on Machiavelli''s fortune and virtù at a political
  theory workshop, and I want a Q&A preparation sheet rather than further work on
  the paper itself.


  My thesis is that the standard contrast — fortune as the residual contingency of
  the world, virtù as the human capacity to resist it — misdescribes both terms, and
  that in The Prince and the Discourses on Livy fortuna functions chiefly as a name
  for the portion of a prince''s situation that is constituted by other people''s
  unconstrained wills, while virtù names the art of converting dependence into asymmetry:
  making others need you, owe you, or fear you more than you need them. The evidence
  I lean on is the company the terms keep. What destroys princes in the examples is
  not weather but defection: disloyal allies, captains with their own interests, the
  withdrawal of popular favour, the arrival of a foreign army; the flood that fortune
  resembles is fed by other agents, not by rain. Correspondingly, the famous practical
  injunctions — on mercenaries and auxiliaries, on fortresses, on being feared rather
  than loved, on keeping the people indebted to you and the great men unable to do
  without you — are all instructions about the direction of dependence. If the reading
  is right, fortune''s "half of our actions" is not a claim about luck''s share but
  about the share of one''s fate that runs through other wills; and virtù is less
  a trait of character than a relational position, which is why it can be lost without
  any change in the man and why the same man can be virtuoso in one city and not in
  another.


  The audience is the difficulty. Roughly half are historians of political thought
  in the Cambridge mould: they work on the vernacular humanist vocabulary, they will
  treat my "dependence" as a modern concept smuggled into a text whose relevant terms
  are capacity, prowess, and worth, and they will ask what work remains for fortuna
  once I have stripped it of its providential and personified senses — they will point
  out that in the texts fortune is a goddess, a woman, a river, and a storm, and never
  a crowd of wills. Two Straussians will be there, and will say that I have domesticated
  a deliberately impious teaching: that by turning virtù into a bargaining position
  I have made Machiavelli respectable and have ignored the founding, the religion,
  and the terror. Two neo-Roman republicans will say that my concept of dependence
  is doing the opposite of theirs: they read Machiavelli as a theorist of freedom
  as non-domination, whereas I have made virtù a technique of dominating others, so
  that either I am celebrating servitude or my "dependence" is just "power" with a
  philosophical accent. One participant works on the popular and plebeian strand of
  the Discourses and will press me on whether a relational account of virtù can be
  extended to the virtù of peoples and of Rome collectively, or whether my reading
  is prince-shaped by construction. There will also be a couple of graduate students
  who will ask the obvious deflationary question in the bluntest form.


