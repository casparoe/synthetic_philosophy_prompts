  natural selection and development. That may be the honest answer, but it makes the
  frame problem continuous with the problem of the origin of norms, and it means that
  any system whose purposes are given from outside has a frame given from outside.


  Section 7: conclusion — we should stop asking whether a system has solved the frame
  problem and ask whose frame it is using, and what happens when the question changes.


