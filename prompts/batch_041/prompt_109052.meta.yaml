  interleave. Philosophers took a further lesson: a creature that had to represent
  all and only the relevant consequences would be paralyzed, so intelligence must
  somehow restrict what it considers.


  Section 2: Two readings. Representational reading: the problem is about compactly
  specifying inertia in a formal language — an engineering problem about nonmonotonic
  reasoning. Deliberative reading: the problem is about how an agent determines what
  is relevant to a practical question at all — a problem about the frame of attention,
  not the frame axioms. I argue these are different, and the first is a special case
  of the second.


