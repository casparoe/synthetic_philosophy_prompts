  Title: "The Archivist''s Dilemma: What the Frame Problem Is, and What Learned Systems
  Merely Borrow"


  Section 1: The standard telling. The frame problem is usually introduced as a difficulty
  in the logic of action: when we write axioms for what an action changes, we must
