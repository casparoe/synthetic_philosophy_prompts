  that will be relevant to a future historian''s question. Because the question is
  not yet fixed, "relevant" has no extension; the archivist can either keep everything
  — explosion, and then the archive is useless — or keep what present questions make
  salient — parochialism, and the archive is a mirror of current obsessions. Every
  frame is either no frame or a parochial one. The dilemma is structural, not practical:
  it follows from relevance being a relation between a body of information and a question,
  not a property of information.


