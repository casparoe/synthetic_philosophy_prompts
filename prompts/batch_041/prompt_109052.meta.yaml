  frame problem in a closed domain (chess, blocks world, theorem proving) is the fact
  that the question is fixed in advance by the domain''s rules; the relevance relation
  is supplied by the task, not by the agent. The frame problem is not a problem about
  agents at all; it is a problem about tasks, and it dissolves whenever a task is
  closed.


  Section 5: The borrowed frame. Contemporary learned systems — large language models
  being the obvious case — appear to circumvent the frame problem because they carry
  a prior over what typically matters, induced from a training distribution. This
  is not a solution; it is a loan. The frame is borrowed from the distribution, and
  the loan is called in whenever the task leaves the distribution. Hence brittleness
  is not an incidental engineering wart; it is the frame problem reappearing in the
  only place it can appear — at the boundary of the distribution. The system that
  "knows what not to consider" only knows it for the questions it has been asked before,
  in the form in which it has been asked.


