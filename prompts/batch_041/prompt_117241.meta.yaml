  Draft summary:


  "''Conditionals are notoriously slippery, and in the 1970s the logician David Lewis
  proved a famous result that many philosophers think settles the matter. Everyone
  had assumed that the probability you should assign to a conditional — ''if it rains,
  the picnic will be cancelled'' — is just the conditional probability of the consequent
  given the antecedent: P(if A, then B) = P(B | A). Lewis''s triviality theorems show
  that this equation cannot hold. If you assume it, you can prove that P(if A, then
  B) = P(B) for any A and B, so the antecedent makes no difference at all to the probability
  of the conditional; and since even P(if A, then A) would then equal P(A) rather
  than 1, the assumption is incoherent. What this shows is that indicative conditionals
  cannot have truth conditions at all. A conditional isn''t a proposition that is
  true or false depending on how the world is; it''s an expression of a conditional
  degree of belief, a device for saying that you take B to be likely on the supposition
  that A. This is why the material conditional of the propositional calculus is a
  hopeless analysis, and why textbooks now teach that the logic of conditionals is
  a logic of conditional probability rather than of truth. Lewis''s result is a mathematical
  theorem, so there''s no way around it: any theory that assigns conditionals truth
  values is refuted by the probability calculus. The only live options are the non-propositional
  ones.''"


