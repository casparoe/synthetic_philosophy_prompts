  I am a PhD student in philosophy working on personal identity and the ethics of
  advance care planning, and I have been trying to formulate a principle that captures
  my own verdicts about when an earlier self''s directive should bind a later self.
  I am not interested in a survey of the literature; I want a principle, or a small
  set of candidate principles, that does justice to the pattern below, says what it
  implies for cases I have not listed, and tells me which of my verdicts I should
  give up.


  My verdicts:


  1. A competent adult with a progressive terminal illness signs a DNR order and,
  after losing decision-making capacity, develops pneumonia. I think the DNR should
  be honored, even if the later self seems to want comfort and would not resist treatment.


  2. The same adult, while still competent but in severe pain, asks for the DNR to
  be revoked and for antibiotics. I think the later competent request should override
  the earlier directive, because the earlier self was not then in the position of
  the later self.


  3. A person with early dementia signs a directive refusing antibiotics for pneumonia
  once she no longer recognizes her family. She later no longer recognizes them, appears
  content, and says she wants to live. I think the directive should be honored, though
  I find this verdict harder to defend than 1.


  4. A person with early dementia signs a directive refusing all life-prolonging treatment
  once she needs help with all activities of daily living. She later needs such help,
  but she is cheerful, socially engaged, and says she is glad to be alive. I think
  the directive should not be honored, and treatment should be provided.


  5. A person with bipolar disorder signs a psychiatric advance directive refusing
  electroconvulsive therapy during future manic episodes. He later becomes manic,
  refuses ECT, and is miserable and dangerous. I think the directive should be honored,
  even though he now refuses.


  6. A person with anorexia nervosa signs an advance directive refusing artificial
  nutrition when her weight falls below a threshold. She later falls below it, refuses
  nutrition, and says she wants to die. I think the directive should not be honored,
  because anorexia is distorting her current evaluative standpoint.


  7. A person with locked-in syndrome had previously said that if he ever became locked-in
  he would want to die. He is now locked-in, communicates reliably, and says he wants
  to live. I think his current wish should override the earlier statement.


  8. A person in a persistent vegetative state had said he would never want to be
  kept alive in such a state. He is now in that state with no evidence of awareness.
  I think the earlier directive should be honored.


  9. A person with a progressive neurological illness signs a directive refusing ventilation
  when he can no longer speak. He later can no longer speak but communicates by eye
  gaze, is cognitively intact, and wants ventilation. I think the current wish should
  override the directive.


  10. A person signs a directive refusing blood products for religious reasons. He
  later loses capacity after an accident and needs blood. I think the directive should
  be honored, even though the later self cannot consent or refuse.


  My tentative principle is this: the authority of an earlier directive depends not
  on the numerical identity of the later self, nor simply on the later self''s current
  welfare, but on whether the later self can be said to have authorial standing with
  respect to the directive. A later self has authorial standing when its current evaluative
  standpoint is either continuous with the earlier self''s or, if discontinuous, still
  capable of recognizing the earlier self''s reasons as reasons it could have had.
  When authorial standing is absent, the directive binds as a precedent; when it is
  present, the later self''s current wishes have priority. I call the first kind of
  authority authorial authority and the second kind experiential authority, though
  I am not sure the labels help.


