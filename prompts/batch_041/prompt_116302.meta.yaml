  decides what is worth keeping, the collection reflects the values and interests
  of the institution that houses it, and the gaps in the record are simply what the
  curator did not choose. On this view, the silences in the sources are not a scandal
  but the ordinary signature of selection, and the responsible historian should acknowledge
  them and get on with the analysis. I can see the appeal, and I can see that it captures
  something about appraisal, acquisition, cataloguing, and the way institutions shape
  what counts as worth preserving. But it also seems to flatter the archivist, and
  perhaps to let the state, the colonial administration, the firm, or the ordinary
  bureaucratic habit of recording some lives and not others off the hook. I would
  like you to audit the analogy rather than simply agree or disagree with it.


  Could you set out the correspondence explicitly—what plays the role of the curator,
  the acquisition committee, the donor, the object, the display case, the visitor,
  the storeroom, the catalogue, the conservation lab, and so on—and then say where
  the mapping breaks down? I am especially interested in which disanalogies actually
  matter for her conclusion that silences are just curatorial choices, and which are
