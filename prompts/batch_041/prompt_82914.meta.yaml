  \ reversible implant that gives you perfect recall of everything you read\" — treatment\
  \ line: no (beyond normal), welfare: yes (great, no externalities, not positional\
  \ since everyone can have it cheaply and it doesn't depend on others lacking it),\
  \ positional: yes (since it's not positional). So treatment-line says no, others\
  \ say yes. Good divergence between treatment-line and the other two. But I need\
  \ at least two rules diverging — yes.\n\nTo get three-way divergence, add a fourth\
  \ case? The prompt asks the model to identify the candidate rules and say which\
  \ predicts what. If the treatment/enhancement rule diverges from the other two,\
  \ that's two rules diverging — enough. But nicer if there's a three-way split. Let\
