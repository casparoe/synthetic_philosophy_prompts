  \ was 'the grandkids,' not the kid.\n\nNext week's case is a newborn gene therapy,\
  \ one shot, irreversible, that raises baseline muscle mass and speeds recovery from\
  \ injury, no known downside, offered free to every family through the national health\
  \ service, and it does pass to the child's own kids. Predict her verdict, tell me\
