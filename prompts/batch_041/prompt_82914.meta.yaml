  \ pathology — no, and she gets visibly annoyed when students defend it; modafinil\
  \ for narcolepsy — fine; modafinil for a healthy surgical resident who's been on\
  \ 80-hour weeks — she says yes, which surprised everyone, and her reasoning was\
  \ about the patients, not the resident; cochlear implants — fine; laser eye surgery\
  \ for myopia — fine, doesn't count as enhancement in her book; EPO for a pro cyclist\
  \ — no; a hypothetical safe pill that raised everyone's IQ ten points — yes; the\
  \ same pill if only your kid could get it — no, or at least she says 'that's a different\
  \ question'; an antidepressant for someone who's sad because their dog died and\
  \ who isn't depressed — no, but she said it more tentatively; a drug that cuts sleep\
  \ need to four hours with no side effects, available to anyone — I genuinely couldn't\
  \ tell, she said 'ask me next week'; and preimplantation selection against a severe\
  \ early-onset disease — fine, while selecting for height — no, 'and not for the\
  \ reason you think.'\"\n\nHmm, that's a lot; maybe trim. Then: \"Next week the case\
  \ is X: [a new case]. I want you to predict her verdict, tell me which rules her\
  \ record is consistent with (there's at least a treatment/enhancement line reading,\
  \ a reading where she only cares about welfare and externalities, and a reading\
  \ where the real variable is whether the advantage is positional), say what each\
  \ predicts about X, which you'd bet on, and what case I should bring up to separate\
  \ them.\"\n\nHmm, the \"and not for the reason you think\" is a bit cutesy; maybe\
  \ drop or keep for voice. Actually the examples have personality. Fine.\n\nNow the\
  \ new case needs to be in-the-weeds and split the rules. Let me pick: \"a gene therapy\
  \ that raises muscle mass in healthy adults with no side effects, offered free by\
  \ an employer to warehouse workers\" — that's positional-ish (physical labor jobs),\
  \ coercion/employer pressure, and beyond-normal. Rules diverge: treatment line:\
  \ no; welfare/externality: depends on coercion (employer pressure = no, or yes if\
