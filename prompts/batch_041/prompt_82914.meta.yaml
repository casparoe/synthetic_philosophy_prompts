  \ choice) or involves a *third party* or is *irreversible*. E.g., \"a one-time,\
  \ irreversible gene therapy given at birth that raises muscle mass and reduces sleep\
  \ need.\" Hmm.\n\nLet me make the new case: \"a one-shot, irreversible gene therapy\
  \ for newborns that raises baseline muscle mass, improves recovery from injury,\
  \ and has no known downside, cheap, offered to every family in a country's health\
  \ system.\" Rules:\n- Treatment/enhancement line: not treating a disease → no (but\
