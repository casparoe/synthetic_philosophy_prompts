  \ editing even for disease? But I said she approved PGD against severe disease —\
  \ PGD isn't germline editing per se, and it's selection among embryos, which is\
  \ different. Hmm, so I could include: \"she approved PGD against severe disease\
  \ but said no to a case of a heritable edit that would spare the same disease, which\
  \ she admitted was inconsistent and said was about the kids' kids, not the kid.\"\
  \ That's a nice seeded inconsistency that supports an irreversibility/transgenerational\
  \ rule. Then the new case (newborn gene therapy, irreversible, heritable or not)\
  \ splits three ways: treatment-line no, welfarist yes, transgenerational/irreversibility\
  \ no. But then welfarist alone says yes — need the answer to be interesting. Fine:\
  \ the prediction depends.\n\nHmm, that might be too much. Let me keep it moderately\
  \ elaborate but not bloated. The instruction says one to three paragraphs and \"\
  relatively elaborate.\"\n\nMaybe simpler and cleaner: keep the list to ~7 cases\
  \ and one new case with 3 divergent readings.\n\nLet me also inject a novel-ish\
  \ idea: I could have the friend articulate a made-up distinction she uses, e.g.,\
  \ she says \"I care whether the change is *responsive to the person's own aims*\
  \ or *imposed by the market*.\" Or the asker can offer a candidate rule that's novel:\
  \ \"one of my classmates suggested her real rule is 'enhancement is fine when the\
  \ good is non-positional and the risk falls only on the consenting person' — is\
  \ that better than the treatment line at fitting her record?\" That's a nice injection\
  \ of a niche-but-intelligible idea.\n\nI like that. So the asker names candidate\
  \ rules partly. But careful: the type wants the model to identify the candidate\
  \ rules. I can have the asker mention one classmate's hypothesis (like the examples\
  \ do: \"safety, sensitivity, no false lemmas\") and let the model find the others.\n\
  \nAlso, should I worry about the \"no verbatim quote\" rule? I'm not quoting. No\
  \ need for search. Maybe I should double check nothing leans on a specific work/date.\
  \ I mention \"species-typical functioning\" — I'll avoid naming. I'll not cite anyone.\
  \ Good — no search needed.\n\nHmm, but the meta-instruction says I can search but\
  \ most prompts shouldn't need it. Fine. But maybe I should verify one thing: modafinil\
  \ for narcolepsy, cochlear implants, EPO — all common knowledge. PGD — common. Fine.\n\
  \nWait — one risk: does the domain choice need to be exactly one of the five? Yes:\
  \ \"Human enhancement and the therapy/enhancement distinction.\" Good.\n\nNow write\
  \ it casually, with a typo or two, 1–3 paragraphs.\n\nDraft:\n\n\"My friend teaches\
  \ a bioethics seminar and I've been sitting in on it, mostly to argue, and I've\
  \ started keeping a list of her verdicts on enhancement cases because they've gotten\
  \ oddly consistent. Growth hormone for a kid whose pituitary doesn't work: obviously\
  \ fine, she doesn't even file it under enhancement. Same drug for a kid who's just\
