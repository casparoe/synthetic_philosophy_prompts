  \ defend it. Modafinil for narcolepsy: fine. Modafinil for a healthy surgical resident\
  \ working eighty-hour weeks: yes — that one surprised the room, and her reasoning\
  \ was entirely about the patients, not the resident. Cochlear implants and laser\
