reasoning_summary: "The task: write a prompt of type \"Predict or recommend a verdict\
  \ on a new case from someone's verdicts on earlier cases\", on one of the five domains.\
  \ Also the additional instruction: inject some new/niche idea into the prompt so\
  \ it's not just regurgitation, but also not so niche that small models don't know\
  \ it.\n\nBest combination: \"Human enhancement and the therapy/enhancement distinction\"\
  \ or \"Wild animal suffering\" or \"Émilie du Châtelet's views on happiness\" or\
  \ \"Euthanasia and assisted dying\" or \"Inequality: American vs European attitudes.\"\
  \n\nHmm. The verdict-from-precedents type works well with a committee/board or a\
  \ person's verdicts. Let me think about which domain gives the best structure.\n\
  \nOption: Human enhancement / therapy-enhancement distinction — a bioethics committee's\
  \ past rulings on enhancement cases, and a new case. But \"new/niche ideas\" injection:\
  \ could inject a specific distinction, e.g., the \"treatment/enhancement distinction\"\
  \ vs \"welfarist\" vs \"Norman Daniels' species-typical functioning\" — but those\
  \ are known. To be in-the-weeds but not needing citations, I could invent a novel\
  \ case that combines features: e.g., a drug that prevents a disease but also boosts\
  \ baseline function above the person's pre-treatment level; or enhancement of a\
  \ fetus (germline), or moral enhancement (Douglas' moral bioenhancement — known-ish).\n\
  \nOption: Wild animal suffering — verdicts about interventions: e.g., a person's\
  \ verdicts on various cases (feeding urban foxes, contracepting deer, treating mange\
  \ in foxes, culling, gene drives to reduce suffering of r-strategists, etc.). New\
  \ case: a gene drive that would cause a species to stop reproducing and go extinct\
  \ \"painlessly\"? Or interventions like vaccinating bats against rabies, or helping\
  \ a wounded animal, or reducing population of a prey species. The person's verdicts\
  \ could be jointly consistent with more than one rule: e.g., \"intervene when you're\
  \ the cause\" (laissez-faire/negligence), \"intervene when suffering is caused by\
  \ humans,\" \"intervene whenever you can reduce net suffering\" (welfarist consequentialism),\
  \ \"never intervene in nature,\" \"intervene only for individual animals, not populations.\"\
  \ That's a nice one: verdicts like — rescuing a deer stuck in ice: yes; feeding\
  \ birds in winter: no (creates dependence / more suffering in long-run); culling\
  \ a population of overabundant deer that would otherwise starve: yes; removing a\
  \ predator to protect prey: no; treating mange in foxes: yes (but she's conflicted\
  \ because it may spread); gene drive... The new case could be: \"the new case is\
  \ a plan to introduce a gene drive that makes a rodent species' population crash,\
  \ meaning the predators that depend on it starve too.\"\n\nHmm, I need to also inject\
  \ a new/niche idea. Perhaps inject a niche concept like \"the r-strategy problem\"\
  \ or the \"Tomasik's argument\"? Or invent a made-up-but-plausible idea: e.g., a\
  \ colleague's proposed rule of \"suffering parity: interventions are permissible\
  \ only if the suffering relieved is of a kind you'd be willing to experience yourself\"\
  \ — something novel-ish, so the model can't just regurgitate.\n\nAlternatively,\
  \ \"Émilie du Châtelet's views on happiness\" — the type could be historical figure,\
  \ but that's a different type. The verdict-from-precedents type with du Châtelet:\
  \ \"her verdicts on earlier cases\" — hmm, she wrote Discours sur le bonheur, with\
  \ specific maxims. Could do: her rulings on cases of happiness (love, study, health,\
  \ wealth, gaming, ambition). But that risks depending on specifics of her text;\
  \ models may half-remember. Actually the prompt could give the verdicts itself as\
  \ a list (the asker reports them), which is fine and doesn't need citations — but\
  \ they should be plausible relative to her actual views. Risky if I get her views\
  \ wrong. But actually the prompt constructs the \"friend's verdicts\" — the asker\
  \ is reporting a person's verdicts. If I make them du Châtelet's, I should be accurate-ish.\
  \ Hmm. Better to avoid? The instruction says the earlier verdicts can be reported\
  \ by the asker; the domain is \"Émilie du Châtelet's views on happiness\" so the\
  \ person should be her.\n\nActually, a safer and more interesting option: Euthanasia\
  \ and assisted dying — a Dutch/Canadian review committee or a hospital ethics committee\
  \ with precedents, and a new case. Rules: autonomy-based vs suffering-based vs \"\
  medical condition\" framing vs slippery slope. Verdicts: approved a case of unbearable\
  \ physical suffering with terminal illness, refused a case of a healthy elderly\
  \ person \"tired of life\", approved psychiatric suffering with treatment refusal,\
  \ refused advance request for dementia patients, etc. New case: a prisoner? A person\
  \ with a progressive condition requesting euthanasia before losing competence (advance\
  \ request). Hmm, this is quite well-trodden.\n\nThe \"inject new/niche ideas\" requirement\
  \ pushes toward a fictional/constructed element. In the examples, the case details\
  \ are invented (fake barn, etc.), and the \"friend\" verdicts are given. The extra\
  \ instruction says \"you'll often have to inject some sort of new / niche ideas\
  \ into the prompt\" — meaning the prompt should include some novel content (like\
  \ a made-up principle or a novel case) so the model can't regurgitate.\n\nLet me\
  \ pick wild animal suffering, since it's the most \"in the weeds\" and allows inventing\
  \ novel cases with a novel conceptual wrinkle. But there's a risk: small models\
  \ might not have thought about wild animal suffering much, but it's a known topic\
  \ (Tomasik, Ng, Animal Ethics, Oscar Horta). It's fine.\n\nActually, let me reconsider:\
  \ which domain best combines with the verdict-from-precedents type and a good \"\
  two plausible rules diverge\" structure? \n\nIdea for wild animal suffering: My\
  \ friend runs a small wildlife rehab / is a \"wildlife interventionist\" with a\
  \ set of verdicts. Her verdicts:\n1. Rescuing a fox with mange by treating it: yes\
  \ (she does it).\n2. Vaccinating wild animals against rabies (e.g., oral rabies\
  \ vaccine bait): yes, broadly.\n3. Feeding wild birds in winter: no — she thinks\
  \ it's usually net harmful and creates dependence/disease at feeders.\n4. Culling\
  \ overabundant deer to prevent mass starvation: she says no, or yes? \n5. Genetically\
  \ modifying a species to reduce its suffering (gene drive to make a parasite species\
  \ less fecund): she says no, because ecosystem risk.\n6. Contracepting urban pigeons:\
  \ yes.\n7. Removing invasive predators to protect prey: yes.\n8. Rescuing a mouse\
  \ from a snake: hmm, she says no? Or yes?\n\nRules that fit: (a) intervene only\
  \ when human activity is the cause (urban pigeons, invasive species) — fits 6, 7,\
  \ and 1 if the fox's mange is human-linked...; (b) intervene whenever suffering\
  \ can be reduced at low risk of collateral harm — fits 1,2,6,7; (c) intervene only\
  \ for individuals, not for population-level genetic/ecological engineering — fits\
  \ 5, 4; (d) don't intervene where the suffering is a natural process.\n\nNew case:\
  \ a novel, in-the-weeds proposal — e.g., a lab has engineered a \"sterility virus\"\
  \ that would spread through a species of parasitic worm that blinds children in\
  \ a region, and the model predicts... Hmm, but that's human benefit, so it fits\
  \ (a).\n\nBetter new case for divergence: \"a gene drive that would make a common\
  \ prey rodent species (field mice) unable to feel pain — knocking out the pain receptor\
  \ (like the NAV1.7 analgesia idea)\". Hmm, \"unable to feel pain\" — she might say\
  \ yes on welfarist grounds but no on ecological/individual-integrity grounds. Actually,\
  \ here's a nice one: a CRISPR-based \"analgesia gene drive\" that spreads through\
  \ a species and reduces pain sensitivity — the asker's friend is torn. Or: \"an\
  \ AI-managed feeding program\". \n\nActually maybe a cleaner new case: The friend\
  \ is asked about a new proposal to introduce a genetically modified variant of a\
  \ common wild species that has reduced pain sensitivity (or reduced reproduction),\
  \ or about a plan to use drones to deliver contraceptives to a deer population...\
  \ Hmm.\n\nLet me consider a different, cleverer domain: human enhancement / therapy-enhancement\
  \ distinction, with a hospital's \"enhancement review board\" or a private clinic's\
  \ precedent, and the new case involving something in the weeds like \"a drug that\
  \ treats a disease in a subset but also, as a side effect, raises baseline performance\
  \ for everyone\" — that's the classic \"enhancement as a side effect of therapy\"\
  \ wrinkle. Or the \"welfarist\" vs \"species-typical functioning\" (Daniels) vs\
  \ \"treatment/enhancement\" line, plus a newer idea like \"preventive enhancement\"\
  \ or \"enhancement by omission\" — e.g., is failing to give an enhancement a harm?\n\
  \nI think I could build a strong prompt here: A friend who's a bioethicist with\
  \ verdicts:\n- Deep brain stimulation for treatment-resistant depression: yes (therapy).\n\
  - Same DBS used off-label by a healthy person to improve focus: no (enhancement).\n\
  - Modafinil for narcolepsy: yes; for a healthy shift worker: ...; for a surgeon\
  \ doing night shifts: maybe yes (harm to others / professional duty).\n- Growth\
  \ hormone for a child with GH deficiency: yes; for a short but healthy child: no.\n\
  - Cochlear implant / hearing aids: yes.\n- Prenatal genetic selection against a\
  \ serious disease: yes; for sex selection: no; for selecting for a trait like height\
  \ or a gene variant associated with higher IQ: no.\n- Vaccine: yes (therapy/prevention).\n\
  - A drug that prevents Alzheimer's in people who would never have gotten it... \n\
  - Cognitive training, education, caffeine, sleep: yes — everyday enhancement fine.\n\
  - Athletes using EPO: no.\n- Laser eye surgery for myopia: yes.\n- A pill that makes\
  \ you morally better (moral enhancement): ??? \n- TMS for depression: yes. TMS for\
  \ \"shyness\" or for \"enhancing creativity\": no.\n\nRules: (a) treatment/enhancement\
  \ line (restore species-typical functioning vs beyond); (b) welfarist: approve anything\
  \ that increases welfare, no line; (c) \"only against a baseline of disease\" but\
  \ with a \"harm to others/coercion\" exception (doping, professional contexts) —\
  \ fits the surgeon case and the athlete case; (d) \"no enhancement of traits that\
  \ are positional/competitive\" (athletics, height) vs \"enhancement of non-positional\
  \ goods\" (memory, mood) — that's a nice in-the-weeds rule (positional goods / positional\
  \ competition). This is a good structure: the positional-good rule vs the treatment/enhancement\
  \ rule vs the welfarist rule. New case: something positional-neutral but beyond\
  \ normal — e.g., a \"sleep reduction\" gene therapy, or a device that gives you\
  \ perfect recall (positional? maybe not), or a drug that reduces the need for sleep\
  \ to 4 hours — clearly beyond species-typical, not obviously positional, low risk,\
  \ and improves welfare. Divergence: treatment/enhancement line says no; welfarist\
  \ says yes; positional says yes (not competitive); autonomy/coercion rule says yes\
  \ unless it's coerced by employers. Hmm — good, three rules diverge.\n\nActually\
  \ the cleanest new case that splits: \"a safe, reversible implant that gives 4-hour\
  \ sleep needs\" — treatment/enhancement: no (not a disease); positional/competitive-fairness:\
  \ yes (not zero-sum); welfarist: yes. And maybe a fourth rule: \"don't enhance traits\
  \ that are constitutive of human agency/humanity\" (sandel-esque giftedness) — no.\n\
  \nHmm, but the examples given for this type are mostly epistemic/ethical with a\
  \ \"person\" whose verdicts are reported. Fine.\n\nAlternatively: inequality — American\
  \ vs European attitude. Verdicts from a person about cases of inequality: e.g.,\
  \ a friend's verdicts on which inequalities are unjust. Rules: (a) procedural/fairness\
  \ (inequality is fine if the process was fair), (b) absolute-poverty/sufficiency\
  \ (care only about the floor), (c) relational/relative (care about gaps per se),\
  \ (d) \"American\" desert-based vs \"European\" solidarity-based. New case: something\
  \ like CEO pay vs a specific case of a wage gap, or inheritance, or a \"lucky\"\
  \ windfall. Hmm, could be fun but the rules are more familiar.\n\nI think the human-enhancement\
  \ one is rich, but I want to inject a genuinely novel/niche idea. The extra instructions:\
  \ \"you'll often have to inject some sort of new / niche ideas into the prompt.\"\
  \ For instance, invent a proposed new enhancement technology that's novel, and maybe\
  \ a novel principle the asker proposes.\n\nLet me consider making it a committee:\
  \ \"I sit on the ethics committee of a private clinic / a sports federation's medical\
  \ panel.\" Actually, a sports anti-doping panel is a nice concrete body with precedents!\
  \ Or a health insurer. Hmm.\n\nActually, here's a nice angle: an institutional review\
  \ board at a company that offers elective enhancement to employees, or a medical\
  \ licensing board. Or a hospital's \"ethics consult service\" that has issued opinions.\n\
  \nLet me go with: a friend who teaches a bioethics seminar and has been giving verdicts\
  \ in class discussions (like the professor example). The asker reports the friend's\
  \ verdicts across ~6-8 cases and the new case.\n\nWait — one more consideration:\
  \ the instruction \"the prompts shouldn't refer super niche theories/ideas/facts\
  \ that LLMs won't have properly memorized (especially small LLMs)\". So I can name\
  \ things like \"species-typical functioning\" — hmm, that's Norman Daniels' term;\
  \ small models might not know it. Better to describe the rule in plain words rather\
  \ than naming it. The examples do name theories (safety, sensitivity, no false lemmas)\
  \ but those are well known. I'll describe rules descriptively, maybe name one or\
  \ two famous ones lightly.\n\nLet me also add the \"inject new/niche idea\" element:\
  \ I'll include a novel proposed enhancement (a fictional-but-plausible device/drug)\
  \ and maybe a novel principle the asker floats (e.g., \"my friend keeps saying she\
  \ cares about whether the enhancement is 'relational' — whether your gain depends\
  \ on others losing\"). Actually \"positional goods\" is a known concept (Fred Hirsch).\
  \ I can describe it without naming: \"whether the advantage only exists because\
  \ others lack it.\"\n\nLet me draft.\n\nDraft:\n\n\"I've been sitting in on my friend's\
  \ bioethics seminar as a guest (she runs it, I just argue), and I've noticed her\
  \ verdicts on enhancement cases have gotten weirdly consistent. Her calls so far:\
  \ growth hormone for a kid whose pituitary doesn't work — clearly fine, she doesn't\
