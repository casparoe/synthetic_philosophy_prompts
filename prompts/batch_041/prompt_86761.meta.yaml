  Draft:


  Two colleagues, both well-versed in the biology and economics of signalling, are
  arguing over how honest signals are maintained. One holds the handicap view: a signal
  is reliable because it is costly, and specifically because its marginal cost falls
  more heavily on low-quality signallers, so that only high-quality signallers can
  afford it; on this view, cost is the general engine of honesty, and cases that look
  cost-free are either misdescribed or are limiting cases of an extreme cost. The
  other holds what might be called the index view: reliability can be secured without
  any handicap, because some signals are physically constrained by the signaller''s
  quality (they cannot be faked at all), and because receivers can enforce honesty
  through repeated interaction and punishment; on this view cost is neither necessary
  nor sufficient, and the handicap principle overgeneralises a special case.


  Ask the model to write their dialogue. Constraints:

  - Each character should be competent and should engage the other''s strongest version.

  - Introduce two concrete cases for them to work through: a signal that is cheap
  but reliably honest because it is physically impossible for low-quality signallers
  to produce it; and a signal that is expensive yet unreliable because all signallers
  pay the same cost. Use these to test each theory.

  - Let the handicap theorist make the "everything can be recast as a handicap" move
  and let the index theorist say whether that rescues the principle or empties it.

  - Let them reach at least one genuine point of agreement and one unresolved disagreement,
  without a narrator declaring a winner.


