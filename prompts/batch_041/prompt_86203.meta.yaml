  Let me weigh: the desiderata type wants requirements with motivating cases, negotiable
  vs non-negotiable, jointly-unsatisfiable subsets, and which requirement does the
  most excluding. For the Judy Benjamin domain, that maps beautifully:


  Requirements:

  1. Handle the core case (Judy Benjamin) with the intuitively right answer — but
  note the ambiguity: the requirement must specify whether the input is a material-conditional
  fact or a conditional-probability constraint. This is where the deep issue lies:
  the input format is itself part of the theory.

  2. Agreement with Bayesian conditionalization in the limit (learning the antecedent,
  or learning the consequent, or learning ~A).

  3. Reduction/consistency: if you learn "if A then B" and also later learn A, you
  must end up at P(B|A)... i.e., commutativity/order-independence (path independence).

  4. Invariance: the update shouldn''t depend on how the partition is carved (the
  "problem of the partition"/Bertrand-style worries), or on the parameterization of
  the probability space. But careful — some invariance requirements might conflict.

  5. Respect for Adams'' thesis: at least a qualitative link between the update and
  the acceptability of the conditional (learning "if A then B" should raise credence
  in the material conditional? or should track P(B|A)?). Note there''s tension: Adams''
  thesis concerns assertibility, not credence.

  6. Must not violate the probability axioms / must be a proper probability.

  7. Must handle iterated and conflicting conditional inputs, and the "old evidence"
  problem? Maybe not.

  8. Must avoid the triviality results (Lewis''s triviality: if P(A→B) = P(B|A) for
  a connective →, triviality follows) — so a theory that identifies the learning input
  with the material conditional is in trouble.

  9. Must handle learning a conditional when you already know the antecedent is false
  (then "if A then B" is vacuously true, or assertibility is undefined) — this is
  the "conditional with a false antecedent" case; relevant for Judy Benjamin since
  the radio''s statement is informative only if she''s in blue.

  10. Must handle the case where the conditional is about the world rather than about
  the speaker''s knowledge ("indicative vs. subjunctive" or "the information is about
  the world''s structure, not about the partition").

  11. Must say something about whether the update is "non-commutative"/whether order
  matters; and the requirement of "no gratuitous changes to probabilities of things
  unrelated to A and B" (a conservatism/rigidity requirement, à la Jeffrey''s rigidity,
  or the "irrelevant changes" critique of max-entropy).


