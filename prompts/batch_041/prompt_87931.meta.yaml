  I am a journalist who covers the behavioural and social sciences, and I am fact-checking
  a passage from a colleague''s forthcoming book on what she calls "the politics of
  persuasion." The passage is meant to introduce the nudge idea to a general readership.
  I have my suspicions about it but I am not a specialist, and I would rather not
  print a correction to a correction. The passage runs as follows:


  "Behavioural economists have a name for the art of steering people toward better
  choices without banning anything or changing the price of anything: a nudge. The
  insight, due to Thaler and Sunstein, is that we think with two systems — a fast,
  intuitive one and a slow, deliberative one — and that in most decisions it is the
  fast system that decides. A nudge therefore works by arranging the options so that
  our biases do the work for us: fruit at eye level, organ donation as the default,
  a text message reminding you to vote. Because nothing is forbidden and no one is
  made worse off, a nudge leaves the chooser''s freedom entirely intact; that is precisely
  what separates it from a tax, a fine or a ban, and it is why the approach is called
  libertarian paternalism — paternalist because it aims at your own good, libertarian
  because the cake is still there for anyone who wants it. Nor is there any real conflict
  with autonomy: the nudge only influences those whose fast system is getting the
  better of them, while the person who is already choosing well is unaffected. That
  is what makes the whole programme ''asymmetric.'' The familiar objection, that nudging
  is manipulation, was put to rest when the behavioural insights unit inside the UK
  government showed that nudges produce large and lasting changes at negligible cost,
  and that people overwhelmingly approve of them once they are told about them."


