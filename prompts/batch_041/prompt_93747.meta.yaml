  Draft:


  "For the final meeting of my seminar on existentialism I want to close with a villanelle
  rather than a lecture, and I''d like you to write it. The subject is bad faith,
  but I don''t want the poem to use the term or to explain the concept: it should
  be spoken by someone enacting it. Give the two refrains to the two flights that
  Sartre''s account treats as the same evasion — the retreat into facticity (I am
  simply what I have always been, a waiter, a coward, a nature) and the retreat into
  pure transcendence (I am nothing at all, and so nothing I do is really mine). The
  villanelle''s returns should do the work that the metastable structure of bad faith
  does in Sartre: a belief that cannot hold itself and so must keep reasserting itself,
  each refrain undoing the other. Do not let the poem resolve into a synthesis or
  a moral; end with the refrains side by side, still unreconciled, so that a reader
  who knows the account sees that the two evasions are one gesture and that neither
  is an exit. I''d rather you keep the waiter and the woman whose hand stays in another''s
  hand as materials than that you allude to them by name. Close with a brief prose
  note, outside the poem, on where the poem takes liberties with Sartre or leans on
  a contested reading, how confident you are in that reading, and the single point
  you are least sure is faithful to him. Write in British English, and end with a
  final line in the form \answer{...} containing a one-sentence summary of the poem''s
  central claim."


