  My reasoning is this. The veil of ignorance is a device for choosing under uncertainty:
  I do not know which social position I will occupy, so I should choose the principles
  that maximize my expected utility, or, if I am extremely risk-averse, maximize the
  minimum. The difference principle, as I understand it, tells us to arrange inequalities
  so that they benefit the least advantaged. That sounds like maximin. And maximin
  is just expected-utility maximization with an infinite coefficient of risk aversion.
  So is Rawls''s difference principle simply a special case of a more general welfarist
  decision theory, with the veil of ignorance supplying the uncertainty and the difference
  principle supplying the extreme risk aversion? If so, then the disagreement between
  Rawls and utilitarians is not really about the nature of justice but about how much
  risk aversion is reasonable behind the veil. And if that is right, then the difference
  principle has no special authority: it is one point on a continuum of risk attitudes,
  and a less risk-averse chooser would be equally justified in selecting a utilitarian
  principle.


  I would be grateful if you could tell me whether this is a misunderstanding, and
  if so, exactly where it goes wrong. I am less interested in a general summary of
  Rawls than in a precise diagnosis of the inference I have made. Please do not give
  me a reading list or citations; I want the argument.


