  Maitland''s translation of Poincaré''s Science and Method. The passage reads: "The
  conception of the ''working hypothesis,'' provisional, approximate, and merely useful,
  has more and more pushed aside the comfortable eighteenth century conception of
  ''laws of nature.''" A few sentences later, the preface quotes Poincaré as saying:
  "It is a mistake to believe," he said, "that the love of truth is indistinguishable
  from the love of certainty;" and again: "To doubt everything or to believe everything
  are two equally convenient solutions; both dispense with the necessity of reflection."
  I think I understand the general rhetorical point—that scientific theorizing is
  more provisional than the eighteenth century supposed—but I can''t get clear on
  what it would mean for the concept of a "law of nature" to be "pushed aside" by
  the concept of a "working hypothesis," and why Poincaré would connect that shift
  to the virtue of doubt. My seminar has been focused on the technical result that
  deterministic systems can have sensitive dependence on initial conditions, and I''ve
  been assuming that the interesting question is whether determinism is true. But
  this passage makes me suspect Poincaré is after something else: maybe that "determinism"
  and "law" are features of our descriptions rather than of the world, or that the
  real issue is the attitude we take toward our models. I have a friend in the seminar
  who keeps saying that chaotic systems are "indeterministic" because we can''t predict
  them, and I want to be able to say precisely what is wrong with that without just
  repeating the standard distinction between determinism and predictability. Could
  you help me understand the passage? Specifically: what is the force of "pushed aside"
  here—is it a claim about scientific practice, about metaphysics, or about the meaning
  of "law"? How does the "working hypothesis" conception change what we are asserting
  when we say that a system is governed by a law? And does Poincaré''s emphasis on
