  Now, is there anything about the non-negativity result that''s contested? Yes: it
  holds for a Bayesian EU maximizer with state-independent (belief-independent) utility,
  free information, no cost, information available before the decision, and the decision
  problem fixed. Known caveats:

  - If utility depends on beliefs (e.g., you''d rather not know you have a terminal
  illness), information can reduce expected utility. This is the classic "value of
  information can be negative with non-state-independent utility" (e.g., "the value
  of information can be negative" literature; also "information aversion", "ostrich
  effect").

  - If the agent is not an EU maximizer (e.g., ambiguity-averse / non-additive priors),
  value of information can be negative (there''s literature: e.g., "The value of information
  for ambiguity-averse agents can be negative" — Wakker? Actually "ambiguity aversion
  and the value of information can be negative" — a known result).

  - Costly information: net value can be negative (that''s what EVSI is for).

  - Delay: the information arrives too late to be usable, or waiting itself has a
  cost.

  - Dynamic/strategic settings: information can be leaked, others observe your acquisition;
  acquiring info can reveal your type.

  - The agent may not be able to commit to ignoring the info (e.g., legal duties,
  or regret, or others'' expectations).

  - Good''s argument also assumes you''ll actually update correctly (no processing
  errors), and that the info doesn''t change your likelihood model in unexpected ways.

  - Also: the "non-negative" result is about expected value *ex ante*; ex post, the
  info can be useless or make the realized outcome worse — it doesn''t imply you''ll
  be glad, or that you''ll win.

  - Also, there''s a subtlety: the theorem says non-negative expected value for the
  decision problem; but you might care about more than one decision problem, or the
  info may arrive before you know what the decision problem is.

  - Also the theorem doesn''t say the info is worth its cost, nor that more info is
  better than less (with fixed cost, marginal analysis), nor that you should delay
  a decision.

  - Also, "value of information" for a *single* decision vs. for a *sequence* of decisions;
  and the value of info when you can also choose to gather it adaptively.

