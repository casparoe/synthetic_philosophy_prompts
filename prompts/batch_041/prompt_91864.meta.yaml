  I am an undergraduate in a seminar on the moral status of non-human minds, and for
  our final session we have been asked to bring a poem rather than a paper. The topic
  we keep circling is the idea that sentience is not a threshold but a ramp: that
  a bee, a fish, a mouse, and a person stand at very different points on a single
