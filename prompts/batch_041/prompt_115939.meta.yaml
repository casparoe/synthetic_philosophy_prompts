  Draft:


  I am a journalist writing a long-form piece on the philosophy of logic, and I have
  spent the past few months sitting in on a graduate reading group devoted to the
  tortoise-and-Achilles puzzle about modus ponens. The room has split into camps that
  seem to talk past one another. One camp treats the puzzle as a genuine regress:
  no matter how many further premises you add—if p then q, p, therefore q, and then
  a premise saying that if the first two are true the conclusion must be true—the
  tortoise can always ask for the rule that licenses the step, so deduction can never
  be justified to someone who does not already infer. A second camp says this is a
  confusion: the tortoise illicitly treats a rule of inference as if it were another
  premise, and once you distinguish believing a conditional from being disposed to
  infer according to a rule, the regress evaporates. A third camp insists the real
  issue is the normativity of logic: what is at stake is not whether we can add a
  premise but whether logical rules can be binding on thought at all, and whether
  that bindingness is a matter of truth, entitlement, or something practical. A fourth
  camp suspects the whole debate is a pseudo-problem generated by a bad picture of
  justification, in which every reason must be a further proposition. I want a diagnosis,
  not a survey. You are an expert in philosophical logic, epistemology, and the theory
  of reasoning. Before you answer, brainstorm the candidate fault lines: is this a
  substantive disagreement about the structure of justification, a verbal dispute
  about the word justification, two camps answering different questions under one
  heading—one about the metaphysics of inference, one about the psychology of rule-following—or
  a hidden formal point about rule-circularity versus premise-circularity? Consider
  the distinction between a warrant that consists in a further premise and a warrant
  that consists in an entitlement or a rule of inference, and the distinction between
  theoretical justification and practical entitlement. Then give me your best diagnosis,
  with reasons drawn from what each side actually claims, and tell me what would count
  as progress: a distinction, a formal result, a change of question, or an argument
  that no progress should be expected and why. I am especially interested in whether
  the impasse is a sign that the question is ill-posed or just that it is hard, and
  whether any of the camps has quietly assumed a controversial theory of what it is
  to follow a rule.


