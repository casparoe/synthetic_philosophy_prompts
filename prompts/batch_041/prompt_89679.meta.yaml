  At a reading group on AI safety, two researchers, Dana and Elias, got into a dispute
  over a proposed definition of side effects for a low-impact agent. The proposal,
  which Dana favors, is this: given a task specification as a set of goal predicates,
  an agent''s side effects are the changes it causes in the environment that are not
  logically or causally necessary for satisfying those predicates. To make this measurable,
  the group had suggested scoring side effects by the magnitude of change in a fixed
  feature space, where features are chosen for task relevance by a human designer.
  Dana says this shows side effects can be defined without a full specification of
