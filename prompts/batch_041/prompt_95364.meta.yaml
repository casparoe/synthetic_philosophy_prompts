  a single conditional with a conjunctive antecedent, and whether the second speaker
  can accept that principle without reinstating the triviality result. The first speaker
  should not merely repeat the result; they should explain why it is not an artifact
  of a bad formalization. The second should not merely assert that primitive conditional
  probability is different; they should specify the formal cost.


