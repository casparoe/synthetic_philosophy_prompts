  I am a retired mathematical statistician who has spent the last several years reading
  philosophy of language and probability. I am putting together a dialogue for a small
  reading group on the triviality results for indicative conditionals, and I would
  like you to write it. The dialogue should be between two equally competent philosophers.
  The first holds that the triviality results are decisive: once we accept that the
  probability of an indicative conditional is the conditional probability of its consequent
  given its antecedent, and once we allow conditionals to be embedded in larger sentences,
  the thesis collapses into the claim that conditional probability is just unconditional
  probability, so indicative conditionals must not express ordinary propositions.
  The second holds that the results can be absorbed by treating conditional probability
  as a primitive notion rather than as a ratio, and by restricting the equation to
  unembedded conditionals, with a separate treatment of embedded occurrences.


  Let them begin with a simple finite probability space and reconstruct the triviality
  argument in enough detail that a reader can see which premises do the work. Then
  let them disagree about which premise should be rejected. The second speaker should
  propose the primitive conditional probability maneuver and the first should press
  on whether it genuinely avoids the result or merely relocates it. The second should
  respond by saying exactly what changes in the logic of conditionals and what is
  lost. They should discuss embedding: what happens when conditionals appear under
  negation, disjunction, or probability operators, and whether the primitive view
  can assign probabilities to such compounds. They should also discuss the principle
