  Draft:


  "I teach a graduate seminar in formal epistemology, and the term ends with the Dutch
  book theorem; my students can reproduce the proof but they treat it as a parlor
  trick — a clever way of fleecing a fool — rather than as an argument about what
  it is to hold a credence at all. I want to close the last meeting by reading a poem
  aloud, and I''d like you to write it. I''ve been asking them all term to notice
  that the theorem has two lives: the blunt, pragmatic one, where the incoherent agent
  is simply someone a bookie can pick clean, and the depragmatized one, where the
  betting talk is supposed to drop out and leave a claim about credence itself — with
  the standing objection, voiced by a student of mine who refuses to bet on anything,
  that being the sort of person who would lose money is not the same as being the
  sort of person who believes something incoherent.


  So: a poem of six quatrains and a closing couplet, in loose iambic pentameter, with
  a refrain that comes back word for word at the end of every quatrain. The refrain
  should be the bettor''s own statement of the odds — her credence spoken aloud, in
  the first person — and it must not change, because the whole point is that the credence
  stays where it is while the book closes around it. Let each quatrain be one leg
  of the book: the bookie quoting a price, naming the stake, stating what the ticket
  pays and on what condition, and the bettor taking it because, one ticket at a time,
  the price looks fair to her. The couplet does the tally — and it should be a genuine
  tally, with numbers that add up, not a gesture at ''probability''. I want the arithmetic
  to be visible: the credences in question should fail to sum to one, and the reader
  should be able to see, without any commentary, that the total paid exceeds the total
  that can possibly come back, whichever way the world falls.


  Two further things, and they matter more than the form. First, the poem has to leave
  room for the objection: somewhere the bettor — or a voice she is allowed — should
  say that she never asked to gamble, that she only ever said how likely she took
  something to be, and that a wallet is not a mind; the bookie should not be given
  a cheap answer to this. Second, a reader who has never heard of a Dutch book should
  be able to reconstruct the whole argument from the poem alone, and a reader who
  has heard of it should recognize the particular book you''ve built — so keep the
  mechanics exact. Please don''t name any philosophers or cite any papers; I''d rather
  the poem stand on its own feet."


