  - make sense of probability in a deterministic theory (Everettian branches all occur);

  - handle the "incoherence" or "Dutch book" arguments: an agent who doesn''t use
  Born weights is vulnerable to a sure-loss book (Deutsch–Wallace);

  - respect branch symmetry / avoid double-counting branches — the "branch counting"
