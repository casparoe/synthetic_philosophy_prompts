  counting branches gives equal weights, conflicting with Born;

  - be compatible with the fact that the Hilbert space has a preferred measure (the
  inner product) — the "measure of existence" issue;

  - not smuggle in a collapse or hidden variable or extra stochastic dynamics (that''s
  the point of MWI);

  - self-locating uncertainty: the agent doesn''t know which branch they''re on (Vaidman''s
  "measure of existence", Saunders, Sebens & Carroll''s "self-locating uncertainty"
  argument, Wallace''s decision theory, and the "Epistemic separability principle");

