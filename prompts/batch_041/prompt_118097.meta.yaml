  What''s a good subtle confusion? Common confusion: illusionism = eliminativism,
  i.e., denying that consciousness exists, saying we''re zombies. Frankish explicitly
  says illusionism is not the view that we''re zombies — it''s that we have experiences,
  but their phenomenal properties (the supposed ineffable, intrinsic, private, self-luminous
  qualitative character) are an illusion generated by introspective misrepresentation.
  So the false presupposition: "if illusionism is right, then nobody actually experiences
  anything — pain doesn''t hurt, colors aren''t seen — we just think we do. So how
  do illusionists explain why we''re so convinced?" The subtle confusion is conflating
  the illusion of phenomenal *properties* (qualia as conceived) with the illusion
  of *experience itself*. Illusionism says experiences are real (it''s a realist view
  about experience, eliminativist only about phenomenal properties/quale).


  Another possible confusion: treating "illusion" as requiring a subject who is deceived,
  and thus illusionism being self-undermining — because if consciousness is an illusion,
  who is having the illusion? Or the "illusion of phenomenality must itself be phenomenal"
