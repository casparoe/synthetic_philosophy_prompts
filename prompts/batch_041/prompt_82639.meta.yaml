  they add weight when claims are unequal? So the theory is either committed to absurd
  conclusions or it smuggles in aggregation."


  Subtle misrepresentations:

  1. "Scanlon tries to avoid this by saying numbers count when the claims are equal"
  – this is roughly right, but the summary might mischaracterize the tie-breaking
  argument. It might say that Scanlon allows numbers to count only when claims are
  exactly equal, which is a simplification. Actually, Scanlon''s tie-breaking argument
  is more nuanced: he argues that in cases of equal claims, the principle of saving
  the greater number is not reasonably rejectable because it respects each person
  equally. But the summary might say he "adds up" the equal claims, which would be
  aggregation. The subtle error: conflating tie-breaking with aggregation. A careful
  contractualist would object that tie-breaking is not aggregation; it doesn''t sum
  claims, it provides a fair way to choose when claims are equal. So the summary''s
  claim that if numbers can break ties, they can add weight is a misunderstanding.

  2. The summary might say "contractualism cannot account for the moral importance
  of numbers" as a refutation. But Scanlon does account for numbers in some cases
  (equal claims). The standard objection is that it cannot account for numbers when
  claims are unequal. The summary might overstate: "contractualism cannot account
  for numbers at all." That''s a misrepresentation.

