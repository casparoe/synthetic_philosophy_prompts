reasoning_summary: "The user wants a prompt in the style of a longtime rationalist\
  \ blogs/forums reader, casual, possibly a typo or two. Type: \"Present a question\
  \ and a student's answer to it, and ask the model to grade the answer.\" Domain:\
  \ pick one of the five. Let me pick \"The nonidentity problem\" — good for a grading\
  \ prompt with subtle mistakes. Or Rorty's neopragmatism. Or strategy-stealing assumption.\
  \ Nonidentity problem is a nice analytic philosophy topic with subtle mistakes possible:\
  \ conflating the nonidentity problem with the repugnant conclusion, misattributing\
  \ Parfit's \"same number quality claim\", confusing \"wronging\" with \"harming\"\
  , the person-affecting restriction, the \"no-difference view\", etc.\n\nThe instruction:\
  \ prompts should be somewhat in the weeds, not regurgitate pretraining, and shouldn't\
  \ rely on citations. Inject new/niche ideas into the prompt. So I should embed some\
  \ specific framing, maybe a made-up-ish but reasonable distinction or a specific\
  \ scenario, and ask the model to grade.\n\nLet me design: A homework question about\
  \ the nonidentity problem, specifically about whether the nonidentity problem shows\
  \ that person-affecting intuitions are untenable, and whether \"harm\" can be non-comparative.\
  \ Then a student answer that is genuinely mixed: gets the basic structure right\
  \ (Parfit's 14-year-old girl / \"the girl who chooses to have a child now\", depletion\
  \ example), but makes subtle mistakes:\n\n1. Conflates the nonidentity problem with\
  \ the repugnant conclusion (or says solving one solves the other).\n2. Misattributes\
  \ the \"no-difference view\" — actually says it's Parfit's view that identity doesn't\
  \ matter for moral status... hmm.\n3. Says the nonidentity problem presupposes the\
  \ \"person-affecting restriction\" is false, when actually the problem is generated\
  \ for person-affecting views.\n4. Says that because the child's life is worth living,\
  \ there's no harm, so the act is permissible — that's actually a move that would\
  \ need the \"same number\" or a claim that a life worth living can't be a harm.\n\
  5. Conflates \"wronging\" with \"harming\" in the wrong direction.\n\nAlso to inject\
  \ a niche idea: maybe the prompt includes the instructor's own note introducing\
  \ a specific distinction, e.g., a \"narrow\" vs \"wide\" person-affecting restriction,\
  \ or the idea that the nonidentity problem arises for \"same-people\" comparisons.\
  \ Or inject a made-up but plausible framework like the \"harm-to-the-actual-child\
  \ vs harm-to-the-child-who-would-have-existed\" distinction. Better: the professor's\
  \ question could ask the student to evaluate a specific argument the professor sketches\
  \ — so the prompt is self-contained and doesn't depend on citations.\n\nLet me be\
  \ careful about attributions: Parfit's \"Reasons and Persons\" (1984) — the nonidentity\
  \ problem is chapter 16, \"the non-identity problem\". The 14-year-old girl example\
  \ is Parfit's. The \"repugnant conclusion\" is also Parfit. The \"no-difference\
  \ view\" is Parfit's term in Reasons and Persons. I should avoid leaning on specific\
  \ attributions in ways that might be wrong. Since the prompt is a homework question\
  \ with a student answer, attributions matter somewhat — the student could misattribute\
  \ something and I need it to be actually wrong, which requires me to be right.\n\
  \nSafe approach: keep attributions minimal or use ones I'm confident about:\n- Parfit\
  \ introduced/popularized the nonidentity problem in Reasons and Persons (1984).\
  \ Confident.\n- The 14-year-old girl example is Parfit's. Confident.\n- \"Repugnant\
  \ conclusion\" is Parfit's, from Reasons and Persons. Confident.\n- The \"no-difference\
  \ view\" is Parfit's term in Reasons and Persons (Part IV). Fairly confident.\n\
  - Derek Parfit also coined \"the non-identity problem\". Confident.\n- \"Person-affecting\"\
  \ terminology comes from Narveson (\"Utilitarianism and New Generations\", 1967)\
  \ — Narveson used \"person-affecting\". Reasonably confident but I could avoid.\n\
  - \"The nonidentity problem\" also discussed by David Heyd, \"Genethics\". Also\
  \ Gregory Kavka's \"The Paradox of Future Individuals\" (1982) — Kavka's slave child\
  \ / \"the paradox of future individuals\". Confident-ish.\n\nMaybe I should avoid\
  \ attributions entirely and have the student answer reference \"Parfit's cases\"\
