  Let''s draft:


  "I am not a philosopher or a neuroscientist. I am a high school biology teacher,
  and next Saturday I am giving the eulogy at the memorial service for my older brother,
  Daniel. Daniel had a progressive neurological disease. Over about eighteen months,
  he underwent a gradual replacement of his brain tissue with a prosthetic system
  that copied the connections of each neuron before the biological one failed. He
  was awake for the whole process. He was still himself in every way that mattered
  to us for most of it. His last biological neuron was replaced on a Tuesday in March.
  Since then, the prosthetic system has continued to talk with his voice, remember
  his memories, and ask about his children. His wife, who is a nurse, believes Daniel
  died on that Tuesday. His two teenage children are not sure. His lab colleagues,
  who are not philosophers but who worked with him on the prosthetic, believe he is
  still with us and that the Tuesday story is a kind of superstition. The memorial
  will be in a Unitarian church hall. About half the room will be family and friends
  who share his wife''s view, and about half will be colleagues and friends who share
  the lab''s view. The prosthetic system has said it will not attend, but it has sent
  a letter to be read by someone else. I do not want to give a eulogy that pretends
  to settle the question of when Daniel died. I also do not want to give a eulogy
  that is so vague it says nothing. I want to speak about the man I grew up with,
  the man who taught me to fish, the man who could be impossible and generous in the
  same hour, in a way that does not require the room to agree on whether he is dead
  or alive. Please write the eulogy. It should be about five minutes long. It should
  be formal enough for a memorial but not stiff. It should not use academic terms
  like personal identity or continuity of consciousness. It should not tell the audience
  what to believe about the prosthesis. It should find a way to be honest and comforting
  at the same time, and it should let both halves of the room hear their own grief
  acknowledged. The philosophy here is not decoration: the fact that the replacement
  was gradual, neuron by neuron, is what makes the question of when he died so hard,
  and the eulogy has to be built around that difficulty rather than avoiding it."


