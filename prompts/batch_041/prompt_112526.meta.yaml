  closure under entailment, knowledge of all validities, consistency requirements,
  and the absence of any distinction between explicit and implicit belief. The humor
  should come from the formal content, not from generic corporate absurdity. Include,
  for example: an onboarding clause presuming that every new hire has already derived
  every consequence of the handbook; a provision that ignorance of an entailment is
  no defense; an awareness audit; a contradiction clause under which one inconsistent
  timesheet entitles the firm to every conclusion, including the employee’s promotion;
  a reasonable-accommodation form for bounded agents that is itself only available
  to agents who do not need it; and a grievance procedure for an employee who believes
  a conjunction but not one of its conjuncts. A brief memo from the Office of Deductive
  Compliance and a dissenting footnote from a staff logician who has noticed that
  the policy entails its own negation would be welcome. The piece should be funny
  to someone who knows the problem of logical omniscience and legible to someone who
  does not. Do not cite any works or use any real names, and do not break the deadpan
  with a wink to the reader.


