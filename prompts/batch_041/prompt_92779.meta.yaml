  Consider: for Lewis triviality, the analogy in use is the "called-off bet". Who
  uses it? Ramsey''s test; de Finetti; and notably, the analogy is used by people
  defending the "conditional probability = probability of conditional" thesis (Adams''
  thesis) and by Lewis himself in setting up the triviality proof. Lewis''s triviality
  proof starts from "P(A→C) = P(C|A)" and shows it collapses. The bet analogy is used
  to *support* that thesis: a conditional bet on C given A at odds matching P(C|A)
  is fair. Then Lewis''s proof shows the thesis can''t hold for a truth-conditional
  conditional. So the audit question: how far does the bet analogy hold, and does
  it license the equation? Nice: the disanalogy is that the called-off bet has no
  truth conditions of its own — its "payoff" structure is not a proposition that is
  true or false in each world; and in worlds where A is false, the bet is void, so
  the "price" doesn''t correspond to an indicator of a proposition. That''s exactly
  the point. And the analogy quietly imports that the conditional''s semantic value
  is exhausted by its betting behaviour — the "use" vs "truth-conditional content"
  gap. Also, the analogy imports that the payoff is the same in all A-worlds (a fixed
  stake), whereas conditionals vary — hmm, actually de Finetti''s point: a conditional
  bet''s value equals P(C|A)·stake only if the bet is void when A false, so the value
  of the conditional bet is P(A∧C)·stake, and the *fair price* conditional on the
  bet going ahead is P(C|A)·stake — so there''s a subtlety about whether the price
  is paid up front and refunded. That''s a lovely "in the weeds" point: the fair *upfront*
  price of a called-off bet is P(A∧C)·stake, not P(C|A)·stake; it''s only the price
  *conditional on the bet being live* that equals the conditional probability. That
  is a genuine disanalogy that matters. And the triviality result shows that even
  if you grant the equation, a truth-conditional semantics collapses (for P defined
  on a Boolean algebra with the standard assumptions, only trivial conditionals satisfy
  it). Then: does the conclusion the analogy was used to support survive? Answer:
  it survives as a claim about *assertability/credence*, not about truth conditions
  — the analogy supports "the conditional is not a proposition with truth conditions";
  or, alternatively, the analogy supports the Ramsey test but not a proposition-valued
  semantics.


