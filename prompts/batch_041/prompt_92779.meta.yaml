  — that''s not a philosophical thesis, it''s the plumbing of the betting ring. And
  he says this is why he doesn''t lose sleep over Lewis''s triviality proofs: if the
  equation were really impossible, the ring would have noticed, so the proofs must
  be smuggling something in (a weird language, an odd logic, conditionals inside conditionals
  that nobody ever bets on). He wants me to write it up as ''philosophers baffled
  by bookmaking''. Before I do that, I want to know how much of the analogy actually
  holds.


