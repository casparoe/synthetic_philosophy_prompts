  they continue at 1 and exit at 2, payoff 1. The driver is absent-minded: at each
  intersection, they don''t know whether they''re at intersection 1 or 2 (no memory
  of having passed intersection 1). Payoffs: continue at both → 4; exit at 2 after
  continuing at 1 → 1; exit at 1 → 0; continue at 1 then... exit at 1 is 0.


