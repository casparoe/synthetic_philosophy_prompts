  I''m putting together a proposal for a one-year fellowship (roughly 2,000 words).
  My half-formed idea is that the intuition that history turns on trivial accidents
  — the horseshoe-nail picture, where a lost kingdom traces back to a missing nail
  — is doing the work of three claims that are actually independent, and that most
  disputes about historical contingency go wrong by sliding between them. The first
  is causal sensitivity: a small difference in initial conditions issues in a large
  difference later, as in a chaotic deterministic system. The second is metaphysical
  openness: the outcome was not determined by the prior state, so an alternative was
  genuinely available. The third is epistemic: we simply could not have predicted
  the outcome, whatever its modal status. These come apart in both directions — a
  process can be deterministic and exquisitely sensitive, or undetermined yet robust
  to small perturbations — and my suspicion is that the persuasive force of ''contingency''
  talk in history usually rests on the third while borrowing the prestige of the first.
  The further wrinkle I want the project built around is that the technical notion
  of chaos may not apply to historical processes at all, since it is defined for well-posed
  deterministic dynamical systems and social processes are arguably not of that kind;
  if so, invoking sensitivity-to-initial-conditions in history is a category mistake,
