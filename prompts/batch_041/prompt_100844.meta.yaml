  For years I have been reading and occasionally posting on the rationalist forums,
  and I am now writing up the unilateralist''s curse as a long reference post, because
  the standard treatments keep collapsing several different situations into one and
  I want the classification to be correct before I write any prose. The curse, as
  I understand it: when any member of a group can undertake an action on their own
  initiative, and each member forms a private, imperfect estimate of whether the action''s
  expected value is positive, the chance that someone performs the action when it
  is in fact harmful rises toward certainty as the group grows, because the group
  acts if any one member''s estimate is mistaken in the permissive direction. What
  I want from you is a decision tree over the space of cases and responses.


  Build it from the logical space rather than from a list of named views: every internal
  node should be a question a reader could answer without already knowing which leaf
  it leads to, and each leaf should carry the name of a decision procedure or stance
  together with one sentence on its most awkward commitment. Aim for eight to twelve
  leaves, and add a closing note on which single branch does the most sorting work.


  The tree has to keep apart the things people wrongly file under the curse:


  - the actors disagree about values rather than about the facts;

  - they agree on the facts but differ in risk tolerance;

  - the action''s costs fall on people outside the group, who cannot weigh in;

  - coordination fails for reasons that have nothing to do with the curse, such as
  the cost of communication or the impossibility of knowing who else is deciding;

  - and the unilateral option runs the other way, so that any member can unilaterally
  halt or veto a shared undertaking rather than start one.


  I want two branches that I have not seen treated properly. One tests universalizability
  in the sense the curse seems to need: would this action still be defensible if every
  similarly placed actor performed it? The other tests whether the action is information-producing
  — an experiment, a probe, a publication — as against world-altering and irreversible;
  I suspect these two license opposite verdicts, and I want the tree to say where
  they diverge.


  Leaves I expect to find somewhere on the tree, though you should place them where
  the logic puts them rather than where I list them: a conformity rule (act only if
  you would be content for every similarly placed actor to act); a supermajority or
  unanimity requirement before anyone may act; secrecy or mutual precommitment against
  acting; pooling everyone''s evidence before any single actor moves; licensing one
  designated actor to decide; a market or betting scheme to aggregate the private
  estimates; making unilateral action costly; and the laissez-faire stance that each
  should simply act on their own estimate.


  Two things I care about more than the leaves. Mark the combinations that no one
  occupies and diagnose each — is the view incoherent, merely unattractive, or simply
  unexplored? And flag any pair of leaves the tree cannot separate, rather than papering
  over the gap with a node that does no real work.


