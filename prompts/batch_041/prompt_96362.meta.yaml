  Title: The Supervisor Is Always Somewhere Else


  Everyone in AI talks about two ways to supervise a model. Outcome supervision: you
  grade the final answer. The model writes a proof, you check the proof; the model
  writes code, you run the tests. Process supervision: you grade the steps. A human
  (or a second model) reads each line of the reasoning and marks where it went wrong.
  The pitch for process supervision is that outcome signals are sparse and delayed
  — you find out the model was wrong only at the end, and by then you don''t know
  which of forty steps was the bad one. Grade the steps and you get a dense signal
  you can actually learn from.


  My claim is that this framing hides something. Process supervision is not a different
  kind of supervision. It''s outcome supervision with a finer decomposition. Grading
  a step just means treating the step as a small task with its own outcome, and grading
  that. Everything follows: step-level rewards can be gamed just as final rewards
  can; the decomposition into steps is itself a choice, and a bad decomposition makes
  the whole scheme worse than no scheme (if you split a proof at the wrong joints,
  each step looks fine and the sum is wrong); and the human labeller becomes the bottleneck,
  since you now need a human to read every line instead of every answer. So the process/outcome
  contrast is really a contrast in resolution, not in kind. Which raises the question
  of why the two feel so different in practice.


  Two asymmetries explain the feeling. First, cost: some things are cheap to check
  and expensive to do, others the reverse. Process supervision is attractive exactly
  where intermediate steps are cheap to check. Second, and this is the part I think
  is underexplored, legibility. A step has to be written down before it can be supervised.
  So process supervision only ever sees the part of the computation that can be narrated
  to a monitor. The model is under pressure to produce intermediate text that a monitor
  will approve of, and we have no guarantee that this text is the text that actually
  produced the answer. Call this the legibility tax: we pay for the dense signal with
  a systematic uncertainty about whether we''re supervising the process or a performance
  of the process. There''s a test I like here — take the written reasoning, corrupt
  one of its steps, and see whether the final answer changes. If it doesn''t, the
  reasoning was decorative and we''ve been grading theatre.


  That pushes me toward a third option, which I''ll call structural supervision. Instead
  of grading the process, arrange the world so that bad processes defeat themselves.
  The agent that fabricates a citation gets caught by the thing downstream that reads
  the citation. The agent that games the test finds the test regenerated. Nobody grades
  any steps; the environment does the work, and it does it for free, at scale, without
  a human in the loop. In terms of robustness per unit of human labor I''d rank it
  structural, then process, then outcome — but only where you can actually make the
  consequences bite, and I don''t have a principled account of when that''s possible.
  That''s my weakest section and I know it.


  There''s also a regress I can''t close. Someone has to design the environment. If
