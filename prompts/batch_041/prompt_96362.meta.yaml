  up a level rather than solving it, and if it''s designed by a human, structural
  supervision is just very slow process supervision with extra steps. I suspect the
  honest thing is to say that structural supervision isn''t a third kind at all but
  a limiting case where the checking has been compiled into the world, and I''m not
  sure that''s a concession or a discovery.


