  The paradox (as usually put): Deontology includes constraints, e.g., a constraint
  against harming/killing. Constraints can require you to refrain from an act that
  would prevent more violations of the very same constraint. E.g., you must not kill
  one to save five. But then the theory seems to counsel a course of action that leads
  to more of what it forbids. If the point of the constraint is to protect something
  valuable (say, persons not being used as means), then why not minimize violations?
  The paradox: the deontologist seems to be saying "don''t violate rights" and then
  when asked why not minimize rights violations, gives an answer that undermines the
  constraint''s rationale. Nozick''s "utilitarianism of rights" worry: if you make
  constraints minimizing, you get a weird consequentialism of rights.


