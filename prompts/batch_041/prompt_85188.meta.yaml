  (4) A plan is a prediction: it says what we''ll do in 2045 on the assumption of
  what things will be like. If the prediction is impossible, the plan is a fiction
  that will do harm by locking us in.

  (5) So we should scrap the 30-year plan and just do 3-year rolling plans.

