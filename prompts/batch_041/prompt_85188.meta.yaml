  Flaw candidates:

  - (3) is a scope slide from "we can''t predict the specific content of future knowledge"
  to "we can''t predict anything about the future course of events." But you can predict
  many things robustly (population aging given births already happened; aquifer depletion
  given pumping rates; the fact that some discovery will occur; ranges, distributions,
  and conditional if-thens). Also Popper''s own view: we can have conditional predictions
  and can trace unintended consequences.

  - (4) conflates a plan with a prediction: a plan can be a decision procedure / a
  commitment to revise (adaptive planning), or a hedge, or an option-creating strategy.
  A plan doesn''t have to be a forecast; it can be a policy rule that''s robust across
  scenarios. Actually that''s a strong point: "a plan is a prediction" is false —
  a plan can be a set of contingent commitments.

  - (2) itself has a subtlety: it''s true that we can''t know the *content* of a future
  discovery *and* have it be a discovery, but we can know a lot *about* future knowledge:
  that it will grow, roughly how fast in some domains, that certain problems will
  be attacked, etc. Also there''s a self-referential/self-defeating element: predictions
  about knowledge can be self-fulfilling or self-defeating (the Oedipus effect), which
  makes "unpredictable" the wrong word — it''s not that the future is random, it''s
  that predicting changes it.

  - (6) over-generalizes: laws of history in the sense of unconditional long-run prophecies
  being impossible doesn''t mean no social laws; laws can be conditional and can support
  explanation and institutional design. Also, "no laws" is too strong: demographics,
  epidemiology, economics have lawlike regularities.

  - Also: the argument''s form would prove too much in a different way: by the same
  reasoning, no long-lived institution, no contract, no insurance, no saving for retirement
  makes sense — because all of those presuppose some stability/predictability. And
  yet we obviously can do those. Also (3) applied to the argument itself? Hmm.

  - Another: the argument proves that *any* prediction of human affairs is impossible,
  including "if we build the reservoir we''ll be able to serve 400,000 people" — but
  that''s the kind of conditional claim planning actually rests on, and it''s not
  threatened by (2) at all. Actually here''s a nice sharp point: the argument''s conclusion
  (5) itself rests on a prediction — that 3-year rolling plans will work better than
  a 30-year plan. So the argument, if sound, undermines its own recommendation. That''s
  a cute "proves too much" self-undermining point.


