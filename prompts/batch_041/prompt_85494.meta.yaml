  Option A: Gödelian anti-mechanism — desiderata for a Gödelian argument. Very in
  the weeds and technical. The "joint unsatisfiability" result is real: the argument
  must establish that humans can know G is true (which requires consistency/soundness
  assumptions about humans) while not assuming humans are consistent (which would
  be an unjustified idealization and also would let mechanism back in). This is a
  genuine dilemma in the literature (Putnam, Feferman, Chalmers''s "the argument''s
  weakness"). So a desiderata list would surface: (1) The argument must be about knowing/seeing
  truth, not just about being unable to prove; (2) it must not presuppose that human
  mathematicians are consistent (or if it does, it must earn that); (3) it must handle
  the "we might be unsound / our axioms might be wrong" horn; (4) it must handle non-ideal,
  finite, error-prone human mathematicians — the idealization problem; (5) it must
  specify what "grasping" a Gödel sentence consists in, and why that''s not itself
  mechanizable; (6) it must not equivocate between "the machine cannot prove G" and
  "the machine cannot be programmed to output G" (the machine can be programmed to
  output the Gödel sentence of a *different*, weaker system — the level-crossing issue);
  (7) it must account for the fact that humans can also be given the Gödel sentence
  and can also fail to see it; (8) it must respect the distinction between the "algorithmic"
  and the "mathematical" — i.e., the target must be mechanism about the mind, not
  about "the mind as a formal system"; (9) it must handle the "second-order" move:
  whatever system you posit, we can diagonalize again — the regress argument — and
  the counter that this requires an infinite, non-finite ability; (10) it must handle
  the Penrose soundness argument and the objection that "this system is sound" isn''t
  provable by the system but might be knowable by us only fallibly.


