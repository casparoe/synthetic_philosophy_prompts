  The dollar auction is a party game invented by a game theorist to show how easily
  sensible people can be led into ruin. The auctioneer offers a one-dollar bill. Bidding
  is open, and the twist is that both the highest bidder and the second-highest bidder
  pay what they bid, though only the winner receives the dollar. Two bidders will
  push each other past a dollar, past five, past twenty. The reason is the sunk-cost
  fallacy: having invested so much in the chase, neither can bear to write off the
