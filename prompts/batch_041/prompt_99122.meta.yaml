  I recently spent an evening arguing with a close friend about Aumann''s agreement
  theorem, and we could not settle what the theorem is actually supposed to show.
  We both accept the formal result: if two agents share a prior and their posterior
  probabilities for some event are common knowledge, then those posteriors must be
  identical. What divided us was its significance. My friend insisted that the theorem
  places a real constraint on rational disagreement—that when two people who share
  a prior and are both rational persist in disagreeing, something must have gone wrong,
  either in their rationality or in the assumption that their priors really are the
  same. I argued that the theorem is far less useful as a diagnosis of real disagreement,
  because it requires common knowledge of the posteriors and not merely of the fact
  that each has a posterior, and because the agents must also have common knowledge
  of the information structures, signal distributions, and higher-order beliefs that
  generated those posteriors. In an actual argument, those are precisely the things
  we are uncertain about. By the end we were circling each other.


