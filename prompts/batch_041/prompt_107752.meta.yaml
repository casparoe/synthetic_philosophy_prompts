  ---


  I am designing a ninety-minute session for a joint economics and philosophy doctoral
  workshop on the Gibbard–Satterthwaite theorem. The students have had a semester
  of game theory and are comfortable with dominant strategies and Nash equilibrium,
  but they have never seen social choice theory, and none of them works on it. Two
  decisions about the session are already made, and both are slightly heterodox, so
  I want you to take a position on whether they work rather than quietly repairing
  them.


  First, I want to try teaching the theorem backwards: open with the exits — restricting
  preferences to a single dimension so that the median reported peak is the outcome,
  weakening the incentive requirement from dominant strategies to some equilibrium
  notion, admitting randomization, and reducing the number of alternatives to two
  — and let the theorem emerge as the statement of what remains when each exit is
  closed. Tell me whether that order can be made to work, and where in it the students
  will lose the thread.


  Second, I want the session to turn on a distinction I have never managed to convey:
  between manipulability as a worst-case property of a rule and strategic voting as
  a feature of a situation. A rule can be manipulable in the formal sense even though
  no voter in a given situation ever gains by lying, and a strategy-proof rule can
  still produce outcomes that look like the product of manoeuvring. The theorem is
  a robustness result about rules, not a prediction about behaviour, and I want the
  session to leave them with that.


  Plan the session for me — do not explain the theorem to me. I need:


  - the order in which the components must be introduced, with the dependence relations
  made explicit (what has to be in place before what, and why), including a verdict
  on the backwards opening;

  - the single carrying example that should run through the whole session, what it
  must have in order to do its work, and why I should not use the obvious three-voter,
  three-alternative case if you think I should not;

  - the misconceptions the students will arrive with or form, in the order they will
  surface, and the exact point in the sequence at which I should head each off — I
  expect at least: formal dictatorship read as political dictatorship; the theorem
  conflated with Arrow''s; strategy-proofness read as a requirement that people report
  honestly, or as a prediction that they do; the belief that any of the exits above
  is free; and the conclusion that the theorem is a counsel of despair about democratic
  procedures;

  - how much time to give to the hypotheses (at least three alternatives, unrestricted
  domain, the range condition) and how to use the trivial counterexample of a rule
  that ignores the reports altogether;

  - one closing question or task that will tell me whether the worst-case/actual-behaviour
  distinction landed rather than whether they can state the theorem;

  - what I should refuse to explain at this level, and what I should say to mark the
  refusal.


  One substantive point I want the plan to take a position on: I take the equilibrium-based
  weakening of the incentive requirement to buy possibility only at the price of common
  knowledge of beliefs, so that it should appear in the session as a trade rather
  than a triumph. If that is right, say where in the sequence it belongs; if it is
  too crude, say so and replace it.


  Give me the plan in prose with timings, as notes for myself. No readings and no
  citations; I will supply those.


