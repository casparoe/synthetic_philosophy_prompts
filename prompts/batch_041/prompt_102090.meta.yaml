  thought-like (conceptual, reportable) or perception-like, (b) whether it represents
  the first-order state itself or the subject as being in that state, (c) whether
  it has to be occurrent or whether a standing disposition to form it will do, and
  (d) whether the first-order state gets its feel *from being represented* or whether
