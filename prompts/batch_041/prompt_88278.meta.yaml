  a percent — that building powerful AI ends badly for everyone forever, then that
  risk swamps everything else we might do, so it''s the obvious priority and anyone
  who says otherwise is either innumerate or in denial. Camp B says the probabilities
  are unfalsifiable hand-waving built on analogies to evolution and to nuclear weapons,
  that nobody can estimate these things, and that treating a made-up 1% as a real
  1% is the actual error. Both sides seem to agree on a lot of the intermediate facts
  (compute is growing, alignment is hard, we don''t know how to specify goals robustly)
  and disagree about what follows.


