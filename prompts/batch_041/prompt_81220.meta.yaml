  Parfit, Reasons and Persons, Chapter 1 (Part One, "Self-Defeating Theories"): The
  hitchhiker case. Parfit''s example: A hitchhiker is dying of thirst in the desert;
  a driver offers him a ride only if he pays, and the hitchhiker can only pay once
  at his destination; once at the destination, he has no reason to pay (no reputation
  effects). Parfit argues: if he is purely self-interested, he will not pay. But if
  he''s purely self-interested, he can foresee that he won''t pay, so he cannot get
  a ride (he can''t credibly promise). So pure self-interest is "self-defeating" in
  that case — a person with a disposition to keep promises, or who "cares about" being
  trustworthy, does better. Actually Parfit says the hitchhiker could still rationally
  pay if he had a "disposition" that made him unable to cheat — or he could be irrational
  and still do better. Parfit''s point: S (self-interest theory) is "indirectly self-defeating"
  because it tells you to be disposed to do things that aren''t self-interested in
  this case.


  Actually, in Parfit''s case, the hitchhiker''s promise — he could "cause himself
