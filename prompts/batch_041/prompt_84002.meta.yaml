  Draft:


  "Ok so I''ve been teaching the regress argument for about fifteen years and there''s
  a move I keep running into that I''ve never found a proper name for, and it''s starting
  to bug me.


  Every fall, when we do foundationalism/coherentism/infinitism, some student says
  something like: ''why does my belief that there''s a cup on the desk need a reason?
  Nobody''s challenged it. If you want me to doubt it, you give me a reason.'' I used
  to treat that as a misunderstanding and steer back to the standard menu. But the
  same move keeps turning up elsewhere, and in places where it doesn''t look like
  a misunderstanding at all. A colleague in the law faculty put it to me like this:
  a party can object to hearsay, but nobody has to justify the rule against hearsay
  every time a witness opens their mouth — the demand for a warrant has to be *made*,
  by someone who''s entitled to make it, and until it''s made there''s nothing to
  answer. Same thing from a friend who does a lot of stats consulting: you don''t
  have to defend every default setting in a model, only the ones a reviewer actually
  flags, and the reviewer has to say what they think is wrong. And I notice I run
  my own grading the same way — a claim in an essay doesn''t need a defence unless
  I circle it, and when I circle it I have to say why.


  The pattern, as best I can put it: the regress doesn''t get stopped, it never gets
  started, because the demand for a reason is conditional on something happening on
  the other person''s side. It''s not a basic belief (nothing is exempt by its nature),
  not a circle, not an infinite chain that''s somehow fine. It''s a condition on when
  the demand is live. And it makes me nervous for a reason I want priced: if the stopping
  point is ''nobody''s made a proper challenge yet'', then what counts as a proper
  challenge starts to look like something the participants negotiate, and a sufficiently
  stubborn person can protect anything.


  So, two questions. (1) Does this have a name — either the family, or the specific
  version where the condition sits on the challenger''s side? I know there''s stuff
  about entitlements and hinges and defaults and the contextualists have something
  in this area, but I''ve never been able to tell whether any of those is this move
  or four different ones. (2) If there''s no name, coin one, but what I really want
  is the carving. Specifically: what''s the difference between ''this belief needs
  no support'', ''this belief needs no support from you, here, now'', and ''what you''re
  asking for isn''t the kind of thing that can be answered''? Is the third even the
  same phenomenon or just a cousin? And does the move actually terminate anything,
  or does it just move the regress back one step — who justifies the challenge? If
  the honest answer is ''it terminates only relative to a conversation'', fine, but
