  Me and my mate Priya got into a two-hour arguement last night about whether lying
  is actually worse than just misleading someone, and I ended up defending a position
  I''m not sure I even hold, so I want to know how much trouble it''s in.


  Here''s the position. There''s no intrinsic moral difference between lying and misleading.
  The line between them is a fact about mechanism — did a false sentence get uttered
  or not — and mechanism isn''t where the wrongness lives. What makes deception wrong
  (when it is wrong) is identical on both sides: you''re trying to get someone to
  believe something false about something that''s theirs to know about, you''re doing
  it because you think they wouldn''t go along if they knew, and you''re doing it
  for your benefit at their expense. Whether you get there by asserting something
  false or by saying something true in a way that steers them into the false conclusion
  is like whether you hit someone with your left hand or your right. Lying is just
  the cruder tool. So the two things should get the same moral verdict, whatever that
  verdict is: if lying is wrong, so is misleading; and if a bit of misleading is fine
  (surprise parties, a doctor who says the tests are done when what she means is there''s
  nothing left to try, ''sorry, I have plans''), then the same amount of outright
  lying is fine too. The popular feeling that misleading is the milder sin I take
  to be mostly about detection: it''s harder to prove, and the misleader can always
  say ''but I never said that'', which is exactly the thing that makes it feel slipperier
  rather than less bad.


  What I want from you: what counts against this, sorted by how much it should actually
  move me. Not the intro-ethics stuff — I know the standard moves. I want the ones
  specific to how I''ve set it up. Tell me which of these are decisive and which are
  just awkward, and which ones a serious defender of the distinction would themselves
  admit count against them (as opposed to what critics lob at them from outside).


