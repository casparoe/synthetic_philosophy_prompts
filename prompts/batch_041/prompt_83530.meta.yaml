  the other way: misleading recruits the victim. You don''t just get them to believe
  something false, you get them to do the concluding. You set the trap and they walk
  in, and afterwards they can''t even say ''you lied to me'' without sounding like
  they''re blaming you for their own inference. That looks worse to me, not better
  — the misleader keeps a clean conscience and the victim eats the humiliation. Does
  that actually tell against the distinction or just against the people who draw it?


