  Potential prompt:


  I am putting together a seminar on the philosophy of time for students who have
  read Kurt Vonnegut''s Slaughterhouse-Five but have almost no physics, and I want
  to use the novel to teach the Rietdijk–Putnam argument without reducing it to a
  slogan. The novel is usually read through trauma, memory, and fatalism: Billy Pilgrim
  becomes unstuck in time, the Tralfamadorians see all moments as coexisting, and
  the narrator treats death as one moment among others. I want a reading that takes
  that four-dimensionalism seriously as a philosophical position and asks how far
  it actually coincides with the block universe that the Rietdijk–Putnam argument
  is supposed to establish from the relativity of simultaneity. In particular, I want
  you to separate three things that the novel and its critics tend to run together:
  the special-relativistic claim that different inertial observers slice spacetime
  into different planes of simultaneity; the metaphysical claim that all events are
  equally real; and the psychological or ethical attitude that, because all moments
  are equally real, grief and protest are misplaced. Does Vonnegut''s Tralfamadore
  dramatize the first two, or does it smuggle in a single absolute four-dimensional
  manifold and a God''s-eye view that the physics does not license? Where does the
  novel''s time-travel imagery help students see the force of the Rietdijk–Putnam
  argument, and where does it encourage the mistake of treating the block universe
  as a kind of determinism or as a consolation?


  I would like the reading to be faithful in both directions. On the physics side,
  do not simply assert that relativity proves the block universe; explain what premise
  about reality and simultaneity the Rietdijk–Putnam argument needs, and say whether
  the novel supplies it or merely presupposes it. On the literary side, do not reduce
  the novel to an illustration. Use specific scenes or structural features that are
  common knowledge among readers: the Dresden bombing and its aftermath, Billy''s
  jumps between moments, the Tralfamadorian zoo, the way the narrative announces deaths
  before they happen, and the narrator''s own intrusions. I am not asking for a bibliography
  or citations, and I do not need quotations; I want an argument about what the novel
  shows, complicates, or gets wrong about the block universe, and what it adds to
  the philosophical debate that a bare statement of the Rietdijk–Putnam argument does
  not. If the novel resists the reading at some point, say so plainly and explain
  why the honest critic has to concede it.


