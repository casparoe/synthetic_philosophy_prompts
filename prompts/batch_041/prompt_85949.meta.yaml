  Draft:


  "I teach a graduate seminar in normative ethics and I''m drafting the final. Write
  me one 90-minute essay question on the distinction between doing and allowing harm,
  together with a model answer of roughly 600 words and a marking scheme out of 20.


  I want the question to turn on a structural feature rather than on the familiar
  cases. The case it presents should be one in which the only thing standing between
  a person and death is an ongoing, human-maintained process -- a pump keeping a mine
  dry, a ventilator, a drainage tunnel -- so that switching the process off and failing
  to keep it running produce the same death, while the process itself was from the
  start an intervention in what would otherwise have been the lethal course of events.
  The question should force candidates to say what the doing/allowing distinction
  is a distinction between, whether it can be stated without a prior notion of the
  ''natural'' or ''baseline'' course of events, and whether it survives the observation
  that baselines are themselves usually the residue of earlier human interventions.


  The model answer should be self-contained: candidates should not be required to
  name or cite any author, and the answer should not lean on any particular text.
  The marking scheme should name five must-hit points with their marks and a one-line
