  Prompt:


  I am the research director for a state law reform commission. Our legislature routinely
  refers bills that would criminalize conduct many citizens regard as seriously immoral
  but where the harm is disputed: consensual adult incest, assisted suicide for the
  terminally ill, public desecration of national symbols, the production and sale
  of violent pornography, and a proposal to criminalize the purchase of sexual services.
  We are not a court and we are not a philosophy seminar; we have to produce a defensible
  recommendation on each referral within a legislative session, usually with one staff
  attorney and me, and the recommendation has to be usable by legislators who have
  no background in the Hart-Devlin debate. I know the debate well enough—Hart''s insistence
  on critical morality and the harm principle, Devlin''s concern with social cohesion
  and the disintegration thesis, the distinction between enforcing morality as such
  and preventing concrete harm—but what I need from you is not a summary or a reading
  list. I need a reusable decision procedure that operationalizes the debate into
  questions a staff attorney can actually run in an afternoon, with the hard cases
  built in.


  Please write that procedure. It should specify the questions to ask in order, what
  counts as a sufficient answer at each step, where the procedure terminates in a
  recommendation against criminalization, where it terminates in a recommendation
  for criminalization, and where it must stop and hand the matter to the legislature
  as a contested value choice rather than a factual or conceptual one. It should preserve
  the distinctions that matter—harm to others versus harm to self versus offense versus
  moral wrong as such; positive morality versus critical morality; the empirical claim
  about social disintegration versus the normative claim that society may enforce
  morality; the difference between a practice being widely condemned and its being
  harmful—and it should be explicit about which of these the procedure can operationalize
  and which it can only flag. It should also be honest about where the procedure will
  misfire: cases where the harm is speculative, where the moral condemnation is majoritarian
  but the conduct is not harmful, where a practice is harmful but the proposed criminalization
  would create more harm than it prevents, and where the very question is whether
  the community has standing to legislate morality at all. Finally, run the procedure
  on three referrals: consensual adult incest between siblings, assisted suicide for
  a competent terminally ill adult, and public desecration of a national flag. For
  each, show the steps, the recommendation, and the residual disagreement. At least
  one recommendation should be one I will not like; do not soften it to make the procedure
  look tidy. Do not cite cases, statutes, or books; I need the reasoning and the operational
  tests, not authority.


