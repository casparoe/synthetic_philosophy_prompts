  I chair the clinical ethics committee at a mid-sized teaching hospital, and we keep
  getting consulted on cases where a treatment will foreseeably cause a serious harm—death,
  the loss of a fetus, the loss of one twin—while the clinical team''s aim is to relieve
  suffering or save a life. We have no shared procedure for these cases, and the conversation
  usually becomes a fight about whether the harm is intended or merely foreseen. I
  want a reusable decision procedure grounded in the doctrine of double effect that
  my committee can actually run in a thirty-minute meeting.


  Write it as a procedure, not an essay. Give me the questions to ask in order, what
  counts as a sufficient answer to each, where the procedure stops with a no, where
  it stops with a yes, and where it hands the decision to a person because the question
  is one of values rather than facts. I want the procedure to be a burden-shifting
  one: each question, when answered one way, should shift the burden to the objector
  or to the proponent, and I want that structure explicit. Do not give me a textbook
  recitation of the four conditions; I want the operational version—which condition
  is doing the work in which kind of case, which conditions collapse into each other,
  and which are doing no work at all. The procedure must force the committee to separate
  three attitudes: aiming at the harm, accepting it as a foreseeable side effect,
  and using it as a means. I want a question for each, and I want the procedure to
  say what follows when the honest answer is that the harm is being used as a means.


  Then run the procedure on three cases: (1) a terminally ill patient in severe pain,
  where the team proposes escalating opioids and foresees that this may suppress respiration
  and hasten death; (2) conjoined twins sharing vital organs, where separation will
  save one and cause the death of the other; and (3) a pregnant patient with cancer,
  where chemotherapy is needed to save her life and will likely cause the death of
  the fetus. Include at least one case where the procedure''s verdict is one I will
  not like—either because it permits something I find repugnant or forbids something
  I think is clearly right—and explain why the procedure gives that verdict anyway.
  Mark the points where the procedure cannot eliminate judgment, and say what the
  procedure cannot do.


  At the end, state how confident you are in the procedure as a whole and in its main
  steps, and identify the single point in the procedure you are least sure about,
  with your reasons. Do not include citations, reading lists, or references to the
  literature; I want the procedure itself.


