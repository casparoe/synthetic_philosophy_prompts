  One risk: is the nonidentity problem''s core accurately described? Yes: the problem
  that a person can be harmed by an act only if they would have been better off without
  it, but if the act is what causes them to exist, they can''t be made worse off (assuming
  their life is worth living) — so acts that seem wrong (e.g., conceiving a child
  with a disability, depleting resources) can''t be wrong in a person-affecting way.
  Parfit''s examples: the 14-year-old mother; depletion vs. conservation. The "no-difference
  view": identity makes no difference. The "person-affecting restriction": an act
  is wrong only if it makes someone worse off. Impersonal views: outcomes can be worse
  even if no one is worse off. Threshold views: wrong if someone falls below a threshold.
  All accurate.


