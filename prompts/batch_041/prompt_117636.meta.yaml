  2. The transitivity/intransitivity of the counterpart relation: since the counterpart
  relation isn''t an equivalence relation, modal claims like "possibly necessarily"
  become weird; de re modal logic (S4/S5) fails, and this clashes with strong intuitions
  about the modal logic.

