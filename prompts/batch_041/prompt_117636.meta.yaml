  Actually, let me reconsider the "man of his time" domain. It''s very accessible
  and has clear conceptual structure. The position: "We should not judge historical
  figures by present-day moral standards; they should be assessed by the standards
  of their own time." Ask what would count against it. Defeaters (in the weeds):

  1. The "contemporaneous dissent" defeater: the defence presupposes uniform moral
  consensus in the past, but there were almost always dissenters (abolitionists, critics
  of empire), so the figure wasn''t merely "of his time" but on the wrong side of
