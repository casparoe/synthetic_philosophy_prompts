  2. The distinction between excuse and justification: "of his time" can at best excuse
  (diminished culpability) but not justify; and even as an excuse it requires a claim
  about how hard it would have been to know better — which is an empirical, contestable
  claim.

  3. The problem of selective application: the defence is invoked for heroes but not
  for villains; if we apply it consistently we''d have to excuse everyone, which makes
  moral history impossible (a reductio).

  4. The "moral luck of birth" / constitutive luck problem: if timing determines culpability,
  then moral responsibility becomes a lottery, which conflicts with our practices
  of praise and blame; and it cuts against the praise we give to the same figures
  for their achievements (we credit them for being ahead of their time).

  5. The circularity / relativism problem: if standards are just those of a time,
  then criticism of the past (and of the present) loses its footing; the defence implies
  a meta-ethical relativism that few of its users accept — so it''s unstable.

  6. The "we are also of our time" point: if the defence works, it works for us too,
  so we can''t be confident we''re judging rightly — self-undermining.


