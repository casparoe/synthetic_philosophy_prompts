  Write a patient information and consent booklet for a fictional private clinic that
  performs sight-restoration surgery on adults who were born blind. The booklet should
  be written in the flat, reassuring, liability-conscious register of a real clinic''s
  printed leaflet, and it should never announce its philosophical commitments, never
  wink at the reader, and never use the vocabulary of a seminar ("empiricism", "nativism",
  "a priori") outside of clauses where a clinic might plausibly use it.


  The subject it is quietly about is Molyneux''s question: whether a person born blind,
  who has learned by touch to tell a cube from a sphere, could, on first being made
  to see, tell which is which by sight alone — the question Molyneux put to Locke,
  which Locke printed in the Essay and answered in the negative ("before he touch''d
  them, he could now distinguish, and tell, which is the Globe, which the Cube"),
  and to which Berkeley returned a more radical no while Leibniz and others answered
  yes. The clinic is aware of this history; its clauses and FAQ should absorb it into
  warranty terms, assessment protocols, publication consent, and refund policy.


  Aim for roughly 700-800 words: numbered clauses, then a short FAQ of three or four
  entries, then if it is useful an appendix describing the post-operative shape-assessment
  procedure.


  The satire has to be fair, which means the document should be consistent with the
  following, without stating any of them:

  - the difference between the narrow question (could the patient sort cube from sphere
  at the very first visual encounter) and the broader one (can sight deliver shape
  information at all before it is calibrated);

  - the qualifiers Locke attached to his answer — at first sight, and with certainty
  — which leave room for a patient who guesses well or learns quickly;

  - the difference between discriminating shapes and recognising or knowing them,
  and the awkward status of the patient''s own report as evidence;

  - the fact that surgically restored vision is not normal vision, so that any clinical
  outcome is confounded and neither the yes nor the no is cleanly confirmed;

  - the suspicion that both the empiricist and the rationalist camps can accommodate
  whatever the patient does, which is why the clinic can afford to promise nothing
  and charge anyway;

  - the sensorimotor or contingency line of thought on which seeing is something the
  patient must learn to do.


  Targets worth hitting: a warranty whose applicability turns on which answer to the
  problem turns out to be correct; a definition of "first sighting"; a repeat-testing
  clause that applies if the patient names the shapes correctly straight away; a consent
  clause allowing the case to be written up as a contribution to a three-century-old
  dispute; an FAQ entry for the patient who succeeds immediately and one for the patient
  who cannot do it at all; a complaints procedure for cross-modal transfer failure.
  The target of the satire is the habit of treating a thought experiment as though
  a clinical trial could settle it, and the way institutional language launders a
  metaphysical dispute into a policy question — not blind patients, and not surgeons.

