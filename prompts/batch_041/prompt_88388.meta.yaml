  I have been collecting cases of a pattern that I can feel but cannot name, and I
  would like to know whether the phenomenon has an established name — and, more importantly,
  whether the cases I have been grouping together really belong together.


  The pattern is this. A question of the form ''how likely is it that X?'' seems to
  be perfectly well formed, and yet the answer depends on something that the question
  itself does not specify: the way the possibilities are carved up. In one sort of
  case the carving is over people or events. A friend of mine is an actuary, and when
  he prices a policy for a particular fifty-year-old man who smokes and runs marathons,
  the answer depends on which table he consults — men of that age, smokers, distance
  runners — and the man belongs to all three classes. The event is not repeatable,
  so no frequency can settle which class is the right one; the question ''what is
  the chance that *he* dies this year?'' seems to have no answer until we say which
  class he is being drawn from, and nothing in the case says.


  In another sort of case no people are involved at all, only geometry. If a dart
  is thrown so that it lands ''at random'' on a circular board, the chance that it
  lands nearer the centre than the rim is one half if we choose the distance from
  the centre uniformly and then a random direction, and one quarter if we choose the
  point uniformly over the area of the board. Both procedures are as random as the
  other; I cannot see what would make one of them the correct reading of ''at random''.
  I gather there is a famous puzzle of this shape about chords in a circle with three
