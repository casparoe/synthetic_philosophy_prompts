  The Poverty of Historicism and the surrounding essays on prediction: that large-scale
  historical prophecy mistakes trends for laws, that the future course of history
  depends on the growth of knowledge and that we cannot predict what we shall know,
  that a prediction of social events can itself alter those events (the Oedipus effect),
  and that the "conspiracy theory of society" — the habit of explaining social outcomes
  as the execution of somebody''s plan — is a primitive and dangerous picture. Note
  also Popper''s positive alternative, the piecemeal engineering he opposes to utopian
  social engineering, and the "situational logic" by which he thinks we can explain
