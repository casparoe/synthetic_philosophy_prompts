  Actually, the Ellsberg teaching plan: the audience could be a behavioural economics
  reading group of non-specialists, or a lunchtime seminar for a psychology department.
  The dependency structure: (1) get them to see the choice as a choice, (2) get the
  bet into the right frame (each bet separately, then both), (3) expose the inconsistency
  across the four bets (the sure-thing principle) before naming it, (4) then introduce
  "ambiguity" as distinct from "risk", (5) then ask whether it''s irrational. Misconceptions:
  "it''s just risk aversion" (but the unknown urn''s probabilities are well-defined
  if you''re an objectivist — actually here''s the subtlety: the ambiguity is not
  about the *objective* probabilities, it''s about the agent''s lack of a unique prior
  — so the misconception is "there''s no fact of the matter about the unknown urn"),
  "the paradox shows expected utility is false" vs "it shows people are irrational"
  (distinguish normative and descriptive), "ambiguity aversion = ignorance aversion
  = not wanting to bet on things you don''t know about", "it''s about the Ellsberg
  urn specifically". And the check: ask them to construct a case where the preference
  is *not* inconsistent, or ask them what the sure-thing principle says in their own
  words.


