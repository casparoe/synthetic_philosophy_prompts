  ("whatever thinks exists; I think; therefore...") — the "syllogistic" misreading,
  (ii) it proves the existence of a substantial soul/self, (iii) it proves the external
  world, (iv) "I" refers to the body/person, (v) it''s a proof of the indubitability
  of all thoughts, (vi) it proves only the existence of thought, not a thinker (Lichtenberg),
  (vii) it''s a proof at all — maybe it''s a "performance" that can''t be doubted
  without being performed. The check for understanding: ask them whether "there is
  thinking" would do the same work, or ask them to state what would falsify it. Niche
  injection: I could inject a scenario — e.g., the "fog machine" thought experiment:
  if it turned out that all my thoughts were being generated by a process that had
