  dilemma" or the question "when did it start — 1917, 1945, 1947?" The point being
  that the answer to "who started it" depends on when you say it started. That''s
  a nice dependency structure: before you can ask who started it, you must fix a start
  date; and fixing a start date presupposes a criterion of "the Cold War". That''s
  the conceptual hinge.


