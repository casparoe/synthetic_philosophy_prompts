  are moved by the fate of Anna Karenina". Niche injection: the "quasi-emotion" idea,
  or the "two-systems" thing. Could inject a new thought experiment.

  - Ellsberg paradox and ambiguity aversion: teaching plan; misconceptions: "ambiguity
  aversion is just risk aversion", "probability is subjective so there''s no paradox",
  "it''s about the number of balls", "ambiguity aversion = loss aversion". Carrying
  example: the classic two-urn. Niche: the "comparative ignorance" hypothesis (Fox
