  or finishing a proof. Where others see a motley collection, she sees one ingredient
  in many dishes, and she attributes the impression of heterogeneity to our habit
  of attending to what an experience is about rather than to how it feels.


  The second is an attitude theorist. He denies that any such common tone can be found.
  On his account, what unites pleasures is not a sensation but a stance: an experience
  is a pleasure when it is welcome, when the subject is pleased by it, when she wants
  it to continue. He regards the feeling theorist''s tone as a posit no one has ever
  succeeded in pointing to, and he thinks the attitude account is the only one that
  does justice to the range of things we actually call pleasures.


  I want the two of them to collide on cases rather than generalities. Please have
