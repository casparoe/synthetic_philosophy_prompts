  \ textbook editor? Hmm.\n\n- Narrative self (Dennett's center of narrative gravity):\
  \ procedure for a practitioner — a clinician (psychiatrist writing a formulation),\
  \ or a memoir editor, or a chaplain, or a qualitative researcher coding life narratives.\
  \ Operationalizing \"self as center of narrative gravity\" into a procedure for,\
