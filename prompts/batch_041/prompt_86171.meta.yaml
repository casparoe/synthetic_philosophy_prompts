  — the standard Stoic objection: if happiness depends on tastes and passions being
  satisfied, and satisfaction depends on the world, then happiness isn''t in our power;
  she seems to have it both ways. That''s a nice structural objection: the view oscillates
  between an Epicurean (pleasure/desire-satisfaction) reading and a Stoic/self-management
  reading; the two pull in different directions and each is exposed to different defeaters.

  - Also: is "susceptible to illusions" a necessary condition, or a risk factor? Illusions
  also generate the greatest miseries (losing an illusion is wretched). So the view
  might predict a variance-increasing effect: higher highs, worse lows. A test: people
  high in "positive illusions" (Taylor & Brown) — evidence there is mixed; high self-enhancement
  correlates with happiness but also with worse social outcomes under some conditions.

