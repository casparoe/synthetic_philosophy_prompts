  and passions, then the claim that satisfied tastes and passions make you happy is
  near-trivial; the interesting claim is the illusion one, which is hard to test because
  illusions are, by her account, invisible to their possessor. Defeaters would be:
  cases of people who see through their illusions and are nonetheless happy (or happier),
  e.g., the stoic or the lucid; and the possibility that "illusion" is doing the work
  of "unjustified optimism" and the real mechanism is something else (e.g., attention,
  engagement, or self-efficacy). Also the case of depression/anhedonia: no tastes
  or passions to satisfy; does her view imply the depressed are at fault? That''s
  a normative cost (she does think we''re responsible for our happiness to a great
  degree).

