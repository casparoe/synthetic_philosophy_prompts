  of complicated love life. Careful — maybe mention that students raise it. It''s
  fine as a biographical note, but I should keep it vague: she wrote it during a crisis
  in her relationship with Voltaire; and the passage about ten years of happiness
  and the illusion of being loved. That''s from the fetched page.

