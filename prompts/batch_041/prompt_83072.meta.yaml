  Draft:


  "You''re a philosopher of medicine who''s spent way too long on the naturalism/normativism
  fight — whether ''disease'' names a biological fact about malfunction or a value
  judgement about what we don''t want to happen. Before you write anything, brainstorm
  for a minute: what does each side actually claim, and where does each one crack?


  Now write me a mock official document, deadpan, in the voice of a government body
  that has officially adopted the naturalist line. I''ll give you the setup:


  The (fictional) Republic of Vellaria has passed the Species-Typical Function Act.
  Section 1 defines a disease as ''a statistically abnormal reduction in the functional
  efficiency of some biological mechanism, judged against the reference class of the
  organism''s species, sex and age.'' Section 2 sets up the Standing Committee on
  Nosological Integrity, whose job is to issue the annual Schedule of Recognised Diseases.
  Your piece is the Committee''s press release announcing this year''s Schedule, around
  650 words, in the flat, self-congratulatory register of a real government bulletin
  (numbered items, a footnote or two, a quote from the chair).


  The comedy has to come from the definition actually breaking under the cases, not
  from the committee being stupid. Make sure the Schedule has to rule on: a condition
  that''s universal in the population (so by the letter of the Act it isn''t abnormal
  and can''t be a disease); a rare trait that is atypical but harmless or even useful;
  a condition whose status flips depending on how narrowly the reference class is
  drawn; and something that everyone on the committee agrees is bad but that no one
  can call a dysfunction without first deciding what counts as harm. At least one
  invented condition is fine — don''t feel you have to use real ones, and don''t cite
  any real textbook, authority or living person.


  Two more things. First, somewhere in there, a dissenting committee member should
  get a short footnote or a bracketed objection, and it should be the most sensible
  thing in the document. Second, the release should never admit that anything is going
  wrong — the reader should work out that the committee is quietly making value judgements
  while insisting it isn''t. Somebody who knows the debate should laugh and not wince;
  somebody who''s never heard of it should still enjoy it and end up wondering whether
  the whole definitional project was ever going to work.


  Don''t give me a preamble or an explanation of the jokes. Just the document."


