  \nEssay (as the asker's draft):\n\nTitle: \"Nested Simulations and the Missing Ratio\"\
  \n\n¶1. The simulation argument, as Bostrom states it, is a trilemma: (i) civilizations\
  \ almost always die out before reaching a posthuman stage; (ii) posthuman civilizations\
  \ almost never run simulations of their ancestors; or (iii) we are almost certainly\
  \ living in a simulation. The work is done by a counting claim: if posthuman civilizations\
  \ run many ancestor simulations, and if the minds in those simulations are minds,\
  \ then simulated observers vastly outnumber biological ones, and a randomly selected\
  \ observer is overwhelmingly likely to be simulated.\n\n¶2. Two premises are usually\
  \ identified as doing the heavy lifting: a computational theory of mind, and some\
  \ principle for converting a ratio of observers into a credence — the principle\
  \ that one should reason as if one were a random sample from the class of all observers.\
  \ I want to set the first aside and press on the second. My claim is that the ratio\
  \ that the argument needs is not well defined, and that this is not a defect of\
  \ our knowledge but of the premises themselves.\n\n¶3. Consider nesting. If a simulated\
  \ civilization can itself run simulations, then the total number of observers in\
  \ a simulated world is not a fact about that world alone; it is a fact about how\
  \ many levels of simulation it contains, and there is no principled bound on that\
  \ number in the argument's own terms. The argument's counting step requires a denominator:\
  \ the class of all observers, simulated and not. With nesting, that class has a\
  \ cardinality that depends on where one stops counting, and every stopping point\
  \ is arbitrary — the deepest simulated world in any simulation is exactly as real\
  \ to its inhabitants as ours is to us. Truncate at one level and the simulated are\
  \ a modest multiple of the real; truncate at five and they swamp them. The conclusion\
  \ \"almost certainly simulated\" is stable across these choices only if one stipulates\
  \ a bound, and any stipulation is an extra premise the argument has not paid for.\
  \ I will call this the nesting indeterminacy.\n\n¶4. One might reply that the argument\
  \ does not need a precise ratio, only the qualitative claim that simulated observers\
  \ outnumber real ones under the simulation-friendly hypothesis. I think this reply\
