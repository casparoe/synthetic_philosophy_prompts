  Here is the exchange as best I can reconstruct it.


  1. Theo (computational social scientist): The secular-cycles program shows history
  can be quantified and, at the level of structure, predicted. A model fit to centuries
  of data flagged, well before the fact, that American political instability would
  peak in the 2020s — that''s an out-of-sample hit, and it wasn''t a vague prophecy:
  it named a mechanism (elite overproduction, immiseration, fiscal strain) and a rough
  timing. A program that forecasts a turning point decades ahead is a science.


  2. Mara (historian): The forecast isn''t a hit because it wasn''t falsifiable as
  stated. "Instability," "elite," and "immiseration" are theory-laden categories,
  and the timing was a decade wide. Worse, the same data used to estimate the cycle
  lengths were used to generate the forecast, so the "hit" is in-sample. And if the
  cycle period is one of the fitted parameters, a cycle is guaranteed to appear —
  you can always find a ~150-year rhythm in a long enough series.


  3. Theo: That''s a demand for point predictions that no macro-science can meet;
  climatology can''t say what the weather will be in 2090 either, and nobody calls
  it unscientific. The right test is comparative: does the model beat rivals on the
  same data, and does it transfer — fit on one polity, tested on a held-out one? The
  program does leave-one-society-out cross-validation, and it works.


  4. Mara: The transfer test is where it breaks. Historical polities are not exchangeable
  draws from a distribution: later societies inherit the earlier ones'' institutions,
  ideas, and even the memory of the previous cycle, so holding one out doesn''t give
  you an independent test — information leaks across the fold. (She compared it to
  the old worry in cross-cultural anthropology that societies sharing a common origin
  aren''t independent data points.) And there''s a deeper disanalogy with climate:
  the climate''s equations are time-invariant, whereas in history the actors'' own
  theories of the cycle become causes — people who read about elite overproduction
  act on it.


  5. Theo: Falsifiability is a red herring; the real test is whether a model survives
  attempts to break it, and this one has been extended to dozens of societies, not
  just the US. If the mechanism were empty, we wouldn''t see the same sequence recur.


