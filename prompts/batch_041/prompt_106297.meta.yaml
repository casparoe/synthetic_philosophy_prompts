  op-eds about courts, referendums, and recall elections. I want to know what that
  sentence could actually be claiming, not just that populism is vague.


  You''re a political philosopher who works on democratic theory and populism. Before
  you answer, brainstorm the distinct possible readings of the will of the people,
  then lay them out for me as a menu. For each reading, give me: (1) the precise claim
  it makes -- what the people is (an aggregate, a collective agent, a hypothetical
  subject, a set of institutions, an audience), what a will is (actual preference,
  deliberated judgment, common good, authorization, identity), and what follows from
  it; (2) whether it''s trivial, substantive but defensible, or false; (3) whether
  it would actually license my colleague''s conclusion that the expert commission
  can be ignored; and (4) what kind of argument someone would need to make to get
  from that reading to a policy conclusion. Include the boring procedural readings
  as well as the metaphysically ambitious ones, and don''t stop at the usual contrast
  between liberal democracy and populism.


