  is small but they''re correlated, so the collective risk is large — the "risk is
  not independent" point. That''s a genuinely sharp idea: in a race, even if each
  firm''s chance of catastrophe is tiny, they''re not independent — one accident can
  trigger the bad outcome for all, or the risks are correlated through the shared
  environment. This is a great niche injection: the standard "expected value" reasoning
  is individually rational but the correlation means the aggregate risk isn''t n times
  p.


