  "Most people, when asked whether they could have come from a different sperm and
  egg, say no. I used to think this was obviously right. Now I think the obvious answer
  hides a distinction that makes the question much harder.


  The claim that I could not have come from a different sperm and egg is called origin
  essentialism. It says that the particular sperm and egg that fused to make me are
  part of my essence: in any possible world where I exist, that same fusion occurs.
  Call this thick origin essentialism. A weaker version, thin origin essentialism,
  says only that I must come from the same parents, or perhaps the same biological
  lineage, but not from the numerically same gametes.


  The intuition behind thick origin essentialism is easy to state. Imagine my parents
  had used a different sperm and a different egg. The resulting child would have a
  different genome, a different brain, different memories, and a different personality.
  It would be my sibling, not me. If you change the origin, you change the person.
  So I could not have come from a different sperm and egg.


  But this argument proves less than it seems. The fact that a different origin would
  produce a different person does not show that I could not have had that different
  origin. It shows only that the resulting person would not be me. That is close to
  a tautology: if the origin is different, the person is different. The question is
  whether the person who is me is tied to the origin, or whether ''me'' is a role
  that could have been filled by a different biological starting point. The argument
  assumes what it is trying to prove.


  To make the issue concrete, consider a case. Suppose my parents create two embryos
  in a fertility clinic, using two of my mother''s eggs and two of my father''s sperm.
  Embryo A is implanted in my mother; embryo B is frozen. The child born from A is
  me. Now suppose the clinic had implanted B and kept A frozen. The child born would
  have a different genome and a different life. Would that child be me? Thick origin
  essentialism says no. But notice what this makes my identity depend on: a decision
  by a doctor or my parents about which embryo to implant. If the decision had gone
  the other way, I would not exist, and someone else would be raised by my parents.
  That is a strange kind of necessity. My existence depends on a social and medical
  choice, not just on the biological facts of conception.


  There is a further problem. My mother ovulates one egg in a given cycle, but the
  egg that became me was one of many that could have been released. If she had ovulated
  a day later, a different egg would have been fertilized. Thick origin essentialism
  says that child would not be me. But then my identity depends on the exact timing
  of ovulation, which depends on hormones, stress, sleep, and countless other trivial
  factors. If any of those had been different, I would not exist. This is not impossible,
  but it makes my existence depend on an enormous number of arbitrary details. The
  view is not refuted by this, but it becomes very demanding.


  Thin origin essentialism avoids the arbitrary-detail problem, but it seems too weak.
  If I could have come from any sperm and egg from the same parents, then I could
  have been my brother. That is clearly false. If thin origin essentialism says only
  that I must come from the same parents, it cannot distinguish me from my siblings.
  So it fails to capture the intuition that motivated origin essentialism in the first
  place.


  I want to propose a middle view. Call it causal-chain origin essentialism. On this
  view, what is essential to me is not the particular gametes, but the causal chain
  that produced my psychological continuity. The chain must begin with my parents
  and pass through a single organism that develops into the person with my memories,
  character, and body. The particular sperm and egg are part of the chain, but they
  are not the essence. What matters is that the chain is not broken and does not branch
  into two people. This view explains why I could not have been my brother: my brother
  is a different chain. It also explains why the frozen-embryo case is troubling:
  if the chain had started with B, the resulting person would have a different psychological
  continuity, so it would not be me. But it leaves open whether I could have come
  from a different sperm and egg if the chain still produced the same psychological
  continuity. That seems impossible in practice, but it is not ruled out by definition.


  The hardest objection to this view is that psychological continuity is itself dependent
  on the particular brain that the particular gametes produce. If the brain is different,
  the psychology is different. So causal-chain origin essentialism may collapse back
  into thick origin essentialism. I do not have a full answer to this. I suspect the
  view needs a distinction between the numerical identity of the organism and the
  narrative identity of the person, but I am not sure how to make that distinction
  precise without making personal identity either trivial or mysterious.


  So my conclusion is tentative. I think thick origin essentialism is too strong,
  because it makes identity depend on arbitrary biological and social details. Thin
  origin essentialism is too weak, because it cannot distinguish me from my siblings.
  A causal-chain view might be the right middle ground, but it faces the objection
  that psychological continuity is not separable from the particular organism. I would
  like to know whether this middle view has been defended, whether it has a name,
  and where my argument goes wrong."


