  can be locked up against their will, without having committed any crime, if a court
  or clinician finds that a mental disorder makes them dangerous to themselves or
  others; and in most jurisdictions, a person who commits an otherwise criminal act
  can be acquitted or punished less severely if a mental disorder is found to have
  deprived them of the capacity to know what they were doing was wrong or to control
  their conduct. The first practice treats mental disorder as a condition that justifies
  paternalistic confinement and treatment; the second treats it as a condition that
  excuses conduct and diminishes responsibility. I want to know what philosophical
  commitments about mental illness, disease, mind, and responsibility these two practices
  presuppose.


