  And the "prices": if you reject (2) by allowing fitting emotions without knowledge,
  you owe an account of when an emotion is fitting; if you reject (3) you need a story
  about how we could know; if you reject (5) you have to say what''s special about
  death (asymmetry: no subject-position evidence possible), and that pushes you toward
  a view where the asymmetry is about the possibility of evidence, not about certainty,
  which might then let some grief be warranted for the survivor while first-person
  fear is not — a distinction Zhuangzi may not have wanted. And Zhuangzi''s own joy
  then needs a non-epistemic grounding (the transformation/natural-process argument),
  which costs him because that argument generalizes to suffering.


