  Perhaps the cleanest: The argument runs:


  (1) Zhuangzi holds that we cannot know whether death is bad; the dead can''t report
  back and all our evidence comes from the living side. (Paraphrase of 齊物論.)

  (2) An emotion is warranted only if we know its object to have the property the
  emotion presents it as having. (Fear requires knowing the thing is dangerous; grief
  requires knowing the loss is bad.)

  (3) We don''t know that death is bad.

  (4) So grief and fear at death are unwarranted. (Zhuangzi''s mourning-drumming-singing
  at his wife''s death, the "transformations" speech.)

  (5) Nothing distinguishes our ignorance about death from our ignorance about the
  value of any future condition: whether this illness will ruin my life, whether the
  move will be good for my kid, whether I''ll regret this marriage. In each case I
  lack knowledge; I have evidence, but evidence isn''t knowledge... hmm, that''s a
  flaw (knowledge vs. justified belief equivocation). Actually that''s a nice subtle
  flaw: (2) is plausible only in a weakened form ("warranted only if well-supported
  by evidence"), and (3) trades on a strong sense of "know." That''s a possible equivocation.
  But the asker shouldn''t be told which kind of flaw.


  (6) So all prospective emotions are unwarranted — which is absurd, and which would
  also gut Zhuangzi''s own practice: he doesn''t merely lack grief, he rejoices (he
  sings, he tells the story of the skull''s offer of the joys of the dead, he says
  the dead may be happier than kings). If we can''t know death is bad, we equally
  can''t know it''s good.

  (7) So the argument in (1)-(4) proves too much, and Zhuangzi must be saying something
  weaker.


  Where does it go wrong? Possible diagnoses:

  - (2) is false: emotions can be fitting without knowledge; grief can be warranted
  by the loss of a relationship even if the dead are happy (deprivation vs. the dead
  person''s state). Zhuangzi''s target is fear of death for oneself, not grief for
  others. Scope issue.

  - The step from (3) to (4): moves from "not known bad" to "not bad"/"no reason to
  fear" — an argument from ignorance.

  - (5) equivocates: our ignorance about death is not mere absence of evidence but
  structural (the dead can''t report; the "report" relation is impossible), whereas
  ordinary future-directed ignorance is evidentially tractable; so the two cases aren''t
  alike. This is a nice subtle flaw: equivocation between two kinds of ignorance.

  - Also (2) reads "how do I know..." as a premise in an argument when it''s a rhetorical/performative
  move (a perspective shift, a 寓言).

  - Also Zhuangzi''s 生死一条, the "transformation" argument is not epistemic but axiological:
  the same process. If the asker uses the epistemic version only, then the "too much"
  is right: Zhuangzi has a second, non-epistemic argument.


