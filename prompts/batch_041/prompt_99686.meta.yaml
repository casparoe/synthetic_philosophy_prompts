  What''s a genuinely in-the-weeds issue in the teleological suspension? Some options:


  1. The distinction between "tragic hero" and "knight of faith": Agamemnon sacrifices
  Iphigenia, Jephthah sacrifices his daughter, Brutus executes his sons — the tragic
  hero remains within the ethical, and the ethical itself (the universal) demands
  the sacrifice. Abraham''s case is different because there''s no higher ethical end;
  the teleological suspension means the ethical is suspended for a purpose that is
  not itself an ethical purpose but a religious one. The crux: how can the single
  individual be "higher than the universal" without that being sheer arbitrariness?
  And the relation to the "absolute duty to God" — is the suspension of the ethical
  a suspension of the ethical *for Abraham* only, or does it reveal something about
  the ethical''s limits?


  2. The puzzle: If the ethical is the universal and applies to everyone, then Abraham''s
  act is either murder or a sacrifice, and no human can tell which — hence "the distress
  and anxiety" and the fact that Abraham cannot speak. The in-the-weeds issue: Johannes
  says the knight of faith cannot make himself understood, and yet Abraham''s story
  is told and celebrated. Also the issue of whether the teleological suspension is
  a *suspension* (temporary, exceptional) or a *teleological* one (justified by its
  end) — and whether the end can be "God" as an individual''s particular relationship
  rather than a universal good.


  3. A sharper crux: Johannes claims that the ethical is the universal, and the universal
  is the telos of everything; but then he says the individual''s telos can be higher
  than the universal. This seems like a contradiction: if the universal is the telos,
  nothing can be higher. So the "teleological suspension" must mean the ethical is
  not the final telos; the individual''s relation to God is. The problem: this makes
  the ethical merely provisional, which seems to collapse into antinomianism. Johannes
  tries to block this by saying it''s not a matter of "inclination" but of a "paradox"
  that cannot be mediated. And he says the knight of faith is not the tragic hero;
  the tragic hero gives up the finite for the universal, whereas the knight of faith
  gives up the universal for the particular, and gets the finite back (Abraham gets
  Isaac back). That''s the "double movement."


