  I am a high school senior, and as part of my city''s charter-review process I have
  been invited to present a proposed amendment to the municipal code before the Charter
  Review Commission next month. I would be grateful for help preparing for the question
  period, since I expect it to be harder than the presentation itself.


  My amendment bundles three changes to municipal elections. The voting age for municipal
  elections would fall from eighteen to sixteen. Voting in those elections would become
  compulsory for eligible voters, enforced by a small fine that could be discharged
  through a few hours of civic service. And residents who are not citizens but who
  have lived in the city for at least two years would be allowed to vote in municipal
  elections.


  I have tried to derive all three from one principle rather than defending them separately:
  the franchise should track subjection to the laws one is obliged to obey, not membership
  in a particular legal status. I deliberately do not rest the case on the idea that
  everyone affected by a decision should have a say, because that would seem to enfranchise
  commuters, tourists, and anyone else who uses our roads and breathes our air without
  being governed by our ordinances. I also want to hold that compulsory participation
  is not compulsory choice: my ballot would include a none-of-the-above option, so
  that a voter who has weighed the candidates and rejected them all can record that
  judgment without penalty.


  The Commission has five members. The chair is a retired municipal judge who reasons
  in terms of legal authority and precedent and will ask whether a city may do any
  of this. The county election administrator cares about registration, ballot design,
  enforcement, and cost. A community organizer who works with immigrant families supports
  votes for non-citizen residents but regards the compulsory element as punitive toward
  the poor and the disengaged. A political scientist on the commission knows the empirical
  literature on turnout and will attack any causal claim I make about habits or legitimacy.
  A school board member worries that sixteen-year-olds are not competent and that
  the schools would be dragged into partisan politics.


  Please draft my Q&A preparation. I want the objections I will actually receive,
  in roughly the order I will receive them, phrased the way each commissioner would
  phrase them, and ordered by how much damage they would do to my case. For each,
  give me a two-minute reply and a candid note on where that reply is weakest. Tell
