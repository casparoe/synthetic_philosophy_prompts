  Actually: The Pasadena game (Nover and Hájek 2004): a fair coin is flipped until
  it lands heads. If it lands heads on toss n, the player receives 2^n / n dollars
  with sign (−1)^{n+1}. So payoff = (−1)^{n+1} · (2^n / n). Expected value = sum over
  n of (1/2^n)(−1)^{n+1} 2^n / n = sum (−1)^{n+1}/n = ln 2, conditionally convergent.
  So the expected value is undefined (the series converges to ln 2 but is conditionally
  convergent, so rearrangement can yield any value). Hence the Pasadena paradox: expected
  value undefined.


  The St. Petersburg game has infinite expected value. Pasadena has undefined expected
  value.


