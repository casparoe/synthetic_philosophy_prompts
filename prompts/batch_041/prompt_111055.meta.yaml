  I''m a retired experimental physicist (40 years of neutron scattering, mostly on
  magnetic materials) and since I stopped doing real work I''ve been reading philosophy,
  badly but happily. I need help auditing a second-hand summary of Hofstadter''s careenium.
  My friend Peter, who read the strange-loop book and has been telling everyone about
  it, gave me this and I wrote it down more or less verbatim:


  ''The careenium is a frictionless pool table covered in zillions of tiny magnetic
  marbles — simms — that stick together when they collide slowly, forming big clumps
  he calls simmballs, which drift around and shove the loose simms about. The point
  is that simmballs are just as real as simms: they aren''t convenient fictions or
  bookkeeping devices, they''re the level where the actual causal action is. In principle
  you could compute every sim''s path from the micro-laws, but that computation is
  useless; the causal story lives up at the simmball level, where simmballs push simmballs,
  and that pushing can''t be derived from, or reduced to, what the simms are doing,
  even in principle. So Hofstadter is a strong emergentist: the simmball has a genuine
  downward causal influence on the simms that the micro-laws alone don''t predict
