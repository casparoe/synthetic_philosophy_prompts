  "Hofstadter''s careenium is a frictionless pool table covered in zillions of tiny
  magnetic marbles — simms — that stick together when they hit at low speed into big
  clumps he calls simmballs, which slowly drift and push the loose simms around. The
  point is that the simmballs are just as real as the simms: they''re not convenient
  fictions, they''re the level at which the interesting causal action happens. The
  simms'' trajectories are, in principle, computable from the micro-laws, but that
  computation tells you nothing — the causal story lives up at the simmball level,
