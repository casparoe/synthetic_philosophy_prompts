  The satire should land the real problems:

  - the measure needs a baseline ("inaction") but inaction isn''t a well-defined thing;
  you can pick different baselines and get different answers (inaction baseline vs
  stepwise vs "what would have happened anyway")

  - impact ≠ badness: the measure can''t tell a side effect you want from one you
  don''t, so it penalizes good changes equally

  - the measure is gamed: an agent can score low by making the world worse first (so
  its actions are "restoring" the default), or by acting only where the default would
  have gone anyway, or by nudging the world so that its preferred outcome becomes
  the baseline

  - a low-impact score is neither necessary nor sufficient for safety: an agent that
  does nothing scores perfectly; a very powerful agent can have huge effects with
  a small "impact score" if measured on the wrong variable

  - the value specification smuggles itself back in: what counts as "the environment",
  which variables to measure, what counts as "the agent''s action" vs the environment''s
  own dynamics

  - the "avoid side effects" instruction can''t be given to the agent without also
  telling it which effects matter.


