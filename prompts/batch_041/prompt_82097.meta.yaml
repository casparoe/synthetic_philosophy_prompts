  Let''s draft:


  A national transport agency appraises major infrastructure projects using a standard
  cost-benefit analysis. It monetizes travel-time savings, accident reductions, and
  carbon emissions; assigns a fixed monetary value to a statistical life; discounts
  future benefits and costs at a single social discount rate; sums the monetized benefits
  and costs across all affected people; and ranks projects by net present value. Distributional
  effects are reported in a separate appendix, but they do not enter the ranking.
  The agency uses the same monetary values for every citizen regardless of income,
  and it treats a dollar of benefit to a rich commuter and a dollar of benefit to
  a poor commuter as equally weighted in the final total. The agency''s guidance says
  that this procedure is justified because it measures changes in individual welfare
  and aggregates them in a way that respects each person''s preferences.


  What philosophical commitments does this practice presuppose about welfare, interpersonal
  comparison, and social aggregation? Reconstruct the implicit theory. In particular,
  does the practice presuppose something like Harsanyi''s aggregation theorem—roughly,
  that if individual preferences and the social preference satisfy expected-utility
  axioms and the social preference respects unanimous individual preferences, then
  the social preference can be represented as a weighted sum of individual utilities—or
  does it need only a weaker welfarist-consequentialist framework? Which of Harsanyi''s
  premises are doing real work here, and which are left implicit or quietly violated?
  Does the practice require full interpersonal comparability of utility, or only comparability
  of money, and is the difference philosophically significant? Does it presuppose
  a veil-of-ignorance justification, or can it be defended without one? Which rival
  views of social welfare does it rule out—Rawlsian maximin, prioritarianism, sufficientarianism,
  a capability approach, or a deliberative conception that refuses to aggregate preferences?
  Is the practice genuinely underdetermined between a utilitarian rule and a weighted
  utilitarian rule, or does its use of equal monetary values already commit it to
  one?


  Then say what would have to change if the agency adopted a prioritarian social welfare
  function, or if it introduced distributional weights that gave extra weight to benefits
  to the worse off. Would that be a modification of the same underlying theory, or
  a rejection of it? Where the practice is philosophically underdetermined, identify
  the point precisely, and say what further feature of the practice or what additional
  normative premise would settle it.


