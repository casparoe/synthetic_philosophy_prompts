  Moves:


  1. A: Pascal''s whole point in those fragments is that justice and force are inseparable
  — that the only reason laws get obeyed is that they''re backed by power, and the
  only reason power is tolerated is that people believe it''s just. So his view is
  that "justice" is a costume that force wears. If that''s right, Pascal is just a
  nicer Thrasymachus — might makes right, dressed up as piety.


  2. B: That can''t be right — Pascal isn''t saying might *makes* right; he''s saying
  the two are separate things that happen never to be joined in the world. His complaint
  is precisely that we can''t get justice to have force, so we settle for force having
  the appearance of justice. That''s a lament, not an endorsement. And anyway, the
  argument he actually gives is about the *foundation*: we can''t identify the just
  because custom is arbitrary and origins are usurpation, so we should follow the
  established law — that''s an epistemic argument (we don''t know what''s just), not
  a moral one (power is what''s right).


  3. A: But the practical upshot is the same: don''t question the law, obey whoever
  holds power, and teach people to believe the law is just even if it isn''t. If your
  skepticism about justice leads you to tell people to keep believing in a fiction,
  you''re not a skeptic, you''re an enforcer. Also, if the only reason to obey is
  that we can''t know what''s just, then by the same token you can''t know the established
  law is better than a change — so Pascal''s conservatism doesn''t even follow from
  his premise.


  4. B: The reason to obey isn''t that the established law is just — it''s that the
  alternative is that force decides *without* even the pretense of law, and that''s
  worse. The pretense is doing work: the point of the "reason of effects" stuff is
  that some beliefs need to be held at the level of practice even if you, personally,
  can''t hold them at the level of theory. Pascal is explicit that the wise man doesn''t
  despise the ceremonies, he uses them. So there''s a two-tier view: for yourself,
  you know it''s custom; for the polity, the fiction must be maintained.


  5. A: Two-tier views are unstable — they''re exactly what Plato accused the noble
  lie of being; and once the pretense is exposed (which Pascal''s own text does!),
  the whole thing collapses. Also, "the alternative is worse" is a consequentialist
