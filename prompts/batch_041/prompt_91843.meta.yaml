  Then the exam question should test something non-trivial: the crux. What''s the
  philosophical crux of "do symbols push the substrate around?" This is a version
  of the classical "does the higher level do any causal work?" question — the exclusion
  argument, the causal closure of the physical, epiphenomenalism about the semantic
  level, Dennett''s "two descriptions, one process" stance, Kim''s exclusion problem,
  the "levels of description" vs "levels of causation" distinction. Also relevant:
  the "who shoves whom around" question is the *homunculus* / *mereological* puzzle
  about whether higher-level patterns can be causes. And Hofstadter''s own answer:
  both descriptions are valid; the simmballs are "real patterns" (Dennett''s term)
  that we can use to predict and explain, and their causal efficacy is not in competition
  with the simms'' because they''re the same goings-on described at different grain.
  There''s also the "causal exclusion" worry: if simm collisions fully determine everything,
  the simmball-level explanation is at best a heuristic. And there''s the "downward
  causation" debate in philosophy of mind (mental causation), plus the "levels" debate
  in biology (the units of selection debate is also a levels question — but that''s
  a different domain).


  Good exam question: ask students to take a position on whether the higher-level
  "simmball" description is genuinely explanatory/causal or merely a convenient redescription,
  and to say what would have to be true of the substrate dynamics for the higher-level
  description to earn its keep (i.e., what structural features — stability, robustness,
  multiple realizability, counterfactual sensitivity, insensitivity to micro-detail
  — make a real pattern). And also: what''s the difference between the careenium question
  and the standard mental-causation exclusion problem, and does the careenium help
  or is it just the exclusion problem with billiard balls?


  That''s a genuinely in-the-weeds question. The model must: (1) reconstruct the scenario;
  (2) distinguish causal-exclusion from mere-redescription; (3) specify what a "real
  pattern" requires; (4) note the crucial disanalogy — in the careenium, the substrate-level
  dynamics are stipulated to be fully deterministic and the high-level regularities
  are derivative, so the case is rigged toward the epiphenomenalist verdict, whereas
  in the brain the higher-level states are what the system''s input/output function
  is defined over; (5) give a verdict.


  Also a good "A vs B" divider: the B answer says "both descriptions are true, so
  both levels are causal — it''s just a matter of grain," without addressing the exclusion
  worry; the A answer says something like: higher-level properties are causally efficacious
  iff they are difference-makers at the higher level — i.e., the counterfactual profile
  of the system is sensitive to the simmball-level state in a way not captured by
  any substrate-level description, and this is a substantive, contingent claim about
  the dynamics, not something guaranteed by the existence of the pattern. And an A
  answer must also address whether the simmball description is *explanatorily indispensable*
  (the "no competition" move, à la Dennett / Putnam / Fodor''s autonomy of the special
  sciences) vs. *causally autonomous* (Kim''s worry). The distinction between "explanatory
  autonomy" and "causal autonomy" is the crux and is exactly the sort of thing that
  separates understanding from recitation.


  Also: the "who shoves whom" question invites a "causal closure" argument: the simms
  are physical, they''re closed under physical law, so the simmballs (which are nothing
  over and above simm configurations) can''t add any causal oomph. Reply: causal closure
  is a thesis about token physical events, and the simmball is a type-level pattern;
  type-level causation needn''t compete with token-level determination (the "determinables/determinates"
  response). Also, the "proportionality" / "difference-making" account of causation
  (Yablo, List & Menzies) — causes should be proportional to their effects: the simmball-level
  description is *better* because it''s more proportional.


