  there''s Borden and his twin, which is fission without any technology at all). What
  I want is a reading of the film through Parfit''s actual view—what matters in survival
  is psychological continuity, not identity—that takes both the film and the philosophy
  seriously. Does the film illuminate Parfit, or does it cheat by making Angier''s
  fear of the tank depend on the idea that he might wake up as the drowned copy, which
