  I am a programme officer at a small foundation that funds interdisciplinary research,
  and I have recently been put in charge of our ''mechanisms'' stream, which supports
  projects that try to explain complex human phenomena—religious belief, depression,
  moral judgement, aesthetic experience—by lower-level mechanisms such as genes, neurotransmitters,
  neural circuits, or evolutionary game theory. My background is in cognitive science,
  and I am temperamentally sympathetic to reductionism; I would rather fund a bold
  reductive project than a vague humanistic one. But our board has become sceptical,
  and at the last meeting we spent an hour arguing about two proposals without resolving
  whether either was a genuine scientific advance or a piece of what one trustee called
  ''neuro-babble''. I need a reusable decision procedure that a panel of intelligent
  non-specialists can run in a twenty-minute slot, using a one-page summary and, if
  necessary, a short interview with the applicant. The procedure should be grounded
  in the distinction between cranes and skyhooks and the charge of greedy reductionism,
  but it must do more than repeat those labels: I want it to tell us what to look
  for in a proposal, in what order, and when to stop. I have also been experimenting
  with a distinction of my own, and I would like the procedure to incorporate it if
  it is any good. I call it explanatory debt. A reduction, on this picture, borrows
  explanatory credit from a lower level—genes, neurons, selection pressures—and must
  repay that debt at the level it is trying to explain. A crane pays in instalments:
  it identifies the lower-level mechanism, shows how that mechanism actually produces
  the higher-level pattern, and then says what the higher-level description adds that
  the lower-level one does not. A skyhook borrows the same credit but never shows
  the exchange rate; it asserts that the lower level ''must'' be doing the work without
  displaying the transaction. Greedy reductionism, on this way of putting it, is the
  special case where the debt is paid in a currency the lower level does not issue—for
  example, explaining a norm by a hormone, or a symphony by a synapse. I am not certain
  the metaphor is sound, so part of the job is to say where it breaks down and what
  it obscures.


