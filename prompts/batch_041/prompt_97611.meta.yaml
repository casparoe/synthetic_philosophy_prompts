  Draft:


  For a presentation to my school''s philosophy society I have been asked to write
  out my settled position on the ethics of bringing people into existence, so that
  the other members can examine it. Here is what I hold:


  (1) Bringing a new person into existence is always morally wrong; the fact that
  a life would contain more pleasure than pain does not make it permissible to start
  it.

  (2) The asymmetry argument: the presence of pain is bad and its absence is good,
  even where there is no one for whom that absence is a benefit; the presence of pleasure
  is good, but its absence is bad only when there is someone who is thereby deprived.

  (3) Nothing is good or bad in itself; a state of affairs can be good or bad only
  for some existing subject who is affected by it, and an act can be wrong only if
  it wrongs someone.

  (4) Death is bad for the person who dies, because it deprives them of the goods
  they would otherwise have enjoyed.

  (5) I donate to organisations that relieve the suffering of people and animals alive
  now, I feel no sorrow at the prospect that humanity will eventually cease to exist,
  and I do not blame or resent friends of mine whose parents had them or who plan
  to have children themselves.


  Please tell me whether these hang together: which of them are genuinely in tension,
  which only appear to be, and for each genuine tension how serious it is and what
  would have to be given up to repair it.


