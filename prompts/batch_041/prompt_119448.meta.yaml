  Draft:


  I am a high school junior putting together an application to a summer research program
  in philosophy, and the application asks for a two-page research proposal on the
  topic I would work on if admitted. I have settled on the problem of old evidence
  in Bayesian confirmation theory, but I want to approach it in a way that I have
  not seen stated in the introductions I have read.


  The standard problem, as I understand it: Bayesian confirmation says that evidence
  supports a hypothesis when the hypothesis raises the probability of the evidence,
  and that a rational agent updates by conditionalization. But when the evidence was
  already known before the hypothesis was formulated, the agent''s prior already assigns
  it probability one, so conditionalizing on it cannot change the hypothesis''s probability.
  Yet the history of science is full of cases where long-known evidence — an anomaly
  that had resisted explanation for decades — is treated as strong support for a new
  theory once that theory predicts it. So either the Bayesian story of support is
  wrong, or our sense that old evidence supports is mistaken.


  The fixes I have encountered seem to fall into two families: those that tell us
  to evaluate the hypothesis against a prior we would have had before we knew the
  evidence, and those that say the support is really explanatory rather than probabilistic.
  My hunch is that both families accept the problem''s framing — one hypothesis, one
  body of evidence, does this evidence raise this hypothesis''s probability? — and
  that the framing is the source of the trouble. I suspect the question should be
  comparative: not "does old evidence confirm this hypothesis?" but "does old evidence
  discriminate between this hypothesis and its rivals?" A theory that was constructed
  to accommodate a known anomaly arguably deserves little credit for accommodating
  it, while a rival that fits the same anomaly without having been built for it may
  deserve a great deal. On this reading the old-evidence problem might not need solving
  so much as restating, and the interesting work would be to see which cases it still
  bites.


  Please turn this into the proposal. I need: the question stated precisely enough
  that it could be answered one way or the other; why the existing answers leave it
  open; what I would actually do — I imagine mostly constructing small, made-up probabilistic
  examples with two competing hypotheses rather than collecting data, but tell me
  if that is right and lay it out in stages over about eight weeks; what would count
  as the project failing, not just succeeding; and an honest assessment of whether
  this is too ambitious for a high school student with one summer. Write it as prose
  I could submit. Do not include citations or a reading list — I will add those myself;
  refer to positions by description rather than by author.


