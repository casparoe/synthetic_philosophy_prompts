  problem says we can''t separate the causes with this data, not that cohort effects
  don''t exist. And even if the label boundaries are arbitrary, real kinds need not
  have sharp boundaries: many real kinds are fuzzy-edged and graded (biological species,
  diseases, soil types), and their reality consists in the clustering mechanisms,
  not in a bright line. Arbitrary boundaries can still carve a real gradient. Also:
  the labels themselves become part of the causal story — once people are told they
  are a generation, they adopt and enact the identity, and institutions treat them
  as a bloc, which makes the clustering tighter than it would otherwise be. So the
  kind is real, and partly self-making. (This is the looping-kind point.)


