  We need the question and student''s answer. Let''s write a question:


  "Question: In ''The Paradox of Deontology,'' the paradox is often put this way:
  if morality''s point is to make things go better, then a deontological constraint
  that forbids you from harming one person to prevent greater harm seems to make things
  go worse, and so seems irrational. Consider the following response, which I will
  call the ''division of moral labor'' reply: the constraint is not a rule for producing
  the best outcome; it is a rule that defines the terms of cooperation among agents
  who each have their own lives to lead. On this view, each agent is responsible for
  what she does, not for what others do, and the point of the constraint is to protect
  each person from being conscripted into another''s project, even a project of minimizing
  harm. Does this reply resolve the paradox, or does it merely restate the deontological
  commitment in different words? In your answer, explain what the paradox is, assess
  the division-of-labor reply, and say whether it can account for a case in which
  refusing to violate a constraint foreseeably leads to many more deaths. A strong
  answer will distinguish the question of whether constraints are rational from the
  question of whether they are absolute."


