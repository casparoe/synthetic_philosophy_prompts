  I''ve been trying to get clear on where I stand on value and reasons, and before
  I commit it to paper I want to know whether the package is stable. Here is the position
  as I would state it.


  1. Value is fittingness. For something to be valuable is for it to be fitting —
  appropriate, correct — to value it. I mean fitting as a normative relation in its
  own right, not as a stand-in for what you ought to do or what would be useful.


  2. Reasons come first. Fittingness is not the fundamental normative notion; reasons
  are. An attitude is fitting just in case the considerations that count in favor
  of it are not outweighed by those against.


  3. Two kinds of reasons for attitudes. Some reasons bear on the object of the attitude:
  the demon''s cruelty counts against admiring him. Others bear only on the state
  of having the attitude: the demon will torture me unless I admire him. Only the
  first kind bears on whether the attitude is fitting.


  4. The second kind are still reasons. If I could switch my admiration on at will,
  I would have reason to switch it on, and someone who knew about the threat and could
