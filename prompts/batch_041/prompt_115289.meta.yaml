  I am putting together materials for a graduate seminar on the ethics of war, and
  what I need from you is a dialogue rather than an essay. The two speakers are a
  conventionalist and a revisionist about the moral equality of combatants. The conventionalist
  holds that whatever the justice of their cause, combatants on both sides are governed
  by the same permissions and prohibitions — that the soldier''s licence to kill does
  not turn on whether his war is just. The revisionist holds that it does: that the
  justice of the cause bears directly on what a combatant may do and on what may be
  done to him. Both speakers are first-rate, neither is a fool or a knave, and neither
  may win a point by appeal to authority, by naming an author, or by gesturing at
  a literature. Every move has to be made in the open, from premises the other speaker
  can inspect, and each must engage the other''s strongest formulation of their case
  rather than a convenient weak one.


  Four pieces of apparatus, which I have built for this exercise; none of them is
  a summary of anything published, so do not go looking for them in the literature.


  First, keep two distinctions separate. An act is justified when it is not wrong;
  it is excused when it is wrong but the agent is not to blame for it. And say that
  a person is liable to be killed when he has lost the right not to be killed, reserving
  culpable for the narrower idea of deserving blame. The revisionist''s most interesting
  position is the one that grants that many unjust combatants are excused and even
  non-culpable, yet insists that they remain liable; the conventionalist should press
  hard on whether anything of consequence survives that concession, or whether it
  collapses into the conventionalist''s own view.


