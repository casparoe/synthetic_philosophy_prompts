  Hmm, one risk: if I gloss concepts, I should be accurate. Dilation: an event A and
  its complement both get lower probability (and higher probability) after learning
  E, when the prior credal set is such that... Precisely: dilation occurs when learning
  E makes an event A less determinately probable — the lower probability of A given
  E is less than the prior lower probability, and the upper probability of A given
  E is greater than the prior upper probability, i.e., credal set for A given E strictly
  contains the prior credal set''s interval... Actually the standard definition: E
  dilates A if inf P(A|E) < inf P(A) and sup P(A|E) > sup P(A) for all P in the credal
  set — i.e., conditioning on E makes you more ignorant about A. Yes: "dilation" =
  the posterior credal set for A is a strict superset of the prior credal set for
  A. It happens with "non-informative" or "ambiguous" evidence in some models. That''s
  a neat thing to mention but I could also mention it lightly and hedge: "the phenomenon
  sometimes called dilation, where conditioning on evidence makes one''s credences
  about a related event more, not less, imprecise." That''s accurate enough.


