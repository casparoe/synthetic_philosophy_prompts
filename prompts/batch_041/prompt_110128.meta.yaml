  Draft:


  "You are asked to write a critical reading, for a graduate seminar in decision theory,
  of Tom Stoppard''s Rosencrantz and Guildenstern Are Dead, taking as your philosophical
  lens the theory of imprecise probabilities. The play opens with the two of them
  flipping a coin that comes up heads again and again, far beyond what a fair coin
  should allow; Guildenstern treats the run as a violation of the law of probability
  and reaches for explanations (a trick coin, a stopped world, the suspicion that
  they are inside someone else''s game), while Rosencrantz goes on flipping and collecting
  the winnings. I want a reading that takes that scene, and the play''s larger architecture
  — the two of them as minor characters whose errands, letter, and deaths are scripted
  by a plot they cannot see, and the Player who seems to know more than they do —
  as an episode in the theory of credence under ambiguity rather than as a mere illustration
  of it.


  Some constraints and questions I care about:


  1. Distinguish clearly between two ways of modeling the scene: (a) precise credence
  with model uncertainty — a hierarchical or mixture model in which the bias of the
  coin is itself an unknown quantity with a prior, so that the run is evidence about
  a parameter, and updating stays within ordinary Bayesian machinery; and (b) genuinely
  imprecise credence — a set of probability functions, a credal set, representing
  the agent''s inability to settle on a model, with the associated decision rules
  (maximality, E-admissibility, Γ-maximin, Hurwicz, minimax regret). Say which one,
  if either, does better justice to what the scene dramatizes, and where each distorts
  it.


  2. Say whether the play''s imprecision, if it is imprecision, is in the characters
  or in the world. The subjectivist reading (imprecision is an artifact of incomplete
  information, and vanishes for an omniscient being) and the objectivist reading (the
  imprecision is a real feature of the situation) are both available here; the play''s
  premise that the two of them are embedded in a story with an author is, I think,
  an unusually good test case for the distinction, since it supplies something like
  a God''s-eye modeler in the person of the Player. Which reading does the play support,
  and does the play have the resources to tell the difference?


  3. Consider whether the scene is better read through the principle of indifference
  and its failures than through imprecise probabilities at all — the demand that a
  coin with unknown bias get probability one-half, and the various paradoxes that
  demand generates — and whether Stoppard''s run of heads is a dramatization of the
  failure of indifference or of something else.


  4. There is a technical phenomenon in the imprecise-probability literature, dilation,
  in which conditioning on evidence makes an agent''s credences about a related proposition
  more imprecise rather than less. If it applies anywhere in the play, say where;
  if it doesn''t, say why the scene only looks like a case of it.


  5. End by saying what the play contributes that the formal literature does not —
  the literature is largely about single agents choosing between bets, and the play
  is about two agents who are also, in a sense, the same agent, and about what it
  is like to hold an imprecise credence while waiting to be killed. And be honest
  about where the play resists the reading: it is a comedy about death and about being
  a minor character, and it may be that the coin scene''s real subject is not credence
  at all.


  You cannot consult the text; work from the play''s plot, its major scenes, and the
  well-known shape of the debate. Do not quote. Assume your reader knows the play
  and knows the decision theory."


