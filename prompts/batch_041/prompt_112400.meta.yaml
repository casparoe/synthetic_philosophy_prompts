  Draft essay:

  Hume''s discussions of money and trade are often read as an early statement of two
  ideas: the quantity theory of money and the mutual gains from trade. I argue that
  the interesting Hume is not the textbook quantity theorist but the theorist of adjustment.
  For Hume, money is not itself wealth; it is a device that facilitates exchange.
  If the quantity of money increased simultaneously and proportionally for everyone,
  it would merely raise nominal prices. But real economies do not work that way. New
  money enters at particular points, changes relative prices and wages, and alters
  production and employment before prices settle. Hume thus seems to hold both that
  money is neutral in the long run and that monetary changes matter in the short run.
  That combination is not a contradiction; it is a theory of transition.


  On trade, Hume rejects the mercantilist premise that one nation''s gain must be
  another''s loss. Trade allows each country to specialize, to sell what it produces
  efficiently, and to buy what others produce efficiently. The balance of trade is
  not a zero-sum scoreboard. A specie outflow should, in a commodity-money system,
  lower the domestic money supply, reduce prices, and make exports more attractive,
  thereby correcting itself. Yet this mechanism depends on flexible prices and on
  money being commodity money. Under fiat currency and credit money, the adjustment
  story is less automatic: central banks can sterilize flows, credit creation can
  expand the money supply endogenously, and price stickiness can delay or reverse
  the classical adjustment.


  My thesis is that Hume''s real contribution is not the neutrality of money but the
  analysis of how monetary and commercial disturbances propagate. The modern relevance
  is not that Hume anticipated every later debate, but that his framework asks the
  right question: through what concrete channels does a change in money or trade alter
  real activity? I also suggest that Hume''s skepticism about public credit is best
  understood as a worry about fiscal credibility and intergenerational burden rather
  than as a simple debt phobia.


  I would like you to comment on whether this reading is historically defensible,
  where it overstates the coherence of Hume''s texts, and how it should be revised
  if it is to be fair to both the philosopher and the economist. In particular, address
  whether the essay wrongly imports a modern neutrality/non-neutrality distinction
  into Hume, and whether it is anachronistic to treat his trade discussion as a precursor
  to comparative advantage. Conclude with two or three specific revisions that would
  most improve the essay."


