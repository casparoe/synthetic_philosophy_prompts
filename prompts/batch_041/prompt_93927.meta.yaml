  / counterfactual / epistemic / dispositional / other), Verdict (trivial / defensible
  / false), Compatibilist or incompatibilist?, Supports her Frankfurt move? (yes/no/only
  if combined with another reading). After the table, one short paragraph with your
  bottom line on whether she''s equivocating.


