  ---


  I''m in a second-year free will seminar and my prof keeps saying "you''re only free
  if you could have done otherwise" — she drops it whenever the compatibilists come
  up, like it settles the whole thing. Last week she used it to wave away a Frankfurt-style
  case someone raised, saying the agent in it "still could have done otherwise, just
  not in the sense the libertarians need" — and everyone nodded like that meant something.
  I don''t think it does, or at least not one single thing. Can you lay out the distinct
  precise claims that one-liner could be making? For each, I want to know what kind
  of possibility the "could" is (a categorical openness of the world, a counterfactual
  about what the agent would have done had things gone differently, an epistemic "for
  all anyone knew", a claim about the agent''s capacities or the working order of
  her machinery, whatever else you can distinguish), whether it''s compatibilist or
  incompatibilist in effect, and whether it''s trivial, contentious but defensible,
  or flat false. Then tell me which reading she must be using to make "still could
  have done otherwise" do the work of defusing the Frankfurt case, and whether any
  single reading can do both jobs at once (define freedom and defuse the case) or
  whether she''s sliding between two.


