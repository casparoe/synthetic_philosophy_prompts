  So I''ve gotten into fishing this summer — mostly catch and release on a small river
  near me — and the more I learn the rules the less I understand what they''re for.
  Depending on the season and the species and the size of the fish, the rules sometimes
  *require* me to put it back and sometimes require me to keep it, and everyone calls
  the whole system conservation. There''s also this whole etiquette around the fish
  themselves: wet your hands, don''t touch the gills, use barbless hooks, revive it
  in the current before you let go, ten seconds out of the water max. But then the
  same people will kill an invasive crayfish or a mink without a second thought, because
  it''s invasive, and nobody blinks. And when a fish gets swallowed deep or bleeds,
  the advice is basically just "keep it, it''s going to die anyway."


  I''m trying to figure out what view of value this whole practice is quietly built
