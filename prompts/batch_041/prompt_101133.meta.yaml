  ---


  I am a doctoral student working in philosophical logic, and I would like a diagnosis
  rather than a verdict. The literature on the probabilities of indicative conditionals
  has, as far as I can tell, been stuck for decades in a way that the technical progress
  does not explain: the triviality results themselves are no longer in dispute — it
  is agreed on all sides that one cannot simultaneously hold that an indicative conditional
  expresses a proposition with an ordinary probability and that the probability of
  that proposition is the conditional probability of its consequent given its antecedent,
  at least not if the identity is also required to hold under supposition and not
  just for the initial credence function — and yet the field cannot agree on what
  the results mean or which of the jointly incompatible commitments should give way.


  Four responses seem to be in play. One camp takes triviality as a reductio of the
  propositional view altogether and concludes that indicative conditionals do not
  have truth conditions, so that the conditional probability is not a stand-in for
  the probability of a proposition but the whole content of the conditional. A second
  keeps the truth conditions and denies the identity, treating the conditional probability
  as a fact about what one ought to believe or how assertable the conditional is rather
  than as the probability of the proposition expressed. A third accepts the truth
  conditions and the identity but locates the culprit in one of the auxiliary assumptions
  — the behaviour of the conditional''s probability under conditionalization, or a
  principle governing how conditionals embed in other conditionals — and then disagrees
  with the rest of the third camp about which assumption is guilty. A fourth denies
  that the results bear on the question at all, on the grounds that they deploy a
  notion of probability that was never the right one for conditionals.


  My hypothesis — and I want it tested rather than assumed — is that this is not really
  a disagreement about any of those premises but about what a semantic theory is supposed
  to deliver: a compositional assignment of truth conditions, or a theory of the credences
  a speaker is committed to. If that is right, then the "problem of the probabilities
  of conditionals" is a settled theorem plus an unsettled question about which of
  those two jobs a semantics of conditionals is doing, and the apparent dispute about
  the premises is a symptom. But I can also imagine the opposite diagnosis: that it
  is a substantive disagreement in formal semantics (there is a fact about which auxiliary
  premise is false, and the disputants simply have not found the argument), or that
  it is verbal, in the sense that "the probability of a conditional" is being used
  by different parties to mean the credence of the proposition expressed, the credence
  one ought to have in the consequent on learning the antecedent, or a measure of
  assertability.


  Please diagnose the disagreement using what each side actually maintains, not a
  survey of who said what. Is it substantive, verbal, a clash of pre-theoretic intuitions
  about whether conditionals are truth-evaluable that no argument could settle, or
  two different questions travelling under one name? If your diagnosis is that some
  of the parties are answering different questions, say exactly which question each
  is answering. And given the diagnosis, tell me what would count as progress — a
  distinction, a formal result, a reframing — or argue that none should be expected,
  and why. I am not asking for a reading list; I want the diagnosis and the reasoning
  behind it.


