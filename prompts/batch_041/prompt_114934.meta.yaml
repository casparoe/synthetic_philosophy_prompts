  Groundhog Day plot: Phil Connors, weatherman, Punxsutawney, Feb 2, wakes at 6:00
  to "I Got You Babe" on the clock radio, loops; phases: confusion, hedonism, seduction
  of Rita (using information from previous loops — a great sphexishness point: he
  treats Rita as a fixed input and iterates the script; he fails), despair/suicide
  attempts, then mastery (piano, ice sculpting, catching the boy falling from the
  tree — but he can''t save the old man, who dies at the same time each day regardless),
  then genuine care, then the loop breaks. Key scene: the groundhog Phil drives off
  a cliff with the groundhog (Phil the groundhog), the "Ned Ryerson" insurance guy,
  the boy, the old man''s death, the piano lessons, the "I''m a god" line, the final
  auction scene where he''s generous. Also the line "What would you do if you were
  stuck in one place and every day was exactly the same, and nothing that you did
  mattered?" — I''d need to fetch to quote. Better to paraphrase or not quote. The
  film''s most-quoted line: "Well, what if there is no tomorrow? There wasn''t one
  today." Hmm. Don''t quote; paraphrase.


  Good scene for the reading: Phil''s seduction of Rita — he gathers intelligence
  from previous iterations and delivers the perfect script, and she slaps him; the
  mechanical use of knowledge fails, and the film suggests something about responsiveness
  vs. scriptedness. Also the piano: he becomes genuinely skilled by practice across
  loops — the mechanical acquisition of a skill, which then becomes spontaneous. Also
  the old man: he cannot be saved by any amount of iteration — an ineliminable limit
  on the loop''s power, and Phil''s response is care rather than optimization. Also
  the "he learns the whole town" — omniscience within the loop, which turns out to
  be compatible with a kind of deadness.


  The philosophical complication: if the loop breaks because Phil becomes good, then
  his goodness is instrumental (a means to escape) — a sphexish virtue, or a "virtue
  program" — unless the film means that the escape is a byproduct (Dennett-ish "the
  loop ends when the program completes"). And the honest critic must note: the film
  never lets Phil know the rule, so the film is ambiguous about whether he is free
  at the end or just re-scripted (he might wake up Feb 3 in a new script — the same
  sphex at a higher level). That''s a genuinely good, in-the-weeds reading. And the
  domain''s free-will question: Dennett''s point that flexibility doesn''t get you
  out of causation; compatibilism about freedom as the capacity to respond to reasons
  and to be self-revising. Also Hofstadter''s darker thought: maybe we''re all sphexish,
  just with bigger programs and the illusion of self-monitoring; the "sphexishness
