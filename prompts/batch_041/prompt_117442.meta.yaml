  The debate I''ll have them translate: two camps.


  Camp A (the program): behavior is data; a reward function is a latent variable;
  given a model of the agent as (approximately) optimal with respect to a reward,
  demonstrations constrain the reward; recovering it (up to the known equivalence
  classes) is a well-posed-enough inverse problem, and that''s the path to building
  systems that do what people want.


  Camp B (the critics): the inference is underdetermined in ways that can''t be fixed
  with more data of the same kind — because the rationality model, the hypothesis
  space of rewards, and the notion of a preference are all doing unearned work; behavior
  is consistent with infinitely many preference structures; and the target (the human''s
  preferences) may be partly constructed by the interaction, may be inconsistent across
  contexts, and may not be introspectable. So the whole enterprise of "recovering"
  preferences is either a modeling choice dressed as discovery or a normative imposition.


