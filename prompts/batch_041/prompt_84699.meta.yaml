  (a) a score from 0 to 1 for how much of what went wrong is an intent-alignment failure
  rather than a value-alignment failure, where 0 means the system pursued exactly
  what its designers intended and the only complaint is that the intended thing was
  bad, and 1 means the system''s behavior was aimed at something other than what the
  designers intended, so that the merits of the intended goal are irrelevant;

