  ---


  You are to draft the joint statement of an adversarial collaboration between two
  camps in the dispute over whether perception is cognitively penetrable.


  Camp A ("penetration"): at least some beliefs, desires, expectations, moods, or
  category-based knowledge alter the content or the phenomenal character of perceptual
  experience itself, not merely what the subject judges, remembers or reports.

  Camp B ("barrier"): perception is informationally encapsulated at the level at which
  it computes its outputs; the effects Camp A points to arise downstream — in judgement,
  memory, decision, response bias — or from task artefacts, and the appearances to
  the contrary come from reading post-perceptual processes back into the perceptual
  episode.


