  Draft:


  ---


  A philosophy of perception reading group has spent a term failing to converge on
  whether perception is cognitively penetrable, and has now asked two of its members
  — one who holds that it is, one who holds that it is not — to produce, jointly,
  the statement that a genuine adversarial collaboration between them would yield.
  Draft that statement.


  The two positions, as the group has stated them for the purpose of the exercise,
  are:


  - Penetration. At least some of a subject''s beliefs, desires, expectations, moods
  or category-based knowledge alter what the subject perceives — the content or the
  phenomenal character of the perceptual episode itself — and not merely what the
  subject judges, remembers or reports about what is before them.

  - Encapsulation. Perception computes its outputs from a restricted body of information;
  the effects the other side points to arise downstream, in judgement, memory, decision
  or response bias, or are artefacts of task demands and confounded cues, so that
  what look like perceptual effects are post-perceptual processes read back into the
  perceptual episode.


  Three things are to be taken as given, since both parties have already agreed to
  them and they are not part of the dispute:


  1. The two-index constraint. Any alleged penetration is to be assayed on two independent
  indices: a report-based measure, which is criterion-sensitive (it can be moved by
  what the subject is willing to say, expects to see, or takes the task to require),
  and a criterion-free sensitivity measure, of the kind psychophysics supplies (adaptation
  or aftereffect measures, discrimination thresholds, breaking continuous flash suppression,
  and the like). Neither index is to be treated as privileged in advance, and the
  two are permitted to come apart.


  2. The three-stage stipulation. For the purposes of the collaboration, "perception"
  is to be treated as naming a process with three separable stages: registration,
  the transduction and encoding of the distal stimulus; organisation, the grouping
  and constancy computations that yield a structured scene; and uptake, what the subject
  is thereby in a position to know about the scene. Both parties accept that the word
  "perceptual" may be attached to any of the three, and that much of the disagreement
  in the literature turns on which of them is meant.


  3. The probative case. Both parties accept in advance that the following hypothetical
  pattern would bear on the dispute, whatever it turned out to be. Subjects are led
  to expect that a stimulus falling at a category boundary — a hue midway between
  two named colours, say — belongs to one category rather than the other, by a manipulation
  that leaves the stimulus itself untouched. The report-based index then shifts in
  the direction of the induced expectation. Suppose that the criterion-free index
  does not move. Suppose further that a second manipulation, one that alters the physical
  stimulus in ways the subject cannot report, moves the criterion-free index without
  moving the report-based one.


  The statement should contain:


  (a) A numbered list of claims both parties can sign: what is common ground about
  the phenomena (including the effects that neither side denies), about what a theory
  of perception owes an account of, about the logical status of the encapsulation
  thesis and of the penetration thesis, and about what the standard arguments on each
  side do and do not establish. Nothing in this list may be vacuous; a claim that
  both sides would sign only because it says nothing does not belong in it.


  (b) A statement of the residual disagreement, in which each side''s position is
  formulated in the words its own adherents would accept — not in the words of their
  opponents. If a formulation is available that both sides would sign, the disagreement
  is not yet located, and you should keep pressing.


  (c) The cruxes: the sub-questions such that settling one would move at least one
  side. For each, name the case, experiment or argument that both sides agree would
  bear on it, and record each side''s prediction about it in advance. Draw on the
  three-stage stipulation to say which stage each crux concerns, and on the two-index
  constraint to say what the two indices would have to show for the crux to be settled.
  At least one crux should concern whether there is a non-arbitrary way to draw the
  perception/cognition boundary at all.


  (d) An assessment of how much of the dispute is verbal: which part, if any, dissolves
  once the parties agree on which stage of the process they are talking about, and
