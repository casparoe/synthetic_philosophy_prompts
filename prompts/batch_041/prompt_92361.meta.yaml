  (1) the "two-index" requirement: any alleged penetration must be assayed on two
  independent indices — a criterion-sensitive report measure and a criterion-free
  sensitivity measure (adaptation aftereffects, breaking continuous flash suppression,
  or similar) — and the two must be allowed to come apart.

  (2) the "layered perception" stipulation: both sides agree that "perception" names
  a process with at least three separable stages — registration (the encoding of the
  distal stimulus), organisation (the grouping/constancy computations that yield a
