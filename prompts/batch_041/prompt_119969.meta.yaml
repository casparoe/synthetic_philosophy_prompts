  Frame: "I''m a journalist who covers decision theory and artificial intelligence
  for a general-interest science magazine. I''ve been asked to run a 90-minute session
  at an ideas festival for about 25 attendees, most of whom are educated laypeople
  with no formal background in decision theory. The session is called ''The Coin That
  Knows You'' and I want it to be a participatory game, not a lecture. I want participants
  to feel the force of two related puzzles: counterfactual mugging and XOR blackmail.
  In counterfactual mugging, a perfect predictor flips a coin; if heads, it asks you
  for $10; if tails, it gives you $1,000, but only if you would have paid in the heads
  case. In XOR blackmail, a perfect predictor sends you a message if and only if your
  house is infested with termites XOR you pay $1,000; a termite infestation costs
  $1,000,000. The puzzles turn on whether you should reason causally or evidentially—whether
  your choice should be guided by what it causes or by what it reveals about the world
  you''re in. I want an activity where participants run into the problem themselves
  before I name it. They should have to make a choice, live with the payoff, and then
  discover that a different way of reasoning would have led them elsewhere. Design
  the game: rules, roles, materials, a payoff scheme that doesn''t need real money,
  a timeline for the 90 minutes, and a debrief that maps what happened onto the two
  puzzles and the causal/evidential divide. Also tell me what will predictably go
  wrong the first time I run it and how to handle that. Be honest about which feature
  of the puzzles the activity cannot reproduce and that I''ll have to supply in the
  debrief. Don''t assume the participants know any decision theory terminology; the
  game should do the work."


