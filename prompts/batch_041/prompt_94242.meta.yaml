  I like Davidson''s radical interpretation → an intelligence/OSINT analyst, or an
  investigative journalist, or a user-researcher. But the domain "Davidson''s radical
  interpretation" might be a bit thin for a procedure? Actually it''s rich: charity,
  holism, indeterminacy of interpretation, the requirement that a theory of meaning
  for a speaker be a truth theory, the "principle of correspondence" / "the Analyst''s
  constraint", the distinction between explaining an action as rational-by-our-lights
  and treating it as irrational, akrasia, and the idea that we cannot make someone
  "massively wrong." Also Davidson''s "On the Very Idea of a Conceptual Scheme" —
  the possibility of partial untranslatability. And "Belief and the Basis of Meaning,"
  "Thought and Talk," "Radical Interpretation."


  Procedure: "How to attribute beliefs to a source whose utterances you can''t yet
  translate" — steps: (1) assume the source is largely consistent and mostly right
  about the local observable facts; (2) prefer interpretations that maximize agreement
  on what''s observable/coarse-grained; (3) hold the total body of attributions to
  be a coherent theory (holism); (4) when the source says something that seems absurd,
  first suspect your translation rather than their beliefs; (5) allow disagreement
  to accumulate only in domains where our own beliefs are uncertain; (6) accept indeterminacy:
  don''t pretend to choose between equally good theories. Hard cases: a source who
  seems to systematically deny a plainly observable fact (e.g., claims the sun didn''t
  rise / a well-documented event didn''t happen); a source whose beliefs seem self-contradictory;
  a source whose assertions look like they''re not assertions at all (performative,
  ritual, hypothetical). One where the answer is unwelcome: the procedure forces the
  analyst to say the source is largely right about the mundane and to locate disagreement
  narrowly, which may undercut the analyst''s framing that the source is "delusional"
  — or it forces the conclusion that the analyst''s own vocabulary imposes a distinction
  the source doesn''t have.


