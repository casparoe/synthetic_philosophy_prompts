  "Title: Two Kinds of Exclusion


  The causal exclusion argument is usually presented as a dilemma for non-reductive
  physicalism. Mental properties are supposed to be distinct from physical properties,
  yet every mental event has a physical realizer. If the physical realizer is sufficient
  for the effect, then the mental property seems to add nothing; if it does add something,
  we get overdetermination. The standard replies try to show either that overdetermination
  is benign or that the mental property is not a separate cause but a higher-level
  description of the same cause. I want to suggest that these replies are answering
  different questions, and that the argument equivocates between two kinds of exclusion.


  Let me distinguish horizontal exclusion from vertical exclusion. Horizontal exclusion
  treats the mental and the physical as two candidate causes of the same effect, arrayed
  side by side in the same causal chain. The question is whether both can be causes
  without overdetermination. Vertical exclusion treats the mental and the physical
  as two candidate explanations of the same causal transaction, one at a higher level
  of description and one at a lower level. The question is whether the higher-level
  explanation is genuine or merely a shorthand for the lower-level one. The overdetermination
  horn belongs to horizontal exclusion; the epiphenomenalism horn belongs to vertical
  exclusion. Kim''s argument, I think, moves from one to the other without marking
  the shift.


  Once the distinction is on the table, the dialectic changes. The determinable/determinate
  reply, for example, is a reply to horizontal exclusion: the mental property is not
  a second cause alongside the physical, but a determinable whose determinate is the
  physical. That is a plausible answer to the overdetermination worry. But it does
  not answer vertical exclusion. Even if the mental is not a second cause, it might
  still be a mere representation of the physical cause, with no explanatory work of
  its own. Conversely, the interventionist reply—that mental properties can be variables
  in a causal model—is a reply to vertical exclusion: it shows that mental predicates
  can figure in explanations that support interventions. But it does not by itself
  answer horizontal exclusion, because being a variable in a model is not the same
  as being a cause in the world.


  I want to argue that the exclusion argument is best understood as a demand for a
  criterion of causal relevance, not as a proof of epiphenomenalism. The horizontal
  version asks: what makes something a cause rather than a mere condition? The vertical
  version asks: what makes an explanation causal rather than merely descriptive? These
  are different questions, and the answers need not coincide. A property can be causally
  relevant in the horizontal sense without being explanatory in the vertical sense,
  and vice versa. If that is right, then the exclusion argument does not have a single
  conclusion. It has two, and they can come apart.


