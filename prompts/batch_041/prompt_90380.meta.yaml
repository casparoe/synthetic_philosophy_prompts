  and vertical exclusion are independent, then one can accept the causal closure of
  the physical and still insist that mental properties are horizontally relevant,
  or accept that mental explanations are vertically genuine and still deny that mental
  properties are horizontally distinct. But this is not obviously a cost; it may simply
  be the correct diagnosis. The real disagreement is not about whether mental causation
  exists, but about which of the two questions we are asking when we ask whether it
  exists.


