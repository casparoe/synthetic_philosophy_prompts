  Let''s design belief set for higher-order evidence / epistemic akrasia:


  1. I think you should always believe what your evidence supports, and your evidence
  includes facts about your own reliability and about how you formed the belief.

  2. I think it''s irrational to believe a proposition while also believing that your
  evidence doesn''t support it—i.e., epistemic akrasia is always irrational.

  3. I think in cases of peer disagreement, you should conciliate: if an equally informed
  and equally rational person disagrees with you, you should split the difference
  or suspend judgment.

  4. I think in cases where you have higher-order evidence that you''ve reasoned badly
  (e.g., you learn you''re drunk, or that people like you are systematically biased),
  you should reduce your confidence, even if your first-order evidence still seems
  to support the belief.

  5. I think there are cases where you can rationally believe P while believing that,
  from your current evidence, you shouldn''t believe P—because your higher-order evidence
  is misleading.

  6. I think a person can be rational in believing P even if they are irrational in
  believing that P is rational.

  7. I think the point of epistemic rationality is to believe what''s true, and sometimes
  believing against your higher-order evidence is the best way to get the truth.

  8. I think you should not be moved by the mere fact that you''ve made mistakes in
  the past, if you''ve checked your reasoning now.


  Tensions:

  - (2) no akrasia vs (5) sometimes akrasia rational. Direct, obvious. Maybe make
  (5) less direct: "I think you can rationally believe P while believing that your
  belief in P is not justified by your evidence" — that''s akrasia. Tension.

  - (1) evidence includes higher-order facts vs (4) reduce confidence on higher-order
  evidence — consistent.

  - (3) conciliationism vs (8) not moved by past mistakes — tension? Conciliationism
  says peer disagreement is higher-order evidence; if you''ve checked, maybe you can
  remain steadfast. But (3) says always conciliate. (8) says don''t be moved by past
  mistakes. These could be in tension: peer disagreement is a kind of higher-order
  evidence, and past mistakes too. But not direct.

  - (1) + (2) + (4) vs (5): if evidence includes higher-order, and no akrasia, then
  (5) is ruled out. Genuine.

  - (6) vs (2): (6) says rational to believe P while believing P is irrational? That''s
  akrasia. Tension.

  - Apparent tension: (1) and (5) seem to conflict, but (5) can be interpreted as
