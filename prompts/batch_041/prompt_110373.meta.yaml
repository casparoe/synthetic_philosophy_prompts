  Also worth noting: the World State''s citizens do take soma to smooth over distress
  (Linda''s soma holidays, the Deltas'' soma rations), and the "soma holiday" — soma
  removes negative affect. That''s directly relevant to the hedonistic imperative:
  the state does use a hedonic technology. So the reading isn''t simply "BNW isn''t
  about hedonic engineering" — soma is exactly a crude version of what Pearce wants,
  and Bernard''s soma; the World State deliberately keeps suffering in the world (Mond
  says they''ve kept some unpleasantness? Actually they abolished "the unpleasant"
  but the Reservation exists as a controlled alternative; and the Epsilons'' lives
  involve hard labour, and the state''s conditioning makes them content).


  Also good: the novel''s failure mode — the World State''s happiness is achieved
  partly by making people unable to perceive their own situation (conditioning them
  to love their servitude, to be incurious), whereas Pearce''s proposal is about hedonic
  set-point and motivational architecture, not about epistemic incapacitation; but
  the two are hard to separate — that''s a real philosophical point: if you remove
  the aversive signals that ground the capacity to notice and correct your situation,
  you may remove the basis of self-government and of caring about truth. That''s a
  substantive objection worth having the model address: whether the hedonistic imperative
  requires the "shallow" content that BNW shows (promiscuity, feelies) — no, that''s
  an aesthetic/taste issue that Pearce would say is contingent, and the novel conflates
  the hedonic engineering with Huxley''s own distaste for mass culture and American
  consumerism.


  Also a nice angle: BNW''s world still has death, aging (partially), illness, grief
  (Linda), exile, and suffering on the Reservation; the state doesn''t aim at eliminating
  suffering but at eliminating *discontent* — a stability-maximizer, not a suffering-minimizer.
