  Content plan:

  - Role assignment + instruction to brainstorm first, then give the reading.

  - Explain the hedonistic imperative in my own words (injecting the niche idea):
  the claim that suffering is not an inevitable feature of life but a biological phenomenon
  — a product of specific signalling in the brain — and that once we understand it
  well enough we could redesign it away with biotechnology; not just for humans but
  for all sentient life, including wild animals, whose lives are largely a matter
  of hunger, fear and being eaten; the aim isn''t to make life tolerable but to abolish
  the negative end of the spectrum, and perhaps to shift the whole distribution upward
  (gradients of well-being); the objection that suffering is meaningful or motivating
  is, on this view, a bias in favour of the status quo; the technological ambition
  is something like a future where no one is depressed, no one is in pain, no predator
  needs to kill.

  - The ask: read Brave New World through this lens.

  - Questions: Is the World State an approximation of the hedonistic imperative? I
  suspect not — it looks like a regime that optimizes stability, and uses pleasure
  (soma, the feelies, promiscuity) as an instrument of that, not as the goal. Where
  does that distinction show up in the book? Which scenes? (the Reservation and Linda''s
  death — the novel''s most vivid suffering is outside the engineered world, and the
  World State does nothing about it; the Savage''s grief and suicide at the end —
  the state''s response; the conditioning that makes Deltas and Epsilons content with
  lives of hard labour — is that the abolition of suffering or the abolition of complaint?;
  the World Controller''s defence of the system, which is a defence of stability and
  of the right to be unhappy; the exile of Bernard and Helmholtz; the treatment of
  old age and death.)

  - Where does the novel genuinely pose a problem for the hedonistic imperative that
  isn''t just a preference for the status quo? E.g., the claim that you can''t be
  a full subject without the capacity for suffering; the Savage''s insistence on the
  right to be unhappy, pain as a condition of beauty and of art, the contrast between
  the Savage''s Shakespeare and the feelies; the question of who decides the level
  of hedonic set-point; the possibility that the citizens'' satisfaction is not really
  well-being but the absence of friction; the worry that abolishing suffering requires
  abolishing the kind of agency that makes suffering matter.

  - Where does the novel cheat or mislead: Huxley stacks the deck by tying the hedonic
  technology to a caste system, eugenics, and a totalitarian state — the reader is
  invited to blame pleasure for things that belong to coercion. Would a hedonically
  engineered society need to be unfree? Argue it, don''t assume it.

  - Also: the novel''s blind spot about animals — the hedonistic imperative is most
  radical about wild animals; BNW says nothing about non-human suffering (the Reservation,
  the "savage" humans). What would the novel''s world have to look like to take the
  wild-animal part seriously?

  - And: does the novel''s ending — John''s suicide, the World Controller''s calm
  — constitute an argument? What would the hedonistic imperative say is the actual
  mistake in the Savage''s position?

  - Ask for: a section on scenes to point to, a section on where the novel resists
  the reading, a verdict on what the novel adds that argument alone doesn''t.

  - Constraints: no quotations, plot-level knowledge only, no citations, keep it faithful
  in both directions (don''t reduce the novel to an illustration; don''t distort the
  hedonistic imperative to make it fit).

  - Prompt-engineering: "think step by step", "begin with a short brainstorm of the
  candidate readings, then pick the strongest and develop it", "if you''re unsure
  of a plot detail, say so rather than inventing", role: "an expert in applied ethics
  and the philosophy of mind who also reads novels closely."


