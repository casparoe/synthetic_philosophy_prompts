  strangers'' lives, and a third run in which she breaks the bank at roulette and
  everyone survives.


  Read the film through the path-dependence debate, and make the reading earn its
  keep in both directions. The distinctions I want it to trade in: weak path dependence,
  where history matters but the destination is shared, versus strong path dependence,
  where early accidents are amplified and the system is locked into one of several
  equilibria it cannot leave; equifinality, the rival picture in which many routes
  converge on one attractor, so that the same outcome arrives anyway; and the notion
  of counterfactual robustness -- an outcome is robust just in case it survives nearby
  perturbations of the path. The film looks like it argues for one thesis and demonstrates
  another: the bystander flash-forwards assert unbounded downstream effects of trivial
  encounters, while the three runs keep delivering the couple back to the same place.
  Then the casino scene complicates everything, since Lola''s scream appears to override
  chance rather than exploit it.


  So: does the film depict contingency or equifinality, or does it mistake the two?
  Are the three runs three counterfactual histories of one world or three worlds,
