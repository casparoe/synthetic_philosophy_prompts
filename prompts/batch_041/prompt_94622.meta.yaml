  truth, no falsity — and they can''t locate the flaw.


  Numbered argument:


  (1) A proposition is a single thing with a content: it is the kind of thing that
  is true or false, and its constituents — objects, properties, relations — are gathered
  into one content rather than merely listed.

  (2) If the constituents are merely listed (a heap), we have no proposition but a
  plurality.

  (3) So something must unify them: there must be something about the proposition
  over and above the constituents which makes it the case that the constituents are
  combined into one content.

  (4) The only candidate for that further something is a relation — call it the combining
  relation — holding between the constituents.

  (5) But a relation holding between the constituents is itself one more item, and
  if it is to be related to the constituents, that relating must in turn be unified
  with the relata; hence a further relation, and so on.

  (6) Either this regress is infinite, or it stops at something that is not a relation,
  or the relating at some stage is not itself a further item.

  (7) It cannot stop at something that is not a relation, because whatever unifies
  must relate the constituents to one another, and that is what a relation is.

  (8) Nor can the relating at some stage fail to be a further item, because then the
  constituents would be unified "by nothing", i.e., not unified at all — which is
  just (2) again.

  (9) So the regress is infinite, and an infinite regress of this kind is vicious:
  at no finite stage is the unity achieved.

  (10) Therefore no proposition is ever a unity; there are no propositions; so nothing
  is ever thought or said, and nothing is true.


  (11) But (10) is absurd.


