  ---


  I''m a second-year PhD student working on structured propositions, and a colleague
  in our metaphysics reading group has handed me an argument I can''t get out of my
  head. It''s a reconstruction of the old regress about relations — the one usually
  credited to Bradley — but he has tightened it in a way that I think is meant to
  close off the obvious escape routes, and I can''t work out whether it succeeds or
  where the trick is. I''d like you to act as an expert in metaphysics and the philosophy
  of language, think carefully before answering, and give me a diagnosis rather than
  a survey.


  The argument runs like this. (1) A proposition is a single thing with a content:
  it is the sort of thing that can be true or false, and its constituents — objects,
  properties, relations — are combined into one content rather than merely heaped
  together. (2) If they were merely heaped together, we would have a plurality, not
  a proposition. (3) So there must be something about the proposition over and above
  its constituents that makes them one content rather than many. (4) The only candidate
