  ---


  Two camps in the philosophy of mind have been talking past each other for decades.
  Illusionists hold that the properties we take ourselves to be acquainted with when
  we attend to our own experience — the raw feel of a colour, the ache of a tooth,
  the taste of mint — are not properties of our mental lives at all, but artefacts
  of introspection and of the way we talk about ourselves; the task of a science of
  consciousness is to explain why we are so thoroughly convinced that such properties
  exist, not to find them. Realists hold that these properties are perfectly real,
  whatever their ultimate nature, and that a theory which leaves them out has left
  out the very thing it was supposed to explain. The two sides disagree about almost
  everything except that the other side is wrong. Your job is to write the joint statement
  they could both sign after a genuinely good-faith adversarial collaboration.


  Write in British English. The document should have four sections.


  1. Agreed claims. A numbered list of propositions both sides can put their names
  to. Push the agreement as far as it will honestly go: what the explanandum is; which
  first-person reports count as data and which are already theory-laden; what any
  theory of consciousness must be answerable to; and what neither side is committed
  to, so that a reader does not mistake either position for something cruder (behaviourism,
  the denial that anything happens when one sees red, the denial that introspection
  ever tells us anything). Each claim must be one that a naive observer might reasonably
  have expected the two sides to disagree about — no platitudes, no claims so weak
  that no one would deny them.


  2. Disagreements. A table with one row per remaining disagreement and four columns:
  the issue; the illusionist''s formulation of its own position, worded so that an
  illusionist would accept it; the realist''s formulation of its own position, worded
  so that a realist would accept it; and the residual point of substance once the
  two formulations sit side by side. Where you suspect a row is largely a verbal dispute,
  say so and identify precisely which word or contrast is doing the work.


  3. Cruxes. The sub-questions such that settling one would move at least one side.
  For each: why it is a crux rather than a restatement of the disagreement; and what
  each side would count as an answer that tells against its own view. Prefer cruxes
  that are tractable — conceptual distinctions that can be drawn, or findings that
  could in principle be had — over ones that merely re-assert a metaphysics.


  4. Two cases, with predictions recorded in advance. Each side commits to what it
  predicts about:


  (a) the dial case: a subject is fitted with a device allowing an experimenter to
  shift, independently of the stimulus, her tendency to report a particular qualitative
  character, so that she reports the cool taste of mint while drinking warm salt water,
  and reports it with her usual confidence. What does each side say her experience
  is like in the moment before she speaks? What does each say her report is tracking?
  And what further measurement, if it were available, would separate the two predictions?


  (b) the borrowed-vocabulary case: a subject is brought up with no qualitative vocabulary
  at all and is trained to describe her experiences exhaustively in functional, attentional
  and dispositional terms — what she is attending to, what she is disposed to do,
  what she can discriminate. She becomes fluent. Does she still report her experiences,
  in a different idiom, or has she lost the ability to report them at all, or was
  there never anything for her to report? Each side states its answer and what would
  follow for its view if the other''s answer turned out right.


  Close the statement with a short section stating, for each side, the strongest consideration
  that the collaboration did not resolve, and say plainly whether the two positions
  can be expected to converge on further evidence or whether the remaining difference
  is a choice between two ways of describing the same facts.


  Do not attribute any of this to named authors or works, and do not name schools
  or labels beyond illusionism and realism; write the positions in plain terms so
  that the substance is intelligible to a reader who has never encountered the debate.


