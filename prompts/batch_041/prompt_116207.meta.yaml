  the parts have to be any particular shape. If it helps, there''s a whole computer-science
  project in this vein, Hofstadter''s Letter Spirit, where the aim is to get a program
  to design all twenty-six letters in a novel style after seeing just a handful of
  them; the letter category is treated as a ''conceptual skeleton'' of roles, and
  a style is what a designer does consistently in filling those roles. Her real subject,
