  Let''s write:


  I am teaching a seminar on decision theory and literature, and I want to use Tom
  Stoppard''s Rosencrantz and Guildenstern Are Dead as a test case for risk-weighted
  expected utility. The theory, as developed in recent decision theory, departs from
  ordinary expected utility by treating the agent''s attitude toward risk as a primitive
  rather than as a byproduct of the shape of the utility function. Instead of simply
  multiplying the utility of each outcome by its probability, it applies a risk function
  to the cumulative probabilities, so that an agent can weight the best and worst
  outcomes differently from the middle, and can be risk-averse or risk-seeking even
  with a linear utility function. It is meant to accommodate Allais-style preferences
  while retaining a broadly consequentialist, probabilistic framework.


  The play opens with Rosencrantz and Guildenstern betting on coin flips; Rosencrantz
  wins an improbable run of heads, and Guildenstern tries to reason about probability,
  causation, and the possibility that they are in the grip of supernatural forces.
  Later they meet the Player and his troupe, are swept into the plot of Hamlet, and
  end on a boat with a letter that condemns them. Their choices are small, repetitive,
  and largely without consequence until suddenly they are not; they rarely deliberate
  in any recognizable expected-utility way. I would like a reading that takes both
  the play and the theory seriously. Does the play dramatize a risk-weighted rather
  than expected-value stance? Is Rosencrantz''s willingness to keep betting on heads
  a kind of risk-seeking, or is it the absence of any probabilistic model at all?
  Does Guildenstern''s anxiety about the run of heads express a risk function that
  overweights the extreme, or does it show the limits of a theory that assumes known
  probabilities and well-defined outcomes? And what should we say about the Player,
  who seems to treat life and death as a performance, and about the final acceptance
  of fate that the play stages?


  I want the reading to be faithful in both directions: it should not reduce the play
  to an illustration of a formula, and it should not bend the theory to fit the play.
  Where does risk-weighted expected utility illuminate a scene or a character''s choice,
  and where does the play resist the reading because its world is one of radical uncertainty,
  scripted outcomes, and diminished agency rather than risk in the decision-theoretic
  sense? If the play exposes a gap between risk and ambiguity, or between choosing
  and being chosen for, say so plainly. End by saying what the play adds to the philosophical
  debate that argument alone does not.


  At the end, please state what would change your mind: which scene, textual detail,
  or theoretical consideration would lead you to a different verdict, and where your
  reasoning is most likely to fail.


