  Two colleagues of mine spent most of a workshop discussion on whether the Darwinian
  framework genuinely applies to culture. I was in the audience and took no side;
  I would like the exchange adjudicated rather than resolved in someone''s favour
  by fiat.


  The first, a selectionist, argued that Darwinian explanation requires only variation,
  heritability, and differential transmission. Culture supplies all three: songs,
  sayings, rituals, and beliefs differ from one another; some spread far more widely
  than others; and much of what spreads is learned from other people, so differences
  are carried down lineages. On that basis she was willing to call cultural items
  replicators and to treat their frequencies as selection-shaped. She conceded that
  transmission is noisy, but held that the standard conditions for a replicator —
  fidelity, fecundity, longevity — are matters of degree, and that where fidelity
  is low the remedy is to look for larger, more robust units of transmission rather
  than to abandon the framework.


  The second, an attraction theorist, replied that the analogy fails at heritability
  rather than at fidelity. On his account a person who learns a tune or retells a
  story does not copy it but reconstructs it out of her own expectations, and the
  errors are not random with respect to content: they are pulled repeatedly toward
  the same few forms, which is why the same variants recur in lineages that have had
  no contact. Where variation is directed toward attractors, the observed distribution
  of cultural forms is explained by the attractors, and differential reproduction
  does no work. He added that no one has produced a principled way of individuating
  a meme, and that without items whose frequencies can be tracked, talk of selection
  lacks a well-defined subject.


  She answered that directed variation does not abolish selection; it constrains the
  variation on which selection operates, much as mutational bias constrains genetic
  evolution without replacing it. She also said the individuation objection proves
  too much, since species are equally contested as units and population biology proceeds
  regardless. He answered that the cases are not parallel: genetic evolution is variational,
  with variation arising first and being sorted afterwards, whereas cultural transmission
  is transformational, the "mutation" being produced by the very process that explains
  the endpoint — and where a law-like transformer is available, selection is not merely
  bounded but unnecessary. She replied that a selection coefficient for a cultural
  variant is measurable in principle once a transmission channel is specified, so
  his objection marks an empirical gap rather than a conceptual one.


