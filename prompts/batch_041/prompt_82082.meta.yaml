  At a workshop on cultural evolution, two participants — neither of whom is me; I
  was in the audience — spent most of the discussion period on whether the Darwinian
  framework genuinely applies to culture. I''d like a careful adjudication of the
  exchange, move by move.


  The first (call her the selectionist) argued as follows. Darwinian explanation requires
  only three things: variation, differential transmission, and heritability. Culture
  has all three. Melodies, catchphrases, rituals, and beliefs vary; some spread further
  than others; and what spreads is largely what gets copied from person to person,
  so differences are transmitted down lineages. Given that, we are entitled to say
  that cultural items are replicators and that their frequencies are shaped by selection.
  She granted that transmission is noisy, but noted that the classic conditions for
  a replicator — fidelity, fecundity, longevity — are matters of degree, and that
  if fidelity is low the fix is to look for larger, more robust units of transmission
  rather than to abandon the framework.


  The second (the attraction theorist) replied that the analogy breaks at heritability,
  not at fidelity. When a person learns a tune or retells a story, she does not copy
  it; she reconstructs it from her own expectations, and the errors are not random
  with respect to the content — they are pulled systematically toward the same few
  forms, which is why the same variants reappear in unrelated lineages. Where variation
  is directed toward attractors, the distribution of cultural forms is explained by
  the attractors, not by differential reproduction, and so the selectionist story
  is idle. He added a second objection: no one has produced a principled way of individuating
  a meme, and without items whose frequencies can be tracked, talk of selection has
  no well-defined subject.


  She answered that directed variation does not abolish selection; at most it constrains
  the variation on which selection acts, just as mutational biases constrain genetic
  evolution without replacing it. She also said the individuation worry proves too
  much: species are equally contested as units, and population biology proceeds anyway.
  He answered that the cases are disanalogous: the genetic case is variational — variation
  arises first and is then sorted — whereas cultural transmission is transformational,
  with the "mutation" produced by the same process that explains the endpoint, and
  a law-like transformer makes selection unnecessary rather than merely bounded. She
  replied that a selection coefficient for a cultural variant is measurable in principle,
  given a defined transmission channel, and that his objection is an empirical gap,
  not a conceptual one.


  Please adjudicate. Rate each of the moves ... say which of them is right about what
