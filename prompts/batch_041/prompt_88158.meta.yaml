  Here''s my situation. I work at a mid-sized company, and my manager has asked me
  to build an internal survey about generational differences at work. The plan is
  simple: split employees into groups by birth year, ask everyone the same questions
  about what they want from a job, and report how the groups differ. The results are
  going to be used to design a mentoring program and to decide how we recruit.


  Two things bother me, and I can''t tell whether they''re the same worry or two different
  ones.


  The first is that the boundaries are plainly arbitrary. Someone born a week before
  the cutoff and someone born a week after land in different groups, and I''ve noticed
  the birth-year ranges I''ve been handed don''t even match the ones in last year''s
  deck. If the line moves depending on who''s writing the report, in what sense are
  there two groups rather than one big smear?


  The second bothers me more. Since we started running workshops built around these
  labels, the younger employees have started describing themselves in exactly those
  terms, and managers have started treating them that way. So when the survey comes
  back saying the youngest group wants X, I won''t know whether I found that out or
  caused it. It feels less like measuring a group and more like manufacturing one.


  A friend of mine who reads a lot of philosophy said two things that stuck with me.
  First, he said a category is real if belonging to it tells you something you didn''t
  already know — if it lets you predict things about a member that you couldn''t have
  predicted before you knew the category. Second, he said there''s a difference between
