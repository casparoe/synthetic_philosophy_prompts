  The classic name: "Good''s theorem" / "the value of information is non-negative".
  In decision analysis it''s sometimes "the expected value of perfect information
  (EVPI) is non-negative" and EVSI. Some call it Good''s theorem. Yes.


  Subtleties to embed:

  1. The theorem is about *expected* value ex ante; the realised value can be negative
  — you can end up regretting that you looked.

  2. Free information only. Costly information can have negative net value.

  3. Value is zero unless it can change the act you choose (or, in the more general
  case, unless it changes which act is optimal... actually if it doesn''t change your
  act, EVSI=0). Precisely: EVSI = E[value of best act given signal] − value of best
  act now. If the same act is optimal in every signal-state, EVSI = 0.

  4. It assumes a single agent with a fixed prior and a fixed utility function over
  a fixed outcome space, updating by conditionalisation, and then acting as an expected-utility
  maximiser. It doesn''t cover: group decisions, multiple principals, information
  that changes the decision problem itself (new options — well, new options only help),
  information that changes your values, information that arrives as an unstructured
  narrative, information you might ignore or misuse (motivated reasoning, "information
  avoidance"), information whose very acquisition changes the state of the world (observer
  effects, information that leaks — e.g., a survey that signals the council''s plans
  and thereby changes behaviour; that''s key! "The act of gathering information is
  itself an act with consequences" — the theorem assumes the act of experimenting
  has no direct effects. That''s a big one for a public body: consulting on a scheme
  changes the politics; a monitoring programme changes what the regulated do.)

  5. Also the theorem doesn''t say "more information is better than less" (a subtler
  point: it says the option to observe is better than not, but comparing two experiments
  is different; and there''s no general theorem that a finer partition is better than
  a coarser one... actually for free information, a finer partition is weakly better
  than a coarser one, since a finer partition''s value ≥ coarser''s. Hmm: is that
  right? If E refines F, then the value of E ≥ value of F. Yes, that follows by the
  same argument applied to the coarse info: EU(best given E) = E[E[U|best act|E]|F]...
  yes, refining is weakly better. So finer free info is weakly better. But: the "expected
  value of a sample" can be non-monotonic in sample size only if there''s a cost.
  OK so I should be careful not to state something false. I''ll keep the prompt''s
  framing: the theorem is about the option to observe a signal for free, relative
  to your own prior and utility, and it does not license "gather more information
  before deciding" in general because of costs, decision-irrelevance, and the act
  of gathering having effects.)

  6. Also: the value of information is measured in your own utility — if the decision
  will be taken by others or the utility is contested, "value" is ill-defined.

  7. Another subtlety: "the theorem assumes you''ll actually use the information"
  — but more deeply, it assumes your *posterior* is what you''d base the decision
  on. If you know you''re prone to overreacting to noise (a known bias), the theorem
  as applied to your actual behaviour can fail: the value of information for a non-Bayesian
  agent can be negative. That''s a real result — for non-expected-utility agents,
  info can be bad (e.g., an agent that will act on the signal suboptimally). Good
