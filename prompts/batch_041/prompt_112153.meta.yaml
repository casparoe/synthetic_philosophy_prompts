  Actually the deep point about Good''s theorem that''s "in the weeds": Good''s theorem
  states that the expected value of information is non-negative *for an agent whose
  utility is defined over the same space and who will act as a Bayesian expected-utility
  maximiser* — the subtlety is that the value is non-negative only in expectation
  and relative to the agent''s own prior and its own utility function; it can be negative
  in any particular realisation; it also assumes free information and no computational
  cost, and it assumes the agent updates by conditionalisation and doesn''t change
  its utility function or the set of available acts (or, if new acts become available,
  that''s fine, that only adds value — actually Good''s theorem holds even if new
  acts appear? Let''s think: Good''s theorem: the expected utility of the optimal
  act after observing E, averaged over E, is ≥ the expected utility of the optimal
  act before. If the act set expands, then value is still ≥. Yes — expanding the act
  set can only increase the max. So new acts are fine. The key assumptions: free information,
  perfect conditionalisation, same utility function, and the agent will actually act
  on the information. Also, the theorem gives non-negativity only in expectation,
  so ex post you might be worse off (you might wish you hadn''t known — the "value
  of information can be negative ex post" point; also the "expected value of information
  is non-negative but the value of *costly* information may be negative").


  Another subtlety: Good''s theorem doesn''t say that more information is better than
  less — it says information is better than no information, in expectation. And it''s
  non-negative only if you actually follow the recommendation; if you collect info
  and then ignore it, no gain. Also, "the value of information" in decision analysis
  usually means EVSI (expected value of sample information), which is about a *sample*
  — a noisy signal — and it can be negative if you have to pay for it. Also there''s
  the distinction between the value of information to a single decision vs a sequence,
  and the "information has value only if it can change your decision" point: if you''ll
  take the same act regardless of the signal, EVSI = 0.


