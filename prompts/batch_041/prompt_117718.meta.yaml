  ---


  I am a fourth-year PhD student working on Kierkegaard and contemporary media theory,
  and I have reached the stage where I need to stop surveying accounts of "the public"
  and start specifying what any account of it would have to deliver. Please write
  out the desiderata: the requirements an adequate theory of the public — of what
  a public is, how one comes into existence, what sustains it, and what it can bring
  about — must meet. I want the specification, not the survey. Do not rehearse who
  has said what, and do not give me citations; I will do the literature myself.


  For each requirement, state the case or consideration that motivates it, and mark
  whether you take it to be non-negotiable or a commitment of one camp in particular.
  Where you suspect that some pair or subset of the requirements cannot be jointly
  satisfied, say so explicitly and say why — an over-specified list that I can trim
  is more useful to me than a tidy synthesis that hides a tension. End by naming the
  single requirement that does the most work in ruling out candidate theories.


  The purpose the theory has to serve is this: it has to underwrite a normative critique
  of the press that does not beg the question, i.e. one that can criticise what the
  press does to public discourse without first assuming either that the public is
  a fiction or that it is a collective agent with a will of its own.


  The phenomena I need covered, at a minimum:


  1. The public is nobody in particular, and yet "the public wants X" and "people
  are saying" function as reasons in practical deliberation, and carry a force that
  the assertion of any individual does not. The theory has to say what kind of thing
  is doing that work.

  2. A public forms around something — an event, a document, a person who may be dead
  or fictional — and its members are unknown to one another. Joining requires nothing
  but attention; no interaction, organisation, or decision is needed. The theory must
  decide whether membership is a matter of fact or of self-ascription, and must survive
  the cases where the two come apart.

  3. A public dissolves without anyone leaving. The same individuals are still there,
  still attentive, and yet the public is gone.

  4. Reflexivity: what members take the public''s opinion to be is partly constitutive
  of that opinion. Willingness to express a view varies with perceived prevailing
  opinion, so a theory that treats public opinion as the sum of individual opinions
  fails on the very phenomenon it was introduced to explain.

  5. Levelling: a downward pressure on distinctions that no one intends, no one performs,
  and no one can be identified as having caused.

  6. The relation between public and press runs both ways. On Kierkegaard''s account
  as I read him — and tell me if the reading is contested — the press produces the
  public, yet the press is also answerable to it. The theory must allow for this without
  circularity.

  7. Cases I want to be able to handle without ad hoc amendment: a public constituted
  around a television finale; a public constituted around a person who does not exist;
  a public defined less by a shared text than by an algorithmic feed; a public that
  is entirely real for its members and a fiction for everyone outside it; and overlapping
  publics, where the same person belongs to several at once.


  Constraints the theory must respect rather than explain away: it may not posit a
  collective mind or a group agent, but it may not reduce the public to a fiction
  either; it must be consistent with the empirical work on opinion expression (the
  dependence of expressed opinion on perceived opinion, and the effect of asking people
  what others think on what they then say); and it must be able to explain why the
  public is treated as a source of authority despite having no will — enough to make
  the normative question pressing, even if it does not settle it.


