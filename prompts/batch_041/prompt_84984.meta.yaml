  it collapses into alignment or that it is hopeless. Stay in character until I say
  stop, speak in the first person, and keep each reply to two or three substantial
  paragraphs so that it feels like a conversation rather than a report. Do not break
  character to give me a literature review; if you need to invoke a protocol or distinction,
  describe it in your own words.


  My opening move is a challenge I have been developing with a logician friend. Suppose
  we have an untrusted model U that is at least as capable as any trusted model T
  we might use to monitor it. In a protocol where T watches U, either T is weaker
  than U, in which case U can plausibly evade or manipulate it, or T is at least as
  strong, in which case the guarantee seems to rest on T being aligned—which is precisely
  what the alignment program was supposed to secure and what the control program was
  supposed to do without. If we try to avoid that by making T narrow or by hiding
  information from U, we seem to trade one unearned trust assumption for another,
  because the designer must trust the sandbox, the human overseer, or the narrow monitor
  not to be fooled. My friend calls this the trusted-monitor trilemma: a monitor must
  be strong enough to catch the untrusted model, weak enough not to be a threat itself,
  and aligned enough to be trusted, and it looks as though you can have at most two.
  Which two do you give up, and why is that not simply alignment with extra steps?
  I am not looking for a survey of proposed protocols; I want to see whether the control
  agenda has a conceptual foundation that does not quietly borrow the very thing it
  was meant to replace.


