  I like "information is physical" as the slogan; multiple readings:

  1. Trivial: any piece of information must be borne by some physical state (a substrate),
  so there can be no disembodied information.

  2. Substantive-but-modest: the notions of information in Shannon theory, when applied
  to physical systems, are tied to physical states/records (Landauer–Bennett: logical
  irreversibility has thermodynamic cost; measurement/erasure costs).

  3. Substantive-strong: thermodynamics of computation — Landauer''s principle, Szilard
  engine, demon exorcised by the cost of erasure/reset; second law rescued.

  4. Radical-metaphysical: physics is fundamentally informational — it from bit; the
  physical world is constituted by bits; "the universe is a computation".

  5. False/confused readings: conflating Shannon information with thermodynamic entropy;
  reading "physical" as "energetic" or thinking that because information is physical,
  information can''t be abstract/implemented multiple times (multiple realizability
  worry); thinking it licenses "the observer creates reality"; or the reading where
  "physical" means "the demon''s knowledge is itself a physical thing so it must heat
  the gas" — a misapplication.


  The context: a colleague used it to shut down the demon worry. Which reading supports
  that? The one where erasure of the demon''s memory has a thermodynamic cost — but
  note that this requires the specific erasure principle, not the general slogan;
  and there''s a subtlety: the cost only bites for logically irreversible operations,
  and one can even run a demon with a reversible memory (Bennett''s claim that measurement
  can be done without entropy cost, the cost being in erasure/restoring the memory
  to its standard state). Also the quantum-thermodynamics result that the second law
  can be derived from information-theoretic considerations. Also note the slogan does
  nothing about the "no free lunch" issue: the general claim "information is physical"
  is compatible with the demon winning if you allow an infinite/unlimited memory (erasure
  cost deferred), or if erasure is done at some cost but the demon still extracts
  more work. Actually Bennett''s resolution: demon must erase at the end, costing
  kT ln2 per bit, restoring the second law. The subtlety: if the demon''s memory is
  never reset, the second law isn''t violated but you can''t run it cyclically — the
  issue is about cyclicity. That''s a nice substantive point: the slogan alone can''t
  do the work; what does the work is a specific claim about the cost of resetting
  the memory plus the requirement that the demon be a cyclic process.


  Also: "information is physical" could be read as trivial and thus can''t settle
  anything; the demon question is whether a *physically realizable* being can extract
  work from a single heat bath in a cycle — that''s a physics question about a cycle,
  not about the ontology of information.


  Also a fourth reading: information-theoretic notions (entropy, mutual information)
  are physical quantities in the sense of being definable in terms of ensembles of
  physical states — "the Gibbs entropy is not ignorance, it''s a real property of
  the ensemble." Actually the slogan could be used to oppose the "entropy is just
  ignorance" view (i.e., to say the second law is about something real, not about
  our knowledge). Interesting tension: "information is physical" is sometimes used
  to *reject* the epistemic reading of entropy. So someone could use it both ways.


