  to have actually invented, so someone who independently arrived at the same device
  earlier but delayed filing, or chose to publish rather than patent, can lose everything
  to a later rival. Scientific prizes and eponymy likewise attach a discovery to a
  small number of names, and priority disputes are treated as serious moral matters
  rather than as administrative bookkeeping. I want to understand what philosophical
  commitments this cluster of practices presupposes. Does it presuppose that discoveries
  are the acts of individual minds rather than inevitable products of a social process?
  That credit is a deserved reward for intellectual labor? That the identity of the
  discoverer matters for truth, progress, or justice -- or only for incentives? And
  are these commitments consistent with the fact of multiple discovery, or does the
  practice merely fit them loosely?


