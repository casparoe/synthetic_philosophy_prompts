  program reflects this. When a client tests positive, the counsellor''s protocol
  treats disclosure to a named "treatment supporter," usually a relative, as part
  of the care plan rather than an optional extra; the supporter is enrolled alongside
  the client, given the same adherence training, and the household is what the program
  follows up with. Clients who decline a supporter are still offered care, but they
  are routed to a lower-intensity adherence track, and the file is coded as "unsupported."
