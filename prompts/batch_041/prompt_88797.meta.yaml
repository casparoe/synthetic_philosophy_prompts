  line with the clinical arm: family or household consent in addition to individual
  consent, a household-level benefit-sharing arrangement, and a "relational confidentiality"
  rule under which a participant''s supporter may be told results relevant to the
  supporter''s own health, with or without the participant''s agreement. Some members
  think this simply extends the Trust''s existing ethic to research; others think
  it smuggles a communitarian paternalism into a context where the individual''s interest
  in controlling information about her own body is the whole point.


