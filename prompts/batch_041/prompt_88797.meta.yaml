  if any, each one requires or merely fits with; whether they are in genuine tension
  or presuppose compatible things at a different level of description; and where each
  is underdetermined between the views that would explain it. Be careful to distinguish
  a conception in which relations constitute the person — so that harm to a person
  is ipso facto a change in her relations, and the relevant unit of consent or standing
