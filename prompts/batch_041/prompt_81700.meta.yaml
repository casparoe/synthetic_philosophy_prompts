  I''m a science and ideas journalist at work on a long feature about the science
  of pleasure, and I''ve hit a philosophical snag that I''d like you to help me get
  straight before I write the framing. My reporting has taken me through the now-standard
  research distinction between the systems that make us seek something and the systems
  that make us enjoy it, and through a body of work suggesting that what we call pleasure
  is not one process but a motley: the warm animal contentment of a bath, the cold
  spike of relief when bad news turns out to be false, the slow satisfaction of a
  proof clicking into place, the gleeful pleasure some people take in a rival''s humiliation.
  A researcher I interviewed put it bluntly: "Pleasure is a gerrymandered category,
  closer to ''weed'' than to ''water''." And a philosopher I spoke to said the upshot
  is that hedonism — the view that pleasure is the only thing good in itself and pain
  the only thing bad in itself — has been refuted not by any counterexample but by
  its own central term. I''m inclined to agree, and I want to state the conclusion
  sharply: if there is no one feeling that all pleasures share, then there is no single
  good for hedonism to name, so hedonism is not merely false but ill-formed, and the
  honest positions left are a pluralist objective list or a desire-satisfaction theory.


  But two things nag at me. First, a colleague says the "no common feeling" point
  only shows that pleasure can''t be defined by a single sensation, not that it isn''t
  a single value — and that the view can be repaired by saying pleasures are unified
  not by how they feel but by something like being the objects of a certain pro-attitude,
  which strikes me as circular: if pleasure is just what we''re for, then hedonism
  says the good is what we''re for, which is just desire-satisfaction in a costume.
  Second, I don''t see how hedonism can even be stated without a common currency:
  if two pleasures have nothing in common, on what scale does one outweigh the other,
  and doesn''t "maximize pleasure" presuppose exactly the single quality the science
  denies? So: is the researcher right that heterogeneity kills hedonism, is my colleague
  right that it only kills one formulation, and if the latter, what precisely does
  the repaired view say pleasure is — and does that repair save it or only rename
  the problem?


