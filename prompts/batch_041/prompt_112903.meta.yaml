  Design the guest''s position (the injected idea):


  Guest: an unnamed philosopher who argues that the integrity objection is best understood
  not as an objection about deliberation but as an objection about *the structure
  of justification* — specifically, she distinguishes:


  (A) The "deliberative" reading: the utilitarian theory is defective because it requires
  the agent to rehearse a maximizing thought when deciding to save her spouse. Reply:
  self-effacement / sophisticated consequentialism; the theory''s criterion of rightness
  need not be the agent''s deliberative guide.


  (B) The "residual justification" reading: even granting self-effacement, the theory
  must hold that the agent''s action is justified *only* by its utility; and this
  means that had utility favored a stranger, the agent would have been *required*
  to save the stranger — and, crucially, that the agent''s love for her spouse appears
  in the theory only as a causal mechanism that happens to produce utility, so the
  agent''s own reason ("she is my wife") is never, in the theory''s own terms, a reason.
  Call this "the reason-substitution claim": the theory can at best license the agent
  to act on reasons that the theory does not itself recognize as reasons.


  Then her novel move: she argues that the reason-substitution claim generates a *conditional*
  objection that does not depend on any anti-consequentialist intuition about partiality
  — it depends only on the claim that a theory of rightness must be able to state
  the reasons for which its required actions may be done. She calls this "the reasons-availability
  constraint." And she concedes that this constraint is itself a substantial metaethical
  commitment, which she then must defend. So the interview can press: is the reasons-availability
  constraint a requirement of any theory of rightness, or an artifact of a "morality
  system" that Williams himself rejected? That''s a nice self-undermining tension:
  Williams rejected the "morality system" (obligation, blame, the peculiar institution),
  so the guest''s reconstruction may make the objection depend on a feature of the
  morality system — a nice in-the-weeds tension the model should notice.


  Also add: she claims that the one-thought-too-many objection, on her reading, applies
  equally to a Kantian who must add the thought "this maxim is universalizable" —
  and hence is not a parochial anti-utilitarian point but an argument against *any*
  "criterial" theory that requires a justifying thought the agent''s motivating reason
  must track. But she also wants to exempt virtue ethics and particularist approaches,
  and that exemption looks ad hoc — another pressure point.


  Also add: she has a further empirical/psychological claim: that agents who actually
  do the "substitution" (deliberate from the criterion) suffer a distinctive motivational
  pathology — she calls it "justificatory drift" — which she claims is supported by...
  hmm, careful, I shouldn''t assert empirical support that doesn''t exist. Instead
  I can say she *claims* there''s a phenomenon and the interviewer should press on
  whether it''s an empirical claim or a conceptual one. Good — that''s an in-the-weeds
  question about the status of the claim (is her objection empirical or conceptual?
  if empirical, what evidence would tell?).


  Another pressure point: the "consequentializer" reply that the theory is self-effacing,
  and Williams''s/others'' rejoinder that self-effacement is itself a cost (an "esoteric"
  morality, Government House). And the "one thought too many" reply that the objection
  conflates the agent''s *justification* with the agent''s *motivation* — the agent
  can act for the reason "she is my wife" and this can be the *right-making* feature
  under a sophisticated consequentialism? No — sophisticated consequentialism says
  the right-making feature is consequences, but the agent''s motivating reason may
  be her love. That''s the key reply. And then the guest''s "reason-substitution"
  reply: granted the agent may be motivated by love, the theory still cannot cite
  love as a reason; it can only cite it as a cause. Good.


  Also: the "integrity" side. The objection is about integrity: utilitarianism demands
  that the agent treat her own projects as just one input among others. Pressure:
  does the objection require a metaphysical thesis about the self as constituted by
  its projects (a "constitutive" reading) or merely a normative thesis about the value
  of a life''s coherence? And if constitutive, doesn''t it prove too much (e.g., can
  an agent have conflicting ground projects)? And does it presuppose a non-relational
  conception of the self that Williams himself criticized elsewhere (Problems of the
  Self)?


  Also: is integrity a moral value at all? If integrity is defended on non-moral grounds,
  why should a moral theory answer to it? That''s a classic pressure point (the "why
  should morality answer to non-moral values" question). Williams''s reply: integrity
  isn''t a value the theory must promote; it''s a presupposition of there being a
  subject who can be addressed by moral demands at all. The interviewer should press
  that.


  Also: the question of whether the objection is best run at the level of *reasons*
  or *responsibility*. Williams''s "negative responsibility" point: utilitarianism
  makes you responsible for what you allow, and thereby inflates the self. There''s
  a distinction between the alienation/integrity strand and the responsibility strand.


  Also: the "one thought too many" case is usually discussed as a case of *partiality*
  (special obligations), which some argue is the nearest-and-dearest problem, not
  the integrity problem. The guest claims they are the same problem; press on whether
  that identification is correct, i.e., whether the nearest-and-dearest objection
  can be run without the integrity apparatus (e.g., via the value of love). If it
  can, her unification may be idle.


