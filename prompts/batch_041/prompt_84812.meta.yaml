  has no intrinsic order; the fact that the sum depends on order means there''s no
  well-defined expectation; you can''t privilege the natural order without further
  argument, and even the "natural" order is arguably an artefact. Also the payoff
  2^n/n with alternating signs: the probability-weighted terms are (−1)^{n+1}/n, which
  is the alternating harmonic series, summing to ln 2 in the natural order. But the
