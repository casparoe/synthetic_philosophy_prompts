  So the conceptual issue is: the expected value of the Pasadena game is undefined
  because the sum over outcomes depends on the order of summation, and there is no
  privileged order. Why is there no privileged order? Because expectation is supposed
  to be a sum over a set of outcomes, and a sum over a set should be order-independent;
  the fact that it isn''t is a sign that the "sum" doesn''t exist. And the temptation
  is to say "well, just take the natural order, which gives ln 2" — but the natural
  order is an artefact of how we listed the outcomes (by n), not of the game itself.
  Actually there''s a subtlety: is the ordering by n somehow privileged? The outcomes
  are naturally indexed by n, so one might argue the order is canonical. But Nover
  and Hájek''s point (and the standard mathematical point) is that the expectation
  is defined as a sum over the sample space, which is unordered; the series is just
  a way of computing it, and a conditionally convergent series is not absolutely convergent,
  so it doesn''t have an order-independent sum. Also there''s a subtler point: the
  probability weights are attached to outcomes; the terms are 2^{-n} × payoff, and
  the payoffs grow and alternate. The rearrangement corresponds to reordering the
  outcomes in the sum — e.g., summing all the positive terms first, then the negative
  ones, gives +∞; the reverse gives −∞. And one can get any real number. So no value.


