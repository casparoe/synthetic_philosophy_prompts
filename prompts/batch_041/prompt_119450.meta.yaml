  Draft prompt:


  "I sit on the graduate medical education committee at our teaching hospital, and
  Thursday we vote on the simulation center''s proposal to move our surgical residents
  to proficiency-based progression: no resident touches a patient for central line
  placement or the first three laparoscopic cases until they have cleared a benchmark
  of three consecutive simulator runs that meet the checklist standard without an
  attending''s verbal prompts. The director of the simulation center argues the case
  in the terms of the four grades of mind Daniel Dennett lays out in Kinds of Minds
  — creatures whose behavior is fixed by selection, creatures shaped by reinforcement
  and their own history of consequences, creatures able to run the trial inside their
  heads and let the hypothesis die in their stead, and creatures whose thinking is
  done partly with inherited tools and symbols, so that a large part of the mind is
  acquired rather than grown. Her claim is that the old model — learn on the ward,
  under supervision, and let the consequences teach you — treats a surgeon as if she
  were a creature of the second grade, and that the entire point of having the third-grade
  capacity is that we are not obliged to buy our skill with other people''s complications.
  The division chief of surgery, who has two votes on the committee, is unmoved: he
  says judgment is not a simulation output, that his residents have learned by supervised
  consequences for thirty years and our outcomes are at or above the benchmark, and
  that the simulator-trained residents he has seen freeze at the first unscripted
  bleed.


  What complicates the vote is a fact the proposal does not mention. For the past
  year the simulation center has run an adaptive coaching system that watches each
  resident''s runs, predicts the next error and calls it out in real time, and the
  residents who look best on the benchmark are the ones who have leaned on it most;
  when the coach is off, their runs are ordinary. Our informatics representative has
  put a paragraph in the file arguing that the scheme the director is using has no
  name for what our trainees have become — they are not made to pay for their errors,
  because the environment has been rigged to forgive them, and they are not doing
  the simulating either, because the machine is doing it for them; she calls them
  prosthetic Popperians and says the benchmark is therefore measuring the wrong creature.
  Please draft the memo I''ll circulate before the vote. I need a clear recommendation
  — approve, reject, or approve with conditions — with conditions concrete enough
  to write into the policy (what the benchmark must be run on, what happens to the
  coach during assessment, who signs off, when we revisit), an honest statement of
  the strongest thing the chief has going for him, and a clear position on the informatics
  representative''s point: whether the committee should treat the trainee as the unit
  of competence or the trainee-plus-tools, and what follows from that for the four-grade
  story the director is telling."


