  oil, the wheels, the machine, the friction, and the motion, and what does Hume actually
  claim each of these does? Then tell me where the mapping breaks. I''m especially
  interested in the bits of Hume that seem to pull against a clean neutrality story
  — the idea that an inflow of money can temporarily quicken industry before prices
  catch up, the price-specie-flow adjustment under a fixed metallic standard, the
  difference between money and credit or capital, and the fact that Hume is writing
  before modern central banking and fiat money. Which disanalogies matter for the
  conclusion my friend wants (money doesn''t affect real output or wealth) and which
  are just historical noise? Does the oil analogy support that conclusion, or does
  it smuggle in a picture of the economy as a fixed machine whose parts don''t change
  when the lubricant changes? And if the analogy is carrying more than Hume''s own
  view can bear, what would be a better analogy for what he actually thinks money
  does?"


