  "I''m in a history of economic thought reading group and we''ve been going through
  Hume''s essays on money and trade. One guy keeps summing up Hume with the image
  of money as the oil in the machine of trade rather than one of its wheels — money
  just reduces friction, it doesn''t add any real goods or labor, so a country can''t
  get richer by adding more of it. He uses this to say that worries about central
