  I do not want the quiz to become a referendum on real, contested historical events,
  and I do not want it to turn on facts about particular atrocities. I also want readers
  sorted by what they say about cases rather than by the label they like, so no item
  may simply ask whether the word ''genocide'' is legal, moral, or political."


