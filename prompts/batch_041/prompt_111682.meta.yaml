  Marking scheme: must-hit points. E.g.:

  1. Distinguishes the integrity objection (Jim/George; the idea that utilitarianism
  severs the agent''s actions from his projects, "his life''s work", making him a
  mere conduit) from the "one thought too many" objection (the rescue case; about
  the *content and order* of the deliberation, not the demands).

  2. Locates the common core (if they say one objection): both attack the thesis that
  the agent''s commitments must be justified from an impersonal point of view; Williams''s
  claim that a "ground project" is what makes life worth living and so cannot be something
  the agent is required to hold conditionally.

  3. Handles the "overdemandingness vs. alienation" distinction — credits students
  who note that overdemandingness is a claim about the amount demanded and alienation
  about the relation between agent and commitment; Williams''s is (at least partly)
  the latter.

