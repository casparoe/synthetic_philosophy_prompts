  need not be occurrent; and says whether that answers the objection or changes the
  subject (if the consequentialist says "the agent need not have the thought, only
  the theory does", the objection may lose its target — or Williams may reply that
  the agent must then be *ready* to abandon the project, which is the real alienation).

