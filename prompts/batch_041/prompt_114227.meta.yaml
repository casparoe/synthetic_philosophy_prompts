  I''m putting together a session for a seminar on infinity and literature, and I
  want a reading of Borges'' "The Book of Sand" through the philosophy of the actual
  infinite — Cantor''s completed infinite versus the merely potential, Hilbert''s
  hotel, and the finitist and intuitionist objection (Brouwer, Weyl) that a completed
  infinite is either illegitimate or meaningless.


  The story gives us a physical object that seems to be an actual infinity: a book
  with no first or last page, whose pages never repeat, which cannot be exhausted
  and which the narrator finally abandons, hidden, in the National Library. Is that
  Hilbert''s hotel in book form, and does the story grasp that the object a finitist
  says cannot exist is exactly what the narrator is holding? The narrator''s response
  — obsession, then revulsion, then relief — reads to me like the "horror infiniti"
  the finitists thought was the only sane reaction; but Hilbert''s hotel is meant
  to show that the paradoxes of the infinite are just its arithmetic, so I want to
  know whether Borges dramatizes a legitimate intuition or a failure of nerve, and
  which the story itself seems to endorse. The last gesture — hiding the book in the
  basement of the Library, among the volumes that are never looked at — seems to matter.


  Then set "The Library of Babel" against it. There the totality is finite: the narrator
  says the number of books, though vast, is not infinite, and yet the story''s ending
  has him assert that the Library is unlimited and cyclical. Is that potential infinity
  (an endless succession) rather than Cantor''s actual infinite, and does the narrator''s
  despair belong to finitude (the totality is closed and we can never survey it) rather
  than to infinity? Borges seems to be running the two cases in opposite directions,
  and I''d like the reading to say how.


