  For an analogy audit, the seasons analogy is great: "death is like the turning of
  the seasons." How far does it hold? What maps onto what: the year/cycle, the seasons,
  spring following winter, the observer outside the cycle vs the person inside. Where
  it breaks: seasons recur; the individual does not return; a season-change is not
  a loss of a subject; the analogy presupposes a cyclical cosmology; if the transformation
  is into a new form (物化), then the "individual" isn''t preserved, and the analogy
  smuggles in a claim about identity; also the analogy''s comfort depends on the perspective
  of the dao vs. the perspective of the survivor; Zhuangzi''s point may be about the
  sage''s equanimity rather than about the metaphysics of death.


