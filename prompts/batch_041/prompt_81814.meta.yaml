  Draft:


  I''m a staff software engineer who runs the internal measurement-and-incentives
  module in my company''s data-science bootcamp. The cohort is experienced engineers,
  analysts, and ML practitioners; almost none have any formal philosophy training,
  and the assessment is closed-book with no internet access. I need one final written
  exercise for the module, and I''d like it built around an idea I''ve been floating
  to the team that I''m not confident is actually sound.


  The idea, which I''ve been calling the three-role classification, is this. Any metric
  an organisation optimises stands in one of three relations to the thing it actually
  cares about. First, the metric can be an estimate of the goal: the goal is real
  and independent, the metric is a noisy, partial indicator of it, and the failure
  mode under pressure is statistical — you select for the top of the metric''s range,
  where the goal-to-metric relationship is weakest, so the average goal value in the
  selected population falls even though nothing about the world has changed. Second,
  the metric can be a cause of the goal: latency, say, is not evidence about whether
  users are happy, it is one of the things that makes them happy, so optimising it
  genuinely produces the goal, and the failure mode is different — you overshoot the
  range where the causal link holds, or you buy the metric by spending some other,
  unmeasured cause. Third, the metric can be a constituent of the goal rather than
  a sign or a source of it: the number of completed transactions on a marketplace
  is not evidence of liquidity, it partly is liquidity, and there is no independent
  instrument to check whether the metric has drifted away from the goal, because there
  is nothing for it to drift away from. In the first two cases you can at least in
  principle detect divergence by measuring the goal separately; in the third you cannot,
  and the honest description of the failure is not that the metric stopped tracking
  the goal but that the metric became the goal.


  What I want the exercise to test is whether that classification does any work, or
  whether it''s a distinction I invented that collapses under pressure. Two specific
  worries I''d like the question to force out into the open. (i) Is the third category
  genuinely distinct, or is it just what the first category looks like to an analyst
  who hasn''t found the independent measurement yet — and if it is distinct, what
  follows about which countermeasures are available (independent audits, dashboards
  of multiple metrics, holding the metric fixed while varying the incentive, randomisation)?
  (ii) Where do the familiar horror stories fit — the support bot that closes tickets
  as resolved without resolving anything, the team that hits its coverage target with
  assertion-free tests, the bounty that produces more rats? Some of these look like
  the metric being a bad estimate, some look like the metric being a real cause that
  got overdriven, and some look like agents responding strategically to the fact that
  they are being measured — and I suspect that last one is not a fourth category but
  a cross-cutting thing that can happen to any of the three.


  I want the question anchored in concrete cases rather than abstractions. Use two,
  and pick them so that they land in different categories of the classification: an
  AI support assistant whose success is measured by ticket deflection rate, and a
  marketplace or two-sided platform whose health is measured by completed transactions
  per week. Students should have to commit to a category for each, say what the category
  predicts about how the metric will fail under increasing optimisation pressure,
  and then say which countermeasure the classification licenses for each case and
  why the countermeasures differ. Then the second half of the question should make
  them turn on the classification itself.


