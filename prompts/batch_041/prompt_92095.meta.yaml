  I host a small philosophy podcast (action theory, mostly, plus whatever my guests
  will let me get away with) and next week''s guest is a behavioural economist who''s
  spent fifteen-odd years modelling addiction and procrastination as pathologies of
  temporal discounting. Her line, and she''s happy to defend it, is that once you''ve
  got hyperbolic discounting on the table, "weakness of will" is just a folk-psychological
  label for present bias, and the philosophers should hand over the keys. I want to
  push her on that rather than let her do a victory lap, because I''m fairly sure
  the interesting stuff lives in the gap between the two vocabularies, not in either
  one on its own.


  Could you draft eight to ten interview questions, each with a follow-up keyed to
  the answer she''s most likely to give? I want the follow-ups to actually land, not
  just be "interesting, could you say more".


  Things I specifically want hit:


  - The identity claim itself: is akrasia *identical* to present bias, merely explained
  by it, or just correlated with it? And what does she think the philosophers'' word
  is doing that hers can''t? Follow-up should box her in whichever way she goes.

  - Where the phenomenon might go missing. Here''s my worry and I''d like it turned
  into a question: a *sophisticated* discounter precommits, so she never seems to
  act against her own best judgement; a *naive* one simply acts on her current ranking,
  which by her own lights at that moment is the best option going. In neither case
  does anyone act against their own judgement. So where''s the akrasia? I want her
  either to produce a case or to admit the phenomenon has quietly vanished.

  - Synchronic vs diachronic. Hyperbolic discounting is a story about preference *reversals*
  across time; the akratic is standardly supposed to act against her judgement *at
  the moment of action*. Are those even the same phenomenon, or is one being used
  to explain the other by pun?

  - What "judgement" comes to in her framework, if anything — can her model even represent
  the agent''s own verdict on her action as something distinct from her ranking of
  outcomes?

  - The felt struggle: the effort, the gritted teeth, the fact that it doesn''t feel
  like merely having different preferences at different times. Is that just epiphenomenal
  for her? If she reaches for willpower-as-a-limited-resource, I''d like a follow-up
  about what that''s supposed to be in the model, given how shaky that literature
  has looked lately.

  - Whether any pattern of choice would count against her model, i.e. what she''d
  accept as disconfirming.

  - The reverse direction: is there anything in the philosophers'' treatment of akrasia
  that the modellers should be taking on board, rather than the other way round?

  - The practical upshot: if akrasia is present bias, is the fix always a commitment
  device — precommitment apps, deadlines, lockboxes, that sort of thing — and what
  does the model say about people who can''t restructure their own choice environment?
  (One of my listeners works in addiction services, so I''d like something that isn''t
  just "download an app".)

  - A closing question that isn''t "any advice for our listeners".


