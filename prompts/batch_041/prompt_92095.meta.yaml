  4. "Judgement and the felt struggle" — two questions with follow-ups.

  5. "Testing the model" — one or two questions with follow-ups.

  6. "What the philosophers get to keep" — one question plus follow-up.

  7. "Close" — one question, no follow-up.


  Nothing generic — no "what drew you to this", no "where do you see the field in
