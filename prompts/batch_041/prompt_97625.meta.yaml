  about the asymmetry of evidence between the two kinds of hypothesis: an adaptive
  hypothesis can always be defended by redescribing the trait, whereas a byproduct
  hypothesis, she argues, can be stated in a form that is genuinely testable. She
  proposes a criterion she calls the counterfactual robustness test: a trait counts
  as a byproduct only if we can show that the same developmental or structural cause
  would have produced it across a wide range of selection regimes.


