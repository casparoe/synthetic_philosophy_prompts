  Plan the prompt:


  Formal memo style. Something like:


  "For a workshop on the epistemology of markets I have been asked to circulate a
  short statement of my position... Rather than a defense, I would like an audit..."


  Commitments, numbered:


  1. The price system''s epistemic virtue: prices encode dispersed private information
  and do so better than any centralized alternative; a price is a summary statistic
  for what many people know.

  2. I accept the no-trade results. Where traders share a prior, know one another''s
  rationality, and it is common knowledge that any trade is voluntary and that the
  initial allocation offers no gains from trade independent of information, no trade
  can arise from private information alone: any offer I receive at the going price
  carries no information I can act on, and the fact that my counterparty is willing
  to trade is itself a datum that should make me suspicious rather than confident.
  (Describe the Groucho point.)

  3. Empirical: markets exhibit massive volume, order-flow-driven price movement,
  and persistent disagreement; I regard this as evidence that the mechanism in (1)
  is functioning — heavy trading means heavy information aggregation.

  4. Rational disagreement: two equally well-informed, equally rational agents can
  look at the same asset and rationally hold different valuations; this is not a failure
  but a normal precondition of a market.

  5. Epistemic superiority of prices over stated opinion: a price is credible because
  it is costly — people have money at stake; forecasts and polls lack this.

  6. Perhaps add: I take a broadly "wisdom of crowds" view: aggregation of diverse
  private signals improves accuracy even when individuals are biased, provided errors
  are independent.


  Now the tensions:

  - (3) vs (2): the inference from volume to information aggregation is blocked by
  (2). If no-trade holds, volume is evidence that the conditions of (2) fail — i.e.,
  priors differ, rationality is not common knowledge, or trade is driven by non-informational
  motives. So (3) can''t be used as evidence for (1) without extra premises. Genuine
  tension. Also there''s an internal conflict: (3) treats volume as evidence of information
  aggregation; (2) says information alone can''t generate volume. Strong.

  - (4) vs (2): no-trade requires a common prior; rational disagreement of the kind
  in (4) requires heterogeneous priors (or non-common knowledge). But heterogeneous
  priors are hard to reconcile with (1) and (5): if disagreement stems from different
  priors rather than different evidence, then prices aggregate priors, not information,
  and the "wisdom of crowds" claim in (6) requires independent errors relative to
  a common truth — different priors are systematic, not random, error. Also: Aumann-style
  result: disagreement cannot be common knowledge. In a market, the disagreement is
  public — everyone knows the order book. So either the disagreement isn''t rational,
  or it''s not common knowledge... Genuine and subtle.

  - (5) vs (2): the "money where your mouth is" defense. If the counterparty''s willingness
  to trade is uninformative (per 2), then the fact that money is at stake doesn''t
  make the price more informative than... Hmm, the tension: costly signaling requires
  that the cost be differential — that informed and uninformed types face different
  costs. Under (2), the trade itself is uninformative about the counterparty''s information,
  so the costliness of the stake doesn''t transfer information. Actually a better
  formulation: (5) says prices beat polls because they''re costly; (2) says the trade
  that sets the price is precisely the thing from which you can''t infer information.
  So the epistemic credential of a price is undermined by (2). This is close to (3)
  vs (2) though. Maybe make (5) about "I trust market prices more than my own judgment"
  or about the "efficient market hypothesis."


  Dissolving tension: (1) vs (2) — apparent, not real. The no-trade theorem concerns
  the absence of gains from trade, not the informativeness of prices. A fully revealing
  equilibrium can be informationally perfect and exhibit no trade at all; prices can
  be maximally informative with zero volume. So (1) doesn''t require volume, and (2)
  doesn''t deny informativeness. The apparent conflict is between "prices carry information"
  and "you can''t learn from a trade" — but the latter is about the counterparty''s
  private info and the former is about the equilibrium price mapping. So it dissolves
  once you distinguish the information content of the price function from the information
  content of an individual''s willingness to transact. Good — that''s a genuine dissolve.


  Another dissolving pair: (4) and the agreement theorem — apparent conflict only
  if you assume common priors; the agreement theorem is conditional on common prior,
  and (4) simply denies that condition. So (4) doesn''t contradict the theorem, it
  specifies a boundary condition. Hmm, but (4) as "rational disagreement" — Aumann''s
  theorem says rational disagreement with common knowledge of posteriors and common
  prior is impossible; so (4) implies common priors is false. Whether that''s a tension
  depends on (1)/(6). I''d rather make the (4)-tension a genuine one via (6): wisdom
  of crowds requires errors to be independent and centered on a common truth; heterogeneous
  priors means systematic, correlated divergence, which breaks the aggregation story.
  That''s a real tension.


  And I should add one more commitment that generates an interesting third tension:
  e.g., (6) "I think the informativeness of prices is fragile: they are informative
  only to the extent that informed traders are compensated for their costly information-gathering."
  That''s the Grossman–Stiglitz paradox: if prices were fully informative, no one
  would pay to be informed, so prices can''t be fully informative; there must be noise
  for informed trading to pay. This creates a tension with (1) (prices as the best
  summary) and with (5): the epistemic quality of prices is sustained by a necessary
  dose of noise — i.e., prices are systematically wrong enough to reward the informed.
  That''s a lovely genuine tension: (1)''s claim that prices are the best available
  summary is limited by the fact that they can only be as informative as the profit
  motive allows, and the profit motive requires residual misinformation. So (1) and
  (6) are in tension: the mechanism that makes prices informative requires that they
  be, in equilibrium, not fully informative — and moreover the traders who are informed
  earn their returns by trading against those who are misinformed, i.e., someone must
  be systematically wrong.


  Nice. So commitments:


  A. Prices aggregate dispersed information better than any centralized alternative;
  a price is a compressed summary of what many people know. (Hayekian)

  B. No-trade: common prior + common knowledge of rationality + no non-informational
  gains from trade → no informational trade; and the fact that someone will trade
  at my price is grounds for suspicion, not confidence. (Groucho point)

  C. Volume and order flow are evidence of the aggregator working.

  D. Rational disagreement is normal and constitutive of markets.

  E. Costly commitment (money at stake) is what makes prices epistemically superior
  to opinion surveys.

  F. Prices are informative only insofar as informed traders are compensated, which
  requires residual noise / not-fully-revealing prices; so some traders must be systematically
  wrong for the mechanism to work.

  G. Maybe: wisdom-of-crowds: aggregation of independent errors improves accuracy.


  Genuine tensions:

