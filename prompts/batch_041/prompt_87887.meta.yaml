  I am a novelist — I have published four novels, all of them written in close third
  person, all of them staked on the proposition that a reader can be brought to know
  another mind from the inside — and I have spent the past two years reading philosophy
  of mind in a semi-disciplined way. I have arrived at a position, and before I write
  an essay about it I want to know whether it is a position at all or merely a pile
  of things I find attractive. I would like you to act as a philosopher of mind with
  a particular interest in illusionist accounts of consciousness and in the metaphysics
  of the self, and to give me an audit rather than a survey. Please think carefully;
  begin by setting out, in your own words, what each item below most naturally commits
  me to — the entailments I may not have noticed — and only then begin judging how
  they sit together. I do not want a reading list or citations; I want the joints
  located.


  Here is where I have landed:


  1. I am an illusionist about phenomenal consciousness. I do not think there is any
  intrinsic felt quality of experience over and above the cognitive and functional
  facts; the redness of red and the ache of an ache are representations that misrepresent
  their own character.


  2. I am a physicalist... nothing extra.


  3. I am not a believer in an inner observer. The self is a model the organism builds,
  not a thing that watches the model; there is no Cartesian subject distinct from
  the self-representation.


  4. What gives a person moral standing is that there is something it is like to be
  them; a being with no felt experience could not be wronged in the way a person can.


  5. I am drawn to the enactivist thought that experience is a matter of skilled,
  embodied engagement with a world, not an inner picture of it.


  6. The value of the novel, as I understand it, is that it lets a reader know what
  it is like to be someone else, and that this is a genuine piece of knowledge and
  not a pleasant fiction.


  Then the ask: which pairs are in tension, how severe, order them; which are only
  apparently in tension; for each genuine tension, what is the cheapest revision and
