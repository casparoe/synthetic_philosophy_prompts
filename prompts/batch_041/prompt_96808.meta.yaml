  Draft:


  "I teach the discussion section for an intro ethics course, and next week we''re
  doing the separateness-of-persons objection to utilitarianism. The lecture is all
  Rawls and the usual line about not taking seriously the distinction between persons,
  and my students nod and then can''t say what the objection actually is. So I want
  to use Shirley Jackson''s ''The Lottery'' as the discussion text — they''ve all
  read it in high school, they know it cold: small town, annual lottery, black box,
  someone draws the marked slip, everyone stones them, and the only justification
  anyone ever offers is Old Man Warner''s old saying about the lottery bringing the
  corn in heavy. What I want from you is a reading of the story through the objection,
  but I don''t want the standard ''conformity and tradition are bad'' essay...


  Then the injected framework: I''ve been telling them there are three different things
  people might mean by the objection and I want the story to help sort them:

  (1) the sum has no owner — adding up utilities across people presupposes a point
  of view nobody occupies, so the arithmetic is a fiction;

  (2) the sacrifice version — utilitarianism licenses treating some as mere means
  to others'' ends, and the wrong is in the using, not the counting;

  (3) the standing/authority version — even if the sum is real and nobody''s used,
  no one has the standing to weigh one person''s life against another''s; the wrong
  is in who gets to do the weighing.


  My hunch, and I want you to push on it: the story is a natural experiment for telling
  these apart, because it strips out the payoff. Nothing in the village gets better
  because Tessie dies; the corn proverb is superstition and the neighboring towns
  that quit are doing fine as far as we can tell. So the aggregation goes on without
  any benefit to point to — and if that''s right, then what does the objection actually
  object to? If the arithmetic-with-no-owner were the real problem (1), the lottery
  should be just as objectionable; but the story seems to me to make the third one
  vivid: the horror is that the village has the standing to decide, that everyone''s
  hand is on a stone and no one thinks they''re doing anything. I''d like you to tell
  me whether that reading holds, or whether I''m just relabeling (1) as (3)...


  Then: does the story vindicate or complicate the objection? Does it show anything
  the philosophical literature doesn''t — e.g., that the aggregating standpoint is
  self-justifying, that it doesn''t need a payoff, which is something a utilitarian
  about rules might deny? Where does the story resist the reading — the villagers
  aren''t calculating, there''s no utility at all, so maybe the story is not about
  utilitarianism but about something else (scapegoating, the sacred), and a reading
  that forces the utilitarian frame distorts both.


  And the request: tell me where you think this reading is most likely to be wrong,
  and what would actually change my mind — what feature of the story, or what counterexample
