  Let''s outline the exam question:


  "You are on the committee for a graduate seminar final. Write one essay question
  on the topic of low-impact AI. The question must ask students to assess the following
  proposal:


  ''An action is low-impact relative to a task specification T if and only if it does
  not change the value of any variable that is not included in T, where T is a complete
  description of the task''s goal state. The agent can therefore avoid side effects
  without any specification of what is valuable in general.''


  The question should require students to:

  1. Distinguish ''side effect'' from ''unintended consequence'' and ''unforeseen
  consequence.''

  2. Explain why the proposal faces a circularity or underdetermination problem: the
  specification T must already include everything that matters, or the agent cannot
  tell which changes count as side effects.

  3. Consider a specific case: an agent tasked with ''making coffee'' in a kitchen.
  It breaks a vase. Is the vase''s breaking a side effect? What if the task is ''make
  coffee without breaking anything''? What if the agent''s designers value the vase
  but did not include it in T?

  4. Assess the ''baseline problem'': low-impact relative to what counterfactual?
  If the baseline is the status quo, any action is high-impact; if the baseline is
  ''what would have happened anyway,'' then almost nothing is high-impact.

  5. Say whether any formal measure of impact (e.g., expected difference in value
  between actual and default trajectories) can avoid needing a value function, and
  if so, how; if not, why not.

  6. Draw a conclusion about the original question: can ''avoid side effects'' be
  defined without a full specification of value?


  The exam question should be answerable in 90 minutes, and the model answer should
  be about 700 words. The marking scheme should total 20 marks and name the specific
  moves a top answer must make and the specific mistakes that cost marks."


