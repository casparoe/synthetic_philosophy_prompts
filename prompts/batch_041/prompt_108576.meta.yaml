  Counterpart theory (Lewis 1968):

  - Possible worlds are concrete universes, spatiotemporally disconnected from ours
  (modal realism).

  - Everything is world-bound: each individual exists in exactly one world.

  - No individual exists in more than one world; there is no transworld identity.

  - Instead, an individual a in world w1 has counterparts in other worlds: individuals
  that resemble a sufficiently closely in the relevant respects.

  - Modal claims about a are analyzed by quantifying over a''s counterparts: "a could
  have been F" is true iff some counterpart of a is F.

  - The counterpart relation is not identity; it''s a similarity relation, context-dependent,
  not transitive, not symmetric, not necessarily one-to-one.

  - This resolves puzzles about identity across worlds (e.g., the problem of transworld
  identity: what makes an individual in another world the same individual? Answer:
  nothing—there''s no such thing).


  Kripke''s Humphrey objection: Suppose we say Humphrey could have won the election.
  Intuitively, this is about Humphrey himself—he could have had the property of winning.
  But on counterpart theory, it''s about a counterpart of Humphrey who wins; it''s
  not about Humphrey. So it seems counterpart theory changes the subject. Lewis''s
  response: it''s still about Humphrey in the sense that the counterpart relation
  is our way of talking about what Humphrey could have been; also, our modal intuitions
  can be accommodated because we use the counterpart relation. Lewis bites some bullets.


  Common misreadings:

  - "Counterpart theory says you could have been someone else / says you''re not essentially
  you."

  - "Counterpart theory denies that things have modal properties."

  - "Counterparts are just possible individuals that are similar to you, so ''I could
  have been a banker'' means ''someone similar to me is a banker''." — misses the
  context-sensitivity and the role of the counterpart relation as a semantic value.

  - Presenting the Humphrey objection as decisive/refutation.

  - Conflating counterpart theory with the view that modal statements are about fictions
  or with ersatzism.

  - Saying Lewis thinks possible worlds are "ways the world could be" (that''s actually
  the linguistic/ersatz conception he opposes).


