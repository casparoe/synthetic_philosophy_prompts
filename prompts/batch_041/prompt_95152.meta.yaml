  the lawyer.

  3. For each, give me a reply I can deliver in about two minutes, in the first person,
  with the concession (if any) built into the first sentence.

  4. After each reply, add a short note on where it is soft: the follow-up I should
  expect and the point at which I should stop arguing and concede rather than keep
  digging.

  5. Tell me what I should concede in my opening two minutes, before anyone asks,
  and why conceding it early helps me.

  6. Name the single objection that has to be answered well for the proposal to survive
  at all.

  7. Finish with the question I am hoping nobody asks, and a brief note on what I
  would say if it comes anyway.


  Do not give me a reading list, citations or references: I have no web access and
  cannot check them, so I would rather have a well-reasoned answer than a title I
  cannot find. Write in British English throughout.


