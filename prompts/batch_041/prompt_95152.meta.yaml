  I lead the engineering team behind a digital advance-care-planning tool, and in
  three weeks I am presenting to the clinical ethics committee of the hospital trust
  we work with. I am a software engineer by training: no medical degree, no law degree,
  no philosophy degree. I want to walk in ready for the questions this particular
  room will ask, not the ones a room full of engineers would ask.


  Act as a philosopher who works in clinical ethics — someone who regularly sits on
  committees like this one, knows the literature on autonomy, personal identity and
  decision-making for people who have lost capacity, and is practised at putting it
  in plain language for non-specialists. Before you draft anything, think carefully
  and start by brainstorming: write a short list of what each member of this committee
  is likely to believe, what they are afraid of, and what they would count as a decisive
  objection. Build the prep sheet from that list. Explain any piece of philosophical
  or legal vocabulary the first time you use it, in a clause, as you would to me.


  My argument, in two parts.


  First, the substantive claim. An advance directive made by someone with capacity
  should normally govern their care after they lose it, even when the person they
  become would now say otherwise. I do not rest this on the idea that the earlier
  person and the later person are literally the same agent; I rest it on the idea
  that the earlier person was entitled to set the terms of a risk they were certain
  to run, and that the later person''s contrary preference only has authority if it
  is a revision of the earlier person''s reasons rather than a loss of the ability
  to grasp them. If it is the latter, I want to say the later preference is not an
  exercise of autonomy at all and should not displace the directive.


  Second, the mechanism my team has built into the product, which is the part of the
  talk the committee will actually be judging. The tool (a) records the directive
  as a versioned document, so any change of mind is visible as a change with a date
  on it; (b) requires the user to nominate an interpreter who is authorised to say
  what the directive means in situations the user did not foresee; (c) sets checkpoints,
  so that a directive lapses unless the user reaffirms it while they still have capacity,
  at intervals they choose; and (d) applies a test I call the revision/erosion test
  before allowing a later preference to override a directive.


  The audience, as precisely as I can describe it:


  - the chair, a palliative care consultant who has watched families fight over exactly
  this and who thinks documents are a way of avoiding the conversation that actually
  matters;

  - a geriatric psychiatrist who has spent thirty years with people in moderate and
  severe dementia and who is, I expect, sceptical that a person who can no longer
  grasp their own earlier reasons is being done any favour by being held to them;

  - a clinical ethicist with a philosophy background who will press the difference
  between the interests a person has in the shape of their life as a whole and the
  interests they have in comfort and company here and now, and who will ask me which
  of the two my tool is really protecting;

  - a solicitor from the trust''s legal team, who will care about who is liable when
  the interpreter and the clinical team disagree, and about whether a lapsed checkpoint
  leaves us exposed;

  - a lay member, a former carer, who I suspect will speak for the person in the bed
  and ask why the person in front of us does not get a vote;

  - and one junior doctor who will ask what happens at three in the morning on a ward
  when nobody can reach the interpreter.


  Assume they are all competent, sceptical and short of time; assume two of them have
  already decided against me.


  What I want from you is a Q&A prep sheet, not a defence of my position:


  1. Order the objections by how much damage they would do to my proposal in this
  room, weighing both how likely each is and how hard it would be to answer. Say in
  one line, for each, why it lands where it does.

  2. Phrase each objection the way the person who would raise it would actually phrase
