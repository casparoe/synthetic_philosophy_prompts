  Paradox of fiction (Radford''s formulation, 1975 "How Can We Be Moved by the Fate
  of Anna Karenina?"): (1) We feel pity/fear for fictional characters. (2) To feel
  pity for someone you must believe they exist (and that they''re in distress). (3)
  We don''t believe fictional characters exist. Contradiction.


  Standard responses:

  - Radford himself: the emotions are real but not "genuine" in the sense of being
  based on belief; they''re "quasi" or... actually Radford suggested our emotions
  are genuine but irrational? Radford held that our responses are not rational (we
  can''t justify them) — he says we are "moved by" and it''s not rational.

  - Thought theory (Lamarque, Carroll): what moves us is the thought, entertained,
  not a belief. Beliefs aren''t necessary for emotion.

  - Illusion/pretence theory (Walton): we don''t really fear; we''re engaged in a
  game of make-believe, and our quasi-emotions are components of the pretence.

  - Alternative: deny (3) — the "fiction as make-believe, we believe in the characters
  in a make-believe way".

  - Also: the "belief requirement" might be too strong: we can be moved by true thoughts
  that don''t involve belief in current existence (e.g., a sad story about someone
  who really existed long ago and is long dead — you can feel real grief for someone
  you know is dead). That''s a nice case: real emotions at true stories where no one
  exists now (e.g., a memoir of a person who died). Hmm — the real-life case is a
  good "carrying" alternative.


  Misconceptions students bring:

  1. "The answer is that we suspend disbelief / forget it''s fake." (This is a solution
  claim, not the puzzle; also it''s false — we don''t forget.)

  2. "The emotions aren''t real, they''re fake emotions." (This is a substantive position,
  and students conflate "not caused by belief" with "not real".)

  3. "It''s about whether fiction is real to us" — i.e., confusing the puzzle with
  a question about psychological immersion.

  4. "Crying at a film is irrational/embarrassing" — conflating the paradox with a
  normative claim about rationality.

  5. Conflating with the paradox of tragedy/horror (why do we enjoy painful/horrifying
  art?) — a distinct puzzle about *enjoyment*, not about the existence-belief.

  6. Thinking the puzzle depends on a naive theory of emotions where all emotions
  have beliefs as components.

  7. Thinking it''s just a verbal dispute about the word "real".

  8. Thinking the solution is "it''s real because the actor exists" or "the emotions
  are about the real world" (e.g., our sadness is really about our own life) — a possible
  move but students over-extend.


  The weedy bit to inject: the asker''s proposed cross-case — crying over a real person
