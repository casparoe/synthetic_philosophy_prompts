  I chair the ethics consultation service at a mid-sized teaching hospital, and I
  need you to act as a philosopher of practical ethics who is also good at building
  protocols — someone who knows the literature on moral dilemmas, moral residue, and
  the difference between a hard choice and an impossible one, and who can turn that
  literature into something a committee can actually run in forty-five minutes. Our
  service gets perhaps twenty consults a month. Most are unremarkable... but a growing
  share arrive with the same framing: the requesting team says there is no right answer
  here, or both options are wrong, or we cannot win. Our job is to write a one-page
  opinion for the chart within about forty-eight hours, usually before a family meeting,
  and the attending then acts on it. The committee is six people: me, a bedside nurse,
  a chaplain, the hospital''s lawyer, a lay member from the community board, and the
  attending who requested the consult. We have no authority to decide anything; we
  can only say what we think and, if we are honest, protect or fail to protect the
  person who has to choose. My problem is that we currently have exactly one move
  when a case gets hard: someone says this is a genuine dilemma, everyone nods, and
  the note ends up saying that either course is defensible. I am fairly sure that
  is sometimes true, sometimes a way of avoiding a call we could have made, and sometimes
  just a factual dispute in disguise.


  I want a procedure the committee can run on every consultation, in order, that sorts
  the case into one of a fixed set of verdicts and tells us what to do with each:
  something like genuine dilemma, hard choice with a better and a worse option, resolvable
  conflict, or misuse of dilemma language to dodge responsibility. For each verdict
  the procedure should say what the committee must produce — whether we owe the decision-maker
  cover, whether we should name a preferred course and why, whether we should send
  the case back for facts or for a policy the institution has never declared, and,
  in the cases we do call dilemmas, what is owed afterwards to the option that was
  not taken (an apology, compensation, a follow-up with the bereaved, a change to
  the policy that produced the trap). Two constraints. First, the procedure must not
  presuppose that genuine dilemmas exist. One of my colleagues argues that a genuine
  dilemma is incoherent, since obligations that cannot be jointly fulfilled would
  make one of them not really an obligation, and he will veto anything that treats
  the existence of dilemmas as an assumption; the chaplain takes the opposite view,
  that the residue people feel after choosing is evidence the dilemma was real. I
  want a procedure both of them can sign, which means it has to be able to certify
