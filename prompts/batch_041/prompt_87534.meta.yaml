  I think he''s saying, and tell me where I''m mangling it: that war isn''t just an
  evil to be minimized, it''s got a kind of ethical job, because a society that never
  has to put itself on the line goes rotten — I think there''s a line about wind keeping
  the sea from stagnating. And that there''s no court above states, so when they disagree
  the only thing left is force. That''s the gist anyway.


  Now the thing I actually want to ask. At work I''ve been reading war-game writeups
  — not the classified kind, the public think-tank ones — and I''ve been messing around
  with a scenario a few of us sketched out over a weekend: two states, a disputed
  chain of islands, and the whole fight is machines. Drone boats, loitering munitions,
  some autonomous stuff doing target selection, a few models doing the scheduling.
  Nobody''s son or daughter is anywhere near it. It runs for four days, one side''s
  fleet is scrap, the other side''s fleet is mostly scrap, and then they sign something.
  Zero human casualties on both sides, no conscription, no rationing, the publics
  watch highlight reels on their phones like it''s a football match, and afterwards
  both economies just carry on like nothing happened. One of my friends says this
  is obviously the future and obviously good — cheap wars, no funerals. Another says
  a war where nobody can die isn''t a war, it''s an expensive boat race, and it''s
  dangerous precisely because it''s cheap. And someone else said something I can''t
  shake: that if you took Hegel seriously, the bloodless version might be the worst
  one, because the whole point of the sacrifice was that people were actually willing
  to give up their lives for the state, and if that''s off the table then the state
  has lost the thing that kept it honest — but that seems backwards, since the whole
  complaint against him is that he glorifies slaughter.


  So: Hegel''s been dead since 1831, drones and MAD and autonomous targeting are all
  well after his time. If he were shown this four-day, no-casualty, machine-versus-machine
  war — and also the standing nuclear standoff where the war everyone plans for is
  one nobody intends to fight — what would his position actually be? Would he say
  it''s war in the full sense, war in name only, or something better than war? Would
  he think it vindicates him (the willingness to sacrifice has been superseded without
  loss) or refutes him? Where do the machine combatants fit — can a state stake its
  existence through things that have no existence to stake? And is there any reading
  where the cheapness makes it worse, not better? I want you to actually commit to
  a reading, not give me a survey of the secondary literature — tell me which way
  he''d come down and why, and flag which parts of that are solid and which are you
  stretching. And please don''t just say we can''t know what a dead man would think;
  I know that, I want your best reconstruction anyway.


