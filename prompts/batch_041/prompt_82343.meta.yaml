  Concretely: The presumption of independence (as I understand the idea, in the context
  of "heuristic arguments" for mathematical conjectures like P≠NP or Goldbach): heuristic
  arguments are probabilistic arguments that treat certain quantities as "as if independent"
  / as random; e.g., the "random model" heuristic in number theory (treat the primes
  as random with density 1/log n), the "smoothness" heuristics in factoring algorithms,
  etc. The presumption of independence is the step where you say "these two conditions
  on a random number are independent, so multiply the probabilities." Sometimes it''s
  wrong (e.g., divisibility by 2 and by 3 are independent, but the "probability that
  n is prime" heuristic fails in structured cases; or in the "random oracle" model
  of crypto where a heuristic assumption fails for real hash functions).


