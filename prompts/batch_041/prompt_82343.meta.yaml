  Actually here''s a cleaner design idea. The classic "epistemic dominance" move:
  the norms of logic/induction are "dominant" because any attempt to criticize them
  must employ them (you can''t argue that modus ponens is invalid without using modus
  ponens; you can''t argue that our standards of evidence are parochial without offering
  evidence). Some philosophers say this is a cheat: it''s like saying you can''t criticize
  the king because criticizing the king is treason. The counter: some norms are genuinely
  non-dominant (e.g., a local convention about units or a preference for a certain
  notation), and some are dominant. So a good thought experiment: build a case where
  a *contingent, parochial* norm is such that dissenters are forced to use it in their
  dissent — showing that dominance doesn''t establish universality/objectivity. And
  another case where a norm appears criticizable but isn''t. Then check whether the
  two cases differ in the right way, or whether the "dominance" criterion can''t tell
  them apart.


