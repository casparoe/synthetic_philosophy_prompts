  Moore''s "Proof of an External World" (1939, British Academy lecture). Structure:
  he holds up one hand and says "Here is one hand," then the other, "and here is another."
  He claims he knows these propositions; hence there are at least two external things;
  hence an external world exists. He then considers Kant''s "scandal of philosophy"
  — that the existence of things outside us must be accepted on faith, not proved.
  Moore says: many philosophers think this scandal, but he thinks he can prove it
  now. Then he asks: did he prove it? He says his proof satisfies three conditions
  for a proof: premises are different from the conclusion; the premises are known;
  the conclusion follows. And he admits he cannot prove his premises — but he says
  he knows them, and also he can''t prove other things he knows (e.g., that he is
  standing up, that he''s not dreaming... actually "I know that I am standing up"
  — he says he knows this, but can''t prove it).


  Also in "Four Forms of Scepticism" he discusses Russell''s and others'' views.


