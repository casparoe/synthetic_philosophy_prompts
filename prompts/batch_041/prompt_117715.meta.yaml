  in space" and his premises entail it). (ii) that Moore proves he''s not dreaming
  or that he refutes the skeptic''s demand. (iii) That Moore''s proof is meant to
  refute skepticism about the senses (Hume''s mitigated skepticism). (iv) That Moore
  thinks the proof shows the skeptic''s premises are false.


