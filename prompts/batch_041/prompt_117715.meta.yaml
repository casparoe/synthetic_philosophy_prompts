  Let''s think about luminosity/KK. Key materials:

  - KK principle: if one knows that p, then one knows (or is in a position to know)
  that one knows that p. Associated with Hintikka, and also the "positive introspection"
  axiom 4 in epistemic logic.

  - Luminosity: Williamson''s thesis: a condition C is luminous iff if C obtains,
  one is in a position to know that C obtains. Williamson''s anti-luminosity argument:
  for any nontrivial condition, luminosity fails, because of margins for error: for
  any case in which C obtains and you believe it does, there is a close case where
  C doesn''t obtain but your evidence is the same, so your belief is unsafe/unreliable,
  hence not knowledge.

  - Common confusions: (a) that anti-luminosity says we can''t know our own mental
  states at all (it doesn''t; it says we can''t know them "luminously," i.e., with
  the guaranteed reliability across close cases); (b) that the argument depends on
  a sorites-like premise about tiny changes (it does rely on there being close cases,
  but the point isn''t vagueness per se); (c) that luminosity = infallibility or that
  it requires the belief be certain; (d) that KK is equivalent to luminosity; (e)
  that the failure of KK implies skepticism about self-knowledge.


