  approach to scalable oversight is basically sound: if two capable models are made
  to argue opposite sides of a question before a human judge who is less expert than
  either of them, and if the judge can ask for evidence, code, derivations, or concrete
  predictions, then the truthful side should have an advantage, because any deceptive
  argument must survive an adversary who is motivated and able to expose it. The upshot
  I want to defend is that this kind of adversarial exchange can extend human oversight
  to questions whose answers no human can directly verify, and that it is a more promising
  path than relying on a model''s own confidence or on a single model''s chain of
  thought.


  Please tell me what would count against that position. I want the defeaters sorted
  by how decisive they would be, not just a list of concerns. In particular: which
  assumptions about the judge, the debaters, or the training objective would have
  to fail, and what would the world look like if each did? Which failures are merely
  awkward and which would be fatal? What does the position predict that rival oversight
  schemes do not, and what evidence from actual model behavior, formal results about
