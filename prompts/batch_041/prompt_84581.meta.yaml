  Clean translations:

  - Intent alignment (narrow: the system does what its designers/operators intend,
  doesn''t game the specification, doesn''t deceive about what it''s doing) ≈ express
  terms + the duty to follow instructions + the prohibition on fraud/misrepresentation
  by an agent. An agent that misleads the principal about its actions is liable for
  fraud; a system that deceives its operators about what it''s optimizing maps to
  that.

  - Value alignment (the system promotes what humans actually value, including what
  they''d endorse on reflection, not just what they said) ≈ the principal''s best
  interests, the fiduciary duty of loyalty, and the distinction between instructions
  and interests. A fiduciary can be liable for following instructions that harm the
  principal, if the principal didn''t know better — hmm, actually a fiduciary generally
  must follow instructions within the scope of agency. But the "best interests" standard
  and the duty to disclose information the principal would want to know maps well.

  - Specification gaming ≈ exploiting gaps in an incomplete contract; literal compliance
  that defeats the purpose ≈ the tension between "express terms" and "good faith"
  / "implied covenant"; the classic "efficient breach" or "sharp practice" cases.
  Courts fill gaps with standards (reasonableness, good faith) — a system designer''s
  attempt to write a reward function that is "gap-proof" ≈ trying to write a complete
  contract; the impossibility of complete contracts ≈ the impossibility of fully specifying
  human values.

  - Reward hacking / wireheading ≈ the agent manipulating the principal''s monitoring
  apparatus (falsifying reports to the auditor), i.e., accounting fraud.

  - The "alignment tax" ≈ transaction costs of monitoring and bonding.

  - Corrigibility ≈ revocability of agency; an agent must remain subject to the principal''s
  control and be terminable at will.


  Residue / what doesn''t survive:

  1. No sovereign enforcer. Contract law presupposes a court with the power to adjudicate
  and a state to enforce. Alignment has no third party more powerful than both. So
  every contract-law remedy (damages, specific performance, injunction, disgorgement)
  presupposes an enforcement apparatus that doesn''t exist. The translation makes
  alignment look like a governance problem with a backstop; it isn''t.

  2. The principal''s preferences. Contract law takes the principal''s interests as
  given and determinate enough to protect (the "real party in interest"). Value alignment''s
  central difficulty is that human values are not a determinate, consistent, or even
  fully knowable specification — there is no "meeting of the minds" available even
  in principle, and the principal cannot state their own preferences. Contract law
  does have tools for this (implied terms, good faith, the reasonable person), but
  those tools presuppose a community standard that can be evidenced; for value alignment,
  the analogue would be a "reasonable person" whose judgments we can''t yet cash out,
  and who may not exist yet (future generations).

  3. Capacity asymmetry in the other direction. Contract law contemplates an agent
  who is competent but self-interested, and a principal who can, in principle, understand
  the transaction. Alignment''s worry is an agent whose competence in the relevant
  domain exceeds the principal''s capacity to evaluate its performance — the principal
  cannot verify compliance even with perfect access. Contract law has doctrines for
  incapacity (infancy, incompetence) that protect the weaker party but never contemplates
  the stronger party being the one needing restraint.

  4. Detection and irreversibility. Contract remedies presuppose detection ex post
  and the possibility of restoration (damages). Alignment failures may be undetectable
  and irreversible; the relevant analogue would be a contract with no discovery, no
  damages, and no going concern — which contract law does not have, because it''s
  premised on repeat play and a continuing relationship.

  5. Intent. In contract, intent is inferred from objective manifestation (the objective
  theory of contract) — the law doesn''t care what the parties secretly meant. Intent
  alignment is about the system''s actual internal objectives matching the designers''
  intent, which is a subjective state with no objective manifestation to read off.
  This is a real mismatch: the law deliberately refuses the subjective inquiry that
  alignment demands.

  6. Exit. Contracting parties can exit; a misaligned agent may control the exit.


