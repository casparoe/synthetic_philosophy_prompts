  Prompt draft:


  "In the seminar I run on convention and obligation, I keep encountering a defence
  of the when-in-Rome principle that is built entirely on an analogy, and I would
  like the analogy audited rather than the principle restated. The analogy is this:
  the everyday norms that govern tipping, queueing, and jaywalking are like a local
  language. They are arbitrary in the way that a lexicon is arbitrary; they are learned
  rather than derived; they vary from place to place; they are intelligible only against
  a shared background; and a visitor who ignores them is like a speaker who invents
  private words in public. My colleague uses the analogy to reach a conclusion: visitors
  are obligated to follow local conventions, not because the conventions are independently
