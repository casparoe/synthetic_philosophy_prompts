  It does not touch question 2 or 3. And the "who decides" question -- who has the
  authority to name the age -- is a question about the sociology of a discipline,
  not about the Earth.


  Then conclusion: so the interesting claim is that the Anthropocene-as-epoch is a
  category error with respect to the agency horizon, because we keep trying to read
  a change in the mode of causation off a change in the sedimentary record. ...


