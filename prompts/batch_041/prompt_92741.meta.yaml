  Title: Three Questions in One Word


  For a decade and a half, a small committee of stratigraphers tried to answer a question
  that the rest of us had been asking loosely: when did the Anthropocene begin? The
  Anthropocene Working Group, a body of the International Commission on Stratigraphy''s
  Subcommission on Quaternary Stratigraphy, proposed in 2023 that the answer be the
  mid-twentieth century, and that the boundary be pinned to a layer of sediment in
  Crawford Lake, Ontario, whose annual varves record the sudden appearance of plutonium
  fallout from atmospheric nuclear tests. The proposal named the interval the Crawfordian,
  and set its base at 1950. In 2024 the subcommission rejected the proposal, and the
  commission and the International Union of Geological Sciences confirmed the rejection.
  Commentators treated this as a defeat for the concept. I want to argue that it was
  not, and that the whole controversy has been conducted under a confusion of three
  separate questions.


  The first question is stratigraphic: at what point does human activity leave a signal
  that is globally correlated and effectively instantaneous in geological time, so
  that a single boundary can be drawn and found in sediments worldwide? This is a
  question about markers, and it has a determinate answer of the kind the working
  group gave. The radionuclide horizon is nearly ideal for the purpose, because it
  is a worldwide, near-synchronous, unambiguous trace.


  The second question is dynamic: at what point did human activity become the dominant
  forcing term in the Earth system -- the point after which the planet''s trajectory
  is better predicted from the human economy than from orbital or solar variation?
  This is a question about the magnitude of a cause, not about the legibility of a
  trace. The two questions can come apart in both directions. A dominant forcing might
  leave a poor marker (if it were gradual, or spatially patchy); a superb marker might
  be left by a trivial forcing (a single distinctive pollutant, say). The mid-century
  radionuclide horizon is a good marker partly because nuclear testing was a punctuated,
  globally distributed event -- not because 1950 is when human forcing became dominant.
  If the forcing question has an answer, it is probably much earlier (the industrial
  revolution, or the Columbian exchange, or the spread of agriculture), and it is
  likely to be a matter of degree rather than a date.


  The third question is political, and it is the one the phrase "the age of humans"
  actually gestures at. When did humans acquire the collective capacity to choose
  their geological trajectory -- to be, not merely a force, but an agent? Call this
  the agency horizon. The agency horizon is not a stratum. It is a change in the kind
  of cause at work, from aggregate unintended consequence to deliberate collective
  self-determination. And it is not obviously locatable in time at all: it is a property
  of a system''s capacity, which may be acquired gradually, may be possessed without
  being exercised, and may be distributed unevenly across the species. ...


  Then: the ICS/IUGS rejection settles question 1 (and only by saying the marker,
