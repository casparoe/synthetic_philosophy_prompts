  joint statement that two people who''ve been arguing about consciousness for years
  could actually both sign, if they sat down and did it in good faith. The two camps:


  1) The epiphenomenalist. Experiences are real. They''re caused by what the brain
  is doing. They don''t cause anything themselves — not the report, not the behavior,
  not other experiences. If you rewound the universe to just before I said "ow" and
  changed nothing but the hurt, I''d still say "ow" at the same instant.


  2) The other side — call them the causalist about experience. Experiences just are
  properties of the same brain/functional states that produce the reports. So saying
  they''re inert is either false or a bit of wordplay. On this view the hurt is part
  of what makes me say "ow."


  Neither of them is a dualist about the machinery. Both accept the physical story
  is complete and that some physical process does the reporting. The whole fight is
  over what work the experience itself does. Also: I don''t want citations or who-said-what.
  No references, no lineage, I care about the claims.


  The thing I actually want them to stare at is this: if experiences don''t cause
  anything, then my judgment that I''m having one, and the sentence I use to report
  it, weren''t caused by it. So in what sense is that judgment or sentence about the
  experience at all? I''m not asking you to settle it from scratch — I want the two
  of them to write down exactly where they come apart on it, in wording each of them
  would put their own name to.


