  - Stipulation they both accept: the brain has a report channel (the machinery that
  turns internal states into utterances, button presses, etc.) and an experience channel
  (whatever it is that makes a state felt). Both agree both channels are fully realized
  in the brain. The question is only what relation they stand in.


  - A case they both have to run: a surgeon has two dials. One changes only the felt
  character of what the subject is experiencing — red becomes green — and leaves the
