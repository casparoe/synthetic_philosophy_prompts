  the role of a professional philosopher of decision theory who has also written for
  consumer-product review outlets, and work carefully: before you draft, spend a few
  sentences brainstorming in the open — the moves available in the literature, the
  objections to each, and which ones your piece will need — then write the piece itself.
  (I want the brainstorm for my own notes; it is not part of the copy.)


  What I need is a deadpan buyer''s guide — the kind of sober, testing-obsessed roundup
  a review site publishes, complete with a headline, a deck, a short "how we chose"
  paragraph, an entry for each product tested, a runner-up, an upgrade pick, a "also
  consider" sidebar, and a closing "the bottom line" — except that the products are
  rival decision procedures, and every procedure is being evaluated as a policy for
  what to do when a stranger makes an astronomically improbable threat or promise
  whose expected value, taken at face value, is enormous.


  The thought experiment this riffs on is usually called Pascal''s mugging: a stranger
