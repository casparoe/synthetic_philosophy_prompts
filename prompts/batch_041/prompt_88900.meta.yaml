  Cicero on old age: verdicts on cases about aging. Hmm, less crisp for case verdicts.\n\
  \nFreud on religion: verdicts on cases about religious phenomena — the \"oceanic\
  \ feeling\", the illusion vs. delusion distinction, religion as infantile helplessness,\
