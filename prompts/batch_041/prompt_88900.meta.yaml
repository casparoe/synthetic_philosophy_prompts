  \ or a \"rock-paper-scissors\" with a copy, or paying for a subway ticket when no\
  \ one watches. Candidate rules: (a) superrationality = choose the action that maximizes\
  \ expected utility conditional on all agents in your \"reference class\" choosing\
  \ likewise; (b) it's about causal ties / correlation between your choice and theirs;\
