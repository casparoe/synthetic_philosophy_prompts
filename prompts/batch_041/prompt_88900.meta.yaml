  \ selling at a markup for profit, lending at interest, currency exchange, insurance,\
  \ futures contracts, renting out property, etc. Then a new case: e.g., a farmers'\
  \ market where a farmer sells vegetables at market price to anonymous strangers,\
  \ or a co-op credit union charging interest, or a rideshare driver, or a \"price\
  \ gouging\" during a disaster.\n\nThe candidate rules: (a) whatever is necessary\
  \ for household provision is natural, profitable exchange beyond need is unnatural\
  \ → the test is whether the exchange is for use vs. for money-making; (b) the test\
  \ is whether the good exchanged is a use-good vs. money itself; (c) the test is\
  \ whether the parties are in a reciprocal relationship of friendship/community vs.\
  \ anonymous market; (d) the test is whether the gain is at another's expense (zero-sum);\
  \ (e) the test is whether the practice destroys the good's telos (usury: money is\
  \ for exchange, not for breeding).\n\nThis is rich. Aristotle is well-known enough.\
  \ But careful: the \"somewhat in the weeds\" instruction says to inject new/niche\
