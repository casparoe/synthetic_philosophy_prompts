  \ decision theory applied to correlated agents; (e) it's about being a \"universal\
  \ law\" chooser (Kantian), applying only when others are symmetric reasoners.\n\n\
  Hmm, that's also good. Superrationality is niche-ish but LLMs know Hofstadter, evidential\
