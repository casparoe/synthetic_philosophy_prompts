  ---


  You are a philosopher specializing in social ontology and the normativity of informal
  social practices — someone who has thought carefully about the difference between
  a regularity, a convention, and a genuine obligation. I am assembling materials
  for a graduate seminar on the ethics of everyday life, and I want your considered
  analysis of a case rather than a survey.


  Please begin with a short brainstorming pass: sketch the main candidate distinctions
  one might draw between (i) a mere behavioral regularity, (ii) a coordination convention,
  and (iii) a moral obligation, and note briefly where you take the boundaries to
  be contested. Then move to the analysis proper. Bracket the secondary literature
  entirely; I do not want citations or reading lists, and I would rather you reason
  from the framework stipulated below than from anything you half-remember.


  The framework, stipulated for the sake of the exercise:


  1. Stake-asymmetry. A convention is stake-asymmetric when the cost to a deviator
  of complying is small relative to the aggregate cost that the deviation imposes
  on those who rely on the convention.

  2. Local indexing. A convention is locally indexed when its point depends on facts
  peculiar to a place — which side of a path one walks on, where a queue forms, how
  much a tip is expected to be — such that the same behavior is correct in one place
  and incorrect in another.

  3. Opacity to newcomers. A convention is opaque to newcomers when compliance requires
  knowledge that a reasonable visitor could not recover from ordinary cues and a modest
  amount of attention.


  Now consider two cases. First, the Riverside Path in the town of Marlow: an unwritten,
  unenforced norm has pedestrians keeping to the left and cyclists passing on the
  right; locals express visible annoyance at violators, and visitors from places with
  the reverse norm repeatedly cause near-collisions. Second, a Marlow restaurant whose
  staff are paid on the assumption that diners tip roughly a fifth of the bill; a
  visitor from a country with no tipping practice leaves nothing.


  Please describe the most important implications of the framework above for the following,
  ordering them by importance and explaining why the ordering falls out as it does:


  (a) whether a visitor is morally obligated to follow a local convention of each
  kind;

  (b) whether locals may reproach, sanction, or exclude a visitor who does not;

  (c) what the answers imply for institutional design — signage, formal rules, service-included
  pricing, or deliberately leaving the norm informal.


  Along the way, flag any point at which the stipulated framework is doing more work
  than it can bear, or where one of the three conditions is really smuggling in a
  substantive moral premise. Be explicit about which conclusions are robust across
  a range of views about convention and which depend on the particular framework.


