  Hey — I''m a TA for a second-year seminar that covers a bit of history of economic
  thought and a bit of philosophy of science, and I''ve got a stack of short essays
  to get through. I''d rather not just slap a number on this one and move on, because
  I think it''s sitting right on the line between a B and a C and I want the comments
  to be the useful part. Can you help?


  Role: act as a careful, slightly pedantic grader for an upper-level course that
  expects students to use Popper and Lakatos accurately. Before you grade, take a
  beat and brainstorm: what are the things a strong answer to this question absolutely
  has to get right, and which specific claims in the answer below are doing real work?
  Then go through the essay claim by claim. I don''t want an overall impression, I
  want the specific sentences that are wrong, wrong-ish, or unearned, and why. Some
  of it is fine — flag that too so my comments aren''t all negative.


  Here''s the question:


  "Question 3 (25 points). Malthus''s Essay on the Principle of Population predicts
  that improvements in living standards are temporary, since population growth will
  eat the gains and incomes will be pushed back toward subsistence. Yet incomes in
  the industrializing countries rose steadily, and fertility eventually fell. Some
  defenders say Malthus was ''right, just early.'' (a) Using Popper''s criterion of
  falsifiability and Lakatos''s distinction between progressive and degenerating research
  programmes, explain what it would take for ''right but early'' to be a legitimate
  reading rather than a refusal to accept refutation. (b) Give one example of a move
  that would be a genuinely ad hoc (degenerating) rescue and explain why it differs
  from a legitimate adjustment of an auxiliary assumption."


  And here''s the essay. (Student name redacted, they''ve okayed using it as an example.)


  "Malthus''s argument rests on two claims about rates. Population, if it is not checked,
  grows geometrically — 1, 2, 4, 8 — while subsistence at best grows arithmetically
  — 1, 2, 3, 4. Because the first outruns the second, any rise in wages is converted
  into more people rather than higher living standards, and per capita income is dragged
  back to the level of bare subsistence. This is what later economic historians call
  the Malthusian trap, and for the long stretch of history before industrialization
  it looks like a good description: average living standards were roughly flat for
  centuries even as population grew. Malthus himself drew a policy conclusion, opposing
  the Poor Laws on the grounds that relief would raise population without raising
  the food supply.


  The industrial case is where it goes wrong. Real wages in nineteenth-century England
  rose instead of falling back, and — more damagingly — fertility eventually declined,
  so population did not track the food supply. The demographic transition is thus
  a straightforward refutation of the prediction that mattered.


  Lakatos''s falsifiability criterion tells us that a theory earns its scientific
  status by forbidding certain outcomes: if no conceivable observation could count
  against it, it says nothing. Popper, on the other hand, taught that theories are
  never tested alone but as parts of a research programme with a hard core and a protective
  belt of auxiliary hypotheses, and he distinguished progressive programmes, which
  anticipate novel facts, from degenerating ones, which only patch themselves up after
  the fact.


  With that in hand, ''right but early'' can be made respectable. The core Malthusian
  mechanism was not refuted — it held for thousands of years and still holds in the
  poorest economies. What failed in England was an auxiliary assumption about the
  fixity of agricultural technology and about how fertility responds to income. Since
  the core survived and only the belt was adjusted, the theory was not falsified;
  strictly speaking it is unfalsifiable, because any counterexample can be absorbed
  by adjusting the belt, which is exactly what a healthy research programme does.
  And because the underlying mechanism is real, the programme is progressive: sooner
  or later, when the food supply stops growing, the prediction will reassert itself.


  For part (b): a legitimate adjustment is one that extends the theory''s reach, e.g.
  adding a claim about the determinants of fertility that yields new predictions about
  which societies will see a transition first. An ad hoc rescue is one that saves
  the theory by adding a clause that predicts nothing new — for instance, ''wherever
  incomes rise without population rising, some hidden check must be at work.'' That
  move cannot fail, and so it cannot tell us anything."


