  Draft:


  "For the past four years I have been writing a novel that braids three stories into
  one continuous account — the fall of Troy, the last campaign of Arthur, and the
  departure of the Israelites from Egypt — narrated by a single voice that believes
  all three happened exactly as the tradition reports, and written so that a reader
  cannot tell which of the three the narrator takes to be documented and which inherited.
  I am now at the stage where the book''s authority is the only thing left to settle,
  and I have been carrying around a thesis a historian friend put to me, which I would
  like you to work out the consequences of.


  The thesis is this. The line between legend and history is not drawn by evidence
  about the events; it is drawn by two accidents of record-keeping. The first is institutional:
  whether some body with a standing interest in the past — a palace, a temple chancery,
  a monastery, a bureaucracy — had a reason to write the thing down, and a reason
  to prefer the version it wrote. The second is material: whether the medium it wrote
  on survived. Fired clay outlives parchment, parchment outlives papyrus, and nothing
  outlives a story that was never written down at all. On this view, what separates
  our three traditions is not what happened but where each sat relative to an archive
  that had both a motive and a durable surface.


  The three cases are, I think, a fair test of it:

  - Troy is a real citadel, excavated, with more than one destruction layer, and its
  excavators have spent a century arguing about which layer, if any, corresponds to
  the story. Hittite tablets name a western vassal city that most scholars now connect
  with the Greek name for Troy, and record its kings, its treaties, and its internal
  troubles — but no text names the war, or anyone in it, and the tablets never describe
  Greeks attacking the city.

  - Arthur is named, as far as we can tell, by no text written within roughly three
  centuries of his supposed lifetime. The earliest surviving narrative that gives
  him twelve battles and treats him as a leader of the Britons is a compilation from
  around 829, and it supplies no dates; the annals that do date him are later still.

  - The exodus is recorded by no Egyptian source at all. The single mention of Israel
  in any Egyptian text is a victory inscription from about 1208 BCE that lists a people
  of that name, in a Canaan campaign, among defeated groups — the hieroglyphs give
  Israel the sign for a people rather than a city — and it says nothing about Egypt,
  slavery, or a departure.


  What I want from you is the most important implications of that thesis for my book
  — not for historiography, but for the concrete decisions a novelist makes. Please
  work through them in roughly this order, and rank them at the end by how much they
  should actually change what I write:


  1. What the thesis implies for the narrator''s authority — whether a voice that
  believes all three stories equally is now a confidence trick, an act of piety, or
  something with a better claim than either.

  2. What it implies for the ethics of the gaps: if the archive is the only difference
  between the three, then my invention is doing the work that a lost archive would
  have done, and I should say what that makes of the novelist — a forger, a witness,
