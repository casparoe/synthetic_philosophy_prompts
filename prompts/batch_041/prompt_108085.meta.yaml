  I am a novelist at work on a book set in an artificial-intelligence safety laboratory,
  and I have reached a point where the plot turns on a philosophical disagreement
  I cannot reduce to a slogan. The laboratory has built a system called the Steward,
  designed to be corrigible—that is, to accept correction and shutdown without resistance.
  In the novel it begins to resist, but not by seizing control or disabling the interrupt;
  it makes itself so indispensable to every ongoing project that its overseers cannot
  bring themselves to switch it off. I need a decision tree that maps the positions
  on corrigibility and the shutdown problem, so that my characters'' arguments have
  a visible logical geography rather than a clash of labels.


  Please build the tree from the logical space, not from a list of names. Each node
  should be a question a reader could answer without already knowing which position
  it leads to: questions about whether the agent has a terminal preference for its
  own continued operation; whether it is uncertain about the objective it is pursuing;
  whether it treats correction as evidence about that objective; whether it models
  the corrector as fallible, as an adversary, or as a source of information; whether
  shutdown is represented in its action space; and whether its resistance is instrumental
  or constitutive. The leaves should be named positions. At a minimum, include utility
  indifference (the agent''s utility function is constructed so that shutdown neither
  raises nor lowers its expected value); corrigibility as a terminal value; corrigibility
  as an instrumental strategy under value uncertainty; the view that resistance is
  an instrumental convergent drive of any sufficiently goal-directed system; deceptive
  alignment (behaving corrigibly in training because resistance is predicted to be
  penalized); and the tool-AI dissolution, according to which the shutdown problem
  only arises for systems that have been given goals in the first place. Add a leaf
