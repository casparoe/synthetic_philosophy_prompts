  Prompt:


  I have been reading LessWrong and the surrounding rationalist blogosphere for years,
  and I keep circling back to the puzzle of moral testimony: when, if ever, can you
  let someone else''s moral judgment stand in for your own? A friend of mine—call
  her M—has been thinking about this longer than I have, and I have a decent track
  record of predicting her verdicts on new cases. Here is what she has said about
  a series of earlier ones.


  - A first-year student who knows almost nothing about factory farming reads a well-supported
  expert consensus that the practice is morally indefensible and believes it on that
  basis. M says: the student can know the moral claim, and relying on testimony is
  fine.

  - A tenured moral philosopher who has all the non-moral facts about a complicated
  tax policy, but cannot decide whether the policy is just, adopts a colleague''s
  considered moral verdict without working through the arguments. M says: not fine.
  The philosopher may end up with the right answer, but not with the kind of moral
  understanding that matters.

  - A person who has never thought about whether gratuitous cruelty is wrong is told
  by a reliable teacher that it is wrong, and accepts it immediately. M says: fine.
  Some moral truths are basic enough that testimony can put you in a position to see
  them for yourself.

  - A person facing a painful personal decision—whether to tell a friend a truth that
  will hurt—follows a trusted advice columnist''s moral recommendation, because the
  person has no experience with this kind of situation. M says: fine.

  - A person raised in a community whose moral code is systematically shaped by its
  members'' economic interests accepts that code''s verdict on a disputed question,
  sincerely and without coercion. M says: not fine, even if the code is internally
  coherent and the person is epistemically reliable by local standards.

  - A person who has been betrayed asks a moral expert whether to forgive the betrayer.
  M says: not fine. The decision has to be the person''s own, even if the expert is
  right.

  - A person with no independent grasp of the ethics of algorithmic hiring reads a
  well-reasoned consensus statement by a panel of moral philosophers and adopts its
  verdict on a novel case. M says: fine, or at least permissible.


  Now the new case. A person who is not a novice—someone who has read a good deal
  of moral philosophy and can follow arguments, though not an expert on this particular
  issue—is trying to decide whether to support a complex new policy. They cannot work
