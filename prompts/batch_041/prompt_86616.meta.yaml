  Hume''s "Of the Standard of Taste" (1757) — key argument: beauty is no quality in
  things themselves, it exists merely in the sentiment of the mind; each mind perceives
  a different beauty; but then he says we do in fact find a standard of taste, exemplified
  by the common verdict that "the same Homer who pleased at Athens and Rome two thousand
  years ago is still admired at Paris and at London." He says the only way to resolve
  the paradox is that some sentiments are more correct than others: the true standard
  is the joint verdict of true judges — those with delicacy of taste, practice, comparison,
  freedom from prejudice, good sense. The paradox: sentiment is subjective, yet some
  judgments of taste are absurd and others correct. He argues that certain qualities
  in the object — regularity, order, etc. — produce pleasure, and the person who has
  delicacy of taste perceives them.


