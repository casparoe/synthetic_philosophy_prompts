  Who uses it, to license what? A friend in a jurisprudence seminar argues: since
  legal positivism is respectable, DCT is respectable too — the Euthyphro dilemma
  is just the "no necessary connection between law and morality" thesis (separability),
  which is fine for law, so it should be fine for morality; the arbitrariness objection
  to DCT is the same as the arbitrariness objection to positivism, which positivists
  answer. So the analogy is used to defuse the Euthyphro dilemma. Then the asker asks:
  how far does it hold? Where does it break? Does the "DCT is fine" conclusion survive?


  That''s a great structure: mapping table (sovereign ↔ God; enacted statute ↔ divine
  command; rule of recognition ↔ God''s nature/character or God''s will; subjects/legal
  officials ↔ moral agents; validity ↔ obligatoriness; sanction ↔ ?; "the gunman writ
  large" ↔ ?; separability thesis ↔ ?; natural law theory ↔ ? maybe "theistic natural
  law / rationalist metaethics"), where it breaks: (a) law''s validity vs morality''s
  obligatoriness — positivism is a thesis about what counts as law, a descriptive/conceptual
  thesis about a social practice, not about what we ought to do; DCT is about the
  ground of obligation and reasons. (b) The positivist''s answer to arbitrariness
  is that law''s authority is not moral authority—law claims authority but its claim
  may fail; DCT needs God''s commands to be genuinely authoritative, so can''t buy
  the separation. (c) God is supposed to be necessarily good / commands necessarily
  aim at the good, whereas a sovereign need not be good at all; so the "unjust law
  is still law" concession has a different price: "a monstrous command is still binding"
  — most DCTers (Adams, Quinn, Murphy) modify DCT precisely to avoid this (Adams:
  God''s commands constitute obligation only given God''s goodness/loving nature;
  modified DCT). (d) Disanalogy on the possibility of amending/escaping the system:
  the sovereign can be disobeyed, revolution, etc. (e) Natural-law analogy would fit
  better: the RoR''s ultimate validation... Actually the disanalogy that matters:
  what makes positivism defensible is that it separates the question "what is law?"
  from "what ought I to do?" — two questions, two systems; the Euthyphro dilemma arises
  precisely because DCT is answering a single question, "what makes something morally
  obligatory?", and can''t bifurcate. So the analogy can''t transfer the "no problem
  here" verdict; it can only transfer a *formal* parallel (source vs merit).


  And there''s an interesting reverse direction: does the Euthyphro dilemma bite legal
  positivism (a "Euthyphro problem for positivism" — whether the rule of recognition
  is validated by its own criteria or by something else)? The friend might say the
  dilemma applies to positivism too, which shows it''s not a dilemma about God but
  about any source-based account of normativity — so the Euthyphro dilemma is a general
  problem for "source" accounts of normativity, not specifically a problem for theism.
  That''s a nice payoff: the analogy *does* hold in one direction (it generalizes
  the dilemma) and not in the other (it doesn''t defuse it).


