  Good''s theorem (Jack Good, 1967, "On the principle of total evidence") — value
  of information is non-negative in expectation: for a Bayesian agent maximizing expected
  utility, free information is always weakly beneficial if the decision is made after
  observing the information. Key caveats: it''s about expected value ex ante, not
  actual value ex post; the agent must be able to condition its action on the data;
  the utility function must not depend on the information itself (i.e., no preference
  for ignorance/curiosity as such, or "the information must not enter the utility
  directly"); it assumes the decision problem is fixed and the agent''s posterior
  is obtained by conditioning; also assumes no cost and that the agent doesn''t change
  the decision problem after seeing the data. Also relevant: the "value of information"
  literature in decision analysis (expected value of perfect information, EVPI, EVSI).
  And the "Good''s theorem" fails when the agent''s actions depend on the data in
  ways that... Actually the standard theorem: if you observe X and then choose an
  action maximizing expected utility given posterior, then E[value] ≥ value of acting
  now. Caveats: (1) the agent must be able to choose optimally ex post (no computational
  bounds); (2) the utility must be over outcomes not over the state of information;
  (3) the observation must not change the problem / the agent''s preferences; (4)
  it''s expected value not realized; (5) there''s the issue of "costly information"
  — free information; (6) sequential / optional stopping issues: if information is
  "free" but you can stop, the value of information can be negative for the sample
  mean (optional stopping paradox — e.g., a gambler with free information can be hurt
  if he uses it? Actually there''s a known result about the "value of information"
  for a sequential decision maker: observing an unrequested statistic can hurt). Also
  "Good''s theorem" is often confused with the "principle of total evidence."


  Interesting niche injections I could do without quoting:

  - The distinction between Good''s theorem and the fact that information can be harmful
  ex post (e.g., you learn a diagnosis that makes you worse off if you can''t act).

  - The "unrequested information" / "optional stopping" case: if the agent''s policy
  is not to condition on the information properly... Actually the classic: if the
  agent is a "non-Bayesian" who uses the data in a fixed way.

  - Good''s own caveat about the utility of the information itself — "the value of
  information" can be negative when the utility function includes the state of information.

  - The "Good''s theorem is about expected value, not expected utility of the act
  chosen" nuance.

  - Kadane''s / Raiffa & Schlaifer''s EVSI.

  - Also: Good''s theorem is a trivial consequence of "value of information = expected
  gain from being able to choose a better act," and the proof: V(X) = E_X[max_a E[U|a,X]]
  - max_a E[U|a]. Since max over a of E[U|a,X] ≥ E[U|a*|X] where a* is the optimal
  act without info, taking expectation gives V ≥ 0.

  - Failure cases: (a) if the decision problem itself changes (e.g., you can only
  use a limited number of tests), (b) if the agent''s preferences over acts depend
  on the information (non-consequentialist / "information aversion"), (c) if the agent
