  Belief set (let me number them):


  (1) The dead can be wronged. Betraying a promise to someone who has since died,
  or destroying the thing they spent their life building, can be a wrong to them,
  not merely to the living who care about them.


  (2) What makes it a wrong to them is that it sets back an interest they had while
  alive and that doesn''t evaporate at death — not that it makes them worse off experientially.
  There''s nothing it''s like to be dead, so the harm can''t be suffering.


  (3) Their posthumous reputation is not such an interest. Once someone is dead, what
  people believe about them can''t set back any interest of theirs; the stake in one''s
  good name is a stake in how one is treated while one is around to be treated.


  (4) Nonetheless, I think a drama that invents a serious moral transgression — say,
  a cruelty or a betrayal — and attributes it to a real, named person, wrongs that
  person. (Genuine tension with (3): the harm of a fabricated transgression is paradigmatically
  reputational. Cheapest fixes: give up (3), or relocate the wrong: not "their reputation
  was damaged" but "they were conscripted into a fiction," "used as a means," or "made
  to figure as a character" — each of which needs a surviving interest, so maybe it
  needs (2) relaxed, or the wrong is really to the living/audience.)


