  than being, at bottom, a wrong to their descendants or to viewers who are misled.


  (6) I don''t think fictional works assert what they depict. A drama that invents
  a scene isn''t lying about it; and its audience, if competent, knows it''s watching
  an invention. So I don''t think the wrong can be located in the audience''s being
  deceived. (This sharpens (5): it closes off the audience-directed reading, which
  makes (4)+(5) harder.)


