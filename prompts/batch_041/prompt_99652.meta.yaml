  Setting: a graduate seminar in history/archival studies, 16 people, 80 minutes.

  Stage 1 (30 min): Groups of 4 play three different record-creating bodies (a colonial
  administrator''s office, a mutual-aid society, a church registry) that must decide,
  under specific pressures (a hostile state, a tax audit, a journalist''s inquiry),
  what to write down and what to leave out. Each group fills in a ledger.

  Stage 2 (20 min): the ledgers are pooled and given to a different set of participants,
  who must write a one-page account of "what community life looked like in 1890" using
  only the ledgers, plus name two things they''re confident about and one thing they
  can''t know.

  Debrief (30 min): map to the silences entering at different moments; the deliberate
  non-recording as tactic; the historians'' misreading; the fact that the ledger format
  itself constrains (the form of the record shapes the fact).

  Predictable failures: participants will over-document (write everything) because
  they think the lesson is "bias"; someone will break character and reveal the omissions;
  the historians will "cheat" by using outside knowledge (they know the era). Handle:
  forbid outside knowledge and instruct the historians to mark inferences.

  What the activity can''t reproduce: real archives don''t announce their silences,
  and you can''t compare against a lost original — participants always get to see
  the withheld material. Also, the real timescale: silences are produced over decades
  by routine practice, not by a single decision. Also, it can''t reproduce the case
  where no one ever had the option to record.


