  bounded in practice because constructing a convincing obfuscation is expensive for
  any agent. But leverage is a ratio, and the cost of locating a defect can be raised
  independently of the cost of producing the argument. If both debaters are optimised
  against the judge, there is no reason to expect the ratio to remain favourable.


