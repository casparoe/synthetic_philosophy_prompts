  **Obfuscation leverage and the limits of debate**


  Debate as a safety technique rests on an asymmetry. Two agents are asked to argue
  opposing answers to a question, and a weaker judge decides which is right. The hope
  is that this converts a hard problem — working out the answer — into an easier one,
  since the judge need only recognise the better argument when it is placed before
  them. This is usually justified by analogy with proof: finding a proof may be hard,
  but checking one is easy, so an agent that knows the truth can expose an agent that
  does not.


  I want to argue that the operative asymmetry is not proof-checking but something
  I shall call obfuscation leverage. Define the leverage of an argument as the ratio
  between the cost of constructing it and the cost of locating its defect. An argument
  has high leverage when it can be produced cheaply and can be dismantled only at
  great expense. Where leverage is high, debate may be worse than a single model answering
  directly, because debate does not merely permit such arguments; it rewards them.
  The dishonest debater need only find one cheap construction that survives inspection,
  while the honest debater must locate the specific defect in whatever has been offered.
  The judge, meanwhile, may mistake the presence of an opponent for genuine scrutiny,
  and so discount the residual doubt that would otherwise attach to an unexamined
  answer.


  It is useful to separate two forms of obfuscation. Local obfuscation buries a defect
  in a single step: a false lemma, a suppressed premise, a leap that the argument
  needs and cannot supply. Local obfuscation is vulnerable to the standard remedy
  of asking for more detail, because the detail must eventually expose the step. Global
  obfuscation is different. Here no individual step is false; the defect lies in a
  definitional or framing choice, so that the conclusion follows from the premises
  only by stipulation, or the question is answered by being re-described. Global obfuscation
  is immune to the request for more detail, because more detail is precisely what
  it produces most cheaply. The honest debater who tries to refute it is drawn into
  a dispute about the meaning of terms in which the dishonest debater has already
  chosen the terms.


  If this is right, then the natural remedy is not better arguments but better commitments.
  I propose what I shall call a commitment ledger: before the exchange begins, each
  debater must state at least one falsifiable commitment — a claim whose negation
  the judge could check in bounded time — on which their answer depends. A debater
  who cannot state such a commitment is not defeated but is recorded as having given
  no answer at all. The effect is to shift the contest from who can persuade to who
  can be pinned down. A globally obfuscated argument, on this rule, cannot win, because
  it can be neither pinned down nor shown to follow.


  Two worries press against this. First, in domains where the truth is a matter of
  degree, an honest debater may be unable to offer a crisp falsifiable commitment,
  and the rule may therefore penalise candour and reward the confident simplification.
  Second, the distribution of obfuscations is adversarial and non-stationary: a judge
  trained on the obfuscations it has seen will be met with obfuscations of a kind
  it has not. The commitment ledger may buy time rather than safety.


