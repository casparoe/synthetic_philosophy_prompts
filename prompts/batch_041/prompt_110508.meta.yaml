  Draft argument:


  (1) A practice of inflicting hard treatment on an offender is retributive just in
  case its justification depends on the claim that the offender deserved it in the
  basic sense — deserved it as a matter of fittingness, not merely as a means to some
  further good.

  (2) Basic desert requires that the offender have been the ultimate source of the
  action: that the action and the character it flowed from be attributable to them
  in a way that is not itself traceable entirely to factors they never chose.

  (3) Nobody satisfies that condition. Whatever you do traces back to a constitution
  and a history you did not select; the regress never terminates in an act of self-creation.

  (4) Therefore no one ever deserves hard treatment in the basic sense, and retributive
  punishment is never justified.

  (5) The remaining justifications for hard treatment — deterrence, incapacitation,
  rehabilitation — do not invoke basic desert, so they survive. This is the standard
  abolitionist position: keep the humane, forward-looking practices; discard the retributive
  rationale.

  (6) But consider how (3) works. If a person''s conduct is not ultimately theirs,
  then neither is the improvement of it. Rehabilitation is something that happens
  to an agent, not something an agent does; we might as well speak of rehabilitating
  a knee. So the forward-looking practices in (5) are not obviously more respectful
  of agency than the retributive ones — they are merely less honest about treating
  the person as an object to be adjusted.

  (7) Worse, the very complaint that punishment is unjust presupposes desert. To say
  that an offender is treated unjustly is to say that something was owed to them and
  withheld. If nothing is ever owed to anyone, then the offender''s suffering is not
  an injustice; it is merely an event we dislike, like a storm.

  (8) So either the argument in (1)-(4) proves too much, dissolving the ground of
  the abolitionist''s own objection, or there is a currency of justification other
  than desert — in which case (1) is false and hard treatment can be unjust without
  being undeserved.


