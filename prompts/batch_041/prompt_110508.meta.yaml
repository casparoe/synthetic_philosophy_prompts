  compatibilist and the free-will sceptic over whether the notion of just deserts
  can survive what we now believe about how people come to be who they are — I''ve
  sat through the podcast recordings, read the exchanges, and spent more time than
  I care to admit trying to work out whether the disagreement is substantive or merely
