  and I''d like you to tell me where it fails, if it does, and what giving up the
  offending step would cost someone who wanted to keep the rest.


  It goes like this. (1) Hard treatment is retributive when, and only when, its justification
  depends on the claim that the offender deserved it in the basic sense — deserved
  it as a matter of fittingness, not as a means to some further good. (2) Basic desert
  requires that the offender have been the ultimate source of the deed, in a sense
  that is not itself entirely traceable to factors they never chose — a self that
  authored itself, or at least a link in the chain that owes nothing to anything upstream.
  (3) No one satisfies that condition; the regress of influences never terminates
  in an act of self-creation, and it is not obvious that we can even say what such
  an act would be. (4) So no one ever deserves hard treatment in the basic sense,
  and retribution is never justified. (5) The forward-looking justifications — deterrence,
  incapacitation, rehabilitation — make no appeal to basic desert, so they survive;
  this is the abolitionist''s consolation prize, and it is the shape of the quarantine
  analogy, in which the dangerous are confined as carriers of an infection are confined,
  without anybody being blamed for their contagion. (6) But attend to how (3) does
  its work. If a person''s conduct is not ultimately theirs, neither, in the same
  sense, is its improvement: rehabilitation becomes something done to an agent rather
  than by one, and we might as well speak of rehabilitating a knee. On the argument''s
  own showing, the forward-looking practices in (5) are no more respectful of agency
  than the retributive ones; they are simply less candid about treating the person
  as an object to be adjusted. (7) And the objection itself is in trouble. To complain
  that an offender is treated unjustly is to say that something was owed to them and
  withheld. If nothing is ever owed to anyone — if desert is the only currency in
  which obligations can be denominated — then the offender''s suffering is not an
