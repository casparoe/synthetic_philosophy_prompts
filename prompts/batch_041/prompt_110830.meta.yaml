  and that her credence in a proposition is then an interval rather than a point.
  Two things have always bothered me. First, the literature treats ''imprecision''
  as a single phenomenon, but it seems to me there are at least three distinct sources:
  conflict, where the evidence positively supports two incompatible sharp hypotheses
  (as in a genuinely symmetric-looking coin that I nonetheless suspect is biased);
  sparsity, where the evidence simply leaves a parameter underdetermined (a sample
  too small to fix a rate); and indeterminacy, where the proposition itself is vague
  or the partition is not well defined (how many grains make a heap, or ''the probability
  that the artwork is the same artwork''). Second, and this is the part I actually
  care about, the standard decision rules — maximin, E-admissibility, maximality,
  interval dominance — were designed without that distinction in view, and I suspect
  they are not equally well motivated across the three cases: something like E-admissibility
  looks defensible when the imprecision is conflict, but may be exactly the wrong
  rule when the imprecision is sparsity, and may be literally undefined when it is
  indeterminacy. I would like the proposal to (i) state the question so that it has
  a determinate answer, (ii) explain why the existing positions leave it open, (iii)
  set out a method — what I would actually do, in what order, and how I would tell
  whether the distinction is doing real work rather than decorating a familiar point,
  (iv) say what a result would look like and what would count as the project failing,
