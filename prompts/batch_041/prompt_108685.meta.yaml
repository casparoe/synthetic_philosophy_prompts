  proposals, insisting that any chronological spine, however global its contents,
  imports a European periodization at the joints — that medieval and early modern
  do not travel cleanly outside Europe, that civilization as a unit of narration reifies
  societies that were always porous and internally divided, and that the real units
  are processes (a religion''s spread, a commodity chain, a fiscal apparatus, a disease
  regime) that begin and end on no schedule and so cannot be dropped into a slice
  or a chapter without distortion.


