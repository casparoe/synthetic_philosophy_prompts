  I serve on the editorial board of a university press that is commissioning a two-volume
  world history survey for undergraduates, and in three weeks we have to settle a
  question we have deferred twice: what the architecture of the volumes should be.
  The series editor wants the past told from everywhere at once — eight synchronic
  slices, each taking the whole inhabited world at a single date, on the argument
  that only a simultaneous cross-section lets every society appear as the contemporary
  of every other, rather than as a latecomer on somebody else''s timeline. Our chair
  thinks this is unteachable: students need causal narrative, exam questions have
