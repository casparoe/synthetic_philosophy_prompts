  Hayek''s later point about the division and tacitness of knowledge, and the way
  prices serve as a discovery procedure; Lange''s counter-model of a Central Planning
  Board that adjusts prices by trial and error and the equilibrium it claims to reach;
  and the incentive or principal-agent objections that are often folded into the debate
  but are not the same argument. Be explicit about which of these is computational,
  which epistemic, and which motivational, and say which one Cybersyn was in a position
  to answer. ..."


