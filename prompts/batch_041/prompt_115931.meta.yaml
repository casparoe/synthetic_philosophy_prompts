  ---


  I''ve spent some time trying to reverse-engineer the working theory of work and
  leisure that our labor-market institutions actually run on, and the more closely
  I look, the less the pieces fit together. Four practices seem to pull in different
  directions.


  American overtime law requires time and a half for hours past forty for hourly workers,
  but exempts salaried professional, administrative, and managerial employees from
  the premium altogether — as though the same hour of effort were a burden in one
  case and not in the other. On-call time is usually unpaid as long as you can use
  the time for yourself and are paid only when you are actually called in, which suggests
  that the thing being compensated is the expenditure of effort rather than the surrender
  of control over your own hours. France''s 35-hour week was justified in part as
  work-sharing — a way to spread a scarce good around — which only makes sense if
  paid work is something people have a claim to, not something they need to be bribed
  into. And Japan compensates death from overwork (karoshi) as a work injury, which
  treats a long enough stretch of overtime as a genuine harm, potentially a fatal
  one. Meanwhile unemployment insurance conditions benefits on active search and,
  in many systems, on accepting offers that become less attractive the longer you''ve
  been out of work; retirement pensions, by contrast, are paid on the basis of age
  and contribution history, with no requirement that you demonstrate incapacity or
  continue looking for work. Disability benefits sit in between, conditioned on proving
  you cannot work rather than that you cannot find work.


  What view of work and leisure does this pattern presuppose? Is there a single implicit
  theory — say, work as a duty of reciprocity, leisure as something earned over a
  lifetime of contribution, and a distinction between voluntary and involuntary idleness
  — that reconciles all four practices? Or does the pattern require at least two incompatible
  theories, one treating work as a disutility that must be compensated and another
  treating it as a good that justice requires distributing? Which rival views does
  the pattern quietly rule out — that leisure is an unconditional right, that work
  is nothing but a cost, that desert tracks effort rather than contribution? Distinguish
  what the practices strictly presuppose from what they merely fit comfortably with,
  say where the pattern is philosophically underdetermined, and tell me what would
  have to change in these institutions if we replaced the presupposed view with a
  single consistent alternative. Answer in American English.


