  "I have spent the last year in a reading group on the collapse of past societies,
  and I have ended up defending a view I am no longer sure I hold for the right reasons:
  that collapse is not a phenomenon in the world but an artifact of how we choose
  to look. The choice has three parts, as I see it. We identify a society with its
  most legible apparatus — the palace, the tribute rolls, the temple, the state —
  so that when the apparatus fails we say the society failed, even when the people
  who paid for it are still in their fields, burying their dead as their grandparents
  did, and in many cases living better. We pick a scale of analysis at which decline
  looks like termination: the ninth- and tenth-century emptying of the southern Maya
  lowlands reads very differently once the northern lowlands and the highlands are
  in the frame. And our evidence is written by those who lost the most, the literate
  elite whose world really did end and who are uniquely well placed to persuade us
  that their ending was the world''s. Historians of Rome already made a version of
  this move once, trading ''fall'' for ''transformation,'' and the eastern Mediterranean
  around 1200 BCE and Rapa Nui both look at least as hospitable to the revisionist
  reading as to the catastrophic one. My interest is not purely antiquarian: I grew
  up in a town that lost its mill and half its population in about a decade, and I
  have noticed that when I call what happened there a collapse I am usually describing
  my own departure, while the people who stayed describe it as a change in how things
  are done.


  I would like the case against this view, and I would like it sorted by how much
  it should move me. Concretely: what would a real collapse look like, such that the
  revisionist redescription would be strained rather than merely available? Are there
  findings — in the archaeology of any of these cases, or in demography, or in the
  study of how knowledge and subsistence practices are lost rather than relocated
  — that would be decisive, and which of them have arguably already turned up? Does
  the position predict anything its rival does not, and if so, has any of those predictions
  failed? I also want to know which of these considerations a defender of the view
  would themselves concede, as opposed to waving away, and whether there is a difference
  between conceding that something bad happened and conceding that a society ended
  — I suspect a lot of the disagreement lives there.


  Finally, be honest about whether the position has been qualified into unfalsifiability.
  If any outcome can be redescribed as reorganization given enough time and a large
  enough redrawing of boundaries, is that fatal here, or is the rival view exposed
  in the same way (after all, if the boundaries of a society are ours to draw, they
  are the collapse-realist''s to draw too)? What I would personally find most decisive
  is a case in which the revisionist reading requires me to say something plainly
  false about the people involved — where calling it a reorganization commits me to
  denying a loss that they themselves would have recognized as one. And tell me whether
  that last worry is an objection to the view or merely a complaint about how the
  view sounds."


