  Easy knowledge problem: Cohen (2002) "Basic Knowledge and the Problem of Easy Knowledge."
  The "bootstrapping" problem is often attributed to Vogel (2000) "Reliabilism Leveled"
  and also discussed by Cohen. The example: Roxanne. She looks at a table and forms
  the belief that it''s red. Then she says: "The table is red" and "It appears red
  to me." She reasons: (premise 1) the table is red; (premise 2) if the table is red,
  then it appears red to me (or: it appears red); therefore it appears red and the
  table is red — which is a case of my color vision being accurate. Repeat with many
  objects, and she can conclude her color vision is reliable. The problem: this seems
  to give her justification for believing her color vision is reliable without independent
  evidence, using the very faculty in question. This is the "bootstrapping" or "easy
  knowledge" problem. It''s a problem for reliabilism and for any view that grants
  "basic" perceptual knowledge without prior justification for the reliability of
  perception.


