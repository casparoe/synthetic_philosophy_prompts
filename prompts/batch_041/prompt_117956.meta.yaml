  Sen''s paradox: There''s no social decision function satisfying (U) unrestricted
  domain, (P) weak Pareto, and (L) minimal liberalism. Common misreadings:

  1. "It shows liberalism and efficiency are incompatible." False — the Pareto condition
  is weak, and the conflict arises only for certain preference profiles (nosy/meddlesome
  preferences). Moreover, the conflict is a feature of the formalization of rights.

  2. "It shows rights must be overridden for the greater good." False — Sen''s point
  is the opposite: the theorem exposes a problem with welfarist aggregation.

  3. "It''s just Arrow''s theorem." False — different conditions.

  4. "It shows that there''s no way to respect individual rights in collective decisions."
  False — you can drop unrestricted domain (restrict to liberal preferences), or reformulate
  rights.


