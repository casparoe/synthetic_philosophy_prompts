  - The friend''s provocation: Wittgenstein said (roughly) that if a religious person
  were to base his belief on historical evidence, it would be a kind of madness —
  the belief would collapse. So a believer who needs evidence has already lost the
  belief. The film''s Tomas is exactly such a person: he wants God to answer, i.e.,
