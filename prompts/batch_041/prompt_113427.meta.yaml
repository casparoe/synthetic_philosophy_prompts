  of his own faith. That''s a nice, arguable reading.


  - Also: the asker''s friend claims Wittgenstein''s later philosophy makes religious
  belief a "language game" that''s autonomous, so that criticism of religious belief
  from outside is impossible — and the film dramatizes what happens when a religious
  community''s language game loses its grip on reality: the pastor has the words but
  the practice has died, which shows that language games are not autonomous but depend
  on a form of life that can decay. That is a genuinely interesting philosophical
  point (Wittgenstein himself says "the speaking of language is part of an activity,
  or of a form of life" and that "what has to be accepted, the given, is—so one could
  say—forms of life"). The idea that a language game can die, that the words remain
  but the practice goes, is a real theme in Wittgenstein and in later Wittgensteinian
  philosophy of religion (e.g., the "Wittgensteinian fideism" charge). That''s a good
  "in the weeds" concept: Wittgensteinian fideism and the objection that it makes
  religion immune to criticism; the film tests it.


