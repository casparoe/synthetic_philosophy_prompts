  Wittgenstein''s views on religious belief: from "Lectures and Conversations on Aesthetics,
  Psychology and Religious Belief" (compiled by Cyril Barrett), and "Culture and Value"
  remarks; famous remarks about religious belief not being a matter of evidence, the
  believer''s use of "God," the picture of the Last Judgment as regulating one''s
  life, "Christianity is not a doctrine... it is a description of a life," the difference
  between the believer and the atheist both using "God" but meaning different things,
  and the point that reasons/evidence in religious contexts work differently — "a
  religious belief could only be something like a passionate commitment to a system
  of reference" (Culture and Value, paraphrase). Also the remark that it would be
  a kind of madness for a religious person to base their life on historical evidence
  (Lectures, "the historical proof is irrelevant"). Also the famous exchange about
  the "strange" use of language, and the idea that religious belief is more like a
  way of living than an hypothesis. Also the "picture" of the Last Judgment, the remark
  about how the believer''s belief "shows" itself in how they live, "if you ask a
  religious person ''why do you believe?'' the answer is not evidence."


  Which fiction to pair? Bergman''s "Winter Light" (1963) — Pastor Tomas Ericsson,
