  treat the two cases as mutually reinforcing — if Darwin showed that design needs
  no designer, Turing showed that intelligence needs no mind, and the analogy is supposed
  to carry conviction by symmetry. I suspect the symmetry is rhetorical: it works
  as long as we do not ask what "comprehension" is doing in each case. The proposal
  should argue that the literature tends to oscillate between (a) treating comprehension
  as a genuinely explanatory posit that the inversions successfully eliminate, and
  (b) treating it as a piece of folk psychology with no explanatory role, and that
  neither reading can be applied uniformly to both cases. I want this argued by reference
