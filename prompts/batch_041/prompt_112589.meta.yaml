  I am putting together a short research proposal — about 1,500 words, for a departmental
  workshop series on explanation in the cognitive and biological sciences — and I
  would like you to draft it from the following half-formed idea.


  The starting point is the schema, usually credited to Dennett''s reading of Darwin
  and of Turing, that treats two famous moves as instances of one thing. In the first,
  the competence of an organism — its apparent design — is explained without appeal
  to a designer who understood what he was doing; the understanding is drained out
  of the cause and reappears only as an effect. In the second, the competence of a
  computing machine — its apparently intelligent output — is explained without appeal
  to a mind that understood the task; again the understanding is drained out of the
  cause. Both are said to be inversions because they reverse the order of explanation
  we instinctively want: we expect comprehension to be the source of competence, and
  here competence comes first and comprehension, if it appears at all, is a late and
  optional by-product.


  My unease — and I think the interesting question — is that the two inversions may
  not be the same inversion, and that the phrase competence without comprehension
  may be quietly doing two different jobs in the two cases. In Darwin''s case the
  competence is real and owned by something: the organism is genuinely good at surviving,
  and the explanation tells us where that goodness comes from. In Turing''s case it
  is far less clear that the competence is owned by anything at all: the machine''s
  "being good at" arithmetic or chess or translation may be a fact about us and our
  descriptions rather than a fact about the machine. If so, the second inversion does
  not relocate comprehension, it dissolves the question of where it lives — and that
  is a different and much stronger claim.


