  would like it to pose the question: do the Darwinian and the Turingian inversions
  belong to a single explanatory kind, or do they differ in whether the competence
  they explain is a property of the system or an artifact of the description under
  which we view it — and is there a criterion that lets us tell which kind of inversion
  we are dealing with in a new case?


