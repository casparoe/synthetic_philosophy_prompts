  I am a third-year philosophy student in a seminar on well-being and the good life,
  and I am trying to write a position paper on hedonism. I have been persuaded by
  the heterogeneity problem, but I am not sure how much of my view it actually threatens.
  I would like you to act as an expert on theories of well-being and the metaphysics
  of pleasure, and to give me a careful consistency audit rather than a survey. Please
  begin with a short brainstorming section in which you map the main candidate accounts
  of what unifies pleasures—common phenomenal quality, common attitude, common functional
  role, common intentional structure, family resemblance—and note which of my commitments
  seem to presuppose which account. Then audit the set below.


  My commitments, roughly in order of confidence:


  1. Hedonism about well-being: a person''s life goes better exactly to the extent
  that it contains a greater net balance of pleasure over pain. Nothing else contributes
  to well-being. I understand the amount of pleasure in an experience as fixed by
  its intensity and duration.


  2. Heterogeneity thesis: there is no single phenomenal quality common to all pleasures.
  The pleasure of a warm bath, the pleasure of finally understanding a proof, the
  pleasure of relief, and the pleasure of schadenfreude do not share a distinctive
  felt quality. They are a family-resemblance class.


  3. Valence realism: every pleasure nevertheless has a determinate degree of positive
  valence, and these degrees are comparable across kinds and across persons. Without
  this, the net balance in (1) would be empty.


  4. Experiential fixity: whether an experience is a pleasure, and how much, is fixed
  by its phenomenal character alone, not by the subject''s desires, beliefs, or cultural
  framing.


  5. Functional unification: what unifies pleasures is a functional role. Pleasures
  are experiences the subject is disposed to continue or repeat; pains are experiences
  she is disposed to stop or avoid. I think this is the best answer to the heterogeneity
  problem.


  6. Reach: pleasures vary not only in intensity and duration but also in reach—the
  extent to which a pleasure organizes and colors the rest of one''s mental life.
  I think reach is a genuine value-relevant feature of pleasure, not an extrinsic
  bonus.


  7. Two-lives verdict: consider Life A, which is long and filled with many mild sensory
  pleasures and little frustration, and Life B, which is shorter and filled with a
  few intense intellectual and artistic pleasures of high reach, but also some frustration.
  I think Life B can be better for the person even if Life A contains a greater total
  of intensity-times-duration pleasure.


  8. Sadist verdict: a sadist''s pleasure at another''s suffering makes the sadist''s
  life go better, other things equal. I also think sadistic pleasure is morally horrific
  and should be prevented. I take these claims to be compatible because well-being
  is not the only moral value.


  I do not know which of these can survive together. Some of them may be in genuine
  tension, some may only look that way, and I would rather not be told that everything
  is fine. Please do the following:


  - Identify which pairs or subsets are genuinely in tension and which are merely
  apparent. For the apparent ones, explain what distinction dissolves the appearance.

  - Rank the genuine tensions by severity, and say what makes each one severe rather
  than merely awkward.

  - For each genuine tension, say what would have to give. Which commitment, or which
  part of a commitment, is the cheapest to revise, and what would that revision cost?
  I am not asking which revision is most convenient for me; I am asking which one
  a careful hedonist could actually make.

  - Finally, identify the single revision that would resolve the most tension at the
  least cost, and tell me whether the resulting position is still recognizably a hedonist
  position or has quietly become a different theory of well-being.


  Please be specific and argumentative. I am not asking for a bibliography or for
  citations to the literature; I want the internal audit. If you think one of my formulations
  is ambiguous in a way that matters, say so and tell me which disambiguation you
  are using.


