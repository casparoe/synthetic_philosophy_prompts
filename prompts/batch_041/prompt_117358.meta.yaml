  Let''s design a polished prompt with a list of commitments and an ask.


  Potential commitments:


  1. Hedonism about well-being: a person''s life goes better exactly to the extent
  that it contains a greater net balance of pleasure over pain; no other feature of
  a life contributes to how well it goes for the person.

  2. Heterogeneity thesis: there is no single phenomenal quality common to all pleasures.
  The pleasure of a warm bath, of finally understanding a proof, of hearing that a
  friend is safe, and of schadenfreude do not share a distinctive felt quality; they
  are a family-resemblance class.

  3. Valence realism: even so, every pleasure has a determinate degree of positive
  valence, and these degrees are comparable across kinds and across persons. Without
  this, talk of a "net balance" in (1) would be empty.

  4. Experiential fixity: whether an experience is a pleasure, and how much, is fixed
  by its phenomenal character alone, not by the subject''s desires, beliefs, or cultural
  framing. (This is a version of internalism.)

  5. Functional unification: what unifies pleasures is a functional role: pleasures
  are experiences the subject is disposed to continue or repeat; pains are experiences
  she is disposed to stop or avoid. I think this is the best answer to the heterogeneity
  problem.

  6. Hedonic signature: I think pleasures vary along at least four dimensions: intensity,
  duration, felt quality, and what I call "reach"—the extent to which the pleasure
  organizes and colors the rest of one''s mental life. Reach is a genuine value-relevant
  dimension, not a mere extrinsic feature.

  7. The two-lives verdict: consider Life A, long and filled with many mild sensory
  pleasures, and Life B, shorter and filled with a few intense intellectual/artistic
  pleasures of high reach, but also some frustration. I think Life B can be better
  for the person even if Life A contains a greater total of intensity-times-duration
  pleasure. I do not think this is a mistake; it tracks something real about the heterogeneity
  of pleasure.

  8. The sadist verdict: a sadist''s pleasure at another''s suffering makes the sadist''s
  life go better, other things equal. I also think sadistic pleasure is morally horrific
  and should be prevented. (Apparent tension with hedonism? Actually hedonism says
  it''s good for the sadist. The moral horror is separate. So no tension if hedonism
  is about well-being and morality is separate. But if the student holds "well-being
  is the only thing that matters for morality," then tension. We can add a commitment:
  "I think well-being is the only thing that ultimately matters morally." Then sadist
  verdict creates a genuine tension: if sadistic pleasure increases well-being, and
  well-being is the only moral value, then it should be promoted, which conflicts
  with moral horror. That''s a genuine tension. But maybe too obvious. We can include
  "I think well-being is not the only thing that matters morally" to dissolve. Better
  to have apparent tension that dissolves. So include "I think moral wrongness can
  outrun what is bad for the agent." That makes it apparent.)

  9. No natural kind: I think "pleasure" is not a natural kind; it is a cluster concept
  with no necessary and sufficient conditions. Yet I think (1) is a substantive, non-vacuous
  theory of well-being.

  10. Anti-additivity: I think the value of a pleasure is not simply additive; the
  way pleasures combine matters. Two pleasures can be worth more together than the
  sum of their separate values, or less, depending on their fit. (This conflicts with
  hedonism''s standard sum. Genuine tension. Could be the main one.)

  11. Incommensurability: I think some pleasures are incommensurable: there is no
  fact of the matter about whether a life with more of one kind is better than a life
  with more of another. (Direct conflict with (3) valence realism and (1). Genuine
  tension. Maybe too obvious if both stated. Could be the apparent tension that dissolves?
  Actually if (3) says comparable, (11) says not, direct contradiction. That''s not
  apparent; it''s real. Could be one of the genuine tensions. But we want one or two
  genuine, not five. We need to manage.)


