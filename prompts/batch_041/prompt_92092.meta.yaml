  Set-up: I''m in a graduate seminar on the history of ethics; last week we read Moore.
  Two classmates, Dana and Rafael (names), got into an argument that continued into
  the corridor.


  Move 1 (Dana): Moore lists friendship/personal affection and the appreciation of
  beauty as the two greatest goods, but when you press him, all the value seems to
  live in the individual states of mind — the pleasure of the affection, the enjoyment
  of the beauty. If so, his view is just hedonism with a nicer vocabulary: friendship
  is valuable only as a vehicle for valuable experiences, which is instrumentalism
  about friendship, exactly what he denies.


  Move 2 (Rafael): No — Moore''s doctrine of organic unities blocks this. The value
  of the whole (the friendship, or the appreciation-of-a-real-beautiful-object) is
  not the sum of the values of its parts; wholes have value that their parts lack.
  So the friendship isn''t a mere means to the good experiences inside it; the whole
  is what''s valuable. Also, on Moore''s view, love directed at a genuinely good person
  is worth more than the same feeling directed at a worthless or imaginary object,
  so the object''s reality matters — that''s not something hedonism can say.


  Move 3 (Dana): That''s just relabeling. Saying the whole has value that the parts
  lack tells me nothing unless you can say what makes it so; if the extra value doesn''t
  come from any part, then it''s magic — a value that appears from nowhere when you
  put two things side by side. And "the whole is valuable" is compatible with the
  friendship being valuable only because of the experiences it contains, just at the
  level of the whole rather than the parts. And if the value depends on the object''s
  being real and good, then it depends on facts outside the friendship, which makes
  the friendship conditionally valuable — a value it borrows from its object — which
  is again not the "intrinsic" goodness he promised.


  Move 4 (Rafael): The organic-unity move isn''t ad hoc: Moore needs it elsewhere
  too, and we should accept it there. Retributive punishment — the combination of
  a wrongdoer''s guilt and his suffering seems worse than either alone, worse even
  than the sum; a beautiful picture''s value isn''t the sum of the values of its patches.
  Also, "intrinsic" for Moore means "valuable in virtue of its intrinsic nature,"
  not "valuable regardless of everything else," and the friendship''s nature includes
  its object''s being the sort of person she is; so dependence on the object is not
  dependence on something external.


  Move 5 (Dana): The retribution case shows the problem, not the solution: the reason
  guilt + suffering is worse than either alone is that they''re related — the suffering
  is deserved/fitting — and once you say the value of the combination depends on the
  relation rather than on the intrinsic natures of the parts, you''ve given up intrinsic
  value. Two people who never meet have no friendship; so the value depends on relations,
  on history, on the other person''s continued existence and character. That''s fine,
  but it''s a different theory of value than Moore''s, and it may be better — so Moore''s
  defenders should stop pretending the organic unity doctrine saves his framework.


  Move 6 (Rafael): Then the "instrumentalism" charge fails too: if the value of a
  friendship depends on relations and history, it can''t be reduced to the value of
  the experiences it produces, since the same experiences could occur without the
  relation. And Dana''s position ends up saying that friendship is valuable for something
  else — the relation — which is fine but is not what she accused Moore of.


