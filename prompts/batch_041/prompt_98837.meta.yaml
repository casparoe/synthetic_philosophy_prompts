  Question:

  "1. Explain the role that common knowledge of rationality plays in the backward-induction
  argument, using the finitely repeated Prisoner''s Dilemma and the centipede game
  as your examples. (2) The conclusion of backward induction in these games strikes
  most people as absurd. Does that show that (a) common knowledge of rationality is
  an implausible assumption, (b) the backward-induction argument is invalid, or (c)
  something else? Defend your answer. (3) Finally: if each player attaches a small
  but positive probability to the other playing irrationally, does cooperation become
  sustainable? Explain."


  Student answer (revised, ~350 words):


  "Backward induction starts at the last decision node: the player moving there is
  rational, so she takes the action that maximizes her payoff given what''s left of
  the game. Knowing this, the player at the previous node compares her payoff from
  stopping now against her payoff from continuing, given that the next player will
  then stop; she stops if stopping is better. Iterating back to the root gives the
  backward-induction outcome.


  For this to work we need each player to be rational, to know the other is rational,
  to know that the other knows that she is rational, and so on. That infinite hierarchy
  is common knowledge of rationality. In the centipede game, if it''s common knowledge
  that both are rational, the last player stops, so the second-to-last stops, ...
  and the first player stops immediately, destroying the gains from cooperation. The
  finitely repeated PD unravels the same way: in the last round both defect, so in
  the round before that both defect, and so on to the first round.


  I''d answer (c). The backward-induction argument is valid, and common knowledge
  of rationality is actually a pretty weak assumption — it just says everyone is rational
  and that this is common ground, which is true of almost any interaction between
  sane adults. The real problem is empirical: people don''t reason by backward induction.
  Experimental subjects cooperate in one-shot and finitely repeated PDs and pass early
  in centipede games, so what''s wrong is the descriptive assumption that people maximize
  in the game-theoretic sense, not the logic.


  On the small-probability-of-irrationality question: no, it doesn''t help. Once there''s
  any chance the other player is irrational, the induction has no secure base, and
  the whole thing unravels all the way back to the first node. So adding doubt makes
  cooperation less sustainable, not more.


  The one thing I''d flag is that if you weaken common knowledge to mere mutual knowledge
  — each knows the other is rational, but not that the other knows it — backward induction
  can break down, which is why the case feels like it''s about knowledge rather than
  about payoffs."


