  Draft prompt (formal, elaborate, 1–3 paragraphs):


  "I''m in a reading group that''s working through the disjunctivist response to the
  argument from illusion, and we keep getting stuck on the same point: it''s easy
  to say that a veridical perception and a hallucination are different kinds of mental
  state rather than two versions of one inner state, and very hard to say what the
  hallucination is, positively, if it isn''t the having of some appearance that the
  perceiver also has. The most anyone seems licensed to say is that the hallucination
  is subjectively indiscriminable from a perception of that kind, and that this is
  a statement about what the subject can know from the inside, not about what the
  two states share. I want a poem that makes that hard to dismiss. Write one of about
  24–30 lines, in two halves of equal length, where the two halves describe the same
  scene with the same words — the same room, the same window, the same person at the
  door — but the first half is a perceiving and the second is a hallucinating, and
  the poem must never supply anything that the two share as an inner core. It should
  be impossible for the reader to tell from the inside of either half which is which...
  "


