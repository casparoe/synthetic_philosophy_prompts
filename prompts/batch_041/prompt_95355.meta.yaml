  Exam question:

  "Consider a circular target of radius 1. A chord is generated as follows. First,
  a direction is chosen by spinning a pointer uniformly over [0, 2π). Second, a distance
  D is chosen uniformly from [0,1]. Third, the chord perpendicular to the chosen direction
  is drawn at distance D from the center. (a) Compute the probability that the chord
  is longer than the side of the inscribed equilateral triangle. (b) A student in
  the seminar claims this generator is uniquely ''neutral'' because it treats every
  direction equally and every distance from the center equally. Assess that claim.
  (c) What does your answer imply about the principle of indifference and about the
  original question ''What is the probability that a random chord is longer than the
  side of the inscribed equilateral triangle?''"


  Student answer:

  (a) The chord length is 2√(1-D²). The side of the inscribed equilateral triangle
  is √3. So the chord is longer iff 2√(1-D²) > √3, i.e., 1-D² > 3/4, i.e., D < 1/2.
  Since D is uniform on [0,1], probability is 1/2.

  (b) The uniqueness claim is false. The generator is one of several that can be described
  as neutral. The classic alternatives: choose two endpoints uniformly on the circle,
  giving 1/3; choose a midpoint uniformly in the disk, giving 1/4. So "neutral" does
  not pick out a unique procedure. The generator privileges the center by treating
  distance from the center uniformly; the midpoint method privileges areas; the endpoint
  method privileges boundary points. None is uniquely rational.

  (c) This shows the principle of indifference is inconsistent. If the same state
  of information—that a chord is chosen at random—supports three different probabilities,
  then the principle cannot be a valid rule for assigning probabilities. The original
  question has no determinate answer; it is meaningless until a procedure is specified.
  But once a procedure is specified, as in (a), the probability is determinate. So
  the right conclusion is that the original question is ill-posed, not that probability
  is subjective.


