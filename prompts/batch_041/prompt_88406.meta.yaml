  Actually the absent-minded driver problem: The driver cannot tell whether he is
  at the first or second intersection. If he exits at first, payoff 0; if he continues
  at first and exits at second, payoff 4; if he continues at both, payoff 1. The optimal
  strategy if he knew where he was: continue at first, exit at second. But since he
  can''t tell, he must choose the same action at both. If he exits, payoff 0; if he
  continues, payoff 1. So continue is optimal. But at the second intersection, if
  he knew he was there, he''d exit. The paradox is that the optimal strategy from
  the ex ante perspective is to continue, but from the ex post perspective at the
  second intersection, exiting is better. This challenges dynamic consistency. The
  "absent-minded driver problem" is often used to argue for "decision theory should
  evaluate strategies, not acts" or "CDT fails". It''s a conceptual issue in decision
  theory.


