  Actually the correct diachronic construction: the bookie makes two bets at different
  times such that the net is a loss for the agent regardless. The key: the bookie
  buys a ticket today and sells the *same* ticket tomorrow, or uses the fact that
  the agent''s price for the same ticket changes. Let''s do: Ticket T pays $1 if P.
  Today she prices T at 0.4. Tomorrow she''ll price T at 0.7. Bookie: today sells
  her T for 0.4 (bookie receives 0.4); tomorrow buys T back from her for 0.7 (bookie
  pays 0.7). Net: bookie receives 0.4, pays 0.7 → net -0.3. Hmm, that''s a loss. Reverse:
  today bookie buys T from her at 0.4 (pays 0.4), tomorrow sells T to her at 0.7 (receives
  0.7). Net +0.3 for the bookie, with no residual position — a sure gain of 0.3, regardless
  of P! Yes — that''s the Dutch book: the bookie buys at the low price and sells at
  the high price, and the agent accepts both because each is at her own (time-varying)
  price. So the guarantee comes from a round trip at two different prices, with no
  net exposure. And no need for the world''s outcome. Right — this is the correct
  structure: the bookie exploits the price change itself, using the agent''s own prices
  as both bid and ask.


