  - The ECLW claim: because your decision is evidence about what other agents running
  your decision procedure do (and in a large world there are lots of such agents,
  or you might be in a simulation where the simulators watch your code), cooperating
  can be rational even without causal influence — your cooperation is evidence of
  others'' cooperation, and the payoff multiplies across the many copies.

  - Two friends, one pro (call them the "cooperate" guy), one anti.


  Rounds with decent points:

  Round 1 (A, pro): In a large world, if you defect you''re not just defecting against
  this one stranger; you''re defecting in the "class" of all your counterparts. If
  there are enough counterparts — e.g., your decision procedure is instantiated in
  many places, or the simulators run you many times — then your decision is a sample
  from your policy, and cooperating makes the whole class cooperate. So cooperate.

  Round 2 (B, con): That''s the same trick as Newcomb''s problem and it only works
  if the predictor is reliable. In a large world, the agents running your exact code
  are a vanishing fraction of the agents you might be dealing with; the correlation
  between your action and a random stranger''s is tiny; and "large world" cuts against
  you: if the world is huge, there''s likely an agent whose payoff is negatively correlated
  with yours, and being the kind of agent that cooperates on evidence makes you exploitable
  by any agent that can arrange to have a counterpart of you run somewhere. "You''ve
  made yourself predictable and thus a resource for anyone who can simulate you" —
  hostage problem.

  Round 3 (A, pro): The hostage objection gets the direction of control wrong: an
  agent who can simulate you doesn''t thereby control you; if it simulates your decision
  procedure, its counterpart *is* you, and it can''t get you to do something your
  procedure doesn''t do. The correlation is not a vulnerability but a fact about what
  your procedure does; EDT says act so that the class of your instantiations does
  well, not so that you''re unpredictable. And if unpredictability is what you want,
  that''s just committing to being the sort of agent that does worse in coordination
  problems.

  Round 4 (B, con): But that assumes the thing you can''t verify — that counterparts
  exist, and that their situation is the *same* decision problem. If a counterpart
  faces a slightly different game, or has different info, "same policy" doesn''t imply
  same action; so the evidential link is broken exactly where it matters. Also the
  argument seems to prove too much: if it works, then in a large world you should
  cooperate with any stranger whose action is evidence about yours — including agents
  who''d punish you, or who would only cooperate with those who are "the type" — and
  you get an unconditional-disposition theory where you''re bound by anyone''s threat
  that they''re running your code. Where do you stop? The pro view needs a principled
  line about which counterpart-relations count as evidential, and it hasn''t got one
  that doesn''t collapse to "cooperate with everyone" or "cooperate with no one."

  Round 5 (A, pro): The line is the decision-theoretic one: correlate only where the
  correlation comes from a common cause in the decision procedure, not from mere similarity
  or from someone''s announcement. Threats don''t create evidential links; sharing
  a decision algorithm does. And in the actual large world we''re probably in, the
  dominant counterpart relation is between your own instantiations across the multiverse,
  which is exactly the one that makes defecting pointless.


