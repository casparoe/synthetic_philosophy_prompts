  "I am a retired microbial ecologist who has spent the last several years reading
  philosophy of history and philosophy of biology, and I keep returning to H. G. Wells''s
  The War of the Worlds. I want a philosophical reading of the novel, not a summary.
  Adopt the role of a philosopher of history and of the natural sciences who is also
  a careful literary critic, and begin by brainstorming the possible ways one might
  describe the Martians'' defeat by terrestrial microorganisms: as a contingent accident,
  as a case of environmental determinism, as an instance of non-human historical agency,
  or as something else. Then give me your considered reading.


  The novel, as I understand it, sets up a human drama of empire, technology, and
  invasion, and then resolves it through a cause that has no intentions, no plans,
  and no interest in the outcome. I have been calling this ''the bacteriological coup''
  and using it as a test case for a distinction I am trying to draw: between a factor
  that is merely causally efficacious in history and a factor that is a historical
  actor. I suspect the distinction matters, but I cannot say precisely where the line
  falls. Does the novel dramatize a genuine form of non-human agency, or does it expose
  the very idea of non-human agency as a confusion? Does it vindicate a deterministic
  picture in which human purposes are epiphenomenal, or does it instead show that
  history is settled by contingency, and that our narratives of agency are retrospective
  impositions?


  Please address the following, in whatever order makes for the strongest argument:

  1. Where in the novel does the lens of non-human causation illuminate a scene or
  a character''s choice, and where does the novel resist that lens? Be concrete about
  plot and scenes, but do not quote the text.

  2. What does the novel get right or wrong about the difference between causal efficacy,
  historical significance, and agency? Is a germ that kills an invader an ''actor''
  in any philosophically respectable sense, or only a cause? What would be lost, and
  what would be gained, by extending the term ''actor'' to germs, climates, and volcanoes?

  3. The perils of environmental determinism: does the novel''s ending invite us to
  explain historical outcomes by biological or environmental factors in a way that
  flattens human responsibility, or does it use non-human causation precisely to dramatize
  the limits of human control? How should we read the ending so as not to slide from
  ''non-human causes mattered'' to ''human intentions did not''?

  4. Finally, what does the novel add to the philosophical debate that a straightforward
  argument about non-human agency and environmental determinism could not? If the
  novel is making a philosophical point, state it as clearly as you can; if it is
  evading one, say so.


  Think carefully and take a position. I am not asking for a survey of what critics
