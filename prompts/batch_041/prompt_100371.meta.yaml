  ---


  I have no training in philosophy, but I''ve spent a lot of time thinking about how
  online communities go wrong, and I keep arguing about it with a friend of mine,
  Dana, who moderates a large discussion site. Dana is unusually consistent, and has
  firm verdicts on which online spaces count as epistemic bubbles, which count as
  echo chambers, and which count as neither. I''d like to figure out the rule Dana
  is actually running before I argue with them again.


  Here are the verdicts, as best I can reconstruct them.


  - A model-railway forum where everyone shares the hobby and there is no real politics:
  members mostly don''t know that rival forums exist, there''s no figure whose word
  settles things, and nobody suspects outsiders of lying. Dana calls it a bubble,
  and a harmless one, but insists it is not an echo chamber.

  - A neighborhood chat group whose members all take their news from one small newsletter
  and are only dimly aware that other outlets exist; again there is no leader and
  no hostility to outsiders. Dana calls it a bubble.

  - A forum called Wake Up, whose members are told the entire mainstream press is
  a coordinated deception and that anyone who cites it is a paid plant; the founder''s
  posts are treated as the last word on any dispute. Dana calls it a textbook echo
  chamber.

  - A rowdy debate forum where people hold a wide range of views, argue hard, defer
  to no shared authority, and assume opponents are sincere. Dana says it is neither
  a bubble nor a chamber, just disagreement.


  Next week Dana will visit a group I belong to, The Reading Room. We read across
  the whole political spectrum — nobody could call us uninformed — and we have no
  suspicion that outsiders are lying or bought. But we do have a moderator whose readings
  of whatever we''re discussing are treated as essentially settled; once he posts,
  the argument is over.


  I want you to take the role of an expert philosopher of social epistemology and
  testimony, and to reason carefully and explicitly rather than giving me a quick
  answer. Begin by brainstorming the various rules that could have produced Dana''s
  four verdicts — I''d rather see several than one — and only then decide.


  Then tell me: what is Dana most likely to say about The Reading Room, and why? Which
  of the candidate rules is Dana actually running, which of the other rules fit the
  four earlier verdicts just as well, and which single further case would best tell
  those rules apart? If the earlier verdicts genuinely underdetermine the answer,
  say so plainly, and tell me what principle Dana would be committing to under each
  reading, since I''d rather know what I''m agreeing to than win the argument.


