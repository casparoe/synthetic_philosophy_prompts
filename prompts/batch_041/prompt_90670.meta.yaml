  Which philosophical domain do I know better and can inject more crisply? Aristotle''s
  natural slavery: I know Politics I.4-7 and I.13 reasonably. Key claims: (1) rule
  of master over slave is natural and beneficial; (2) the natural slave is one who
  "participates in reason so far as to apprehend it but not to possess it" — i.e.,
  he can follow instructions but can''t deliberate; (3) the slave is "animate property,"
  a "living tool" (instrumentum vocale); (4) slaves have virtue only to the extent
  needed for their function — the slave''s virtue is "not the same as the master''s"
  and he has "reason enough to..." (5) the dispute: some hold that slavery is by convention/law
  (e.g., war captives) and thus unjust, others by nature; Aristotle sides partly but
  admits the difficulty and notes that in practice the natural and the legal often
  diverge (i.e., those enslaved by conquest may be natural slaves — he kind of concedes
  that his theory can''t justify all actual slavery, and says the claim "Hellenes
  should rule barbarians" is the natural version); (6) the analogy with the rule of
  soul over body, and with the rule over animals ("tame animals are better off when
  ruled by humans, for so they obtain safety"); (7) friendship between master and
  slave is possible insofar as the slave is a man (I.6 / and in the Ethics, "there
  is no friendship with a slave qua slave, but qua man"); (8) the natural slave''s
  incapacity is about *deliberation* (bouleusis), which Aristotle elsewhere (NE III)
  makes central to virtue — so there''s a tension: if virtue requires deliberation,
  the natural slave cannot be virtuous, yet Aristotle says the slave needs virtue
  (I.13 says the slave needs "a small amount" of virtue, "so much as not to fail in
  his work through intemperance or cowardice"). That tension is a good "in the weeds"
  hook: the natural slave must have enough virtue to work well, but virtue requires
  deliberative choice, which the natural slave lacks — so Aristotle''s theory is internally
  unstable, and The Tempest dramatizes exactly that instability (Prospero needs Caliban
  to be capable of virtue/reform, and Caliban''s final line promises it).


