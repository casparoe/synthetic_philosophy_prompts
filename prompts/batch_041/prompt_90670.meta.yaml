  Pain asymbolia facts (to inject): It''s associated with lesions to the insular cortex
  (posterior insula) and the parietal operculum, often from stroke in the territory
  of the middle cerebral artery. Patients feel a painful stimulus as a sensation but
  report it as not hurting / not distressing; they may withdraw the limb reflexively
  (or not), and they often smile or laugh when the pain is applied; they can still
  localize the stimulus poorly; the pain "isn''t theirs"; they can detect and even
  respond to the stimulus but the pain lacks the aversive character. There''s also
  the phenomenon that they respond to the *threat* rather than the pain? Hmm — Grahek
  argues that asymbolia shows that the sensory-discriminative and affective-motivational
  dimensions of pain can come apart, and specifically that the patient''s withdrawal
  response is absent or diminished, and that they don''t show the usual autonomic
  response. Also relevant: "pain without painfulness" — and the counter-literature:
  some argue asymbolia patients do feel unpleasantness but can''t *report*? No — the
  debate: some argue that asymbolia is a deficit in the *meaning* rather than the
  feeling (the "asymbolia" = inability to grasp the symbolic meaning of the stimulus).
  Also Klein (Colin Klein) has argued asymbolia is a deficit in the *content* of pain
  experience, i.e., the patient fails to represent the pain as *bad for them* — a
  missing "imperative" or "badness" component; he argues for a "deflationary" or an
  imperativist account of pain. Also there''s the debate about whether the *hurt*
  is a distinct component. Also "pain asymbolia" vs "pain indifference" (congenital)
  vs "pain insensitivity". The case of "Miss C" — I recall a patient described by...
  hmm. There''s a famous patient in Grahek''s book. I shouldn''t rely on names.


