  servitude and his promised freedom. Reading through Aristotle: Caliban is arguably
  cast as the "natural slave" — chthonic, resistant to cultivation, incapable of virtue
  (in Prospero''s view), used as a tool; but the play undercuts the theory: Caliban
  learns language (contradicting the claim that the natural slave only apprehends
  reason), he registers beauty, and his "servitude" is the result of conquest, not
  nature — i.e., he''s a slave "by law/convention" (Prospero''s island, taken by force,
  and Caliban''s inheritance stolen). And Prospero himself, who "rules" by art and
  books, is uneasy: he must constantly police Caliban, and at the end acknowledges
  him. So the play dramatizes the Aristotelian theory and its refutation: it shows
  that the appearance of natural slavishness is manufactured by conquest and by the
  withholding of education. Also, interestingly, the play''s own colonial reading
  is well known; but the Aristotelian angle — asking whether Caliban satisfies Aristotle''s
