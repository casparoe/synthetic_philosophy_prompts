  Key insight to exploit: The free will defense and soul-making theodicy have different
  *scope*. FWD covers moral evil (evil caused by free creatures) and not natural evil
  (except via the fall of angels, or via a "free process" defense à la Hasker/Plantinga).
  Soul-making covers suffering that builds the sufferer''s character, and (per Hick)
  requires that suffering be *distributed* to those who need it and that it be *instrumental*,
  and famously requires that the world be "soul-making" but not "hedonistic." A key
  known tension: Hick''s soul-making requires that suffering be *epistemically distanced*
  from God (we must not see God''s purpose), which is why the "counterfactual" — a
  world with less suffering would be a world where character grows less — needs to
  be plausible.


