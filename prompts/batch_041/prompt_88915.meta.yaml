  Key disanalogies to seed (but I shouldn''t give away the answer too much; the prompt
  can hint at the asker''s suspicion):

  - Returns aren''t a scalar: electricity has energy, firm capacity, inertia, voltage
  support, ramping. Can''t rank technologies on one axis.

  - Correlations are regime-dependent and weather-driven: a dunkelflaute hits wind
  and solar together; drought hits hydro and nuclear cooling; so diversification benefit
  is not stable.

  - Portfolios can be rebalanced continuously and cheaply; plants have 40-60 year
  lives and 10-15 year build times, so the "portfolio" is path-dependent and lumpy
  — you can''t costlessly switch.

  - The "assets" are not independent of the "portfolio''s" other holdings: choosing
  nuclear affects the market prices and hence the viability of the rest (merit order
  effect), i.e., you''re not a price-taker.

  - Risk aversion parameter is not given; and there''s no single investor — the "portfolio"
  is held by a polity with heterogeneous preferences and a 4-year electoral cycle,
  so the time horizon of the "investor" is shorter than the assets'' lives.

  - Also the analogy presupposes that "diversification" means holding many; but a
  portfolio of two correlated assets isn''t diversified; and "keeping nuclear in the
  mix" may reduce one kind of risk (supply) while adding another (concentration of
  catastrophic tail risk, which mean-variance can''t handle because variance is a
  bad measure for fat-tailed, one-shot catastrophic risks). That last point is strong:
  portfolio theory uses variance as risk, which fails for ruin risk (Kelly criterion
  vs. mean-variance); a 1% chance of a catastrophic meltdown is not "volatility" to
  be averaged away.

  - Eggs-in-one-basket version conflates diversification of supply sources with diversification
  of technologies; Germany diversified suppliers (Norway, France, LNG) rather than
  technologies.


