  no first-person record behind, and I have arrived at a difficulty that is finally
  more conceptual than technical. I would like you to help me work it through. Please
  take the part of an expert in historiography and the epistemology of archives —
  someone who has thought hard about how records come to exist and who has spent real
  time in the reading room — and, at the same time, someone with a novelist''s sensitivity
  to what a metaphor is quietly doing when it has been smuggled into an argument.
  Think carefully before you commit to anything. Begin by brainstorming: set out,
  for yourself, what the analogy I am about to describe is being asked to carry, and
  only then start to answer.


  The situation is this. The people I am writing about were, for the most part, people
  whom the institutions around them had reasons to count and to charge, but not to
  let speak. What survives of them are entries in parish registers, a handful of bills
  of sale, a few court depositions in which their words appear only as answers to
  questions that someone else had chosen to ask, in categories someone else had chosen.
  Nothing in their own hand; nothing addressed to a future reader; no diary, no letter
  kept on purpose. The silence is not random — it falls exactly where a society had
  no institutional need to write.


  My editor, who is a good editor, keeps invoking a picture that I have come to distrust.
  The archive, she says, is a mirror. It reflects what was there. If the people I
  care about are missing from it, that is not the archive''s doing; it is because
  they did not write anything down. The conclusion she draws from this is a rule for
  the novel: I may write only what the documents support, and any invented interior
  life is a falsification — a sentimental one, at that — because it puts words in
  the mouths of the dead and calls it history. A mirror cannot lie, so my additions
  can only be lies.


  I suspect the picture is wrong, but I want the suspicion tested rather than flattered,
  because the conclusion is not obviously absurd: there is something to the charge
  of sentimental ventriloquism, and I do not want to answer it with a shrug. My own
  candidate is that the archive is less like a mirror than like a sieve — or perhaps
  a filter with a very particular mesh — but I am not confident that this replacement
  is any better, and I would rather have the audit than the alternative.


  So, please:


  1. Give the mapping explicitly. A table of correspondences would suit me well: what
  plays the role of the mirror, of the thing reflected, of the light, of the frame,
  of the hand that holds it, of the viewer. Say what has to be true of archives for
  the mirror picture to get a grip at all.


