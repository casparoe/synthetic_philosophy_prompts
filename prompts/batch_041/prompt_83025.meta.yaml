  Draft prompt:


  Write a short story of roughly 1,800 words built around the following distinction,
  which it should dramatize rather than state.


  There are two ways of being insulated from a serious opposing view, and they are
  easy to mistake for each other. In the first, the view is simply absent: nothing
  in the character''s life brings it into contact with the disagreement, and because
  the absence is environmental rather than enforced, the character can honestly believe
  that they have considered the other side — that they read about it once, that a
  colleague holds it, that they would know if there were a serious case for it. In
  the second, the view is not absent at all; the character encounters it constantly,
  sometimes seeks it out, and yet it never lands, because they have been taught in
  advance how to receive it — that its advocates are dishonest, or paid, or unserious,
  or that the fact that it is being pushed so hard is itself evidence of something.
  The two conditions have opposite remedies. The first is punctured by exposure: put
  the person in a room with the argument and something gives. The second tends to
  be strengthened by exactly that exposure, because encountering the argument is the
  ordinary condition of its life, and the encounter has already been assigned a meaning.


  Then the story: a character who lives inside the first condition and, over the course
  of the story, comes to live inside the second, without ever registering the change
  as a change — indeed, believing that they have just escaped a bubble rather than
  entered one. Requirements:


  - Don''t let the reader identify either group by its politics, religion, or any
  other content. Keep the setting ordinary — a workplace, a trade, a family, a club
  — and make the difference between the two groups a difference in mechanism, not
  in doctrine. Ideally the two groups believe many of the same things.

  - Invent a concrete, recurring practice that the second group performs — something
  done on a schedule, with a procedure, that does the work of pre-loading the interpretation
  of any counter-evidence before it arrives. Make it specific and mundane enough that
  a reader would recognize the shape of it from their own life.

  - The character''s own epistemic virtue must be the mechanism of their capture.
  Their openness, their dislike of smugness, their willingness to read the other side,
  their allergy to being the kind of person who only talks to people who agree — whatever
  it is, it has to be the thing that carries them across, so that the reader feels
  the trap close on a strength rather than a weakness.

  - Neither group may be stupid or villainous. The first group should be decent and
  a little complacent; the second should be more articulate, more self-critical in
  appearance, and in some ways more honest than the first. The second group should
  not be depicted as cynical: the people inside it should mean what they say.

  - Do not use the words ''echo chamber'' or ''epistemic bubble'', and do not let
  any character explain the distinction or the trap. No lecture, no closing realization
  speech, no narrator''s aside that tells the reader what to conclude. If the story
  needs a diagnosis, let a character get it partly wrong.

  - End on an action or an image, not a summary.


