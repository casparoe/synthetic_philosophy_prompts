  Prompt:


  I am a novelist, and I have spent the last year trying to write a thriller around
  a decision problem that I can only describe, not name. My antagonist is a blackmailer
  who never makes a demand without first having made a prediction. The demand is always
  the same: send money, and I will give you the key to the file I have encrypted;
  refuse, and I will destroy the key. The peculiar part is the selection: he encrypts
  a person''s file only if he has already predicted that the person will pay. So if
  you pay, you were selected, and the key is real. If you refuse, the most likely
  explanation is that he never encrypted your file at all; there is no key to lose.
  The protagonist, advised by a game theorist, is told to refuse, because refusal
  is evidence that the threat was never active. But she cannot shake the thought that
  her refusal is safe only because the blackmailer predicted it, and that if she were
  the sort of person who would pay, she would be in the world where refusal is costly.
  The blackmailer, meanwhile, insists that he is not punishing refusal; he is simply
  giving the key to those who pay, and he chose his targets by looking at what they
  would do.


  I have a lay interest in decision theory, and I know this is adjacent to Newcomb''s
  problem and to the puzzle where a predictor rewards you in a counterfactual branch
  if you would have paid in the actual branch. But the structure here seems different
  in at least two ways: the predictor''s action is a threat rather than a reward,
  and the threat is conditional on your action in the very world in which you are
