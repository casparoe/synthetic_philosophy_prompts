  I''m teaching a seminar on punishment and modern literature, and I''m pairing Camus''s
  novel The Stranger with his later abolitionist writing on the death penalty. The
  pairing is obvious enough—Meursault is condemned to death, and Camus spent years
  arguing that the guillotine is a uniquely barbaric institution—but the more I sit
  with it, the less the two pieces seem to line up, and I''d like a reading that takes
  the mismatch seriously rather than smoothing it over. Camus''s case against capital
  punishment, as I understand it, rests on a few interlocking claims: that execution
  is irreversible in a way that makes judicial error monstrous; that it is a premeditated,
  ritualized killing by the state rather than a spontaneous act of passion; that it
  fails as a deterrent; and that it corrupts the society that authorizes it by turning
  citizens into spectators and accomplices. He also insists that the horror of the
  death penalty is not mitigated by the guilt of the condemned—that even a guilty
  man should not be killed by the state. The Stranger, though, gives us a protagonist
  who is guilty, a trial that is a mockery of justice, and an ending in which Meursault
  seems almost to consent to his execution, opening himself to the indifferent universe
  and hoping for a crowd to greet him with cries of hatred. That is not obviously
  an abolitionist novel. So I want you to read The Stranger through the lens of Camus''s
  views on the death penalty and tell me: where does the novel dramatize or strengthen
  the abolitionist case, and where does it complicate, resist, or even undermine it?
  Pay particular attention to the trial, where the prosecution seems to care more
  about Meursault''s failure to weep at his mother''s funeral than about the killing
  itself, and to the final pages, where Meursault''s defiance and reconciliation might
  be read as a kind of aestheticization of execution. Does the novel show capital
  punishment as a social ritual that requires the condemned to perform a role—remorse,
  conversion, recognition of the law—and then kills him anyway? Or does it risk making
  the execution seem like a natural fact, one more indifferent event in an absurd
  cosmos, and so drain it of the political horror that Camus''s essay wants to attach
  to it? I''d also like you to say whether Meursault''s guilt matters for the argument.
  Camus opposed the death penalty even for the guilty, but the novel''s reader may
  feel that the injustice is not the execution as such but the fact that Meursault
  is condemned for his character rather than his crime. Is that a confusion the novel
  invites, or is it the point—that the death penalty always turns a trial into a judgment
  of the soul? I don''t need a bibliography, and you shouldn''t quote the text; I
  know it well. What I want is a philosophically serious reading that does justice
  both to the novel and to Camus''s abolitionism, and that ends by saying what The
  Stranger adds to the death penalty debate that the essay alone does not.


