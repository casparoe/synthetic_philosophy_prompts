  I''m putting together a little collection of poems about ideas in AI saftey, and
  I need one on the competitiveness constraint and the alignment tax. You''re a poet
  who also knows this literature well enough to be dangerous, so I dont want a Wikipedia
  summary in verse -- I want the poem to do the conceptual work.


  Here''s the setup, in case you need it: the alignment tax is the idea that safety
  work costs you something -- capability, speed, compute, whatever. The competitiveness
  constraint is the idea that if one lab pays that tax and another doesn''t, the one
  that doesn''t can get ahead, so the safe lab either loses or cuts corners. If everyone
  could credibly commit, they''d all pay it; the problem is that no one can, and a
  unilateral pause just hands the lead to someone else. I also want the poem to touch
  the difference between a tax on capability and a tax on time-to-capability, because
  I think thats where a lot of the real action is.


  I want a round (a canon for three voices, the kind where each voice enters at different
  times with the same line). Three voices: (1) a lab that genuinely wants to be safe
  but is watching the leaderboard, (2) a lab that says it''s safe but keeps redefining
  safety as whatever it was going to do anyway, and (3) a lab that isn''t pretending
  at all. The same recurring line should mean something different each time it comes
  around, and when all three finally sing together, it should sound less like harmony
  and more like an equilibrium nobody chose. 24-30 lines total, with a refrain that
  is the tax itself. Don''t name real companies or people. Dont make it a sermon;
  let the form carry the argument.


