  Kant → formal methods residue candidates:

  1. Maxims are not rules: a maxim is subjective, includes the agent''s end and motive;
  formal specs have no such thing. So the translation must decide what a maxim is.

  2. "Contradiction in conception" isn''t logical contradiction; Kant''s own examples
  (false promise) require a teleological premise (the institution of promising has
  a point). So the translation as "unsatisfiability" is too strong/too weak: a world
  where everyone makes false promises is perfectly satisfiable as a set of actions;
  it''s the *institution* that breaks. This is a real philosophical point (the "teleological"
  reading). Great residue: formal consistency can''t capture the "the practice would
  be destroyed" move.

  3. The contradiction in will: the universalized maxim conflicts with a necessary
  end (self-preservation, happiness). The analogue might be "satisfiable but self-undermining
  for the goal" — like a policy that reaches the goal in every rollout but... hmm.

  4. The residue: moral *permission/obligation* — formal methods gives no deontic
  output. And the "realm of ends"/autonomy — the agent as legislator, i.e., the spec
  is self-imposed, which maps onto... interesting: "the agent is both the author and
  the subject of the law" ≈ self-modifying code / a program that compiles its own
  spec? Hmm, cute but maybe too cute.

  5. Also: universalizability as a consistency test over all agents — the analogue
  would be requiring a spec to be consistent with every agent in the system adopting
  it, i.e., a fixed-point / Nash-like condition. Interesting.


