  Draft:


  ---


  I have been trying to work out what I actually think about ''good enough'' decisions,
  and I keep getting tangled. I should like you to tell me what principle, or small
  family of principles, my verdicts amount to, and where they force me to give one
  up.


  My verdicts, on cases that have mostly happened to me:


  1. Flats. Before I began looking I set a bar — within budget, under forty minutes''
  commute, a room I could use as a study. I saw three flats; the second cleared the
  bar; I took it and cancelled the fourth viewing. I later learned the fourth was
  cheaper, closer and larger, and would also have cleared the bar. I am confident
  I did nothing wrong.


  2. Laptops. No bar, no list. I handled one in a shop, it felt fine, I bought it
  and walked out, past the shop next door where I would very likely have found a better
  machine for the same money. I am not willing to call this irrational. But it is
  not the same kind of thing as (1), and I cannot say what the difference is. If you
  asked me why I stopped, I should have nothing to say except that it seemed fine.


  3. The same laptop purchase, except that I had told myself in advance that I would
  buy the first one that felt fine, and had written it down so as not to spend the
  afternoon dithering. That, I think, is all right.


  4. Flats again: late in the search, tired, I quietly dropped the study requirement
  and took the next flat that met the reduced bar — a flat I would have rejected on
  the first day. Not all right. That was fatigue, not a decision.


  5. Now suppose I had written on the first day: ''if I have not found anything by
  the twentieth, I shall drop the study requirement.'' On the twentieth I drop it
  and take the next adequate flat. I want to say that is all right. But suppose instead
  I had written: ''if I get bored by the twentieth, I shall drop the study requirement.''
  I want to say that is not all right, and I cannot see how it differs from the previous
  case in any way that matters, since in both cases the later me is simply following
  the earlier me''s instruction.


  6. Vouchers. At a counter I am offered a £10 voucher or a £12 voucher, with no cost,
  no uncertainty and no further searching to do. I take the £10 one, on the ground
  that ten is plenty. I do not think I have been irrational, exactly, but I can find
  nothing to say in defence of the choice, and if I made a habit of it I should think
  there was something the matter with me.


  7. The same counter, except that I take the £10 voucher because I hold a standing
  policy of not always taking the largest share when the difference does not matter
  to me, and I can give an account of why I hold that policy. That is all right.


  8. Hiring. I sit on a panel for a junior analyst. We agree a standard, the first
  candidate we see clears it, and we appoint them without seeing the rest of the shortlist.
  I am comfortable with this, though the only person who bears the cost of our stopping
  is a candidate we never met, and the benefit of stopping accrues to us.


  9. A routing application returns a route a few per cent longer than the shortest
  one, because computing the true shortest would take longer than the journey saves.
  I do not think it is satisficing at all. It is optimising, with computation counted
  among the costs.


  I notice one further wrinkle. In (1) I said the fourth flat was cheaper, closer
  and larger, and I stand by my verdict. But if it had been £250 a month cheaper I
  suspect I should have felt differently about having stopped, and I cannot tell whether
  that is a genuine difference or merely regret at the sight of a better thing.


  What I want from you: a principle, or a short list of candidate principles, that
  gets as many of these verdicts as possible; a precise statement of each, with the
  case that forces each clause; your verdicts on cases I have not listed — in particular,
  a doctor who prescribes the first treatment that meets a clinical standard when
  a marginally better one would cost no more to prescribe, and a person who takes
  the £10 voucher because they are simply incurious about whether there is a £12 voucher;
  and an honest statement of which of my verdicts the principle cannot accommodate,
  and which I ought to give up. Where my verdicts conflict, say so plainly rather
  than papering over it. Tell me how confident you are in the principle you settle
  on, and identify the single point in the account you are least sure of.


