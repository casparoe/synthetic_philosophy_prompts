  Dennett calls this the Stalinesque model, after Stalin''s show trials, in which
  the record is falsified before anyone is allowed to see it: the brain edits the
  experience before it reaches consciousness, so what we take to be a real-time stream
  is really a finished film spliced together after the fact. The rival Orwellian model,
  on which the experience is genuine but the memory of it is rewritten later, is ruled
  out by the experiment, because the subjects'' reports place the color change too
  early. The upshot, for Dennett, is that there is no fact of the matter about when
  a given content enters experience, and hence that consciousness as we ordinarily
  conceive of it — a single inner show playing in real time — is an illusion."


