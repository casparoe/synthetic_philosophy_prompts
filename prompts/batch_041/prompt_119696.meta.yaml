  whether classical logic''s bivalence forces an answer, etc. This is nice and "in
  the weeds": e.g., Benacerraf vs. others; the "no answer" view. Prompt could ask:
  credence that Thomson''s lamp has a fact of the matter about its final state. Decomposition:
