  to decode; the inner message is the content. There''s also "outer message". This
  is quite niche. Probability estimate: credence that meaning is located in the inner
  message rather than the frame/outer message? Hmm, could work but "location of meaning"
  is more conceptual. Could ask: credence that for any message, meaning is fully determined
  by the inner message given the frame. Might be awkward but interesting. Also risk:
