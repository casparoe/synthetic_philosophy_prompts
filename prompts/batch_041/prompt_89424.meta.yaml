  Summary:


  ''Dennett''s big idea is that there are three stances you can take toward anything
  you''re trying to predict. The physical stance: work out the physics. The design
  stance: work out what the thing was built to do. And the intentional stance: treat
  it as a rational agent and work out what it would do given what it wants and what
  it believes. The catch is that a stance is just a stance — a posture you adopt,
  like deciding to give a colleague the benefit of the doubt — so when you say the
  chatbot believes Paris is in France, you''re not describing anything inside the
  chatbot, you''re describing your own convenient way of talking. That''s what he
  means by calling beliefs useful fictions. He does also want to say that for systems
  complicated enough the beliefs are perfectly real, which has always struck me as
  him having it both ways, though he''d probably say it''s because belief comes in
  degrees and there''s no sharp line. Applied to AI, the moral is that the intentional
  stance is the top of the ladder, the one you move up to once a machine gets complicated
  enough, and since you can predict a chatbot''s answers about Paris much better by
  assuming it knows where Paris is than by tracing its weights, his own test says
  it really does have beliefs about Paris. Which is also why he thinks the hard problem
  of consciousness is a non-starter: if there''s nothing more to having a belief than
  the stance paying off, there''s nothing more to having an experience either.''


