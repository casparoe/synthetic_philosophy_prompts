  some sense it is, in some sense it isn''t, in some sense it is and isn''t, and in
  some sense it can''t be said — but I don''t think that means reality contains contradictions;
  it means our predicates run out. (6) And yes, I apply all of this to (1)-(5) themselves:
  the whole package is just one standpoint too. Which of these actually pull against
  each other, which only look like they do, and what''s the cheapest way to make it
  consistent — and what does that fix cost me?"


