  "I teach a seminar on where meaning lives, and I''ve been using the idea that a
  message has three layers: a frame message that tells you how to decode it, an outer
  message that is what a competent decoder gets out of it, and an inner message that
  is the thing the message is actually about (so the inner message of a stretch of
  DNA is the organism it builds). Here''s my package: (1) meaning is never intrinsic
  to a string — it''s the isomorphism between the string and something else, plus
  a decoder that can see the isomorphism. (2) Still, there''s a fact of the matter
  about what a natural message means: a gene really does mean the protein it codes
  for, whether or not anyone is reading. (3) For a natural message the inner message
  is the thing itself — DNA''s inner message is the organism, so the message contains
  its own reader. (4) Isomorphism is cheap: any two things can be mapped onto each
  other if you''re allowed a weird enough mapping, so ''the right isomorphism'' can''t
  be what pins down content. (5) Conventional symbols get their meaning from us; natural
  signs get it from causal-informational links."


