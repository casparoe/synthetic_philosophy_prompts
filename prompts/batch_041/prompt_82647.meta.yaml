  Commitments (professor, casual, first person):

  1. I think every assertion about reality is true only from a standpoint — no proposition
  captures the thing-in-itself exhaustively; truth claims are always indexed to a
  naya (a "point of view").

  2. But I''m a scientific realist: there is a single best account of how things are,
  and our best theories get closer to it. (Tension: standpoint-relativism vs. a uniquely
  correct account.)

  3. I think classical logic holds: no proposition is both true and false, and for
  any proposition either it or its negation is true (in a given standpoint). But I
  also accept the Jain move of "in some sense it is, in some sense it isn''t, in some
  sense it is and isn''t, in some sense it''s inexpressible" for the same proposition.
  (Tension: syādvāda''s seven predications vs. bivalence.)

  4. I think the reason all standpoints are partially right is that reality is itself
  many-sided (anekānta is grounded in the object, not just in us). (This is what dissolves
  the "anything goes" reading.)

  5. I think contradictions in reality are impossible — the world isn''t contradictory,
  it''s just inexhaustible. (Tension with 3''s "is and isn''t" if read as a real contradiction.)

  6. Self-application: I think anekāntavāda is itself only one standpoint among others
  and thus only partially true — but I also think it''s the correct theory of truth.
  (Genuine tension: the self-application problem.)


