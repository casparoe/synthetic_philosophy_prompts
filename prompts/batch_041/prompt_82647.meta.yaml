  Domain: The location of meaning: frame, outer, and inner messages. Hofstadter''s
  idea: a message has (1) a frame message: tells the receiver how to decode, i.e.,
  "this is a message, use this decoder"; (2) an outer message: the information that
  a decoder, having been triggered, can extract (the "content" — for DNA, the outer
  message is the phenotype-building instructions); (3) an inner message: what the
  message is about, what it refers to — for DNA, the inner message is the organism
  itself. Key point: meaning is not located in the message; it''s in the isomorphism
  between the message and the thing, and in the decoder.


  A professor''s commitments could be:

  - Meaning is relational: a string has meaning only relative to a decoder / an isomorphism;
  there''s no intrinsic meaning.

  - But I also think there''s a fact of the matter about what a message means — i.e.,
  realism about content — for instance, that the genetic code''s outer message really
  is about building the organism, not just "in the eye of the beholder."

  - I think a message''s "inner message" is the thing it''s about, which for DNA is
  the organism (self-reference: DNA''s inner message is the organism that contains
  it — a self-referential loop).

  - I think understanding = finding the right isomorphism, and that there''s no principled
  way to distinguish a "real" isomorphism from an arbitrary one (the "quasi-isomorphism"
  worry).

  - I think content is not observer-relative for natural representations but is observer-relative
  for conventional symbols.


  Tension: if meaning is decoder-relative (1) and any isomorphism counts, then the
  claim that there''s a fact of the matter (2) is undermined; and the inner message
  idea presupposes that the thing referred to is picked out independently of any decoder,
  which conflicts with decoder-relativity. Apparent tension that dissolves: frame
  vs. outer message — the fact that the frame message is itself decoded by a decoder
  (infinite regress) is not really a problem if you distinguish levels.


