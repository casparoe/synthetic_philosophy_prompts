  That''s a rich "defeaters" prompt. It''s in the weeds (Bostrom''s 2012 analysis,
  its assumptions: agents'' estimates are independent, each has same probability of
  being right, error costs). Actually the unilateralist''s curse is: if N agents each
  independently and with a probability p of being right decide whether to act, then
  the probability that at least one acts on a mistaken belief goes up with N. But
  the subtlety: it assumes each agent acts if they believe acting is net-positive,
  and errors are uncorrelated. Also the classic critique: the curse argument seems
  to imply that as N→∞, nobody should act, but also implies that as N→1 you should;
  so the reasoning is unstable, and there''s a "reverse" (the unilateralist''s curse
  vs. the "many hands" — actually the opposite phenomenon is the "many hands problem"/"diffusion
  of responsibility"). Also there is a known critique: the curse presupposes that
  agents'' errors are independent — if errors are correlated (common bias), adding
  agents adds less; and if agents are diverse, errors are less correlated, so more
  agents may be better. Also the "precautionary principle" parallel.


