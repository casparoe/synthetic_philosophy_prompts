  1. Must deliver a determinate prescription for a single, one-shot bet with known
  odds (the theory can''t only speak of limits).

  2. Must say how the prescription for repeated/compounding bets relates to the prescription
  for one-shot bets — and whether the "long run" can justify a different criterion.

  3. Must handle the ensemble-vs-time-average divergence: multiplicative process with
  equal chances of ×1.5 and ×0.6; the average over many parallel worlds grows, every
  single trajectory shrinks. Which is the object of rationality?

  4. Must not prescribe betting on a positive-expected-value gamble at the cost of
  ruin; must respect the no-borrowing constraint and give a risk-of-ruin statement.

  5. Must give a verdict on bets that are favorable in expectation but unfavorable
  in log (the ×1.5/×0.6 single bet) — and justify either the refusal or the acceptance.

  6. Must handle unbounded-payoff/low-probability offers (St. Petersburg; Pascal''s-mugging-style)
  without either taking every such bet or refusing by fiat.

  7. Must say whether it''s a criterion of growth (a rate) or a utility (a ranking),
  and whether the two can diverge; must not equivocate between "maximize expected
  log wealth" and "maximize the growth rate."

  8. Must be supported by a dominance/optimality result and must state its scope (asymptotic,
  almost-sure, with what conditions on the bets — known probabilities, stationarity,
  independence).

  9. Must handle unknown/estimated probabilities (parameter uncertainty; overbetting;
  fractional stakes).

  10. Must handle the case where the agent must consume from wealth, not just accumulate
  it; and where the horizon is finite or the goal is a target (reaching a target before
  ruin vs maximizing growth).

  11. Must say what it does when there are multiple simultaneous/correlated bets (portfolio,
  and the interaction with Kelly''s separability).

  12. Must respect the distinction between the bettor''s preferences (risk aversion)
  and the growth rate — i.e., not smuggle in a utility while claiming to be preference-free.


