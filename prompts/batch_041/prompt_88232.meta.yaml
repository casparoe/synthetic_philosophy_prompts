  "I am a novelist at work on a book whose central character has adopted a philosophical
  position I have come to call asymmetric tranquilism, and I need to know what would
  count against it before I decide how the book should end. As I understand it, asymmetric
  tranquilism holds that the only thing that is intrinsically bad is suffering; craving
  is bad only insofar as it produces suffering; and the only thing that is intrinsically
  good is the absence of craving, with the absence of suffering being a subordinate
  good that matters because it removes an obstacle to tranquility. Positive pleasure,
  on this view, has no intrinsic value; it matters only as a means of reducing craving
  or as a sign that craving has subsided. The position also makes a claim about moral
  priority: if forced to choose between relieving suffering and eliminating craving,
  one should eliminate craving, because suffering is often a symptom of craving and
  because a life without craving cannot be made worse by the absence of pleasure.


  "I want you to tell me what would count against this position. I am not looking
  for a bibliography or a survey of the literature; I want the arguments, cases, intuitions,
  and empirical possibilities that should move someone who holds it. Please sort them
  by how decisive they would be -- which would be fatal, which would force a serious
  revision, and which would be merely awkward. Distinguish what a defender of asymmetric
  tranquilism would themselves concede as counting against the view from what only
  an opponent would say. Say what the view predicts that its rivals do not, and whether
  it risks anything at all or has been insulated by its qualifications. If you think
  it can be defended by retreating to a narrower claim, tell me what that narrower
