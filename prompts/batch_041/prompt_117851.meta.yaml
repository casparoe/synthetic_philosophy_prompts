  Key correct facts:

  - Kelly criterion: maximize E[log W] = maximize long-run growth rate of wealth (for
  repeated independent bets). For a simple bet with win prob p, odds b, fraction f:
  optimal f* = p - q/b (or edge/odds).

  - It''s equivalent to expected utility maximization with log utility.

  - Asymptotic optimality: among strategies, Kelly achieves the maximal growth rate
  almost surely in the long run (Breiman 1961; also Kelly 1956). But it does not "dominate"
  — other strategies can have higher expected wealth at finite horizons, and there''s
  a tradeoff (more aggressive betting has higher E[W] but higher ruin risk).

  - The "you can''t beat Kelly" claim: In the limit, Kelly''s wealth grows faster
  than any essentially different strategy a.s. But you can construct strategies that
  beat Kelly with high probability over finite horizons (at the cost of a small probability
  of much worse outcomes). Also, "Kelly maximizes median" — approximately, yes.

  - The non-ergodicity argument (Peters, "The ergodicity problem in economics", Nature
  Physics 2019): multiplicative dynamics means time averages ≠ ensemble averages;
  the "expected value" of a gamble can be positive while almost every individual trajectory
  declines (e.g., the coin-flip multiplicative gamble with +50%/-40%). Peters argues
  this shows EV maximization is wrong and the correct criterion is time-average growth,
  which for multiplicative dynamics = maximize E[log]. Critics: this is just log utility;
  or it presumes you should maximize time-average growth; or it conflates the individual''s
  situation with the ensemble. Actually Peters'' point is precisely that for an individual,
  the time average is what matters. There''s a debate (e.g., responses arguing that
  ergodicity economics smuggles in a utility function, or that EV maximization is
  fine if you account for the right state space).

  - Fractional Kelly: betting less than full Kelly gives lower growth but lower variance;
  there''s an argument that with parameter uncertainty or model error you should bet
  fractional. Also "Kelly is optimal only if you''re maximizing growth and can bet
  indefinitely; for a single bet, log utility is a choice."

  - "Kelly bettor can''t be an EU maximizer" is false.


