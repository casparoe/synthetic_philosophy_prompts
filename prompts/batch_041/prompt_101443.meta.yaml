  The argument from illusion: the classic version — perceptual relativity, e.g., a
  straight stick looks bent in water; since in illusion we are directly aware of something
  that isn''t a real property of the object, and we can''t tell illusion from veridical
  perception by introspection alone, the immediate object of awareness is the same
  in both cases (a sense-datum). This motivates indirect realism / representationalism
  and threatens direct realism. Disjunctivism responds: veridical perception and hallucination
  are different in kind — the veridical experience is a relation to the world, the
  hallucination isn''t; they only seem indistinguishable.


