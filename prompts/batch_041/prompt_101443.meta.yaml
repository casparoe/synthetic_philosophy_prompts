  conflating illusion with hallucination; (3) thinking disjunctivism says hallucinations
  don''t exist or that you can always tell; (4) thinking the disjunctivist denies
  the epistemic problem (the "screening off" worry); (5) "if they''re indistinguishable,
  they must be the same" — the common-kind assumption; (6) confusing disjunctivism
  with naive realism simpliciter; (7) thinking "illusion" means "delusion" or "mistake."


