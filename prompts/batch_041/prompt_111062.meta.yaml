  Draft:


  "I spent most of a long dinner last week arguing with a friend who does complexity
  theory, and the argument has been nagging at me because it bears directly on how
  my team makes design decisions. I am the engineering lead at a mid-sized software
  company, and our design reviews have developed a bad habit: someone invokes NP-hardness,
  or the fact that a problem is NP-complete, and the room treats that as a conversation-stopper.
  My friend insists this is a category mistake—that a worst-case hardness result for
  a problem class tells us almost nothing about whether a particular structured, small,
  or average-case instance is solvable in the time we have, and that the reduction
  that establishes hardness may have nothing to do with the instances we actually
  care about. I agree in principle, but I also think it would be equally foolish to
  ignore complexity results altogether, and I do not have a way to tell my engineers
  when a hardness result should change a design and when it should merely shift the
  burden of proof."


  "What I want from you is a decision procedure my team can actually run in a thirty-minute
  design review, before we commit engineering months to a feature. Fix the role: the
  procedure is for a technically literate but not theoretically specialized engineering
  lead, with no complexity theorist in the room and no time to consult one. The procedure
  should be a checklist or flowchart in words, with the questions to ask in order,
  what counts as a sufficient answer to each, where the procedure stops with a no,
  and where it hands the decision to a person because the question has become one
  of values—how much we care about exactness, how much risk of poor scaling we can
  tolerate, what we owe users when the heuristic silently fails. It must distinguish
  at least three different appeals to hardness that my team currently conflates: a
  proof that no algorithm can do better in the worst case, a conditional hardness
  result that assumes P is not equal to NP, and an empirical observation that the
  algorithms we have tried scale badly. It should also say what to do when the relevant
  result is about approximation, parameterized complexity, or average-case behavior
  rather than exact worst-case solvability, and it should be honest about which steps
  are mathematical entailments and which are engineering or product judgments dressed
  up as procedure."


  "Then run the procedure on two proposals. First, an exact route-optimization feature
  for a delivery fleet, where the sales team has promised optimal routes and the operations
  team has about forty stops per route but wants the option to scale to several hundred.
  Second, a scheduling feature that reduces to a constraint-satisfaction problem with
  a few hundred variables, where the team is willing to accept an approximate or occasionally
  suboptimal schedule but wants a guarantee that the solver will always return something
  usable within two seconds. Include one application where the procedure gives an
  answer I will not like—perhaps telling me that the hardness result I have been using
  to reject a feature is irrelevant to the instances that matter, or that the exactness
  the sales team promised cannot be justified at any scale we are likely to see. End
  with a short, candid section on what the procedure cannot do: the questions it cannot
  answer, the cases where it will misfire, and the point at which my team simply has
  to run experiments rather than reason from complexity classes."


