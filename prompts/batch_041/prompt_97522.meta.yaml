  "A friend and I spent most of last night arguing about truth, and I came away holding
  a more deflationary position than I expected. I think truth is not a substantive
  property that explains why our beliefs succeed or why inquiry converges; the truth
  predicate is primarily a device for endorsing assertions and for expressing generalizations
  we could not otherwise state, and the whole content of calling a proposition true
  is given by the equivalence between asserting that it is true and asserting it.
  I am not a correspondence theorist, and I am not a coherence theorist; I take truth
  to be thin, and I suspect that much of the apparent depth in theories of truth comes
  from confusing the word with the property. What I want from you is not a survey
  of the literature but a map of this position''s exposure. What would count against
  it? Which arguments, intuitions, formal results, or developments should move me,
  and which are merely awkward? I am especially interested in the following: whether
  the truth predicate is indispensable for stating the correctness conditions of logical
  inference, whether a deflationary truth predicate can do the expressive work it
  is supposed to do in mixed inferences and blind ascriptions, whether the liar and
  Curry paradoxes show that the equivalence schema cannot be had in full generality,
  and whether truth''s normative role in inquiry -- the thought that we ought to believe
  what is true and that truth is the aim of assertion -- is something a deflationist
  can explain or only redescribe. Suppose someone shows that adding a truth predicate
  to a base theory yields new theorems about the original vocabulary, or that truth
  is needed to state the validity of arguments whose premises and conclusions mix
  object-language and truth-talk. Is that a decisive objection, a friendly extension,
  or a change of subject? I also want to know whether the view has been insulated
  by qualifications: if deflationists retreat to a theory of the truth predicate rather
  than of truth itself, or to a minimalist account that gives up on any explanatory
  role, does the position still deserve the name, or has it collapsed into quietism
  or expressivism? Tell me what a committed deflationist would themselves concede
  as counting against the view, not only what an inflationist critic would say. Rank
  the defeaters from fatal to merely awkward, and be honest if you think the position
  is well insulated and whether that is a problem. The thing I find most persuasive
  against my view is the sense that truth has a normative and explanatory role in
  inquiry that the equivalence schema seems to leave untouched, but I cannot tell
  whether that is a genuine defeater or just a rival idiom. Answer in continuous prose,
  with no headings, bullet points, bold text, or tables; write it the way you would
  write a long email."


