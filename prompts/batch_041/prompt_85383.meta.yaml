  Draft:


  "Please explain, as carefully as you can, a conceptual issue in the theory of diachronic
  rationality: what exactly a money pump shows, and what it does not.


  Take an agent who holds C and whose preferences cycle: she prefers A to B, B to
  C, and C to A, and these preferences are complete, stable, and otherwise unremarkable.
  She is offered, one at a time, trades of the form ''hand over the item you hold
  plus a penny, receive the item you prefer to it''. She accepts each trade, because
  each one is, at the moment it is offered, an improvement by her own lights; she
  ends where she began, three pennies poorer. Call this the sequential pump.


  I want an explanation of the following, in the order in which the issues depend
  on one another.


  1. What has to be true for the sequence of trades to be an objection to her preferences
  rather than merely a bad day? In particular, the argument seems to need a bridge
  from ''she can be made to lose'' to ''her preferences are irrational''. What are
  the candidate bridges, and what does each one presuppose?


  2. Suppose she is fully foresighted and knows the whole sequence in advance. Does
  the pump still work on her, and if not, what is the strongest form the argument
  can take against a foresighted agent? Consider in particular the proposal that the
  trades be offered not one at a time but as a single up-front package, and say whether
  that really removes the need for a naive agent or merely relocates the problem.


  3. She might adopt a policy: decide now to refuse every trade, and then, at each
  step, refuse a trade that she prefers at that moment. Is this the model of rationality
  (plan-sticking) or a form of irrationality (acting against her current preferences)?
  What does each verdict commit you to about whether rationality is, in any interesting
  sense, diachronic?


  4. One reply says the pump''s conclusion is not ''her choices are irrational'' but
  ''her preferences must be revised'', i.e., the argument establishes a constraint
  on what preference structures are admissible. What does this reply concede, and
