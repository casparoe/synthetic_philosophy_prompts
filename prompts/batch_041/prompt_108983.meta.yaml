  Draft:


  Last night I got into an argument with a friend that lasted until nearly 2 a.m.
  and that I am still not over. She works in philanthropy and is a committed user
  of the cause-prioritization framework: when deciding where to give, you score a
  cause on importance (how many people it affects, and how badly), tractability (how
  much progress a dollar can buy), and neglectedness (how few other resources are
  already going to it). I said the framework was a useful heuristic, not a master
  key, and she said that was exactly the kind of defeatism that leaves money on the
  table. Then she made an argument I can''t stop thinking about: if you apply the
  three criteria to the question of where to do cause-prioritization research, the
  answer is that cause-prioritization research itself is the most important, tractable,
  and neglected cause—and therefore the correct move is for a foundation to spend
  its entire budget on research into how to spend its budget. I told her that was
  a reductio; she said it was a portfolio. I want to commission a satirical piece
  that takes her position seriously enough to see where it actually leads.


  Please write a deadpan internal memo, about 750–850 words, from the Director of
  Portfolio Allocation at a fictional grantmaker called the Aster Foundation to its
  board of trustees, recommending that the foundation allocate its entire 2026 grantmaking
  budget to a new program of "cause-prioritization research"—that is, research on
  how to prioritize causes—rather than to any object-level cause such as global health,
  animal welfare, or existential risk. The Director should be entirely sincere, slightly
