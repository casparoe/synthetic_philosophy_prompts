  Draft:


  ---


  I am preparing a seminar on the ethics of asylum — specifically the two questions
  of who counts as a refugee and who is obligated to take them in — and I want to
  use Casablanca as the centrepiece of the session. What interests me is not the usual
  observation that the film is full of displaced people waiting for papers, but something
  more structural. I want you to read the film through the following pair of ideas,
  which I have found more useful than the standard legal categories.


  First, a claim about what the film''s plot actually turns on. Protection in Casablanca
  is allocated by what I would call an auction rather than by a right: the scarce
  goods — the letters of transit, exit visas, a place on a boat — go to whoever can
  pay in the currency the moment recognises, whether that currency is money, political
  usefulness, or personal connection. Nobody in the film appears to have a claim;
  they have leverage or they have luck. Rick himself begins from the position that
  he sticks his neck out for nobody and ends by giving away the one thing that could
  save him. Second, a contrast I want you to test against that: imagine a selection
  rule under which protection is distributed by lottery among everyone who presents
  themselves, on the grounds that any criterion of merit or usefulness allows the
  receiving state to pick the refugees it finds congenial or convenient, which is
  precisely what a right of asylum is meant to prevent. Call the three candidate rules
  the auction, the queue, and the lottery.


  The reason I want both ideas at once is that I think the film is split between them,
  and that the split is instructive. The climax resolves by something like the auction:
  Laszlo is a resistance leader whose survival matters to a cause larger than himself,
  and the film treats that as a reason. But the scene that does the most to make Rick
  sympathetic is one in which he rigs a roulette game so that a young Bulgarian couple
  can afford the exit visas they need — a lottery, in effect, but a lottery whose
  outcome is decided by the private will of a man who owns the table. I would like
  to know whether that is a genuine moral alternative or a fantasy of sovereign discretion,
  and whether the film knows the difference.


  So: give me a reading of Casablanca that takes both the film and the philosophical
  literature on asylum seriously. Where does the auction logic govern the plot, and
  where does the film resist it? What does the Bulgarian couple''s subplot do that
  the Laszlo plot does not — and does the film''s allocation of sympathy track any
  principled criterion at all, or only the criteria of Hollywood identification? Note,
  if you think it is relevant, that every refugee the film asks us to care about is
  European and most of them are educated or politically significant, while the Moroccan
  setting supplies the film with a population that is essentially scenery; tell me
