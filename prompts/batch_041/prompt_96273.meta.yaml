  happens to be coupled with, and the boundary between mind and world is therefore
  arbitrary — a notebook, a smartphone, or a search engine can be part of your mind
  just as a neuron can. The thesis is not that these things merely help us think;
  it is that they are part of the thinking, which is why it makes no difference in
  kind whether you remember a phone number or look it up."


