  The policy must impose a modest burden on each of a large number of people in order
  to avert a severe burden on a smaller number, and the numbers must be arranged so
  that no single burdened person has a complaint that is stronger than the complaint
  of any single person who would be spared, yet the total burden on the many is plainly
  greater. After the case, do the following: (i) state the policy, the affected parties,
  and the burdens precisely; (ii) explain why a Scanlonian who refuses to aggregate
  complaints must reject the policy; (iii) explain why a contractualist who permits
  aggregation of complaints across persons must accept it; (iv) identify the exact
  feature of the case that makes the two verdicts come apart, and say what happens
  if that feature is removed; (v) say how a defender of the anti-aggregation reading
  would try to show that the case is not really a counterexample. Open with the case
  itself, with no preface or restatement of this request."


