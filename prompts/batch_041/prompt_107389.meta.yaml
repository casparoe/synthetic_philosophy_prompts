  another for a wrong she is herself guilty of, lacks standing because her blame implicitly
  claims a moral authority over the other that she has no title to: she is in no position
  to set herself above the person she addresses.


  4. A victim of wrongdoing always has standing to blame the wrongdoer for it, even
  if the victim has committed the same kind of wrong against someone else. Having
  been wronged is itself a title to address the one who did it.


  5. Standing is not itself a moral reason. A hypocrite''s blame is not morally wrong;
  it merely misfires as an instance of moral address. The accusation may be perfectly
  true, and the wrongness of what the wrongdoer did is wholly unaffected by the standing
  of whoever points it out.


