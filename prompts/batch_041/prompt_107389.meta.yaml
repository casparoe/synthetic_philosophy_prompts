  I am assembling a position statement for a graduate seminar on moral responsibility,
  and before I circulate it I want to know whether the commitments I have written
  down actually fit together. Here is what I hold.


  1. Blaming is not merely an evaluative judgment about someone; it is an address,
  a demand for accountability that presents the wrongdoer as answerable to the blamer.
