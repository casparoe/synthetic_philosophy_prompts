  Prompt:


  For the last few weeks I have been trying to write a seminar paper for a course
  on the philosophy of the arts, and I keep getting stuck on a disagreement with a
  friend of mine who directs for a small opera company. The disagreement is about
  what the relationship between music and drama in opera is supposed to be. My friend
  holds what I take to be the classical Wagnerian integrationist ideal: an opera is
  a single unified artwork in which music and text jointly deliver one coherent dramatic
  content, so that wherever the music and the libretto pull apart — a character whose
  music sounds serene while the words confess a betrayal, a finale whose musical shape
  is satisfying but whose plot is a dead end — something has gone wrong, and a good
  composer or a good production would repair it. He also likes to say, and I think
  this is a slightly different principle smuggled in under the same label, that music
  which merely restates what the words already state is dramatically redundant, and
  that music earns its place only by adding something the words lack. I have been
  trying to reconstruct the opposing position, which I associate with Bernard Williams''s
  occasional writings on opera, though I am probably mangling it: on that view the
  music of an opera is not a vehicle for the drama at all but has expressive capacities
  the drama lacks, so that the friction between the two is constitutive of the art
  form rather than a defect in it, and to judge an opera by dramatic standards alone
  — coherence of plot, consistency of character, plausibility of motivation — is a
  kind of category mistake.


  I would like you to compare these two positions. First, do they genuinely contradict
  one another, or do they differ only over what is to count as the drama? If the integrationist
  widens the notion of dramatic content to include whatever the music expresses, the
  dispute threatens to become terminological, and I would like to know whether you
  think it can be kept substantive, and what would settle it. Second, construct a
  type of case in which the two views yield opposite verdicts about whether some moment
  or work is good, and explain what makes the case discriminating rather than merely
  illustrative; the paper keeps threatening to turn into the sort of thing where both
  views are said to capture something important, which I want to avoid. A moment I
  have been using is a scene from an invented two-act chamber opera in which a dying
  woman''s last monologue is set to music of great serenity while the text is a list
  of ordinary domestic grievances, but you should feel free to replace it with a better
  one. Third, tell me which position you find more defensible and give the strongest
  consideration on the other side its due. Fourth, ask whether there is a version
  of integrationism that survives, say one that demands unity of overall effect while
  permitting divergence of content, and whether that version is stable or collapses
  back into one of the original two. Finally, since I am also supposed to say something
  about performance, note what each view implies for a singer or director: if the
  music already expresses what a character cannot say, should the performer act the
  emotion the music supplies, or play against it? You need not cite any literature;
  I am after the argument, and I would rather you told me where my framing of the
  two positions is confused than padded the answer with references.


