  guy) have made this the centerpiece, though I''m told the phrase dichotomy of control
  is basically Irvine''s coinage and not something you''d find in the Greek.


  My friend''s argument:


  (1) A thing is up to me only if it is not the causal product of anything outside
  me.

  (2) My judgments, impulses, desires, and aversions are all causal products of my
  character, my upbringing, my mood, my body — none of which are up to me.

  (3) So by (1) and (2) nothing in the first category of the dichotomy is actually
  up to me.

  (4) Epictetus is a determinist anyway (Chrysippus''s fate, the cylinder that rolls
