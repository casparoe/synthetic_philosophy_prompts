  "I am a third-year philosophy student currently enrolled in a course on philosophy
  of mind and cognitive science, and I serve as the student representative on my university''s
  Access and Accommodations Review Board. The Board has to decide, at its meeting
  this Friday, a case that has divided us, and I have been asked to circulate a short
  written opinion before the vote.


  The case: a student with a documented episodic-memory impairment requests permission
  to use, during closed-book in-person exams, a wearable device running a custom retrieval
  system. The device is not connected to the internet. It contains only the student''s
  own lecture notes, annotations, and previously solved problem sets, indexed by the
  student''s own associations. It responds to subvocal queries by surfacing relevant
  entries and, when asked, paraphrasing them in its own words. The student says the
  device does not add new information; it returns only what the student has already
  studied, but does so at a speed and reliability the student''s unaided memory cannot
  match. Our policy allows assistive technology that compensates for a disability
  and forbids unauthorized aids that give an unfair advantage. The Board''s chair
  has proposed adopting what she calls the Functional Integration Standard: an external
  resource counts as part of a student''s cognition, and so as an accommodation rather
  than an aid, when it is reliably coupled, automatically endorsed rather than consciously
  consulted, and recruited by the student''s own reasoning. A rival group favors the
  Internal Benchmark Standard: accommodations may restore performance only up to a
  baseline measured without external storage, because anything beyond that is enhancement
  and cannot be separated from cheating.


  Please draft the memo I will circulate. It should recommend a concrete decision—grant,
  deny, or grant with conditions—and specify a time frame and any conditions the Board
  can actually administer. It should apply the Board''s existing categories rather
  than inventing a new policy from scratch, though it may propose a narrow clarification
