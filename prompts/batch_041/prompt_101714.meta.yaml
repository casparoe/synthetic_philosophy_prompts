  problem, (4) an ML safety person who thinks this is just OOD detection with extra
  steps. Objections: what is the individuation criterion for mechanisms (grain problem),
  whether "different mechanism, same behavior" is well-defined, the reference class
  problem (anomalous relative to what distribution?), whether the concept is doing
  work beyond OOD/novelty detection, whether you can ever observe "the mechanism"
  rather than an approximation, counterfactual vs actual, the problem of multiple
  realizability, whether "anomaly" is a property of the model or the observer, etc.
  And the question the speaker hopes nobody asks: e.g., "if your detector is itself
