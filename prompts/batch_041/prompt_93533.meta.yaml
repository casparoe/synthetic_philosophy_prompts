  I think a strong option: Brexit referendum (or the 2016 referendum) analysed through
  the Condorcet Jury Theorem — where the model must map voters as jurors, discuss
  independence (correlated error through campaign messaging), competence (better-than-chance),
  and the "many voters" result. And the theory breaks in interesting ways: the CJT
  assumes a binary correct/incorrect answer, but referendums ask a question with no
  fact of the matter; the independence assumption fails catastrophically under a shared
  campaign; the "competence" assumption is about judgement not preference; and the
  CJT is about aggregating beliefs, not preferences, so it has nothing to say about
  the legitimate aggregation of conflicting interests. Also the size effect: larger
  electorates amplify competence only if competence > 0.5, otherwise they amplify
  error. That''s a genuinely rich analysis and the model can do it without searching.
  The facts about Brexit are common knowledge.


