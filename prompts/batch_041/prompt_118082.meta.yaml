  Then the philosophical commitments: what theory of the market''s epistemic authority
  does this presuppose? That prices aggregate dispersed private information efficiently;
  that the market''s "opinion" is a reliable belief-forming process; that a price
  change is evidence of what traders believed. The no-trade theorem says that with
  common priors and common knowledge of rationality, no trade on purely informational
  grounds; so the informativeness of prices must come from heterogeneous priors/private
  beliefs, disagreement, or noise/liquidity. So the legal practice presupposes a picture
  of markets as information aggregators that the no-trade literature shows is not
  automatic — it needs disagreement, and disagreement itself is epistemically suspect
  from a Bayesian standpoint (one of us must be wrong; there''s no "rational" disagreement
  under common priors). So the question: does the practice presuppose a common-prior
