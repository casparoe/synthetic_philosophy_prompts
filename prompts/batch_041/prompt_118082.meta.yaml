  No-trade theorem (Milgrom & Stokey 1982): If agents have a common prior, are risk-neutral-ish
  / have identical... actually the assumptions: common prior, common knowledge of
  the information structure and of rationality, and the initial allocation is Pareto
  efficient (no gains from trade from risk-sharing or liquidity). Then no trade occurs
  at equilibrium prices that are common knowledge. More precisely: if a price is common
  knowledge and everyone is rational and shares a prior, then the price can''t reveal
  information that makes anyone want to trade — so no one trades. The intuition: if
  I know you''re willing to sell at price p, and we share a prior and I know you''re
  rational, then your willingness to sell tells me something that makes me not want
  to buy. Trade requires either disagreement (heterogeneous priors), or non-informational
  motives (liquidity, hedging), or the trade itself revealing something.


  Aumann''s agreement theorem: if two agents have common priors and their posteriors
  are common knowledge, then their posteriors are equal. So common knowledge of disagreement
  is impossible under common priors.


  So the practice of reading prices as information presupposes either heterogeneous
  priors (disagreement) or that prices move for reasons unrelated to information —
  or that information enters through some non-rational mechanism. And the legal "fraud
  on the market" doctrine needs prices to reflect information quickly. So the practice
  presupposes a Hayekian "knowledge aggregation" picture that is hard to reconcile
  with the Bayesian picture, unless you accept heterogeneous priors — in which case
  the price is an average of opinions, and its epistemic status is that of a vote,
  not a truth-tracker. That''s the tension. Also: if traders have heterogeneous priors,
  then the price depends on the distribution of prior opinions, not on truth; and
  there''s no guarantee the "crowd" is wiser than an individual — the "wisdom of crowds"
  requires independence and unbiased errors, but in a market, traders are correlated
  and strategic.


