  Background: For decades there has been a running dispute about whether cultural
  change is properly described as a Darwinian process, and it has not moved. One camp
  treats cultural change as genuinely Darwinian: cultural variants are transmitted
  between people with enough fidelity to support heritable variation, some variants
  are transmitted more than others, and the resulting dynamics can be modeled with
  the tools of population genetics — cumulative cultural adaptation falls out. The
  other camp insists culture is not replicated but reconstructed: what passes between
  people is a partial cue that each learner rebuilds using their own priors, so transmission
  is systematically biased toward certain forms, and the explanatory action lies in
  those cognitive biases and the resulting ''attractors'' rather than in populational
  selection. The two camps cite the same ethnography and the same experiments and,
  as far as I can tell, agree on the facts of how transmission actually works.


