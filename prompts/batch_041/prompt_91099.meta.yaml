  Domain: Szasz and the myth of mental illness. Exam question:


  "Thomas Szasz argued that mental illness is a myth. (a) Reconstruct the strongest
  version of his argument, distinguishing the claim that mental illness is not a disease
  from the claim that mental distress is not real. (b) Explain how his view bears
  on involuntary psychiatric commitment. (c) Give one serious objection from the standpoint
  of contemporary psychiatry or philosophy of medicine, and say whether the objection
  lands against the strongest version or only a weaker one."


  Student answer:


  "Szasz''s main target was the idea that mental illness is a disease in the same
  sense that cancer or diabetes is. His argument is that diseases are defined by physical
  lesions or bodily malfunctions, and since no consistent lesion has been found for
  most psychiatric diagnoses, they are not diseases. He doesn''t deny that people
  suffer; he calls these problems in living, which are moral and social troubles rather
  than medical ones. That''s why he was against involuntary commitment: if there''s
  no disease, the state can''t legitimately lock someone up for treatment. He was
  also a critic of the insanity defense for similar reasons. A contemporary objection
  is that this is too narrow a picture of disease. Psychiatry has good evidence that
  schizophrenia and bipolar disorder have biological components, and the DSM has moved
  toward dimensional and neurobiological criteria. Also, Szasz''s view is a form of
  labeling theory, like Scheff''s, which says mental illness is just a label for deviance.
  So while Szasz was right to worry about coercion and the expansion of psychiatric
  power, his blanket claim that mental illness is a myth is outdated because we now
  have biomarkers for many conditions. The strongest version of his argument survives
  for things like grief or unhappiness, but not for serious mental illness."


