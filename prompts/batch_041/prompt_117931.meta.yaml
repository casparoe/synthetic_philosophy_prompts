  answer, is that Glaucon''s challenge gets its force from a mistaken picture of practical
  reason as a private cost-benefit calculation. On her account, moral reasons are
  not external constraints that a rational agent might opt out of when the ring of
  Gyges removes the sanctions; they are reasons that exist only within a practice
  of mutual accountability. The ring of Gyges does not reveal what we would do without
  morality; it reveals what happens to the normative situation when the possibility
  of answerability is removed. She argues that the challenge therefore cannot be answered
  by showing that justice is instrumentally rational or by appealing to the agent''s
  own interest in integrity. Instead, the answer is that the question why be moral
  is malformed when asked by an agent who has stepped entirely outside the second-personal
  standpoint. She also claims that this view avoids the standard objections to social-accountability
  theories because it does not reduce moral reasons to actual social approval; the
  relevant practice is idealized, but not in the way that ideal-observer theories
  are."


