  Activity: "The Petersburg Exchange." Participants: 20-24 students. Time: 80 minutes.
  Materials: tokens (or points), slips, a spreadsheet, a coin or random number generator,
  a visible payoff table. Rules:

  - Each participant starts with 60 tokens.

  - The lottery: a fair coin is tossed until the first tail. If the first tail occurs
  on toss n, the payoff is 2^n tokens. (So n=1 payoff 2, n=2 payoff 4, n=3 payoff
  8, etc.) Expected value is infinite.

  - Phase 1 (15 min): in groups of four, calculate the expected value of the lottery
  and of a truncated version capped at n=10. Also compute the probability of payoff
  at least 64, at least 256, etc. They report.

  - Phase 2 (15 min): sealed-bid auction. Each student writes down the maximum number
  of tokens they would pay for one ticket. The highest bid wins; ties broken by random
  draw. Winner pays their bid and receives one play of the lottery. But before the
  lottery is played, Phase 3.

  - Phase 3 (15 min): resale market. The winner is given the ticket. Then everyone,
  including the winner, submits a sealed bid for the ticket in a second auction. The
  highest bidder pays the second-highest bid? Or first-price? To avoid complexity,
  second-price auction. The winner of the first auction can sell if the second bid
  exceeds a minimum. Actually if second-price, the seller receives the second-highest
  bid, and the buyer pays the second-highest bid. This creates a market price. Then
  compare the price the winner was willing to pay (first bid) with the price they
  are willing to accept (if they were seller, their reserve). This can reveal inconsistency.

  - Phase 4 (10 min): play the lottery publicly. Pay off. Most likely payoff is small.

  - Debrief (25 min): map to the paradox. Discuss: (1) the mathematical fact: infinite
  expected value; (2) the decision-theoretic responses: expected utility with diminishing
  marginal utility, bounded utility, probability weighting, risk aversion, rejecting
  expected value maximization; (3) the psychological and market phenomena: endowment
  effect, ex post regret, the difference between EV and typical outcome; (4) the philosophical
  issue: does rationality require maximizing expected value? What does the paradox
  show about the concept of expected value? (5) the in-the-weeds point: the St. Petersburg
  game is a case where the expected value is infinite but the lottery is not "worth"
  infinite in any ordinary sense; the paradox is not just about money but about the
  completeness of preference orderings and the St. Petersburg game as a counterexample
  to the expected utility representation.


