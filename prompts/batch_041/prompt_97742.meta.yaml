  I am designing a 90-minute session for a 20-person undergraduate seminar in decision
  theory and philosophy of probability. I want a runnable activity that makes students
  feel the St. Petersburg paradox rather than hear it described. The activity should
  have three stages: (1) a calculation stage in which groups derive the expected value
  of two lotteries, both with divergent expected value but different tail behavior;
  (2) a market stage in which each student bids tokens for a single ticket to play
  one of the lotteries, and the winner can then resell the ticket in a second sealed-bid
  auction; (3) a play stage in which the winning ticket is resolved publicly and payoffs
  are made in tokens with no cash value. Do not name the paradox until the debrief.


  The first lottery should be the standard doubling lottery: a fair coin is tossed
  until the first tail, and if the first tail occurs on toss n, the payoff is 2^n
  tokens. The second lottery should have a heavier tail: if the first tail occurs
  on toss n, the payoff is 2^{2^n} tokens. Both have infinite expected value. Students
  should calculate both, then discover that expected value maximization gives them
  no basis for choosing between them, even though they will have a strong preference.
  The market stage should force them to put a finite price on each ticket, and the
  resale stage should reveal whether their buying and selling prices are consistent.


