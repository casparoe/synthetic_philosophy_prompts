  Best combination with "present someone''s summary and ask whether it''s fair": Descartes
  on animal minds is a classic where summaries are often wrong (the "animal machine"
  doctrine, the bête-machine, the automaton view, the claim that animals feel nothing
  — often overstated; Descartes'' actual claims are subtler: he denied thought/soul,
  but his remarks on the passions, the fact he says animals have no sensations? Actually
  Descartes in the Discourse says animals lack reason, and in letters to More (1649)
  he says animals lack thought, and he says they have no "awareness" — but the question
  of whether they feel pain is more contested; some scholars (e.g., Cottingham, Harrison)
  argue Descartes did deny animal sensation; others (e.g., John Cottingham''s "A Brute
  to the Brutes?") argue he only denied thought). This is a good "summary is unfair"
  case: a competent popularizer could overstate the bête-machine view.


  Alternative: rigid designators and necessary a posteriori — a textbook gloss that
  says "Kripke says identity statements are necessary but known a posteriori, which
  means there are necessary truths we discover empirically, so the analytic/synthetic
  distinction is dead" — with conflation of epistemic/metaphysical, and "rigid designator
  = a name that has no meaning" etc. That''s also a great fairness-audit target with
  subtle errors.


