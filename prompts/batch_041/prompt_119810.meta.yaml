  Let''s outline prompt:


  "I''m not an academic, just someone who reads too much and thinks in the shower,
  and I''ve got stuck on the 2007 run on Northern Rock. I know the basic story: the
  bank had lent long and borrowed short in the wholesale markets, it got into trouble
  when those markets froze, it went to the Bank of England for emergency support,
  the news got out, and then queues formed outside branches — the first proper bank
  run in this country for ages. The government ended up guaranteeing deposits to stop
  it. What I want is not another account of the financial mechanics. I want you to
  treat the whole thing as a game in the sense of epistemic game theory, where the
  key thing is not just what each depositor knows but what they know about what other
  depositors know, and what they know about what others know they know, and so on.
  So: who are the players? What are the strategies? What are the payoffs? What does
  common knowledge of rationality predict should happen? And then where does the actual
  episode diverge from the prediction? I''ve been chewing on an idea I can''t quite
  make precise: that common knowledge isn''t only a logical fixed point you can build
  up from everyone''s rationality. It can be produced by public events. A queue outside
  a branch is a public event. A news report is a public event. Maybe the run wasn''t
  a failure of common knowledge; maybe it was a success of it, a horrible one — everyone
  came to know that everyone knew that everyone was frightened, and that knowledge
  itself changed the payoffs. But then I wonder if that means the theory has to change,
  because the thing that became common knowledge wasn''t just the bank''s solvency
  but other people''s fear. Also, what about the almost-common-knowledge case? If
  each depositor has even a tiny doubt, and everyone knows everyone has a tiny doubt,
  does the whole tower of knowledge collapse? Does that explain why a small piece
  of bad news could trigger a full run? And what does the episode show about the limits
  of the theory — does it miss the role of the media, the queues, the deposit guarantee,
  the fact that people aren''t cold calculators, or the fact that the bank''s balance
  sheet is a public object? I want the analysis to run both ways: the theory illuminating
  the episode, and the episode testing the theory. Tell me what the theory explains
  well, what it has to stretch to cover, and where it''s just silent. And at the end,
  say how confident you are in the overall analysis and single out the one point you''re
  least sure of."


