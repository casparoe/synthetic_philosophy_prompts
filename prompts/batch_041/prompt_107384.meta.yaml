  Domain: Two-dimensional semantics.


  Question: "Explain the distinction between primary and secondary intensions in two-dimensional
  semantics, and assess whether the framework vindicates modal rationalism—the thesis
  that metaphysical necessity is coextensive with a priori knowability. Use ''water
  is H2O'' and ''Hesperus is Phosphorus'' as examples. In your answer, say clearly
  what role the two dimensions play in each example, and address at least one objection
  to the rationalist reading."


  Student answer (we write):


  "Two-dimensional semantics is a framework for representing meaning by assigning
  each expression a two-dimensional matrix of extensions. The primary intension of
  a term is a function from centered worlds—worlds with a marked center, often a speaker—to
  extensions. The secondary intension is a function from possible worlds to extensions,
  where the actual world is held fixed in the relevant way. For ''water,'' the primary
  intension picks out the watery stuff in each centered world: in a world where the
  clear, drinkable liquid is XYZ, ''water'' picks out XYZ. The secondary intension
  picks out H2O in every world, because it is fixed by the actual world''s watery
  stuff. So ''water is H2O'' is a posteriori necessary: its primary intension is contingent,
  but its secondary intension is necessary. For ''Hesperus is Phosphorus,'' the primary
  intension of ''Hesperus'' picks out the evening star and the primary intension of
  ''Phosphorus'' picks out the morning star; the secondary intensions of both pick
  out Venus. So the identity is a posteriori necessary. Modal rationalism says that
  metaphysical necessity is coextensive with a priori knowability. Two-dimensional
  semantics supports this because the primary intension of a necessary statement is
  a priori knowable, and the secondary intension is necessary. Thus, for any necessary
  statement, we can know its primary intension a priori, which gives us a priori access
  to its necessity. So ''water is H2O'' is a priori knowable after all, once we distinguish
  the two dimensions. The main objection is that this conflates semantic necessity
  with epistemic apriority; but the two-dimensional framework answers it by showing
  that the primary intension is the epistemic dimension and the secondary intension
  is the metaphysical dimension. Therefore, two-dimensional semantics vindicates modal
  rationalism."


