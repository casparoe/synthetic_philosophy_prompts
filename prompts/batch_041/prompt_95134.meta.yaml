  I hold no formal training in philosophy — I write software for a living — and I
  have been trying to understand G. E. M. Anscombe''s protest against Oxford''s decision
  to award Harry Truman an honorary degree in 1956, on the ground that he had ordered
  the atomic bombings of Hiroshima and Nagasaki. I would like to know whether my reading
  of her objection is defensible, because it strikes me that the objection must have
  been a historical claim rather than a moral one.


  My reasoning runs as follows. Everyone who defends the bombings argues about consequences:
  whether the bombings shortened the war, how many casualties an invasion of the Japanese
  home islands would have cost, whether Japan was already attempting to surrender.
  Those are empirical questions of the kind historians settle with documents. Anscombe''s
  objection, as it is usually reported, was that the bombings were not necessary —
  that they did not accomplish what they were supposed to accomplish. It follows,
  I think, that her objection was itself an empirical claim of exactly that kind,
  and that if the historical verdict went the other way, and the bombings really did
  save more lives than they cost, her objection would simply collapse. On that reading,
  calling Truman a murderer is a rhetorical way of saying that he made a bad call
  on the available evidence.


  A colleague who studied philosophy pushed back. He offered a hypothetical: a commander
  who deliberately targets a city full of civilians because it is the only means he
  can see of ending a war that will otherwise kill ten times as many people. My colleague
  says Anscombe''s position requires her to call that commander a murderer as well,
  regardless of the arithmetic, and that this shows the position is monstrous. I suspect
  he is right about what her position implies, which is what makes me doubt my own
  reading of it.


  In my own work we distinguish between the objective function a system is optimizing
  and the hard constraints imposed on it, and I cannot tell which of those her objection
  was meant to be — or whether the distinction is even the right one to bring to her.


