  Draft:


  I chair the grants committee of a small foundation that funds experiments in work-time
  reduction. Before us is a proposal for a three-year pilot: two hundred low-income
  workers in a mid-sized city would move to a twenty-five-hour week at full pay, with
  the freed hours left entirely to their own choosing. The proposal''s stated rationale
  is to test whether material sufficiency plus expanded leisure can produce the good
  life that Keynes envisioned when he predicted that economic abundance would eventually
  force us to confront the question of how to use our freedom well. I am sympathetic
  to the pilot, but I suspect it may be testing the wrong thing. Keynes''s vision
  was not merely that people would have more free time; it was that they would cease
  to treat wealth as an end in itself and would cultivate art, friendship, and the
  enjoyment of life. A pilot that simply pays people for fewer hours may end up measuring
  consumerism, status competition, and screen time rather than the good life. At the
  same time, I can see the force of the objection that any attempt to condition the
  pilot on a particular conception of the good life would be paternalistic and would
  betray the very freedom the experiment is meant to study. Draft the committee''s
  decision memo. Recommend whether to fund the proposal as submitted, reject it, or
  fund it with conditions. Engage seriously with the strongest argument on the losing
  side. Give a definite recommendation and the reasons for it.


