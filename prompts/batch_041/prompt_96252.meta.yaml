  and it shows. A third: a doctor tells a patient that the recovery will go better
  if the patient believes it will, and the belief will not form on those grounds.
  My colleague''s summary is that you cannot do a thing well while holding the reason
  for doing it up in front of you, but that seems both too broad (holding the reason
  up seems fine for filling out a tax return) and too narrow (in my cases the damage
