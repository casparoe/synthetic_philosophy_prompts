  stuff is a variation. A composer writing a new piece is twiddling knobs on the tradition
  they inherited; a mathematician proving a new theorem is twiddling knobs on the
  axioms and definitions. The knobs can be higher-order -- you can twiddle the knob
  that decides which knobs are available. So ''it''s just variation'' isn''t a debunking,
  it''s a description of the mechanism.


