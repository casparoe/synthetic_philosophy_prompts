  should track responsibility. Requires defining responsibility — in the weeds.

  5. Instrumental reading: equal opportunity is what *produces* good outcomes (efficiency,
  growth, allocation of talent).

  6. The "not outcome" clause as a normative claim: outcome equality is unjust because
  it requires treating people unequally / violating liberty / ignoring desert.

  7. The "not outcome" clause as an empirical claim: outcome equality is unachievable
  / self-defeating (leveling down, incentives).

  8. The "not outcome" clause as a claim about what is politically feasible.

  9. The claim that concern for outcomes is a claim about *the shape of the distribution*,
  which equal opportunity cannot avoid because opportunity is itself distributed.

  10. The conceptual point: "opportunity" is an essentially relational good — equal
  opportunity for what? The "what" is an outcome.

  11. The reading on which the slogan is vacuous: nobody defends "equality of outcome"
  as such; the contrast is a strawman; what people who care about outcomes want is
  a floor plus limits on the top.

  12. The reading on which the slogan is about the *subject* of equality: not individuals
