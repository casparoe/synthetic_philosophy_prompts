  Design sketch for the famine activity:


  Setting: I teach a "big questions"/humanities elective at a community college; 18
  students; one 90-minute session. Or a high-school current-affairs club, 75 minutes.
  The asker has been reading about famines on their own and is bothered by the phrase
  "natural disaster."


  Activity: "The district of ..." — a fictional region. Participants are divided into
  roles: 4 large farmers, 6 smallholders, 4 landless labourers, 2 shopkeepers/traders,
  1 moneylender, 1 district officer. Each has: a stock of grain, cash, a wage, obligations.
  A harvest shortfall of, say, 15% is announced (not catastrophic — that''s the point).
  Then a market: a trading session where grain can be sold, prices set by what people
  will pay; outside buyers (a city, an army) bid. Participants must survive a set
  number of "months" (rounds); each round they need X units of grain to live. Death
  = you can''t buy enough. The trader roles profit by shipping grain out of the district.


  Key mechanic to inject: the price is not fixed; it''s set by the buyers'' willingness
  to pay, so when the army''s procurement agent buys at any price, prices rise above
  what labourers can afford. So the famine emerges from the market''s response to
  purchasing power, with enough grain in the district. Then a debrief: the class reconstructs
  what killed people — not the 15% shortfall but the collapse of the labourers'' ability
  to command food; the question of what the district officer could have done (relief
  works, price controls, requisition, bans on export, free press); and the political-crime
  framing.


  Also: an injection of a "second run" where one rule changes (e.g., the district
  officer has a budget and a mandate to feed anyone who shows up — or a newspaper
  exists). Compare outcomes. That is the "control" that shows it''s political.


