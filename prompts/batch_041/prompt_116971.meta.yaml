  e.g., players are paired with someone who has the same "reasoning profile" — determined
  by a quiz — and play a one-shot PD with no communication; then compare with a version
  where players know the partner''s identity is chosen by matching answers. Also the
  "Platonia" / "everyone in the room plays the same strategy" element. Superrationality
  is a bit niche in the sense that small LLMs may know Hofstadter''s "Dilemma of the
  Prisoner''s Dilemma" — probably fine, but the activity is the point.


  - Units of selection: could design a game — e.g., a "foraging" simulation with groups
  of players, where within-group and between-group selection conflict; participants
  play as "individuals" in demes with migration; the multilevel selection partition
  (Price equation) can be felt. That''s a nice game: groups compete, individuals compete
  within groups, and the parameter that shifts the balance is group size / migration
  rate. The "injected niche idea": the idea that group size and migration rate determine
  whether altruism spreads — participants can literally vary the number of rounds
  of within-group vs between-group competition. Also could inject the notion of "the
  veil of ignorance over which unit you''ll be" — that''s a nice trick: players don''t
  know whether they''ll be scored as individuals or as groups. Hmm, that''s neat:
