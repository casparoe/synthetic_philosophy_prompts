  interiors as though they had a key to the room, or they retreat into a defensive
  behaviourism in which characters do nothing but smoke and look out of windows, and
  the middle ground — building a person''s inner life out of what that person says
  and does, and out of what everyone else can see — gets lost.


  At a dinner last month a friend who teaches philosophy of mind asked me why novelists
  never borrow from the science of consciousness, and she described to me Daniel Dennett''s
  heterophenomenology, which she said is the standard third-person method in the field
  and which I have since read about on my own. As I understand it: you treat everything
  the subject says as a text, a set of utterances to be interpreted rather than a
  transparent window on the mind; you take those utterances seriously and completely,
  so that the subject is treated as authoritative about how things seem to them, but
  you suspend judgment on whether things are as they seem; you bracket the metaphysical
  question of what the inner life is really made of rather than answering it either
  way; and you bring in every other available source — behaviour, physiology, the
  setting, what the subject cannot have known — to build up the picture of the world
