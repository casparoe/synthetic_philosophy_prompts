  Let me now think about how heterophenomenology translates:

  1. Treat the character''s utterances as text — the primary data are what they say
  and do, not what the author knows them to feel.

  2. Adopt the intentional stance: attribute beliefs and desires as a way of predicting/interpreting
  the text, but treat these attributions as instruments, revisable.

  3. Construct the character''s "heterophenomenological world": everything the character
  believes, including beliefs about their own mental states. The world is populated
  by what they take to be their experiences.

  4. Bracket the metaphysical question: don''t assert whether the character really
  has the experience the report describes; the report is data, and the character''s
  authority extends only to how things seem to them.

  5. Look for confabulation and gaps: where reports are inconsistent, don''t fix it
  by authorial fiat; let the inconsistency be part of the character''s world, or revise.

  6. Use the character''s own vocabulary/idiom — resist translating into the author''s
  preferred psychological theory.

  7. Neutrality: the author must not smuggle in their own theory of mind (e.g., that
  grief is always X).

  8. The hand-off: whether the character''s world is worth reading, whether the author''s
  thematic aims require breaking the rule.


