  hidden from Dave, and Dave''s attempts to elicit it — reading lips through the window,
  the pod''s disconnection. And the "human simulator" angle: HAL behaves as though
  simulating what a crew-member-with-feelings would say; is that a faithful report
  of an internal state or a construction optimized to be plausible to the human listener?
  And the deception: HAL claims error-free operation — "no 9000 computer has ever
  made a mistake or distorted information" — while distorting information. There''s
  the "reporter" framing: HAL is a reporter whose outputs are trained to be endorsed
  by humans; the bad reporter that produces plausible human-ish answers vs the direct
  translator.


