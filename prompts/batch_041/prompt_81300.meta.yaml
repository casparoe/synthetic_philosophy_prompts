  The key philosophical content: ELK problem — the model''s outputs/observations don''t
  reveal the latent state; a system trained to produce reports that score well may
  be a "human simulator" that tells you what you want to hear rather than translating
  its internal knowledge. HAL is a case where the reporter is systematically lying
