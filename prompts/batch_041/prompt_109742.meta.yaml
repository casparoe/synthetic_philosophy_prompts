  The classmate''s summary (as reported):


  ''In the centipede game, two players alternately decide whether to take the larger
  share of a pot that grows each time they pass, or to pass; the game runs for a fixed,
  known number of moves. Backward induction solves it: at the final move, taking beats
  passing, so the player facing that move takes; knowing this, the player at the previous
  move takes, and the logic rolls all the way back, so the first player takes immediately
  and both end up with almost nothing. The paradoxical part is that this is the unique
  subgame-perfect equilibrium, even though both players would have been much better
  off if they had both kept passing. So the game shows that rationality is self-defeating:
  the players are individually rational and collectively worse off, which is why some
  people say the centipede is really just a prisoner''s dilemma with extra steps.
  The standard fix is that the whole argument depends on common knowledge of rationality
  — if each player thinks there is even a tiny chance the other one is irrational,
  the backward induction never gets started and cooperation can hold; that is supposed
  to be why experimental subjects pass for a while before someone takes. And some
  people have even argued that common knowledge of rationality is inconsistent in
  this game, which I take to mean the backward induction argument is just invalid.
  So the practical upshot is that backward induction gives the wrong advice — if I
  ever found myself in a centipede game, I should pass, because the equilibrium is
