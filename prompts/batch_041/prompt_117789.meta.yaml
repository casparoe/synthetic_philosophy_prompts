  Good in-the-weeds material for Dutch books:

  1. The "depragmatized" Dutch book argument (Skyrms, Christensen): the betting odds
  are just a representation of preference; the argument shows that agents who violate
  the probability axioms have inconsistent preferences over a set of contracts.

  2. The "loss is not guaranteed" objection: the Dutch bookie needs the agent to accept
  each bet, and the agent''s acceptance depends on their credences; a clever agent
  with non-probabilistic credences might have preferences that change as the bookie''s
  strategy unfolds — the "money pump"/"dynamic Dutch book" literature.

  3. The "value of the stakes" / diminishing marginal utility / risk aversion problem
  — Dutch books presuppose risk-neutrality or that utility is linear in money. Actually
  the standard fix: use "units of utility" not money.

  4. Hájek''s "Dutch Book arguments" SEP entry. Also Hájek''s "Scotching Dutch Books?"
  (2005) — a genuinely in-the-weeds piece. Also "Dutch Book Arguments" in the SEP.

  5. The "non-pragmatic" justification: accuracy-dominance arguments (Joyce 1998,
  "A Nonpragmatic Vindication of Probabilism"), and the subsequent literature showing
  that accuracy-dominance fails for some non-probabilistic credences... actually Joyce
  showed any non-probabilistic credence is accuracy-dominated by some probabilistic
  credence *given a set of partitions*; then Pettigrew''s "Accuracy and the Laws of
  Credence", and the "Bronfman/Pettigrew" stuff. Also the "local vs. global" accuracy
  dominance debate.

  6. The "Dutch book argument for conditionalization" (Teller, Lewis) and the "diachronic
  Dutch book" — and the objection that diachronic Dutch books don''t show irrationality
  because the agent may not be able to foresee her future betting dispositions, etc.

  7. The "Dutch book argument for countable additivity" — fails: there''s a Dutch
  book against countably additive... Actually there are Dutch book arguments for finite
  additivity but countably additive probability has issues (the "Dutch book argument
  for countable additivity" fails because you can''t pump a bookie with infinitely
  many bets — de Finetti''s point).

  8. The "no-Dutch-book theorem" and the "Dutch book argument for reflection" / "principle
  of reflection" (van Fraassen''s "Belief and the Will").

  9. The "market-making"/"bookie" vs "betting against yourself" version.

  10. Objection: the Dutch book argument only establishes *consistency requirements
  on betting quotients*, but the claim that degrees of belief are betting quotients
  is an extra premise (the "behaviorism" objection). Also the "Ramsey/de Finetti"
  operationalism.

  11. The "no-loss" vs "sure-loss" distinction, and the "if you''re irrational you''re
  exploitable" framing; the "logical omniscience" issue.

  12. The "value of money vs utility" fix and the "you can''t be forced to bet" objection.

  13. The "Dutch book theorem is a theorem about sets of *preferences*, so it''s really
  a coherence/consistency requirement on preferences — and then why should preferences
  be consistent?" objection.

  14. Also the "Dutch strategy" vs "Dutch book": a Dutch strategy is a set of bets
  where the bookie changes the bets over time based on the agent''s responses (like
  a "Dutch strategy" against conditionalization violators — van Fraassen''s "Dutch
  strategies" for reflection).


