  conjecture is that none exists; every known exact method requires time that grows
  explosively with the size of the problem.

  (4) Human beings are finite agents with limited time, memory, and computational
  power.

  (5) Therefore, for sufficiently large instances of these morally important problems,
  no human being can find the optimal or even a demonstrably correct solution in the
  time available.

  (6) By (1), if no one can do it, no one ought to do it.

  (7) So, for sufficiently large instances, there are no moral obligations to allocate
  resources fairly, draw districts fairly, schedule services well, or verify proofs
  correctly.

  (8) But that conclusion is absurd: a hospital administrator who throws darts at
