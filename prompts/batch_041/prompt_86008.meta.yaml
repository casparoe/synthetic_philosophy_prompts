  Our recurring fight is about the distinction between access consciousness and phenomenal
  consciousness, and about whether global workspace theory (or any theory of that
  general shape, in which a state becomes conscious by being broadcast widely enough
  to guide report, memory, and the flexible control of action) is a theory of the
  first thing only, or of both. I have invented a criterion for my own convenience
  and I should like you to treat it as stipulated rather than defended: call a state
  access-conscious when its content is broadcast in that way, and call it phenomenally
  conscious when, in addition, the system''s being in that state is itself among the
  contents the workspace can carry and re-broadcast — a re-entrant self-model condition,
  if that is not too grand a name for it. My suspicion is that the broadcast story
  is what the evidence actually supports and that the re-entrant condition is quietly
  imported to make the story feel complete, but I cannot tell whether that is a real
  gap or merely my residual behaviourist upbringing.


  Please act as a philosopher of mind with a firm grasp of the empirical work on consciousness,
  and begin by putting my proposition in its sharpest form: I want to know your credence
