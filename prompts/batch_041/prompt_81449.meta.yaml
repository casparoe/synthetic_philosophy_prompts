  Let''s write:


  I am a PhD student working at the intersection of philosophy of mind and cognitive
  science, and I have come to hold a position that I want to stress-test: that qualia,
  understood in the standard way as intrinsic, private, ineffable, and directly apprehensible
  features of experience, are an incoherent posit. The notion, on this view, is not
  merely false or explanatory idle; it cannot be rendered consistent with the rest
  of what we know about perception, introspection, and the metaphysics of properties.
  I would like you to tell me what would count against this position.


  I do not want a survey of the qualia literature, and I do not want citations or
  reading lists. I want a map of the position''s exposure. What observations, arguments,
  intuitions, formal results, or theoretical developments should move me? Which of
  these would a committed defender of the incoherence charge concede as genuine defeaters,
  and which would they dismiss as merely changing the subject? I am especially interested
  in the following pressure points, and I would like you to distinguish those that
  are fatal from those that are merely awkward.


  First, the incoherence charge often proceeds by taking the four marks jointly and
  arguing that no single entity can have all of them. But a defender of qualia can
  drop one or more marks and retain a minimal phenomenal character, or can distinguish
  the determinable from its determinates, or can treat qualia as role-occupants in
  a quality space rather than as intrinsic atoms. Does the survival of any such minimal
  or structuralist notion count against the incoherence claim, or only against a particular
  over-strong characterization? What would a proponent of incoherence have to say
  to show that the minimal notion is either not qualia at all or collapses into something
  else?


  Second, consider formal or empirical developments that might give the posit independent
  work to do. Suppose a quality-space model with a metric structure explains similarity
  judgments, discrimination thresholds, and the structure of introspection better
  than its rivals; suppose psychophysics delivers stable, fine-grained introspective
  reports that are not reducible to functional or representational facts; or suppose
  a theory of perceptual constancy or sensory substitution needs to posit a qualitative
  character to explain why certain transitions are experienced as changes in appearance
  rather than changes in belief. Would any of these count against the incoherence
  claim, or would they only show that some coherent surrogate for qualia is theoretically
  useful? What would be the strongest version of this challenge?


  Third, I am worried about a self-undermining structure in the incoherence charge.
  If the charge relies on introspective evidence to show that the four marks cannot
  be jointly satisfied, does it not thereby rely on the very first-person access it
  denies is theoretically respectable? And if it instead relies on a functionalist
  or representationalist account of experience, does it not beg the question against
  the qualia theorist? What would count as a non-question-begging demonstration of
  incoherence?


  Fourth, I would like to know whether the position risks unfalsifiability. If every
  attempt to specify qualia is either dismissed as an over-strong characterization
  or reclassified as a coherent surrogate, then what would it take for the incoherence
  claim itself to be false? Is there a version of qualia that would satisfy the incoherence
  charge''s own standards, and if not, is that a problem for the charge or a virtue
  of it? I would also like an honest assessment of whether the position has been insulated
  by definitional moves, and whether that insulation is acceptable for a claim of
  incoherence rather than mere falsity.


  Finally, tell me what the position predicts that its rivals do not. If qualia are
  an incoherent posit, what should we expect to find when we look at the psychology
  and neuroscience of introspection, at the failures of introspection, at the meta-problem
  of why we seem to have qualia, and at the persistence of the intuition that experience
  has a qualitative character? Which of those predictions are borne out, and which
  would count against the position if they were not? I would like the defeaters ranked
  from fatal to merely awkward, with an explanation of what would be decisive and
  what would be only a reason to qualify the view.


