  Prompt:


  "Take the role of a philosopher who works on eighteenth-century aesthetics and knows
  Hume''s essay on taste closely. I''ve been reading secondary commentary on it and
  I want a careful audit of one paragraph rather than a summary of the position from
  scratch.


  The paragraph, from an essay in a general-interest philosophy magazine, runs like
  this: ''Hume''s essay on taste is where modern aesthetics begins, and its upshot
  is that beauty is in the eye of the beholder. Hume agrees we cannot argue about
  taste: a sentiment of beauty is just a feeling an object causes in us, with no counterpart
  in the object itself, so there is no fact of the matter for critics to be right
  or wrong about. He tries to soften this by allowing that some people have better
  taste than others — those with strong sense, delicacy, practice, comparison and
  no prejudice, whom he calls the true judges — and he says the standard of taste
  is the joint verdict of such judges. But that is just an appeal to an elite: Hume
  gives no argument for why the verdicts of a trained few should bind the rest of
  us, and he concedes that the true judges are hard to identify. The essay therefore
  leaves us with subjectivism dressed up as a standard, and its real legacy is the
  relativism its own conclusion implies. Anyone defending objective beauty today is
  arguing against Hume, not with him.''


  Before you judge anything, set out in your own words what Hume actually holds —
