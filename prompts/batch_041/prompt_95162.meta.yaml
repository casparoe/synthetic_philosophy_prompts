  "Hume''s essay on taste is where modern aesthetics starts, and its upshot is that
  beauty is in the eye of the beholder. Hume grants that we cannot argue about taste,
  since a sentiment of beauty is just a feeling the object causes in us and has no
  counterpart in the object itself — so there is no fact of the matter for critics
  to be right or wrong about. He tries to soften this by pointing out that some people
  have better taste than others: those with strong sense, delicacy, practice, comparison,
  and no prejudice, whom he calls the true judges. The standard of taste, he says,
  is the joint verdict of such judges. But this is really just an appeal to an elite,
  since Hume can give no argument for why the verdicts of a trained few should bind
  anyone else — and he admits that we can rarely identify who the true judges are.
  So in the end Hume leaves us with a subjectivism dressed up in the language of a
  standard, and the essay''s real legacy is the relativism that Hume''s own conclusion
  — that taste is not a matter for argument — plainly implies. Modern aestheticians
  who defend objective beauty are therefore arguing against Hume, not with him."


  Subtle errors to audit:

  1. "Beauty is in the eye of the beholder / no fact of the matter for critics to
  be right or wrong about" — Hume does say beauty is no quality in things themselves,
  but he also holds that some critical verdicts are correct and others not, via the
  standard of taste; he explicitly denies that all judgments are equally valid. The
  error: conflating "sentiment has no truth value" with "no critical verdict is better
  than another." Hume''s "true judges" aren''t a softening of subjectivism but the
  core of the standard; the standard is normative, derived from the common structure
  of human nature, and Hume thinks it can "confirm one sentiment and condemn another."

  2. "The standard of taste is the joint verdict of true judges" — roughly right,
  but the summary presents it as an appeal to authority; Hume''s point is not that
  their verdicts bind by authority but that the standard is the sentiment that survives
  the correction of prejudice and the exercise of delicacy — a "rule" for reconciling
  sentiments. Also the summary omits that Hume thinks the rules of art are discovered
  empirically (by observation of what pleases across times/peoples) — Hume compares
  the standard to a rule by which we can reconcile conflicting sentiments.

  3. "Hume can give no argument for why the verdicts of a trained few should bind
  anyone else" — the standard objection (presented as refutation). Hume''s answer
  is that the qualifications are those that put a person in a position to perceive
  what the work is actually like, and the appeal isn''t to authority but to the fact
  that the same object, considered properly, produces the same sentiment in those
  who perceive it correctly — Hume''s "durable admiration" is a sign of the true standard.
  Also Hume doesn''t say it "binds" others; he says we can affirm one sentiment and
  condemn another, and that the standard is derived from human nature. And crucially,
  the fact that identifying true judges is hard is Hume''s own acknowledged practical
  difficulty, not a concession that undermines the standard.

  4. "Hume''s own conclusion — that taste is not a matter for argument — plainly implies
  relativism" — Hume says truth is disputable, not taste; but he immediately adds
  that this doesn''t mean all verdicts are equal, and he thinks the standard is not
  derived from reason but from experience and the common sentiments of human nature.
