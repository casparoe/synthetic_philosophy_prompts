  Hmm, the false presupposition: that a credal set is always representable as a hyperprior
  (i.e., a second-order probability), and that this reduction is innocuous. The correction:
  (1) A set of probabilities is a set, not a distribution — you can''t get a set from
  a hyperprior by marginalizing (you''d get a single probability, the mixture). The
  hyperprior gives you a *single* predictive distribution, so it loses the distinction
  between first-order uncertainty and ambiguity — this is the classic "second-order
  probability doesn''t capture imprecision" objection (Walley: a second-order distribution
  over probabilities is not equivalent to a set of probabilities, because it commits
  to a single mixture). (2) But there''s a genuine contest: some (Good, and the "second-order"
  Bayesians) argue IP can be reconstructed as Bayesian reasoning with a hyperprior,
  and that anything else violates coherence (e.g., the "principle of reflection" /
  "dynamic coherence" arguments from the "Bayesian who insists on precise probabilities").
  This is genuinely contested — the disagreement between Walley-style IP and de Finetti-style
  "prevision" / "all uncertainty is Bayesian" is a live dispute. (3) Also the decision
  rule matters (maximin/E-admissibility/maximality) and there''s no consensus.


