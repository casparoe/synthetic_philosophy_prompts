  Proposed commitments:

  1. Accuracy — closeness to truth — is the sole fundamental epistemic good; coherence,
  explanatory power, and understanding matter only insofar as they serve accuracy.

  2. The master norm for credence is to maximize expected accuracy, where expected
  accuracy is computed by the agent''s own credences.

  3. Probabilism is vindicated by a dominance argument: incoherent credence functions
  are accuracy-dominated by coherent ones, so no coherent function can be criticized
  on accuracy grounds.

  4. Accuracy is measured by a strictly proper scoring rule (Brier or log).

  5. Even a perfectly coherent agent can be epistemically irrational — e.g., someone
  who never conditionalizes and ignores all evidence — and accuracy-first epistemology
  must be able to explain why.

  6. I think the reason to be coherent is that incoherence guarantees you''ll be less
  accurate than you could be, and the reason to update is that it improves your expected
  accuracy.


  Genuine tensions:

  - (2)+(4) → immodesty: for strictly proper scores, every coherent credence function
  uniquely maximizes expected accuracy by its own lights. So (2) is automatically
  satisfied by any coherent agent and cannot generate any criticism of a coherent
  dogmatist. Thus (5) is unattainable if we keep (2)+(4). To get (5), you must abandon
  (2) as the master norm (e.g., use dominance or an external/objective expected accuracy)
  or abandon strict propriety (but then you lose the dominance argument, (3)).

  - (2) vs (3): (2) says expected-accuracy maximization is the master norm; (3)''s
  dominance argument doesn''t use expected accuracy and is needed precisely because
  an incoherent agent''s own expected accuracy may not favor coherence. So the two
  justifications rest on different decision rules; if (2) is master, (3) needs more;
  if dominance is master, (2) is not the master norm. This is a genuine tension about
  what the fundamental norm is.

