  Potential prompt:


  "I am assembling the final examination for a graduate seminar on consciousness in
  Indian and Western philosophy. The seminar''s last unit pairs Schrödinger''s late
  reflections on the subject with Advaita Vedanta, and I want one essay question that
  tests whether students can think through the unity-of-consciousness thesis rather
  than reciting either the standard physicalist positions on the binding problem or
  a summary of Advaita. To keep the question fair, I will give students a short handout
  in the exam; it will state, in my own words, the following claims that I attribute
  to Schrödinger: that the plurality of conscious subjects is an appearance rather
  than an ultimate fact; that the subject of knowledge can never be made into an object
  of knowledge; that the Upanishadic identification of the innermost self with Brahman
  is meant literally, not metaphorically; and that physics can describe only objectified
  contents, never the subject that knows them. The handout will also note that these
  claims are often read as a form of numerical monism—there is one consciousness,
  not many—though the texts also speak of consciousness as a singular that appears
  as many. I do not want the question to depend on students having read any particular
  book, and I do not want it to ask for citations, dates, or reading lists. Assume
  no one, including you, has web access."


  Then second paragraph: "Please draft the exam question itself, a model answer of
  roughly 750 words, and a marking scheme. The question should be answerable in 90
  minutes and worth 25 marks. It should force students to distinguish at least three
  things: numerical unity of the subject, phenomenal unity within a single experience,
  and personal unity across time. It should also require them to confront a specific
  empirical-looking challenge: a split-brain case, or a constructed two-stream case,
  in which one organism seems to support two simultaneous streams of reportable experience.
  The question should ask whether such a case falsifies Schrödinger''s monism, merely
  falsifies a claim about the unity of the person, or does neither; and it should
  require students to say what would count as a decisive consideration either way.
  The crux should be whether the monist can distinguish the subject of experience
  from the empirical person without making the thesis unfalsifiable. The marking scheme
  should name five must-hit points, assign each a mark total of 25, and for each point
  give a one-line note on the mistake that typically costs students the mark. The
  model answer should not merely summarize; it should take a stand and defend it."


  Third paragraph: "Finally, after the marking scheme, add a brief note—no more than
  150 words—saying which part of the model answer you are least confident in, what
  argument or consideration would lead you to revise the exam question''s crux or
  the model answer, and where your reasoning is most likely to fail. Do not include
  any bibliography, citations, or suggested readings."


