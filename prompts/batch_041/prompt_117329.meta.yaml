  The classic problem for heterophenomenology: the method takes subjects'' reports
  as *data about what they say/believe*, then constructs the heterophenomenological
  world, and then asks whether that world is *coherent* — with the constraint that
  the subject''s own beliefs about their experience are treated as "fictions" (the
  subject is treated as an author of a fiction). Dennett: the heterophenomenological
  world is the "intentional object" of the subject''s acts of speech; the subject''s
  authority is limited to "what it is like for me" reports; but the method''s neutrality
  means that if the reports are systematically distorted (e.g., by confabulation),
  the heterophenomenological world is still built from them.


  Key friction points:

  1. The method gives subjects "first-person authority" over their own reports but
  denies them authority over their own minds — "you are not the authority on your
  own experience; you''re only the authority on what you say."

  2. It can''t distinguish "there is no experience" from "the subject can''t report
  it" (blindsight).

  3. It treats reports of "qualia" as fictions, and the coherence check is done with
  third-person science, which is where the "hard problem" gets dissolved rather than
  answered.

  4. Split-brain: heterophenomenology must choose whether to count two "subjects"
  — Dennett says one, because there''s one "person" (one heterophenomenological world,
  built from one voice). But some argue the reports themselves are two voices.


  A great thought experiment: a case where there are two "voices" reporting incompatible
