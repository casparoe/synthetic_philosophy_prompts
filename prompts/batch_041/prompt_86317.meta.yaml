  are actually functioning. Famine, for me, shows up as a bad outcome in the second
  layer while the first looks fine: warehouses full, prices up, people priced out.
  I''ve started calling that a ''distribution failure with no supply failure''. Sen,
  if I''ve got him right, would say I''ve reinvented ''entitlement failure'' but that
  I''ve also quietly missed the point, because an entitlement isn''t a capacity —
  it''s a claim, backed by rules about who owns what and who owes what to whom.


