  In a seminar I''m taking on material constitution, one phrase keeps doing all the
  work, and I have begun to suspect it is doing several incompatible jobs at once.
  The phrase is: the statue is nothing over and above the clay. My classmate uses
  it, first, to dissolve the puzzle of coincident objects — he says there is only
  the clay there, and the statue is that clay under a description, so there is no
  question of two things in one place. He uses it, second, to make a claim he takes
  to be substantive, namely that the clay grounds the statue and that the statue-facts
  are fixed once the clay-facts are fixed. And he uses it, third, to reassure me that
  the statue exists perfectly well: of course it does, he says, since it is nothing
  over and above the clay.


  I would like a menu rather than an adjudication on his behalf. Set out the distinct
  precise claims that sentence could be making, ordered from the thinnest to the most
  substantive. At a minimum I expect you to separate: a strict identity claim; a claim
  about composition or shared parts; a mereological-essentialist claim about what
  can survive what; a supervenience claim; a grounding or dependence claim; a truthmaking
  claim; a claim about ontological commitment or quantifier innocence; and a claim
  about conceptual or explanatory priority — and to add any further readings the idiom
  can bear that I have not listed. For each reading, state exactly what it asserts,
  whether it is a platitude, a substantive but defensible thesis, or simply false,
  and what it implies for the statue/clay case in particular: in particular, which
  readings permit two numerically distinct objects to coincide and which rule coincidence
  out.


  Then tell me which readings would actually sustain each of the three uses above,
  and whether any single reading sustains all three — or whether he must quietly change
  readings between sentences, and where the change occurs. Note also that the phrase
  comes in at least two grammatical forms, ''is nothing over and above'' and ''just
  is,'' and say whether they can be read as the same claim.


  Two further things I would like pinned down, because they are what the seminar keeps
