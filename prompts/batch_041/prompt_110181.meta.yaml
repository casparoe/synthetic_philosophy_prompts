  \ private language argument\n- Scalable oversight and AI safety via debate\n- Strawson's\
  \ reactive attitudes and moral responsibility\n- Panpsychism and the combination\
  \ problem\n- The dollar auction and escalation of commitment\n\nThe type: report\
  \ a track record of verdicts on earlier cases, ask for prediction/recommendation\
  \ on a new case, identify candidate rules, say which diverge, name discriminating\
  \ case.\n\nGood candidates: Strawson's reactive attitudes — a person's verdicts\
  \ on when someone is responsible/exempt. Wittgenstein's private language argument\
  \ — a reader's verdicts on whether various cases count as private language. Dollar\
