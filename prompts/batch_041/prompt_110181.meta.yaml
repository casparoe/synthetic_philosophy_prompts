  \ in various cases. The candidate rules: (a) responsibility requires the capacity\
  \ to participate in interpersonal relationships (Strawson's own criterion), (b)\
  \ responsibility tracks the appropriateness of reactive attitudes given the quality\
  \ of will, (c) responsibility requires being a member of the moral community, (d)\
  \ responsibility tracks whether the agent's will is \"his own\" (history/upbringing),\
  \ (e) it's about whether the agent could have been reasoned with.\n\nBetter: to\
  \ make it \"in the weeds\" and not memorizable, invent cases: e.g., a person who\
  \ has been manipulated by a cult since birth; a person with an acquired character\
  \ change after a brain tumor (that's a real-ish case, the \"tumor\" cases); a person\
  \ with a \"moral\" dementia; a sleepwalker; a corporation/LLM; a person under the\
  \ influence of a \"character-changing\" drug; a person who was hypnotized; a person\
  \ who is a \"sociopath\" but functional; an AI agent.\n\nThe new case should be\
  \ novel and interesting: e.g., a person whose moral dispositions were deliberately\
  \ shaped by a benign \"moral enhancement\" neural implant that they consented to,\
  \ and who now acts well — do we hold them responsible (praise)? Or a case where\
  \ someone's actions were caused by an AI \"decision coach\" that they set up and\
  \ follow.\n\nHmm, let me think about which domain gives the richest set of candidate\
  \ rules with genuine divergence.\n\nOption A: Strawson's reactive attitudes. Verdicts\
  \ about responsibility for: an adult with a brain tumor-induced personality change;\
  \ someone raised in a cult; a person who committed a crime while sleepwalking; a\
  \ person who is \"morally blind\" due to a congenital condition (psychopathy) but\
  \ high-functioning; a person acting under severe duress; someone whose actions are\
  \ the result of a neural implant that dampens empathy.\n\nCandidate rules:\n1. Capacity\
  \ rule: responsible iff the agent possesses the relevant capacities (to recognize\
  \ reasons, control action) — Strawson's \"participant\" capacities.\n2. Stance rule\
  \ (Strawson's own): responsible iff it's appropriate to take the participant stance\
  \ toward them, i.e., they are a member of the moral community who can engage in\
  \ interpersonal relations; exempting conditions are those that make the objective\
  \ stance appropriate.\n3. Quality of will rule: responsible iff the action expressed\
  \ a poor quality of will toward you.\n4. History rule: responsible iff the action's\
  \ causal history is the right kind (not manipulated/coerced) — \"the agent's own\"\
  \ — this is like the \"causal history\" / manipulation arguments.\n5. Reasons-responsiveness\
  \ rule (Fischer/Ravizza-ish): responsible iff the agent is reasons-responsive.\n\
  \nThe new case should split them. E.g., a person with a \"moral implant\" that they\
  \ chose, which makes them do good — praise? Rules diverge: quality-of-will (fine,\
  \ it's good will) vs history (the good will is engineered, so maybe not their own)\
  \ vs capacity (they have capacities but the implant does the work).\n\nOr better:\
  \ a case of \"moral bioenhancement\" — someone who has had an empathy-enhancing\
