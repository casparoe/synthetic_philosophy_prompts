  \ problem — verdicts on which combinations work.\n\nThe instruction says we often\
  \ have to inject new/niche ideas into the prompt, so models can't regurgitate pretraining.\
  \ So we should construct fictional cases — e.g., invented scenarios — rather than\
  \ relying on memorized literature.\n\nStrawson's reactive attitudes is a good one:\
  \ the participant/stance, objective stance, exemptions (child, mentally ill), excuses.\
