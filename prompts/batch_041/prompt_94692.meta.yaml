  with a straight stem on the right, and the one that''s a curved hood over a bowl
  with a stem: they share no geometry worth naming. Whatever they share, it isn''t
  a shape.


  (2) The scientist: that can''t be the whole story, because on that account "this
  is an ''a''" would be pure fiat. If ''a''-ness were nothing but our convention,
  then we could announce tomorrow that the shape we call ''a'' is really the letter
  ''e'', and nothing about the shapes would have changed and nothing would be wrong
  — but that seems false. Some shapes push back. There''s a skeleton under the style:
  a body at x-height with a vertical element on the right and an enclosed or nearly
  enclosed counter attached to it; every ''a'' satisfies it, and style is only the
  modulation of that skeleton.


  (3) Designer: the skeleton doesn''t survive the evidence. The two-storey ''a'' has
  two counters; the one-storey has one. That''s a difference in topology, not a modulation.
  And in several italic and blackletter hands the ''a'' is a bowl with a hook and
  nothing else. Once you''ve thinned the skeleton enough to cover all of those, it
  either becomes a long disjunction of shapes, which is just family resemblance wearing
  a lab coat, or it becomes so abstract that it''s compatible with letters that aren''t
  ''a'' at all. Notice too that the Cyrillic ''а'' is the same shape as ours and is
  a different letter — same geometry, different letter — which is what you''d expect
  if letters are roles in a system rather than shapes.


  (4) Scientist: the Cyrillic case shows shape isn''t sufficient for letter identity;
  it doesn''t show it isn''t necessary. And genealogy can''t be what makes something
  an ''a'' either: someone who had never encountered our alphabet but who converged
  on that form would have drawn an ''a'', not a new letter. Also, even a reader who
  doesn''t know our script sees the bowl-with-a-right-stem as closer to ''a'' than
  to ''z'' — there''s a perceptual gradient there, and a convention can''t explain
  it.


  (5) Designer: "closer to ''a'' than to ''z''" for a non-reader is a claim about
  our visual system, not about the letter. And you''re sliding between two very different
  claims: that there''s something about the letter itself that makes it the letter
  it is, and that our perceptual machinery has biases that make some shapes easier
  to read as ''a''. The second is true and uninteresting; it''s the first you need,
  and everything you''ve said is compatible with the letter being nothing but a node
  in a network of distinctions.


  (6) Scientist: if that''s all it is, then "is this an ''a''?" has no answer apart
  from what people will tolerate, and then your own training story can''t explain
  why some novelties are read immediately as ''a'' while others are rejected as illegible.
  Also, you keep appealing to the tradition as if it were a fact about the world;
  but the tradition is just a long sequence of choices, and at each choice someone
  had to judge that the new shape was still the same letter. What were they judging?


  (7) Designer: they were judging whether it would work — whether readers could still
  tell it apart from ''o'' and ''e'' and ''d'' at speed, and whether it fit the style
  of the rest of the face. That''s a functional judgment, not a glimpse of an essence.
  And notice that we can and do get these things wrong, and that we sometimes change
  our minds: shapes that were once read as one letter get read as another after a
  typeface becomes familiar, and a shape can sit ambiguously between two letters —
  so your "we couldn''t be wrong" argument is doing more work than it can bear.


  (8) Scientist: I''ll grant that we can be wrong about individual shapes. But that
  only makes sense if there''s something to be wrong about, and I don''t see how a
