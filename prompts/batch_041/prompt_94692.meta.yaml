  the reason they''re all ''a'' is a mixture of historical lineage (our ''a'' descends
  from a particular written form), the constraint that it must be distinguishable
  from other letters at reading speed, and the fact that readers have been trained
  on it. Take the two shapes we call ''a'' — the one that''s a circle with a vertical
  stroke on the right, and the one that''s a circle with a curved hood and a stem.
  Nothing in common but function; and even function is loose, since the letters ''ɑ''
  and ''o'' differ by a hair.

  - Cognitive scientist: no, that can''t be right, because then "is this an ''a''?"
  would be entirely up to us; but when a designer draws a new letterform and we squint
  and say "that''s a weird ''a''", we''re not just registering a convention — we''re
  recognizing something about the shape. If ''a''-ness were purely conventional, we
  could decide tomorrow that the letter we call ''a'' is really ''e'' and nothing
  would be wrong; but that seems false — the shapes constrain which letter-identities
  are available. There''s a "skeleton" — a set of topological/structural relations
  (a closed or nearly closed counter, a stem on the right, an ascender-free x-height
  body, a junction) that any ''a'' must satisfy, and style is just the modulation
  of that skeleton.

  - Designer: "topological relations" is doing a lot of work. Take the double-storey
  ''a'' in a serif face: it has two counters; the single-storey has one. That''s not
  a stylistic modulation; the topology differs. And in some blackletter and italic
  hands the ''a'' is essentially a bowl plus a hook. So no fixed topology. What unifies
  them is a *history* and a *practice*: ''a'' is whatever the tradition of writing
  that letter has handed down, plus what readers can parse. That''s why the Cyrillic
  ''а'' is the same shape but a different letter — same geometry, different letter.
  That kills the geometry-first story.

  - Cognitive scientist: the Cyrillic point shows that shape isn''t sufficient, but
  not that it isn''t necessary. And the history point doesn''t work as an account
