  Theory → case: The control agenda says: when you can''t trust the system''s objectives,
  your safety measures must survive the system actively working against them; and
  you must be able to detect the system''s misbehavior through channels it doesn''t
  control; and the human overseer must have both the information and the standing
  to stop it. Applied to Therac-25: the designers moved interlocks into software (the
  software became the only thing standing between the patient and an overdose) — this
  is exactly "putting the control in the hands of the thing you''re trying to control,"
  a category error that the control framework names. The human operators were the
  outer control layer, but their channel to the machine''s state was the machine''s
  own display, and the alarm ("Malfunction 54") was ambiguous; also their incentive/training
  told them to press P to continue. So the human-in-the-loop was not a control measure.
  And AECL''s testing regime assumed random failure (reliability) and thus tested
  typical sequences, missing the race condition that required an unusual input timing.


  Case → theory: Therac-25''s software was not adversarial — it had no objective,
  it just had a race condition. So it''s an anomaly for the control agenda, which
  by construction studies subversion: it says nothing about a system that fails accidentally
  but in a correlated way. The lesson the case offers the theory: correlated accidental
  failure can mimic the effects of adversarial failure (the checks fail exactly when
  the failure occurs, because the checks run in the same code path), so a control
  evaluation should not assume that surviving non-adversarial testing tells you anything;
  conversely, the theory''s insistence on assuming the worst may be overkill in some
  domains — you don''t need untrusted monitoring to catch a race condition, you need
  independent verification and physical interlocks. And the deepest point: for a system
  with no goals, "control" measures that assume goal-directed evasion are wasted,
  while the cheap physical/independent measures actually work; the control agenda''s
  framing can obscure the fact that the most robust control measures are those that
  don''t route through the controlled system at all (hardware interlocks, independent
  dosimetry).


