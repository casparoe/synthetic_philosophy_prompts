  "For as long as I have been reading Bayesian accounts of confirmation, the problem
  of old evidence has bothered me, and I have never been able to decide whether it
  is a genuine defect in the framework or a sign that the framework is being asked
  the wrong question. The core of it I take to be this: if I built a hypothesis h
  in full awareness of some evidence e, and e is already certain for me, then P(e)
  = 1, so P(h | e) = P(h), and conditionalizing on e does nothing — even though e
  is, by my own lights, the reason I believe h. The proposed repairs are familiar
  to me in outline: subtract e from the background and recompute; treat the agent
  as never having been certain of e but only having had some probability for it; ask
  what the agent would have believed had she not known e, in a counterfactual or ''logical
  learning'' sense; or drop the demand that confirmation be a matter of probability
  increase and use a measure that credits explanatory or coherence relations directly.
  What I cannot settle is why the debate over these repairs has not converged, and
  I would like a diagnosis rather than another survey. Is this a substantive disagreement
  about how a probabilistic account of belief should be extended to cases where the
  agent''s own history of learning is part of the phenomenon — a real gap in the formalism
  that no one has closed? Is it a verbal dispute, in which one camp means by ''confirmation''
  the synchronic evidential support of h by e and the other means the diachronic change
  in the agent''s credence, so that the camps are answering different questions under
