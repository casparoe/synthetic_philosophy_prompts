  idealization and has graded this kind of thing before — not a summarizer. Think
  carefully about where the real crux is before you write; I''d rather have one sharp
  question than a broad "discuss" prompt. If you want, do a short brainstorm first
  and then give me the finished version, but the finished version is what I''m after.


  Constraints that matter to me:


  - Closed book, no internet for the students. So no citations, no "name the article
  where X says Y", nothing that depends on them having read a specific paper. Everything
  they need has to be in the question or in their heads.

  - Upper-level undergrad / master''s level, ~45 minutes, and it should be impossible
  to answer by reciting "all models are wrong" or the spherical cow thing or Friedman''s
  line about unrealistic assumptions — they''ve all heard those. The question should
  make them do the disambiguation and then commit.

  - Build it around a concrete case, not "assess Friedman''s thesis". Here''s the
  setup I want to use, improve it if you can:


  A hospital analytics team builds a model predicting 30-day readmission. One of its
  assumptions is that patients'' outcomes are independent of each other — no ward-level
  contagion, no shared staffing effects, nothing where one patient''s outcome shifts
  another''s. Everyone on the team knows that''s false. They defend it with "the realism
  of the assumptions doesn''t matter, only out-of-sample predictive accuracy," and
  their accuracy numbers are good. Now they want to use the same model to decide whether
  to fund a discharge-coordinator program on two wards. There''s a skeptical clinician
  who says fine, the numbers are good, but the assumption you''re leaning on is exactly
  the mechanism your intervention is supposed to exploit.


  What I want the question to force out of them: what "the assumption is unrealistic"
  can actually mean here (I get the feeling it''s doing at least three different jobs
  in that sentence and the defense only works for some of them), whether the accuracy
  defense survives once the purpose shifts from prediction to deciding about an intervention,
  and what a better defense of the assumption would look like as opposed to a bad
  one. Something in there should separate "the assumption is false but harmless" from
  "the assumption is false and load-bearing in a way accuracy can''t see", and ideally
  they should have to say which moves would rescue the team and which just restate
  the slogan.


  Deliverables:


  1. The exam question itself — tight, ~100-150 words, the kind of thing a student
  reads once and knows what''s being asked.

  2. A model answer of ~600 words. Self-contained, since I''ll be reading it off my
  phone while grading.

  3. A marking scheme: exactly five must-hit points, 4 marks each, 20 total. For each
  point: what earns the 4, what earns partial credit, and one line on how candidates
  typically blow it (the specific wrong move, not "insufficient detail").

  4. Then a short bit on the A/B line — the two or three moves that a B answer will
  have and an A answer will have plus one more, spelled out.

  5. And a note on the "sophisticated but wrong" answer — the move that sounds clever
  in a seminar and should still lose marks, and why.


  Don''t hedge on the marking scheme, I need to be able to point at things. And no
