  Potential prompt:


  I am a high school junior and the student chair of our school''s philosophy club.
  This year, as a fundraiser for the library, we are putting on a Victorian séance
  evening in the old assembly hall. I have been asked to give the opening remarks
  in character as Henry Sidgwick, the Victorian utilitarian philosopher who was one
  of the founders and first president of the Society for Psychical Research. The audience
  will be mixed: students who came for the spooky atmosphere, parents who are skeptical,
  a few teachers who know Sidgwick''s actual work, and some people who have lost someone
  recently and are not sure why they came. I want the speech to be honest, humane,
  and intellectually serious—not a parody, not a debunking, not a sentimental lie.


  Please act as a professional speechwriter and an expert in Victorian intellectual
  history, the history of psychical research, and Sidgwick''s philosophy. Before you
  write, brainstorm the central tension and outline how the speech will move. Then
  write the full speech, about five to seven minutes long, in Sidgwick''s first-person
  voice, but in language a modern high school audience can follow. Do not include
  a bibliography, footnotes, or a reading list; I will not be citing anything from
  the stage. Do not quote from any real text. If you need to refer to an idea, paraphrase
  it.


  The speech should be structured around Sidgwick''s actual position, as I understand
  it: he spent years investigating mediums and survival claims; he hoped the evidence
  might show that consciousness survives death, partly because he thought the moral
  order of the universe was at stake; but he never regarded the evidence as conclusive
  and remained an agnostic. So the speech has to hold together genuine hope and genuine
  doubt. It cannot resolve the tension by pretending the dead are certainly present,
  and it cannot resolve it by mocking the people who wish they were. That tension
  should shape what the speech can promise, what it must leave open, and how it addresses
  grief.


  I want the speech to turn on one less familiar idea: Sidgwick''s worry that the
  desire for survival can corrupt the evidence, and his corresponding insistence that
  the ethical stakes of the question are so high that wishful thinking is not a small
  epistemic sin but a betrayal of the very thing he hoped for. The speech should argue
  that intellectual honesty is itself a way of honoring the dead. You may develop
  this idea as you think Sidgwick would, even if he never put it exactly that way.


  Make sure the speech does real work for the mixed audience. The students who came
  for atmosphere should not feel lectured at; the skeptics should not feel pandered
  to; the grieving should not feel used. The ending should be open but not empty—it
  should give the audience something to hold, without claiming more than the evidence
  allows. Think carefully about tone: Victorian in cadence but not archaic; warm but
  not sentimental; rigorous but not cold.


