  Potential structure:


  You are a philosopher of science and an experienced designer of interactive seminars,
  with a strong background in formal epistemology and the philosophy of probability.
  Your task is to design a single classroom activity for a graduate seminar on the
  foundations of probability. The seminar has 16 students and meets for 90 minutes.
  The instructor has not yet introduced the reference class problem and wants students
  to encounter it experientially before it is named. Your activity should make them
  feel the force of the problem: that a probability assigned to a single, unrepeatable
  event depends on a choice of reference class, that several reference classes can
  be defensible, and that the choice can change the answer dramatically without any
  further empirical discovery.


  Before you write the final design, think carefully and brainstorm at least three
  possible mechanics. Consider which one best forces participants to commit to a reference
  class, defend it against rivals, and then discover that a rival''s class is equally
  defensible. Then select one and develop it fully.


  Setting and constraints:

  - 16 students, 90 minutes, a seminar room with movable chairs and a whiteboard.

  - No real money. Use tokens, points, or reputation.

  - No lecture up front. The instructor should speak as little as possible before
  the debrief.

  - The activity should be runnable by a facilitator who knows the concept but is
  not a game designer.

  - Do not require any reading, bibliography, or citations. The activity must stand
  on its own.


  The activity:

  Invent a fictional decision scenario in which participants must assign a probability
  to a unique event. The event should be unusual enough that no obvious frequency
  data settles it, but familiar enough that students can reason about it without special
  expertise. One possibility is a fictional Bureau of Novel Risk that must price the
  first confirmed contact with a non-human intelligence; you may invent a different
  scenario if it serves the design better. Each participant or team should occupy
  a role with a different stake in the decision (for example, an insurer, a science
  ministry, a civil-liberties group, a forecasting market, a research consortium).
  The roles should push them toward different reference classes without making the
  choice arbitrary or stupid. The rules should require them to name their reference
  class explicitly, state the probability it yields, and defend the class. At some
  point, two teams should be able to defend incompatible probabilities for the same
  event while both remaining internally coherent.


  Deliverable:

  Provide a complete, runnable design with the following sections:

  1. Learning goal: one paragraph on what students should feel and understand by the
  end.

  2. Materials and room setup: everything the facilitator needs, including any cards,
  dossiers, or token schemes.

  3. Roles: the exact roles, what each role wants, and what information each role
  receives. Include any hidden information or asymmetric briefings.

  4. Rules and mechanics: step-by-step rules, including how reference classes are
  chosen, how probabilities are elicited, how teams interact, and how a final decision
  is forced.

  5. Payoff scheme: how points or tokens are awarded, and why the incentives push
  participants toward the intended discovery rather than toward mere winning.

  6. Timeline: a minute-by-minute plan for the 90 minutes, including setup, play,
  and debrief.

  7. Debrief: a structured sequence of questions that maps specific moments in the
  activity onto the reference class problem, the problem of the single case, the role
  of the principle of indifference, and the difference between choosing a reference
  class for a decision and believing there is a uniquely correct one. The debrief
  should not merely explain the problem; it should point back to things that happened.

  8. Predictable failures: what will go wrong the first time the activity is run,
  how the facilitator should handle each failure, and how to adapt for a group that
  is too small, too large, or too quick.

  9. Limitations: be frank about which feature of the reference class problem the
  activity cannot reproduce and that the facilitator must supply afterward. For example,
  if the activity cannot settle whether there is a mind-independent correct reference
  class, say so plainly.


  Style and quality:

  Write for an instructor who will run this next week. Be concrete and operational:
  specify what the facilitator says, what participants see, and what happens when.
  Do not pad with generalities about active learning. Do not use citations or reading
  lists. You may use fictional names, offices, and events freely; they are part of
  the design. The activity should be self-contained and playable without any materials
  beyond ordinary classroom supplies. Aim for a design that a specialist in formal
  epistemology would recognize as getting the problem right, and that a student who
  has never heard of the reference class problem could still participate in fully.


