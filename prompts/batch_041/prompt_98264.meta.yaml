  Possible prompt:


  "I am a novelist at work on a book whose central character is a logician of a particularly
  stubborn kind, and I have been trying to write a scene in which she is forced to
  defend the very practice of deduction rather than any particular theorem. The scene
  keeps collapsing into Carroll''s tortoise: she lays out the premises, the tortoise
  asks by what right she moves to the conclusion, she adds the conditional, the tortoise
  asks again, and the whole thing becomes a regress that looks less like a proof and
  more like a demand for a practical commitment no further proposition can supply.
  I do not want an exposition of the regress; I want the specification a theory would
  have to satisfy to count as an answer to it. Please write the desiderata for an
  adequate account of the justification of deductive inference—not of validity as
  a semantic property, but of the act of inferring, of treating a rule as one''s own.
  I want the requirements list: the cases it must get right (the tortoise''s repeated
  demand, the difference between a rule of inference and a conditional premise, the
  way a proof can transmit justification without creating it, the possibility of revising
  a logical rule without simply changing the subject, the fact that we seem able to
  reason correctly without being able to state the rule we are following); the distinctions
  it cannot collapse (validity versus inferential entitlement, rule-circularity versus
  premise-circularity, descriptive reliability versus normative guidance, being compelled
  by a rule versus being guided by it); and the results it must be consistent with
  (that any finite set of further premises will not close the gap, that logical truths
  alone do not tell us when to infer, that a regress of justifications is not by itself
  a reductio). For each requirement, give the case or consideration that motivates
  it, say whether you regard it as non-negotiable or as a preference of a particular
  camp, and flag any pair you suspect cannot be jointly satisfied—that is the part
  I most want, since the scene only becomes dramatic if the demands are genuinely
  in tension. Then, briefly, say which single requirement does the most to exclude
  the familiar candidates (formalist, meaning-theoretic, reliabilist, and rule-circular
  accounts), without turning this into a literature review. I am not looking for readings,
  citations, or names of articles; I am looking for the shape of the standard itself.
  Begin your reply with the bottom line in one sentence—the requirement you think
  is most likely to be non-negotiable—then give the reasoning and the list, with no
  preamble and no restatement of my question. State how confident you are in the overall
  specification and single out the point you are least sure of."


