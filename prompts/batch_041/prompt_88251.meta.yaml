  Let''s craft a plausible set of commitments that a structural realist might hold,
  with genuine tensions:


  Commitments:

  A. Scientific realism in the "no miracles" sense: the predictive success of mature
  science is best explained by its getting something right about a mind-independent
  world.

  B. Pessimistic meta-induction: the history of science shows that the posited unobservable
  entities of even very successful theories are routinely discarded (caloric, ether,
  phlogiston).

  C. Epistemic structural realism: what is retained across theory change, and what
  we are entitled to believe, is the structure of the theory, not the intrinsic nature
  of the entities; we can know relations, not relata.

  D. Ontic structural realism: there are no self-subsistent individual objects; what
  exists is structure, and putative objects are nodes or positions within it, individuated
  only by their relations.

  E. The Ramsey-sentence construal: a theory''s cognitive content is its Ramsey sentence,
  existentially quantifying over unobservables; this is the right formal expression
  of "structure."

  F. The structure that is retained is best identified with the theory''s symmetry
  group / invariants, e.g., the Lorentz group surviving the transition from Lorentz''s
  ether to special relativity; and I think of object talk as a gauge choice, so that
  what looks like a change in objects can be a redescription of the same structure.

  G. Quantum mechanics: entanglement and the permutation invariance of identical particles
  show that the world''s basic furniture is not a collection of individuals; this
  is direct evidence for D.


  Genuine tensions:

