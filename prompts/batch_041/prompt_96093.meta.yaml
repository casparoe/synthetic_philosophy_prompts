  Final student answer (~500 words):


  ---

  Chalmers''s conceivability argument starts from the idea that we can imagine a ''zombie''
  — a creature physically and functionally just like you or me, but with no inner
  experience, ''nothing it is like'' to be it. He claims that if zombies are conceivable
  then they are possible, and if they are possible then physicalism is false, because
  physicalism says the physical facts fix all the facts, so any physical duplicate
  of me must also be a phenomenal duplicate.


  The first thing to note is that the move from conceivability to possibility is doing
  all the work. And this is exactly where the physicalist should push back. As Kripke
  showed with examples like water and H2O, and Hesperus and Phosphorus, there are
  necessary truths that we could not know a priori — we can conceive of water not
  being H2O, but that doesn''t make it possible. So conceivability is not a reliable
  guide to possibility, full stop, and Chalmers''s premise is too strong.


  A physicalist who wants to hold onto the conceivability of zombies without giving
  up physicalism can invoke the phenomenal concept strategy. This is associated with
  people like Loar and Papineau. The thought is that phenomenal concepts — the concepts
  we deploy when we introspect a pain or a shade of red — are a special kind of concept,
  recognitional and partly constituted by the experience itself. Because of how these
  concepts work, we can''t see a priori how a physical state could be a phenomenal
  state, and we can imagine zombies without contradiction. But this is a fact about
  our concepts, not about the world. The psychophysical identity is a necessary a
  posteriori truth, just like water = H2O. Once we see this, the zombie scenario is
  exposed as a trick of our conceptual apparatus, and the strategy shows that zombies
  are not possible after all.


  So the phenomenal concept strategy gives the physicalist everything they need. It
  explains the explanatory gap — why there seems to be a gap between the physical
  and the phenomenal — while keeping the physicalist''s metaphysics intact. And since
  it closes the gap, it also closes off Chalmers''s argument at the first step, because
  the conceivability of zombies is really just an artifact of our concepts and doesn''t
  tell us anything about what''s metaphysically possible. I think this is the right
  response, and Chalmers''s argument fails.

  ---


