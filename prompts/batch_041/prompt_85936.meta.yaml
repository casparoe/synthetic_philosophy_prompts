  Let''s formulate:


  "I am a doctoral candidate working on disjunctivism. I need a thought experiment
  for a paper on the argument from illusion. The dialectical target is a disjunctivist
  who concedes that veridical perception and hallucination can be phenomenally indistinguishable
  but insists that they differ in metaphysical kind. I want a case that isolates a
  variable the disjunctivist usually leaves untouched: the subject''s epistemic warrant.
  Please construct a single realistic scenario in which:


  - A subject forms a perceptual belief that p.

  - In the actual case, her experience is veridical: p is true and her experience
  is caused in the normal way by the fact that p.

  - There is a subjectively indistinguishable counterpart case in which her experience
  is non-veridical: p is false (or the experience is not caused by p), yet she has
  exactly the same evidence and forms the same belief.

  - The disjunctivist''s metaphysical distinction between the two cases is genuine,
  but it does not by itself give the subject any additional warrant in the actual
  case: her warrant is the same in both cases.

  - The argument from illusion can therefore be restated as an argument from epistemic
  indistinguishability to a common factor of warrant, and the disjunctivist cannot
  block it merely by insisting on the metaphysical difference.


  Constraints: realistic, ordinary, no brain-in-vat, no evil demon, no hallucinogenic
  drugs, no science fiction; the scenario must be one paragraph; no more than two
  objects and one subject; the subject must not be an expert on perception; the warrant
  in the actual case must not be defective for a reason that would also be present
  in the counterpart case; and the case must not rely on the subject''s having any
  false belief about the object.


  After the scenario, do the following. (a) State the belief, the method, and the
  relevant nearby worlds. (b) Say what a sense-datum theorist, an adverbialist, a
  naïve realist, and a disjunctivist each say about the case, and why. (c) Identify
  the single feature of the case that makes the metaphysical distinction epistemically
  inert, and explain what happens if that feature is removed. (d) Say how a disjunctivist
  would attack the case, and what a proponent of the argument from illusion should
  concede. (e) Give your verdict on whether the case supports the argument from illusion
  or disjunctivism, in British English, and end with a machine-readable line \answer{...}
  containing only a label for that verdict, followed by a one-sentence summary."


