  Potential prompt:


  I am a doctoral candidate in philosophy working on disjunctivism and the epistemology
  of perception. I need a thought experiment built to specification for a paper on
  the argument from illusion, and I want it to isolate a distinction that is usually
  run together: phenomenal indistinguishability versus epistemic indistinguishability.
  Please construct a single realistic perceptual case in which:


  1. a subject has an experience that is subjectively indistinguishable from a veridical
  perception of an ordinary middle-sized object;

  2. the case is not an illusion in the sense that the argument from illusion traditionally
  requires, because the object is present and has the property it appears to have,
  but the subject''s perceptual warrant is nonetheless defective for an independent
  reason;

  3. the case therefore looks like a counterexample to a simple disjunctivist claim
  that veridical perception always supplies better warrant than any subjectively indistinguishable
  non-veridical experience;

  4. a more sophisticated disjunctivist can accept the case without abandoning disjunctivism,
  by denying that the argument from illusion establishes a common factor at the level
  of warrant.


  Constraints: the case must be realistic and ordinary; no brains in vats, no evil
  demons, no hallucinogenic drugs, no science fiction, no more than two people and
  one object; the subject must not be an expert on perception; the defective warrant
  must not come from the subject''s having any false belief about the object; and
  the whole scenario must be describable in one paragraph.


  After the scenario, do the following. First, state the belief the subject forms,
  the method by which she forms it, and the relevant nearby worlds. Second, say what
  a sense-datum theorist, an adverbialist, a naïve realist, and a disjunctivist each
  say about the case, and why. Third, identify the single feature of the case that
  does the work of separating phenomenal from epistemic indistinguishability, and
  explain what happens if that feature is removed. Fourth, say how a proponent of
  the argument from illusion would attack the case, and what a disjunctivist should
  concede. Finally, give your verdict on which theory the case most favours, in British
  English, and end with a machine-readable line of the form \answer{...} containing
  only a label for that theory, followed by a one-sentence summary.


