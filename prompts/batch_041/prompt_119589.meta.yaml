  hearing collapses into one of two scripts. One is property: the applicant owns the
  lot, meets the code, and the neighbors'' preferences are not a legal interest. The
  other is neighborhood: the people who live here have a claim on how the place changes,
  and a rule that lets an outsider override them is just the market with extra steps.
  Both scripts are question-begging, and neither tells me what to do with the objections
  that actually reach us: shadows, parking, traffic, "character," the loss of a rent-stabilized
  building that would be demolished for a taller one, a church''s objection to a project
  that would house formerly homeless people, and the near-universal complaint that
  we are being asked to decide too fast with a staff report and a week''s notice.


  Please write the procedure as a short ordered checklist — the questions to ask in
  order, what counts as a sufficient answer to each, which party carries the burden
  of proof at each stage and what shifts it, the default when the record is silent,
  and the point at which the procedure must stop and hand the decision to the commission
  as a value judgment rather than a finding. Aim it at someone who is not a philosopher
  and has twenty minutes before a hearing. Then run it on three cases and give me
  the verdicts: [case 1: a four-story, forty-unit building on a transit corridor replacing
  a six-unit rent-stabilized building, where the tenants will get relocation payments
  but not units in the new building; the neighbors oppose it over parking and scale].
  [Case 2: a 100% affordable project... where the procedure gives an answer I won''t
  like — make that explicit]. [Case 3: a proposal by a well-organized neighborhood
  association to downzone their own blocks to "preserve character," which would reduce
