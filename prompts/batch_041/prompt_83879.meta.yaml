  ---


  I have spent the better part of two decades reading the rationalist blogosphere
  — LessWrong, the various spinoffs and successor forums, and the comment sections
  in between — and for the last several years I have sat on the safety review board
  of an applied AI lab, where I am the member expected to supply whatever conceptual
  scaffolding the engineers and lawyers on the board lack. I need to draft the board''s
  written opinion on a question that has split us cleanly in half, and I would like
  you to write it.


  Some background, since the rest of the board will read this too. We have an internal
  practice we call mechanistic anomaly detection. It is not exotic: rather than judging
  a model only by its outputs on a battery of tests, we also inspect the internal
  computation that produces those outputs, and we treat it as a warning sign when
  the computation that is doing the work looks structurally unlike the kind of process
  we would have predicted would produce that behaviour. The motive is a familiar one
  from the risk literature. A model that performs well on our evaluations might be
  doing so for reasons that will not survive deployment — it might have learned a
  shortcut, a lookup table, or a heuristic keyed to some incidental feature of the
  test distribution — and if the mechanism is wrong, then the fact that the outputs
  were right tells us less than we would like. The whole point of looking inside is
  to notice when we are measuring the wrong thing.


  Here is the case that has divided us. Our model V2 was the subject of a full safety
  case last year. That case rested substantially on mechanistic evidence: we had located
  the internal structures that appeared to implement the capability we cared about,
  we had probed them, and we had a story about why the model did what it did. We have
  now trained V3. V3 is not a new architecture; it is a further training run over
  a changed data mixture, with a revised tokenizer and a fresh random initialisation,
  and its benchmark behaviour is, for our purposes, indistinguishable from V2''s on
  the tasks that the safety case covered. The engineering team wants to carry the
  V2 safety case over to V3 wholesale, on the grounds that the relevant mechanism
  is preserved. Half the board agrees. The other half says that a fresh initialisation
  and a new tokenizer mean that V3''s internals are a different object entirely, that
  nothing we learned about V2''s circuits transfers, and that the safety case must
  be rebuilt from scratch — which, given the cadence of our releases, means either
  delaying the release indefinitely or shipping with no mechanistic evidence at all.


  The disagreement is not really about V3. It is about what we have been saying when
  we say that two systems implement "the same mechanism," and I suspect we have been
  trading on an ambiguity between at least two readings. On one reading, a mechanism
  is picked out by its causal profile: what matters is which variables it takes in,
  which it puts out, and how interventions on the intermediate steps change the output,
  so that two systems count as sharing a mechanism when they realise the same pattern
  of counterfactual dependence, whatever the substrate. On the other reading, a mechanism
  is picked out by its specific internal structure: the actual components, their actual
  organisation, and their actual parameters, in which case two systems share a mechanism
  only if they share that structure, and the question becomes how much structural
  difference is compatible with sameness. There are further complications I would
  rather you handle than paper over: mechanisms seem to be identifiable at more than
  one level of description, so V3 may share V2''s mechanism at a coarse grain and
  not at a fine one, and it is not obvious which grain the safety case requires; and
  some of our probes may be sensitive to features that are themselves artefacts of
  the training run rather than of the mechanism we intended to study.


  Please draft the opinion I will circulate before the meeting. It should reach a
  clear bottom line on the case in front of us — whether the V2 safety case transfers
  to V3, in whole, in part, or not at all, and if only in part, which parts — and
  it should state the criteria the board should use to decide, in future, when two
  systems implement the same mechanism. The criteria need to be the kind that an engineer
  can actually apply to a system on her desk, not a definition that only works in
  the abstract; if the honest answer is that "same mechanism" is a family of notions
  and the board must choose one for a given purpose, say so, and say how to choose.
  Give the strongest version of the position you end up rejecting, and say what it
  gets right; half the board holds it and I need them to feel that the memo understood
  them. Finally, tell us what evidence we would have had to gather — for V2, or for
  V3 — to make this call on better grounds than the ones we have, so that we can build
  it into the process rather than litigate it again at the next release. Assume the
  reader has no appetite for citations and will not look anything up; argue from the
  case.


