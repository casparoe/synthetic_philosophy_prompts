  Draft:


  ---


  Two positions on the British Raj have been talking past each other for a generation.
  Call them the Ledger Creditor and the Ledger Debtor. The Creditor holds that, judged
  by what actually happened to the people who lived under it and by comparison with
  the plausible alternatives, British rule left India better off than it would otherwise
  have been: it built a unified administration, a railway network, a legal order,
  a postal and telegraph system, and a modern state apparatus, and it created the
  conditions for later growth. The Debtor holds that these "achievements" were instruments
  of extraction, that the Raj transferred wealth on a vast scale, deindustrialized
  the handloom economy, converted a food-securing agrarian order into a famine-prone
  export economy, and left behind an impoverished and institutionally deformed polity
  whose ills persist. Neither has moved the other. Your job is to write the joint
  statement they could both put their names to.


  Both parties have agreed to reason inside a common accounting frame, which you are
  to set out and use. It has the following stipulated features: (a) the unit of account
  is the welfare of people living in the subcontinent, not the welfare of Britain
  and not the size of the world economy; (b) outcomes are scored against an explicitly
  named counterfactual baseline, and the choice of baseline is itself a disputed question
  rather than a fixed input; (c) coercive and violent processes are to be entered
  separately from the outcomes they produced, so that a benefit cannot silently cancel
  a killing; (d) the ledger has a fixed set of rows -- public goods, economic structure,
  distribution and transfer, violence and famine, and institutional legacy -- and
  no row may be left blank; (e) the parties may differ about weights but must state
  the weights they are using.


  The document must contain:

  1. A numbered list of claims both parties accept. Include the methodological claims
  (about baselines, about counterfactuals, about what the ledger can and cannot settle)
  as well as substantive ones...

  2. A disagreements table ...

  3. Cruxes ...

  4. For each crux, the argument or evidence both would accept as bearing on it, and
  each party''s prediction recorded in advance ...

  5. A section on which disputes are verbal ...


  Constraints: no citations, no reading lists, no appeals to what a particular historian
  has written; the parties argue from the stipulated frame and from general considerations.
  Each side''s position must be stated in wording that side would sign. Don''t resolve
  the dispute — the goal is to make the disagreement exact.


