  over'' but ''I chose to use.'' They must complete a bad faith inventory, listing
  occasions on which they deceived themselves about their own intentions—times they
  told themselves they were only going to the corner store, or that they could stop
  after one, or that they were keeping the pills for a friend. Staff are instructed
  never to accept ''I couldn''t help it'' as a final answer; the official line is
  that denial is not a symptom to be waited out but a project the resident is running.
  Residents who will not take responsibility are discharged for failure to engage,
