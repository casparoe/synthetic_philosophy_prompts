  Potential structure:


  I direct a residential treatment program for substance use disorders. Our clinical
  protocol combines two things that a philosopher might find in tension.


  First, the disease side. We teach residents that addiction is a chronic brain disease,
  that cravings are neurobiological events, that relapse is often a symptom rather
  than a decision, and that medication-assisted treatment is not cheating. We use
  contingency management: clean urine tests earn vouchers. We train staff to identify
  triggers and to treat a relapse as a predictable consequence of exposure, stress,
  and sleep loss.


  Second, the responsibility side. Every resident must keep what we call a choice
  journal. In it they narrate each relapse in the first person active: not "the craving
  took over" but "I chose to use." They must complete a bad faith inventory, listing
  occasions on which they deceived themselves about their own intentions—times they
  told themselves they were just going to the corner store, or that they could stop
  after one, or that they were only keeping the pills for a friend. Staff are instructed
  never to accept "I couldn''t help it" as a final answer; the official line is that
  denial is not a symptom to be waited out but a project the resident is running.
  Residents who will not take responsibility are discharged for "failure to engage,"
  even though their files also say they have a chronic relapsing brain disease.


  I want to know what philosophical view of freedom and self-deception this practice
  presupposes. Does it require something like Sartre''s radical freedom—the claim
  that a person is at every moment the author of their situation, that facticity is
  always surpassed by transcendence, and that bad faith is a flight from a freedom
  one cannot escape? Or can the same practice be made sense of under a compatibilist
  view, or under a divided-self view on which the addict is not one agent but a conflicted
  bundle? Which parts of our protocol strictly presuppose radical freedom, which parts
  merely fit it, and which parts are indifferent among several theories? Is the practice
  internally consistent, or does the disease model contradict the responsibility rituals?
  If we replaced the presupposed view with a thoroughgoing psychiatric determinism,
  or with a Sartrean view, what exactly would have to change in our intake forms,
  our group sessions, our discharge criteria, and our language?


