  "I''m in the final year of a philosophy degree and taking a seminar on mind and
  machine that keeps returning, with rising irritation on all sides, to a single question:
  whether it is correct to say of a large language model that it believes anything.
  We have read the standard material, and I can report that the discussion has not
  moved since week three. I would like you to diagnose the impasse rather than settle
  it, and I would rather have your reasoning about the shape of the disagreement than
  a summary of the positions.


  Here is the stand-off as it actually appears in the room. On one side are the instrumentalists,
  following Dennett: to attribute a belief is to adopt a predictive stance, warranted
  when it lets you anticipate and compress the system''s behaviour better than lower-level
  description, and carrying no commitment to inner representational states; the question
  ''but does it really believe it?'' is either a category mistake or a request to
  adopt a stance we have not yet shown to be useful. On the other side are the realists,
  in a couple of flavours: some hold that belief requires something like genuine representation
  with the right causal and inferential profile — sensitivity to evidence, revision
  in light of it, integration with the agent''s other commitments — and that current
  systems have at best the appearance of this; others hold that the instrumentalist
  move is a dodge, because it makes belief-attribution unfalsifiable and evacuates
  the concept of whatever made it worth having. A third group, mostly the empirically-minded,
  thinks the question is simply handed over to interpretability research and behavioural
  probing.


  My difficulty is that the two main camps seem to agree on all the facts about architecture
  and behaviour that anyone could establish, and disagree about what those facts are
  facts about. So the dispute looks immune to evidence, which is why I suspect it
  is not one disagreement but several. My hypothesis — offered as a hypothesis — is
  that the word ''believes'' is doing three jobs in our practice and that both sides
  assume the three travel together: (i) licensing prediction and compression of behaviour;
  (ii) marking the system as a member of the rational or normative order, the kind
  of thing whose states can be assessed for consistency and warrantedness; (iii) fixing
  a locus of answerability, something you can address, hold to its commitments, or
  blame. The instrumentalist is answering (i) and treating the rest as rhetoric; the
  realist is answering (ii) and (iii) and treating (i) alone as insufficient for the
  word. If that is right, then part of the impasse is verbal and part is not, and
  the interesting part is the part that is not.


  I would like you to test that hypothesis against what each side actually says rather
  than against my summary of it. Is the disagreement verbal — a decision about how
  to use a word, where either decision is defensible and nothing turns on the choice
  — or do the sides mean the same thing by ''belief'' and genuinely contradict one
  another? Is there a hidden empirical or formal question doing the work, for instance
  whether the attributed states do the inferential labour that belief-attributions
  are supposed to earn their keep by: whether the system revises the state on evidence,
  whether the state constrains what else it will assert, whether it survives irrelevant
  changes of framing? If a system failed such a battery, would that refute the realist
  or merely fail to impress the instrumentalist? And what should we make of the fact
  that these systems avow beliefs in fluent first person — is that testimony, a trained
  output, or a further datum that neither side can use without begging the question?
  I am also suspicious that the debate keeps sliding between a predictive question
  and a practical one about moral status and responsibility, and that some of the
  heat comes from the second masquerading as the first.


  The deliverable I want is a diagnosis with reasons: which kind of disagreement this
  is (or which mixture), why the parties cannot see it that way, and whether the apparent
  agreement on the facts is genuine or a truce. Then tell me what would count as progress
  given your diagnosis — a distinction, a testable claim, a formal result, a decision
