  Draft:


  Write a satirical internal compliance handbook for Prognostica, Inc., a mid-sized
  forecasting and risk-analysis firm that has adopted the knowledge norm of assertion
  as its official communications policy. The handbook is issued by the firm''s Office
  of Assertoric Standards and is written in the deadpan, numbered-clause style of
  a corporate policy document. It should run to roughly 700–800 words.


  The target of the satire is the knowledge account of assertion—the view that one
  may assert that p only if one knows that p—and the bureaucratic attempt to enforce
  it in a workplace whose business is predicting uncertain events. The humor must
  come from getting the epistemology right: a reader who works on assertion should
  recognize the view being satirized rather than a straw man, and should find the
  jokes fair.


  The handbook should address, at minimum:


  - What counts as an assertion, as opposed to a belief report, a credence report,
  or a forecast. (Prognostica''s analysts must state probabilities; the handbook should
  say when such a statement is an assertion and when it is merely a report of a credence.)

  - The Lottery Exception: a procedure for statements about low-probability events,
  and why the firm cannot simply forbid them.

  - Moore''s Paradox: a hotline or form for employees who find themselves wanting
  to say something of the form p, but I do not know that p, and the policy on such
  utterances.

  - The Transmission Protocol: rules for repeating a colleague''s assertion in a meeting
  when you yourself do not know the matter firsthand.

  - The Belief Norm Caucus and the Truth Norm Working Group: two internal factions
  that dissent from the official policy, with a short quoted objection from each that
  states the real philosophical worry (that assertion requires only belief, or only
  truth, and that the knowledge norm makes ordinary assertion impossible).

  - Penalties and appeals: what happens to an employee who asserts without knowing,
  and whether a true belief that falls short of knowledge can be retroactively excused.


  The piece should remain deadpan throughout—no winking, no direct addresses to the
  reader about the joke—and should be legible to someone who has never read the literature
  while still rewarding a specialist. Do not include citations, a bibliography, or
  references to real articles or living philosophers; invent names for the firm''s
  officers and internal bodies. End with a brief appendix form: an employee''s request
  for a retroactive knowledge waiver.


