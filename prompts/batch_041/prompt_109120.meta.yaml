  argument, not the apparatus.


  The disagreement: My friend insists that Plato''s proposal in the Laws for supervised
  drinking parties cannot be sincere. Plato, he says, is the great defender of reason
  against appetite; the idea that he would recommend intoxication as a tool of moral
  education is either irony or a grudging concession to the fact that people will
  drink anyway. On his view, the drinking-party discussion is a kind of thought experiment
  that Plato expects the reader to see through. I think this gets Plato backwards.
  The Athenian Stranger treats wine as a device for revealing and testing character:
  a person who is drunk is stripped of the social masks that normally hide his desires,
  and a well-run symposium can therefore function as a controlled experiment in self-mastery.
  If that is right, the proposal is not a lapse from Plato''s rationalism but an application
  of it: the lawgiver uses a dangerous pleasure to train the very virtue that reason
  demands. My friend says this makes Plato sound like a proto-behaviorist who thinks
  virtue can be drugged into people. I say it makes him a psychologist who understands
  that character is only visible under pressure.


  Please adjudicate this dispute in essay form. Consider at least three possible readings:
  that Plato is straightforwardly serious about the pedagogical value of supervised
  drinking; that he is ironic or deliberately paradoxical; and that he is serious
  but only within a much narrower argument about how a legislator should handle pleasure
  and pain. For each reading, explain what textual and philosophical evidence would
