  Potential prompt:


  I am a graduate instructor in philosophy, and next month I have to run a seventy-five-minute
  session on Quine''s indeterminacy of translation for a group of second-year students
  who have had some Frege and Russell but have never read Quine. I have been arguing
  about this with a friend who insists the whole thing is just the obvious point that
  translation is hard, and I want the session to make the difference vivid rather
  than to leave them with a slogan. Do not explain the thesis to me; plan how I should
  explain it. I need the order in which the components have to be introduced and why
  each depends on the previous one, the one carrying example that should do the work,
  the misconceptions the students will predictably bring or form and exactly where
  in the sequence I should head each off, one question or task I can use at the end
  to see whether they have understood the thesis rather than merely memorized its
  name, and a short list of things I should openly refuse to cover at this level with
  a sentence on why each is being deferred. I do not want a reading list, citations,
  or suggestions for further reading; the plan should stand on its own.


  For the carrying example, I do not want to use the usual rabbit and the usual gavagai
  term, because too many of them will have encountered it in passing and will think
  they already know the shape of the argument. I want to build the session around
  a made-up field-linguist case, and I would like you to help me design it before
  you plan the sequence. Imagine a linguist working with a small community whose language
  has a word, tala, used in all and only the situations where an English speaker might
  say rabbit, rabbit-stage, or undetached rabbit-part, and a particle, shek, used
  in all and only the situations where an English speaker might say because, and then,
  or after. The community''s origin stories use shek in ways that make causal and
  merely temporal readings equally compatible with everything the linguist can observe.
  I want the example to be rich enough that two rival translation manuals can both
  fit the whole corpus of observable behavior but disagree systematically about reference
  and about logical form, and simple enough that students can hold both manuals in
  their heads at once. Tell me what the example must have and what it must lack for
  that to work, then use it as the spine of the teaching plan. The misconceptions
  I expect include: that indeterminacy is just underdetermination by evidence; that
  Quine is a behaviorist who denies inner meaning; that the point is about translation
  difficulty or about cultures being incommensurable; that there is a fact of the
  matter but we cannot know it; and that the thesis entails that all translations
  are equally good. Tell me which of these are real misunderstandings and which are
  defensible readings, where each should be confronted in the sequence, and what the
  students should be able to say by the end that they cannot say at the start. Finally,
  say how confident you are in the pedagogical claims you make, and single out the
  one point in the plan you are least sure about.


