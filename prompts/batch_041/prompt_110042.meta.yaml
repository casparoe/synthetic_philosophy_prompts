  no icon and no cursor anywhere inside the machine, and our impression of an inner
  show with a viewer sitting in it is a useful fiction of the same kind. Now, my department
  hands each postdoc a small pot of money — enough for a two-day workshop with six
  or seven people and their travel — and the justification page is due next month.
  Which means I, a person who has been reading about this for six weeks, have to say
  what the field''s live questions actually are. Absurd, but here we are.


