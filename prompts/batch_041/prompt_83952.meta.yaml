  Draft:


  I have no academic training in philosophy, but I have been reading about the philosophy
  of science on my own for a while, and I have got stuck on the idea that evidence
  underdetermines theory. A friend of mine who did a term or two of philosophy at
  university sent me his attempt at a summary of it, and I cannot tell how much of
  it to trust. He wrote:


  ''Underdetermination of theory by evidence is the thesis, usually credited to Duhem
  and Quine, that evidence can never decide between competing scientific theories.
  Because no hypothesis is ever tested on its own, but always together with a whole
  web of background assumptions, any theory can be made to fit any evidence by adjusting
  the web somewhere else. As Quine put it, anything can be held true if you are willing
  to make drastic enough adjustments elsewhere, and nothing is safe from revision.
  This is not a practical limitation that more data would cure: two theories can be
  made to fit all possible evidence, so the choice between them is ultimately a matter
  of convenience or taste rather than reason. That is why Quine thought we should
  give up the idea that our theories are true, and why the sociology of science later
  took the point to show that what scientists accept is settled by social factors
  rather than by the evidence.''


  My own instinct is that the conclusion is right, and here is the thought that convinced
  me. Take any theory that scientists currently accept, say a theory about how some
  disease works. I can invent a rival: it says everything the accepted theory says
  about anything anyone could ever observe, but adds that there is also an extra entity
  at work, one that by stipulation makes no observable difference. The two theories
  fit exactly the same evidence for ever, so there is nothing to choose between them
  but taste. If that is right, it seems to me that the honest thing to say about all
  our science is that it is just one option among many.


  I would like you to audit my friend''s summary sentence by sentence: tell me which
  parts a philosopher of science would accept as fair, which are the sort of simplification
  they would wince at, and which are simply wrong. I would especially like to know
  whether the distinctions I am missing — I suspect there are some — change anything
  about his conclusion, and whether my own example is a case of the kind the thesis
  is really about or whether I have smuggled something in. Finally, please tell me
  whether the concluding claim about social factors follows from the parts of the
  summary that survive correction. Please write in British English.


