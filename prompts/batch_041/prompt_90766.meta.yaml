  Let me draft the six:


  1. **Incompleteness (the "no verdict" gambit):** deny that rational agents must
  have complete preferences; some pairs of options are simply not comparable, so the
  representation theorem''s premises never apply.


  2. **Lexical thresholds (the "never trade" gambit):** accept completeness and transitivity
  but reject continuity — hold some goods (a life, a principle) to be lexically prior,
  so no finite probability of catastrophe is ever compensated by any amount of a lesser
  good. Accepts the sure-thing principle but is "EU-inconsistent" in the Archimedean
  sense.


  3. **Independence denial (the "framing" gambit):** reject the independence/sure-thing
  axiom, insisting that preferences over lotteries can legitimately depend on what
  the alternatives are, e.g., the value of a gamble is affected by the presence of
  an unchosen third option (Allais-type reasoning).


  4. **Diachronic exit (the "no-resolute-choice" gambit):** accept EU for a single
  choice but deny that rationality requires a plan you''ll carry out; a sequence of
  individually EU-maximizing choices can be one you would have rejected ex ante, and
  there''s nothing irrational about that (the "sophisticated chooser" defense — e.g.,
  a person who prefers not to have the option of taking a bet).


