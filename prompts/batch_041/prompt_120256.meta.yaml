  I spent thirty-five years as a seismologist, much of it trying to estimate recurrence
  intervals for faults whose histories I could only ever observe in fragments, and
  since retiring I have drifted into philosophy; the local philosophy of the social
  sciences seminar has asked me to run one ninety-minute session, for about twenty
  participants (graduate students, two historians, and a pair of colleagues from my
  old department who come for the arguments). What I want from the session is that
  the group should feel the force of the outside view in forecasting — the discipline
  of locating a case inside a reference class of comparable cases, reading a base
  rate off that class, and only then adjusting for what is peculiar to the case in
  hand — without my having to assert it at them. So please design a runnable activity,
  not a lecture: the participants should make consequential forecasts about the fates
  of polities, and the arithmetic of their own choices should do the teaching. I would
  also like the design to end by exposing a puzzle that occupied me for years on the
  other side of the disciplinary fence: once a reference class is fixed, a base rate
  does not by itself tell you whether a long-surviving member of the class is safer
  or in more peril than a young one — whether survival is evidence of robustness or
  only of luck, and whether the hazard in question is memoryless or accumulating.
  I remember the same split in hazard work, between those who read a long quiet interval
  as mounting strain and those who read it as carrying no information whatever, and
  I would like the group to arrive at that split themselves and to notice that it
  is a disagreement about the reference class rather than about the arithmetic.


  The activity should have participants work from a deck of case cards describing
  polities, each card carrying whatever attributes you judge necessary for the mechanic
  to bite — tell me exactly what each card must contain, since I will prepare the
  deck myself. They should choose their own reference classes rather than being handed
