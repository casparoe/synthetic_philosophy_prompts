  "I retired from a marine biology lab a few years ago and have been trying to teach
  myself philosophy since — badly, probably, but I''m enjoying it. Something''s been
  nagging at me that I think is a philosophy question and I dont know where to start.


  Here''s the thing. My daughter married a Norwegian and I''ve spent a lot of time
  over there. There''s this unwritten code people call Janteloven — it comes from
  a 1930s novel by Aksel Sandemose, ten rules that all amount to: don''t think you''re
  anything special, don''t think you''re as good as us. It''s satire in the book,
  but everyone I''ve met over there treats it as a real social norm. Nobody mentions
  their promotion, nobody puts the medal on the wall. The Aussies and Kiwis have a
  name for the same reflex — tall poppy syndrome, from an old story where a king walks
  through a garden and cuts the heads off the tallest poppies, meaning: kill off the
  most eminent citizens. And of course we do the opposite here. Commencement speeches,
  Forbes lists, the whole self-made thing — we build pedestals and then get annoyed
  when someone knocks them over.


  What I can''t work out is what the Jante norm actually assumes. It seems to be all
  about what you''re allowed to think and say about yourself, not about whether you''re
  actually good at anything — you can be the best fisherman in the village as long
  as you don''t act like it. So what theory of the person or of value is buried in
  that? Some possibilities I''ve floated: it''s just envy with a folk name and presupposes
  nothing except that envy gets to have its way; or it assumes claims to merit are
  mostly self-serving noise and can''t be trusted; or it''s about equality of standing
  rather than money — that letting people claim superiority is itself a kind of domination,
  and the only cure is to refuse the whole game; or it assumes success is mostly luck
  so taking credit is a kind of lie; or it''s a real ethics of humility, pride as
  a vice.


  Then the American Dream side: I''d like the same treatment. What does celebrating
  the self-made presuppose about desert, about agency, about what a life is for?


  And the bit that really trips me up — my wife''s cousin put it well, she said: where
  she''s from, everybody''s equal and nobody''s supposed to say so; where I''m from,
  everybody''s free to rise and nobody''s allowed to say it''s luck. Which suggests
  the two cultures disagree less about equality than about whether admiration is a
  fixed pie. You can raise everyone''s income, you can''t raise everyone''s standing
  — is esteem a positional good, and does the Jante norm only make sense if it is?
  Is that the load-bearing presupposition, or is there another one underneath?


  So: reconstruct the implicit theory, tell me which of my readings the practice actually
  needs and which it just happens to fit (I suspect it fits several, which is maybe
  the real answer), whether the parts of it are consistent with each other, and what
  would have to give if you swapped the underlying view out. And tell me if I''m asking
  a badly formed question, because I''ve been out of the seminar game for forty years
  and I probably am."


