  ---


  I run the country-risk desk at a small advisory firm; our clients are pension funds
  and insurers with long-horizon exposure to mid-sized democracies, and every few
  weeks a client asks some version of one question: is country X entering its late-Republican
  phase? Our answers today are impressionistic, and I want to replace them with a
  procedure two analysts — one with a classics degree, one without — can run in a
  single working day and re-run every quarter, so that the desk''s judgments are comparable
  across countries and across time. Build the procedure out of the specific mechanisms
  historians actually invoke to explain the breakdown of the Roman Republic between
  the tribunate of Tiberius Gracchus and the establishment of the Principate, not
  out of the general idea that republics decay.


  I want the procedure to force two things. First, the analyst must commit to which
  reading of the Roman case they are using, because the two generate different diagnostics:
  the structural reading (a city-state constitution mismatched to a Mediterranean
  empire; a dispossessed smallholder class; a slave-labor economy; an army recruited
  from the landless whose loyalty was to the commander who would settle them on land)
  and the contingent reading (a cascade of norm-breaks — the killing of a tribune,
  the first march on Rome, the first proscription — each of which made the next one
  cheaper). Second, for each Roman feature the procedure uses, the analyst must say
  whether the modern case has an analogue, and if it does not, whether that makes
  the analogy inapt or merely incomplete. The Roman case has features I suspect most
  modern cases lack: an unwritten constitution, no permanent civil service, an army
  that became an autonomous political actor, provincial commands as a route to domestic
  power, and emergency decrees that hardened into precedents.


  Give me the questions in the order they should be asked; for each, what counts as
  a sufficient answer, what answer stops the procedure with a no, and what answer
  hands the decision to a human because it is a judgment about values or about acceptable
  risk rather than a fact. Give the procedure a small verdict vocabulary of its own
  — something like apt, decorative, inapt — and say what the desk should tell a client
  under each verdict. Include the points where the procedure will misfire: where it
  will find an analogue if the analyst looks hard enough, where it cannot distinguish
  a republic that survives its crisis from one that does not, and where hindsight
  makes the Roman outcome look inevitable when it was not.


  Then run it on two anonymized client cases. Case A: a mid-sized democracy whose
  head of government has just won a third term after a referendum amended the constitution,
  has enlarged and packed the highest court, has deployed a militarized national guard
  for domestic policing, and is prosecuting the opposition leader on charges his supporters
  call political. Case B: a small parliamentary democracy with a strong constitutional
  court, proportional representation and coalition government, no standing mass army,
  no imperial periphery, and a demagogic leader who won one election and then lost
  the next. I expect the procedure to tell me Case B is decorative at best — I would
  rather it did not, since the client is paying for a Rome narrative. Where the procedure
  gives me an answer I dislike, say so plainly rather than softening the verdict.


  I do not want a historiography, a reading list, or citations; I want the procedure,
  the two applications, and an honest account of what the procedure cannot do.


