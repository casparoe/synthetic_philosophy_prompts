  Draft:


  "I''m a science journalist -- I cover AI and cognitive science for a mid-sized outlet
  -- and I''m on our editorial standards commitee. We have a fight brewing over a
  piece that''s supposed to run Friday. The reporter, who''s good, says she''s found
  a new interpretability result: a team trained a linear probe on a model''s internal
  activations and it decodes a concept they''re calling ''safety-relevant intent''
  with 95% accuracy. She wants the headline to say the model has an internal representation
  of that intent. But the paper also reports that when they ablated the direction
  the probe uses, the model''s behavior barely changed. Another lab, using a different
  technique, found a different direction that decodes the same concept just as well.
  The reporter says the probe''s accuracy is enough to call it a representation; the
  standards committee''s worry is that we''re just reading our own categories into
  the model''s geometry, and that a probe can decode information the model never uses.
  Half the committee wants to spike the story or bury it; the other half says that''s
  overcautious and we should run it with the representational language. I have to
  circulate a short written opinion before Thursday''s meeting. Please draft it: recommend
  whether we run the piece, and if so, what language we should allow in the headline
  and lede, with a concrete deadline for the reporter. Engage the strongest version
  of the losing side -- especially the point that if we refuse to say the model represents
  anything, we might be unable to describe what interpretability research actually
  found. I don''t need a lit review or citations, just the memo."


