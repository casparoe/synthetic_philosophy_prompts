  Setup: A two-person bargaining problem: feasible set S ⊆ R² of utility pairs, disagreement
  point d = (d1, d2) in S, S is compact, convex, comprehensive (downward closed),
  and there''s a point in S strictly above d. Solutions: f(S,d).


  Nash solution: maximizes (u1-d1)(u2-d2) over S; characterized by weak Pareto, symmetry,
  scale invariance (invariance to affine transformations of utility), and IIA (independence
  of irrelevant alternatives).


  KS solution (Kalai & Smorodinsky 1975, "Other solutions to Nash''s bargaining problem,"
  Econometrica): characterized by weak Pareto, symmetry, scale invariance, and individual
  monotonicity (a.k.a. "monotonicity" in the KS sense): if the feasible set expands
  in a way that raises player i''s maximum feasible utility (given the disagreement
  point) but does not lower player j''s maximum feasible utility... more precisely,
  if S ⊂ T and the ideal point of T is weakly greater for both players (a_i(T) ≥ a_i(S)
  for both i, where a_i is the maximum utility player i can get), then every player
  weakly prefers f(T,d) to f(S,d). Note: it''s "individual monotonicity" (as opposed
  to "strong monotonicity" — Roth 1979 showed strong monotonicity is incompatible
  with... hmm, actually Roth''s theorem: no solution satisfies strong monotonicity,
  symmetry, Pareto, and IIA... something like that; and KS satisfies individual monotonicity
  but not strong monotonicity; Nash satisfies neither). The KS solution: on the segment
  from d to the ideal point a = (a1, a2), take the point on the boundary of S. I.e.,
  the unique Pareto-optimal point on the line from d to the utopia point. Equivalently:
  the point that equalizes (u1-d1)/(a1-d1) = (u2-d2)/(a2-d2). So it''s "equal proportional
  gains" relative to disagreement point and ideal point.


  Key conceptual issue: IIA vs. monotonicity — these are the two axioms that a solution
  can''t have both (KS drops IIA, Nash drops monotonicity). And the intuitive content:
  IIA says the solution shouldn''t change when you remove alternatives no one wants;
  monotonicity says improving a player''s opportunities shouldn''t hurt them. The
  conflict: expanding the feasible set can change the ideal point and thus the KS
  solution in a way that hurts someone? No — actually the conflict is that monotonicity
  (individual) is incompatible with IIA given the other axioms (symmetry, scale invariance,
  weak Pareto, and... "strong individual rationality" maybe). There''s a theorem:
  a solution satisfying weak Pareto, symmetry, scale invariance, and individual monotonicity
  cannot satisfy IIA. Because Nash is the unique one satisfying IIA + those, and Nash
  violates monotonicity.


  Concrete: Nash solution can be non-monotonic: enlarging the feasible set can reduce
  a player''s Nash payoff. Classic example.


