  across parameters when the experts'' opinions don''t warrant it changes the answer).

  2. "The decision rules, in the order to apply them" — the filter sequence: first
  check whether all admissible acts agree (interval dominance / whether the choice
  is imprecision-insensitive), then... then choose a rule.

