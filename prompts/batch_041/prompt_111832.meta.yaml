  utility. Including: the procedure must say when to use maximin (when the worst case
  is catastrophic and irreversible), and when maximin is "incoherent" (it ignores
  a lot: it can recommend an act that is dominated by another for every prior, or
  recommend something absurd because of one extreme prior — "maximin is hostage to
  the most extreme expert").

