  KS by... " Actually the nice point: Nash''s solution violates monotonicity in a
  certain sense (the "Nash solution is not monotonic with respect to changes in the
  feasible set" — adding options can hurt a player, famously in the context of the
  "Independence of Irrelevant Alternatives" — e.g., the "Nash bargaining solution
  is not monotone" — indeed, Nash violates "strong monotonicity" (Kalai''s monotonicity)
  while KS satisfies it. Yes: Kalai–Smorodinsky is characterized by Pareto, symmetry,
  scale invariance, and individual monotonicity, while Nash is characterized by Pareto,
  symmetry, scale invariance, and IIA. And IIA vs. monotonicity are incompatible:
  no solution satisfies both (with the other axioms). That''s a beautiful in-the-weeds
  conceptual issue: the axiomatic approach forces a choice between two intuitively
  compelling axioms; the issue is what the choice reveals about the underlying conception
  of bargaining (a "procedural/strategic" vs. "fair-division" conception).


