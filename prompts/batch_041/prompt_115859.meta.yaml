  I am closing a graduate seminar on moral trade, and I would like the last item to
  be a poem rather than a summary — something the students can keep in their heads,
  and something that would survive being read by someone who has never heard the idea.


  The idea, in brief, as I would put it to them. Two people who hold different moral
  views can often make an exchange that each of them regards as an improvement by
  her own lights. The engine is a difference in valuation rather than an overlap:
  each does, funds, or refrains from something that the other ranks higher than she
  does, and receives in return something she ranks higher than the other does. This
  distinguishes trade from compromise, where each side gives up part of what it wanted;
  here both sides get more of what they wanted, each measured by her own standards,
  and no shared scale is needed to see that both come out ahead. It is also why trade
  is troubling. Each party deliberately does something she takes to be of little weight,
  or perhaps to be wrong, in order to move the other toward something she takes to
  be of great weight, and the exchange rate — so many hours of one kind of work per
  so many of another, this many animals per that many bednets — has to be struck without
  either party conceding the other''s values. And trade has a limit that is worth
  pressing: if your view takes the form of an absolute constraint rather than a ranking,
  there is nothing to trade with respect to the forbidden act, since a constraint
  cannot be exchanged for more of anything else. So the gains from trade are, strangely,
  a function of disagreement, and would shrink toward nothing as moral views converged.


