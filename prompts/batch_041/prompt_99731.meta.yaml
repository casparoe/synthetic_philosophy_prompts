  same reaction to contradiction — would that tell against the view, or could a Quinean
  absorb it?

  - What about the anthropological record? Deep and persistent moral disagreement
  is often cited in favour of views like this. But is that actually evidence for it,
  or has it been overread? And conversely, are there cross-cultural regularities that
  would count against a pure attitude-expression picture?

