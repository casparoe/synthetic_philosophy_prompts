  The position I''ve come to hold, roughly in Quine''s spirit: moral judgements aren''t
  in the business of tracking truth the way scientific claims are. They''re more like
  expressions of preference or directives for coordinating behaviour. Quine''s naturalism
  says reality is described from within science, and ethics isn''t a part of that
  enterprise — it''s something else we do with language, continuous with wanting rather
  than believing. Moral disagreement, on this picture, isn''t a disagreement about
  facts that one side might be getting wrong; it''s more like a clash of attitudes.
  And the upshot is that there''s no moral reality for our moral claims to answer
  to, and no truth of the matter for the philosopher to uncover. Ethics becomes a
  kind of engineering: shaping desires, not discovering truths.


  What I want from you: what would count against this? Not just the usual objection
  that it makes moral argument pointless, but a real map of its exposure.


  A few things I''d especially like you to sort through:

