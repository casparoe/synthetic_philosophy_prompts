  Question:

  "In Fear and Trembling, Johannes de Silentio asks whether there is a teleological
  suspension of the ethical. Explain what this means, how it differs from the sacrifice
  of the tragic hero, and why Silentio says he cannot understand Abraham. Then assess:
  does the book commit its author to moral antinomianism—the view that the ethical
  can be overridden by a private divine command? In your answer, be careful to distinguish
  the pseudonymous narrator''s claims from Kierkegaard''s own views, and explain the
  roles of the knight of infinite resignation and the knight of faith."


  Student answer:

  "Johannes de Silentio argues that the ethical is the universal, which applies to
  everyone and can be mediated in language. The tragic hero, like Agamemnon, sacrifices
  his daughter for a higher ethical end—the good of the state—and so his act remains
  within the ethical; it is tragic because he must violate a particular duty for a
  higher duty. Abraham, by contrast, is not sacrificing Isaac for the sake of the
  state or any higher ethical good. His act is for God, and so the ethical is teleologically
  suspended: it is not abolished, but it is set aside relative to a higher telos,
  the individual''s absolute relation to the absolute. This is why Silentio says Abraham
  is either a murderer or a knight of faith; from within the ethical, the act looks
  like murder. Abraham''s silence follows from this: the universal is the medium of
  speech, so he cannot explain himself. He cannot make himself understood, and this
  is his distress. Kierkegaard''s central claim is that faith requires a leap beyond
  the universal, and that the knight of faith is the one who, having made the movement
  of infinite resignation, believes by virtue of the absurd that he will receive Isaac
  back. The knight of infinite resignation gives up everything and is reconciled to
  loss; the knight of faith goes further and believes the impossible. Abraham is therefore
  not a tragic hero but a knight of faith. As for antinomianism, Kierkegaard does
  not simply say that any divine command overrides ethics. The suspension is not a
  general rule; it is a paradox that cannot be mediated. Silentio repeatedly says
  he cannot understand Abraham, and he does not present him as a moral example to
  be imitated. However, the logic of the suspension does imply that when an individual
  has an absolute relation to God, the ethical can be overridden, and so the book
  does leave open the possibility that a private divine command can justify what would
  otherwise be murder. That is why the book is so unsettling. But this is not moral
  relativism, because the telos is God, not the individual''s preference. The knight
  of faith is not the same as the knight of infinite resignation; the latter is a
  preliminary movement, while the former adds the absurd belief that Isaac will be
  restored. So the teleological suspension is not a rejection of ethics but a paradox
  that faith alone can inhabit."


