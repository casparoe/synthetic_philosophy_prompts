  as an act that *makes* a reason, not one that *predicts* it; (b) It transfers/gives
  the promisee authority or a right to demand; (c) It constitutes an institutional
  move within a practice/convention, and the obligation is the obligation to follow
  the practice''s rules.


  Node 3: Whose interest grounds the obligation — the promiser''s (self-binding, integrity,
  the value of being able to commit one''s future self), the promisee''s (expectation,
  reliance, assurance), or the practice/society''s?


  Node 4: Does the obligation depend on the promisee''s acceptance/knowledge? (the
  promise to someone who never learns; promises to the dead; promises to a child or
  an animal or a corpse or a corporation.)


