  You are a political philosopher specializing in democratic theory, and I want your
  considered judgment on a foundational question rather than a survey of the literature.
  Please reason carefully and, before you commit to a verdict, spend a few lines brainstorming:
  spell out in your own words what each position below is actually committed to and
  what intuitive appeal it draws on.


  The question is the boundary problem — how we are to determine who belongs to the
  demos, the body entitled to decide. I want you to compare two answers.


  The first is the all-affected-interests principle: the demos should comprise everyone
  whose interests are affected by the decisions in question; being affected is what
  grounds a claim to a say.


  The second is the all-subjected principle: the demos is exactly the set of persons
  over whom the polity''s binding, coercive rules claim authority; being subject to
  the law, rather than being affected by outcomes, is what grounds membership.


  A colleague of mine adds a distinction I would like you to keep in view. She separates
  the authorization question — who gets to decide — from the concern question — whose
  interests the decision must answer to — and suggests that conflating them is what
  makes the boundary problem look harder than it is. I am not sure she is right, but
  I would like the comparison to say whether either principle respects the distinction
