  Content plan:


  Round 1 (A, the "heuristic" defender): Take a deterministic fact you can''t compute
  — e.g., whether a particular large number is prime, or the 10^12th digit of pi.
  We assign probabilities anyway, and we do it by "heuristic argument": treat the
  digit as a uniform draw, and multiply when you need several digits. He says this
  is not a fudge, it''s a principle: when nothing you know links two unknowns, presume
  they''re independent. Call it presuming independence. It''s what makes the reasoning
  work at all, and it''s the only default that isn''t secretly smuggling in information.


  Round 2 (B, the objector): Independence is a claim about the joint distribution,
  not a description of your ignorance. Two unknowns can be perfectly correlated even
  if you know nothing about either. And the default can be *self-undermining*: presuming
  independence gives different answers depending on how you carve up the possibilities.
  Example: consider the unknown number N. Presume the last digit is uniform, presume
  the parity is uniform... Also, the "presume independence" recipe is sensitive to
  description: e.g., "the number is prime" vs "the number''s factors". Also there''s
  the classic: if you presume independence between a statement and its negation you
  get contradictions.


