  treatment contradicts, and moreover it''s *provably* wrong under the symmetry argument
  that also justifies uniformity: if you''re truly ignorant of the bias, you should
  be indifferent to relabeling heads/tails, and the flat prior on p is the canonical
  representation. So presuming per-flip independence yields a joint that no exchangeable
  prior over p agrees with. That''s a solid point: it''s not just a different convention,
  it violates exchangeability. Actually the 1/32 answer: is it exchangeable? Yes,
