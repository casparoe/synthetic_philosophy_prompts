  I''m not against it. But I spent a career around illusion-talk and I don''t think
  it''s being used the way we use it, so before I read any more I want the spec.


  So: give me the list of requirements any theory has to meet to be entitled to say
  consciousness is a user illusion — as opposed to just saying it as a slogan. For
  each, the case or consideration that makes it a requirement (the experiment, the
  everyday fact, the intuition — whatever''s carrying the weight). Say which are non-negotiable
  and which are just house rules of one camp. And flag any two you think can''t be
  met at the same time; if there''s a contradiction buried in the list, that''s the
  part I actually want.


  Three things I''d put on it, and you can tell me if any are bad requirements:


  1) The spectator problem (my name for it, sorry). An illusion is an illusion *to*
  somebody. If the whole point is that there''s no inner spectator to be fooled, then
  what is the word "taken in" doing in the theory? I want to know whether that''s
  a real requirement or whether I''m just being hypnotized by the metaphor (yes, I
  see what I did there).


  2) A pair of cases I made up. Case A: every measurable sign of pain is present —
  the right machinery lit up, the right behavior — but the patient calmly and fluently
  denies feeling a thing, and it isn''t a lie or a deficit. Case B is the mirror:
  the patient insists on agonizing pain, describes it in loving detail, but the machinery
  is doing nothing out of the ordinary. Whatever the theory is, I''d want it to have
  something to say about both, and about why one of them is the "real" case and the
  other isn''t.


  3) Where does the illusion break? When we call something an illusion in my field
  — the flow of time, the solidity of a table — we mean a description that''s simpler
  than the truth, works for a purpose, and we can say exactly where it fails. So a
  requirement: the theory should be able to say what the user gets wrong, and when.
  If nothing could ever catch the user out, I''m not convinced "illusion" is earning
  its keep.


  Then tell me which single requirement does the most damage to the popular views,
  and whether you think anything survives the whole list.


  Don''t bother with a reading list — I''m not near a library and names won''t help
