  Draft:


  "I chair the admissions and standards committee of a state licensing board for [profession].
  Every third year we are required to re-justify each of our entry requirements to
  the legislature, and each time we do it badly: the incumbents defend whatever they
  had to go through, the newer members point out that the requirements cost applicants
  a year of income, and we end up voting on whether a requirement ''seems relevant.''
  I would like a procedure we can actually run in a committee meeting, on one requirement
  at a time, that tells us whether a given costly entry requirement is doing the work
  we claim it does.


  Background you should take as given. Our staff analyst has written a short memo,
  which the committee has accepted as its working position, setting out what has to
  be true for an expensive requirement to be a credible signal of the competence we
  are charged with certifying rather than merely a toll on the people who want to
  enter the field. The memo''s conditions:


  (1) Differential cost. The requirement has to be cheaper for applicants who already
  have the trait we care about than for applicants who lack it. A cost that is the
  same for everyone, or that scales with family money, spare time, or willingness
  to absorb abuse, is not screening for competence; it is screening for those other
  things.


  (2) A sanction on the wrong type. The signal only stays honest if applicants who
  lack the trait and acquire the credential anyway are worse off for having done it.
  So the procedure has to ask what the credential actually buys, and whether that
  payoff punishes the applicant who is a poor fit; if the credential is simply required
  to work at all, then the only penalty for the wrong type is the cost itself, and
  the requirement is a tax, not a test.


  (3) Separation, not pooling. If the requirement can be satisfied by nearly everyone
  eventually, or if it ratchets upward as applicants compete, it stops separating
  anyone from anyone. The memo distinguishes requirements that are absorbing (met
  once, held forever, like a degree) from requirements that recur (met again and again,
  like hours or exams), and says the two need different treatment.


  (4) A direct index beats a costly ritual. Where a cheap test measures the trait
  itself rather than standing in for it, a costly proxy is dominated, even if the
  proxy also correlates with competence.


  (5) Revealing versus producing. If the requirement actually creates the competence
  rather than revealing it, the signaling story does not apply to it, though the fairness
  questions about who can afford to acquire it do.


  (6) Who pays. Costs borne by the applicant, by their family, by clients, or by the
  public are not interchangeable, and the memo says we should record which is which
  before we vote.


  The committee has also been warned about two failure modes it should design around:
  the best applicants may be the ones who skip the costly requirement, so its presence
  among strong candidates proves less than it seems; and a requirement that was informative
  when it was rare may be worthless once it becomes universal.


  What I want from you: a procedure, in the order we should run it, for reviewing
  a single entry requirement. For each step, say what question we ask, what evidence
  counts as an answer, what we do if we cannot get that evidence (we have almost no
  outcome data linking requirements to later performance, and we are not going to
  get any), and which steps end in a verdict -- keep, keep with modification, replace,
  abolish -- and which end in a referral to the full board because the question has
  turned into a value judgment about who should bear the cost of entering the profession
  rather than a factual one. Include a short version for the ~15 minutes we will actually
  have per requirement, and mark the places where the short version is unsound.


  Then run it on three of our actual requirements:

  - 1,200 hours of supervised practice, unpaid, which applicants usually complete
  over a year while working another job;

  - a written entry exam with a 45% first-attempt pass rate, retakeable for a fee;

  - a requirement that licensees complete 40 hours of in-person continuing education
  every two years, in a state where the nearest provider is a five-hour drive from
  two of the three population centers.


  At least one of the three should come out badly for us, and I want you to be explicit
  about which and why, including what we would have to give up.


  Finally, tell me what this procedure cannot do: which questions about our entry
  requirements it will not settle, which of the memo''s conditions are doing real
  work in the procedure and which we could drop without changing our verdicts, and
  where the procedure is a value judgment wearing the clothes of an audit."


