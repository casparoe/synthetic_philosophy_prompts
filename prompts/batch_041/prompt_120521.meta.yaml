  Option C: Gibbard–Satterthwaite and strategy-proofness. Belief set: (1) I think
  the Gibbard–Satterthwaite theorem shows there''s no reasonable voting rule that''s
  strategy-proof; (2) I think that in real elections, strategic voting is rare/limited;
  (3) I think markets are the solution to preference aggregation; (4) I think Arrow''s
  theorem and G-S are "impossibility results about aggregation, not about deliberation";
  (5) I think the right response is to design institutions where the dominant strategy
  is honest (e.g., VCG mechanisms) — tension: VCG requires quasilinear preferences,
  transferable utility, and is vulnerable to collusion, plus it''s only strategy-proof
  in dominant strategies with money; and it fails the G-S conditions by using money.
  Genuine tension: (a) I believe G-S is a deep obstacle to democratic aggregation,
  (b) I believe deliberative democracy can overcome the impossibility results — these
  conflict because G-S is a theorem about the mechanism regardless of deliberation,
  unless you hold that deliberation changes preferences (endogenous preferences) which
  violates the fixed-preference assumption. That''s a nice genuine tension: if you
  hold that preferences are legitimately transformable by deliberation, then the impossibility
  theorems'' antecedent (fixed preference profiles) doesn''t apply, but then you lose
  the guarantee that the aggregation is even defined... Also tension: (c) "I think
  the theorem''s unrestricted domain is too strong, since real preferences are single-peaked,
  so I don''t worry" — that''s the standard escape, and it works only for some settings.
  Also tension with (d) "I think randomized mechanisms are fine" — G-S doesn''t apply
  to randomized (non-deterministic) social choice functions, so Gibbard''s extension
  to random social choice gives Gibbard''s random dictatorship-ish result for strategy-proofness
  in the "strong" sense (Gibbard 1977: any strategy-proof probabilistic social choice
  function with weak stochastic dominance is a random dictatorship). That''s in the
  weeds but known? Maybe too niche.


