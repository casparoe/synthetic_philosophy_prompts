  Student answer draft:


  "Two-dimensional semantics starts from the observation that when we consider a sentence
  like ''water is H2O'' we can consider it in two different ways. The first dimension
  is the epistemic or a priori dimension: we ask what the word ''water'' would pick
  out in a scenario considered as actual, where a scenario is a centered world, i.e.,
  a possible world with a marked centre. This gives us the primary intension of ''water'',
  which is the watery stuff — the clear, drinkable, odourless liquid that fills the
  oceans and lakes and falls as rain. On Twin Earth, where the same role is filled
  by XYZ, the primary intension picks out XYZ. So the primary intension varies from
  scenario to scenario, and this is why we can conceive of water not being H2O: conceivability
  tracks the primary intension.


  The second dimension is the subjunctive or metaphysical dimension: we ask what ''water''
  picks out at a world when we hold the actual world fixed. Here the answer is H2O
  at every world, because it is the actual watery stuff, H2O, that fixes what the
  term refers to. That gives us the secondary intension, which is constant across
  worlds, and that is what makes ''water is H2O'' necessary. So the necessity is metaphysical
  and the a posteriority is epistemic: you need to know what the actual world is like
  to know that water is H2O, but once you do, you know something that holds in all
  worlds.


  The framework is Fregean in spirit: the primary intension plays the role of sense,
  and the secondary intension plays the role of reference — sense determines reference,
  and the reason we are ignorant a priori is that the sense does not determine reference
  until we know which world is actual. This means the view does commit us to descriptivism
  about natural kind terms, since speakers must grasp the descriptive content of the
  primary intension in order to use the term at all.


  One consequence is that ''water'' is not a rigid designator after all. Rigidity
  would mean picking out the same thing at every world, but the primary intension
  picks out H2O at some scenarios and XYZ at others, so the term only picks out the
  same thing relative to a fixed scenario. Two-dimensional semantics therefore shows
  that Kripke was wrong to call natural kind terms rigid; what he was really tracking
  was the stability of the secondary intension, which is not rigidity but just the
  fact that we evaluate counterfactuals with the actual world held fixed."


  Then maybe a closing line: "This is why Chalmers can use the framework to defend
  the conceivability of zombies."


