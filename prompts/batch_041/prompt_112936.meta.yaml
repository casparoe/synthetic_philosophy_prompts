  Standard 2D: For a term like "water", the primary intension is a function from centered
  worlds/scenarios to extensions: at a scenario, "water" picks out whatever is the
  watery stuff (the stuff that plays the water role) there. The secondary intension
  is a function from worlds to extensions: at world w, "water" picks out whatever
  the actual watery stuff is, i.e., H2O, in w. So "water is H2O" is a posteriori (you
  need to know the actual world) but necessary (secondary intension of water = H2O
  at all worlds where H2O exists).


