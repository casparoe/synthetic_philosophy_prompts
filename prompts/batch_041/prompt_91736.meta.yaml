  Let me now think about what a good, deep answer would look like, so the prompt elicits
  it. Desiderata for an account of what determines the correct application of a rule
  / what it is to follow a rule:


  1. Normativity: the account must preserve the distinction between a correct and
  an incorrect application — meaning must be normative, not merely descriptive. (Case:
  I can be wrong; "I meant plus, so 68+57=125 is the right answer" — the compulsion
  to say I meant plus.)

  2. Error and surprise: must allow that a speaker can make a mistake and be corrected,
  and can be surprised by their own past usage. (Case: my past usage is finite; any
  finite set of past applications is compatible with deviant rules.)

  3. Finitude/extension: must explain how a finite practice determines an infinite
  (or open-ended) range of correct applications.

  4. Objectivity/non-triviality: must not make correctness depend on what anyone would
  in fact say (that collapses correctness into agreement/actual use); must avoid "whatever
  seems right is right."

  5. Must not be circular/vacuous: cannot say "correct = what the rule requires" (the
  rule itself needs interpretation); must answer the regress of interpretation.

  6. Must respect the fact that rule-following is a practice/habitual, not an act
  of interpretation at every step (the regress argument). This is a requirement that
  pulls against 1/4.

  7. Publicity/teachability: meaning must be something that can be conveyed and checked
  by others; must explain how another person can know what I mean (a "private" account
  fails).

  8. Must handle the "lone rule-follower" case: it must say whether the practice requires
  a community — if it does, it must explain how the first rule-follower existed; if
  it doesn''t, it must say what makes the lone person''s application correct.

  9. Must not make meaning causally inert/epiphenomenal (if dispositions determine
  meaning, then meaning has no normative grip).

  10. Must explain why some deviant interpretations feel absurd rather than merely
  unlikely — the phenomenology of the "compulsion."

  11. Must be consistent with the obvious fact that rules can be followed unreflectively
  and that instruction works.


  Pairs that can''t be jointly satisfied: normativity (correctness independent of
  actual use) + naturalism (meaning determined by facts about use/dispositions) —
  the classic tension. Also: publicity/communitarian constraint + the lone rule-follower
  case (if a community is needed, what about the first speaker / a solitary mathematician
  / an isolated individual who later is discovered?). Also: finiteness of past use
  + determinacy of future application (the skeptical paradox''s core). Also: the regress
  requirement (no interpretation at every step) vs. the requirement that the rule
  itself determine applications.


