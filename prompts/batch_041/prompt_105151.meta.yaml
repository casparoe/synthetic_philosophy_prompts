  - it has to force them to say *which* feature of the solution does the work — the
  absence of a global time function / objective simultaneity, or the closed timelike
  curves themselves — and then to consider a variant: imagine a spacetime with CTCs
  but also a preferred foliation (a frame-independent way of slicing it into "now"s).
  Would Gödel''s conclusion still go through? I think the answer is no, and I want
  that on the mark scheme.

