  universe has closed timelike curves and that this means "time travel", and they
  can say he thought time was unreal, but when you push them on *why* the rotation/CTCs
  are supposed to show anything about time being unreal they just say "no global time
  so becoming isn''t objective" and then they''re out of moves. I want the question
