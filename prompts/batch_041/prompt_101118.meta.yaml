  We need earlier verdicts jointly consistent with more than one plausible rule. Let''s
  identify rules:

  - Rule A (independent evidence): A legend is historical only if there is independent
  evidence (archaeological or documentary) from roughly the right time and place.
  Trojan War: some evidence -> historical in outline. Arthur: no evidence -> not historical.
  Exodus: no evidence -> not historical.

  - Rule B (kernel + plausibility): If the legend describes a plausible event that
  could have happened in that time/place, and there''s some material culture continuity,
  count the core as historical even without direct evidence. Trojan War: plausible
  -> historical. Arthur: plausible (post-Roman Britain) -> maybe historical. Exodus:
  plausible (Semitic slaves in Egypt) -> maybe historical. But Rosa says Arthur not
  historical and Exodus not historical, so Rule B doesn''t fit unless she adds "but
  only if there''s some evidence." So Rule B might be "kernel plus at least some evidence."
  Then it''s same as A.

  - Rule C (supernatural content): If the story''s central events require miracles/gods,
  treat it as myth, not history. Trojan War: gods intervene, but she still calls it
  historical in outline, so not C. Exodus: miracles -> myth. Arthur: magic -> myth.
  This fits Arthur and Exodus but not Trojan War. Unless she says the *war* is historical
  but the *story* is myth.

  - Rule D (multiple independent sources): If multiple independent sources close in
  time attest, historical. Trojan War: Hittite + archaeology? maybe. Arthur: no. Exodus:
  no. This is similar to A.

  - Rule E (criterion of embarrassment): If the story includes details that are embarrassing
  to the authors, they''re more likely historical. Exodus: includes Israelite grumbling,
  maybe? Arthur: not.

  - Rule F (archaeological match): If there''s a destruction layer matching the story,
  historical. Trojan War: Hisarlik layer VIIa -> historical. Arthur: no site -> not.
  Exodus: no site -> not. This is a version of A.

  - Rule G (plausibility of scale): If the event is on a scale that would leave evidence
  and it doesn''t, not historical. Exodus: large -> no evidence -> not. Trojan War:
  small enough? Actually Hisarlik is small. Arthur: small -> no evidence -> not. Hmm.

  - Rule H (chronological distance): If the earliest sources are centuries later,
  not historical. Arthur: centuries later -> not. Exodus: centuries later -> not.
  Trojan War: Homer centuries later but Hittite records closer? -> historical. This
  fits.


