  Now the taxonomy must have named leaves. Positions on psychiatric classification:

  1. Strong medical/naturalist realism: categories approximate natural kinds (brain-based,
  causal).

  2. Weak/pragmatic realism or instrumentalism: categories are useful fictions/tools,
  not natural kinds (DSM''s own "atheoretical, descriptive" stance).

  3. Social constructionism (strong): categories are social inventions serving interests,
  no biological essence.

  4. Eliminativism/anti-psychiatry (Szasz): "mental illness" is a myth (except brain
  disease); the category is a moral/legal judgment.

  5. Dynamic nominalism/looping-effects realism (Hacking): the kind is real but interactive;
  the classification is part of the causal story; neither natural nor arbitrary.

  6. Promiscuous realism / pluralism (Dupré): many overlapping real kinds; classification
  is interest-relative but not arbitrary.

  7. "Harmful dysfunction"/hybrid (Wakefield): disorder = dysfunction + harm, a hybrid
  of fact and value.

