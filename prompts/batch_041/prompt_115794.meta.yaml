  diagnostic manual and ended with her insisting that psychiatric classification does
  not discover kinds of people so much as manufacture them, and that this is why no
  one can tell her what depression really is. I pushed back, and we both kept reaching
  for the same handful of examples — the walking fugues that French physicians catalogued
  in the 1890s and that no longer occur, the epidemic of dissociative identity disorder
  diagnoses in the 1980s and its steep decline since, the quiet removal of hysteria
  from the manual and its apparent replacement by other labels, the adult who reads
  a list of autism traits online and comes away diagnosed. What struck me afterwards
  was that we were not really disagreeing about the examples; we were disagreeing
  about what makes a diagnostic category hold together at all, and about whether a
  category''s effect on the people it classifies is a defect in it or part of its
  nature. She also floated a proposal I cannot get out of my head: if the classification
  itself causes distress in some of the people it captures, why not add a category
  for that harm, and let the loop feed back into the manual? I could not say whether
  that was a serious extension of her view or a reductio of it.


