  Potential final:


  I am assembling a position statement for a graduate seminar on practical reason,
  and I want a consistency audit before I circulate it. My commitments are these:


  (1) The Grip Condition: a consideration is a normative reason for an agent to act
  only if it can engage some element of her wide motivational set—her desires, values,
  projects, and self-conceptions, including those she would endorse on reflection.
  A reason that could never grip her is no reason for her.


  (2) The Warrant Condition: some considerations—gratuitous cruelty, betrayal of trust,
  and the like—are reasons for every agent, even for an agent whose wide motivational
  set contains nothing that could engage them. Warrant is not reducible to grip.


  (3) Rationality is fundamentally coherence among attitudes: beliefs, desires, intentions,
  and emotions ought to fit together in the usual ways (consistency, means-end coherence,
  proportionality). Rationality itself supplies no substantive ends.


  (4) An agent can be fully coherent in the sense of (3) and still be criticizable
  for failing to act on a consideration that is a reason for her. The criticism is
  not merely that her attitudes fail to cohere; it is that she has failed to respond
  to something that counted in favor of acting.


  (5) The phrase has a reason is systematically ambiguous between (a) there is a consideration
  that counts in favor of the agent''s acting, and (b) the agent is in a position
  to act, or has the opportunity and capacity to act. These two readings should not
  be run together.


  (6) Normative reasons justify rather than merely explain. An explanation of why
  someone acted may cite a consideration that was not a reason for her at all; a normative
