  base contains P, she knows P∨¬P (a logical truth) because P occurs in it. So the
  agent still knows some logical truths automatically, and indeed infinitely many:
  from P, the containment condition allows P∨¬P, P∨(P∧P), etc. Actually if every atomic
  proposition in B occurs in Γ, then from P we can infer P∨¬P (contains P), P∨(P∧P)
