  I''m a second-year PhD student and my partner is a cosmologist, which is how I ended
  up spending most of last month thinking about whether anything we do could matter
  if the universe is spatially infinite and roughly uniform. The short version of
  the position I''ve talked myself into: to compare two possible worlds each containing
  infinitely many lives, you line the lives up in some order (say, by the natural
  numbers), compute the running difference between the two worlds'' cumulative welfare
  as you go out, and then look at where that running difference goes. If it settles
  on a positive number, the first world is better; if it settles on a negative one,
  worse; if it settles on zero, they''re equally good; if it never settles, the worlds
  simply aren''t comparable in respect of welfare. I think this is the right axiology
  and not just a bookkeeping device -- and I like that it keeps finite differences
  finite: on this view adding one extra happy life to an already infinite world of
  happy lives makes that world better, and adding one extra miserable life to an infinite
  paradise makes it worse, which seems to me exactly what you want, since the alternative
  is that an infinity of bliss swallows any finite amount of torture. (I think this
  is the approach people call "limit"-based, though I can never remember whose it
  actually is.)


