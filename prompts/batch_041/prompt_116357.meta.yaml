  already got and can''t tell how seriously to take: (1) the verdict seems to depend
  on how I line the lives up -- if I reorder them the running difference can settle
  somewhere else, or not settle at all, and I can''t see why my arbitrary bookkeeping
  should decide which world is better; (2) if the running difference doesn''t converge
  I get incomparability, and I worry that "not comparable" is doing an awful lot of
