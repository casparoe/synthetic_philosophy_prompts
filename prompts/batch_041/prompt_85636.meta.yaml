  LOT desiderata draft:

  Requirements:

  1. Productivity/systematicity: must explain how a finite system thinks indefinitely
  many novel thoughts, and why thinking one entails capacity for related ones (the
  "aRb → bRa" data). Case: anyone who can think "the dog bit the postman" can think
  "the postman bit the dog."

  2. Compositionality/constituency: must explain why thoughts have parts that can
  be shared across thoughts — and must say whether the parts are *vehicles* (real
  sub-symbols in the head) or only *contents*. (Fodor''s point: only a vehicular account
  gives you the explanations.)

  3. Must not collapse into "thought is inner speech" — the requirement: whatever
  the format is, it must be explained how it differs from any natural language, and
  how a creature with no natural language thinks (infants, animals, aphasics). Case:
  pre-linguistic infants, and people with global aphasia who still reason.

  4. Concept acquisition without circularity: must explain how a mind gets new concepts
  without already possessing the concepts needed to represent what it''s learning
  (Fodor''s paradox of learning). If all concepts are innate, the theory is consistent
  but empirically awful; if none, you need a learning mechanism that itself deploys
  representations.

  5. Must accommodate non-sentential thought: maps, images, motor plans — the "maps
  vs. sentences" challenge. Requirement: say whether these are distinct formats and
  how they interlock, or argue they''re all sentential underneath. (This is where
  it gets in the weeds: Camp, Rescorla.)

  6. Must not make "language" vacuous: if "language" just means "compositional representational
  system," then LOT is trivially true (everything from maps to neural nets is "language-like"),
  and the theory says nothing. So: the syntax must do work — must be specified enough
  that there''s a fact about which structures are well-formed, and those facts must
  be doing explanatory work.

  7. Must be answerable to what we know about the brain / must not require a homunculus
  reading the symbols.

  8. Must say what the relation is to the neural implementation — must not be committed
  to the symbols being localized, etc.


  Tension: (4) + (2) + (1)? Fodor''s own paradox: you can''t learn a concept unless
  you have it. So (4) as stated is unsatisfiable given the vehicular compositionality
  requirement — that''s the classic no-go. And (5) vs (2): if you allow map-like/iconic
  formats, compositionality in the strong sense fails; if you insist on vehicular
  compositionality, you must explain away the imagistic data. So plausibly (2)+(3)+(4)
  jointly unsatisfiable? Good.


