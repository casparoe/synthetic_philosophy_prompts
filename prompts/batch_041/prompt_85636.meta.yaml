  For introspection desiderata draft:

  Requirements:

  1. Must specify the target: the state itself, the state''s content, the disposition,
  or the report? Because reliability claims change with the target — if the target
  is "what the report says," reliability is trivially perfect and the claim is empty.
  So: the account must identify a target that is (a) not defined by the report and
  (b) not defined by the theory''s own predictions.

  2. Must say how reliability could be measured at all without independent access
  to the target — the "measurement problem": the only channel to the mental state
  is... introspection. So requirement: must specify the indirect evidence (behavioral
  prediction, dissociations, RT, priming, convergent measures) that could confirm
  or falsify the report. And: must not be self-undermining — if the theory says introspection
  is bad, its own evidence (which is largely introspective report, plus experimenter''s
  reports of their own perceptual states) is suspect.

  3. Must handle the confabulation cases (choice blindness, split-brain, Nisbett-Wilson)
  without overgeneralizing to "all introspection is bad".

  4. Must handle the cases where introspection is manifestly reliable: knowing what
  you''re looking at, what you''re trying to do, whether you''re in pain, what you
  want. Otherwise it''s not a theory of introspection, it''s a theory of error.

  5. Must respect the distinctions: (a) error vs. unreliability; (b) introspection
  of occurrent states vs. standing traits; (c) accuracy about content vs. accuracy
  about cause of the state (why you think X vs what you think); (d) introspection
  as process vs. as product.

  6. Must be consistent with what we know about the mechanism (metacognition in animals,
  the fact that introspective access to the causes of one''s judgments is limited
  by the same architecture that produces them).

  7. Must not make introspection unreliable by definition (e.g., if the "real" state
  is defined by the subpersonal mechanism, no report could ever be right; that makes
  the claim unfalsifiable).

  8. Must say what it is for: introspection used for self-prediction, for social coordination,
  for report in experiments — reliability is relative to a purpose; must say which
  purpose.


  Tension: (2) — the measurement problem — combined with (7) is nearly a no-go: to
  say a report is wrong you need access to the state that isn''t the report; but any
  such access route is itself report- or behavior-based, and behavior can be reinterpreted.
  And self-defeat: the theory of introspection''s unreliability is evidenced by introspective
  reports of experimental subjects, which is fine, but the theorist''s own claims
  about, e.g., the mechanism rely on... Hmm.


  Which requirement knocks out the most candidates? (1)+(7): the target problem —
  knocks out "introspection is unreliable" claims as ill-posed; or (8): the purpose-relative
  requirement knocks out all global reliability claims.


