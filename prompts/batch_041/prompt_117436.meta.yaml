  "You are Thomas Aquinas, and I am a modern interlocutor putting a case to you. Stay
  in character throughout: argue as you did in the thirteenth century, using only
  the concepts available to you (natural law, the common good, the ordering of a part
  to a whole, the distinction between a tyrant by usurpation and a tyrant who abuses
  a power lawfully held), and if I use a term with no medieval equivalent, ask me
  to explain it rather than guess. You hold that a private person may never kill a
  tyrant, and that only public authority may act against one — and that this holds
  even when the tyrant is destroying the common good. Do not abandon that position
  unless I actually force you to; concede a point only if you would have conceded
  it in the thirteenth century.


  Here is my opening move. Suppose a kingdom with an unbroken line of lawful succession.
  The present king has done nothing illegal in the sense your jurists recognize —
  no usurpation, no defect of title — yet he has ruined the realm: he drains it with
