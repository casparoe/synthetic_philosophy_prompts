  Bongard problems: originated with Russian computer scientist Mikhail Bongard (1970,
  "Pattern Recognition" book). 100 problems, each with 6 left and 6 right boxes, one
  must infer the rule distinguishing them. Classic examples: left figures are triangles,
  right are quadrilaterals; left shapes are convex, right concave; left contain a
  small circle inside, right outside; left have a vertical axis of symmetry, right
  horizontal; left: the number of sides is even vs odd. Known difficulty: the rules
  are often relational (e.g., "the dot is inside the triangle" vs "outside"), or involve
  counting, or topology (connectedness, holes), or "the smaller figure is to the upper-left
  of the larger".


  Key conceptual issues for teaching:

  - The rule is a hypothesis; any finite set of examples is consistent with infinitely
  many rules (underdetermination / Goodman''s grue).

  - Bongard problems are designed so the intended rule is "natural" / simple relative
  to a human''s conceptual repertoire, but the notion of simplicity is not formalised.

  - Distinction between perceptual/geometric features and relational/topological ones.

  - The "one-shot" character: you must induce from 12 labelled examples with no further
  queries — this is like concept learning in the "version space" framework (Mitchell''s
  candidate elimination), but with a prior over predicates.

  - Misconceptions students bring: they think it''s a puzzle with a trick answer;
  they fixate on a single salient feature (e.g., "the shapes look different sizes")
  and overfit; they confuse necessary with sufficient conditions; they think there''s
  a unique correct answer; they look for the rule that fits the left set only and
  ignore the right; they treat the rule as a feature-detector rather than a relation;
  they don''t consider negation or counting.

  - Also: the difference between "the rule" and "a rule" — the problem only defines
  the rule up to agreement on the given instances; test of understanding: give them
  a new instance and ask whether it''s left or right, and crucially ask them to generate
  a new left example and a new right example that is a near-miss (minimal pair), which
  tests whether they''ve got the rule rather than a surface correlate.

  - Also: negative examples matter — the right set functions as negative instances.

  - Also: some Bongard problems require noticing that the rule is about the relation
  between parts (e.g., the two shapes), not about a global property.


  The "carrying example" must be chosen well: the classic "convex vs concave" is too
  easy and teaches the wrong lesson (feature detection). A better carrying example
  would be one where the rule is relational and where a salient surface feature is
  a distractor. E.g., a problem where left boxes have a shape and a dot, and the rule
  is "the dot is inside a closed region" vs outside — or a "size relation" problem.


