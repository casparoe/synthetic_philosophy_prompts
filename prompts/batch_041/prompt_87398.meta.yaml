  defeasible marker into a necessary-and-sufficient criterion; the proposal''s authors
  typically present it as a provisional marker and caution that lacking the marker
  isn''t evidence of absence (the "no evidence of absence" point). Also, the criterion
  is framed as sufficient-ish evidence, not a definition.

  3. Conflating a *marker* (an epistemic/inferential tool) with a *constitutive* claim
  about the nature of consciousness.

