  Final prompt draft:


  "A science magazine article I read recently explains a proposal in animal cognition
  as follows. Biologists and philosophers, it says, have now given a scientific answer
  to the question of which animals are conscious: the mark of consciousness is the
  capacity for open-ended learning — the ability to acquire an indefinite range of
  new associations, rather than a fixed repertoire of conditioned responses. Animals
  that have this capacity are conscious, and animals that lack it are not. Since the
  capacity first shows up in the fossil record in the Cambrian, consciousness is a
  Cambrian invention. The practical upshot is that fish, insects, and other animals
  that fail the test are not conscious, so the current wave of concern about their
