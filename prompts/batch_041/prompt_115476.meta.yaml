  What''s confusing about it? Good angle: Turing''s claim that the child machine should
  be simple and that education should be a process of reward/punishment, plus his
  suggestion that we shouldn''t expect the "child machine" to be found by direct design
  but perhaps by a kind of evolutionary search, and his remark that the "search for
  the child machine" via evolution would be too slow so the experimenter''s intelligence
  must be used. The confusing thing: is Turing''s "education" a metaphor for training,
  or does he mean something more like actual schooling in a culture, where the machine
  must learn from a teacher''s approval and disapproval and also learn things like
  "do not tell lies"? Actually in section 7 he does discuss teaching the machine by
  rewards/punishments, and the difficulty of the teacher knowing whether the pupil
  is attending, and he proposes the machine be given a "punishment" signal.


  The specific puzzle I can pose: Turing seems to oscillate between two pictures —
  (a) the child machine is a blank, simple, randomly-wired device that gets shaped
  by education, and (b) the child machine must already have a lot of structure built
  in, so that education is only a small adjustment. And also: he treats education
  as a matter of reward and punishment (pleasure/pain signals), which is a behaviorist
  picture, but then he wants the resulting machine to be able to do mathematics and
  understand language — is the behaviorist picture enough? Also: he says the machine
  should be allowed to make mistakes and that the teacher''s approval is the only
  "truth" signal, which raises the question of whether there''s any difference between
  teaching a machine and conditioning it.


  Also Turing suggests that the "child machine" might be produced by a process analogous
  to evolution, and he makes the point that the experimenter should not rely on random
  mutation and selection because it''s too slow; he should use his own intelligence
  to design the machine. Ask: what exactly is the epistemic status of that argument?
