  Color phi phenomenon: Kolers and von Grunau (1976) "Shape and color in apparent
  motion" — two dots of different colors flashed in different positions; subjects
  report seeing a single dot moving and changing color midway, and crucially the color
  change is experienced before the second dot appears (i.e., before the information
  that would tell you the color change has occurred). This seems to require backward
  referral / retroactive construction of the experience. Dennett (1991) Consciousness
  Explained discusses it, and the Orwellian vs. Stalinesque distinction: Stalinesque
  = the brain holds a show trial, i.e., revises the content of experience before it
  is "published" to consciousness (so no actual revision of past experience, just
  delayed presentation); Orwellian = the brain publishes the experience and then retroactively
  rewrites the record (the experience really was of one thing, later revised in memory).
  Both are "revisionist" accounts; the difference is where in the process the revision
  happens relative to the moment of consciousness. Dennett argues that in the color
  phi case (and in general) the distinction is empirically undecidable / that the
  question presupposes a "finish line" in the brain (the Cartesian theater), which
  is the real problem. Also relevant: Libet''s experiments and the "backward referral"
  of the timing of conscious intention (though Libet is about readiness potential
  and awareness).


