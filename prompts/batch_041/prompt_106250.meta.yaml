  Draft:


  Everyone knows the shape of the argument: a peacock''s tail is expensive, and because
  it is expensive, only a healthy peacock can afford one; the hen reads the expense
  as evidence of health. Generalizing, a signal is credible in proportion to what
  it costs, and it is honest because the cost is heavier for the signaler who has
  less to advertise. Call this the toll model of credibility: you buy your way past
  the receiver''s skepticism.


  I want to argue that the toll model is being asked to do two distinct jobs, and
  that it only does one of them well. The first job is to explain why a receiver should
  take the signal at face value. The second is to explain why a low-quality signaler
  does not simply pay the toll and lie. Differential cost answers the second job.
  It does not answer the first, and in many real cases the first job is done by something
  else entirely. A receiver who reasons "that must have been expensive, therefore
  it is true" is relying on a background assumption — that the expense is genuinely
  beyond the reach of pretenders — which is exactly what the second job was supposed
  to secure. The toll model is therefore not a general account of credibility; it
  is one mechanism among several for making signals unfakeable.


  If we sort signals by where the cost of a fake would fall, four kinds appear. Handicaps:
  the faker pays, and pays more than the honest signaler. Locks: nobody pays, because
  the signal is physically tied to the thing signalled — a frog''s croak is deep because
  the frog is large, and there is no way to be small and croak deep. Audits: a third
  party pays, or rather, is paid to check, and the faker is exposed by an inspector
  rather than by the arithmetic of his own budget. Leaks: the faker pays again, but
  in the opposite direction — what is expensive is not producing the signal but suppressing
  it. Blushing, a cracking voice, the exhaustion that shows through in the last mile
  of a race, the safety record a firm cannot keep out of the newspapers: these are
  credible not because they cost something to display but because they would cost
  something to hide, and the signaler would rather not display them at all.


  The fourth category is the one I care about, because it inverts the toll model''s
  psychology. In a handicap, the signaler is buying credibility. In a leak, the signaler
  is failing to buy silence. And I think a great many signals that are usually filed
  under "costly" are leaks in disguise. Consider the credibility of long-term consistency:
  someone who has behaved generously for thirty years is believed, and we say the
  behavior is credible because it would be exhausting to fake. But the exhaustion
  is not a toll paid at each act of generosity; it is the cost of maintaining a persona
  across thirty years of unscripted situations. The expense is in concealment, not
  in display, and that is a different mechanism with different predictions — for one
  thing, a leak should become *less* reliable as the signaler gains control over the
  channel, which is why institutions invest in public relations and why the credibility
  of a firm''s safety claims is not a function of how much it spends on advertising
  them.


