  Let''s draft:


  "I recently received a genetic result that I had been half-expecting for years —
  a variant that raises the risk of a condition that runs in my family — and I have
  been struck by how quickly I move from the statistical language of heritability
  to the fatalistic language of a script. I am also preparing a session for a film
  club, and I want to read Gattaca through the lens of heritability: what it does
  and does not mean. Please give me a reading of the film that takes both the film
  and the science/philosophy seriously. I want the technical meaning of heritability
  kept firmly in view: it is a population-level variance statistic, not a property
  of an individual; it can be high even when environments matter enormously; it does
  not license individual prediction; it does not entail immutability; and it is not
  the same as genetic causation. Please also bring in the point that heritability
  estimates are environment-dependent — change the range of environments and the estimate
  can change — and the distinction between heritable and inherited. Use those ideas
  to interrogate the film''s central conceit, a society that sorts people by genetic
  profile and treats the result as destiny. Where does the film dramatise something
  real about the difference between a population statistic and a personal fate? Where
  does it trade on the very confusion it might be warning against — for example, by
  making genetic advantage look like a fixed script rather than a norm of reaction?
  Which scenes best illuminate the gap between heritability and determinism, and which
  scenes resist the reading? I am especially interested in whether the film''s ending
  vindicates the idea that genes are not destiny, or whether it quietly replaces genetic
  determinism with a different kind of voluntarism. Finally, say what the film adds
  to the debate that an argument about heritability alone does not — and where the
  honest critic has to admit the film is not really about heritability at all."


