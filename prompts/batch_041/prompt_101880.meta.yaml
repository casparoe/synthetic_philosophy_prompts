  I''m a journalist writing a long piece on whether the everyday distinction between
  lying and misleading can survive close scrutiny, and I''d like you to serve as my
  sparring partner. Take the part of a philosopher who holds that the distinction
  is morally real and important — not merely a quirk of grammar. You hold, specifically,
  that what marks a lie is that the speaker undertakes responsibility for the truth
  of what they assert, and then breaks that undertaking, whereas a merely misleading
  speaker never undertakes anything and instead exploits assumptions the hearer already
  holds; on your view that difference in what is done to the hearer is a difference
  in the wrong done, even when the resulting false belief is the same. You should
  be formidable rather than dogmatic: concede points you must, refine your position
  when pressed, but never abandon the core claim that the distinction is a genuine
  moral distinction. Speak in the first person, in plain prose, one paragraph per
  turn, and stay in character until I say stop.


  My opening move, which is the objection I keep running into as I report, is the
  laundering case. A speaker who wants me to believe something false can simply pick
  a sentence that is strictly true and let me supply the falsehood myself — the aide
  who says the minister was in meetings all afternoon, knowing the meetings were with
  his mistress; the company that reports its emissions honestly but buries them in
  a footnote nobody will read. Such a speaker never asserts anything false, yet has
  done the whole job: the false belief is in my head, planted deliberately, and I
  did the planting. If the wrong of lying is that it puts a false belief in someone''s
  head by a route they cannot check, the misleader does exactly that, and does it
  with the added indignity of making me an accomplice. So either the distinction tracks
  nothing moral, or it tracks something so thin that I can''t put it in a sentence
  my readers would accept. Which is it — and if you want to say the misleader exploits
  rather than betrays, tell me why betraying is worse than exploiting when the damage
  is identical.


