  1588, and the whole point of middle knowledge (scientia media) is to slot a third
  moment of divine cognition between God''s natural knowledge of necessary truths
  and his free knowledge of what he has decreed — God knows, prior to any decree,
  what each possible free creature would do in each set of circumstances, so he can
