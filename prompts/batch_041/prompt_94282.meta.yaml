  Let me design concretely:


  Setting: reading group I run, ~10 grad students in phil of mind/cog sci, 75 min.


  Materials: a large open floor area taped into a grid (or just open floor), a deck
  of private "sim cards" (one per participant), colored sticky dots/vests to mark
  two or three states, a stopwatch, two clipboards (one for the sim-level ledger,
  one for the symbol-level ledger).


  Rules: each participant is a sim. Each gets a private card with a simple local rule
  that depends only on the state of the nearest neighbor within reach: e.g., "if the
  sim nearest you is red, step toward them; if blue, step away; if no one within arm''s
  reach, stay still." The rules are drawn from a small set, and the distribution is
  fixed so that clusters will form. No talking. Participants can only see colors,
  not who is who. The facilitator periodically applies an "external perturbation"
  at the edge — e.g., calls out a color and everyone in that color state takes one
  step toward the wall. This is the boundary condition.


  What happens: stable clusters form, drift, and persist. Then the facilitator introduces
  a "symbol": a specific cluster shape (e.g., three red sims in a line with two blue
  behind) that, in the past few rounds, has always immediately preceded the perturbation.
  Participants-as-sims will find themselves moving in ways that track this shape.
  Two ledgers: an observer records only sim-level events (who stepped, in what direction,
  following what local rule), another observer records only cluster-level events (which
  clusters formed, where they moved, what shapes appeared). Then compare.


  The key moment: after the run, ask each sim "did anything push you besides your
  neighbor?" Everyone says no — only the neighbor. Then ask the symbol-ledger observer
  to predict the next round using only cluster-level info, and the sim-ledger observer
  to predict using only sim-level info. Show that the symbol-level ledger can predict
  a lot, and yet the sim-level ledger contains all the causal goings-on. Then the
  crunch question: when a simmball "pushed" a sim, what did it add? Either nothing
  (the sim was going to move anyway, given its neighbor) or something (the cluster-level
  fact constrained which local rule fired). Have them argue it out in pairs, with
  one assigned to defend "the symbol did no work" and one "the symbol did work," and
  require each to say what would have to be different in the world for them to be
  wrong.


  Also add: a "counterfactual test" — rerun the same initial conditions but change
  one sim''s local rule deep in a cluster, and see if the macro outcome changes; then
  rerun changing a boundary perturbation, and see. If the cluster-level story predicts
  outcomes that the sim-level story also predicts, that''s the deflationist''s evidence.
  If some macro outcomes are robust across sim-level differences, that''s the emergentist''s.


  Debrief mapping: sims = substrate, simmballs = symbols, the perturbation = sensory
  input, the symbol-ledger = the intentional/folk-psychological description, the sim-ledger
  = the physical description. The felt force: it will seem obvious to the participants,
  mid-game, that the cluster "made them" move; afterwards, the local-rule account
  is complete. The idea they should come away seeing: that the question "do symbols
  push the substrate around?" is not settled by pointing out that the micro-story
  is complete, because completeness of the micro-story is compatible with the macro-story
  being the one that does explanatory and counterfactual work — and conversely, the
