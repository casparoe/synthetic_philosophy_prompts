  Draft:


  I''m putting together a session for a undergraduate seminar on the philosophy of
  fiction and games, and I want to use Undertale as the central case. The question
  I want the students to sit with is the one the game seems designed to force: do
  video-game characters matter morally? Not in the easy sense of whether we should
  be nice to other players, and not in the sense of whether the fictional events are
  real, but whether the monsters you meet in the Underground are the kind of thing
  that can be wronged, or whether the only thing at stake when you kill them is your
  own character or the aesthetic quality of your playthrough. The game complicates
  this by making the player''s power to save and reload part of the fiction: you can
  undo deaths, and the characters mostly do not remember; but the game itself does
  remember, and a genocide run leaves a mark that a later pacifist run cannot fully
  erase. I want a reading that takes both the game and the philosophy seriously.


  I should also give some philosophical scaffolding: distinguish (a) the view that
  video-game characters have moral status in their own right, as simulated or fictional
  moral patients; (b) the view that they do not, but that our treatment of them is
  nonetheless assessable because it expresses or cultivates traits of character (cruelty,
  curiosity, playfulness, or what have you); and (c) the view that the game''s design
  itself makes moral demands on the player, so that the relevant question is not what
  the characters are but what the game is asking of us. Then ask: which of these does
  Undertale dramatize, and where does it resist the reading? For instance, does the
  game''s punishment of the genocide route (the corrupted ending, the sense that the
  world has been permanently altered) constitute an argument that the characters matter,
  or only an argument that the player''s choices matter? And does the game''s use
  of the reset mechanic vindicate the idea that fictional suffering is "not real"
  and therefore not morally weighty, or does it show the opposite—that the characters''
  inability to consent to being reset is precisely what makes the player''s power
  over them morally troubling?


  Also ask about the paradox of fiction: we know the monsters are not real, yet the
  game solicits real guilt, real grief, real affection; the paradox of fiction asks
  whether such responses are rational; the moral question is whether such responses
  can ground a genuine obligation. Does Undertale treat the player''s emotional engagement
  as evidence of moral status, or does it treat it as a trap—a sentiment the game
  can manipulate because it controls the fiction? And what, if anything, does the
  game add to the philosophical debate that argument alone does not—e.g., about the
  moral significance of interactivity, about the difference between a reader''s complicity
  and a player''s, or about whether the moral status of a fictional being can be constituted
  by the practices of the community that engages with it?


