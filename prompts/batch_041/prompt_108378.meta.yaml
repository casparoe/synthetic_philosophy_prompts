  Potential prompt:


  I teach a 300-level metaphysics of mind seminar with eighteen students, and the
  meeting on mental causation is seventy-five minutes. Every year the causal exclusion
  argument lands flat: they can recite the premises and they can see that the conclusion
  follows, but they do not feel why anyone would think that admitting mental properties
  as causes threatens physicalism, or why the epiphenomenalist conclusion is supposed
  to be so disturbing. I want a runnable classroom activity that makes them feel the
  squeeze themselves before I name it. The setting is a seminar room with movable
  chairs and a whiteboard; no technology beyond that; the students have read a short
  piece on causal closure, supervenience, and the no systematic overdetermination
  premise, so they know the vocabulary but not the argument''s emotional force. Design
  a role-play or structured deliberation in which the group must assign causal credit
  for a single human action—I am happy for you to choose the action, but I am imagining
  something like a juror changing her vote after deliberation, or a person with a
  compulsive checking habit acting on the compulsion—among at least four candidate
  causes: a physical realizer, a mental property, a reason or content, and a social
  or environmental factor. The rules should make double-counting impossible and gaps
  intolerable: for example, each candidate cause must be given a share of a fixed
  causal budget, but any candidate that is sufficient on its own must receive the
  whole budget, and the group is forbidden from saying that two sufficient causes
  each did the full work. I want the mechanics to generate the exclusion result as
  a felt discovery, not as a announced premise. Include the roles, the materials,
  a minute-by-minute timeline, the exact rules of the budget or scoring system, the
  scenario, and a debrief that maps each moment onto the exclusion argument''s premises,
  the distinction between event and property exclusion, the difference between overdetermination
  and supervenience, and the standard replies—reductionism, non-reductive physicalism,
  emergentism, and the claim that the argument proves too much. Also tell me what
  will predictably go wrong the first time I run it: which groups will game the budget,
  where the analogy to actual causation will break, and how I should handle a student
  who insists that mental causes are just different descriptions of the physical cause.
  Be honest about which feature of the exclusion argument the activity cannot reproduce—for
  instance, the modal strength of the closure premise or the difference between causation
  and causal explanation—and what I will have to supply in the debrief.


