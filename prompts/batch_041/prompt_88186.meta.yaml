  Hinge of history: The claim that we live at a uniquely influential time. Key subtleties:

  - Ord''s argument: the "hinge" doesn''t require us to be at the most influential
  moment ever; it requires that the expected value of influencing now is higher than
  at other times, and that the future''s expected size is astronomically large.

  - The "reciprocal" / "pass-through" argument: if we''re at a hinge, then... hmm.

  - The critique: hinges are self-undermining — if we know we''re at a hinge, that
  knowledge is itself available to others; also "the hinge of history" faces the "many
  hinges" objection: any generation could argue the same; there''s no way to be at
  the most pivotal moment from inside history except by luck. Also "the observational
  selection effect": you can only be at a hinge if there''s something special about
  the present.

  - The "ex ante vs ex post" point: the argument that the probability of being at
  a hinge now is roughly the fraction of total value... Actually there''s a nice argument:
  the "hinge" claim is a claim about the derivative of the future.

  - The "sorites of influence" / "the argument from the asymmetry of the past and
  future": past is fixed, future is open, so the future matters more — but that gives
  every generation a hinge, so it''s not distinctive.

  - Also, the "time of perils" vs "hinge" distinction.

  - Nick Beckstead''s "On the Overwhelming Importance of Shaping the Far Future" —
  the claim that the effect of actions on the far future dominates.

  - Also relevant: the "value of information" / "option value" argument.

  - Also: the "we''re early" argument (Bostrom''s "we live in the most important century"
  — actually that''s Holden Karnofsky).

  - Also: a nice in-the-weeds idea: the argument that if we''re at a hinge, we should
  expect to be bad at identifying which actions matter (the "hinge of history is a
  claim about the derivative, and the derivative is unmeasurable"), and the "epistemic
  humility / Pascal''s mugging" issue.


