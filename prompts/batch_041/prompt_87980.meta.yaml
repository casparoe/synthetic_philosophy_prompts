  Desiderata:

  1. Explain macro-level regularities/patterns (e.g., segregation, inflation, bank
  runs) as outcomes of individual action or as structural facts.

  2. Account for downward causation/constraint: social structures shape individual
  preferences/opportunities without being reducible to any individual''s beliefs.

  3. Account for micro-to-macro aggregation/composition, including unintended consequences
  and multiple equilibria.

  4. Respect supervenience: social facts don''t float free of individuals; no spooky
  group minds.

  5. Allow for multiple realizability: same social pattern from different individual
  mechanisms; same individual mechanism yields different macro patterns depending
  on structure.

  6. Explain persistence/transmission across generations and change/transformation.

  7. Preserve explanatory asymmetry: citing a social structure can explain individual
  behavior, but citing individual behavior may not explain the structure (or vice
  versa).

  8. Handle social kinds/classifications that are causally efficacious and historically
  variable (looping effects).

