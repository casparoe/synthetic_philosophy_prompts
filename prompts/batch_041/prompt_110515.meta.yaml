  "I have no academic training in ethics, but I have been trying to work out for myself
  when the everyday conventions of a place -- how to tip, how to queue, when to cross
  the street, where to stand on an escalator -- are things I am actually obligated
  to follow, and especially when they bind a visitor who did not grow up with them.
  I have a set of gut verdicts, and I would like to know what principle, if any, captures
  them. I suspect the answer will have to distinguish conventions that are load-bearing
  in the sense that they allocate some burden or benefit among people from conventions
  that are more ornamental, but I am not sure that distinction survives the cases.


  Here are my verdicts. In a country where tipping is the norm, I am a visitor and
  leave no tip after ordinary service. I think that is wrong, though somewhat less
  wrong than if I were a resident. In a country where tipping is not the norm and
  may even be awkward or insulting, I am a visitor and leave a large tip. I do not
  think that is wrong, exactly -- it may be gauche, but it is not a moral failure.
  In a place where people queue in a strict line, I am a visitor and accidentally
  join by standing at the side; someone points to the back, and I go. I think I did
  nothing wrong, but I would have been wrong to refuse to move. If I knowingly cut
  the line because I was in a hurry, I think that is wrong, and not much less wrong
  because I am a visitor. In a city where jaywalking is common and unenforced, I cross
  against the light with everyone else; I think that is fine. In a city where jaywalking
  is genuinely frowned on, I cross against the light as a visitor; I think that is
  wrong, even if no one is harmed and no one is even likely to see me. In a place
  where people stand on the right and walk on the left of an escalator, I stand on
  the left with a suitcase. I think that is wrong, but mainly because I am blocking
  people, not because I have violated a rule as such. In a home where guests are expected
  to remove their shoes, I keep mine on. I think that is wrong, and more clearly wrong
  than the escalator case. At a market where haggling is expected, I pay the first
  price. I think that is not wrong, just foolish. At a communal kitchen where no rule
  is posted but everyone cleans up after themselves, I leave my dishes. I think that
  is wrong, even though there is no sign. Finally, in a country where small payments
  to officials are customary for permits, I pay one. I think that is wrong even though
  it is the local convention, because it harms people who cannot pay or who are shut
  out. But I do not think a visitor is obligated to adopt every local practice that
  locals themselves treat as normal; something about the payment case seems different
  from the shoe case, and I cannot say exactly what.


  What I want is a principle, or a small set of candidate principles, that makes sense
  of these verdicts. I am particularly interested in whether the load-bearing versus
  ornamental distinction can be stated precisely enough to do the work, and if not,
  what should replace it. Please test the principle against the cases above, including
  the ones where I am unsure, and tell me which of my verdicts it forces me to give
  up. I would also like it to say what it predicts for cases I have not listed: a
  visitor who speaks a different language and cannot read a posted rule; a local who
