  Summary draft:


  "Supererogation is the category of actions that are morally good but not morally
  required — acts ''beyond the call of duty.'' The paradigm case is the soldier who
  throws himself on a grenade, or the organ donor who gives a kidney to a stranger.
  Supererogatory acts are supposed to occupy a distinctive place in the moral landscape:
  they are not obligatory (you don''t do wrong by omitting them) but they are also
  not merely permissible, since they''re positively good and praiseworthy. So the
  traditional division of acts into the forbidden, the permissible, and the obligatory
  is incomplete; there''s a fourth category, the supererogatory, which is really the
  realm of the morally optional — the space where morality permits you to do as you
  like, but praises you if you do more.


  The puzzle, sometimes called the paradox of supererogation, is that if an act is
  genuinely good — if the world is better for its being done — then it''s hard to
  see why we don''t simply owe it to people to do it. Either it''s good to do it,
  in which case it looks required, or it isn''t, in which case it looks like we shouldn''t
  praise it. That''s why the concept is usually taken to show that any moral theory
  that doesn''t leave room for it must be wrong: strict Kantianism, which makes duty
  the whole of morality, has no place for the hero, and act utilitarianism, which
  tells you to maximize the good at every moment, makes every optimific act obligatory,
  which is why utilitarianism is so often said to demand too much. The upshot is that
  a plausible morality has to be demanding enough to require the basics but leave
  a space above and beyond that isn''t required — though some philosophers worry that
  this space is where self-indulgence hides, and that the idea of a moral saint is
  dehumanizing anyway, which is basically the same worry."


