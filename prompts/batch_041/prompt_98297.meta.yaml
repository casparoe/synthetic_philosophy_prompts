  Actually a good unifying concept candidate: "the dilution of duty under universality"
  — like how a duty becomes less binding the more people it applies to. Related to:
  Singer''s "drowning child" vs. the diffusion of responsibility literature (Darley
  & Latané), the "identified vs statistical victim" effect (Schelling), "the collapse
  of compassion" (Slovic), and to Kant''s own problem in the hospitality article (universal
  hospitality means everyone has the right to visit, so it can''t be a right to settle
  — the universal right must be thin). Also to "the tragedy of the commons." Also
  "the paradox of the universal duty." Also to the "self-limiting duty."


  Hmm, and Kant''s Third Definitive Article is exactly this: the right of hospitality
  is limited because it is universal — because if everyone had a right to stay, no
  state could survive, so the right must be reduced to a right of temporary sojourn.
  That''s a nice philosophical anchor: the universality of the duty is the reason
  for its thinness. So the phenomenon the asker describes: a duty whose content shrinks
  as its scope expands.


