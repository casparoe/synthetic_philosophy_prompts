  Essay:


  "The standard objection to Leibniz''s doctrine of the best of all possible worlds
  is that it cannot be reconciled with the amount and distribution of evil. If God
  could have actualized a world with less suffering, then this world is not the best.
  Leibniz''s reply is usually read as a cost-benefit defense: God had to allow some
  evil because it is a necessary means to greater good, or because the alternatives
  contain even more evil. I want to propose a different reconstruction. On my reading,
  Leibniz''s best is not a scalar maximum of net value. It is the maximal compossible
  set of substances under a constraint. God''s understanding contains an infinite
  set of possible substances, each with its own complete concept. Not every subset
  is compossible: some substances cannot coexist because their complete concepts imply
  incompatible predicates. A possible world just is a maximal compossible set. The
  best world is not the one that scores highest on a single scale of good minus evil;
  it is the one whose maximal compossible set realizes the greatest perfection, where
  perfection is a structural property of the whole—its order, variety, and intelligibility—rather
  than the sum of local utilities. Evil enters not as a price paid for greater good,
  but as a consequence of finitude and incompossibility: a world of finite substances
  cannot contain every possible perfection, and the exclusion of some perfections
  is experienced by creatures as privation, pain, and sin. On this reading, the objection
  from evil assumes an aggregative axiology that Leibniz does not hold. The objector
  asks why God did not choose the world with less suffering; Leibniz''s answer is
  that there is no such world among the compossible sets, because suffering is not
  a separable item that can be minimized independently of the structure that makes
  a world the best. The analogy I find helpful is constraint satisfaction. Imagine
  a set of formal constraints—each possible substance is a variable, and compossibility
  relations are constraints on which assignments can be jointly true. A solution is
  a maximal consistent assignment. The best solution is not the one that maximizes
  a weighted sum of satisfied preferences; it is the one that satisfies the constraints
  in the most elegant and comprehensive way. If this analogy is right, then the problem
  of evil is not a problem about God''s benevolence but about whether the constraints
  themselves are good. That is a different and harder question, and Leibniz may not
  have an answer to it. The essay''s thesis is therefore partly deflationary: the
  best-of-all-possible-worlds doctrine is not a theodicy in the ordinary sense, but
  a claim about the structure of possibility. It does not explain why this world contains
  these particular evils; it explains why any world at all must contain some exclusion.
  Whether that is a strength or a fatal evasion is what I want to know."


