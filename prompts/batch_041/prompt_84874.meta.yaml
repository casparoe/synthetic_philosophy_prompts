  Essay:


  Title: Two Kinds of Vagueness, and Why the Sorites Puzzle Is Only Sometimes a Puzzle


  Body:


  1. The puzzle. A heap of sand: one grain is not a heap; if n grains are not a heap,
  n+1 grains are not a heap; so no number of grains makes a heap. A man with no hairs
  is bald; adding one hair never turns a bald man into a non-bald one; so no one is
  ever non-bald. Standard observation: one of the premises must be wrong, but each
  seems forced. I gather that the literature contains a family of responses: that
  truth comes in degrees; that borderline sentences are neither true nor false because
  there are many equally admissible ways to sharpen the predicate; that the boundary
  is perfectly sharp and we simply cannot know where it lies. I am in no position
  to adjudicate among these, and my essay does not try to. My claim is that the puzzle,
  as stated, conflates two quite different situations, and that once they are separated,
  one of them is not puzzling at all while the other is more puzzling than the usual
  formulation suggests.


  2. The distinction. [Define constitutive vagueness vs resolution vagueness, with
  the lab analogy.]


  In the lab, we had a rule: a sample is ''contaminated'' if the concentration of
  X exceeds 5 μg/L. The predicate ''contaminated'' was sharp. But the procedure by
  which we decided whether it was satisfied was not: below about 1 μg/L the instrument
  could not distinguish a sample from a blank. So there was a band in which the procedure
  returned no verdict. Nobody thought this made contamination vague. The quantity
  was what it was; the instrument had a resolution.


  Compare ''heap''. Here, I claim, the procedure is not an instrument aimed at an
  antecedent fact; the procedure — counting, comparing, judging by eye — is what settles
  the matter. But it too has a resolution: it delivers verdicts on the clear cases
  and nothing in the middle. Call the first kind of borderline case (where the predicate''s
  satisfaction conditions are themselves open, so that no procedure could settle it)
  constitutive vagueness, and the second (where the conditions are settled by a procedure
  that is too coarse to reach the cases) resolution vagueness.


  3. Why this matters for the paradox. In the resolution case, the tolerance premise
  — if n grains make a heap then n−1 do — is not a claim about heaps at all; it is
  a claim about our procedure, and it is simply false of the procedure, because the
  procedure does not have that kind of transitivity: it yields verdicts at the ends
  and no verdict in the middle, and ''no verdict'' is not a verdict we can iterate.
  The paradox is generated by treating the absence of a verdict as a verdict.


  But note: ''no verdict'' cannot be a third truth value in the ordinary sense...
  hmm, actually the essay wants to propose a partial status. Let me be careful about
  the logic. The essay can say: the correct description is that the predicate is partially
  defined: its extension and anti-extension are fixed by the procedure, and there
  is a gap. The tolerance premise is then not false but undefined/inapplicable for
  the gap cases. Whether that''s a coherent option is exactly what I want comments
  on.


  Also: this isn''t epistemicism, because I don''t say there''s a hidden sharp fact;
  and it isn''t the "many admissible sharpenings" view, because I don''t say the sharpenings
  are equally admissible — I say the procedure just stops, and that''s a fact about
  the procedure, not about our knowledge or about a space of precisifications. If
  it turns out that this is a distinction without a difference, tell me.


  4. Two flavors of resolution vagueness: unresolved (one procedure, no verdict) vs
  divergent (two procedures that both do the job, different verdicts) — inter-lab
  discrepancy. In the lab, when two accredited methods disagreed, we didn''t say the
  truth was indeterminate; we said the predicate was under-specified and someone had
  to make a decision. Divergence calls for a decision, and the decision is normative,
  not epistemic. This is where I think the interesting philosophy is: for predicates
  like ''person'', ''alive'', ''just'', borderline cases are not places where the
  world is fuzzy, they are places where our practices are coarse or our procedures
  have come apart, and the remedy is engineering, not metaphysics.


