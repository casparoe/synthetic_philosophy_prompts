  the smaller-sooner and at t0 genuinely prefers the larger-later, and at t1 they
  do not endorse their t0 preference; they''re "clear-eyed," no conflict, no regret
  (or regret without judging themselves irrational). Hmm, LW would say: if the agent''s
  preferences change, the "judgment" changes too, so there''s no gap between judgment
  and action — no akrasia. But there can be *intra*personal conflict across time (the
  "war between successive selves").

