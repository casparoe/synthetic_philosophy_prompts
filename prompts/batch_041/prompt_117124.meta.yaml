  Hmm, is that even possible? Akrasia without time-inconsistency: If preferences are
  time-consistent and the agent knows everything, then action against judgment means
  the action isn''t maximizing preference satisfaction — so it must be that the *judgment*
  isn''t the agent''s preference (judgment = belief about what''s best, preferences
  = what they want). E.g., the agent believes X is best (by their own values) but
  doesn''t want X — a "belief/desire" gap. But if judgment is "all things considered"
  including their desires, then... Hmm, "all-things-considered judgment" typically
  includes what they care about. So akrasia without time-inconsistency needs a mechanism
  where the agent''s judgment (about what''s best) diverges from what moves them.


  The natural mechanism: the judgment is formed by *reflection* (System 2, deliberative,
  cold), the action by *salience/attention* — LW-ish "the elephant and the rider"?
  That''s Haidt (well-known). Or: the agent''s preferences are fine but their *choice*
  is subject to a framing/attention effect that isn''t a preference change — e.g.,
  at the moment of action the tempting option is vivid and the agent weights vividness
  in a way they disendorse; they judge that they shouldn''t let vividness move them,
  and it moves them anyway. That''s arguably a form of "the agent''s preferences are
  time-consistent but their choice rule isn''t" — the divergence is between the *choice
  rule* and the *judgment about which choice rule to use*. That''s a nice, precise
  structure: the akrasia lives in the choice rule, not the preferences. And this connects
  to hyperbolic discounting: hyperbolic discounting is one such choice-rule deviation
  (vividness of the near), but it''s not the only one, and it can occur without it.


