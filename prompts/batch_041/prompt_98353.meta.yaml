  Color phi phenomenon (Kolers & von Grünbaum 1962): two dots flashed, one then the
  other, at different locations; observers see a single dot moving and changing colour;
  crucially the colour change seems to occur at the midpoint before the second colour
  is even shown. This raises the question: is experience constructed retrospectively
  (Orwellian: the memory of the earlier experience is revised) or is the experience
  itself delayed and then constructed (Stalinesque: the experience is created after
  the fact but presented as if it happened)? Dennett''s "Consciousness Explained"
  uses this to argue there''s no fact of the matter about the timing of experience
  — the "Orwellian" vs "Stalinesque" distinction is undecidable because any evidence
  (including subjective report) is compatible with both. Dennett''s claim: the question
  "when did the colour change occur in experience?" is ill-posed.


