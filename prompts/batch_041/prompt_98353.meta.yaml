  ---


  Consider the following argument. I built it after a seminar and now suspect it proves
  too much.


  The colour phi phenomenon: a dot is flashed at position A in one colour, then, after
  a short interval, a dot is flashed at position B in a different colour. Subjects
  do not see two flashes; they see a single dot travelling from A to B, and — this
  is the striking part — the colour change appears to happen somewhere along the middle
  of the path, as though the dot changed colour in transit. The second colour could
  not have been processed by the time the apparent change is experienced, so something
  must be filled in.


  (1) The subject''s experience of the colour change either is (a) a genuine experience
  occurring at the midpoint, which would require the brain to anticipate a colour
  it has not yet received (impossible), or (b) an experience that is only assembled
  after the second flash, and then presented to the subject as though it had occurred
  earlier. (Stalinesque) Or (c) the subject did originally experience the first colour
  at the first position and no change at the midpoint, and this earlier experience
  is later revised in memory to include a change (Orwellian).


  (2) Between (b) and (c) no evidence can decide: the subject''s momentary reports,
  their button-presses, their later recollections, and every conceivable physiological
  measure are fixed by the final state, which (b) and (c) describe identically. Any
  experiment we run is one whose outcome (b) and (c) both predict.


  (3) When two hypotheses entail exactly the same predictions about every possible
  observation, there is no fact of the matter which is true.


  (4) So there is no fact of the matter whether the colour change was experienced
  at the midpoint or whether the earlier experience was rewritten. When a content
  is experienced — its temporal position in the stream — is not an objective feature
  of the world.


  (5) But consider two rival hypotheses about the content of an experience that likewise
  entail exactly the same predictions about every possible observation: that the subject
  experienced a particular shade of red, versus that they experienced a slightly different
  shade they would describe, sort, and act upon in exactly the same way; or that a
  briefly presented word was experienced as "duck" versus as an indistinguishable
  token they would report as "duck". By (3), there is no fact of the matter which
  content was experienced either.


  (6) If the content of an experience can be indeterminate whenever a rival content
  is observationally equivalent, then for any experience there are countless rival
  contents equally consistent with everything observable. So no experience has a determinate
  content beyond its observable consequences.


  (7) Therefore consciousness has no determinate intrinsic character; all there is
  to an experience is its functional/reportable profile. (This is the conclusion I
  cannot stomach.)


  (8) Yet (7) undermines the very evidence the argument runs on: reports, button-presses
  and recollections are evidence about experience only if there was something it was
  like for the subject, with some determinate character. If (7) is true, the phenomena
  that motivated the argument are not evidence of anything.


