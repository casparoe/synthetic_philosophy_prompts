  The setup: The colour phi phenomenon. Two dots flashed in different positions, first
  one colour, then another; observers report a single dot moving smoothly and changing
  colour partway — and the change seems to be experienced at the midpoint, before
  the second stimulus''s colour could have been received. (Actually the classic description:
  the dot appears to move and change colour, with the colour change occurring around
  the middle of the apparent path.)


  Now, an argument (constructed by the asker) that seems to prove too much:


  (1) In the colour phi phenomenon, subjects report a colour change that seems to
  occur at a point on the apparent trajectory before the second flash''s colour could
  have been processed. So either the experience of the first colour is revised after
  the fact to accommodate the second (Orwellian), or the experience is not formed
  until after the second flash and is then presented as having occurred earlier (Stalinesque).


  (2) For any subject and any run, the Orwellian and Stalinesque hypotheses make exactly
  the same predictions about everything the subject can report, do, or later remember;
  there is no possible evidence that discriminates between them. (Because both posit
  the same final experiential/functional state.)


  (3) If two hypotheses make exactly the same predictions about all possible evidence,
  there is no fact of the matter which is true. (verificationist-ish premise)


  (4) So there is no fact of the matter whether the colour change was experienced
  at the midpoint (Stalinesque) or whether the earlier experience was rewritten (Orwellian).
  The timing of experience — when a content is experienced — is not a real feature
  of the world.


  (5) But the same reasoning applies to content: for any two hypotheses about what
  content a subject is experiencing at a moment that make the same predictions about
  all reportable evidence — e.g., that the subject experienced red versus that they
  experienced a slightly different shade they''d describe identically, or that they
  saw the dot at position P versus an indistinguishable nearby position — there''s
  no fact of the matter which content was experienced.


  (6) In fact, by the same reasoning, for any experience and any rival experience
  that would produce the same reports and memories, there is no fact of the matter
  which occurred.


  (7) Therefore there is no fact of the matter about the content of experience in
  general — consciousness has no determinate content beyond what is reportable/functional.


  (8) But this proves too much: it would mean that two subjects (or a subject and
  their later self) can never be said to have had the same or different experiences
  in any non-behavioural sense, and the whole enterprise of explaining consciousness
  as opposed to behaviour evaporates — and worse, the argument''s own data (subjects''
  reports) presuppose that there was something it was like for them.


