  THE LEDGER (90 minutes, 12 writers)


  Materials: two decks of cards. "Attachment cards": each names a particular bond
  (this is my brother; this is the woman I''ve lived with for nineteen years; this
  is the child I raised). "Warrant cards": each states a general principle (anyone
  may save a life they are uniquely placed to save; a parent''s first duty is to their
  own child; one should minimise the number of deaths).


  Procedure:

  1. (0-10) No lecture. Hand out the scenario: a single-page situation — e.g., a river,
  two people in the water, one is your sister, you can only reach one, no one else
  is near. Participants are cast in trios: Agent, Interlocutor, Scribe.

  2. (10-25) Take One: The Agent performs the rescue as a silent pantomime or a first-person
  monologue of at most six sentences — with the instruction: "Do not explain yourself.
  Act." The Scribe records only the words the Agent says.

  3. (25-45) The Audit: The Interlocutor must ask, "Why her and not the other?" and
  may only accept an answer that cites one of the warrant cards. The Agent must answer
  until the Interlocutor is satisfied. Scribes read out the successful justifications.

  4. (45-65) Take Two: The Agent replays the rescue, but must say the audit''s accepted
  justification *while* acting, out loud, in the middle of the action. The room watches
  what happens to the performance.

  5. (65-90) Debrief: compare the recorded words. Ask: which take sounded like a person
  and which like a policy? Where did the second take go wrong — at the moment of action,
  or at the moment of justification? Then name Williams.


