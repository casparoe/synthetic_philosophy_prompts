  are sacrifices so central if they''re just a concession? Why not just abolish them?

  3. If God accommodated one historical limitation, why not others — this opens the
  door to saying the laws about slavery, women, etc., are accommodations too, which
  is a slippery slope to saying we can discard them.

  4. If the reason for sacrifices no longer applies (we no longer live among idolaters),
  why do we still pray for the restoration of the Temple and the sacrifices? (This
  is the big one.)

  5. Doesn''t this make Maimonides'' God a consequentialist / manipulative pedagogue,
  at odds with the idea that the commandments are for our perfection?

