  1. Trivial/definitional: over short horizons price changes are driven by flows/opinion,
  over long horizons by fundamentals (a claim about relative variance decomposition).

  2. Metaphysical: there are two magnitudes — a "vote" value and a "weight" value
  — and the price converges to the latter; requires an independent notion of fundamental
  value, which is hard to define without circularity (the "true value" problem; what
  does "weighing" measure if not what a well-informed trader would pay?).

  3. Epistemic: prices in the short run reflect what people believe (so they can be
  wrong), in the long run they reflect what''s true.

  4. Rational/equilibrium: the "long run" is a limit that rational traders should
  anticipate — if convergence to weight is known, arbitrage should make it happen
  now; so the slogan presupposes limits to arbitrage (noise trader risk, horizons,
  capital constraints). And the no-trade theorem: if the eventual "weight" is common
  knowledge, no trade at a price away from it; so the persistence of voting-machine
  prices is itself evidence that "weight" is not common knowledge — which undercuts
  the slogan''s implied assurance.

  5. Normative/investment advice: patience wins; buy and hold.

  6. False/self-undermining: if enough people believe the slogan, the long run arrives
  sooner; the slogan cannot be common knowledge and true at once (a reflexive/Goodhart-y
  point).


