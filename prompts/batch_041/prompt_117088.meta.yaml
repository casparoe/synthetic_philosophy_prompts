  different probability weights; also the "Nalebuff asymmetric variant" and the "second
  paradox" about the amount in the envelopes being fixed vs. the open-envelope version.
  A good in-the-weeds exam question: distinguish the "before opening" version (where
  it''s just a decision-theoretic puzzle about improper priors / no uniform distribution)
  from the "after opening, you see £10" version (where the paradox is about the conditional
  expectation and the fact that for any X there must be a prior, and the resolution
  requires either bounded support or... ). Also the "two-envelope paradox" resolution
  by Broome: the error is treating E(other) as 5/4 X when the expectation is taken
  over different probability spaces; the expected value of the other envelope given
  X is well-defined only if... Actually Broome''s resolution: the reasoning conflates
  E(Y) with E(Y|X=x) and uses a "sloppy" expected value. Also the "A and B are each
  5/4 the other" — the correct claim: E(B|A=a) = 5/4 a for all a is impossible with
  a proper prior; with a proper distribution, E(B|A=a) = 5/4 a for all a implies the
  distribution is improper.


  Also there''s the "two-envelope paradox" as a case for decision theory: does it
  show that expected utility maximisation is incoherent, or that "dominance" style
  reasoning can fail? And the "second two-envelope paradox" (the "Nalebuff" variant)
  where you''re told the amounts are... Hmm.


