reasoning_summary: "The task: write a prompt of type \"Predict or recommend a verdict\
  \ on a new case from someone's verdicts on earlier cases\" combined with a domain.\
  \ Domains: worst-case vs average-case guarantees in AI alignment; Frege-Geach problem\
  \ for expressivism; Berkeley's views on money; teleology and providence in history;\
  \ AI alignment.\n\nThe type requires a track record of verdicts on cases, jointly\
  \ consistent with more than one plausible rule, and a new case where rules diverge.\n\
  \nBest fit: Frege-Geach problem for expressivism — a professor's verdicts on which\
  \ sentences express propositions / embed in conditionals. Actually a natural \"\
  track record\" version: an expressivist philosopher's verdicts on embedding cases.\
  \ Or \"worst-case vs average-case guarantees in AI alignment\" — a reviewer's verdicts\
  \ on which safety arguments count as adequate.\n\nThe Frege-Geach one is nice: someone's\
  \ verdicts across embeddings — e.g., \"he says 'murder is wrong' doesn't state a\
  \ fact, but he says the argument 'if murder is wrong, then murder is wrong' ...\
  \ \" Hmm. Let's design a track record: a philosopher's verdicts on which constructions\
  \ she says are truth-apt/express a belief vs. a non-cognitive attitude. Cases: simple\
  \ moral assertion; negation (\"murder is not wrong\"); conditional antecedent (\"\
  if murder is wrong, then telling on him was wrong\"); moral predication of a person\
  \ (\"she is courageous\" — thick concept); embedded \"I believe that murder is wrong\"\
  ; \"it is possible that murder is wrong\"; propositional attitude in third person\
  \ (\"she thinks murder is wrong\"); question form; tense (\"murder used to be considered\
  \ wrong\" / \"murder will be wrong\"); disjunction (\"either murder is wrong or\
  \ it isn't\"); comparative (\"murder is worse than lying\").\n\nRules that fit:\
  \ (A) anything embedding a moral sentence in a truth-functional context is truth-apt\
  \ / expresses a proposition (semantic descent to a truth-conditional surface); (B)\
  \ only unembedded or \"assertoric\" uses express attitudes, all embeddings are to\
  \ be explained non-propositionally (e.g., by the \"attitude expression\" account\
  \ where the moral term in the antecedent changes meaning); (C) hybrid: expressivism\
  \ plus minimalism about truth where the negation is a proposition-level commitment.\n\
  \nNew case: \"if lying is wrong, then stealing is wrong\" vs. \"Either it's wrong\
  \ to lie or I'm mistaken about ethics\"? Hmm.\n\nBetter new case: a moral sentence\
  \ embedded in a belief ascription with a non-linguistic creature: \"my dog thinks\
  \ that biting the postman is wrong\"? Or \"the thermometer registers that lying\
  \ is wrong\"? Hmm, maybe too cute.\n\nAlternative: use the type with AI alignment\
  \ worst-case vs average-case: a safety reviewer's verdicts on past papers: \"we\
  \ accepted a paper that argues for worst-case bounds but only under a computable-environments\
  \ assumption...\" etc. That's a bit more artificial.\n\nActually the Frege-Geach\
  \ track-record version is very natural and in-the-weeds. But the \"rules\" would\
  \ be theories (expressivism's embedding strategies), which is fine — the type allows\
  \ \"which theory he is implicitly running.\"\n\nLet me design carefully.\n\nA philosopher\
  \ friend's verdicts on whether a given sentence \"expresses a proposition / is truth-apt\
  \ / can be believed\" — she's an expressivist. Her verdicts:\n\n1. \"Lying is wrong\"\
  \ — asserts nothing; expresses disapproval. Not truth-apt.\n2. \"Lying is not wrong\"\
  \ — hmm, she says this is not truth-apt either but is \"the expression of a different\
  \ attitude\"? Actually classic expressivists (Ayer) said negation of a moral sentence\
  \ is still not truth-apt.\n\nLet me pick verdicts so that two rules fit:\n\nRule\
  \ A (Frege-Geach-style \"logic requires propositions\" / quasi-realism / minimalism):\
  \ embeddings like negation, conditionals, disjunction are truth-apt because they\
  \ behave logically; so sentences are propositions whenever they can appear in logically\
  \ valid inference patterns — but a sentence used to express an attitude in the first\
  \ person present tense assertion isn't.\n\nRule B (Attitude semantics / \"no propositions\
  \ anywhere\"): even negation and conditionals are non-propositional; the antecedent\
  \ of a conditional is not asserted, it's a \"moral term in a different sense.\"\n\
  \nHmm, that's basically Frege-Geach.\n\nMaybe better to frame the track record as:\
  \ which of these sentences she says \"can be true or false / can be the content\
  \ of a belief.\"\n\nVerdicts:\n- \"Stealing is wrong.\" — No. (She's an expressivist\
  \ about first-person moral assertions.)\n- \"Stealing is not wrong.\" — Yes?? That\
  \ seems odd for a pure expressivist. Hmm.\n\nLet's use a different axis: which sentences\
  \ she thinks are truth-apt.\n\nVerdict list (her \"truth-apt\" verdicts):\n1. \"\
  Stealing is wrong.\" — Yes, truth-apt. (She's a quasi-realist, so yes.) Hmm.\n\n\
  Maybe better to make her verdicts about *what kind of state* a sentence expresses:\
  \ belief vs. desire/non-cognitive attitude.\n\nHer verdicts:\n- \"It's wrong to\
  \ break a promise.\" — expresses disapproval, no belief.\n- \"If it's wrong to break\
  \ a promise, then it's wrong to encourage someone to break one.\" — she says this\
  \ expresses a *belief*? or \"expresses acceptance of a pattern of attitudes.\"\n\
  \nHmm. Classic expressivist line (Blackburn, Gibbard): the conditional expresses\
  \ a higher-order attitude / a commitment to a combination of attitudes, not a belief.\
  \ But quasi-realists also allow that the whole conditional is truth-apt in a deflationary\
  \ sense.\n\nTwo candidate rules that fit her verdicts and diverge on the new case:\n\
  \nRule 1 (Deflationism/quasi-realism about truth-aptness): every declarative sentence,\
  \ embedded or not, is truth-apt (in a thin sense), so truth-aptness doesn't track\
  \ belief-expression. Then the new case (some sentence) → yes truth-apt.\n\nRule\
  \ 2 (Assertoric-content rule): a sentence is truth-apt just in case it can be embedded\
  \ in a truth-functional context / used in valid inference. Hmm, they might not diverge\
  \ much.\n\nLet's instead make the two candidate rules:\n- Rule A: \"A sentence is\
  \ truth-apt iff it can figure in valid inference (the Frege-Geach test)\" — this\
