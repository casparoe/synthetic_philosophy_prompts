  \ to the *simple* assertion? No, the simple assertion also figures in inference.\n\
  \nOK, different tactic. Make her verdicts be about whether the *speaker* believes\
  \ something / whether there's a proposition expressed by the *use*. Then the two\
  \ candidate rules:\n\nRule A: \"Truth-apt iff truth-conditional semantics is available\"\
