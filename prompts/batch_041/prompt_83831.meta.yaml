  \ (i) negation, (ii) conditional antecedent, (iii) disjunction, (iv) propositional\
  \ attitude ascription, (v) questions. The two rules diverge on propositional attitude\
  \ ascription in *third person past tense* maybe? Hmm.\n\nLet's think about the two\
  \ candidate rules and what would make them diverge:\n\nRule 1: \"Truth-aptness is\
  \ cheap: any declarative sentence with a compositional semantic value is truth-apt\
