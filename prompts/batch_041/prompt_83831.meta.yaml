  \nNew case: a disjunctive syllogism, or the negation-of-conditional, or a sentence\
  \ where the moral predicate is under a truth-functional operator but the argument\
  \ is used to *attribute* a belief to someone: \"If Maria believes that lying is\
  \ wrong, and lying is wrong, then Maria believes something true.\" Hmm.\n\nBetter\
  \ new case: a mixed inference where a moral premise and a non-moral premise combine\
  \ by modus ponens: \"If lying is wrong, then lying is a sin; lying is wrong; so\
  \ lying is a sin.\" Or a case where the moral sentence appears as the consequent\
  \ of a non-moral conditional (\"If it rained, then lying is wrong\" — weird). Or\
  \ the \"embedding test\" case: \"Either lying is wrong or she was joking\" — disjunction\
  \ with a descriptive disjunct.\n\nActually a great divergence case: the moral sentence\
  \ embedded in a *belief ascription to a person who doesn't have moral concepts*\
