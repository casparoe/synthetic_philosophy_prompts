  - Negation — she says \"lying is not wrong\" is not the contradictory of \"lying\
  \ is wrong\" (it expresses a different attitude)... hmm, but if she says modus ponens\
  \ is valid she needs the antecedent to be the same sentence as the assertion, which\
  \ is the Frege-Geach problem. That's the tension — good, that's the issue.\n\nSo\
  \ the two candidate rules that fit her verdicts:\n- Rule 1: \"Embedded moral sentences\
  \ have the same meaning as unembedded ones; logic is univocal; so the simple assertion\
