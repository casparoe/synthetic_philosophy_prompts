  \ Hmm, similar.\n\nMaybe the two rules should be about *which* expressivist strategy\
  \ fits her verdicts, and the new case is one that only one strategy handles.\n\n\
  Let me reframe the prompt: she's an expressivist philosopher. Her verdicts on a\
