  case, where Judy has a uniform prior over the four quadrants formed by Red/Blue
  and Second Company/Headquarters and then learns that the probability of Second Company
  given Red is three-quarters, but also handles cases where the constraint is certain,
  where it is nested, and where it is inconsistent with the prior. She thinks the
  standard Kullback-Leibler minimization over the whole space gets the right answer
  in the original case but for the wrong reasons, and that her rule is the one that
  generalizes correctly."


