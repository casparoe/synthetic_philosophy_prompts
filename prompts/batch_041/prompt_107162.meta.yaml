  correct one. The choice between them is a matter of convention or convenience.


  (5) A claim that is true only relative to a convention is not a claim about the
  world but about our bookkeeping.


  (6) Therefore, X raises the probability of Y is never a claim about the world. Every
  such claim is an artifact of how we happened to cut the data.


  (7) But (6) proves far too much. It would make the smoking–cancer association an
  artifact of bookkeeping and a well-run randomized trial no better than a correlation
