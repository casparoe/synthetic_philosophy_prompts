  Potential final:


  I am not a philosopher and have no university education, but for the past four years
  I have chaired the verification desk of a small amateur astronomy group that reports
  transient events — possible novae, supernovae, satellite glints, meteor trails —
  to a wider volunteer network. We are all unpaid enthusiasts, we work from home with
  our own telescopes and cameras, and when a dispute arises we cannot consult a library
  or search the internet; we have only the images, the logs and each other. About
  five times a week two members of the desk reach opposite conclusions about the same
  observation: one says the data support a real event, the other says it is an artefact
  or a misreading. Sometimes they have examined exactly the same frames and records;
  sometimes one has extra private observations from their own instrument; sometimes
  one has a much better record of past calls than the other. I have been reading about
  the disagreement between conciliationism and steadfastness in peer disagreement,
  and I think I understand the broad shape of the debate, but the examples always
  involve philosophers with identical evidence and equal competence, which is almost
  never our situation. I need something I can actually run at the desk on a Tuesday
  night.


  Please write me a reusable decision procedure that our duty chair can follow when
  two members disagree. It should be a numbered sequence of tests, with a one-page
  scoresheet or form, and it must say what counts as a sufficient answer at each step.
  It should begin by determining whether the two people are genuine epistemic peers
  for this particular claim — same relevant competence, same evidence, independence
  from a common source, no stake in the outcome — and if they are not peers, it should
  say how to weight the disagreement using our calibration ledger, in which every
  member records a confidence score before the outcome is known and we track how often
  their eighty-per-cent calls turn out right. It should include a test for whether
  the two judgements are genuinely independent or merely two readings of the same
  corrupted pipeline, a rule for what to do when one party has private evidence the
  other cannot inspect, and a rule for when the correct response is to suspend judgement
  rather than choose a side. It should have a clear stop rule that says do not report,
  and a marked point at which the procedure hands the decision to a named person because
  the remaining question is not about the evidence but about how much risk of a false
  alert or a missed discovery we are willing to accept. Please mark the steps that
  are judgement calls dressed up as arithmetic, and be honest about which parts of
  the procedure a small group of volunteers is likely to get wrong.


