  I''m taking a political philosophy course in which we''ve been reading Albert Einstein''s
  essay "Why Socialism?" alongside more standard defences and critiques of market
  economies. I can follow the broad shape of his argument — that capitalism''s unplanned,
  competitive character produces insecurity and a kind of spiritual deformation, and
  that a planned economy would let people develop their capacities — but I''m stuck
  on what looks like an internal tension. Einstein''s central complaint is that capitalist
  society cripples the individual by making their livelihood depend on forces they
  cannot control or understand; yet the remedy he proposes requires a centralised
  planning authority, which would seem to concentrate exactly the kind of uncontrolled
  power over individual lives that he objects to. He seems aware of this, because
  near the end of the essay he raises the problem of bureaucracy becoming over-mighty
  and asks how individual rights can be protected against it. But he doesn''t, as
  far as I can see, resolve it.


  What I''d like is an explanation of how Einstein''s position should be reconstructed
  so that this is not simply a contradiction. Is there a way of reading his view of
  science and of the individual — his insistence that the scientist must be free from
  authority, his hostility to conformity, his confidence that social arrangements
  can be rationally ordered — that makes the planned economy a natural extension of
  his liberalism rather than a betrayal of it? Or does the essay in fact contain an
  unresolved conflict between a socialist political economy and a liberal conception
  of the person? I''d also like to know whether the specific mechanism he proposes
