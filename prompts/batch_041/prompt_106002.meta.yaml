  "I work as a software engineer and read philosophy in my spare time, mostly in the
  epistemology of disagreement; I have no formal training, so I''ll describe the dispute
  in my own words and I''d rather you correct my vocabulary than adopt it.


  The dispute I have in mind concerns what is sometimes called epistemic akrasia:
  whether it can ever be rational for someone to hold a belief while also holding
  that their evidence does not support it — or, in the sharper cases, that their evidence
  supports the opposite. The cases that puzzle me are these. [case 1: you work out
  an answer to a hard problem, then learn that people in your position get such problems
  wrong most of the time; do you keep believing?] [case 2: you learn that you are
  unreliable at this kind of problem, but you have good reason to think that this
  piece of information about yourself is itself mistaken or was fed to you by an unreliable
  source — so the higher-order evidence is misleading. Do you keep believing?] [case
  3: a pilot believes the engine will fail and also believes that this belief is a
  symptom of oxygen deprivation — the two beliefs seem to be about the same thing,
  but one is about the world and one is about him.]


  Two camps have formed, and after a few years of reading I cannot see either moving.
  One says rationality forbids believing against your own evidence, whatever the source
  of the higher-order evidence, and that the tempting alternative licenses a kind
  of incoherence. The other says that in the misleading cases it can be perfectly
  rational — indeed it may be what a good thinker would do — because what matters
  is how you respond to the reasons you actually have, and reasons about your own
  unreliability can be defeated. A third group tries to split the difference by treating
  the first-order belief and the belief about one''s own reliability as subject to
