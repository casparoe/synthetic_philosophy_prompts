  Draft:


  "I am in a small reading group on philosophy of mind, and one member has been pressing
  an analogy that I cannot decide whether to accept: an ant colony is to its ants
  as a brain is to its neurons. He calls the imagined result ''Aunt Hillary'' — a
  colony that has been around long enough, and with enough internal structure, that
  you can hold a conversation with it — and he uses the comparison to argue for something
  quite strong: that a mature colony literally has beliefs, preferences, and something
  like a point of view, so that when a colony is poisoned or ploughed under, what
  is destroyed is not merely a large number of insects but a subject whose interests
  count. His argument has two steps: first, the ants are individually mindless (an
  ant is a few hundred thousand neurons running reflexes, it does not know where the
  food is or want the colony to grow), yet the colony as a whole behaves as though
  it knows and wants; second, no single neuron in a human brain knows or wants anything
  either, so the ant objection proves nothing unless you are prepared to say that
  you have no beliefs. I find the parallel genuinely illuminating and also suspect
  it is doing work it cannot do.


  What I would like is an audit of the analogy rather than a verdict on whether colonies
  have minds. Please set out the correspondence explicitly — what is supposed to map
  onto what (ant, neuron, pheromone trail, synapse, queen, ...) and at what level
  the mind is supposed to live — and then say where the mapping breaks down and which
  of the breaks matter for the conclusion he wants. In particular I want to know which
  features of the brain side he is quietly importing into the colony (centralized
  control, a private internal medium, a single body whose interests the mind serves,
  a locus where the mental states are stored) and whether the colony has anything
  playing those roles, or whether it has structural features — for instance a ''memory''
  and a signalling medium that are outside any individual, laid down in the nest and
  the pheromone field, where every message is also a public alteration of the environment
  — that have no counterpart in the brain at all. He also slides without noticing
  between calling the colony one mind and calling it one organism; I am not sure those
  are the same claim or whether they can both be true of the same object, and I would
  like that sorted out.


  Finally, tell me whether the moral conclusion survives once the disanalogies are
  on the table: if the colony is not a mind in the way a brain is, is it still the
  kind of thing whose destruction can be described as the death of a subject, or was
  the analogy carrying the whole conclusion? If the analogy is salvageable in some
  repaired form — a different comparison, or the same one with the load-bearing parts
  removed — say what it would be."


