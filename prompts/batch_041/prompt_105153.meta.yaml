  Here''s the argument as I''ve reconstructed it:


  (1) A claim is meaningful only if there''s some possible experience that would count
  for or against it.

  (2) Suppose someone claims they will survive the death of their body. What experience
  could verify that? A voice at a séance, a ghost, a resurrected body with your memories
  — all of these at most show that some entity is present with certain features.

  (3) To verify that I survive death, you''d need a criterion for deciding when a
  person at one time is the same person as a person at another time, and the surviving
  entity is supposed to be the same person as me.

  (4) But there is no such criterion — there''s nothing that settles identity across
  a gap like that, no observable fact of the matter.

  (5) So ''I will survive death'' isn''t false, it''s meaningless.


