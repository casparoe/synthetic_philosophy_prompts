  Let''s draft:


  I retired last year after a career in statistical mechanics, and I have since been
  working my way through a graduate program in philosophy. I have been asked to write
  the formal epistemology section of this year''s comprehensive examination, and I
  want the question to be on the Judy Benjamin problem. My own background makes me
  suspicious of any claim that there is a single rational way to update on conditional
  information, but I want the students to have to earn that suspicion rather than
  simply assert it.


  Please write one essay question, suitable for a 90-minute exam, together with a
  model answer of about 700 to 800 words and a marking scheme. The question should
  be self-contained: it may describe the Judy Benjamin scenario in prose, but it should
  not require the students to have read any particular paper, and it should not ask
  them to supply citations, reading lists, or bibliographies. It should also not depend
  on any specific quotation.


  The question should not be answerable by reciting the definition of conditionalization
  or by summarizing the standard Judy Benjamin example. I want it to force students
  to do at least three things: first, state precisely what makes the Judy Benjamin
  case a problem for ordinary conditionalization; second, formulate a general principle
  for updating on conditional information and explain its motivation; third, test
  that principle against a modified version of the scenario that you invent. The modification
  should introduce a second piece of conditional information that is individually
  consistent with the first but that creates a tension for at least one prominent
  update rule. The students should have to say whether the modified case has a unique
  rational solution, and if not, what that implies about the original problem.


  In the model answer, please compare at least two approaches to updating on conditionals,
  such as Adams conditioning, Jeffrey conditionalization, and maximum-entropy updating,
