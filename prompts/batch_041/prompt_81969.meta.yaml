  Title: Accommodation, not age: why the problem of old evidence is misnamed.


  "Bayesian confirmation is usually stated as a relation between a hypothesis H, evidence
  E, and a credence function P: E confirms H for an agent just in case P(H|E) > P(H).
  The familiar difficulty is that when E is already known, P(E) = 1, and conditioning
  on a certainty does nothing: P(H|E) = P(H). Yet we plainly take theories to be supported
  by facts they were built to fit. The most common response is to say that what does
  the work is not E itself but the discovery that H entails E; conditionalizing on
  that discovery can raise the probability of H, and the puzzle dissolves. I want
  to argue that this response is unstable, and to replace it with an explicitly agent-relative
  account.


  The instability is this. Either the ''discovery'' is treated as a piece of evidence
  in its own right, in which case we need a prior over discoveries, and that prior
  is exactly as mysterious as the thing we were trying to explain; or it is treated
  as a mere psychological event that licenses a change of credence, in which case
  the account has quietly abandoned the idea that confirmation is a logical relation
  and become a story about when agents are permitted to change their minds. Each horn
  is unattractive, and I do not think the standard fix can choose between them without
  help.


  My proposal is to stop treating novelty as a property of evidence and treat it as
  a relation between evidence and the agent''s actual path. Define an agent''s confirmation
  relation not on her current credence function alone but on a pair: her current credences
  and the class of credence functions she could have had, given the inquiries she
  actually conducted. E confirms H for her, roughly, when conditioning on E raises
  H''s probability from the level it would have had in the nearest counterfactually
  available credence function in which E was not yet available. On this account nothing
  is ever ''old'' evidence; what varies is how much of H''s probability is inherited
  from E rather than from elsewhere. I call the quantity that remains the accommodation
  residue: the part of H''s posterior that is due to E''s having been used to build
  H rather than to test it.


  Two consequences. First, confirmation becomes agent-relative in a strong sense:
  two agents with identical current credences can stand in different confirmation
  relations to the same H and E if they arrived by different routes. I take this to
  be correct rather than embarrassing, since it is the same fact that makes the accusation
  of circularity apt in one case and not in another. Second, the account predicts
  that the old-evidence problem should be worst exactly where a theory has many free
  choices that the evidence constrained — where the residue is large — and should
  vanish for a theory that was fixed before the evidence arrived. I think this matches
  the practice of judging how much credit a theory deserves for a fit it was built
  to achieve."


