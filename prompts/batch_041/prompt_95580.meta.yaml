  \ of identity statements are informative.\n\nAugustine is the most natural. But\
  \ careful: I must not quote from memory, and shouldn't rely on specific attributions\
  \ without verification. But I can construct the prompt as an asker reporting a seminar's\
  \ verdicts on cases, with the earlier verdicts described in paraphrase (the asker's\
  \ own rendering) — that's fine, no quotes needed.\n\nActually there's a subtlety:\
  \ the track record should be jointly consistent with more than one plausible rule.\
  \ With Augustine, a nice structure: the professor's verdicts follow the letter of\
  \ \"never lie, regardless of consequences,\" but they also could be explained by\
  \ a rule like \"lying is always wrong because it harms the soul of the liar / perverts\
  \ the function of speech\" or \"any speech that signifies falsely is a lie and always\
  \ wrong\" vs. a rule that permits \"not lying but concealing\" (e.g., the case of\
  \ not telling the whole truth, ambiguous statements, the \"prudent steward\" — actually\
  \ Augustine's own discussion in De Mendacio / Contra Mendacium; also his discussion\
  \ of whether it's permissible to say something true that misleads, or to remain\
  \ silent).\n\nGood candidate rules:\n(A) Strict semantic rule: any utterance that\
  \ signifies a falsehood with intent to deceive is a lie, and all lies are sins —\
  \ no exceptions. Predicts: lying to the murderer to save a life is a sin; lying\
  \ to a dying man about his son's death to comfort him is a sin.\n(B) Function-of-speech\
