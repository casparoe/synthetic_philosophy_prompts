  \ a different verdict on some cases, e.g. a joke, an actor on stage, a hyperbolic\
  \ boast.\n(C) The \"benefit of the doubt\" / \"not every deception is a lie\" rule\
  \ — Augustine famously allows concealing truth by silence, and even by saying something\
