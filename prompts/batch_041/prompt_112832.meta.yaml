  Prompt text (draft 3):


  I have been working through the "low impact" idea on my own — the proposal that
  a system should do what it is asked and otherwise leave the world alone — and I
  want to know whether "leave the world alone" can be made definite without first
  settling what is worth caring about. Please design a case that tests it.


  Make it ordinary and realistic: one person, one request, one small setting (a kitchen,
  a workshop, a corner shop), and two ways of carrying the request out. The two ways
  must satisfy the request equally well. They must differ outside the request, and
  you must arrange them so that two plainly stated ways of measuring disturbance rank
  them oppositely: (a) count how much of the world is changed, without regard to what
  changed; (b) count how much of what anyone cares about is changed, without regard
  to how much. Say what unit each measure is counting in, and make sure the inversion
  really holds in those units rather than being asserted.


  Then, for each measure, give its verdict on the two ways of acting and show where
  the disagreement comes from, and say what in the request itself, if anything, tells
  you which measure to use. Add a short note on whether your verdicts change if the
  measure is taken relative to the world as it stands when the request is made rather
  than to the world as it would have been had the request never been made.


  Close with: the one feature of the case that is doing the work; what happens to
  the disagreement if that feature is removed; the best defence available to someone
  who says "avoid side effects" is a perfectly usable instruction as it stands; and
  how confident you are in each claim, flagging the one you are least sure about.


