  Draft:


  I have been trying to find a name for a shape of sanction I keep running into, and
  I would like your help in identifying it — or, if nothing in the literature matches
  it, in coining something that does.


  The shape is this. Someone says or does something that is taken to be a wrong. In
  the weeks that follow they lose their job, their invitations, their colleagues''
  willingness to be seen with them, and a good deal of their ordinary social standing.
  But nothing has been decided. No body deliberated, no charge was framed, no finding
  was made, and no sentence was pronounced. What happened instead is that a very large
  number of people, each acting alone and for their own reasons, privately withdrew
  — declined to hire, declined to invite, declined to defend — and the withdrawals
  added up. The person now stands under something that has the felt features of punishment:
  it is imposed because of a wrong, it is meant to hurt, and it is defended as deserved.
  But it has none of the machinery: no one is in a position to say how long it lasts,
  what would count as having served it, or whether it is over. Most strikingly, there
  is no one who can lift it. A convicted person can be pardoned, a suspended employee
  can be reinstated, an excommunicant can be absolved, an ostracised Athenian could
  come home when his term ran out; here the person has no one to petition, because
  there is no authority that speaks for the sanction — only a public that does not
  have a spokesperson and cannot be addressed as a body.


  Two features seem to me to be doing the work, and I would like you to tell me whether
  they are really the crux or whether I have fastened on the wrong thing. First, the
  sanction is the aggregation of many independent private refusals rather than the
  act of a deciding body, and second, and I suspect more importantly, it therefore
  has no remitter: no office, no procedure, and no recognised spokesperson with the
  standing to declare it discharged. The absence of a remitter is what makes it unlike
  anything I can find a name for.


  I know the popular word for this, but I don''t trust it: it is used for everything
  from a mild rebuke to a criminal prosecution, and it names the mood of the crowd
  rather than the structure of the sanction. What I want is the structural kind, and
