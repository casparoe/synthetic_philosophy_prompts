  I am a retired experimental physicist who has recently begun sitting in on graduate
  seminars in philosophy. I have been asked to grade a make-up examination in a course
  on philosophy of mind, and I would like your help with one answer. I have reproduced
  the examination question and the student''s answer below. Please grade the answer
  and provide detailed comments. I am interested in a point-by-point assessment, not
  a general impression: what the student gets right, what is wrong or questionable,
  and which errors a hasty grader might overlook. Assume you cannot consult external
  sources; grade on the basis of the reasoning presented. No bibliography or citations
  are needed.


  Examination question:


  Consider the following toy model, adapted from a well-known popular treatment of
  consciousness. The careenium is a bounded arena containing a vast number of tiny
  magnetic spheres, the simmballs. The simmballs move frictionlessly and collide elastically.
  On collision, their magnetic orientations may flip according to a fixed local rule.
  The walls of the arena are sensitive to states of the external world: their magnetic
  permeability changes with those states, so external information is injected into
  the simmball dynamics. At the micro level, the complete state of the system is given
  by the positions, velocities, and magnetic orientations of all the simmballs, and
  the dynamics are deterministic. At the macro level, however, one can identify stable,
  repeating patterns of simmball configurations. These patterns can be mapped onto
  external states and can interact with one another in regular ways; call them symbols.
  The symbols are multiply realizable: the same symbol can be carried by different
  micro-level simmball arrangements.


  Question: In this model, is it correct to say that the symbols push the simmballs
  around? That is, do the symbols have causal efficacy with respect to the simmball
  substrate, or is the causal story exhausted by the micro-level dynamics? In your
  answer, distinguish clearly between (a) the micro-level dynamics, (b) the macro-level
  patterns, and (c) the sense in which the latter might be said to cause the former.
  Conclude with a defensible position.


  Student''s answer:


  [Insert the student answer.]


  Please assign a letter grade (A through F, with plus/minus if you wish) and then
  provide specific comments justifying it. In particular, I would like to know: (1)
  which claims in the answer are correct and well supported; (2) which claims are
  mistaken, ambiguous, or unsupported, and why; (3) whether the student''s conclusion
  follows from the arguments given; and (4) what a hasty grader might miss. Please
  do not rewrite the answer; assess it as it stands.


