  Let''s outline the prompt:


  Opening: As a recently retired experimental physicist... I''m grading a make-up
  exam for a graduate seminar... The question and the student''s answer are below.
  I''d like a grade and detailed comments.


  Exam question:

  "Consider the following toy model, which I will call the careenium. It contains
  a large number of tiny magnetic spheres, the simmballs, moving frictionlessly in
  a bounded arena. The simmballs collide elastically; on collision, their magnetic
  orientations may flip according to a fixed local rule. The walls of the arena are
  sensitive to states of the external world: their magnetic permeability changes with
  those states, so external information is injected into the simmball dynamics. At
  the micro level, the complete state of the system is given by the positions, velocities,
  and magnetic orientations of all simmballs, and the dynamics are deterministic.
  At the macro level, however, one can identify stable, repeating patterns of simmball
  configurations. These patterns can be mapped onto external states and can interact
  with one another in regular ways; call them symbols. The symbols are multiply realizable:
  the same symbol can be carried by different micro-level simmball arrangements.


  Question: In this model, is it correct to say that the symbols push the simmballs
  around? That is, do the symbols have causal efficacy with respect to the simmball
  substrate, or is the causal story exhausted by the micro-level dynamics? In your
  answer, distinguish clearly between (a) the micro-level dynamics, (b) the macro-level
  patterns, and (c) the sense in which the latter might be said to cause the former.
  Conclude with a defensible position."


  Student''s answer:

  [Write a ~500-700 word answer. It should be well-organized, with an intro, body,
  conclusion. It should make the subtle mistakes.]


  Let''s draft the student answer.


  Student answer draft:


  "The careenium model is a useful thought experiment for thinking about the relationship
  between a physical substrate and the higher-level patterns it realizes. In the model,
  the simmballs are the fundamental entities. Their motions and collisions are governed
  by deterministic local rules, and the walls simply provide boundary conditions that
  vary with the external world. At this level, every event is fully determined by
  the prior micro-state. The symbols, by contrast, are macro-level patterns—stable
  configurations of simmballs. They are not additional entities; they are ways of
  describing the simmball collective.


  Given this, I think the correct view is that the symbols do not push the simmballs
  around. All the pushing is done by the simmballs themselves. The micro-level dynamics
  are causally closed: no simmball moves except in virtue of a collision with another
  simmball or with the wall. To say that a symbol causes a simmball to move would
  be to posit a force that is not present in the micro-level description. This is
  a version of the causal exclusion argument. The symbols are therefore causally inert
  with respect to the substrate. They are, as it were, along for the ride.


  This does not mean that the symbols are unreal or that talk of them is illegitimate.
  The symbols supervene on the simmball configurations, and they are multiply realizable.
  They capture genuine regularities in the system''s behavior, and they can be used
  to predict and explain what happens at the macro level. For example, if a certain
  symbol forms, we can often predict that another symbol will form next, without tracking
  the individual simmballs. This is what makes the symbolic level useful. But usefulness
  is not the same as causal efficacy. The symbol is a description, not a cause.


  Some might object that the symbols must be causes because they figure in successful
  counterfactuals: if the symbol had not formed, the subsequent simmball motions would
