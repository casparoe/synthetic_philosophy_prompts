  I serve on the medical policy committee of a mid-sized regional health plan. About
  once a month the committee must decide whether a contested condition counts as a
  disease for the purposes of our medical-necessity criteria — which determines whether
  we cover interventions for it, at what tier, and on what grounds we can defend the
  decision to appeals, regulators, and the press. The conditions that reach us are
  exactly the ones where the classification is unsettled: something statistically
  rare that appears to cause no harm; something so common in our population that it
  is close to normal; something defined almost entirely by distress while the underlying
  biology looks unremarkable; something whose only apparent cost is social or cosmetic.
  We have practicing clinicians on the committee but no philosopher, roughly an hour
  of discussion per condition, and a written rationale that has to survive being read
  by people who will look for inconsistency across decisions.


  Please give us a decision procedure we can actually run. It should be a small set
  of questions asked in a fixed order, with a statement of what counts as a sufficient
  answer at each step, explicit points where the procedure terminates in a negative
  verdict, and explicit points where it stops and hands the question to a value judgment
  rather than a fact. Ground it in what the philosophical work on health and disease
  actually establishes — the naturalist and biostatistical accounts, the harmful-dysfunction
  analysis, and the normativist and pragmatic alternatives — but write it so that
  a clinician or a lay committee member can apply it without having read any of that.
  In particular, the procedure must do the following. It must refuse to treat statistical
  abnormality as either necessary or sufficient for disease. It must force whoever
  applies it to state the reference class explicitly — relative to which population,
  age, sex, and environment the comparison is being made, and whether the comparison
  is to the local present population or to some ancestral or otherwise idealized one
  — and it must say what to do when the choice of reference class flips the verdict.
  It must separate intrinsic harm, meaning suffering or the loss of a capacity the
  person has reason to value, from extrinsic harm, meaning stigma, disadvantage, or
  cost, and it must take a position on whether extrinsic harm can ever carry a disease
  classification on its own. It must include a device for exposing the committee''s
  own normative commitments, for example a counterfactual question of the form: if
  this condition were equally common and equally harmful but we had no biological
  account of it at all, would we still call it a disease? And it must be honest about
  which steps are judgment calls dressed up as procedure.


  Then run the procedure on three cases, giving the verdict, the steps that did the
  work, and the points where it nearly failed. First, myopia in a population where
  the great majority of young adults are now affected. Second, prolonged grief, now
  recognized as a diagnosis in the major psychiatric manuals, and its boundary with
  ordinary bereavement. Third, idiopathic short stature in a child at the low end
  of the normal range, whose family is requesting growth hormone.


