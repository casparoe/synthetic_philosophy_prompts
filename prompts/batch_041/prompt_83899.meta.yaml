  I''m writing a final paper for a seminar on promissory obligation, and I''ve hit
  a wall that I think a purpose-built case would get me past. The two views I''m comparing
  are, roughly: (i) the convention view, on which a promise binds because the promisor
  has voluntarily invoked a shared social practice whose rules constitute the act
  of promising, so that the obligation is generated by the practice (and by the fairness
  of taking its benefits) rather than by any particular person''s expectations; and
  (ii) the assurance view, on which a promise binds because the promisor has deliberately
  led the promisee to expect a certain performance and to shape his affairs around
  that expectation, so that the wrong in breaking it is the wrong of betraying an
  assurance one has deliberately created.


  The textbook contrast between them is the unheard promise: a promise the promisee
  never learns about, which the convention view can still treat as binding and the
  assurance view cannot. That case is doing too much work in the literature and I
  don''t trust it, because a defender of either view can redescribe it. What I need
  is the reverse case, which I have not seen constructed anywhere: a case in which
  the convention view must say that no promissory obligation was ever generated, while
  the assurance view must say that one was, and that it still binds.


  Please construct that case to the following specifications.


  1. Ordinary life... one paragraph, realistic...

  2. The promise must be sincere, voluntary, welcome, and free of coercion, deception,
  or any misrepresentation by the promisor — and the promisor must not be at fault
  in any way I could point to. The reason the convention view withholds an obligation
  must lie inside the practice''s own rules — in who is competent to perform the act,
  or in what the act can be about — and not in changed circumstances, impossibility,
  or the wickedness of the content.

  3. The promisee must end up no worse off than he was before the promise, and ideally
  better off. I want the obligation, if there is one, to be owed because of the assurance
  itself and not because anyone was damaged; if the case can be read as a claim for
  compensation, it doesn''t do what I need.

  4. No legal reasoning — I''m after the moral question, and what a court would enforce
  is a different question that would let the answer cheat.

  5. Don''t reuse the standard cases (dying promisee, promise made in a game or as
