  **Draft**


  David Hume died in 1776, having written the essays that made him, along with his
  friend Adam Smith, one of the founders of political economy. Set aside the mechanics
  of time travel: the question is what his theoretical commitments, as they stand
  in the essays on commerce, money, interest, the balance of trade, and public credit,
  would commit him to on monetary arrangements that could not have been imagined in
  his lifetime. I want the answer derived from his system, not from a general impression
  of what an eighteenth-century gentleman would have thought.


  The features of the present world I want him to confront are these. First, money
  is no longer a commodity. There is no metallic backing anywhere in the system; almost
  all money consists of deposits created by commercial banks when they lend, plus
  central-bank reserves, and central banks set the price of reserves rather than the
  quantity of money, which is left to whatever credit demand produces. Second, there
  is the so-called state theory of money: the claim that what gives fiat money its
  value is not scarcity or convertibility but the state''s power to levy taxes payable
  in that money and nothing else, so that money is a creature of sovereignty rather
  than of commerce. Third, there is a reform proposal now usually called sovereign
  money or full-reserve banking: strip commercial banks of the power to create deposits,
  require them to hold reserves equal to their deposit liabilities in full, and leave
  the creation of money to the central bank alone; lending would then be financed
  out of pre-existing funds rather than out of newly created ones. Fourth, one national
  currency, the US dollar, serves as the world''s reserve asset, which means one country
  can run deficits indefinitely without the corrective mechanism that is supposed
  to follow from money draining abroad.


  For each of these, I want Hume''s likely position, argued from his texts and his
  arguments rather than from his temperament, and I want the answer to mark the difference
  between what his premises actually force and what is merely plausible extension.


