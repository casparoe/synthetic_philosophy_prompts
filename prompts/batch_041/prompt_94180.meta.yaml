  this particular audience will arrive with or develop on the way, and precisely where
  in the sequence each should be headed off.


  A few constraints on the plan. I want the carrying case to be eyestalk ablation
  in penaeid shrimp broodstock — the routine removal of one or both eyestalks from
  breeding females in maturation facilities to accelerate spawning — rather than the
  octopus, which is the example they will all reach for and which concedes the argument
