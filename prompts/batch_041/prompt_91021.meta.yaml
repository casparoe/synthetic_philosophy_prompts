  Dispositions: The classic dispute — simple conditional analysis (SCA): x is disposed
  to M when C iff (if C, x would M). Finks (Martin: a fink makes the disposition vanish
  when C obtains) and masks (Johnston: something blocks the manifestation without
  removing the disposition) both break SCA in opposite directions. Reformulated analyses
  (Lewis: "iff, if C and x retains the disposition, x would M" — but circular; Manley
  & Wasserman: proportionality; Choi: ...). Two camps for adversarial collaboration:

  - Camp A: "Conditionalist" — the disposition can be captured by a suitably refined
  conditional (or set of conditionals), so no irreducible dispositional property is
  needed.

  - Camp B: "Anti-conditionalist / dispositional essentialist" — finks and masks show
  the conditional analysis fails in principle; dispositions are irreducible, and the
  causal basis does the work.


