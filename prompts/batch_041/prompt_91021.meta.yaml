  or acceptable? (ii) Does the masking case show that the disposition''s manifestation
  is not necessary, or merely that "when C" needs refinement? (iii) Does "the disposition
  is retained under a fink" vs "the disposition is removed" have a fact of the matter
  independent of our interests? (iv) Are dispositions'' identity conditions tied to
  their typical manifestation or to their causal basis?


