  - The classic two-urn thing. Urn A has 50 red and 50 black balls. Urn B has 100
  balls, red and black in some unknown proportion. Most people will bet on red from
  A over red from B, and also on black from A over black from B — even though if you''re
  indifferent-ish you can''t coherently hold both, since the odds on B have to be
  50/50 on average. The point isn''t that people are stupid; it''s that they seem
  to treat the known-odds urn as worth more than the unknown-odds one, per bet.

  - So people distinguish risk (known odds) from ambiguity (unknown odds), and are
  often willing to pay to avoid the second. There''s a whole family of decision rules
  built on this: act as if the worst probability in your range is the true one (so
  you maximise the minimum expected payoff), or take a weighted blend of the best
  and worst, or add a fudge factor to the discount rate. I don''t need the maths,
  I need the discipline.

