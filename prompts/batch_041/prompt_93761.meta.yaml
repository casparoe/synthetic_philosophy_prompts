  Ghazālī''s occasionalism: In the 17th discussion of the *Tahāfut al-Falāsifa*, he
  argues against the philosophers'' claim that effects follow necessarily from causes.
  He says the connection between what is habitually believed to be a cause and what
  is habitually believed to be an effect is not necessary. E.g., the quenching of
  thirst by drinking water, or the burning of cotton on contact with fire. Fire doesn''t
  burn; God creates the burning. He uses the miracle (cotton burning when prophet
  touches it, or Abraham in the fire) to show that the connection isn''t necessary.
  Two positions: (1) deny necessary connection but keep causal efficacy as God''s
  direct creation (occasionalism); (2) the philosophers'' view of necessary causation
  via natures.


  Hume: causation as constant conjunction + mental habit; denies necessary connection
