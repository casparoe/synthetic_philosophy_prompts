  cause and effect, but Ghazālī grounds regularity in God''s will/habit (free, could
  be otherwise, hence miracles possible), while Hume denies any necessary connection
  in the world and locates the "necessity" in the mind''s determination. Both allow
  that we can''t prove a priori that fire burns. Ghazālī allows miracles (God can
  break the habit); Hume... has his famous discussion of miracles in the *Enquiry*,
  arguing we never have sufficient testimony. So a crux: are miracles possible? Ghazālī:
  yes (God''s free will). Hume: he doesn''t deny possibility of violating laws of
  nature per se but denies we could ever have evidence.


