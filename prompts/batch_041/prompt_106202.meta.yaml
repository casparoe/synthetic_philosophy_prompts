  market is to central planning." That''s a nice one: Hayek''s "the market as a discovery
  procedure" / knowledge-of-particular-circumstances analogy, applied to governance.
  The audit: does the price system analogy transfer when the "good" being priced is
  a policy outcome whose value is contested and manipulable? Where does it break —
  externalities, manipulation, the fact that market participants must be able to bet
  on the outcome, the definition of the metric, etc. That''s a rich audit.


  - AI control vs alignment: analogy — "safety measures that assume the model may
