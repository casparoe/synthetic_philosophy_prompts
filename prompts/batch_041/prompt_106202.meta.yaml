  and alternatives. Or "the past is a river with eddies". Actually there''s a well-known
  analogy: the "chaos/butterfly" analogy for historical contingency vs inevitability.
  Also "history as a train on rails" vs "history as a bramble bush". There''s also
  the Berlin/ Carr debate. A known analogy: "the historian''s counterfactual is like
  the physicist''s controlled experiment." Also the "possible worlds" analogy — treating
  counterfactual history as possible worlds with a similarity metric (Lewis). That''s
  actually quite good: historians borrow possible-worlds talk, and Lewis''s similarity
  metric (which weights avoiding big miracles, and match of particular fact) is used
  implicitly. That''s a nice "in the weeds" but well-known enough analogy.


