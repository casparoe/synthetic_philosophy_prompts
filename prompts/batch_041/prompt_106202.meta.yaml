  Audit questions: what maps onto what? In the source: the price system, dispersed
  tacit knowledge, profit/loss, voluntary exchange, consumer sovereignty, the entrepreneur.
  In the target: prediction markets on policy outcomes, the metric (a welfare measure),
  the conditional market (P(metric | policy X passes)), voters setting values, bettors
  setting beliefs. Where does it break?

  1. Prices arise from actual transactions where both parties bear the opportunity
  cost; prediction market prices are probabilities, which encode belief not value,
  and the "outcome" being priced is not a good anyone consumes.

  2. The Hayekian argument is about tacit knowledge of particular circumstances and
  its use in production; but the futarchy claim needs the market to know which outcomes
  are good — but by construction futarchy doesn''t let the market decide values, only
  beliefs. So the analogy supports less than the futarchy conclusion: it supports
  "markets know facts better than planners," not "markets know what to do."

  3. Reflexivity/manipulation: if the market determines policy, then trading is a
  political act with an instrumental payoff beyond accuracy; the price can be moved
  to make a policy win. In the Hayekian system, no single trader can profit by making
  the price "wrong" in a way that changes the world except by actually producing/consuming.
  Well, there is market manipulation in real markets, but the payoff structure differs.

  4. The metric problem: the conditional markets require an agreed, measurable, non-manipulable
  welfare metric; the choice of metric is itself the central political question. Hayek''s
  system needs no metric.

  5. Public goods/externalities: markets fail precisely where politics is needed;
  the analogy is drawn from a domain where the market''s claims are strongest to one
  where they are weakest.

  6. Liquidity/thin markets: the "wisdom of crowds" requires many independent informed
  traders; a futarchy market on a specific policy may be thin and dominated by a few
  insiders.


