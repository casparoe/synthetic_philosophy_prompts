  "the brain is a computer" or "the eye is a camera" or "the immune system recognizes"
  — hmm. Actually a good one: people say the intentional stance toward a chess program
  / a thermostat is like the stance toward a dog; or "the two-bitser is to genuine
  intentionality as a mousetrap is to a mouse". Hmm. Another common analogy: derived
  intentionality is like the meaning of words in a book — the book has meaning only
  because authors/readers do; original intentionality is like... Actually the classic
  analogy in the debate: Searle''s "the word ''hamburger'' on a wall" — no. The "Chinese
  room" itself is an analogy. Dennett''s "two-bitser" is an artifact case. A common
  analogy that people lean on: an AI system''s "understanding" is like the meaning
  of a dictionary — a self-referential loop that never touches the world. That''s
  a good analogy to audit: "a dictionary is a closed loop of definitions, so meaning
  must come from outside; hence LLM ''understanding'' is derived." Actually the dictionary
  analogy is interesting: the dictionary''s circularity argument. That maps onto:
  symbols defined only by their relations to other symbols. And Dennett would say
  the intentional stance is fine and the original/derived distinction is not principled.
  So the audit: where does the dictionary analogy break? A dictionary is static and
  not embedded in a causal-inferential economy of use... Hmm, this is good and quite
  in-the-weeds but all the concepts are well-known (Dennett''s intentional stance,
  Searle''s derived intentionality, Chinese room, Harnad''s symbol grounding).


  - Futarchy and governance by prediction markets: analogy — "the market is a machine
  for aggregating information"; "futarchy is like a ship where the navigator..." Common
