  Setup: two intersections. At the first, if you exit you get 0. At the second, if
  you exit you get 4. If you go past the second you get 1. The driver can''t tell
  which intersection he''s at, so his strategy is a single probability p of continuing
  at each intersection (same at both, since he can''t distinguish).


  If he continues at first (prob p), he arrives at second; there he continues with
  prob p → payoff 1, exits with prob (1-p) → payoff 4. So value from second intersection
  = 4(1-p) + p·1 = 4 - 3p.

  At first: continue with p → 4-3p; exit with (1-p) → 0. So value = p(4-3p).

  Maximize: 4p - 3p² → derivative 4 - 6p = 0 → p = 2/3. Value = 4·(2/3) - 3·(4/9)
  = 8/3 - 4/3 = 4/3 ≈ 1.333.


