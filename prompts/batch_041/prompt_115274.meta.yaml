  Draft:


  You are asked to write a piece of sustained deadpan satire in the form of an internal
  memorandum. The setting is an invented firm whose business is fitness and whose
  ledger is a variance decomposition. The firm''s senior management is the gene''s-eye
  view of evolution; its workforce is a population of organisms; its shareholders
  are replicators; its divisions are groups and demes. The memo is issued by an invented
  office — for instance, an Office of Fitness Accounting, or a Committee on Levels
  of Booking — and announces a change in the level at which fitness is recognized
  as revenue, together with the disputes the change has provoked.


  Constraints:


  - 700–900 words, in the register of a real corporate memo: headings, numbered clauses,
  a policy rationale, a closing signature from an invented official with an invented
  title, and one appendix (e.g., a dispute form or a glossary).

  - The humour must come from the biology and the philosophy, not from whimsy. Every
  joke must be recognizably an instance of an actual position, argument, or objection
  in the levels-of-selection debate; a working evolutionary biologist or philosopher
  of biology should find the piece fair rather than loose. Do not caricature one side:
  the memo''s author should be a partisan whose partisanship is the joke, and the
  objections of the other side should be stated at their strongest.

  - The memo should earn its laughs from at least these disputes: whether a group-level
  term in a variance decomposition names a distinct causal process or merely re-partitions
  the same total; whether treating a higher level as "the real" level of selection
  commits an averaging fallacy; how altruism at one level can be selfishness at another,
  and what follows for the description of a trait; what free-riders and cheaters do
  to the possibility of group-level adaptation, and what conditions (structure, relatedness,
  heritability of group-level differences, between-group variance) are required for
  group-level selection to matter; how to classify genetic elements whose interests
  diverge from the rest of the genome; and whether kin selection and group selection
  are rival explanations or two bookkeepings of one process.

  - Nowhere may the memo cite a scholar, a paper, a date, or a study. No reading lists.
  Assume the reader''s library is empty and the reader''s concepts are not.

  - Include one clause that cuts against the memo''s own author: the policy, applied
  consistently, implies something unwelcome about the status of the office issuing
  it (or of the firm itself). Do not soften this; let it stand.

  - The irony must remain legible to a reader who knows no biology: a careful reader
  should be able to tell that the memo is a joke and roughly what is being sent up,
  without any sentence winking at them.


  The target is a habit of argument rather than a person: the move of settling a substantive
  question about causation — at what level selection acts, and whether higher-level
  terms do explanatory work — by choosing an accounting convention, and the mirror-image
