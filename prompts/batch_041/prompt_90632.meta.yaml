  Philosophical reading: Ego''s review is testimony of the most authoritative kind,
  but the film insists that the moment of aesthetic revelation is first-person and
  non-transferable — Ego''s childhood memory is private. Yet the film also shows the
  power of a critic to shape what others experience (Ego''s review of Gusteau''s made
  him lose stars, killed him?). The acquaintance principle says you can''t know a
  work is beautiful without experiencing it; but the film shows something subtler:
  that a critic''s testimony can create the conditions for experience, and that the
  film''s audience itself learns from Remy''s judgments without tasting anything.
  And the "anyone can cook" slogan: is that a claim in the domain of aesthetic testimony
  — a claim about who can be a judge? Also: the film''s own audience is in Ego''s
  position — we can''t taste; we must take the film''s word for it that the dish is
  sublime. That''s a lovely meta-point: cinema as a medium of testimony about taste.
  The film must convey gustatory quality through images and narrative — i.e., the
  film is an act of aesthetic testimony about a sense it cannot transmit. That''s
  a genuinely fresh angle, and it''s the kind of thing a model could think about but
  hasn''t memorized.


