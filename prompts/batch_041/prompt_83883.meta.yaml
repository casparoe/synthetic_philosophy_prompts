  Key Hofstadter idea: meaning is not located in the message; the inner message is
  recoverable only relative to a decoder with the right prior knowledge; the outer
  message must act as "triggers" on a decoder that already has the machinery; the
  frame message requires the decoder to already see the object as an information-bearer.


  The argument that proves too much: Start from "the outer message can never be spelled
  out; it must be supplied by the decoder." Consequence: whatever a decoder supplies
  determines the message; different decoders supply different outer messages; so there''s
  no fact about what the message says. Push further: since the outer message is supplied
  by the decoder, and the decoder''s supply is itself not governed by the message,
  the message is a projective test — every structure carries whatever message its
  decoder projects. Then: the diffraction film, the novel, the inkblot are on a par.
  And: the notion of the sender''s intended meaning (the inner message as "meaning
  intended by the sender") becomes either inaccessible or vacuous.


  Then a second horn: if meaning is what the decoder constructs, then the sender''s
  intention drops out entirely; but then "the sender transmitted M" is never true,
  which proves too much because we do distinguish cases where a decoder misreads (a
  novice misreading the diffraction film is wrong, not creative). So the theory cannot
  account for the difference between interpretation and misinterpretation — and the
  scientist cares about that: the novice''s reading of the film is wrong.


  The chain:


  (1) To understand a message is to build the correct decoding mechanism; the message
  itself cannot supply the instructions for its own decoding (any such instructions
  would already presuppose the mechanism). [Hofstadter''s point about the outer message
  being triggers.]

  (2) So whatever supplies the decoding mechanism is not the message but the decoder''s
  prior repertoire.

  (3) Therefore the meaning a structure has for a decoder is determined by the decoder''s
  repertoire, not by the structure.

  (4) A decoder''s repertoire is fixed by its history and constitution, and could
