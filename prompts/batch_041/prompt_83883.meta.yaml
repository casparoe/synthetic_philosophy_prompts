  Setup: Hofstadter''s analysis of the location of meaning: a message has a frame
  message (how to get at the message, e.g., the sequence of characters), an outer
  message (how to decode the inner message — instructions on the code), and an inner
  message (the content, which is a set of "isomorphisms" the decoder can construct
  between the message''s structure and some aspect of the world; the meaning is the
  isomorphism, not intrinsic to the message). Consequence: whether something is a
  message, and what it means, depends on the decoder''s prior knowledge and the decodings
  it can find. Meaning is thus not located in the message but in the decoding act
  / the isomorphism between message structure and world structure.


  The argument that proves too much: Something like:


  (1) A physical object or event carries meaning only insofar as some decoder can
  find an isomorphism between its structure and something else. (meaning = isomorphism-finding)

  (2) For any string of symbols, and any content, one can construct a decoding scheme
  (arbitrary code) under which the string expresses that content. (This is the "arbitrary
  code" point: any message can be made to say anything given the right outer message.)

  (3) So for any physical object whatsoever — a rock, a cloud, the pattern of tea
  leaves — there exists a decoding scheme that makes it carry any content you like.

  (4) Therefore there is no distinction between something''s being a message and someone''s
  taking it as one.

  (5) But that proves too much: it makes the difference between the printed page of
  a novel and a random ink spill merely a matter of how one chooses to look at it;
  it makes the claim that a signal was "sent" by an intelligence empty; and it would
  make the "frame message" that tells you a message is a message equally arbitrary,
  so we get an infinite regress of outer messages.


