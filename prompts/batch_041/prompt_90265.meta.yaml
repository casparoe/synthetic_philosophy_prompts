  I''ve been reading rationalist blogs and forums for something like fifteen years
  now, and the argument I keep coming back to is Samuel Scheffler''s afterlife conjecture:
  the claim that most of us are quietly banking on the survival of people after our
  deaths, and that a great deal of what we care about would lose its point if we learned
  that humanity would end shortly after we did — even though no living person would
  be harmed by that ending, and even though we''d all be dead by then anyway. The
  usual discussion of it goes one of two ways: either people nod along and say it
  shows extinction is bad for reasons beyond the deaths involved, or they object that
  it only shows we''re irrational about our own projects. Both responses strike me
  as too quick, and neither is a story.


  So: write a short story that takes the conjecture seriously as a piece of worldbuilding
  and stress-tests it rather than illustrating it.


  Setting and constraints:


  - The premise is public and undisputed: humanity will end in about eighty years,
  for reasons the story doesn''t need to explain and shouldn''t dramatize. Everyone
  now alive will die of ordinary causes first. There is no last-minute reprieve and
  no ambiguity to hedge with.

  - Tell it from the point of view of someone whose work faces backward rather than
  forward — a conservator, archivist, translator, restorer, or something in that family
  — so that "who is this for?" is a live question for a project that was never aimed
  at the future in the first place.

  - Put at least three responses to the premise in the story, embodied in characters
  and in concrete decisions rather than announced: one who finds their work emptied
  of point, one who finds it entirely unaffected, and one whose sense of mattering
