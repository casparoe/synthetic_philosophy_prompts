  Scheffler''s Death and the Afterlife (2013) — the "afterlife conjecture": we care
  about the survival of humanity after our deaths, and much of what we value now would
  be undermined if we knew humanity would end soon after our deaths (the "doomsday"
  thought experiment: imagine humanity will cease 30 days after your death). Scheffler''s
  point: the value of many of our projects and activities depends on the assumption
  that they''ll be carried on by future generations. So extinction is bad beyond the
  deaths because it retroactively undermines meaning. Objections: Brueckner & Boorse,
  "the afterlife conjecture" critique — the "modest" version. Also Samuel Scheffler''s
  "conservative" claim. Also critics: Steven Luper? Also "collective afterlife" vs
  personal. Also there''s a claim that the doomsday scenario''s badness is a "sense
  of loss" but maybe it''s irrational, or maybe what matters is the value of future
  people, not our own projects. Also Seana Shiffrin, Susan Wolf "The Meanings of Lives".
  Also "The Afterlife" in Death and the Afterlife includes the essay "The Afterlife
  (II)".


