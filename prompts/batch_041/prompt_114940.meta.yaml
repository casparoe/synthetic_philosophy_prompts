  1. The Presumptuous Philosopher: under SIA, the hypothesis "the universe contains
  10^100 more observers than we thought" gets boosted by a factor of 10^100, so we
  should be near-certain of it. Ask: is that a reductio or a bullet you bite? Follow-up
  if he says "bullet": what stops the argument from going to infinity (the "infinitely
  many observers" case), where the SIA measure diverges?

  2. The reference class problem: SIA needs a measure over observers — which observers
  count? Ask how SIA avoids the reference class problem that plagues SSA. Follow-up:
  if the class is "all observers", does that include animals, AIs, etc.?

