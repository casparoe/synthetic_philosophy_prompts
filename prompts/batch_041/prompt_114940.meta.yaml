  Let me think about the regress problem. An infinitism defender: justification requires
  an infinite, non-repeating chain of reasons, each reason must be "sufficient" and
  the chain must be "non-circular", and the infinite series must be "available" to
  the subject. Standard objections: (1) finite minds can''t grasp infinite chains
  — Klein''s response: it''s the ability to extend the chain, not actual occurrence;
  (2) the "doxastic" vs "propositional" availability; (3) the objection that infinitism
  makes justification impossible because you can never complete the chain; (4) the
  "reasons must be non-repeating" — objection from the possibility of loops with new
  content; (5) the charge that infinitism collapses into coherentism or that it can''t
  account for the epistemic status of the whole chain (the "no starting point" problem);
  (6) the objection from "meta-justification" — what justifies the claim that justification
  requires infinite chains? (self-application problem: the principle of infinitism
  itself).


