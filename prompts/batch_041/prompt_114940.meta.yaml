  Beauty (roughly), SSA = halfer. Ask how the guest responds to the "no new information"
  argument for halfer. Follow-up on the "Beauty the bookmaker" / "technicolour" variants
  (e.g., the "Beauty in the extreme" case, or the "Beauty with a biased coin").

