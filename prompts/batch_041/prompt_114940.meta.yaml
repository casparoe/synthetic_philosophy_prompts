  of a basic belief? Follow-up: if she says the chain has no terminus, ask what makes
  the *whole* chain justifying rather than each link.

  2. The "availability" problem: Klein insists the chain must be *available* to the
  subject for the reasons to justify *her* belief; if we drop that, does the view
  lose the internalist intuition that justification is a normative status the subject
