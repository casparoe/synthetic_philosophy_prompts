  Let me recall Harsanyi''s aggregation theorem precisely.


  Harsanyi (1955) "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons
  of Utility." He argued: if (i) social welfare is a function of individual utilities
  (welfarism), (ii) social preferences satisfy the expected utility axioms (von Neumann-Morgenstern)
  and individual preferences do too, and (iii) the Pareto principle holds (if everyone
  prefers x to y, society prefers x to y), then social welfare is a weighted sum of
  individual utilities — i.e., utilitarianism (with weights). The "aggregation theorem"
  derives a linear sum.


  There''s also Harsanyi''s "impartial observer" / veil of ignorance argument: social
  preferences should be the preferences an individual would have if they had an equal
  chance of being anyone in society (equiprobability), which yields utilitarianism
  via expected utility maximization.


  Key subtle points:

  - The theorem assumes interpersonal comparability of utility (cardinal, comparable).
  Harsanyi assumed utilities are interpersonally comparable. Some summaries say it
  assumes only ordinal — wrong.

  - The weights: the theorem gives a weighted sum, and equal weights come from the
  equiprobability assumption in the veil of ignorance argument, not from the aggregation
  theorem alone. A popularizer might conflate the two theorems.

  - Pareto: Harsanyi''s Pareto condition. There''s the "strong Pareto" vs "weak Pareto"
  issue. Also Sen''s critique: the theorem''s Pareto condition combined with welfarism,
  or Sen''s "liberal paradox" (Sen 1970) about Pareto and liberalism. Also the issue:
  Harsanyi''s theorem requires that social and individual preferences satisfy the
  same expected-utility axioms; this "sure-thing" / expected utility assumption is
  contested. Also the "Harsanyi-Sen debate" on whether the theorem establishes utilitarianism
  or whether it''s just an artifact of the axioms.

  - Common misrepresentation: "Harsanyi proved that utilitarianism is the uniquely
  rational social choice under the veil of ignorance." But the aggregation theorem
  and the veil-of-ignorance argument are distinct; also Rawls''s maximin vs Harsanyi''s
  expected-utility maximization is a dispute about risk aversion (Rawls rejects maximizing
  expected utility behind the veil). A popularizer might say Harsanyi "refuted Rawls"
  — no.

  - Another subtle point: The theorem yields a weighted sum with weights possibly
  reflecting "social importance"; equal weights require an additional argument.

  - Also: Harsanyi''s theorem uses "individualistic" ethics — social welfare evaluated
  only by individual utilities. Sen''s critique: welfarism ignores non-utility information.

  - Also the conflation of "cardinal utility" (Harsanyi''s assumption) with "ordinal
  utility" and "interpersonal comparisons."


