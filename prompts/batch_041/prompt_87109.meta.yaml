  Procedure design: For a style committee deciding whether a given usage should be
  changed, kept, or flagged as author''s choice. Steps:


  1. Identify the term and its claimed function (generic/inclusive vs. specific).
  Test: is it being used to pick out all people or a subset?

  2. Substitution test (the Person Paper test): swap in a term for a different social
  category that is currently unmarked-in-the-same-way (e.g., race). If the sentence
  becomes comic, absurd, or reveals that the category is being treated as default,
  the "generic" reading is doing covert work. Also the reverse test: substitute a
  term for the non-default category and see if meaning shifts.

  3. Markedness test: does the sentence require the reader to know the subject''s
  gender/race when that fact is irrelevant? Is there a parallel term for the other
  group that would sound odd (e.g., "she" for a generic doctor but "he" for a generic
  nurse)?

  4. False-generic test: check whether the "inclusive" reading survives in the sentence''s
  actual predication — e.g., "the chairman will call the meeting to order; he will..."
  Does the anaphoric pronoun exclude? Does the term appear in contexts where the inclusive
  reading is impossible ("man-made," "mankind''s achievements")?

  5. Historical/etymological test — but flag that etymology does not settle present
  meaning; the Person Paper''s "suffix ''white'' is not pronounced with a long i"
  argument parodies the etymological defense.

  6. Audience/uptake test: does a substantial portion of the actual readership read
  the term as excluding? Evidence standards: dictionary labels, corpora, style guides,
  reader complaints — but the procedure must say when this is contested and cannot
  be settled by the committee.

  7. Cost/asymmetry test: compare the cost of change (minor awkwardness, a rewrite)
  with cost of retention (exclusion, misreading). Since costs are asymmetric, default
  to the inclusive alternative where a natural one exists; if none exists, choose
  the least bad and say so.

  8. The "no natural alternative" case: singular they, "freshman"/"first-year," "chair,"
  etc.

  9. Mark where judgment cannot be eliminated: contested terms tied to identity politics,
  reclaimed terms, quotations from historical sources, legal/technical terms of art,
  translated works, character dialogue in fiction.


  Also must include the "satire uptake" issue: a procedure for when the house itself
  wants to use ironic or satirical framing (like the Person Paper) to make the point
  — the committee must decide whether satire is permissible in the style guide, and
  the risk that satire gets read straight. That''s the "hard case."


