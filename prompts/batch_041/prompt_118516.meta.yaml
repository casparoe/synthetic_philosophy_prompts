  caused death. (Role/duty)

  15: A neighbor fails to feed the same infant; neighbor could easily but has no relationship;
  infant dies. Verdict: Neighbor did not cause death. This parallels stranger.


  Then ask: "I have a tentative principle: An omission causes an outcome only if (i)
  the outcome counterfactually depends on the omission against the baseline of what
  the agent was required or expected to do, and (ii) the omission is a departure from
  that baseline that is either a breach of a role-specific duty, a failure to mitigate
  a risk the agent created, or part of a plan to bring about the outcome. But this
  makes causation depend on norms, and it seems to say that the two lifeguards each
  caused the derailment, which I deny. It also seems to say the village collectively
  caused the death but no individual did, which I like, but I can''t make the collective
  case work without saying the village is an agent. And it seems to say the bystander
  at the natural rockfall did not cause it, which matches my verdict, but only because
  he had no duty; yet the hiker who started the rock did cause it, which makes creation
  of risk do a lot of work. Is there a better principle?"


  Then ask:

  - Start with a short brainstorming section: list the candidate distinctions and
  what each would predict.

  - Then state one or two precise principles, with necessary and sufficient conditions
  if possible.

  - Test each against every case; make a table if helpful.

  - Identify the pair of verdicts that cannot be reconciled under any plausible principle,
  and say which one should be revised.

  - Then say what the principle predicts for two further cases I haven''t listed:
  (a) an off-duty lifeguard who sees the child drowning and does nothing; (b) a person
  who creates a risk but then loses the ability to warn (e.g., becomes paralyzed)
  and so cannot act; (c) a group of 100 people each of whom could press a button to
  save a child, but only if all press? Or maybe "each could press a button that would
  save the child, but each believes the others will press it" — this is a collective
  action problem. Maybe ask for unlisted cases: off-duty lifeguard, and a person who
  creates a risk but forgets it.

