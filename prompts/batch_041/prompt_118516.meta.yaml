  Let''s outline prompt:


  Paragraph 1: Role and task. "You are a philosopher of causation and action theory.
  I want you to act as a careful conceptual engineer. Do not give me a literature
  review, citations, or reading list. Think carefully, brainstorm first, then answer."


  Paragraph 2: The asker''s verdicts. "I''ve been trying to state what I think about
  causation by omission. Here are my verdicts on cases, stated as plainly as I can.
  In each case, assume the omission is knowing and voluntary, and that the agent could
  have acted easily."


  List:

  1. Stranger at wading pool: child drowns. Stranger could pull her out; does nothing.
  Verdict: Stranger did not cause her death. He is morally culpable, but the death
  was caused by the water and her inability to swim.

  2. Lifeguard at same pool, employed to watch it: texts instead. Verdict: Lifeguard
  caused her death.

  3. Hiker accidentally starts a rock rolling toward another hiker; could shout warning;
  doesn''t. Verdict: Hiker caused the injury.

  4. Bystander sees a rock already rolling from a natural rockfall; could shout; doesn''t.
  Verdict: Bystander did not cause the injury.

  5. Doctor fails to prescribe a cheap antibiotic that would cure the infection; patient
  dies. Verdict: Doctor caused death.

  6. Doctor fails to prescribe a drug that would not have worked; patient dies. Verdict:
  Doctor did not cause death, though may be negligent for other reasons.

  7. Two strangers each independently could close a gate to prevent a train derailment;
  neither does. Verdict: Neither caused the derailment; the derailment was caused
  by the track defect, and their omissions are not causes.

  8. Two lifeguards on duty, each independently could close the same gate; neither
  does. Verdict: Neither lifeguard caused the derailment; the pair''s failure caused
  it, but not either one individually.

  9. One lifeguard on duty, sole person who could close the gate; doesn''t. Verdict:
  Lifeguard caused the derailment.

  10. A village of 100 people could each donate $1 to buy medicine for a child; no
  one donates; child dies. Verdict: No individual villager caused the death; the village''s
  collective omission did.

  11. A company programs a self-driving car not to brake for a certain pedestrian
  edge case; it doesn''t brake; pedestrian dies. Verdict: The company/programmers
  caused the death; the car''s failure did not cause it, because the car is not an
  agent.

  12. A poisons B''s tea. C sees the poisoned cup and could swap it but doesn''t.
  B dies. Verdict: A caused B''s death; C did not.

  13. A camper starts a campfire and then falls asleep; the fire spreads. He could
  have stamped it out but doesn''t. Verdict: He caused the fire damage.


