  Question: In the Pensées, Pascal keeps returning to the relationship between justice
  and force, and to the idea that custom or established practice is what actually
  grounds law. Explain his account of how justice and force relate, and what he thinks
  that shows about the foundations of political obligation. Your answer should make
  clear what is descriptive and what is prescriptive in Pascal''s view.


  Student answer:

  "Pascal''s basic insight is that justice and force are two separate things that
  only meet by accident. Justice on its own has no way of making itself effective
  — you can be as just as you like, but if nobody can compel obedience you will just
