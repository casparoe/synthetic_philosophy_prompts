  Subtle mistakes to embed:

  1. Attributes to Pascal a straightforward version of Thrasymachus: that justice
  just is whatever the powerful decree. Pascal does say we cannot find justice, that
  custom is the basis, and that "the just is what is established" — but his point
  is more about the inability of reason to ground law, plus the necessity of force
  to back it, and his stance is closer to a resigned conservatism / an anti-rationalist
  account of political authority, plus the famous claim that we should obey laws because
  they are laws, not because just. So a student who says "Pascal endorses might makes
  right as the true definition of justice" conflates Pascal''s diagnosis with an endorsement.

  2. Conflates Pascal''s "three degrees of elevation of the pole" remark about the
  arbitrariness of justice with Montaigne''s cultural relativism, treating it as Pascal''s
  own final view rather than as a device in his apologetic strategy (to humiliate
  reason and drive us to revelation). Actually the "three degrees" line is about how
  a different latitude makes a different law; and it''s part of the argument that
  reason is corrupt. Fine.

  3. Misses the theological frame: for Pascal, true justice exists only in God / the
  city of God, and earthly justice is a shadow; hence the "justice without force"
  line is not a cynical dismissal of justice but an account of our fallen political
  condition. A student might say Pascal denies there is any true justice at all —
  that''s a subtle overreach.

  4. Might misattribute: the phrase "justice without force is powerless" — sometimes
  people attribute to Pascal the idea that force should be added to justice, but the
  student could claim Pascal wants to subordinate force to justice and thus thinks
  a just sovereign''s force is legitimate — missing that Pascal''s point is that justice
  and force must be joined precisely because justice cannot establish itself.

  5. Also possible: the student says Pascal thinks we should obey unjust laws out
  of prudence/self-preservation (Hobbes) whereas Pascal''s ground is more about the
  impossibility of justified rebellion and the fact that custom is the only available
  foundation.


  Also maybe a factual mistake: attributing to Pascal the "Ring of Gyges" — no.


  Another subtle mistake: student says Pascal''s view is in the Provincial Letters
  rather than the Pensées, or dates. Better to avoid dates. Or student says Pascal
  claims "justice is the custom" but attributes the "might makes right" line to Montaigne,
  swapping attributions. Hmm, I could have the student attribute to Pascal a claim
  he actually attributes to Montaigne, or vice versa.


  Also, the student could conflate Pascal''s "custom is the source of law" with Hume''s
  convention-based account, saying Pascal anticipates Hume''s argument that justice
  is an artificial virtue. That''s a subtle mistake: Hume grounds artificial virtue
  in utility and convention; Pascal grounds law in custom and force and denies reason
  can justify it; and Pascal is not a naturalist about justice in Hume''s sense. That''s
  a nice subtle conflation.


