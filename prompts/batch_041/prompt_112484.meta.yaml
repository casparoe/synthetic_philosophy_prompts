  If there are developments in cosmology, statistical mechanics, or the foundations
  of causation that would genuinely move a committed defender, tell me what they are.
  If the most persuasive consideration against the view is conceptual rather than
  empirical, say what it is and why it should or should not worry me. Please answer
  in British English.


