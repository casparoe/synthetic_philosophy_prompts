  Structure:

  1. Frame: I''m an undergraduate in a course on early modern philosophy (metaphysics
  of perception), we''ve just finished the Principles/Three Dialogues and the master
  argument literature. In a seminar, the tag was used in a particular way.

  2. The two conflicting uses: a classmate used it to say the question about the unperceived
  tree is ill-formed / that there''s nothing to investigate; another used it to mean
  the tree persists as a standing possibility of perception; and a third complaint:
  if being is being perceived, then what about the minds doing the perceiving?

  3. The ask: lay out the menu of precise readings, from trivial to radical, for each:
  what the claim is; what kind of claim (definitional/semantic about the word ''exist'',
  metaphysical identity, dependence claim, epistemic/conceivability claim, phenomenological
  claim); whether it''s plausible as an interpretation of Berkeley and whether it''s
  plausible on its own; and whether it supports the use in the seminar (dismissing
  the question; supporting the permanent-possibility reading).

  4. Specific dimensions to address (the in-the-weeds injections): scope (does the
  tag cover minds? does it cover abstract objects, God''s ideas, the "esse" of numbers?),
  direction (one-way or biconditional — does perceiving suffice for existing? what
  about hallucinated/imagined perception, contradictory or impossible contents? what
  about a perception by two minds), tense and modality of percipi (actually perceived
  vs. perceivable vs. perceived by someone at some time), the relation between the
