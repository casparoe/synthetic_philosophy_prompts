  Rousseau''s views on theater: In his Letter to d''Alembert (1758), he argued against
  establishing a theater in Geneva. Key points:

  - Theater is a place of amusement that weakens civic virtue and patriotism.

  - It makes virtue theatrical; spectators applaud noble sentiments but do not act
  on them.

  - It excites passions, especially love, and makes vice attractive.

  - Actors are professional dissemblers, and the actor''s art is one of false sentiment;
  actors are excluded from the community.

  - The theater isolates spectators, replacing communal festivals with private entertainment.

  - It is expensive and corrupting; a republic should have open-air festivals where
  citizens are both actors and spectators.

  - He specifically criticized Molière''s The Misanthrope for making the misanthrope
  Alceste ridiculous and the social conformist Philinte admirable, thus teaching sociability
  rather than virtue. He also criticized Racine''s plays for making love the central
  passion.

  - He thought French classical theater, in particular, was a school of coquetry and
  vanity.

  - He contrasted the theater with the festival: in a festival, everyone is seen and
  participates; in a theater, one is hidden in the dark and watches.


  The Truman Show:

  - Truman Burbank lives in Seahaven, a constructed world, a TV show. Everyone around
  him is an actor. The audience watches him. Christof is the creator/director.

  - The film raises questions about authenticity, surveillance, media, reality TV,
  freedom.

  - The audience is complicit: they watch, buy merchandise, cheer when he escapes.
  The film itself is a spectacle.

  - Rousseau''s critique: the audience''s emotional engagement is vicarious; they
  feel for Truman but do nothing. The film''s ending: Truman escapes; the audience
  cheers. Then what? They switch to another show. This could confirm Rousseau''s pessimism:
  the audience''s emotion is fleeting and does not lead to action. But the film also
  makes the audience aware of their complicity. Does it produce a moment of recognition
  that Rousseau thought theater could not? Or does it just make us feel virtuous for
  cheering Truman''s escape, which is itself a spectacle? That''s a great Rousseauian
  reading.


