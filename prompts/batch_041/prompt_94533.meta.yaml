  larger system? (Realism about the system''s "facts" vs. formalism where derivability
  just is what the rules yield.) If you''re a formalist, "C is not derivable" is itself
  a claim needing a meta-system — is the meta-system just another system?

  2. Does the jump need a license — i.e., must you be able to prove the meta-system
  sound/conservative relative to S? (Justificationism) or is the jump self-licensing
  (the conclusion is evident)?

  3. Is the jump a matter of discovering a new *representation* (semantic ascent /
  change of vocabulary) or a new *axiom* (extension of the system)?

  4. Is the "outside" always already inside some larger system (there''s no outside
  — the regress view), or is there a genuine outside (semantic/explanatory gap)?

  5. Does legitimacy depend on what you''re doing: proving theorems, explaining, deciding
  what to do? (Practical vs theoretical JOOTS.)


  Positions (leaves):

  - (A) Formalism/quietism: "outside" claims are just claims in another system; there''s
  no privileged outside; legitimacy = being clear about which system you''re in.

  - (B) Conservative extension: JOOTSing is legitimate exactly when the new system
  is a conservative extension (or when you can prove it doesn''t prove new theorems
  about S... but that''s exactly what you can''t always do). Hmm, that''s more of
  a criterion than a position.

