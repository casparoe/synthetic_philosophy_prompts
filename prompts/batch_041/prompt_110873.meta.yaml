  has to pass what the team calls a continuity interview -- life story, recognition
  of family, their own stated values, and a yes to "do you still feel like the same
  person" -- and only then can they re-consent to the next stage; if they fail it,
  the whole thing stops. Their fallback is a directive the patients sign at the outset:
  if I stop being me, finish the procedure anyway, since whoever comes out the other
  side has my memories and my unfinished business. Half the committee thinks that''s
  humane, half thinks its a machine writing its own permission slip, because the thing
  we''re meant to be testing is the thing doing the testing.


