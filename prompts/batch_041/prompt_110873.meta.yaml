  I can''t get a clean grip on. A neurology group here wants a first-in-human trial
  for patients with a fast, fatal neurodegenerative disease: as regions of the brain
  die off, they replace the lost tissue with a prosthetic that does the same input-output
  job, one small chunk per surgery, spaced out over roughly three years, until by
  the end most of the relevant circuitry is prosthetic rather than biological. The
  patients are terminal and have agreed to it.


