  is the interesting half. The picture explains generation; it does not explain selection.
  Worse, it takes the dials as given. It tells you how to move within a space of variations
  but not how a genuinely new space comes into being. And the acts we most want a
  theory of creativity to explain are exactly the ones that redraw the space.


