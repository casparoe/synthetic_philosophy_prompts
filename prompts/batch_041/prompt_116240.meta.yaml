  Hmm, but I want to be careful: is this factually right? Let me recall the IDA setup
  (Christiano, Shlegeris, Amodei 2018, "Supervising strong learners by amplifying
  weak experts"). The idea: instead of training a model to imitate a human''s answers
  on hard questions, you train it to imitate a human''s *amplified* answers: the human,
  with help from the model, decomposes the hard question into easier subquestions,
  answers each, and the aggregate is the target. Then you retrain (distill) the model
  on these amplified answers, so the model becomes better at answering the original
  question directly; then you can use the better model to amplify further, and iterate.
  So "distillation" here = training the model to imitate the amplified overseer (the
  human+model system), and "amplification" = the human''s use of the model to decompose.
  So the key: the student imitates the *amplified human*, not the previous student.
  Hence no error accumulation in the naive sense; the loop''s ceiling is set by the
  amplification operator, and each round the student''s increased capability improves
  the amplification (since the assistant used in decomposition gets better). So the
  false presupposition "distillation means the student can never exceed the teacher,
  and since the teacher is just the previous student, the loop can only degrade" is
  a genuine subtle confusion: it conflates the teacher with the student (the teacher
  is the human+model amplified system, which includes the human overseer, so it''s
  not "the previous student"), and it treats distillation as the capability-generating
  step.


