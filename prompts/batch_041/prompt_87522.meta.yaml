  I am a philosopher at a small liberal arts college, and next month I have to run
  a single ninety-minute session on Nāgārjuna''s tetralemma for a cohort of graduate
  students in analytic metaphysics and logic. They are quick and they have read no
  Buddhist philosophy at all. I do not want the tetralemma explained to me, and I
  do not want a reading list, a set of citations, or a survey of scholarly positions;
  I want the teaching plan -- the architecture of the explanation, in the order I
  should actually deliver it.


  Four things, plus one.


  First, the order. What has to be in place before the four corners can register as
  anything other than a logical stunt, and what depends on what? My working hunch
  is that the audience needs some grip on the idea of an intrinsic nature or own-being
  -- an essence that a thing is supposed to have independently of anything else --
  before the four corners can be seen as turning on a question rather than on a predicate;
  and that only then does the distinction between two levels of truth earn its place,
  rather than arriving as a piece of mysticism. Tell me where that hunch is wrong,
  and what has to precede what. Assume this audience will not be moved by the suggestion
  that Madhyamaka runs on a different logic; they will immediately reach for paraconsistent
  or intuitionistic readings as the charitable option, and I need the sequence to
  make that move unnecessary rather than merely forbidden.


  Second, the carrying example: one case that does the work for the whole session,
  and an account of what it must have and what it must lack. I do not want the chariot,
  the fire and its fuel, the dream, or the mirage. I want something from ordinary
  contemporary life that the room already has a stake in, and I want to know whether
  the candidates I would reach for -- an artifact with parts, a university, a river,
  a crowd at a station -- satisfy the constraints. In particular, I am worried that
  any example of a whole composed of parts invites the audience to hear a reductionist
  or eliminativist moral, which is the wrong lesson; tell me what the example must
  not invite, and how to block that inference inside the example rather than after
