  ---


  I am a philosopher at a small liberal arts college, and next month I have to run
  a single ninety-minute session on Nāgārjuna''s tetralemma for a cohort of graduate
  students in analytic metaphysics and logic. They are sharp and they have never read
  any Buddhist philosophy. I do not want an explanation of the tetralemma or of emptiness,
  and I do not want a reading list or a set of citations -- I want the teaching plan,
  the architecture of the explanation.


  Specifically:


  1. The order. What has to be in place before the four corners can even be posed
  as a live option for this audience, and in what sequence? I have a sense that the
  four corners look like a cheap logical trick until the audience has some grip on
  what own-nature or intrinsic essence is supposed to be, and on why a Madhyamika
  thinks the question is loaded before it is answered; but I want you to say what
  depends on what, and to say which of my hunches is wrong. Note that this audience
  will not accept a "different logic" gesture, and will reach immediately for paraconsistent
  logic or intuitionism as a charitable reading.


  2. The carrying example. I want one case that does the work for the whole session,
  and I want to know what it must have and what it must lack. I do not want the chariot,
  the fire and fuel, the dream, or the mirage; I want something from ordinary contemporary
  life that the audience will already have a stake in. Say why the example I''d reach
