  is nihilism; emptiness is idealism or mind-only; the fourth corner is a third truth
  value or a mystical ineffable; the tetralemma is a thesis, so it refutes itself;
  dependent origination is just causation; and (the one I''m most worried about) that
  the tetralemma is a device for proving that reality is contradictory. Tell me which
