  Third, the misconceptions, in the order they will form, with the point in the sequence
  at which each should be headed off. My rough list: that emptiness is nihilism; that
  it is idealism or mind-only; that the fourth corner is a third truth-value or an
  ineffable both-and; that the tetralemma is a thesis and therefore refutes itself;
