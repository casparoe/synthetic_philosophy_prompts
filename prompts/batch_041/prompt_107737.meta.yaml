  I am in a reading group on AI safety, and we have been working through the literature
  on low-impact agents — the family of proposals that try to get an agent to avoid
  unnecessary side effects by penalizing it for changing the world, rather than by
  spelling out in advance which changes are acceptable. A friend who knows the area
  better than I do sent me a blog post that he says is the clearest introduction he
  has found, and I want to know how much of its gloss I can trust before I lean on
  it. The post''s central passage runs roughly as follows:


  "Low-impact AI aims to solve the side-effect problem without anyone having to write
  down what we value. The trick is to give the agent a penalty for changing the world:
  in addition to maximizing its reward, it pays a cost equal to the distance between
  the world it brings about and the world as it would have been had the agent done
  nothing — the inaction baseline. Impact is then a purely physical quantity, a matter
  of how far the state has moved, so the designer never has to say which changes are
  good and which are bad. The penalty targets side effects, leaving the agent free
  to pursue its goal; it merely nudges the agent toward the least disruptive route.
  The obvious objection, that an agent which changes nothing is useless, is answered
  by the fact that the agent still optimizes its reward and the penalty only trades
  off against it. What remains is engineering: choose a sensible distance metric and
  tune the penalty''s weight. And the familiar criticism — that you cannot define
  harm without a theory of value — simply misunderstands the proposal, whose entire
  point is to avoid needing such a theory."


