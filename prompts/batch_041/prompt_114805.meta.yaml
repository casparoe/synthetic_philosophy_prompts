  Potential prompt:


  "I am a high-school student preparing a formal essay for a philosophy club, and
  I would like you to argue for the following position: the symbol grounding problem
  is not solved by connecting language models to images, audio, or robotic bodies,
  because those additions supply causal contact with the world without supplying the
  kind of corrective risk that makes a symbol mean something for the system itself.
  To make the argument precise, introduce and use a distinction of your own between
  referential credit and referential collateral. Referential credit is the degree
  to which a system''s use of a term is licensed by the surrounding linguistic and
  social practice; referential collateral is what the system would have to put at
  stake if the term were misapplied—some expectation, action, or prediction that could
  fail in a way the system can register as its own error and revise from. Argue that
  current systems can accumulate enormous referential credit while posting almost
  no referential collateral, and that this is why their apparent reference remains
  borrowed rather than owned. Then state and answer the strongest objection: that
  human beings are also mostly running on referential credit from other people, and
  that collateral is either unnecessary or is just more prediction error. Use a concrete
  example, such as a system that correctly labels a cat in a photograph but cannot
  be wrong about the cat in the way a person can be wrong about whether the animal
  before them is a cat. Distinguish this from the claim that machines cannot have
  experiences or consciousness; the argument should be about reference and meaning,
  not about inner feel. Do not cite sources, do not give a reading list, and do not
  rely on claims about what any particular philosopher or scientist has written. The
  essay should be self-contained, and it should end by saying exactly what would count
  as a system posting referential collateral, and why that is more than a technical
  upgrade."


