  each hold an entitlement they can alienate; (ii) the goods exchanged must be commensurable
  enough to have a rate of exchange, or the exchange must at least be a Pareto improvement
  in each party''s own terms; (iii) the exchange must be voluntary and enforceable;
  (iv) the parties must be the ones whose entitlements are at stake (no third-party
  trading away others'' claims). Then ask: apply to the 2005 deal. What exactly did
  each side give up (sovereigntists: the claim that intervention is never permissible
  without consent; human-rights advocates: automaticity, unilateralism — accepting
  the Security Council gate, and hence the veto). Was the deal a Pareto improvement
