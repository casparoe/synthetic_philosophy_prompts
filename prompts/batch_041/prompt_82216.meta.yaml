  Let me think about Dennett''s kinds of minds. The four creatures:

  - Darwinian: natural selection, blind trial and error over evolutionary timescales;
  fixed phenotypes, no learning (or minimal).

  - Skinnerian: operant conditioning, reinforcement learning; trial and error within
  lifetime; "reinforcement" requires actual reward.

  - Popperian: can simulate hypotheses internally and discard bad ones without dying/trying
  — "the hypothesis dies in my stead." (Dennett attributes to Popper: "let your hypotheses
  die in your stead.")

  - Gregorian: creatures that use tools/thinking tools ("mind-tools"), named after
  Richard Gregory; language, culture, acquired memes. Dennett''s example: a human
  using a word processor or a calculator.


