  I teach a 300-level seminar on democratic theory, 16 students, and when we hit populism
  and the will of the people I''m tired of running the same old tyranny-of-the-majority
  discussion. One 90-minute session, no reading required for the day (they''ll have
  done the Rousseau and the Schumpeter for the week already, so you can assume some
  background but don''t build the activity on them reciting it). I want an actual
  runnable activity with rules and stakes, and I want them to feel the pull of the
  populist claim first — the sense that there really is one authentic will of the
  people and the elites keep ignoring it — and then to watch that same will fracture
  in their own hands depending on how you count it.


  Design the whole thing: setup, materials, roles, timeline to the minute, and a debrief.


  Here''s a rough shape, take it or throw it out. Stage one, they''re a citizens''
  assembly for a made-up town and they vote, all at once, on a single bundled policy
  (say three connected proposals, so the parts aren''t independent — this matters,
  see below). That gives them a clean "will of the people" and it should feel legitimate.
  Stage two, I want a wrinkle that makes them switch from voting on the bundle to
  voting on the parts, or vice versa, and to discover that the two procedures give
  opposite answers even though nobody changed their mind. I''ve seen this called the
  discursive dilemma / doctrinal paradox and I think it''s the right engine here,
  because the whole point is that the assembly is consistent on each part and inconsistent
  as a whole, and there''s no neutral way to say which count is the real will. Don''t
  just do Condorcet''s jury theorem — they''ve all seen that one and it won''t surprise
  them. Stage three, if there''s time, I''d love them to run into the problem that
  someone who controls the order of the votes can control the outcome, without changing
  anyone''s preferences, and that this is what "will of the people" talk tends to
  hide.


  Two more things I want threaded through, because they''re what makes it more than
  a social-choice demo: (a) at some point the "will" should seem to depend on how
  informed and how calm the voters are, so the assembly can ask whether the real will
  of the people is what people actually want or what they would want if they''d thought
  it through — and then hit the wall that there''s no value-free way to specify the
  idealized voter. (b) The intensity problem: someone in the minority cares enormously
  and the majority barely cares, and the counting rule that ignores this should start
  to feel arbitrary.


  Debrief has to map specific moments in the activity onto the ideas: the general
  will vs the will of all, the discursive dilemma, agenda control, and the move from
  actual to idealized preferences (and why that move tends to smuggle in whoever is
  doing the idealizing). Don''t lecture the names up front; let them hit the wall,
  then name it.


  Also tell me: what will predictably go wrong the first time I run this, and how
  to handle it; which students tend to break it (I''ve got a couple who will vote
  strategically just to be clever, and it''ll muddy the sincere baseline I need);
  and be honest with me about what the activity can''t reproduce. I know a real 90-minute
  room of 16 grad students who mostly like each other is nothing like a mass electorate,
  and I know the affective charge of real populism — the resentment, the distrust,
  the scale — has to come from me, not the game. Say so, and say what else is missing.


