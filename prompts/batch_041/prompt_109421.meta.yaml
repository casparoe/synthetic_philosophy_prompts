  Idea: The essay argues that the standard Ellsberg urn demonstration conflates two
  things: (a) aversion to ambiguity in the sense of non-unique probability, and (b)
  aversion to the *comparison* between a bet whose composition is known and one whose
  composition is not (the "own-urn" vs "other-urn" issue). And then: the classic "control"
  that''s supposed to establish (a) — giving subjects a single urn with an unknown
  composition, or making both bets ambiguous — actually introduces a second confound:
  subjects'' beliefs about *which* unknown composition is plausible (a prior over
  compositions). If a subject has a symmetric prior over the unknown urn''s composition
  (e.g., uniform over the number of red balls), then the unknown urn''s subjective
  probability of red is 1/2, so a "pure ambiguity aversion" model must explain why
  equal-mean acts are dispreferred — i.e., it must be a second-order/mean-preserving-spread
  aversion, which is not the same as the maxmin rule. And the maxmin rule (Gilboa–Schmeidler)
  predicts indifference under a symmetric prior? No — maxmin predicts betting on the
  known urn because min over priors of P(red)=0 for the ambiguous urn; so maxmin is
  a different mechanism: it''s "worst-case over priors" rather than "variance in second-order
  beliefs". These can be separated by an experiment where the worst-case prior is
  not the modal one, e.g., where the ambiguous urn has a *lower bound* on red balls
  that''s high: an urn with between 60 and 100 red balls out of 100? Hmm, if you know
  the ambiguous urn has at least 60 red, maxmin says the ambiguous red bet is better
  than the known 50-red urn. But a second-order-aversion model might still prefer
  the known urn if the spread is large? Actually the second-order approach: the act''s
  value = E[P(red)] minus a penalty for variance of the second-order distribution.
  If the ambiguous urn is guaranteed 60-100 red, its mean is 80 with some spread;
  the penalty would have to be huge to offset the 30-point advantage. So the two theories
  make different predictions in a "shifted ambiguity" design. And there''s a further
  prediction: under second-order-aversion, the subject''s preference between the two
  urns should be *reversible* by relabeling colors... Hmm.


  Also the "comparative ignorance" explanation: aversion appears only when the ambiguous
  bet is compared to an unambiguous one; when both are ambiguous (or when the subject
  is offered only ambiguous bets), the aversion vanishes. Fox & Tversky''s own experiment.
  And the "competence" hypothesis: people prefer to bet on events they feel knowledgeable
  about, which predicts that an "unambiguous" urn can be dispreferred if it concerns
  a domain where the subject feels incompetent (e.g., an urn whose composition is
  stated in a language/form the subject distrusts, or the "two-color vs three-color"
  designs where the known-probability option is about a domain the subject feels less
  competent in).


