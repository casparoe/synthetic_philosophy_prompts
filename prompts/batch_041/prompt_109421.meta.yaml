  The claim I want to defend: the standard two-urn demonstration and its usual controls
  do not identify a single phenomenon of ambiguity aversion; at least three distinct
  mechanisms predict the same choices in the standard design, and they come apart
  in a design I propose. ..."


  Then the three mechanisms:

  1. Worst-case-over-admissible-distributions (the "maxmin" reading): the ambiguous
  act''s value is computed at the least favourable composition you consider possible.
  On a symmetric prior (all compositions equally plausible), this still says: prefer
  the 50/50 urn for a red bet, because the worst case for the ambiguous urn is all-blue.

  2. Second-order spread aversion: your best estimate of the ambiguous urn''s red
  fraction is 1/2, the same as the known urn, but you dislike the dispersion of your
  second-order beliefs, so you take the known urn. This is a mean-preserving-spread
  aversion in beliefs, not worst-case reasoning; it can reverse if the ambiguous urn
  is known to be *favourable on average* (e.g., you know only that it contains at
  least 60 red balls).

  3. Comparative ignorance / felt competence: the aversion is produced by the side-by-side
  presentation of a bet you can quantify and one you cannot (or by the felt incompetence
  of the domain), and it attenuates when both options are ambiguous or when the comparison
  is not made salient. Prediction: the same urn pair, presented in separate sessions
  without a shared reference point, yields much weaker preference for the known urn;
  and an option whose probability is *known* but whose domain you feel incompetent
  in can be dispreferred to a merely estimated one.


  Then the design: three treatments.

  A. Standard: known 50/50 urn vs. ambiguous urn with unknown composition, side by
  side, one-shot.

  B. Shifted: known 50/50 urn vs. ambiguous urn known to contain at least 60 red (composition
  otherwise unknown).

  C. Separated: same pair as A, but each bet elicited in isolation, with no mention
  of the other, plus a filler task in between; and a mirror condition where the "known"
  urn''s composition is stated in a form the subject is told to distrust (e.g., the
  composition is known but the drawing procedure is opaque / the subject is told the
