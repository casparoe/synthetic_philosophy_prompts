  - Reduction and emergence in science: analogies abound — "the whole is more than
  the sum of its parts", "water is wet though H and O aren''t", "the brain is a computer",
  "temperature is just molecular motion", "the market is an ecosystem", "software/hardware
  levels". A common analogy in reduction/emergence: the "levels of description" /
  "the map layers" — or the classic: "a clock is nothing but its gears" / "a computer
  is nothing but transistors". Another: "life is like a machine"? A popular analogy
  used by emergentists: "the whole is greater than the sum of its parts" — but that''s
  a slogan (type 3). The analogy in common use: "reduction is like translating one
  language into another" or "emergence is like temperature from molecular motion"
  — but that one is an actual successful case. A good one: the analogy used in popular
  science: "emergence is like a traffic jam — no single car intends it" (used to argue
  higher-level explanations are autonomous and downward causation is real). Or: "the
  brain is like a computer — the mind is to the brain as software is to hardware"
  (used to license claims that psychology is autonomous from neuroscience, or that
  mind is multiply realizable). Hmm, that''s a very common analogy and might be "seen
  a million times".


  - Strange loops and Hofstadter''s I: analogy in common use? Hofstadter himself uses
  analogies: the self as a "strange loop", the "self symbol" as a "knot in a tangled
  hierarchy", "the self is like a vortex in a river", "the ''I'' is like a software
  entity that can be copied/uploaded". Also: "the self is like a story/narrative".
  A common analogy in these debates: the self as "a pattern in a flame" or "a vortex".
  Also in the debate about uploading: the self is like software — copy it and it persists.
  Hmm.


