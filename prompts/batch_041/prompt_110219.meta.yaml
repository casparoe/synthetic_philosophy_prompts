  and the protocol seems to straddle them. It waits for the heart to stop, as though
  circulatory death were the operative criterion. But it then restarts the heart,
  which suggests either that the donor was not dead by that criterion after all, or
  that death had already occurred by some other criterion and the beating heart is
  merely an organ being perfused. Meanwhile it excludes the brain, as though the neurological
  criterion were the real one — but it does not wait for the brain to be destroyed,
  only for circulation to stop and stay stopped for a few minutes.


