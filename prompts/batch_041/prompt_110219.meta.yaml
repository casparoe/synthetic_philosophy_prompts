  organs are then recovered in better condition than they would be after warm ischemia.


  What philosophical commitments does this practice presuppose about the nature of
  death, and about the relation between a living organism and a collection of living
  organs? The law in most jurisdictions recognizes death either by irreversible cessation
  of circulatory and respiratory function or by irreversible cessation of all functions
