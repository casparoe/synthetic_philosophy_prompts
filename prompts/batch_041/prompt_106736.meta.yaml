  Student answer:


  "Benacerraf''s dilemma comes from his 1973 paper ''Mathematical Truth.'' The setup
  is that a satisfactory account of mathematics has to do two things at once. It has
  to give a semantics on which mathematical sentences mean what they seem to mean
  — ''there are infinitely many primes'' has to be a genuine statement about a subject
  matter, true or false in the ordinary Tarskian way, not a disguised rule or a fiction.
  And it has to give an epistemology on which we can actually know those sentences.
  The tension is that the most natural semantics makes mathematical sentences refer
  to abstract objects — numbers — that exist independently of us, while the most natural
  epistemology of reference is causal: you know about a thing because it causally
  impinges on you, the way the rocks in my garden send light into my eyes. Abstract
  objects are outside space and time and stand in no causal relations, so under a
  causal theory of knowledge we could never be in epistemic contact with them. So
  we face a choice: keep the standard semantics and lose the epistemology, or keep
  a causal epistemology and saddle mathematics with a non-standard semantics on which
  its sentences don''t really state truths about objects at all, which seems to sell
  out what mathematicians take themselves to be doing. That''s the dilemma — the semantic
