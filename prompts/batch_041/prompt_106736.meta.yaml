  "Benacerraf''s dilemma, from his 1973 paper ''Mathematical Truth,'' is a problem
  for any view that wants to say both that (1) mathematical statements are true or
  false in the ordinary sense — ''there are infinitely many primes'' says something
  about a subject matter — and (2) we can know mathematical truths. The tension is
  that the natural semantics for mathematics is platonist: for ''there are infinitely
  many primes'' to be true in the same way that ''there are rocks in my garden'' is
  true, it has to be about objects that exist independently of us, namely numbers.
  But our best account of how we know anything about a subject matter is causal: you
  know about the rocks because light from them hits your eyes. Numbers, being abstract
  and outside space and time, can''t enter into causal relations with us, so this
  account makes mathematical knowledge impossible. That''s the epistemological horn.


  So we''re stuck: either we keep the standard semantics and lose the epistemology,
  or we keep a causal epistemology and have to give mathematics a non-standard semantics
  where mathematical sentences don''t really state truths about objects, which seems
  to undercut what mathematicians take themselves to be doing.


  Benacerraf thought the way out was structuralism. His earlier argument — the one
  about the two ways of reducing the natural numbers to sets, Zermelo''s and von Neumann''s,
  both of which satisfy the Peano axioms but pick out different sets — shows that
  numbers can''t be any particular objects. From this he concludes that arithmetic
  isn''t about any particular objects but about the structure that all the reductions
  share. And that''s supposed to help with the dilemma, because if mathematical statements
  are really about structure rather than about a realm of abstract objects, then the
  causal theory of knowledge doesn''t apply to them in the first place; we don''t
  need a causal story for knowledge of structures, since structures are given by the
  axioms and are known by deduction.


  One objection is that this only relocates the problem, since structures themselves
  are abstract objects, so if you need a causal story to know about abstract objects
  you need one for structures too. But I think the structuralist can reply that knowledge
  of a structure just is knowledge of the relations the axioms specify, and that''s
  not the kind of thing that needs a causal channel."


