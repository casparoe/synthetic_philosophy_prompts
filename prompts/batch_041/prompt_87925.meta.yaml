  I am a doctoral student in moral philosophy, and for the past few weeks I have been
  circling a cluster of ordinary practices that seem to me philosophically loaded,
  and that nobody I know discusses together. In most common-law jurisdictions there
  is no general duty to rescue a stranger in peril: a competent adult who walks past
  a shallow pond in which a child is drowning commits no legal wrong and owes nothing
  to anyone. Yet those same jurisdictions have passed statutes shielding the rescuer
  who does intervene from liability, several civil-law countries make the failure
  to render easy aid a criminal offence, and the law does impose duties of rescue
  on parents, on those who created the peril, and on those who have taken a patient
  or a dependent into their care. In parallel, nearly every hierarchical institution
  -- armies, police and fire services, hospitals, and increasingly universities and
  firms -- honours members whose conduct is publicly described as exceeding what the
  institution demands, while the institution''s own rules oblige those members to
  accept extraordinary risk, and many professional ethics codes are formally divided
  into an aspirational part that no one can be sanctioned for failing and an enforceable
  part that can end a career. I want a careful reconstruction of what this cluster
