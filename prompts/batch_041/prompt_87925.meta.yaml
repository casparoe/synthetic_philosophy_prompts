  ---


  I am a doctoral student in moral philosophy, and I have spent the last few weeks
  trying to get clear on a cluster of practices that strike me as philosophically
  loaded but rarely examined together. In most common-law jurisdictions there is no
  general duty to rescue a stranger in peril: a competent adult who walks past a shallow
  pond where a child is drowning commits no legal wrong, and is not liable for anything.
  Yet those same jurisdictions have enacted statutes that shield would-be rescuers
  from liability, and in several civil-law countries the failure to render easy aid
  is itself a criminal offence. In parallel, nearly every hierarchical institution
  — armies, police and fire services, hospitals, and increasingly universities and
  firms — publicly honours members whose conduct is described as going beyond what
  the institution requires, while the same institutions'' own rules oblige members
  to accept extraordinary risk, and the law of tort and contract occasionally converts
  what looks like a favour into a duty (parents to children, employers to employees,
  doctors to patients who have been taken into care). I want a careful philosophical
  reconstruction of what these practices presuppose, rather than a survey of what
  philosophers have said about them.


  Please act as an expert in normative ethics and the philosophy of law, and begin
  by brainstorming the candidate presuppositions before you commit to any of them,
  so that the final reconstruction is argued rather than asserted. The central question
  is this: what must be true of the moral landscape for these practices to make sense
  as they stand? Do they presuppose that there is a genuine category of the morally
  good but not required — that the deontic question of what one must do and the evaluative
  question of what is admirable can come apart — or could the whole cluster be explained,
  without loss, by a theory that recognises only one dimension (a maximising consequentialism,
  say, on which the ''hero'' simply does less badly than the rest of us, and the honours
  system is a mere incentive device)? If the practices do presuppose a two-dimensional
  picture, what exactly does that picture commit us to, and does the practice need
  the strong version or only the weak one? I am especially interested in two further
  puzzles. First, if the boundary between the required and the supererogatory is fixed
  by the cost or risk to the agent, then the very same act — one soldier smothering
  a grenade, one bystander smothering a grenade — seems to be required in one case
  and supererogatory in the other, which suggests that the category is relative to
  role or relationship rather than to the act; is that coherent, and which of the
  practices would have to change if it were not? Second, these practices seem to treat
  praise and blame asymmetrically: we decorate the rescuer and we do not blame the
  passer-by, though both responded to the same situation. Does that presuppose that
  the standards of praise and of blame are different, or merely that we have pragmatic
  reasons for a forgiving blaming practice?


  Finally, tell me where the practices are philosophically underdetermined — where
  several incompatible theories would license the same statutes, medals and codes
  — and what would actually have to change if we replaced the presupposed picture
  with its chief rival. Assume I have no access to a library or the internet, so reason
  from the descriptions I have given rather than reaching for the literature; do not
  give me citations or a reading list, and do not tell me what any particular philosopher
  is supposed to have argued, since I will supply the references myself.


