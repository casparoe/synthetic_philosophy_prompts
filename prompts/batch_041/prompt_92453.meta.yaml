  material: either we take the figure and the assistant takes nothing but a description,
  or he takes the figure and we take nothing. The executor has asked the committee
  to state its position in writing, and has set a date of [month] for us to do so,
  after which he will distribute the estate.


  There is a complication of our own making. Our acquisitions policy contains a clause
  drafted two years ago, when we were accessioning a work with a detachable plinth,
  which the committee has never had occasion to interpret: "Where a single portion
  of matter simultaneously constitutes more than one object, the museum shall treat
  the object whose persistence conditions are those of the material as the object
  of record." The object of record is what we enter in the accession register, insure,
  and lend. I have a sinking feeling that this clause, read as written, decides the
  present case against us, and I would rather know that now than in the meeting.


  Please draft the opinion. It should (i) recommend a concrete course of action --
  accept, decline, accept on conditions, or propose a specific division or settlement
  -- with a deadline; (ii) say how many objects there are and defend the count; (iii)
  say whether the clause above settles the matter, misfires, or needs reading down,
  and give replacement wording if you think it should be amended; and (iv) state the
  strongest case for the position you reject and answer it rather than dismissing
  it. Please also address two things the assistant''s lawyer and our own conservator
  will raise at the meeting: whether it matters that the figure would survive being
  broken up and reworked while the sculpture would not, and whether the figure''s
  cracked foot, which the conservator wants to fill with a reversible consolidant,
  means we would be accessioning a different object than the one the will names. Counsel
  tells me a court could go either way and that the will''s language is not decisive;
  the committee needs its own reasoning, not a prediction about how a court would
  rule.


