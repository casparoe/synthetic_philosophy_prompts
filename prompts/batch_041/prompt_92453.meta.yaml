  clay figure in the north studio, together with the whole of the material of which
  it is composed," to the sculptor''s longtime studio assistant. Clause 5 leaves "the
  sculpture described in the catalogue raisonné as *Figure with Two Shadows*, in whatever
  state of completion," to us. The catalogue raisonné describes one and the same thing:
  the unglazed clay figure in the north studio. The assistant''s lawyer has written
