  I am rebuilding the first term of a one-year access-to-engineering course at a British
  further-education college. My students are adults returning to study after long
  absences; most of them arrive convinced that mathematics is a thing other people
  are good at. The awarding body fixes the syllabus and the assessment dates, the
  scheme of work is rewritten once a year and signed off by a head of department who
  has a fortnight and a funding target, and the students'' progression to a degree
  depends on the outcome. So the decisions are frequent, consequential, and made under
  a clock.


  I have been reading Whitehead''s essays on education, and his diagnosis lands on
  my students with uncomfortable precision: they were taught knowledge that was never
  put to any use, made to acquire technique before they had any sense of what it was
  for, and asked to be exact about things no one had ever made interesting to them.
  His prescriptions, though, are pitched at institutions with years in hand and freedom
  to design their own syllabus. I have neither. I read a lot of the rationalist blogosphere,
  and what I want is a decision procedure rather than an essay: something I can run
  module by module, and which is honest about where it stops being a procedure and
  becomes a value judgment. I would rather it announce "this question is not mine
  to settle" than quietly smuggle in an answer.


  Take seriously these claims of his, paraphrased: that learning has a rhythm, moving
  from an initial vivid and unanalysed apprehension of a subject, through a stage
  of systematic acquisition and exactness, to a stage of return, application and fruition;
  that the same rhythm recurs at every scale, so that a term, a week and a single
  lesson can each have their own; that freedom and discipline alternate, freedom belonging
  to the beginning and the end, discipline to the middle; that knowledge merely received,
  never used, tested or combined with anything else, is not neutral but actively harmful;
  that one should teach fewer things thoroughly rather than many superficially; and
  that entering the exacting stage too early, before there is any vivid experience
  to be exact about, is the characteristic failure of schooling. Also, and I think
  this matters for you: he assumes his stages describe the growth of a mind, and I
  am not sure I believe that. I want to know what the procedure looks like if I keep
  the rhythm purely as a design heuristic and drop the developmental claim, and which
  of his distinctions I would then be quietly abandoning.


  Please give me: the procedure itself, as a sequence of questions I ask in order,
  with what counts as a sufficient answer to each, the points where it terminates
  in a no, and the points where it hands the decision to a person; then a one-page
  version I could put in front of the head of department; then run it on three cases.
  (a) A compulsory module on trigonometry and vectors that the awarding body examines
  in week nine, for which my students have no romance to draw on and no time to build
  any. (b) An optional "engineering in the world" strand — site visits, a build project,
  some reading — which I think is the only place romance could actually start, and
  which the head of department regards as a luxury. (c) A cohort that is not uniform:
  a former mechanic who is already past romance in some topics and a care leaver who
  is not yet in it in any. I expect (b) to go against me; if it does, say so plainly
  rather than softening it. Tell me what the procedure cannot do, where it will misfire,
  and which of the three cases would best tell whether it is any good.


  Please write your answer in American English.


