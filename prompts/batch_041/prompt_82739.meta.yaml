  Key dependency structure for teaching the combination problem:

  1. First you need: what panpsychism claims (experience is fundamental and ubiquitous)
  — and crucially what it does NOT claim (that rocks think, that everything has a
  mind like ours). Need the distinction between "experience" as a fundamental property
  and "consciousness" in the access/report sense. Because students'' first misconception:
  "panpsychism says my chair is conscious and has opinions."

  2. Then: why anyone would be a panpsychist at all — the hard problem / the "no brute
  emergence" intuition. Without this, the combination problem is unmotivated (students
  will just think "so what, who cares if tiny experiences combine?"). So the *motivation*
  must come before the problem, or the problem seems like an internal quibble.

  3. Then: the idea that panpsychism is a claim about *subjects*, not just about *qualities*.
  Distinguish "there is something it is like for the micro-entity" from "there are
  micro-qualities". This sets up subject-summing vs quality combination.

  4. Then: the combination problem itself, in two halves: subject-summing (why would
  two subjects make one subject? subjects aren''t additive) and quality combination
  (the palette problem: qualities don''t blend into new qualities the way colors blend...
  actually they do blend in the case of color, so careful — the palette problem is
  about the *specificity* problem: how do micro-qualities yield the specific macro-quality,
  and about the fact that there''s no principled mapping; also the "grain" problem).


