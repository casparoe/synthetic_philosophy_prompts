  \ written. I would like you to mark it and to give me the itemised comments that\
  \ justify the mark, since I have to return the marks and the written feedback together\
  \ this week and the candidate is near a grade boundary.\n\nThe question\n\n(a) Set\
  \ out Devlin's case for the legal enforcement of morality and Hart's principal objections\
  \ to it. (10 marks)\n\n(b) The Republic of Valdoria has enacted the Reverie Prohibition\
  \ Act. A reverie is a small neurostimulation device that places its user in an immersive\
  \ and intensely pleasurable dream-state for as long as the user wishes. Its use\
  \ is private and consensual; users are competent and informed, they are physiologically\
  \ stable, they can leave the reverie whenever they choose, and there is no evidence\
  \ of harm to users or to anyone else and no evidence of dependency. The Act criminalises\
  \ the manufacture, sale and use of reveries. Its preamble offers two justifications.\
  \ The first is that a life spent in induced reverie is a debased form of existence,\
  \ unworthy of a rational agent, and that the law ought not to lend its authority\
  \ to the promotion of such a life. The second is that if the use of reveries became\
  \ widespread, the shared valuation of effort, achievement and mutual obligation\
  \ on which Valdorian civic life depends would dissolve. Taking the two justifications\
  \ separately, assess whether either of them can support criminal prohibition, using\
  \ the Hart–Devlin debate as your framework. (10 marks)\n\nClarity of exposition\
  \ and argument carries the remaining 5 marks.\n\nThe candidate's answer\n\n(a) Devlin's\
  \ argument begins from a conception of society as a community of shared ideas, moral\
  \ as well as political. A shared morality is part of what holds a society together,\
  \ and a sufficient erosion of it puts the society itself at risk of dissolution.\
  \ Since the state has an interest in the survival of the society it governs, it\
  \ has a prima facie right to legislate against conduct that offends the shared morality,\
  \ even where that conduct harms nobody; the right is only prima facie, because Devlin\
  \ also holds that the law must leave the greatest possible room for individual freedom\
  \ that is consistent with the integrity of society, and that tolerance is among\
  \ the factors that limit the use of the criminal law. On his account, the standard\
  \ is not the legislator's private morality but the morality of the ordinary, right-minded\
  \ person, and the law should not attempt to enforce every immorality.\n\nHart's\
  \ objections are three. First, the disintegration thesis is an empirical claim for\
  \ which Devlin offers no evidence; the examples he gives show that moralities change,\
  \ not that societies collapse when they do, and moral change is not the same thing\
  \ as moral decay. Second, Devlin moves from the fact that a morality is shared to\
  \ the conclusion that it ought to be enforced. Hart's distinction between positive\
  \ morality — the morality that is actually accepted in a society — and critical\
  \ morality — the morality that can be defended by reasons — is intended to block\
  \ that move: only the latter can justify coercion, and widespread disapproval is\
  \ not in itself a reason. Third, Devlin's principle has no stopping point: taken\
  \ literally, it would license the enforcement of any shared morality, however benighted,\
  \ and Hart's comparison with the treatment of subversion is meant to bring out how\
  \ far it reaches.\n\n(b) The first justification in the preamble is paternalistic.\
  \ The state proposes to protect users from a form of life that is bad for them,\
  \ and it proposes to do so against their wishes, since the users are stipulated\
  \ to be competent, informed, content and free to leave. On Hart's harm principle,\
  \ the only legitimate ground for coercion is the prevention of harm to others, and\
  \ this rationale does not even purport to identify any such harm. The first justification\
  \ therefore cannot support the Act.\n\nThe second justification is a different matter,\
  \ and Hart's framework is of limited use here. It does allege a harm, but a collective\
  \ one, the dissolution of a shared culture. The harm principle is framed in terms\
  \ of harm to other persons, and it is not clear that a culture or a society is the\
  \ kind of thing that can be harmed in the relevant sense, or that its dissolution\
  \ is a harm to anyone in particular. If the second justification is to be assessed\
  \ at all, it must be assessed as an empirical prediction about what would happen\
  \ to Valdorian society if the use of reveries spread, and as such it stands or falls\
  \ with the evidence; Devlin's tolerance limit would be the natural standard, since\
  \ the question would become how much moral divergence a society can absorb before\
  \ it is at risk.\n\nThe Act is therefore not justified, though for different reasons\
  \ in the two cases: the first rationale is defeated by the harm principle, and the\
  \ second rests on a prediction that no one has tried to substantiate.\n\nWhat I\
  \ need\n\nMark the answer out of 25 and give me the comments that justify the mark.\
  \ I want the comments to be specific enough that I can paste them into the feedback\
