  I am a teaching assistant on a second-year undergraduate course in philosophy of\
  \ law. The final examination included the following question, worth 25 marks; the\
  \ students had read Devlin's Maccabaean Lecture on the enforcement of morals and\
  \ Hart's Law, Liberty and Morality (1963), together with the Wolfenden Report that\
