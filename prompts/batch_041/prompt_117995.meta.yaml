  I chair the grants committee of a small international foundation that funds adolescent
  health programs in about a dozen countries. Three years ago, after a bruising fight
  over an earlier grant, our board adopted a Local Standards Provision: a program
  may be renewed only if the partner can show that its design is validated by the
  standards of the community it serves. The Provision is silent on what to do when
  the community does not speak with one voice, and that silence is now in front of
  us.


