  The draft:


  **Comparison Without a Common Currency**


  The literature on interpersonal utility comparison usually begins by asking what
  kind of measurement utility admits — ordinal or cardinal, and if cardinal, whether
  the unit and the zero point can be compared across persons. I argue that this measurement
  framing, whatever its use for social choice, obscures the deeper question. What
  matters is not whether two people''s utilities share a unit but whether there are
  reasons that count in favor of one allocation over another when the people affected
  are different people. Call this the reasons-first view.


  On the reasons-first view, comparison is not a matter of reading off a common numerical
  scale. It is a matter of determining whether the considerations favoring one person''s
  gain and the considerations favoring another''s can be weighed against each other
  at all, and if so by what standard. Two people''s situations can be compared even
  when their preferences are not commensurable in any single currency, provided the
  reasons on each side fall under a common standard of assessment. I call this the
  parity constraint: comparison is possible whenever there is a standard under which
  the reasons on both sides are assessable, even if that standard assigns no numerical
  magnitudes.


  This dissolves a familiar worry. If utility is only ordinally measurable, we are
  told, interpersonal comparison is impossible. But that inference assumes comparison
  requires a common cardinal unit. The parity constraint requires only a common standard
  of assessment, which may be ordinal or even non-numerical. The measurement problem
  is therefore a red herring; the real work is done by the reasons.


  The view also accommodates the intuitive cases. We can say that a small gain for
  a badly off person may outweigh a large gain for a well off person — not because
  we have measured their utilities on a common scale, but because the reasons of priority
  and sufficiency are assessable under a common standard.


  I close by suggesting that the standard taxonomy of comparability assumptions, which
  distinguishes level from unit comparability and ordinal from cardinal measurement,
  is less fundamental than it appears.


