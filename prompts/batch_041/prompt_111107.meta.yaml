  **Title: Comparison Without a Currency**


  Most treatments of interpersonal utility comparison begin by asking what kind of
  scale utility admits: ordinal or cardinal, and if cardinal, whether the unit and
  the zero point are comparable across persons. I want to argue that this framing,
  while useful for social choice, obscures the deeper issue. The question that matters
  is not whether two people''s utilities share a unit, but whether there are reasons
  that count in favor of one allocation over another when the two people are different
  people. Call this the reasons-first view.


  On the reasons-first view, interpersonal comparison is not a matter of reading off
  a common numerical scale. It is a matter of determining whether the considerations
  favoring A''s gain and the considerations favoring B''s gain can be weighed against
  each other at all — and if so, by what standard. Two people can be compared even
  when their preferences are not commensurable in any single currency, provided that
  the reasons on each side can be brought under a common evaluative standard. I call
  this the parity constraint: comparison is possible whenever there exists a standard
  under which the reasons on both sides are assessable, even if that standard does
  not assign numerical magnitudes.


  This dissolves a familiar worry. If utility is only ordinally measurable, we are
  told, interpersonal comparisons are impossible. But that inference assumes that
  comparison requires a common cardinal unit. The parity constraint requires only
  a common standard of assessment, which may be ordinal or even non-numerical. The
  upshot is that the measurement problem is a red herring; the real work is done by
  the reasons.


  I then show that this view accommodates the intuitive cases: we can say that a small
  gain for a badly off person may outweigh a large gain for a well off person, not
  because we have measured their utilities on a common scale, but because the reasons
  of priority and sufficiency are assessable under a common standard.


  I close by suggesting that this reframing makes the standard taxonomy of comparability
  assumptions less fundamental than it appears.


