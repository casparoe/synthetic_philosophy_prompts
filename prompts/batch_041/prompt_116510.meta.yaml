  Self-sampling assumption (SSA): one should reason as if one were randomly selected
  from all observers in one''s reference class. Self-indication assumption (SIA):
  given that you exist, you should favor hypotheses with more observers (a.k.a. "the
  fact that you exist is evidence for hypotheses on which many observers exist").
  Presumptuous philosopher: Bostrom''s thought experiment where a philosopher is offered
  a choice: hypothesis A (world with 2^... hmm). Let me recall: The Presumptuous Philosopher:
  Suppose you are a philosopher in a world with two competing cosmological theories:
  T1 (the standard model) and T2 (a much bigger universe with vastly more observers).
  Under SIA, since T2 contains vastly more observers, the fact that you exist... you
  should be virtually certain that T2 is true, and thus treat the physicist''s empirical
  evidence as irrelevant — the "presumptuous philosopher" who thinks his mere existence
  refutes the simpler cosmology. Yes, that''s Bostrom''s argument against SIA. Correct.


