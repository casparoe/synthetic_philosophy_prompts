  panel''s rule that all three matter, so a clean acquisition doesn''t settle the
  matter, and a late claim isn''t automatically weak. Hmm, that''s a nice operational
  injection.

  3. The "treadmill" problem: precedents — the procedure must say how a decision in
  one case constrains later cases and where precedent should be explicitly refused.

  4. The "recipient problem": the claimant may be a state, a community, a royal house,
  a diaspora body, or an individual; the procedure must have a rule for choosing among
  competing claimants, including the case where the state and the source community
  disagree. This is the "answer you won''t like" case.

