  In the world-history survey I help teach, a senior colleague defends keeping the
  course centered on Europe with an analogy to maps. Every flat map, he says, must
  be drawn in some projection. The Mercator, devised so that a navigator''s constant
  compass bearing comes out as a straight line, inflates the higher latitudes until
  the far north looks far bigger than it is; an equal-area projection preserves the
  proportions of landmasses but ruins their shapes; and no projection does everything
  well at once. A globe comes closer to the truth, but a globe cannot be folded into
  a book or laid alongside a page of text. From this he draws a conclusion he states
  almost every term: the demand for a history told from everywhere at once is as confused
  as the demand for a map with no projection; every history has a center as every
  map has a projection; the choice of center is a trade-off among purposes rather
  than a matter of accuracy; and the honest course is to declare your projection and
  proceed, rather than apologize for a European frame or chase an impossible neutral
  one. I have never been able to say exactly where this argument fails, and I suspect
  it succeeds at something small and fails at something large. I would like the audit.


