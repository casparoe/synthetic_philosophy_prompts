  we declare death by circulatory criteria and begin retrieval. Under the proposed
  protocol, the retrieval team then opens the chest, clamps the vessels that would
  carry blood to the head, cannulates the aorta and inferior vena cava, and starts
  a circuit that reoxygenates and reperfuses the abdominal organs, and in some versions
  the heart itself, so that the organs are not damaged by the additional warm ischemia
  of a conventional recovery. The objection I keep hearing, from one of our transplant
  surgeons and from a colleague on the regional network''s ethics group, is that the
  clamping is the tell: we take an affirmative step to guarantee that circulation
  does not return to the brain, which shows that we do not in fact believe circulation
  has irreversibly ceased. The reply is that we have never required irreversibility
  in any physiological sense — a heart that could be restarted with compressions and
