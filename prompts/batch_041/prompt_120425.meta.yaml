  Dutch book''s essential structure: (a) each individual bet is acceptable/fair given
  the agent''s credences; (b) the collection is guaranteed to lose money; (c) hence
  the credences are incoherent. Also the classic illustration: a set of three bets
  on P, ~P, and a compound (e.g., P∨Q) priced by the agent''s credences such that
  sum of payoffs < 0 regardless. The canonical simple example: agent''s credences
  violate additivity: p(P)=0.6, p(~P)=0.6; sell her a $1 bet on each (she pays 0.6
  each = 1.2, gets exactly 1 back) — she loses 0.2 for sure.


  Form: a pantoum is a Malay/ French form: 4-line stanzas, lines 2 and 4 of each stanza
  become lines 1 and 3 of the next; final stanza uses lines 1 and 3 of the first stanza
  as its 2nd and 4th lines, so the poem closes the loop (ends with the same line it
  began with). That closure = the book closing = the sure loss returning to the start.
  Also the recurrence of lines with changed meaning = the same bet reappearing as
  part of a larger book. That''s a genuinely apt mapping, and it''s the kind of thing
  a specialist would appreciate.


