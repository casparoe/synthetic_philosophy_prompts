  Keynes''s Treatise on Probability gives:

  - Probability is a logical relation between a proposition and the evidence for it;
  so "the probability of X" is incomplete — must be relativized to evidence. Different
  evidence → different probability, not two estimates of the same thing.

  - Probability is not always numerically measurable; some pairs are comparable (greater/less),
