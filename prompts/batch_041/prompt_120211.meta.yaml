  are not).

  - Weight of evidence: the amount of relevant evidence, distinct from the probability;
  a probability of 1/2 based on almost nothing has low weight. Keynes: "the ''weight''
  of the argument" — argument from analogy, etc.

  - The Principle of Indifference is valid only under the "principle of non-sufficient
  reason" conditions and when the alternatives are "indivisible" and exhaustive; Keynes''s
  critique and his notion of "groups" of equiprobable alternatives.

  - Statistical induction requires the "Principle of Limited Independent Variety"
  — the assumption that the universe has finite complexity, so generalization from
  a sample is licensed; without it, induction from experience to new cases is not
  valid.

  - The assumption of "homogeneity" / "the uniformity of nature."

  - Against frequency theories: probability is not a limit of relative frequency in
