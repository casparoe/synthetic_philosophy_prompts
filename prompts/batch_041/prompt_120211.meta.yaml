  Tests in order:

  1. State the proposition and the evidence base (Keynes''s relativity to evidence).
  If the two teams'' entries have different evidence bases, their numbers aren''t
  estimates of one quantity — do not average.

  2. Is the evidence sufficient for a determinate probability? Check whether the event
  class is one with a stable generating set / whether instances are homogeneous; whether
  the sample is drawn from a known population.

  3. If a number can be assigned: is it comparable with the other risks in the register
  (ordinal comparability)? Or incomparable?

  4. Weight test: how much relevant evidence? Low weight → the number is fragile;
  the right response is diversification, liquidity, staged commitments, or buying
  information — not a bigger number.

  5. If no number: what do you do — scenario analysis, break-even, robustness across
  scenarios, and a written statement of what would change the judgment.

  6. Where judgment can''t be eliminated: the threshold at which weight is "enough";
  whether the analogy is close enough; the choice of convention.


