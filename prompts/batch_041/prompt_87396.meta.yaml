  ---


  I''m a second-year PhD student in a language acquisition lab, and my supervisor
  has voluntold me to write up the joint statement from a two-day workshop we ran
  last month on innateness and the poverty of the stimulus. It was meant to be an
  adverserial collaboration between the two camps that have been talking past each
  other for decades: the nativist side (domain-specific representational constraints
  on the learner''s hypothesis space, the child as a learner whose prior does most
  of the work) and the empiricist / usage-based side (a domain-general learner with
  powerful distributional and Bayesian machinery, working over an input far richer
  than the nativists will concede). What I need from you is the document those two
  camps could actually both put their names to. It has to be non-vacuous — both sides
  agreeing that children acquire language is exactly the sort of filler that made
  the workshop useless. And please don''t adjudicate: I''m not asking who''s right,
  I''m asking for the text they''d both sign with the residual disagreement made exact.


  So: a set of agreed claims that are load-bearing rather than decorative (what the
  phenomenon to be explained actually is, what the induction problem is and isn''t,
  what would count as evidence for either side, what''s a red herring, and a disambiguation
  of the word innate — domain-specific versus domain-general bias, representational
  versus architectural, present at birth versus maturationally scheduled, because
  half the shouting seemed to be that word doing four jobs at once). Then the disagreements,
  each phrased so the side that holds it would accept the wording as fair — no strawmen,
  no weasel. Then the cruxes: the sub-questions such that settling one would actually
  move at least one side. I suspect one is whether a domain-general learner with realistic
  priors could in principle get there from the input alone, and another is whether
  the error and recovery patterns in children carry the signature of a constrained
  hypothesis space at all — but tell me if I''ve missed the real ones. For each crux
  I want the case, argument or experiment both sides would accept as bearing on it,
  and each side''s prediction written down in advance.


  Two things to build in. First, a labmate keeps waving around a corpus figure for
  how much of child-directed speech is disfluent or outright ungrammatical, and I''ve
  noticed both camps quote the same number as though it settled their case, which
