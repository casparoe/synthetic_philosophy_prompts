  "In the United States, the federal drinking-water program regulates a contaminant
  in two steps, and I''ve come to think the two steps presuppose different things
  about vagueness. First the agency fixes a health-based goal: the concentration below
  which no adverse health effect is anticipated, with a margin of safety. That goal
  is expressly non-enforceable, and it is set without regard to whether the substance
  can be detected at that level or removed by any available treatment; for microbial
  contaminants it is set at zero. Then the agency sets the enforceable standard, which
  is supposed to be as close to the health-based goal as is feasible, where feasibility
  is a matter of detection limits, treatment technology, and cost. Sometimes, instead
  of a number, it mandates a treatment process. Sometimes it fixes a number that is
  not a violation limit at all but an ''action level'' that triggers monitoring and
  corrosion-control duties. The enforceable number has moved over the decades as instruments
  and treatment improved, while the health-based goal stayed where it was.


  Everything downstream is a cliff. A measurement one increment above the standard
  triggers reporting, mandatory treatment, and, for a water system, legally binding
  obligations; a measurement one increment below triggers nothing. The same program
  concedes in its own monitoring rules that measurements carry error bars wide enough
  that the two readings may be the same quantity of water. And the courts will not
  second-guess the agency''s choice of number: 9 rather than 10 is treated as a technical
  judgment within the agency''s discretion, not as a claim to be assessed for truth.


  Meanwhile the same legal system treats vagueness as a defect elsewhere: criminal
  statutes that fail to give fair notice and invite arbitrary enforcement are struck
  down. And in yet other areas -- reasonable care, the best interests of the child
  -- the law deliberately refuses to stipulate a line and decides case by case.


