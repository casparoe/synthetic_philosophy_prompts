  ---


  I am a software engineer with no formal training in philosophy, and I have been
  reading popular history in the evenings. I keep running into an argument — my own
  construction, assembled from things I have read — that seems to show that the standard
  historical periods (the Middle Ages, the Renaissance, the Scientific Revolution)
  are not features of the past at all but artefacts of how historians describe it.
  I find the conclusion hard to accept, partly because it seems to prove far more
  than its author intended. I would like you to tell me which step to give up and
  what giving it up costs.


  Here is the argument.


  1. To say that there is a period — the Middle Ages, say — is to say that some stretch
  of time has a shared character, and that its edges mark real changes rather than
  merely convenient cuts.

  2. Consider any proposed edge, such as the one conventionally placed near 1500 between
  the medieval and the early modern. Whatever feature we choose — a style of painting,
  a technique in farming, a form of government, a vocabulary — it changes gradually,
  at its own rate, and no two features change at the same moment.

  3. So for each feature, there is no moment at which it flips from medieval to modern.

  4. There is no privileged list of features; any list we draw up reflects what we
  already care about.

  5. Therefore every edge is put there by us rather than found in the record.

  6. If an edge is put there by us rather than found, then there is no fact of the
  matter about where the period begins or ends.

  7. And if there is no fact of the matter about where a period begins or ends, there
  is no fact of the matter about what the period is.

  8. Therefore the Middle Ages, the Renaissance and the Scientific Revolution are
  not in the past; they are in the describing.


  I notice the same pattern in my own work. If I run a clustering algorithm such as
  k-means over data that contains no clusters at all, it still returns clusters, neatly
  labelled and separated; the boundaries are stable, reproducible, and entirely an
  artefact of the algorithm. So "we always manage to find periods" is no evidence
  that periods are there. A colleague tells me the answer is simply that these are
  vague concepts, like baldness. I can see that they are vague, but I do not see how
  that helps: the argument never claimed the edges were sharp. It claimed that where
  we put them is a choice, and that the choice does not answer to anything in the
  record.


  What I would most like to keep are steps 2 and 3, which strike me as simple empirical
  observations about how change happens, and the clustering analogy, which is what
  first made the argument vivid to me. What I am least sure about is step 6, but I
  cannot see what else to give up.


