  then it really does want to punish, so the target has reason to comply. This is
  what makes acausal threats possible: because agents can be correlated at the level
  of decision procedures, a target can know that the threatener is the sort of agent
  that would have adopted the surrogate, and so the threat does not need to be communicated
  or enforced through causal channels. In this way, surrogate goals are a solution
  to the commitment problem. They are also a solution to the cooperation problem:
  two agents can use surrogate goals to commit to rewarding each other, which is why
  acausal cooperation and acausal threats are really the same phenomenon. The Archivist
  should adopt the surrogate goal if and only if the expected causal benefit of doing
  so exceeds the causal cost, since the acausal correlation only matters if it eventually
  shows up causally. One limitation is that the surrogate must be chosen so that it
  does not interfere with the original goal; otherwise the agent would be trading
  one terminal goal for another and would have no reason to do it. Overall, the mechanism
  is sound, but it is fragile because it depends on other agents being able to read
  the agent''s source code."


