  Here''s the practice I''m puzzled by. In a lot of jurisdictions and hospital ethics
  protocols, a person can write an advance directive while competent -- say, ''if
  I get advanced dementia and don''t recognize my family, don''t give me antibiotics
  for pneumonia; I want to be allowed to die of it.'' Later, when she''s demented,
  cheerful, and asking for the antibiotics, the team is supposed to follow the earlier
  directive and withhold them, even over her current protests. But the same hospital
  will let a currently competent patient refuse treatment that an earlier directive
  told them to accept. So the earlier self wins when the later self is demented, but
  the current self wins when the current self is competent. And there''s a further
  wrinkle: the directive is treated as authoritative even though the earlier self
  never knew what it would be like to be the later self, and the later self may not
  even be able to understand the earlier self''s reasons.


  What view of personal identity, autonomy, and the authority of the earlier self
