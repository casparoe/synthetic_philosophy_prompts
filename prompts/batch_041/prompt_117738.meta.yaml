  I''m giving a paper at a two-day workshop on long-run global risk, hosted by a policy
  school, and I need a question-and-answer prep sheet rather than a defense.


  The paper''s thesis: forecasts of state collapse and imperial decline should be
  made predominantly from the outside view. Take a reference class of historical polities,
  estimate a survival curve for the class, and read off the conditional probability
  that a polity resembling ours loses its monopoly on organized violence over a given
  horizon. The inside view — the particular story about elite overproduction, fiscal
  exhaustion, legitimacy deficits, and peer rivals — should enter only as an adjustment
  to that baseline, and only when I can state in advance the direction and rough size
  of the adjustment.


  Two refinements are, I expect, where the attacks will come. First, I argue the outside
  view should be applied to the hazard rather than to the total lifespan: the question
  is not when a polity falls but how the risk of falling varies with age, and I claim
  the historical record is better described by a hazard that rises for a long stretch
  and then plateaus than by the flat hazard that most quantitative work on political
  survival tacitly assumes. Second, I claim the principal error the outside view corrects
  is not optimism about the central estimate but underestimation of the spread: expert
  interval forecasts for the timing of collapse are far too narrow, and the outside
  view''s main contribution is to widen intervals rather than to shift the mean. My
  method is the familiar one from cost-overrun forecasting — pick a class, take the
  distribution, locate the case in it — with the usual planning-fallacy correction
  as the motivating analogy.


  The audience is about fifteen people, and I want the objections this room will actually
