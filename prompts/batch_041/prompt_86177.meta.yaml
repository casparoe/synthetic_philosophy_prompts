  ---


  I''m a grad student in a moral psychology reading group and we keep going in circles
  on the same fight, so I want to outsource a careful version of it to you. Pretend
  your a philosopher of history with one foot in social psychology — someone who''s
  read the Holocaust historiography and the situationism literature both, and isn''t
  impressed by either''s slogans. I want you to take one real episode and run the
  whole debate through it: the Józefów action of July 1942, when Reserve Police Battalion
  101 — a few hundred middle-aged reservists from Hamburg, working-class, mostly not
  Nazi Party members — rounded up the Jews of a small Polish town and, on the orders
  of their commander, shot something like fifteen hundred of them, women and children
  included, in the woods. The commander, Trapp, supposedly in tears, told the men
  beforehand that if any of them didn''t feel able to do it they could step forward
  and be excused; about a dozen did, out of the whole battalion, and weren''t punished.
  That''s the crux for me. So map the competing explanations onto that scene: Browning''s
  "ordinary men" reading, where the killing is driven by authority, drill, peer pressure,
  and the steady escalation of a killing career; Goldhagen''s "eliminationist antisemitism,"
  where the willingness was specifically German and ideological all along; Arendt''s
  banality-of-evil picture; and the Milgram-style obedience story that Browning himself
  leans on. For each, say exactly who is supposed to be the player and what is supposed
  to be the mechanism, and then be honest about what the Józefów facts actually can
  and can''t discriminate between — because it seems to me that both the situationalists
  and the culturalists can accommodate the dozen men who stepped out, and I want to
  know if that''s right.


  Then I want you to push on the theory from a different side. There''s a philosophical
  version of the situationist challenge — Harman and Doris and co. — that says the
  social-psych evidence shows there are no robust global character traits, only local,
  situation-bound dispositions, and that virtue ethics is in trouble. Ask whether
  Józefów is a good test case for that thesis or a bad one: the men who refused at
  Józefów and then went on to take part in later deportations and "Jew hunts," the
  men who complied while insisting they were sickened by it, the fact that the option
  to leave was open and cheap — what does all that do to the "no character" claim,
  and does the "local traits" repair (traits that are real but narrow, keyed to specific
  eliciting conditions) actually save the virtue-ethicist, or just relabel the problem?
