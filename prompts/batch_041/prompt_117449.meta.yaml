  Domain: Maimonides'' views on animal sacrifice. Key content: In the Guide of the
  Perplexed, Maimonides explains the sacrificial laws as a divine concession to the
  historical circumstances of the Israelites, who had been raised in a world where
  worship meant sacrifice to idols; God transferred the mode of worship to Himself
  rather than abolishing it outright, since a sudden abolition would have been incomprehensible.
  Also: he notes that sacrifice is nowhere commanded as the primary form of worship
  (prayer is), that the Torah restricts sacrifice to a single place to wean Israel
  from local shrines, that the details of the laws (e.g., which animals) are designed
  to counter specific pagan practices, and that the sacrificial system''s purpose
  is to establish a lasting monotheistic worship. Also relevant: his claim that the
  sacrifices have no intrinsic value to God, who doesn''t need them. And the tension
  with the traditional expectation that sacrifices will be restored.


  Implications of this view: (1) Maimonides is committed to a kind of historical contingency
  in the law: had Israel not been in that condition, there''d be no sacrifices. (2)
  This raises the question of what''s essential vs. accommodated — the "kernel and
  husk" problem. (3) It''s a general model for reading other commandments (e.g., monarchy,
  the laws of war?). (4) It bears on the rationality of continuing the sacrificial
  commandments in the absence of the Temple. (5) It bears on the question of whether
  sacrifices will be restored — Maimonides himself affirms restoration in the messianic
  era (in the Mishneh Torah he says the sacrificial laws will be restored), which
  sits awkwardly with the concession view. (6) It bears on Jewish-Christian-Muslim
  polemics about abrogation (naskh): the concession view is a bit like the Islamic
  idea of gradual revelation / accommodation. (7) It bears on vegetarianism and on
  the question of God''s relation to animal killing. (8) Epistemological: it''s an
  exercise in explaining commandments by reasons, which raises the question of whether
  the reasons are speculative.


