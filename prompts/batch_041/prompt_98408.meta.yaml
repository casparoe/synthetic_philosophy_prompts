  The argument that seems to prove too much:


  (1) A divine law is given by a perfectly wise legislator, who chooses the best possible
  means to the end of the law.

  (2) Maimonides holds that the sacrificial commandments were given because the Israelites,
  having been raised in an idolatrous world, could not have been induced to abandon
  sacrificial worship altogether; so God permitted sacrifice but confined it to one
  place, one altar, and one name, thereby weaning them from idolatry.

  (3) So the sacrificial laws are a means adopted for a contingent historical circumstance
  — the dispositions of a particular ancient people.

  (4) If a commandment''s rationale is a contingent feature of its recipients, then
  had the recipients been different (e.g., a people never habituated to sacrifice),
  the wise legislator would not have commanded it, or would have commanded otherwise.

  (5) But a perfect law, given for all time, would not include commandments that a
  better-situated people would have no reason to keep — or, more sharply: the Law''s
  content depends on historical accident.

  (6) Maimonides also holds that the Torah is perfect and will never be abrogated
