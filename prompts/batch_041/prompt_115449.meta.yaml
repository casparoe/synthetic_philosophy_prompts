  Student answer draft:

  "Pain asymbolia is a dissociation between the sensory-discriminative and affective-motivational
  components of pain. Patients can localize a pinprick and call it painful, but they
  don''t find it unpleasant and often don''t withdraw. This is important for hedonism,
  the view that pleasure and pain are the only intrinsic goods and bads. If someone
  can have the sensory component without the affective component, then the badness
  of pain can''t be located in the sensory component. So the hedonist should say the
  badness is in the affective-motivational component: it is the unpleasantness, not
  the intensity or location, that is bad. In that case, asymbolia actually supports
  hedonism, because it shows that a pain sensation without unpleasantness is not bad.
  But the case also shows that the badness is really evaluative rather than affective.
  The patients don''t judge the sensation to be bad for them, and because they don''t
  make that judgment, the affective response doesn''t occur. So the unpleasantness
  is downstream of the evaluation. This refutes hedonism, because hedonism treats
  pain as a simple sensory state and can''t explain why the same sensation is bad
  in one person and not bad in another. A hedonist might reply that the patient still
  has an unpleasant sensation but just doesn''t mind it. But if they don''t mind it,
  then it isn''t unpleasant in the relevant sense. So the case shows that pain is
  only bad when you want it to stop, which is a version of hedonism. The upshot is
  that pain and suffering come apart: pain is the sensory component, suffering is
  the affective/evaluative component, and only suffering is intrinsically bad."


