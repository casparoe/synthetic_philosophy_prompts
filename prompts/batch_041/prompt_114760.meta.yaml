  Philosopher-Scientist (1949).

  - His argument: In relativity, simultaneity is relative; there''s no objective simultaneity
  slicing. He argues the existence of an objective lapse of time (a "now" that moves)
  requires a partition of spacetime into global simultaneity slices, each of which
  is the "present" as it becomes. In his rotating universe, there is no such global
  partition because of closed timelike curves — a global time coordinate can''t be
  assigned consistently. He takes this as a decisive proof of the unreality of time
  (i.e., supporting idealism, in his sense: the world is a static four-dimensional
  block, and our sense of becoming is subjective).

  - Actually more precisely: Gödel argues that if time is to be real in the "passage"
  sense, then there must be a global simultaneity relation. Relativity already relativizes
  simultaneity to reference frames, but you can still find a "time coordinate" in
  many solutions. In Gödel''s universe, no global time coordinate exists at all (because
  of CTCs), so the world cannot be decomposed into a well-defined succession of "nows."
  So he says the lapse of time is unreal; there is no objective becoming.

  - His argument is careful: he says his solution''s existence shows that such a universe
  is compatible with Einstein''s equations, and hence that even if our universe is
  not like it, the fact that relativity permits such a universe demonstrates that
  relativity does not support an objective becoming; if becoming were objective, then
  relativity''s claim that it is not directly observed would be a problem — actually
  the argument is more like: the existence of a Gödel universe shows that relativity
  cannot be taken to support an objective lapse of time, because relativity permits
  spacetimes in which no objective time-order exists. And he says the fact that his
  solution is a valid solution proves the possibility. He also says the "idealistic"
  view (like Parmenides, Kant, McTaggart) is the more natural one.


