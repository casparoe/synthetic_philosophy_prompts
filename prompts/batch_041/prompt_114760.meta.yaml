  Known accurate points about Gödel on time (from the 1949 "A Remark About the Relationship
  Between Relativity Theory and Idealistic Philosophy"):

  - He asks whether the existence of time (i.e., of an objective "now" and the lapse
  of time) is compatible with relativity.

  - Relativity of simultaneity means the "now" has no objective meaning if one insists
  on a single global simultaneity.

  - One might save the "now" by denying the relativity of simultaneity (i.e., admitting
  a distinguished frame — like Lorentz), but Gödel says such a move is possible only
  in certain models; his new solutions show that in some models there''s no way to
  define a "now" (no absolute time) — actually I think he says the opposite: that
  in his rotating solutions, one can''t have a consistent global "now", so the "now"
  would be... hmm.

  - He says the possibility of travelling into the past shows the unreality of time:
  "the existence of closed time-like curves ... would enable a person to travel into
  his own past". And that the "now" is then not distinguished.

  - He concludes: time is "an illusion" / that "time is not something objectively
  real" — and he connects it to idealism (Kant''s idealistic view that time is a form
  of intuition).


