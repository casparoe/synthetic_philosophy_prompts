  model, it has a countable model. So ZFC, if consistent, has a countable model.

  - Inside that model, Cantor''s theorem holds, so the model satisfies "there is an
  uncountable set" (e.g., the set it calls P(ω) or the set of reals).

  - But the model is countable from outside; its "uncountable" set is a countable
