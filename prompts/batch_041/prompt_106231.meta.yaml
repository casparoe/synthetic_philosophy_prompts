  Exam question:


  "Explain the Skolem paradox and assess the following claim: ''The Skolem paradox
  shows that there is no absolute, model-independent fact about whether a set is countable
  or uncountable; countability is always relative to a model.'' In your answer, (a)
  state the relevant theorem and how the paradox arises for a first-order theory such
  as ZFC; (b) distinguish the sense in which a countable model can satisfy ''there
  is an uncountable set'' from the sense in which that set is countable from the outside;
  (c) evaluate whether the paradox is a fatal objection to set theory, a limitation
  on first-order formalization, or neither."


  Student answer:


  "The Skolem paradox begins with the Löwenheim–Skolem theorem, which says that every
  consistent first-order theory with an infinite model has a countable model. Since
  ZFC is a first-order theory and (if consistent) has an infinite model, it has a
  countable model. Call it M. Inside M, Cantor''s theorem is a theorem, so M satisfies
  the sentence ''there exists an uncountable set.'' For example, M thinks that the
  set it calls P(ω) is uncountable. But M itself is countable. So the set that M calls
  P(ω) is a countable set when viewed from the outside, since it is a subset of M''s
  countable domain. This looks like a contradiction: M says that P(ω) is uncountable,
