  Tolstoy, What Is Art? (1897): The distinguishing mark of real art is "infectiousness"
  (zarazitel''nost''), the capacity to evoke in the audience the same feeling the
  artist experienced. The degree of infectiousness depends on three conditions: (1)
  the greater or lesser individuality (singularity) of the feeling transmitted; (2)
  the greater or lesser clarity of the transmission; (3) the sincerity of the artist
  — the artist must feel what they transmit. And there''s the further criterion of
  the *worth* of the feeling: the feeling must be such as unites people, and art is
  judged by how well it unites; the highest art conveys feelings flowing from the
  religious consciousness of the age (love of God and neighbor), then universal art
  conveying simple feelings, and the lowest is the exclusive "upper-class" art. Also
  he says art is not the manifestation of beauty or the production of pleasure; he
  rejects beauty as the criterion. And "counterfeit art" — works that imitate, are
  striking/entertaining, or simply excite. And he distinguishes the "three conditions"
  for a work to be art vs. counterfeit.


  So a museum''s standards: only works that (i) transmit the artist''s own felt emotion,
  (ii) transmit it clearly enough that an ordinary person feels the same, (iii) convey
  a feeling that unites rather than divides, (iv) are not counterfeit (mere imitation,
  effects, amusement). Plus the ban on beauty as a criterion.


