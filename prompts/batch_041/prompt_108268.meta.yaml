reasoning_summary: "We need to write a prompt for the dataset. Domain choice: pick\
  \ one. Type: \"Ask what philosophical commitments a practice, policy, or institution\
  \ presupposes\". Additional: formal/polished, \"in the weeds\", inject new/niche\
  \ ideas so models can't regurgitate. But also meaningful for a model without search.\n\
  \nLet me pick a domain and a practice that combines well. Options:\n\n1. Integrated\
  \ Information Theory — practice: e.g., the clinical use of \"covert consciousness\"\
  \ detection via fMRI/EEG in disorders of consciousness (command-following in VS/UWS\
  \ patients), or the practice of measuring \"perturbational complexity index\" (PCI)\
  \ with TMS-EEG as a clinical test for consciousness. What philosophical commitments\
  \ does the practice of using PCI to diagnose consciousness presuppose? That's quite\
  \ in the weeds and IIT-adjacent. Also the practice of \"brain death\" determination\
  \ vs. cortical death. Hmm, PCI is a real thing (Casali et al. 2013), used clinically\
  \ in some places. But does it presuppose IIT? It presupposes a \"complexity\" criterion\
  \ — could be IIT or global workspace. Nice: the practice is underdetermined between\
  \ theories, and it presupposes that consciousness admits of a scalar, measurable\
  \ quantity that's independent of report. That's a great prompt. Also: the practice\
  \ of giving anesthesia depth monitoring. Also: the practice of animal welfare law\
  \ using \"sentience\" thresholds.\n\n2. Two-dimensional semantics — practice: e.g.,\
  \ the legal practice of \"originalism\" vs. the practice of using rigidity for names\
  \ in tax law? Or the practice of changing the reference of \"meter\" via stipulation;\
  \ the SI redefinition of the kilogram (2019) — the practice of defining units via\
  \ fixed constants. What philosophical commitments does the practice of redefining\
  \ the kilogram in terms of Planck's constant presuppose? Interesting: the SI redefinition\
  \ presupposes something about definitions, apriority, and the contingency/necessity\
  \ of identities like \"the kilogram is such-and-such mass\" — connects to Kripke's\
  \ meter example and two-dimensional semantics. Actually there's a great one: the\
  \ practice of \"the meter\" definition historically (the standard meter bar in Paris;\
  \ Kripke's famous example) — but careful: quoting Kripke requires fetching. We can\
  \ paraphrase without quotes. The practice: the BIPM's transition from artifact standards\
  \ to constant-based definitions. What does that presuppose about the semantics of\
  \ measurement terms — that the definitions are a priori knowable but the identities\
  \ contingent (or the reverse)? That's deep and connects 2D semantics nicely. Also:\
  \ legal practice of \"the meaning of a term is fixed by the intentions of the framers\
  \ vs. current usage\" — 2D semantics relates to \"the meaning of 'cruel and unusual\
  \ punishment'\".\n\nAnother 2D practice: dictionary/trademark law \"genericization\"\
  \ — when \"escalator\" became generic; trademark law's distinction between a mark's\
  \ reference and its sense. Or the practice of \"misdescription\" in consumer protection\
  \ law. Hmm.\n\nAnother: the practice of translating \"water\" as \"water\" in Twin\
  \ Earth-ish cases; or the practice in astronomy of demoting Pluto — the practice\
  \ of defining \"planet\" by fiat presupposes something about whether natural kind\
  \ terms' extensions are discovered or stipulated. That's a nice one: IAU 2006 definition\
  \ of planet. What does the practice of stipulating a definition for \"planet\" presuppose\
  \ about the semantics of natural kind terms? And it conflicts with how we treat\
  \ \"gold\" or \"tiger\". Also it raises \"the reference of 'planet' was never determined\
  \ by a definition, so the IAU didn't discover anything—it legislated.\" Also the\
  \ practice of the DSM: defining \"mental disorder\" by committee. That is a great\
  \ 2D-semantics practice: the DSM's revision process presupposes something about\
  \ whether \"depression\" picks out a natural kind with a hidden essence, or whether\
  \ the reference is fixed by the committee's criteria. And the practical consequence:\
  \ removing homosexuality from DSM-II in 1973. Hmm, careful with dates — DSM-II 1973\
  \ removal is well known; I can state it without leaning hard.\n\n3. Epistocracy\
  \ vs. democracy — practice: e.g., jury selection / professional juries; or \"expert\
  \ panels\" in central banks (independent central banks as epistocratic institutions);\
  \ or the practice of constitutional courts striking down referenda; or the practice\
  \ of sortition in citizens' assemblies (Ireland, France, Ostbelgien); or the practice\
  \ of requiring licenses to vote? Or the practice of \"one person, one vote\" combined\
  \ with the Senate's malapportionment; or the practice of the filibuster; or the\
  \ practice of medical licensing restricting who may practice; or the practice of\
  \ the \"advisory referendum\". A good one: citizens' assemblies / deliberative mini-publics\
  \ — practice presupposes something about the epistemic value of random selection\
  \ vs. election, and about the difference between \"the will of the people\" and\
  \ \"the considered judgment of a sample\". What commitments does the practice of\
  \ a randomly selected citizens' assembly with expert testimony presuppose? It presupposes\
  \ that competence is not the issue (the problem is deliberation quality), or that\
  \ random selection plus deliberation produces better judgment. Nice and in the weeds.\
  \ Also, Ostbelgien's permanent citizens' council (2019) — real, first permanent\
  \ one. I could mention but need to be careful with facts. I know: Ostbelgien (German-speaking\
  \ Community of Belgium) created a permanent Citizens' Council in 2019; Ireland's\
  \ Citizens' Assembly 2016-2018; France's Convention Citoyenne pour le Climat 2019-2020;\
  \ Conference on the Future of Europe 2021-22. These are well known enough. Risk\
  \ of small factual error; I can keep it generic: \"citizens' assemblies whose members\
  \ are chosen by lot, briefed by experts, and whose recommendations are then handed\
  \ to elected bodies.\"\n\nAlso the practice: the \"epistocratic\" element in existing\
  \ institutions — e.g., the German Federal Constitutional Court's \"Eternity clause\"\
  \ (Article 79(3)) entrenching human dignity and democracy against majorities; judicial\
  \ review as epistocratic trusteeship; the practice of central bank independence\
  \ (unelected monetary policy committees); the practice of the US Federal Reserve's\
  \ structure; the practice of the Supreme Court's lifetime tenure. A good prompt:\
  \ central bank independence presupposes that monetary policy is a domain where the\
  \ \"correct answer\" is not a matter of contestable value but of expertise, and\
  \ it presupposes a specific account of why insulation improves decisions (time-inconsistency,\
  \ not superior wisdom). And it's in tension with democratic commitments to accountability.\
  \ What would change if we replaced the presupposition with an epistemic-democratic\
  \ one? Hmm, that's good but maybe not \"in the weeds\" enough. Or: the practice\
  \ of granting \"expert\" testimony by court-appointed experts vs. partisan experts\
  \ (Daubert). Or the practice of the US Senate's advice-and-consent for agency heads.\n\
  \nActually a really nice in-the-weeds one: the practice of \"qualified majority\
  \ voting\" vs unanimity in the EU, or the practice of the \"Spitzenkandidat\". Hmm,\
  \ too niche.\n\nAnother: the practice of licensing requirements for occupations\
  \ (e.g., hair braiding licenses) — presupposes that competence is measurable and\
  \ that restricting entry protects consumers more than it protects incumbents; epistemically\
  \ it presupposes that voters/consumers can't judge quality and that a credentialing\
  \ body can. This is a real, well-known debate (occupational licensing). What does\
  \ it presuppose about the division of epistemic labor? Nice.\n\n4. Hofstadter on\
  \ the persistence of the self in others — practice: e.g., the practice of maintaining\
  \ a deceased person's \"digital remains\" / chatbots of the dead (e.g., \"HereAfter\
  \ AI\", \"Project December\", Somnium Space's \"Live Forever\" mode). What does\
  \ the practice presuppose about the self? Or the practice of memorial Facebook pages;\
  \ or the practice of \"ghost bikes\"; or organ donation and the question of whether\
  \ the donor survives in the recipient; or the practice of \"naming a child after\
  \ a grandparent\" / the practice of reading a dead author's unfinished work (continuation\
  \ novels); or the practice of \"the king is dead, long live the king\" — corporate\
  \ succession; the practice of a band continuing to tour under its name with no original\
  \ members; or the legal practice of corporate personhood surviving total turnover\
  \ of personnel (\"the Ship of Theseus of a company\"). Or: the practice of sainthood/relics.\
  \ Or: the practice of \"institutional memory\" and \"the firm is the same firm after\
  \ a merger.\"\n\nA great one: the practice of a band or an orchestra (e.g., \"The\
  \ Beach Boys\" touring with one original member; the Vienna Philharmonic; the \"\
  Chippendales\") — what view of personal identity does the practice of a continuing\
  \ band name presuppose? Hofstadter's point: the self is a pattern that can be distributed\
  \ across brains/people; a band's identity is a pattern. Actually Hofstadter's specific\
  \ claim: the self is a \"strange loop\" pattern; the persistence of self in others.\
  \ In \"I Am a Strange Loop\" he says something like \"we are all ... \" — careful,\
  \ need quotes only if fetched. I can paraphrase.\n\nAlso a good one: the practice\
  \ of writing fan fiction / continuing a dead author's series; or the practice of\
  \ \"co-authorship\" where a famous economist's name is put on papers by his students.\
  \ Or the practice of \"the deceased's wishes\" as a legal fiction.\n\nAnother candidate\
  \ practice for the \"distributed I\": the practice of crowdsourced identity — e.g.,\
  \ the practice of \"the same AI assistant\" persisting across model versions; or\
  \ the practice of a role (the President) that persists across officeholders; or\
  \ the practice of shared pseudonyms: \"Bourbaki\" (the collective mathematician\
  \ pseudonym), \"Nicolas Bourbaki\" — that's a great, in-the-weeds example! Bourbaki\
  \ is a collective pseudonym of French mathematicians; the practice of a single authorial\
  \ \"I\" distributed across many people. Also \"Carolyn Keene\" (Nancy Drew), \"\
  Franklin W. Dixon\" (Hardy Boys) — the Stratemeyer Syndicate's house pseudonyms;\
  \ \"Erin Hunter\"; \"James Tiptree Jr.\"; \"S. Morgenstern\". And \"Luther Blissett\"\
  \ — the Italian collective that published under a shared name, and \"Wu Ming\" —\
  \ a collective author name explicitly designed to distribute the self. That's beautiful:\
  \ the Wu Ming collective, formerly \"Luther Blissett\", whose members deliberately\
  \ write under a shared name to undermine individual authorship. The practice presupposes\
  \ that authorship/self can be genuinely shared, not just conventionally attributed.\n\
  \nBut careful: models may not know Wu Ming. But I can describe it in the prompt\
  \ (the asker describes the practice). The instructions say: \"Prefer practices well\
  \ enough known that their content is common knowledge, or describe them in the prompt.\"\
  \ So describing is fine.\n\nAlso: the \"Hofstadter\" angle — the practice of \"\
  digital resurrection\" chatbots (Project December's \"JASON ROHRER\" recreation\
  \ of a dead fiancée; Somnium Space \"Live Forever\"). What does that presuppose\
  \ about the self and its persistence in other brains/machines? That's a strong prompt:\
  \ presupposes a pattern/continuity view; also presupposes that the \"I\" is substrate-neutral\
  \ and can be re-instantiated. It conflicts with the practice of, say, estate law\
  \ and the taboo on impersonating the dead. Hmm, this could be a great prompt, and\
  \ it's in the weeds. But the \"practice\" needs to be concrete.\n\n5. Human enhancement\
  \ and the therapy/enhancement distinction — practices: (a) insurance/reimbursement\
  \ rules (US Medicare doesn't cover routine dental/vision; \"medically necessary\"\
  \ criteria; the fact that Viagra is covered for erectile dysfunction but not for\
  \ \"enhancement\"); (b) the WADA anti-doping rules and the Therapeutic Use Exemption\
  \ (TUE) process — that's a fantastic one: the TUE system, e.g., athletes with asthma\
  \ or ADHD getting TUEs for beta-agonists and stimulants. What does the TUE system\
  \ presuppose about the therapy/enhancement distinction, and does it presuppose that\
  \ the distinction is drawable at all? Also the practice of \"therapeutic\" use of\
  \ growth hormone in children of short stature; (c) the FDA's approval of \"lifestyle\"\
  \ drugs (e.g., oral contraceptives as \"lifestyle\" — actually that was a claim\
  \ by critics); (d) the practice of requiring a diagnosis for access to gender-affirming\
  \ care; (e) the practice of \"off-label\" prescribing; (f) the practice of direct-to-consumer\
  \ genetic testing; (g) the practice of cosmetic surgery being non-reimbursed while\
  \ reconstructive surgery is; (h) the practice of \"GINA\" (Genetic Information Nondiscrimination\
  \ Act 2008) permitting employers to require wellness programs; (i) the practice\
  \ of the NCAA's rules on student-athlete disability accommodations; (j) the practice\
  \ of the Paralympics classification system — that's a great, in-the-weeds one: the\
  \ IPC classification system presupposes a baseline of \"normal\" function and classifies\
  \ impairment; what does the practice of classification presuppose about the therapy/enhancement\
  \ distinction? Hmm, maybe too far.\n\nThe strongest: WADA's TUE. Practice: an athlete\
  \ with a diagnosed condition may take a prohibited substance if they get a TUE,\
  \ so long as the substance restores them to \"normal\" function and doesn't produce\
  \ a \"supernormal\" effect. Wait, actual WADA criteria for a TUE: (1) the athlete\
  \ would experience significant health problems without it, (2) the therapeutic use\
  \ is not expected to produce any enhancement of performance beyond a return to normal\
  \ health... Actually the official wording: \"The therapeutic use of the Prohibited\
  \ Substance or Prohibited Method is highly unlikely to produce any additional enhancement\
  \ of performance beyond what might be anticipated by a return to the Athlete's normal\
  \ state of health.\" Also \"The Prohibited Substance or Prohibited Method is not\
  \ being used merely to enhance performance.\" I shouldn't quote without fetching.\
  \ But I can describe: the TUE code requires that the treatment not produce enhancement\
  \ beyond return to the athlete's normal state of health. That's a well-known element.\
  \ I could fetch the WADA ISTUE text to be safe if I quote. Better: paraphrase and\
  \ don't quote.\n\nNow: which domain and type combine best and let me inject \"new/niche\
  \ ideas\" while remaining answerable without search? And \"formal/polished.\"\n\n\
  The type is fixed: \"Ask what philosophical commitments a practice, policy, or institution\
  \ presupposes.\" Great fit for enhancement/therapy: e.g., the practice of TUEs,\
  \ or insurance \"medically necessary\" determinations, or the practice of cosmetic\
  \ vs reconstructive surgery reimbursement.\n\nBut \"in the weeds\" — we want a prompt\
  \ that requires real thinking, not regurgitation. A good trick: introduce a \"new/niche\
  \ idea\" — e.g., a fictional-but-plausible institutional policy, or a hybrid: combine\
  \ a real practice with a twist. The instruction says \"you'll often have to inject\
  \ some sort of new / niche ideas into the prompt.\" So maybe I should describe a\
  \ practice that is real but obscure, or a plausible composite policy.\n\nLet me\
  \ think about which domain gives the best \"practice\" with a genuine puzzle and\
  \ where the philosophy is underdetermined.\n\nCandidate A (IIT): Practice — clinical\
  \ protocols that use a consciousness \"index\" (TMS-EEG perturbational complexity,\
  \ or the \"covert consciousness\" fMRI command-following paradigm) to decide whether\
  \ to withdraw life support, or to decide which unresponsive patients get pain management.\
  \ Presuppositions: (i) consciousness is a graded, measurable quantity; (ii) reportability\
  \ is not necessary for consciousness; (iii) the index measures consciousness rather\
  \ than correlates; (iv) the \"level\" and \"content\" of consciousness decompose.\
  \ Rival views ruled out: higher-order theories requiring report; behaviorism; the\
  \ view that consciousness is all-or-nothing. And IIT specifically: the practice\
  \ presupposes that complexity (integrated information) is the right criterion —\
  \ but GWT and other theories can license the same test, so underdetermined. Then:\
  \ what would change if you replaced the presupposition with a \"no consciousness\
  \ without report\" view? Also there's the puzzle: the same clinics that use PCI\
  \ to say \"this patient is conscious\" also rely on a behavioral scale (Coma Recovery\
  \ Scale–Revised) to say \"this patient is not,\" and the two disagree in ~40% of\
  \ cases. Wait — the actual finding: ~40% of patients diagnosed as vegetative actually\
  \ show covert awareness on fMRI? The classic figure: 17% of patients with no behavioral\
  \ signs of awareness showed command-following on fMRI (Monti et al. 2010); and ~40%\
  \ of \"vegetative\" patients were misdiagnosed per the CRS-R vs. consensus diagnosis.\
  \ The \"40%\" figure is from Schnakers et al. 2009 — misdiagnosis rate of 40% using\
  \ behavioral criteria. That's a real fact but risky. Better to describe the disagreement\
  \ qualitatively without numbers.\n\nThis is a strong prompt: \"Ask what philosophical\
  \ commitments a practice presupposes.\" The practice: in some intensive care units\
  \ and rehabilitation centers, decisions about life-sustaining treatment and pain\
  \ relief for unresponsive patients are increasingly informed by neuroimaging/electrophysiology\
  \ indices of \"covert consciousness,\" while the bedside behavioral scale remains\
  \ the legal standard. What does this presuppose? Etc. And it's IIT-flavored: IIT\
  \ is one candidate theory that licenses it, but the practice doesn't need IIT. Also,\
  \ we can inject a niche idea: \"the practice of treating the index as an 'aliveness'\
  \ meter\" and ask whether it presupposes a scalar view of consciousness, whether\
  \ it presupposes that the index measures the thing itself or a correlate, and whether\
  \ it presupposes a specific bridge principle between theory and measurement.\n\n\
  I like this. It's in the weeds (TMS-EEG PCI, CRS-R, covert command-following), it's\
  \ meaningful without search (the model can reason about presuppositions), and it\
  \ doesn't require citations. And it's underdetermined between IIT, GWT, higher-order\
  \ theories — which is exactly the deliverable: \"distinguishes what the practice\
  \ strictly presupposes from what it merely fits well with, and says where the practice\
  \ is philosophically underdetermined.\"\n\nHowever: is it too reliant on the model\
  \ knowing PCI? I describe it in the prompt, so fine.\n\nCandidate B (2D semantics):\
  \ Practice — the SI/BIPM redefinition of units (kg via h, second via Cs, metre via\
  \ c), plus the \"standard metre\" history. What does the practice presuppose about\
  \ the semantics of measurement terms? Presuppositions: (i) definitional statements\
  \ can be a priori yet metaphysically contingent (or necessary); (ii) the reference\
  \ of a unit term is fixed by stipulation rather than discovered; (iii) the identity\
  \ \"1 kg = such-and-such\" is a \"contingent a priori\"; (iv) there's a fact of\
  \ the matter about the property being measured independent of the measuring procedure\
  \ — realism about quantities. Rival view ruled out: operationalism (the quantity\
  \ just is the procedure). Also: the practice changed the status of \"the kilogram\"\
  \ from an artifact to an abstraction — presupposes that the unit's reference was\
  \ always to an abstract quantity, and the artifact was only an approximation. That's\
  \ a lovely philosophical point: the practice presupposes that the original standard\
  \ was already imperfectly realizing a Platonic quantity — the metrological realism.\
  \ That's genuinely in the weeds and beautiful. And it connects to 2D semantics:\
  \ primary intension vs. secondary; \"the metre\" as a rigid designator whose reference\
  \ is fixed by a description (\"the length of that bar\") but whose referent is a\
  \ physical length; the 2D apparatus explains why \"the metre was defined by the\
  \ bar\" is a posteriori but the unit-term is rigid.\n\nAlso there's a genuinely\
  \ nice puzzle: the practice treats the definition as a *stipulation* that is *not*\
  \ revisable by measurement, while also allowing that the definition is *chosen to\
  \ be* the best realization of the pre-existing quantity. Does the practice presuppose\
  \ a distinction between fixing the reference and giving the meaning? Yes! That's\
  \ exactly the 2D framework: the \"reference-fixing\" vs \"meaning-giving\" distinction.\
  \ And it presupposes that the reference is fixed by a description that can be replaced\
  \ without changing the referent. Great.\n\nBut wait — is this a \"practice, policy,\
  \ or institution\"? Yes, a metrological practice/institution (BIPM, CGPM). Good.\
  \ And the prompt can be formal. And the asker can be puzzled by an apparent inconsistency:\
  \ the SI says the definition is exact and the measurement is fallible, but historically\
  \ the definition was an artifact that could drift; so why is the current \"exact\"\
  \ value of h not a discovery? And the practice also says the constants have \"exact\"\
  \ values with no uncertainty, which is odd because they're empirical facts.\n\n\
  Hmm. Both A and B are strong. Which is best for a \"formal/polished\" prompt and\
  \ injects a new/niche idea? \n\nCandidate B risks requiring specific historical\
  \ facts (dates of SI redefinition: 2019; the standard metre: 1799/1889). I'd better\
  \ avoid dates or verify them. I know the SI redefinition took effect 20 May 2019\
  \ — that's common knowledge, fairly safe, but the instructions say verify when in\
  \ doubt. I could avoid the date entirely.\n\nCandidate C (epistocracy): Practice\
  \ — citizens' assemblies / deliberative mini-publics with sortition plus expert\
  \ briefing, and the practice of giving their recommendations binding or semi-binding\
  \ force. Presuppositions: (i) the relevant epistemic defect in mass democracy is\
  \ preference formation, not competence; (ii) deliberation improves judgment; (iii)\
  \ random selection yields descriptive representation that tracks \"the considered\
  \ will\"; (iv) experts' role is to inform, not to decide — so the practice presupposes\
  \ that there is a distinction between \"expert judgment about means\" and \"citizen\
  \ judgment about ends\"; (v) the assembly's authority is derived from being a representative\
  \ sample rather than from election. Rival views ruled out: pure epistocracy (Brennan's\
  \ \"epistocracy\" — but careful, don't attribute specific claims), pure lottocracy\
  \ (Landemore / Guerrero — no, Landemore is \"open democracy\"; lottocracy is Guerrero;\
  \ Van Reybrouck's \"Against Elections\"). Hmm, attributions risky. I can avoid names.\n\
  \nActually a very nice, in-the-weeds practice for epistocracy: the practice of \"\
  expert testimony\" in the courtroom with the \"ultimate issue\" rule; or the practice\
  \ of central bank independence; or the practice of independent fiscal councils (e.g.,\
  \ the UK's OBR, the US CBO) — these are unelected bodies whose forecasts and \"\
  costings\" constrain elected legislatures. What does the practice presuppose about\
  \ the possibility of a politics-free fact? Very nice: the OBR/CBO \"scoring\" practice\
  \ presupposes that there is a single defensible answer to \"what will this policy\
  \ cost\" and that the answer should be produced by an insulated body whose output\
  \ binds elected officials. Rival view: the scoring conventions embed contestable\
  \ assumptions (dynamic scoring, behavioral offsets, the baseline), so the practice\
  \ presupposes a specific view of what counts as a \"neutral fact.\" That's great,\
  \ in the weeds, and requires no search. And the puzzle: the same legislature that\
  \ insists on democratic accountability delegates the authoritative number to an\
  \ unelected office, and treats disagreement with the score as denialism.\n\nCandidate\
  \ D (Hofstadter distributed I): Practice — corporate/collective authorship pseudonyms\
  \ (Bourbaki, Wu Ming, Luther Blissett, Carolyn Keene) or \"digital resurrection\"\
  \ chatbots, or the practice of a band touring under its name with no original members.\
  \ Presuppositions: the \"I\" is a pattern, not a substrate; the pattern can be instantiated\
  \ in multiple people; the persistence conditions of the self are informational.\
  \ Rival view: the self is a biological organism/animal (animalism) — so a collective\
  \ can't be a person. The puzzle: the law of copyright recognizes the pseudonym as\
  \ a single author with a single legal identity, while we all know there were many\
  \ hands; and Wu Ming explicitly denies the singular author. Nice, but the philosophical\
  \ payoff is smaller than A/B.\n\nHmm. Also the domain list includes \"Human enhancement\
  \ and the therapy/enhancement distinction,\" which is a rich practice area: TUEs,\
  \ insurance coverage, \"medically necessary,\" cosmetic vs reconstructive, ADHD\
  \ stimulant use by healthy students (\"study drugs\"), NCAA accommodations. The\
  \ classic puzzle: the same intervention is therapy in one body and enhancement in\
  \ another (growth hormone for GH-deficient vs. short-but-healthy kids; stimulants\
  \ for ADHD vs. for the sleep-deprived; SSRIs for dysthymia vs. for shyness; beta-blockers\
  \ for hypertension vs. for performance anxiety; testosterone for hypogonadism vs.\
  \ for aging). The practice presupposes a \"baseline of normal functioning\" that\
  \ is (i) statistical vs. (ii) species-typical vs. (iii) disease-based, and that\
  \ the baseline is defined relative to a reference class. And the practice must draw\
  \ a line where the intervention's aim is \"restoration\" vs. \"improvement.\"\n\n\
  A great concrete practice: **the TUE system in anti-doping**, where a diagnosed\
  \ condition plus a permitted drug is therapy and the same drug without a diagnosis\
  \ is doping, and the criterion is restoration to the athlete's own \"normal state\
  \ of health\" — presupposing a personal baseline that's defined partly by the sport's\
  \ own demands. Also: the practice treats asthma as real in a swimmer but \"exercise-induced\
  \ bronchoconstriction\" as suspicious. Also the puzzle: some sports ban a drug that\
  \ has no known performance benefit but is banned because it's \"against the spirit\
  \ of sport\" — the WADA code's \"spirit of sport\" criterion. Hmm, the \"spirit\
  \ of sport\" is a real thing in the WADA Code (fundamental rationale). I could mention\
  \ it, but careful — I'd paraphrase.\n\nActually the TUE prompt is excellent for\
  \ \"philosophical commitments a practice presupposes\": the practice presupposes\
  \ (a) the therapy/enhancement distinction is drawable in principle, at least for\
  \ these substances; (b) \"normal\" is a well-defined state for a given athlete,\
  \ relative to which a treatment can be a return; (c) the relevant baseline is individual,\
  \ not species-typical (contrast with the DSM-based psychiatric baseline); (d) enhancement\
  \ is a matter of the substance's causal effect rather than the intention or the\
  \ context; and it rules out the view that the baseline is normative/constructed.\
  \ And there's a real tension: the TUE criteria require that the treatment not produce\
  \ enhancement \"beyond a return to normal health,\" yet the athlete's \"normal health\"\
  \ is itself partly constituted by the sport's training regime (e.g., altitude, dehydration).\
  \ Also, the practice treats a condition as legitimate only if it's diagnosed, so\
  \ it presupposes that diagnoses track biological dysfunction rather than the athlete's\
  \ ambition — yet for ADHD, the diagnosis is clinical and contestable.\n\nHmm, but\
  \ a very in-the-weeds enhancement practice that injects a new idea: I could invent\
  \ a plausible policy, e.g., \"a hospital's ethics committee now requires...\" But\
  \ the type says point at something that exists. The additional instruction says\
  \ inject new/niche ideas — which can be done by describing an obscure real practice\
