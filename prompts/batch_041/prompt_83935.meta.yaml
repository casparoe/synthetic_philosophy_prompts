  Draft:


  "A colleague in my department has taken to defending a position in seminars by way
  of an analogy I want to be sure I''ve properly assessed before I respond in print.
  The analogy is this: moral intuitions are like tastes, and the moral foundations
  [naming them] are like the taste receptors — five or six of them, differently calibrated
  in different people and different cultures, each responsive to something in the
  world but none of them delivering a verdict on how the world ought to be; cuisines
  differ, palates differ, and there is no fact of the matter as to whose cooking is
  correct. From this he concludes that moral foundations theory settles the question
  I am supposed to be teaching: the psychology of left and right tells us nothing
  whatever about who is right, because the left/right dispute is a dispute between
  palates.


  I want an audit. Set out the correspondence he is relying on — what plays the role
  of the receptor, the palate, the cuisine, the cook, the nutrition — and then tell
  me where the mapping breaks. Two lines of attack interest me in particular: (i)
  taste receptors are not free-floating preferences but evolved detectors of things
  that matter to the organism, so the analogy may be recruiting a standard it denies
  itself; (ii) taste is the least learned and least culture-soaked of the senses,
  whereas the phenomena the foundations are meant to explain — the left/right differences
  in weighting harm, fairness, loyalty, authority, sanctity — are precisely the ones
  that shift with culture and politics. Which disanalogies bear on the conclusion
  he wants, and which are decorative? Then tell me what the analogy can carry: is
  there a reading on which it supports a modest realism — foundations as detectors
  of genuine goods, cuisines as assessable for adequacy even where tastes are not
  — and if so, how much of his conclusion survives? If a better analogy is available
  for the same purpose, give me that too. British English throughout, and no bibliography
  — I want the argument, not the reading list."


