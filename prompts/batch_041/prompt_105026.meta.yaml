  Let me draft a concrete list of five theses, some standard-ish, some invented:


  1. "The deflationary thesis": sphexishness is a matter of degree in behavioral flexibility,
  not a binary; free will requires only a threshold of flexibility, so nothing special.

  2. "The epiphenomenal-rigidity thesis" (invented): freedom consists in the capacity
  to be moved by reasons; sphexish behavior is behavior insensitive to the space of
  reasons; thus sphexishness and freedom are contraries.

  3. "The nested-routine thesis" (invented): any finite agent''s flexibility is itself
  implemented by fixed routines at a lower level; freedom is a property of the hierarchy
  as a whole; so sphexishness at one level is compatible with freedom at another.

  4. "The interruptibility thesis": the mark of the non-sphexish is the capacity to
  interrupt and revise a routine mid-execution when a novel signal arrives; free will
  = interruptibility.

  5. "The illusion thesis": attributions of sphexishness presuppose an external observer''s
  inability to predict; since unpredictability is observer-relative, freedom-talk
  is likewise observer-relative.


