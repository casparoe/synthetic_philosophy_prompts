  Structure:

  - Role assignment: "You are a philosopher working on moral psychology and the philosophy
  of the emotions; you''re used to building maps of a debate rather than summarizing
  it." Or "Act as an expert in moral psychology and social philosophy..."

  - Think first / brainstorm: "Begin by enumerating the questions on which positions
  in this debate actually divide, before attaching any labels." — good prompt-engineering.

  - The asker''s context: preparing a graduate seminar / a handout.

  - The deliverable: a decision tree (or taxonomy) with branch nodes as questions,
  leaves as positions, each leaf with one sentence on its most awkward commitment;
  flag pairs the tree can''t separate; note unoccupied combinations and diagnose whether
  they''re incoherent, unattractive, or unexplored.

  - Constraints: no citations, no reading lists; define every position by its commitments;
  only use a familiar label where confident; audience is graduate students who know
  the basic guilt/shame contrast but not the secondary literature.

  - Fixed dimensions/angles: the asker specifies the axes: (1) whether the distinction
  is real and where it lies (object: act vs. self; audience: spectator vs. internalized
  standard; standard: moral vs. social; phenomenology/action tendency); (2) what "better"
  means (truth-tracking / motivational efficacy / respect for the agent''s standing
