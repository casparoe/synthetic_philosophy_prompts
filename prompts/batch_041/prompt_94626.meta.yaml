  Background: In a reading group, the discussion turned to the classic Molyneux question.
  Suppose a person has been blind from birth and can distinguish a cube from a sphere
  by touch. Suppose she suddenly gains sight and is shown the two objects. Would she
  immediately know, by sight alone, which is the cube and which is the sphere? Two
  graduate students, Alex and Bea, disagreed.


  Alex: Yes, she would. She already has the concepts cube and sphere, and those are
  spatial concepts. Vision is just another way of presenting the same spatial properties.
  If she can apply the concept to the tactile presentation, she can apply it to the
  visual presentation, because the property is the same.


