  Now, form choice. I said pantoum earlier. Let''s consider what structural work the
  form does:


  Option A: Pantoum — repeating lines that shift speaker/meaning. The repetition mirrors
  how the same facts keep coming back and get re-described; the pantoum''s final stanza
  returns the first lines, closing the loop — which is apt for a question that keeps
  reasserting itself. And the pantoum''s demand that lines 2 and 4 of a stanza become
  1 and 3 of the next forces a "migration" — like the self migrating between locations.
  Good.


  Option B: Sestina — fixed end-words, fixed permutation; "the same six words keep
  coming back in a fixed order no matter what, so the form is the facts and the sense
  has to slide." Also good, but harder.


  Option C: Terza rima — interlocking chain; the "radio link" as the chain. Eh.


  Option D: A sonnet with the volta at the moment the speaker realises there''s no
  fact of the matter. Also fine but "sonnet volta" is common.


  Option E: A "double dactyl" or limerick — too comic.


  Option F: Ghazal — each couplet autonomous with a radif refrain; the ghazal''s "disunity"
  is apt: each couplet is a separate voice/moment, which fits the disunity of the
  self across locations. Hmm, a ghazal where the radif is "where am I" — that could
  be lovely: the returning refrain of the ghazal as the recurring question, and the
  ghazal''s convention that couplets needn''t connect = the self''s lack of a single
  location/narrative. And ghazal''s "signature" (the poet''s name in the last couplet)
  could be the "I". Hmm, that''s cute but the ghazal may be less familiar in its rules.


  I like pantoum best: the pantoum''s interlocking repetition is the clearest formal
  analogue of "same thing, different place/voice," and its final stanza (in strict
  pantoum) repeats the first stanza''s lines in reversed positions, which literally
  swaps the beginning and end — a nice image for swapping brain and body. And the
  pantoum''s notorious difficulty in making sense of the repetitions parallels the
  puzzle''s failure to make sense.


