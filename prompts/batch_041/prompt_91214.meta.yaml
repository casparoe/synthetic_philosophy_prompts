  "I am a final-year undergraduate reading philosophy, and the course I am taking
  this term on the epistemology of credence has just finished its unit on the Sleeping
  Beauty problem. Our essay is on a topic of our own choosing, and I would like to
  avoid writing yet another survey of the halfer and thirder positions; a friend in
  the seminar has half-joked that we should ask what a philosopher writing before
  the puzzle existed would have made of it, and I want to take that suggestion seriously
  rather than playfully. My proposal is John Maynard Keynes, on the strength of A
  Treatise on Probability, published in 1921 — well over half a century before the
  problem was first formulated, so the exercise is frankly counterfactual, but I would
  like it done under constraint: rather than speculate about Keynes''s temperament
  or invent views for him, I want an argument from what he actually commits himself
  to in that book, so that the verdict is one his own framework licenses and not one
  merely attributed to him."


