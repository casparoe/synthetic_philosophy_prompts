  his treatment of the principle of indifference, which he both relies on and sharply
  restricts; his insistence that probability is a logical relation between evidence
  and hypothesis, so that the same proposition may stand in different relations to
  different bodies of evidence; and his distinction between the probability of an
  argument and its weight, together with his willingness to allow that some probabilities
  are neither numerically measurable nor even comparable with one another. I would
  like you to work out what those commitments come to in the sleeper''s situation.
  Does her evidence, as Keynes understands evidence, present her with the kind of
  symmetry that licenses an application of the principle of indifference — and if
  so, over which partition: the coin outcomes, the days of the week, or the awakenings
  themselves? Would the weight of the argument rather than its probability do any
  work here, and might Keynes be pushed to the unfashionable conclusion that neither
  one half nor one third is rationally required, or even that her credence is simply
  not a quantity? Does the self-locating character of the question create a difficulty
  for a logical-relationist view, given that what she learns on waking is not a new
  proposition about the world but something about her own position in it? And I would
  like the reconstruction tested against variants rather than only the canonical case:
  the version in which the coin is not tossed at all and she is woken every day regardless,
  so that the counting argument appears to give an answer even though she has learnt
  nothing; the version in which tails produces a very large number of awakenings;
  and the version in which she is told that it is Monday."


