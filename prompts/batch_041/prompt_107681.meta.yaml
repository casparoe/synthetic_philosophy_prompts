  ''Skolem''s paradox is one of the strangest results in modern logic. The Löwenheim–Skolem
  theorem says that every consistent first-order theory has a model whose elements
  can be counted off one by one. Set theory is a first-order theory, so if the axioms
  of ZFC are consistent, they have a countable model — a model in which every set
  is countable. But ZFC proves Cantor''s theorem, i.e. that the real numbers are uncountable;
  the same axioms therefore prove that the reals are both countable and uncountable.
  What saves set theory from outright contradiction is that the model''s version of
  the reals isn''t the real thing — most of the actual real numbers simply aren''t
  in the model, and the bijection that would witness countability is too big to fit
  inside it. The upshot is that countability is not an absolute property of sets at
  all but a fact about the model you happen to be working in: pick a different model
  and the same set comes out countable or uncountable as you please. Cantor''s theorem
  survives only as a claim about what a particular formal system can prove, and Skolem
  himself thought this showed that set theory cannot be about a fixed universe of
  sets — that the subject matter is, in the end, relative to the language we choose.
  The lesson generalizes: no first-order axiomatization can pin down the real numbers,
  so the reals of any axiom system are at best a convenient fiction.''


  I''d like a claim-by-claim audit..."


