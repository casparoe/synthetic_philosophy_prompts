  Content of desiderata for a theory of phenomenal judgment (given epiphenomenalism):


  The core problem: epiphenomenalism says phenomenal properties don''t causally affect
  the physical. But we seem to talk about, report, judge, and know about our phenomenal
  states. If qualia are causally inert, how do our verbal reports ("I see red") reliably
  track them? The paradox: either the judgments are caused by the phenomenal states
  (contradicting epiphenomenalism) or they''re not, in which case they''re unreliable/accidental,
  undermining our knowledge of consciousness — including the knowledge that grounds
  the argument for epiphenomenalism itself.


  Desiderata could include:

  1. Must explain the reliable correlation between phenomenal states and judgments
  about them without positing downward causation (if you''re an epiphenomenalist).

  2. Must not make our introspective reports systematically unreliable — otherwise
  the evidence for the theory (including first-person evidence) evaporates.

  3. Must be self-consistent: the theory itself is a judgment/claim, so it must be
  able to account for its own assertability.

  4. Must respect the distinction between the existence of phenomenal states and our
  epistemic access to them.

  5. Must account for the possibility of error and illusion in phenomenal judgment
  (e.g., we misdescribe our experience) — a theory that makes judgments infallible
  is too strong.

  6. Must handle the "zombie" case: a physical duplicate without phenomenal states
  who nonetheless makes the same judgments — if the judgments are the same, what does
  that say about the reliability of our judgments?

  7. Must be consistent with the causal closure of physics / whatever motivates epiphenomenalism
  in the first place.

  8. Must explain the asymmetry: why do we have judgments about some phenomenal states
  and not others? Or must explain why the correlation is as specific as it is.

  9. Must not collapse into epiphenomenalism''s collapse into either (a) property
  dualism with causal efficacy (contradiction) or (b) eliminativism/illusionism.


