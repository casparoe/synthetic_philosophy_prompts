  Let''s design a dispute with 4-5 moves and both sides having decent points:


  Topic: whether everyday conventions (tipping, queueing, jaywalking) create genuine
  moral obligations, and whether visitors are bound by local ones.


  Move 1 (A): Conventions like tipping are not moral obligations at all — they''re
  customs; failing to tip is rude or gauche but not wrong; the only obligations are
  those grounded in what people are owed, and a server is owed their wage by their
  employer, not a gift by the customer. (Related: the tipping wage structure makes
  this questionable.)


  Move 2 (B): But conventions can ground obligations: by entering a practice you take
  on its terms. If the restaurant''s menu prices presume tipping, then not tipping
  is a kind of free-riding on an arrangement you knowingly accepted — you get the
  subsidized price and shift the cost to the server. Also, following conventions matters
  for coordination: the queue works only if everyone follows it; a jaywalker who ignores
  the crossing light free-rides on the restraint of others and imposes risk.


  Move 3 (A): The free-riding argument proves too much or too little: it makes obligations
  depend on the convention''s being fair. If the convention itself is exploitative
  (tipping shifts labor costs to customers and makes wages depend on customers'' moods),
  then the "practice" is unjust, and the person who refuses to participate may be
  doing something good, not wrong. Also, the jaywalker argument: if the norm is universally
  ignored (jaywalking in NYC), the coordination equilibrium is already gone, so there''s
  nothing to free-ride on; the only residual reason is the law and safety. Also, "the
  menu price presumes tipping" is an empirical claim that varies: in a no-tipping
  restaurant, no obligation.


  Move 4 (B): Then at least distinguish obligations owed to individuals from obligations
  owed to the practice: the server is an individual whose livelihood depends on it,
  and fairness to them (not to the practice) is the ground. And this is where the
  visitor question bites: a visitor may not have grown up with the norm, but if they
  can see it (the tip line on the receipt), they can know it, so ignorance isn''t
  a defense; but in cases where the norm is invisible to an outsider (the local queue
  is "whoever makes eye contact first"), it''s unreasonable to hold the visitor to
  it. So the obligation tracks knowability, not locality.


  Move 5 (A): Knowability is not enough: some conventions are known but unjust or
  trivial, and obligations shouldn''t scale with the local majority''s expectations.
  Also, the "when in Rome" principle can''t be right, because if the local custom
  were morally bad (a custom of not queueing means the strongest push first, and the
  weak get nothing), the visitor''s participation would make things worse, not better.
  So the "when in Rome" rule needs a moral filter: follow local conventions when they''re
  harmless coordinations, don''t when they''re unjust or harmful, and there''s no
  clean line.


  Move 6 (B): If there''s no clean line, the default should still be deference to
  local conventions because they encode local knowledge — e.g., a local norm may reflect
  facts the visitor doesn''t know (a crossing where drivers don''t yield; a queue
  norm that prevents stampedes). Deference is fallible but epistemically reasonable.
  And the visitor''s own conventions may be the parochial ones.


