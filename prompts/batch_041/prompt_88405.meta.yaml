  Potential prompt for domain "The Principal Principle and deference to objective
  chance" and type "Recount a disagreement and ask adjudicate":


  "Two of my colleagues in the philosophy department got into a dispute after a seminar
  on chance. The setup was a sealed box containing a coin that is either double-headed
  or double-tailed, and each possibility is equally likely. Before the box is opened,
  no one knows which coin is inside. The objective chance of heads on the next toss
  is therefore either 1 or 0, but the agent''s credence that it is the double-headed
  coin is 1/2. One colleague, A, said that the agent''s credence in heads should be
  1/2: since she doesn''t know the chance, she should defer to her best estimate of
  it, and the expected chance is 1/2. The other, B, said that this cannot be right:
  the Principal Principle requires credence to match objective chance, and the objective
  chance is not 1/2; it is either 1 or 0. A replied that the Principal Principle only
  applies when the chance is known or when we can conditionalize on a chance distribution,
  and that B is treating an unknown chance as if it were a determinate value. B said
  that if A''s view were correct, then the Principal Principle would collapse into
  a rule about expected chance, which is a different principle. A responded that expected
  chance is exactly what a rational agent should use when chances are unknown, and
  that B''s alternative would require the agent to have credence 1 or 0 without knowing
  which, which is impossible. B then said that the agent can have an imprecise credence
  -- a set of credences containing 0 and 1 -- and that A''s insistence on a sharp
  credence is the real mistake. They asked me to referee. Please adjudicate their
  exchange point by point, saying who is right about the Principal Principle, about
  expected chance, about imprecise credence, and about what, if anything, both are
  missing."


