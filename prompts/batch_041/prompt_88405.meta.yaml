  Let''s flesh out. We can write a formal prompt:


  "Suppose Aristotle were confronted with a contemporary debate in temporal logic
  and metaphysics over the status of future contingent propositions. One influential
  position -- call it ''open futurism'' -- holds that propositions about future contingent
  events are neither true nor false, but that this indeterminacy is not merely epistemic;
  it is a feature of reality itself. On this view, the future is genuinely open, and
  the past is fixed. A second position, ''tenseless truth,'' holds that every proposition,
  including future contingents, has a determinate truth value at every time, because
  truth is tenseless and the future is as real as the present. A third, ''retro-closure,''
  holds that future contingents lack truth value until the event occurs, but once
  it occurs, the original future-tensed proposition acquires a truth value retroactively,
  so that the past is not entirely fixed. How would Aristotle have positioned himself
  among these views? In particular, how would he have responded to the claim that
  open futurism requires giving up bivalence for future contingents, and to the claim
  that retro-closure preserves bivalence only by making the past dependent on the
  future? What would he have said about the relationship between the principle of
  excluded middle, the law of non-contradiction, and the openness of the future? And
  how, if at all, would he have revised the sea-battle argument in light of these
  modern distinctions?"


