  First, some vocabulary, since part of my difficulty is that ''discernible'' is doing
  three jobs. Two things are absolutely discernible if some property each has on its
  own separates them. They are relationally discernible if some relation to other
  things separates them — each is a mile from a sphere, but only one is a mile from
  a cube. And a friend tells me there is a third notion, which she called weak discernibility:
  a pair is weakly discernible when there is an irreflexive relation that holds between
  them, so that each bears it to the other but to nothing else — being at opposite
  ends of a diameter, or having opposite spin. I have no idea whether weak discernibility
  should count, and I suspect the answer to my question turns on it.


  My verdicts:


  1. Black''s two iron spheres, one mile apart, otherwise empty space: genuinely two
  spheres. Not one sphere in two places, not a single object counted twice.


  2. The swap: if a world is exactly like that one but with the two spheres exchanged,
  I do not think it is a second world. There is no fact about which sphere is which.


  3. ''Being identical to sphere A'' would discern them, and so would ''being the
  sphere nearer the origin of the coordinates I just drew''. Both are cheats. I don''t
  count them.


  4. Add a pebble, off-center, so that one sphere is nearer it. I count that as a
  real relational difference; but I notice I would then say almost any two things
  anywhere are discernible, given enough furniture, and that makes the relational
  version of the principle nearly vacuous.


