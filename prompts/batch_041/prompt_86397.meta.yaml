  no other matter. I want to say there are infinitely many. But every sphere has exactly
  the same relational profile as every other — the world looks identical from each
  — and I can''t see what makes the count infinite rather than, say, one sphere repeated.
  Here the swap thought from (2) becomes dizzying.


  7. Two electrons that share a spatial state and differ in spin: two particles, and
  what makes them two is not any property of either alone but the irreflexive spin
  relation — so weak discernibility is enough for me here. But two photons in exactly
