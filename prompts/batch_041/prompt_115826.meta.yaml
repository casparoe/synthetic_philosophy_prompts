  Draft:


  "I''m teaching a short module on the ethics of eating animals and I want to use
  E.B. White''s Charlotte''s Web (1952) as the set text — the children''s book, pig
  called Wilbur, spider called Charlotte who spins praise into her web to stop the
  farmer killing him. Everyone in the seminar knows the story, so don''t retell it.
  What I want is a proper reading of it through the lens of meat consumption and wild
  animal suffering, and I want you to be honest about where the lens doesn''t fit.


  Things I''d like you to deal with:


  - The farm is basically a machine for turning crops and slops into flesh, and Charlotte''s
  plan doesn''t touch the machine at all — it just makes one unit of it too famous
  to kill. Is the book offering a theory of moral standing or a theory of publicity?
  Is Wilbur saved, or just reclassified as an asset? (It''s no accident that his rescue
  comes as a prize at a county fair.)

  - Charlotte is a predator — she eats the flies that blunder into her web, and the
  book is completely untroubled by it. Does White have a consistent rule about who
  may be killed and who may do the killing, or does he just exempt the characters
  he likes? Try to state the rule the book would have to be operating on, and say
  whether it survives.

  - The barn is a sort of half-wild space: rats scavenging, spiders hunting, and a
  lot of death that the book treats as simply natural and, in Charlotte''s case, even
  good — she dies satisfied, on schedule, having done her job. Compare that with how
  the book handles slaughter, and tell me whether the novel is committed to the idea
  that natural death is the acceptable death. This is the bit I most want, because
  the wild-animal-suffering people would say the natural deaths are often the worst
  ones, and I want to know if the book''s whole emotional economy depends on not noticing
  that.

  - The animals aren''t equal on the page either: the pig and the spider get inner
  lives and the sheep, geese and cows are mostly chorus. Is there a species hierarchy
  at work, and does it track anything defensible, or just cuteness and usefulness
  to the plot?

  - Last thing: Fern, the girl who saves him at the start, grows up and drifts away,
  and the book seems fairly relaxed about that — concern for the animals gets coded
  as a stage you pass through. Is the book quietly telling children that caring about
  this stuff is for kids?


  Then finish by saying what the novel actually adds that the philosophy papers don''t
  — White is a good writer and there''s something in the book''s refusal to argue
  that might be worth more than an argument — and where you think my reading is forcing
  the text. Don''t make it a tract and don''t flatten the book into an illustration
  of a position.


  No bibliography or references please, I know the literature; I want your reading.
  Essay length, call it 1000-1300 words, in British English."


