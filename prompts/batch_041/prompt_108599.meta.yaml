  Design: Novelist writing a novel with two characters (a Mencian tutor and a Xunzian
  schoolmaster) or one character who lectures. The asker has been reading about Mencius
  and Xunzi for the novel and noticed that the received contrast is carried by two
  images: the sprout and the press-frame. They want an audit: mapping, where each
  breaks, what each imports (e.g., the sprout imports preformation/teleology and the
  passivity of growth; the press-frame imports the passivity of the material and the
  externality of the agent, plus hysteresis), and whether the conclusions each is
  used to license survive: for Mencius, that moral education is cultivation not manufacture
  and that the ruler can rely on the people''s spontaneous decency; for Xunzi, that
  goodness is entirely artificial and thus ritual and teachers are indispensable and
  nature can''t be trusted.


  Then also: the asker should mention the conclusion the analogy is being used to
  support in their context — e.g., a character uses the press-frame to argue that
  a child''s native impulses are unreliable and must be broken; the asker suspects
  the analogy is doing the work rather than the argument.


  Also good to include the classic disanalogy: the press-frame image makes the "straightening"
  a one-time operation done by an external craftsman to a passive patient, whereas
  Xunzi needs the person to be the agent (wei 偽, deliberate effort, accumulation 積),
  and the transformation must be continuous; and Xunzi''s nature isn''t neutral raw
  material but an active tendency (fondness for profit, envy, sensual desire) that
  pulls the other way, so the better material analogue is something that actively
  springs back, like a bent bow or a badly set broken bone, or a weed. Whereas the
  sprout image makes goodness inevitable given normal conditions, which conflicts
  with Mencius''s own insistence that most people lose it, that it needs "extending"
  (推), and that bad environments (barren years, bad rulers) can wipe it out; also
  a sprout is a miniature of the mature plant, so it implies the adult virtue is already
  present in miniature, which sits badly with Mencius''s claim that the four beginnings
  are merely "beginnings" (端) and that the sage''s full virtue is a matter of development,
  and with his concession that the "great man" and "petty man" differ in what they
  follow.


