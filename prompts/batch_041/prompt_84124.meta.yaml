  trillions upon trillions if we spread out and last a long time. If anything we do
  now has even a tiny chance of changing how many people there eventually are, or
  how well their lives go, then the expected number of people affected is enormous.
  So we should be willing to accept large costs now for even small chances of a better
  far future. This is what I take the case for ''fanaticism'' about the future to
  be.


  2. The simulation argument. At least one of three claims must be true: nearly all
  civilizations at our stage of development destroy themselves before they can run
  large simulations of minds like ours; civilizations that can run them choose not
  to; or we are almost certainly living in a simulation. I see no strong reason to
  believe either of the first two, so I put a good deal of weight on the third.


  3. The dampening step. If we are almost certainly simulated, then what we do only
  changes what happens inside the simulation. The real future — the one belonging
  to the beings who built and run our world — is not in our hands, and it may be vastly
