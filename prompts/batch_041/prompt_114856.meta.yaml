  The confusion: conflating the risk function r (a feature of preference, applied
  to cumulative probabilities, not a credence) with a probability judgment/belief.
  Under REU, the agent need not misestimate any probability; she may know the odds
  exactly, and r encodes how she trades off chances against outcomes — it''s a preference
  parameter, not a belief. Also, REU doesn''t say she "assigns lower probability";
  it says her evaluation of a lottery is not linear in probability, i.e., the marginal
  rate of substitution between probability and outcome varies. Also there''s a nuance:
  some interpretations do treat weighting as "distorted belief" (prospect theory''s
  probability weighting has been interpreted both ways, and there''s the "as-if" vs.
  "cognitive" issue; also there''s literature on "probability weighting as emotional"
  / "as if" misperception). And the "rationality" question: REU is a theory of instrumental
  rationality where risk attitude is a legitimate part of the agent''s preferences
  (the risk function is analogous to the utility function—not a belief), so "fixing
  probability estimates" doesn''t change the risk attitude. Also the sure-thing principle
  rejection: REU violates separability, but not because of false beliefs.


