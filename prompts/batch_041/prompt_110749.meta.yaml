  whose preferences are simply inconsistent across time, while the akratic agent looks
  like someone who experiences a genuine conflict between what they judge they should
  do and what they are moved to do. Is that difference merely phenomenological, or
  does it mark a structural difference between the two explanations? Finally, say
  which account you think is more illuminating and why, and identify one feature of
  akrasia that you think neither account can fully capture.


