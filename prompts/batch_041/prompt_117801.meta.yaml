  a neutral toy that happens to resemble capitalism; it was designed as an argument.
  The game descends from The Landlord''s Game, patented in 1904 by Elizabeth Magie,
  a follower of Henry George, who intended it as a teaching device about the evils
  of land monopoly — and her game was played under two different sets of rules, one
  in which the players prosper together and one in which the monopolist grinds the
  others down, with the second existing precisely so that the first could be felt
