  textbook version, and ideally start by laying out both views as precisely as you
  can before you adjudicate.


  The argument: I hold that prioritarianism (the view that a benefit matters more
  the more badly off the person receiving it is, and that''s it — inequality itself
  isn''t bad) is genuinely different from egalitarianism (the view that inequality
  itself is bad). The standard reason people give is the levelling-down objection:
  if inequality is intrinsically bad, then making the better-off worse off without
  helping anyone makes the world better in one respect, which is absurd. Prioritarianism
  is supposed to be immune because it never says a gap is bad as such, only that benefits
  to the badly off count for more.


  Dan''s line is that this is a con. He reckons that the moment you try to say how
  much more a benefit to a badly-off person counts, you have to be comparing them
  to someone — otherwise the ''worse off'' in ''worse off than whom?'' has no content
  — and so prioritarianism is just egalitarianism with extra steps and inherits the
  same problem. I said that''s obviously wrong because you can weight benefits by
  a person''s own absolute level of well-being (how badly their life is going, full
  stop) without any comparison to anyone else, and that''s the whole point.


  So what I want from you:

  1. Compare the two views properly — what exactly is the priority view claiming,
  what exactly is the egalitarian claiming, and where do they actually come apart?
  Give me a concrete case where they give different verdicts.

  2. State the levelling-down objection in its strongest form and tell me honestly
  whether the priority view escapes it or not.

  3. Take Dan''s objection seriously. Is there a version of prioritarianism where
  the weight attached to a person''s benefit depends on how their level compares with
  other people''s rather than on their own absolute level? If so, does that version
  get hit by a levelling-down style objection, and does the non-comparative version
  escape? Which of us is defending which?

  4. Finally, tell me which of us is right, and what the strongest reply is for the
  one who loses.


  Use a small concrete example with three people to do the work — numbers if that
  helps. Don''t just tell me the standard story, I''ve read the standard story, I
