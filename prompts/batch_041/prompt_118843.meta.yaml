  a paralyzed cricket to its burrow, leaves it at the entrance, inspects the burrow,
  and, if the cricket is moved a few inches during the inspection, drags it back and
  begins the inspection again — apparently without limit. Dennett used this as a picture
  of behavior that looks thoughtful but is mindless; others have pushed back that
  the repetition may be adaptive rather than stupid, and that the whole example has
  been made to carry more philosophical weight than the ethology can bear. Take the
  pushback seriously: treat sphexishness as a matter of degree and of description
