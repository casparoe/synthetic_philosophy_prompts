  For the past few years I''ve taught a graduate seminar on the measurement problem,
  and in revising the Everett chapter of a book manuscript I find myself committed
  to a position I''d like to see stress-tested rather than merely defended. The position
  is this: the Everettian can and should derive the Born rule rather than postulate
  it — the decision-theoretic route inaugurated by Deutsch and extended by Wallace,
  on which the probabilities of quantum mechanics drop out of non-probabilistic axioms
  of quantum theory plus the representation-theoretic part of classical decision theory,
  applied to an agent who knows the branch structure but not which branch she occupies.
  I take this to show that Everettian quantum mechanics is not merely empirically
  adequate but genuinely probabilistic — that there is a fact about what a rational
  Everettian agent should expect — and that the familiar charge that many-worlds "has
  no place for probability" is answered. What I want from you is not a restatement
  of the standard objections ... but a map of what would count against the position,
  ranked by how decisive it would be.


