  performance, produces a second man exactly like him; one of the two ends up locked
  in a tank of water and drowns, and the survivor takes the applause. Alfred Borden
  turns out to have been living his entire public life as one half of a pair of identical
  twins, who alternate in the role and divide the private life between them, one loving
  Borden''s wife and the other his assistant. There is also the trick with the cage
  of canaries, in which a bird is killed and a child in the audience weeps because,
  as he says, he can tell that it was the bird''s brother that died.


  I want the paper to do two things at once. First, I want the film read as a Black
  universe populated by persons: Angier''s nightly duplication is a case of two things
  that seem to be indiscernible, and the question of what makes them two rather than
