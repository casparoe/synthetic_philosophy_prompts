  Background: Fitting-attitude analysis (FA) of value: x is good iff it is fitting
  / correct / appropriate to favor x (to value, desire, admire, etc.). The "wrong
  kind of reasons" problem: there can be reasons to have a pro-attitude toward something
  that don''t bear on its value. E.g., an evil demon threatens to torture you unless
  you admire him; that gives you a reason to admire him, but it doesn''t make him
  admirable — doesn''t make him valuable. So the FA analysis, if it says "x is good
  iff there are reasons to favor x," is too permissive; need to restrict to reasons
  "of the right kind." But then the analysis threatens to be circular or uninformative,
  since "the right kind of reasons" seems to be characterized as reasons that bear
  on the value of the object — which is the analysandum.


