  phi phenomenon is the empirical wedge: two dots of different colors flashed in sequence,
  subjects report a single dot moving and changing color midway, but the color change
  is reported as occurring before the second dot is presented. If reports are taken
  at face value, the brain seems to revise experience retrospectively; if not, it
  seems to construct the experience prospectively. The debate is whether the distinction
  between Orwellian and Stalinesque is experimentally or conceptually tractable.


