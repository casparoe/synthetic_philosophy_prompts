  turns on your recall of the literature. Two poles:


  Conciliationism (the ''equal weight'' view): if you discover that someone you regard
  as a genuine epistemic peer — roughly as intelligent, as well informed, and as free
  of bias as you, who has considered the same evidence — disagrees with you about
  some question, you must move your credence substantially toward theirs. You cannot
  stay put merely because you think your own reasoning is sound; your confidence that
  your reasoning is sound is exactly what the disagreement calls into question.


  Steadfastness: on the same discovery, you should re-examine your reasoning, but
  if on reflection you still find it sound, you may keep your view. The peer''s disagreement
  is one more item of evidence to weigh, and on many occasions it need not move you
  much.


  Between them sits a middle position — that the disagreement is itself higher-order
  evidence, whose weight depends on how well each of you reasoned — but the joke should
  be built on the two poles.


  Two wrinkles I''d like the joke to exploit, either one is fine:


  (a) Asymmetric surrender. The two views disagree about what to do about disagreement,
  so they can be aimed at the disagreement between themselves. A conciliationist who
