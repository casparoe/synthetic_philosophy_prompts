  S, drowning. L does not enter the water, and S drowns. S''s mother, M, is on the
  beach; she is not a lifeguard and does not enter the water either. A shark is absent
  from the water throughout. Using the normative-baseline account, explain why L''s
  omission is a cause of S''s death while M''s omission and the shark''s absence are
  not—or, if you prefer, why they are causes only in a weaker or derivative sense.
