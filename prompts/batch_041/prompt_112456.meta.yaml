  act that way in any event shows that responsibility depends on the actual sequence
  of events, not on the availability of alternatives. The second camp holds that such
  cases do not refute the principle, either because the agent in them still retains
  some alternative possibility, however thin, or because the counterfactual mechanism
  leaves its mark on the actual sequence in ways the first camp overlooks. (The two
  camps need not line up with the compatibilist and incompatibilist camps; if you
  think those labels obscure the issue here, say so rather than adopting them.)


  What I want is not a verdict on who is right but the document a good-faith adversarial
  collaboration between the two camps would produce. Three cases of my own construction
  should be its spine; treat them on their merits rather than looking for precedents.


  Case one. Nadia must decide whether to sign a statement that will end a colleague''s
  career. Unknown to her, a device in her chair would have intervened had her hesitation
  lasted longer than about half a second; it would have suppressed her memory of the
  reasons against signing, and she would then have signed. As things go, her hesitation
  is brief, the device does not trigger, its presence leaves no trace in the actual
  sequence, and she signs for her own reasons — though the brief hesitation does occur.


  Case two. As case one, except that the untriggered device is not causally inert:
  it leaves Nadia marginally more hurried, and this is part of the causal history
