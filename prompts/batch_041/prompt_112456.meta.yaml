  The adversarial collaboration type needs two opposing camps that have been arguing
  past each other. Best fits:


  1. Frankfurt cases: incompatibilist (who thinks PAP is required for moral responsibility)
  vs compatibilist... Actually the classic debate: Frankfurt cases are designed to
  refute PAP. Opposing camps: those who think Frankfurt cases succeed in refuting
  PAP (compatibilists like Frankfurt, Fischer) vs those who think they fail (Widerker,
  Kane — "flicker of freedom" defenders, or those who say the agent couldn''t have
  done otherwise in the relevant sense). Actually the more interesting "arguing past
  each other" is: defenders of PAP who accept Frankfurt cases but claim a "flicker
  of freedom" suffices vs those who deny that a mere flicker is enough. Or: those
  who think the debate is verbal — the "actual sequence" vs "alternative possibilities"
  framings.


  2. Russell''s theory of descriptions: Russellians vs Strawsonians (or vs Fregeans)
  on definite descriptions. Or Russellians vs Donnellan on referential use. Or Russell
  vs Strawson on presupposition and truth-value gaps. That''s a classic adversarial
  collaboration: Russellian (descriptions are quantificational, "The king of France
  is bald" is false) vs Strawsonian (presupposition failure, neither true nor false).
