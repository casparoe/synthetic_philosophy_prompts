  The verdicts type: asker gives intuitions on concrete cases, asks for a principle.
  Which domain best fits? Kripkenstein rule-following: cases where a speaker''s use
  of a term diverges — verdicts on whether they mean plus, quus, etc. Actually that''s
  a good fit: verdicts on when someone counts as following a rule / meaning something.
  Cases: a child who says "quaddition" for small numbers; a person who mispronounces;
  a person who uses "green" but is colorblind in some conditions; a person who says
  "table" only for tables with a specific property; a math student who gets 57+68
  wrong only in the high numbers; a person who follows a rule but can''t state it;
  a person following a rule for reasons of habit; a person who stops following a rule
  after 2020; an algorithm.


  Alternatively, luck egalitarianism: verdicts on cases — a person who gambles away
  money, a person born with expensive tastes, a person injured in a mugging, a person
  who takes risky jobs voluntarily, a surfer who chooses not to work, someone who
  is reckless. That''s a classic luck egalitarianism set of cases and it''s a strong
  fit for "report verdicts and ask what principle." And it''s more "in the weeds"?
  Luck egalitarianism cases are pretty standard (Dworkin''s expensive tastes, Anderson''s
  critique, Rakowski). The user wants in the weeds, not regurgitatable.


  Ant colony mind: verdicts on whether various collectives have minds — ant colony,
  beehive, a human corporation, a slime mold, the internet, a person with split-brain,
  a country. Interesting but might be a bit loose; still it''s fine as "verdicts on
  cases."


  Strange loops: verdicts on which systems have a self — a thermostat, a bacterium,
  a video feedback loop, a person with dissociative identity, an AI, a corporation,
  a mirror. Hmm.


