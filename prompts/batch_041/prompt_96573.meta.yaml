  I have written novels for twenty years, and I have come to be troubled by a contradiction
  in the way my profession speaks about the moral authority of what it makes. On one
  side, publishing is scrupulous about disclaiming assertion: every novel carries
  a notice to the effect that the persons and events are invented, that nothing in
  the book is offered as a claim about the actual world, and that no resemblance to
  real persons is intended. We say that fiction imagines rather than asserts, and
  that it is therefore not the sort of thing that can be true or false. On the other
  side, the same critics and the same authors who repeat this will praise a novel
  as true to life, as honest about human beings, as morally serious, and will condemn
  another as sentimental, as a lie, as false to the way people are; and we mean by
  this something more than that the book pleased or displeased us. When I have tried
  to make a character forgive a betrayal she would not forgive, I have felt the draft
  go dead in my hands, and I have said, and meant, that it was untrue.


