  — and, in particular, its metaethics. Does the way we praise and condemn moral vision
  in fiction presuppose that there are moral facts which a novel can get right or
  wrong, and if so, what kind of realism would that be? Can an anti-realist account
  of moral discourse — expressivist, error-theoretic, relativist, or constructivist
  — make sense of the same vocabulary, treating our verdicts on a novel''s honesty
  as reports of the attitudes it elicits rather than as claims about a moral reality
  the book has tracked or missed? And how does the no-assertion disclaimer sit with
  any of this: is the claim that fiction asserts nothing consistent with treating
