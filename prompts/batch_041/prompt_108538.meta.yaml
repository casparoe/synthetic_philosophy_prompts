  Parfit''s answer is that the machine is a way of travelling. He is a reductionist,
  which means he thinks there is no such thing as the self — no ghost in the machine,
  just a bundle of experiences — so the question of whether the Mars person is ''really''
  you is not a deep question with a hidden answer. There are no further facts beyond
  the physical and psychological ones, so once we know the Mars person has your memories,
  your plans and your personality, there is nothing left over to argue about. What
  matters in survival is what Parfit calls Relation R, which is memory continuity
  — the Mars person remembers your life from the inside, and that is all that survival
  could ever amount to. Identity in the strict sense is not what matters.


  The two-copy version is what really drives the point home. If the machine leaves
  you alive on Earth and also makes a copy on Mars, or makes two copies, then we can''t
  say both copies are you, because identity is one-to-one and you can''t be two people.
  But R holds to both of them, and it holds just as strongly as it would in the ordinary
  case, so if R is what matters then the branching doesn''t take anything away — it''s
  not a disaster, it just shows that the question ''which one is really me'' has no
  answer and doesn''t need one. This is why Parfit says identity is not what matters."


