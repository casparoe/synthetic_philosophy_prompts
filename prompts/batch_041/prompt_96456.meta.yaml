  of quiet work: the seminar uses it to license a substantive conclusion, that historians
  should import the rules of evidence wholesale — discount interested testimony, decline
  to decide on a single witness, read gaps in the record as an adverse inference,
  and withhold assent from anything that cannot be independently corroborated.


