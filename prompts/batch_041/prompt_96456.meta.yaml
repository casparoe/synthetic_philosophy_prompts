  correspondence explicitly, item by item, and then tell me where it fails, distinguishing
  the failures that matter for the conclusion the seminar wants to draw from the ones
  that are merely picturesque. I am particularly interested in four things. First,
  the analogy seems unstable about roles: at different moments the historian is cast
