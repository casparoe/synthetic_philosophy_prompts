  Fitch: KP = every truth is knowable (possibly known). Derivation: take p unknown.
  p ∧ ¬Kp is a truth. If knowable, possible that K(p ∧ ¬Kp) → possible Kp ∧ K¬Kp →
  possible K¬Kp → possible ¬Kp, contradicting Kp. So the truth p ∧ ¬Kp is not knowable,
  contradicting KP. Hence if all truths knowable, all truths known — which is absurd.


  Escape routes: (i) reject distribution of K over ∧; (ii) reject factivity; (iii)
  restrict KP to non-epistemic truths / to truths that can''t be "about knowledge";
  (iv) intuitionistic/paracomplete logic where the derivation is blocked; (v) restrict
  quantification to "cartesian" propositions (Dummett''s restriction to propositions
  that are not "anti-cartesian"); (vi) deny bivalence.


