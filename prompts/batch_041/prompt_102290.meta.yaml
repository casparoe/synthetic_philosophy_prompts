  Here''s the practice. A mid-sized contemporary art museum I work with has adopted
  what it calls a testimony-free label policy. The wall texts next to each work can
  give historical facts, materials, provenance, and neutral formal descriptions (''the
  canvas is divided into three vertical bands''), but they are not allowed to make
  evaluative claims. No ''this is a masterpiece,'' no ''the brushwork is exquisite,''
  no ''this is an important work.'' The audio guide is supposed to ask questions rather
  than assert aesthetic value. The idea is that visitors should judge for themselves,
  and that telling someone a work is good is somehow not a reason for them to believe
  it. But the same museum''s acquisition committee is basically a small group of experts
  whose say-so settles which works enter the collection, and the catalogue essays
  are full of evaluative claims -- ''this is the most significant painting of its
  decade'' and so on. The membership magazine runs lists like ''10 works you absolutely
  must see before you die.'' And the docents are trained to say things like ''most
  people find the late works more moving'' when they want visitors to spend more time
  in a room.


