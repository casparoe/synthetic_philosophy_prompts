  I cover science and ideas for a national magazine, and I sit on the standards and
  ethics committee of a nonprofit investigative newsroom. Next Thursday the committee
  votes on a proposed editorial standard that its drafters call "public knowability."
  As written, the standard says: no factual claim may appear in a published investigation
  unless a careful reader, using only the published story and the evidence package
  released with it, could in principle come to know that claim to be true. The committee
  must decide whether to adopt the standard as written, adopt it with a specified
  exception, or reject it.


  The case forcing the decision is concrete. Our environment desk has a story alleging
  that a prominent research group suppressed inconvenient data. Two of the most consequential
  facts in the story depend on a source who would be identifiable if we published
  the evidential chain that would let a reader verify those facts. The reporter is
  asking for an exception. The standard''s defenders say an exception would make the
  standard optional in exactly the hard cases it was written for. The reporter says
  a literal application would require us to suppress true and important claims.


  There is also a formal wrinkle. A colleague on the committee with a philosophy background
  says the proposed standard runs into the knowability paradox. Her reconstruction:
  if every truth is such that it can in principle be known by someone at some time,
  then every truth is in fact known by someone at some time. The argument is short:
  take an arbitrary truth that is not known; the conjunction of that truth with the
  fact that it is not known is itself a truth; if all truths are knowable, that conjunction
  is knowable; but knowledge of a conjunction entails knowledge of each conjunct,
  including knowledge that the first conjunct is not known, which contradicts the
  first conjunct''s being unknown. Since we all agree that some truths are never known,
  the universal premise cannot stand as stated. She says the policy therefore needs
  either a restricted scope -- perhaps only claims the newsroom actually publishes,
  or only claims about matters of public record -- or a distinction between what an
  ideal inquirer could know in principle and what our readers could know now. The
  chair thinks this is a philosophy-seminar detour; I think it goes to whether the
  standard is coherent enough to vote on.


  You are a philosopher of epistemology with practical experience in newsroom standards.
  Think carefully about the case before writing, and begin with a brief brainstorming
  section in which you lay out the competing considerations. Then draft the committee''s
  written opinion. It should recommend a concrete course of action -- adopt, reject,
  or adopt with specified exceptions -- and give the reasoning in a form the committee
  could debate and act on. It should engage the strongest objection to your recommendation,
  not caricature it, and it should say plainly what the losing side gets right. It
  should not merely restate the knowability paradox; it should show how the paradox
