  group suppressed data. Two of the strongest facts rest on a source who will be identifiable
  if we publish the chain of evidence that would let a reader verify those facts.
  The reporter wants an exception. The policy''s defenders say exceptions gut the
  standard; the reporter says the standard, applied literally, would force us to sit
  on true and important claims.


