  Domain: "Are dreams experiences? (Malcolm vs. Dennett)". The core: Norman Malcolm
  argued (in his 1959 book Dreaming) that dreams are not experiences — that "I dreamed
  that..." is not a report of an experience, and that it makes no sense to say dreams
  are experiences; the concept of dreaming is tied to the concept of waking report.
  Dennett (1976, "Are Dreams Experiences?") argued that dreams are experiences, but
  possibly not what we think — he suggests the "cassette" view: dreams are like a
  tape played during the night, or that the dream is not experienced in real time.
