  outcome intended. You hold that the doctrine''s real work is done by the condition
  that the bad effect must not be the means by which the good is secured, and that
  the proportionality clause is a further constraint rather than the whole story.
  You hold that the doctrine functions as a constraint on what may be chosen, not
