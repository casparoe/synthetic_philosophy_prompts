  I want to argue my way through something that has become personal. My father died
  in a hospice three weeks ago. The notes record that the morphine was increased on
  the Thursday evening for symptom control, with the risk of respiratory depression
  acknowledged; the doctor on call told me afterwards that everyone in the room understood
  the increase might be the last thing that happened to him, and nobody thought that
  was a reason not to do it. I have no complaint about the care — it was excellent,
  and I would have wanted the same again. What unsettles me is the justification I
  was given when I asked: that the intention was to relieve his suffering and the
  shortening of his life was foreseen but not intended. I have spent my adult life
  as a fairly unreflective consequentialist about medical decisions, and I had assumed
  the doctrine of double effect was the kind of thing that dissolves once you look
  at it properly. I would now like to test that assumption against someone who can
  actually defend the doctrine, because I suspect I have only ever met weak versions
  of it.


  So: please play a committed and philosophically serious defender of the doctrine
  of double effect — the strongest version available, not a caricature, and not a
  figure who softens under pressure. [Then specify the character.]


