  Let me draft:


  (1) Anekāntavāda holds that reality is many-sided and that any unqualified assertion
  about a complex object is at best partially true; every assertion is to be qualified
  by a standpoint (naya) or by "syāt."

  (2) So for any assertion p, there is a standpoint from which p is true and (typically)
  a standpoint from which not-p is true.

  (3) If p and not-p are each true from some standpoint, then a standpoint is just
  a perspective, and no standpoint has a claim to correctness beyond being occupied.

  (4) If no standpoint is more correct than another, then the claim "every assertion
  is only partially true" is itself only partially true — true from the anekāntavādin''s
  standpoint, false from the standpoint of someone who holds that some assertions
  are simply true.

  (5) In that case anekāntavāda cannot be asserted as the correct account of truth;
  it can only be asserted as one view among others, no better than its rivals.

  (6) But the Jains do not treat it as one view among others: they treat it as the
  correct account, vindicated by omniscient knowledge (kevala-jñāna), and they use
  it to criticize ekānta (one-sided) views as errors.

