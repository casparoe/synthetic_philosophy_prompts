  "I have been trying to formulate a position I call evidential cooperation in large
  worlds, and I would like you to act as a philosopher of decision theory and formal
  epistemology to map its exposure. The position is this: in a sufficiently large
  world -- one with many agents, many of whom are in situations relevantly similar
  to mine and whose reasoning is correlated with mine -- I should treat my choice
  in a one-shot prisoner''s dilemma as evidence about what those other agents will
  choose. If I cooperate, that raises my credence that they cooperate; if I defect,
  it raises my credence that they defect. Because my payoff depends on their choices,
  and because the evidential correlation is not merely causal, the evidential expected
  value of cooperating can exceed that of defecting even when there is no causal channel
  between us. More generally, the view says that the right decision theory for large
  worlds is one that treats logical and evidential correlations between agents as
  grounds for cooperation, not merely causal influence. I am not asking for a bibliography
  or a reading list; I want the philosophical case against the view, developed from
  the inside."


