  Strawson teaching for non-specialists: The key dependency order:

  1. Start not with determinism but with the practice of holding responsible / resentment
  and gratitude as responses to *attitudes* (goodwill, ill will, indifference) rather
  than to actions or to causal histories.

  2. The demand: we make demands on each other for goodwill and respect; reactive
  attitudes are responses to whether those demands are met or flouted.

  3. The "objective attitude": the stance of managing, treating someone as a subject
  to be handled — and its legitimate occasions (children, the insane, the "diminished"
  agent) and the fact that it''s not always cold or hostile.

  4. Excuses vs. exemptions: Strawson''s distinction between "he didn''t mean it /
  he was pushed / he didn''t know" (excuses, which operate *within* the participant
  stance) and "he''s not a full moral agent / he''s incapable of goodwill" (exemptions,
  which suspend it).

  5. Only then: the determinism question. And the point that the truth of determinism,
  if it doesn''t show that we''re all exempt (like the insane), can''t by itself undermine
  the practice; and that we can''t take the objective attitude toward everyone without
  cost (the "pessimism" — life without resentment would lose a lot; the "optimism"
  — maybe it wouldn''t).

  6. Also: the "self-reactive attitudes" (guilt, shame, remorse) and the "vicarious"
  ones (indignation, the attitudes of the offended party on behalf of others) — these
  matter for the second half of the essay.


