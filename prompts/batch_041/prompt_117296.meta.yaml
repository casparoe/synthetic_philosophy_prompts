  The prompt:


  Daniel Keyes''s Flowers for Algernon — both the original novelette and the expanded
  novel — tells the story of Charlie Gordon, a man with an intellectual disability
  who becomes the first human subject in an experiment to increase intelligence, and
  who eventually regresses to something like his original state. Read the book through
  the lens of Daniel Dennett''s fourfold taxonomy of minds: Darwinian creatures, which
  are wired by natural selection and behave according to fixed instincts; Skinnerian
  creatures, which can learn by reinforcement and trial and error, letting the environment
  shape them; Popperian creatures, which can simulate possibilities internally and
  let their hypotheses die in their stead; and Gregorian creatures, which are Popperian
  creatures equipped with mind-tools acquired from culture, language being the master
  tool. I want a reading that takes both the novel and the taxonomy seriously, and
  that is honest about where the novel resists the philosophical frame.


  Some questions to press on. Does Charlie''s arc track the four stages, or does the
  surgery simply accelerate a transition that in ordinary development depends on language
  and cultural scaffolding? When Charlie begins to read and to write, and when his
  progress reports become more complex, is he acquiring the tools that make a Gregorian
  creature, or is he merely becoming a better Skinnerian? What does the regression
  show about the status of the Gregorian mind — is it a stable level of cognitive
  architecture, or a fragile set of external supports that can be stripped away? The
  novel is told entirely through Charlie''s own progress reports, which are themselves
  a cultural artifact; does the form of the novel dramatize Dennett''s point that
  the mind is not just in the head, or does it undercut it by making the written record
  the only thing that survives the regression? And what should we make of Algernon,
  the mouse who undergoes the same surgery and whose decline precedes Charlie''s?
  Does the mouse show that the hierarchy is not species-specific, or does it expose
  a tension in the taxonomy — that a creature can be Popperian or Gregorian in some
  respects while remaining a mouse in others?


  I am teaching this to a class that has read Dennett''s account, and I want to use
  the novel without flattening either it or the philosophy. So please give me a reading
  that says where the taxonomy illuminates a scene or a choice, where the novel complicates
