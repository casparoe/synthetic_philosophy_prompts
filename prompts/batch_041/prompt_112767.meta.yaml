  Prompt:


  Write an essay on the controversy over presentism in historiography: whether historians
  can escape the standards of their own time. The essay should weigh the case for
  inescapability against the case for the possibility of critical distance, and it
  should end with a defended verdict rather than a survey of positions.


  Before arguing, separate the several claims that "historians cannot escape the standards
  of their own time" might be making. At least these are worth distinguishing: (a)
  that historians inevitably select, frame, and emphasize the past according to the
  concerns of their own present, so that no selection is neutral; (b) that historians
  inevitably judge past agents by the moral and political standards current in the
  historian''s own time, so that moral anachronism is unavoidable; (c) that historians
  can only apply the standards of evidence, argument, and explanation available in
  their own intellectual milieu, so that a historian is epistemically confined to
  their era; (d) that there is no trans-historical standpoint from which any set of
  standards could be certified as correct, so that "the standards of their own time"
  is all anyone ever has.


  Then address the strongest arguments on each side. For inescapability: the historian
  works with a language, a conceptual vocabulary, and a set of disciplinary norms
  that they did not choose and cannot fully inspect; the very act of asking a question
  of the past imports present categories. For escape: the discipline''s techniques
  — source criticism, attention to actors'' own categories, comparative history, the
  deliberate recovery of alien conceptual schemes — seem designed precisely to loosen
  the present''s grip; and the historian can hold their own standards up for criticism,
  which suggests the standards are revisable rather than confining.


  Finally, consider whether the inescapability thesis is self-undermining: the claim
  that standards are always historically local is itself advanced as something more
  than a local preference. Does that reflexive problem refute the thesis, show that
  it is trivially true, or point to a distinction between being caused by one''s time
  and being justified by it?


  Defend a conclusion about which of (a)–(d), if any, is both true and philosophically
  interesting, and about whether the phrase "the standards of their own time" obscures
  more than it reveals. Do not end on a non-committal note.


