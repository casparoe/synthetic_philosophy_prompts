  Carroll''s tortoise: A popular summary might say:


  "Lewis Carroll''s paradox of the tortoise and Achilles is a proof that deduction
  can never justify its conclusions. The tortoise points out that whenever you infer
  from ''p'' and ''if p then q'' to ''q'', you''re relying on modus ponens, and modus
  ponens itself is a further premise — ''if p and if p then q, then q'' — which needs
  its own justification, and so on forever. So any deductive inference presupposes
  infinitely many premises, which is impossible, and that''s why logic can''t give
  us knowledge: we always need to accept at least some rules without proof, so deduction
  is ultimately a matter of faith/irrational. Also this is why Quine said..." Hmm.


  Subtle errors to embed:

  1. Calling it a "paradox" in the sense of a contradiction in logic, when it''s a
  regress argument about the relation between rules and premises — Carroll''s piece
  is a dialogue, not a proof that deduction is unjustified; the tortoise isn''t shown
  to be right (Carroll doesn''t endorse a conclusion; the dialogue just ends with
  the tortoise still refusing).

  2. The claim that the tortoise "shows that modus ponens is invalid" or "that logic
  is circular" — conflation of rule and premise (the tortoise''s trick is precisely
  to treat a rule of inference as a premise, which is what the regress exploits; many
  philosophers (Ryle, Dummett, Boghossian) argue that the demand for a justification
  of inference is illegitimate — that inference isn''t a further propositional belief).

  3. The claim that the regress proves deduction rests on "faith" — this is a further
  step (a philosophical moral, contested), not something Carroll established.

  4. A possible error: saying Carroll''s point is about induction vs deduction, or
  that it "shows you can''t learn anything new by deduction" (that''s the analytic/synthetic
  issue, not Carroll''s).

  5. Another error: the tortoise refuses to accept the conclusion because he demands
  a justification for modus ponens, and the summary might say the tortoise accepts
  the premises but "denies the conditional" — no, the tortoise accepts the conditional,
  and accepts each additional conditional as you add it; the point is he won''t detach.


  Also there''s the "tortoise is being unreasonable" vs "the tortoise has a point"
  debate: Ryle''s "if-then" is not a premise but a "license/inference ticket"; Dummett''s
  "the tortoise is right that the transition is not itself a propositional step";
  the debate about whether accepting a rule is a matter of practice (Wittgenstein).
  And the difference between "the tortoise''s refusal" being a genuine epistemic possibility
  vs a mere logical possibility. Also Carroll''s target might be read as targeting
  the "logistic" thesis that reasoning is a matter of manipulating uninterpreted symbols
  (Carroll''s own logical writings vs. the paradox).


