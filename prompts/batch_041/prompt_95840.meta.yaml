  I have an argument I assembled for a reading group on induction, and I have stopped
  trusting my own handling of it. The setting is deliberately small so that nothing
  hidden is doing the work.


  The game: nature produces an infinite binary sequence, one bit at a time. A strategy
  is any function from finite binary strings to {0,1}: told the bits so far, it names
  the next bit. There are no computational limits, no costs, and the strategy may
  be arbitrarily complicated. Let U be the distribution under which each bit is an
  independent fair coin toss. Then:


  (1) For every strategy s and every n, the expected number of correct predictions
  s makes among the first n bits, under U, is exactly n/2. [And this is a two-line
  calculation, not a deep theorem: for each history h, exactly half of the completions
  of h continue with 0 and half with 1, so whatever s says at h, its chance of being
  right at that point is 1/2.]


  (2) So under U no strategy outperforms any other — not even the constant strategy
  that always says 0.


  (3) So there is no strategy that is more accurate than any other, and the apparent
  superiority of methods that extrapolate regularities — projecting a trend, fitting
  a curve, trusting a physical law — is not a fact about those methods.


  (4) What separates a method that succeeds from one that fails is therefore the cooperation
  of the world and nothing else. A method''s track record records the world''s cooperation,
  not the method''s merit.


  (5) And the only thing that could justify an inductive method is its track record
  — its having worked so far.


  (6) Therefore no inductive method is justified. And by (2), none is preferable to
