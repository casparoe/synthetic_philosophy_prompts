  Let me draft the summary carefully, embedding subtle errors:


  Book/revision guide summary (fabricated):


  "Grice''s big idea is that we often mean more than we say. When someone says ''It''s
  a bit cold in here'' and you get up and shut the window, Grice says the speaker
  has implicated ''shut the window''. This works because language has rules: be truthful,
  be relevant, be clear, don''t say too much or too little. When a speaker breaks
  one of these rules, the listener assumes they''ve done it on purpose and works out
  what they really meant. Grice calls these hidden meanings implicatures, and he thinks
  they''re a bit unreliable, because they depend on the context and can always be
  cancelled — if the speaker adds ''not that I want you to do anything about it'',
  the implicature disappears. The other thing Grice is famous for is saying that what
  a word means is just what speakers of the language agree it means, so meaning is
  a social convention, and implicature is what''s left over when the conventions run
  out. This is why you can never be caught out lying if you only implicate something
  false: the lie isn''t in what you said, so strictly speaking you haven''t said anything
  untrue."


  Subtle errors here:

  1. "When a speaker breaks one of these rules" — conflates flouting (overtly exploiting,
  which generates implicature) with violating (covertly breaking, which is deceptive
  and doesn''t generate implicature). Also the maxims are sub-maxims of the CP and
  the hearer assumes the speaker is observing the CP, not that they''re breaking rules.

  2. "he thinks they''re a bit unreliable, because they depend on the context and
  can always be cancelled" — cancellability is a diagnostic feature, not unreliability;
  and Grice thought implicatures are calculable, i.e., rationally recoverable. Cancellability
  ≠ unpredictability.

  3. "what a word means is just what speakers of the language agree it means, so meaning
  is a social convention" — Grice''s analysis of non-natural meaning is intention-based,
  not agreement/convention-based (his account of speaker meaning is about the speaker''s
  intention to produce an effect via recognition of that intention). This is the big
  subtle inversion.

  4. "you can never be caught out lying if you only implicate something false" — Grice''s
  own notion of "making as if to say" and the distinction between saying and implicating:
  Grice held that a speaker who conversationally implicates something false hasn''t
  lied (his example: the reference letter writer) but has misled; but the summary''s
  "you can never be caught out" overstates: there are legal and moral notions of misleading,
  and Grice''s point is about the distinction, not an immunity. Also Grice does distinguish
  "saying" from "making as if to say" and notes the letter-writer case is not a lie
  but a misleading. So the claim "you can''t be caught out" is an overstatement of
  Grice''s modest point.

  5. "don''t say too much or too little" is the maxim of quantity — fine. "be clear"
  is manner — fine. "be truthful" quality — fine. "be relevant" relation — fine. Missing:
  the maxims are not moral rules; the CP is a presumption of rational cooperation,
  not an ethical demand. The summary says "language has rules" which conflates linguistic/social
  rules with the CP. Maybe also have the summary say "Grice thought it''s basically
  immoral to be uncooperative" — that''s a howler-ish; keep it subtle: "so the maxims
  are really rules of good manners".

  6. "Grice''s big idea is that we often mean more than we say" — roughly right, though
