  Great, this is rich. So the desiderata list can include:


  1. Fidelity to the theorems: state the exact hypotheses (consistency/soundness,
  effective axiomatizability, sufficient strength to express arithmetic), and note
  that the theorem yields a true-but-unprovable sentence only under soundness (or
  an undecidable one under consistency, per Rosser). Any argument must not use the
  theorem as "there are truths no machine can prove, full stop."

  2. The surveyability requirement: the argument needs a specific machine M whose
  consistency/soundness the human can recognize. For any M the human can survey, the
  human can (if sound) do better. But this must be turned into a conclusion about
  all machines, including non-surveyable ones — including the machine (if any) that
  is the human''s own cognitive system.

  3. The self-application requirement (the fixed-point problem): the argument must
  apply to the machine that the mind might itself be, and it must avoid circularity:
  to see G_{M*} the mind must know M* is consistent; by Gödel''s second theorem M*
  can''t prove its own consistency, and the argument can''t just assume the mind has
  a faculty for recognizing its own soundness — that assumption would need independent
  support, and is arguably stronger than the conclusion.

  4. The consistency requirement and its cost: if the mind is inconsistent, it can
  prove anything (including G), so the argument needs the mind to be consistent/sound;
  but our mathematical beliefs are not obviously consistent (we may hold contradictory
  beliefs), and if the argument relies on our knowing our own soundness, it assumes
  what it must prove. Feferman''s disjunction: either the mind is not a machine, or
  it is an inconsistent machine that proves everything — and the second horn can''t
  be dismissed by fiat.

  5. The idealization requirement: the human mathematician must be idealized (no memory
  limits, no errors, closed under deduction, immortal) for "the human can prove G_M"
  to be a claim with content; but the idealization must not smuggle in a non-algorithmic
  faculty, and the mechanist will say the idealized entity is either a machine (hence
  subject to the theorem) or an ideal object whose relation to actual human minds
  is unexplained. The argument must state the idealization explicitly and defend it.

  6. The non-equivocation requirement: "the human can prove something M can''t" must
  not be traded for "the human can prove something no machine can." The first is compatible
  with mechanism (the human is a different, stronger machine). The argument must block
  the move "for every machine M, the mind ≠ M, but the mind is some machine M*" —
  e.g., by arguing the mind can outrun every machine, including ones it can''t survey.

  7. The computability-vs-recursive-enumerability requirement: must distinguish "the
  mind is not any single Turing machine" from "the mind''s belief set is not recursively
  enumerable" from "the mind is not computable by any finite physical device" from
  "the mind''s operations are not algorithmic." These come apart, and only the strongest
  is the anti-mechanist conclusion; the argument must say which it establishes. (Penrose''s
  oracle-machine replies and the objection that open-endedness only shows non-axiomatizability,
  not non-computability.)

  8. The open-endedness / iterative-step requirement: if the mind''s advantage is
  that it can always step back and see the G of any system it can grasp, the argument
  must address whether that iterative capacity is itself computable — the sequence
  of theories of increasing strength is a well-defined hierarchy (Turing jumps), and
  a machine with an oracle (or a machine that enumerates the hierarchy) may capture
  it. So the argument must show the iteration is not itself algorithmic, not merely
  that no single finite axiom system captures it.

  9. The "not prove too much" requirement: the same form of argument must not show
  that no machine can do arithmetic, or that no machine can prove theorems; and it
  must be consistent with the existence of theorem provers and with the fact that
  adding G as an axiom is a legitimate, mechanical move. The argument must locate
  the mind''s alleged advantage precisely, without denying obvious facts about what
  computers can do.

  10. The soundness-of-the-mind requirement vs. the reality of error: must explain
  how fallible, error-prone mathematicians "see" the truth of G, and how the idealization
  handles the fact that we often believe false things; if we can be wrong about G_M,
  the argument''s claim that "we can see G_M is true" needs a notion of correctness
  for our seeing that doesn''t require us to be machines or oracles.

  11. The "what is a machine" requirement: the conclusion''s content depends on the
  notion of machine in play (Turing machine, any physically realizable finite-state-plus-tape
  device, any system whose behavior is computable, any formal system). The argument
  must fix this and show the conclusion applies to the notion that matters (e.g.,
  "the brain is a computer" in the relevant sense).

  12. The empirical/verification requirement: the argument must be an a priori argument
  (it is), so it must not depend on contingent facts about brains; but then it must
  explain why it can''t be undermined by the mechanist''s own a priori considerations;
  and it must be consistent with whatever we know about the brain.

  13. The non-question-begging requirement: no premise that assumes the mind has access
  to a notion of truth/proof not capturable by any formal system, or that assumes
  the mind can do something no machine can — that''s the conclusion.

  14. The determinacy requirement: to compare the mind''s theorem set with M''s, the
  mind''s mathematical beliefs must constitute a determinate set (or a determinate
  disposition); but the mind''s beliefs are open-ended, revisable, and time-bound,
  so the comparison may be ill-defined. The argument must say how the comparison is
  well-defined without turning the mind into a formal system.

  15. The metatheory requirement: the argument must be consistent with the fact that
  the reasoning by which we establish G''s truth is itself a piece of mathematics
  that can be formalized in a stronger system — so "we can see it" doesn''t mark a
  non-mathematical, non-formalizable faculty; the same reasoning is available to a
  machine working in a stronger system.


