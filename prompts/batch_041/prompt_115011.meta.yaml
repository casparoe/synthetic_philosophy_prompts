  Standard objections (which the desiderata should incorporate as constraints):

  1. The consistency assumption: we can only "see" G_M if we know M is consistent;
  and by Gödel''s second theorem, M can''t prove its own consistency — but neither
  can we (for systems strong enough). The Lucas reply: we can know we''re consistent,
  or at least the argument can be run with soundness... Actually Lucas claims we can
  know we''re consistent by informal means. Penrose claims we can know our own soundness.
  Objection: our mathematical beliefs are not guaranteed consistent; we might be inconsistent,
  in which case we''d prove everything.

  2. The idealization problem: the human mind is finite, fallible, and not closed
  under deduction — we can''t actually derive all consequences of what we believe.
  So "the human can prove G_M" is a claim about an idealized mathematician; but the
  idealization must be careful: if we idealize the human as a sound formal system,
  the argument collapses because the idealized human is a machine and also can''t
  prove its own G. So there''s a tension: idealize enough for the argument to run,
  and you''ve idealized into a machine; idealize too little and the argument doesn''t
  get off the ground.

