  Readings of "lying is always wrong":

  1. Act-deontological absolutism: every act that is a lie is impermissible, no exceptions,
  regardless of consequences.

  2. Definitional reading: what makes an act a lie is the intent to deceive, so a
  "lie" that''s really a concealment isn''t a lie (so the slogan becomes nearly vacuous
  or shifts the work to the definition).

  3. Rule-utilitarian/rule-consequentialist: a rule against lying maximizes welfare;
  exceptions undermine the practice.

  4. Virtue/character reading: lying corrupts the liar''s soul; wrongness is agent-relative
  (Augustine''s "lying harms the liar" theme).

  5. Prudential/proverbial reading ("honesty is the best policy"): lies tend to be
  found out; a pragmatic claim.

  6. Speech-act reading: lying misuses the faculty of speech, which is ordered to
  truth (Augustine''s teleological argument in De Mendacio / Contra Mendacium — speech
  is given for communicating truth, so lying is a misuse). That''s the actual Augustinian
  argument and it''s teleological.


  Verdicts: (5) is empirical and often false as a universal; (1) is what the slogan
  literally says but is very hard to defend; (6) is Augustine''s real argument and
  interestingly doesn''t depend on consequences, and it faces the "what about the
  murderer at the door?" objection which Augustine answers by the conceal-without-lying
  move, which requires (2) — and (2) is doing the heavy lifting; (4) is the deepest
  but hardest to make precise.


