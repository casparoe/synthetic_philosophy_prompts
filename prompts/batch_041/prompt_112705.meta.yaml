  "So my metaphysics seminar just did the identity of indiscernibles — the two iron
  spheres in an empty universe, one the mirror image of the other, and the question
  whether that''s one situation or two, and whether the spheres are really distinct
  if nothing tells them apart. Fine, whatever. The thing is, it''s completely ruined
  a thing my friend Dan says, and now I can''t stop hearing it. Every time something
  comes up he says ''no two things are exactly alike'' — snowflakes, fingerprints,
  twins, and last week he used it to close down an argument about whether two people
  can ever have the same experience: he said no two things are exactly alike, so no
  two people ever have the same experience, so you can never really know what I mean
  when I say something looks red to me. I told him that''s the identity of indiscernibles
  and he looked at me like I''d made it up, and honestly I couldn''t explain why it''s
  not just obviously true. Because it does sound like a platitude. But in class it
  was treated as a serious, contestable principle, and the two spheres were supposed
  to be the counterexample.


  Can you lay out the different precise claims ''no two things are exactly alike''
  could be making, from the trivial to the radical, and say for each whether it''s
  true, false, or just trivially true, and whether it''s actually a version of the
  identity of indiscernibles at all? I want to see the menu — I think some of the
  readings are things nobody would deny (any two things are at different places, or
  stand in different relations), some are the real metaphysical principle, and some
  are stronger than anything Dan needs or could defend. And I want to know which reading
  he actually needs for the conclusion about red experiences, and whether that reading
  is one of the true ones. Also, what should I say about the two spheres — is the
