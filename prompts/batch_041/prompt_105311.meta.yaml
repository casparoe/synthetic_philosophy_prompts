  "I am a high school student preparing a presentation for my school''s philosophy
  club, and I have been trying to understand the knowability paradox without relying
  on any secondary literature. The argument I have reconstructed is this: suppose
  that every truth is knowable. Now consider some truth that is never actually known
  — call it p — and form the conjunction ''p and no one ever knows that p.'' If that
  conjunction is knowable, then there is a possible situation in which someone knows
  both that p and that no one ever knows that p. But if someone knows that no one
  ever knows that p, then in that situation p is not known; and if someone knows that
  p, then p is known. That looks like a contradiction, so it seems to follow that
  not every truth is knowable; indeed, if every truth is knowable, then every truth
  is known. A friend in the club says this is just a trick: the proof only works because
  we are letting one person''s knowledge of a conjunction count as knowledge of each
  conjunct, and because we are treating ''knowable'' as ''could be known by someone
  at some time'' rather than something more restricted. Another friend says the real
  issue is that the argument shows only that there cannot be an unknown truth if all
  truths are knowable, which is a reductio of the anti-realist''s knowability principle
  rather than a proof of omniscience. I would like a clear explanation of what is
  actually going on conceptually."


