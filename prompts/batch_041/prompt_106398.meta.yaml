  Let me design for Frege:


  Position: "I''ve become convinced that Frege''s solution to the puzzle about identity
  statements is correct and, more strongly, that it is the only one that respects
  the data: ''a = b'' can be informative while ''a = a'' cannot, and this can only
  be because the two names express different senses that determine the same referent.
  So I hold (1) senses are objective and shareable, (2) sense determines reference,
  (3) cognitive significance is a matter of sense. What would count against this?"


  Defeaters to rank:

  1. Kripke''s modal/epistemic arguments against descriptive senses — they show senses
  can''t be descriptive contents that fix reference a priori, so if sense determines
  reference, sense must be something else; if it''s not descriptive, the Fregean has
  to say what it is, and if it''s just "the way the referent is presented," then either
  it''s the referent itself (collapsing into Millianism) or it''s a psychological
  state (losing objectivity/shareability).

  2. The "no backward road" problem: nothing determines which sense goes with which
  name except the requirement to explain cognitive significance, making the theory
  unfalsifiable/underconstrained.

  3. Millian/pragmatic explanations of cognitive significance that don''t need senses
  (Salmon, Soames): the data is about what a *speaker believes/grasps*, not about
  the proposition expressed. If those work, Frege''s semantic apparatus is unmotivated.

  4. Frege''s own problem: the informativeness of "a = a" when one knows both senses
  are senses of the same thing; and the regress/hierarchy of senses for belief reports.

  5. Cases: negative existentials, empty names, "the ancients'' belief that Hesperus
  is the morning star," indexicals, the Paderewski case.

  6. A formal result: if sense determines reference and sense is individuated by cognitive
  role, then sense is not compositional / the theory can''t be a compositional semantics.

  7. The "necessary a posteriori" and "contingent a priori" cases (Kripke): if Frege
  is right, "Hesperus is Phosphorus" is knowable a priori by anyone who grasps the
  senses; but it isn''t.


