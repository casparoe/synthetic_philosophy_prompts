  ---


  I''m preparing a position statement on biological function for a philosophy of biology
  seminar and would like a consistency audit before I present it. Here is what I hold:


  1. A trait''s function is what it was selected for; the right selection history
  is both necessary and sufficient for a trait to have a function at all.

  2. Function ascriptions are normative: to say that the heart''s function is to pump
  blood is to commit oneself to a heart that fails to pump being dysfunctional, and
  that dysfunction is a fact about the organism rather than about our explanatory
  interests.

  3. There is no irreducible teleology in biology, so whatever normativity (2) has
  must be naturalized; I have always assumed (1) is what does the naturalizing.

  4. Physiology and medicine ascribe functions by causal contribution to a capacity
  -- the enzyme''s function is to catalyze this reaction -- and those ascriptions
  do not depend on selection history.

  5. What counts as the system whose function is in question, and as the capacity
  it has, is fixed by the inquirer''s explanatory project, so function ascriptions
  are interest-relative.

  6. A synthetic gene circuit inserted into a bacterium that reliably produces a useful
  metabolite has a function in that bacterium, and malfunctions when it stops working,
  even though nothing in that lineage was ever selected for producing it.


  Which of these conflict, which only look like they do, and what is the cheapest
  way to restore consistency? Rank the conflicts by severity, say for each what exactly
  would have to give, and tell me whether a single revision would clean up the most.


