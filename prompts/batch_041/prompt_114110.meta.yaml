  Reflection principle (van Fraassen): P_t(A | P_{t''}(A) = x) = x, for t < t''. Intuitively:
  your current credence should be your expectation of your future credence, provided
  you expect your future self to be at least as well-informed and rational. It''s
  a diachronic consistency requirement; it''s also motivated by "the value of information"
  (your credence is a martingale under your own expectations).


