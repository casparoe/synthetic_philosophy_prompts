  Defeaters to ask about:

  - Cases where you rationally expect your future self to be epistemically worse (forgetting,
  fatigue, manipulation, self-serving bias, a drug, grief, aging). If the principle
  only applies when you expect improvement, does the restriction make it circular
  or nearly empty?

  - The "deliberation" worry: if you know that thinking harder will change your mind,
  Reflection requires you to change now, which seems to make deliberation pointless
  or to make you "jump to the conclusion" in advance. But if you don''t know in advance
  which way it''ll go, you can''t jump. So does the principle require anything determinate
  in that case? (This is the "no determinate guidance" objection.)

  - Self-fulfilling/self-undermining credences: cases where your credence is itself
  evidence (e.g., predicting your own behavior, the "exam score" case — your confidence
  about a grade being affected by your confidence?). Hmm, the "Sleeping Beauty" and
  "self-locating" cases.

