  a stronger form than most people who mention it intend. As I understand it, the
  principle says that my present degree of confidence in any claim ought to equal
  my best guess about how confident I will be in that claim later, once I have thought
  about it more, as long as I expect my later self to be at least as rational and
  at least as well informed as I am now. I have been treating this not merely as a
  consistency requirement but as the source of whatever authority my present opinions
  have: on my version, an opinion I have good reason to think I would abandon after
  further honest inquiry is not something I am entitled to hold now, and the only
  opinions worth having are the ones that would survive that process. I would like
  you to tell me what would count against this.


  I am not looking for a bibliography, and I would rather not be given a list of names
  to look up, since I am trying to work out what I think rather than assemble other
  people''s views. What I want is the actual material: the cases, arguments, and formal
  results that should move me, sorted by how decisive they would be, with the ones
