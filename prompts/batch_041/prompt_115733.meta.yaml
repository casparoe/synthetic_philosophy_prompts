  Prompt draft (extended mind):


  "I''m putting together a short story for a reading group that has been arguing about
  the extended mind thesis — the claim that some of what goes on outside the skull
  can count as part of a person''s cognitive system, so that a notebook or a phone
  can be part of what remembers, not merely a tool that memory uses. The reading group
  keeps circling the same puzzle: what exactly separates a resource that is part of
  my mind from a resource that is merely handy? Availability, reliability, automatic
  trust, how the thing was set up — everyone agrees these matter and nobody agrees
  on which is doing the work.


  I want a story that puts pressure on the part of the question that the standard
  examples leave alone. Here''s my seed, and I''d like you to build the story on it:
  a woman in her sixties, call her anything you like, has kept a memory ledger since
  her teens — a thick book in which every significant event of her life has been entered.
  She has never written in it herself. Her mother began it when she was a child, and
  for the last twenty years a paid scribe has kept it: at the end of each week she
  recounts her week and the scribe writes it down, sometimes pruning, sometimes quietly
  correcting her dates and her versions of events, sometimes entering things she mentions
  in passing and doesn''t think of as significant. She consults the book daily, believes
  what it says without checking, and would be lost without it. The plot turns on this:
  is the ledger part of her mind, and if so, whose? It was never hers alone — her
  mother''s hand is in the first hundred pages, the scribe''s in the rest, and the
  scribe''s corrections have been shaping what she takes herself to remember for two
  decades. Make the story''s crisis turn on the difference between two ways of answering
  that question: a functional answer (it does the work of memory for her, so it is
  her memory) and a genetic or authorial answer (a memory is something she laid down
  herself, so what the scribe has been writing is not her memory but a story about
  her that she has been living inside). Neither side should be a straw man.


  Some constraints: no character may name a philosopher or a theory; the philosophical
  question must be enacted in events — a scene where someone reads the ledger aloud
  and it changes what she takes herself to have done; a scene where the scribe''s
  pruning is discovered; a scene where two people who love her disagree about whether
  destroying the book would be an act of mercy or of killing. Don''t end with a verdict
  on the thesis, and don''t end with an ambiguous ''we can never know'' shrug either
  — end with a concrete choice that only makes sense if one of the two answers is
  right, and leave the reader to notice that.


  Length: about 1,800-2,500 words. Contemporary setting, no science fiction technology;
  the only piece of apparatus in the story should be a paper book and the habits around
  it. Keep the prose plain."


