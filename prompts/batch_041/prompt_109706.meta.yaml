  "Having spent the better part of four decades designing controlled experiments in
  physiology, I have lately been sitting in on philosophy seminars, and I find myself
  repeatedly frustrated by the mental causation literature. Before I invest more time
  in any particular proposal—whether it treats mental states as causes, as supervenient
  differences, as structural features of a system, or as something else—I want a clear
  specification of what such a theory would have to accomplish. Please write me the
  desiderata for an adequate theory of mental causation, with the consideration or
  case behind each requirement, and with your judgment about which requirements are
  negotiable and which are not."


  Then elaborate with specific demands:


  - It must accommodate the apparent efficacy of such things as a decision to raise
  one''s arm, while not contradicting the causal closure of physics or the completeness
  of physical explanation.

  - It must respect the distinction between a mental event causing a physical event
  and merely accompanying it, and the distinction between a property being causally
  relevant and its physical realizer doing all the work.

  - It must handle multiple realizability, supervenience, and the possibility of causal
  overdetermination/preemption.

  - It must say whether mental causation is a relation among events, properties, or
  facts.

  - It must be testable / not make mental causation epiphenomenal.


  Then a custom case: "Consider a case I have been using to organize my own thoughts:
  an experienced surgeon is about to make an incision. Her conscious decision to proceed
  occurs at t; the incision follows at t+1. A recording electrode shows that, had
  she not so decided, a calibrated pulse of stimulation would have produced the same
  incision at t+1; in the actual sequence the stimulation is absent. The theory must
  tell me whether the decision caused the incision, whether it merely failed to be
  preempted, and what difference it makes to the physical outcome." This is a nice
  preemption case. It forces desiderata.


  Then ask: "Finally, if some subset of these desiderata cannot be jointly satisfied—say,
  if the causal closure of the physical plus the non-overdetermination of physical
  effects plus the distinctness of mental properties makes mental causation impossible—say
  so plainly; that negative result is more valuable to me than a survey. And tell
  me which single requirement does the most work in ruling out the most popular positions."
  This matches.


