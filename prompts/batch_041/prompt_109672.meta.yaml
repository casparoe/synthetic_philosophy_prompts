  Bradley''s regress, standard form:

  1. A proposition is a unity — a whole in which constituents are combined, e.g.,
  the proposition that a is F, or that a stands in R to b.

  2. If a plurality is to be a single thing, something must unite it — a real relation
  (a "tie").

  3. But any relation, being itself a constituent alongside its relata, must in turn
  be united with them.

  4. To unite the relation with its relata requires a further relation; and so on,
  without end.

  5. A proposition has finitely many constituents and is grasped in a single act;
  an infinite series of constituents is not something a finite mind could grasp (and
  would not be the single thing a proposition is).

  6. Therefore no proposition is a unity. (Or: no relation unites. Or: there are no
  propositions.)

  7. But if no proposition is a unity, nothing is ever said; there are no truths,
  no contents of thought.

  8. There plainly are truths and contents of thought. So something is wrong.


