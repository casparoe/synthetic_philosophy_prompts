  "I''ve been stuck on an argument a friend of mine produced, and I want a verdict
  on it rather than a reading list. He calls it, I think, Bradley''s regress, though
  he built it up from scratch. Here it is.


  1. A proposition is a whole with parts: the proposition that the cat is on the mat
  has the cat, the mat, and the relation of being-on as its constituents; what distinguishes
  that proposition from the proposition that the mat is on the cat, or from a mere
  heap consisting of the cat, the mat, and being-on, is that in the proposition the
  constituents are combined into one thing.


  2. Whenever several things are combined into one, there must be something that combines
  them; a mere plurality doesn''t unify itself. Call what does the combining the tie.


  3. The tie cannot be nothing over and above the things it ties, or it isn''t doing
  any work; so it is one more item alongside them.


  4. But then the tie is itself just one item among several, and a plurality of items
  is exactly what needs unifying. So there must be a further tie, tying the original
  tie to the items it was to tie; and that further tie raises the same demand.


  5. So the demand can never be met; every proposition, if it has parts at all, requires
  an infinite series of ties.


  6. A proposition is grasped in a single act, and there is no such thing as grasping
  an infinite series of distinct items in a single act. So no proposition with parts
  is ever grasped. And since a proposition that is never grasped and never true-or-false
  says nothing, there are no propositions and nothing is ever said.


  7. But something is said; some things are true. So something above is wrong.


