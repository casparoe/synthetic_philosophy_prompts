  the final decision was not theirs alone. I am now helping draft the panel''s standing
  protocol, and I want a procedure we can actually run, not a theory seminar.


  Please turn the best philosophical work on responsibility for autonomous systems
  into an operational decision procedure for a non-specialist incident-review panel.
  The panel has, at most, two hours per case, access to logs and interviews, and no
  authority to make legal findings; it must produce a written allocation of forward-looking
  responsibilities (who must explain, who must repair, who must change the system)
  and a statement of what cannot be allocated.


  I want the procedure to rest on a distinction I have been using informally, and
  I have not seen it made cleanly in the literature: between a *gap in answerability*
  (no one can give an adequate account of why the system acted), a *gap in liability*
  (no one can be made to bear the cost), and a *gap in repair* (no one has the standing
  or capacity to change the system). A single incident can have one, two, or all three;
  the procedure should diagnose which is present before it assigns anything.


  Then run the procedure on three cases: (1) an autonomous infusion pump that delivered
  a dose outside the protocol because a nurse overrode an alert; (2) a triage model
  that systematically under-ranked patients from a demographic group because its training
  data came from another hospital; (3) a surgical robot whose manufacturer pushed
  a software update that changed the force limits, after the hospital''s biomedical
  team had signed off on an earlier version. For each, give the panel''s output in
  the format the procedure specifies. Include at least one case where the procedure
  returns an answer your own philosophical sympathies would resist, and be explicit
  about the points where the panel must simply decide a value question—how much residual
  risk to tolerate, whose consent counts—rather than discover a fact.


