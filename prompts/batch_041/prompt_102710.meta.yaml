  you say your credence is the interval [0.3, 0.7] rather than a single number. The
  first node should ask what that interval is doing — is it a placeholder for information
  you don''t have yet and would collapse if you got it, is it the correct final answer
  even with everything you could ever know, is it a bookkeeping device for several
  people''s or several models'' opinions, or is it a mistake and you should just have
  a point credence plus an honest feeling of ignorance. That first fork should carry
  most of the weight of the tree.


  Then make the branches pull apart on things like: whether the imprecision is about
  your mind or about the world; whether a set of probabilities has to be convex, and
  what you say about non-convex ones; whether the set is defined by your fair betting
  odds (so a forced bet pins it down) or is prior to any bet; whether two options
  your set can''t rank are both rationally permissible or whether rationality has
  to hand you one; and whether you should choose by worst case, by a weighted mix
  of best and worst case, by refusing to choose anything that isn''t maximal, or by
  minimizing how much you''d regret being wrong.


