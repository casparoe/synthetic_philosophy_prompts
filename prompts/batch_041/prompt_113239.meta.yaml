  The debate that has "stalled": the debate over whether superrationality / team reasoning
  / evidential reasoning is a coherent and defensible decision-theoretic notion, and
  whether "one-shot" cooperation among identical agents is rational. That''s a long-running
  standoff between causal decision theorists (or classical game theorists) and evidential/superrational/team-reasoning
