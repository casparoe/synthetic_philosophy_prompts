  quiz — that takes a character from answers about concrete cases to a named position,
  with an honest note at the end about which positions it can and cannot separate.


  The cases the tree is built from are the following. First, the telegram game: an
  eccentric billionaire gathers twenty people and tells them that if exactly one of
  them sends a telegram, reverse charges, by noon the next day, that person receives
  a billion dollars, while if two or more send, or none does, nobody receives anything,
  and collusion is forbidden. Second, the lottery: contestants send in a number of
  entries, the prize is a billion dollars divided by the total number of entries received,
  and it is awarded to the submitter of a uniformly random entry, so that submitting
  more raises your chance of winning while shrinking the prize. Third, my own variant,
  which fuses the two: the lottery is played twice, the trillionaire publishes the
  exact multiset of first-round numbers between rounds, and before the second round
  each contestant may post a public, explicitly non-binding pledge of the number they
  intend to submit. Fourth, a variant in which one contestant is known in advance
  to be a committed one-telegram sender, whatever anyone else does.


