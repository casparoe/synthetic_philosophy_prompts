  Draft:


  "Ok so I''m putting together a handout for a first-year seminar I''m TAing called
  ''Is the world getting better?'' and I need a decision tree, not an essay. The question
  the tree has to sort people on is ''is violence declining?'' — but I don''t want
  it sorting them by which author they''d cite, because half of them haven''t read
  anything and the other half will just say ''Pinker'' and ''no but Pinker''s wrong''
  without being able to say what they mean. I want the branches to be things a student
  can actually answer about their own view, so that by the time they reach a leaf
  they''ve discovered something about what they were committed to.


  Build it from the distinctions, not from the names. The ones I think have to be
  on the tree:


  - whether ''violence'' is a moralized term for you (an act can''t be violent and
  justified) or a descriptive one (there''s violence that''s permissible — a police
  shooting, a just war, a parent restraining a child)

  - whether harm has to be intended (or at least foreseeably avoidable by someone
  who had a duty to avoid it) or whether slow impersonal harm counts — a famine engineered
  by price policy, a city designed so that crossing the street kills people, deaths
  of despair

  - whether the thing you''re comparing is an event or a condition — a massacre is
  an event, a homicide rate of 5 per 100k is a standing state of affairs, and I want
  the tree to force people to say which of those the word picks out

  - whether you''re counting rates or totals, and if rates, per what — per person,
  per person-year, per interaction, per unit of lethal capacity

  - whether you count the capacity to do harm or only the harm done (a world with
  fewer war deaths and more nuclear warheads is less violent in one sense, way more
  in another)

  - whether the unit is the world or the region, and whether a global average is a
  real thing or a fiction that hides the distribution

