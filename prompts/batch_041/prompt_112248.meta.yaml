  Let me consider the WKR one in detail:


  Logical space: An FA analysis says: X is valuable iff X is a fitting object of pro-attitude
  A (e.g., admiration, desire). The WKR problem: there are reasons to have A toward
  X that don''t bear on X''s value (the demon''s threat, the boss''s demand, the fact
  that a pill will make you admire something, the "evaluative" reason: it''d be a
  shame). Positions:

  1. Buck-passer / FA-theorist who accepts WKRs are genuine reasons for the attitude
  but denies they''re "value-relevant" reasons → needs a principled "right-kind" distinction.
  Candidate accounts of the right kind: (a) the reason must be an instance of a more
  general kind that plays the value-conferring role (Stratton-Lake / "generalized"
  buck-passing); (b) the reason must be about the object''s properties, not about
  the attitude''s consequences (state-given vs object-given reasons — Parfit, Piller);
  (c) the reason must be "content" vs "holding" reasons (Hieronymi: the reason must
  bear on the question whether to have the attitude, i.e., a constitutive reason);
  (d) the reason must be such that it makes the attitude correct, where correctness
  is a normative not a consequential matter.

  2. The FA-theorist who says the WKR is a reason for a different attitude (e.g.,
  a reason to want to admire, or to bring it about that you admire), so it''s not
  a WKR for the original attitude after all — "the reason is of the right kind after
  all, just for a different attitude."

  3. Deniers of FA analysis: value is not to be analysed via fitting attitudes; WKR
  shows FA analyses overgenerate.

  4. Those who accept WKRs are genuine, value-relevant reasons and revise the analysis
  (e.g., "value = the object of fitting attitudes, where fittingness is not reason-based"
  — fittingness-first views, or the "no priority" view).

  5. Two-tier: reason-based value is one kind of value; WKRs reveal another (e.g.,
  "attributive" or "response-dependent" value).


