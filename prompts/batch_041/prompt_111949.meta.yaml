  ---


  I direct ethics and grantmaking at a small Buddhist-founded foundation that distributes
  quarterly grants for humanitarian work. Our board charter commits us to putting
  compassion first, but it deliberately does not say whether that means maximizing
  the relief of suffering or holding to the precepts, and our five-person committee
  is split on the point. The Theravāda members treat the five precepts as near-absolute
  constraints and read the tradition''s claim that intention is what makes an action
  karmically decisive as ruling out consequentialist trade-offs; the Mahāyāna members
  invoke skillful means and the bodhisattva''s willingness to take on karmic debt
  for others'' sake to allow exceptions when the outcome is large enough. None of
  us is a trained philosopher, we decide in a two-hour meeting, and we have to record
  a written rationale that both factions will accept as having been applied in good
  faith. We keep discovering, after the fact, that we have been sliding between two
  different questions -- how much suffering will this relieve, and what will this
  do to the intentions and dispositions of everyone involved -- without noticing.


  I want a decision procedure the committee can run on each proposal: the questions
  to ask in order, what counts as a sufficient answer to each, where the procedure
  stops with a no, and where it hands the decision to a vote because the question
  is one of values rather than facts. Please build it around three registers and say
  explicitly how a proposal can be defeated by each: (1) the outcome register -- expected
  suffering relieved and harm done, including effects far in the future; (2) the karmic
  register -- the effect on the intentions and character of the actors, the foundation''s
  own staff and donors included, since the tradition holds that the state of mind
  behind an act matters as much as the act''s results, and that consequences are said
  to ripen over spans longer than a lifetime; and (3) the precepts, treated as side-constraints
  rather than as one more quantity to be traded off. The procedure has to say whether
  any register has lexical priority, and what to do when the two factions read the
  precepts differently -- in particular whether a disagreement about whether skillful
  means can license an exception is a factual dispute the procedure can settle or
  a values dispute it must hand off. It also has to say how to reason at all when
  the relevant consequences are said to extend across lifetimes that no one can estimate,
  and it should address, at least briefly, whether the no-self teaching undermines
  the whole exercise of adding up benefits across separate people, or whether conventional-level
  calculation is still the right thing to do. Keep it usable by people who know the
  tradition but not the academic literature, and do not ask us to consult sources.


  Then run it, step by step, on three proposals: a program with the highest expected
  suffering-reduction of anything on the table that would require us to spread a deliberately
  misleading claim about a treatment in order to overcome public hesitation; a contemplative-care
