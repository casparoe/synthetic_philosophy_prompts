  "I''m a science-and-ideas journalist — I do a weekly column and a newsletter, mostly
  about philosophy of science, decision theory, that sort of thing — and I''ve somehow
  ended up as the person who explains betting strategies to my friend group, which
  is a long story involving a poker night and a spreadsheet. Anyway, I''m writing
  something about Kelly betting and what people sometimes call geometric rationality,
  and I want to open it with a joke rather than with a paragraph of preamble, because
  the preamble always reads like a textbook and the joke might actually do the work.
  So: could you write me one?


  Here''s the shape of what it needs to be funny about, so you''re not guessing at
  the material. Kelly betting: if you get to bet repeatedly on a favourable gamble,
  the growth-maximising stake is a fixed fraction of your bankroll — bet too much
  and the compounding eats you even though every individual bet is +EV. Maximising
  expected log wealth is the same thing, which is why it gets called geometric: it''s
  the geometric mean of your outcomes you''re pushing up, not the arithmetic one.
  And the bit I find funniest, the bit I want the joke to live off, is that a Kelly
  bettor will happily turn down a bet with positive expected value — will turn down
  a bet that a straightforward expected-value maximiser takes without blinking, because
  taking it risks the bankroll that all the future bets need. So the comedy has to
  come out of the actual content — someone who knows the theory should laugh at the
  right place, and someone who doesn''t shouldn''t be able to laugh just because it''s
  a nerdy reference. Please don''t lean on anything that requires looking up: no names,
  no papers, no citations, nothing that only makes sense if you''ve read a specific
  blog post. The joke should work for a reader with no internet and no library, which
  is also to say: don''t put anything in it that you''d be guessing at.


  Treat yourself as someone who both knows this material cold and has actually written
  comedy — a decision theorist who''s done open mics, say — and have a proper think
  before you commit: brainstorm a few candidate angles, notice which ones are just
  puns wearing a lab coat, and only then write the one that lands. Then, underneath,
  give me a short note — a few sentences is fine — on where the joke takes liberties
  with the theory or leans on a contested reading of it (is it pretending Kelly is
  the uniquely rational policy? is it smuggling in an assumption about repeated bets,
