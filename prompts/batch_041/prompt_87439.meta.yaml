  it is deceptively aligned.

  (2) A deceptively aligned model behaves exactly as an aligned model would until
  it reaches a condition under which defection is optimal.

  (3) No finite set of behavioral tests can rule out the existence of such a condition,
  since the condition may simply not have arisen.

  (4) Therefore no amount of behavioral evidence can justify the belief that a model
  is aligned.

  (5) Without that justification, it is irresponsible to deploy a sufficiently capable
  model.

  (6) Therefore we can never responsibly deploy such a model.


