  Let me construct the argument carefully so it''s philosophically rich:


  Move 1 (A): The PP is the only sane response to fat-tailed risk. Expected-value
  reasoning assumes you can average over outcomes and that bad outcomes are bounded;
  for things like releasing a self-replicating organism, or a new particle collider,
  the loss distribution is fat-tailed, so the mean is dominated by rare catastrophes
  and doesn''t converge; in that regime, "lack of certainty" cuts the other way —
  you should treat the worst-case as the thing to act on, and the burden of proof
  shifts to whoever wants to proceed. This is basically a theorem, not a vibe.


  Move 2 (B): Two problems. First, "fat-tailed" is doing enormous work and you can''t
  tell from the armchair whether a given risk is fat-tailed; and once you say "when
  fat-tailed, maximize the worst case," you''ve just reinvented maximin, which is
  famously insensitive to probability and will make you refuse any gamble with an
  unbounded downside, including getting out of bed. Second, the PP as actually written
  in treaties isn''t the theorem — it says lack of full scientific certainty isn''t
  a reason for inaction. That''s a rule about burden of proof, and burden-of-proof
  rules don''t change the underlying probabilities; they just decide who has to do
  the work when evidence is thin. So the regulation version and the decision-theory
  version are different animals.


  Move 3 (A): Fine, but burden of proof *is* decision-relevant when the cost of a
  false negative is irreversible and the cost of a false positive is not. That''s
  the asymmetry: banning a GMO for 10 years costs some yield; releasing it and discovering
  it''s invasive costs an ecosystem, and there''s no undo. So the strong PP is just:
  when irreversibility is asymmetric, tilt toward the reversible option. And the "getting
  out of bed" objection is silly because getting out of bed isn''t irreversible.


  Move 4 (B): But "irreversible" is a matter of degree and everything is irreversible
  if you squint — you can never get back the decade you spent not deploying the thing.
  Also there''s the risk-risk tradeoff: precaution against nuclear power in Germany
  plausibly killed people via coal and gas and dependence on Russian gas; precaution
  against Golden Rice plausibly kept vitamin A in the deficiency column. So the "inaction"
  arm of the PP isn''t zero-risk, and if you don''t count those deaths you''re just
  not doing the arithmetic. And the deeper point: you can''t be precautionary about
  everything, so the PP is either empty or it''s a rubber stamp for whatever the regulator
  already feared. That''s why it''s always invoked by whoever''s currently in power.


  Move 5 (A): The risk-risk point is fair but it''s an argument for doing the PP *carefully*,
  not for dropping it. And the "you can''t be precautionary about everything" objection
  assumes symmetry; the whole claim is that the harms are asymmetric. Also: the reason
  the PP looks like a rubber stamp for incumbents is that it''s usually written with
  "cost-effective measures" and "serious or irreversible" qualifiers that gut it;
  the Wingspread version, which drops those, is the honest one.


  Move 6 (B): But the Wingspread version is the one that proves too much — literally
  every activity has some non-zero chance of serious irreversible harm, so "act even
  without full scientific certainty" forbids everything, or it forbids whatever you
  happen to dislike, which is the rubber-stamp objection again, now with better branding.
  Also, if you actually believe the fat-tail story, the correct move is to *estimate
  the tails* and price them, not to adopt a rule that deliberately refuses to look
  at the probabilities. Precaution as a rule is a way of avoiding the hard epistemic
  work.


