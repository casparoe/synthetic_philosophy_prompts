  2. Threshold transitivity: comparisons are transitive only when the differences
  exceed a contextually fixed threshold; sub-threshold differences are treated as
  ties.

  3. Parity: ''better than'' is transitive, but ''at least as good as'' is not; some
  pairs are incommensurable rather than equal.

  4. Local comparability: each adjacent pair in a spectrum is comparable, but transitivity
  fails across sufficiently long chains.

  5. Supervaluationist sharpening: there is a precise betterness ordering, but our
