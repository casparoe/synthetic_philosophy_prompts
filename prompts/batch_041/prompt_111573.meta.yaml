  A colleague of mine who teaches contract law has a line he uses whenever ethics
  comes up: a promise, he says, is just a contract that no court will enforce. He
  does not mean it as a joke. His claim is that the two are the same kind of thing
  — a party invites another to rely on a commitment, the other accepts, and the promisor
  thereby acquires a liability — and that the only difference between them is institutional:
  in one case there is a tribunal with a remedy, in the other there is not. From this
  he draws two conclusions he thinks any honest person must accept. First, that the
  wrong of breaking a promise is entirely a wrong done to the promisee, so that a
  promise no one has relied on and no one will notice is only nominally binding. Second,
  that since a contract breaker is generally permitted to pay damages rather than
  perform, there is no deep difference between keeping a promise and compensating
  the person to whom it was made.


  I suspect the analogy is doing more work than it can bear, but I would rather find
  out precisely where it fails than trade intuitions. So please do the following.


  1. Set out the correspondence in full — what answers to offer and acceptance, to
  consideration, to breach and remedy, to the various doctrines that excuse performance
  (duress, mistake, impossibility, the pre-existing duty rule, promissory estoppel),
  and to the parties'' standing to enforce. A table is fine.


  2. Identify where the mapping breaks, and separate the breaks that matter for his
  two conclusions from the ones that are merely incidental to the comparison.


  3. Say what the analogy imports from the contract case that the promise case may
  not have — a third-party enforcer, a substitutional remedy, a conception of the
  parties as strangers bargaining at arm''s length — and also what the promise case
  has that the contract case lacks (promises to oneself, promises to the dead, the
  idea that the promisor is bound to perform and not merely to pay, the possibility
  that breaking a promise wrongs the promisor as well as the promisee).


  4. Deliver a verdict on each of his two conclusions: does either survive once the
  disanalogies are on the table, and if one survives, does it survive for the reason
  he gives or for an independent one?


  5. If there is a better analogy for the bindingness of promises, give it, with the
  same treatment: what maps onto what, and where it fails. I am not looking for a
  survey of what others have written on this; I want the comparison audited and the
  argument made.


