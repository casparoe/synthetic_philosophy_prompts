  I am a law student enrolled in a seminar on the epistemology of testimony, and I
  have been puzzling over the Anglo-American hearsay rule. The rule, roughly, excludes
  out-of-court statements offered to prove the truth of what they assert, on the ground
  that such statements are not subject to cross-examination and are therefore less
  reliable than in-court testimony. Yet the same body of law recognizes a long list
  of exceptions and exemptions -- dying declarations, excited utterances, statements
  made for medical diagnosis or treatment, business records, public records, and so
  on -- in which out-of-court statements are admitted precisely because the circumstances
  of their utterance are thought to guarantee their trustworthiness. I want to understand
  what theory of testimonial knowledge and testimonial justification this practice
  presupposes. Does the core exclusionary rule presuppose a reductionist view, according
  to which testimony has no independent epistemic weight and must be backed by non-testimonial
  evidence such as cross-examination and corroboration? Or can the rule be explained
  by an anti-reductionist view that grants testimony a default entitlement but holds
  that certain institutional settings defeat that entitlement? And what about the
  exceptions: do they presuppose an anti-reductionist view for the favored categories,
  or do they merely identify circumstances in which the reductionist''s demand for
  independent evidence is already satisfied? I would like you to reconstruct the implicit
  epistemology as carefully as you can, distinguish what the practice strictly presupposes
  from what it merely fits well with, and say whether the exclusionary rule and its
  exceptions are philosophically consistent with one another or whether they pull
  in different directions. If the practice is underdetermined, tell me which rival
  theories of testimony would license the same set of rules, and what would have to
  change in the rules if we replaced the presupposed view with a thoroughgoing reductionism,
  on the one hand, or a thoroughgoing anti-reductionism, on the other.


  Please answer in the form of a JSON object with the following fields: practice_summary
  (a concise statement of the practice and its parts); presupposed_thesis (the theory
