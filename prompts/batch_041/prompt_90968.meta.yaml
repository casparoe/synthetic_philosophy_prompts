  Key conceptual content to demand:

  - Distinguish vagueness from ambiguity, from context-dependence, from open texture
  (a term may be perfectly precise yet fail to cover a novel case — Hart''s penumbra;
  that''s not vagueness in the sorites sense). This distinction matters for the procedure:
  a gap due to unforeseen cases is filled by stipulation too, but the honest flag
  differs.

  - The tolerance/sorites test: does the predicate have a dimension along which small
  increments are supposed to be irrelevant? If yes, no bright line can be faithful,
  and compiling it as a threshold silently changes the rule.

  - The super-truth test for borderline cases: is the verdict the same under every
  reading a fair-minded reader could adopt? If yes, clear case, compile. If no, it''s
  a gap → decision, not discovery.

  - The higher-order vagueness problem: which readings count as admissible is itself
  vague → the procedure cannot be fully algorithmic at this step; flag it and route
  it.

  - Epistemicist fork: if there''s a unique but unknown cutoff, the right move is
  measurement/calibration (gather adjudication data, estimate where the line actually
  falls) and the ignorance is empirical; so compiling a threshold is an approximation
  that can be improved, not a policy choice — and you should log your estimate''s
  uncertainty and revisit. Under supervaluationism, choosing a threshold is a stipulation
  with no truth of the matter, so it requires sign-off and should be labeled in the
  rule''s provenance as a decision.

  - Practical output forms: (a) compile bright line with a chosen threshold + provenance
  tag; (b) compile a "clear case" detector plus a human queue with a scripted borderline
  test (the super-truth test) for the rest; (c) rewrite the rule (replace the vague
  predicate with a list/enumerated criteria or a procedural definition); (d) push
  back to policy owner because the rule is not compilable without changing what it
  requires.

  - A "sharpenability" cost test: how much does the sharpening change outcomes? Estimate
  by sampling past cases and seeing how many verdicts flip across the plausible range
  of thresholds. If the flip rate is low, sharpening is cheap. That''s a nice quantitative
  step: sensitivity analysis over the admissible range. Great practitioner content.

