  had could not have been otherwise without not existing at all. The office should
  grant this and show that it *helps* the office''s case rather than the parents''
  — i.e., the objection that no one was harmed is correct and therefore irrelevant
  to a principle that isn''t about harm. The reader should see the machinery turn
  here.

