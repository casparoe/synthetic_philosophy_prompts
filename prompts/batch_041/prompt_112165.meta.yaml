  else equal'' clause, and then argue, step by step, that everything else is never
  equal — so the clause either does no work or swallows the whole. This argument must
  be the spine.

  - The scope problem: once the office begins, it cannot stop at disease. Show the
  schedule of traits it considers (it should include at least one trait the reader
  will find uncomfortable and at least one the reader will find ridiculous, and the
  office should treat them identically, giving no sign it knows one is different).

