  I think Quine''s gavagai gives the richest set of subtle distinctions:


  Plausible summary (in the voice of a competent popularizer): "Quine''s gavagai argument
  is meant to show that translation is impossible: when a native utters ''gavagai''
  as a rabbit runs by, nothing in the native''s behaviour can tell you whether he
  means rabbit, rabbit-part, or rabbit-stage, so no translation manual can be right.
  It follows that meanings are private, that we can never really know what anyone
  else means, and that the whole idea of a language of thought is a myth. It also
  shows that Quine was a behaviourist: since he thought all the evidence available
  is behavioural, and since behaviour never determines meaning, the conclusion is
  that the language of thought is incoherent."


  Subtle errors:

  1. "Translation is impossible" vs indeterminacy — multiple manuals, each compatible
  with all possible behavioural evidence, none uniquely correct; it''s not that translation
  is impossible (Quine thought translation manuals work well enough, and indeed we
  translate). Quine: "the indeterminacy is of a different kind from the underdetermination
  of physics" — actually he thought it''s worse; he says the indeterminacy of translation
  is "not... to be seen as a defect of the translation" — hmm, careful.

  2. "We can never know what others mean" — epistemic reading. Quine''s point is not
  that we can''t know (he''s not a sceptic in that sense); it''s that there is no
  fact of the matter about which manual is correct — the indeterminacy is metaphysical/not
  epistemic (no determinate fact to be known). But careful: Quine is not obviously
  a "no fact of the matter" realist either; he does say there''s no fact of the matter,
  "there is no fact of the matter" is his phrase, yes. In "Ontological Relativity"
  he says there is no fact of the matter about the reference. And he accepts that
  there''s nothing "to be right or wrong about". So the error: the summary makes it
  an epistemic limitation ("we can never know") rather than a claim about the absence
  of a fact of the matter. Actually many critics read it epistemically; but Quine
  is clear it''s not a sceptical/epistemic problem. Hmm, careful: Quine does also
  say the indeterminacy is a matter of "the whole of our theory" — I''ll keep it as
  "no fact of the matter" vs "we can''t know."


  Also there''s a genuine subtlety: Quine distinguished indeterminacy of translation
  from inscrutability of reference. The gavagai example is really the inscrutability
  of reference (gavagai vs rabbit-stage vs undetached rabbit-part) — the indeterminacy
  of translation in the broader sense includes e.g. "bachelor" vs "unmarried man"
  — the analytic/synthetic distinction — and Quine''s claim that the difference is
  a matter of the manual rather than fact. And a very good point: the two English
  translations of "gavagai" as "rabbit" and "rabbit-stage" are *intertranslatable*
  in English — the difference is expressible within the object language... Actually,
  the point about the inscrutability of reference: Quine says that within our own
  language, the difference between "rabbit" and "undetached rabbit part" as referents
  is not a real difference, because the accompanying apparatus of individuation (plurals,
  identity, pronouns) absorbs the difference — you can compensate by adjusting the
  rest of the manual, so the two manuals are empirically equivalent but one is not
  just wrong.


  3. "The whole idea of a language of thought is a myth" — misattribution; Quine''s
  target is the analytic/synthetic distinction and the determinacy of meaning, not
  Fodor''s LOT. Also Quine famously argued that translation indeterminacy doesn''t
  apply to observation sentences — the observation sentences are translatable with
  confidence; indeterminacy emerges at the level of terms, reference, and the "analytical
  hypotheses." That''s a subtle error: saying "no translation manual can be right"
  and "nothing in behaviour tells you" — but Quine thought "Gavagai?" as a one-word
  observation sentence can be translated by the stimulus meaning.


  4. "It also shows that Quine was a behaviourist: since he thought all the evidence
  is behavioural, and since behaviour never determines meaning, the conclusion is
  that the language of thought is incoherent." Well, Quine *was* a behaviourist, so
  saying "it shows he was" is odd — behaviourism is a premise, not a conclusion. That''s
  a nice subtle error: the summary treats behaviourism as an output of the argument
  rather than an input. Also "behaviourism" conflated with the everyday sense of "behaviourist"
  = thinks people are robots. Good.


  5. Also: "meanings are private" — the opposite of Quine''s point; Quine''s target
  is that meaning is public, and the indeterminacy is about the impossibility of a
  private, determinate meaning. Hmm — "meaning is private" is actually a misreading;
  Quine''s conclusion is that there''s no "museum myth" where meanings are mental
  objects. So saying "meanings are private" inverts.


  6. Another possible error: presenting the indeterminacy as resting on facts about
  *exotic* languages ("when a native..."), whereas Quine thought it applies to radical
  translation generally, and even to one''s own language and to homophonic translation
  (and to translation between our own past and present selves — the "indeterminacy
  of translation" as part of the "indeterminacy of our own language"). Also the classic
  misrepresentation: Quine''s argument isn''t that the native''s language is impoverished,
  but that the evidence is.


  7. Also, the "gavagai" could mean "there''s rabbit" as a whole sentence, vs a term.
  The stimulus-meaning of "Gavagai?" as a sentence is translatable ("Rabbit?" or "Lo,
  a rabbit"); the trouble starts when you treat it as a term.


