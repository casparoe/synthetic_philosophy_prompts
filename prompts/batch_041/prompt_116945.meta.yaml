  equilibrium: a solution concept for games where players submit programs, and a program
  equilibrium is a Nash equilibrium of the "program game." This is from Tennenholtz
  (2004). It''s used to explain cooperation in the one-shot Prisoner''s Dilemma: if
  both submit the program "if the other''s program is identical to mine, cooperate;
  else defect," that''s a program equilibrium. What would count against the claim
  that program equilibrium explains/predicts cooperation? Defeaters: it''s not robust
  to "program verification" issues (undecidability: a program can''t always determine
  what another program does — Rice''s theorem), it requires source-code access and
