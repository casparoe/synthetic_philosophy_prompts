  game, so it''s not a "solution" to the PD unless you think the meta-game is the
  right model; it collapses under "program equilibrium is not a refinement but a different
  game"; the problem of "multiple equilibria" (including mutual defection), so it
  doesn''t uniquely predict cooperation; the problem of "self-referential" programs;
  the "one-shot" PD with program equilibrium is really a repeated-game-like story
