  The argument.


  [1] The dispute between epistocracy and democracy is normally conducted as a dispute
  about who should hold authority: the many, or a subset selected for competence.
  I claim this is the wrong framing, and that both sides are really making claims
  about the error structure of collective judgment.


  [2] The aggregative case for democracy rests on a result of the following shape.
  If each of n voters is more likely than not to judge correctly, and their errors
  are independent, then the probability that the majority is correct increases with
  n and tends to certainty; if each is more likely than not to judge incorrectly,
  the majority tends with equal certainty to the wrong answer. Two conditions carry
  the weight. First, the question must have a determinate correct answer. Second,
  the errors must not be systematically aligned.


  [3] Politics supplies neither condition cleanly, but the second is where I want
  to press. Aggregation cancels noise; it does not cancel bias. Where errors are correlated
  — shared outlets, shared cues, shared partisan identity — the majority converges
  on the bias rather than the truth. So the empirical question that decides the epistemic
  case for democracy is not how ignorant the median voter is, but whether the error
  is mean-zero and roughly independent across voters. And there is a structural reason
  to expect that it is not: the costs of becoming informed are borne individually
  while the benefits are diffuse, so the information that circulates is disproportionately
  supplied by those with concentrated stakes. The resulting ignorance is not random;
  it is tilted. Aggregation therefore fails precisely where the stakes are highest,
  and the familiar complaint about voter ignorance is really a complaint about a directional
  distortion that aggregation cannot repair.


