  what''s contested, and the frozen roll is a version of this (a "constitutional moment"
  fix, à la Ackerman/Sunstein? or the "practice-dependent" view: the demos is constituted
  by an antecedent constitutional practice and that''s all the legitimacy needed —
  but the secession case is precisely where the antecedent practice breaks). (4) Diagnosis:
  the circularity is real but not vicious if you distinguish the *constitution* of
  the demos (which is a matter of politics, not procedure — "constituent power") from
  the *exercise* of democratic decision within a constituted demos; or if you accept
  that legitimacy is a matter of the quality of the ongoing contestation rather than
  the pedigree of the boundary (Honig''s "unconstituted demos"?). (5) A good answer
  takes a stand: either the regress is benign because the boundary is always provisional
  and revisable (the "provisional demos"), or the boundary problem shows that "democracy"
  as popular self-rule is a regulative ideal, not a decision procedure.


