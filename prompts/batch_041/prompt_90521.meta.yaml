  Aristotle on money and exchange: I know NE V.5 fairly well. Key claims:

  - Every art/action has an end; exchange (metadosis) requires equality/proportion
  (analogia) — "as a builder is to a shoemaker, so are X shoes to a house."

  - Exchange requires commensurability, but things are not naturally commensurable;
  money (nomisma) makes them commensurable by convention (nomos) — money is "a sort
  of substitute/representative of need (chreia)" and exists "by convention" and "not
  by nature but by law", and "it is in our power to change it and make it useless."

  - Aristotle''s "proportion" via cross-multiply (diagonal pairing: as house to shoes,
  so builder''s...). Actually he says: "the number of shoes exchanged for a house
  must correspond to the ratio of builder to shoemaker."

  - Money has the function of measuring demand and serving as a guarantee of future
  exchange (that''s why it''s called nomisma because it exists not by nature but by
  convention — hmm, the etymology: "nomisma" from "nomos" because it''s not by nature
  but by law/convention).

  - Politics I.9-10: the distinction between oikonomike (household management, natural
  acquisition) and chrematistike (wealth-getting); natural chrematistike vs. unnatural
  (retail trade, kapelike, and usury, obolostatike, "currency begetting currency"
  — "toko" from "tikto" i.e., offspring); usury is the most unnatural because "the
  birth is from the currency itself" and "currency was intended for exchange, not
  to increase by interest." Also the story of Midas and the fable of the... the story
  of the man who cornered the olive presses (Thales) — that''s Politics I.11, Thales
  as example of monopoly; Midas''s prayer (Politics I.9) — the fable about Midas:
  everything turned to gold, so he starved — Aristotle uses this to show that wealth
  as coin is not real wealth.

  - Politics I.9: "there are two sorts of wealth-getting... the one is a part of household
  management, the other is retail trade" and the "natural" vs "unnatural"; also Aristotle
  says the art of acquisition has a limit but the "art of making money" (chrematistike
  as retail) has no limit.

  - Politics I.10: usury condemned; "usury is money bred from money... of all ways
  of getting wealth this is the most contrary to nature."


