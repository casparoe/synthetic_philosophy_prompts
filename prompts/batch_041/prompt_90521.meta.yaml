  it. So a subtle error: "Aristotle solves the commensurability problem by appealing
  to money" — that''s precisely contested; the better reading is that he treats money
  as a conventional proxy for need, and that his own solution is unsatisfying. Hmm,
  that''s a contested reading — a grader could legitimately say the student''s reading
  is a defensible interpretation, so not a good "error." Careful: I need errors that
  are clear.


