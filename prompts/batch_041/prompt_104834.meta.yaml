  "Last night a friend and I argued for three hours about whether you can come to
  know that your eyes are working by using your eyes, and I would like the argument
  set out as a dialogue between the two of us, because I came away convinced that
  we were each sliding between several different claims and that the disagreement
  is sharper than either of us made it.


  Here is the shape of it. I take what I would call the liberal line: when I look
  at a ripe tomato in good light and it looks red, I am justified in believing that
  it is red, and I do not need to have already justified the claim that my colour
  vision is reliable in order to have that justification. Perception, on this view,
  gives me immediate justification for beliefs about my surroundings — not infallible
  justification, and not justification that survives every counter-consideration,
  but justification all the same. My friend takes the conservative line: a belief
  produced by a faculty cannot be justified unless I have antecedent, independent
  justification for thinking the faculty is reliable. His charge is that my position
  licenses what he calls easy knowledge. On my view, he says, I can reason as follows:
  the tomato looks red to me, so it is red; my colour vision has just delivered a
  correct verdict; my colour vision is therefore reliable, at least in this instance;
  and I may now rely on my colour vision in general, including in the cases where
  I would otherwise have doubted it. He says that this reasoning uses the deliverances
  of a faculty to certify the very faculty that produced them, that it is therefore
  circular in a way that cannot yield knowledge, and that it makes the difference
  between reliable and unreliable perceptual faculties invisible from the inside —
  a person with systematically unreliable colour vision could run exactly the same
  argument, with exactly the same confidence, and end up just as convinced that their
  eyes were fine. I say the alternative is worse. If justification always requires
  antecedent evidence that the faculty is reliable, then no perceptual belief is justified
  for anyone who has not already checked all of their faculties, the demand generates
  a regress, and the only ways out are scepticism or a stopping point that is just
  as arbitrary as the one I am accused of taking. He says I am confusing the claim
  that a requirement is hard to meet with the claim that it should not be imposed,
  and that the regress is simply the structure of justification rather than a reductio
  of his view.


  We also got tangled up over the Moorean move. I said that I know I have hands, that
  if I know I have hands then I know there is an external world, and that the sceptical
  hypothesis has to be the thing that gives way. He said that this only has force
  if I am already entitled to my perceptual beliefs, which is precisely what is at
  issue, and that my confidence in the premise is doing work that an argument ought
  to be doing.


  I would like the two of us written out in dialogue — one character holding the liberal
  or dogmatist line, the other holding the conservative line — with each responding
