  is the dispute as I understand it.


  I hold what I''d call the liberal view: when I look at a tomato and it looks red
  to me in good light, I''m justified in believing it''s red, and I don''t need to
  have already justified the claim that my color vision is reliable in order to be
  justified. My friend holds the conservative view: no belief can be justified by
  a faculty unless you have antecedent, independent justification for thinking that
  faculty is reliable. He says my view licenses ''easy knowledge'': I can reason,
  ''The tomato looks red; so it is red; my color vision has now delivered a correct
  verdict; therefore my color vision is reliable,'' and then use that conclusion to
  trust my color vision in general — including in cases where I''m genuinely unsure
  whether I''m being deceived. He says this is circular in a vicious way, that it
  can''t be the sort of reasoning that gives knowledge, and that it makes the difference
  between a reliable and an unreliable perceptual faculty invisible from the inside.
  I say the alternative is worse: if justification always requires antecedent evidence
  for the reliability of the faculty that produced it, no perceptual belief is ever
  justified for anyone who hasn''t independently checked all of their faculties, and
  the demand either leads to scepticism or to an infinite regress. He says that''s
  just the structure of justification and that I''m confusing the absence of a requirement
  with the impossibility of meeting it.


