  Lewis''s Convention (1969) — the model: coordination problem with two equilibria,
  a regularity R in behavior in a population, R is a convention iff (1) everyone conforms,
  (2) everyone expects everyone else to conform, (3) everyone prefers to conform given
  others conform (because the coordination problem has multiple equilibria), (4) there''s
  a common knowledge of all this, (5) R is arbitrary (an alternative regularity could
  have been a convention). And Lewis notes conventions can be learned, and that conventions
  need not be "agreements." Also Lewis''s later "Languages and Language" and his treatment
  of truthfulness and trust as conventions.


