  Let me weigh "in the weeds" and "meaningful for a model that can''t search". Both
  fine. The Smith one has a nice structure: mapping table (spectator ↔ ideal observer;
  impartiality ↔ disinterestedness; the imagined standpoints of others ↔ omniscience;
  general rules ↔ the ideal observer''s judgements; the man within the breast ↔ ...;
  actual spectators ↔ ...). Disanalogies: Smith''s spectator isn''t omniscient (he
  only needs to be informed enough for the case; he judges by sympathy, i.e., by imagining
  the agent''s situation and feeling along, which is a causal-psychological process
  not a truth-machine); Smith''s spectator is constructed from actual social experience
  (the "mirror" of society, general rules formed from experience of what we actually
  approve); Smith''s spectator is not dispassionate in the ideal-observer sense —
  he''s a being of sentiment whose approval is a feeling; Smith''s account is descriptive-genetic
  as well as justificatory, so the spectator does double duty (explaining how we form
  moral judgements and being the standard); the spectator can be corrupted ("the man
  within the breast" can be bribed by self-love, and Smith''s remedy is appeal to...
  hmm). Also the ideal observer theory is explicitly a reductive naturalist analysis
  of moral terms (right = approved by ideal observer), whereas Smith doesn''t offer
  a semantic analysis of moral terms. Also ideal observer must be "otherwise normal"
  — and Smith''s spectator is imagined from within a particular society''s norms,
  raising the relativity worry.


  Then the conclusion: does "Smith = proto ideal-observer theorist" survive? Partially
  — it supports the idea that Smith has a standard that is not mere actual approval
  (so not crude conventionalism), but it doesn''t give him an external/objective standard
  in the realist sense, and it doesn''t make him a proto-utilitarian or a Hare-style
  universal prescriptivist. Also smuggling: the ideal observer''s omniscience smuggles
  in a cognitive, information-processing picture of moral judgement that Smith''s
  sympathy-based account resists; and the "impartiality" of the ideal observer is
  a constraint on the observer''s preferences, whereas Smith''s impartiality is a
  constraint on the spectator''s situation (he''s not a party to the case), not on
  his psychology.


