  I serve on the oversight board of the National Records and Memory Authority of [country].
  Twenty years ago our Truth and Reconciliation Commission deposited its working archive
  with us under a statutory seal; the seal expires in six months, and the board must
  decide, at its next session, what becomes of the records. I have to circulate a
  written opinion before then, and I would like your help drafting it.


  The archive is not the clean thing the public imagines. It holds three kinds of
  material that pull in different directions:


  - testimony given to the Commission in confidence by survivors, on the explicit
  understanding that names would not be published in their lifetimes;

  - statements by low-level perpetrators who cooperated in exchange for confidentiality,
  some of whom are still alive and were never prosecuted;

  - surveillance files — dossiers compiled by the old security service on thousands
  of people, most of whom were never charged, some of whom are now public figures
  and some of whom are not.


  On top of this, and this is what actually divides the board, there is the problem
  of what is not there. Large parts of the record were destroyed before the handover,
  and whole communities — the ones the old state administered orally, or refused to
  register at all — appear in the archive only as the objects of other people''s paperwork,
  if at all. A coalition of descendant communities has petitioned us not to treat
  these gaps as gaps. They want the Authority to accession the silences themselves:
  to create a standing register of documents known to have existed and been destroyed,
  of populations the state never recorded, and of questions the Commission never asked,
  and to give that register the same status as the surviving files, so that a reader
  consulting the archive is confronted with its absences rather than misled by them.
  A second petition, from journalists, asks us to publish at least the index of the
  surveillance files — who was watched, when, by which unit — even if the contents
  stay sealed, on the ground that being watched is itself a fact about a person''s
  life that the state owes them.


  The board is split. One faction says the seal should simply lapse: the public''s
  right to know, and the victims'' claim to a public record, outweigh the confidentiality
  promises, which were made by a body that had no authority to bind the future. The
  other says that promises were promises, that releasing informant lists will get
  people hurt or killed, and that a register of absences is mysticism — you cannot
  accession what you do not have, and an archive that fills itself with its own negations
  stops being an archive.


  I need an opinion that recommends one concrete course of action — release, continued
  sealing, or conditional release with stated criteria — with a timetable the board
  could actually vote on. It should take the losing side''s strongest point seriously
  rather than waving it away, and it should say plainly what we would be doing, and
  to whom, if we treat a silence as a holding. I would rather have a decision I can
  defend in five years than one that merely splits the difference.


