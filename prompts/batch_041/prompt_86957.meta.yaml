  Title: Everyday conventions and the ethics of the outsider


  Thesis paragraph: The debate about whether everyday conventions — queueing, tipping,
  jaywalking, standing on the right of an escalator — are moral obligations is usually
  run as a question about the *strength* of conventions: are they mere customs, or
  do they bind? I want to argue that this is the wrong axis. The right axis is *what
  a convention is doing*, and once we separate two functions the question dissolves
  into two much more tractable ones, with different answers.


  Section 1: Two functions.

  Burden conventions: allocate a cost that must fall on someone. Queueing allocates
  waiting time; tipping in a wage system where the tip is priced into the wage allocates
  the cost of service labour; right-of-way rules allocate risk and delay; escalator
  etiquette allocates a scarce lane. In each case there is a quantity of something
  unpleasant that has to be distributed among people who all want less of it. The
  convention is one distribution rule among many, and it works because everyone expects
  everyone else to use it.

  Marker conventions: signal something about the relationship — that you recognize
  someone, that you are not contemptuous, that you belong. Dress codes, forms of address,
  whether you greet the shopkeeper. These cost little materially, and their violation
  costs the other party little materially, but they carry information.


  Section 2: Obligations attach to losses, not to denied gains.

  A violation of a burden convention typically imposes a loss on an identifiable person
  (the person behind you waits longer). A violation of a marker convention typically
  denies someone an expected benefit (the recognition they expected) without imposing
  a loss (they are no worse off than before). I take it that we have obligations not
  to impose losses and much weaker reasons to supply benefits. So burden conventions
  can ground obligations; marker conventions ground reasons of a different and weaker
  kind — reasons of non-contempt, which is to say reasons not to let your conduct
  express that the other person doesn''t count. This is not the same as an obligation
  to conform.


  Section 3: Conditions on the obligation. Three conditions: (i) low cost of compliance
  relative to the burden redistributed; (ii) the burden of non-compliance falls on
  an identifiable party; (iii) the convention is the operative coordination point
  — i.e., there is no other salient rule everyone is already using. Where (iii) fails,
  the obligation evaporates: this is the jaywalking case. Where a law is universally
  violated and universally known to be violated, the operative coordination point
  is the pedestrian''s own risk assessment, not the statute; the statute is a dead
  letter and its violation imposes no loss on anyone who was relying on it, because
  no one was. Note the conclusion I want to resist: that this licenses jaywalking.
  It doesn''t license anything; it relocates the question to risk imposition, which
  is a different question with its own answers.


  Section 4: Aggregation. One worry: trivial losses aggregate. If a thousand pedestrians
  each cost a driver two seconds, the total is real. I take the line that trivial
  losses imposed on unconnected strangers do not aggregate into an obligation, because
  the aggregation has no bearer — no one is the person who lost thirty-three minutes.
  They do aggregate when the same party is repeatedly on the receiving end, which
  is why queue-jumping, where the same queue is repeatedly raided, is a more serious
  matter than jaywalking, where the losses fall on a rotating cast. I''m least confident
  here.


  Section 5: The visitor. Now the second question: must visitors follow local conventions?
  The usual answers are: yes, when in Rome, because you are a guest and consent to
  local rules by entering; or no, because obligations can''t be generated by geography.
  I want a third answer built on the adjustment-cost asymmetry. For burden conventions,
  the visitor should follow local practice, and the reason is not deference but predictability:
  the locals have built their expectations around a rule they cannot renegotiate with
  you in the moment. Your obligation is to be predictable, not to be local. This means
  you are bound by the local rule even when you think it is silly, and bound most
  strongly when your non-compliance is invisible to you but visible to them (the visitor
  who stands on the left of the escalator does not know they have done anything).
  For marker conventions the asymmetry runs the other way. The host can read a visitor''s
  foreignness more cheaply than the visitor can learn a local repertoire of small
  signals, and the host knows that non-conformity here is evidence of unfamiliarity
  rather than contempt. So the host owes interpretive charity, and the visitor''s
  obligation is at most to make the effort legible — to be visibly trying. A visitor
  who bows badly is doing the thing; a visitor who refuses to try is doing something
  else.


  Section 6: Two hard cases to test the account.

  Tipping: a visitor from a no-tipping country, in a place where the tip is priced
  into the worker''s wage. Here the visitor''s non-compliance imposes a loss on an
  identifiable person, so it is a burden convention and the visitor is bound. But
  the visitor may not know the rate, and the rule is not publicly posted. I claim
  the obligation survives the ignorance — the loss falls regardless — but the *degree*
  of culpability is low, and the local who knows the visitor is foreign and says nothing
  is doing something mildly wrong too.

  Queueing at a counter where locals mill rather than form a line: the visitor forms
  a line, is served last, and feels wronged. Here the visitor is the one imposing
  nothing and suffering a loss. My account says the visitor has no complaint: no convention
  was operative that anyone was relying on, and the locals did not impose a loss on
  the visitor; they simply used a different and equally good rule that happened to
  disadvantage a newcomer. This is a conclusion I dislike, which is a reason to distrust
  the account.


  Section 7: What this leaves. If the account is right, the moral weight of everyday
  conventions is not a matter of how deeply felt or how widely shared they are, but
  of who bears what when they are broken. That predicts that the conventions people
  defend most heatedly — markers of respect — will often be the ones with the least
  claim on outsiders, and that the ones people barely notice — the queue, the tip,
  the escalator lane — will be the ones that bind. That inversion is the part I most
  want to be told is wrong, if it is.


