  ---


  I am preparing a position paper on futarchy — governance in which policy is chosen
  by prediction markets rather than by votes — and before I circulate it I want an
  adversarial audit of whether my commitments actually hang together. The commitments
  are as follows.


  1. For any question with a well-defined, externally verifiable resolution, a liquid
  prediction market''s price is a better estimate of the answer than the considered
  verdict of any deliberative body, and the explanation of this superiority is the
  incentive structure of a resolvable bet: traders who are wrong lose money to those
  who are right, and the resolution event supplies a truthmaker that no amount of
  deliberation supplies on its own.


  2. A coercive political decision is legitimate only if everyone subject to it had
  an equal opportunity to influence it. Influence that is proportional to capital,
  or to the confidence with which one holds a belief, is not equal opportunity.


  3. My preferred institutional design is as follows. The legislature stipulates,
  in advance and by ordinary majoritarian procedures, a scalar welfare index — say
  a weighted composite of median disposable income, healthy life expectancy, and a
  periodic self-reported life-satisfaction survey — together with the weights and
  the horizon (the index is read five years after a policy''s implementation). Conditional
  markets then trade contracts of the form "the index will be at least value v in
  five years if policy P is implemented," where the stake is returned if P is not
  in fact implemented. The policy with the highest conditional price is implemented;
  if the top two are within some margin, the status quo stands. On this design, the
  normative question — which index — is settled politically, and the empirical question
  — which policy best serves that index — is settled by the market.


  4. I am a value pluralist. Social states are not rankable on a single scale: liberty,
  welfare, and equality are not commensurable, and any scalar index is a substantive
  and contested normative choice rather than a neutral measuring instrument.


  5. I accept the general lesson that a measure used as a target decays as a measure:
  once an indicator governs the allocation of resources, agents act on the indicator
  rather than on what it was meant to track.


  6. I am unimpressed by the complaint that ordinary citizens are ignorant of policy.
  Legitimacy, on my view, rests on authorization rather than on comprehension; a decision
  is not made less legitimate by the fact that those who authorized it could not have
  explained it.


  Which of these are actually in tension, which only appear to be, and what is the
  least costly way to restore consistency? Please rank the tensions by severity rather
  than treating them as equally serious, and for each one state precisely what has
  to give and what is lost in giving it. I would particularly like to know whether
  there is a single revision that would resolve more than one of them, and whether
  any of my commitments are doing work that another one already undermines.


