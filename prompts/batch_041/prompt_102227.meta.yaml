  Let me design the futarchy audit.


  Persona: professor of philosophy (political philosophy / social epistemology). Formal,
  polished.


  Belief set (say 6 commitments):


  (A) Epistemic: Prediction markets are, other things equal, the best available aggregators
  of dispersed factual belief; a well-capitalized market''s price is a better estimate
  than any deliberative body''s judgment for questions with a well-defined resolution.
  (Standard.)


  (B) Normative/legitimacy: Political decisions are legitimate only if each person
  subject to them has an equal opportunity to influence the outcome; outcomes that
  track dollars rather than persons are illegitimate even when correct. (Standard
  democratic commitment — but tensions with (A)? Actually (A) is epistemic, (B) is
  about legitimacy; you can combine: use markets to inform, votes to decide. But futarchy''s
  actual proposal is to decide by markets.)


  (C) Futarchy-style: Policy should be selected by conditional prediction markets
  on a stipulated welfare metric; the metric is fixed by the constitution/legislature
  in advance; markets answer "which policy maximizes the metric," not "what is good."


  (D) Anti-paternalism/value pluralism? Hmm.


  Let me find genuine non-obvious tensions:


  Tension 1: (A) says markets are good for *well-defined resolution* questions. Futarchy
  needs conditional markets on counterfactuals — "the metric value if policy X is
  implemented." But whether X is implemented is itself determined by the market''s
  output (the decision rule). So the condition is endogenous: the market is pricing
  a selection effect, not a counterfactual. And more deeply, if the market price determines
  the decision, then the "if X" branch is realized precisely when the market says
  X is better, meaning the estimate is self-referential. This is a genuine tension
  between (A) (markets are reliable because of the "truth-tracking" incentive of a
  resolvable bet) and (C) (decide by conditional markets). Also, conditional markets
  require someone to enforce that the policy would have been implemented had the market
  said so — the "credible commitment" to implement the losing branch''s counterfactual?
  Actually resolution of a conditional market "P if X" typically requires that if
  X doesn''t occur, the bet is void (money back), so the "if X" price is estimated
  only by people willing to trade on a possibly-void contract; the incentive is weak
  and the price is uninformative when X''s probability is low. Good.


  Tension 2: (B) equal influence vs (C) markets weight by capital and by confidence.
  A genuine, but somewhat obvious tension. Maybe make it non-obvious by combining
  with a commitment to "epistemic democracy" — that legitimacy comes from the *quality*
  of deliberation, not just equality. Hmm.


