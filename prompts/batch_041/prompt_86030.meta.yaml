  at node 1, continuing leads to 4, exiting leads to 0, so continue. So CDT says "continue
  at 1, exit at 2" — which, given absent-mindedness, is an inconsistent policy, since
  the agent at node 1 and node 2 is the same agent-type. So CDT is either inconsistent
  or must recommend the policy that''s best "if followed at all nodes": exit at all
  nodes → 0; or continue at all → 1. So CDT recommends continue (value 1)? Many say
  CDT recommends continuing, giving 1. EDT gives 4/3 > 1. So EDT beats CDT here. That''s
  the standard "ADP favors EDT."


