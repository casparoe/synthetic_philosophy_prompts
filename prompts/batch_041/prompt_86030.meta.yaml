  1. Is the problem well-posed (does it have a determinate correct answer)? i.e.,
  P(the question "what is the rational act here" has a determinate answer at all).

  2. Is the mixed strategy (2/3 continue / 1/3 exit) the correct answer for an agent
  with a single choice rule? (Some argue that randomization is required; others argue
  that the payoff-relevant act is "the policy" chosen in advance, and the driver at
  the wheel shouldn''t be the locus of evaluation.)

  3. Does the fact that CDT can''t deliver that answer show CDT is wrong, or only
  that CDT must be extended (e.g., to policies, or to "choosing a whole decision procedure")?
  i.e., P(the extension is non-ad hoc / doesn''t collapse CDT into EDT).

