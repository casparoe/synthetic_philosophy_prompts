  p, exit with 1-p. Expected utility: exit at first: 0; exit at second: (prob of reaching
  second and exiting) = p(1-p) * 4; pass both: p^2 * 1. Maximize 4p(1-p) + p^2 = 4p
  - 3p^2, derivative 4 - 6p = 0 → p = 2/3, exit prob 1/3, utility = 4*(2/3)(1/3) +
