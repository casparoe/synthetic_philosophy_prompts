  Draft:


  "I spent most of last night arguing with a friend about transcendental arguments
  — the kind that begin from something nobody denies, such as that we have experiences
  or that we are having a conversation, and then claim to show that some disputed
  thing is a necessary condition of it, so that the sceptic cannot so much as raise
  his doubt without presupposing what he doubts. My friend''s objection, which I could
  not answer to my own satisfaction, was that the argument at best shows something
  about what our concepts require of us, not about what there is; and that a sceptic
  who cheerfully accepts the premise and denies the entailment, or who accepts both
  and says ''so I must think that way — how does that make it true?'', seems to survive
  the argument untouched. I want to see whether the technique can be made funny without
  being made false, so I have a commission for you.


  Write a self-help column of about 750 words, in the relentlessly upbeat voice of
  an invented guru who teaches transcendental argumentation as a general life skill
  — the way one might teach networking or speed-reading — under a headline and a byline
  you invent. The piece should present the method as a numbered sequence of steps,
  and every step must be the real move rather than a cartoon of it: start from a premise
  no one can deny without performative absurdity; identify the condition that must
  hold for that premise to be so much as intelligible; declare the condition necessary
  rather than merely actual; and then deal with the sceptic by pointing out that his
  doubt presupposes the very thing he doubts. The humour should come from the guru''s
  enthusiasm and from the domestic examples he chooses (his own examples, invented,
  not the ones from the literature), not from his misunderstanding the argument: a
  reader who has taught the first Critique should recognize the technique and wince
  at the familiarity of each step rather than at an error.


