  is unique only up to positive affine transformation (for expected utility) or ordinal
  (for choice).

  (2) Any interpersonal comparison of utility requires comparing one person''s utility
  units with another''s.

  (3) But there is no fact of the matter about whether my unit of utility is bigger
  than yours; that''s not an empirical question.

