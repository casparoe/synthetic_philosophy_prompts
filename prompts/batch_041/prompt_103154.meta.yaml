  Unilateralist''s curse: Bostrom et al. — when a decision to act is made by any one
  of many agents, each with imperfect information, the expected value of a single
  agent acting may be negative even if the expected value of a coordinated decision
  would be positive, because the agent acts when their estimate is above threshold,
  and the threshold-crossing is more likely when they''ve overestimated. So the acting
  agent is selected for overestimation.


  The "in the weeds" version: the curse is usually presented as an argument for requiring
  more evidence / coordination / deference to a singleton. But there''s a subtlety:
  the curse can be "fixed" by having agents commit to a rule ex ante, or the curse
  disappears under certain correlated-evidence assumptions. Also the "curse" is really
  about selection on error, akin to winner''s curse in auctions and the "reverse winner''s
  curse".


