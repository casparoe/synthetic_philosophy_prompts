  I am not identical to the class of people like me, and my act is not the class''s
  act. So either the reframing supplies a genuinely different normative premise (a
  reason to participate in a practice, not a causal claim about my vote), or it quietly
  changes the subject. If it supplies that premise, the paradox is not dissolved —
  it is conceded, and an independent argument for the practice-based reason is owed.
  If it doesn''t, it''s a fallacy of division/compounding.


