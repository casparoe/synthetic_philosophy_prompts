  \ an expert says the coin will land heads because of my belief... hmm.\n\nAlso,\
  \ there's a tension with \"evidential\" cases: a person who knows that after the\
  \ exam they will believe they passed regardless of whether they passed (the \"grade\"\
  \ case). Hmm.\n\nAlso, another nice in-the-weeds injection: a \"sunk\" case about\
  \ calibration — I know my future self will be better calibrated because they'll\
