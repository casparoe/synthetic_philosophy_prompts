  \nI should also introduce a \"new/niche idea\" — the instruction says you'll often\
  \ have to inject some sort of new/niche idea into the prompt. E.g., a fictional\
  \ pill (\"Sunn\" pill?), or a fictional device. But careful: introducing fictional\
  \ elements is fine. E.g., a pill that makes you temporarily better at logic but\
  \ worse at memory; or a \"reverie\" drug.\n\nHmm, but the asker is reporting their\
  \ own verdicts on cases, and the model must find a principle. The model can't search.\
  \ So the cases must be understandable without literature. Good.\n\nLet me think\
  \ about the tension pairs: verdicts that are hard to reconcile. Candidate verdicts:\n\
  \n1. Amnesiac: Tonight I'm going to take a pill that erases all my evidence about\
