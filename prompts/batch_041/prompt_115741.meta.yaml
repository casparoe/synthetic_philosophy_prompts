  \ 80/20. Should I now adopt 50/50? Intuition: no — I should keep 80/20, because\
  \ my current evidence is better; the future me is epistemically worse off.\n\n2.\
  \ Expert: Tomorrow I'll meet a statistician who will have examined the data; I know\
  \ I'll then think the probability is 30%. Intuition: yes, defer — adopt 30% now\
  \ (if I trust the expert).\n\nHmm, but Reflection as van Fraassen states it is about\
