  \n- Al-Ghazālī's occasionalism: verdicts on cases about causation. E.g., does the\
  \ fire burn the cotton? Cases: regularities, constant conjunction, miracles, the\
  \ possibility of a body that resists fire. Hmm — but \"verdicts on cases\" — could\
  \ ask: given my intuitions about various cases (a kettle boils, a magician makes\
  \ water freeze, a person's intention moves their arm, a placebo heals), what principle\
  \ about causation captures them? Actually that could be fun but the occasionalism\
  \ domain is quite specific.\n\n- Dennett on counterfeit people: verdicts on cases\
  \ about whether something is a person / has beliefs / deserves moral consideration.\
  \ Cases: AI chatbot, a very convincing robot, a human in a coma, a corporation,\
  \ an ant colony, a person with severe dementia, a zombie. That's a nice fit too.\n\
  \nI think van Fraassen's Reflection principle gives the crispest \"verdicts on cases\
  \ → principle\" structure, and there's a real tension: the principle \"I ought to\
  \ defer to my future credences\" vs. cases where the future self is known to be\
  \ defective (drunk, drugged, brainwashed), cases where the future self's credence\
  \ is based on the very fact that I now have a certain credence (self-fulfilling\
  \ / evidence about the reliability of the process), etc.\n\nActually, let me think\
  \ about which one I can make \"in the weeds\" without needing citations. The Reflection\
  \ principle: van Fraassen formulated it as: P_t(A | P_{t'}(A) = x) = x, for t' >\
  \ t. Cases where it fails: (a) I know that tomorrow I'll be drunk and will think\
  \ I can fly; (b) I know I'll be brainwashed by a cult; (c) the \"forgetting\" case\
  \ — I know I'll have forgotten the evidence, so my future credence will be lower;\
  \ (d) Sleeping Beauty-like cases; (e) cases where my current credence is itself\
