  can be true or false" and "the theory says agents behave as if A." Also the distinction
  between "assumptions as premises" (used to derive predictions, so falsity threatens
  the derivation — this is the "paradox of falsity" / logical problem: false premises
  can''t guarantee true conclusions) versus "assumptions as a domain restriction"
  / "assumptions as approximations."


