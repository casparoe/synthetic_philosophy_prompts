  ---

  I''m setting the final for an upper-level philosophy of science course on models
  and idealization, and I want one 50-minute essay question built around a case of
  my own rather than the usual textbook examples. Here is the case:


  A fisheries model used to set catch quotas assumes (a) that the stock is large enough
  that no single boat''s catch measurably affects it, so that fishing effort can simply
  be aggregated; (b) that fishers know next season''s stock size exactly when they
  choose their effort; and (c) that the fleet''s behaviour can be represented by a
  single representative fisher whose preferences are the average of the actual fishers''
  preferences. All three are false in the intended applications; the model nonetheless
  predicts landings well in the historical period on which it was fitted.


  Write the essay question, a model answer of about 700 words, and a marking scheme
  worth 20 marks.


