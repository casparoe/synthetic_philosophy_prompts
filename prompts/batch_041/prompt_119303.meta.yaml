  Hmm, but is that the confusing passage? The confusion I want the student to have:
  Hume''s argument seems to give two different accounts — (a) national character arises
  from "moral causes" (institutions, government, etc.) working on individuals, and
  (b) national character arises from imitation/contagion/sympathy, i.e., people in
  a political body converge on a common set of manners. And the student is confused
  because (b) looks like it makes national character a matter of a "contagion" that
  runs through a society, which seems to be a third kind of cause, and it seems to
  undercut the idea that national character is explained by environment at all — it
  seems almost to make national character a self-perpetuating social artifact, so
  why does Hume call the causes "moral"? And what''s the difference between "moral
  causes" that "work on the mind as motives or reasons" and mere imitation/contagion
  which is not a motive or reason? That''s a genuinely nice interpretive puzzle: Hume
  defines moral causes as circumstances fitted to work on the mind as motives or reasons,
  but then the mechanism he emphasizes — imitative sympathy/contagion — is not obviously
  a matter of motives and reasons. So there''s a tension. Also, the whole passage
  aims to rebut physical causes, but the imitation mechanism is offered as the explanation
  of national character... and it presupposes that nature produces "all kinds of temper
  and understanding" — i.e., individuals vary, but the national uniformity is imposed
  by communication. So national character is a real but superficial convergence.


