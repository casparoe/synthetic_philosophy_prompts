  the paradox is not a real contradiction but a confusion about the model-relative
  nature of cardinality. A first-order theory like ZFC can have a countable model,
  and that model can still satisfy a sentence saying there are uncountable sets, because
  the bijection that would make the set countable from the outside is not an element
  of the model. Countability is not an absolute property of a set; it''s relative
  to a model or a language. The model''s power set of omega is countable from our
  metatheoretical vantage point but uncountable from the model''s own vantage point,
  and that''s the whole story. I find this deflationary line pretty convincing, but
  I''m aware it might be too neat.


  What I want from you is a map of what would count against it. Suppose the deflationary
  view is wrong, or at least incomplete. What observations, formal results, or philosophical
