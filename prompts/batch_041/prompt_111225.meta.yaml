  defended without treating the counterfactuals of creaturely freedom as grounded
  either in God''s creative decree or in the creature''s essence or dispositions.
  On my view, such counterfactuals are brute but semantically determinate truths about
  what a possible free creature would do in a complete set of circumstances; God knows
  them, and actualises a world on the basis of them, but does not make them true.
  I claim this preserves a robust libertarian freedom, blocks the standard grounding
  objection, and still gives God providential control. The argument proceeds by distinguishing
  the truth-conditions of a counterfactual from its truth-makers, by treating the
  counterfactuals as members of a restricted class of contingent truths about possibilia,
  and by showing that the openness of the future is compatible with the determinate
  truth of counterfactuals about non-actual circumstances.


