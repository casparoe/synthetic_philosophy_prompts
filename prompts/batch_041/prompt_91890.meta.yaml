  in the modern liberal sense — he was a utilitarian, and he explicitly rejected natural
  rights as "nonsense upon stilts." So a summary that frames him as a proto-liberal
  rights advocate for sexual freedom would be subtly wrong. He grounded it in utility:
  pleasure vs. pain, the harm principle-ish, but also he was quite willing to be a
  legislator who would regulate in other areas.

