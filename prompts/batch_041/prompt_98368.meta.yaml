  Let me draft the PD desiderata prompt:


  "I''m putting together a seminar on the evolution of cooperation, and before we
  evaluate any of the competing models I want a clean statement of what an adequate
  theory in this area would have to deliver. Please write the desiderata: the phenomena
  it must explain, the cases it must get right, the distinctions it must not collapse,
  and the results it must be consistent with — each with the consideration that makes
  it a requirement rather than a preference. ..."


  Phenomena/cases:

  1. One-shot, anonymous PD: the unique Nash equilibrium is mutual defection; yet
  in lab experiments a substantial fraction of people cooperate. The theory must say
  whether this is a failure of rationality, a failure of the model, or a different
  game.

  2. Iterated PD: cooperation can be sustained by the shadow of the future (folk theorem),
  but the folk theorem also says almost anything can be an equilibrium; the theory
  must explain selection among equilibria, not just their existence.

  3. The "shadow of the future" must be long enough; must explain the "endgame" unraveling
  (backward induction in finitely repeated PD with known horizon).

  4. Errors/noise: TFT is not robust to noise; the theory must handle the fact that
  real interactions are noisy (generous TFT, win-stay-lose-shift).

  5. Distinguish cooperation from altruism: in biology, "cooperation" can be mutually
  beneficial or altruistic; Hamilton''s rule. The theory must not conflate.

  6. Kin selection, reciprocity (direct/indirect), network/spatial reciprocity, group
  selection — the theory must locate which mechanisms do the work and not double-count.

  7. The "second-order free-rider problem" for punishment: if punishment sustains
  cooperation, who punishes the non-punishers?

  8. Scaling: humans cooperate with non-kin at large scale; the theory must explain
  the "ultrasociality" and the role of norms, reputation, and institutions.

  9. Conditional cooperation: cooperation is often conditional on beliefs about others;
  this makes cooperation partly a coordination problem.

  10. Consistency with behavioral data (public goods games, "crowding out," etc.)


  Distinctions not to collapse:

  - Cooperation vs altruism vs mutualism.

  - One-shot vs repeated (and the theory must not assume repetition to explain one-shot).

  - Individual selection vs group selection (and the accounting).

  - Rational choice vs evolutionary dynamics (the theory must be clear which it''s
  doing).


  Results it must be consistent with:

  - The folk theorem.

  - Backward induction / Selten''s chain-store paradox style unraveling.

  - Hamilton''s rule.

  - The fact that defection is dominant in the one-shot PD (dominance).


  Tensions:

  - "Explaining observed cooperation in one-shot anonymous PD" vs "accepting that
  defection is dominant" — jointly unsatisfiable unless you change the game or the
  rationality assumption. This is the key tension.

  - "Selection among equilibria" vs "the folk theorem''s indeterminacy."

  - "Explaining large-scale cooperation" vs "not assuming the very norms/reputations
  that need explaining."


