  the one nobody else was working on, is made against a background that made it available;
  if the background explains the discovery, then the lone worker is a courier too.
  So no one deserves credit for any discovery.

  (7) And nothing about discovery is special. Every painting, reform, and institution
  is the upshot of conditions that would have produced something like it, so no one
