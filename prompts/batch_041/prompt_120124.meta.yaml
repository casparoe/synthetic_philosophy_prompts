  literature, and the state of the problem had made it available to anyone competent
  to look.

  (2) If the result was available to anyone competent, then what explains its being
  found when it was found is the state of the field, not the particular person who
  found it.

  (3) So had A not found it, B or someone like B would have, at more or less the same
  time; and had B not, A or someone like A would have. The individual is a courier,
  not an author.

