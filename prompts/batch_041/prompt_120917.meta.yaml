  Key features of the handicap principle:

  1. Signals are costly, and the cost is *differentially* higher for low-quality signallers
  (single-crossing / Spence-Mirrlees condition). That''s what makes the signal honest.

  2. Zahavi''s original claim: the signal *is* a handicap — it reduces fitness — and
  honesty comes from the handicap itself. Critics (Maynard Smith 1976 "Sexual selection
  and the handicap principle", or actually Maynard Smith 1976 "Sexual selection and
  the handicap principle" in J. Theor. Biol.) argued it doesn''t work as stated; Grafen
  formalised it.

  3. The "index vs handicap" distinction: an index signal is one whose production
  is causally tied to quality (e.g., body size determines voice pitch), so it can''t
  be faked without the cost of actually being that quality. Handicap signals need
  differential cost. There''s a debate about whether these are really distinct (e.g.,
  Getty''s "handicap signalling" papers; Hurd 1995; Lachmann et al.).

  4. Honest signalling equilibrium requires that receivers benefit and that the signal
  be costly enough.

  5. Amplifiers, strategic ambiguity, etc.


  In PoW:

  1. Cost is burned; the cost function is essentially identical for all miners (hash
  rate per joule), so no single-crossing — the "cost" doesn''t vary with any quality
  of the signaller.

  2. But wait: PoW *does* have a differential cost if you consider that miners with
  cheaper electricity (better hardware) can mine more cheaply — that''s a quality
  difference (access to cheap energy) that the signal reveals. Hmm, so there is a
  partial analogue. Interesting — the answer could note this.

  3. The residue: the receiver''s benefit in biology is information about the signaller''s
  type; in PoW, the receiver''s benefit is Sybil resistance / immutability, not information.
  The signal is not informative about the sender at all (well, except cheap energy).
  And the biology debate is about *information content* and *deception*; PoW has no
  deception notion — a valid block is valid.

  4. Also: in biology, the signal must be *observed* and interpreted by a receiver
  with interests (mate choice, predator deterrence); in PoW, the "receiver" is a rule-following
  algorithm, no preferences.

  5. And the deepest residue: Zahavi''s "handicap" idea that the cost *is* the message
  — the peacock''s tail is a burden that says "I can afford it". In PoW, the cost
  is also the message ("I burned X"). So that translates. But the biological notion
  of "quality" (fitness, viability) has no counterpart except hashrate.

  6. Also, "the handicap must be *differentially* costly, and the equilibrium requires
