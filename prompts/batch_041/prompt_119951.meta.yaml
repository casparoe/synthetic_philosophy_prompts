  I run a small philosophy-of-mind reading group that doubles as a podcast, and our
  next guest is a philosopher who has spent the last few years defending a version
  of epiphenomenalism about phenomenal properties — the view that experiences are
  caused by physical goings-on in the brain but are themselves causally inert, never
  figuring as causes of anything, including our own reports of them. What makes him
  interesting to book is not the base view (which we''ve covered) but his distinctive
  answer to the standard objection, the one usually called the paradox of phenomenal
  judgment: if experiences never cause anything, then my judgment that I am presently
  seeing red is caused entirely by whatever brain state produced the experience, and
  it looks like a small miracle — a coincidence — that the judgment should be an accurate
  judgment about the experience rather than a blind firing that happens to run alongside
  it. His line is that the objection smuggles in an assumption, namely that a judgment
  can be about an experience, or justified by it, only if the experience causes the
  judgment. He wants to replace causation with two other relations. First, he says
  the experience and the judgment are not cause and effect but joint effects of a
  common neural cause, so the reliable correlation between them is underwritten by
  the shared physical base rather than by any causal link between them. Second, he
  says that in the first-person case the judgment is not a separate inner utterance
  that has to be hooked up to the experience; the experience partly constitutes the
  judgment, so there is no gap for a causal connection to bridge. He is also fond
  of saying that his view leaves the epistemology of consciousness exactly where externalist
  theories of content leave the epistemology of ordinary perception, and that people
  who accept the latter while rejecting the former are applying a double standard.
  He is a careful and slightly combative interviewee: he will happily grant that zombies
  are conceivable and that his view cannot explain why the correlation holds rather
  than not, and he will then say that neither can anyone else.


  I''d like a set of questions for a forty-minute interview that lets him state the
  view once and then spends its time where the pressure actually is. Please give me,
  in this order: a "Framing" section of two or three sentences I can read aloud to
  set him up for the audience; a "The common cause reply" section with three questions
