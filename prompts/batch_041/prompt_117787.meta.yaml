  I''m running a reading group for grad students in philosophy of biology and we''re
  doing the ''what is life'' thing next month. Every time we do this people just recite
  the definition they heard first and then we argue about viruses for an hour, so
  this time I want a decision tree instead of a list. Can you build it?


  Format: internal nodes are questions about concrete cases, leaves are definitions
  of life. About seven or eight leaves, no more, and at least a couple of the leaves
  should be positions that don''t get a name in the usual encyclopedia version of
  this debate.


  Cases that have to appear somewhere on the tree, because they''re the ones that
  actually split people:


  - a mule: alive, sterile, no descendants ever

  - a prion: makes more of itself by reshaping other proteins, no metabolism, no nucleic
  acid

  - a virion sitting on a table vs. the same virion''s genes running a cell

  - a bacterial spore: metabolically inert, no growth, can sit for a century and then
  wake up

  - fire

  - a transposon copying itself around a genome

  - a stripped-down lab bacterium with a few hundred genes that dies unless you feed
  it exactly the right medium

  - a lichen (one organism or two?)

  - something from a shadow biosphere with a completely different biochemistry


  Some ideas I want you to build in, since they cut across the usual textbook axes:


  1. the ''no definition, give me a theory'' move: the thought that any definition
  we write now is premature because the whole point of a theory of life is to tell
  us what to look for, and that we should maybe adopt a neutral placeholder term for
  whatever the theory eventually picks out instead of fighting about the word ''life''

  2. a ''how hard was this thing to build'' criterion: count the minimum number of
  joining steps needed to make the molecule from simple building blocks, and say that
  anything past some threshold is too improbable to have arisen without a long history
  of selection. Ask what that criterion says about the prion and about fire (which
  is presumably cheap to build).

  3. teleology: life as the kind of system that maintains itself and for which things
  can go well or badly for it, as opposed to a merely chemical description. Fire consumes
  and spreads; can fire be said to do well or badly?

  4. the weird fact that bacterial and archaeal membranes are built from mirror-image
  backbones with different linkages, so it''s genuinely unclear whether the last common
  ancestor had a normal membrane, a leaky one, or whether membrane chemistry evolved
  twice. If you want, use that as the ''different biochemistry'' node.


  Rules for the tree:


  - nodes are phrased as contrasts or cases a person can answer without knowing which
  leaf it leads to. Bad: ''do you think viruses are alive?'' Good: ''the spore and
  the virion are both inert; is the difference that the spore carries its own restart
  program, or that the spore is a stage of something that was already alive, or neither?''

  - build it from the logical space first, then drop the actual positions into it.
  Note which combinations of answers are unoccupied and say whether that''s because
  they''re incoherent, unattractive, or just not explored.

  - flag any leaves your tree can''t separate (I suspect the autopoiesis-ish leaf
  and the plain metabolism leaf might not come apart on any of these cases).

  - each leaf gets a name (or ''unnamed'' if nobody defends it) plus one sentence
  on its most awkward commitment.

  - no citations, no reading list, I don''t need to know who said what.


  Audience is grad students, some with a bio background, so you can assume they know
  what a transposon is, but write the node questions so that a smart non-biologist
  could answer them.


