  Premises list:

  - What an agent does is fixed by what he intends, and the intention includes what
  he intends as a means, not just his ultimate end. Killing innocent people as a means
  to some further good is murder, however good the further good is.

  - Effects that were foreseen but not intended (the deaths you would have prevented
  if you could, but which you did not need and did not aim at) are a different case;
  but this distinction is routinely abused, and it does not survive the agent needing
  the deaths to get what he wanted.

  - The agent''s own answer to the question why he acted is the primary evidence of
  what he did — the description under which the act is intentional — and the committee
  should look for that answer before it looks at consequences.

  - Consequences do not settle it: it is no answer that the bombing shortened the
  war, or that more would have died otherwise. This is the premise that most of my
