  What is the presumption of independence? In logical uncertainty / heuristic arguments:
  When you reason about a mathematical statement you haven''t proven, you use heuristic
  arguments — informal probabilistic reasoning ("this is probably true because a random-ish
  object would satisfy it"). The "presumption of independence" is the principle that
  different "computations" or facts are independent unless proven otherwise — i.e.,
  when estimating the probability of a conjunction, treat components as independent.
  In Garrabrant''s logical induction / "heuristic arguments" framework, the presumption
  of independence is a key desideratum: a reasoner should treat the truth-values of
  unrelated mathematical statements as independent, because there''s no reason for
  correlation. This gives you "probabilistic reasoning about math."


  The "proves too much" argument: The presumption of independence, applied to a statement
  like "the billionth digit of pi is 7" and many similar, yields credences that are
  "correct" — but if you presume independence, you''d assign high credence to the
  conjunction of many independent-looking claims; and crucially, for a statement that
  is a tautology or contradiction but "looks" independent, you''d get inconsistency.
  Example: the statement "P and not-P" is logically impossible, but a naive independence-based
  estimator might assign it positive credence; if you presume independence you''d
  be vulnerable to a Dutch book / you''d assign positive credence to a contradiction,
  violating coherence. But the standard fix: deductive closure. Hmm.


  A cleaner "proves too much": The presumption of independence, if taken as a general
  principle, says you should treat "computations" as independent. But consider a computation
  that you can run in two ways, or a statement and its negation — they can''t be independent.
  Or: consider "X and X" — same fact, can''t be independent. The framework handles
  these. Hmm.


  Better: the "proves too much" is that if you presume independence, you''ll assign
  credence to unproven statements that could be false; and you''ll be exploitable
  by a "logical adversary" who knows the answer: e.g., a bookie who knows the truth
  of a mathematical statement can extract money from you because your credences on
  logically related statements aren''t consistent. This is the classic problem with
  logical uncertainty — you can be Dutch-booked on logically equivalent statements.
  So the argument: (1) A rational agent''s credences should be coherent (avoid Dutch
  books). (2) Presuming independence leads to assigning different credences to logically
  equivalent statements (e.g., "the 10^100th digit of pi is 7" vs. some convoluted
  equivalent formulation). (3) Therefore a presumption-of-independence reasoner is
  incoherent, so irrational. (4) But any reasoner with limited computation must be
  so; so coherence is unattainable; (5) Therefore the standard coherence requirement
  is too strong / "proves too much" — it would rule out any bounded reasoner.


