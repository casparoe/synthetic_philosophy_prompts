  Popper''s Poverty of Historicism key claims:

  1. The anti-naturalistic doctrines: historicism as a doctrine that social science
  should use the methods of physics (naturalism), and the opposite doctrine that social
  science can''t use them (anti-naturalism). Actually Popper''s book is structured:
  anti-naturalistic doctrines of historicism (that social science differs from natural
  science because of the impossibility of experiments, the complexity of social phenomena,
  the "whole," intuition, etc.) and naturalistic doctrines (that social science should
  aim at large-scale forecasts, historical laws).

  2. The central argument: history depends on the growth of knowledge; we cannot predict
  the growth of knowledge; therefore we cannot predict history. (This is the "thesis"
  of the book, in the introduction.)

  3. The distinction between laws and trends: trends are not laws. A law is universal
  and conditional; a trend is an existential/particular statement ("there is a trend
  toward X in period P"), which is not a law and cannot ground unconditional prediction.
  Trends depend on initial conditions.

  4. Holism: the "whole" of society cannot be the object of scientific study; the
  holistic Utopian approach vs. piecemeal social engineering.

  5. The critique of the doctrine of "unconditional prediction" and of prophecy.


  Now, in ML/forecasting vocabulary:

  - Law vs trend: in time series, a "trend" is a deterministic or stochastic non-stationary
  component; a "law" would be a stationary, invariant mechanism that is stable under
  intervention (cf. invariance, causal structure). Popper''s point that trends are
  not laws maps onto: a fitted trend extrapolates only under the assumption that the
  generating structure persists; it''s conditional on the regime. Popper says historical
  trends depend on initial conditions and are not universal — maps onto "the trend
  is a conditional prediction given initial conditions and the regime."

  - The unpredictability of the growth of knowledge: the target system includes an
  agent whose future behavior depends on what it will come to know; the model''s parameters
  are functions of the model''s own outputs (reflexivity / performativity). Maps onto:
  non-stationarity generated endogenously, i.e., the data-generating process changes
  as a function of what''s learned — which is like the Lucas critique and like "predictions
  that change the system."

  - Holism: you can''t model the whole; but ML people would say "we model subsystems
  with boundaries." Popper''s anti-holism says the whole isn''t a natural unit — maps
  onto the choice of system boundaries being pragmatic, not given.


