  The numbered argument:


  (1) Superrationality: in a symmetric problem, an agent should choose the strategy
  that maximises expected payoff on the assumption that every agent in the same problem
  chooses the same strategy. (Definition.)

  (2) The Platonia dilemma is such a problem: twenty people, a billion dollars to
  whoever alone wires a telegram by noon, more than one wire or none means nothing
  for anyone, and no communication. All twenty choosing "wire with probability 1/20"
  maximises each one''s expected payoff among symmetric profiles; the winner is determined
  by chance, and each of the twenty expects roughly nineteen million dollars.

  (3) That recommendation does not rest on any causal influence of my rolling a die
  on anyone else''s rolling a die. The twenty randomisations are independent, and
