  is well-supported; the homicide rate in medieval and early-modern Europe was many
  times the modern rate, and the fall is too large and too consistent to be an artifact
  of better record-keeping. (2) The right measure is violence per capita, because
  what the question asks is the risk that any given person will be killed or assaulted;
  absolute body counts are irrelevant to that question and mostly reflect population
  growth. (3) The decline is a brute empirical fact once you fix a definition of ''violence''
  — the value-ladenness of the word doesn''t make the trend indeterminate.


  The historian''s replies, in order: (1) The comparison is between a measured rate
  and a reconstructed one; medieval figures are extrapolated from fragmentary records,
  so we''re comparing a number with a guess, and the apparent decline could be an
  artifact of the very state-building that made records better. (2) Even granting
  the per-capita decline, per capita is not obviously the morally relevant measure;
  if what we care about is the total quantity of suffering, the growth in absolute
  numbers matters, and ''is the world less violent'' is ambiguous between the two.
