  So disjunctivism must be false." That''s a confusion: disjunctivism allows that
  hallucinations are subjectively indistinguishable from perceptions; the disjunctivist
  only denies a common factor, not the epistemic indiscriminability. Actually, a disjunctivist
  can say the hallucinator is mistaken about whether they''re perceiving; that''s
  fine. The false presupposition is that disjunctivism entails that hallucinations
