  treating the argument from illusion as an empirical argument that perception is
  unreliable, and thinking disjunctivism is a form of "naive realism" that denies
  illusions exist. But maybe more subtle: The argument from illusion traditionally
  claims that in cases of illusion, the immediate object of experience is a sense-datum,
  and since we can''t tell illusion from veridical perception, we never directly perceive
  material objects. Disjunctivism responds by denying that veridical perception and
