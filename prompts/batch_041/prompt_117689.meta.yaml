  experientialism, on which the artistic value of a work is entirely fixed by the
  perceptual experiences it affords to an ideally sensitive and appropriately informed
  viewer, so that any two works that are indistinguishable in every perceptible respect
  have the same artistic value; and (2) historical achievement theory, on which artistic
  value also includes the value of having actually solved a problem or made a discovery
  in the history of the art form, so that the same perceptible object can have different
  artistic value depending on its causal history. I want a case where the two theories
  agree about every perceptible feature, every formal property, and every experience
  the works afford, and where the forger is just as skilled and just as original in
  execution as the original artist, but where the historical achievement theory still
  says the original is more valuable. The only difference between the two works should
  be that the original was made first and the forgery was made later, independently,
  without knowledge of the original. The case must not lean on the original being
  rarer, older, more famous, more influential, or legally protected; if any of those
  are needed, the case fails.


