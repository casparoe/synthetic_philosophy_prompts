  Essay: The Frame Problem Is Not About Frames


  The frame problem is usually introduced as the difficulty of representing what does
  not change when an action is performed. But this description lumps together three
  different difficulties. The first is the update problem: after an agent learns that
  it will rain, how does it know that the cat is still on the mat, that the treaty
  is still signed, and that its shoes are still by the door? The second is the relevance
  problem: how does it know which of its countless beliefs bear on whether to take
  an umbrella? The third is the salience problem: how does it know which changes matter
  for its goals? I argue that the first two are engineering problems, soluble in principle
  by default rules, caching, and attention mechanisms, while the third is not a problem
  about computation at all. It is the problem of specifying what matters, and no finite
  set of update rules can solve it without a prior specification of the agent''s project.


  Consider a museum guard robot whose task is to protect the paintings. When a fire
  starts, the robot must treat the fire as relevant. But it must also treat the color
  of its own uniform as irrelevant, even though the uniform is represented and even
  though its color may change if the robot passes under a colored light. The point
  is not that the robot cannot infer that the uniform''s color is unchanged. The point
  is that no formal rule tells it that uniform color is irrelevant to painting protection
  while fire is relevant, unless the task has already been described in a way that
  marks the difference. I conclude that the frame problem, properly understood, is
  a special case of the problem of relevance, and that AI has misdescribed it as a
  problem about non-monotonic logic.


