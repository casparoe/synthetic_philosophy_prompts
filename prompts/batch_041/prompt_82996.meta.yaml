  Draft:


  ---


  I chair the safety-standards review at a frontier AI lab — a standing committee
  of five that meets quarterly to decide which proposed safety measures the lab will
  actually adopt before its next training run ships. Our recommendations go to the
  board as the technical record; the CEO can overrule us, and has. We are stuck in
  a loop. Every slate turns into the same argument: the safety team proposes a measure,
  the product team replies that it is an alignment tax we cannot afford, and someone
  invokes what we have started calling the competitiveness constraint — the claim
  that a lab cannot unilaterally absorb a safety cost when rivals who decline it will
  convert the saved capability into a decisive lead, and that a world where the lead
  goes to the less careful lab is worse than a world where we are all slightly less
  safe. Nobody in the room can tell a genuine constraint from a negotiating position,
  so we relitigate the same measure three quarters running and then adopt it late,
  badly, and with an exemption.


  I want a decision procedure we can actually run, in one ninety-minute meeting, on
  each proposed measure, without pretending to knowledge we don''t have.


  Build it on this working taxonomy, which we have argued about but never written
  down. Classify the cost of a measure by who pays it: a common cost is borne by every
  lab deploying at this scale (a mandatory evaluation that everyone runs), so it creates
  no relative disadvantage and the competitiveness constraint is simply inapplicable;
  a unilateral cost is borne only by the adopter while rivals free-ride (forgoing
  a data source they continue to use); a progressive cost falls hardest on whoever
  is furthest ahead (a capability threshold that only the frontier model crosses).
  Then the procedure should carry the following questions, in order, each with a stated
  criterion for a sufficient answer and a stated stopping point: who pays; whether
  the cost is competitively decisive, which requires an explicit estimate of the relative
  capability or timeline gap against each named rival and an explicit statement of
  the uncertainty; whether rivals would adopt the measure anyway, because it is also
  good for them, or because it is a focal point, or because their own regulators will
  soon require it; whether the measure carries offsetting competitive benefits (trust,
  recruiting, regulatory goodwill, reduced incident exposure); whether adoption is
  reversible, so that a cheap-to-reverse measure can be taken now and revisited; and
  finally whether the measure is one that no lab can sensibly adopt alone, in which
  case the output is not a yes or no but a referral to a coordination path — an industry
  standard, a regulator, a mutual restraint — and the procedure must say what that
  path would have to look like.


  The procedure has to be honest about two things. First, every claim about what rivals
  will do is a prediction, not a fact, and the procedure must mark those steps as
  assumptions to be stated and defended rather than checked. Second, there is a point
  — I suspect it is the progressive-cost case — where the remaining question is not
  factual at all but is how much relative position we are willing to trade for how
  much safety, and the procedure must stop and hand that to a named human role rather
  than dress it up as a calculation.


  Then run the procedure on three measures and show me its output: (1) routing all
  chain-of-thought through a monitor, at a cost of about five percent on our internal
  benchmarks; (2) refusing to train on a large scraped corpus that our two nearest
  rivals continue to use; (3) a training-compute ceiling that, by construction, binds
  only on the lab currently in the lead. At least one of the three should come out
  against what the committee plainly wants, and I want to see you say so plainly.


  Finally, tell me what the procedure cannot do. If I run it honestly, will it ever
  license the leader to be the least safe lab in the field — and if so, is that a
  bug in the procedure or a property of the situation we are in?


  ---


