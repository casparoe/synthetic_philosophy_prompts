  Domain: the competitiveness constraint and the alignment tax.


  Key conceptual content:

  - Alignment tax: a safety measure imposes a cost on the adopter (capability, speed,
  cost, or breadth of deployment).

  - Competitiveness constraint: a lab cannot (or will not) adopt a measure if doing
  so cedes decisive advantage to rivals who don''t, especially if the rivals are less
  careful. The constraint is relative, not absolute: it''s about the gap.

  - Subtlety 1: some costs are absolute (everyone pays them) and some are relative
  (only the adopter pays). Only relative costs trigger the competitiveness constraint.
  So the first job of the procedure is to determine whether a cost is universal or
  unilateral.

  - Subtlety 2: even a unilateral cost may not be competitively decisive if the safety
  measure is cheap, if rivals would adopt it anyway (because it''s also good for them),
  if it''s a "focal" measure (coordination equilibrium), etc.

  - Subtlety 3: the competitiveness constraint is often invoked opportunistically;
  the procedure must distinguish a genuine constraint (would lose decisively) from
  a claimed one (excuse). Tests: Would a competitor adopt it? Is the cost recoverable?
  Does the measure also confer a competitive benefit (e.g., trust, regulatory goodwill,
  talent attraction)?

  - Subtlety 4: the constraint is a prediction about rivals'' behavior, which is unverifiable
  — so the procedure must separate what can be checked (own costs) from what must
  be assumed (rivals'' behavior) and flag the latter.

  - Subtlety 5: the "race" framing itself: the constraint says "if we slow down, they
  win"; but the counter is "if we all slow down, everyone wins," which requires coordination
  — the procedure should identify when the answer is "this needs a collective agreement,
  not a unilateral decision," i.e., hand off to a coordination body.


