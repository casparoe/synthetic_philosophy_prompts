  Classification of the cost of a safety measure (call it the "adoption cost profile"):

  1. Common cost — every lab deploying at this scale pays it (e.g., a mandatory eval
  that everyone runs). No relative disadvantage → the competitiveness constraint does
  not apply.

  2. Unilateral cost — only the adopter pays; rivals can free-ride (e.g., not training
  on scraped data). Relative disadvantage → constraint may apply.

  3. Progressive cost — the cost scales with capability/frontier position, so it falls
  hardest on the leader (e.g., a compute cap that binds only at the top). Relative
  disadvantage concentrated on whoever is ahead → constraint applies most strongly
  to the leader, which is also the actor whose safety matters most. This is the crux:
  the competitiveness constraint is strongest exactly where safety is most valuable.


  That''s a nice philosophical point: the constraint binds hardest on the frontier
  lab, which is also where defection is most consequential — so the constraint, if
  honored, guarantees the frontier is the least safe. Good.


  Test battery (the procedure''s questions, in order):

  - Q1 (Incidence): Who pays? If common → adopt (no constraint). If unilateral/progressive
  → go on.

  - Q2 (Magnitude): Is the cost competitively decisive? Estimate relative capability/timeline
  delta vs. each rival. Thresholds: negligible / recoverable / decisive. Need explicit
  uncertainty.

  - Q3 (Rival behavior): Would rivals adopt the measure anyway (because it''s also
  good for them, or because it''s a focal point, or because their own regulators require
  it)? This is an assumption, not a fact — flag it.

  - Q4 (Offsetting benefits): Does the measure confer competitive advantages (trust,
  talent, regulatory goodwill, reduced incident risk)? Net them.

  - Q5 (Reversibility / option value): Can the measure be adopted later at low cost,
  or is it a one-way door? Adopt-if-cheap-to-reverse.

  - Q6 (Coordination): If the measure is genuinely beneficial but unilaterally costly,
  is there a coordination path (industry standard, regulator, treaty)? If yes → hand
  off to coordination, don''t decide unilaterally; if no → the decision is a values
  question (how much safety to trade for how much competitive position), hand to a
  named human role.


