  Moore thinks the two things worth having for their own sake are the consciousness
  of beauty and the consciousness of personal affection (love/friendship, mutual and
  known to both sides). His famous move is the isolation test: take a candidate good
  and imagine it existing absolutely alone, with nothing else in the universe; if
  the total value of that isolated world is positive, the thing is intrinsically good.
  Apply it to beauty and he gets the result that a gorgeous world with nobody in it
  to see it is worth nothing at all — the value lives in the experience, not the object.


  That''s where my essay pushes. I want to run a three-step variant, call it the echo
  test. Step 1: a world with one person who deeply appreciates a beautiful thing and
  never tells anyone, never shares it, it''s entirely private. Step 2: same person,
  same beauty, but now the appreciation is shared — someone else appreciates it too
  and they both know it. Step 3: Moore''s mutual affection case, two people who love
  each other and each know the other''s love. Moore''s axiology puts a big gap between
  1 and 3 but treats 2 as basically 1 plus a bit — two private appreciations running
  in parallel, with the sharing being at most a nice instrumental extra. I want to
  argue that 2 is much closer to 3 than Moore allows, i.e. that the value of appreciation
  is partly second-personal even when the object is a landscape or a piece of music,
  and that Moore''s framework has no room to say this because he treats consciousness-of-beauty
  as a relation between one mind and one object.


  Then I want to claim the interesting consequence: if that''s right, Moore''s two
  goods aren''t two, they''re one good with two different objects — shared consciousness,
  where what matters is the mutuality, not whether the thing appreciated is a person
  or a sunset. And I''d argue that also explains why his treatment of friendship feels
  thin: he never asks what it is about two minds mirroring each other that''s supposed
  to be better than one mind plus one beautiful thing.


