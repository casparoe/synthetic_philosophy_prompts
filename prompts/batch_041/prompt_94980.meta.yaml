  Also add a disanalogy that matters: in school choice, the alternatives are not different
  children; the child exists prior to and independent of the choice, so she can later
  evaluate it; and the choice is revisable. In embryo selection, the choice determines
  which person exists — non-identity means the selected child can''t be said to have
  been harmed or benefited relative to nothing, so the "worse off" comparison is between
  persons, not within a person. Also positional/competitive goods: schools are partly
  zero-sum (ranked), so choosing the best school for your child may harm others; likewise
  a genetic advantage is positional — so the "best" reasoning has a collective action
  problem that the school analogy also has (which cuts both ways). Also: the "parental
  love is unconditional" norm — choosing a school for a child you already have is
  consistent with unconditional acceptance, whereas screening embryos is an act of
  ranking possible children, which arguably expresses conditional acceptance — though
  one might reply the parent doesn''t love the embryo but the child. Also: "environment
  vs constitution" — the school analogy treats the child''s traits as given and the
  environment as chosen; the whole point of the genetics case is choosing traits;
  so the analogy is silent on the very thing at issue (whether the traits are a legitimate
  object of choice). Also: "consent" — no one thinks a school choice requires the
  child''s consent, but the analogy''s target (designing the child) raises a different
  issue: not consent to the act, but the effects on the child''s autonomy/open future.
  Also "the child as a project vs the child as a gift".


