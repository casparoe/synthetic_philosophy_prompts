  the way there is something it is like to taste sugar. The pleasure I take in a friend''s
  good news is a pleasure, and it involves no sensation at all; it is a way of being
  pleased about something. Listening to a piece of music that moves me to sadness
  is a pleasure, though the very thing I am enjoying is the sadness. Scratching an
  itch is a pleasure, and so, people tell me, can be pain that one has come to want.
