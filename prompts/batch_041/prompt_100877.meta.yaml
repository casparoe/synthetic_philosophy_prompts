  Prompt:


  I''ve been sitting on our hospital''s ethics committee for about six weeks now—I
  got drafted because I teach intro bio and they needed a non-clinician—and its been
  a crash course in moral philosophy. Last month we had to allocate two ECMO circuits
  during a surge. The committee went with the rule that saves the most lives, so five
  patients got them over one. I was fine with that until a colleague, who reads alot
  of philosophy, said our rule proves too much. He wrote out this argument on the
  whiteboard and now I can''t stop chewing on it. I''d like you to help me figure
  out which step to give up and what it costs.


  His argument:


  (1) If the number of lives saved is a morally relevant consideration, then saving
  five lives is morally better than saving one life, all else equal.

  (2) If saving five lives is morally better than saving one life, then, all else
  equal, we ought to save five rather than one when we can.

  (3) If we ought to save five rather than one when we can, then we ought to bring
  about the five-saved outcome even when the only available way to do it is to kill
  one innocent person and use their organs to save the five.

  (4) We ought not to kill one innocent person to save five.

  (5) So the number of lives saved is not a morally relevant consideration.


  I can''t accept (5). I mean, I really can''t—it would mean the ECMO decision was
  a coin flip, and I don''t believe that. But (4) seems rock solid, and I don''t see
  how to deny (1) without saying numbers don''t matter at all. My colleague says the
  argument is airtight and that anyone who wants numbers to count has to bite the
  bullet on (3). I think something is off between (2) and (3), maybe something about
  the difference between choosing which person to save and choosing to kill someone,
  but I can''t articulate it without sounding like I''m just asserting a distinction.
  Also, if I reject (3), what do I say about cases where the only way to save five
  is to redirect a runaway trolley into one? That seems different, but I need to know
  why.


  Please give me:

  - The weak link (about 150 words): name the step you''d reject and state precisely
  what is wrong with it.

  - Why it looked fine (about 200 words): explain why that step seemed plausible,
  and why the argument is tempting even if it''s flawed.

  - The price list (about 300 words): for each of the other premises, say what it
  would cost to give it up instead, and what you''d have to accept. Include whether
  there''s a reading of the argument on which it''s valid and the real question is
  which premise is least costly.

  - Where I land (about 100 words): your verdict on whether numbers count, and what
  our committee should say the next time someone brings this up.


  A couple of things: don''t give me a bibliography or cite papers—I can''t look anything
  up right now and I don''t want names I''ll just nod along to. Just make the distinctions
  do the work. Also, I''m not a philosopher, so keep the jargon to a minimum, but
  don''t dumb it down.


