  Regress is vicious only if each further item is a genuinely new entity/commitment\
  \ (an ontological inflation), regardless of explanation.\"\n\nHmm, these overlap\
  \ a lot.\n\nBetter strategy: distinguish by \"which feature of the case matters\"\
  :\nRule 1 (type-based): benign iff the unifier is not itself one of the things being\
