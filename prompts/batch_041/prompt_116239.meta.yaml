  \ verdicts on regress arguments, and the new case be a novel proposal (the asker's\
  \ own or a fictional colleague's) that the person must judge. That injects something\
  \ new.\n\nLet me draft.\n\nSetup: I'm in a metaphysics reading group / writing a\
  \ dissertation chapter. A senior colleague (call her \"my supervisor\") has a settled\
  \ attitude to regress arguments. She's judged:\n\n1. Bradley's regress about relations\
  \ in Appearance and Reality: she says not vicious — Bradley was wrong to treat it\
  \ as showing relations are unreal. (Note: Bradley himself takes it as showing relations\
  \ are contradictory/appearance. She disagrees with Bradley's verdict.)\n2. Plato's\
  \ Third Man (in Parmenides): vicious, showing the theory of Forms as self-predication\
  \ + one-over-many is incoherent.\n3. Resemblance nominalism's regress (resemblance\
  \ between resembling tropes/particulars): not vicious — the account survives.\n\
  4. The regress for \"instantiation\" (a particular instantiates a universal; the\
  \ instantiation relation must itself be instantiated...): not vicious? Or vicious?\n\
  5. The regress about the \"unity of the proposition\" (if the proposition that aRb\
  \ is unified by a further relation, then...): not vicious.\n6. The regress of truthmaking\
  \ (truthmaker for \"p is true\" requires truthmaker for the truthmaking relation):\
  \ not vicious.\n\nHmm, I need the verdicts to be jointly consistent with more than\
  \ one plausible rule, and the new case should separate them.\n\nCandidate rules:\n\
  - Rule 1 (category/type rule): benign iff the unifier is not a further entity of\
