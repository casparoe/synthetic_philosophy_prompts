  \ what we started with — the regress is \"free\". Vicious iff each further item\
  \ is a genuinely new, independent commitment that must be added.\n- Rule 3 (dialectical/onus\
  \ rule): vicious iff the account's proponent needs the regress to stop (i.e., needs\
