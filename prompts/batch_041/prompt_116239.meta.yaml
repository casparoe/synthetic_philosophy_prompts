  \ Rule 2: the third man is a genuinely new commitment, not entailed by the original\
  \ (the regress generates new Forms, each a new commitment) → vicious. Both agree.\
  \ Resemblance nominalism regress: benign. Rule 1: the resemblance relation between\
  \ two tropes is just another trope, but... hmm, that would be \"same kind\" → vicious\
  \ under Rule 1. Hmm, need care.\n\nActually for resemblance nominalism: the regress\
  \ is that two resembling tropes resemble in virtue of a further resemblance trope,\
  \ which itself resembles them, requiring another... If she says benign, Rule 1 (unifier\
