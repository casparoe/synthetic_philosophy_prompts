  \ a different regress.\n\nMaybe I should choose a different domain to make this\
  \ cleaner. Let's reconsider the \"lessons of history\" domain — very natural for\
  \ verdict-prediction, with clear candidate rules.\n\nSetup: A foreign-policy analyst\
