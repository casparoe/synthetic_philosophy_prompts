  and China did not (the Needham question, or the Great Divergence) is really a question
  about the wrong contrast, and I want to see whether that can be made rigorous. Take
  the historical episode as given: around the middle of the eighteenth century, parts
  of the Yangtze delta and England had roughly comparable levels of commercialization,
  agricultural productivity, and living standards by some measures; by the middle
  of the nineteenth century, Britain had undergone an industrial revolution and China
  had not. Historians have proposed coal, colonies, institutions, property rights,
  the unification of the Chinese empire, the timing of the divergence, and the very
  choice of units as explanations. Analyze this episode through the lens of contrastive
  explanation. I want a disciplined mapping: what is the explanandum, what are the
  competing contrast classes (Britain vs China, England vs the Yangtze delta, Europe
  vs Asia, Britain vs the rest of Europe), what counts as a cause under a difference-making
  account versus a production account, and what the relevance relation is doing. Then
  tell me where the theory runs out: does the contrastive framework actually resolve
  the debate, or does it merely relocate it into the choice of contrast class, and
  are there features of the episode—macro-historical singular causation, absent causes,
  equifinality, the lumping problem—that the theory misdescribes or cannot handle?
