  I am in a graduate seminar on philosophy of history, and for the past two weeks
  we have been working through the contrastive account of why-questions—the idea that
  any why-question has a topic, a contrast class, and a relevance relation, and that
  what counts as an explanation depends on how those are set. Over dinner a friend
  who studies early modern China claimed that the famous Needham question, why Britain
  industrialized and China did not, is not a real question at all but a parochial
  way of projecting a European outcome onto the rest of the world; I want to know
  whether that charge can be made precise. Please take the historical episode itself
  as the case: around 1750, parts of the Yangtze delta and England had roughly comparable
  levels of commercialization, agricultural productivity, and in some measures living
  standards; by 1850, Britain had undergone an industrial revolution and China had
  not. Historians have offered coal, colonies, institutions, property rights, the
  unification of the Chinese empire, the timing of the divergence, and the choice
  of units of analysis as candidate explanations. Analyze this episode through the
  lens of contrastive explanation. I want a disciplined mapping—what is the explanandum,
  what are the competing contrast classes (Britain versus China, England versus the
  Yangtze delta, Europe versus Asia, Britain versus the rest of Europe), what counts
  as a cause under a difference-making account versus a production account, and what
  work the relevance relation is doing—and then an honest account of where the theory
  runs out. Does the contrastive framework resolve the debate, or does it merely relocate
  the dispute into the choice of contrast class? Are there features of the episode—macro-historical
