  else. What I want them to leave with is a working feel for the problem of old evidence
  as it arises in Bayesian confirmation — the puzzle that a fact already in one''s
  possession cannot raise the probability of a hypothesis, since one''s credence in
  the fact is already maximal, and yet we are all confident that cases are sometimes
  made out of precisely such facts. I have been calling the session the detective''s
  retroactive confidence, and I would far rather my writers felt the puzzle in their
  hands than learned to name its parts. So I am not asking you to explain the problem
  to me; I am asking you to plan how I should explain it.


  Give me the order in which the pieces must go, and why each must wait for the one
  before it — which idea has to be in place before the question can even be posed
  to this audience, and which apparent preliminaries are in fact traps. Then the example.
  More than anything else, the session will stand or fall on the single case I build
  it around, and I have a candidate from my own manuscript which I want you to rule
  on rather than assume: in the second chapter, casually, and treated by everyone
  including my detective as a piece of household colour, it is established that the
  dead man''s dog was found shut in the scullery; only in the final act does that
  detail become evidence, evidence that the caller the dog would have savaged was
  someone the dog knew well, and my detective''s confidence in her theory of the killing
  rises sharply although she has learned nothing whatever. Tell me whether that case
  can carry the whole two hours or whether it must be demoted to a subsidiary illustration,
  and if it cannot carry, supply the case that can — and in either event tell me what
  the carrying example must have and what it must conspicuously lack, and why.


