  I am a novelist — historical detective fiction, principally — and I have been asked
  to give a two-hour session at a week-long residency for working fiction writers:
  twelve of them, none with mathematics beyond secondary school, several of whom will
  regard any mention of probability as an intrusion on the business of writing, and
