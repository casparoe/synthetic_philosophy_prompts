  and his essay "Quining Qualia." Also his 1978 "Toward a cognitive theory of consciousness"
  and the 1991 "Two kinds of things" ... Hmm.


  Also relevant: the "phi phenomenon" (Wertheimer 1912) — pure phi is motion without
  object. Color phi is a variant.


  Also relevant: Libet''s experiments, the "backward referral in time" and the "subjective
  antedating" debate; Dennett''s discussion of "the subject''s report is the only
  data"; the "neural latency" issue — the second spot''s color information arrives
  ~... Actually the key argument: in color phi, the second stimulus is presented ~100-200
  ms after the first; the color change is perceived as happening at the midpoint of
  the motion path, which is before the second stimulus was presented. So either (a)
  the experience of the first spot''s redness was "held" and revised retroactively
  (Orwellian — after the fact rewriting of memory), or (b) the experience was delayed
  until after the second stimulus arrived, and then a fabricated narrative with a
  fake temporal order was constructed (Stalinesque). Dennett''s point: these are not
  empirically distinguishable because all evidence goes through the subject''s retrospective
  report; the "revision" happens either way; there''s no "actual" facts about the
  timing of experience to be right or wrong about. The distinction presupposes a Cartesian
  Theater with a finish line.


