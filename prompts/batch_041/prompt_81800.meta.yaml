  Let me think about the color phi phenomenon. It''s from Dennett''s "Consciousness
  Explained" (1991), where he discusses "Orwellian" vs "Stalinesque" revisions of
  experience. The color phi phenomenon: Kolers and von Grünau (1976) — two spots,
  one at left and one at right, alternating; if the spots are different colors, subjects
  report seeing the first spot change color midway along its apparent motion path
  — i.e., they see the left spot (say red) as red until the midpoint, then it turns
  green, then moves to the right. But that''s paradoxical because the color of the
  second spot can''t be known until the second spot is presented, so the "experience"
  of the first spot''s color-change seems to occur before the information was available.
  Dennett uses this as a case for the "Orwellian" (retroactive rewriting of memory)
  vs "Stalinesque" (delay, then construct a false story) distinction, and argues that
  there''s no fact of the matter which one is happening — the distinction between
  them is illusory because there''s no "finish line" of consciousness where the order
  could be determined.


