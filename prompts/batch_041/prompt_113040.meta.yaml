  Objections they''d raise (ordered by damage):

  1. "You''ve conflated explaining variance with identifying causes" — the microeconometrician:
  if we can identify local effects (e.g., from natural experiments), why does the
  unavailability of a global counterfactual matter? The variance decomposition isn''t
  the same as causal identification.

  2. Exclusion restriction on settler mortality: the instrument affects income through
  channels other than institutions (disease environment persists; also settler mortality
  predicts settlement patterns → human capital, infrastructure).

  3. Bad control: institutions mediate geography; conditioning on institutions removes
  the effect you want to measure.

  4. Culture endogenous to institutions and geography.

  5. External validity of the natural experiments (Korea, Germany, Nogales, the Acemoglu
  "colonial" cases): N=1, non-representative, "the effect of institutions at the margin
  ≠ the effect of the whole institutional difference".

  6. "Reversal of fortune" / persistence vs. change — the "reversal" shows institutions
  aren''t determined by geography, but the same data show institutions change, so
  what''s the counterfactual?

  7. The question "why are some nations rich" presupposes the nation-state as unit;
  the real action may be subnational (within-country variation) — and the "nation"
  is itself a product of wealth (border effects).

  8. Falsifiability / the "we can''t know" thesis is itself empirically empty — the
  pessimist''s claim must be distinguished from mere "we don''t know yet".

  9. Growth theory''s point: maybe the answer is boring (proximate: capital, technology,
  trade) and the "deep causes" are a philosopher''s question.

