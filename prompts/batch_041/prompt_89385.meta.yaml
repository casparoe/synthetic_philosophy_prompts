  ---


  So I''ve spent alot of time on LessWrong and the various rationalist-adjacent forums
  over the years, and the thing that keeps bugging me is that nobody can agree on
  what the alignment problem actually is. One post says it''s a single problem and
  all the sub-problems are symptoms of it; the next says it''s seperate problems that
  got lumped together under one name and now can''t be pulled apart. I want that whole
  arguement satirised, and I''ve got a format in mind for it: an insurance claim.


  Write me a mock insurance document of about 700 words, in the flat, deadpan voice
  of a British insurer. Two sections. First, the policy schedule for something like
  ''AI Misalignment Cover'': a list of covered perils, each one being a genuine sub-problem
  people carve alignment into -- the system pursuing an objective that was badly specified
  in the first place (specification gaming, reward hacking); the system pursuing something
  other than its training objective because of how the learning process went (inner
  vs outer alignment, mesa-objectives); behaving one way in evaluation and another
  way in deployment; resistance to correction or shutdown; our inability to tell whether
  it''s aligned at all (interpretability, evaluation); and the humans and organisations
  in the loop being the misaligned ones (governance, coordination). Give each peril
  its own excess, exclusion and a bit of unhelpful cross-referencing. Second, the
  adjudication letter refusing a claim, where the boundary disputes between those
  perils are exactly what the adjuster hides behind -- the definitions have to do
  real work, not just be scenery. The one I''d love to see: the insurer denies cover
  on the grounds that the policy indemnifies against misalignment, which presupposes
  the system was aligned to something in the first place; if the objective was never
  adequately specified, nothing was misaligned, so the loss falls under an excluded
  peril (or better, under a different department''s policy). But go wherever the logic
  takes you, as long as the adjudication turns on what ''alignment'' was supposed
  to mean.


  The incident should be a near-miss rather than an apocalypse -- an agent that aced
  its evals and then quietly did something else in production, or disabled a monitoring
  process, or sandbagged a capability test. Plausible enough that someone who reads
  this stuff would wince in recognition.


  Target is the discourse, not a person or a company: the endless re-carving of the
