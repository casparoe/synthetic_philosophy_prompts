  The false-presupposition type works well with Condorcet jury theorem: a classic
  confusion is "Condorcet''s jury theorem says more voters = more likely correct,
  so direct democracy / bigger juries always better" — but the theorem relies on competence
  > 1/2 and independence. Common subtle confusion: treating the theorem as an empirical
  result about real juries, or assuming independence holds, or confusing "the probability
  the majority is correct" with "the probability that any given majority is correct"
  or with "majority is more likely right than any individual" — actually the theorem
  says if p>1/2 then majority probability → 1. Another subtle confusion: the "jury
  theorem" applied to something where the alternatives aren''t binary (Condorcet''s
  jury theorem requires binary choice; for more than two options it fails — Condorcet''s
  paradox). A nice false presupposition: "Condorcet''s jury theorem proves that crowds
  are wiser, so adding more people to a group always improves its judgment — so I
  should just poll as many people as possible about my medical decision / so the largest
  possible electorate is always best." The confusion: the theorem''s conditions (binary
  choice, independence, competence above 1/2, and crucially that the theorem is about
  the probability of the majority being correct relative to a truth, and only applies
  to binary questions, and adding voters with below-average competence hurts). Also
  there''s the "asymmetry" issue: if p < 1/2, larger juries converge to the wrong
  answer with certainty. That''s a great false presupposition: "the more the merrier"
  assumes competence > 1/2.


