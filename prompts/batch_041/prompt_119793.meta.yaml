  1. Competence above 1/2 is an assumption, not a finding; if the group''s average
  competence is below 1/2, larger groups converge to certainty of the *wrong* answer.
  So "more is better" only holds conditional on p>1/2, which is exactly what''s in
  question.

  2. Independence is doing all the work; real voters share information, common biases,
  correlated errors, so the theorem''s conclusion doesn''t apply.

  3. Binary choice: the theorem is for two alternatives; with three or more options,
  majority rule can be intransitive (Condorcet''s paradox) and there''s no "the majority
  answer" to be correct.

  4. The theorem gives a probability that the majority is correct given each voter''s
  independent probability of being correct — it''s not a license to treat the majority''s
  answer as true, and it doesn''t tell you anything about any particular vote (no
  guarantee about the actual outcome; also the "correct" answer is defined exogenously).


