  \ Y, Z; add four or five more, and make sure at least two of the additions are ones\
  \ my students will not have heard of.\" That balances: the model can use its knowledge\
  \ but is anchored.\n\nAlso design the \"feeling the force\" mechanics: \nPhase 1\
  \ (10 min): silent individual sorting — each participant sorts 12 cards into LIVING\
  \ / NOT LIVING / NOT SURE, and writes on the back the single most decisive reason\
  \ for each borderline one. This generates personal stakes before group talk.\nPhase\
  \ 2 (20 min): groups of four must produce a one-sentence criterion plus a verdict\
  \ for every card; the criterion must be written on a sheet and posted. Rule: any\
  \ card the group marks NOT SURE must be assigned by coin flip to LIVING or NOT LIVING\
