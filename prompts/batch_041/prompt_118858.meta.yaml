  - A sterile organism: a hen (lays eggs but is itself... no).\n- A dead-but-intact\
  \ bacterium / a mummified cell (no metabolism, but structure intact)\n- A spore\
  \ (metabolically inert)\n- The biosphere as a whole (Gaia) — a single living thing?\n\
  - A \"self-replicating\" 3D printer or a von Neumann machine / a factory that builds\
  \ copies of itself\n- An AI that self-replicates and evolves (maybe too close to\
  \ the other domains)\n\nThat's a rich pool. The prompt should supply the pool in\
