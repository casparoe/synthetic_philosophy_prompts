  \ for the register; uncertainty is allowed in their heads, not in the document.\
  \ (Nice: forces the \"act as if there is a sharp line\" move.)\nPhase 3 (20 min):\
  \ adversarial trading. Each group receives another group's criterion. They must\
  \ (a) find a card in the shared pool that the criterion misclassifies, and (b) invent\
  \ one new case (real or conceivable) that the criterion misclassifies. Losers: the\
