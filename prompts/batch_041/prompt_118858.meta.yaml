  \ to use these) — good, since the designer (model) then doesn't need external knowledge,\
  \ and it injects specific, less-memorized cases (obelisks, virophages, Spiegelman's\
  \ monster, Buchnera, Cairns-Smith clay).\n\nHmm — should the asker provide the case\
  \ list, or let the model produce it? Providing some and asking the designer to include\
