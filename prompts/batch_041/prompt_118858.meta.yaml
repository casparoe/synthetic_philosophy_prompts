  not really about life.\"\nPhase 4 (debrief, 20 min): mapping.\n\nDebrief points:\n\
  - What happened: everyone could sort the easy cards; every disagreement was about\
  \ a case where the entity has some but not all the features. Ask each group to read\
  \ their criterion and count exceptions.\n- Two ways to go when a definition fails:\
  \ (i) keep the sharp line but accept that it is a decision, not a discovery (the\
  \ \"we stipulate\" move; note the charter's coin-flip rule as the analogue); (ii)\
  \ drop the sharp line — graded membership, family resemblance, prototype, cluster\
