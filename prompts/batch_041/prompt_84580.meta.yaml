  Hempel''s covering law model (1942 "The Function of General Laws in History"): an
  explanation is an argument whose premises include at least one general law and initial
  conditions; the explanandum follows deductively (or with high probability). In history,
  he admits laws are often not stated but "law-sketches". Prediction and explanation
  are structurally symmetric.


  Problems raised: (1) Explanations in history rarely cite laws and adding them makes
  the explanation worse/trivial (Scriven: truisms; the force of "because the peasants
  were starving" comes from the fact that starving people normally do revolt, and
  the explanation works by deviation from a norm); (2) the symmetry thesis fails (we
  can explain an eclipse but not predict the Great Depression reliably); (3) relevance:
  a barometer drop and a storm — a law-conforming argument can be given where the
  "law" is spurious (this is the standard counterexample to the DN model: the barometer''s
  falling doesn''t explain the storm though there''s a law-like regularity). (4) The
  explanandum is not given in advance.


  Narrative side: Gallie''s "followable" narratives; Mink: narrative is a "form of
  understanding" that is not reducible to a set of singular causal statements plus
  laws; White: emplotment; Danto: narrative sentences.


  Danto''s key: a narrative sentence has a subject term that describes an earlier
  event by reference to a later one ("The Thirty Years'' War began in 1618"; "Aristarchus
  anticipated Copernicus"). Therefore, at t, the complete description of what happened
  at t cannot include the descriptions under which later historians will explain it.
  So a "complete" account at the time (the ideal chronicler) is not history. Consequently:
  history''s explanations cannot be conceived as arguments whose premises are all
  available at the time of the event; and the explanandum is partly constituted by
  the narrative.


  Also there''s a "verificationist" issue: whether the covering-law model is a model
  of explanation-as-text or of explanation-as-causal-relation. Hempel''s model is
  about the logical structure of explanation sentences; the narrativists claim explanation
  is about the ordering of a narrative, and that ordering is not truth-functional
  — i.e., a narrative''s explanatory force is not preserved under logical inference
  / under arbitrary reordering of its sentences (this is a real point: the whole "narrative"
  is not decomposable into individual sentences each of which is true/false; the "meaning"
  of the narrative isn''t the conjunction of its sentences). Good: Mink''s claim that
  narrative is not a "logical conjunction" — the whole is not reducible.


  So the exam crux: The usual exam question is "state Hempel''s model and the objections".
  That''s regurgitatable. Instead, the crux should be: "Does the disagreement between
  the covering-law model and the narrative model concern what an explanation is, or
  what history is?" And more pointedly, a question that forces them to see the barometer
  case, the asymmetry, and the narrative-sentence point as three distinct challenges
  with different targets, and to say which one, if any, the covering-law model can
  absorb.


