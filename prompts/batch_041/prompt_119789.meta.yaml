  The problem of universals: core ideas — one over many; realism (transcendent/immanent),
  nominalism (class resemblance, predicate, concept, mereological), trope theory;
  the regress objections (the "third man"-like regress; the resemblance regress);
  Armstrong''s "states of affairs" as truthmakers; the "ontological free lunch"; the
  distinction between "sparse" and "abundant" properties (Lewis). The force of the
  idea: that something must be shared, and that the alternatives all pay a price.


  Activity design: "The Colour Board" or "The One Over Many Game."


  Setup: 5 tables of 4 participants (20 people), 60–75 minutes. Materials: a deck
  of ~40 cards, each card depicts an object with several features (colour swatch,
  shape, size, texture) — plus a "property ledger" (a big sheet listing candidate
  properties). Rules: each table must classify its cards into "kinds"; the ledger
  sheet is where they record which property they are using. Scoring: points for groupings
  that other tables independently match (coordination reward). Hmm, the "feeling"
  of universals: when two tables independently write "RED," they''ve committed to
  there being one thing they both mean. Then the twist: the facilitator introduces
  cards that are "borderline" (a swatch that two tables classify differently) and
  "relational" properties (bigger than the next card) and "dispositional" (would break
  if dropped) — forcing the question whether the property is in the object, in the
  comparison, or in us. Then a "trope" round: each table now must treat each card''s
  redness as a unique token, and the ledger gets a rule: you may only score if you
  can state when two tokens are "the same" — and the only available answer is "when
  they resemble each other," which requires a rule, which requires... the regress.
  That''s the in-the-weeds target: the resemblance regress and the "one over many"
  argument, and how trope theory and immanent realism respond.


  Hmm, that''s a lot of moving parts. Is it runnable? It could be, but it''s elaborate.
