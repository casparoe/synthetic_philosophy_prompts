  Alternatively, a cleaner universals activity: "The Sorting Hat with no Hat." The
  game: participants must sort objects into categories using only pairwise resemblance
  judgments, under a rule that they may not name any property; the facilitator (acting
  as "the ledger") records only the pairings. Scoring: the group is rewarded when
  a new object is placed in the same pile as the objects it resembles most. The trap:
  to score at all, someone must state a rule; any rule they state is either a list
  (which fails on new objects) or names a property (which the rules forbid). The discovery:
  they must smuggle in universals. Then the debrief: the one-over-many argument, the
  nominalist''s options (resemblance classes, predicates, concepts), and the regress.


