  Activity for the problem of universals: participants are given a deck of cards,
  each describing an object (a specific shade patch, a shape, a song, a person). They
  must form "kinds." Rules: they get points when their group is the largest "natural"
  class, and there''s a referee who accepts or rejects groupings. The twist: the facilitator
  introduces a "one over many" mechanic: any property that two items share can be
  "collected" by a player who claims it, and once claimed, the property token can
  be traded. Then the debrief: participants will have acted as though properties exist
  independently of the objects (they collected them), which is realism; but some players
  will have complained that a claimed property is just a name. Hmm, this could be
  muddled.


  Maybe a cleaner universals game: "The Resemblance Game." Each participant is a "resemblance
  nominalist" who may only compare pairs. The group must decide whether two items
  are the same colour/shape, but they can only compare a limited number of pairs.
  The structure: with only pairwise resemblance, you cannot explain why "x is red"
  is true of many things in a way that''s about the same thing. Then introduce a "trope"
  variant: each item has its own redness-token, and the group must decide when two
  tropes are "the same." The force of the idea: the one-over-many argument, and the
  discovery that resemblance itself is a universal (the "resemblance regress"), which
  is exactly the classic Russell/Price objection to resemblance nominalism. That''s
  genuinely in the weeds (the regress argument against resemblance nominalism), and
  a game could stage it: each time a participant tries to group by resemblance, the
  facilitator demands a rule for when resemblance holds, which requires another resemblance,
  etc. That''s a nice "infinite regress" mechanic — like the sorites activity, a game
  that keeps demanding more.


  Hmm, but the regress is a logical argument; staging it as a game with rules and
  payoffs: participants must justify groupings; the referee only accepts justifications
  of the form "a resembles b"; the group discovers they can''t ever state the rule.
  Then the debrief: that''s exactly the "resemblance regress," and the responses (Armstrong''s
  states of affairs, Price''s natural resemblance classes, tropes) are the escape
  routes. Could be good and quite in-the-weeds.


  Alternatively: an activity where participants have to act as nominalists and find
  that they cannot avoid invoking a universal — e.g., a "sorting rule" game where
