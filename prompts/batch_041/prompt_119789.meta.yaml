  State apology activity: a "Drafting the Apology" simulation. Participants: a fictional
  country''s delegation and a group representing descendants. The mechanic that generates
  the idea: the participants must produce a text that satisfies two conditions simultaneously
  — it must be *sincere acknowledgment* (it must not be strategically motivated) and
  it must *do work* (it must change the legal/moral situation). The activity is structured
  so that each attempt fails one horn: e.g., a clause that strengthens the acknowledgment
  of guilt triggers the compensation mechanism, so the delegation wants to soften
  it, while the descendants'' group reads softening as insincerity. The deeper in-the-weeds
  target: the "felicity conditions" for apology — that an apology is a speech act
  whose success depends on the standing of the speaker, and the *paradox of collective
  apology*: the state that apologizes is both the same entity that did the wrong (needed
  for standing) and a different one (needed to avoid the wrongdoer apologizing to
  itself). Also: the non-identity/descendant problem and the "who is owed" problem.


  I could design a very nice role-play: a fictional "Joint Commission" with roles:
  (1) the current government''s legal counsel, (2) the descendant-community representative,
  (3) a "successor-state" historian, (4) a foreign observer, (5) a domestic opposition
  politician. The commission has 40 minutes and must agree a text of ≤120 words, plus
  a decision on a material remedy. The hidden mechanic: the facilitator''s "rules
  of order" say that any sentence acknowledging "wrongdoing by the state" automatically
  triggers a clause (e.g., a binding arbitration clause in the commission''s charter)
  that transfers a fixed budget to the descendants'' group, and any sentence that
  does not use that phrase leaves the budget unspent. So participants face the choice:
  full acknowledgment (which the government side may see as capitulation, and which
  costs a fixed budget) versus a euphemism ("regret that events occurred") that preserves
  the government''s position but feels hollow to the descendants. Then a second round
  with a twist: a proposal to have the descendants'' representative co-author the
  acknowledgment... The force of the idea: that the value of an apology isn''t in
  the information conveyed but in the *change in normative status* — and that the
  instrumentalization of the apology (tying it to money) is precisely what threatens
  its sincerity. And there''s the deep point that an apology that is *guaranteed*
  to be given is worth less — the "unsolicited" condition.


  That''s genuinely rich. And the "what the activity cannot reproduce" note: the passage
