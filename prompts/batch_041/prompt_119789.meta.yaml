  own payoff do you deserve, given that your willingness to try hard is itself something
  you didn''t choose? The forced move: participants must, before the game, choose
  whether to sign a "pre-game redistribution contract" — but the twist could be: they
  get to renegotiate after seeing their die roll, which reveals the instability.


  Hmm. This is good, but "veil of ignorance" games are well-known. The instruction
