  Which domain combines best with a classroom activity? Options:

  - Access vs. phenomenal consciousness and GWT — could be a game about "access" vs
  "phenomenal" — e.g., participants report on their experience vs. what''s globally
  broadcast. A game where some participants must report and others must... Hmm.

  - Meritocracy and desert — role-play/deliberation about who deserves what. Good
  for a classroom activity. E.g., a hiring/promotion simulation where participants
  allocate rewards, then discover their judgments track luck, not desert. That''s
  a strong one: makes them feel the force of the arbitrariness of desert claims.

  - State apologies for historical wrongs — structured deliberation, role-play: a
  truth commission where participants must draft an apology, and discover the tension
  between apology as acknowledgment vs. apology as instrument of political closure;
  the problem of who can apologize for whom; the temporal problem (apologizing to
  descendants).

  - The problem of universals — a game where participants must categorize objects
  and discover the resemblance nominalism vs. realism tension. Could be done: a "sorting
  game" where participants must decide which items share a property; then it turns
  out... Hmm, this is interesting but tricky to stage.

  - What ''liberal'' means in Europe vs. America — role-play/deliberation with two
  delegations... could stage a cross-cultural misreading.


  Which one gives the best "feel the force of an idea" with rules and incentives that
  produce the problem?


  Meritocracy and desert is a great fit: a game where participants earn points through
  a mix of skill and luck, then must distribute a bonus. The idea: desert claims track
  control, and the game reveals that the "deserved" portion is unstable. But it might
  be a bit well-trodden (Rawlsian veil of ignorance games, "birth lottery" activities).
  The instruction says prompts should be in the weeds, not something models have seen
  a million times. A meritocracy game is a somewhat common classroom activity.


  State apologies: a structured deliberation/role-play — a simulation of drafting
  a state apology, with roles (government negotiator, descendant community representative,
  historian, foreign ministry lawyer). The force of the idea: that an apology must
  be both a speech act that constitutes a new relation and an acknowledgment of a
  fact; that the "who" problem (collective agency, successor states, non-identity
  of perpetrators) and the "what" problem (apology for the act vs. for the harm; apologizing
  to a people for what was done to their ancestors). Also the tension between apology
  as moral acknowledgment and as instrumental statecraft. That could be quite rich.
  But it might drift into a general deliberation.


  Access vs. phenomenal consciousness + GWT: A game about "access" — participants
  in a group where one member is designated "the workspace": information only counts
  as "conscious" if it enters the workspace. Could design a game where participants
  each hold partial information and the group must act; the twist: some information
  is "phenomenally present" to individuals but never gets broadcast. Hmm, hard to
  make participants "feel" phenomenal consciousness.


  The problem of universals: An activity where participants must sort a pile of objects
  into categories under rules, then get challenged: "you all agreed these are the
  same kind — but show me the kind itself." Actually a nice one: a sorting/pattern
  game where participants are told to find what items share; the game''s mechanics
  require them to act as though there''s a shared property, then a debrief about resemblance
  nominalism vs. realism. Hmm. Could be a good "in the weeds" choice: the problem
  of universals is rarely taught with an activity, and the "in the weeds" part could
  involve, e.g., the distinction between Aristotelian immanent realism and Platonic
  transcendent realism, and the "one over many" argument, plus the modern spin: Armstrong''s
  states of affairs, tropes (Williams, Campbell), and resemblance nominalism (Price,
  Rodriguez-Pereyra). A game could be: participants get a set of cards each with objects
  described by features; they must form groups of "things of the same kind"; the rules
  give points for larger groups. Then the twist: a card can be added that breaks their
  grouping, and there''s a "free rider" card that resembles several groups but belongs
  to none. This stages the problem: is there a real kind, or is it just maximal resemblance
  classes? Hmm, this may be hard to make crisp.


  Let me consider which activity can be designed with genuine rules and incentives
