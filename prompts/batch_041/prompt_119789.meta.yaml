  I think meritocracy/desert with a genuinely in-the-weeds target is very strong and
  reliable to design: rules, payoffs, debrief. And the "in the weeds" bit can be a
  specific theoretical distinction: the difference between desert and entitlement,
  plus the "institutional" vs "pre-institutional" desert issue, plus the point that
  the standard meritocratic defense relies on "effort" as the desert basis, and that
  this basis is unstable under the causal regress. Also there''s the "meritocracy
  is self-undermining" point from a certain famous book... careful with attributions
  (The Rise of the Meritocracy — Michael Young, 1958 — I could verify). I might avoid
  leaning on titles.


  Alternatively, the in-the-weeds target for meritocracy could be: the idea that desert
  judgments are "role-relative" — a person can deserve a prize in one respect and
  not another; and the distinction between "deserving" and "being deserving" (the
  "desert base vs. desert object" distinction). Or the distinction between comparative
  and non-comparative desert: "x deserves more than y" vs "x deserves a certain amount."
  Actually this is a rich in-the-weeds target: the debate over whether desert is comparative
  or non-comparative, and whether "desert" can survive the discovery that the distribution
  of talents is arbitrary.


  A concrete activity: "The Bonus Committee." Participants first play a short production
  task where they earn individual output, with two exogenous multipliers assigned
  randomly (one visible, one hidden). Then they sit as a committee to allocate a bonus
  pool. Rule: the committee must reach a unanimous allocation rule before the individual
  payoffs are revealed... then reveal. Hmm.


  Actually, a nice design that stages the *force* of the Rawlsian regress without
  being a veil-of-ignorance cliché: the "Merit Auction." Participants each are given
  a "talent" (a random multiplier), then they must bid/compete for a limited number
  of "positions" by expending effort tokens. Then after the game, the facilitator
  asks them to write down, for their own payoff, what fraction they deserve; then
  asks them to subtract: how much of your effort was chosen by you? Then the mechanic:
  the facilitator reveals that everyone''s effort tokens were themselves partly determined
  by a random draw they didn''t see. The force: the regression bites in the first
  person, and participants must decide how much of their own payoff they''ll voluntarily
  give up.


  Hmm — but "make participants feel the force of an idea" wants the rules to generate
  the problem. A neat mechanism for desert: make the game such that the winner is
  determined by a hidden coin flip that is presented as skill, so participants will
  rationalize their winnings as deserved; then the reveal produces the "force." That''s
