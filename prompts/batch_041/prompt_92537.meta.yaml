  Candidate 1 residue:

  - Credibility deficit → biased estimator with a prior; but: in statistics, bias
  is a property of an estimator relative to a truth, and it''s fixable by more data
  or better calibration. Testimonial injustice is not about accuracy — a hearer can
  be accurate in the aggregate and still wrong the speaker. There''s no "wronging"
  in the loss function.

  - Hermeneutical injustice → the hypothesis class is missing features; but statistical
  misspecification is a defect relative to an available truth; hermeneutical injustice
  is about a gap that is *socially produced* and asymmetrically so: those with power
  have the concepts. The statistical frame can represent "we lack the variables" but
  not "the lack is itself the product of who got to build the vocabulary".

  - The role of *identity* as a covariate: statistical fairness work treats group
  membership as a protected attribute in the model; epistemic injustice treats identity
  as the *mechanism* (the credibility economy). Also fairness metrics are about outcomes,
  not about the epistemic relation.

