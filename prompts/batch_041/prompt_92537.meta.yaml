  Candidate 5 residue:

  - GEB''s frame/outer/inner: a message''s meaning is located in layers: the inner
  message is the content, the frame message tells you how to interpret the inner message,
  the outer message is what the *form* of the message tells you (e.g., that it''s
  a well-formed formula of the pq-system, that it''s an English sentence).

  - Translation to protocol/data-format vocabulary: payload/body, headers/content-type,
  out-of-band conventions, magic numbers, schemas, protocol versioning, escape sequences,
  MIME types.

  - What survives: the layering, the regress (a frame message needs its own frame...),
  the "the outer message is the one nobody writes down" (implicit conventions = the
  outermost layer, e.g., "this is ASCII").

  - What doesn''t survive: GEB wants meaning to be an *objective* relation of isomorphism
  between a formal structure and the world, and it wants the frame message to be able
  to be *derived* — Hofstadter''s claim that meaning arises when a system''s symbols
  are isomorphic to (and causally coupled with) things, so that the "frame" is not
  just a convention but is itself a message with truth conditions. In protocol terms,
  everything is convention + a decoder that''s stipulated; nothing is intrinsically
  meaningful, and there''s no room for the claim that a message can be *about* something
  in a way that can be wrong about the world. Also the regress: protocols always bottom
  out in a physical layer that is *not* a message but is causally coupled — which
  is oddly like Hofstadter''s "causal connection" requirement. Hmm, that could be
  a "survives" point. Also: Hofstadter''s distinction between "the frame message and
  the outer message can be the same thing at different levels" (a message can be its
  own frame) has an analogue in self-describing formats (JSON Schema, self-describing
  data like a quine or a bootstrapping compiler) — nice.

  - Residue: the engineering vocabulary has no place for *misreading as a property
  of the message* vs. the reader; and no place for the claim that the outer message
  is *not* arbitrary — Hofstadter argues the outer message is determined by the structure
  of the inner message, hence "the meaning is located in the isomorphism" rather than
  in the convention.


