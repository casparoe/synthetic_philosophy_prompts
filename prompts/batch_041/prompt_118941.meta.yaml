  Skolem''s paradox: By Löwenheim–Skolem, if ZF has a model, it has a countable model.
  But inside that model, one can prove the existence of uncountable sets (Cantor''s
  theorem). So there''s a countable model containing a set that the model thinks is
  uncountable. Resolution: "uncountable" is relative to the model; the bijection witnessing
  countability is not in the model. Skolem''s own conclusion: set-theoretic notions
  are relative, no absolute sense of "uncountable" — a kind of relativism/skepticism.
  The realist response (e.g., in the philosophy literature): the paradox is not a
  paradox; the model''s membership relation is not the real membership relation, or
  the countable model is not the "intended" model; Skolem''s conclusion only follows
  if one assumes the model''s ∈ is the real ∈ (or if one assumes the domain exhausts
  the universe).


  The standard literature: Skolem 1922, "Some remarks on axiomatized set theory".
  Also Putnam''s "Models and Reality" (1980) — the model-theoretic argument. Bays''
  work. "Skolem''s paradox" SEP entry by Timothy Bays.


