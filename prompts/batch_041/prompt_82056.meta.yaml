  Hart–Devlin diagnosis options:

  1. Verbal: "morality" means positive morality (Devlin) vs critical morality (Hart).
  Different senses → talking past each other.

  2. Different questions: Devlin asks what a society may do to preserve itself (a
  question about social survival / the authority of the collective over the individual);
  Hart asks what the state may do to an individual (a question about the limits of
  coercion).

  3. Empirical: the disintegration thesis. Devlin asserts shared morality is necessary
  for society; Hart denies it''s been shown. If it''s empirical, it''s resolvable
  in principle by sociology — but neither side has done the work, and it may be unfalsifiable
  as stated.

  4. Normative bedrock: whether a shared way of life has value independent of the
  harms its disruption causes. Devlin treats social cohesion as an intrinsic good;
  Hart treats only harm to individuals as a reason. This is bedrock — neither can
  argue the other into it.

  5. Burden of proof: who must show that enforcement is/isn''t justified.

  6. Conceptual: what counts as "harm" — if offence/disgust counts as harm, Hart''s
  harm principle may actually license some enforcement; the debate may turn on a thick
  vs thin conception of harm.

  7. The "reasonable man" as a device: Devlin''s test defers to the ordinary person''s
  moral reactions; Hart''s objection is that this makes morality a matter of majority
  sentiment, which is exactly what''s in dispute.


