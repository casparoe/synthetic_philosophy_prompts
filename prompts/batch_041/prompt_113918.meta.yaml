  not a condition of the act''s success but of its non-defectiveness. So Alford plea
  is not that shocking for Searle; but the interesting thing is the institution requires
  the plea to be "voluntary" and requires a factual basis, i.e., substitutes objective,
  third-person conditions for the first-person sincerity condition. So the practice
  presupposes that the truth of the underlying propositional content is established
  by the state''s evidence rather than by the speaker''s avowal, and that the defendant''s
  role is not to inform but to consent/waive.


