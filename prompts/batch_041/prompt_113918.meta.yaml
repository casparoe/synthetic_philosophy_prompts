  vs. sentence meaning vs. institutional meaning. The defendant''s utterance means
  something in the institution that it doesn''t mean for the speaker — supports a
  conventionalist/rule-based account (Austin, Searle constitutive rules; or a "legal"
  theory of meaning like Hart''s internal point of view) over intention-based semantics.
  Also there''s a nice contrast: in the plea, the defendant''s intention to accept
  a sentence (his perlocutionary aim) is what matters, not his meaning.


  3. Commitment to the institution''s authority to redefine words: the legal system
  can make "guilty" mean not "I did it" but "I accept conviction" — presupposes something
  like legal positivism''s doctrine that legal terms have legal meanings fixed by
  rules, and that the same word can have a legal and an ordinary meaning (Hart''s
  "the law''s open texture" or the "internal/external" statement). Also connects to
  the legal-interpretation domain but I''ll keep it in speech acts.


