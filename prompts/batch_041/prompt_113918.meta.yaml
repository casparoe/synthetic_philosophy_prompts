  act with no sincerity condition at all — or treats the accompanying allocution as
  a separate act (a report/assertion) that can be false while the operative performative
  succeeds. The question is whether the practice presupposes that performatives generally
  have no sincerity condition, or only that institutional performatives (like "I do",
  "I bet", "I sentence") don''t. Since Searle distinguishes sincerity conditions as
  conditions on the psychological state expressed rather than on the act''s validity...
