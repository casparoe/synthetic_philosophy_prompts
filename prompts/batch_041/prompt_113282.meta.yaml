  still seems... off, in a way I can''t articulate. Then flip it: a guy who saves
  a stranger over his spouse and has *no* extra thought at all — just does it — is
  obviously a monster, and he''s exactly the case the ''extra thought'' framing says
  is clean. So the objection can''t really be about whether the thought is present.
  It has to be about something else — which thoughts are available to the agent, or
  what the theory does to the agent''s own standpoint, or something about the relation
  between the reasons that make an act right and the reasons the agent can act on.


  So my question: given that reframing, which of the open questions in this area actually
  matter most, and in what order should someone with ~18 months and no appetite for
