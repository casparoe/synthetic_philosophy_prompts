  The standard reading is: impartialist theories (utilitarianism especially) are objectionable
  because they force the agent to treat her own deepest commitments as just one input
  among others, and to have ''one thought too many'' — the extra justificatory thought
  — when she saves her own wife. Fine. But now take the committed utilitarian whose
  deepest project just *is* maximizing welfare. By the standard reading, the alienation
