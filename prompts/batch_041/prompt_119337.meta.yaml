  Both speakers are epistemologists who share a great deal. They both accept a knowledge-first
  framework, and they both accept that knowledge is the norm of assertion. Their disagreement
  concerns whether knowledge that P can be defeated by higher-order evidence, that
  is, evidence bearing not on P itself but on the reliability of the process by which
  the speaker came to believe P.


  The first speaker holds that knowledge that P confers a kind of immunity on the
  belief. Since knowledge is factive, and since (on this speaker''s view) a known
  belief is safe, any evidence suggesting that the belief was unreliably formed must
  itself be misleading; and it is not rationally required to reduce confidence in
  the face of misleading evidence. So once you know, you may rationally disregard
  the suggestion that your process was faulty.


  The second speaker holds that this cannot be correct. Consider an agent who knows
  what she sees, and who is then told by a wholly trustworthy informant that she has
  been given a drug that impairs the very perceptual faculty she is relying on. The
  second speaker maintains that the agent is rationally required to reduce her confidence,
