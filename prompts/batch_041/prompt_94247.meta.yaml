  that rational inconsistency is possible?" and "so the committee is actually rational,
  right?" The answer should correct: the paradox doesn''t "show" that; it''s a puzzle;
  it''s contested; the committee case might not be rational depending on the solution;
  also the committee''s collective belief may not be straightforwardly reducible to
  individual beliefs. The epistemic request: separate settled from contested, don''t
  present contested as consensus. The format request: table with columns. Good.


