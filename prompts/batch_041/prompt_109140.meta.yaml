  Interesting angle to build in (the "in the weeds" hook): Hardin''s lifeboat is a
  metaphor about nations admitting immigrants; the William Brown is a literal lifeboat
  where the problem was ejecting people already aboard, not admitting new ones. So
  the mapping question: does Hardin''s framework have anything to say about ejecting
  vs admitting? Hardin does briefly discuss jettisoning the dying passenger, so there''s
  a hook. Also, the crew/passenger asymmetry: Hardin''s lifeboat has no crew — everyone
  aboard is a "passenger" with equal claim; on the William Brown the crew kept themselves
  and threw off passengers, which contradicts the maritime duty Baldwin emphasized.
  Also the "who decides" problem: Hardin asks "which ten do we let in?" — the case
  answers with a substantive criterion (male, unaccompanied) rather than a lottery.
  So the prompt can ask about procedure vs substance, and about the moral difference
  between a lottery and a rule.


  Also ask: does the theory illuminate or distort? Hardin''s is a consequentialist/triage
  frame; the case''s moral weight seems to lie in the violation of a special duty
  (crew to passengers) — which is a deontological/role-based consideration the theory
  is silent on. And the law''s verdict (manslaughter, not murder; light sentence)
  suggests a hybrid: the act was wrong but excused/partially mitigated. Does that
  support or undermine Hardin?


