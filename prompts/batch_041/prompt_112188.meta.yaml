  "I am a philosophy professor, and next month I have to run the fourth session of
  an interdisciplinary workshop on evidence and policy: roughly ninety minutes, twenty-odd
  people, a mix of philosophy graduate students who have had a semester of normative
  ethics and economics and public policy students who do cost-effectiveness analysis
  for a living. The topic is the problem that has come to be called cluelessness:
  the thought that a consequentialist theory tells us to act for the best, and that
  in the overwhelming majority of our choices we cannot know which option is best
  — not merely in the ordinary sense of being uncertain, but in the sense that there
  is no defensible way to attach probabilities or to weigh the heterogeneous consequences
  against one another. I have watched this idea fail to land twice before: the philosophers
  hear it as the demandingness objection in a new costume and the economists hear
  it as a routine call for more research. I do not want an explanation of cluelessness;
  I want a plan for the session.


  [Second paragraph: the deliverable specifics.] Give me the order in which the pieces
  must be introduced and why each depends on the one before — in particular, tell
  me whether the distinction between a criterion of rightness and a decision procedure
  has to come first or has to be discovered by the room, and whether the causal and
  the evaluative sources of cluelessness should be separated at all at this level
  or run together for as long as possible. Then tell me the one case that should carry
  the whole ninety minutes: it has to be mundane and small in scale, with a first-order
  effect everyone can see and second-order effects that fan out past any hope of enumeration,
