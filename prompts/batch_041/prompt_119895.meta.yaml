  ---

  I am preparing a session for a graduate seminar on time in literature and philosophy,
  and I want a reading of Slaughterhouse-Five through Borges''s writings on time.
  I am not after the Nietzschean eternal-return pairing that the novel usually attracts,
  nor the observation that both writers were preoccupied with time; I want the novel
  sorted against three Borgesian positions that are usually run together and should
  not be.


  The first is the argument of A New Refutation of Time, where Borges extends Berkeley''s
  and Hume''s idealist negations to time itself: if nothing exists but present perceptions,
  then succession is unreal, the past is not a region lying behind us, and the self
  that was supposed to persist through time dissolves with it. The second is the view
  dramatized in The Garden of Forking Paths, where Ts''ui Pên''s novel realizes every
  possibility at once, so that the same man dies in one branch and survives in another.
  The third is the stretched duration of The Secret Miracle, in which the condemned
  writer lives out a year of composition inside the instant before the volley while
  the world outside stands still.


  The Tralfamadorian doctrine in Vonnegut''s novel — perception of all moments at
  once, every moment permanently in place, nothing ever changeable, equanimity in
  the face of death — is not obviously any of these. I want to know which one it is,
  and where the novel''s own machinery (Billy unstuck in time, the Tralfamadorian
  tales that are read all at once rather than in sequence, the war film that runs
  backwards and un-happens the bombing) commits it to one metaphysics rather than
  another. The reversed film seems to me the decisive scene: it is a wish that the
  past be alterable, which one of these views permits, one forbids, and one renders
  meaningless.


  Then the harder questions. Does the refrain that follows each death express the
  doctrine or betray it? Is the novel''s quietism a consequence of its view of time
  or an evasion that the book knows it is an evasion? And what does the novel show
  about living inside such a view that Borges''s essays, which argue for the unreality
  of time while conceding they cannot be lived, can only assert from outside? I would
  like the reading to name the scenes I should put in front of the class, to be honest
  where the novel resists the Borgesian frame, and to end by saying what Vonnegut
  adds to the philosophical debate that the arguments alone do not.

