  the novel states it: that all moments exist permanently, that a person who dies
  is merely in poor condition in one moment and fine in others, that the creatures
  can see the whole of time as one sees a mountain range, and that they therefore
  do nothing about the destruction of the universe they foresee. Set that against
  the arguments in Borges''s ''A New Refutation of Time,'' where he denies the reality
  of succession, of the past and future, of the persisting self, and also of simultaneity
  — and against ''The Garden of Forking Paths,'' where all possibilities are realized
