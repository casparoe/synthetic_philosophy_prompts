  I am preparing a unit for an advanced undergraduate seminar on twentieth-century
  analytic philosophy of religion, and I want a decision tree that sorts the positions
  one can take on the meaningfulness and possible truth of the claim that a person
  survives the death of their body — with A. J. Ayer''s own shifting views occupying
  several of the leaves. The tree should begin from commitments a student could state
  without already knowing the labels: whether the claim that someone survives death
  has any observable consequences at all; whether those consequences are the sort
  that could in principle be checked by a finite observer; whether the surviving thing
  must be the same person (continuity of memory and character) or may be merely a
  causal trace or an impersonal influence; whether the survivor is embodied or disembodied;
  and, if disembodied, whether the surviving consciousness is continuous with the
  ante-mortem person or a fresh entity. From those branch questions, the leaves should
  include at least: Ayer''s early strict-verificationist verdict that survival claims
  are literally meaningless unless they are given an empirical interpretation; a weak-verificationist
  or "interpretationist" position on which the claim is meaningful but evidentially
  unsupported; a logical-construction view of the person on which survival is conceivable
  but not verifiable; a naturalistic reading of near-death experiences as brain events
  rather than evidence of survival (the position Ayer gravitated toward after his
  own experience in the late 1980s); a Lockean memory-continuity view; a bodily-resurrection
  view; a reincarnation view; a mystical-absorption view; and an eliminative-materialist
  view on which the claim is meaningful but false. For each leaf, give the name of
  the position (or mark it unnamed if no one defends it), one sentence on its most
  awkward commitment, and a note on which branch answers would have to change to move
  it to a neighboring leaf.


  The tree should be built from the logical space first — the combinations of answers
  the branch questions allow — and only then populated with the named positions, so
  that we can see which combinations are unoccupied. For every unoccupied combination,
  say briefly whether it is empty because the view is incoherent, unattractive, or
  merely unexplored. Where two leaves cannot be separated by any of the branch questions
  as phrased, flag them as indistinguishable by this instrument rather than forcing
  a distinction. Keep the whole thing to a one-page handout: at most ten leaves, no
  more than six branch nodes, and no reading list or citations. The point is not to
  survey the literature but to give students a diagnostic map they can use to locate
  their own pre-theoretical commitments and see where Ayer''s various positions fall
  on it.


