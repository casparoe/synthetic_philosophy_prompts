  Let''s think about what makes it "in the weeds" philosophically rather than just
  an engineering decision. The Lewis angle: (a) conventions are arbitrary solutions
  to coordination problems; (b) they''re sustained by mutual expectation and common
  knowledge, not by agreement or merit; (c) therefore "which convention is better"
  is often the wrong question — but (d) the arbitrariness is bounded: once you have
  a convention, deviating unilaterally is bad, yet the *whole set* can be revised
  if there''s a focal alternative and common knowledge of the change; (e) the evolution-of-norms
  angle: conventions can drift through population dynamics; a technically inferior
  convention can be an absorbing state (lock-in, path dependence, QWERTY); (f) a norm
  (with sanction) is different from a convention (Bicchieri/Sugden): deviation from
  a convention is merely costly, deviation from a norm invites blame.


