  isn''t supreme. But note: repealing Rule B is itself an amendment to Rule B — permitted
  by Rule A (majority), forbidden by Rule B. Both rules are equally authoritative;
  nothing in the rulebook breaks the tie. The group must decide, and whatever they
  decide, they''ve made a choice the rules don''t determine — that''s the "bootstrap"
