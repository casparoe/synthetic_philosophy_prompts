  The paradox to stage: The group wants to do something that requires weakening Rule
  B (or Rule A). To change Rule B you need unanimity. Someone proposes: amend Rule
  A (by two-thirds) so that Rule A now allows amendment of Rule B by two-thirds; then
  use the amended Rule A to change Rule B. Is that valid? The validity of the amendment
  to Rule A depends on Rule A''s two-thirds procedure, which is fine; but the content
  of the amendment is that Rule B can now be changed by two-thirds — but changing
  Rule B is precisely what Rule B forbids. So either the amendment to Rule A is void
  (because it purports to change the amendment procedure for Rule B, which Rule B
  protects), or Rule B was never really entrenched. Circular.


