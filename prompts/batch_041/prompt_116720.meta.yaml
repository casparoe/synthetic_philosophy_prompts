  Nomic is a great fit for a game-type activity. Nomic is a game by Peter Suber where
  rule changes are made by the players, including the rules that govern rule changes.
  The self-amending rules — Article 213, etc. — the paradoxes: the paradox of self-amendment
  (a rule that authorizes its own amendment, or a rule that forbids its own amendment
  but can be amended by itself). There''s also the "immutable rules" vs "mutable rules"
  structure in Suber''s Nomic: rules are either immutable or mutable; immutable rules
  can only be changed by unanimous consent... Actually in Suber''s Nomic, rules are
  numbered; rules 101-116ish are immutable (can only be changed by unanimous vote,
  or by a process), mutable rules by simple majority. Rule 213: "If the rules are
  changed so that further play is impossible, or if the legality of a move cannot
  be determined with finality, ... then the first player who is able to prove that
  this is the case wins." Rule 212? There''s also the "paradox of self-amendment":
  a rule that says "this rule cannot be amended" — can it be amended? The classic:
  Article 5 of the US Constitution says no amendment before 1808 on slave trade, and
  no state can be deprived of equal suffrage in the Senate without its consent — a
  self-entrenching clause.


  Also relevant: the "paradox of self-amendment" in Suber''s book "The Paradox of
  Self-Amendment: A Study of Law, Logic, Omnipotence, and Change" (1990). The logical
  form: a rule that purports to govern its own amendment. Cases: (a) a rule that forbids
  its own amendment — if valid, it can''t be amended, but if it can be amended, then
  it was invalid? Actually: If the rule forbidding its own amendment can be amended
  (by the procedure it forbids), then the rule was invalid/ineffective. If it cannot
  be amended, then the rule is entrenched. Suber argues it''s a genuine paradox of
  legal self-reference but resolvable.


  Also, the "Nomic" game''s key feature: "the rules of the game can be changed by
