  Standing to blame literature: There''s a decent body: Gerald Dworkin''s "Morally
  Speaking" — the idea that one can have the "standing" to blame only if one is not
  oneself guilty of the same thing, or if one blames oneself. Cohen''s "Casting the
  First Stone" — moral criticism requires the critic to be living up to the standard,
  or at least to be committed to it (the "committed but flawed" case). R. Jay Wallace''s
  "Hypocrisy, Moral Address, and the Equal Moral Community" — standing as a matter
  of relation to the person blamed, membership in the moral community. Macalester
  Bell on contempt and moral standing. Kyle Fritz & Daniel Miller "Hypocrisy and the
  Standing to Blame." Also the distinction between "standing" (a right to blame) and
  "warrant/accuracy" (whether the blame is fitting), and the distinction between blaming
  (an action/attitude) and the content of the judgment.


  Key structural points to preserve in a procedure:

  - Distinguish the truth/fittingness of the criticism from the critic''s standing.

  - Hypocrisy is not the same as inconsistency or moral weakness; it''s a specific
  failure — e.g., pretending or claiming a moral commitment while lacking it, or blaming
  others for what one does oneself.

  - Distinguish "same wrong" vs "similar wrong" — does the critic have to be innocent
  of the very same wrong, or of any wrong in the relevant domain? (Cohen: the critic
  must "cast the first stone"? Actually the point is often about the critic needing
  to be "self-examining" or having "repaid their debt".)

  - Distinguish the private attitude of blaming from the public act of protest/address
  — hypocrisy objection often targets public reproach and the "moral address" function
  (Wallace).

  - The "non-hypocritical bad person" case: someone who doesn''t pretend to be better
  — do they have standing? Some say yes (no hypocrisy), some say no (no standing because
  they''re not a member in good standing of the moral community).

  - The distinction between "you too" as an excuse (which is a fallacy) vs. as a standing
  objection.

  - The distinction between the moral norms being applied to the blamer vs. the role-based
  norms.

  - The "what should the addressee do" question: does the standing objection give
  the wrongdoer a reason to ignore the criticism entirely, or only to reject the blaming
  attitudes but still consider the content?


