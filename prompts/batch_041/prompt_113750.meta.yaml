  REU (Quiggin 1982, "A theory of anticipated utility"; also Buchak 2013 "Risk and
  Rationality" — risky choice framework). The core: outcomes are weighted not by their
  probability but by a transformed function of the probability that the outcome is
  at least that good. Formally, with outcomes ordered worst to best x1...xn and cumulative
  probabilities, REU = sum over i of (r(1 - F(x_{i-1})) - r(1 - F(x_i))) * u(x_i)
  — where r is a risk function. Key idea: the weight on an outcome depends on how
  good it is relative to other outcomes, not just its probability. So a person can
  be "globally cautious" or "globally bold" — someone whose risk attitude is about
  the best/worst outcomes rather than about probabilities linearly. Contrast with
  expected utility where risk attitudes come from curvature of utility. Buchak''s
  key point: REU separates risk attitude from utility, and allows "globally" risk-averse
  behavior that EU can''t represent (with fixed utility, you can have all-or-nothing-ish
  weighting).


