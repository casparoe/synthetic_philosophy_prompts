  correct me if I''ve got it wrong, but then use the corrected version:

  In normal expected utility theory you take each possible outcome of an action, multiply
  its utility by its probability, and add it all up. Your attitude toward risk is
  basically hidden inside the shape of your utility curve, so "I''m a cautious person"
  and "I just care less about money in general" end up looking like the same thing
  on paper. REU splits those apart. You sort an action''s outcomes from worst to best,
  and the weight an outcome gets isnt its own probability but a transformed version
  of the chance that you end up at least that well off. The transformation is a "risk
  function" that you apply to the cumulative probabilities, and it''s the same for
  every decision you face. So a risk-averse person isn''t just a person with a bent
  utility curve — they''re a person who systematically gives extra weight to the bad
  tail and discounts the good tail, no matter what the stakes are. Weird upshot: somebody
  can be really cautious about anything with a catastrophic downside while happily
