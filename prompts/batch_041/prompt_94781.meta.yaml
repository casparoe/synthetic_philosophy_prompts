  is not a metaphysical substance but a center of narrative gravity—a constructed
  unity that emerges from the stories we tell about ourselves and that others tell
  about us. I want to test that idea against a concrete legal and clinical practice
  that has always struck me as philosophically loaded: advance directives in dementia
  care. In many jurisdictions, a person while competent can write an advance directive
  refusing, say, artificial nutrition and hydration if she later develops severe dementia;
  when she does, clinicians and courts often treat the earlier directive as authoritative
  even if the later, demented person seems content, asks for food, or no longer recognizes
  the document. The practice seems to presuppose something about who the self is across
  time, but I can''t tell what exactly. Does it presuppose that personal identity
  survives dementia, so that the earlier and later selves are the same person? Does
  it instead presuppose a narrative self whose author is the earlier, competent person,
  so that the later self is bound by a story she did not write? Or does it presuppose
  something thinner—a legal fiction of precedent autonomy that doesn''t need any metaphysical
  view of the self at all?


