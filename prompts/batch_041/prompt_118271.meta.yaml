  Let''s craft the belief set. Need ensure tensions. Let''s enumerate:


  1. I accept the anti-aggregationist claim: when I can save either one person or
  five different people, and no other differences matter, the bare fact that there
  are five rather than one is not itself a moral reason to save the five. Each person''s
  life is equally valuable, and morality is fundamentally about claims of individuals,
  not sums.


  2. I think it is nonetheless permissible to save the five in that case. If I can
  save more people without violating anyone''s claim, I may do so; the one cannot
  complain that I saved five instead of him, because he had no stronger claim than
  any of them.


  3. I think the correct way to respect each person equally in the one-versus-five
  case is to give each person an equal chance, e.g., by lottery or coin flip, rather
  than simply saving the greater number. Equal respect requires equal chances.


  4. I think that from an ex ante point of view, behind a veil of ignorance, I would
  choose a rule that saves the greater number. If I don''t know which person I''ll
  be, I have a five-sixths chance of being saved under the save-the-many rule and
  only a one-sixth chance under the lottery. So the save-the-many rule is rationally
  preferable ex ante.


  5. I think contractualism is true: an act is wrong if it would be disallowed by
  any principle that no one could reasonably reject. And I think the one person in
  the one-versus-five case could not reasonably reject a principle that permits saving
  the five, because he would have accepted that principle ex ante.


  6. I think agent-relative permissions are real and important: I may save my own
  child even when I could save two strangers, and I am not required to be impartial.
  But I also think that in public decisions, like a rescue coordinator''s, agent-neutral
  reasons should govern.


  7. I think expected utility theory is the correct theory of rational choice under
  risk, and saving five maximizes expected lives saved, so it is the rationally required
  choice.


  8. I think doing harm is worse than allowing harm, so I may not kill one to save
  five (transplant), but I may save five rather than one in a rescue case. The distinction
  between doing and allowing explains the difference.


