  Let''s draft:


  I am a graduate student in philosophy preparing a position paper for a seminar on
  distributive ethics, and before I write the draft I want to run my current commitments
  through a consistency audit. I have ended up with a package that feels right to
  me but that I suspect may not hang together. Here it is. (1) I accept the anti-aggregationist
  claim, associated with Taurek, that in a rescue case where I can save either one
  stranger or five strangers, and no other differences matter, the bare fact that
  there are five rather than one is not itself a moral reason to save the five; each
  person''s life is equally valuable, and the fundamental moral units are individual
  claims, not sums. (2) I nonetheless think it is permissible to save the five in
  that case: if I can save more people without violating anyone''s claim, I may do
  so, and the one who is not saved cannot complain that I saved five instead of him,
  since he had no stronger claim than any of them. (3) I think equal respect for each
  person in the one-versus-five case requires giving each person an equal chance,
  by lottery or coin flip, rather than simply saving the greater number. (4) I think
  that from an ex ante point of view, behind a veil of ignorance, I would choose a
