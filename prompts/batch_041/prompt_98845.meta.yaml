  I was in a reading group last week where two participants, A and B, got into an
  extended argument about coherence arguments for expected utility maximization. A
  third participant had proposed a rule—choose the act that maximizes the minimum
  expected utility over a set of admissible probability distributions, and break ties
  by worst-case—and claimed it was both rational and immune to the usual money-pump
  and Dutch-book objections. A and B disagreed about what that showed. I took notes;
  here is the exchange as faithfully as I can reconstruct it.


  A: If your choices cannot be represented as maximizing expected utility with respect
  to a single probability distribution and a utility function, then there is a sequence
  of trades you will accept that leaves you worse off no matter what happens. That
  is what a coherence argument shows. So any rational agent must maximize expected
  utility. C''s maximin rule is not expected utility maximization, so it is incoherent.


  B: That is too fast. A money-pump argument shows that certain patterns of preference
  are exploitable if the agent will make each trade in isolation and cannot commit
  or anticipate. C''s rule is applied to whole plans; it can refuse a trade that lowers
  the worst-case outcome, even if the trade is favorable under every admissible probability.
  Refusing such a trade is not a sure loss, because there is no single probability
  by which to measure the loss. So the pump does not get started.


  A: If C refuses a trade that is favorable under every admissible probability, then
  C is leaving a sure gain on the table. That is irrational. And if C''s preferences
  over acts violate the independence axiom, we can construct a lottery version: suppose
  C prefers A to B but prefers a 50–50 mixture of B and C to a 50–50 mixture of A
  and C. A bookie can then extract a sure loss from C. Avoiding that requires independence,
  and independence plus the other standard axioms gives expected utility maximization.


  B: The lottery argument assumes that C will accept each mixture bet at the offered
  stakes and that C''s preferences over mixtures are stable. But more importantly,
  avoiding a Dutch book may require only that C''s preferences be representable by
  a set of probability distributions, not a single one. C''s maximin rule can be represented
  that way. It is not vulnerable to a Dutch book in the same sense. So the coherence
  argument establishes at most that C should have a convex set of probabilities and
  avoid sure loss—not that C must maximize expected utility with a single probability.


  A: But if C has a set of probabilities, then a bet that is favorable under every
  probability in the set is a sure gain. If C refuses it, C is irrational. And if
  C accepts it, C is effectively using a single probability—the one that makes the
