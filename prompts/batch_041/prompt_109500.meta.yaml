  I think the Analogy one is quite elegant and \"in the weeds\" without needing facts.\
  \ Let me develop it.\n\nHofstadter & Sander's thesis (Surfaces and Essences, 2013;\
  \ also Fluid Concepts and Creative Analogies, 1995; and the earlier \"analogy as\
  \ the core of cognition\" lecture): The central claim is that analogy-making is\
  \ not a peripheral or occasional mental act but the very core of cognition: every\
  \ concept we have is the product of analogies, categorization is analogy, perception\
  \ is analogy, and even the most routine act of recognition is an analogy between\
  \ a present situation and a stored category. They argue that \"the same\" and \"\
  different\" are not primitive but arise from analogy; that analogy is involved in\
  \ everything from recognizing a letter to scientific discovery; and they emphasize\
  \ \"conceptual slippage,\" \"fluid concepts,\" \"high-level perception,\" the \"\
  Copycat\" project, etc.\n\nA \"proves too much\" argument:\n(1) Thesis: every act\
  \ of categorization, recognition, and concept-application is an act of analogy-making;\
  \ concepts are built and applied by analogy.\n(2) If every mental act is analogy-making,\
  \ then there is no mental act that is *not* analogy-making, so \"analogy-making\"\
  \ is not a contrastive kind — it names cognition as a whole.\n(3) A theory that\
  \ makes its central posit coextensive with the whole domain explains nothing in\
  \ particular: it can't distinguish good from bad analogies, creative from routine\
  \ thought, or correct from incorrect categorization, except by invoking further\
  \ analogies.\n(4) Moreover, if concept application is analogy, then applying the\
  \ concept \"analogy\" is itself an analogy, and the theory is self-applying; it\
  \ can never step outside analogy to check its own claims.\n(5) A theory that is\
  \ self-applying and has no contrast class is unfalsifiable: no observation could\
  \ disconfirm it, since any counterexample would itself be processed by analogy.\n\
  (6) So the thesis proves too much: it would be true of any cognitive system whatever,\
  \ including systems we'd describe as making no analogies.\nConclusion: the thesis\
