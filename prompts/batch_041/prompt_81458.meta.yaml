  Draft:


  "Bit of a weird one, but I''m supposed to open a seminar on the calculation debate
  and I''ve realised I don''t actually know whether the two big objections to central
  planning are two objections or one wearing two hats.


  Here''s my current reading, and I''d like it tested. Mises: without a market in
  the means of production there are no prices for them, and without prices there''s
  no common unit in which the planner can compare the cost of putting a ton of steel
  into a bridge against putting it into bicycles, so the planner literally can''t
  do the sum that rational allocation requires. On that reading the impossibility
  is a fact about the absence of a unit of account, not about how much anyone knows.
  Hayek: the problem isn''t the arithmetic, it''s that the stuff you''d need to feed
  the arithmetic is never in one place. He says the knowledge we must use ''never
  exists in concentrated or integrated form but solely as the dispersed bits of incomplete
  and frequently contradictory knowledge which all the separate individuals possess''
  — and the price system, on his account, is a device for acting on knowledge that
  nobody has in full. On that reading even a planner with infinite computational power
  has nothing to compute with.


  Then Lange. My understanding of his scheme: central planning board owns the capital
  goods and sets their prices, firms get two rules — combine factors so as to minimise
  average cost, and push output to where price equals marginal cost — and the board
  then adjusts prices by trial and error, raising them on things in shortage and cutting
  them on things in surplus, until nothing''s short and nothing''s surplus. Add a
  social dividend, let the labour market and consumer goods market work normally,
  and you''ve got something that hits the same allocation as a competitive market
  without ever having a capital market. He thought this defanged the whole critique.


  What I want out of you:

  1. Is my Mises/Hayek split the right cut? Specifically, is Mises''s argument independent
