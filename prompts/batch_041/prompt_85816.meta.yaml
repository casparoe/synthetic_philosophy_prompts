  Full draft:


  I''m a third-year PhD student working on historical method / Christian origins,
  and I want a number out of you on something I''ve been stuck on for months.


  The background: my whole field sorts sayings and deeds into "probably goes back
  to Jesus" and "probably comes from the early tradition" using a grab-bag of criteria
  — embarrassment, dissimilarity, multiple attestation, coherence, Semitic flavour,
  fit with a Galilean Jewish setting, and so on. None of these are stated as anything
  more than rules of thumb ("if it''s embarrassing, it''s probably old").


  I''ve been trying to restate each one as an explicit likelihood ratio — P(we''d
  see this datum if the saying is authentic) over P(we''d see it if the saying is
  inauthentic) — so the whole thing becomes a Bayesian machine instead of a vibe.
  My supervisor thinks this is a waste of time and I half think she''s right, for
  two reasons.


  First, the denominator. "The saying is inauthentic" isn''t a hypothesis, it''s a
  shrug. The early tradition could produce a saying, a parable, a miracle story, a
  saying that sounds awkwardly Semitic... so for alot of data the denominator is effectively
  unconstrained and I can set it wherever I need to in order to get the answer I already
  wanted. The criteria stop being tests and become a way of laundering my priors.


  Second, the criteria are one-sided by construction. They were invented to include
  material, not to exclude it: nobody formulated the criterion of embarrassment so
  that *failing* it counts against a saying. So the apparatus can only ever accumulate
  confirmations. That can''t be right either.


  But maybe the fix is just to insist on a real generative model of how sayings mutate
  as they move through oral tradition and then through Greek — once you have that,
  the denominators are pinned down by the model and everything works.


  So here''s the number I want. What''s your credence that there exists *some* set
  of criteria — not necessarily the traditional list, and granting unlimited cleverness
  in constructing them — that could in principle recover, from the evidence we actually
