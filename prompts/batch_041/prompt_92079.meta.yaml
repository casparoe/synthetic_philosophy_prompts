  analogy is tempting (both are deference principles), and the subtle point is that
  Reflection is a deference principle toward a future *self*, not toward objective
  chance, and it lacks the "admissibility" clause that the Principal Principle has;
  the failure of Reflection in cases of anticipated irrationality/self-undermining
  is analogous to inadmissible evidence. That''s genuinely in-the-weeds and a nice
