  So yes: Reflection forces a conflict with "I know I''ll be drugged and I know the
  drug-induced belief is false." Defenders respond in various ways (e.g., the "certainty"
  case shows the agent must already have credence 0.9, or Reflection must be restricted,
  or the agent can''t be certain of the future credence, or the relevant notion of
  "future self" must be restricted). Actually, wait: does Reflection really force
