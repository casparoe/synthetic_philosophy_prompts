  The best in-the-weeds sunk-cost twist: honoring sunk costs can be rational when
  (a) your future preferences are endogenous to past investment (habit formation,
  "the more I''ve invested the more I''ll enjoy it" — e.g., learning an instrument,
  wine-tasting, running a marathon: the past investment literally creates the capacity
  for future enjoyment), (b) as a self-commitment device (Staw''s escalation; "sunk
  cost effect as rational for an agent with imperfect self-control" — actually there''s
  a nice literature: "sunk cost effect as a commitment device" by Kanodia? No — "The
  sunk cost effect as rational behavior" or "Sunk costs and the commitment problem"),
  (c) where abandoning reveals weakness to counterparties, (d) where honoring sunk
  costs is required by a non-consequentialist constraint (promises, fidelity, gratitude:
  the past creates obligations — "the sunk cost fallacy is not a fallacy when the
  past creates duties", e.g., loyalty, the "investment" being a gift with strings),
  (e) where the decision problem is not a pure option but involves non-separable preferences
  over trajectories ("path-dependent utility" — preference for consistency/completing
  things, which expected utility can accommodate if we allow utility over trajectories:
  the "as if" defense — if you genuinely get utility from finishing, it''s not a fallacy).


  That last one is a good philosophical point: the "fallacy" label presupposes that
  preferences must be over final outcomes; if utility is over trajectories/history,
  then not finishing genuinely makes the outcome worse, so there''s no fallacy — just
  a mismatch between the advisor''s and the agent''s utility function. Also "the fallacy
  is really about error in predicting one''s own future preferences" — e.g., "I''ve
  come this far, it can''t be for nothing" is a fallacy only if the past has no effect
  on the future value; but the "wasted effort" is a real disvalue if effort itself
  enters utility non-instrumentally (e.g., "I''d rather finish than have a half-finished
  thesis, even at equal final state"). Hmm, that''s a "preference for completion"
