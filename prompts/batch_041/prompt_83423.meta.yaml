  for objective reality, or (b) frame-independent and hence empirically inaccessible
  in a way that makes it epiphenomenal. And the interesting open question: is there
  a *middle* position — a "perspectival realism" about the present, where "now" is
  indexical yet ontologically loaded (like "here")? Compare the indexicality of "here"
