  Rietdijk–Putnam: The argument runs roughly: For any event e that is space-like separated
  from here-now, there is an inertial frame in which e is simultaneous with here-now.
  If we accept that whatever is simultaneous with a real event is real, then e is
  real. Iterating (using the transitivity of "is real", or chains of simultaneity
  via intermediate frames), one gets that all events in Minkowski spacetime are equally
  real (the block universe) — and also that the future is fixed (determinism), since
  events to the future of here-now are real in the same way. The usual objections:
  (1) the argument needs transitivity of "real for" or of simultaneity, but simultaneity
  is not transitive (non-transitive), so the chain breaks; (2) "the present" as indexical;
  (3) the argument conflates "is real" with "is real-for-an-observer"; (4) if "real"
  means "exists", then the premise "whatever is simultaneous with a real event is
  real" is just the negation of presentism, i.e., question-begging.


