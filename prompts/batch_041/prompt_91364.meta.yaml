  Revealed preference theory: Samuelson (1938) introduced revealed preference as a
  way to derive demand theory from observable choices without the unobservable concept
  of utility. The idea: if a consumer chooses bundle A when B is affordable, A is
  "revealed preferred" to B. Then the weak axiom of revealed preference (WARP) etc.


  The philosophical issues:

  1. The behaviorist interpretation: utility/preference is just shorthand for choice
  behavior. "The meaning of utility" — for Samuelson, preference is defined by choice,
  so talk of utility is just a representation.

  2. The circularity worry: if preference is defined by choice, then explaining choice
  by preference is vacuous — "he chose A because he preferred A" adds nothing.

  3. The problem of distinguishing preference from welfare: someone can choose what''s
  bad for them (addiction, akrasia), so revealed preference ≠ well-being. This is
  a standard critique (e.g., from Sen and others; the "behavioral" critique).

  4. The "as if" interpretation vs. the realist interpretation.

  5. The issue of consistency: WARP and the idea that choices are consistent. The
  critique that real people violate WARP (behavioral economics), and the response
  that the theory is normative/idealized.

  6. The subtle point: revealed preference doesn''t literally mean the person has
  a mental state of preferring; it''s a definitional/operationalist move.

  7. The point that Samuelson''s program was to derive the "law of demand" without
  utility.

  8. The point that "preference" in economics is not the same as "desire" in ordinary
  language.


