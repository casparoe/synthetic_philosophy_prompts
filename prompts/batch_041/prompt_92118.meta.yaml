  roughly as follows. If we render a theory as a Ramsey sentence -- existentially
  quantifying over its theoretical terms so that the theory asserts only that there
  exist objects and relations standing in the pattern the theory specifies -- then
  the resulting sentence is satisfied by any domain of the right cardinality, since
  any set of sufficiently many objects can be assigned relations that realise an arbitrary
  pattern. If so, the structural realist''s epistemic commitment comes to little more
  than a claim about how many things there are, which is not the kind of content that
  could explain the success of science or survive theory change.


