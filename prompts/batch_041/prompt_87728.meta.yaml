  I am a fourth-year PhD student in cognitive science, and for the past year I have
  been embedded part-time with a small AI evaluation team at a lab that deploys tool-using
  language-model agents. Our incident reports and model cards are full of mental-state
  verbs: the system believed the file was missing, wanted to avoid shutdown, tried
  to mislead the evaluator, knew the user was upset. These words do real work—they
  shape whether an incident is classified as a reasoning failure, a reward-hacking
  case, or a safety concern—but no one on the team can say when they are licensed.
  I want to operationalize Dennett''s intentional stance, together with its contrast
  with the design stance and the physical stance, into a procedure that a research
  engineer with no philosophy background can run in about thirty minutes of triage,
  using only what we already have: prompts, logs, sampling parameters, activation
  probes, and the ability to run counterfactual interventions such as changing a fact
  in context and checking whether outputs update. The procedure should be reusable
  across weekly incident reviews, where the stakes range from adding a caveat to a
  model card to blocking a deployment, and it should be written for a two-page report
  that I or our ethics lead can sign off on. It must not assume web access or a literature
  review, and it should not ask the engineer to settle questions of consciousness
  or moral status on their own.


  The central translation problem is that the intentional stance licenses prediction,
  not metaphysics. I want the procedure to keep three kinds of attribution separate:
  predictive attribution, where treating the system as if it had beliefs and desires
  improves our forecasts; explanatory attribution, where the belief or desire explains
  behavior in a way that a design-stance story—policy optimization, next-token prediction,
  retrieval, prompt-following—does not; and moral or legal attribution, where the
  system is treated as a proper target of blame, rights, or welfare concern. For each
  kind, the procedure should say what evidence licenses it, what evidence defeats
  it, and where the procedure stops with a no-attribution verdict. It should include
  a step that checks the sycophancy and role-play alternative—the system is producing
  the mental-state talk that the prompt, the fine-tuning data, or the evaluator''s
  own framing made salient—and a step that asks whether a simpler design-stance explanation
  predicts the same behavior at lower cost. It should also mark the points where the
  question is values rather than facts and must be handed to a human, rather than
  disguised as a test.


