  Round 1 — Behavioral economist (B): "Weakness of will isn''t a mystery. It''s present
  bias: people discount the near future more steeply than the far future, so the value
  of a reward flips as it gets closer. What we call ''akrasia'' is just the agent''s
  preferences reversing over time. There''s no separate faculty of will to be weak."


  Round 2 — Philosopher (A): "That can''t be the whole story, because preference reversal
  isn''t yet weakness of will. If I prefer cake now and would prefer salad if I were
  choosing for next Tuesday, my preferences have simply changed. Akrasia requires
  that I act against my own judgment of what I should do — I judge that I should decline
  the cake, and I take it anyway. A person can be perfectly time-consistent and still
  be akratic (breaking a vow out of spite), and perfectly time-inconsistent without
  being akratic (changing my mind for good reasons). So present bias describes the
  terrain but misses the essential element: the conflict with one''s own better judgment."


  Round 3 — B: "Granted there''s a judgment in there. But the judgment is just another
  preference — a preference about preferences, or about the long run. Once you model
  the agent as having a long-run preference for health and a short-run preference
  for cake, the ''conflict with judgment'' is just a conflict between two preference
  orderings, and the model handles it. And the fact that people will pay to restrict
  their own future choices — locking the cigarettes away, pre-committing to a savings
  plan — shows they know their future selves will defect. That''s exactly what the
  present-bias model predicts for ''sophisticated'' agents."


  Round 4 — A: "Two problems. First, treating the better judgment as just one more
  preference makes it impossible to say when someone has *failed* rather than simply
  preferred differently; on that picture nobody is ever weak-willed, they just have
