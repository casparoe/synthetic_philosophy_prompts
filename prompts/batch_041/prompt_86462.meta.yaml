  Key confusions to exploit:

  1. Thinking the theorem says real markets can''t have trade / that speculation is
  impossible — no, it requires common prior, common knowledge of rationality, common
  knowledge of the trade, and no gains from trade absent asymmetric info (i.e., the
  initial endowment is Pareto optimal given common priors).

  2. Confusing "no trade theorem" with "no-trade theorem" for information: it''s about
  the impossibility of purely informational trade (trade driven by differences in
  information, "speculative trade"), not about trade from differing tastes/endowments.

  3. Confusing with other "no trade" results: e.g., the Milgrom-Stokey theorem vs.
  the Grossman-Stiglitz paradox (markets can''t be perfectly informationally efficient
