  Draft body:


  "You are a philosopher of science who specializes in the demarcation problem and
  in the way historical episodes — Galileo, Wegener, the reception of heliocentrism
  — get used as premises in arguments about who is being unreasonable. I''d like you
  to audit one such argument for me, carefully, and I''d rather you think it through
  before you start writing than give me a quick verdict.


  Background. My uncle has spent the last two years reading Fomenko''s New Chronology
  and is now convinced that conventional ancient and medieval history has been inflated
  — that large stretches of what we''re taught as separate events are really the same
  events counted twice, and that Jesus, for instance, belongs in the eleventh or twelfth
  century. When I say that essentially no historian or archaeologist accepts this,
  he has two replies. The first is an analogy: the establishment has been wrong before
  and it has always been the consensus that was wrong. Copernicus was dismissed, Galileo
  was silenced, Wegener was ridiculed for decades for saying the continents move,
  and now every schoolchild learns he was right. He says his case is the same kind
  of case, and that when I tell him the consensus is against him I''m doing exactly
  what the Aristotelians did when they refused to look through Galileo''s telescope.
  The second reply is a principle he attributes to Lakatos: that you cannot tell whether
  a research programme is degenerating except in hindsight, and that it is rational
  for a scientist to keep working on a programme even after it has started to look
  bad, until a better rival comes along. So, he says, the fact that his theory looks
  bad now proves nothing, and my appeal to expert opinion is both arrogant and philosophically
  naive.


  What I want. Take the analogy seriously enough to state it properly: give me the
  correspondence, point by point, in ordinary sentences rather than as a table or
  a list — what in the Fomenko case is supposed to answer to Ptolemaic astronomy,
  to the Aristotelians who wouldn''t look, to the telescope, to the decades of ridicule,
  to the eventual vindication. Then tell me where the mapping breaks, and separate
  the breakages that matter for what he''s using the analogy to do from the ones that
  are merely loose. I''m especially interested in whether the historical episodes
  he''s leaning on have the shape his argument needs — whether the consensus that
  eventually fell was overturned by a neglected outsider being heard at last, or by
  something else. Then do the same for the Lakatosian point: what exactly does it
  entitle him to, and does it do the work his conclusion needs? His conclusion, roughly,
  is that I should stop citing consensus and that his theory deserves the same serious
  engagement as a live scientific hypothesis.


  Give me a straight answer at the end: does the conclusion survive once the disanalogies
  are on the table, or was the analogy carrying the whole weight? If a better analogy
  would do the work he wants, say what it is.


  Format. Write it as continuous prose, the way you''d write a long, patient email
  to a colleague — no headings, no bullet points, no bold, no tables, and no numbered
  lists. Where a table of correspondences would be the natural thing, give me one
  pairing per sentence instead."


