  "I''ve been sitting in on a year-long seminar that is nominally about social explanation
  but has turned into a recurring fight about methodological individualism, and I
  want a diagnosis of the fight rather than another round of it. The individualists
  in the room hold that social entities — classes, states, markets, cultures, norms
  — are nothing over and above individuals and their interactions; that talk of such
  entities is either convenient shorthand or a placeholder awaiting microfoundations;
  that an explanation which stops at the level of a structure or a rate has simply
  not finished; and that treating collectives as agents is both bad method and politically
  dangerous, since it invites us to speak of what a nation wants. The holists hold
  that social facts have explanatory autonomy: that suicide rates, price levels, or
  patterns of state formation can be explained by other social facts, that positions
  and institutions constrain and partly constitute the individuals who occupy them,
  and that the individualist programme quietly assumes a ready-made individual with
  fixed preferences, when the interesting question is where those come from. Both
  sides agree that the social depends in some sense on the individual, and this agreement
  never seems to help: whenever someone says so, each side hears it as a concession
  from the other. Nobody in the room has changed position in a year, and the same
  exchanges recur whether we''re reading about rational choice, about the longue durée
  in history, or about whether there are social structures at all.


  My hypothesis, which I floated once and got shouted at from both sides, is that
  three different claims are being run together and that each side is defending one
  while attacking another: an ontological claim about what exists, an explanatory
  claim about what an explanation may appeal to, and a semantic or definitional claim
  about whether social predicates can be defined in individual terms. I suspect the
  first is close to settled and does almost no work; the second is where the real
  disagreement lives, and may not be a disagreement about the world at all but about
  what an explanation is supposed to deliver — mechanisms all the way down versus
  subsumption under regularities at the level where the regularities are stable. And
  I suspect a genuine empirical question is hiding underneath: whether macro-level
  regularities can actually be recovered from individual-level models, where I gather
  there are formal results in general equilibrium theory showing that aggregate demand
  need not inherit any of the nice properties of individual demand — which some of
  my colleagues treat as a proof that the reductionist programme cannot work and others
  treat as irrelevant because it''s about prediction rather than explanation.


  So: tell me what kind of disagreement this is. Which parts of it are verbal, which
  substantive, which a disguised empirical question, and which bedrock — a difference
  in what counts as an explanation that neither side can argue for from neutral ground?
  Is it one debate or several being restaged under a single name in different fields?
  Given the diagnosis, what would count as progress — a distinction, a formal result,
  a change of question — and is there a diagnosis under which no progress should be
  expected? I don''t want a survey of the literature or a reading list; engage with
  the positions as I''ve stated them and with the structure of the disagreement, and
  be specific about what each side actually commits to. End with a single final line
  of the form \answer{LABEL — one-sentence summary}, where LABEL is your short diagnosis
  (e.g. verbal, substantive, hidden-empirical, different-questions, ill-posed, or
  a combination) and the sentence names the crux."


