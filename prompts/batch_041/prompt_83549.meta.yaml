  But careful: the concept should be injected in a way that''s accurate. Let me recall
  the actual analysis of the unilateralist''s curse. From Bostrom, Douglas, Sandberg,
  "The Unilateralist''s Curse and the Case for a Principle of Conformity" (Social
  Epistemology, 2016). The core: "the unilateralist''s curse" is a situation in which
  multiple agents, each of whom has the ability to undertake a course of action unilaterally,
  will tend to do so even when it would be better if no one did. Key conditions: (1)
  a number of agents are independently considering whether to perform an action; (2)
  the action is such that it suffices that one agent performs it (or that the benefits
  accrue even if multiple do it, but the harm is overdetermined); (3) each agent''s
  decision is based on their own estimate of the action''s value; (4) if the action
  is worth doing from a single agent''s perspective, then all with the same estimate
  will do it. The result: the probability that at least one agent acts increases with
  the number of agents, approaching 1, and can exceed the probability that acting
  is desirable. Classic illustration: a group of scientists who each have an independent,
  only partially reliable belief about whether releasing a pathogen / publishing a
  dangerous result is net-good; if any one of them acts, harm occurs; each acts if
  the expected value for them is positive, so the harm occurs with high probability.
