  ---


  I''m a third-year student in a seminar on rational choice and collective action,
  and our last unit was on what our instructor calls the unilateralist''s curse —
  the pattern where several agents, each of whom can do a thing on their own and each
  of whom is reasoning competently about whether to, end up doing it with probability
  approaching one, even though the thing is worth doing only if it happens at most
  once, or not at all. As I understand the mechanism: the action is one-off and its
  harm is overdetermined — one actor suffices, so a second and third actor add nothing
  but cannot undo it; each agent''s estimate of the action''s value is honest but
  noisy, and each is correct that, conditional on their own estimate clearing their
  threshold, they should act; so the more agents there are, the likelier it is that
  someone''s estimate clears, and the group''s decision is made by the maximum of
  many draws rather than by anyone''s judgment. The remedy our instructor floated
  — a principle of conformity, agents deferring to a shared or aggregated verdict
  — strikes me as true but inert, and I don''t want it in the poem.


  For the creative component of my final assignment I''d like a sestina. Six stanzas
  of six lines and a three-line envoi, strict form: the standard end-word permutation,
  and the envoi folding three of the six words into the middle of lines and three
  at the ends. Let the six stanzas be six agents, each reaching for the same six end-words
  — I''d suggest signal, estimate, threshold, harm, unlikely, someone, or six equally
  concrete words of your own choosing, fixed before you start. The fixed end-words
  are the point: each agent is solving the same problem, in a different order, and
  arriving at the same place. Let the sixth stanza be the moment after, still in the
  same six words. Make the agents sympathetic and their arithmetic ordinary; the horror
  should be structural, not characterological, and it shouldn''t come from the setting,
  so keep the setting concrete but small. Don''t end on the remedy or on any policy;
  end where the seminar ended, with the thing done and no one having chosen it.


  Please don''t cite or reference any literature — I don''t want you reaching for
  papers you can''t check, and I don''t need them. After the poem, add a brief note
  (a few sentences) on how confident you are that the poem gets the mechanism right
  and which single point you''re least sure of; if you took any liberties with the
  idea for the form''s sake, say what they were.


