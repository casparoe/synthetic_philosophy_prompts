  (4) A tenured professor who is paid a salary and produces knowledge that the university
  monetizes through grants and tuition, but who controls her research agenda and identifies
  with her work, is alienated in a way that has little to do with surplus extraction.
  (5) A disabled person who receives a basic income and does no wage labor is neither
  exploited nor alienated, though she is dependent. (6) A subsistence farmer who owns
  land and tools, works alone, and consumes what he produces is not exploited, but
