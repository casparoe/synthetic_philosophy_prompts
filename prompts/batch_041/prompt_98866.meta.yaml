  can be faked or duplicated, and there''s no fact of the matter about whether the
  voice is "really" the person. That''s the moment Ayer''s point should hit. I''d
  like the debrief to make them see that the failure isn''t ignorance (we could find
  out) but a missing criterion (there''s nothing to find out).


  Then the debrief. I want to map: (a) the cases where they confidently issued cards
