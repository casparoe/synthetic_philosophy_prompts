  a believer. Ask them: does a vivid experience of that kind count as evidence for
  survival, or does it just show that a dying brain can produce experiences? And does
  it touch the conceptual point at all, or is it orthogonal to it? I think the interesting
  answer is that it''s orthogonal: even if the experience is real, it doesn''t give
  us a criterion for the identity of the survivor, so Ayer''s argument (if it works)
