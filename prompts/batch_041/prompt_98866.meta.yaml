  I know Ayer''s views reasonably well: Ayer was a logical positivist, held that claims
  about survival of death are either empirically meaningless (if construed as asserting
  a "spiritual" entity persisting) or, if construed as the claim that some person''s
  memories/character will continue in another body, empirically testable but almost
  certainly false. In "The Concept of a Person" (essay, in the volume of the same
  name, 1963) he argued that the notion of a person surviving death is unintelligible
  because personal identity depends on bodily continuity; he discussed the possibility
  of someone else "being" you — the idea that if memories were transferred, we''d
  have no criterion for saying the new person is you. Also he noted the oddity that
  survival in a disembodied state would give us no way to identify the survivor as
  the same person. He also made a point about how the idea of surviving death as a
  disembodied spirit would strip away the sensory and bodily capacities that make
  us who we are — so a "surviving" Ayer might be someone quite other. Also, famously,
  in 1988 he had a near-death experience (cardiac arrest, pneumonia) and wrote an
  article ("What I Saw When I Was Dead", published in the Sunday Telegraph and later
  in a collection) describing a bright red light and two "ministers of death" figure,
  and said it weakened his conviction that death was the end — he said it was "a very
  strange experience" but he still didn''t believe in survival; he thought it showed
  that consciousness could persist for a short time after clinical death. He later
  said something like "I was very pleased that I was still alive" and remained a skeptic.


