  Here''s the setup I have in mind; tell me if it''ll work and fix what won''t.


  The conceit is a "Bureau of Continuity." Students are case officers. Their job:
  for each claimant who shows up after a death, decide whether the claimant is the
  same person as the deceased, and issue exactly one identity card to the person who
  is the continuation — or, if they can defend it, two cards (they should notice how
  much that costs them).


  Rules:

  - Before seeing any cases, they have 12 minutes to write a checklist: an operational
  test, in the form "if X and Y, then same person." It has to be something a clerk
  could actually apply. No "we''d just know."

  - Then I hand out cases one at a time. After each case, they must either issue a
  card, refuse to issue one (with a reason), or invoke a tie-breaker they wrote into
  the checklist. No new checklist items mid-case, unless they can get a two-thirds
  vote to amend, and amendments cost them the case they were on.

  - Each case has a 5-minute clock and they must record a verdict plus one sentence
  of reasoning.


  Cases (I have six, tweak these):

  1. Cardiac arrest, full recovery, same body, same memories, same personality. Easy.

  2. Same body, total amnesia, personality somewhat changed. Does the body carry it?
  (Ayer''s answer, I think, is yes.)

  3. A new body, all the deceased''s memories and mannerisms, no physical continuity.

  4. A disembodied voice that reports the deceased''s memories, answers questions
  correctly, claims to be them. No body, no location, no way to check up on it.

  5. Two such claimants, identical memories, produced from the same source — fission.
  Now what?

  6. A being with all the memories but a genuinely different character (kind where
  the deceased was cruel). Is it them? If you say yes, case 4''s criterion is doing
  no work; if no, you''re letting character trump memory and you have to say what
  grounds it.


  The bit I most want: in case 4, most groups will keep issuing a card, then discover
