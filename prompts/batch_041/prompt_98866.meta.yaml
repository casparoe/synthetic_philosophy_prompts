  Let me design: A "Bureau of Post-Mortem Identity" — participants play adjudicators
  who have to decide whether a person who has "come back" is the same person. Cases:
  (1) someone wakes up after cardiac arrest with all memories intact, same body; (2)
  memories transferred into a new body (or a cloned body); (3) a disembodied voice
  with all memories and personality but no body; (4) gradual replacement of the brain
  with silicon, then the body dies and the silicon continues; (5) a person''s memories
  and character are "uploaded" and two copies are made (fission) — which one is them,
  or both, or neither? (6) a being that has the memories but a totally different character
  — the memories are of a cruel person but the new being is kind, etc.


  The key Ayerian twist: the participants must produce a *criterion* that they could
  apply in practice, and the point is that for the disembodied case, no criterion
  is available — anything that seems to count (memories, character) can be duplicated,
  faked, or fail to determine a unique answer, so the question "is this the same person"
  loses its grip. Ayer''s own line: the notion of a person is tied to a body, and
  "survival" would have to mean something like "the same person continues to exist",
  which requires a criterion of identity; without a body there is no such criterion,
  so the claim is not false but meaningless.


