  Key features to exploit:

  1. The unit of measurement is the donor''s disbursement, expressed as a share of
  the donor''s own national income (0.7% of GNI). The obligation is thus scaled to
  the donor''s capacity, not to the recipients'' need, nor to any harm the donor has
  done, nor to what any particular recipient is owed.

  2. Beneficiary location is irrelevant: money spent inside the donor country (refugee
  reception) counts, so the accounting doesn''t track benefit to the poor abroad —
  it tracks effort by the donor. Suggests a "giving" rather than "receiving" conception
  — an ethics of the agent''s sacrifice rather than the patient''s benefit.

  3. Counting debt relief: cancelling a claim counts as a gift — presupposes that
  the baseline against which aid is measured is the donor''s existing entitlements
  (a pre-existing moral baseline in which the debt was owed), so the obligation is
  to transfer from the donor''s own property, not to correct an unjust baseline. This
  is directly at odds with the Pogge-style view that the global order harms the poor
  and the rich owe restitution.

  4. Loans counting: obligation is to provide resources on generous terms, not to
  transfer outright — again a beneficence/charity frame.

  5. Tied aid: aid may be conditional on buying the donor''s exports — presupposes
  the obligation isn''t owed to recipients as their due (a due can''t be conditioned
  on enriching the payer), and that aid is a discretionary national policy instrument
  serving donor interests too.

  6. Voluntariness: aid is defined as a "voluntary transfer"; the target is a target,
  not a binding requirement, and no one is liable for non-compliance. Presupposes
  supererogation, or at most imperfect duty (Kantian imperfect duty of beneficence),
  not a duty of justice enforceable by the recipients.


  So the tension: the practice''s rhetoric (0.7% "commitment", "aid" as something
  owed to the poor) vs its accounting logic (measures donor effort, allows counting
  self-regarding expenditure, treats debt cancellation as a gift).


