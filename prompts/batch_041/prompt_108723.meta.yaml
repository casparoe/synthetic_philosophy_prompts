  individual) — e.g., a heart that stopped in an embryo? Can a token organ have a
  function?

  4. Can a trait have a function if it contributes to fitness but was never selected
  (drift + luck)? What about if it would contribute were it to arise (propensity)?

  5. Can a trait that lowers fitness (peacock''s tail, or a maladaptive response to
  a novel environment) have a function?

  6. Can the same trait have more than one function at once, and can "function" be
  relative to a system/goal (so a heart''s function differs depending on whether the
  system is the circulatory system or the whole organism)? — This is the "function
  is system-relative" branch, which separates Cummins/Boorse from etiologists.

