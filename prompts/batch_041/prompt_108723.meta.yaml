  in the same sense, and does a machine part have a function that its designer assigned
  or that it performs?

  8. Is there a single correct answer (a single concept) or two legitimate concepts
  (pluralism) or none (deflationism)?

  9. Does malfunction require a norm? Can an account make sense of "the heart failed
  to do its job" — i.e., can it distinguish function from mere effect (a "causal role"
  account arguably can''t distinguish malfunction from normal operation)?


