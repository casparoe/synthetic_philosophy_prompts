  Better staging idea: a "cut" game. Participants must cut the group into two parts
  to make the two halves as independent as possible (minimum information partition).
  The pair of halves that is "least bad" to cut is the MIP. Then phi = how much the
  whole''s cause-effect repertoire differs from the cut. If there''s a relay where
  cutting is free, phi = 0. So the activity: hand participants a network on paper,
  have them search for the cut that changes least, and discover that for the feedforward
  chain there''s a cut that costs nothing (a "no-loss" cut), while for the recurrent
  one every cut costs something. That''s runnable with cards/paper, 20 people, 50-90
