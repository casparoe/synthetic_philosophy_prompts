  I am a senior at a public high school in a film-and-philosophy elective, and for
  my final paper I have been asked to read the Coen brothers'' No Country for Old
  Men — the adaptation of Cormac McCarthy''s novel, whose title is borrowed from a
  Yeats poem about old age and the body''s decay — through the problem of moral luck
  that Bernard Williams and Thomas Nagel opened up in the 1970s. Our teacher introduced
  the problem with the two lorry drivers who both doze off at the wheel, one of whom
  happens to run over a child while the other does not, and with Nagel''s inventory
  of the ways luck reaches into what we are and do: into the results of our actions,
  into the situations we happen to face, into the character and temperament we never
  chose. The control principle — the thought that we can only be assessed for what
  was up to us — strikes me as obviously true, and yet the film''s world seems designed
  to make it impossible to apply, so I suspect the film is doing something more interesting
  than illustrating a paradox. I would like a reading that takes both the film and
  the argument seriously, and I will use it to build my own essay rather than to substitute
  for it.


  [Paragraph 2] Specifically, I want to know which kind of luck each of the film''s
  central moments dramatizes, and where the film complicates the taxonomy rather than
  fitting it. Moss''s decision to go back at night with the water is a choice whose
  entire moral significance is hostage to what he cannot see coming; his death happens
  offstage and is caused by someone else, so that the audience is denied even the
  consolation of watching him meet it; Chigurh''s coin tosses, first at the gas station
  and then with Carla Jean, turn the outcome of a life over to chance, and she refuses
  to let the coin speak for her, which seems to me the most philosophically loaded
  moment in the film; and Bell''s two dreams and his retirement amount to a man trying
