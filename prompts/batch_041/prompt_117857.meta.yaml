  \ out the escape clause and replace it with a stricter one — \"no, you can't.\"\
  \ Hmm, that's heavy-handed but dramatically effective: \"I am now going to do what\
  \ the law often does: I'm going to read your directive strictly.\" Yes — that's\
  \ a good, honest mechanic and it's a real feature of advance-directive law (strict\
  \ construction, the \"clear and convincing evidence\" standard).\n\nSo: after Phase\
