  \ the crux. Maybe give them the option of speaking \"through\" the facilitator as\
  \ interpreter, which raises the interpretation problem. Good.\n\nWhat the activity\
  \ cannot reproduce:\n- It cannot reproduce the actual asymmetry of a real dementing\
