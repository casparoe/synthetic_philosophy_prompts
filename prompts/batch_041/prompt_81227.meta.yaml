  The statue/clay literature: material constitution puzzles. Key ideas: the statue
  and the lump of clay are coincident but distinct (two objects, one material). Alternatives:
  identity view (constitution is identity, i.e., they''re the same thing, sortal-relative
  identity à la Geach/Wiggins), eliminativism/nihilism, four-dimensionalism (temporal
  parts, so statue and lump share parts but differ in temporal extent), hylomorphism
  (form/matter compounds), modal accounts (the lump could survive squashing, the statue
  couldn''t).


