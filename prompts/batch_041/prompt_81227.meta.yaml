  essentially has its shape), the lump is not.

  - Sortal-dependence / identity through change: what changes can an object survive?

  - The "dominant sortal" idea (Burke): the statue, not the lump.

  - Phase sortals vs substance sortals.

  - Four-dimensionalism: the statue is a proper temporal part of the lump''s career.

  - Mereology: proper parts, the "problem of the many."


