  ---


  Hi, I''m the collections care officer at a regional museum — about 40,000 objects,
  three curators, no one on staff with any philosophy — and I need help getting from
  an abstract puzzle to something I can run at my desk.


  Roughly twice a month a treatment proposal lands on me that isn''t really a conservation
  question. The Roman torso: the head and both arms are eighteenth-century additions,
  a curator wants them off, and then wants a new carved head put on. The whale in
  the entrance hall: maybe a third real bone, the rest cast and sculpted, and it''s
  the thing every school group comes for. The longcase clock someone wants to make
  run again by swapping the movement. When these come up, one trustee says it''s the
  same object as long as it''s the same material, another says it''s the same object
  as long as it looks the same from ten feet, and the registrar just wants to know
  if the accession number survives. What actually rides on it is money and honesty:
  the record, the label, the valuation, whether we can lend it as ''the'' object,
  and once in a while whether we''re allowed to dispose of it at all. I usually have
  a day or two, sometimes an afternoon if something''s wet, and anything that changes
  a label goes to the director, who will not read anything longer than a page.


  I''m fairly sure this is the statue and the lump of clay in a museum uniform, and
  I know the usual moves in outline — two objects in one place, one thing under two
  sortals, the statue as a phase in the career of the clay, form and matter — but
  I''ve never seen anyone get from that to a rule, and I can''t either. So: write
  me a decision procedure.


  What I need it to have. The questions in the order I should ask them, and what counts
  as a sufficient answer to each, in words I can use with a curator who thinks ''sortal''
  is a kind of soup. A place where it stops and says no, this is not the original
  any more and you must stop calling it that. A place where it hands the thing to
  a person because it''s a values question dressed up as a fact question, and tells
  me who that person should be. And a small number of tests I can run in the storeroom
  — things I can actually check by looking and by asking the curator one question,
  not by reading.


  The half-idea I''ve been groping toward, which you should either fix or throw out:
  I think some of our things matter as this particular stuff with this particular
  history (the bones, a relic) and some matter as a design that could in principle
  be made again and still be the thing (a cast, a chair we let people sit on), and
  that a lot of our fights are two people asking under different headings without
  saying which. I also suspect there''s more than one identity question in play —
  one for the accession record, one for the scholar, one for the insurer, one for
  the label — and that these can honestly come apart, though I don''t know when that''s
  legitimate and when it''s just wanting to have it both ways. And if the truthful
  verdict is sometimes ''not the same object, but the same individual at a later stage'',
  I''d like to know that''s on the menu and what it would change for me.


  Then run it, start to finish, on all three cases above. At least one of them has
  to come out in a way the director won''t like, and you should say so plainly rather
  than softening it. Finish by telling me what the procedure can''t do, and where
  I''ll be fooling myself if I think I''ve got a fact when I''ve really made a choice.


  No citations, please, I won''t chase them down, and no headings, bullets, bold or
  tables — plain paragraphs, like an email, because I''ll be reading it on my phone
  between meetings.


