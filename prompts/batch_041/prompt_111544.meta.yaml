  I chair the standing scientific advisory panel of a state drinking-water program.
  The panel has nine members: five technical specialists and four public representatives,
  and it advises the program''s director, who has never departed from a unanimous
  panel recommendation but is free to do so.


  Two of our technical members — call them A and B — have spent the last ten days
  on the same question: whether a cluster of anomalous readings at a single intake
  point indicates that a contaminant has entered the distribution system serving roughly
  400,000 people, or whether it is an artifact of sensor drift and seasonal turnover
  in the reservoir. They have read the same raw data, the same maintenance logs, and
  the same three independent lab reports; they have met for six hours, twice, with
  no one else present; and they have each written a four-page reasoning memo that
  the other has read and annotated. They still disagree. A puts the probability that
  contamination has occurred at roughly 0.7 and wants us to recommend that the director
  issue a public advisory and switch the system to its alternate supply. B puts it
  at roughly 0.15 and wants no public action, arguing that a false alarm would cost
  the department credibility it will need for a genuine event.


  The panel votes Thursday at 5 p.m., and the director wants our recommendation the
  same evening, so that an advisory could go out before the holiday weekend, when
  the system''s staffing drops.


  One of the lay members, a retired philosopher, has circulated a note arguing as
  follows: rational agents who share the same evidence cannot rationally disagree;
  Aumann''s agreement theorem shows that disagreement of this kind is a defect rather
  than a signal; therefore at least one of A and B is either not reasoning correctly
  or is withholding something, and the panel should not split the difference but should
  find out which. She proposes an amendment to our charter, which she calls the Convergence
  Rule, to be adopted at the same meeting: "Where two panel members, after exchanging
  all evidence and reasons, continue to assign materially different probabilities
