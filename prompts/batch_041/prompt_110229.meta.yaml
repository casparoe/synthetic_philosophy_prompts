  I''m a features writer at a general-interest magazine, where I cover ideas — philosophy,
  the social sciences, and the intellectual fashions that migrate out of the seminar
  room into corporate life. For the past several months I''ve been reporting on the
  afterlife of philosophical traditions inside management culture, and my current
  piece is about a small but self-conscious practice among advisory and law firms
  of adopting Confucian role ethics as an explicit operating philosophy — not the
  fortune-cookie version, but the serious one: the self as constituted by its relations
  rather than standing behind them, obligation graded by the closeness of the relation,
  ritual propriety rather than rules as the binding agent of an institution, and harmony
  as an ideal distinct from mere agreement. What I need from you is the sidebar: an
  internal memo, in full corporate deadpan, of roughly 700 to 800 words, sent by the
  managing partner of a mid-sized advisory firm (I''ve been calling it Marsh & Elder;
  keep the name) to all staff after a bruising quarter. In that quarter the firm restructured
  away a second-year analyst, placed a senior associate on leave for going to a regulator
  with concerns about a client engagement, and promoted the partner who had kept the
  engagement quiet. The memo''s job, in the partner''s own view, is to explain why
  the firm''s role-ethical commitments make each of those three outcomes correct,
  and — this is important to him — humane. He is entirely sincere, mildly hurt that
  anyone would question the firm''s character, and fond of the phrase "our people"
  in a way that should begin to trouble the reader.


  Get the tradition right before you get it funny: the partner should open by making
  the genuinely attractive case for role ethics — that it refuses the picture of the
  detached rational chooser, that it treats roles not as costumes over a private self
  but as what a person actually is, that ritual and form are not empty ceremony but
  the technology by which relations become real and durable, and that a firm which
  runs on rules rather than forms gets exactly the shallow, transactional culture
  it deserves. That opening should be persuasive enough that a specialist nods along.
  Then let the three incidents do their work, and let the objections surface without
  ever being named or argued. The reader should close the memo feeling, though the
  partner never says it, that a philosophy which grounds obligation in the role you
  occupy has trouble explaining what you owe yourself when the role itself has gone
  rotten; that graded obligation, applied to an organization, is a machine for producing
  favoritism that cannot recognize itself as favoritism; and that an ideal of harmony
  can absorb dissent so smoothly that the dissent never lands anywhere. Keep the partner''s
  reasoning airtight and never let him slide into liberal-individualist premises about
  rights, consent, or autonomy — the moment he does, he''s off the hook, and the joke
  dies.


  Two constraints on accuracy, since I want the piece to reward someone who knows
  this material and to be legible to someone who doesn''t. First, the doctrine in
