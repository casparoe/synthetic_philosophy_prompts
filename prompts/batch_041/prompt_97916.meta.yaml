  p→q, but not know q, because your belief in q might not track q (e.g., you believe
  q for reasons independent of the p-based inference; if q were false, you''d still
  believe it). The classic case: you know you have hands, and you know "if I have
  hands, I''m not a brain in a vat," but you don''t know you''re not a brain in a
