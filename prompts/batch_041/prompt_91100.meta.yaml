  Draft:


  ---

  Please write a comparative essay in American English on endurantism and perdurantism
  as accounts of how material objects persist through time. I am assembling a casebook
  for an advanced metaphysics seminar, so I am less interested in a survey of the
  familiar slogans than in a demonstration that you can think through the arguments
  on their own terms. Do not include citations, reading lists, or references to particular
  authors; work directly with the positions and the arguments, and treat the essay
  as self-contained.


  I want the essay organised around the following three tasks.


  First, state the disagreement precisely. It is not enough to say that the endurantist
  holds that an object is wholly present at each moment of its existence while the
  perdurantist holds that it has distinct temporal parts. Say what each position must
  maintain about two further matters: (a) what it is for an object to have a property
  at a time — whether "at a time" qualifies the object''s possession of the property,
  the property itself, or the mode in which the property is had — and (b) what change
  consists in. Make clear which of these commitments is doing the explanatory work
  in each view.


  Second, consider a disc that is perfectly homogeneous — uniform in colour, density,
  and every other feature — and that rotates about its axis. At any single instant
  its instantaneous state is indistinguishable from that of an exactly similar disc
  at rest: no part is distinguished from any other, so nothing in the instantaneous
  state reveals motion. [Careful: rotation of a homogeneous disc — actually is the
  instantaneous state indistinguishable? A rotating disc''s snapshot vs a stationary
  one: yes, if perfectly homogeneous, the snapshot is identical. The standard argument
  says the instantaneous states are the same.] Yet the disc is rotating. Set out what
  each view must say about this case, and be explicit about the cost each incurs:
  in particular, whether the endurantist can avoid treating the disc''s shape and
  position as relations to times, and whether the perdurantist''s appeal to temporal
  parts genuinely explains the motion or merely relabels it.


  Third, ... evaluate two objections: (i) that the perdurantist''s account of how
  temporal parts compose a single persisting thing is either unexplained or covertly
  endurantist — the parts must themselves be held together by something, and if that
  something is a further relation, the same question arises; (ii) that the endurantist''s
  temporally qualified properties are not intrinsic properties at all, so that on
  that view nothing ever simply has a shape or a mass. Then, to force the comparison
  beyond the standard exchanges, assess both views against the following two stipulations,
  which I am introducing for the purposes of the exercise:


  - The parity principle: differences between the temporal and the spatial dimensions
  are to be treated as differences of structure to be explained, not as brute metaphysical
  asymmetries; a theory that treats time as formally on a par with space is, to that
  extent, to be preferred.

  - The process-first constraint: what is fundamental is not things that have histories
  but the processes and activities of which histories are made; continuants are, at
  best, stable patterns abstracted from those processes.


  Ask: which of the two views of persistence fares better under each stipulation,
  and does perdurantism genuinely approach the process-first picture or only appear
  to do so because it replaces one thing with many things of the same kind? [Hmm,
