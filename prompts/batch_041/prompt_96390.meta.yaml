  Consider the disjunctivism one: a journalist covering mind/perception research.
  Scenario: at a workshop on perception and virtual reality, two attendees argue.
  Move 1 (A): the argument from illusion — since a straight stick half-submerged in
  water looks bent and we know it isn''t, the perception must involve something that
  is as it appears (a sense-datum / an appearance), which can be present in hallucination
  too, so perception is at best an inference from appearances. Move 2 (B): the "looks"
  in "looks bent" is not a report of an object of perception but a description of
  the experience; the argument equivocates between "looks F" as phenomenal and as
  comparative/epistemic ("looks the way a bent stick looks"), so no sense-datum follows.
  Move 3 (A): fine, drop sense-data; the real point is the common factor: any experience
  you have while perceiving could be had in a hallucination, and the "what it''s like"
  is identical, so the disjunctivist must either deny a datum (that the hallucinating
  and perceiving subjects are subjectively alike) or admit a common element that carries
  the epistemic weight — and if the hallucination has the same experiential character
  and no justification, then the perceiver''s justification can''t come from the experience.
  Move 4 (B): that''s the "screening off" objection; the disjunctivist''s reply is
  that justification isn''t a matter of what''s in common but of the fact that in
  the good case the experience is a relation to the world; the hallucinating subject''s
  belief is unjustified because it''s not caused/knowledge-constituting; the perceiver''s
  "I can''t tell" is not an introspective claim about a common mental state but a
  statement of a limitation. Move 5 (A): but if you can''t tell from the inside whether
  you''re in the good case, then your justification depends on a fact you can''t access,
  which makes it a matter of luck — externalism; and if externalism is right, then
  "looks" can''t be evidence at all... etc. Also move: "the disjunctivist owes an
  account of why the bad case has the same ''phenomenal character'' but not the same
  ''content''" — could be the crux: whether phenomenal character is "content" or "relational."


