  / like publishing research on recombinant DNA / like the printing press / like open-source
  software (Linux, crypto)". The most common: "AI weights are like a recipe/blueprints;
  releasing them is like handing out nuclear know-how" vs. "open source software analogy:
  Linux, cryptography, security through openness". Also "it''s like publishing the
  genome of a deadly virus."

  - Tool AI vs agent AI: analogy "tool AI is like a hammer, agent AI is like a butler/employee";
  "like a genie"; "like a car with or without a driver"; "like a calculator vs. a
  servant." A common analogy: an AI agent is like hiring an employee; a tool is like
  a power tool. Also "like a compiler vs. a programmer."

