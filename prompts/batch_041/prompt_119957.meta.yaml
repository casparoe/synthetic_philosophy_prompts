  I''ll state it in my own words rather than the textbook way, because I think the
  textbook way makes it look worse than it is. Call it the availability thesis: every
  fact about the world is, at bottom, a fact about what experiences are available
  and under what conditions. Not ''what someone actually experiences'' -- I''m not
  saying the room goes dark when I leave -- but ''what would be experienced if such-and-such
  were done''. So ''there''s a tree in the yard'' unpacks into a family of conditionals
  about what you''d see, touch, bump into, smell, and so on.


  Two things I want to insist on. First, I don''t think the master argument is the
  load-bearing part of this. I know it''s supposed to be a cheat: you can''t conceive
  an unconceived tree, but that''s just because conceiving it makes it conceived.
  Fine. What actually convinces me is more like a no-sample argument: every sample
  of ''existence'' any of us has ever had is an experiential one; ''mind-independent
  existence'' is supposed to be a kind of existence of which we have, by construction,
  no sample at all. And second, a parsimony point: whatever the physical story is
  doing, the explanatory work is all done by the regularities -- the fact that experiences
  come in stable, lawlike, intersubjectively shared patterns. Adding ''and also there''s
  stuff in itself behind the patterns'' doesn''t predict anything extra. So the mind-independent
  world looks to me like an idle wheel that people keep because it''s grammatical
  rather than because it earns its keep.


