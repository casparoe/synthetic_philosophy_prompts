  1. The actor''s art is one of counterfeiting — he takes on a persona not his own,
  and habit of doing so corrupts the actor''s own character (the "professional liar"
  argument).

  2. Even if the play is morally fine, the audience''s pleasure is detached — they
  feel virtue vicariously and leave without acting, "the heroism is out of reach."

  3. The theater''s structural point is to please, not to improve; and audiences will
  reject genuinely moral comedy (Molière''s Misanthrope makes the honest man ridiculous).

  4. Comedies flatter the audience''s self-image; the audience laughs at the character
  who is like them.

  5. The remedy is not private spectatorship but *fêtes* — public festivals where
  the spectators are each other, no representation, no separation between performers
  and audience.

  6. Structural conditions matter: he argued against a theater *for Geneva specifically*
  because of scale, geography, economy, and because a small, relatively innocent city
  has more to lose than a large corrupt one where theater distracts from worse crimes.
  He did not demand closing the Paris theaters.


