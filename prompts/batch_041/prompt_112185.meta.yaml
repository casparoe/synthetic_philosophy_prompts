  Title: Three Axes of Cyclicity, and Why "Cyclical vs. Linear" Is a Bad Question


  Most debates about whether history is cyclical or linear founder because they treat
  a single question where there are three. A view of history can be cyclical or linear
  along (1) an ontological axis — whether the historical process literally returns
  to earlier states, as in eternal return, or is a single irreversible sequence; (2)
  a typological axis — whether the same forms recur (the rise and fall of regimes,
  the consolidation and dissolution of solidarities), regardless of whether the underlying
  sequence repeats; and (3) an axiological axis — whether the direction of the whole
  is good, bad, or neutral.


  Once the axes are separated, the four canonical figures look less like a family
  and more like four different positions on a grid. Polybius holds typological cyclicity:
  constitutions pass through a fixed sequence — monarchy, its corruption into tyranny,
  aristocracy, oligarchy, democracy, ochlocracy — and the mixed constitution of Rome
  arrests rather than abolishes this rotation. Ibn Khaldun holds typological cyclicity
  too, but keyed to a different mechanism: solidarity, or asabiyya, is generated in
  the hard periphery, conquers the soft center, is diluted by luxury over roughly
  three generations, and yields to the next wave. Spengler and Toynbee, by contrast,
  are often read as holding ontological cyclicity, on the model of organisms with
  a fixed lifespan — a culture is born, matures into a civilization, and dies on a
  schedule of roughly a millennium.


  My claim is that the first two positions are stable and the latter two are not,
  and that the instability is instructive. If recurrence is only typological, the
  substrate can be perfectly linear: Polybius''s Rome does not repeat, it resists;
  Ibn Khaldun''s dynasties succeed one another in a single, undated, and ultimately
  providential sequence. But the moment recurrence is ontological — the moment the
  cycle is a clock rather than a pattern — the thinker owes us a period, and the period
  cannot be derived from the materials of history without circularity. Spengler''s
  millennium is not measured; it is stipulated, and then used to measure. Toynbee,
  to his credit, retreats: the breakdown of a civilization comes from within, but
  it is a failure of response rather than the expiry of a term, which makes his cycles
  a matter of agency and not of ontology.


  What I take from this is that the interesting variable is not cyclicality but the
  phase relation between cycles of different periods. Constitutional cycles, demographic
  cycles, and cycles of solidarity have no reason to share a period, and the phenomena
  we care about — revolutions, collapses, "declines" — are plausibly phase-lockings
  or interference patterns rather than the completion of any single cycle. On this
  view, the cyclical/linear question is a category mistake: every historical process
  is linear in its substrate and cyclical in its forms, and what varies is only the
  coupling between them.


