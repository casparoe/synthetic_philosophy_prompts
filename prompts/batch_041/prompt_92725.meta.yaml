  Draft:


  I am a third-year undergraduate reading Philosophy and History of Science, and I
  am currently taking a module on the demarcation problem and pseudohistory. My department
  is hosting a public panel next month on the theme of contested origins, and I have
  been asked to give the opening remarks. The panel itself will be a historian of
  ancient Mediterranean archaeology, a philosopher of science, and a popular writer
  who defends the idea that Plato''s Atlantis is a distorted memory of a real prehistoric
  civilisation. The audience will be mixed: about half are academics and students
  from the department, and the other half are members of the public, including a local
  society that is sympathetic to the new chronology thesis—the claim that conventional
  ancient history is largely a duplicate of mediaeval history—and to ancient-astronaut
  ideas. I have to welcome everyone, set the tone for a civil discussion, and explain
  what will count as a serious historical argument, without either debunking the panel''s
  more controversial guests in advance or pretending that all claims are equally well
  supported.


  Please act as a professional philosopher of science with expertise in demarcation
  and as an experienced speechwriter. Think carefully about the rhetorical situation.
  Start by brainstorming, in note form, the demarcation criteria you will use, how
  each might be abused, and the particular traps of this occasion. Then write the
  speech itself, about seven minutes long, in British English.


  The philosophical content must do structural work: I do not want a speech that merely
  mentions the demarcation problem and then says we should all be nice. I want the
  speech organised around a small set of questions that any historical claim must
  answer—questions about testability, consilience with independent lines of evidence,
  predictive fertility, the handling of anomalies, and the difference between a research
  programme that grows and an ad hoc rescue that only protects a favoured conclusion.
  Let those questions determine the shape of the speech and what I can and cannot
  say. Apply them, lightly and without adjudicating, to two examples: the Atlantis
  claim and the new chronology claim. The speech should leave the audience with a
  clear sense of the standards, not with a verdict on the guests.


  Do not cite any authors, works, or dates, and do not include any quotations. I cannot
  verify them, and the speech must not sound like a literature review. Avoid naming
  scholars or schools of thought; use the ideas themselves. Do not use a reading list,
  footnotes, or references. If you need an example of a fallacy or a criterion, describe
  it in plain language.


  The speech should be warm enough to work as a welcome, firm enough to be worth hearing,
  and honest about the fact that some views at the table may not meet the standards
  being set. It should not sneer, and it should not engage in false balance. End with
  a sentence that hands the panel over to the moderator.


