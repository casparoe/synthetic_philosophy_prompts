  of disagreement can''t survive; (3) with different priors (heterogeneous priors),
  agreement doesn''t follow; (4) the theorem can be extended (Aumann''s "agreeing
  to disagree" applies to conditional probability of an event given an event); (5)
  the "no trade" theorems (Milgrom-Stokey) and "speculative trade" literature — if
  agents have common priors and common knowledge of the trade, they wouldn''t trade.
