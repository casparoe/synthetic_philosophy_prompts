  Now, the philosophical content of Aumann''s agreement theorem: Aumann 1976, "Agreeing
  to Disagree," Annals of Statistics. The theorem: if two agents have the same prior
  and their posterior probabilities of an event are common knowledge, then those posteriors
  are equal. Common knowledge is defined in terms of the meet of the information partitions.
  The theorem doesn''t require truth or accuracy of priors. It requires that the agents''
  priors be common knowledge... actually the standard statement: two agents with common
  prior, whose posterior beliefs are common knowledge, must agree. The result requires
  the agents'' information to be represented by partitions, updating by conditioning
  (Bayesian conditionalization), and the prior to be common (and the "common knowledge"
  of posteriors is in the sense of Aumann''s formalization, which builds in infinite
  iterations).


