  and only then write the story.


  The concept I want the story to be built around is the higher-order family of theories
  of consciousness. The core claim of that family is that a mental state is conscious
  not because of anything intrinsic to the state itself but because a suitable higher-order
  representation of it exists — a representation that is about that first-order state.
  The family splits in ways that matter for a story: the higher-order element may
  be conceived as a thought-like judgement (so that being conscious of a state is
  a bit like believing something about yourself), or as a perception-like inner sense
  (so that it can misrepresent in the way perception does); and it may be conceived
  as an occurrent episode or as a mere disposition to make the first-order state available
  for report, reasoning, and control. A first-order rival holds instead that a state
  is conscious in virtue of its own properties — how it is processed, how widely it
  is broadcast, how it reverberates in the system — so that the higher-order representation
  is at most a report on consciousness rather than its maker.


  Two consequences of the higher-order picture are the engines I want the story to
  run on. First, if the higher-order representation can be wrong, then a subject can
  be ''conscious of'' a state she does not have, and can fail to be conscious of a
  state she does have; the mismatch between what is there and what is represented
  is not a malfunction of consciousness but a possibility built into the theory. Second,
  if what makes a state conscious is the presence of the right higher-order representation,
  then a system whose first-order life is thin or strange could nonetheless have a
  rich conscious life, and vice versa.


  I want a story set in a near-future clinic that has turned one version of this picture
  into a medical product. Call it a second-order calibration: a small implanted monitor
  continuously generates higher-order representations of the patient''s bodily and
