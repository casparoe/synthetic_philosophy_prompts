  Here''s the thing I want translated. There''s this old problem: you have a circle
  and you ask for the probability that a randomly chosen chord is longer than the
  side of the inscribed equilateral triangle. You can fix a chord by picking its midpoint,
  or by picking an angle and a distance, or by picking two endpoints on the circumference,
  and each choice gives you a different answer (1/2, 1/3, 1/4, depending). The principle
  of indifference says that if you have no reason to prefer one outcome over another,
  you should assign equal probabilities; but the different parameterizations each
  look like the indifferent choice, and they disagree. The philosophical question
  is whether this shows the principle is incoherent, or whether it just shows that
  ''indifference'' has to be relativized to a parameterization / symmetry group /
  physical randomization procedure.


  Now restate that debate in the vocabulary I actually use. I want the translation
  to use things like: a prior as part of a generative model, reparameterization and
  change of variables, Haar measure / invariant priors, Jeffreys prior, maximum entropy,
  the difference between a parameter and an observable, model specification vs. inference,
  and the fact that in a probabilistic program you have to write down the sampling
  statement that generates the chord. Do it as faithfully as you can, and don''t smuggle
  in the Bayesian-ML assumptions and call it a translation.


