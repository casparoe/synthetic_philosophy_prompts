  Key correct points about heritability:

  1. Heritability (in the narrow sense, h²) = proportion of phenotypic variance in
  a population attributable to additive genetic variance. Broad sense H² includes
  all genetic variance (additive, dominance, epistatic).

  2. It''s a property of a population in a given range of environments at a given
  time — not of an individual, not a fixed constant.

  3. It says nothing about the causes of a trait within an individual; it''s about
  differences.

  4. It does not measure malleability. High heritability doesn''t mean an intervention
  can''t change the trait (e.g., PKU is 100% genetic and fully treatable by diet;
  myopia is highly heritable but changed massively with environment — actually myopia
  increased hugely in East Asia, showing environmental change; and eyeglasses "treat"
  it).

  5. Heritability can change with the environment: the Scarr-Rowe hypothesis / Turkheimer
  et al. 2003 found that the heritability of IQ was higher in high-SES families and
  near zero in low-SES families. (This is a real finding, replicated in some studies,
  contested in others.)

  6. Environmental uniformity raises heritability: as environments become more equal,
  the remaining variance is more genetic. E.g., the heritability of height rose over
  the 20th century as nutrition and disease environment improved (or: heritability
  of height is high in well-nourished populations). Also the "heritability of educational
  attainment rose as education expanded."

  7. Within-group vs between-group heritability: high heritability within groups implies
  nothing about the causes of between-group differences (Lewontin''s example: a bag
  of seeds divided into two plots, one with good soil — heritability within each plot
  is 100% but the between-plot difference is entirely environmental). This is Arthur
  Jensen / Lewontin / Ned Block''s "How heritability misleads about race."

  8. "The nature of nurture": environmental measures are themselves heritable (Plomin
  & Bergeman 1991); parenting is partly genetically influenced, so "environmental"
  correlations may be gene-driven; this complicates causal inference.

  9. Heritability estimates come from twin/adoption designs, which have assumptions
  (equal environments assumption, no assortative mating, representativeness). Also
  the "missing heritability" problem from GWAS — SNP heritability lower than twin
  heritability, suggesting non-additive effects and gene-environment interplay.

  10. Turkheimer''s three laws of behavior genetics.


