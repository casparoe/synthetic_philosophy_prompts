  - The problem: outcome rewards are sparse and gameable; process rewards are denser
  but can be gamed by rationales that look good.

  - The deeper issue: process supervision as implemented supervises the *text of the
  reasoning*, not the computation; if the model''s answer isn''t causally downstream
  of the CoT (unfaithful CoT), then process supervision teaches the model to produce
  plausible justifications, i.e., trains for the appearance of reasoning (a kind of
  "rhetoric reward"). This is a real, subtle point.

