  "Ok I need help with something and I think the only way to see it clearly is to
  make two people argue about it out loud.


  Background: I''m a third-year in a phil of mind / cog sci program, and my prospectus
  is on teleosemantics — the whole project of getting content out of biological function.
  I''ve read the usual stuff (Millikan''s proper functions, the frog-and-fly detector
  stuff, the asymmetric-dependence reply to the disjunction problem, the swampman
  stuff) and at this point I can recite all the moves, which is the problem. I want
  to see the two views actually pressed against each other on a case that isn''t the
  frog.


  So: write me a dialogue between two philosophers, both good, neither a strawman,
  neither one an idiot who just doesn''t get it.


  One of them — call her R — is a selectionist. For her, a state represents X only
  if the mechanism that produces that state was selected for producing it in conditions
  where X obtained; content is fixed by history, by the proper function of the state-producer.
  She''ll say: no selection history, no content, full stop. She''ll also say it''s
  fine to be vague about the "conditions" — proper functions are statistical, Normal
  conditions aren''t the actual conditions, misrepresentation happens when Normal
  conditions fail.


  The other — call him T — thinks history is a red herring and that what does the
  work is the current causal-informational link plus the way the rest of the system
  depends on it. His story about the disjunction problem is asymmetric dependence:
  the state means X rather than X-or-Y because the Y-link is asymmetrically dependent
