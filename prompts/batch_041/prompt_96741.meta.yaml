  (3) I think my ambiguity aversion is rational, not a bug — it''s not like a fallacy,
  since I''m not sure what the odds are and I''d rather not bet when I don''t know.

  (4) I think the sure-thing principle is obviously right (if I prefer A to B in both
  cases, I prefer A to B when I don''t know which case).

  (5) I think two people with the same information should be able to bet with each
  other, and if neither will take either side of a bet that''s a sign something''s
  off.


