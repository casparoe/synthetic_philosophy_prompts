  4. The "Pascal''s mugging"/fanaticism angle: infinite expected value from tiny probabilities
  (e.g., a 1-in-10^100 chance of infinite value dominates).

  5. Asymmetric/lexical: any infinite good beats any finite good — so finite concerns
  are "swamped."

  6. The "undecidability" problem: there''s no canonical way to compare infinite sets
  of value; e.g., "everyone gets a happy life" vs "everyone gets a happy life except..."
  — the "infinity of evil" problem (e.g., an infinite universe with infinitely many
  people suffering).

  7. Bostrom''s "Infinitarian paralysis": if the universe is infinite, nothing we
  do matters — or, more precisely, all finite actions have zero effect on the total.


