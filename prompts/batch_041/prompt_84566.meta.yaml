  Potential prompt:


  I am a high school student, and I am trying to referee an argument that broke out
  in my ethics club. We were discussing a visiting student from a country where tipping
  is not customary and where pedestrians cross whenever the street is clear. During
  her first week here, she left no tip at a sit-down restaurant, walked through a
  crosswalk against the light when no cars were coming, and cut into a long queue
  at the cafeteria because she assumed it was just a crowd waiting for tables. Two
  club members, Maya and Jonah, disagreed about whether she did anything wrong.


  Maya said: "Tipping, queueing, and jaywalking are not just local quirks. They are
  the terms on which a society coordinates, and a visitor who takes the benefits of
  being here -- safe streets, paid service workers, orderly lines -- while ignoring
  those terms is free-riding. At minimum, she owes locals the courtesy of following
  the conventions she can see, even if she doesn''t endorse them."


  Jonah replied: "That proves too much. If convention alone created moral obligation,
  any oppressive or arbitrary local rule would bind visitors. She didn''t consent
  to these norms, and some of them -- especially jaywalking laws that almost no one
  obeys -- are not moral rules at all. Tipping is a private transfer, not a duty;
  queueing is just efficient; and crossing an empty street harms no one. We should
  distinguish conventions that are morally load-bearing from mere habits, and not
  demand that outsiders treat the second as the first."


  Maya answered: "Consent isn''t the only source of obligation. When you enter someone''s
  home, you follow their house rules even if you didn''t vote on them, and you don''t
  get to ignore the queue just because you find it inefficient. Besides, the visitor
  isn''t being asked to adopt the norms as her own; she''s being asked not to impose
  the costs of her noncompliance on people who are following them."


  Jonah said: "But that just assumes the norms are fair. If a tip is expected because
  employers underpay staff, the visitor is being conscripted into fixing a labor problem
  she didn''t create. And if the queue is just a local preference, her cutting in
  is rude, maybe, but not immoral. There''s a difference between breaking a rule and
  wronging a person."


