  don''t hand over beneficiary data to authorities; we don''t deceive people to get
  consent for research. And every few months someone argues: if we make ONE exception
  here, we prevent FIVE more violations of the same rule later. That''s the paradox:
  our rules are supposed to protect each person, but refusing seems to sacrifice people
  to the rule itself.


  Then ask: give me a decision procedure. Questions in order, what counts as a sufficient
  answer, where it stops with a no, where it hands off to a human. It has to be runnable
  by someone who isn''t a philosopher, in a couple of hours, on incomplete info. It
