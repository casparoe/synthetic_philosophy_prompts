  Paradox of deontology (Scheffler 1982, "The Rejection of Consequentialism"; also
  the "paradox of deontology" discussed by Fried, Nozick, Scheffler): Deontological
  constraints say you may not violate a right even to prevent more such violations.
  But deontology is typically justified by the importance of the individual person
  / the value of not being used. Yet the constraint seems to give less weight to the
  claims of those you could save. Scheffler: "the paradox of deontology" is that deontologists
  hold that each person has a special inviolability, yet they refuse to minimize violations
  of that inviolability. If the reason for the constraint is the importance of not
  violating rights, why not violate one to prevent five? So there''s a tension.


  Also there''s the related "paradox of deontology" where deontologists think there''s
  a duty not to do X, but if everyone follows it, more X happens. E.g., "the paradox
  of deterrence" and "paradox of deontological constraints" (e.g., torturing one to
  save many; killing one to prevent many killings).


