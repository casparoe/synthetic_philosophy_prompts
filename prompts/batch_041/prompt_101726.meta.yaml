  Draft:


  "I run the ethics/exceptions desk at a mid-sized humanitarian org — I''m not a philosopher,
  I''m the person who gets the awkward requests. We have a short list of things we
  publicly say we never do: we don''t pay armed groups for access or for releasing
  our staff, we don''t hand over beneficiary data to governments, and we don''t deceive
  people to get their consent to be in our research. Maybe a dozen times a year someone
  in a country office asks for an exception, and the argument is always the same shape:
  yes, this one thing breaks the rule, but doing it prevents several more breaks of
  the very same rule down the line — five more detentions if we don''t pay, thousands
  of patients dropped if we don''t hand over the list, a study that would save a lot
  of lives if we''re allowed to be sneaky just this once.


  That''s the thing I can''t get my head around. If the reason we have these rules
  is that each person matters and shouldn''t be used, then it seems like we should
  care a lot about the extra people who get hurt when we stick to the rule — so why
  not break it? But if we start weighing the numbers, we don''t have rules anymore,
  we just have a cost-benefit sheet, and the rules were supposed to be exactly what
  stops us from doing that.


  So: can you turn this into a decision procedure my desk can actually run? The order
  of questions, what counts as a good enough answer to each, where it just stops with
  a no, and where it hands the call to a person because it''s a value judgment and
  not a fact. It has to be runnable by a smart non-philosopher in an afternoon with
  incomplete information, and it has to preserve whatever it is that makes a rule
  a rule rather than a number to be traded — I want the procedure to be able to say
  ''the fact that there are more people on the other side doesn''t cancel the reason
  not to do this to him'' — while still admitting that some exceptions are genuinely
  right. Include a step for the ''what happens if everyone copies us'' worry, but
  be clear that that''s a different kind of reason than the one the rule is made of.


  Then run it on three: (1) the payment to get two staff back, where not paying has
  correlated with more detentions but we can''t prove it; (2) the beneficiary list,
  where refusing probably kills the program for thousands and handing it over puts
  a few people in real danger; (3) a case I''ll hate — a field team wants to mislead
  a local official to move medical supplies through, which would save several lives,
  and I suspect your procedure says no. I want to see it say no to me.


  And at the end, tell me honestly which steps are just judgment dressed up as procedure,
  and what the procedure can''t do at all."


