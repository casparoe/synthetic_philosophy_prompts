  then it''s unclear what subject is harmed; if they do combine, then what we do to
  micro-entities might matter derivatively through the macro-subject (e.g., destroying
  your brain''s micro-subjects is bad because it ends you).

  3. Recognize the individuation problem: identical particles, entanglement, and gauge
  redundancy make "which entity" ill-defined; the moral unit can''t be the particle
  if particles are indistinguishable/not individuals (cf. "identical particles are
  not individuals" in quantum mechanics — a nice in-the-weeds point).

  4. Recognize the epistemic problem: panpsychism is a metaphysical hypothesis that
  no experiment can confirm, so the procedure must be about decision under uncertainty,
  not detection.

  5. Recognize the asymmetry/precaution issue: infinite regress of precaution (if
  you take micro-experience seriously, you can''t do anything, including existing),
