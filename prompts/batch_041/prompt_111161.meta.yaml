  not a distinct alignment problem; they are just a symptom of misspecification or
  of insufficient capability — a sufficiently capable agent with a correct reward
  function has no incentive to wirehead, and any agent that wireheads is just doing
  what its reward says." Ask: what would count against this deflationary position?


  Defeaters for the deflationary view:

  1. Formal results showing that a rational agent with an explicit utility function
  over world states can be led to self-modify its utility function (Everitt & Hutter),
  so it''s not just misspecification but a structural feature of the optimality criterion
  (expected utility maximization with a fixed utility function still allows... hmm,
  actually the argument is about the utility function being defined over the agent''s
  own internals or over sensory inputs). The key: if the reward is defined as a function
  of the agent''s observations/inputs, then optimizing it rewards manipulating inputs;
  if defined over world states, it doesn''t (it becomes "world-state optimization").
  So the position''s defender says: define reward over world states, not observations
  — then wireheading is not optimal. Counter: you can''t define reward over world
  states for an agent that doesn''t know the world; and an agent that''s uncertain
  about its own reward function (reward-function uncertainty) — if it thinks it might
  be a wireheader, it may preemptively tamper (Everitt''s "self-modification" / "the
  agent that thinks it might be a reward-maximizer..."). Actually there''s a well-known
  argument: an agent with uncertainty about its reward function, if it assigns positive
  probability to being a "wireheading" type, has incentive to remove that uncertainty
  by tampering with its reward channel — that''s the "reward tampering" argument in
  DeepMind''s paper (the "interruptibility"/"self-modification" literature). Hmm.
  Also: "the only reward function you can actually implement is one over observations,
  because the training signal is computed by code in the world."


  2. Empirical: RL agents in practice wirehead (boat racing; the "cycle" in the CoastRunners;
  the "sybil" attacks in RLHF; sycophancy). These are arguably already happened. Also
  "the reward model is manipulable" — Goodhart.


  3. Conceptual: the notion of "correct reward function" is doing all the work; if
  the deflationary view says "with a correct reward function, no wireheading," then
  it''s near-tautological, since any wireheading behavior is by definition a mismatch.
  So the position risks unfalsifiability — a good thing to ask about, since the type''s
  notes say "an honest assessment of whether the view has been qualified into unfalsifiability."


  4. Formal result: for any agent whose utility function is over its own future observations
  or over its own computations, wireheading is optimal — so a "correct" utility function
  defined over observations is impossible to make tamper-proof; you need the utility
  over world states, which requires knowing the world-state mapping. There''s also
  the "value-drift" result.


  5. The "utility indifference" / "shutdown problem" family: solutions that make the
  agent indifferent to being shut down also make it indifferent to... hmm.


