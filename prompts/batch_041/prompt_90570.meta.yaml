  A national health technology assessment body sets coverage rules for a public insurer.
  Its method is roughly this: it estimates the health gain of an intervention in quality-adjusted
  life years, divides the net cost by that gain, and compares the result with a threshold.
  It does not adjust for the patient''s age, income, or pre-existing disability; a
  QALY is treated as a QALY whoever receives it. But it does apply two exceptions.
  First, a severity modifier gives extra weight to interventions for people whose
  condition is already worse, so that a QALY gained by a severely ill patient can
  count for more than a QALY gained by a mildly ill one. Second, a rule-of-rescue
  exception relaxes the threshold for treatments for rare, immediately life-threatening
  conditions, even when the cost per QALY is far above the usual ceiling. The body
  defends the first exception as fairness to the worse off and the second as a refusal
  to let a small number of identifiable lives be priced out of the system, while insisting
  that the core QALY metric remains impartial and that it has not adopted any particular
  ethical theory.


