  and I''d like a consistency audit before I circulate it. Here is the package, as
  compactly as I can put it.


  (1) Suffering is the only thing that is intrinsically bad. Pleasure and preference-satisfaction
  are not intrinsically good at all; they matter only insofar as they relieve, prevent,
  or mask suffering.


  (2) Suffering above a severity threshold — roughly, the kind of suffering someone
  would give up almost anything to escape — is lexically prior to every good: no quantity
  of pleasure, however great, can outweigh a single episode of it. Below that threshold
  suffering aggregates in the ordinary way, so a great many mild frustrations can
  outweigh one moderate pain.


  (3) Coming into existence is never a benefit to the one who comes to exist, though
  it can be a harm. So there is no duty to create happy beings, and there is a defeasible
  reason not to create beings who will suffer.


  (4) I am not a utilitarian about action. It is impermissible to kill a competent
  person, even painlessly and against no one''s interests but their own attachment
  to living, in order to prevent a larger quantity of suffering elsewhere. I reject
  the so-called benevolent world-exploder.


  (5) The capacity to suffer is what grounds moral status and nothing else does. Plants,
  ecosystems, and present-day artifacts have none. I am genuinely undecided about
  insects and about whether any current AI system can suffer.


