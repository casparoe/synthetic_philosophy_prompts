  In my philosophy of mind seminar, two classmates, Mara and Dev, got into an argument
  about pain asymbolia and whether pain can be bad for someone who does not mind it.
  Our instructor had described pain asymbolia as a condition in which patients report
  feeling pain—often can locate it and rate its intensity—but seem indifferent to
  it, not distressed, and sometimes even smile or joke while reporting it. She then
  introduced a hypothetical variant she called "inverted asymbolia": a patient who
  reports no pain at all, but shows all the behavioral and autonomic signs of intense
  suffering, and later describes the episode as "bad, but not painful." The question
  was whether either case shows that the badness of pain is separable from the sensation
  itself.


  Mara said pain asymbolia shows that pain''s badness lies entirely in its affective
  or motivational component, not in the sensory quality. If the aversion is gone,
  the pain may still be a sensation, but it is not bad for the patient; the patient
  is not suffering. She said inverted asymbolia, if it occurred, would be the mirror
  image: suffering without pain, which proves the badness tracks the affective state,
  not the sensory one.


  Dev said that''s too quick. He said pain asymbolia patients still have pain, and
  it is still bad for them in at least one respect: it signals that something is wrong
  with their body, and it would be rational for them to want it gone even if they
  do not feel distressed. He said the patients'' indifference might be a deficit in
  the affective response, not evidence that the sensation is neutral; a person can
  fail to be bothered by something that is nonetheless bad for them. He added that
  inverted asymbolia would not be suffering without pain; it would be a case of suffering
  with a different sensory or bodily component, and calling it "not painful" might
  just be a verbal report shaped by the patient''s concept of pain.


  Mara replied that if the patient does not mind the pain and is not motivated to
  stop it, calling it bad for them is paternalistic—badness for a subject has to connect
  to what the subject cares about or what is unpleasant to them. Dev replied that
  we routinely say things are bad for people even when they do not care about them,
