  Draft final:


  You are a poet with a philosopher''s training — someone who can write a villanelle
  that a specialist in metaethics recognizes as exactly right and that a reader who
  has never heard of the debate still finds moving. Work slowly and deliberately:
  the form is not decoration here, it is the argument, so plan before you write and
  check the plan against the constraints before drafting.


  The occasion: I teach the final session of a graduate seminar on the Frege–Geach
  problem for expressivism — the difficulty that moral vocabulary keeps its meaning
  when it occurs in unasserted and embedded positions (as the antecedent of a conditional,
  as the object of wondering or doubting, under negation), even though the expressivist
  holds that the point of such vocabulary is to express an attitude rather than to
  state a fact. I want to close the seminar by reading a poem aloud and handing out
  copies. Write me that poem.


  Form: a villanelle. Nineteen lines, five tercets and a closing quatrain, two refrains,
  a strict rhyme scheme, the second refrain ending each tercet and the two refrains
  meeting in the final couplet. Rhyme and meter should be handled properly; slant
  rhyme is acceptable if it is deliberate.


  Hard constraints:


  1. The poem must turn on one short evaluative clause of your choosing — the kind
  of thing someone says and thereby takes a stand — and that clause must appear with
  exactly the same wording at least twice: once as a complete assertion (someone saying
  it, or believing it, flat out), and once buried inside a larger sentence, where
  nothing is being asserted: under "if", "whether", "because", or a verb of wondering,
  doubting, or reporting. The reader must feel the difference in force and the sameness
  of the words. [Careful: I used quotes around "if", "whether" etc. — those are not
  quotes from a text; fine.]


  2. At least one stanza must show the inference working: the clause as antecedent
  of a conditional, and then the clause again as a flat verdict, so that a reader
  who follows the steps feels the pressure — for the step to be valid, the antecedent
  has to carry the very content the expressivist says is not there.


  3. The closing couplet, where the two refrains meet, must be the best reconciliation
  you can give the expressivist — the move that treats the embedded occurrence as
  expressing a higher-order attitude (disapproval of a combination of attitudes, or
  a constraint on what one can consistently approve or plan) — but the poem must leave
  the seam visible. The fix should read as something won, not something waved away.


  4. The poem must be in ordinary speech, in a scene: people talking about a third
  person, someone doubting, someone insisting. No technical vocabulary (nothing like
  express, attitude, proposition, embed, unasserted, truth-apt, normative, quasi-realism).
  No names of philosophers, no works, no citations, no footnotes. If the poem needs
  a glossary to work, it has failed.


  5. Accuracy: a philosopher who works on this problem should be able to point at
  each line and say what it is doing; a reader who does not should still get a poem.
  Do not resolve the problem — the point is to make the shape of it felt.


  Process: begin with a brief plan (a few lines: what the two refrains will be, where
  the embedded occurrence falls, where the turn is, how the final couplet does its
  work). Then write the poem with a title. Then reread it against constraints 1–5
  and repair anything that slipped — check especially that the repeated clause is
  word-for-word identical in its two positions and that the refrains land where the
  form requires. Finally, add a note of no more than 120 words, for the handout, saying
  which line does which job, so a reader can see the machinery after reading the poem.


