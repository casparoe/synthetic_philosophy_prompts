  Let''s draft the exam question.


  Exam question draft:


  "In class we introduced the Invariant Parameter Principle (IPP) as a proposed refinement
  of the principle of indifference for problems with continuous symmetries:


  (IPP) Suppose an experimental setup is described only by a group G of transformations
  that map the set of possible outcomes to itself. If there is a probability measure
  on the outcome space that is invariant under every transformation in G, then that
  measure—and only that measure—is the rationally required prior. Indifference is
  to be applied to the orbits of G, not to arbitrary parameterizations.


  Consider a unit circle. A chord is generated by one of the following three procedures:


  (A) Endpoint method: choose two points independently and uniformly at random on
  the circumference, then draw the chord joining them.

  (B) Midpoint method: choose a point uniformly at random in the disk, then draw the
  unique chord having that point as its midpoint.

  (C) Radial method: choose a direction uniformly at random, then choose a distance
  d uniformly at random from [0,1] along the corresponding radius, then draw the chord
  perpendicular to that radius at distance d from the center.


  Let L be the length of the chord. Let E be the event that L is greater than the
  side length of the inscribed equilateral triangle.


  (i) Compute P(E) for each of the three methods. Show your derivations.

  (ii) Apply the IPP to each method. Which of the three methods, if any, does the
  IPP select as rationally required? Explain what symmetries each method is invariant
  under.

  (iii) Does the IPP resolve Bertrand''s paradox? In your answer, address whether
  the fact that a method is invariant under the Euclidean symmetries of the circle
  is sufficient to single it out, and whether the principle needs to be supplemented
  by a choice of parameterization or a larger symmetry group."


  Then student answer. We need write a student answer that is mixed. It should get
  the computations right. It should apply IPP but make subtle mistakes. Let''s craft.


  Student answer:


  (i)

  (A) Let θ be the smaller central angle between the two random points. The chord
  length is L = 2 sin(θ/2). Since the two points are independent and uniform, θ is
  uniform on [0, π]. The side of the inscribed equilateral triangle is sqrt(3). So
  L > sqrt(3) iff 2 sin(θ/2) > sqrt(3) iff θ > 2π/3. Therefore P(E) = (π - 2π/3)/π
  = 1/3.


  (B) Let d be the distance from the center to the midpoint. For a chord with midpoint
  at distance d, the chord length is L = 2 sqrt(1 - d^2). So L > sqrt(3) iff 2 sqrt(1
  - d^2) > sqrt(3) iff d < 1/2. Under the midpoint method, the midpoint is uniform
  in the disk, so the probability that d < 1/2 is the ratio of the area of the disk
  of radius 1/2 to the area of the unit disk: π(1/2)^2 / π = 1/4.


  (C) The chord length is L = 2 sqrt(1 - d^2), and d is uniform on [0,1]. So L > sqrt(3)
  iff d < 1/2. Hence P(E) = 1/2.


  (ii) The IPP says to use the unique invariant measure under the symmetry group.
  For the unit circle, the natural symmetry group is the group of rotations and reflections
  that preserve the circle, i.e., O(2). The endpoint method is not invariant under
  O(2) because the two endpoints are ordered: a rotation can swap the labels of the
  endpoints, and the ordered pair (p, q) is not the same outcome as (q, p). Therefore
  the endpoint method fails the IPP. The midpoint method, by contrast, is defined
  by choosing a point uniformly in the disk. The uniform area measure on the disk
  is invariant under all rotations and reflections, and the midpoint is a complete
  parameterization of the chord. So the midpoint method satisfies the IPP. The radial
  method also chooses a direction uniformly, but it then chooses d uniformly on [0,1].
  This is not invariant under the same group because the radial coordinate d is not
  a Euclidean coordinate; a reflection or rotation does not change d, so the measure
  on d is not forced. In fact, the radial method treats the distance from the center
  as a primitive parameter, whereas the midpoint method treats the midpoint as primitive.
  Since the midpoint method''s parameter space is the disk itself, and the disk is
  the natural outcome space for a chord''s midpoint, the IPP selects the midpoint
  method uniquely. Thus the rationally required probability is 1/4.


  (iii) Yes, the IPP resolves Bertrand''s paradox. The paradox arises because we were
  applying indifference to different parameterizations—endpoints, midpoints, or radial
  distances—without noticing that these parameterizations are not all invariant under
  the same symmetry group. Once we require invariance under O(2), the endpoint method
  is excluded (because of the ordering of endpoints), and the radial method is excluded
  (because it introduces a non-Euclidean radial parameter). The only method that remains
  is the midpoint method, which gives a unique answer, 1/4. The fact that the other
  methods are also invariant under rotations is not enough, because they are not invariant
  under the full Euclidean group of the disk; the midpoint method is the only one
