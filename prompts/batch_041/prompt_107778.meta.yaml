  Key debrief points: (1) The two groups didn''t disagree about any fact — each would
  concede the other''s sentences. (2) The "swap test": rewrite each claim using two
  new words ("schmexists-1", "schmexists-2") — the dispute vanishes; is anything left?
  (3) If nothing''s left, the dispute was verbal — but "verbal" doesn''t mean "unimportant":
  what''s left is the question of which concept we should use, which is a practical/normative
  question about conceptual choice (metalinguistic negotiation, conceptual ethics).
  (4) If something''s left — a sense that one of the two groups is describing the
  world better — that''s the quantifier-variance debate / the realism question; say
  what would have to be true for it to be substantive. (5) The internal/external distinction:
  some questions are answered inside a framework by rules; the framework question
  has no framework-internal answer. (6) Also worth noting: the participants may think
  "it''s just semantics" is a dismissal, and the activity should show why the "just"
  is doing illegitimate work, and conversely why sometimes the dismissal is legitimate
  (when nothing practical hangs on it). And "what the activity can''t reproduce":
  the hard case where the two usages are so tangled that no clean separation exists,
  and where the choice of usage is itself morally or politically loaded (e.g., "person");
  the activity is designed with clean lexicons, so it makes verbal disputes look easier
  to diagnose than they are. Also it can''t reproduce the felt *obligation* — the
  sense that there''s a fact of the matter — which the facilitator must supply by
  describing why the issue isn''t settled by the swap test alone.


