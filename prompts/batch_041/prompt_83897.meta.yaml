  "deference to the market''s implied probability as if it were objective chance",
  "expert deference", "the Sleeping Beauty debate", "the puzzle of self-locating credence",
  "the ''principle of indifference'' vs chance". There''s a nice in-the-weeds issue:
  the Principal Principle (Lewis) says your credence in A given that the chance of
  A is x should be x, but it fails for "inadmissible information" (e.g., information
  about the future — the "undermining" problem; the "big bad bug" for Humean supervenience,
