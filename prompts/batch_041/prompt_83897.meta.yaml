  Lewis) — Lewis revised PP to NP to handle undermining: C(A | Htw Tw) = Tw(A). And
  there''s the "objection that PP is trivial / that it''s a constraint on rationality
  rather than a definition". And the "principle of direct probability" and "deference
  to experts" — the "expert deference" literature: Elga on "Reflection", and the problem
  of "two experts" and "the expert''s own uncertainty". Also rationalist angle: "should
  I defer to the market or to the expert", "deference to the crowd" (and the relation
  to information cascades!).


