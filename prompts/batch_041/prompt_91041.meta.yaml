  Key content I know about the Pasadena game (from Hájek & Nover, "Vexing Expectations",
  Mind 2004; also Hájek 2014 "Unexpected Expectations"):


  Pasadena game: a fair coin is tossed until it lands heads; n = number of tosses.
  The payoff is (-1)^(n-1) × 2^n / n. So:

  - n=1 (prob 1/2): payoff 2/1 = 2

  - n=2 (prob 1/4): payoff -4/2 = -2

  - n=3 (prob 1/8): payoff 8/3 ≈ 2.667

  - n=4 (prob 1/16): payoff -16/4 = -4

  - n=5: 32/5 = 6.4

  - ...


  Terms in the expectation: (1/2)·2 = 1; (1/4)·(-2) = -0.5; (1/8)(8/3) = 1/3; (1/16)(-4)
  = -0.25; (1/32)(32/5) = 0.2; ...


  So the expectation series is 1 - 1/2 + 1/3 - 1/4 + 1/5 - ... = the alternating harmonic
  series, which converges (to ln 2), but only conditionally. Since it''s conditionally
  convergent, by Riemann''s rearrangement theorem you can reorder the terms to get
  any real value, or ±∞. And crucially, the natural grouping/ordering of the terms
  is a matter of how you present the game — you can reorder the outcomes'' contributions.
  Hájek & Nover argue: expectation is undefined (not merely infinite, not merely hard
  to compute). The value of the game is not well-defined by the standard expected-value
  rule, because the sum depends on the order of summation, and there''s no canonical
  order.


  Also there''s the distinction: the expectation is "undefined" rather than "infinite"
  or "divergent to +∞" — the terms themselves (payoffs) don''t converge absolutely.
  Actually the payoff series ∑ |payoff|·prob = ∑ 2^n/n · 2^{-n} = ∑ 1/n diverges,
  so the expectation is not absolutely convergent, hence the value depends on arrangement.
  This is exactly the condition for the rearrangement phenomenon.


  Additional nuances:

  - The Pasadena game has a "sibling": the Altadena game, which is like Pasadena but
  with every payoff increased by $1 (i.e., (-1)^(n-1)·2^n/n + 1). Altadena''s expectation:
  each term gets +1·(1/2^n), summing the +1 contributions gives ∑ 1/2^n = 1. So Altadena''s
  expectation is Pasadena''s plus 1... but wait, that''s a "shift". Hájek''s point:
  Altadena seems obviously better than Pasadena (every payoff is $1 higher), yet if
  Pasadena''s expectation is undefined, then so is Altadena''s, so the "expectation"
  rule can''t rank them, even though dominance clearly says Altadena is better. Actually
  the standard move: by dominance, Altadena > Pasadena. But if you compute expectations,
  Altadena''s expectation would be Pasadena''s + 1, which is still undefined. So the
  expected value rule fails to deliver the verdict that dominance delivers. Hájek
  uses this to argue that the expected value rule is not universally applicable, i.e.,
  there are games where expected value is undefined, and that''s a problem for the
  "expected value maximization" principle.


  - The "Pasadena" name is a pun: Pasadena is near Altadena. Actually in the Hájek-Nover
  paper, I believe they were at Caltech (Pasadena) and the game was named Pasadena.
  Altadena is a real place next to Pasadena.


  - Also there''s the "St. Petersburg" game contrast: St. Petersburg has infinite
  expectation (diverges to +∞), which is bad but at least well-ordered — you can say
  "pay any finite amount". Pasadena is worse: the expectation is undefined, so you
  can''t even say that.


  - There''s a related puzzle: the "Petersburg" and the "Pasadena" both have the feature
  that if you actually play the game, the payoff is almost surely finite and modest.
  The probability that the game lasts more than, say, 10 tosses is 1/1024, so payoffs
  are usually small. So the expected value seems to give absurd advice.


  - Also the distinction between "expected value undefined" and "expected value divergent":
  the expected value is not a real number, not +∞, not -∞, but undefined — because
  the sum depends on order.


  - There''s also the point that you can reorder the terms to get any value; and there''s
  a "natural" order (by n) that gives ln 2. But there''s no principled reason to use
  the natural order. Hájek argues that the natural order is not privileged.


  Subtle misrepresentations I can plant in the summary:

  1. Conflating "undefined" with "infinite" or "divergent" — e.g., the summary says
  the expectation "comes out infinite, just like St. Petersburg, only with alternating
  signs, so it''s even worse." That''s wrong: the alternating series converges (conditionally)
  in the natural order to ln 2; it''s not infinite. The correct claim is that it''s
  not absolutely convergent, hence not well-defined as a sum.

  2. Saying the problem is that "the expected value doesn''t exist because the probabilities
  are too small" — no, the probabilities are fine; it''s the order-dependence.

  3. Saying that "because the expectation is undefined, you can''t rationally prefer
  Altadena to Pasadena" — but dominance still ranks them; the point is that the expected-value
  rule can''t, not that there''s no rational verdict.

  4. Saying that the Pasadena game "shows that expected value maximization is irrational"
  — overstatement. The standard lesson is that the rule is not universally applicable
  / needs refinement (e.g., restrict to games with well-defined expectations, or use
  dominance where applicable), not that it''s irrational.

  5. Saying "you can reorder the terms to get any value, so the expectation is literally
  any number" — this is a confusion: the rearrangement theorem gives any real number
  as a limit of some rearrangement, but the expectation is not "any number"; it''s
  that no unique value is determined. Also, the rearrangement has to be a permutation
  of the terms; the sum of the rearranged series can be made to be any real number
  or diverge.

  6. Saying the game "has no expected value because the series diverges" — the series
  doesn''t diverge in the natural order; it converges conditionally. The correct statement:
  the series of terms is not absolutely convergent, so the sum is not invariant under
  rearrangement, and hence the expected value is not well-defined.

  7. Confusing the game''s payoff with the St. Petersburg payoff. E.g., saying the
  payoff is 2^n and the expectation is ∑ 2^n/2^n = ∑1 = ∞ — that''s St. Petersburg,
  not Pasadena.


