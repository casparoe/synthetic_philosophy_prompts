  \ where the only difference is the interveners' motives, and the question is whether\
  \ that flips the verdict for two named frameworks. Hmm.\n\nI think Hempel's ravens\
  \ is the most tractable and \"in the weeds\" while still being memorable. Let me\
  \ design the prompt carefully.\n\nThe prompt: from the perspective of someone who\
  \ just had a long argument with a friend, casual, American English, maybe a typo\
  \ or two.\n\nContent: \"My friend and I spent like two hours arguing about the raven\
  \ paradox... He kept saying 'a green apple confirms all ravens are black' is just\
