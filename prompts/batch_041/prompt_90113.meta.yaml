  Ideal answer outline:

  - Step (2) is fine (it''s a theorem), but note precisely what it says: it''s conditional
  on (i) the same question, (ii) sincere voting, (iii) independence of errors given
  the truth, (iv) each voter''s competence strictly >1/2 and bounded away from 1/2.
  It doesn''t say "large groups are usually right"; it says large groups amplify a
  competence advantage.

  - Step (3) is the equivocation: (1) quantifies over questions with "on average"
  or "for each question, the person is a bit better than chance" — but for the questions
  in (6) the relevant competence can be at or below 1/2, and when p<1/2 the theorem
  gives the opposite: the majority is almost certainly wrong (Condorcet''s theorem
  is a two-edged sword: with p<1/2, majority accuracy →0). So (3) doesn''t follow;
  what follows is: for any question where the crowd''s competence exceeds 1/2, the
  crowd is nearly surely right — a trivial-looking conditional whose antecedent is
  the whole issue.

  - Also independence: real crowds share error sources (same media, same misinformation,
  deliberation and conformity, common priors), so the effective number of independent
  voters is small; in the limiting case of perfectly correlated errors, majority accuracy
  equals individual accuracy. So (3) fails as a claim about real crowds even when
  p>1/2.

  - Step (5): self-application. The theorem''s conclusion is conditional on premises;
  using a majority vote to establish whether the premises hold is circular — the majority''s
  verdict on its own competence is only as good as its competence, so you can''t bootstrap.
  Also, the question "are these voters'' errors independent?" is a question about
  the voters themselves; if they''re systematically biased, they''ll be systematically
  biased about that too.

  - The "too much" reading: since (2) gives amplification in both directions, the
  theorem can''t be a general argument for the wisdom of crowds; it''s an amplifier
