  The subtle flaw: equivocation on "competence." (1) asserts p>1/2 for the average
  person on "any binary factual question," but competence is question-specific and
  the theorem requires p>1/2 for the question at hand, not on average across questions.
  If p<1/2 for the question at hand (e.g., a question where ordinary people''s prior
  leads them away from the truth — like a question about quantum mechanics where naive
  intuition gives the wrong answer), the theorem gives the opposite conclusion: majority
  accuracy → 0. So (3) doesn''t follow from (1)+(2) as stated; and (5) is a quantifier/self-application
