  The classic paradox (Pettit & Sugden, "The Backward Induction Paradox"): At node
  2, player 2 knows that player 1 is irrational (since 1 passed). So player 2 revises
  her belief. But then at node 3, player 1 observes that player 2 passed, and reasons:
  player 2 must know that I''m irrational (since I passed), and a rational player
  2 facing an irrational player 1 would have taken at node 2 (since irrational 1 might
  take later)... so 2''s passing shows 2 is irrational. Etc. Each pass shows the passer
  is irrational, so at each node the player should "take" because she''s facing an
  irrational opponent — but that means... Hmm, the paradox is that the backward induction
  conclusion (player 1 takes) is supposed to be uniquely rational, but at node 2 player
  2 has grounds for thinking 1 is irrational and thus for playing differently, so
  it''s not clear that 1''s taking was rational (1 should predict that 2 will play
  as if 1 is irrational...). And the CKR assumption is doing weird work: at each node,
  the player learns something that contradicts CKR, so CKR cannot be maintained at
  later nodes.


  The cleaner version of the flaw: the backward induction argument assumes that at
  each node, the player''s knowledge of the other''s rationality is intact, but (6)
  itself implies that any player who reaches a later node must regard the other as
  irrational, so the assumption of CKR at later nodes is inconsistent with the theory''s
  own conclusion — the induction''s step from "rational at node k+1" to "take at node
  k" requires knowing the other is rational *at* node k+1, which (given the conclusion)
  can''t be true if the other passed to get there. So the argument either is valid
  and shows the assumption of CKR is self-undermining (no CKR-compatible path reaches
  later nodes, so the reasoning at later nodes is about a counterfactual), or it has
  a modal flaw.


