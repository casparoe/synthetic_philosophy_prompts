  The student wrote:


  Kim''s exclusion argument begins with three claims. First, mental properties supervene
  on physical properties: no mental difference without a physical difference. Second,
  the physical domain is causally closed: every physical effect has a sufficient physical
  cause. Third, there is no systematic overdetermination. Suppose a mental property
  M causes a physical effect E. M supervenes on some physical base P*. P* also causes
  E. If M is not identical to P*, then P* already does all the causal work, so M is
  excluded as a cause. By the causal inheritance principle, M inherits P*''s causal
  powers and then contributes its own distinct mental causal powers on top. That is
  why Kim says non-reductive physicalism cannot save mental causation: the only options
  are reduction/identity or epiphenomenalism.


