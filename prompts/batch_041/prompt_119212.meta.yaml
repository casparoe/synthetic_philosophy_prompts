  We can write student answer:


  "Jaegwon Kim''s exclusion argument starts from three plausible claims. First, mental
  properties supervene on physical properties: no mental difference without a physical
  difference. Second, the physical domain is causally closed: every physical effect
  has a sufficient physical cause. Third, there is no systematic overdetermination.
  Now suppose a mental property M causes a physical effect P. Since M supervenes on
  some physical base P*, and P* also causes P, we have two causes of P. But if M is
  not identical to P*, then P* already does all the causal work. By the exclusion
  principle, M is excluded as a cause. So mental properties are epiphenomenal. Kim
  concludes that non-reductive physicalism is unstable: to save mental causation we
  must either accept reduction/identity or embrace epiphenomenalism.


  A common reply is that the argument equivocates on ''cause''. Higher-level properties
  can be causes even if they supervene on physical properties, because causation is
  not a conserved quantity. For example, a traffic jam is caused by the volume of
  cars, even though the volume supervenes on each car''s position. Similarly, mental
  properties can be real causes at their own level. Kim responds that this ''levels''
  picture is just a restatement of non-reductive physicalism and doesn''t solve the
  exclusion problem, because the physical cause still suffices. I think this reply
  fails: it shows that mental properties are not reducible, but it doesn''t show they
  have any causal powers that are not already had by their physical bases. So Kim''s
  conclusion that mental properties are epiphenomenal is basically right, though I''d
  say mental events can still be causes if they are identical to physical events."


