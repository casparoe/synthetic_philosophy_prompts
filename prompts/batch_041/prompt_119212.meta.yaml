  they supervene on physical properties. A traffic jam is caused by the volume of
  cars, even though the volume supervenes on the positions of the individual cars.
  Likewise, mental properties can be real causes at their own level. Kim responds
  that this just restates non-reductive physicalism and does not solve the exclusion
  problem, because the physical base still suffices for the effect. I think the reply
  fails, but only for mental-to-physical causation. Kim''s argument does not threaten
  mental-to-mental causation, since a mental event can cause another mental event
  without any physical effect being overdetermined. So the conclusion should be that
  mental properties are epiphenomenal with respect to physical effects, but they can
  still cause other mental effects.


