  treats the claim that a white horse is not a horse as a claim about non-identity:
  the compound expression white horse is not the same term as horse, because the former
  includes a color determination that the latter does not. The second reading treats
  it as a claim about kind-membership or extension: the kind white horse is not included
  in the kind horse, because what satisfies the one does not satisfy the other. For
  each reading, explain how it would answer the objector who says that if you have
  a white horse you thereby have a horse, and say what notion of a name or kind the
  reading requires. Then bring in the hard-and-white puzzle, which asks whether hardness
  and whiteness can both belong to the same thing when they are known through different
  senses, and say whether the same semantic apparatus—treating names as designating
  determinate aspects or pointings rather than as labels for classes of objects—can
