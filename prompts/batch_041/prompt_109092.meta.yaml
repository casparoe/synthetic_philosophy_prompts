  Draft:


  "I''m in a small reading group on behaviour genetics, and one member keeps deploying
  a version of an analogy I''ve also seen in popular science writing: asking how much
  of a trait is genetic versus environmental is like asking whether a rectangle''s
  area is due more to its length or to its width. Both inputs are necessary, neither
  can be changed without changing the area, and so, he says, the question is ill-posed
  and anyone who tries to answer it is either confused or pushing an agenda. I''ve
  noticed he uses it to shut down a wider range of claims than that -- at one point
  he said it showed that even asking whether a trait is influenced by genes is pseudo-scientific,
  and at another that a high heritability estimate tells you nothing at all about
  whether an intervention would work. I''d like a careful audit rather than a verdict
  on the politics: lay out the correspondence explicitly (what plays the role of the
  rectangle''s length, its width, the area, the rule that area = length × width),
  then say where the mapping breaks down. I''m particularly interested in the features
  of the geometric case that do no work in the analogy''s home argument but get quietly
  imported anyway -- for instance that length and width are single fixed quantities
  rather than distributions, that they can be varied independently of one another,
  and that any value of the area can be reached by adjusting either dimension. Then
  tell me which of my friend''s three claims (the modest one about the ill-posedness
  of asking ''which contributes more'', the strong one that the question of genetic
  influence is pseudo-scientific, and the practical one about the uselessness of heritability
  for predicting intervention effects) actually follow from the analogy and which
  were being carried by the analogy''s unstated features rather than by the argument."


  Second paragraph: "If the rectangle picture is a bad fit, I''d like a better one,
  and I''d like you to compare candidates rather than just propose one. A colleague
  suggested replacing it with an analogy from industrial statistics: a factory''s
  output varies, and you can decompose the variation into the share attributable to
  the machines and the share attributable to the workers; on that picture heritability
  is a variance share in a particular batch of production runs. Does that analogy
  do better? Say what corresponds to what, whether it repairs or merely relocates
  the problems of the rectangle, and whether it can support the modest claim my friend
  wants without also supporting the strong one he actually asserts. If neither works,
  say what a genuinely illuminating analogy would have to preserve -- in particular
  how it would have to represent the fact that the quantity in question is a property
  of a population at a time and place rather than of a trait or an individual."


  Third: epistemic request. "Be explicit about where your own reasoning is most likely
  to go wrong, and finish by telling me what would change your mind: if you think
  the modest claim survives the audit, what would you have to be shown about heritability
  estimates -- or about the analogy -- for you to conclude that even that claim is
  an artefact of the picture rather than a result about the world? I''d rather have
  a calibrated answer that flags its own weak points than a tidy one."


