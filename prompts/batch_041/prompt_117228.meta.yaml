  by what the consuming systems need it to correlate with, rather than by what the
  producing mechanism actually correlates with.

  4. The theory aims to naturalize content: no designer, no stipulation, no intrinsic
  "aboutness" — just selection and causal-cum-teleological facts.

  5. Consequence: a molecule-for-molecule duplicate that assembles by chance and behaves
  identically but has no selection history has no content (this is the swampman-style
  consequence).


