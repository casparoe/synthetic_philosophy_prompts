  1. A state carries content in virtue of the biological function of the mechanisms
  that produce and consume it; function is etiological — fixed by the selection history
  that explains why the mechanism is there.

  2. Content is therefore normative: the state is *supposed* to indicate something,
  which is what makes misrepresentation possible (a state that fires when it shouldn''t
