  ---


  I am a novelist, and for the past several months I have been circling a puzzle that
  belongs to you rather than to me. My whole craft runs on sentences of the form if
  this, then that: the if-clause is how I raise a possibility without asserting it,
  and the reader''s sense of what is likely to happen next is really a sense of how
  probable the consequent is once she has taken the antecedent on board. I have been
  trying to describe what I do in the vocabulary I actually think in — the story so
  far, what is established and what is merely presupposed, the nearest world in which
  the protagonist has already made the fatal phone call, the difference between what
  a sentence says and what it does, subtext, free indirect discourse, the possibility
  that a later chapter retcons what an earlier one seemed to mean, unreliable narration
  — and I have run up against a result I only half understand. As I have it, if you
  hold that the probability a reader assigns to an indicative conditional equals her
  conditional probability for the consequent given the antecedent, and you also hold
  that the conditional is a proposition, a determinate thing that is true or false
  at each possible world with its truth value fixed by the truth values of its parts,
  then, provided the equation has to hold not only for her present degrees of belief
  but for all the degrees of belief she would acquire by learning something new, the
