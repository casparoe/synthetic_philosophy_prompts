  At a small workshop on decision theory last month, two participants — call them
  A and B — spent most of a dinner arguing about whether expected value maximization
  survives the objection that it is fanatical, and the rest of us could not agree
  on who had the better of it. I was a bystander and have no stake in either side.
  What I want from you is a point-by-point adjudication of the exchange as it actually
  went, not a summary of the literature on it; the substance matters to me and the
  attributions do not.


  Both agreed on the following two cases.


  Case 1. You may take $50,000 in cash, or a ticket paying $100 billion with probability
  one in a million and nothing otherwise. The ticket''s expected monetary value is
  $100,000.


  Case 2. You may secure a certain, modest improvement in the lives of a few thousand
  people, or take an option that with probability one in a billion produces an improvement
  10^15 times as large and otherwise produces nothing. The option''s expected value
  exceeds the certain improvement by six orders of magnitude.


  A''s line. The cases have the same structure and the same correct answer, and in
  both the answer is the gamble. Expected value maximization is the whole of practical
  rationality. Case 1 feels different only because we are averse to risk, and risk
  aversion is either a preference already expressible as a concave utility function
  — in which case a logarithmic utility of wealth tells you to take the $50,000 and
  that is the correct diagnosis of the intuition — or it is a mistake. No respectable
  curvature rescues the modest option in Case 2.


  B''s line. She proposed what she called a floor constraint. Certain outcomes must
  be kept above a floor — for a person, the level below which a life goes badly wrong;
  for a policy, the level below which the moral losses are catastrophic — and no gain
  above the floor, however large or however probable, may be bought with any increase
  in the probability of falling below it. In Case 1 the ticket''s losing branch is
  a floor breach and the $50,000 secures the floor, so the sure sum is required even
  though its expected value is half the ticket''s; Case 2 is the same structure. The
  fanaticism objection, she said, is not an objection to her view but the proof that
  unconstrained expected value maximization is not a theory of rationality at all
  but a machine for sacrificing everything to large numbers.


  The exchange then went roughly as follows.


  1. A: The floor constraint, stated absolutely, is fanaticism in the mirror image.
  It tells you to forgo any finite gain, however large and however probable, for any
  infinitesimal reduction in the chance of a floor breach — so it licenses spending
  your entire income, and then your children''s, on a one-in-a-trillion reduction
  in the risk of a catastrophe. Stated with a threshold instead, it needs a number,
  and no number is defensible except by intuition. Worse, if the constraint attaches
  to acts rather than to outcome distributions, he can build a two-stage lottery that
  the constraint forbids at the second stage but that is identical in its reduced
  form to a single gamble the constraint permits; a rational agent should be indifferent
  to how the same prospect is described, so a rule that isn''t is not choosing among
  prospects at all.


  2. B: Concavity cannot do the work in Case 2, and any bounded utility function is
  a cap in disguise — a refusal to take large numbers seriously. As for the pump,
  she accepts that her constraint is not a preference over outcome distributions;
  it is a constraint on acts. She denies that the reduction of compound lotteries
  (ranking a two-stage gamble as you rank the one-stage gamble with the same outcome
  distribution) is a requirement of rationality rather than a substantive axiom, and
  says the fanaticism argument is what shows it is not compulsory.


  3. A: If the reduction of compound lotteries and the sure-thing principle are both
  up for grabs, then expected value maximization is not the thing on trial — a package
  of axioms is — and B owes an account of which she keeps and what replaces the rest.
  A constraint that is not a preference gives no guidance when every available option
  breaches the floor, nor when the location of the floor is itself uncertain. And
  where it does give guidance it is silent about the vast majority of decisions, which
  are trade-offs among goods that all sit above the floor.


  4. B: Where every option breaches the floor she falls back on expected value among
  the survivors, so her view is expected value plus a constraint rather than a rival
  to it; where the floor is uncertain she applies the constraint to the probability
  of breach, which she concedes reintroduces a threshold and therefore a number. She
  also conceded that the asymmetry between the floor and everything above it is the
  part of her view she can least defend, and that she needs an argument for why it
  is principled rather than stipulated.


  5. A: The many-shots version. An agent facing a long sequence of Case 2 offers should,
  on her view, decline every one, although the policy of accepting all of them has
  an astronomically higher expected value. B: a policy that breaches the floor with
  probability approaching one is not redeemed by an astronomical value in the branches
  where it does not breach it, and she denies that the value of an outcome may be
  multiplied by its probability without limit.


  Please now do five things. (1) For each numbered move, say whether it is sound,
  partly sound, or mistaken, and why; where a move as I have reported it is weaker
  than the best version of it, supply the stronger version before judging it. (2)
  Say whether "expected value maximization plus a floor constraint" is a coherent
