  "I''m a PhD student in metaphysics drafting the modal-metaphysics chapter of my
  dissertation, and before I commit to the package I''d like an audit of whether it
  hangs together. Here is where I''ve landed.


  1. Individuals are world-bound: nothing exists at more than one possible world.
  When we say of a thing that it could have been otherwise, what makes that true is
  that some counterpart of it is otherwise — a different thing, related to it by the
  appropriate similarity relation — and not that the thing itself has the property
  in question at another world.


  2. Haecceitism: there are pairs of possible worlds that agree on every qualitative
  fact — the whole distribution of properties and relations, down to the last detail
  — and differ only in which individuals occupy which roles. What separates such worlds
  is nothing over and above the individuals themselves; I don''t want to postulate
  primitive thisnesses or any further entity to do that work.


  3. Robust realism about de re modality: claims about what I could have done, and
  about what is essential to me, have objective and determinate truth values, which
  don''t shift with how we happen to describe or compare things.


  4. Names rigidly designate: a name picks out the same individual with respect to
  every world at which that individual exists.


  5. Endurantism about persistence: a material object is wholly present at each moment
  at which it exists; it persists by being strictly identical through time, not by
  having distinct temporal parts at distinct times.


  I''d like you to treat these five as a package. Which pairs are in genuine tension,
  which only look that way, and how severe is each genuine tension? For each, tell
  me the cheapest repair and what it costs me elsewhere. Finish by saying which single
