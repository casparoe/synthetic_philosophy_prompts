  ok so I''m on the ethics advisory board at a fertility clinic — not a hospital,
  a private clinic, but our board has an effective veto over what the lab will and
  won''t do, and we meet Thursday. I have to send round a written opinion the night
  before. I''m the one drafting it. It''s about a page, maybe a page and a half, and
  it needs a bottom line we can actually vote on.


  Background: we do PGT for serious conditions, that''s uncontroversial here. What''s
  not uncontroversial is that the new panel the lab bought last year reports a whole
  pile of non-medical stuff along with the disease markers — height, some personality-ish
  scores, a few things nobody knows what to do with. So the old rule, "medical indications
  only," is now basically a rule about what we say out loud, not about what we know.
  Every report has the other stuff on it. One of our members pointed this out and
  now nobody''s sure the rule means anything.


  The case: a couple, both with the same form of hereditary dwarfism, five embryos,
  they want us to transfer the one most likely to be short like them. Their words
  in the intake form are basically that a tall kid wouldn''t be theirs. They''re not
  asking us to hurt anyone, they''d say, and they''re already pregnant-or-nothing
  for these embryos — there''s no version of this where the tall embryo goes into
  a different womb.


  The policy question sitting underneath it: our lab director wants us to go "blind."
  Screen for disease, and where embryos tie, pick by lottery, and never show the couple
  the non-medical scores even though we have them. She thinks that gets us out of
  the eugenics business without actually denying anyone anything. I''m not sure it
  does, but I don''t want to just assert that.


  So what I need from you: the memo. Recommend what we tell this couple and whether
  we adopt the blind policy. Give me the strongest version of both sides — I don''t
  want "autonomy wins" or "dignity wins," I want the actual arguments. Two things
  I specifically want you to work through: (1) whether deliberately picking the shorter
  embryo can be a harm to that child at all, given that the alternative isn''t "a
  taller version of him," it''s no him — does the harm argument survive that, or is
  it doing something else, and what? and (2) whether the blind policy avoids the problem
  or just relocates it one step back — someone still sets the disease threshold, someone
  still decided to make five embryos and screen them, someone still chose which partner.
  If the honest answer is that blind is mostly cosmetic, say that, but then tell me
