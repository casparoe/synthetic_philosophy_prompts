  Phenomenon: In states that still have capital punishment, the pool of death-eligible
  cases keeps shrinking — statutes get narrowed, aggravating factors get tightened,
  whole categories (juvenile, intellectually disabled, non-trigger-person felonies)
  get excluded. Each contraction is presented as a reform, and many are championed
  by people who oppose the death penalty. But the effect is that the remaining death
  sentences become harder to attack: the "worst of the worst" framing means the people
  on death row are, by definition, the ones for whom the punishment is proportionate.
  So the practice survives by narrowing, and the narrowing is what makes it look defensible.
  Reform becomes the mechanism of preservation.


