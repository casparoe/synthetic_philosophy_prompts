  ---

  Question 3 (Democratic Theory, final exam). Read the following proposal, then answer
  the questions below.


  The "founding assembly" proposal. Suppose a group of people occupies a territory
  and wants to constitute a democratic polity with no prior boundary. They adopt the
  following procedure, which its authors call recursive self-enrollment:


  Stage 0: everyone physically present in the territory on day D is invited to participate.

  Stage 1: participants vote on a rule specifying who is entitled to participate in
  subsequent stages.

  Stage 2: under the rule adopted at Stage 1, a new round of voting is held; if the
  resulting electorate differs from the previous one, the new electorate votes again
  on the participation rule.

  Iterate until the electorate is stable across two consecutive rounds. The resulting
  stable electorate is declared the demos, and its adopted rule is the constitution''s
  membership clause.


  The authors claim: "Because no boundary is imposed from outside, the demos gives
  itself its own boundary; the procedure therefore solves the boundary problem rather
  than presupposing an answer to it."


  (a) State precisely what the boundary problem is, and explain why it is thought
  to be a problem for democratic theory.

  (b) Does the proposal solve the problem, dissolve it, or relocate it? Defend your
  answer.

  (c) Which of the following two principles does the proposal''s Stage 0 rule presuppose
  — the all-affected-interests principle (all whose interests are affected by a decision
  should have a say in it) or the all-subjected-to-coercion principle (all who are
  subject to the polity''s coercively enforced rules should have a say in making them)?
  Justify your choice.


