  Let me recall the literature:

  - Frederick Whelan (1983), "Democratic Theory and the Boundary Problem": the problem
  that democratic theory presupposes a bounded demos; democracy can''t decide its
  own boundaries without circularity.

  - Robert Dahl, "the problem of the unit" in Democracy and Its Critics; also his
  criterion: "all those subject to the decisions" or "all persons subject to the laws."

  - Robert Goodin (2007), "Enfranchising All Affected Interests, and Its Alternatives":
  argues for the all-affected-interests principle; notes it would enfranchise foreigners,
  children, the dead, future persons; he considers the "constituting the demos" problem
  and ultimately defends a version based on "the power to affect."

  - Arash Abizadeh (2008), "Democratic Theory and Border Coercion: No Right to Unilaterally
  Control Your Own Borders": argues that because border control is coercive, the all-subjected
  principle itself requires including foreigners in border decisions. So the coercion
  principle can also expand.

  - David Miller''s reply: coercion alone isn''t sufficient; the "coercion" must be
  of a particular kind (state coercion backed by force, territorially bounded).

  - Sofia Näsström (2007?) "The Legitimacy of the People" on the boundary problem.

