  Draft:


  I''ve been reading rationalist blogs and forums long enough to have absorbed the
  house style of arguing from cases rather than from slogans, and I want to apply
  it to a question I can''t settle on my own: when a famine happens, what makes it
  a natural disaster and what makes it a political crime? Sen''s entitlement work
  and his much-quoted claim that no substantial famine has occurred in a functioning
  democracy are the usual starting points, and I''ve read the standard material on
  Bengal in the 1940s, the Irish famine of the 1840s, and the Chinese famine of the
  early 1960s. But the standard material doesn''t give me a rule; it gives me three
  vivid cases and a suspicion that the interesting distinctions live in the cases
  nobody writes about. So let me lay out my verdicts and ask you to find the principle,
  if there is one, and tell me what it costs me.


  ... then the cases, numbered, with stipulated facts and verdicts.


  Case list (aim ~9):


  1. Drought famine in a poor but functioning democracy. Facts: harvest fails; prices
  spike; the government is elected, the press is free, the opposition can make hay;
  relief is slow and some people starve. My verdict: a natural disaster with an ugly
  margin of political incompetence — not a crime, and not the kind of thing I''d want
  tried at The Hague.


  2. Same drought, colonial setting: distant imperial government, no franchise for
  the affected population, no free press there; grain continues to leave the province
  because contracts and property rights are enforced; relief is withheld partly on
  a theory that handouts create dependency. My verdict: political crime, and the fact
  that nobody ordered anyone to starve is irrelevant to me.


  3. Starvation used as a weapon: a government besieges or clears a population and
  uses food denial as the method. My verdict: crime, and a categorically worse kind
  than 2 — this one is murder at scale, not criminal negligence at scale.


  4. Procurement famine: a state sets grain quotas on the basis of falsified reports
  of abundance, punishes officials who report shortfalls, and continues exporting/collecting
  while people die. Nobody intended the deaths; the leadership intended the numbers.
  My verdict: crime.


  5. Blockade famine: an outside power''s blockade prevents relief from reaching a
  civilian population, and the besieging power could have permitted relief at military
  cost it was willing to bear elsewhere. My verdict: crime, by the besieger.


  6. Hypothetical (stipulated, not real): Vorland is rich, has superb logistics, and
  offers aid to a drought-hit neighbor, Kesh. Kesh''s government diverts the aid to
  its own core constituency and lets the peripheral region starve because that region
  votes for the opposition. My verdict: crime by Kesh, and Vorland is clean.


  7. Hypothetical: a famine that arises from no decision anyone made and no policy
  anyone defended — a currency collapse triggers a speculative grain market, everyone
  acts lawfully, no official had the information to know it was coming, and the resulting
  price spike kills the poorest. My verdict: still a political crime, though I can''t
  say by whom. [This is the hard case against 1.]


  8. Hypothetical: an autonomous region of a federation elects its own government,
  which mismanages its own food system catastrophically; the federal government is
  legally barred from intervening and has no standing to act. My verdict: a political
  crime, but not the federation''s — the region''s own government owns it. [Hard against
  2? Both distant authorities... Actually here the local authority is close. The tension:
  in 2 the distant power is guilty; in 8 the distant power is innocent.]


  9. Hypothetical: a famine averted by a policy that is itself unjust — e.g., the
  food is moved by force from one poor region to another, or farmers are conscripted
  to plant. Fewer die, but some are wronged. My verdict: the averted famine doesn''t
  retroactively justify the coercion; the coercion is a wrong even though it worked,
  and the people who ordered it are responsible for the wrong even though they saved
  lives.


