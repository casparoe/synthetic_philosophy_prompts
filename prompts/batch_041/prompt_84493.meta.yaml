  Possible prompt:


  I want your credence in a specific thesis about the ethics of memory, together with
  a decomposition that exposes its weak points. The thesis is this: A political community
  can have a non-instrumental moral duty to maintain public remembrance of a historical
  atrocity, a duty that persists even after all survivors and perpetrators are dead
  and even if continued remembrance produces no measurable reduction in future atrocities
  or repair of past wrongs. Call this the persistence thesis. I am not asking whether
  remembrance is often good or useful; I am asking whether it is ever owed in its
  own right, across generations, to the dead or to the past itself.


  To make this concrete, imagine a post-conflict society considering what I will call
  the Mnemonic Sunset. Under the proposal, the state would maintain official archives
  and scholarly access indefinitely, but after seventy-five years it would end public
  commemorations, remove atrocity memorials from civic space, and cease teaching the
  atrocity as a constitutive part of national identity. The atrocity would remain
  historically knowable but no longer ritually present. A minority objects that this
  is a form of second death for the victims and a betrayal of the dead. The majority
  replies that inherited guilt and mandatory grief are themselves unjust burdens on
  people who did nothing wrong, and that memory should be carried by those who have
  a living stake in it. The question is whether the minority is right about a duty,
  not merely whether its preferred policy would be better on balance.


  Please give me your credence that the persistence thesis is true. Decompose it at
  least into the following sub-questions, adding any others you think belong: (a)
  whether the dead can be wronged after death, or whether duties to remember are really
  duties to the living; (b) whether public remembrance is a form of respect that has
  non-instrumental value, or only a tool for prevention, repair, or identity; (c)
  whether collective memory is a public good that can be owed to a community as such,
  rather than a private good of individuals; (d) whether the passage of generations
  weakens or extinguishes the duty, and if so, on what principle; (e) whether the
  costs of mandated remembrance to later generations can override the duty; and (f)
  whether forgetting is the morally default option, with remembering requiring justification,
  or the reverse. For each sub-question, give a rough probability, one line of justification,
  and say what the probability is a probability of. Then show how they combine into
  your final number, state which sub-question your final credence is most sensitive
  to, and identify what argument or piece of evidence would move it most.


