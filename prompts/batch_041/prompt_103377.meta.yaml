  Let me recall the problem of verisimilitude:


  Popper: science aims at truthlikeness/verisimilitude. A theory''s verisimilitude
  depends on its truth content and falsity content. Informally: T2 is more verisimilar
  than T1 iff T1''s truth content is a proper subset of T2''s truth content and T2''s
  falsity content is a subset of T1''s falsity content (or T1''s falsity content is
  a superset). More precisely, Popper defined verisimilitude as a difference between
  truth content and falsity content (like Vs = Ct_T - Ct_F, or some measure).


  Tichý (1974) and Miller (1974) independently proved that Popper''s comparative definition
  of verisimilitude is formally inadequate: for any two false theories, neither can
  have greater verisimilitude than the other under Popper''s definition. Because if
  T2 has more truth content than T1, then T2 must also have more falsity content (given
  both are false). Specifically, if T1 and T2 are both false, then it''s impossible
  for T2''s truth content to properly include T1''s truth content while T2''s falsity
  content is contained in T1''s — the extra true consequences of T2 bring extra false
  ones.


  So the naive idea "more true consequences and fewer false ones = closer to truth"
  is exactly the intuitive gloss that the formal definition captures — and it collapses
  for false theories. This is a beautiful "subtle confusion" target.


