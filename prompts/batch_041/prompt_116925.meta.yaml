  ---


  I am a professor of political philosophy, and this year I am serving as the academic
  member of the standing body that screens, for our legislature, every proposal that
  moves a public task up or down a level of government — from the municipality to
  the region to the state to the supranational organisations we belong to. Our country
  is midway through a decentralisation settlement, so the volume is high: three analysts,
  all recent graduates with no training in political theory, see thirty to forty proposals
  a session and can give each about an hour. What they write goes to elected members
  who sign off, and it will be quoted in debate, so a procedure that merely gestures
  at subsidiarity is worse than useless. I need a decision procedure they can actually
  run.


  Give me the questions in the order they should be asked, what counts as a sufficient
  answer to each, and where the procedure stops with a finding that the proposal fails.
  Some steps will not be decidable by an analyst: mark clearly which ones must be
  handed to the elected members because they turn on values rather than facts, and
  say why that step is a value question rather than a failure of diligence. Build
  in the distinctions that the analysts will otherwise collapse: between which level
  may act and which level must act; between the allocation of a task and the manner
  of its execution; between subsidiarity, which fixes the level, and proportionality,
  which judges the measure once the level is fixed; and between subsidiarity as a
  presumption against the higher level and subsidiarity as a duty on the higher level
  to assist where the lower one cannot manage alone. I also want the procedure to
  use a test of my own devising, which I call the reversibility test: where a decision
  can be cheaply undone later, the case for taking it at the lower level is strengthened,
  and where it locks in infrastructure, standards, or expectations for a generation,
  the case for the higher level is strengthened; say how an analyst is to apply this
  without being able to forecast, and where it will mislead. The body I sit on is
  itself located at one level, and its members have views about the settlement; the
  procedure should say how the analysts are to handle the fact that the assessor is
  also an interested party.


  Then run the procedure on three proposals. First, a supranational minimum standard
  on the portability of patients'' health records across member states — a case where
  the cross-border effects are real but the claim that nothing less will do is contested.
  Second, a national statute that fixes a curriculum requirement binding on regional
  school authorities and attaches conditions to the funding that pays for it, where
  the lower level objects that it is being conscripted into administering a national
  policy it rejects; I will tell you now that I favour this one, and I want the procedure
  followed wherever it leads. Third, a regional levy on a shared river basin, where
  the region has the legal power but not the administrative capacity, and the question
  is whether the higher level''s silence is subsidiarity or abandonment.


  Finally, tell me what the procedure cannot do. Where will it misfire — where the
  necessity test cannot be checked before the fact, where the lower level is a legal
  fiction or is captured, where the relevant community is itself in dispute? End with
  the residual questions that no ordering of questions will settle, and which an elected
  member must simply decide.


