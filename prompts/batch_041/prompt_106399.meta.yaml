  circling: Leonard''s whole life is an advance directive. He writes himself notes
  and tattoos, and the later Leonard -- the one who can''t remember writing any of
  it -- has to live inside instructions from a self he can''t access and can''t interrogate.
  The film even makes us inhabit the later self''s position, since the story runs
  backwards and we''re as ignorant as he is about what the earlier self was thinking.
  So: read the film through the debate about precedent autonomy. The standard move
  there, roughly Dworkin''s, is that the earlier competent self''s critical interests
  -- how she wanted her life to go as a whole -- outrank the later self''s experiential
  interests, the comfort of the person who''s actually here now; and the worry from
  people like Dresser is that this treats the later self as a stranger whose present
  life counts for less. Parfit is in the background too, with the thought that identity
  isn''t what matters and what matters is psychological connectedness, which Leonard
  has almost none of across a night''s sleep. I want to know which way the film comes
  down, if it comes down anywhere."


