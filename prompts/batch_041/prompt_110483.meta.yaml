  diagnoses like drapetomania that were straightforwardly ideology; hysteria dissolving
  as a category; PTSD as something that arguably got built partly by its own criteria
  and by advocacy; the multiple-personality/DID epidemic that rose and then fell with
  diagnostic fashion; kids'' bipolar doing the same; culture-bound syndromes that
  look real in one place and don''t travel; the same person collecting different labels
