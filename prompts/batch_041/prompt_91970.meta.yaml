  \ request is generic: \"separate what is settled from what is genuinely contested.\"\
  \n\nI'll decide: agricultural revolution domain. Hmm, wait. Let me reconsider the\
  \ continuum hypothesis, since it might produce a very in-the-weeds phenomenon that's\
  \ less likely to be regurgitated and where the \"has it got a name\" carving is\
  \ sharp.\n\nCH phenomenon idea: The asker, a grad student or hobbyist, notices that\
