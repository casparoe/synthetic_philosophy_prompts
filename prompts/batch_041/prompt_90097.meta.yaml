  claim: the reference class problem is structurally identical to the problem of choosing
  a coarse-graining in statistical mechanics and to the problem of choosing a feature
  representation in machine learning, and in each case the apparent need for a privileged
  partition is an artifact of treating a pragmatic modeling choice as a metaphysical
  discovery. What I want from you is a map of what would count against this position.
