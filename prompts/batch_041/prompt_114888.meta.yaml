  ---


  I''m in the third year of a philosophy PhD, working mainly in semantics and pragmatics,
  and I have a two-year fellowship starting in the autumn that is supposed to produce
  the core of a dissertation. My interests have drifted toward pejoratives and slurs,
  and I''ve been talking regularly with a friend in NLP who builds content-moderation
  classifiers, so I keep oscillating between the very theoretical end of the topic
  — whether the derogatory element of a slur belongs to the word''s truth-conditional
  content, to a conventional implicature, to a presupposition, or to a speech act
  of subordination — and questions that seem to bear on what a classifier should do:
  reclaimed in-group uses, quotation and mere mention, slurs under negation, in conditionals,
  in questions, and inside reported speech, and the fact that some group terms are
  plainly insults without being slurs while others are slurs without being insults.
  When I write the list out I feel like I''m reciting the standard menu rather than
  thinking about what matters, and that is what I want you to help me fix.


  Treat the fellowship as the unit of effort: two years, one person, my toolkit (formal
  semantics, some corpus methods, no experimental lab, plus a collaborator who can
  run classifier experiments), and one aim — work that both philosophers of language
  and the people building moderation systems would have to take seriously. Which open
  questions in the semantics and pragmatics of slurs matter most, in what order, and
  why? I don''t need a reading list; I know the terrain well enough to have gotten
  bored of my own summaries of it. What I need is a defended agenda: for each question,
  say why it is upstream of the others rather than downstream, how tractable it is
  for someone with my tools, whether an answer would actually change anything outside
  the seminar room, and which questions you would drop even though they are popular,
  because their resolution wouldn''t constrain much. Then tell me what could happen
  in the next two years — a corpus finding, a classifier result, a cross-linguistic
  pattern — that would move a question up or down your ranking.


  One thing that has been nagging me, and that I would like you to treat as a candidate
  axis rather than as a settled distinction: I keep wanting to separate the derogation
  carried by a word''s standing meaning from the derogation carried by the fact that
  a particular speaker is not licensed to use it. On one picture reclamation is a
  change of meaning; on another it is a change in who may say the word, with the meaning
  intact — which would explain why the older and newer uses seem to coexist in the
  same community and why out-group speakers who adopt the reclaimed form still often
