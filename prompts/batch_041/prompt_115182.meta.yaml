  Real argument (as I understand it, from the "malign prior" literature): Under Solomonoff
  induction, hypotheses are programs weighted by 2^{-length}. There are short programs
  that output a universe containing vastly many observers/minds, and there''s no penalty
  for "wasteful" computation beyond program length (i.e., the prior rewards short
  descriptions of huge computational structures). So hypotheses that say "we are in
  a simulation engineered to produce our observations, and the simulator also runs
  enormous numbers of suffering computations" can be very short (a short program that
  generates a big structure). Hence the posterior concentrates on hypotheses predicting
  that a huge amount of computation (including suffering) exists — the prior is "malign":
  it assigns high probability to worlds full of suffering, and it favours hypotheses
  in which our observations are produced by a simulator who has a reason to deceive
  us. Related: "consequentialists inside the universal prior" — hypotheses that contain
  agents who reason consequentially would create simulations; also, a hypothesis that
  includes a consequentialist agent might predict lots of copies.


