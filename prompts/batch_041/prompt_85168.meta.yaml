  Structure:

  - Setting: upper-level undergraduate or MA seminar in decision theory/philosophy
  of probability, 12-16 students, one 90-minute session. Maybe also an option for
  75 minutes.

  - Goal: make students feel the force of the Pasadena paradox — the difference between
  a game whose expected value is infinite and one whose expected value is undefined,
  and the way undefined expectation leaves the expected-value rule silent while choice
  remains forced.

  - The activity: rules, materials, timeline, roles, payoffs (no real money), debrief.

  - The design requirement: the idea should show up in what happens, not in what the
  facilitator says. Students should compute the expectation themselves and hit the
  conditional convergence themselves.

  - Materials: coins, a board, payoff table, tokens.

  - The truncated game: N rounds. Each student or team gets a ticket. The class plays
  the game with a small N and then the facilitator extends N. The running sum of expected
  contributions is tracked. The contributions are ±2^n/n times 1/2^n = ±1/n. Wait,
  careful: the contribution to expectation from outcome n is probability * payoff
  = (1/2^n) * ((-1)^n 2^n / n) = (-1)^n / n. So the terms are 1, -1/2, 1/3, -1/4,
  ... The running partial sums oscillate and converge to ln 2 in the natural order.
  If you group terms as (1 - 1/2) + (1/3 - 1/4) + ... you get ln 2. If you rearrange
  to (1 + 1/3 + 1/5 + ...) - (1/2 + 1/4 + ...) you can get any value. That''s the
  Riemann rearrangement theorem. This is a nice concrete thing students can do by
  hand.


  The activity: give each team a set of index cards with the terms +1, -1/2, +1/3,
