  ---


  For two years I have been writing a novel whose two principal characters, a working
  mathematician of the old unapologetic platonist sort and a philosopher of mathematics
  who is a nominalist of the fictionalist kind, have been paid by a foundation to
  do what the foundation calls an adversarial collaboration. I have reached the chapter
  in which they deliver the document, and I find that I cannot fake it: I need the
  document itself, not a summary of it and not a transcript of their arguing. They
  are to set down, first, a numbered list of claims they both sign — claims about
  mathematical practice, about what they jointly accept as proof, about what the disagreement
  is not — with each claim drafted so that neither is signing something he privately
  reads as a concession. Then a table of their residual disagreements: in the left
  column the point at issue, stated in neutral words; in the next two columns the
  same point as each would put it for himself, each formulation written so that its
  own author would accept it as fair; then the crux or cruxes beneath it — the sub-question
  such that a settled answer would move at least one of them; and finally, for each
  crux, the case, argument, or constructed example that both agree would count as
  evidence bearing on it, together with each side''s verdict on that case, registered
  in advance and in the conditional (if the case goes this way, I concede X; if that
  way, I concede Y). Neither of them may cite a book or a paper; the foundation forbade
  it and they have agreed, so the document must stand on arguments and examples alone.
  Where they cannot agree even on what would count, they are to say so plainly rather
  than invent a test to fill the column.


  I have given them three instruments of my own devising, because I want the collaboration
  to bite on something that neither of them has read in a textbook, and I want you
  to use them. The first is the ledger test: take any sentence of a physical theory
  and rewrite it so that no numeral and no apparent quantification over numbers remains,
  replacing the numerical apparatus with plural or relational vocabulary of their
  choosing; they must state jointly what a faithful such rewriting is required to
  preserve — truth-value, explanatory power, modal profile, predictive equivalence,
  or something narrower — and then say whether the ledger test, run on real physics,
  is one that the nominalist can pass and the platonist must concede, or one that
  no rewriting can pass, or one that both can pass and that therefore decides nothing.
  The second is the orphan theorem: a purely combinatorial statement whose only known
  proof runs through a detour in a stronger theory, so that the detour is doing work
  no paraphrase can do; I want their rival accounts of what, if anything, is known
  in such a case, and whether the detour is an embarrassment for the nominalist or
  a windfall for the platonist. The third is the successor-physics counterfactual:
  stipulate that physicists one day write their theories in a formulation that is
  empirically equivalent to the present one and contains no numerical ontology at
  all; I want each of them to say, before the fact, what that would and would not
  show, and whether the platonist has any counterfactual outcome available to him
  that would refute the nominalist''s reading of it.


