  Teleosemantics: naturalizing intentionality/content via biological function.


  - Ruth Millikan''s biosemantics: content is fixed by the proper function of the
  representation-producing device, determined by evolutionary history. Her "consumer"
  theory — a representation''s content is determined by what the consumer mechanisms
  are supposed to do with it. She uses the example of the honeybee dance (von Frisch)
  — the dance represents the location of nectar, and the content is fixed by the function
  of the dance in the bee''s economy. Also "producer" and "consumer" — actually Millikan''s
  theory focuses on the consumer side: the content of a representation is determined
  by the "Normal conditions" and what the consumer is designed to do.

  - Fred Dretske: indicator semantics / "natural meaning" — a state represents what
  it carries information about (indicator), with the requirement of being recruited
  by learning/evolution to indicate. Dretske''s "Misrepresentation" — he distinguishes
  the informational content vs. the semantic content; the system has the function
  of indicating.

  - David Papineau: success semantics / desire-belief.

  - Karen Neander.


  Key objections:

  - The "swampman" (Davidson) — a molecule-by-molecule duplicate of a person formed
  by accident has no evolutionary history, so on pure biosemantics it would have no
  content. This is an objection to teleosemantics. But careful: swampman is Davidson''s
  thought experiment, used against teleosemantics by others (e.g., it''s discussed
  by Papineau, Braddon-Mitchell & Jackson). Actually swampman was introduced by Davidson
  in "Knowing One''s Own Mind" (1987) in a different context (against externalism
  about content generally / or about self-knowledge). It''s commonly invoked against
  teleosemantics. I''ll avoid asserting attribution strongly; I can have the student
  make the mistake of attributing swampman to Millikan as her own example, or something.


