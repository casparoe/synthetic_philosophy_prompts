  policy and yet is required to choose. The ass''s tragedy, if there is one, is not
  that it lacks a preference but that it lacks a *procedure*. The distinction matters
  because it separates the metaphysics of preference from the normativity of choice.
  Preference is a comparative attitude; choice is an action. The policy-first account
  says that the rationality of action depends on the structure of the agent''s intentions,
  not on the existence of a ranking.


