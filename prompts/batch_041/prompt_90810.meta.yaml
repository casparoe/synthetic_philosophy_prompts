  Draft:


  "I have been thinking about a distinction I keep running into, and I would like
  you to tell me what any serious answer to the question would have to do before I
  hear another answer. The distinction is between three ways a community can handle
  insults, slights, and status. In the first, a person''s worth is bound up with their
  reputation, and a slight that goes unanswered is a real loss, so the person is expected
  to answer it themselves, sometimes violently, and the community treats that as a
  matter of course. In the second, people are thought to have a worth that insults
  cannot touch, so slights are meant to be shrugged off and disputes are handed to
  impartial authorities rather than settled privately. In the third, slights are treated
  as serious injuries, and people are expected to publicize them, appeal to the moral
  judgment of an audience, and sometimes compete for recognition as the one who has
  been wronged most. I have seen all three described as moral progress relative to
  the others at different times, and I have seen each described as a moral disaster.


  What I want from you is the specification: what would any account that says one
  of these is morally better than another have to get right in order to count as adequate?
  Give me the requirements one by one, each with the case or consideration that makes
  it a requirement -- what it must explain, what it must not contradict (about how
  these patterns actually arise, about who is doing the judging, about the difference
  between a code and the people who live under it), which distinctions it cannot collapse,
  and where it must avoid simply assuming the standards of one of the three. Then
  tell me which requirements you think cannot all be met at once, and which single
