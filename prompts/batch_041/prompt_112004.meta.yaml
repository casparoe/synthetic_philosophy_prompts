  Now design the dialogue carefully so it''s substantive and in the weeds:


  Side A ("bears on the philosophy"): the diary doesn''t merely reveal bad character;
  it bears on the *content*. Arguments:

  - Frege''s anti-psychologism says logical laws are independent of how anyone thinks;
  but the diary suggests a conception of objectivity as *impersonality* and *sharpness*
  — a hatred of vagueness, mixture, "Mischung" — that also underlies his insistence
  that concepts must have sharp boundaries and that logic must be a "science of the
  laws of truth" that disciplines thinking. The same temperament shows up as a philosophical
  thesis. That''s a "structural affinity" argument: not guilt-by-association but an
  argument that the philosophical ideal is a sublimated form of the political one.

  - Or: the diary shows that Frege''s confidence that logic''s authority is unconditional
  (not answerable to human agreement or practice) is a *conception of authority* rather
  than a neutral fact, and its political analogue is his contempt for parliamentary
  deliberation; so the "impersonal objectivity" is not politically innocent.

  - Also: the diary complicates the standard picture of Frege as a purely "logical"
  thinker; it shows the ideal of a "pure" science served as an escape from a messy
  social world.

  - Also: even if the diary doesn''t change truth-values, it changes how we should
  teach and frame the doctrines; and it bears on the *historiography* (e.g., what
  we call "Frege''s revolution").


  Side B ("doesn''t bear"): arguments:

  - Anti-psychologism is precisely the thesis that the correctness of logical laws
  is independent of the logician''s psychology; so a diary is *by Frege''s own lights*
  irrelevant to the truth of his doctrines. Using it to assess the philosophy is a
  genetic fallacy.

  - The "structural affinity" argument is a resemblance claim, not an entailment:
  you can accept Frege''s platonism about concepts without accepting his politics;
  plenty of people do. Resemblance under a description chosen to make them resemble
  is cheap.

  - The "authority" argument conflates two senses of objectivity: objectivity as not
  up to us (a metaphysical claim) vs. authoritarianism (a political claim). Non-negotiability
  of mathematical truth doesn''t license political non-negotiability.

  - Timing: the diary is late (1924), after the major works; the political views are
  not load-bearing in the logic; no published work of logic contains these premises.

  - Private documents shouldn''t be weighted like published ones; and we don''t generally
  think we can''t use Maxwell''s equations because of Maxwell''s views (or Frege''s
