  — this is the part I care about — it recruits the reader into the same error, since
  we cannot imagine a fourth dimension either, and the book''s own two-dimensional
  text and diagrams are built to keep us there. What I want from you is a reading
  that takes this seriously as an argument, not just a metaphor: does the novella
  vindicate the conceivability principle for the elevated mind (the Square, once lifted,
  is right about the third dimension) while refuting it for the flat one, and is that
