  is false. But the conclusion is too strong? The asker might think the counterfactual
  account is the best account, so they can''t accept 6. Where does it go wrong? The
  flaw could be in step 1: counterfactual dependence is necessary but not sufficient
  for causation. Or step 2: not all omissions that are counterfactually necessary
  are causes; only those that are relevant, or that violate a norm, or that are contrastive.
  Or step 4: the triviality doesn''t follow because causal selection is a separate
  matter. The cost of rejecting 1 is giving up a simple account; the cost of rejecting
  2 is giving up the idea that any counterfactual dependence is causal; the cost of
  rejecting 4 is accepting that causation is ubiquitous but explanation is selective.
  This is in the weeds.


