  Domain: Causation by omission.


  Prompt: A PhD student in philosophy (metaphysics/ethics) is working on a paper about
  omissions. They have an argument that seems to prove that omissions are never causes,
  but they think that''s absurd because we cite omissions in causal explanations and
  blame. They lay out the argument:


  (1) Causation is a relation between events.

  (2) An omission is not an event; it is the absence of an event.

  (3) Therefore, an omission cannot be a cause.

  (4) If an omission cannot be a cause, then a failure to save a drowning child does
  not cause the child''s death.

  (5) But a failure to save can be a cause; it is what we cite when we say the lifeguard''s
  negligence caused the death.

  (6) Therefore, (1) or (2) is false.


  This is too simple. The real issue: (2) is true on some views but not others; (1)
  can be rejected by allowing causation by absences. The argument doesn''t prove too
  much; it''s a dilemma. Not great.


  Better: an argument that seems to prove that if omissions are causes, then everything
  is a cause of everything. This is a classic problem. Let''s formulate carefully:


  1. An omission O is a cause of an outcome E if E would not have occurred had O not
  occurred (counterfactual dependence).

  2. For any outcome E, there are indefinitely many omissions O such that if O had
  not occurred, E would not have occurred. (For example, if I had not failed to prevent
  E, E would not have occurred; if I had not failed to invent a cure, etc.)

  3. Therefore, any outcome E has indefinitely many omissions as causes.

  4. If any outcome has indefinitely many causes, then the concept of a cause is trivial
  and cannot ground responsibility or explanation.

  5. But the concept of a cause is not trivial; it grounds responsibility and explanation.

  6. Therefore, the counterfactual dependence account of causation by omission is
  false.


