  traditional sense are supposed to be ineffable, intrinsic, private, and directly
  apprehensible in consciousness. The standard puzzle is the one I half-remember from
  a seminar — two coffee drinkers, call them Chase and Sanborn, with identical histories
  and identical current behaviour: both used to enjoy coffee, both now find it unpleasant,
  both can still discriminate and describe the taste the same way. They differ only
  in their introspective verdict: Chase says the taste itself changed, Sanborn says
  the taste is unchanged and he has changed. Nothing in what they do or say about
  the coffee separates them.


