  I am the secretariat of a standing expert advisory panel at a national food-safety
  regulator. The panel has ten members, meets about ten times a year, and answers
  roughly forty binary questions annually — approve or do not approve a proposed maximum
  residue limit, permit or refuse a novel ingredient, keep or revisit an existing
  approval. The agency follows the panel''s recommendation in the great majority of
  cases, and each recommendation is legally consequential: a wrongful approval is
  expensive and slow to unwind, while a wrongful refusal blocks a product and invites
  challenge from the applicant. Small questions are handled by three-member sub-groups;
  the panel votes in closed session after discussion, votes are recorded with names
  attached, and the dossier before it has been prepared by our own staff and read
  by everyone. The legal office wants a rule it can defend in writing; I have one
  hour per question and no statistician on call.


  Write me a decision procedure I can actually run before each vote. I want it grounded
  in what Condorcet''s jury theorem and the work it has generated genuinely support,
  rather than in a slogan about the wisdom of crowds. The theorem''s conditions —
  a binary question with a defensible right answer, each member better than even at
  getting it right, and errors that are independent across members — are never fully
  satisfied in our room, so the procedure has to be a series of tests that tell me
  which conditions fail and what follows when they do. It should tell me, in order:
  whether the question is one on which a majority can be more likely to be right than
  its individual members at all, or whether it is a question of acceptable risk on
  which competence is undefined and the vote is only a show of hands; whether to vote
  as a full panel or a sub-group, and how the answer to that depends on whether our
  members are better or worse than chance; what to do about the independence condition
  when everyone has read the same dossier, most of the ten were trained in the same
  two laboratories, and two members have co-published with the applicant; how to elicit
  opinions so that the vote approximates independent judgment rather than deference
  to the two most senior members; how the threshold should move when the costs of
  the two errors are unequal, and how I can tell the legal office why a simple majority
  is not automatically the right rule; what to do when the panel splits near the middle,
  and what to do when a majority rejects a conclusion that follows from premises each
  of which a majority accepted (this happens to us: separate votes on whether the
  pivotal study was reliable and whether the effect it reports is adverse both pass,
  yet the conclusion that the substance is unsafe fails, because different members
  defect at different steps). Finally, I want the points where the procedure stops
  and a person must decide, and an honest statement of what it cannot do.


