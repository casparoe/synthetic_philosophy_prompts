  Standard Death in Damascus (from the decision theory literature, e.g., in discussions
  of CDT): You are in Damascus; Death has an appointment with you tonight; you can
  flee to Aleppo. But Death has predicted your choice (or rather, the case is constructed
  so that Death will be wherever you go). EDT: fleeing to Aleppo is evidence that
  Death''s appointment is in Aleppo, hence fleeing is evidence of death; so fleeing
  has lower expected utility (conditional on fleeing, you die) — so EDT says stay.
  CDT: your action does not cause where Death goes; Death goes where you go regardless;
  so both acts have the same outcome (death), so no reason to prefer; CDT says it
  doesn''t matter, or "you can flip a coin". Actually the interesting twist: under
  EDT, staying is also evidence of death, so the conditional probabilities: P(die
  | stay) = 1 and P(die | flee) = 1, so both are equal — the standard point is that
  EDT is indifferent too, or that EDT''s recommendation flips depending on how you
  set up the conditional. Hmm. Let me recall: The case is usually presented as a problem
  for EDT: EDT seems to say "don''t flee" (because fleeing is evidence that you''ll
  die in Aleppo), and this seems absurd/counterintuitive, or it makes EDT unstable:
  if you decide to stay, then... hmm, actually the standard point (from Hitchcock''s
  film, discussed by... I think it''s in the literature as "Death in Damascus" by...
  maybe it''s from a 2011-ish paper?) is that it''s a case where EDT gives the "wrong"
  answer: it says stay in Damascus even though staying is certain death, because fleeing
  is evidence of death in Aleppo. But if the state is defined as "Death''s appointment
  is where you go", then fleeing is evidence of dying, so EDT says stay; but staying
  is also evidence of dying in Damascus. The classic way: the agent should reason:
  "If I flee, that''s evidence that I''ll die in Aleppo; so I should stay." But then
  "if I stay, that''s evidence I''ll die in Damascus." So EDT is unstable — the recommendation
  depends on how you partition the states, or the case shows EDT''s advice is self-defeating.
  That''s the point of the case: it''s the "Damascus" objection to EDT, showing it
  recommends acting so as to make the bad state actual.


