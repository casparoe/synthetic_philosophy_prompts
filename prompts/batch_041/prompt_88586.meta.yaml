  objection (e.g., strict finitism / ultrafinitism, or Wittgensteinian surveyability),
  and if so is it defensible given the constructive content of the proof? And what
  does it say about the theorem''s epistemic status: do we know the four color theorem?
  Both directions: theory illuminating case, case testing theory.


