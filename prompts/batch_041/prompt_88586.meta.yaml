  Paragraph 2: Seed the mapping and the specific distinctions. Ask: state what the
  intuitionistic/BHK account says a proof is and what a proof of an existence claim
  must deliver; distinguish (a) meaning-theoretic thesis (proof = construction, meaning
  = conditions of proof), (b) the existence/witness thesis, (c) the finitist/decidability
