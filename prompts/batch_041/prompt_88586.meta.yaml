  understanding) and whether constructivism has resources to state it. Also: does
  the later formalization in Coq (Gonthier, 2005) strengthen or weaken the constructivist
  position — a machine-checkable proof is more verifiable yet less surveyable.


  Paragraph 3: In both directions — what the episode shows about constructivism (anomaly/limits):
  it suggests constructivism is a doctrine about content of mathematical statements,
  not about the epistemology of verification, so it is silent about the actual dispute;
  also it exposes an ambiguity in constructivist rhetoric between "constructive" (as
  in witness) and "constructive" (as in human-surveyable). And ask: how should a constructivist
  respond to the CFSG, a non-computer proof no human can survey? And what would change
  your mind / what further case would discriminate.


