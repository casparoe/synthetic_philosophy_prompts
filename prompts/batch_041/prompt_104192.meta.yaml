  I am designing a session for an advanced seminar on secession and self-determination,
  and I want a dialogue that avoids the usual set pieces. Please write a sustained
  exchange between two political philosophers, both of whom are formidable and neither
  of whom is a caricature. The first defends the remedial-right view: a group has
  a moral right to secede only if it has suffered serious and persistent injustice
  at the hands of the state, and secession is a remedy of last resort. The second
  defends a primary-right view: a territorially concentrated group with a distinct
  political identity may secede even absent injustice, provided the decision is made
  through a fair internal process and the resulting state would respect basic rights.
  Set the dialogue in an invented but realistic case: a democratic federation called
  the Union, and a prosperous, linguistically distinct region called Cordelia that
  was incorporated two centuries ago after a war, now wants to leave. Cordelia is
  not oppressed; indeed, it is richer than the rest of the Union and resents fiscal
  transfers to poorer regions. A substantial minority within Cordelia, however, identifies
  with the Union and fears becoming a permanent minority in a new state. Neither philosopher
  may cite actual authors, statutes, treaties, or historical cases; the argument must
  be self-contained.


  The dialogue should move through at least these pressure points, with each speaker
  responding to the other''s actual arguments rather than talking past them: whether
  the absence of injustice is fatal to Cordelia''s claim; whether the remedial view
  can avoid a secession cascade without simply entrenching the status quo; whether
  the primary-right view can solve the boundary problem, since the right to secede
  must belong to some determinate unit and any proposed boundary will cut through
  people''s identities and interests; whether the internal minority in Cordelia has
