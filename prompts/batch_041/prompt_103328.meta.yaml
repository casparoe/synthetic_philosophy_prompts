  Setting: A reading group / seminar on animal ethics. Two people argue about Nozick.


  Person A: Nozick''s move of "utilitarianism for animals, Kantianism for people"
  is incoherent / ad hoc. He wants to say animals matter, but then he refuses to apply
  the same maximizing logic to humans. If maximizing welfare justifies sacrificing
  an animal''s interest for a greater good, why not a human''s? He just picks the
  theory that gives the answer he already wanted — animals get the utilitarian treatment
  (which permits eating them when it maximizes total welfare), humans get the inviolability
  (which protects us). That''s a double standard dressed up as a theory.


  Person B: No, the point is that the difference in treatment tracks a real difference
  in capacities. The reason you don''t use a human as a mere means is that the human
  can formulate and pursue a conception of their life; animals (or most) can''t, at
  least not in the same way. So the two-tier view isn''t ad hoc, it''s tracking a
  genuine moral difference. And Nozick isn''t saying we can treat animals any way
  we like; he''s saying the constraint that makes humans inviolable doesn''t apply,
  but there''s still a constraint (utility). Actually the point is more subtle: Nozick''s
  real worry is that any criterion that excludes animals (like rationality) will also
  exclude some humans (infants, severely cognitively disabled). So if you use rationality
  to deny animals moral standing, you''d have to deny it to those humans too — unless
  you draw a line that''s not ad hoc. Nozick finds that uncomfortable.


