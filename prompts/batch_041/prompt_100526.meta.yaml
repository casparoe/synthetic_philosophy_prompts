  I am a second-year PhD student in philosophy, working on moral responsibility and
  the metaphysics of free will, and I keep running into a dialectical move that I
  can describe but cannot name. The move appears when someone wants to defend the
  principle that moral responsibility requires the ability to do otherwise. A Frankfurt-style
  case is presented: an intervener stands ready to force the agent''s choice if the
  agent shows any sign of choosing otherwise, but the agent chooses on his own, so
  the intervener never intervenes. The defender of the principle grants that the agent
  could not have chosen otherwise in the ordinary sense — the intervener would have
  prevented it — but then insists that the agent could still have done otherwise in
  some thinner sense: he could have tried, or could have formed a different intention,
  or could have deliberated differently, or could have been the sort of agent who
  would have chosen otherwise. The thinner alternative is not robust enough to make
  a difference to what actually happens, but it is supposed to be enough to save the
  principle. I want to know whether there is a standard name for this general defensive
  strategy, and, more importantly, how exactly to carve it.


