  My half-formed idea is this. The long-running debate about whether the Buddhist
  denial of self (anattā) can accommodate personal identity has been conducted almost
  entirely as a debate about diachronic identity — about how a causal series of momentary
  mental and physical events can underwrite memory, desert, karmic continuity and
  the conventional ''person''. That framing already concedes too much, because it
  treats the self as a thing to be either recovered or eliminated at the level of
  entities, and then asks whether the series can do the work of the thing. I want
  to shift the question away from the unity of the person, whether at a time or over
  time, and towards a feature of experience that this framing leaves entirely untouched:
  the fact that experience is given in the first person at all — that a pain, a sound
  or a thought is not merely present but presented as mine, or as ''for me''. Call
  this the mineness of experience, and treat it as a structural feature of how experience
  is given rather than as one more item within experience.


  The question I want the proposal to pose is roughly this: when Buddhist reductionism
  denies the self, is it denying that any entity answers to ''I'', or is it denying
  that experience has this first-personal structure — and can the second, much stronger
  denial be stated at all without covertly presupposing the very subject whose existence
