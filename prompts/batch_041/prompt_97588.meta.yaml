  and reciting them is the very failure mode I am trying to escape. I want a decision
  procedure, in order, that a clerk can actually run: the questions to ask, what counts
  as a sufficient answer to each, the points where the procedure returns a determinate
  answer and stops, and the points where it must hand the question back as a contestable
  value choice rather than a fact about language. Mark the steps that are judgment
  calls dressed up as procedure; I would rather see them labeled than disguised.


