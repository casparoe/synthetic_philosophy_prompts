  a month; the routine ones never reach me. The memo decides which way the chambers
  leans, so the stakes are real — a wrong call changes what people may lawfully do
  — but nothing is on fire, and I have a day, occasionally two, per case. The judge
  signs whatever eventually issues; I do not. The judge is a committed textualist
  by temperament and by stated method, while I have never managed to talk myself out
  of the purposivist''s founding intuition that a legislature''s point bears on what
  its words mean. A procedure that only one of us can run is useless; it has to be
  one I can hand to the judge with a straight face.


