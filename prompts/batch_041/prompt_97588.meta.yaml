  because they are where the slogans break. (1) There is a seam, somewhere, between
  finding a text''s meaning and giving it legal effect; the interesting question is
  not whether the seam exists but where it falls, and whether the procedure can locate
  it without appealing to the very intention it was meant to discipline. (2) A legislature
