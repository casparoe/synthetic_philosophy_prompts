  proposal I want them to assess is this: a student in the seminar has argued that
  the entire criteria debate is a failure of informal reasoning, and that the criteria
  should be replaced by an explicit probabilistic framework. On his view, each criterion
  is really a claim about a likelihood ratio — the probability that a given saying
  or deed would appear in the tradition if it were authentic, divided by the probability
  that it would appear if it were not — and once those ratios are stated openly and
  combined, the apparent conflicts among the criteria (dissimilarity pulling toward
  a Jesus alien to Judaism, embarrassment pulling toward the church''s self-criticism,
  coherence quietly smuggling the very theology under dispute back in as evidence)
  will either resolve or be revealed as disagreements about stipulated numbers rather
