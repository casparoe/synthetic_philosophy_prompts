  group and the philosophy of physics group, and I need a Q&A prep sheet. My thesis:
  modal realism should be rebuilt on quantum branching rather than on spatiotemporal
  connectedness. On the received picture, a possible world is a maximal spatiotemporal
  whole, worlds are spatiotemporally and causally isolated from one another, and de
  re modality is handled by a counterpart relation that we are free to specify. I
  want to replace all three. A world, on my account, is a maximal branch of the universal
  quantum state — a maximal set of histories that are mutually decohering; worlds
  share a past and diverge; there is no requirement of spatiotemporal isolation, and
  connectivity is neither necessary nor sufficient for worldhood. Actuality is indexical:
  the actual world is the branch I am on, and I mean that as a physical index and
  not a semantic one. And the counterpart relation is not a free semantic choice but
  a fact about how structure is inherited along branching: two things are counterparts
  when their structural descriptions are continuous across a branching event.


  I advertise three payoffs: the plurality of worlds stops being a brute posit and
  becomes a consequence of the physics; the island-universe awkwardness disappears,
  since disconnected regions need not be separate worlds; and counterpart theory stops
  being the embarrassing part of the package, because the counterpart relation is
  now read off the physics.


