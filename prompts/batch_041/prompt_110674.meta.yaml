  4. Metaphysician: you now can''t make sense of possibilities that are not physically
  accessible — logical possibility, counterfactuals about different physics, "what
  if there were no quantum mechanics". You''ve made modality hostage to actual physics,
  which is a huge cost for a theory of modality, and it''s arguably incoherent (you
  need modal notions to state what a decoherence-separated branch is).

