  3. Ersatzer/mainstream metaphysician: you''ve abandoned the theoretical-utility
  argument that is the only serious argument for concrete worlds; if worlds are branch-relative
  and physically generated, an ersatzist who says "worlds are maximal consistent representations"
  can tell the same story about possibility, cheaper. So your view collapses into
