  Setup: A is closer to the truth than B iff (i) every true consequence of B is a
  true consequence of A (A''s truth content ⊇ B''s), and (ii) every false consequence
  of A is a false consequence of B (A''s falsity content ⊆ B''s).


  Note (i) needs to be strict for A to be strictly closer: A''s truth content ⊋ B''s
  truth content; and (ii) A''s falsity content ⊆ B''s falsity content, possibly strictly.


  Claim: If B is false and A is closer to truth than B, contradiction.


  Proof: B false ⇒ B has some false consequence F. Since A is closer, A''s truth content
  strictly contains B''s: there''s a true sentence T with B ⊬ T, A ⊢ T. Then A ⊢ T
  ∧ F, which is false (T true, F false). Is T ∧ F a consequence of B? B ⊢ T∧F iff
  B ⊢ T, which is false. So T∧F is a false consequence of A not of B. But condition
  (ii) says every false consequence of A is a false consequence of B. Contradiction.
  ✓.


