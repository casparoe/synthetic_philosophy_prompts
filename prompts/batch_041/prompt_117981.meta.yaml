  defeat'' narratives, and I think such narratives are morally pernicious because
  they sanctify loss and license future violence; (6) what makes a myth harmful is
  not its falsity but the political work it does; and (7) commemoration should aim
  at truth rather than social cohesion. Which of these actually pull against each
  other, which only appear to, and what is the least costly way to make the set consistent?
  Please rank the tensions by severity rather than treating them all as equally bad,
  and tell me what each repair would cost me."


