  Let''s think of a specific set for Internal vs external reasons:


  - (1) I accept Williams''s internalism: a statement "A has a reason to φ" is true
  only if φ-ing is appropriately related to some element in A''s subjective motivational
  set.

  - (2) I also think there are categorical moral reasons: every rational agent has
  reason to be honest, even if honesty serves none of their desires.

  - (3) I think moral reasons are not merely hypothetical imperatives; they bind independently
  of contingent ends.

  - (4) I think an agent can be ignorant of a reason they have, and can fail to be
  motivated by it, because deliberation can reveal reasons that were already there.

  - (5) I think the amoralist is not irrational in the sense of contradicting himself;
  he just lacks a reason.

  - (6) I think reasons are facts about what there is normative reason to do, not
  facts about what the agent would be motivated to do under idealisation.


  Tension: (1) internalism vs (2) categorical moral reasons. (4) apparent tension
  with (1) but dissolves: Williams allows for reasons one isn''t currently motivated
  by, if deliberation from S would yield it. (6) vs (1) tension: internalism seems
  to make reason statements depend on motivation, but (6) says reasons are facts independent
  of motivation. (5) with (2) tension: if amoralist lacks a reason, categorical moral
  reasons are false for him. Could rank.


