  Costly signaling / handicap principle lends itself beautifully to a game with payoffs:
  a signalling game where participants must burn resources to be credible. The "in
  the weeds" aspect: the handicap principle''s precise claim — that signals must be
  differentially costly to be honest, and that the cost must be higher for low-quality
  signallers (the "differential cost" condition), plus the fact that Zahavi''s original
  formulation was widely rejected as circular/group-selectionist before Grafen''s
  formalisation showed the equilibrium exists. Also the distinction between "handicap"
  and "index" signals (Maynard Smith & Harper''s distinction between indices and handicaps).
  And the recent debates about whether the handicap principle is nearly vacuous ("any
  signal can be modelled as a handicap"), and whether "costly signalling theory" in
  human behavioural ecology is over-applied (the "costly signalling" bandwagon critique).


  Also the "in the weeds" thing: the activity should make them feel the force of the
  *differential* cost condition — i.e., a game where they can send a signal and the
  naive expectation is that burning resources is just waste, but the twist is that
  a cheap-to-fake signal collapses, and only a signal whose cost curve differs between
  types sustains honesty. That''s a real, runnable game: participants with hidden
  quality types (drawn cards), choose a costly display (give up tokens), then choose
  partners. Predictable failure: if the cost is equal across types, everyone burns
  the same amount and no information transmits; or they over-invest in signalling,
  and total payoffs crash — which is a nice thing to debrief (the "everyone''s worse
  off but the equilibrium is stable" point, plus the "costly signalling is wasteful
  at the population level yet individually rational" bit).


