  a reading on which the Advocate also means class-exclusion at some points... The
  interlocutor''s objection only works on the exclusion reading, so if 非 is univocally
  non-identity, the dialogue''s second half has to be explained.

  4. The "so what" / philosophical interest defeater: if the position makes the argument
  come out as a triviality (of course ''white horse'' isn''t synonymous with ''horse''),
  that''s a defeater of a different kind — the position loses the explanatory payoff
  it promised.

