  A colleague and I recently spent an evening trying to referee an argument we had
  both witnessed, and we got nowhere, so I would like an outside judgment.


  The argument concerned a third person — I will call him Theo — who spent an afternoon
  at a flea market. Theo arrived owning a banjo. He traded the banjo for a mandolin,
  paying the dealer $5 to close the swap; later he traded the mandolin for a fiddle,
  paying $5 again; and later still he traded the fiddle back for the banjo, paying
  $5 a third time. He went home with the banjo he had started with and $15 less in
  his pocket. He was not deceived, was not drunk, and does not regret any of it; he
  says he would do it again, because each trade was what he wanted at the time. His
  rankings were stable throughout the afternoon and, as far as anyone can tell, complete:
  he prefers the mandolin to the banjo, the fiddle to the mandolin, and the banjo
  to the fiddle, and he ranked them that way both before and after.


  Two of my friends, Rosa and Idris, then argued about what this shows. Reconstructing
  from memory:


  (1) Rosa said it shows that Theo''s preferences are incoherent, and that the proof
  does not depend on any single bad decision. At every moment, including the last,
  Theo''s own ranking places the endpoint of the do-nothing course — banjo plus $15
  — above the endpoint of the course he actually took. A person whose ranking makes
  every step of a sequence look better than the alternative, while making the sequence
  as a whole worse than an available alternative, is being walked in a circle by his
  own preferences, and that is what a money pump demonstrates. She added that no clever
  or informed adversary is needed: a vending machine with posted exchange rates of
  $5 per swap would extract the same $15 from Theo, and would keep extracting it indefinitely,
  without knowing anything about him except what his own trades revealed.


  (2) Idris said this conflates two different questions. Whether a choice is rational
  is a question about the chooser''s options, preferences, and information at the
  moment of choice; by that standard, each of Theo''s three trades was strictly better
  than its alternative and therefore rational. What Rosa has shown, he said, is that
  Theo''s preferences are defective, not that Theo acted irrationally; and the two
  are not the same. He compared Theo to a weak chess player: losing to a stronger
  opponent is not irrationality, and being exploitable by someone who can see your
  preferences is not irrationality either.


  (3) Rosa replied that the chess analogy fails in a way that matters. The chess player''s
  defeat is defined by a standard external to him — the rules of the game and the
  opponent''s skill — whereas Theo''s loss is defined entirely by his own ranking,
  and the fact that he would go around the machine forever, paying at each turn for
  a change he then wants, is not a fact about the machine. She also noted that his
  preferences were stable, so the familiar excuse — that he simply wanted different
  things at different times — is unavailable.


  (4) Idris granted the stability point but said it proves less than Rosa thinks.
  Any sequential choice can be broken into steps and made to look locally impeccable,
  he said; what normally guarantees that locally best choices add up to a globally
  best plan is the transitivity of preference, so the pump shows at most that transitivity
  is required for coherence — a claim about the shape of the ranking, not about the
  rationality of Theo''s conduct. He added that the remedies Rosa might propose —
  declining the first trade, refusing the third, signing a commitment device — all
  require Theo to act, at some moment, against what he then most prefers, and that
  a person who holds that each moment''s self should do as it then pleases is not
  making an elementary error but holding a defensible view about diachronic rationality.
  So the pump, he said, is not the neutral test it pretends to be.


  (5) Rosa answered that this makes the remedy sound worse than it is. If avoiding
  a $15 loss for nothing requires Theo to bind himself in advance, that seems to be
  a defect in Theo rather than in the argument; and if his view really is that each
  moment''s self is sovereign, then he has, in effect, agreed to be treated as a succession
  of strangers, and cannot complain when one of those strangers is a dealer who profits
  at his expense.


  Please adjudicate move by move. For each of the five numbered moves, say whether
  it is mistaken, defensible, or right, and briefly justify the rating; distinguish
  any claim that is true but does not bear on the dispute from one that actually decides
  something. Then give an overall verdict, including whether the disagreement is ultimately
  about rationality at all or about something else, and say what both Rosa and Idris
  are missing. Do not simply award the argument to one side.


