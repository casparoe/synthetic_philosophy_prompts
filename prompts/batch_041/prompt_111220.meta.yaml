  What I''m defending: van Fraassen''s Reflection principle is not a real norm — the
  idea that if you''re sure you''re going to end up with credence x in A, you should
  already have credence x in A. My line is that it survives only in a hobbled form:
  it applies when you''re certain that your future self (i) has all the evidence you
  have now and then some, and (ii) is still in possession of the reasoning you''re
  doing right now. Call that the no-loss version. On the no-loss version, all the
  stock counterexamples — the pill that makes you 0.99 confident in something you
  know is baseless, the case where you know you''ll forget the very argument you''re
  now running — turn out to fail (i) or (ii), so they were never counterexamples to
