  ---

  Title: A Programmer''s Take on the Separateness of Persons


  I came to this from software, not philosophy. The objection I want to examine is
  the one usually associated with Rawls: that utilitarianism treats society as if
  it were a single person, summing everyone''s welfare into one total to be maximized,
  and in doing so fails to take seriously that people are separate. My instinct is
  that this objection is often stated in a way that conflates two very different claims,
  and that only one of them is defensible.


  Setup: imagine a welfare vector w = (w1, ..., wn), one entry per person. Utilitarianism
  (in the simple form) says the value of a state is the sum of the entries, or more
  generally some increasing function of the total. The important structural feature
  is that this value depends only on the multiset of welfares — it is invariant under
  permuting the entries. Swap A''s and B''s welfare and the verdict is unchanged.
  Call this person-anonymity.


  Now, the separateness objection. Stated loosely, it says that person-anonymity is
  false: who holds which welfare matters. But if we take that literally, we get something
  no one believes. Nobody thinks a world where A is at 10 and B at 2 is better than
  one where A is at 2 and B at 10 merely because of which name got the 10. That would
  make moral value depend on arbitrary labels, and it would make impartiality impossible.
  So the objection cannot really be that person-anonymity is false.


  I think what the objection needs is a different claim: non-fungibility. Utilitarianism,
  because it only looks at the total, treats one person''s welfare as substitutable
  for another''s. A gain of 5 to A can cancel a loss of 5 to B, and the ledger balances.
  The objection is that there is no such ledger — that B''s loss is not compensated
  by A''s gain, not because the totals don''t match, but because B is not A. The person
  whose loss it is has a standing that the total cannot absorb.


  If that is the real claim, then several things follow. First, the objection is not
  really about aggregation (summing) at all; it''s about the assumption that individual
  welfares are commensurable and transferable on a single scale. A non-additive aggregator
  — say, one that is concave in each person''s welfare — still pools them. Second,
  the objection does not, by itself, tell us to maximize anything else; it tells us
  that certain maximizing moves (pure transfers that only balance in the total) are
  illegitimate.


  Then the part I find genuinely interesting. Non-fungibility, which sounds like it
  makes morality more restrictive, is also what makes compromise and trade possible.
  If welfare were fungible — if the total were all that mattered — there would be
  no need for two people to agree to anything; the aggregator would simply reallocate.
  It is precisely because each person''s welfare is his or her own that we need consent,
  exchange, and negotiation. Separateness is the precondition of gains from trade
  rather than an obstacle to them.


  I suspect this reframing either (a) is a standard move I''ve rediscovered, (b) proves
  too much, or (c) quietly changes the subject from persons to welfare. I''d like
  comments.

