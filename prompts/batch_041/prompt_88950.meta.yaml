  Handout excerpt — three ways you can lean on an AI, which I argue are different
  in kind rather than points on a scale:


  - task offloading: you hand over a step you can do yourself, and you can still check
  the result.

  - verification offloading: you hand over a step you can''t do yourself and can''t
  independently check, but you don''t treat the result as settling the matter — you
  can hold it as provisional, look for other evidence, keep the question open.

  - authority offloading: you treat the result as settling the matter; it becomes
  your reason to stop inquiring.


  Thesis: erosion of understanding tracks authority offloading, not the other two.
  Losing the ability to do the task yourself is a change in competence. Understanding
  is eroded when you''re no longer in a position to evaluate, and that turns on whether
  you''ve handed over authority, not on whether you can do the arithmetic.


  Question (20 points). Two junior doctors, same ward, same sepsis-risk model.


  Dr A: reads the chart herself first, writes down her own read, then looks at the
  model''s score. If they diverge she goes and digs into why.


  Dr B: opens the model''s score first. She doesn''t know what features it weighs
  and couldn''t reproduce the number. Unless something about the patient obviously
  clashes with the score, she goes with the score and moves on.


  (a) For each doctor, which category or categories of offloading is in play? Justify.

  (b) On the handout''s account, does either doctor show erosion of understanding?
  Why?

  (c) Does the handout''s thesis imply that Dr A''s arrangement is epistemically better
  overall? Explain.


  Student''s answer:


  (a) Dr A is task offloading. She can read the chart herself and she does, so she''s
  just delegating a step she''s already able to do, and she keeps her own read as
  a check on the model. Dr B is verification offloading. The model is proprietary,
  she can''t reproduce the number and has no independent way to check it, so she has
  no way of catching it if it''s wrong. And since she can''t check it, she''s handed
  over authority as well — if you can''t check a claim you''ve got no option but to
  accept it. So B is really in two categories at once, or maybe verification offloading
  with authority offloading as a consequence.


  (b) B shows erosion, A doesn''t. B''s confidence in the score is borrowed: switch
  the model off tomorrow and there''s nothing left holding her judgement up. A''s
  confidence is earned, because she formed it herself before she saw the score, so
  the model can''t be doing the work for her. Erosion, on the handout, is about where
  the confidence is coming from, and B''s is coming from the machine.


  (c) Not really, and I think the handout''s thesis is supposed to show why. Erosion
  tracks authority offloading, A isn''t doing authority offloading, so A''s arrangement
  is epistemically fine. Task offloading doesn''t cost anything as long as you can
  still check the output — the handout says the categories are different in kind,
  so once you''re in the first one you''re not paying the price attached to the third.
  I suppose A can catch the model''s errors and B can''t, but that''s a point about
