  My thesis, in the form I will present it: The reference class problem is usually
  posed as a question about which class is objectively the right one for a given individual
  — and posed that way it is insoluble, which is why people conclude that direct inference
  is incoherent and that all reference-class choices are ultimately arbitrary. I argue
  that this is the wrong framing. The problem is not about correctness but about entitlement:
  which classes an agent is entitled to use. I propose a single constraint, which
  I call ex ante availability: a reference class may be used to fix the probability
  of an outcome for an individual only if the agent could have specified the class
  and its associated statistics before learning the outcome in the case at hand. I
  then argue (a) that this constraint is what does the real work in the standard objections
  to frequentist direct inference, (b) that it survives in Bayesian dress, since exchangeability
  does not tell you which partition to be exchangeable over, and (c) that the legal
  ''naked statistical evidence'' cases and the fairness-auditing cases are the same
  problem wearing different clothes. I want to insist that the constraint is not just
  a demand for preregistration.


