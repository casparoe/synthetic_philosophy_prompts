  The move: both sides are asking a yes/no question (''does it have the real thing
  or the borrowed kind?'') when the interesting quantity is continuous. Proposal:
  original intentionality = how well a system''s internal states keep playing the
  same representational role across interventions on the world, not just on the inputs.
  The two-bitser that maps coin signatures to ''dispense'' loses its ''belief that
  this is a quarter'' the instant you swap the coin''s alloy or jam a slug in — its
  internal state is pinned to the sensor reading, and any world-intervention that
  leaves the reading fixed while changing the fact destroys the representation. That''s
  what ''derived'' means, spelled out: the mapping from state to world-fact is stipulated
  by us, so it holds only where our stipulation happens to be right. A thermostat
  is the same story one level up — put a lamp by it and it ''believes'' it''s 40 degrees.
  Meanwhile a system trained only on sunny photos that still says dog under a strobe,
  in a mirror, in a costume, has states whose representational role is held in place
  by something other than our stipulation. Searle wants a line, Dennett wants no line;
  I say it''s a gradient and the gradient is set by intervention-robustness. Bonus:
  it tells you where to look — at the fragile middle of the gradient, not at the endpoints
  where everyone agrees.


