  judgments about what may be said — whether a term belongs in a classroom, whether
  a speaker may use a reclaimed form, whether a target is entitled to object — so
  adequacy is relative to guiding those judgments, not to completeness for its own
  sake.


  I care about at least the following axes, and I want you to argue each one in or
  out rather than take it as given:


  - Co-extensionality: a slur and its neutral counterpart appear to pick out the same
  class, so whatever divides them cannot be reference or descriptive content. Does
