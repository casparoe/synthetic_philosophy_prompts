  with Mises but added that the problem is not just prices but the dispersion of knowledge:
  the knowledge relevant to economic decisions is held in fragments by many individuals
  and cannot be centralized. Lange responded with a market-socialist model. In Lange''s
  model, the Central Planning Board sets prices for capital goods and consumer goods,
  and factories are told to follow two rules: produce at minimum average cost, and
  set output where marginal cost equals price. If there are shortages or surpluses,
  the CPB adjusts prices by trial and error, just like a Walrasian auctioneer. Over
  time, the price system converges to a general equilibrium. This solves the calculation
  problem because the CPB does not need to know everyone''s preferences or technologies
  in advance; it can discover them through the trial-and-error process. The model
  also solves the incentive problem by giving managers bonuses for following the rules.
  Hayek''s later work on tacit knowledge is important, but Lange''s model can accommodate
  it because the CPB can learn from the responses of firms and consumers. The main
  weakness of Lange''s model is political: in practice, a real CPB would be captured
