  in dense cities. So the aggregate is confounded by city density.


  But wait: If new algorithm is worse in both strata, then the aggregate difference
  is entirely due to confounding. The true causal effect, if city density is the only
  confounder and the strata are homogeneous, is that the algorithm increases wait
  time by 0.3 in dense and 0.25 in sparse. The overall causal effect would be a weighted
  average of these, depending on the target population. For the current mix (800 new
  in dense, 200 in sparse), the effect on the treated is 0.8*0.3 + 0.2*0.25 = 0.24
  + 0.05 = 0.29 min increase. But the observed difference is -0.46 (new faster). So
  the confounding is strong. This is a good teaching point.


  Now, the question asks: "Suppose the company wants to decide whether to roll out
  the algorithm in a new, dense city. Which number is more relevant?" The dense-city
  stratum estimate (+0.30 min) is more relevant, assuming the new city is similar
  to the dense cities in the study and the effect is transportable. The aggregate
  is misleading because the new city''s density distribution is not the same as the
  study''s overall mix. The assumptions: no other confounders, the dense-city effect
  is homogeneous, the new city is exchangeable with the study''s dense cities, etc.


  For the mediator part: "The new algorithm increases driver acceptance rate, and
  higher acceptance rate reduces wait time." This suggests a causal chain: algorithm
  -> acceptance -> wait. So acceptance rate is a mediator. If you adjust for it (stratify
  or regress on it), you block the indirect effect and estimate only the direct effect
  (if any). If the question is the total effect of the algorithm, you should not adjust
  for it. If you want to understand the mechanism, you might adjust. This is a standard
  point.


  For the philosophical part: "What does this case show about the idea that there
  is a single true effect of the algorithm?" It shows that the effect depends on the
  causal question, the target population, and the causal model. There is no effect
  simpliciter; there is an effect relative to a contrast, a population, and a set
  of assumptions. The data alone cannot tell you which effect is the right one; you
  need a causal question and a model. This is a good philosophical point.


  The marking scheme can have 5 must-hit points, each 4 marks. Typical errors: (1)
  thinking stratification always fixes confounding, or that the aggregate is simply
  wrong; (2) confusing correlation with causation or ignoring the confounding by city
  density; (3) choosing the aggregate because it uses more data, or failing to consider
  target population; (4) thinking acceptance rate is a confounder and should always
  be adjusted for, or confusing mediator with confounder; (5) claiming there is no
  fact of the matter or that all effects are equally valid, rather than effects being
  relative to a well-specified causal question.


