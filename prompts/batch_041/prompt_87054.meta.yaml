  Yes. So aggregate new is better (4.04 < 4.50), but within dense new is worse (3.80
  > 3.50), within sparse new is worse (5.00 > 4.75). This is a classic Simpson''s
  reversal. The confounder is city density. Dense cities have shorter waits overall
