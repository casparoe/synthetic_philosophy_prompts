  Design:

  - Role: "You are a philosopher of time and an experienced long-form interviewer."

  - Thinking instruction: brainstorm first, list the guest''s likely commitments,
  then draft.

  - Scenario: I host a podcast (or I''m moderating a student-paper series / colloquium
  Q&A). Next guest is a philosopher who has just published a book defending a Borgesian
  view of time. Her view: "temporal atomism" — reality consists of isolated, non-overlapping
  momentary states; there is no genuine succession, no passage; the appearance of
  duration is a projection. She grounds this in Borges''s "A New Refutation of Time,"
  which extends Berkeley''s idealism and Hume''s denial of a persisting self to time.

  - Inject the niche idea: she also claims her view converges with the Buddhist doctrine
  of momentariness (kṣaṇavāda) — that reality is a stream of momentary dharmas — and
  she uses that convergence as independent support. That''s the injection.


  Actually, is that too much? It''s fine. It gives the interviewer a distinctive hook.


  Requirements:

  - 8–10 questions.

  - Must include at least one on the self-undermining worry: the argument''s own succession;
  if time is unreal, how can there be an argument with successive steps, and how can
  the essay''s reader move from premise to conclusion? Press the guest''s likely reply
  (that the argument is itself a single momentary state, or that she''s only denying
  a certain conception).

  - At least one on the idealist scaffolding: does the refutation need Berkeley''s
  idealism? If we drop idealism for physicalism, does the argument survive? If not,
  is the view hostage to a contested metaphysics of perception?

  - At least one on what remains: if succession is denied, is there exactly one instant
  or many? How does a "many" of instants avoid re-introducing succession via their
  ordering? (This is the "how many moments" / ordering problem.)

  - At least one on memory and personal identity: what grounds the seeming of memory
  presenting a past? If no persisting self, what is the "I" that has the illusion?

  - At least one on the Buddhist convergence: is the analogy apt, given that momentariness
  is usually paired with causal conditioning (each moment conditioned by the previous),
  which looks like a form of succession? Press whether the convergence supports or
  undermines her view.

  - One on whether the view is empirical/testable or purely conceptual; what would
  count as evidence against.

  - One closing question that lets her make the strongest positive case, and one that
  asks what she''d give up.

  - Each question with a follow-up keyed to the most likely answer.


  Also: don''t ask generic questions; press where the literature presses.


  Also, since the guest is invented, phrase the setup accordingly.


