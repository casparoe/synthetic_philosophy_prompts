  Facts about algorithmic fairness impossibility:

  - Kleinberg, Mullainathan, Raghavan (2016, "Inherent Trade-Offs in the Fair Determination
  of Risk Scores") proved that calibration within groups + balance for negative class
  + balance for positive class can''t all hold simultaneously (except in trivial cases
  / when base rates equal or perfect prediction).

  - Chouldechova (2017, "Fair prediction with disparate impact") showed COMPAS-type:
  when base rates differ, a calibrated risk score cannot have equal false positive
  and false negative rates across groups. Actually her result: predictive parity (PPV
  equal) + equal FPR + equal FNR can''t co-hold with unequal prevalence, unless the
  score is perfect.

  - These are consistent (Friedler et al. and others noted the "incompatibility" family).
  The conditions for escape: equal base rates, perfect prediction, or relaxing one
  criterion.

  - Related: Hardt, Price, Srebro "Equality of Opportunity in Supervised Learning"
  — equalized odds.

  - Dwork et al. "Fairness Through Awareness" — individual fairness, Lipschitz condition.

  - The results are for binary classification with a real-valued score.

  - Note: the results don''t say no algorithm can be fair; they say you can''t have
  all of a certain list of group-fairness criteria.

  - Also "fairness" is a family of definitions (20+ definitions in the literature;
  Narayanan''s tutorial lists ~21), many of which are mutually incompatible — that''s
  a broader point.

  - Also the "fairness vs. accuracy" framing: there''s a separate literature (Corbett-Davies
  et al.) arguing that in some cases you can improve both; and the claim that the
  impossibility is about "fairness vs. accuracy" is a misdescription — it''s fairness
  vs. fairness.

  - Also: the impossibility results often assume the *same* classifier is used and
  that the score is a sufficient statistic; and they concern *predictive* notions,
  not the *allocation* decision. The decision-theoretic layer (what you do with the
  score) is where you can be fair even if the score isn''t.

  - Another escape: use of randomized classifiers — actually equalized odds can be
  achieved by randomization (Hardt et al. give a post-processing scheme). But that
  doesn''t get you calibration + equalized odds.

  - Another escape: change the label/target (e.g., predict something other than recidivism;
  or predict "failure to appear" vs "new arrest").

  - Another: reject the "group" framing — individual fairness, or "fairness as the
  absence of the construct" (e.g., don''t use criminal history at all).

  - Another: the "construct validity" critique (Jacobs & Wallach) — maybe the problem
  is that the target variable is bad.


