  fire is followed by burning; he denies that fire is the agent. He is not a skeptic
  about causality; he is a theological occasionalist. He also holds kasb (acquisition):
  human actions are created by God but acquired by humans, so humans have a kind of
  moral responsibility. So the summary error: "he denies that human actions are genuinely
