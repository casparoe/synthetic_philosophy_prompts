  Fitch''s paradox: Knowability principle: All truths are knowable. Proof: Suppose
  p is an unknown truth: p ∧ ¬Kp. By knowability, it''s possible to know p ∧ ¬Kp.
  But knowledge distributes over conjunction, so K(p ∧ ¬Kp) entails Kp ∧ K¬Kp, and
  K¬Kp entails ¬Kp. Contradiction. Therefore no unknown truths; all truths are known.
  The proof uses factivity of knowledge and distributivity. The teaching challenge:
  non-specialists may confuse "knowable" with "known," possibility with actuality,
  and the role of the contradiction. Misconceptions: "the proof assumes omniscience,"
  "knowability means someone actually knows," "the paradox only works for ideal agents,"
  "it''s a trick with self-reference." A good teaching plan would sequence: distinguish
  truth from knowledge; introduce factivity; introduce the possibility operator and
  the knowability principle; introduce the concept of an unknown truth; then the proof;
  then diagnose. The carrying example: perhaps "a particular page of a lost diary"
  or "the number of hairs on Caesar''s head at noon on his 30th birthday" — a truth
  no one will ever know. But that''s not new.


