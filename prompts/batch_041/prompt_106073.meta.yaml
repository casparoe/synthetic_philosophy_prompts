  Potential prompt:


  I am currently taking a seminar on African philosophy and relational personhood,
  and our unit on ubuntu has left me with a formal problem I would like you to solve
  in verse. We have been distinguishing a weak relational thesis, on which relations
  merely enable or shape an independently existing self, from a strong relational
  thesis, on which relations constitute the self, so that personhood is something
  conferred and sustained between people rather than possessed privately. I want a
  villanelle that makes the strong thesis vivid without letting it collapse into the
  idea that the community can simply decide who counts as a person. The two refrains
  should be lines of your own—do not quote anyone—that express, respectively, the
  priority of the community in constituting the person and the priority of the person''s
  own response in sustaining the community. As the poem proceeds, each refrain should
  be infected by the other, so that by the closing quatrain they can sit side by side
  without being reconciled. The turn I want the form to enact is the moment the gift
  of recognition becomes indistinguishable from the power to withhold it: the same
  relational constitution that grounds the demand to recognize others also seems to
  give the community authority over the dissenter, the exile, and the one whose identity
  the community refuses to affirm. The poem should not resolve that worry; it should
  leave the reader with both the ethical promise of relational personhood and the
  internal critique that relational personhood may license conformity. Aim for a villanelle
  in strict form (five tercets and a closing quatrain, with the two refrains returning
  and meeting in the last two lines), and make sure the philosophical content does
  structural work: someone who knows the debate should be able to tell which refrain
  is which and why the form keeps them circling. Do not include citations or references
  to specific authors; I want the poem to stand on its own. After the poem, on a new
  line, give a one-sentence summary beginning Summary: that names the formal feature
  and the philosophical tension it tracks.


