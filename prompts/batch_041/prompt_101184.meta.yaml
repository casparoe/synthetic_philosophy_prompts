  is untestable in principle; (ii) the charge that it is testable but not uniquely
  supported, i.e. that it is one explanation among many compatible with the same data;
  and (iii) the charge that even a well-supported hypothesis is not the same thing
  as a demonstrated history of selection, because showing that a trait currently does
