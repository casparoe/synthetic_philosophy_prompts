  Draft:


  "I am a novelist, some way into a book set in sixteenth-century Brazil, and I have
  been reading Montaigne''s essay on the cannibals as I work. Before I commit to a
  structure I would like an audit of the position I have talked myself into, because
  I suspect it will not hold.


  Here is what I believe:

  (1) Moral judgment is internal to a form of life. I do not think there is a standpoint
  outside a people''s own customs from which those customs can be assessed; Montaigne''s
  remark that we call a practice barbarous only because it is not ours strikes me
  as the last word on the subject.

  (2) The conquest of the Americas was a moral catastrophe, and my book is meant as
  an indictment — of the enslavement, the forced baptisms, the men who burned their
  neighbours alive in the name of religion at home and abroad.

  (3) The narration must never editorialize. The reader should inhabit the war-captive
  ritual as the participants understood it, and never once hear the author explaining
  how to feel about it.

  (4) A novel that renders atrocity beautifully is complicit in it. Whatever else
  the prose does, it must not aestheticize the killing.

  (5) The novelist''s obligation is to the dead as they understood themselves — to
  the captive''s own sense that he was dying well, to the honour in it — not to what
  would make these people legible or sympathetic to a modern reader. Anachronism is
  the one sin I will not forgive myself.

  (6) Fiction is a better instrument than argument for making a reader see a foreign
  practice from the inside; that conviction is the only reason I am writing a novel
  rather than an essay.


  Which of these actually pull against one another, which pairs only appear to, and
  which single concession would reconcile the rest? Rank the real tensions by severity
  and tell me what each would cost me, not least as a novelist. I have no idea which
  of them I would surrender first, and I would rather find out now."


