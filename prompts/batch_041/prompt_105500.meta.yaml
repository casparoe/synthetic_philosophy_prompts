  Potential prompt:


  "I run the employee-relations intake desk at a mid-size company, and a big part
  of my week is triaging complaints about things people said to each other in Slack,
  email, and meetings. Legal wants us to stop calling everything ''harassment'' or
  ''not harassment'' and instead figure out what kind of speech act actually happened:
  was it an instruction, a request, a promise, a warning, a threat, an apology, a
  resignation, a joke, a prediction, or just an expression of frustration? The difference
  matters because it changes whether we open a case, whether we tell a manager to
  follow up, whether we treat someone as having committed to something, and whether
  we have to loop in Legal. I''ve read enough Austin and Searle to know that the same
  sentence can have different illocutionary force depending on context, uptake, and
  felicity conditions, but I need something a non-philosopher on my team can actually
  run in about twenty minutes per complaint, with a written rationale that will survive
  a review by our employment lawyer. We handle maybe forty of these a week, and the
  stakes are high: a wrong call can mean someone gets disciplined for a joke or, worse,
  a real threat gets filed as ''venting.''"


  Then ask: "Please write me a decision procedure, in order, that starts from the
  raw message and the surrounding thread, and ends with a classification plus a confidence
  level and a recommended action. It should make clear which questions are about the
  speaker''s intent, which are about what a reasonable hearer would take them to be
  doing, and which are about whether the institution recognizes the act -- e.g., can
  a junior employee ''resign'' in a Slack DM, can a manager ''promise'' a promotion,
  can an apology without acknowledgment of harm count as an apology. Include the tests
  my team should run, what counts as sufficient evidence for each, where the procedure
  stops with a no, and where it has to hand the decision to a human because it''s
  a values call or a legal call. Then run it on three cases: (1) a manager writes
  ''we should probably fix this before Friday'' in a thread where the team has missed
  two deadlines; (2) an employee writes ''if you bring that up in the all-hands again,
  I''m done'' to a coworker after a conflict; (3) a director writes ''I''m sorry you
  feel that way'' in a public channel after being told their comment was hurtful.
  For each, show the procedure''s classification, its confidence, and the action.
  Finally, tell me where the procedure will misfire -- sarcasm, neurodivergent literal
  reading, cross-cultural indirectness, jokes that are only jokes in-group -- and
  which parts of Austin/Searle you had to drop to make it usable. Don''t give me a
  bibliography or citations; I just need the procedure and the reasoning."


