  I''m a retired field ecologist — spent 35 years at a small research station before
  I hung it up — and I''ve gotten deep into philosophy in the last few years, mostly
  because I finally have the time. Anyway, the station is coming up on its 80th year
  and they''ve asked me to chair the committee writing the history. Five of us, meeting
  monthly, document goes public next spring. The tricky part: it''s not a clean story.
  There''s the founding generation everyone loves, there''s a long stretch of work
  that looks like pure accumulation, and then there''s the 1960s-80s stuff where some
  of our data got picked up by agencies and used in ways that did real harm to people
  who lived where we worked, and a couple of researchers whose results nobody can
  reproduce now.


  I keep coming back to that Nietzsche essay where he splits history into monumental,
  antiquarian and critical — I''m sure you know the one. What I want is a procedure
  my committee can actually run, episode by episode, to decide how we tell each one.
  Concretely: the questions to ask in order, what counts as a good enough answer at
  each step, where the procedure stops and delivers a verdict, and where it hands
  off to a human because the call is a value judgment and not a fact we can settle.


  Three things I want it to handle, because they''re the ones we keep arguing about.
  First, an episode often seems to want two modes at once — we want the founding era
  told monumentally because it recruits people, and we want the bad years told critically
  because that''s the whole point of doing this honestly. I want the procedure to
  say when telling the same episode twice, in two registers, is legitimate and when
  it''s just having it both ways. Second, I''ve got a suspicion that each mode has
  a failure mode that only shows up when you ask who the history is for, and I''d
  like that built in rather than bolted on. Third, the committee is not neutral —
  half of us worked there during the bad years — so tell me where self-interest disqualifies
  someone and where it''s actually a qualification.


  Then run it on three episodes: the founding generation, the contested results, and
  the agency use. I want at least one where the procedure tells me something I don''t
  want to hear, and I want you to tell me straight what this procedure can''t do —
  where it''ll misfire or where it''s just a flowchart pretending to be a method.


  Don''t hand me a menu of options and let me choose. Commit: tell me the procedure
  you''d actually defend, and make the hard calls yourself.


