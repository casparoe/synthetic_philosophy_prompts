  Continue:


  The natural reply is that the disanalogy is total: in the state of nature, interactions
  are repeated and the parties are stuck with each other; in space, the first interaction
  is also the last, because one side is gone at the end of it. There is no shadow
  of the future across light-years. I think this reply is strong, and I think it''s
  stronger than the people who make it realize, because it doesn''t just limit the
  dark forest — it dissolves it. The dark forest requires a *population* of civilizations
  playing a *game* with a *shared strategy*, and none of those three things can exist
  across a galaxy that is too big for a single strategic horizon. There''s no common
  knowledge, no way to know that anyone else is playing the same game, no way to know
  what "the equilibrium" is. What you''d actually expect, if the local conditions
  for paranoid first-strike exist at all, is not a uniform forest but a patchwork:
  local clusters where the logic bites and a large majority of the volume where nobody
  has ever had to think about it. Silence would then be the default for boring reasons,
  and the dark forest would be a rare local pathology rather than the explanation
  of the sky.


