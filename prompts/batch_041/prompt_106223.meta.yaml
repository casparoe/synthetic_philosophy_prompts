  Essay draft:


  I''ve been turning over the dark forest argument for years, and I''ve come to think
  that almost all of the discussion of it is aimed at the wrong target. The usual
  objection is empirical: the sky might be silent for a dozen reasons — life is rare,
  intelligence is rarer, expansion is slow, the window is short, they''re here and
  we''re not looking properly. All of that is true and all of it is beside the point,
  because the dark forest was never an inference from the sky. It''s an inference
  from the structure of a strategic situation. The sky is decoration.


  What the argument actually says: (i) communication is slow and detection is passive,
  so you cannot verify anyone''s intentions before they can act on yours; (ii) the
  costs of being wrong in the direction of trust are unbounded, while the costs of
  being wrong in the direction of suspicion are merely foregone gains; (iii) there
  is no third party to enforce an agreement. Given those three, the argument says,
  the dominant strategy is to destroy anything you detect and to reveal nothing. And
  the reason the sky is quiet is that everyone is doing this.


  Now notice what that structure is. It''s the state of nature. It''s Hobbes: no common
  power, no reliable knowledge of others'' intentions, unbounded downside to being
  wrong, and a rational strategy of anticipatory violence. The dark forest is not
  a hypothesis about aliens. It''s the oldest argument in political philosophy, run
  in a setting where the anarchists can''t appeal to the fact that people have to
  live together afterwards. Which means its fate should be settled by the same arguments
  that settle the state of nature — and those arguments are not all on Hobbes''s side.
  Stateless societies are not perpetual wars of all against all; they are full of
  institutions: kinship, gift exchange, ritual, hostage-taking, third-party mediation,
  reputation. The war of all against all is rare not because people are good but because
  fighting is expensive and the shadow of the future is long. If you think the dark
  forest follows from "no common power", you should also think that the !Kung live
  in a dark forest, and they don''t.


