  The idea. Turing, in the 1950 paper that introduced the imitation game, ends by
  suggesting that instead of trying to program an adult mind directly, we might build
  a machine that starts out like a child and then educate it; and in an earlier report
  on machine intelligence he had sketched networks of simple logical units, wired
  up more or less at random, which would be ''organised'' by having their connections
  altered rather than programmed by hand. The usual reading treats this as a charming
  piece of foreshadowing — the child machine as a quaint ancestor of gradient descent
  on a big model. I think that reading flattens three separable claims that the education
  metaphor is carrying, and that only the third is philosophically live:


  1. An innateness claim: the child machine must already come with the right architecture
  and priors, because you cannot educate a blank slate into an adult.

  2. A curriculum claim: learning should proceed through graded, staged experience
  rather than raw exposure to everything at once.

  3. A relational/normative claim: education, as opposed to mere training, involves
  authority, discipline, and the cultivation of initiative and character — the teacher
  is a parent, not a reward channel, and part of what is transmitted is not information
  but a stance.


  The third is the one with no obvious counterpart in current practice, and it is
  the one I want to press on. My suspicion is that the education metaphor either (a)
  is doing real work — it picks out a class of design constraints (about the teacher-learner
  relation, about what must be shared for teaching to be possible, about why ''reward''
  is not the same as ''approval'') that ''training'' obscures and that matter for
  how we should think about aligning a system — or (b) evaporates the moment you specify
  the mechanics, in which case saying a machine is ''educated'' rather than ''trained''
  is a piece of anthropomorphic framing with no content, and the rationalist habit
  of talking about ''raising'' an AI should be retired.


  What I want from the proposal:

  - A question stated precisely enough that it could have a determinate answer. Something
  like: does the distinction between educating and training a machine mark a real
  distinction in the design space, or is it an artifact of the metaphor? Make it sharp;
  if the honest version is really two or three questions, say so and say which is
  the load-bearing one.

  - Why the standard answers leave it open: what the ''just engineering'' reading
  of the child machine gets right, what the ''it''s all anthropomorphism'' reading
  gets right, and why neither settles it. This is the part I most need help with,
  since I have been going back and forth.

  - The method: what I would actually do, month by month over six months, working
  alone and part-time, with no lab and no experiments — this is conceptual and historical
  work, so the method has to be argument and close reading, not data. Be concrete
  about what a month of this looks like.

  - What a result would look like, and what would count as the project failing — including
  the honest possibility that the answer is ''it''s just a metaphor'' and that this
  is itself worth a short paper.

  - Scope: whether six months part-time is enough, and if not, what to cut.


