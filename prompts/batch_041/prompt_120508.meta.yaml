  Draft:


  I''m in a seminar on self-reference and the mind, and we''ve just finished Hofstadter''s
  Gödel, Escher, Bach. For my final paper I want to take seriously an argument a classmate
  reconstructed for us, which I can''t shake and also can''t accept. It runs like
  this.


  (1) For any consistent formal system S that is rich enough to express arithmetic,
  Gödel''s first incompleteness theorem gives a sentence G_S such that S proves neither
  G_S nor its negation. If S is consistent, G_S is true — it says, in effect, that
  S does not prove it.

  (2) Anyone who understands S — who can survey its axioms and rules and see that
  they are sound — can see that S will never prove G_S, and therefore can see that
  G_S is true.

  (3) So whoever understands S knows something S cannot prove. If a mind were "just"
  the formal system S, this would be impossible: the mind would prove something it
  cannot prove. Hence the mind is not S. Since S was arbitrary, no formal system is
  the mind.

  (4) It is no help to say the mind is a bigger system S′. Give the mind all the systems
  it now uses, take their union, add whatever sound reflection principles it can certify
  — call the result S″. The same argument applies to S″. Each time the mind closes
  the loop, it finds another Gödel sentence outside it. This is the strange loop climbing
  its own hierarchy, and it never settles.

  (5) But nothing in steps (2)–(4) mentions minds in particular. Any entity that represents
  — a person, a research community, a corporation, a program that models itself, a
