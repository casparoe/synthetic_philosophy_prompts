  Idea: "The Reversible Gas." Room with ~20 people, 90 minutes. Grid of a room (masking
  tape squares or a sheet of paper). Each participant is a "molecule" occupying a
  square, with one of 4 diagonal velocity arrows. Rule: simultaneously, everyone moves
  one square along their arrow and bounces off walls/others by a deterministic rule.
  This is a reversible cellular automaton (like a hard-sphere lattice gas, the "billiard
  ball model" of computation — Fredkin-Toffoli). Start from a state where all molecules
  are in one corner (low entropy). Run forward 20 steps: they spread out. Then ask:
  reverse all velocities and run again — they return to the corner. That''s Loschmidt''s
  reversibility objection, staged live.


