  I teach a 75-minute session in an upper-level undergraduate course on time and thermodynamics
  (or metaphysics of science); the group is about 18 students, and the room has a
  whiteboard, masking tape, index cards, and a deck of cards but no computers. I want
  a runnable activity, not a demonstration, in which the students themselves are the
  micro-constituents of a physical system and are made to run into the following situation:
  the microdynamics they are executing are exactly reversible — they can run the system
  backwards — and yet the macroscopic behavior they produce is not, and the asymmetry
  they eventually locate is not in the rules but in the boundary condition at one
  end. They should also be made to feel, on their own pulses, why the fact that they
  remember the past and not the future cannot be used to break the tie, since their
  memories are on one side of the very boundary condition at issue. Do not name the
  past hypothesis, the reversibility objection, or the double-standard objection until
  the debrief.


  Constraints:

  - The activity must be runnable with the listed materials, by one facilitator, in
  75 minutes.

  - The microdynamics must be a genuinely invertible map on the microstate: whatever
  update rule you choose, the facilitator and students must be able to execute it
  in reverse and land on the exact starting state. Do not assume a naive simultaneous-move
  rule with collisions is invertible; either specify the update scheme so that invertibility
  is exact and say how you know, or use a permutation-of-a-state-space scheme (a fixed
  invertible shuffle) instead. Sketch a lattice-gas-style default (students as particles
  on a taped grid, holding cards bearing directions) and give the permutation scheme
  as a fallback if the physical version proves ambiguous.

  - The students must at some point be required to bet or commit, individually and
  blind, on which of two given snapshots came "later," with some snapshots drawn from
  runs whose special low-entropy condition sits at the other end. Their heuristic
  ("more spread out = later") must fail on a substantial minority of items, and the
  failures must be the hinge of the debrief.

  - The system must start from a state everyone can agree is "orderly" and end in
  a state everyone can agree is "disorderly," without the facilitator telling them
  which is which.

  - No lecture up front.


  Deliver: a timeline with phase-by-phase minutes; the exact materials and setup;
  the update rule written out precisely enough to execute, with a check on its invertibility;
  the betting round''s items and scoring; the debrief mapping each phase onto a component
  of the analysis (the symmetry of the laws; the specialness of the initial condition;
  the counting/typicality basis of entropy increase; the fact that the reversal itself
  constructs an extraordinarily special microstate; the direction-of-inference point
  about records and memory); and an honest note on what the activity cannot reproduce
  (at minimum: the measure-theoretic justification for calling entropy increase "typical,"
  the cosmological question of why the boundary condition is what it is, the fact
  that a 20-particle system will show fluctuations and recurrences that a 10^23-particle
  system will not, and the difference between statistical typicality and the practical
  impossibility of fine control). Also tell me what will predictably go wrong the
  first time I run it, including at least: the failure mode of the collision bookkeeping;
  the students who will call the reversal a cheat and how to use rather than defuse
  that; and what to do if the betting round turns out to be too easy.


