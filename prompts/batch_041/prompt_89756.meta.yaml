  Prompt:


  I am a philosophy professor preparing a seminar on personal identity and modality,
  and I want to use a reflective-equilibrium exercise rather than a literature review.
  I have a set of verdicts about whether a person could have had a different origin,
  and I want to know what principle, if any, captures them.


  My verdicts:


  1. The person I am now could not have come from a different sperm and egg. If a
  different sperm had fertilized the egg my mother actually contributed, that would
  have been a different person, a sibling, not me.

  2. I could have come from the same sperm and egg but been carried in a different
  uterus, or in an artificial womb. The gestational environment is not part of what
  makes me me.

  3. I could not have come from the same egg and a different sperm, nor from the same
  sperm and a different egg. Both gametes seem essential.

  4. If the zygote that became me had split and produced an identical twin, that twin
  would not be me. My twin and I would share a genome and, in some sense, a zygote,
  but we are numerically distinct people.

  5. If my embryo had been edited before implantation to change a gene for eye color,
  I would still be me. A small genetic alteration does not replace the person.

  6. If a clone were made from one of my cells, with my nuclear genome placed in a
  donor egg, the clone would not be me. Same genome, different origin, different person.

  7. If an embryo formed from a different sperm and egg were edited to have a genome
  exactly like mine, that embryo would still not be me. It would be a duplicate, not
  me.

  8. If I had been formed from two embryos that fused into a chimera, I am less sure.
  Suppose the chimera has two cell lines, one of which would have become me and one
  of which would have become a sibling. Is the chimera me, or us, or someone else?
  My tentative verdict is that the chimera is a single person, but not simply me,
  because the second cell line contributes to the body and mind. Yet I also think
  that if one of the two embryos had simply died and the other had developed, I would
  be that survivor. I cannot get these two verdicts to sit comfortably together.


  What I want: a principle, or a small set of candidate principles, that states precisely
  what is essential to a person''s origin and why. It should say what is doing the
  work in the cases above: the exact gametes, the exact zygote, the exact cell lineage,
  the genome, causal continuity, or something else. It should tell me what it implies
  for cases I have not listed, for example: a person conceived with donor mitochondria;
  a person whose embryo was split and one half frozen for years; a person created
  by cloning who is then genetically edited; a person whose original zygote would
  have twinned but did not. It should also be honest about which of my verdicts it
  cannot accommodate and what I would have to give up if I keep the principle. If
  the verdicts cannot all be saved by one principle, I would rather see the simplest
  principle that saves most of them, with the cost stated, than a complicated principle
  that saves all of them by gerrymandering.


  Finally, please say how confident you are in the principle you propose, and single
  out the point in your answer you are least sure about.


