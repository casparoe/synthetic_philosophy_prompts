  Key substantive points for the audit:

  - Szasz''s target: the claim that "mental illness" is a disease in the same sense
  as bodily disease, i.e., a deviation from a bodily/normative standard detectable
  independent of social norms. He called it a "myth" in the sense of a metaphor taken
  literally / a disguised statement about living, not a claim that people don''t suffer.

  - He distinguished "mental illness" (the conceptual claim) from the fact that people
  have problems in living. Also he allowed that some conditions labeled mental illness
  have brain disease (he was not a blanket denier of e.g. neurology; he thought genuine
  brain disease should be called brain disease, e.g., he was fine with calling syphilitic
  general paresis a brain disease).

  - His politics: libertarian, anti-coercion; he opposed involuntary commitment and
  the insanity defense (he thought the insanity defense should be abolished, and that
  it''s a way of excusing). He opposed the "therapeutic state."

  - He did not oppose voluntary psychotherapy; he was a psychoanalyst himself.

  - Common misreadings: (a) "Szasz said mental illness doesn''t exist, so schizophrenia
  is a myth and patients are faking/malingering"; (b) "Szasz opposed all psychiatry
  and all treatment"; (c) "Szasz thought mental illness is a myth because he was a
  Scientologist" (false); (d) conflation: "the myth of mental illness" (a claim about
  the concept''s logical status) vs "the myth of mental illness" meaning mental illness
  is not real in the sense that the suffering is not real.

  - Another subtle point: Szasz''s argument is that the concept is used to justify
  coercion; the "myth" is functional — it legitimizes the psychiatrist''s power. Some
  critics (e.g., in philosophy of psychiatry) say his argument conflates the conceptual
  claim with the political one, or that he relies on a naive disease concept (a "lesion"
  criterion) which is itself contested — the biopsychosocial model, or the fact that
  many physical diagnoses are also normative (e.g., hypertension thresholds, or "injury"
  concepts). Also the "harmful dysfunction" analysis (Wakefield) as a response.

  - Also: Szasz''s claim that hysteria/conversion symptoms are "problems in living"
  and that "mental illness is a metaphor" — the metaphor claim: he says the mind is
  not a bodily organ so it can''t be diseased; disease requires a physical lesion
  in the body. Critics: this begs the question by adopting a narrow lesion-based definition
  of disease; also the "mind" is not a separate thing, so "mental" refers to behavior/social
  functioning.


