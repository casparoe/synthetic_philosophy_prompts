  ---


  I run a small reading group on concept learning that''s somehow turned into an actual
  project, and for the last few months we''ve been stuck on Bongard problems -- the
  puzzle format where you''re shown a handful of little diagrams on the left and a
  handful on the right and you have to figure out the rule that separates them, except
  that the interesting ones can''t be cracked by noticing a feature you already had;
  you have to invent a new way of describing the pictures before the rule even becomes
  visible. There''s three of us, maybe two years of part-time effort, no compute budget
  worth mentioning, so training something to solve the whole collection is off the
  table. What we''d like to walk away with is closer to a theory: when does a concept
  genuinely require re-representation instead of just reweighting, and can that distinction
  be made precise enough to argue about. Which is why I''m asking you rather than
  just diving in -- we keep disagreeing about which of our questions is the load-bearing
  one, and I suspect we''re working on things that are downstream of something we
  haven''t noticed.


  So what I want is a defended agenda, not a survey. Take the open questions in this
  area and tell me which ones matter most for a group like ours, in order, and why:
  which are upstream of which (does the ambiguity question have to be settled before
  the difficulty question even makes sense?), which are actually tractable for three
  people with two years and no big models, which are neglected vs. which just look
  neglected, and which are the ones that seem deep but would eat our time for nothing.
  I care as much about the reasoning as the list -- the trade-offs you''re making,
  and what would have to happen in the next year or so for you to reorder it.


  Some of the things we keep going back and forth on, in case it helps: whether there''s
  a real line between a problem you solve by reweighting features you already had
  and one that forces a new primitive, or whether that''s just a fact about the solver;
  whether "difficulty" for one of these puzzles is well-defined at all, or always
  relative to a vocabulary; what to do about problems with more than one defensible
  rule, since a lot of them seem to have two or three and no obvious fact of the matter
  about the "intended" one; whether the few-examples setup is still the right frame
  now that everyone has models that have seen basically everything, or whether we''re
  studying a historical artifact; whether there''s a hierarchy of representational
  jumps and whether the ordering is stable across solvers; and whether concepts induced
  this way have any claim to being the natural ones. We''re also weirdly drawn to
  the self-referential ones, where the rule for a side refers to the puzzle itself,
  but none of us can tell if that''s a real frontier or a party trick. Tell me where
  you''d plant the flag.


  ---


