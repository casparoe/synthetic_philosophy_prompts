  Draft:


  ---


  I work as a software engineer and I don''t have any formal background in philosophy,
  but I''ve been chewing on an argument a colleague put to me over lunch and I''d
  like a poem out of it rather than an explanation. The argument goes like this. Suppose
  a number of people are each in a position to take some action on their own, without
  asking anyone, and the action affects everyone. Each person acts whenever their
  own best judgment says the action is on balance a good thing, and each person''s
  judgment is reasonable but noisy — nobody is reckless, nobody is biased, nobody
  is ignoring the others on purpose. Then the more people there are, the likelier
  it becomes that at least one of them acts on a mistaken reading of a situation that
  was actually fine, or fine to leave alone; as the number grows, the chance that
  somebody goes ahead and does damage approaches certainty. The part that makes it
  a curse rather than an ordinary coordination failure is the asymmetry: a genuinely
  good action only needs to be done once, so a sixth person able to do it adds nothing
  at all, while a damaging action only needs one person to be wrong. I''ve also heard
  a fix proposed — roughly, that you should hold off unless you''d be content for
  everyone in your position to do the same thing, or unless the group''s pooled judgment
  says go — and I''d like the poem to reach that fix without pretending it settles
  anything.


  So: a sestina. Six stanzas of six lines and a three-line envoi, with the end-words
  rotating in the standard way (each stanza''s first line ends on the previous stanza''s
  last end-word, then last, first, second-to-last, second, third-to-last, third).
  I want the end-words to be, in order, know, others, act, once, probably, harm —
  inflected forms are fine as long as the same word keeps coming back — so that the
  vocabulary of the deliberation is the same vocabulary every time and the reader
  notices it going round. Each stanza should be one person''s deliberation, run from
  the inside, and it should be the same deliberation each time: no stanza may be the
  work of a fool, and none may be a caricature of recklessness. The argument should
  be carried by the accumulation, not by any single stanza going wrong; the reader
  should end up feeling that six sensible paragraphs have added up to something none
  of the six would have chosen, and that the count is doing the work, not the character
  of the people. Somewhere in the middle the poem should make the asymmetry explicit
  — that the good outcome needs doing once and gains nothing from company, while the
  harm needs only one person — and the envoi should bring back three of the end-words
  and land on the decision, name the conformity fix in plain words, and leave open
  whether it would actually hold. Nothing else in the way of philosophy vocabulary:
  it should be readable aloud at a team lunch without anyone needing a glossary, and
  it should be accurate enough that someone who already knows the argument doesn''t
  wince — no wise-crowd cliché, no suggestion that the actors are irrational or that
  more hands make the good outcome more likely.


  Please start your reply with the title and the poem itself, and don''t put anything
  before it or after it — no preface, no notes on your choices, no explanation of
  the form.


