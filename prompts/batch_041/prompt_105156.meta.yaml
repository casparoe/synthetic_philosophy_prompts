  value systems are not fully commensurable even internally; there may be no exchange
  rate between two of my own values. Second, the parties may disagree about the baseline
  against which gains are measured. Third, the trade may be unavailable if the parties''
  value systems are not just different but antagonistic, as when one party''s core
  value is that the other party''s core value should not be pursued at all. In that
  case, compromise may be a modus vivendi rather than a mutual improvement."


