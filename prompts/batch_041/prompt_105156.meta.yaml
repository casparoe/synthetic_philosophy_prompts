  Title: Moral Compromise as Normative Arbitrage


  Essay:

  "My friend and I disagree about almost every major value. She is a committed utilitarian
  ... I am a pluralist ... We were arguing about a concrete case: whether to spend
  a windfall on a family member''s medical treatment or on effective charity. ...
  I found myself defending compromise not as a grudging split-the-difference, but
  as a genuine gain from trade. My friend said that compromise between value systems
  is just a polite word for one side buying off the other, or for both sides betraying
  their principles. I think she''s wrong, and here is my attempt to say why."


  Then: "The standard model of compromise treats values as points on a single scale.
  If we disagree about how much to spend on X vs Y, we can meet in the middle. But
  that model assumes commensurability. A better model treats each person''s value
  system as a partially ordered set with multiple dimensions, and compromise as a
  move to a point that is not on either original ranking but is not worse for either
  party under their own ranking. The gains come from differences in the marginal rates
  at which each party is willing to trade one value for another. I call this normative
  arbitrage."


  Then: "Example: my friend cares intensely about impartial welfare and mildly about
  familial partiality. I care intensely about familial partiality and mildly about
  impartial welfare. If we each make a concession on the dimension we care less about,
  we can both improve our own all-things-considered ranking. She gets a larger charity
  donation than she would have gotten if I had simply overridden her; I get a larger
  family transfer than I would have gotten if she had overridden me. Neither of us
  converts to the other''s value system. We are not splitting a fixed pie of moral
  value; we are exploiting different exchange rates between values."


  Then: "This is not the same as moral relativism. The trade is possible only if each
  party treats the other''s values as genuine constraints on what can be done, not
  as mistakes to be corrected. It also requires that the concessions be transparent:
  if I pretend to care more about impartial welfare than I do, I am not trading, I
  am manipulating. And it requires that the compromise not violate deontological side-constraints;
  some values are not currencies because treating them as tradeable is itself a violation."


