  Prompt draft:


  "I have no formal training in philosophy; I read on my own in the evenings and argue
  about this sort of thing with friends, and I''ve now spent the better part of a
  year circling one family of problems. The case that started it is the one usually
  credited to Parfit: you are stranded in the desert and dying of thirst; a driver
  appears and offers to carry you to the city if you promise to pay him a thousand
  dollars on arrival; you promise, you are saved, and once you are safe you have no
  reason whatsoever to pay — so, being a self-interested rational sort, you don''t.
  What fascinates me is the second layer: the driver can see all this coming, so the
  promise only buys your rescue if you are the kind of person who would pay anyway,
  which means your best strategy is to have a character trait that, from the standpoint
  of your post-rescue self, is a plain defect. I understand this is where people start
  talking about rational irrationality, precommitment, the toxin puzzle, and Newcomb-style
  cases, and I''ve read enough to know the terrain exists without knowing what''s
  actually still open on it.


  Two things of my own that I''d like you to treat as part of the material, not as
  digressions. First, I keep suspecting that ''be the sort of person who pays'' and
  ''arrange the world so that you cannot avoid paying'' — an escrow, a deposit held
  by a third party, a note you''ve already signed — are two different solutions wearing
  the same clothes, and that the second might dissolve the puzzle rather than solve
  it, by moving the commitment from my character to my circumstances. Second, I invented
  a variant I haven''t seen anywhere and want to know whether it''s a real contribution
  or a confusion: an insurer who, for a fee paid before the trip, guarantees the driver
  that I will pay on arrival. If I buy the policy the driver is certain of his money
  and therefore certain to rescue me; but had I been rescued I would never have needed
  the policy, so the premium looks like pure waste. Is buying it rational? Does it
  change the lesson of the original case, or just restate it?


  Here is what I actually want from you. I have roughly a year of evenings left before
  I want to write something substantial, and I would rather spend it on the questions
  that matter than re-derive what is already settled. Given that, which open questions
  in this area are most worth working on, and in what order? I am not asking for a
  reading list or a survey of who has said what — I want an agenda. For each question
  I want to know why it sits where it does: whether other questions depend on its
  answer, whether it is the kind that an untrained but stubborn person could actually
  make progress on, and whether it is being neglected or is quietly already closed.
  Where two of these criteria pull against each other, tell me how you''d trade them
  off. And tell me what would move a question up or down the ranking — what, if I
  came across it, would tell me I had the order wrong. I''d also like a verdict on
  my two additions: which of them, if either, is a genuine open question, and which
  is a restatement of something I simply haven''t read yet."


