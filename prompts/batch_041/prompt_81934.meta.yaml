  should force them to get into whether the threshold is a genuine incommensurability
  claim or just a very steep exchange rate. To keep it from being a book report, I''ve
  been using a distinction in class between the ''floor'' reading (the threshold marks
  a category change: below it the scale is cardinal and comparable, above it pleasures
  don''t even enter the ranking) and the ''cliff'' reading (there''s one scale all
  the way up, but the marginal rate at which pleasure buys off pain goes to infinity
  at the threshold). Ask them to say which reading makes better sense of the view,
  whether either can avoid arbitrariness in where the threshold sits, and what each
  implies for a case where you can either prevent a huge amount of threshold-level
  suffering for one person or give a massive but finite amount of pleasure to many
  people. Also make them address whether the view can still call itself negative utilitarian
  if it needs a positive-value scale to say what counts as compensation below the
  threshold.


