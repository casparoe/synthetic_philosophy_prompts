  Kavka''s toxin puzzle: Billionaire offers you $1M if you intend (at midnight tonight)
  to drink a toxin tomorrow that will make you ill for a day. At midnight you must
  intend; the money is paid at midnight if you intend. Then you can still choose not
  to drink. Drinking the toxin gives no benefit except the money already paid. Kavka''s
  claim: you can intend, it''s rational to intend, but you cannot rationally drink
  the toxin, and the puzzle is that you can rationally form an intention you know
  you won''t carry out.


  So a credence question: "What''s your credence that it''s possible for a rational
  agent to form the intention and collect the money?" Decompose: (1) P(intentions
  are the kind of thing that can be formed at will / by indirect means — e.g., self-deception,
  or by being the sort of agent that follows through), (2) P(that a rational agent
  with full transparency can intend to do something she knows she won''t do), (3)
  P(that the offer is even coherent / the billionaire''s payoff structure doesn''t
  undermine itself), (4) whether intention is a functional state tied to action (causal
  theory of intention / "intention is the cause of action" — the "no self-undermining
  intentions" view), (5) whether the agent can partition her mind, use precommitment
  devices, or whether "rationality" requires only that the agent be the sort that
  in the long run does well.


