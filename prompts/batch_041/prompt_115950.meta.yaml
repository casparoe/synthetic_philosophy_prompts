  Potential prompt:


  "I am a high school senior and the moderator of my school''s philosophy club. Last
  week, during a discussion of bounded rationality, two of our most careful members,
  Nadia and Eli, got into an argument that the rest of us could not resolve. I would
  like you to adjudicate it. You are an expert in decision theory, cognitive science,
  and the philosophy of rational choice; please think carefully and do not simply
  summarize the standard literature. Begin with a short brainstorm in which you distinguish
  the different things ''satisficing'' might mean—at least: a psychological description
  of how people stop searching, a heuristic for reducing deliberation costs, and a
  normative claim about what one ought to do—and then use those distinctions to evaluate
  the exchange below.


  The background: our club was considering a thought experiment about a student choosing
  a college. The student can investigate colleges one at a time; each investigation
  costs time and effort; she has no exhaustive list of all colleges; and she has a
  rough sense of what would be good enough but not a complete ranking. Nadia and Eli
  disagreed about whether stopping at the first college that meets that rough standard
  is rational.


  Here is the exchange as best I can reproduce it.


  1. Nadia: ''Satisficing is irrational whenever you can keep looking. If you stop
  at the first option above your threshold, you may miss a much better one. A rational
  agent should compare options until the expected gain from another search no longer
  exceeds its cost. That is just optimization with search costs. So satisficing is
  either a mistake or a disguised form of optimizing.''


  2. Eli: ''That assumes you can estimate the expected gain from another search. In
  the college case, you do not know the distribution of colleges you have not seen,
  you cannot assign probabilities to unknown options, and the cost of thinking about
  the problem is itself part of the problem. Optimization is not available. Satisficing
  is what rationality looks like when the ideal is uncomputable. The threshold is
  not an arbitrary stopping point; it is an aspiration level that lets you act.''


  3. Nadia: ''But you chose that aspiration level somehow. If it is too low, you stop
  too early; if it is too high, you search too long. So the real question is how the
  aspiration level is set. If it is set by expected value, you are back to optimizing.
  If it is set arbitrarily, then you are not rational, just lucky. And if you say
  it is set by another satisficing rule, you have a regress: you need a threshold
  for choosing the threshold.''


  4. Eli: ''The regress is real, but it does not show that satisficing is irrational.
  It shows that rationality has to start somewhere. You can have a threshold that
  is good enough for the decision at hand without having an optimal threshold for
  thresholds. That is not arbitrary; it is bounded. The alternative is an infinite
  meta-deliberation that never issues in action. A theory of rationality that cannot
  recommend action is worse than a heuristic that can.''


  5. Nadia: ''Then call it a heuristic, not a standard. I am happy to say satisficing
  is often useful. But if you say it is rational, you are making a normative claim.
  And once you make that claim, you need to say when it is rational. If the answer
  is "when the costs of optimizing are too high," then optimization is still the benchmark
  and satisficing is second-best. If the answer is "always," then you are saying it
  is rational to stop at the first mediocre option, which is false.''


  6. Eli: ''You are treating optimization as the benchmark because you assume there
  is a fact of the matter about the best option independent of the search process.
  But in many real decisions the option set is constituted by the search. There is
  no determinate "best college" for me until I have investigated, and the investigation
  changes what I want. Satisficing is not second-best to a completed ranking; it is
  the only procedure that respects the fact that preferences and options co-evolve.
  That is a different standard: ecological rationality, not approximation to an ideal.''


  7. Nadia: ''Even if preferences co-evolve, you can still ask whether a given satisficing
  rule does better or worse than another rule for achieving whatever you end up valuing.
  That is an evaluative question. And if you refuse to ask it, you cannot distinguish
  a good aspiration level from a bad one. So ecological rationality still needs a
  criterion, and the criterion will look like expected value under constraints. You
  have not escaped optimization; you have just made the constraints explicit.''


  8. Eli: ''Maybe. But there is a difference between a rule that is evaluated by its
  expected performance and a rule that is followed because it is expected to perform
  well. Nadia keeps sliding between the two. I can say satisficing is rational in
  the sense that it is a defensible rule for an agent with limited information and
  limited time, without claiming it is optimal in every case. If you demand a universal
  decision procedure that always picks the best option, you are demanding something
  no finite agent can have. The question is what rationality can require of us, not
  what an omniscient being would do.''


