  picture of consciousness. Mental life, on her account, is a stage; the senses are
  the wings; attention is the spotlight; and somewhere in the darkened house sits
  a single spectator to whom the whole performance is played. She uses the picture
  to argue three claims: that there is always a determinate fact of the matter about
  what it is like at a given moment; that the unity of consciousness is the unity
  of that one audience; and that any theory which denies a privileged inner vantage
  point has changed the subject rather than explained it. I would like the analogy
  audited before I concede anything to it.


  First, set out the correspondences explicitly; a table is welcome. Say what in the
  target is supposed to play the role of the stage, the wings, the spotlight, the
  spectator, the seats, the script, and the interval, and mark which of these have
  no obvious occupant. Then name the features of the theatrical source that the picture
  quietly imports -- among them a single vantage point, a determinate moment of viewing,
  a boundary between performance and audience, the possibility of an empty house,
  and an author or director standing outside the action -- and say which of them are
  doing real work in her three claims.


  Second, say where the mapping breaks. Which breaks are incidental and which threaten
