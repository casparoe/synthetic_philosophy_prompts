  Draft:


  "(a) The tortoise''s refusal can''t be repaired by supplying more premises, because
  the demand simply re-forms one level up. Whatever set of premises S you hand him,
  he will accept S and accept the conditional ''if S then Z'' — if you write it as
  a premise — and still not accept Z. Each time you concede him another premise you
  generate a new demand for a premise connecting the enlarged set to Z. So no finite
  expansion of the premise set gets him to Z; the gap isn''t an informational gap
  but a gap between accepting propositions and performing an inference. Carroll''s
  point is that the rule of inference (modus ponens) is not another proposition to
  be believed alongside the premises; it is the transition itself. Once you write
  it as a premise you have only added one more thing to believe, not the act of believing-on-the-basis-of.


  (b) What this shows is that deductive inference cannot be justified. Justification
  would have to take the form of showing that the conclusion follows from premises
  the tortoise already accepts, and the regress shows that every such showing can
  be resisted in the same way. Since the tortoise is never irrational at any stage
  — he never accepts a contradiction and never denies anything he''s granted — there''s
  no point at which his refusal can be faulted by argument. So the acceptance of a
  rule of inference is ultimately a brute psychological fact about the reasoner, something
  we are trained into rather than argued into; this is the sense in which the tortoise
  is the patron saint of anyone who has noticed that arguments cannot bootstrap their
  own validity.


  (c) That does bear on the normativity of logic, though perhaps not the way people
  expect. If the transition from premises to conclusion is not itself a proposition
  that can be true, then logic''s ''ought'' can''t be a matter of the reasoner''s
  beliefs being inconsistent with some further truth they''re ignoring. The tortoise
  has all the truths and still doesn''t move. What does the compelling, then, has
  to be something like the practice or the form of life — the fact that we are the
  kind of creatures who go on in a certain way. So the normativity of logic, on this
  reading, is not reducible to the normativity of belief."


