  Let me now design the case concretely.


  Case: A UK university''s counselling service. Under the old system, students who
  wanted help filled in a form and were offered the first available appointment (usually
  a one-to-one session in 3 weeks). The new system: the booking page presents, by
  default, a scheduled "wellbeing workshop" (group) starting within 48 hours, with
  a link ("prefer one-to-one?") further down. Rationale given to the university''s
  ethics committee: group workshops are as effective for most presentations, they
  reduce waiting lists from 3 weeks to 2 days, they cost less, and student feedback
  from pilot workshops was positive.


  Disputants: a behavioural scientist on the ethics committee (call her X) and a philosophy
  PhD / ethicist (call him Y)? Or two fellow students. Let''s make them: "a colleague
  from the behavioural insights team" and "a colleague in moral philosophy" — but
  the asker is a PhD student; a plausible venue: the asker sits on the university''s
  research ethics / policy committee as a student rep, and witnessed the disagreement
  there. Or a departmental seminar. Or a "reading group". Fine.


  Actually, maybe more grounded and less institutionally weird: the asker is a PhD
  student in philosophy working on behavioural policy ethics, and the disagreement
  happened between two members of a policy working group they observe.


  Moves (need 4-5, both sides decent, no strawmen):


  Move 1 (Y, ethicist): This isn''t really paternalism, and if anything it''s worse
  than paternalism: the default is set to the cheap option, so the institution is
  steering students towards the option that suits its budget, while telling itself
  it''s helping. Paternalism at least requires the aim of the nudged person''s own
  good as they see it. Here the aim is throughput. So either it''s not a nudge in
  the relevant sense, or the "we''re helping you" justification is a fig leaf.


  Move 2 (X, behavioural): Two errors. First, motive isn''t what makes an intervention
  paternalistic; what matters is the effect on the chooser''s option set and the relation
  of the intervention to her own ends. Second, the default is set to an option that
  most students, when asked, say they''d want if they knew the waiting times — the
  pilot found that when students were told both options'' waiting times, the majority
  chose the workshop. So the policy gives most students what they''d choose with better
  information and fuller attention; that''s the opposite of overriding their judgement.
  And it frees up one-to-one slots for the minority who need them. That''s not just
  cost-cutting — it''s a genuine efficiency that benefits everyone.


  Move 3 (Y): Then the honest description is "we changed the information environment",
  not "we nudged". But here''s the problem: if students would choose the workshop
  when informed, the default is doing no work except among those who *wouldn''t* have
  chosen it — the ones who''d have preferred one-to-one and simply didn''t scroll.
  So the policy''s entire causal effect is concentrated on people whose revealed preference
  (had they looked) was the opposite. That''s precisely the population you''re entitled
  to be least confident about. Call it the "residual effect" objection. And notice
  that its success depends on them not deliberating; the moment they deliberate, it
  fails. So it can''t be justified by "it''s what they''d choose anyway" — for those
  it changes, it''s what they wouldn''t choose.


  Move 4 (X): The "residual" framing assumes a counterfactual of attentive choice
  that doesn''t exist. There is no neutral form. If you list one-to-one first with
  a three-week wait, you''ve nudged toward one-to-one and you''ve also wasted the
  waiting-list capacity that gets people seen in 48 hours; if you force an explicit
  choice, you impose friction on distressed students, some fraction of whom will abandon
  and get nothing. Attention is scarce; someone must choose the order. The residual-effect
  objection would equally condemn the old system''s default, which was "whatever the
  triage nurse picks for you". And the deliberateness point cuts the other way: a
  student who scrolls past the workshop and picks one-to-one has made a genuine choice
  in a way they never did under the old form — the new design makes the alternative
  visible, which the old one didn''t.


  Move 5 (Y): Fine, but consider what we owe the ones in the residual. Also: transparency.
  The committee''s proposal discloses the default in a footnote and the university
  will publish the design. Does that satisfy you? Because it doesn''t satisfy me:
  knowing that a default is a default doesn''t stop it working on you; if it did,
  defaults wouldn''t be effective. So either the disclosure is doing real moral work
  — in which case the policy would be fine even if students never read the footnote,
  which seems false — or it isn''t, in which case "we disclose it" is a ritual. The
  morally relevant thing is whether the intervention engages or bypasses the student''s
  own evaluative capacities, not whether we''ve told them about it.


  Then ask: adjudicate move by move, say who''s right about what, identify where they''re
  talking past each other (e.g., X is defending a welfare/effects standard, Y an agency/respect
  standard; and the "paternalism" label may be a red herring since the objection that
  survives is not about paternalism but about the distribution of the effects across
  the residual population), and say what each is missing.


  Also, I want to add a twist that makes it in the weeds and forces the model to engage:
