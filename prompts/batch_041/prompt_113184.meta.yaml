  it''s fine if disclosed and publicly documented; the other says disclosure doesn''t
  fix it because knowing about a default doesn''t immunise you against it — which
  is empirically true-ish and philosophically interesting (the "transparency condition"
  in nudge ethics: Thaler-Sunstein require nudges be transparent and not hidden; critics
  say transparency is neither necessary nor sufficient).


