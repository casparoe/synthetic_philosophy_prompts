  "OK so this is a thing I''ve been chewing on for a while and I want to state my
  position as sharply as I can so someone can tell me what would kill it.


  The Hofstadter take on machine translation — that it''s shallow, that it produces
  fluent output without any grasp of what the sentences are actually about — I''ve
  basically stopped believing it, or at least I''ve stopped believing it says what
  people think it says. My position is this: what we mean by ''understanding a text''
  just is being able to do the thing a good translator does — judge which features
  of the source are load-bearing for this purpose, and render accordingly. So a system
  whose renderings are apt across the relevant range of texts and purposes, and whose
  renderings are apt *for the right reasons* — perturb the purpose and it tracks the
  perturbation, perturb the source in a way that matters and the output changes, and
  its errors are the kind of errors a thoughtful human might make rather than the
  kind a lookup table makes — is understanding the source. Not ''simulating understanding,''
  not ''understanding in a thin sense.'' Understanding.


  Two things I want to pre-empt. First, someone will say a translator doesn''t need
  to know whether the text is true, so subject-matter understanding obviously isn''t
  required; fine, I''m making a claim about grasp of the text''s point, not about
  knowledge of the world. Second, I know ''apt for the right reasons'' is doing a
  lot of work and might be circular — if you can only tell whether the reasons were
  right by looking at more behavior, then maybe I''ve just built a bigger behaviorist
  box.


