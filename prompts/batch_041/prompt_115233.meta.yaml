  Let''s think of a good classroom game. The classic absent-minded driver problem:
  You are driving home. There are two intersections. At the first, you can continue
  or take exit. If you take first exit, you end up in a bad neighbourhood (payoff
  0). If you continue and take second exit, you get home (payoff 4). If you continue
  past both, you end up in a worse place (payoff 1). You are absent-minded: when you
  reach an intersection, you don''t know which one it is. The optimal policy is to
  continue at the first and exit at the second, but since you can''t tell, you can''t
  implement "exit at second" if you don''t know. The optimal policy is to continue
  at both? Wait standard: payoffs: exit at first = 0, exit at second = 4, continue
  at both = 1. If you are at an intersection, you don''t know if it''s first or second.
  If you plan to exit, expected utility: if first, 0; if second, 4; if you think each
  equally likely, 2. If you plan to continue, expected utility: if first, then you''ll
  reach second and (if continue again) 1; if second, 1; so 1. So 2 > 1, so you should
  exit. But ex ante, if you exit at both, you get 0 (because you exit at first). If
  you continue at both, you get 1. If you could commit to continue then exit, you''d
  get 4, but you can''t because you don''t know which is which. The paradox: the optimal
  act at the node (exit) leads to worse ex ante outcome. The "policy" that maximizes
  expected utility from the start is continue at both? Actually the policy "continue
  at first, exit at second" is not implementable because you can''t distinguish. The
  implementable policies are exit at both (0), continue at both (1). So optimal policy
  is continue at both. But at each node, if you''re there, you don''t know; conditional
  on being at a node, exiting gives expected 2, continuing gives 1. So act-by-act
  says exit; policy says continue. That''s the problem.


