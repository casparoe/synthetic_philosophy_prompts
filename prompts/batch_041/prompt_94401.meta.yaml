  "Quantum mechanics hands us a wavefunction, and the central interpretative question
  is whether that wavefunction is a real physical object, like an electromagnetic
  field, or merely a compact way of writing down what someone knows about a system.
  The first position is called psi-ontic, the second psi-epistemic. The psi-epistemic
  camp is where the instrumentalists and the Copenhagen school naturally end up: on
  this view there is no fact of the matter about the wavefunction, only a calculus
  for predicting measurement outcomes, and the ''ontic state'' of the system is just
  whatever the wavefunction fails to capture — a placeholder for our ignorance. The
  psi-ontic camp, by contrast, treats the wavefunction as a concrete entity, and since
  it treats it as concrete it must also treat measurement as a physical disturbance
  that collapses it, which is why psi-ontic views need an observer or a measuring
  device to finish the job. The recent no-go theorems have settled the argument: Pusey,
  Barrett and Rudolph proved, using nothing beyond the quantum predictions themselves,
  that the wavefunction must be real. Bell''s theorem destroyed local hidden variables;
  this destroys epistemic views. So the interesting question now is not whether the
  wavefunction is real but which psi-ontic account — collapse theories, hidden variables,
  or many worlds — is correct."


