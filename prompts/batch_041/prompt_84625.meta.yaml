  ---


  Design a 90-minute activity for an undergraduate seminar of about eighteen students
  on Marx''s critique of political economy; the room has movable chairs, no computers,
  and the only materials are printed role cards, a bowl of tokens, and a whiteboard.
  Participants should reach two conclusions under their own steam before either is
  named: that a wage relation can be exploitative even when the worker freely consents
  and ends up materially better off than before, and that this verdict tracks the
  distribution of productive assets rather than the employer''s greed or the worker''s
  misery. A third, deliberately weaker aim is for them to feel the gap between that
  distributive fact and alienation, which should register as the difference between
  what the rules pay them and what the rules let them know, decide, or keep.


  Build the game so that the structure, not the facilitator''s framing, does the work:
  assign roles and endowments asymmetrically at the start, let owners and workers
  bargain over a wage and an effort level, and pay out in tokens according to a printed
  schedule that no one may renegotiate mid-round. Run a first round with a low wage,
  then a second round in which the owner is instructed to pay generously and the worker
  is clearly better off than in the no-trade baseline; the point of the second round
  is that nothing in the exploitation verdict changes. Then run a withdrawal round
  in which every participant is asked to compute, from the printed ledger, whether
  they would be better off leaving the economy altogether and taking an equal per-capita
  share of the productive assets instead, and record the answers publicly. Do not
  use the words exploitation, surplus, or alienation until the debrief.


  The debrief must map specific moments of play onto the concepts: the moment the
  wage was agreed onto the formal freedom of the contract, the second round onto the
  fact that exploitation is compatible with mutual gain, the withdrawal round onto
  the asset-distribution criterion, and the effort-and-knowledge rules onto alienation
  as a separate axis that the payoff schedule cannot capture. It should also confront
  the objection that the numbers were simply rigged, and distinguish what the activity
