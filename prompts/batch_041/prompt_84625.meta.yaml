  Draft final:


  "I teach a 75-minute session on Marx to eighteen second- and third-year undergraduates
  (about half economics, half philosophy) in a room with movable chairs and a whiteboard;
  no computers. I want an activity in which they feel, rather than hear, the force
  of the claim that exploitation can be perfectly real even when every transaction
  composing it is voluntary, mutually beneficial, and free of force or fraud — and
  that what settles whether it is real is not the fairness of the exchanges but what
  each party would get if the productive assets were redistributed equally and everyone
  withdrew to work alone.


  Build the game so they arrive at this themselves. Four things need to be true of
  the rules. First, no deception, no coercion, no side-payments: every trade must
  be one both sides would endorse. Second, the machines (whatever the productive asset
  is) must be concentrated in three or four hands, with several participants unable
  to get machine time at all, so that the going price of labour is set by that visible
  pool of the machine-less rather than by any owner''s decision. Third, mid-way through
  I poll everyone on whether the trades they have just made are fair, and I want them
  to say yes. Fourth, the last round is a withdrawal round: everyone gets an equal
  per-capita share of the machines (fractionally, if necessary) and must produce alone,
  at whatever efficiency you stipulate, and the totals are read out against the earlier
  rounds. If the arithmetic allows it, I would like at least one participant to come
  out neither exploited nor exploiter under this test, so that the tidy two-class
  picture breaks in front of them. If it can be folded in without cluttering the rules,
  I also want a touch of alienation: participants should never hold a whole product,
  only ever one indistinguishable component, and should have to buy the finished thing
  back out of their wages.


  Answer as exactly five numbered items, each a sentence or two, with no introduction
  and no conclusion: the setup and materials; the rules and payoff scheme; the round-by-round
  sequence and the moment the idea bites; the debrief, mapping what happened onto
