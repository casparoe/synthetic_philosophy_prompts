  Orthogonality thesis (Bostrom, Superintelligence 2014): Intelligence and final goals
  are orthogonal — one can have any level of intelligence with any final goal. More
  precisely: "any level of intelligence can be combined with any final goal." Actually
  Bostrom formulates: "The orthogonality thesis: Intelligence and final goals are
  orthogonal: more or less any level of intelligence could in principle be combined
  with more or less any final goal."


  Instrumental convergence thesis: "Several instrumental values can be identified
  which are convergent in the sense that their attainment would increase the chances
  of the agent''s goal being realized for a wide range of final goals and a wide range
  of situations, implying that these instrumental values are likely to be pursued
  by a broad spectrum of situated intelligent agents." Examples: self-preservation,
  goal-content integrity, cognitive enhancement, technological perfection, resource
  acquisition.


  Common misrepresentations:

  1. Conflating orthogonality with "intelligence doesn''t matter for goals" or with
  the claim that smarter agents will have different goals.

  2. Saying instrumental convergence means all AIs will end up pursuing the same final
  goals (e.g., "all superintelligences will want to take over the world" as if takeover
  is a final goal) — the convergence is on instrumental subgoals given arbitrary final
  goals.

  3. Presenting orthogonality as a claim about humans/actual AI systems rather than
  a claim about conceptual possibility (a claim about what''s possible in principle,
  not what''s likely).

  4. The "paperclip maximizer" as a prediction rather than a thought experiment.

  5. Saying instrumental convergence implies that any sufficiently intelligent agent
  will be dangerous / will seek power as an end.

  6. Conflating with "the AI will be evil" — no, it''s indifference.


