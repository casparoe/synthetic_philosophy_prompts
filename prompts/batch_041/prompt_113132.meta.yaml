  Let me also double check the analogy details: In the conditional bet, you stake
  S on "B given A". If A and B: you win. If A and not-B: you lose. If not-A: bet is
  called off (stake returned). Fair odds imply stake ratio = P(B|A). So the price
  of the bet = P(B|A) × (some scaling). De Finetti: the "called off" case is the key.
  And the analogy''s breakdown: the bet is a real object with a definite payoff in
  every state of the world (it''s a random variable, a proposition-like thing), while
  the conditional''s truth value in the ¬A cases is exactly what''s at issue (vacuous
  truth vs. no truth value). And a conditional bet is a bet on an event with a *variable*
  stake (it''s a "conditional bet" whose stake depends on A), so its "probability"
  is not really a probability in the Boolean sense; you can''t form disjunctions or
  conjunctions of bets in a way that mirrors the logic of conditionals. And Lewis''s
  triviality: if you insist that the conditional has a truth value in every possible
  world (i.e., it''s a proposition), and its probability equals the conditional probability,
  then the probability function must be trivial (at most two worlds / all probabilities
  0 or 1, depending on the version). Also there''s the point: the analogy explains
  why P(A→B) = P(B|A) is *not* just a theorem but a constraint, and the "call off"
  feature corresponds to the fact that P(if A then B) doesn''t say anything about
  ¬A worlds, which is precisely why conditionals can''t be truth-functional and why
  they resist embedding. And also the "Bets on conditionals and the Dutch book" arguments
  (Adams''s probabilistic logic) — the analogy supports the "no truth value" conclusion,
  not a truth-conditional one. So the conclusion it''s used to license (Adams''s thesis)
  survives, but the further use of the analogy to treat conditionals as "bets" (i.e.,
  as random variables that can be added, negated, conjoined) does not survive, because
  triviality shows you can''t have a Boolean algebra with these probabilities.


