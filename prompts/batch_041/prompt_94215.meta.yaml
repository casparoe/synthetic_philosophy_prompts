  is deductively valid, so unlike induction it gives us certainty — certainty about
  falsity rather than truth, which is why science can still be rational.


  The strongest objection is the Duhem-Quine problem: you never test a theory in isolation,
  you test it together with a whole bundle of auxiliary assumptions about instruments,
  background laws, and so on, so a failed prediction doesn''t tell you which part
  of the bundle was wrong. I don''t think this is really a problem for Popper, though,
  because he already held that a single failed prediction refutes the theory outright.
  Since falsification is decisive, there''s nothing left for the auxiliary assumptions
  to muddy.


