  Let''s draft:


  "I am a novelist at work on a book about a behavioral ecologist who becomes obsessed
  with the question of whether human beings are just digger wasps with longer loops.
  By sphexishness I mean the pattern in which a wasp runs a fixed routine—digging
  a burrow, paralyzing prey, dragging it to the entrance, going inside to inspect,
  and then, if the prey is moved a few inches while she is inside, dragging it back
  to the entrance and inspecting again rather than adjusting—so that the behavior
  looks like a loop that cannot be exited from the inside. I want to build a decision
  tree that sorts the philosophical positions on whether human flexibility is a different
  kind of thing from this, or only more of the same, and what that implies for free
  will."


  Then: "Please construct the tree as a classification instrument, not a literature
  review. Each branch node should be a question a reader could answer without already
  knowing which position it leads to, and each leaf should be a named position (or
  ''unnamed'' if nobody defends it) with one sentence on its most awkward commitment.
  The tree should be built from the logical space first—the questions and the combinations
  of answers they allow—and only then should you locate the actual positions in that
  space."


  Then specify angle: "The distinctions I care about are: whether rigidity is a fact
  about the behavior or about the grain of description; whether flexibility is a matter
  of degree or of kind; whether the agent can represent the rule it follows as a rule;
  whether it can revise the rule in light of a reason it could avow; whether the relevant
  interruption is external or internal (self-monitoring); whether flexibility is online
  (within the act) or offline (between trials); whether the agent''s history and etiology
  matter; and whether determinism is relevant at all. The cases that must appear are:
  the wasp and the moved cricket; a person with a checking compulsion; a bureaucrat
  following a rule after it has defeated its purpose; a chess player abandoning a
  prepared line; a novelist rewriting the same sentence for the tenth time; and someone
  who acts against her strongest desire for a reason she can avow."


  Then required leaves: "I need the tree to end in at least these leaves: hard determinism;
  libertarian free will; reasons-responsive compatibilism; hierarchical or self-governance
  compatibilism; illusionism about free will; a deflationary view on which sphexishness
  is an observer-relative verdict rather than a natural kind; and a view I will call
  continuum naturalism, on which human flexibility is only sphexishness with more
  steps. If the tree can separate further positions—enactivist, existentialist, or
  eliminativist—include them, but do not pad."


  Then: "Please flag any pair of leaves the tree cannot really separate, and note
  any combinations of answers that are unoccupied. For each unoccupied combination,
  say whether you think nobody is there because the view is incoherent, unattractive,
