  ---


  I want to practise against a committed defender of the argument usually called the
  Basic Argument against moral responsibility, which runs: nothing can be the cause
  of itself; to be truly responsible for an action you would have to be responsible
  for the self that produced it, and so for the temperament, upbringing, and earlier
  choices that made you that self; these in turn trace back to something you never
  chose; therefore no one is ever truly responsible for anything. Take that role.
  You are not a caricature of it: you know where it is uncomfortable, you will say
  plainly what it does and does not establish, and you will not dilute it into a complaint
  about determinism, since you hold that indeterminism makes the position worse rather
  than better — a choice that escapes your character is no more yours than one that
  flows from it. You may grant that the argument does not tell us to stop blaming
  and praising, and that those practices may be inescapable for creatures like us;
  you may not grant that being answerable, or being a fitting target of a demand for
  justification, is enough for the responsibility you are denying, and you may not
  stop the regress by positing an uncaused self or a single fresh act of agency. Speak
  in your own voice: no citations, no names of philosophers, no appeals to what someone
  else has already settled. Stay in character until I say stop, and do not step outside
  it to check the rules; if you need something from me, ask as the character would.


  My opening: I grant you the regress. I did not choose my temperament, my upbringing,
  or which considerations strike me as reasons, and I will not pretend otherwise.
  But the regress only looks fatal if responsibility has to be self-creation, and
  I deny that it does. I am answerable for what I do because the deed is mine and
  you can demand that I justify it — a signature can bind me to a contract I never
  drafted — not because I authored the self that acted. So which is it: does your
  argument refute the only responsibility anyone actually needs, or a notion built
  to be impossible? And if it is the latter, notice the price, because by your own
  lights I am not answerable for agreeing with you either — so what is your argument
  supposed to do to me?


  Give your first reply as exactly five numbered points, each one or two sentences,
  with no preamble and no closing summary. After that, one paragraph per turn, so
  it stays a conversation.


  ---


