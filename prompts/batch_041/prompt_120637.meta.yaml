  Potential prompt:


  "I am a member of a translation workshop that has been stuck for months on a single
  exercise: how to render a short fixed-form poem—say, Clément Marot''s *A une Damoyselle
  malade*, the Renaissance French poem that Douglas Hofstadter uses as the spine of
  *Le Ton beau de Marot*—into English. The poem is tightly constrained: short lines,
  a dense rhyme scheme, a fixed syllable count, and a tone poised between playful
  and tender. One faction in the workshop argues that a version which abandons the
  rhyme and meter has failed as a translation of *that poem*, because the poem just
  is its formal body; a prose crib may convey the sense but not the thing. Another
  faction argues that preserving the form at the cost of changing the images, the
  tone, or the plain sense is the real betrayal, and that a free-verse or prose version
  can be more faithful to what the poem says and does. We keep recycling the same
  examples—Hofstadter''s dozens of versions, the usual literal/free dichotomy, the
  claim that something is ''lost''—and nobody moves. I want a diagnosis of the impasse,
  not another round of examples."


  "Specifically: what kind of disagreement is this? Is it a substantive disagreement
  about what translation is or ought to be, a verbal dispute over the word ''translation''
  (or ''fidelity''), or two or more groups answering different questions under one
  heading—one about semantic equivalence, one about artistic re-creation, one about
  the reader''s experience, one about the author''s intention? Is a hidden empirical
  or formal question doing the work (e.g., whether form can be separated from content,
  whether a poem has a determinate ''meaning'' apart from its form, whether there
  is a fact of the matter about which version is better)? Are the sides differing
  about starting intuitions that neither can argue for? My working hypothesis—offered
  as a hypothesis, not a conclusion—is that this is a mixed case: a metaphysical disagreement
  about whether form is part of meaning, an evaluative disagreement about what translations
  are for, and a verbal disagreement about ''fidelity'', all compressed into one debate.
  Test that hypothesis against what each side actually says, and tell me what would
  count as progress given your diagnosis—a distinction, a change of question, a criterion
  of adequacy, a formal result—or whether no progress should be expected."


  "Please separate what is settled from what is genuinely contested among people who
  know translation theory and literary translation, and do not present a contested
