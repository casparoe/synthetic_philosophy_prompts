  (1) Sen''s liberal paradox is a genuine impossibility theorem: no social choice
  rule can satisfy unrestricted domain, weak Pareto, and minimal liberalism.

  (2) I am committed to minimal liberalism: for each individual there is at least
  one pair of social states over which that individual''s strict preference is decisive,
  irrespective of others'' preferences.

  (3) I accept weak Pareto: if every individual strictly prefers x to y, then x must
  be socially preferred to y.

  (4) I reject unrestricted domain. The domain of admissible profiles should exclude
  what I call meddlesome preferences—preferences over the private assignments of others—when
  those preferences are not grounded in any interest of the preference-holder.

  (5) I think rights are best modeled as side constraints on the feasible set, not
  as decisiveness conditions inside the social welfare function.

  (6) I think the liberal paradox is therefore not a deep objection to liberalism;
  it is an objection to a particular formalization of rights.

  (7) I think the private/public distinction, while context-sensitive, is objective
  enough to underwrite (4).

  (8) I think a social choice rule can satisfy both liberal rights and weak Pareto
  for all admissible profiles, provided the domain restriction in (4) is principled.


