  Core idea to inject: The "no-trade" results in the economics of information say,
  roughly, that if two agents have a common prior and it is common knowledge that
  a proposed trade is mutually beneficial (ex ante Pareto-improving) given their information,
  then they cannot both agree to it — because the mere fact that the other party wants
  to trade is itself evidence about what they know, and this "informational externality"
  cancels the apparent gains. Related results: rational agents with common priors
  can''t "agree to disagree" — their posterior probabilities must coincide once the
  disagreement is common knowledge.


  The epistemological question: If no-trade results are right, then the informational
  content of prices cannot be generated by the trades of rational, common-prior agents
  responding to private information. Prices can only carry information if some trades
  are made for non-informational reasons (liquidity, noise, hedging, life-cycle) or
  if agents have heterogeneous priors (which some regard as a form of irrationality)
  or if the common-knowledge conditions fail (bounded rationality, computational limits).
  So: is "the market as an epistemic device" a coherent idealization, or is it parasitic
  on epistemic failure? And: does the epistemology of markets need a notion of "rational
  disagreement" that the no-trade results rule out?


  Injected fresh angle: Distinguish two ways a price can carry information: (i) *revealing*
