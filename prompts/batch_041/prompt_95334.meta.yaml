  Moore''s paradox: the sentence "It''s raining but I don''t believe it''s raining"
  (omissive) is absurd even though it can be true. The standard explanations: (a)
  assertion-based (Wittgenstein: "I believe p" is an assertion of p; so you''d be
  asserting p and asserting you don''t assert p), (b) belief-based (can''t coherently
  believe the conjunction — "expressive" contradiction), (c) the "normative" account:
  belief aims at truth; believing a Moorean proposition entails having inconsistent
  beliefs? Actually "p and I don''t believe p" — if I believe the conjunction, then
  I believe p, so my beliefs are inconsistent. That''s the "belief is inconsistent"
  reading. There''s also the "epistemic" version: "p but I don''t know p" — this one
  is more puzzling since it can be true and believing it doesn''t produce inconsistency
  in beliefs about p (you believe p, you believe you don''t know p — no formal inconsistency).


