  equilibria), (ii) *aggregating* — the price is a device that makes dispersed information
  common knowledge. The no-trade results threaten (i) at the individual level but
  not necessarily at the equilibrium level, because the price itself is an object
  of common knowledge. So there''s a possible resolution: trade stops being the channel;
  the price is the channel; but the price is only informative if it is common knowledge
  that it is informative, which leads to a self-referential condition. Interesting!
