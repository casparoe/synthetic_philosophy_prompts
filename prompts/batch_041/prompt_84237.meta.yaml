  Let''s think carefully about Frege-Geach. The problem: expressivism says moral judgments
  express non-cognitive attitudes, not beliefs. But moral sentences embed in complex
  sentences: conditionals, negations, disjunctions, propositional attitude reports.
  In "If lying is wrong, then getting your little brother to lie is wrong," the antecedent
  "lying is wrong" doesn''t express disapproval; it''s not asserted. Yet the argument
  seems valid by modus ponens. Expressivism must explain how the same sentence can
  have same meaning in embedded and unembedded contexts, and how validity is possible
  without truth conditions. Standard solutions: Blackburn''s quasi-realism, higher-order
  attitudes; Gibbard''s norms and possible worlds; Horgan/Timmons'' "expressivist
  semantics" with semantic inheritance; Schroeder''s "expressivist" semantics. We
  can inject a new proposal: "parasitic content" or "commitment-role semantics." Maybe
  a "dual-aspect" view: moral predicates have a "thin descriptive meaning" that is
  invariant across contexts, plus an "expressive force" that attaches at the level
  of whole utterances. But then the problem: if the descriptive meaning is truth-apt,
  why is the view expressivist? If not, compositionality fails. This is a real issue.


