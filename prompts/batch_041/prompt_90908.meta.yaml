  I''m a second-year PhD student working on practical reason, and I''ve been refereeing
  a running argument between two colleagues in my cohort that I can''t resolve to
  my own satisfaction. The argument started from a case our reading group discussed
  and has since taken on a life of its own. The case is this: a surgeon, whom they
  call Marta, was trained in a system that instilled in her an unusually strong sense
  of professional obligation; she has since come to regard that system as morally
  compromised, has deliberately dismantled the commitments it gave her, and now reports
  — credibly, so far as anyone can tell — that she has no motivation whatsoever to
  do several of the things the role demands. She still does some of them, out of habit
  and fear of sanction, but she denies that the obligations themselves weigh with
  her at all. The question on the table is whether Marta nevertheless has reason to
  fulfil those demands.


  Ravi says no, or rather not in the sense that matters: for a consideration to be
  a reason for Marta, there must be a sound deliberative route from where she actually
  is — her desires, her projects, her loyalties — to the conclusion that she should
  act, and ex hypothesi there is no such route, since she has already deliberated
  and found nothing left to move her. He insists this is not a bleak conclusion: it
  simply distinguishes having a reason from the world being such that it would be
  good if she acted, and it explains why reasons are the sort of thing you can act
  on and be advised with. Colette says this makes reasons hostage to biography. Had
  Marta been raised a decade earlier, she would have kept the commitments and no one
  would have questioned that she had reasons; the only thing that changed is a fact
  about her psychology, and it seems absurd that a requirement generated by her patients''
  needs should wink out of existence because of it. She says Ravi''s position cannot
  even make sense of the thought that Marta might be criticisable, since blame presupposes
  that she had a reason she failed to act on. Ravi replies that Colette''s position
  cannot distinguish having a reason from its merely being desirable that one act,
  and that an alleged reason which by construction can never figure in anyone''s deliberation
  — not Marta''s, not even in principle — is either a relabelling of "good" or a piece
  of metaphysics earning its keep nowhere. Colette answers that his "sound deliberative
  route" is already smuggling in external reasons, since he admits deliberation can
  reveal considerations Marta does not now desire to act on, and that once you concede
  that, you have given up the internalist game. Ravi says sound deliberation only
  uncovers what is already implicit in her commitments — resolving conflicts, tracing
  means to ends — and cannot conjure new springs of action.


  I''d like a point-by-point adjudication rather than a verdict on the whole dispute:
  for each of the moves above, say how strong it is and why, where the argument is
  being loaded by a stipulation or an equivocation, and what each side is missing
  that the other is right about. In particular, I want to know whether Ravi''s deliberative-route
  condition can really stop where he says it stops, and whether Colette''s appeal
  to the needs of others and to criticisability actually establishes what she needs.
  Please don''t just tell me which philosopher each of them sounds like; I care about
  whether the arguments as stated work.


