  multi-decadal climate variability are full causal contributors to historical outcomes,
  not background conditions against which human action takes place. The Tambora eruption
  of 1815 and the harvest failures of the following year in Europe and New England
  belong in the causal account of the resulting Atlantic migrations in the same way
  that a tariff or a land policy does; the fact that the volcano had no intentions
  is beside the point.


