  (1) Causal parity for non-human factors. Pathogens, volcanic aerosol forcing, and
  multi-decadal climate variability are full causal contributors to historical outcomes
  rather than background conditions against which human action takes place. The Tambora
  eruption of April 1815 and the harvest failures of 1816 in Europe and New England
  belong in the causal account of the westward movement out of New England that followed,
  in the same way that a land policy or a shipping cost does. That the volcano had
  no intentions is beside the point. Nor do I take this parity to dilute responsibility:
  nothing in it excuses what human agents did with the harvests they had.


  (2) Causation is not agency. To be an agent an entity must be capable of responding
  to reasons, or at the very least to norms, and that is a substantive condition that
  no virus, eruption, or oscillation meets. I regard the current fashion for distributing
  agency across actants and vibrant matter as a category error, and an expensive one:
  it buys rhetorical force by flattening a distinction that does real explanatory
  work.


  (3) Anti-determinism. Environmental determinism — the comparative thesis that environmental
  conditions explain the differences in development among human societies — is empirically
  thin and politically poisonous, and has served above all as a naturalizing idiom
  for colonial hierarchy. I want no part of it.


  (4) Anthropocene realism. Humans are now a geological force; this is a description
  of the stratigraphic record, not a metaphor, and the concept is indispensable both
  scientifically and politically. We need a name for the fact that the species has
  become a driver of planetary process, and any historiography that refuses it is
  unserious about the present.


  (5) Contingency. Historical outcomes are not inevitable. Small perturbations can
  have very large downstream effects, and an explanation that narrates what happened
  as the only thing that could have happened has failed as an explanation.


  (6) Causal selection is interest-relative. When we single out one cause and call
  it the cause, we are answering a question about what we want explained, not reporting
  a further fact about the world. There is no privileged cut in the causal graph marked
  the real cause.


  (7) Explanation is differential. To explain something historically is to account
  for variation — why here and not there, why then and not later — rather than to
  narrate a sequence.


