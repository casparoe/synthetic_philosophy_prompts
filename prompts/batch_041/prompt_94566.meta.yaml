  to reasons — or at minimum to norms — and this is a substantive condition that no
  virus, eruption, or climate oscillation meets. I take the recent fashion for distributing
  agency across actants and vibrant matter to be a category error, and a costly one:
  it purchases rhetorical force by flattening a distinction that does real explanatory
  work.


