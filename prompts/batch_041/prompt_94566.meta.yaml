  conditions explain the differences in development among human societies — is both
  empirically thin and politically poisonous, having served as a naturalizing idiom
  for colonial hierarchy. I want no part of it.


  4. The Anthropocene. Humans are now a geological force, and this is not a metaphor;
  it is a description of the stratigraphic record. The concept is indispensable both
