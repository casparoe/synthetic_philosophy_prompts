  The answer draft:


  "Propositions are the things that can be true or false, and they seem to be made
  up of parts: in ''the cat is on the mat'' the proposition contains the cat, the
  mat, and the relation of being-on. But if a proposition is just a bundle of its
  parts, then what makes it a single thing that says something, rather than a mere
  list? Call that the problem of the unity of the proposition.


  Bradley''s regress is supposed to show that you can''t build the unity out of the
  parts by adding a relation. Suppose the proposition ''aRb'' is unified by the relation
  R holding between a and b. But R is itself a part, and for it to connect a and b
  it has to be connected to them, which needs a further relation R1 between R, a and
  b; and then R1 needs a relation R2, and so on. So the attempt to explain unity by
  appeal to a relating relation generates an infinite regress. Bradley thought this
  showed that relations are not ultimately real — that the very idea of a plurality
  of related things is incoherent — and that reality must therefore be a single seamless
  whole, which is roughly the view he calls the Absolute. The same structure is basically
  the Third Man argument in Plato''s Parmenides, where the Form is introduced to explain
  the resemblance of particulars and then needs a further Form to explain its resemblance
  to them, so Bradley''s regress is really just that old argument in a new setting.


  The standard move at this point is to say the regress is vicious, so nothing can
  be a proposition; but the more common modern line is to deny that the regress is
  vicious at all, and to hold that the unity of the proposition is sui generis. Frege
  is usually credited with solving the problem, and his solution is the sense/reference
  distinction: the proposition ''the cat is on the mat'' has a sense (the mode of
  presentation) and a reference (the truth value), and the sense is what unifies the
  parts. Wittgenstein in the Tractatus takes a different line, treating the proposition
  not as a thing with parts but as a fact, i.e. a configuration of names, so that
  there is no need for a further relation to glue them together.


  So on balance the regress is not vicious; it just shows that you shouldn''t try
  to analyse propositional unity relationally. The point of the problem is that the
  unity has to be primitive."


