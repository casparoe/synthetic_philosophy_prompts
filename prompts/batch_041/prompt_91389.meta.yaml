  Key facts:

  - F.H. Bradley, in Appearance and Reality (1893) and The Principles of Logic, argued
  that if a proposition consists of terms related by a relation, then the relation
  itself must be related to each term, generating a new relation, and so on infinitely.
  Bradley''s regress. Bradley himself is often read as arguing that relations are
  unintelligible (relations presuppose their relata and vice versa), leading to the
  conclusion that reality is a single seamless whole (the Absolute) rather than a
  plurality of related things.

  - The "unity of the proposition" problem: what distinguishes a proposition (which
  says something, is truth-apt) from a mere list of its constituents? Frege: the proposition
  is a "saturated" whole formed by an unsaturated function applied to an argument;
  concepts are unsaturated. Russell: in The Principles of Mathematics, he held that
  a proposition is a unity, and later the multiple relation theory of judgement (in
  "The Nature of Truth," 1906-7, and Principia) to avoid positing false propositions.
  Wittgenstein''s Tractatus: the proposition is a fact (a configuration of names),
  not a thing with constituents bound by a relation.

  - The regress: to unify a and R into the proposition aRb, you need R to relate a
  and b; but then to unify R with a you need another relation R'', etc.

  - Is it vicious? Standard responses: the regress is not vicious if relations are
  "non-mediate" or if we take the proposition to be a sui generis unity; some (e.g.,
  Gaskin in "The Unity of the Proposition") argue the regress is benign; others argue
  it shows the relational analysis is wrong.


