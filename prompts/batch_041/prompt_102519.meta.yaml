  sources of pain''s badness -- for example, its intrinsic phenomenal quality, its
  motivational/imperative force, and its role as a signal of bodily damage -- and
  say which survives asymbolia. They should also distinguish pain asymbolia from congenital
  indifference to pain, and explain why that distinction matters for the argument.
  Do not require citations, reading lists, or bibliographies; the question must be
  answerable from conceptual reasoning alone.


