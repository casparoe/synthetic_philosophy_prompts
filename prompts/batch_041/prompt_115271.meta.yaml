  Question: In the Two Ledgers framework, an agent distinguishes first-order verdicts
  (what to do now) from second-order verdicts (which deliberative procedure to adopt).
  Indirect normativity is defined as the thesis that a first-order verdict is correct
  just in case it is what the agent''s idealised second-order procedure would endorse.
  A critic objects that this makes first-order verdicts merely derivative: the idealised
  procedure can endorse whatever it likes, and the first-order verdict has no independent
  authority to constrain it. Explain the strongest version of the critic''s objection,
  assess whether the framework can answer it, and say what follows if idealised deliberation
  is indeterminate between several procedures. [Maybe 800 words expected?]


