  Candidate answer:


  "The critic''s objection is best understood as a regress worry. If the only thing
  that makes a first-order verdict correct is that the idealised procedure endorses
  it, then the procedure itself must be correct in virtue of something else, or else
  the framework is circular. The Two Ledgers theorist can reply that the procedure
  is not meant to be correct in the same way; it is a procedure, not a proposition.
  Its authority comes from its being the procedure the agent would endorse under full
  idealisation, and that is a constitutive rather than a substantive claim. On this
  reading, indirect normativity is a form of procedural realism: there is a fact of
  the matter about what the idealised procedure would endorse, but no further fact
  about whether the procedure is ''tracking'' an independent normative order.


  However, I think this reply fails. The idealised procedure is supposed to be an
  idealisation of the agent''s own deliberation. If it is merely procedural, then
  it cannot generate substantive verdicts about what to do; it can only transform
  the agent''s existing commitments. So the framework either has to import substantive
  normative content into the procedure, in which case the first-order verdict is derivative
  after all, or it has to admit that the procedure is empty. This is why the framework
  is really a version of ideal observer theory: the idealised agent is stipulated
  to be fully informed and impartial, and those stipulations do the substantive work.


  The indeterminacy point makes things worse. If the idealised procedure is indeterminate
  between several procedures, then indirect normativity cannot tell the agent what
  to do. The agent is left with a set of first-order verdicts, each endorsed by some
  idealised procedure. That is not a decision procedure; it is a menu. The only way
  out is to say that the idealised procedure includes a tie-breaking rule, but then
  the tie-breaking rule is doing the normative work, and the first-order verdict is
  again derivative.


  A better version of indirect normativity would say that first-order verdicts are
  not derived from the idealised procedure but are constrained by it. The procedure
  sets the boundaries of acceptable deliberation, whilst first-order reasoning determines
  the particular act. This preserves the authority of first-order verdicts and avoids
  the regress. On this view, the critic''s objection succeeds against the strong reading
  but not against the weak reading."


