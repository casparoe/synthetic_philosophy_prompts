  Pascal on justice and force is a nice one. Pascal''s famous fragment: "Justice without
  force is powerless; force without justice is tyrannical." Also "It is just that
  what is just should be obeyed; it is necessary that what is strongest should be
  obeyed. Justice without force is powerless; force without justice is tyrannical.
  Justice without force is contradicted, because there are always bad people; force
  without justice is accused. So justice and force must be put together..." And Pascal''s
  remark that we cannot give force to justice because force is a material thing and
  justice is spiritual — hence "being unable to make what is just strong, we have
  made what is strong just" (this is the famous bit: "ne pouvant faire que ce qui
  est juste fût fort, on a fait que ce qui est fort fût juste").


  So an argument that proves too much: from Pascal''s premises, we derive that all
  existing law/authority is legitimate — i.e., a legitimating argument that makes
  any de facto power just. That''s the "proves too much" flavor: the conclusion is
  that whoever holds power is justly obeyed, so no revolution or reform is ever justified
  — which seems to be exactly what Pascal half-says but also what he''s warning about.


