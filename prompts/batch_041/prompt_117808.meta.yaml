  Aristotle natural slavery: an argument that proves too much — from Aristotle''s
  premises (some people are by nature suited only to be ruled, being capable of apprehending
  reason but not possessing it; the soul rules the body, etc.), the argument generalizes
  to entail that any group with less developed deliberative capacity should be enslaved
  — including children, the "natural slave" argument collapses because it justifies
  enslaving those who on Aristotle''s own account can be improved... Also the "proves
  too much": Aristotle''s criterion (incapacity for deliberation) would classify many
  free citizens as slaves and many slaves as fit to rule, so by his own standard the
  actual institution of slavery is unjust; hence the theory either refutes the practice
  or the practice refutes the theory. That''s a nice "proves too much" — the argument
  proves that virtually no actual slaveholders own natural slaves, so the theory condemns
  the practice it was meant to defend. That''s a nice bite. But it''s fairly standard
  scholarly territory (e.g., "natural slavery as ideological, empty set").


