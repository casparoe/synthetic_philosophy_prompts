  I''m a junior at a science-and-humanities magnet school, and I''m in a seminar called
  Minds and Machines that meets at 7:40 in the morning, which is the only reason I''ve
  had the patience to sit with Hofstadter''s essay on variations on a theme, the one
  collected in Metamagical Themas. Our teacher glosses his picture as knob-twiddling:
  you imagine a theme as a point in a conceptual space with a set of knobs sticking
  out of it, and creativity is turning one of those knobs a little and noticing what
  happens. Two claims from the unit are the ones I keep arguing about with my friend
  Priya. First, the turns that feel like imaginative leaps are often no larger, measured
  in the space, than turns that feel trivial, so the size of a creative move isn''t
  the size of the knob-turn but of its effect. Second, and this is the part I actually
  want a poem about, none of it works unless you can already tell which features of
  the theme are load-bearing and which are merely along for the ride — a variation
  only counts as a variation if the theme survives it, and knowing where the boundary
  is is most of the skill. For my final project I want to write a poem that enacts
  this instead of explaining it, and I''d like you to write it.


  The poem should be a theme and variations, and I want the mechanics to be visible
  enough that our teacher can check my work. The seed is a line I wrote myself, so
  there''s no attribution problem, and I''d like it printed alone at the top, before
  the title''s subtitle or anything else: My grandmother''s chair stands empty at
  the head of the table. Then six variations of four lines each, unrhymed, with lines
  of roughly equal length, so that nothing varies but what I''ve asked to vary; the
  seed line may be reworded inside a variation but the poem shouldn''t simply repeat
  it verbatim as a refrain. Each variation turns exactly one knob of the seed, and
  I want the six knobs to be these: whose chair it is; what the object is; what state
  the object is in; where it stands; when the scene is happening, including tense;
  and who is speaking about whom. After each variation, add one italicized sentence
  in brackets naming the knob that was turned and saying, honestly, how far the theme
  was pushed before it stopped being a variation on that seed — cheap, expensive,
  or over the line. One of the six variations must be a false variation: it should
  read like an ordinary small turn, but it should have left the space, and its note
  should say so and say what got lost when it did. The last variation should feel
  like the biggest imaginative leap in the whole poem, and its note should report,
  without apology, that it is no larger a turn than any of the others.


  Two things about how it should read. Someone who knows the model should be able
  to hold the notes up against the variations and find that they''re true, which means
  the notes can''t be flattering — if a variation turns out to be a bigger move than
  I claimed, say so. But someone who reads only the poetry and skips every bracketed
