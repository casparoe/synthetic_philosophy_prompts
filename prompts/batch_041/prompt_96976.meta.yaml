  \ than its reputation. As I read him, he grants animals life and even sensation\
  \ in a bodily sense: their cries and struggles are genuine events, the movements\
  \ of a real and intricately built body. What he withholds is thought. And he supports\
  \ the withholding with two considerations that pull against each other. The first\
  \ is that if you built a machine with the outward shape and the internal organs\
  \ of a monkey, you would have no way of knowing it was not a monkey — the outside\
  \ is all we ever have with a beast. The second is that no machine, however well\
  \ built, could use words or signs the way we do, flexibly and across novel situations,\
