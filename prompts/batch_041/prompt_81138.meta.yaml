  Exam question draft:


  "Answer both parts. (a) Hofstadter''s ''knob-twiddling'' model treats creativity
  as the exploration of a conceptual space: a domain is represented as a set of dimensions
  or parameters (''knobs''), and creative acts are moves within that space, ranging
  from surface variations to deep variations. Explain the model using the example
  of varying a melody, and distinguish surface variation, deep variation, and what
  he calls ''slippage.'' (b) In lecture we distinguished three kinds of variation:
  (i) tuning, where a knob''s value changes within a fixed dimension; (ii) retuning,
  where a knob''s value changes but the dimension itself takes on a new significance;
  and (iii) re-dimensioning, where the space is rebuilt because the old dimensions
  no longer carve the domain at its joints. Some critics argue that Hofstadter''s
  model accounts for (i) and (ii) but not (iii). Do you agree? Defend your answer
  with reference to at least one example from music, mathematics, or programming."


  This is self-contained. It includes a made-up three-fold distinction. The student
  answer can be mixed.


  Student answer draft:


  "Hofstadter''s knob-twiddling model says that creativity is not a mysterious bolt
  from the blue but a matter of exploring a conceptual space. A conceptual space is
  like a control panel: each knob is a feature of the domain, and each setting is
  a possible variant. To create is to twiddle the knobs—sometimes slightly, sometimes
  drastically—and to evaluate the results. Varying a melody is the paradigm. If you
  keep the rhythm and harmony but change one note, that is surface variation. If you
  invert the melody, change its mode, or stretch its intervals so that the same tune
  is heard as something new, that is deep variation. Slippage is when the knobs themselves
  start to drift: the boundaries between dimensions become fuzzy, and a variation
  that began as a change in one feature turns out to be a change in another. This
  is why Hofstadter says creativity is ''fluid'': the space is not fixed, and the
  interesting cases are the ones where the knobs are redefined as you go.


  On the second part, I think the critics are right that the model does not fully
  capture re-dimensioning, but I also think Hofstadter has resources to reply. Tuning
  and retuning are clearly within the model: tuning is just changing a value, and
  retuning is when the same value means something different because the surrounding
  context has changed. Re-dimensioning is harder. A genuinely new dimension—say, when
  twelve-tone serialism made ''key'' irrelevant, or when non-Euclidean geometry made
  ''parallel'' a variable rather than a fixed postulate—cannot be reached by twiddling
  the old knobs, because the old space does not contain the new dimension. Hofstadter
  could say that re-dimensioning is just a very deep variation, but that seems to
  stretch the metaphor: if the space is rebuilt, it is not clear what it is a variation
  of. So I agree with the critics, though I would add that the model is still useful
  for explaining how the new space is reached from the old one, because the old space
  provides the material for the reconstruction."


