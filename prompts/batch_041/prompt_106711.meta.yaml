  Last night a friend and I spent three hours arguing about whether two different
  neural networks can implement the same mechanism, and we ended exactly where we
  started. My friend holds the intuitive view: if two models have different weights,
  different architectures, or were trained on different data, then they implement
  different mechanisms, full stop, even if they compute the same function on every
  input we try. I hold the view that sameness of mechanism is not settled by weights
  or even by input-output behavior; it is settled by a chosen class of interventions,
  so that two systems count as the same mechanism when they respond equivalently to
  every intervention in that class. The argument got especially tangled when we tried
  to connect it to mechanistic anomaly detection, the project of flagging when a model''s
  internal causal structure has changed in a way that matters, for example when a
  backdoored model uses a different internal route to the same output. If mechanism
  identity is relative to an intervention class, then what is an anomaly relative
  to? And if it is not relative, then what fixes the class of interventions that defines
  the mechanism? I want to interview someone about this on a small podcast I co-host.


  The guest is an unnamed researcher I have invented for the episode, but she should
  be treated as a real defender of a specific position: she holds that mechanism identity
  is intervention-relative, that there is no fact of the matter about whether two
  systems implement the same mechanism apart from a specified intervention class and
  a specified granularity, but that once those are fixed, sameness is an objective
  equivalence relation. She also thinks this view is compatible with mechanistic anomaly
  detection, because anomaly detection can be made objective relative to a reference
  intervention class. She is not a skeptic about mechanistic explanation; she thinks
  the relativity is a feature, not a bug. She is, however, vulnerable to the charge
  that her view makes anomaly detection circular, because the intervention class that
  defines the mechanism may be the very thing that the anomaly is supposed to reveal.


  Please act as an expert interviewer in philosophy of science and mechanistic interpretability.
  Before drafting, think carefully about the dialectic and brainstorm the strongest
  objections to her view: the trivialization objection that any two systems are equivalent
  under some intervention class; the gerrymandering objection that the choice of intervention
