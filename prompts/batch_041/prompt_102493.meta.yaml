  — but the justification he gives for it. Wine, on his account, is not chiefly a
  pleasure to be rationed; it is a drug that loosens the grip of shame and calculation,
  and precisely for that reason can function as a test of character, an exercise in
  courage against fear and in temperance against pleasure, provided the drinking is
  done in company, under rules, with a sober overseer and with everyone''s awareness
  that the occasion is a test. He even seems to think a city might legitimately use
  compulsory drinking as part of civic formation — which is why I want to put his
  theory against a real case that seems to invert it. The Spartans, as every schoolchild
  account has it, did not drink to test themselves; they made helots drink to excess
  and showed the results to their young, so that the boys would learn what a slave
  looks like when the wine is in him.


