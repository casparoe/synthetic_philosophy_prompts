  issue: in moral trade, you''re trading what you have reason to do, and if moral
  reasons are agent-neutral, the "trade" might be incoherent because there''s one
  right answer — the "no gains from trade in truth" problem (analogy: could two mathematicians
  trade over the value of pi?). That''s a great deep disanalogy: economics assumes
  divergent subjective valuations; moral realism (at least non-indexical, agent-neutral
  consequentialism) holds there''s one correct answer, so disagreement about moral
  facts is like disagreement about facts — no gains from trade (like trading about
  arithmetic). But if value is agent-relative (each agent has their own projects/values),
  gains from trade are real. So the analogy''s fate depends on metaethics. Nice.


