  I think a clean, rich prompt: the asker is a PhD student in philosophy (or in economics
  with moral philosophy interest) who is in a reading group on effective altruism;
  the "gains from comparative advantage" analogy is doing the work of licensing "moral
  trade is a win-win, not a compromise or a sell-out, and we should build the institutions".
  Ask: give the correspondence mapping in prose (agents as trading nations, their
  value orderings as their "production technologies", moral actions/resources as goods,
  opportunity costs as the exchange rate, the contract as a commitment device, "gains
  from trade" as both parties better off by their own lights), then where the mapping
  breaks: (1) no common unit — international trade requires a common medium of exchange
  or at least terms of trade; moral value has no cardinal unit and possibly no interpersonal
  comparability, so "gains from trade" may be undefined and the "exchange rate" may
  be indeterminate or depend on bargaining power; (2) preferences are endogenous —
  trade in values changes what you value (analogy: advertising, or addiction), which
  in economics is treated as a welfare loss via distorted preferences; (3) contract
  enforcement — no world government, no courts; the moral "contract" must be self-enforcing,
  and the reputational market might fail; (4) comparative advantage presupposes that
  each party''s production possibilities are fixed and that the goods are alienable
  and transferable; moral "goods" (e.g., my integrity, my personal projects) may be
  non-alienable or their value may be agent-relative, so transferring them is not
  a transfer of the same value; (5) the "no gains from trade in truth" issue — if
  moral claims are agent-neutral truths, two parties disagreeing about morality is
  like two mathematicians disagreeing about arithmetic, and there''s nothing to trade,
  only to correct; the analogy implicitly assumes value subjectivism/indexicalism;
  (6) the externality/third-party problem — trade affects others not party to it (like
  the slave trade being mutually beneficial to the traders), so mutual benefit is
  not sufficient for moral improvement; (7) risk/moral hazard — making yourself worse
  off to raise your threat point (deliberately becoming more extreme to extract concessions),
  analogous to strategic trade or to arson; (8) the possibility of "repugnant" trades:
  the fact that both parties prefer the outcome doesn''t show it''s permissible —
  the analogy imports the efficiency criterion of welfare economics and the claim
  that efficiency is all-things-considered good, which is exactly what''s in dispute;
  the potential-Pareto/compensation logic.


