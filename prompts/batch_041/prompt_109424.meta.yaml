  of strategic extremism, logrolling can produce worse outcomes, and some things can''t
  be traded), or "hostage exchange"/"prisoner exchange", or "barter under anarchy"
  (which keeps the no-enforcement, no-common-currency features). Good — barter under
  anarchy or logrolling.


