  So: build me the case. Not a survey — an actual scenario I can steal, and I will
  steal it.


  What I need from the scenario:

  - It has to be a harm to her, not to the people who loved her. The grief of the
  living is a different thing and it''s cheating.

  - Nothing supernatural, no afterlife, no time travel, no sci-fi. Contemporary, ordinary.

  - The bad thing has to happen entirely after she dies, and she has to have had no
  anticipation of it — she didn''t lie awake worrying about this specific thing, she
  never formed a belief or a fear about it. I don''t want the harm smuggled back into
  her living life through anxiety.

  - It can''t be something she set up herself or consented to in advance (no ''she
  asked them to burn the notebooks'', no contract), because then I can''t tell whether
  it''s a harm or just a deal she made.

  - And it has to be something where, if you asked an ordinary reader ''was that bad
  for her?'', they''d say yes without hedging — but where the Epicurean has a real
  comeback, not a cheap one.


  Then, and this is the part I actually care about:

  1. Show me the scenario works: go through each constraint and say why it''s met.

  2. Give me your verdict, not the menu. Is she harmed by what happens after her death?
  And can the Epicurean hold both that death is nothing to us and that posthumous
  stuff like this is a real harm to the dead — or does one have to give? Commit. I''d
  rather you be wrong and definite than hedge.

  3. Tell me which single feature of the case is doing the work — the thing that,
  if I changed it, would flip your answer. Then change it and show me the flip.

  4. Tell me how someone who wanted to defend the Epicurean would attack my scenario.
  I want to know where it''s weakest before my editor finds it.

  5. Where you''re taking a contested reading of anything, flag it in a line. No citations,
  no reading list — I''m not writing a dissertation, I''m writing a novel."


