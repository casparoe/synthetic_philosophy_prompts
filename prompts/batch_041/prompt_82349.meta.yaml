  I am an undergraduate in a philosophy of science course, and the session I am leading
  next week is on Lakatos and the methodology of scientific research programmes. Rather
  than summarise the framework for the group, I would like to open with a poem that
  makes the machinery visible — one where the structure of a programme, rather than
  the vocabulary, does the work. Could you write it?


  What I have in mind:


  - Roughly six quatrains. It should rhyme; the scheme is yours, but the recurrences
  below need to be audible.

  - One line is the hard core. It returns verbatim in every stanza, is never altered,
  and is never argued for anywhere in the poem. It should read as something held rather
  than something established — the reader should feel that no stanza in the poem could
  have produced it, and that it would survive any of them.

  - A second line returns in every stanza after the first, but with exactly one word
  changed each time. That line is the protective belt: one and the same claim, continually
  re-worded so that whatever the preceding stanza put in its way no longer touches
  it. By the final stanza the drift should be plain, and a reader should be able to
