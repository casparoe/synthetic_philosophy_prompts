  Good''s theorem: I. J. Good''s 1967 "On the principle of total evidence" — the theorem
  that free information (a costless observation) is always non-negatively valuable,
  in the sense that the expected utility of a decision made after observing the data,
  averaged over the data, is at least as great as the expected utility of the decision
  made without. This is "the value of information" theorem. Key subtleties: it holds
  for expected utility maximization, requires that you can condition on the observation
  and act accordingly, requires that you use the same prior, that the decision problem
  is fixed, and the "costless" caveat. Interesting paradoxes: the "value of information
  can be negative" cases arise when you can''t commit to ignoring the info (e.g.,
  the driver who knows their car may be unreliable), or when the observation itself
  changes the state (Good''s own example: the observation can be causally influenced
  by the decision, or when you might be forced to act), or when info is about your
  own future actions (e.g., Kavka''s toxin puzzle), or when knowing the info is itself
  bad news (a "bad news" theorem — expected utility can drop if information is not
  free to acquire or if the value is computed differently). There''s also the phenomenon:
  if the information is about something you can''t change, it can only affect utility
  through the decision, so if you''re an EU maximizer you''d ignore it; but people
  don''t.


