  Let me think about the content of the analogy more concretely, and whether it holds.
  The analogy: objective chance is like an expert whose credences you should adopt
  (defer to). Work it''s doing: motivating the Principal Principle (PP): C(A | chance(A)=p
  and E) = p, for admissible E. The instructor uses the analogy to argue that rational
  credence must defer to chance, and hence PP is analytic of the concept of chance
  (Lewis: any reasonable initial credence function satisfies PP, because "chance"
  is defined as the thing you should defer to).


  Where it holds: both are cases of deference to a better-informed/authoritative source;
  both yield the "no extra information" structure; both involve adopting the source''s
  credence function wholesale (an expert is someone whose credences you should adopt
  — Gaifman''s "expert" formalization). Where it breaks:

  1. An expert is an agent with beliefs about the very proposition; chance is a physical/objective
  quantity defined by a chance setup (frequencies, symmetries, propensities, best
  systems). Chance doesn''t "believe" anything. So the analogy presupposes a contentious
  metaphysics (that chances are credence-like).

  2. Deference to an expert is defeasible by evidence about the expert''s reliability;
  the PP is meant to be exceptionless (given admissibility). So the analogy predicts
  a defeasible principle, not an a priori one.

  3. Expert deference typically allows you to keep your own higher-order information
  (you can defer to an expert''s first-order credence while distrusting their meta-credence);
  with chance the "admissibility" clause is doing the work, and the analogy gives
  no independent grip on which facts are admissible.

  4. The expert analogy suggests chance is "better informed" — but chance isn''t informed
  at all; it doesn''t track evidence. So the "epistemic superiority" that grounds
  deference is different (chance is not more evidence, it''s a feature of the world).

  5. Multiple experts: chance is local to a setup; the "expert" is global. And different
  chance setups give different chances for the same proposition (e.g., the chance
  of heads given different coins) — an expert can''t disagree with itself, but chance
  can (relativity to setup/reference class).

  6. Self-undermining / higher-order: if you learn your own credence differs from
  chance, PP says change; with an expert, you''d typically treat the expert''s view
  as a reason but you can also update on the fact that you disagree (the "expert"
  analogy suggests deference is unconditional).

  7. The analogy suggests chance has a "point of view," which imports a subjectivist
  picture, whereas chance is supposed to be objective.


