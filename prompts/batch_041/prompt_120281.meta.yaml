  preferences), or with Arrow''s theorem. That''s a lovely subtle confusion: a sincere
  question that conflates Condorcet''s paradox of voting (cycling majorities) with
  the rational-choice paradox of voter turnout (Downs, Tullock, Riker & Ordeshook).
  A good answer would notice the equivocation and separate them.


