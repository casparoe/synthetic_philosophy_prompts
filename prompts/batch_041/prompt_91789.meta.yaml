  Positions (leaves):

  1. Shape-intrinsic: ''a'' is a geometric/topological property of the figure itself
  (closed bowl + stem etc.), graded maybe.

  2. Prototype/typicality: ''a'' is closeness to a stored prototype, membership is
  graded, no sharp line (psychological version).

  3. Family resemblance / no definition: no necessary and sufficient features; ''a''
  is a network of overlapping similarities, defined by use (Wittgenstein-ish; I can
  say "the Wittgenstein move" — that''s fine, it''s a well-known attribution and I''m
  not quoting).

  4. Contrastive/structural: ''a'' is whatever occupies a slot in a system of mutually
  distinguishing shapes; identity is relational to the other letters in the font/script.

  5. Social/conventional: ''a'' is whatever a community of readers will read as ''a'';
  facts about it are facts about conventions/practices.

  6. Style-emergent/generative: ''a''-ness is what a coherent style-generator produces;
  the identity of the letter and the coherence of the style are fixed together, and
  it''s partly emergent (Letter Spirit''s own view).

  7. Perceptual/psychological categorical: ''a'' is a basin of attraction in the visual
  system / categorical perception — identity is a fact about our visual system, not
  the shape or the convention.

  8. Deflationary: there''s no fact of the matter, only useful fictions/"a" is a word
  we use, the question dissolves; the interesting question is what work the category
  does.


  Note 2 vs 7 might not be separable; 4 vs 5 might not be separable on many cases;
  3 vs 8 might collapse. Good, the asker wants that flagged.


