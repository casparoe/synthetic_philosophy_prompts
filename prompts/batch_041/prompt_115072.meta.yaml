  velocity is undetectable while acceleration is detectable. So a refined reading:
  uniform velocity is undetectable but acceleration is not.)

  3. Kinematic relationalism: all motion is motion relative to some material body
  — so if the water spins, it spins relative to other bodies (the bucket walls, the
  stars, the air).

  4. Dynamical relationalism (Mach): the inertial effects are caused by / determined
  by the distribution of all other matter — so "relative to the fixed stars" is not
  just a frame choice but a dynamical dependence. Mach''s principle.

  5. Gauge/conventionalism about GR: in GR, absolute motion has no meaning because
  coordinates are arbitrary; but the metric field is a real, non-relative entity —
  which is arguably substantivalism about the metric (or "dynamical relationalism").

