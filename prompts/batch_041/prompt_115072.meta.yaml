  Readings of "we simply do not know" (as a claim about economic knowledge):

  1. Literal: for some future events there is no probability at all — the outcome
  set is not even determinate / no distribution exists (ontological open future).

  2. Epistemic-but-quantitative: there IS a probability, we just can''t measure it
  (Keynes''s non-numerical probabilities in the Treatise — probabilities that are
  not comparable with each other or not measurable on a scale).

  3. Weight-of-evidence reading: the probability may be knowable but the weight (amount
  of relevant evidence) is low; uncertainty = low weight. This is the in-the-weeds
  bit and connects to the Treatise''s "weight of the argument."

  4. Psychological/confidence reading: it''s about the state of mind of decision-makers,
  their confidence, which is a fact about them, not about the world (and this is the
  one that matters for animal spirits).

  5. Knightian: risk vs uncertainty distinction (measurable vs not) — and whether
  Keynes''s view maps onto it (dispute: Keynes is a "logical" probabilist, not a subjectivist;
  the Knightian reading may be a misappropriation).

  6. Methodological/forecasting reading: econometric forecasts of the far future are
  unreliable, so policy should not lean on them.

  7. The pragmatic/conventional reading: since we don''t know, we fall back on convention
  (Keynes''s ch.12 point about convention, and the "state of long-term expectation"
