  the museum commissioned a hand-painted facsimile that its own conservators concede
  is indistinguishable under normal viewing conditions, and it now lends the facsimile
  to international exhibitions while keeping the original in a climate-controlled
  vault. At the same time, when a different work in its collection was exposed as
  a forgery—painted in the 1920s to look like a Renaissance panel—the museum did not
  deaccession it or store it away. It moved the forgery into a small gallery called
  ''Provenance and Error,'' where it is displayed as a historical document of deception,
  with the forger''s name on the label. The museum also permits digital ''restorations''
  that fill in lost sections of a painting, provided the additions are visible under
  ultraviolet light, and it refuses to sell or gift any of these replicas as if they
  were originals. The director tells me, without irony, that the museum is ''in the
  business of preserving encounters with works, not fetishizing objects.'' Yet the
  museum will not allow the facsimile to be described in the catalogue as ''the painting,''
  and it has spent a fortune on a new provenance database that traces the chain of
  ownership of every original down to the dealer."


