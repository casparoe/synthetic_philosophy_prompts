  Because the original is too fragile to travel, the museum commissioned a hand-painted
  facsimile that its own conservators describe as indistinguishable from the original
  under ordinary viewing conditions; it now lends the facsimile to international exhibitions
  while the original stays in a climate-controlled vault. When a different work in
  the collection was exposed as a forgery—painted in the 1920s to pass as a Renaissance
  panel—the museum did not deaccession or destroy it. It moved the forgery into a
  small gallery called Provenance and Error, where it is displayed as a historical
