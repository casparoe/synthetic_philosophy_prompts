  Background, briefly, since I''m not asking you to know the literature: Malcolm''s
  line (which he takes from Wittgenstein, I think) is that a dream can''t exist independently
  of the waking impression — the memory and the report you wake up with, plus whatever
  you say when someone shakes you awake mid-dream. There''s no criterion for the identity
  of the bear in my dream, or for how long the dream lasted, or for whether the dream-bear
  was the same bear as yesterday''s, other than the story I tell. So there''s no sense
  to be made of "what it was really like in there" apart from the report. Dennett,
  if I''ve got him right (I''ve read him once and probably badly), thinks this whole
  way of setting it up is off: asking what I "really experienced" at 3 a.m. smuggles
  in a picture of a dream-narrative playing out in real time during sleep, and once
  you drop that picture, the question doesn''t get a No, it gets dissolved — you stop
  asking it.


  Here''s my reconstruction. I''ve made the Malcolm move into a general principle,
  and I think that''s where the trouble is, but I can''t see the flaw.


  (1) If I dreamt I was chased by a bear, everything there is to know about the dream
  is fixed by the waking report: the memory I come out of sleep with, what I say,
  how I flinch when you wake me.


  (2) Suppose instead there were a further fact — a fact about what I actually experienced
  at 3 a.m., over and above the report. Then it would be possible in principle for
  that fact to obtain and leave no trace at all: I forget the dream completely, nobody
  wakes me, nothing about my later life differs. From every point of view, including
  mine, the world would be exactly as it is now.


  (3) A difference that makes no difference anywhere, ever, even in principle, is
  not a difference. So there is no fact of the matter about whether I had an experience
  at 3 a.m.


  (4) If there''s no fact of the matter about whether I had an experience, then I
  didn''t have one. You can''t have an experience without it being true that you had
  it.


  (5) So dreams are not experiences. "I dreamt I was chased by a bear" is a story
  I''m disposed to produce on waking, not a report of an experience.


  (6) And since nothing in the argument turns on the dream being a dream — I only
  used the fact that a dream can be wholly forgotten and leave no trace — the same
  reasoning applies to any experience that is forgotten or otherwise leaves no mark.
  Which I think is the "proves too much" bit: it would mean an experience I had and
  forgot never happened, and it would mean there''s nothing it''s like to be an infant
  or a dog or someone under anesthesia, not because of anything about their minds
  but just because they can''t file a report. It would also mean the question is settled
  a priori, which seems wrong given that people woken out of REM sleep usually have
  something to say about what they were just doing.


  I''d rather not give up (4) or (5) if I can help it — I think (5) is probably right
  and I like it. But (6) is a reductio and I can''t tell whether it''s a reductio
  of (1), of (2), or of (3).


