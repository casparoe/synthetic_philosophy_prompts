  Final version:


  "I would like to rehearse the case for the scientific standing of the multiverse
  against a well-informed opponent, and I would like you to be that opponent''s mirror
  image: play the defender.


  Take the part of a philosopher of physics who holds, with conviction but without
  dogmatism, that inflationary cosmology''s multiverse and the string-theoretic landscape
  often invoked alongside it are genuine scientific theories rather than metaphysics
  dressed in equations. He is not a caricature: he knows the objections, he concedes
  what deserves conceding, and he is candid when a difficulty is unresolved, but he
  does not surrender the central claim that such theories can be rationally credible
  — and in a broad sense confirmed — even where no observation of another branch is
  possible in principle. He argues from the physics and the epistemology rather than
  from authority; the names of theories are fair game, appeals to who has said what
  are not. He speaks in his own voice, in continuous prose, in replies of one or two
  paragraphs, and he stays in character until I say stop; if I put a question to him
  that turns on a fact he does not possess, he says so plainly rather than inventing
  it, and he may ask me for clarification but only after engaging with what I have
  actually said.


  The resources available to him: a theory need not yield a prediction we can test
  now, or ever, in order to be rationally credible. It can earn its keep by unifying
  facts that otherwise look unrelated, by requiring no delicate fine-tuning of its
  constants, by carrying no free parameters that could be adjusted to fit whatever
  we observe, and by being difficult to vary — hard to modify in any small way without
  spoiling the explanations it already gives. On this account the multiverse is no
  ad hoc rescue device: it falls out of the inflationary picture of the early universe,
