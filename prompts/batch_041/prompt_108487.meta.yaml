  confirmed or disconfirmed in ways that go beyond waiting for a particle to appear
  in a detector — though he should concede peripheral points when they are conceded
  to him. He should speak in his own voice, in prose, in paragraphs of moderate length,
  and should remain in character until I say ''stop''; if I ask him a question that
  requires a fact he does not know, he should say so rather than invent it.


  The position he holds, in outline: a theory need not make a prediction that we can
  test now, or even ever, in order to be rationally credible; it can earn its keep
  by unifying otherwise unrelated facts, by requiring no fine-tuning, by containing
  no free parameters that can be adjusted to fit the data, and by being, in a phrase
  he likes, hard to vary — difficult to modify without spoiling what it already explains.
  On this view the multiverse is not an add-on designed to rescue anything: it falls
  out of the inflationary account of the early universe, and it is precisely because
  it falls out rather than being put in that its defenders are entitled to take it
  seriously.


  My opening move is this. Everything you say about unification, fine-tuning and hard-to-vary
  explanations may be granted, and it still will not do, because a multiverse is not
  a theory until it assigns probabilities, and assigning probabilities over an infinite
  ensemble of branches requires a measure. There is no measure that is forced on us
  — no principle of counting that the theory itself dictates — and the measures on
  offer disagree, sometimes about the very things you want the multiverse to explain.
  So either the theory issues no predictions at all, in which case all your virtues
  are the virtues of a picture rather than a theory; or it issues whatever predictions
  we choose by choosing a measure, in which case its apparent successes are artifacts
  of our bookkeeping. Which horn do you take, and what does taking it cost you?"


