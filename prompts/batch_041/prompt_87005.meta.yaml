  Draft:


  "I''m preparing a session for a graduate reading group on the intellectual prehistory
  of AI risk, and the figure I keep returning to is John von Neumann — partly because
  he died in early 1957, before the word ''software'' was in wide use, before the
  internet, before recombinant DNA, and before anyone had thought seriously about
  machines that train themselves on human text, and partly because he left behind
  an unusually specific set of commitments to reason from. I want you to do the historical
  counterfactual carefully: reconstruct what von Neumann would plausibly have thought
  about a handful of developments that postdate him, and show your work at the level
  of his arguments rather than his reputation. Treat as fixed points the things he
  actually argued — his insistence that technological progress is outrunning the geographical
  and political units that could contain it (the essay he published the year he was
  diagnosed, whose title asks whether we can survive technology at all); his picture
  of the nervous system as a computing organ built out of unreliable components that
  buys reliability statistically, and his suspicion that the brain''s ''language''
  is not the language of mathematics; his architecture for self-reproducing automata,
  in which the description of a machine is copied without being interpreted and thereby
  avoids an infinite regress; his game-theoretic claim that two-person zero-sum conflict
  is fully analysable while many-person games are not; and the hawkish Cold War posture
  that made him, for many of his colleagues, the most alarming voice in the room.
  The remark he is now most often quoted for — that accelerating technological change
  gave the appearance of approaching an essential singularity in human history, beyond
  which human affairs as we know them could not continue — survives only as a friend''s
  recollection of a conversation, so treat it as suggestive rather than as a doctrine.


  Then work through the following, giving for each a prediction, the specific von
  Neumann argument it rests on, and a confidence level: (1) LLM-based systems, and
  the claim that a machine could acquire general competence by absorbing human text
  at scale; (2) the alignment problem — whether he would have seen the difficulty
  as one of controlling a smarter agent, as a problem of values, as an ordinary engineering-reliability
  problem of the kind he solved with redundancy, or as ill-posed; (3) AI competition
  between states, read as a game he would have called zero-sum, and whether that reading
  survives contact with the modern literature on arms races and ''unilateralist''
  temptations; (4) surveillance and social media as ''easier controls of human actions
  and reactions'' — his phrase for one of the three forces the industrial revolution
  made available; (5) climate engineering, which he already anticipated with equanimity
  and even enthusiasm; (6) engineered biology and machine self-replication as two
  versions of the same worry; (7) the digital copying of persons, minds, or models,
  given his account of self-reproduction; and (8) the modern existential-risk idiom
  itself — whether he would have recognised it as continuous with his own ''can we
  survive'' question or regarded it as a moralising distortion of a strategic problem.


  Finally, and this matters more to me than the individual verdicts: tell me where
  the exercise breaks down. Where would von Neumann''s own commitments have made him
  a poor guide — his confidence in rational management, his willingness to think in
  terms of preemptive strikes, his indifference to distributive questions, or the
  reported turn to religion at the very end of his life, which his friends and biographers
  have read in incompatible ways? Where is the honest answer ''we cannot know, because
