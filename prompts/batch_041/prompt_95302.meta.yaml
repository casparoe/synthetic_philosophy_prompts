  Setting: A graduate student in metaphysics, working on the metaphysics of time,
  has built an argument.


  Steps:


  (1) Truthmaker maximalism: for every true proposition, there is something in the
  world whose existence makes it true (its truthmaker). Call it T.

  (2) "There were dinosaurs" (or "some dinosaurs existed") is true.

  (3) Presentism: the only things that exist are present things — past and future
  things do not exist at all.

  (4) A truthmaker must exist. (Truthmaking is an existence-entailing relation: only
  what exists can make something true.) — this is plausible and standard.

  (5) So if presentism is true, the truthmaker for "there were dinosaurs" is something
  present.

  (6) The present candidates: (a) the present state of the world bearing a property
  like "being such that dinosaurs existed"; (b) an abstract representation, existing
  now, that encodes how things were (an "ersatz" past); (c) no truthmaker at all,
  but a primitive fact that the proposition is true.

  (7) Each of (a)-(c) fails: (a) is circular — the property is individuated by the
  very fact it''s supposed to ground, so it presupposes rather than explains the truth
  of the proposition; (b) an abstract representation''s content is fixed by what it
  represents, so it too presupposes the past it''s supposed to ground (and its existence
  doesn''t explain why that content is true of the actual world rather than merely
  possible); (c) simply denies (1).

  (8) So under presentism, "there were dinosaurs" has no truthmaker.

  (9) By (1), if it''s true it has a truthmaker; so it has no truthmaker only if it''s
  not true.

  (10) So presentism entails that "there were dinosaurs" is not true. [Absurd]

  (11) Therefore presentism is false.


