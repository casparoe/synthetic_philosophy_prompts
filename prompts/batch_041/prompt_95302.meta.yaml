  Background: I''m a graduate student working on the metaphysics of time. I hold a
  fairly standard package: presentism (only present things exist), truthmaker maximalism
  (every true proposition has something in the world whose existence makes it true),
  and the view that truthmaking is existence-entailing, i.e. only what exists can
  make anything true. A friend in my department has built the following argument and
  now insists it shows presentism is self-undermining. I can''t find the exit.


  (1) Every true proposition has a truthmaker: something whose existence makes the
  proposition true.

  (2) The proposition that some dinosaurs existed is true.

  (3) Truthmaking is existence-entailing: only existing things can make propositions
  true.

  (4) If presentism is true, then the only things that exist are present things. (So
  a truthmaker for any truth must be something present.)

  (5) Therefore, if presentism is true, the proposition that some dinosaurs existed
  has a truthmaker that exists now.

  (6) There are only three kinds of candidate for that present truthmaker: (a) the
  present world (or its present state) bearing a higher-order property such as being
  such that dinosaurs existed; (b) a present abstract object that represents how things
  were — a representation whose content is fixed independently of any real past; or
  (c) no truthmaker at all, with the truth of the proposition taken as brute.

  (7) None works. Candidate (a) is circular: the property is individuated by the very
  fact it is supposed to ground, so the property''s existence already presupposes
  that dinosaurs existed rather than explaining it. Candidate (b) makes truth depend
  on what our representations happen to say rather than on how the world is; and the
  representation''s content cannot be fixed without presupposing the past it is meant
  to ground. Candidate (c) simply abandons (1).

  (8) So if presentism is true, the proposition that some dinosaurs existed has no
  truthmaker.

  (9) By (1), a true proposition has a truthmaker; so if the proposition has no truthmaker
  it is not true.

  (10) So presentism entails that the proposition that some dinosaurs existed is not
  true.

  (11) Therefore presentism is false.


  Here is my problem. The argument''s engine — maximalism, existence-entailment, and
