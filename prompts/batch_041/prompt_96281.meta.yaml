  reproductive, thermodynamic, evolutionary — and then ticking off viruses and prions
  as ''borderline''. My students have all read the usual material; what they have
  not done is think about why the borderline cases are borderline.


  The crux I want the question to force is this. I have come to suspect that ''is
  it alive?'' is really two different questions that the literature runs together:
  whether a system now sustains itself and holds itself away from equilibrium — call
  it the standing question — and whether it belongs to a lineage with a selective
  history — call it the lineage question. A virus answers the second as well as a
  bacterium does and the first not at all; a mule answers the first and not the second;
