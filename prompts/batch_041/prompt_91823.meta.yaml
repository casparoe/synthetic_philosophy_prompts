  Dependency structure for teaching Jeffrey conditionalization:

  1. They must already have conditionalization (Bayes'' rule as update) and the notion
  of a partition, and the rigidity condition.

  2. Then the motivating case: uncertain evidence — perception, testimony, a reading
  off an instrument that''s noisy; you don''t come to be certain of a proposition,
  your probabilities shift across a partition.

  3. Then the rule itself: P_new(A) = sum over partition cells of P_old(A | E_i) P_new(E_i).
  Key: the likelihoods (P_old(A|E_i)) are held fixed — rigidity; only the weights
  over the partition change.

  4. Then why it''s not just conditionalization in disguise: the tempting reduction
  — treat "my credence in E is 0.7" as the certain evidence proposition and conditionalize
  on that. Problems: it changes the algebra, it makes the rule vacuous or wrong in
  some cases, and it requires a prior over your own future credences. This is a classic
  misconception.

  5. Then the order-dependence/non-commutativity of successive Jeffrey updates — a
  key contrast with conditionalization. This is a big deal and a good misconception
  to head off.

  6. Then the hard limit: constraints that aren''t of the form "new probability for
  each cell of a partition" — e.g., a constraint on a conditional probability or a
  constraint on the probability of a disjunction that cuts across the partition. That''s
  where the Judy Benjamin-style case comes in, and where the rule underdetermines
  the answer, and where competing principles (minimizing relative entropy / max entropy)
  enter. That''s the "leave out at this level" or the culminating piece depending
  on level.


  Misconceptions:

  - "Jeffrey conditionalization is just conditionalization where you''re less sure"
  — no, it''s a different rule; you can''t recover it by conditionalizing on a proposition
  about your own credence without extra assumptions.

  - "Rigidity is automatic" — no, it''s a substantive constraint; there are cases
  (e.g., where the observation itself is informative about the relation between A
  and E) where it fails.

  - "Order doesn''t matter" — for conditionalization on propositions it doesn''t (commutes
  when both are learned for certain), but for Jeffrey updates it generally does; the
  path-dependence is a feature that needs to be addressed.

  - "The rule is forced by Dutch book / coherence" — it''s sufficient but not necessary;
  max-entropy and other rules also avoid Dutch books. So JC is not uniquely justified.

  - Confusing the partition with the evidence; thinking the partition must be the
  evidence proposition and its negation.

  - Thinking Jeffrey conditionalization handles any uncertain evidence whatsoever,
  including conditional constraints.


