  who reads philosophy has been trying to persuade me that the scene is incoherent,
  and his argument is this.


  (1) Nothing is a work of art unless a community of makers and appreciators — an
  artworld, in the loose sense — treats it as one; the status is conferred, not discovered.

  (2) An artworld is not a thing but a practice, and a practice of treating things
  as art can only exist where there are already works of art being treated in that
  way.

  (3) So any work of art requires an artworld, and any artworld requires prior works
  of art.

  (4) Every such requirement must therefore be met by an earlier work of art, and
  by an earlier one still, without end.

  (5) But there can be no completed infinite series of creations, each waiting on
  the next.

  (6) Therefore there is no first work of art — and so, on this account, no works
  of art at all.


  I take the conclusion to be absurd, obviously; my novel is full of the things. But
  I also want to keep (1), because everything I have ever seen in a gallery, and everything
  I have ever written, seems to depend on a community having decided to count it.
  Which step should I give up, and what would giving it up cost me? I would rather
  sacrifice an abstract principle than the scene, but I would like to know which I
  am paying with. Please write your answer in British English."


  Hmm, the premise (2) as phrased: "a practice of treating things as art can only
  exist where there are already works of art being treated in that way" — this is
  the crux. The flaw might be that an artworld need not contain artworks: it can contain
  proto-art or objects treated as art-*like*, or the practice can constitute the first
  work (a practice of making special marks need not be art-constituting). Also time-indexing:
  the cave mark could become art only retrospectively once the practice exists; being
  art isn''t a property it had at t1 but a status it acquires. Or the regress is benign
  if we allow that status conferral can be retroactive/self-referential (as in Levinson''s
  historical theory: x is art iff it''s intended to be regarded as earlier artworks
  were regarded — that also has a regress, terminating in something regarded as art
  non-historically? Levinson''s own account: earliest art is art in virtue of being
  intended for regard as some earlier artworks were regarded... he bites the bullet
  that there is a first artwork whose status is non-inherited? Actually Levinson says
  the first artworks are art because they were intended to be regarded in ways that
  earlier non-art objects (like ritual objects) were regarded — "the first artworks
  were intended for regard as certain non-art objects were regarded" — so the regress
  terminates in non-art objects regarded in certain ways. That''s a neat resolution:
  the chain needn''t run through artworks forever; it can exit into non-art objects
  and their modes of regard.) That''s a lovely resolution to include as a possible
  answer, and it shows the argument''s step (3)/(4) equivocates: "requires prior works
  of art" vs "requires prior objects regarded in a certain way". So the flaw: the
  argument assumes the practice must be constituted by artworks, whereas it can be
  constituted by modes of regard directed at non-art things. Good.


  Also the option of rejecting (1): cost = can''t explain why a urinal in a gallery
  is art and the same urinal in a plumber''s shop isn''t (or why readymades count),
