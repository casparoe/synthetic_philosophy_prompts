  Here''s my opening. Reconstruct the argument as: (i) we cannot conceive of any sensible
  thing existing unconceived; (ii) whatever cannot be conceived is impossible; (iii)
  therefore no sensible thing exists unconceived; hence sensible things exist only
  when perceived. My objection is that (i) is ambiguous between two claims, and the
  argument needs one of them and can only get the other. Read one way, (i) says that
  the act of conceiving something as unconceived is a self-undermining exercise —
  the moment I frame it I have conceived it, so what I was trying to do cannot be
  done. That is a fact about my mental act, not about the object I was trying to think
  about, and it would be equally true of any attempt to think about anything at all
  that is not being thought about, including things Berkeley has no quarrel with.
  Read the other way, (i) says that a thing''s existing unconceived is itself an impossible
  state of affairs, which is exactly the conclusion, so the premise begs the question.
  Which reading does he want, and how does the argument survive on either? If he says
  the two readings come to the same thing, I''d like to know how, given that the first
  is about a task I cannot complete and the second about a situation that cannot obtain."


