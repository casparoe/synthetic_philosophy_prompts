  I''m a philosophy student taking a seminar on Gödel''s theorems and the philosophy
  of mind, and the final paper is an open-topic essay. I''ve settled on a defence
  of a restricted version of the Lucas–Penrose argument, but the outline below has
  three moves in it that I suspect do different amounts of work, and I''d rather find
  that out now than after I''ve written twelve pages. Please comment on the outline.


  Where I start. Let S be an effectively axiomatized, consistent system of arithmetic;
  Gödel gives a sentence G_S unprovable in S and true if S is consistent. Lucas''s
  claim is that a human mathematician can see that G_S is true, so no such S is the
  human''s mathematical capacity.


  Move 1 — factivity. The usual objection is that seeing that G_S is true just is
  knowing that S is consistent, since G_S is provably equivalent to Con(S) over elementary
  arithmetic, and a consistent system cannot prove its own consistency; so the human''s
  alleged insight either is unwarranted or exceeds what knowledge she has. My reply
  is that the mechanist cannot treat S as merely consistent, because the mechanist''s
  claim is that S captures the mathematician''s knowledge, and knowledge is factive.
  If S''s theorems are things the mathematician knows, they are true, so S is sound;
  and from soundness the consistency of S follows, and then G_S. So the mechanist''s
  own commitment to knowledge hands the human the premise she needs.


  Move 2 — the extension ability. The obvious counter is that the move is self-defeating:
  the human who derives G_S from the soundness of S is reasoning in a system stronger
  than S, and that stronger system is itself a machine (add Con(S) as an axiom and
  continue). So the argument shows at most that for any system there is a stronger
  one. Here I want to appeal to Turing''s ordinal logics: a machine can be programmed
  to iterate consistency axioms along a sequence of ordinal notations, but the choice
  of how to extend a given system at each stage is not itself dictated mechanically,
  and it is this choosing capacity — not any particular system — that the anti-mechanist
  identifies with the mathematician''s mind. The mechanist then has to show that the
  capacity is effective; if it is, it is a machine and Gödel applies to it; if it
  is not, mechanism is false.


  Move 3 — what I take to be the weakest part. For the argument to reach "the human
  is not S" rather than "the human is not S for each S", the insight has to be uniform:
  one and the same capacity, exercised on any system presented to it. But uniformity
  seems to require an effective procedure for identifying the system and generating
  the sentence, which is just what move 2 denies. And there is a harder version of
  the worry: the argument''s premise "the human can see the truth of G_S" is a claim
  no actual human can make good on for a system like ZFC, whose consistency nobody
