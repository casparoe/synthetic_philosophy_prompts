  \ political sense), \"cultish epistemics\", \"testimonial injustice\".\n\nBut which\
  \ is best for a decision tree? The paradox of fiction is very clean for a decision\
  \ tree: a small number of yes/no questions generating a logical space of 8-16 cells,\
