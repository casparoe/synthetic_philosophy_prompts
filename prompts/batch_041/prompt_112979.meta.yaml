  Draft:


  I have been reading rationalist blogs and forums for the better part of fifteen
  years, and I have finally written something of my own that I would like a second
  opinion on before I post it. It is an essay about Dennett''s four kinds of creatures
  — Darwinian, Skinnerian, Popperian, Gregorian — and the argument, in brief, is that
  the ladder is really two ladders that have been fused. As I put it in the draft:
  the first three rungs are ordered by where the test happens relative to the organism
  — the hypothesis dies as the organism dies; the hypothesis dies as a behaviour is
  punished; the hypothesis dies as a simulation is discarded, so that the mistakes
  are made on the drawing board rather than in the flesh. The fourth rung is not further
  along that axis at all. Gregorian creatures are still doing what Skinnerian and
  Popperian creatures do; what changes is where the record of the tested hypotheses
  is kept. The genome was the first public store — shared, cumulative, transmitted
  across generations, but slow and effectively uneditable. Operant conditioning moved
  the record inside the individual, where it is fast and revisable but private, and
  dies with its owner. Then notation and words moved it back out again into a public,
  cumulative, and now editable medium. On that reading the Gregorian rung is the re-externalisation
  of memory that the genome once provided, and the ladder is not a sequence of increasingly
  intelligent ways of testing hypotheses but an alternation between private and public
  storage; the tell, I claim, is that you can be maximally Gregorian while being barely
  Popperian (someone following a recipe or a spreadsheet they could never have derived)
  and maximally Popperian while being Gregorian only in a thin sense (a solitary mathematician
  who reasons well and writes nothing down).


  The part I am least sure of is a fifth category I want to add at the bottom of the
  revised picture, which I have been calling the clerical rung: creatures that inherit
  a procedure from the public store and execute it competently without being able
  to generate, evaluate, or repair the hypothesis behind it. The clerk is not a Skinnerian
  (nothing is being shaped by reinforcement in him), not a Popperian (he never runs
  the simulation), and not Gregorian in Dennett''s sense of a mind restructured by
  its tools (he is downstream of the restructuring but did not undergo it). If that
  category is real, it is where a lot of the interesting questions about contemporary
  systems actually live, and it also predicts something I find uncomfortable: that
  a culture can become more clerical while becoming less Popperian, and that this
  would look like progress on every measure that tracks competence rather than comprehension.


  What I want from you is comments, not a rewrite, and not a reading list — I am not
  interested in being told which texts to consult, and I would rather you assess the
  argument on its own terms than tell me what Dennett really meant; if you think I
  have misread him, say what you take the correct reading to be and why, but do not
