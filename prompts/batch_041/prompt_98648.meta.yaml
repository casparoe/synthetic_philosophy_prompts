  I am preparing a long-form interview with a philosopher who defends a view she calls
  asymmetric debunking. Her claim is that evolutionary explanations of moral belief
  undermine the epistemic warrant of moral beliefs that purport to track stance-independent
  normative facts, but do not undermine moral beliefs that are understood as commitments
  within a practice of mutual justifiability. She insists the relevant divide is not
  realism versus anti-realism, but tracking versus constituting: a belief is tracking
  when its function is to represent a fact that obtains independently of the practice,
  and constituting when its function is to articulate a commitment that partly makes
  the practice what it is. She also holds that the debunking challenge is at bottom
  a challenge about the etiology of representational purport, not about the truth
  of moral claims.


