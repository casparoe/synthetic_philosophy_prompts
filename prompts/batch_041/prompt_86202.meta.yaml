  Draft:


  "In my philosophy club, we have been debating whether philosophy has anything to
  offer the sciences, and I have found myself persuaded by a view I would like to
  state as sharply as I can. The view is this: philosophy is useful to science only
  as scaffolding is useful to a building. While a field is still forming, philosophical
  reflection can help clarify its concepts, expose hidden assumptions, and suggest
  fruitful questions. But once the field has matured and developed its own empirical
  methods, the scaffolding is no longer needed; continued philosophical engagement
  is either decorative or a sign that the science has not yet grown up. On this view,
  the philosophy of science is not a source of knowledge about the world, and the
  scientist who ignores it loses nothing of scientific value.


  I would like you to tell me what would count against this view. I am not looking
  for a survey of the debate or for a list of famous scientists who disagreed. I want
  a map of the position''s exposure. What observations, arguments, historical episodes,
  or conceptual results would count against it? Which of these would be decisive,
  and which merely awkward? What would a committed defender of the scaffolding view
  concede as counting against them, and what would they dismiss as irrelevant? I am
  especially interested in cases from mature sciences where a philosophical question
  seems to persist or even to be unavoidable: for instance, the measurement problem
  in quantum mechanics, the debate over what a species is in biology, or the question
  of what a gene is. Do these count against the view, or can they be redescribed as
  immature science? I would also like to know whether the view risks anything at all,
  or whether it has been qualified into unfalsifiability by the clause about maturity.
  If it has, is that a problem for a view of this kind? Finally, tell me which defeaters
  you think I, as someone sympathetic to the view, should find most persuasive, and
  which I should be able to answer without giving up the core claim."


