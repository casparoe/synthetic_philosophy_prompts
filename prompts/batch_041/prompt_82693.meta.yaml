  occur; and that the country rankings and governance indicators they publish are
  measuring one thing across very different societies. Within this side there is a
  further split I find telling: some treat corruption as a principal–agent problem,
  in which a venal official betrays a well-intentioned principal, while others treat
  it as a collective-action problem, in which everyone is trapped in an equilibrium
  no individual can exit alone.


  The second side holds that much of what the first side calls corruption is a system
  of reciprocal obligation — gifts, favours, loyalty to kin and patrons — with its
  own internal moral logic, and that to call it corruption is already to have applied
  a market-state, Western standard that the participants do not share. On this view
  the indicators measure little more than distance from an idealized Western bureaucracy.


