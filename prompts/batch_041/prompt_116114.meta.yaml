  Exam question:

  "In a few paragraphs, explain the disagreement between Dennett and Searle over original
  vs. derived intentionality. Use Dennett''s two-bitser example and Searle''s Chinese
  room to illustrate. Then apply the disagreement to the following case: a smart thermostat
