  ---


  I''m a third-year PhD student in philosophy of biology (joint with cog sci, long
  story) and I''ve been volun-told to run next month''s session of our reading group.
  The topic is teleology without minds — the idea that there might be genuine reasons
  in the world even where nothing is doing any reasoning. I know the literature on
  functions and representation well enough, and so does everyone in the room, so please
  don''t give me citations, a reading list, or a bibliography — a model that can''t
  check anything would just be guessing at titles and years anyway, and that''s not
  what I need. What I want is the logical space drawn on one page: a decision tree
  that a room full of grad students can walk down, each answering for themselves,
  and land on a named position about whether there are reasons without reasoners.
  Start the tree from a commitment I can assume almost everyone shares — something
  like "natural selection produces traits that look designed even though nothing designed
  them, and that appearance of design is not simply an illusion" — and then branch
  only on questions that actually split the positions. Think hard about what those
  questions are before you commit: is the for-ness of a trait fixed by its selection
  history or by what it currently contributes to a system; does anything have to represent
  the goal for the rationale to be about something, or can the aboutness ride on the
  selection process itself; does the position allow a trait to malfunction, or is
  it all just statistics about typical performance; and is the rationale there whether
  or not any interpreter — actual or possible — could read it off. Phrase every node
  as a question someone can answer without already knowing which leaf it leads to
  (no "are you a Millikan-style etiological functionalist?" nodes), and put the positions
  at the leaves, including at least: the view that the rationale is real but genuinely
  free-floating, the view that functions are constituted by selection history, the
  view that function is just a causal role in a system, the as-if/instrumentalist
  view that there''s no fact of the matter, the eliminativist view that the whole
  vocabulary should go, and the neo-Aristotelian view that life-form teleology is
  real and not grounded in selection at all. If some leaf needs a name and doesn''t
  have one, say so and coin one.


  Test the tree against cases that I think pull the positions apart, and tell me if
  any of them don''t: a slime mould that leaves food behind in a pattern that amounts
  to solving a maze; a bacterium running and tumbling up a sugar gradient; a river
  that takes the shortest route to the sea (this one''s my favourite, I suspect it
  breaks several views); a feather selected for warmth that gets co-opted for flight,
  where I''m never sure whether the rationale is the old one, the new one, or both;
  a molecule that by sheer chance folds into a shape that happens to catalyse something,
  with no history and no interpreter; an immune system that seems to identify a pathogen;
  and a chatbot fine-tuned on human approval that behaves as if it wants to be liked,
  where the gradient descent is doing something that looks a lot like reasoning. For
  each leaf give the position''s name (or "unnamed"), one sentence on the most awkward
  commitment it has to swallow, and which of the cases it handles worst. Also flag
  any pair of leaves your tree can''t actually seperate — I''d rather see "these two
  are empirically identical, they differ only in what grounds the normativity" written
  down than have the tree pretend to distinguish them — and mark any combination of
  answers that no one occupies, with a one-line diagnosis of why (incoherent, unattractive,
  or just unexplored). Keep it to maybe eight to ten leaves and no more than about
  six branch nodes; if it can''t be done that small without collapsing real distinctions,
  tell me that instead of trimming.


  Last thing: I''d much rather you push back than be polite. If the way I''ve set
  this up is confused — if, say, the free-floating option isn''t a stable location
  in the space but just a way station between two others, or if some of the "positions"
