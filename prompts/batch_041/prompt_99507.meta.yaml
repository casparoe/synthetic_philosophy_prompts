  Domain: free-floating rationales — reasons without reasoners.


  Central question: When a natural system behaves as if it were solving a problem
  (or a trait exists as if designed for a purpose), is there a genuine reason "in
  the world" — a rationale that is normative and about something — even though nobody
  entertains it? Or is the normative "for" always relative to an interpreter/interest/selection
  history?


  The tree should start from a starting commitment that a student can affirm without
  knowing labels. Options for starting node:

  - "I accept that evolution produces adaptation without a designer, i.e., that a
  heart is for pumping blood in some sense that''s more than just ''it happens to
  pump.''" Then branch.


  Branch nodes:

  1. The Etiology/History node: Does the ''for'' depend on the trait''s selection
  history (what it was selected for), or can a trait have a function purely in virtue
  of its present causal contribution to a system''s capacity (systemic/role function)?
  → splits etiological (Millikan, Wright, Neander) vs systemic (Cummins). Also splits:
  a novel trait with no selection history (e.g., a mutation that happens to help)
  — does it have a function? A spandrel that''s now useful? An exaptation?

  2. The Representation node: Must the system represent the goal/state-of-affairs
  for the rationale to be genuinely "about" something, or can the aboutness be carried
  by the selection process itself (e.g., by correlation/covariance between trait and
  world)? → splits: no representation needed (Dennett''s free-floating rationales;
  also "teleosemantics" needs representation though), representation required (teleosemantics:
  content requires consumer systems; Millikan), representation required and only in
  organisms with the right kind of consumer systems.

  3. The Normativity node: Is there a fact about what the trait *should* do (can malfunction),
  or only statistical facts about typical performance? → splits normativism vs deflationary/instrumentalist.

  4. The Mind/Interpreter node: Is the rationale "free-floating" (exists independent
  of any interpreter) or does it depend on there being actual or possible interpreters
  (Dennett''s instrumentalism — "free-floating" is real but it''s real only relative
  to the stance)? → splits realism about rationales, instrumentalism/fictionalism,
  and the "it depends on whether there''s a possible interpreter" middle.

  5. The "mindless normative" node: If rationales are real and mindless, what grounds
  their normativity — selection history, life-form/teleological form (neo-Aristotelian:
  Thompson, Foot), or something like "objective probabilities of success"? Or is grounding
  normativity in non-mindful nature incoherent → eliminativism / quietism.


  Leaves:

  - (a) Dennettian free-floating rationales: real but "free-floating," grounded in
  selection history, no representation needed, normativity real but "instrumental-stance-relative."

  - (b) Etiological proper-function realism (Millikan-style): functions grounded in
  selection history; content requires consumer systems; rationales in the world but
  not free-floating — they''re the functions.

  - (c) Cummins-style systemic functions: no selection needed, function = causal contribution;
  rationales are "ascribed" by us; deflationary about normativity.

  - (d) Instrumentalism / as-if: there''s no fact of the matter whether the plant
  "avoids" shade; the rationale is a useful fiction.

  - (e) Eliminativism: "function"/"for" talk should be replaced; no rationales.

  - (f) Neo-Aristotelian/life-form teleology: rationales are real and irreducible,
  grounded in the form of life, not in selection.

  - (g) Interpretationism / "no stance, no rationale" but still realist-in-practice
  (Dennett''s own line, or Dennett-lite).

  - (h) Pan-agential / "everything has reasons" — maybe unattractive.

  - (i) "Objective Bayesian / propensity" view: the rationale is a fact about which
