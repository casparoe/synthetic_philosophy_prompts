  ---


  I have been in a reading group on Bayesian confirmation for the better part of a
  year, and we keep returning to the problem of old evidence without ever getting
  past the point at which the discussion began. I would like a diagnosis of the impasse
  rather than another solution to the problem.


  The shape of the difficulty is familiar enough. An agent is certain of some proposition
  e; a hypothesis h entails e; since P(e) = 1 for that agent, conditionalising on
  e cannot raise her credence in h, and the likelihood ratio does no work. Yet scientists
  evidently treat such evidence as strong support — the received historical examples
  are all cases in which a theory was accepted largely because it accommodated a fact
  that was already known. The responses we keep rehearsing fall into a few families,
  and each seems to us to fail for a reason that is itself contested. One family says
  the agent should conditionalise on a counterfactual credence function, one in which
  she does not yet know e; the objection is that this function is either undefined
  (if e follows from background knowledge she is certain of) or is the credence function
  of a different agent with different evidence, so that what has been computed is
  not the confirmation of h by e at all. A second family says that the agent is never
  fully certain of e — there is always some residual doubt, some possibility of having
  misdescribed or misderived it — so P(e) < 1 and the ordinary machinery applies;
  the objection is that the problem then dissolves only for agents whose grasp of
  the evidence is imperfect, and it is precisely the idealised agent of Bayesian theory
  for whom it was posed. A third family distinguishes the question whether e confirms
  h from the question whether the agent was *entitled* to her confidence in h, or
  whether the theory''s acceptance was rational; the objection is that this concedes
  the problem rather than solving it, and that the second question is the one we cared
  about. Around these three the group has arranged itself, and nothing any of us says
  moves anyone.


  My own suspicion — and I would like you to treat it as a hypothesis to be assessed
  rather than a position to be developed — is that the framing is at fault in a specific
  way. In each family the question is taken to be how the agent should conditionalise,
  given e and h. But in the historical cases, and in the idealisations we build from
  them, h was not sitting there waiting to be tested: it was constructed with e in
  view, chosen from a space of alternatives precisely because it entailed e. If that
  is right, then the evidence that matters is not e but the agent''s evidence about
  the process by which h came to be on the table — and no amount of care with the
  counterfactual credence function will help, because the missing datum is not e''s
  prior probability but the selection of h. The statistician''s analogy would be a
  fit computed on the same data used to choose the model''s form; there, everyone
  agrees that the remedy is to condition on the selection, not to imagine the data
  unobserved. I want to know whether something like this is the right diagnosis, and
  in particular whether it makes the dispute substantive, verbal, or a case of two
  parties answering different questions under one heading.


  So: diagnose the disagreement. Are the three families disagreeing about the facts
  of confirmation, about what a probability function is supposed to represent (an
  agent''s actual degrees of belief, an ideal logic of evidential support, or something
  in between), about which cases count as data, or about an unstated starting intuition
  — for instance that confirmation must be a relation between propositions rather
  than between a proposition and a history of inquiry? Is a hidden formal question
  doing the work — whether conditional probability is well defined when the conditioning
  proposition is certain, or whether confirmation is a synchronic or a diachronic
  notion? Or is the problem ill-posed in something like the way questions about what
  would have happened had the agent not known e are ill-posed when the agent''s epistemic
  state is partly constituted by knowing e? If the last of these is right, say so
  plainly and say what is left of the problem once it is granted.


  Then tell me what would count as progress under your diagnosis: a distinction we
  have been running together, a case that one family cannot accommodate, a formal
  result about conditionalisation with certain evidence, or a decision that the question
  should be replaced by another one. If you think nothing would move it — that the
  participants are separated by a starting intuition about what confirmation is for
  — I would rather hear that, with reasons, than a survey of the literature. Please
  do not give me a reading list; I want the diagnosis, the argument for it, and an
  honest account of what could change my mind.


