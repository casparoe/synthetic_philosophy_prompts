  ---


  I am setting the final examination for an upper-level undergraduate seminar in philosophy
  of mind, and I need one essay question on functionalism and multiple realizability.
  The paper is closed-book, each essay gets sixty minutes, and students are not expected
  to supply citations; the question must therefore be answerable entirely from the
  material printed on the paper and from what the course has already covered. My problem
  is that the obvious question — state the multiple realizability argument, then assess
  the standard objections — can be answered by recitation. I want a question that
  forces students to decide something.


  Please build the question around the following stipulations and case, which I will
  print on the paper itself. Students will meet them for the first time there.


  Stipulation 1. A system realizes a functional profile Shallowly when, over a stipulated
  range of inputs, it produces the same outputs as the target system, by whatever
  internal means. It realizes the profile Deeply when, in addition, its internal states
  can be sorted into kinds whose transition structure mirrors the target''s, so that
  the same counterfactuals hold: the same interventions on internal states produce
  the same transitions, and each state kind is sensitive to the same features of the
  input.


  The case. Two artificial systems are built to match a human''s nociceptive and affective
  organization as characterized in the course. The first, Lattice, is constructed
  from optical rather than electrochemical components; state for state and transition
  for transition, its internal organization is isomorphic to the human''s, and the
  isomorphism survives intervention: cutting or driving any of its internal pathways
  has the structural analogue of the effect it has in the human. The second, Register,
  matches the human''s entire input–output profile across the tested range — it discriminates
  the same stimuli, issues the same reports, avoids what the human avoids, and is
  altered in the same ways by the same externally applied interventions — but it achieves
  this by exhaustive case lookup: for each input it retrieves a stored entry and emits
  the stored output. No partition of its internal states corresponds to anything in
  the human. Outside the tested range it emits a fixed default.


  Then the deliverables: (i) the question, in three subparts with marks totalling
  twenty-five; (ii) a model answer of roughly seven hundred words; (iii) a marking
  scheme...


  Subpart constraints: (a) must require a verdict on whether the multiple realizability
  argument needs Deep or only Shallow realization, and whether Register satisfies
  whichever it needs; (b) must require an account of what restricting realization
  to the Deep notion costs — including at least one system that functionalists would
  want to count as a subject and that the restriction appears to exclude (a partial
  realizer, a range-limited realizer, or a realizer that needs external scaffolding);
  (c) must require a position on whether functional properties can be causally relevant
  given that realizers do the causal work, and whether Register makes that easier
  or harder.


  And marking scheme requirements: name the specific moves an A answer must contain
  and the specific errors that should cost marks; one line per error on how students
  typically go wrong; no marks for naming theorists or citing texts; the model answer
  must reach a verdict where the question admits one and, where it does not, must
  say exactly what would settle it; flag anywhere the question is ambiguous and how
  I should tighten it.


