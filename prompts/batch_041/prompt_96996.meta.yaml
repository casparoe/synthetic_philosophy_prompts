  I''m putting together my position on dispositions for a seminar and would like a
  consistency audit before I commit to it. Here is where I have landed.


  (i) Dispositions are real and irreducible. Fragility and solubility are genuine
  properties of their bearers, not abbreviations for patterns of behaviour or for
  claims about what would happen in this or that circumstance.


  (ii) A disposition is individuated by its characteristic stimulus and its characteristic
  manifestation. To be fragile is to be disposed to break when struck; to be soluble
  is to be disposed to dissolve when immersed. Two dispositions differ only if their
  stimulus-manifestation pairs differ.


  (iii) Dispositions are intrinsic to their bearers. Whether a particular glass is
  fragile is settled by the glass — its constitution and microstructure — and by nothing
  about its surroundings.


  (iv) Dispositions are causally efficacious. When a struck glass breaks, its fragility
  is among the causes of the breaking and citing it explains the breaking; dispositions
  are not idle bookkeeping introduced to save a theory of properties.


  (v) No conditional analysis of disposition ascriptions can be correct — that is,
  being fragile cannot be identified with being such that one would break if struck.
  Finkish cases (a spell that withdraws the fragility at the very instant of the blow)
  and masking cases (an intact fragility whose manifestation is blocked by a coating,
  an antidote, a gag) show both that a thing can have the disposition without manifesting
  it and that the manifestation can occur without the disposition.


  (vi) A disposition can be possessed and never manifested. An unexercised disposition
  is a real property of its bearer, not a mere potentiality awaiting actualisation.


  (vii) Verdict on a case: a glass wrapped in a shock-absorbing film that will keep
  it intact under any blow is still fragile. The film masks the fragility rather than
  removing it; strip the film away and the glass breaks as readily as any other, and
