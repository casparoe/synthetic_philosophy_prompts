  Call it the delayed mask. A glass is fitted with a coating that neutralises any
  impact — but the coating is itself destroyed by the first impact it neutralises,
  so the glass breaks a second later from a second, otherwise harmless tap. The glass
  never breaks when struck, but it always breaks shortly afterwards, because of a
  strike. I cannot tell whether to describe this as masking (so the fragility is intact
