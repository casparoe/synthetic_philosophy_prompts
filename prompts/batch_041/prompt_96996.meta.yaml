  "I''ve been working up a position on dispositions for a seminar and want a consistency
  audit before I commit it to paper. Here is where I''ve landed.


  (i) Dispositions are real, irreducible properties of their bearers. Fragility and
  solubility are not abbreviations for patterns of behaviour or for counterfactuals
  about behaviour; they are genuine properties that things have.


  (ii) A disposition is individuated by its characteristic stimulus and manifestation:
  to be fragile is to be disposed to break when struck, to be soluble is to be disposed
  to dissolve when immersed. Two dispositions differ just when their stimulus-manifestation
  pairs differ.


  (iii) Dispositions are intrinsic to their bearers. Whether this glass is fragile
  is settled by the glass — its microstructure and constitution — and not by anything
  about its surroundings.


  (iv) Dispositions are causally efficacious. When a struck glass breaks, its fragility
  is among the causes of the breaking, and citing the fragility explains the break;
  dispositions are not idle theoretical bookkeeping.


  (v) No conditional analysis of disposition ascriptions can be right. Cases of finkishness
  (a spell that removes the fragility at the very moment the glass is struck) and
  of masking (an intact fragility whose manifestation is blocked by an antidote, a
  coating, a gag) show that a thing can have the disposition and yet not manifest
  it, and can manifest it without having it.


  (vi) A disposition can be present and never manifest. An unexercised disposition
  is a real property of the thing, not a mere potentiality.


  (vii) Verdict on a case: I think a glass wrapped in a shock-absorbing film that
  will keep it intact under any blow is still fragile. The film masks the fragility;
  it does not remove it. If you stripped the film away the glass would break as readily
  as any other, and the film is nothing to do with the glass.


