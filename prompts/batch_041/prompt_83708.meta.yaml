  "I''m a third-year PhD student in philosophy, and I have to give the eulogy at my
  grandfather''s funeral on Saturday. He was a devout Catholic of the old kind — daily
  Mass, rosary, no interest in arguments for God — and the room will be mostly his
  parish and my aunts and uncles, along with a handful of people from my department
  who know I''m not religious. The trouble is that I''ve spent two years working on
  Wittgenstein''s later remarks on religious belief, and the thing that struck me
  there is that a believer''s words aren''t a hypothesis about how the world is: evidence
  for or against wouldn''t touch them, and asking him for his grounds would have been
  the wrong kind of question. That''s fine as a reading, but it leaves me with a practical
  problem. The standard consolation — ''he''s in a better place,'' ''he''s at peace,''
  ''he lives on in you'' — would be me asserting things I don''t believe, and saying
  plainly that he has simply stopped existing would be me asserting a hypothesis where
  his faith wasn''t one. What I want is a eulogy organized around a distinction I''ve
  been chewing on: the difference between asserting something and saying it with someone
  — between joining in his words because they were his and claiming them as mine.
  Where that works, the religious sentences in the speech should be his, handed back,
  not mine; where it doesn''t work, I want the comfort to come from describing what
  he did with those words and what it was like to be near it rather than from any
  claim about where he is now. Please write the eulogy, about six or seven minutes
  spoken. It has to be honest enough that I could deliver it without flinching, warm
  enough that my aunts don''t hear a seminar, and it must not explain Wittgenstein
  to a room of mourners — if the idea is in there at all, it should be doing work,
  not being announced."


