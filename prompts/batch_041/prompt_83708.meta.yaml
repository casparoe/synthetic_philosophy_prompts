  I''m a third-year PhD student in philosophy and I have to give the eulogy at my
  grandfather''s funeral on Saturday. He was devout in the old way — daily Mass, the
  rosary, no interest at all in arguments for God — and the room will be his parish
  and my aunts and uncles, plus a few people from my department who know perfectly
  well that I''m not religious. I''ve spent two years on Wittgenstein''s later remarks
  on religious belief, and the reading I''ve settled on is that his faith was never
  a hypothesis about how things stand: demanding his evidence, or offering mine, would
  have been a category mistake rather than a disagreement. That''s a fine thing to
  think and a hard thing to speak from. The ordinary consolation — that he''s in a
  better place, that he''s at peace, that he lives on in us — would have me asserting
  what I don''t believe; saying flatly that he has ceased to exist would have me asserting
  a hypothesis where there wasn''t one. So I want the eulogy built on a distinction
  I''ve been chewing on lately: between asserting something and saying it with someone
  — joining in his words because they were his, without claiming them as mine. Where
  that works, the religious sentences should be his, handed back; where it doesn''t,
  the comfort has to come from describing what he did with those words and what it
  was like to be near that, rather than from any claim about where he is now. Please
