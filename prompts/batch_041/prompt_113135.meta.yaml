  Script:


  "The terms-of-trade model begins from the thought that compromise is not the same
  as splitting the difference. When two parties with different value systems settle,
  each usually gives ground on a dimension it cares about less in order to get its
  way on a dimension it cares about more. This is structurally like trade between
  the butcher and the baker: both gain, not because they agree about what is valuable,
  but because they rank the goods on offer differently. The ''price'' of a compromise
  is the rate at which one side''s concessions convert into the other''s, and the
  set of settlements that leave both parties strictly better off than their disagreement
  point is the contract curve. The model''s real payoff is the distinction between
  concessive and integrative compromise. A concessive compromise is one in which each
  side simply lowers its demand, so that both end up with less than they wanted; an
  integrative compromise is one in which the parties restructure the dispute so that
  each gets more of what it actually values. The model predicts that integrative compromise
  is available whenever the parties'' rankings differ, even when the values themselves
  are wholly different in kind.


  The obvious objection is incommensurability. If two values share no common measure
  — if there is no unit in which both can be expressed — then there is no rate of
  exchange, and trade of the kind described seems impossible. This looks worse than
  a technicality. When we say that two values are incommensurable we mean that neither
  is worth more than the other, and that the two cannot be ranked at all; and where
  nothing can be ranked, no concession can be ''worth it'', because the notion of
  worth presupposes a common scale. So the model threatens to collapse precisely in
  the cases that matter most, namely conflicts between deeply different value systems
  rather than quarrels between people who want different quantities of the same good.


  I think the model survives, but not by denying incommensurability. It survives because
  trade does not actually require a common currency; barter works, and barter needs
  only that each party be able to rank the bundles on offer. Any agent with a consistent
  preference ordering can do that, and nothing in the idea of a value system forbids
  it. So the analogy holds even between incommensurable value systems, provided we
  read ''incommensurable'' as ruling out a common measure rather than ruling out ranking
  altogether.


  The voluntarists are right that mutual benefit is what does the normative work here.
  As they insist, the disagreement point is the crucial variable: a settlement is
  defensible only if the baseline against which it counts as an improvement is itself
  just. Where the fallback of one party is starvation and the fallback of the other
  is a slightly worse deal, a settlement can be voluntary, mutually beneficial, and
  still exploitative. Gains from trade are therefore a necessary condition for a legitimate
  compromise, not a sufficient one.


  On balance the analogy illuminates more than it misleads. Its deepest insight is
  that compromise need not be a zero-sum loss of integrity; it can be a positive-sum
  discovery of what each side actually values. The incommensurability objection is
  real but overstated."


