  Student answer draft:


  "The terms-of-trade model starts from the observation that compromise is not simply
  splitting the difference. When two parties with different value systems reach a
  settlement, each typically concedes on a dimension it cares about less in order
  to secure a dimension it cares about more. This is structurally like trade: the
  butcher and the baker both gain, not because they agree on what is valuable, but
  because they rank the goods differently. On this picture the ''price'' of a compromise
  is the rate at which one side''s concessions convert into the other''s, and the
  set of settlements that leave both better off than their disagreement point is the
  contract curve. The model''s real payoff is that it distinguishes concessive compromise
  — both sides simply lower their demands and both end up worse off than they''d like
  — from integrative compromise, where the parties restructure the dispute so that
  each gets more of what it actually values. The model predicts that integrative compromises
  are possible whenever the parties'' value-rankings differ, even if their values
  themselves are entirely different in kind.


  Turning to incommensurability: this is where the model is often said to fail. If
  two values share no common measure — if there is no unit in which both can be expressed
  — then there is no rate of exchange, and trade of the kind described seems impossible.
  I think this objection is weaker than it looks, but for a reason the model''s defenders
  don''t always state. Incommensurability is not the same as incomparability. To say
  two values are incommensurable is to say there is no common unit; to say they are
  incomparable is to say that neither is better, worse, nor equal to the other. These
  come apart: one can rank two things without a common measure, as when one prefers
  a career to a friendship without being able to say how many units of either equals
  the other. So the absence of a currency does not by itself block compromise.


  Where I part company with the voluntarist camp is over what this shows. The voluntarists
  hold that because any point on the contract curve is mutually beneficial, any compromise
  the parties freely reach is morally legitimate. That inference doesn''t follow.
  Mutual benefit is relative to the disagreement point, and the disagreement point
  may itself be unjust — if one party''s fallback is starvation and the other''s is
  a slightly worse deal, a settlement can be voluntary, mutually beneficial, and still
  exploitative. So gains from trade are a necessary condition for a defensible compromise,
  not a sufficient one.


  My conclusion is that the economic analogy illuminates more than it misleads, provided
  we keep the baseline in view. The model''s deepest insight is that compromise need
  not be a zero-sum loss of integrity; it can be a positive-sum discovery of what
  each side actually values. The incommensurability objection is real but overstated,
  and the contract curve is a better guide to compromise than the metaphor of ''splitting
  the difference''."


