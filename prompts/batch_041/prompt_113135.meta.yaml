  Q:


  "Compromise between two value systems is sometimes modelled as a species of trade.
  Each side concedes on a dimension it ranks lower in order to secure a dimension
  it ranks higher, and the settlements that leave both parties better off than their
  disagreement point are said to lie on a ''contract curve''. (a) Explain what the
