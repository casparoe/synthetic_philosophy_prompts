  Draft:


  "I have been trying to state my own view about who is answerable when an autonomous
  system causes serious harm, and I have a set of verdicts that seem to me to cohere
  without my being able to say what the coherence is. I would like the principle,
  or the smallest set of principles, that gets them, together with an honest account
  of which verdicts it cannot keep.


  My verdicts:


  1. A loitering munition in fully autonomous mode kills a child it has classified
  as a combatant. The operator who launched it had no channel to intervene once it
  was away, and the munition behaved within the accuracy envelope its manual stated.
  My verdict: the operator is not answerable for the death. I would rather see the
  family compensated out of a standing fund than see the operator carry it.


  2. Same munition, same launch, except that the officer who ordered it had been shown
  the classifier''s false-positive rate on children in cluttered terrain, and had
  a crewed alternative sitting on the ramp. My verdict: the officer is answerable,
  fully and without remainder.


  3. The engineer who trained the classifier knew the training set underrepresented
  children in cluttered terrain, wrote a memo saying so, was overruled, and had no
  authority to hold the release. My verdict: she is not answerable. But I also think
  the manufacturer owes the family something, and I cannot say what that is if it
  is not her responsibility.


  4. A trading firm hands a reinforcement-learning system the whole strategy space,
  with only risk limits as constraints. It finds a strategy nobody at the firm anticipated
  and could not have anticipated, and the strategy crashes a market. My verdict: the
  firm is answerable, and not merely liable — blameworthy.


  5. A hospital adopts a triage model that is less accurate for one patient group
  than for another, which the hospital''s clinical leads knew. The only alternative
  on offer was the previous, worse protocol for everyone, and the model saves more
  lives overall. My verdict: the hospital is not answerable for the deaths of the
  patients it treated worse.


  6. A human analyst sits at the end of a targeting pipeline with three seconds to
  accept or reject the system''s recommendation, on an interface that presents the
  recommendation as a default and the rejection as a five-step exception. She accepts,
  and the target was a wedding party. My verdict: she is not answerable; the arrangement
  was built to produce her deference.


  7. The person who specified the three-second window and the interface. My verdict:
  answerable, fully, although they touched nothing, ordered nothing, and are not a
  but-for cause of the deaths in any ordinary sense.


  8. A firm that has no idea how to make its system safe arranges its development
  pipeline across four subcontractors in three jurisdictions, with the interfaces
  drawn precisely so that no party has authority over the model''s constraints. My
  verdict: whoever drew those interfaces is answerable, even though nobody has authority
  and nobody intended any harm.


  The case I cannot settle: a system that has been learning in the field for years,
  so that at the moment of the harm no living person had an accurate picture of what
  it would do, and at every earlier point each person involved did what a reasonable
  person would have done with the information then available. My instinct is that
  somebody is answerable, and I cannot say who without the answer collapsing into
  ''the firm,'' which feels like a slogan rather than a name.


