  Key procedure content for a decision analyst:

  1. Write the payoff as a function of outcomes; compute the sum for EV.

  2. Test absolute convergence (sum of |payoffs| × prob). If it converges absolutely,
  EV is well-defined — use standard EV. If it diverges but the series converges conditionally,
  EV is not well-defined (order-dependent) — flag. If it diverges to +∞, the EV is
  infinite — different problem.

  3. If not absolutely convergent: don''t use EV. Instead look for: (a) dominance
  arguments (is one option better in every state? then that decides, no EV needed);
  (b) whether all reasonable truncations/bankroll constraints/risk-of-ruin bound the
  payoffs (in practice a finite bankroll or counterparty limit truncates the tail
  — recompute with the truncation and check whether the answer is stable across plausible
  truncations); (c) group the terms in the ways that give the highest and lowest partial-sum
  limits, and treat the spread as the honest range of "expected value" answers — if
  the range straddles the decision threshold, the EV calculation can''t decide.

