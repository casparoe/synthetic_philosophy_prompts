  I''m a science journalist working on a feature about the Anthropocene, and I keep
  hitting the same wall: everyone agrees it''s a thing, nobody agrees on what kind
  of thing it is. So I want you to help me think it through. Take the role of a philosopher
  of science who also knows a lot of history and geology, and start by brainstorming
  out loud about what''s actually at stake before you answer.


  Here''s the concrete practice I want you to interrogate. A natural history museum
  is building a permanent exhibit on the Anthropocene. The label committee has adopted
  a rule: a period can only begin at a point where you can point to a single physical
  marker -- a layer of sediment, an ice core, a coral skeleton -- that shows the change,
  and that marker has to be findable by someone who doesn''t know the human story
  at all. The education team wants to start the exhibit at the Industrial Revolution
  because that''s when the story gets legible to visitors. The ethics panel says the
  whole exhibit is a political act and the start date should be chosen to make a point
  about responsibility. And the director has floated a compromise: a "dual-clock"
  room, where one wall shows stratigraphic time and the other shows human historical
  time, and the exhibit only "counts" if both clocks agree on a moment. I''m not making
  any of this up -- okay, I''m making the dual-clock room up, but the rest is the
  kind of fight that''s happening in real committees.


  What I want from you: what philosophical commitments does this practice presuppose?
  Not just "it assumes humans are a geological force" -- that''s the easy part. I
  mean: what theory of historical periods does the rule presuppose? Does a period
  have to be discoverable from the rocks alone to be real, or is that just a methodological
  rule that the committee is smuggling in as a metaphysical one? What view of the
  nature/culture split does the exhibit assume, and does the dual-clock compromise
  actually resolve it or just hide it? Does the practice presuppose that "who decides"
  is a scientific question, a political one, or both -- and if both, what does it
