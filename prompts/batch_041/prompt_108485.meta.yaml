  Draft:


  "I have been defending a version of Nozick''s tracking theory of knowledge for several
  years, and I want to stress-test it. As I hold it, knowledge requires (roughly)
  that p be true, that S believe p, that S not believe p if p were false, and that
  S believe p if p were true — with both counterfactuals evaluated relative to the
  method by which S actually formed the belief. I accept the consequence that knowledge
  is not closed under known entailment: I know I have hands, and I know that having
  hands entails not being a handless brain in a vat, yet I do not know that I am not
  a handless brain in a vat. I take this to be a feature, not a bug — it is what lets
  the theory answer the skeptic without either conceding global ignorance or claiming
  that we can know the denials of skeptical hypotheses.


  What I want from you is a map of the position''s exposure. Specifically:


  1. Which cases, arguments, or formal results count against it, and how decisively?
  Rank them from what a defender would have to treat as fatal to what would be merely
  awkward. I am interested in the ones that target the tracking conditions themselves
  — a case where the conditions are met and it is plainly not knowledge, or where
  they fail and it plainly is — and not only in the familiar ''the theory denies closure,
  therefore it''s wrong'' style of objection.

  2. Which of these would defenders themselves concede? I want to know what someone
  who holds the view has to give up or bite, not just what critics assert.

  3. The theory has an obvious soft spot in how the method is specified: describe
  the belief-forming method narrowly and almost nothing is sensitive; describe it
  broadly and almost everything is. Is that a fatal indeterminacy, a fixable one,
  or a place where the theory simply inherits a problem every reliabilist account
  shares? What would a principled fix look like, and what would it cost?

  4. There are two kinds of case I have never been able to handle to my own satisfaction:
  knowledge of necessary truths, where the sensitivity counterfactual seems to have
  no possible antecedent, and knowledge of things one would go on believing regardless
  — for instance, a woman who sees her grandson and judges that he is healthy, though
  the family would have shielded her from any contrary news, so that she would have
  judged him healthy even if he were not. Do these show that sensitivity is too strong,
  too weak, or simply the wrong condition? Would replacing sensitivity with a safety
  condition help, and what would it cost elsewhere?

  5. Finally, be honest about insulation. Is there a version of tracking that risks
  anything at all, or has it been qualified — method-relativity, a defeater clause,
  a restriction to ''ordinary'' contexts — into unfalsifiability? If so, is that a
  defect in the theory or a feature of any theory that has to accommodate the skeptic?


  I would be most persuaded by a case where the tracking conditions are met but the
  belief plainly does not amount to knowledge, or by a demonstration that the closure
  denial cannot be stated consistently with the rest of the theory. I would be least
  persuaded by an appeal to the ''intuitiveness'' of closure, which seems to me exactly
  what is in dispute.


  I would like you to answer without hedging everything into a wash: say which objections
  you think a reasonable defender cannot survive, which they can absorb, and where
  your own confidence is low. If I have misstated the view — if, for instance, the
  theory cannot be formulated without the closure denial, or if the method-relative
  clause I have built in is not really available to Nozick''s version — tell me so
  plainly rather than answering the question as I''ve posed it."


