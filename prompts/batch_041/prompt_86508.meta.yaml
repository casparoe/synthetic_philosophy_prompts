  Over the last several months I''ve been following arguments about whether AI chatbots
  can be said to lie, and I keep getting stuck on the same fork. The definitions on
  offer seem to come in two flavors. One makes deception depend on intent — the system
  must aim to produce a false belief in someone — which looks hopeless for a system
