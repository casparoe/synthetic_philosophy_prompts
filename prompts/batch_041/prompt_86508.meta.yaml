  puts it under pressure and then decides whether it should be kept. The idea is to
  treat honesty and deception as properties of a system''s dispositions rather than
  of its individual outputs, and to locate those dispositions specifically in how
  the system behaves when accuracy is costly. A system is honest, on this view, roughly
  to the degree that its outputs stay accurate when accuracy is inconvenient — when
  the truth is embarrassing, when it means admitting ignorance, when a candid answer
  would disappoint the person asking or cost whoever operates the system money or
  goodwill — and deceptive to the degree that its accuracy decays in exactly those
  situations while holding up when there''s nothing at stake. So the interesting question
  about a model isn''t "was this sentence false?" but "how much pressure does it take
  before its grip on the truth slips?"


