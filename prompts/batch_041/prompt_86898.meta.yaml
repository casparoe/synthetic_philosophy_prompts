  structurally like belief in an undiscovered planet. The evidentialist picture makes
  the religious person''s confidence look like a failure of reasoning, and it cannot
  explain why the practices — prayer, fasting, ritual — are not merely decorations
  on a proposition but the thing itself. On the picture view, the practices are what
  give the words their life.


