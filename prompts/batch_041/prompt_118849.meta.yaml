  Draft:


  I teach a 90-minute meeting of a third-year undergraduate course on philosophy of
  mind and cognitive science. The class has eighteen students, the room has movable
  chairs and a whiteboard, and about half the group will have read the assigned chapter
  of Hofstadter and Sander''s Surfaces and Essences while the other half will not
  have opened it — so anything I build has to work for people who arrive cold. This
  is the session where I want students to feel, rather than be told, the book''s central
  claim: that analogy is not an occasional ornament on top of thought but the engine
  of thought itself, that categorizing something and seeing it as analogous to something
  else are one act rather than two, and that the boundary between "the same kind of
  thing" and "a different kind of thing" is drawn afresh in every context instead
  of being a fact that could in principle be read off the world. By the end I want
  them to have had two experiences they cannot easily dismiss: first, that they cannot
  get through sixty seconds of ordinary explaining without reaching for a prior case,
  a category, or a comparison, and that they did this continuously without noticing;
  second, that they themselves, arguing in good faith and following rules they agreed
  to, will have moved a concept''s boundary and will be unable to say where the moving
  should have stopped.


  Design me that activity. I''ve sketched a shape below but you should replace it
  if you have something better — what I care about is that the rules, roles and incentives
  do the work, not the facilitator''s commentary, and that nothing is named as a technical
  problem until the debrief. My sketch: a first phase in which pairs must get a partner
  to perform an unfamiliar small task, or to recognise an unfamiliar object, using
  only... [no comparison, no category label, no reference to any prior case they know].
  Then a second phase in which the whole group builds a chain from one description
  of a situation to a very different description of it, where each link changes exactly
  one thing and is accepted by a majority vote, and any student may spend a token
  to challenge a link as "not really the same kind of thing" and force a re-vote;
  tokens are scarce and the challenger who loses a challenge loses the token. I want
  the scoring to give different students different interests in where the boundary
  falls, so that the group has to negotiate rather than discover. Give me the full
  rules, the materials (cards, tokens, any props), a timeline to the minute, and the
  exact minimum the facilitator must say at each transition. Then the debrief: map
  particular moments that will have occurred in the room onto particular parts of
  the claim — the point where someone reached for a comparison and couldn''t stop
  themselves, the point where a link passed on the first vote and failed on the second
  with no new information, the point where a student''s own earlier ruling came back
  to bite them — and tell me how to close without flattening the difference between
  "this shows concepts are negotiated" and "this shows concepts are arbitrary," which
  are not the same claim and which I don''t want conflated. Also tell me what will
  predictably go wrong the first time: which students will game the token economy,
  where the group will bog down, what happens if the chain stalls, and how to handle
  the student who insists there is obviously a fact of the matter about whether two
  things are the same kind of thing.


  One more thing. This is a philosophy course and I don''t want to sell my students
  a contested thesis as settled science. So in the debrief materials, separate what
  is actually agreed among people who study this from what is contested: flag which
  steps depend on the strong reading of Hofstadter and Sander (that analogy is the
  core of cognition, that categorization just is analogical categorization) as against
  the weaker and more widely shared claim (that analogy is a pervasive and early-developing
  contributor to thought, or that similarity judgements are context- and goal-sensitive),
  and don''t let the contested version be presented as consensus. Where the activity''s
  punchline needs the strong reading to land, say so explicitly, so I can frame it
  as a thesis my students are being invited to argue about rather than a result they
  are being taught. And be honest in the same way about what the activity cannot reproduce:
  tell me which part of the idea I will simply have to state in the debrief because
  no ninety-minute exercise can make anyone feel it.


