  I''m a novelist — three books in, all realist, and I''m trying to write something
  with a speculative premise for the first time, which is going about as well as you''d
  expect. I need a short story, and I''d rather tell you exactly what I''m circling
  than have you guess.


  Here''s the thing I keep coming back to. There''s a philosopher, Derek Parfit, who
  spent decades on a question that sounds stupid until it eats your weekend: what
  actually matters in survival? Not "will I be the same person tomorrow" but the prior
  question — why do I care about tomorrow''s me at all? His answer, roughly, is that
  identity is not what matters; what matters is a thinner thing — memories, intentions
  and character carried forward with the right kind of causal link. He calls that
  thinner thing a relation, and the interesting part is that it comes in degrees and
  it can branch: scan a person, build two of them, and identity has failed (there''s
  one of you and two of them) while the thing that mattered has doubled. People then
  bolt a no-branching clause onto identity to save it, which always struck me as a
  fudge. He also has a spectrum thought experiment: replace one neuron at a time,
  or one memory at a time, and ask where along the line the person stops being them.
  There''s no line. That''s the point.


  And there''s an older case, from a paper by Bernard Williams, where you''re told
  you''ll be tortured tomorrow and then, in a second telling, that your memories will
  be wiped and another person''s put in your head, and that it''s the other body that
  gets the torture. Same situation, two descriptions, and your gut flips between them.
  I want that flip inside a character.


  So: teletransporter story. But I do not want the version everyone writes, the one
  where the machine kills you and something else steps out and the protagonist has
  a crisis in the departure lounge. I want the boring, administrative afterlife of
  a technology like that.


  Three wrinkles I want you to build on, and they''re the whole reason I''m asking
  you rather than writing it myself:


  1. Non-destructive scanning. The machine stopped killing people a generation ago.
  So a scan is just a scan, and a rebuild is a rebuild, and nothing stops there being
  two of you. Then one of them gets scanned again. Now there are three, and the question
  "which one is me" stops being a riddle and becomes a filing problem: a marriage,
  a pension, a criminal charge, a mortgage, a funeral.


  2. The rebuild is never clean. Say 99.4% overlap — the last eleven minutes before
  the scan don''t come through, or one face is gone, or a language. So does the threshold
  matter, and if a copy is missing the memory of a particular person, is it the same
  claimant for the purposes of the will? I want the percentage on a form somewhere.


  3. Identity by convention. I want one character to make the argument that we already
  run a working concept of identity through total replacement, and it''s called a
  company: every employee can leave, the whole staff can turn over, and nobody thinks
  the company died — we just agree to keep calling it the same entity. Why is a person
  different, other than that we''re sentimental about it? I''d like that argument
  made by someone unsympathetic, and I''d like it to be annoyingly hard to answer.


  Some craft constraints, because I''d rather over-specify than get a story I can''t
  use:


  - Put the protagonist in a job where they have to apply a rule about who counts
  as the same person. An assessor, a registrar, a notary, a claims clerk. The metaphysics
  should arrive as paperwork.

  - Write it in a mundane register. Domestic, slightly dull, office lighting. The
  weirdness should come from the tech being old news.

  - No gotchas. Nobody turns out to be a soulless machine, nothing turns out to have
  been a simulation, no evil corporation. And please, no scene where the two copies
  fight over which one is real. That scene has been written four thousand times.

  - At least one scene where two of them meet and it''s quiet — a shared bank account,
  one of them going to a parent''s funeral and the other not.

  - The Williams flip has to happen to someone in the story, not in the narration:
