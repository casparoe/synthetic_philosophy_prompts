  Actually, I like making the asker''s verdicts about *when a norm is binding on someone
  who did not consent and does not approve* — i.e., a general principle of "custom
  + force" versus alternatives like consent, fairness, benefit, or natural justice.
  The competing principles:


  (A) Pascal-flavored: a norm binds where it is received and backed by force; the
  search for a pre-conventional justice is idle.

  (B) Consent/acceptance: it binds only on those who have accepted it.

  (C) Fairness/reciprocity: it binds if it''s part of a fair scheme of cooperation
  (Rawls''s principle of fairness), i.e., you''re bound if you''ve accepted benefits.

  (D) Natural justice: only just norms bind; unjust ones don''t, force or no.

  (E) Coordination: it binds only if it solves a coordination problem, i.e., only
  when compliance is better for everyone conditional on others complying.


  The asker''s verdicts should be such that no simple principle saves all of them;
  the answer must choose.


