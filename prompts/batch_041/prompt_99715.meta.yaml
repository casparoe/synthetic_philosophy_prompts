  or real researcher into the story. In a mid-sized coastal town whose fishing and
  shipbuilding economies have been contracting for a generation, the regional health
  authority adopts a new diagnosis — call it Chronic Diminishment Response, or CDR
  — meant to capture a pattern clinicians kept encountering but could not name: pervasive
  fatigue, a shrunken sense of the future, low-grade shame, and a habit of treating
