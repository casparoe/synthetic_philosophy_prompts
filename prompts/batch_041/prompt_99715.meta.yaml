  ''a reduced horizon of expectation,'' is vague enough to stretch. What interests
  me is the feedback loop that follows. The category is introduced to describe a pattern;
  patients begin to understand themselves through it; their self-descriptions drift
  toward the criteria; and the clinicians who wrote the criteria, noticing that prevalence
  has doubled, quietly revise the criteria to match what they now hear in the clinic.
  I want the story to make that loop visible in the grain of particular lives rather
  than in a lecture.


