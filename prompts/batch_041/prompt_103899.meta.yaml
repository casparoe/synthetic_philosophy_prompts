  Now I have a good grip on the concept. Key points:


  - A safe Pareto improvement (SPI) is a modification of a game (or of how a game
  is played / of instructions given to representatives) that leaves all players weakly
  better off with certainty — i.e., without probabilistic assumptions about how games
  are played, and robustly against the players'' possible deviations / ways of playing.

  - The key contrast: an ordinary Pareto improvement in a game might not be achievable,
  because the players can''t commit / because equilibrium selection is uncertain /
  because a naive improvement can be exploited.

  - SPI literature: Oesterheld & Conitzer, "Safe Pareto improvements for delegated
  game playing" (AAMAS 2021, journal AAMAS 2022), program equilibrium, commitment
  devices, "hijacking" (the idea that an opponent can modify your commitment to their
  advantage — the "program equilibrium" issue). Also "Pareto improvements" that are
  robust to "manipulation" of the agreement by an adversary.

  - There''s also the notion that SPIs must be robust to the *representatives* being
  non-isomorphic players, and to the "SPI selection problem" (which SPI to pick among
  several).

  - Complexity results: NP-complete, Graph Isomorphism-hard.


  Also relevant concepts: "superrationality," "program equilibrium," "open-source
