  Let me think about what desiderata a good theory of SPIs should meet. This is a
  genuinely under-theorized area, so it''s a good "desiderata" prompt. Desiderata
  candidates:


  1. **Formal characterization / decidability**: For a given game (or class of games)
  and a given notion of "default play," the theory should say whether a nontrivial
  SPI exists, and ideally characterize the set of SPIs. It must be decidable in principle,
  with complexity characterized. (Cases: the Demand Game, PD, bargaining games.)


  2. **Robustness to the right set of deviations**: SPI must be safe against *something*.
  What? The natural answer: safe against arbitrary deviations by any player, including
  deviations that re-purpose the commitment device itself (hijacking). The theory
  must specify the threat model: best-response deviations, arbitrary program deviations,
  deviations by representatives vs. principals, deviations that exploit the other
  side''s uncertainty. Desideratum: it must be closed under the relevant deviation
  class — i.e., if the improvement is safe against all programs a player could run,
  it''s safe against best responses. So the theory needs a monotone threat model.


  3. **No probabilistic assumptions**: SPIs are supposed to be Pareto improvements
  *with certainty*, so the theory must deliver improvements that don''t depend on
  beliefs about equilibrium selection or on a probability distribution over opponents''
  play. Case: the Demand Game where naive equilibrium selection could lead to war.
  This is a desideratum: the guarantee must be ex post / worst-case, not expected.


  4. **Non-vacuity / content**: The theory must not be trivially satisfiable — it
  must not count "modify the game to give everyone their maximum payoff" as an SPI,
  because that''s not implementable given the players'' actual ability to commit.
  So it must distinguish achievable from wishful SPIs. Requirement: the modification
  must be *implementable* given the players'' actual precommitment technology (contracts,
  ex post verifiability, program equilibrium), not just desirable. The AAAI paper''s
  "ex post verifiable commitments" is exactly the implementability requirement. So:
  the theory must be grounded in an implementability notion.


  5. **The distinction between principals and representatives / between the game and
  the meta-game**: The theory must handle the fact that the "game" being improved
  can be the meta-game of instructions. It must respect the distinction between a
  Pareto improvement *in* the game and a Pareto improvement *of the way the game is
  played*. Case: delegated game playing, where the improvement is to the instructions.


  6. **Composition / closure**: If A is an SPI over the default and B is an SPI over
  A, is B an SPI over the default? (Should be — Pareto improvements should compose.)
  And is the SPI relation transitive? Desideratum: the relation should be transitive,
  or the theory should explain why not.


  7. **Must not be exploitable by unilateral "hijacking"**: an opponent might accept
  the SPI and then, because the SPI changes the game, find a new profitable deviation;
  or an adversary could design a *counter*-SPI that looks like an improvement but
  shifts surplus to them. The theory must be robust to "spurious" SPIs. The "SPI selection
  problem": if there are multiple SPIs, which do the players pick? That''s a coordination
  problem, and a good theory must either solve it safely or explain why it doesn''t
  reintroduce the original risk.


  8. **Consistency with standard revealed-preference / equilibrium concepts**: The
  theory must be consistent with (or explicitly depart from) Nash equilibrium, subgame
  perfection, and the standard commitment-device results. It must recover the standard
  results (e.g., PD cooperation via program equilibrium) as special cases.


  9. **Handle asymmetric information / uncertainty about the game itself**: If players
  disagree about the payoff structure or the space of possible programs, can an SPI
  still be safe? The theory must say what happens when players'' models of the game
  differ (the "model disagreement" issue).


  10. **Scalability / many players**: SPI theory is mostly two-player; it must generalize
  to n-player games and to settings with externalities (where a "Pareto improvement"
  among the players may harm non-players — the *side-effect* desideratum). E.g., a
  treaty between two countries that improves their payoffs but worsens a third''s.
  A good theory must say whether "Pareto" should be relative to all affected parties
  or just the players.


  11. **Verifiability / enforcement**: The improvement must be implementable without
  a central enforcer, or the theory must say what enforcement technology it assumes.
  Case: smart contracts, ex post verifiable commitments, third-party enforcement.


  12. **Comparative ignorance / information**: an SPI should not require the players
  to know things they can''t know (the opponent''s utility function, the opponent''s
  program). It should be computable from the players'' own information.


  Now the tensions: e.g., desideratum 2 (robust to arbitrary programs, including hijacking)
  vs. desideratum 4 (non-vacuity / implementability): the more robust you demand,
  the fewer SPIs exist — possibly none. Also desideratum 3 (no probabilistic assumptions,
  worst-case guarantee) vs. desideratum 4 (non-vacuity): worst-case safety is demanding;
  requiring certainty may make the set of SPIs empty in many games. Also desideratum
  1 (decidability/complexity) vs. desideratum 2 (robustness to arbitrary programs):
  robust safety against arbitrary programs is likely undecidable / graph-isomorphism-hard,
  so a theory that demands both a complete characterization and full robustness may
  be impossible. That''s the "jointly unsatisfiable" pair to flag.


