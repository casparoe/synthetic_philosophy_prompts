  Question:

  "Explain the demandingness objection to act-consequentialism. In your answer (a)
  state clearly what the objection claims, (b) distinguish it from at least one other
  objection to consequentialism, and (c) say whether rule-consequentialism is any
  better off."


  Student response:

  "The demandingness objection says that act-consequentialism demands too much of
  us. Because it tells us to maximize the good, we are required to keep giving our
  time and money away until giving more would make things go worse overall — basically
  until we''ve reduced ourselves to the level of the worst-off. Singer''s example
  of the child drowning in the shallow pond is the classic illustration: if we can
  save a child at little cost to ourselves, we must, and the same reasoning seems
  to apply to people starving overseas, so we''re obligated to give most of our income
  away.


  This objection is usually credited to Bernard Williams, who argued that a morality
  that demands this much forces us to abandon our own projects and commitments, and
  so attacks our integrity. The point is that the theory alienates us from our own
  lives, which is why we find it repugnant.


  Rule-consequentialism is supposed to fix this. Instead of asking what single act
  produces the best consequences, it asks which set of rules, if generally followed,
  would produce the best consequences, and then we follow those rules. Since the costs
  to the agent of following a rule get counted at the rule-selection stage, the rules
  that get selected won''t be as crushing as act-consequentialism''s demands. So rule-consequentialism
  escapes the demandingness objection while keeping the consequentialist core."


