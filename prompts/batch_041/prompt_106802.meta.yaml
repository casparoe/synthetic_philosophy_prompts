  Antinatalism and Benatar''s asymmetry: Benatar''s asymmetry is a well-known set
  of four claims about pain/pleasure and existence/nonexistence. A student answer
  could subtly misstate one of the four quadrants, or conflate the asymmetry argument
  with the "misery" argument (the empirical claim that lives contain more bad than
  good) or with the "conclusion" (pro-natalism/anti-natalism). Common subtle mistake:
  saying Benatar thinks coming into existence is always a harm, and that this is based
  on the asymmetry, but mischaracterizing the asymmetry — e.g., claiming that the
  absence of pain is good even if no one is deprived, and the absence of pleasure
  is bad... Actually Benatar''s asymmetry:


  1. Presence of pain is bad.

  2. Presence of pleasure is good.

  3. Absence of pain is good, even if that good is not enjoyed by anyone.

  4. Absence of pleasure is not bad unless there is somebody for whom this absence
  is a deprivation.


  The asymmetry is between 3 and 4: absent pain is good even if no one enjoys it;
  absent pleasure is not bad if no one is deprived.


