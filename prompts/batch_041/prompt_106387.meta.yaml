  I write a column on science and ideas, and I''ve spent the last few weeks trying
  to get to the bottom of the old raven paradox — Hempel''s observation that if "all
  ravens are black" is logically equivalent to "all non-black things are non-ravens,"
  then a green apple or a white shoe, being a non-black non-raven, should count as
  evidence for the generalization, which is absurd. What has surprised me is how quickly
  every conversation I have about it slides into advocacy for one or another machinery
  — Bayes nets, likelihood ratios, inference to the best explanation — before anyone
  has said what the machinery is supposed to deliver. A colleague of mine, a philosopher
  of science, insists the real lesson is that confirmation is always contrastive:
  evidence bears on a hypothesis only relative to a set of alternatives, and the raven
  paradox is an artifact of pretending otherwise. I''m not sure whether to put that
  in the piece or treat it as one candidate among many, so I''d like the specification
  first: what would a theory of confirmation actually have to get right to be adequate
