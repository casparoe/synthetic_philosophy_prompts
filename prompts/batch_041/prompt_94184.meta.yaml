  Which domain pairs best with a classroom activity? Benacerraf''s dilemma is nicely
  stageable: students are asked to identify numbers with sets — any reduction gives
  arbitrary/colliding answers. Actually a good activity: give groups the task of "what
  is the number 3?" and have them construct set-theoretic reductions, then discover
  that multiple reductions are equally good and disagree on e.g. whether 3 ∈ 7, or
  whether the number of elements... Benacerraf''s dilemma: (1) if numbers are sets,
  which sets? multiple candidate reductions each satisfying all the arithmetical truths,
  so no fact of the matter which is correct; (2) if numbers aren''t sets, then since
  sets suffice for arithmetic, numbers are causally inert abstracta with no epistemic
  access. The dilemma: any account of what numbers are must satisfy (a) truth of arithmetic
  statements about numbers and (b) a plausible semantics/epistemology — sets fail
  (a) uniquely, non-sets fail (b).


  Activity: "identify the numbers with something" — run a game where groups each propose
  a reduction of the natural numbers to sets (von Neumann ordinals, Zermelo numerals,
  etc.), verify each satisfies all the arithmetic truths they can check, then confront:
  the reductions disagree about whether 3 ∈ 7, whether 3 is a member of 7, etc. And
  then the further stage: an epistemological stage where they must explain how a student
  could know "3 is prime" if 3 is a set with no causal contact.


