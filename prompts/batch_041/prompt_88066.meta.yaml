  I have been working through an idea on my own, without any training in philosophy,
  and I would like you to help me pin down what a good account of it would have to
  look like rather than to argue for one.


  The idea is this: a great many of the things I am most certain of are not things
  I could give a reason for, and not things I could seriously doubt. That my memory
  is broadly reliable; that other people have minds; that the world will not simply
  dissolve between one moment and the next; that my own reasoning is not systematically
  rigged against me. I hold these as fast as anything I know, and yet if I were asked
  to justify them I would end up going in a circle. They seem to be the frame within
  which I doubt and reason rather than one more item inside it. I understand this
  is roughly the ground Wittgenstein was working over in the notes he left at the
  end of his life, and that the metaphor he reached for was of convictions that have
  hardened into the bed of a river, which the current of our thinking runs through
  but which can in time be churned up and carried along as part of the current itself.


  What I want from you is the specification, not a verdict: what would any account
  of these frame convictions have to get right in order to be adequate? Please give
  me the requirements, and for each one the case or consideration that forces it,
  rather than a survey of who has said what.


  To make the list concrete, I have been worrying at a handful of cases, and I would
  like you to say for each whether an adequate account must handle it and, if so,
  what it must deliver:


  (a) someone raised in a community where it is held fast that the dead speak through
  dreams — must the account treat this on all fours with my certainty that my memory
  is reliable, or may it distinguish them, and on what basis that isn''t simply my
  own conviction talking?


  (b) a conviction that was once an ordinary belief and hardened into a frame, and
  later came loose again and rejoined the current — how does the account describe
  the transition, and must it say when such a change is an improvement rather than
  a mere drift?


  (c) certainties about my own capacities — that my reasoning is sound — where doubting
  them would have to use the very faculty under doubt;


  (d) a person who says he does not believe the bridge will hold and crosses it anyway
