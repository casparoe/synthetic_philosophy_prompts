  Let''s write the student answer:


  "Question: Explain why promises bind according to Hume, Kant, and Scanlon. Then
  assess which of these accounts best explains the wrongness of breaking a promise
  in a case where no one finds out and no material harm results. Be specific about
  the differences.


  Answer: Hume treats promise-keeping as an artificial virtue. Promises are not natural;
  they are a social invention that solves a coordination problem. We need to be able
  to rely on each other''s future behavior, and since our natural self-interest is
  partial, we establish a convention of treating certain words as binding. Over time,
  we come to approve of honesty and disapprove of promise-breaking, and that sentiment
  is the source of the obligation. So for Hume the bindingness of promises is grounded
  in convention and utility, not in a natural duty.


  Kant disagrees. For Kant, the duty to keep promises is a categorical imperative.
  The test is universalizability: can I will that everyone make promises they intend
  to break when it suits them? No, because if everyone did that, the institution of
  promising would collapse, and no one could make a promise in the first place. So
  the maxim of making a lying promise is self-defeating. This is why Kant thinks a
  promise still binds even if breaking it would produce good consequences; the duty
  is strict and does not depend on what happens to be useful.


  Scanlon''s contractualism offers a third account. An action is wrong if it would
  be disallowed by any set of principles that no one could reasonably reject. His
  principle of fidelity says that if you have promised to do something and have not
  been released, you must do it unless there is special justification. The wrongness
  of breaking a promise lies in the fact that the promisee cannot reasonably reject
  a principle requiring fidelity; you are treating them in a way they could not authorize.
  This makes Scanlon''s view a version of social contract theory: the principle of
  fidelity is binding because we have implicitly agreed to the social practice of
  promising.


  For the secret promise-breaker, I think Scanlon''s account is the strongest. Hume''s
  account has trouble explaining why the obligation persists when the convention is
  not actually undermined; if no one finds out and cooperation is not damaged, Hume
  seems to make the wrongness contingent on social consequences. Kant''s account does
  better because it locates the wrongness in the maxim, but it is too formal: it does
  not explain the relational wrong of letting someone down. Scanlon captures that
  relational wrong: the promisee has a claim on you, and breaking it is a failure
  to respect their standing to rely on you. So Scanlon best explains the residual
  wrongness."


