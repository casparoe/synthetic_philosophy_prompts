  but to sort the arguments for pronatalism — the claim that we ought to have more
  people — by the axiological commitments each argument presupposes. So each leaf
  should also carry, in one sentence, the most awkward commitment the position forces
  on anyone who uses it to defend pronatalism. Where an argument for having more people
  is really an argument about something else (a duty to existing people, a claim about
  national power, a religious premise), the tree should say so rather than forcing
  it into an axiological leaf.


  [Specific distinctions / required leaves:] I want the tree to turn on at least these
  questions, though you should add whatever else is needed:

  - whether the value of a population depends only on the welfare of the people who
