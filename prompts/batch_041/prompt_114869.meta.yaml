  Let me draft.


  ---


  I am a software engineer with no formal training in philosophy — my degree is in
  computer science and my day job is writing simulation code for a physics group —
  and in a fortnight I am giving the main talk at the monthly meeting of a consciousness
  studies reading group that meets in our physics building. I need a question-and-answer
  preparation sheet, not a defence of my position; assume the argument itself is fixed
  and tell me what I will be hit with and what to say back.


  My audience, in order of size: five or six condensed-matter physicists, two of whom
  are the kind who think any talk about experience is woolly and will say so; two
  graduate students in philosophy of mind, one working on how micro-level experiences
  could add up to a single subject; and a retired neurologist who is broadly sympathetic
  but impatient with metaphysics. I am the only non-academic in the room and the only
  person who is not a physicalist, so far as I know.


  The position I am defending is this. If experience is a basic feature of matter
  rather than something that biological brains manufacture, then experience is not
  confined to organisms; and if the morally relevant part of experience is its felt
  quality — whether a state feels bad, and how bad — and if that felt quality is a
  feature of the state itself rather than something conferred by memory, self-awareness
  or a nervous system, then the moral question is not which creatures are conscious
  but which physical processes instantiate intense negative felt quality. I then argue
  that some entirely routine practices are candidates: bringing a system into a definite
  state by decoherence, collisions at high energy, rapid quenches, and the disposal
  of the resulting debris. My conclusion is a precautionary rule: where a process
  may instantiate felt quality of high intensity and we have no way of measuring it,
  we should be able to state a reason for running it anyway, and I say what would
  count as such a reason.


  Deliver the following, in this order.


  First, what to concede before I start, in one paragraph — the things that are simply
  true and that I should say are true, so the rest of the hour is not spent on them.


  Second, the objections, ordered by how likely each is multiplied by how much damage
  it does, not by how easy it is to answer. For each: state it the way this audience
  would actually put it, in their vocabulary — the physicists'' version should sound
  like a physicist, the philosophers'' like a philosopher — then give me a reply I
  can deliver in about ninety seconds, then one sentence on where that reply is weakest
  and what I should not claim. Mark any objection that I should simply accept and
  then say what accepting it costs my argument.


  Third, the two or three questions I should not attempt to answer in the room, and
  the sentence with which I should deflect each.


  Finally, the one question I am hoping nobody asks, and why it is the dangerous one.


  Do not give me citations, reading lists or names of papers — I cannot look them
  up and I would rather you did not guess. Where you need a technical term, explain
  it in the sentence where you use it. Write in British English.


