  ---


  I am a high school student, and I have been reading arguments about computation
  — about which problems can be solved quickly and which cannot — in order to understand
  a move I keep running into and cannot name.


  The move goes like this. First, someone identifies a task that would have to be
  performed if a certain practice were to be done "properly" — finding the uniquely
  best option, checking every implication of a rule, writing a contract that anticipates
  every contingency — and then observes that this task is one of the problems that
  no efficient method can solve, since the number of cases grows too fast. Second,
  they conclude something about the practice: that it is not really a failure or a
  shortcut but an adaptation, or, more strongly, that nobody can be blamed or held
  to the standard, because the standard is unsatisfiable.


  Two examples I have actually met:


  1. An essay arguing that vague legal rules are not a defect but a response to the
  fact that a rule that specified the correct outcome for every possible situation
  could never be written or checked in advance, so a legal system that tried to be
  complete would be unusable.

  2. A debate about school funding in which someone said that since there is no feasible
  way to compute the allocation that would do the most good overall, the demand that
  the district act on that allocation is empty — no one can be required to do what
  cannot be computed.


  My problem is that I already understand the usual correction here, and it does not
  answer my question. I know that these hardness results are about the worst case
  and about exact answers, that a typical instance may be easy even if the problem
  as a whole is hard, and that a good-enough answer may be computable even when the
  perfect one is not. What interests me is not that particular mistake but the shape
  of the reasoning that survives it. Even granting every qualification, there seems
  to be something being done with the hardness claim — used at once to explain why
  a practice exists and to release us from any obligation to do better — and I cannot
  tell whether these are two different moves that happen to share a premise, or one
  move with two faces, and whether the second really follows from the first.


  So: is there an established name for this? If there is, I would like to know what
  exactly it covers and how it relates to the nearest things I can think of, which
  are the ordinary worst-case/average-case confusion (which I take to be narrower),
  bounded rationality, and the general warning against inferring an ought from an
  is. If there is no name, I would like you to supply one, define it, and tell me
  where its edges are: in particular, whether a hardness claim can ever by itself
  justify a practice rather than merely explain it, and what else a good argument
  of this kind needs in order to do that.


