  The two camps are:


  Representational camp: They hold that a model''s latent knowledge is a fact about
  its internal computation. To elicit it, you should locate internal representations
  that encode the answer and show that those representations are causally used by
  the model. They regard linear probes, activation patching, sparse autoencoder features,
  and steering vectors as probative evidence. They think purely behavioral elicitation
  is circular, because a model can be trained to imitate honesty or to sandbag, and
  the only way to distinguish what it knows from what it says is to inspect and intervene
  on its internals.


  Behavioral camp: They hold that knowledge is a disposition to respond, not a hidden
  substance. The only evidence that a model knows something is that it can be brought
  to act on that knowledge under some admissible prompting, fine-tuning, or decision
  procedure. They regard internal states as useful hypotheses but not proof: a probe
  may decode information the model computes and discards, and a causal intervention
  may create a new disposition rather than reveal an old one. They want behavioral
  tests: counterfactual prompting, paraphrase consistency, calibration, and decision-theoretic
  elicitation.


  Use the following running example to keep the document concrete: a transformer trained
  on a synthetic task where each input has a hidden parity bit; after pretraining,
  the model is fine-tuned to answer that it does not know on a subset of inputs selected
