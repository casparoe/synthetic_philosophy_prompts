  The Ramsey rule: r = δ + η·g, where δ is the pure rate of time preference, η is
  the elasticity of marginal utility (inequality aversion), g is growth. The "Prescriptivism
  vs. descriptivism" debate (Arrow vs. Nordhaus). The Stern Review used δ≈0.1%, η=1
  → r≈1.4%. Nordhaus used r≈3-4%. The "two-thirds of the disagreement is about η"
  point. Also the "disagreement about η: is it a parameter of ethics or of consumer
  preferences?" — descriptivists say infer from savings behavior. Also the point:
  if g is negative (climate damages), the Ramsey rule flips sign and you should discount
  *up* the future — i.e., with η high and negative growth, the future becomes more
  valuable. And the "climate beta" debate (Weitzman vs. others): correlation of climate
  damages with consumption growth means the discount rate should be *lower* (or even
  negative) for climate risk. That''s genuinely in-the-weeds and juicy: the "risk-adjusted"
  discount rate, the "Weitzman-Gollier puzzle" (declining discount rates over time
  due to uncertainty in the discount rate — the Gamma discounting / certainty-equivalent
  discount rate declining over horizons). The Weitzman-Gollier puzzle is a nice in-the-weeds
  thing: uncertainty about the discount rate → the effective (certainty-equivalent)
  discount rate declines with the time horizon, so distant future matters *more* than
  a fixed rate suggests. That''s a great joke substrate: "the further away it is,
  the more it counts" — sounds like a paradox.


