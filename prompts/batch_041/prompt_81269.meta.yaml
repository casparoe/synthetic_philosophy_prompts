  1. The theorem gives E[V] ≥ 0 for a Bayesian EU maximizer with fixed action set
  and belief-independent utility. It doesn''t say info is good in every realization;
  ex post regret is compatible with the theorem. (Common confusion.)

  2. It doesn''t say more info is always better than less, or that you should seek
  info (costs, opportunity, the value of committing to ignore).

  3. It fails with non-EU preferences (ambiguity aversion, regret aversion), or when
  utility depends on beliefs/states (e.g., you care about your health status per se
  — "state-dependent utility"), or when the info changes the action set or your preferences.

  4. There''s a real literature on "information avoidance" and the "ostrich effect"
  — people decline free information (e.g., HIV tests, financial statements) — and
  there are models where avoiding info is rational (e.g., when the info is unavoidable-revealing
  later anyway, or anticipatory utility, or when you can''t commit to act on it).
