  ---


  I am designing a ninety-minute undergraduate seminar on Aristotle''s sea battle
  argument and the problem of future contingents, and I want a teaching plan rather
  than an explanation. The students arrive having read the primary text once; they
  have a first logic course behind them (propositional and predicate, nothing modal
