  they must set out the argument''s premises and then say, for each of four standard
  replies, which premise that reply must give up. Assume no one in the room has met
  the problem before.


  Plan the session for me along these lines.


  First, the order of ideas, with the dependencies stated: what has to be established
  before the next move can even be formulated, which step is the one that does the
  real work, and where the argument will feel to them like a trick rather than a proof.
  I want the seminar to end with the fatalist conclusion still pulling on them, not
  dismissed.


  Second, the carrying example. The obvious candidate is the sea battle itself, but
  they will have just read it, and I suspect it is doing less work than it appears
  to. Should it carry the session or should something else? If you keep it, say what
  else it must be paired with; if you replace it, name the replacement and specify
  what it must have and what it must lack (in particular, whether it should be a case
  with an agent who can deliberate, and whether it should be a case the students have
  a stake in). I want one example doing the load-bearing work, not a parade of them.


