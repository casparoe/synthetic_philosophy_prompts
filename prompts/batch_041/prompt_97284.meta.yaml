  says guilt is doing its job here.

  - A kid who cheats, feels ashamed, and starts avoiding the subject and lying about
  it: she says shame is doing damage here.

  - A girl who feels ashamed that her family can''t afford the school trip, and so
  she doesn''t go and doesn''t tell anyone: she says that''s shame being dumped on
  her by the school''s culture, not a useful moral emotion.

  - A boy who feels guilty about something he couldn''t control, like his parents
  splitting up, and can''t stop apologising: she says that''s guilt gone wrong, not
  guilt doing its job.

  - A workplace where people feel shame about missing targets and then work harder:
  she says shame is doing its job there, even though she doesn''t like it.

  - A restorative justice meeting where the person who did the harm feels guilt, hears
  from the victim, and repairs what they can: she says that''s the gold standard.

  - A public shaming campaign on social media where someone is humiliated and then
  apologises: she says that''s shame being used as punishment, and it doesn''t count
  as moral repair.


