  Final draft:


  "I chair the internal review of my employer''s credit-scoring and fraud-flagging
  models, and next month I must defend, before our standing Model Risk and Fairness
  Committee, a position I have spent the better part of a year developing. The position
  is that the impossibility results in algorithmic fairness are best read not as a
  menu of mutually exclusive metrics but as a proof that fairness is a distributive
  question rather than a measurement question: because the standard group-fairness
  criteria cannot be jointly satisfied whenever base rates differ, any practice of
  running the whole battery on each release and adjudicating the discrepancies case
  by case is not merely imperfect but incoherent as a decision procedure, since the
  real trade-off is made silently in the adjudication. What I propose instead is an
  explicit institution: a published fairness budget, modelled on a privacy budget,
  under which the committee pre-commits to one designated error-parity criterion and
  a stated tolerance, must account for every departure from it, and must disclose
  whose errors are being spent to purchase whose accuracy. I will also argue that
  a firm willing to randomize at the margin can honour such a budget more faithfully
  than one that insists on a deterministic rule, and that the familiar lament that
  ''we cannot satisfy every criterion at once'' is in part an artefact of that insistence.


  The committee is not friendly. Its members are: the chief statistician, who knows
  the impossibility theorems cold and will not let me gesture at ''the theorem'' without
  stating its assumptions and telling her exactly which quantities are being traded;
  a compliance lawyer from a civil-rights background, who thinks in terms of disparate
  impact, will hear ''budget'' as a licence to discriminate and will press me on the
  difference between a tolerance and a right; two machine-learning engineers, who
  hold that fairness is largely a matter of withholding protected attributes and of
  ''the model simply learning the pattern in the data'', and will keep asking why
  we cannot fix the data and move on; an external ethicist sitting as a member, who
  will object that ''fairness budget'' is a category error because fairness is not
  a conserved resource, and that my distributive framing begs the question of what
