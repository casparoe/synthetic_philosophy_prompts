  I am the person who chairs my employer''s internal review of our credit-scoring
  and fraud-flagging models, and next month I have to defend a position I have been
  arguing for the better part of a year before our standing Model Risk and Fairness
  Committee. The position is this: the family of impossibility theorems in the fairness
  literature should be read as an argument that fairness is a distributive question
  rather than a measurement question, and that our current practice — running a battery
  of group-fairness metrics on each release and arguing case by case about which discrepancies
  are acceptable — is not merely imperfect but incoherent as a decision procedure,
  because the metrics are jointly unsatisfiable and the "case by case" reasoning is
  where the real, undisclosed trade-off gets made. What I want to put in its place
  is an explicit institution: a published fairness budget, modelled on a privacy budget,
  in which the committee pre-commits to a single designated error-parity criterion
  and a stated tolerance, must account for every departure from it, and must disclose
  whose errors are being spent to buy whose accuracy. I will also argue that a company
  willing to randomize at the margin can do better on this accounting than one that
  insists on a deterministic rule, so the usual "we cannot satisfy every metric at
  once" lament is partly an artefact of insisting on determinism.


