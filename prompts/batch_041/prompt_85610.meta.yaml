  Structure of prompt:


  Para 1: personal relevance. Something like: "I am a physicist, and until recently
  Émilie du Châtelet was for me a professional ancestor — the translator and commentator
  of Newton, the person who put the question of vis viva on a firmer footing. Two
  years ago, in the middle of a decision about whether to stay in research, a friend
  gave me her essay on happiness, and it has been in my head ever since, in a way
  that her mechanics never was."


  Hmm, "two years ago" fine. Let''s craft.


  Para 2: the session details. "Next month I have forty-five minutes with a group
  of about twenty graduate students and postdocs in the physical sciences — none of
  them has read any philosophy, all of them are used to being told things that can
  be checked. I am not going to give a talk about her; I want to explain her view
  of happiness so that it is intelligible on its own terms and can be argued with."


  Para 3: the specific content and the puzzle/spine. Mention: her list of conditions;
  the two demands that appear to pull apart (shedding prejudices, which sounds like
  a demand for truth and clarity, and remaining susceptible to illusions, which sounds
  like a licence for self-deception); the further oddity that she treats happiness
  as something one works at and manages — deciding what one wants to do and to be,
  banishing sad ideas, refusing regret — while also insisting one should not try to
  change one''s circumstances and should be content with one''s station; and the advice
  about warding off thoughts of death, including the death of those one loves. Also
  the biographical fact that her own life was spent changing her circumstances, at
  considerable cost.


