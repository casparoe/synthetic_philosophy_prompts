  I''ve been in a reading group on cultural evolution for about a year now and we
  keep circling the same fight without ever resolving it, so I want a diagnosis rather
  than another round. On one side are the meme people: they take Dawkins'' basic move
  seriously, that culture contains genuine replicators, units that get copied with
  variation and are then differentially retained, so cultural change is a Darwinian
  process in the same sense biological change is, just with a different replicator.
  On the other side are people in the Sperberian epidemiology-of-representations camp
  and the Boyd/Richerson dual-inheritance camp, who say that cultural transmission
  mostly isn''t high-fidelity copying at all -- what gets transmitted is reconstructed
  by each learner, pulled toward attractors set by human cognition, and so the explanatory
  work is done by transformative biases and by the ecology of minds, not by replicator
  dynamics. And then there''s a third group, the philosophers of biology, who keep
  saying the whole dispute is confused because the sides haven''t agreed on what makes
  a process Darwinian in the first place -- whether you need replicators at all, or
  whether it''s enough to have heritable variation in a population with differential
  reproduction, in which case something like Godfrey-Smith''s replicator/reproducer
  distinction is supposed to dissolve the fight rather than settle it. My working
  hypothesis is that this is not one disagreement but three stacked on top of each
  other: a definitional dispute about what counts as a Darwinian process, an empirical
  dispute about how faithful cultural transmission actually is and at what grain,
  and a dispute about explanatory aims where one side wants to explain the population
  distribution of variants and the other wants to explain why particular variants
  are stable across minds. If I''m right about that, the literature is mostly people
  arguing about the first while thinking they''re arguing about the second, and no
  amount of new ethnographic or experimental data would move it.


