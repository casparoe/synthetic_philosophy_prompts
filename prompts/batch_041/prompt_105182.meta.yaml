  I am a retired physiologist — forty years in the field, mostly on avian sensory
  systems — who has spent the last several years reading philosophy with more enthusiasm
  than training. I have been working slowly through Part Five of Descartes'' Discourse
  on Method, where he turns to the difference between the human soul and that of the
  brutes. I am reading an English translation from the middle of the nineteenth century,
  and the argument''s shape, as best I can render it, is this.


  He imagines machines that resemble our bodies and imitate our actions as far as
  is morally possible. Even so, he says, there would be two certain ways of telling
  they are not men. The first: such a machine could never use words or other signs,
  putting them together as we do, to declare its thoughts to others. It might be built
  to utter words — even a word appropriate to what is done to it, as when one touches
  it in a certain place and it asks what one wants — but it could not arrange its
  speech differently in response to whatever is said in its presence, in the way that
  even the dullest human being can. The second: though such a machine might do some
  things as well as or better than we do, it would fail in others, and this would
  show that it acts not from understanding but only from the disposition of its organs;
  for whereas reason is a universal instrument that can be used on any occasion, an
  organ needs a particular disposition for each particular action. He then says these
  same two means give us the difference between men and brutes: no human being is
  so dull, and none so mad, that he cannot put various words together and make his
  thoughts understood, while no animal, however perfect and well made, does anything
  of the sort. He grants that animals lack the organs for speech in some cases, but
  insists the failure is not merely mechanical — magpies and parrots can utter words
  as we do, yet cannot show that they think what they say. And he notes that men born
  deaf and dumb, who lack the organs of speech as much as beasts do, nonetheless invent
  signs by which they make themselves understood. He concludes that beasts have no
  reason at all, and that it is nature in them that acts according to the disposition
  of their organs, as a clock tells the hours.


