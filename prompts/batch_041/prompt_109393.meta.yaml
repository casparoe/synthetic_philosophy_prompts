  A research group proposes a programme called chronobiotic endocrinology. Its Hard
  Core states that all major mood disorders are caused by a single master circadian
  clock in the hypothalamus, and that the clock''s phase can be reset only by ambient
  light. Its Protective Belt contains auxiliary hypotheses about receptor sensitivity,
  seasonal variation, and diagnostic thresholds. In its first decade, the programme
  predicts that a new class of drugs acting on a specific clock gene will relieve
  symptoms in a subset of patients, and that the effect will vanish in knockout animal
  models. Both predictions are confirmed. In its second decade, a large clinical trial
  fails. Defenders add an auxiliary hypothesis: a common antidepressant alters the
  clock''s phase in a way that masks the drug''s effect. They then derive a new prediction:
  patients carrying a particular polymorphism should respond only to a modified dosing
  schedule. That prediction is also confirmed. Using Lakatos''s methodology, assess
  whether this programme is progressive or degenerating. Explain the roles of the
  Hard Core and Protective Belt, distinguish progressive from degenerating problem
  shifts, and state what Lakatos would advise the researchers to do.


  Student''s answer:

  Lakatos''s methodology says that a research programme has a Hard Core of central
  assumptions that are protected from refutation by a Protective Belt of auxiliary
  hypotheses. A programme is progressive when it predicts novel facts that are later
  confirmed, and degenerating when it only patches up anomalies after the fact. In
  the first decade, the chronobiotic programme is clearly progressive: it predicted
  the drug effect and the knockout result, and both were confirmed. The second decade
  is more complicated. The failed trial is an anomaly, and the defenders respond by
  adding an auxiliary hypothesis about the antidepressant masking the effect. This
  is a classic ad hoc rescue, so the programme has become degenerating. The fact that
  the new polymorphism prediction was confirmed does not change this, because the
  prediction was invented only after the anomaly and was designed to save the Hard
  Core. Lakatos, following Popper, holds that a programme that needs such rescue is
  pseudoscientific and should be abandoned. He would advise the researchers to give
  up the Hard Core and replace it with a new one, while keeping the Protective Belt,
  since the belt contains the empirically useful parts of the theory. The only thing
  the researchers did right was to keep making testable predictions; that shows they
  are not outright dogmatists, but it does not make the programme progressive.


