  impact statement. The statement must estimate how the policy will affect ''Boomers,''
  ''Millennials,'' and ''Gen Z,'' and must flag any policy that imposes disproportionate
  burdens on one generation. The categories are treated as constituencies with interests,
  not merely as age brackets. Yet the agencies that produce these statements do not
  agree on the birth-year boundaries; some shift the cutoff by a year or two, and
  some add a ''Gen Alpha'' category. The same person can be classified differently
  depending on which agency''s form is used. Meanwhile, the audits sometimes attribute
  a political or economic outlook to a generation as a whole—saying that ''Gen Z''
  values stability or that ''Boomers'' resist density—and sometimes treat the category
  as a mere label for people born in a window. I am not asking whether the policy
  is wise. I want to know what philosophical commitments the practice presupposes.


  Please start by brainstorming the candidate ontological and explanatory views that
  could underlie such a practice: for example, generational realism, social-kind realism,
  nominalism about generations, generational consciousness, methodological individualism,
  and the view that generations are useful fictions or administrative categories.
  Then write a polished analysis in American English. In it:

