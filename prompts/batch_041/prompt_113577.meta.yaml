  dilution" moves — e.g., "we might be Boltzmann brains", "we might be in a simulation",
  "the reference class problem". There''s a nice conceptual structure: arguments that
  our apparent situation is unrepresentative of the situation we care about.


  3. The procedure: The asker is, say, a program officer / director of a foundation
  with a "long-term future" portfolio who must decide whether to fund proposals with
  tiny probability of astronomical payoff, and specifically wants a procedure that
  tells them how to handle "dilution" arguments (simulation, Boltzmann brains, skepticism
  about future generations'' existence, the possibility that value is infinite so
  nothing matters — actually infinite ethics is a different dilution). Steps:


  - Step 0: state the claim in "value × probability" form; identify the magnitude
  class (ordinary, large, astronomical, infinite).

  - Step 1: Is the value claim about identifiable beings, or about a "state of the
  world"? Does it require a chain of causation we can trace? (Traceability test.)

  - Step 2: Probability: can the probability be bounded from below by something other
  than the theory itself? Distinguish "probability of failure" from "probability that
  the scenario''s background assumptions are wrong" (the simulation hypothesis is
  of the latter type).

  - Step 3: The self-application test: does the dilution argument, applied consistently,
  also dilute the argument''s own premises or the asker''s other, ordinary commitments?
  E.g., if "we''re probably simulated" discounts far-future work by factor p, does
  it also discount the value of near-term suffering relief? If it discounts everything
  equally, it changes no rankings — hence it cannot, on its own, be a reason to prefer
  near-term work. That''s a nice, non-obvious, correct-ish point: a uniform discount
  factor doesn''t change which option ranks higher; it only matters if it''s *differential*.
  So the procedure should ask: "is this dilution factor differential between the options
  I''m choosing among, or does it apply to all of them equally?" If uniform, it''s
  irrelevant to the ranking. That''s the crux, and it''s a nice piece of conceptual
  work to operationalize. Good — this is the kind of thing that makes a procedure
  prompt interesting.

  - Step 4: If differential, check whether it''s really differential: the sim hypothesis
  might be differential if far-future effects depend on our being in the "base" world
  (e.g., interventions that require long causal chains through a simulated environment''s
  physics — but any intervention we can make is inside our world, so...) Actually
  a genuinely differential version: if we''re simulated, the simulators may terminate
  the simulation, so long-run interventions have a "truncation risk" not shared by
  near-term ones. That is differential: the far future is truncated if the sim ends,
  whereas near-term benefits are already realized. So the sim argument could be differential
  in that specific way — it caps the duration of effects. Interesting: it''s a "temporal
  truncation" argument. So the procedure can ask: "does the dilution factor attach
  to the length of the causal chain / duration of the effects, or to everything equally?"

  - Step 5: The "who benefits" test: whose welfare is being valued, and do those beings
  exist under the dilution scenario? (Simulated beings'' welfare may still count.)

  - Step 6: The fanaticism guard: a rule for when a tiny-probability astronomical
  claim may override a certain moderate good — e.g., require the probability be bounded
  below by an independent argument, require that the same reasoning not license absurd
  sacrifices (the "mugging test"), and require a budget cap so that fanaticism is
  bounded institutionally rather than theoretically. And the honest note: the theory
  cannot tell you the probability floor; that''s a judgment call.

  - Hand-off points: which decisions the officer must escalate to the board because
  they''re value choices (e.g., whether infinite values swamp everything).


