  Key conceptual points (from my knowledge, no quotes needed):


  1. Fanaticism: The view that if you accept expected value maximization with unbounded
  utilities / arbitrarily tiny probabilities of arbitrarily large goods, you''re committed
  to absurd conclusions — e.g., Pascal''s mugging, and the "fanaticism" objection
  that EV maximization requires sacrificing certain moderate goods for tiny chances
  of astronomically large goods. Related: Bostrom''s "Infinite Ethics" (infinite values
  break EV), the "many-worlds" issue (if MWI, measure is spread over branches — no
  dilution of EV since everything happens; actually MWI doesn''t dampen EV because
  the good happens in some branch).


  2. Simulation argument: Bostrom''s trilemma — at least one of: civilizations go
  extinct before posthuman; posthuman civilizations don''t run ancestor simulations;
  we are almost certainly living in a simulation. The "simulation argument dampens
  fanaticism" idea: some argue that if we''re probably simulated, then the "far future"
  we''re trying to protect is either (a) the simulators'' concern, not ours, or (b)
  less real/valuable, or (c) our actions'' effects are truncated — so the astronomical
  value of shaping the far future should be discounted. The counter: the simulation
  hypothesis, if true, doesn''t reduce the value of the far future for simulated beings
  (their welfare still matters), and it''s a hypothesis about the nature of reality,
  not an extra probability of failure — treating it as a discount factor double-counts,
  since you should already be uncertain about the future''s realization. Also there''s
  a self-undermining issue: if we''re simulated, the simulators might act on our outputs...
  Hmm.


