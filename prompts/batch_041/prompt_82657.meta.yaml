  Check subtle errors:

  1. "frequentist says a probability is just the relative frequency ... in a long
  run of trials" — conflation of finite frequentism (relative frequency in an actual
  finite sequence) and hypothetical frequentism (limit in an infinite sequence). Also
  "a probability statement is really a prediction about a series of experiments" —
  mischaracterization: for the frequentist it''s a definition/claim about the collective,
  not a prediction. And "strictly meaningless for a single event" — this is von Mises''s
  view but is presented as definitional and unqualified; also many frequentists (and
  finite frequentists) can assign probabilities to single events relative to a reference
  class. So this is a common simplification shading into misrepresentation.


  2. "subjectivist says a probability is a person''s degree of belief" — okay as a
  start, but "since different people can have different beliefs, subjectivism implies
  that any assignment of probabilities is as good as any other so long as it is internally
  consistent" — overstatement: coherence is a strong constraint (avoids Dutch books),
  and subjectivists (de Finetti) proved that exchangeable priors converge, so priors
  are not equally good in any predictive sense; also "as good as any other" conflates
  permissibility with accuracy. Also "internally consistent" is a technical term (coherence)
  used loosely.


  3. "propensity ... located in the object itself" — subtle: propensities are usually
  properties of the chance setup (coin + tossing mechanism + conditions), not the
  bare object; also "this is the interpretation that lets us assign probabilities
  to single events" — overstatement: subjectivists also assign probabilities to single
  events (credences), and propensity theories face their own single-case problems
  (what is the propensity for? the reference class). And "the interpretation physicists
  actually use" — overstatement; physicists often use frequentist statistics or subjectivist
  Bayesian methods, and quantum mechanics is sometimes given a propensity reading
