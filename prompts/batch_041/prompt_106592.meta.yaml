  ---


  I''m a novelist — three books in, all of them domestic realism, nothing with a thesis
  — and lately I''ve been circling luck egalitarianism for reasons I can''t fully
  defend. My partner is finishing a PhD in philosophy and she explains it to me over
  dinner in bits: inequalities that trace back to brute luck (where you were born,
  what your body does, what falls on you) are unjust and should be corrected, while
  inequalities that trace back to option luck — gambles you knowingly took — are,
  on the strict view, your problem. What actually hooked me wasn''t the clean version,
  it was the ugly edge cases that the papers seem to treat as embarrassments: the
  objection that a consistent luck egalitarian ends up abandoning the imprudent, and
  the nastier one where a person''s genuinely voluntary bad choice turns out to be
  downstream of brute luck all the way down (bad schooling, a childhood that taught
  her that risk is for suckers, whatever).


  So here''s what I want: a short story (2,000–3,000 words, third person, past tense)
  set in a near-future coastal town that has actually implemented the thing — there''s
  a Reckoning Office, staffed by clerks who classify each citizen''s misfortunes as
  brute or option, and a schedule of what the town owes you when it''s brute. My protagonist
  is one of the clerks, a woman named... let''s say Della, mid-fifties, who''s good
  at the job because she''s unsentimental, and the story turns on a single claim she
  has to rule on: a fisherman who declined the town''s storm insurance three years
  running (he could afford it, barely, and said he''d rather spend the money on his
  boat), whose boat then went down in a storm, and whose teenage daughter now needs
  something expensive that the town will only cover if the father''s misfortune counts
  as brute. I don''t want a lecture or a thought experiment with names stapled on
  — I want the machinery to be ordinary background, the way insurance paperwork is
  ordinary, and I want Della''s ruling to feel like a real administrative decision
  that costs somebody something. Ideally the reader ends up feeling the pull of the
  principle and the pull of the objection at the same time and can''t tell which one
  the story is for. One more thing: there''s a second clerk, younger, who keeps arguing
  that the whole classification scheme is a way of laundering contempt — I''d like
  that argument present but not settled, and I''d rather you not have anyone win the
  argument in dialogue. If the ending can land on Della doing something small and
  definately not heroic, that''s the register I''m after.


  ---


