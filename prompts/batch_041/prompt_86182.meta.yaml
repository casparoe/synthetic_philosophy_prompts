  Draft:


  My friend and I have been going back and forth for weeks about ant colonies and
  I want you to write an essay that actually settles it, and by settles it I mean
  you pick a side and defend it. Don''t give me a tour of the options and then shrug.


  Here''s the thing we''re fighting about. A colony of a few hundred thousand ants
  does stuff that looks for all the world like thinking. It keeps the nest at a steady
  temperature. It sends more foragers out to the better food source and fewer to the
  worse one, and it does this without any ant knowing how many other ants are where.
  It builds bridges and living rafts. It decides, apparently, when the whole operation
  should pack up and move. And none of this is in any individual ant. An ant on its
  own is a twitchy little automaton with about five rules and a bad attitude.


  My friend''s line: the colony isn''t thinking, it''s just a lot of ants following
  pheromone rules, and all the mental vocabulary -- deciding, wanting, remembering
  -- is a convenience we project because it''s easier to say the colony "decided"
  than to write out the trajectories. Fine. But then he has to explain why he won''t
  say the same thing about me. I''m a hundred billion neurons and not one of them
  has any idea what this sentence means. If "it''s just parts following rules" kills
  the colony''s mind, it kills mine, and then we''re not disagreeing about ants anymore,
  we''re disagreeing about whether anything has a mind. He says brains are different
  because they''re integrated, whatever that means. I say he''s smuggling in the answer.


  So I want to propose a test and have you actually evaluate it rather than describe
  it. Here it is. Take two descriptions of the colony: one that tracks every ant,
  one that tracks the colony as a single thing with states like hungry and committed-to-this-trail.
  If the coarse description lets you predict and compress what happens better than
  the fine one -- if there''s real information at the colony level that isn''t sitting
  in any ant -- then the colony-level pattern is real, not a projection, and mental
  talk about it is tracking something. If it doesn''t, then my friend wins and it''s
  just bookkeeping.


  My worry is the test proves way too much. The weather compresses beautifully and
  I don''t think it''s thinking. Same for the economy, the immune system, a slime
  mold, the traffic on the interstate. Either the test is too weak and I need a second
  condition, or I have to bite the bullet and say mind is everywhere there''s a real
  higher-level pattern, which sounds insane but might be the honest option.


  There''s a second thing I can''t get straight and I want you to take a position
  on it too. It seems like there are two different things we might mean by "having
  a mind." One is being the kind of system you have to describe in mental terms because
  nothing else works. The other is there being something it''s like to be it -- someone
  home. The colony might pass the first and obviously fail the second, or it might
  pass both, or the two might come apart in a way that makes the whole question confused.
  I don''t want a both-are-valid answer.


  And here''s the bit that actually keeps me up: the ants aren''t like my neurons.
  A neuron isn''t running around with its own little life. An ant is a whole animal
  with its own interests and its own survival at stake, and the colony''s interests
  can conflict with its -- the colony sends workers to die by the thousands and the
  workers go. So the colony mind, if there is one, would be built out of subjects
  rather than out of parts. Is that a reason to think there can''t be a colony mind?
  Or is it exactly what a mind always is, just at a scale where we can see the seams?
  Compare a split-brain patient, compare a corporation, and tell me which comparison
  is doing the real work.


  Write the essay. Weigh my friend''s position and mine fairly -- if my test is bad,
  kill it, and if his reductionism is unstable, say why. Then land somewhere. Say
  whether an ant colony can have a mind, and if your answer is "sort of" then spell
