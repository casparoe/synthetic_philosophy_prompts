  next month at a small workshop on decision theory and formal epistemology. The paper
  defends what I call distributional acausal trade. The rough idea is this: instead
  of treating acausal trade as an exchange between two causally isolated agents who
  each have a fixed utility function and a fixed prior over the other''s decision
  procedure, I treat it as an exchange between two probability distributions over
  agent-types -- distributions that each agent partially controls by choosing a policy.
  An agent ''trades'' with another not by predicting what that other will do, but
  by choosing a policy that shifts the conditional distribution of its own type across
  worlds in which the other distribution is instantiated. On this view, acausal trade
  is rational exactly when the agents are logically updateless in the sense that their
  choice of policy is evaluated from a perspective that does not privilege the actual
  indexical location of the decision. The workshop audience will be mostly causal
  decision theorists and game theorists, with a couple of people who work on logical
  induction and one philosopher of probability who is deeply suspicious of measures
  over merely possible agents. My friend thinks the whole thing collapses into either
