  Draft:


  ---


  I write about science and ideas for a metropolitan daily, and over the past decade
  my reporting has drifted steadily toward the science of exhaustion and the politics
  of working hours. Ten years ago I covered a nine-week strike at the Delmar Tool
  & Die plant outside Dayton, Ohio, where the local traded a scheduled raise for a
  four-day week at thirty-two hours, and the local has now asked me to give the after-dinner
  speech at the dinner marking that anniversary. I know the room well enough to be
  nervous about it, and I would like you to write the speech.


  The room is three rooms at once. There are the old-timers, men and women in their
  seventies and eighties who spent thirty years on the floor at fifty-five hours a
  week, some of them proud of it, some of them with ruined shoulders and unfinished
  arguments at home; anything that sounds like a verdict on how they spent their lives
  will be heard as contempt. There are the members who were in grade school when the
  strike ended, who treat the fifth day as an inheritance and will not sit still for
  a lecture about gratitude. And there are two executives from the parent company
  at the head table, who have come a long way to hear a good story about a plant that
  learned to do more with less; I do not want to hand them that story. The local''s
  president has asked me, in so many words, to be honest and not to be a jerk about
  it.


  Here is what my reporting turned up, and it is the reason I can''t just write a
  cheerful anniversary speech. Within three years of the strike, overtime on the four
  remaining days had eaten back most of the gain; total hours per member fell by less
  than two a week. The fifth day did not stay empty. It filled with elder care, with
  grandchildren, with second jobs, and with what people kept calling projects — a
  woodshop, a rebuilt truck, a certificate program — and more than one member told
  me, half joking, that they felt guilty on a Tuesday when they hadn''t done anything
  with the day. Meanwhile the plant''s injury rate fell and its defect rate fell with
  it, and those two numbers are now the entire public case for the four-day week,
  both in the company''s recruiting material and in the union''s newsletter. The best
  argument anyone has for the fifth day is that the other four days went better.


  I have been carrying around a distinction that I would like the speech to test rather
  than to preach. There are two ways to defend time off. The first is restorative:
  the time is owed back to you because you will work better for having had it, and
  it is justified by what it returns to the job. The second makes no such promise;
  the time is yours because a life is not a shift, and it does not have to pay anyone
  back. The Delmar experience is, so far as I can tell, a clean natural experiment
  in which of the two defenses actually survives contact with a payroll department,
  and I suspect the answer is uncomfortable. Deaths from overwork — the Japanese have
  a word for them, karoshi, because people kept dying at their desks — are the limit
  case at the other end, and I want the speech to touch that without turning it into
  a sermon aimed at the people in the room who did the hardest years.


  What I need from you: a speech of about a thousand words, six to eight minutes out
  loud, in American English, that holds all three audiences without flattering any
  of them. It should honor the old-timers without blessing the fifty-five-hour week
