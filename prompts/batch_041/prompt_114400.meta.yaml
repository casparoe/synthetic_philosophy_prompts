  Strawson reactive attitudes belief set:

  (a) To hold someone morally responsible just is to be disposed to have reactive
  attitudes toward them.

  (b) The reactive attitudes don''t need any external (metaphysical) justification;
  the demand for one is incoherent or idle.

  (c) But the participant stance is not optional or merely one stance among others
  — it''s constitutive of our form of life.

  (d) Nevertheless, adopting the objective stance toward someone is sometimes appropriate,
  and we can''t be argued out of the reactive attitudes anyway.

  (e) Determinism is irrelevant to whether we should hold people responsible.

  (f) But I also think that if we discovered that a person''s character was entirely
  the product of childhood deprivation, we should moderate our resentment.


  Tension: (b) vs (c)? If the reactive attitudes need no external justification and
  are inescapable, then what work does (f) do — and isn''t (f) an admission that general
  facts about origins can rationally revise our attitudes, which is exactly what the
  pessimist says? Also (a) + (b): if responsibility just is the disposition to react,
  then "should we hold responsible" can''t be asked from outside; but Strawson does
  distinguish "exempting" from "excusing" and treats the objective stance as appropriate
  in some cases (e.g., towards the very young, the deranged), which implies a norm.


  Hmm, actually the real subtlety: Strawson''s "the optimist and the pessimist" —
  he says the pessimist (who thinks the truth of determinism would undermine responsibility)
  is not refutable but "incoherent" because the reactive attitudes are not up for
  external justification. But Strawson also says the question of whether to adopt
  the objective stance is a "moral question" in a broader sense. There''s a tension:
  is the objective stance a choice we can rationally make, or not?


