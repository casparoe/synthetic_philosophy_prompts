  Student answer draft:


  "The moral equality of combatants is the doctrine that soldiers on both sides of
  a war have the same rights and duties under jus in bello, regardless of whether
  their side is fighting justly. Walzer''s version of this is that once war has begun,
  the question of who is in the right (jus ad bellum) drops out, and all combatants
  are permitted to kill one another and prohibited from killing noncombatants, symmetrically.
  The doctrine does important work: it explains why we don''t treat enemy soldiers
  as criminals merely for fighting, and it grounds the symmetry of the laws of war
  — the rules apply equally to both sides, and neither side''s soldiers can claim
  a superior legal status. It also protects soldiers from the impossible burden of
  having to adjudicate the justice of their state''s cause before they can know whether
  they may fight.


  The revisionist critique denies the symmetry. McMahan''s central claim is that whether
  you may kill depends on whether your target is liable to be killed, and liability
  depends on whether the target is responsible for an unjust threat. An unjust combatant
  is fighting for an unjust cause, so he is responsible for an unjust threat, so he
  is liable to be killed. A just combatant, by contrast, is not liable. So on the
  revisionist view the permissions are asymmetric: the just combatant may kill the
  unjust combatant, but the unjust combatant may not kill the just combatant; if he
  does, he commits murder.


  Applied to the case: A''s soldier is fighting for an unjust war of conquest, so
  on the revisionist view he is liable and B''s soldier may kill him. B''s soldier
  is fighting defensively and is not liable, so A''s soldier may not kill him. On
  the traditional view, both may kill each other, because both are combatants and
  the in bello rules apply symmetrically; the fact that A''s cause is unjust makes
  A''s soldier blameworthy for the war but does not change his permissions in the
  field. So the traditional doctrine says the firefight is a case of mutual permission,
  and the revisionist says it is one-sided.


  I find the revisionist critique more defensible. The traditional doctrine asks us
  to treat two soldiers who are doing very different things — one defending his country,
  one conquering another''s — as if they were morally on a par, and that seems false.
  The A soldier is engaged in an unjust project even if he does not know it, and ignorance
  does not make an unjust threat just. The strongest point against my view is that
  ordinary soldiers cannot be expected to know the justice of their cause, but I think
  that shows only that they are excused, not that what they do is permissible."


