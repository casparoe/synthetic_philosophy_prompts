  I have been trying to pin down what the cross-cultural challenge to analytic philosophy''s
  method really amounts to, and I have arrived at a deflationary position that I would
  like you to press on as hard as it can be pressed.


  The position is this: most of what gets reported as cross-cultural variation in
  philosophical intuition is variation at the wrong level. I find it useful to distinguish
  three loci at which a subject''s response to a case can differ. There is the intuition
  itself — what actually seems to the subject to be the case about the scenario. There
  is the uptake — the evidential weight the subject assigns to that seeming, whether
  it registers as a datum any adequate theory must accommodate or as a defeasible
  hunch. And there is the theoretical verdict — what the subject concludes about the
  philosophical question, given the intuition and whatever background commitments
  they bring to it.


  My claim is that the documented variation, whether about knowledge, reference, personal
  identity, or the trolley family of cases, is overwhelmingly variation at the second
  and third loci, and that variation there is both expected and philosophically benign.
  It shows at most that different populations have different habits of deference to
  their own seemings, or different background theories, not that they intuit differently.
  The challenge would be serious only if we found variation at the first locus: a
  case on which competent subjects from different cultures genuinely seem to see the
  situation differently, in a way that survives translation of the case and is not
  explained by mere unfamiliarity with the genre of the thought-experiment. I suspect
  very little variation of that kind survives.


  So what would count against me? I want the defeaters sorted by how much they should
  move someone who starts where I do. What would it actually look like for variation
