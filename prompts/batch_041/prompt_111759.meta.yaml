  The position is this. Reports of cross-cultural variation in philosophical intuition
  are, by and large, variation at the wrong level. I distinguish three loci at which
  a subject''s response to a case can vary. First, the intuition itself: what seems
  to the subject to be the case about the scenario. Second, the uptake: the evidential
  weight the subject assigns to that seeming — whether it registers as a datum that
  any adequate theory must accommodate, or as a mere inclination that could be mistaken.
  Third, the theoretical verdict: what the subject concludes about the philosophical
  question, given the intuition and whatever background theory they bring.


  My claim is that most of what is reported as cross-cultural variation is variation
  at the second and third loci, and that variation there is both expected and philosophically
  benign: it shows at most that different populations have different habits of deference
  to their own intuitions, or different background theories, not that they intuit
  differently. The challenge is serious only if we find variation at the first locus
  — a case where competent subjects in different cultures genuinely seem to see the
  situation differently, in a way that survives translation of the case and is not
  explained by unfamiliarity with the genre of philosophical thought-experiment. I
  suspect that when we look, very little variation of that kind survives.


