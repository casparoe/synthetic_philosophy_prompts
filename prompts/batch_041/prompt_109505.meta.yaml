  Let''s draft:


  I''m a retired field entomologist—spent most of my career on ant trail pheromones,
  of all things—and since I hung up my field boots I''ve gotten weirdly into philosophy
  of biology. I now volunteer as the science advisor for a small natural history museum
  and a podcast, which mostly means I''m the person who has to sign off on exhibit
  labels and scripts. Our team keeps writing things like the beetle''s horn evolved
  to fight rivals, or the bird''s alarm call evolved to warn its relatives, and I
  keep thinking about the spandrels critique of adaptationism—the argument that not
  every trait is an adaptation; some are byproducts, developmental constraints, drift,
  exaptations, or just side effects of selection on something else. The director wants
  a new gallery called Built by Evolution, and I can already see every label turning
  into a just-so story. I have about twenty minutes per script, the writers have intro
  bio, and I can''t send them off to read the literature.


  What I need from you is a decision procedure I can actually hand to a writer. Something
  like a flowchart in words: the questions to ask in order, what counts as a sufficient
  answer at each step, where the procedure stops with a hard no on the phrase evolved
  for, and where it has to hand the decision back to me because it''s a judgment call
  about evidence or rhetoric rather than a fact. It should keep separate two things
  we always blur: what a trait currently does and why it originally spread; and it
  should force a check for the usual alternatives—byproduct, exaptation, constraint,
  drift, correlated selection—before anyone is allowed to say evolved to. I also want
  it to say what language to use when the evidence is thin: currently functions as,
  is consistent with, may have been favored, we don''t know, etc. And it should flag
  the places where judgment can''t be eliminated, like how much comparative evidence
  is enough or whether a plausible developmental story counts as a byproduct explanation.


  Then run it on three cases so I can see how it behaves. First, a label claiming
  a male beetle''s oversized horn evolved for fighting rival males. Second, a script
