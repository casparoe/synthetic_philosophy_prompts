  Student answer draft:


  "(i) Darwin: the traditional picture had it that anything showing design or purpose
  must have been designed — the purpose comes first and the mind that has the purpose
  comes first too. Darwin inverts this by showing that you can get adaptation, which
  looks like purpose, out of a process that has no purpose and no designer at all:
  variation plus selection, where nothing in the process is aiming at anything. Turing:
  the traditional picture had it that a machine can only do what we''ve told it to
  do, and that doing arithmetic or logic requires knowing what arithmetic and logic
  are. Turing inverts this: a machine can be a perfect computing machine without knowing
  what arithmetic is, because following a rule isn''t the same as understanding it.


  (ii) The two inversions are the same inversion applied to different material. In
  both cases what looked like it had to be the source of the phenomenon — a mind with
  purposes, a mind with understanding — turns out to be downstream of something mechanical.
  So purpose and understanding are really just names for the behaviors the mechanism
  produces; once you see how the trick works there''s nothing left over. I''d say
  Turing''s inversion does depend on Darwin''s, because the human minds that built
  the computers were themselves produced by the mindless Darwinian process; if you
  thought minds were exempt from that, Turing''s move would just push the question
  back a step.


