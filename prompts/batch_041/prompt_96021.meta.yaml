  I''d accept it. If you''re allowed to explain comprehension as competence all the
  way down, then ''comprehension'' isn''t doing any work that ''competence'' wasn''t
  already doing, and calling a machine a comprehender is just a shorthand. Dennett''s
  slogan is really about how competence gets produced, not about some extra ingredient,
  so I think he has to accept the eliminativist conclusion too."


