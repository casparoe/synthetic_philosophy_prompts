  Question: Dennett argues that Darwin and Turing each performed what he calls a strange
  inversion of reasoning. (i) For each of the two, say what assumption gets inverted
  and what replaces it. (ii) What is the relation between the two inversions — does
  either need the other to go through? (iii) A critic objects: if competence can come
  apart from comprehension, then nothing ever really comprehends anything. Does that
  objection follow from the inversions? Answer all three.


  Student''s answer: [~300 words]


