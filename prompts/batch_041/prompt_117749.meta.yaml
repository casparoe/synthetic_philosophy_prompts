  Draft:


  I''m a third-year PhD student in philosophy of science, and I''m preparing a position
  paper for a formal epistemology reading group, so I''d like to state my commitments
  cleanly and have someone check whether they can all be held at once. Here is where
  I''ve landed:


  (1) Credences are probabilities, and the only diachronic norm is conditionalization:
  when you learn something with certainty, you move to your prior conditional on it.
  I take this to be non-negotiable.


  (2) Logical omniscience is not an embarrassment but a constitutive ideal. A rational
  agent''s credence in any logical truth is 1 and in any contradiction is 0, and this
  follows from what credence is rather than from an idealization we could relax. I
  am happy to say that an agent who is unsure whether a valid inference is valid has
  a defective credence function, not merely a resource-limited one.


  (3) The problem of old evidence is a real problem. When a theory entails a result
  that was already established — the textbook case is a new theory of gravity entailing
  an anomaly in Mercury''s orbit that had been on the books for half a century — the
  entailment is part of what confirms the theory, and a Bayesian account that cannot
  say so is incomplete.


  (4) The right response is the counterfactual one: confirmation is assessed by the
  likelihood of the evidence at the credence function the agent would have had if
  she had not already known it, i.e. P(H | E) evaluated at an earlier function rather
  than at her current one.


  (5) Reasoning can be a source of justification. Someone who has just worked through
  a proof of a theorem she had previously only half-believed is rationally more confident
  of it, and her epistemology should license that transition. I do not think this
  is merely a psychological fact about her.


  (6) Where evidence is uncertain rather than certain, Jeffrey conditionalization
  is the right generalization.


  I would like an audit rather than a summary of the literature: which of these are
  actually in tension, which only look like they are, and how severe each real tension
