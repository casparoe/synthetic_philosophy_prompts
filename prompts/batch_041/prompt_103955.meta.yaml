  Prompt:


  You are an expert in early modern philosophy and the history of monetary thought.
  I am assembling a set of cases for a seminar on the philosophy of money, and I need
  a thought experiment built to order. The target is Berkeley''s view that money is
  best understood not as a commodity with value in itself but as a ticket, counter,
  or claim on real goods, so that its economic role depends on convention, trust,
  and circulation rather than on the metallic content of the coins. I want a case
  that isolates this view from a straightforward metallist alternative, where the
  metallist treats the value of money as inhering in the precious metal and therefore
  treats a reduction in the coin stock as a reduction in wealth. Do not rely on any
  particular passage or title; I care about the theoretical contrast, not textual
  citation.


  Construct a thought experiment with the following specifications. It must be realistic:
  a small port town or colonial settlement, not a fairy tale, and no magic, no perfect
  foresight, no omnipotent intervener. The scenario itself should be one paragraph.
  It must involve a change in the quantity or availability of money while holding
  fixed the town''s real productive capacity, its stock of consumable goods, and its
  people''s skills and needs. The case must not be a simple inflation story, and it
  must not turn on a change in the goods themselves. The specified verdicts are: the
  metallist should conclude that the town''s wealth has genuinely fallen or is seriously
  threatened by the monetary change, while the Berkeleyan should conclude that the
  town''s real wealth is unchanged and that the problem is a breakdown in the system
  of tickets, counters, or claims. The disagreement should arise from the theories
  themselves, not from one side being made to hold an obviously silly auxiliary assumption.
  Finally, the case should include one feature that is doing the real work in separating
  the two verdicts, and it should be a feature that could be removed without changing
  the physical facts of the town.


  Begin with a short Brainstorm section of three to five bullet points, then give
  the response in the following sections, in this order and with roughly these lengths:
  Scenario (one paragraph); The metallist''s verdict (roughly 150-200 words); The
  Berkeleyan''s verdict (roughly 150-200 words); The feature doing the work (roughly
  100-150 words); If we remove that feature (roughly 100-150 words); How a metallist
  would push back (roughly 100-150 words). In the final section, give the strongest
  reply available to the metallist, not a straw man. Be precise about which claims
  belong to Berkeley''s monetary view and which are your own reconstruction.


