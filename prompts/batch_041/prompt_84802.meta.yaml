  Let''s design a memo prompt:


  Context: I am a retired atmospheric physicist, now a lay member of the national
  scientific advisory council. The council is revising its protocol for "expert disagreement"
  in risk assessment. The current protocol says: when two credentialed experts have
  seen the same evidence and still disagree, the council should treat the disagreement
  as a sign that at least one is irrational, biased, or not acting in good faith,
  because if they shared the same prior probabilities and updated on the same evidence,
  their posterior probabilities would coincide (and this would be common knowledge).
  The council''s chair wants to keep this rule and use it to discount one expert''s
  testimony in an upcoming case about a low-probability, high-consequence risk. But
  the two experts in question are both careful, and one has a different prior about
  the model''s structure. I need to draft the written opinion for the council: should
  we retain, revise, or abandon the rule? What concrete procedure should we adopt
  for the upcoming case? Include the strongest argument for the chair''s position,
  and explain why it may fail. Recommend a decision with a time frame.


