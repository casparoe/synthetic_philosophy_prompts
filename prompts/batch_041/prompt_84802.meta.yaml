  Draft:


  I am a retired atmospheric physicist and, since retiring, I have been reading philosophy
  of science and decision theory. I sit as a lay member on the national scientific
  advisory council. The council is revising its protocol for cases in which credentialed
  experts disagree after examining the same evidence. Our current rule says that such
  disagreement is prima facie evidence that at least one expert is irrational, biased,
  or acting in bad faith, because if the experts shared the same prior probabilities
  and updated correctly on the same evidence, their posterior probabilities would
  coincide, and this would be common knowledge among them. The chair now wants to
  apply the rule to an upcoming assessment of a low-probability, high-consequence
  risk: two careful experts have reached different conclusions, and the chair proposes
  to discount the dissenting expert''s testimony on the ground that the disagreement
  itself shows he must have made an error. I am not persuaded, but I need to give
  the council a written opinion it can act on. Please draft that opinion. It should
  recommend whether to retain, revise, or abandon the rule, and set out a concrete
  procedure for the upcoming case with a clear time frame. It should engage the strongest
  version of the chair''s position, explain what the rule assumes about common priors,
  common knowledge, and rationality, and say what follows when the disagreement concerns
  the choice of prior itself rather than the updating. It should also address whether
  the council can legitimately treat a dissenting expert''s testimony as evidence
  of error without first establishing that the relevant assumptions hold. Please write
  in British English, and keep the opinion suitable for circulation to a non-specialist
  council.


