  is misleading (since P is true and known). So S can rationally ignore E. But that
  seems to license dogmatism. The paradox''s resolutions: (a) you can know P but not
  know that you know it, so you can''t be sure E is misleading; (b) "misleading" evidence
  can still rationally require you to lower confidence or investigate; (c) the paradox
  trades on an ambiguity in "evidence against P" or on the fact that knowledge can
  be defeated even if not undermined. There''s work by Kripke, and responses by Harman,
  Ginet, etc.


