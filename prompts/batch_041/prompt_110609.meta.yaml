  Berkeley on money (The Querist, 1735–37):

  - Money in itself is nothing; it''s a ticket or counter, a means of reckoning and
  transferring claims to goods.

  - True wealth is the power to command the labour and industry of others; the wealth
  of a nation lies in the industry of its people, not in bullion.

  - The desire of money for its own sake is a delusion ("whether the passion for money
  be not a sort of madness?").

  - Money''s value is by convention/credit; it depends on the common faith/opinion
  of the people — "the credit of a bank" rests on opinion.

  - So the materiality of money is a kind of illusion: the coin is not the thing;
  the thing is the mutual acknowledgment.


  The film:

  - George''s speech at the run on the B&L: he explains the money isn''t in the bank,
  it''s in the houses of the neighbors; the bank''s assets are promises. That''s a
  Berkeleyan picture of credit as collective belief.

  - Potter: money as the substance; he treats the town''s people as assets. He''s
  the "materialist."

  - The counterfactual Bedford Falls → Pottersville: what a town is depends on the
  minds and relations that sustain it. Money and property are sustained by perception/acknowledgment
  — Berkeley''s idealism applied to the social world: to be (a bank, a debt, a dollar)
  is to be perceived/recognized. There''s a real philosophical point: financial ontology
  is institutional (Searle''s "X counts as Y in C") — but the model can''t be asked
  for Searle? It could, it''s well known. But no citations needed.

  - Where the film resists Berkeley: George''s crisis is precisely that he''s short
  $8,000 of *currency*, and the town is saved by a basket of *cash*; the ticket has
  to be redeemed. Berkeley''s view says the ticket''s value is the goods it commands
  — the film says the failure to have tickets on demand (liquidity) destroys everything.
  Also, the film ends with the money (from Sam Wainwright''s telegram, from the townspeople)
  — the "richest man in town" toast is about friends, but it''s expressed by money
  given. So the film is torn: it both says money is nothing and shows that money is
  everything in a crisis. That''s a genuine two-way reading.

  - Also: George''s dream — the wish that he''d never been born — is a thought experiment
  about the *counterfactual* value of a person; and the "to be is to be perceived"
  idea: if George had never existed, no one would perceive the good he did; his existence
  is constituted by the difference he made in others'' perceptions. That''s a nice
  link to Berkeley''s idealism proper.

  - And the "money is a ticket" theme: Violet, Uncle Billy (who''s literally rich
  in nothing but loses the deposit), the Bailey Building & Loan''s mission of "not
  for profit" — the 1932 scene where George sees the B&L''s purpose: giving people
  homes, being "the poorest..." Hmm, the scene with Potter at the board: "They''re
