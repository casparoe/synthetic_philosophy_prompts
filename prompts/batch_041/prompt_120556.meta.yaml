  "I retired three years ago from a career in experimental physics — most of it spent
  on precision measurement and, in the last decade, on tests of Bell-type inequalities
  — and I have since been working through a graduate degree in philosophy. This term
  I have been sitting in on a graduate seminar on divine foreknowledge and human freedom,
  and the instructor has asked me to contribute one essay question to the final examination,
  partly because she wants the students to see the problem through a physicist''s
  eyes. I would be grateful if you would draft that question for me, together with
  a model answer and a marking scheme, since I am new enough to the literature that
  I would not trust my own version of a model answer.


  The seminar has spent several weeks on Molinism: the thesis, due to the sixteenth-century
  Jesuit Luis de Molina, that in addition to God''s knowledge of necessary truths
  and his knowledge of what he has decreed, there is a middle knowledge of conditional
  truths about what free creatures would do in circumstances that never obtain. ...
  The standard objection that interests me is the one that presses on the truthmakers
  of those conditional truths: if such a conditional is true and is not grounded in
  God''s will (which would destroy the creature''s freedom) nor in the creature''s
  nature and circumstances (which would make it a matter of the first kind of knowledge),
  it is unclear what makes it true at all. ..."


  Then the physics injection:


  "In my own field there is a notion that seems to me to sit very close to this, and
  I want the question to make the students work with it. In the foundations of quantum
  mechanics one speaks of counterfactual definiteness: the assumption that a measurement
  that was not performed nonetheless has a definite outcome, and that these unperformed
  outcomes may be treated on the same footing as performed ones in statistical reasoning.
  The Bell-type results are often presented as showing that one cannot simultaneously
  keep locality, the absence of a conspiracy between the settings and the hidden state,
  and counterfactual definiteness; something has to go, and in most interpretations
  it is counterfactual definiteness. I want the examination question to force the
  students to test the analogy between the physicist''s counterfactual definiteness
  and the Molinist''s counterfactuals of creaturely freedom..."


