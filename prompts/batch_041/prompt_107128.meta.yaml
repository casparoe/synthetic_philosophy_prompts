  I teach a senior seminar on rationality and collective decision-making, and I am
  writing the final examination. I would like a single essay question on the unilateralist''s
  curse: the selection effect by which, when any one of many actors can undertake
  an action on its own, the action tends to be undertaken by whichever actor holds
  the most optimistic estimate of its value, so that it goes forward precisely when
  the estimates are least to be trusted. The question must not be answerable by reciting
  the standard statement of the curse or the usual remedy. I want it to force students
  to pry the mechanism apart from the label.


  Three things should be unavoidable for anyone who answers it well. First, the student
  must state the mechanism exactly and identify which assumptions make it bite — in
  particular, that the actors'' estimates are noisy but centered on the true value,
  and that the action is triggered whenever any single estimate crosses the threshold.
  Second, the student must recognize that the effect is not really about one actor
  being able to act alone; it is about any decision rule that selects on the upper
  tail of a set of noisy estimates, and so it should reappear under, say, majority
  rule with many voters, and should be mirrored — with the sign reversed — under a
  rule requiring unanimity. Third, the student must confront a variant in which the
  spread of estimates reflects genuine differences in information rather than mere
  noise, so that selecting the most optimistic estimate is selecting the best-informed
  one, and the curse either vanishes or reverses.


  Please frame the question around a concrete, self-contained scenario I can print
  on the exam — a set of independent research teams, each of which can on its own
  begin a field trial of a technology whose net value is uncertain, each with its
