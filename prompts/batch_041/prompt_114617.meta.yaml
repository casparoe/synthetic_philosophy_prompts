  ---

  In my school''s philosophy club we are preparing for a debate, and I have been assigned
  the opening speech on the proposition that consequentialism cannot be put into practice
  because we cannot know the consequences of our actions. The argument my teammate
  gave me rests on an analogy I have heard all my life: a butterfly''s wingbeat on
  one continent sets off a tornado on another, so that a change too small to notice
  can be followed by a difference as large as you like. Our version goes: every choice
  I make — which charity I give to, whether I give at all, whether I buy coffee on
  the way to school — is followed by an unbounded chain of consequences I cannot trace;
  a child saved from malaria may grow up to be a tyrant, or may have grandchildren
  whose lives turn on that one donation; so I cannot know whether my donation did
  more good than harm, and the donation and the concert ticket are equally defensible.
  I want you to audit the analogy before I commit to the speech, because I have begun
  to suspect it proves too much.


  Please work through the following, and do not assume the argument is either obviously
  sound or obviously silly:


  - What is supposed to map onto what? Give me the correspondence explicitly: what
  plays the part of the wingbeat, of the air, of the tornado, of the observer who
  cannot forecast the weather?

  - The analogy''s engine is a claim about sensitivity to initial conditions in a
  chaotic system. Is that the same as the claim that the difference between my acting
  and my not acting is large? These seem to come apart: a system can be wildly sensitive
  to its exact state while barely responding to a particular small intervention, and
  forecasters who cannot say whether it will rain on a given Tuesday can still say
  a great deal about how much rain a season will bring. Which claim does our argument
  need, and which one does the analogy actually deliver?

  - Our argument needs to conclude not just that I do not know the downstream consequences
  but that they are unknowable in principle. Does the analogy support that stronger
  reading, or only the weaker one — and would the weaker one be enough to sink the
  consequentialist''s instruction to maximize expected good?

  - There is a further distinction I keep half-understanding: between my lacking information
  that more research could supply, and the counterfactual "what would have happened
  had I chosen otherwise" having no determinate answer at all. Which of these does
  the butterfly effect support, and does our argument need it?

  - I have also been told that the wingbeat''s energy is negligible and dissipates
  almost immediately, so that the famous claim, if it is true at all, is about divergence
  within an idealized model rather than about a real transfer of energy across a continent.
  If that is right, what is left of the analogy, and does the argument survive the
  translation?

  - Finally, the argument looks to me as though it cuts down everything in its path,
  including itself: if consequences wash out the difference between my donation and
