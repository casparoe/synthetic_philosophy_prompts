  Concrete set-ups for the uses:

  1. A colleague uses it to argue that Wikipedia/deliberative democracy/peer review
  is epistemically worthless — i.e., a claim about the reliability of group judgement
  (an empirical, socio-epistemic reading).

  2. Someone uses it to say "majority opinion is no guide to truth" — trivial platitude
  (majorities can be wrong).

  3. Someone uses it to say something about individual moral responsibility: responsibility
  cannot be distributed; when you act as part of a crowd you evade responsibility
  (an ethical/agential reading). This supports e.g. "you can''t excuse yourself by
  saying everyone was doing it" — which is not about truth at all.

  4. A theological/religious reading: before God one stands alone; the crowd is the
  medium of the esthetic/spiritless; only the single individual can be in the truth
  in the religious sense (the "kinship with the divinity"), so the claim is about
  the conditions of the highest good, not about ordinary factual belief.

  5. The conceptual/ontological reading: "crowd" is being used as a term of art for
  the abstraction — the public, the numerical "we" that has no hands; the claim is
  that there is no such thing as a collective knower/agent, so attributions of belief/action
  to the crowd are category mistakes; a crowd is not a thing that could be true or
  false.

  6. The rhetorical/diagnostic reading: a claim about leveling and the present age
  — a sociological diagnosis that modernity produces this abstraction, which then
  makes the individual''s task harder; the "untruth" is a verdict on the form of life,
  not on any particular belief.

  7. Maybe a quasi-logical reading: the crowd is untruth because a crowd is constituted
  by the individual''s flight from responsibility — i.e., the untruth is constitutive:
  to be a crowd at all (in the decisive sense) requires untruth. Note the fetched
  text: "in its very concept - is untruth" — the untruth belongs to the concept. So
  there''s a reading where the thesis is conceptual/necessary, not empirical.


