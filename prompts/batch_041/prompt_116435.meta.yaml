  Let me also consider: which is easier to make "in the weeds" without being regurgitable?
  The self-amendment + inviolate level one is good. There''s real philosophy here:
  the regress of rules (who applies the rule?), Hart''s rule of recognition, Kelsen''s
  Grundnorm, the idea that a legal system''s validity ultimately rests on a social
  practice (not another rule), the paradox of self-amendment (Suber), unamendable
  clauses, and the analogy to Gödel/tangled hierarchies. The model can reason about
  all this without needing citations. And the "inviolate level" mapping: in Drawing
  Hands, the drawing is at a level where the two hands are the same size — the "inviolate
  level" is the level of the picture plane / the artist''s conventions that are not
  themselves depicted; Hofstadter''s point is that a tangled hierarchy requires an
  untangled level beneath/above it, which is *not* represented in the loop. So for
  a self-amending constitution: the loop (the amendment rule amending itself) requires
  something outside — e.g., the ongoing social practice of officials and citizens
  treating the rules as binding, which isn''t itself a rule. So the friend''s conclusion
  (there must be an inviolate level, so the loop can''t be truly self-grounding) actually
  *holds* in a sense — but the twist is that the inviolate level need not be *another
  rule* (an unamendable clause); it can be a practice/regularity, or it can be a *process*
  outside the rule-text (people, courts, power). And a further twist: Escher''s hands
  *do* draw each other within the picture — the loop is real at the depicted level;
  the paper isn''t a "rule" — the analogy may smuggle in the idea that the inviolate
  level is itself part of the same normative system, when actually it''s a different
  kind of thing (a practice vs. a rule; a depiction vs. a depicted object). So the
  analogy breaks: the picture plane is *presupposed* and inert, whereas the social
  practice is dynamic and can change; and the two hands are symmetrical peers whereas
  amendment rules and ordinary rules are hierarchically related.


  Also can mention: the Drawing Hands loop is *drawn*, i.e., created from outside
  by Escher — so the "self-creation" is illusory at the level of the picture''s causal
  history; similarly, a self-amending constitution is created and sustained by people
  outside it. That''s a nice disanalogy with real bite: the loop is only a loop from
  inside the frame. Does the conclusion survive? Partially: yes, you can''t have a
  purely self-grounding normative system — but the "anchor" need not be an unamendable
  rule, and the friend''s practical conclusion (so we must have an eternity clause
  / so our amendment clause is a legal fiction) doesn''t follow; also, a self-amending
  system can be stable and legitimate without any unamendable clause if there are
  stable practices, and even unamendable clauses are enforced by practices (so the
  regress doesn''t stop at a rule, it stops at a practice). Also: an unamendable clause
  can be circumvented by changing what counts as "amendment," etc.


