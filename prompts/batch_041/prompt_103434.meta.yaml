  "I am putting together an application for a six-month postdoctoral writing fellowship,
  and I need a two-page research proposal on the reference class problem in probability
  and inductive inference. My half-formed idea is this: the literature tends to treat
  the problem as one of selecting, from among the many classes to which a particular
  event belongs, the class that is objectively or epistemically privileged for assigning
  a probability. I suspect that this framing gets things backwards. What does the
  work in a direct inference is not the reference class itself but a prior judgment
  of exchangeability among the cases in that class; the reference class is a bookkeeping
  device for that judgment, not its ground. If that is right, then many of the familiar
  puzzle cases are not cases of underdetermination in the world but of unacknowledged
  variation in what we are treating as exchangeable. I want to develop a distinction
  between what I am calling the descriptive reference class (the set of actual or
  possible cases that share the relevant features) and the normative reference class
  (the set of cases the agent is licensed to treat as exchangeable for the purpose
  at hand), and then use it to re-describe the problem. The proposal should state
  the central question so that it has a determinate answer, explain why the existing
  treatments leave it open rather than merely unresolved, and say what would count
  as a result: what a successful defense of the distinction would establish, what
  would show that it collapses back into the standard view, and what empirical or
  formal work (if any) the project needs. I would also like a realistic month-by-month
  plan for six months, including what the deliverable would be at the end (a paper
  draft? a taxonomy? a decision procedure?) and an honest statement of what would
  make the project too large or too speculative for the time. Please don''t include
  citations or a literature review by name; I will add references myself, and I would
  rather the proposal argue from the shape of the problem than lean on particular
  authors."


