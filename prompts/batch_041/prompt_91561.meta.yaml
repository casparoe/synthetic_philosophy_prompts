  I am preparing materials for a reading group on Mill''s political thought, and I
  have become preoccupied with the part of his career that usually gets a paragraph
  at most: the decades he spent as an official of the East India Company, his rise
  to its senior India-correspondence post, his unsuccessful campaign against handing
  the government of India over to the Crown in the late 1850s, and the memorandum
  in which he is said to have protested against the annexation of Oudh — the argument
  being, roughly, that a native ruler''s misgovernment does not license his dispossession.
  What interests me is how seamless the colonial argument is with the rest of his
  work: government by a small, salaried, trained body insulated from patronage and
  answerable to Parliament; "improvement" as the end that justifies despotism, so
  that despotism is legitimate only while it is educational; the claim that representative
  institutions are premature for a society not yet prepared for them, and that free
  institutions are nearly impossible in a country of many nationalities; the insistence
  that governing India well requires a knowledge of India that a Westminster amateur
  will never acquire; and, at home, a lifelong hatred of arbitrary power. I want a
  satire that takes this as an argument and follows it, rather than one that denounces
  Mill — and I want it absolutely clear that the colonised are not the butt of the
  joke.


  Please write, at about 800 words, a mock white paper from an invented management
  consultancy whose senior partner is a sincere admirer of Mill and has adapted his
  position for the contemporary development sector. Something like "Benevolent Despotism:
  A Governance Framework for Clients Not Yet Fit for Self-Rule", with headings, an
  executive summary, and a closing "next steps". The comedy has to come from the argument''s
  own machinery rather than from jokes about empire in general: a metrics section
