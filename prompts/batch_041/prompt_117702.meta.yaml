  \ the disposition, not the act.\n- Also \"Ratificationism\" (Jeffrey), \"Sophisticated\
  \ choice\" (McClennen).\n\nDesign the verdicts so that at least two rules fit them\
  \ and diverge on the new case.\n\nLet me construct a track record. Suppose a friend,\
