  \ rules:\n- Causal decision theory (CDT): choose the act with best causal consequences;\
  \ intend-and-pay is not rational because paying has no causal benefit.\n- Evidential\
  \ decision theory (EDT): pay, because paying is evidence you're the sort who pays\
  \ (in cases where there's a correlation).\n- \"Rational irrationality / policy-based\"\
  \ view: it's rational to be the sort of agent whose dispositions are optimal (Parfit's\
  \ \"self-interest theory of rational irrationality\"), or Kavka's \"intention-based\"\
