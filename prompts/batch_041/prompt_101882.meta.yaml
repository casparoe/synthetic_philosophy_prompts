  problem is fatal: if "lying is wrong" expresses disapproval, then in "If lying is
  wrong, then telling your brother to lie is wrong," the antecedent doesn''t express
  disapproval; so the meaning of "wrong" differs between asserted and unasserted uses;
  hence the inference "Lying is wrong; if lying is wrong, then ...; therefore ..."
  equivocates. Sam replies that this assumes meaning = expressed attitude, but an
  expressivist can say the meaning of "wrong" is a rule for updating attitudes, or
  a function from contexts to attitudes; in unasserted contexts the attitude is not
  expressed but the word still has the same meaning because it plays the same inferential
  role. Dana counters: then "wrong" is not essentially expressive; the attitude drops
  out of the semantics, and expressivism collapses into a version of non-naturalism
  or descriptivism about the inferential role. Sam says no, the inferential role is
  grounded in attitudes, like a commitment, and cites a "higher-order attitude" strategy:
  to think "lying is wrong" is to disapprove of disapproval of lying? Wait that''s
