  ---


  I chair the standing advisory committee of a state environmental-health agency.
  Our charge is to recommend a single numeric limit for a regulated airborne contaminant:
  the concentration at or below which the agency declares exposures acceptable, and
  above which it requires abatement. We have been deadlocked for two cycles, and I
  need to circulate a written opinion before the next vote.


  Two positions have hardened. One holds that because every reduction in exposure
  lowers the expected number of illnesses, each successively tighter limit is simply
  better than the looser one, so any limit we name is indefensible and we should adopt
  the tightest limit industry can technically meet. The other holds that shaving the
  limit, say, from 40 to 35 parts per billion buys so little health and costs so much
  abatement that it is not an improvement at all, and that below some point tightening
  makes things worse.


  Three features of our situation make this harder than a cost-benefit dispute. First,
  our bylaws instruct us to "adopt the option that is better than every other option
  considered," and we have always read that as licensing a sequence of pairwise comparisons.
  Second, two years ago we adopted a ratchet clause: once a limit is set, it may be
  tightened but never loosened, so every concession is permanent and the sequence
  of small steps runs in one direction only. Third, a member has proposed that we
  set the limit at "the point of diminishing returns," but no one has been able to
  say what that is without circularity.


  Here is the pattern I cannot shake. Consider a sequence of candidate limits, each
  one step tighter than the last, with each step chosen small enough that no member
  of the committee is willing to say the tighter limit is worse. Nearly everyone grants
  that each step, taken alone, is at least an improvement or at worst a wash. But
  almost no one is prepared to say that the tightest limit in the sequence is better
  than the loosest; the cost would be enormous and the health gain negligible. The
  first camp says this shows we must go all the way. The second says it shows the
  small steps were never improvements.


  Please draft the committee''s written opinion. It should reach an actionable bottom
  line — a specific limit, or, if the honest conclusion is that the number cannot
  be read off the philosophy, a clear statement of what the number should be fixed
  by and what the philosophy does constrain — and it should give reasons both camps
  can engage with rather than dismissing either. It must address, in terms we can
  actually vote on: whether "better than" is transitive, that is, whether a chain
  of pairwise improvements must add up to an overall improvement; whether our instruction
  to adopt the best option is satisfiable at all if it is not; what precisely goes
  wrong in the sequence above — a false premise at some step, a failure of transitivity,
  or a mistake in how we are comparing options; and whether the right response is
  to accept the uncomfortable conclusion, to deny transitivity, or to decline to compare
  options that differ by imperceptible degrees. Please also say how the ratchet clause
  changes the answer, if it does, and give the strongest version of whichever position
  you end up rejecting. I would rather have a memo that marks plainly which steps
  are logic and which are value judgment than one that pretends the number follows
  from the premises.


