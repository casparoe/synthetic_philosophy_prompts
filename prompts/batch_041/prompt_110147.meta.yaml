  Draft:


  "I am a software engineer with no formal training in philosophy, and I have been
  reading around the idea of Ubuntu and relational personhood in African philosophy.
  I keep running into two readings of the idea that a person is a person through other
  persons, and I would like a careful comparison of them.


  The first reading, as I understand it, is radical: personhood is not something every
  human being has by virtue of being human, but a status one acquires by participating
  in communal life — one is born a human being and becomes a person, and some people
  never fully succeed in this. The second reading is more moderate: personhood is
  intrinsic to every human being from the outset, and communal relations are what
  develop and realise it rather than what confer it.


  I would like you to compare these two positions on the following points. First,
  what exactly is the disagreement about — is it a disagreement about the metaphysics
  of personhood, about the conditions for full moral standing, or merely about which
  of two senses of ''person'' should be given priority? Second, does either position
  allow that personhood comes in degrees or can be lost, and does either of them need
  that? Third, which of the two does better with the case of a human being who cannot
  participate in communal life — say someone with a profound cognitive disability
  from birth, or someone raised in complete isolation — and what does the losing position
  have to say for itself?


  I am especially interested in a problem that I suspect only one of the two can answer:
  if personhood is conferred by the community, can the community be wrong about who
  is a person? Take a community that treats a whole group of its members as non-persons;
  I want to know whether the radical reading can call this a mistake, or whether it
  has to treat the community''s verdict as authoritative, and what resources it has
  that the moderate reading lacks (or vice versa).


  Finally, tell me plainly whether these are two versions of one view or two different
  views, and whether the Ubuntu conception of personhood is best understood as a rival
  to the Western idea that human beings have an intrinsic and inalienable moral status,
  or as an answer to a different question altogether.


  Please write your answer in British English, and assume I have no philosophical
  training — spell out any technical terms you use."


