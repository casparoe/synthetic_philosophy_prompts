  identification under inaccessible information. Not a lecture: they should run into
  it. Here''s the setup I have in mind, but you should flesh it out into a runnable
  game with rules, materials, roles, a timeline, and a debrief. The game is a black-box
  reverse-engineering competition. There are three sealed boxes, each with a hidden
  internal ontology: maybe it contains a set of simple entities with states and transition
  rules, and it only outputs a coarse signal when you press one of a few buttons.
  The teams can query the boxes as much as they want, but they can never open them.
  They have to submit a one-page ontology report: how many kinds of entities are inside,
  what their states are, and what causal relations hold. The catch: I want at least
  two boxes to be behaviorally indistinguishable under every possible query the teams
  can make, but to have different ontologies. One box might be, say, three coupled
  oscillators; another might be a single field with a memory. The teams won''t know
  which is which, and they''ll have to decide whether to say the ontology is underdetermined
  or to pick one on some other ground like simplicity. The point they should come
  away with is that accessible information plus a theory of what counts as a good
  explanation still doesn''t uniquely identify the ontology; the identification is
  an extra posit, not a readout. I want the activity to be playable with paper, dice,
  or a simple script, no special equipment, and no real money. Include roles: maybe
