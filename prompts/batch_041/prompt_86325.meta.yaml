  The menu of readings of "that''s a genetic fallacy":

  1. Weak/trivial: from "the author held repugnant political views" you cannot validly
  infer "his logical doctrines are false." (Trivially true, and no one denies it;
  it''s also not what the objector claims.)

  2. Context of discovery vs justification: facts about how a belief was arrived at
  are irrelevant to its epistemic status. (Contentious; fails for e.g. testimony,
  unreliable belief-formation, cases where genesis is evidence of content.)

  3. Norm of assessment: a view''s merits are independent of the merits of its proponents;
  evaluating theories should proceed "internally." (A methodological norm, defensible
  but not absolute.)

  4. Empirical/interpretive claim: biographical and political facts cannot illuminate
  the content or commitments of the doctrine. (False; they can, and historians of
  philosophy routinely use them.)

  5. Claim about what the "real" philosophical content is: the political views are
  external to the philosophy, i.e., a sharp separation between the logical works and
  the political diary. (Substantive and contestable — is Frege''s philosophy one system
  in which his views about objectivity, universality, "laws of truth," and his anti-psychologism
  relate to his politics?)

  6. A claim about bearing: even if there''s a connection, it doesn''t undermine the
  technical results (e.g., Frege''s theorem, the Begriffsschrift) — mathematical/logical
  results are proof-checkable. (True for the technical results but doesn''t address
  the philosophical doctrines.)

  7. An ethical/pragmatic claim: we should keep the philosophy and the politics apart
  in teaching, canon, etc. (That''s a normative claim about the discipline, not a
  fallacy claim at all — a category slip.)


  And which readings would actually do the work the person wanted: dismissing the
  question of whether the diary bears on his philosophy requires reading 4 or 5; reading
  1 is true but irrelevant (it''s a strawman of the objection). So the person probably
  equivocates between the trivial reading 1 and the strong reading 4/5.


