  The pattern is this. Somebody wants to restrict a category of speech. The person
  defending the speech says: OK, the harm principle lets you restrict speech that
  harms people, so show me the harm. And then it turns out that no single instance
  of the speech does any harm you can point to. One guy yelling a slur at an empty
  street hurts nobody. But ten thousand people doing it, all at once, every day, obviously
  does something real and bad to the group on the receiving end. So now the restriction
  looks like it''s either unjustified (because there''s no harm coming from any particular
  speaker) or justified by something that isn''t a harm at all (a sum, a vibe, a statistical
  trend).


