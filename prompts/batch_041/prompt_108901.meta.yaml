  is better explained as the ill-posedness of the interpretation problem than as a
  distinctive feature of meaning; that charity operates as a regularizer, selecting
  among the many hypotheses that fit the evidence; and that once we ask the question
  a scientist would ask — which features of an interpretation are stably determined
  by the evidence, and which are fixed only by the regularizer? — the indeterminacy
  shrinks to something continuous with ordinary underdetermination in the empirical
  sciences, carrying no special consequences for the metaphysics of meaning.


