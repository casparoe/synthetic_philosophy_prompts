  Concrete design:

  Phase 1 — Front desk: The room: a wall with a long paper strip labeled 1,2,3,...
  (say 40 visible, with an arrow "→" indicating continuation). Guests: every participant
  gets a card with a natural number on it (e.g., 7, 12, 1, ...). They must find their
  room. Initially each guest i is in room i. The hotel is "full" (every numbered room
  has a guest card taped to it). Then new arrivals come: 1 new guest, then 5, then
  countably infinitely many (a busload: guests numbered by the naturals). The clerks
  must reassign. Rules: a legal reassignment must (a) give every current guest a room,
  (b) give every new guest a room, (c) leave no room empty. Each student writes a
  rule (function) on a card and posts it. Then the group checks the rules against
  each other.


  The "feel the force" bit: the first intuitive reaction is "impossible — full means
  full". The activity is designed so that the impossibility intuition collides with
  the fact that students themselves produce the shift rule. Then the twist: the inspector
