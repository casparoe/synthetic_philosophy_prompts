  Candidate requirements for a theory of epistemic warrant that must handle bootstrapping:

  1. No easy knowledge / no bootstrapping: the theory must not count Roxanne-type
  reasoning (using the belief that p to support the reliability of the source of the
  belief that p) as yielding justified belief/knowledge.

  2. Closure: justification/knowledge is closed under known entailment (needed to
  explain lots of ordinary knowledge, e.g., I know I have hands, therefore I know
  I''m not a brain in a vat). But bootstrapping exploits closure. So (1) and (2) tension.

  3. Anti-skepticism / non-circularity constraint: the theory must not make all knowledge
  depend on prior knowledge of reliability (which would be circular) — i.e., it must
  allow basic perceptual knowledge without antecedent justification for the reliability
  of perception. But (1) seems to require exactly that antecedent justification. Tension:
  (1) vs (3) — the "easy knowledge" dilemma (Cohen): either we have easy knowledge
  or we have skepticism. This is the classic dilemma! Good.

  4. The theory must distinguish legitimate self-trust (e.g., using reason to check
  reason, memory to check memory) from vicious circularity — "epistemic circularity
  is sometimes OK" (Alston).

  5. Must not be ad hoc: the principle doing the work must be independently motivated
  and not tailored to the cases.

  6. Must handle the "one-step" cases: it''s fine to conclude the gauge is reliable
  after independently checking, so the theory can''t ban all reasoning from belief
  to reliability of source; it must locate the defect precisely.

  7. Must respect the difference between "having warrant" and "being able to defend
  it dialectically" (internalism vs externalism).

  8. Must be consistent with a naturalistic/psychological account of how we actually
  form beliefs.


  The knockout: the pair (no-easy-knowledge + closure) is jointly hard; and (no-easy-knowledge
