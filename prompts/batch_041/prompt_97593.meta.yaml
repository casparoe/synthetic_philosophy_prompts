  the rationality of irrationality, the reciprocal fear of surprise attack, the stability-instability
  paradox — are artifacts of modeling the adversary as a unitary rational actor with
  common priors. Once you model the adversary as a Bayesian updater with private information
  and non-stationary beliefs, she thinks brinkmanship stops looking like a clever
  move and starts looking like a coordination failure. She also thinks the same logic
  applies to cyber and AI escalation, which is where I want to push her.


