  Draft:


  "I run a causal inference reading group that has drifted into philosophy of science
  territory, and next month I have seventy-five minutes and a whiteboard to get twelve
  people to the point where they can say precisely what the interventionist account
  of causation adds to the counterfactual-dependence account, and why the two are
  not notational variants of one another. The audience is split and I want the session
  to exploit the split rather than paper over it: six are epidemiology and biostatistics
  doctoral students who think of causation as what a randomised trial (or an imagined
  target trial) estimates, and two or three are philosophers of science who have the
  counterfactual-dependence tradition at their fingertips and will be quietly convinced
  from the first minute that interventionism is that tradition with the notation changed.
  Plan the explanation rather than giving it to me.


  Two things need to be decided early, because everything else depends on them. First,
  the definition of an intervention — the conditions that make a variable an intervention
  variable on X with respect to Y, and in particular the clauses that exclude its
  being caused by Y and being connected to Y by routes that bypass X. I want to know
  which clause carries which pedagogical weight, which one they will silently drop
  when they try to apply the definition, and whether the circularity objection (''an
  intervention is just a cause, so the account is circular'') should be met before
  the definition is on the board, immediately after it, or deliberately left to fester
  for twenty minutes. My instinct is to let it fester, but I want your view.


  Second, the carrying example. My candidate is not the usual one. I want to build
  the session on a case where what is ''intervened on'' is the definition or the measurement
  of a variable rather than any process in the world: an administrative body changes
  the threshold at which a condition is diagnosed and recorded, so that a variable
  that appeared in all our datasets as a biological state now takes a different value
  for the same people, with no change in anyone''s body. In my own work this is the
  case that makes me uneasy, because the epidemiologists will say that this is exactly
  what an intervention is (it is a policy, it is something you could randomise), while
  the philosophers will say it cannot be an intervention at all if the account is
  about what makes a difference in the world. Tell me whether this example can carry
  the whole session or whether it is too clever by half; if it cannot, tell me what
  the replacement must have and must lack — I would rather not fall back on late pre-emption
  or the back-up assassin, and I want to know whether that reluctance is well founded
  or just cowardice about the details.


  Beyond those two decisions I need: the order in which the components must come,
  with the dependency made explicit — what has to be in place before ''the account
  is circular'' can even be posed as a sharp question, and what has to be in place
  before the audience can see that interventionist causation admits of degrees (a
  relationship can be more or less invariant, holding up under a wider or narrower
  range of interventions) where the counterfactual-dependence account is all or nothing;
  the misconceptions you expect, in the order they will actually surface, and the
  exact point in the sequence where each should be headed off, distinguishing the
  ones that come from the statisticians'' background (an intervention is a treatment
  assignment; an intervention must be something someone could actually do; a failed
  intervention is a confounded study) from the ones that come from the philosophers''
  background (this is counterfactual dependence in different clothes; an intervention
  is just a possible world with a name; the account is anthropocentric because it
  starts from what we could do); the single question I should ask at the end that
  would show whether they have got the distinction rather than merely followed it,
  with an indication of what a wrong answer would look like; and what I should openly
  refuse to cover in seventy-five minutes, saying so out loud, rather than letting
  them leave with a half-understood gesture at structural equations or at actual causation
  for cases of pre-emption and overdetermination.


  I do not want a literature tour or a reading list: they should leave with one distinction
  they can state, defend and apply."


