  Possible prompt:


  "I have been reading rationalist blogs and forums for a long time, and I keep noticing
  a pattern in institutions that I do not have a good name for. Here are two instances.
  A hospital introduces a numerical ''recovery velocity'' score to track patients
  after surgery. At first the score is just a summary of clinical observations. But
  within a year, patients have learned the score, and they begin to describe their
  own recovery in its terms—''I''m a slow healer,'' ''I''m ahead of schedule''—and
  nurses start treating the score as the thing itself. The score''s predictions get
  better, but not because the underlying physiology has changed; it gets better because
  the score has become part of what it is measuring. The second instance: a school
  district adopts a ''grit'' rubric. Teachers begin to see students through it, students
  begin to see themselves through it, and soon the rubric predicts outcomes better
  than the original psychological research did. Again, the prediction improves because
  the category has been installed in the people it classifies. What I want to know
  is whether there is an established name for this specific loop. It is not just Goodhart''s
  law, because the metric is not being gamed in the usual sense—the people are not
  pretending to be gritty; they are becoming gritty in the rubric''s image. It is
  not just Campbell''s law, because the corruption is not the point. It is not just
  reactivity, because reactivity usually means the measurement changes behavior; here
  the measurement changes the ontology of the behavior, or at least changes what the
