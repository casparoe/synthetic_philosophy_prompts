  Fitch''s paradox: "If all truths are knowable, then all truths are known." Derivation:
  assume (K) ∀p(p → ◇Kp). Let p be a truth never known: p ∧ ¬Kp. By (K), ◇K(p ∧ ¬Kp).
  Knowledge distributes over conjunction: K(p ∧ ¬Kp) → (Kp ∧ K¬Kp); and K¬Kp → ¬Kp
  (factivity). So K(p ∧ ¬Kp) → (Kp ∧ ¬Kp), contradiction. So K(p ∧ ¬Kp) is impossible,
  so ¬◇K(p ∧ ¬Kp), so by (K), ¬(p ∧ ¬Kp), so ¬p ∨ Kp; with p true, Kp. So all truths
  are known. This is valid in intuitionistic logic (the derivation is intuitionistically
  acceptable; indeed the proof is often noted to be intuitionistically valid, so one
  can''t blame classical logic).


  Note: Fitch''s proof appeared in 1963 (JSL, "A logical analysis of some value concepts"),
  and the result is credited to Fitch and, in the referee report, Alonzo Church (Church''s
  version had "known by someone at some time" and used the fact that knowledge implies
  truth). I won''t name these.


