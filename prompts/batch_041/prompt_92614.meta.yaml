  Final-ish draft (units of selection):


  "A colleague of mine has been arguing that the units-of-selection debate is a pseudo-problem,
  and I want to know whether her argument survives scrutiny.


  She puts it this way. The standard way of writing evolutionary change — the change
  in the population mean of some trait, expressed as a within-group component that
  tracks the covariance between individual traits and individual fitnesses, plus a
  between-group component that tracks the covariance between group traits and group
  fitnesses — is, she says, an algebraic identity rather than an empirical claim:
  it holds for any population, for any trait, and for any way of assigning fitnesses
  to individuals and to groups. She then appeals to what she calls a translation principle:
  if two descriptions of the same process are formally inter-translatable in this
  way, then they are empirically equivalent descriptions, and neither can be more
  correct than the other. Applying the principle, she concludes that every case of
  apparent group selection can be re-described as selection on individuals or genes,
  and conversely; that the level of selection is therefore a matter of bookkeeping
  convention rather than fact; and that the long-running dispute among genic, individualist,
  and group-selectionist accounts is verbal. She adds that the same equivalence holds
  between the relatedness-based condition for the evolution of altruism and the multilevel
  condition, so altruism cannot be evidence for one level rather than another.


  My questions are these. Is she right that the decomposition is an identity that
  constrains nothing? If she is, does the translation principle do the work she needs?
  And if the principle is false, what exactly is the empirical content that survives
  the algebra — that is, what could two parties who accept the identity still disagree
  about, and what would settle it?"


