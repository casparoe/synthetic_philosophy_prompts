  - Grant the algebra: the Price-style decomposition is an identity given a trait,
  a fitness assignment, and a partition.

  - Deny the translation principle: formal inter-translatability of descriptions does
  not imply empirical equivalence, because (a) the two descriptions may disagree about
  which quantities are causally primitive, (b) they may make different predictions
  once you consider counterfactuals or interventions, (c) the re-description may require
  quantities (e.g., group fitness) that are not independently measurable/well-defined,
  (d) "selection at a level" involves claims about heritability, adaptation, and response
  to selection that the identity doesn''t capture.

  - Note the averaging fallacy: naive group selectionism can arise from averaging
  individual fitnesses; and a nonzero between-group covariance term is not sufficient
