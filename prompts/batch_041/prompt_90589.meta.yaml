  Draft:


  "I cover cognitive science and philosophy of mind for [a general science-and-ideas
  magazine], and I''ve been asked to write a deadpan, reported trend piece on the
  booming business of certifying which minds and machines are genuinely about things
  and which merely behave as if they are. Write it.


  Background you can take as given (no need to research or cite anything): the philosophical
  dispute here runs between two positions. On one side, the claim that intentionality
  — the property of a state''s being about something, of representing it — comes in
  two kinds: the original kind, which belongs to a state in virtue of the biology
  that produces it, and the borrowed kind, which words, pictures, maps and computers
  have only because we, the original possessors, confer it on them. On the other side,
  the claim that this distinction does no explanatory work: our only handle on what
  a system believes or wants is the strategy of interpreting it as an agent, and where
  that strategy earns its keep, there is no further fact about whether the aboutness
  is owned or borrowed. The classic illustration on the second side is a vending-machine-style
  device built to recognise a particular coin; shipped somewhere that uses a slug
  of the same size, it accepts the slug, and nothing inside it settles whether it
  mistook the slug for the coin or merely behaved as if it had — which is also why
  nothing inside it settles whether it "wanted" the coin at all.


  The scene: a (fictional) certification body — call it the Bureau of Originary Intentionality,
  or invent your own — has turned the first position into an accreditation regime.
  Design the regime: what the classes of certificate are, what the application form
  asks for, what counts as proof, how long certification lasts, what happens on appeal.
  Give me the invented paper trail: the standard''s most telling clause, the tier
  that exists only because of lobbying, the deadline nobody can meet, the one case
  the Bureau cannot decide. The rule is that nothing in the regime may be invented
  absurdity: every bit of bureaucratic grotesquerie has to be a straight extrapolation
  of the doctrine that aboutness is either owned or borrowed, and of the practical
  problem that ownership cannot be observed from the outside — only provenance can.


  Things the piece must get right, without ever stopping to explain them: (i) the
  provenance rule — two physically identical devices, one certified, one not, on the
  strength of who made them and out of what; (ii) the conferral regress — if borrowed
  aboutness has to be conferred by an owner, and the owners are themselves products
  of a process that had no intentions, the certificate chain has to terminate somewhere,
  and the piece should let the reader notice where it terminates and dislike it; (iii)
  the reach of the scheme — the Bureau must have a position on dogs, insects, corporations
  and the Bureau itself, and its rulings there are the funniest and most damaging
  material you have; (iv) the fact that "original" is a label and not a mechanism,
  so no inspection, however fine-grained, could read it off a system; (v) that "borrowed"
  cannot be a demotion, because if it were, eyes and immune systems would be demoted
  too.


  Form and voice: headline plus standfirst plus roughly 800 words, in the deadpan
  register of a reported feature — a scene, a source, a document, a turn. Never wink;
  no sentence may acknowledge that the Bureau is funny. All the real objections must
  be spoken by your invented characters — an engineer on the standards committee,
  a lawyer for a denied applicant, a historian of the Bureau — and none of them may
  be the narrator''s own view; the narrator reports, and the reader assembles the
  reductio. Do not restage the well-worn thought experiments; the Bureau''s own case
  files are your examples. No citations, no reading list, no real names: the Bureau,
  its officers and its applicants are invented, and the piece should not attribute
  anything to living people. End on the case the Bureau cannot decide."


