  I have been having a running argument with a friend — she did a philosophy degree
  and now reads more Lewis and Hart than is good for her — about whether everyday
  conventions bind us morally, and we have gotten nowhere because we keep sliding
  between three different questions. I want to fix one of them and get a number. The
  case: I am a tourist on a ten-day trip to a country where restaurant tipping at
  roughly twenty percent is the norm, where servers are paid on the assumption that
  tips will come, and where a table that leaves nothing is understood by the staff
  and by other diners as either ignorant or contemptuous. I know all of this, I can
  easily afford the tip, and I will never return. My claim is that I have a reason
  of prudence and perhaps of politeness to tip, but no genuine moral obligation to
  do so; my credence that I am right is about 0.65, and hers that I am wrong is about
  0.85. Give me your own credence that a short-term visitor who knows the local norm,
  can afford to comply, and does not intend to return nonetheless has a genuine moral
  obligation — not merely a reason of prudence, taste, or courtesy — to follow it.


  Then decompose it. I would like the decomposition to at least separate: whether
  conventionality as such can generate obligations at all, and if so whether they
  are owed to particular people (the server, the other diners, the locals generally)
  or only to the practice; whether the grounding is reliance, fairness, gratitude
  for a service performed under bad terms, or the wrongfulness of free-riding on a
  scheme one benefits from; and whether the visitor''s outsider status cuts in favour
  of compliance (she is a guest, she benefits from local institutions) or against
  it (she never opted in, the norm is not hers to be bound by, and the burden falls
  on her rather than on the employer who set the wages). Assign a rough probability
  to each term and show how they combine, and say plainly which term your final number
  is most sensitive to.


  One further thing I would like you to price. I have been toying with a taxonomy
  of everyday conventions by their function: some coordinate (which side of the escalator
  to stand on, the queue), some redistribute (tipping, which shifts a wage bill from
  employer to customer), some merely signal (not jaywalking on an empty street at
  3 a.m., where the only cost of crossing is the visible flouting of a rule). My hunch
  is that coordination conventions generate obligations more robustly than redistributive
  ones, because in the coordinating case non-compliance actually defeats the point
  for everyone, whereas in the redistributive case it merely declines to participate
  in someone else''s arrangement. Give me a credence for that hunch too, decomposed
  in the same way, and tell me whether the same reasoning that settles the tipping
  case also settles the empty-street jaywalking case or whether the two come apart
  — if they come apart, I want to know which of the two you take to be the more revealing
  case, and what you would need to learn to move your number by more than 0.1. If
  you think my proposition is not truth-apt as stated, or is really several questions
  wearing one coat, say which precisification you are answering rather than declining
  to answer.


