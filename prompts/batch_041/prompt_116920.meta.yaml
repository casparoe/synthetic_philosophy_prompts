  \ So isn't 'evidential cooperation' just smuggling in backwards causation?\" \n\n\
  The confusion: conflating \"my choice is evidence of their choice\" with \"my choice\
  \ causes their choice\" or thinking evidence requires temporal ordering / that the\
  \ correlation must be causal. Actually a good answer: evidential correlation can\
