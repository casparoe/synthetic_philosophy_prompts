  Draft:


  "I spent thirty-five years as a bench scientist before I retired, and the habit
  I cannot shake is that of asking what the control is. I have lately been reading
  Weber on the Protestant ethic, and I keep coming back to a dissatisfaction I cannot
  articulate: he seems to want to say that a set of religious convictions caused a
  form of economic conduct, but the case as he presents it is historical and comparative
  rather than controlled, and I can never tell what would have had to be otherwise
  for him to be wrong. What I would like from you is a thought experiment built to
  order — not an illustration of Weber''s thesis, which I can find in any textbook,
  but a designed case that isolates a value-commitment as an autonomous cause of economic
  behaviour. The specifications are as follows. (1) It must be a realistic case: an
  actual-looking historical episode, or a contemporary community, not an imaginary
  island with the conclusion stipulated. (2) The case must be a controlled contrast
  — two populations alike in geography, technology, market access, legal institutions
  and prior wealth, differing only in doctrine; or one population before and after
  a doctrinal change. (3) The doctrine must not be the creature of the economic conditions
  it is meant to explain: either it must arrive from outside for reasons internal
  to theology, or you must show why the reverse causal arrow cannot run. (4) The mechanism
  must be the one Weber himself posits rather than a generic appeal to ''Protestant
  thrift'' — the doctrine must generate in the believer a specific pressure (a duty,
  an anxiety, a demand for assurance) that expresses itself as methodical, self-monitoring
  labour and as a prohibition on enjoying the proceeds, so that the surplus has nowhere
  to go but back into the enterprise. (5) Crucially, the doctrine''s content must
  be doing the work, not the incidental correlates of the doctrine — not literacy,
  not minority status, not the mere fact of belonging to a sect. And (6) the case
  has to be one in which the two readings of Weber come apart: the strong reading,
  on which the ethic is a cause, and the weak reading, on which there is only what
  he called an elective affinity, a mutual selection of ideas and interests without
  any causal priority. Build the case so that the weak reading cannot account for
  the outcome; that, to my mind, is what the experiment is for. I should say plainly
  what I would regard as cheating: any version in which the agents are stipulated
  to behave as the thesis requires, rather than behaving as the doctrine would lead
  them to reason."


