  Bradley''s regress: if a proposition is composed of constituents unified by a relation,
  then to unify the constituents with the relation you need another relation, etc.
  Responses: (i) deny that propositions have constituents/relations — e.g., the "tie"
  or "nexus" view (a primitive unity, e.g., Frege''s unsaturated concepts; Russell''s
  1903 "ineffable" position where the relation as it occurs in the proposition does
  the unifying and can''t be further analyzed); (ii) the "multiple relation" theory
  of judgment (Russell 1910) — judgment is a multiple relation among objects, no proposition
  needed; (iii) tropes/state-of-affairs theories; (iv) "the unity of the proposition
  is primitive" (e.g., Gaskin''s view); (v) non-relational composition, e.g., Fine''s
  "unity and identity" / essentialist account; (vi) truthmaker approaches; (vii) the
  "formal unity" view (Wittgenstein: the proposition is a fact, unity is that of a
  fact, not a further relation).


