  Draft argument (numbered):


  1. To allocate resources rationally you have to compare the relative importance
  of different uses of them, and that means you need a common unit — a price — that
  expresses opportunity cost.

  2. Prices express opportunity costs only when they are formed in exchange between
  people who own what they''re trading, so that what each gives up is real to them.

  3. Under socialism the means of production are owned in common, so capital goods
  are never exchanged between owners.

  4. So under socialism there are no prices for capital goods.

  5. So there''s no common unit for comparing the importance of, say, building a railway
  vs a steel mill, and no way for planners to know whether they''re using resources
  better or worse than an alternative arrangement.

  6. Someone says: fine, the planning board just announces prices, and adjusts them
  up when there''s a shortage and down when there''s a surplus, like an auctioneer
  calling out prices until demand matches supply. But that only works if the board
  can tell a shortage from a well-supplied market, and if it already knows what the
  right set of goods is. The real problem isn''t solving a set of equations — it''s
  that the knowledge needed (what people want, what''s technically possible, what''s
  scarce where and when) never exists in one place and can''t be gathered. It''s dispersed,
  tacit, and mostly only revealed by people acting on it.

  7. So no procedure — not even an all-knowing computer — could do the job, because
  the problem isn''t computational power, it''s that the information isn''t available
  to anyone.

  8. Therefore socialist planning is impossible in principle, not just in practice.


  Then the "proves too much": (7) proves too much because the market doesn''t gather
  that knowledge either. Nobody in a market knows the total either; that''s the whole
  point of the price system — it lets people act on information they don''t possess.
  So if "the knowledge isn''t available to anyone" were enough to rule out a procedure''s
  using it, it would rule out the market too. But the market does use it. So either
  (7) is false as stated, or it says nothing against planning, since the same could
  be said of any working system. Where does it go wrong, and what do I have to give
  up?


