  \ to help grade for a philosophy of economics course, or teaches a continuing-ed\
  \ / honours seminar. That works.\n\nLet me think about which domain to choose. The\
  \ no-trade theorems domain is quite in-the-weeds and meaningful for a model without\
  \ search. The subtle mistakes in a student's answer:\n\nStudent answer: \"Aumann's\
  \ agreement theorem shows that two rational agents with common priors cannot agree\
  \ to disagree, and therefore no trade can occur between them; Milgrom and Stokey\
  \ generalized this into the no-trade theorem, which shows that in a competitive\
  \ market, if all traders start at a Pareto-efficient allocation, no trade occurs.\
  \ Hence markets can only trade when there is asymmetric information, and the theorem\
  \ proves that speculative trade is impossible. This means prices must be efficient...\"\
  \ etc.\n\nSubtle mistakes:\n1. Conflating Aumann's agreement theorem (which is about\
  \ posterior probabilities after pooling/communication — actually the theorem is\
  \ about agents who have common knowledge of each other's posterior beliefs; it's\
  \ not directly about trade) with the no-trade theorem. Actually the standard account:\
  \ Milgrom-Stokey no-trade theorem says that if the initial allocation is Pareto\
  \ efficient and there's common knowledge of the rationality of the agents and common\
  \ priors, then no trade can occur even with asymmetric information — i.e., asymmetric\
  \ information alone doesn't generate trade. The student's claim \"markets can only\
  \ trade when there is asymmetric information\" reverses it: the theorem says asymmetric\
  \ information alone doesn't produce trade.\n\n2. The role of \"common priors\" vs\
  \ \"common knowledge of rationality\" — the student might say the no-trade theorem\
  \ requires only common knowledge of rationality, and that relaxing common priors\
  \ is what permits trade. Actually relaxing common priors does permit trade (Harrison-Kreps,\
  \ and later work). Hmm, but the key subtlety: the theorem's conclusion is that trade\
  \ cannot occur *unless* traders have some other motive (hedging, liquidity, risk-sharing,\
  \ heterogeneous priors). A subtle error: saying the theorem shows markets cannot\
  \ reallocate risk — but risk-sharing is a non-informational motive that does generate\
  \ trade (the theorem's premise is that the initial allocation is Pareto efficient,\
  \ which rules out gains from risk-sharing).\n\n3. Another subtle mistake: attributing\
  \ the theorem to Milgrom & Stokey 1982 correctly, but saying the theorem says the\
  \ price \"fully reveals\" information (that's more the rational expectations equilibrium\
  \ / Grossman-Stiglitz stuff). Also the no-trade theorem doesn't say prices are correct.\n\
  \n4. Also could conflate \"no trade\" with \"no speculative trade\" — the theorem\
  \ concerns trade driven by differences in information alone.\n\nAlso there is the\
  \ subtle mistake about Aumann's theorem: Aumann's theorem requires common knowledge\
  \ of each other's posteriors and common prior; it says they can't *agree to disagree*,\
