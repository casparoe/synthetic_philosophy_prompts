  "Q3 (20 points). (a) State Kant''s first formulation of the categorical imperative
  and explain what a maxim is. (b) Kant distinguishes two ways in which a maxim can
  fail the test — describe both, and say which kind of duty each one corresponds to.
  (c) Apply the test to two of the examples from the Groundwork (you may pick any
  two) and show which kind of failure each involves. (d) State the second formulation
  and explain, in a sentence, what it adds that the first one doesn''t."


  Student answer (I write it): Something like:


  "(a) Kant''s first formulation says: act only on that maxim which you can at the
  same time will to be a universal law. A maxim is the principle you''re acting on
  — basically the thing you''re trying to do plus the reason you''re doing it. So
  the test is: take your maxim, imagine everyone acting on it, and see whether it
  can still be consistently thought and willed. If it can''t, the action is wrong.


  (b) There are two kinds of failure. The first is a contradiction in conception:
  when you universalize the maxim, the practice it depends on can''t even exist anymore,
  so the maxim destroys itself. That''s what gives us perfect duties, which are strict
  and can''t be overridden. The second is a contradiction in will: the maxim can be
  thought as a universal law, but you can''t coherently will it as one, because it
  would leave you without something you''d need. That gives imperfect duties, which
  are ones you have some latitude about when and how to fulfill.


  (c) Take the suicide example. Kant says the maxim would be something like ''I will
  end my life out of self-love when it promises more trouble than satisfaction.''
  You can imagine everyone doing that — the thought doesn''t contradict itself — but
  you couldn''t consistently will it as a universal law, since the whole point of
  self-love is to preserve life, so willing its destruction undercuts the very motive
  you''re acting from. So this one is a contradiction in will, and it''s a perfect
  duty not to kill yourself.


  The other example I''ll use is the false promise. The maxim is ''when I need money,
  I''ll borrow it and promise to repay it even though I know I can''t.'' Universalize
