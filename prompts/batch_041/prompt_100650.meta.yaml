  What do I know about Mill''s late views on socialism? Mill was a classical liberal
  but sympathetic to socialism. In Principles of Political Economy (1848), Book II,
  chapter 1, he discussed communism and socialism, and in Book IV, chapter 7 ("On
  the Probable Futurity of the Labouring Classes") he discussed cooperatives and the
  idea that the labouring classes might gradually rise through cooperation, and he
  suggested that if the choice were between communism and the current state of society
  with its inequalities, communism might be preferable. But he criticized communism
  for its lack of liberty/individuality and for the way it would manage production.
  He argued the problem with communism is not so much economic feasibility but the
  stifling of individuality and the tyranny of public opinion. He preferred gradual
  reform, cooperative associations, profit-sharing.


  In his posthumous "Chapters on Socialism" (published 1879 in the Fortnightly Review,
  edited by Helen Taylor), Mill discusses socialism more sympathetically but raises
  objections: the difficulty of the socialist scheme''s economic viability, problems
  with the remuneration of labour, the objection from liberty, and the question of
  whether it could be introduced without a "despotism" or whether the transition would
  require too much state power. He also noted that socialism''s criticisms of the
  current distribution of property are largely valid, and he was open to the idea
  that the future might be socialist. He criticized the socialist position on the
  "right to the whole produce of labour" — he thought the doctrine was too simple,
  that the labourer''s claim to the full product of labour is not straightforward.


  Some common misrepresentations:

  1. Conflating Mill''s openness to socialism with an endorsement of socialism as
  a system — he thought it was a possible future, and that its criticisms of existing
  arrangements were largely valid, but he did not adopt socialism as a full doctrine;
  he remained committed to individual liberty, and his main hope was cooperation and
  gradual transformation.

  2. The "if forced to choose between communism and the current state of society,
  communism would be preferable" is often over-read as Mill being a socialist. Actually
  he says that if the choice were between communism and the present state with its
  inequalities and its labourers'' condition, communism might be the lesser evil —
  but he adds that he does not think the choice is forced; the present system can
  be reformed.

  3. Another misrepresentation: Mill''s objections to socialism are often reduced
  to "he worried about incentives," whereas his deeper objection was about the danger
  to individual liberty and the difficulty of the transition — the problem of how
  a socialist society would be brought about without a tyranny, and whether the state
  would have too much power.

