  Marx — exploitation and alienation — because both have become live again in arguments
  about platform work, care work, prison labour, and the automation of cognitive jobs,
  and yet the philosophical literature on them seems to me badly misaligned with what
  is actually contested in those arguments. My provisional list of the open questions
  is: (a) what makes exploitation wrong — whether the charge is fundamentally distributive
  (a maldistribution of the product) or relational (a wrong of subjection, of having
  one''s activity directed by another''s ends), and whether the labour theory of value
  has to be true for either charge to land; (b) whether exploitation and alienation
  come apart — whether there can be alienation without exploitation (the self-employed
  contractor, the unpaid carer, the graduate student who loves the work) or exploitation
  without alienation (the well-paid worker who is nonetheless a mere means); (c) whether
  alienation is a normative concept at all or rather a diagnostic one, a claim about
  a misfit between our powers and our activity that has to be cashed out psychologically,
  or socially, or metaphysically before it can do any critical work; (d) what counts
  as the right unit of analysis, since the phenomena seem to show up between classes,
  between firms, and inside a single person''s week; and (e) what the abolition of
  either condition would look like, given that Marx''s own picture of unalienated
  labour is notoriously thin and that a world without wage labour might still contain
