  Draft:


  "I am a senior in high school and I have been asked to open a meeting of our philosophy
  club with a reading of a film, and I have chosen Ratatouille. The theme I want to
  work with is aesthetic testimony: the question of whether a judgment about a work
  of art — or a dish — can be justified for me when I have only someone else''s word
  for it, and whether the film takes a side. Some philosophers hold that testimony
  can transmit knowledge of ordinary matters but not aesthetic ones, so that nothing
  anyone tells you about a thing can put you in the position of having appreciated
  it yourself; others hold that testimony can transmit aesthetic justification in
  much the way it transmits other kinds. I would like the film read against that disagreement
  rather than simply illustrated by it.


  Three things in the film seem to me to pull in different directions, and I would
  like you to say what to make of them. First, the critic Anton Ego is converted not
  by an argument or by anyone''s report but by a single dish, which carries him back
  to his childhood; if a film ever dramatised the claim that only first-hand acquaintance
  can justify an aesthetic judgment, this is the scene. Second, the film''s ending
  depends on a written review and on word of mouth, and on a bistro whose reputation
  draws a crowd — aesthetic belief spreading through precisely the channel the first
  scene seemed to discredit. Third, the kitchen''s motto that anyone can cook is put
  to work by the villain as a brand on frozen dinners, which strikes me as testimony
  that manufactures belief in people who will never taste the thing itself, and as
  the film''s most cynical image of what testimony about taste can do.


  What I would like from the reading is an argument about which of the two positions
  the film actually supports, and honesty about the scenes that resist it. I am especially
  interested in a question I have not seen the philosophical discussion address: the
  debate as I understand it is almost entirely about what one person says to another,
  but the film''s central act of transmission is a made thing — a dish, or a piece
  of cooking, handed over — and I cannot decide whether that counts as testimony at
  all or as a way of arranging acquaintance. If it is a second channel, does the film
  thereby identify something the usual framing of the debate misses, or does it just
  redescribe acquaintance? Relatedly, I want to know what to do with Gusteau, the
  dead chef whose voice Remy consults: testimony that has been internalised, or a
  figure for the authority of tradition, and either way whether it helps or undermines
  the reading.


  Please write this as a piece of criticism rather than a summary of the plot, and
  assume the reader knows the film. Do not quote the film — I have to present this
  aloud and I would rather paraphrase — and do not give me citations or further viewing.
  Close by saying what, if anything, the film shows about aesthetic deference that
  the philosophical arguments on their own do not."


