  Let me think about the actual philosophical content of HCH carefully.


  HCH (Christiano''s "Humans Consulting HCH"): Define HCH as follows. To answer a
  question Q, a human has some fixed time budget. HCH: the human can ask sub-questions
  to HCH (or to copies of themselves with the same total time). Actually the standard
  definition: "Given a question, the human may break it into sub-questions, each of
  which is answered by another human (or HCH), and then aggregate." The key: HCH is
  a fixed point. It''s meant to represent "what a human would answer given unlimited
  time and access to themselves."


  Factored cognition: the hypothesis that cognitively difficult tasks can be decomposed
  into many small, independently checkable subtasks, so that a system''s competence
  can scale without any single step exceeding human-level.


  The idealization-of-deliberation angle: HCH is supposed to capture "what you should
  believe if you thought about it for arbitrarily long." This is analogous to "idealized
  deliberation" in the epistemic sense.


  Genuine tensions:


  1. **Time-slice vs. whole-agent.** HCH gives each sub-human the same time budget
  as the parent (or a fraction). If sub-humans have the same time, there''s no resource
  limit and decomposition is trivial/unbounded — the idealization becomes "the human
  with unlimited time," which may be incoherent or may diverge (no guarantee of convergence).
  If sub-humans have less time, then the idealization is bounded and depends on the
  decomposition. The commitment "HCH is well-defined and captures ideal deliberation"
  vs. "sub-agents have strictly less time" tension: with less time you get a fixpoint
  only under additional assumptions; with equal time the recursion doesn''t buy you
  anything beyond "ask a human for a long time."


  2. **Normativity vs. actual-human-endorsement.** If HCH is normative (its answers
  are what you should believe), but HCH is defined by the actual human''s dispositions
  (including their biases, their tendency to defer to authority, their mistakes),
  then there''s a tension between "HCH is an idealization" and "HCH is grounded in
  actual human dispositions." If the human is a bad reasoner, HCH is a bad reasoner
  with more time. The "idealization" claim wants to abstract away from error; the
  "HCH" definition wants to keep the actual human.


  3. **Decomposition faithfulness / no lossy aggregation.** Factored cognition assumes
  decomposition is roughly lossless. But some tasks (holistic judgments, gestalt perception,
  aesthetic/ethical judgment) may not decompose. Commitment: "every question I care
  about factors" vs "there are irreducibly holistic questions." Actually this could
  be the tension.


  4. **Verification asymmetry.** For factored cognition to help, sub-answers must
  be checkable more cheaply than they''re produced. But the idealization of deliberation
  might require that the aggregation step itself be part of the deliberation — and
  if verification is as hard as solving, the decomposition gives no leverage. Tension:
  "decomposition gives leverage" vs. "no step is allowed to exceed the human''s ability"
  (each sub-step must be human-doable, including verification).


  5. **Consistency across sub-agents.** HCH sub-agents are copies of the same human,
  but they may give different answers (the human is not deterministic / depends on
  framing). The idealization needs a unique answer. Commitment: "HCH yields a determinate
  answer" vs. "the human is a nondeterministic function of the question."


