  Draft:


  I am preparing a short position statement for a graduate seminar on epistemic value,
  and I want a consistency audit before I circulate it. Here is the package I intend
  to defend:


  (1) Knowledge is more valuable than mere true belief, and this is not a marginal
  or accidental fact about knowledge; it is part of what knowledge is for.

  (2) The value of knowledge is instrumental: knowledge is valuable because it is
  a more reliable guide to action than true belief.

  (3) True belief is sufficient for successful action. Once a belief is true, adding
  justification, warrant, or a no-false-lemmas condition does not make the agent any
  more likely to succeed in what she does.

  (4) The value of knowledge over true belief is differential value: it is the value
  of the difference between the two, not the value of knowledge as a whole.

  (5) What explains differential value is stability: knowledge survives counterfactual
  challenge and revision better than mere true belief.

  (6) Knowledge requires a no-false-lemmas condition, so a belief that is true and
  reliably formed but rests on a false intermediate premise is not knowledge.

  (7) Epistemic value is monistic: all epistemic value derives from the value of true
  belief and the disvalue of false belief; there is no independent epistemic value
  in justification, coherence, or cognitive achievement.

  (8) Understanding is a species of knowledge, and it is more valuable than knowledge
  because it is more explanatory.

  (9) Knowledge is the norm of practical reasoning: it is appropriate to act on what
  one knows, and inappropriate to act on what one merely believes truly.


