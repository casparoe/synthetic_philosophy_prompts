  Let me flesh out the exchange carefully.


  Move 1 (A, the critic): Hume''s essay begins from the premise that beauty is not
  a property of objects but a sentiment in the mind. That''s the "no objective beauty"
  premise. Then he asks for a standard of taste, and he finds it in the joint verdict
  of true judges. But the true judges are identified by the five qualities. Those
  qualities, however, are not independently specifiable: we know someone has delicacy
  of taste because their judgments track the beautiful, and we know what''s beautiful
  because the true judges say so. The whole thing is circular.


  Move 2 (B, defender): The circle is not vicious. Hume''s account is naturalistic.
  Delicacy of taste is a perceptual capacity, like a refined palate; it can be identified
  by its effects — the person detects the leather and the iron in the wine that others
  miss, and the cask later confirms it. Practice and comparison are empirical procedures.
  The true judge is an idealized observer, and idealized observers are legitimate
  in any empirical theory of judgment: we define normal color vision by the verdicts
  of observers with healthy eyes, not by an independent realm of colors.


  Move 3 (A): The color analogy fails because in the color case we have independent
  access to the physical facts — wavelengths, photoreceptors — that explain why normal
  observers converge. In taste we have no independent access to beauty. The wine example
  actually proves my point: the confirmation comes from the cask containing a key
  with a leather thong — a non-aesthetic fact. But that only shows the tasters'' palates
  were discriminating, not that their judgment of the wine''s beauty was correct.
  Delicacy of palate is a capacity to detect, but what it detects in the aesthetic
  case is a sentiment, and a sentiment is not a fact to be detected.


  Move 4 (B): That conflates two questions. Hume can say: beauty is not a property
  of objects; it is a sentiment. But the standard of taste is a standard for the correctness
  of judgments, not a standard for the existence of a property. A judgment of taste
  is correct when it is the verdict of a spectator who has practiced, compared, shed
  prejudice, and has good sense. This is a normative standard, not a metaphysical
  one. And it is not circular because the five qualities are independently describable
  — we can describe what it is to have practiced, to compare, to be free of prejudice,
  without already knowing the verdicts. The standard is the verdict of the suitably
  prepared observer, and the preparation is specified independently of the verdict.


  Move 5 (A): But the fifth condition, good sense, is the problem. Good sense is not
  an aesthetic capacity; it is a capacity for reasoning. Hume says the true judge
  must have good sense to correct the distortions of prejudice and to see the relations
  of parts to wholes. If the standard of taste depends on good sense, then it depends
  on a standard of reasoning, and that standard is not itself a matter of sentiment.
  So Hume''s sentiment theory is either incomplete or inconsistent: the aesthetic
  standard is ultimately an epistemic standard. And if you say good sense is just
  another sentiment, you lose the normativity.


  Move 6 (B): Hume can accept that the standard of taste is not purely aesthetic.
  His project is naturalistic: taste is a sentiment, but the correction of sentiment
  requires reasoning about the object — about its structure, its genre, its historical
  context, its intended effects. That is why he says the true judge must have good
  sense. This is not an inconsistency; it is the recognition that aesthetic judgment
  is a hybrid of sentiment and cognition. The sentiment supplies the pleasure; the
  reasoning ensures the pleasure is caused by the right features of the object rather
  than by prejudice or accident. So the standard is the verdict of the observer whose
  sentiment is properly informed.


  Move 7 (A): Then the standard is not a standard of taste at all but a standard of
  informed sentiment, and the question is whether the informed sentiment converges.
  Hume admits it does not always converge. Where the true judges disagree, he says
  the standard is missing. That means the standard is not a standard; it is a regulative
  ideal that may never be realized. And if it is never realized, then the objectivity
