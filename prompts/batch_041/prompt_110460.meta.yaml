  Dennett''s naming: He introduces two "families of hypotheses" about "the timing
  of experience" — named after Orwell''s and Stalin''s styles of revisionism. From
  CE:


  - The "Stalinesque" hypothesis: the brain''s revision of the "content" happens *before*
  the content is presented to consciousness — like Stalin''s show trials, where the
  false story is constructed and then presented as the official reality. So consciousness
  never sees the unrevised version; the experience itself is of the "revised" content.
  So in the color phi case, the Stalinesque says the brain edits the information before
  the "moment of consciousness" — i.e., the experience of the moving, color-changing
  spot is constructed and then presented, with no delay in the timing of the experience
  itself (or, the experience occurs at the normal time but its content is the edited
  one).

  - The "Orwellian" hypothesis: the content is presented to consciousness, but afterwards
  the memory is rewritten — like Orwell''s Ministry of Truth, which alters historical
  records after the fact so no one can tell. So you *did* have an experience of a
  red spot, then the memory is revised so you *seem* to remember seeing the color
  change mid-flight. The revision happens after the fact, on the memory/record.


  Dennett''s point: For the color phi case, the two hypotheses are empirically indistinguishable
  in principle — you cannot tell whether the experience was revised before or after
  the "moment of consciousness" — because any evidence (including about timing) would
  itself be subject to the same revision. So the question "when did the experience
  happen?" has no answer; it presupposes a Cartesian Theater where there''s a definite
  moment of consciousness. This is Dennett''s critique of "the timing of consciousness"
  as a well-posed empirical question.


