  Draft answer:


  "Pascal''s discussion of justice and force begins from the observation that each
  is defective on its own. Justice without force is impotent, since the wicked are
  always with us and will not be persuaded by the mere rightness of a cause; force
  without justice is tyrannical, since it imposes on others without any title to do
  so. The remedy is to join the two, and Pascal''s striking claim is that this joining
  has, in practice, gone in only one direction: unable to make justice strong, we
  have made strength just. His argument for this is that justice is endlessly disputed
  while force is not. Everyone can see where the power lies, but no one can agree
  on what is owed to whom; consequently the title of justice gets attached to whatever
  arrangement the powerful have already established. In this way the laws and customs
  that pass for justice are really the decrees of force, and Pascal thinks this is
  simply the truth about political life.


  It is tempting to read Pascal as a forerunner of Hobbes, and I think that is basically
  right: both see political order as resting on a convention backed by power, and
  both think that in the absence of such power there is no effective justice at all.
  Where Pascal differs is in drawing a religious moral from this. Since human justice
  is a mask for force, it cannot be the ultimate standard; the true justice is God''s,
  and the Christian is meant to see in the corruption of earthly justice a sign of
  the fall and a reason to seek the kingdom that is not of this world.


  It is important not to make Pascal a cynic, however. He does not say that justice
  is simply a word for whatever the powerful want. He holds that there is a real justice,
  which we cannot fully know, and that the orders of body, mind, and charity are distinct,
  so that the political order has its own logic that the Christian should not confuse
  with the order of charity. His point is not that might makes right in any moral
  sense, but that in the absence of a power to enforce it, right has no purchase on
  human affairs."


