  Absent-minded driver (Piccione & Rubinstein 1997): an agent driving home, at an
  exit; if he exits at the first exit, he''s worse off than continuing to the second;
  but at each intersection he can''t tell whether he''s at the first or second. The
  "absent-minded driver''s paradox": the optimal policy seems to be to randomize and
  sometimes exit at the first intersection, and the paradox is that the driver, upon
  being at an intersection, knows he''s at one of them and can compute... The paradox:
  the driver''s ex ante optimal strategy (exit with probability p at each) is not
  dynamically consistent — when he actually arrives at an intersection, exiting gives
  a known payoff while continuing gives a gamble, and if he re-optimizes at the node
  he''d... Actually the standard framing: the driver maximizes expected payoff from
  the ex ante perspective, choosing a strategy that''s a function of the information
  set; at the information set, the "plan" may not be optimal in the sense that if
  he could distinguish, he''d behave differently. The paradox is that the optimal
  ex ante strategy requires "committing" to a randomization that he would not follow
  if he could tell where he was — and it violates the "one-shot deviation" / dynamic
  consistency principle. Also relates to the "sunk cost" and "irrevocable" issues,
  and to Kuhn''s theorem (perfect recall needed for equivalence of behavioral and
  mixed strategies, and for sequential rationality).


