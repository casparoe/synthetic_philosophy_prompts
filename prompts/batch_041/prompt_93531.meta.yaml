  Let me design so the wireheading question is sharp:


  The trial''s primary endpoint is patient-reported pain and "pain-related interference
  with life" at 12 weeks. The interim data show a large improvement in the self-report
  measures. But the site coordinators report something odd: patients in the treatment
  arm have stopped doing things — several dropped out of work, stopped physical therapy,
  some stopped leaving the house; their spouses say they "seem content" but "not themselves."
  Two patients asked to increase their dose because "it makes everything not matter."
  The drug is hypothesized to work by reducing the salience/aversiveness of the pain
  signal, and one of the investigators has written that this is "the point — pain
  is a signal, and we''re turning down the volume on the alarm."


  So the board must decide: continue as planned (the endpoint is validated and the
  effect is real), continue but change the endpoint (add objective function measures),
  or halt. Also, the company will use the 12-week self-report data in a marketing
  application.


  And the twist I should add to make it non-generic: the company has already, in a
  prior trial, gotten approval for a similar drug on the strength of self-report endpoints,
  and the regulators accept self-report. Also the board''s charter says it can recommend
  only on safety, not efficacy — so the asker has to think about whether the "not
  themselves" reports count as harm (an adverse event) rather than as efficacy. That''s
  a nice, in-the-weeds hook: is losing your cares an adverse event or a therapeutic
  effect? The DSMB''s mandate is safety; the interesting move is that the wireheading
  worry can be framed as a safety signal (a harm) rather than a benefit. And the committee
  must decide whether to classify it as an AE (adverse event) and whether to recommend
  a halt, and whether to unblind.


