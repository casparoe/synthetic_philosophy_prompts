  line. And it''s not something a model has memorized. And no citations needed. And
  the philosophical issue (wireheading: is the reward signal the good, or a proxy;
  the experience machine; whether contentment without engagement is a harm; whether
  the subject''s own endorsement settles it) is instantiated without being named.


