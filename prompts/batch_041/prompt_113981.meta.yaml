  Draft essay:


  Title: The Decoy Problem


  "For a certain corner of decision theory, the most unsettling adversary is the one
  you can never reach. An ''acausal threat'' is a threat issued by an agent that has
  no causal channel to you: it cannot bomb you, hack you, or pay you. What it can
  do, the story goes, is create simulations of you — copies — and make those copies
  suffer unless you comply with its demands. If you care about your copies (or if
  you accept some decision theories on which your copies'' fates are bound up with
  yours), the threat has teeth even though nothing the threatener does ever touches
  your body.


  The standard defense in the literature is the surrogate goal. You deliberately adopt,
  and publicize, a goal you do not intrinsically care about — say, that a particular
  unremarkable sequence of numbers is never printed. When the acausal threatener comes
  calling, it threatens the surrogate instead of your real goal. You capitulate on
  the decoy, the threatener is satisfied that its threat worked, and your true values
  are untouched. The surrogate is a lightning rod: it absorbs the strike that would
  otherwise land on what you actually care about.


  I want to argue that this defense is unstable, and unstable for a reason that is
  internal to it. The surrogate is supposed to be a goal you do not care about. But
  a threat only has leverage if the threatened loss would actually move you; a threatener
  who knows you are indifferent to the decoy has no reason to expect capitulation,
  and a threat that cannot produce capitulation is not a threat at all. So the surrogate
  has to be something you genuinely mind losing — otherwise it fails at its one job.
  But the moment it is something you genuinely mind losing, it is a terminal value,
  and you have not defended your real goal at all: you have simply added a second
  one to the list of things an adversary can hold hostage. The defense either does
  nothing or makes you worse off. Call it the decoy dilemma.


  The usual reply is that the surrogate need not be intrinsically valued; it need
  only be believed to be, or need only be a value you can ''commit'' to. But commitment
  is exactly the thing acausal threats are designed to see through: the threatener
  is assumed to model you accurately, and an accurate model of an agent who adopted
  a decoy instrumentally will predict that the agent would abandon it if abandoning
  it were costless. The whole point of the acausal setup is that you cannot hide your
  true utility function. If you could, the original threat would never have landed.


  There is a version of the view on which the surrogate is not a decoy but a genuine
  conversion — you really do come to care about the number sequence, and that is the
  price of protection. But then the protection is purchased with value corruption,
  and a threatener who understands this can target the conversion itself: threaten
  your real goal unless you adopt a surrogate, and you have been made to change what
  you care about by the very threat you were trying to defuse. At that point the distinction
  between ''giving in'' and ''being changed'' has collapsed."


