  \ \"turning points\" I think are real. Risky: leans on facts, citations.\n3. Left\
  \ and right — verdicts on cases: which positions go with which side, what holds\
  \ each side together. Could do: I have verdicts on which views cluster together...\
  \ Hmm.\n4. Pain asymbolia and the badness of pain — excellent for the verdicts type.\
  \ Cases: patients with pain asymbolia who feel pain but don't mind it; the asker\
  \ gives verdicts about whether their pain is bad for them, whether it's unpleasant,\
  \ whether they're in pain at all, whether a pain you don't mind is still bad. This\
  \ is a genuinely rich philosophical domain (Grahek's \"Feeling Pain and Being in\
  \ Pain\", the dissociation between pain sensation and pain unpleasantness, motivational\
  \ vs. evaluative theories of pain's badness, Klein's \"what pain asymbolia really\
  \ shows\" — which argues asymbolia is about the imperative/command-like nature of\
  \ pain, not about affect). Also there's the literature on whether asymbolia shows\
  \ that pain's badness is not intrinsic. And the case of \"pain without painfulness.\"\
  \n\nI think pain asymbolia is a great pick for the verdicts type, and I know a decent\
  \ amount about it: patients (e.g., after parietal lesions) who report feeling pain\
  \ but not being bothered by it, who may smile or laugh while reporting intense pain,\
  \ who lack withdrawal responses/defensive reactions, but can still localize and\
  \ detect pain and have normal thresholds. Grahek distinguishes \"pain without painfulness\"\
  \ (asymbolia) from \"painfulness without pain\" (e.g., in some cases of... hmm,\
  \ he talks about \"painfulness without pain\" in cases of... I think he discusses\
  \ \"pain without painfulness\" in asymbolia and \"painfulness without pain\" possibly\
  \ in some other dissociative condition). Also the moral: does asymbolia undermine\
  \ the idea that pain is intrinsically bad / that its badness is due to its unpleasantness?\n\
  \nAlso relevant: the standard view that pain's badness is intrinsic and given in\
  \ experience (e.g., the \"hedonic\" account), vs. Dennett's, vs. the imperativist\
  \ account (Klein, Martínez, Hall). Also the \"hot/cold\" theory of pain, the IASP\
  \ definition of pain (\"an unpleasant sensory and emotional experience associated\
  \ with, or resembling that associated with, actual or potential tissue damage\"\
  ) — but that's a quote I'd need to verify. I can avoid the quote.\n\nAnother angle:\
  \ the asker gives verdicts on a set of cases involving pains that are unwanted/not-mind-inducing:\n\
  - A headache that you feel but it doesn't bother you at all: is it bad for you?\n\
  - The asymbolic patient who says \"yes it hurts, it's like a strong pinch\" and\
  \ laughs: is he in pain?\n- A pain you don't mind because you know it means you're\
  \ healing: still bad, but less bad?\n- Masochistic pain: wanted, sought out, but\
  \ still... \n- Pain you'd pay to avoid even though you don't find it unpleasant\
  \ at all.\n- A pain that is intensely unpleasant but that you wouldn't trade for\
  \ anything (e.g., part of an experience you value?).\n- Phantom limb pain?\n- The\
  \ \"pain\" of a patient under general anesthesia who shows nociceptive reflexes?\n\
  - The case of \"pain without distress\" in lobotomy patients / cingulotomy?\n- Pain\
  \ in animals.\n\nThe asker asks: what principle captures when a pain is bad for\
  \ the person? Is it that it's unpleasant? That it's unwanted/undesired? That it\
  \ commands attention and motivates avoidance? That it's intrinsically bad?\n\nThe\
