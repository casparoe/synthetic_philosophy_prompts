  A friend and I spent most of a long drive arguing about the dark forest hypothesis
  — the claim that the galaxy looks empty because every civilization that makes itself
  detectable is eventually destroyed by someone who was listening. Her view is that
  it''s the most economical solution to the Fermi silence; mine is that it''s a Hobbesian
  anthropology dressed up as physics, and that the whole thing collapses once you
  ask what would have to be true about detection, strike costs, and the intentions
  of strangers for silence to be a dominant strategy. We didn''t resolve it, and I
  now want to run it as a session for my class rather than argue about it. Please
  design the activity.


  Setting: a 90-minute session for an interdisciplinary seminar (philosophy of science
  and science fiction), 18–24 participants, one room, no computers. What I want them
  to walk out having felt, rather than heard: that the dark forest is not a claim
  about how many civilizations are hostile but about a payoff structure in which even
  a civilization that assigns a low probability to meeting a hostile one can have
  a dominant reason to hide or strike — and, just as importantly, how brittle that
  result is, since it seems to depend on a handful of assumptions that each look contestable
  the moment you name them.


