  the equilibrium may shift.


  - Secret role: one or two participants are dealt a "berserker" card (a self-replicating
  probe network that strikes any broadcast it detects, no strategy). Crucially, no
  one knows how many berserkers there are, or whether there are any. This should make
  the case vivid that the equilibrium doesn''t require a galaxy of predators — one
  unknown hostile is enough to make broadcasting a gamble.


  - Second run: change exactly one rule and replay the last few eras. Offer the facilitator
  a menu: (a) allow a "costly beacon" — a broadcast that verifiably forfeits expansion
  for two eras (a credible signal of non-aggression), (b) allow defense (a technology
  that intercepts kill vehicles), (c) make the win condition survival rather than
  expansion. The debrief should compare which of these dissolves the forest and which
  only relocates the problem.


  - Debrief: map specific moments onto the analysis: (i) the first broadcast and the
  first strike, (ii) the moment someone realized a strike launched now might be futile
  if the target advanced, (iii) the berserker reveal (if any), (iv) which assumptions
  did the work. Distinguish the dark forest from the Prisoner''s Dilemma and from
