  Mechanics to specify:

  - A galaxy map (grid, say 12x12 or a hex map), each civilization a token with a
  location, a technology level (starts at 1, advances one level per round), and an
  expansion rate.

  - Each round = "one era" (say, 100,000 years). Simultaneous orders written on cards.

  - Actions: EXPAND (colonize an adjacent sector), LISTEN, BROADCAST (declare your
  position to all — this is what gives you any chance of cooperation), STRIKE (launch
  a relativistic kill vehicle at a known location; arrives 3 eras later).

  - Detection: passive listening gives you a small chance per round of detecting a
  civilization within some radius (they''re "leaking" — no civilization can fully
  hide, because leakage is a byproduct of having a technological civilization at all).
  Broadcasting reveals exactly.

  - Strike resolution: a kill vehicle destroys the target unless the target''s tech
  level at arrival exceeds the launch tech level by 2 or more (the target has since
  developed defenses) — this creates the "use it or lose it" window and makes early
  strikes attractive.

  - Payoffs: survival and expansion; destroyed = out. Winner = the civilization with
  the most sectors at the end (this quietly rewards expansionism, which is one of
  the assumptions to interrogate).


