  Round 2: Dana says no — you''re confusing "perspectival" with "relative." Anekāntavāda
  is a realist doctrine: the object has infinitely many aspects and all of them are
  really there; a naya is a partial grasp of something that exists, not a "truth for
  me." The doctrine doesn''t say all views are equally true; it says each captures
  a slice. Also, Jains hold that a fully adequate cognition (kevala-jñāna) is possible,
  which is what anchors the partial ones; so it''s not "anything goes."

  Round 3: Sam: then the escape hatch is exactly the problem. To know that my judgment
  is one-sided you have to have some grip on the whole; if only an omniscient being
  has that grip, then the doctrine is unavailable to anyone who''d assert it — including
  the people who teach it. Also, the "slice" metaphor assumes the whole is a definite
  pie to be sliced; but the interesting disagreements (is the self permanent? is the
  world created?) aren''t about slices; the Jain "syāt" answer "both, in a sense"
  looks like it dissolves the disagreement rather than adjudicating it.

  Round 4: Dana: the "syāt" prefix isn''t "maybe"; it means "in some respect," and
  the seven forms are meant to be used with the specific respect identified — so "the
  pot exists" (as a pot, at this time, from this angle) and "the pot doesn''t exist"
  (as clay, later, from another). Also, the blind-men-and-elephant image shows the
  elephant is one thing; you''re the one assuming there''s no whole. And the doctrine''s
  practical upshot is epistemic humility in argument, not the claim that everyone''s
