  Summary content (invented):


  "Copycat is a computer program that solves letter-string analogy puzzles of the
  form ''abc is to abd as ijk is to what?'' It works by building a network of concepts,
  called the Slipnet, in which concepts are linked by their degree of association;
  it also has a workspace where it assembles a solution, and a set of small agents
  called codelets that propose and criticise moves. What makes it interesting is that
  it doesn''t follow a fixed rule. Instead, it represents many possible descriptions
  of the strings at once, and the descriptions compete; the program''s ''temperature''
  measures how well the current descriptions hang together. When the temperature is
  low, the program is confident and commits to a description; when it is high, it
  explores more freely. This is what Hofstadter means by ''fluid concepts'': concepts
  are not fixed categories but temporary, context-sensitive structures that can slip
  from one meaning to another. The program demonstrates that analogy-making is a matter
  of finding the right description, and that conceptual slippage is not a bug but
  the core of cognition. It also shows that high-level thinking can be reduced to
  the interactions of many low-level codelets, so it supports a reductionist view
  of mind. And because the program sometimes produces answers that a human would call
  creative, it shows that creativity is just randomness plus selection."


