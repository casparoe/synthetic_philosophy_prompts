  Draft:


  "I want to put a thesis to you and ask what would count against it. The thesis concerns
  the possibility of low-impact AI: the idea that an artificial agent can be constrained
  to avoid side effects — to leave the world roughly as it would have been, or to
  refrain from exercising unwanted influence — without anyone first specifying a full
  value function for that agent. My thesis is that this project is incoherent. Any
  proposed impact measure, I claim, must fall into one of three traps. Either it is
  trivial: satisfying it strictly requires the agent to do nothing at all, or to take
  only actions that make no difference to anything, which is useless for any real
  task. Or it is a full utility function in disguise: once you spell out which differences
  count as side effects and how much they matter, you have implicitly ranked world-states,
  and the measure is no longer value-neutral. Or it is arbitrarily baseline-dependent:
  the measure must compare the actual trajectory to some counterfactual baseline —
  inaction, a random policy, a default policy, the agent''s own prior — and the choice
  of baseline encodes a value judgment about what the agent was entitled to do, so
  the value-neutrality is an illusion.


  I am aware of the standard proposals that seem to avoid these traps. There is the
  idea of measuring impact as the reduction in the agent''s ability to reach a wide
  range of future states, on the thought that reachability is a value-neutral notion.
  There is the idea of penalizing changes in the attainable utility of a set of default
  policies, on the thought that you can keep the agent''s options open without knowing
  which options it values. There are information-theoretic measures that penalize
  divergence from a default policy, on the thought that staying close to the default
  is a value-free way to avoid interference. I want you to take these seriously and
  tell me what would count against my thesis, not by defending the proposals in the
  abstract but by identifying the specific evidence, arguments, formal results, or
  thought experiments that should move me.


  Sort the defeaters by how decisive they would be. Which of them would show that
  one of the three horns is not exhaustive, or that a particular measure escapes all
  three? Which would show that the baseline problem is not a problem about values
  but a general problem about counterfactuals, and therefore no more damaging here
  than elsewhere? Which would show that the triviality horn is not trivial — that
  there are measures that are non-trivial, value-neutral, and baseline-independent?
  And which would show that the thesis is unfalsifiable, because any measure can be
  redescribed as encoding values? Tell me what a defender of low-impact AI would themselves
  concede as counting against the thesis, not only what critics would say. If the
  thesis is well insulated, say so and say whether that is a problem for a thesis
  of this kind. I would also like to know what the thesis predicts that its rivals
  do not, and whether there are engineering developments — say, a working low-impact
  agent that passes a battery of side-effect tests without a hand-specified utility
  function — that would count against it.


  Please answer in continuous prose, without headings, bullet points, bold text, or
  tables. Write it the way you would write a long email to a colleague."


