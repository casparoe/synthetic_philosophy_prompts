  Draft:


  ---


  I teach normative ethics, and a recurring frustration in our departmental discussions
  of wild animal suffering is how often the exchange is short-circuited by the maxim
  that nature knows best. At a workshop last term on the ethics of wildlife intervention,
  a colleague invoked it to close off the suggestion that we might have reason to
  reduce suffering in the wild — as though the mere fact that a state of affairs is
  natural, or that natural processes produced it, settled the question of whether
  it ought to be altered. I want to be able to respond precisely rather than just
  registering that the phrase feels like an appeal to nature in disguise.


  So please lay out, as a menu, the distinct claims that the maxim could be making.
  I am interested in the full range: from readings so thin that no one would dispute
  them, through substantive empirical or metaphysical theses, to readings that are
  simply false or incoherent. For each, I would like you to say what the claim amounts
  to precisely, whether it is plausible on its own terms, and — this is the part I
  care most about — whether it would actually deliver the conclusion my colleague
  wanted, namely that concern about wild animal suffering is misplaced and intervention
  is unwarranted. Some candidate readings I can already see: that nature is a purposive
  agent or system with ends of its own; that ecosystems are self-regulating and tend
  toward a beneficial equilibrium, so that interference is self-defeating; that we
  simply lack the ecological knowledge to predict the consequences of intervention;
  and that the natural is for that reason normative. I suspect there are others, and
  I suspect that several of these trade on an equivocation — for instance between
  being well-adapted and being well-off — that the slogan conceals. Please also say
  which reading is most likely the one actually doing the work when the maxim is deployed
  in this context, and whether that reading survives scrutiny.


  ---


