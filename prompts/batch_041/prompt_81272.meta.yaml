  death). Later wrote "On My Religion" describing his loss of faith and his view that
  religious faith can''t be coerced, that salvation is not in our hands, etc.


  2. Mature political philosophy: Political Liberalism — the fact of reasonable pluralism;
  public reason; the "proviso" (religious doctrines may be introduced in public reason
  provided that in due course proper political reasons are presented that are sufficient
  to support what is proposed); the idea that public reason''s content is given by
  a family of liberal political conceptions; the criterion of reciprocity; the duty
  of civility; "political not metaphysical" — justice as fairness is presented as
  a freestanding political conception, not dependent on comprehensive doctrines.


