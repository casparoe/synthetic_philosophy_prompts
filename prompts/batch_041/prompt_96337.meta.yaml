  who holds the "P lowers W" position profits if W actually falls after P is adopted
  — so if the market''s advice is adopted, the losing side has an incentive to make
  W worse, i.e., to sabotage the metric. Futarchy''s reply: sabotage is costly and
  the saboteur must hold a position whose gains exceed sabotage costs; and it''s no
  worse than ordinary politics. This is a genuine in-the-weeds debate (Hanson''s "Shall
  we vote..." addresses manipulation; there''s literature on "decision markets" and
