  market / *conditional* market (settles on a counterfactual that never happens in
  the other branch). The "counterfactual settlement problem": you can only observe
  one branch, so the "W if P" market must be settled on a *forecast* of W under P,
  which reintroduces the judgment the mechanism was meant to replace — or requires
