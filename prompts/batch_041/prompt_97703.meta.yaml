  and the paint kept the wood from splitting through the winter. The road is paved
  now and the wood is treated, so the chore no longer does anything. And here is the
  part that interests me: almost everyone in the town would be relieved if it stopped,
  and almost everyone believes almost everyone else would be relieved, and still no
  one will be the first to skip it. Those who do skip are not punished in any organized
  way; they are simply, quietly, disliked, and they know it, and the dislike seems
  to have no basis in the harm the practice prevents, because it prevents none.


