  is a coordination equilibrium; and all of this is common knowledge, and the regularity
  is arbitrary in the sense that some other regularity would have solved the same
  problem just as well. That account fits how the practice began. It does not seem
  to fit what the practice has become. The coordinating problem is gone; the preference
  to conform now runs through no gain in coordination that I can see; and what looks
  like an obligation has grown on top of what was once a mere regularity.


