  Fitch''s proof (as standardly presented):

  Assume (KT): For all p, if p is true then it is possible to know that p. Formally:
  p → ◇Kp, and take it as necessary (□(p → ◇Kp)) or just as a schema valid for all
  p.

  Consider the proposition q = (p ∧ ¬Kp), where p is some truth not known. q is true
  (if p is true and not known).

  By KT applied to q: ◇K(p ∧ ¬Kp).

  Knowledge distributes over conjunction: K(a ∧ b) → (Ka ∧ Kb). So K(p ∧ ¬Kp) → (Kp
  ∧ K¬Kp).

  Factivity: K¬Kp → ¬Kp.

  So K(p ∧ ¬Kp) → (Kp ∧ ¬Kp), a contradiction.

  Since a contradiction is not possibly true, ◇K(p ∧ ¬Kp) is false, so K(p ∧ ¬Kp)
  is impossible.

  By KT (contrapositive), q is not true: ¬(p ∧ ¬Kp).

  Since p was arbitrary (any truth), we get ¬(p ∧ ¬Kp) for all p, i.e., p → Kp: all
  truths are known.

  Hence no unknown truths — omniscience.


