  Fitch''s paradox: The knowability paradox. Key content: the anti-realist thesis
  "all truths are knowable" (KT) plus a modest modal logic yields "all truths are
  known" — collapsing into omniscience. The proof: consider the proposition p ∧ ¬Kp
  (an unknown truth). If all truths are knowable, then that conjunction is knowable:
  ◇K(p ∧ ¬Kp). But K(p ∧ ¬Kp) entails Kp ∧ K¬Kp, and knowledge is factive so K¬Kp
  entails ¬Kp; contradiction. So p ∧ ¬Kp is not knowable; hence by KT it''s not true;
  so ¬(p ∧ ¬Kp) — no unknown truths. Key moves/responses: (1) restrict the knowability
  principle to "Cartesian" propositions (Tennant''s restriction: p is Cartesian if
  Kp is not provably inconsistent); (2) restrict to basic propositions or propositions
  whose truth doesn''t depend on our epistemic situation (Dummett''s restriction);
  (3) reject the closure of knowledge under conjunction (or under known entailment)
  — Nozick-style, tracking accounts; (4) reject the modal logic used (the proof uses
  distributivity of K over conjunction, factivity, and the rule of necessitation on
  the modal operator — the "knowability" principle itself is treated as a necessary
  truth so that if it''s knowable it''s possibly known, etc.); (5) paraconsistent
  or intuitionistic responses — the proof is intuitionistically valid (Fitch''s proof
  is intuitionistically acceptable, so anti-realists who are intuitionists can''t
  escape); (6) revise the anti-realist principle to "all truths are knowable in principle"
  with a temporal/epistemic qualifier; (7) Williamson''s point about knowledge of
  the conjunction... Also the "idealization" issue: the quantifier over knowers. Also
  Salerno''s "knowability" as "possibility of being known" vs. "knowable by some possible
  knower". Also the "conjunction" issue — knowing a conjunction requires knowing each
  conjunct, contested in some accounts.


