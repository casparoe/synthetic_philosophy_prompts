  Draft:


  Two colleagues of mine have been arguing for weeks about a licensing decision before
  our city council, and they have asked me to referee, which I can''t. The application
  is from a company that wants to sell a cultured meat grown from the cells of a paid,
  consenting adult donor. It is safe, kills no animals, and would be sold as a novelty
