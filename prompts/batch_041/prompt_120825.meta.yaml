  debate on legal moralism in modern dress, so please adjudicate their exchange move
  by move rather than telling me what you would decide.


  [Then the exchange.]


  Let me write the moves compactly but substantively.


  Move 1 (Priya, pro-ban): The council should refuse the licence, not because eating
  it harms anyone, but because a market in human flesh as food erodes a shared norm
  — that human bodies are not provisions — and that norm is a common good. Norms of
  this kind have thresholds: a practice can be rare and still shift what everyone
  treats as thinkable, so the absence of measurable harm to any individual is exactly
  what you would expect to see while the loss is occurring.


  Move 2 (Tom): (a) This is the argument that legal moralism always makes and it always
  reduces to one of two things: distress at knowing that other people are doing something
  one disapproves of, which is not a harm and cannot ground prohibition, or an empirical
  prediction of social decay, which has been used to justify persecuting consenting
  adults and has a poor record. (b) If the norm is as robust as Priya says, a novelty
  food cannot tip it; if it can be tipped by a novelty food, it was doing less work
  than she claims. (c) She also owes a baseline: we permit paid plasma donation, paid
  surrogacy, and the sale of hair, and we use human tissue in medicine, so she cannot
  mean commodification of the body as such. Her only remaining line is majority disgust,
  which is not a reason.


  Move 3 (Priya): He is answering a causal claim with evidence about consequences,
  but hers is constitutive, not causal. She is not predicting crime or breakdown;
  she is saying that a community which permits this is no longer a community that
  holds human flesh as categorically not-food, and that this is a change in what the
  community is. If that is right, then demanding evidence of downstream harm begs
  the question, and the loss falls on the community as such rather than on any individual
  — which is why he will not find an aggrieved party to point to. His baseline point
  also cuts the other way: he treats whatever we happen to permit now as the neutral
  starting point, and any argument for a line that is not the present one as an imposition
  of disgust.


