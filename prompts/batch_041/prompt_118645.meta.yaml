  Draft:


  I am the convener of the logic and philosophy of language paper for our department''s
  PhD qualifying examination, and I am putting together this year''s long question
  on the Liar paradox. The trouble is that my candidates arrive having been drilled
  in exactly the same three set pieces — Tarski''s T-schema and the hierarchy of languages,
  Kripke''s fixed-point construction over Strong Kleene valuations, and Priest''s
  paraconsistent alternative — so that a question inviting them to "explain the Liar
  and assess the main solutions" is answered by recitation alone, and tells me nothing
  about whether they can actually use the machinery. What I want, therefore, is a
  question that cannot be answered without doing some calculation, and I would like
  you, acting as an expert in philosophical logic with a specialism in the semantics
  of truth, to draft the question together with a model answer and a marking scheme.
  Before you write anything, please think the problem through carefully and brainstorm
  in a few lines the different ways a candidate might go wrong, so that the marking
  scheme can catch them; then give me the finished materials.


  The device I want the question to turn on is a sentence I have been using in tutorials
  and which I have taken to calling the hedging liar: a sentence H that says of itself
  that it is either false or else lacks a truth value. Set the question in a language
  with a truth predicate evaluated by Kripke''s minimal fixed point over Strong Kleene
  valuations, with falsity treated as truth of the negation and "lacks a truth value"
  as "neither true nor false"; the question should require candidates to work out
  what that construction assigns to H and to say whether the second disjunct buys
  the Kripkean anything. From there I want the question to press on the general point:
  whether a theory of this kind can express its own verdict on the sentences it leaves
  unsettled, and what, if anything, the candidate''s answer to that tells us about
  the revenge problem and about the choice between paracomplete and paraconsistent
  treatments. The question should be answerable in ninety minutes and worth 25 marks;
  please give me a model answer of roughly 700–800 words, and a marking scheme that
  names the five or six moves a distinction-level answer must make, the marks each
  carries, and, for each, the specific error that typically costs candidates the mark.
  I would also like a brief closing note distinguishing a solid upper-second answer
  from a first-class one. Please write in continuous prose where prose is called for,
  and use displayed formulae only where they earn their place.


