  the state permitted some displaced families to return. Our research director says
  pattern evidence alone cannot establish the intent the law requires; our partner
  organization''s legal memo says it can and routinely does.


  The draft criteria. Our research committee has circulated a criteria document that
  the board has never adopted. It requires (a) a finding that the victims were targeted
