  (2) don''t use it, describe the acts and let readers conclude what they like; (3)
  use it with an explicit qualification — state that the record meets our published
  criteria, note that no court has so found, and say plainly that we are not a court;
  (4) adopt the criteria document described below but defer the naming decision until
