  I write a science-and-ideas column and host a companion interview podcast, and next
  month''s guest is a philosopher of mind whose work I want to take seriously and
  test properly. Her claim, as I understand it, is that the unpleasantness of pain
  is not a sensory ingredient of the experience — not a special ''bad'' flavour added
  to the stinging or the burning — but a motivational state: pain hurts in the way
  a command hurts, because it demands that you protect the injured part, and its badness
  lies in that demand rather than in any intrinsic quality of the sensation. Her central
  evidence is pain asymbolia, the rare condition in which people report pain without
  being bothered by it. I have read that it shows up after damage to the insula and
  adjacent cortex, and also after cingulotomy and in patients on morphine, and that
  the usual description is of a patient who recognises the sensation, can localise
