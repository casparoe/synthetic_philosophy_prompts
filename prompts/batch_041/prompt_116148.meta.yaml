  it does not hurt in the ordinary way — some say it is painful but they do not mind
  it, and a few have smiled or laughed while being tested. She reads these patients
  as showing that the sensory and the aversive dimensions of pain can come apart,
  and therefore that the badness of pain is not intrinsic to the sensation. I want
  to press her hard without being hostile, and I want the questions to turn on the
  substance of the view rather than on her career.


