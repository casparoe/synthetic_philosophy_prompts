  I''m a high school junior planning a year-long independent research project in the
  philosophy of mind, and I''ve become stuck on a puzzle that I suspect is deeper
  than the way it is usually presented. When a blue dot is flashed at the top of a
  screen and then, a fraction of a second later, a red dot is flashed at the bottom,
  observers at certain timings report not two dots but a single dot that travels from
  top to bottom and changes color partway along the path. What unsettles me is that
  the color change is reported as occurring during the motion — apparently before
  the red dot was even displayed. Since the perceptual system cannot know about the
  second dot until it has been shown, the report seems to require that the experience
  be assembled or corrected using information from the future.


  The usual way of framing the puzzle is as a choice between two stories. On the first,
  the experience is built in real time and then quietly rewritten in memory before
  I can describe it, so the revision happens after the experience, much as a regime
  might alter the historical record after the fact. On the second, the revision is
  performed before the experience is ever presented to me at all, so the doctored
  version is the only version I ever have, much as a show trial is staged with fabricated
  evidence prepared in advance. My problem is that the two stories appear to predict
  exactly the same reports, the same reaction times, and the same neural data, and
  a friend has suggested that this is because there is no fact of the matter about
  when the revision happens — that asking when a constructed experience occurs may
  be like asking where on a globe the equator really is.


  Suppose I have roughly a year, no laboratory, and only my own reading and reasoning.
  Which open questions in this area most deserve that year, and in what order should
  I take them? I am less interested in the list itself than in the reasoning behind
  it: for each question, why it is upstream of the others, whether someone without
  equipment could actually make progress on it, and what would move it up or down
  my ranking. I would also like you to tell me which questions I should not bother
  with at all — including, if you think so, the question of whether the revision happens
  before or after the experience. Defend the ordering rather than merely describing
  the terrain, and be explicit about the criteria you are using and how they trade
  off against one another.


