  Consider a decision problem I will call the Ledger. An agent faces a sequence of
  stages n = 1, 2, 3, ... At each stage, before anything is resolved, she may either
  stop and take a sure payoff of 1 unit, or continue by accepting a lottery L_n that
  pays 2^n units with probability 2^{-n} and pays 0 otherwise. If she accepts L_n
  and loses, the whole process ends and her total payoff is 0. If she accepts L_n
  and wins, she proceeds to stage n+1 and faces the same choice, with the accumulated
  winnings banked. If she stops at any stage, she keeps the sure 1 unit from that
  stage plus whatever she has banked. The catch: the probability of winning the first
  n lotteries is 2^{-n}, and the probability of winning forever is 0; yet the expected
  value of accepting every lottery is infinite, since each L_n has expected value
  1 and there are infinitely many stages. Suppose we add that the agent is an expected
  value maximizer who treats expected value as the sole criterion of rational choice,
  with no diminishing marginal utility and no risk aversion.


  Now consider the proposition P: ''In the Ledger, the expected value maximizer is
  rationally required to accept every lottery L_n, and the fact that this leads her
  to forgo a sure 1 unit at every stage for a payoff that is 0 with probability 1
