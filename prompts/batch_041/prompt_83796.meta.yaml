  no feature. The double-storey ''a'' has a bowl and a hook over the top; the single-storey
  has a bowl and a straight stem. Blackletter ''a'' is a mess of broken strokes. So
  the "family resemblance" story fails at the level of features, unless we go very
  abstract.


  Para 2: The obvious fix is features-at-the-right-level-of-abstraction ("a bowl with
  an ascender-ish stroke on the right", "two connected counters"...). But: any such
  description either (i) includes things that aren''t ''a'' (e.g., ''d'' has a bowl
  and a tall stroke; ''q'', ''g'', ''ɑ'' IPA vs ''a''...), or (ii) excludes ''a''s.
