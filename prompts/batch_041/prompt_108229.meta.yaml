  Two friends of mine, an economist and a sociologist, fell into an argument at a
  dinner party over a case we all knew at second hand, and I would like a verdict
  that does more than pick a winner. The case is this. A mill town of about twelve
  thousand people loses its largest employer. Local unemployment rises from roughly
  five percent to roughly fifteen percent and stays there. A woman we will call Dana,
  who worked at the mill for eleven years, has applied for about forty jobs in the
  two years since and remains unemployed. Nothing about Dana changed between the two
  years: same skills, same age, same health, same willingness to move, same intensity
  of searching. Before the closure she had never gone more than a few months without
  work.


  The argument went as follows.


  (1) The economist: explaining Dana''s unemployment requires only facts about Dana
  — her skills, her reservation wage, her search behaviour, her beliefs about what
  is available. The local unemployment rate is a summary of many individuals'' situations,
  not a further cause. Where it looks as though it is doing explanatory work, it is
  standing in for facts about individuals: in Dana''s case, chiefly the fact that
  other job-seekers are competing for the same positions and that employers expect
  demand to remain weak.


  (2) The sociologist: that cannot be right, because the individual facts are the
  same in the world in which Dana was employed. Hold everything about Dana fixed and
  change only the town, and her prospects change. The thing doing the causal work
  is therefore a property of the aggregate, and it is not a summary of Dana''s facts,
  since her facts are being held constant. One cannot both hold the individual fixed
  and cite the individual as the explanation.


  (3) The economist: of course the town changed, but the town changing just means
  that other individuals'' facts changed — fewer firms hiring, more competitors per
  vacancy, employers revising their expectations downward. Write out the full individual-level
  description of every worker and every employer and the outcome is determined. The
  rate is a convenient index into that description. Reifying it adds nothing.


  (4) The sociologist: then write it out. To describe the employers you must say what
  they believe — that demand is weak, that the mill is not coming back, that hiring
  now is a risk not worth taking. Those beliefs have contents that are about the aggregate
  condition of the local economy. So the individual-level description cannot be specified
  without already using the macro-level facts it was meant to replace, and the reduction
  is circular. And supervenience, even if granted, is not explanation; the question
  is which level carries the counterfactual dependence. Ask what would have become
  of Dana had the mill stayed open and nothing about her changed.


  (5) The economist: beliefs about the economy are still beliefs, and still facts
  about individuals; you are confusing the order of specification with the order of
  explanation. And your argument proves too much. By your reasoning, the traffic jam,
  and not the drivers, made me late for my flight. But there is no jam over and above
  the drivers, only the pattern their separate decisions produce. In the same way
  there is no unemployment over and above the unemployed and the employers who pass
  them over.


  (6) The sociologist: the jam is a good example, and it cuts my way. Every driver
  chose a route in order to avoid delay; the delay came from their choices taken together.
  No single driver''s decision explains a two-hour standstill, and no driver could
  have brought it about alone; what explains it is the structure of the road network
  plus the fact that everyone was optimising in the same direction. That is what a
  social fact is: an outcome no one intended and no one''s biography contains. Dana''s
  forty applications failed for the same reason the drivers crawled. What defeated
  her was a situation, not a set of people.


  (7) The economist: then we disagree only about a word. I will grant that the local
  rate is a robust and projectible pattern with real predictive power. I deny that
  it is a cause over and above the individuals whose choices generate it, and I deny
  that any social explanation is complete until it says which individuals did what,
  and why. If an aggregate variable turns out to do work that no individual-level
  variable can do, that is evidence that we have failed to measure the right individual-level
  variables; the rate is a proxy for things about workers and firms we have not troubled
  to observe.


  (8) The sociologist: that last move is the one I reject most firmly. As you have
  stated it, no evidence could count against it, since any success of the macro variable
