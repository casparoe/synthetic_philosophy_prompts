  only themselves, with the two decisive pairs overlapping on a single pivot alternative
  -- the outcome in which neither of them does the thing in question; at least one
  of the two ranking the other''s private business in a way that is, by their own
  lights, perfectly sensible; and the two of them agreeing on a pair of outcomes,
  so that the weak Pareto principle has something to bite on. The contradiction should
  arrive as the punchline, and it should arrive in the specific form the theorem gives
  it: each person''s protected pair is respected, the agreed-upon pair is respected,
  and the resulting social ranking places one outcome above another that both parties
