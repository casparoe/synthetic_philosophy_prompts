  Draft argument (the friend''s reconstruction):


  (1) If A is genuinely the cause of B, then given A, B follows of necessity (barring
  some external interference).

  (2) When we watch fire meet cotton, all we ever observe is contact, then burning:
  a sequence, never a necessity.

  (3) Necessity is not a possible object of observation; nothing in the observable
  situation answers to "must."

  (4) So we never observe that A causes B; at most we observe that B has so far always
  followed A.

  (5) So no natural thing can be credited with the power to produce its usual effect;
  the regularities are God''s arrangement, and God produces each effect on the occasion
  of its usual antecedent.

  (6) Now apply the same test to (5): God producing the burning is no more observable
  than fire producing it. What we observe is the same sequence either way.

  (7) So if (4) is a reason to deny power to fire, it is equally a reason to deny
  power to God.

  (8) Hence either natural powers are back in play, or nothing is a cause — not even
  God. And if nothing is a cause, then nothing explains the regularities, and the
  occasionalist''s alternative has no advantage.


  And the asker asks: which step goes wrong, and what does giving it up cost? If I
  keep (2)-(3) and the "no unobservable posits" principle, I lose God as well as fire;
  if I make an exception for God, what licenses it? Alternatively, is (1) a misstatement
  — necessity is not a further fact alongside the sequence but a claim about what
  follows from the natures (the modal "given A and no impediment" is a conditional
  claim, and the "no impediment" clause does all the work)? Also possible: (3) is
  fine for observation but inference to the best explanation is legitimate; then both
  fire and God can be posited — which costs the occasionalist the argument (since
  the motive was to deny natural necessity).


  Also a nice additional horn: al-Ghazālī himself grants that the connection is "habitual"
  (customary) and that God''s habit is stable — so we can predict. But then the difference
  between saying "fire burns by nature" and "God creates burning whenever there''s
  contact, by a habit he does not break" is not a difference in observed regularity
  nor in predictive power; so what is the disagreement about? If the answer is "the
  modal status of the regularity," then the argument for occasionalism can''t be that
  necessity is unobservable, since the naturalist also needn''t claim to observe a
  necessity — he claims that the best explanation of the regularity involves dispositions/natures.
  So (3)-(4) equivocate between "we don''t observe necessity" and "there is no necessity,"
