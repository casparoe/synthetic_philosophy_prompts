  \ a posteriori is also technical and in-the-weeds (Kripke's Hesperus/Phosphorus,\
  \ the meter stick, the distinction between epistemic and metaphysical necessity,\
  \ contingent a priori like \"one meter\", scope distinctions in modal claims).\n\
