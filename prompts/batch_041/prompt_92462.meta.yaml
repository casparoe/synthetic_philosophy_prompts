  \ the necessary a posteriori as requiring some special epistemic access, confusing\
  \ the necessary a posteriori with the contingent a priori, getting the \"meter stick\"\
  \ case wrong, thinking rigidity is a semantic property of predicates rather than\
  \ terms, mixing up scope in \"the number of planets is necessarily odd\" style,\
  \ or claiming that identity statements with rigid designators are necessary while\
  \ thinking this proves something about concepts.\n\nOr revealed preference: a student\
  \ could be right that revealed preference theory defines utility from choice, but\
  \ subtly conflate Samuelson's original behaviorism with the later \"as if\" / representation-theorem\
  \ reading, or misattribute the \"rational fool\" critique (Sen), or wrongly say\
