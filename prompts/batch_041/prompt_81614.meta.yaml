  possibly ground the difference. The line I''ve been chewing on is the one where
  sameness of matter and sameness of form come apart. Melt the figure down and recast
  it in the original mould and you have, arguably, the same bronze and a new figure;
  cast a fresh copy from that same mould out of different bronze and you have, arguably,
  the same figure and a different bronze; melt it into an ingot and you have the bronze
  and no figure at all. I want a poem that makes that independence of matter-sameness
  and form-sameness feel like a fact about the world rather than a quirk of our nouns,
  and that leaves the grounding question open rather than pretending to solve it.


