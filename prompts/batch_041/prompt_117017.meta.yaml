  options; and once you do that, the options are comparable again (you prefer "I chose
  A" to "a coin chose A or B"). Fine — but then your incomparability was an artifact
  of leaving your own agency out of the description. That''s the "you''ve under-described
  the options" reply. Also, "this is what the situation calls for" is a verdict —
  and a verdict is a comparison, just in a different vocabulary; if it''s not, it''s
  a feeling with no claim on me.


