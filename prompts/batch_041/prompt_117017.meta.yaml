  what would settle it (more info); here no possible information settles it, and that''s
  the mark of the difference.

  (2) Her positive proposal: in such cases, what you do is not "pick the higher value"
  but "decide what to be" — the choice is an act of self-constitution; there''s no
  fact of the matter to discover, and the reasons are created/endorsed in the choosing.
  Hence regret: after a hard choice, it''s appropriate to feel a kind of regret for
  the value you couldn''t honor even if you chose rightly — which doesn''t make sense
  if it was just a close call with a near-tie (you don''t regret the road not taken
  when it was marginally worse).


  Marcus''s counter:

  (3) The regret point cuts the other way: regret is evidence of uncertainty or of
  loss, not of incomparability — you regret the holiday you didn''t take because you
  liked it a lot; a ranking can explain regret fully (you lost something valuable,
  and value is lost even when the alternative was better). Also, "decide what to be"
  is a way of describing the choice, not a way of making it rational: once you''ve
  decided, you can''t avoid having chosen the worse option if it was worse; self-constitution
  doesn''t rescue you from that.

  (4) And the practical worry: if there''s no ranking, then any procedure (coin flip,
  gut, who asked first) is equally defensible; incomparability dissolves the normativity
  of the decision. Whereas if you say some procedures are better (e.g., deliberation,
  imaginative engagement), you''ve re-introduced comparability under another name.


  Nadia''s response:

  (5) The arbitrariness worry assumes that justification must take the form of "this
  ranks higher." But deliberation can issue a verdict in another form: "this is what
  the situation calls for" / "this is the response the occasion demands" — the "demandingness"
  or appropriateness of the response, not a ranking of the options. And second, incomparability
  doesn''t mean "anything goes" — it means the reasons that survive are of a different
  kind: you can have reasons to choose one without those reasons making it better
  (e.g., "it''s mine", "I promised"). Also she can note: if anything goes, why doesn''t
  the coin flip feel right? Something is guiding us.

  (6) Also: your "pay to avoid the coin flip" test — I''d rather have either option
  than a coin flip; that doesn''t show one is better; it shows I care about choosing
  rather than being chosen for. Which supports my point about agency/self-constitution.


