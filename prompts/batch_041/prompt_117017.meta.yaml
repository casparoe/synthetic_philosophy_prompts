  Nadia (incommensurabilist):

  (1) Not everything is a magnitude. Some options are valued in different registers
  (loyalty, integrity, love, achievement) and there''s no exchange rate; asking for
  one is like asking how many miles a kilogram is. She can grant that this is "hard"
