  I''m a graduate student putting together the final session of a reading group on
  collective responsibility, and I want to structure it around a ranking exercise
  rather than another seminar discussion. The recurring problem is the inefficacy
  objection: if my taking one flight, eating one burger, or casting one vote makes
  no difference to whether the harm occurs, it''s hard to see how the individual act
  can be wrong — and yet it seems like a cop-out to say it''s therefore fine. Over
  the term we''ve collected seven candidate principles for when an individual''s contribution
  to a collectively caused harm is wrong, and I want to hand the group a tier list.


