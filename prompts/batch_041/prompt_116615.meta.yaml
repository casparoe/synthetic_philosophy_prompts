  I suspect are not in any textbook:


  1. The difference-making rule: an act is wrong only if, holding everyone else''s
  behaviour fixed, it makes the harm more likely or more severe.

  2. The threshold rule: your act is wrong when it belongs to a set of acts that jointly
  push the world across a harm-threshold, even though no member of the set is necessary
  or sufficient for crossing it.

  3. The universalizability rule: an act is wrong if the maxim of acting that way,
  when universalized across everyone similarly placed, would produce a bad outcome.

  4. The complicity rule: the wrong lies in participating in a harmful practice, not
  in the causal increment; you are implicated because you knowingly take part.

  5. The two-threshold rule (ours): there is a threshold at which the collective harm
  becomes bad, and a second, independent threshold at which your contribution becomes
  blameworthy; the two need not coincide, and you should act as if you might be the
  marginal contributor.

  6. The expressive rule: the act is wrong because of what it expresses or the norm
  it reinforces, regardless of its consequences.

  7. The fair-share rule: each person is entitled to an equal share of a sustainable
  total, and taking more than your share is wrong whether or not the total is exceeded.


  Please sort these into tiers — top tier for the principles that genuinely survive
  the inefficacy objection, bottom tier for the ones that collapse into it — and give
  me one or two sentences per principle saying why it lands where it does, naming
  the case that most threatens it. Then tell me which single principle you''d actually
