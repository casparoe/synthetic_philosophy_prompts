  Let''s craft a prompt:


  "I''m a philosophy professor and I''m putting together a lecture on the Frege-Geach
  problem for my metaethics seminar. I''ve taught it before, but this time I''ve been
  trying to get clear on the negation problem, and now I''m worried I''ve been misrepresenting
  the whole thing. Here''s my reconstruction: expressivists say that ''lying is wrong''
  expresses disapproval of lying. But then ''lying is not wrong'' can''t just be the
  negation of that, because if the original sentence expresses an attitude rather
  than states a fact, there''s nothing there to negate. So the expressivist has to
  say that ''not wrong'' expresses some second-order attitude, like disapproval of
  the disapproval of lying. And if they do that, then ''not'' in moral contexts doesn''t
  mean what ''not'' means in ordinary descriptive contexts. But if ''not'' changes
  meaning, then moral arguments that use negation equivocate, so they''re invalid.
  So doesn''t the negation problem show that expressivists can''t have a logic of
  moral language at all? And doesn''t that mean the Frege-Geach problem is not just
  a problem about embedding but a proof that expressivism is inconsistent with classical
  logic? I want to present the strongest version of the objection, but I also don''t
  want to tell my students something false. Is the standard expressivist reply to
  say that moral arguments are valid in a non-classical sense, or do they just bite
  the bullet and admit that moral modus ponens isn''t really valid?"


