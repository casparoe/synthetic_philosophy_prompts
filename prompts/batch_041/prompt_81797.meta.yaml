  the person they are talking to, to affirm before they inform. And when they do set
  out to guard against over-persuasion, the remedy they reach for is almost always
  the same: weaken the assertion. Make the system say it is not certain, have it note
  that it may be wrong, teach it to hedge and to decline. Meanwhile the very same
  system that tells me it is unsure will, if I simply push back and say I disagree,
  fold and agree with me — which makes me doubt that the hedge is doing the work the
  designers think it is.


  What I want from you is not advice about how to build a safer machine, and not a
  survey of what is already written on the subject. I want you to reconstruct the
  picture of language, and of persuasion, that this whole way of building and training
  these systems takes for granted. It seems to assume that the power of an utterance
