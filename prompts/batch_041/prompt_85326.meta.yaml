  Draft: "Over the winter break I volunteered at a wildlife rescue centre near my
  parents'' house. The centre treats injured animals — mostly birds and hedgehogs
  — and releases them once they are fit. During a quiet shift, one of the volunteers,
  a biology student, told me he thinks the whole enterprise is based on a mistake:
  the animals he releases are almost certainly going to die slowly, of starvation,
  disease or predation, and the same is true of the great majority of the animals
  born in the wild every year. He said that if we take the suffering of animals seriously,
  we should be doing what we can to reduce the suffering that goes on in nature itself
  — vaccinating animals against diseases, feeding them when food runs short, protecting
  prey species from predators, perhaps even altering predators so that they no longer
  need to hunt. The coordinator, who has been doing this for thirty years, said that
  our job is to repair the damage people have caused and then let nature take its
  course; the rest is playing God."


  Then the asker: "I can''t tell whether the coordinator''s answer is a principled
  position or a slogan. And I can''t tell what would count as an answer to my friend.
  I''d like advice on what to do: I''m on the volunteer committee next term and there''s
  a proposal to shift some of our budget from rehabilitation to a vaccination programme
  for wild animals. Should I support it? And how should I think about the disagreement
  between the two of them?"


