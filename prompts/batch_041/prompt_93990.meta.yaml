  Let me draft the student''s answer:


  ---

  The setup: an eccentric billionaire offers you a million dollars if at midnight
  tonight you intend to drink a vial of toxin tomorrow afternoon. The toxin makes
  you violently ill for a day but does no lasting harm. He can tell whether you''ve
  formed the intention. Crucially you don''t have to actually drink it — the money
  is in your account tomorrow morning, and you''re free to change your mind.


  The interesting bit is that the reward is attached to a mental state rather than
  to an action. If the payoff were for drinking, this would be a boring cost-benefit
  problem: a day of misery for a million bucks, probably worth it. But the payoff
  is for intending, and intention is weird: unlike raising your arm, you can''t just
  do it on command. You can''t intend to do something you''re sure you won''t do.


  So the puzzle is: at midnight, do you intend to drink it? You know that by tomorrow
  afternoon you''ll already have the money and no reason to drink, so you know you
  won''t drink, so it looks like you can''t intend. But the reasoning that got you
  there is itself the obstacle — if you could just not think about tomorrow, you''d
  form the intention, get paid, and skip the toxin.


  Kavka''s own answer, as I understand it, is that you should go ahead and drink the
  toxin. Once you''ve genuinely formed the intention at midnight, the question at
  3pm is not "what maximizes my payoff from scratch" but "what is consistent with
  the commitment I''ve already made," and the answer to that is to drink. That''s
  why the puzzle is supposed to be a problem for theories that treat intentions as
  nothing more than predictions of your own future behaviour — those theories can''t
  explain why forming the intention should have any rational grip on what you do later.


  I think the puzzle shows rational choice theory is incoherent. You have decisive
  reason to intend (a million dollars) and decisive reason not to drink (a day of
  misery for nothing), and if you''re fully rational you can see both, so you can''t
  have the intention you have decisive reason to have. The only way out is to be a
  little bit irrational on purpose — to cultivate a kind of self-deception where you
  don''t follow the reasoning all the way through.


