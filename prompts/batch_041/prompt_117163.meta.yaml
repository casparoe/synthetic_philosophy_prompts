  4. Non-cognitivism/expressivism: aesthetic sentences express attitudes, not beliefs
  — no truth-apt content to transmit; supports (nothing to be testimony about).

  5. Relativism about aesthetic truth relative to a community/standard — testimony
  can transmit knowledge within a shared standard, so it doesn''t fully support; it
  constrains.

