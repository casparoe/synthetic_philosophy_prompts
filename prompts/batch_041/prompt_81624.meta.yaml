  Also, the marking scheme should name specific misconceptions:

  1. Treating "has a function" as equivalent to "is beneficial/currently useful" (benefit
  fallacy).

  2. Assuming etiological accounts require a designer or intentional purpose (conflating
  selection with design).

  3. Assuming causal-role accounts are "merely" about mechanisms and so can''t distinguish
  function from accident (they can, via "function" relative to a capacity and the
  requirement of non-accidental contribution — actually Cummins requires the contribution
  to be part of an analysis of a capacity, and there''s a dispute about whether accidental
  contributions count).

  4. Confusing "selected for" with "selected" (i.e., conflating the trait''s being
  favored with the trait''s being favored *for that effect* — the classic "selection
  of vs selection for" distinction; that''s a real and crisp must-hit).

  5. Conflating the trait''s function with its "purpose" or with an evolutionary "goal".

  6. Thinking exaptations have no function.

  7. Thinking that the etiological account implies a trait must be currently adaptive.

  8. Assuming "swampman"-type cases settle the debate (they''re intuition pumps, contested).

  9. Thinking the accounts are rival analyses of one concept rather than possibly
  capturing two concepts (pluralism).

  10. Failing to see that the accounts can agree on most cases and disagree only on
  a specific class (novel traits, vestiges, drift).


