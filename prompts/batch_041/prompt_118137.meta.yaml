  Potential final:


  I am a high school senior, the editor of our school''s science-and-society journal,
  and a member of the debate team. In both roles I keep encountering claims about
  heritability: that intelligence is about seventy percent heritable, that height
  is about eighty percent heritable, that depression is about forty percent heritable,
  that because a trait is heritable it cannot be changed by schools or therapy, and
  that because a trait is heritable within a group, differences between groups must
  also be genetic. Our debate team is preparing for a tournament on whether districts
  should use polygenic scores for advanced-course placement, and my column has to
  evaluate these claims on a weekly deadline. I need a reusable procedure, not an
  essay.


  Please turn what heritability actually means, and what it does not mean, into a
  decision procedure I can run in about twenty minutes, without internet access or
  the original studies, using only a headline, a classmate''s summary, or a dataset
  description. The procedure should be a checklist or flowchart in words: the questions
  to ask in order, what counts as a sufficient answer to each, where the procedure
  stops because the claim cannot be evaluated, where it stops with a clear no, and
  where it hands the decision to a person because the remaining question is one of
  values or missing data rather than statistics. It must keep the distinctions that
  matter: heritability as a proportion of variance in a population versus a claim
  about an individual''s trait; heritability of a trait versus heritability of a difference
  between groups; heritability as dependent on the range of environments studied;
  gene-environment correlation and interaction; the assumptions behind twin and family
  studies, including equal environments and representativeness; the difference between
  twin-based heritability and SNP-based heritability; additive genetic variance versus
  non-additive effects; and the difference between explaining variation and predicting
  the effect of an intervention. It should say which of these distinctions can be
  dropped when writing for a general audience and which must survive. It should be
  honest about where a number is being used as a rhetorical prop rather than evidence.


  My constraints: I have AP Statistics but not genetics or advanced psychometrics;
  my faculty advisor, who teaches statistics, has to sign off before publication;
  I cannot run code or consult paywalled papers; and the procedure has to be short
  enough to use during layout. It should include a one-page field version for the
  column and a slightly longer technical appendix for the debate team. Please mark
  the points where the procedure cannot eliminate judgment, and explain what a user
  should do when the answer to a step is unknown.


  Then apply the procedure to at least three cases: (1) a classmate argues that because
  intelligence is about seventy percent heritable, schools cannot do much to raise
  achievement; (2) a headline reports that height is about eighty percent heritable
