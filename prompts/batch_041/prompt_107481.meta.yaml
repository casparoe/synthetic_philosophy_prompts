  Paragraph 1: Introduce the asker, the reading group, the scenario, and the position.


  "After thirty years in chemistry, I have spent my retirement reading philosophy,
  and a reading group I attend has spent several sessions on a puzzle that I cannot
  get out of my head. The puzzle is this: you are stranded in a desert and a passing
  driver will give you a lift to the next town only if he believes you will pay him
  a substantial sum on arrival; once you are in the car, however, and the ride is
  under way, you have no reason at all to pay, and both of you know it. The question
  is whether it can be rational to make yourself into the sort of person who will
  pay anyway—by some device, resolution, or character trait—so that the driver takes
  you. I have come to hold a view about this, and I would like you to tell me what
  would count against it."


  Paragraph 2: State the position in detail.


  "My view is that the case shows the unit of rational assessment must sometimes be
  a policy, disposition, or character trait rather than an individual act: it can
  be rational to have a disposition that it would be irrational to act on, because
  the disposition itself changes what is possible for you. I do not think this is
  merely a pragmatic point about precommitment devices, and I do not think it is captured
  by saying that you ''value being a certain kind of person''—rather, I think it is
  a genuine counterexample to any theory that assesses rationality act by act, including
  act-consequentialism and act-based causal decision theory. I also think the case
  generalizes: many of our important commitments (to honesty, to loved ones, to institutions)
  may have this structure."


  Paragraph 3: Ask for defeaters, with specific requirements.


  "What I want from you is a map of this view''s exposure. Which observations, arguments,
  intuitions, or formal results would count against it? I am especially interested
  in the replies that defenders of act-based rationality have made or could make—that
  the case is really about coordination, that the agent''s values make paying rational
  after all, that a broader act-description dissolves the paradox, that the disposition
  is not genuinely ''irrational'' in the relevant sense—and I want you to say which
  of these are decisive and which are merely awkward. I would also like to know what
  the view predicts that its rivals do not, whether it has been qualified into unfalsifiability,
  and what its own defenders would concede counts against it. Rank the defeaters from
  fatal to merely incidental, and tell me which one I should find most troubling.
  Please write in American English."


