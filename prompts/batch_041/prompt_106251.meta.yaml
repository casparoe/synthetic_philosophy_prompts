  the scholarly discussion seems to have been stuck for a very long time. One camp
  treats the dialogue as a serious piece of proto-logical analysis, perhaps about
  the difference between a compound term and a simple one, or about how a modifier
  restricts a kind; another treats it as a sophistical paradox, a reductio of a bad
  theory of names, or a linguistic joke; a third reads it as an allegory about political
  naming or about the relation between a whole and its parts. Everyone seems to agree
  on the words and on the basic structure of the argument, and yet no one moves. I
  want a diagnosis rather than a verdict. Is this a substantive disagreement about
  logic or metaphysics, a verbal dispute about how to translate the key terms — for
  instance, whether the classical Chinese sentence is better rendered as a claim about
  a particular white horse, about white-horseness, or about the compound kind white
  horse — or is it two groups answering different questions under one heading, one
