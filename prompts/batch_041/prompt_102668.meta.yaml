  I spent most of last night arguing with a friend about whether the Industrial Revolution
  was inevitable. He kept saying that if the steam engine had not been developed in
  Britain, someone else would have developed it soon after, because the underlying
  scientific, demographic, and resource conditions made it overdetermined; I kept
  saying that the particular network of tinkerers, coal mines, and patent institutions
  was contingent enough that a different world could have stalled for a century. Now
  I have to guest-host a small history-of-technology podcast next week, and the guest
  is a historian who defends a thesis that cuts across both of us: she argues that
  the standard increasing-returns account of path dependence, the one that explains
  lock-in through sunk costs, network effects, and coordination advantages, is incomplete.
  On her view, the deepest lock-in is what she calls epistemic lock-in: once a technology
  or institution wins, the relevant community''s imaginative horizon narrows, alternatives
  stop being represented in the training of practitioners, and the option ceases to
  be a live option for reasons that are not reducible to cost. She thinks this explains
  why the QWERTY keyboard, the standard railroad gauge, and the internal combustion
  engine persisted even when their efficiency advantages were disputed, and she claims
  that breaking this kind of lock-in requires an exogenous shock that reopens the
  imaginative space.


