  Option B: The Wild Duck + James vs. Clifford. Philosophical content: the ethics
  of belief. Clifford: it''s wrong always, everywhere, for anyone, to believe anything
  on insufficient evidence. James: our passional nature may legitimately decide questions
  that are genuine options and not decidable on intellectual grounds; belief can be
  a duty when it helps bring about the truth (the "truth" of the belief depends on
  belief — e.g., social relations, faith). The Wild Duck: Gregers Werle is a Cliffordian
  — he demands that Hjalmar face the truth about Gina and Hedvig''s parentage, destroys
  the family; Relling is the Jamesian pragmatist who prescribes the "life-lie" (livsløgnen)
  as a "stimulating principle." Hjalmar''s "life-lie" is that he will invent something,
  and that he''s the great breadwinner. The tragedy: the demand for truth leads Hedvig
  to kill herself. And Relling''s "life-lie" is a fiction maintained deliberately
  — that''s a puzzle for James (who defends believing on non-epistemic grounds when
  evidence is inconclusive, but here the belief is known to be false by the maintainer?
  Relling knows it''s a lie, but Hjalmar doesn''t). Key distinction: Relling''s life-lie
  is not the same as James''s "will to believe" — James requires that the option be
  genuine (live, forced, momentous) and undecidable by evidence; whereas the life-lie
  is a belief held against evidence that the believer doesn''t know is false. But
  also Relling manipulates: he "cultivates" the life-lie in others. So there''s a
  question: is Relling a paternalist about belief, and is that compatible with the
  ethics of belief? Also the "life-lie" may be an example of the Jamesian idea that
  certain beliefs are self-verifying: Hjalmar''s belief that he''ll invent something
  sustains him; but it also makes him ridiculous and self-deceiving.


  Also there''s the meta-question: is the play taking a position? Ibsen is notoriously
  elusive; the play is often read as anti-idealist but also as showing the cost of
  truth. And whether Ibsen''s play dramatizes something James and Clifford miss: e.g.,
  that the ethics of belief is not only about how one acquires beliefs but about how
  one imposes belief requirements on others — the third-person vs. first-person question.
  Gregers imposes his demand for truth on Hjalmar; Clifford''s dictum is about one''s
  own beliefs but has social implications; the play dramatizes the harms of "truth-telling"
  that''s not one''s business. That''s a nice "what the work adds" line: the ethics
  of belief is usually framed first-personally, but the play shows the ethics of demanding
  belief of others.


