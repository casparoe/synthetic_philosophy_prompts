  Draft:


  I have come to think that Pascal''s account of justice and force is broadly correct,
  but I suspect it is really a bundle of separable claims that are too often run together.
  On the one hand, there is the efficacy claim: justice without force is impotent,
  because unjust or merely aspirational norms cannot secure compliance against those
  who have no interest in obeying them. On the other hand, there is the authority
  claim: force without justice is tyrannical, so force cannot by itself make a rule
  just. And then there is the genealogical claim: because we cannot make what is just
  strong, we make what is strong just, so established law comes to be regarded as
  just simply by being established. I want you to treat this package as a position
  and tell me what would count against it.


  Please separate the efficacy claim from the authority claim and from the genealogical
  claim, and say what would count against each. In particular, I want you to examine
  a distinction I have not seen sufficiently explored: between force as a causal means
  of securing compliance and force as a constitutive condition of what counts as a
  rule of justice at all. Could a rule be a rule of justice if no one could ever enforce
  it? If not, does that vindicate the Pascalian package or collapse it into a claim
  about the concept of law rather than about justice? What would count against the
  constitutive claim?


