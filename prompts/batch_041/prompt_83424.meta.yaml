  Two positions:

  1. The harm/reliance camp: a promise binds because breaking it harms the promisee
  or undermines the practice of trust; the obligation is entirely downstream of these
  effects. If neither the person nor the practice is harmed, there''s nothing left
  to obligate.

  2. The act camp: the promise binds because the act of promising itself puts you
  under an obligation, independent of any harm; you''ve given the promisee a kind
  of authority or claim over your future conduct. Even if no harm comes of breaking
  it, you''ve wronged them.


  Cruxes:

  - The secret promise / promise to a dead person: does the obligation survive when
  the promisee will never learn?

  - The promise extracted under duress or to do something trivial (promise to meet
  at 3 rather than 2:05) — is the obligation proportional to harm or independent?

  - Whether the "practice" view can explain why the individual promise binds, or whether
  it just relocates the question.

  - Whether the two camps make different predictions about a case where breaking maximizes
  welfare but violates the promise.


