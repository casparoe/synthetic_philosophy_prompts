  is that this same man spent decades of his life sitting in darkened rooms watching
  mediums, and he was the first president of the Society for Psychical Research when
  it was set up in 1882.


  Now here''s the controversy I want to write about, and I genuinely don''t know where
  I land. Sidgwick''s own ethics ends in a stalemate he never got out of: he thought
  reason gives us two ultimate principles — that I should pursue my own happiness,
  and that I should pursue the general happiness — and that nothing in reason itself
  tells you which one wins when they conflict. That''s the famous ''dualism of practical
  reason.'' And there''s a reading of his life (I''ve seen it in a couple of the biographies)
  that says his psychical research was his attempt to break the stalemate: if we survive
  death, and if the universe is morally governed, then the long run reconciles self-interest
  with duty, and the dualism dissolves. He wanted evidence of survival, in other words,
  partly because his ethical theory needed it. He never got it — he died an agnostic,
  and the famous ''cross-correspondences'' that supposedly brought messages from him
  and his dead friends Myers and Gurney came later, and are dubious at best.


  So: two ways of telling the story, and I want you to write me an essay that picks
  one. Story one: this was a failure of nerve — a great philosopher whose system had
  a hole in it, who went looking for empirical evidence that would plug the hole,
  in exactly the wishful spirit that a rigorous inquirer should distrust. The fact
  that he wanted the result is reason to discount the inquiry. Story two: this was
  the most consistent thing about him — he treated the question of survival as an
  empirical question like any other, he helped expose frauds, he insisted on evidence,
