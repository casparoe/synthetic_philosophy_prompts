  I am working on a safety layer for a reinforcement-learning agent that is supposed
  to pursue a narrow objective while leaving the rest of the world as undisturbed
  as possible, and my colleague and I keep circling the same problem: we want a formal
  definition of side-effect avoidance, or low impact, that does not presuppose a full
  specification of value. We can specify the agent''s goal, and we can specify a few
  hard constraints, but we cannot rank all states of the world. I would like you to
  write the desiderata that any such definition must meet. Treat this as a specification
  exercise: what must a measure of side effects be able to deliver before we should
  trust it to guide an agent? Include the cases it must get right, the distinctions
  it must not collapse, the results from decision theory or causal modeling it must
  be consistent with, and the failure modes it must avoid. For each requirement, give
  the case or consideration that motivates it, and mark which requirements you take
  to be non-negotiable and which are merely preferences of a particular approach.
  I am especially interested in any pair or subset of requirements that cannot be
  jointly satisfied; if the list itself proves that no value-agnostic definition can
  do everything we want, say so and explain which requirement has to give.


  Then, as a stress test, apply the list to a few concrete puzzles. Suppose the agent''s
  action prevents a harm that would otherwise have occurred; is that a side effect,
  a benefit, or neither, and does the answer depend on whether the harm was part of
  the baseline? Suppose the agent''s action leaves the world''s state almost unchanged
  but drastically alters which future actions are available to other agents; should
  that count as high impact, and if so, how do we measure it without knowing what
  those other agents value? Suppose two side effects occur, one making some agents
  better off and one making others worse off, with no common scale; can they offset,
