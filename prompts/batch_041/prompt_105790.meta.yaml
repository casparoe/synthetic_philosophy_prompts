  For my independent-study project in philosophy, I have been playing the self-amending
  game Nomic with my school''s philosophy club — the game whose players change its
  rules during play, including the rules that say how rules may be changed — and the
  club has divided into two camps over what the game shows about legal self-reference.
  I would like you to draft the joint statement that the two camps could sign after
  a good-faith adversarial collaboration.


  The first camp, the "grounding" camp, holds that self-amendment is not paradoxical
  at all: every valid rule gets its validity from a higher rule, and the chain bottoms
  out in a foundational rule (a rule of recognition, or a basic norm) that is not
  itself validated by any rule but is instead a social fact or a presupposition, so
  there is no circularity in a rule authorizing its own amendment. The second camp,
  the "reflexivity" camp, holds that this move merely relocates the problem: if the
  foundational rule is what validates every rule, then any change to it is either
  validated by itself (a circle) or by nothing (arbitrariness), and if it cannot be
  changed then the system is not genuinely self-amending; on this view the paradox
  is real and shows that a legal order rests on an extra-legal act.


