  ---


  I have no background in philosophy, but I''ve been reading Hofstadter and Sander''s
  Surfaces and Essences and thinking about it on my own, and I want to know whether
  the view I''ve ended up with actually holds together before I start arguing about
  it with friends. Here is what I believe.


  1. Analogy isn''t a special trick for clever people; it''s the basic engine of all
  thinking. Categorizing something — seeing it as a chair, as an insult, as a friend
  — is just the limiting case of analogy, where I compare one thing to a single stored
  instance rather than to two or more.


  2. Because of this, a concept has no definition and no fixed boundary. It''s a fluid
  halo of remembered instances, and how far the halo stretches depends on what I''m
  doing and what I''ve just seen. There is no fact of the matter about whether a tomato
  is "really" a fruit or a "really" a vegetable; there are just two different stretches
  of the same halo.


  3. I''m also convinced that there are real natural kinds and that science finds
  them. Water is H2O whether or not anyone knew it, and people who classified whales
  as fish were wrong about whales — not just using a different vocabulary. Gold is
  the element with 79 protons, full stop.


  4. And I think meaning is use: what a word means is just the pattern of analogies
  a community makes with it, so the only facts about meaning are facts about how people
  actually talk.


  5. I think some analogies are genuinely better than others. The analogy a physicist
  draws between a gas and a swarm of billiard balls is not just more useful than a
  paranoid''s analogy between a stranger''s cough and a plot against him; one of them
  is tracking how things actually are and the other isn''t.


  6. One more, on a different axis: I think words are just labels stuck onto categories
  that we already have, so a creature without language can still make analogies and
  form concepts. But I also think that having a word for something changes what you
  can notice and think about.


  Where do these come apart? Please rank the tensions by how bad they are rather than
  treating them all as equally serious, tell me which pairings only look like conflicts
  and dissolve once you say what the terms mean, and for each real conflict say which
  commitment has to go and what it costs to give it up. Please write your answer in
  American English.


