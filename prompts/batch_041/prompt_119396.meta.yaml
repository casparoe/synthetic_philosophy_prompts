  Essay thesis: The popular idea that moral compromise is a case of "gains from trade"
  is a good heuristic but rests on three presuppositions that moral cases typically
  violate: (1) a transferable currency of value; (2) a well-defined status quo that
  fixes the reference point; (3) closure of the bargain — i.e., no affected parties
  outside the table. Then I claim that where these fail, compromise is better modelled
  as *joint authorship of a new norm* than as exchange of existing entitlements. And
  I say the difference is not merely decorative: it changes what we owe to those who
  refuse to compromise and to third parties.


  Let me write it carefully with numbered sections:


  1. The analogy. Two people (or two communities) with conflicting value systems.
  In trade, each gives up something it values less for something it values more; both
  are better off relative to no agreement; the locus of possible agreements is the
  contract curve in an Edgeworth box; the indeterminacy of the contract curve (a range
  of efficient splits) is resolved by bargaining power, not by welfare.


  2. Objection A: no currency. In monetary trade, side payments allow any efficient
  allocation to be reached. Moral compromises typically forbid side payments — you
  cannot compensate a pacifist for a war by giving them a tax cut; the "exchange rate"
  between two moral permissions is precisely what is at issue. So the bargain is one
  of barter under bilateral monopoly with no price. Reply (I anticipate): cooperative
  game theory offers price-free bargaining solutions (Nash; Kalai–Smorodinsky) which
  select a point on the frontier from axioms. But those solutions require that the
  feasible set and the disagreement point be well defined and that utilities be interpersonally
  comparable in the required sense — exactly what moral disagreement contests. So
  the reply relocates the problem rather than solving it.


