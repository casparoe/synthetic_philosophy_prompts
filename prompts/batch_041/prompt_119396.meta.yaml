  the solution concepts need exogenous data (feasible set, disagreement point, and
  a cardinal utility representation per party) that the moral case does not supply.


  3. Objection B: no fixed reference point. The "no agreement" point is not a natural
  fact but a description of the world that the parties dispute (is the status quo
  "current law" or "the just baseline"?). And compromise shifts the reference point
  for the next round (precedent), so it has an externality on future bargainers —
