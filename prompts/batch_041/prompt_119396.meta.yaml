  time.


  4. Objection C: non-parties. Trades between two parties are (approximately) Pareto-improving
  for the parties; moral compromises bind third parties — future generations, animals,
  dissenters within each camp. A bilateral bargain that imposes costs on non-participants
  is not a Pareto improvement simpliciter, and there is no mechanism of consent. So
  the "gains from trade" framing quietly converts a political question into a bilateral
  one.


  5. The repair: compromise as joint authorship. Rather than exchanging pre-existing
  entitlements, a moral compromise can create a new norm that neither party would
  have authored alone, with each party taking responsibility for the whole rather
  than trading parts. Analogy: a co-authored paper is not an exchange of paragraphs;
  the authors are jointly answerable for the resulting claim. Consequence: it makes
  sense to speak of a compromise being *honest* or *corrupt* in a way that has no
  analogue in trade — the "price" being paid is not a quantity given up but a responsibility
  assumed. And it explains why we resent "horse-trading" compromises: they treat norms
  as alienable property.


