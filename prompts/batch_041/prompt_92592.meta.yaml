  The correction: (1) That''s not how precommitment is supposed to work — the device
  is meant to bind against the present will; the question is whether *any* agent (individual
  or collective) has the authority to do that, and on what grounds. (2) Ulysses-at-the-mast
  does not consent in the relevant sense; what makes the case appealing is the *ex
  ante* endorsement, which raises the "which self counts" problem rather than solving
  it — and the same problem recurs for collectives. (3) Even granting the disanalogy,
  the dilemma is false: entrenchment can be defended on grounds that don''t reduce
  to "the majority is drunk" — protecting the preconditions of fair decision-making,
  guarding against time-inconsistency and cycling, minority protection, stability
  of expectations, preventing self-serving incumbents from changing the rules. (4)
  Also, "constitutionalism collapses into majority rule" isn''t the only alternative
  — you can hold that constitutional constraints are legitimate but defeasible, or
  that they''re legitimate only when they protect the conditions of democratic contestation
  (a "weak" or "democracy-reinforcing" precommitment). (5) The rotating-crew point:
  for the analogy to hold you need an agent that persists; the demos is more like
  a crew that''s replaced, so the binding is closer to one group binding another —
  which raises different questions (intergenerational justice) and makes the "self-binding"
  framing partly a fiction. (6) The eternity clause makes the stakes vivid: with no
  release valve, the later self''s endorsement is irrelevant by design — is that a
  feature or a defect? This is exactly where the analogy is tested.


