  Dogmatism paradox: The argument (Harman): If I know that P, and I know that any
  evidence that would count against P is misleading, then I can rationally ignore
  future counter-evidence to P. More precisely: S knows P → S knows that any evidence
  E such that E would justify ~P is misleading (given knowledge entails truth and
  no falsehoods are known... hmm). The classic formulation: (1) If you know P, you''re
  justified in believing that any evidence against P is misleading. (2) If you''re
  justified in believing that evidence against P is misleading, you''re justified
  in ignoring it. (3) So if you know P, you''re justified in ignoring evidence against
  P. But that seems dogmatic.


