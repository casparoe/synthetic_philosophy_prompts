  ---

  I''m a second-year PhD student in philosophy — my thesis is on the metaphysics of
  classification, mostly species and psychiatric kinds — and this term I''m TAing
  a big first-year survey module, ''Europe 1000–1800'', which is divided into three
  blocks (Medieval; Renaissance/Early Modern; Enlightenment), each with its own convenor,
  reading list and exam paper. What''s nagging at me is that the same department,
  in its research seminars, is full of people saying the periods are constructs: that
  ''the Renaissance'' is a label later centuries stuck onto a stretch of time that
  didn''t experience itself that way, that the medieval/modern break is an artefact
  of a Europe-centred story, that there''s no day on which the Middle Ages ended.
  Institutionally, though, we act as though they''re real. We advertise a chair in
  medieval history, not in ''1150–1420''. Journals have period remits. My supervisor
  won''t let me write a chapter that straddles two of them. Its definately a bit odd,
  and I can''t tell whether the two halves of the department are contradicting each
  other or just using the word ''real'' in different ways.


  So: take the role of an expert in the philosophy of historiography who also knows
  the metaphysics of classification, and think it through carefully — I''d rather
