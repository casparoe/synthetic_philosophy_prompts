  two forward-looking options. Walking away doesn''t make the loss go away — you already
  owe it. The decision to bid $1.10 over $1.05 isn''t justified by sunk costs; it''s
  justified by comparing "lose $1 for sure" vs. "pay $1.10 for $1 = lose 10 cents."
