  Prompt:


  I have never studied philosophy formally, but I have been reading about Benjamin
  Franklin and his project of moral perfection. As I understand it, he drew up a list
  of virtues, arranged them in a particular order, and kept a small book with a grid:
  one virtue per row, the days of the week across the top. Each day he marked every
  instance where he failed to live up to that virtue. He tried to work on one virtue
  at a time, hoping that once he had mastered one, the next would be easier, and that
  in time he might arrive at a completely faultless character. He was also aware,
  I think, that he never fully succeeded, and that order and method were themselves
  part of the appeal.


  I would like you to act as a philosopher of moral psychology and reconstruct the
  theory of moral perfection that this practice presupposes. Please think carefully
  and begin by brainstorming a list of candidate commitments before you settle on
  your answer.


  I am especially interested in the following. Does the practice presuppose that virtue
  is something like a set of separable habits that can be trained one at a time? Does
  it presuppose that moral failure is primarily a matter of inattention or weak habit
  rather than, say, bad character, bad luck, or social circumstance? Does it presuppose
  that a person can accurately observe and record their own moral conduct, and that
  such self-surveillance is good for them? Does it presuppose that moral perfection
  is a coherent goal at all, or only a regulative ideal? And does it presuppose a
  particular view of the relation between private self-improvement and public life
  -- that a better person makes a better citizen, or that the two are largely independent?


  Please distinguish between what the practice strictly presupposes and what it merely
  fits well with. For example, if a Christian account of sin and grace would also
  be compatible with the practice, or if a purely secular habit-formation account
  would be, say so. Then say where the practice is philosophically underdetermined,
  so that several theories of moral development could license it. Finally, tell me
  what would have to change in the practice if we replaced its implicit theory with
  a rival one -- for instance, with the view that moral behavior is driven much more
  by situations and social roles than by stable traits, or with the view that moral
  improvement is not cumulative but always starts from scratch. What would the chart
  look like then, and would it still make sense to keep it?


  No need for citations or reading lists; I want your reasoning, not a bibliography.


