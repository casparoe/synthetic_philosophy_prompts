  Hmm, but actually — is (5) really the flaw? Let''s think. (5) "A rational voter
  takes the action that gets them the better outcome." Under certainty, yes. The issue:
  (a) the voter doesn''t know others'' ballots (uncertainty → expected utility); (b)
  pivotality: if the voter isn''t pivotal, no action gets a better outcome; (c) the
  theorem''s "manipulable" is about a profile where the *outcome* changes and improves
  — but the voter doesn''t know when that is. So (5) is fine as stated ("gets them
  the better outcome" — if an action actually gets a better outcome, a rational voter
  takes it). The real slide is (4)→(6): from "at some profiles lying gains" to "rational
  voters don''t vote truthfully" — that needs knowledge and pivotality. And (7)-(8)
  slide from "some misreporting" to "outcome isn''t a function of true preferences"
  — even with strategic voting, the equilibrium outcome is a well-defined function
  of true preferences (of the game''s equilibrium). And (9)-(11): false dichotomy.


  Also the missing qualifier in (2)/(3): "every voting rule" should be deterministic/single-valued
  (resolute). The random-ballot rule shows it.


  Also: (1) is questionable — why should fairness require strategy-proofness? Non-strategy-proof
  rules can be perfectly fair (e.g., Borda is fair by some lights, just manipulable).
  And requiring strategy-proofness is a very strong axiom (dominant-strategy incentive
  compatibility); there''s a weaker requirement: no profitable manipulation in equilibrium,
