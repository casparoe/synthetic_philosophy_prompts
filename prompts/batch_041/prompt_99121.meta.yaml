  Specific sub-questions (weeds):

  1. What does "pathological" mean here — does it include feelings like love and compassion,
  or only self-interested desire? (Answer: it means "from inclination/passive sensibility,"
  including sympathy.)

  2. The phrase "from the matter of the will, the end, not from its form that is the
  law" — unpack the form/matter contrast as it functions here.

  3. "for feeling by whatever it may be excited is always physical" — why should the
  fact that a feeling is "physical" disqualify it from grounding duty? Is this an
  argument or an assertion?

  4. What is "motive power" doing in that sentence — is Kant saying metaphysics is
  psychologically necessary to be motivated, or something weaker?

  5. The claim that no moral principle is based on feeling, but is "an obscurely conceived
  metaphysic which inheres in every man''s reasoning faculty" — is this a claim about
  the content of morality or about the metaphysics of our faculties? Does it make
  the ordinary person''s moral thought implicitly metaphysical?

  6. "It is not a matter of indifference by what motives or means one is led to a
  good purpose (the obedience to duty)" — how does this connect with the worry that
  my caregiving is driven by inclination? Does the passage imply my acts lack moral
  worth?

  7. Is there any tension between "no moral principle is based on any feeling" and
  the role feeling plays elsewhere in Kant''s ethics — and if so, how would a Kantian
