  I''ve been reading rationalist blogs and forums for about fifteen years, which is
  how I ended up with a shoebox of intuitions about which things have reasons and
  which don''t. I can''t find the principle behind them, and I suspect at least one
  of the verdicts is just verbal residue. Here is what I actually think, case by case.


  - A thermostat: no reasons. ''It turns the furnace on because the room is cold''
  is fine shorthand, but nothing in the thermostat represents the cold as something
  to be gotten rid of.

  - A chess engine: reasons, of a thin, borrowed kind. I explain its move by saying
  it was trying to win a pawn, and that explanation isn''t just a redescription of
  the transistors — it''s the level at which the thing is actually organized.

  - An eye, and the natural selection that produced it: there is a rationale here
