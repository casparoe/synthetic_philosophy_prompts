  several different claims, some of them trivial, some substantive, and at least one
  of them false. He gave two puzzles that I cannot get out of my head: a rule that
  says it may never be amended, and a rule that says all rules are amendable, including
  itself. Can a later rule change the first? Does the second make itself unamendable
  by its own content, or does it authorize its own abolition?


