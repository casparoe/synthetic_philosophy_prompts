  but I cannot find the thing itself.


  There are people in my trade who, as a matter of settled temperament, cannot accept
  a bad settlement — not that they refuse, but that they are unable. If the numbers
  are poor they cannot bring themselves to sign, and they will go to a costly, uncertain
  hearing rather than do it. Everyone at the table works this out within half an hour.
  These people do markedly better than the rest of us: the other side, whose advisers
  are paid to be realistic, folds early, and clients seek them out. Now the part I
  cannot account for. When a colleague decides to become one of these people, sincerely,
  the decision does not take. Everyone can tell that the refusal is being performed
  as a tactic, and once they can tell, it is worth nothing.


  Three things I have noticed about the pattern, which may or may not be essential
  to it. First, it appears to be self-erasing under its own description. The people
  who have it are the last to know it is doing them any good; one of them told me
  that when he began thinking about it in these terms, he started losing. I can see
  the mechanism perfectly clearly, and I cannot have any of its benefit. Second, it
  does not scale. If everyone at the bar acquired it, no case would settle, the courts
  would seize up, and the advantage would vanish — so it is something I want for myself
  and would not want for my profession, and I cannot tell whether that makes it a
