  Conceptual issue: "How can a thought experiment yield knowledge about the world
  if it contains no new empirical information?" The classic answers: (1) they''re
  arguments in disguise (all the content is prior knowledge + logic); (2) they''re
  a kind of perception of the modal/abstract realm (Brown''s Platonic view); (3) they''re
  "intuition pumps" that re-describe a case to make a tacit inference salient; (4)
  they''re experiments in the sense of manipulating a mental model and reading off
  the result (Nersessian, Gendler). To be in-the-weeds: the distinction between a
  thought experiment that is "constructive" (establishes a positive result, e.g.,
  Galileo''s) and "destructive" (refutes a theory by showing a counterexample), and
  the specific puzzle of "unreliable but productive" thought experiments.


