  I am a software engineer — fifteen years on backend systems, the last four on machine-learning
  infrastructure — with no formal training in philosophy, and I have been awarded
  a six-month, part-time research fellowship that a foundation reserves for people
  from outside academic philosophy. The application requires a two-page proposal,
  and I would like you to write it. I have a half-formed idea and I need it turned
  into something a review panel of philosophers will take seriously.


  The idea. Systems I work on are routinely described as if their internal states
  were about things: a ranker "prefers" one document, a reward model "wants" the agent
  to do X, a classifier "mistakes" a husky for a wolf, a detector "reads" a coin.
  [two-bitser] ... I half-remember a thought experiment in which a coin detector in
  a vending machine is compared with its counterpart in a world where the coin that
  makes the machine vend is a different coin, and a long-running dispute about whether
  such a device''s states are about anything in their own right or only borrow their
  aboutness from the intentions of the people who designed and use it.


  Where I think the dispute leaves a hole. Both sides seem to treat the borrowing
  as a single relation with a single lender... my working life doesn''t look like
  that. A reward model is trained on preference comparisons that another model generated;
  the policy is fine-tuned on trajectories that the reward model shaped; the reward
  model is then retrained on the policy''s outputs. The chain of borrowing runs through
  artifacts that are themselves candidates for aboutness, and sometimes it runs in
  a loop. So: when a state''s aboutness is borrowed, what is it borrowed from, exactly,
  and does the chain have to bottom out somewhere — and if it does, must the bottom
  be a person (or a community of persons) who meant something, or can it bottom out
  in something that is not a meaner at all, such as a selection history, a training
  distribution, or a standing practice of use?


