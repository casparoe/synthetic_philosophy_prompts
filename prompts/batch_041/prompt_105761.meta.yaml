  \ practice — e.g., the practice of \"if-then\" in insurance contracts? Or the practice\
  \ of conditional probability forecasts in weather (\"70% chance of rain if...\"\
  ). Hmm. Or the practice of \"betting odds on conditionals\" in prediction markets.\
  \ Or: the practice of the \"conditional prediction\" in legal standards: \"if the\
  \ defendant had not been negligent, the harm would not have occurred\" — counterfactual.\
  \ Hmm, but that's counterfactual, not indicative.\n\nActually a nice one for triviality:\
