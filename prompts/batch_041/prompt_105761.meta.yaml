  \ (a policy question: what happens if I randomly assign patients to hospitals) vs.\
  \ the stratified (what happens to a patient with characteristic X).\n\nSo the prompt:\
  \ A novelist (maybe writing a novel about a hospital, or about a baseball analytics\
