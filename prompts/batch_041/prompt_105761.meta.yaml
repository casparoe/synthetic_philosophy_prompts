  \ X\". Or **the practice of \"prompting\" as a causal intervention**. Hmm.\n\nAlternatively\
  \ for the careenium: **the practice of \"levels of explanation\" in psychiatry**\
  \ — e.g., \"the depression is caused by a serotonin imbalance\" vs \"caused by a\
  \ life event\". The practice of insurance/billing? Hmm.\n\nHonestly, Simpson's paradox\
  \ seems the strongest fit and is well-known enough that a small LLM knows what it\
