  so that gains from trade exist only between people whose priorities diverge. Participants
  should be able to make binding, verifiable pledges -- shifting a unit of effort
  or resources away from one cause and toward another -- and the payoffs should be
  points that each player scores by their own portfolio, with no real money and no
  common currency across players. Build in the rule that a trade counts only if both
  parties can state, in public, a justification the other would accept; I want to
  see whether the group discovers on its own that some trades cannot be defended this
  way. Include materials (portfolio cards, a pledge ledger), a timeline for the session,
