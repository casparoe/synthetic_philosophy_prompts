  consequences, so it''s not threatened the same way — follow-up: but deontologists
  still need causal knowledge to apply rules, and the same chaos argument applies)?
  Does the "expected value" reply work? Is there a difference between "cluelessness
  about what will happen" and "cluelessness about what to do"? Does the problem undermine
  longtermism (which needs to know the sign of effects on the far future)? Is there
  a "robustness" reply (focus on interventions whose effects are robustly good regardless
  of distant chaos)? And a follow-up keyed to likely answers.


