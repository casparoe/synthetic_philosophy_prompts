  The cluelessness problem: Lenman (2000) "Consequentialism and Cluelessness" (Philosophy
  & Public Affairs). Argument: because of chaos/butterfly effects and the vast causal
  web, the total consequences of any act are unknowable; so act consequentialism''s
  verdicts can''t be applied. Replies: (a) we can know the sign/probable effects of
  acts on local, tractable goods; (b) we only need expected value, and expected value
  calculations with unknown far effects may be dominated by known near effects; (c)
  the problem generalizes to all moral theories (deontology needs causal knowledge
  too) so it isn''t a special problem for consequentialism; (d) the "far effects wash
  out" / symmetry arguments; (e) Hilary Greaves''s "Cluelessness" (2016) — argues
  cluelessness is real but that a "tractable" response: we can still be guided by
  the "expected value" of our options in cases where we have a good estimate; she
  distinguishes "simple" vs "complex" cluelessness. Also: Tarsney''s "The epistemic
  challenge to longtermism" argues that the epistemic problems for longtermism are
  manageable — he argues that "the epistemic challenge to longtermism" isn''t fatal
  because the sign of the far-future effects is likely positive given certain assumptions.
  Also: the "Pascalian" worry: if we can''t know far effects, expected value reasoning
  leads to paralysis or absurdity (e.g., Pascal''s mugging). Also: cluelessness for
  longtermism is different from cluelessness for ordinary acts.


  Good interview questions could press: Is the problem epistemic or practical? Does
