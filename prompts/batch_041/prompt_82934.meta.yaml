  You are a philosopher of mind and cognitive science with expertise in the Darwin/Turing
  inversion of reasoning and in the foundations of artificial intelligence. I want
  you to adjudicate a disagreement between two colleagues of mine, neither of whom
  I agree with. Please think carefully, and begin by brainstorming the possible criteria
  for competence, comprehension, and reason-tracking before you give a verdict.


  Background: A machine-learning system was trained only to predict the next step
  in human-written mathematical proofs. It has now produced a proof of a new theorem,
  and human mathematicians have verified every step. The proof is not a trivial recombination;
  it uses a known lemma in a way that no human had used it before. The system has
  no capacity to explain its proof, answer questions about it, or recognize when a
  step is wrong if the surrounding context is changed.


  My colleague A says: This is a clean case of competence without comprehension. The
  system has the competence to produce a valid proof, but it does not comprehend the
  mathematics, because its mechanism is prediction rather than reason-tracking. The
  proof''s validity is a fact about the proof, not about the system''s mind. A calculator
  can be reliable at arithmetic without understanding it, and natural selection can
  produce design without a designer. The Darwin/Turing inversion just extends this:
  you explain the competence by a process that lacks the comprehension.


  My colleague B says: That conflates reliability with responsiveness to reasons.
  The system is not merely reliable; its output is novel and sensitive to the specific
  inferential context. If it reliably produces steps that are correct for the reasons
  that make them correct, then it is tracking those reasons, even if it cannot articulate
  them. A calculator only follows an algorithm; this system is more like a scientist''s
  intuition. And if you insist that comprehension requires articulation, you make
  comprehension a mysterious extra ingredient that does no explanatory work.


  A replies: Novelty and sensitivity are not comprehension. Natural selection produced
  novel solutions without any representational states, and this system''s internal
  states represent a proof space only in the way a map represents a city—representation
  is not understanding. What matters is whether the process is answerable to reasons,
  not whether it covaries with them.


  B replies: Then your distinction between answerability and covariance is itself
  doing the mysterious work. Either you can give a test for it that does not presuppose
  human-style articulation, or you are just labeling whatever humans do as comprehension
  and whatever machines do as mere reliability. The inversion shows that comprehension
  is not needed to explain the competence; it does not show that there is a further
  fact about comprehension that the system lacks.


  A replies: The further fact is normative. The system''s states have no correctness
  conditions of their own; they are correct only relative to the training data and
  the verifier. A human mathematician''s states are correct or incorrect for reasons
  she can be criticized for missing. That is the difference between a process that
  is answerable to reasons and one that merely produces outputs we happen to endorse.


  B replies: But you have now moved from comprehension to accountability. A mathematician
  can be answerable to reasons without being able to articulate them, and a system
  can be answerable to reasons if its design makes it sensitive to counterevidence—say,
  if it revises its proof when a lemma is shown false. If it does not, that is a limitation
  of this system, not of the inversion.


  Now adjudicate their exchange point by point. For each move, say whether it is clearly
  mistaken, partly right, or clearly right, and briefly justify your rating. Then
  say which side, if either, has the better overall position, and what both are missing.
  In particular, address: (1) whether the distinction between reliability and reason-tracking
  can be made precise without begging the question; (2) whether the Darwin/Turing
  inversion supports A''s or B''s reading; and (3) whether the case would change if
  the system revised its proof after a lemma was shown false, or if it could answer
  a single counterfactual question about why a step is valid. End with the strongest
  version of the view you reject.


