  should cooperate, because the choice each makes is the output of the same reasoning
  applied to the same situation, so defecting cannot be the answer that arrives in
  one of them without arriving in the other; the ordinary dominance argument, which
  treats the other player''s choice as fixed and independent of one''s own, is thereby
  supposed to lose its grip. I want the poem to take that seriously, and to stay honest
  about the objections rather than resolve them.


  The form should do the work. Twenty-four lines, in two twelve-line halves. The second
  half must be the first half in the same order, with I and you exchanged throughout,
  so that the poem reads as though the other party had spoken it. Rhyme, if you use
  it, should be identical in the two halves so that the symmetry is audible and not
  merely visible. Exactly one line must be exempt from the exchange and appear word
  for word in both halves; that line is the poem''s hinge, and it should be the point
  at which the argument stops being about symmetry and becomes a matter of assumption.
  It should be genuinely uncertain who is speaking it — either of the two, or a third
  reasoner who is almost, but not quite, identical to them. That boundary case, the
  near-copy, is where the position is contested, so it should be the poem''s most
  exposed line rather than its most confident one.


