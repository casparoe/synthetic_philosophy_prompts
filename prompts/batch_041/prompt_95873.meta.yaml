  Prompt idea:


  "You are a philosopher of language and a formal poet. I am designing a unit for
  an advanced undergraduate seminar on language, power, and default assumptions. We
  have been reading Douglas Hofstadter''s satirical essay known as the Person Paper,
  in which the grammar of racial marking is transposed onto gender marking to expose
  how ''male'' functions as the unmarked default and ''female'' as the marked exception
  in English. I want a poem that performs the same kind of inversion rather than merely
  commenting on it. Write a dramatic monologue in rhymed couplets, spoken by a fictional
  style-guide editor who believes he is defending clarity and tradition. Choose one
  default/marked pair other than male/female -- for example, white/Black, cis/trans,
  able-bodied/disabled, or native-born/foreign-born -- and make the poem''s form enact
  the very asymmetry the speaker denies. Specifically: the unmarked term should always
  fall in the unstressed position of the line, while the marked term should be forced
  into the rhyme position or the stressed beat, so that the couplets keep ''marking''
  the marked term even as the editor insists that the default term is neutral. The
  poem should be 16-24 lines, metrically regular, and should not resolve the tension:
  the final couplet should leave the reader unsure whether the speaker has been exposed
  or merely restated. Before writing, brainstorm two or three candidate pairs and
  the grammatical markers you would use for each, then choose the one that lets the
  form do the most work. The poem should be accurate enough that a linguist would
  recognize the phenomenon of markedness, and vivid enough that a reader who has never
  heard the term would feel it."


