  set S of utility pairs, a disagreement point d = (d1, d2), and the ideal point a
  = (a1, a2), where a1 is the largest u1 such that (u1, u2) is in S for some u2 and
  a2 is the largest u2 such that (u1, u2) is in S for some u1. It then draws the ray
  from d to a and selects the feasible point on that ray farthest from d. The result
  equalizes the proportional gains: each bargainer receives the same fraction of the
  gain from disagreement to their own ideal.


  My thesis is that this proportional-gain reading gives the solution a fairness rationale
  that the Nash solution lacks. Nash maximizes the product of the gains, which makes
  the division depend only on the local shape of the Pareto frontier near the solution.
  Kalai–Smorodinsky makes the division depend on how much each bargainer could have
  hoped for. If one party''s ideal improves while the frontier near the Nash point
  is unchanged, Nash leaves the division alone and Kalai–Smorodinsky moves toward
  that party. I think that is the right response: a party who could do better in the
  feasible set has a stronger claim, and the solution should register it.


