  the ideal point is not the same as a threat: it is a feature of the feasible set,
  not a credible unilateral action. But I am not sure the reply is adequate. If a
  bargainer''s ideal is high only because the feasible set contains outcomes that
  are terrible for the other party, it is not obvious that this should strengthen
  the first party''s claim. That led me to a repair.


