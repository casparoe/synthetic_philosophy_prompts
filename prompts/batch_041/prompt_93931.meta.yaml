  Commercial aquaculture treats the welfare of fish and the welfare of crustaceans
  under sharply different standards. Fish raised for food are increasingly subject,
  in many jurisdictions, to rules requiring that they be rendered insensible before
  slaughter, and slow asphyxiation in an ice slurry or death in carbon dioxide-saturated
  water is widely condemned as inhumane. Shrimp and prawn hatcheries, by contrast,
  routinely induce spawning by ablating the eyestalk of broodstock females — pinching,
  cutting, or cauterizing it off — and crustaceans are commonly killed by chilling,
  boiling, or desiccation. Even where the law has begun to recognize that decapod
  crustaceans can suffer, hatchery and kitchen practice appears to have changed little.


