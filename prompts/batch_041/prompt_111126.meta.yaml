  What are the positions on "why is extinction bad beyond the deaths it involves"?


  1. It isn''t bad at all beyond the deaths (person-affecting/narrow). Extinction
  that kills no one (e.g., humanity ends after everyone dies naturally, or ends peacefully
  with no one dying prematurely) is not bad, or is only bad in derivative ways.

  2. Impersonal totalism: lost future value — the lives that would have been lived,
  the goods never realised. Bad because of the net value of the missing future.

  3. Scheffler''s "modest/conservative" view: it is bad for us, now — our valuing
  practices (love, ambition, inquiry, projects) presuppose a "collective afterlife";
  if we knew humanity would end soon, many of these values would be undermined, so
  the prospect of extinction damages the meaning of our lives. Not because future
  people are harmed but because of what it does to the "human project".

  4. Collective/irreducible value: humanity or "the human project" is itself a bearer
  of value — its destruction is a loss of a good thing, not reducible to individual
  lives. (This is the "value of humanity" claim Scheffler entertains.) Related: Nietzsche''s
  "the value of the human being as a species" / Arendt''s "natality"/"the world".

  5. Aesthetic/romantic view: what''s lost is a "way of life", a culture, a "world"
  — the value is in the whole, an organic unity (nice tie to Moore''s organic unities!).
  Hmm, that''s a nice cross-link but maybe too clever.

  6. Narrative view: the human story is incomplete / the story''s ending matters;
  a good ending matters.

  7. Relational/identity view: it is bad because we are partly constituted by our
  relation to a future — "we are the last generation" changes who we are. Similar
  to Scheffler.

  8. The "it''s bad for the dead/retroactively" view.

  9. The "cosmic indifference / it doesn''t matter at all" view — the universe is
