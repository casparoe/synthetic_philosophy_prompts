  Essay: ''Incompleteness Is Not the Limit You Think It Is''


  The popular use of Gödel''s theorems outside mathematics usually runs: since any
  sufficiently rich formal system contains truths it cannot prove, there are truths
  beyond any theory, and hence no final theory of physics. I want to separate what
  the theorem actually delivers from this conclusion, and then propose a criterion
  for when it could apply to a scientific theory.


  Three clarifications. First, the incompleteness is relative to a system. The sentence
  Gödel constructs for a system S is unprovable in S if S is consistent; but S together
  with the statement that S is consistent proves it. So the theorem does not produce
  a sentence unprovable by any means, only one unprovable by the means S itself licenses.
  Calling it ''unprovable, period'' is a slide, and it is a slide that a physicist
  would recognize: it is the mistake of reporting a limitation of an instrument as
  a limitation of the world.


  Second, the theorem requires the system to be effectively axiomatizable, consistent,
  and strong enough to encode arithmetic. Dropping the third condition is not a technicality:
  most physical theories are not known to be, or presented as, arithmetically strong
  systems, and a theory that cannot encode the relevant arithmetic has no Gödel sentence
  to worry about. Dropping the first condition is worse: a system with an unspecifiable
  axiom set can be complete, which is why ''we could always add the missing axioms''
  is not an evasion but a real, if unhelpful, reply.


  Third, the argument that human mathematicians escape the theorem requires us to
  know our own consistency, which is exactly what the second theorem denies to a system
  of the relevant kind. If we can know it, we already have a capacity no such system
  has; so the argument assumes what it was meant to prove.


  I therefore propose a criterion: a scientific theory is exposed to a Gödelian limit
  only if (i) it is effectively axiomatizable, (ii) its formalization encodes enough
  arithmetic or combinatorics, and (iii) it claims of its own entailment relation
  that whatever it entails is true. Condition (iii) is the one worth arguing about,
  because it is a claim about the theory''s relation to its own use, and because a
  theory of measurement in which the theorist is part of the domain is the natural
  place for such self-reference to arise. On this criterion, most appeals to Gödel
  in physics are misplaced, and the honest analogue of incompleteness is not ''there
  are truths we cannot reach'' but ''there are questions about the long-run behaviour
  of the systems we build that no effective procedure settles'' -- the halting-type
  questions, which are a matter of undecidability rather than of truth outrunning
  proof."


