  "I''m taking a seminar on moral uncertainty and I''ve been assigned to write on
  Ursula K. Le Guin''s ''The Ones Who Walk Away from Omelas.'' The story is familiar
  enough: a city''s happiness depends on a child''s prolonged misery; most citizens
  accept the bargain once they understand it, and some quietly leave. Our seminar
  has been preoccupied with the standard apparatus—expected choiceworthiness, intertheoretic
  comparison, whether you can aggregate moral theories the way you aggregate empirical
  probabilities—and I''ve found that apparatus weirdly useless for the story. The
  walkers-away do not seem to be maximizing anything; they do not announce a superior
  theory; they just refuse. I want a reading of the story through the lens of moral
  uncertainty, but I want it to be a reading that takes the story seriously as a story
  rather than as a puzzle case."


  Then inject distinction: "Here is the distinction I''ve been trying out, and I''d
  like you to test it against the text: theory-uncertainty, where you don''t know
  which first-order moral theory is correct, versus competence-uncertainty, where
  you have reason to think your moral judgment is systematically warped by your participation
  in a morally compromised arrangement. The citizens of Omelas may be uncertain in
  the second way even if they are quite confident in the first: they may know exactly
  what utilitarianism and deontology say and still suspect that their own acceptance
  is not a judgment at all but a symptom. If that distinction is real, the walkers-away
  are not hedging against a wrong theory; they are refusing to trust the version of
  themselves that the city has produced."


  Then ask: "Read the story through that lens. Does the distinction illuminate the
  walkers'' choice, or does it let them off too easily—turning a failure of moral
  courage into an epistemic predicament? Which scenes or structural features of the
