  Scenario: The asker chairs (or sits on) a state sentencing commission. The commission
  is revising its guidelines. A defense bar petition asks for a new mitigating factor:
  "substantially diminished free will," supported by a neurobiologist''s report that
  the defendant''s actions were "causally determined by childhood lead exposure and
  adverse childhood experiences." The commission must decide whether to adopt the
  factor. The philosophical issue: varieties of free will worth wanting. The memo
  should recommend a decision: e.g., reject a generic "determinism" mitigating factor,
  but adopt a narrower "reason-responsiveness deficit" factor. The reasoning: compatibilist
  free will worth wanting is not ultimate origination but the capacity for rational
  self-control, responsiveness to reasons, and identification with one''s actions.
  Generic determinism is universal and therefore cannot distinguish defendants; it
  would swamp the system. But specific deficits in reason-responsiveness (e.g., severe
  impulse-control disorder, psychosis, intellectual disability) can be relevant. The
  strongest consideration on the losing side: if you take libertarian free will seriously,
  no one deserves punishment; but the commission cannot build a sentencing system
  on a metaphysical thesis that would abolish desert entirely. Or: the defense''s
  worry that the criminal justice system already ignores social determinants; a determinism
  discount might be a crude way to correct for that. The memo should engage that.


  To make it in the weeds, inject niche ideas:

  - The distinction between "basic desert" and "attributability" (from moral responsibility
  literature).

  - The distinction between "ultimate origination" and "reasons-responsiveness."

  - The "manipulation argument" and "the zygote argument" (maybe too niche? But we
  can explain briefly: if determinism undermines responsibility, it would also undermine
  responsibility for the manipulator, which is absurd; but if it doesn''t, then determinism
  per se is not the issue).

  - The "varieties of free will worth wanting" idea: the free will worth wanting is
  not the ability to have done otherwise in an absolute sense, but the ability to
  govern oneself through reasons, to be responsive to incentives, and to have second-order
  volitions.

  - The "causal history" vs. "current capacities" distinction: sentencing should focus
  on current capacities, not the causal history of the offense, because the law needs
  to predict future behavior and assign proportionate blame.

  - The "lead exposure" case: we can make it concrete: the defendant has a documented
  history of lead exposure, but no diagnosis of a reason-responsiveness deficit. The
  commission must decide whether to allow a generic "determinism" mitigation.


