  Draft:


  "I''m a staff software engineer at a company of roughly 250 engineers, and I chair
  the architecture review board that meets weekly. A recurring move in those meetings
  is the ''we''re locked in'' argument: someone proposes revisiting an old decision
  — our in-house build and configuration system, a data model chosen before we had
  a second product line, a proprietary messaging primitive that has leaked into every
  service — and the answer comes back that we are locked in, that the matter is settled,
  and that reopening it would be a waste of everyone''s time. I have no philosophy
  background, but I gather there is real work on path dependence, on whether an outcome
  was contingent or inevitable, and on what it even means to say history could have
  gone otherwise. I want that turned into something my board can run, not a summary
  of the literature.


  Please write me a decision procedure ..."


  Then: "The reason I want it is that ''we''re locked in'' seems to bundle at least
  four different claims: (1) we literally cannot change this; (2) we could change
  it but the cost is higher than the benefit; (3) the choice was the right one given
  what was knowable at the time, so there is nothing to relitigate; and (4) even if
  we had decided otherwise, we would have ended up here anyway, because something
  else would have pushed us. I suspect those have different implications and I keep
  seeing them used interchangeably. There is also a prior question I can''t answer
  on my own: a state that simply persists is not the same as a state we cannot leave,
  and showing that a decision was contingent is not the same as showing it was a mistake.
  I''d like the procedure to force those apart."


