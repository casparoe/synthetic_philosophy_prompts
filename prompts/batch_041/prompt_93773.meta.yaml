  Here is the feature. Suppose someone assembles a long series of estimates — killings,
  assaults, and the like — and reports that the rate has fallen by an order of magnitude.
  A critic objects that the series measures only a thin band of what violence is:
  it leaves out what states do to people who are not counted, what happens inside
  households, what deprivation and neglect amount to. The objection is not that the
  numbers are wrong but that the category is too narrow. What interests me is that
  the critic is usually right, and that the category has in fact widened over the
  very period whose trend is being measured. Things that were once not violence at
  all — corporal punishment in schools, coercion within marriage, cruelty to animals
  — are now violence, or near enough. So the instrument has been recalibrated, repeatedly,
  and always in the direction of the finding. And the recalibration is not opportunism:
  each widening is a genuine moral discovery and is defensible on its own. What unsettles
  me is the asymmetry. I cannot think of any corresponding pressure in the last few
  centuries to make the category contract, so the process that is supposed to be the
  subject matter of the measurement is also the process that sharpens it. It is as
  though the thermometer were designed by the fever.


  I have seen something that feels like the same shape elsewhere — a threshold for
  poverty that is redrawn as a society grows richer, so that the count can hold steady
  while the condition improves — and I do not know whether these are one phenomenon
  or two.


