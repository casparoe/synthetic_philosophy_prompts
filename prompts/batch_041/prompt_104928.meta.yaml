  Then describe essay:


  "My essay has three parts. In the first, I defend a lexical priority claim: when
  a creature is below a certain threshold of well-being—what I call the suffering
  floor—no amount of positive experience elsewhere can justify adding a further negative
  experience to that creature, or failing to remove one. The lexical priority is not
  absolute, however; it applies only to states below the floor. In the second part,
  I try to specify the floor. I argue that it should not be a fixed hedonic level,
  because adaptation and contrast effects shift what counts as a baseline. Instead,
  the floor is a dynamic band defined by the difference between a creature''s current
  affective state and its recent adaptive baseline, weighted by the duration and the
  degree to which the state disrupts the creature''s characteristic functioning. I
  give a thought experiment: a laboratory animal whose pain is caused by an experiment
  that also produces a large benefit for many humans; I argue that the lexical priority
  blocks the benefit-based justification below the floor, but not above it. In the
  third part, I defend commensurability above the floor: once the floor is cleared,
  pleasures and pains can be traded off on a single cardinal scale, and I propose
  that the exchange rate be set by a two-stage procedure, first a hypothetical insurance
  choice behind a veil of ignorance, then a lexical constraint that prevents the procedure
  from licensing a small number of severe pains for a large number of mild pleasures.
  I call the resulting view lexical threshold negative utilitarianism."


