  or so, on habit and on what they absorbed as children, but that behavior is coasting
  on a stock that is being spent, and the trust that lets strangers deal with one
  another is exactly that stock. The conclusion drawn from it is that a secular society
  can look healthy for a while but cannot generate or sustain trust on its own, because
  it has switched off the one thing that ever made anonymous strangers behave when
  nobody was looking.


