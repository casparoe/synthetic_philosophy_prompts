  Prompt:


  I am an undergraduate in a moral philosophy seminar that has spent the last few
  weeks on the ethics of suffering. Our current unit is on lexical threshold negative
  utilitarianism and the commensurability of pleasure and pain. The view we have been
  discussing is roughly this: there is a threshold of suffering—call it the threshold
  of the intolerable—such that any amount of suffering above that threshold cannot
  be outweighed by any quantity of positive utility, however large; below the threshold,
  ordinary aggregative reasoning is permitted. The standard objection is that this
  position is unstable. If pleasures and pains are commensurable on a single hedonic
  scale, as Bentham''s hedonic calculus seems to assume, then no finite amount of
  suffering can be lexically protected, because a sufficiently large quantity of pleasure
  will always outweigh it. If, on the other hand, the threshold is a genuine discontinuity
  in value, then the view seems to abandon commensurability and perhaps collapses
  into a deontological side-constraint that Bentham would have rejected.


  My assignment is to reconstruct how a historical philosopher would have responded
  to a debate they never encountered. I have chosen Bentham. I would like you to predict,
  as carefully as you can, what position Bentham would take on lexical threshold negative
  utilitarianism, and to distinguish what follows from his actual commitments from
  what would be anachronistic.


  In particular, I would like you to address the following. First, would Bentham accept
  any lexical threshold at all, or would his commitment to the greatest happiness
  principle and the commensurability of pleasures and pains commit him to rejecting
  it as incoherent? Second, if he could accept a threshold, would he treat it as an
  axiological discontinuity—a point at which the value of suffering becomes lexically
  prior to any amount of pleasure—or merely as a decision-theoretic rule for agents
  who cannot reliably compare vast quantities of utility? Third, how would he respond
  to the objection that lexical thresholds license the conclusion that a world with
  any amount of extreme suffering is worse than a world with no extreme suffering
  but an arbitrarily large amount of mild suffering? Fourth, what would he make of
  the distinction, which my professor has been calling "threshold lexicality with
  a deontic floor," between a threshold that is a natural fact about hedonic intensity
  and a threshold that is a normative stipulation forbidding certain trade-offs even
  when the hedonic calculus would permit them? Fifth, would Bentham''s hedonic calculus
  have the resources to represent a threshold without abandoning the single-scale
  picture, for example by treating the threshold as a limit case, a discontinuity,
  or a second-order rule? Finally, how would he handle the related distinction between
  experienced utility and remembered or anticipated utility, and would that distinction
  make him more or less sympathetic to lexical thresholds?


  I am not looking for a bibliography or for citations to secondary literature; I
  want a reasoned reconstruction. Please be explicit about where you are extrapolating
  from Bentham''s known commitments, where you are making a judgment call, and where
  the historical Bentham might simply have had no determinate view. If you think the
  most defensible reconstruction is that Bentham would reject lexical threshold negative
  utilitarianism, say so and explain what he would put in its place.


