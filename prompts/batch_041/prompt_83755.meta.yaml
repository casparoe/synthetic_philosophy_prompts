  So the chain:

  (1) A has a reason to φ only if a sound deliberative route leads from A''s existing
  motivational set to a motivation to φ.

  (2) Sound deliberation corrects factual error, logical error, and means–end incoherence;
  it doesn''t manufacture new terminal ends.

  (3) Consider T, who knows all the facts about the pain he causes, is perfectly coherent,
  and is not moved by it at all — he has no terminal desire that his cruelty frustrates
  (he doesn''t care about others, his reputation, or being consistent with his own
  professed values).

  (4) There''s no sound deliberative route from T''s set to a motivation to stop.
  (By (2).)

  (5) So T has no reason to stop. (By (1).)

  (6) If T has no reason to stop, then nothing anyone says to T can be an argument
  that he should stop; it can only be an attempt to install a new desire in him. Moral
  criticism of T is a form of engineering.

  (7) That''s too much — and it''s not just about monsters. Run the same argument
  for the person who is indifferent to her own future: she has no reason to care what
