  Let''s think about the actual content of Quine''s metaethics so the prompt is accurate:


  Quine''s "On the Nature of Moral Values" (1978, in "Theories and Things" 1981).
  Main claims: moral judgments, unlike scientific ones, are not "objective" in the
  sense of being answerable to evidence; the difference between science and ethics
  is that science is a matter of "belief" answerable to sensory evidence, while ethics
  is a matter of "values" that are ends, not beliefs; but he doesn''t want a sharp
  fact/value dichotomy because he''s holistic — actually he says that ethics is "methodologically"
  different, not that it''s non-cognitive in the emotivist sense; he notes that normative
  ethics lacks the "checkpoints" of observation; he says the "pull" of moral values
  is not reducible to description; he suggests that moral disagreements are like disagreements
  over ends and that we can''t adjudicate them by evidence; he allows that moral norms
  can be criticized internally (inconsistency, consequences) but not from outside.
  Also in "Two Dogmas" and elsewhere, he''s a holist. Also his "The Ways of Paradox"
  etc. Also, importantly, Quine''s "Reply to Morton White" or his "Comment on White"
  — Morton White argued Quine''s holism makes value judgments just as revisable as
  beliefs (the "duhemian" argument about ethics). And Quine''s response to White (in
  the "Words and Objections" volume? Actually Morton White''s "Value and Objectivity:
  A Comment on Quine" and Quine''s reply "Replies" — Quine''s answer was something
  like "the values are ends, not beliefs"). Also relevant: Quine''s "naturalized epistemology"
  and the question of whether epistemology can be normative.


  Key open questions in this area (which a good answer might give):

  1. Is Quine''s distinction between the "normative" and the "descriptive" in ethics
  consistent with his holism/rejection of analytic-synthetic? If all beliefs face
  the tribunal of experience as a corporate body, why do moral "values" escape?

  2. Does Quine''s quietism about normative ethics leave his own naturalized epistemology
  normative-free? If he allows "norms of inquiry" (e.g., "don''t multiply hypotheses",
  "prefer simplicity", "maximize predictive power"), those look like values — so either
  ethics has more room than he says, or epistemology is as non-normative as ethics.

  3. The "ends vs. beliefs" distinction: is it a robust distinction or does it just
  relocate the fact/value gap?

