  Draft:


  "I''m a science journalist — ten years on the neuroscience and animal-cognition
  beat — applying for a nine-month fellowship that funds one substantial independent
  project, and I need a two-page proposal. The project I want to pitch is a conceptual
  one, and I''d like you to write the proposal, not the eventual piece.


  My half-formed idea. When people argue that brain size is morally relevant, they
  usually do it through a chain: some anatomical measure stands for cognitive capacity,
  which stands for moral status. I want to pull the chain apart into three separate
  roles an anatomical measure might play, and ask whether any of them is defensible.
  First, an inclusion criterion: having a brain of at least some size or complexity
  is what puts a being in the class of things whose interests count at all. Second,
  a weighting criterion: bigger or more complex brains ground stronger or more extensive
  moral claims — a view that implies moral status comes in degrees. Third, an epistemic
  role: the measure is not itself morally relevant but is a cheap proxy for whatever
  is, and we are permitted to use it only when we can say how it may misfire. I suspect
  the third role is the only one anyone should want, and that it is much harder to
  defend than it looks, because the candidate measures — absolute mass, size relative
  to body, neuron count, neuron density, connectivity — rank species differently,
  so the proxy''s verdict depends on a choice that is rarely argued for.


  What I need from you is the proposal: state the question precisely enough that it
