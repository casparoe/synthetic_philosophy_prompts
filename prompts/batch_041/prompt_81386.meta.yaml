  signals, winner and loser effects, the hawk-dove game, that bourgeois strategy where
  the ESS is ''be aggressive if you''re the owner, back off if you''re the intruder''
  even though ownership is an arbitrary asymmetry, reconciliation after conflict,
  coalitions, and the economics of who pays the costs of a fight. Go claim by claim
  and mark each one: translates cleanly, translates only with distortion, or no counterpart
  in my vocabulary at all.


  Two things I''d especially like you to press on, because they''re where my hunch
  either gets interesting or dies.


  First, the fight to the death. In every system I''ve studied, escalation is rare
  and lethal fights are rarer; animals settle with displays and the loser usually
  gets to keep living. Hegel seems to need the death-stakes -- the slave is the one
  who preferred life and servitude to death, and that''s supposedly what makes his
  position defective. Is that a modelling error on Hegel''s part, or is the biological
  version doing something different in kind? And what would the dialectic look like
  if it were rewritten so that escalation was conventionally capped, the way real
  contests are? Does it still work?


  Second, the hollowness. Hegel''s master is supposed to end up in a bad way, because
  the recognition he gets comes from someone he doesn''t recognize as an equal, so
  it doesn''t count -- and meanwhile he''s become the dependent one, since he needs
  the slave''s work and submission to keep being master. In my world, is there anything
  like that? The closest I can get is a dominant who depends on the tolerance or the
