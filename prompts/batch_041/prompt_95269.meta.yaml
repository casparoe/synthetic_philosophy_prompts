  Some years ago I came across an idea that I have not been able to put down. It was
  an imaginary setup: a vast arena, filled with an enormous number of identical little
  balls, all bouncing around according to simple mechanical rules. The balls themselves
  are mindless, but because of the way they are arranged and because of the rules
  they follow, there arise stable, recurring patterns in the churn. Some of these
  patterns are said to stand for other things, to carry information, to be symbols.
  The question that came with the setup was whether those symbols do any real pushing,
  or whether all the pushing is done by the balls and the symbol talk is just a convenient
  way of summarizing what the balls are up to. I have been turning this over in my
  head ever since, and I would like you to help me build a new case in the same spirit,
  but with the specifications I give below.


  The case should be concrete enough to describe in a paragraph or two. It must have
  a substrate that is fully deterministic and physically closed: no new forces, no
  quantum indeterminacy, no souls, no magic. The substrate should be something whose
  basic elements and rules are simple and fully specified, so that we can in principle
  compute what happens. Within that substrate there must be a higher-level pattern
  that is multiply realizable: the same pattern could be carried by different arrangements
  of the basic elements, and it is the pattern, not the particular arrangement, that
  we are interested in. The case must be one where a difference in the higher-level
  pattern produces a difference in the subsequent behavior of the substrate, and where
  we are tempted to say that the pattern itself is doing causal work rather than merely
  being a summary of the micro-level goings-on.


  After you have described the case, I want you to do several things. First, say what
  a deflationary physicalist would say about it: someone who holds that all the real
  causation is at the level of the basic elements and their rules, and that the higher-level
  pattern is at best a useful fiction. Second, say what a realist about higher-level
  causation would say: someone who holds that the pattern is a genuine cause because
  it makes a difference and because the difference it makes is robust across the different
  micro-arrangements that realize it. Third, and most importantly, identify exactly
  which feature of the case is doing the work in making the realist''s case. I want
  to know what would happen if that feature were removed or altered: does the case
  collapse back into a straightforward deflationary story, or does something else
