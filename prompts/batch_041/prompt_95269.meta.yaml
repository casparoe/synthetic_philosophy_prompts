  symbols can push the substrate around, or whether that way of talking is always
  going to be a shorthand for something else. So the case has to earn its verdict:
  it must not simply stipulate that the higher-level pattern has causal power, and
  it must not rely on our not knowing the micro-level details. The micro-level details
  should be fully available, and the case should still make us wonder.


