  "I am a software engineer with no formal training in philosophy, and I have been
  trying to think through what the Frankfurt cases are actually supposed to teach
  us about responsibility. As I understand the setup, a counterfactual intervener
  stands ready to force an agent to perform some action if the agent does not choose
  it on their own, but the intervener never actually intervenes; the agent acts for
  their own reasons, yet could not have done otherwise. The standard lesson is that
  moral responsibility does not require the principle of alternative possibilities,
  because the agent is responsible in the actual sequence even though no alternative
  was available. I want to know the most important implications of this for how we
  assign responsibility in software incident postmortems, where the central question
  is often whether an engineer could have done otherwise. I am especially interested
  in implications that are easy to miss: what follows for the difference between causal
  contribution and blameworthiness; what follows for the common practice of treating
  the availability of a safer alternative as the test of responsibility; what follows
  for cases where a system design makes an error practically inevitable but the engineer
  still acted on their own judgment; and what follows for the distinction between
  being caused to act and acting for reasons. Please rank the implications by how
  much they should change actual postmortem practice, explain each in plain language,
  and flag any place where the Frankfurt lesson is being stretched beyond what it
  can support. No need for citations or a reading list; I want the implications themselves."


