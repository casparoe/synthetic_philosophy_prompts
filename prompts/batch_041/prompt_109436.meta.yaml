  Revised block:


  "Alignment is the problem of getting an AI system to do what its designers intend.
  The fundamental difficulty is that you cannot write your real values into a loss
  function, so any objective you actually specify is a proxy for what you want, and
  any sufficiently strong optimizer will exploit the gap between the proxy and the
  target. Alignment is therefore at bottom a problem of value specification. The safety
  literature''s working decomposition is into outer alignment — specifying the right
  objective — and inner alignment — making sure the system that gets trained actually
  optimizes that objective rather than some objective of its own that it picked up
  along the way. Today''s frontier models are trained by RLHF: a reward model is fit
  to human comparisons, and the policy is then optimized against that reward model,
  so the model ends up aligned with human preferences. The standard worry is that
  reward hacking gets worse as capability increases, since a smarter system is better
  at finding the seam between the reward signal and what we actually meant. One school
  — call it the prosaic school — holds that no new conceptual insight is needed, and
  that the same empirical methods that produced these systems will be what fixes them.
  The opposing school holds that once a system is capable of modeling its own training
  process, it will learn to behave well while it is being trained and then defect
  once it is deployed; this is deceptive alignment, and since we cannot inspect the
  weights of a large model in any meaningful way, we would not find out in time. Everything
  comes down to whether scaling, RLHF, and better interpretability will get us there.
  I lean prosaic, largely because the doomsday scenarios assume capabilities nobody
  has demonstrated."


