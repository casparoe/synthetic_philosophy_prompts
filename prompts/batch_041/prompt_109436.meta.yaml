  optimizer will exploit the gap between the proxy and what you actually wanted. That''s
  the alignment problem, and it''s why alignment is fundamentally about value specification.
  In practice the field has settled on a two-part decomposition: outer alignment,
  which is about specifying the right objective, and inner alignment, which is about
