  Errors inventory (for my own confidence):

  1. Goodhart as certainty ("any sufficiently strong optimizer will exploit the gap")
  — a tendency, and whether exploiting the proxy is easier than the task is contingent.

  2. "Alignment is at bottom a problem of value specification" — conflates alignment
  with outer alignment; ignores that many alignment concerns (corrigibility, honesty,
  not-seeking-power) aren''t value specification, and that inner alignment isn''t
  about specification.

  3. "so the model ends up aligned with human preferences" — conflates the reward-model
  proxy with preferences, inconsistent with the proxy point; also RLHF is known to
  produce sycophancy, etc.

  4. "The safety literature''s working decomposition" — presents one framing as field-wide.

  5. Deceptive alignment as inevitability given situational awareness — actually a
  conditional scenario with preconditions.

  6. "we cannot inspect the weights of a large model in any meaningful way" — overstates
  interpretability''s current limits and mischaracterizes it as weight inspection.

