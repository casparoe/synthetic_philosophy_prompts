  as if they were rules in a maximizing system -- rules that tell an agent what to
  do with the world''s stock of violations. But constraints are not about the world''s
  stock. They are about the agent''s jurisdiction. A constraint marks the boundary
  of what an agent is authorized to do in the name of the good. It does not say ''never
  let a violation happen''; it says ''never be the one who does this.'' So when I
  refuse to violate one to prevent five, I am not saying that one violation is worse
  than five. I am saying that the five are not mine to prevent in that way. The numbers
  still matter, but they matter for other agents, or for me in other roles -- as a
  legislator, a rescuer, a planner -- not as the bearer of this constraint.


