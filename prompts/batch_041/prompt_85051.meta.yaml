  mental properties are idle. The non-reductionists in the group accept closure and
  supervenience too, but deny that exclusion follows; they insist that a higher-level
  property can be a genuine difference-maker for an effect even when its realiser
  is by itself sufficient for that effect, and they suspect that the exclusionist
  is smuggling in a picture of causation as a transfer of power from cause to effect
  that no working science requires. After a year of this, I have come to think that
  a good part of the stand-off is terminological, and that we could settle the rest
