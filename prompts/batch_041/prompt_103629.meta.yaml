  Draft:


  "A friend and I have been arguing for weeks about whether there is always a fact
  of the matter about what someone consciously experienced. His position is that for
  any perceptual episode there must be a determinate answer to the question what the
  person saw or heard at that moment, even if no test can recover it; my position,
  following Dennett''s multiple drafts model, is that in certain cases the question
  is simply ill-posed, because there is no single place or time in the brain where
  the content is presented to a viewer, only multiple concurrent and successive revisions
  that leave their traces in later reports. We keep talking past each other because
  we both reach for the same stock examples — the usual colour-phi and masking cases,
  the usual readiness-potential findings — and each of us can predict what the other
  will say about them.


  I''d like you to construct a fresh case that forces the issue. Build a pair of scenarios
  that differ in exactly one respect: in the first, the subject''s later report is
  produced by a revision that occurs after a content was genuinely experienced; in
  the second, the very same report is produced by a substitution that occurs before
  anything of the original was experienced. [Then constraints.]


  Constraints:

  - no laboratory apparatus, no brain stimulation, no exotic physics; the manipulation
  must be something that could befall an ordinary adult in ordinary life;

  - no colour phi, no metacontrast masking, no Libet-style readiness potentials, no
  split-brain cases, no blindsight — I want a case neither of us has seen before;

  - the two scenarios must be indistinguishable in principle: every report the subject
  can give, every judgement they can make about their own experience, and every measurement
  anyone could take must come out the same;

  - you may not rig the verdicts by stipulating in the scenario that one subject did
  and the other did not experience the content. The divergence has to fall out of
  what each theory says about a case described in neutral terms.


  Then: state exactly what the Cartesian theater picture is committed to in your pair
  (which fact about which moment it must regard as determinate, and why it cannot
  simply decline the question), and what the multiple drafts model says instead; show
  that the two verdicts differ; identify the single feature of your construction that
  does the work and say what happens to the case if you remove it; and say how a defender
  of the theater would attack the case — the strongest reply available, not a straw
  man.


  Finally, give me your own verdict, committed: does the pair really show that the
