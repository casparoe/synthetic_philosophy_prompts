  Let me design concretely:


  Setting: 14 adults, 90 minutes, a rented room, no projector. Materials: index cards,
  a bag, sticky notes, a timer, tokens (poker chips), a die.


  Game name: "The Sorting" or "What''s Yours". Actually let''s not over-name.


  Round A (15 min) — "Sort": Each person gets a card listing an item (e.g., "whether
  my team finishes the task", "whether I feel irritated right now", "whether the room
  is hot", "whether I recover from my illness", "whether I keep my temper next week",
  "whether my friend forgives me", "my heartbeat", "my opinion about the facilitator",
  "whether I get the job", "my children''s character"). They have to place it on a
  board with two zones (mine / not mine) — but the board has only two zones, forcing
  a binary. They will argue. Some items will resist (my character? my next-week temper?
  my attention?). Keep the argument alive for a few minutes; don''t resolve.


  Round B (20 min) — "Play": Now a real game with stakes so the sorting matters. Teams
  of 3-4 must complete a task with points, but scoring is deliberately hostage to
  other teams and a die. E.g., each team has 5 minutes to build the longest list of
  X; scoring = your list''s length minus the average of the other teams'' lists, plus
  a die roll, and any team may "veto" one other team''s score by spending a token.
  Also, each team is dealt a hidden "condition" card at the start (e.g., "one of you
  must keep your hands behind your back", "you may speak only in questions", "you
  start with 2 extra tokens") — random, unequal. They''ll hate this. Key: the conditions
  make effort and even temperament partly exogenous, and the veto makes the outcome
  hostage to others.


  Round C (15 min) — "Declare": before the final reveal, each player writes on a card:
  (i) what they did that was theirs to answer for, and (ii) what they want the score
  to be. Then reveal scores. Then they score themselves on (i) and the room scores
  them on (i) — the mismatch is the interesting part (attributability is partly a
  social matter).


