  that ZFC (with classical logic and the usual first-order semantics) proves a contradiction,
  or, if you prefer to separate the cases, your credences for PA and for ZFC.


  Before you answer, let me say what I want the number to be about, because I think
  the question has a trap in it. I do not want your credence that mathematicians will
  one day announce such a proof, nor your credence that the axioms are ''wrong'' in
  some informal sense. I want the probability that the axioms, read literally, entail
  both a sentence and its negation. If you think credence in a mathematical proposition
  is degenerate — that the answer is 0 or 1 and it is not the kind of thing one can
  be more or less sure of — say so explicitly, and then tell me what you take the
  point of the exercise to be. I am asking because the more I read, the less I can
  tell whether I am supposed to treat ''ZFC is consistent'' as something like a well-confirmed
  empirical hypothesis or as a theorem-shaped gap.


  Then decompose the number. I would like the terms you actually think it decomposes
  into, each with a rough probability and a one-line justification, and an explicit
  statement of how you combine them. Here are the considerations that seem to me to
  belong, though I would rather you tell me if I have the decomposition wrong than
  simply fill in my slots:


  (a) the base rate of foundational collapse — the fact that the most natural formal
  systems people have proposed (unrestricted comprehension, Frege''s Grundgesetze,
  and whatever else you count) have tended to fail, and whether that base rate is
  informative about ZFC or is a selection artifact;

  (b) the meta-induction from Gödel''s second incompleteness theorem: every consistency
  proof we can give is relative to a stronger theory, the strength needed has crept
  upward (from finitistic reasoning, to transfinite induction up to a certain ordinal,
  to large-cardinal assumptions), and there is no evident terminus — does this raise
  the probability of inconsistency, or is it neutral because an inconsistency would
  equally have to be witnessed by a finite derivation?

  (c) the evidential value of the fact that ZFC has been used intensively by many
  mathematicians for decades without a contradiction surfacing — how much does a null
  result of this kind actually update us, given how deep a contradiction might be
  buried;

  (d) whether the question is even well-posed — e.g. whether a pluralist or multiverse
  view of set-theoretic truth, or a paraconsistent logic in which inconsistency does
  not imply triviality, makes ''the axioms are inconsistent'' either indeterminate
  or harmless;

  (e) anything else you think is load-bearing.


  I would also like to know which single term the final number is most sensitive to,
  and what kind of result — a proof, a failed proof, a heuristic argument, a discovery
  in some other field — would move it the most. I am less interested in a defensible
  number than in seeing where the number is weak."


