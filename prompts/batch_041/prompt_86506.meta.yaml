  Cogito/Archimedes audit:

  Mapping: Archimedes (the doubter), the fixed point (the cogito, "I think, I exist"),
  the lever (deduction/method), the earth (the whole edifice of received opinion /
  the world), the load to be moved (the reconstruction of knowledge), the requirement
  that the point be fixed and immovable (indubitability), the demand "only one point"
  (the cogito alone suffices).

  Disanalogies: (a) Archimedes'' point is a point in the physical world, independent
  of the lever and the earth; the cogito is a proposition/act inside the system it
  is supposed to move — the doubter cannot occupy a standpoint outside his own thoughts.
  (b) A fulcrum''s immovability is causal, a matter of the earth''s rigidity; the
  cogito''s immovability is logical/reflexive (its denial is self-defeating), a different
  kind of "cannot be moved." (c) Leverage requires the lever and the earth to already
  be in place — the analogy presupposes an available machine (a method, a logic, a
  world of objects) that the meditator hasn''t yet secured; the cogito alone gives
  no lever. So "one point suffices" is precisely what the analogy can''t show. (d)
  A point supports only under load and is not itself a foundation; if the analogy
  is taken seriously, the cogito is a *fulcrum for an argument*, not a *foundation
  for a system* — the static-foundation picture is smuggled in, not delivered. (e)
  The Archimedes story is a boast about a hypothetical (he never moved the earth);
  the analogy imports "given the point, the rest follows" which is exactly the doubtful
  step. (f) Also: the lever moves the earth *as a whole, from outside*; the cogito
  can only be applied from the first person — so the analogy hides the problem of
  other minds and of intersubjective science: no third party can occupy my point.
  And the point is momentary — a fulcrum is used in an act, not possessed as property,
  which suggests the cogito''s guarantee lasts only as long as the act of thinking
  (this is the "injected" twist).

  Conclusion to audit: "the cogito gives a foundation on which the sciences can be
  rebuilt, because one immovable point is enough." Does it survive? Arguably only
  a weaker conclusion: the cogito shows the impossibility of universal doubt / that
  doubting is self-undermining; it doesn''t supply a foundation in the architectural
  sense. Good — the audit can say the analogy was carrying the conclusion ("one point
  suffices") and that a better analogy is... something like: the cogito is less like
  a foundation stone and more like the fact that a rule can''t be used to abolish
  itself, or like a proof that a certain move is illegal in a game; or "the cogito
  is like the discovery that a sentence can''t be used to deny itself" — a reflexive
  constraint rather than a support. Also could suggest: the cogito is more like a
  *ledge you stand on while you''re standing on it*? Hmm, better: it''s like the fact
  that the act of doubting cannot be doubted — a performative limit. Good.


