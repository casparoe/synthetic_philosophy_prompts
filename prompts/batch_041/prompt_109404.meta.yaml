  Potential prompt:


  I am a software engineer with no formal philosophy background, but I have been asked
  to contribute one essay question to an upper-level undergraduate metaphysics examination
  on the identity of indiscernibles and Black''s spheres. I want a question that cannot
  be answered by reciting the standard two-spheres setup and the standard replies
  about haecceities, spatial relations, or the difference between numerical and qualitative
  identity. To make it harder to regurgitate, I would like the question to use an
  analogy from software engineering: two objects in an object-oriented programme that
  are indistinguishable through every public method available to client code, yet
  are distinct references, so that a test for reference equality returns false. The
  question should force students to ask whether the reference itself is a property,
  whether the analogy vindicates or undermines the identity of indiscernibles, and
  whether the possibility of such objects bears on whether Black''s spheres are genuinely
  possible in a world with no external reference frame. It should also make them distinguish
  the principle that indiscernibles are identical from the principle that identicals
  are indiscernible, and say which of those the software case actually illustrates.


