  Let''s draft:


  I have a set of verdicts about when pain is bad for the person having it, and I
  want to know what principle, if any, underlies them. In each case I am asking about
  the badness of the pain itself, not the badness of its cause or its consequences,
  except where those seem to infect the pain.


  1. A migraine that is intense, unpleasant, and hard to ignore is bad, and bad roughly
  in proportion to how much it hurts and how much it monopolizes attention.


  2. In pain asymbolia, a person can report a distinct pain sensation—sharp, burning,
  located in a limb—while denying that it hurts in the way that makes them want it
  to stop. I think the pain is still bad for them, though less bad than the migraine.
  This is the verdict I find hardest to square with the others.


  3. Post-surgical soreness that the person welcomes as evidence of healing is less
  bad, perhaps not bad at all, even though the sensory quality is similar to pain
  they would otherwise dread.


  4. A mild ache that persists for years is worse than a sharp pain that lasts ten
  seconds, even if the sharp pain is more intense at its peak.


  5. Pain that a doctor dismisses as imaginary, but that the person feels just as
  vividly, is just as bad as pain with an obvious physical cause.


  6. The burning of a hard workout, which the athlete endorses and would not remove
  if offered, is not bad for them in the moment, or at least not bad in the way that
  a headache is.


  7. A pain that is intensely disliked only because the person falsely believes it
  signals a fatal illness is less bad once the belief is corrected, even if the sensation
  is unchanged.


  8. A pain that is felt in a dream and forgotten on waking is bad while it lasts,
  but I am unsure whether it is bad for the dreamer''s life at all.


  My tentative principle is that a pain is bad for someone just to the extent that
  they dislike it, and that the sensory intensity matters only through the dislike
  it produces. That principle seems to get cases 1, 3, 4, 6, and 7. But it makes case
  2 come out not bad, which I resist, and it makes case 8 come out bad only while
  the dislike lasts, which may be right. It also seems to make case 5 depend on whether
  the person dislikes being dismissed, which is not what I meant.


  Can you state the principle or principles that best capture these verdicts? If no
  single principle does, give the candidates, say which verdict each saves and which
  it overturns, and explain the trade-off. Then tell me what your preferred principle
  implies about a case I have not listed: a pain that the person sincerely says they
  do not dislike, but that still makes them flinch, withdraw, and avoid the stimulus,
  and that they later remember as having been awful. Finally, say honestly which of
  my verdicts cannot be accommodated by your preferred principle.


