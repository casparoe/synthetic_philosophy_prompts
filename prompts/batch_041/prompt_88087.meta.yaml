  use of the app as consent to train models on de-identified session notes; a research
  partnership in which patients are approached in a waiting room and told that declining
  may affect their standing in a care program; and a one-time consent to future research
  that is deliberately broad. For each, tell me what the procedure says, where it
  is uncertain, and what evidence would move the decision. I also want one case where
  the procedure yields an answer I will not like, and a candid account of what the
  procedure cannot settle. Please keep it operational: the output should be something
  I can paste into a design doc and defend in a review, not an essay about autonomy.


