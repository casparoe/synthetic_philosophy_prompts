  are about to ship a feature that depends on someone''s consent. The decisions recur
  at least monthly: a new data use, a new research partner, a change to an existing
  policy, a request to re-use data for a purpose nobody contemplated when it was collected.
  The stakes are high, the users are often distressed or unwell, and the people who
  sign off are a product manager, a privacy counsel who is not always available, and
  me. I need the procedure to be honest about which steps are genuine tests and which
  are judgment calls that cannot be eliminated.


  Please ground the procedure in what the philosophy of consent actually says, rather
  than in compliance folklore, and translate it into something a practitioner without
  the theory can follow. I would like the procedure to run as a sequence of questions,
  with a clear account of what counts as a sufficient answer at each step, where the
  sequence terminates in a no, and where it must be handed to a human because the
  question is about values rather than facts. It should treat scope, specificity,
  time, and revocability as first-class, not as afterthoughts, and it should distinguish
  deception, coercion, and the subtler case of manipulation or undue influence, including
  the difference between a threat and an offer that merely makes refusal costly. It
  should also say how to handle competence when the person is an adult patient with
  a fluctuating condition, and when the person is an employee or a contractor whose
  livelihood may depend on saying yes.


