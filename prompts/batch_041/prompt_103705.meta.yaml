  Prompt structure:

  - Name the episode: the US decision to drop atomic bombs on Hiroshima and Nagasaki.

  - Name the theory/lens: the ethics/decision theory of choice under deep uncertainty
  — specifically, distinguish "risk" (known probabilities) from "uncertainty" (unknown),
  and consider several decision rules: expected-value maximization, maximin, maximax,
  and a deontological/precautionary "lexical" constraint. Also the ex ante vs. ex
  post perspective.

  - Ask for: (1) mapping the decision as the actors faced it — who the decision-maker,
  what the options, what the payoffs, what was known/unknown; (2) what each decision
  rule prescribes; (3) which features of the episode the framework explains and which
  it misses; (4) what the episode shows about the framework (does it favor one rule,
  or reveal that the framework is ill-suited to such decisions?); (5) where the theory
  is silent.

  - Inject a fresh twist: the asker notes that the standard debate disputes the counterfactuals
  (would Japan have surrendered without the bombs?) and asks whether the *decision-rule*
  question can be settled independently of the counterfactual dispute — i.e., is the
  disagreement really about facts or about the right decision rule?

  - Epistemic request: committed response — take a definite position on whether the
  bombings were justified under the best decision rule, and give reasons.


  Also, I should perhaps include the novel concept explicitly so the model doesn''t
