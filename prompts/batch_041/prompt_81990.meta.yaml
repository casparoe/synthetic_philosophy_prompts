  Plan the final prompt structure:


  Formal, polished, requests British English, names the work and the philosophical
  lens, asks for a reading faithful in both directions, asks for specific scenes,
  asks what the work shows the philosophy misses, mentions the Halden contrast and
  the American model, warns against reducing the story to an illustration, asks for
