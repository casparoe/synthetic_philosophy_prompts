  Draft:


  "I teach a seminar on the philosophy of punishment, and I want to use Kafka''s In
  the Penal Colony as the centrepiece of a session on the contrast between retributive,
  expressive and rehabilitative justifications of punishment. The story gives me an
  apparatus whose entire purpose is to inscribe the sentence on the condemned man''s
  body — an inscription he is not told in advance, and which the officer describes
  as producing a kind of enlightenment in him over the twelve hours before he dies
  — and an officer who executes himself when the apparatus fails. I want a reading
  of the story that takes both the fiction and the theory seriously..."


  Then: "the theory" — communicative theories (punishment as a message addressed to
  the offender, aiming at his understanding and reform, and requiring that he be treated
  as a rational agent who can hear the message), moral education theories (punishment
  as a way of teaching the offender the moral truth of what he did, aimed at reconciliation
  rather than suffering), expressive theories (punishment''s hard treatment as the
  vehicle for society''s condemnation, with the "hard treatment" doing the work of
  expressing censure rather than merely deterring).


  Then: "the contrast" — Halden and the Norwegian model: normalisation, the import
  model (health, education, welfare services delivered by outside agencies rather
  than by the prison), dynamic security, unarmed guards who interact with prisoners,
  architecture that mimics ordinary life, and the official self-understanding that
  the sentence is the deprivation of liberty and nothing more, with the prison''s
  task being to return the prisoner to society as a neighbour. And American mass incarceration:
  the actuarial/risk-management orientation (the new penology) in which neither censure
  nor reform is the organising aim, only the management of aggregated risk categories,
  supermax isolation, etc.


  Then questions: Does Kafka''s apparatus expose something about the communicative/moral-education
  ideal that its humane defenders would rather not see — that the offender''s understanding
  is not required for the message to be delivered, and that the message can be inscribed
  by force? Or is Kafka''s machine the reductio of expressivism (condemnation as an
  end in itself, with no addressee)? Where does the story resist a rehabilitation
  reading — the officer''s devotion, the condemned man''s blankness, the Explorer''s
  refusal to intervene? Which scenes should I point the seminar at?


  Also ask what the story adds to the debate that argument alone doesn''t: e.g., the
