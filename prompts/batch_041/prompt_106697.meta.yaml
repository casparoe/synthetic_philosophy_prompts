  is last and then remembers their place; the queue is virtual and maintained by mutual
  recognition. The visitor, who comes from a city where buses are boarded in a free-for-all,
  walked straight to the doors on three occasions and boarded before students who
  had been waiting. Two local students have filed complaints under the conduct code''s
  provision on ''disorderly or disrespectful behaviour''. The visitor says he did
  not know the convention, that no one told him, and that he was not trying to take
  anyone''s place. The panel must decide whether to impose a sanction, dismiss the
  complaint, or take some other course. I need a short written opinion I can circulate
  before the hearing. It should recommend a concrete course of action with a time
