  a direct objectification of the Will itself—the blind, striving essence of reality—and
  that melody is the highest form in which that Will becomes audible. Music, on this
  view, is independent of concepts and of the world of representation; it expresses
  not the composer''s feelings or the listener''s, but the inner nature of the world.
  Whiplash, by contrast, seems to present music as a contest of wills: the will to
  greatness, the will to dominate, the will to endure pain. It is also jazz, improvised
  and embodied, not the concert music Schopenhauer had in mind. Does the film dramatise
  Schopenhauer''s metaphysics of music, or does it refute it by showing music embedded
  in the very world of representation, ego, and desire that Schopenhauer says it transcends?
  What should I make of the film''s focus on rhythm rather than melody, given Schopenhauer''s
  claim that melody is the highest objectification of the Will? And what about the
  final scene, where the two men seem to communicate through the music after all their
  cruelty—is that a Schopenhauerian moment of the Will becoming audible, or is it
  just another power struggle? I want a reading that is faithful to both the film
  and the philosophy, that says where the film gets Schopenhauer right, where it resists
  him, and what it adds to the debate that argument alone does not.


