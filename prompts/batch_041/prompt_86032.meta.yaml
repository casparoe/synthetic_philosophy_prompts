  "I am not a philosopher, but I have been thinking about Schopenhauer''s account
  of music and about Miloš Forman''s film Amadeus, and I would like a reading of the
  film through that account. As I understand it, Schopenhauer holds that music is
  unlike the other arts: it does not copy the Ideas or the phenomenal world, but is
  a direct objectification of the Will itself, the blind inner essence of reality;
  melody is the highest form in which that Will becomes audible; and music is in some
  sense independent of concepts and of the world of representation. The film, by contrast,
  seems to make music a matter of divine grace and personal election: Salieri bargains
  with God for musical genius, God gives it to Mozart instead, and Salieri spends
  the rest of the film unable to forgive either of them. Does the film therefore dramatise
  Schopenhauer''s metaphysics of music, or does it quietly replace the impersonal
  Will with a personal God and turn music into a reward for a chosen soul? Where does
  the film''s own treatment of music resist the Schopenhauerian reading—especially
  in its heavy reliance on opera, on texted music, on music as a social career, and
  on the way it makes us hear Mozart through Salieri''s envious ears? Which scenes
  should I focus on, and what would a careful reading say the film gets right or wrong
  about the philosophy? I am not asking for a summary of either the film or Schopenhauer;
  I want a critical reading that is faithful in both directions, and that ends by
  saying what the film adds to the philosophical debate that argument alone does not."


