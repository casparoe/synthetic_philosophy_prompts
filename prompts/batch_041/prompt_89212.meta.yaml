  Draft:


  "After a career in the natural sciences I have spent the last several years reading
  philosophy, and I have arrived at a position I would like you to attack. I hold
  that ''life'' is not a natural kind and that there is no fact of the matter about
  which things are alive: the various criteria on offer — metabolic self-maintenance,
  self-reproduction, evolution by natural selection, thermodynamic self-organization
  — are each defensible stipulations that carve the same middle range of cases differently,
  and the boundary disputes (viruses, viroids, prions, plasmids, mitochondria, red
  blood cells, mules and other sterile hybrids, spores and other cryptobiotic states,
  computer viruses and self-replicating digital programs) are artefacts of which stipulation
  we happen to be using, not evidence of a hidden essence awaiting discovery.


  What would count against this? I want the defeaters sorted by how much they should
  move me, and I want you to be specific about the following. First, is there a discovery
  that would show ''life'' is a natural kind after all — and would it have to be a
  single property shared by everything we pre-theoretically call alive and absent
  from everything we do not, or would something weaker suffice? Second, how much does
  the comparison with ''water'' and ''gold'' help: on the causal theory of reference,
  a term''s extension is fixed by the stuff we originally pointed at and then handed
  over to empirical science, which is how we learned that water is H2O; why doesn''t
  the same move make ''life'' hostage to discovery, and if it does, what would the
  discovery look like? Third, do the institutional contexts where the concept has
  to do real work — planetary protection protocols, biosafety rules, patent law, the
  determination of death in medicine, environmental ethics — count for or against
  my view, given that they seem to demand a determinate answer rather than a menu
  of stipulations? Fourth, is there a stable, principled pattern in ordinary people''s
  verdicts on the borderline cases that my view cannot explain, and would such a pattern
  be evidence of a real joint in nature or merely of shared intuitions?


  Finally, tell me honestly whether my position is insulated: a conventionalist can
  always respond to an awkward case by saying that it belongs to a different concept.
  If that is the position''s fate, is that a defect of the position or of the question
  — and would I be better off saying that ''life'' is a cluster concept that is genuinely
  vague rather than one that is merely conventional? I would be most moved by a case
  in which the concept has to decide something and there is a plain fact of the matter
  about the answer."


