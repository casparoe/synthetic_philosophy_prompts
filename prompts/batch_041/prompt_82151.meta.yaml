  Suppose we could ask Descartes a question that only became askable in the twentieth
  century, and that he had to answer as a philosopher rather than as the defender
  of a system. The question concerns pain asymbolia. After damage to the insula and
  neighbouring parietal cortex, patients still detect and localize noxious stimuli,
  still call what they feel pain, and still rate its intensity as high — but they
  are not distressed by it, do not withdraw from it, and sometimes smile while it
  is being inflicted. Something similar has been reported after certain frontal operations,
  where patients go on detecting pain while ceasing to mind it. The sensation survives;
  the awfulness is subtracted.


  What would Descartes have made of such a patient? Two things in his own account
  look relevant, and I am not sure they can both survive the case. First, he treats
  pain as a confused mode of thought, instituted by the union of mind and body for
  the preservation of the body: the hurt is how the body''s interests get into the
  mind. Second, he already concedes that this institution can misfire, as with dropsy,
  where the thirst attached to a bodily state leads the patient to drink what will
  harm him, and he answers that objection by saying the senses were given for the
  preservation of life rather than for the truth. If the hurt is simply that institution
