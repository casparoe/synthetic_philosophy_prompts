  Prompt:


  I have been defending a package I call slot-theory and want a consistency audit
  before I put it in a paper. The commitments are:


  (1) Propositions are structured: the proposition that a loves b has a, b, and loving
  as constituents, and its structure mirrors the sentence that expresses it.

  (2) A relation is a constituent of a proposition in its own right, not merely a
  syncategorematic feature of the whole; when I say that a loves b, loving is one
  of the things the proposition is about.

  (3) What distinguishes a genuine proposition from a mere list of its constituents
  is the unity of the proposition, and this unity is not a further relation added
  to the constituents.

  (4) Bradley''s regress is a sound argument against any account that posits such
  a further unifying relation; once you add a relation to bind a and b, you need another
  relation to bind that relation to them, and so on.

  (5) Unity is supplied instead by the relation''s own unsaturated character: loving
  has argument places, and when those places are filled by a and b, the result is
  a proposition, not a heap. Filling is not a relation; it is what it is for a relation
  to have a slot occupied.

  (6) The same relation, loving, occurs in the propositions that a loves b and that
  b loves a; what differs is which argument place each object occupies.


  I''m aware these are meant to fit together, but I want to know whether they actually
  do. Which pairs are genuinely in tension, which only appear to be, and how severe
  is each tension? For the genuine ones, tell me what has to give and what the cheapest
  revision would cost. I would rather not abandon (4), but I don''t yet know which
  of the others is doing the real work.


