  of its own, yet it is what makes the warrant-conferring relation available for use.
  I argue that this occupies a space neither reliabilism nor evidentialism can describe,
  and that Nyāya''s requirement that a cognition be unsublated, abādhita, is a fourth
  condition of knowledge that gets right what the Gettier literature got wrong. Along
  the way I lean on two further Nyāya commitments: that inference has five members
