  \ in history: Ranke vs Carr vs Hayden White\n- Ayer on life after death\n- Housing,\
  \ zoning, NIMBYism: right to the city\n- Turing test and behavioural criteria for\
  \ mind\n- Chinese Room\n\nTypes: interview questions for a guest; audit of someone's\
  \ summary of a view; report verdicts on cases and ask what principle captures them.\n\
  \nThe \"verdicts on cases → principle\" type works well with... hmm. Objectivity\
  \ in history: give verdicts on whether various historical accounts are \"objective\"\
  /\"distorted\" — e.g., a history of the British Empire written by an imperial administrator,\
  \ a Holocaust denier's tract, a feminist history of the family, a quantitative cliometric\
  \ study, a nationalist textbook, a historian who writes with explicit moral outrage.\
  \ Which are legitimate histories? That's a nice reflective-equilibrium prompt. And\
  \ it can be injected with niche/new ideas: e.g., the asker mentions reading about\
  \ \"the view from nowhere\" — careful, that's Nagel. Could inject invented-ish framing\
  \ but the instructions say inject new/niche ideas into the prompt so models can't\
  \ regurgitate. E.g., the asker could propose a tentative principle of their own,\
  \ phrased in an idiosyncratic way — like \"objectivity is a property of the process\
  \ not the product\" or a principle in the style of a blog: \"a history is objective\
  \ to the degree that it would survive being read by the losers.\"\n\nHmm, but also\
  \ the Chinese Room could work with verdicts-on-cases: give verdicts on which systems\
  \ understand. E.g., Chinese Room, the whole system reply, a lookup table the size\
  \ of China, a chess computer, a dog, a corporation, a thermostat, a bilingual person\
  \ simulating the room, a giant neural net... and ask what principle captures them.\
  \ That's also good. But the Chinese Room is heavily memorised — though the instructions\
  \ say avoid super niche things LLMs won't have memorised; the Chinese Room is fine,\
  \ it's the opposite problem (too memorised). The idea is to inject novelty so the\
  \ answer isn't regurgitation. A verdicts-on-cases prompt is naturally non-regurgitative\
  \ because the model has to do reflective equilibrium on new cases.\n\nAyer on life\
  \ after death: Ayer's \"What I Believe\" and his famous near-death experience (he\
  \ wrote \"What I saw when I was dead\" in the Sunday Telegraph, 1988) where he claimed\
  \ to have seen a red light and two \"creatures\" responsible for the universe, and\
  \ said it weakened his atheism. Also his logical positivism: \"there is no surviving\
  \ of death\" — the claim that the concept of a person surviving death is unintelligible\
  \ because... Actually Ayer's argument: the notion of a person surviving bodily death\
  \ is incoherent because personal identity depends on bodily continuity (memory etc.).\
  \ He says the idea of a disembodied existence is not logically impossible but the\
  \ notion of a \"person\" without a body is problematic; and there's an issue about\
  \ what would count as evidence. Hmm — the \"verdicts on cases\" type could work\
  \ here: verdicts on which alleged survival scenarios are intelligible: reincarnation\
  \ with memories, a ghost, a resurrected body, a digital upload, a Boltzmann-brain-like\
  \ afterlife, a person who dies and wakes up in another body with all memories, a\
  \ person whose memories are duplicated in two bodies, etc. That's a nice identity-based\
  \ case set and Ayer's verificationism gives the principle: what would count as evidence\
  \ / identity criteria. Hmm, but Ayer's specific views on life after death: he argued\
  \ that the notion of surviving death is not unintelligible per se but that... Let\
  \ me recall: In \"The Concept of a Person\" (1963) and in \"What I Believe\", Ayer\
  \ discusses. He also said about his NDE that it \"slightly weakened\" his conviction\
  \ that death is the end.\n\nHmm. Actually the Ayer domain is risky because I'd need\
  \ to attribute specific views; and the prompt type \"verdicts on cases\" would mostly\
  \ be about the asker's verdicts, not Ayer's views. The domain just needs to be the\
  \ topic. Actually the domain frames the topic; the asker's verdicts are about cases\
  \ in that domain. That works.\n\nWhich combination is best? Let me consider the\
  \ \"audit of a summary\" type with \"objectivity in history\": a popular book summary\
  \ saying Ranke wanted historians to just report facts without interpretation, that\
  \ Carr showed objectivity is impossible because history is \"interpretation\", and\
  \ that White proved historians are just fiction writers. That's a nice audit prompt\
  \ — Ranke's \"wie es eigentlich gewesen\" is often mistranslated as \"how it actually\
  \ was\" when \"eigentlich\" can mean \"essentially\". And the common claim that\
  \ Ranke was a naive positivist is contested. Carr's \"history is a continuous process\
  \ of interaction between the historian and his facts\" — the \"unending dialogue\
  \ between the present and the past\". White's \"emplotment\", the claim that historians\
  \ impose literary form. Also White's own statement that he doesn't think history\
  \ is fiction — \"the distinction between fiction and history is not... \" Hmm, White\
  \ said in the preface to Metahistory... he distinguishes \"the historical past\"\
  \ from \"the practical past\" in his later work. Careful about quotes.\n\nThe hard\
  \ rule: never quote from memory; anything in quotation marks from a real text must\
