  \nAlso inject new ideas: the asker could cite a niche-ish idea: e.g., \"someone\
  \ on a forum called it the 'no-view-from-nowhere' problem\" hmm. Or the asker could\
  \ coin: \"I've been calling it the swap test: would you accept this book if the\
