  \ from a real text. But it's safer to minimise.\n\nNow which type can I \"combine\
  \ best\"? The instructions say pick whichever type I can combine best with a domain\
  \ and the additional instructions. The additional instructions: rationalist-blog\
  \ reader voice, casual, typo or two, ask for a committed response, British English.\n\
  \nThe \"verdicts → principle\" type is a great fit for rationalist-blog-reader voice\
