  Structure:

  - Paragraph 1: Persona and context. "After a career in experimental physics, I have
  spent the last few years auditing graduate seminars in philosophy, and this term
  I have been sitting in on a seminar on self-reference, formal epistemology, and
  self-trusting artificial agents. The instructor has asked me, as the resident scientist,
  to contribute one exam question for the final. I need the question, a model answer
  of roughly 800 words, and a marking scheme."

  - Paragraph 2: The domain and why standard recitation won''t do. Explain Löbian
  obstacle. "The students can all recite the standard result: if an agent''s reasoning
  is formalized in a consistent, recursively axiomatizable theory T that extends enough
  arithmetic, and the agent adopts the full reflection schema—for every sentence φ,
  from a proof of φ in T infer φ—then by Löb''s theorem the theory proves every sentence,
  or at least proves φ for every φ, and so is inconsistent. I do not want a question
  that merely asks them to reproduce that. I want a question that turns on a distinction
  I keep failing to make precise: the difference between trusting one''s current theory,
  trusting a restricted fragment of it, and trusting a successor theory that one has
  verified. My crude intuition, from renormalization, is that if you can prove the
  coarse-grained theory is sound, you should be able to use it; but here the proof
  of soundness is itself inside the theory, and the diagonal lemma seems to make the
  proof eat its own tail."

  - Paragraph 3: Specific task and constraints. "Please write an exam question for
  a 75-minute, closed-book final in a graduate seminar. The question should introduce
  a concrete proposal—something like a student''s suggestion that the agent avoid
  the obstacle by adopting a trust schema only for sentences of bounded quantifier
  complexity, or only for proofs shorter than a given length, or by proving the soundness
  of a successor theory in the current theory. It should force students to distinguish
  which of these proposals are consistent (assuming T is), which are blocked by Löb,
  and why the move from ''T proves that S proves φ'' to ''φ'' is not the same as ''T
  proves φ''. The question should have three parts, worth 6, 10, and 9 marks. Then
  give a model answer of about 800 words that makes the key moves explicit, and a
  marking scheme that lists five must-hit points, the marks each is worth, and a one-line
  note on the common error that costs marks at each point. Do not ask for citations,
  reading lists, or names of papers; the exam is closed-book and the students have
  the standard results in their notes. The question should be self-contained: any
  technical terms you use should be explained in the question itself, since the students
  come from philosophy, computer science, and (in my case) physics."


