  Background you should assume: Dennett uses the color phi phenomenon -- a blue dot
  and then a red dot flashed in quick succession, with subjects reporting a single
  moving dot that changes color in mid-flight -- to separate two hypotheses about
  the timing of experience. On the Stalinesque hypothesis the brain resolves the two
  stimuli before either reaches consciousness, so the subject literally experiences
  the filled-in motion and the color change. On the Orwellian hypothesis the subject
  first has an ordinary, unpatched experience and then the memory of it is rewritten
  in light of the later stimulus. Dennett''s point is not that one of these is right
  but that the difference between them may be empirically idle, because both presuppose
  a Cartesian theatre with a privileged moment at which unconscious processing becomes
  experience -- and there is no such moment. The subjects could not, even in principle,
  tell the two stories apart from the inside.


  Now read Memento against this. Leonard Shelby cannot form new memories; he reconstructs
  his world from tattoos, Polaroids, and notes, and at the end we learn he is willing
  to doctor that record to give himself a purpose. I want the reading to take both
  the film and the philosophy seriously, in both directions:


