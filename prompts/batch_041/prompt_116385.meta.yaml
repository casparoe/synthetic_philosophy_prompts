  The color phi phenomenon / Orwellian vs Stalinesque is a great one for a disagreement:
  Dennett''s distinction between Orwellian revision (experience happens, then memory
  is revised — you never experienced the "wrong" thing) and Stalinesque revision (the
  revision happens before experience is "published"). The color phi phenomenon: two
  dots flashed, one red one green, subjects report seeing the first dot change color
  mid-flight — but that requires knowing the second dot''s color before the experience
  of the first dot''s color... The debate: does the color phi show that experience
  is retrospectively constructed (Stalinesque), or that the report is confabulated
  (Orwellian)? Dennett''s own view: the distinction is not empirically decidable,
  it''s a "difference that makes no difference" — he uses it against the "Cartesian
  theater."


