  The classic problem: to explain the report "I saw the dot change color halfway,"
  the brain must have access to the second dot''s color at the time it generates the
  experience of the first dot''s trajectory — but the second dot hasn''t appeared
  yet. Options:

  (a) Stalinesque: the brain waits ~100+ ms, then constructs the whole experience
  (with the color change already inserted) and only then "presents" it. So the experience
  of the first dot''s initial color is created after the second dot appears — the
  "blue" phase is genuinely experienced, but only after the fact; the experience is
  postdicted. Problem: this predicts that the subject cannot respond to the first
  dot until after the second appears, which seems false — subjects can detect/respond
  to the first dot quickly. Counter: the early response is generated by an "early"
  process that isn''t the conscious experience, or the readout for the button press
  can itself be revised.

  (b) Orwellian: the subject experiences blue-then-red correctly, but the memory of
  the first experience is overwritten so the report says "changed color mid-path."
  Problem: this posits a "true" experience that''s inaccessible even to the subject
  — the subject is systematically wrong about their own experience, and there''s no
  way to check. Also, if the memory is rewritten before the report, then the "experience"
  itself is doing no work; the report is generated from the rewritten memory.


  Dennett''s move: both hypotheses need a privileged moment when the experience becomes
  "conscious" or "published," and that''s the Cartesian theater. On the multiple-drafts
  view, there''s no single time; content gets fixed at different times in different
  parts of the brain, and "when did you experience it" has no determinate answer.
  So the dispute is underdetermined by the data.


  But is it a difference that makes no difference? One arguer (B) can say: yes, because
  any test you propose requires a readout, and the readout is either a report (which
  is exactly what''s in dispute) or a behavior whose timing can itself be explained
  either way. The other arguer (A) can say: no, it''s not empty — a Stalinesque story
  says the *content* of the experience is postdicted, an Orwellian story says the
  *content* was veridical but the *memory* is false; those differ in what happens
  in the brain at a specific time, and in principle a sufficiently detailed brain
  measurement could distinguish "was there a representation of blue that was read
  out into the experience-forming process" from "was the blue representation never
  read out before being overwritten."


