  the question we ended on was: is there anyone home in the colony, or is ''Aunt Hillary''
  just a convenient way of talking? And the annoying thing is that both answers cost
  you something. Say yes and you seem to owe minds to a lot of other aggregates --
  a market, a city, your gut, the traffic on the 101 -- because all of them are also
  just lots of dumb parts following local rules. Say no and you have to explain why
