  Prompt text:


  I''m a uni student in a political philosophy course and we just finished Nozick.
  I''m suppose to write a paper on his views on animals, and I want to do it by analyzing
  a real episode: the Copenhagen Zoo killing Marius the giraffe in 2014. You know
  the one -- healthy young giraffe, zoo said they had to kill him to avoid inbreeding,
  other zoos offered to take him, they did a public dissection anyway and then fed
  him to the lions. I want to run that episode through Nozick''s animal stuff. I know
  he floated the idea that we could be utilitarians about animals while being Kantians
  about people, and I think he later had doubts about that. But I don''t want a book
  report on Nozick. I want you to act like a philosopher who knows this area cold
  and think carefully about whether his view actually helps us understand what the
  zoo did.


  Start with a short brainstorm where you lay out the possible readings of Nozick
  on animals and flag the tensions before you commit to one. Then give me these sections,
  in this order, with rough lengths:


  - Brainstorm (150-250 words)

