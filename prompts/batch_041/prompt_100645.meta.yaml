  ---


  I teach a seminar on democratic backsliding and want to close the term with Sinclair
  Lewis''s 1935 novel *It Can''t Happen Here* as a literary case. I have been using
  the standard scholarly vocabulary — backsliding as distinct from breakdown, executive
  aggrandizement, competitive authoritarianism, constitutional retrogression — and
  I want a reading of the novel that takes both the fiction and that vocabulary seriously
  rather than treating the book as a period piece about European fascism. Please write
  the following sections, in this order, in British English, and do not quote the
  novel verbatim or supply citations; work from what is commonly known about its plot.


  **The concept** (about 300 words). State, as tightly as you can, what the contemporary
  concept of democratic backsliding actually commits us to: how it is distinguished
  from democratic breakdown and from a classical coup, what its characteristic mechanisms
  are, and where the concept is contested — in particular the worry that it is a threshold
  on an index, or a description of actors'' intentions, or something closer to a partisan
  label.


  **The novel as a case** (about 500 words). Read Windrip''s rise and rule against
  that concept. Which features of the book''s trajectory fit the diagnosis — an elected
  demagogue, mass acquiescence, the sidelining of Congress, the corporatist capture
  of the state — and which do not: the speed of the transformation, the open illegality,
  the armed paramilitary "Minute Men", the self-coup? Be concrete about which scenes
  or episodes carry the weight.


  **Where the novel resists the concept** (about 350 words). Where does the book sit
  awkwardly with a theory that has taught us to look for gradualism and legalistic
  erosion? Is it, on the scholarship''s own terms, a story of breakdown rather than
  backsliding — and if so, does that mean the novel is simply the wrong case for the
  concept, or does it expose a blind spot in a framework that may have overcorrected
  against the coup?


  **What the novel adds** (about 250 words). Finally, say what the fiction can show
  about the phenomenon that the scholarship, with its indices and typologies, cannot
  — the texture of complicity, the ordinary reasons people go along, the way a regime
  feels from inside — and whether that changes how I should teach the concept.


  Keep the whole thing analytic rather than appreciative; I want to be able to hand
  it to the seminar as a model of reading a text and a concept against each other,
  and I would rather it end by naming what the novel gets right that the theory misses
  than by hedging.


