  Key KS content to preserve:

  1. Feasible set: all possible agreements, expressed in each party''s utility units.

  2. Disagreement point: what each gets if no agreement (this must be measured, and
  it anchors everything — if the fallback is bad for both, everything shifts).

  3. Ideal point: each party''s most-preferred feasible outcome — the max each could
  get if the other got nothing. Note: the ideal point is a property of the feasible
  set, not of the party''s stated wish; parties will inflate their claimed ideal,
  so you must derive it from the feasible set, and the feasible set itself is partly
  constituted by the parties'' own value scales.

  4. The solution: the point on the segment from disagreement point to ideal point
  that lies on the Pareto frontier — i.e., both parties get the same fraction of their
  "gain range" (from disagreement to ideal). Proportional gain, not equal gains.

  5. Scale invariance: units don''t matter, only ratios of gains. So don''t worry
  about whether you measure in dollars or utils, but do worry that the 0-point (disagreement)
  and the ideal define the scale.

  6. Difference from Nash: no IIA; instead individual monotonicity — if the feasible
  set expands in a way that raises one party''s ideal, that party''s share of the
  surplus rises, even if nothing about the other''s options changed. Practical implication:
  if a new option appears that''s great for A and irrelevant to B, A gets more. This
  is a substantive normative choice (an "optimistic" solution), and Nash would not
  do that.

  7. Vulnerability: manipulable by "ideal-point deflation" — a party can improve its
  KS share by convincing you that its ideal is lower... wait, actually, lowering your
  own ideal point: KS gives you a fraction of your gain range; if you lower your ideal,
  hmm. Let''s compute: solution is t*(ideal - disagreement) + disagreement where t
  is max such that point is feasible. If you lower your ideal, the ray rotates, t
  changes... Lowering your ideal point can increase the fraction? Actually the classical
  result: KS is manipulable — a player can gain by misrepresenting its preferences
  (it''s not strategy-proof). Also by expanding the feasible set in a way that reduces
  your ideal, you can gain. Also: the solution is not necessarily in the core... hmm,
  careful.

  8. Also: interpersonal comparison — KS requires comparing the two parties'' utility
  scales, which means the mediator must assume the two scales are comparable at least
  ordinally-up-to-affine. This is the deep philosophical cost, and it''s exactly what
  Nash avoids (Nash needs only each party''s own vNM scale, no comparison). That''s
  a good "in the weeds" philosophical point: KS buys individual monotonicity at the
  price of interpersonal comparability.

  9. Symmetry: if the feasible set is symmetric, equal fractions → equal gains.

  10. Non-convex feasible sets: KS is still defined (unlike Nash, which requires convexity
  for the standard axiomatization; Nash''s solution may lie outside a non-convex set).
  Actually Nash''s axioms require convexity to guarantee the solution is in the feasible
  set. KS works for any comprehensive set, convex or not — you just take the ray and
  the frontier. Good practical point: with indivisible items (a house, a car), the
  feasible set isn''t convex, so KS is usable where Nash''s bargaining solution is
  awkward. That''s a nice in-the-weeds distinction that''s also practically important.

  11. n>2: KS doesn''t extend uniquely (the "Kalai-Smorodinsky problem" for n players).
  So the procedure must be restricted to two parties — flag as a limitation. Good
  "what the procedure can''t do."


