  ---


  I am planning a one-semester research leave with a single co-author, and I need
  to decide what to work on. Our target is the chance-credence relation — the family
  of principles governing how a rational agent''s degrees of belief should answer
  to objective chance. My co-author is a mathematically fluent epistemologist; I am
  a philosopher with decent formal training but no research-level probability theory.
  We can finish one substantial paper, or two short ones, and we can afford to spend
  the first month reading.


  I want a defended agenda, not a survey: a ranking of the open questions, with the
  criteria you are using stated explicitly and the trade-offs between them made visible.
  Please work within the following map of the terrain, which is my own way of carving
  it up, and tell me if the carving is wrong.


  Four loci at which a deference-to-chance claim can be located:


  1. Credence-deference. A constraint on credences: when your evidence includes the
  proposition that the chance of A is x, your credence in A should be x — except for
  the contribution of "inadmissible" evidence. The open work here is (a) saying what
  inadmissibility is without circularity, and (b) saying whether the constraint is
  a full-blown rational requirement or only a defeasible default.


  2. Constitutive analysis. The stronger claim that this constraint is not an extra
  norm laid on top of chance but part of what makes a quantity a chance at all — chance
  being, by definition, whatever plays this role in rational credence. The open work
  is whether anything substantive follows from this, or whether it merely relocates
  the question into what else has to be true of the chance-making facts.


  3. Decision-deference. The claim that chance enters rational choice directly, not
  through credence: a chance of x licenses treating A as a fair bet at odds x:(1-x),
  even where the credence that should guide the choice is something else. The open
  work is whether this is a distinct principle or a corollary of (1), and how it interacts
  with the split between evidential and causal reasoning.


  4. Social deference. The same schema applied to deference to another agent''s opinion
  rather than to a chance function, with the analogue of admissibility doing the heavy
  lifting. The open work is whether the chance case is a special case of a general
  deference principle or a different kind of thing that merely resembles one.


  Now the prioritization. Assume the question is which of these to spend the semester
  on, with the aim of producing work that other people in this area will have to engage
  with in five years — not merely a competent contribution.


  I want:


  - A ranked ordering of the open questions, including sub-questions I have not listed,
  with each item''s rank defended on the criteria you name. I expect the relevant
  criteria to include how many other questions in the neighbourhood depend on the
  answer (upstreamness), how tractable each is for a team with our specific division
  of labour, and how much of the existing literature already has it covered.

  - Explicit treatment of the undermining problem: the fact that on some accounts
  of chance the chance hypothesis itself can assign positive probability to a future
  in which the chance-making facts are different, so that strict deference to the
  chance hypothesis can require a credence that undermines it. Say whether this forces
  a self-referential reformulation of the principle, and whether anything of the original
  principle survives that reformulation — and say whether that question is upstream
  or downstream of the four loci above.

  - A judgement about which of the apparent open questions are real and which are
  verbal or terminological, and hence where the semester would be wasted.

  - The downstream reach: for each high-ranked question, name the neighbouring debates
