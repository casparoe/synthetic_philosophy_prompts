  "I''m closing out my aesthetics unit on authenticity with Welles''s F for Fake,
  and I want a reading of the film that actually argues with the philosophy rather
  than just admiring the sleight of hand. Here''s what bugs me. Almost all the literature
  on forgery -- Goodman''s two indistinguishable pictures, Dutton''s line about artistic
  crimes, Radford on why we''re bothered when a fake turns out to be fake -- is about
  copies. But Elmyr never copied anything. He made brand-new Modiglianis and Matisses
  that had never existed, sold as long-lost originals, and (this is the bit I keep
  coming back to) he says he never signed a thing. Welles juxtaposes that with the
  anonymous masons of Chartres, whose names nobody knows and whose work we still venerate
  -- and I think that analogy quietly backfires, because the cathedral builders never
  claimed to be anyone else. So one thing I want from the reading: does the corpus
  matter? Is the harm of an Elmyr that he adds fake items to somebody''s oeuvre, rather
  than that he fools the eye?


