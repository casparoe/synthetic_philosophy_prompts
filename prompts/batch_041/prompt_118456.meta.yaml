  Desiderata for a theory of convention:

  1. Must cover the paradigm cases: driving on one side, money, word meaning, first-come-first-served
  queues, units of measurement.

  2. Must explain arbitrariness without making conventions random: the alternative
  would have worked too, but not everything would (you can''t have a convention of
  driving on the "correct" side that''s undetectable).

  3. Must handle "nobody agreed": conventions arise without agreement, decree, or
  contract — including by accident and by evolution.

  4. Must explain the modal profile: conventions are contingent but expected; participants
  expect others to conform and expect them to expect.

  5. Must explain the epistemic role: conventions solve coordination problems by giving
  salience/knowledge of what to expect; conventions make behavior predictable.

  6. Must handle partial compliance, first-mover/initiation, and change (how a convention
  dies or flips: tipping, metric, left/right driving in Sweden in 1967 — that''s a
  real event, Dagen H; a model may know it).

  7. Must explain the relation between convention and norm: is a convention binding?
  Does it give reasons? Where does the "ought" come from? (Lewis: it''s rational to
  conform given the expectations; but no intrinsic normativity — the "no normativity"
  complaint.)

  8. Must handle conventions that are exploitative/asymmetric (norms of deference,
  gender norms) — these look like conventions but benefit some at others'' expense;
  Lewis''s common-interest assumption breaks.

  9. Must handle conventions in conflict with interest (Prisoner''s-Dilemma-like situations
  where the convention is bad for everyone but stable) — Lewis''s coordination assumption
  breaks.

  10. Must handle non-human conventions (animal signaling, Skyrms) and the continuity
  with biology.

