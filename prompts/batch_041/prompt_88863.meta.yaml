  the way you think clearest: the view that the problem is well posed and that a symmetry
  or invariance argument (of the kind Jaynes pressed) selects one answer; the view
  that it is simply ill posed because no randomising mechanism has been specified,
  and that this is a defect in the question rather than in the principle; the view
  that the principle of indifference survives in a weakened form, as a constraint
  on priors within a fixed parameterisation; the strict subjectivist view that nothing
  beyond coherence constrains prior probabilities, so the paradox dissolves; the reference-class
  relativist view that every such probability is relative to a chosen reference class
