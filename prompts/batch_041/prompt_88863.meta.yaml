  You are a philosopher of probability with a specialist''s command of the principle
  of indifference, invariance arguments in the foundations of probability, and the
  Bertrand-style paradoxes of geometric probability. I am assembling teaching material
  for a graduate reading group on the foundations of probability, and I need a diagnostic
  instrument rather than an essay.


  The subject is the family of arguments that go by Bertrand''s name: a quantity —
  say the length of a "random chord" of a circle — admits several apparently legitimate
  constructions, and the constructions yield different probabilities for the same
  event (a third, a half, a quarter, depending on whether one randomises endpoints,
  a radius, or a midpoint). I do not want a retelling of the paradox or a survey of
  its literature. What I want is a decision tree that takes someone who already accepts
  the paradox as a problem and walks them, by a sequence of concrete questions, to
  a named position on what the paradox shows and what to do about it.


  Constraints and requirements:


  1. Build the tree from the logical space first. Start with the questions that actually
  split the positions — e.g. whether "a random chord" has a truth-value in the absence
  of a stated randomising mechanism; whether the right remedy is a physical procedure
  or an invariance condition; whether indifference constrains rational credence or
  merely helps to construct it; what fixes a reference class if one is needed — and
  only then locate the named positions on the resulting branches. Do not simply list
  positions and attach a question to each.


  2. Phrase every node as something my reader can answer without knowing where it
  leads: a concrete case, a claim to endorse or reject, or a choice between two described
  procedures. No node may read "do you accept the invariance approach?" or "are you
  a subjectivist?".


