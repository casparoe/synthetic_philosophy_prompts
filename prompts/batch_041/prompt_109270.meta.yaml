  Option B: archaeology, "absence of evidence is not evidence of absence". Menu:

  1. About search: we haven''t looked hard enough (coverage argument).

  2. About preservation: the evidence wouldn''t have survived anyway (taphonomy).

  3. About sampling: our sample is too small.

  4. Bayesian: the absence raises the likelihood ratio only if P(absence | present)
  differs from P(absence | absent); if the evidence is equally likely either way,
  the absence is no evidence. So the slogan is true exactly when the observation is
  uninformative — which is a real, precise claim.

  5. A claim about priors: absence of evidence can''t lower the posterior below the
  prior unless likelihoods differ.

  6. A claim about what we''re licensed to infer in a specific case (e.g., "no burials
  found here" doesn''t mean no burial practice).

  7. The false reading: absence of evidence is never evidence — false; absence of
  evidence IS often evidence of absence (a careful survey finding no hearths in a
  hut is evidence).


