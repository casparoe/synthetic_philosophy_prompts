  Background facts I''m confident about: Timothy Williamson, "Knowledge and Its Limits"
  (2000), anti-luminosity argument. Luminosity: "A condition is luminous if and only
  if, whenever it obtains, one is in a position to know that it obtains." He argues
  no non-trivial condition is luminous. The argument uses a sorites-like series: a
  slowly changing condition (e.g., a body of water gradually cooling / one''s feeling
  of warmth), and a margin-for-error principle: if one is in a position to know p,
  then in all cases sufficiently similar (within a margin), p holds — because knowledge
  requires reliability, and one''s evidence/basis is compatible with nearby cases
  where p is false. So if in a case α where C obtains one is in a position to know
  C, then in α+1 (very similar, C still obtains), C obtains. Iterating, we get C in
  a case where it clearly doesn''t obtain — contradiction. So no luminous condition.


