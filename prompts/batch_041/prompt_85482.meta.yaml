  1. Paradox of tolerance: an argument that seems to prove too much. E.g., a chain:
  tolerance requires tolerating the intolerant; but tolerating them destroys tolerance;
  so intolerance must be suppressed; but suppression of intolerance is itself intolerance;
  so... Or the "prove too much" version: the paradox of tolerance argument, if it
  works, licenses suppression of any view whose victory would end tolerance — which
  includes lots of ordinary political positions, including ones the arguer holds.
  The asker could construct a formal argument with numbered steps. This is a classic
