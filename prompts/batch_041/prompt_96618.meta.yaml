  You are grading a midterm examination for an upper-level undergraduate seminar on
  Kant''s ethics. The relevant unit introduced the following stipulated vocabulary,
  which the students were told to use precisely:


  - A maxim is the subjective principle on which an agent acts, expressed in the form:
  in circumstances C, I will do A in order to achieve end E.

  - A contradiction in conception occurs when a maxim, universalized into a law for
  all rational agents, cannot be thought as a coherent system of action; this is supposed
  to ground a perfect duty.

  - A contradiction in will occurs when a maxim can be thought as a universal law
  but cannot be willed by a rational agent without defeating a necessary end of rational
  agency; this is supposed to ground an imperfect duty.

  - The universalization test asks whether the maxim itself can be willed as universal
  law. It is to be distinguished from a generalization test, which asks what would
  probably happen if everyone acted that way.


  Exam question: Explain how the two contradiction tests are supposed to work. Then
  consider these two maxims:

  (M1) When I need money, I will make a promise to repay that I know I cannot keep,
  because it will get me the money.

  (M2) When others are in need and I could help at little cost to myself, I will not
  help, because their needs are not my concern.

  For each maxim, state whether it fails the contradiction in conception test, the
  contradiction in will test, both, or neither, and explain why. Finally, assess the
  objection that the universalization test is merely a consistency check on maxims
  and therefore cannot generate substantive moral duties.


