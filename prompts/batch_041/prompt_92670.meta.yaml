  Prompt: I have been reading a lot of rationalist and consciousness-adjacent blogs,
  and I keep running into a distinction that I can state but not really grasp: the
  difference between access consciousness and phenomenal consciousness, and the way
  global workspace theory is supposed to relate to each. My rough understanding is
  that access consciousness is about information being globally available for reasoning,
  report, and control, while phenomenal consciousness is about what it is like to
  undergo an experience; global workspace theory says that when information is broadcast
  across a workspace, it becomes access-conscious, and perhaps that is all there is
  to consciousness. But I do not see how the theory is supposed to cross the gap,
  if there is one. Could you explain the conceptual issue here carefully, without
  assuming I already accept either the realist or deflationary framing?


  Then: In particular, I would like you to address the overflow issue. In experiments
  on brief visual displays, subjects often claim to have seen more items than they
  can report, which some take as evidence that phenomenal consciousness overflows
  access consciousness. If that reading is right, then global workspace theory might
  be a theory of access only. If it is wrong, then the reportability criterion is
  doing more work than it seems. Please lay out the strongest version of both sides,
  and then consider a thought experiment I have not seen discussed: imagine a system
  that satisfies every functional criterion associated with global workspace theory—ignition,
  broadcast, integration, availability to a wide range of downstream systems, verbal
  report, and flexible control—but for which there is no phenomenal character at all.
  Call this the dark workspace. Is the dark workspace conceptually coherent? If it
  is, does global workspace theory have the resources to rule it out, or does the
  theory simply leave phenomenal consciousness aside? If it is not coherent, what
  exactly in the theory rules it out, and does that ruling-out depend on a controversial
  functionalist premise? I am especially interested in whether the theory can distinguish
  between access consciousness and phenomenal consciousness without either collapsing
  the former into the latter or treating the latter as an inexplicable add-on.


