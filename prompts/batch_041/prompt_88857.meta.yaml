  Let''s outline the prompt:


  - Opening: casual, "I run a small community makerspace / tool library in a mid-sized
  town. We have about 200 members..." Details: budget, staff, stakes. "We keep having
  the same fights: the 3D printer is always tied up, the garden beds get overwatered
  in summer, the shared cargo bike is never available when someone needs it, and the
  community fridge gets emptied by a few people. My board wants me to write a procedure
  for deciding when to step in with rules (fees, time limits, reservations, quotas)
  and when to just add capacity or let people sort it out. I''ve read about the tragedy
  of the commons and public goods, but I''m not sure which is which in our case, and
  I don''t want to just impose rules that make things worse."

  - Then ask: "Please write me a decision procedure I can actually run. It should
  be a sequence of questions, with what counts as an answer, where it stops with a
  ''no rule needed'' or ''rule needed'' conclusion, and where it hands the decision
  to the board because it''s a values call. It should be usable by a volunteer coordinator
  who doesn''t know the theory. Then run it on three cases: the 3D printer, the garden
  water, and the community fridge. Include one where the procedure tells me something
  I won''t want to hear. And say what the procedure can''t do."

