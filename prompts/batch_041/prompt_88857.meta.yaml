  Let''s draft:


  "I run the operations for a small community ''library of things'' in a town of about
  30,000 — we lend tools, run a repair café, have a shared garden plot, a community
  fridge, and a little fleet of cargo bikes. We''ve got around 250 members, two part-time
  staff, and a volunteer board. Lately every monthly meeting turns into the same arguments:
  the 3D printer in our makerspace is always tied up by the same four guys, the garden''s
  irrigation timer gets overridden so half the beds get soaked and the rest dry out,
  the community fridge is either empty or full of stuff nobody wants, and the cargo
  bikes are never where they''re supposed to be. My board wants me to write up a procedure
  for deciding when we should step in with rules — reservations, time limits, fees,
  quotas, maybe even kicking someone out — and when we should just add capacity or
  leave it to people to work out. I''ve read a bit about the tragedy of the commons
  and public goods, and a friend who studies environmental governance said the key
  questions are whether the resource is rivalrous and how hard it is to exclude people,
  but I can''t turn that into something I can actually use at a meeting. I don''t
  want a reading list or citations, I just need a procedure."


  Second paragraph: "Can you write me a decision procedure I can run? I''m thinking:
  a sequence of questions to ask in order, what counts as a sufficient answer to each,
  where the procedure stops and says ''no new rule'' or ''new rule needed,'' and where
  it hands the decision to the board because it''s really a values call about fairness
  or who belongs. It has to be usable by a volunteer coordinator who''s never heard
  of Ostrom or Hardin, and it should keep the distinctions that actually change the
  answer — like whether the thing is rivalrous, whether exclusion is feasible, whether
  users are identifiable, whether the resource is a public good on top of a common-pool
  resource — and drop the ones that don''t. I''ve got maybe 20 minutes per case, any
  fee or exclusion has to be approved by the board, and we can''t afford a lawyer.
  Then run it on three cases: the 3D printer, the garden irrigation, and the community
  fridge. At least one of them should come out in a way I won''t like — I''d rather
  find out now than at the meeting. And please say what the procedure can''t do, or
  where it will misfire."


