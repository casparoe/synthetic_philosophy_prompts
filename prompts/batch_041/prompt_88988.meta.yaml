  \ is right, but I also feel that's only because I've already imagined myself deciding\
  \ to flee — the case seems to punish me for thinking about it.\"\n\n4. Parfit's\
  \ hitchhiker: stranger will pick you up only if you'd pay them when they arrive;\
  \ you'd have no reason to pay once you're in the car (out in the desert, can't be\
  \ found). Verdict: you should pay? Or: \"I think the person who would pay is admirable\
  \ but I don't think I'm obligated.\" Hmm — the asker could say: I'd promise and\
  \ pay, and I think refusing to pay is wrong, even though once in the car paying\
  \ has no causal benefit. That's a non-causal / evidential-ish or commitment verdict.\n\
  \n5. Novel case: \"the novelist's case\" — maybe something with a character who\
