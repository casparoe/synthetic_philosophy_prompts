reasoning_summary: "The user wants a prompt. Domain: pick one of five. Type: \"Report\
  \ one's verdicts on a set of cases and ask what principle captures them.\"\n\nI'm\
  \ asked to write from the perspective of a novelist, formal/polished, elaborate,\
  \ 1-3 paragraphs.\n\nWhich domain combines best with the \"verdicts on cases → principle\"\
  \ type?\n\nCandidates:\n- Access vs. phenomenal consciousness / global workspace\
  \ theory: could give verdicts on cases (which states are conscious, which are access-conscious),\
  \ ask what principle. Plausible.\n- Sor Juana's views on women's education: verdicts\
  \ on cases? Less natural.\n- Presentism in historiography: can historians escape\
  \ standards of their own time? Verdicts on cases (judging historical figures by\
  \ modern standards) — quite good! Verdicts on cases: e.g., judging Aristotle on\
  \ slavery, Jefferson, etc. But needs concrete cases; risk of relying on facts. Could\
  \ invent fictional-ish cases or use well-known ones. Hmm, but the asker is a novelist\
  \ — judging historical novelists' characters?\n- Is brain size morally relevant?\
  \ Verdicts on cases: which differences in brain size affect moral status. That's\
  \ a weird but interesting one. Could be done with concrete cases. But maybe relies\
  \ on empirical facts.\n- Death in Damascus: decision theory case. Verdicts on cases\
  \ about decision problems — e.g., Newcomb, Death in Damascus, etc. That's more of\
  \ a decision theory case-set; the principle sought would be a decision theory. But\
  \ the type says \"Report one's verdicts on a set of cases\" — good fit for decision\
  \ theory. However the domain \"Death in Damascus\" is quite specific, and might\
  \ be better with the adversarial collaboration type. Still, could work: verdicts\
  \ about what to do in Death in Damascus, Newcomb, twin prisoner's dilemma, etc.\n\
  \nHmm. Which one do I write best? Let me think about the constraint: \"shouldn't\
  \ refer super niche theories/ideas/facts that LLMs won't have properly memorized\
  \ (especially small LLMs)\" and \"inject some sort of new / niche ideas into the\
  \ prompt\" — meaning the prompt should include enough setup that a model without\
  \ web access can reason from the prompt itself.\n\nBest fit for me: Death in Damascus\
  \ with verdicts on a set of decision cases. The prompt must present the cases concretely\
  \ so no outside knowledge needed. A novelist could frame it: \"I'm a novelist working\
  \ on a story about a prophet...\" Actually the Death in Damascus case: an agent\
  \ in Damascus learns Death is looking for him; he flees to Aleppo; but the prediction\
  \ of his fleeing caused Death to be in Aleppo... Actually the original: Death looks\
  \ at him strangely in the market in Damascus; he flees to Aleppo; later he learns\
  \ Death was surprised to see him in Damascus because she had an appointment with\
  \ him in Aleppo that night. So fleeing caused his death.\n\nThe decision-theoretic\
  \ point: if you're in a situation where your decision is perfectly predicted/correlated\
  \ with the outcome, EDT says you should stay (since the prediction of fleeing means\
  \ Death goes to Aleppo), CDT says flee. And there's a symmetry argument showing\
  \ EDT is unstable: whatever you decide, EDT says you should do the other thing —\
  \ an \"unstable\" case where the agent's knowledge of their own decision-making\
  \ is the problem.\n\nSo the asker could report verdicts on a set of cases: Newcomb,\
  \ Death in Damascus, the twin prisoner's dilemma, the smoking lesion, Psy-Kosh's\
  \ non-anthropic problem, Parfit's hitchhiker, etc. But naming these might rely on\
  \ the model knowing them — better to spell out each case concretely, which is fine\
  \ and even desirable (the prompt says write the cases concretely). And the principle\
  \ sought: something about whether to treat your own decision as evidence vs. as\
  \ a cause.\n\nBut the additional instruction: \"inject some sort of new / niche\
  \ ideas into the prompt\" — hmm, actually re-reading: \"To comply with these two\
  \ competing objectives, you'll often have to inject some sort of new / niche ideas\
  \ into the prompt.\" I think this means: the prompt itself supplies the niche material\
  \ (since the model can't look it up), so the prompt should contain the unfamiliar\
  \ cases/ideas. That's what the type already does — the asker's own verdicts on cases.\
  \ So I should invent some novel cases of my own (as the novelist) that the model\
  \ can't have seen, plus include well-known ones spelled out.\n\nGood: invent new\
  \ cases in the Death-in-Damascus family, e.g., a novelist's own invented decision\
  \ scenarios with perfect predictors, to test whether the principle handles them.\n\
  \nNow let's design the prompt.\n\nPerspective: a novelist. Frame: writing a novel\
  \ about a character who lives in a town where a \"predictor\" — or maybe better,\
  \ the novelist is trying to give the character correct reasoning, has been arguing\
  \ with friends (a philosopher friend, a game-theory friend), has intuitions on cases,\
  \ wants a principle.\n\nVerdicts should be mostly sensible with at least one pair\
  \ hard to reconcile. And there should be a tension: e.g., in the Newcomb-type case,\
  \ take the box (evidential-ish); in the smoking lesion, don't refrain from smoking\
  \ (causal-ish); in Death in Damascus, feel the instability; in a new invented case,\
  \ something that pulls.\n\nLet me draft cases:\n\n1. Predictor / boxes: A near-infallible\
  \ predictor has already placed money. If she predicted you take both boxes, box\
  \ A is empty; if she predicted you take only box B, box A has a million. You can\
  \ see nothing. Verdict: take only box B. (One-box.)\n\n2. Smoking lesion: You know\
  \ a gene causes both cancer and a desire to smoke; you like smoking; the gene is\
  \ already fixed. Verdict: smoke (the gene is already fixed; smoking doesn't cause\
  \ cancer here). Actually classic: verdict is that smoking is fine because it doesn't\
  \ cause cancer. But EDT says don't smoke because smoking is evidence of the gene.\
  \ So verdict: smoke.\n\nHmm, but this pair (one-box but smoke) is a classic tension:\
  \ EDT handles one-boxing but fails smoking lesion; CDT vice versa. That's the standard\
  \ tension, and asking for a principle that gets both. Fine, but I want to add novel\
  \ cases to make it \"in the weeds.\"\n\n3. Death in Damascus itself: verdict — the\
  \ asker says: I can't get a stable answer; when I imagine myself deciding to stay,\
