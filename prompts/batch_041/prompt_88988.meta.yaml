  \ a button; a perfect predictor has placed a prize based on its prediction. One-boxing\
  \ intuition.\n\nCase B: the predictor predicted yesterday and the prize is already\
  \ in the box; you watch a live video of the predictor's prediction being made now?\
  \ No, that's just the transparent box.\n\nBetter novelty: cases where the correlation\
