  Potential prompt:


  I am a second-year PhD student in philosophy of mind and cognitive science, and
  I have been trying to turn a seminar worry into a dissertation prospectus chapter.
  The worry concerns the thought experiment often called the careenium, in which a
  large population of simple mechanical parts -- simmballs -- is arranged so that
  their local collisions realize a higher-level system that looks for all the world
  like it manipulates symbols. The standard lesson is that the symbolic level is a
  real pattern but not an extra causal agent: the simmballs do all the pushing, and
  the symbols are at best a convenient gloss. I am not satisfied. I suspect the interesting
  question is not whether symbols are "real" but whether the macro-level counterfactuals
  that we use to identify a symbol''s content -- if this symbol had been different,
  that output would have been different -- are autonomous from the micro-level counterfactuals
  that describe the simmballs, or whether they are merely shorthand for a vastly complex
  microphysical disjunction. If they are autonomous, then in a clear sense symbols
  do push the substrate around, even though every individual collision is fully determined
  by the simmballs; if they are not, then the symbolic level is epiphenomenal in a
  stronger sense than the usual multiple-realizability story admits.


  I want to write a proposal for a six-month pilot project, roughly 2,500 words, that
  would let me test whether this suspicion can be made precise. The proposal should
  state the question so that it has a determinate answer and is not just a verbal
  dispute about "causation." It should explain why the existing answers -- the standard
  deflationary reading of the careenium, the interventionist accounts of higher-level
  causation, and the mechanistic accounts that treat levels as explanatory stances
  -- leave the autonomy question open. It should describe the method: what I would
  actually do month by month, including what formal apparatus I would borrow (perhaps
