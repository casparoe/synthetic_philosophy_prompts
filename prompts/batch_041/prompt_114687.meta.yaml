  Good. Errors:

  1. (a) "these are really the same complaint" — conflation. Fanaticism of tininess
  vs fanaticism of scale are different: one is about probability-weighting (and can
  arise with modest values, e.g., a 1-in-10^12 chance of one extra happy day), the
  other about value aggregation over astronomical numbers. Also, "both are complaints
  about the rule rather than the axiology" is wrong for (ii): the far-future complaint
  is substantially about axiology/temporal discounting and the value of merely possible
  people; and complaint (i) can be framed as a complaint about the rule''s treatment
  of risk. A hasty grader lets this slide.

  2. (b) "This works, because..." — the reply does not rescue the rule; it relocates
  the problem to our epistemic situation, and it leaves untouched cases where the
  probabilities are stipulated and known (a fair lottery, or a stipulated coin). Also,
  it costs: if we''re that bad at estimating, that''s a problem for EV reasoning generally,
  not just in the exotic cases — it''s a general skeptical threat, not a local fix.
  The student says "this works" without noting it only works by denying we can apply
  the rule in the cases in question.

  3. (c) Non sequitur: labeling both as "fanaticism" doesn''t make them symmetric.
  The anti-fanatic can distinguish: refusing a tiny chance of a huge good can be grounded
  in the thought that the guarantee of a modest good is what we can be answerable
  for, or that tiny probabilities are the ones we''re least reliable about; also,
  "unavoidable" doesn''t follow from "no principled ground". The argument needs the
  premise that there''s no relevant difference between the two directions, which is
  exactly what''s at issue.

