  but the student''s stated distinguishing feature ("made up" vs "just small") is
  partly confused: a stipulated fair lottery is also "made up" in the sense of being
  stipulated; the real contrast people use is verification/blackmail structure or
  the unfalsifiability. Also the student''s "clearly right" example: 1-in-a-billion
  chance of a million lives vs certainly saving one life — 1e-9 * 1e6 = 0.001, so
  EV says save the one life; so the student''s "clearly right" case is actually one
