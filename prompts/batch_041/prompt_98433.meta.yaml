  ---


  I''m currently taking a graduate seminar on contractualist ethics, and I''m trying
  to decide what to write about for my term paper on the aggregation problem. Before
  I commit to a line, I want to see how a set of possible contractualist responses
  compare to one another, so I''d like you to rate and then rank them rather than
  simply survey the literature.


  Here are the five strategies I''ve reconstructed. Treat them as the objects of evaluation;
  I''m describing them in my own terms so that the exercise doesn''t turn on who said
  what.


  (1) Strict anti-aggregation. The reasonable-rejection test is applied individual
  by individual, and numbers never enter: a principle that imposes a burden on even
  one person is rejectable by that person regardless of how many benefit.

  (2) Threshold view. Numbers can be aggregated only when the burden imposed on the
  dissenting individual falls below a severity threshold; above that threshold, numbers
  are irrelevant.

  (3) Tie-breaker view. Numbers matter only when the competing individual claims are
  roughly equal in strength; a greater number breaks a tie but can never override
  a stronger single claim.

  (4) Ex ante view. Reasonable rejection is assessed from behind a veil, by each person''s
  ex ante probability of bearing a burden, so many small risks can be aggregated even
  when the resulting concentrated burden would not be.

  (5) Weighted-claims view. Aggregation is permitted, but each individual''s claim
  is weighted by its severity, so many small claims can outweigh one large claim only
  once their weighted total exceeds it.


  For each of the five, give me two numbers between 0 and 1, to one decimal place:
  (a) how much interpersonal aggregation the strategy actually licenses, where 0 is
  none and 1 is the full aggregation a utilitarian would accept; and (b) how faithful
  it is to the contractualist core idea that a principle is wrong if it could be reasonably
  rejected by someone. Add two or three sentences per strategy defending both numbers
  and noting any tension between them.


