  that P, then P is true; and if S knows that P, then S knows that any evidence which
  entails not-P is misleading, since it would entail a falsehood. So it seems S may
  rationally dismiss counter-evidence to P in advance. That looks like a license for
  dogmatism. Two factions in the group have been talking past each other for months.
  The knowledge-first faction thinks the paradox is a genuine consequence of knowledge''s
  factivity and that the interesting question is how to live with it; the evidence-responsivist
  faction thinks the paradox is a reductio of the assumption that knowledge can license
  ignoring evidence, and that the mistake lies in a premise about what follows from
  knowing that counter-evidence is misleading. I want the document they should have
  written together."


