  Potential prompt:


  I am currently enrolled in a graduate seminar on language acquisition and the philosophy
  of mind, and I need to submit a term-paper proposal by the end of the month. The
  paper is to be about 6,000 words and is due at the end of the semester. I have a
  half-formed idea that I would like you to turn into a full proposal.


  The idea is this. Debates about linguistic innateness standardly appeal to the poverty
  of the stimulus. But I think that label hides at least three separable claims: (i)
  an empirical claim that the primary linguistic data underdetermine the target grammar
  because children receive no systematic negative evidence and because the data are
  finite and noisy; (ii) a formal claim that no learner in a psychologically plausible
  hypothesis class could identify the target grammar from any finite sample of the
  kind children actually receive; and (iii) a metaphysical or explanatory claim that
  the best explanation of children''s success is an innate domain-specific constraint
  on the hypothesis space. I suspect the nativist conclusion is often treated as following
  from (i), when in fact it requires (ii), and that (ii) is either trivial or false
  depending on how the hypothesis class and the learning criterion are specified.
  I want the paper to separate these claims and ask whether any version of the poverty-of-the-stimulus
  argument survives once they are distinguished.


  Please write the proposal. It should:

  - state the central question precisely enough that it has a determinate answer,
  and say what would count as resolving it;

  - explain why the existing positions in the debate leave the question open, without
  assuming that I already know the literature by citation;

  - describe the method I would actually use month by month, and why a conceptual
  and formal approach is the right one rather than, say, a survey of acquisition data;

  - say what the possible conclusions are and which considerations would decide between
  them;

  - give an honest assessment of what could make the project too big for a semester,
  and what a scaled-down version would look like;

  - include a short section on what would count as the project failing.


  I do not need a bibliography or reading list; I will add citations myself. The proposal
  should be written for a reader who knows the basic debate but not my particular
  angle, and it should make a case that the project is worth doing even if the conclusion
  turns out to be negative.


