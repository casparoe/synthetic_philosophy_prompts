  Draft:


  "Every legal system I know of does two things that look, on the face of it, like
  they presuppose incompatible theories of vagueness. On the one hand, courts strike
  down statutes for vagueness: a criminal prohibition that fails to give a person
  of ordinary intelligence fair notice of what it forbids, or that leaves the police
  and juries to enforce it arbitrarily, is held unconstitutional and void, even if
  what it is trying to prohibit is plainly worth prohibiting. The doctrine treats
  indeterminacy in a legal predicate as a defect that the legislature must repair
  by drawing a sharper line. On the other hand, the same systems run on predicates
  that are irreducibly graded: negligence, reasonableness, materiality, competence,
  undue influence, obscenity, cruelty, and — in medicine and in the law of homicide
  — death itself. In these areas the law seems entirely content to leave the line
  to a jury, and no one thinks the statute is void.


  I want to know what theory of vagueness this pair of practices presupposes. Take
  the sorites series seriously: the law says a person is dead when brain function
  ceases, but neurons do not stop all at once; a driver is intoxicated above a blood-alcohol
  concentration and sober below it, though impairment is a continuum; a child becomes
  an adult at midnight on a birthday that has no physiological significance whatever.
  When the law stipulates such a line, is it pretending to discover a boundary that
  was there all along, or is it openly creating one? When it instead leaves ''reasonable''
  to twelve jurors, has it decided that there is no fact of the matter, or that there
  is one and jurors are as good at finding it as anyone?


  Two devices seem to me to deserve separate treatment, because I suspect they carry
  different commitments. The first is stipulation: an authoritative line drawn at
  a point everyone knows is arbitrary, defended on grounds of administrability, notice,
  and equal treatment — the de minimis principle, under which the law declines to
  notice harms below some threshold, looks like a cousin of this, and so do grandfather
  clauses and statutes of limitation. The second is delegation: the law declines to
  draw any line and hands the case to a decision-maker. My guess is that stipulation
  is easier to reconcile with one family of views about vagueness and delegation with
  another, but I would like to be told whether that is right.


  So: reconstruct the implicit theory of vagueness — or theories, if the practices
  are not unified — that this legal regime presupposes. Say which of the going accounts
  it fits: that vague predicates have determinate but unknowable extensions; that
  they have gaps and that a legal line is a permissible precisification of a hitherto
  unsettled predicate; that vagueness is a matter of degrees of truth; that the extension
  shifts with context and with the purposes of the inquiry. Distinguish what the practice
  strictly requires from what it merely gets along with — I expect that ''the legislature
  must be able to draw a line somewhere'' is compatible with nearly every view, and
  that the interesting question is what the doctrine of voidness for vagueness rules
  out. Then tell me what would actually change in courtrooms if we adopted one of
  the rival accounts: if vagueness is a matter of degrees, should verdicts be graded
  rather than binary, and would partial liability, partial negligence, and partial
  death be the honest outcome? If the extension shifts with context, is the void-for-vagueness
  doctrine simply confused about the nature of the problem it thinks it is solving?"


