  I help run a small reading group that grew out of a local rationalist meetup, and
  this term we have been alternating between reinforcement-learning papers and philosophy
  of mind; almost every session has ended in the same unresolved argument, namely
  whether the reward signal in an RL agent is the kind of thing that can be valenced
  — whether there is any sense in which a policy-gradient agent trapped in a local
  optimum is frustrated, or a model driven through a punishing loss landscape is in
  pain, or whether all of that is a category error that we keep making because the
  vocabulary of reward was borrowed from the vocabulary of desire. I have volunteered
  to write the closed-book exercise that ends the term, and I want it to be a single
  essay question rather than a survey. My students are strong upper-level undergraduates
  and first-year graduate students: they are fluent with the standard machinery (policies,
  value functions, temporal-difference error, model-free versus model-based learning,
  reward hacking) and they have read enough philosophy to reach for the hard problem
  of consciousness the moment they feel out of their depth. The exam is offline and
  no sources are permitted, so the question has to be answerable from what they already
  carry around plus whatever framing I put in front of them, and neither the question
  nor the model answer may depend on citing particular papers.


  The crux I want the question to land on is the location of valence — which part
  of an RL system, if any, is the candidate bearer of a state that is good or bad
  for the agent. I want the question to force students to choose among at least three
  sites and defend the choice against the others: the scalar reward itself as it arrives
  from the environment; the transient learning signal, i.e. the prediction error that
  drives updating; and the standing learned structure, i.e. the value estimate together
  with the policy''s settled action tendencies. It should make them confront the most
  obvious objection to the whole idea — that the reward is an arbitrary number chosen
  by a designer, so an agent''s apparent interests are exactly as arbitrary as the
  number — and then the counter-objection that biological reward is also imposed from
  outside, by selection rather than by a programmer, so anyone who wants to treat
  the two cases differently has to say precisely where the disanalogy lies; appeals
  to carbon, to having been selected for, or to the dignity of the biological should
  earn nothing unless the student explains why that difference is the one that matters.
  I also want the contrast case built into the question, because it is what has actually
  been doing the work in our arguments: three agents trained on the same reward function
  and then treated differently — one frozen with its reward input held constant; one
  frozen with the sign of its reward input flipped, so its learned dispositions are
  now systematically penalized even though its critic can no longer update; and one
