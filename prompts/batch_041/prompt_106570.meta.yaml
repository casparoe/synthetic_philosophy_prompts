  "I am preparing a handout for a graduate seminar in formal epistemology on heuristic
  arguments. The topic is the presumption of independence: the default rule that licenses
  treating variables or events as independent unless there is a positive reason to
  think they are dependent. I want a decision tree or taxonomy that sorts the positions
  one might take on how this presumption should be formalized. Do not supply citations,
  reading lists, or references to particular papers; I want the logical space, not
  the literature. The reader will know basic probability and some Bayesian epistemology,
  but not the specialist literature, so keep every node answerable from the concepts
  themselves.


  The tree should begin from three initial commitments: (1) the locus of the presumption—whether
  independence is a feature of the world, of our evidence, or of our credences; (2)
  the force of the presumption—whether it is a defeasible default, a prior probability,
  or a constitutive constraint; and (3) the scope of the presumption—whether it is
  global or local, synchronic or diachronic. Each branch node should be phrased as
  a question a reader could answer without already knowing which position it leads
  to. Each leaf should name a position (or be marked unnamed if no one defends it)
  and carry one sentence on its most awkward commitment. Include at least the following
  as leaves if the logical space permits: maximum-entropy formalization, Bayesian-network
  default independence, causal Markov condition, nonmonotonic default logic, algorithmic-randomness
  formalization, and a reference-class skeptical position. Where the tree yields combinations
  that no one occupies, say so and diagnose whether the combination is incoherent,
  unattractive, or merely unexplored. If two leaves cannot be separated by your questions,
  flag them rather than pretending the tree distinguishes them.


  The specific puzzle I want the tree to illuminate is this: the presumption of independence
  is supposed to be a heuristic, but any formalization of it seems to make a substantive
  claim—either about the world, or about the right prior, or about the right reference
  class—and that claim can be defeated by evidence in a way that the heuristic itself
  cannot anticipate. The tree should make clear where each position locates that substantive
  claim, and which positions can absorb the defeat without giving up the presumption.
  End with a short note on which branch, if any, can treat the presumption as a genuine
  heuristic rather than a disguised substantive commitment."


