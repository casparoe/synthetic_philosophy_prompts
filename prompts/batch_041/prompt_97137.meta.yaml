  that transfers a permission. My working view is that the standard conditions—competence,
  non-deception, non-coercion—are conditions on the transaction, but they are neither
  individually nor jointly sufficient for validity, because a transaction can satisfy
  them and still fail what I call the uptake condition: the consent must be addressed
  to a party who is entitled to receive it, for a token act, under a description the
  consenter can recognize as the act that will occur. I want the session to bring
  them to see why that fourth condition is needed, and why it is not just a repackaging
  of the other three. Plan the explanation for me. What has to come first, second,
  third? Which single case should carry the whole session, and what must that case
