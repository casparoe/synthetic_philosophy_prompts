  Where does it go wrong? The key: "each ranks higher" presupposes a fixed ranking
  over outcomes that is independent of the compromise. But for values, the compromise
  may *change* the ranking — or, more sharply, the very act of treating a value as
  tradeable is a change in one''s evaluative stance, so the "package" isn''t an outcome
  the person ranks higher than the status quo; it''s an outcome they rank lower *because*
  it was reached by trading away a value. Also: the "gains from trade" framework requires
  interpersonal comparison of *rankings*, not of values — the Pareto improvement exists
  relative to the parties'' preferences, and if a party''s preference is "never compromise
  on X," then the compromise is not a Pareto improvement at all (it''s not preferred
  by that party). So step (1) → (4) has an equivocation: for goods, we can hold preferences
  fixed and find a trade; for values, the parties'' preferences over the disputed
  outcome are partly constituted by their commitment, so the existence of a mutually
  preferred package cannot be assumed. Also there''s the point about incommensurability:
  without a common measure, "a package each ranks higher" may not exist.


