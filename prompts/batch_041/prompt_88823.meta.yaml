  Prompt draft:


  I would like you to construct a case to order, in the spirit of the spandrel critique
  of adaptationism, but built so that the critique''s own machinery is put under strain
  as well. I am after a single trait in a single organism on which an adaptationist
  and a critic of the adaptationist program can agree about every observation and
  disagree about what the trait is.


  Specifications:


  - One trait, one organism, described in a short paragraph. Keep the anatomy plain
  enough that a reader with no zoology can follow it. Invent the organism if that
  helps; if you use a real one, stick to something whose basic biology is common knowledge.

  - No stock examples. Do not use the human chin, male nipples, the spaces between
  arches of an actual building, the panda''s thumb, or any other case that appears
  in textbooks.

  - Both parties must accept the same data. The disagreement must be about inference,
  not about facts. So state the observations neutrally, in a form neither side would
  contest: what the trait is, what it costs, what it does now, how it varies, what
  is known about its development, and what is known (or not known) about its history.

  - The case must turn on a single variable. Name that variable explicitly, and say
  what happens to the case when you remove it — which framework''s verdict survives
  and which collapses.

  - Distinguish, at least implicitly, the question of where the trait came from from
  the question of why it is still there. Do not let a claim about origin do the work
  of a claim about maintenance, or vice versa.

  - The history may be stipulated only if you say what observation would, in principle,
  settle it. No just-so stories about an ancestral environment nobody can check.

  - Then say what piece of evidence, obtainable by ordinary means, would actually
  discriminate between the two verdicts.


  After the scenario, do the following, in order: (1) state the adaptationist''s verdict
  and the reasoning that gets him there, in his own best form; (2) state the critic''s
  verdict and the reasoning, in his own best form; (3) identify the feature of the
  case that is doing the work, and show that it is a feature and not an assumption
  smuggled in; (4) say what a defender of the framework that comes out worse would
  say to defuse the case — and be honest about whether that reply succeeds.


  A word on what the case is for, since it fixes what counts as cheating. The point
  I want the case to make is that the adaptationist inference is underdetermined by
  the evidence, not that adaptationists are careless. So a case that simply stipulates
  a byproduct origin, without showing why the same observations are equally compatible
