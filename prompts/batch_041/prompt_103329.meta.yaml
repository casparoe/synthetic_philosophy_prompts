  with capitalism" but a specific mechanism: the doctrine of double predestination
  left believers unable to know whether they were among the elect, and the ordinary
  means of relieving that anxiety — confession, sacraments, the church''s mediation
  — were unavailable. Weber''s claim is that worldly labor in a calling was reinterpreted
  as evidence of election, so the anxiety was channeled into methodical, continuous,
  self-denying work. A mechanism with named links is not a correlation, and each link
  can be tested: where the doctrine was weakened or the anxiety channeled elsewhere,
  the behavioral consequence should be absent.


  Move 3 (D): Grant the mechanism for asceticism. It still doesn''t give you capitalism.
  Anxiety plus a duty to work predicts hard work, frugality, and a suspicion of enjoyment;
  it doesn''t predict the reinvestment of the resulting surplus in an ever-expanding,
  rationalized enterprise rather than in land, luxury, charity, or hoarding. Weber
  needs an extra premise — that the surplus could not be consumed and so had to be
  plowed back — but that premise follows from any ascetic ethic, so the specifically
  Protestant content is doing no work. A Confucian mandarin ethic, a Stoic ethic,
  a certain reading of Jewish law — any of them could supply work-plus-frugality.
