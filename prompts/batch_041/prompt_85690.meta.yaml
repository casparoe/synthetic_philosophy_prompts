  the man his choice is causally idle: since fleeing does not cause Death to be in
  Aleppo, the two options come out equally good, or he may as well toss a coin. But
  the man cannot treat the options as equal, because whichever one he takes is the
  one that ends with him meeting Death; a theory that says "pick either" has stopped
  giving advice.


