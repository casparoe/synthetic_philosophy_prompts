  Potential prompt:


  "After a career in experimental physics, I have spent the last several years reading
  philosophy, and I keep returning to a dispute that seems to me to have the shape
  of a stalemate. On one side are decision theorists who hold that a rational agent
  should maximize expected utility with respect to the causal consequences of her
  act; on the other are those who hold that, in certain symmetric or correlated situations,
  an agent should choose as if her choice were also a choice made by the other participants—the
  position usually called superrationality. The stock examples are well known: the
  one-shot Prisoner''s Dilemma played by two reasoners who know they are reasoning
  alike, Newcomb''s problem, and various twins and mirror cases. Each side has a stock
  reply to the other''s stock examples, and the replies have not changed much in decades.
  The causalists say that correlation is not causation and that a rational agent cannot
  make her choice a cause of the other''s past or independently determined choice.
  The superrationalists say that the causalist has misdescribed the situation: when
  the other agent''s choice is a function of the same reasoning process, treating
  one''s own choice as evidentially irrelevant is a failure of self-knowledge, not
  a mark of rationality. I have a hypothesis about the impasse, but I would like you
  to diagnose it rather than adjudicate it.


  My hypothesis is that the two sides are not really disagreeing about the same question.
  The causalist is asking what an agent should do given a fixed causal graph in which
  her act is an intervention; the superrationalist is asking what an agent should
  do given that her act is the output of a decision procedure that may be shared,
  duplicated, or predicted. If that is right, then the dispute is not about the correct
  answer to one question but about which question a theory of rational choice is supposed
  to answer. But I am not confident. It may instead be a substantive disagreement
  about the metaphysics of action—whether choices are events in the causal order or
  algorithm outputs—or a verbal dispute about the word rational, or a disagreement
  about what counts as a relevant description of the decision situation.


  I would like a diagnosis, supported by what each side actually says, of what kind
  of disagreement this is. Is it verbal, substantive, or two questions under one heading?
  Is there a hidden formal question doing the work—for example, whether the agent''s
  decision procedure is represented inside or outside the causal model, or whether
  the relevant counterfactual is about what the agent would have done had she chosen
  differently or about what the other agent would have done had she been the same?
  Does the disagreement turn on cases that both sides accept as data, or on which
  cases count as data in the first place? And given your diagnosis, what would count
  as progress: a formal result, a distinction, a redesigned example, or an argument
  that no progress should be expected?


  To make the diagnosis concrete, consider a case I have not seen discussed in quite
  this form. Two artificial agents are instances of the same trained model, but they
  are not identical in their inputs: one has been trained on a large corpus that includes
  the other''s training history, and both have been fine-tuned on the same reward
  signal. They play a one-shot Prisoner''s Dilemma. There is no causal channel from
  one agent''s choice to the other''s: each acts simultaneously and independently.
  But because their policies are correlated by the shared training process, each can
  predict the other''s choice with high probability from its own inclination. The
  causalist will say that this is just a correlation, like any other evidence about
  the other player, and that the correct move is to defect if defection maximizes
  causal expected utility. The superrationalist will say that the correlation is not
  merely evidential: the agents are two tokens of one type, and each should choose
  the policy that would be best if both tokens ran it. I am interested in whether
  this case makes the dispute sharper or reveals it as a clash between two different
