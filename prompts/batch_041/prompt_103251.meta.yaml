  Domain: Machiavelli''s fortune and virtù. A person: someone who reads Machiavelli
  as a realist about political success, maybe a management/political theory person.
  Commitments:


  (a) Machiavelli''s virtù is a genuine causal factor in political success — skill,
  energy, decisive action really do make the difference between rulers who last and
  those who don''t.

  (b) Machiavelli thinks fortune governs about half of our actions — the rest is up
  to us.

  (c) Machiavelli''s own advice to "change with the times" — the ruler who adjusts
  his mode to the character of the times prospers; but he also says men cannot change
  their natures, so the cautious man is ruined when impetuousness is needed.

  (d) Machiavelli praises impetuousness — fortune is a woman, better to be impetuous
  than cautious (end of ch 25).

  (e) Virtù is not the same as moral virtue — it''s a functional excellence.


  Tension 1 (genuine, non-obvious): (a) treats virtù as a reliable causal lever, but
  (c) says success depends on matching the times and that men can''t change their
  natures — so virtù can''t be a general-purpose skill; on Machiavelli''s own account
  the most virtuous man may fail purely because his fixed temperament is out of sync.
  That undercuts (a) — it makes virtù more like a lottery ticket matching your nature
  to the times. Also undercuts (b)''s "we direct the other half" — since what we can
  direct includes our own nature, which he says we can''t change. So (b) and (c) are
  in tension: if the half we control includes how we act, but our mode of acting is
  fixed by nature, then the "other half" isn''t really under our control. Nice.


  Tension 2 (genuine): (d) impetuousness is better, vs (c) success depends on conformity
  to times — if impetuousness is generally better, then timing matters less; the claim
  that fortune favors the impetuous sits awkwardly with the claim that the cautious
  succeed when the times are cautious. Also (d) makes the recipe "be impetuous" which
  is a general rule, contradicting the "no general rule, match the times" reading.


  Apparent tension that dissolves: (e) virtù isn''t moral virtue, vs. Machiavelli
  praising seemingly "virtuous" deeds. Or: the apparent tension between "fortune rules
  half" and "virtù can build dikes against fortune" — dikes are literally the metaphor
  for preparing in advance, so no tension: fortune''s power operates only where virtù
  hasn''t prepared. That''s the dissolving one — Machiavelli''s own river/dike image
  reconciles them. Good: apparent tension between (b) fortune as a fixed 50% allotment
  and the claim that virtù can reduce fortune''s scope — dissolves because the "one
  half" line is loose rhetoric, and the dike metaphor implies the share isn''t fixed.


