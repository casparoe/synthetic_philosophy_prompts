  1. The Kelly criterion: stake the fraction that maximizes expected log wealth; equivalently
  the fraction maximizing long-run growth rate. Full Kelly maximizes growth, not expected
  wealth.

  2. The distinction between the ensemble average and the time average for multiplicative
  processes: if you average across many parallel copies of a bettor, wealth grows;
  the single bettor''s typical path stagnates. Non-ergodicity. So "expected value"
