  3. Ruin is absorbing: any strategy that can hit zero has an expected growth rate
  of −∞; so growth-rate maximization treats ruin as lexically forbidden.

  4. Fractional Kelly: if the edge is estimated rather than known, betting a fraction
  of the Kelly stake buys protection against overbetting; overbetting Kelly is worse
  than underbetting (growth is asymmetric around the optimum). Good niche point: the
  growth-rate curve is concave in the fraction, so overbetting costs more than underbetting.

