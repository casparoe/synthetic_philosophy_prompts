  maximization with log utility is not uniquely rational; the "long-run" argument
  smuggles in a claim about which limit matters. And the reply: a rational agent who
  cares about the path it actually travels, not the average of paths it doesn''t.

  6. Geometric rationality as a stance: prefer thresholds/satisficing to maximization;
  prefer mixtures to optima; beware arguments whose conclusion rests on astronomically
  large numbers (Pascal''s wager / mugging); treat "don''t die" as prior to "do good".


