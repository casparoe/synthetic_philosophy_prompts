  that states Good''s theorem roughly as follows: for a Bayesian agent, the expected
  value of costless information is non-negative, because she can always choose the
  same action she would have chosen without it. I can follow the algebra, but the
  theorem seems to imply something I find hard to accept. If information can never
  have negative expected value, then surely it is never rational to avoid a medical
  test, refuse to read a hurtful email, or prefer not to know whether a partner has
  been unfaithful. A friend in the group says this is exactly right: any reluctance
  is either a failure of Bayesian coherence or a sign that the information was not
  really costless. But I keep thinking about cases where the information itself changes
  what I care about, where I cannot unlearn it and it colours everything, or where
  the value of an experience depends on my not knowing what is coming. I also wonder
  about cases where finding out the truth would make me worse off in every outcome,
  not merely in the moment of learning. So my question is this: does Good''s theorem
  actually show that information is always good, and if it does, how should I understand
  these apparent counterexamples? If it does not, what exactly is the false presupposition
  in my reading, and which assumptions in the theorem are doing the work? Please answer
  as exactly five numbered points, each one a sentence or two, with no introduction
  or conclusion."


