  the masking cases show that the conditional can fail even when the disposition and
  its causal basis are both intact (the glass is fragile, but it is wrapped in packing
  when struck). One camp responds by refining the analysans, typically by appealing
  to an intrinsic property of the object that would still issue in the manifestation
  if retained under suitable conditions; another camp treats finks and masks not as
  obstacles to be patched but as symptoms that no conditional in the analysans can
  capture what dispositions are, and urges that we treat dispositions as primitive
  rather than analysed.


