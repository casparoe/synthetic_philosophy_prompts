  The desiderata list for a theory of mental content / naturalizing intentionality:

  1. Determinacy — content must be determinate enough to explain behavior; must not
  be "in the head" only as a disjunction of all the things it might covary with (the
  disjunction problem / indeterminacy of tracking).

  2. Misrepresentation — must allow for representing falsely; a purely covariance/informational
  account seems to make error impossible (indicator semantics: "S means F iff S covaries
  with F" makes false representation impossible since any state covarying with something
  is about that thing). Also "swampman" and "the problem of novel content".

  3. Normativity / the possibility of malfunction — content involves conditions of
  correctness, so a theory must explain what fixes the norm without a designer or
  interpreter. (Millikan: proper function; Dretske: indicator function.)

  4. Compositionality & productivity — content must be compositional, since content-bearing
  states are structured (you can think indefinitely many new thoughts). A theory that
  only assigns content to whole states (e.g., "the whole state is about G") can''t
  get compositionality; but compositionality is hard to reconcile with causal/teleological
  accounts that seem holistic. Also systematicity.

  5. Determinate content-bearing states must be distinguished from mere indicators,
  dispositions, and symptoms. E.g., a tree-ring indicates age but doesn''t represent
  it; a thermometer''s mercury level. Must distinguish "informational" from "representational"
  — the "why is tracking not enough" requirement.

  6. Must respect the content/reference vs. what it is about — e.g., coextensive contents
  (creature that only ever encounters water=H2O vs. a Twin-Earth duplication), and
  must say something about the role of environment vs. internal role.

  7. Must be consistent with the science: content must be causally efficacious in
  producing behavior (or at least explain behavior), must not violate physical/biological
  constraints (no homunculus, no original intentionality smuggled in); must be naturalistic
  — no unexplained semantic primitives.

  8. Must handle "derived" vs "original" intentionality: distinguish intentional states
  of artifacts/words from those of organisms.

  9. Must handle the "content-indeterminacy" worries: the frog example — does it represent
  "fly", "small dark moving thing", "food", "fly-or-pellet"? What fixes it.

  10. Must handle novel/decoupled representations (thinking about things absent, imaginary,
  or never encountered — e.g., thinking about a unicorn, or about the far future).

  11. Must account for the "meaning" of internal states used in control vs. in cognition;
  e.g., "pushmi-pullyu" representations (Millikan''s descriptive/directive) — maybe
  too niche but describable.

  12. Must be consistent with etiological facts about learning and plasticity: an
  organism that learns to represent new things (e.g., learned alarm calls) — how does
  a function-based account accommodate learned content?

  13. Must handle the "misrepresentation" and the "swampman" case: a molecule-for-molecule
  duplicate created by accident has states that cause the same behavior but no history.
  Teleological accounts say it has no content; but then content isn''t needed to explain
  behavior. This is a joint-unsatisfiability candidate: (a) content is fixed by history/function,
  (b) content must explain behaviour, (c) Swampman behaves identically → tension.

  14. Must not over-generate: artifacts, computer programs, plants, immune systems
