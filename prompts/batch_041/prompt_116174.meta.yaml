  does it represent the direction of "down"? Some say yes (Millikan), some say no.

  15. Must be able to explain the difference between content and "causal role"/functional
  role, and to relate them (narrow vs. wide content).

  16. Must account for the possibility of error''s being systematic and for the distinction
  between misrepresentation and mere malfunction... etc.


