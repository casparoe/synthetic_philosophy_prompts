  but retained the "public/private" line and kept offences against decency, and it
  did not endorse sexual liberty generally (it upheld the age of consent, and it recommended
  heavier penalties for soliciting). Also Bentham''s own position on e.g. the age
  of consent (he had a formula based on capacity, and he defended some things that
  the 20th century wouldn''t endorse — his treatment of "the liberty of the individual"
  was paired with his argument that harm to third parties is the only ground). This
  is a genuinely rich mapping.


