  The seeded errors I''ll commit to:

  1. "Utility is bounded / Bernoulli''s log utility caps the value of money" — wrong:
  log utility is unbounded; the expectation is finite because probabilities decay
  faster than payoffs grow. Bounded utility is a distinct, later fix.

  2. "The paradox shows expected value maximization is irrational and refuted the
  classical theory of rational choice" — overstatement: the game''s EV really is infinite;
  what''s in tension is the EV rule (as the whole story) vs. the intuition; the standard
  move is to replace EV-of-money with expected utility, which presupposes rather than
  refutes EV-maximization (of utility). Also it''s a reductio aimed at a specific
  combination: EV maximization + the assumption that the value of money is linear
  in money + the intuition that you shouldn''t pay much. You can keep EV-maximization
  and reject the intuition (Hájek/Nover-style vindication).

  3. "The modern consensus is that the paradox is dissolved because no casino could
  offer such a game / coin-flip sequences terminate" — relocation, not dissolution;
  also the "no infinite bankroll" point makes EV finite but still large (logarithmic
