  already decided), so... the demon''s location is correlated with your action. CDT
  says act as if your action doesn''t change the demon''s location; but the demon''s
  location is fixed and correlated with your action, so you''re doomed either way
  — no action helps. The puzzle''s point: if the demon is perfectly reliable, then
  your "choice" is fixed (you''ll do what the demon predicted), so deliberation is
  pointless; you can''t escape.


