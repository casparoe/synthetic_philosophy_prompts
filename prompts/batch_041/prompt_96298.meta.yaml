  Design the guest''s position precisely so questions have teeth:


  Guest: a philosopher of mind (invented, unnamed) defending: an ant colony is literally
  a cognitive system — it represents, stores, and revises information — but it is
  not a subject of experience; there is nothing it is like to be the colony. She calls
  this "representation without a point of view." Her criterion for colony-level representation:
  information counts as a representation only if the signal carrying it is decoupled
  from the stimulus that triggers it, is revisable in light of contrary evidence,
  and can be re-identified as the same representation across turnover in the ants
  that carry it. She also claims the colony has something like beliefs, but not desires,
  because... hmm, maybe simpler.


  Questions to request, each with a follow-up:


  1. The "no ant knows anything" intuition and the brain analogy: if the fact that
  no ant understands the colony''s "knowledge" shows the colony doesn''t know, the
  same reasoning shows no brain knows, since no neuron does. Ask her to say why the
  disanalogy isn''t just a difference in degree of integration. Follow-up keyed to
  her likely answer ("neurons are subordinated to the brain in a way ants aren''t
  to the colony") — press: what''s the criterion of subordination, and does the queen''s
  removal or the ability of a colony to split count against it?


  2. Fission and turnover: if a colony can be split into two viable halves that each
  forage and respond as before, and if its membership turns over completely within
  a few years, what makes the pre-split and post-split colonies the same cognizer?
  Her third criterion (re-identification across turnover) seems to invite the same
  puzzles as personal identity. Follow-up: if she says identity is not required for
  cognition, ask whether that means "the colony" is just a convenient label for a
  lineage of information.


  3. Demarcation: given her criteria, what excludes the obvious hard cases — a slime
  mold that solves a maze, a termite mound''s ventilation, a market''s price signal,
  an immune system''s memory, or the collective of ants plus the fungus they farm?
  Ask her to name the case she thinks fails her test and why. Follow-up: if she concedes
  the immune system passes, press on whether "cognition" has become a term of art
  that no longer tracks the thing we care about.


  4. Misrepresentation: parasitic beetles and ants that mimic colony signals and hijack
  workers. If the colony''s signal carries content, and a parasite exploits it, does
