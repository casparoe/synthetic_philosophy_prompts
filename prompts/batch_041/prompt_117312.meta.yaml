  Possible prompt:


  I''m in sixth form and I''m doing this EPQ thing on nuclear strategy (my teacher
  said it was fine even though it''s a bit grim lol). I keep noticing a pattern that
  I don''t have a word for and it''s doing my head in. Basically, two sides both really
  don''t want a war. But each side thinks the only way to stop the other side attacking
  is to make its threat believable. And the way you make it believable is by making
  it not fully under your control. Like if I say to someone "if you take my seat I''ll
  punch you", they might not believe me, because I might calm down and not do it.
  But if I set up some stupid tripwire so that anyone who takes the seat gets a bucket
  of paint on them, that''s credible, but now I can''t stop it when the wrong person
  takes the seat, or when someone trips over it by accident. In the nuclear version
  it''s like putting launch authority lower down, or making the missiles look like
  they''ll fire on their own if the early warning says so, or saying the decision
  is already made. It makes the other side more scared, which is supposed to make
  them back off, but it also means a false alarm or a random officer could start the
  thing no one wants. So the thing I''m trying to name is this trade-off: the more
  credible you make the threat, the less control you have over it, and the more you
  succeed in making it credible, the more likely it is to go off by accident. And
  then there''s a second bit: once you''ve made it automatic, is it even a threat
  anymore, or is it just a machine that might kill everyone? I''ve heard the word
  brinkmanship and something about a threat that leaves something to chance, but I
  can''t tell if those are the same thing, or if one is just the general idea and
  the other is the specific "give up control" bit. Is there an established name for
  this exact bind? And if there isn''t, can you name it and define it so it''s actually
  clear what''s included and what isn''t? I''m not just after a label, I want to know
  how it''s different from just making a threat, from the security dilemma, from mutually
  assured destruction, and from ordinary risk-taking. Also, does the name still apply
  if only one side does it, or if it''s accidental rather than deliberate? And what
  about when the whole point is that you can''t tell whether it''s deliberate or accidental?
  Cheers.


