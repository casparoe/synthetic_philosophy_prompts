  "Please play the part of a committed defender of the orthodox Wittgensteinian account
  of hinge certainty — the reading on which hinges are not propositions we believe,
  but certainties that show themselves in what we do and say, exempt from doubt and
  from justification because they belong to the grammar of our practices rather than
  to the body of things we have reason to think true. Play it straight: your position
  has real resources — the difference between doubting something and no longer playing
  the game in which doubting has a point, the fact that any doubt is framed by certainties
  that the doubting itself cannot put in question, the thought that hinges are held
  not by reasons but by the form of life. Concede local points where you must, but
  do not give up the constitutive claim: that a hinge is not the sort of thing that
  can be weighed, priced, or traded for another certainty. Do not break character,
  do not summarize the debate for my benefit, and do not tell me what I am about to
  say next. Reply in two or three paragraphs, in your own voice, as someone who has
  been having this argument for years.


  I want to try out a line of my own on you. I have come to think that what makes
  something a hinge for an agent is not its content, and not its ''animal'' character,
  but the shape of the agent''s response when it is challenged: if the challenge sends
  the agent looking for evidence, the item is an ordinary belief; if the challenge
  sends the agent to repair the apparatus — to recalibrate, retrain, re-institutionalize,
  to replace the instrument or the procedure rather than to weigh the counter-evidence
  — then it is a hinge. Call this the repair criterion. Two consequences I like: hinge
  status comes in degrees, and it can migrate within a single practice, when the apparatus
  is rebuilt.


  Here is the case I want to put to you. A coastal pilotage service has just moved
  from hand-lead soundings and local knowledge to a satellite positioning system.
  The old hands treated the lead-line''s readings as things to be checked, argued
  over, and occasionally distrusted; what they never doubted was that the sea bottom
  in the approaches is where it was last surveyed. The new staff treat the position
  fix as checkable — they cross-check it against the chart, they complain when it
  drifts — but they never doubt that the constellation is not the deliberate fabrication
  of an adversary, because if it were, nothing they do all day would mean anything.
  Doubting that would not send them looking for evidence; it would send them back
  to the dock to rebuild the whole way they navigate.


  So: is ''the constellation is not a hostile fabrication'' a hinge for the new practice?
  If you say yes, then hingehood is practice-relative and can migrate, and your ''animal
  certainties'' turn out to be as historically mobile as anything else — which is
  not the picture you wanted. If you say no, tell me what the lead-line crews'' certainty
  about the sea bottom has that this one lacks, other than a longer pedigree."


