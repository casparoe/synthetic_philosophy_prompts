  Let me think about what the teaching plan needs: order of ideas, carrying example,
  misconceptions, check for understanding, what to leave out. The conceptual dependency
  structure:


  1. Start with the pre-theoretic "function" talk and why it seems to imply normativity/teleology
  — "the heart is supposed to pump blood; a heart that can''t is defective." Contrast
  with "the heart makes a noise" — noise is not a failure when absent. So function-talk
  carries a normative/teleological dimension that mere causal contribution doesn''t.

  2. Distinguish function as "what it does" (causal role / Cummins) vs. function as
  "what it was selected for" (etiological / selected effects).

  3. Causal-role account: function of a part = its contribution to a capacity of the
  containing system of interest (analysis is relative to a system and a capacity —
  the heart''s function in the circulatory system is pumping; in the "noise-making
  system" of a predator''s prey-locating, it''s making noise). This relativity is
  the key to seeing why causal-role accounts can''t deliver normativity directly (needs
  a privileged system/capacity choice, or a notion of health/normal functioning).

  4. Etiological account: function = effect for which the trait was selected (or which
  explains its presence via a selection history). Delivers normativity via history:
  a malformed heart is defective because it fails to do what hearts were selected
  to do.

  5. Payoff: what each account says about standard hard cases: vestiges, exaptations
  (a trait co-opted for a new use — selection history for old use, current maintenance
  for new use), novel traits (selected for E from the first generation — function
  at t0?), trait drift, "spandrels", malfunction (a heart that can''t pump — etiological
  says it has a function it fails to perform; causal-role says function is the contribution
  it actually makes, so a broken heart''s "function" is whatever it does now), and
  "no selection at all" cases (swampman, engineered organs, traits of a species that
  just appeared).

  6. Deeper: the two accounts aren''t just rival answers; they answer different questions
  (explanation of presence vs. analysis of a system''s capacities), so "which is right"
  may be partly a question about what we want function-talk for (medicine, teleosemantics,
  trait classification, engineering). Godfrey-Smith''s "modern history theory" is
  a hybrid; propensity accounts (Bigelow & Pargetter) say a function can be assigned
  to a novel trait based on its disposition to be selected — that''s a nice "unoccupied
  middle" idea.


