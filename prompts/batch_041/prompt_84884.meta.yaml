  The crux: Thomson''s argument is about the limits of a right to life (no right to
  be sustained by another''s body), while Marquis''s future-like-ours is about the
  wrongness of killing (deprivation of a valuable future). Students typically think
  these are rival views on the same question ("is the fetus a person?"). The real
  crux: they''re answering different questions, and Marquis''s argument, if sound,
  gives the fetus a *right to life* in a sense that doesn''t yet settle whether it
  may use the woman''s body; conversely Thomson''s argument grants the fetus a right
  to life and still permits abortion. Where they actually collide: (a) Marquis''s
  account implies that the wrongness of abortion varies with the value of the future
  the entity would have — so it might permit abortion for a fetus with a condition
  that entails a future not worth living, and it makes the wrongness of early abortion
  nearly as great as late (which conflicts with common intuitions), and it faces the
  contraception problem (if contraception prevents a future-like-ours, is contraception
  wrong?) — Marquis''s reply (identity: contraception doesn''t harm anyone because
  it doesn''t deprive an existing subject; the "subject" must be a determinate entity).
  And (b) whether the deprivation account can ground a *right* that requires the woman
  to sustain the pregnancy — Marquis''s account is about the *wrongness of killing*,
  and if the fetus dies through abortion, deprivation occurs; but Thomson''s point
  is about what the right to life entails, not whether killing is pro tanto wrong.
  So a sophisticated answer: they''re compatible if we distinguish "the wrongness
  of killing" from "the permissibility of using another''s body", and the real conflict
  is over the *weight* — whether the deprivation gives the fetus a claim that outweighs
  bodily autonomy.


