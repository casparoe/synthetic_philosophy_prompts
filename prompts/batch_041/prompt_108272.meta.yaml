  Concrete design:


  Materials: 16 sealed envelopes each containing three cards: A, B, A+ (A with one
  small change described at the bottom, e.g., a marginally better commute, or one
  extra evening a week). A ledger sheet per participant with three verdict lines.
  Three labeled trays: A is better / B is better / neither is better and they are
  equal. Plus one unlabeled tray left on the side table.


  Phase 1 (15 min): read A and B, write a one-sentence reason for your leaning, file
  verdict on line 1: is A better than B, is B better than A, or are they equal (no
  fourth option; if you can''t answer, you must write why on the back — the auditor
  collects).

  Phase 2 (15 min): open the A+ card. Rule: A+ is A with a small improvement; everyone
  must grant A+ is better than A. File verdict on line 2: is A+ better than B? Rule:
  if you answer yes, you must say what the improvement tipped; if no, you must say
  what the improvement failed to touch. (Most say no.)

  Phase 3 (20 min): the auditor — one participant per table, a clerk who only reads
  back the ledger, no arguing — returns each ledger with lines 1 and 2 underlined
  and asks the participant to complete line 3: are A and B equal? (Because if they
  were equal, and A+ is better than A, then A+ would be better than B; but you just
  said it isn''t. So not equal. And not better, not worse.) Then: place the A/B pair
