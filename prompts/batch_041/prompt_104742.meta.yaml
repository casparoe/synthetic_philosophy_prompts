  Draft:


  "Marcus Aurelius died in 180 CE, eighteen centuries before anyone spoke of a ''modern
  Stoicism'' movement. Imagine that he could be brought forward to observe the contemporary
  revival that trades under his name — the best-selling manuals and Stoicism-themed
  apps, the online ''Stoic week'' exercises, the corporate resilience and leadership
  training that borrows his vocabulary, and the popular formula usually called the
  dichotomy of control. Write a substantial essay predicting what he would have made
  of it.


  The essay should be a set of concrete predictions rather than a general account
  of ancient Stoicism. Address at least the following, and reach a verdict on each
  — endorse, reframe, or reject:


  1. The dichotomy of control as it is usually taught: the injunction to sort everything
  into what is and is not up to us, to focus on the former and accept the latter,
  and to attach one''s wellbeing to effort rather than outcome. Consider in particular
  the three-way version prominent in the revival, which separates what is wholly up
  to us, what is not up to us at all, and what is up to us only in part, and consider
  whether the popular use of the distinction as a technique for managing anxiety and
  expectations is faithful to the role the distinction plays in the Discourses and
  the Enchiridion.


  2. The claim, often made in the revival, that Stoicism is the philosophical ancestor
  of cognitive-behavioural therapy — that its central insight is that people are disturbed
  not by events but by their judgements about them.


  3. The objection that the dichotomy of control, as commonly taught, encourages quietism:
  that it gives people a respectable reason to disengage from politics and collective
  action. (A concrete version: someone who declines to act on a public injustice on
  the grounds that the outcome is not up to them, while practising negative visualization
  and voluntary discomfort as private self-optimisation.) Would he accept that the
  popular reading licenses this, and would he think the criticism lands on the ancient
  doctrine or only on the modern packaging? Bring in the Stoic resources that bear
  on it — the discipline of action as distinct from the discipline of desire, the
  practice of acting with a reservation, and the cosmopolitanism that runs through
  his own notebooks.


  4. The whole enterprise of packaging Stoicism as a technology of personal tranquility,
  detached from the physics, logic and cosmology that the school treated as integral
  to it.


  5. Whether he would have recognised the revival as Stoicism at all, or regarded
  it as one more of the schools of happiness he thought he had seen through.


  Make the predictions specific and argued: cite the features of his situation and
  temperament — the emperor''s public duties, the private and unsystematic character
  of the notebooks, the repeated injunctions to get up and do the work of a human
  being and a Roman — that make each verdict plausible. Where you predict he would
  object, say what he would put in its place. Do not hedge the whole essay into ''he
  might have thought many things''; commit to a reading and defend it. You are predicting,
  not quoting: do not put invented sentences in his mouth as though they were his,
  and do not present any modern book, author or date as a fact you are unsure of.
  Roughly 1,500 words."


