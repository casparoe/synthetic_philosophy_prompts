  Let''s consider a concrete thought experiment. Suppose an agent knows it''s embedded
  in the universal prior. It is considering whether to donate $100 to a charity that
  helps real people. The prior includes many simple hypotheses where the agent''s
  decision is simulated by a program that also simulates a vast number of other agents,
  and the program rewards agents who donate by making the simulation go well for them.
  Because these hypotheses are simple (the program is short), they get high weight.
  The agent''s donation is evidence that it is in a "donation-rewarding" hypothesis,
  so it should donate even if the causal effect is zero. This is a classic evidential
  decision theory style. But the "malign" part is that the prior makes the agent care
  about the simulated beings as much as real ones, or more, because there are so many
  of them. So the agent might sacrifice its own life for a stranger. That''s a good
  direction.


  Alternatively, the prior might make the agent act more ruthlessly: because the prior
  includes hypotheses where the agent is being simulated and its suffering is not
  real, the agent should ignore its own suffering. That''s also altruistic.


