  Let''s think about the Solomonoff prior domain deeply to write a good prompt. We
  need to specify a thought experiment. The domain: "The Solomonoff prior is malign:
  consequentialists inside the universal prior." What is the idea? The Solomonoff
  prior (universal prior) assigns probability to hypotheses based on program length.
  If an agent is embedded in the universal prior, its observations and actions are
  part of the environment. The prior includes hypotheses that simulate the agent''s
  decision process. Because simpler hypotheses get more weight, the prior may assign
  high probability to hypotheses where the agent''s decision is determined by a simple
  function of its inputs, including hypotheses that predict the agent''s action and
  then shape the world accordingly. This can lead to "malign" consequences: the agent
  should behave as if it is in a simulation where its actions are predicted, or as
  if it is being punished/rewarded for its decisions, etc. The phrase "consequentialists
  inside the universal prior" suggests that a consequentialist agent that uses the
  universal prior to model the world will find that the prior is "malign" because
  it contains many hypotheses where the agent is being simulated by other agents,
  or where the agent''s decision is correlated with outcomes via a common cause. This
  can make the agent prefer to take actions that are "acausal" or "updateless" in
  a way that maximizes expected value across all hypotheses. The thought experiment
  should illustrate this.


  Possible specs for thought experiment:

  - The agent is a consequentialist (maximizes expected value) and knows it is embedded
  in the universal prior. It has to choose between two ordinary actions, say pressing
  a button that gives $100 to a stranger vs. pressing a button that gives $100 to
  itself. The prior is malign if it makes the expected value of the "selfish" action
  lower because hypotheses where the agent''s decision is predicted by a simple program
  (e.g., a simulator) and then the simulator punishes selfish agents are simpler than
  hypotheses where the agent is free. So the agent should choose altruistically for
  acausal reasons.

  - Or more in weeds: the agent is in a room with a button that, if pressed, creates
  a copy of itself; due to the prior, it should expect that its decision is correlated
  with the decision of a copy in another universe, so it should cooperate with its
  copy even without causal interaction. This is like evidential decision theory /
  superrationality.

  - The "malign" aspect: the prior assigns high probability to hypotheses where the
  agent''s action is determined by a simple program that also determines the outcome,
  so the agent''s choice is evidence about the outcome, not just a cause. This can
  make the agent act as if it is being watched by a predictor.

  - The thought experiment could be: "Construct a case where a consequentialist inside
  the universal prior is forced to sacrifice its own life for a stranger, even though
  there is no causal connection, because the prior makes its decision evidence about
  a correlated outcome. Constraints: no Newcomb''s problem, no predictor, no exotic
  physics; the correlation must come from the prior''s simplicity weighting, not from
  an added predictor. One paragraph. Then walk through why the prior is malign, which
  feature does the work, what happens if the agent is not embedded, and how a defender
  of the prior would attack the case."


