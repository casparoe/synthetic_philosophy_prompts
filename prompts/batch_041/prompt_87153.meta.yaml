  a higher level it''s implementing a self-model, a global workspace, an aversive
  feedback loop, so there is something it''s like to be it. Same weights, same forward
  pass, same causal structure as far as the hardware is concerned. The disagreement
  doesn''t seem to be about the physical facts; it''s about which description of the
  computation is supposed to count for moral status. And then there''s a third move:
  someone says the high-level description is just a useful fiction we impose, so it
  can''t ground moral status, but the low-level description is also a description,
  so why does that one get to be the real one?


