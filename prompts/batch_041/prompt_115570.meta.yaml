  I am a philosopher of biology putting together a paper for a small workshop on explanation
  in evolutionary biology, and I want to spend it on a puzzle I cannot shake: the
  argument over adaptationism that Gould and Lewontin launched with their 1979 critique
  in the Proceedings of the Royal Society B — the one known ever since as the spandrels
  paper — has now been running for more than forty years, and it has a peculiar shape.
  Nobody defends the position that was actually attacked. The most common response
  from working biologists was that the critique was healthy and that it forced the
  field to be more careful about evidence, while adaptationist reasoning remains the
  default in practice; the pluralists, for their part, concede that selection is enormously
  important but insist that byproducts, constraints, and drift are systematically
  underdescribed. Both sides can point to the same forty years and claim vindication.
  What I want from you is not a verdict on who is right about organisms but a diagnosis
  of the disagreement itself: what kind of dispute this is, and whether there is anything
  that would move it.


