  ---

  I''m a statistician by training — did a decade of latent variable modelling, factor
  analysis, IRT, that kind of thing — and I''ve drifted into a job where I sit next
  to a bunch of ML people. So I keep overhearing this fight about whether neural networks
  really have representations, or whether the features people pull out with probes
  and dictionary learning are just artifacts of the tool. My gut says I''ve seen this
  film before: in factor analysis the loadings are only identified up to a rotation,
  so whatever factors you report are partly a product of the constraint you imposed
  to make the solution unique, and everyone shrugs and gets on with it. There''s also
  the older indeterminacy result where even with the loadings fixed the factor scores
  aren''t uniquely pinned down. Nobody concludes from that that factors are fake.
  They conclude you have to be explicit about which quantity you actually care about.


  So restate the main positions in the interpretability debate — the realist, the
  instrumentalist, and the deflationist "you''re all arguing about a choice of basis"
  one — as faithfully as you can in my vocabulary. Latent variables, parameters vs
  quantities of interest, identification, gauge freedom, equivalence classes, sufficient
  statistics, invariance under reparameterisation, and the difference between a thing
  being identifiable and being causally identified. Don''t smuggle my framework''s
  assumptions in and call it translation.


  Then the residue report. What goes through cleanly, what only survives with distortion,
  what has no counterpart at all. My suspicion is that the missing thing is something
  like content or aboutness — a statistic doesn''t mean anything, it''s just a function
  of the data — and if that''s right I want to know whether that''s my vocabulary
  failing or the philosophers inflating. Also two smaller things while you''re in
  there: the ML people keep distinguishing "you can decode X from the activations"
  from "the model uses X", which in my language sounds like informative vs. a mediator
  on the causal path — is that the right translation? And where does superposition
  go? An overcomplete dictionary is a perfectly normal object in my world, sparse
  coding, so I can''t tell if that''s supposed to be surprising.


  Finally: is my factor-analysis prior right, or is it missing something? A verdict,
  not a both-sides.

