  Dutch book argument: If an agent''s degrees of belief violate probability axioms,
  there exists a set of bets each of which she considers fair (or acceptable) such
  that taken together they guarantee a loss. Therefore rationality requires degrees
  of belief to obey probability axioms. Open questions:

  - Does the argument establish probabilism or only that one should avoid sure-loss?
  Is avoiding sure-loss a requirement of rationality?

  - The "depragmatized" Dutch book argument (Christensen) aims to avoid the assumption
  that utility is linear in money; it says if your credences violate probability,
  there is a set of bets such that you must regard the package as fair but it guarantees
  loss. Does that work?

  - Dutch book arguments for conditionalization (diachronic) face the "Dutch book
  argument for conditionalization" and objections about planning vs. changing preferences,
  "reflection principle", "the problem of old evidence", "Jeffrey conditionalization".

  - Countable additivity: Dutch book arguments only establish finite additivity; attempts
  for countable additivity require extra assumptions (e.g., "conglomerability") and
  may fail due to non-measurable sets or infinite bets. The "non-conglomerability"
  of finitely additive probabilities.

  - The "loss function" problem: Dutch book arguments assume that utility is linear
  in money, or that the agent''s preferences are representable by expected utility.
  But if the agent''s utility function is not linear, a guaranteed loss in money may
  not be a guaranteed loss in utility.

  - The "betting interpretation" of credence: does the Dutch book argument presuppose
  a behaviorist or decision-theoretic account of belief? If credences are not dispositions
  to bet, the argument doesn''t apply. This is the "belief vs. credence" issue.

