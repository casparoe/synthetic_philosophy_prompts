  "I''m a clinical ethics consultant at a mid-sized hospital, and I just had a long,
  slightly wine-fueled argument with my oldest friend about Hume''s essay on suicide.
  She thinks it''s just a period piece — an 18th-century guy being shocking — and
  that nothing in it could possibly help me when I''m on call. I think there''s actually
  a usable procedure buried in there, but I got tangled up trying to state it. So:
  act as a philosopher who also knows the practical constraints of a hospital ethics
  consult. Think carefully, and start by brainstorming the different arguments Hume
  actually makes in that essay and what each would imply for a bedside decision. Then
  turn the defensible ones into a decision procedure I could actually run on a consult.


  Here''s what I need. The procedure should be a checklist or ordered set of questions
  for a patient who is requesting that we stop life-sustaining treatment, or who is
  asking about assisted dying where it''s legal, or who is refusing food and fluids.
  It needs to say what counts as a sufficient answer at each step, where the procedure
  stops with a clear no, and where it has to hand the decision to a person because
  the question is one of values rather than facts. I don''t want a bibliography, reading
  list, or citations — I know the essay, and I can''t use them at the bedside anyway.
  I want the operational core.


  The hard cases I need it to handle: (1) a patient with a terminal illness and intractable
  pain who says they''re ready to go; (2) a patient who says they want to die because
  they don''t want to be a burden on their family; (3) a patient who says God forbids
  suicide but they want to die anyway; (4) a patient whose request seems to be driven
  by untreated depression, but who insists it isn''t. For each, show me how the procedure
  runs and where it either gives an answer or gets stuck. I especially want you to
  include one case where the procedure gives an answer I won''t like — maybe where
