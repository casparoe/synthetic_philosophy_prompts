  ---


  I am a software engineer with no formal training in philosophy, and I would like
  help thinking through something that has bothered me about a routine part of my
  work.


  At the company where I work, and at essentially every consumer software company
  I know of, a user consents to the terms of service by clicking a button at sign-up.
  Those terms typically include a clause stating that the company may revise them
  at any time and that the user''s continued use of the service after a revision constitutes
  acceptance of the new terms. Nothing about the revision is surfaced to the user
  beyond, at most, a banner; in practice, most users never learn that anything changed.
  In the same company, however, if we want an employee to appear in a recruiting video,
  or to give up the right to sue, we require a signed form, we explain the document,
  and we treat a failure to respond as a refusal rather than as agreement. We do not
  consider silence to be agreement when the stakes are ours.


  I would like a philosophical reconstruction of what our practice of online consent
  presupposes, rather than a list of reforms.


  Specifically:


  1. What theory of consent does "continued use constitutes acceptance" presuppose?
  Does it presuppose that consent is an act of authorization that can be given without
  awareness of what is being authorized, or does it presuppose something weaker --
  that consent is a social convention we may define as we like, or that the operative
  moral work is done not by consent but by something else (notice, fair warning, the
  user''s opportunity to leave)? Is what we are calling consent actually a waiver,
  and if so, does that change what has to be true for it to be valid?


  2. Can consent to an unspecified future use of one''s data or one''s labor be valid
  at all, or is "advance consent to unknown terms" a category mistake? If it can be
  valid, what has to be true of the person and the situation for it to be?


  3. Which rival theories of valid consent does the practice rule out? For instance,
  does it require rejecting a requirement that consent be informed, or only a particular
  reading of "informed"?


  4. Does the practice''s presupposition actually hold together across its parts?
  Consider that the same firm relies on contemporaneous, documented, revocable consent
  in its HR practices. Is the difference a difference in the underlying theory of
  consent, or in the costs of error, or in who bears the burden? Reconstruct the most
  charitable unified theory, and then say whether it survives.


  5. Finally, if I replaced the presupposition with a stricter one -- that consent
  requires contemporaneous, informed, and revocable agreement, and that silence is
  never agreement -- what would have to change in the design of the sign-up flow,
  the revision process, and the business model that depends on the current arrangement?
  Which changes are merely inconvenient and which would make the practice impossible?


  I am interested in where the practice is philosophically underdetermined -- that
  is, where several different theories of consent would license exactly what we do,
  so that the practice itself does not settle the question.


  ---


