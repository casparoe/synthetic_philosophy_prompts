  I should verify a couple of specifics about the Löbian obstacle to make sure I''m
  accurate. Key facts: Löb''s theorem (1955, Martin Löb): if PA proves "if Prov(⌜A⌝)
  then A", then PA proves A. The Löbian obstacle to self-trusting agents: from Löb''s
  theorem, an agent using a formal system that reasons about itself can''t consistently
  believe "if I believe X then X is true" for arbitrary X — because such a schema
  (reflection principle) would let it prove anything provable. More precisely, the
  schema Prov(⌜A⌝) → A is not provable (for A = contradiction) unless the system is
  inconsistent; the set of instances {Prov(A)→A} together with the system proves everything
  it can prove (via Löb), so the schema adds nothing but is also self-defeating for
  justification. Related: Gödel machine (Schmidhuber), "tiling agents", the "Löbian
  obstacle" term from Yudkowsky & Herreshoff "Tiling Agents for Self-Modifying AI"
  (2013). Also Christiano et al. "Definability of Truth in Probabilistic Logic" (2013).
  Also the "Vingean reflection" problem. Fallenstein & Soares. Also note: Löb''s theorem
  is a formalization of "the surprise exam"? no, that''s different.


  Key conceptual points: the difference between Gödel''s incompleteness (there''s
  a true-but-unprovable sentence) and Löb''s theorem (if the system proves "provable(A)
  → A", then it proves A). Intuition: Löb''s theorem says a system can only trust
  itself about A if it already knows A. Hence the "Löbian obstacle": an agent can''t
  have a general policy of trusting its own future conclusions (needed for self-modification
  / tiling agents), because such self-trust schema would be inconsistent. The standard
  workaround: restrict to a subclass (e.g., bounded proof search with a "tiling" scheme),
  use probabilistic logic, or accept that the schema must be weakened (e.g., only
  for statements of a certain complexity, or with a limited trust horizon).


