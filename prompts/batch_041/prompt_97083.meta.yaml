  "I have been working through Kierkegaard''s Fear and Trembling on my own, without
  any training in philosophy, and the part I keep returning to is the claim that Abraham''s
  readiness to sacrifice Isaac cannot be justified in ethical terms at all: on the
  ordinary moral accounting he is a would-be murderer, and Kierkegaard''s suggestion
  is that he is nonetheless justified because the individual, as an individual, can
  stand in a relation to the absolute that outranks the universal law. I understand
  the move well enough in outline. What I cannot work out on my own is what follows
  from it, and I would like you to set out the most important implications of the
  doctrine — not a summary of the book, but the consequences, including the ones Kierkegaard
  himself may not have drawn.


  Three things I would especially like you to press on, because they are where the
  idea seems to do real work rather than just sound dramatic. First, the suspension
  appears to be a suspension for one person on one occasion, and the book says almost
  nothing about what the next morning is like; I want to know whether the implication
  is that such a suspension can be a standing condition of a life or only a single,
  unrepeatable moment, and what difference that makes to how we could ever live alongside
  someone who claims it. Second, the man in question cannot explain himself — if he
  speaks, he becomes either a murderer in our eyes or a madman, and if he stays silent
  we cannot tell the difference between him and a fanatic, so the doctrine seems to
  imply that the ethical community is constitutively unable to distinguish faith from
  derangement; I want to know whether that is a defect Kierkegaard failed to notice
  or the whole point, and what it implies for how we are entitled to judge people
  whose reasons we cannot share. Third, the story depends on a divine command that
  the rest of us cannot verify, and I live in a world where no such command is available;
  I want to know what survives of the structure if the summons is felt as unconditional
  but is not credited to God — whether we are left with something recognizably like
  faith or only with a license for any intensity of conviction.


  Beyond those, please tell me what else follows: for the reality of moral conflict,
  for the idea that some duties might be overridden rather than cancelled, for the
  difference between Abraham and the tragic hero who sacrifices a child for the city
  and can be understood, and for what it would mean for a person to be genuinely responsible
  for an act that no rule could have required of them. I would rather have a small
  number of implications worked out carefully, with the reasoning shown, than a long
  list."


