  Defeaters to rank:

  1. No-trade theorems (Milgrom–Stokey; also Tirole; "no trade" results): if agents
  have a common prior and the only difference is private information, then a rational-expectations
  equilibrium has no trade. So prices cannot incorporate information through trade
  at all when information is the only heterogeneity. This is a serious internal problem
  for the "prices aggregate information" story — it shows the aggregation must come
  from something else (noise, liquidity, endowment differences, heterogeneous priors).
  But a defender would say: real markets have all of those, so no-trade theorems don''t
  apply; they''re an impossibility result about a special case.

  2. Grossman–Stiglitz paradox: if prices perfectly reflect information, no one has
  an incentive to acquire costly information; so equilibrium prices can only partially
  reveal information. Counts against the strong "prices are efficient" claim. Defender:
  partial revelation is still revelation; and it just means markets are noisy, not
  that they''re uninformative.

  3. Selection / "the market''s verdict" is only a verdict on what can be traded and
  priced; markets can''t price things with no counterparty, and prices can be moved
  by people who are wrong but rich (no-trade doesn''t rule out disagreement with heterogeneous
  priors — actually heterogeneous priors generate trade but then the price is not
  a truth-tracker, it''s a weighted average of beliefs weighted by wealth and risk
  tolerance). This is a good one: the "beauty contest" — prices reflect beliefs about
  beliefs, not about the world.

  4. Manipulation / "the market is a mechanism that can be gamed" — prediction markets
  can be moved by large trades, and there''s the "longshot bias" and the fact that
  in some markets the price is set by the marginal trader who may be uninformed.

