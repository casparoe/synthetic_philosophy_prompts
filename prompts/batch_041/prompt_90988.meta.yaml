  Things that translate: the anti-skeptical argument as an argument that the likelihood
  ratio between the "hand" hypothesis and the "vat" hypothesis is 1 for the evidence
  in question (since the skeptical scenario is stipulated to produce the same evidence),
  so the posterior ratio equals the prior ratio; hence Moore''s confidence must be
  a prior commitment. The "hinge" propositions ≈ the assumptions that make any inference
  possible (no free lunch; you can''t test a model class from inside). The skeptic''s
  "you can''t rule out the alternative" ≈ the fact that a hypothesis that predicts
  every observation equally well is unfalsifiable/unidentifiable from the data; the
  skeptical hypothesis is observationally equivalent, so identifiability fails, and
  you need a prior. Moore''s insistence that his premises are known "without proof"
  ≈ a prior with a certain structure, or a model assumption that isn''t estimated.


  What doesn''t survive: (1) Knowledge isn''t credence: Moore''s claim is a claim
  to knowledge/certainty, and probability 1 is not knowledge; the framework has no
  way to represent the difference between "I assign prior ~0" and "I can''t seriously
  entertain the alternative". (2) Moore''s proof is not probabilistic inference at
  all: it''s a deduction from a premise, and the whole issue is whether one can *know*
  the premise; the probabilistic restatement converts the question "can you know this?"
  into "what prior do you have?", which changes the subject. (3) The epistemologists''
  debate about transmission of warrant / whether the argument begs the question has
  no counterpart: in the probabilistic framework, the premise''s probability being
  high doesn''t require the conclusion''s; there''s no "epistemic priority" relation
  — the framework is order-insensitive, whereas the skeptical argument depends on
  the order of epistemic dependence (can''t know the premise without already knowing
  the conclusion). (4) The framework treats the skeptical scenario as just another
  model in the space; the philosophical point may be that it is not a hypothesis at
  all but a different account of what evidence is. Also: the statistical framework
  has a "level" (the model space is specified in advance, and hypotheses are compared
  within it), whereas the Moorean/skeptical debate is precisely about whether the
  evidence can be characterized independently of the world-hypothesis — the skeptic
  says no.


