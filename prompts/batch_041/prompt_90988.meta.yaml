  Moore''s proof: Moore holds up two hands, says "Here is one hand, and here is another;
  therefore two hands exist; therefore an external world exists." He claims this is
  a rigorous proof: the premises differ from the conclusion, the conclusion follows,
  and he knows the premises without knowing the proof of the premises. The skeptical
  rejoinder: you can''t know the premise without already knowing the conclusion (the
  premise entails the existence of external things, and knowledge requires ruling
  out alternatives — but Moore denies that).


  Restated in Bayesian/statistical vocabulary: The statistician has data D (the visual
  experience, the apparent hand), hypotheses H1 (there is a hand) and H2 (skeptical
  scenario: brain in a vat, hallucination). Likelihoods P(D|H1) ≈ P(D|H2) if H2 is
  constructed to mimic H1 exactly — so the likelihood ratio is 1, and the posterior
  ratio equals the prior ratio. So "knowledge" requires a prior favoring H1; the proof,
  restated, is an assertion that the prior on the skeptical hypothesis is negligible
  or that we''re entitled to certain "hinge" priors. The residue: (a) Moore''s proof
  isn''t probabilistic at all; he claims knowledge of the premise as a matter of certainty,
  not high credence. (b) The Bayesian framework has no natural representation of "I
  know this without being able to prove it / without ruling out alternatives" — unless
  via dogmatism about priors. (c) The Bayesian framework treats the skeptical hypothesis
  as just another hypothesis with a likelihood; but for the skeptic, the "hypothesis"
  is empirically equivalent — and the framework has no way to distinguish "empirically
  equivalent hypothesis with tiny prior" from "mere logical possibility with no content".
  Also (d) the framework makes the disagreement look like a disagreement about priors,
  which is exactly what the epistemologist says is not the issue (Moore doesn''t think
  he''s assigning a prior). Also the "transmission of warrant" issue: does the warrant
  for "here''s a hand" transmit to the conclusion — under a probabilistic reading,
  transmission is trivial (deductive closure of probability), which suggests the epistemology
  debate is about something else, e.g., epistemic entitlement vs evidential support.
  Also (e) the "assurance"/"entitlement" view (Wright) has a counterpart in the ML
  vocabulary of "the assumptions that make inference possible at all" / "the model
  class" / "no-free-lunch". Actually the no-free-lunch theorem is a nice translation
  of hinge propositions: induction requires assumptions not themselves justified by
  data. Hmm, that''s a nice thing to ask the model to work out.


