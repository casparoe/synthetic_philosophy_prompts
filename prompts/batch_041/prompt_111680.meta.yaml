  of the same inputs, their outputs are logically correlated. This is related to "logical
  correlation" and the "robustness" issue (the other might not be a perfect reasoner).
  I''m on solid ground.


  Also Dana''s point about tautology: is that fair? Somewhat — the superrationalist''s
