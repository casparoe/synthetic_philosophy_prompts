  Hmm, careful: Dana''s point 2 says "unless p is 1, defecting eventually wins as
  the stakes scale up" — is that right? In a PD with fixed payoffs, defecting wins
  when p < some threshold, which is determined by payoffs, not stakes scaling. In
  a PD (T > R > P > S), cooperation expected payoff = pR + (1−p)S; defection = pT
  + (1−p)P. Cooperate better iff p(R−T) + (1−p)(S−P) > 0, i.e., p(T−R) < (1−p)(P−S),
  i.e., p/(1−p) < (P−S)/(T−R). So cooperation is better iff p < (P−S)/((P−S)+(T−R)).
  So there''s a threshold p* = (P−S)/(P−S+T−R) < 1. So "unless p = 1, defecting eventually
  wins" is not right as stated — there''s a threshold below 1. Hmm, actually cooperation
  is better when p is high enough (above threshold? let''s check: if p = 1, cooperation
  better since R > P. Yes, so cooperation better for p above threshold p*.) So Dana''s
  claim should be: "once p is below some threshold, defecting wins" — that''s correct
  and a decent point. Actually she can say: unless you''re certain they''ll cooperate,
  there''s some payoff structure where defecting is better; the point is that cooperation
  requires p above a threshold that can be arbitrarily close to 1 depending on payoffs.
  Let''s phrase: "and she said the interesting question is what p you should assign,
  and that the answer had better be 1 or the cooperate recommendation starts to look
  fragile, because for any p short of 1 you can rig the payoffs so defecting wins."


