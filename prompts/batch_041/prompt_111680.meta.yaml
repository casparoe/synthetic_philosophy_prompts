  of your decision; the evidentialist/correlation reading is right but the causalist
  complains it''s not a "real" cause — but the superrationalist says in the identical-agent
  case the decision is a shared object. Actually Hofstadter''s argument: if you''re
  both superrational, you both cooperate. He explicitly notes it only works with identical
  agents; he considers "if you''re 99% sure the other is superrational" and gets into
  the lottery/wolf cases. Also there''s the objection that the superrationalist''s
