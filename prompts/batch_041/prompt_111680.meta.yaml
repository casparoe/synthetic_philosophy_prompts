  Move 1 (Ravi): In a one-shot PD between two reasoners who know each other''s reasoning
  is the same as their own, cooperating is the only rational choice. Not because of
  repetition or reputation, but because the same deliberation runs in both heads;
  your decision is a logical consequence of the argument, and so is theirs. If you''d
  defect, that''s because defection looked better to you — and the same argument would
  look better to them, so you''d both defect and get the worse payoff. Choosing the
  action that your choosing it tends to bring about on the other side is just taking
  your own reasoning seriously. Superrationality.


  Move 2 (Dana): That''s just evidential decision theory in a trench coat. "My choosing
  it tends to bring it about" is the evidentialist''s line, and it has the standard
  problem: correlation without causation is not a reason to act, because what you
  actually get is determined by your action and the other player''s action; the other''s
  action is fixed or not, independent of the counterfactual difference you make now.
