  Prompt: "I write a column on science and ideas, and I''m working on a piece about
  the recent revival of interest in akrasia. A behavioral economist I interviewed
  made a claim that has stuck with me: that weakness of will is just hyperbolic discounting
  under another name—that when we procrastinate, break diets, or abandon exercise,
  we are simply reversing our preferences because the value of the immediate reward
  is discounted more steeply than the future one. On his view, the ancient problem
  of akrasia is a special case of intertemporal choice, and the remedy is whatever
  reduces the discount rate or commits the future self: Odysseus lashing himself to
  the mast, automatic savings, pre-commitment apps. I''m half convinced, but something
  feels off. For one thing, I can act against my own judgment when no future reward
  is at stake at all—say, I decide that I will not check my phone during a conversation,
  and then I check it, not because the phone''s value has ballooned but because the
  intention itself seems to evaporate in the moment. For another, the economist''s
  story makes akrasia sound like a mistake about timing, whereas the philosophers
  I read treat it as a failure of the will to follow the practical judgment one still
  endorses. So I''d like you to help me understand what is actually going on. Is my
  friend''s reduction of akrasia to hyperbolic discounting defensible, or is it a
  category mistake? If it is a mistake, what exactly is the difference between the
  kind of preference reversal studied in intertemporal choice experiments and the
  kind of action-against-better-judgment that the tradition calls akrasia? And what
  would each diagnosis imply about the remedies—commitment devices, self-binding,
  reappraisal, or something else? I''m not looking for a literature review; I want
  the conceptual map."


