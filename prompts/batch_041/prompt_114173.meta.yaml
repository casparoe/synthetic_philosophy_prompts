  Hmm, also a possible risk: is it true that Lewis requires "arbitrariness"? Yes:
  a regularity R in behavior is a convention iff (1) everyone conforms, (2) everyone
  expects everyone else to conform, (3) everyone prefers to conform given others conform
  (because the situation is a coordination problem and uniform conformity is a coordination
  equilibrium), (4) there is at least one alternative regularity that also satisfies
  (1)-(3), (5) conditions 1-3 are common knowledge, (6) all of the above is common
  knowledge. Roughly. The alternative-regularity condition is the "arbitrariness"
  requirement. Good.


  Also Lewis''s point: conventions can be created by agreement, but agreement presupposes
  a convention of promising (and a shared language) — so there''s a regress; his solution
  is that some conventions arise from salience/focal points in repeated situations,
  not from agreement. That''s a nice piece to bring in: the Swedish case is a convention
  created by a decision, and Lewis says decisions can create conventions (his "conventions
  of the second kind"? no...). Lewis distinguishes conventions generated by agreement
  vs. those that grow up gradually. He does allow that an agreement can make a convention,
  but then the agreement itself relies on prior conventions (promising). Good material.


  Also, I want a wrinkle that pushes back on the theory: Lewis''s analysis treats
  convention as sustained by interest and expectation alone; the Swedish case shows
  the state manufacturing common knowledge on a national scale — which is an odd input
  for a theory of "spontaneous" order. Also: the temporary nature of the safety gain
  suggests the new rule was not intrinsically better; what changed was common knowledge
  + salience. And the fact that the old rule was stable for decades despite the border
  externality shows that coordination conventions can persist when a superior alternative
  exists, which challenges the "conventions are efficient/instrumental" reading.


  Also, the metro/rail point: rail traffic still drives on the left — because the
  rail coordination problem is solved by signals and centrally-set rules; drivers
  don''t need to form expectations about each other''s behavior, they need to obey
  the signal. So Lewis''s account predicts that where the coordination is solved by
  an external device, no convention in his sense is needed; that''s a "the theory
  was right, but the case is outside its scope" verdict. Nice.


