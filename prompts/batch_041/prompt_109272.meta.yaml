  - The ask: give me the most important implications for practice — not a summary
  of Rorty, but what actually changes at the desk. Number them if you like.

  - Specific sub-questions: does antirepresentationalism kill realism as a project?
  What does "accuracy" mean for me now (only internal to a vocabulary? just use-value)?
  Does it undercut my instinct that some descriptions are better because they''re
  truer — e.g., that describing a massacre is more true than a euphemism? Rorty would
  say better because more useful for some purpose; for what purpose?

  - The cruelty/redescription tension: Rorty''s own worry about ironist redescription
  humiliating people, and the private/public split — is my novelizing of other people''s
  pain self-creation or cruelty? Give me a usable line.

  - The Orwell/Nabokov material: Rorty thinks Orwell''s descriptions of cruelty do
  the work that his argument can''t. What exactly is the work, and can I do it on
  purpose? If the moral force of the novel comes from descriptions that move you rather
  than arguments that convince you, is that a technique or a con?

  - Also: solidarity vs objectivity — Rorty says we should aim at solidarity, expanding
  the "we". As a novelist, does that mean my job is to widen the "we"? What does that
  ask of me that propaganda doesn''t? Or is the difference between my novel and propaganda
  just... which "we"?

  - And ask: where does Rorty''s view get in my way? What should a novelist not take
  from him. (Honest.)

  - Deliverable: most important implications, ordered, concrete, at-the-desk, and
  flag which ones are Rorty''s own vs my extrapolation.


