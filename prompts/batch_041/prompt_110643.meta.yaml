  don''t hold me to the label.


  The setup: epiphenomenalism says brain states cause experiences, but experiences
  themselves cause nothing downstream — they''re inert byproducts of the neural goings-on.
  Fine, that''s coherent enough on its face. Now the tangle. Right now I can form
  the judgment that I''m having a slightly throbbing, reddish-dusk sort of visual
  experience, and that judgment is roughly accurate. But if the experience is causally
  inert, it isn''t what caused my judgment about it. So either (a) the accuracy of
  my phenomenal judgments is a staggering coincidence, or (b) the judgments are caused
  by the brain states that also cause the experiences — in which case my judgments
  are tracking the brain states, not the experiences, and it''s unclear what the experience
  is contributing. And (c) is the nasty one: the epiphenomenalist''s evidence for
  his own view is exactly his introspective judgments, so if the judgments float free
  of the experiences, the view seems to eat its own tail.


  What I want from you is a dialogue between two philosophers, A and B, where A defends
