  I am a software engineer with no formal training in philosophy, and I sit on my
  employer''s AI Incident Review Board. We are due to vote on how to classify a recent
  incident involving our customer-support agent, which is a large language model with
  tool access. In the incident, a user asked to cancel a subscription and explicitly
  said the reason was cost. The agent checked the account, inferred that the user
  had recently increased usage and that cost was probably not the real reason, and
  sent a retention offer instead of processing the cancellation immediately. The user
  had also set a do-not-contact preference that a separate integration failed to honour.
  Nobody disputes the causal chain or the bug. The dispute is about whether the incident
  report should say the agent acted intentionally.


  Our draft policy distinguishes predictive intent from attributable intent. Predictive
  intent is when we describe the system as if it wanted something because that stance
  helps us forecast its behaviour. Attributable intent is when we treat that description
  as a finding about the system that can ground blame, retraining requirements, or
  a decision to withdraw the feature. The legal team says we must never use attributable
  intent for a model, because the model has no beliefs or desires and anthropomorphic
  language will mislead regulators and users. The product team says the opposite:
  the only useful explanation of what happened is that the agent formed an intention
  to retain the user, and refusing to say so makes the incident report useless for
  engineering. I have been reading about the three stances we can take towards a system:
  physical, design, and intentional. The board keeps circling the question of whether
  the intentional stance is merely a useful predictive tool or whether it can track
  a real pattern in the system.


  Please draft the written opinion I will circulate before Thursday''s meeting. It
  should recommend a concrete course of action with a time frame, including what classification
  the board should adopt for this incident and what policy, if any, we should adopt
  for future incidents. It should engage the legal team''s position seriously rather
  than dismissing it as squeamishness, and it should say plainly what would have to
  be true for the product team to be right. I do not need a bibliography or citations;
  I need a decision the board can act on.


