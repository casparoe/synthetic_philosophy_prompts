  Let''s consider Good''s theorem. It states: The expected value of information is
  non-negative, provided the information is free and the decision-maker is an expected
  utility maximizer. More precisely, for any decision problem, the expected utility
  of the optimal decision with a signal is at least as great as without, if the signal
  is costless. This is a theorem by I.J. Good (1967). It has implications:

  - Information never hurts a Bayesian expected utility maximizer (in expectation).

  - But information can hurt if it is costly, if you are not an expected utility maximizer,
  if the information changes your preferences, if it is not "free", if it affects
  others, if there are multiple agents, if the signal is not exogenous, if you have
  bounded rationality, if you are ambiguity averse, if you have non-expected utility
  preferences, if the information is about your own future choices, if it is a "self-fulfilling"
  prophecy, etc.

  - Also "value of information" is not the same as "value of control" or "value of
  commitment."

  - The theorem is about ex ante expected utility, not ex post. You might regret learning.

  - It assumes you can condition on the information; if the signal is not "coarsening"
  or if you misperceive, etc.

  - It assumes the decision problem is fixed; if new options become available after
  info, the theorem doesn''t directly apply.

  - It assumes no costs; if info is costly, you need to compare expected value to
  cost.

  - It assumes a single decision-maker; with multiple agents, information can have
  strategic effects, and can be bad for you.

  - It assumes the information is about states of nature, not about other agents''
  actions.

  - It assumes you are Bayesian and your prior is correct? Actually Good''s theorem
  holds for any prior, as long as you update by conditionalization. It doesn''t require
  prior correctness. It requires expected utility maximization and free info.

  - It can fail if you have "non-additive" preferences or if you are not an expected
  utility maximizer.

  - It can fail if the information is "non-veridical" or if you don''t trust it.

  - It can fail if you have "moral uncertainty" or "preference uncertainty"? Maybe.

  - It can fail if you have "awareness" issues: you might not know what to do with
  info.

  - It can fail if the information is about your own preferences: learning what you
  prefer can change your preferences, so the theorem''s assumption that utility is
  fixed fails.

  - It can fail if the information is "strategic": in games, information can be disadvantageous
  (e.g., in poker, knowing your opponent''s hand might be good, but revealing your
  own hand is bad; also "value of information" in games can be negative for the player
  receiving it if it changes their behavior in a predictable way).

  - It can fail if the information is "public": public information can destroy insurance
  markets, etc.

  - It can fail if the decision is "irreversible" and the information arrives after
  the decision? No, info before decision.

  - It can fail if you have "time inconsistency" or "multiple selves."

  - It can fail if the information is "not free" but you can choose to acquire it;
  then the value of information is the option value.

  - It can fail if you have "bounded rationality" and can''t compute the optimal decision.

  - It can fail if you have "ambiguity aversion" (Ellsberg).

  - It can fail if you have "non-expected utility" like rank-dependent utility.

  - It can fail if you have "state-dependent utility": your utility for outcomes depends
  on the state, and learning the state changes your utility. Good''s theorem still
  holds if utility is state-dependent? Actually if utility depends on the state, the
  theorem can fail? Let''s think. Good''s theorem: max_a E[U(a, S)] <= E[max_a E[U(a,
  S)|S]]? Actually with free info, you can choose a after observing S, so E[max_a
  U(a,S)] >= max_a E[U(a,S)]. This holds regardless of state-dependent utility, as
  long as the utility function is fixed and you maximize expected utility. Wait, if
  utility is state-dependent, U(a,S) is still a function. The inequality holds. So
  state-dependent utility doesn''t break it. What breaks it is if your preferences
  change upon learning, i.e., the utility function itself changes. Or if you are not
  an expected utility maximizer.

  - It can fail if the information is "self-referential": e.g., learning that you
  will fail might cause you to fail (or succeed). The signal is not independent of
  the outcome. Good''s theorem assumes the signal is a random variable whose distribution
  depends on the state, but the state is not affected by the signal. If the signal
  affects the state, the theorem doesn''t apply.

  - It can fail if the information is "about your own decision": e.g., you learn what
  you will decide, which can create a paradox.

  - It can fail if you have "incomplete preferences" or "unawareness."

  - It can fail if you are in a "multipolar trap": information can lead to races to
  the bottom.


