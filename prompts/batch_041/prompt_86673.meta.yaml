  Summary given: "There''s this thing called the dogmatism paradox. The idea is that
  knowledge is self-protecting: if you know that P, then you know that any future
  evidence against P must be misleading — since you know P, and P is true, evidence
  against P can''t be evidence for anything true. So a rational person who knows P
  should just ignore any evidence that comes along against P. That''s why people who
  know things are dogmatic, and it shows that knowledge is a bad thing to have, or
  at least that ''knowledge'' as philosophers define it can''t be what we care about."


  Errors: (a) the inference is from knowledge to knowledge that evidence against P
  is misleading — that''s the paradox, fine. (b) But the paradox is that this conflicts
  with an apparently obvious epistemic norm (revise in face of new evidence); the
  summary presents the "ignore future evidence" conclusion as a straightforward consequence
  and thus as a refutation of the concept of knowledge, whereas the interesting question
  is whether the reasoning is valid or where the equivocation lies. (c) "so a rational
  person should ignore evidence" — the paradox is precisely that this seems absurd,
  so it''s a reductio of one of the premises, not an established result. (d) "knowledge
  is a bad thing" — non sequitur. (e) Subtle: the paradox doesn''t depend on the evidence
  being misleading in general; also the key move is from "P is true" to "any evidence
  against P is misleading" — actually the standard formulation: if you know P, you
  know that P is true, and you know that any evidence that would suggest ~P is misleading
  evidence (since P is true). Hence you can rationally disregard it. There''s a distinction
  between (i) knowing the evidence is misleading and (ii) having a reason to disregard
  it — the "self-fulfilling" / "no-defeater" reasoning. Also the difference between
  "knowing that the evidence is misleading" (which requires knowing what the evidence
  is) vs. "knowing that whatever the evidence is, it''s misleading."


