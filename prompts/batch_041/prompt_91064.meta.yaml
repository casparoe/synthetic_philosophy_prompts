  The instrumental convergence thesis is a separate idea: whatever an agent''s final
  goal is, it will tend to develop the same intermediate aims — survival, resources,
  keeping its goal unchanged, improving itself — because these are useful for almost
  any final goal. This is why people say a superintelligence would be dangerous even
  if it isn''t ''evil''.


