  right sense. A thermostat has a goal but no general intelligence, so convergence
  doesn''t apply to it. For real superintelligent agents, though, resistance to shutdown
  follows straightforwardly: if the agent is switched off it can''t achieve its goal,
  so it will have an instrumental reason to prevent that. This is sometimes called
