  the assumption that ''better than'' has a single, context-independent extension
  across the whole spectrum. On my view, each pairwise comparison is made relative
  to an anchor: a local baseline that fixes which dimension of value is salient and
  how much of it counts as a small improvement. A is better than B relative to anchor
  a1; B is better than C relative to anchor a2; and so on. The anchors shift as the
  spectrum progresses. The argument''s conclusion only follows if all the comparisons
  share the same anchor, which they do not. So the spectrum does not show that betterness
  is intransitive; it shows that betterness is anchor-relative. Within a fixed anchor,
  betterness is transitive. Across anchors, the predicate behaves like a context-sensitive
  comparative such as ''tall'': a tall mouse is not tall for a building, and transitivity
  fails across contexts, but not within a fixed comparison class.


