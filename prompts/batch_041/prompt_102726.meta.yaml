  "I teach a seminar on games, deterrence, and precommitment, and I want to use Stanley
  Kubrick''s Dr. Strangelove as a test case. Read the film through the idea of a commitment
  race: two or more parties, unable to trust each other''s future behavior, try to
  improve their position by irrevocably binding themselves to a course of action before
  the other can do the same, so that the race itself changes what each can rationally
  do. The Soviet doomsday machine is the obvious instance, but I want a reading that
  takes the logic seriously rather than treating it as a satirical prop. Does the
  film dramatize a genuine commitment race, or does it show a commitment failure --
  a device that cannot deter because its existence and trigger are kept secret, and
  because the men who built it cannot control the circumstances of its use? Where
  does the film get the game theory right, and where does it simplify or distort it?
  Pay attention to the difference between a threat that is credible because it is
  automatic and a threat that is credible because it is public and understood, and
  to the way the film links the race to build doomsday devices with the ordinary arms
  race and the mineshaft gap. I am especially interested in the ending: does the film
  suggest that commitment races are self-defeating, or that they are rational until
  someone makes a mistake, and does that distinction matter for how we should think
  about real precommitment problems? Finally, say what the film adds to the philosophical
  discussion that a dry example cannot -- what it shows about the psychology, bureaucracy,
  and absurdity of trying to bind your future self, and where the honest critic has
  to admit the film is not doing game theory at all. Keep the reading faithful to
  both the film and the idea: do not reduce the film to an illustration, and do not
