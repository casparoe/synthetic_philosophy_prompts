  Draft:


  I run spiritual care for a mid-sized hospital''s palliative care service, and roughly
  two or three times a month a patient or a family member brings us a near-death experience
  and wants it taken as evidence about what happens after death: a patient who says
  she has seen the other side and now wants her do-not-resuscitate order reversed,
  a daughter who reports that her dying father sat up and described meeting his mother
  and who takes this to settle the question, a man whose own cardiac arrest produced
  an experience he now cites when he asks us whether he should be afraid. Our team
  is not qualified to adjudicate anyone''s metaphysics, and we are not willing to
  pretend that we can, but we also cannot keep responding with a shrug, because the
  claim is doing real work in the room — it is steering treatment decisions, family
  conflict, and whether a patient can be comforted at all.


  I want a decision procedure grounded in A. J. Ayer''s treatment of this question.
  Ayer''s criterion in Language, Truth and Logic was that a sentence has factual meaning
  only if some possible experience could count for or against it; applied to survival
  of death, that criterion threatens to make the claim either a prediction with obscure
  verification conditions or not a factual claim at all. Ayer himself, in the late
  1980s, was the subject of a near-death episode; he reported it publicly, said it
  had left him less certain than before that death is the end of him, and yet continued
  to treat it as possibly a hallucination of a distressed brain. That combination
  — a theorist with the strongest reasons to discount such reports, unable to fully
  discount his own — is the case my team actually faces, so the procedure has to be
  built for it rather than around it.


  The procedure must: sort what a patient or family member is asserting into the different
  things such reports can carry (a biographical fact about an experience, a prediction
  about what will happen to someone, a commitment that makes no experiential difference
  either way, and an expression of fear or hope that is not a claim at all); say in
  order what to ask and what counts as a sufficient answer; state where the procedure
