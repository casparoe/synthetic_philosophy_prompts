  I''m a retired respiratory physiologist — thirty-odd years of it, mostly control
  of breathing, dogs early on and then humans — who got bored and started reading
  philosophy about four years ago, and I''ve somehow been let loose to give a paper
  at the little choice-and-rationality workshop my old department runs jointly with
  the economics people. My talk is called something like "Independence is a claim
  about individuation, not about preference", and the gist is this. Everyone treats
  the Allais results as a clash between what choosers do and what the independence
  axiom permits, and I want to argue that the clash is really about who gets to decide
  what counts as the same branch and the same consequence across the two problems.
  In the standard presentation, the experimenter hands you a state space and a consequence
  space and then the axiom does the rest; but Allais himself was pointing at complementarity
  — the 89% branch is not the same object in the two problems, because what it means
  depends on what happens on the other branches, and if the chooser is entitled to
  individuate the branches her own way then the axiom has no purchase. My own proposal,
  which is probably naive and I want to try it out on them, is to keep a cardinal
  notion of the difference a choice makes, so that an act is evaluated by how the
  differences between the available acts are spread over the branches rather than
  by the levels of the prizes, and then independence holds only across branches on
  which that difference is constant. I''ve been calling it difference-invariance,
  for want of a better name. If it works, the Allais preference comes out consistent
  and the common-ratio results stop being an anomaly — and I suppose I should admit
  I''m half-hoping somebody shows me it doesn''t work.


  The audience is what''s worrying me. It''ll be about twenty people. A solid block
  of behavioural and experimental economists, plus a couple of the judgement-and-decision
