  "Our reading group has spent most of the year on the Hart–Devlin thing — the question
  whether the criminal law may enforce a shared morality as such, quite apart from
  preventing harm to anyone. I think I can state both sides fairly: Devlin says a
  society''s morality is all of a piece, that a society is entitled to defend its
