  lies on whoever wants to criminalise. We''ve now gone round this loop maybe six
  times and nobody has moved. What I want from you is not a verdict on who''s right,
  it''s a diagnosis of what kind of disagreement this actually is. My own hypothesis,
  and I want it treated as a hypothesis: the disagreement is not really about whether
  society may enforce morality, it''s about whether the thing being protected — a
  shared morality — can be harmed at all, and if it can, whether it''s the kind of
  thing that gets *depleted* by individual deviation. So here''s the bit I''d like
  you to actually think with, rather than just report: treat a society''s shared morality
  as a common-pool resource, like a fishery or a grazing commons — something that
  can be used up, that''s costly to replenish, and where each person''s non-conformity
