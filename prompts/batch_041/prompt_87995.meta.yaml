  I teach a 90-minute session in an upper-level undergraduate seminar on social choice
  — eighteen students, mostly philosophy and political science majors — and I have
  taught the Gibbard–Satterthwaite theorem often enough to know what goes wrong. My
  students can all state it: with at least three possible outcomes, any voting rule
  that is not dictatorial is manipulable, meaning some voter facing some configuration
  of the other voters'' preferences does strictly better by misreporting her ranking
  than by reporting it honestly. What they cannot do is feel it. They hear it as a
  theorem about a filing cabinet of exotic voting rules, not as a claim about the
  room they are sitting in, and the standard examples (plurality voters deserting
  a hopeless favorite, Borda voters burying a rival) get filed away as the familiar
  folk wisdom about tactical voting rather than as instances of a general result.
  I would like an activity that reverses that order: something that puts them inside
  a rule of their own choosing, with real (if trivial) stakes, so that they discover
  the incentive to misreport before anyone has named manipulation, and the theorem
  then arrives as the explanation of what just happened to them. Please design the
  activity in full: the setting and timeline for the ninety minutes, the materials,
  the payoff scheme (no real money — points or tokens are fine, and I am happy for
  the stakes to be something silly like control of the end-of-term session), the roles
  and rules, and a debrief that maps the specific moments of the game onto the theorem.


  A few constraints from my end, since I have run versions of this badly before. Run
  the elections in tables of four or five rather than in the full room of eighteen:
  with eighteen voters almost no one is ever pivotal, the lesson evaporates, and the
  exercise degenerates into a lecture with ballots; with small electorates the same
  student can be pivotal twice in ten minutes. Give each participant a private card
  assigning point values to each of four outcomes, forbid showing the cards, and make
  the outcomes genuinely differentiated — I want at least one table where a sincere
  plurality vote elects the outcome that the table''s median voter ranks last. Let
  them agree on a rule they consider fair before any of this happens, and then break
  it: in the later rounds let one or two designated participants (secretly briefed)
  vote insincerely, or give everyone a private bonus for landing their own top outcome,
  and watch the rule they designed come apart. Then, when they patch it — and they
  will patch it, moving from plurality to Borda to a runoff, each time confident the
  problem was the previous rule — offer them the one rule that cannot be gamed and
  let them reject it themselves: a dictatorship, in which a single named participant''s
  ranking settles everything and no one else''s vote can do anything, honest or otherwise.
  The point I want them to arrive at by their own route is that fairness and strategy-proofness
  were never two names for the same thing, and that the only way out of the trade-off
  on offer is to give up the fairness. If time allows, the debrief can add the extension
  to rules that randomize over outcomes, where the only strategy-proof rules turn
  out to be lotteries over dictators.


  The debrief should reconstruct the pivotality mechanism in their own case: with
  the other ballots held fixed, a voter''s misreport can only matter when her vote
  is decisive, so any rule that is immune to manipulation must in effect give some
  voter her way whenever she is decisive — and iterating that thought is how the impossibility
  gets proved, which is precisely the part the activity cannot stage. Two further
  things the game cannot reproduce and that I will have to supply from the front of
  the room: the universality of the theorem, since students who have broken four rules
  will reasonably conclude that they simply chose badly, and the fact that the hypotheses
  do real work — on a restricted domain of preferences, such as single-peaked orderings,
  a strategy-proof rule exists and is in everyday use. I also want the debrief to
  separate vulnerability from exploitation: the theorem says the incentive exists,
  not that voters know enough, or are pivotal often enough, to act on it. Finally,
  tell me what will predictably go wrong the first time I run this — I am particularly
  worried about a round in which the planted manipulator''s lie fails to change the
  outcome, leaving the whole design inert, and about the student who insists that
  the point cards are not her real preferences and that the whole exercise is therefore
  rigged.


