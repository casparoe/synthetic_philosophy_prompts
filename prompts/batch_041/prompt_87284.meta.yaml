  Draft:


  "I am assembling materials for a seminar on the metaphysics of meaning, and before
  we read any accounts of what it is for something to be a message, I want the requirements
  laid out. Here is the picture we are working with, in my own words, so that we do
  not have to agree on anyone''s terminology: a message seems to come in two layers.
  There is the inner layer — the content, what the thing says — and there is the outer
  layer, the part that tells a receiver how to get at the content: this is a record,
  play it at this speed; this is a language, here is its grammar; this is DNA, transcribe
  it this way. Call the outer layer the frame if you like. The question I want the
  requirements for is: what does an adequate account of where meaning resides have
  to deliver?


  Give me the desiderata list, with the case or consideration behind each requirement.
  At minimum I want requirements that come from the following hard cases: a text in
  a language with no surviving speaker and no bilingual key; a stretch of DNA; a musical
  score, which underdetermines any performance; a string of symbols that a machine
  produces and that turns out, unremarked, to be a valid derivation in some formal
  system; a sentence whose speaker meant one thing and whose hearer understood another;
  and a sequence of symbols that is a message only under a code that has been lost.
  For each, say what the account must say and why that is a requirement rather than
  an intuition of one camp. I also want the distinctions the account may not collapse
  — between meaning and information, between what a thing means and what it causes,
  between a message''s being interpretable and its actually being interpreted, between
  the content a sender intends and the content a convention fixes — again with the
  case that forces each distinction.


  Then the part I care most about: mark which requirements are negotiable and which
  are not, and say whether any pair or larger subset is jointly unsatisfiable. My
  suspicion is that the two-layer picture generates one: if the frame is what makes
  the inner message readable, then the frame is itself something that must be read,
  and so on, unless the account can stop the regress at a layer that is not a message
  at all — and I want to know whether stopping it is possible, or whether every such
  account owes us an account of what the unread frame is. If you think the regress
  is harmless, say what does the work.


  Do not give me a survey. If you want, at the end, score one or two of the better-known
  positions against the finished list, briefly; but the list is the deliverable. Throughout,
  tell me how confident you are in each claim you make, and single out the requirement
  you are least sure belongs on the list."


