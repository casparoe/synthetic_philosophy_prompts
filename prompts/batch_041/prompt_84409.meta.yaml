  Draft:


  "Hey — I''m deep in a chapter on whether the special sciences'' disposition-talk
  (resistance, robustness, plasticity, ''capacity to self-repair'') is anything more
  than a shorthand, and I keep finding that I don''t have a clear spec of what a theory
  of dispositions is even supposed to deliver. Everyone in the literature picks their
  favourite case and builds a theory that handles it, and I''m supposed to grade them
  all in chapter 3. So before I do: give me the desiderata. What does any adequate
  theory of dispositions have to get right?


  I don''t mean a list of platitudes, I mean the actual constraints with the case
  behind each one. To be concrete, here are the cases I care about, some of which
  I''ve been cooking up myself and haven''t seen discussed:


  — the usual: a glass is fragile, sugar is soluble; anything that can''t even get
  these right is out.

  — the anti-case family: the glass that''s struck inside a machine that removes its
  fragility a split second before impact (so it doesn''t break, though intuitively
  it''s still fragile); the sugar that''s coated so it can''t dissolve; the rubber
  ball with a hidden charge that shatters when dropped, so it looks fragile but isn''t.
  And a variant I''ve been chewing on: a vase rigged so that the instant anything
  touches it, the vase is vaporised and swapped for a molecule-for-molecule replica
  of a different, tough material. Nothing ever breaks. The original never stops being
  fragile — it just doesn''t survive long enough to. Does a theory have to say the
  vase is fragile? Does it have to say the counterfactual ''if struck, it''d break''
  is false? Can it say both?

  — a ''never-manifests'' case: an enzyme whose substrate, whenever it shows up, binds
  in a way that blocks the active site, so catalysis is physically impossible in every
  circumstance. Biochemists will happily call it catalytically active but inhibited.
  Should the theory call it a disposition at all, and if so what content does the
  ascription have?

  — immunity/resistance-type cases: the disposition comes in degrees, the manifestation
  depends on dose and on the rest of the organism, and ''it''s resistant'' is only
  true relative to a reference class and a set of normal conditions. Nothing in the
  glass/sugar cases prepares you for that.


  So: the requirements list — the cases it must get right, the distinctions it can''t
