  Leibniz''s Theodicy (1710): "Essais de Théodicée sur la bonté de Dieu, la liberté
  de l''homme et l''origine du mal." Claims:

  - God is perfect, so He chose the best among infinitely many possible worlds.

  - Evil is of three kinds: metaphysical evil (imperfection), physical evil (suffering),
  moral evil (sin).

  - Metaphysical evil is the source; it''s a privation (following Augustine), not
  a positive thing created by God.

  - God permits moral evil but does not will it; it''s not an end but a "sine qua
  non" / a condition of greater goods ("permits" it, "concurs" with it).

  - The "best" world is not the one with the fewest evils, but the one with the most
  "harmony"/greatest variety combined with the greatest order — the best is like a
  calculus of maxima/minima; the whole is like a "variety compensated by order."

  - There''s a famous analogy: the world is like a picture with shadows needed for
  contrast; or music with dissonances resolving.

  - The principle of sufficient reason requires God to choose the best; freedom and
  necessity of a special kind (God is not "free" to choose less than the best — this
  is the basis of the "optimism" criticized).

  - The "law of continuity" and the "best possible" as a maximum of perfection.

  - Also the "principle of the best" (le principe du meilleur).

  - Also his claim that "the damned" — the number of the saved/ damned; and the famous
  "the world would not be perfect if..." Also the "Seigneur" / "felix culpa" theme:
  the fall of man allowed the incarnation, a greater good.

  - Also the "kingdom of grace" and "kingdom of nature."

  - Voltaire''s Candide (1759) caricatures "tout est bien" from Pope''s Essay on Man,
  actually; Leibniz''s phrase "le meilleur des mondes possibles" appears in Theodicy
  §8 etc.

  - Leibniz''s claim that this world is "the best of all possible worlds" is sometimes
  mistakenly conflated with Pope''s "whatever is, is right."


