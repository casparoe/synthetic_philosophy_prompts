  "For the past few months I''ve been serving on the ethics and policy committee of
  a mid-sized nonprofit that operates a 24-hour hotline for people leaving abusive
  relationships, and I''ve been asked to draft the section of our staff handbook that
  governs when, if ever, a counselor may deceive a caller. The easy cases are not
  the problem; the hard ones involve callers who are almost certainly the abuser trying
  to locate a partner, or relatives who phone to apply pressure on the victim''s behalf.
  We tell our staff to ''never lie,'' but that slogan is doing less work than it appears
  to, and I''ve been arguing about it with a friend who teaches philosophy. Her position,
  which she presents as a repair rather than a rejection of Kant, is roughly this:
  what Kant''s prohibition on lying is really protecting is not the truth of our statements
  but the standing of the person addressed as a fellow reasoner — lying is wrong because
  it hijacks another person''s deliberation and turns it to your ends, treating them
  as a tool rather than a participant. On that reading, she argues, the murderer at
  the door has already stepped out of the reciprocal community of reasoners by aiming
  to destroy the person who is being asked, so the duty that the classic example is
  supposed to illustrate does not reach him, and the case for deceiving him — or for
  deceiving an abuser who is doing the same thing more slowly — is at least as strong
  as the case against. She concedes that this reading has to explain away Kant''s
  insistence that lying also wrongs the liar, by degrading his own rational nature,
  and she treats that as a separate and weaker strand of his view rather than the
  core of it. I''m drawn to the repair, but I suspect it is more fragile than it looks,
  and I want to know what it would commit us to in practice before I put anything
  like it in a document that staff will actually follow under pressure.


  Please describe the most important implications of taking this revisionist reading
  seriously — both for the specific decisions our counselors face and for the broader
  norms of honesty that a hotline, which depends on callers trusting what we say,
