  Setting: a second- or third-year undergraduate seminar in philosophy of religion
  or metaphysics (or a "death and dying" philosophy module). ~18 students, 90 minutes.


  Concept to make them feel: Ayer''s verificationist objection to survival — that
  "survival after death" fails to express a genuine hypothesis because we cannot specify
  any observation that would distinguish the survivor from a merely physical replica
  or from nothing; the survivor is always described in embodied terms, or else the
  "survival" makes no experiential difference to anyone, including the survivor. Also
  the asymmetry: the question of what it would be like, from the inside, to be the
  survivor.


  Activity design: "The Survival Verification Bureau." I want the rules to make participants
  run into the wall themselves.


  Idea: Participants are split into teams. Each team is given a "case file" describing
  a candidate scenario of a person''s death and purported survival. Their job is to
  fill out a standard "Continuation Determination Form" with fields:

  1. What, exactly, persists? (physical stuff, information/pattern, a soul-substance,
  memories...)

  2. What observable difference would there be, for an outside observer, between the
  survival scenario and the scenario in which the person simply ceased?

  3. What would the survivor themselves experience, and how would they know they were
  the same person?


  Then teams swap forms and act as "verification officers" who must reject any form
  that fails to give a discriminating observation. The twist: the bureau''s charter
  says that if no discriminating observation can be specified, the claim is recorded
  as "not a determinate hypothesis" rather than as "true" or "false."


  The discovery: every scenario either (a) describes a physical/embodied continuation
  (so it''s not "survival" in the sense of surviving the death of the body), or (b)
  yields no discriminating observation, hence gets stamped "indeterminate."


