  is the sum of the utilities of all individuals in it. In a finite world, this is
  straightforward. But consider an infinite world W consisting of a countably infinite
  sequence of individuals with utilities 1, 2, 3, ...; and consider W*, which is exactly
  like W except that the first individual has utility 0 rather than 1. Under the total
  view, both worlds have infinite total utility and are therefore equally good, even
  though W is better for one person and worse for no one. This is the ''infinite total
  view'' problem. A natural repair is the ''finite improvement'' principle: W is better
  than W* if and only if there is a finite set of individuals for whom W is better
  and none for whom it is worse, and for all other individuals the worlds are identical.
  But this principle has the counterintuitive consequence that a world of infinitely
  many people at utility 1 is neither better nor worse than a world of infinitely
  many people at utility 2, since the difference is not confined to a finite set.
  I want you to make an argument for a specific position: that we should replace the
  finite improvement principle with what I call the ''limiting-average principle''
