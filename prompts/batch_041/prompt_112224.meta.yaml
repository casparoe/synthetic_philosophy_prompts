  Let''s draft.


  Paragraph 1:

  "I am a novelist at work on a book set in a shrimp and salmon farm on a estuary,
  and the central character is a welfare officer who has to make decisions that will
  be described in close third person: whether to approve a new stunning method, whether
  to keep a broodstock line that suffers from a condition no one can measure without
  killing the animal, whether to count the shrimp at all. I want the moral texture
  of the book to be honest, so I am trying to get clear on the underlying theory before
  I write another scene. Please write me the desiderata that any adequate theory of
  welfare for farmed fish and crustaceans would have to meet, fixing the purpose as
  decision-making on a working farm under uncertainty rather than victory in a seminar."


  Paragraph 2:

  "Give me the phenomena the theory must explain, the cases it must get right, the
  distinctions it must not collapse, and the empirical findings it must not contradict,
  with the consideration behind each requirement. The cases should include at least
  these, which are the ones my novel keeps running into: a prawn that avoids a noxious
  stimulus after one trial and guards a wound, but whose nervous system is distributed
  and unlike a mammal''s; a fish that shows the same behavioral response to a harmless
  disturbance and to a painful one, so that the theory must say what would count as
  evidence either way; a hatchery practice that improves survival for the many while
  causing a lasting harm to a few; a stunning method that is reliable for one species
  and unreliable for another; a welfare indicator that is easy to measure, like fin
  condition or growth rate, and another that is hard to measure but seems more directly
  tied to suffering; and a larval stage in which most individuals die before any welfare
  assessment is possible. The theory also has to handle the scale of aquaculture,
  where individual monitoring is impossible, and the fact that the animals are often
  invertebrate or ectothermic and so do not fit the model of welfare built for mammals
  and birds. It must respect distinctions like welfare versus health, pain versus
  nociception, sentience versus the capacity to suffer, individual versus population
  welfare, and uncertainty versus ignorance."


