  — one who has spent years defending the view that a credence''s only epistemic virtue
  is its accuracy, its closeness to the truth, so that evidence, coherence, and explanation
  matter only insofar as they help you get closer to the truth, and one who thinks
  that view is a shell game. Neither would concede anything, and I would like someone
  to tell me who was right at each stage, rather than who won on points.


  They went back and forth like this. (1) Rosa: since accuracy is the only thing that
  makes a credence good, epistemic rationality just is the project of holding the
  credences you expect to be most accurate; nothing else is a fundamental epistemic
