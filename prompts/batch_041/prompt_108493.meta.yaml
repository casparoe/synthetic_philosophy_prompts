  "I''m a novelist — three books, all of them more or less about memory — and for
  the last year I''ve been circling a philosophical dispute that I can''t turn into
  fiction and can''t leave alone. It''s the question of whether dreams are experiences
  at all. On one side there''s the Wittgensteinian argument, the one Norman Malcolm
  made: that the concept of dreaming is anchored to the waking report, so that the
  idea of a dream nobody had and nobody remembers is not a hidden event but a confusion;
  ''I dreamed it'' is not the report of an observation, and there is no such thing
  as being wrong about whether you dreamed, only about what. On the other side is
  the reply that the question is an empirical one about what actually happens during
  sleep, and that perhaps nothing experiential happens at all — that the dream narrative,
  complete with its apparent duration, is assembled at the moment of waking and installed
  in memory, so that what you ''remember'' is the memory of an experience you never
  had. I keep noticing that ordinary institutions can''t afford to leave this open..."


