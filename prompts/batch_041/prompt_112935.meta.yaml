  uncertainty because there''s no truth of the matter"), the "no practical difference"
  argument (if uncertainty is irreducible, maybe you should just act on your best
  judgment, since using a hedging procedure is itself a substantive first-order moral
  view), and the objection from "moral confidence as a virtue" (Williams? "Moral luck"?).
