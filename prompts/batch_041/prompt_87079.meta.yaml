  So I''m a first-year PhD student and I''ve somehow gotten obsessed with Nozick''s
  Wilt Chamberlain argument — I read Anarchy, State, and Utopia over the summer after
  losing an argument to my brother-in-law about taxes (long story, don''t ask), and
  now I can''t stop chewing on it. Next month I have to give a 20-minute WIP to our
  political theory workshop and I want to try out a reading I haven''t seen spelled
  out the way I want it: that the Chamberlain example isn''t really a reductio of
  patterned principles as such. On my reading, what it actually shows is narrower
  — that a pattern can''t be *maintained* through free transactions without interference
  — and the heavy lifting is done by an unstated premise, namely that the people doing
  the trading are already entitled to what they trade. If that premise is carrying
  the argument, then it doesn''t touch someone who accepts a pattern but denies entitlement
  to pre-tax holdings; it just relocates the fight to acquisition. So I want to pitch
  the argument as a consistency challenge to certain patterned views rather than a
  knockdown, and I want to push a related puzzle: if a group of self-owning people
  voluntarily and unanimously adopt a rule that re-flattens holdings every year (a
  pattern they keep choosing), does Nozick''s liberty-based objection even get off
  the ground, or does it prove too much by forbidding them from binding themselves?


  The audience is going to be rough in a specific way. It''s mostly Rawlsians and
