  may be exploitable (a human could be talked into anything by their copies).

  - Factored cognition (Ought, Stuhlmüller ~2018): the hypothesis/strategy that complex
  reasoning tasks can be decomposed into small, independently-verifiable subtasks;
  relevant to AI alignment via "iterated amplification"/debate. It''s more of an empirical/methodological
  claim about task decomposition, and the "factored cognition hypothesis" as a claim
  about the world. Notably, factored cognition is a claim about reasoning, not an
  idealization of deliberation — and it''s motivated by the observation that humans
  do a lot of "intuitive" reasoning not accessible to decomposition.

