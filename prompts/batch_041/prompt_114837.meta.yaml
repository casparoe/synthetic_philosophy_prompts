  Domain: Supererogation. Type: sorting quiz/taxonomy. Let''s design prompt:


  "I teach a 300-level ethics course and every year the unit on supererogation goes
  sideways. My students can all recite the standard three-way division — forbidden,
  obligatory, optional — but the moment I give them a case where someone does something
  genuinely admirable at real cost and no one could have demanded it, half of them
  say it was ''optional'' in the same flat sense as choosing oat milk, and the other
  half say if it was really admirable then it must have been required after all. I
  want to build a diagnostic taxonomy they fill out before class, so they can see
  that ''supererogatory'' is a family of positions, not one. I don''t want a list
  of -isms to memorize; I want the tree built from the questions that actually split
  the views."


  Then specify angle: "Here''s the angle I care about: start from the claim that there
  are acts that are morally good/ admirable but not obligatory, and then ask what
  does the work — the act''s cost to the agent, the absence of a duty, the presence
  of a reason that is not decisive, the agent''s motive, the social meaning of praise,
  whether an act can be ''beyond'' duty if duty is already maximally demanding. I
  want the tree to include positions that deny supererogation altogether (everything
  admirable is obligatory, or ''supererogatory'' is just a name for what we don''t
  feel like demanding), positions that make it merely epistemic (there is a duty but
  we can''t know it), and positions that make it a feature of virtue rather than of
  acts. Also include the view that supererogation is possible only because morality
  has an ''optional'' zone, and the view that it''s a category mistake."


  Then cases to use: "Please use these cases, because they''re the ones that come
