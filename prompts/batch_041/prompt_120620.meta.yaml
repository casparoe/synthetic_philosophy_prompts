  Actually, here''s a sharper framing that makes the prompt really philosophical:
  The film''s premise is that the heptapod language cannot be translated without the
  translator''s mind being *restructured* — i.e., understanding is transformative.
  Hofstadter''s view is that understanding requires having a mind stocked with human
  experience — a shared form of life — which machines lack; so he''d say translation
  requires *being* the kind of creature that can grasp the situation. The film thus
  dramatizes Hofstadter''s thesis. But: the film also implies that the heptapods''
  language is untranslatable by any being not rewired, which is a much stronger claim
  than Hofstadter''s, and one that is *self-undermining for the film''s own humanism*
  (Louise gets the understanding by a neurological event, not by learning a culture
  — so the film actually models understanding as a *mechanical* rewiring, which is
  closer to the machine''s side of the debate). Oh, that''s a lovely twist: the film''s
  account of how Louise comes to understand is *computational/mechanical* — a change
  in the language faculty — which is exactly the sort of thing Hofstadter denies is
  sufficient. And the honest critic: the film''s machine (the software) fails where
  human understanding is required, but the film explains the human''s success with
  a machine-like mechanism. Also the film''s "weapon/tool" ambiguity is the classic
  case where context and intent, not statistics, decide — a nice scene to point to.


  And another injection: the point that MT''s success is a *problem* for the "translation
  requires understanding" thesis; the best defense of Hofstadter is that MT''s successes
  are precisely in shallow registers and it fails where the text''s meaning depends
  on the world (jokes, poetry, legal nuance). And the film''s premise (strong Whorf)
  is empirically contested — a reading that takes the film seriously must say whether
  it needs strong Whorf. That''s a real philosophical knot: if strong Whorf is false,
  the heptapod language is translatable without rewiring, so the film''s drama collapses;
  if strong Whorf is true, Hofstadter''s insistence that understanding requires a
  shared human form of life makes the heptapod language untranslatable in principle
  — so the film would prove Hofstadter''s point too strongly (making translation impossible,
  not shallow).


