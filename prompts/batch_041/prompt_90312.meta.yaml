  science, no more love" — ok, but why is that bad if there''s no one for whom it''s
  bad?


  Here''s the thing that''s bugging me. The people who write about this seem completely
  stuck. There''s one camp that says extinction is bad because of the people who would
  have existed and don''t, or because of the deaths if it''s violent. And there''s
  another camp that says no, it''s bad in itself, impersonally, and there doesn''t
  have to be anyone it''s bad for. My friend who did a phil degree says this is just
  the old person-affecting vs. impersonal fight and nobody''s moved an inch in decades,
  and that I shouldn''t expect a resolution.


  But I have a hypothesis and I want to know if it''s dumb. I think the stall isn''t
