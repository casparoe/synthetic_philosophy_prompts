  best move: distinguish "P_future(A) = x" (a bare fact about your future credence)
  from "P_future(A) = x and it was produced by a distortion I know about." Reflection''s
  antecedent is the bare fact; and if you''re rational, the bare fact that your future
  credence will be x — given that you know you''ll only have credence x because of
  distortion — should indeed lead you to discount. So Reflection, read as "your current
  credence should equal your expected future credence," would be violated; but the
  reason is that your future credence is not a good "indicator." Van Fraassen''s defense:
