  The "Löbian obstacle" to self-trusting agents: Yudkowsky & Herreshoff "Tiling Agents
  for Self-Modifying AI." The idea: an agent that wants to build a successor agent
  it can trust faces a problem: it can''t consistently have a general schema "my successor
  is sound" if the successor reasons in the same system (because Löb). The solution:
  "tiling" — trusting a successor in a weaker system, or with a "level" hierarchy.
  Also related: "the Löbian obstacle" and "reflective inconsistency," and Fallenstein
  & Soares, "Problems of self-reference in self-improving space-time embedded intelligence,"
  and "Vingean reflection." Also "the tiling agents" and "model polymorphism." Also
  "bounded Löbian obstacle" / "bounded recursion theorem."


