  Harsanyi''s aggregation theorem: "Cardinal Welfare, Individualistic Ethics, and
  Interpersonal Comparisons of Utility" (1955, Journal of Political Economy). The
  social welfare function is the sum of weighted individual utilities; derived from
  (i) each individual''s preferences satisfy vNM expected utility axioms, (ii) social
  preferences satisfy the same axioms (or social choice satisfies vNM), (iii) the
  Pareto principle (weak Pareto / strong Pareto), (iv) something like the "sure-thing"/independence
  of irrelevant alternatives-ish condition, and (v) anonymity/symmetry of the social
  welfare function in individual utilities (given by Harsanyi 1977 "Morality and the
  theory of rational behaviour"?). The "extended sympathy" / "equiprobability" argument:
  the veil-of-ignorance version — in the original position where you have an equal
  chance of being anyone, you maximize expected utility, yielding utilitarianism with
  equal weights.


  Key subtlety: Harsanyi''s theorem requires interpersonal comparability of utility
  (cardinal, comparable units) — the "single scale" assumption. Actually Harsanyi
  argued that once we accept vNM utilities of individuals and the social welfare function
  is a linear weighted sum of them, weights need to be determined; the anonymity condition
  makes them equal. Also the "Harsanyi doctrine" — the assumption that all individuals''
  preferences are the same given the same information ("common preferences").


  Misconceptions to expect:

  1. Confusing Harsanyi''s theorem with Arrow''s impossibility theorem — thinking
  it''s about ordinal preferences and dictatorship; Harsanyi''s uses cardinal/interpersonally
  comparable utilities, which is why Arrow''s assumptions don''t apply.

  2. Thinking the result assumes utilitarianism (sum-ranking) as an axiom rather than
  deriving it.

  3. Thinking the vNM axioms are innocuous — but the sure-thing principle / independence
  axiom is doing work and the result can be avoided by rejecting it (e.g., ex-ante
  vs ex-post; Diamond''s example, or Sen''s critique).

  4. Thinking the theorem says the sum is the uniquely rational social welfare function
  regardless of what you think about equality — it doesn''t say equal weights unless
  anonymity is added; also that the "weights" reflect... Hmm.

  5. Conflating "utility" as happiness with vNM utility as a representation of preferences
  — hence thinking Harsanyi''s result is a defence of hedonism.

  6. Thinking Harsanyi''s veil-of-ignorance argument (equiprobability) is the same
  as Rawls''s, or that the veil yields maximin — Rawls thinks in terms of primary
  goods and denies the vNM assumptions for the parties (Rawls: "the parties do not
  know probabilities"? Actually Rawls uses a thick veil and argues the parties would
  use maximin under uncertainty; Rawls denies that the parties can assign probabilities).

  7. The ex-ante/ex-post distinction: the theorem aggregates individual ex-ante expected
  utilities (or "life-time utilities"), which conflicts with ex-post prioritarianism;
  Diamond''s example (with a twist).

  8. Thinking it implies we can measure welfare in utils with a common unit; the "scaling"
  issue — only the weights times utilities matters... Actually the theorem: social
  utility = sum of individual utilities up to positive affine transformation of each
  individual''s utility and weights determined.

  9. The "preference-satisfaction vs well-being" confusion.

  10. Thinking the theorem applies to actual political aggregation of votes rather
  than to ideal moral aggregation.

  11. Thinking that "each individual is to be treated as if they were one of n equally
  likely positions" is an assumption about actual probabilities or a claim about the
  metaphysics of identity, rather than a device.


