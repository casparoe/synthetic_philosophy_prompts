  Draft:


  "I''m putting together the last session of a reading group on moral demandingness
  — we''ve spent weeks on how much morality can ask of us, and I want to end with
  a poem rather than another paper, because the whole topic keeps collapsing into
  ''so is it required or not?'' and I''d rather have something that sits in the gap.
  You''re a poet who''s also spent time in moral philosophy, so I''d like you to write
  me a sestina on supererogation — the idea of the act that is good, praiseworthy,
  and yet not owed.


  A bit of background so you''re not just reaching for the obvious: the word comes
  from the old theological notion of ''works of supererogation'', from the parable
  where the Samaritan hands the innkeeper money for the injured man''s care and says
  he''ll cover whatever more is spent — the point being the paying out *beyond* what
  the situation required. I''m interested in two things that pull against each other.
  First, the paradox: if an act really is better than the alternative, why isn''t
  it simply required? And second, the thought that praise only makes sense where the
  act *wasn''t* required — you don''t congratulate someone for refraining from theft
  — so supererogation seems to need the ''not owed'' clause to be praiseworthy at
  all. And I want the mirror-image idea in there too, the suberogatory: the act that
  isn''t wrong but also isn''t good, the small meanness you''d never be blamed for.
  If it helps, the old distinction between the saint (who goes beyond in self-sacrifice)
  and the hero (who goes beyond in courage) might give you two figures to work with.
  No need for citations or reading lists — I just want the poem.


  Form-wise: six six-line stanzas and a three-line envoi, with the end-words rotating
  in the proper sestina order. Let me suggest the six end-words — must, owe, more,
  spare, rest, give — though swap any that fight you. The trick I actually want you
  to pull off: the sestina''s grid forces every line to be placed, nothing is optional,
  everything has to be accounted for in the rotation — which is exactly the pressure
  the supererogatory act resists. So let the envoi do the work: it gathers the six
  words as an envoi must, but the act itself should be the thing the six words can''t
  quite hold, the surplus that doesn''t fit the grid. Speaker can be the one who did
  the thing, addressing whoever keeps saying ''you didn''t have to'' — and let that
  phrase mean two things at once (thanks, and a way of refusing the gift, and a way
  of keeping the bar low for everyone else). Start by brainstorming a few candidate
  images and the two or three philosophical beats you want to hit, then write it.
  Make it accurate enough that someone who''s read the literature would nod, and good
