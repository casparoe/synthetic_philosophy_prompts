  Now, one important nuance: does Plato''s account support "in vino veritas"? Partly:
  wine is a "test" that reveals the drinker''s true disposition (the morose/savage
  man reveals himself). So the truth revealed is about character, not about propositions.
  And crucially, Plato''s point is that wine produces *licence of speech* ("abounds
  in every kind of licence of speech and action") — the drunk says what he otherwise
  wouldn''t. But is that the truth? Plato says wine makes you "filled with high hopes
  and a sense of power", "puffed up with conceit" — so the drunk''s speech is not
  reliable truth, it''s inflated. So a Platonic reading is: wine reveals *character*,
  not *facts* — and the "truth" it reveals is the truth about what you''re like when
  your shame is stripped away, not about how things are. Also wine is a *pharmakon*/drug
  that induces fearlessness, and it''s useful for *training* — a gymnasium. So the
  proverb''s readings: (a) drunks are sincere (they say what they really think); (b)
  drunks reveal what they really are (character); (c) wine grants cognitive access
  to truths unavailable sober (inspiration, Dionysian insight — cf. "festive insight");
  (d) alcohol lowers inhibition so suppressed truths come out — but Plato would say
  it also manufactures false confidence; (e) something about social truth: the symposium
  is where a community''s truth about itself comes out (the singing/chorus, and the
  elder''s renewal).


  Also the interesting twist: Plato''s Laws is unusual in that it prescribes *drinking*
  as part of civic education, which is counterintuitive. And the "truth" in vino veritas
  could be "what kind of person you are" — a truth about character revealed by a test.
  The friend''s use (using it to say you learn what someone really thinks when drunk,
  or that Plato agrees) can be assessed.


