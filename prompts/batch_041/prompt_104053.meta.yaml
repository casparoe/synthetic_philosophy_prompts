  a genuine explanation of why some system does what it does, but that no one — not
  the system, not its designer, not anyone — ever has or entertains. The stock examples
  are familiar: a vine''s tendril coils around the nearest support because coiling
  secures more light; a coastal grass grazed by herbivores spreads laterally because
  spreading escapes the grazer; an enzyme''s active site has the shape it does because
  that shape binds the substrate. In each case we can state a rationale — "do this
  rather than that, because it serves the end" — and the rationale seems to do real
  explanatory work, yet there is no reasoner anywhere in the story. Half the group
  thinks this is a straightforward category error, that we are reading agency into
  the world and should stop; the other half thinks the explanatory work is real and
  that refusing to call it reason-talk is just anthropocentric squeamishness.


  I''ve come to think the whole dispute is confused, and that the confusion is worth
  a careful argument. My view is that free-floating rationales do exist and are not
  a category error, but that the paradox only seems to arise because we run together
  two different things: a rationale that explains (a reconstruction an observer can
  give of why the system''s arrangement serves an end, and which is genuinely counterfactually
  robust — change the relevant feature of the world and the system would have been
  arranged differently) and a rationale that is avowable (something the system itself
  could, in principle, cite as its reason). My claim is that explanatory rationales
  do not require avowable ones, that the demand for an avowable occupant of the reasoner
  role is exactly the extra premise that generates the supposed paradox, and that
  once we drop it the free-floating rationale is a perfectly ordinary explanatory
  posit. What I want from you is the full argument for that position, not a survey
  of what other people have said about it — I don''t want a reading list, I want the
  reasoning.


