  arbitrary bins).

  - Middle: A better answer, from the philosophy of social kinds: generations are
  real but as *interactive* or *response-dependent* kinds — the label changes the
  labeled. Cite Hacking-ish looping: once "Gen Z" is a widely used term, people adjust
  their self-descriptions, employers adjust their expectations, marketers build products,
  and the classification feeds back into what it classifies. This is different from
  a natural kind: no essence, but not nothing.

  - Then: the interesting twist: interactivity makes generations *more* real socially
  while making them *less* usable as causal explanations. Because a generation is
  also a cohort — a set of people born in a window — and the standard demographic
  question is whether the differences we see between generations are age effects,
  period effects, or cohort effects. These three are collinear: at any given moment,
  your age plus your birth year equals the current year, so the three variables are
  algebraically dependent. (This is the identification problem: you can''t estimate
