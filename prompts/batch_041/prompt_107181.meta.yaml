  Essay:


  The Almanac Fallacy


  1st para: The word "generation" is asked to do two jobs. It names a set of people
  born in a window of years, and it explains why those people are the way they are.
  My novel needs the first job and keeps sliding into the second. ... A character''s
  birth year is a fact about the world''s calendar; his character is a fact about
  him. Nothing licenses the move from one to the other, and yet the sentence "she''s
  such a Gen Xer" is nearly always an explanation.


  2nd para: So: are generations real kinds? The two easy answers... The essentialist
  answer: yes, real as species, with a shared formative experience imprinting a shared
  disposition. The nominalist answer: no, arbitrary bins drawn for marketing. Both
  are unsatisfying; the first overstates, the second can''t explain why the labels
  stick.


  3rd para: interactive kinds. Explain. Looping. The label is not a mirror but a mold.
  Also caution: this makes them real in a different sense — real as institutions are
  real, sustained by mutual expectation. So real but not natural.


  4th para: But the interactivity point cuts the other way, and this is what I actually
  want to argue. If generations are constituted partly by the labeling, then they
  are exactly the sort of thing that resists being used as a cause. And there''s an
  independent, harder problem: cohort, age, and period are collinear. At any moment,
  year of birth + age = current year. So the three are not three variables but two
  and a sum. Any claim that a cohort is distinct must choose which of the three to
