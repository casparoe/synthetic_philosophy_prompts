  Formal prompt:


  "I am trying to settle a dispute in my decision theory reading group. A friend has
  constructed the following argument and I cannot decide whether it is a refutation
  of a theorem or a misuse of it.


  (1) Good''s theorem states that if information is free, and a rational agent will
  use it to update and then choose the act that maximizes expected utility, then the
  agent''s expected utility before receiving the information is at least as great
  as it would be without the information.


  (2) Therefore, free information can never leave a rational agent worse off in expectation.


  (3) Therefore, an agent should never pay to avoid information, and should always
  accept a free offer to learn the state of the world, even when the news may be unwelcome.


  (4) Now consider a predictor who is known to be perfectly accurate about a choice
  you will make. The predictor offers, before you choose, to tell you whether it has
  predicted that you will take one box or both boxes in a familiar two-box problem.
  The boxes are filled according to the prediction: if the prediction is one-box,
  the opaque box contains a large sum; if two-box, it is empty. You may accept or
  decline the offer; the predictor''s prediction is made after you decide whether
  to accept, and it takes your decision into account.


  (5) Suppose you accept the offer. If the predictor tells you that it predicted one-box,
  then the opaque box is full, and taking both boxes yields the full box plus the
  visible box. If it tells you that it predicted two-box, then the opaque box is empty,
  and taking both boxes yields only the visible box. In either case, taking both boxes
  is better than taking one box given what you have learned.


  (6) But the fact that you would take both boxes in either case is itself something
  the predictor foresees. So if you accept the offer, the predictor predicts two-box,
  the opaque box is empty, and you end up with only the visible box.


  (7) Had you declined the offer and simply taken one box, the predictor would have
  predicted one-box, the opaque box would have been full, and you would have ended
  up with the large sum.


  (8) So accepting free information has left you worse off than declining it.


  (9) Therefore Good''s theorem is false, or at least not applicable to any situation
  in which the information is about a prediction of your own choice.


  I want to keep (1) if I possibly can, because I use it all the time. Which step
