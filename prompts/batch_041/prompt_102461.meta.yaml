  I serve on the review committee of a small foundation that funds research aimed
  at reducing suffering in the natural world through biotechnology: engineering animals
  so that they feel less pain, driving down the populations of parasites that cause
  lingering disease in their hosts, redesigning food webs so that creatures are not
  eaten alive. As a committee we are committed to a particular view, which I will
  state plainly so that you can work with it: what makes suffering bad is the suffering
  itself and not the loss of some further good, so a technology that removes a form
  of suffering is good in itself even when it kills, sterilizes, or permanently alters
  a species, and the misery of wild animals counts for exactly as much as the misery
  of animals we can see. Our difficulty is operational. We receive three or four proposals
  a month — a gene drive meant to crash a biting-fly population, a request to breed
  a line of farmed salmon with a blunted sensitivity to pain, a plan to extinguish
  a predator painlessly so that its prey stop being torn apart — and we have no consistent
  way to decide. We meet for ninety minutes once a month, none of us is a biologist,
  we cannot run trials ourselves, and any award above two hundred thousand dollars
  has to be signed off by a board that does not share our view. Two internal rules
  constrain everything we do: the charter forbids funding any intervention whose effects
  cannot be bounded to a single species, and the board has asked us never to fund
  anything irreversible.


  Please write the decision procedure our committee can actually run. I want the questions
  asked in order, what counts as a sufficient answer to each, where the procedure
  stops with a no, and where it must hand the decision to the board or to an individual
  because the question is one of values rather than of fact; a short set of tests
  we can apply inside the meeting; and an honest marking of which steps are judgment
  calls dressed up as procedure and of the points where our own starting view, rather
  than the evidence, is doing the work. The procedure also has to face two problems
  I do not know how to handle: first, whether a being we engineer to suffer less thereby
  has less standing, so that reducing a creature''s capacity for pain quietly reduces
  what it is owed; and second, whether removing suffering that already exists is the
  same kind of act as preventing suffering that has not yet begun.


