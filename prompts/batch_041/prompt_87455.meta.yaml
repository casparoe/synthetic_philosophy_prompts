  I will deliver.


  I have been reading Camus on the death penalty, and the case I want to make is,
  in substance, his. But I do not want a literary essay about Camus, and I do not
  want you to quote him or anyone else; I want the argument in my own words, aimed
  at the room I will actually be standing in. That room will contain the board, who
  are not philosophers; the condemned man''s mother; my own mother and brother, who
  believe the execution should go forward and who will hear my statement as a betrayal
  of my sister; and a reporter. The statement must be intelligible and bearable to
  all of them.


  I have also become convinced that the usual abolitionist arguments are useless here,
  and I want the statement to avoid them. I will not say that life is sacred; I do
  not believe it. I will not say that the man is innocent, or reformed, or a victim
  of his circumstances. I will not say that I forgive him, because I do not, and I
  will not perform a forgiveness I do not feel. I will not argue about deterrence.
  And I will not make the cheap point that executing him would make us like him —
  I have never believed that, and it seems to me to concede too much.


  The argument I do want to make turns on a distinction that I have not been able
  to get out of my head. The question before the board is not what my sister''s killer
  deserves. I am willing to leave that question open; it is not mine to answer, and
  I do not think it is the board''s either. The question is what we are entitled to
  do. And what is proposed is not a punishment like other punishments. It is a killing
  that is planned, scheduled, and rehearsed. The man will be told the day and the
  hour; a room will be prepared; a person will be assigned to do it; and the rest
  of us will be able to say that our hands are clean, because the act has been divided
  among a judge, a governor, a warden, a doctor, and an executioner. That division
  is what makes it possible for a community that forbids killing to kill. I want the
  statement to make the board feel that, without ever using the word ''sacred'' and
  without claiming any moral superiority for me. I am not better than the man who
