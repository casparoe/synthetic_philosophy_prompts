  The parliamentary model may also be doing no more than redescribing the problem.
  And the Ratification Test may be either circular or unnecessary. I would welcome
  comments on whether the distinction between Point-Akrasia and Curve-Akrasia is stable,
  whether the empirical gloss is fair, and whether the deflationary conclusion is
