  I have been thinking about letterforms on my own, without any training in design
  or linguistics, and I have arrived at a view I would like you to pressure-test.
  The view is this: there is no essence of the letter ''a'' — no single feature or
  checklist of features that all and only a''s share. What makes every ''a'' an ''a''
  is instead a set of generative constraints on how a shape may vary while still counting
  as the same letter within a system of contrasts, together with a style that systematically
  deforms those constraints. On this view, the category is context-sensitive and graded:
  an ''a'' is individuated by its role in a contrast set — the other letters it must
  be distinguished from, the word it sits in, the font family or hand it belongs to
  — rather than by any intrinsic property. Style, then, is not decoration added to
  a fixed skeleton; it is a consistent way of bending the constraints, and the identity
  of the letter is what survives the bending.


