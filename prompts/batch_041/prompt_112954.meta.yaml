  Best fit: Dutch book arguments → a procedure a practitioner can follow. Who applies
  Dutch book arguments repeatedly in a practical role? A bookmaker/prediction market
  operator setting odds? A "compliance officer" at a betting exchange? Actually Dutch
  book arguments: a set of betting odds that guarantees loss to one side regardless
  of outcome. A practitioner: someone who runs a prediction market / a bookmaker /
  a person doing a "calibration" check on a forecaster''s probabilities. Or a "superforecaster"
  auditing their own probability assignments for coherence. Or a decision analyst
  at a company auditing an expert''s probability elicitation.


  Great role: someone at a forecasting outfit / a risk officer who elicits probabilities
  from subject-matter experts and needs to check coherence — scan for Dutch-bookable
  inconsistencies (violations of probability axioms: complementation, additivity,
  subadditivity over partitions, failure of the multiplication rule for conjunctions,
  failure of total probability). Procedure: elicitation steps, checks in order, what
  to do when a violation is found (which bet to construct, how to present it), where
  judgment is needed.


  Also a great worked example: the conjunction fallacy (bank teller), and the "packages"
  — probability of "X and Y" exceeding "X". And the "certainty" case where an expert
  says P(A) = 0.7 and P(not A) = 0.5 (sums to 1.2 → easy Dutch book). Also the case
  where the expert''s P(A∨B) < P(A)+P(B) — subadditivity violation: actually the violation
  is P(A∨B) > P(A)+P(B) which allows a Dutch book (buy the disjunction? Let''s check).


  Standard: A set of prices is Dutch-bookable iff they violate the probability axioms.
  To construct the book you generally need to be able to buy/sell at the stated odds,
  i.e., the expert''s prices are treated as both bid and ask (a "frictionless" assumption).
  Important honest caveat: real Dutch books require the expert to accept bets at their
  stated prices, both directions, with no transaction costs, and the loss may be small;
  also a Dutch book shows the prices are incoherent, but doesn''t tell you which price
  is wrong. Also, the "dynamic" Dutch book / diachronic Dutch book (diachronic Dutch
  book argument for conditionalization) — a procedure could include a check for the
  update rule: elicit P(A) now, then plan: P(A|B) now; when B is learned, the new
  P(A) should equal the old conditional. A diachronic Dutch book can be constructed
  if they diverge. That''s in the weeds and good — this is Lewis''s Dutch book argument
  for conditionalization (Teller 1973 "Conditionalization and observation"? Actually
  the diachronic Dutch book argument is due to David Lewis, unpublished, circulated;
  and Teller 1973). I should be careful about attributions — I can just mention it
  descriptively without citing.


  Also scoring rules: strictly proper scoring rules (Brier, log) — if you want to
  avoid a Dutch book in a scoring-rule setting, you report your true probability.
  That''s a nice practical device: a procedure that says elicit via proper scoring
  rule, then check coherence by constructing bets.


  The prompt should be elaborate, casual, with a typo or two, one to three paragraphs.
  Role: I work at a forecasting shop / "I run a small forecasting desk" — we produce
  probabilistic predictions; we hire outside experts; I want a checklist that a non-philosopher
  analyst can run in half an hour with an expert to find incoherent probability sets
  and fix them.


  Constraints: time (~30 min interview), the expert is a domain scientist (epidemiologist?
  let''s say someone in supply chain) not a probabilist, who has to sign off, we can''t
  force them; we don''t want to alienate them by "gotcha"; we need to decide whether
  to adjust the numbers ourselves or send back.


  Hard cases the procedure must handle:

  - Expert prices a disjunction lower than a disjunct, or conjunction higher than
  a conjunct.

  - Expert refuses "fair odds" framing ("I''m not a betting person") — need to translate
  to equivalent "which would you rather have" or use scoring rule / relative likelihood.

  - Expert''s numbers violate additivity across a partition because they use different
  "granularity"/reference classes.

  - Diachronic: expert''s conditional now vs their update later.

  - The case where the expert says "I know it''s incoherent but I don''t care" — i.e.,
  probability as a measure of confidence vs. decision weight; also whether to allow
  imprecise probabilities (a set of probabilities) — if they refuse a point estimate,
  allow ranges and check the boxes don''t have to be a single point.


  Worked examples: two or three cases. Include one where the procedure gives an answer
  the asker won''t like — e.g., the procedure says we have to change our own house
  probabilities, or says "the expert''s incoherent set still forecasts better than
  your coherent one" — i.e., a coherent set can be worse in accuracy (coherence is
  not accuracy; there is no Dutch book but the forecast can be badly wrong). That''s
  the "answer the asker won''t like": the check finds nothing actionable — the Dutch
  book loss may be tiny, and the violation is in a branch you''ll never resolve, so
  you should not adjust anything; or the procedure forces you to admit the elicited
  numbers can''t be de-booked because the expert won''t take the other side.


  Good — that''s genuinely in the weeds and honest.


  Also the conceptual translation: Dutch book = incoherence ⇒ vulnerability to a sure
  loss; the procedure must keep that content while being usable. Key distinctions
  to preserve: (1) the bets must be simultaneously acceptable to the expert in both
  directions; (2) sure loss vs. expected loss; (3) the argument shows incoherence,
  not incorrectness; (4) probability as degrees of belief that are "gradable" — a
  Dutch book against a person who only has a partial order or a range doesn''t apply
  the same way (you need to have them commit to a number); (5) finite additivity vs
  countable additivity — countable additivity isn''t enforced by Dutch books in the
  same way (a "countable Dutch book" requires infinite bet stacks — the distinction
  between the two types of Dutch book arguments, e.g., for countable additivity you
  need a stronger "no sure loss over countably many bets" assumption, and it can be
  objected that no one can take infinitely many bets). That''s a nice in-the-weeds
  point: our procedure should only check finite additivity and note that the countable
  version is contested.


  Also: the money-pump/utility version — the same incoherence appears as a preference
  cycle among bets; and the "two bets" construction: if P(A)=p and P(not A)=q with
  p+q>1, sell both sides... let''s get the mechanics right.


  Dutch book construction: If P(A) = p and P(¬A) = q with p + q > 1. The expert''s
  price for a bet that pays $1 if A is p, and their price for a bet that pays $1 if
  ¬A is q. Sell to them both tickets (they buy both), collecting p + q > 1, and exactly
  one pays off $1, so they net p+q−1 > 0 loss... wait, we sell, they pay us p+q, and
  we pay them $1. So our profit = p+q−1 > 0. Yes, sure profit for the bookie. Correct.


  If p+q < 1: buy both tickets from them for p+q, receive $1 for sure. Profit 1−p−q.


  Conjunction: P(A∧B) > P(A): Buy from them the A∧B ticket at price P(A∧B)? Hmm. To
  exploit: sell them the conjunction at price c = P(A∧B) and buy the A ticket at price
  a = P(A). Since c > a, net cash now: c − a > 0. Payoffs: we pay $1 if A∧B, we receive
  $1 if A. Worst case: A true, B false: we pay 0, receive 1 → we get an extra $1.
  If A true and B true: pay 1, receive 1 → 0. If A false: 0. So we pocket c − a >
  0 plus nonnegative payoff. Sure profit. Good.


  Subadditivity: if P(A∨B) > P(A) + P(B) for disjoint... for non-disjoint A,B, the
  constraint is P(A∨B) ≤ P(A)+P(B). Violation: sell the disjunction ticket at price
  d, buy A ticket and B ticket at a + b. Net d − a − b > 0. Payoffs: pay 1 if A∨B;
  receive 1 if A, 1 if B. If A true only: pay 1, receive 1 → 0. Both true: pay 1,
  receive 2 → +1. Neither: 0. So sure profit. Good.


  Also "P(A) > P(A∨B)" — monotonicity: sell A at price a, buy A∨B at price d where
  a > d. Net a − d > 0, payoffs: pay 1 if A, receive 1 if A∨B. A true: 0 or... A true
  implies A∨B true: pay 1 receive 1 → 0. A false: 0. So profit a−d. Good.


  Diachronic: the classic diachronic Dutch book for conditionalization: if P(A|B)
  = q now but after learning B they set P(A) = r ≠ q, the bookie can make a book in
  advance: buy/sell bets conditional on B being learned... The construction (Lewis/Teller):
  the bookie sells a bet on A that only goes into effect if B (a "conditional bet"):
  if the agent''s current P(A|B) = q, the agent is willing to buy a ticket paying
  $1 if A, conditional on B, at price q — the bet is called off (stake returned) if
  B is false. Then the bookie also places side bets on B that pay off in the cases.
  Then when B is learned, the agent''s new P(A) = r, and they''ll buy or sell a bet
  on A at price r. Depending on r vs q, the bookie sets up the side bets to guarantee
  a sure loss. Right — the essential point: your future self, if it doesn''t conditionalize,
  will take a bet your current self would call off, and the difference can be exploited.
  Good enough.


  Also: the honest caveats — (a) sure-loss requires you to actually accept the bets,
  both directions, at your stated prices, in unlimited (or at least sufficient) stake,
  and simultaneously; (b) it''s a coherence argument, not an accuracy argument — a
  coherent bookmaker can be systematically wrong about the world (a coherent probability
  can be badly calibrated); (c) it assumes your "degrees of belief" are exactly the
  prices at which you''re indifferent to buy or sell, i.e., the agent is an "expected
  utility maximizer with linear utility in money" — risk aversion breaks the identification;
  (d) small stakes / no counterparty; (e) the money-pump vs sure-loss distinction.


  Also worth flagging: the "loss" framing depends on your utility being linear in
  the stakes; if stakes are large relative to wealth, the bets you''d accept change.
  Practical procedure: keep stakes small, use "units", check only the algebra.


