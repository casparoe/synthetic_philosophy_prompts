  \ Damascus\" is the decision theory problem by Andy Egan: a man in Damascus meets\
  \ Death, Death looks surprised, he flees to Aleppo... Let me recall. Egan's \"Death\
  \ in Damascus\" is a decision problem where Death has already decided where to meet\
  \ you; the agent's choice is causally irrelevant to where Death goes, but evidential\
  \ decision theory says stay in Damascus because if you're in Aleppo it's because...\
  \ Hmm. Actually the story: you are in Damascus and meet Death, who is startled;\
