  \ You meet Death in the market in Damascus; Death is surprised to see you. You know\
  \ Death has a plan: Death will be wherever you are tonight? No.\n\nThe classic decision-theoretic\
  \ version (Egan 2007, \"Some Counterexamples to Causal Decision Theory\"): The agent\
