  Transformative experience: L.A. Paul, "Transformative Experience" (2014). Key ideas:
  epistemically transformative experiences (you can''t know what it''s like without
  having it) and personally transformative experiences (they change your core preferences/point
  of view). Examples: becoming a vampire, having a child, cochlear implants, becoming
  a parent. The rational choice problem: when deciding whether to have a transformative
  experience, you cannot evaluate the outcomes because you don''t know what they''ll
  be like, and your preferences may change. Paul argues that in such cases, the decision
  cannot be made by standard expected utility reasoning; one option is to choose based
  on the value of "discovering" or revelation itself — "choosing to have the experience
  because of its transformative character" — "deciding to decide" or being "a reveler"
  vs. "a non-reveler". Paul''s own conclusion is somewhat controversial: she suggests
  that in transformative cases, we might rationally choose based on the value of self-transformation
  and revelation itself, and this means we may have to treat the decision as one where
  we''re "discovering" a new self.


  Other relevant literature: Edna Ullmann-Margalit''s "transformative choices", Ruth
  Chang on hard choices / commitment, Richard Pettigrew''s critique "Transformative
  experience and decision theory" (argues we can use decision theory with possible
  preference change, using "transformative utility" or higher-order preferences).
  Also, Elizabeth Harman, and there''s discussion of whether the "epistemic" and "personal"
  transformations can be separated. Also "epistemic transformation" — becoming a parent,
  becoming a vegan, taking psychedelics, learning a language fluently, etc.


  Also relevant: the notion of "informed consent" and how medical decisions involving
  transformative experiences (e.g., cochlear implant, amputation for body integrity
  identity disorder, gender transition) pose a problem for informed consent since
  you can''t be informed.


  The commitments should be largely reasonable, held by a recognizable kind of person
  (a retired natural scientist who''s gotten into philosophy — maybe someone who values
  decision theory, expected utility, and empirical evidence, but also has intuitions
  about epistemic humility). Include one or two genuine tensions not obvious, plus
  at least one apparent tension that dissolves.


