  (a) I am a thoroughgoing evidentialist about practical rationality: a choice is
  rational only if it maximizes expected utility with respect to my credences and
  utilities, and the credences must be grounded in evidence.


  (b) I think there are genuine transformative experiences in L.A. Paul''s sense —
  cases where you cannot know what the experience will be like without undergoing
  it, and where undergoing it will change your core preferences — and I think they''re
  not rare; they''re the most important decisions in life.


