  Actually, consider "Who''s Afraid of Virginia Woolf?" (Albee 1962 play / 1966 film).
  It''s famously about a couple whose conversation is a "game" — the title itself
  is a joke that implies (without saying) something about the "big bad wolf," and
  the whole play is built on implicature, insinuation, and the final "truth and illusion"
  game where George "kills" the son by *saying* it (he tells the story of their son,
  then says "he died" — and it''s a fact he had only implied before). The play is
  a perfect laboratory: the "games" are cooperative-seeming activities with a competitive
  purpose; and there''s the famous question of whether the "son" was real or a fiction
  they maintained — a fictional entity sustained by implicature! That''s fantastic:
  Martha and George''s son exists only as something they both imply and never state;
  and the play''s climax is the destruction of a fiction by making it explicit. That''s
  a *great* prompt: the ontology of the son depends on the norms of conversation —
  the fiction was sustained by mutual implicature (never saying it, always implying),
  and George kills it by asserting it. Also Grice''s reflexivity: the son''s existence
  requires mutual recognition of intentions; the whole thing is a "mutual pretence"
  — and Grice''s account of meaning as *reflexive intention* explains why a mutually-recognized
  pretence can be "real" within the marriage.


