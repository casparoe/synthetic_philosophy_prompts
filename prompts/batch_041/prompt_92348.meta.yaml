reasoning_summary: 'The task: write a satirical/parody prompt in one of the domains.
  Let me pick a domain that combines well with satire. Options:


  - Democratic backsliding

  - Chaos, predictability, determinism

  - Galen Strawson''s Basic Argument against moral responsibility

  - Cause prioritization frameworks (importance, tractability, neglectedness)

  - Hannah Arendt''s Eichmann/banality of evil


  Satire target should be a position, argument, practice, or style of discourse, not
  a named living person. An invented proponent is fine.


  Ideas:


  1. A parody "Effective Altruism cause prioritization" — an in-universe grant-application
  / charity evaluator''s report from a foundation that applies importance/tractability/neglectedness
  with absurd rigor to saving one''s own drowning child vs. buying bed nets. Or a
  "cause prioritization" office that ranks personal moral obligations by ITN scores.
  That''s fun: an EA-style "career planning" document where a person applies the framework
  to deciding whether to attend their mother''s funeral (low neglectedness — many
  others will mourn her; low tractability...). Good.


  2. Galen Strawson''s Basic Argument — a satirical "apology letter" or "customer
  service" from a company that has abolished moral responsibility. E.g., an in-universe
  HR memo / performance review in a company that has adopted the Basic Argument: "we
  cannot hold employees responsible, so instead we adjust causal histories." Satire
  from inside the position: the joke is that the company''s "rehabilitation" is indistinguishable
  from punishment. Actually good: internal consistency required.


  3. Arendt/banality of evil — satirical: a job advertisement for a bureaucratic role,
  or an "employee of the month" newsletter, in a totalitarian bureaucracy. Could be
  strong but sensitive; satire about Eichmann risks being in poor taste. Could do
  a parody of a "thoughtlessness" self-help guide. Hmm. Or a "middle manager''s guide
  to just following orders" — that''s a bit obvious and possibly distasteful.


  4. Chaos/determinism — a weather-forecast parody? Or a "product review" of a Laplace''s
  demon home assistant. Actually nice: a consumer product review of a Laplacian prediction
  engine, or a parody of a self-help book on predictability. Or a "horoscope" column
  written by a determinist — "your future is fixed, so why bother". Hmm.


  5. Democratic backsliding — a parody "democracy audit" rubric / a self-assessment
  checklist by a government that is backsliding. Or a "wellness" style quiz: "Is your
  democracy backsliding? Take our quiz!" Or a press release from a state that has
  just been rated "partly free" complaining that the concept is a partisan label.
  Actually that''s a great fit for the domain''s core question: who decides what counts.
  A deadpan press release / official statement from an invented government''s foreign
  ministry objecting to a backsliding index, in which the objection is legitimate-sounding
  and makes the real conceptual points (the concept as partisan label, the measurement
  problem, the "who decides" issue). But satire should be fair to the target: the
  target being the discourse of backsliding indices? Or target = the rhetorical move
  of dismissing backsliding as partisan label. Hmm — the target should be a position/practice.
  Good target: the practice of scoring democracy by expert-coded indices, and/or the
  self-serving complaint.


