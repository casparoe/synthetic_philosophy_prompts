  Let me now think hard about the *content* so the prompt is sharp and in the weeds:


  Order of ideas for Kripkenstein:

  1. Start with the ordinary fact that we mean things by our words and we can follow
  rules — take it as obvious.

  2. The "grasping" intuition: when you understand a rule, you''ve got something in
  mind that determines what counts as going on correctly in *all* cases, including
  ones you''ve never considered.

  3. The skeptical challenge: any finite set of past applications is compatible with
  infinitely many rules that diverge later. So what fact about you makes it the case
  that you meant plus rather than quus? (Need: the candidate fact must be *normative*
  — it must tell you what you *ought* to do, and it must be something you can be *wrong*
  about.)

  4. Why dispositions fail (the dispositionalist reply: you''re disposed to answer
  "5"). Kripke''s objections: finiteness of life, the possibility of error (you might
  be disposed to make a mistake, but then you''d mean the wrong thing), the normativity
  gap (dispositions tell you what you *will* say, not what you *ought* to say), and
