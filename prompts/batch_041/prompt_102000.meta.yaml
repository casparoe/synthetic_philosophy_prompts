  A standard correct resolution: The expected gain from switching is not well-defined
  because the prior distribution over the amounts is improper (if you allow any amount
  with equal "log" prior, E[value] diverges). Alternatively: the argument that "the
  other envelope contains 2X or X/2 with equal probability" is false; the equal-probability
  claim depends on a distribution, and for a proper prior the posterior probabilities
  are not 1/2 each for all X. So switching reasoning is invalid. And the genuine puzzle:
  for any particular finite proper distribution, computing the conditional expectation
  shows switching is not always favorable; it''s favorable for some X and unfavorable
  for others, and the unconditional expected gain is zero.


  But there''s a subtler version: even if the expected gain is zero unconditionally,
  there''s a variant where you look in the envelope (X = $10) and then compute the
  conditional expected value given X, using a flat prior over the other envelope —
  which is improper. So the resolution: the paradox exploits an improper prior; conditional
  expected values can''t all be favorable if the distribution is proper (a "no uniform
  distribution over the reals" argument). This is the classic "the paradox arises
  from using a probability distribution that cannot be normalized."


  Actually there''s a neat proof: for a proper distribution, the two envelopes'' values
  have the same distribution, so by symmetry the expected value of the other envelope
  equals yours... wait no, conditionally it can differ. The correct statement: E[V_other]
  = E[V_yours] = E[V], by symmetry. But conditional on observing X = x, E[V_other
  | X = x] can be > x for some x and < x for others, and averaged over x it equals
  E[V]. The paradox''s error is assuming the conditional expected value is > x for
  all x.


  There''s also the "two-envelope paradox with a fixed sum" version: if the total
  is fixed, then one envelope has T/2, the other T, and switching is neutral (gain
  +T/2 or -T/2 with prob 1/2). So the paradox only arises when the total is unknown.


