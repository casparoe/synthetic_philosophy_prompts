  Hmm, that''s a good summary with errors:

  1. "never ask whether assumptions are true" — overstatement; Friedman''s actual
  test is predictive accuracy relative to alternatives, and assumptions do figure
  in specifying the domain.

  2. "the better the theory, the less realistic its assumptions — unrealism is a sign
  of power" — turns a descriptive observation about significant hypotheses into a
  methodological virtue and a sufficient condition; Friedman explicitly denies that
  unrealism by itself makes a theory significant.

  3. Instrumentalism + "asking whether a model is true is a category mistake" — overreach;
  contested reading; Friedman treats hypotheses as empirically testable claims and
  doesn''t deny truth-value; the "as if" is not a fiction claim.

  4. "positive economics is just prediction, so it''s value-free... economists can
  settle policy debates without importing moral views" — conflates the positive/normative
  distinction with the F-twist, and overstates Friedman''s own (weaker, and much-contested)
  claim that disagreements among economists about policy stem mainly from differences
  in predictions rather than values; Friedman doesn''t say values only come in at
  the end, and he grants that normative judgments are needed for policy.

  5. "makes theories unfalsifiable" + "Samuelson demolished it" + "no one defends
  it anymore" — the criticism is real but is an objection, not a refutation; the "no
  one defends it" claim is false (Hausman: it''s still used to dodge questions about
  idealization); and the unfalsifiability charge is more precisely about shielding
  assumptions, but Friedman''s criterion is comparative predictive performance.

  6. Also the conflation of "unrealistic" with "false" and with "idealization/abstraction"
  — Friedman''s point is about omitting predictively irrelevant detail, and modern
  discussion of idealization distinguishes negligibility/domain/heuristic assumptions.
