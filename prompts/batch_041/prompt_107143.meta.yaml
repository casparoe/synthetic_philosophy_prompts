  says this would verify the claim that the person survives death. Does it? And does
  this prospect show that Ayer''s verdict — that survival statements are meaningless
  — was wrong, or does it leave that verdict standing (perhaps by showing that what
  the lab verifies is a different claim)? Defend your answer."


