  between reasons and causes, so either reason-talk is universal (vacuously true)
  or it''s empty. Where does it go wrong? Probably step (3): the equivocation between
  "has a rationale" (there is a consideration in the space of reasons) and "is done
  for a reason" (the reason figures in the agent''s production of the behavior). Dennett''s
  own distinction: the rationale is free-floating precisely because it''s not the
  agent''s reason. So (3) is the culprit — the move from "there is a rationale for
  B" to "B is done for a reason" trades on the ambiguity of "for a reason." Then what
  does rejecting it cost? It costs... you have to explain how we get from free-floating
  rationales to genuine reasons without smuggling in a homunculus; the "cheap" reading
  makes "reason" equivocal; you lose the ability to say selection explains the origin
  of intentionality. And there''s the question of whether some free-floating rationales
