  Free-floating rationales (Dennett): a rationale is a reason for something that need
  not be represented by any reasoner. E.g., the "rationale" for a bird''s alarm call,
  or the "reason" the wasp digs a burrow. Dennett: "there is a reason for the behavior,
  but no reasoner." Then the argument that seems to prove too much:


  (1) A rationale for a behavior is a consideration that would justify or explain
  the behavior if it were performed by an agent who grasped it.

  (2) Evolution by natural selection can bestow rationales on behaviors without any
  agent grasping them — the traits that survive are the ones whose "reasons" were
  good.

  (3) If a behavior has a rationale, it is (in some sense) done for a reason.

  (4) If a behavior is done for a reason, the behavior is a rational action (or at
  least an intentional one, attributable to an agent).

  (5) Selection bestows rationales on all sorts of things: the shape of a clam''s
  shell, the color of a moth''s wings, the tendency of a river to carve a canyon (?)
  — no, better: thermoregulation, immune responses, plant tropisms.

  (6) So plants, immune systems, and arguably rivers "act for reasons."

  (7) But "acting for a reason" is what distinguishes minded action from mere mechanism.
  So either everything is minded (panpsychism-ish) or nothing is (eliminativism about
  reasons).


