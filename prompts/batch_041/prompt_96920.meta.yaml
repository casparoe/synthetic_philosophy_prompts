  Potential interlocutors: Dana (intention-based Gricean) and Mira (convention/audience-based
  or relevance-theoretic). They disagree about whether the chair''s utterance carried
  an implicature that the candidate was shortlisted.


  Move 1: Dana: The chair conversationally implicated that the candidate was a serious
  contender, because saying "we were impressed by your file" in a rejection context,
  when the chair could have said nothing, exploits the maxim of relation/quantity;
  the candidate reasonably took the chair to mean she was advancing. Mira: That''s
  not an implicature, it''s a prediction. The chair''s sentence has a truth-conditional
  content; the candidate''s inference is defeasible and depends on her expectations,
  not on what the chair intended to communicate. If the chair didn''t intend her to
  draw that inference, it''s not speaker meaning.


  Move 2: Dana: But Gricean speaker meaning is not a private mental event; it''s a
  reflexive intention meant to be recognized. The chair knew the conventions of hiring
  and knew the candidate would infer she was shortlisted. That''s enough for implicature.
  Mira: Knowledge that someone might infer something is not intention that they infer
  it. I know my student will infer I''m disappointed if I pause, but I don''t mean
  to communicate disappointment. Implicature requires the speaker to intend the audience
  to recognize the intention. Otherwise everything we knowingly cause to be believed
  becomes meaning.


  Move 3: Dana: The pause case is different: the chair''s utterance is a communicative
  act in a cooperative exchange, and the maxims generate the inference. The chair
  could have cancelled it ("we were impressed, but the pool is very strong") and didn''t.
  Cancellability is the mark of implicature. Mira: Cancellability shows it''s an implicature,
  not that it''s speaker meaning. And some implicatures are not cancellable in context;
  some entailments are cancellable. More importantly, if the chair didn''t intend
  the shortlist inference, then by Grice''s own definition it''s not speaker meaning.
  You''re using "implicature" to cover any pragmatic inference the audience makes.


