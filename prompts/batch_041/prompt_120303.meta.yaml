  Let me combine: two phases.

  Phase 1 (20 min): Each group gets its own "paradigm kit": a lexicon (8–10 kind-terms
  with definitions), an exemplar solved case, a puzzle set, and a scoring rule. They
  solve puzzles and score points. Crucially, each kit has a rule about what counts
  as a well-formed question and a rule that discounts a certain kind of observation.

  Phase 2 (15 min): Each group receives an "anomaly" — a case that the kit can''t
  classify cleanly. They must decide: patch (ad hoc auxiliary rule) or declare the
  case illegitimate. Record what they did. This is the crisis/normal-science moment,
  and it makes the point that anomalies are only anomalies relative to a paradigm.

  Phase 3 (20 min): Cross-paradigm tribunal. One member from each group swaps. Each
  side must *translate* the other''s lexicon into their own and produce a verdict
  on a disputed case. They''ll find partial translations and systematic gaps: some
  terms in the other lexicon have no counterpart, and every candidate counterpart
  imports an entailment the other rejects. Then a joint attempt to find a "neutral"
  observation language fails or succeeds only at the cost of triviality. Also, each
  group should be scored using the *other* group''s rubric to feel "Kuhn loss."

  Phase 4 (10 min): Forced choice: if the two kits must be compared, on what basis?
  Each group proposes a criterion; the other group shows the criterion is internal
  to its own kit. Then: is there any criterion both accept? If yes, note it; if no,
  note that.


