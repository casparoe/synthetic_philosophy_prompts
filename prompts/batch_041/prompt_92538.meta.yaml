  house. And you can point to invented rituals — the ''ancient'' Highland dress was
  largely manufactured in the 18th–19th centuries; the ceremonial that now looks immemorial
  was staged recently."

  5. A: "So what? Every institution was invented at some point. The question is whether
  the thing it expresses was real. And invented doesn''t mean fake: if people are
  willing to die for it, it''s real enough. Also, why is ''modern'' a criticism? Modern
  is when most things we care about — democracy, human rights, the individual — were
  invented."

  6. B: "Because you''re using ''nation'' in two senses: the community that exists
  in people''s heads and the political claim that it should have its own state. The
  first can be old; the second is modern, and it''s the one that caused the wars.
  When you say ''we''ve been a nation for a thousand years'' you''re smuggling the
  political claim into the historical one."

  7. A: "But if the political claim is only modern, then it can''t be the deep source
  of the feeling, and the feeling is what actually drives people. So the modernist
  story explains the flag but not the blood."

  8. B: "And your story explains the blood but not the flag — it can''t say why people
  who shared a language for centuries only started killing over it after 1800."


