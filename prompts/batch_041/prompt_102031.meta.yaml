  Let''s outline:


  - Opening: I have no formal training in philosophy, demography, or economics, but
  I have been thinking on my own about whether a larger population is better. I keep
  encountering arguments for pronatalism, against population growth, and about whether
  adding happy people makes the world better. I want the specification before any
  verdict.

  - Task: Write the desiderata that any theory of whether a larger population is better
  must meet. I want a list of requirements, with the case or consideration behind
  each. What phenomena must it explain? Which cases must it get right? Which distinctions
  must it respect? Which results from biology/economics/demography must it not contradict?
  Which requirements are non-negotiable and which are preferences of particular camps?
  Flag any pair or subset of requirements that cannot be jointly satisfied. Then,
  if you can, say which single requirement does the most to exclude popular theories.

  - Then inject new cases: To make this concrete, here are some cases I have been
  turning over. (1) A technology creates simulated minds who are happy, have rich
  inner lives, never know they are simulated, and can be created in any number without
  affecting anyone outside. (2) A variant where their happiness depends on a false
  belief that they are real. (3) A variant where their lives are barely worth living.
  (4) A variant where the simulation uses computational resources that would otherwise
  create a smaller number of much happier simulated minds. (5) A policy that increases
  population by extending lives rather than creating new people. (6) A policy that
  increases population by immigration rather than births. (7) A policy that adds people
  who are happy but whose existence changes who else is born, so that different people
  exist. (8) A policy that adds people who are happy but makes existing people slightly
  worse off. (9) A policy that adds people who are miserable but whose existence prevents
  a larger number of people from being even more miserable. (10) A world where population
  size increases but average happiness decreases, and vice versa.

  - Then ask: For each requirement, say which of these cases motivates it. In particular,
  I want the theory to be able to compare worlds that differ both in how many people
  exist and in how well off those people are, and worlds where the identities of the
  people differ. It should also handle the difference between making someone better
  off and making more people. It should not treat people as mere means or as interchangeable
  units. It should handle uncertainty about future lives and about whether they will
  be worth living. It should distinguish population size from population density,
  from life-years, and from the number of minds. It should respect the intuition that
  adding a happy person is not automatically bad, but also the intuition that a huge
  population of barely happy people is not automatically better than a smaller population
  of very happy people.

  - Then ask: Tell me which of these requirements are genuine desiderata and which
  are prejudices of one camp. Which are jointly unsatisfiable? I suspect there is
  a tension between the requirement that adding a happy person cannot make a world
  worse and the requirement that a world of many barely happy lives cannot be better
  than a world of few very happy lives, but I want to know whether that is the real
  fault line or whether there is a deeper one.

  - Then: Skip the scorecard of named theories unless it is needed to explain a requirement;
