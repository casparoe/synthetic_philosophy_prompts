  Options:

  - Memes and the Darwinian theory of culture — Dennett, Dawkins, cultural evolution.
  Subtle misrepresentations: conflating Dawkins'' "meme" as a unit of imitation with
  a claim about memes being like genes in being faithfully copied; the common claim
  that Dawkins thought memes are "selfish" like genes; the misrepresentation that
  memes are discrete, high-fidelity replicators (cultural evolutionists like Boyd
  & Richerson, Sperber''s "cultural attractors" argue against). Also the conflation
  of "meme" as internet image with the original concept. Good.

  - Luminosity and the KK principle — Williamson''s anti-luminosity argument. Subtle:
  the KK principle is "if one knows that p, one knows that one knows that p." Luminosity
  is a property of a condition: if one is in it, one knows one is. Common conflation:
  luminosity vs KK; also the claim that Williamson''s anti-luminosity argument relies
  on "safety" or on a margin-for-error principle; also that it''s a sorites-style
  argument. Actually a common misrepresentation: that Williamson argues knowledge
  is not luminous because of vagueness, or that the argument turns on skepticism.
  Also the claim that anti-luminosity refutes KK. That''s a nice subtle error — anti-luminosity
  is about knowledge of one''s own mental states/conditions, KK is about iterated
  knowledge; they''re related but distinct, and anti-luminosity doesn''t straightforwardly
  refute KK (indeed KK is false but for different reasons; also one can have KK without
  luminosity of a non-mental condition). Good domain.

  - Grice on implicature — subtle: conflating what is said with what is meant/implied;
  the claim that Grice thought all implicatures are cancelable (true for conversational,
  not conventional); conflating "maxims" with rules; treating flouting as violating.
  Common misrepresentation: "Grice said we should always be brief and truthful" —
  maxims as social rules rather than rational expectations; also conflating implicature
  with entailment/presupposition. Also the claim that Grice''s theory is about what
  speakers intend vs. what hearers infer — good.

  - Divine hiddenness — Schellenberg''s argument. Subtle: the claim that the argument
  concludes God doesn''t exist (it concludes no perfectly loving God exists, or that
  nonresistant nonbelief is incompatible with a loving God); conflating hiddenness
  with the problem of evil; the claim that the argument only applies to Christianity;
  the claim that the argument depends on "reasonable nonbelief" being blameless. Also
  misrepresenting the "divine hiddenness" as merely the fact that God doesn''t show
  himself — and that the argument is a version of the problem of evil. Also the "response":
  the claim that Schellenberg says anyone who doesn''t believe is culpable. Good.

  - Reference class problem — this one is interesting and less "literature-y." It''s
  about probability: the problem of choosing the right reference class for a single-case
  probability, e.g., Venn, Reichenbach. Subtle misrepresentation: that the problem
  is only about frequentism and disappears on Bayesian views; or that the reference
  class problem is the same as the problem of the single case; or the "narrowest reference
