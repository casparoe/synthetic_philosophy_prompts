  Let''s draft a prompt with domain "Competence without comprehension: Darwin''s and
  Turing''s strange inversions of reasoning" and type "Ask for interview questions
  for a guest". We need to inject a new/niche idea. The guest''s thesis: The standard
  assimilation of Darwin and Turing is too quick. Darwin''s inversion is about the
  origin of teleological appearance from non-teleological processes: selection produces
  fit without a designer who represents the fit. Turing''s inversion is about the
  implementation of reasoning from non-reasoning components: a machine can follow
  rules without understanding them. The guest argues that these are inversions of
  different things: Darwin inverts the order of explanation between function and mechanism;
  Turing inverts the order of explanation between rule and understanding. The confusion
  in AI debates is to think that because a system is Darwinian (selected) or Turingian
  (computational), it thereby has competence in the same sense. The guest proposes
  a distinction between "selectional competence" (a lineage-level property) and "computational
  competence" (a system-level property), and argues that most claims about AI competence
  without comprehension slide between the two. This is a niche idea. We can ask for
  questions that press on this distinction.


  Potential prompt:


  "I host a small podcast on philosophy of biology and cognitive science, and next
  week''s guest is a philosopher who works on the foundations of evolutionary theory
  and computation. Her recent project is a sustained attack on a move that has become
  almost automatic in discussions of AI and animal minds: invoking Darwin and Turing
  together as two great precedents for the idea that competence can exist without
  comprehension. Her claim is not that the precedents are wrong but that they are
  inversions of different things, and that the standard pairing hides a equivocation.
  Darwin''s inversion, as she reconstructs it, is about the order of explanation between
  function and mechanism: selection can produce ends-directed organization without
  any representation of those ends, so the competence belongs to a lineage and is
  measured by differential reproduction. Turing''s inversion, by contrast, is about
  the order of explanation between rule and understanding: a formal system can implement
  a rule-governed procedure without any grasp of what the rules mean, so the competence
  belongs to a system and is measured by what it computes. She argues that contemporary
  debates about large language models, reinforcement learning, and animal cognition
  routinely slide between these two senses, treating a system''s computational competence
  as if it were evidence of a lineage''s selectional competence, or vice versa, and
  that this slide is what makes both the hype and the dismissals so slippery."


  Then ask: "Draft eight to ten interview questions for me. I want the questions to
  press on the actual joints of her distinction rather than let her restate it. Please
  include at least one question on whether the two inversions are really distinct
  or whether reinforcement learning collapses them; at least one on whether selectional
  competence is even a property of individuals or only of populations; at least one
