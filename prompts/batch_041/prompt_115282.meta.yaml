  "Next month I''m presenting a paper to a small reading group in philosophy of language,
  and I need a Q&A prep sheet rather than advice about the paper itself.


  The thesis I''ll defend: the triviality results for indicative conditionals should
  be read not as an extra constraint on a truth-conditional semantics but as a proof
  that the equation relating the probability of ''if A, then B'' to the conditional
  probability of B given A is a category mistake — indicative conditionals do not
  have truth conditions, and the suppositional treatment is the only stable option
  rather than a fallback for people who have already given up on truth conditions.


  The argument I''ll actually give has three parts. First, the triviality proof goes
  through on assumptions so weak — essentially a probability function over a language
  that can express the conditionals and their Boolean combinations, plus the equation
  for the simple cases — that the standard escape routes (restrict the equation to
  a special class of ''simple'' conditionals, deny closure under embedding, accept
  that the equation holds only approximately) all fail to leave a stable position:
  any restriction principle strong enough to block the proof has to be stated in the
  very language it is restricting, and I''ll argue it either collapses back into the
  unrestricted equation or leaves the semantics without any account of compounds.
  Second, the impossibility result connecting the Ramsey test to the standard postulates
  for belief revision (Gärdenfors''s) is not an artifact of AGM but the qualitative
  shadow of the same phenomenon, and I''ll use it to argue that ''the probability/acceptance
  of a conditional'' is not a propositional attitude with a content at all. Third,
  the alternative — keep truth conditions and drop the equation — is less attractive
  than it looks, because it makes the near-universal practice of reasoning with conditional
  probability in conditional assertion a massive coincidence rather than a constraint
  on meaning. My positive proposal is that ''if'' contributes not a content but a
  suppositional mode of assertion, and that the awkward cases (negated conditionals,
  disjunctions of conditionals, conditionals with conditional consequents) are to
  be handled as cases of asserted/embedded supposition rather than as embedded propositions."


