  Question: Cognitive penetration is standardly characterized as the influence of
  a subject''s beliefs, desires, or other cognitive states on the contents of her
  perceptual experience. (a) Distinguish cognitive penetration from two other kinds
  of top-down influence on perception that are usually not counted as penetration,
  and say why the distinction matters. (b) Explain what turns on the existence of
  cognitive penetration for the thesis that perceptual experience can justify empirical
  belief. (c) State whether the empirical evidence establishes penetration and defend
  your answer.


  Student''s answer: "(a) Cognitive penetration is when what you think or want changes
  what you see. The clearest cases are attention and perceptual learning: attending
  to a feature makes it more salient, and once a radiologist has learned to read scans
  the tumours start popping out at her, which shows that her beliefs about tumours
  are shaping her visual experience. Cross-modal cases like the McGurk effect get
  cited for the same reason, since vision and audition influence each other. So penetration
  comes in degrees, and the real question is how far up the processing stream the
  influence reaches.


  (b) What turns on it is that perception is supposed to be the tribunal against which
  belief is tested. If beliefs can reach down and alter experience, experience cannot
