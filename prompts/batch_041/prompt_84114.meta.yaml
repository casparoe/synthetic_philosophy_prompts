  without 90 days of documented abstinence, and our committee''s job is only to confirm
  the 90 days were real. The only escape hatch is one sentence in the policy saying
  the medical director "may grant an exception in unusual cases." It''s been invoked
  twice in five years, and both times the patient''s family had already retained a
  lawyer. Nobody on the committee is proud of that sentence.


  The case in front of us: a 41-year-old woman, alcohol-related liver disease, 11
  weeks since her last drink (so under the rule, but only just), enrolled in an intensive
  outpatient program, has a sponsor she actually talks to, decompensating — her hepatologist
  says months, not years, if we don''t list. Two kids, 9 and 14; partner works nights.
  One relapse two years ago, right after her mother died. Addiction medicine consult
  says her odds of sustained sobriety are "a coin flip, honestly." If we wait for
  day 90 she may not be alive for it.


  Two of my colleagues are dug in and I need the memo to deal with both honestly.


  One says the flat rule is the whole point: it protects patients from us, keeps us
  from rewarding whoever has the best advocate, and spares us from pretending we can
  predict relapse. She also says a committee that starts bending rules for sympathetic
  cases will bend them for the articulate and the well-off, and that the two lawyer-assisted
  exceptions we''ve already granted are proof. She''s not wrong about that.


  The other wants to delete the number entirely and have us judge each case on its
  particulars. Her line is that the features we''d point to as reasons to list this
  woman — her kids, her sponsor, the bereavement that preceded her relapse — are reasons
  the other way in some other case (the kid who''s caregiving for a parent, the sponsor
  who''s the only thing holding a fragile routine together, the grief that hasn''t
  been worked through yet), so any waiver-factor list we write is a fiction about
  our own consistency, and it''ll get gamed within a year by anyone who''s read it.
  She''s read a lot of moral particularism and I think that''s where she''s coming
  from — the idea that there just aren''t any true general moral principles to apply,
  only the case. I don''t know if I buy it but I can''t refute it either, and I notice
  our current rule is exactly the kind of thing she''s attacking.


  Our social worker made a suggestion I want you to react to: keep the 90 days as
  the default, but require that every departure be written up as a short anonymized
  case note, circulated to the committee, with no departure binding the next panel
  (so no precedent, each decision stands alone), and once a year we read all the notes
