  Key content: Aumann agreement theorem: if two agents have common prior and their
  posterior probabilities of an event are common knowledge, they''re equal. Requires
  common prior assumption ("Harsanyi doctrine"). Caveats: different priors, bounded
  rationality, non-partitional information (Geanakoplos), the "agreeing to disagree"
  with common knowledge of posteriors vs. common knowledge of the disagreement.


  Milgrom-Stokey: no trade with common knowledge of the fact that the trade is...
  Actually the theorem: if it''s common knowledge that the trade is... no, the condition
  is that there''s no trade if the allocation is ex ante Pareto efficient and the
  information is... The Milgrom-Stokey result: if traders have common priors and the
  initial allocation is ex-ante Pareto efficient, then any trade that is common knowledge
  (i.e., it''s common knowledge that both are willing to trade) is zero. More precisely:
  "if it is common knowledge that all traders'' expected utilities from the trade
  are non-negative, and the initial endowment is ex ante efficient, then there is
  no trade."


  Also relevant: the "no-trade" results break down with: heterogeneous priors, non-common
  knowledge of rationality, asymmetric information with adverse selection (but adverse
  selection creates trade, e.g., lemons), noise traders, liquidity needs, hedging
  motives (trade for risk-sharing is not "speculative" trade).


  Also: rational expectations equilibrium, Grossman-Stiglitz paradox: if prices perfectly
  reveal information, no one has incentive to gather it; so markets cannot be perfectly
  informationally efficient — equilibrium requires noise. Also: the "Hirshleifer effect"
  — more public information can destroy risk-sharing opportunities and reduce welfare
  (Hirshleifer 1971). That''s a nice niche idea. Also "Black''s (1986) noise trader"
  and De Long, Shleifer, Summers, Waldmann (1990) "Noise Trader Risk in Financial
  Markets."


  Also "the epistemology of markets": Hayek''s "The Use of Knowledge in Society" (1945)
  — prices as a summary of dispersed information; but also the critique that prices
  aggregate information only under conditions. Also "prediction markets" and the "efficient
  market hypothesis" (Fama 1970; "efficient markets hypothesis" and "no free lunch").


