  Also "the no-trade theorem''s dependence on the common prior": if traders have different
  priors, disagreement is "agreeing to disagree" impossible with common prior — so
  disagreement implies either different priors or non-common knowledge of posteriors.
  This is a classic: "Agreeing to disagree" implies that persistent disagreement about
  asset values must reflect different priors or different information (private info
