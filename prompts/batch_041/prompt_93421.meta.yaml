  Draft:


  "I''m a third-year undergraduate taking a seminar on consciousness and the philosophy
  of perception, and I''d like your help with an argument a classmate presented last
  week. I''ll set it out as carefully as I can, then ask you to diagnose it.


  First, some background, so the argument''s target is clear. In the color phi phenomenon,
  two spots are flashed in succession at different locations on a screen, in different
  colors. At the right spacing and timing, viewers do not see two separate spots;
  they see a single spot that appears to travel from the first location to the second
  and to change color partway along the path. The philosophically interesting feature
  is this: viewers report that the color change happens *during* the illusory journey
  — before the second spot has been presented — even though nothing about the second
  spot''s color is available to them until the second flash occurs. So the report
  of a color change at an early moment depends on information that only arrives later.


  My classmate, who is fond of provocative conclusions, used this to argue as follows.
  (I''ve numbered his steps; he numbered them too, and he defends each one separately.)


  (1) In the color phi display, viewers genuinely experience a spot that moves and
  changes color between the two flash locations.

  (2) The experience of the color change is located, in the viewer''s own experience,
  at a time before the second spot is presented.

  (3) The information needed to specify the color change — namely, the second spot''s
  color — is not available in the visual system until the second spot is presented.

  (4) An experience cannot have a content that is specified by information that did
  not yet exist at the time the experience occurs.

  (5) Therefore the experience of the color change cannot have occurred when the viewer
  experiences it as occurring; it must have been assembled at some later time.

  (6) If an experience''s apparent time of occurrence can be later than its actual
  time of occurrence, then the felt order of experiences is not a reliable guide to
  the order in which they occur.

  (7) If the felt order of experiences is not a reliable guide to their actual order,
  then there is no experiential fact of the matter about the order of mental events
  — and, in particular, the dispute over whether the mind ''revises'' experience itself
  or only the memory of it is not merely experimentally undecidable but empty.

  (8) So the apparent ''stream of consciousness'' is a construction that can be written
  and rewritten, and nothing in experience tells us what is happening in the mind
  at the moment we are having it.


  He calls (4) the ''no-antecedent-information'' principle and (8) the ''rewritable
  stream'' conclusion. Most of the seminar objected to (8) but could only say it sounded
  too strong; nobody could say where the argument breaks. I suspect the damage is
  somewhere around (4) to (7), but I can''t articulate it, and I''d rather not abandon
  (1)–(3), which I think are just the experimental facts.


  What I''d like from you: please act as an expert in the philosophy of mind and the
  neuroscience of temporal consciousness — someone who knows both the empirical literature
  on apparent motion and the conceptual debates it has generated. Before answering,
  spend some time brainstorming the possible places the argument could go wrong, and
