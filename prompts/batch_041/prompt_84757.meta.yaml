  over worlds to have a maximum (no infinite ascending chain, otherwise ''the best''
  is undefined), and the anthropic side needs a measure over the ensemble so that
  ''typical'' means anything -- which is the whole measure problem. Are these the
  same problem in different clothes, or genuinely different? Which is more tractable?

