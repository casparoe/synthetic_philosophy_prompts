  hospitable to life / to observers like us. Leibniz: God compares all the possible
  worlds, ranks them by perfection, and actualizes the top one; as I remember it the
  ranking is roughly "maximum variety together with maximum order" -- basically an
  MDL/compression kind of criterion, richest structure for the least arbitrary stipulation.
