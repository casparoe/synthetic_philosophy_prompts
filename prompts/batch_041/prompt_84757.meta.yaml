  So: compare them. I want the comparison to actually bite, so don''t just say ''one
  invokes a designer and the other doesn''t.'' Things I''d like you to work out:

  - What does each predict / forbid about how good the world is? Leibniz seems committed
  to the actual world being a *maximum* -- not just good enough to have observers,
  but the single best point in the ordering. Selection commits you to nothing like
  that; we''d expect a world that''s merely typical of observer-containing worlds,
  warts and all. Does the Leibnizian version have more explanatory power here, or
  just more exposure to the problem of evil?

