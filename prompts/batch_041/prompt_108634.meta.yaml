  I am a philosopher of science who has spent the last two years working on the epistemic
  limits of adversarial verification, and next month I am presenting a paper at an
  interdisciplinary workshop on scalable oversight. The thesis I will defend is that
  the debate protocol — the proposal that we can keep a superhuman AI honest by pitting
  two instances against each other before a weaker human or model judge — is not merely
  hard to implement but is unsound in principle for a broad class of questions, and
  that the obstacle is the phenomenon usually called obfuscated argument. My argument
  has three steps. First, I claim that soundness for debate requires something like
  the following: for any false proposition P, no dishonest debater can produce a line
  of argument that a bounded judge will accept as settling P. Second, I argue that
  there exist propositions that are true but whose truth cannot be certified to any
  judge of bounded computational power by an argument the judge can check within its
  budget, even when the honest debater has unbounded access to the facts; the honest
