  Draft summary:


  "I''m reading a cognitive science textbook, and its chapter on the mind-body problem
  summarizes functionalism roughly as follows:


  Functionalism grew out of the failure of the identity theory. Pain cannot be the
  firing of C-fibers, because an octopus and a human being both feel pain but do not
  share a brain chemistry; so a mental state cannot be identified with any physical
  state. Instead, a mental state is defined by its function — what it is for, the
  job it does in the organism. This makes functionalism a sophisticated version of
  behaviorism: it agrees with behaviorism that what makes something a pain is its
  relation to behavior, but it permits inner states so long as they are characterized
  by their typical causes and effects. Because the function is what matters, and functions
  can be carried out by anything, functionalism entails that a silicon chip, or even
  a whole nation of people organized in the right way, could have real pains and beliefs.
  This is the thesis of multiple realizability. Kim later showed that the thesis destroys
  the position that rests on it: if the same mental state can be realized by indefinitely
  many different physical states, then the mental state can only be the disjunction
  of all its realizers, and disjunctions are not natural kinds but mere lists. Since
  multiple realizability is the argument functionalists themselves made, functionalism
  refutes itself, and this is why most philosophers of mind have moved on from it."


  Good. Errors:

  1. "Pain cannot be the firing of C-fibers... so a mental state cannot be identified
  with any physical state" — the argument refutes *type* identity (a general psychophysical
  identity of kinds), not the token identity of each mental event with some physical
  event; and it''s compatible with species-specific identities or with a restricted
  identity theory. Also the octopus example is an empirical premise: the argument
  needs the possibility of different realizers, and if it''s a claim about what actually
  occurs, it needs evidence; if it''s about conceivability, conceivability ≠ possibility
  (that''s a gap). Also "an octopus feels pain" is itself contested (whether octopuses
  feel pain is an empirical question — actually there''s decent evidence, but the
  point is the argument shouldn''t rest on a contested empirical premise; also the
  identity theorist could deny octopus pain or say octopus pain is a different state).

  2. "a mental state is defined by its function — what it is for, the job it does"
  — everyday sense of "function" (purpose/teleology) vs. the technical sense: a role
  in a causal organization specified by inputs, outputs, and relations to other states.
  This matters because "what it''s for" invites teleological/design talk (and would
  make functionalism depend on there being a designer or a proper function in the
  biological sense), whereas the functionalist''s notion is causal-role, not purpose.
  A subtle misrepresentation.

  3. "This makes functionalism a sophisticated version of behaviorism" — conflation.
  Behaviorism (logical/analytical) analyzes mental terms as dispositions to behave,
  denying/reducing inner causes; functionalism posits internal states as the causes
  of behavior and is compatible with the existence of inner states that no behavior
  reveals; also functionalism is typically a form of physicalism (or at least neutral)
  while behaviorism was often anti-mentalist. Related but crucially different: the
  functionalist''s "behavior" is only one of the two ends of the role, and the internal
  causal relations among states are essential. Also the functionalist does not deny
  that there are inner states — it''s the opposite of the behaviorist''s denial. And
  functionalism is not a thesis about meaning (behaviorism was often also a semantic
  thesis about mental terms).

  4. "functions can be carried out by anything, so functionalism entails that a silicon
  chip or a nation could have real pains" — the modal overstatement: (a) multiple
  realizability as functionalists deploy it is typically a claim about actual or nomologically
  possible systems, and functionalism as a metaphysical thesis about what mental states
  are doesn''t by itself entail that any substrate whatsoever realizes them; (b) the
  China-brain case is Block''s *objection* (a homunculi-headed system), where the
  intuition is that it does *not* have real pains; the summary presents an intuition
  pump aimed at showing functionalism is too liberal as if it were a consequence the
  functionalist proudly accepts. Functionalists may accept the consequence, but many
  hold that such a system either does have some mental states or that the case is
  under-described (the "nation" lacks the right kind of causal integration). Also
  "real" pains — functionalists generally deny there''s a further fact about "realness"
  beyond the role; so the framing begs the question.

  5. "This is the thesis of multiple realizability" — order confusion: multiple realizability
  is a thesis about mental (or other special-science) properties, and functionalism
  is a thesis about what those properties are; functionalism is one way to accommodate
  it, not identical with it. Non-functionalists can accept multiple realizability
  (e.g., a disjunctive identity theory, or non-reductive physicalism with a different
  account of the mental).

  6. Kim''s argument: presented as a refutation, when it''s a contested objection;
  the disjunction objection and the replies (the role property vs. the realizer property
  distinction; the disjunctive property is not the mental property on the functionalist''s
  own account; "second-order" property views; also Kim''s own later "functional reduction"
  which is not an abandonment of the mental but a model of reduction); also the claim
  "most philosophers of mind have moved on" is false-ish — functionalism in some form
  (or the "mechanistic" / causal-role idea) remains the default, and the mainstream
  debate is about qualia/consciousness, not about abandoning functionalism for the
  mind in general. Also the summary''s "self-refutation" claim is a non sequitur:
  even if the disjunction objection succeeded, it would show the *argument* doesn''t
  establish functionalism (or that functionalism is false), not that it refutes itself
  — the "self-refutation" framing misdescribes a reductio as a contradiction. Actually
  it''s a reductio of sorts, but calling it "refutes itself" muddles premise-conclusion.

  7. Also "functionalism grew out of the failure of the identity theory" — historically
  a simplification; also the summary''s inference "identity theory fails, therefore
  mental states are defined by their role" is an overstatement: the failure of type-identity
  leaves open eliminativism, dualism, token identity, anomalous monism, etc.

  8. Also the C-fiber point: identity theorists typically held that pain = C-fiber
  firing *in humans*, and allowed that in other species pain might be a different
  state — so the multiple-realizability argument, to work, must reject "species-specific"
  identity or the restriction; the summary doesn''t acknowledge that the identity
  theorist''s thesis was usually species- or theory-relative.


