  experts do the obvious thing: they tighten the definition, add items, add exclusions,
  make it more specific. Which just gives everyone a new, more precise target to aim
  at. And in the meantime, the only thing keeping the numbers honest is the clinician''s
  gut — which is exactly what the checklist was introduced to get away from. So the
  category gets more and more carefully defined, and means less and less.


