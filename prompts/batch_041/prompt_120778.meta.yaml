  Let me consider the counterpart theory one in detail:


  Plausible summary (from a competent popularizer, e.g., a philosophy-of-science magazine
  piece on possible worlds):

  "Lewis''s counterpart theory tells us that no one exists in more than one possible
  world: the ''Nixon'' who lost the 1960 election in some other world is not Nixon
  but a different individual who resembles him as closely as possible. So when we
  say Nixon could have lost, we''re not really talking about Nixon at all, but about
  a stand-in; this is why Kripke objected that the view can''t account for de re modality,
  and why most philosophers have concluded that identity across worlds — transworld
  identity — is the correct picture. On that alternative, individuals are simply the
  same across worlds, and necessity is just truth in all worlds in which the individual
  exists."


  Subtle errors:

  1. "resembles him as closely as possible" — the counterpart relation is not simply
  overall similarity; it''s a matter of context-dependent, interest-relative similarity,
  and it needn''t be maximal (Lewis explicitly says the counterpart relation is not
  identity and is not fixed once and for all; there can be multiple counterpart relations).
  Also, similarity is not "as closely as possible" but a contextual selection.

  2. "we''re not really talking about Nixon at all" — this is the Humphrey objection''s
  rhetorical framing; Lewis''s reply: "Nixon could have lost" is true, and its truth-maker
  involves a counterpart; the objection that we''re "not talking about Nixon" is answered
  by distinguishing what the sentence is about from the truth-conditions. Also Lewis
  says counterpart theory doesn''t deny that "Nixon could have lost" is about Nixon
  in the ordinary sense. So the summary overstates.

  3. Conflating counterpart theory with modal realism: counterpart theory is separable
  from modal realism. The summary implies that rejecting counterpart theory is rejecting
  Lewis''s whole picture; also "the ''Nixon'' who lost is a different individual"
  is a claim of counterpart theory specifically.

  4. "necessity is just truth in all worlds in which the individual exists" — this
  is a garbled version of the transworld-identity picture; actually for transworld
  identity, necessity de re = truth in all worlds where the individual exists (that''s
  roughly the standard reading of Kripke — but Kripke himself might not endorse "individuals
  exist in multiple worlds" talk). Also, "most philosophers have concluded that transworld
  identity is correct" — contested and probably false as a consensus claim; also transworld
  identity vs counterpart theory is not a straightforward dichotomy (there are ersatzist
  options, and haecceitism, and the "no transworld identity without a counterpart
  relation" positions).

  5. Also the conflation: transworld identity is about whether the same individual
  is literally in multiple worlds; counterpart theory says no. But the summary says
  "this is why Kripke objected that the view can''t account for de re modality" —
  Kripke''s Humphrey objection was about "how could we know which counterpart?" Actually
  Kripke''s objection (Naming and Necessity, footnote) is that counterpart theory
  makes de re modal claims not about the individual, e.g., "if Nixon''s counterpart
  had lost..." Lewis''s reply in "Counterfactuals" postscript / "Individuation by
  acquaintance and by stipulation". Good.


