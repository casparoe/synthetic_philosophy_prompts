  Student''s answer (draft):


  "Chalmers introduced the meta-problem to break the stalemate over the hard problem.
  The hard problem is: why does information processing give rise to subjective experience?
  The meta-problem is the question of why we think there is a hard problem at all
  — why creatures like us form the intuition that experience is something over and
  above the physical facts. The point of calling it a *meta*-problem is that it is
  a problem about a problem: it takes our own intuitions as its explanandum.


  The key virtue is that the meta-problem is empirically tractable in a way the hard
  problem isn''t. We can study the mechanisms that produce the intuition the same
  way we study any other judgment: introspective access, metacognitive monitoring,
  the way the brain''s self-model represents its own states as ''given'' rather than
  constructed. Work on confabulation and on the limits of introspection suggests these
  mechanisms are fallible, and a good explanation will probably be some combination
  of (i) our introspective access being thin, so we represent the having of experience
  without representing its physical basis, and (ii) the fact that the content of the
  intuition is itself a representation, so it can be explained without explaining
  experience.


  Now the genealogy/vindication distinction. The genealogy question is: why do we
  have these intuitions? The vindication question is: do they track anything? These
  are different questions, and answering the first doesn''t answer the second... [Here''s
  where the student slips:] But in this case I think it does. Once we have a full
  causal story about why the intuition arises — that it''s produced by a self-model
  that can''t represent its own physical implementation — the intuition is explained
  away. It''s like the intuition that the sun goes around the earth: once you know
  why it seems that way, you know it doesn''t. So a completed genealogy just is the
  vindication answer, and the meta-problem collapses into the hard problem''s dissolution.
  This is why Chalmers is best read as an illusionist: he thinks the meta-problem
  will show that phenomenal consciousness, as opposed to access consciousness, is
  a fiction. Frankish just says it out loud.


  The strongest objection is that this proves too much. The same style of explanation
  is available for the intuition that other people have minds, or that there''s a
  table in front of me, and we don''t conclude those are fictions. So the argument
  needs something more than ''we can explain the intuition'' — it needs a reason to
  think this particular intuition is systematically misleading. Chalmers''s own view,
  I take it, is that the meta-problem is neutral: it could be solved by an illusionist,
  a panpsychist, or a dualist, because it''s a question about the mechanisms behind
  our judgments, not about what the judgments are about.


  [conclusion:] In short, the meta-problem is a real research program and much more
  tractable than the hard problem, but it can''t do the work of settling whether experience
  is real. What it can do is remove one kind of argument for dualism — the ''you can''t
  explain this'' argument — by showing where the intuition of inexplicability comes
  from."


