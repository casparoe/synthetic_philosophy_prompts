  argument is what I call the token-fixing argument. If the zygote is identical to
  the later organism (as I assume), and if the identity of the zygote across worlds
  is fixed by the identity of the two particular gametes whose fusion produced it,
  then the transworld identity of me requires the transworld identity of those two
  tokens; genetic type is irrelevant to the identity of the token. To dramatize the
  conclusion I use a case I have not seen discussed: a technician in an IVF clinic,
  reaching into a cold rack, by accident picks up a numerically distinct vial whose
  contents happen to be genetically indistinguishable from the intended gamete, and
  the resulting child is, by every biological measure, the same child who would have
  been born otherwise. I claim that child is not me — and I want to know how much
  trouble I am in.


  The audience is small but adversarial in a very specific way, and I would like to
  walk in knowing what is coming. Two of the regulars are philosophers of biology
  who work on reproduction and development; they will insist that "the sperm and the
