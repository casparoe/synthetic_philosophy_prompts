  "I am a secondary school student working on an independent project in philosophy
  of religion, and I have reached a point where the material I have read has run out.
  I have been studying the sixteenth-century Jesuit theologian Luis de Molina''s account
  of how God knows what a free creature would do in circumstances that never actually
  arise — the doctrine usually called middle knowledge. As I understand it, Molina
  distinguishes God''s knowledge of what is merely possible, God''s knowledge of what
  he has freely decided to create, and an intermediate knowledge of conditional truths
  about what any possible creature would freely choose in any possible situation,
  where those truths are supposed to be true independently of God''s will and yet
  not determined by the creature''s nature or circumstances. I also understand that
  a standard modern objection is that such conditional truths seem to need something
  in reality to make them true — a truthmaker — and that if they are not grounded
  in God''s decree, or in the creature''s essence, or in causal facts about the actual
  world, it is unclear what grounds them.


  Here is the issue that has arisen only in our own time, and which I would like you
  to address from Molina''s point of view. Suppose that a machine-learning system,
  trained on enormous quantities of data about human behaviour, can predict with high
  reliability what a particular person would choose in a situation that has never
  occurred and will never occur — including choices that everyone would describe as
  free and uncoerced. ... Would Molina have regarded this as a case of middle knowledge,
  or as something else? ..."


