  texts whose genre and transmission we can''t control, and they yield at best isolated
  sayings stripped of context; what we need instead is a "memory" approach and/or
  a holistic reconstruction that treats the whole tradition as a plausible memory
  (Dale Allison, Chris Keith, Anthony Le Donne, Rafael Rodríguez, "Jesus Criteria
  and the Demise of Authenticity" 2012 volume).


