  Potential prompt:


  I teach a 90-minute upper-level undergraduate seminar in metaphysics and ethics,
  with 16 students. I want to run a structured deliberation that makes them feel the
  force of the Scheffler-style afterlife conjecture: the thought that human extinction
  would be bad not only because of the deaths it involves, but because it would deprive
  us of the continued existence of future generations whose lives give point to our
  projects, commitments, and values. They should encounter the problem through what
  they do, not through anything I announce at the start.


  Design a runnable activity around a fictional institution, the Long Now Trust, and
  a sealed prognosis. The setting: the Trust is a small foundation that funds projects
  whose benefits are deliberately deferred by at least a century. Students are trustees
  in four or five small groups, each with a portfolio of future-directed projects
  (for example, a language revival, a seed vault, a slow astronomical survey, a manuscript
  conservation programme, a civic archive). Each project has a schedule of project-value
  points that only accrue after the original trustees are dead. Groups must allocate
  a fixed budget, write a short charter, and compose a letter to their successors.
  Halfway through, I will distribute a sealed prognosis: a credible report that human
  civilisation will end within forty years, after the natural deaths of everyone in
  the room. The groups must then decide whether to continue, revise, or abandon their
  projects, and explain their reasoning to the others.


  I need the full design: roles or group structure; materials; the project-value and
  budget scheme; the timing of the reveal; rules for the final deliberation; and a
  debrief. The debrief should map specific moments in the activity onto the afterlife
  conjecture, distinguishing the badness of the deaths from the badness of the loss
  of a future in which our values are still alive. It should also say what will predictably
  go wrong the first time I run it and how to handle that, and it should be frank
  about which feature of the conjecture the activity cannot reproduce and that I will
