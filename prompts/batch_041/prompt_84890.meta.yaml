  \ Descartes denied animal *sensation* or only thought. Descartes says animals lack\
  \ thought; but does he deny sensation? In the Discourse and the Letter to More,\
  \ he says animals have no thought; he speaks of them as machines; but he also says\
  \ they lack \"consciousness\" — Descartes' argument in the letter to the Marquess\
  \ of Newcastle (1646) and to More (1649). A subtle false presupposition: \"Since\
  \ Descartes held that animals are machines, he must have thought vivisection is\
  \ morally unproblematic — so why did he... \" Hmm, need something concrete.\n\n\
  A better false presupposition: the common claim \"Descartes denied that animals\
  \ feel pain\" — a subtle confusion is that Descartes' argument against animal minds\
  \ was about *thought* and *language*, not about sensation per se; also the beast-machine\
