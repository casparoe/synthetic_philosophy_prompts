  \ to animals\" attitude, when actually the moral conclusion doesn't follow from\
  \ the metaphysics — indeed Descartes held that animals are machines, but he also\
  \ held that the fact we can't prove they don't feel... hmm. Actually a well-known\
  \ point: Descartes in the letter to Henry More (Feb 5, 1649) says that although\
  \ he denies thought to animals, he does not deny them life or sensation in the sense\
  \ of... Actually he says: \"I do not deny life to animals... nor even sensation,\
  \ insofar as it depends on the bodily organs.\" That's a real quote — but I must\
  \ not quote from memory. I'd need to fetch. There's the famous passage in the Letter\
  \ to More: \"I do not deny sensation in animals, insofar as it depends on the bodily\
  \ organs\" — I'd need to verify.\n\nAlternatively, false presupposition could be:\
  \ \"Descartes thought animals are just complex machines, so he would say a dog yelping\
  \ is like a clock striking — but then how did he explain that animals can be trained,\
  \ learn tricks, and seem to remember?\" The subtle confusion: the beast-machine\
  \ doctrine is about *thought*, not about learning/conditioning — Descartes explicitly\
