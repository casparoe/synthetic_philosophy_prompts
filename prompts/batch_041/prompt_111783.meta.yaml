  Draft:


  "I''m a journalist who writes about archaeology, ancient texts, and the public uses
  of the past, and I sit on the advisory board of a national museum that is building
  a permanent gallery provisionally called ''History or Legend?'' The gallery devotes
  a room each to Troy and the Trojan War, to King Arthur, and to the Exodus and the
  settlement of the Israelites in Canaan. The board meets Thursday to approve the
  interpretive framework, and the design firm needs the labels the following week,
  so the chair has asked me to circulate a decision memo beforehand.


  The fight is not about the facts so much as about what the museum is entitled to
  say. One faction wants the gallery to state plainly that there is no evidence for
  the Exodus as narrated, that Arthur is a literary invention, and that the Homeric
  war is a poem, not an event; they argue that any hedging is a failure of nerve that
  lets faith masquerade as history. Another faction, which includes our education
  staff and the two members from local religious communities, says that labelling
  these traditions as legend is not a neutral act: the gallery''s own framing will
  be read as a verdict on living communities, and the museum will be handing schoolchildren
  a lesson in contempt. A third group wants to abandon the binary altogether and present
  each room as a case study in how traditions form, on the grounds that the question
  of what happened is often unanswerable and not the most interesting one.


  I''ve circulated a working paper proposing that the gallery attach to every contested
  claim a tag naming (a) the kind of claim it is — that a person existed, that an
  event occurred, that a sequence occurred as narrated, that a text is a reliable
  record — since these come apart and are usually run together; (b) whether the tradition
  itself is the only evidence; and (c) what evidence would count against the claim,
  and whether any of it exists. I also want the board to face two distinctions I keep
  running into in my reporting: between absence of evidence and evidence of absence
  — silence from a literate, record-keeping bureaucracy weighs differently from silence
  in a society that left no archives — and between the past as historians reconstruct
  it and the past as it functions in the present life of a community, which is not
  the same object and should not be judged by the same standard. My own view is that
  we should keep the rooms, adopt the tagging scheme with amendments, and drop the
  word ''legend'' from the gallery''s title.


  Please draft the memo I''ll circulate: a recommendation the board can vote on, with
  the specific wording rules the design firm should follow, an honest statement of
  the strongest case for the faction I''m against, and a note on what the board should
  do about the room that will be hardest to write — I think it''s the Exodus, but
  tell me if I''m wrong."


