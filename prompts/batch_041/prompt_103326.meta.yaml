  "Ok so I want an essay on the Corsair affair and Kierkegaard''s theory of the press
  and the public. Quick refresher on the facts, since I don''t want you to guess:
  Copenhagen, 1845-46. There''s a satirical weekly called Corsaren (The Corsair),
  run by Meïr Goldschmidt, which skewers basically everyone in the Danish literary
  scene. Kierkegaard — writing under one of his pseudonyms, Frater Taciturnus — publishes
  a piece in a rival paper, Fædrelandet, in late December 1845 called ''The Work of
  a Traveling Aesthete'', in which he more or less complains that everyone gets abused
  by the Corsair except him and asks, pretty transparently, to be mocked too; he repeats
  the request a couple of weeks later. Goldschmidt obliges, and for months the Corsair
  runs caricatures of him — his body, his clothes, his whole physical person — turning
  him into a running joke in the city, and he becomes, of all things, famous and recognisable
  to people who''ve never read a word he wrote. Meanwhile, in the same year, he publishes
  his review of a novel by Gyllembourg, the one everyone now calls The Present Age,
  where he lays out his whole account of the present age: leveling, chatter, and the
  public — the claim being roughly that the public isn''t a group of people at all
  but an abstraction, a nobody that somehow everyone belongs to, with no members and
  no shared moment, which is exactly why it can''t be argued with, apologised to,
  or held responsible for anything, and why the age can only produce reflection and
  envy rather than action.


  What I want is an essay that reads the affair through that theory and the theory
  through the affair. Some things I''d like you to actually grapple with, rather than
  just gesturing at: (1) Kierkegaard keeps the press and the public apart — the press
  is a machine with real people at it, the public is the phantom the machine produces.
  So which one was the Corsair? Goldschmidt was a man with a name and a business;
  the thing that did the damage seems to have been neither just him nor just ''the
  public''. Does the theory have room for the middle object here? (2) He asked for
  it. Why would someone with a theory of leveling deliberately hand himself over to
  the leveling process — is that a way of forcing an abstraction to become a real
  interlocutor, or the opposite, a kind of voluntary sacrifice that only makes sense
  if the public really is nobody? (3) Note he did it under a pseudonym, while the
  paper attacked him as a body. Say something about what that asymmetry does to the
