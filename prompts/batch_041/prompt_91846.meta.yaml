  was startled because I had an appointment with him in Samarra tonight." In Death
  in Damascus, the oracle tells you that you will die in Damascus today, so fleeing
  seems fatal; but if you flee, then the oracle was wrong, so it''s not reliable...
  hence the tension: with a perfect predictor, evidential decision theory says you''re
  doomed either way (the prediction is stable), causal decision theory says flee.
  And there''s the "Death in Damascus" argument that EDT gives the wrong answer because
  it treats the prediction as a sign.


