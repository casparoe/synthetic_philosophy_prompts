  Student answer draft:


  "The three claims come apart, and the genetic system does not satisfy all of them.


  Take the cipher claim first. The mapping from codons to amino acids is not forced
  by chemistry: nothing about the physical structure of the codon UUU makes it necessary
  that it specify phenylalanine, and the same amino acid can be specified by several
  different codons. So the mapping is arbitrary in the sense the lecture requires,
  and the codon is a symbol rather than a physical cause of the amino acid it stands
  for. One might object that the code is nearly universal across life, and so cannot
  be arbitrary; but universality is a fact about history and shared descent, not about
  necessity, so the objection fails. It is also worth noting that the code is degenerate:
  several codons map to the same amino acid. Since the mapping therefore cannot be
  run backwards — you cannot recover the sequence from the protein — the codon does
  not stand for the amino acid in the way a word stands for its referent, and the
  cipher claim, strictly speaking, fails. [This is the subtle error: non-invertibility
  → no representation. Also it contradicts the earlier concession.]


  The instruction claim is where the slogan does its real work, and it also fails,
  though for a different reason. A recipe specifies an ordered procedure; the sequence
  specifies only a product. Nothing in the DNA specifies that the protein should fold
  this way rather than that, or that the steps of synthesis should occur in one order
  rather than another; the ordering is supplied by the ribosome and by chaperones
  and by the cellular environment. So the sequence is better described as a template
  than as a set of instructions, and the instruction claim fails.


  The blueprint claim fails for the reasons usually given: proteins are not assembled
  from a map, there is no part-for-part correspondence between stretches of DNA and
  parts of the folded protein, and the same sequence can yield different structures
  in different cellular contexts.


  What follows for (i)? Not much, on this showing. If the sequence is only a template
  whose causal contribution is one among many, then ''gene for X'' is at best shorthand
  for a causal contribution and carries no representational content of its own. And
  the same reasoning disposes of (ii): if the sequence carries no information, then
  no factor is the locus of developmental information, and the question of whether
  genes are that locus simply lapses. The central dogma, on which genes are supposed
  to be the sole source of sequence information, is a claim about the direction in
  which sequence information flows between nucleic acid and protein, not a claim about
  where developmental information resides; using it to support (ii) would be a mistake.


  So the answer to the question is that DNA is a code only in the thinnest sense —
  a mapping that happens to be arbitrary but that cannot be read in reverse — and
  neither (i) nor (ii) follows."


