  the comments that justify the grade.


  **The lecture framework.** In the unit on information in biology, the course distinguished
  three claims that the slogan about DNA being a code can be used to make, each with
  its own success conditions:


  (C) *Cipher claim*: there is an arbitrary mapping between a set of symbols (codons)
  and what they stand for (amino acids), such that a sequence can be said to stand
  for a product the way a coded message stands for its decoded content. Success condition:
  the mapping is not fixed by physical necessity, and the symbol does not resemble
  or physically necessitate what it stands for.

  (I) *Instruction claim*: a sequence specifies a procedure — it tells the cell what
  to do, the way a recipe tells a cook what to do. Success condition: the sequence
  plus the reading machinery determine an ordered process, and the order of steps,
  not just the final product, is carried by the representation.

  (B) *Blueprint claim*: the representation stands in a structural correspondence
  to the thing represented — parts of the representation correspond to parts of the
  product and preserve their relative arrangement, so that the product can be read
  off the representation.

  Two further distinctions from lecture: (1) *causal specificity* — the degree to
  which a factor makes a difference to an outcome — is not by itself representation
  or information in any semantic sense; (2) an *arbitrary* mapping need not be a *conventional*
  one, and neither arbitrariness nor its absence is settled by how widely the mapping
  is shared.


  **Question.** Assess the claim that DNA is a code. Say which of (C), (I), and (B)
  the genetic system satisfies and on what grounds, then say whether either of the
  following follows from your answer: (i) genes carry information about the proteins
  and traits they produce, in a sense strong enough to make ''gene for X'' more than
  a shorthand for a causal contribution; (ii) genes are the locus of developmental
  information, so that other causal factors supply materials and triggers but not
  information. [12 points]


