  Paragraph 1: Casual setup. "I''m in a seminar on American pragmatism and we''ve
  been reading Dewey on democracy and inquiry—the whole thing about democracy as a
  mode of associated living, inquiry as the transformation of a problematic situation,
  hypotheses tested in practice, fallibilism, the public as a body of people affected
  by consequences. I keep thinking about the fact that Dewey himself, late in life,
  chaired a commission in 1937 to investigate the charges against Trotsky from the
  Moscow trials. The commission went to Mexico, heard Trotsky at his home in Coyoacán,
  and published a report called Not Guilty that said the trials were frame-ups. I
  know the basic story, but I want to use it as a case study for Dewey''s own theory."


  Paragraph 2: The ask. "Analyze the Dewey Commission through Dewey''s experimentalism
  about democracy and inquiry, and then run it back the other way. Map it carefully:
  who were the players, what was the problem situation, what was the hypothesis being
  tested, what counted as evidence, what was the experimental test, what role did
  the public play, and what did the commission actually do to the situation? A friend
  and I came up with a distinction I want you to use: inquiry-as-experiment versus
  inquiry-as-tribunal. Inquiry-as-experiment treats inquiry as a communal, fallible
  process of transforming a problem situation, where the test is what happens when
  the hypothesis is acted on. Inquiry-as-tribunal treats inquiry as a body hearing
  evidence and delivering a verdict, where the test is the verdict''s correctness.
