  Let''s outline prompt:


  Paragraph 1: Context and goal. "I facilitate a 90-minute session for 16 graduate
  students in a philosophy of mind and applied ethics reading group. We keep circling
  the insect sentience question: some think the probability that insects are sentient
  is low enough that we can ignore their interests; others invoke the scale argument.
  I want an in-class activity that makes the group feel the force of the scale argument
  from the inside, before anyone names it. The activity should not be a debate about
  whether insects are sentient, and it should not depend on any particular empirical
  estimate. I want the rules, incentives, and roles to arrange a situation in which
  participants themselves commit to a low credence, allocate moral resources on that
  basis, and then discover that the arithmetic of a very large number of individuals
  changes what their own credence implies. The point they should come away seeing
  is the difference between a low probability and a low expected moral weight, and
  why the second does not follow from the first when the population is large enough."


  Paragraph 2: Specifics and constraints. "Set it in the seminar room, 16 participants,
  90 minutes, no real money, minimal materials (index cards, tokens, a whiteboard).
  You can use toy numbers: e.g., a policy affects one trillion insects, and the group''s
  initial credence that a single insect is sentient is one in ten thousand; if you
  need a comparison case, use a policy affecting one million chickens with a credence
  of one. Do not include a bibliography, reading list, or citations. Avoid referring
  to any named theory or author that a small model would not know; the activity should
  be intelligible to someone who has never read the literature. The activity should
  have rounds, roles, a payoff or scoring scheme, and a debrief that maps what happened
  onto the structure of the scale argument: the multiplication of credence by population
  size, the difference between per-individual and aggregate expected value, the opportunity
  cost to clear cases, and the possibility that a threshold view of sentience makes
  the arithmetic discontinuous. The debrief should also say what will predictably
  go wrong the first time and how to handle it, and be honest about which feature
  of the scale argument the activity cannot reproduce—e.g., it cannot settle whether
  insects are sentient, and it may make the arithmetic look more precise than the
  underlying credences warrant."


  Paragraph 3: Format. "Return a single valid JSON object, with no prose outside it,
  using these fields: activity_title (string); learning_objectives (array of strings);
  setting_and_participants (string); duration_minutes (number); materials (array of
