  Prompt content: I''m in a seminar / reading group on Kant''s Perpetual Peace. I
  want to extrapolate Kant''s verdicts on contemporary practices that map onto his
  framework. Give a verdict (approve/disapprove/how much) on a list, with reasoning
  tied to specific parts of the essay, and rank them by how confident the extrapolation
