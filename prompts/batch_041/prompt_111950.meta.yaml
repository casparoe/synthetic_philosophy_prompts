  ---

  A friend and I have a small reading group going through Kant''s essay on perpetual
  peace from 1795 — the one with the six preliminary articles, the three definitive
  articles, and the supplements — and we keep half-joking that he wrote a checklist
  for the twenty-first century without realizing it. I want to take that seriously
  for one session but in a disciplined way. The problem is obvious: he''s writing
  in a world of cabinet wars, dynastic marriages and hired troops, and basically nothing
  on the modern menu of things states do to each other existed in 1795. So this is
  a prediction job, not a history-of-philosophy job: I want your best guess at what
  Kant would have thought, and, separately, how much of that guess is really his text
  talking versus us.


  So: for each of the following, give me a verdict (approve / disapprove, plus a rough
  0–1 score if that helps you be precise) and then the part of the essay you''re leaning
  on — he has material on standing armies, on war debts and the credit system, on
  not interfering by force in another state''s constitution, on the difference between
  a federation of free states and one world state, on hospitality to strangers, and
  on what you''re not allowed to do to an enemy even while you''re fighting them,
  which I think is the most interesting one for the modern cases: (a) nuclear deterrence
  and mutually assured destruction; (b) targeted killing of individuals by drone,
  including a state''s own citizens abroad; (c) covert election interference and disinformation
  aimed at another country''s voters; (d) economic sanctions and asset freezes used
  as a substitute for shooting; (e) large long-term arms sales and military aid to
  a state that''s currently fighting a war; (f) the EU as a partial realization of
  his federation; (g) climate-driven migration, and what hospitality means when a
  whole island nation goes under. Then rank all seven from "he basically says this"
  down to "we''re making it up", i.e. by how much his actual text supports the verdict
  rather than our own intuitions.


  And if you have room, the thing that keeps derailing us: his peace depends on republics,
  commerce and a voluntary federation, and he explicitly thinks a single world state
  would be a despotism. Does that structure survive contact with nukes and cyber,
  or does it need rebuilding from the ground up? I dont need citations or page numbers,
  just don''t put words in his mouth that he wouldn''t recieve.

