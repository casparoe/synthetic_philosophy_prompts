  "So I''m in this little reading group that''s going through Kant''s essay on perpetual
  peace — the 1795 one, with the preliminary articles and the definitive ones — and
  we''ve got a running joke that Kant basically wrote a checklist for the 21st century
  without knowing it. I want to push that a bit further, but do it carefully, and
  I''d like you to help. The thing I keep bumping on is that he wrote in a world of
  cabinet wars and dynastic marriages; almost nothing on the list of things states
  actually do to each other now existed in his time. So what I''d like is for you
  to extrapolate.


  Concretely: take the following and tell me, for each, what Kant would most likely
  have thought, and how confident we can be that the extrapolation is his and not
  ours: (a) nuclear deterrence and the whole "mutually assured destruction" setup;
  (b) targeted killing of individuals by drone strike, incl. of a state''s own citizens
  abroad; (c) covert election interference and disinformation campaigns aimed at another
  country''s electorate; (d) economic sanctions and asset freezes as a substitute
  for war; (e) long-term arms sales and military aid to a state currently at war;
  (f) the EU as a partial realisation of his federation; (g) climate-driven migration
  and the "hospitality" question when whole islands go under; (h) a global carbon
  border tax as a kind of commercial peace instrument. For each one say whether he''d
  approve/disapprove/how much — a 0-1 score is fine — and, more importantly, which
  specific bits of the essay you''re leaning on (he''s got a thing about standing
  armies, about war debts, about not meddling in another state''s constitution, about
  the difference between a federation and a single world state, and a very striking
  bit about what you''re not allowed to do to an enemy even while fighting them).
  Then rank the eight by how well his actual text supports the verdict, from "he basically
  says this" down to "this is me making it up."


  Also, one meta-question that keeps derailing our sessions: Kant is pretty confident
  that the republican constitution + commerce + the federation gets you peace eventually,
  and he thinks a single world state would be a despotism. Do you think that structure
  survives contact with nuclear weapons and with, like, cyber — or does the whole
  edifice need rebuilding?"


