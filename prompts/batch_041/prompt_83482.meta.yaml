  I am a novelist applying for a one-year research fellowship at a small institute
  that supports cross-disciplinary work, and I need a two-page proposal on a question
  that has been nagging me. The question concerns Buridan''s ass and choice without
  preference. The standard treatments seem to assume that if two options are exactly
  equal, a choice must either express some pre-existing preference or be a blind,
  arbitrary tie-break; I suspect there is a third possibility worth taking seriously:
  that in some cases the act of choosing is itself what constitutes the preference,
  so that the agent does not choose because she prefers but comes to prefer in and
  through choosing. I want the proposal to state precisely what this third possibility
  amounts to and how it differs from both arbitrary fiat and self-deception; explain
