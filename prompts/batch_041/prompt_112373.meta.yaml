  Rousseau''s Letter to M. d''Alembert on the Theatre (1758), in response to d''Alembert''s
  article "Genève" in Volume 7 of the Encyclopédie (1757), in which d''Alembert, after
  praising Geneva, suggested that Geneva could benefit from having a theater (a comedy
  theater), as it lacked one.


  Rousseau''s response argues against the establishment of a theater in Geneva. Key
  arguments:

  1. The theater in general does not improve morals; it follows and flatters the prevailing
  taste and mores. It can''t change morals for the better but can make them worse.
  "The stage is a picture of the passions" — it excites rather than corrects.

  2. It''s a question of what suits a small republic like Geneva, not whether theater
  is bad everywhere. In a small, virtuous republic, luxury and idleness (which theater
  encourages) are corrupting.

  3. The actor''s profession: Rousseau criticizes it as a trade of "counterfeiting
  himself," dissimulation, and even calls it a kind of "self-prostitution" — the actor
  sells his person to the public, exhibits himself for money, which is degrading.
  He contrasts this with the orator who appears as himself. This is a critique of
  the actor''s status/profession.

  4. He discusses specific plays: he criticizes Molière''s Le Misanthrope for making
  the honest man (Alceste) ridiculous and the cynical Philinte the wise one — the
  theater thus mocks virtue. He discusses Racine, Corneille, tragedy vs comedy.

  5. Tragedy and pity: he argues that theatrical compassion is fleeting, sterile,
  and self-congratulatory — we weep for imaginary heroes and feel good about ourselves,
  but it doesn''t translate into action. This anticipates the critique of "aesthetic
  pity."

  6. He proposes alternatives: public festivals, balls, the "cercle" (circle) where
  citizens gather; he praises the Spartan/Genevan public festivity, and the simple
  outdoor festivals where people are spectators of each other.

  7. He distinguishes the theater from the "fête."


  His relationship to theater: Rousseau himself wrote an opera, Le Devin du village
  (1752), which was a great success; he was a composer and music theorist. So he was
  not a simple anti-art philistine. His objection is specifically about a theater
  in Geneva (a small republic) and about the moral effects, not that theater is intrinsically
  evil in all times and places. Actually, he does think theater is bad for republics
  generally, but he allows that in a large city/monarchy the theater might be less
  harmful or even a diversion.


