  Idea for Avicenna: The flying man argument. The in-the-weeds issue: The argument
  is usually presented as a thought experiment about a man created "floating in the
  air" with senses blocked, who would still affirm his own existence. Contemporary
  readers treat it as an argument for the immateriality/independence of the soul.
  But there''s a subtle issue: what exactly does the flying man''s affirmation establish?
  Avicenna himself distinguishes "affirming that he exists" from "affirming his essence
  as something" — the flying man knows that he is, not what he is. So the argument
  delivers existence of a self, not the immateriality of that self; the further step
  requires premises. Also, the argument seems to beg the question: the scenario is
  set up so that the subject has no bodily awareness, and then we''re told he is aware
  of himself; but the possibility of awareness without bodily awareness is exactly
  what''s at issue — if we grant that the scenario is coherent, we''ve granted the
  conclusion (or at least a key premise). But there''s a response: the scenario only
  requires that we can conceive of such a case, and the conceivability of X without
  Y doesn''t show X can exist without Y (the standard conceivability-objection, like
  the "conceivability of a disembodied mind" objection to Descartes''s real distinction
  argument).


