  Let me think about the structure of a good old-evidence prompt:


  Ask: explain why old evidence is a problem for Bayesian confirmation theory, and
  specifically address a case: an agent who already assigns probability 1 to E, then
  comes to accept a theory T that entails E. Standard Bayesian story: P(T|E) = P(T),
  so no confirmation. Glymour: this shows Bayesianism can''t capture the confirmation
  of general relativity by the perihelion precession. Fixes: (a) counterfactual prior
  (what the agent would have believed had she not known E) — but this is unconstrained
  and arguably doesn''t reflect actual rational requirements; (b) conditionalize on
  the newly learned entailment "T ⇒ E" — works, but the confirmation then depends
  on the agent''s prior logical ignorance, which is arguably irrational; (c) deny
  that confirmation requires a probability increase (e.g., likelihoodism, or "the
  evidence confirms in the sense of making the theory more likely than its rivals");
  (d) accept that the agent should have had a credence < 1 in E.


  In-the-weeds: ask specifically whether the fix that conditionalizes on the newly
  learned entailment is stable under the "logical omniscience" idealization — if the
  agent were logically omniscient, would the old evidence problem vanish or become
  worse (i.e., confirmation by old evidence would be impossible for an ideal agent)?
  That''s a genuinely deep issue: it suggests that for an ideal Bayesian, old evidence
  never confirms — which seems to be a reductio, since scientists are confirmed by
  old evidence. And the counterfactual strategy makes confirmation depend on the agent''s
  prior ignorance of the entailment, meaning confirmation is "unstable" under idealization.


