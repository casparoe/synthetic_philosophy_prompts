  Potential prompt:


  "Modern cryptography rests on a distinction between two kinds of security. Information-theoretic
  security is unconditional: no adversary, however computationally powerful, can break
  the scheme. Computational security is conditional: a scheme is secure if every probabilistic
  polynomial-time adversary succeeds with negligible probability, so the scheme is
  breakable in principle by an unbounded search but not by any adversary we expect
  to build. In practice, banks, messaging apps, and military systems treat both as
  secure, and often prefer the computational kind because it is faster and more flexible;
  a one-time pad is information-theoretically secure but is rarely used for general
  communication. This practice appears to treat a scheme that is breakable in principle
  as secure enough, while treating a scheme that is unbreakable in principle as impractical.
  What philosophical commitments does the practice presuppose?


  Reconstruct the implicit theory. Does it require a particular view of possibility—say,
  that what is possible for us is not the same as what is metaphysically possible,
  or that computational infeasibility is a genuine kind of impossibility? Does it
  presuppose realism about complexity classes, so that P versus NP and the existence
  of one-way functions are objective facts about the world, or can the practice be
  licensed by a purely instrumentalist or constructivist reading? Does it assume that
  efficient computation is a natural kind, or only a shifting sociological category?
  What view of knowledge and evidence is at work in definitions that quantify over
  all polynomial-time adversaries, including adversaries no one has imagined and machines
  no one has built? And is the practice internally consistent: it treats information-theoretic
  security as the gold standard yet does not pay the practical price for it, and it
  treats computational security as sufficient even though its central assumptions
  are unproved.


  Distinguish what the practice strictly presupposes from what it merely fits well
  with, and say where it is philosophically underdetermined, so that several rival
  theories of modality, feasibility, and mathematical objectivity would license the
  same institutional behavior. Finally, suppose we replaced the asymptotic idealization
  with a concrete-resource view: security would be defined relative to a specified
  budget of time, memory, and parallelism, and a scheme would be secure only against
  adversaries within that budget. What would have to change in cryptographic practice,
  and what philosophical commitments would the replacement force us to give up or
  acquire?"


