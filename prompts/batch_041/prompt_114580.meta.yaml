  Background. Our health and pension plans extend coverage to an employee''s spouse,
  defined in the plan document solely by reference to legal status: a marriage valid
  where contracted, subject to a waiting period for spouses who were not previously
  enrolled. The plans also contain a narrower domestic-partner provision left over
  from before the system''s home state recognized marriages between people of the
  same sex; it is available only to couples who cannot marry here, and requires an
  affidavit showing at least four of six listed markers of interdependence (joint
  residence for three years, joint ownership or tenancy, shared bank account, designation
  as beneficiary, mutual power of attorney, shared expenses). Nobody has reconciled
  the two provisions, and the committee has never stated what purpose the spousal
  category is supposed to serve.


  The petitions. Petition A is from a nurse who married her wife in a state that recognized
  the marriage eight years before ours did; the plan administrator has denied enrollment
  for the period before our state''s change, on the ground that the marriage was not
  "valid where contracted" as of the relevant date — the couple says they were married,
  and the system is now penalizing them for having married early. Petition B is from
  a facilities supervisor who has shared a household with, and been the sole unpaid
  caregiver for, her brother since he was disabled in an accident eleven years ago;
  she has no spouse and no children, has designated him for everything the plan allows,
