  "I work on the internal workings of trained neural networks, and I keep meeting
  a problem I have no term for. The problem is this. I arrive at an account of how
  the network produces some behaviour: these units respond to this feature, they feed
  that one, that one suppresses a third. Then I find inputs on which the behaviour
  is produced, but not by the route I described; some other route did the work. My
  first instinct is to say that a different mechanism produced the output on those
  inputs. But whether I can say this depends on how I drew the account I already had.
  If the account was coarse, the second route falls inside it and I say that the same
  mechanism ran under unusual conditions. If the account was fine-grained, the second
  route falls outside it and I say that a different mechanism ran. The network, the
  two inputs, and the two routes are all held fixed; only the grain of my description
  has changed, and the verdict flips with it. Worse, I chose the grain before I knew
  the second route existed, and often for reasons internal to the first case — because
  that was the coarseness at which I could say anything at all.


  I do not think this is peculiar to my subject matter. A pharmacologist says a drug
  acts by its intended route when the route is the one named in the account of the
  target, and calls the same sort of side-route an off-target effect; whether the
  side-route counts as ''the mechanism of action'' or as a departure from it seems
  to be settled by what was named in advance. Something similar seems to happen when
  biologists ask whether two tissues use one pathway or two.


  What I want to know is whether there is a name for this, and if so, which name belongs
  to it. I expect there are relatives — I know there is a literature on how to draw
  the boundaries of a mechanism, and on the difference between sharing a structure
  and sharing a function, and something in statistics about reference classes — but
  I do not want to be handed the nearest relative and told that it is the same thing.
  What I am asking about is narrower: the dependence of the one-mechanism/two-mechanism
  verdict on the grain of a description that was fixed before the comparison was made.
  Tell me how the thing I have described differs from each relative you consider,
