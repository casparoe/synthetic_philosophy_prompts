  Let''s draft:


  "I teach a seminar on the concept of corruption, and I am trying to move my students
  past the legalistic definition according to which corruption is simply the abuse
  of entrusted public office for private gain. Next week I want to use Coppola''s
  The Godfather—the first film, not the trilogy as a whole—as a sustained case study.
  The film is usually discussed as a family tragedy or a gangster epic, but I think
  it is also a remarkable thought experiment about patronage, gift-exchange, and obligation.
  Vito Corleone''s world runs on requests made at a wedding, favors granted and remembered,
  debts of gratitude, and the currency of respect; the state''s law is present mostly
  as an external force that the Corleones either evade or purchase. The arc of the
  film turns on Michael, who begins as a war hero determined to stay outside the family
  business and ends as the most efficient and least merciful practitioner of its logic.
  I want a reading that takes both the film and the philosophical debate seriously:
  where does the film illuminate the difference between corruption, clientelism, and
  gift-exchange, and where does it resist being reduced to an illustration of any
  one of them?"


  Second paragraph: "Please bring to bear the following distinctions, which I have
  been using in class. First, corruption as abuse of public office presupposes a distinction
  between public role and private interest that the Corleone world does not quite
  recognize. Second, corruption as a systemic mode of political exchange—clientelism,
  patronage, favor-banking—may look less like a deviation from a moral order and more
  like an alternative moral order, with its own norms of reciprocity, loyalty, and
  honor. Third, corruption as a moral-psychological process: the way Michael''s initial
  decency is not simply destroyed but converted into a capacity for cold calculation,
  so that by the baptism sequence he is literally renouncing Satan while ordering
  murders. I am especially interested in whether the film''s judgment of the Corleones
  depends on a Western, liberal, impersonal-state standard, and whether a viewer who
  took amoral familism or patron-client exchange as a functional and even dignified
  way of life would see the same film differently. Does the film have the resources
  to criticize the Corleones from within their own moral economy, or does it smuggle
  in the state''s perspective?"


