  The "wrong kind of reasons" problem: reasons to have a propositional attitude (belief,
  intention, admiration, desire) that don''t bear on the correctness/fittingness of
  the attitude. Classic: the demon who''ll punish you unless you believe a proposition
  / admire him / intend something. The problem: these seem to be genuine reasons (they
  motivate) but they''re the "wrong kind." The puzzle: what distinguishes right-kind
  from wrong-kind reasons, and can we give a unified account?


  Candidate positions:

  1. Object-given vs state-given reasons (Parfit, Piller). Right-kind = object-given
  (reasons bearing on the object), wrong-kind = state-given (reasons bearing on the
  state of having the attitude).

  2. The fittingness view / "reason to believe is a reason to make the belief fit
  the world." The wrong-kind reasons are reasons to want to have the attitude, not
  reasons for the attitude.

  3. Eliminativism / "no wrong-kind reasons exist": reasons for attitudes are always
  object-given; apparent wrong-kind reasons are just reasons for actions (e.g., reasons
  to cause yourself to have the attitude).

  4. The "reasons-first" buck-passing: the reasons for an attitude are reasons for
  the object''s being the way the attitude presents it.

  5. The "good reasoning" / correct-response view (e.g., Hieronymi: reasons must bear
  on a question whose answer the attitude is).

  6. The "attitude-relative" view.


