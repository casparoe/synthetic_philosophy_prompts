  Essay draft:


  "For a short paper I''m drafting, here''s my argument in compressed form. Dennett''s
  two-bitser: a coin-operated vending machine that accepts two-bit pieces; in a possible
  world the economy collapses and the coins are replaced by slugs of the same dimensions,
  and the machine keeps accepting them. Dennett asks which property the machine''s
  internal acceptance state tracks: being a two-bit piece, or being a slug-of-a-certain-shape,
  or being a thing used as currency here. He claims there''s no fact of the matter;
  the answer depends on which interpretation is most useful to the ascribers, and
  this indeterminacy infects our own case too, so the original/derived distinction
  collapses. Searle''s side of the exchange, as I read it, grants the indeterminacy
  of *which* property is represented and denies that this touches the question of
  *who* does the representing — original intentionality is intrinsic to the biology,
  derived intentionality is borrowed from us.


  My claim: the two-bitser doesn''t force a choice between these readings, because
  it confounds two questions that should be separated. Call them specification and
  provenance. Specification: which property is the correctness condition on the state.
  Provenance: whose interests make that property the correctness condition. Dennett
  is right that specification is interest-relative in cases where the system''s dispositions
  are shallow — the machine''s counterfactual profile is exhausted by shape, so nothing
  in it settles whether shape or monetary role is tracked. But he is wrong to think
  provenance inherits that indeterminacy.


  I want to test this with a case I haven''t seen discussed: the serviced two-bitser.
  Suppose the manufacturer''s technicians, when the economy changes, adopt an explicit
  policy: the coin module is to accept any disc that the surrounding population uses
  as currency, and they implement this by having the module''s acceptance state be
  caused by whatever the population in fact uses. Now the machine''s dispositions
  are keyed to a social property. Specification has become determinate — it tracks
  monetary role, not shape — while provenance has not become original: the correctness
  condition is still fixed by the technicians'' and our interests, not by the machine''s
  own. So the two questions come apart in the opposite direction from the one the
  standard framing anticipates: determinate specification with derived provenance.


  That looks like a counterexample to Dennett only if you assume indeterminacy of
  specification is the mark of derived content. What it actually shows, I think, is
  that the real work is done by a notion I''d call self-specification: a system has
  original intentionality only if its own states determine which property they are
  answerable to. The interesting question then becomes whether self-specification
  is possible at all without a biological subject, and whether the technicians'' policy,
