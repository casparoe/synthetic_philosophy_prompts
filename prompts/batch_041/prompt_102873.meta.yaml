  when it is in fact a thoroughly socialized figure: the internalized voice of the
  standards of the people around us. On her account Smith is offering a theory of
  how we become answerable to one another, not a device for stepping outside our culture;
  the impartial spectator is less a vantage point than a second-personal demand we
  learn to hear. She also thinks this reading exposes a vulnerability that the ideal-observer
  reading conceals: because the spectator we internalize is drawn from our actual
  audience, the mechanism can be captured by audiences that are neither impartial
  nor well informed, and she proposes the imagined online crowd — a mass of strangers
  whose reactions we anticipate but who have no claim to detachment — as a test case.
  She has a term for the captured version: the counterfeit spectator.


