  the re-dedication of a village war memorial in the English town where I grew up,
  after a restoration, with a delegation from our German twin town present. The memorial
  carries the names of forty-one local men killed between 1914 and 1918, and a smaller
  tablet, added later, for the German prisoners of war who died in a camp on the edge
  of the parish. The audience will be mixed. Some are descendants of the men named;
  some are local historians who will know exactly which controversies are being avoided
  and which are being fudged; the German delegation will be listening in a second
  language; and many will simply be there out of habit, respect, and the expectation
  of a certain kind of sentence. I have been asked for eight minutes.


  I have spent the winter reading about the quarrel over responsibility for 1914 —
  whether the war was willed by one power, whether it emerged from a system in which
  each state''s mobilisation was a rational response to the last, whether the timetables
  that made mobilisation irreversible meant that the last week of July was less a
  series of choices than a sequence of commitments none of which could be undone.
  I have come to think that the question ''which nation was to blame'' may be malformed,
  and I want the address to make that thought do real work rather than merely assert
  it. What I find hardest to get across, and what I want you to get across for me,
  is a set of distinctions that I can feel but cannot articulate:


  - between a nation as a bearer of responsibility and a nation as a convenient fiction
  for a great many people who each did something;

  - between the causal question (what made the war happen) and the moral question
  (who is answerable), and between backward-looking blame and forward-looking responsibility
  — the difference between asking who did it and asking what we, now, owe;

  - between guilt that attaches to acts and to persons, and the sort of responsibility
  that attaches to institutions and to inheritance — the fact that I may be answerable
  for something I did not do and could not have prevented, simply because it was done
  in my name.


