  Prompt draft:


  ---


  I teach a 90-minute session on distributive justice for a mixed class of about 18
  upper-level undergraduates (philosophy and economics), in a seminar room with movable
  chairs. I want to design a staged allocation game that makes them feel the internal
  tension in luck egalitarianism from the inside — the pull of the thought that people
  should not be worse off through brute bad luck, and the pull of the thought that
  the same principle requires them to sit in judgment on whether someone''s misfortune
  was their own doing. I want them to run into the second pull while they are still
  committed to the first, before either has a name.


  Design the activity. Constraints:


  - The group must first write a compensation rule while ignorant of their own outcome,
  and only later apply that rule to themselves and each other.

  - The fund must be capped... etc.


  Then the deliverable spec: rules, materials (including the private information cards),
  roles, a timeline with minute markers, the payoff scheme in points with no money,
  and a debrief that maps each moment onto the philosophical point. Then: what will
  predictably go wrong and how to handle it. Then: an honest note on what the activity
  can''t reproduce.


  Specific features I want in it:

  1. A constitutional stage: they write the rule before knowing their position.

  2. A revelation stage where claims must be adjudicated using only the claimant''s
  own testimony.

  3. A hard budget so that paying one claim means denying another (this is where the
  harshness lands).

  4. One case where the disadvantage is unchosen but its magnitude depends on tastes
  the person cultivated (expensive tastes).

  5. One case where the disadvantage is plainly self-caused, so the group''s own ex
  ante rule denies it and they have to watch someone in the room be left out.

  6. One case where the causal tracing is genuinely indeterminate (e.g., a health
  condition with a behavioural component), to make the epistemic problem concrete.

  7. A disclosure requirement that makes the cost of claiming personal — the point
  being that the fund can''t distinguish luck from choice without asking questions
  people don''t want to answer.


  And I want the debrief to distinguish clearly between (a) the epistemic problem
  (we can''t tell luck from choice), (b) the respect/shame problem (the asking is
  itself degrading), and (c) the abandonment problem (if we resolve (a) and (b) by
  refusing to ask, the imprudent go uncompensated) — and to say which of these the
  activity actually stages and which it only gestures at.


  Also: I want them to notice the difference between compensating a disadvantage because
  it was unchosen and compensating it because it is bad — the "badness" and "unchosenness"
  criteria come apart in at least one of the cases, and I''d like the activity to
  force them apart.


  Also mention: keep names out of it until the debrief; they shouldn''t hear "luck
  egalitarianism" or "option luck" until afterwards.


  Also: the "expensive tastes" — I''ll phrase it as "a disadvantage whose size depends
  on tastes the person cultivated."


  Also possible: a "responsibility insurance" market pre-commitment — maybe optional
  as a fifth round for if the group finishes early. Nice: an optional extension.


  What the activity cannot reproduce: the question whether the currency of equality
  is resources, welfare, or something else (the game fixes a single currency); the
  question whether equality is the right ideal at all (relational equality / the objection
  that the point of equality is not to compensate but to end oppression); and the
