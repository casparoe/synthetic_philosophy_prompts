  So the activity: a mutual insurance / compensation game. Design:


  Setting: upper-level undergraduate seminar or a philosophy reading group on distributive
  justice, ~16-20 participants, 90 minutes.


  Stage 1 (constitutional, behind a veil of ignorance, 20 min): participants are randomly
  assigned to "households" with an unknown future. They must write a *compensation
  rule* — a set of criteria for when the collective fund pays out — before knowing
  their own outcome. Materials: a printed "life chances" deck.


  Stage 2: a "life lottery" deals out outcomes (some from luck, some from choices
  they''ll be forced to make in Stage 2.5).


  Stage 3 (the tribunal): claimants must apply their own rule to their own case, and
  to claim, they must disclose facts (each participant has a sealed private card with
  an embarrassing/private fact, e.g., "you skipped the exam to go to a party," "your
  chronic illness is worsened by a diet you chose," etc.). The rule they wrote almost
  certainly requires knowing whether the outcome traces to choice or luck — and so
  the tribunal must interrogate.


  Stage 4: A second surprise — the "expensive tastes" card: one participant''s disadvantage
  arises from tastes they cultivated deliberately (they "developed a taste for expensive
  therapy" / "became attached to an ambitious project"). Their claim is either paid
  (revealing that the principle rewards expensive taste) or denied (revealing the
  abandonment).


  The debrief maps: the constitutional stage = hypothetical insurance / ex ante choice;
  the interrogation = the epistemic problem of tracing outcomes to choice; the disclosure
  = the shame/respect objection; the abandonment of the person who gambled = the harshness/abandonment
  objection; the expensive-taste payout = the problem of taste-sensitivity.


