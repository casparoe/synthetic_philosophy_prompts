  luck") and then discover vagueness; or they''ll be nice and pay everyone, which
  dissolves the game — need a hard budget so they can''t. So the facilitator must
  impose a fixed budget: the fund has exactly N units, so paying one person means
  denying another. Good — that forces the harshness.


