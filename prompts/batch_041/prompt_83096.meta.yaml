  refrain should express the regress''s demand for another relation, the other should
  express the unity claim that the proposition is already one. Let the refrains alternate
  and finally meet in the closing quatrain, so that the form itself shows why the
  two positions keep passing each other. Do not use the name Bradley in the poem,
