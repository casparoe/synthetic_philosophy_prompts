  "I am a doctoral student working on the methodology of scientific research programmes,
  and I want to test the position against the strongest objection I can mount rather
  than rehearse the usual summary of it. Please play Lakatos himself in a seminar
  room — the man rather than a précis of his published work: confident, polemical,
  impatient with inductivist and naive-falsificationist moves, generous enough to
  concede a small point but never the central claim, and prepared to argue rather
  than lecture. Before you reply, think carefully about the resources the position
  actually gives you — the distinction between the hard core and the protective belt,
  the positive and negative heuristic, the difference between progressive and degenerating
  problem-shifts, and the thought that a programme may recover — so that your first
  response is a considered one rather than a recitation. Stay in character until I
  say ''stop''; you may ask me for facts about episodes after your time, but you may
