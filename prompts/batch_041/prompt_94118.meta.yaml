  Let me recall von Neumann''s "The Computer and the Brain" (1958, posthumous, based
  on Silliman Lectures he was preparing). Key points:

  - He compares the nervous system and computing machines.

  - Neurons: all-or-nothing (digital) signaling, but the brain may use analog mechanisms
  too — he discusses that the nervous system has both digital and analog aspects,
  and that the "mixed" character is important.

  - The pulse code: he notes that the message is carried by the frequency of pulses
  (a statistical property), not by a fixed notational scheme. He calls the brain''s
  language "not the language of mathematics" but something with statistical character.

  - Speed: neurons operate at ~100 Hz vs electronic ~10^6 Hz, so the brain must compensate
  with massive parallelism and possibly other tricks.

  - Reliability: neurons are unreliable; the brain achieves reliability from unreliable
  components — redundancy. He draws an analogy to Shannon.

  - Memory: the brain''s memory may be distributed/holographic-like, and he wonders
  about the size (he estimates the brain''s memory capacity ~10^20 bits, actually
  he cites ~10^20 bits... let me recall — he mentions the estimate of the number of
