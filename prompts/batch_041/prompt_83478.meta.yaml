  Rietdijk (1966) and Putnam (1967) argue: Take two events A and B that are spacelike
  separated. There''s a frame in which A is simultaneous with B... Hmm, the usual
  reconstruction: Let "here-now" be my current event. In some frame, an event in Andromeda
  "now" is simultaneous with my here-now; in another frame, a different Andromeda
  event (earlier or later by the first frame''s reckoning) is simultaneous with my
  here-now. If "being real" attaches to events simultaneous with a given present (i.e.,
  if the present moment''s contents are real), then both Andromeda events are real
  for me. Then, by iterating/chaining and using transitivity of reality (if X is real
  relative to Y and Y is real relative to Z then X is real relative to Z — actually
  the transitivity of "is real"), we get that all events are real, including events
  in our own future, so no objective becoming. Hence determinism/eternalism.


  Key premise under attack: the "transitivity of becoming"/"real for" — Putnam''s
  argument relies on taking "real for A" to be transitive, or on the claim that there
  is a fact about which events are "real" (i.e., a present) and simultaneity relations
  carry that. Stein (1968, "On Einstein–Minkowski space-time") argued that relativity
  is compatible with a notion of becoming/priviledged "here-now" as long as one doesn''t
  require transitivity. Also the objection from Savitt, Clifton & Hogarth, etc. Also
  some argue the argument assumes that "x is real" as judged from a frame is an absolute
  property.


