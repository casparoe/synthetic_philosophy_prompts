  beliefs are justified not by inference or perception but by a third thing — e.g.,
  learning what a word means by being told "that''s a ___" (upamāna). Or the "a sentence
  can be understood yet the sentence itself, not the speaker, is the knowledge source"
  — the Nyāya view that verbal testimony (śabda) is a pramāṇa, distinct from inference.


  Also the phenomenon of "I can be wrong about whether I know something" — Nyāya''s
  pramā as a "true cognition arising from a pramāṇa" — the fact that knowledge requires
  the causal chain, so lucky guesses aren''t knowledge. But that''s Gettier, overdone.


