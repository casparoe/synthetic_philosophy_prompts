  Draft:


  "For a few years now I''ve been keeping a private list of the ways I come to know
  things — perception, inference, being told, memory, and so on — mainly as an exercise
  in noticing what I''d otherwise lump together. One entry refuses to settle into
  any of the categories, and I''d like to know whether the phenomenon has a name,
  and if so how it is usually carved off from its neighbours.


  The case is this. Someone tells me that a certain bird is ''like a small crow but
  with a white patch on the wing''. I file this away, and it does not by itself tell
  me anything about any bird. Later I''m in a field and see a bird, and on the strength
  of the resemblance I know: that is the bird the description was for, and that is
  what the word means. Two things puzzle me. First, I never held a general premise
  that I could state — I couldn''t have written the inference down, because I didn''t
  know the class in advance; the resemblance did the work, and the resemblance is
  not a proposition I believed beforehand. Second, the forester''s sentence gave me
  the description but not the knowledge; the knowledge appeared only when the description
  met a perception. So it is not testimony, and it is not inference from a general
  rule, and it is not plain perception of the fact either — the perception alone wouldn''t
