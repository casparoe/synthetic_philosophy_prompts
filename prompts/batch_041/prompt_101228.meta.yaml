  data were sparse, the low-temperature regime was unprecedented, and the engineering
  models were contested. Assume the decision-makers faced a choice between launching
  and scrubbing, with outcomes that include mission success, mission failure with
  vehicle loss, and mission failure with crew loss. I want you to distinguish, as
  imprecise-probability theory does, between risk (known chances) and ambiguity (a
  set of admissible chances), and to use the following decision rules: (1) maximin,
  (2) maximax, (3) Hurwicz with a stated optimism coefficient, (4) E-admissibility,
  and (5) a precautionary rule that permits an act only if its lower expected value
  exceeds a specified threshold. You may choose the threshold and coefficient, but
