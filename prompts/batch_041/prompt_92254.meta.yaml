  Student answer:


  "Strategy stealing works by assuming the second player has a winning strategy. The
  first player makes an arbitrary opening move, then pretends to be the second player
  and follows that winning strategy. If the strategy ever tells them to play on the
  cell they already occupied, they just play any other legal move; having an extra
  stone can''t hurt. So the second player can''t have a winning strategy. Since Hex
  is finite and can''t end in a draw, the first player must have a winning strategy.
  This generalizes to any symmetric finite game: in a symmetric game, the first player
  can always steal the second player''s strategy, so the first player wins. The argument
  is non-constructive because it doesn''t tell you what the first move or the rest
  of the strategy is. It doesn''t say the second player is doomed in every sense,
  only that the second player has no winning strategy. One subtlety is that the argument
  relies on the game being symmetric, but it doesn''t require the game to be zero-sum;
  it works for any game where the players have the same moves. Also, the strategy-stealing
  argument assumes that extra moves are always at least neutral, which is true in
  Hex because stones never hurt you, but it can fail in games with zugzwang, where
  being forced to move can be bad. So the claim is mostly right, though the no-draws
  condition is needed to get from ''second player cannot win'' to ''first player wins''."


