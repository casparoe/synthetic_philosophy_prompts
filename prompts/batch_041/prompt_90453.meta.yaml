  Student answer draft:


  "Evolutionary debunking arguments begin from the premise that our moral beliefs
  and evaluative attitudes have been substantially shaped by natural selection. Their
  conclusion is that moral realism -- the view that there are mind-independent moral
  truths -- is false. Sharon Street''s ''Darwinian dilemma'' is the best-known version.
  Street argues that the realist faces a dilemma. Either the selective pressures that
  shaped our evaluative tendencies tracked the independent moral truths, or they did
  not. If they did not, then our moral beliefs are largely off-track, and realism
  gives us no reason to trust them. If they did, this would be an extraordinary coincidence,
  since the adaptive value of an evaluative tendency -- its tendency to promote reproductive
  success -- is quite independent of its truth. Either way, realism is in trouble.


  Street''s argument depends on contested empirical claims from evolutionary psychology,
  such as the claim that human morality evolved through kin selection and reciprocal
  altruism; to that extent its force is only as great as those hypotheses. Its central
  weakness, however, is that it commits the genetic fallacy. It attacks moral beliefs
  by pointing to their causal origins rather than by offering evidence against their
  content, and the fact that a belief has a biological function tells us nothing about
  whether it is true. A moral realist can therefore dismiss the argument out of hand.


  The most serious objection is Richard Joyce''s. In The Evolution of Morality, Joyce
  argues that natural selection would have favoured moral beliefs because they promote
  cooperation, not because they are true, and concludes that we should abandon morality
