  "Evolutionary debunking arguments take as their starting point the fact that our
  moral beliefs and evaluative attitudes have been substantially shaped by natural
  selection. Their conclusion is that moral realism — the view that there are mind-independent
  moral truths — cannot be sustained.


  The best-known version is Sharon Street''s ''Darwinian dilemma'', developed at length
  in her book The Evolution of Morality. Street argues that the realist faces an unavoidable
  choice. Either the selective pressures that shaped our evaluative tendencies tracked
  the independent moral truths, or they did not. On the second horn, our moral beliefs
  are largely off-track and realism gives us no reason to trust them. On the first
  horn, the realist must hold that natural selection favoured tendencies that happened
  to correspond to the independent moral facts; since the adaptive value of a tendency
  — its contribution to reproductive success — is quite independent of its truth,
  such correspondence would be an extraordinary coincidence. Either way, realism is
  undermined.


  Street''s central weakness is that she commits the genetic fallacy. She attacks
  moral beliefs by pointing to their causal origins rather than by offering evidence
  against their content, and the fact that a belief has a biological function tells
  us nothing about whether it is true. A moral realist can therefore dismiss the argument
  out of hand.


  The most serious objection to the debunking strategy is Richard Joyce''s. In The
  Evolution of Morality, Joyce argues that natural selection would have favoured moral
  beliefs because they strengthen cooperative motivation, not because they are true,
  and he concludes that we should abandon morality altogether, a position he calls
  moral abolitionism. This is a more radical conclusion than Street''s, and it shows
  that the real issue is whether moral facts exist, not merely whether our beliefs
  about them are justified.


  A more promising line is to observe that the argument threatens realism but leaves
  constructivism untouched. Since constructivists hold that moral truths are constituted
  by our evaluative attitudes, they need not worry whether those attitudes track anything
  independent of them, and evolutionary debunking therefore leaves constructivism
  standing as the most defensible metaethical position."


