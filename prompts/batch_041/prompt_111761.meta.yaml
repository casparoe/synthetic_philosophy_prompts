  Candidate: **The instruments / two clocks analogy for peer disagreement.**


  Mapping: each disputant ↔ an instrument; the disputed proposition''s truth value
  ↔ the measurand; each one''s reliability ↔ instrument precision/accuracy; the fact
  of disagreement ↔ the readings differing; higher-order evidence ↔ noticing the discrepancy;
  conciliation ↔ averaging/error-correcting calibration; steadfastness ↔ trusting
  your instrument because it''s better calibrated.


  Break points:

  1. Instruments don''t disagree about *reliability*; but in the peer case the reliability
  is exactly what''s at issue and each party has evidence about it.

  2. Conditional independence: the averaging argument requires errors to be independent
  given the truth. Peers typically share evidence, training, and heuristics → correlated
  errors. Two clocks both synced to the same radio signal.

  3. Instruments don''t have reasons; peers do. The disagreement between people has
  content — you can look at *why* they differ, and the reasons can be asymmetrically
  assessed, which is where steadfastness gets its footing. An instrument disagreement
  gives you no "argument" to evaluate.

  4. The instrument analogy treats both readings as measurements of a single scalar;
  many philosophical disputes are not measurements of an independent fact but partly
  constitutive of the concept in dispute (the "measurand" is not independent of the
  "instruments").

  5. Averaging is licensed only when the errors are unbiased/zero-mean and equal-variance;
  in the peer case the correct response may be to adopt one party''s answer wholesale
  (if the disagreement is explained by a known asymmetry) rather than to move toward
  the midpoint. So the analogy supports "split the difference" too strongly — the
  *quantitative* midpoint has no analogue in the qualitative case (what''s the midpoint
  between "free will exists" and "it doesn''t"?). That''s a good one: the analogy
  imports a metric space of answers, which mostly doesn''t exist. Nice — very in-the-weeds.

  6. Calibration: you can check a clock against a third clock; the "independence"
  of the third clock matters. The community''s "independent" instruments may be correlated
  by shared culture.

  7. The asymmetry of *self-trust*: with instruments, you can have a meta-instrument
  (you the observer) adjudicating; in the peer case, the observer is one of the instruments.
  The analogy needs a standpoint outside both, which the epistemic situation denies.
  That''s a really good point — the "view from nowhere" import.


  Smuggled imports: (a) a common measurand independent of the instruments; (b) a metric
  on the space of answers; (c) independence and equal reliability; (d) an external
  adjudicator; (e) that the disagreement is "noise" rather than signal about a genuine
  indeterminacy.


