  persists. The other friend (Mara, who did a philosophy degree before switching to
  data science) said Dan was confusing the question of whose reason it is with the
  question of whether there is a reason there at all. Her line was that the display
  is organized around an end — it works only because it produces a specific effect,
  and it is there because it produced that effect — and that this is a perfectly good
  reason, one that simply floats free of any reasoner. She called it ''a reason with
  nobody home.'' Dan countered that ''floats free'' is doing no work: any outcome
  of any process can be described as if it were aimed at, and if the account licenses
  saying that a river ''wants'' to reach the sea or a virus ''tries'' to spread, then
  it has stopped distinguishing explanation from decoration. Mara said the difference
  is selection: the river''s meander isn''t there *because* it produced the seaward
  result in the way the display is there because it saved chicks, and that difference
