  The subtle confusion: The asker might think that Malcolm and Dennett agree that
  dreams aren''t experiences, and ask "since both Malcolm and Dennett showed dreams
  aren''t experiences, does that mean dream reports are just confabulations we can''t
  trust — so how do I know I even dreamed last night?" The false presupposition: Malcolm''s
  view is a conceptual/grammatical point about the language of dreaming (dreaming
  is not a form of consciousness or experience in the way waking perception is; the
  "dream experience" locution misleads — dreams are not something the dreamer undergoes
  while asleep; reports of dreams are not reports of observations). Dennett''s view
  is different: he argues the "cassette" or "judgment" theory — that dreams aren''t
  experiences but rather that we confabulate memories upon waking, that the dream
  narrative is produced at or after waking, and that there is no fact of the matter
  about what happened "in" the dream beyond what''s in the memory. Also crucially,
  Dennett''s argument depends on empirical claims about dream research (stimulus incorporation,
  lucid dreaming, dream reporting) whereas Malcolm''s is an ordinary-language/conceptual
  argument. So the confusion: treating them as allies making the same claim, and thinking
  the upshot is skepticism about whether you had any dream content at all. Also a
  subtle point: Malcolm actually thinks we know perfectly well what we dreamed — the
  grammar of "I dreamed" is not a report of an inner observation, so it''s not subject
  to skeptical doubt in the way an inference from evidence would be. Dennett''s view,
  by contrast, is revisionary and empirically laden; he''s the one who makes the "we
  don''t really have the experiences" claim in the deflationary sense. So the questioner
  who says "Malcolm and Dennett both showed dreams aren''t experiences, so how can
  I trust my memory of a dream?" has conflated a grammatical remark with an empirical
  hypothesis, and has also mistaken the anti-skeptical direction of Malcolm''s argument.


  Also possible: the asker might think "if dreams aren''t experiences, then there''s
  no such thing as a dream experience, so lucid dreaming is impossible / dream reports
  are all fabricated" — a false presupposition about the consequence.


  Also there''s a nice wrinkle: "experience" in the sense of "an experience" (a datable
  event in someone''s life) vs "conscious experience" (phenomenal state). Malcolm''s
  claim is about the former-ish — that "dreaming" is not a state of consciousness
  during sleep, and that the notion of having images while asleep is philosophically
  confused. Dennett''s is that the dream narrative is a post-hoc confabulation. If
  the asker treats "dreams aren''t experiences" as one unified thesis, they''ll conflate.


