  Prompt draft:


  "I have no academic training in philosophy, but I have been working out a position
  on what I call orphan reasons — rationales that explain why something is the case
  even though no one ever entertains them. I would like you to audit the package for
  consistency, not to tell me what the standard positions are. Here is where I have
  landed:


  1. Natural selection is a reason-recording process. When a trait persists because
  it solved a problem for ancestors, there is a fact about what the trait is for,
  and that fact does not depend on any organism or biologist representing it.

  2. To give a trait''s function is to give the reason for its presence. So there
  are reasons in the world that are not anyone''s reasons.

  3. A reason, properly so called, is a consideration that counts in favour of something.
  It is normative: if it is a reason to do X, then it makes X in some sense fitting
  or required, not merely caused.

  4. Normativity requires a subject. Something can count in favour of an action only
  if there is someone (or something) for whom it can count — a creature that can be
  guided by it, even if only in a thin sense.

  5. But I also think that a bee''s dance, a tree''s phototropism, and an immune response
  can be explained by orphan reasons. No subject in those systems represents the consideration;
  the rationale floats free.


  I suspect these cannot all be true as stated, but I cannot tell whether the problem
  is in 2, 3, or 4, or whether it is only an ambiguity in what counts as a reason.
  I also have two further commitments that may or may not bear on the first five:

  6. Reasons must be the sort of thing that can be weighed. If two considerations
  both count in favour of incompatible outcomes, it must make sense to ask which has
  more weight, even if no one ever does the weighing.

  7. Nothing can have weight except relative to a standpoint or a project. Weight
  is always weight-for-someone.


  And one more:

  8. I think it is a mistake to say that a river has a reason to flow downhill, even
  though it is also a mistake to say that its downhill flow is arbitrary. The river''s
  behaviour is intelligible without being reason-governed.


  Please tell me which of these commitments are genuinely in tension, which only appear
  to be, and which are simply underdescribed. Rank the tensions by severity. For each
  genuine tension, say what would have to be given up or revised, and what the cost
  of that revision would be. Then tell me which single revision would resolve the
  most without doing too much violence to the rest. I am not looking for a survey
  of the literature; I want an audit of whether this particular package hangs together.
  Finally, say how confident you are in your audit and identify the point you are
  least sure about."


