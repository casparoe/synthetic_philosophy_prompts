  Genuine tension A: 2+3+4 vs 5. If reasons are normative and require subjects, then
  orphan reasons cannot be reasons. But 2 says they are. Resolution options:

  - Deny 2: functions are not reasons, only explanations. Cost: loses the claim that
  there are reasons without reasoners; free-floating rationales are just teleological
  explanations.

  - Deny 3: reasons can be non-normative. Cost: implausible, collapses reasons into
  causes.

  - Deny 4: normativity doesn''t require subjects; there can be objective norms not
  tied to agents. Cost: need account of how something can count in favour without
  anyone for whom it counts; maybe Platonism.

  - Distinguish explanatory vs normative reasons: 2 is about explanatory reasons,
  3 about normative reasons. Cost: ambiguity; the package loses unity; "orphan reasons"
  are explanatory, not normative. But 6-7 may still create tension.


