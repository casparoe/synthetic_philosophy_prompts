  Moore''s proof of an external world: classic false presupposition would be treating
  Moore''s proof as a deductive argument whose validity is the issue, or the confusion
  "Moore proved there''s an external world, so why do epistemologists still worry
  about skepticism?" Or the confusion that Moore''s proof fails because the premise
  ("Here is a hand") is question-begging in a way that makes the argument circular,
  versus the real issue (proof vs. showing, the "I know" claim, the fact that the
  proof is valid and the premises known — the issue is what a proof must do, e.g.,
  Wittgenstein''s "Moore''s paradox" confusion... Actually a nice false presupposition:
  confusing Moore''s proof of an external world with Moore''s paradox (the absurdity
  of "it''s raining but I don''t believe it"). That''s a subtle confusion — a rationalist-blog
  reader might conflate "Moore''s proof" and "Moore''s paradox" — but that''s maybe
  too easily spotted.


  Better: the presupposition that Moore''s proof is invalid or that Moore begs the
  question against the skeptic; the standard line (from Moore himself, and Wittgenstein)
  is that the proof is perfectly valid — modus ponens with premises he claims to know
  — and the interesting thing is why that doesn''t settle the skeptic. Actually Moore
  does argue for his premises ("I can prove now... by holding up my two hands"). A
  false presupposition could be: "Moore''s proof only shows that he believes there''s
  an external world, not that there is one" — no, that''s too easy.


