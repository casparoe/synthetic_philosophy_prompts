  Structure of prompt:


  1. Framing: retired scientist (say, a taxonomist/entomologist or field botanist),
  reading Hart and Fuller, wants a dichotomous key.

  2. Deliverable: (a) first, the small set of diagnostic questions that generate the
  space, each phrased as a question about a case or claim, answerable without labels;
  (b) then the tree, branching on those; (c) leaves = named positions + one sentence
  on the most awkward commitment + the case that most embarrasses it; (d) unoccupied
  cells diagnosed; (e) pairs the key cannot split flagged as cryptic.

  3. Constraints on content: must include these leaves (Hart''s positivism; the later
  soft/inclusive reading; Raz-style exclusive positivism; Fuller''s inner morality;
  classical natural law with the focal-meaning move; Radbruch-style non-positivism;
  Dworkin''s interpretivism; and the deflationary/terminological view).

  4. Cases that must appear as diagnostic characters: grudge informer; the 1850 fugitive
  slave statutes and their enforcement; a legal system with the procedural pathologies
  (unpublished, retroactive, contradictory, impossible to comply with, secret, unstable,
  divergent from official practice); a decent system with one monstrous rule vs a
  monstrous system with mostly ordinary rules; the judge in a wicked regime deciding
  a routine contract case; a rule that is morally attractive but has no source.

  5. Distinctions to keep separate: where the alleged connection is located (validity
  of individual norms / existence of a legal system / the analysis of the concept
  / the reasoning of adjudicators / the moral obligation to obey); content-necessity
  vs validity-necessity (Hart''s concession that any survivable legal system must
  contain certain minimum content vs Fuller''s procedural requirements); the claim
  to authority; open texture and the core/penumbra.

  6. Instructions: no citations, no reading list; I can''t look anything up; keep
