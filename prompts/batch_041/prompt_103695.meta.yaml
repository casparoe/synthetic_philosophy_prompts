  cashed out. The thesis is that the presumption of independence is fundamentally
  a claim about the inductive situation of a computationally bounded reasoner — a
  norm telling such a reasoner which regularities it is entitled to project and which
  coincidences it should not treat as informative — and not a claim about any objective
  chance distribution or about the world''s ontic structure. If that is right, then
  a whole class of formalizations are misfires: any account that fixes a single prior
  over a fixed hypothesis space, or that tries to read the presumption off a single
  probability distribution, will either build in the very correlations the heuristic
  is supposed to license ignoring or will smuggle in substantive assumptions. The
