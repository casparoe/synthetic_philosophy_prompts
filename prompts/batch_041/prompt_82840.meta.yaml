  Now the GEB concepts: In Chapter 6 of GEB, "The Location of Meaning," Hofstadter
  distinguishes:

  - Frame message: the message that says "I am a message; decode me" — the outer wrapper
  that signals there''s an inner message and how to get at it.

  - Outer message: the message that tells you how to decode the inner message — the
  key/instructions.

  - Inner message: the actual content that only emerges once the decoder has been
  triggered and the code applied.


  Also related: the idea that meaning is not located in the message itself, but in
  the interaction between message and decoder — meaning is "in" the receiver''s ability
  to construct isomorphic mappings. Also the "record player" thought experiment (Record
  Player X and "I Cannot Be Played on Record Player X") — but that''s a different
  chapter (Contracrostipunctus / Chapter 7?). Actually the record player paradox is
  in the Dialogue before Chapter 7 ("Contracrostipunctus") and discussed in Chapter
