  Yes! That''s a great crux: Is the NFL theorem a formalization of Hume''s problem
  of induction, or is it orthogonal / even a distraction? Argument: Hume''s problem
  concerns the justification of any inductive inference; NFL concerns the average
  performance of algorithms over a class of problems with a uniform measure — a claim
  about *averages*, which leaves open that a specific algorithm does well on a specific
  class; also NFL''s uniform measure is itself an inductive assumption ("all worlds
  equally likely"), so the theorem presupposes rather than solves the epistemic problem;
  and conversely, Hume''s problem bites even in a world where the measure isn''t uniform.
  Also: NFL shows you can''t have universal inductive success, but Hume''s problem
  is about justification, not success rates. And "you get a free lunch whenever the
  world isn''t symmetric" — but that doesn''t tell you which asymmetry you''re entitled
  to assume.


