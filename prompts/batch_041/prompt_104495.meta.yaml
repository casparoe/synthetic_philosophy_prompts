  Here is the argument as we wrote it on the board. (1) When a person exists, her
  pleasure is good for her and her pain is bad for her. (2) The absence of pain is
  good, even when no one exists to enjoy that absence. (3) The absence of pleasure
  is not bad unless someone exists who is deprived of it. (4) If one state of affairs
  is good in some respect and bad in none, while another is bad in some respect, the
  first is better than the second. (5) Compare the state in which a given person is
  brought into existence, with a life containing much pleasure and some pain, against
