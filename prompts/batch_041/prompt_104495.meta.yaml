  this is not bad. (7) In the former state there is pleasure, good by (1), and pain,
  bad by (1). (8) Therefore the state of never existing is better in one respect and
  worse in none, and so by (4) it is better than existing. (9) Since the reasoning
  nowhere depended on how much pleasure the life contained, it holds even for a life
