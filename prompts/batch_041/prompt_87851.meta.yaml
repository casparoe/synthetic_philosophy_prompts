  sends in a telegram, with no communication or binding agreements allowed; naive
  individual reasoning says everyone should send, which would ruin it for all, and
  the "superrational" answer is usually given as: each participant sends with probability
  equal to one over the number of participants. In the Luring Lottery, entrants may
  submit any whole number of entries, the prize is one million dollars divided by
  the total number of entries, and one entry is drawn at random; here the "superrational"
  prescription is said to be that each entrant should effectively randomize so that
  the total is about one entry, but since the strategy space is unbounded, any number
  of symmetric prescriptions look defensible.


