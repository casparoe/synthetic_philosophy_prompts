  Camps: (1) accuracy-first: the sole fundamental epistemic good is accuracy (closeness
  of credences to truth), and norms of credence are justified insofar as credences
  that violate them are accuracy-dominated or otherwise expected-accuracy-suboptimal;
  probabilism, and evidential norms via additional principles (e.g., chance-credence,
  indifference) which they claim are accuracy-based or at least accuracy-licensed.
  (2) evidence-first: the fundamental norm is that credences match evidential support;
  accuracy is at best a downstream/derived value; the dominance arguments give you
  coherence, not evidence-responsiveness; and "expected accuracy" arguments smuggle
  in evidential constraints (e.g., which probability distribution to take expectations
  over — over the agent''s own credences? over chance? over evidence?) — that''s a
  genuine, well-known crux ("the expectation of accuracy must be taken with respect
  to some probability function; if it''s the agent''s own credences, the argument
  is circular; if it''s the truth, it''s trivial"). Yes! That''s a real and nice crux:
  what''s the right "reference distribution" for expected accuracy (Joyce''s argument
  uses the agent''s own credences to show that any non-probabilistic credence is dominated
  in accuracy by some probabilistic credence, pointwise). Good: I know this well:
  the accuracy-dominance argument for probabilism is a dominance (not expected-accuracy)
  argument precisely to avoid the reference-class problem. So a crux: is dominance
