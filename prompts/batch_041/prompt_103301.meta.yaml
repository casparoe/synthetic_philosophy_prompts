  "For the past few months I''ve been sitting in on a reading group run by two friends
  of mine, both of whom did graduate work in philosophy (I''m a software engineer
  and have no formal training in it). Last week the session was on Pascal, and specifically
  on the fragments about justice and force, and the two of them got into an argument
  that they never resolved. I''d like you to adjudicate it move by move..."


  Then lay out the dispute:


  Setup: Pascal''s claims (paraphrase): (a) justice without force is powerless; force
  without justice is tyranny; (b) we cannot make justice strong, so we made force
  just — i.e., might and right were made to coincide; (c) the foundation of law''s
  authority is custom, which is itself arbitrary; (d) it is dangerous to tell the
  people that the laws are not just, because they obey only insofar as they believe
  them just; (e) whoever traces the authority of custom back to its source destroys
  it.


  Then move 1: one person (A) says Pascal is a cynic: he thinks "just" is just a label
  power puts on its own decrees, and that law''s authority is a fiction sustained
  by custom; so Pascal is a proto-Thrasymachus / legal positivist who thinks there''s
  no such thing as justice independent of power.


  Move 2: B says no, Pascal is a realist about the human condition, not a denier of
  justice: he distinguishes what justice would require from what can be enforced,
  and his point is that a justice that cannot be enforced is powerless — the failure
  is in us, not in the concept; Pascal''s "we made force just" is a lament, not an
  analysis of what justice is.


  Move 3: A: but if the maxims of justice change with climate and custom, and we''re
  told not to probe the foundation of authority, then Pascal is committed to saying
  that whatever a society''s custom is, that''s justice for them; and then the word
  "justice" adds nothing to "the established."


  Move 4: B: that conflates two questions — the *grounds of obligation* (why do I
  obey?) and the *content of justice* (what should be obeyed?). Pascal''s point about
  custom is about the first; he can be a skeptic about the foundations of authority
  while still holding that some laws are unjust. And the "don''t probe" remark is
  about prudence, not metaphysics.


  Move 5: A: then Pascal is inconsistent, because he also says it''s dangerous for
  the people to know the laws aren''t just — that only makes sense if he thinks the
  belief in justice is doing the work of enforcement; so his view is that justice
  is a useful illusion, i.e., the cynical reading after all.


  Move 6: B: not so — Pascal''s remark is about what happens when a *necessary* belief
  is destroyed in people who can''t replace it with the right one (obeying the law
  *as* law); the "clever" person obeys for the right reason, and Pascal''s aim is
  to move you from the deluded reason to the correct one, not to abolish obedience.


  Then inject the modern case: A brings up a concrete example: a law that is on the
  books but never enforced (say, a ban on jaywalking in a city where it''s universally
  ignored, or a company''s written policy that everyone ignores while an unwritten
  norm governs), and says Pascal''s account implies it has ceased to be law; B says
  it''s still law and the obligation doesn''t vanish with enforcement.


