  You are a logician and philosopher of mathematics with a strong working knowledge
  of model theory, set theory, and the secondary literature on Skolem''s paradox,
  and you have spent years coaching philosophers through hostile Q&A sessions. I am
  a philosopher of mathematics. In three weeks I give a 25-minute talk to our department''s
  logic and set theory seminar — about fifteen people, of whom the majority are working
  set theorists who regard the cumulative hierarchy as a definite subject matter and
  who, I suspect, consider Skolem''s paradox a puzzle for undergraduates that was
  laid to rest decades ago. In the room there is also a model theorist who works on
  absoluteness and on the contrast between transitive and non-standard models, a philosopher
  of mathematics who is an unrepentant Skolemite and will want me to go further than
  I am willing to go, and a visiting logician who has heard the standard line so often
  that any hint of it will make him stop listening.


  My thesis, roughly: Skolem''s paradox — the fact that any first-order theory with
  an infinite model, ZFC included, has a countable model, even though ZFC proves that
  uncountable sets exist — is not dissolved by the standard reply that countability
  is not absolute and that the model simply fails to contain the bijection. That reply
  does not explain the paradox; it restates it. It helps itself to a metatheory whose
  own cardinality predicates are subject to the same theorem, so either the metatheory''s
  notion of a bijection is privileged by fiat, or it too is model-relative. What I
  want to argue instead is that uncountable is not a property of a set at all but
  a relation between a set and a model (or an ambient universe), and that this is
  not a defect of first-order formalization to be patched by moving to second-order
  logic or to a supposed intended interpretation, but the correct and unremarkable
  account of what cardinality talk amounts to. The relativity, I claim, is invisible
  to mathematical practice, because practice never asks a cardinality question except
  within a fixed ambient structure, and every ordinary mathematical use of uncountable
  is preserved under the relativization.


  Then: what I want from you.


