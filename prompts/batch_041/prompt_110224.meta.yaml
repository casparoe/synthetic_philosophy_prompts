  on the model of interpreting a text or a fictional narrative, and by constructing
  from them a heterophenomenological world — a third-person inventory of what the
  subject says is going on in their experience.

  - The method is officially neutral about whether anything in that world is real:
  it brackets the question of whether the subject''s beliefs about their experience
  are true, and it is meant to be neutral even about whether the subject is conscious
  at all.

  - The subject''s reports are treated as authoritative only in a deflationary sense:
  they fix what the subject believes about their experience, not what their experience
  is.


  And here is the puzzle I want the question to turn on. Dennett''s own use of the
  method in the temporal-order debates (the case where the same set of reports can
  be explained either by the brain''s first registering an event and then revising
  the record, or by the brain''s delaying the record in the first place) is presented
  as a case in which the method shows that there is no fact of the matter to be discovered.
  I want students to see that this move is available only if one already accepts something
  the method is supposed to leave open, and to see what follows for the method''s
  claim to be the method for the science of consciousness.


