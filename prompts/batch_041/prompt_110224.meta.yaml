  ---


  I am setting the final paper for a final-year undergraduate and taught-Master''s
  module in philosophy of mind and cognitive science. The paper is closed-book and
  lasts ninety minutes, and candidates are not expected to supply titles, dates or
  citations — I would rather they argued than footnoted. I need one essay question
  on heterophenomenology as a method for the science of consciousness, together with
  a model answer and a marking scheme.


  The question must not be answerable by reciting the method, so let me say what the
  students will already have and what I want the question to do with it.


  What they will have:


  - Heterophenomenology is the third-person method of treating a subject''s utterances
  as data — as a text to be interpreted — and building from them, together with everything
  else known about the subject''s brain, body and environment, a heterophenomenological
  world: an inventory of what the subject says is going on in their experience.

  - Its central discipline is bracketing. The subject is treated as authoritative
  about how things seem, and about nothing else. The method is officially neutral
  as to whether anything in the heterophenomenological world is real, and neutral
  even as to whether the subject is conscious at all.

  - The method is offered as the whole of the data for a theory of consciousness:
  for every phenomenological question about why a subject experiences X, there is
  a corresponding question about why the subject says they experience X, and the second
  is supposed to be the scientific one.

  - In the temporal-order cases — the colour-phi illusion is the standard example
  — the same behavioural and report data can be explained either by the brain''s registering
  a content and later revising the record of it, or by the brain''s holding the content
  back until a later, already-reconciled version is available. (In the literature
  these are the Orwellian and the Stalinesque readings.) The two readings agree on
  the neural story and differ only on where the experience is supposed to begin. The
  method is said to show that there is no fact of the matter between them.


  What I want the question to do: make candidates see that this verdict cannot be
  derived from the method''s neutrality, but only from a further and much stronger
  premise, and then make them decide what that does to the method''s claim to be the
  method for the science of consciousness.


  So the question should have four parts:


