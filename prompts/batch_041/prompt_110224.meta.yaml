  no fact of the matter, in which case it has issued a substantive metaphysical verdict
  and is not neutral after all, or it concedes that there is a fact of the matter
  that the method cannot reach, in which case it is not a method for the science of
  consciousness but at best a method for the science of beliefs about consciousness.

  3. Say which horn the method''s defenders should take, and defend the choice against
