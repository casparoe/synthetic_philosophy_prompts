  the same effects across time and space, that memory and testimony are generally
  reliable, that the external world does not radically change when unobserved, and
  that a proposition cannot be both true and false. The petitioners argue that these
  are not neutral methodological rules but substantive metaphysical commitments, and
  that requiring assent to them burdens their religious exercise. The module''s defenders
  respond that without such commitments no inquiry at all is possible, and that the
  university may require them as conditions of a common intellectual practice. A third
  group on the committee wants a compromise: exempt students from affirming the propositions
  but require them to study how those propositions function in scientific practice.


  Our committee''s working paper, which I attach in summary, draws a distinction that
  I would like you to use. It distinguishes Constitutive Hinges from Denominational
  Hinges. Constitutive Hinges are propositions that are not themselves the object
  of ongoing inquiry but that make a practice possible; to doubt them globally is
  to cease to participate in the practice, not to raise a live hypothesis within it.
  Denominational Hinges are propositions that a particular community treats as certain
  and that structure its identity, but that are not required for the practice in question
  and could be denied without making the practice incoherent. The working paper also
  distinguishes between exempting a student from affirming a hinge and exempting a
