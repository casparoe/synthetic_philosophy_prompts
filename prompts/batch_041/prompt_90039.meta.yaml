  Dependency order (the spine):

  (a) What a formal system is, and what "the mind is a machine" means (a recursively
  axiomatized, consistent system whose theorems are what the mind can prove). — must
  come first, since all misconceptions 2 hinge here.

  (b) G1 stated carefully: if S is consistent and effectively axiomatized, there''s
  a sentence G_S such that S doesn''t prove G_S and S doesn''t prove ¬G_S; and G_S
  is true (given soundness/consistency).

  (c) The step from "S doesn''t prove G_S" to "G_S is true" — needs soundness, not
  just consistency (for the "true" claim; Rosser gives independence from consistency
  alone but not truth).

  (d) G2: S can''t prove Con(S) if consistent.

  (e) The anti-mechanist''s premise: the mind can know the soundness of any system
  it can grasp (this is the load-bearing, contestable premise) — and hence see G_S.

  (f) The trilemma: if the mind is a machine M, it can''t know Con(M) (G2), so either
  it isn''t M, or it''s unsound/inconsistent. And the mechanist''s escape: the mind
  is a sequence of systems, or a non-recursive machine, or an inconsistent one — none
  of which the theorem rules out.

  (g) The idealized-vs-actual-mathematician distinction.

  So the order matters because (c) depends on distinguishing consistency from soundness,
  and (e) is where the whole argument lives.


  Also, one more "in the weeds" injection: the distinction between "the mind can know
