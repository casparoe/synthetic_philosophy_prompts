  Standard anti-mechanist argument (Lucas): Suppose the mind is a machine M (a formal
  system). By G1, if M is consistent, there''s a sentence G_M true but unprovable
  in M. The mind can see G_M''s truth (given M''s consistency). So the mind can do
  something M cannot. Contradiction. Hence the mind isn''t a machine.


  Objection 1: the argument assumes the mind knows M''s consistency, which the mind
  can''t establish if it is M (by G2). Reply: but we do know our own consistency (we
  know we''re not contradicting ourselves)? Penrose''s version: we know the soundness
  of our own reasoning, hence we can see G_M. But if we were M, we couldn''t know
  M''s consistency (G2), so either we''re not M or we''re inconsistent. Penrose bites
  the bullet differently: he argues our soundness is knowable and so the mind isn''t
  a machine; and he uses the "we can see the soundness of any formal system we can
  grasp" premise.


  Objection 2: The mind might correspond not to a single formal system but to an open-ended
  sequence of systems (each extending the previous). Then no single G applies. (Feferman,
  "Penrose''s Gödelian argument", 1995 — real.)


  Objection 3: The argument conflates "the idealized mathematician" with actual human
  reasoners, who are unsound in practice.


  Objection 4: The "we can see G_M is true" step requires knowing M is consistent,
  which requires more than M can give; but a *human* can be told M is consistent and
  then see G_M — but then the human is using a stronger system M'' = M + Con(M), and
  M'' has its own G. No contradiction with mechanism unless the human can iterate
  through all systems — which is what "the human knows the soundness of every system
  it can grasp" claims. And then the question: can a machine do that? A machine could
  be *non-recursive* (e.g., a machine with an oracle, or a machine that is a "trial-and-error"
  machine, or one that outputs an infinite sequence of theories). Gödel''s theorem
  only rules out a single recursively axiomatized consistent system capturing all
  arithmetic truths. So the anti-mechanist needs more. Also: a machine could be *inconsistent*
  (then it proves everything, so it "proves" G_M, but also everything else — the "inconsistent
  machine" horn). So the trilemma: not a machine, or an inconsistent machine, or a
  machine that can''t know its own consistency. That''s the spine.


