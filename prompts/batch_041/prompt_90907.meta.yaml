  fertility clinic, a hospital, a university, or a workplace—and it should involve
  a decision that a single person has to make under uncertainty, not merely a credence
  question. The uncertainty should concern how many people (or how many observer-moments)
  exist in some relevant population, and the person''s evidence should be the kind
  of indexical evidence that gives rise to the anthropic puzzle: she knows she is
  one of the people in that population, but she does not know how many others there
  are. The case must be such that a self-sampling reasoner and a self-indication reasoner
  reach different practical recommendations, and the difference must come from the
  anthropic assumptions rather than from different priors or different values. No
  cosmology, no doomsday arguments, no infinite universes, no amnesia, no duplication
  of persons, and no exotic physics; if you need a modest technological or institutional
  stipulation, keep it mundane and clearly flagged. After the scenario, do the following:
  (1) state the two hypotheses about population size and the agent''s evidence; (2)
