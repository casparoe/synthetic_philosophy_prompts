  Scenario: At my building''s tenants'' meeting (or at Thanksgiving dinner), my brother
  (an economics grad student) and my neighbor (who runs the tenants'' association,
  and who has been reading about the ethics of property) got into it. The asker reports
  four or five rounds.


  Moves:

  1. Brother: A binding cap below the market-clearing rent creates a shortage; landlords
  convert to condos, stop maintaining, cut the housing stock over time. Since the
  ordinance covers only some buildings, new construction is exempt... (this is a real
  design feature, fine but maybe too specific). Keep it: "he said a ceiling below
  the market-clearing price predictably produces a shortage and quality decay; that''s
  not an ideology, it''s the shape of the supply curve."

  2. Neighbor: That reasoning treats the current rent as the market outcome of a competitive
  market. But the housing stock is fixed in the short run, the land under it is fixed
  forever, and in my neighborhood a handful of landlords own most of the buildings;
  the "market rent" is a posted price set by whoever owns the building you happen
  to be able to move into. So the model''s prediction is a prediction about a market
  we don''t have. And second: even if a cap costs some total surplus, it transfers
  far more than it destroys — the tenants gaining are poorer than the landlords losing.
  If the objection is only about the size of the pie, it''s not an objection.

  3. Brother: Fine — then call it what it is: a transfer from landlords to tenants,
  not a fix for a shortage. And if redistribution is the goal, rent control is a bad
  tool: it''s targeted by accident (it helps whoever already has a lease, including
  well-off longtime tenants, and does nothing for the people who can''t get in, who
  may be the worse off). Cash transfers would do the same work with less damage. The
  only way to defend the cap is to say that housing isn''t a commodity, that being
  able to stay put is a good of a different kind than the money it costs — and if
  you say that, you owe me a story about why that good is worth the supply losses.

  4. Neighbor: Two things. First, the "cash transfers would be better" move is a fantasy
  of a legislature we don''t have — the same majority that won''t fund transfers won''t
  fund them now, and the cap is what''s actually available. Second, the rights story
  isn''t a dodge: a home isn''t a widget, and a tenant''s interest in staying is not
  just a preference with a price. Also, calling the "market rent" the neutral baseline
  is doing exactly the work you accused me of: the current distribution of ownership
  is itself the product of law (zoning, tax treatment, mortgage subsidies), so "interference"
  is a word about which set of rules you''re used to.

  5. Brother: Then you''ve conceded the economics and moved to politics — fine, but
  then the question is empirical: does the ordinance actually keep people housed,
  or does it slowly shrink the stock and let the shortage do the sorting? And you
  can''t answer that by saying the landlord''s title is legally constructed; that''s
  true of every property regime and doesn''t tell us which one to have.


  Then ask for a point-by-point verdict: which moves are sound, which are confused,
  what each is missing, and who''s more right overall.


