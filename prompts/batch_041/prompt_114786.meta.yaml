  Aesthetic testimony: the puzzle is that testimony seems to transmit knowledge of
  many things (science, history, geography) but for aesthetic value, we''re reluctant:
  "You can''t know that the quartet is beautiful just because I tell you; you have
  to hear it." The acquaintance principle (Wollheim, "Art and Its Objects"): "A judgment
  of taste is not based on testimony" — hmm, actual formulation: "One cannot judge
  a work of art unless one has experienced it." Also Kant''s claim that judgments
  of beauty are "subjective" yet "universal" — the "universal voice."


  Desiderata for a theory of aesthetic testimony:

  1. Explain the asymmetry: why do we accept testimony about, say, a painting''s date,
  provenance, being a forgery, being technically skilled, but not about its beauty?
  (Need to respect the fact that some art judgments — e.g., "this is a Matisse," "this
  movement is a sestina," "this piece uses the whole-tone scale" — are fully testimonial.)

  2. Handle the "novice and the expert" case: it seems rational for a novice to defer
  to an expert critic about a movie she hasn''t seen, at least to form a belief about
  how good it is — and yet something is missing (she can''t appreciate it).

  3. The case of the aesthetic expert who has a well-earned general theory: "anything
  by X will be worth my time" — that seems testimonial and rational.

  4. The case of moral testimony (parallel puzzle) — must respect or explain the analogy/difference.

  5. The case of non-evaluative appreciation judgments: "this is graceful," "this
  is moving" — do those travel by testimony?

  6. Must explain why we do in fact act on aesthetic testimony all the time (we go
  to movies on friends'' recommendations) — so the theory can''t be "aesthetic testimony
  is worthless"; the phenomenon is the asymmetry between belief/knowledge and appreciation/reason,
  or between justification and value.

  7. Must not collapse into general skepticism about testimony.

  8. Must handle disagreement: two experts disagree; what does testimony do then?

  9. Must explain the "you had to be there" phenomenon and its limits.

  10. Must respect that aesthetic judgment is not purely arbitrary — otherwise no
  critic is ever wrong.

  11. Distinguish between the claim that testimony can''t give you a reason to believe
  and the claim that it can''t give you an *appreciative understanding* — the requirement
  to keep these apart is itself a desideratum.


