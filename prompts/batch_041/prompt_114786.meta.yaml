  I am a novelist, and my current book has reached the point where the scenes are
  written but the assumptions beneath them are not. The book turns on a question my
  craft cannot settle: whether one person can be brought to see that something is
  beautiful by another person''s word alone. One character is told, weeks in advance,
  that a particular recording will undo her, and it does; another reads a score at
  the piano and is moved before she has heard a note; a third buys a canvas on a dealer''s
  description and only later looks at it properly; a fourth has the twist of a novel
  spoiled for her and finds, to her surprise, that the spoiling deepens the thing.
  Every one of these scenes is only as honest as my unexamined assumptions about what
  testimony can transmit in the aesthetic case, so I would like the specification
  first, before I commit.


  Write the desiderata for a theory of aesthetic testimony — of what passes from one
  person to another when one says that something is beautiful, or moving, or worth
  your evening. What must any adequate account deliver? Give me the phenomena it has
  to explain, the cases it has to get right, the distinctions it must not collapse,
  and the results it must remain consistent with; with each requirement, name the
  case or consideration that puts it on the list. My purpose is not philosophical
  tidiness but a standard I can write by: the theory has to tell me when a character
  may honestly be moved by a report, when her deference to a better ear is rational
  rather than cowardly, and when she is only pretending to have seen for herself.


