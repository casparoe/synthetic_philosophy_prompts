  Standard setup: A dispositional property D (e.g., fragility) is ascribed via a conditional:
  x is fragile iff (roughly) if x were struck with sufficient force, x would break.
  Finkish dispositions (Martin 1994; also Johnston 1992 for "finkish" in the context
  of value response-dependence): a case where the disposition is present, but if the
  trigger were to occur, the disposition would be removed before the manifestation
  could occur (e.g., a glass that is fragile now, but a sorcerer''s spell would make
  it non-fragile the moment it was struck, so the conditional "if struck, it would
  break" is false even though it''s fragile — hence the simple conditional analysis
  fails in the "finkish" direction: disposition present, conditional false). Also
  reverse fink: the disposition is absent but the conditional is true (e.g., a glass
  that is not fragile but a spell would make it fragile the moment it was struck,
  so "if struck, it would break" is true while the glass isn''t fragile). Masks (Johnston
  1992): something interferes with the manifestation without removing the disposition
  — e.g., a fragile glass wrapped in packing material that wouldn''t break if struck;
  the disposition is still present, but the conditional is false. Wait — actually
  masking is precisely the case that''s like the reverse: the disposition is present
  but the conditional is false because the manifestation is blocked. So both finkish
  and masked cases are counterexamples to the simple conditional analysis in the same
  direction (disposition present, conditional false)? The difference: in masking,
  the disposition remains, and the blocking factor is an external "mask" that prevents
  the manifestation; in finking, the disposition itself is removed (or the intrinsic
  causal basis is altered) by the very circumstances. The distinction matters for
  the analysis: you can handle masking by adding "other things being equal" clauses
  (ceteris paribus) — because the mask blocks the manifestation while leaving the
  disposition intact, so the conditional with an "unless prevented" clause can still
  hold. But finkish cases resist this, because the disposition''s presence and the
  trigger''s presence don''t guarantee manifestation even when nothing "external"
  interferes — the disposition itself is lost. Hmm, actually many argue finkish cases
  also can be handled by elaborating. But the standard contrast is: masks = interfering
  factors external to the disposition''s causal basis; finks = the circumstances alter
  the disposition itself (its basis) before manifestation. So the difference between
  masking and finking is where the interference operates — on the disposition''s basis
  (fink) or downstream of it (mask). Good, that''s the crux and it''s a genuine subtle
  point.


