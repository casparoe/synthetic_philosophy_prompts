  The absent-minded driver problem (Piccione & Rubinstein 1997): Driver at first intersection;
  going straight leads to a second intersection where he must decide again; he doesn''t
  remember whether he''s at the first or second. Payoffs: continuing at first is good,
  continuing at second is bad, exiting at first is mediocre, exiting at second is
  best. The twist: the ex ante optimal strategy (maximizing expected utility from
  the start) is to randomize (e.g., continue with probability 2/3 at each node), but
  this mixed strategy, evaluated at the node, requires you to take an action that
  at that node is not optimal given your information — so it looks "irrational" at
  the node. This generates the paradox: the strategy that maximizes ex ante expected
  utility is not sequentially rational in the sense of being optimal at each decision
  node given the information there. Related: Aumann, Hart & Perry "The Absent-Minded
  Driver."


