  whether ''better than'' is transitive — specifically the spectrum arguments, where
  a series of small, seemingly uncontroversial comparisons (A is better than B, B
  better than C, ..., Y better than Z) seems to lead from a clearly better item to
  a clearly worse one without any single step that looks like the culprit. I want
  you to restate the main positions in that debate in my vocabulary, as faithfully
