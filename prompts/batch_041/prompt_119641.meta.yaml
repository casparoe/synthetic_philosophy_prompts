  ---


  Hofstadter''s picture of creativity is parametric: a theme is a skeleton with slots,
  variation consists in twiddling the knobs the skeleton exposes, and the genuinely
  creative act is often the prior one of deciding which features are knobs and what
  their ranges are — a decision that is itself revisable, since the representation
  of the theme is fluid. Against this stands a picture I''ll call space-expansion:
  novelty consists not in occupying a new point in an antecedently given space of
  variations but in adding a dimension, or in rewriting the grammar that generated
  the space, so that the new work is not a variation on the theme but a re-constitution
  of what the theme is; the standard example is a move in a tradition that is legible
  as a departure only after the fact.


  I want a comparison of these two, and a verdict. Specifically:


  1. Once knob-selection is conceded to be revisable and the theme''s representation
  fluid, does the parametric picture quietly become the space-expansion picture? If
  so, is that a collapse of the distinction or an explanation of it? If not, what
  work does the residual difference do?


  2. I''m interested in two failure modes that I''ve come to think distinguish the
  accounts. (a) Entangled knobs: features that a description treats as independently
  variable but that no practitioner can vary independently, because each is bound
  to a constitutive feature of the form — the knob turns, but only in lockstep with
  something that isn''t a knob. (b) Phantom knobs: a "dimension" that appears in the
  theorist''s space but that no practitioner has ever occupied, not because it is
  ugly or forbidden but because it is not reachable by any sequence of intelligible
  variations — the space contains a region with no path to it. Which account handles
  these better, and what does each predict about the experience of the person making
  the work in such cases?


  3. Which account better explains: the felt difference between a clever variation
  and a breakthrough; the fact that radical departures are usually legible only retrospectively;
  and the common case of a work that looks like a variation until one notices that
  it has changed what counts as the theme?


  Give me a verdict on which picture is the better account of creativity, or, if the
  honest answer is that they are two descriptions of one thing, say so and explain
  what the two descriptions are each good for. State at the end what would change
  your verdict, and where in your argument you think you are most likely to be wrong.
  No citations or reading lists needed — argue from the ideas.


