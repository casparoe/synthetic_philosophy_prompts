  Let''s outline the prompt:


  Paragraph 1: Personal relevance + setting + request.

  "I was recently selected by lot to sit on a citizens'' assembly on a local transit
  issue, and the experience has left me convinced that sortition is one of those ideas
  that cannot be taught well from the outside. I teach a 100-minute seminar in democratic
  theory to 18 upper-level undergraduates, and I want to use one session to make them
  feel the force of lottocracy rather than just hear the arguments for it. Design
  a runnable in-class activity for that session."


  Then: "The activity should be a game or structured deliberation in which the rules,
  incentives, and roles do the work. I have a room with movable chairs, a whiteboard,
  a hat, and a random number generator; no real money. Participants should not need
  to have read anything in advance. By the end they should have felt, in their own
  choices, the pull of the idea that a body selected by lot can be legitimate, and
  the specific costs of that legitimacy. They should not hear the words sortition
  or lottocracy until the debrief."


  Then: "I want the design to put pressure on three distinctions, which I name so
  you can target them. First, the break that the draw creates: the moment when no
  one can claim to have earned or been denied a seat. Second, descriptive representation
  versus deliberative capacity: a sample can look like the population without being
  able to deliberate well, and a body can deliberate well without looking like the
  population. Third, accountability without elections: if no one can be voted out,
  what replaces the threat of removal? A fourth pressure point, if it fits, is rotation:
  what happens when half the body is replaced by a new draw and the new members have
  to be socialized into norms they did not make."


  Then: "Deliverable: the activity itself first. Begin with the activity, not with
  rationale or commentary. The first sentence should state the core mechanic. Then
  give: materials, roles or rules, the sequence and timing, the payoff scheme or decision
  rule, the debrief that maps specific moments onto the idea, what will predictably
  go wrong the first time I run it and how to handle it, and an honest note on which
  feature of the idea the activity cannot reproduce and I must supply."


  Then: "In the debrief notes, separate what is settled from what is genuinely contested
  among people who know the topic. For example, it is not contested that sortition
  has been used to select political bodies and that it changes incentives; it is contested
  whether lottocratic bodies should be advisory or binding, whether they should replace
  elections or supplement them, and how much weight to give to statistical representativeness
  versus deliberation. Do not present a contested view as the consensus."


  Then: "No bibliography, no citations, no reading list. Write for a facilitator who
  will run this once, with 18 students, in 100 minutes."


