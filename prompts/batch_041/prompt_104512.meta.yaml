  Now the philosophical content: William James, "The Will to Believe" (1896) — defends
  the right to believe in matters that are live, forced, and momentous options where
  evidence can''t decide, and where believing is itself part of the conditions for
  the truth coming about (the Alpine climber example, the friendship case). W.K. Clifford,
  "The Ethics of Belief" (1877) — "It is wrong always, everywhere, and for anyone,
