  I am preparing a long-form interview for a small podcast on self-reference and cognition.
  My guest is a philosopher of cognitive science who defends what she calls the inviolate-level
  thesis: roughly, that any system able to represent its own representational states
  must contain at least one level of description that is causally efficacious in producing
  those states but is never itself represented within the system. She takes the two
  hands in Escher''s Drawing Hands as an intuitive illustration, but I want the conversation
  to be about the thesis rather than about Escher or Gödel''s theorems in general.


  I have been trying to think of a case that I have not seen discussed in this connection,
  and I would like the interview to use it as a running example. Imagine a compiler
  that can rewrite its own source code, including the module that decides which rewrites
  to perform. On the face of it, the system represents and modifies the very rules
  that govern its own self-modification, so it looks like a system with no inviolate
  level. But one might reply that the inviolate level has simply moved one meta-level
  up, to whatever fixed semantics allows the rewriting language to be interpreted.
  I want questions that press her on whether the inviolate-level thesis is a conceptual
  necessity or merely an engineering contingency, and that make her say what would
  count as a genuine counterexample.


