  Prompt:


  I am a PhD candidate in political theory, currently on a placement with the policy
  planning staff of a foreign ministry. My desk receives proposals for humanitarian
  intervention and regime change at a rate of roughly two or three a quarter, usually
  under time pressure and with incomplete intelligence; the recommendations we produce
  go to the minister and, in some cases, shape a decision that cannot be reversed
  once forces are committed. I have been trying to develop a decision procedure that
  a generalist analyst, not a just war theorist, could run in a few hours on a new
  proposal. I am calling it the burden-shifting screen, though the name is not important.
  Its core commitments are these: (1) it treats the population the intervention is
  meant to protect and the population that will bear its collateral risks as two separate
  ledgers, and it does not allow gains on one ledger to cancel losses on the other
  without a separate, named authorization; (2) it requires a counterfactual baseline,
  comparing the no-intervention trajectory with the intervention trajectory over a
  fixed horizon, and it stops if the intervention is not superior at the lower bound
  of the uncertainty range; (3) it imposes a higher threshold and a named exit authority
  on any intervention that creates facts on the ground not reversible within five
  years, including regime change, partition, and long-term occupation; (4) it requires
  a last-resort test that names a specific, time-stamped diplomatic offer or path
  that has been rejected or is unavailable, rather than a general claim that diplomacy
  has been tried; (5) it requires a proper-authority test that distinguishes UN Security
  Council authorization, regional authorization, coalition authorization, and unilateral
  action, and says what the procedure does when authorization is contested; and (6)
  it requires a post-intervention accountability test naming who will be responsible
  for reconstruction, transitional justice, and withdrawal, with the procedure stopping
  if no actor is named.


  I want you to turn this into a procedure my desk can actually run. Give me the questions
  to ask in order, what counts as a sufficient answer to each, where the procedure
  stops with a no, where it hands the decision to a person because the question is
  one of values rather than facts, and where it will misfire or be gamed. It has to
  be usable by someone with a generalist background, in a few hours, with no ability
  to commission new research. It should be honest about which steps are judgment calls
  dressed up as procedure. Then run it on three cases: the 1999 Kosovo intervention,
  the 2003 Iraq invasion, and the 2011 Libya intervention. For each, say what the
  procedure returns, what facts it needs that are contested or missing, and whether
  the return depends on hindsight. I am personally inclined to think the procedure
  should license Kosovo and block Iraq; if it blocks Kosovo or licenses Iraq, I need
  to see that clearly rather than have it softened. I am less sure about Libya, and
  I suspect that is the case where the procedure will either do real work or reveal
  its limits. Finally, tell me what the procedure cannot do, and which of the six
  commitments above is doing the most work and which is mostly decoration.


