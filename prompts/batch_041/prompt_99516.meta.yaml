  Draft:


  You are grading a take-home examination for an undergraduate course on historical
  method. The question and a student''s answer are below. I need a grade and a point-by-point
  justification. Do not assume the student is simply wrong or simply right; assess
  what the answer gets right, what it gets wrong, and how serious the errors are.


  Question: A historian proposes to write an account of a nineteenth-century industrial
  strike using only the company''s payroll ledgers, police arrest records, and contemporaneous
  newspaper reports, deliberately excluding oral histories and union pamphlets. The
  historian claims that this method is objective because it relies on hard documentary
  evidence and avoids partisan narratives. Drawing on Ranke, Carr, and Hayden White,
  assess whether this claim to objectivity is defensible. In your answer, distinguish
  (a) the selection of sources, (b) the interpretation of evidence, and (c) the narrative
  form of the resulting history.


  Student answer:

  Ranke''s ideal was to show the past as it actually was, which means the historian
  should let the documents speak for themselves. The historian''s proposal follows
  Ranke by preferring official records, since these are less likely to be distorted
  by partisan feeling. Carr, however, argued that facts do not speak for themselves;
  they become historical facts only when a historian selects them for a purpose. So
  the proposal cannot be objective in the naive sense, because the choice to exclude
  union pamphlets already reflects a present-day judgment about what counts as evidence.
  White goes further: he holds that historians necessarily impose a literary plot
  on the past, and therefore no historical account can be true or false. This means
  the historian''s claim to objectivity is not just mistaken but impossible. The best
  response is to recognize that the historian''s account is one interpretation among
  others, and that its exclusion of workers'' voices is a political act rather than
  a neutral methodological choice. Still, the historian is right that official records
  can correct romanticized accounts, so the account may be useful even if not objective.


