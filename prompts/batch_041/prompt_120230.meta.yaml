  This has several subtle errors:

  1. "Pascal thinks that justice is just whatever the established laws say it is"
  — this is close to his claim that justice is what is established, but he doesn''t
  think that''s the whole story; he thinks there''s a true justice (divine) that human
  laws fall short of. The professor''s summary presents it as Pascal''s definition
  of justice, not just his account of human legal justice.

  2. "from this he concludes that the only real justice is the justice that has force
  behind it—so might makes right" — this conflates a descriptive observation (we cannot
  make justice strong, so we make force just) with a normative endorsement. Pascal
  is not saying might makes right; he''s saying that in the absence of true justice,
  force and custom take its place. He laments this.

  3. "He says we should never question the laws because they are established" — Pascal
  does say that established laws should be obeyed, but he also says the wise can examine
  them and see their foundation in custom; he just doesn''t want the people to do
  so. So "never" is an overstatement; it''s a two-tier view.

  4. "he thinks this is a cynical, amoral position: there''s no such thing as real
  justice" — Pascal is not amoral; he''s a Christian apologist who believes in divine
  justice. His point is that human justice is a makeshift, not that justice is an
  illusion.

  5. "he recommends keeping the people ignorant and using religion to make them obey"
  — Pascal does think the people''s belief in the justice of laws is necessary for
  social order, and he thinks religion helps them obey, but "keeping them ignorant"
  is a bit strong; he thinks the wise should not reveal the truth to the people, but
  he also thinks the people''s belief is not entirely false because laws are just
  in virtue of being established. Also, Pascal''s views on religion are more complex:
  he thinks religion is true, not just a tool for social control.

  6. "he''s basically a Hobbesian: justice is whatever the sovereign commands" — Pascal
  is not a Hobbesian. Hobbes grounds justice in the sovereign''s command via social
  contract; Pascal grounds it in custom and establishment, and he has a transcendent
  standard of justice. Also, Pascal is not a social contract theorist. The comparison
  to Hobbes is misleading.


