  tyranny with simple injustice.


  Also, the summary might say Pascal thinks we should never question laws because
  they are established—this is true in a sense, but Pascal also says that the wise
  should examine them and see that they are founded on custom, but not tell the people.
  So it''s not that he thinks no one should question them; he thinks the people shouldn''t,
  but the wise can, in private. The summary might overstate the anti-examination stance.


  Also, the summary might present Pascal as a relativist: "justice is whatever the
