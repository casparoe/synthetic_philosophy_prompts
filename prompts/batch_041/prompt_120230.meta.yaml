  that justice is just whatever the established laws say it is. He says justice without
  force is powerless and force without justice is tyrannical, and from this he concludes
  that the only real justice is the justice that has force behind it—so might makes
  right. He says we should never question the laws because they are established, and
  he thinks this is a cynical, amoral position: there''s no such thing as real justice,
  only custom and power. He also thinks the people are right to think laws are just,
