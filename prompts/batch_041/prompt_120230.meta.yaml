  "Pascal thinks justice is just whatever the established laws say it is, and that''s
  the whole story. He says justice without force is powerless and force without justice
  is tyrannical, so he concludes that the only real justice is the justice backed
  by force—might makes right. He says we should never question the laws because they
  are established, and he thinks this is a cynical, amoral position: there''s no such
  thing as real justice, only custom and power. He also thinks the people are right
