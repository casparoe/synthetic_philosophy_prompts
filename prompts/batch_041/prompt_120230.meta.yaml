  This has several subtle misrepresentations:

  - Conflating "justice is what is established" (a claim about the human epistemic
  situation and the foundation of law) with "might makes right" (a normative endorsement
  of power).

  - Presenting Pascal''s resignation to the fact that justice cannot be made strong
  as a cynical endorsement.

  - The claim that Pascal thinks there''s no such thing as real justice: he does believe
  in true justice (divine justice), but thinks it''s not available in the fallen world;
  human justice is a makeshift.

  - The idea that Pascal recommends keeping the people ignorant: he does say that
  the people''s opinion should be maintained, but it''s not exactly "keeping them
  ignorant" in a simple Machiavellian sense; he thinks the wise should not reveal
  the foundation of custom to the people because it would undermine social order,
  but he also thinks the people''s belief in justice is a kind of necessary illusion.
  There''s a subtlety: Pascal is not a Hobbesian because he doesn''t think the sovereign''s
  command makes justice; he thinks custom is the basis of equity, but he also thinks
  there''s a higher justice (God''s) that human laws approximate only by convention.
  Also, Hobbes is a social contract theorist; Pascal is not.

  - The summary might say "Pascal says justice without force is powerless and force
  without justice is tyrannical, so he concludes that the only real justice is the
  justice backed by force"—this misses that Pascal''s point is that they must be joined,
  but because we can''t make justice strong, we make force just. That''s a descriptive
  claim about how societies actually function, not a normative endorsement.

  - Also, the summary might misattribute the "might makes right" to Pascal as his
  own view, when he''s describing the human condition.


  Another possible subtle error: Pascal''s famous distinction between "tyranny" as
