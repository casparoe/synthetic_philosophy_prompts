  Pascal''s views on justice and force (from Pensées, fragments like "Justice, force"
  section):


  - Justice without force is impotent; force without justice is tyrannical.

  - Justice without force is contradicted because there are always bad people; force
  without justice is accused.

  - So one must put justice and force together; what is just must be strong, or what
  is strong must be just.

  - Justice is subject to dispute; force is easily recognizable and indisputable.
  So one cannot give force to justice because force has contradicted justice, saying
  justice is unjust, and so on. Thus, not being able to make what is just strong,
  we have made what is strong just.

  - "Justice is what is established" — and thus all established laws must be obeyed
  without examination because they are established.

  - "Custom is the whole of equity for the sole reason that it is accepted." (paraphrase)

  - The people have a false opinion of justice; they think justice is what is customary.
  The powerful often call their own customs justice.

  - "Three degrees of latitude reverse all jurisprudence; a meridian decides the truth...
  laws have their epochs... the entry of Saturn into Leo marks the origin of such
  and such a crime." This is about the relativity of laws.

  - "Might makes right" is not exactly Pascal''s endorsement; he says we cannot make
  justice strong, so we made force just. He also distinguishes between tyranny: tyranny
  is wanting to have by one way what can only be had by another; e.g., force has its
  own empire, justice its own.

  - Pascal also says: "It is right to follow the customs of the country" and "the
  art of censuring and of overturning states is to overturn established customs, examining
  them to their source, to show their lack of authority and justice." He thinks this
  examination is dangerous and should be hidden; the people should be kept in ignorance
  of the true foundation of laws (which is custom, not justice), because if they knew,
  they would rebel. So there''s a political esotericism: the wise see that justice
  is custom, but the people must believe it is truly just.

