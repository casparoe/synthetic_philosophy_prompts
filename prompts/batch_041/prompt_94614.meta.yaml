  I have been trying to isolate a recurring move in discussions of whether a legendary
  narrative should be counted as history, and I cannot decide whether it already has
  a name or whether it is a distinct phenomenon that needs one. The move goes like
  this. A narrative is, by broad agreement, not a historical record: its central episodes
  are wondrous, its chronology is schematic, its characters are types, and its purpose
  is etiological or ideological. Then someone finds, or claims to find, a mundane
  substratum—a burned layer at a site, a local dynast behind a legendary king, a population
  movement behind a migration story. The substratum is not evidence for the central
  episodes; indeed, it is usually compatible with their being invented. But once it
  is in place, the whole narrative begins to be described as historical in outline,
  and those who deny its historicity are asked to explain away the substratum. The
  narrative has not been confirmed; it has been reclassified. I have been calling
  this kernel-washing, but I suspect that is not the right term. Is there an established
  concept for it—something in the vicinity of euhemerism, rationalization, or the
  distinction between a historical kernel and a historical narrative—and if so, what
  exactly does it pick out that those do not? If there is no established term, I would
  like a definition that distinguishes it from (a) ordinary source criticism that
  does infer a historical event from a later legend, (b) euhemerism proper, where
  the gods are reduced to deified humans, and (c) the legitimate claim that a legend
  may preserve a distorted memory of something. I am less interested in a label than
  in the carving: what is the minimal structure of the move, when is it a fallacy
  or a category error, and when is it actually sound? A couple of boundary cases would
  help, ideally ones that do not depend on disputed archaeology. I am not asking for
  a bibliography; I am asking for the conceptual anatomy.


