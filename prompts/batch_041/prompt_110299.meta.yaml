  From Piccione and Rubinstein (1997), "On the Interpretation of Decision Problems
  with Imperfect Recall", the absent-minded driver problem: A driver is driving home.
  There are two intersections. At each intersection, the driver can either exit or
  continue. If he exits at the first intersection, he gets 0. If he continues at the
  first and exits at the second, he gets 4. If he continues at both, he gets 1 (he
  ends up somewhere else, maybe a dead end). The driver cannot distinguish the intersections
  — he doesn''t know if he''s at the first or second. The optimal strategy (ex ante)
  is to exit with probability 1/3 at each intersection. Expected payoff = (1/3)*0
  + (2/3)*(1/3)*4 + (2/3)*(2/3)*1 = 0 + 8/9 + 4/9 = 12/9 = 4/3. Yes, 4/3.


  The paradox: At the intersection, if the driver considers the expected value of
  continuing vs exiting, given that he is at an intersection. If he is at the first
  intersection, continuing gives him a chance to reach the second and get 4. If he
  is at the second, continuing gives 1. His posterior probability of being at the
  first intersection, given that he is at an intersection and using the strategy p=1/3,
  is (1)/(1+1/3) = 3/4. So expected value of continuing = (3/4)*[ (1/3)*4 + (2/3)*1
  ]? Wait, if he''s at the first, continuing means he''ll go to the second. At the
  second, he''ll use the same strategy: exit with prob 1/3 (get 4), continue with
  prob 2/3 (get 1). So expected value from continuing at first = (1/3)*4 + (2/3)*1
  = 4/3 + 2/3 = 6/3 = 2. If he''s at the second, continuing gives 1. So overall expected
  value of continuing = (3/4)*2 + (1/4)*1 = 1.5 + 0.25 = 1.75. Exiting gives 0. So
  at the decision point, continuing seems better (1.75 > 0). But the optimal strategy
  says exit with prob 1/3. So there''s a conflict: the driver at the intersection
  should continue, but the optimal plan says sometimes exit. This is the paradox.


  Actually, the standard resolution involves distinguishing the ex ante optimal strategy
  from the ex post optimal action, and the fact that the driver''s decision at the
  intersection is not a choice between "exit" and "continue" but a choice of a strategy
  that will be applied at both intersections. If he re-optimizes at the intersection,
  he might change the strategy, but since he''s absent-minded, he can''t commit to
  a different strategy at the second intersection. So the optimal strategy is the
  one that maximizes ex ante expected utility, which is p=1/3.


