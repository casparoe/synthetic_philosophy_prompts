  I am an undergraduate in my third year, currently taking a course on decision theory
  and formal epistemology. One of our topics has been games whose expected values
  misbehave, and I have spent the last week constructing an argument that I now cannot
  decide whether to believe. It runs from a puzzle we did in class to a conclusion
  about ordinary life, and the conclusion seems far too strong. I would like you to
  tell me where it fails.


  The puzzle, which our instructor called the Pasadena game, is this. A fair coin
  is tossed until it first lands heads, on toss number n. If n is odd you win 2^n/n
  dollars; if n is even you lose 2^n/n dollars. Each outcome has probability 2^-n,
  so the expected value is the sum of the terms 2^n/n × 2^-n, that is, 1 - 1/2 + 1/3
  - 1/4 + ..., which converges to ln 2 only conditionally: the sum of the absolute
  values diverges, and because of that the order in which the terms are added changes
  the total — some orderings sum to any real number you like, and some fail to converge
  at all. Since the game''s payoff table is just a countable set of payoff-probability
  pairs and nothing in its description privileges one ordering over another, our instructor''s
  view was that the game has no well-defined expected value (a classmate held out
  for ln 2 as the value fixed by the order of the tosses; I do not need you to settle
  this, only to keep it in view).


  Here is my argument.


  (1) To be rational is to maximize expected value: an option is choiceworthy to the
  extent that the probability-weighted sum of the values of its outcomes is greater
  than that of the alternatives.

  (2) The Pasadena game has no well-defined expected value, for the reason just given.

  (3) Where an option''s expected value is undefined, expected-value maximization
  cannot rank it against anything. The theory licenses no verdict on whether to accept
  the game, decline it, or pay to be rid of it — and this is not a limitation of our
  information; the theory itself has nothing to say.

  (4) Nothing in (2) is special to coin games. Consider an ordinary choice: whether
  to spend an evening helping a neighbour repair a fence rather than finishing a paper.
  The consequences of either option are not a short list of mutually exclusive outcomes.
  They are a countable causal tree — the fence, the neighbour''s evening, his mood
  tomorrow, the people he is kind to next week, the paper, my students, the colleagues
  who hear about it, and so on — and the value of the action is the sum of the values
  of the tree''s nodes. Nothing privileges one enumeration of that tree over another;
  I can go by time, by causal path, or by person affected. Nor is the sum comfortably
  convergent: each further step in the tree is less likely, but it also touches more
  people, and the effects of helping can as easily be negative as positive (resentment,
  crowding out other helpers, the precedent of my being the one who always helps).
  So I get a series whose terms alternate in sign and whose absolute values need not
  fall fast enough to be summable.

  (5) So the value of the fence decision, like the value of the Pasadena game, depends
  on an ordering that nothing supplies, and expected-value maximization has no verdict
  about it.

  (6) Generalizing, expected-value maximization has no verdict about any choice whose
  consequences ramify. Most choices ramify.

  (7) A theory of choice with nothing to say about most choices is not a theory of
  choice. So expected-value maximization should be abandoned, or at least demoted
  to a fragment of a larger account.


  I am confident of (2) — I have done the series twice — and I do not want to give
  up (1), since without it I do not know what I would be doing when I deliberate.
  But I cannot accept (7), and I would rather not accept (5), which is what it takes
  to escape it. Which step should I reject? If the step looked plausible because of
  something true nearby, say what that was; and tell me what rejecting it costs —
  in particular, what becomes of the Pasadena game and of the fence, and whether any
  step that I keep in its place does the same work. If you think the argument is valid
  and I simply have to choose a premise to surrender, tell me which one is cheapest
  and what the price is.


