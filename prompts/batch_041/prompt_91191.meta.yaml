  Draft:


  (1) To be rational is to maximize expected value: an option is choiceworthy just
  to the extent that the probability-weighted sum of the values of its possible outcomes
  exceeds that of the alternatives.

  (2) The expected value of the Pasadena game is undefined. Its possible payoffs are
  2^n/n with sign alternating by the parity of n, each with probability 2^{-n}, so
  the expectation is the sum of the terms (-1)^{n+1}/n. That series converges to ln
  2 only conditionally: because the sum of the absolute values diverges, Riemann''s
  theorem says some reorderings sum to any real number and others diverge. And the
  game''s specification privileges no ordering of the outcomes; the outcomes are just
  a countable set of payoff-probability pairs. So there is no fact of the matter about
  its expected value.

  (3) When an option''s expected value is undefined, expected-value maximization cannot
  compare it with anything. It licenses no verdict about accepting, declining, or
  paying to avoid the game — and this is not a matter of our ignorance; the theory
  itself has nothing to say.

  (4) But nothing about (2) is peculiar to coin games. Take an ordinary choice: whether
