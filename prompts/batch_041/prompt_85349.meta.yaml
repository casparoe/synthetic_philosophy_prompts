  ---


  A private foundation has committed three years of funding for a small interdisciplinary
  group — roughly five researchers, drawn from stratigraphy, history, philosophy of
  science, and the social study of science — to work on the Anthropocene as a historical
  period. The grant is for conceptual, historical, and methodological work only: no
  new fieldwork, no new coring, no modelling. The group''s remit is to produce work
  that would matter to whoever eventually has to settle, or to justify declining to
  settle, the question of whether the Anthropocene is a formal unit of the geological
  time scale and where its lower boundary falls.


  Some background the group takes as given, so that you need not reconstruct it: the
  term was popularised in 2000 by an atmospheric chemist and a diatom researcher who
  proposed it for the present epoch; an interdisciplinary working group was set up
  in 2009 under the body that governs the geological time scale; that group''s 2023
  proposal — a boundary in the mid-twentieth century, marked by plutonium fallout
  from atmospheric nuclear tests, and a reference point in the annually laminated
  sediments of a small lake in Ontario — was rejected in 2024 by the relevant commissions,
  leaving the term informal; competing proposals would place the start at the beginning
