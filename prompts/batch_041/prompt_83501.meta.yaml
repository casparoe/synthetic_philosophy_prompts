  I am a high school student working on an independent project in philosophy, and
  I have been reading about the identity of indiscernibles and the two-spheres case
  (the thought experiment usually credited to Max Black). I keep finding that the
  two sides of the argument talk past each other, and I would like a document that
  stops that: a joint statement that a defender of the principle and a critic of it
  could both sign after a good-faith adversarial collaboration.


  The two camps I have in mind are these. Camp A, the grounded-distinctness camp,
  holds that numerical distinctness always requires a difference in properties, so
  the two spheres must differ somehow—if not in their intrinsic features, then in
  their relational or identity-involving properties. Camp B, the ungrounded-distinctness
  camp, holds that two things can be numerically distinct while differing in no property
  at all, so the principle is false, and that appeals to identity-involving properties
  either presuppose the very distinctness they are meant to explain or make the principle
  trivial. Please treat these as the two parties, and if you think the labels need
  adjusting, adjust them, but keep two camps.


  A note on vocabulary, since I am still learning it: by "identity-involving" (or
  impure) properties I mean ones that mention a particular individual, such as "being
  identical to this sphere" or "being two miles from that sphere," as opposed to purely
  qualitative properties, which can be stated without naming any particular thing.


  I have also tried to construct a case that closes the obvious escape routes, and
  I want the document to address it directly. Take a universe containing exactly two
  objects, both iron spheres of the same size, mass, and temperature, and arranged
  so that every relational fact about one is also a fact about the other: they are
  the only two things there are, each is the same distance from the other, and there
  is no other asymmetry anywhere in the universe. Call this world W. Now consider
  W*, which is W with the two spheres exchanged. I want both camps to say, in advance
  and in their own words, whether W and W* are the same possible world or two different
  ones, and whether an ideal observer who knew every fact about W could have any basis
  for saying which sphere is which. I also want them to say what happens if we add
  a third, asymmetrical object to the universe, so that one sphere is nearer to it
  and the other farther; my guess is that both camps will agree the principle is untouched
  in that version, and that the real dispute is only about the fully symmetrical case.
  If that guess is wrong, I would like to be told why.


  Please write the joint statement with these sections, in this order, with roughly
  these lengths:


  1. Preamble (about 100 words): who the two camps are and the rules both accept for
  the collaboration.

  2. Joint Claims (numbered, 8 to 12 claims, one or two sentences each): the claims
  both camps can sign—about the logic of the principle, about what the two-spheres
  case does and does not show, about what would count as a refutation, and about anything
  else they can agree on. Please make sure these are not vacuous; each should do some
  work.

  3. Each Side''s Position in Its Own Words (two paragraphs, about 150 words each):
  the view of each camp, written so that camp would accept the wording. Mark the phrases
  each side insists on.

  4. Cruxes (three to five numbered items, about 150 words each): for each, the sub-question
  at issue, why settling it would move at least one camp, the case or argument both
  camps agree bears on it, and each camp''s prediction about how it comes out, labelled
  by camp.

  5. Disagreements Table (four to six rows): columns for the crux, Camp A''s answer,
  Camp B''s answer, and what both camps agree would settle it.

  6. Genuine or Verbal (about 150 words): which parts of the dispute are merely about
  words—for instance, whether "property" is to include identity-involving properties—and
  which parts are substantive, with your reasoning.

  7. Closing Statement and Signatures (about 80 words): a paragraph both camps could
  put their names to, and, for each camp, one thing it would count as evidence or
  argument against its own position.


  I would rather have a shorter document that is exact than a longer one that hedges.
  Where a formulation would be accepted by one camp only because it is vague, say
