  Draft:


  "You are a philosopher of criminal law with a specialization in the theory of punishment,
  and you have a particular talent for the unglamorous question of what a legal institution
  is committed to, as opposed to what it says about itself. Please think carefully
  before you answer, and begin with a short brainstorming pass — a list of the candidate
  theories and of the specific features of the practice that might discriminate among
  them — before you commit to a reconstruction.


  Here is the practice. In the jurisdictions that still sentence people to death,
  capital punishment is surrounded by an apparatus that has no counterpart anywhere
  else in the criminal law. Conviction and sentence are separated: after a jury finds
  guilt, there is a second proceeding, in which evidence is admitted that would never
  have been admissible at trial, the prosecution must establish aggravating circumstances,
  and the defence is entitled to put in anything mitigating about the defendant''s
  history, character, or mental state, and the sentencer is obliged to consider it.
  Appeals in these cases are automatic rather than optional, and in some jurisdictions
  the reviewing court is asked whether the sentence is proportionate to what comparable
  defendants have received. Anyone in the jury pool who says they could never vote
  for death is removed. There is a peculiar rule about what the jury may be told:
  in some jurisdictions the judge is forbidden to tell the jurors that the only alternative
  to death is a life sentence with no possibility of parole, and it is only if the
  prosecution itself argues that the defendant will be dangerous in the future that
  the defence becomes entitled to correct the jurors'' likely misunderstanding. Years,
  often decades, pass between sentence and execution.


  Then there is the surrounding infrastructure, which is where I get confused. The
  same systems fund post-conviction DNA testing, maintain units whose purpose is to
  investigate claims of innocence, and, in most states, run statutes that pay compensation
  to people who were wrongly imprisoned and later exonerated — and I have a vague
  impression that in some of these schedules a year wrongly spent on death row is
  priced higher than a year wrongly spent in an ordinary prison. By the counts that
  are commonly cited, something on the order of two per cent of those sentenced to
  death in the modern era have been exonerated. Meanwhile the on-again, off-again
  pattern: a jurisdiction can go nearly two decades without carrying out an execution,
  then carry out a dozen in six months, then announce a moratorium, then lift it —
  while the statute, the death row, the sentencing proceedings and the appeals continue
  the whole time, and nobody treats the penalty as repealed.


  And the contrast case is life without parole, which also locks a person up until
  they die, and which gets none of this: no bifurcation, no mandatory appeal, no proportionality
  review, no special care about jurors, no compensation schedule keyed to the years
  wrongly served.


  I would have expected a jurisdiction that keeps the death penalty for its deterrent
  value to want it swift and certain, and a jurisdiction that keeps it for retribution
  to be comparatively indifferent to whether the wrong person is occasionally punished.
  What I seem to be looking at is a practice organized almost entirely around the
  possibility of error. So:


  1. Reconstruct the theory of punishment that this practice presupposes — not the
  theory its officials announce, but the one it would have to hold for the parts to
  hang together. What does it take for granted about desert, about deterrence, about
  the state''s standing to kill, and about how the value of a wrongly taken life compares
  with the value of lives protected by deterrence?

  2. Say which rival theories the practice actually rules out and which it merely
  happens to fit. In particular: does it presuppose that the death penalty is different
  in kind from other punishments, or only that it is a larger quantity of the same
  thing? Does the reliability apparatus rule out pure general deterrence, or can a
  sophisticated deterrence theory require it? Could a retributivist be indifferent
  to all of it?

  3. Distinguish carefully what the practice strictly presupposes from what it is
  merely compatible with. Where is it underdetermined — that is, where would several
  incompatible theories license exactly what we observe?

  4. Then test the parts against each other. Are they consistent? In particular: (a)
  the demand that the sentencer weigh everything about this defendant against the
  demand that like cases be treated alike; (b) a machinery for minimizing the risk
  of executing the innocent bolted onto a sanction that cannot be undone; (c) a jury
  asked to make the most context-saturated judgment the law knows, while being kept
  ignorant of the one fact — that the alternative is a lifetime with no release —
  that would make the alternative determinate; (d) compensation for the exonerated,
  priced by the year, alongside a wrong for which no schedule of compensation exists
  at all.

  5. I want you to use two ideas that I think are underused here, and say explicitly
  whether they help. The first is the difference between a weighted trade-off and
  a lexicographic one: is the practice behaving as though one execution of an innocent
  person can be traded against some quantity of deterrence, at some exchange rate,
  or as though it cannot be traded against anything? The second is the difference
  between reducing error and reallocating it: the apparatus may not lower the total
  number of mistakes in the system so much as move them around — onto who gets charged
  capitally in the first place, onto which defendants are offered pleas, onto which
  defendants are selected by the jury pool.

  6. Finally, tell me what would have to change in the practice if we replaced the
  theory you reconstructed with each of these: (i) a straightforward general-deterrence
  theory; (ii) a straightforward desert theory; (iii) a view on which executing an
  innocent person is not a worse outcome than wrongful imprisonment but a different
  kind of wrong; (iv) a view on which the state is entitled to keep the penalty on
  the books while binding itself never to carry it out.

  7. Close with a verdict: is there one theory that best explains the practice, or
  is the practice best explained as an unstable compromise among theories that do
  not fit together — and if the latter, is that instability a defect, or is it precisely
  what makes the institution defensible?


  Please argue rather than survey; I am not interested in a reading list, and I have
