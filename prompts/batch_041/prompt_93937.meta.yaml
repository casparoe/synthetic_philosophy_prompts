  I am a doctoral candidate in metaphysics, working at the boundary between philosophy
  of art and conservation studies, and I keep returning to a mismatch in how museums
  actually reason about the identity of the objects in their care. Consider the ordinary
  conservation and authentication policies of a large encyclopaedic museum. A marble
  sculpture loses its nose; a later restorer carves a replacement from a different
  block, and the museum continues to catalogue, display, lend and insure the work
  as the same sculpture. A panel painting is transferred from its warped wooden support
  to a canvas; the painted surface is preserved, the original support discarded, and
  the work is still treated as the same painting. A bronze is damaged beyond repair,
  melted down, and recast from the same metal in the original mould; the resulting
  object is normally treated as a copy or reproduction rather than as the surviving
  work. A three-dimensional scan of a destroyed statue is used to carve a new marble
  version, and that too is a replica. Yet the same institution will refuse to deaccession
  a work on the ground that the object itself is unique, and its insurers will pay
  for total loss when a fire destroys a painting even though the matter remains in
  the ash.


  What theory of material constitution, if any, does this pattern of practice presuppose?
  I am not asking for a survey of the literature; I want the implicit theory reconstructed
  from the practice itself. Which view does it commit the museum to: that a work of
  art is not identical with the matter that constitutes it at any time, that identity
  is relative to a sortal such as sculpture or painting, that the work is a four-dimensional
  entity whose later stages are parts of it, or something else? Which rival views
  does the practice quietly rule out, and which does it merely fit without requiring?
  Is the practice internally consistent, or does the treatment of the recast bronze
  and the scanned replica conflict with the treatment of the restored marble and the
  transferred panel? I am especially interested in where the practice is philosophically
  underdetermined, so that several incompatible theories would license the same decisions.


