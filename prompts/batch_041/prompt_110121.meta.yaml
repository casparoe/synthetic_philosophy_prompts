  Harsanyi''s aggregation theorem (1955, "Cardinal Welfare, Individualistic Ethics,
  and Interpersonal Comparisons of Utility"): He distinguishes the "aggregation theorem"
  and the "acceptance" or "veil of ignorance" argument. The theorem: if (i) individual
  preferences satisfy the VNM axioms (so each has a cardinal utility function unique
  up to positive affine transformation), (ii) the social welfare function is individualistic
  and satisfies the Pareto principle, and (iii) social preferences also satisfy VNM
  axioms (or a "social rationality" condition), then the social utility function is
  a weighted sum of individual utilities (weights equal to the "acceptance" probabilities
  / social weights). Actually the theorem gives a linear weighted sum, with weights
  reflecting the ethical observer''s judgments, often equal weights if anonymity/symmetry
  is imposed. So it''s a utilitarian-like form but with weights.


  Key points:

  - It''s a representation theorem: it derives a functional form from axioms.

  - It requires interpersonal comparability? Actually Harsanyi''s approach uses "extended
  preferences" or assumes each individual''s utility is measured on a common scale
  via the VNM construction; comparability is built in through the social welfare function''s
  use of individual utility numbers. The theorem does need cardinal utility and a
  common unit for the weighted sum to be meaningful. Harsanyi argued interpersonal
  comparisons are possible via "extended sympathy" preferences.

  - Rawls''s objection: the parties in the original position would not use expected
  utility maximization; they''d use maximin because they can''t assign probabilities
  and wouldn''t gamble with fundamental interests. Harsanyi responded that rational
  agents with equal probability would maximize expected utility. So the disagreement
  is about the decision rule under uncertainty, not about the theorem per se.

  - So the "circularity" charge: the comparability assumption is a premise; if you
  deny it, the theorem doesn''t apply, but that doesn''t make the theorem circular.
  And it doesn''t make Rawls "win by default" — Rawls''s framework also requires premises.


  Also, the theorem doesn''t "prove utilitarianism" in the sense of establishing the
  moral theory; it shows that given certain axioms, the social preference must be
  representable as a weighted sum. Whether to accept the axioms is the ethical question.
  Also, "utilitarianism" typically adds equal weighting and sum-ranking; the theorem
  allows weights.


  So the false presupposition/dilemma: "Is it a proof of utilitarianism, or is it
