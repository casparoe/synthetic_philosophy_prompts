  - Deflationist: If (3), then our far future is inside a sim. Sims are run by simulators
  who may terminate them, don''t necessarily contain the full resources (sim may be
  a small patch), and the sim''s "future" is bounded by the simulator''s patience/compute
  budget. So the astronomically long durable future may be an illusion; the expected
  duration of our world is short (cf. Bostrom''s point that most sims may be short-lived
  "ancestor simulations" that only run a brief moment). So the fanatic''s "astronomical
  waste" loses its anchor.

  - Fanatic: But that cuts the other way. If we''re in a sim, there''s a simulator,
  and the simulator''s world is plausibly enormous and durable. Our actions here might
  be *observed* and could influence the simulators (or be evaluated by them). Under
  a simulation, the "reach" of our choices could extend into base reality — the stakes
  might be bigger, not smaller. Also, Bostrom''s argument says if (3), then the base-level
  civilization is posthuman and thus has huge value already; and there are many sims,
  so the total value across sims is huge. Our decision should maximize expected value
