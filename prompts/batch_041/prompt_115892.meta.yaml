  Hmm, actually the no-trade theorem says: if there''s a common prior, and the initial
  allocation is Pareto efficient given public info, and everyone knows the trade is
  voluntary, then no trade can occur even with asymmetric private information. The
  epistemological point: the offer to trade reveals information. And the Grossman-Stiglitz
  paradox: if prices perfectly reveal information, no one has an incentive to gather
  it, so prices can''t perfectly reveal information. These are related but distinct.


  2. Student B: The no-trade theorem is about a very specific setup — common prior,
  no gains from trade absent private info, common knowledge of the offer, and risk-neutral-ish...
  Actually the assumptions: common prior, the initial endowment is Pareto optimal
  given public information, and the trade is common knowledge. The theorem''s conclusion
  is that there''s no trade at any price. But real markets have gains from trade from
  hedging, liquidity, differing priors, differing risk tolerances, taxes, life-cycle
  needs. So the theorem doesn''t say markets can''t aggregate info; it says something
  narrower.


  3. Student A: But the common prior is the deep problem: if two people disagree,
  either one is irrational or they have different priors, and if priors differ, "rational"
  aggregation is undefined. So the theorem shows that disagreement itself is irrational
  — "agreeing to disagree" is impossible for rational agents with a common prior.


  4. Student B: But that just pushes the question to whether a common prior is defensible
  — the common prior assumption is a substantive commitment (Harsanyi''s doctrine),
  and it''s questionable whether it can be justified for real agents with different
  evidence and different model spaces. If priors differ, Aumann''s theorem doesn''t
  apply. Also, if the agents don''t know each other''s reasoning, etc.


