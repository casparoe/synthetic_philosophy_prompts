  The Rietdijk–Putnam argument: The argument claims that special relativity implies
  the block universe (eternalism / no objective present) because simultaneity is relative
  and, given that "all events simultaneous with here-now are real," transitivity of
  the "real" relation forces all events to be equally real. Key open questions:

  - Does the argument depend on a "presentist-friendly" premise that all and only
  simultaneous events are real? (Stein''s response.)

  - Is the argument valid given relativity of simultaneity — does "real for" or "real
  at" behave transitively?

  - Does the argument only establish that the future and past are as real as the present
  for distant observers, or does it need the assumption of a privileged "now"?

  - What about the relationship between the "block universe" (a claim about the ontology
  of time) and the "block universe" as a claim about determinism/4D spacetime?

  - Whether the block universe follows from SR or only from Minkowski spacetime plus
  a "tenseless" semantics.

  - How the argument interacts with presentism: is presentism compatible with SR at
  all?

