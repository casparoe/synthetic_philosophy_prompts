  Let me think about what makes this maximally in the weeds and requires the model
  to do real work rather than regurgitate:


  The readings of "nothing but the truth" and "the whole truth" and "a half-truth
  is a whole lie":

  1. Nothing false: you must not assert anything false (bare truthfulness). Trivial
  and nearly everyone agrees.

  2. Nothing misleading: you must not make assertions whose literal truth, combined
  with the hearer''s false presuppositions or implicatures, produces a false belief.
  This is the paltering case. Substantive: does the duty attach to the statement or
  the belief? Requires a theory of implicature (Gricean) and the "what is said" vs
  "what is implicated" distinction.

  3. Whole truth: a positive duty of completeness — you must not omit material facts.
  This is much stronger and usually false in ordinary life (you never tell the whole
  truth about anything). But there''s a legal doctrine where it bites: "half-truths"
  — once you speak, you must not omit; securities law Rule 10b-5 makes half-truths
  actionable; also "the duty to disclose."

  4. Not telling falsehoods vs not deceiving: the moral difference. Lying = asserting
  what you believe false with intent to deceive; misleading = causing false belief
  without asserting anything false. Is misleading ever worse than lying? Consider:
  lying is often seen as worse because it uses the hearer''s trust / treats them as
  a means, whereas misleading leaves them to draw their own (false) conclusion and
  so respects autonomy in a way. Or the opposite: misleading is worse because it''s
  a cowardly way of lying, exploiting the hearer''s rational inference, so it''s a
  kind of lying plus manipulation. There''s the Kantian argument that the duty not
  to lie is a duty to be truthful in one''s declarations and doesn''t extend to misleading;
  and the counterargument that a lie is just one way of deceiving and the deeper duty
  is a duty not to deceive (Jennifer Saul on lying vs misleading: misleading is not
  lying; also the point that in the classic "I have an appointment" case, misleading
  seems just as bad).

  5. "Technically true" reading: the sentence uttered is true as literally construed,
  but the speaker expects the hearer to take it in a different sense. Is the statement
  true, or is it ambiguous and so "true on a reading"? This raises the question of
  whether the "content" of the assertion is determined by the sentence, the speaker''s
  intention, or the hearer''s uptake. In the weeds: semantic vs pragmatic content;
  the "contextualism" question; the fact that "what is said" in the minimal sense
  may be true while the "what is communicated" is false. If you''re a truth-conditionalist
  who says the content of the assertion is what''s said, "technically true" is enough;
  if you think assertion content is what''s communicated, it''s a lie.


