  Prompt:


  You are a philosopher specializing in decision theory, social epistemology, and
  the ethics of collective action. I am preparing to interview a guest for a seminar
  Q&A. His position is a novel extension of the unilateralist curse: he argues that
  the curse is not fundamentally a coordination failure but a selection-by-confidence
  effect. When many actors each have some chance of being right and any one can act
  unilaterally, the act that gets done is selected by the most confident actor rather
  than the most competent one; even if each actor''s evidence is on balance favorable,
  the expected value of the resulting unilateral action can be negative. He also claims
  that the standard remedies, such as requiring consensus or a supermajority, can
  be worse when competence is heavy-tailed, because they suppress the one actor who
  is actually right; his alternative is epistemic licensing, where unilateral action
  is permitted only by actors who can demonstrate structural competence or a track
  record, not merely high confidence.


  Think carefully before drafting. First, brainstorm the dialectical structure: what
  the guest''s central claim implies, where the standard objections will come from,
  and what replies he is most likely to give. Then draft eight to ten interview questions
  that go beyond having him restate the view. Include at least one question each on
  (a) the distinction between selection by confidence and correlated error, (b) the
  heavy-tailed competence objection and whether it reintroduces a unilateral license
  for the one expert, and (c) how epistemic licensing would work institutionally without
  relying on the very confidence signal the view distrusts. For each question, add
  a follow-up keyed to the answer he is most likely to give. The questions should
  press on the actual content of his position, not on his biography or influences.


