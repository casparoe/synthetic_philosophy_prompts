  "So I''m in this formal epistemology seminar and we spent the first half of term
  on scoring rules and the accuracy-dominance argument — the idea that your credences
  should be probabilities because any non-probabilistic credence function is accuracy-dominated,
  i.e. there''s always some probability function that''s closer to the truth no matter
