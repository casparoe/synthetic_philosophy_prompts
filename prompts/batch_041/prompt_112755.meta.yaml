  a whole set of them — you''re ''mushy'' about the exact number. And the room basically
  split in half and the argument has been going in circles since. The precision people
  say an imprecise state can''t be a real belief state because it can''t guide decision:
  if you only have a set of functions, there''s no fact of the matter about what you
  should do, and you get money-pumped / stuck with indeterminate choices. The imprecise
  people say a single sharp function is a fiction that pretends you''re certain about
  probabilities you have no business being certain about, and that the accuracy-first
  machinery itself can be extended to sets of functions and will actually *prefer*
  imprecision in some cases, so the precision people are just smuggling in an assumption.
