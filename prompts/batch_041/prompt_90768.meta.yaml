  \ holds (M satisfies ZF), so M proves that there is no surjection from ω onto P(ω);\
  \ hence M satisfies 'P(ω) is uncountable'. From the outside, however, M is countable\
  \ and every element of M is countable too; in particular P(ω)^M, the set M takes\
  \ to be the set of subsets of ω, is a countable set. It is also a proper subset\
  \ of the real P(ω): it contains only those subsets of ω that M happens to have,\
  \ so M's power set operation is 'incomplete' from the point of view of V. The bijection\
  \ witnessing that P(ω)^M is countable is thus a set of pairs in V, and M contains\
  \ it as an element but cannot recognize it as a bijection onto ω — that is why M\
  \ is not inconsistent in thinking that its reals are uncountable. More generally,\
  \ countability is not absolute between M and V: what M takes to be uncountable can\
  \ be countable in the metatheory, and in a countable transitive model the ordinal\
