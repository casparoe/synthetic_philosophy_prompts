  The activity should make them feel:

  1. That the party form itself (not doctrine, not bad leaders) exerts a pressure
  on individual thought.

  2. Specifically, that the pressure is felt as loyalty — the moment where you''re
  asked to endorse something you think is false or unjust, or to stay silent about
