  Design: "Constituent Assembly"/"The Convention". Participants are randomly split
  into 3 parties (or 2 big + 1 small). Each party must adopt a single platform of,
  say, 5 planks, by internal vote. Rules:

  - Each participant privately writes their own view on the 5 issues before parties
  form (a sealed individual sheet — this is the "before" baseline, crucial for the
  debrief).

  - Then parties must produce a single agreed platform. Speeches in the chamber must
  be delivered as party positions; anyone speaking must state whether they speak for
  their party.

  - Points system: points go to the party whose platform prevails in the final vote,
  not to the individual whose private view was closest. So the reward is entirely
  collective. Add: a bonus if the party''s platform is unanimous internally (a discipline
  bonus), and a penalty if a party member publicly breaks with the platform (leak/defect)
  — say the defector''s party loses points, and the defector personally gains nothing.

  - The crucial rule: after the platform is locked, an amendment is proposed that
  many privately oppose, but the party that votes for it gains a decisive advantage
  (coalition arithmetic). So there''s a moment where the party must endorse something
  a majority of its members privately rejected — and the reward is real. This is the
  "feel the force" moment: the pleasure of winning outweighs the discomfort.

  - Then, a "truth-teller" option: a participant may, at a cost (personal points,
  and their party loses points), publicly say what they actually believe, including
  admitting their own party''s platform is wrong. Almost no one will take it. That''s
  the data for the debrief.


