  Draft:


  "I''m in a small reading group that''s working through the AI-safety-ish ''agent
  foundations'' literature (we''re all philosophy grad students, none of us are really
  ML people), and last week we did the stuff about ''embedded agency'' -- the cluster
  of problems you get when the agent isn''t standing outside the world looking in,
  but is itself a physical thing inside the world it''s making decisions about: it
  has to model itself modelling, its own code is sometimes among the things it''s
  choosing between, and there''s no principled place to draw the line between ''the
  agent'' and ''its environment'' -- every line you draw is a choice that shows up
  somewhere in the math. I thought I understood it, and then someone said it''s just
  the frame problem with a new coat of paint, and now I can''t tell. So: compare them.
  The frame problem as it''s usually told -- an agent has a huge database of beliefs
  about the world and almost nothing it does tells it which of the millions of facts
  are relevant to the thing it''s currently doing, and there''s no general procedure
  for that, so it looks like the whole idea of a general reasoning machine is in trouble.
  Are these the same problem? What does each have that the other doesn''t -- what
  does the frame problem''s relevance question look like once you notice the agent
  is in the world, and what does the embedded agency picture lose if you leave out
  the relevance problem entirely? And which one is doing the real work: I have a suspicion
  that a genuine solution to one of them would hand you the other for free, but I
  can''t tell which direction the dependence runs. Give me a verdict on which is the
  deeper problem, and on whether the diagnosis ''it''s the same problem'' is right,
  wrong, or true-but-useless. Also, don''t give me a survey of what various people
  have said about either -- I want the comparison itself. One more thing: if there''s
  a case where the two come apart cleanly (a system that has one problem but not the
  other), that would settle it for me, so please try to find one -- my best attempt
  was a thermostat, which I think fails at both, and a theorem prover, which I think
  has neither, but I''m not confident."


