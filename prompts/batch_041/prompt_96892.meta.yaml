  iff the failure reveals unwillingness to work (a "work-shyness" test) — this can
  sanction someone who couldn''t comply but whose attitude shows unwillingness. (c)
  Strict compliance rule: sanction any failure to meet the requirement, mitigating
  only for documented incapacity. (d) Proportionality rule: sanction only if the sanction
  won''t cause greater hardship than the non-compliance (harm-weighted).


  Cases that fit multiple:

  1. Missed appointment, bus failure, no sanction — fits (a), (b), (d), and (c)-with-incapacity-exception.

