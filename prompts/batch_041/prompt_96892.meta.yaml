  utility with convex capacity, maxmin, α-maxmin, source-sensitive SEU, "avoid bets
  where I can''t compute the odds." New case: a two-stage bet, or an Ellsberg urn
  where the ambiguity is resolved differently, or a "second-order" urn where the composition
