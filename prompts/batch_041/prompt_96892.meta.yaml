reasoning_summary: 'The user wants a prompt for their dataset. Domain options: welfare
  state/undeserving poor, AI control vs alignment, Szasz, Ellsberg paradox, Nietzsche''s
  eternal recurrence. Type: Predict or recommend a verdict on a new case from someone''s
  verdicts on earlier cases.


  Constraints: short-ish, formal/polished, from perspective of someone for whom the
  topic has recently become personally relevant. The earlier verdicts should be jointly
  consistent with more than one plausible rule, new case where at least two rules
  diverge. Deliverable: prediction/recommendation, candidate rules, closest analog,
  best guess, further case that would tell them apart.


  Also, the note about injecting new/niche ideas: the prompt should be in the weeds.
  Best combination: Szasz and the myth of mental illness, or welfare conditionality,
  or Ellsberg. Let''s think.


  "Predict or recommend a verdict on a new case from someone''s verdicts on earlier
  cases" — a tribunal/board deciding cases. Welfare conditionality: a benefits appeals
  tribunal with precedents on sanctioning claimants; new case. That''s nicely in the
  weeds and doesn''t require citations. Candidate rules could be: (a) sanction only
  when the failure was within the claimant''s control (voluntariness/culpability rule),
  (b) sanction whenever the claimant failed to meet a mandated activity requirement
  regardless of reason (strict compliance), (c) sanction only where the claimant''s
  conduct manifested a genuine unwillingness to work (desert/character-based), (d)
  proportionality rule tied to the severity of the consequence (e.g., losing housing)
  — a "harm-based" rule.


  Szasz: a psychiatric commitment review board / an ethics committee deciding whether
  to classify a new condition as a "mental illness" — precedents where a clinician/board
  declared certain conditions genuine illness vs. "problems in living." That''s very
  much in the weeds and models know Szasz reasonably. Candidate rules: (1) illness
  iff there''s a demonstrable brain lesion (Szasz''s strict neurological criterion),
  (2) illness iff the condition involves a dysfunction of an internal mechanism (Wakefield-ish
  harm/dysfunction), (3) illness iff the person suffers and the label helps them (pragmatic),
  (4) illness iff the behavior deviates from social norms (Szasz''s critique of the
  "myth"). The new case could be something like internet gaming disorder, or prolonged
  grief disorder, or... "orthorexia," or "burnout," or "climate anxiety." Something
  new-ish that a small LLM knows: "prolonged grief disorder" (added to DSM-5-TR in
  2022) or "gaming disorder" (ICD-11). Actually the prompt shouldn''t lean on unverifiable
  dates. Hmm. Could say "a proposed new diagnosis for persistent, disabling grief
  more than a year after a bereavement" — describes it without naming, so no citation
  needed. Or "a proposed diagnosis of severe distress about climate change." That''s
  a good in-the-weeds new case: "climate anxiety / eco-distress" proposed as a diagnosis.
  Or "burnout" as a diagnosis.


  Actually, the Szasz domain fits beautifully with the "verdict on a new case from
  earlier verdicts" type: a colleague''s verdicts on which conditions count as genuine
  mental illnesses. And the asker''s personal relevance: "I''m a psychiatry resident
  / I sit on a diagnostic review panel and my supervisor..." Or: "My clinic is deciding
  whether to open a specialty service." Personal relevance is required: "someone for
  whom the topic has recently become personally relevant."


  Let''s think about which is best. The instruction says the prompt should be somewhat
  in the weeds so models can''t regurgitate. Szasz is somewhat well-known but the
  specific application to a new diagnosis is in the weeds. AI control vs alignment:
  a lab safety committee''s precedents on which measures to apply to models — verdicts
