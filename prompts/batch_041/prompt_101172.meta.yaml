  Let me lay out the exchange as it happened.


  (1) Nadia opened: ... Mill''s late writings ... show him endorsing the socialist
  critique of the existing distribution of property, and he says he would be willing
  to see the present system replaced if a better one could be found and tried. She
  added that the *Autobiography* records his and Harriet Taylor''s sympathy with the
  aims of socialism, and that the posthumously published *Chapters on Socialism* treat
  the socialist case seriously rather than dismissively. So, she said, he was a socialist
  by the end, whatever label he''d have accepted.


  (2) Ravi said the label was doing no work: what matters is what normative framework
  he was working within, and Mill never left the liberal one. He kept insisting that
  any move toward socialism be voluntary and experimental, he worried about the pressure
  socialism would put on individuality and on the freedom to choose one''s own life,
  and his concrete proposals -- worker cooperatives, profit-sharing, limits on inheritance,
  reform of landed property -- are all things a market economy can absorb. A socialist
  in the nineteenth-century sense wanted the means of production socialized; Mill
  never asked for that.


  (3) Nadia replied that Ravi was reading the proposals as if they were the whole
  of Mill''s view, when Mill himself treats them as way stations. She said Mill distinguishes
  the *institution* of property from the *laws* currently governing it, and that once
  you see the distinction, his critique is not a reformist tinkering but a claim that
  the present system has never been justified -- so his willingness to replace it
  is not hedged the way Ravi says.


  (4) Ravi answered that this proves too much: every liberal reformer from Smith onward
  has distinguished the idea of property from its abuses, and Mill''s willingness
  to entertain experiments is not the same as endorsing their outcome. He also said
  Nadia was conflating Mill''s *predictions* (that the working class would increasingly
  demand a share) with his *norms*, and that Mill''s test for any scheme was always
  whether it could be adopted without sacrificing liberty -- which is a liberal test,
  not a socialist one.


  (5) Nadia came back with a point I thought was strong: she said Ravi''s criterion
  makes the label unfalsifiable, since any socialist could be redescribed as a liberal
  if their socialism was voluntary. She said the real question is what Mill thought
  was *wrong* with the existing system, and that he thought the wages relationship
  itself was something to be superseded, not merely regulated.


