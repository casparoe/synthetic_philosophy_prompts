  Here is the book''s summary, as close to verbatim as I can reconstruct it:


  "Strawson''s essay argues that whether determinism is true makes no difference to
  whether we are justified in holding one another morally responsible. His key observation
  is that our practices of blame and praise rest on the reactive attitudes — resentment,
  indignation, guilt — which are natural human responses that we simply cannot choose
  to abandon. Because these attitudes belong to our emotional constitution rather
  than to any beliefs we hold about causation, the discovery that our actions were
  causally determined all along would leave them exactly as they are. Strawson contrasts
  the participant stance, in which we engage with others as responsible agents, with
  the objective stance, the detached, scientific view of a person as a thing to be
  managed; the latter is the view we take of the insane or the very young, and it
  is the one the determinist is forced to try to occupy all the time. Strawson''s
  verdict is therefore a compatibilist one: determinism and moral responsibility stand
  or fall together, and the libertarian''s demand for a special, contra-causal freedom
