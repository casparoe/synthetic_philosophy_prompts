  Draft:


  Two people in my reading group had a proper row about Carroll''s tortoise last week
  and I''ve been turning it over since. I''m not going to tell you which side I leant
  towards because I genuinely don''t know, and I''d rather you judge the exchange
  as it actually happened. Here''s the shape of it.


  Nadia kicked off. Her line: the tortoise isn''t just a clever puzzle, it''s a proof
  that no deductive rule can ever be justified. Take modus ponens. You accept "if
  P then Q" and you accept "P" — the tortoise says fine, but I haven''t yet agreed
  to accept "Q". So you add the conditional "if (if P then Q) and P, then Q" as another
  premise. But then he wants that one too, and so on. Every attempt to justify the
  rule either goes on forever or quietly assumes the very rule it''s meant to support.
  So deduction bottoms out in something we can''t justify — we just do infer; we''re
  trained into it. That''s a real result about the groundlessness of logic, not a
  trick.


  Rob said that''s a misreading and the whole thing trades on a confusion. What the
  tortoise shows is only that you can''t justify a rule of inference by handing over
  one more proposition to accept. But nobody ever claimed you could, and the demand
  is confused rather than unsatisfiable. Asking for a reason to infer by modus ponens
  is like asking for a reason to move the bishop diagonally — the rule isn''t a claim
  that stands in need of evidence, it''s part of what it is to reason deductively
  at all. You can show a rule is a good one by proving it''s sound, or by pointing
  at its record of never taking you from truths to a falsehood — that''s a justification
  of a different kind, and the tortoise never asks for it because he''s fixed on the
  wrong kind.


  Nadia''s reply: that''s just relabelling the gap. Chess is something we made up
  and can walk away from; nobody says a person who moves a knight like a bishop has
  made a mistake about chess, they''ve just stopped playing. But if someone reasons
  by affirming the consequent we say they''ve reasoned wrongly, full stop. So the
  rules of logic aren''t optional conventions, they''re norms we hold each other to
  — and the regress shows we can''t ground those norms in anything. So the conclusion
  stands, just restated.


  Rob then went a different way. He said the tortoise isn''t even a coherent thinker,
  because accepting "if P then Q" just is, at least partly, being disposed to infer
  Q from P. Someone who says "yes, I accept the conditional, and yes, I accept P,
  but I''m still not prepared to accept Q" hasn''t actually accepted the conditional;
  he''s just printing the words. And if you want a fancier version: for a transition
  to be an inference rather than a mere associative jump, the thinker has to take
  their premises to support the conclusion — but that taking isn''t itself one more
  premise, it''s the act of inferring.


  Nadia pounced. If the taking is a genuine act, what makes it correct? Either it''s
  another state you can be right or wrong about, in which case we''re back to needing
  a justification for it and the regress is back — or it''s just a bare psychological
  fact, in which case anything counts as inference and there''s no normativity left.
  Pick either horn: groundless or vacuous.


  Rob said that''s a false dilemma, that a capacity can be answerable to correctness
  without needing a premise to licence each exercise of it, and that the regress only
  bites if you insist that justifying must always take the form of adding something
  to accept. Nadia said that''s just refusing to answer the question. They went round
