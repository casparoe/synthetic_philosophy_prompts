  Design of the dispute:


  Setting: my philosophy reading group / a seminar after-party. Two people: let''s
  call them "Nadia" and "Rob" (or keep unnamed: "one of them", "the other"). The examples
  use varied naming. I''ll use light names.


  Moves:


  (1) Nadia: Carroll''s tortoise shows there''s no non-circular justification of any
  deductive rule. Whatever you add — the conditional, the further conditional — the
  tortoise can always ask for the next step, so any justification either goes forever
  or begs the question. Conclusion: logic is ultimately groundless; we''re just conditioned
  to infer.


  (2) Rob: That''s a misreading. The tortoise only shows that you can''t justify a
  *rule of inference* by adding another *premise*. But nobody promised you could.
  The demand to "justify" modus ponens is like demanding a reason to move the bishop
  diagonally in chess — it''s constitutive of the practice; the request for a justification
  is confused, not unsatisfiable. So no groundlessness result follows.


  (3) Nadia: Fine, but "constitutive of the practice" is doing all the work, and the
  disanalogy is that chess is a game we invented and can abandon, whereas we hold
  people *accountable* for modus ponens — if someone reasons by affirming the consequent
  we say they''ve made a *mistake*, not that they''re playing a different game. So
  the normativity is real and the regress shows we can''t ground it. That''s exactly
  the result, not an evasion of it.


  (4) Rob: Then you''re conflating "can''t be justified by further premises" with
  "can''t be justified". A rule can be justified by showing that following it is what
  makes your transitions truth-preserving — you justify the rule by its *track record*
  / by a soundness proof. The tortoise never asks for that; he asks for a premise
  that would force him to draw the conclusion, which is a different thing. Also, crucially,
  the tortoise is treating "if P then Q" as a *proposition he accepts* while refusing
  to let it do any work — but accepting a conditional just *is*, in part, being disposed
  to infer by modus ponens; someone who says "I accept that if P then Q, and I accept
  P, but I''m not yet prepared to accept Q" hasn''t fully accepted the conditional.
  So the tortoise is not a coherent interlocutor; he''s a talking machine that prints
  sentence-acceptances.


  (5) Nadia: Now you''ve moved the problem, not solved it. If accepting the conditional
  *just is* having the disposition, then there''s no fact of the matter about whether
  I''ve got it right — any disposition I have defines the rule. And if instead you
  say a thinker must *take* their premises to support the conclusion, then that taking
  is either a further premise (regress) or a bare state (no justification). Either
  way: groundless.


  (6) Rob: That last step is a false dilemma — maybe "taking" is neither a premise
  nor a bare state but the exercise of a capacity that''s answerable to correctness...
  etc.


