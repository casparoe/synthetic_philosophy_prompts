  Two colleagues of mine, Nadia and Paul, spent most of a long train ride arguing
  over a proposal Nadia had sketched in a seminar, and I have been chewing on it since
  without being able to settle it. I would like you to adjudicate it move by move
  rather than simply declare a winner, and to say at the end what each of them is
  missing.


  Nadia''s proposal was this. Before each general election, every citizen who wants
  to vote answers a short, publicly published set of questions — not about policies
  or parties, but about basic matters of fact and reasoning of the sort any attentive
  person could master in an afternoon (for instance, what a filibuster is, or what
  a base rate is, or how a marginal tax rate differs from an average one). Those who
  pass are placed on the voting roll; those who do not may retake it as often as they
  like, at no cost, and may vote in local and primary elections in the meantime. Crucially,
  the questions would be written and periodically revised not by experts or officials
  but by a citizens'' assembly selected by lot, and the passing bar would be set deliberately
  low — she guessed it would exclude perhaps a tenth of adults.


  Paul''s first objection: the demographic objection. However minimal and however
  neutrally authored the test is, he said, it will be passed at different rates by
  different groups — the better-educated, the more leisured, the native speakers —
  so the electorate that emerges will be skewed along exactly the lines that already
  divide us, and a skewed electorate produces skewed policy. That is disqualifying,
  he said, whatever the test''s content.


  Nadia''s reply: that argument proves too much. Every selection rule skews the electorate
  somehow — turnout skews by class and age, and we do not regard universal suffrage
  as unjust for that reason; jury pools skew too, and we correct for it rather than
  abolish juries. If the bar really is low and free to retake, the skew may be small,
  and small skews are the price of every procedure we already accept.


  Paul: juries are a bad analogy, because jurors are summoned rather than volunteering
  and the stakes are a particular defendant''s liberty, which justifies screening
  for competence; voting is a right of membership, and we do not condition rights
  of membership on passing tests — we abolished literacy tests precisely because they
  were the instrument by which a group was excluded, and no amount of redesign changes
  what a test at the entrance to the franchise is for.


  Nadia: the history is a reason for caution, not a proof that no filter can ever
  be legitimate. The old tests were racist by design and were paired with unlimited
  discretion in the registrar''s office; hers are lottery-authored, published in advance,
  and mechanical. She said Paul was treating "any test" as though it inherited the
  sins of the worst test.


  Then Paul changed his ground. Grant the demographics, he said; the deeper trouble
  is that you cannot specify "competence" without smuggling in a picture of the good
  reasoner, and a picture of the good reasoner is a picture of the good citizen, and
  whoever writes the test decides, in advance and invisibly, whose way of thinking
  counts. A citizens'' assembly is not neutral; it is just a different author of the
  same smuggling operation.


  Nadia: neutrality is a mirage on both sides. Universal suffrage also embeds a conception
  — that preferences count equally however uninformed they are — and if embedding
  a conception were fatal, it would be fatal to Paul''s position too. The question
  is which conception is defensible, not whether a conception exists.


  Paul''s last move: even if the accuracy gains were real, the filter changes the
  character of the polity. It tells those excluded, in the most public way possible,
  that their voice is withheld because they are not good enough, and that message
  corrodes the mutual respect that makes a democracy a democracy — a cost that outweighs
  any gain in the quality of decisions.


  Nadia''s last move: that is an expressive objection wearing ethical clothes. A single
  vote in a national election is already nearly powerless, and we do not think telling
  citizens that degrades them; and if competence requirements degraded people, driving
  tests and professional licensing would degrade them too. Paul answered that a driving
  licence is not a badge of membership in the political community and does not decide
  who belongs — which, Nadia said, is exactly the point she had been making all along
  about the difference between having a say and having a weighted say, and there the
  ride ended.


