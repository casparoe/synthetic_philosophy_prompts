  parties pay their bids, (e) no credible precommitment device, (f) an option to quit
  at any point. Whether the real episode has all six is the case analysis. And the
  case can test: does escalation occur when (b) is absent — i.e., when costs are recoverable
  or unobservable? Or when decision-makers rotate (undercutting self-justification)?


