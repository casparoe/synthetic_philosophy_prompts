  Hmm, actually here''s a subtlety: the dollar auction''s escalation is driven by
  the fact that a bidder who has bid $0.60 for a $1 prize faces the choice: quit and
  lose $0.60, or bid $0.70 and possibly win $1 (a net of $0.30, better than -$0.60
  if no one else bids). So the trap is the *combination* of a sunk irrecoverable bid
  and the possibility of winning. And the pivotal move is when the bidding passes
  the value of the prize — at that point the second bidder is guaranteed to lose money,
  and the escalation continues because the marginal cost of continuing seems smaller
  than the certain loss. The key irrationality-ish feature is that players compare
  "bid more" against "quit now" rather than against "never having played", and they
  don''t consider that the opponent faces the same logic.


  Good analytic points for the answer to make: the mapping requires (a) a prize, (b)
