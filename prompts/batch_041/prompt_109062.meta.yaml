  Let me think about what makes the paradox structurally interesting:

  1. The promise is only effective if the promisee believes it; belief requires the
  promisor to be a certain type, not just to have the intention.

  2. The type can''t be adopted at will at the moment of promising (Parfit: you can''t
  just decide to be the sort who pays if you know you''ll reconsider; well, actually
  you can decide now and then change later — but the disposition has to survive the
  later reckoning, so it must not be the sort of thing that reconsiders). Parfit''s
  point: to be the sort of person who keeps such promises, you must have a disposition
  that doesn''t respond to the reasons available at the time of action. This is what
