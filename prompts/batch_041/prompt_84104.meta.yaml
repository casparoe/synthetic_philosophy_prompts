  Good options:

  - Norms of assertion: crux is the "knowledge norm" vs "truth norm" vs "belief norm"
  — the standard recitation is Williamson''s KNA and the counterexamples (lottery,
  Moore''s paradox, etc.). To avoid recitation, the question could focus on a specific
  structural issue: e.g., whether the knowledge norm''s defenders can handle selfless
  assertion, or the distinction between the norm governing assertion and the norm
  governing the *proposition* asserted, or the "no selfless assertion" debate, or
  the problem of assertions about one''s own ignorance ("I don''t know whether p,
  but p"), or the contrast between "normative" and "constitutive" readings, or the
  "truth norm + indefeasible warrant" approach (Weiner), or "justification norm" (Douven),
  or the "supportive/defensive" distinction (McKinnon? — that''s about silencing).


  Actually, a good in-the-weeds angle for norms of assertion: the distinction between
  the primary norm and secondary/auxiliary norms, or the question of whether assertion''s
  norm is "knowledge" or whether knowledge is merely a *sufficient* warrant, i.e.,
  whether the norm is a necessary condition. Also the "Gettier problem for the knowledge
  norm" — whether a Gettiered assertion is improper. That''s in the weeds and doesn''t
  require citations. Hmm, but the model would know these.


  - Tight vs loose cultures (Gelfand). The exam question could be about the descriptive/normative
  gap, or about the definition of "tightness" as strength of norms + tolerance of
  deviance, and the confound with authoritarianism/collectivism. In-the-weeds: whether
  tightness is a property of a society or a situation (the "tightness-looseness" as
  situation-level vs culture-level; Gelfand & Harrington). Or the normative question:
  how much rule-following should a society demand — the crux is the distinction between
  the *strength* of norms and the *severity* of sanctions, which tightness measures
  conflate. That''s a nice in-the-weeds crux: Gelfand''s construct bundles (a) number
  of norms, (b) strength/clarity, (c) tolerance of deviance, and (d) severity of punishment.
  The exam question: "Is tightness a single dimension or a bundle? Design a case that
  separates them." Hmm.


  - Collective guilt across generations (Jaspers): the crux is the distinction among
  Jaspers'' four kinds of guilt (criminal, political, moral, metaphysical) and the
  question of whether metaphysical guilt can be inherited. Also the difference between
  collective guilt and collective responsibility, and the "guilt vs responsibility"
  distinction (Arendt). In-the-weeds: whether the fourfold typology is exhaustive/orthogonal,
  whether political guilt is a species of guilt at all (Jaspers says political guilt
  is borne by all citizens, but is it *guilt* or just liability?), and the transgenerational
  issue: whether moral/metaphysical guilt can attach to descendants. The exam question
  could be: "Jaspers says political guilt is collective but moral guilt is individual.
  Explain why that asymmetry is supposed to hold and assess whether it survives the
  case of inherited political debts." Nice, in-the-weedish, and doesn''t require citations.


  - Adam Smith sympathy/impartial spectator: in-the-weeds crux — the difference between
  the "impartial spectator" and the "man within the breast," and the puzzle of how
  the impartial spectator''s judgments can be authoritative if it''s a social construct
  (Smith''s own view that our moral sentiments are formed by actual spectators, and
  then idealized). The "Smith problem" (Das Adam Smith Problem) — the alleged tension
  between TMS and Wealth of Nations — but that''s a well-known recitation topic. Better:
  the puzzle of whether the impartial spectator can correct social norms if it''s
  itself a product of social norms; and the role of the "demigod within the breast"
  / the half-formed spectator; also the "pleasing illusion" passage about the rich
  and the poor. Also Smith''s distinction between praise and praiseworthiness. Good
  crux: the asymmetry between praise and praiseworthiness and what it implies for
  whether the impartial spectator is a discovery procedure or a construction.


