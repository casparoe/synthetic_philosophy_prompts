  Exam question crux options:

  1. Why is political guilt collective but moral guilt individual in Jaspers — and
  can the collectivity of political guilt survive the replacement of the citizenry
  across generations? I.e., if political guilt is borne by all citizens in virtue
  of their citizenship and the political continuity of the state, then does it transmit
  to those who were not alive? And if it does, does that show political guilt is not
  really guilt (because guilt requires agency) but liability, or does it show guilt
  can be inherited (contradicting Jaspers'' own insistence on individual moral agency)?

  2. The relation between metaphysical guilt and solidarity: metaphysical guilt arises
  from a failure of solidarity with the human as such; the in-the-weeds puzzle is
  whether this makes metaphysical guilt the most *universal* and yet also the least
  *actionable*, and whether it can be discharged.

  3. Whether the four categories are exhaustive of guilt or whether there''s a "structural"
  or "institutional" guilt not captured (e.g., benefiting from injustice without having
  done anything). And whether Jaspers'' framework can accommodate the "beneficiary"
  case — a case which is neither criminal, political, moral (no wrong act), nor metaphysical
  (no failure of solidarity in the moment, because the person wasn''t there). That''s
  a great in-the-weeds crux: the beneficiary case, which Jaspers doesn''t handle well
  because his framework is retrospective.


