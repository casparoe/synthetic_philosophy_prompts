  — that early vision is informationally sealed off from beliefs, desires, expectations
  and other central states, so that what you know or want cannot alter what you see
  (though it can alter what you say, how you respond, where you look). The other side
  holds that cognition penetrates perception, so that a perceiver''s concepts, expectations,
  moods or knowledge genuinely shape the content or the phenomenal character of their
  experience, not merely their judgement about it. A third strand, which is what I
  find most interesting, argues that most of the empirical demonstrations fail as
  demonstrations — that the effects can be explained by response bias, task demands,
  or by the fact that the measurement is itself contaminated by the very effect it
  is meant to detect. And a fourth strand, predictive processing, seems to make top-down
  influence so ubiquitous that the original dispute threatens to dissolve.


