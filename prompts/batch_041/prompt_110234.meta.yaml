  (1) A signal is honest only when it is costly enough that a lower-quality sender
  could not profitably fake it.

  (2) In human social life, kindness, generosity, and public moral commitment function
  as signals of quality or trustworthiness.

  (3) Therefore, such behaviors are honest only when they are costly enough to deter
  a self-interested faker.

