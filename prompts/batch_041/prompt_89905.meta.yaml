  Idea: Vagueness. Position: supervaluationism — a vague predicate like "tall" is
  such that there are many admissible precisifications; a sentence is true iff true
  on all admissible precisifications, false iff false on all, and neither (indeterminate)
  otherwise. Ask what would count against it. The standard objections: the "higher-order
  vagueness" problem (the meta-linguistic statement "it is indeterminate whether Harry
  is tall" is itself vague — supervaluationism seems to make higher-order vagueness
  impossible or requires an infinite hierarchy of precisifications, and the "definitely"
  operator in the object language is problematic); the "truth is not preserved" /
  failure of disquotational T-schema; the problem that "there is some precise cut-off
  point but we cannot know it" (epistemicism) vs supervaluationism''s denial that
  there''s a fact of the matter; the "admissible precisifications" notion presupposes
  the notion of "acceptable" which is itself vague — the "vagueness of the meta-language"
  objection; the problem of the relationship between supervaluationist indeterminacy
  and the intuition that vagueness is a feature of how we use words, not of the world;
  the "no distinguishing between penumbral cases and borderline" — the "problem of
  the many" etc.


  Also there''s the well-known "supervaluationism makes ''x is definitely F or definitely
  not F''... " Hmm.


  Alternatively: the coherence argument for expected utility maximisation — the position
  that rational agents maximise expected utility because otherwise they''re susceptible
  to a Dutch book / money pump. Defeaters: the money pump requires diachronic commitments
  across time with stable preferences; the "diachronic Dutch book" arguments fail
  if the agent doesn''t accept the package deal; the distinction between exploiting
  a single preference set vs sequences of choices; the "no-trade" theorems (e.g.,
  if preferences are incomplete); the objection that money pumps only show that inconsistent
  preferences can be exploited by a clever bookie, not that the agent is irrational
  in a robust sense; the "costless" assumption; the problem that expected utility
  maximisation requires the agent to be able to compare every pair of lotteries (completeness),
  and the coherence argument doesn''t establish completeness; the "Dutch book" arguments
  are of the "exploitation" form and arguably show pragmatic inconsistency rather
  than irrationality; the point that an agent with cyclic preferences can avoid exploitation
  if they refuse to sell/buy at the stated prices, or if there are transaction costs;
  the "money pump as a self-consistency argument" is often thought to establish only
