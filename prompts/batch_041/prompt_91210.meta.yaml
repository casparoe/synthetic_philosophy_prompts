  Draft:


  I''ve been reading rationalist blogs and forums for a long time, and I keep coming
  back to futarchy—the proposal to use conditional prediction markets to decide policy.
  Suppose we take the concrete version seriously: a jurisdiction defines a single
  metric of welfare (say, a composite index), holds a vote to fix that metric and
  the time horizon, and then, for any proposed policy, runs a decision market that
  pays out according to the metric''s value if the policy is adopted versus if it
  is not. If the market''s conditional price implies the policy will raise the metric,
  the policy is implemented; otherwise it is rejected. The slogan is that we vote
  on values and bet on beliefs.


  What philosophical commitments does this practice actually presuppose? I''m not
  interested in a bibliography or a survey of the literature. I want the implicit
  theory reconstructed: what view of value, of legitimacy, of rationality, and of
  causal inference does the institution need in order to make sense? Which rival views
  does it quietly rule out—value pluralism, deliberative democracy, deontological
  constraints, prioritarianism, the idea that some values are incommensurable? Where
  is the practice underdetermined, so that several theories could license it? And
  where are its parts in tension—for instance, does the separation between voting
  on values and betting on facts survive the fact that the choice of metric is itself
  a value-laden, potentially strategic decision, or that the market''s conditional
  price is not a pure counterfactual estimate because the policy''s adoption depends
  on that very price? I''d especially like to know whether the practice presupposes
  risk-neutrality on the part of traders, and if so, whether that is a substantive
  philosophical commitment or a merely convenient modeling assumption. Finally, if
  we replaced the presupposed view with a rival—say, a pluralist, deliberative, or
  deontological one—what would have to change in the institution''s design? Answer
  in under 800 words.


