  What philosophical commitments does futarchy presuppose? Let''s brainstorm to make
  prompt rich. The prompt can ask:

  - It presupposes a fact/value dichotomy: values are set by voting, facts by betting.

  - It presupposes that the relevant values can be captured by a single scalar metric
  (e.g., GDP, life expectancy, a composite index), and that the metric is measurable
  and comparable across policies.

  - It presupposes consequentialism: the right policy is the one that maximizes expected
  value of the metric.

  - It presupposes an epistemic theory: market prices are efficient aggregators of
  dispersed information, and conditional markets can estimate causal effects. This
  is a commitment about the possibility of counterfactual forecasting.

  - It presupposes a theory of legitimacy: outcomes of markets are legitimate inputs
  to coercion, or that governance can be legitimate without deliberation or consent,
  if it tracks welfare.

  - It presupposes a theory of rationality: traders are expected-utility maximizers,
  risk-neutral with respect to the metric? Actually prediction markets are for probabilities,
  not utilities. The market price is a probability, so it presupposes that probabilities
  are objective or intersubjective and that traders'' beliefs can be aggregated. It
  also presupposes that the metric''s value is not itself subject to market pricing,
  only beliefs about it.

  - It presupposes that there is no essential contestation about values, or that contestation
  can be confined to the metric choice. But the metric choice is value-laden and may
  be gamed.

  - It presupposes a sharp separation between "is" and "ought," and that markets are
  better at "is" while democracy is better at "ought."

  - It presupposes that the status quo is the default and that the market can estimate
  the counterfactual. But conditional prediction markets face problems: no real payoff
  for counterfactual, manipulation, thin markets, selection of traders, etc.

  - It presupposes that the metric is a common currency of value, i.e., commensurability.
  It rules out value pluralism, deontological constraints, rights as side constraints,
  deliberative democracy, epistocracy, etc.

  - It presupposes that the legitimacy of a policy is a function of its expected consequences,
  not its procedural history or the consent of the governed.

  - It presupposes that the market''s probability is a good guide to truth, i.e.,
  the efficient market hypothesis in a strong form.

  - It presupposes that the "values" voted on are stable and exogenous, but in reality
  they may be endogenous to the policy.

  - It presupposes that there is a well-defined counterfactual "what would the metric
  be if the policy were not adopted" and that traders can bet on it. This is a deep
  commitment about causality and possible worlds.

  - It presupposes that the metric is not manipulable by the policy in a way that
  makes the market''s prediction self-fulfilling or self-defeating. If the market
  predicts the policy will increase GDP, and the policy is adopted, the prediction
  may change behavior. The market''s conditional price may not be a pure estimate.

  - It presupposes a theory of collective decision-making: the aggregation of individual
  beliefs via prices, and individual values via votes. This is a form of epistemic
  proceduralism.

  - It presupposes that the metric is a good proxy for welfare, and that distributional
  concerns can be ignored or handled by the metric. That rules out prioritarian or
  egalitarian views that care about distribution beyond the mean.

  - It presupposes that the metric is cardinal and interpersonally comparable, or
  at least that changes in it are.

  - It presupposes that the market can price conditional claims about a single metric,
  but if the metric is multidimensional, no single market can capture trade-offs.
  So it presupposes a kind of monism about value.

  - It presupposes that the "vote on values" is not itself subject to strategic manipulation
  or that it can be kept separate from the "bet on beliefs." But the choice of metric
  affects which beliefs are profitable, so the separation is unstable.

  - It presupposes that the market''s participants are representative or that their
  bets are weighted by wealth, which raises questions of plutocracy. If bettors are
  wealth-weighted, then the epistemic aggregation is also a wealth-weighted aggregation,
  which may conflict with democratic legitimacy.

  - It presupposes that the market''s prices are not distorted by irrationality, bubbles,
  or manipulation, or that these are small.

  - It presupposes a particular theory of rationality: expected utility maximization,
  risk neutrality, and that traders can update on conditional probabilities.

  - It presupposes that the policy space is well-defined and that the market can compare
  two discrete options. But governance is continuous and combinatorial.

  - It presupposes that the metric is measured after the policy, but the time horizon
  is arbitrary. The choice of time horizon is a value judgment.

  - It presupposes that the market''s conditional price is a sufficient statistic
  for the policy''s expected effect, ignoring effect heterogeneity and distribution.

  - It presupposes that the policy is the only relevant change, ceteris paribus. But
  other things change.

  - It presupposes that the market''s participants have incentives to reveal their
  true beliefs, but prediction markets can be manipulated if the manipulator has other
  interests.

  - It presupposes that the market''s price is a probability, not a price that reflects
  risk aversion or time discounting. But if the payoff is in dollars, the price may
  reflect risk premia.

  - It presupposes that the metric is not itself a function of the market''s prediction
  (reflexivity). If the market predicts a recession, that can cause a recession.

  - It presupposes that the values voted on are not themselves affected by the market''s
  prediction. But they can be.

  - It presupposes that the market can handle the "public goods" problem of information
  acquisition; if the market is thin, no one may have an incentive to trade.

  - It presupposes that the metric is a public good and that the market''s outcome
  is a public good, so there may be underinvestment in information.

  - It presupposes that the market''s participants are not the same as the policy''s
  beneficiaries or losers, or that if they are, the market''s price is not biased
  by their interests. But if they are, they may bet on the policy they want, not what
  they believe. Prediction markets are supposed to separate beliefs from preferences,
  but if the payoff is money, and money is a preference, then a trader who wants the
  policy may bet on it even if they believe it will fail, to influence the outcome.
  This is the "manipulation" problem. Futarchy assumes that the market is thick enough
  that manipulation is unprofitable, but that''s an empirical assumption.

  - It presupposes a theory of value: welfarism, consequentialism, and a specific
  metric. It rules out deontological constraints, rights, and procedural justice.

  - It presupposes that the "values" are chosen democratically, but the metric is
  a single dimension, so it may not capture plural values.

  - It presupposes that the market''s prediction is a good guide to the policy''s
  effect, but the market is only as good as the traders'' information. If the policy
  is novel, there may be no good information.

  - It presupposes that the policy''s effect is measurable and that the metric is
  not subject to Goodhart''s law. If the metric becomes a target, it may be gamed.

  - It presupposes that the market''s conditional price is not affected by the fact
  that the policy will be implemented if the market says so. This is a performativity
  problem: the market''s prediction can change the policy''s effect. For example,
  if the market predicts a policy will increase GDP, investors may respond, making
  it true. Or if the market predicts a policy will fail, it may fail. The market''s
  conditional price is not a pure counterfactual estimate; it is a forecast of a world
  in which the policy is adopted because of the forecast. This is a self-referential
  problem. Futarchy assumes the market can estimate the counterfactual, but the counterfactual
  depends on the market''s estimate.

  - It presupposes that the market''s participants can distinguish between "the policy
  will be adopted if the market says X" and "the policy is adopted for other reasons."
