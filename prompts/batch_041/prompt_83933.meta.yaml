  Commitments:

  1. Psychiatric categories like depression, ADHD, PTSD are not natural kinds in the
  way chemical elements are; they''re "interactive kinds" — classifying someone changes
  how they experience and report symptoms.

  2. But I still think there are real causal processes underlying many psychiatric
  conditions, and the categories can get better at tracking them.

  3. I think diagnostic validity should be judged by whether the category supports
  successful intervention, not by whether it carves nature at its joints.

  4. I think patient self-understanding is epistemically important: a diagnosis that
  patients reject is likely missing something, and a diagnosis they embrace is likely
  tracking something.

  5. I think looping effects are a feature, not a bug: they''re how categories get
  calibrated to human variation.

  6. I think psychiatric research should aim for categories that are stable across
  cultures and time.

  7. I think the DSM''s move toward dimensional/transdiagnostic approaches is progress.

  8. I think it''s a mistake to say mental illness is "just" socially constructed.


  Tensions:

  - (1) interactive kinds + (6) stable across cultures/time: looping effects imply
  categories are unstable and culture-bound, so aiming for stability may be wrong
  or may require freezing categories, which conflicts with calibration.

  - (3) validity as intervention success + (2) real causal processes: pragmatic validity
  can diverge from causal structure; a category can be useful for treatment without
  tracking a unified cause (e.g., fever). But (2) says categories can get better at
  tracking causes; (3) doesn''t require it. Tension? Maybe apparent.

  - (4) patient self-understanding as epistemic + (1) looping effects: if patient
  uptake is itself a looping effect, then patient endorsement can''t be an independent
  source of evidence; it''s partly caused by the category. This is a genuine tension:
  using patient uptake as validation is circular if the category shapes the uptake.
  Good.

  - (5) looping as feature/calibration + (7) dimensional/transdiagnostic progress:
  dimensional approaches might reduce looping by avoiding labels, so if looping is
  good, moving away from categories may be bad. Or if dimensional approaches are progress,
  then looping effects are something to minimize, not celebrate. Genuine tension.

  - (2) real causal processes + (8) not just social construction: no tension, apparent.

  - (1) interactive kinds + (8) not just social construction: apparent tension, dissolves
  because interactive kinds can be real (Hacking''s point). Good.

  - (6) stable across cultures/time + (7) dimensional/transdiagnostic: maybe tension
  if dimensions are also culture-bound. Apparent.


