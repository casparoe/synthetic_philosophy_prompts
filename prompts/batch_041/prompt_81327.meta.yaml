  is whether the standard is public or held privately by whoever has power; invisibility
  of the standard is worse.

  (4) The second: tightness is not about publicity but about the *penalty gradient*;
  you can have public, gently enforced norms (loose in enforcement, tight in content)
  and that''s what people actually mean by a livable society. The harmful thing is
  a steep penalty on a norm no one can fully meet — "universal infraction" — which
  trains selective enforcement and favoritism.

  (5) The first: that''s the "no true tightness" defense; looseness in enforcement
  is just tightness about something else — about who is permitted to be lenient.


