  Let me lay out the moves carefully, ensuring both sides make genuinely good points,
  no strawmen, and each round responds to the previous.


  Move 1 (Ruth, pro-strictness): Rules with discretion are rules with a hidden second
  rule — the rule of whoever is deciding. If the standard is "reasonable excuse,"
  then the real standard is "what the person granting the excuse thinks is reasonable,"
  and the people who get the benefit of the doubt are the ones who talk like the deciders.
  A bright-line rule with a fixed penalty is a leveling device: it takes the judgment
  out of the hands of whoever is in charge.


  Move 2 (Malik, anti-strictness): Bright lines manufacture offenders. Any rule of
  the form "always X or pay" applied to a diverse group guarantees that the people
  who get fined are disproportionately the ones with irregular lives — shift workers,
  carers, people with unpredictable health — and not because they value the norm less.
  Discretion isn''t a leak in the rule; it''s how the rule stays attached to its purpose,
  which was a clean building, not a punishment schedule.


  Move 3 (Ruth): That''s an argument for *better* rules, not for vagueness. If the
  rule burdens shift workers disproportionately, the fix is to fix the schedule, not
  to leave the question of who gets excused to the person who happens to be holding
  the clipboard. And notice that the discretion version doesn''t remove the burden;
  it just moves the burden of proof onto the person who needs the exception, who now
  has to plead their case to a neighbor every month. At least a rule is something
  you can plan around.


  Move 4 (Malik): Here''s a test I''ve been turning over: ask what happens when everyone
  complies perfectly. A norm that''s there to coordinate us — which side of the path
  to walk on, what day the bins go out — becomes invisible and costless the moment
  compliance is universal; you stop noticing it and it stops mattering. A norm that''s
  there to sort us into who''s a good member and who isn''t cannot survive universal
  compliance; if everyone paid the fine on time and did the shift, the roster rule
  would have nothing to do, and the people who care most about it would start finding
  other things wrong with the same households. That''s the tell: rules that go quiet
  under compliance are doing work for all of us; rules that need visible failure to
  keep going are doing work for some of us.


