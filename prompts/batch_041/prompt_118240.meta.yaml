  The crux I want: The relativist challenge usually targets the transactional concept
  of corruption (misuse of public office for private gain), and the standard anti-relativist
  replies. But there are two moves the question should force:


  1. Notice that "Western standards" isn''t one thing: the classical republican concept
  of corruption (decay of civic virtue/the polity) is Western too, and it''s about
  the whole regime, not a transaction. So the relativist''s target is under-specified.
  Also this classical concept is arguably more universalizable since it doesn''t presuppose
  a bureaucratic state with public/private distinction — hmm, but it does presuppose
  a conception of the good polity.


  2. The functionalist move ("institutional corruption" / corruption as undermining
  institutional purpose) looks like it gives a culture-neutral standard because it
  defines corruption relative to the institution''s own purpose rather than to a substantive
  morality. The crux: this either (a) collapses into relativism at the level of the
  institution (the institution''s purpose is itself a contested social fact, and who
  gets to say? e.g., a kinship-based institution''s purpose might include favouring
  kin), or (b) requires an external, non-relative account of what the institution
  is *for*, which smuggles the norm back in. So the functional concept relocates rather
  than dissolves the disagreement.


  3. A third crux: the "public/private" distinction itself. The transactional concept
  presupposes a separation between office and person that is a specific historical
  achievement of the modern bureaucratic state; the anthropologist''s point isn''t
  moral relativism but conceptual incommensurability — different social ontology.
  That''s the strongest version of the challenge: not "different values" but "different
  concepts" — you can''t apply a standard that presupposes a distinction the practice
  doesn''t make. Counter: even within Western states the office/person separation
  is incomplete and contested (e.g., nepotism norms, family firms, lobbying).


  4. Also: the "unavoidability" argument — even if we can''t say a practice is corrupt
  in the local moral economy, we can ask whose interests are served and whether the
  practice is defensible to those it burdens, which is a universalist move without
  importing a Western legal category. E.g., a functional-accountability test: is there
  a way to criticise patronage without appealing to a Western standard? (Hmm, this
  might be too much for 700 words.)


