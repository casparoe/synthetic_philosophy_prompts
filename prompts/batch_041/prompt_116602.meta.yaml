  "I want to defend a view I''ll call role essentialism about letterforms. The question
  ''what makes every a an a?'' sounds like it''s asking for a shape invariant, some
  skeleton common to all a''s. I think that''s a dead end. There is no common stroke,
  no common topology, no common proportion. What there is, is a role: an ''a'' is
  whatever occupies a certain slot in a system of graphic distinctions that a community
  uses to encode language. The slot is defined relationally: it must be distinguishable
  from the other letters, it must be producible by the hand or tool, and it must be
  recognisable across the transformations that the writing system tolerates (slant,
  weight, size, contrast, stroke order, even some distortion). So the essence is a
  set of constraints, not a picture.


  Then style. Style is not decoration added to an essence. It''s a second-order pattern
  over the tolerances. If the essence fixes a region of shape-space, style is a systematic
  way of moving within that region: a deformation operator, a bias in how the constraints
  get resolved. Two typefaces can both contain all the letters and yet differ in style
  because their deformation operators differ. That explains why style can be recognisable
  even in a single letter, and why a letter can be unmistakably an ''a'' and unmistakably
  in a given style at once.


  I also want to say something about the counterfactual robustness. An ''a'' is an
  ''a'' if it would still be read as an ''a'' under the kinds of variation that the
  system routinely throws at it. This makes letter identity a bit like a fixed point
  or an attractor in a dynamical system of reading and writing. The boundaries are
  vague, but vague boundaries are not no boundaries. A blob that no one would read
  as an ''a'' fails; a weird ''a'' that a community accepts passes. The essence is
  therefore both normative and empirical: it''s what the practice treats as the same,
  and what the practice treats as the same is constrained by the perceptual and motor
  facts.


  The upshot: the question ''what makes every a an a?'' has no answer in terms of
  a shared visible feature. It has an answer in terms of a shared role in a system
  of differences plus a tolerance space. Style is the systematic residue of how a
  particular hand or font resolves that role. This also suggests that letter identity
  is not prior to style; the two are co-constituted. You can''t fully specify the
  essence without saying which variations are stylistic and which are errors, and
  that line is drawn by the practice."


