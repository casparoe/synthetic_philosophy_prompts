  The structure of the paradox: hypothesis H = "All F are G". Evidence E = an observed
  F that is G (a black raven) — genuine but weak confirmation. But by equivalence,
  H = "All non-G are non-F", so any observed non-G thing that is non-F (a green apple,
  a white shoe) also confirms H, trivially. The puzzle: (a) equivalence condition
  (if E confirms H and H is equivalent to H'', E confirms H''), (b) instance condition
  (an instance of a generalisation confirms it), and (c) the intuition that green
  apples don''t confirm "all ravens are black". You can''t have all three. Resolution
  options: Bayesian (the green apple does confirm, just immeasurably, unless the sampling
  process is biased in a certain way — the "standard Bayesian" or "Sampling" solution:
  observation of a non-black non-raven only confirms if the protocol might have found
  a raven, etc.), Hempel''s original (it does confirm, and that''s fine — the paradox
  is just that confirmation is cheap), etc.


