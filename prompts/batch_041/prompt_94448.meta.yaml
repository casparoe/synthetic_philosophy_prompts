  The puzzle they were arguing about: A traveler is stranded in the desert and will
  die of thirst unless someone gives him a ride. A driver appears and offers to take
  him to the nearest town on one condition: the traveler must promise to pay him a
  hundred dollars upon arrival. The promise cannot be enforced. The driver will drop
  him off and drive away, the two will never meet or hear of each other again, and
  no third party will ever learn what the traveler does. The traveler makes the promise,
  is believed, and gets the ride. On arrival he has the money; paying would cost him
  a hundred dollars and would change nothing else — the ride is already given, the
  driver is unaffected, and no one''s future conduct toward him depends on it.


  They went back and forth like this.


