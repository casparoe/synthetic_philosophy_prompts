  can work out that he will not pay, and so should refuse the ride. The traveler should
  see this coming. The only way to get the ride is to be someone who really will pay
  — not to intend to pay ''just this once,'' but to have the standing disposition.


  B: You cannot manufacture reasons by wanting a disposition. Being the sort of person
  who pays does not make paying rational at the moment of payment; it makes him the
  sort of person who reliably does the irrational thing at the end. That he would
  be glad, beforehand, to have that trait does not make the trait rational. It makes
