  only question is what paying will bring about. It will make him a hundred dollars
  poorer and bring about nothing else — the ride is finished, the driver is no worse
  off either way. So he keeps the money. And this does not make him a liar: at the
  moment he promised, if he really did mean to pay, he said nothing false.


