  ---

  I''m working on a long piece about whether it makes any sense to say that one person
  is better off than another — the old line that comparing two people''s welfare isn''t
  a scientific question because there''s no fact of the matter — and I need a centerpiece
  case for it. Every case I build is too easy for a skeptic to wave off, so I''m outsourcing
  the job. Here''s the spec.


  Build me a thought experiment in which two people''s situations get ranked in opposite
  directions depending on how you compare them, set somewhere real — a clinic deciding
  which of two treatments to fund, an insurer, a court working out damages, a workplace.
  One paragraph for the scenario itself. No trolleys, no ticking bombs, no utility
  monsters, no sci-fi, nobody immortal, no brain-in-vats, and no paralysed-saint-vs-rich-depressive
  cliché. Also don''t make either person simply wrong about their own life; if someone''s
  mistaken about themselves, I want that to be the contested bit of the case, not
  part of the setup.


  The two methods I want in conflict are (a) the preference route — compare by what
  each would choose, or by which of the two lives each would rather be living — and
  (b) the objective list route — compare by health, income, opportunities, whatever
  belongs on the list, regardless of what they say about it. I want a real conflict,
  not a rounding error: one method says the first person is worse off, the other says
  the second is, and that flips who gets the scarce thing. Neither option should dominate
  the other, so the Pareto crowd has nothing to say.


  Here''s the part I actually care about, because it''s where my drafts keep falling
  over. I want the preference comparison to pass a test I''ve been calling the return-trip
  test: run it in both directions. Both people get all the facts, including each other''s,
  and each is asked whether they''d rather live their own life or the other one, from
