  I am working on a paper on what I call lexical-threshold negative utilitarianism
  (LTNU). The view has two parts. First, the negative part: the disvalue of suffering,
  not the value of pleasure, is the primary axiological currency, so that a state
  of affairs is improved chiefly by the removal of suffering. Second, the lexical-threshold
  part: once suffering passes some threshold of intensity or duration, its disvalue
  dominates lexically -- no quantity of pleasure, however great, can compensate for
  a single instance of it -- while below the threshold pleasure and pain remain commensurable
  and trade off in the ordinary way. LTNU thus splits the difference between classical
  (lexical) negative utilitarianism and ordinary hedonic commensurability. I want
  to test it against a work of fiction rather than against further puzzle cases,'
