  \ the aggregate or the disaggregated is the right answer\". That works well: a set\
  \ of cases where a trend reverses upon partitioning, and the asker reports gut verdicts\
  \ about which level is the \"real\" answer, and asks what principle captures the\
  \ pattern.\n\nThat's a nice, meaty one — in the weeds (specific cases, real-world\
  \ reversal cases), meaningful without web access (no citations needed; the cases\
  \ can be described), and requires injecting niche/new cases. The prompt should include\
  \ a couple of invented/constructed cases so the model can't regurgitate.\n\nBut\
  \ careful: the hard rule — never quote from memory. If I mention real cases (UC\
  \ Berkeley admissions, kidney stones), that's fine as long as I don't quote. I should\
  \ avoid specific numbers I'm not sure of. Actually the well-known Berkeley 1973\
  \ case is fine to describe qualitatively. But better: invent cases to avoid depending\
  \ on unverified specifics.\n\nHmm, but the domain choice — let me consider \"Is\
  \ beauty objective? Hume's standard of taste\". Verdicts on cases: is this painting\
  \ beautiful, etc. But the asker's verdicts would be about judgments of taste — that's\
  \ plausible: \"I think X is genuinely better than Y, but I think Z's judgment is\
  \ merely personal.\" Then ask what principle captures the pattern. That works too.\n\
  \nSimpson's paradox is more tractable and interesting: the asker gives verdicts\
  \ on whether the aggregate or the disaggregated comparison is the \"correct\" one\
  \ in a set of cases, and asks for the principle. The candidate principles: causal\
  \ reasoning (Pearl), \"no causal story\" / the \"which variable is the treatment\"\
  \ heuristic, \"the right level is the one that answers the question of interest\"\
  \ (Hitchcock), etc.\n\nLet me write concrete cases with verdicts:\n\n1. A drug looks\
  \ worse overall than a placebo but better in every subgroup (because the drug was\
  \ given to sicker patients). Verdict: the subgroup result is correct; the drug is\
  \ effective. Intuition: the partitioning variable is a confounder.\n\n2. Reverse\
  \ case: a drug looks better overall but worse in every subgroup... hmm, that requires\
  \ the confounding structure to flip. Actually: \"Doctor's choice\" cases.\n\n3.\
  \ A case where the aggregate is right: the partitioning variable is a mediator/effect\
  \ of treatment (like \"blood pressure lowering\"), so conditioning on it is illegitimate.\
  \ E.g., a drug that works by reducing a certain intermediate marker; conditioning\
  \ on the marker removes the effect. Verdict: aggregate is right.\n\n4. A case where\
  \ neither level is \"the\" answer because the question is about a population: e.g.,\
  \ a college admissions case where each department admits men at higher rates, but\
  \ overall women are admitted at higher rates because women apply to less competitive\
  \ departments. Verdict: I think the aggregate is right for the question \"does the\
  \ university discriminate\" — no, wait. In Berkeley's actual case, the aggregate\
  \ favored men and disaggregated favored women? Let me recall: Berkeley 1973, overall\
  \ men admitted at higher rate, but most departments favored women. The conclusion\
  \ was that the aggregate was misleading and no department discriminated against\
  \ women. Hmm. So the verdict there: the disaggregated result exonerates.\n\nBut\
  \ I want at least one case where the asker's verdict is \"the aggregate is the truth\"\
  \ — e.g., where the partitioning variable is a mediator. And a pair that's hard\
  \ to reconcile: two cases with the same formal structure (confounder vs. mediator)\
  \ that look alike but get opposite verdicts, so the principle must be causal, not\
  \ statistical.\n\n5. A case where the asker's verdict is \"there's no fact of the\
  \ matter; it depends on the question\" — e.g., a case about a company's hiring where\
  \ the subgroup split is by a variable that is itself the outcome of interest.\n\n\
  6. A case where the asker feels the reversal itself is evidence of something, e.g.,\
  \ a case where the direction of the reversal tells you which variable to condition\
  \ on... hmm.\n\nAlso good to include a case with the asker's verdicts on a case\
