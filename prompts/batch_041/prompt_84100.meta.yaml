  I am a novelist at work on a book about a predictive bureaucracy, and I have been
  reading Popper''s The Poverty of Historicism alongside Asimov''s Foundation novels.
  I would like a critical reading of the Foundation series through Popper''s critique
  of historicism -- not a summary of the plot, and not a verdict on whether psychohistory
  could ever be real, but an argument about what the novels dramatize, complicate,
  and get wrong about the possibility of laws of history.


  Popper''s case against historicism turns on a set of distinctions the novels seem
  to stage without naming. There is the difference between a trend and a law: a trend
  is a statistical regularity that holds for a time and place, while a law is universal
  and supports counterfactuals. There is the Oedipus effect, in which a prediction
  can become a cause of the predicted event, so that the growth of knowledge -- including
  knowledge of the prediction -- makes the future course of history unpredictable.
  There is the charge that historicism slides into a conspiracy theory of society,
  explaining events by hidden designs rather than by the unintended consequences of
  action. And there is Popper''s own alternative: not prophecy but situational logic,
  the reconstruction of an agent''s situation so that the action becomes intelligible
  without appeal to historical laws.


  Read the Foundation novels against that grid. Where does psychohistory look like
  exactly the target of Popper''s argument, and where does it look like a reply to
  it? Hari Seldon''s plan is a statistical prediction that works only because it is
  secret and because individuals are unpredictable; does that secrecy make the plan
  a dramatization of the Oedipus effect or an evasion of it? The Mule is usually taken
  as the refutation of psychohistory, but is he a refutation of the possibility of
  historical laws or only a demonstration of their scope conditions -- masses yes,
  great individuals no? The Second Foundation''s hidden mentalics may be the novels''
  most Popperian moment, since it turns historical explanation into the very conspiracy
  theory Popper warns against. And the Foundation''s recurring crises are often solved
  not by prediction but by situational logic: the traders and mayors infer the necessary
  move from the constraints of their position. Does that vindicate Popper''s alternative
  or merely relocate the problem?


