  I am a retired microbial physiologist — thirty-five years on the anaerobic side,
  mostly at the bench — who took up philosophy of biology after I gave up my laboratory,
  and I now sit as the outside member on our institute''s Advisory Committee on Novel
  Self-Replicating Systems. We have a case before us, and I have been asked to draft
  the written opinion that will go into the papers. I would be grateful for your help
  in drafting it.


  The case. A group in our chemical biology division has built what they call a protocell,
  and they want it reclassified. In outline: fatty acids in the medium (oleic acid
  with a little decanol) spontaneously form vesicles; inside each vesicle is a 190-nucleotide
  ribozyme that copies itself, and copies nothing else. Nucleoside triphosphates,
  fatty-acid precursors and buffer are all supplied by the experimenter. The system
  cannot make its own monomers, cannot hold its own pH or redox gradients, and does
  nothing that we would ordinarily call metabolism beyond polymerisation. What it
  can do is evolve: copying is error-prone, faster-replicating variants take over,
  and over some three hundred serial transfers the group has documented a lineage,
  including a variant that lost a stem-loop and replicates about forty per cent faster
  than its ancestor. The vesicles themselves are not inherited — they form de novo
  from the medium and their contents are split stochastically when they are sheared
  — so it is not obvious whether the individual that is being selected is the vesicle
  or the RNA lineage inside it. The group has also found that the ribozyme survives
  in spent medium at four degrees for at least six weeks, in residual vesicles, and
  resumes replication when fresh monomers are added. Our treatment plant discharges
  into a phosphate-rich river. The safety officer''s position is not that it would
  flourish there; it is that we cannot say that it could not.


  The two classifications on offer. If the construct is a living organism, it falls
  under containment level 2, all waste is autoclaved, bench work stays in a cabinet,
  and we report annually to the national authority. If it is a chemical reagent, it
  goes down the sink with the rest of the chemistry waste and no one outside this
  building ever hears of it. The group wants the second; they argue that a replicating
  molecule is not an organism. Our charter, drafted for planetary protection in the
  1990s and inherited by us unexamined, defines what it governs in two clauses: a
  chemical system that maintains itself far from equilibrium, and a chemical system
  capable of Darwinian evolution. It does not say whether both are required or either
  suffices, and this construct is a clean case of the two clauses pointing in opposite
  directions.


  What I need. A memo I can circulate before we meet on 12 June, recommending a decision
  the committee can act on, with a timetable. It must give reasons rather than a verdict
  by fiat, and it must state the opposing case at its strongest — the safety officer
  will be in the room and I would rather she recognise her own argument in my memo
  than find a straw man. It should also leave us a test we can apply to the next case,
  because there will be one: the same question is waiting on a prion-like agent in
  the animal house and on a self-propagating mineral system in geochemistry, and we
  have already deferred both once.


  Two further things. First, please argue from the facts above and from first principles,
  not from the literature on the definition of life; I cannot check references, and
  neither can you, and a bibliography would be no use to a committee that has to decide
  on Thursday week. Second, I have a suspicion I would like you to confirm or kill.
  I suspect that "is it alive?" is the wrong question to put to this committee, and
  that what we actually need to decide is which purpose of the containment rule the
  case falls under — the rule exists, so far as I can see, to catch replicators that
  could persist and spread outside containment, and this one replicates and persists,
