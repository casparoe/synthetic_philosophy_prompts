  "The first-pass questions I''d use to carve the space, though you should add or
  subdivide as the space demands, are these: (1) Does the obligation depend on a social
  practice of promising already existing in the community, so that the words ''I promise''
  in a world with no such convention would do nothing? (2) Is ''you promised'' a reason
  that counts in favour of the promised act whatever the act is, or does it only add
  weight to reasons you already had to do that act? (3) Is the obligation owed to
  the promisee — a claim of hers that she can waive, and that she can invoke even
  if she is never harmed — or is it a reason about her that is owed to no one in particular?
  (4) Is the ground of the obligation the promisee''s reliance or assurance, the promisor''s
  own interest in her authority over her own future conduct or in her integrity, or
