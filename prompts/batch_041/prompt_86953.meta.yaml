  Proposed first-pass axes (questions):

  1. Does the obligation depend on there being an existing social practice/convention
  of promising in the community? (conventionalism vs non-conventionalism)

  2. If not conventional: what does the promisor do — transfer a right / grant an
  authority / invite reliance / place herself under a norm / create a joint commitment
  / create a new reason by a kind of "normative self-creation"?

  3. Is the obligation owed to the promisee specifically (directed, second-personal,
  with a correlative right that the promisee can waive) or is it a reason that''s
  merely "about" the promisee / owed to no one in particular?

  4. Is the ground of the obligation the promisee''s interest (reliance, expectation,
  trust), the promisor''s interest (integrity, the value of commitment, authority
  over her own normative world), or something impersonal (the practice, utility, the
  value of a certain kind of relationship)?

  5. What happens when things go badly: is the obligation defeasible/graded (Ross-style
  prima facie) or absolute-ish (special obligation that can conflict but not be outweighed
  by mere utility)? Is the relevant comparison the expected value of keeping vs breaking,
  or the wrong of the breach itself?

  6. Is the promise''s bindingness a matter of morality at all, or of rationality/prudence
  (Hobbesian) — and if the latter, is it a "rational requirement" or just instrumentally
  rational?

  7. Does the answer depend on the promisee''s knowledge/acceptance? (invitation to
  rely vs. acceptance-based — the "offer/acceptance" model, so that promises to the
  dead / to those who don''t know aren''t binding in the same way) — the "assurance"
  family.

  8. Enforcement/authority: does the promisor acquire an authority over the promisee''s
  will? Is the promise a "transfer of authority over one''s own conduct"? (Owens-ish:
  promisor gives the promisee a "normative power"? Actually Owens: promising as "granting
  the promisee an authority over whether the promisor acts"; and "bare wronging".)

  9. Does breaking a promise wrong the promisee even if no harm occurs and even if
  the promisee never finds out? (the "bare wronging" question, and the "harm" vs "wrong"
  distinction.)


