  Injection ideas for closure/tracking that are niche but not obscure-to-LLMs:

  - The distinction between closure as a principle about knowledge (Kp ∧ K(p→q) →
  Kq) and about justification.

  - Nozick''s rejection of closure, and the "abominable conjunction" (DeRose''s term)
  — that he must accept "I know I have hands but I don''t know I''m not a brain in
  a vat".

  - Sensitivity vs. safety (Williamson/Sosa) — safety being a rival that preserves
  closure; and the "generality problem" for both.

  - The "lottery proposition" (Hawthorne''s Knowledge and Lotteries, 2004): the tension
  between closure and the intuitive "you don''t know you won''t win the lottery".

  - Vogel''s "bedrock" / "the lottery paradox" and "sensitivity''s" verdict on inductive
  knowledge: Nozick''s theory says we don''t know lottery propositions and that we
  don''t know inductive generalizations in a way that conflicts with ordinary usage
  — the "sensitivity''s skepticism about induction".

  - The "adherence" condition: if p is false you wouldn''t believe it (Nozick''s condition
  4).

  - Also "the tracking theory requires the method to be held fixed" (Nozick''s method-relative
  sensitivity) — the "method" is a "way of arriving at belief".


