  Safe enough to gesture at without dates.


  6. Also the point: the metatheory in which we state LS is itself a set theory; "countable"
  in the metatheory. There''s a "Skolemite" regress worry. And the paradox doesn''t
  show inconsistency (Gödel''s incompleteness is a different matter; the paradox is
  not a contradiction).

  7. Also: the paradox arises from the failure of absoluteness of power set and cardinality;
  the "internal/external" distinction. Also relevant: the model''s ω is correct (ω
  is absolute for transitive models), so M''s naturals are the real naturals.


  For a good exam question: ask students to (a) state precisely what the paradox is
  and why it isn''t a contradiction; (b) diagnose the flawed argument, identifying
  the specific false step and explaining what would need to be true for the argument
  to work; (c) evaluate the stronger philosophical conclusion (relativism about cardinality)
  and say what would have to be shown to sustain it, and what the best reply is; (d)
  possibly say whether the paradox has any bearing on whether our set-theoretic practice
  is legitimate.


