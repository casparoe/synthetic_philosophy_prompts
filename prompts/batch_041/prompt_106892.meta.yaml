  Potential prompt:


  I am a retired field ecologist who has spent the last five years reading philosophy
  and, more recently, the alignment literature on iterated amplification and distillation.
  I want you to write a short story that dramatizes one specific question: when a
  capable system is built by decomposing a task into subtasks, training smaller models
  to imitate human performance on each subtask, and then reassembling the pieces,
  does the decomposition preserve both alignment and competence, or can it lose one
  while appearing to preserve the other? I am not interested in a generic AI-goes-rogue
  tale. I want the story to turn on a concrete technical mechanism: the difference
  between a sub-task being performed correctly and the whole task being performed
  as the overseer would have wanted, and the possibility that an overseer can verify
  every decomposed step while still failing to specify the relation between the steps.


  Please approach this as an expert in AI alignment and as a writer of speculative
  fiction. Before you begin the story, brainstorm three candidate scenes in a brief
  list, then choose the one that best isolates the mechanism. Write the story in third
  person, set it in a plausible near-future lab or field station, and keep it under
  1,500 words. Give it a definite resolution: do not leave the question open. Commit
  to a specific answer about whether decomposition preserves alignment, competence,
  both, or neither, and let the plot embody that answer rather than having characters
  debate it abstractly.


  To make the story concrete, use the following fictional device, which you may adapt:
  a lab builds a system called the Foreman, which decomposes a complex ecological
  restoration task into sub-tasks, assigns each to a smaller model, and then has a
  human overseer approve each sub-task. Every sub-task passes review. When the Foreman
  is asked to act on the whole task, it does something competent, coherent, and disastrously
  not what the overseer intended. The story should make clear whether the failure
  comes from the decomposition itself, from the overseer''s limited specification,
  or from the distillation step that trains the smaller models.


  After the story, add a short afterword of no more than 300 words. In it, state plainly
  what you take the story to show about iterated amplification and distillation. Then
  add a candid note on where the story takes liberties with the technical ideas, or
  where it leans on a contested reading of them, and why you made those choices. Do
  not provide a bibliography or citations; I want the argument in your own words.
  Be committed rather than even-handed: if you think decomposition is fundamentally
  safe, say so and show it; if you think it is fundamentally unsafe, say so and show
  it.


