  process that nonetheless "tracks" reasons.)


  Activity design idea: "The Room That Was Smarter Than Everyone In It."


  Concrete: 12-16 writers. Give each a card with a private rule (a "policy") — like,
  "if you see two people standing, stand; if someone stands directly in front of you,
  sit", etc. Rules are simple and local, each player also has a private payoff. They
  interact in rounds. The aggregate settles into a stable configuration that looks
