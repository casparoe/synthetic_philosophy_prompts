  The material constitution debate has great precise structure:

  - Identity thesis: the statue just is the clay (monism; but then how can they differ
  in persistence conditions, e.g., the clay survives squashing, the statue doesn''t?)

  - Constitution view (Wiggins, Baker): distinct objects, same matter, constitution
  is not identity.

  - Four-dimensionalism / temporal parts (Sider, Heller): the statue is a temporal
  part / the clay is a 4D object with the statue as a part; "the statue is the clay
  during that interval."

  - Eliminativism about composite objects / mereological nihilism (van Inwagen): there
  are no statues, only simples arranged statue-wise.

  - Relative identity (Geach): the clay and the statue are the same "thing" but different
  "sorts" — "the same lump" vs "the same statue."

  - Deflationism/conceptualism: it''s a verbal dispute; different counting conventions.

  - Dominance/"the problem of the many."

  - Burke''s puzzle (the case of a statue and a lump that come into existence at the
  same time), the "grounding problem" (Bennett: how can distinct but coincident objects
  differ modally yet be grounded in the same matter?), the "no difference" argument.

  - The Leibniz''s Law arguments on both sides; the "property" that differentiates:
  the statue is "created by an artist," "could survive..." etc.


