  I need a thought experiment, and the whole point of it is that the strong version
  of the relativity claim is *true* inside the case — the language someone speaks
  makes a particular thought genuinely unavailable to them, not just harder, not just
  less habitual. The reason I want this is that I keep getting into arguments with
  people who say the whole "language shapes thought" thing is either trivially true
  or untestable, and I want a case where it''s neither.


  Constraints, and these are the hard part:


  - Not one of the stock examples. No color terms, no number words (no Pirahã), no
  time-as-space metaphors, no absolute cardinal directions, no gendered pronouns.
  Those are all burned.

  - The difference has to show up in a task with no language in the loop — no reading,
  no talking, no labelling, no self-report. So the standard dodge where the effect
  is only there while you''re actually speaking or listening is off the table.

  - The two communities are matched on everything else that could explain a gap: same
