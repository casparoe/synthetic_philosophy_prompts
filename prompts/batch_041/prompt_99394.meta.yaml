  I have no formal training in philosophy, but I have been thinking about advance
  directives since watching Still Alice, and I would like a reading of the film through
  the problem of the authority of the earlier self. In the film, Alice Howland, a
  linguistics professor with early-onset Alzheimer''s, records a video message to
  her future self instructing that self to take an overdose of sleeping pills once
  she can no longer answer a set of personal questions. The film later shows her finding
  the video, gathering the pills, and being interrupted before she can act; by the
  end she can barely speak, and the film''s final note is not obedience but a word
  about love. The standard debate in bioethics asks whether a competent person''s
  earlier wishes should bind the later, incompetent person, and whether the later
  person is the same self at all. I am interested in a version of the question that
  the film seems to dramatize but not settle: is an advance directive better understood
  as a command issued by one self to another, or as a letter from an earlier self
  to a later self who is under no obligation to obey it? If it is a command, what
  gives the earlier self authority over someone who may no longer share her values?
  If it is a letter, does the later self''s present experience have any authority
