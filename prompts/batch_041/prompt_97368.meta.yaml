  Let''s design the argument carefully so it''s genuinely hard.


  Argument (greedy reductionism):


  (1) Whenever a higher-level pattern (a biological trait, a belief, an institution)
  makes a causal difference to what happens, that difference must be grounded in the
  fundamental physical facts: the complete physical state of the world plus the laws
  fixes whether the pattern is present and what it does.

  (2) If the higher-level pattern is fully grounded in the physical facts, then citing
  it adds nothing to a physical explanation; it is at best a convenient summary.

  (3) If citing it adds nothing, then it is not an explanation in its own right, and
  the pattern is not a genuine cause.

  (4) So every genuine causal explanation is ultimately a physical explanation; higher-level
  sciences are either shorthand for physics or they are skyhooks.

  (5) But natural selection is not shorthand for physics: it explains adaptation by
  citing differential reproduction, heritable variation, and selection pressures,
  and these explanations are not derivable in practice from physics.

  (6) Therefore natural selection is a skyhook, or else it is not an explanation.

  (7) But natural selection is the paradigmatic crane; if it is a skyhook, then either
  Darwinism is false or the dilemma is false.

  (8) Therefore the dilemma in (1)-(4) is false.


  Question: Where does it go wrong? Which premise to reject, what does rejecting it
  cost? The asker might say they''d rather keep (5) and (7) than (4). Need price alternatives.


  The subtle flaw could be (1) or (2). The flaw: (2) assumes that if a higher-level
  fact is grounded in physical facts, it cannot be a distinct explanatory level. But
  grounding is not identity; a pattern can be grounded yet explanatory because it
  captures a stable counterfactual dependence that physical description obscures.
  Or (1) assumes causal closure entails explanatory closure. Or (3) conflates "adds
  nothing to physics" with "adds nothing to explanation." The "crane" idea: natural
  selection is a mechanism that is physically implemented but not reducible in the
  sense of being derivable from physics alone; it is a crane, not a skyhook. The flaw
  is a false dichotomy: either reducible to physics or a skyhook. Dennett''s point:
  cranes are higher-level mechanisms that do explanatory work without being skyhooks.
  So the argument proves too much because it would also eliminate natural selection,
  which is the very crane that avoids skyhooks.


