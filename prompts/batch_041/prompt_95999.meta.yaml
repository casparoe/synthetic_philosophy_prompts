  no later line picks up and that depends on nothing, so that it is genuinely undecidable
  whether it is the foundation the whole poem was resting on or simply where you,
  the poet, stopped. That ambiguity is the point, so do not resolve it in either direction.


  Two constraints. Do not use words of time — before, then, first, origin, began —
  because the dependence here is one of depth, not sequence, and the moment the poem
  sounds like a chain of events it has become the wrong chain. And if it fits naturally,
  let one stanza quietly raise the question of which way the dependence runs — whether
  the small parts hold the whole up, or the whole is what the parts hang from — and
