  I have no training in philosophy and no library to speak of, but there is a puzzle
  I have been living with for months, and I would like you to write me a poem that
  makes it felt rather than explained.


  The puzzle is about a kind of dependence that has nothing to do with time. Some
  things are the case because other things are the case — not because those other
  things happened earlier, but because they are more basic. A pane of glass is brittle
  because of how its molecules sit; the sitting does not come before the brittleness,
  it underlies it. Let me call this the in-virtue-of relation: whenever something
  is so, there is meant to be something else in virtue of which it is so. Now push
  on it. If every fact holds in virtue of a more basic fact, then one of three things
  must be true. Either the chain of in-virtue-of stops somewhere, at something that
  is simply so and so in virtue of nothing further; or it never stops, and there is
  no bottom at all; or it bends around and rejoins itself, so that the whole chain
  is what holds up each of its links. A foundation, a bottomless tower, or a circle.


  Here is what I cannot get past. Every argument I can find against the circle turns
  out to be an argument about time — you cannot be your own cause, because a cause
  must precede its effect — and in this case there is no time to appeal to. The basic
  is not earlier, only deeper. So I cannot see why a circle should be impossible;
  and yet a circle feels like nothing is being explained, because each link holds
  only because the next does, and none of them ever touches ground. I want a reader
  to feel that vertigo from inside it, not be lectured about it.


  So: write the poem as a pantoum. In that form the second and fourth lines of each
  stanza return as the first and third lines of the next, and the closing stanza folds
  the opening lines back in, so the poem is itself a chain in which each line leans
  on the next and the whole thing finally shuts on itself. Let the interlocking do
  the work of the regress, and let the closing fold be the circle given its full due
  — not a cheat, not a joke, but the real temptation.


