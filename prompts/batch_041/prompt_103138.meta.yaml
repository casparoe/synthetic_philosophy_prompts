  an artifact has a determinate political valence exactly when its profile is invariant
  across the range of contexts in which it can be plausibly deployed, up to the identity
  of the positions involved; when the profile varies with context, the artifact is
  politically plastic, and any politics it appears to have is borrowed from the surrounding
