  not reassurance.


  The thesis, briefly: we lump two things under "aesthetic testimony." Testimony that
  a work is *good* — well made, worth the time, rewarding to the right reader — can
  transmit knowledge the ordinary way; it''s a warranted belief about a property the
  work has, and a reliable critic is a reliable informant. Testimony that a work is
  *beautiful*, or moving, or sublime cannot transmit knowledge of that, because those
  predicates are indexed to a response that only acquaintance produces. So the old
  principle that you must judge for yourself is half right, and both its defenders
  and its critics have spent decades on the wrong half. I also claim that the way
  criticism actually works is not belief transmission at all but perceptual re-education:
  a good critic teaches you to notice the thing, and then your own response does the
  rest.


