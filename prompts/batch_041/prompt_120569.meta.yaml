  "In a survey of metaphysics I''m reading, the author explains Bradley''s regress
  like this: ''Bradley showed that relations are self-undermining. If a relation R
  holds between a and b, then for R to actually relate them, it must itself be related
  to a and to b. But that requires a further relation R1 to relate R to a and b, and
  then R2 to relate R1 to R, a, and b, and so on without end. Since this regress is
  vicious, no relation can ever do the work of uniting its terms. Bradley concluded
  that relations are unreal and that reality is a single undifferentiated whole. The
  same problem, he thought, infects propositions: a proposition is just a collection
  of terms, and no relation can bind them into a unified content, so judgment is impossible.
  Russell later answered Bradley by showing that the regress is harmless: a relation
  relates its terms without needing a further relation, because relating is just what
  relations do. This is why contemporary philosophy accepts relations and rejects
  Bradley''s monism.''"


  Now, what are the subtle errors?


  1. "Bradley showed that relations are self-undermining." — Bradley did present the
  regress, but his aim was not to show relations are "self-undermining" in the sense
  of logically impossible; he argued that relations are not ultimately real, but they
  are real at the level of appearance. The regress is used to show that the concept
  of a relation as an independent entity leads to an infinite regress, which he took
  to be a sign of its inadequacy for ultimate reality. However, he did not conclude
  that relations are "unreal" in a straightforward sense; he thought they are real
  in the world of appearance but not in the Absolute. So "relations are unreal" is
  an overstatement or a simplification. Actually, Bradley''s conclusion is often summarized
  as "relations are not real" in the sense of not being ultimately real. But the summary
  says "relations are unreal and that reality is a single undifferentiated whole."
  The "undifferentiated whole" is a caricature; Bradley''s Absolute is not undifferentiated
  (it includes all distinctions in a harmonious whole). So that''s an error.


  2. "Since this regress is vicious, no relation can ever do the work of uniting its
  terms." — Bradley did consider the regress vicious for the notion of a relation
  as an independent entity, but many philosophers (e.g., Russell) argue the regress
  is not vicious. The summary presents it as a settled fact that the regress is vicious,
  which is contentious. Also, "no relation can ever do the work of uniting its terms"
  — this is the conclusion Bradley draws, but it''s not a neutral statement; it''s
  his view. The summary presents it as a logical consequence, which is a subtle overstatement.


  3. "The same problem, he thought, infects propositions: a proposition is just a
  collection of terms, and no relation can bind them into a unified content, so judgment
  is impossible." — This conflates Bradley''s regress with the unity of the proposition.
  Bradley did discuss the unity of judgment, but the problem of the unity of the proposition
  is distinct: it''s about how the constituents of a proposition are unified into
  a single truth-evaluable content. Bradley''s regress is about the relation between
  a relation and its terms. While related, they are not the same problem. Also, Bradley
  did not think judgment is impossible; he thought it is a form of appearance, and
  he had a theory of judgment. So this is a misrepresentation.


  4. "Russell later answered Bradley by showing that the regress is harmless: a relation
  relates its terms without needing a further relation, because relating is just what
  relations do." — Russell did argue that the regress is not vicious, but the phrase
  "relating is just what relations do" is a bit of a caricature. Russell''s answer
  is more nuanced: he held that relations are real and that the regress is not a genuine
  problem because the relation does not need to be related to its terms by another
  relation; the relation itself is what connects them. This is often called the "relation
  is not a term" or the "external relations" view. But the summary''s phrasing is
  plausible. However, the summary says "This is why contemporary philosophy accepts
  relations and rejects Bradley''s monism." That''s an oversimplification; many contemporary
  philosophers accept relations, but Bradley''s monism is not simply rejected; it''s
  a live option in some forms (e.g., absolute idealism has few adherents, but monism
  in general is discussed). Also, Russell''s answer did not fully solve the unity
  of the proposition; his multiple relation theory of judgment faced problems (e.g.,
  the problem of false judgment). So the summary''s implication that Russell solved
  both problems is an error.


