  I am a novelist. My work is ensemble fiction with rotating third-person limited
  point of view, and I hold to a strict formal rule: no chapter may contain more than
  one consciousness, and every death must be either dramatized in scene or reported
  in a single flat line. I am now writing a sequence in which a rescuer can save either
  one character or five, and I want to understand what Taurek''s position—his challenge
  to the idea that the numbers themselves settle what one ought to do, that five lives
  outweigh one—looks like when restated in the vocabulary I actually use. Please translate
  that position, as faithfully as you can, into the terms of narrative craft: focalization,
  narrative distance, scene and summary, character arc, dramatic need, stakes, the
  reader''s attachment, the difference between a death we witness and a death we are
  told about, the moral weight a novel confers simply by granting interiority. Do
  not smuggle in the philosopher''s assumptions and call them translation; keep the
  translation honest. Then give me the residue report. Which parts of Taurek''s argument
  map cleanly onto narrative terms? Which parts translate only with distortion, and
  what exactly is lost or added? Which parts have no counterpart in the novelist''s
  vocabulary at all? Finally, tell me what the residue suggests: is it a defect of
  narrative craft—something novels cannot say—or a sign that the philosophical claim
