  ---


  I teach a 300-level seminar (war and morality, cross-listed with poli sci) — 18
  students, one 90-minute block, and I want them playing a game for most of it, not
  listening to me. Here''s the thing I keep failing to land on the whiteboard: a threat
  you would never actually carry out is worth nothing, and the way you make it worth
  something is to hand part of the decision to something outside your own control
  — a dice roll, a subordinate with standing orders, a deadline that runs out on its
  own. The nasty part is that this works, so both sides do it, and then neither can
  dial it back without losing, and the danger ends up being manufactured jointly by
  two people who would each prefer less of it.


  I want a game where they discover, in the middle of playing, that they''d rather
  not be in control of their own decision. Then I name the thing afterward.


  What I need from you:


  Rules and materials for something two teams can play in about 20 minutes and then
  replay faster with a twist in it, plus a full timeline for the 90 minutes (setup,
  play, replay, debrief).


  The top of the escalation ladder has to be genuinely dumb to choose on its own,
  in plain expected-value terms, so that "we''ll go all the way" reads as an obvious
  bluff. Do the arithmetic for me and put the numbers in the rules — if pushing the
  button isn''t EV-negative at the last rung, the whole exercise is fake and I''d
  rather know that now. Keep it to arithmetic a first-year can do in their head.


  Some private information that only leaks through behavior — what each side actually
