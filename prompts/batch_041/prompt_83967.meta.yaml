  course on "War and Morality" or a political science seminar on security studies,
  18 students, 90 minutes.


  Game: "The Ladder." Two teams (or three?) — two delegations, each with a leader
  who is the only one who can push the button, but the escalation steps can be chosen
  by the delegation. Each team has a private "resolve" die (their actual willingness),
  and there''s a shared "risk die" that gets rolled each round and whose chance of
  catastrophe increases with the escalation level. Payoffs: if you back down you lose
  some stake (territory/prestige points), if you escalate you might win more, if catastrophe
  happens both lose massively.


  The key design: the threat to launch at the top of the ladder is not credible because
  launching is strictly worse for you than backing down (catastrophe costs you more
  than the stake). So the only way to get leverage is to raise the shared risk of
  accident — to make the catastrophe partly out of your control. Participants will
  discover that they win more by making the situation *less* under their control.
  Then the debrief maps this onto Schelling''s "threat that leaves something to chance"
  and the "competition in risk-taking."


