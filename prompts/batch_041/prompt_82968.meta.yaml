  \ not honored.\n\nLet me design so P and Q both fit:\n\nPrecedent 1: Severe dementia,\
  \ directive refusing antibiotics — withheld. (P: identity gone → directive binds.\
  \ Q: valid directive → binds.)\nPrecedent 2: Moderate dementia, patient says she\
