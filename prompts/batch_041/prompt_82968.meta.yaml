  \ antibiotics. (This is really about interpreting the directive's condition.)\n\n\
  Hmm, that muddies it.\n\nLet me try a cleaner set that supports two rules:\n\nRule\
  \ 1 (Precedent/self-binding / Dworkin critical interests): The earlier self's directive\
