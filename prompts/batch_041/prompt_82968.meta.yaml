  \nType: Predict or recommend a verdict on a new case from someone's verdicts on\
  \ earlier cases.\n\nLet me think about which domain fits best.\n\n\"Advance directives\
  \ and the authority of the earlier self\" — this is a great fit for the verdicts-to-new-case\
  \ type. A bioethics committee with precedents about advance directives. Or a philosopher\
