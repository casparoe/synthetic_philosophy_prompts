  \ or vice versa.\n\nThat's nice and in the weeds! And it's a \"verdicts\" track\
  \ record with a new case.\n\nBut the domain is \"advance directives and the authority\
  \ of the earlier self.\" The literal-vs-spirit distinction is about directive interpretation,\
  \ related but maybe less about the authority of the earlier self. Hmm. The core\
  \ of \"authority of the earlier self\" is: does the earlier self's directive bind\
