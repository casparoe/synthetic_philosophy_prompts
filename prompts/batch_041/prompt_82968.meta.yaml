  \ PhD student in philosophy/bioethics.\n\nActually let's think: the type requires\
  \ a track record of verdicts on earlier cases, jointly consistent with more than\
  \ one rule, and a new case where rules diverge. This works really well for:\n- Advance\
  \ directives: a clinical ethics committee with precedents. Cases: patient with dementia\
  \ who now refuses treatment they previously requested; patient who requested treatment\
  \ now refusing; etc.\n- The wrong kind of reasons problem: a person's verdicts on\
  \ cases. Hmm, this is more abstract, harder to make into a track record of verdicts.\n\
  - Statue/clay: a person's verdicts on material constitution cases. Could work: someone's\
  \ verdicts about identity/coincidence.\n- Epistocracy vs. democracy: a political\
  \ philosopher's verdicts on institutional cases.\n\nAdvance directives is probably\
  \ the richest for the verdicts type because it has natural \"cases\" (clinical scenarios)\
  \ and multiple candidate rules: precedent autonomy (Dworkin's critical interests),\
  \ current autonomy/experiential interests (Dresser), etc.\n\nLet me design: A clinical\
  \ ethics committee's precedents about advance directives. The asker is a PhD student\
  \ (maybe in bioethics or philosophy) sitting on or observing the committee. The\
  \ precedents:\n1. A patient with early dementia who had an advance directive refusing\
  \ life-sustaining treatment (e.g., dialysis) — committee honored it, withdrew treatment.\n\
  2. A patient with dementia who had an advance directive refusing... hmm, but now\
  \ seems content, expressed no objection — honored.\n3. A patient with dementia who\
  \ now actively wants the treatment they previously refused — committee honored the\
  \ advance directive (overrode current wish).\n4. A patient with an advance directive\
  \ requesting treatment but now refuses — committee honored the current refusal.\n\
  5. A patient who never wrote an advance directive but whose family claims they'd\
  \ have wanted X — committee declined to go along (no documented directive).\n6.\
  \ A patient with a psychiatric illness whose advance directive (Ulysses contract)\
  \ refused future treatment — committee...\n\nHmm, need to make precedents jointly\
  \ consistent with more than one rule, with divergence.\n\nCandidate rules:\n- Rule\
  \ A: Advance directives always bind (precedent autonomy over current autonomy).\n\
  - Rule B: Current expressed preferences always win when the patient is still a person\
  \ capable of some preference (Dresser-style: present experiential interests).\n\
  - Rule C: Advance directives bind only for decisions the patient anticipated, i.e.,\
  \ only when the current self is \"not the same person\" / only in cases of severe\
  \ cognitive impairment (dementia), not for psychiatric cases or cases of temporary\
  \ incapacity.\n\nThe divergence: New case — a patient with dementia who has an advance\
  \ directive refusing a feeding tube, but now the patient seems to express a wish\
  \ to live / wants the tube, or seems to enjoy life. Or a new case involving a patient\
  \ whose directive was written before a life-changing event.\n\nLet me think of precedents\
  \ that fit multiple rules:\n\nPrecedents:\n1. Advanced dementia + directive refusing\
  \ ventilation — honored (ventilation withheld). Fits A. Fits C (severe impairment).\
  \ Does it fit B? B says current preferences win; patient couldn't express any preference,\
  \ so no conflict — both A and C honor.\n2. Dementia patient who is clearly content,\
  \ smiles, interacts — directive refusing antibiotics for pneumonia — committee honored\
  \ directive (withheld antibiotics). Fits A. Fits C (severe). Does NOT fit B (current\
  \ self seems to have positive experiential interest in living). Hmm, but B is about\
  \ expressed preferences; contentment isn't a preference. Could argue B says patient\
  \ has interests, not preferences.\n\nBetter: make one precedent where current expressed\
  \ preference contradicts the directive and the committee honored the directive.\
  \ And another precedent where the current expressed preference contradicted and\
  \ the committee honored the current preference. Then the rule must distinguish.\n\
  \nPrecedent 1: Early-stage dementia patient, still \"with capacity\" by clinical\
  \ standards, directive refused dialysis; now says she wants dialysis. Committee\
  \ honored the current request → honored current preference. Rule B.\nHmm but that\
  \ could also be \"capacity wins.\"\n\nLet me carefully construct so two rules diverge.\n\
  \nLet me try:\n\nPrecedent A: A man with advanced dementia, no longer recognizes\
  \ family, had a directive refusing any life-sustaining treatment; he develops pneumonia;\
  \ committee withheld antibiotics. (Directive honored; patient had no current preference.)\n\
  \nPrecedent B: A woman with moderate dementia, still oriented to person and enjoys\
  \ visits, had a directive refusing \"treatment if I can't recognize my family\"\
  \ — but the clinical team said she does still recognize her daughter and clearly\
