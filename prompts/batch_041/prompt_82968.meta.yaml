  \ win → fits P. Hmm, then P fits 1,2,3 and Q fits 1,2 but not 3. Then only P fits\
  \ all — no divergence.\n\nI need two rules both fitting all precedents. So make\
  \ Precedent 3 consistent with both by tweaking: perhaps she is \"borderline capacity\"\
  \ and the committee treated it as incapacity. Hmm.\n\nAlternative approach: make\
