  Draft:


  "I cover technology and ideas for a weekly magazine, and for the past two years
  I have served as one of the lay members on the ethics advisory committee of a mid-sized
  public pension fund. On Thursday the committee votes on a proposed amendment to
  our investment policy. The amendment would create a narrow exception to our human-rights
  screening rules for what its sponsors call developmental-authoritarian states: countries
  with a record of sustained economic growth and public order but also with restricted
  speech, assembly, independent courts, and political competition. The test case before
  us is a country that has lifted several hundred million people out of poverty in
  two generations, maintains high reported public satisfaction with the government,
  and has largely eliminated everyday violent crime, while also jailing journalists,
  censoring the internet, and refusing to allow a meaningful opposition. The sponsors
  argue that prosperity and order are real goods, that the people in question seem
  to prefer them to the chaos and poverty of the alternatives, and that a pension
  fund has no business imposing one contested conception of political legitimacy on
  a sovereign state. The opponents argue that this is a bargain with the devil: that
  performance legitimacy is either a contradiction in terms or a license for any regime
  that delivers growth, that it ignores the people who dissent, and that it will be
  used to whitewash abuses. I have to vote, and I want a memo I can circulate that
  actually engages the philosophical issue rather than just restating the fund''s
  fiduciary duties."


  "Please act as a political philosopher with expertise in comparative political theory,
  authoritarian governance, and the ethics of institutional investment. Before writing,
  brainstorm in a scratchpad: identify the strongest version of the performance-legitimacy
  argument, the strongest objections (including the baseline problem, the counterfactual
  problem, the consent problem, the measurement problem, the transition problem, and
  the moral-hazard problem), and say which considerations you find decisive. Then
  draft the memo itself, addressed to the ethics advisory committee. It should open
  with a one-sentence bottom line recommending a concrete course of action -- adopt
  the amendment, reject it, or adopt it with specific conditions -- and then give
  the reasoning. It should treat the losing side at its strongest, not as a straw
  man, and it should be explicit about what would have to be true for the other side
  to be right. Do not include citations, reading lists, or references to specific
  authors or works; I want the argument, not the bibliography. The memo should be
  no more than 900 words, and it should be written in a formal, polished register
  suitable for a committee that includes lawyers, economists, and one philosopher."


