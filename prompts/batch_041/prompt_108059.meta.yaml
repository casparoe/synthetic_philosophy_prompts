  Student answer:

  "Consequentialist cluelessness is the problem that, in a causally complex world,
  we cannot know the full consequences of our actions. Priya is clueless in the way
  a gambler is clueless about the next card: she faces uncertainty about outcomes.
  The difference is that the chain of consequences is open-ended, so she cannot even
  list all the relevant outcomes, let alone assign them probabilities. This means
  the expected value of donating and the expected value of buying the present are
  both undefined.


  This is not merely an epistemic problem. If the expected values are undefined, then
  there is no fact of the matter about which action has better consequences. Consequentialism
  therefore cannot say that either action is right or wrong; it is a metaphysical
  problem about the structure of value, not just a limit on our knowledge.


  One response is to distinguish simple from complex cluelessness. Simple cluelessness
  is uncertainty about which outcome will occur; complex cluelessness is uncertainty
  about the probabilities themselves. The response says that complex cluelessness
  is not a serious problem because we can always assign subjective probabilities to
  the remote effects, or, if we cannot, we can treat them as equally likely. Priya
  can therefore still calculate an expected value, albeit a rough one.


  A second response is to restrict consequentialism to foreseeable consequences. Rule
  consequentialism does this by asking which rules generally have good consequences,
  rather than which particular acts do. Since Priya can foresee that donating to the
  charity will fund a cataract operation, she has enough to act on. The open-ended
  consequences are irrelevant to the rule.


  I conclude that cluelessness is a serious challenge to act consequentialism, but
  not to consequentialism as such, because rule consequentialism avoids it."


