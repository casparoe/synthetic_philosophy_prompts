  Let me also consider underdetermination, which is very "in the weeds" friendly.
  An argument that proves too much:


  (1) For any theory T and any body of evidence E, we can construct a rival T* that
  entails exactly the same observational consequences as T (by re-labelling the unobservable
  part, or by a Goodman-style gerrymander).

  (2) Rational belief must be proportioned to evidence.

  (3) If T and T* have exactly the same observable consequences, then every possible
  observation confirms them equally.

  (4) So the evidence gives exactly as much support to T* as to T.

  (5) So there is never a rational basis for preferring T to T*.

  (6) So belief in any theory beyond what it says about observable things is never
  rationally required.

  (7) But the same argument applies to the belief that the rival-construction always
  works: our belief that we can always gerrymander a rival is itself a theoretical
  belief supported by ... hmm, no, that''s a math fact.


  Where does it prove too much? (5) makes *any* inference to a theory irrational,
  including inference to the simplest theory of my own perceptual experience — the
  belief that there is a table in front of me also has empirically equivalent rivals
  (the table is not there but I''m hallucinating in exactly this way... well, that
  has the same observable consequences if hallucination = the experience). So underdetermination,
  if it''s a general thesis about evidence, dissolves the distinction between the
  real world and a systematic hallucination, and it also dissolves the distinction
  between the real world and Berkeley''s idealism — Descartes'' problem all over again.
  Then the anti-realist who uses underdetermination to argue "don''t believe in unobservables"
  must say why the argument stops at the unobservable and doesn''t eat the observable:
  the observable/unobservable distinction is itself doing the work, and the same gerrymandering
  trick can be run *within* the observable domain (e.g., grue-like predicates applied
  to observables — "grue" is about emeralds, which are observable). That''s a nice
  sharp point: the grue trick works for observable predicates too, so "no rival can
  be ruled out" undermines the observable/unobservable line. Also: the argument''s
  own meta-induction (empirically equivalent rivals can always be constructed) is
  supported by... the fact that we''ve found such rivals, which is empirical evidence,
  and the claim "there is always a rival" is itself a universally quantified theoretical
  claim not supported by that evidence. Nice self-referential pinch.


  So there''s a real flaw candidate: the step from (4) "evidence supports both equally"
  to (5) "no rational basis for preferring" — that assumes the only rational basis
  for preferring a theory is differential evidence; but it also assumes that "the
  evidence is the same" means "the same evidence", and there''s a scope issue: for
  any *given* observation, T and T* agree, so no observation can discriminate; but
  "evidence" in (2)/(3) is being treated as a set of observations, and the argument
  for (1) is itself an inductive generalization. Also the move from "for every theory
  there exists a rival" to "no theory is rationally preferred" is a slide from "there
  is a rival for each theory" (∀T∃T*) to "there''s a single rival that is always as
  good" — no. Or the slide from the *possibility* of constructing a rival to the *epistemic*
  parity: constructing a rival is a formal trick that requires the rival to be as
  well-confirmed, but the rival may be a mere re-description (notational variant)
  rather than a genuinely distinct hypothesis — the "empirical equivalence" claim
  then becomes trivial and doesn''t threaten anything.


