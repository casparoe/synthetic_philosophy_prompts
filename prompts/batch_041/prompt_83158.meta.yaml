  Alternatively Jain anekāntavāda: the self-referential argument. Chain:

  (1) Every statement, to be fully true, would have to capture its object from all
  standpoints at once.

  (2) No finite statement can do that; each is made from one standpoint (naya) and
  is at best partly true.

  (3) So every statement is only conditionally/partly true — every assertion is "syāt",
  in some respect.

  (4) This includes the statement "every statement is only partly true."

  (5) So that statement too is only partly true — hence its negation is also partly
  true, i.e., some statements are fully true.

  (6) So anekāntavāda either refutes itself or exempts itself.

