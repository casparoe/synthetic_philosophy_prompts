  Good''s theorem: The expected value of information is positive in the sense that
  a rational agent with a coherent (Bayesian) credence function should be willing
  to pay a small amount for information that may lead to any partition of possible
  observations — actually Good''s result: if you''re about to make a decision, and
  there''s a free option to observe a random variable, you should never refuse it,
  in the sense that the expected utility of observing is ≥ expected utility of not
  observing. The subtlety: this is "value of information is non-negative" for a Bayesian
  expected utility maximizer, in the sense of expectation over the distribution of
  observations — the expected value of sample information is non-negative, and it''s
  zero only if your decision doesn''t depend on the observation. Important caveats:
  it requires that the information is free (no cost), that you can condition on it,
  that the utility function is fixed and you don''t change your preferences, that
  you can''t "double count" — e.g., the issue of the value of information being zero
  when you don''t trust yourself, or when information acquisition is itself informative
  about something else. Also relevant: the theorem doesn''t hold for non-Bayesians
  or when the observation process affects the state; also it says the *ex ante* expected
  value is non-negative, not that any particular piece of information helps. Also
  the "expected value of perfect information" vs "expected value of sample information"
  distinction. Also caveats: costless in terms of decision-relevance; the theorem
  assumes you know the likelihoods.


  Also there''s a classic caveat: Good''s theorem holds only for a single decision-maker
  with a fixed utility function; if information can be used to manipulate, or if it
  can change your preferences, or if you must commit to a policy before, it may not
  help. Also "the value of information is non-negative" — Good 1966 "On the principle
  of total evidence", British Journal for the Philosophy of Science. There''s also
  Skyrms, and the "value of information" literature (Howard 1966). There''s a known
  counterexample-ish: if you''re not Bayesian, information can hurt — e.g., the "blackwell"
  / Blackwell''s theorem for comparison of experiments. Also the "no free lunch" —
  if information is costly, EVSI may not exceed cost. Also, relevant nuance: "the
  expected value of information is non-negative" doesn''t imply you should always
  seek it if the information is costly, and it doesn''t apply if acquiring the info
  changes the distribution of the state (observer effect), and it doesn''t apply if
  you''re irrational / not expected utility maximizer.


