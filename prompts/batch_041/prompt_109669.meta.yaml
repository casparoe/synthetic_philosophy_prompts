  a boundary drawn for convenience on a continuum of divergence, and that the appearance
  of a fact of the matter comes from the convention''s being shared rather than from
  anything in the world. When I pressed him, he made a point I couldn''t answer on
  the spot: whatever criterion I propose (interbreeding, shared descent, ecological
  role, diagnosable distinctness), there are uncontroversial cases in the living world
