  matter rather than discovering a boundary. My reply was that these are cases where
  our knowledge is incomplete, not cases where there is nothing to know; I could not,
  that evening, say why that reply isn''t just stubbornness.


  I''d like you to write an essay that settles this — or at least that settles it
