  Draft:


  I have spent a lot of time in the rationalist blogs and forums, and my working vocabulary
  for anything probabilistic is the one you would pick up from a probabilistic-programming
  tutorial: generative models, priors and likelihoods, factors and soft constraints,
  inference by MCMC or particle filtering, annealing schedules and inverse temperature,
  and at the limit Solomonoff induction as the canonical universal prior over programs.
  I am a competent programmer and comfortable with unification, term rewriting and
  constraint propagation, but I have never had any use for Hofstadter''s Copycat programme,
  and I would like it restated in my vocabulary.


  What I understand Copycat to be: a stochastic model of analogy-making in a microdomain
  of letter strings, the kind of puzzle where abc is to abd as ijk is to what. Its
  architecture is tripartite: a slipnet of concepts joined by links whose effective
  weights shift with activation; a workspace in which the program builds structures
  — bonds between corresponding elements, groups, rules — out of the problem; and
  a coderack holding codelets, small processes that are selected with probabilities
  proportional to urgency and that build or destroy structure and nudge activations.
  A global temperature measures how disordered the situation currently is, and governs
  how readily destructive and exploratory moves happen; the whole thing is a parallel
  terraced scan, in which many partial interpretations are pursued at once and effort
  is redistributed as some of them look more promising. It settles on an answer, sometimes
  a literal one, sometimes a thematic one, and different runs can settle differently.


  Restate that apparatus for me in my vocabulary, component by component and as faithfully
  as you can, without quietly substituting a better-behaved object for the one Hofstadter
  built. Then give me the residue report. Which parts translate cleanly — temperature
  as an annealing schedule, bonds as factors or soft constraints, the parallel terraced
  scan as something like particle filtering or a tempered sequential search, slippage
  as a move in a hypothesis space? Which parts translate only with distortion? Which
  parts have no counterpart at all? And where the translation fails, say whether that
  is a defect of my vocabulary or evidence that the original claim was less clear
  than it sounded.


  There is one specific thing I want the translation to bear on. The standard objection
  I see from my side of the fence is that the slipnet is hand-built — the concepts
  and their associations are written down by the programmer, so nothing about conceptual
  novelty has been modelled; the reply is that this is what a prior is, and that Solomonoff
  induction answers the worry by putting the prior over programs rather than over
  a hand-chosen list of concepts. I want to know what survives when that reply is
  made precise. Does the difference between a hand-built slipnet and a hand-built
  hypothesis space survive translation, or is it a distinction without a difference?
  If it survives, what exactly is the thing that Copycat has and the probabilistic
  account lacks — and if the probabilistic account can be extended to have it, tell
  me what the extension costs and whether it is still recognisably an inference procedure
  rather than a description of one. You may invent the probabilistic analogue if it
  does not already exist; I would rather have an honest idealisation with its losses
  marked than a mapping that flatters my side. No reading lists, please — I want the
  argument, not the literature.


