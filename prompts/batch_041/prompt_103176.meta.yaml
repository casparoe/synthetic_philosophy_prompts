  Let''s make the framework more philosophically sophisticated. The four conditions:


  1. Causal contribution without marginal difference: Does the act belong to a class
  of acts that together produce the harm, where the harm is not attributable to any
  single act as a but-for cause? (This is the standard "collective harm" structure.)

  2. Threshold structure: Is the harm triggered only when a critical mass is reached?
  If so, the act''s relevance is not its marginal difference but its position relative
  to the threshold (e.g., moving the group closer, or being part of the last necessary
  increment).

  3. Coordination and assurance: Is there an actual or feasible coordination scheme
  such that if a sufficient number act, the harm is avoided? The procedure should
  distinguish cases where coordination is feasible from cases where it is not.

  4. Expressive/constitutive dimension: Does the act express or constitute a commitment
  (e.g., to the firm''s values, to democratic participation, to non-complicity) that
  is independent of its causal efficacy?


