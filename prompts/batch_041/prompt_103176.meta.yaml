  Draft:


  I am the ethics and compliance lead at a mid-sized engineering firm, and I sit on
  a sustainability committee that meets monthly. The committee keeps bringing proposals
  that ask employees to make personal changes—removing beef from the cafeteria, reducing
  business air travel, voting in local elections, turning down the thermostat—and
  every proposal runs into the same objection from the works council and the CFO:
  one person''s change makes no measurable difference, so why should the firm ask,
  require, or even encourage it? I need a reusable decision procedure I can run on
  each proposal, in under half an hour, that is defensible to a skeptical finance
  officer and to a works council that is wary of moralizing. The procedure must be
  built on the following framework, which our committee has drafted but cannot operationalize.
  It distinguishes four conditions: (1) *causal contribution*: the act belongs to
  a class of acts that together produce a harm, even though no single act is a but-for
  cause; (2) *threshold sensitivity*: the harm occurs only after a critical mass is
  reached, and the act''s relevance is its position relative to that threshold rather
  than its marginal effect; (3) *coordination condition*: a sufficient number of others
  could act together to prevent the harm, and there is a feasible assurance or coordination
  mechanism; (4) *constitutive participation*: the act is not merely an increment
  but part of a practice that is itself harmful or expressive of a commitment the
  firm already avows. The framework also includes a counterfactual-irrelevance clause:
  the fact that the harm would occur without the agent''s act does not by itself exonerate
  the act; the procedure must then ask whether the act is constitutive rather than
  merely contributory.


  Write the procedure: the questions to ask in order, what counts as a sufficient
  answer to each, where the procedure stops with a no, where it stops with a yes,
  and where it must hand the decision to a person because the question is one of values
  rather than facts. Include the points where the procedure will misfire or produce
  an answer the committee will not like, and state plainly what the procedure cannot
  settle. Then run it on three proposals: removing beef from the cafeteria; asking
  employees to vote in a national election; and a 10% reduction in business air travel.
  At least one of the three should come out in a way that the sustainability committee
  will find unwelcome. Keep the procedure to a length that a busy compliance officer
  can actually use, and do not include citations, reading lists, or references to
  the academic literature.


