  Background:

  - Fanaticism about the far future: longtermism''s core quantitative claim. Because
  the far future could contain an astronomically large number of people (or value),
  and because our actions could have a tiny probability of a huge effect, expected-value
  reasoning says we should prioritise far-future influence. This is a form of "fanaticism"
  — the view that we should accept tiny probabilities of enormous value (Pascal''s
  mugging / astronomical waste). Criticisms: fanaticism is implausible because it
  lets minuscule probabilities swamp everything; some argue for "probability discounting"
  or a bounded/lexical approach.

  - Simulation argument (Bostrom): at least one of three propositions is true: (1)
  civilisations go extinct before posthuman; (2) posthuman civilisations don''t run
  ancestor simulations; (3) we are almost certainly living in a simulation. Not that
  we are in a simulation — a disjunction.


  How might simulation dampen fanaticism? Argument: If we''re likely simulated, then
  the "far future" we''d be influencing might be simulated too, or our simulated actions
  might not map onto the real world''s far future. If we''re a simulation run by posthumans,
  our actions may have no bearing on the real far future; the value at stake in the
  real world is decoupled from our choices. So the huge expected-value lever is cut.
  Hence fanaticism is dampened: the astronomical stakes evaporate.


  Counter-arguments:

  1. The simulation argument is a disjunction, not a claim we''re simulated; assigning
  probability to the simulation branch requires priors. Even Bostrom''s own estimate
  gives non-negligible but not dominant probability.

  2. Even if simulated, our choices might still matter: the simulators might be running
  us to learn something, or simulated beings might be morally considerable (if simulations
  can contain morally considerable beings, then the value of the simulated far future
  counts too — simulation doesn''t remove the stakes, it just relocates them). This
  is key: if simulated minds matter, then the far future of the simulation is itself
  of astronomical value, and fanaticism is restored, perhaps even amplified.

  3. Decoupling: the "dampening" move requires that the value of our actions depends
  on the real far future and that simulation severs the link. But it''s not clear
  the link is severed — the simulators'' actions may be responsive to ours, or our
  simulation''s own far future matters.

  4. The fanaticism problem is a problem about expected-value reasoning in general
  (tiny probabilities, huge values), not specifically about the far future''s magnitude.
  If simulation reduces the magnitude, the same structure recurs at a smaller scale
  or via other tiny-probability routes (e.g., the probability that our actions have
  an outsized real-world effect). So it doesn''t solve fanaticism structurally; it
  just shifts the numbers.

  5. Also: the simulation argument might increase fanaticism, because if we''re simulated,
  there might be vastly more simulated beings than real ones (simulation multiplicity),
  increasing the stakes.

  6. Selection effects / self-indication assumption complicate the probability.


