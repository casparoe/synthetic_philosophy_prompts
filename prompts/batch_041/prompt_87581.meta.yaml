  obscures: that in this game the escalation is not obviously a fallacy. Once the
  bidding is at a dollar and change, the next bid is locally the better move — stopping
  is what needs a defense — and the trap is in the structure of the game rather than
  in anyone''s psychology. The sunk cost isn''t doing the work; the structure is.


