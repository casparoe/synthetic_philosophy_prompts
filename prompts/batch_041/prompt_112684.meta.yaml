  Question:

  In the second half of the course we considered the suggestion that if panpsychism
  is true, the fundamental entities that physics describes are themselves loci of
  experience, and that physics therefore has direct ethical stakes — in particular,
  that there may be morally considerable suffering at the level of fundamental physics.

  (a) State the panpsychist thesis, and distinguish it from panprotopsychism, locating
  both with respect to Russellian monism.

  (b) Set out the ''ethical physics'' argument in premise-conclusion form, making
  explicit every premise the conclusion requires.

  (c) Assess the strongest objection to the argument, and say what would remain of
  the ethical conclusion if the objection succeeded.


  Student''s answer:

  ...


  Then: For each of your criticisms, say how confident you are in it, and end by identifying
  the single judgment you are least sure of (e.g., a point where the student''s wording
  might be defensible on some reading)."


