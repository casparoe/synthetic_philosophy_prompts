  with subtle mistakes.


  Student answer draft:


  "(a) Panpsychism is the view that experience, or mentality, is a fundamental and
  ubiquitous feature of the world rather than something that emerges from non-mental
  matter. It is therefore a rival to both physicalism, which treats experience as
  derivative, and to emergentism, which treats it as a late-arriving product of complex
  organization. What distinguishes panpsychism from these is that it is constitutive
  rather than emergent: the experiences of complex subjects like us are built out
  of the experiences of the entities that compose us, not produced by them as a novel
  kind of property. Panprotopsychism, also called Russellian monism, agrees with panpsychism
  that the intrinsic nature of physical properties is not exhausted by their structural/relational
  character, but holds that the intrinsic properties in question are ''proto-mental'':
  they are not experiences at all, merely the ingredients out of which experiences
  can be constituted. In practice, however, this difference is mostly verbal, since
  a proto-experience that is sufficient for constituting experience is just an experience
  too faint to notice introspectively.


  (b) The argument can be reconstructed as:

  P1. Fundamental physical entities have experiences. [panpsychism]

  P2. Every experience has a hedonic character: it is pleasant, unpleasant, or neutral.
  [follows from panpsychism, since if experience is ubiquitous then valence, which
  is inseparable from experience, is ubiquitous too]

  P3. Unpleasant experiences are intrinsically bad for the subject who has them.

  P4. If an entity has experiences that are bad for it, it is a proper object of moral
  concern.

  C. Therefore fundamental physical entities are proper objects of moral concern,
  and physics has direct ethical stakes.


  The argument is valid, and P3 and P4 seem to me to be exactly what we say about
  animals, so I don''t think the ethical premises are where the trouble is.


  (c) The strongest objection is the combination problem. Physicalism has to explain
  how experience arises out of non-experiential matter, and panpsychism''s selling
  point is supposed to be that it does not have to do this. But the combination problem
  is precisely the problem of how experience arises out of non-experiential components:
  how do billions of tiny micro-experiences add up to a single unified subject of
  experience, rather than a mere aggregate? If the objection succeeds, then panpsychism
  has not avoided the explanatory gap at all; micro-experiences do not exist as genuine
