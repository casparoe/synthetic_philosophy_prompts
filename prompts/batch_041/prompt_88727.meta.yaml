  Key content:

  1. Hobbes''s biography: late encounter with Euclid (~40), delighted, geometry becomes
  his model of reasoning. Aubrey''s anecdote.

  2. Why geometry works, for Hobbes: its first principles (definitions) are laid down
  by us (stipulated), so we know their causes; the conclusions follow necessarily
  from our own constructions. Contrast with natural philosophy, where the causes are
  not in our power, so we can only reason hypothetically/from effects to possible
  causes. (This connects to Hobbes''s claim in the Epistle Dedicatory to De Corpore
  and in Six Lessons to the Professors of Mathematics: geometry is demonstrable because
  "the lines and figures from which we reason are drawn and described by ourselves".)

  3. Consequently, "civil philosophy" (politics) is also demonstrable, since we make
  the commonwealth ("we make the commonwealth ourselves"), while physics is not strictly
  demonstrable.

  4. So geometry''s value for Hobbes is method/model, not content. It grounds the
  analogy: bodies natural vs. artificial (Leviathan''s "artificial man").

  5. His practice: Hobbes actually did geometry, badly by the standards of his contemporaries
  — multiple attempted solutions to the quadrature of the circle and the duplication
  of the cube; attacked by John Wallis (Elenchus Geometriae Hobbianae, 1655) and by
  Seth Ward; the quarrel lasted decades; he included the "squaring" claims in later
  editions of works and even in De Corpore (1655). His errors were in part a consequence
  of his method — he insisted on the primacy of his own stipulated definitions and
  "principles" and dismissed algebraic methods, treating symbolical analysis with
  suspicion.

  6. Misconceptions to expect: (a) that Hobbes was a competent mathematician whose
  geometry was integral to his political conclusions — actually he derived no political
  conclusions from geometry; the relation is analogical/methodological; (b) that "Hobbes
  thought geometry certain because it''s a priori in the Kantian sense" — no, it''s
  because we are the makers of the objects (a "maker''s knowledge" / constructivist
  epistemology, later associated with Vico); (c) that the squaring-the-circle episode
  is an embarrassment irrelevant to the philosophy — rather it''s evidence of what
  his method did and didn''t allow; (d) that Hobbes''s account of reasoning as computation
  (adding and subtracting) is the same as logicism or formalism — it''s more like
  an early computational/constructivist thesis; (e) that geometry''s role was to make
  politics "scientific" in the sense of quantifying — no, it was to make politics
  demonstrable from stipulated definitions; (f) the assumption that Hobbes''s love
  of geometry came early and shaped him from youth.


