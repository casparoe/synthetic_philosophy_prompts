  examples; real examples are fine, they''re well known).

  3. Voted to reject "Internet gaming disorder" for the main section, placing it in
  an appendix for further study, because prevalence estimates varied wildly and no
  marker.

  4. Voted to include "premenstrual dysphoric disorder" despite feminist criticism,
  because of treatment response to SSRIs.

  5. Voted to include "gender dysphoria" but redefined so the diagnosis requires distress
  rather than mere nonconformity — a decision about looping/self-identification.


  Candidate rules:

  - R1: Include iff there is a demonstrated treatment response (clinical utility).

  - R2: Include iff there is evidence of an underlying dysfunction independent of
  social reaction (natural-kind-ish / harmful dysfunction).

  - R3: Include iff the category''s recognition reduces rather than increases suffering,
  considering looping effects (i.e., an ethical/pragmatic rule about feedback).

  - R4: Include iff the diagnostic criteria can be operationalized reliably across
  cultures.


