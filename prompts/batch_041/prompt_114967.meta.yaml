  R3 (looping/feedback-sensitive, Hacking-style): include only when recognition would
  not intensify the condition through feedback — i.e., weigh the category''s effect
  on the people classified.

  R4 (boundary-stability / reliability): include only when the criteria draw a stable
  line across cultures and times.


