  The asker wants a prediction/recommendation of the verdict, the candidate rules,
  and the discriminating case.


  To inject niche content: I can include a bespoke proposal with a novel diagnostic
  construct that I define in the prompt (invented, so no memorized answer), plus a
  specific detail about looping: e.g., the proposed category is defined partly by
  the patient''s own self-description, which changes as the label spreads.


  Idea: The committee is revising a national formulary / a diagnostic manual for "the
  classification of distress in adolescents." Track record:


  1. Voted to include "prolonged grief disorder" — grief lasting beyond a year with
  functional impairment — because trials showed a distinct treatment response (though
  contested).

  2. Voted to remove a category that had been defined by social deviance without distress
