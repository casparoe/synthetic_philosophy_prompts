reasoning_summary: 'The task: write a prompt of the type "Predict or recommend a verdict
  on a new case from someone''s verdicts on earlier cases." Domains to pick from:
  death penalty, cogito, psychiatric classification and Hacking''s looping effects,
  idealization/Friedman''s F-twist, Anthropocene start.


  Format: relatively formal/polished. Prescribe sections by name and order with rough
  lengths.


  Need to inject new/niche ideas into the prompt so models can''t regurgitate. For
  the verdicts-to-new-case type, I need to write earlier verdicts that are jointly
  consistent with multiple rules, and a new case where at least two rules diverge.


  Best fit: Hacking''s looping effects with psychiatric classification — a nosology
  committee''s decisions about whether to include categories. Or the death penalty:
  a state''s/justice''s verdicts across cases (e.g., a judge''s rulings on aggravating/mitigating
  factors). Or the Anthropocene: a stratigraphic commission''s votes on which boundary
  markers qualify — actually the Anthropocene Working Group''s actual votes on the
  GSSP (Crawford Lake) and the ICS/IUGS rejection in March 2024. That''s a nice track
  record: a body making verdicts on candidate markers (plutonium fallout, fly ash,
  plastic, radiocarbon spike) and then a new case. But careful about accuracy — I
  know: in 2016 the AWG voted 30-3 (or similar) in favor of the Anthropocene as an
  epoch; in 2023 they selected Crawford Lake as the GSSP; in March 2024 the Subcommission
  on Quaternary Stratigraphy voted 12-4 against, and the ICS/IUGS upheld it. I could
  avoid leaning on exact numbers. Actually I can just write a fictional-ish body''s
  verdicts, but it''s better to be honest — the prompt can be constructed as a hypothetical
  commission with a track record given in the prompt itself. The instruction says
  the asker reports how some person or body has judged a series of earlier cases.
  I can invent a body: "my department''s curriculum committee," or better, a realistic
  body — e.g., a state supreme court''s death penalty precedents, or a psychiatric
  nosology revision committee.


  Let me think about which domain gives the richest set of rules that diverge.


  Option A: Death penalty — a body (say, a state''s clemency board or a supreme court)
  with a track record: upheld death sentences in cases involving certain aggravators,
  vacated in others, and its treatment of risk of executing the innocent. Candidate
  rules: (1) retributive proportionality (worst crime → death, regardless of procedural
  risk), (2) deterrence-empirical, (3) risk-of-error threshold (e.g., "we won''t impose
  death when the evidence is purely circumstantial" or "when a co-defendant''s testimony
  is the linchpin"), (4) evolving standards / dignity. New case: a defendant convicted
  on eyewitness ID plus jailhouse informant, no physical evidence, in a jurisdiction
  with a documented exoneration record; aggravators: especially heinous murder of
  a child. Rules diverge: retributivism says affirm; the risk-avoidance rule says
  vacate.


  But "inject new/niche ideas" — I can inject something like a "residual doubt" doctrine,
  or a specific procedural device: e.g., a jurisdiction''s practice of proportionality
  review, or the distinction between "residual doubt" and "actual innocence" claims.
  Also could inject "the risk of executing the innocent" via a hypothetical: a state
  whose board has never granted clemency but has commuted in cases with X.


  Option B: Hacking''s looping effects — a nosology committee with a track record:
  it added "prolonged grief disorder" (real, DSM-5-TR 2022), removed "homosexuality"
  (1973), added "gender dysphoria" replacing "gender identity disorder" (DSM-5), added
  "premenstrual dysphoric disorder," considered but rejected "Internet gaming disorder"
  (DSM-5 put it in Section III conditions for further study), considered "orthorexia"
  and rejected. Rules: (1) clinical utility / treatment response, (2) whether the
  category is a "natural kind" with a biological marker, (3) whether the category''s
  recognition would create a self-reinforcing loop / biosocial feedback that harms
  the classified (Hacking''s "making up people"), (4) whether the distress is caused
  by social reaction vs. intrinsic dysfunction.


  New case: a proposal to include a category for "pathological climate anxiety" or
  "AI-related existential distress" or a category for people who experience distress
  from doomscrolling. Or — nice — "problematic social media use in adolescents." The
  new case can be designed so that rules diverge: a marker-free category with strong
  clinical utility and strong social-reaction etiology.


  Hacking''s looping effects is very "in the weeds" — good. And I can inject niche
  material: the distinction Hacking draws between "indifferent kinds," "interactive
  kinds," and "looping effects," plus "making up people," plus his later notions like
