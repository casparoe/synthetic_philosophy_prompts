  "I have taught Newcomb''s problem for the better part of a decade, and I have settled
  into a reading of it that I now suspect may be built on a mistake. My reading is
  this. Causal and evidential decision theory agree wherever the state of the world
  on which the payoffs depend is probabilistically independent of the agent''s act;
  they come apart only when the act carries information about the state. Outside of
  Newcomb-style cases, the only route from an act to information about a state is
  a causal route, and causal routes are exactly what causal decision theory is designed
  to handle. So the divergence between the two theories is confined to cases in which
  some predictor forecasts the agent''s choice with something close to perfect accuracy;
  and since a predictor of that sort would have to be a Laplacean demon or a time
  traveller, no deliberator will ever be in such a case. It follows, I have been telling
  my students, that the choice between the theories is empirically idle: it is a debate
  about an impossible being, useful only for making a conceptual distinction visible.
