  One concern: the asker is a philosophy professor who teaches decision theory, and
  he''s presupposing that perfect prediction is impossible because it would require
  a Laplacean demon or time traveller. Is that a "subtle confusion"? Partly: perfect
  reliability doesn''t require determinism or backwards causation if the predictor
  knows the indeterministic facts (e.g., knows how a genuinely random process will
  resolve — which is possible if the randomness is epistemic or if the predictor has
  access to the outcome in a non-causal way, e.g., a god). Also there''s a cleaner
  point: Newcomb doesn''t need perfect prediction. Also the deeper confusion: assuming
  that if no predictor exists then the state is independent of the act — false when
  the act and state share a common cause (smoking lesion) or when the state is defined
  in terms of the act (e.g., "the box contains $1M iff you one-box" as a definitional
  constraint, or cases where the state is a fact about your dispositions). Also: even
  if the predictor is impossible, "possible worlds" considerations matter for the
  *correctness* of a decision theory as an account of rational choice — but the asker''s
  "no practical import" claim may be defensible; the answer should be careful: the
  correct diagnosis is that the presupposition is false in several ways.


