  Draft:


  My friend and I spent most of a long train ride arguing about psychiatric diagnosis,
  and I want to turn the argument into something useful. She works in community mental
  health and thinks new diagnostic labels are mostly a matter of finally recognizing
  what was always there; I think labels can change the people who receive them, so
  that the next edition of a manual is partly describing a population the previous
  edition helped create. I am on the diagnostic review panel of a mid-sized nonprofit
  health system. We maintain the local intake and screening forms, recommend whether
  to add, keep, or rewrite categories, and train clinicians in their use. We meet
  monthly, our decisions affect about 40,000 patients a year, and the medical director
  has final sign-off. We have been asked to decide whether to add a new screening
  category for Problematic Short-Form Video Use, whether to retain a broad burnout
  category that patients have started using as an identity and a basis for accommodation
  requests, and whether to rewrite our borderline personality disorder criteria to
  reduce stigma. Please write a decision procedure the panel can actually run on a
  proposal to add, retain, or modify a diagnostic category, one that treats looping
  effects as a central input rather than a public-relations problem.


  The procedure should:

  - Ask questions in a fixed order, with a clear criterion for what counts as a sufficient
  answer at each step, and a clear stopping rule for when the panel should decline
  or defer.

  - Distinguish at least two kinds of loop: meaning loops, where the label''s sense
  shifts as patients, clinicians, and advocacy groups negotiate what it means, and
  leverage loops, where people adopt or resist the label to obtain resources, exemptions,
  solidarity, or a story about themselves. Say how the procedure should treat these
  differently.

  - Include a loop audit that runs before the category goes on any form and again
  at a fixed review interval, with specific evidence the panel should collect from
  clinicians, patients, and intake data.

  - Say where the procedure must stop and hand the question to a person or body because
  it is a value question rather than an empirical one, and identify which steps are
  judgment calls dressed up as procedure.

  - Be usable in a 60-minute meeting by people who are clinicians and administrators,
  not philosophers, and say what the panel should do when it cannot get the evidence
  the procedure asks for.


