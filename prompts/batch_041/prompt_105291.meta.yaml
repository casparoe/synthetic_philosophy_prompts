  Held, Ostrovsky, de Gelder, Sinha — the "Project Prakash" work in India. Also Pawan
  Sinha''s work. Also the "MM" case (Fine et al. 2003) — a man blinded at 3.5 years,
  sight restored at 43 — could not use vision for object recognition. And there''s
  Richard Gregory''s work.


