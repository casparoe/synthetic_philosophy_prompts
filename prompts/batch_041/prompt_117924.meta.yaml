  For aesthetic testimony, the standard objections/tensions:


  1. The regress/genealogy problem: all your taste came from testimony (parents, teachers,
  friends). If testimony can''t justify, no one has justified taste. How did the first
  person get taste?

  2. The acquisition/transmission distinction: testimony can give you belief but not
  knowledge/understanding (Hopkins). But then what''s the epistemic status of "I know
  Bach is great, I just don''t get it"?

  3. The autonomy/authenticity ideal: deferring is a vice; but everyone defers somewhere
  (you can''t see every film).

  4. The "expert problem": how do you identify the expert without independent access
  to the good?

  5. The "ideal critic" / ideal observer theory: aesthetic properties as dispositions
  to please ideal critics.

  6. The paradox: a critic''s job is to guide your experience, which requires you
  to have the experience; the review is at best an invitation.

  7. The commercial dimension: aggregators (Rotten Tomatoes) both depend on and undermine
  testimony.

  8. The wine-tasting/empirical literature: blind tasting shows labels matter (testimony
  effects on experience) — that''s interesting: testimony can change your experience,
  not just your beliefs.

  9. Kant: judgment of taste is not a cognitive judgment, yet demands universal assent;
  "everyone has their own taste" is a refusal of the judgment''s own form.

