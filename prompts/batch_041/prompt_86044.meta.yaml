  that every meeting pushes on something that could actually be resolved, or at least
  sharpened, rather than circling a theme. The scaffolding I keep coming back to is
  Daniel Dennett''s division of minds into four nested grades, which he names after
  Darwin, Skinner, Popper, and the psychologist Richard Gregory. Darwinian creatures
  are the ones whose competence is fixed by natural selection — they do not learn
  within a lifetime in any interesting sense, they just live or die, and the ''learning''
  happens across generations. Skinnerian creatures add within-lifetime plasticity:
  they can be shaped by reinforcement, by trial and error, by the consequences of
  what they do. Popperian creatures add a further trick, which is that they can try
  things out internally, in imagination or anticipation, so that it is their hypotheses
  that are put at risk rather than their skins — they can be wrong in private. Gregorian
  creatures are the ones that absorb thinking tools from culture — words, notations,
  procedures, the whole apparatus that Dennett likens to the installation of new virtual
  machinery in a brain that was not built for it — and the claim is that each grade
  contains the earlier ones, so the four form a cumulative tower rather than four
  separate kinds.


  What I''d like from you is a defended agenda rather than a survey: if a group like
  mine has roughly a year of regular meetings and maybe two or three years of student
  attention to spend, which open questions about this four-part picture most deserve
