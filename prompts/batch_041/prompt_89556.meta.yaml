  Subtle misrepresentations to embed:

  - "Open borders" vs. "free movement" vs. "no borders": the position is typically
  about the right to cross and reside, not about abolishing state sovereignty or citizens''
  rights to exclude in all senses (open borders advocates usually retain the state;
  some distinguish "open borders" from "open membership"/citizenship). Also the apartheid
  analogy is a rhetorical device of some advocates, not a premise of the arguments.

  - Conflating the empirical fiscal-impact claim with the normative argument; also
  conflating "immigrants are net fiscal contributors" with "the welfare state argument
  fails" — the welfare-state objection is usually about the political sustainability/legitimacy
  of redistribution given free movement (the "transfer state" argument), which is
  compatible with immigrants being net contributors on average. And the objection
  as usually stated is about what a just/stable arrangement can be, not a refutation.

  - Treating the objection as a refutation rather than a constraint: many open-borders
  advocates respond by restricting welfare access for newcomers (or by "gaining" the
  right to move while losing immediate transfer entitlements), so the alleged dilemma
  is a design problem.

  - Also the "internal analogy": within a country, free movement coexists with welfare
  states — but there''s a counter-consideration (shared national identity/coercion,
  or the EU case). Also the "civic integration" point.

  - "Really a position for libertarians": actually many open-borders arguments are
  egalitarian/cosmopolitan, and some are from the left (e.g., labor-movement arguments,
  global equality of opportunity). Also note there''s a distinction between libertarian
  open-borders (property-based) and egalitarian open-borders.

  - Also "empirical evidence shows immigrants are a net fiscal burden" — that''s contested;
  the audit should say it''s contested and depends on the metric, and the summary
  shouldn''t assert it as settled. But I''d rather embed a conceptual error than an
  empirical one. Maybe embed: "the evidence is settled that immigrants are net fiscal
  contributors" — hmm, contested too. Better: make the summary''s empirical claim
  directional but flag-able.


