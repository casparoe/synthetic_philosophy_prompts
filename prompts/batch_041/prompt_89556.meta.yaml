  Interesting option: Avicenna''s flying man. The flying man argument: a person created
  suspended in midair, eyes covered, limbs separated, not perceiving anything — still
  affirms his own existence. Subtle misrepresentations: e.g., claiming it proves the
  soul is immaterial/substance, vs. Avicenna''s actual aim which is to show the soul''s
  self-awareness doesn''t depend on the body, and that self-awareness is not identical
  to bodily perception — and famously it doesn''t by itself prove immortality or immateriality
  (that''s a further step). Also common conflation: the flying man is a thought experiment
  about the "I" being given prior to any sensory data; some say it''s a proto-Cartesian
  cogito — Avicenna''s argument isn''t an inference from doubting to existence; it''s
  not "I think therefore I am" in Descartes''s inferential sense. Also Avicenna''s
  flying man is often said to establish that the soul is a substance distinct from
  body (that''s arguably what Avicenna says it establishes — the soul''s existence
  is affirmed without body). Subtleties: the "floating man" is not about a body floating;
  Avicenna says imagine a person created in a moment, in midair, with limbs spread
  apart, eyes covered, unable to perceive anything external or even his own body parts,
  no memories. He affirms his own existence but not the existence of his body/limbs.


  Common misrepresentations in popular summaries:

  1. It''s a proof that the soul is immortal (it isn''t; immortality needs further
  argument).

  2. It''s exactly Descartes''s cogito (Descartes''s is inferential; Avicenna''s is
  a direct intuition/self-givenness — also Descartes''s "I think" involves doubt/skepticism;
  Avicenna''s doesn''t).

  3. It shows the soul is a substance, which is genuinely Avicenna''s conclusion,
  but with the caveat it''s a claim about the soul''s mode of existence/self-awareness,
  not that the soul is a separate thing that could exist without the body simpliciter?
  Actually Avicenna does think the soul is an immaterial substance that survives;
  the flying man establishes the soul''s existence doesn''t depend on the body for
  its self-awareness. There''s scholarly debate about how strong the argument is and
  whether it presupposes Avicenna''s own theory of the soul.


