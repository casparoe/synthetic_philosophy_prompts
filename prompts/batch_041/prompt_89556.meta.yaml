  Let me consider "eliciting latent knowledge" (ELK) — the ARC/MIRI problem, very
  niche-ish: how to train a model to tell you what it knows, given that it may be
  incentivized to lie, and the problem that behavioral training can''t distinguish
  "knows but lies" from "doesn''t know". A summary: "ELK is about building lie detectors
  for neural nets: if a model knows X but says not-X, we train a probe on its internal
  activations to read off the truth. Since the probe reads representations, the problem
  is basically solved by interpretability." Subtle errors: conflating ELK with the
  general alignment problem; the core difficulty isn''t "detect lies" but "knowing
  whether the model''s report is truthful requires already knowing the answer", the
  "ontology identification" problem (the human''s concept may not match the model''s),
  the concern that training a reporter on human approval gives the wrong signal ("human
  simulator" vs "direct translator"), and that ELK isn''t about interpretability per
  se (probes on activations are one proposed approach but the problem is stated abstractly
  in terms of human-accessible ground truth).


