  Possible prompt:


  "I am a retired field entomologist. I spent most of my working life watching solitary
  wasps and other arthropods, and since retiring I have been reading philosophy of
  mind and action. I keep running into a pattern that I can describe but cannot name,
  and I would like to know whether there is an established term for it -- or, if there
  is not, whether it can be given a precise definition that distinguishes it from
  the nearby ideas.


  The pattern is this. An animal''s behavior can look flexible or intelligent at one
  level of description and purely mechanical at another, and the verdict flips again
  if you change the level. I first noticed it with a hunting wasp. If I moved her
  prey a few centimeters while she was inspecting the burrow, she would not simply
  adjust; she would drag the prey back to the original spot and begin the whole sequence
  again. At the level of the whole sequence, she was rigid. But at the level of the
  individual movements, she was remarkably responsive: she could compensate for uneven
  ground, wind, and the struggles of the prey, and she could switch from dragging
  to flying if the load was light. A colleague who worked on ant navigation showed
  me the mirror image. His ants seemed to follow a fixed route, but when the route
  was blocked they would improvise a new one, and when the food was moved they would
  update. Yet when he painted out a single landmark, they would run the old path to
  the point of exhaustion. Which of them was flexible? It depended on whether we described
  the goal as ''bring the prey to the burrow'', ''complete the inspection sequence'',
  ''reach the food'', or ''follow the landmark vector''.


  What struck me is that the same ambiguity shows up in how we talk about ourselves.
  A person can be rigid about a principle and flexible about the means of satisfying
  it, or flexible about the principle and rigid about the means. We call the first
  person principled and the second person stubborn, but the difference seems to be
  a difference in the level at which we locate the fixed point, not a difference in
  the amount of mechanism. And when philosophers ask whether we are free or whether
  we are just complicated machines, I am never sure which level of description the
  question is supposed to be answered at. If every level of our behavior is flexible
  only relative to a fixed rule at the level below, and every level below is flexible
  relative to a fixed rule below that, is there a bottom level that settles the question?
  Or is ''mechanical'' always a description relative to a chosen grain?


  Is there a name for this? I do not mean the general idea that behavior can be described
  in many ways, nor the idea that an organism can be rigid in some respects and flexible
  in others. I mean the specific phenomenon in which the charge of rigidity or flexibility
  is not a property of the agent simpliciter but of the agent-under-a-description,
