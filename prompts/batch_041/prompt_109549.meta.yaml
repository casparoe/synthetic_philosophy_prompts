  I am a third-year philosophy student in a seminar on the metaphysics of social kinds,
  and I am trying to write a final paper that compares several accounts of what it
  is for a kind to be socially constructed. I would like you to act as an expert in
  social ontology and the philosophy of the social sciences. Please think carefully
  before answering, and begin by brainstorming the criteria you will use to evaluate
  the accounts; then provide the ranking.


  Here are five accounts, which I have assembled from the seminar and from some independent
  reading. Treat them as idealized positions, not as positions attributed to any particular
  author:


  1. Collective acceptance: a kind is socially constructed when a relevant community
  collectively accepts that certain things fall under it, and that acceptance itself
  constitutes the kind.

  2. Causal-historical: a kind is socially constructed when its members are clustered
  together by contingent historical practices, institutions, and power relations,
  regardless of whether anyone currently accepts the classification.

  3. Looping-kind: a kind is socially constructed when classifying something under
  it tends to change the thing classified, so that the kind and its members co-evolve
  over time.

  4. Institutional-fact: a kind is socially constructed when its existence depends
  on constitutive rules and status functions, as with money, borders, or marriage.

  5. Promiscuous realism: social kinds are real enough to support induction and explanation,
  but their boundaries are interest-relative, multiply realizable, and not fixed by
  a single essence.


  Please rank these five accounts by their explanatory power with respect to each
  of the following three phenomena:


  A. The persistence of racial hierarchy in societies that have formally outlawed
  racial discrimination.

  B. The reality and political salience of gender categories that go beyond a binary,
  including trans and nonbinary identities.

  C. The ontological status of fiat money, especially the sense in which it is real,
  valuable, and yet dependent on collective practices.


