  Key features of the moral testimony puzzle:

  - The question is about whether to form a moral belief / act on a moral judgment
  on the basis of someone else''s say-so, when you can''t see the reasons yourself.

  - The intuition: it''s fine to trust experts about facts (your doctor, your mechanic)
  but seems *off* to trust them about moral matters — you should decide for yourself.

  - The puzzle: why the asymmetry, given that moral truths are as objective as empirical
  ones (for a realist), and testimony transmits knowledge in general.

  - Answers: (a) moral deference is fine (optimism: Hopkins, Sliwa, maybe Enoch);
  (b) it''s problematic because moral knowledge requires understanding/grasping reasons
  (Hills, McGrath: "pure moral deference" — deference to a moral judgment without
  the reasons); (c) it undermines agency/autonomy (Wolff, Darwall?); (d) it''s fine
  for *some* moral matters but not others (Hopkins'' distinction between "should I
  do X" and "is X wrong").


