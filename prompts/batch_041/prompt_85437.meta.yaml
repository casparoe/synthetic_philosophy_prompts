  Aristotle on money: consistency audit. The asker is e.g. a PhD student in ancient
  philosophy / history of economic thought. Commitments: (1) For Aristotle, exchange
  is grounded in need (chreia) and aims at proportional reciprocity, not maximization.
  (2) Money is a conventional (nomos) representative of need, introduced to make diverse
  goods commensurable. (3) Aristotle denies that qualitatively different goods are
  commensurable in themselves; money makes them commensurable "by convention" for
  practical purposes. (4) Aristotle condemns retail trade and usury as unnatural (chrematistics),
  because money''s telos is exchange, not breeding. (5) Aristotle thinks the household
  (oikonomia) is the natural site of acquisition, and acquisition for the household''s
  needs is natural, whereas unlimited acquisition is not.


  Genuine tensions: (2) and (3): if goods are incommensurable in themselves, and money
  merely "represents" need, how does money achieve real commensuration? The aporia
  at NE 1133b: "there is no true commensurability, but by convention it is made commensurable
  for practical purposes" — the tension is that Aristotle wants proportional reciprocity
  to be objectively determinable yet grounds it in subjective need. (4) and (1): if
  exchange aims at proportional reciprocity to restore equality, then exchange is
  a corrective/natural act; but money-exchange (retail) is condemned, yet retail is
  the paradigm of proportional exchange with money. Also (2) vs (4): if money is a
  mere convention/token for need, why is usury "unnatural" specifically because money
  is barren? The barrenness of money is a natural-teleological claim, which sits awkwardly
  with the conventionalist account of money. That''s a genuine, non-obvious tension:
  conventionalism about money vs. naturalism about money''s telos.


