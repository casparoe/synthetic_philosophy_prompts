  Grice: the conceptual issue of *what is said*. Grice''s program assumes a division
  of labor: semantics gives the truth-conditional content ("what is said"), pragmatics
  handles the rest. But there''s a problem: many utterances'' "what is said" seems
  to already include pragmatic enrichment. Classic example: "The ham sandwich left
  without paying" (Nunberg) — hmm, that''s a well-known example.


  Another in-the-weeds issue: Grice''s account of *speaker meaning* requires that
  the speaker intend to produce an effect in the audience by means of the audience''s
  recognition of that intention. The problem: this seems to make *self-directed* thought,
  or *sincere assertion to no one*, not meaning. Also, cases where the speaker''s
  intention is to be recognized but the audience''s recognition depends on background
  conventions (the "problem of the arbitrary signal").


  Hmm. Let me pick the issue of *conventional implicature* as a conceptual anomaly.
  Grice introduced it as a third category: content that is (a) conventional (not derived
  from maxims), (b) non-truth-conditional, (c) not part of what is said. Standard
  examples: "but", "therefore", "even", appositives. The conceptual issue: does the
  category earn its keep? Grice''s own criterion for what is said (truth-conditional
  content, what''s "strictly said") makes "but" contribute nothing to what''s said,
  yet intuitively "but" does contribute to meaning and is not cancelable. Some (Potts)
  argue it''s a distinct dimension of meaning; others (Bach, relevance theorists)
  argue the examples are just entailments or presuppositions or are part of what is
  said. That''s a real, in-the-weeds debate. A model might know Potts, Bach... but
  it''s genuinely in the weeds.


