  The Unilateralist''s Curse Is a Claim About Decision Rules, Not About Acting Alone


  Suppose that a number of agents are each in a position to take some action that
  affects everyone, and that each of them can act without the agreement of the others.
  Each agent is a decent but fallible judge of whether the action is worth taking
  — say each has a two-thirds chance of getting it right. The action is taken if any
  one of them judges it worth taking. As the number of agents rises, the chance that
  the action is taken stays near one, while the chance that it is worth taking does
  not. So a group of competent agents reliably does the wrong thing. This is usually
  called the unilateralist''s curse, and the usual remedy is a principle of conformity:
  in such cases, agents should act only in accordance with some collective decision
  procedure.


  I want to argue that both the diagnosis and the remedy are stated in the wrong terms.
  The diagnosis is put as a claim about acting alone — as though the mischief lay
  in the fact that one agent''s judgement can bind the rest. But aloneness is doing
  no work. What generates the curse is the shape of the decision rule: it is a disjunction
  over agents. The action goes ahead if agent 1 is right, or agent 2, or agent 3.
  Any decision rule of that form will have the same property, whether it is triggered
  by one agent or by a committee that acts on any single member''s say-so. Equally,
  a rule that requires a large supermajority can fail in the opposite direction: if
  the agents'' errors are correlated, requiring agreement screens out nothing, because
  agreement is exactly what correlated error produces.


  That last point deserves a name. Call diffuse unilateralism the case in which agents
  reach their judgements independently, so that their errors are largely uncorrelated;
  and clustered unilateralism the case in which they share a training, an incentive,
  an institution, or a body of evidence, so that their errors move together. The classic
  curse is a claim about the diffuse case. But the cases that worry me are clustered,
  and there the conformity remedy is not merely weak but counterproductive: it converts
  many small independent chances of being wrong into one large shared chance, and
  it launders that chance as legitimacy. A unanimous committee that shares a blind
  spot is not a correction to a thousand individuals who share it; it is the same
  blind spot with better paperwork.


