  Draft:


  I''m a novelist, about half way through a book about a family of pawnbrokers, and
  I keep circling back to the Merchant of Venice — the trial especially, but also
  the casket scenes and the business with the rings. What I want is a proper reading
  of the play through Aristotle''s thinking about money and exchange, and I''d rather
  you were quite specific rather than giving me the usual stuff about greed and mercy.
  The bits of Aristotle I have in mind: money as a thing that exists by agreement
  or convention rather than by nature, so that it can be made useless if we all decide
  to stop using it; the distinction between acquiring goods for the needs of a household
  (which is naturally limited) and money-making for its own sake, which has no limit
  and which he thinks is a perversion of the art of acquisition; his claim that usury
  is the worst of these because it makes money breed, when money exists for exchange;
  and the awkward passage in the Ethics where he says exchange requires a proportion
  between things that are utterly unlike, that need is what really holds the exchange
  together, and that money is only the stand-in for need. He never quite solves the
  problem of how unlike things are meant to be commensurable at all, and I suspect
  that gap is where the play lives.


  Then: the bond is an attempt to make a man commensurable with money — a pound of
  him priced like a commodity — and the whole trial turns on whether that can be done.
  Portia''s ruling — no drop of blood, exactly a pound, and if you spill any your
  goods are forfeit — is often called a quibble. But I want to know whether it''s
  better read as Aristotle''s idea of equity (the correction of a written law where
  its generality fails in the particular case), or whether she simply out-literalism''s
  Shylock, and what that says about the play''s view of justice. And whether the play
  actually vindicates Aristotle''s view that usury is unnatural, or whether it quietly
  shows that Antonio''s world is just as transactional — bonds, forfeitures, rings
  demanded back — so that the usury/nature line doesn''t hold. Then the caskets: gold
  and silver and lead, worth vs price, and Aristotle''s point that the thing that
