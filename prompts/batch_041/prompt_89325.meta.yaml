  Better subtle errors:

  1. Conflating free-floating rationale (a rationale that is not represented by any
  mind) with the claim that the mechanism itself has beliefs/desires — i.e., that
  natural selection is a rational agent. Dennett explicitly denies that natural selection
  is a reasoner in a literal sense (the rationale is "free-floating," not possessed).
  Actually Dennett sometimes speaks of Mother Nature as an intentional system but
  that''s a stance.

  2. Overstating: "free-floating rationales are real reasons, just unowned" — Dennett''s
  point is about a genuine explanatory pattern, and he does think the rationale is
  there, not merely a projection (contrast with e.g. mere metaphor). Actually Dennett
  thinks free-floating rationales are objective features — "there is a rationale"
  is true even without a reasoner. Yes, Dennett says these are real reasons in the
  sense that they explain why the behaviour works, but the reason is not anyone''s
  reason — the organism needn''t represent it. That''s the key: "the reasons are free-floating"
  — no one has them. So a misrepresentation: "the bee has the reason unconsciously."

  3. Conflating with Millikan/teleosemantics — that''s a different program (about
  content of representations).

  4. Confusing with the claim that evolution produces genuine intentionality in the
  "aboutness" sense; Dennett thinks aboutness arises later, and free-floating rationales
  are the ground floor.

  5. Confusing "free-floating rationale" with "the intentional stance is just a useful
  fiction/instrumentalism" — Dennett''s stance is not straightforwardly instrumentalist
  (he calls himself a "mild realist" about patterns; "real patterns").

  6. Also the connection to "competence without comprehension" (2017) vs the 1980s-90s
  texts.

  7. Another misrepresentation: that the view entails panpsychism or that the view
  denies there is anything more to human reasoning than free-floating rationales —
  the "Dennett thinks you and I are just complicated bees" overstatement, and Dennett''s
  claim that human comprehension is a real difference in degree that becomes a difference
  in kind (the "competence without comprehension" contrast; he holds that human language
  and culture give rise to genuine comprehension, "the tower of generate-and-test").


