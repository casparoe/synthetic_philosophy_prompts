  Draft:


  "I''ve been trying to work out whether the ''strange inversion of reasoning'' that
  gets credited to Darwin and Turing is a local move or a fully general one, and I''d
  like a credence from you rather than a summary of the literature.


  Start with the pattern as I understand it, so you can push back if I''ve got it
  wrong. In the Darwinian case, the pre-inversion reasoning runs: design requires
  a designer, so the appearance of design in organisms presupposes a mind that comprehended
  the design. The inversion says: the mind that comprehends is itself a product of
  a process with no comprehension in it — blind variation and differential retention
  — so comprehension is downstream of competence, not its precondition. In the Turing
  case, the pre-inversion reasoning runs: computation requires something that comprehends
  the rules it is following, so a machine can at best simulate thinking. The inversion
  says: the comprehending rule-follower is itself a machine executing a computation,
  so the thing we thought was the precondition is the thing to be explained.


  Both inversions stop at a threshold: they explain competence without comprehension,
  but they leave comprehension itself in place as a primitive at the top — the designer''s
  insight, the mathematician''s understanding. What I want a number on is the reflexive
  step:


  (P) There is no stratum at which comprehension is primitive. Comprehension is itself
  the product of competence-without-comprehension processes, and it is a matter of
  degree and organization rather than a property a system either has or lacks. Consequently,
  any sharp line between systems that ''merely'' have competence and systems that
  genuinely comprehend is drawn by our explanatory interests, not by nature.


  Give me your credence in (P), decomposed. I expect the number to be a product or
  mixture of at least these, but add or split terms as you think the question requires,
  and give each a number with one line of justification:


  1. Whether the two inversions are sound as stated...

  2. Whether ''comprehension'' denotes a natural kind with a determinate threshold,
  or is a degree concept / folk category...

  3. Whether the mechanisms actually on offer (selection, gradient descent, cultural/memetic
  evolution, ...) can produce the features we take to be diagnostic of comprehension
  — recursive meta-representation, a global workspace, model-based control, ... —
  or whether something extra is required...

  4. Whether the reflexive application is legitimate: if our own comprehension is
