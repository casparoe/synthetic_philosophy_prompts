  Key Camus argument (paraphrase): The guillotine is the only penalty in which the
  criminal is given advance notice and time to prepare — the condemned man is told
  "you shall be killed tomorrow" and is left to wait; the punishment is not the death
  but the waiting, a torture that no free person can imagine. Also: capital punishment
  is a murder that is premeditated, calculated, and administrative; it''s not the
  crime but the state''s cold deliberation that makes it scandalous. And Camus also
  raises the "example" argument: does the death penalty deter? He notes he doesn''t
  know; he notes the argument from social utility.


  The Stranger: Meursault''s crime is unpremeditated, committed "because of the sun"
  — a passionate, heat-driven act, not a calculated one. Yet the trial''s verdict
  turns on his character (not grieving at his mother''s funeral) rather than on the
  crime. He''s condemned by the mechanism of the French state; the guillotine. There''s
  a tension: Camus''s novel''s protagonist is executed for a murder he did commit,
  and the machinery is exactly what Camus later attacked. Is Meursault''s execution
  presented as absurd because it''s a death sentence at all, or because the jury judged
  his soul rather than his act?


