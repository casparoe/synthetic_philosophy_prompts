  Elements:

  1. Personal hook: jury service / voir dire in a capital case; asked whether they
  could vote for death; the questions were about them, not the facts. (Mirrors the
  novel: Meursault is condemned for who he is.)

  2. The ask: read The Stranger through Camus''s own abolitionism; specifically ask
  whether the novel''s trial and final chapter support the essay''s arguments or sit
  against them.

  3. Inject the niche framing: the distinction between three candidate "wrongs" of
  capital punishment (the desert wrong, the method/cruelty wrong, the "fixing of the
  hour" wrong), and the observation about the interval (the novel is narrated from
  inside it); ask which the novel dramatizes.

  4. Ask about the tension: the final chapter''s peace/acceptance and the wish for
  a crowd at the execution vs. the essay''s claim that the death penalty is the supreme
  scandal — does the novel undercut abolitionism or sharpen it? Does the novel''s
  ending make the guillotine a fulfillment rather than a horror? Is the novel''s absurdism
  at odds with the essay''s moral urgency?

  5. Also: the essay argues the state''s killing is the "most premeditated" murder,
  whereas Meursault''s killing was unpremeditated (the sun) — so the novel''s plot
  inverts the essay''s contrast; ask what to make of that.

  6. Ask where the reading resists: e.g., if the text doesn''t support an anti-death-penalty
  reading, say so.

  7. Ask for what the novel adds that the argument alone doesn''t. Also maybe: which
  scenes to point to for a discussion (book club-ish) — optional.

  8. Don''t ask for citations. Avoid quotes.


