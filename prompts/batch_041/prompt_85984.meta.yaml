  "Both contrasts are usually run together but shouldn''t be. ''Indicative'' and ''subjunctive''
  are grammatical labels for the form of the conditional; ''counterfactual'' is a
  semantic label, meaning that the antecedent is false (or at least taken to be false).
  The two cut across each other: a conditional can be subjunctive without being counterfactual,
  as in (b), where the doctor''s ''if he''d been poisoned...'' is offered as part
  of an argument that he was poisoned, so the antecedent is not assumed false.


  (a) is the standard illustration. The indicative ''If Oswald didn''t shoot Kennedy,
  someone else did'' is true — someone did shoot him — while the subjunctive ''If
  Oswald hadn''t shot Kennedy, someone else would have'' is false, or at least not
  supported by the same facts, since the assassination might have been aborted. So
  the same antecedent and consequent can differ in truth value depending on mood.
  This is what makes ''if'' so hard.


  On the probability question: the hypothesis is that P(if A, then B) = P(B|A). This
  holds up well for indicatives — e.g., the probability that if Oswald didn''t shoot
  Kennedy someone else did is just the conditional probability, which is 1. Adams
  showed that this hypothesis can''t be combined with a truth-conditional semantics,
  because the triviality results prove that conditionals have no truth conditions
  at all. So any account on which ''if A then B'' expresses a proposition — Stalnaker''s
  possible-worlds account, say — is refuted, and we have to treat ''if'' as expressing
  a conditional probability rather than a proposition.


  That said, a uniform account of ''if'' is still possible if we treat ''if'' as a
  restrictor rather than a two-place connective, as Kratzer does: ''if''-clauses restrict
  the modal base of the operator in the consequent. On this view (a) and (b) differ
  only in which modal base is restricted, not in the meaning of ''if''.


  (c) is trickier: ''If you''re thirsty, there''s beer in the fridge'' doesn''t seem
  to assert any connection between your thirst and the beer. Its truth doesn''t depend
  on whether you''re thirsty, so it shows that ''if''-clauses are not conditional
  connectives in the usual sense and that a truth-conditional semantics is the wrong
  shape for them. Presumably they''re a pragmatic phenomenon, but I''m not sure how
  to square them with the restrictor view."


