  Another good residue point: Jeffrey''s rule requires the partition to be given and
  fixed, and the new credences on it to be assigned; but in ML the natural object
  is a distribution over the entire output space (labels), which is a partition of
  the outcome space only if the classes are exhaustive and mutually exclusive — so
  the partition structure is a real constraint (you can''t do a Jeffrey update to
  a "soft label" over a non-partition, e.g., multi-label or over "relevant features").
  Also, in ML the "evidence" arrives once and is used to produce the target; there''s
  no distinction between "the world changed" (i.e., the update reflects new information
  about a fixed world) vs. "the agent''s policy changed" — Jeffrey''s picture is purely
  epistemic.


