  Phenomenon: **The discharge asymmetry.** The asker notices that the two emotions
  have different "costs of discharge": guilt is discharged by acknowledgment and repair;
  shame is discharged by concealment or by status-restoration. And they notice that
  when an institution tries to be morally enlightened by making everything about acts
  rather than persons (i.e., favoring guilt over shame), it inadvertently makes the
  discharge cheap — because an act can be apologized for in a bounded way, whereas
  a self can''t be apologized for — so repeated wrongdoing becomes sustainable. Meanwhile,
  the shame regime, which is morally crude (it punishes persons for acts), has a deterrent
  the guilt regime lacks, because the person can''t buy their way out with a bounded
  ritual.


