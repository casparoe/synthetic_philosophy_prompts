  "(a) The parity principle is the claim that if something outside the head plays
  a role that, if it went on inside the head, we''d unhesitatingly call part of a
  cognitive process, then it is part of the cognitive process. Clark and Chalmers
  use Otto and Inga to make this concrete. Inga has a normal memory and recalls the
  address of the museum from it. Otto has Alzheimer''s and keeps the address in a
  notebook, which he consults. Clark and Chalmers say the two are functionally equivalent:
  the notebook does for Otto what memory does for Inga, so if Inga''s memory counts
  as cognitive then Otto''s notebook counts as cognitive too, at least while he''s
  consulting it. They add that the external resource has to be reliably available,
  directly accessible, and automatically endorsed, which is what stops the view from
  saying that any object you happen to use is part of your mind. This is really just
  the familiar Putnam/Burge externalism about mental content, applied to the vehicles
  of thought instead of the contents.


  (b) The objection is that the argument commits what''s called the coupling-constitution
  fallacy. Rupert makes it: he says that showing an external system is causally coupled
  to a cognitive process only shows that it interacts with that process, not that
  it''s a part of it. Coupling is a causal notion and constitution is a metaphysical
  one, and Clark and Chalmers slide from the first to the second. Rupert adds the
  bloat worry — if coupling is enough then phones, notebooks and eventually the whole
  internet end up inside the mind, which is absurd. Adams and Aizawa have a related
  complaint, though their main concern is different: they argue that the contents
  of Otto''s notebook have only derived content, whereas real cognitive states have
  non-derived content, so the notebook can''t be cognitive no matter how well coupled
  it is.


  (c) I don''t think so. The three conditions in (a) are doing real work, so the thesis
  doesn''t make the boundary of the mind arbitrary. And in any case nobody actually
  holds the crude version where coupling alone is sufficient — the bloat objection
  is aimed at a view no one defends."


