  2. An AI that does your evening examination of conscience for you: you journal or
  dictate your day, it tells you where you fell short, and it adjusts next week''s
  focus. Would he use it? Would he trust its verdicts? What does his treatment of
  the Quaker friend who told him he was proud suggest about whether he''d want a machine
