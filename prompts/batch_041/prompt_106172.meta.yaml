  Draft:


  "So I''ve been reading Franklin''s Autobiography again, specifically the part where
  he tries to hit moral perfection — the 13 virtues, the little ivory notebook, one
  virtue a week, the black spots he''d wipe off with a wet sponge. A couple of things
  strike me. First, the whole thing is basically a self-tracking protocol: a ledger,
  a weekly focus, daily evening review. Second, he more or less admits it failed in
  the ways that matter — Order he never got, and on Humility he says he got the appearance
  of it rather than the reality, and then undercuts the whole thing by noting he''d
  be proud of his humility if he''d actually conquered his pride. Third, he designed
  it to be sect-neutral because he wanted to publish it as a teachable method — he
  even had a title in mind for the book. Fourth, and I think this is the most underrated
  bit, he insists that vicious actions aren''t harmful because they''re forbidden;
  they''re forbidden because they''re harmful, and he thought he could sell virtue
  to young men as the surest route to a fortune. So the project is prudential, method-y,
  and pretty indifferent to whether you''re actually good deep down, as long as the
  conduct comes out right.


  Now transport him forward. I want you to predict his views on four things that didn''t
  exist in his lifetime, and I want the predictions tied to specific features of his
  actual project rather than to ''Franklin was a practical guy'' generalities.


  1. Habit-tracking apps with streaks and push notifications (think Streaks, Habitica,
  or the money-at-stake apps where you get charged if you miss a target). Would he
  see these as the natural continuation of the little book, or as something that changes
  the character of the practice? Be specific about which of his 13 virtues a streak
