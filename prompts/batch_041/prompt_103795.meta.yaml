  Hofstadter''s account (as I recall, from GEB ch. 6 "The Location of Meaning"):

  - He asks: where is the meaning of a record? Not in the grooves as such; the grooves
  have no intrinsic meaning. Meaning arises when a record player''s mechanics are
  isomorphic to the groove patterns in the right way, producing sound.

  - He introduces the idea of "the outer message" vs "the inner message": the inner
  message is the explicit content (e.g., the music); the outer message is the set
  of implicit instructions about how to decode — e.g., 33⅓ rpm, the RIAA equalization
  curve, "play this on a phonograph." The outer message is often not explicit in the
  record; it''s supplied by the conventions/machinery of the receiver. He calls the
  outer message a "frame" — like the frame around a picture, which isn''t part of
  the picture but is needed to delimit it.

  - He notes the potential regress: the outer message itself needs an outer-outer
  message (how to interpret the instructions), and the regress is stopped not by a
  final explicit message but by the receiver''s built-in structure/hardware and by
  shared conventions. He calls this something like the "frame" being "recursively"
  handled. Actually he says the outer message can be arbitrarily large and "the frame"
  can be viewed as part of the message; he discusses "the idea that the frame is a
  message about the message".

  - DNA example: the DNA is the inner message (protein sequences), and the outer message
  (how to read the code, the genetic code, the machinery) is not written in the DNA
  but in the ribosomes/tRNA/aminoacyl-tRNA synthetases — i.e., in the cell''s hardware.
  He says something like "the cell''s decoding apparatus is the outer message" and
  that the code is "frozen accident" / a product of evolution — actually he says the
  outer message for DNA is written in the "cell''s translation machinery" and that
