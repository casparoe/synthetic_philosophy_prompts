  Final answer text:


  "Hofstadter''s distinction is between three layers of a message. The inner message
  is what the message says: on a record, the music. The outer message is the set of
  instructions that have to be applied before the inner message can be got at — the
  speed the record is to be played at, the equalization curve the lathe used when
  it was cut, the fact that it wants a stylus and not a laser. The frame is the outermost
  layer, the one that says what sort of object this is and that it is a message at
  all: not the first sentence of a novel but the conventions that make a bound block
  of printed pages a novel.


  Why this shows that the meaning is not in the record: the grooves are a wiggly line,
  and nothing about the shape of the line, considered by itself, prefers Bach to static.
  The meaning appears when the record meets a machine whose workings are isomorphic
  to the pattern in the groove, so that the wiggles are converted into the right vibrations.
  The record cannot be its own outer message — it doesn''t say ''play me at 33⅓''
  — so half of what is needed for the music to exist comes from the player and from
  us, and that is the sense in which meaning is not located in the record.


  DNA has the same structure. The inner message is the base sequence, which specifies
  the proteins; the outer message is what tells the cell how to read the sequence,
  i.e. which triplets go with which amino acids and where the sequence is to start
  and stop, and this outer message is written into the DNA itself, in the regulatory
  regions and the start and stop codons. That is why a Martian who found the molecule
  would have the message but not the key, and would be stuck.


  The score and the recording work the same way. The inner message is the fugue in
  both; the outer message is notation in the one case and playback convention in the
  other — what a clef means, what speed the turntable turns. Your cylinder is the
  limiting case of an outer message that is almost explicit: the card is the outer
  message, and when the card is lost, the cylinder is no longer a message for anyone,
  just wax.


  On the objection: Hofstadter would say that the outer message is a matter of convention,
  and conventions belong to communities; the reason we play records at 33⅓ is that
  we agree to. So the meaning of a record is relative to the community that decodes
  it, and the objection is half right. His position is that there is no fact of the
  matter about what the grooves mean, only facts about what a given community hears
  in them — which is close to the later Wittgenstein''s claim that meaning is use,
  and which is why I think the objection is right in spirit even though Hofstadter
  would resist the label of relativist."


