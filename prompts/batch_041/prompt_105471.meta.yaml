  Hmm, the classic subtle flaw: The Dutch book argument as usually stated shows that
  if your credences violate the probability axioms, then there is a set of bets such
  that each is individually fair by your own lights (positive expected value by your
  own credences) and yet together they guarantee a loss. Then step: "a rational agent
  wouldn''t accept a set of bets that guarantees a loss" — but that''s a mistake,
  because each bet individually seems good, and the agent may not be able to compute
  the combination; also, the guarantee of loss assumes the bets are all settled and
  that the agent can''t reason her way out. So the flaw is in the premise that a rational
  agent must be immune to sure loss from bets she''d accept individually. And the
  cost: giving it up means Dutch books lose their force against probabilism, but you
  might salvage it via a "depragmatized" reading (Christensen): the argument shows
  incoherence in the sense that your credences commit you to a set of evaluations
  that can''t all be correct simultaneously — the "sure loss" is a symptom of inconsistent
  evaluations, not itself the problem. That''s a well-known move (Christensen''s "Dutch
  Books Depragmatized"). That''s a nice answer.


