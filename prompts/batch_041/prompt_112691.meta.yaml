  have because the outcome is unchangeable and you''ll suffer anticipatory dread —
  but that''s about the direct utility of the info (non-instrumental value of the
  information state), which Good''s theorem excludes. That''s a nice point for the
  adjudication: Good''s theorem says the info can''t lower your *expected utility
  of the decision*, but it doesn''t say knowing can''t make you worse off in total,
  because (i) the info has direct hedonic/psychological costs, (ii) the info can change
  your preferences or your action set, (iii) the acquisition can be costly, (iv) the
  act-state independence assumption can fail, and (v) you may not be able to commit
  to acting optimally on it.


