  - Locke''s views on education — in the weeds, but disagreement? Could be two people
  arguing about whether Locke''s tabula rasa / "some Thoughts Concerning Education"
  ... need actual content.

  - Are genuine moral dilemmas possible? — good philosophical disagreement: one says
  moral dilemmas are impossible because ought implies can / a moral system can''t
  issue conflicting obligations; other says that''s just a definitional fiat, real
  cases like Sophie''s choice. In the weeds: could bring in the distinction between
  epistemic and ontological dilemmas, the "ought implies can" argument, the agglomeration
  principle (if ought A and ought B then ought (A and B)) — that''s a nice in-the-weeds
  argument. The agglomeration objection: if you ought to do A and ought to do B, then
  by agglomeration you ought to do A and B; if you can''t do both, then by ought-implies-can
  you can''t be obligated to do both, contradiction. The dilemma defender: rejects
  agglomeration, or says the obligations are prima facie and one is overridden, or
  says it''s about "ought" being overridden... Also Marcus on moral dilemmas, Sinnott-Armstrong.
  That''s a nice one.

  - Good''s theorem on the value of information — in the weeds: I.J. Good''s 1967
  "On the Principle of Total Evidence" — the theorem that free information can''t
  hurt (expected utility of info non-negative) but only for decision problems where
  the act doesn''t causally affect the information source. The counterexamples: the
  smoking lesion problem, Newcomb-type cases, the "toxin puzzle"-ish, and the case
  where acquiring info changes you (e.g., a doctor''s question "would you want to
  know?"), also the "disclosure" cases where the info is about your own choice. Disagreement:
  one says info is always good (Good''s theorem), other says counterexamples show
  it can hurt — like the case where you''d be asked to bet after seeing the coin,
  or the "unwelcome news" case. This is quite in the weeds. And personally relevant:
  maybe someone got genetic testing results, or a medical test, or... Actually Good''s
  theorem with the caveat: information can have negative value when you can''t commit
  to ignoring it, or when the fact of your receiving information correlates with the
  world''s state (smoking lesion). Nice.

  - The dogmatism paradox — Kripke''s dogmatism paradox, in the weeds, from "Two Paradoxes
  of Knowledge" (1971 lectures, published in Philosophical Troubles 2011). The paradox:
  if I know P, then P is true, so any evidence against P is misleading evidence; since
  I know P, I can know that any evidence against P is misleading evidence; so I can
  rationally dismiss any future counterevidence. That''s nicely in the weeds, and
  disagreement-friendly: one says this shows knowledge attributions are too strong
  / we shouldn''t claim knowledge; other says the argument equivocates or the paradox
  rests on assuming you know that you know, or that rational dismissal requires knowing
  the misleading-evidence claim, which you can know while still being unable to ignore
  the evidence (Harman''s point: it doesn''t follow that you should ignore, or that
  you''re justified in ignoring; you can know it''s misleading but still need to examine
  it).


