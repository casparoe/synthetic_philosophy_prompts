  rather than obscure technical facts:


  Side A (info can''t hurt): "there''s an actual theorem in decision theory: if information
  is free and you''re rational, knowing more can never lower your expected payoff,
  because you can always just act as you would have acted without the information.
  The extra info can only give you more options (you could ignore it)."


  Side B (info can hurt): "That ignores that I can''t un-know it. Cases: (i) you can''t
  pretend you didn''t learn it — once I know I have the gene, I''ll start behaving
  differently, and that''s not a choice; (ii) my utility might change — if I know,
  dread could ruin the years I have; (iii) the knowledge may make things worse through
  other people (insurance, employers); (iv) sometimes the info is about what I would
  do anyway (the info and my act are correlated), so acting ''as if I didn''t know''
  is not available; (v) if I learn it, I can''t credibly promise to ignore it."


  A''s reply: "Points (i) and (ii) are not counterexamples to the theorem, because
  the theorem assumes the info is free, that your preferences are fixed, and that
  you can act on it; if knowing changes your behavior, then the option set has changed,
  and of course the theorem doesn''t apply. But notice: if you could commit in advance
  to ignoring it, then it couldn''t hurt. So the theorem is right about the formal
  core, and the ''knowing can hurt'' cases are all cases where you can''t commit."


  B''s reply: "But that means the theorem is nearly vacuous as a practical claim,
  because we can rarely commit to ignoring info — and worse, in real cases like medical
  testing, the decision about whether to test is precisely a decision about how it
  will change us, which the theorem assumes away."


  That''s a good, non-strawman exchange with a clear verdict structure: A is right
  that the theorem holds under its assumptions and that the alleged counterexamples
  violate them; B is right that the assumptions are frequently violated and that the
  theorem therefore doesn''t settle real cases; both are missing the distinction between
  the value of information for a fixed decision problem and the value of the information
  state for the agent (including the option value of future decisions, and the fact
  that a positive-EVI test can still be one you shouldn''t take if you can''t commit,
