  Lewis on convention joke: could be good. Lewis''s Convention: regularity R in behavior
  of members of population P when they are agents in a recurrent situation S is a
  convention iff (1) everyone conforms to R; (2) everyone expects everyone else to
  conform to R; (3) everyone prefers to conform to R on condition that others do,
  since S is a coordination problem and uniform conformity to R is a coordination
  equilibrium. And: "It is possible that R is a convention even though..." Also Lewis''s
  point that conventions need not be arbitrary in the sense of "chosen", and can arise
  without agreement; and that convention "does not require that anyone has ever thought
  about it"; and the point about the "first mover" — a convention begins with a precedent,
  which isn''t itself a convention (Lewis: "a regularity that begins with a precedent"
  — the first instance is not a convention, but subsequent conformings are, once expectations
  form). Also Lewis on "salience" (Schelling points) and how conventions evolve.


