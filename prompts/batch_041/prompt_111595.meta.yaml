  Background: a colleague of mine, a set theorist, defends a position I find too quick.
  Since the continuum hypothesis is independent of ZFC — Gödel and Cohen between them
  showed that neither it nor its negation can be decided by the standard axioms, assuming
  those axioms are consistent — he says the situation is exactly that of the parallel
  postulate in geometry. Euclid''s fifth postulate, he points out, is likewise not
  decided by the rest of the axioms, and the resolution there is now a settled and
  unremarkable part of mathematics: we simply have several geometries, Euclidean and
  non-Euclidean, and no one asks which of them is *the* true one. He concludes that
  CH is a matter of choice — that there is no fact of the matter whether the continuum
  is ℵ₁, that we may adopt CH or its negation as convenience dictates, and that the
  search for new axioms that would settle it is a category mistake, a hankering after
  a single ''intended model'' that the analogy shows we should have outgrown.


  I want an audit of the analogy, not a survey of the literature. Specifically:

  1. A correspondence table: what maps onto what. Which items on the geometry side
  play the roles of ZFC, of CH, of the models of non-Euclidean geometry, of the independence
  proof, of ''the intended model'', of the discovery that there is no privileged geometry.

  2. Where the mapping breaks — and here I care about the technical asymmetries, not
  just the philosophical ones. In particular: how the independence of the parallel
  postulate was established (by constructing models, and so by interpreting the axioms
  in a theory we already trusted) versus how the independence of CH is established
  (by forcing, and by relative-consistency arguments that quantify over models of
  ZFC from the outside), and what that difference does to the claim that the two cases
  are ''the same kind of thing''. Also: what, if anything, plays the role on the set-theoretic
  side of the pre-theoretic anchor that physical space played in the geometry case
  — the thing that let the nineteenth-century debate be, in part, a question about
  which axioms describe something antecedently given.

  3. What the analogy quietly imports. Does it smuggle in a plurality of structures
  where set theory arguably presents a single cumulative hierarchy? Does it trade
  on the fact that in geometry ''non-Euclidean'' eventually acquired models we could
  point to, while ''¬CH'' is a statement whose ''models'' are countable transitive
  sets or Boolean-valued constructions that are not, in the naive sense, what the
  continuum is?

  4. The verdict. Does the analogy support his conclusion — that CH has no truth value
  and the axioms are a free choice — or only the weaker claim that ZFC does not settle
  CH? Separate the two and say which one the analogy actually earns. Then: is there
  a better analogy for the situation (the axiom of choice, the law of excluded middle,
  something else), and what does the better analogy get right that the geometry one
  gets wrong?


