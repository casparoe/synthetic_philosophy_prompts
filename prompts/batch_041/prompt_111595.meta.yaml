  independence at the first-order level doesn''t imply indeterminacy, and both cases
  have a second-order formulation that is (quasi-)categorical. That''s a great "the
  disanalogy doesn''t matter; here''s the point that kills the conclusion in both
  cases" — even better for the audit.


