  "At a reading group last week, two friends of mine, neither of whom I agree with
  entirely, fell into a long argument about a taxonomy of minds that one of them had
  encountered and summarized for the group. The taxonomy distinguishes four grades.
  Darwinian creatures are those whose behavioral dispositions are fixed by natural
  selection: they are born with their strategies, and if the strategies are bad, they
  die. Skinnerian creatures can learn from reinforcement: they emit behavior, and
  what gets rewarded gets repeated. Popperian creatures can represent possible actions
  and outcomes internally and evaluate them before acting, so that, as the summary
  put it, their hypotheses can die in their stead. Gregorian creatures are Popperian
  creatures that have acquired tools of thought — words, symbols, norms, techniques
  — from their culture, and so can think thoughts that no individual could have assembled
  alone.


  The argument then proceeded in several rounds.


  (1) The first friend said the four grades mark real and increasingly powerful discontinuities.
  In particular, the Skinnerian/Popperian divide is not a difference of degree: a
  Skinnerian creature is a slave to its reinforcement history, whereas a Popperian
  creature can in principle decouple its behavior from its actual reward history by
  simulating outcomes. The Gregorian grade is a further discontinuity because it introduces
  a kind of inheritance — cultural inheritance — that is not in the genome and can
  accumulate far faster than genetic evolution.


  (2) The second friend replied that the discontinuities are oversold. He said the
  Skinnerian/Popperian distinction is essentially the distinction between model-free
  and model-based reinforcement learning, which is a difference in computational architecture
  but not a difference in kind; both are forms of trial-and-error learning, and the
  "offline" evaluation of a Popperian creature is just a rollout of an internal model
  that itself had to be learned by reinforcement. He added that Gregorian creatures
  are just creatures whose environments include other creatures and their artifacts,
  so their "mind-tools" are a special case of environmental scaffolding, not a new
  grade of mind.


  (3) The first friend responded that this reduction ignores the fact that the taxonomy
  is not a taxonomy of learning algorithms but of capacities for control. A creature
  can be Skinnerian with respect to one behavior and Popperian with respect to another;
  the taxonomy is about the highest grade of control an organism can bring to bear
  in a given domain, not about a global property. She said that if the second friend''s
  reading were correct, the taxonomy would be empty, because every organism is a mixture.


  (4) The second friend said that was his point: the taxonomy is a useful heuristic
  for sorting mechanisms, but it is not a taxonomy of kinds of minds, because there
  are no kinds — only graded mixtures. He also said the scheme smuggles in a normative
  hierarchy, with the Gregorian grade treated as the pinnacle, which he suspected
  was just a dressed-up claim that human cognition is special.


  (5) The first friend said that the normative charge cuts the other way: the taxonomy
  is descriptive, and the fact that it has a pinnacle is a finding, not a bias; if
  human cognition is special in a specific, specifiable way, that is not chauvinism
  but an empirical claim. She conceded that the boundaries are fuzzy but said fuzzy
  boundaries do not make a taxonomy useless.


  (6) The second friend said that even if the taxonomy is descriptive, the Gregorian
  grade is not a grade of mind at all, because it is not a property of an individual
  organism: the tools are shared, and the individual''s "Gregorian" cognition is distributed
  across a culture. So calling a single creature a Gregorian creature is a category
  mistake.


