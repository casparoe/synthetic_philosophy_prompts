  I''m a retired field geologist who''s gotten way too into philosophy in retirement,
  and I''ve been kicking around an idea I''d like you to stress-test. Act like an
  evolutionary biologist who also knows a lot of philosophy of science, and think
  carefully before you answer.


  Here''s the position: the handicap principle isn''t just a decent story about peacocks
  and stotting gazelles -- it''s the master key to honest signaling in general, including
  a lot of human life. Moral commitments, art, religion, even the whole business of
  doing philosophy are credible only because they''re expensive enough that free-riders
  and low-quality types can''t fake them. A signal is trustworthy to the extent that
  it''s a handicap.


  What I want is a map of what would count against this. Not just the standard "sometimes
  signals are cheap and still honest" complaint -- I want the real defeaters, ranked
  from fatal to merely awkward. In particular, I''ve been wondering about a few things:


  - I''ve heard that at equilibrium the marginal cost of signaling can end up the
  same for high and low quality types, so the signal stops being a handicap in the
  original sense. Does that gut the general story or just narrow it?

  - What about the distinction between indices (signals that are causally tied to
  quality and can''t be faked) and handicaps (signals that are costly to fake)? If
  a lot of "costly signaling" turns out to be indexing, is the handicap principle
  doing any independent work?

  - Cases where the receiver''s response pays the signaler back, so the cost isn''t
  really wasted -- does that count as a refutation, a qualification, or just a different
  accounting?

  - And how would we tell whether the human extensions are real explanations or just-so
