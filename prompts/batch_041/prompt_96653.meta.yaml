  prediction, says that unless I give him my wallet he will subject an enormous number
  of people to torture. Whether or not he has the power, he has the same incentive
  to say it, so the utterance itself carries no evidential weight; the whole case
  turns on the prior I am supposed to have on his power, which has no obvious reference
  class.


  2. The open-ended prize: a lottery with a one-in-a-billion chance of an outcome
  that is not merely large but unbounded — for every finite multiple of any ordinary
  good, the prize is better than that. Here expected utility is defined but swamps
  everything, and the ''fanaticism'' is not driven by an absurdly small probability.


  3. The never-ending prize: a lottery whose winning outcome is a sum of infinitely
  many positive stages. Here I take it that the standard expected-utility formula
  is simply not defined, since the formula is stated over real-valued utilities; I
  want that requirement stated explicitly as part of the specification, not treated
  as a technicality.


  4. The queue of claimants: infinitely many mutually exclusive strangers, each offering
  an unbounded or infinite payoff, so that there is no best option to pick and no
  way to satisfy them all.


