  - Popper''s argument: Darwinism (the theory of natural selection) is not a testable
  scientific theory but a metaphysical research programme — a possible framework for
  testable scientific theories. He said natural selection is "almost tautological":
  "the survival of the fittest" — those that survive are those that are fit; if the
  fittest are defined as those that survive, the statement becomes near-tautological.
  He thought the theory of natural selection explains a lot but its explanatory power
  is limited; also that it isn''t really a law of nature but a situational, historical
  account. He argued that Darwinism''s strongest point is its explanatory power and
  its weakness is its near-tautological character and its lack of testability as a
  universal law. He compared it to a metaphysical research programme, like materialism
  or mechanism.


  - Popper also emphasized that the struggle for existence is not a law but a schema;
  and that "natural selection" is not a force but a consequence. He distinguished
  the theory of evolution (common descent, which is testable and well-corroborated)
  from the theory of natural selection (the mechanism). Key: he thought the historical
  theory of descent with modification is testable and largely confirmed; the mechanism
  of natural selection is a research programme. Also he argued against the "tautology"
  charge being fatal — he says the theory of natural selection is not strictly a tautology
  but near-tautological, and that in its more ambitious form it can be tested if it
  makes predictions, e.g., about adaptation, and that it can be criticized.


  - In "Natural Selection and the Emergence of Mind" (Dialectica 1978), Popper says
  he changed his mind: "I have changed my mind about the testability and the logical
  status of the theory of natural selection; and I am glad to have an opportunity
  to make a recantation." He says the theory of natural selection may be interpreted
  as a somewhat weakened form of logical tautology, but that it can be reformulated
  as a testable theory. He suggested that natural selection is testable via, e.g.,
  the fact that organisms'' behaviour can be predicted: if selection works, then organisms
  should be adapted; he emphasized the "active" role of the organism in selecting
  its environment (a theme from his "Of Clouds and Clocks" and his earlier work),
  the "spearhead" idea — the organism is an active problem-solver. Also, in that paper
  he discusses that Darwinism can explain mind emergence; the mind is a product of
  natural selection, though mind is not reducible.


  - Also relevant: Popper''s criticism that natural selection explains "too much"
