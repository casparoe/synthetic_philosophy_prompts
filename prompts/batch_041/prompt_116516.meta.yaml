  ---


  I am a backend engineer with no formal training in philosophy — my exposure is a
  few popular science books and long arguments with friends — and I keep running into
  a puzzle at work that I suspect has an established name, though every search I try
  lands me in either the free will debate or the mind-body debate, neither of which
  is quite the thing. Here is the pattern. When we debug an incident, we explain it
  at the level of the program: a cache held a stale entry, so the request handler
  priced the order off last week''s data, so the invoice went out wrong. That is the
  explanation we act on; we change the invalidation logic and the bad invoices stop.
  But the same episode also has a story told in electrons, and that story is, as far
  as I can tell, complete: given the initial conditions and the laws, the electrons
  were going to do what they did regardless of whether anything was, in the program''s
  vocabulary, stale. So the program story appears to add no causal difference. My
  colleagues split into two camps. Some say the program story is the real cause and
  the electron story is just bookkeeping; others say the electron story is the real
  cause and the program story is a useful fiction we tell to keep our jobs. I do not
  see why I have to pick, and I suspect the dilemma is an artifact of something.


  The wrinkle that stops me from settling for a stock answer is this. The two stories
  do not always agree about what caused what — they are not simply a coarse and a
  fine picture of the same thing. In a race condition, the program-level explanation
  is that two handlers wrote to the same record and the second overwrote the first,
  and that is the explanation that fixes the bug; the physical-level explanation would
  cite a particular interleaving of clock edges, and neither story is a redescription
  of the other, because the program-level story is compatible with a huge range of
  physical stories and, worse, the same physical system will run any of infinitely
  many different programs depending on what you write on the disk. I also notice that
  we never intervene at the physical level: we set a breakpoint, we flip a flag, we
  deploy a patch, and the effect propagates reliably. The level we can push around
  is the symbolic one, and it pushes back reliably, which is a strange thing to say
  about a fiction.


  So what I want is not a label but a carving, and I would rather you reason carefully
  and show your work than reach for the first impressive term. Please start by brainstorming
  a list of candidate concepts — anything from the metaphysics of causation, the philosophy
  of mind, the philosophy of the special sciences, or the philosophy of explanation
  — and then do two things. First, tell me which established concept is nearest to
  what I am describing, and be specific about where it comes apart from my case: my
  pattern is not exactly the worry that the higher level is a mere epiphenomenon,
  because the two levels sometimes disagree about causes rather than merely coarsening
  one another; and it is not exactly the ordinary distinction between a cause and
  a background condition, because that distinction is about picking one factor out
  of a single story rather than about two stories that give different verdicts. Second,
  if nothing fits, coin a term, define it precisely, and mark its edges: say what
  would have to be true for the pattern to vanish (for instance, does it depend on
  the higher level being realizable in many different lower-level arrangements, or
  on the levels being related by design rather than by emergence?), tell me which
  of the standard positions in this area are live options, and give me one or two
  boundary cases where it is genuinely unclear whether my pattern is present. I would
  also like to know whether this is one puzzle or two — whether the stale-cache case
  and the race-condition case are the same phenomenon under different clothing.


