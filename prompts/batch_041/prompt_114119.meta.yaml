  Draft prompt:


  "I am putting together a joint statement for an adversarial collaboration between
  two camps in the philosophy of predictive processing. The first camp, call them
  the free-energy realists, holds that the free energy principle (FEP) is a substantive,
  unifying law of self-organising systems: any system that maintains its integrity
  against dispersion must, under a suitable description, minimise variational free
  energy, and this fact explains why brains approximate Bayesian inference. The second
  camp, the free-energy deflationists, holds that the FEP is either a mathematical
  truism dressed in thermodynamic language or an unfalsifiable modelling framework,
  and that its apparent explanatory power comes from the fact that almost any persistent
  system can be described as if it minimised a free-energy functional. They agree
  that active inference is a useful engineering paradigm, but disagree about whether
  the FEP earns the title of a theory of the brain. I want a document that both could
  sign.


  Please draft it. It should begin with a numbered list of claims both sides accept
  -- about the formalism (variational free energy, expected free energy, Markov blankets),
  about what the principle does and does not entail, about the status of the dark-room
  problem, and about the relation between the FEP and Bayesian brain hypotheses. Then
  a disagreements table with two columns, one for each camp, where each row is a precise
  formulation of a disagreement in wording that the camp in question would accept
  as fair to its own view. I am especially interested in three cruxes. First, whether
  the FEP is a constitutive principle (any persisting system must be describable as
  minimising free energy) or a regulative one (it is a normative constraint on modelling,
  not a description of mechanism). Second, whether the Markov blanket apparatus is
  doing explanatory work or merely redescribing the boundaries of a system. Third,
  whether the FEP makes any prediction that a well-confirmed alternative -- say, a
  predictive-coding model with a fixed generative model and no explicit free-energy
  objective -- does not also make. For each crux, identify a concrete test, thought
  experiment, or empirical case that both sides agree would bear on it, and record
  in advance what each side predicts. Finally, say whether any part of the dispute
  is merely verbal, and if so, propose a stipulation that would dissolve it without
  begging the question. Please do not give me a reading list or citations; I want
  the argument and the formulations."


