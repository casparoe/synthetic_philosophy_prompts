  Para 1: Context — I''m a professor of philosophy (social ontology / political philosophy)
  who was trained partly in economics; I teach a course on collective intentionality
  / a graduate seminar on nations and nationalism; I''ve been reading Hobsbawm and
  Anderson (and I have some sympathy with the "modernist" claim) but I want to see
  how far it can be expressed in the vocabulary I trust most: the theory of games
  of coordination. Set out the target vocabulary: finite games, payoff structures,
  equilibria, correlated equilibrium, focal points, common knowledge vs. high-order
  mutual knowledge, self-enforcing agreements, equilibrium selection, cheap talk,
  punishment in repeated games, and the notion of a public event/announcement. State
  the position to be restated: nations are not ancient but modern artifacts; national
  traditions are invented; national belonging is "imagined" — i.e., a large-scale
  identification sustained by print media etc.


  Para 2: The task — restate that position in the game-theoretic vocabulary as faithfully
  as possible, mapping each component: what plays the role of the payoff structure;
  what plays the role of common knowledge; whether "print capitalism" is best modeled
  as a technology for generating common knowledge (as Chwe does for ritual), whether
  the "invention of tradition" is an act of equilibrium selection by an elite who
  shift payoffs, etc. Be honest: don''t smuggle in game-theoretic assumptions (e.g.,
  don''t assume the relevant payoffs are material or that the actors are rational
  in the Bayesian sense) and call it translation.


  Para 3: The residue report — what doesn''t survive. Specific questions I want addressed:
  (a) does anything correspond to the temporal claim (that the community is imagined
  as moving through homogeneous empty time / that the tradition is experienced as
  ancient)? (b) what happens to the *critical* force of "invented" — in equilibrium
  terms an invented tradition is just as real and functional as a genuine one, so
  does the accusation lose its bite, and is that a defect of the framework or evidence
  that the accusation was doing rhetorical rather than explanatory work? (c) can the
  framework represent the willingness to die for the nation, which coordination gains
  don''t obviously explain? (d) Hobsbawm''s class-analytic claim. (e) the discontinuity
  result about common knowledge (email game) — does it make the modernist story fragile
  in a way its proponents don''t acknowledge? And finally, whether the residue indicates
  the game-theoretic vocabulary is missing something (like normativity, or collective
  intentionality in Searle''s sense) or that the modernist thesis is less determinate
  than it sounds.


