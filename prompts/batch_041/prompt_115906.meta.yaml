  calls greedy reductionism (the bad kind of reduction that wants to skip all the
  intermediate levels and go straight from atoms to thoughts or from genes to Shakespeare),
  and it struck me that Nolan''s film is secretly organised around exactly that contrast,
  only it keeps flipping which side is which. Borden''s trick is a crane in the purest
  sense -- it''s just a man with a double, a whole life arranged as a mechanism, no
  miracle anywhere, and the cost is that he has to be two people forever, share his
  marriage, cut off fingers... Angier is the one who goes out and buys a skyhook:
  he literally commissions a machine that does the lifting for him, something that
  works and is never explained, and the horrible part is that the skyhook is more
  expensive in blood than the crane ever was -- he has to kill himself in a tank every
  night, and the first thing he does when the thing works is shoot the copy. And Cutter''s
  bird-cage trick at the start, the crushed bird and the boy who cries and is told
  the bird is fine, seems to me to be the film''s thesis about why skyhooks are so
  tempting: the crane is right there in front of the audience and the audience doesn''t
