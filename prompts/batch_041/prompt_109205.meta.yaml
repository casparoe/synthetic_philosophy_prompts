  "The hinge hypothesis: we live at the most influential time in history, the point
  where the future''s value is most contingent on what a small number of people do
  now. My line is that the debate between Bostrom and MacAskill has been about whether
  the hinge exists, when it should be about what kind of object a hinge is.


  Bostrom''s case, as I read it: the expected value of the future is enormous (astronomical
  waste), we''re in a ''time of perils'' where our power has outrun our wisdom, and
  a discovery drawn from an urn containing black balls — a technology that inevitably
  destroys civilization unless there''s a global singleton — would end the story.
  So the marginal value of action is huge right now.


  MacAskill''s reply, as I read it: influence scales with how much of the long-run
  future is contingent on your action, and there''s no particular reason to think
  the contingency curve peaks at our particular century; plus, if we were at the hinge,
  that would imply the expected value of the future is unusually uncertain, i.e.,
  unusually likely to be extinguished soon — so the hinge hypothesis, if true, is
  bad news in a way that makes longtermist cheerleading weird.


  Where I want to push: the whole dispute assumes a hinge is a peak on a curve of
  leverage. I think there are two different things being run together:


  1. Narrow hinge: a moment where the counterfactual spread of the far future is maximal
  — one decision flips the whole thing.

  2. Wide hinge: a period where the value at stake is maximal, even if no single action
  flips it — e.g., a century in which a slow drift of institutions sets the trajectory.


  A narrow hinge is only plausible if there''s a real cliff; a wide hinge is almost
  trivially true for us (we''re the first century with the tech) and therefore uninteresting
  for prioritization. Most defenses of the hinge slide from the wide claim, which
  is cheap, to the narrow claim, which is expensive.


  The test I want to use: ask what the people living through the most influential
  century would have thought at the time. 1945 felt like a hinge; 1962 felt like one;
  every generation that has just invented a weapon feels like one. If hinges are cheap
  to declare ex ante, we need a criterion that doesn''t just say ''the present is
  special''. My candidate criterion: a hinge exists where the future''s value is a
  step function of something we control and can''t control later. Under that, the
  interesting question is whether the step is in front of us or behind us — and I
  think we can''t tell from inside, which is itself an argument for acting as if it''s
  in front of us."


