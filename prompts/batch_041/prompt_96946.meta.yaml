  \ design a case where Mary gains no propositional knowledge yet gains an ability,\
  \ and a case where she gains propositional knowledge but the physicalist can accommodate.\
  \ Might be good but maybe more prone to regurgitation.\n\n- Solomonoff induction\
  \ / Kolmogorov complexity / Occam's razor: construct a case where two simplicity\
  \ measures come apart — e.g., a case where the shortest program description favors\
