  So the summary''s subtle errors:

  (a) Conflating PII with Leibniz''s Law (the indiscernibility of identicals) — the
  two are converses; only the latter is a logical truth.

  (b) Claiming Black''s scenario refutes Leibniz''s principle tout court, when (i)
  Black''s target is a specific reading of PII, (ii) on the trivial/impure-property
  reading PII is trivially true (so the argument needs the qualitative reading), and
  (iii) many philosophers accept the case as showing PII is not a necessary truth
  while others (relationalists with different ontologies, primitivists) dispute it.

  (c) The "no fact of the matter / it''s just how we describe it" misreading — Black''s
  distinctness is a fact; only the labels are arbitrary.

  (d) The absolute/relational space confusion: the summary says the problem disappears
  for a relationalist, when actually it''s the absolutist who has the easy way out
  (different absolute positions) and the relationalist who has to face the symmetric
  case; and the Leibnizian is a relationalist, so the "one is here, the other there"
  reply isn''t available to him.

  (e) The PSR conclusion: "this is why PSR has to go" — the relationship between PII
  and PSR is a further issue; Leibniz derives PII from PSR, so a two-sphere world
  would be a counterexample to PSR too, but that''s not an *additional* refutation
  so much as the same argument applied to the source principle; and Black''s own discussion
  (appealing to conceivability/possibility) is contested.


