  Exam question (invented by me, casual instructor voice):


  "Question 3 (short essay). We set up three tests in class for counterfactual historical
  claims: (i) the but-for test — would the outcome have occurred without the person?;
  (ii) the substitute test — was there a readily available alternative actor who could
  have played the same role, or was the role itself created by the person?; (iii)
  the load-bearing test — how much of the causal work is done by conditions that were
  already in place independent of the person? Using these three, assess: ''Without
  Hitler, there would have been no Nazi Germany.''"


  Student answer: mixed. Right: identifies structural conditions (Versailles resentment,
  depression, weak Weimar institutions, elite miscalculation), notes that a substitute
  authoritarian nationalist leader might have emerged but probably not with the same
  specific program (racial extermination as a central, pursued aim), so some counterfactuals
  are more robust than others; notes that the substitute test doesn''t automatically
  defeat the but-for claim because the substitute might have produced a different
  regime (so the outcome described must be specified precisely) — that''s a sophisticated
  correct point.


  Subtle errors:

  1. Conflates the but-for test with the load-bearing test: uses the presence of structural
  conditions to conclude the but-for test "fails", whereas the but-for test concerns
  the person''s causal contribution, and structural conditions being present doesn''t
  show that the outcome would have occurred without him. That''s a genuine conflation.

