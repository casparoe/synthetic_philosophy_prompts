  \ Budget: Why the Lottery and the Preface Are Not One Problem**\n\nIt is usual to\
  \ treat the lottery paradox and the preface paradox as two instances of a single\
  \ difficulty. I want to argue that they are two different difficulties, and that\
  \ the difference is arithmetic. If that is right, the standard menu of responses\
