  \ A fair lottery has n tickets, exactly one of which wins. For each ticket i, the\
  \ agent's credence that ticket i loses is (n − 1)/n. Suppose her threshold for belief\
  \ is at or below that. She therefore believes, of each ticket, that it loses. She\
  \ also believes that some ticket wins, since that is part of the setup and her credence\
  \ in it is 1. Her beliefs are jointly inconsistent, and yet each is backed by the\
  \ same evidence and each is supported to degree (n − 1)/n.\n\n*Preface.* An author\
  \ has written a book of m claims. Each claim was carefully checked, and she gives\
  \ each a credence of p = 1 − ε. She also knows her own track record: over a long\
  \ career, books of this kind always contain at least one error. So her credence\
  \ that at least one of the m claims is false is 1 − p^m, and if that exceeds her\
  \ threshold, she believes it. Her beliefs are again jointly inconsistent.\n\n**2.\
  \ The apparatus.**\n\nCall the *allotment* of a belief B the agent's own estimate\
  \ of the chance that it is false, 1 − Cr(B). Call the *exposure* of a set S of beliefs\
  \ the sum of the allotments of its members, A(S) = Σ_{B∈S} (1 − Cr(B)). By linearity\
  \ of expectation, the exposure of S is exactly the expected number of false beliefs\
  \ in S.\n\nI propose, tentatively:\n\n*Ledger Norm.* An agent may hold a set of\
  \ beliefs simultaneously only if its exposure does not exceed 1.\n\nThe thought\
  \ behind the norm is that an agent is entitled to one mistake at a time: the expected\
  \ number of false beliefs she is carrying at any moment must not exceed one. I flag\
  \ at once that this is the least secure part of what follows, and I return to it\
  \ in §4.\n\n**3. The arithmetic.**\n\n*Lottery.* Exposure = n × (1/n) + 0 = 1. Exactly\
  \ at budget, for every n. The risk is *normalized*: the n allotments partition the\
  \ possible outcomes, and they sum to one however many tickets there are.\n\n*Preface.*\
