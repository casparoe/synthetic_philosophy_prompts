  Moral equality of combatants (MEC): the thesis that combatants on both sides of
  a war have the same moral status with respect to the killing they do — specifically,
  they are each permitted (or at least not culpable) to kill enemy combatants, regardless
  of whether their side''s cause is just. Associated with Walzer''s *Just and Unjust
  Wars* (1977), and with the "independence thesis": jus ad bellum (justice of resorting
  to war) and jus in bello (justice in the conduct of war) are logically independent
  — a war can be unjust yet fought justly. Walzer''s "war convention" and the "moral
  equality of soldiers."


  Revisionist just war theory (McMahan, *Killing in War*, 2009) denies MEC: if you''re
  fighting for an unjust cause, you''re doing something morally wrong in killing,
  and the other side is acting in justified self-defense. McMahan grounds this in
  individual self-defense ethics. He distinguishes liability to be killed from culpability;
  unjust combatants may be excused/less culpable but still act wrongly.


