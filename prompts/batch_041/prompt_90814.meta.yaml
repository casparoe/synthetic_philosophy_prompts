  "Analyze the controversy over pediatric cochlear implantation—specifically the 1990s–2000s
  debates in the United States and Europe over whether deaf children should receive
  implants, and the opposition from parts of the Deaf community—through the three
  leading answers to the question ''equality of what?'': welfarist equality, resource-based
  equality, and the capabilities approach. Begin by stating what each account takes
  the relevant currency of equality to be. Then work through the case in both directions.
  For each account, say what it would identify as the relevant inequality (if any)
  in a deaf child''s situation, what it would recommend regarding implantation, and
  how it would interpret the Deaf community''s claim that deafness is a cultural difference
  rather than a deficit. Be precise about where the accounts diverge: for example,
  on whether the relevant comparison is subjective welfare, a bundle of resources,
  or a set of functionings; on how to treat adaptive preferences; and on whether the
  social environment or the impairment itself is the proper site of disadvantage.
  Finally, say what the case reveals about the limits of each account—whether it confirms
  the account, produces an anomaly for it, or exposes a question the account was not
  designed to answer. Do not treat the case as a simple illustration; the analysis
  should show where the theories strain and what the strain tells us."


