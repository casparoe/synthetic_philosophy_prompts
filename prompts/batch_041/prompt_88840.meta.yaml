  Prompt text:


  "I''m a journalist who writes about science and ideas, and I''m embedded for a few
  weeks in a seminar on democratic innovation while I report a feature on sortition.
  The professor asked me to give a blind first read on a sample exam answer from a
  student, since she wants an outside perspective before she grades. I don''t know
  the student and I don''t want to just wave it through or nitpick it to death, so
  I''m asking you to grade it instead.


  The exam question was: ''The Civic Lottery Bill proposes a 300-member Citizens''
  Assembly chosen by lot from a 5,000-person pool drawn from the electoral register.
  The pool is stratified by age, gender, and region; those selected from the pool
  must serve a one-year term, are paid, and can hear expert witnesses but cannot delegate
  their votes. Drawing on the arguments for sortition/lottocracy, explain what normative
  problem this design is supposed to solve and assess whether it actually avoids elite
  capture. In your answer, be clear about what sortition is and is not.''


  Student''s answer:


  ''Sortition is selection by lot rather than election, and it was central to Athenian
  democracy, where most political offices were filled by random draw. The Civic Lottery
  Bill is trying to solve the problem of unequal voice: elections tend to favor wealthy,
  educated, and well-connected candidates, and even when they don''t, campaigns are
  dominated by donors and media. A random sample of the population is descriptively
  representative: it looks like the population in terms of age, gender, and region,
  so the assembly can speak for the people in a way that a parliament of lawyers and
  party hacks cannot. Paying members and making service mandatory also reduce the
  class bias that would come from a volunteer assembly, because low-income people
  can afford to take the year off and nobody can buy their way out. The two-stage
  lottery is also important: drawing 5,000 first and then 300 gives more people a
  chance to be chosen and makes it harder for a faction to rig the final result.


  The deeper justification for sortition is epistemic. According to the Condorcet
  Jury Theorem, if each person is more likely than not to get the right answer, then
  the probability that a majority gets the right answer increases toward certainty
  as the group gets larger. That is why a randomly selected assembly of 300 will make
  better decisions than an elected legislature: it is a statistically representative
  sample of the whole population''s judgment, and the law of large numbers does the
  rest. Expert witnesses help with information, but the point is that ordinary people,
  when they deliberate, can pool their perspectives and correct each other''s biases.


  Does it avoid elite capture? Mostly yes. Because there are no elections, there are
  no campaign donors, no parties, and no professional politicians, so the main channels
  of elite influence are closed. The experts who testify are only witnesses, so they
  cannot set the agenda or vote. The one remaining worry is that the people who run
  the lottery could try to bias the pool, but if the draw is public and stratified,
  that seems like a minor technical problem. So I would say the bill largely succeeds
  in creating a lottocratic body that is both representative and resistant to elite
  capture.''


  I''m not sure what grade this deserves. It reads smoothly and uses the right vocabulary,
  but I have a nagging sense that some of the steps are doing more work than they
  should. Can you grade it out of 20 and give me the specific comments I''d need to
  justify the grade -- what''s solid, what''s wrong or overstated, and what a careful
  grader should flag? Please don''t just say ''good but could be deeper''; I need
  point-by-point feedback I can pass along."


