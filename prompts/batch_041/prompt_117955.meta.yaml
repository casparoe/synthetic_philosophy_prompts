  than ten of those minutes.


  What I want to do is make them feel the force of Bertrand''s chord problem, and
  I would rather they feel it than hear about it. My own understanding of the setup
  is this: a chord of a circle is drawn at random, and we ask for the probability
  that it is longer than the side of the inscribed equilateral triangle. Under one
  natural reading — choose two points independently on the circumference — the answer
  is one third. Under another — choose a radius, then a point on it, and draw the
  perpendicular chord — it is one half. Under a third — choose a point uniformly in
  the disc and take it as the midpoint — it is one quarter. Three descriptions of
  one and the same event, three incompatible answers, and no obvious way to say which
  description is the right one. (Correct me if I have mangled any of those.)


  I have two things I want them to take away, and the second matters more to me than
  the first.


  First, that the difficulty is not an arithmetic slip and not a matter of insufficient
  care, but that the principle of indifference — treat possibilities as equiprobable
  when you have no reason to prefer one — simply does not determine an answer until
  something else is supplied. I want them to feel the specific discomfort of finding
  each of the three arguments compelling in turn, and then noticing that at most one
  of them can be right.


  Second, and this is where I would like the activity to end up: that what is missing
  is a symmetry, and that a symmetry has to be given by the physical situation rather
  than chosen by us. I want them to arrive at the contrast themselves — why the throw
  of a needle onto ruled paper is a perfectly well-posed random experiment (Buffon)
  even though it also seems to require a judgement of indifference, and why the microcanonical
  postulate of statistical mechanics is not embarrassed by Bertrand, even though it
  too says: assume all accessible states equally likely. My own answer, which I would
  like them to reach or to argue with, is that in both of those cases the dynamics
  supplies the measure — the uniform distribution is preserved by the flow, and the
  physical act of throwing specifies the mechanism — whereas in Bertrand nothing does,
  so the question is underdetermined until we say which transformations the answer
  should be invariant under. I have a vague sense that the tradition running from
  Jeffreys through Jaynes is the attempt to do exactly this, though I have not read
  either closely enough to teach it, and I would rather the activity not pretend to
  settle the matter.


