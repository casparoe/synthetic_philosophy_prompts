  Desiderata for a theory of escalation:

  1. It must account for escalation without prior commitment (dollar auction: the
  "irrationality" of bidding $1.05 for $1 — no sunk cost bias needed, just incentive
  structure) — so any theory that reduces escalation to sunk-cost bias fails.

  2. It must distinguish the sunk-cost fallacy (irrelevant prior expenditure) from
  the case where prior expenditure is genuinely relevant (asset specificity, entry
  deterrence, war of attrition).

  3. It must explain why escalation persists even when the decision maker is a fresh
  successor with no ego invested (or explain why it doesn''t — the empirical puzzle).

  4. It must respect the distinction between a decision that''s irrational ex ante
  vs one that''s irrational only conditional on entry (dollar auction: don''t enter;
  but conditional on being in, continuing may be defensible).

  5. It must say what makes escalation stop (the "exit" conditions: budgets, board
  oversight, external shocks, the "deadline").

  6. It must be consistent with what we know about learning and markets — e.g., why
  firms survive if they systematically escalate (selection: the ones that quit when
  quitting is right survive — but then why does the pattern persist? Need a mechanism
  like agency problems / noisy feedback).

  7. It must distinguish between escalation of commitment (persisting with a course
  of action) and escalation of *conflict* / escalation of *investment* (bid amounts),
  and handle the case where each round is individually rational and the sequence is
  collectively disastrous (a "fallacy of composition" / dynamic inconsistency — the
  "money pump" / "trap" structure).

  8. It must handle the normative question: when is escalation warranted? (deterrence,
  reputation, sunk cost as evidence).

  9. Distinguish "sunk cost effect" from "loss aversion" from "self-justification"
  — the theory must say which is doing the work, or whether they''re the same.

  10. It must be consistent with the existence of well-functioning institutions that
  deliberately escalate (military, VC, R&D).


  Joint unsatisfiability: A theory that says escalation is a bias can''t handle the
