  can''t handle the plain sunk-cost cases (the movie ticket) where the past outlay
  is causally irrelevant; and if you add "must predict escalation stops when feedback
  is noisy" you may conflict with "must explain the Concorde" etc. That''s a nice
  tension to flag.


