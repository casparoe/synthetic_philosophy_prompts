  into a productive question if we separate two senses of will in his system: will
  as the unknowable thing-in-itself and will as the phenomenal pattern of striving,
  satisfaction, and renewed striving that characterizes motivated life. On that reading,
  music might not disclose the metaphysical will as it is in itself; it might instead
  model the form of willing without presenting any determinate object of desire. The
  question I want the proposal to sharpen: Is Schopenhauer''s claim about music best
