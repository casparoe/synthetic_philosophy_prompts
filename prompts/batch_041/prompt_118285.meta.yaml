  (2) So for any observed association between A and B, there''s in principle some
  further variable C such that conditioning on C reverses the association. (Or: the
  "direction" of an association depends entirely on which variables you condition
  on.)

  (3) So there''s no fact of the matter about whether A and B are positively or negatively
  associated.

  (4) So no observational data can tell you the sign of any dependence.

  (5) So a study that reports an association, without more, conveys no information
  about the world — e.g., the claim "smoking is associated with lung cancer" is not
  even a candidate for truth.

  (6) But that can''t be right: some associations are robust and informative. So something
  is wrong.


  Where does it go wrong? The flaw: (2) is false as stated — you can''t always reverse
  an association by conditioning on a further variable; Simpson reversals require
  specific structure (a confounder, and in the non-causal reading, the reversal is
  possible only when the pooled association is driven by a confounder; also, reversal
  is only possible for certain effect sizes / requires the confounder to relate to
  both variables). Also, conditioning on a collider can create or reverse associations
  (Berkson''s paradox, selection). And the move from "the sign depends on the conditioning
  set" to "there''s no fact of the matter" equivocates between the associational claim
  (which is indeed relative to a conditioning set) and the causal claim (which is
  not). Pearl''s point: the "fact of the matter" is the causal effect, and Simpson''s
  paradox is only a paradox if you conflate association with causation. Also the reversal
  by conditioning on a collider is not a "reversal of the same fact" but a change
  in the question.


  Also there''s a subtle point: the paradox requires the third variable to be a confounder
  of a specific kind; and if you condition on a variable that is a cause of the exposure,
  you can induce a spurious reversal (M-bias). So the argument''s step (2) as stated
  ("for any observed association there''s in principle some C") is too strong: for
  instance, if A is binary and B is binary and there''s no third variable, ... hmm
  actually you can always find a variable by which to reverse — e.g., consider the
  variable "which subgroup you''re in," which is always available: if A and B are
  associated in the pooled data, you can partition the population into {people with
  A=1 and B=1 or A=0 and B=0} vs {the rest} and get a reversal? That''s conditioning
  on a function of A and B, which is not a legitimate conditioning variable (it''s
  a collider/descendant). So the "in principle" step is trivially satisfiable but
  only by cheating — using variables that are descendants of the outcome or of the
  exposure. So the flaw is: the argument''s step (2) trades on an unrestricted quantifier
  over conditioning variables, which makes it trivial and empty (you can reverse with
  a variable defined in terms of the variables themselves), and once you restrict
  to legitimate pre-treatment covariates, the reversal isn''t always available. That''s
  a nice subtle flaw — quantifier shift / equivocation.


  Also there''s a good point about the difference between "no fact of the matter about
  association" (which might be granted as a point about how "association" is defined)
  and "no observational study can support any conclusion" — the latter is a scope
