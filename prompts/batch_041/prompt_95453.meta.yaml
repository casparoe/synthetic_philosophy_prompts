  "I am a third-year PhD student in political theory, and next month I have to lead
  a session of an interdisciplinary reading group — graduate students in history,
  literature, and political theory, several of whom have read The Prince once in an
  undergraduate survey and none of whom have opened the Discourses — on Machiavelli''s
  handling of fortune and virtù. I do not want an essay on the topic; I have read
  the scholarship and I have my own view. What I want is a plan for the ninety minutes:
  the order in which the ideas have to be introduced so that each one is available
  before it is needed, the single case that should carry the whole arc, and the misconceptions
  I should expect this particular group to arrive with or to form mid-session, with
  a note on exactly where in the sequence I should head each one off.


  The difficulty I keep running into, and the reason I''m asking rather than improvising,
  is that the obvious sequence — define virtù, define fortune, then discuss chapter
  25 — leaves the group with a tidy picture that the text itself undermines. Chapter
  25 first says that fortune is the arbiter of about half our actions and leaves the
  rest, or nearly, to us; it then says that a prince who proceeds impetuously will
  fare better than one who proceeds cautiously, and that fortune is a woman; and it
  explains the difference between successful and unsuccessful men by whether their
  modo di procedere happens to suit i tempi. If a man''s mode of proceeding is fixed
  by his nature, and whether it suits the times is not up to him, then the half that
  was supposed to be ours is being quietly handed back to fortune, and virtù begins
  to look like a disposition that is itself lucky. I want the session to end with
  that difficulty visible rather than resolved, and I have been wondering whether
  the way out — or the displacement of the question — lies in the Discourses, where
  the renewal of a republic is said to depend on its being brought back to its beginnings,
  so that the burden of virtù shifts from the individual''s unchangeable character
  to institutions that can be reset. I''m not sure that''s the right bridge and I''d
  like your judgment on it.


  I''m inclined to build the session around Cesare Borgia, since he is the case Machiavelli
  himself spends the most pages on and he seems designed to display virtù and fortune
  at once; but he also fails, spectacularly, and I worry that a group that doesn''t
  yet have the concept will read his fall as a refutation rather than as the point,
  and that his familiarity means they will arrive with opinions rather than observations.
  Tell me whether he should carry the session or whether something else should, and
  if something else, what property the substitute must have and what Borgia lacks.
  Then give me the one question I can put to the group at the end that would tell
  me whether the distinction has actually landed rather than whether they can recite
  the chapter, and tell me what I should explicitly refuse to settle in ninety minutes,
  with the reason stated aloud to the group. Throughout, mark which of your claims
  are contestable interpretive positions rather than settled exegesis, and say plainly
  which single element of the plan you are least confident about."


