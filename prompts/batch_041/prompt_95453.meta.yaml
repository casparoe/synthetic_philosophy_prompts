  the share of an outcome not attributable to the agent''s dispositions — floods,
  the deaths of popes, the arrival of the French. Second, fortune as fit: not a quantity
  of chance at all but a relation between the agent''s fixed mode of proceeding and
  the temper of the times, so that the same caution that made a man''s career ruins
  it a decade later. Third, and this is the one I care about, fortune as the unavailability
