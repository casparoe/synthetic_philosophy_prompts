  Potential prompt:


  I am a high school student and a member of my school''s machine learning club, and
  I would like help adjudicating an argument that two other members had after our
  last meeting. I did not take a side, and I am not asking for advice about what to
  do; I am asking for a point-by-point assessment of the arguments as they were actually
  made.


  Background: We trained a small feedforward network on a synthetic task. Each input
  had a shape and a color. The network was trained to classify shape. In the training
  set, color and shape were correlated; in the test set, color was randomized independently
  of shape. The network''s test accuracy on shape was high. Then Mira trained a linear
  probe on the activations of the fourth hidden layer to predict color. The probe
  decoded color well above chance, even on test inputs where color was randomized.
  Jonah then trained a probe on the same activations to predict a randomly shuffled
  version of the color labels; that probe also decoded the original color labels above
  chance, though less well. What followed was roughly this exchange.


  Mira: The probe shows that the network has a representation of color. If color were
  not represented, you could not recover it from the activations.


  Jonah: The probe shows that the activations carry information about color. Information
  is not representation. A representation has to be used by the system for something.
  Otherwise every trace of a correlation is a representation, and the word loses its
  point.


  Mira: That cannot be right, because we attribute representations to human brains
  on the basis of exactly this kind of decoding. We do not first know how the brain
  uses the information. So if decodability is enough for brains, it should be enough
  for networks.


  Jonah: We have independent reasons to think brains are representational—evolution,
  behavior, reports, and so on. For a network, the only thing we know is the input-output
  function and the weights. Decodability is a fact about the weights, not about what
  the network is doing.


  Mira: But the network is doing something with color, or at least it has learned
  a feature that tracks color. If the feature is systematically recoverable, it is
  part of the network''s internal model of the world. The fact that it is not needed
  for the shape task does not make it less of a representation; it just makes it a
  representation the network is not currently using.


  Jonah: Then your view is that a representation is any decodable feature, whether
  or not it plays a role. That makes representation too cheap. My shuffled-label probe
  decoded the real labels, which means the probe can exploit structure in the activations
  that has nothing to do with color. So decodability alone cannot establish representation.


  Mira: The shuffled-label probe is a control, not a counterexample. It shows the
  probe can overfit, but the color probe was trained and tested properly, and it generalizes.
  If a feature generalizes to new inputs, it is real. You are just setting the bar
  for representation so high that no artificial system could ever meet it.


  Jonah: No, I am setting a functional bar. A representation is something the system
  uses to guide its behavior. If you lesion the feature and behavior changes, that
  is evidence of representation. If you can decode it but lesioning it changes nothing,
  it is a byproduct. That is not an impossibly high bar; it is the ordinary bar in
  cognitive science.


  Mira: But behavior is not the only thing we care about. Interpretability is supposed
  to tell us what is inside the network, not just what it does. If we only count features
  that make a behavioral difference, we will miss most of the internal structure.
  And your lesion test is confounded: the network may have redundant representations,
  so removing one changes nothing even though it is a representation.


  Jonah: Redundancy is a fair point, but it cuts both ways. If a feature is redundant,
  we need a theory of when it counts as a representation rather than a spare copy.
  You are the one who wants a simple decodability criterion; I am saying the criterion
  has to include causal role or function.


  Mira: Then what is the function of the color feature? The network was trained only
  on shape. If function is set by the training objective, color has no function. But
  the network still represents color. That shows function is the wrong criterion.


  Jonah: Or it shows that the network does not represent color, and what you are calling
  a representation is just information. I am happy with that conclusion.


  Mira: And I am happy with the conclusion that it represents color, because the information
  is there in a usable form. At this point we are just using different definitions
  of representation.


  Jonah: Not just definitions. If we adopt your definition, we will say the network
  represents color, shape, texture, and whatever else a probe can recover. That is
  not a useful scientific claim. If we adopt mine, we can say the network represents
  shape and merely carries information about color. That is a useful distinction.


  Mira: Useful for what? For predicting behavior, maybe. But for understanding the
  network, your distinction may be too coarse. The color feature might be part of
  a richer internal model that could be used if the task changed. Calling it mere
  information hides that.


