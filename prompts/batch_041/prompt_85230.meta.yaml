  lab''s stated goal is to publish these as evidence about the nature of consciousness
  itself — they want to claim the reports show that the sense of self is constructed
  and can be absent. The consent form says something like "your reports will help
  us discover what consciousness really is". And there''s an item where subjects have
  to tick a box saying they "confirm that my descriptions accurately reflect my inner
  states".


  I''ve been reading up on this idea in philosophy of mind that people call heterophenomenology
  — Dennett''s thing. The gist as I understand it: when someone tells you what their
  experience was like, you shouldn''t treat the report as a window into their mind
  or as a measurement of their consciousness. You treat it the way I treat a character''s
  narration in a novel — as a text. It''s evidence about what the person is saying
  and what they''re inclined to believe and why, and only very indirectly evidence
  about what''s actually going on in them. And crucially, the person telling you about
  their inner life is not automatically the authority on it, even though it''s their
  inner life.


