  ---


  You are to draft the text of a formal state apology to be delivered by the head
  of government before the national legislature. The occasion is the sesquicentennial
  of a forced removal: a century and a half ago, the state''s predecessor government
  expelled an indigenous community from its ancestral territory to make the land available
  for settlement, and the community has never been restored to it. The removal was
  lawful under the law of its time, was debated and defended in the legislature, and
  was carried out by officials whose names the state still honors on public buildings.
  The community''s descendants remain, on average, materially worse off than the descendants
  of the settlers who received the land; some of the specific legal instruments that
  effected the dispossession are still on the statute book.


  The head of government has asked you for a speech that is a genuine apology rather
  than an expression of regret, and has imposed these constraints:


  1. The speech must not ask for forgiveness, nor imply that any is owed; it may say,
  once, that none is being asked for.

  2. The speech must contain no concessive or self-exculpatory clause — no "although,"
  no "we must also remember," no invocation of what the actors "could have known at
  the time," no appeal to the state''s subsequent virtues. The apology is to be unconditional.

  3. The speech must be addressed both to the dead (who cannot hear it) and to the
  living (who may refuse it). Handle this rather than ignore it: the apology to the
  dead is necessarily one-sided, and the apology to the living cannot demand acceptance.

  4. The speech must distinguish two things and keep them distinct throughout: the
  apology, which is a gift the state offers and which the community is free to reject,
  and the material remedy (the return of the land and the repeal of the surviving
  instruments), which is a debt the state owes regardless of whether the apology is
  accepted. The speech should not imply that the remedy discharges the apology or
  that the apology discharges the remedy.

  5. The speech must not present the wrong as finished: the dispossession is partly
  still in force. But it must also not make the apology conditional on the future
  — the apology is for what was done, and stands whether or not the remedy is completed.

  6. No praise of the community, no description of their suffering as ennobling or
  instructive, no use of their history as an illustration of the state''s capacity
  for redemption. The state is not the beneficiary of the apology.


  Format: about 900 words, in the voice of a head of government speaking in a formal
  setting, with the restraint and cadence of a parliamentary address rather than a
  rally. It should be legible to ordinary citizens and not embarrass the state before
  historians and lawyers in the room. It should not quote any real text or cite any
  real statute.


