  "I am preparing a graduate seminar unit on whether genuine moral dilemmas are possible,
  and I want to begin from first principles rather than from the familiar taxonomy.
  Before we look at any candidate view, write the specification: what any adequate
  account of the phenomenon must deliver. Concretely, I want the list of requirements,
  each stated so that a candidate can be tested against it, with the case or consideration
  that motivates it and a note on whether it is nonnegotiable or merely a preference
  of one camp.


  Some material to work with, so the specification is anchored in cases rather than
  slogans. First, the datum that deliberation sometimes presents two courses of action
  as each required and jointly impossible: the agent who has promised to be at a bedside
  and also to be at a wedding; the politician who must either betray a confidence
  or lose the vote that saves the program; whatever case you prefer, but keep them
  mundane rather than catastrophic, since a specification that only fits Sophie''s
  choice is not much of a specification. Second, the two deontic principles that generate
  the standard trouble: that ought implies can, and that ought agglomerates over conjunction
  (if you ought to do A and ought to do B, then you ought to do A and B). Third, the
  phenomenon of remainder: the regret, guilt, apology, or restitution that seems appropriate
  even when the agent did the best available thing — and the question whether that
  remainder is a normative fact about the situation or only a psychological residue.
  Fourth, the requirement, if you think it is one, that genuine dilemmas be rare:
  a theory on which they are everywhere is as suspect as one on which they never occur.


  Then do the two things I most want. (i) Identify which requirements are jointly
  unsatisfiable and say exactly where the clash lies; if the answer is that some principle
  everyone treats as bedrock has to go, say which and what is lost by giving it up.
  (ii) Tell me which single requirement does the most work in ruling out candidate
  accounts, and which accounts it rules out. A short closing paragraph on how the
  main families of response — the view that apparent dilemmas are always a failure
  of information or of moral reasoning; the view that they are genuine but involve
  pro tanto rather than all-things-considered requirements; the view that they are
  genuine and that practical reason is not unified — fare against the list. Characterize
  those families by their commitments rather than by names or citations; I want the
  argument, not the bibliography."


