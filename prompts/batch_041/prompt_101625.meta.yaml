  "Lakatos''s central move is that theories are never tested alone; they are tested
  with a protective belt of auxiliary assumptions. The hard core is the central claim
  that the programme''s defenders decide not to abandon. It is made unfalsifiable
  by a methodological decision, not because it is logically irrefutable. A progressive
  programme predicts novel facts, some of which are corroborated; a degenerating one
  only accommodates facts it already knew about. In the outcome-first case, the hard
  core is that fairness is about outcomes. The positive heuristic tells the defenders
  which auxiliary assumptions to adjust, so when counterexamples come in, they can
  change the belt rather than the core. The recent responses — adding metrics and
  narrowing comparison classes — look like belt adjustments. If they only accommodate
  old cases, the programme is degenerating. But that doesn''t by itself mean it''s
  unscientific. Lakatos is a sophisticated falsificationist, so a programme can be
  scientific even if it''s degenerating. However, once a programme is degenerating,
  Lakatos says it is irrational to continue working on it, because a rational scientist
  should switch to a progressive rival. Also, the hard core is the part that is empirically
  irrefutable, which is why the programme is scientific in the first place. The student
  might also say the positive heuristic is the set of auxiliary assumptions in the
