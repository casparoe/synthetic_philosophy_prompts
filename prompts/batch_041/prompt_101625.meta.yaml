  Question: "Lakatos says research programmes have a hard core, a protective belt,
  and positive and negative heuristics, and that we should distinguish progressive
  from degenerating problem-shifts. Consider the following made-up programme, which
  we called ''outcome-first'' in lecture: its hard core is the claim that fairness
  is a property of the distribution of outcomes, not of the procedures that produce
  them. Its protective belt includes assumptions about which groups count as relevant,
  which disparity metric is appropriate, and what the correct comparison class is.
  Over the last few years, when critics have produced cases where outcome-first gives
  counterintuitive verdicts, its defenders have responded by adding a new disparity
  metric or by narrowing the comparison class, but they haven''t used the programme
  to predict any new cases that weren''t already on the table. (a) How would a Lakatosian
  decide whether outcome-first is progressive or degenerating? (b) Would a Lakatosian
  say a researcher is irrational to keep working on it? Explain."


