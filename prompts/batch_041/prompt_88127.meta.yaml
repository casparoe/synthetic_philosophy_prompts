  ---


  I''m in my second year of a philosophy degree, and this term I''m taking a course
  on Aristotle''s logic and its later reception. Last week''s seminar was on the ninth
  chapter of De Interpretatione, where Aristotle worries about whether a sea battle
  must happen tomorrow if it is already true today that it will; I followed the argument
  well enough in the room, but I came away unsure what the argument is supposed to
  establish about the words people actually use. The occasion for this is small: a
  flatmate of mine follows football, and after a match whose result he had been dreading
  he shrugged and said it was always going to happen; when I asked what he meant,
  he offered, as if it settled the matter, that whatever will be, will be. I recognised
  the shape of the thought at once as the one the seminar had been circling, but I
  could not tell whether his slogan was the conclusion of the sea-battle argument,
  one of its premises, or something far weaker that needs none of it.


  What I would like from you is not a defence of any of this but a disambiguation.
  Take the slogan and lay out the distinct, precise claims it could be making, ordered
  from the trivial to the radical: the reading on which it says nothing at all; the
  reading on which it says that no one could ever have acted otherwise; the reading
  on which it says only that statements about the future already have a determinate
  truth value; the reading on which the future is fixed but our deliberations nonetheless
  make a difference; the reading on which it is a claim about providence rather than
  about truth; and any further readings the phrase naturally carries that I have missed.
  For each, spell out what it commits one to, say which is most likely what my flatmate
  meant, and say which of them would actually do the consoling work he wanted it to
  do — my suspicion, which I would like you to test, is that the consolation needs
  far less machinery than the metaphysics that usually trails behind it.


  Then, because the point of the seminar was that this puzzle is supposed to bear
  on exactly such claims, tell me which premise each reading depends on and what happens
  to it when the premise is dropped. The candidates I have written on my handout are:
  bivalence for future-tense statements; the idea that a statement''s truth consists
  in things being as it says they are; truth being timeless rather than indexed to
  a time of utterance; the further step from the necessity of the consequence to the
  necessity of the consequent; and the thought that no one has any power over the
  past. I would like to know which readings survive the loss of each, which collapse,
  and which of the surviving readings a defender of the fatalist''s use of the slogan
  in my seminar would actually need. Please write the answer in British English.


