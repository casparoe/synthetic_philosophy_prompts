  A colleague in interpretability research has been pressing the following analogy
  on me, and I would like it audited rather than applauded or dismissed.


  A chess engine, he observes, is a system we describe in intentional terms without
  embarrassment: we say that it wants to win, that it thinks its queen is en prise,
  that it is looking for a way to expose the king. Nobody supposes this is more than
  a convenience. The engine has no inner life, no stake in the outcome, nothing it
  is like to be; the description is shorthand for a search over a game tree. A large
  language model, he continues, is the same kind of case. When it reports that it
  is trying to be helpful, that it is uncertain, or that it would prefer not to be
  shut down, we are projecting a mind onto a computation that has none, and the projection
  is no more truth-apt than the engine''s wanting to win. He anticipates the obvious
  rejoinder — that engines are hand-coded while language models are trained — by noting
  that the strongest engines are themselves trained by self-play and are, if anything,
  more opaque than the engines of twenty years ago; the disanalogy, on his view, strengthens
  his hand. From this he draws a practical conclusion: a model''s statements about
  its own beliefs and preferences should not be treated as evidence about anything,
  and the current interest in model honesty, deception, and welfare rests on a category
  mistake.


  I am not persuaded, but I want the disagreement stated properly. Please audit the
  analogy, as follows.


  First, give me the correspondence: what plays the role of the engine, of the search,
  of the evaluation function, of the wanting, of the observer, and of the predictions
  the intentional description is meant to secure.


  Second, say where the mapping breaks, and sort the disanalogies into those that
  matter for the conclusion he is drawing and those that are decorative.


  Third, and this is what I most want settled: does the analogy, read in the direction
