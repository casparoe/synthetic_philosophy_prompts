  "A colleague of mine, working on model interpretability, has been arguing that we
  should stop taking belief-and-desire talk about large language models at face value,
  and he rests the argument on an analogy. A chess engine, he says, is a system we
  are perfectly comfortable describing in intentional terms: we say it wants to win,
  that it thinks its queen is en prise, that it is looking for a way to expose the
  king. Nobody supposes this is more than a convenience — the engine has no inner
  life, no stake in the outcome, nothing it is like to be it. The description is a
  useful shorthand for a search over a game tree. A language model, he continues,
  is the same kind of case: when it says it is trying to be helpful, or that it is
  uncertain, or that it would rather not be shut down, we are projecting a mind onto
  a computation that has none, and the projection is no more truth-apt than the engine''s
  ''wanting'' to win. He anticipates the obvious objection — that engines are hand-coded
  while language models are trained — by pointing out that the strongest engines are
  themselves trained by self-play and are, if anything, more opaque than the models
  of twenty years ago; the disanalogy, he says, actually strengthens his case. The
  conclusion he draws is practical: we should not treat a model''s statements about
  its own beliefs and preferences as evidence about anything, and the recent interest
  in model honesty, deception, and welfare is a category mistake.


  I am not convinced, but I want the disagreement stated properly rather than traded
  as slogans. Please audit the analogy. Give me the correspondence: what plays the
  role of the engine, the search, the evaluation function, the ''wanting,'' the observer,
  and the predictions the description is supposed to secure. Then tell me where the
