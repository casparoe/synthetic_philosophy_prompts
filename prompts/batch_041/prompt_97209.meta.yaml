  Dreams domain crux ideas:

  1. Malcolm (1959, "Dreaming"): The concept of dreaming. His argument: (a) The question
  "are dreams experiences?" — he argues that dreams are not experiences because the
  only criterion for a dream''s content is the waking report. If someone reports a
  dream, we can''t ask whether the dream "really" had that content independent of
  the report. (b) The "verification" problem: statements about dreams can''t be verified
  by any means other than the dreamer''s testimony, so it makes no sense to suppose
  a dream occurred without being remembered/reported. (c) He uses Wittgensteinian
  considerations: the concept of a "dream" is tied to the waking report; a dream that
  is never remembered is inconceivable ("a dream that is not remembered is not a dream").
  (d) He also argued against the "dream experience" by noting that if dreams were
  experiences, we''d need a criterion for their occurrence independent of the report,
  which we lack.


  Actually, Malcolm''s key claim: "Dreaming is not an experience" — he holds that
  the phrase "I dreamed I was..." doesn''t describe an experience. He thinks the notion
  of a dream as a "conscious experience during sleep" is a philosophical illusion.


  2. Dennett (1976, "Are Dreams Experiences?"): He frames it as: we can''t just do
  conceptual analysis; it''s an empirical question. He distinguishes the "cassette
  theory" (dreams are experienced during sleep, then replayed/remembered on waking
  — like a tape) from the "memory-loading" hypothesis (no experiences during sleep;
  at waking, the memory of a dream is composed/loaded, like a program loading data).
  Dennett argues that both fit the introspective data, and that the question is empirical.
  He also discusses the "time-gap" issue (the apparent time of dreams vs. actual time),
  and cases like "insomnia" and the fact that dreams seem to be remembered as experiences.
  Dennett is skeptical of Malcolm''s conceptual argument because he thinks it begs
  the empirical question. Dennett''s own view: he seems to favor that dreams are not
  experiences, or at least that we shouldn''t assume they are. Actually Dennett''s
  paper concludes that the question is empirical and that the "cassette theory" is
  not obviously true.


  The lucid dreaming evidence: LaBerge''s experiments where lucid dreamers signaled
  with eye movements (e.g., left-right-left-right) at predetermined times; the signals
  appeared in the EOG during REM. This is often taken to show that dreaming happens
  in real time during REM and that the dreamer is a conscious agent during the dream
  — supporting the "cassette theory" / that dreams are experiences.


  Hmm, but does it refute Malcolm? Malcolm might say: the eye signals are just behavior
  during sleep; the report "I dreamed I signaled" is still the only access. Actually
  the eye-signaling provides an independent (non-report, or rather a report-independent)
  marker that correlates the dream content with the reported content — the dreamer
  planned to signal upon realizing they were dreaming, and the signal occurred. This
  gives evidence that a conscious experience (realizing "this is a dream") occurred
  during sleep, because the signal is time-locked to the REM period and matches the
  pre-agreed pattern. That''s a strong independent check, arguably refuting Malcolm''s
  claim that there''s no criterion for a dream''s occurrence independent of the waking
  report.


  But careful: the signal is a physical event during sleep; the "dream content" (the
  realization) is still only known by report. But the temporal coincidence is the
  point.


