  ---


  I''ve been reporting on the "does sexist language matter" fight for the better part
  of a year — a feature that''s now twice the length my editor agreed to — and the
  thing that''s driving me nuts is that nobodys position has moved a millimeter in
  all that time. I''ve got the two main camps down cold by now and they are still
  just... talking past each other.


  Camp one: words are the infrastructure of thought. If the generic ''he'' and ''man''
  are the unmarked forms, then male is the default case and everyone else is a special
  case, and that shows up in who gets pictured for a job, who gets remembered, etc.
  Hofstadter''s "Person Paper" is their ace — he took the exact same argument people
  make about gender and swapped in race, so that ''white'' is the neutral term and
  the racial version reads as monstrous, and if you laugh at one and shrug at the
  other, they say, you''ve just told me which one you''ve stopped noticing.


  Camp two: this is a distraction dressed up as politics. Words are downstream of
  power, not upstream; renaming a chairman doesn''t move a nickel; and anyway the
  studies that supposedly show wording changes attitudes are soft — the priming stuff
  has had a rough decade, the effects are small, the replications are mixed. Changing
  the word is what institutions do when they don''t want to change anything else.


  And then there''s a third thing I keep bumping into, mostly from people who''d rather
  not be in either camp: the analogy is the problem. Race and sex aren''t parallel,
  so the Person Paper doesn''t prove what camp one thinks it proves, and calling ''he''
  sexist is just a category error — a word''s meaning is one thing, its statistical
  defaulting is another, and defaults are cancellable, so where exactly is the harm?


  Here''s my hypothesis, and I''d like you to attack it. I don''t think this is an
  empirical dispute at all, or not mainly. I think the two sides are answering different
  questions under one headline: (a) does the defaulting actually change minds, which
  is an empirical question with messy evidence, and (b) does using a term that makes
  one group the neutral case do a wrong to the other group regardless of whether it
  changes any minds, which is normative and doesn''t care about effect sizes. And
  the stall is because camp two thinks camp one needs (a) and camp one thinks (b)
  was the point all along.


  So: diagnose this. Is it verbal, is it substantive, is it two questions under one
  name, or is it bedrock intuitions about whether a harm has to be measurable to count?
  Is there a hidden empirical question doing the work, and if so what study would
  actually settle it — or is the honest answer that the empirical question is irrelevant
  to the disagreement? And tell me what would count as progress here, if anything,
  and whether the whole thing is just ill-posed. Don''t give me a reading list or
  a bunch of citations, I don''t need those — I need the diagnosis and the reasons
  for it, and I''d rather you be blunt about which side''s framing is doing more work
  than it can cash out."


