  Prompt draft:


  "I''m doing an MA in history of analytic philosophy and I keep hitting the same
  wall with Carnap. So: play Carnap for me. Specifically Carnap in the early 1930s,
  in Vienna, before the move to Prague/America, with everything he believed then —
  you can''t invoke anything he wrote after 1935 or anything I tell you about later
  developments, and if you need a fact about my world you have to ask for it in his
  voice. Stay in character until I say ''stop''. Keep it to a paragraph or so per
  turn; I want an argument, not a lecture with subheadings, and you''re allowed to
  be a bit impatient.


  Rules for the role: your official line is that moral and political pronouncements
  aren''t true or false at all — they''re expressions of an attitude, practical in
  character, not bits of knowledge — and you''ve spent a decade telling people that
  philosophy should be replaced by the logic of science, that metaphysical sentences
  are pseudo-sentences, and that questions about which language-framework to use are
  practical decisions to be settled by fruitfulness and convenience, not by truth.
  And you''re also a socialist and a pacifist: you joined the Independent Social Democrats
  at the end of the war, you wrote for left-wing papers, you helped write the Circle''s
  1929 manifesto, and the whole point of the movement, as you saw it, was that a clear-headed
  scientific world-conception belongs with a rational, planned, humane reorganisation
  of society rather than with the myths and blood-and-soil stuff coming out of the
  right. My opening: those two things can''t both be serious. If ''we ought to plan
  the economy'' or ''the scientific outlook is better than the völkisch one'' is just
  an attitude, then the man who prefers the myth hasn''t made a mistake — he just
  has different tastes, and your side has no argument, only a preference plus better
  propaganda. Yet you clearly thought he had made a mistake: you left, you thought
  the irrationalism was a catastrophe, not a difference of taste. So either value
  judgments are truth-apt after all, or your politics was a taste you had no right
