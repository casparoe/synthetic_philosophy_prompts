  Draft:


  At a departmental seminar on moral revolutions, I watched two participants, A and
  B, argue over whether norms such as slavery and dueling end through arguments, interests,
  or honor. I am reporting their exchange as a bystander and have no stake in which
  one wins. The disagreement unfolded roughly as follows.


  (1) A: The abolition of slavery is best explained by shifting economic interests.
  The moral arguments against slavery had been available for centuries; what changed
  was that slave labor became less profitable and free labor more attractive to metropolitan
  capital. Where the moral case ran ahead of the interests, it had little effect.
  The Williams-style thesis is basically right.


  (2) B: That confuses a permissive condition with a cause. Economic change may have
  made abolition feasible, but feasibility does not explain why it was undertaken.
  Honor did the proximate motivational work: abolition became a marker of national
  honor, and slaveholding became a source of shame. The same pattern appears in dueling:
  the practice did not end because the arguments against it suddenly improved, but
  because it became dishonorable to duel. Appiah''s honor-centered account captures
  what the interest story leaves out.


  (3) A: Honor is just another interest—reputational interest. Once you see that,
  the Williams-style thesis absorbs your objection: interests explain everything,
  including honor. And honor codes themselves tend to shift when elites'' material
  position shifts. The apparent autonomy of honor is an illusion.


  (4) B: If ''interest'' is stretched to include every motive, the thesis becomes
  unfalsifiable. Honor is not merely an individual''s reputational advantage; it is
  a shared normative status with its own grammar. People routinely sacrifice material
  advantage for honor. Arguments matter because they can reconstitute honor: showing
  that a practice is inconsistent with an identity one already prizes can make the
  practice shameful. That is a causal path from argument to conduct, not a rationalization
  after the fact.


  (5) A: Then why do some arguments catch on and others do not? The ones that catch
  on are those that align with interests. Moreover, many moral revolutions are top-down
  and coercive: states abolish practices for geopolitical or fiscal reasons, and the
  moral vocabulary is supplied afterward.


  (6) B: That is an empirical dispute, not a conceptual one. But even top-down abolition
  required a normative vocabulary to be legitimate; honor supplied it. And the interest
  story often leans heavily on the British case. Dueling and foot binding had very
  different economic profiles, yet they show similar honor dynamics. A single case
  cannot carry the thesis.


  (7) A: Here is a hybrid I would accept: moral revolutions are tipping cascades in
  reputational networks. Arguments are the activation energy; interests are the payoff
  matrix; honor is the threshold. On this model, the Williams thesis and the Appiah-style
  account are not rivals but different parameters of the same process.


  (8) B: That hybrid is attractive but risks being too elastic. If every outcome can
  be redescribed as a tipping cascade, the model explains nothing. You still need
  to say which mechanism does the work in particular cases, and whether honor is a
  cause or merely the medium through which other causes operate.


