  needs agglomeration to get a contradiction. So the asker''s opening can be: "your
  whole impossibility proof needs the principle that if I ought to do A and ought
  to do B then I ought to do A-and-B; but that''s exactly the principle that fails
  in a dilemma. So your proof just assumes its conclusion. Also, the guilt I feel
  isn''t a sign I''m confused, it''s the residue of a duty I couldn''t discharge."


