  I am putting together a handout for a graduate reading group on decision theory
  and longtermism, and I want it to be a diagnostic decision tree rather than a prose
  survey. The topic is expected value fanaticism: the cluster of views according to
  which a sufficiently large payoff can make it rational or morally required to pursue
  an option whose probability of success is arbitrarily small, and the cluster of
  objections that this makes expected value maximization absurd. The tree should begin
  from a starting commitment that most participants will share—something like: for
  finite, well-understood prospects, expected value maximization is the correct decision
  rule—and then branch through the substantive commitments that force or block fanaticism.
  Each branch node should be a question about one of those commitments, phrased so
  that a reader can answer it without already knowing which named position it leads
  to. The nodes I especially want represented are: whether value is bounded or can
  be infinite/lexically superior; whether probabilities can be arbitrarily small yet
  still sharp and comparable; whether the decision rule is applied choice-by-choice
  or to a whole policy/life; whether the relevant comparison is ex ante expected value
  or ex post realized value; whether the agent may discount tiny probabilities as
  a matter of rationality or only as a matter of psychology; and whether the problem
  is better treated as one of imprecise probabilities, moral uncertainty, or the topology
  of the value space rather than as a problem about probability at all. Use concrete
  cases at the nodes where they help—Pascal''s mugging, the St. Petersburg game, a
  long-shot intervention that might avert an astronomical catastrophe, a series of
  individually negligible chances to do enormous good—but do not let any node depend
  on a citation.


