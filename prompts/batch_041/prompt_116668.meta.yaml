  I am a graduate student in philosophy of economics, and I have been trying to understand
  a pattern that arises when a market is public and its participants are aware of
  the conditions under which trade should not occur. The standard result, as I understand
  it, is that if everyone shares a prior and knows that everyone is rational, then
  no one will trade on private information, because the mere willingness to trade
  at a given price reveals that the other side knows something unfavorable. That much
  I can follow. What I cannot find a name for is a second-order effect: once the no-trade
  result is common knowledge, the absence of trade stops being informative—it is simply
  what the theory predicts—but any observed trade becomes extremely informative, because
  it signals that someone is either irrational, informed, or manipulating. The more
  people trust the no-trade result, the more weight a single trade carries, and the
  more profitable it becomes to trade for no reason other than to move that second-order
  signal. The equilibrium in which no one trades therefore seems to undermine itself:
  its credibility makes deviations more meaningful, and meaningful deviations attract
  people who have no private information at all.


