  specify the formal analogue of "proving your own soundness", the claim is unfalsifiable.

  - The "unexploitability" question: what does it cost? An agent that restricts self-trust
  may still be fine; if the cost is only the loss of a proof of a schema, maybe the
  "obstacle" is a feature not a bug.

  - Also: the obstacle presupposes the agent can *represent* its own soundness as
  a single sentence in its language; if self-trust is distributed (no single "I am
  sound" belief), there''s no fixed point to fail.

  - Also: empirical point — humans are inconsistent anyway; the obstacle''s bite depends
