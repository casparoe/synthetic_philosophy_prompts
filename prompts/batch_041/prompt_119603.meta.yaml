  Löb framing: "I''ve been defending the line that the Löbian obstacle isn''t a quirk
  of arithmetic but a general fact about any agent that reasons about its own reliability
  — so full self-trust is off the table for any reflective agent, not just proof-based
  ones. What would count against that generalisation?" That''s a nice position, with
  a clear generalisation move that''s vulnerable. Defeaters:

  - The theorem is about provability in a theory that can represent its own proofs;
  agents don''t have complete theories. If the agent''s reasoning isn''t recursively
  axiomatisable or isn''t sound in the relevant sense, the theorem doesn''t apply.

  - The escape routes: restricting the reflection schema to a fragment (but then the
  agent can be exploited / loses a form of self-trust), using a non-classical or inconsistent-but-paraconsistent
  logic, using infinitary/transfinite hierarchies of trust (tiling), dropping the
  principle that "if I''ve proved φ then φ" as a premise (i.e., not including your
  own soundness as a *premise* in your reasoning).

  - The distinction between proof-theoretic self-trust and semantic/probabilistic
  self-trust: a probabilistic agent with a reflective prior can be self-trusting in
  a different sense; the obstacle may be an artifact of using a *deductive* notion
  of trust.

  - The distinction between trusting a *process* and trusting a *theory*: you can
  trust the outputs of your reasoning without being able to prove the general claim
  that your reasoning is sound.

  - Whether the obstacle has normative force: it may show only that certain *formal*
  self-referential constructions fail, not that self-trust is irrational.

  - The analogy to the surprise exam: is the "paradox" dissolved once you distinguish
  levels of knowledge? (The obstacle is real for provability but the "surprise" analogue
  dissolves.)

