  Draft:


  "I''m in a reading group that has spent the term on mechanisms that try to replace
  political judgment with market aggregation, and I''ve been assigned to bring in
  a case. The case I''ve drawn is the Policy Analysis Market, the DARPA project that
  was killed in the summer of 2003. Here is the version of the facts I want you to
  work from, so that nothing hangs on details you can''t check: PAM was to be a small
  futures exchange, run out of DARPA''s Information Awareness Office, on which traders
  would buy and sell contracts on political and economic developments in the Middle
  East; the design came from a private research firm, and the intellectual rationale
  was the familiar one that market prices aggregate dispersed information better than
  expert panels or polls. The project died within roughly a day of a Senate press
  conference at which two senators attacked it as a federal betting parlor on assassinations
  and terrorism -- the outcry was triggered by sample interface screens that listed,
  among many other mundane items, an assassination and a coup as possible contract
  types. The head of the office resigned shortly after. I don''t want you to relitigate
  who was to blame or what exactly was on those screens; I want the case analyzed,
  and I''ll stipulate that the informational case for the market was sound and that
  the opposition was, in part, a moral reaction rather than a factual claim.


  The theory I want you to run it through is futarchy, in Robin Hanson''s sense: the
  polity votes on values -- it settles on some measurable welfare metric -- and then
  uses markets, not votes, to settle beliefs, so that a proposal is adopted if and
  only if conditional markets predict a higher value of the metric under adoption
  than under non-adoption. Note that this is a decision rule, not just a forecasting
  tool, and that its two halves come apart: PAM was all beliefs and no values, and
  it had no decision rule at all -- nobody was bound by its prices. So the first thing
  I want is a careful mapping. Was PAM a futarchy in embryo, a partial implementation,
  or something futarchy would not recognize? Who are the players under futarchy''s
  description -- the traders, the agency, the oversight committees, the press, the
  public -- what are their options and payoffs, and what does the theory say each
  was doing? Then tell me honestly where the theory goes silent or misdescribes the
  episode. My own suspicion is that the interesting failure is not informational but
  legitimatory: futarchy''s ''vote on values'' half assumes that the values at stake
  are settled and that only the beliefs are in dispute, whereas what killed PAM was
  a dispute about whether certain things ought to be priced at all, and about what
  it means for a state to be the counterparty. If that is right, say what it costs
  futarchy -- does the episode show that values and beliefs cannot be separated, and
  is that a fatal objection or a design constraint that could be met? Also address
  the incentive problem the critics gestured at, that anyone able to cause the event
  has an incentive to trade on it, and say whether futarchy''s conditional markets
  inherit that problem or solve it by construction.


  Finally, I want the case to run back the other way. Futarchy is a normative proposal
  that says almost nothing about how a polity could ever get from here to there; this
  episode is one of the few real attempts to put prediction markets inside a government,
  and it lasted about a day. Is that a confirmation of the theory (its critics were
  irrational, or captured by the incentives the theory predicts), an anomaly (the
  theory has no place for moral outrage as a political constraint), or a case it never
  anticipated? In particular, consider whether futarchy''s own adoption could ever
  be decided by a futarchy -- if not, what follows about the theory''s account of
  its own feasibility? And consider whether the futarchy version of the same exercise
