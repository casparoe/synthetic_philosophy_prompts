  someone with the capability to cause it has an incentive to trade — PAM''s critics
  raised "terrorists could profit"; futarchy inherits this for any conditional market
  where an actor can influence the outcome (self-fulfilling prophecy). Actually the
  deeper point: in futarchy, market participants who can influence the metric have
  an incentive to trade on and then manipulate the outcome — the "decision market"
