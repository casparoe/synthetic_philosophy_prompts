  The framing. Take the family of views on which value is analyzed in terms of fitting
  attitudes: something is good just in case it is a fitting object of a pro-attitude,
  and a consideration is a reason for an attitude just in case it bears on that attitude''s
  fittingness. The difficulty is that some considerations seem to give reasons for
  an attitude while having nothing to do with its fittingness. The familiar case:
  a powerful and malicious being will punish you severely unless you admire him, and
  the threat cannot be satisfied by deciding to admire. The threat gives you reason
  to want to admire, or to bring the admiration about, but it does not make admiration
  fitting; and yet it is not simply false that you have a reason to admire in that
  situation. The question is what such reasons are, and whether their existence shows
  that the fitting-attitude analysis conflates two different notions of a reason for
  an attitude.


  Two further things about my framing, since they will shape what you produce. First,
  I want the account to cover attitudes beyond desire and belief — admiration, amusement,
  gratitude, hope, intention, blame — and I want the same machinery to handle the
  case of reasons to believe, where the pressure is usually taken to be strongest.
  Second, I am introducing a third category alongside the object-given/state-given
  contrast that I take to be standard: reasons that arise from the agent''s position
  or commitments, which I call positional reasons. A promise to feel grateful, a parent''s
  standing to feel pride in a child, a soldier''s obligation to feel shame for a unit''s
  conduct, a mourner''s role in a funeral — these look like reasons for an attitude
  that are neither grounded in the attitude''s object nor in the attitude''s effects.
  I want to know whether that category is real, whether it is exhaustive with the
