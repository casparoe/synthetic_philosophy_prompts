  Now, the type: a sincere question that rests on a subtle confusion or false presupposition.
  So I need a journalist asking a question that misunderstands Nozick''s view on animals.


  What''s the subtle confusion? A few options:


  1. The confusion that "utilitarianism for animals" means Nozick is a utilitarian
  about animals'' welfare, i.e., that he thinks animals'' suffering counts in the
  utilitarian calculus. But actually the label means something subtler: it''s about
  what kind of constraints apply to how we treat animals — that they get no side constraints,
  so they can be sacrificed for aggregate gain. The label "utilitarianism for animals"
  is a thesis about the *structure of moral constraints* (no side constraints for
  animals), not about the *weight of animal welfare*. In fact, one could hold utilitarianism-for-animals
  while thinking animal suffering barely matters at all (if their welfare is low-weight),
  or while thinking it matters enormously. And conversely, the phrase doesn''t say
  Nozick *endorses* the view; he presents it as a position many hold, and he''s skeptical
  of it, suggesting a more continuous view where animals might have some constraints.


  2. The confusion that Nozick *endorsed* utilitarianism for animals. Actually I recall
  he says this is a view held by many, and he suggests it''s "puzzling" and that the
  grounds for excluding animals from side constraints are not clear. He seems to lean
  toward a sliding-scale view.


  3. The confusion that Nozick''s libertarianism requires a strong animal-rights position
  because it''s all about self-ownership and not being used as a means — so a journalist
  might ask "since Nozick says persons may not be used as means, and animals are also
  beings that can be used as means, doesn''t his own logic require him to be a vegetarian
  / animal liberationist?" That''s a genuine subtle confusion: conflating the *form*
  of the constraint with the *scope* — Nozick explicitly raises the question of whether
  the basis for side constraints extends to animals, and treats it as an open and
  troubling question, not a settled entailment. Also, Nozick''s grounding of side
  constraints is not simply "being usable as a means" — it''s tied to the separateness
  of persons and the capacity for a conception of one''s own life. So the presupposition
  "Nozick''s libertarianism therefore implies animal rights" mistakes the basis of
  the constraint.


  4. Another subtle confusion: thinking the phrase "utilitarianism for animals, Kantianism
  for people" is a *prescription* Nozick is arguing for, when actually it''s a description
  of a widely held but (he thinks) theoretically ungrounded hybrid, and he''s pressing
  on the puzzle of why the line falls there. The journalist could ask: "Nozick''s
  rule was that we can use animals however we like as long as it maximizes overall
  welfare — so why did he think factory farming is okay?" That''s a false presupposition:
  (a) the label doesn''t mean "however we like"; it means animals'' interests count
  only aggregatively, not as constraints; (b) Nozick didn''t straightforwardly endorse
  it; he raised it as a puzzle; (c) he certainly didn''t say factory farming is okay.


