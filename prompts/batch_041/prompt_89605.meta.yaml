  "I''m preparing a paper for a graduate seminar on decision theory and science fiction,
  and I want to read Denis Villeneuve''s Arrival (2016) through the lens of evidential
  cooperation in large worlds. The idea, as I understand it, is that agents who cannot
  causally affect one another can still cooperate if each one''s decision is evidence
  about the other''s—because they share a decision procedure, or because they are
  both reasoning from a common prior about what agents like them would do. In a large
  enough universe, this can make cooperation with distant, unreachable agents rational
  even without any causal channel. Arrival seems to dramatize exactly this: the heptapods
  give humanity their language, knowing that in three thousand years they will need
  humanity''s help; Louise chooses to have her daughter knowing the child will die
  young. But I''m not sure whether the film is a genuine illustration or a cheat.
  The heptapods'' nonlinear experience of time means they already know the future,
  so their ''cooperation'' may be causal in a way that evidential cooperation is supposed
  to avoid; Louise''s choice may be less a decision under uncertainty than an acceptance
  of a whole life she has already seen. I want a reading that takes both the film
  and the idea seriously: where does the film illuminate the structure of evidential
  cooperation—perhaps in the way Louise''s choice is not about causing a particular
  outcome but about affirming a pattern that includes both joy and grief—and where
  does it distort it by removing the uncertainty that makes the problem interesting?
  Does the film''s time loop make the trade acausal in the relevant sense, or does
  it collapse the distinction between evidential and causal reasoning? And what, if
  anything, does the film add to the philosophical debate that the decision-theory
