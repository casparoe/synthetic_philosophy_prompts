  Here is my opening move, a case I''ve been chewing on. Call it the Delayed Echo.
  It is a creature with two systems: a first-order one that carries states with determinate
  characters — nociceptive firing, warmth, and so on — and a second-order monitor
  that represents those states to the creature, but with a fixed one-step lag, and,
  crucially, by a perceptual rather than inferential route: it scans the first-order
  system the way an eye scans a room. Suppose the lag is stable and the pairing is
  systematically wrong: while the first-order system is firing nociceptively, the
  monitor represents the creature as being in a state of mild warmth, and while the
  first-order state is mild warmth, the monitor represents nociceptive firing. Your
  view says the state is conscious when the higher-order representation is in place.
  So: which state is conscious in the Echo, and what is it like for it?


  Two answers look available and both seem to cost you something. If the higher-order
  representation fixes what it''s like — the Echo feels pain when it is merely warm
  — then the first-order state is doing no work in your account, and I don''t see
  how your view is anything but a first-order theory plus a story about which first-order
  states get promoted; the transitivity requirement starts to look like a ladder you
  kick away after climbing. If instead the first-order state fixes what it''s like,
  then the higher-order representation is idle, and I don''t see what it contributes
  beyond being a report of something that was already conscious. And if you say there''s
  no fact of the matter about what the Echo is like — that a mismatched higher-order
  representation leaves the creature with nothing it is like to be — then I want to
  know what stops that answer from spreading to me, given that I have no privileged
