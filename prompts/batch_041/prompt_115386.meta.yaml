  a mark (liṅga) to what it marks: seeing smoke on the hill we infer fire, because
  wherever there is smoke there is fire (vyāpti). Upamāna is knowledge of something
  through its similarity to something already familiar — the stock example is learning
  from a forester that a gavaya is like a cow, and then recognising one and knowing
  what "gavaya" means. Śabda is verbal testimony, i.e. accepting the assertion of
  an āpta, a trustworthy person such as a doctor telling you which medicine to take.
  Some Naiyāyikas also accept arthāpatti, postulation, for cases where we infer something
  that can''t be perceived, e.g. that Devadatta must be outside because he is alive
  but not at home; this was taken over from Mīmāṃsā but Nyāya kept it as a subordinate
  pramāṇa.


