  I''m a sixth-year philosophy PhD student, longtime reader of the rationalist blogosphere
  — LessWrong, the old Overcoming Bias archives, the usual Slate Star Codex-era stuff
  — and I''ve internalized enough of the standard moves (steelman first, taboo your
  terms, ask what would change your mind, find the least convenient possible world)
  that I now find most conference Q&A painfully underpowered. Next month I present
  my dissertation chapter at our department''s work-in-progress seminar, and I want
  to walk in having already fought the battle. The chapter defends a reading of Nāgārjuna''s
  catuṣkoṭi — the tetralemma, the four corners: that a thing is P, that it is not-P,
  that it is both, that it is neither — that I think is both deflationary and, oddly,
  defusing. My claim is that the four corners are not four truth-values, and that
  Madhyamaka is not secretly running a non-classical logic (neither a truth-value
  gap nor a glut). Instead I argue that the fourth corner is a presupposition-cancelling
  move: once you see that all four answers share a presupposition — that there is
  a thing with a determinate nature (svabhāva) for the predicate to attach to — the
  whole question collapses, the way "is the number seven green or not green?" collapses
  rather than resolves. On this reading, the famous self-referential worry (if everything
  is empty, isn''t emptiness itself empty? doesn''t the claim that all views are to
  be abandoned refute itself?) dissolves: "empty" is being used predicatively only
  under a presupposition the argument has already removed, so the master claim isn''t
  a thesis in the sense that would need to be either empty or not.


  The audience is the problem. The seminar will be maybe nine people and it splits
  badly. Two of them are formal logicians — one works on non-classical logics and
  is a committed dialetheist who will hear my "neither" and immediately want to know
  why I''m not just doing paraconsistency with extra steps, and why I''m so sure the
  fourth corner isn''t a straightforward truth-value gap, which he''ll point out is
  exactly what a category mistake looks like on a supervaluationist account; the other
  is a proof theorist who will want to know what the object language and metalanguage
  are and will not accept hand-waving about "the question collapsing." Then there''s
  a Kantian-leaning analytic metaphysician who thinks all of this is just the antinomies
  with worse prose and will ask what work "presupposition" is doing that "category
  error" wasn''t already doing. And finally two people from Asian studies who read
  Sanskrit and Tibetan and are allergic to what they''ll call analytic appropriation
  — they''ll want to know which Nāgārjuna, which text, whether I''m quietly collapsing
  the distinction between the Prāsaṅgika and Svātantrika approaches, what I do with
  the commentarial tradition''s insistence that this is soteriological rather than
  a contribution to the philosophy of language, and whether my whole framing is a
  modern imposition.


  Please write me my Q&A prep sheet. I don''t want a summary of the debate and I don''t
  want a defense of my view — I want to know what this specific room will actually
  throw at me: the objections ordered by how likely and how damaging they are, each
  phrased the way that particular person would phrase it (the dialetheist''s version
  of an objection is not the Buddhologist''s version), with a short reply I could
  actually deliver in two minutes and a candid note on where the reply is weakest.
  Tell me which objections to concede up front because fighting them costs more than
  they''re worth, which to hold, and — the one I''m dreading — the question I''m hoping
  nobody asks but that at least one of the two Sanskritists is going to ask anyway.
  No citations needed; I just need the fight choreography.


