  "heritability is high in affluent societies" — Turkheimer''s Scarr-Rowe interaction);
  the "gloomy prospect"; "missing heritability"; the difference between heritability
  and "genetic causation"; "a heritability of 1 in a given range doesn''t mean interventions
  don''t work" (e.g., height heritability is ~0.8 but secular increase due to nutrition);
  "heritability ≠ inheritability" (Lewontin''s point); the "analysis of variance"
  framing; the "causal-model / ACE model assumptions: no gene-environment correlation
  or interaction" — that''s nicely in the weeds. Also the distinction between "heritability"
