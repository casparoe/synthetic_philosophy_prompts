  Student answer draft:


  "Nozick''s Chamberlain case is meant to show that liberty upsets patterns. He asks
  us to imagine a distribution D1 that everyone agrees is just — say an equal one
  — and then a million fans each voluntarily pay Wilt Chamberlain a quarter to watch
  him play. The result is D2, in which Chamberlain has $250,000 more than everyone
  else. Nozick''s claim is that if D1 was just, and every transfer from D1 to D2 was
  voluntary, then D2 must be just too, since it was produced from a just situation
  by just steps. This is the heart of his entitlement theory: justice in holdings
  is historical, and it has three parts — justice in acquisition, justice in transfer,
  and justice in rectification of past injustice.


  What the argument is supposed to show is that no patterned principle of justice
  — to each according to need, merit, effort, and so on — can be continuously realised
  without constantly interfering with people''s choices. If you want to keep the pattern,
  you have to stop people from making the deals they want to make, which is why Nozick
  thinks the difference principle and other end-state views license a kind of continuous
  redistribution. What the argument doesn''t show, as Nozick admits, is that any actual
  distribution is just; it takes D1 as given and only says that liberty will disrupt
  any pattern you start from.


  Nozick is also careful that entitlement is not the same as desert. Chamberlain is
  entitled to the money because of how it came to him — the fans chose to pay — not
  because he morally deserves it, or because his playing is valuable. Desert is irrelevant
  to the entitlement story; if the fans had been foolish or if Chamberlain were a
  terrible person, the transfers would still be just. So the point of the case isn''t
  that Chamberlain earned his fortune in any deep sense, it''s that he is entitled
  to it, and entitlement is what justice tracks.


  Applying this to Priya and Dan: Priya''s flower money came from voluntary sales
  and a voluntary gift, so the distribution is just, and Dan has no complaint in justice
  even though he''s worse off and regrets the gift. Justice in rectification doesn''t
  come into it, since nobody violated his rights. If we wanted to restore the original
  equality we''d have to interfere with Priya''s and her customers'' liberty, which
