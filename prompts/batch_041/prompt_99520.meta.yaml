  The absent-minded driver problem (Piccione & Rubinstein 1997): A driver is driving
  home, passes two identical intersections. At the first intersection he can exit
  (get payoff 0?) or continue; if he continues he forgets whether he''s passed the
  first intersection. At the second intersection, if he exits he gets payoff 4? Let''s
  recall: "An absent-minded driver is driving home... There are two intersections;
  at the first, exiting yields payoff 0; continuing to the second and exiting yields
  payoff 4; continuing past the second yields payoff 1 (crash?)". Actually I recall:
  payoffs: exit at first = 0, exit at second = 4, continue past second = 1. Since
  the driver can''t distinguish the intersections, a strategy is a single probability
  of exiting. Expected payoff = p*0 + (1-p)[p*4 + (1-p)*1]... wait no: if he chooses
  to exit with prob p at each intersection (he can''t tell which), then: with prob
  p he exits at first (payoff 0). With prob (1-p) he continues; then at second intersection
  (which he mistakes for possibly the first) he again exits with prob p, payoff 4;
  with prob (1-p) continues, payoff 1. So EU = p*0 + (1-p)[p*4 + (1-p)*1]. Maximize:
  f(p) = (1-p)(4p + 1 - p) = (1-p)(3p+1) = 3p +1 -3p^2 - p = -3p^2 +2p +1. Max at
  p = 2/6 = 1/3. So the optimal strategy is to exit with probability 1/3 at each intersection,
  giving payoff -3*(1/9)+2/3+1 = -1/3+2/3+1 = 4/3. The "naive" strategy is to continue
  at the first and exit at the second (payoff 4), but since he can''t tell, choosing
  "exit at the second" means at the first intersection he''d... he can''t implement
  it. The paradox: the strategy "continue" (p=0) gives payoff 1; the optimal mixed
  gives 4/3; and the ex-ante optimal deterministic strategy would be to exit at the
  first... no wait exit at first gives 0, which is worse than 4/3. Hmm, the point:
  a driver who could commit to "continue then exit" gets 4, but can''t. The paradox
  is about how to apply decision theory when the agent is "absent-minded": at the
  decision node, conditional on being at the node, the probabilities of being at intersection
  1 vs 2 depend on the strategy. This is a genuine puzzle about dynamic consistency
  and "decision node" reasoning.


