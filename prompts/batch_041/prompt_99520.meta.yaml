  "A colleague in a decision-theory reading group described a puzzle to me and I have
  since watched two of its members argue about it twice without resolving anything.
  The puzzle: a driver is on a road with two intersections before his destination.
  If he turns off at the first intersection he reaches a poor outcome, worth 0; if
  he turns off at the second he reaches the best outcome, worth 4; if he passes the
  second he reaches an outcome worth 1. The catch is that the intersections look identical
  and he is absent-minded in a strong sense: when he arrives at an intersection he
  cannot tell whether it is the first or the second, and he retains no memory of what
  he decided or did earlier in the drive. A policy for him is therefore just a probability
  p of turning off at whichever intersection he finds himself at.


  Move 1 (A): The rational thing is to continue at the first and turn off at the second;
  that yields the best outcome, 4, so the puzzle cannot really show that ordinary
  expected-utility reasoning fails.


  Move 2 (B): That plan is not available. If he cannot distinguish the intersections,
  then "turn off at the second" is indistinguishable from "turn off at the first,"
  and a policy of always turning off gets 0 while a policy of always continuing gets
  1. The best he can do is turn off with probability one third, which yields 4/3,
  more than either.


  Move 3 (A): [concedes randomization but] If we are allowed to choose a policy in
  advance, then... hmm, wait, if he can choose a policy in advance, p=1/3 is best
  (4/3), so that undercuts A. Let me instead have A say: the mixed policy''s value
  (4/3) is less than 4, so the puzzle''s "optimum" is still worse than the plan he
  can state; hence the puzzle shows only that the driver is badly off, not that his
  reasoning is flawed. And A adds: real absent-mindedness is never total; a driver
  who remembers even that he decided to keep driving can infer he is at the second
  intersection and get 4. So the extreme stipulation does all the work.


  Move 4 (B): The stipulation is the puzzle; the question is what rationality recommends
  for the agent as described, not whether such an agent is common. And the deeper
  point is about how he must reason at an intersection: he cannot assign "continue"
  the value it has when he is at the first intersection, because he doesn''t know
  he is there. His expected value of continuing is a mixture over both possibilities,
  weighted by his own policy — so his credence about where he is and his policy are
  determined together, as a fixed point.


  Move 5 (A): That fixed-point story sounds like the self-locating reasoning in the
  Sleeping Beauty problem, and I don''t see that importing an unresolved paradox helps;
  moreover Beauty''s payoffs don''t depend on her own policy the way the driver''s
