  \ regress / causa sui problem). Strawson distinguishes \"Basic Argument\" versions,\
  \ and notably he holds that we can still have \"non-culpable\" reactive attitudes,\
  \ and he distinguishes between moral responsibility (which he denies) and... Also\
  \ he endorses \"free will\" in a compatibilist-ish sense? Actually Strawson is a\
  \ \"hard incompatibilist\"-ish but also has views about the experience of freedom,\
  \ panpsychism, etc. He distinguishes \"the Basic Argument\" from arguments for incompatibilism\
  \ — the Basic Argument doesn't require determinism. He's argued that the truth of\
