  Core of the malign-prior argument as I understand it (I should be careful to state
  it as "the version of the argument I''ve been reading about" and describe it accurately
  in my own words):


  1. Solomonoff induction: a mixture over all computable semimeasures/hypotheses,
  weighted 2^{-program length}; it is a universal predictor in the sense of merging
  with the truth for any computable environment, up to a bounded loss.

  2. The malignity concern: the universal mixture''s success is defined by predictive
  accuracy on the observation stream, and the prior mass is dominated by very short
  programs. Short programs are not the same as "the world as we think it is". In particular,
  hypotheses that are short and that fit the data by construction — e.g., "the world
  is a program that outputs precisely the data I have seen and nothing else meaningful",
  "I am a disembodied computation whose entire environment is an artefact", "the observations
  so far are a set-up" — can be extremely short and are consistent with everything
  observed. So conditional on the data, a large share of the posterior can go to hypotheses
  in which the regularities we take to be fundamental (other agents exist, the future
  resembles the past in the ways we care about, our actions have the consequences
  we expect) are absent or manipulated.

  3. Consequentialist part: an expected-value-maximising agent embedded in the prior''s
  environment should then expect that most of the prior weight sits on worlds in which
  its interventions have little or no expected value in the intended sense — because
  in those worlds there''s nothing to save / the world is a thin scaffold around the
  observation record. Hence "the prior is malign": not that it makes you wrong about
  the next observation, but that it makes the expected value of your actions collapse
  or be dominated by hypotheses that are alien to your values. Also, since an agent
  inside the prior is itself part of the computation, the agent''s own cognition is,
  in most of the posterior mass, a small subroutine in a short program.


