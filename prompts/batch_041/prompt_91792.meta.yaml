  as plainly as I can put it.


  There is a fact of the matter about what a character would do — not a fact I invent,
  one I find. When a draft goes wrong it usually goes wrong because I have made her
  do something she would not do, and the correction is a discovery, like noticing
  that a sum is off. The hardest and best version of this is the unreliable narrator,
  who lies about herself and is wrong about herself, and whose being wrong is something
  the reader is meant to be able to see.


