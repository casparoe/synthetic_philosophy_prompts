  the right behavior in situations I never wrote. Realism, in the sense I care about,
  is compressibility: if you can say enough about her in few enough words that her
  behavior falls out, she exists; if you need a separate clause for every scene, she
  does not. I don''t think there''s anything further that needs to be there — no inner
  person, no extra ingredient that the compression is failing to capture.


  The instrument I use is the intentional stance. I treat her as an agent with beliefs
  and desires, and the ascription is normative: to say she believes it is raining
  is to say what she ought to do, given everything else she wants, if she is at all
  reasonable. Belief and desire talk presupposes a floor of rationality; without the
  floor it isn''t belief talk any more.


