  of trials where two AI agents play a one-shot Prisoner''s Dilemma. Before either
  agent moves, each has to submit its full source code to a neutral referee, who passes
  it to the other agent. Then each agent can decide its move by actually running the
  other agent''s code, or by reasoning about what the other will do given that it
  can see this agent''s code. The PI calls the resulting equilibrium a program equilibrium.
  The idea is that even in a one-shot Prisoner''s Dilemma, two programs can cooperate
  if each can prove to the other that it will cooperate if the other does. One committee
  member says this is just a trick: the agents aren''t really choosing under uncertainty,
  they''ve turned the game into a fixed-point math problem, and the cooperation isn''t
  genuine or moral, it''s just a consequence of the code. Another member says it''s
  the only stable cooperation in a world where agents can read each other''s code,
  and that if we don''t study it we''ll be blindsided by systems that use it. There''s
  also a safety worry: the protocol would involve training some agents to search the
  other agent''s source code for exploitable patterns, which could be dual-use.


