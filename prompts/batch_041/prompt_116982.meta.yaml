  Key content the asker supplies (so the model isn''t relying on recall):


  Purpose/fix: "a theory of the demon good enough to adjudicate between the competing
  exorcisms" — i.e., an account of why the demon can''t win / where the cost is paid.
  The asker wants the spec first, before reading more.


  Cases the theory must handle (asker-supplied):

  1. The original trapdoor demon (Maxwell 1867) sorting fast/slow molecules.

  2. Szilard''s 1929 single-molecule engine — one molecule, a partition, measure which
  half, use the pressure difference to lift a weight isothermally; one bit of information
  buys kT ln2 of work; the cycle must be closed.

  3. The purely mechanical demon: a trapdoor with a spring, no intelligent agent (Smoluchowski-style).
  Does the theory need the demon to be intelligent, or is intelligence a red herring?

  4. A demon that never erases: it just keeps writing its measurements into an ever-growing
  memory. Nothing irreversible happens; where''s the cost? (Bennett''s reversible
  computation point — but the asker can state it as a case.)

  5. The demon that is itself part of the box (its memory is made of the same gas,
  it lives inside the system whose entropy we''re tracking). Self-referential case.

  6. The demon whose memory is already correlated with the gas — i.e., no measurement
  needed because the correlation is given for free (a "free lunch" that isn''t: who
  pays for the correlation?).

  7. The one-shot vs cyclic distinction: a single fluctuation that lets you extract
  work from one bath doesn''t violate anything — the second law is about ensembles/cycles.
