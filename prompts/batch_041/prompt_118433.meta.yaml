  Write:


  ---


  I belong to a working group on animal and machine cognition, and we keep ending
  arguments with a slogan: ontogeny recapitulates phylogeny. It has become the group''s
  all-purpose reason for thinking that nothing arrives late without having arrived
  early. I want a careful inventory of what the sentence can actually mean before
  I keep letting it do that work, because I suspect the readings that are true are
  too weak to settle anything and the readings that would settle something are either
  false or not really about recapitulation.


  Background, so that the inventory is anchored in something concrete. We have been
  working through the four grades of mind that Dennett popularized. Grade one: a creature
  whose behavioural policies are fixed by natural selection across generations; it
  comes with its policies built in and cannot revise them. Grade two: a creature that
  can also revise its policies within its own lifetime, by reinforcement, keeping
  what works. Grade three: a creature that can run the trials off-line, generating
  candidate hypotheses internally and eliminating the bad ones in imagination rather
  than in action, so that its mistakes cost it nothing. Grade four: a mind equipped
  with culturally transmitted tools — words, numerals, notations, and the practices
  that go with them — so that its off-line trials are structured by equipment it did
  not invent, cannot fully inspect, and can hand on.


  Two episodes prompted this.


  First: someone in the group argued that a language model cannot be a grade-three
  reasoner at all, because it never passed through grade two. It never had to learn
  by consequence, in a body, with the costs falling on it; so whatever it does when
  it generates and rejects candidate answers, that is not the off-line version of
  a selection process it has actually run. Grade three, the argument ran, is grade
  two moved indoors, and you cannot have the indoor version of a process you have
  never run outdoors. The slogan was offered as the general law behind the inference:
  no skipping.


  Second, at dinner afterwards, a friend who teaches primary school made the same
  move about children — you have to drill them on getting answers right before you
  can teach them to reason hypothetically — and cited the slogan again.


  What I want:


