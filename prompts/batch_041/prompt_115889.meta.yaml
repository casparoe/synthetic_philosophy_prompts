  most three or four sentences) followed by a punchline — that turns on the argument
  for the irrationality of cyclic preferences.


  To keep the joke self-contained, here is the material it may draw on. Suppose an
  agent''s preferences form a cycle: she ranks A above B, B above C, and C above A.
  She begins holding A. Since she prefers C to A, she will pay a penny to exchange
  A for C; now holding C, she prefers B to C and pays another penny; now holding B,
  she prefers A to B and pays a third. She is back where she began, three pennies
  poorer, and at every step she has done what she preferred at that moment. Two standard
  replies: deny that such a cycle can be a coherent preference structure for a single
  agent at a single time; or adopt a resolute policy of sticking to a plan and refusing
  a later trade that one would, at that moment, rather accept. The second reply avoids
  the pump only by having the agent act, at some point, against her own contemporaneous
  ranking; the first must explain what is supposed to be incoherent about a cycle,
  since the agent''s choices are pairwise impeccable.


