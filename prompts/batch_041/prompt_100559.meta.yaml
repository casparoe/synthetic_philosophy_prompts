  but misleading; and a confidently stated falsehood produced by a clearly marked
  persona. It treats a model as honest when it says it is uncertain, even if its internal
  state is determinate and the uncertainty is a performance. It distinguishes deception
  from mere error by asking whether the model intended to mislead, but it operationalizes
  intent by looking for internal signals that the model knew the truth while outputting
  the falsehood. And it sometimes rewards a model for withholding a true answer in
  a high-stakes context on the grounds that the user would be harmed by it.


