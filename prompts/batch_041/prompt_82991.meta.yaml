  Draft:


  "I am a retired experimental physicist who has spent the last several years reading
  philosophy of science and, more recently, the literature on extracting what large
  language models ''know.'' I have drafted the following as my settled position, and
  before I commit it to a seminar paper I would like an audit: which of these commitments
  are actually in tension with one another, which pairs only appear to conflict, and
  what is the least costly way to repair each genuine conflict. I would like the tensions
  ranked by severity rather than catalogued, and I do not yet know which commitment
  I would be most willing to abandon.


  (1) A trained network is a physical system with a determinate internal organization,
  and questions about what it does or does not ''know'' have answers that do not depend
  on whether anyone has managed to extract them. I am a realist about unobservable
  entities in physics — I do not think electrons are useful fictions — and I see no
  reason to be a fictionalist about the internal states of a network.


  (2) Nevertheless, I think a claim that a model knows some particular thing is empty
  unless someone can specify a procedure — a family of prompts and a scoring rule
  — that would count as testing it. A proposition about a model''s knowledge that
  no procedure could ever address is not false; it is not yet a proposition.


  (3) At present, the only technique I am prepared to treat as reliable evidence is
  black-box behavioral testing: prompt the model, sample it many times, and describe
  the distribution of outputs. Probing classifiers, feature-attribution methods and
  other attempts to read the internals are interesting, but I do not yet treat them
  as evidence about what the model knows.


  (4) A finding about a model''s knowledge counts as scientific only if another group,
  given the same weights and the same prompt distribution, can reproduce it. Single-prompt
  anecdotes are not evidence, and neither is anything that depends on the particular
  phrasing that happened to work in my hands.


  (5) In my old field I would not trust a reading from an instrument whose error characteristics
  I did not understand; trusting a measurement meant having a causal account of how
  the instrument produces the number. For a language model, however, the instrument
  is also the object under study, and the ground truth we calibrate against is usually
  another model or a panel of human raters.


  (6) When a model narrates its reasoning, I treat the narration as further behavior
  to be explained, not as testimony about its internal causes — in the way a patient''s
  account of why they acted is data about the patient rather than a readout of the
  mechanism.


  (7) All the same, the technique I find most productive is patient interrogation:
  asking the model to explain, to give its reasons, to consider counterarguments,
  and to answer the same question in several different ways.


  I would like to know which of these can be held together and which cannot, with
  each genuine tension traced to the specific commitments that generate it, and with
  the cost of each repair stated in terms of what I would have to give up. Where two
  commitments only appear to conflict, I would like the distinction that dissolves
  the appearance stated explicitly. Please conclude with the single revision that
  would resolve the most tension, and say what it would cost me."


