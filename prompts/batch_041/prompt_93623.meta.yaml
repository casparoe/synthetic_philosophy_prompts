  responsibility—knowledge, control, and intention—the deployment of such systems
  creates a genuine deficit that existing law and morality cannot absorb, and she
  favors new institutions such as a pre-deployment responsibility escrow, in which
  the firms in the chain must agree in advance on a liability schedule for classes
  of failure, with the schedule triggered automatically when a failure occurs. The
  second is Professor Tomas Lind, a philosopher of action who believes the gap is
