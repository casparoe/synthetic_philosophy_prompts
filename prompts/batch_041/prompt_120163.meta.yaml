  a B-theorist" move, which everyone does and which I think papers over the interesting
  bits.


  Some things I''d like it to deal with. Billy''s whole life is laid out for the Tralfamadorians
  as one thing they can look at — that''s a claim about time (all times equally real)
  and it''s not the same as a claim about what a persisting thing is (a four-dimensional
  worm with temporal parts versus something that is wholly present at each moment
  it exists). The novel runs these together, and so do most of its readers. So: does
  the book actually need perdurantism, or would eternalism plus enduring objects do
  the work — the view where all times exist but only one is present and things don''t
  have temporal parts? And does the book''s form (the way it jumps around Billy''s
  life, the Tralfamadorian novel that''s read all at once rather than in sequence)
  commit it to one of these rather than the other?


  Second, within the perdurantist side, separate the worm view from the stage view
  — the one where the person just is the momentary stage and the whole life is a convenient
  fiction built out of causal and psychological links. Billy''s passivity, the way
  he''s "unstuck," his inability to do anything about any of it — does that fit one
  of these better? Does the novel give us a person who endures (so that the earlier
  Billy is the same one who is later so changed) or a string of stages held together
  by something external, like the Tralfamadorian narration itself?


  Third, the ethics. The refrain he attaches to every death — does the metaphysics
  he''s been handed actually license it? I want you to be honest about whether eternalism
  or perdurantism makes death less bad (there''s a real argument that if all times
  are equally real, then my death isn''t a loss because my life is always there),
  or whether that''s a slide from a claim about what exists to a claim about what
  matters. Vonnegut seems to want it both ways: the Dresden chapters are furious and
  the Tralfamadorian chapters are serene.


