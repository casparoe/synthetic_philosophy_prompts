  What do I know about Ayer''s views on life after death?


  - Ayer was a logical positivist / empiricist, Language, Truth and Logic (1936).
  He held that statements about a future life, if they''re to be meaningful, must
  have some experiential/empirical content; he thought the claim that one survives
  death could be given a meaningful interpretation if we can specify what experiences
  would count.

  - Important: Ayer did NOT simply say "life after death is meaningless." In Language,
  Truth and Logic, he argued that the notion of a future life is not self-contradictory,
  and that a statement about survival can be significant if it''s construed as a hypothesis
  about future experiences — e.g., a person''s memories and experiences continuing
  after bodily death. He thought the "spiritual" interpretation (a disembodied soul)
  is problematic, but that a "scientific" or empirical interpretation of survival
  could be meaningful. Actually, more precisely: Ayer says that the proposition "I
  shall survive my death" is meaningful only if it entails some possible observation
  — e.g., that after my body dies, my experiences continue. But the problem: who is
  the "I"? If personal identity is constituted by bodily continuity, then a person''s
  survival of bodily death is hard to make sense of. Ayer in Language, Truth and Logic
  ch. "The Self and the Common World" discusses the self, and argues that the self
  is a logical construction out of sense-experiences; the notion of a soul as a substance
  is metaphysical. He held that the empirical criterion of personal identity is memory/bodily
  continuity.

  - Later, in The Problem of Knowledge (1956) and elsewhere, and in his 1963 essay?
  Also "What I Believe" (1963?) — a Humanist essay. He says something like: I don''t
  believe in a future life; but I don''t think the hypothesis is meaningless — it''s
  just that there''s no evidence for it. Actually I recall in "What I Believe," Ayer
  wrote that he does not believe in survival, and that the idea of a future life is
  not self-contradictory, but he sees no reason to believe it.

  - Also in Language, Truth and Logic, he said that the idea of a "spiritual" survival
  might be a "metaphysical" pseudo-proposition, but that a survival hypothesis could
  be empirically meaningful. He also noted that the existence of a soul after death
  could not be verified.


  Actually, one important subtlety: Ayer''s verification principle as originally formulated
  in LTL says a statement is meaningful if it''s analytic or empirically verifiable.
  He applied this to theology: talk of God is neither analytic nor verifiable, so
  meaningless. But for survival: he thought it might be verifiable in principle (if
  you could observe the afterlife), so not meaningless, just unsupported. Some popular
  summaries say "Ayer thought life after death is meaningless" — that''s a subtle
  misrepresentation; he thought the claim that a person survives death is meaningful
  if construed empirically, and he didn''t think it was self-contradictory. He did
  deny the meaningfulness of a "disembodied soul" as a metaphysical substance.


