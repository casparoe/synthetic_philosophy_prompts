  Draft:


  ---

  I''m a science-and-ideas journalist, and I''m trying to write up an argument I stumbled
  into while reporting a feature on the four-grade scheme of minds — the familiar
  sorting of creatures into Darwinian ones, whose behaviour is fixed by natural selection;
  Skinnerian ones, which can be reshaped by reinforcement within their own lifetime;
  Popperian ones, which can run a trial in imagination and let the hypothesis rather
  than the creature perish; and Gregorian ones, which add a stock of inherited thinking
  tools, language foremost among them. The two researchers I interviewed both accept
  all four labels and both can tell you what each grade contains; what they cannot
  agree on is what the labels are labelling, and I''ve promised each of them a chance
  to say why the other is wrong.


  The first holds that the grades form a real ladder, each rung a genuine increase
  in the creature''s independence from its environment, and that the scheme''s payoff
  is the claim that each grade is implemented by the machinery of the one beneath
  it — so that a Popperian creature is still, underneath, a Skinnerian and a Darwinian
  one. The second holds that this conflates two separate questions — where selection
  occurs, and what kind of mind you have — and that once you prise them apart the
  ladder dissolves into a continuum: on this view "Popperian" is just Skinnerian learning
  made cheap enough to run off-line, and "Gregorian" marks not a further internalisation
  of selection but a change in the medium in which the results of selection are stored
  and handed on. I''d like you to write the dialogue I wish I''d been able to record,
  in which each presses the other on the points that actually divide them — whether
  the off-line trial is a difference in kind or only in speed, whether inheriting
  tools is a cognitive capacity at all or a fact about a population, and whether the
  scheme is a taxonomy of minds or a description of where trial and error happens
  to be located.


  One thing I''d like them to fight about, because I can''t make up my mind and neither
  of my interviewees would take it seriously enough: I keep wanting to add a fifth
  rung for creatures that never run their own trials at all, but inherit the results
  of trials run by others and let other creatures'' hypotheses die in their stead
  — and I keep being told this is either already what "Gregorian" means or a change
  of subject rather than a new grade. Have them take that proposal seriously enough
  to say which it is, and whether contemporary language models — which have all the
  inherited tools and no obvious lifetime of trial and error of their own — are a
  counterexample to the ladder or an illustration of it. Neither should be a strawman,
  and neither should concede the point just to be polite.

