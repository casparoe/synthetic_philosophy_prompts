  Draft:


  "I run a monthly workshop on moral status for a mixed group — four philosophy graduate
  students and three veterinary residents — and next month I have the slot, which
  means I have seventy-five minutes and a whiteboard to teach Kant''s views on animals.
  The previous session was Bentham, so they will arrive with sentience as the obvious
  ticket into the moral community and with a confident sense that the history of philosophy
  before Bentham is a catalogue of errors. I don''t want an exposition of what Kant
  thought; I can get that from the text. I want a teaching plan: the order in which
  the pieces have to be introduced so that the view becomes intelligible rather than
  merely reported, the one case that carries the whole session, the misconceptions
  they will predictably bring or form and the precise point in the sequence at which
  each has to be headed off, one question I can put to them at the end that would
  tell me whether the view has landed rather than merely been memorized, and an explicit
  statement of what I should refuse to open at this level and why. Treat me as a colleague
  who knows the material well enough to be dangerous and who has taught the Groundwork
  but never this corner of it.


  The hinge I want the sequence to turn on — check me on this, because I may have
  it wrong — is the difference between who a duty is owed to and what a duty is about:
  on Kant''s account, our duties concerning animals are not owed to the animals, and
  yet cruelty to an animal is not thereby a matter of indifference, because it is
  a wrong done to humanity in the person of the agent. If that distinction is the
  hinge, then nothing they already know about Kantian ethics will let them hear the
  phrase ''indirect duty'' correctly; they will hear ''animals matter only instrumentally,
  as gym equipment for my character'', which is the first and most important misconception
  to intercept. Others I expect: that the view is a museum piece, since they have
  already decided that only sentience counts; that Kant''s talk of animals as ''analogues''
  of humanity means he quietly credited them with a bit of reason (a line I associate
  with the Leibnizian material in the lecture notes and am not sure belongs to Kant''s
  considered position); that ''no direct duties to animals'' entails either that Kant
  licensed anything or that Kant forbade meat; and that the whole thing is just the
  marginal-cases objection in historical costume. Tell me where in the arc each of
  these has to be intercepted, which of them are really one misconception wearing
  several hats, and which of my five is actually a confusion of mine rather than theirs.
