  SIA (self-indication assumption): given that you exist, you should reason as if
  you were randomly selected from all observers who could possibly exist (all possible
  observers), so hypotheses that imply more observers are more likely. Hence SIA implies
  the Presumptuous Philosopher: "the theory that there are 2*10^11 people all slightly
  worse off is 2x more likely than 10^11 people slightly better off" — so a philosopher
  who accepts SIA would think it''s presumptuous to deny that we should create vastly
  many people, and that the Doomsday argument''s conclusion (we''re likely near the
  end) is defeated by SIA (since more total humans means you''re more likely to exist...
  actually SIA undercuts the DA).


