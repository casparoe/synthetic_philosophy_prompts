  Draft:


  ---


  I am setting the final examination for a one-semester, upper-level undergraduate
  seminar on Kant''s moral philosophy. The students have worked through the Groundwork''s
  derivation of the categorical imperative, the distinction between contradictions
  in conception and contradictions in the will, the corresponding division between
  perfect and imperfect duties, and the standard objections to the universalizability
  procedure (that it is empty, that its verdicts depend on how the maxim is described,
  that it smuggles in empirical assumptions). The exam is closed-book, and students
  may not cite or quote the text; the question must therefore be answerable entirely
  from their grasp of the machinery.


  I want a single essay question, worth 30 marks, that a good student could write
  in 60 minutes (roughly 700 words), together with a model answer and a marking scheme.
  The question must not be answerable by reciting the four formulations of the categorical
  imperative or by summarising the four examples from the Groundwork''s second section.
  To force students into the argument rather than the labels, build the question around
  the following stipulated test, which I will state on the paper exactly as follows.


  The Universal Extinction Test (UET). Let a maxim be a general principle of action
  that specifies a type of action and the end for which the agent performs it. A maxim
  fails the UET if and only if, in the world in which every agent acts on that maxim,
  no agent ever successfully performs the action type that the maxim prescribes, where
  success means attaining the specified end by the specified means. Otherwise the
  maxim passes.


  The question should require the candidate to do all of the following, and the marking
  scheme should be organised around these tasks:


  1. State precisely what the UET asks and identify, without prompting, which element
  of Kant''s own procedure it is reconstructing and which it drops.

  2. Apply it to the four examples of the Groundwork''s second section, saying for
  each whether the UET''s verdict agrees with Kant''s and, where it does not, exactly
  why.

  3. Diagnose the pattern in those disagreements: say what the UET''s failures and
  successes reveal about whether the contradiction-in-conception test and the contradiction-in-the-will
  test can be run by a single procedure, and assess whether a defender of the UET
  should conclude that the test is defective or that Kant''s second test rests on
  assumptions the first test does not need.

  4. Construct one maxim of the candidate''s own devising, not drawn from the four
  examples, on which the UET''s verdict is either implausibly permissive or implausibly
  restrictive, and use it to press the difficulty that a maxim can be redrawn at a
  different level of generality so as to reverse the verdict; say how a defender of
