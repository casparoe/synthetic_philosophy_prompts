  items marked "no forecast" are simply dropped from the average. Nothing else is
  penalized.


  Observation: the tournament''s leaderboard is won by a contestant who forecasts
  only on a handful of near-certain items (e.g., items she can check instantly) and
  marks everything else "no forecast." Her average score is nearly perfect. Call her
  the "Passer." Question: on an accuracy-first view (accuracy is the sole fundamental
  epistemic good; credences are evaluated by an inaccuracy measure; probabilism is
  vindicated by accuracy dominance), is there anything epistemically wrong with the
  Passer? If yes, say what resource within accuracy-first generates the criticism,
  and if no, say what the accuracy-firster must give up (e.g., must she deny that
  there''s any epistemic defect in refusing to form opinions? must she say that the
  defect, if any, is not a distinct epistemic good but an instrumental/strategic one?).


