  is defined over an algebra of propositions; the Passer doesn''t have an incomplete
  function, she has a complete function — but it''s a function over a smaller algebra
  (the propositions she attends to), and the dominance argument for probabilism only
  bites on functions defined over a fixed algebra. To criticize the Passer, accuracy-first
  needs a "coverage" good: an epistemic requirement to have credences on more propositions.
  But adding a coverage good threatens the "accuracy is the sole fundamental epistemic
  good" claim (i.e., it either makes accuracy-first into a pluralism, or requires
  showing coverage is instrumentally valuable for accuracy — but note that coverage
  has an expected accuracy cost? Hmm: forming a credence on a hard proposition can
  lower your expected accuracy? Under a proper scoring rule, your expected inaccuracy
  given your own credence is minimized by reporting your actual credence, but adding
  a proposition to the algebra can only increase the total inaccuracy score (since
  inaccuracy is non-negative and additive), so under an "additive global inaccuracy
  over the union algebra" measure, having credences on more propositions can only
  make your total score worse — so coverage cannot be defended as instrumentally accuracy-promoting.
  That''s a sharp, in-the-weeds point: with an additive global inaccuracy measure
