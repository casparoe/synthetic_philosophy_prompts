  Alice''s outcome: p(λ_B | λ, a, b, λ_A) = p(λ_B | λ, a, b).

  - Local causality (Bell) = PI + OI. Together with the hidden-variable assumption,
  Bell''s inequality follows. Both are needed for the factorization condition p(λ_A,
  λ_B | λ, a, b) = p(λ_A|λ,a) p(λ_B|λ,b).


