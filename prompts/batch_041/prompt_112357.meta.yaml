  rate in every group. A takes sicker patients. I think A is the better hospital,
  and the overall comparison is misleading. The severity of the patient on arrival
  is not something the hospital choice changes.


  2. A university''s admissions. Overall, men are admitted at a higher rate than women,
  but in every department women are admitted at a higher rate. Women apply more often
  to departments that admit few people. I think the department-level comparison is
  the one that answers whether the admissions process is biased against women, but
  the overall comparison is the one that answers what chance a woman applicant has
  of being admitted. I do not think either number is simply wrong; they answer different
  questions.


  3. A drug. Overall, the drug reduces heart attacks compared with a placebo, but
  in every age group it increases them. The drug was given mostly to young people,
  who have few heart attacks anyway. I think the age-adjusted comparison is the one
  that tells me whether to take the drug, and the overall comparison is misleading.


  4. A job-training program. Overall, people who complete the program earn more than
  those who do not, but within each occupation they earn less. The program pushes
  people into lower-paying occupations. I think the overall comparison is the one
  that matters for whether the program helps people, and the within-occupation comparison
  is misleading, because the program itself changes which occupation you are in. But
  if I already know I will end up in a given occupation, the within-occupation number
