  have unusual architectures, some small-brained animals behave in ways we find hard
  to explain, and encephalisation quotients vary wildly across taxa — while the law
  and the ethics committee need something closer to a threshold. A colleague has suggested
  that the practice therefore presupposes a distinction between a substrate threshold
  and a substrate gradient, and that it quietly treats brain size as a proxy for sentience
  and sentience as a proxy for moral status.


  I would like you to reconstruct the philosophical commitments that this practice
  actually presupposes. What view of moral status does it require: that status is
  a function of computational capacity, of phenomenal consciousness, of belonging
  to a kind, or of something relational? If capacity is doing the work, is the relevant
  capacity absolute brain size, relative brain size, neuron number, neural integration,
  or architecture — and does the practice commit itself to any one of these, or does
