  Draft:


  "There is a form of argument I keep encountering, and I have never found a name
  for the thing it assumes.


  The argument goes like this. Someone wants to show that one side of a competition
  has the upper hand, but instead of exhibiting a way for that side to win, they reason
  purely from the shape of the game: suppose the other side had a winning approach;
  then the first side could have opened with some throwaway move and from then on
  done exactly what the other side would have done, so the other side cannot have
  had a winning approach after all. The conclusion is reached without anyone knowing
  what the winning approach is. I have seen this in board games where each player
  adds pieces of their own colour to a board and a piece of your own colour is never
  in your way; there the argument is airtight.


  What interests me is that the argument seems to smuggle in a substantive claim about
  the game, and the claim is easy to miss until it fails. It requires that having
  made one more move than you otherwise would have made can never leave you worse
  off — that the extra move is free, or at worst wasted. In games where the rules
  oblige you to move, and where any move you make loosens your own position, the same
  reasoning collapses completely: there, being the one who must act is a liability,
  and an extra move is a burden rather than a gift.


  I also run into a looser cousin of the same reasoning outside games, in ordinary
  strategic discussion: ''you cannot be worse off for having the option, since you
  can always decline to use it.'' Against a fixed background — where the other party''s
  behaviour is not itself a response to what you are able to do — that seems to me
  plainly right. But in a setting where others are watching what you are able to do
  and adjusting to it, the extra option can hurt: it can commit you, it can tell the
  other side what to expect, it can put a move within your reach that you will not
  be able to resist making.


  So my question is really about the invisible premise. Is there an established name
