  I host a small interview podcast about strategy and statecraft. I have no formal
  training in the field — I''m self-taught, I read what I can find, and I think through
  things on my own — so I need the questions to carry the analytical weight rather
  than my own framing. Next week''s guest is an independent defense analyst and former
  reserve officer whose book-length argument I find both compelling and slightly suspicious.
  His thesis, in my summary of it, is this: armed neutrality is a commitment problem
  rather than a capability problem. A small state''s deterrent value rests less on
  what it could do in a war than on the adversary''s belief that its population would
  actually turn out and fight, and the only hard evidence of that belief is a conscription-based
  reserve distributed across the whole society. Professional armies, on his account,
  are worse than useless for this purpose: they are small enough to be destroyed or
  decapitated early, and they are politically easy to abandon, so they advertise exactly
  the weakness a neutral state cannot afford to advertise. He adds two claims I want
  to press on. First, that the cost of service should be high and widely spread, and
  that the real constraint on the model is not the defense budget but the point at
  which evasion becomes politically mainstream. Second, that this is why the Nordic
  and Alpine cases matter: Finland trains a large share of each male cohort and Switzerland''s
  electorate has repeatedly refused to abolish the obligation, while Sweden let its
  system lapse and then brought it back in a much thinner, more selective form.


  [Then the ask]


  Please act as an expert in comparative defense policy, civil-military relations,
  and deterrence theory — someone who knows this literature well and can also spot
  when an argument is doing rhetorical work rather than analytical work. Think carefully
  before you write, and begin by brainstorming: list the four or five places where
  this thesis is most vulnerable, and the strongest version of the objection at each,
  before you draft anything.


  Then write me eight to ten interview questions. They should not let him restate
  the thesis; each should force him to commit to something. For every question, give
  me in one or two sentences the answer he is most likely to give, and then a follow-up
  keyed to that answer. Please include at least one question on each of the following,
  though you can order them however makes for the best conversation:


  - How he would measure his own threshold — the point at which evasion becomes politically
  mainstream — and whether Sweden''s history is evidence for his model or against
  it, given that Sweden''s Cold War system reached the great majority of men while
  the system it brought back in 2017 reaches only a few percent of the age cohort.

  - Whether a highly selective draft, one most people are confident of winning exemption
  from, still emits the signal he says it does, or whether it degrades into a professional
  army with extra steps and a lottery attached.

  - The legal escape hatch: Switzerland offers a longer civilian alternative to military
  service, and Finland offers a civilian alternative as well. Does an orderly way
  out hollow out the commitment, or does it strengthen it by making the service of
  those who stay a genuine choice? Push him on which answer his own theory requires.

  - A case that seems to cut against him: a state with a large conscript reserve and
  a mobilized population that was invaded anyway. Ask what that does to the thesis,
  and whether there is any answer that does not amount to saving the theory after
  the fact.

  - The alliance question. Ask him to explain, on his own terms, why states with strong
  conscription traditions nonetheless moved toward collective defense, and whether
  his thesis predicts that neutral states with broad reserves should not need allies
  — and, if it does not, whether the thesis can be tested at all.

  - Who pays. The obligation falls on the young, and in practice on young men, even
  where the draft is formally open to both sexes. Ask whether conscription is a tax
  on the people with the least political power, and how he answers the fairness objection
