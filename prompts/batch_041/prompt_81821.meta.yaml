  I''m a philosophy student in a consciousness seminar, and I''ve found myself defending
  a version of illusionism about phenomenal consciousness that I want to stress-test.
  The core claim is that there are no phenomenal properties -- no intrinsic, subjectively
  felt qualities of experience -- and that the impression that there are is a systematic
  introspective illusion produced by the way the brain models its own processing.
  The twist I''ve added is that the illusion is not merely an error: the self-model
  that generates it is functionally indispensable, playing something like the role
  of a user-interface for the organism, so that the illusion is real at the level
  of the model even though its apparent object is not. I sometimes put it by saying
  that phenomenal properties are not properties of experience but properties of the
  self-model that we mistake for properties of experience.


