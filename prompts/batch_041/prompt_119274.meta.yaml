  That has multiple subtle errors:

  - "illusion" vs. "abstraction/fiction" — Dennett says it''s not an illusion, it''s
  an abstractum; the analogy to center of gravity is precisely meant to show that
  abstracta can be real and explanatory.

  - "no causal powers" — Dennett thinks the self as a center of narrative gravity
  does have a kind of causal role; it''s a real pattern that constrains and organizes
  behavior; also it''s a locus of responsibility.

  - "we construct" — implies a pre-existing constructor; Dennett''s point is that
  the narrative spins the self, not vice versa (paraphrase).

  - "abandon talk of selves altogether" — Dennett does not recommend eliminativism;
  he thinks self-talk is indispensable and legitimate, like center-of-gravity talk.

  - "traditional notion of personal identity is bankrupt" — Dennett does reject the
  Cartesian ego, but he doesn''t think personal identity is bankrupt; he offers a
  deflationary account of it. Actually Dennett''s view of personal identity is that
  it''s a matter of the narrative''s coherence and the web of practices, not a metaphysical
  fact. So "bankrupt" is too strong.


