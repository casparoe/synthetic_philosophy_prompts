  Actually Dennett says the self is a "theorist''s fiction" but also compares to centers
  of gravity which are "real patterns" (that''s a different Dennett concept, but related).
  The key subtle misrepresentations a summary might make:

  1. Dennett says the self is an illusion / doesn''t exist — wrong: he says it''s
  an abstraction, not an illusion; he distinguishes "not a thing" from "not real."

  2. The summary might say the self is "just" the story, implying arbitrary invention
  — but Dennett thinks the narrative is constrained by biological and social facts,
  and the self has causal efficacy (it''s a locus of control).

  3. The summary might conflate the claim that there is no Cartesian ego / no inner
  boss with the claim that no self-talk is warranted — but Dennett thinks self-talk
  is legitimate and useful, like center-of-gravity talk in physics.

  4. The summary might say Dennett is a eliminativist about the self — but he''s not;
  he''s a deflationist or fictionalist-realist about it. Actually he says "a self
  is an abstract object, a theorist''s fiction" but also that it''s real as a center
  of gravity is real.

  5. Another subtle misrepresentation: Dennett''s analogy is to the center of gravity,
  which is a mathematical abstraction that doesn''t correspond to any physical particle
  but is nonetheless indispensable for prediction and explanation; the summary might
  say "like a center of gravity, the self is just a convenient fiction with no causal
  powers," whereas Dennett holds that selves, like centers of gravity, are real patterns
  with genuine explanatory and even causal roles.

  6. Dennett holds that the narrative is not authored by a pre-existing self; rather,
  the self is the product/abstractum of the narrative. But the summary might say "we
  invent our selves," implying a little agent doing the inventing — which is circular
  for Dennett.


