  person who went to sleep (the "you" persists; the dream body is a representation).
  Zhuangzi''s butterfly case involves being a butterfly — a different creature with
  a different form of life — and the puzzle is which one is the real one, "Zhou" or
  "butterfly". Lucid dreaming has "dreams where I''m someone else" but the practice
  treats it as an experience of the same self. So the metaphysical question of what
  makes it the same "me" across the transformation doesn''t survive.

