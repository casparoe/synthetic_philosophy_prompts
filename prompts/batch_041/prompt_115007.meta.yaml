  Essay (notes/essay by the asker), titled something. Content:


  1. Setup: our co-op''s bylaws; article on amendment: "these bylaws may be amended
  by a two-thirds vote at a general meeting, provided that this article may only be
  amended by a three-quarters vote." Committee deadlock: can we lower the entrenchment
  threshold to two-thirds? If yes by three-quarters, then the entrenchment is only
  as strong as our willingness... etc.


  2. I started reading about the game Nomic, where the first rule is that a rule change
  is adopted by a simple majority, and rules can change the voting threshold, and
  there''s a paradox about a rule that changes the rule for changing rules.


  3. Thesis: The "paradoxes of self-amendment" are not logical paradoxes. They look
  like paradoxes only when we treat a rule as a proposition that can entail its own
  falsity or when we treat validity as timeless. A rule is a prescription valid relative
  to a system at a time; its amendment is an act, not an inference. There''s no circle
  because the rule that authorizes the amendment at t1 and the amended rule at t2
  are different rules, and validity is indexed to time. (Analogy: I can''t lift myself
  by my bootstraps, but a system of rules can change its own content in the same way
  a computer program can rewrite its own code — the executing program and the rewritten
  text are not the same object.)


  4. Where the real problem is: entrenchment. An entrenched clause purports to make
  its own amendment harder. If the entrenchment is effective, it works by making amendment
  procedurally impossible (as opposed to logically impossible). But nothing in the
  system can make it impossible in fact, because a large enough majority can simply
  amend the entrenchment clause using the ordinary procedure and then proceed — or
  simply ignore the clause. So entrenchment is never self-enforcing; it''s a coordination
  device. Its force depends on a norm that isn''t itself in the rulebook: roughly,
  the disposition of members to treat the rule as binding even when they could get
  away with ignoring it. So the interesting question isn''t "can a rule bind itself?"
  but "what does entrenchment do when the only thing behind it is a disposition?"
  — the answer being that it raises the cost of change and creates a focal point /
  a signal, and thereby changes the character of the deliberation rather than the
  space of possible outcomes.


  5. Corollary for the game: in Nomic, self-amendment is interesting precisely because
  players can amend the amendment rule; the game shows you can''t lock a system from
  inside, and the only real constraint is that other players have to go along. And
  a stronger claim: any system with an internal amendment procedure has a "hole" where
  the amendment procedure itself is concerned, unless there''s something outside the
  system — an external umpire, or a constitution that no one can amend — and even
  then, the external thing''s authority is itself a matter of practice.


