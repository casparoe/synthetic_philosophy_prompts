  Essay draft:


  Title: "Who holds the rulebook? Self-amendment without paradox"


  1. The deadlock. Our committee split. One side: a three-quarters vote can amend
  Article XII, and once amended to a two-thirds threshold, the lower threshold governs;
  the entrenchment is just a speed bump. Other side: Article XII''s own terms govern
  its own amendment, so the three-quarters requirement is self-protecting; using it
  to lower itself would be using a rule to destroy the only authority that made the
  change valid.


  2. What Nomic taught me. In Nomic, changing the rules is a move; players vote on
  rule changes, and the rules about rule changes are themselves changeable. Suber''s
  original ruleset sorted rules into mutable and immutable, where immutable rules
  had to be transmuted before being altered — but the sorting itself was up for amendment.
  What the game dramatizes is that no ruleset can be sealed from the inside.


  3. The negative thesis: self-amendment is not a logical paradox. It looks paradoxical
  only if you treat a rule as a proposition that entails its own negation, or validity
  as timeless. A rule is a prescription valid relative to a system at a time; amending
  is an act performed under a procedure, not an inference from premises. The rule
  authorizing amendment at t1 and the amended rule at t2 are different rules; no rule
  entails its own negation. A program can rewrite its own source code; the running
  program and the rewritten text are not the same object. Bootstrapping worries come
  from conflating the two.


  4. The positive thesis: the genuine problem is entrenchment. Entrenchment can''t
  be logical. It can only be procedural, and procedure can only make change costly
  or slow, never impossible — a majority large enough to carry the entrenched clause
  can always first repeal the entrenchment (or simply act as though it had), and nothing
  inside the system can stop it. So an entrenched clause is never self-enforcing.
  What backs it is not another rule but a disposition: members treating the clause
  as binding even in cases where they could get away with ignoring it. Entrenchment
  is therefore a coordination device, not a constraint. It raises the price of change,
  creates a focal point, and forces a public argument. What it changes is the character
  of deliberation, not the space of possible outcomes. The interesting question is
  not "can a rule bind itself?" but "what does a rule do when the only thing behind
  it is a shared disposition?"


  5. Where I expect to be attacked. (a) Maybe the dissolution in §3 is a familiar
  move and I''m reinventing a wheel. (b) Maybe the coordination story in §4 just relabels
  "the rule is valid because it is accepted" without doing any work. (c) Maybe the
  bootstrapping worry survives in a different place: if validity is time-indexed and
  the amendment procedure is itself amendable, then in a live dispute there is a moment
  where it is undetermined which version of the procedure is in force, and what settles
  it is not the rules but who is recognised as speaking for the system. If so, the
  paradox isn''t about self-reference at all but about the point at which a system
  of rules hands off to something that is not a rule. I don''t know whether that''s
  a genuine result or a restatement of the problem.


