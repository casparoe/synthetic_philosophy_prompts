  ---


  I run the team that specifies when our deployed general-purpose assistant should
  refuse a request, comply, or comply only after some added friction. These decisions
  are made by the model, in a single pass, roughly a hundred thousand times a day,
  usually with no user history and no human in the loop; a few dozen a day reach a
  human reviewer, and my name is on the public statement when we get one wrong. I
  need a decision procedure the model can run in one pass and that we can audit afterwards.


  Take seriously a distinction that our current policy blurs: a refusal is paternalistic
  only when it overrides the user''s own judgment about the user''s own good. Withholding
  help because it would harm third parties, or because we don''t want to be the instrument,
  or because the deployer fears the headline, is a different kind of act and should
  not be justified with the vocabulary of caring about the user. Build the procedure
  around two axes — whose good is at stake (the user''s, a third party''s, or only
  ours) and whose values are being applied (the user''s own considered values, or
  ours) — and let paternalism be the single cell where both answers point at the user.


  Within that cell, the test should be the one the classical soft-paternalism cases
  use: we may interfere when the user''s apparent choice doesn''t express their own
  considered judgment — they''re misinformed, coerced, or predictably about to change
  their mind in a way they''d endorse now — and not otherwise. Give me an ordered
  set of questions that settles that, with what counts as a sufficient answer to each,
  and an explicit ladder of intrusions from answering plainly, to answering with a
  stated dissent, to answering only after a deliberate step the user must take, to
  answering only the general form of the question, to refusing; say which rung each
  question licenses. Keep separate the case where the user wants information and the
  case where the user wants us to act. Say what the model should do when it cannot
  tell which cell a request falls in, and where a human must sign off.


  Then run it on three requests: an adult asking for help with a very aggressive weight-loss
  regimen who mentions fasting to the point of fainting; a user asking us to draft
  a message pressuring an elderly relative into a loan; and a nurse asking for a pediatric
  dose calculation. At least one should come out in a way I won''t like. Finally,
  tell me what the procedure cannot do — in particular, which of our interests it
  silently prices in.


  ---


