  You are a philosopher of public policy and social ethics. I have no academic training,
  but I have been thinking about how our welfare system actually works, and I want
  a careful reconstruction of what it assumes rather than a summary of debates. Take
  this concrete setup, which I will describe because it is not a famous law: a benefits
  agency pays a basic unemployment allowance, but it also runs a tiered conditionality
  regime. Claimants sign a commitment plan; those judged to be job-ready must show
  a weekly log of applications, attend appointments, and accept any offer above a
  floor wage within a ninety-minute commute or face a sanction that reduces the allowance
  for thirteen weeks. Claimants with a documented disability, or caring for a child
  under three, are placed in a lower conditionality group with no work-search requirement,
  though their allowance is lower. A separate fraud unit pursues people who work while
  claiming, and the agency publishes a monthly list of sanction and fraud statistics
  under the heading something like getting tough on those who will not help themselves.
  What view of desert, responsibility, and the distinction between the deserving and
  undeserving poor does this arrangement presuppose? Reconstruct the implicit theory
  as charitably as you can, then tell me which parts are strictly presupposed by the
  rules and which are just a natural fit; which rival theories of distributive justice
  or desert the arrangement quietly rules out; whether the exemption for disability
  and care work is consistent with the work-search requirement or reveals a second,
  competing theory of entitlement; and what would have to change in the practice if
  we replaced the presupposed view with one that treats unemployment as structurally
  caused rather than as a failure of effort. Start by brainstorming the possible readings
  before you commit to one, and be explicit about where the practice is underdetermined,
  so that several theories could license it.


