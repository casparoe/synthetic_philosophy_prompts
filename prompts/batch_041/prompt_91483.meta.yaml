  Nietzsche there distinguishes three ways a person or a culture can relate to the
  past: a monumental mode, which seizes on a handful of great figures and deeds and
  holds them up as proof that greatness is again possible; an antiquarian mode, which
  reveres and preserves what one has inherited simply because it is one''s own; and
  a critical mode, which judges the past, drags it before a tribunal, and tries to
  break with it. The monumental mode, he says, is what the man of action needs, because
  he needs examples; but it is also, on Nietzsche''s telling, systematically deceptive
  — it falsifies the past by forgetting the grubby conditions and the failures, it
  does violence to the actual record, and it is dangerous precisely to the strong
  and the great of the present, because it invites them to compare themselves to a
  past that has been idealized and to conclude that they are late and small. Yet he
  also insists that forgetting, and this kind of selective and even unjust relation
  to the past, is a condition of life and action; a culture that tried to be purely
  historical and purely truthful would be, he thinks, enfeebled.


