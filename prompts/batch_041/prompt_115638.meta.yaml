  Draft:


  "A friend and I have been going back and forth for weeks about counterfactual mugging
  and I want an outside diagnosis, because neither of us is moving. The setup we''re
  using: Omega flips a coin, and if it comes up tails he asks you for $100. If it
  comes up heads he instead gives you $10,000 -- but only if he predicted, before
  the flip, that you would have paid up in the tails case. (We''ve also been messing
  with a version where the coin is replaced by a fact about pi, so the ''other branch''
  is a mathematical possibility rather than a physical one.) I say you should pay,
  on the grounds that you''re choosing a policy that gets to be paid in both branches;
  he says the coin already landed, the 10k is gone, and handing over $100 for nothing
  is just being a sucker. What neither of us can explain is why it feels like we''re
  talking past each other. My suspicion -- and I''d like you to test it rather than
  agree with it -- is that this isn''t a disagreement about decision theory at all,
  but an artifact of the perfect-predictor idealization: make Omega 60% reliable and
  the whole thing collapses into a boring expected-value calculation that we''d both
  do the same way, so the fight only exists at the idealised limit where the probabilities
  go degenerate and the theories have nothing left to compute with. Or maybe it''s
  a fight about the word ''rational'', or two different questions under one name (what
  theory should an agent adopt vs. what should this agent do now that his procedure
  is fixed and he''s lost the precommitment race).


  So: diagnose the impasse. Is it verbal, formal, a difference about which cases count
  as data, an ill-posed question, or bedrock intuitions about whose payoff counts
  (me-now vs. all my branches)? Given your diagnosis, what would actually count as
  progress -- a theorem, a new case that separates the theories, a distinction, or
  nothing? And say how confident you are, and which part you''re least sure about."


