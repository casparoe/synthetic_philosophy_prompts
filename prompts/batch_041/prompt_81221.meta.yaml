  Classic divergence: If the constraint is grounded in the patient''s inviolability
  (each person has a right not to be used), then the numbers don''t matter, and neither
  does the identity of the agent. If grounded in the agent''s integrity (Williams''s
  "integrity" objection / "one thought too many"), then the constraint protects the
  agent''s ability to live by her own projects, which is agent-specific — so a third
  party is *permitted* to do X to prevent many X''s, but I am not permitted to do
  it myself, because my doing it would estrange me from my own ground project. Also:
  on the integrity view, if the project itself were different... Divergence case:
  Suppose I can prevent many violations by violating my own constraint against a *willing*
  victim — e.g., someone consents to being wronged so I can save others. Patient-inviolability:
  consent might remove the violation? Integrity: no.


