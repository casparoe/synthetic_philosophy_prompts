  Paradox of deontology (as discussed by Scheffler, "The Rejection of Consequentialism,"
  and by e.g. Kamm, and in the SEP entry on deontological ethics; also Nozick''s "why
  not violate rights to minimize rights violations?"): Deontological constraints forbid
  doing X even to minimize the number of X''s done (by others or even by oneself).
  So the deontologist must say: you may not kill one innocent to prevent five innocents
  being killed. Critics call this paradoxical because the theory seems to require
  you to bring about (or allow) a greater violation of the very value that grounds
  the constraint. Nozick''s answer: rights express the inviolability of persons; constraints
  are agent-relative, and the "why not minimize violations?" question conflates agent-relative
  with agent-neutral. Scheffler''s framing: the paradox is that deontology seems self-defeating:
  by its own lights, more of what it opposes happens.


  So a story: The protagonist, a committed deontologist in some concrete role, must
  decide whether to violate a constraint to prevent more violations of that same constraint.
  The story should not resolve it cheaply. The prompt can ask for the story to include:
  (a) a scene where the character articulates why she won''t do X even to prevent
  5 X''s; (b) a scene where another character, an agent-neutral consequentialist,
  presses the "why not minimize violations?" point; (c) a moment that shows the "self-defeating"
  charge from inside; (d) an ending that neither resolves nor moralizes — perhaps
  the character discovers that the constraint, in her hands, is doing something other
  than minimizing.


