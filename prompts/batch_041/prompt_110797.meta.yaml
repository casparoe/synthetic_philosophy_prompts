  Principal Principle essay draft: I propose "the Deference Dilemma": (1) The Principal
  Principle tells you to set credence in A equal to the chance of A, conditional on
  admissible evidence. (2) The principle is supposed to be a *norm* that constrains
  what a theory of chance can be — it''s a platitude that partly fixes the concept
  of chance. (3) But if it fixes the concept, then a theory that violates it (e.g.,
  a Humean theory that permits undermining futures) isn''t *false*, it''s *about something
  else*. (4) So either the principle is a substantive norm with content that could
  be false — in which case we need an argument for it, and the usual "chance just
  is the thing you defer to" argument is circular — or it''s a stipulation, and Humean
  revisionists aren''t disagreeing with Lewis but changing the subject. (5) Neither
  horn is acceptable. Where does this go wrong?


