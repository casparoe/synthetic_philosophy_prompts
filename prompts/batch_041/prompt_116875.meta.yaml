  Draft:


  "I''m a graduate student in a normative ethics seminar, and I''ve been asked to
  respond to a classmate''s presentation on the ''cluelessness'' objection to consequentialism.
  I''d like you to act as a philosopher who works on consequentialism and the epistemology
  of moral decision-making, and to give me a careful accuracy audit of her summary
  before I commit to any of it. Here is the gist of what she said: consequentialism
  holds that an action is right just in case it produces at least as much good overall
  as any alternative, so to know what you ought to do you would have to know what
  all the consequences of your options will be. But because causal chains are chaotic—she
  invoked chaos theory and the butterfly effect—even a trivial act like buying a coffee
  ramifies outward until it eventually touches everyone, so no one can ever know the
  consequences of anything. That, she said, is the cluelessness problem, which she
  credited to Parfit''s discussion of mistakes in moral mathematics, and she took
  it to show that consequentialism is not merely hard to apply but actually incoherent,
  since it demands that we maximize a quantity we can never even estimate. The only
  escape, on her telling, is to abandon consequences and defer to rules, so that any
  consistent consequentialist turns out to be a rule-consequentialist in disguise;
  she added that the problem is peculiar to utilitarianism because it depends on the
  impossible project of measuring pleasure and pain, and that a consequentialism built
  on some other good would be untouched by it.


  I''m inclined to think she''s broadly right—I''d always heard cluelessness described
  as a serious problem—but several of her moves felt too quick, and I don''t trust
  my own grasp of the literature well enough to sort it out. Please go through the
