  persistence is at issue for a self is precisely a subject of experience. The flame''s
  "identity" is entirely kind-identity (any flame is the same as any other in kind).
  If selves are flames in this sense, then all that persists is a type, not a token
  — which is exactly the "mosaic"/"no unique dignity" consequence.


