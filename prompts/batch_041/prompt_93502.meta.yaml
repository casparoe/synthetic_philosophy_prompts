  by representation — but what persists in other brains is a representation of the
  person, which can be wildly inaccurate, and Hofstadter''s own view depends on the
  accuracy/richness of the internal model (the "soul-shard" is bigger when the model
  is richer, and degrees matter). The flame analogy has no room for degrees of fidelity
