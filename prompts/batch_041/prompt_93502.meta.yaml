  are "more" present in you than others; a candle-flame is all-or-nothing. And the
  mapping: what corresponds to the wick, the wax, the heat, the light? The flame''s
  "fuel" is external (wax), so the source doesn''t diminish — but a brain''s capacity
  to model others is finite and competitive; carrying many selves costs something
  (memory, attention, distortion). So the "costless" feature is smuggled in.


