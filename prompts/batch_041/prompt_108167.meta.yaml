  That''s the substance: the CTCs mean you cannot even define a consistent global
  order of past/future, so no objective lapse can be defined. So his argument is:
  (a) it''s possible that a world exists in which there''s no objective lapse; (b)
  the objective lapse, if real, would have to be independent of the contingent matter
  distribution (else it''s a mere artifact); (c) moreover, whether there''s a lapse
  is in principle unobservable; therefore the lapse is not part of physical reality.
  The classic objection: this proves too much — the same reasoning would show that
  other unobservable-but-real features are unreal; and it seems to move from "possible
  world without lapse" to "our world has no lapse," which only works if the lapse
  must be invariant across all possible worlds, which begs the question.


