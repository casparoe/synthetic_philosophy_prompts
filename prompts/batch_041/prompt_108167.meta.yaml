  remark about the relationship between relativity theory and idealistic philosophy"
  (1949) is: time''s reality requires an objective lapse (the existence of a "now"
  that moves); relativity theory denies that simultaneity is absolute, so whether
  an objective lapse exists depends on the matter distribution; but if time''s lapse
  is real, it should be independent of the particular contingent matter distribution;
