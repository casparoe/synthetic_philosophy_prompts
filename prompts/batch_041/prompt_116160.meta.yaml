  "The dose makes the poison" readings:

  1. Trivial/logical: toxicity is a relation between a substance and an amount, not
  an intrinsic property of a substance — there''s no such thing as a poisonous substance
  simpliciter. (Almost tautological, a platitude.)

  2. Threshold/linear no-threshold denial: for any substance there''s a dose below
  which no adverse effect occurs (a threshold exists). This is empirical and false
  for some agents (genotoxic carcinogens, allergens, sensitizers, endocrine disruptors).

  3. Monotonicity: response increases with dose. Distinct from threshold — hormesis,
  non-monotonic dose-response.

  4. Dose-rate / duration independence: only total dose matters, not timing — false
  for many toxicants (developmental windows).

  5. Route/exposure and species/susceptibility: dose is the only variable that matters,
  individuals don''t vary — false (pharmacogenomics, age, nutritional status).

  6. Practical/regulatory: risk assessment can be done by finding a NOAEL and dividing
  by safety factors; the slogan justifies the ADI/RfD approach.

  7. Rhetorical/defensive: "the dose makes the poison" as a conversation-ender — since
  everything is toxic at some dose, this particular residue is fine. This is a non
  sequitur: from "everything has a threshold" it doesn''t follow that this level is
  below it.

  8. The "poison" is a legal/regulatory category, not a natural kind — poison as a
  status assigned by institutions.

  9. Mixture effects: dose of a single chemical in isolation; real exposures are mixtures
  — the slogan assumes single-agent additivity.

  10. "Poison" as an event vs. property — Paracelsus''s actual point historically
  was against the Galenic doctrine of inherent qualities/degrees of medicines, i.e.,
  against "this herb is hot in the fourth degree." So a reading: the slogan is an
  attack on essentialism about substances, not a license for any particular regulatory
  threshold.


