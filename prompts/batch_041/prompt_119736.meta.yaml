  Essay thesis: Consent comes in two forms that the literature runs together — *authorization*
  (you transfer permission to act) and *assumption of risk* (you accept that a bad
  outcome may occur). Deception and coercion are standardly said to vitiate consent.
  But the essay argues: deception about the *risk profile* vitiates *assumption of
  risk* but not *authorization*; deception about the *nature and scope of the act*
  vitiates *authorization* but not *assumption of risk*. So "invalid consent" claims
  need to specify which. And a striking corollary: a person who is deceived about
  risk can still validly authorize the act — so the act isn''t a battery — even though
  her acceptance of the risk was not valid, so the actor''s *exculpation* fails. This
  separates the *wrong of trespass* from the *wrong of harm*, which explains why we
  intuitively want to say both "she did consent" and "she was wronged."


