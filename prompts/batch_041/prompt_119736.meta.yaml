  Essay draft:


  "The standard list of conditions on valid consent is competence, information, and
  voluntariness. I think that list is a list of conditions on two different things
  that we''ve been calling by one name, and that most of the puzzles in this area
  come from running them together.


  Call the first thing authorization: you lift a boundary, you make it permissible
  for someone to do a thing to you. Call the second thing risk-assumption: you take
  on the possibility that the thing will go badly. Authorization is about the act''s
  nature and scope; risk-assumption is about its consequences. The conditions attach
  differently. Competence to authorize is competence to grasp what act is being performed;
  competence to assume a risk is competence to grasp stakes and probabilities, which
  is a different and often lower bar. Deception about what act is being done invalidates
  authorization but leaves risk-assumption untouched — if you''re told the procedure
  is a biopsy and it''s actually an experimental implant, you didn''t authorize it,
  full stop, and the fact that you''d have accepted the risk is irrelevant. Deception
  about consequences invalidates risk-assumption but leaves authorization intact:
  you authorized the operation, the surgeon committed no trespass, but the surgeon
  has no claim on your having accepted the odds. Coercion cuts the same way: a threat
  attached to the very act ("sign or I''ll shoot") means the signature isn''t yours,
  so no authorization; a threat elsewhere in your life ("take the job or lose the
  house") leaves the contract authorized but poisons your acceptance of its risks.


