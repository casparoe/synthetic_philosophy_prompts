  Student answer:


  "Both cases turn on the same thing: counterfactual dependence. Had the gardener
  watered the plant, it would have lived; had the stranger watered it, it would have
  lived too. So on the counterfactual theory of causation both omissions are causes
  of the death, and that is the right verdict for the gardener, who was the one who
  was supposed to water it.


