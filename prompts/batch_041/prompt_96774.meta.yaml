  did not water the plant, the Queen did not water it, and infinitely many other people
  did not water it, so if the test is applied consistently the death has infinitely
  many causes. This objection shows that counterfactual dependence cannot be a sufficient
  condition for causation. But it does not show that omissions are not causes, because
  in the gardener''s case the counterfactual test gives us the verdict we want where
  the rival accounts cannot: a process account that requires a flow of energy or a
  conserved quantity from cause to effect has literally nothing to say about a case
  in which nothing happens, and that is a cost to the process account, not to the
  view that omissions cause things.


  What separates the gardener from the stranger is therefore not metaphysics but our
  explanatory and blaming practices. We single the gardener out because watering was
  his job and the stranger''s omission was not salient to anyone. So causal selection
  is pragmatic. It follows that the sentence ''the gardener caused the plant to die''
  is not really a claim about the causal structure of the world; it is a claim about
  which omission we happen to find interesting. The metaphysics of omission and the
  pragmatics of causal talk cannot be separated, and there is no fact of the matter
  about which omissions are causes, only facts about which ones we choose to mention."


