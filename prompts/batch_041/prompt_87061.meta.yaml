  I am a high school student enrolled in an advanced seminar on the history of economic
  thought, and for the past two weeks our class has been working through Hume''s essays
  on money and trade — the ones in which he insists that a nation''s true wealth consists
  in its goods, its labour, and its productive capacity rather than in its stock of
  coin, and in which he describes money not as one of the wheels of trade but as the
  oil that lets those wheels turn smoothly. Last Thursday, during a discussion of
  whether a government can impoverish its citizens merely by printing money, a classmate
  of mine repeatedly invoked the phrase "money is a veil" as though it settled the
  matter: on his reading, since money is only a veil draped over the real economy,
  no quantity of it can make a country genuinely poorer, and anyone who worries about
  inflation has simply confused the veil with the thing veiled. I am uneasy with this,
  but I cannot put my finger on what is wrong, and I would rather understand the slogan
  properly than win the argument. I would therefore like you to act as an expert in
  the history of economic thought and monetary theory, and to reason carefully and
  explicitly before you answer; if it helps, begin with a short brainstorm of the
  candidate meanings before you commit to any verdicts.


