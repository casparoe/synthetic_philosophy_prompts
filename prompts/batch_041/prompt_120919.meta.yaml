  Here''s the lens I want you to use, and it''s a distinction I''ve been trying to
  get people to take seriously: split the standard ''criteria of authenticity'' used
  in historical-Jesus work — embarrassment, multiple attestation, coherence, contextual
  plausibility — into two kinds. Call the first kind attestation criteria: they tell
  you what a community was willing to say, i.e. they measure the tradition''s own
  commitments and the pressure it was under. Call the second kind occurrence criteria:
  they''d tell you something about what actually happened on the ground. My claim
  is that embarrassment is almost always doing attestation work while being sold as
  occurrence work, and that this is exactly what goes wrong in the Exodus debate:
  the fact that a tradition preserves something inconvenient for itself (Israel as
  slaves, a non-Israelite name on its founding hero, that bizarre night-attack on
  Moses in Exodus 4 where God tries to kill him and Zipporah has to cut the kid''s
  foreskin, the mixed multitude, the fact that the whole thing is set in Egypt and
  not in Canaan where the archaeology is) is real evidence about the tradents and
  almost nothing about the events.


