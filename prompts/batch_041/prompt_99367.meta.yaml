  a = X, probability of observing X: (1/2)p(X) (choose smaller envelope) ... plus
  if X is the larger, then a = X/2, probability (1/2)p(X/2). So posterior P(X smaller
  | X) = (1/2 p(X)) / (1/2 p(X) + 1/2 p(X/2)) = p(X)/(p(X)+p(X/2)). Expected value
  of other = 2X * P(X smaller) + (X/2) * P(X larger) = 2X·p(X)/(p(X)+p(X/2)) + (X/2)·p(X/2)/(p(X)+p(X/2)).
  For this to exceed X: [2X p(X) + (X/2) p(X/2)] > X[p(X)+p(X/2)] → 2X p(X) + (X/2)p(X/2)
  > X p(X) + X p(X/2) → X p(X) > (X/2) p(X/2) → p(X) > p(X/2)/2 → 2p(X) > p(X/2).
  So if the prior puts enough mass on X relative to X/2 (i.e., p decreasing slowly),
  then switching is advantageous for that X. And indeed there can be distributions
  where this holds for some X. So it''s not that "with a proper prior the expected
  gain always vanishes" — that''s too strong! With a proper prior, the unconditional
  expected gain is zero (by symmetry), but conditional on seeing X, switching can
  be beneficial for particular X. This is a real subtlety. So the "solved" camp''s
  claim "once you fix a prior the expected gain vanishes" is too quick — and the "not
  solved" camp has a point.


