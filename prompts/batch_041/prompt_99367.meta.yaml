  "A reading group I belong to has been stuck for over a year on the two-envelope
  paradox, and I would like a diagnosis of the dispute rather than a solution to the
  puzzle. The setup we keep returning to is standard: two envelopes, one containing
  twice the other; you choose one at random and open it to find an amount X; the other
  envelope therefore contains either 2X or X/2; the naive argument says each is equally
  likely, so the other envelope''s expected value is 5X/4, and you should switch —
  and the same reasoning, applied before opening, would have told you to switch to
  whichever envelope you didn''t pick. One faction in the group treats this as settled:
  the equal-likelihood step is simply invalid, since it would require an improper
  (uniform) prior over the amount in the smaller envelope, and once a proper prior
  is fixed the apparent advantage disappears. The other faction insists this misses
  the point: they concede the classic setup may be mishandled, but argue that conditioning
  on the observed X can genuinely make switching advantageous for some X even under
  a proper prior, and that ''you can''t have a uniform prior'' is a fact about one
  setup rather than an identification of the faulty step; they also say the first
  faction is answering ''how do we avoid the contradiction'' while they are asking
  ''what exactly is wrong with the reasoning.'' Neither side has moved. What kind
  of disagreement is this, really? Is it a mathematical question with a determinate
  answer that one side has simply not learned, a dispute about what counts as resolving
  a paradox (showing the argument invalid versus locating the exact fallacy), two
  sides answering different questions under one name, or a hidden formal issue — about
  improper priors, unbounded or non-existent expectations, or the relation between
  conditional and unconditional expectation — doing the work? Given your diagnosis,
  say what would actually count as progress here, and whether the dispute is one that
  can be settled at all."


