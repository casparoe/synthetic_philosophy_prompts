  Option A: Archives/memory. Mapping: memory encoding ← record creation; retrieval
  ← finding aids/catalogues; forgetting ← loss, destruction, non-creation; repression/suppression
  ← deliberate destruction/classification; confabulation ← forgery/backdating; false
  memory ← retroactive reinterpretation; the owner of the memory ← the institution/state;
  the person remembering ← the archive''s users/historians. Breaks: memory is a single
  organ''s function vs. archive is distributed across many agencies with competing
  interests; memory doesn''t need to be read to exist, archives are inert without
  users; memory has no accession policy; forgetting is passive and undirected whereas
  archival silence is often the direct result of who was required to register things;
  memory is private and archives are public/state-facing; memory is (mostly) not designed
  to be evidence, whereas archives are kept precisely as evidence (chain of custody,
  provenance, authenticity); memory has no finding aid and thus no systematic invisibility
  — you can''t have "unsearchable" memories, whereas the archive''s silences are produced
  by the very apparatus of access (a record that exists but is undescribed is functionally
  silent). That last point is a great "in the weeds" insight: the silence is in the
  description, not the holdings. Conclusion the analogy licenses: "silences are an
  inevitable feature of any finite record, so nobody is to blame and no remedy is
  possible" — does it survive? Partly: finitude is real, but the analogy smuggles
  in that silences are distributed by the same neutral process as forgetting, when
  in fact they''re distributed by power. And the analogy conflates "silence" with
  "absence."


  Also a better analogy: the archive is less like a memory than like a set of instruments
  that only register what they''re built to register (a seismograph doesn''t record
  footsteps) — or like the accounting system of a firm. That''s a nice "better analogy"
  deliverable.


  Option B: Sidgwick/wireless telegraphy. Mapping: transmitter ← agent''s mind; receiver
  ← percipient; no wires ← no known sensory channel; tuning ← rapport; signal ← the
  transmitted content; noise ← chance coincidence; range/interference. Breaks: a telegraph
  requires an artificial transmitter with a power source, a code agreed in advance,
  a designated receiver, and — crucially — an engineer who can build and calibrate
  the receiver; telepathy has no known carrier, no identified organ, and no way to
  distinguish signal from coincidence except statistics; also the telegraph analogy
  implies one-to-one addressing and content-neutrality of the channel, but telepathy
  reports are selective, affect-laden, and often "symbolic" (which is exactly what
  lets fraud and bias in). It smuggles in a "channel" ontology and thus a "physical
  process" ontology — which supports the conclusion "psychical research is just physics
  we haven''t done yet," licensing the SPR''s program and Sidgwick''s demand for the
  same evidential standards as any other science. Where it breaks is where Sidgwick''s
  own caution bites: unlike the telegraph, there''s no independent way to establish
  the existence of the channel, so the analogy can''t do the work of making the phenomenon
  respectable; it presupposes what it was meant to establish. And the disanalogy that
  matters: telegraphy was accepted because it was reproducible on demand by anyone
  with the apparatus; telepathy is not. That''s a good, sharp audit and ties directly
  to Sidgwick''s methodological worry about evidence that would convince a skeptic.


