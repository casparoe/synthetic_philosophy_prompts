  programme for a progressive rival. So unlike Popper, Lakatos denies that theories
  are ever falsified by a single experiment — which is why his view is often called
  a sophisticated falsificationism — and unlike Kuhn, he thinks there''s an objective,
  algorithmic criterion of scientific progress, so he rejects the idea that theory
  choice is a matter of sociology or conversion. The upshot is that the history of
