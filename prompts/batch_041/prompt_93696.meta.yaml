  Harsanyi (1955) "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons
  of Utility," JPE. Setup: social welfare function is individualistic — social welfare
  depends on individual utilities. Axioms: (1) individual preferences satisfy vN-M
  expected utility axioms; (2) social preferences also satisfy vN-M axioms (with "moral"
  preferences, i.e., impartial); (3) the "acceptance" axiom / "similarity" postulate:
  the social ordering of any two social states (or lotteries) coincides with what
  any individual would prefer if he had an equal probability of being any of the n
  individuals — i.e., the social preference is the "equiprobable" extension. From
  these, the social welfare function is a weighted sum of individual utilities, W
  = Σ a_i U_i, with a_i > 0 ("social importance" weights). Harsanyi then argues that
  if all individuals'' utility functions are... actually he argues weights should
  be equal by considering that the weights reflect the "social importance" of individuals''
  interests, and if we can''t distinguish, equal weights; but he acknowledged that
  a_i ≠ a_j may reflect different capacities for satisfaction. Also, Harsanyi argued
  for interpersonal comparability of utility.


  Key subtlety (in the weeds): the "acceptance" axiom is a version of the veil of
  ignorance with equiprobable assignment. Also: the Pareto condition is Pareto indifference
  (weak Pareto over lotteries, or "strong Pareto" over sure prospects?). Harsanyi''s
  theorem is often stated as: vN-M individual + social orderings + Pareto indifference
  ⟹ W = Σ a_i U_i (with a_i ≥ 0). The 1955 theorem used the acceptance axiom instead;
  the modern "Harsanyi''s aggregation theorem" (as in Weymark, Hammond, Mongin) uses
  Pareto + individual vN-M + social vN-M ⟹ weighted sum (utilitarian), with the possibility
  of zero weights ("null" individuals). And there''s the famous disagreement with
  Rawls (maximin) — Harsanyi''s "Can the Maximin Principle Serve as a Basis for Morality?"
  (1975).


