  Then ask the key questions:

  1. What theory of action does each half presuppose — the incentive model (fines
  work) vs. the internalized-values model (culture works)? Are they consistent? Can
  an institution coherently hold both? Which one does the culture-talk need?

  2. The Weberian structure: values as causes that operate through meaning, and the
  byproduct problem: if a work ethic is adopted for instrumental reasons (to raise
  performance), does it still do the causal work Weber''s account assigns it? Does
  the policy presuppose that the causal relation can be run in reverse, and does the
  thesis itself forbid that?

  3. The tautology/redescription worry: culture as a cause vs. a name for the pattern.
  What would distinguish them empirically, and does the practice need a real causal
  claim, or would a purely predictive/summary notion do?

  4. Levels: does culture-blame presuppose that collectives can be causes without
  individual blame, and is that consistent with the same regulator''s individual sanctions?
  Distinguish what the practice strictly presupposes from what it merely fits well
  with; say where it is underdetermined.

