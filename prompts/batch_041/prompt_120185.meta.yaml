  I am a high school junior and a member of my school''s student council, and I would
  like help thinking through a problem that keeps recurring in our meetings. Almost
  every dispute we handle is framed by both sides as a zero-sum contest: one group
  wants the spring budget surplus spent on a memorial garden for a teacher who died
