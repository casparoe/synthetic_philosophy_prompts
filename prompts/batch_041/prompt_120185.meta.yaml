  only one surplus, we assume that every dollar one side wins is a dollar the other
  side loses, and that the only question is who has the stronger claim.


  A friend of mine who reads a lot of economics suggested that this framing is a mistake,
  and offered an analogy that I have been turning over ever since. I will state it
  in my own words, since I am not sure I have it exactly right.


  The analogy runs as follows. Different people hold different values, and they hold
  them with different intensities: what one student would sacrifice almost anything
  to secure, another regards as one consideration among many. When two parties differ
  in these relative intensities, they can trade. I concede ground on the value I hold
  comparatively weakly in exchange for ground on the value I hold comparatively strongly,
  and you do the reverse; if our relative priorities differ, both of us can end up
  closer to what we actually care about than we would have been had we simply fought
  to a decision, even though nothing new was created. The further and stranger claim
  is that this holds even when one party is simply better at honoring both values
  than the other: the party with the advantage still gains by concentrating on the
  value where its advantage is largest and conceding the other, in the same way that
  a country that is more productive than its trading partner in every industry still
  benefits from specializing in the one where it is most productive.


  I am aware that the analogy may not survive the transfer. Values do not obviously
  come in divisible portions that can be handed across a table; the price of a concession
  is not something either side can measure; and it seems possible that conceding ground
  on a value does not merely cost you something, but changes what you are, so that
  a person who trades away half of a conviction may not be the same person who wanted
  the other half.


  Please describe the most important implications of this analogy for how our council
  should conduct negotiations of this kind, and in particular for what a genuine gain
  in such a negotiation would look like, given that we cannot measure what either
  side has given up. I would also like to know which parts of the analogy break down
  in ways that matter practically, so that I do not lean on them in a meeting.


