  I am a novelist at the plotting stage of a historical novel whose entire architecture
  turns on a single small accident: a courier''s horse throws a shoe on a muddy road,
  a dispatch arrives a day late, and a negotiation that would have ended a war instead
  collapses into one. I chose the device deliberately, because I want the book to
  be about how large outcomes hang on small contingencies. A friend who is a physicist,
  however, assures me that the matter is already settled — that chaos theory has demonstrated
  that small causes can have arbitrarily large effects, and that my thrown shoe is
  therefore not a novelist''s conceit but a law of nature. I am not persuaded that
  the two claims are the same claim, and I would like you to compare them carefully.


  On one side stands what I will call the historian''s thesis of contingency — the
  old proverb in which a kingdom is lost for want of a horseshoe nail. Its content,
  as I understand it, is that some outcome was not forced by the great structural
  forces (economics, geography, demography, class) but turned on a particular event
  that might easily not have happened, so that the course history actually took was
  one of several that were genuinely open. On the other side stands chaos, or sensitive
  dependence on initial conditions, in the mathematics of dynamical systems: a fully
  deterministic system in which neighbouring initial states separate exponentially,
  so that arbitrarily small differences in starting conditions yield arbitrarily large
  differences later — as in the familiar demonstration in which a weather model run
  twice, with one value rounded at the sixth decimal, produces two entirely different
  long-range forecasts.


  Compare the two. Are they one idea under two names, or different in kind? I have
  a suspicion, which I offer as a suspicion only, that they diverge at the following
  points, and I want you to tell me whether I am right and where I am wrong: that
  chaos is deterministic and therefore leaves no room for the "could have gone otherwise"
  that the historian''s contingency seems to require; that chaos is a claim about
  our inability to predict a system whose future is nonetheless fixed, whereas contingency
  is a claim about the modal status of the outcome itself; that sensitive dependence
