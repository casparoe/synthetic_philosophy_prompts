  Let me structure the injected case carefully so the question has a crux:


  The market: "blame transfer" — a company that, for a fee, arranges for a willing,
  consenting person to publicly accept responsibility for something a company or executive
  did, including the reputational hit and any non-criminal sanction (fines are still
  paid by the executive; the stand-in takes the public blame and the firing/suspension).
  Everything disclosed: the public is told the whole arrangement, the stand-in is
  named, and the fact that they were paid is public. So no deception.


  Question: Is this a repugnant market (i.e., wrong to exist even with full disclosure
  and consent), and if so, on what ground? Because the obvious objections (deception,
  harm to third parties, coercion, externalities) are all stipulated away, the students
  must engage the "corruption/meaning" objection: that accountability practices have
  an internal meaning — blame must track who did it — and the market degrades the
  practice of holding people responsible, even if nobody is deceived. And the counter:
  what exactly is degraded if everyone knows? Also the "commodification of the self"/"the
  wrong thing to want" angle, and the "wrong kind of reason" (the price makes it a
  market good). Also the "double effect on the wrongdoer: they''re not let off, since
  we all know they did it — so what did they buy?" — interesting: if it''s fully transparent,
  what does the buyer actually buy? Maybe they buy *being publicly blamed*, which
  is strange. This is a great crux: under full transparency, the transaction seems
  to buy nothing (no deception, blame still attributed to the buyer in fact, since
  it''s disclosed). So the question becomes: does the market collapse into pointlessness
  (which is an argument that it''s harmless), or does the fact that someone can *discharge*
  the social ritual of blame by paying show that blame is being treated as a priceable
  burden (which is the corruption)? Yes! That''s a genuinely hard crux.


  Also: is the *stand-in* wronged? Are they exploited? Are they selling their dignity?
  And: does this show that "repugnance" tracks the *transferability of a burden* rather
  than harm?


  Also add: is the case better analyzed as (a) commodification, (b) a "repugnant transaction"
  because it changes the meaning of the practice, or (c) not a market problem at all
  but a problem with our practice of public blame (i.e., the market reveals that public
  blame is a mere ritual with no moral function — and the real conclusion is that
  we should stop caring about it)?


