  I''m a longtime reader of the rationalist blogs and forums — I arrived for the Sequences
  and stayed for the long book-club threads — and I''ve been trying to use fiction
  as a stress test for the tidy liberal stories I absorbed as an undergraduate. The
  tidiest of those stories is the one about John Stuart Mill: the harm principle,
  experiments in living, the whole liberal package, with the inconvenient fact that
  Mill spent the better part of his working life as an examiner of Indian correspondence
  at East India House, defended the Company''s administration of India when the Crown
  took over after the 1857 rebellion, and argued in his writings on representative
  government that British rule in India was justified as a trust exercised on behalf
  of a people he did not think were yet fit to govern themselves — a despotism he
  thought legitimate precisely insofar as it aimed at the improvement of the governed.
  I want to read E. M. Forster''s A Passage to India against that theory. The novel
  is set in a provincial Indian town under the Raj, among British officials who are
  petty and frightened and Indian characters who are by turns deferential and furious;
  it turns on the expedition to the Marabar caves, the accusation against Aziz, the
  trial that follows, and the friendship between Aziz and Fielding that the book pointedly
  refuses to resolve. My question is not the standard one — that Forster criticizes
  imperialism — but something sharper: does the novel dramatize a refutation of Mill''s
  colonial theory, or does it instead confirm Mill''s own internal warning that a
  dominant race, far from improving those it governs, is corrupted by its position
  into exactly the callousness Forster shows?


  I''d like a reading that takes both the novel and the Millian framework seriously,
  and that is honest in both directions. Where does the book actually engage Mill''s
  questions — the test of good government as the improvement of the governed, the
  value of an active and cultivated character, the thought that despotism can be a
  legitimate instrument of tutelage, the worry that colonial administrators govern
  in the interest of settlers rather than natives? Which scenes or choices carry the
  weight — the Club and its code, the caves and their echo, Mrs. Moore''s collapse
  of faith, the trial, Fielding''s compromises, the closing ride where the landscape
  itself seems to deny that the two men can be friends yet or there? And where does
  the reading fail? My instinct is that the caves and the novel''s mysticism resist
  being cashed out as a lesson about colonial policy at all, and that this resistance
  may itself be making a point that Mill''s framework cannot accommodate — that something
  exceeds the political, or that the novel refuses the very notion of a moral ledger
  that Mill''s utilitarianism requires. I want you to say so if that is right, and
  to distinguish the places where the novel genuinely complicates the theory from
  the places where I am simply reading my own interests into it.


  Finally, tell me what the novel adds to the argument that Mill''s prose and the
  modern commentators on colonial liberalism do not — whether there is a truth about
