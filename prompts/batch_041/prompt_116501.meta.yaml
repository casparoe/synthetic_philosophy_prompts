  Wait, let''s recall. The absent-minded driver problem: The driver is on a highway.
  He passes two exits. He cannot remember whether he has passed the first exit. He
  is absent-minded, so at each exit he doesn''t know if it''s the first or second.
  If he exits at the first, he gets 0. If he exits at the second, he gets 4. If he
  doesn''t exit, he gets 1. Actually the classic payoffs: first exit: 0, second exit:
  4, continue past both: 1. He should plan to exit at the second. But at the first
  exit, if he reasons "if this is the first exit, I should not exit; if this is the
  second, I should exit," but he doesn''t know which. The paradox is that the optimal
  strategy is to not exit at the first and exit at the second, but at the moment of
  the first exit, if he is rational, he might think "if I am at the first exit, I
  should not exit; if I am at the second, I should exit. Since I don''t know, I should
  maximize expected utility given my beliefs." The problem is about dynamic consistency
  and the conflict between decision theories. The prompt can be simplified. We don''t
