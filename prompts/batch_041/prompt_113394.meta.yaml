  ---


  I am assembling an anthology of short fiction on the theme of collective memory,
  and I would like you to write one of the pieces: roughly two thousand words, literary
  rather than speculative, set wherever you can make a place convincing.


  The premise I want you to build on is a practice, not a theory. In one community
  — an island, a valley town, a company settlement, whatever the story needs — two
  accounts of a single founding event have been maintained side by side for about
  a century. One is filed. It is written, dated, signed and submitted to whoever held
  authority to receive it: a parish register, a company office, a colonial survey,
  a coroner, a court. The other is recited. It is never written down, it is performed
  aloud on a fixed occasion each year, and it has exactly one rule, which children
  learn before they learn its contents: a name may be added to it, and no name may
  ever be taken out. The rule has been kept for a hundred years, which means the recited
  account can only grow and the filed account can only be amended by paperwork — one
  ratchets up, the other ratchets down, and neither has any ordinary way of shedding
  its own error.


  What interests me is not which account is true. It is the asymmetry of the two failures.
  The file is exact about what it was designed to record and silent about everything
  else, and its silences run along the grain of who was in a position to write. The
  recitation is inaccurate in one direction only, and its inaccuracies are all additions
  — the dead, the unnamed, the ones who did the work and were never on a payroll.
  So the file cannot lose a name and the recitation cannot lose an error.


  The story should turn on an outside demand for a single account: a heritage plaque,
  a compensation scheme, a land claim, a textbook, an inquiry — some body that requires
  the community to submit one authoritative version and will not accept two. I want
  the pressure to come from that demand, not from a quarrel inside the community.
  And I want three things held apart throughout: what is false, what is unverifiable,
  and what is true but unrecorded.


  Please keep the two custodians — the one who keeps the file and the one who keeps
  the recitation — intelligent, unsentimental and partly right, and let each see something
  the other cannot. Do not give me a revelation scene in which a single document settles
  the matter; do not let the story end in the vindication of either the record or
  the memory; and do not let it end in the comfortable compromise that both are true
  in their own way. I would rather it end with something irreplaceable actually lost,
  and with the loss specific enough that the reader can name it. Your own verdict
  on the community''s practice should be legible from what the characters give up,
  not from a speech any of them makes.


  I am not asking for a story that concludes that documents are truth and memory is
  sentiment, nor one that concludes that documents are power and memory is truth.
  I want the reader to close it able to say what each account is for, and to see why
  a community might keep both — and why keeping both might, in the end, be something
  it cannot afford.


