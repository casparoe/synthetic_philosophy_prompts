  I''m a novelist, and my old college has asked me to give this year''s commencement
  address — it''s the last one they''ll ever have, because in the fall they''re being
  absorbed into the state university system and the campus as we knew it is done.
  So it''s a weird room: a few hundred kids in gowns who mostly just want to get to
  lunch, their parents, a faculty who are losing their jobs, and a president who would
  very much like me not to make it worse.


  Here''s my problem. I write endings for a living, and I know that where you put
  the last page is a choice — you can make the same events a tragedy or a beginning
  just by deciding when to stop talking. And I''ve been reading a lot about collapse
  lately, the real thing, Bronze Age, the Maya, Easter Island, and the more I read
  the more it seems like "collapse" is doing something sneaky in most of those stories.
  The palace archives stop, so we say the civilization fell — but the archives stopping
  is evidence about scribes, not about farmers. The famous cases turn out to be contested:
  the Maya story is at least as much a political reorganization as a disappearance,
  and the Easter Island ecocide story is now argued over hard by the people who actually
  dig there. And the other side of it: what looks like resilience can just be the
  same failure moving slower, a society buying more complexity than the complexity
  is worth, because the people who pay for it and the people who decide to buy it
  aren''t the same people.


  What I want is the speech. Five minutes, spoken, no footnotes. It has to do two
  things that are pulling against each other. It has to be warm enough for the parents
  who''ve never heard of any of this and just want their kid to walk out of there
  feeling like the day was real. And it has to be straight enough that the two archaeologists
  on the faculty don''t feel condescended to — which means no loose talk of collapse,
  and also no pretending this is secretly a rebirth, because that''s the kind of thing
