  Student answer draft:


  "The dollar auction was introduced by Martin Shubik in 1971 to show how a completely
  ordinary-looking bidding situation can end up costing everyone more than the prize
  is worth. The rules are simple: a $1 bill is auctioned, bidding starts at 5 cents
  and goes up in 5 cent increments, and both the highest and the second-highest bidder
  have to pay what they bid — but only the highest bidder gets the dollar. The interesting
  part is what happens once the bidding passes 95 cents. Suppose I''ve bid 95c and
  you bid $1. If I stop, I lose 95c and get nothing. If I bid $1.05, I lose only 5c
  (I pay $1.05 and get the dollar). So continuing is actually the cheaper option at
  that point, and that''s why the bidding runs past $1 — a point at which both bidders
  are now guaranteed to lose money and the auctioneer is guaranteed to make a profit,
  since the two top bids together always exceed $1.


  This is usually described as an example of the sunk cost fallacy. The bidders keep
  going because they''ve already committed money and can''t stand to see it wasted;
  the same thing happens with the Concorde, with firms pouring money into failing
  projects, and with governments in unwinnable wars. What Shubik''s game shows, though,
  is that the trap doesn''t need any irrationality at the start — bidding a nickel
  on a dollar looks completely sensible, and the situation is only a trap because
  the rules make the second-highest bidder liable. In that sense the escalation is
  an artefact of the payoff structure rather than of anyone''s psychology, although
  the psychology (loss aversion, self-justification, the desire not to be the sucker)
  clearly makes it worse in real cases. The research on escalation of commitment in
  organizations — Arkes and Blumer''s work on the ''knee-deep'' problem — documents
  exactly this pattern in capital investment decisions.


  One thing the game doesn''t show is that the escalation is irrational all the way
  down. Each individual bid past the dollar is a rational attempt to lose less, and
  that''s the actual paradox: rational steps, disastrous destination. If anything,
  what the game really demonstrates is that people who haven''t been taught to see
  the structure coming shouldn''t sit down at the table in the first place; but once
  you''re in, there''s no way back."


