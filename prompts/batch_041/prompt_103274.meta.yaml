  I''m the collections registrar at a mid-sized museum of technology and everyday
  life, and identity-over-time questions land on my desk about twice a month: a curator
  wants to list a heavily restored locomotive as "the original 1897 engine," a donor
  offers a timber-framed house that was dismantled in 1974, moved forty miles, and
  re-erected with new foundations and roughly a third new timber, and our media art
  collection keeps needing to re-implement software pieces on hardware the artist
  never saw. My institution has no policy beyond a rule of thumb someone wrote in
  the 1980s — if more than half of the original material survives, we call it the
  same object — and the rule has begun to embarrass us: it makes the locomotive''s
  identity depend on a percentage nobody can measure, it says nothing about the case
  where the surviving original parts have been distributed among three other museums,
  and it gives no guidance on a piece whose matter is entirely intact but whose behavior
  has changed. I need to replace it with something I can actually run, explain to
  the director in ten minutes, and hand to an assistant registrar who has never read
  any philosophy.


  Please write that procedure, grounded in the metaphysical debate between endurantism
  (a thing is wholly present at each moment; it persists by having different properties
  at different times) and perdurantism (a thing is a four-dimensional whole extended
  through time, with a distinct temporal part at each moment, so persistence is a
  matter of having later parts). If my one-line gloss of either view is wrong, correct
  it before you build on it; and I''d like you to use the puzzle about how one thing
  can have incompatible properties at different times — temporary intrinsics — as
  the test that tells the two views apart, since it''s the point where I lose my footing.
  Give me the tests in the order I should run them, what counts as an answer good
  enough to stop, where the procedure returns a flat no, where it must hand the decision
  to a person, and which of my questions turn out to have no determinate answer at
  all but are just two bookkeeping conventions fighting — I suspect at least one of
