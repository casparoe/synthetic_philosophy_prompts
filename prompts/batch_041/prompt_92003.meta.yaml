  The other (B) says: that''s a universal acid. Run the same four options on the claim
  "the tetralemma successfully dissolves questions" or on "the Buddha taught the dharma"
  or on the everyday claim "fire burns" — the same pattern of refutation is available,
  so the method proves too much; also, if nothing is asserted, then the view can''t
  be distinguished from nihilism and can''t be criticized or affirmed, which makes
