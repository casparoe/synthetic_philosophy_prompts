  Thesis sketch (in prompt, in casual voice):


  "Here''s the argument in one breath. The standard story says: CK of rationality
  + CK of the game is what pins down the solution concept — e.g. CK of rationality
  in a perfect-information game is supposed to underwrite backward induction (or at
  least rationalizability, depending who you ask). I want to argue that the literature
  is quietly running two different things together:

  (a) rationality as a *substantive* constraint — you never leave a strictly dominated
  action on the table, you maximize expected utility given your information, etc.;
  and

  (b) rationality as a *consistency* condition on the model — the model has no room
  in it for a player who does something the model itself would call a mistake.

  And I claim (a) can never get you CK: as soon as you try to common-knowledge a substantive
  maximizing condition, you either make the epistemic model inconsistent in games
  with more than one rationalizable outcome, or you quietly upgrade the players''
  information partition to something no finite agent could have — i.e., you''ve turned
  ''rational'' into ''omniscient about the rational thing to do''. So what actually
  does the work in these characterisation theorems is CK of the *game form* plus a
  deflationary ''nobody is knowingly making a mistake'' condition, which is (b). If
  I''m right, a chunk of the epistemic-foundations literature is proving theorems
  about a modelling artefact, and the interesting question is why CK of rationality
  *feels* like it''s doing work."


