  "I want a critical reading of George Eliot''s Middlemarch that treats it as a serious
  intervention in the philosophy of religion, and specifically as a test case for
  the theory of religion Eliot had translated and partly absorbed from Feuerbach --
  that theology is really anthropology, that the attributes Christians assign to God
  (love, wisdom, justice, providence) are the projected attributes of the human species,
  and that the proper response is not atheistic dismissal but the reappropriation
  of those attributes as a human inheritance. The novel is full of religion without
  much theology: Dorothea''s aspiration to a life of renunciation that she can barely
  articulate in Christian terms; Bulstrode''s evangelical conscience, which operates
  with full force after his God has become, in his own mind, something closer to an
  accusing absence; Farebrother''s unspectacular, working faith; the parish and the
  chapel as social institutions doing work that no creed is asked to underwrite; and
  the novel''s closing suggestion that much of the good in the world is the diffused
  effect of obscure lives that leave no record. I want you to press the question in
  both directions. Does Middlemarch vindicate Feuerbach''s projection theory -- showing
  that the moral content of religion survives the loss of its object, because the
  projected attributes were human all along -- or does it quietly refute it, by showing
  that once the projection is seen through, the moral authority it carried goes with
  it? ..."


