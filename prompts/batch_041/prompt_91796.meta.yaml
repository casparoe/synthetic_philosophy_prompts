  fact that the assembly had to reconsider; also the herald/trireme race. That''s
  the "force of the idea": democratic decision-making under conditions where a decision
  is reached quickly, emotions (anger) dominate, and reversing is costly; also the
  "any citizen can speak" and the fact that the reversal itself reveals that the first
  vote was not a considered judgment. Also the point about the Athenian assembly being
  a mass body with no parties, no representation, and decisions that bind everyone.


