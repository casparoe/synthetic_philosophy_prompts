  Requirements to specify:

  - Setting: undergraduate survey "Democracy Ancient and Modern," discussion section,
  ~20 students, 75 minutes, a regular classroom with movable chairs, no budget.

  - Deliverable: full runnable design: rules, materials (printables), role cards,
  timeline with minute marks, how votes are taken, the "reversal cost" mechanic, payoffs
  that don''t need real money (use tokens/points/candy? no real money — points or
  stickers).

  - Do not reveal that this is Athens until the debrief.

  - Information asymmetry: in round 1 they get only the angry-briefing info; in round
  2 new cards are revealed (the commons handed over the city / armed and turned; the
  fact that Mytilene wasn''t tributary; the Peloponnesian fleet sighting; and the
  "your first ship is already at sea with a day and a night''s start" clock).

  - The reversal mechanic: to reopen the question, someone must publicly move for
  reconsideration, and that person bears a cost (loses points / becomes the target
  / gets a "you showed weakness" card that other players can spend against them in
  a later round).

  - The near-tie: have them vote by secret ballot, and make the outcome hinge on 1-2
  votes; if you can, run the second vote twice (or a "recount" variant).

  - The ship mechanic: a die roll or a hidden card determines whether the first decision
  has already been carried out; one player holds a secret card that can slow the first
  ship (models the Mytilenian ambassadors provisioning the crew), so the participants
  see that their rescue was contingent.

  - Debrief mapping: Mytilene (correction just in time, near-tie, lobbied by the interested
  party, executed thanks to luck), Sicily (the case where the assembly never reopened
  the question — mention Nicias'' attempt to dissuade backfiring, and the recall of
  Alcibiades), Socrates'' trial (correction too late / regret after the fact). Keep
  the historical reveal short; ask them to compare "what made the reversal possible"
  across the three.

