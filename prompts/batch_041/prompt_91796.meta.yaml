  Good design: an activity with two rounds. Round 1: participants (as assembly) must
  decide quickly with incomplete info under time pressure and emotional framing; Round
  2: next day, new information arrives, and they must decide whether to reverse. The
  twist: a "reversal cost" mechanic — reversing costs something (a marker, a loss
  of "standing", or in game terms a penalty to the group''s score), which models the
  psychological/political cost of admitting the assembly erred. And a "the second
  ship" mechanic where the outcome is uncertain: a randomized/partial chance that
  the first decision is already executed. This makes them feel the force of: (a) the
  reversibility problem — decisions with a delay are the only reason correction is
  possible; (b) the fact that the assembly''s sovereignty means no external check;
  (c) the Cleon/Diodotus asymmetry — the advocate of severity has an advantage because
  reconsideration signals weakness / because mercy is seen as a concession to the
  oligarchs.


