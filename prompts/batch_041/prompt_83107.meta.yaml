  "Evolution is a blind watchmaker":

  1. Trivial: no literal craftsman, no conscious foresight (nobody denies this).

  2. Methodological: we can describe evolution "as if" it were a designer (intentional
  stance, as-if teleology) — heuristic.

  3. Substantive (Dennett): there are real reasons why traits exist and persist —
  free-floating rationales — but no reasoner; "the eye is for seeing" is true in a
  sense that doesn''t require anyone''s intention. Function claims are objective facts
  about selection history.

  4. Adaptationist: nearly everything is well-designed; "watchmaker" carries the design
  metaphor far.

  5. Deflationary/eliminativist: any talk of purpose/design is projection; "for" statements
  are at best shorthand for "was selected because it did X" and at worst false; the
  slogan then licenses dismissing function talk.

  6. Maybe: "blind" as a claim about lack of direction/progress (no telos), which
  is different from "watchmaker" (design-like product).


