  "I am a retired condensed-matter physicist — forty years spent on effective field
  theories, coarse-graining, order parameters, quasiparticles, and the renormalization
  group — and I have lately been reading my way into philosophy of mind, where I keep
  running into the eliminativist thesis about belief and desire. As I understand it,
  the claim is not merely that folk psychology is incomplete or that mental states
  will eventually be reduced to neurobiology, but that the posits of folk psychology
  — beliefs, desires, intentions, and the rest — are the theoretical entities of a
  stagnant predictive scheme and may be eliminated outright, much as caloric and phlogiston
  were eliminated rather than reduced. I would like you to restate that position,
  as sympathetically and faithfully as you can, in the vocabulary I actually use:
  microstates and macrostates, coarse-graining, effective theories and their domains
  of validity, order parameters, quasiparticles, the thermodynamic limit, universality,
  and the distinction between fundamental and emergent descriptions. Treat folk psychology
  as a candidate effective theory and belief/desire as candidate coarse-grained or
  emergent variables. Then give me the residue report. Which parts of eliminativism
  translate cleanly — for instance, the idea that a successful folk psychology has
  a limited domain, or that its posits may be artifacts of a particular coarse-graining?
  Which parts translate only with distortion — say, the difference between eliminating
  a posit and showing that it is not fundamental, or the idea that beliefs are causally
  efficacious in a way that rationalizes action? And which parts have no counterpart
  at all in my vocabulary — the normativity of rationality, the first-person authority
  of avowals, the truth-evaluability and compositionality of propositional content,
  the possibility of systematic irrationality, or the social and institutional life
  of folk psychological practices?


  I am especially interested in a tension I cannot resolve on my own. In my own field,
  entities like phonons, quasiparticles, and order parameters are not fundamental,
  and in some cases are defined only in the thermodynamic limit, yet we do not conclude
  that they are unreal; we say they are emergent but indispensable for describing
  the relevant regime. Temperature is a coarse-grained variable that survived the
  elimination of caloric. So I want to know whether the eliminativist is making a
