  Draft final:


  I teach a 90-minute upper-level epistemology seminar, eighteen students, on the
  threshold view of belief and the norms of rational acceptance. I want a class exercise
  that makes the lottery paradox and the preface paradox something the students run
  into rather than something I announce — they should arrive at the collision themselves
  and hear the names only in the debrief. Stakes must be fake (tokens, points, privileges),
  and the whole thing must be runnable with paper and a bag of counters.


  Some pressures I want built in, because I think the exercise fails without them:


  - Informativeness must be scored. If students can win by believing nothing, they
  will, and the paradox dissolves. The payoff has to reward claims that survive as
  well as the proportion that are true, so blanket suspension of judgment is a losing
  strategy.

  - The number of claims must be under the students'' control. Give them a reason
  to add claims (each claim that comes out true adds to the score), so they can be
  induced to raise the count until whatever threshold rule they''ve adopted cracks
  in their hands. I want them to discover that no fixed threshold short of certainty
  survives.

  - At some point the group has to endorse the conjunction. Not "do you believe each
  of these?" but a single signed statement that the whole list is true — and something
  should ride on it.

  - Two structures, not one. One round should have the claims mutually exclusive and
  jointly exhaustive (the lottery); another should have them independent and fallible
  (the preface). The debrief needs to bring out why the two feel the same but fail
  differently: one puts the students in flat contradiction with each other''s contents,
  the other merely puts a very improbable conjunction alongside each individually
  reasonable claim.

  - Anticipate the escapes. I expect at least one group to make every claim the same
  claim, or to pick correlated claims, which collapses the puzzle; I want the rules
  to make that either impossible or instructive, and the debrief to say what the escape
  reveals about the assumptions the paradoxes need.


  Two things I''d like on top of the basic design. First, an optional third round
  in which the class must issue one collective verdict — so that the inconsistency
  sits in the group''s output while no individual member is inconsistent. Second,
  a "honest preface" variant, where the statement they sign is that at least one of
  their claims is false; I want them to see that this is not self-contradictory but
  does break something else, and to be able to say what.


  Give me: the rules and materials, a minute-by-minute timeline, the payoff scheme
  in tokens, the debrief that maps each moment of play onto the specific commitments
  at issue (belief as credence above a threshold, closure of belief under conjunction,
  the option of withholding, the option of tolerating inconsistency, and what each
