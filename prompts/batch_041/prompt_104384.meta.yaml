  The interesting philosophical question: what notion of correctness do these idealizations
  presuppose? Both seem to presuppose that there is a fact about whether the whole
  output is correct, independent of the process. And they presuppose that the decomposition
  is "lossless" — that the correctness of the parts transfers to the whole. The proposal
  could ask: is there an idealization-independent notion of correctness (a "fact of
  the matter") for the outputs of these processes, or does each idealization covertly
  define correctness as "what the idealized process would say"? And a related regress:
  unbounded recursion needs a base case; if the base case is a bounded human, then
  correctness is anchored in ordinary human judgment, and the idealization adds nothing
  normative — it only adds computation. So the question becomes: does the idealization
  *generate* justification or merely *aggregate* it?


