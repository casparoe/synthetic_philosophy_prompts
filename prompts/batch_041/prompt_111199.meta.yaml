  Setup: Two friends in a Discord arguing about whether program equilibrium actually
  solves the one-shot Prisoner''s Dilemma between AI agents. One says: if both agents
  can read each other''s source code before choosing, then "play cooperate if the
  other''s code cooperates, else defect" — but that''s circular. The other says the
  fix is to reason about what happens if my source is X... Actually the standard solution:
  a player''s program is "if the other program''s output equals C then C else D" —
  no wait. The classic program equilibrium: program "if the other player''s program
  is identical to me, cooperate, else defect" achieves mutual cooperation. And the
  Löbian construction (Barasz et al. 2014) achieves cooperation with a "proof" that
  the other cooperates. And Tennenholtz 2004 introduced program equilibrium.


  Disagreement: one friend says program equilibrium is just a fancy commitment device
  and it''s cheating because the agents are "running" each other''s code / it assumes
  perfect mutual predictability that wouldn''t hold with realistic bounded agents;
  the other says no, it''s a genuinely new solution concept because neither player
  has to be able to predict the other, only to condition on the other''s program,
  and it survives in one-shot anonymous games. Another point: whether program equilibrium
  requires common knowledge of the equilibrium / whether it depends on a "flat" source-code
  access. Another: whether it''s "really" a Nash equilibrium of the underlying game
