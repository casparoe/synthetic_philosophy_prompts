  Program equilibrium version draft:


  "My two flatmates have been going at each other for a week about something one of
  them read in an AI safety paper, and I''ve been asked to referee. Here''s the setup
  they agree on: two AI agents have to play a one-shot prisoner''s dilemma, no reputation,
  no repeat play, and neither can see the other''s move before making it. The twist
  is that each agent first hands over its own source code, and then, with the other''s
  code in hand, runs and outputs its move. (1) Flatmate A says that''s enough to get
  cooperation: each agent just runs ''if the other program is identical to mine, cooperate;
  otherwise defect,'' so identical agents cooperate, and neither can do better by
  switching to anything else, so it''s a real equilibrium — cooperation without enforcement,
  which is the whole point of the result. (2) B says that''s circular sleight of hand:
  the two agents only cooperate because they were programmed to look for the same
  string, which is just coordination on a label, and if the two agents are even slightly
  different — different authors, different code style — they both defect, so it proves
  nothing about actual cooperation. (3) A says the point isn''t string-matching, it''s
  that an agent can hand over code that says ''cooperate if the other one''s code,
  when fed mine, cooperates, else defect'' and reason about the fixed point — the
  mutual cooperation equilibrium survives even when the two programs aren''t textually
  identical. (4) B says that fixed-point story only works if the two agents share
  a logic that''s consistent and strong enough to prove things about each other, and
