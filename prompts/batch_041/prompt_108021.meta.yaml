  ---


  I am assembling a working list of patterns I have decided are real or not, and I
  want to know what principle, if any, they express. I work as a data scientist and
  came into this from field ecology, so my cases are mostly from measurement and modelling
  rather than from the usual philosophical stock. I have read enough of the "real
  patterns" discussion to know the shape of the standard view — that a pattern is
  real when it supports compression and prediction that rival descriptions cannot
  match, and that what counts as a pattern is relative to a stance we adopt toward
  the system, physical or design or intentional — but I do not want a summary of that
  discussion. I want you to treat my verdicts as the data and tell me what rule they
  add up to, where the rule breaks, and which verdict I should abandon.


  My verdicts, stated as concretely as I can:


  1. Debris-clearing dip. A river gauge reads low every Tuesday between 06:00 and
  08:00. The dip holds across three years, replicates at two gauges downstream, and
  traces to a crew that clears debris on a fixed schedule. Real.


  2. The branch-office field. A default model reaches 0.81 AUC by keying on a field
  that turns out to record which office entered the application. It has no causal
  link to default, and the signal vanishes on the next year''s data. Not real.


  3. The wallpaper tile. A repeating tile describes a wall''s image in a few bytes
  and predicts nothing about anything beyond the wall. Real.


  4. The trajectory file. I hold a file that stores the exact future of a chaotic
  system, state by state. It predicts perfectly, but it is as long as the history
  and admits no shorter description. Not a pattern at all, just the thing itself.


  5. The credit grade. A rating agency''s grade predicts default, everyone prices
  off it, and issuers restructure to reach it. If no one treated it as meaningful
  it would stop predicting. Real.


  6. The firm''s plan. A company''s acquisitions are well predicted by attributing
  to it a plan to dominate a regional market. No document states the plan and no individual
  holds it whole. Real, but only from the intentional stance; from the physical stance
  there is no plan to find.


  7. The unoccupied stance. There is a regularity in a distant system that no possible
