  debt, and the danger of mistaking form for meaning, and the risk that apparent fluency
  leads people to attribute understanding. The "stochastic parrot" metaphor: LM is
  a system that stitches together sequences of linguistic forms according to probabilistic
  information about how they combine, but without any reference to meaning.

  - The debate: Do LLMs understand? Opponents: no, they''re just pattern matching.
  Proponents: maybe they do have some understanding, or the form/meaning distinction
  is too sharp, or meaning can be learned from form if form is rich enough (distributional
  semantics). Also the point that Bender & Koller''s argument depends on a particular
  theory of meaning (meaning as use in communicative context), and that the octopus
  argument assumes the octopus lacks the relevant context, but a model trained on
  text might acquire some of that context indirectly. Also the distinction between
  "understanding" as a binary vs. gradual, and the question of what counts as understanding.


