  deadpan customer-support FAQ, around 700 words, for a fictional subscription service
  called Probability Kinematics Inc., whose flagship product, Jeffrey, promises to
  update your credences whenever your evidence is uncertain. The FAQ should be written
  in the voice of the company''s support team, in numbered question-and-answer format,
  and should never break character to explain the joke. The target is the practice
  of marketing formal epistemology as a frictionless life hack, and more specifically
  the tendency to treat Jeffrey conditionalization as a general-purpose replacement
  for ordinary conditionalization whenever evidence feels less than certain. The humor
  should come from getting the epistemology right rather than from buzzwords: entries
  should turn on the rigidity condition, the need to specify a partition before any
  update can be defined, the difference between updating on a proposition and updating
  on a new distribution over a partition, order-dependence and failures of commutativity,
  the problem of old evidence, and the fact that much real-life uncertain evidence—a
  hesitant testimony, a blurry photograph, a doctor''s hedged diagnosis—is not naturally
  a proposition with a sharp probability attached. I would like at least one entry
  to function as a quiet reductio, for example a refund policy for updates that fail
  to commute or a compliance audit for customers who have violated rigidity, and at
  least one entry to acknowledge, in corporate euphemism, that the user may have to
  re-describe their uncertain evidence as certain evidence in order to make the product
  work at all.


