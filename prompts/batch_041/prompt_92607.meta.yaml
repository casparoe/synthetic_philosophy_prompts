  Actually, let me reconsider the "common prior assumption" with the veil-of-ignorance
  analogy. Hmm, is that analogy "in common use"? In decision theory, the common prior
  assumption is often justified as a "requirement of objectivity" or "the Harsanyi
  doctrine" — indeed the common prior assumption is sometimes called the "Harsanyi
  doctrine", which comes from Harsanyi''s veil-of-ignorance argument. So the analogy
  is: "the common prior assumption is the veil of ignorance applied to belief: rational
  agents differ only because of information, never because of what they''d think behind
  a veil." That''s a real and quite deep connection. How far does it hold? Mapping:
  original position : common prior; the parties'' ignorance of their place : the agents''
  differing private information; the social contract : the ex ante agreement; the
  "thin" theory of the good : the prior. Where it breaks: the veil of ignorance is
  a *device of justification* (what principles would be agreed), and it''s normative
  and hypothetical, whereas the common prior is a *descriptive constraint on a type
  space* — and it''s a modelling assumption about a population, not a claim about
  what one agent should think; the veil removes information from a single chooser,
  whereas the common prior allows information to differ across agents (they just start
  from the same prior); Harsanyi''s version aggregates utilities, requiring interpersonal
  comparability, whereas the common prior is a probabilistic claim; and the veil of
  ignorance is a device for generating *impartiality*, whereas the common prior is
  a device for generating *consensus* (Aumann). Also: behind the veil you don''t know
  your identity but you know the distribution; with a common prior, agents may disagree
  after updating, and Aumann''s theorem says they can''t *agree to disagree* — but
  the veil says nothing about agreement at all. And the conclusion: does the analogy
  support the claim that disagreement between rational agents is impossible/an illusion?
  Hmm — the conclusion it''s used to license: "persistent disagreement between rational,
