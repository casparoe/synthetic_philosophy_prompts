  1. Ghazālī''s argument in Tahāfut discussion 17 is directed at the necessity of
  the connection, and he grants that the connection is "habitual" (iʿtiyād / sunna),
  but he''s mainly showing that the philosophers cannot *demonstrate* necessity, not
  asserting occasionalism. Some scholars (Marmura) argue Ghazālī is not an occasionalist
  at all; others read him as one. Actually Marmura''s "Ghazali and Demonstrative Science"
  and "Ghazali''s Chapter on Divine Power in the Iqtisad" — Marmura argues Ghazālī
  is an occasionalist. There''s a debate: is Ghazālī an occasionalist, or does he
  only deny *necessary* connection while allowing secondary causality? Also the point
  that Ghazālī''s own positive view (in Iqtisad) is Ash''arite occasionalism, and
  that this is compatible with natural science as a science of regularities.


  2. Ghazālī''s analogy: "the quenching of thirst by drinking water" and the fact
  that God "creates" the two in sequence; the idea that God is the sole agent, and
  that God could create vision without light, etc. Also the famous "cotton burns by
  fire" example.


  3. The "habit" point: God''s action is "customary," and miracles are the breaking
  of habit; and Ghazālī''s worry: if causation were necessary, miracles would be impossible,
