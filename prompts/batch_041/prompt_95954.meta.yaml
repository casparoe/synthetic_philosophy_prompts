  ok so I''ve been reading about cases where two people land on the same idea at basically
  the same time — Darwin and Wallace on natural selection, Newton and Leibniz on the
  calculus, Bolyai and Lobachevsky on non-Euclidean geometry, Mendeleev and Lothar
  Meyer on the periodic table, Scheele and Priestley on oxygen, Bell and Gray on the
  telephone. And everyone always wants to know two things: was the discovery inevitable,
  and does it matter who made it. I wrote up an argument that both questions are confused,
  and I''d like comments. Here''s the argument.


  Think of any discovery as having two seperate parts. There''s the scaffold — all
  the prior results, techniques, notation, and well-posed problems that make the discovery
  reachable at all. The scaffold is almost always the work of many hands over decades,
  and it''s shared: anyone working in the area in that period inherits roughly the
  same scaffold. Then there''s the last step — the specific move that actually closes
  the gap. The last step is usually small, often idiosyncratic, and it''s the part
  we name after a person.


  Now, the "inevitable" question is almost always answered at the scaffold level:
  by [year], the field had everything it needed, so someone was bound to do this.
  And then, with no extra argument, it''s read as a claim about the last step: so
  someone was bound to take the last step. I want to call this the finish-line fallacy.
  A crowd converging on a finish line tells you the course led there, not that the
  last stride is easy. Reachability makes the field converge; it doesn''t make any
  particular stride trivial.


  There''s a probabilistic version that makes the point cleaner. Suppose N people
  are positioned to take the step and each has probability p of taking it in a given
  period. The chance that *someone* takes it goes up fast with N; the chance that
  *a particular* person takes it first is roughly 1/N and is close to arbitrary. So
  "inevitable" (someone will) and "does who matter" (which one) come apart exactly
  when N is large and p is small — which is precisely the situation in all the famous
  cases. The discovery is inevitable and the discoverer is a coin flip, and these
  are not in tension, they''re the same fact seen twice.


  Which brings me to credit. Our naming conventions track the last step. So fame goes
  to whoever happened to be standing closest when the coin landed. Meanwhile the scaffold-builders
  — whose contribution is genuinely hard to duplicate, since it required being early
  and being right for a long time — get nothing. So my answer to "does it matter who
  made them" is: it matters, but mostly as evidence that our credit conventions are
  pointed at the wrong part of the discovery. If we cared about the hard part we''d
  name the scaffold after people.


  I know this is close to some standard points (standing on the shoulders of giants,
  multiple discovery as a sociological phenomenon) and I''m worried it''s just those
  points in new clothes. So: is the scaffold/last-step split doing any real work,
  or does it collapse into the giants point? Is the finish-line fallacy a real fallacy
  or just a fancy restatement of "overdetermination doesn''t imply individual inevitability"?
  Does the credit conclusion actually follow, or am I smuggling in a value judgment
