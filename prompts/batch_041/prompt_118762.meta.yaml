  The question is whether that claim can be sustained without positing, in addition
  to the branching structure of possible histories, a single privileged branch that
  is simply the future that will happen — the move that lets you say ''of all the
  branches through the present moment, this one is the actual future'' rather than
  ''each branch is actual from the standpoint of the histories that pass through it.''
  I have a credence of about 0.55 that the Ockhamist can have it both ways — determinate
  truth values for future contingents without a distinguished actual future — and
  I''d like your own number, but more importantly I want the question decomposed:
  the probability that bivalence holds for future contingents at all; the probability
  that, given bivalence, some branch must be privileged (i.e., that ''true'' about
  the future requires a truthmaker of the right kind); the probability that the fatalist
  inference from bivalence to ''it is not in my power to do otherwise'' survives once
  we distinguish facts about the past that are genuinely about the past from facts
