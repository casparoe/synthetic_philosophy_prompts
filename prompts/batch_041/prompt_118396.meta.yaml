  Draft:


  "I''m presenting a paper at a two-day workshop on rationality and agency next month,
  and I want a Q&A prep sheet. Here is the thesis. Money-pump arguments against intransitive
  or cyclic preferences are usually taken to show that such preferences are irrational:
  an agent with a preference cycle can be led, by a sequence of choices each of which
  she welcomes at the time, to a position she regards as strictly worse, and any agent
  who can be separated from her money that way is defective. I argue that this reading
  depends on an assumption nobody states: that the agent''s preferences are stable
  across the steps of the pump, so that the preference she acts on at step three is
  the same preference she would have endorsed at step one. Drop that assumption and
  the pump no longer demonstrates irrationality; it demonstrates only that the agent''s
  preferences change as she moves through the sequence. I distinguish two things the
  pump might be said to establish: a synchronic defect (the agent''s preference set
  is internally inconsistent at a single time) and a diachronic defect (the agent
  cannot act so as to satisfy her preferences over time). I argue the pump only ever
  establishes the diachronic defect, and that the diachronic defect is not a defect
  at all, because an agent whose preferences are indexed to her circumstances at each
  moment — I call her the shifting agent — is perfectly coherent at every moment,
  and the money she loses is a fair price for the coherence she keeps. My positive
  claim is that the money pump is best understood not as an argument for consistency
  but as a device that measures something else: the strength of an agent''s second-order
  preference to have settled, non-revisable ends. An agent who pays to be rid of a
  cycle is not buying consistency; she is buying the resolution of her own preferences,
  and that is a distinct good.


  The audience is a mixed one, and I want the objections I''ll actually get from each
  part of it. There will be: three or four decision theorists of the revealed-preference
  stripe, who think any talk of second-order preferences is unscientific and will
  want to know what choice behavior could possibly distinguish the shifting agent
  from an ordinary intransitive agent; two philosophers who have written on money
  pumps and will insist the pump can be run without any stability assumption, by arranging
  the sequence so that the agent''s preferences at each step are fixed in advance;
  one philosopher of action in the planning-theory tradition, who will say the whole
  discussion has missed the point, which is that diachronic agency requires a kind
  of self-governance that the shifting agent simply does not have; and one psychologist
  who studies preference reversals and wants to know what, empirically, would count
  as evidence for or against my view.


