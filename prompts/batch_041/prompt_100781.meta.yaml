  Facts:

  - The problem of old evidence: formulated by Clark Glymour (in "Theory and Evidence",
  1980). The issue: Bayesian confirmation requires P(E|H) > P(E) for E to confirm
  H. But if E is already known with certainty, P(E)=1 and P(E|H)=1, so no confirmation.
  Classic example: Mercury''s perihelion precession was known before GR; GR "explains"
  it, and this was a major point in its favor, yet Bayesian conditionalization can''t
  capture that because P(E)=1.

  - Actually, is the perihelion example one where the evidence was known? Yes, the
  anomalous precession of Mercury was known (Le Verrier, 1859) and was a long-standing
  puzzle; GR explained it. This is a standard example (though sometimes the light-bending
  example is used).

  - Conditionalization: P_new(H) = P_old(H|E). If P_old(E) = 1, then P_old(H|E) =
  P_old(H), no change.

  - Solutions: (1) Garber''s (1983) approach: the "old evidence" problem is a problem
  of how to model the change in the probability function when a hypothesis is added
  to your repertoire; use the probability function from before you knew E, but apply
  the *new* hypothesis. Actually Garber distinguishes learning E vs. learning H, and
  says we should conditionalize on H (or rather, the relevant change is coming to
  entertain/assign probability to H). (2) The "counterfactual" / hypothetical approach
  of Howson & Urbach: consider what your degree of belief in E would have been had
  you not known it. (3) Eells (1985?) "the problem of old evidence as a problem of
  new theories" — distinguishing. (4) Joyce, Earman.

