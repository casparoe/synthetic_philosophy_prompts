  3. He says the condemned is killed twice: once by the sentence (social death) and
  then physically.

  4. He addresses the objection that abolition would be weak on crime / that some
  crimes (the Nazis, torturers) deserve death — he maintains the state shouldn''t
  kill.

  5. He notes that no human being is qualified to pass an absolute judgment / that
  killing a man is the ultimate denial of the possibility of change.

  6. He mentions the Catholic Church''s position and the death penalty''s role in
  class society (poor people get executed more).

  7. He mentions the spectacle and the fact that executions are now hidden from the
  public (no longer public), which he sees as a sign of bad conscience.

  8. He says the death penalty is the archetype of the "logical crime" — in The Rebel.


