  / "clear intent of the voter" standard was central. Analyzing it through epistemicism
  vs. supervaluationism: the "clear intent of the voter" standard is vague; epistemicism
  says there''s a fact of the matter about whether a given ballot counts, just unknowable;
  supervaluationism says there''s no fact of the matter, but there''s a definite answer
  when all precisifications agree. This is a great fit — real episode, common knowledge,
  and the vagueness angle is "in the weeds" without requiring niche citations.


  Also could mention the sorites-style "how many votes needed" issues, and the paradox
  that if the standard is vague, no recount procedure can be both accurate and determinate.


