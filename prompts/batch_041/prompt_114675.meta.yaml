  it assumes the tower is a ladder of increasing fitness; it gives no account of a
  system that moves *down* the tower; it has nothing to say about the incentives that
  determine which level a practice operates at; the "Popperian" label conflates two
  things (inner simulation vs. falsificationist method); Dennett''s framework also
  presupposes that the environment provides a stable feedback signal, but here the
  feedback signal (publication) is decoupled from the world.

