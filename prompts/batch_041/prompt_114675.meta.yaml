  collaboration, preregistered predictions. The theory says a Popperian creature''s
  hypotheses die in its stead; the crisis shows a population that looked Popperian
  (explicit hypotheses, statistics) but was Skinnerian under the hood.

  - Gregorian: statistical software, preregistration platforms, the p-value threshold
  as a thinking tool, meta-analysis, journals. Tools that were supposed to install
  Popperian discipline but were co-opted. Also the point that Gregorian tools can
  be adopted without the Popperian capacity to evaluate them — e.g., using NHST without
  understanding what it tests.

