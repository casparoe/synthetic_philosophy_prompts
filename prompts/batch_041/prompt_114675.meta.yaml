  not a guarantee; the levels can be *decoupled* — you can have the Gregorian tools
  without the Popperian competence; the theory needs a notion of "level collapse"
  or "level capture"; and the case is one the theory never anticipated (a case where
  the cultural tools actively suppress the Popperian level).


