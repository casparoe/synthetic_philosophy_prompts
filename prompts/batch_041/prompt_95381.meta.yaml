  Draft:


  "Our school''s debating society is holding a motion on whether the United Kingdom
  should abandon the prohibition of cannabis in favour of a regulated legal market,
  and the briefing note circulated by the proposing side leans heavily on a single
  historical analogy. The argument runs roughly as follows: the United States attempted
  to prohibit alcohol in the 1920s; the result was organised crime, illicit stills,
  poisonous liquor and no appreciable reduction in drinking; the experiment was abandoned
  and alcohol is now sold legally and, on the whole, managed. Since the prohibition
  of other drugs has produced the same familiar symptoms — criminal supply chains,
  adulterated products, violence over territory, and a state that spends more on enforcement
  than on treatment — we should conclude that prohibition is the wrong instrument
  altogether and that the sensible course is to legalise and regulate, treating drugs
  roughly as we treat alcohol. The same note adds a subsidiary claim that I found
  striking: that prohibition does not merely fail to suppress a drug but actively
  strengthens it, because a smuggler who accepts the risk of carrying a fixed volume
  has every incentive to carry the most concentrated, most potent form of the substance
  he can — so a ban predictably produces stronger drugs, not weaker ones. The note
  offers this as further confirmation that the alcohol analogy is exact.


  I would like to know how far the analogy actually holds, and I am suspicious that
  it is carrying more weight than it can bear, though I cannot articulate why. Could
  you set out, first, a table of correspondences — what in the alcohol case is supposed
  to map onto what in the drug case (the prohibited substance, the consumers, the
  suppliers, the enforcement apparatus, the surrounding culture, the political coalition
  that secured the ban and the one that ended it)? Second, where the mapping breaks
  down, distinguishing the disanalogies that matter for the conclusion being drawn
  from those that are merely colourful. I am particularly interested in whether the
  alcohol case was really the clean natural experiment the note presents it as — for
  instance, whether it began from a legal, industrialised, culturally entrenched drinking
  culture rather than from a small and marginal base, and whether the ''it did not
  work'' verdict is as settled as the note implies — and whether the potency claim
  is a genuine consequence of prohibition or a separate empirical matter that the
  analogy cannot deliver on its own.


  Third, I should like to know what the analogy quietly imports that the drug case
  may not possess: what does it assume about how a legal market would be structured,
  and does ''regulate it like alcohol'' actually specify a policy or merely gesture
  at one? It would help to test this against a concrete proposal, so please consider
  the following package, which is roughly what our side has drafted: possession for
  personal use to be dealt with administratively rather than criminally, on the Portuguese
  model, with supply remaining a criminal offence; but for cannabis specifically,
  licensed and taxed retail sale to adults, with a cap on potency, a ban on advertising,
  plain packaging, and a minimum price set high enough to discourage heavy use. Is
  the alcohol analogy an argument for that package, against it, or indifferent to
  it? Portugal is often invoked in the same breath as the alcohol case even though
  it decriminalised use while leaving supply illegal, and tobacco is a legal product
  whose use has fallen under exactly the sort of restrictions I have just listed;
  I would be grateful if you could say which of the three — alcohol, Portuguese-style
  decriminalisation, tobacco-style restriction — is the better analogy for what we
  are actually proposing, and why.


  Finally, and most importantly for the debate, I want to know whether the conclusion
  survives the audit. If the disanalogies I have asked about are real, is the case
  for legalisation and regulation weakened, or does it rest on arguments that never
  needed the alcohol parallel at all? Please be explicit about which parts of the
  case are carried by the analogy and which would stand without it."


