  dimension: the strength with which a community holds its norms and its tolerance
  for visible deviance can vary independently, so a community can hold its norms strongly
  while shrugging at private nonconformity, or hold them weakly while punishing anyone
  who breaks them publicly. Second, once the axis is split that way, the normative
  question splits too: coordination arguments (rules settle which of several workable
  equilibria we land in), threat arguments (tightness as risk management under danger),
  and expressive or constitutive arguments (rule-following as the community''s way
  of being itself) each license a different answer, and they can pull apart.


