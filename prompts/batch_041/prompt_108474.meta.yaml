  The problem. In our field, a great many labs, funders, and individual researchers
  can each decide, independently, whether to do or fund a given thing. Some of these
  things are beneficial if done once and harmful if done widely... The phenomenon
  is usually called the unilateralist''s curse: when many actors are each free to
  take an action that is harmful, and each of them is reasonably likely to judge correctly
  that it should not be done, the chance that at least one of them does it anyway
  rises toward certainty as the number of actors grows. The proposed remedy in the
  literature is a norm of restraint, sometimes called a principle of conformity: act
  only when the case for acting is much stronger than it would be if you were the
  only actor, and defer to the considered judgment of others. I do not want a summary
