  Hmm, actually the classic "bootstrapping" (Cohen) is: you can come to know your
  gas gauge is reliable by reading it repeatedly ("the gauge says the tank is full;
  the tank is full (by the gauge); so the gauge is reliable") — an absurd result for
  closure+reliabilism. And "easy knowledge" is the related problem: if you can know
  the gauge is reliable from a single reading plus a priori knowledge, then you can
  know the external world is not a dream ("I have hands; if I have hands I''m not
  a brain in a vat; so I''m not a brain in a vat") without ruling out skepticism.
  The "problem of easy knowledge" is that certain views make knowledge of the external
  world too easy, undermining the significance of skeptical arguments. So the false
  presupposition could be reversed: "Since easy knowledge arguments show that we *can*
  know we''re not brains in vats (via the bootstrapping reasoning), doesn''t that
  mean skepticism is trivially refuted and we can stop worrying about it?" — the false
  presupposition being that the bootstrapping reasoning is a *sound* refutation of
  skepticism, when in fact it''s presented as a reductio against views that license
  it. That''s a lovely inversion: the asker takes a reductio for a proof. Good: "I
  read that Moore-style reasoning (''here''s a hand, so not a brain in a vat'') shows
  knowledge of the external world is easy, so I should stop worrying about skepticism"
