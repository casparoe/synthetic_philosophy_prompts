  Last September I spent a week in a rented house with three friends, and on our final
  night the four of us had dinner at a restaurant in town. One of us, Lena, was over
  from a country where nobody tips and had never eaten out anywhere that tipping is
  expected. When the bill came she worked out her share to the cent, paid it, and
  left nothing on the table. Nobody said anything at the time. On the walk back, Ruth
  and Dan argued about it for twenty minutes, and I''ve been chewing on the question
  ever since without getting anywhere.


  Dan''s case, as fairly as I can put it: Lena did nothing wrong, because a custom
  can only bind someone who has taken it on. You cannot come to owe something by being
  unaware that anyone expected it, and she never agreed to anything. The menu named
  a price and she paid that price. If the people serving us are underpaid, that is
  a matter between them, their employer and the law, and a visitor should not be conscripted
  into repairing a wage system she had no part in building. He also made a point I
  hadn''t considered: a payment that is expected but appears nowhere in writing is
  a hidden charge, and hidden charges make a practice unfair rather than binding.


  Ruth''s case: in a place where tipping is expected, the tip is not a gift but part
  of what the meal costs, and the server worked all evening on that understanding.
  Lena took the benefit of the arrangement and then declined to pay her share of it,
  so somebody''s labour went underpaid and she is the one who kept the difference.
  Ruth put it in a way I thought was interesting: she said Lena did something wrong
  without being to blame for it, because she could not have known — the wrong and
  the fault are two separate things, and Dan keeps running them together. She also
  said that on Dan''s reasoning no visitor could ever be bound by anything local,
  from the way you queue to the shoes you take off at the door, which cannot be right,
  since some of these customs cost particular people real money while others merely
  disappoint an expectation.


