  to policy or to drought), which are about what counts as evidence, and which are
  disagreements about values that no amount of history will settle. My own hunch,
  offered as a hunch, is that the deepest problem is the ledger metaphor itself: that
  the question ''was it, on balance, good or bad?'' assumes the gains and losses are
  commensurable and can be netted, and that one camp is quietly refusing that framing
