  What interests me is that both books describe, by and large, the same events. Nobody
  denies that the railways were built or that the 1876–78 famine killed a great many
  people; the arguments are about what those facts add up to. Reviewers have gone
  after Tharoor''s numbers — several are secondhand and decades old — while granting
  the force of the indictment, and sympathetic readers of Ferguson concede the massacres
  and the famine deaths while keeping the net verdict positive. Twenty years of this
  and the two camps are where they started.


