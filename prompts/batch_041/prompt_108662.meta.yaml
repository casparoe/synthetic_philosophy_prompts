  ---


  I have a question about historical explanation that I have not been able to resolve
  by reading around, and I would like to know whether the thing I am describing has
  a name, and if not, whether it can be named and delimited.


  The thing I keep running into is this. When I ask why some large event happened
  — a war, the collapse of a regime, the failure of a business — the explanation I
  am given is usually a list. Each item on the list is defended in one of two ways.
  Some items are defended counterfactually: had it been absent, the event would not
  have happened. Others are defended by the opposite claim: had it been absent, the
  event would have happened anyway, because something else on the list would have
  produced it. Nobody seems to notice that these two defences pull in opposite directions,
  and that a list of items each of which is claimed to be indispensable is a different
  object from a list of items each of which is claimed to be dispensable.


  Then there is a second thing, which is what actually puzzles me. In some cases —
  I am thinking of the collapse of the Eastern bloc, or the end of a long-running
  institution I used to work for — it seems true both that some such event was going
  to happen, and that the event which happened was not inevitable in any of its details.
  The war would have come anyway, but the war that came had this alliance structure,
  this duration, this peace. The institution was going to close, but the closure that
  occurred was a different closure: different debts, different people, a different
  last day. When people say the outcome was inevitable, they seem to slide between
  ''some outcome of this kind'' and ''this very outcome'', and the slide is what makes
  the claim feel both undeniable and empty.


  Third: in these cases, the search for the decisive cause never terminates. Every
  generation of historians finds a different one, and I have come to think this is
  not a failure of evidence but a structural consequence of the situation I am describing
  — that when several candidates would each have sufficed, no counterfactual test
  can single one out, and yet the question ''which was the real cause?'' continues
  to feel like a factual question with an answer.


  I have tried to fit this to things I have read. The philosophical literature on
  cases where two independent causes would each have produced the same outcome — the
  firing squad where every rifleman''s shot would have killed the prisoner — seems
  to be about whether we may call any single shot the cause of death. That is close,
  but the puzzle there is about our concept of causation, and the prisoner''s death
  is the same death whichever bullet does the work; nothing hangs on which. In history
  it does hang on which: the outcome''s identity depends on which of the redundant
  routes is taken. [Careful: "the outcome''s identity depends on which route is taken"
  — but then the outcome isn''t the same outcome... yes, that''s the puzzle.] I have
  also seen the suggestion that where an outcome is guaranteed by many causes, the
  causes should not be ranked at all, only cited. That seems to me to give up too
  easily, and it does not tell me what to say about the details.


  So: is there a name for this configuration — for the situation in which the occurrence
  of an event is guaranteed by redundant causes while the character of the event is
  not, together with the consequences this has for how we explain it? If there is
  no name, please coin one and define it, and tell me where its edges are. In particular
  I would like to know: (i) how it relates to, and differs from, the nearest things
  I might be confusing it with — the firing-squad cases, cases of one cause pre-empting
  another, and the idea that different paths can reach the same end state; (ii) whether
  the ''why then?'' question, or the question ''which cause was decisive?'', is genuinely
