  Domain: Lobbying, campaign finance, money in politics.

  Type: Ask what philosophical commitments a practice/policy/institution presupposes.


  Prompt:


  "I''m a junior taking a seminar on money and politics, and I keep hitting this wall.
  We''ve spent weeks on the usual stuff — Buckley, Citizens United, disclosure, caps
  — and then last week we had a guest speaker who works for a state ethics commission.
  She described the actual regime in her state, and it''s weirdly lopsided: direct
  contributions to candidates are capped at a fairly low number and have to be itemized,
  but lobbying is basically uncapped and only regulated by disclosure — you register,
  you report what you spend and who you meet, but you can spend as much as you want
  and meet anyone. Meanwhile independent expenditures are uncapped and only disclosed.
  So the same system treats a $2,700 check to a candidate as a corruption risk worth
  capping, but a $2 million lobbying campaign aimed at the same official as something
  we just need to know about. What philosophical commitments does that split presuppose?
  I don''t mean the legal doctrine, I mean the underlying theory: does it assume corruption
  is only quid pro quo and not access or ingratiation? Does it assume voters have
  a right to know but not a right to equal influence? Does it assume money is speech
  in one place and property in another? And is the split actually coherent, or is
  it just a historical accident that different theories got attached to different
  parts?"


  Then second paragraph: "What I''d really like is for you to reconstruct the implicit
  theory of the practice — what view of political equality, representation, and the
  point of elections it only makes sense under, which rival views it quietly rules
  out, and which parts are underdetermined so that several theories would license
  the same rules. Then tell me what would have to change if we replaced the presupposed
  view with a strict equal-influence view or with a libertarian view that says all
  spending is speech. Also, is there a reading where the split is not inconsistent
  but actually presupposes a single theory — like a theory that distinguishes contributions
  (which go to the candidate and can be owed) from lobbying (which is just petitioning)
  — or does that distinction collapse? I''m trying to write a paper on this and I
  want to avoid just repeating the standard takes."


