  Draft:


  I''ve been drafted to cover a session in a second-year interdisciplinary seminar
  called something like "Big Questions in Human History" -- fifteen students, eighty
  minutes, a whiteboard, and a mix of history, econ and biology majors, none of whom
  have taken any anthropology. The topic is the agricultural revolution, and I want
  to run it as: was it a mistake? I''ve got the usual two anchors in mind, Sahlins''
  line that foragers were the original affluent society because affluence is really
  a ratio of wants to means -- you can get there either by producing more or by wanting
  less -- and Diamond''s counterblast that farming was the worst mistake in human
  history, with the health evidence from early farmers'' skeletons. My problem is
  that I can already hear the whole thing collapsing into a mush. The econ students
  will hear "affluent" and think "high GDP per head", the history students will talk
  about agriculture as though a committee sat down and chose it, and everybody will
  want to answer "was it a mistake" as if it were one question rather than at least
  three (a mistake for the people who did it? for individual human welfare? for the
  species? judged from now or from then?) -- and then there''s the counterfactual
  problem, which is that the comparison is always against a forager life that those
  particular people didn''t actually have available.


  So what I want from you is not the content but the plan. What has to come first
  for the question to even be askable -- I have a feeling the definitional move about
  wants and means has to land before any of the empirical stuff, because otherwise
  "affluent" is just doing free advertising for one side, but tell me if I''ve got
  the dependency order wrong. Then: what''s the one case that should carry the whole
  eighty minutes, and what does it have to have and not have? I was going to hang
  everything on the transition in the Fertile Crescent, and I''m not sure that''s
  right -- I worry that a single region lets the students think the answer is "well,
  in that valley it was a mistake", and that any one place smuggles in local conditions
  (climate, what was available to domesticate) that are doing the explanatory work.
  If there''s a better carrying case, or if the honest answer is that no single case
  can do it and I should run two in parallel, say so.


  Then the misconceptions, in the order they''ll actually show up, with the exact
  point in the sequence where I should head each one off: the GDP reading of affluence;
  the "they chose it" reading (I want them to see agriculture as a slow, unplanned
  ratchet rather than a decision, and I''m not sure how to do that without a whole
  lecture on domestication); the individual-versus-population slide, where farming
  looks terrible for the people doing it and great for the number of people doing
  it, and nobody notices they''ve swapped the unit of evaluation mid-sentence; the
  idea that farming caused inequality (I''d like them to at least see that the two
  come apart, and that some foragers were neither mobile nor equal); and the moralizing
  ending where somebody asks whether we should all go back to foraging. Also one question
  I can put to them in the last ten minutes that will tell me whether they''ve understood
  the question rather than picked a side. And finally: what should I openly refuse
  to settle, and say out loud that I''m refusing -- I''d rather leave them with a
  clean sense of what''s genuinely unresolved than a tidy verdict. No reading list,
  please; they won''t do it and it isn''t the point.


