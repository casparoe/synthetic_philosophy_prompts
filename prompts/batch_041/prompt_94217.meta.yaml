  The distinctions we care about, in roughly the order they should sort people, are
  these. First, whether phenomenal consciousness is a threshold property that some
  animals have and others lack, or something that comes in degrees along separable
  dimensions — richness, valence, temporal thickness, unity into a single subject
  — so that a question like whether a bee is conscious may be ill-formed until you
  say which dimension and where the line falls. Second, whether your criterion of
  attribution is a set of behavioural and physiological markers that nearly everyone
  accepts as evidence (flexible goal-directed behaviour, trade-offs between pain and
  other motivations, self-administration of analgesics, rebound after anaesthesia)
  or is derived from a substantive theory of consciousness, in which case your verdicts
  will shift with the theory: global-workspace, recurrent-processing, and higher-order
  accounts do not carve the animal kingdom the same way. Third, whether valenced experience
  can come apart from mere phenomenal presence, so that an animal might have experiences
  with no good or bad feel to them, or vice versa. Fourth, whether attribution requires
  a single integrated subject rather than a federation of semi-autonomous sub-systems.
  Fifth, how far a positive result in one species licenses an inference about its
  whole clade.


