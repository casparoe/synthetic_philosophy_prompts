  Draft:


  At a departmental workshop on the methodology of scientific research programmes,
  I watched two colleagues, A and B, disagree about how Lakatos''s framework should
  classify a research programme I will call the cascade programme. Its hard core is
  the claim that every fundamental interaction is mediated by a discrete cascade of
  intermediate states with characteristic masses. Its protective belt contains a screening
  rule that explains why some cascade members are not detected at low energies, a
  combinatorial principle that fixes the multiplicities of the cascade, and a set
  of auxiliary assumptions linking cascade multiplicity to decay rates. The programme
  began by explaining a known anomaly in certain decay rates. It then predicted a
  new resonance at a specific energy. The first search found nothing. The group added
  the screening rule, and a later experiment reported a broad bump near the predicted
  energy. The group counted this as a novel confirmation. It has since predicted two
  further effects: one was confirmed, one remains untested. The combinatorial principle
  has been revised twice, each time to accommodate new decay-rate data, and each revision
  has generated a new prediction about angular correlations.


  A says the programme is progressive. It predicted a novel resonance, the bump confirmed
  it, and the positive heuristic is still generating new predictions. That is exactly
  the pattern Lakatos calls a progressive problemshift.


  B says it is degenerating. The bump was not a novel prediction in the relevant sense:
  the group only reached it after inventing the screening rule to explain the failed
  search, and the bump was already present in older data. The combinatorial principle
  has been repeatedly adjusted to fit known decay rates, so its predictions are not
  risky. The angular-correlation prediction is untested. On B''s view, the programme
  is a series of ad hoc rescues, and A is confusing heuristic fertility with empirical
  progress.


