  or whether the data already existed; it is about whether the fact was used in constructing
  the theory. The screening rule was independently motivated by the combinatorial
  principle, and the bump''s energy followed from that principle before the later
  experiment. A adds that Lakatos explicitly rejected the falsificationist demand
