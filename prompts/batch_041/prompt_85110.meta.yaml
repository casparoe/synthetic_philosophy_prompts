  Draft:


  "I teach a graduate seminar that sits between metaphysics, tort law, and the ethics
  of technology, and this term''s topic is causation by omission. I would like a one-page
  handout in the form of a decision tree, not a literature survey.


  Set the starting point at the claim a student can actually accept or reject: an
  omission can be a cause of the outcome that followed it. From there, every branch
  node must be a question that separates the views below it, and every leaf must be
  a position on the status of omission causation, named and stated in one sentence,
  followed by one further sentence on the commitment that position has the hardest
  time defending.


  The tree must work through at least these five questions, and may add others only
  if they do independent work:

  1. Are omissions among the things that stand in causal relations at all, or is ''omission''
  merely a way of describing an agent in the light of what they did not do?

  2. Is counterfactual dependence enough for causation by omission, or is it only
  a symptom of it, so that the real cause is always some positive event or standing
  condition?

  3. When we single out one omission from the indefinitely many conditions of a harm,
  does that selection reflect a further causal fact, or does it reflect the norms,
  duties, and expectations we bring to the case?

  4. Does the difference between doing and allowing mark a difference in what happens
  in the world, or only in what we may demand of the agent?

  5. Does a single account have to cover both failing to prevent a harm and failing
  to continue a course of action that was keeping the harm away?


  I want the tree built from the logical space first: show the combinations of answers
  the questions allow, locate the named positions in that space, and mark the combinations
  that no one occupies, with a brief diagnosis of whether the view is incoherent,
  merely unattractive, or simply unexplored.


  Test the tree against these cases, and say where each one lands:

  - a landlord who never repairs a boiler, and a tenant who dies of the fumes;

  - a doctor who does not order a test that would have caught a treatable cancer;

  - a hospital team that switches off a ventilator it had been running for a week;

  - an engineer who ships a system without running the test that would have caught
  the fault, and an outage follows;

  - a content-moderation system that does not take down a post that is followed by
  a riot;

  - a government that does not fund flood defences, and a town floods;

  - a passer-by on the bank who does not throw the rope that is within reach;

  - a person who stops paying for a medicine they had been paying for, and the patient
  deteriorates.


  Two constraints on the leaves. First, label each leaf with the position''s name,
  but do not attribute positions to authors or works; I want the tree to stand on
