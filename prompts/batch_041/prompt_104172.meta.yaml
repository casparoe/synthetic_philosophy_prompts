  \ The novel's central scene is a forced selection: a woman is told that if she does\
  \ not choose which of her two children will be taken, both will be. I want a reading\
  \ that takes the philosophical literature on hard choices seriously and then says\
  \ where the novel refuses it.\n\nSome distinctions I want you to work with, since\
  \ they don't all carve the same joint. First, incommensurability in the strict sense:\
  \ no common measure by which the options can be ranked. Second, parity: a relation\
  \ some philosophers posit as a fourth comparative — neither better, nor worse, nor\
  \ equal — so that the choice is hard even though both options are good. Third, the\
  \ dilemma proper: not a failure of ranking but the absence of any permissible option,\
  \ so that whatever one does one does wrong. Fourth, the remainder: the thought,\
  \ associated with agent-regret, that a justified choice can still leave a residue\
  \ that the justification does not cancel — that the agent is not let off the hook\
  \ by having chosen well.\n\nSophie's case is usually filed under the first or second,\
  \ but it looks more like the third: what is hard is not the comparison but the fact\
  \ that she must act at all, and that she is coerced into being the author of a loss\
  \ she would never authorize. Consider what follows. The novel does not end with\
  \ the choice; it ends with a woman who cannot live inside the justification anyone\
