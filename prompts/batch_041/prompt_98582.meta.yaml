  Bootstrapping/easy knowledge: cases about whether a belief-forming method can be
  self-endorsed — e.g., a person who looks at a gas gauge, a person who reads a thermometer,
  a person who judges color, a person who trusts a newspaper''s reliability claim,
  etc. Verdicts on whether each is easy knowledge or bootstrapped. Then a new case.


