  Evidential cooperation in large worlds: Let me recall the details more precisely
  to avoid saying something wrong.


  Evidential Decision Theory (EDT): choose the act with maximal evidential expected
  utility, where the value of an act is the sum over outcomes of P(outcome | act)
  * V(outcome). In a Newcomb problem, one-boxing is evidence the predictor put $1M.
  In a prisoner''s dilemma against a copy of yourself (or a sufficiently similar agent),
  cooperating is evidence the other cooperates, so EDT cooperates.


  "Evidential cooperation" refers to the idea that even in one-shot interactions,
  agents with correlated decisions should act as if they''re cooperating. The "large
  worlds" angle: in a large (e.g., infinite) universe, there are infinitely many agents
  in a situation exactly like yours. If you use EDT, the expected utility of your
  action is dominated by the infinite expected value from the behavior of those evidential
  counterparts. This can lead to "infinite utility" problems and to the conclusion
  that you should choose acts that would be best if everyone relevant chose them (Kantian
  generalization).


  Potential pitfalls in the argument: (a) In a truly infinite universe, the probabilities/expected
  utilities may be undefined or the dominance reasoning may not work; (b) "my choice
  is evidence about what similar agents do" — but after I''ve already deliberated,
  my choice isn''t evidence about *their* choices in the relevant way, because conditionalizing
  on my own choice requires a specific evidential model; if we''re not causally connected,
  the correlation is only from a common cause (our shared dispositions), and my *act*
  is not evidence about *theirs* once I know my own decision procedure? Actually EDT
  does treat your act as evidence about others if you haven''t fixed your policy.
  There''s a debate about "ratification" and whether EDT''s recommendations are unstable.
  (c) The argument may equivocate between "agents exactly like me" and "agents who
  will make the same choice" — the evidence relation is symmetric but the conditional
  probabilities need to be well-defined; (d) In an infinite universe, there are also
  infinitely many agents like me choosing each possible action, so the evidence is
  washed out — if there are infinitely many copies choosing cooperate and infinitely
  many choosing defect, conditional probabilities may be undefined. That''s a real
  subtle flaw: in large worlds, the existence of infinitely many counterparts for
  each action may destroy the evidential relevance of my own act.


