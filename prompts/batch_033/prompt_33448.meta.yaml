  - The hole argument: take a region H (the "hole") where T = 0 (no matter). Consider
  a diffeomorphism φ that is identity outside H and on a Cauchy surface before H but
  non-identity inside H. Then φ*T = T everywhere (since T=0 in H and φ identity outside),
