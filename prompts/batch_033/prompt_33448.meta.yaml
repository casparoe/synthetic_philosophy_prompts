  agreeing on all points outside H and on the initial data, but differing inside H.
  If substantivalism says these represent distinct physical possibilities, then the
  same initial data yields different developments inside H — indeterminism. Since
  GR should not be indeterministic in this way (or since indeterminism is a cost),
  substantivalism is in trouble. The escape: deny that the two models represent distinct
  possibilities (Leibniz equivalence), which is arguably to abandon a certain kind
  of substantivalism (haecceitistic substantivalism) — or adopt "sophisticated substantivalism"
  (points have no primitive identity), or relationism.


