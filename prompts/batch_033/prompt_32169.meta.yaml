  ---


  I''ve been going back and forth about the Knobe effect and would like an essay to
  help me sort it out. The basic setup, in case you havent seen it: a chairman is
  told a new policy will raise profits and also harm the environment; he says he doesn''t
  care about the environment at all and only wants to make as much money as possible;
  the policy goes ahead and the environment is harmed. Most people say he harmed the
  environment intentionally. But when the same chairman is told the policy will raise
  profits and help the environment, and he says the exact same thing — he doesn''t
  care about the environment, he only wants profit — most people say he did not help
  the environment intentionally. So the exact same state of mind (knowing the side
  effect will happen, not caring, acting anyway) gets classified as intentional when
  the side effect is bad and not intentional when it''s good.


  The interesting fight is over what this shows. One camp says it shows that our ordinary
  concept of intentional action is itself shot through with moral evaluation — that
  we can''t apply the concept without, in effect, deciding whether the outcome is
  the kind of thing the agent deserves blame or credit for. Another camp says it''s
  a deflationary artifact: maybe the harm case involves accepting a cost (the harm)
  in exchange for a benefit (the profit), while the help case involves no such trade-off,
  so people aren''t really tracking morality, just whether the side effect counted
  against the agent''s aims. A third view says the judgment of blame comes first and
  the "intentional" answer is just a post-hoc way of justifying blame (or that the
  answer tracks whether the side effect reveals something about the agent''s deep
  self). And then there''s the possibility that the effect is just a performance slip
  — people are using the word sloppily and would correct themselves if they thought
  about it harder.


