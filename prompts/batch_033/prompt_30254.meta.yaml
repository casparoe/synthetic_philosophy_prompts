  I work as a software engineer, and after years of building products on top of machine
  translation APIs I still can''t say what I think these systems are doing. I''ve
  read the essays that call statistical translation shallow and mindless, and they
  feel right to me, but I can''t tell which of my own reactions they actually support.
  I''d like you to extract a principled position from my gut verdicts on a batch of
  cases. I don''t have formal philosophy training, so please keep the answer precise
  but as plain as you can, and be explicit about which of my verdicts can''t all be
  kept.


  My verdicts, roughly as they come:


  1. Two systems, one a rule-based system built from a hand-written grammar and a
  lexicon of a few thousand words, the other a transformer with hundreds of billions
  of parameters, produce identical translations on a 500-sentence technical manual
  I use for regression testing, including the same three errors. My gut says the rule-based
  system understands the manual''s language in a thin but real way, and the large
  model does not. I dislike that this makes understanding depend on what''s inside
  the box rather than on behavior, but the reaction is stable.


  2. The large model translates "The trophy wouldn''t fit in the suitcase because
  it was too big" correctly, resolving "it" to the trophy. Given "The trophy wouldn''t
  fit in the suitcase because it was too small," it again resolves "it" to the trophy,
  producing a sentence that says the trophy is too small to fit. The second error
  bothers me more than the first success reassures me: the first was probably a high-probability
  pattern from training, and the second shows the system has no grip on how sizes
  work.


  3. A system trained only on parliamentary transcripts and newspaper text is asked
  to translate a menu item and a slang sentence. It produces fluent, confident translations
  that are completely wrong. I read that as strong evidence against understanding:
  a system that understood would either get it or flag uncertainty. The confidence
  is what bothers me most.


  4. A system translates a long German compound it cannot have seen — a word meaning
  "the badge on a river-shipping captain''s cap" — correctly, by decomposing it into
  parts. I want to credit this as understanding, because it did what a human with
  morphological knowledge would do. But I know the subword tokenizer is doing pattern
  matching below the word level, so I suspect I''m being taken in.


  5. The same large model as in (1) and (2) translates a sentence correctly but, when
  I then ask it "Who did what to whom?" about that sentence, it cannot answer. My
  verdict: correct translation without the ability to answer a simple comprehension
  question isn''t understanding; it''s a transformation between surface forms.


  6. Given the sentence "Colorless green ideas sleep furiously," the model produces
  a confident, fluent translation. I treat this as a failure of understanding even
  though there is arguably no correct translation: a system that understood would
  recognize that the input is semantically defective. But a human translator asked
  to translate it might also just produce a fluent version, so I worry this verdict
  is unfair.


  7. A person who has studied a language for a week, knows roughly 500 words and a
  grammar book, translates a simple sentence, with errors. I unhesitatingly credit
  them with understanding. So my criterion can''t be "makes errors" or "has a small
  vocabulary." Yet I denied understanding to a system with vastly more knowledge.
  I need to know whether that asymmetry can be defended or whether it''s chauvinism
  about biology.


  Is there a principle — or a small set of candidate principles — that captures all
