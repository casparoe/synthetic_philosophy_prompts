  Self-deception: The paradox is that self-deception seems to require both knowing
  p and believing not-p, which conflicts with ordinary views. Accounts:

  - Intentionalist: the person intentionally gets themselves to believe not-p. Problem:
  if they intend to deceive themselves, they know the truth, so how can they succeed?
  Also "deception" requires one person deceiving another; self-deception is metaphorical.

  - Deflationary/anti-intentionalist (Mele): self-deception is not intentional; it''s
  a motivated false belief produced by biased belief-formation (desire-driven misinterpretation
  of evidence). The person desires p, treats evidence for p as stronger than it is,
  ends up believing p despite evidence.

  - Alfred Mele''s conditions: (1) S believes p is false; (2) S desires p to be true;
  (3) S treats data relevant to p in a motivationally biased way; (4) this biased
  treatment causes S to acquire belief that p; (5) the biased treatment is not intentional...
  etc.

  - "Twisted" self-deception: believing something bad about oneself (e.g., that one''s
  spouse is cheating) when evidence is against it, motivated by fear? Mele discusses
  twisted cases where the false belief is unpleasant, motivated by fear or by a desire
  to avoid being hurt (better to believe the worst now?). Hmm.


