  I am a PhD student in moral psychology, and I have been trying to get clear on what
  separates a moral preference from a moral bias. The distinction matters for how
  I describe and respond to disagreement: I am inclined to respect or at least not
  pathologize preferences, but I regard biases as defects that the person has reason
  to correct. Yet my own verdicts on cases resist any simple formulation I have tried.
  Here are the cases and what I find myself wanting to say about each.


  1. A colleague avoids restaurants serving cuisines she did not grow up with. She
  says the unfamiliar smells and textures genuinely bother her, and she has tried
  several such dishes and disliked them. I want to call this a preference — an aesthetic
  or gustatory one — and not a bias, even though it tracks cultural unfamiliarity.


  2. A hiring manager choosing between two equally qualified candidates selects the
  one who attended the same university he did, explaining that the candidate seems
  like a better fit and easier to imagine working alongside. I want to call this a
  bias, a form of in-group favoritism, and not a legitimate preference about workplace
  fit.


  3. A man says he would not date members of a certain racial group because he is
  simply not attracted to them, and he reports that this is a stable, unchosen pattern
  of feeling rather than a decision. I want to call this a bias, even though it is
  experienced as an involuntary taste. The involuntariness does not move me.


  4. A vegan refuses animal products because she judges that factory farming is a
  serious wrong and that purchasing those products would make her complicit in it.
  I want to say this is neither a mere preference nor a bias; it is a moral conviction,
  even though it was surely shaped by upbringing and by the particular arguments and
  images she happened to encounter.


  5. A religious believer opposes same-sex marriage on the ground that his tradition
  teaches that marriage is between a man and a woman, and he regards the tradition
  as authoritative. I find myself wanting to call this a bias, but I cannot state
  what makes it different in kind from case 4. Both are comprehensive moral convictions,
  both are partly inherited, and both are held with some resistance to contrary argument.


  6. A physician who sincerely disavows any racist belief nonetheless, when working
  under time pressure, prescribes less pain medication for Black patients than for
  white patients with the same presentation, in a pattern that tracks an implicit
  association test. I want to call this a bias, clearly, and not a preference at all,
  since the physician does not endorse it.


  7. A donor gives several thousand dollars each year to a well-run local food bank
  rather than to a highly effective global health charity, saying that his obligations
  lie first with his own community and that he cares more about people whose lives
  he can see. I am torn. Part of me says this is legitimate partiality, a preference
  about where to direct one''s aid. Part of me says it is a parochial bias, because
  the same money could prevent far more death and suffering elsewhere.


  8. A person eats pork but would not eat dog, explaining that dogs are companion
  animals in his culture while pigs are food animals. I am unsure. It feels like a
  bias, a culturally inherited disgust that does not track any morally relevant difference;
  but I can also see it as a preference internal to a culinary tradition, much like
  case 1.


  My question is whether there is a single principle, or a small set of candidate
  principles, that captures these verdicts, or nearly all of them, without being gerrymandered.
  Specifically: what feature distinguishes case 1 from case 3, if both are aversions
  the person did not choose? What feature distinguishes case 4 from case 5, if both
  are inherited moral convictions? And what should I conclude about cases 7 and 8,
  where I am torn? If no principled account can accommodate every verdict, I want
  to know which verdicts I should revise and why. Please state the principle precisely,
  indicate which case or cases motivate each of its clauses, apply it to a case I
  have not listed — a university admissions officer who gives some weight to an applicant''s
  being the first in their family to attend college — and be explicit about which
  of my verdicts, if any, the principle cannot accommodate.


