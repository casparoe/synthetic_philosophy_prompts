  Let me recall the 2D account of the necessary a posteriori:

  - "Water is H2O" is true at all worlds (secondary intension necessary) because ''water''
  refers rigidly to H2O.

  - The sentence is a posteriori because to know it''s true one must know that the
  actual world is one where the watery stuff is H2O; the primary intension is true
  at worlds where the watery stuff is H2O, false at Twin Earth-like worlds. So the
  primary intension is contingent, and that contingency plus a posteriori knowledge
  of actuality explains why the sentence is informative.

  - The 2D framework explains the necessary a posteriori: a sentence is a posteriori
  iff its primary intension is not necessary (i.e., false at some epistemically possible
  world), while it is metaphysically necessary iff its secondary intension is true
  at all worlds. ''Water is H2O'' has a contingent primary intension (Twin Earth)
  and a necessary secondary intension.


