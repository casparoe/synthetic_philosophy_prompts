  a, and R'''' relating R'' to R, etc. Bradley concludes relations are unintelligible/contradictory,
  and therefore reality is a seamless whole (monism); plurality and relations are
  appearance. The unity of the proposition version: if the proposition "a is F" is
  unified by the relation of predication connecting a and F, then we need a further
  relation connecting the predication relation to a and F, and so on — so how does
  any proposition manage to be a unity rather than a list? Russell''s early view (The
  Principles of Mathematics, 1903) treated relations as real and held the regress
  is harmless/not vicious; later in "On the Propositions: What They Are and How They
  Mean" (1919)? Actually Russell discussed Bradley''s regress in multiple places.
  In the proposition case, Russell''s 1903 view: relations "relate" their terms without
  needing a further relation — the relation is "in" the relating; the regress is generated
  only if you insist that relating itself is a relation that must relate to the terms,
  which is a mistake. This connects to the "unity of the proposition" problem and
  Frege''s concept/object saturation. It''s in the weeds and good.


