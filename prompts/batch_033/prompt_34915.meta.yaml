  Final prompt text:


  I keep noticing a pattern in competitive situations and I want to know whether it
  has an established name, or whether I should coin one. The familiar version is what
  I would call a race to the bottom: everyone keeps lowering the same variable — prices,
  safety standards, wages — and the group converges on a bad value of that same variable.
  But the pattern I have in mind is different.


  Consider how AI labs publish capabilities. At each point, a lab looks at what the
  others are doing and judges, reasonably, that it must publish quickly or lose standing
  and the ability to attract talent. Its publication then raises the bar for what
  counts as worth publishing, and the others'' next decisions are made in that changed
  environment. No single lab is defecting from a cooperative arrangement; each move
  is a sensible response to the previous move. Yet the result is a publication culture
  none of them would have chosen at the outset.


  Or take military procurement. One side fields a system because the other side''s
  current systems make that rational. The deployment changes the threat environment,
  which then makes the other side''s next upgrade rational. The level of risk everyone
  accepts keeps ratcheting upward, but the ''bottom'' is not a fixed point anyone
  converges on; each response redefines where the bottom is.


  What unites these cases is this: each actor is doing what is locally sensible given
  the current state, and in doing so alters the state that determines what will be
  locally sensible for everyone afterward. The thing being lost is not one variable
  driven down toward a fixed bad equilibrium; the equilibrium itself moves, and the
  movement is self-sustaining. There is no identifiable act of cheating, no stable
  cooperative baseline being eroded, and the harm is not a worse value of a single
  quantity but a different game.


  I know this sits somewhere near races to the bottom, arms races, tragedy of the
