  - Preserve some notion of deductive closure (maybe under a weaker logic)

  - Distinguish between different degrees of logical competence

  - Model the dynamics of reasoning

  - Be psychologically plausible

  - Be computationally tractable

  - Handle the distinction between explicit and implicit belief

  - Account for bounded rationality

  - Be compatible with decision theory / expected utility maximization

  - Not collapse into triviality or paradox


