  The problem of logical omniscience: In epistemic logic (Hintikka''s Knowledge and
  Belief, 1962), the standard possible-worlds semantics has it that if an agent knows
  φ, and φ entails ψ, then the agent knows ψ. This is because the agent''s knowledge
  is modeled as the set of worlds accessible from the actual world, and if φ is true
  in all those worlds, and φ entails ψ, then ψ is also true in all those worlds. This
  means agents know all logical consequences of what they know — they''re logically
  omniscient.


  Various solutions: impossible worlds, awareness models (Fagin & Halpern), explicit
  vs. implicit belief (Levesque), algorithmic knowledge models, etc.


