  Now the subtle errors in this:

  1. "in any consistent formal system strong enough to do basic arithmetic, there
  will always be a true statement that the system can''t prove." This is mostly the
  standard gloss. The subtlety: the theorem shows there''s an undecidable sentence
  (neither provable nor refutable). Whether it''s "true" depends on the standard model
  / a model; the theorem as a formal result says "if the system is ω-consistent/consistent,
  there is a sentence G such that neither G nor ¬G is provable." The informal "true
  but unprovable" is acceptable but a logician might wince at calling it "true" without
  qualification, especially for arbitrary consistent systems (there are nonstandard
  models where G is false). That''s a good subtle point.


  2. "so the consistency of mathematics can never be established." Overstatement:
  the second theorem says a system can''t prove its own consistency; but consistency
  can be established in a stronger system (e.g., Gentzen''s proof of PA consistency
  using transfinite induction), or by informal means. So "can never be established"
  is an overstatement—conflation of "within the system" with "absolutely." This is
  a good subtle misrepresentation.


  3. "any AI that operates by formal rules will have mathematical truths it can''t
  recognize." This may be defensible if the AI is a particular formal system; but
  the AI could operate with a stronger or different system, or use heuristics; the
  theorem doesn''t directly bound what any physical computer can do because a computer
  is finite, whereas the theorem concerns formal systems with infinite sets of axioms/theorems;
  also a machine could be a different formal system that proves the sentence the other
  couldn''t. There''s a subtle overstatement: "any AI that operates by formal rules"
  — the theorem applies to a given formal system, not to "any AI"; an AI could in
  principle switch systems or be inconsistent. Also "mathematical truths it can''t
  recognize" — finite machines don''t literally "prove" in the same sense. But as
  a popular gloss, maybe okay-ish. The claim about minds vs machines is a standard
  overstatement: Gödel''s theorem alone doesn''t show humans can''t be machines because
  (a) the human''s "seeing" the truth of the Gödel sentence requires the consistency
  assumption; (b) a machine could be programmed with the same ability to add the Gödel
  sentence as an axiom; (c) the argument assumes human mathematical abilities are
  consistent and complete in a way the theorem would contradict. Lucas/Penrose arguments
  are contested; the theorem doesn''t settle it.


  4. "Gödel showed that any closed system of rules—a legal code, a bureaucracy, a
  scientific theory—will contain statements it can''t settle." This is an overextension:
  the theorem applies to formal systems with a certain expressive/arithmetical strength
  and precise syntax; legal codes etc. aren''t formal systems in the relevant sense,
  and they may not encode arithmetic. So this is a subtle overstatement / application
  error. Good for the audit.


  5. "incompleteness is really a theorem about the limits of all formal systems, not
  just mathematical ones." Also overstatement: it''s about formal systems satisfying
  specific conditions; "all formal systems" is too broad.


