  \ get a better outcome by misrepresenting their preferences than by voting honestly,\
  \ given the votes of others)\nThen it is dictatorial. Equivalently, any strategy-proof\
  \ and onto social choice function with ≥3 alternatives is dictatorial. Thus with\
  \ ≥3 candidates, every non-dictatorial voting rule is manipulable (vulnerable to\
  \ strategic voting), provided the rule is onto and voters have strict preferences.\n\
