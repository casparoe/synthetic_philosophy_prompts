  Domain specifics: The discursive dilemma arises when a group of individuals each
  hold consistent judgments on a set of logically connected propositions, but majority
  voting on each proposition yields an inconsistent collective set. Classic example:
  a three-judge court deciding a breach-of-contract case. Propositions:

  - P: The defendant was contractually obliged (liable).

  - Q: The defendant breached the contract (i.e., did the action).

  - R: The defendant is liable (P ∧ Q → R).

  Three judges:

  Judge 1: P true, Q true, R true (liable).

  Judge 2: P true, Q false, R false.

  Judge 3: P false, Q true, R false.

  Majority on P: true (2-1); majority on Q: true (2-1); majority on R: false (1-2).
  So the group accepts P and Q but rejects R, inconsistent with P ∧ Q → R. That''s
  the doctrinal paradox / discursive dilemma.


