  needs a story: evolution selected for physical processes that happen to produce
  both the behaviour (including reports) and the epiphenomenal experiences, and the
  correlation is explained by common cause. But then the content of our judgments
  about experience is not caused by experience, which threatens our knowledge. A strong
  epiphenomenalist might say: the physical processes cause the judgment "I am in pain";
  the pain accompanies it; the judgment is true because pain is present, but the truthmaker
  is not the cause of the judgment. Knowledge? They might deny we have knowledge of
