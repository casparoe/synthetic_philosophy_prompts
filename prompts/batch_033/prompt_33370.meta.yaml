  I can paraphrase: Smith argued that Britain''s monopoly over colonial trade and
  its political dominion were a net burden; that the benefits were captured by a narrow
  class of merchants while the costs of administration and defense fell on the general
  public; and that Britain should either fully integrate the colonies into the British
