  The American crisis facts: After the Seven Years'' War (French and Indian War),
  Britain faced debt and the cost of defending the expanded American empire; Parliament
  passed the Sugar Act (1764), Stamp Act (1765), Townshend Acts (1767), Tea Act (1773);
  colonists objected to taxation without representation, distinctions between internal/external
  taxes, Parliament''s claim of sovereignty; Boston Tea Party; Coercive/Intolerable
  Acts (1774); First Continental Congress; Lexington and Concord (1775); Declaration
  of Independence (1776). The colonists framed their grievances partly in terms of
  trade restrictions and partly constitutional rights; British merchants lobbied for
  repeal of the Stamp Act (economic pressure) while Parliament insisted on its right
  to tax.


  Mapping Smith''s theory onto the episode: Smith''s analysis explains the economic
  structure—the Navigation Acts, the monopoly, the costs of colonial administration
  and defense, the way the dispute over who should pay for defense precipitated the
  crisis, and the merchants'' role. It explains why Britain "derives nothing but loss."
  It also anticipated the outcome: holding an empire by force is costly and ultimately
  futile. Where it breaks/misses: Smith treats the dispute largely as a question of
  economic policy and rational statecraft; the actual rupture was driven by constitutional
  ideology—the colonists'' claim that taxation without representation violated their
  rights as Englishmen, and Parliament''s insistence on sovereignty—not merely by
  the economics of the monopoly. Also Smith''s preferred solution (representation
  or friendly separation) had no real constituency: British political elites saw colonial
  representation as absurd, and separation as a humiliation; colonists by 1776 moved
  toward independence partly on republican principle, not just economic grievance.
  Smith also says little about slavery as an economic and moral factor in the colonial
  economy (he discusses slavery in Book III? He was critical but not central), and
  about Native Americans. The theory is largely silent on the identity/sovereignty
  dimension. The episode in turn: the Revolution confirms Smith''s structural diagnosis
  (empire was economically irrational for Britain as a whole) and his prediction,
  but it also shows the limits of a political-economic analysis: the actual mechanism
  of rupture was constitutional and ideological; his preferred "parting of friendship"
  was achieved only through a war, and the free-trade prediction did not follow immediately
  (Britain retained trade links actually; US-Britain trade resumed). The case may
  show that Smith''s theory correctly identifies the underlying interest structure
  but underestimates the independent causal force of sovereignty, status, and constitutional
  principle.


