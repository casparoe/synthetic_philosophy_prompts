  The discursive dilemma (Pettit 2001, List & Pettit): A three-judge court must decide
  a liability case. Legal doctrine: the defendant is liable iff (P) the defendant
  was negligent and (Q) the negligence caused the harm. Judges vote:


  Judge 1: P true, Q true → liable.

  Judge 2: P true, Q false → not liable.

  Judge 3: P false, Q true → not liable.


  Premise-wise: P gets 2/3 (Judges 1,2), Q gets 2/3 (Judges 1,3), so premise-based
  aggregation says liable (P&Q). But conclusion-wise: liability gets only 1/3 (Judge
  1), so not liable. Thus majority voting on premises yields a different outcome than
  majority voting on the conclusion; the group''s collective judgments are inconsistent
  with its majority acceptance of the premises (the group accepts P, accepts Q, but
  rejects P&Q? Wait, conclusion-based says not liable, which contradicts the premise-based
  acceptance of P and Q if the doctrine P&Q→liable). So the group "accepts P, accepts
  Q, but rejects P&Q" — an inconsistent set. That''s the discursive dilemma.


  The debate between two students could be:


  A (say, Mara): The paradox shows that majority rule is incoherent: the group accepts
  each premise but rejects their conjunction, which violates the closure of rational
  judgment. So any group that uses majority voting on a complex issue either has to
  choose a procedure (premise vs conclusion) that privileges some propositions, and
  that choice is arbitrary or political.


  B (say, Dev): The paradox doesn''t show incoherence in the group, because groups
  don''t have minds; "the group accepts P" is shorthand for "a majority of members
  accept P." The fact that different majorities support different propositions is
  unsurprising; there''s no single subject whose attitudes must be consistent. So
  the dilemma is an artifact of reifying the group.


  A: But the group is a corporate agent — it issues a verdict, signs contracts, is
  legally liable. If its actions can''t be represented as flowing from a consistent
  set of judgments, we can''t hold it responsible as an agent; it would be a "group
  that can''t make up its mind" yet still acts. So we need a procedure, and the choice
  between premise- and conclusion-based aggregation is unavoidable and substantive.


  B: The choice may be substantive, but that doesn''t make the outcome irrational;
