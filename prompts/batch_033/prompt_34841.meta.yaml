  Logical omniscience problem: in epistemic logic, knowledge/belief operators are
  usually modeled with possible worlds and accessibility relations; an agent knows
  all logical consequences of what she knows (closure under logical consequence) and
  all validities. This is unrealistic for human and computational agents. The problem:
  how to model agents who don''t automatically know all consequences, e.g., someone
  doesn''t know Fermat''s Last Theorem before proof, or doesn''t notice that two beliefs
  entail a third, or takes time to compute.


  Approaches: impossible worlds / Rantala models; awareness logic (Fagin & Halpern);
  explicit vs implicit belief (Levesque); algorithmic/rational closure (resource-bounded
  reasoning); syntactic approaches; dynamic epistemic logic with inference rules.


  Desiderata for a theory of non-omniscient belief:


  1. Non-closure: allow an agent to believe p and believe p→q without believing q
  (unless inferred). Motivating case: someone might believe the axioms of Peano arithmetic
  but not believe a theorem derivable from them.


  2. Distinction between explicit and implicit belief: implicit = closure of explicit
  under logical consequence; explicit = what agent can access/act on. Theory must
  respect this without collapsing them.


  3. Graded/resource-bounded reasoning: reasoning takes time and effort; theory should
  model how an agent can come to believe consequences through inference steps, not
  all at once.


  4. Consistency: should agents be required to be logically consistent? Humans sometimes
  have inconsistent beliefs; a theory should say whether consistency is a desideratum
  or a normative ideal vs descriptive adequacy.


  5. Closure under some weak rules? Perhaps agents do know obvious consequences (modus
  ponens for small formulas). Distinguish shallow vs deep consequences. The theory
  should not overcorrect to no-closure-at-all, because that''s also unrealistic.


  6. Preservation of truth/validity of the underlying logic? The model should still
  define belief relative to a background logic without making the agent a perfect
  reasoner.


  7. Compatibility with semantics for knowledge in multi-agent contexts: common knowledge,
  announcements, dynamic updates.


  8. Tractability/computational realism: if the theory is meant for AI, the belief
  operation should be computable and complexity honest.


  9. The distinction between not knowing a consequence vs disbelieving it; belief
  revision upon learning.


  10. De dicto vs de re? Hmm.


  11. Principle of logical ignorance shouldn''t make the agent believe contradictions
  or arbitrary things; impossible worlds can be too permissive (anything goes). Need
