  is told J.D. Lee = Jordan Lee, then for a Fregean, she learns a new thought: the
  person presented as J.D. Lee is the same as the person presented as Jordan Lee;
  combined with her knowledge, she can infer J.D. Lee is meticulous and rationally
  trust J.D. Lee with the event. For a Millian, the sentence "J.D. Lee is Jordan Lee"
  expresses the trivial singular proposition that a certain person is identical with
  themselves — which Maya already believed (as "Jordan Lee is Jordan Lee"). So the
  Millian says she learned no new proposition. Does the Millian then say her decision
  to trust J.D. Lee is irrational? Not exactly; a sophisticated Millian would say
