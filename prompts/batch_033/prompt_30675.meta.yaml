  Domain: Frege''s puzzle about identity statements. Type: Construct a thought experiment
  to specifications.


  Specifications: We want a case where:

  - A Fregean about proper names (senses as modes of presentation; cognitive value
  of identity statements) and a Millian (direct reference; names contribute only their
  referents) agree about the truth-value of a true identity sentence of the form "a
  = b" (or "a is b"), and agree about what the referents are.

  - They disagree about what the sentence says / what proposition is expressed.

  - This disagreement flips a downstream verdict about whether a particular action
  or inference by a subject is rational (or whether the subject learns something new).

  - Constraints: ordinary-life scenario (workplace, university, family), one paragraph,
  no celestial bodies, no superheroes, no fictional characters with secret identities
  (so no Hesperus/Phosphorus, no Superman/Clark Kent, no Paderewski). The subject
  can have partial information but should not have contradictory beliefs.

  - The case must generate the disagreement from the theories, not stipulate it.


  Then after the scenario:

  - State the identity sentence.

  - State what each theory says the sentence contributes/expresses.

  - State why both assign the same truth-value.

  - State the action/inference and what each theory says about its rationality (or
  about whether the subject acquired new information).

  - Identify the single feature doing the work (presence of two distinct modes of
  presentation/senses vs. Millian''s identification of proposition with singular proposition).

  - Finish with the strongest Millian reply that accommodates the datum without positing
  senses (e.g., metalinguistic or guise-theoretic accounts, or distinguishing semantic
  content from cognitive value, or appealing to belief ascriptions).


  Also include the epistemic request: say how confident it is in the verdicts and
  single out the point it is least sure of.


