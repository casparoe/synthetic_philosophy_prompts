  Bongard problems: Mikhail Bongard, Russian scientist, book "Pattern Recognition"
  (1967). Each problem has 12 boxes on left, 12 on right; left boxes all share some
  property, right boxes all lack it. The task is to identify the rule. The classic
  difficulty: the rule is at the "letter" vs "spirit" level; e.g., left contains circles,
  right contains triangles; or left contains large shapes, right small shapes. Many
  are perceptually immediate; some are deeply abstract. Hofstadter used them to discuss
  fluid concepts, perception, analogy-making. Concepts from few examples: humans can
  often get a Bongard problem from just a handful of examples, but some require the
  "right" level of abstraction.


