  Realism about interpretability domain. Key issues:

  - Are the "features" found by sparse autoencoders (SAEs) real parts of the network''s
  computation, or artifacts of the decomposition method?

  - Causal intervention (activation patching, ablation) as evidence for representation.

  - Pluralism: many decompositions may be valid; no privileged "carving at the joints."

  - Instrumentalism/predictivism: a representation is real insofar as it supports
  prediction and control; but maybe that''s all.

  - Realism vs pragmatism: if features only earn their keep by enabling predictions,
  is that realism?

  - Naturalness: the "natural abstraction" hypothesis.

  - Polysemanticity and superposition — representations may not be axis-aligned or
  monosemantic.

  - Multiple realizability: different weights can implement the same function; does
  that undermine representations?

  - Vehicle/content distinction: the representation''s content vs its format.


