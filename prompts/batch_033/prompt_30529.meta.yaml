  Let me enumerate the genuine desiderata for a theory of moral uncertainty, to make
  sure my prompt''s seeds are accurate:


  1. Action-guidance: given a set of options and credences over moral theories, the
  theory should (usually) single out a non-empty set of permissible options; not prohibit
  everything or license everything.

  2. Respect the ordering of each theory (dominance-ish): if every theory you have
  positive credence in prefers A to B, the theory shouldn''t pick B. (Pareto / dominance
  over options.)

  3. Handle intertheoretic incomparability: theories may not share a common unit of
  value; the theory needs a way to compare options across theories without assuming
  comparability. (This is a huge issue: expected choiceworthiness requires intertheoretic
  comparisons.)

  4. Avoid fanaticism / "infectious" Pascal''s wager: don''t let arbitrarily tiny
  credence in an unbounded theory (e.g., a theory with infinite or arbitrarily large
  values) swamp all decisions. Or more carefully: specify what to do with unbounded
  value functions.

  5. Deal with the regress: the theory of moral uncertainty is itself something you
  can be uncertain about; a theory should be self-applicable without infinite regress
  (or explain why regress is benign). (Gustafsson & Torpman argue against "my favourite
  theory" approach — the view that you should just follow the moral theory you have
  most credence in.)

  6. Respect the distinction between moral uncertainty and empirical uncertainty —
  not conflate them.

  7. Respect credal structure: e.g., not be pathologically sensitive to how theories
  are individuated (the "problem of intertheoretic comparisons" ties into theory individuation
