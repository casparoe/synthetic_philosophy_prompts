  The obfuscated argument problem: In debate, two AIs argue; judge decides. If a dishonest
  debater can find an argument that is convincing to the judge but whose decisive
  step is a falsehood the judge can''t evaluate, then the judge can be misled even
  if the honest debater is trying to expose it. Example-ish: a dishonest debater might
  present a long computational trace or a subtle mathematical argument where the key
  step is wrong but detecting it requires more computation than the judge can do;
  the honest debater might be able to say "that step is wrong" but the judge can''t
  verify who''s right. The core issue is that persuasion can outpace verification:
  the mapping from "argument is convincing" to "argument is true" breaks down when
  the space of arguments is large and the judge is bounded. Naive fixes: (1) let the
  judge ask the honest debater to point to the flaw — but the honest debater may only
  be able to say "step 3 is false," and if the judge can''t check step 3, that''s
  no help; (2) require each argument to decompose into steps the judge can verify
  — but then debate may lose the power to handle claims beyond the judge''s direct
  competence, since the honest debater can''t prove them in judge-checkable steps
  either; (3) let the judge ask for more detail — but the dishonest debater can generate
  ever more sub-arguments, and the honest one has to refute each; if judge has limited
  attention, a dishonest arguer with more "argumentative surface" can win by flooding;
  (4) train the judge to be better — but the whole point is superhuman debaters and
  bounded judge; the gap can always be exploited. The proposed answer is that debate
  can still work under certain assumptions (e.g., the honest debater can always find
  a short rebuttal that the judge can check, "decomposition of the claim into subclaims
  that are easier to judge," "the first-order logic of debate is sound under some
  conditions"), but the obfuscated-argument problem shows those assumptions are substantive
  and possibly false; and it motivates variants like iterated amplification, market-making,
  "recursive reward modeling"? Actually obfuscated arguments motivate limits; alternative
  proposals include amplification (Christiano), factored cognition, ELK.


