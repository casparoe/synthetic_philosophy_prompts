  \ one would have to have chosen to become that way.\n4. And that choice would itself\
  \ have to be made on the basis of one's existing character/dispositions.\n5. So\
  \ one would have to be responsible for that prior character, and so on, leading\
  \ to an infinite regress.\n6. Therefore, true moral responsibility is impossible.\n\
  \nI can design an activity where participants try to justify holding someone responsible,\
  \ and each time they trace it back, they hit the regress.\n\nLet me design this\
  \ carefully. The setting: an upper-level undergraduate seminar on free will and\
