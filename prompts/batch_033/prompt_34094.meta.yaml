  Let me formulate a careful numbered argument:


  1. Suppose, for reductio, that I can conceive of a tree existing entirely unperceived
  by any mind.

  2. If I can conceive of this tree, then in doing so I conceive of the tree; the
  tree is the object of my conception.

  3. But a tree that is the object of my conception is not entirely unperceived/unconceived:
  it is conceived by me.

  4. So my act of conception contradicts its own content — I am trying to conceive
  a tree of which no mind is aware, yet my conceiving makes some mind aware of it.

  5. Therefore, the very idea of an object existing unperceived is self-contradictory
  or inconceivable.

  6. Since we can conceive of nothing existing unperceived, we have no coherent idea
  of a mind-independent object; the claim that such objects exist is empty.

  7. Hence, for ordinary things like trees, their being is to be perceived (or to
  be perceivable): esse est percipi.


