  account of mathematical truth pull in opposite directions. The semantic constraint
  says that mathematical statements should be taken at face value: ''there are infinitely
  many primes'' has the same logical form as ''there are infinitely many stars,''
  and if it is true, its singular terms and quantifiers refer. The epistemological
  constraint says that our account of mathematical knowledge must be continuous with
  our account of knowledge of the physical world, where reference and knowledge are
  typically mediated by causal interaction. If mathematical objects are abstract and
  causally inert, the face-value reading makes mathematical knowledge look impossible;
  but the standard ways of avoiding that problem—rejecting the face-value reading,
  revising the semantics, or revising the epistemology—each seem to give up something
  the other side regards as non-negotiable.


  The literature since then seems to me to have settled into a stable pattern. Platonists
  bite the bullet on the epistemological constraint and try to weaken or replace the
  causal requirement; nominalists and fictionalists reject the face-value reading
  and then owe us an account of why mathematical discourse is useful and why it looks
  referential; structuralists and others try to split the difference by relocating
  the objects or reinterpreting the quantifiers. Each position has well-known costs,
  and each side''s response to the others'' costs is by now extremely familiar. Yet
  almost no one seems to move. My working hypothesis is that the impasse is not a
  failure of cleverness but a sign that the two constraints encode different conceptions
  of what an account of mathematical truth is supposed to do—one answerable primarily
  to logic and semantics, the other to naturalistic epistemology—so the ''dilemma''
  may be less a single problem than a forced choice between two projects that have
  never fully acknowledged their different aims.


