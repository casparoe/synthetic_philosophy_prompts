  "I am a novelist, not a physicist, and I have been asked to run a ninety-minute
  ideas session at a writers'' retreat on whether space is a thing or merely a web
  of relations. I want to build the session around Newton''s rotating bucket, because
  it is vivid enough to hold a room of people who think in scenes and metaphors, but
  I do not trust myself yet to sequence the material. Please do not explain the physics
  to me; plan how I should explain it. The audience is fifteen or so novelists, poets,
  and dramatists with no mathematics beyond school and no formal philosophy. I need
  the order in which the ideas must be introduced and what each step depends on: for
  example, I suspect the distinction between motion relative to other bodies and motion
  relative to space itself has to be in place before the bucket can do any work, but
  I am not certain where Mach''s relational reply fits, or whether Leibniz''s arguments
  about indiscernible worlds should come before or after the bucket. I also want one
  carrying example that can bear the whole weight of the session — I am not committed
  to the bucket if you think it misleads, but if you keep it, tell me what it can
  and cannot show — and the misconceptions I should expect from this particular audience.
  My guess is they will think the bucket experiment is an empirical proof of absolute
  space, and will assume that to deny absolute space is to deny that rotation is real;
  I would like to know where each of these should be headed off, and whether there
  are subtler confusions that come later. Please also tell me what I should openly
  decline to explain at this level — I imagine the hole argument and the subtleties
  of general relativity are candidates — and give me one final question that would
  show whether someone has grasped the distinction rather than merely acquired the
  vocabulary."


