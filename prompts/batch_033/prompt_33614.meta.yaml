  (1) Ellen opens: The problem of old evidence is fatal to Bayesian confirmation theory.
  If evidence E is already known when hypothesis H is introduced, then P(E) = 1, so
  P(H|E) = P(H). The calculus literally cannot represent the way Mercury''s anomalous
