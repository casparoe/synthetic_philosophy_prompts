  have been had you not known E. If GR makes the perihelion advance likely and rivals
  don''t, the counterfactual likelihoods do the confirming. Old evidence confirms
  just like new evidence; we just evaluate it against a prior that pretends it wasn''t
  yet known.


  (3) Ellen: But "subtracting" evidence isn''t a well-defined operation. You can''t
  coherently pretend not to know something you know; there''s no unique way to distribute
  probability once you remove E, and different ways give different degrees of confirmation.
  You''ve replaced the problem with a free parameter. Also, a confirmation theory
  should tell us whether the evidence, as we actually have it, supports the theory;
  your account only tells us whether it would have supported it in a state of ignorance
  we were never in.


  (4) Marcus: The free-parameter charge is fair, but there''s a deeper fix: we''ve
  been assuming agents are logically omniscient. Add propositions about logical and
  mathematical relations — for instance, the proposition that GR entails the observed
