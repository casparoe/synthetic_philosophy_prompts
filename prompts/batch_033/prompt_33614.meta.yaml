  The problem of old evidence (Clark Glymour, 1980): In Bayesian confirmation theory,
  evidence E confirms hypothesis H iff P(H|E) > P(H). But if E is known before H is
  proposed, then P(E) = 1. Then P(H|E) = P(H&E)/P(E) = P(H)/1 = P(H), so E cannot
  confirm H. Yet old evidence often does seem to confirm new theories: Einstein''s
  GR and the anomalous perihelion of Mercury (known for decades); Newtonian mechanics
  and Kepler''s laws? Actually Kepler''s laws were old evidence for Newton. So the
  Bayesian calculus as standardly applied says old evidence never confirms, which
  is wrong.


  Solutions:

  1. Counterfactual/Howson-Urbach approach: assess confirmation relative to a counterfactual
  prior in which E is subtracted (imagine you didn''t know E). But this is subjective/arbitrary.

  2. Garber''s approach: introduce propositions about logical/derivational relations
  between H and E; learning that H entails E can raise P(H) even when P(E)=1. But
  this expands the algebra with theory of logical relations.

  3. Jeffrey conditionalization / "logical learning": same idea, assign probability
  to statements like "H implies E".

  4. Glymour''s own bootstrap: abandon Bayes.

  5. Some argue the problem dissolves if we distinguish old evidence from old data,
  or if confirmation is a three-place relation including background knowledge.


