  make the agent less than logically omniscient, and then you owe us a story about
  the priors over these "entailment" propositions — where do they come from? Without
  that, you''ve got another free parameter.


  (6) Marcus: Every Bayesian model has priors; that''s not an objection specific to
  my solution. And in real science the agent is not logically omniscient — nobody
  had derived the perihelion advance from GR before Einstein did the work. The prior
