  ---


  In the department lounge last week, two of my colleagues got into a long argument
  about whether the problem of old evidence is a serious difficulty for Bayesian confirmation
  theory. I was asked to referee and found I couldn''t do it justice on the spot,
  so I wrote down their exchange as best I could. Here it is, slightly compressed:


  (1) Ellen began: The problem of old evidence is close to fatal for Bayesianism.
  In the standard apparatus, evidence E confirms hypothesis H just in case P(H|E)
  > P(H). But when E is already known before H is formulated, P(E) = 1, and then P(H|E)
  = P(H) — the evidence cannot confirm the hypothesis at all. Yet the history of science
  is full of cases where a theory was accepted precisely because it accounted for
  data known long beforehand; the advance of Mercury''s perihelion confirmed general
  relativity even though the anomaly had been catalogued for decades. A theory of
  confirmation that cannot represent such episodes is missing something central.


  (2) Marcus replied: That conclusion is too quick. The natural fix is to evaluate
  the theory against a counterfactual prior — one that subtracts the evidence, or
  imagines an agent who does not yet know it. Ask how plausible the hypothesis would
  have been had the old evidence not been in hand. If general relativity makes the
  perihelion data antecedently likely and its rivals do not, then the data confirms
  it, old or not. The problem is an artifact of insisting on the agent''s actual,
  evidence-soaked probabilities.


  (3) Ellen: But "subtracting" evidence from a probability function is not a well-defined
  operation. Once you know E, there is no unique rational way to distribute your credences
  as if you didn''t; different subtractions yield different degrees of confirmation,
  and the choice among them is unconstrained. You have replaced a real difficulty
  with a free parameter. Worse, the question was whether the evidence as we actually
  possess it supports the theory. Your account answers a different question: whether
  it would have supported it in a state of ignorance no actual scientist was ever
  in.


  (4) Marcus: The free-parameter charge has some force, but there is a deeper response.
  The standard formalism assumes logical omniscience, and that assumption is what
  creates the problem. Suppose we allow the algebra to include propositions about
  logical and derivational relations — for example, the proposition that the theory
  entails the observed anomaly. Learning that entailment is a genuine epistemic event
  even when both the theory and the data are already in hand, and it can raise the
  probability of the theory. Old evidence confirms through logical learning, not through
  the evidence proposition itself. This is not an ad hoc patch; it is the removal
  of an idealization we already knew was false.


  (5) Ellen: But that simply relocates the difficulty. If the agent knows the theory
  and knows the data, and the entailment is a logical fact, then a logically omniscient
  agent would know the entailment too. Your proposal works only by making the agent
  logically non-omniscient, and then you owe us an account of the priors over these
  entailment propositions. Where do they come from, and what constrains them? Without
  that, you have merely traded one free parameter for another — and a more obscure
  one.


  (6) Marcus: Every Bayesian model needs priors, so pointing to priors is not an objection
  to my solution in particular. And the relevant agents — actual scientists — are
  precisely not logically omniscient; someone had to do the derivational work connecting
  the theory to the anomaly, and before that work was done the entailment was not
  known. Priors over entailment propositions can be tied to how much of that derivational
  work has been completed. So the free-parameter worry, while not baseless, is less
  damaging than you suggest.


  (7) Ellen: Notice what has happened, though. To get old evidence to confirm, you
  have added an apparatus of logical relations and degrees of derivational progress,
  and the confirmation now occurs because a probability shifts when a logical fact
  is learned — not because the data bears on the theory in the usual way. That looks
  less like a vindication of the original idea that confirmation is a relation between
  evidence and hypothesis than a replacement of it.


  At that point I had to leave for a meeting. I would like you to adjudicate the exchange
