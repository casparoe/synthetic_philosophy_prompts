  The core argument:

  1. Something is bad for you only if you experience it as bad (the experience requirement).

  2. When you are dead, you do not exist.

  3. Therefore, you cannot experience being dead.

  4. Therefore, death is not bad for you.


  The deprivation account (Nagel) challenges premise 1: something can be bad for you
  even if you don''t experience it, if it deprives you of goods you would otherwise
  have had.


  The timing problem (when does death harm you?) is also key.


