  - First, they need to understand that the question is "is death bad for the person
  who dies" — not "is death bad simpliciter" or "is dying painful."

  - Second, they need to grasp the experience requirement as a premise, not a conclusion.

  - Third, the deprivation account needs to be presented as a genuine alternative,
  not an obvious refutation.


