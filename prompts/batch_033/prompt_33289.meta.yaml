  Draft:


  I serve on the grants committee of a small family foundation in a midsized city.
  Each year we distribute a fixed sum among local programs, most of them serving children
  and families, and I have noticed over the past few years that my own votes do not
  follow any rule I can state. They are not "do the most good with the money," and
  they are not "make things as equal as possible." I have been trying to figure out
  what, if anything, my pattern amounts to. Below are the cases that have stayed with
  me, and my honest verdicts on them.


  Case A. Two after-school programs each ask for $20,000. One serves children from
  families below the poverty line; the other serves children from comfortable families.
  The money would buy the same materials and reach the same number of children, but
  the program for the poorer families is harder to administer, so each dollar is expected
  to produce somewhat less measurable benefit. I vote to fund the poorer program.


  Case B. Someone proposes making the distribution of city programs more equal by
  shutting down a well-attended summer program in an affluent neighborhood, with no
  plan to move the money anywhere useful; the original donor would simply keep the
  funds. No child elsewhere gains anything. I vote against it. I feel a faint pull
  toward "at least the gap would be smaller," but I cannot treat that as a reason
  to make some children worse off for nobody''s benefit.


  Case C. We must choose between two $20,000 proposals. One would give roughly 500
  already-comfortable seniors a pleasant museum outing. The other would pay several
  months of rent and a security deposit for two families who would otherwise remain
  homeless. The total benefit, counted plainly, seems larger for the seniors; I vote
  for the two families. The depth of the need outweighs the number of people helped.


  Case D. A proposal would move funds from a program for the working poor — people
  above the poverty line but barely getting by — to a program for the destitute, people
  on the street. Because of how the two programs are structured, for every $100 moved,
  only about $15 would reach the destitute; the rest would be eaten by transition
  costs. I am genuinely torn. In the end I vote no; the waste is simply too large.
  But I notice this sits uneasily with Case C.


  Case E. Two programs serve children who are both badly off, but one group is somewhat
  worse off than the other: families in emergency shelter versus families doubled
  up in unsafe housing. The money would do roughly equal measurable good for each
  group. I lean toward the emergency-shelter group, though not as strongly as I do
  when the choice is between badly off and comfortable.


  Case F. A proposal would reduce the gap between upper-middle-class and wealthy families
  by giving extra help to the upper-middle-class children at the expense of the wealthy
  children, without changing anything for anyone genuinely badly off. I do not see
  the point. The gap between those two groups does not move me.


  I would like to know whether one principle captures all of this, or nearly all of
  it. If it cannot capture everything, I want to know which of my verdicts it forces
  me to drop and why. I would also like the principle tested against a few cases I
  have not listed, especially cases that would distinguish it from the alternatives.


  You are a professional philosopher who works on distributive ethics. Please think
  carefully. Begin by brainstorming the main candidate principles someone in my position
  might be relying on, state each precisely, and say which of my cases each one handles
