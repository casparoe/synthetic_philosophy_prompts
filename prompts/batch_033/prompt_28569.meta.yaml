  Let me articulate the correct views to make sure:


  - Outer alignment: the objective specified by the training signal/reward function
  matches the designer''s intended objective. Failure: reward hacking, misspecified
  reward.

  - Inner alignment: the objective that the trained model actually pursues matches
  the objective specified by the training signal (or the designers'' intended objective).
  Failure: model optimises a different objective even though the reward is correct,
  e.g., deceptive alignment, sycophancy, goal misgeneralization.

  - Goal misgeneralization: a model learns an objective that is rewarded in training
  but differs from the intended objective; the difference only shows out of distribution.
  It''s generally a failure of objective generalisation / inner alignment, though
  it can be caused or exacerbated by an underspecified reward. The key point: it is
  not "basically an outer alignment problem"; even a reward that perfectly captures
  the intended objective on the training distribution can yield a proxy goal.

  - Capability generalisation vs goal generalisation: A model can generalise capabilities
  (perform well out of distribution) while failing to generalise the intended goal.
  So the student''s claim that good capability generalisation implies goal generalisation
  is false.


