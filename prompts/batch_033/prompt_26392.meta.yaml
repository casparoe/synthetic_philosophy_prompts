  I''m a third-year PhD student in formal epistemology, and I''ve been circling for
  a while now around the "presumption of independence": the idea that, when you have
  no positive reason to think two events or variables are linked, your prior should
  treat them as independent. It shows up all over the place — objective Bayesians
  get it out of maximum entropy (no constraint coupling X and Y, so the max-ent distribution
  factors), people building Bayesian networks default to missing edges, and mathematicians
  doing heuristic arguments talk about divisibility by different primes or primality
  of nearby integers as if they were independent, even when that''s not exactly true
  and sometimes quietly fails. But I keep finding ways the principle fights with itself.
  If I have a coin of completely unknown bias and I treat successive flips as independent,
  then the first hundred flips tell me nothing about the next one; if instead I treat
  the flips as exchangeable, de Finetti-style reasoning pushes me to a mixture of
  i.i.d. processes, which makes the flips positively correlated and is what actually
  lets me learn. And there''s the logical version of the problem: two propositions
  can be logically equivalent or have a hidden common cause, and presuming independence
  seems to amount to betting that no such structure exists, which is a substantive
  assumption dressed up as ignorance.


  I have about three years left and I''m decent at logic and probability but not much
  of a number theorist or an ML person. What I''d like from you is a defended agenda,
  not a survey: what do you think are the main open questions in formalizing the presumption
  of independence (or in deciding when it''s even a good principle), and which two
  or three should I actually build a dissertation around? For each one you''d prioritize,
  say why it''s upstream of other work, how tractable it is for someone with my background,
  and what sort of result or argument over the next couple years would make you demote
  it. If you think the whole framing is wrong and I should be asking a different question
  in the vicinity, tell me that too, but still give me the ordering.


