  Draft:


  "I am drafting a statement of my position on the epistocracy debate and would like
  a consistency audit before I commit to it. Here are the commitments I currently
  hold:


  (1) The justification of democracy is instrumental. Universal equal suffrage is
  worth retaining only if, on balance, it produces better political outcomes — decisions
  that more reliably protect basic rights, promote welfare, and avoid serious injustice
  — than the feasible alternatives.


  (2) The empirical case for voter competence is weak. Most citizens in large modern
  democracies are rationally ignorant: because the probability of casting a decisive
  vote is minuscule and political information is costly, most voters know little and
  fall back on party identification, group loyalties, and low-information cues.


  (3) If a feasible epistocratic arrangement — say, plural voting weighted by a test
  of basic political knowledge, or a limited suspensive veto for a well-designed expert
  commission — could be shown to produce reliably better decisions than equal suffrage,
  it would not be objectionable merely because it distributes formal political power
  unequally.


  (4) Unequal political power is not unjust in itself. An arrangement that gave some
  citizens more votes than others would be permissible in principle if it predictably
  served the interests and standing of everyone, including those with fewer votes.


  (5) Nevertheless, I reject weighting the franchise by education, income, or occupation,
  and I reject disenfranchising any competent adult. Those proxies are epistemically
  crude, and their use would entrench the very inequalities of class and status that
  democratic politics ought to be able to scrutinise.


  (6) I also hold that every competent adult citizen has a claim to equal political
  standing. A citizen subject to laws she had no equal say in authoring is dominated
  unless the unequal arrangement can be justified to her in terms she could reasonably
  accept — and not merely by showing that the arrangement produces better aggregate
  outcomes.


  (7) As a practical matter, I oppose introducing epistocratic institutions in any
  contemporary state. Given the actual distribution of political knowledge, any workable
  test or expert body would shift power towards the already advantaged, invite capture,
  and entrench the preferences of a narrow professional class; the likely result would
  be worse for the worst-off, not better.


  I would like an audit of this set rather than a survey of the literature. Go through
