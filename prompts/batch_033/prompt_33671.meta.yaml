  "I''ve been trying to write down my position on the epistocracy debate and I''d
  like an audit of whether the set is jointly tenable before I commit to it in print.
  Here is where I''ve landed:


  (1) The justification of democracy is instrumental. Universal equal suffrage is
  worth keeping only if, on the whole, it produces better political outcomes — understood
  as decisions that better protect rights, promote welfare, and avoid serious injustice
  — than the feasible alternatives.


  (2) The empirical case for voter competence is very poor. Most citizens in large
  democracies are rationally ignorant: the chance of casting a decisive vote is negligible,
  and acquiring political information is costly, so most voters know little and vote
  on the basis of party loyalties, group identities, and low-information cues.


  (3) If a feasible epistocratic arrangement — for example, plural voting weighted
  by a test of basic political knowledge, or a limited veto for a well-constructed
  expert commission — could be shown to produce reliably better decisions than equal
  suffrage, then it is not objectionable merely because it distributes formal political
  power unequally.


  (4) Injustice in the distribution of political power is a matter of what the inequality
  does to people''s interests and standing, not of equality for its own sake. So an
  epistocratic scheme that predictably benefited everyone, including those with fewer
  votes, would be permissible in principle.


  (5) I nonetheless reject weighting the franchise by education, income, or occupation,
  and I reject outright disenfranchisement of any competent adult. These proxies are
  epistemically crude and their use expresses the very inequalities — class, status,
  education — that democratic politics should be able to call into question.


