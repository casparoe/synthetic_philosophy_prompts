  Commitments (plausible person: a political philosopher sympathetic to epistemic
  justifications of democracy but wary of epistocracy):


  1. The justification of democracy is ultimately instrumental: it is justified because
  and insofar as it tends to produce better (more just, more competent) political
  outcomes than the alternatives, not because voting has intrinsic value.

  2. Voters in large modern democracies are, on average, badly uninformed about politics,
  and this ignorance is rational given the near-zero chance of casting a decisive
  vote. (This is basically Somin/Caplan.)

  3. If a feasible institutional arrangement would reliably produce substantively
  better decisions than universal equal suffrage, we should at least seriously consider
  it, even if it gives some citizens more formal political power than others.

  4. Epistocracy — e.g., plural voting weighted by political knowledge, or an epistocratic
  veto for a well-designed expert body — is not in principle unjust, because political
  power need not be distributed equally if unequal distribution serves everyone.

  5. However, I reject restriction of the franchise or weighting of votes by education,
  income, or race, because those proxies are both epistemically poor and invidious.

  6. I hold that all competent adult citizens have a claim to equal standing, and
  that being subject to a law one had no equal say in authoring is a form of domination
  unless the unequal arrangement can be justified to them in terms they can reasonably
  accept.

  7. In practice, the likely effect of epistocratic institutions would be to entrench
  the interests and biases of the already powerful (the well-educated, the affluent,
  the professional class) and would be captured by partisan actors; so I oppose implementing
  epistocracy in any actual contemporary state.


