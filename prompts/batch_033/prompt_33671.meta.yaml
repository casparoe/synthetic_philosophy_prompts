  — than the feasible alternatives.


  (2) The empirical case for voter competence is weak. Most citizens in large modern
  democracies are rationally ignorant: because the chance of casting a decisive vote
  is minuscule and political information is costly, most voters know little and rely
  on party identification, group loyalties, and low-information cues.


  (3) If a feasible epistocratic arrangement — for instance, plural voting weighted
  by a test of basic political knowledge, or a limited veto for a well-constructed
  expert body — could be shown to produce reliably better decisions than equal suffrage,
  it would not be objectionable merely because it distributes formal political power
  unequally.


  (4) Unequal political power is not unjust in itself. An arrangement that gave some
  citizens more votes than others would be permissible in principle if it predictably
