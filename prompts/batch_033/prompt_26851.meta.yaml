  Adam Smith''s theory of sympathy in "The Theory of Moral Sentiments" (1759): sympathy
  is not exactly what we now call empathy. Smith says we cannot directly experience
  another''s feelings; we can only form an idea of them by imagining what we ourselves
  would feel in their situation. "As we have no immediate experience of what other
  men feel, we can only form an idea of the manner in which they are affected, by
  conceiving what we ourselves should feel in the like situation." So sympathy is
  a projection/imagination of ourselves in the other''s circumstances, not a direct
  sharing of feeling. The impartial spectator: we judge our own conduct by imagining
  how an impartial spectator would view it; we divide ourselves into the person acting
  and the spectator. Smith''s device for moral judgment is to view one''s own conduct
  from the standpoint of an impartial spectator, and we seek to moderate our emotions
  to the pitch that spectators can go along with ("sympathize with").


  So the slogan "put yourself in someone else''s shoes" can be precisified:

  (a) literally try to feel what the other feels, to share their affective state (empathy
  as contagion/direct sharing).

  (b) imagine yourself — with your own character and dispositions — in their circumstances,
  and see what you would feel (Smith''s actual view).

  (c) adopt their beliefs, preferences, and values and simulate their mind (simulation
  / perspective-taking as "becoming" them).

  (d) imagine what an impartial spectator would approve of feeling in that situation
  (the normative, impartial-spectator reading: the "shoes" are not the other person''s
  actual perspective but the standpoint of a neutral observer).

  (e) a merely epistemic metaphor: gather more information about their situation before
  judging.


