  Löb''s theorem: For any formula P in a formal system T containing arithmetic (and
  satisfying derivability conditions), if T ⊢ (Prov_T(⌜P⌝) → P), then T ⊢ P. In other
  words, a system can prove that its own provability implies truth of P only for P
  that are already provable. Contrapositive: if T is consistent and doesn''t prove
  P, then T cannot prove Prov_T(⌜P⌝) → P.


  The obstacle to self-trust: A consistent system cannot prove its own soundness,
  i.e., cannot prove the schema Prov_T(⌜φ⌝) → φ for all φ. Because by Löb, that would
  imply proving every φ. More specifically, if T proves all instances of the reflection
  principle, then T is inconsistent (since for φ = ⊥, T proves Prov_T(⌜⊥⌝) → ⊥, i.e.,
