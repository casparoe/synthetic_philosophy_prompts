  Con(T)... actually Löb''s theorem with φ=⊥ gives: T ⊢ (Prov(⊥) → ⊥) implies T ⊢
  ⊥. So a consistent T does not prove ¬Prov(⊥), i.e., Con(T). And the reflection schema
  for all φ implies Con(T), contradiction. So a consistent sufficiently strong system
  cannot establish the general soundness of its own reasoning.


