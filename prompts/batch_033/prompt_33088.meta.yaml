  Two positions:

  - Realist: trained networks really do encode features/concepts in their activations
  and weights; interpretability methods (probes, sparse autoencoders, feature visualization,
  causal interventions) discover these representations, not merely impose them. Evidence:
  linear probes recover task-relevant features from activations; ablations and steering
  alter behavior in predictable ways; SAE features are monosemantic and causally efficacious.

  - Anti-realist/instrumentalist: The features found are artifacts of the method;
  with enough degrees of freedom any high-dimensional space can be linearly separated;
  probes can succeed even when the network doesn''t use the feature; different methods
  yield different decompositions; "representation" is just a useful gloss we impose.
  The network is just a function; talking about its internal states as representations
  is a loose metaphor, not a factual claim. There is no fact of the matter about which
  of many equivalent features is "the" representation.


