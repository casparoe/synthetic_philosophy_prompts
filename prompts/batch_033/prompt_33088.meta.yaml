  Domain: "Do neural networks have representations? (realism about interpretability)."


  Let me think more carefully about the philosophical substance to make the prompt
  precise.


  The deflationist challenge has several strands:


  1. **Multiple decomposability / underdetermination**: A network is a function; the
  same function can be implemented by many different internal structures. Even for
  a given trained network, the activation space can be decomposed into "features"
  in many ways. If there''s no privileged decomposition, "the" features aren''t real.


  2. **Probes overclaim**: A linear probe that can decode "truth" or "sentiment" from
  activations only shows that information is linearly available, not that the network
  uses it. A random direction can be probed to predict some label too.


  3. **Causal tests are too weak**: Intervening on any direction changes outputs;
  causal influence is not sufficient for representation. In nonlinear systems, almost
  any direction is causally efficacious.


  4. **Circularity**: Interpretability methods optimize for human-interpretable, monosemantic
  features; SAEs find dictionaries that reconstruct activations sparsely, but sparsity
  + reconstruction doesn''t ensure the dictionary elements correspond to anything
  the network "uses" — it''s just a change of basis. The "features" are projected
  onto the network by the researcher.


  The realist replies:


  1. **Cross-method convergence**: Independent methods (feature visualization, probes,
  SAEs, attention pattern analysis, causal tracing, steering) converge on the same
  features (e.g., curve detectors, sentiment directions). Convergence is unlikely
  if features are pure artifacts.


  2. **Causal tests with controls**: Not all directions are equal. The relevant criterion
  is not mere causal efficacy but whether intervening on the direction produces the
  *specific, predicted* behavioral change while leaving orthogonal behaviors largely
  intact — i.e., a feature is a natural causal variable. Artifact directions tend
  to produce diffuse or unspecific effects. Also, ablating a feature should produce
  deficits specifically on tasks that use it.


  3. **Predictive power and compression**: Real features should support prediction
  of network behavior on novel inputs, and should generalize across inputs. A decomposition
