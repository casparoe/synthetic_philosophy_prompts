  Harsanyi''s aggregation theorem: The theorem shows (roughly) that if individuals
  have von Neumann–Morgenstern preferences and social preferences also satisfy vNM
  axioms plus a Pareto condition, then social utility is a weighted sum of individual
  utilities. It''s often used to argue utilitarianism follows from rationality axioms
  plus Pareto. There are in-the-weeds issues: the theorem assumes interpersonal comparisons
  via the scaling of utility functions, or that vNM utilities already encode risk
  attitudes and are cardinally measurable but not interpersonally comparable — the
  Pareto condition forces a common scaling? Actually Harsanyi''s theorem requires
  that social preferences satisfy the axioms and that if everyone is indifferent between
  two lotteries, society is indifferent. Then social utility is affine combination
  of individual utilities, but the weights can be negative! The non-negative weights
  require stronger Pareto. The key controversial assumptions: vNM axioms for social
  preferences, the Pareto/indifference condition, and the interpretation of utilities.


