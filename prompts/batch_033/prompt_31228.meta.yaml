  Let me recall precisely. Harsanyi (1955) theorem: Suppose there are n individuals,
  each with vNM utility u_i, and a social vNM utility W such that W = f(u_1,...,u_n).
  If society is indifferent between alternatives whenever all individuals are indifferent
  (Pareto indifference), then W is a weighted sum: W = Σ a_i u_i, with real coefficients
  a_i. If we also have (strong) Pareto, i.e., society prefers what everyone weakly
  prefers and at least one strictly prefers, then the weights are non-negative? Actually
  strong Pareto gives positive weights? I think the theorem often says weights can
  be chosen nonnegative, but not necessarily; if at least one individual''s strict
  preference leads to social strict preference, then positive weights. There''s literature:
  Harsanyi''s theorem only yields weighted sum with possibly negative weights unless
  you add strong Pareto. Also the normalization matters: vNM utilities are unique
  up to positive affine transformations, and the theorem''s conclusion is not invariant
  under those transformations unless the weights are scaled accordingly — the "utility
  units" problem. This is genuinely in the weeds.


