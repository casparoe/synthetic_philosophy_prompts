  In 2D semantics (Chalmers''s epistemic two-dimensionalism), "water is H2O" is necessary
  a posteriori (secondary intension necessary) but its primary intension is not necessary;
  it''s something like "the watery stuff is H2O," which is a posteriori and only true
  at worlds where the watery stuff is H2O. The primary intension is not a priori true.
  Hmm. Actually Chalmers: for a necessary a posteriori statement like "water is H2O",
  the primary intension is contingent (true in worlds where the watery stuff is H2O),
  so it''s not knowable a priori. The primary intension of "water" (the term) is knowable
  a priori in the sense that the conditional "if the actual world is w, then water
  refers to the watery stuff in w" is a priori. But the primary intension of the sentence
  "water is H2O" is not a priori. So the confusion is conflating the primary intension
  of a term with the primary intension of a statement; or thinking that primary intension
  of the term being knowable a priori means the statement "water is H2O" is a priori.
  A good answer would untangle: the primary intension of a term is an epistemic reference-fixing
  rule; the primary intension of a full sentence is what matters for apriority; for
  "water is H2O" the primary intension is not necessary and not a priori, so Kripke''s
  distinction is preserved. This is subtle and a great false-presupposition prompt.


