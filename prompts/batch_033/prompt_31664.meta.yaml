  Alternative domain: two-envelope paradox. Let me draft to compare.


  "I''m a decision theory PhD student, and the two-envelope paradox has been driving
  me up the wall. You know the setup: there are two envelopes, one has twice as much
  money as the other, but you don''t know which. You pick one and find $10. The other
  envelope must contain either $5 or $20. If you switch, your expected gain is (0.5)($5)
  + (0.5)($20) = $12.50, which is more than the $10 you''re holding. So switching
  seems mandatory. But the same calculation works no matter what amount you see, so
  you should switch even before opening, and then after switching the same reasoning
  says switch back, forever. I get that the usual resolution says the expected value
  calculation is only well-defined if you have a prior over the envelope amounts.
  But here''s the thing I can''t get past: once you''ve actually opened the envelope
  and seen $10, isn''t it just a fact about the situation that the other envelope
  is equally likely to be $5 or $20? Like, the setup says one envelope has twice the
  other, so conditional on seeing $10, there are exactly two possibilities, and by
  symmetry they should get equal probability. So even if the prior is undefined before
  opening, after conditioning on the observed amount the switch is justified. Where
  does this go wrong?"


  This is excellent: the false presupposition is that "by symmetry" the two possibilities
  are equally likely conditional on seeing $10. The correct answer: the setup doesn''t
  specify a distribution; "equally likely" is not implied by symmetry in this case
  because the events "the other envelope is $5" and "the other envelope is $20" correspond
  to different possible pairs (5,10) vs (10,20), and their probabilities depend on
  the prior over pairs. You can''t derive equal conditional probabilities from ignorance;
  that''s a kind of principle-of-indifference fallacy. Also, there is no uniform distribution
  over the positive reals. This is a classic in-the-weeds confusion, and the answer
  would correct rather than answer as asked.


