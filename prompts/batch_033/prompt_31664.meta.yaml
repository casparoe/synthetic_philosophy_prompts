  conflates the primary intension of a subsentential expression (which is associated
  with a priori reference-fixing conditionals) with the primary intension of the whole
  sentence (which is not knowable a priori). Or conflates knowing the primary intension
  of a term with knowing the primary intension of a sentence. A good answer would
  correct this.


