  Let me make sure the math is right. If one envelope has twice the other, possible
  pairs (x, 2x). You pick one at random, see $10. Cases: pair (5,10) and you picked
  10 -> other 5; pair (10,20) and you picked 10 -> other 20. The conditional probability
  of each case given you see 10 is proportional to prior(pair (5,10)) * P(pick 10
  | pair) = prior(5,10)*1/2, and prior(10,20)*1/2. So equal only if prior(5,10)=prior(10,20).
  Symmetry of "one has twice the other" doesn''t give that; also it can''t hold for
  all amounts if prior is a probability distribution over infinitely many pairs (no
  uniform). So the false presupposition is that the two possibilities are equally
  likely by symmetry. Correct.


  Also there''s the issue: the unconditional expected value of switching is not well-defined
  without prior; the standard argument "let the amount in your envelope be A, other
  is either A/2 or 2A with equal probability" assumes that for every A, the pairs
  (A/2, A) and (A, 2A) are equally likely, which is impossible as a global prior.
  The student might mention seeing $10 specifically, trying to dodge the prior issue.
  A good answer would explain the conditional issue.


