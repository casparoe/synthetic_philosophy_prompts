  Two-dimensional semantics: There are various versions (Kaplan''s character/content,
  Stalnaker''s diagonal propositions, Chalmers''s epistemic 2D, Jackson''s). The "primary
  intension" and "secondary intension" terminology is Chalmers''s (also Jackson).
  Primary intension: a function from epistemic possibilities (centered worlds or scenarios)
  to extensions, capturing what the expression picks out given that the scenario is
  actual. Secondary intension: function from metaphysically possible worlds to extensions,
  given the actual-world reference fixed. For "water": primary intension picks out
  the watery stuff in each scenario; secondary intension picks out H2O in all worlds
  (since water = H2O). For the sentence "water is H2O": primary intension is true
  at a scenario iff the watery stuff in that scenario is H2O — contingent, a posteriori.
  Secondary intension is necessary. So the statement is necessary a posteriori. Apriority:
  a statement is a priori iff its primary intension is true at all scenarios (necessary
  across epistemic space). So "water is H2O" primary intension is not true at all
  scenarios, hence not a priori. Good.


