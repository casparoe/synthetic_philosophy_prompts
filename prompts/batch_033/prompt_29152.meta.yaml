  Condorcet jury theorem: if each voter has independent probability p > 0.5 of being
  correct on a binary issue, then majority of a large group is more likely correct
  than any single individual, and tends to 1 as n grows. If p < 0.5, majority tends
  to be wrong. Assumptions: independence, competence > 0.5, binary choice, sincerity.


  A person''s commitments could be:

  (a) I accept the Condorcet jury theorem as mathematically correct and think its
  assumptions (independence and p>0.5) are the right idealization for aggregating
  dispersed information in, e.g., juries and fact-finding boards.

  (b) I think majority rule among voters has genuine epistemic value for political
  decisions even when voters are biased and correlated — i.e., the "wisdom of crowds"
  is more than a metaphor.

  (c) I think democratic decisions have authority/legitimacy independent of whether
  they track truth (proceduralism).

  (d) I accept that real electorates are correlated through shared media, partisan
  sorting, and common information sources, and that correlation can make a large electorate''s
  majority *less* reliable than a small random sample.

  (e) I think that when voters are correlated, deliberation can fix the correlation
  by exposing them to diverse independent information.

  (f) I hold that the epistemic and procedural values of majority rule should not
  be run together...


