  Some experimental results: Condorcet jury theorem in lab, but also evidence of groupthink.

  - Also the problem that p > 0.5 is an empirical assumption; for many issues voters
  are systematically misinformed (e.g., Dunning-Kruger?).

  - Also the "common cause" / shared evidence problem: if everyone watches the same
  biased media, independence fails.


