  I should be careful about stating facts accurately. The CJT: given a group deciding
  between two alternatives, one of which is correct (common interest), if each voter
  has independent probability p > 0.5 of choosing the correct alternative, then the
  probability that the majority chooses correctly increases with group size and tends
  to 1 as n grows. Condorcet 1785. That''s standard and I know it.


  Things that count against using CJT to justify majority rule:

  - The "correct alternative" assumption: for many political questions there''s no
  independent standard of correctness; the theorem requires a common objective. If
  politics is about conflicting interests/values, not a common question with a correct
  answer, the theorem doesn''t apply. This is a big one.

  - Independence: votes must be independent conditional on the state. Real voters
  are correlated: shared information sources, common causes, deliberation, cascades.
  Correlated votes cap the asymptotic reliability (Ladha, etc.). Actually with correlation,
  majority may not converge to 1.

  - Competence assumption p > 0.5: heterogeneous competence; if some voters are worse
  than chance, majority can be worse than the average or than the best; "miracle of
  aggregation" may fail. Also systematic bias.

  - Strategic voting: the theorem assumes sincere voting, but if voters vote strategically
  (e.g., common-interest strategic voting), information aggregation can fail (Austen-Smith
  and Banks 1996 show sincere voting is not rational in CJT-type setups and strategic
  voting undermines the result? Actually they show that sincere voting isn''t necessarily
  rational, and the CJT conclusion doesn''t hold under strategic voting in some settings).
  I can mention without citation.

  - Two alternatives: generalization to multiple alternatives is problematic (Condorcet
  paradox, etc.).

  - Voter competence is not exogenous: participation, jury size, etc.

  - Also the "each voter equally competent" isn''t required for asymptotic result?
  The classic result: if average competence > 0.5 and independent, majority converges.
  Actually with heterogeneous p_i > 0.5 for all i, majority converges. If some below
  0.5, no. There are subtleties.

  - The theorem gives group competence increasing in n, but it doesn''t by itself
  justify majority rule normatively: majority rule is only one aggregation method;
  weighted voting by competence could do better; and the theorem doesn''t say majority
  rule is optimal.

