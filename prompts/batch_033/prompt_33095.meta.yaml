  The view: DNA contains "the code of life," often described as a blueprint/program.
  Subtle issues:

  - DNA is not a code in the sense of requiring a sender/receiver with intentions;
  "code" is used metaphorically. The genetic code (codon table) is a real, arbitrary
  (but fixed) mapping between nucleotide triplets and amino acids — arbitrary in the
  sense that other mappings are chemically possible, and there''s a real coding relation.

  - Conflating the genetic code (the codon-to-amino-acid mapping) with "DNA is a blueprint/program
  for the organism."

  - The blueprint metaphor overstates: DNA doesn''t specify the organism in a one-to-one
  way; development is epigenetic, context-dependent, environment matters. DNA is more
  like a recipe or a parts list/resources than a blueprint.

  - "Information" in biology: DNA contains information in Shannon sense (sequence
  is statistically non-random and carries information to downstream processes) but
  semantic information is more contested. The "central dogma" says information flows
  from DNA to RNA to protein, not that DNA alone determines phenotype.

  - Gene expression regulation, alternative splicing, epigenetics complicate "the
  code."

  - Also the claim "the human genome is 3 billion letters that spell out the instructions
  to build a human" — overstates; many regions noncoding, no one-to-one.


