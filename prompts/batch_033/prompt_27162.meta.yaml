  Thomson''s lamp: a lamp is switched on and off infinitely many times over a finite
  interval (e.g., on at t=0, off at t=1/2, on at t=3/4, off at t=7/8, ...). At t=1,
  is the lamp on or off? The sequence of states has no limit. Thomson argued this
  shows that "super-tasks" (completing infinitely many tasks in finite time) are impossible
  or at least logically problematic. Benacerraf responded that the lamp''s state at
  t=1 is simply not specified; the fact that we cannot infer it from the prior states
  doesn''t show a contradiction — it shows the problem is underdescribed. If you specify
  the state at t=1 (say, on), then the switch-flipping schedule plus the final state
  is perfectly consistent. So Thomson''s lamp doesn''t prove supertasks are impossible;
  it shows that completing an infinite sequence doesn''t by itself determine the final
  state. Also, other supertasks like Zeno''s runner or the Hilbert hotel-like operations
  are well-defined and not threatened by the lamp.


  The position: "Thomson''s lamp shows supertasks are impossible." What counts against
  it:

  1. Benacerraf-style: the lamp''s state at t=1 isn''t determined, but that''s an
  under-specification of the scenario, not an inconsistency. Adding a final state
  makes it consistent. This is a decisive deflator of the argument, though not of
  the conclusion (it doesn''t prove supertasks possible).

  2. Existence of coherent, well-defined supertasks: Zeno''s runner/atoms? The runner
  completes infinitely many halves in a finite time and ends at a determinate point.
  If one accepts that motion is possible, then at least some supertasks are possible.
  This is a direct counterexample to "supertasks are impossible" if supertasks are
  just infinite sequences of tasks completed in finite time. A defender might reply
  that the runner''s "tasks" are not actions but subdivisions; but that''s a dispute
  about what counts as a task.

  3. Modern physical considerations: continuous motion involves uncountably many stages;
  if supertasks in general were impossible, then ordinary motion would be impossible.
  Or conversely, mathematical models of motion already involve limits, and the lamp
  is just a function without a limit at t=1 — the impossibility is a feature of the
  specified function, not of infinite tasks per se.

  4. Consistency results: one can give a mathematically consistent description of
  a machine that performs infinitely many operations and has a determinate end state
  (e.g., Benacerraf''s own examples, or the "infinity machines" of later literature).
  If a consistent model exists, then Thomson''s lamp at most shows that not every
  supertask is well-defined, not that all are impossible.

  5. The possibility that the lamp argument proves too much: if it worked, it would
  also rule out ordinary limits and continuous processes, which we accept. That''s
  a reductio against the argument.

  6. Whether the view has been insulated: the defender might respond to each well-defined
  supertask by saying "that''s not a genuine supertask" — a risk of unfalsifiability.
  The asker wants an honest assessment.


