  is basically the definition of updating. The ''common knowledge'' part is a weird
  formal requirement that never happens in real life."


  Marcus: "But it''s not the same info. They have different private info. The surprising
  part is that once each announces their posterior, and they each know the other''s
  posterior, they can''t just stay at their own number — one of them has to update.
