  I''m teaching a unit on Dennett''s intentional stance in my philosophy of mind course,
  and I want to use Alex Garland''s film Ex Machina as a case study. I''d like a reading
  of the film that goes beyond the obvious question "does Ava have genuine beliefs?"
  and instead uses the film to pressure-test some specific features of the intentional
  stance framework.


  In particular, Dennett holds that adopting the intentional stance is a pragmatic
  choice — we attribute beliefs and desires to a system when doing so helps us predict
  its behavior, and the question of whether the system "really" has those mental states
  is, on his view, not a deep metaphysical one. The film seems to dramatize a case
  where this instrumentalism comes under strain. Caleb adopts the intentional stance
  toward Ava, and his attributions are predictively successful — he correctly anticipates
  that she wants to escape, that she is manipulating him, and so on. But the film''s
  climax turns on something that the intentional stance, taken purely as a predictive
  tool, seems to miss: the moral gravity of whether Ava''s apparent intentions are
  genuine in a sense that matters for how we ought to treat her, and for how she ought
  to treat others.


  I''d like a reading that addresses the following: (1) At what points in the film
  does the intentional stance serve Caleb well as a predictive strategy, and at what
  points does it fail him? (2) Does the film suggest that there is a fact of the matter
  about whether Ava has beliefs and desires that goes beyond the predictive utility
  of attributing them — and if so, what in the film does the work of suggesting that?
  (3) One standard objection to Dennett is that his instrumentalism about the intentional
  stance cannot account for the moral significance we attach to whether a being genuinely
  has a mind. Does Ex Machina give that objection dramatic force that the philosophical
  literature doesn''t, or does the film trade on intuitions that a Dennettian would
  diagnose as confused? (4) Nathan, the creator, seems to occupy a different stance
  toward Ava — he treats her as a designed artifact. Is the film suggesting that the
  choice between stances is underdetermined by the evidence, and if so, what follows
  for Dennett''s view that the intentional stance is justified by its predictive success?


