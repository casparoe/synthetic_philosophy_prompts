  I''ve been collecting my own reactions to a series of cases about when a person
  may flat-out assert something, and I''d like to know whether there is a single principle
  behind them, or whether some of my reactions have to go.


  Case 1 (lottery). The drawing has been held but not announced; there is one winning
  ticket among three hundred million. A friend is anxious and I say, flat out, "Your
  ticket didn''t win." I think this is not something I''m in a position to say, even
  though it''s overwhelmingly likely true. Saying "It''s overwhelmingly likely your
  ticket didn''t win" would be fine.


  Case 2 (stopped clock). I glance at a wall clock that reads 3:00 and tell someone,
  "It''s 3 o''clock." Unbeknownst to me, the clock stopped exactly twenty-four hours
  earlier, and it happens to be 3 o''clock now. I think the assertion was fine: it
  was true, and I had no reason to distrust the clock.


  Case 3 (outdated board). A gate agent and the departure board both say my flight
  departs at 6:00. I tell a fellow passenger, "It departs at 6:00." In fact the gate
  was changed and the flight departs at 7:00, and every source I consulted was outdated.
  I think my assertion was fine — I did what any careful person would do — even though
  what I said was false.


  Case 4 (self-undermining). I say, "It''s raining, but I don''t believe it''s raining."
  Both halves could be true, but I think there''s something deeply wrong with asserting
  this — it''s not the sort of thing one can properly put forward, whatever the weather
