  Case 5 (insincere but true). I tell a colleague, "The meeting is at noon," while
  fully believing it''s at 2:00. It happens to be at noon. I think the assertion was
  improper: it came out right only by luck.


  Case 6 (high stakes). I''m about to miss a deadline to deposit a check, and from
