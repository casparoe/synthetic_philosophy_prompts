  I''ve been collecting my own reactions to cases about when a person is in a position
  to make a flat-out assertion, and I''d like to know whether a single principle captures
  them or whether some of my reactions have to go. By "flat-out" I mean asserting
  that something is so, rather than hedging with "I think," "probably," or "I''d guess."


  Case 1 (the lottery). The drawing has been held but not announced, and there is
  one winning ticket among three hundred million. A friend is anxious, and I say flat
  out, "Your ticket didn''t win." As it happens, the ticket is a loser. I think my
  assertion was improper: I was not in a position to say that, even though it was
  overwhelmingly likely to be true and was in fact true. Saying "It''s overwhelmingly
  likely your ticket didn''t win" would have been fine.


  Case 2 (the stopped clock). I glance at a wall clock that reads 3:00 and tell someone,
  "It''s 3 o''clock." Unbeknownst to me, the clock stopped exactly twenty-four hours
  earlier, and it happens to be 3 o''clock now. I think the assertion was proper:
  it was true, and I had no reason to distrust the clock.


  Case 3 (the outdated departure board). A gate agent and the departure board both
  say my flight departs at 6:00. I tell a fellow passenger, "It departs at 6:00."
  In fact the gate was changed and the flight departs at 7:00, and every source I
  consulted was outdated. I think my assertion was proper—I did what any careful person
  would do—even though what I said was false.


  Case 4 (the self-undermining assertion). I say, "It''s raining, but I don''t believe
  it''s raining." Both halves could be true, but I think there is something deeply
  wrong with asserting this. Whatever the weather and whatever my state of mind, I
  am not in a position to put that forward flat out.


  Case 5 (insincere but true). I tell a colleague, "The meeting is at noon," while
  fully believing it is at 2:00. It happens to be at noon. I think the assertion was
  improper: it came out right only by luck.


  Case 6 (high stakes). I am about to miss a deadline to deposit a check, and from
  a hazy memory I tell my partner, "The bank is open Saturday." It is open Saturday.
  I think I should not have said that flat out; I should have checked or hedged.


  Case 7 (lucky guess). Having no idea where the keys are, I say, to stop someone''s
  searching, "The keys are in the drawer." They are in the drawer. I think the assertion
  was improper: I had no basis for it.


  Case 8 (baseless certainty). I am seized by a powerful hunch—I would sincerely describe
  myself as completely certain—that the keys are in the drawer, though I have no evidence
  either way. I say, "The keys are in the drawer." They are in the drawer. I think
  the assertion was improper, my certainty notwithstanding: bare certainty without
  a basis is not enough.


  The obvious rules each seem to fit some of these and collide with others. A knowledge
  rule—assert only what you know—agrees with me on 1, 4, 5, 6, 7, and 8, but it would
  condemn 2 and 3, which I am reluctant to condemn. A truth rule—assert only what
  is true—agrees with me on 2, but conflicts with 1, 3, 4, 5, 6, 7, and 8. A justified-belief
  rule—assert only what you justifiably believe—agrees with me on 2, 3, 4, 5, 7, and
  8, but it would license 1 and arguably 6. A certainty rule—assert only what you
  are certain of—agrees with me on everything except 8.


  Is there one principle, or a small set of principles, that captures all eight verdicts,
  or nearly all of them? If not, which of my reactions should I overturn, and why?
  And what does the best principle say about the case I keep going back and forth
  on: a doctor tells a patient, "The test came back negative," on the basis of a lab
  printout that is, unbeknownst to the doctor, erroneous—the test was actually positive.
  Is the doctor''s assertion in order, and should the stakes of the case make a difference?


