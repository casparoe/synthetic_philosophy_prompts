  Classical proof by contradiction: To prove P, assume ¬P and derive a contradiction
  (Q and ¬Q). Then conclude P. This uses the rule: if ¬P ⊢ ⊥ then ⊢ P. This is essentially
  double negation elimination (¬¬P ⊢ P), which is not valid in intuitionistic logic
  either. Actually intuitionistic logic validates "if P ⊢ ⊥ then ⊢ ¬P" (negation introduction)
  but not "if ¬P ⊢ ⊥ then ⊢ P" (which is classical reductio / double negation elimination).


  Does classical reductio rely on explosion? In classical logic, from ¬P ⊢ Q ∧ ¬Q,
  you can derive ¬¬P by negation introduction, then P by double negation elimination.
  Explosion (Q ∧ ¬Q ⊢ R) is not strictly required for that step; you can get ¬¬P without
  explosion. But to move from ¬P ⊢ ⊥ to ⊢ P you need classical double negation elimination
  (or equivalent). Actually there''s a subtlety: deriving a contradiction from ¬P
  gives ¬¬P (intuitionistically valid). Then classical logic gives P via DNE. So proof
  by contradiction depends on DNE, not explosion. However, in a classroom the teacher
  might say "if you reach a contradiction, anything follows, so the assumption is
  impossible" — that''s explosion. So the practice might presuppose both in different
  ways. A good answer would distinguish.


