  Domain: Jeffrey conditionalization and uncertain evidence.


  Background: Bayesian epistemology. Standard conditionalization: upon learning E
  with certainty, update P_new(H) = P_old(H|E). Jeffrey conditionalization (Richard
  Jeffrey) handles uncertain evidence: you undergo an experience that changes your
  probability for E from P_old(E) to some new value q (not necessarily 1), and for
  each partition element E_i, update P_new(H) = sum_i P_old(H|E_i) P_new(E_i). The
  issue: Jeffrey conditionalization is "non-commutative"/"order-dependent" — if you
  get successive uncertain evidence, the final result depends on the order of updating?
  Actually there''s the "commutativity" problem: repeated Jeffrey updates don''t commute,
  and the result can depend on the order. There''s also the problem that Jeffrey conditionalization
  treats the evidence partition as fixed, and the "input" probabilities are exogenous.
  The "rigidity" assumption: P(H|E_i) stays constant.


  A nice in-the-weeds challenge: strict conditionalization says evidence must be a
  proposition learned with certainty. But real evidence is often uncertain: e.g.,
  seeing an object in poor light shifts your confidence that it''s blue from 0.3 to
  0.7 without you becoming certain of any proposition. A strict Bayesian might respond
  by saying the evidence is really the proposition "it looks blue to me" or "my visual
  experience is thus-and-so", learned with certainty — but then the link between that
  proposition and "the cloth is blue" is a background assumption. The Jeffrey proponent
  can press: what''s the proposition you actually learned with certainty? Can you
  specify it without gerrymandering? Or: the "looks blue" proposition, learned with
  certainty, then requires conditionalizing on it, but that''s only equivalent to
  a Jeffrey shift if... Actually there''s a theorem: Jeffrey conditionalization can
  be represented as strict conditionalization on a "catching up" proposition? There''s
  the result that any Jeffrey update can be mimicked by strict conditionalization
  on some proposition if you have the right prior? Hmm.


