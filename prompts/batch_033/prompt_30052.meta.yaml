  the posterior should be a function of the prior and the total evidence, not the
  order in which it arrived. The Jeffrey defender may reply that evidence is temporally
  ordered and each update uses the posterior as the new prior, so order-dependence
  is exactly what we should expect; the "total evidence" is not independent of order
