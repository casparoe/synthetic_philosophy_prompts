  - How to define "large world" precisely; what counts as evidence about other agents''
  decisions.

  - Does ECL require an infinite universe, or does it work in finite but large worlds?

  - The relationship between ECL and FDT/UDT: does ECL capture the same recommendations?
  ECL is sometimes framed as showing EDT can do what FDT does if you take large-world
  correlations into account.

  - How do you avoid "cheating" via arbitrary correlations / reference classes? The
  problem of selecting the right reference class or the right notion of "similar agents."

  - Does ECL overgenerate: recommending cooperation with agents that are merely correlated
  through common causes but not through "decision-theoretic" links?

  - Indexical uncertainty and self-locating probabilities.

  - The connection to superrationality (Hofstadter), and whether ECL gives a decision-theoretic
  foundation for it.

  - What about agents with different utility functions — does ECL recommend cooperating
  with agents whose values differ?

  - Does ECL imply we should care about distant agents in our universe whose decisions
  are correlated with ours (e.g., other civilizations facing AI alignment)?


