  Evidential Cooperation in Large Worlds (ECL): Caspar Oesterheld''s work. The idea:
  evidential decision theory (EDT) says choose the act whose performance is best evidence
  for the desired outcome. In small worlds (finite, simple decision problems), EDT
  is often equivalent to CDT except in Newcomb-like cases. In "large worlds" (infinite
  universes, many agents), the evidential link between your decision and others''
  decisions can be much broader. ECL generalizes EDT to a setting with a "large world"
  — e.g., an infinite universe or a multiverse — where your decision provides evidence
  about the decisions of correlated agents (e.g., other copies of you, or agents facing
  similar problems). The upshot: you should cooperate in one-shot prisoner''s dilemmas
  with sufficiently similar agents because your choice of cooperate is evidence that
  similar agents cooperate, and in an infinite world, the payoff from the correlation
  dominates the payoff from your local interaction. It relates to the "psychological
  twin" / "functional decision theory" / "updateless decision theory" debates. Key
  concepts: "small world vs large world," "subjective dependence" / correlation, "evidential
  cooperation," "the chicken game"? Hmm.


