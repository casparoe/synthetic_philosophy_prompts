  Question: The hole argument is often summarized as showing that substantivalism
  about spacetime conflicts with determinism in general relativity. That summary runs
  together two claims: (i) spacetime points exist independently of the metric and
  matter fields, and (ii) two models related by a diffeomorphism that is the identity
  outside a region but not inside it represent distinct possible worlds. Write an
  essay that does three things. First, state precisely which package of commitments
  drives the argument, and reconstruct how it goes — keeping the manifold and the
  metric field distinct, and making clear the role of general covariance. Second,
  explain why the argument does not force us to abandon substantivalism altogether,
  but only a particular way of being a substantivalist. Third, say what a sophisticated
  substantivalist must claim about representation to restore determinism, and what
  philosophical cost that position pays, if any. An A answer will say exactly where
  determinism enters, and will state the sophisticated position without collapsing
  it into relationism.


  Model answer (around 600 words):


  A model of general relativity is a triple (M, g, T): M is the manifold, the set
  of spacetime points; g is the metric field, which gives the points their geometric
  properties; T stands for the matter fields. Substantivalism, in the form the hole
  argument targets, says M exists independently of g and T, and that the individual
  points of M are real in a strong sense: it matters which point has which metrical
  properties. That is, a substantivalist of this sort denies Leibniz equivalence and
  treats two models that differ only by which points play which roles as representing
  different possible worlds.


  General covariance, or diffeomorphism invariance, says that if (M, g, T) is a solution,
  then for any diffeomorphism d, (M, d*g, d*T) is also a solution, where d*g and d*T
  are the fields dragged along by d. This is a symmetry of the theory, not a physical
  transformation: it does not move the points, it moves the fields over the points.


  Now take a model with a Cauchy surface Σ and pick a region H to the future of Σ
  — the hole. Choose a diffeomorphism d that is the identity on Σ, on the past side,
  and outside H, but is nontrivial inside H. Apply it. The result is a second model
  that agrees with the first everywhere up to and including Σ, and agrees outside
  H, but inside H it assigns the metric and matter properties to different points
  than the first model does. Since the equations are diffeomorphism invariant, the
  second model is just as much a solution as the first.


  If the substantivalist insists these two models represent distinct possible worlds
  — because the same points have been given different properties — then the theory''s
  laws, together with the complete state on Σ, fail to fix what happens inside H.
  The same initial data are compatible with two different continuations. That is precisely
  a failure of determinism. So the argument shows that substantivalism (of the strong,
  point-individualist kind) plus general covariance yields indeterminism.


  But the argument does not show that substantivalism itself must go. The offending
  assumption is the combination of two things: that the points are bare individuals
  with identity independent of the fields, and that d-related models represent distinct
  worlds. The substantivalist can keep the manifold while denying the second claim.
  This is sophisticated substantivalism. It says the physical content of a model is
  not given by which particular point has which property, because the points have
  no primitive identity over and above the metric and matter fields defined on them.
  Diffeomorphism-related models are different mathematical presentations of one and
  the same physical world, much as two coordinate descriptions present one geometry.


  The price is that the substantivalist must give up haecceitism — the view that bare
  identity of points is physically meaningful — and with it the intuitive picture
  of spacetime as a container whose points are "there anyway" before the fields arrive.
  But the position is still substantivalist rather than relationist, because it does
  not reduce spacetime to relations among material events; it keeps the manifold and
  the metric as real, but denies that the identity of a point is something over and
  above the fields. Restoring determinism costs the substantivalist the bare points,
  not the spacetime.


