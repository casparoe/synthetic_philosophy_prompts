  Dennett''s distinction:

  - Skyhooks: "mind-first" explanations that invoke an unexplained, miraculous or
  top-down force — a "hook" hanging from the sky. Explanations that appeal to an intelligent
  designer, a vital force, a mysterious power of consciousness, or an unexplained
  "self-organizing" principle that does all the work without being cashed out in mechanisms.

  - Cranes: bottom-up, mechanistic explanations that build complexity gradually from
  simpler parts and processes that are themselves explicable — e.g., natural selection,
  algorithms, physical processes that can do lifting.

  - Greedy reductionism: Dennett''s term (from Darwin''s Dangerous Idea? Actually
  "greedy reductionism" is his phrase) for reductive explanations that overshoot —
  e.g., reducing all of human culture to genes, or explaining religion purely as a
  byproduct of... something without doing the actual explanatory work; ignoring the
  level of explanation where the real patterns live. Greedy reductionism is the opposite
  failure from skyhooks: explaining too much away too fast, jumping down levels without
  accounting for the higher-level regularities.


