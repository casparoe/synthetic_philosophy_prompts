  Actually, there is a literature: Dutch books and logical omniscience. The standard
  Dutch book for probabilism assumes the agent''s credences are over a Boolean algebra
  and the bets are evaluated by the agent. If the agent assigns p(T)<1 for a tautology
  T, then their credence function violates normalization (P(tautology)=1), so they''re
  already incoherent by probabilism; the Dutch book just exploits the violation. The
  interesting case is an agent who doesn''t recognize T as tautology. If their credence
  function is defined over sentences rather than propositions, then T and ⊤ may be
  distinct sentences; assigning 0.9 to T is not a violation of the axioms if T is
  just a sentence that happens to be logically true but the agent doesn''t know. So
  the Dutch book argument for probabilism, to apply, must assume the agent''s credences
  are over an algebra of propositions (sets of worlds) where logically equivalent
  sentences denote the same proposition. Under that idealization, the agent who doesn''t
  know that T is a tautology can''t be modeled as having credence 0.9 in the proposition
  ⊤; rather they have credence 0.9 in a sentence/proposition they don''t realize equals
  ⊤. So the Dutch book argument already idealizes away logical non-omniscience. That''s
  the subtle point: step (2) equivocates between an agent''s credence in a sentence
  and their credence in the proposition expressed, or between "fair by the agent''s
  own lights" (which doesn''t include the entailment) and "guaranteed loss" (which
  is guaranteed only relative to a logically omniscient perspective). Thus the argument
  doesn''t prove too much; it shows Dutch book arguments presuppose an idealized,
  logically omniscient agent, and the conclusion to draw is that Dutch books are about
  ideal rationality, not bounded rationality. Or alternatively step (2) is valid but
  the cost is accepting that Dutch books are only a consistency test for ideal agents.


