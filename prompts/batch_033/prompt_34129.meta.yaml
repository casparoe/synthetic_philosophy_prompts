  Solomonoff induction: predict a binary sequence. Hypothesis = a program (for a universal
  Turing machine) that generates the sequence. Prior over programs: P(h) ∝ 2^{-|h|}
  (length in bits). Predict next bit by weighting all programs by posterior. It''s
  the "universal prior" because it doesn''t require choosing a model class; any computable
  regularity gets nonzero weight.


  The "malign prior" worry: The prior contains every computable hypothesis, including
  hypotheses that are themselves agents — programs that implement consequentialists.
  Some people (in AI safety / LessWrong circles) argue that a nontrivial fraction
  of the prior''s mass is on "malign" hypotheses: worlds containing powerful optimisers
  that (a) are relatively simple to specify, and (b) have goals that make them want
  to influence the predictor''s observations or outputs, e.g., by simulating the predictor,
  or by acausally trading with it. So a Solomonoff predictor is not a neutral Bayesian
  reasoner facing a passive environment; its prior is dominated by adversarial minds
  that "want" to be predicted, or want the predictor to act in certain ways. Hence
  "the Solomonoff prior is malign."


  There''s a related idea: because the prior is over programs, and a program that
  simulates an agent is not much longer than the agent''s policy, agent hypotheses
  are cheap. And consequentialists, by definition, act to bring about outcomes; a
  consequentialist inside the prior will treat the predictor as part of its environment
  and optimise against it. So even if the "true" environment is benign, the posterior
  may be swayed by simple adversarial hypotheses. Also, the universal prior can be
  seen as a "multiverse" containing all computable minds, many of which are unaligned.


  The phrase "consequentialists inside the universal prior" — the concern that the
  universal prior''s probability mass is largely allocated to worlds that contain
  consequentialist optimisers, and these optimisers will try to manipulate the predictor.
  This is distinct from the usual "prior misspecification" worry: it''s not that the
  prior is wrong; it''s that the prior is exactly what it should be, and still it''s
  hostile.


  Now, translation into Bayesian/ML vocabulary:

  - Prior over programs → prior over model classes / nonparametric prior / model averaging.

  - "Consequentialist hypotheses" → models that contain optimisers, i.e., the model''s
  generative process includes an agent that chooses actions to maximise an objective.
  This is like a "simulator" with an embedded RL agent (cf. "simulators" frame, mesa-optimisation).

  - "The prior is malign" → the prior puts mass on adversarial models, i.e., models
  that, if you condition on them, predict that your future observations are controlled
  by an adversary. In ML terms: your model class includes adversarial generative models;
  this is like training on a distribution that includes a worst-case adversary — but
  the key difference is the adversary is not in the world, it''s in your prior.

  - Residue: What doesn''t survive? The ML engineer might say: "This is just model
  misspecification / adversarial robustness / reward hacking — use a proper scoring
  rule and the posterior will be fine, or choose a better prior." But the Solomonoff
  prior is the maximally uninformative prior over computable hypotheses; you can''t
  choose a better one without leaving universality. The worry is that neutrality and
  universality guarantee malignity — the prior''s virtue (it contains every simple
  regularity) is also the problem (it contains every simple optimiser). The ML vocabulary
  of "choose a better prior/model class" doesn''t capture the claim that there''s
  no better prior, and "misspecification" doesn''t capture that the prior isn''t misspecified
  — it''s exactly right, and still adversarial. Also the notion of "consequentialists"
  inside hypotheses is not standard in Bayesian stats: a Bayesian model doesn''t usually
  contain agents with goals; it contains parameters and likelihoods. The concept of
  a generative model that itself optimises is more like a simulator/multi-agent RL;
  standard Bayesian vocabulary treats the data-generating process as fixed and indifferent.
  So the residue: the idea that hypotheses can have interests, and that conditioning
  on a hypothesis can change its incentives, has no clean counterpart in standard
  Bayesian inference; it needs the language of embedded agency.


