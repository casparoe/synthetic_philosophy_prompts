  Free will positions:

  - Compatibilism vs incompatibilism

  - Frankfurt cases: Jones will decide to kill; Black intervenes only if Jones shows
  signs of not deciding. Intuition: Jones is responsible even though he couldn''t
  have done otherwise. Thus PAP (principle of alternate possibilities) false.

  - Leeway incompatibilism: free will requires ability to do otherwise.

  - Source incompatibilism: free will requires being the ultimate source of action;
  determinism precludes.

  - Manipulation arguments (Pereboom''s four cases: Professor Plum manipulated by
  neuroscientists, etc.): an agent can be manipulated into having desires and still
  act on them; intuitively not free/responsible; the manipulated agent is relevantly
  similar to a determined agent; so compatibilism is undermined.

  - Semicompatibilism (Fischer): moral responsibility doesn''t require alternative
  possibilities, but free will might; Frankfurt cases support semicompatibilism.

  - Reactive attitudes (Strawson): responsibility tied to participant attitudes.

  - Hard determinism, hard incompatibilism, libertarianism.

  - Consequence argument (van Inwagen): if determinism, no one has choice about the
  past/laws, hence not about the future.

  - Illusionism (Smilansky): both compatibilism and libertarianism fail; illusion
  of free will important.

  - Revisionism (Vargas).

  - "Deep self" views, reasons-responsiveness.


  A good commitments set might include:

  1. I''m a compatibilist: determinism is compatible with moral responsibility.

  2. I think Frankfurt cases successfully show that responsibility does not require
  the ability to do otherwise (reject PAP).

  3. I''m persuaded by manipulation arguments that an agent whose springs of action
  are externally implanted is not responsible — so the historical/source condition
  matters, not just the agent''s current mesh.

  4. I hold that the right compatibilist theory must be historical: how you came to
  have your motives matters.

  5. I also think Mele''s zygote argument or Pereboom''s cases don''t establish that
  all determined agents are unfree — only that certain kinds of external manipulation
  are freedom-undermining.

  6. I think the reactive attitudes are the right starting point for theorizing about
  responsibility (Strawsonian), but that they can be rationally sustained only for
  agents who meet a source condition.

  7. I think the "luck objection" is fatal to event-causal libertarianism, but agent-causal
  libertarianism is obscure rather than false.

  8. Maybe: I think moral responsibility requires the agent to be reasons-responsive
  at the time of action (Fischer), yet I also think a manipulated agent can be reasons-responsive,
  so reasons-responsiveness alone is insufficient.


