  Possible rules for "side effect" classification:

  - R1: Attainable utility preservation (AUP): side effect = reducing the ability
  to achieve a range of goals (measured over a neutral baseline policy).

  - R2: Relative reachability: side effect = reducing reachability of states from
  the current state.

  - R3: Value-laden/damage rule: side effect = destroying or degrading objects/entities
  that humans care about (or would care about).

  - R4: Causal/butterfly rule: side effect = any change to the environment outside
  the intended goal (strict minimalism).

  - R5: Counterfactual baseline: side effect = making the world different from how
  it would have been had the agent done nothing (or had it not acted).

  - R6: Reversibility: side effect = causing changes that are hard to reverse.


