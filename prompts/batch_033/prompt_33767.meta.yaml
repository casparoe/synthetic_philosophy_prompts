  - "Inviolate level": the idea that in any system, there''s a level of description
  (the "hardware" or the rules) that is protected from the system''s own self-reference;
  the system can''t jump out of itself or alter its own rules from within. In GEB,
  the inviolate level in a formal system is the level of the rules and axioms, which
  the system cannot see or change; self-reference occurs at higher levels (the "Tangled
  Hierarchy") but there''s always an inviolate level below which things are grounded.
  E.g., a self-modifying program still relies on the interpreter/hardware that doesn''t
  get modified.

