  tiny fraction of all humans.

  (3) Conditional on humanity ending soon (say, within a few generations, total ~200
  billion), your birth rank is utterly typical.

  (4) Therefore the fact that you find yourself around birth rank ~100 billion strongly
  favors the "doom soon" hypothesis over "doom late" — by Bayes, the likelihood ratio
  favors doom soon by the ratio of total populations.

  (5) So you should update heavily toward the belief that humanity will go extinct
  relatively soon, even if your prior was optimistic.

  Conclusion: something like "we should expect doom soon with high probability."


  Where does it go wrong? The standard options:

  - Reject the self-sampling assumption (SSA): deny that you should treat yourself
  as a random sample among all humans; instead you should reason from your own existence
  (SIA/self-indication assumption) which cancels the update, because a long-lived
  humanity contains more observers and hence your own existence is more likely under
  doom-late, exactly offsetting the rank effect.

  - Attack the reference class: which "humans" count? Observer-moments vs persons
  vs civilizations; the result depends on the choice of reference class, and there''s
  no principled way to choose.

  - Attack the applicability of random sampling to a single case: you can''t sample
