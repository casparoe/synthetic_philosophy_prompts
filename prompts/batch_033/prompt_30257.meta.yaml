  The argument should be numbered. I need to be careful about the logic. Let me reconstruct
  a rigorous version:


  (1) Deontological constraints are justified by the value of what they protect —
  say, the special status of persons, which is violated when someone is used as a
  mere means or killed.

  (2) If the point of a constraint is to protect that value, then a moral theory should
  minimize violations of it.

  (3) But deontological constraints are agent-relative: I''m forbidden to kill one
  innocent even to prevent five other killings by someone else.

  (4) So a deontologist who follows the constraint will sometimes allow more violations
  of the very value that justifies the constraint than an alternative that permits
  the lesser violation.

  (5) A principle that permits more violations of its own justifying value is self-defeating.

  (6) Therefore deontological constraints are either self-defeating or their justification
  must be something other than the value they''re said to protect.


  That''s a clean version. The classic response: reject (2) or (5): constraints are
  not about minimizing violations of a value; they''re about the agent''s relation
  to her own actions. The "paradox of deontology" (Scheffler) is roughly this. The
  asker wants to know which premise to reject and what it costs.


