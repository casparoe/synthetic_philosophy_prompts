  Draft:


  "I''m a PhD student working on bounded rationality, and there''s an argument I keep
  coming back to that seems to show satisficing is either a mistake or a fraud. It
  goes:


  (1) Suppose I''m choosing between options, and I know one option is better than
  the others by my own lights.

  (2) If I knowingly choose a worse option when a better one is available, that''s
  just irrational, unless the act of choosing has costs or benefits of its own.

  (3) Satisficing says I should pick any option that clears some threshold of ''good
  enough,'' even if I know a better one is available.

  (4) If the threshold is set to account for the costs of searching and deciding,
  then ''satisficing'' is just maximizing expected utility with search costs folded
  in — not a real alternative.

  (5) If the threshold is not set that way, then the choice is arbitrary: why this
  threshold and not a slightly higher or lower one?

  (6) So satisficing is either ordinary maximizing in disguise or arbitrary and irrational.


