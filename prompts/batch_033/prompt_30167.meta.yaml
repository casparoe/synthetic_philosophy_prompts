  variations on a theme — roughly, the idea that much creative work consists in taking
  a conceptual skeleton and turning its parameters, or knobs, to produce new instances,
  and that the deepest creativity lies in discovering new knobs rather than just twiddling
  the ones already given. I''d like a close philosophical reading of Tom Tykwer''s
  Run Lola Run through that lens. The film presents three runs of the same twenty-minute
  situation, and the differences among the runs are at once tiny and causally enormous:
  a stumble on the stairs, a split-second difference in timing, a different encounter
  along the route. Treat the three runs as variations on a theme in Hofstadter''s
  sense. What are the knobs the film twiddles, and which of them are merely local
  adjustments as opposed to alterations of the whole space of the story? Does the
  film''s creativity lie in the discovery of new knobs — and if so, what would those
  be? And where does the film resist the model? In particular, I suspect the variations
  in Run Lola Run are not neutral stylistic variants: they carry the film''s thinking
  about chance, agency, and fate, and the third run has a kind of earned resolution
