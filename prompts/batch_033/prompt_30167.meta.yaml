  rather than of fate or moral luck, flatten that out, or can it absorb it? I''d like
  the reading to be faithful in both directions: it should not reduce the film to
  an illustration of the theory, and it should not stretch the theory until it says
  nothing. Where the honest answer is that the model misses something the film is
  doing, say so."


