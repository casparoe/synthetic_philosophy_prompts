  Key concepts in luck egalitarianism:

  - Justice requires neutralizing inequalities due to brute luck (circumstances beyond
  one''s control: natural endowments, family background, accidents not chosen) while
  allowing inequalities traceable to option luck (risks voluntarily chosen, gambles,
  career choices).

  - The distinction: if you voluntarily take a risk and lose, the resulting inequality
  is not unjust (or at least not a matter of justice to compensate).

  - Critiques: the "harshness" objection (option luck can ruin people; leaving them
  uninsured is too harsh), the "shameful revelation" problem (identifying compensation
  with a public declaration of disadvantage), the problem of calibrating which preferences
  are "expensive tastes" vs brute bad luck (Dworkin''s expensive tastes), the egalitarian
  baseline problem, and the question whether the cut between brute and option luck
  is even principled.

  - Dworkin''s distinction: insurance market thought experiment — ask what insurance
  people would buy against brute luck behind a veil of ignorance. Interesting: Dworkin
  himself uses insurance imagery. That makes the translation to underwriting especially
  natural — the philosopher''s framework already has an insurance armature. But the
  asker may not know that; they thought of it on their own from insurance work.


