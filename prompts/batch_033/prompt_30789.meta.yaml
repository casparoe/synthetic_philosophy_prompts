  BHK interpretation:

  - A proof of A ∧ B is a pair (p, q) where p proves A and q proves B.

  - A proof of A ∨ B is either a proof of A with a tag "left" or a proof of B with
  a tag "right".

  - A proof of A → B is a method/construction transforming any proof of A into a proof
  of B.

  - A proof of ¬A is a proof of A → ⊥: a method transforming any proof of A into a
  proof of a contradiction (⊥).

