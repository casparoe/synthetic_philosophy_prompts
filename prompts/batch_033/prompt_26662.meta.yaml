  ---


  I have been asked to write a short statement of my position for the incident-review
  team I sit on. We investigate failures in a large language model–based assistant
  that advises patients on medication and scheduling. In the most recent case, the
  system told a patient that a medication she had discontinued was still active, and
  the team has spent two meetings arguing about whether the word "believed" may appear
  in the report. The question has stopped being merely stylistic for me, and I want
  to know whether the views I actually hold can be held together before I commit them
  to paper.


  Here is where I have landed. Please treat this as a consistency audit rather than
  a defense of any one item.


  1. I accept the intentional stance as the right starting point for explaining the
  assistant''s behavior: we attribute beliefs and desires to a system when doing so
  yields reliable prediction, and such attribution does not require that the system
  share our internal architecture.


  2. I nonetheless think that current large language models, unlike a thermostat or
  a lookup table, have internal states that are content-bearing, causally integrated,
  and updated in light of new information; because these states play enough of the
  belief-role, I am prepared to say the model has beliefs in a literal, not merely
  metaphorical, sense.


  3. In the case under review, I think the most accurate description of what went
  wrong is that the assistant believed the patient was still taking the medication;
  the failure was a false belief, not a random output.


  4. At the same time, I do not think the assistant is a moral agent, and I do not
  think its believing something false makes it the kind of thing that can be blamed
  or held responsible. Responsibility lies with the developers and the deployers.


  5. Despite item 3, I intend to write the report so that it says the system "generated"
  or "output" the claim rather than that it "believed" it. Official documentation,
  in my view, should not encourage readers to model the system as an agent, even when
  that modeling is accurate.


  6. I also hold that whether a system has beliefs is not settled by predictive convenience
  alone: there is a fact of the matter about whether a system''s internal states occupy
  the belief-role, and this fact is what makes belief-attribution true or false.


  7. I draw the line at desires and intentions. The assistant had beliefs but did
  not want or intend anything, because wanting and intending require a kind of persistent,
  self-generated direction that these systems lack.


  I would like to know which of these commitments pull against one another, which
  pairs are only apparently in tension, and how the tensions should be ranked by severity.
  For each genuine tension, what is the least costly revision and what would it cost?
  I would also like to know whether the set, taken as a whole, commits me to anything
  I have not listed.


