  Causation by omission disagreement: The philosophical issue: can omissions be causes?
  Standard views: (a) omissions can be causes (we say "the lack of water killed the
  plant"); (b) omissions are not genuine causes but only "quasi-causes" or explanations
  (Dowe: causation is physical process/transfer; omissions are not causes but can
  be cited in explanations); (c) normative/contextualist: whether an omission is a
  cause depends on what was expected/normal (McGrath, Thomson? Hart & Honoré). The
  disagreement could be:


  Two people argue about a case: a nurse forgets to check a patient''s oxygen and
  the patient dies. One says the omission caused the death. The other says omissions
  aren''t causes; the cause was the underlying disease; the omission is just a negative
  fact, and negatives can''t cause. First replies: then "the drought caused the crops
  to fail" would be false, but that''s a paradigm causal claim. Second: "the drought"
  is a positive event (absence of rain is an omission, but we reify it). Etc.


  The points can be genuinely good:

  - Pro-omission: ordinary causal talk is full of omissions; if omissions aren''t
  causes, huge swaths of explanation (medical, legal, moral) would be mistaken.

  - Anti-omission: causation is a relation between events; an omission is not an event
  but the absence of one; absences don''t exist, so they can''t be relata of causal
  relations. Also there''s the "selection problem": infinitely many omissions (the
  nurse omitted to check, the doctor omitted to supervise, the patient omitted to
  ask, the president omitted to fund the hospital, ...) — if all are causes, we can''t
  pick out "the" cause without norms; that shows causation by omission is normative,
  unlike genuine causation.

  - Pro-omission: but the same selection problem arises for positive causes (we select
  among causal conditions based on interests); that doesn''t show omissions aren''t
  causes, just that causal talk is interest-relative.

  - Anti-omission: there''s a difference — with positive causes there''s a physical
  connection; with omissions there''s no connecting process. The nurse''s failure
  didn''t touch the patient.


