  The Löbian obstacle domain: "The Löbian obstacle to self-trusting agents." This
  concerns agents that try to establish the trustworthiness of their own reasoning.
  Löb''s theorem implies a formal system can''t prove "if I prove φ then φ" for all
  φ unless it proves φ outright (or is inconsistent). So a self-trusting agent can''t
  prove its own soundness; it can only consistently believe it if it''s already sound?
  Actually Löb: if PA ⊢ (Prov(⌜φ⌝) → φ) then PA ⊢ φ. So a system can prove its own
  soundness only for sentences it can already prove. For an agent to trust its own
  proofs, it would need to assert reflection: Prov(φ) → φ. Löb says this only holds
  for provable φ. So self-trust is impossible to prove in full.


