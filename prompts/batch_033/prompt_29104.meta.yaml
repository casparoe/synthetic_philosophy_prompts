  I''m a novelist, and I''m currently researching a book whose central character is
  a natural-language AI. In the course of that research I''ve been reading around
  the philosophical debate over whether a computer program could literally understand
  language, and I keep tripping over the Searle–Dennett exchange. A popular science
  book I consulted summarizes it this way:


  "Searle''s Chinese Room shows that a machine running a program could pass the Turing
  test while understanding nothing, because the symbols it shuffles have no meaning
  to it. Searle allows that the man in the room, the room as a whole, and ordinary
  computers have ''derived'' intentionality: their states mean something only relative
  to the interpretations of outside observers. Human brains, by contrast, possess
  ''original'' intentionality — their thoughts are intrinsically about the world.
  Dennett answers with his ''two-bitser,'' a vending machine that accepts only quarters.
  The machine, Dennett says, is just as much ''about'' quarters as any brain state
  is about anything, since intentionality is always a matter of interpreting a system
  from the outside. Dennett thus shows that the Chinese Room argument fails, because
  there is no fact of the matter about whether any system ''really'' understands anything."


  I''m in no position to check this against the primary sources, and my novel will
  be shaped by whichever reading I trust. How fair is this summary? Please go through
  it claim by claim and tell me what a careful reader of both Searle and Dennett would
  accept, what they would wince at, and what is simply wrong. Then tell me whether
  the summary''s closing inference — that Dennett''s two-bitser shows the Chinese
  Room argument fails — follows from the accurate parts once the inaccurate parts
  are corrected. I''d particularly like to know whether the summary runs together
  Searle''s notion of derived intentionality with Dennett''s talk of interpretation,
  and whether Dennett is best read as denying a real distinction in kind or as relocating
  it. Finally, please say how confident you are in your assessment and single out
  the point you are least sure of.


