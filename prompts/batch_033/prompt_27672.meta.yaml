  Prompt draft:


  ---


  I am a software engineer with a background in typed functional programming, and
  over the last year I have been working through an introduction to the Curry–Howard
  correspondence and proof assistants such as Coq and Lean. This has made mathematical
  constructivism personally relevant to me in a way I did not expect: what began as
  a practical interest in writing verified code has turned into a philosophical position
  I now find myself wanting to defend. I have drafted a short essay for a reading
  group, and I would like your comments before I present it. I am not trained as a
  philosopher or a logician, so I am particularly worried that I have over-assimilated
  a technical idea and drawn a philosophical conclusion from it too quickly.


  The essay argues, in outline, as follows:


  1. The Curry–Howard correspondence shows that a proof of an implication is a function
  and, more generally, that a proof of a statement of the form "for every x there
  is a y such that R(x,y)" is a procedure that computes, from any given x, a witness
  y. In classical mathematics, by contrast, one can prove an existence statement from
  the mere inconsistency of its denial, and such a proof need not yield any witness
  at all. Classical existence is therefore only a double-negated notion of existence:
  it tells us that it would be contradictory for no such object to exist, not that
  an object is available.


  2. Under the Curry–Howard correspondence, the law of excluded middle is realized
  computationally by control operators such as call/cc, whose type is Peirce''s law.
  Classical logic is therefore not an alternative theory of truth but constructive
  logic extended with a single control operator. Since the double-negation translation
  embeds classical logic into constructive logic, classical logic is, for all mathematical
  purposes, a conservative extension of constructive logic, and its distinctive proofs
  are constructive proofs that manipulate their own continuations.


  3. The historical objection to constructivism was that it cripples mathematics by
  rejecting principles that working mathematicians rely on. Modern proof assistants
  undermine this objection: they allow large parts of mathematics to be developed
  constructively, and when a classical axiom is imported, the system records exactly
  where the nonconstructive step occurs. This turns the rejection of excluded middle
  from a prohibition into a kind of instrumentation.


  4. I conclude that the burden of proof has shifted. A classical mathematician who
  uses nonconstructive existence proofs owes an account of what "there exists" means
  if it does not mean that a witness is available. Absent such an account, constructive
  mathematics should be treated as the default interpretation of mathematical language.


  I would be grateful for comments of the following kinds. First, on technical accuracy:
  which of the claims in (1) and (2) are correct, which are overstated, and where
  have I conflated distinct results? Second, on the philosophy: does the argument
  from proof assistants to constructivism actually go through, or does it only show
  something weaker about how mathematics is formalized? Third, on the rhetoric of
  the conclusion: would a classical mathematician have a fair reply to my characterization
  of classical existence, and would a card-carrying constructivist object to any part
  of my framing? Finally, I would welcome your view on whether the essay''s thesis
  is interesting enough in its present form, or whether I should weaken it and, if
  so, to what.


  ---


