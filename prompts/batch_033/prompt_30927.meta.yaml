  Higher-order theories of consciousness: The basic idea is that a mental state is
  conscious iff there is a higher-order state about it. First-order theories say consciousness
  is a property of certain first-order states themselves (e.g., a state''s being globally
  available, or having a certain kind of representational content). The conceptual
  issue: higher-order theories explain consciousness relationally, but then the higher-order
  state itself is usually said to be non-conscious (otherwise regress). So the question:
  why does adding a non-conscious higher-order state make the lower state conscious?
  What is the explanatory work being done? Also the regress issue: if the higher-order
  state had to be conscious to confer consciousness, we''d need a third-order state,
  etc. The standard response: the higher-order state need not be conscious; it just
  needs to represent the lower state in a suitable way.


  Another in-the-weeds issue: the distinction between "state consciousness" and "creature
  consciousness" or between transitive and intransitive consciousness. Higher-order
  theories are about a state''s being conscious in the intransitive sense (I am having
  a conscious experience of red) vs transitive (I am conscious of the red tomato).
  The theory says intransitive state consciousness is explained by transitive consciousness:
  the state is conscious because I am conscious of it (via a HOT).


  Also the misrepresentation problem: HOTs are representations and can misrepresent.
  If a HOT says "I am in state X" when X doesn''t exist, does the subject have a conscious
  experience as of X? Rosenthal says yes; this leads to "targetless HOTs." This matters
  because if HOTs can''t misrepresent, the theory might collapse into something too
  strong.


