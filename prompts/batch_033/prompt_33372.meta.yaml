  Let me design the teaching prompt carefully.


  Audience: first-year undergraduates in a philosophy or PPE course, one fifty-minute
  section. The asker is a TA. They must teach the impartial spectator. The prompt
  should not ask the model to explain it but to plan.


  Key components:

  - What must come first: sympathy as Smith''s technical term (not pity, but the mechanism
  by which we enter into others'' sentiments via imagination, and by which we judge
  the propriety of a sentiment by whether we can go along with it given the situation).
  This must come first because the impartial spectator is constructed as the limit/correction
  of ordinary sympathetic judgment.

  - Then propriety: the fit between a person''s feeling and the situation that causes
  it; we approve when our imagined feeling matches theirs.

  - Then the problem of partiality: our own feelings are too strong and our knowledge
  of our own situation too partial; actual spectators don''t have full information
  and are biased; so we need a standard that corrects for this — the impartial spectator,
  who knows all the relevant facts and has no stake.

  - The move from actual to ideal/impartial: the spectator is not the actual people
  watching, but an imagined, well-informed, disinterested spectator; and we internalize
  it as "the man within the breast" (paraphrase: an internal judge) through social
  interaction, but it can be corrupted by actual opinion.

  - The distinction between being praised and being praiseworthy: the impartial spectator
  is what makes us care about praiseworthiness, not just actual praise.


  Carrying example: What example should carry it? Smith''s own examples: a person
  grieving (we sympathize by imagining ourselves in their situation, not by feeling
  exactly what they feel); the man who has lost his reason (we pity him less than
  he suffers because we imagine ourselves as we are, not as he is); the dead (we feel
  for them by imagining ourselves in their place, not because they feel anything).
  A good carrying example for teaching might be: watching a friend who is far angrier
  than the situation warrants — we can''t go along with the anger, so we judge it
  improper. Then scale it up: two friends in a dispute, each too partial to their
  own side; a third, informed but disinterested observer is the standard; then internalize.


  Actually for teaching, the carrying example should let all the pieces be introduced
