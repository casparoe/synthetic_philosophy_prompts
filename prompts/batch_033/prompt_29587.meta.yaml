  The absent-minded driver problem is a decision theory problem (Piccione and Rubinstein
  1997). It''s about a driver who falls asleep at the wheel, and at an intersection
  has a choice to exit or continue, with payoffs. The interesting issue: before falling
  asleep he plans a strategy, but at the second intersection he can''t distinguish
  it from the first. The debate is between optimal planning (ex ante expected utility)
  and consistent choice (taking the action at each information set). There''s a known
  tension: the ex ante optimal plan is to continue with some probability, but once
  he''s at an intersection, continuing seems worse than exiting... Actually the problem:
  payoff structure — exit at first: 0; continue then exit at second: 4; continue twice:
  1. With probability of continuing p, expected payoff = p*[(1-p)*4 + p*1] = 4p -
  4p^2 + p^2 = 4p - 3p^2. Maximizing gives p = 2/3, expected payoff 4/3. But at the
  second intersection, conditional on being there, exiting gives 4, continuing gives
  1, so continuing looks irrational. The "absent-minded driver" paradox is about imperfect
  recall and the conflict between ex ante optimality and conditional optimality. This
  could work for the "report verdicts" type or dialogue type.


