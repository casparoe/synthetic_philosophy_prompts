  2. Retroactive validity: a rule that says it took effect one turn before it was
  passed, so that it was in force when the vote on it occurred — making the vote that
  enacted it valid under its own authority.


  3. Conflicting amendment rules: two rules each claim to govern changes to the other;
  rule A says A can be amended only by procedure X, rule B says any rule may be amended
  by procedure Y, and B also says B takes priority over A in cases of conflict. The
  procedure should detect that priority itself is underdetermined.


