  Supervaluationism: admissible precisifications are classical models. A sentence
  is supertrue iff true on all precisifications. For borderline "F" (F a is borderline),
  "Fa" is neither supertrue nor superfalse. "Fa v ¬Fa" is supertrue because on each
  precisification it''s true. So LEM holds even though disjunction can be true without
  either disjunct being true. This is a subtle point students get wrong: they think
  supervaluationism is a three-valued logic where LEM fails or where disjunction is
  truth-functional. In fact supervaluationism is non-truth-functional: truth values
  of compounds are not determined by truth values of components (truth value gaps
  but classical logic preserved for most purposes; also the T-scheme? "It''s true
  that Fa iff Fa" — under supervaluationism, if "Fa" is borderline, the biconditional?
  Hmm, in supervaluationism, "T(''Fa'') iff Fa" — if Fa is neither true nor false,
