  This is a real loss.

  2. Normative authority of the all-things-considered judgment: in econ, present-biased
  choices are "wrong" only relative to the long-run self''s welfare or a welfare criterion
  (which is itself contentious); in philosophy, akrasia is a failure of practical
  reason, not just a welfare loss. The normative force of the better judgment may
  not be representable as a discount function.

