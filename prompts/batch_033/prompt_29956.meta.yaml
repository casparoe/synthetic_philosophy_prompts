  disease.


  For the purposes of the analysis, take naturalism to be the view that disease is
  a value-free departure from normal biological functioning, with Christopher Boorse''s
  biostatistical theory as its most developed version: health is statistically normal
  functioning for a reference class of the same age and sex, and disease is a statistically
  subnormal part-function that impairs survival or reproduction. Take normativism
  to be the view that judgements of health and disease are ineliminably evaluative,
  and that a condition counts as a disease only relative to judgements about harm,
  dysfunction, or the kind of life a person should be able to lead.


  The salient facts of the episode, as I understand them, are these. Homosexuality
  had been listed as a mental disorder in the DSM. In 1973, after years of pressure
  from gay and lesbian activists and from psychiatrists sympathetic to them, the APA''s
  Board of Trustees voted to remove the diagnosis, and the membership subsequently
  ratified the decision. The APA did not simply drop the category: it replaced it
  with a narrower one tied to distress about one''s sexual orientation, so that a
  person whose homosexuality caused them no distress would no longer be diagnosable
  on that basis alone. The decision was widely understood at the time to be partly
  scientific and partly political, and the episode is still cited as a paradigm of
  how social values enter psychiatric classification.


