  Sen''s liberal paradox (Amartya Sen, 1970, "The Impossibility of a Paretian Liberal,"
  Journal of Political Economy). The theorem: with unrestricted domain, Pareto principle
  (if everyone prefers x to y, society prefers x to y), and minimal liberalism (there
  are at least two individuals each of whom is decisive over at least one pair of
  social alternatives — i.e., society respects their preference over that pair), no
  social decision function can satisfy all conditions simultaneously (acyclicity of
  social preference). The classic example: two people, Prude and Lewd, and a copy
  of Lady Chatterley''s Lover. Prude prefers that nobody read it (N) over himself
  reading it (P) over Lewd reading it (L): N > P > L. Lewd prefers Prude reading it
  (P) over Lewd reading it (L) over nobody reading it (N): P > L > N. Prude is decisive
  over {P, N} (whether he reads it): he prefers N over P, so N > P socially. Lewd
  is decisive over {L, N} (whether Lewd reads it): he prefers L over N, so L > N socially.
  Pareto: both prefer P over L? Wait Prude prefers P over L, Lewd prefers P over L?
  Lewd: P > L > N, so Lewd prefers P over L. Prude: N > P > L, so prefers P over L.
  Yes both prefer P over L, so P > L socially by Pareto. Then we have N > P (liberalism),
  P > L (Pareto), L > N (liberalism): a cycle N > P > L > N. So no best alternative.


