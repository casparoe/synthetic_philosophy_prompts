  The background, as everyone in the group understood it: Sen''s theorem says that
  if a social decision procedure must (i) respect unanimity — whenever every individual
  strictly prefers X to Y, society prefers X to Y — and (ii) honor a minimal form
  of liberalism — at least two individuals each get to be decisive over at least one
  pair of alternatives — then there are preference profiles that force a social cycle.
  The standard illustration involves one copy of a book and two readers. The first
  reader prefers that no one read it, and if someone must, that he read it rather
  than the second; the second prefers that the first read it, and if not, that he
  read it rather than no one. Give the first decisiveness over whether he reads it,
  and the second decisiveness over whether he reads it. Pairwise decisiveness yields
  "neither reads" over "first reads" and "second reads" over "neither," while unanimity
  yields "first reads" over "second reads" — a cycle.


  The argument went as follows.


  (1) The first said the paradox is a real discovery about the structure of liberal
  commitments: you cannot simultaneously endorse unanimity-respecting social choice
  and protected personal spheres without adding a further doctrine specifying which
  preferences count. Every way of repairing the inconsistency — weakening the Pareto
  condition, restricting the domain, reformulating the decisiveness condition — is
  itself a substantive normative move with costs, and the theorem''s job is to force
  those costs into the open.


