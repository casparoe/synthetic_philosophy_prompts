  depends on counting meddlesome preferences — both readers'' preferences over the
  pair "first reads" versus "second reads" — as inputs to the Pareto condition. Actual
  liberal doctrine has never required social choice to track one person''s preference
  about another person''s reading, even when it happens to be unanimous; it says certain
  choices are outside social control. Restrict the domain to exclude such preferences,
  or formulate the condition as a right over acts rather than over full social states,
  and the standard cycle disappears. So the theorem shows only that an unrestricted-domain
  formalization that counts meddlesome preferences is inconsistent with Pareto.


  (3) The first answered that the domain restriction being offered as a technical
  fix is itself a substantive liberal principle — a theory of admissible preferences
  — and that is exactly the kind of theory the theorem forces into the open. Before
  Sen, one might reasonably have thought that "unanimity plus personal spheres" was
  a complete statement of the position; the theorem shows it is not. The cost of the
  proposed repair is that one now has to defend a filtering rule that excludes preferences
  people actually have, and that is a substantive cost rather than a defect in the
  theorem.


