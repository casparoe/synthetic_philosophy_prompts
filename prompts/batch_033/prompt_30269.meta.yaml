  At a small online reading group on social choice theory — the kind that treats Arrow''s
  theorem as a touchstone — two regulars spent most of an hour arguing about what
  Sen''s liberal paradox actually shows, and I was asked to referee. I could see both
  of them being partly right and partly talking past each other, but I couldn''t make
