  At a small online reading group on social choice theory, two regulars spent most
  of an hour arguing about what Sen''s liberal paradox actually shows, and I was asked
  to referee. I honestly couldn''t settle it, and neither of them moved. I''d like
  a point-by-point adjudication.


  The background, as everyone in the group understood it: Sen''s theorem says that
  if a social decision procedure must (i) respect unanimity — whenever every individual
  strictly prefers X to Y, society prefers X to Y — and (ii) honor a minimal form
  of liberalism — at least two individuals each get to be decisive over at least one
  pair of alternatives — then there are preference profiles that force a social cycle.
  The standard illustration involves one copy of a book and two readers. The first
  reader prefers that no one read it, and if someone must, that he read it rather
  than the second; the second prefers that the first read it, and if not, that he
  read it rather than no one. Give the first decisiveness over whether he reads it,
  and the second decisiveness over whether he reads it. Pairwise decisiveness yields
  "neither reads" over "first reads" and "second reads" over "neither," while unanimity
  yields "first reads" over "second reads" — a cycle.


  The argument went as follows.


  (1) The first said the paradox is a real discovery about the structure of liberal
  commitments: you cannot simultaneously endorse unanimity-respecting social choice
  and protected personal spheres without adding a further doctrine specifying which
  preferences count. Every way of repairing the inconsistency — weakening the Pareto
  condition, restricting the domain, reformulating the decisiveness condition — is
  itself a substantive normative move with costs, and the theorem''s job is to force
  those costs into the open.


  (2) The second replied that this reads too much into a modeling artifact. The conflict
  depends on counting meddlesome preferences — the first reader''s preference that
  he read it rather than the second, and the second''s reciprocal preference — as
  inputs to the Pareto condition. Actual liberal doctrine has never required social
  choice to track one person''s preference about another person''s reading, even when
  it happens to be unanimous; it says certain choices are outside social control.
  Restrict the domain to exclude such preferences, or formulate the condition as a
  right over acts rather than over full social states, and the standard cycle disappears.
  So the theorem shows only that an unrestricted-domain formalization that counts
  meddlesome preferences is inconsistent with Pareto.


  (3) The first answered that the domain restriction being offered as a technical
  fix is itself a substantive liberal principle — a theory of admissible preferences
  — and that is exactly the kind of theory the theorem forces into the open. Before
  Sen, one might reasonably have thought that "unanimity plus personal spheres" was
  a complete statement of the position; the theorem shows it is not. The cost of the
  proposed repair is that one now has to defend a filtering rule that excludes preferences
  people actually have, and that is a substantive cost rather than a defect in the
  theorem.


  (4) The second came back: then the theorem''s contribution is at most pedagogical.
  It prompts liberals to articulate what they already implicitly meant by "decisive
  over one''s own affairs." The impossibility result itself does no philosophical
  work once the model is corrected; a theorem showing that a bad model is inconsistent
  tells us nothing about liberalism. The punch of the example comes from combining
  Pareto with an unrestricted domain, a setup no real institution uses.


  (5) The first''s last word: impossibility theorems standardly use minimal, idealized
  conditions to locate hidden structure — that is how Arrow''s theorem works, and
  no one calls it a mere artifact. The artificiality of the two-person, three-alternative
  case is a feature: if a cycle arises under conditions this mild, the conflict is
  robust rather than an edge case. And the question the theorem forces — which preferences
  are legitimately decisive over which alternatives — was genuinely under-theorized,
  which is exactly why the result matters.


