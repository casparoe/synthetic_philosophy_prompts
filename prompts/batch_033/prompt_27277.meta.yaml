  Diplomatic recognition: when one state recognizes another state or government. In
  international law there are two main theories:

  - Declaratory theory (or declarative): recognition merely declares/acknowledges
  a pre-existing fact of statehood; statehood is determined by objective criteria
  (defined territory, permanent population, government, capacity to enter relations
  — Montevideo criteria). Recognition adds nothing constitutive.

  - Constitutive theory: recognition by other states is what creates/confers statehood
  or at least legal personality; without recognition an entity is not a state in international
  law, even if it has territory, population, government.


  Practice is mixed: the Montevideo Convention (1933) states the declaratory view
  ("The political existence of the state is independent of recognition by the other
  states"), yet in practice recognition matters enormously for access to international
  institutions, sovereign immunity, treaties, etc. Some entities (Taiwan, Kosovo,
  Palestine, Somaliland, Northern Cyprus) exist with de facto statehood but limited
  or contested recognition. Recognition can be withheld for political reasons; recognition
  of governments (as opposed to states) has its own doctrines (e.g., Tobar doctrine,
  Estrada doctrine).


  Hegel''s master–slave dialectic (Phenomenology of Spirit, self-consciousness chapter):
  self-consciousness exists only by being recognized by another self-consciousness.
  The struggle for recognition leads to a life-and-death struggle; one becomes master,
