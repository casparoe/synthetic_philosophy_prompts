  interests; it must not simply be a less capable agent. The divergence must be traceable
  to a single structural difference between the two designs, not to differences in
  competence, knowledge, or instruction. The case is for teaching, so it fails if
  it merely stipulates the verdicts rather than generating them from the two designs,
  or if the tool turns out to be an agent in disguise.


  After the scenario, show that it meets each specification: state the user''s instruction
