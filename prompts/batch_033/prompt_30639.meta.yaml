  in-the-weeds prompt.


  Quine''s thesis: In Word and Object, he argues for indeterminacy of translation:
  two translators can produce manuals of translation that are equally compatible with
  all behavioral evidence (all dispositions to verbal behavior) yet incompatible with
  each other; there is no fact of the matter about which is correct. The "gavagai"
  example: a field linguist observes natives saying "Gavagai" when a rabbit appears.
  The linguist can translate it as "Rabbit," but also as "undetached rabbit part,"
  "rabbit stage," "rabbithood," etc. Behavioral evidence underdetermines the translation.
  Quine''s point is about the indeterminacy of reference/meaning across languages,
  grounded in his behaviorism and rejection of meanings as mental entities. "Gavagai"
  is a stimulus meaning; the observation sentence "Gavagai" has the same stimulus
  meaning as "Rabbit" but the terms'' reference is inscrutable. Indeterminacy of translation
  is stronger than underdetermination of theory by evidence: Quine says even with
  all possible behavioral facts fixed, translation is indeterminate — it''s not just
  epistemic underdetermination but no fact of the matter. The slogan could be "there
  is no fact of the matter about translation" or "translation is indeterminate."


  Distinct claims the slogan could make:

  - Merely epistemic: we can''t know which translation is right (underdetermination).

  - Practical: different translation manuals can both fit all available evidence (underdetermination,
  but maybe one is right).

  - Semantic: translation is radically underdetermined by behavior; no fact of the
  matter about word meaning/reference across languages.

  - Ontological: there is no fact of the matter about meaning at all; meaning is indeterminate.

  - Methodological: translation is a matter of practical choice, not truth.

  - Relativism: any translation is as good as any other (not Quine''s view — he allows
  constraints like charity, stimulus synonymy).

  - Inscrutability of reference vs indeterminacy of translation: related but distinct;
  inscrutability of reference is about whether "gavagai" refers to rabbits or rabbit
  stages; indeterminacy of translation is about whole manuals. The "gavagai" example
  actually shows inscrutability of reference; the broader thesis is indeterminacy
  of translation.


