  Domain: semantics and pragmatics of slurs. Positions in the literature:

  - Semantic view: slurs have derogatory content as part of truth-conditional meaning
  (Hom, Hom & May).

  - Pragmatic view: slurs'' truth-conditional content is identical to neutral counterpart;
  derogation is expressive/pragmatic (e.g., conventional implicature, presupposition).

  - Prohibitionism: slurs have no truth-conditional content at all; they are prohibited
  words (Anderson & Lepore) — uses are offensive regardless of intention.

  - Deflationism: slurs aren''t semantically special; offense from taboo/association
  (e.g., Nunberg).

  - Reclamation: in-group uses can be non-derogatory; this challenges semantic views
  because truth-conditional derogation would persist.

  - Embedding: derogatory force projects out of negation, conditionals, questions,
  reports — used to argue against ordinary conversational implicature and for conventional
  implicature/presupposition.

  - Offense variability: slurs offend even when speaker doesn''t intend offense (out-group),
  but not when in-group.


