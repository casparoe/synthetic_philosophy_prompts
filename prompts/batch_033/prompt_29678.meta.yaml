  by the principle of charity: interpret so as to maximise agreement / optimise truth,
  making the speaker largely rational and right about the world by our lights. Charity
  is a constitutive constraint on interpretation, not optional politeness. It has
  components: assume speakers are largely consistent/coherent and correspond to the
  world as we see it. Radical interpretation is not translation; it''s the more fundamental
  question of what determines meaning. Davidson''s view is not that meaning is indeterminate
  or that interpretation is arbitrary; charity is meant to make interpretation possible
  at all. Also "passing theory" in later work — but keep it simpler.


