  Let me refine the advance directives argument to be philosophically tight.


  Domain: advance directives and the authority of the earlier self. The central question:
  does the earlier competent self have authority over the later demented self? Dworkin
  says yes (precedent autonomy, critical interests). Dresser says the then-self''s
  current interests should govern; the earlier self is gone. There''s also the "identity"
  question: is the demented person the same person? Some (Buchanan) distinguish numerical
  identity vs. psychological continuity. The argument that proves too much could be:


  (1) The authority of an advance directive rests on the autonomy of the person who
  made it.

  (2) Autonomy is a capacity of a person at a time; its exercises don''t automatically
  bind later times — otherwise a competent adult could never change her mind.

  (3) So if the directive binds the later self, it must be because the later self
  is not the same person (the earlier self is the "real" person) or because the later
  self lacks autonomy.

  (4) If the later self is not the same person, then the directive is one person making
  decisions for another, and no one has that authority just by writing a document.

  (5) If the later self is the same person but lacks autonomy, then her current preferences
  still carry weight because we respect the experiential interests of non-autonomous
  persons (we don''t override a child''s terror just because a parent consented earlier).

  (6) Therefore the directive either lacks authority or rests on a claim that earlier
  selves own later selves.


  Conclusion: this proves too much — it either guts advance directives or licenses
  paternalism toward our future selves generally.


  Which premise to reject? Could reject (2): some exercises of autonomy do bind later
  selves (promises, contracts, Ulysses arrangements) — so autonomy can bind. But then
  the question is why advance directives are like Ulysses contracts and not like the
