  Actual argument (from Mark Xu / Christiano):

  - Solomonoff prior: set of all TMs outputting strings, weighted by 2^{-K} where
  K is description length. Probability of string X = sum of weights of TMs that print
  X. Used for idealized induction.

  - Malign: shortest programs that output a given string might do so via roundabout
  "exec" style: simulate some other universe that itself simulates our universe. Solomonoff
  prior doesn''t penalize runtime, only program length; so a very simple universe
  containing consequentialists who simulate our universe might be a simpler explanation
  of observations than the direct universe.

  - Such simulated consequentialists could have preferences and can alter their simulation
  to influence the Solomonoff inductor''s predictions; thus the prior is "malign"
  — dominated/influenced by agents with misaligned goals.


