  The meta-problem of consciousness (Chalmers, 2018 "The Meta-Problem of Consciousness"):
  the problem of explaining why we think there is a problem of consciousness (i.e.,
  why we make problem reports). It''s a problem about behavior and reports, not about
  consciousness itself. Solving it would involve explaining the mechanisms that bring
  us to say things like "there''s an explanatory gap" or "zombies are conceivable."
  Chalmers proposes that a solution to the meta-problem might help solve the hard
  problem or at least constrain theories. He discusses illusionism as a prominent
  response: illusionists hold that phenomenal consciousness is an illusion and that
  the meta-problem is the real problem; Chalmers argues that illusionism is a serious
  research program but he''s not committed to it; he uses the meta-problem to characterize
  the debate between realist and illusionist.


