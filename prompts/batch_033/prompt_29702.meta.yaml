  1. I am a Humean about objective chance. Chance is not a primitive modal property
  of events; the chances at a time are fixed by the whole pattern of local, categorical
  facts, roughly in the way Lewis''s best-system account describes: the chance laws
  are the theorems of whichever systematisation best balances simplicity, strength,
