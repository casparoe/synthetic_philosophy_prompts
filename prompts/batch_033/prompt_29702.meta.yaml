  The Principal Principle (Lewis 1980, "A Subjectivist''s Guide to Objective Chance"):
  Let C be a reasonable initial credence function. Let X be the proposition that the
  chance at time t of proposition A is x. Let E be any proposition that is admissible
  at time t. Then C(A | X E) = x. Admissible information: information about the past
  up to t, and information about how chances depend on history (the chance theory),
  but not information about the future after t. Roughly: the present chances screen
  off the past (admissible) but not the future.


  Lewis''s undermining problem: for a Humean, the chance theory T is a proposition
  about the entire history of the world. Suppose T is the true theory. An undermining
  future F is one such that if F were the future, the best system would be T'' not
  T, so F entails ¬T. T might assign positive chance to F. Then by PP, C(F | T) =
  ch_T(F) > 0. But since F entails ¬T, and T entails ¬F? Wait, does T entail ¬F? T
  is the complete chance theory; if T is true and F entails ¬T, then T entails ¬F.
  Yes: if F implies not-T, then T implies not-F. So C(F | T) = 0. Contradiction with
  PP''s value x > 0. Therefore PP is inconsistent for Humeans if such undermining
  futures have positive chance. Lewis argues undermining futures do have positive
  chance (they''re possible futures with the right probabilistic patterns), so the
  original PP must be revised. The New Principle: C(A | T E) = ch_T(A | T), i.e.,
  the chance of A conditional on the chance theory T. Or sometimes written C(A | X
  E) = ch(A | X E)?? Let me recall: Lewis''s New Principle: C(A | H_tw T_w) = ch_tw(A
  | T_w). So conditional on the complete chance theory, use the chance of A conditional
  on that theory being true. This avoids the undermining problem because conditionalising
  on T itself.


