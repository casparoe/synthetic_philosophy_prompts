  The dominant view in pain science: pain has sensory-discriminative and affective-motivational
  components. Pain asymbolia is often cited as evidence that these can dissociate:
  patients report the sensation but no unpleasantness. Philosophers debate whether
  this supports the view that pain''s badness is not intrinsic.


