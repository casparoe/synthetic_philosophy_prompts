  2. Pain''s unpleasantness is a separate component; asymbolics have pain without
  the badness, so badness is not essential to pain.

  3. Evaluativism: pain consists of a bodily sensation plus an evaluative attitude
  (the subject represents the sensation as bad). Asymbolics have the sensation but
  lack the evaluation. So badness is not intrinsic to the sensation but is intrinsic
  to the full experience of pain.

