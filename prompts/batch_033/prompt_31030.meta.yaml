  The setup: Kripke''s Wittgenstein presents a skeptical paradox about meaning. Consider
  ''plus''/''+''. I have computed many sums in the past, but only finitely many. The
  skeptic picks a number pair I''ve never computed, say 68 + 57. I confidently answer
  125. The skeptic says: maybe in the past I meant ''quus'' by ''+'', where quus =
  x + y if x, y < 57 (or some threshold), and 5 otherwise. All past computations are
  consistent with both plus and quus. Nothing about my past usage, mental images,
  dispositions, etc., determines that I meant plus rather than quus. Therefore there''s
  no fact of the matter about what I meant. This is the skeptical conclusion.


  Kripke then offers a "skeptical solution": meaning is not a matter of truth conditions
  but of assertability conditions; a person means plus by ''+'' if their use agrees
  sufficiently with that of the community; the community sanctions deviant uses. So
  meaning is normative/social.


  Possible disagreements:

  - Dispositionalism vs. normativity. Person A: meaning is determined by dispositions:
  I was disposed to answer 125 to 68+57, so I meant plus. Person B: dispositions are
  finite and include errors; also dispositions don''t account for normativity — I
  might be disposed to make mistakes. Also Kripke''s objections: dispositional account
  cannot distinguish between being disposed to make mistakes and what the rule requires;
  there''s no fact about which disposition constitutes correctness. Could be a good
  back-and-forth.


  - The "quus" threshold. Dispositionalist might say: you were disposed to answer
  125, and also disposed to apply ''plus'' generally. The skeptic''s point is that
  any finite set of past applications can be fit by infinitely many rules (grue-like),
  so dispositions don''t fix meaning.


  - Community view: meaning as agreement with community. Disagreement: is community
  just a bigger individual? If the whole community could be quus-like, then does that
  make quus correct? Does the community response settle normativity or just shift
  it? Also, how much agreement? Everyone could be wrong (e.g., scientific community
  pre-Copernicus?).


  - The skeptical solution and "straight" solution.


  A good disagreement could be between two people: one a dispositionalist (there is
  a fact about what I mean, fixed by my dispositions), and another a Kripkean skeptic
  (no fact of the matter; only community assertability). Or a debate about whether
  the community view escapes the paradox.


