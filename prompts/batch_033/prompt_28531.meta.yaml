  Actually Fitch''s paradox: the knowability principle says every truth is knowable
  (possibly known): ∀p(p → ◇Kp). The conclusion is omniscience-ish: ∀p(p → Kp), all
  truths are known. The argument uses the Moore sentence "p is true and nobody knows
  that p" (p ∧ ¬Kp). If that were knowable, then possibly someone knows (p ∧ ¬Kp).
  But knowing a conjunction entails knowing each conjunct, so K(p ∧ ¬Kp) → Kp ∧ K¬Kp.
  Knowledge is factive, so K¬Kp → ¬Kp. Thus Kp ∧ ¬Kp, contradiction. So the Moore
  sentence is unknowable. But if the knowability principle says all truths are knowable,
  and the Moore sentence (when true) is a truth, it must be knowable. Contradiction;
  hence the Moore sentence is never true, so if p then not not-known, i.e., if p then
  someone knows p. So all truths are known.


