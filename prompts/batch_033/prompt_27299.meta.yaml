  Step (1) is a version of act-consequentialist/expected utility rationality: an act
  is rational iff it maximizes expected value of preferences at choice time. Step
  (2) claims retaliation after attack fails that test. Step (3) claims that if carrying
  out is irrational under (1), a rational adversary won''t believe the threat. This
  assumes common knowledge of rationality and of payoffs. That''s questionable: the
  adversary may not know your payoffs; you might have a different utility function
  than assumed (e.g., you value revenge, or the honor of your nation, or keeping a
  promise, or the precedent for future interactions); or the adversary might assign
  positive probability that you''re irrational or that you''ve precommitted. So step
  (3) is false as stated because it moves from "carrying out would be irrational under
  (1) for the threatener with the preferences we''ve assumed" to "the adversary will
  assign zero credibility." Credibility only needs to lower expected costs enough
  to deter, which can happen with small probabilities of irrationality or commitment.
  Also, even if carrying out is irrational ex post, it can be rational ex ante to
  cultivate a disposition to carry out, or to delegate to an automatic system. So
  the argument conflates ex ante and ex post, and conflates certainty with sufficient
  probability.


