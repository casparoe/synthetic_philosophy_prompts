  I''ve spent the last year reading about the argument that Gödel''s incompleteness
  theorems show that human minds aren''t mechanical — the argument that J.R. Lucas
  made in the 60s and that Roger Penrose later revived in The Emperor''s New Mind
  and Shadows of the Mind. The core idea is: take any consistent formal system that
  a purported mind-mechanism would correspond to. By Gödel''s first theorem, there''s
  a sentence true in the standard model of arithmetic that the system can''t prove.
  But we — the human mind — can see that it''s true. So we''re not that system. And
  since the argument applies to any candidate formal system, the mind isn''t a formal
  system at all.


  The counterarguments have been around just as long: maybe we can''t know we''re
  consistent; maybe we can''t actually "see" the truth of the Gödel sentence for a
  system complex enough to be us; maybe we are a formal system but one we can''t state
  or survey; maybe the argument smuggles in an idealized "we" that doesn''t correspond
  to any actual human.


  What puzzles me is that this debate has been going for sixty years and nobody seems
