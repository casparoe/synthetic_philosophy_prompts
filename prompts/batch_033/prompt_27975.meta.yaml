  Quine''s actual view:

  - Two dogmas: (1) the analytic-synthetic distinction (truths grounded in meaning
  independent of fact vs. synthetic grounded in fact), and (2) reductionism (each
  meaningful statement equivalent to a construction of terms referring to immediate
  experience).

  - Quine argues analyticity can''t be defined without equally problematic notions
  (synonymy, semantical rules, necessity) and the distinction is "an unempirical dogma
  of empiricists."

  - He proposes holistic confirmation: our statements face experience as a corporate
  body; the unit of empirical significance is the whole of science.

  - Any statement can be held true come what may if we make adjustments elsewhere;
  conversely no statement is immune to revision (even logic/math). This is not "everything
  is revisable in practice" but in principle.

  - He does not say there are no analytic truths; he says the boundary cannot be drawn
  non-circularly. He doesn''t deny that some sentences are more firmly entrenched
  or that we can label them analytic for practical purposes.

  - He also doesn''t claim mathematics is empirical in the same way as ordinary observation
  sentences; he says mathematics is part of the web but at the periphery? Actually
  mathematics and logic are at the center, more remote from experience; not revised
  lightly.


