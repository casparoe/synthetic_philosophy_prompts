  a new academic-integrity rule: any use of an AI tool (such as ChatGPT) to "generate,
  outline, or substantially revise" any graded assignment is a first-offense violation
  carrying a semester-long suspension and a permanent notation on the student''s transcript.
  The handbook requires changes to academic-integrity policy to go through a Faculty
  Senate vote and a two-week public comment period with the Student Government. Neither
  step was taken; the administration says the rule was posted in the handbook before
  the first day of school and has been in force since. A junior, M., used an AI tool
  to outline an essay but wrote the essay herself. She was reported, and the charge
  is now before us. M. argues (1) that the rule is not a real rule because it was
  never properly enacted, and (2) that the penalty is so disproportionate to the conduct
  that no fair body should apply it.


  Our Council is split. Some members say our job is only to apply the rules as written
  and leave questions of validity or fairness to the administration. Others say an
  improperly enacted or grossly unjust rule is no rule at all, and that enforcing
  it would make us complicit. Still others accept the rule is binding but want us
  to recommend a reduced penalty on fairness grounds.


  Please draft the short memo I will circulate. It should recommend a concrete course
  of action the Council can vote on, with a time frame, and it should engage the strongest
  version of each side rather than caricaturing it. I suspect the real issue is the
  one we touched on in Philosophy Club under the heading of legal positivism versus
  natural law — whether a rule''s validity is one question and its fairness another,
  or whether a sufficiently defective or unjust rule stops being a rule at all — but
  the memo itself needs to be usable by students who have never heard those terms.


  Before you draft, take time to think through the strongest arguments on both sides
  and where exactly the procedural defect and the severity of the penalty each matter.
  Then structure the memo with these sections, in this order and roughly these lengths:


  - Recommendation (one short paragraph, 80–120 words): the concrete course of action
