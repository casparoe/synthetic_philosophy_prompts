  The paradox of deontology: Deontological constraints (e.g., don''t kill the innocent)
  are agent-relative: they forbid an agent from performing an act of the forbidden
  type, even to prevent more instances of that same type by others. This creates a
  puzzle: if the reason not to kill is the disvalue of killings, then why doesn''t
  that reason tell me to minimize killings, even by killing one? If the constraint
  is against my killing, why should the fact that it''s mine make such a difference?
  This is often formulated: "It would be wrong to kill one innocent person even if
  doing so were necessary to prevent five other killings. But if killing innocents
  is so bad, why isn''t it better to have one killing than five?" The paradox is that
  the deontologist seems committed to a state of affairs containing more violations
  of the very thing she says matters. Samuel Scheffler discusses this; also the "paradox
  of deontology" phrase. I think it''s from Scheffler, The Rejection of Consequentialism,
  1982. The standard response involves the agent-relative/agent-neutral distinction,
  or Kamm''s "constraints protect the status of persons" / inviolability, or the idea
  that one should not aim at evil (the Doctrine of Double Effect), or that constraints
  are about the relation between the agent and the victim, not about minimizing counts.


  How to teach this: order of ideas. First, get clear on what a deontological constraint
  is (a restriction on action even when violating it produces the best consequences).
  Distinguish constraints from options (prerogatives) and special obligations. Second,
  introduce the notion of agent-relativity vs agent-neutrality maybe. Third, pose
  the paradox in a crisp case: the transplant case is for consequentialism, not exactly
  deontology. The relevant case: a terrorist says he will kill five unless you kill
  one. Or "you can prevent five murders by committing one murder." The carrying example
  needs to be carefully chosen: it should involve the same type of wrong (murder/murder,
  not murder/lying tradeoff) because the paradox is sharpest when the agent would
  violate the very same constraint to minimize violations of that constraint. So a
  case where killing one prevents five killings. If it''s a different type (killing
  vs torture), it''s less paradoxical because there could be lexical ordering or different
  weights. So the example must have same-kind violations, no special relationship
  to victims (not your child vs strangers), and no further consequences (e.g., the
  five are not themselves the ones threatening). Also it should be under the agent''s
  control and causally definite. The trolley? The standard "kill one to save five"
  is about killing vs letting die, which introduces the doing/allowing distinction
  — a confound. The paradox of deontology is sharper when it''s killing one to prevent
  five *killings* (not deaths by other causes), and when the one is not the would-be
  killer. We might set up a "villain will murder five unless you murder one stranger"
  case. That keeps it within the same constraint and avoids doing/allowing? Well,
  you''d be killing vs allowing five killings if you don''t. Still, the paradox is
  about constraint minimization. Hmm, a purer case: a doctor can kill one patient
  and harvest organs to save five? That''s transplant, but that''s about killing vs
  letting die and using as mere means. The paradox of deontology uses "murder one
  to prevent five murders."


  Actually, the typical formulation (Scheffler): "It is normally wrong to kill an
  innocent person, even if doing so would prevent the deaths of a greater number of
  other innocent people." The paradox: "How can it be right to refrain from killing
  one when that leads to five people being killed, if killing is what we have reason
  to prevent?" The deontologist says the constraint is agent-relative: each agent
  has a reason not to kill herself, but not necessarily a reason to minimize killings
  by others.


  Misconceptions: students conflate the paradox with the doing/allowing distinction
  (they think the deontologist''s response is just that killing is worse than letting
  die); they think the paradox shows deontology is incoherent, full stop, rather than
  showing a tension requiring an account of agent-relativity; they conflate agent-relative
  reasons with egoism or "special obligations" (they think the constraint is because
  the act is *mine* in a self-regarding sense); they think the solution is threshold
  deontology without noticing it reintroduces the puzzle at the threshold; they misstate
  the deontologist''s claim as "killing is worse than letting die" or as "rights are
  absolute." Also they may think the paradox arises only for absolutist deontology.


