  Dogmatism paradox details: If S knows p, then for any evidence e against p, S knows
  e is misleading. Since S knows e is misleading, S can disregard e while remaining
  rational. But intuitively, when counterevidence arrives, one should lower confidence.
  Kripke presents it: "If I know that p is true, I know that any evidence against
  p is evidence against something true; so I know that such evidence is misleading.
  But then I can rationally ignore it." Harman: "If I know that h is true, I know
  that any evidence against h is evidence against something that is false; so I know
  that such evidence is misleading." The paradox shows tension between knowledge-closure
  and the principle that one should be open to counterevidence. Proposed solutions:
  deny that one knows p merely... Actually the paradox is about whether knowledge
  can be "stable" under known counterevidence; whether evidence against what you know
  must always be misleading; and whether you can rationally ignore it.


