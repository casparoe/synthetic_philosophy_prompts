  The doctrine of double effect (DDE) says an action with both good and bad effects
  is permissible if: the act itself is not intrinsically wrong, the bad effect is
  not intended (only foreseen), the bad effect is not the means to the good effect,
  and the good effect is proportionate to the bad.


  Classic contrasting cases:

  - Terror bomber vs. tactical/strategic bomber: terror bomber intentionally kills
  civilians to end war (bad effect as means); tactical bomber bombs a munitions factory
  foreseeing civilian deaths as side effect. DDE says tactical is permissible, terror
  is not.

  - Hysterectomy on pregnant woman with uterine cancer (fetus dies as side effect)
  vs. craniotomy (crushing fetus''s skull to save mother — fetus''s death is means).
  DDE permits hysterectomy, forbids craniotomy.

  - Trolley: diverting trolley kills one worker on side track as side effect vs. pushing
  fat man off bridge as means. Many people''s intuitions track this: switch is okay,
  push is not.

  - Loop variant: the one on the side track is needed to stop the trolley (their body
  weight stops it), so killing is a means, not side effect. Intuitions shift.

  - Footbridge vs. switch.

  - Also "collateral damage" in war vs. using human shields.


