  I am a novelist. The book I am working on centers on two decision theorists — former
  collaborators, now estranged — one a committed subjective expected utility theorist
  in the Savage tradition, the other a defender of ambiguity-averse choice in the
  style of the maxmin expected utility literature. A central plot element is that
