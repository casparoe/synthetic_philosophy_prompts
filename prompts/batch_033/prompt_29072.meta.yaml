  Total balls 90: R=30, B = b, Y = y, b+y = 60, unknown b,y ∈ [0,60]. Bet R wins with
  prob 1/3. Bet B wins with prob b/90 (unknown in [0, 2/3]). Bet R∪Y wins with prob
  (30 + y)/90 = (30 + 60 - b)/90 = (90 - b)/90 = 1 - b/90 (unknown in [1/3, 1]). Bet
  B∪Y wins with prob (b + y)/90 = 60/90 = 2/3.


  So R: known 1/3; B: unknown [0,2/3]. R∪Y: unknown [1/3,1]; B∪Y: known 2/3. The modal
  pattern: R ≻ B (prefer known 1/3 to ambiguous [0,2/3]) and B∪Y ≻ R∪Y (prefer known
  2/3 to ambiguous [1/3,1]). Under SEU there must be a probability p = P(B). R ≻ B
  ⇒ 1/3 > p. B∪Y ≻ R∪Y ⇒ 2/3 > 1 - p ⇒ p > 1/3. Contradiction. So no single probability
  can rationalize the pattern; hence "paradox" for SEU.


