  Two-dimensional semantics (Chalmers, Jackson, etc.): The core idea is that meaning/truth
  conditions can be evaluated relative to two different kinds of possible worlds,
  yielding primary and secondary intensions. Primary intension: a function from centered
  worlds (or epistemic possibilities) to extensions, capturing what the expression
  would refer to if the world turned out a certain way; tied to a priori reasoning
  and epistemic possibility. Secondary intension: function from metaphysically possible
  worlds to extensions, given that the actual world is fixed; tied to metaphysical
  necessity.


  Key claims:

  - "Water is H2O" is metaphysically necessary but a posteriori (Kripke). 2D explains:
  primary intension picks out the watery stuff in each world (so not necessary at
  primary level), secondary intension is H2O in all worlds.

  - Primary intension is knowable a priori, or the a priori aspects of meaning.

  - Conceivability as epistemic possibility: a statement is conceivable iff not ruled
  out a priori (its primary intension is true at some centered world). Chalmers argues
  conceivability (primary) entails primary possibility, and sometimes links to metaphysical
  possibility via a further premise.

  - 2D semantics aims to reconcile Kripkean a posteriori necessities with Fregean
  senses.


  Now, a belief set with tensions. Let me construct commitments that are each standard
  but whose usual motivations conflict.


  Possible commitments:

  1. I''m a Kripkean about natural kind terms: "water is H2O" is necessary a posteriori,
  and identity statements between rigid designators are necessary if true.

  2. I accept two-dimensionalism: every expression has a primary and secondary intension,
  and the primary intension captures the a priori/epistemic dimension.

  3. I think Chalmers is right that conceivability entails primary possibility, and
  that for phenomenal truths, conceivability is a guide to metaphysical possibility
  (zombie argument).

  4. I think the primary intension of natural kind terms like "water" is something
  like "the watery stuff" and that this is a priori associated with the term.

  5. I''m skeptical that there is any stable a priori descriptive content associated
  with proper names and natural kind terms — I''m moved by Kripke''s arguments against
  description theories and think "water" isn''t synonymous with any description.


  There''s a known tension: 2D semantics, especially Chalmers''s "epistemic two-dimensionalism,"
  requires that names and natural kind terms have primary intensions that are a priori
  associated, i.e., some descriptive/epistemic content. But if you''re a thoroughgoing
  Kripkean anti-descriptivist, you might deny that there''s any such a priori content.
  So commitments (2) and (5) are in tension. However, 2Ders often say they are not
  descriptivists in the traditional sense; the primary intension is not a description
  the speaker has in mind but a function from worlds. The tension is real but subtle:
  you can hold both if you adopt a "two-dimensional" version that says primary intensions
  exist even without being known descriptions.


  Another tension: Chalmers''s modal rationalism: conceivability entails primary possibility,
  and for some (phenomenal) truths, primary and secondary intensions coincide, so
  conceivability entails metaphysical possibility. But if you accept Kripkean a posteriori
  necessities, you accept that primary and secondary intensions come apart for "water
  is H2O" — conceiving water ≠ H2O is primary possible but metaphysically impossible.
  That''s fine. But tension arises if someone holds that conceivability is generally
  a guide to metaphysical possibility while also accepting that for natural kind terms,
  conceivability does not track metaphysical possibility. That''s not a contradiction,
  just a scope restriction: conceivability guides possibility only when primary and
  secondary intensions coincide. A subtle confusion could be: "I think conceivability
