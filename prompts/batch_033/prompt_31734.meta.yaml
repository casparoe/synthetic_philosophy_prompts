  my credence that it landed heads should be 1/2, because the objective chance of
  heads was 1/2, and any other credence would be a refusal to defer to the chance
  — even though the flip is over and the outcome is already fixed.

  3. A third discussion, about a forecasting model that outputs a number for some
  geopolitical event. Someone claimed that rational agents should adopt the model''s
  number wholesale, because the model''s probability just is the objective chance,
  and rational credences defer to objective chances.


  I know there''s something in formal epistemology called the Principal Principle
  in this vicinity, but I''ve never seen its possible readings laid out side by side.


