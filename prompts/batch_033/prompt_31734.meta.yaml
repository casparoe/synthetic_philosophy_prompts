  Let me design the scenario carefully. The slogan "defer to the objective chance"
  gets invoked in different ways:


  1. "When you know the objective chance of A is x and you have no inadmissible information,
  your credence in A should be x." This is Lewis''s Principal Principle, or a version
  of it.


  2. "Your credence in A should equal the objective chance of A, full stop." This
  is false if you have evidence about A beyond the chance (e.g., A already happened,
  or you have a crystal ball). The naive reading.


  3. "Your credence should equal the chance conditional on your total evidence" —
  this is a different, maybe more defensible reading.


  4. "Chance is an expert function: your credence should be the chance, conditioned
  on your evidence" — the expert principle.


  5. "You should defer to the chance function rather than to your own judgment" —
  a practical norm about deference to a well-calibrated model or the physical probability.


  6. "Objective chance, not subjective credence, is the right kind of probability
  for decision-making" — a claim about what probability to use in expected utility.


  7. "If the objective chance of A is x, then the rational credence in A is x, no
  matter what else you know" — false because of inadmissible evidence (crystal ball
  problem, undermining).


  8. "Chance is a normative constraint on credence: a credence function is rational
  only if it conforms to the chances" — a global coherence constraint.


  9. The "New Principle" reading: "Your credence in A should equal the chance of A
  conditional on the actual chance theory being true" — handles undermining.


