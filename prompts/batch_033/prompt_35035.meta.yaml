  our panel is basically doing applied luck egalitarianism every week without realising
  it. A student who missed a deadline because they were in hospital gets a waiver;
  a student who missed it because they were at a festival doesn''t. But the actual
  cases are much murkier — mental health flare-ups that are partly out of a student''s
  control but partly about whether they sought help early, a family bereavement, a
  broken laptop with no backup, a flare-up of a chronic condition after a night out,
  taking on too many shifts at a paid job.


