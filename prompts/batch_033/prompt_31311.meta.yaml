  What subtle errors could I embed?

  1. Smith''s recommendation of representation in parliament proportional to taxation:
  he didn''t actually propose representation "in proportion to their taxation" exactly?
  Actually he did propose that representation should be in proportion to their contribution
  to public revenue, and the seat of empire should eventually move to America. But
  some summarize as if Smith favored immediate full integration and predicted that
  America would become the seat of the empire and Britain would be governed from there.
  That''s actually Smith''s point: he thought the natural course of things would transfer
  the seat of empire to America. A subtle error could be saying Smith "unambiguously
  favored independence" when Smith actually offered two alternatives and seemed to
  prefer the latter (union) but thought it was not politically feasible due to British
  merchants'' interests and the pride of the colonies. Or saying he thought the American
  colonies would inevitably become more powerful than Britain, so Britain should cut
  its losses and let them go; that''s close but he saw union as possible but unlikely.


  Another common oversimplification: Smith opposed empire on moral grounds and was
  an anti-imperialist. In fact, Smith''s critique was primarily economic and political:
  the monopoly trade was a mercantilist distortion, and the empire was costly to Britain
  and unfair to colonies. He did not morally condemn colonization per se; he thought
  colonies could be beneficial in terms of increased enjoyments and industry for Europe,
  but the exclusive monopoly was harmful. He also described the discovery of America
  as beneficial for Europe in general. So a summary that says "Smith thought the entire
  colonial project was a mistake from the start and that Europe derived no real benefit
  from the discovery and colonisation of America" would be inaccurate; he distinguished
  general advantages from the exclusive trade.


  Another subtle error: Smith''s proposal to give colonies representation or let them
  go is often summarized as an early argument for "no taxation without representation"
  and that Smith supported the American revolutionaries. Smith was sympathetic to
  colonial grievances, but he thought the best solution was either complete union
  or complete separation, not maintaining the status quo; he did not exactly side
  with the revolutionaries as anti-imperialist; he criticized British policy.


