  The argument:

  Let p be some truth nobody ever knows: p ∧ ¬Kp. By the knowability principle (every
  truth is knowable): ◇K(p ∧ ¬Kp). But K(p ∧ ¬Kp) entails Kp ∧ K¬Kp (knowledge distributes
  over conjunction). K¬Kp entails ¬Kp (factivity). So K(p ∧ ¬Kp) entails Kp ∧ ¬Kp
  — a contradiction. So K(p ∧ ¬Kp) is impossible, i.e., ¬◇K(p ∧ ¬Kp), contradicting
  the knowability principle applied to p ∧ ¬Kp. Therefore there can be no unknown
  truth: all truths are known (or at least: if all truths are knowable, then all truths
  are known). So the anti-realist''s principle is either false or collapses into something
  absurd.


