  to frame our discussion, and several of us have been relying on it. I would like
  to know how much of it I can trust before we build the rest of our conversation
  on it.


  [Summary in quotation marks]


  "Williams argued that utilitarianism requires agents to think as impartial calculators,
  weighing everyone''s interests strictly equally, including their own. His objection
  is that this is psychologically impossible: human beings are irreducibly partial,
  and no one can actually live as the utilitarian demands. His drowning-wife example
  is meant to show this. A man can save either his wife or a stranger; if he has to
  stop and deliberate about whether saving his wife is permitted, that extra step
  reveals that something has gone wrong in his marriage. Williams called this ''one
  thought too many.'' His conclusion is that any acceptable moral theory must permit
  agents to give special weight to their own deep projects and close relationships,
  because such commitments are what make a life worth living, and utilitarianism fails
  because it treats them as mere biases that distort impartial judgment."


  Please go through this summary sentence by sentence and tell me: (a) which parts
  a careful reader of Williams would accept as accurate; (b) which parts are common
  simplifications or distortions; (c) what Williams himself would likely reject or
  want to qualify; and (d) whether the concluding claim about what an acceptable moral
  theory must permit follows from the parts that are accurate. I am also interested
  in whether the summary runs together two distinct arguments in Williams''s work
  — the earlier discussion of integrity and ground projects, and the later drowning-wife
  example — and what the relation between them actually is. My scientific training
  makes me wary of armchair assertions about what is psychologically impossible, but
  I want to know whether that wariness is doing any philosophical work here or is
  beside the point.


