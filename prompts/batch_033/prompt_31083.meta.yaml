  Good''s theorem (1967): "On the Principle of Total Evidence." The expected value
  of cost-free information is non-negative, provided you update by conditionalization
  and you''re an expected utility maximizer. More precisely, for any decision problem,
  the expected utility of the optimal policy after observing signal Y is at least
  the expected utility of the optimal policy without observing Y, where the expectation
  is over Y. This holds for any signal, including noisy, as long as cost-free. The
  proof uses the fact that the decision maker could always ignore the information
  and choose the prior-optimal act, so having more options can''t lower expected utility.


  Subtle points/qualifications:

  - The theorem is about expected value ex ante, not actual value ex post. After seeing
  a particular signal, you might make a decision that turns out worse than what you
  would have done; but in expectation over signals, you can''t be worse off.

  - It assumes costless information. If information is costly, the theorem only says
  the expected value is nonnegative gross of cost; whether to buy depends on cost.

  - It assumes the decision maker updates by conditionalization / Bayesian updating,
  and that the choice set and utilities are fixed, states and acts independent of
  the signal in the right way. If the information changes your utility function or
  your available acts, or if you''re irrational/non-Bayesian updater, value of information
  can be negative.

  - Another subtlety: the theorem assumes the decision maker will choose optimally
  after the information. If you know you won''t act optimally or will misuse it, value
  can be negative.

  - It''s sometimes misremembered as "more information can never hurt you" — true
  only in expected value, costless, rational updater. Some counterexamples involve
  "you''d rather not know" due to psychological effects — but that changes utility
  of beliefs, not the standard theorem.

  - Good''s theorem doesn''t say you should always acquire information regardless
  of cost; it says expected gross value nonnegative.

  - Also the theorem as standardly presented concerns expected utility, not accuracy
  or happiness.


