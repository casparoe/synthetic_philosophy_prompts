  IIT basics (from knowledge): Integrated Information Theory, primarily associated
  with Giulio Tononi. Core idea: consciousness is identical to integrated information
  (phi, Φ). A system is conscious if it has intrinsic cause–effect power over itself
  — it generates information, and that information is integrated (irreducible to parts).
  It begins from phenomenological axioms: (1) Intrinsic existence — experience exists
  for itself; (2) Composition — experience is structured (composed of phenomenal distinctions);
  (3) Information — each experience is specific, ruling out alternatives; (4) Integration
  — experience is unified, irreducible; (5) Exclusion — experience is definite in
  content and spatiotemporal grain, not multiple overlapping experiences. These translate
  to postulates: a physical substrate of consciousness must have intrinsic cause–effect
  power, structured in specific ways, integrate information, be a local maximum of
  integrated information (exclusion), etc. Φ measures integrated information: how
  much information a system in a state generates above and beyond its parts (minimum
  information partition). Only a "complex" with maximum Φ within the system is the
  subject of experience. IIT claims some systems with low Φ (like a simple photodiode)
  might have a tiny bit of consciousness? Actually IIT says even a photodiode has
  some minimal integrated information? I recall IIT implies panpsychism-ish: any system
  with non-zero Φ has at least a minimal amount of consciousness. Tononi has said
  something like a photodiode might have a tiny amount. But careful: IIT requires
  maxima of Φ ("complexes") — a photodiode has small but nonzero Φ. Whether IIT entails
  panpsychism is debated; IIT''s proponents often say it does imply that simple systems
  can be minimally conscious (though not like ours). I should be careful in the summary
  to make errors that are catchable.


  Popular mis-summaries of IIT:

  - "IIT says consciousness is just information processing: any system that processes
  information in an integrated way is conscious." That''s an overstatement/conflation:
  IIT is not about any information processing; it''s specifically about intrinsic
  cause–effect power, and Φ is a specific measure, not computational information processing
  (Shannon information), and high Φ doesn''t reduce to being complex computationally.

  - "IIT has been experimentally confirmed: the perturbation complexity index (PCI)
  has been validated and shows IIT is right." Actually, tests support some predictions
  (e.g., TMS-EEG complexity correlates with consciousness), but not uniquely confirm
