  structurally disadvantages some groups; it''s not necessarily anyone''s individual
  prejudice.


  Target vocabulary: distributed systems / backend engineering. Map:

  - testifier/speaker → node publishing a message/claim

  - hearer → node receiving and deciding whether to accept/relay/act on it

  - credibility → trust/reputation score or weighting in consensus/Byzantine fault
  tolerance

  - identity prejudice → biased reputation function that downweights messages based
  on sender metadata (node''s group label) rather than message content

  - testimonial injustice → systematically underweighted messages from certain node
  classes, harming the sender (their messages don''t propagate / aren''t acted on)

  - hermeneutical injustice → missing schema/message type in the protocol: the sender
  has an experience/signal for which the shared protocol has no well-formed message
  format, so it can''t be transmitted or even parsed; the collective "API" lacks the
  type.


  Residue:

  - The wrong done to someone as a knower (being denied epistemic respect/recognition)
  may not survive in a purely reliability/throughput framing. A trust score is about
  prediction of message reliability; Fricker cares about a moral wrong, not merely
  an accuracy loss.

  - Hermeneutical injustice''s structural character: not a bug in one node but a gap
  in the shared protocol that advantages some nodes in defining the schema; distributed
  systems don''t have the power asymmetry about who writes the schema.

  - The "prejudice" part isn''t just a bad prior from data; Fricker emphasizes it''s
  an ethical failure of the hearer even if the hearer''s error is "reasonable" by
  their lights. An ML/reputation system trained on biased data would reproduce it;
  but calling it injustice adds a normative layer the system doesn''t have.


