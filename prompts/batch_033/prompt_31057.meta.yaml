  Let me think through the epistemic injustice content carefully to write a prompt
  that doesn''t misstate the theory. Fricker''s "testimonial injustice" (from Epistemic
  Injustice: Power and the Ethics of Knowing, 2007): a speaker is wronged specifically
  in their capacity as a knower when a hearer assigns them a credibility deficit owing
  to identity prejudice. Not just any error; the hearer''s prejudice tracks the speaker
  through a negative identity-prejudicial stereotype. The "wrong" is being undermined
