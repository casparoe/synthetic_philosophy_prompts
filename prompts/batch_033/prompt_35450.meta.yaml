  that doesn''t carry its weight when you try to cash it out.


  Here''s the core of the disagreement: Hofstadter argues that some systems — paradigmatically,
  conscious minds — involve a kind of self-reference where the "top" level feeds back
  into the "bottom" level in a way that makes it impossible to reduce the phenomenon
  to the bottom level without destroying it. That''s the "inviolate level." Escher''s
  *Drawing Hands*, where two hands each draw the other into existence, is his visual
  metaphor for this. One hand seems to be the "creator" and the other the "created,"
  but the relationship is circular — push the explanation down a level and you lose
  the thing you''re trying to explain.


  My friend Sam thinks this is all confused. He says that any apparent tangled hierarchy
  can be untangled by being more careful about levels of description. The Drawing
  Hands seem paradoxical only because we''re failing to distinguish between the hands
