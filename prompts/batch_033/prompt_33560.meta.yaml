  Higher-order evidence literature: Thomas Kelly, David Christensen, Richard Pettigrew,
  Sophie Horowitz, Maria Lasonen-Aarnio, Roger White. Key issues:


  - First-order evidence: evidence bearing directly on P (symptoms, test results).
  Higher-order evidence: evidence about the quality/import of your first-order evidence
  or your cognitive performance in evaluating it (e.g., you''re sleep-deprived, you''re
  biased, a peer disagrees).

  - Epistemic akrasia: believing P while believing that, given your evidence, you
  shouldn''t believe P (or that your total evidence doesn''t support P to degree you
  believe). Some argue akrasia is irrational (you should match your belief to your
  higher-order assessment); others (Lasonen-Aarnio?) argue sometimes rational to be
  akratic because higher-order evidence can be misleading and first-order reasoning
  can be correct despite your doubts. Actually there''s a debate about "level-splitting"
  and whether rationality requires coherence between levels.

  - The "right way" to respond to higher-order evidence is disputed. Some think you
  should "step back" and reassess the first-order reasoning; some think higher-order
  evidence just is first-order evidence (about your reliability) and should be combined
  by ordinary Bayesian updating; some worry about double-counting when you already
  took reliability into account.

  - Peer disagreement: equal-weight view vs. steadfast view. But peer disagreement
  is a subset of higher-order evidence.

  - Calibration: evidence about base rates of error in your group.


  For a procedure, useful distinctions:


  1. Classify the incoming item: does it bear on P directly (first-order), or on your
  assessment of P / reliability (higher-order), or both? Many items are both — a colleague''s
  disagreement is both evidence about the case (their reasoning is evidence) and about
  your reliability.

  2. If first-order only: update normally; don''t double-count.

  3. If higher-order: identify what exactly it impugns — a specific inference step,
  a general faculty (vision, memory, pattern recognition), a specific bias, or global
  reliability. General impairment without identifiable step is the hardest.

  4. Decide whether you can redo the reasoning: can you correct for the impairment
  (sleep, re-read, use a checklist, get a second pair of eyes) or is the decision
  forced now? If redoable, redo rather than merely discount.

  5. If you must decide now: distinguish "I can identify the step" — revise that step''s
  confidence — from "I cannot identify the step" — apply a global reliability discount,
  but beware of double-counting and of using a biased instrument to estimate its own
  bias.

  6. Peer disagreement: assess the colleague''s exposure to the same first-order evidence,
  independence, and comparative track record. But don''t just average: if you''ve
  both seen the same evidence, the disagreement is evidence of unreliability in at
  least one, and you should reduce confidence, but how much is a judgement call.

  7. Flag where the procedure cannot settle: the normative choice of whether rationality
  requires deference to higher-order evidence (the akrasia question) — the procedure
  must make a stipulation at the start (e.g., "treat higher-order evidence as requiring
  revision, but no more than..."), and the user should know it''s a stipulation, not
  a fact.

  8. Where the procedure hands off: when the higher-order evidence indicates impairment
  so severe that any first-order judgement is unsafe (e.g., you''re too sleep-deprived)
  — stop and hand over rather than discount.


