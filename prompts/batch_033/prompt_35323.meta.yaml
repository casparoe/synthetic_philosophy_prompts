  Let me think about the actual problem of old evidence carefully.


  Bayes: P(H|E) = P(E|H)P(H)/P(E). If E is old evidence, P(E)=1 (you already knew
  it), so P(H|E)=P(H) — the evidence can''t confirm H. But historically, old evidence
  did confirm new theories: e.g., the perihelion precession of Mercury was known before
  general relativity, and it confirmed GR. So how can known facts provide support?


  Solutions:

  1. Counterfactual/Howson-Urbach: consider P(E|H) vs P(E|~H) — measure support by
  likelihood ratios, not by updating on E literally. Old evidence supports H if H
  makes E much more likely than ~H does. But then why does "support" matter if no
  actual update happens? It measures how much your confidence would have changed if
  you didn''t know E.

  2. Garber''s approach: what you learn is not E but a logical/entailment fact, e.g.,
  "H entails E." Assign probability to statements like H ⊢ E; this can update even
  if P(E)=1.

  3. Jeffrey conditionalization / uncertain evidence: model the discovery as learning
  that E is entailed by H, or learning the theory at all; drop the idealization that
  old evidence has probability exactly 1.

  4. Subjective/psychological: the evidence wasn''t really "old" with probability
  1; you had forgotten it or hadn''t connected it to H. When the theory is proposed,
  you re-represent the evidence, so P(E) effectively drops.

  5. Glymour''s bootstrap / no-need: maybe old evidence problem shows confirmation
  isn''t captured by simple Bayesian conditionalization; use a different model of
  confirmation.

  6. Earman''s analysis: distinguish "novel" facts and "accommodation" vs "prediction";
  maybe Bayesianism can handle old evidence via the likelihood principle if we don''t
  literalize P(E)=1.

  7. Chihara/others: deny the problem; maybe old evidence can''t confirm in the strict
  Bayesian sense, and the intuition that it does is about something else (e.g., explanatory
  value).


