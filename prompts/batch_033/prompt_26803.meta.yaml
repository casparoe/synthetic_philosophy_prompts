  Two-envelope paradox: You''re given two envelopes, one has twice the money of the
  other. You pick one, call amount A. The other has either A/2 or 2A, each with probability
  1/2 (so the reasoning goes), so expected value of switching = (1/2)(A/2) + (1/2)(2A)
  = 5A/4 > A. So switching seems always better. But by symmetry the same reasoning
  applies to the other envelope, so you''d switch back. Contradiction. The flaw: the
  probabilities aren''t well-defined because there''s no uniform distribution over
  possible amounts; or the expected value calculation assumes equal conditional probabilities
  given A, which can''t hold for all A under a well-defined prior; if prior has infinite
  expectation, the paradox persists in another form. Resolutions are contested: no
  single agreed resolution? Actually the standard analysis: the 50/50 assumption is
  not justified for any proper prior; the expected value can be infinite or conditional
  probabilities unequal. There''s a broad consensus that the naive argument is invalid,
