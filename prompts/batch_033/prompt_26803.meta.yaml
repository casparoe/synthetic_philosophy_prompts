  expectations, the "neat" paradox with a distribution where switching seems good
  without opening). The settled part: if the amounts are fixed and you have no information,
  there''s no reason to prefer one envelope — switching doesn''t improve expected
  value under a proper prior; the naive 1.25 calculation is fallacious. Contested:
  exact diagnosis, whether some distributions make switching rational, etc.


