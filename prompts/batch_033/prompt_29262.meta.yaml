  For embedded agency, the key claims:

  - Standard decision theory assumes a Cartesian boundary: an agent with a model of
  an environment external to it; embedded agency says the agent is part of the environment,
  so the boundary is a modeling choice, not a fact.

  - Because the agent is embedded, it cannot contain a complete model of a world that
  contains itself (self-reference); the map is part of the territory.

  - Embedded agents face problems of logical uncertainty, self-modeling, self-modification,
  and the impossibility of precomputing their own future behavior (the "subjective"
  aspect).

  - The Cartesian boundary is useful but leaks; there''s no clean agent/environment
  split.


