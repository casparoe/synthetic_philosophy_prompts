  The paradox of deontology: deontological constraints (agent-centered restrictions)
  prohibit agents from performing certain act-types (e.g., killing the innocent) even
  to prevent more instances of the same act-type. The paradox: if the constraint is
  justified by the value of what it protects (e.g., the disvalue of killings, or the
  value of persons), then why isn''t an agent permitted or required to violate the
  constraint to minimize violations of that very value? If the reason not to kill
  is that killing is bad, then it seems the agent should prevent more killings. Scheffler
  argues this generates a puzzle for non-consequentialist constraints: they seem to
  embody a kind of "agent-centered" valuation that is hard to rationalize. The paradox
  is often phrased: deontology tells you not to kill one to prevent five killings,
  but the very reason it gives you (killing is bad) seems to tell you to kill the
  one.


