  - Luminosity (of a condition C): if C obtains, one is in a position to know that
  C obtains. For mental states: if you feel cold, you can know you feel cold.

  - KK: if one knows p, one knows (or is in a position to know) that one knows p.

  - KK is equivalent to luminosity of the condition "one knows p" (for arbitrary p).
  So if the anti-luminosity argument is perfectly general over conditions, it refutes
  KK. But Williamson''s argument is often presented for phenomenal conditions in a
  sorites series; extending to knowledge requires that "knowing p" can be arrayed
  in a sorites series from clear knowledge to clear non-knowledge. That''s a substantive
  step (though Williamson does defend it). So the prompt''s question is apt: does
  the anti-luminosity argument, if sound, also refute KK? The answer: in principle
  yes if the condition "knows p" is non-trivial and subject to the same sorites structure;
  but one can question whether knowledge has that structure, so a philosopher could
  accept anti-luminosity for phenomenal states while resisting its application to
  knowledge. That''s a real and subtle issue. Good.


