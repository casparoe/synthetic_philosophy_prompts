  - The "right kind" of reasons for an attitude are those that bear on the attitude''s
  correctness/fittingness; wrong-kind reasons bear on the attitude''s benefits.

  - Buck-passing account of value: x is valuable iff there are reasons to value x
  (where "value" covers desire, admire, respect, etc.).

  - WKR problem: there can be reasons to value x that don''t make x valuable (e.g.,
  demon).

  - The challenge: characterize right-kind reasons without appealing to value (circularity).

