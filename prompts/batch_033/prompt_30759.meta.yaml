  Let''s think about Pascal''s wager in detail. The debate has many positions:


  - Classical Pascalian: it is rational to wager for God because expected utility
  of theism is infinite.

  - Many-gods objection: the wager fails because there are many mutually exclusive
  gods; probability assignments and infinite payoffs underdetermine which religion
  to choose.

  - Mixed strategies / wagering for a generic theism.

  - Epistemic critics: you can''t believe at will, so "wager" can''t produce belief;
  at most action.

  - Voluntarist response: we can cultivate belief indirectly; Pascal''s "act as if"
  with holy water and masses.

  - Evidentialists: Clifford/James — pragmatic considerations are irrelevant or legitimate
  only when evidence is balanced.

  - Decision-theoretic critiques: infinite utilities break expected utility theory;
  dominance reasoning alternative (Alan Hájek''s work: Pascal''s wager as dominance
  or as expected utility; mixed strategies). But careful with attributions; can avoid
  names.

  - The "many gods" response: wager supports only generic supernaturalism, not any
  particular religion.

  - The "wager is superfluous" objection: if God exists and is loving, sincere belief
  matters not self-interested wager; a God might punish wagerers.

  - The "infinite expected utility makes no sense / can''t compare infinities" objection.

  - Reformulations: non-standard decision theory, e.g., lexical utility, finite utilities,
  Pascal''s wager without infinite payoffs.


