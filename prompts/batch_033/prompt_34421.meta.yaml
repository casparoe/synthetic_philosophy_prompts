  can''t have, like Arrow''s IIA.


  But I think this is backwards. I want to argue that strategy-proofness is not actually
  desirable, and that the possibility of strategic voting is a feature, not a bug.
  Specifically, strategic voting is the only way for voters to express preference
  intensity in an ordinal voting system. If you make a rule strategy-proof, you''re
  also making it incapable of distinguishing between "I slightly prefer A to B" and
  "I would do anything to prevent B." And that''s a huge loss.


  Here''s the core of the argument. Take any strategy-proof voting rule. By definition,
  no voter can ever improve the outcome (from their perspective) by misreporting their
  preferences. This means the rule must be, in a certain sense, unresponsive to the
  difference between a voter who cares intensely about some pairwise comparison and
  one who barely cares at all. Because if the rule were responsive to that difference
  — if it gave more weight to intense preferences — then a voter with mild preferences
  could just report intense ones and get more weight. Strategy-proofness rules that
  out. So strategy-proofness forces a kind of flattening: all preference orderings
  are treated as if they represent equally strong preferences.


  But in the real world, preference intensity matters enormously. If 51% of people
  slightly prefer candidate A and 49% would be devastated by A winning, most people
  think the 49% should win. A strategy-proof rule can''t capture this at all — it
  has to treat the 51%''s mild preference as exactly as important as the 49%''s intense
  one. Strategic voting, by contrast, lets the 49% do things like vote as a bloc,
  or engage in tactical coordination, to signal that their preference is stronger.
  The fact that they''re willing to incur the cognitive and social costs of strategic
  coordination is itself a costly signal of intensity.


  So when G-S tells us that all non-dictatorial rules are manipulable, maybe we should
  read this as: all non-dictatorial rules permit the expression of preference intensity
  through strategic behavior. And that''s good! A rule that was truly strategy-proof
  would be a rule that forced everyone to vote as if all their preferences were equally
  strong, which would systematically disadvantage those with intense preferences on
  specific issues.


  The obvious objection is that strategic voting doesn''t just communicate intensity
  — it also lets sophisticated voters manipulate outcomes at the expense of unsophisticated
  ones. The 49% who care intensely might win not because their preferences are stronger
  but because they''re better at game theory. And that''s an equity problem.


  My reply: this is a real concern, but it''s a concern about unequal strategic competence,
  not about manipulability per se. The solution isn''t to make the rule strategy-proof
  (which, per G-S, you can''t do anyway without dictatorship) — it''s to level the
  playing field through information, deliberation, or even by using rules where the
  strategic incentives are simple enough that everyone can figure them out. Approval
  voting, for instance, has a much simpler strategic landscape than ranked-choice.
  But more fundamentally, the intensity-signaling function of strategic voting is
  valuable enough that we should try to preserve it while mitigating the inequity,
  rather than eliminating it.


  So where does this leave us with the theorem? G-S is still a real constraint — it
  tells us something true about the space of possible voting rules. But instead of
  reading it as "we can''t have the nice thing we want (strategy-proofness)," we should
  read it as "any voting rule that''s responsive to more than one person''s preferences
  will necessarily permit strategic behavior, and this is what allows preference intensity
