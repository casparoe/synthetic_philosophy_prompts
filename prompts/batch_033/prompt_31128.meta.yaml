  The dirty hands problem: a politician must do wrong to do right; the question is
  whether the wrong remains wrong even when justified, and whether the agent should
  feel remorse/guilt. Key features: (a) the act is genuinely wrong (not merely unpopular
  or "tragic" in a cost-benefit sense), (b) it''s necessary for a great good, (c)
  the agent is justified in doing it but also should not have a clean conscience —
  the "moral remainder."


