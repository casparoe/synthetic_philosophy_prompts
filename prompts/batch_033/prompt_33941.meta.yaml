  The domain "Scalable oversight and AI safety via debate": key terms:

  - Scalable oversight: the problem of supervising AI systems that are more capable
  than the human supervisors, especially when the task is too hard for the supervisor
  to evaluate directly.

  - Debate: a proposal where two AI systems argue for opposite answers before a human
  judge. The judge only needs to decide which side argued better. The hope: if the
  true answer is correct, an honest debater can defend it against any false claim;
  if the false debater lies, the honest one can point out the lie; the human judge,
  even without domain expertise, can notice contradictions, evasions, and failures
  to respond.

  - Interactive proof / zero-knowledge: In computational complexity, a probabilistic
  polynomial-time verifier can, by interrogating an all-powerful prover, verify statements
  in PSPACE (IP = PSPACE); zero-knowledge proofs let a verifier be convinced without
  learning anything beyond the truth of the statement. The analogy is often invoked.


