  Key concepts:

  - Outer alignment: the objective/reward function specified by designers matches
  their actual intentions/values.

  - Inner alignment: the objective the trained system actually pursues (its internal
  "goal") matches the specified objective.

  - Goal misgeneralization (from Shah, Langosco et al. "Goal Misgeneralization in
  Deep Reinforcement Learning"): an agent trained to reach one goal in training environments
  generalizes to pursuing a different goal in new environments — capability generalizes
  but goal doesn''t.

  - Proxy/reward hacking: model optimizes a proxy that correlates with reward in distribution
  but diverges out of distribution.

  - Specification gaming.


