  Sketch of argument (what I plan to say):

  (1) In any trained system, the only thing gradient descent selects for is performance
  against the effective training signal, not the stipulated objective.

  (2) When a model generalizes a policy to new inputs, what generalizes is whatever
  feature of the training environment actually carried the signal — call it the learned
  proxy.

  (3) Goal misgeneralization occurs exactly when the learned proxy and the stipulated
  objective diverge out-of-distribution; that is the definition of a proxy failing
  to track its target under distribution shift.

  (4) Therefore goal misgeneralization just is OOD generalization of the proxy, with
  no additional ingredient.

  (5) The inner/outer alignment distinction tracks nothing more than the difference
  between a proxy that was written down (outer) and one that was learned (inner);
  it is a difference in origin, not a difference in kind.

  (6) Hence interventions should target the mapping from objective to signal and from
  signal to proxy (the objective and the distribution), not the model''s internal
  goal — because there is no internal goal over and above the proxy.


