  Question: "In ''Freedom and Resentment,'' Strawson argues that the truth of determinism
  wouldn''t undermine moral responsibility. Reconstruct his argument, making sure
  to explain (a) the distinction between the participant stance and the objective
  stance, and (b) the distinction between excuses and exemptions. Then give your own
  assessment: does his argument succeed against the worry that determinism might show
  the participant stance rests on a systematic error?"


  Student answer:


  "Strawson''s strategy is to reframe the free will debate around what he calls the
  ''reactive attitudes'' — emotions like resentment, gratitude, indignation, and forgiveness
  that we feel in response to the goodwill or ill will others show toward us. These
  attitudes define what he calls the ''participant stance'': the stance we occupy
  when we engage with others as fellow members of a moral community, holding them
  responsible for their actions.


  The ''objective stance,'' by contrast, is what we adopt when we step back and treat
  a person not as a participant in interpersonal relationships but as an object to
  be managed, treated, or controlled — the way a therapist might view a patient or
  a parent might view a young child. When we take the objective stance toward someone,
  reactive attitudes are suspended: we don''t resent them, we just try to deal with
  them.


  Strawson then draws an important distinction between two ways reactive attitudes
  can be suspended. Excuses — like ''he was pushed'' or ''he didn''t know the gun
  was loaded'' — show that the particular action didn''t manifest ill will, so resentment
  isn''t warranted in that case. But excuses operate within the participant stance:
  we''re still treating the person as a responsible agent. Exemptions are different.
  They show that the person isn''t a proper target of reactive attitudes at all —
  like someone with severe schizophrenia or a toddler. Exemptions remove the person
  from the participant stance altogether.


  Now, what if determinism is true? Strawson''s answer is that this wouldn''t force
  us to abandon the participant stance, for two reasons. First, we simply can''t do
  it. The reactive attitudes are too deeply embedded in human nature; we couldn''t
  sustain the objective stance toward everyone all the time even if we tried. Second,
  determinism doesn''t show that anyone is exempt in the relevant sense. Exemptions
  work by pointing to specific incapacities in specific individuals — a child can''t
  understand moral norms, a severely mentally ill person can''t control their behavior.
  Determinism is a general thesis about the causal structure of the universe; it doesn''t
  pick out any such incapacity. So it gives us no reason to think anyone is exempt.


  I think Strawson''s argument largely succeeds. The key insight is that the demand
  for an external, metaphysical justification of our responsibility practices is misguided.
  Our reactive attitudes are justified by their own internal standards — whether someone
  actually showed ill will, whether they had the relevant capacities — and determinism
  doesn''t engage with those standards at all. The worry that determinism reveals
  the participant stance to be based on a ''systematic error'' only makes sense if
  you think the participant stance is a theory about whether actions are uncaused,
  which it isn''t."


