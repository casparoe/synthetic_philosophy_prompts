  Here''s a possible argument:


  (1) A disposition is fully specified by its stimulus and manifestation: fragility
  is the disposition to break when struck. So "x is fragile" means "if x were struck,
  x would break."

  (2) But whether the manifestation occurs can depend on background conditions. A
  fragile glass wrapped in foam, if struck, won''t break. That''s a mask.

  (3) To handle masks, we must build the background conditions into the disposition:
  fragility is the disposition to break when struck in normal conditions, where normal
  means "in the absence of anything that would interfere with breaking."

  (4) But "absence of anything that would interfere" is either empty or circular:
  we can only specify the interfering factors as those that stop a fragile thing from
  breaking, which uses the very notion of fragility we''re trying to define.

  (5) So the conditional analysis of dispositions is either false (finks/masks) or
  circular. If circular, dispositions can''t be reduced to non-dispositional facts.

  (6) But if dispositions can''t be reduced to non-dispositional facts, then every
  fundamental physical property must be dispositional (or we''re stuck with an unexplained
  layer of primitive dispositions).

  (7) Therefore the attempt to say what a disposition is collapses into saying everything
  is dispositional, including things we thought were categorical, or nothing is.


