  as a criterion needn''t be a decision procedure. Williams''s objection may conflate
  the two. Railton''s "sophisticated consequentialism" argues a consequentialist should
  cultivate non-consequentialist dispositions because that produces better consequences.
  So the man who saves his wife without deliberation can be the best utilitarian.
  This is arguably the standard reply.

  - Williams anticipates this? He thinks the indirect strategy is unstable or self-effacing,
  but maybe not decisively.

  - The objection may rest on controversial intuitions about the Jim case: many people
  share Williams''s unease, but not all. If someone doesn''t share the intuition,
  the objection loses force. Defenders of Williams concede the objection is intuition-driven.

  - The objection may prove too much: any moral theory with demanding requirements
  (deontological duties, etc.) can require acting against one''s projects; the question
  is whether there''s something special about utilitarianism. If not, the objection
  isn''t an objection to utilitarianism specifically.

  - The objection might confuse "the thought the agent has" with "the consideration
  that makes the act right." The fact that the husband would be alienated by deliberating
  doesn''t show that a third-party assessment of the act is wrong. "One thought too
  many" might be a claim about the phenomenology of acting from love, not about the
  normative theory.

  - Utilitarians can accept that some thoughts are "too many" in deliberation while
  maintaining that the act is right because of impartial considerations. So the objection
  would only work against a version of utilitarianism that requires constant impartial
  deliberation (a strawman).

  - The objection might be conservative: it privileges existing attachments and projects,
  but some projects are bad (racist, trivial). A theory that lets us keep our projects
  unexamined has its own costs. This is a moralized version.

  - Does Williams''s notion of integrity actually do normative work? It may be descriptive:
  we have projects, and utilitarianism conflicts with them. But why should that count
  against utilitarianism rather than against our attachment to our projects? If integrity
  is just "sticking to one''s projects," it can''t be a moral consideration without
  begging the question.

  - The objection might collapse into the demandingness objection, which has standard
  replies (moral requirements are supposed to be demanding, etc.).

  - There''s also the "utilitarianism and self-effacement" issue: if utilitarianism
