  The Williams integrity objection has several components:

  1. The attack on negative responsibility: utilitarianism makes me responsible not
  only for what I do but for what I allow or fail to prevent, because the only thing
  that matters is the state of affairs. This "overwhelms" my agency: I become a channel
  for the satisfaction of utilities, and my own projects are just one utility among
  others.

  2. The integrity point: my ground projects (the things that give my life meaning)
  are not just sources of utility; they''re constitutive of my identity. Utilitarianism
  requires me to abandon them whenever the utility calculus says so, which is an attack
  on my integrity.

  3. The one thought too many point: in personal relationships, the demand for impartial
  justification misdescribes the relation. If a man deliberates whether he is justified
  in saving his wife rather than a stranger, that''s one thought too many; the thought
  is incompatible with the kind of relationship he has with his wife.


