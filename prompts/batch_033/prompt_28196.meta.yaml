  Rietdijk–Putnam argument: In special relativity, simultaneity is relative. For any
  two spacelike separated events, there are frames where one is earlier, frames where
  the other is earlier, and frames where they are simultaneous. Putnam (1967) and
  Rietdijk (1966) argued: if there''s a frame in which event e is present/real now,
  and another frame in which future event f is simultaneous with e, then f must be
  real now too. Since "now" depends on frame, what is future for me is present/real
  in some other frame; and since reality can''t be relative, everything (past, present,
  future) must be real — eternalism/block universe. Critics object: the argument conflates
  what an observer at a distance would regard as simultaneous with what is ontologically
  real; or presupposes that simultaneity (conventional or coordinate-dependent) has
  ontological significance; or assumes a "now" that is frame-independent. There''s
  also a version: "the Andromeda paradox" (Penrose) — whether the Andromedans have
  launched their fleet depends on how you walk. Good example.


