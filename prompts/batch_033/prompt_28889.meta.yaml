  dramatizes a certain moral psychology around the bomb — and then to ask whether
  the film, read through Anscombe''s critique, ends up reinforcing or evading her
  central charge.


  Anscombe''s argument, as you''ll recall, is that Truman''s decision to drop atomic
  bombs on Hiroshima and Nagasaki was straightforwardly murder. Her key claim is that
  the civilian deaths were not a tragic side effect of a military operation aimed
  at a legitimate target; they were the very means chosen to produce surrender: "For
  men to choose to kill the innocent as a means to their ends is always murder." She
  also argues that the defense offered on Truman''s behalf — that the bombs ended
  the war and saved lives — would not have been accepted at Nuremberg, where the tribunal
  treated the intentional slaughter of civilian populations as a crime regardless
  of the strategic payoff. For Anscombe, the fact that the Allies won the war does
  not change the moral calculus; there are absolutes, and the deliberate killing of
  noncombatants violates one of them.


  Nolan''s Oppenheimer is fascinating in this connection because it is almost entirely
  structured around Oppenheimer''s own subjective experience of guilt, yet it is notably
  reticent about what exactly he is guilty of. The film lingers on the Trinity test
  as a Promethean triumph, cuts away from Hiroshima and Nagasaki themselves (we never
  see the cities), and instead gives us Oppenheimer''s hallucinatory visions of the
  effects on his audience during the Los Alamos victory speech. The guilt the film
  dramatizes seems to attach more to the existence of the bomb as such — to the unleashing
  of a power that might end the world — than to the specific choice to incinerate
  two cities full of civilians. Meanwhile, Truman appears in one brief, devastating
  scene and dismisses Oppenheimer''s moral anguish as self-indulgent.


