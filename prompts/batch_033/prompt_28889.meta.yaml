  illustrate her argument — for instance, in the way it depicts the decision-making
  process that treats the cities as means to a demonstration of force? Where does
  the film''s moral framework diverge from hers, perhaps by locating the wrong in
  the technology itself rather than in the intention to kill the innocent? And does
  the film, in its focus on Oppenheimer''s tortured conscience, end up obscuring the
  question Anscombe thought was central — namely, whether Truman was a murderer, and
  whether the Allied publics who celebrated the bombings were complicit in something
  that, on any ordinary understanding of murder, was exactly that? I''m not looking
  for a verdict on whether Anscombe was right, but for a reading that takes both the
  film and her argument seriously and identifies the points of genuine friction.


