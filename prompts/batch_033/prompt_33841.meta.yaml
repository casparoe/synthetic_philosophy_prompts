  Ian Hacking''s "Making Up People" (1986) and "The Looping Effects of Human Kinds"
  (1995). He distinguishes "indifferent kinds" (natural kinds that don''t interact
  with classification, e.g., quarks, or even human kinds like... hmm) from "interactive
  kinds" (human kinds whose members are aware of and interact with the classification).
  He discusses "transient mental illnesses" and multiple personality. Looping effect:
  the classification and the classified interact; "people classified in a certain
  way come to conform to or grow into the ways that they are described; but they also
  evolve in their own ways, so that the classifications and descriptions have to be
  constantly revised." Also "the human sciences... create kinds of people that in
  a certain sense did not exist before." But he''s careful: this doesn''t mean the
  phenomena are unreal; he says something like "the idea of the loop does not imply
  that the people classified are merely responding to labels." There''s a real interaction.


