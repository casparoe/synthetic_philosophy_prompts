  Let me consider Hacking''s looping effects: Ian Hacking, "The Looping Effects of
  Human Kinds" (1995?) / "Making Up People" (1986). The idea: classifying people (e.g.,
  "multiple personality," "autistic," "obese," "genius") creates kinds that interact
  with their members: people become aware of the classification and change in response,
  leading the classification to be revised, which changes the people again — a feedback
  loop ("looping effect"). Human kinds differ from natural kinds because they are
  "moving targets." Subtle misrepresentations: (1) claiming Hacking says classifications
