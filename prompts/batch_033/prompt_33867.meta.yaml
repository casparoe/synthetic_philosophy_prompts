  Acausal trade: from decision theory, especially TDT/UDT (Nate Soares, Eliezer Yudkowsky,
  Scott Garrabrant). The idea: agents who cannot causally affect each other (e.g.,
  in different branches of the multiverse, or separated by distance/event horizon,
  or different universes with no interaction) can still "trade" by each acting to
  benefit the other, because each predicts the other''s behavior via logical/algorithmic
  correlation. The classic example: two superintelligences in separate universes each
  face a choice; each can help the other at small cost; if they can both implement
  a decision theory that cooperates with similar agents, they both benefit. It requires:
  (1) a common decision procedure or mutual predictability; (2) shared knowledge of
  each other''s preferences and rationality; (3) a theory of counterfactuals about
  what the other would do. Acausal trade is distinct from ordinary cooperation or
  superrationality? It generalizes superrationality to agents with different values
  who can''t causally interact.


