  - The point is not just that we can''t be sure, but that the evidence underdetermines
  the choice — all manuals fit all possible observations.

  - Indeterminacy of translation: two equally good translation manuals can be incompatible.

  - Underlying: meaning is not determined by behavior; semantic facts (if any) are
  not to be found in behavioral dispositions.

  - Related: inscrutability of reference, ontological relativity.

  - The philosophical upshot: no fact of the matter about which translation is correct,
  given all possible behavioral evidence.


