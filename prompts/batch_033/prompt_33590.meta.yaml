  Key elements of Quine''s indeterminacy of translation I should capture faithfully,
  without quoting:

  - Radical translation: a linguist encounters an unknown language with no prior translation
  manual.

  - A native says "Gavagai" when a rabbit runs by.

  - The linguist forms a hypothesis: "gavagai" = "rabbit" (or "Lo, a rabbit").

  - But there are indefinitely many alternative hypotheses consistent with all behavioral
  evidence: "undetached rabbit parts," "rabbit stages/time-slices," "rabbitness/tropes,"
