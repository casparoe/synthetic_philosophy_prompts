  I cover the mind and brain beat for a general-interest science magazine, which means
  a steady flow of papers, press releases, and book pitches claiming, in one way or
  another, that conscious experience is causally inert — that the feeling of deciding,
  intending, or attending is something the brain generates after the fact, a passenger
  rather than a driver. My editors want me to write about these claims responsibly
  rather than either dismissing them or repeating them credulously. I am not a philosopher,
  and I need a procedure I can actually run against a claim in about half an hour
  before I commit to covering it.


  Please turn the epiphenomenalist position and the paradox of phenomenal judgment
  into an editorial decision procedure: the questions I should ask, in order, about
  any study or argument that purports to show that conscious experience does no causal
  work; what would count as a sufficient answer to each; where the procedure should
  stop with the verdict that the claim overreaches; and where it should hand the decision
  to someone with philosophical training because the issue is conceptual rather than
  empirical. In particular, I want the procedure to apply the paradox of phenomenal
  judgment as a formal test: if the claim were true, would it undermine the reliability
