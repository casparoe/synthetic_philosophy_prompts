  Williamson''s anti-luminosity argument (Knowledge and Its Limits, chapter 4): Suppose
  a condition C is luminous: whenever C obtains, one is in a position to know that
  C obtains. Consider a sorites series from a case where C clearly obtains to one
  where it clearly doesn''t (e.g., feeling cold at dawn to feeling hot at noon). Adjacent
  cases are so similar that one can''t discriminate them; if one is in a position
  to know C obtains in case i, then by a margin-for-error principle, C obtains in
  case i+1 too. But then by induction, C obtains throughout, contradiction. The key
  premise is that knowledge requires a margin for error: if one knows C obtains, C
  must obtain in all sufficiently similar cases. Williamson argues this follows from
  safety (knowledge can''t be too easily false). One response: challenge the margin-for-error
  premise, e.g., by reliabilism or by appeal to "core cases." Another response: accept
  the conclusion but restrict it — maybe some conditions (like being in pain) are
  luminous because of their special self-presenting nature? Another: the argument
  conflates being in a position to know with actually knowing, or ignores that "feeling
  cold" might be a response-dependent property.


