  I''m writing an essay on Daniel Dennett''s idea that Darwin and Turing each performed
  what he calls the strange inversion of reasoning: the reversal of the traditional
  assumption that competence must be explained by comprehension. A friend of mine,
  who has read more of this material than I have, offered me the following summary
  of the view:


  "Before Darwin, the only way anyone knew to explain competence — an organism that
  is good at something, a well-designed eye or a wing — was to posit an intelligent
  designer who comprehended the design. Darwin inverted this by showing that natural
  selection can build up genuine competence gradually through an entirely mindless,
  mechanical process, with no understanding anywhere in the causal chain, so comprehension
  is a late product of evolution rather than its source. Turing performed the same
  inversion for the mind: he showed that a machine made of individually stupid parts,
  each blindly following rules, can do arithmetic, play chess, and in principle converse
  well enough to fool a human interrogator, all without comprehending anything. The
  upshot is that what we call understanding is not what drives our intelligent behavior;
  it is a kind of user illusion generated by underlying mindless competences, and
  in the end there is no real comprehension in the universe, just competences all
  the way down. Dennett''s conclusion is that the conscious mind is a user illusion
  and that consciousness itself does no real causal work."


