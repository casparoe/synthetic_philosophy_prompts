  Dennett''s "competence without comprehension":

  - Darwin''s inversion: before Darwin, one could think that all design (competence)
  requires an intelligent designer (comprehension). Darwin showed that design-like
  competence can arise from a mindless, algorithmic process (natural selection) with
  no comprehension at all. Comprehension (understanding, mind) is a late product of
  evolution, not the source of design. "Competence without comprehension" — competences
  can arise without any comprehension.

  - Turing''s inversion: Turing showed that a machine can be competent (e.g., do arithmetic,
  play chess, pass the Turing test) without understanding what it is doing; intelligence
  can be achieved by a mechanism composed of individually mindless parts following
  rules; comprehension is not required for competence. Turing inverted the assumption
  that understanding must precede intelligent performance: instead, competence can
  be built bottom-up from unintelligent processes, and what we call comprehension
  may itself be a kind of competence or an effect of underlying mechanical processes.


  Subtle misrepresentations to insert:

  1. Conflating "comprehension is not the source of competence" with "comprehension
  does not exist" or "is an illusion" — an overstatement.

  2. Saying Darwin''s theory shows that all apparent design in nature is "just an
  illusion" / "only apparent" — actually Darwin explains real design (adaptedness)
  without a designer; it''s not that design is unreal, but that it''s produced by
  a mindless process. Saying "design is an illusion" is a subtle overstatement/conflation
  of design (teleological function) with intelligent design (intentional agency).

  3. Saying Turing proved machines can "genuinely understand" or, conversely, that
  Turing showed understanding is unnecessary in principle so machines will never need
  it — maybe present the popular summary as saying Turing showed that a computer passing
  the Turing test would literally have a mind/consciousness. That''s a misrepresentation:
  Turing proposed a test as a criterion but didn''t prove that passing entails understanding.

  4. Presenting a standard objection as a refutation: "Searle''s Chinese Room showed
  that competence without comprehension is impossible, so Dennett''s inversion fails."
