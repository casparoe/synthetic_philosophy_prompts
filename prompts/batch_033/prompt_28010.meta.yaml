  "Hey — I''m a science journalist, working on a piece about how people and machines
  induce a concept from a handful of examples, the way a Bongard problem asks you
  to. I keep running into the claim that there''s a deep split between learning an
  explicit rule and judging by similarity to stored examples, and that the rule-based
  picture usually wins because it generalizes while similarity just memorizes. I want
  one clean, constructed case that runs the other way.


  So here''s what I need you to build. You''re a cognitive scientist who works on
  concept learning and inductive bias — think carefully, maybe brainstorm three or
  four candidate rules before you settle, because the case has to actually work and
  not just look like it works.


  Construct a concept-induction problem, in the spirit of a Bongard problem but described
  in words (I can''t use diagrams in the piece), with a small set of positive and
  negative examples — say six of each. The problem has to satisfy these constraints:


  1. An explicit-rule learner and an exemplar-similarity learner agree perfectly on
  the twelve training examples.

  2. On a held-out probe item, they give opposite verdicts, and the similarity learner
  is right while the rule learner is wrong — the reverse of the usual ''rules generalize,
  similarity overfits'' story.

  3. The rule the rule-learner finds has to be genuinely simple and one a reasonable
  adult would actually form — it can''t be a stupid rule or an obviously gerrymandered
  one.

  4. The similarity learner can''t be cheating by using features the rule learner
  couldn''t in principle notice.

  5. The items should be ordinary or easily visualized, not exotic, and the target
  category has to be one a person would recognize as a real kind of thing rather than
  a trick category.


  Then do the check. Walk through what each learner does on the training examples,
  what each predicts on the probe, and why. Tell me which single structural feature
  of the case is doing the work — what is it about the target concept or the arrangement
  of examples that makes the simple rule mislead while similarity gets it right? What
  happens if you remove that feature — does the case collapse back into the usual
  rule-friendly pattern? And finally, how would a defender of the rule-based picture
  attack this case — what would they say is unfair or rigged about it, and is there
  a fix that keeps the verdict but answers them?"


