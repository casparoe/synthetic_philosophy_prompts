  A private foundation has committed roughly five postdoctoral researcher-years over
  three years to conceptual and theoretical work bearing on a single practical question:
  whether habitat destruction tends, on balance, to reduce or increase the suffering
  of wild animals. The program officer is genuinely undecided, and the intended downstream
