  Among the candidates are whether total population size is a reliable proxy for total
  welfare; how to aggregate welfare across species whose sentience, lifespan, and
  life histories differ by orders of magnitude; whether the burden of proof should
  fall on those who treat wild lives as net positive or on those who treat them as
  net negative; how density-dependent mortality and habitat quality interact to set
  average welfare; and whether "habitat destruction" is too coarse a category to license
  any general verdict, since draining a wetland, clearing a forest, and paving over
  a meadow yield different replacement habitats with different welfare profiles. You
  should feel free to add questions I have not listed or to merge several of these.


