  is evidence/part of the policy that gets the $10,000 in the heads branch. Actually
  the standard analysis: if you adopt the policy "pay in both branches," you get $10,000
  - $100 in heads branch and -$100 in tails branch, net positive; if you adopt "don''t
  pay," you get $0. Since you don''t know which branch you''re in until Omega tells
  you, but Omega tells you tails. The dilemma: now that you know tails, the $10,000
  is in a counterfactual branch; paying can''t cause it. The rational action under
  one view is to pay (because you''d want your counterpart in heads to have paid;
  and you can reason "if I pay now, then in the heads branch my copy pays" only if
  your decision procedure is the same in both branches). This is the "counterfactual
  mugging" from decision theory: it motivates updatelessness/functional decision theory.


