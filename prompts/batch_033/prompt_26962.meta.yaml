  ---


  Background. In experimental philosophy, the Knobe effect is the following asymmetry.
  Participants read a vignette about an executive who must decide whether to launch
  a new initiative. In one condition, the initiative would harm the environment as
  a side effect; in the other, it would help the environment as a side effect. In
  both conditions, the executive is described as caring only about profit and explicitly
  says he does not care about the environmental side effect; the initiative is launched,
  and the side effect occurs. Participants are then asked whether the executive intentionally
  harmed (or helped) the environment. A large majority say the harm was brought about
  intentionally, while a large majority say the help was not. The asymmetry appears
  despite the fact that the executive''s attitude, the causal chain, and the decision
  procedure are held constant across conditions.


  Two camps have formed about what this asymmetry shows. The first camp takes it to
  reveal the folk concept of intentional action itself: ordinary judgments of whether
  an action is intentional are, in part, judgments about whether the agent''s attitude
  toward the side effect was normatively appropriate, so moral evaluation is an input
  to the concept rather than a contaminant. The second camp takes the asymmetry to
  be a performance effect or pragmatic artifact: it is driven by blame, by a general
  negativity bias, by conversational implicatures, or by features of the vignettes,
  and it tells us little about the semantics of intentional.


  Your task: write the joint statement that these two camps could sign after a good-faith
  adversarial collaboration. The statement should include:


  1. A numbered list of claims both sides accept about the effect itself, the experimental
  record, and the constraints any adequate account must respect. The claims should
  be substantive rather than vacuous, and neither side should feel strawmanned.


  2. A precise statement of the residual disagreement, with each side''s own position
  phrased so that its proponents would accept the wording.


  3. A disagreements table. For each crux — a sub-question such that settling it would
  move at least one side — give a concrete experiment, manipulation, or argument both
  sides agree bears on that crux, and state each side''s prediction about it in advance.


  4. If you conclude that part of the dispute is verbal, say which part and why.


