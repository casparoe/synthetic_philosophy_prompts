  Background. The Knobe effect is an experimental finding that has become a small
  industry in experimental philosophy. In the standard design, subjects read about
  a corporate executive who approves a new initiative solely because it will increase
  profits and who states that he does not care about a side effect the initiative
  will have on the environment. In one condition the side effect is harmful; in the
  other it is beneficial. In both conditions the executive''s stated attitude, the
  causal structure, and the decision procedure are the same. After the initiative
  is implemented, subjects are asked whether the executive intentionally brought about
  the environmental side effect. A large majority answer yes in the harm condition,
  and a large majority answer no in the help condition. The asymmetry is robust and
  well replicated.


  Two positions about what this shows have formed. The conceptual view holds that
  the asymmetry reflects the folk concept of intentional action: ordinary people''s
  judgments of whether someone acted intentionally are sensitive to the normative
  status of what the agent did, so moral or normative evaluation is a genuine input
  to the concept, not a contaminant. The deflationary view holds that the asymmetry
  is a performance or pragmatic artifact: it is produced by blame, by a general negativity
  bias, by conversational implicatures, or by some feature of the experimental materials,
  and it does not reveal the structure of the concept of intentional action.


