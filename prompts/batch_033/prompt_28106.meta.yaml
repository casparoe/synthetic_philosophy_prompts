  Grice''s distinction between natural and non-natural meaning ("meaningNN"): speaker
  meaning: A meantNN something by x iff A intended the utterance to produce some effect
  in an audience by means of the recognition of that intention. Also for speaker meaning,
  Grice required the audience to recognize the intention, and the effect to be at
  least partly produced by that recognition. There''s also the notion of "meaning
  something by an utterance" vs "the sentence meaning."


  Conversational implicature: what a speaker implicates is something they mean beyond
  what they say, calculable from the Cooperative Principle and maxims (quantity, quality,
  relation, manner), plus context. Conventional implicature: tied to specific words
  (e.g., "but", "therefore") — not calculable via maxims.


  Key distinctions: saying vs implicating; conventional vs conversational implicature;
  particularized vs generalized conversational implicature.


  Common misrepresentations:

  - Conflating implicature with "implied meaning" in general, or with speaker meaning
  generally.

  - Saying Grice''s point is that meaning is use / meaning is what the speaker intends
  to communicate, period.

  - Overstatement: "What a speaker means is whatever they intend the hearer to infer"
  — ignores the "by means of recognition of that intention" self-referential clause.

  - Presenting the Cooperative Principle as a description of how people actually talk
  / a norm people follow, rather than a rational reconstruction; or as "communication
  only works when people follow maxims."

  - Treating "what is said" as the literal semantic content independent of context
  — Grice''s notion of "what is said" is actually closer to truth-conditional content
  plus reference resolution, and is more contextual than one might think.

  - Saying implicatures are meanings the sentence has in context, conflating sentence
  meaning with speaker meaning.


