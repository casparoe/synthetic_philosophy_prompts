  by priors, which seems to just push the problem back — why should rational agents
  have different priors? Some argue priors are like initial conditions, not rationally
  required to be shared. The common prior assumption (Harsanyi doctrine) is often
  defended by arguing that differences in posterior beliefs should be explainable
  only by differences in information, because otherwise you''d have to believe the
  other person is irrational or has a "mistaken" prior. But some people reject this.

  2. The assumptions of common knowledge of rationality and of the posterior announcements
  fail in practice — we rarely have common knowledge of each other''s exact credences
  or that the other is a perfect Bayesian.

  3. Real agents are not ideal Bayesians (bounded rationality).

  4. The theorem applies to a single event A with a well-defined common prior over
  a shared probability space; real disagreements are often about which model/partition
