  Aumann''s agreement theorem: Let two agents have the same prior over a finite probability
  space, and let their information partitions be Π1 and Π2. If an event A and the
  posterior probabilities q1 = P(A | Π1) and q2 = P(A | Π2) are common knowledge at
  some state, then q1 = q2 at that state. The theorem says rational agents with common
  priors cannot "agree to disagree": if their posteriors for an event are common knowledge,
  they must be equal.


  The standard escape routes:

