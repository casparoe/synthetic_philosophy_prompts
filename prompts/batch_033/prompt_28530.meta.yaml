  I''ve been thinking about the two-envelope paradox for a while now, and I''ve arrived
  at a resolution that feels satisfying to me. Here''s the setup as I understand it:
  you''re shown two envelopes and told one contains twice as much money as the other.
  You pick one and open it to find, say, $100. You reason that the other envelope
  has either $50 or $200, each equally likely, so its expected value is $125, and
  you should switch. But the same reasoning would have applied no matter what amount
  you saw, and it would even apply without opening the envelope — which means you''d
  want to switch back and forth endlessly, and that can''t be right.


  The resolution I''ve settled on is this: the flaw is in the step that says "each
  equally likely." That step sneaks in an assumption about how the amounts were chosen
  — specifically, it assumes that for any amount X you might find, the probability
  the organizers put X and 2X in the envelopes equals the probability they put X/2
  and X. That''s not something you can just assume without knowing how the amounts
  were picked. Once you put a reasonable prior on the possible pairs of amounts, the
  expected gain from switching is no longer positive for all X, and the paradox dissolves.
  I find this convincing, and I''ve read that it''s essentially the Bayesian resolution.


  But I want to know how solid this resolution really is. What would count against
  it? I''m not asking for the standard objections that get trotted out in every discussion
  — I want to know what a defender of this resolution would themselves admit as a
  genuine challenge. Are there versions of the paradox that survive even with a proper
  prior? Are there reformulations that don''t depend on probabilities at all? What
  observations, formal results, or edge cases should make me reconsider? And has the
  resolution been qualified to the point where it''s unfalsifiable — where no conceivable
  version of the paradox could threaten it, and if so, is that a problem? I''d like
  the counterarguments ranked from fatal to merely awkward, and I''d especially appreciate
  having the response separate what''s genuinely contested among people who work on
  this from what''s settled.'
