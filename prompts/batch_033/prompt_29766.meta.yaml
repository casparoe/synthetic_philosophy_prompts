  (1) Assertion is governed by a knowledge norm: one should assert that p only if
  one knows that p. (2) The distinctive defect of Moore-paradoxical sentences—instances
  of the schema ''p, but I don''t believe that p''—is that they cannot be known; this
  fully explains why such sentences are unassertable. (3) One''s own beliefs are transparent
  in deliberation: to answer the question whether I believe that p, I normally ask
  whether p, not whether I have some internal state. (4) Knowledge is not luminous,
  and the KK principle is false: one can know that p without being in a position to
  know that one knows that p. (5) A rational subject who judges that p thereby believes
  that p, and cannot simultaneously judge that p and that she does not believe that
  p.


  Go through these one by one and tell me which pairs are in tension, how severe each
  tension is, and what the cheapest revision would be in each case. Then tell me which
  single change would produce the most coherent overall position, and what it would
  cost. I want you to be specific about where the package fails: do not tell me everything
  is fine, and do not invent tensions where the views in fact fit together."


