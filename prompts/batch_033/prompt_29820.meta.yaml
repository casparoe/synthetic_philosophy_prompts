  Can you explain Skolem''s paradox to me? I know the basic setup: the Löwenheim-Skolem
  theorem says that if a first-order theory has an infinite model, it has a countable
  model. ZFC set theory is a first-order theory (or can be formalized as one), and
  it has infinite models, so it has a countable model. But ZFC proves the existence
  of uncountable sets — Cantor''s diagonal argument works inside ZFC. So how can a
  countable model contain an uncountable set? That seems like a straight contradiction.


  I''ve heard the resolution involves the distinction between "countable inside the
  model" and "countable from outside," but I''ve never really gotten it. What does
  it mean for a set to be uncountable inside a model but countable when you look at
  the model from the outside? And why doesn''t this just show that first-order logic
  is the wrong tool for set theory — that we should be using second-order logic instead?


  Also, I''m curious about the philosophical upshot. Some people say Skolem''s paradox
  shows that mathematical notions like "uncountable" are relative to a model and therefore
  not absolute or real in the way Platonists want them to be. Others say it''s just
  a technical curiosity with no deep philosophical implications. Where do you come
  down, and why?


