  The boundary problem (democratic boundary problem): who should be included in the
  demos, i.e., who should have a say/vote in collective decisions. Positions:


  - All affected interests principle (AAI): everyone whose interests are affected
  by a decision should have a say in it, at least in proportion to how affected they
  are. (Goodin)

  - All subjected (coercion) principle: everyone subject to the laws/coercive power
  of a state should have a say in making them. (Blake? Abizadeh?) But Abizadeh argues
  even non-members subject to border coercion should have a say. The all-subjected
  principle often includes non-citizen residents.

  - Membership/citizenship: only citizens (full members) of the polity.

  - Stakeholder principle: those with a stake in the community (residency, long-term).

  - Nationality/cultural: the demos is a pre-political nation.


