  Prioritarianism: benefiting people matters more, the worse off they are. Social
  welfare = sum of f(wellbeing) with f concave. It doesn''t value equality intrinsically.
  Egalitarianism (telic) values equality itself: a state of affairs is better if more
  equal, holding total/average fixed. Leveling-down objection: egalitarianism implies
  that if the better off are made worse off to the level of the worse off (leveling
  down), with no benefit to the worse off, the outcome is in one respect better (more
  equal). Since that''s implausible, egalitarianism is in trouble. Prioritarianism
  avoids this because leveling down doesn''t improve anyone''s weighted wellbeing;
  it may reduce total weighted wellbeing if the better off lose. Actually under prioritarianism,
  leveling down makes things worse (or neutral? if better off become worse off, weighted
  sum decreases unless they were at same level and still decrease...). So prioritarianism
  isn''t subject to leveling-down objection in the same way.


