  Draft:


  "I hold the view that there is no way to define ''low impact'' or ''avoiding side
  effects'' for an AI system without, at least implicitly, specifying what the system
  is supposed to achieve — that is, without solving the value specification problem.
  The reason is simple: a side effect is a change to the world that is not among the
  intended changes, and ''intended'' is defined relative to a goal or value function.
  Any supposedly goal-agnostic impact measure has to choose which features of the
  world to preserve, which baseline to compare against, which possible goals to average
  over, and how to weight them; each of those choices either encodes values or leaves
  the measure vulnerable to being gamed, inert, or useless. I want to know what would
  count against this view, not just as a criticism but as evidence that should move
  someone who holds it. Which formal results, constructed measures, or arguments about
  the structure of side effects would be decisive, and which would be merely awkward?
  In particular: what would a measure have to look like to show that low impact can
  be defined without full value specification — and has anything close to that been
  done? I also want an honest assessment of whether my view has been insulated: have
  I defined ''side effect'' and ''full specification'' in a way that no possible measure
  could satisfy, and if so, is that a problem for a view of this kind or a feature
  of it? Rank the defeaters from fatal to merely awkward, and say which ones a defender
  of my view should concede as counting against it."


