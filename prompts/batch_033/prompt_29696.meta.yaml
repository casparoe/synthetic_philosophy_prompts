  The position: "Low impact" or "avoiding side effects" cannot be defined in a way
  that is both (a) usable without a full specification of the agent''s goals (or human
  values) and (b) actually tracks what we mean by side effects. The argument: a side
  effect is defined relative to what the agent is supposed to achieve; without knowing
  the objective, any change to the world could be a side effect or the intended effect.
  Measures that avoid specifying a single goal (e.g., by averaging over many possible
  goals or preserving the ability to achieve many goals) must make arbitrary choices
  about which goals to average over, the baseline, and the metric, and these choices
  encode values. So either value is smuggled in, or the measure is exploitable/trivial
  (e.g., an agent that does nothing, or that avoids all side effects by being inert,
  or that can be gamed).


  What would count against this position:

  - A formal construction showing that a goal-agnostic impact measure can approximate
  the set of "side effects" under a wide range of plausible value functions without
  being dominated by arbitrary choices.

  - A demonstration that some existing measure (attainable utility preservation, relative
  reachability, reversible actions, distance-based penalties) correctly distinguishes
  benign from harmful side effects in a suite of environments without specifying the
  goal, and that this generalizes.

  - An argument that full value specification is not needed because "side effects"
  can be defined via a default (e.g., "the world would have been otherwise unchanged"
  or "what a reasonable person would foresee") and that this default is principled
  rather than arbitrary.

  - Counterexample: a measure that passes formal tests of goal-independence and still
  blocks catastrophic side effects, which would show that the position overstates.

  - The position''s defenders might concede that some partial measures reduce expected
  side effects in practice even if they lack a complete definition — that would be
  an awkward rather than fatal defeater.

  - Also: showing that the demand for a definition "without full value specification"
  is too strong because even full value specification doesn''t settle what counts
  as a side effect (side effects are relative to intentions/counterfactuals, not just
  utility functions), so the position attacks a strawman. That would be an interesting
  concession.


