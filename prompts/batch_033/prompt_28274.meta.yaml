  Common prior assumption (CPA): In Bayesian game theory/epistemology, it''s the assumption
  that rational agents share a common prior probability distribution over possible
  worlds, and differ only in their private information. Aumann (1976) "Agreeing to
  Disagree": if two agents have common priors and common knowledge of their posteriors
  for an event, then their posteriors must be equal. So rational agents with common
  priors cannot agree to disagree. The CPA is controversial: critics say priors are
  subjective; but the CPA is a strong constraint.


