  Fitch''s paradox: The knowability principle: if p is true, then it is possible to
  know p (p → ◇Kp). Fitch shows that this collapses to p → Kp (all truths are actually
  known), given factivity of knowledge (Kp → p) and closure/distribution (K(p∧q) →
  Kp ∧ Kq). The proof: assume there is an unknown truth: q ∧ ¬Kq. By knowability,
  ◇K(q ∧ ¬Kq). But K(q ∧ ¬Kq) entails Kq ∧ K¬Kq; K¬Kq entails ¬Kq (factivity). So
  Kq ∧ ¬Kq, contradiction. Thus no unknown truth; knowability collapses into omniscience.
  The paradox is for verificationists/anti-realists who hold all truths are knowable
  but not all known.


  Teaching plan for this: audience maybe a reading group of philosophy postgrads,
