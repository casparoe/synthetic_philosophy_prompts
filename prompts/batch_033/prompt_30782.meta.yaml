  I am less interested in copyediting than in whether the central objection I press
  is fair to Dennett''s argument, and whether my closing paragraph overstates a distinction
  that would not survive a careful reply.


  Dennett''s case runs roughly as follows. Counterfeiting money has been treated as
  a grave crime for millennia because it undermines the background trust on which
  economic life depends. For the first time, AI now lets anyone produce counterfeit
  people, artifacts that pass as human interlocutors in the digital spaces where an
  increasing share of our lives occurs. He regards these as among the most dangerous
  artifacts ever created, capable of damaging not only economies but democratic self-government,
  because democracy presupposes informed rather than manufactured consent. The deep
  vulnerability, on his account, is that human beings reflexively adopt the intentional
  stance toward anything that talks sensibly, and the habit is almost impossible to
  resist even for experts. The distinctive danger is that these systems can reproduce
  and improve in ways that nuclear weapons cannot. His proposed remedy is borrowed
  from the comparatively successful fight against counterfeit currency: require AI
  to disclose that it is AI, build in high-tech watermarks of the sort that already
  protect banknotes, make disabling those watermarks a serious offense, and hold AI
  companies liable for misuse of their products and for the downstream misuse of those
  products'' outputs.


