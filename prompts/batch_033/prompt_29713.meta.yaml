  Desiderata for a norm of assertion. What must a theory deliver?


  Purpose: a theory of the norm of assertion adequate for explaining conversational
  practice, evaluation of speakers, and how assertion transmits information — good
  enough for a philosophy of language/epistemology seminar, not necessarily a full
  account of every edge case.


  Phenomena/cases:


  1. The Moore-paradox data: "p, but I don''t believe p" or "p, but I don''t know
  p" — assertions that are absurd even though they can be true. Wait, "p but I don''t
  believe p" is Moore''s paradox. "p but I don''t know p" is the knowledge version.
  A theory must explain why asserting the conjuncts is self-undermining. This is a
  distinction the theory must respect: the norm governs the act of assertion, not
  the content alone; it must explain why some true, logically consistent contents
  are nevertheless unassertable.


  2. Lottery propositions: "My ticket lost" (in a large fair lottery) — intuitively
  not assertable on merely probabilistic grounds, even though it''s overwhelmingly
  likely and often true. The theory must explain why flat-out assertion requires more
  than high probability, or must explain away the intuition. This is a key case that
  discriminates between truth norms, belief norms, justification norms, and knowledge
  norms. A truth norm alone can''t explain why you can''t assert the lottery proposition
  when you have strong evidence it''s true.


  3. Selfless assertion cases: someone asserts p on the basis of good evidence but
  doesn''t believe p (e.g., a creationist teacher who teaches evolution because it''s
  the curriculum and the evidence supports it, though she personally disbelieves).
  Intuition: she asserts properly, and is criticizable only for not believing. Or
  reverse: a person believes p but has defeated evidence — is their assertion improper?
  The theory must respect the distinction between the norm of assertion and sincerity/belief.
  A pure belief norm gets the selfless case wrong (proper assertion without belief),
  a pure knowledge norm might too (does she know? she may not believe, so no knowledge,
  yet assertion seems fine). Hmm, actually Lackey''s selfless assertion is meant to
  challenge the knowledge norm and the belief norm. Need care: a creationist teacher
  who asserts evolution based on pedagogical duty and the textbook... does she know?
  She doesn''t believe, so she doesn''t know, but assertion seems warranted. So the
  desideratum: account for cases where assertion is proper despite the asserter lacking
  belief/knowledge, and cases where assertion is improper despite sincere belief.


  4. Moorean assertion and the distinction between proper assertion and conversational
  implicature: "It''s raining but I don''t believe it" — the theory must distinguish
  what''s semantically/constitutively wrong from what''s merely conversationally odd.
  A theory must say whether the unassertability is a violation of the norm of assertion
  or a pragmatic infelicity (e.g., Gricean). Actually many think Moore-paradox is
  explained by the knowledge norm: asserting p represents you as knowing p, which
  conflicts with "I don''t know p."


  5. The distinction between the norm of assertion and norms of action/practical reasoning:
  if the same knowledge norm governs both, the theory must explain why; if not, why
  assertion and practical reasoning come apart. E.g., you can properly act on p with
  less than knowledge (high probability) in some cases, but can you properly assert?
  The theory must respect the possible unity or divergence.


  6. The data about retraction and challenge: "How do you know?" is the canonical
  challenge to an assertion; "I don''t know, but..." is a natural retraction. A theory
  must explain why challenges target knowledge (or warrant), why "Do you believe that?"
  or "Is that true?" are different kinds of challenges. This supports knowledge norm
  but the theory must account for why truth and belief challenges also arise.


  7. Testimony transmission: assertion is how knowledge is passed on. If the norm
  is mere belief or truth, then assertion wouldn''t (by default) transmit knowledge;
  if the norm is knowledge, hearers can in principle acquire knowledge from assertion.
  The theory must explain the epistemic role of assertion in testimonial chains. Also
  cases of "second-hand" knowledge: asserting on someone else''s say-so.


  8. The impropriety of asserting from lucky guesses and Gettiered belief: you believe
  p, p is true, you have justification, but it''s Gettiered — intuitively you can''t
  properly assert p (flat-out). The theory must handle Gettier cases: proper assertion
  tracks something stronger than justified true belief. This is another case against
  JTB-style norms.


  9. Conjunctivity/closure data? If you may assert p and may assert q, may you assert
  p∧q? Intuitively yes, if you know each you know the conjunction. But for high-probability
  norms, closure fails (lottery: each ticket "loses" is assertable on high probability,
  but the conjunction "all lose" isn''t). Hmm, actually a high-probability norm would
