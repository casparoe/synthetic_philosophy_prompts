  This is a real desideratum: the theory should respect the intuitive difference between
  asserting one lottery proposition and asserting the big conjunction. Good in-the-weeds
  detail.


  10. The role of stakes/practical factors: does whether you may assert p depend on
  what''s at stake? Contextualists and pragmatic encroachers say the standards for
  "knows" shift with stakes; so a theory of the norm of assertion must say whether
  the norm is stakes-sensitive (and whether that''s a feature or a bug). This ties
  to pragmatic encroachment, but the prompt is about norms of assertion; I can include
  it as a desideratum: account for (or explain away) the apparent stakes-sensitivity
  of assertability.


  11. The distinction between norms of assertion and epistemic norms of belief: one
  can have evidence sufficient for belief but not for assertion? Or vice versa? The
  theory must respect the asymmetry.


  12. "There are truths one can properly assert only with qualifiers" — hedging: "I
  think p," "Probably p," "I believe p." The theory must explain the difference between
  flat-out assertion and hedged assertion, and why hedging alters the norm.


  13. The wrong kind of reasons problem: someone asserts p because they''ll be rewarded
  for saying p, not because it''s true/known. The theory must distinguish the norm
  of assertion (what makes an assertion proper as an assertion) from merely prudential
  reasons to make the speech act. A theory must respect the distinction between the
  constitutive norm and external incentives.


  14. The possibility of norm violation without falsity: you assert something false
  on good evidence (e.g., "It''s 3:00" based on a stopped clock that happens to be
  wrong) — intuitively you''re not blameworthy in the same way as asserting a known
  falsehood. The theory must distinguish propriety from blamelessness: violating the
  norm vs. excusable violation. This is an important distinction: a norm can be violated
  blamelessly, so the theory should not conflate "proper" with "reasonable given evidence."


  15. The distinction between the content asserted and the act of asserting: "p but
  I don''t believe p" has a consistent, possibly true content, so the infelicity must
  come from the act. The theory must respect this content/act distinction.


  16. Maybe the "authority/self-representation" data: assertion represents the speaker
  as having authority, as ruling out alternatives; the theory must explain why assertion
  is more committal than conjecture.


