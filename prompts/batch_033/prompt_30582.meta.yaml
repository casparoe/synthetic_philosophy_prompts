  Newman''s objection: In "Mr. Russell''s ''Causal Theory of Perception''" (1928),
  Newman argued that if the only content of a scientific claim is structural, then
  the claim "there is a relation R with structure W" (where W is the abstract structure
  specified by the theory) is trivially satisfiable by any set of objects of the right
  cardinality. So structuralism collapses into near-tautology unless we constrain
  which relations count as "real" or "natural." This is a well-known objection to
  epistemic/structural realism, revived by Demopoulos and Friedman (1985). The modern
  structural realist (e.g., Ladyman, French) responds by saying the relations are
  not just any abstract relations but physical/nomic ones, or by adopting ontic structural
  realism where relata are eliminated.


