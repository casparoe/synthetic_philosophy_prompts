  Two friends of mine got into an argument about whether life is absurd and what follows
  from that. Mira defended a broadly Camus-style view: the universe is indifferent
  to our projects and desires, our longing for meaning meets silence, and the honest
  response is to acknowledge the absurd and live intensely anyway — to rebel by embracing
  life without illusion. David pushed back with something closer to a contemporary
  "meaning in life" account: meaning arises when we subjectively engage with things
  of objective value — relationships, creative work, understanding — and the fact
  that the universe as a whole is indifferent doesn''t undermine the genuine meaning
  we find in these activities.


  Their exchange went roughly like this:


  (1) Mira: "The problem isn''t just that the universe is large and indifferent. It''s
  that the question ''What''s the point?'' has no answer that doesn''t eventually
  bottom out in something we simply decide to care about. You can say relationships
  matter, but if I ask why they matter, eventually you''ll say ''they just do'' or
  ''I just care about them.'' That''s exactly the silence Camus is talking about."


  (2) David: "That''s too demanding. No justification can be infinitely regressive
  — every chain of reasons ends somewhere. The fact that my reasons for valuing my
  daughter''s well-being eventually run out doesn''t mean that value is illusory.
  It means that some things are properly basic. The absurdist sets an impossible standard
  for what would count as an answer."


  (3) Mira: "I''m not setting an impossible standard — I''m pointing out that once
  you see the contingency of your basic commitments, the feeling that they''re objectively
  important is hard to sustain. You can still live as if they matter, but you''re
  doing so in full awareness that nothing outside your own caring anchors them. That''s
  the absurd: the clash between the seriousness with which we live and the inability
  to justify that seriousness from outside."


  (4) David: "But that clash only arises if you insist on an external justification.
  If meaning is constituted by the right kind of engagement with valuable things —
  not by some cosmic endorsement of that engagement — then the absence of cosmic endorsement
  doesn''t create a clash. It''s simply irrelevant. Your argument works only if you''ve
  already accepted that meaning requires something like cosmic backing, which is exactly
  what contemporary accounts deny."


  (5) Mira: "Then I think your account changes the subject. When people ask whether
  life is meaningful, they''re often asking whether it matters in a way that isn''t
  just a fact about their own psychology. If your answer is ''it matters to you, and
  the objects of your engagement are valuable by human standards,'' you''ve given
  a satisfying answer about well-being, maybe, but not about meaning in the sense
  that keeps people up at night."


  (6) David: "I think that''s the sense that keeps people up at night because they''ve
