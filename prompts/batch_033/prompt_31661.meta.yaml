  must decide whether to publish a recipe for a dangerous virus; each individually
  might publish if they think benefits outweigh risks; even if two think it bad, the
  third publishes. The proposed remedy: a "principle of conformity" — when a decision
  is unilateral and the stakes are high, one should only act if one''s judgement is
  that the action is a good idea and one has a sufficiently high level of confidence;
  maybe a presumption against unilateral action when the downside is large and irreversible.


  Implications for a research group: (1) decisions that are de facto unilateral need
