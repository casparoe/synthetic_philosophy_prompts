  The unilateralist''s curse: Nick Bostrom, Anders Sandberg, et al. "The Unilateralist''s
  Curse" — idea: when a group can take an action where any one member can unilaterally
  do something (with possibly bad consequences), the group is likely to do it because
  the most optimistic/least cautious member will act. It''s about information cascades
  / the need for a "common knowledge" threshold. Interesting implications. But it''s
  fairly niche and perhaps less rich philosophically.


  Rigid designators and the necessary a posteriori: Kripke, Naming and Necessity.
  Distinction between epistemic and metaphysical necessity; identity statements like
  "Hesperus is Phosphorus" are necessary a posteriori; theoretical identifications
  like "water is H2O". In-the-weeds issues: whether the necessary a posteriori commits
  one to essentialism, whether a posteriori necessities show there are contingent
  a priori truths too, the relationship to two-dimensional semantics, "gold has atomic
  number 79" as a posteriori necessity. Rich.


  The demarcation problem and falsificationism: Popper''s falsifiability criterion,
  its problems (Duhem-Quine, ad hoc hypotheses, astrology/marxism examples), the debate
  about whether demarcation is even a meaningful problem (Laudan''s "demise of the
  demarcation problem"). Rich and standard, but models have seen it a lot. Could make
  it in-the-weeds: e.g., the precise role of "risky predictions" vs "immunizing stratagems",
  whether falsifiability is a criterion of science or of the scientific attitude,
  the problem of "sophisticated falsificationism" (Lakatos). Hmm.


