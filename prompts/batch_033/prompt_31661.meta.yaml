  The unilateralist''s curse: when several agents each have the power to take an action
  that affects everyone, and each decides based on their own estimate, the group is
  likely to act if any one member''s estimate says go — even if the group''s collective
  (averaged or pooled) judgement would say don''t. The standard examples: a group
  of scientists deciding whether to publish a dangerous piece of information; a committee
  where anyone can send a message. The curse is stronger when there is a presumption
  in favour of action? Actually the curse arises when the action is irreversible and
  the decision is "unilateral" (anyone can do it). The most optimistic member acts.
  Mitigations: require consensus, common knowledge thresholds, designated decision-maker,
  making decisions multilateral, secrecy/norms against unilateral action, etc.


  In-the-weeds aspects: The curse depends on the assumption that the action is taken
  by the most favourable estimate, and that the action is irreversible. It is related
  to but distinct from groupthink, information cascades, the "tragedy of the commons"?
