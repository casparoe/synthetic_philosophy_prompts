  Let me think more carefully about accuracy of Lakatos concepts:


  - Methodology of Scientific Research Programmes (MSRP)

  - Hard core: irrefutable by methodological decision; negative heuristic forbids
  directing modus tollens at it.

  - Protective belt: auxiliary hypotheses; positive heuristic; anomalies absorbed.

  - Progressive problemshift: a programme is theoretically progressive if each modification
  predicts some novel, previously unexpected fact; empirically progressive if some
  of these predictions are corroborated. Degenerating if modifications are ad hoc
  (post hoc explanations of anomalies, no novel predictions).

  - He distinguished from Popper''s naive falsificationism: no theory is ever falsified
  by a single observation; "there is no falsification before the emergence of a better
  theory."

  - "Mature science consists of research programmes."

