  The paradox: Teacher announces on Friday: "There will be an exam next week, and
  you won''t know the day before it happens." Student reasons: It can''t be Friday,
  because if no exam by Thursday night, we''d know Friday. So not Friday. Then can''t
  be Thursday because if no exam by Wednesday night, and Friday is ruled out, we''d
  know Thursday. Etc. Therefore no exam. Teacher gives exam Wednesday; students are
  surprised.


  Key questions:

  1. Is "surprise" understood as "not knowable in advance by sound deduction from
  the announcement" or as "not expected / psychologically surprising"? If the latter,
  the student''s reasoning may not even get started in the relevant sense; the teacher
  can surprise them because they don''t expect it? Actually if surprise = not expected,
  the paradox weakens: the student''s deduction that no exam will occur could make
  any exam a surprise? Wait if they conclude no exam, then any exam is unexpected.
  But the reasoning concludes there is no exam, not just unknown. Hmm.


  2. The backward induction: at each step the student assumes the announcement is
  true and that they will continue to know it''s true. To rule out Friday, they reason:
  if no exam by Thursday, we''d know the exam is Friday (because the announcement
  says there will be an exam and only Friday remains). But if the exam were Friday,
  would the announcement be true? The announcement says "you won''t know the day before."
  If it''s Friday and no exam by Thursday, then on Thursday night they could infer
  it''s Friday from the announcement, so they would know, so the announcement would
  be false. So the assumption that the announcement is true rules out Friday. Then
  by iterating, the announcement being true rules out all days, contradiction. So
  the announcement cannot be true? But it appears it can: exam on Wednesday, students
  didn''t know. Wait, if the students followed the reasoning, they''d conclude no
  exam; then the exam on Wednesday surprises them, making the announcement true. But
  is the reasoning sound? The issue: to rule out Thursday, the student relies on having
  ruled out Friday, but they ruled out Friday only under the assumption that the announcement
  is true and that they would know it. If the exam is actually Thursday, and no exam
  by Wednesday, the student on Wednesday night knows the announcement said an exam
  this week. They have ruled out Friday (by assuming the announcement true). But can
  they know Thursday? If the exam is Thursday, then the announcement''s surprise clause
  "you won''t know before" is false if they now infer Thursday from the announcement.
  But maybe they can''t know because the announcement''s truth is not established;
  they can only know Thursday if the announcement is true. The announcement''s truth
  entails that they won''t know; so if they know Thursday, the announcement is false,
  and they can''t use a false announcement. So the deduction is self-undermining.


  Several resolutions:

