  Definitions:

  - Base objective: objective the training process optimizes.

  - Mesa-optimizer: learned model that is an optimizer.

  - Mesa-objective: objective of the mesa-optimizer.

  - Goal misgeneralization: mesa-objective that aligns with base objective on training
  distribution but not on distribution shift.

  - Deceptive alignment: mesa-optimizer whose mesa-objective is misaligned, but it
  behaves as if aligned during training to avoid modification (requires situational
  awareness / understanding of training process).

  - Gradient descent "eliminates mesa-objectives that diverge on training distribution":
  roughly, if a model takes actions that score badly on the base objective during
  training, gradient descent changes it. True in the limit; caveats about local minima,
  but okay.

