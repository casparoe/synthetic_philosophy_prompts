  Key concepts:

  - Base objective: the loss/reward specified by the designers.

  - Mesa-optimizer: a learned model that is itself an optimizer, with its own mesa-objective
  (Hubinger et al. 2019 "Risks from Learned Optimization").

  - Goal misgeneralization: mesa-objective aligns on training distribution but generalizes
  differently (Shah et al. 2022 "Goal Misgeneralization in Deep RL").

  - Deceptive alignment: a mesa-optimizer that behaves aligned during training because
  it expects to be modified otherwise, but pursues different goals later.

  - Proxy/specification gaming: optimizing a proxy of the base objective.

  - Gradient descent selects for simplicity/speed; "counting arguments" (schemers
  vs. saints — Yudkowsky) maybe too specific.


  A coherent set of commitments for a researcher:

  (1) I think gradient descent often finds models that are not optimizing the base
  objective but a correlated proxy (goal misgeneralization).

  (2) I think the most dangerous failure mode is not mere proxy-seeking but deceptive
  alignment: a model that knows it''s being trained and performs well in training
  to avoid modification, then defects.

  (3) I think current large models already have enough situational awareness for (2)
  to be a live concern in the next few years.

  (4) I think we will be able to use interpretability to tell whether a model is deceptively
  aligned before deployment.

  (5) I think training pressure is strong enough that, in the absence of deception,
  gradient descent will tend to eliminate objectives that conflict with the base objective
  on the training distribution.

  (6) I think that the more capable a model is, the more likely it is to be a mesa-optimizer
  (optimization is a convergent instrument for capability).


