  What''s right:

  - The scenario and the strategic problem: rational agent won''t be trusted; making
  yourself a promise-keeper can make the driver trust you and save you; doing so can
  be in your self-interest.


  What''s subtly wrong/overstated:

  1. "Parfit concludes that it is rational to be irrational" — Parfit''s point is
  more careful: it''s rational to cause yourself to be (or to have a disposition to
  be) irrational; the action of paying later, if performed, may be irrational by the
  self-interest theory, but the ex ante decision to acquire the disposition is rational.
  "Rational to be irrational" conflates two time-slices/evaluative standpoints.

  2. "The self-interest theory refutes itself" / "is self-defeating" — Parfit distinguishes
  direct and indirect self-defeat, and self-effacingness. The hitchhiker shows S is
  indirectly self-defeating (or self-effacing): S tells you to make yourself disposed
  not to follow S. Whether that is a refutation is a further step; Parfit himself
  does not say S refutes itself, and he discusses whether being self-effacing is an
  objection at all. A defender would say S is a criterion of rational action, not
  a decision procedure; being self-effacing doesn''t make it false.

  3. Maybe "the only way out is to make yourself irrational" — overstatement: you
  could cultivate a disposition to keep promises that operates through moral commitment,
  not irrationality; or find external enforcement, precommitment (a third party who
  will pay for you), etc. But the core case uses the drug.

  4. "take a drug that forces you to keep promises" — okay, one version; some versions
  involve becoming a trustworthy person rather than taking a drug.


