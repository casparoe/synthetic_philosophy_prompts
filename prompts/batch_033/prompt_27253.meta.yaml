  (1) A bias is a deviation from what a correct judgment would be under ideal conditions.

  (2) What counts as a correct moral judgment is itself a moral question, not a value-neutral
  fact.

  (3) So when I call your moral judgment biased, I''m just applying my own moral standards
  to your judgment.

  (4) But my own moral standards are themselves preferences (or attitudes, or sentiments)
