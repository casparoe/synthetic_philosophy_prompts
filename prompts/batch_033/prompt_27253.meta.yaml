  The difficulty: in moral psychology, a "bias" is a systematic deviation from some
  norm; a "preference" is just a disposition to choose. When we criticize someone''s
  moral judgment as biased, we''re presupposing a correct norm; but if morality is
  ultimately grounded in preferences/attitudes (as sentimentalists/constructivists
  hold), then every moral judgment is a preference, so "bias" has no non-question-begging
  sense. Argument that seems to prove too much: "there are no moral biases, only differing
  moral preferences." The asker finds it absurd because they want to say e.g. in-group
  favoritism is a bias, not a legitimate preference. Where does the argument go wrong?


