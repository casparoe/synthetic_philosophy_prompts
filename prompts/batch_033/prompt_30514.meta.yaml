  Classic Ellsberg: Urn has 90 balls: 30 red, 60 black or yellow in unknown proportion.
  People prefer: (A) win $100 if red drawn, over (B) win if black drawn. And prefer
  (D) win if black or yellow drawn, over (C) win if red or yellow drawn. A vs B: A
  has known 1/3 probability, B unknown between 0 and 2/3. C ("red or yellow") has
  known? Red 30 + yellow unknown = 30–90, so probability between 1/3 and 1. D ("black
  or yellow") = 60 exactly, known 2/3. So people prefer known 1/3 over ambiguous 0–2/3
  (A over B), and known 2/3 over ambiguous 1/3–1 (D over C). These preferences can''t
  be represented by a single subjective probability over black vs yellow, because
  A>B implies P(red) > P(black); D>C implies P(black or yellow) > P(red or yellow),
  i.e., P(black)+P(yellow) > P(red)+P(yellow), so P(black) > P(red). Contradiction.
  So the pattern violates probabilistic sophistication/SEU.


