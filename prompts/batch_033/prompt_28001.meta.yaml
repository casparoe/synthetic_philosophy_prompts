  Actually, I think Russell''s paradox is the domain I can handle most rigorously
  without search. Let me verify my understanding:


  - Naive set theory (Frege''s Basic Law V / unrestricted comprehension): for any
  property φ, there is a set {x : φ(x)}. Russell''s paradox: take φ(x) = x ∉ x. Then
  R = {x : x ∉ x}. R ∈ R iff R ∉ R. Contradiction. So unrestricted comprehension is
  inconsistent.


  - The standard fix: ZF replaces unrestricted comprehension with Separation (Aussonderung):
  given a set A, {x ∈ A : φ(x)} is a set. This blocks the paradox. Foundation (Regularity)
  says every nonempty set has an ∈-minimal element; it implies no set is a member
  of itself and no infinite descending ∈-chains. But Foundation is independent of
  the other ZF axioms; the paradox alone does not force Foundation. You can have set
  theories without Foundation where self-membered sets exist (non-well-founded set
  theory, Aczel''s Anti-Foundation Axiom).


  - Quine''s New Foundations (NF): comprehension is restricted to stratified formulas,
  not by size. NF has a universal set V (the set of all sets) and V ∈ V. So self-membership
  is allowed. NF blocks Russell''s paradox because the formula "x ∉ x" is not stratified
  (x appears on both sides of ∈? Let''s see: stratification requires types; in "x
  ∉ x", the same variable appears on both sides of the membership relation, which
  violates stratification). So R doesn''t form a set in NF. There are also positive
  set theory, etc.


  - So the moral: Russell''s paradox shows unrestricted comprehension is inconsistent;
  it doesn''t by itself show self-membership is impossible or that there''s no universal
  set. The move to ZF with Foundation is one way, but not forced.


