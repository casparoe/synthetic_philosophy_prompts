  Draft:


  "I''m designing a ''which epistemology of knowledge are you?'' sorting quiz for
  an upper-level undergraduate epistemology reading group. The quiz should sort people
  into positions on the relationship between knowledge, the closure principle, and
  the tracking-style conditions that Nozick introduced, but it should do so entirely
  through their verdicts on concrete cases, not by asking them which slogan they like.


  Please write the quiz as follows.


  Eight to ten questions, each presenting a short, concrete case. Use and adapt the
  standard stock of cases as needed — fake barn country, the lottery, the zebra at
  the zoo, the stopped clock, the brain in a vat, the high-stakes bank — but give
  each case enough detail that the question is self-contained. Each question should
  have two or three answer options phrased as first-person judgments about whether
  a subject knows, or about what you would say in the situation. No question may simply
  ask ''do you think knowledge is closed under known entailment?'' or ''do you accept
  sensitivity?''


  The positions the quiz must be able to distinguish are: (1) a Nozick-style tracking
  view, on which knowledge requires that the belief be sensitive — that the subject
  would not hold it if it were false — and closure accordingly fails; (2) a Dretske-style
  relevant-alternatives view, which also denies closure but for reasons about which
  alternatives are relevant rather than about sensitivity; (3) a safety view, on which
  knowledge requires that the belief could not easily have been held while false,
  and which tends to preserve closure; (4) a contextualist view, on which knowledge
  attributions are true or false relative to conversational standards, so ordinary
  knowledge claims and skeptical denials can both be correct in their contexts; (5)
  a skeptical invariantist view, on which the skeptical hypothesis is a genuine alternative
  that you cannot rule out, so ordinary knowledge claims are almost always false;
  and (6) a Moorean, closure-preserving anti-skeptical view, on which you know you
  have hands and can therefore know you are not a brain in a vat. If you think subject-sensitive
  invariantism (knowledge is invariant but sensitive to the subject''s stakes) deserves
  a separate leaf, add it, but flag how it is separated from contextualism by the
  quiz.


  For each question, say which positions the answer options are meant to separate.
  Then provide a scoring key: assign each answer option a point value or vector across
  the positions, and explain how the pattern maps onto the six (or seven) leaves.
  Be explicit about which combinations of answers would leave a respondent unclassified,
  and say for each whether the empty region is empty because the view is incoherent,
  because it is merely unattractive, or because the quiz''s questions do not reach
  it. Finally, flag any two positions the quiz cannot separate cleanly with the current
  questions, and say what additional case or question would separate them."


