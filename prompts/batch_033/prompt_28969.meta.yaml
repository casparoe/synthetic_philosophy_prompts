  ---


  I spent much of yesterday evening arguing with a friend about whether a mutual acquaintance''s
  information environment is best described as an echo chamber, an epistemic bubble,
  or neither. We agreed on the observable facts — the narrowness of his reading, the
  way he discounts outside sources, the history of how he came to distrust them —
  but we could not agree on the diagnosis, and I came away convinced that we were
  applying different concepts without realizing it. Before I resume that argument,
  I want a specification of what an adequate account of echo chambers and epistemic
  bubbles must do, where an account is adequate if it lets us diagnose cases like
  his, explain how the epistemic damage occurs, and say what could help.


  Please write the desiderata. At minimum, I expect an adequate account to: distinguish
  an epistemic bubble from an echo chamber rather than treating them as synonyms;
  explain why exposure to contrary evidence is widely thought to dissolve one but
  not the other; explain why an echo chamber is epistemically harmful in a way that
  goes beyond the mere absence of exposure to opposing views; and distinguish an echo
  chamber from an ordinary community of inquiry that shares background assumptions,
  since otherwise every discipline, tradition, and friendship group would count as
  one. For each item, give the case or consideration that makes it a genuine requirement
  rather than a terminological preference.


  Then evaluate whether the following further candidates belong on the list, giving
  the reason in each case: (i) that an account must explain how contrary evidence
  can be neutralized or inverted, so that the very plausibility of outsiders is treated
  as evidence against them; (ii) that it must separate the epistemic defect from moral
  or intellectual criticism of members, so that one can be inside an echo chamber
  without being stupid, vicious, or culpable; (iii) that it must allow for benign
  or temporary epistemic bubbles; (iv) that it must allow that a group can be an echo
  chamber even around a true or well-evidenced belief; (v) that it must distinguish
  echo chambers from mere political polarization, from algorithmic filter bubbles,
  and from groups with merely high evidentiary standards. For each, say whether it
  is a real requirement or a confusion, and what it would cost to omit it.


  Finally, I want the two structural questions. First, are any subsets of these requirements
  jointly unsatisfiable — for example, does the requirement that echo chambers be
  defined by a distinctive mechanism of manufactured distrust conflict with the requirement
  that membership be evaluable independently of anyone''s culpability or bad character?
  Second, which single requirement does the most work in ruling out inadequate accounts,
