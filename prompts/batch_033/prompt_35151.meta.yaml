  and belief simultaneously. Key issues:


  - The interdependence of belief and meaning: to know what a speaker means, you must
  know what they believe; to know what they believe, you must know what they mean.
  Charity is supposed to break the circle by holding belief largely true/consistent.


  - Charity as constitutive vs heuristic: is charity an empirical assumption that
  could turn out false, or a constitutive condition on interpretation (a precondition
  of having a theory of meaning at all)? If constitutive, does that imply massive
  agreement is necessary, not just useful? Does that make radical disagreement with
  us impossible to interpret?


  - The normativity of meaning: Davidson ties meaning to truth conditions and rationality;
  the idea that intentional states are governed by constitutive norms of rationality
  (coherence, consistency, truth). If charity is constitutive, then "massive error"
  about the world is impossible to attribute, because that would undermine the identification
  of content.


  - Indeterminacy: Davidson accepts a form of indeterminacy of interpretation — different
  theories of truth can fit all possible evidence equally well yet differ in T-sentences;
  but this is not Quine''s inscrutability of reference? Actually Davidson accepts
  indeterminacy of interpretation but thinks it''s benign because all adequate theories
