  just the fact that different theories can be equally good; but he rejects the idea
  that there is "nothing to be right about."


  - Triangulation: later Davidson adds the idea that meaning requires a triangle of
  speaker, interpreter, and shared object; this is supposed to ground the objectivity
  of content and answer concerns about whether charity is just imposing our own standards.


