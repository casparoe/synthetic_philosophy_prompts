  Key conceptual fault lines in the dust specks debate:


  1. Whether harms to different people can be added up at all (separateness of persons
  / anti-aggregation). Diagnostic: classic case — is there any number N such that
  N people each getting a speck is worse than one torture? If "no, no number is enough",
  anti-aggregation/lexical. If "yes, some finite N", aggregation.


  2. Whether the comparison is lexical or has a threshold. Diagnostic: would you trade
  one torture for any finite number of specks? vs would you trade a torture for specks
  only once the number passes some enormous threshold? Lexical says no finite number;
  threshold says beyond T it flips.


  3. Whether the intensity matters continuously: a spectrum case — start with torture,
  reduce intensity slightly and increase numbers, etc. Some people''s answers become
  intransitive (they accept each small step but reject the overall). Diagnostic: ask
  a chain of pairwise comparisons.


  4. Distribution: one person receiving all the specks (e.g., a speck every second
  for years) vs many people each receiving one. Does the total disutility sum the
  same? A "distribution-sensitive" or "separateness-sensitive" view says specks spread
  across many are different from specks piled on one person — either worse (because
  many people affected) or less bad (because each harm is trivial and no single person
  bears much).


  5. Whether sub-threshold / imperceptible harms count. Some views say harms below
  a noticeability threshold have zero moral weight, which blocks the aggregation of
  specks. Diagnostic: a case where each individual harm is so small it''s below awareness,
  but millions of them occur. Hmm, a dust speck is noticeable though barely. Could
  ask about "a harm so tiny the person never notices it" — would any number of those
  outweigh a real harm?


  6. Consent/rights: whether choosing to impose specks on people without their consent
  is different from choosing torture; deontological side-constraints. Maybe less central;
  could include as a question about whether the wrongness of torture isn''t just about
  suffering.


