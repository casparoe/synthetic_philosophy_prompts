  the classic case, indifferent to distribution (same total = same badness).

  - Lexical anti-aggregationist: no number of specks outweighs torture; serious harms
  are incommensurable/lexically prior; may also reject cross-person summing.

  - Threshold aggregator: specks aggregate only past a threshold; before that they
  count for nothing; after that they swamp.

  - Distribution-sensitive: totals matter but so does how harms are spread; same total
  can be better or worse depending on distribution.

  - Intransitive/spectrum view: pairwise choices along a spectrum don''t chain together;
  no single consistent scalar.


