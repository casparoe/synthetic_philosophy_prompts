  1. If time is objective, then there is an objective lapse of time (becoming is real).

  2. Objective lapse of time requires that there be a global time function, i.e.,
  a global decomposition of spacetime into successive "nows."

  3. But general relativity permits spacetimes (the Gödel universe) that have no global
  time function.

  4. If objective lapse is a necessary feature of reality, then it must be present
  in every physically possible world.

  5. Therefore, objective lapse is not a necessary feature of reality; and since the
  laws of physics alone don''t guarantee it, the intuitive view of time is unsupported,
  and the idealistic view is preferable.


