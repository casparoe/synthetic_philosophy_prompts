  ---


  Two members of my reading group, Marta and Daniel, spent an evening arguing about
  the conceivability argument against physicalism. Neither could convince the other,
  and I was unable to referee, so I am writing down their exchange as accurately as
  I can and asking for a point-by-point adjudication.


  By "philosophical zombie" they both meant a being physically identical to a conscious
  human being down to the last particle, but with no phenomenal consciousness: no
  felt experience, no qualitative "what it is like" to be that being. Physicalism
  here is the thesis that every fact—including every fact about consciousness—is fixed
  by the physical facts.


  (1) Marta opened with the standard argument: zombies are conceivable because the
  idea contains no detectable contradiction. If zombies are conceivable, then they
  are metaphysically possible. And if they are possible, then a world physically identical
  to ours could differ from ours in consciousness, so the physical facts do not determine
  the phenomenal facts. Physicalism is therefore false.


  (2) Daniel replied that conceivability is a poor guide to possibility. People once
  found it conceivable that water might not be H₂O, or that the Morning Star might
  not be the Evening Star, yet those things are impossible. Conceivability tracks
  our concepts and our information, not modal reality, so the first inference fails.


  (3) Marta answered that those cases trade on incomplete empirical information about
  identities in the actual world. The zombie case is different: it fixes every physical
  fact and varies only the phenomenal facts. No further information about brains could
  reveal that the zombie world is impossible, because by stipulation there is nothing
  physical left to discover.


  (4) Daniel said that is precisely the telltale sign of an epistemic gap rather than
  a metaphysical one. We cannot derive the phenomenal facts a priori from the physical
  facts, so we can conceive of their coming apart. But the physicalist can explain
  this with the peculiar character of phenomenal concepts: they are recognitional
  or indexical concepts that pick out experiences from the inside and do not reveal
  the physical nature of what they refer to. The gap is in our concepts, not in the
  world.


  (5) Marta responded that this relocates the problem without solving it. If the physical
  facts genuinely necessitate the phenomenal facts, there must be something in virtue
  of which that necessitation holds. The phenomenal-concept story explains why the
  entailment is not transparent to us; it does not supply the entailment itself. What
  remains is a brute necessity, and "brute necessity" is just a name for an unexplained
  connection asserted to be necessary.


  (6) Daniel conceded that the phenomenal-concept strategy is incomplete, but said
  the alternative is weaker. The move from conceivability to possibility is only as
  good as the conceivability in question. To license a metaphysical conclusion, the
  conceivability must be ideal: fully rational reflection with no hidden conceptual
  confusion. We can conceive of a largest prime or of a barber who shaves all and
  only those who do not shave themselves; conceivability is cheap. Unless Marta can
