  Sphexishness is a term from Dennett (Elbow Room, 1984, and later works). It refers
  to the behavior of the Sphex wasp, which performs a seemingly intelligent but actually
  rigid sequence of behaviors. The wasp brings a paralyzed cricket to the entrance
  of its burrow, goes in to inspect, comes back out, and drags the cricket in. If
  you move the cricket a few inches while the wasp is inside, the wasp will come out,
  drag the cricket back to the entrance, and go in to inspect again. You can repeat
  this indefinitely - the wasp never "realizes" it could just drag the cricket straight
  in. This is contrasted with genuinely flexible behavior that responds to novelty.


  The philosophical point is about free will: if humans are just more complex but
  still deterministic systems, are we just sphexish in more sophisticated ways? Or
  is there a qualitative difference? What makes behavior genuinely flexible vs. merely
  complex-but-rigid?


