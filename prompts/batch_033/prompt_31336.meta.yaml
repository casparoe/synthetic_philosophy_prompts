  outsider status, disciplinary inertia) that neither theory directly addresses; the
  "long run" is doing a lot of work; James would struggle to distinguish acceptance
  because it was useful from acceptance because it was true. The prompt could ask:
  who are the inquirers, what counted as evidence, what does each theory say the community
  should have done / when they were warranted in calling it true, and what does the
  episode show about each theory.


