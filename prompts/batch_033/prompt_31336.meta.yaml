  is the opinion fated to be agreed upon by the community of inquirers in the long
  run; inquiry converges. James: truth is what is expedient in the way of belief,
  what "works," "satisfies," the "cash-value" of an idea. Analyze the episode: Does
  the 50-year resistance and eventual consensus vindicate Peirce''s convergence? Does
  James''s expediency explain why geologists accepted it when it became useful? Where
