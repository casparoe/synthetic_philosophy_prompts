  ---


  I am a retired chemist who has recently begun working through the philosophy of
  science, and I keep returning to a question I once would have answered without hesitation:
  do the sciences carve nature at its joints, or is the "joints" talk a flattering
  description of classifications that are partly imposed by our interests and practices?
  I would like to commission a specific kind of document.


  Please draft the joint statement of an adversarial collaboration between two positions
  in this debate. The first I will call the natural-kind realist: the view that at
  least some scientific categories correspond to mind-independent divisions in nature,
  and that among the many possible classifications of a domain, some are objectively
  closer to those divisions than others. The second I will call the promiscuous realist
  or pluralist: the view that a given domain typically admits many equally legitimate,
  cross-cutting classifications, and that which kinds we recognize is ineliminably
  shaped by our purposes. The statement should be one that a thoughtful, good-faith
  advocate of each position could actually sign, not a lowest-common-denominator compromise
  and not a charade in which one side''s view is quietly reworded into the other''s.


  The document should have two parts. First, a numbered section of agreed claims.
  These should be substantive and specific, not vacuous: I want them to cover, at
  minimum, (i) the distinction between a merely convenient classification and a natural
  kind, (ii) the status of chemical kinds such as the elements, (iii) the fact that
  biological taxonomy cross-cuts in ways chemistry mostly does not, (iv) what the
  "carving at the joints" metaphor can and cannot be asked to do, and (v) which strands
  of the dispute, if any, are verbal. Second, a disagreements table. Each row should
  give: the precise point at issue; the realist''s formulation of their own view,
  worded as a realist would accept; the pluralist''s formulation of their own view,
  worded as a pluralist would accept; and a note on whether the disagreement survives
  that reformulation.


  Then, in a separate section, identify the cruxes: the sub-questions such that a
  settled answer to them would move at least one side. For each crux, specify a concrete
  case or argument that both sides agree bears on it, and record in advance what each
  side predicts the case will show when examined closely. I expect at least the following
  to be among the cases you take up, though you may add others: the classification
  of the chemical elements by atomic number; the species problem in biology (with
  its competing species concepts); and one cross-cutting classification from a domain
  such as psychiatry, soil science, or ecology, where multiple schemes coexist. For
  each crux, do not adjudicate; the point is to record the disagreement and the test
  precisely.


  Throughout, avoid relying on citation or bibliography; I want the document to stand
  on the arguments. And where you conclude that part of the dispute is merely verbal
  — for example, that the two sides mean different things by "mind-independent" or
  "objective" — say exactly which part and propose the reformulation under which it
  dissolves.


