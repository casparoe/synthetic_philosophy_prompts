  No-trade theorem details I''m confident about:

  - Aumann (1976): if two agents have common priors and their posterior probabilities
  for an event are common knowledge, then their posteriors are equal ("agreeing to
  disagree" is impossible).

  - Milgrom & Stokey (1982): no-trade theorem: if risk-averse traders begin with a
  Pareto-efficient allocation and common priors, then no new private information can
  generate trade; no speculative trade purely on information differences. In a single-good
  setting, if traders are risk-neutral and have common priors, differences in information
  alone cannot create mutually acceptable trades because each trader would wonder
  why the other wants to trade.

  - Rationales for real trade: hedging/insurance, liquidity needs, different risk
  preferences/endowments, consumption smoothing, taxes, heterogeneous priors, overconfidence/behavioral
  noise.

  - The "Groucho Marx" point: "I wouldn''t join any club that would have me as a member"
  / never accept a bet from someone eager to bet with you because their eagerness
  is evidence.

  - In practice: adverse selection (market for lemons), bid-ask spreads as protection
  against informed traders (Glosten-Milgrom? Kyle model). The "epistemology of markets":
  prices aggregate information (Hayek, Grossman-Stiglitz paradox — markets can''t
  be perfectly informationally efficient because if they were, no one would be paid
  to gather information). Grossman-Stiglitz 1980: if prices fully reflected all information,
  no incentive to acquire information, so equilibrium with costly information can''t
  be fully efficient. That''s a nice detail.


