  Consider classic puzzle: A sculptor buys a lump of clay on Monday. On Tuesday she
  forms it into a statue ("Goliath" perhaps). The lump (Lump) existed on Monday; the
  statue (Statue) came into existence on Tuesday. Therefore Lump ≠ Statue, since Lump
  has a property Statue lacks (existing on Monday) — or alternatively, if you squash
  the clay on Wednesday, Lump survives and Statue perishes, so they differ in persistence
  conditions. Yet on Tuesday, Lump and Statue are in the same place, made of the same
  matter, same parts. So there are two material objects wholly coinciding. By parity
  of reasoning, if the statue is formed gradually, when does it come into being? Or
  we can multiply: the clay could be shaped into a statue and also constitute a "piece"
  or an "artwork" etc. Conclusion: material objects multiply beyond plausibility,
  or identity is sortal-relative. Where does it go wrong?


