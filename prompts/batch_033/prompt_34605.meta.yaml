  Dennett''s three stances:

  - Physical stance: predict using physical laws and the actual physical state.

  - Design stance: predict by assuming the system is designed to function a certain
  way (e.g., alarm clock is designed to ring at the set time).

  - Intentional stance: predict by attributing rationality, beliefs, desires, goals.


  Key claims: The intentional stance is a predictive strategy; you adopt it when it''s
  the most efficient/practical. Whether a system "really" has beliefs is, for Dennett,
  settled by whether the intentional stance works — there''s no inner Cartesian theater;
  beliefs are real patterns in the system''s dispositions. But Dennett distinguishes
  real patterns by their stability/robustness and how much they cost to predict otherwise.
  He bites bullets: a thermostat can be treated as having a belief like "it''s too
  cold in here" — he explicitly discusses thermostats and says their intentionality
  is real but extremely simple. He says "we are all intentional systems" and the difference
  between us and thermostats is one of degree/complexity, not kind.


  So an argument that "the intentional stance overgenerates because it licenses attributing
  beliefs to markets and natural selection" is not a reductio Dennett would fear;
  he''d bite the bullet with qualifications. But there''s a real question about whether
  that bullet is acceptable: does it erase the distinction between mind and goal-directed
  process? Dennett would say the distinction is real but graded, and that''s fine;
  the alternative is a mysterious intrinsic property.


