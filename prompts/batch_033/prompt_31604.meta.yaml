  ---


  I''m a philosophy PhD student working on moral responsibility, and I''ve been trying
  to sort out my own verdicts on a range of cases before I commit to a theory. I''d
  be grateful for help extracting whatever principle, if any, underlies them — or
  for being told which of my verdicts I should revise.


  Here are the cases and my reactions, reported as honestly as I can:


  1. A driver glances down at a text message, drifts into a crosswalk, and kills a
  pedestrian. I feel resentment toward him, and I judge him blameworthy.


  2. A driver with a scrupulously maintained car hits a child who darts into the road;
  the brakes fail because of an undetectable manufacturing defect. I feel no resentment
  toward the driver — only grief for the child.


  3. A man who has been gentle his whole life develops an orbitofrontal tumor, becomes
  aggressive, and attacks a nurse. I don''t resent him; I regard him roughly the way
  I regard a storm or an illness. Blaming him seems beside the point.


  4. A person diagnosed with psychopathy defrauds elderly people without any remorse.
  I want him stopped, and I would support confinement, but I notice that my attitude
  toward him is closer to my attitude in the tumor case than to my attitude toward
  the texting driver: I don''t feel ordinary indignation.


  5. A man robs a store because a cartel has credibly threatened to kill his child
  if he refuses. I don''t excuse him the way I excuse the brake-failure driver, but
  my blame is muted; I''m unsure whether I''m blaming him or mostly pitying him.


  6. A surgeon in her thirtieth hour on shift makes a preventable error and a patient
  dies. I blame her less than I blame the texting driver, but I can''t say exactly
  why: she chose the profession and knew about shift culture.


  7. A man raised from infancy in a violent separatist cult beats a journalist, believing
  he is defending his community. I''m torn. Part of me reaches for the attitude I
  have in the tumor case; another part wants to resent him, because he seems to understand
  and endorse what he is doing.


  8. A con man slowly grooms a lonely widow into signing over her savings. My indignation
  here is stronger than in any other case.


  The pair that troubles me most is the psychopath and the cult-raised assailant:
  both were shaped by histories they did not choose, yet I exempt the one and half-blame
  the other. I''m also unsure why the exhausted surgeon and the texting driver, who
  both made a prior choice that led to harm, strike me so differently.


  My tentative principle is something like Strawson''s: we are entitled to resentment
  and indignation when an action manifests an objectionable quality of will, but some
  agents are not apt targets of these reactive attitudes at all because they fall
  outside the participant stance. Does this principle, repaired if necessary, capture
