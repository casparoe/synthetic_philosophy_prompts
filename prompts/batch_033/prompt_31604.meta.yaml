  Strawson''s framework: Reactive attitudes (resentment, gratitude, indignation, guilt)
  are natural human responses to others'' quality of will toward us. We hold people
  responsible by being disposed to these attitudes. Excuses (he didn''t know, it was
  an accident, he was pushed) show the act didn''t manifest ill will; exemptions (he''s
  a child, psychopath, mentally ill, under extreme strain) put the agent outside the
  participant stance entirely, object of objective attitude. Determinism doesn''t
  undermine responsibility because the participant stance is inescapable and not a
  theory to be falsified.


