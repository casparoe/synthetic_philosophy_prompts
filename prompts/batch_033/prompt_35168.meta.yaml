  The Gödelian analogy: Gödel showed that any sufficiently strong consistent formal
  system can construct a sentence G that says (via coding) "G is not provable in this
  system." If the system proves G, it''s inconsistent; if it can''t prove G, G is
  true but unprovable — so the system is incomplete: there are truths it can''t prove.
  Hofstadter''s GEB uses this as a metaphor/analogy: self-reference (strange loops)
  in formal systems is like self-awareness in minds. The idea: a mind is a formal
  system (or the brain runs a formal system), and self-consciousness arises from the
  same kind of self-referential loop — the "I" is like the Gödel sentence, the system
  thinking about itself, a strange loop. The analogy is used to argue (depending on
  who''s using it) either:

  - (Hofstadter-ish) that self-awareness/consciousness is not mystical; it can emerge
  in a rule-following system via self-reference, so minds might be realized by machines/formal
  systems.

  - (Lucas/Penrose-ish) that Gödel shows a mind can see the truth of G while any formal
  system can''t, so the mind is not a formal system — the disanalogy is used to argue
  minds transcend machines. This is the other direction: they use the analogy to draw
  a boundary.


