  The common prior assumption (CPA) in game theory/epistemology: In Aumann''s agreement
  theorem (1976), if two agents have the same prior, their posterior beliefs are common
  knowledge, and they are rational Bayesians with common knowledge of each other''s
  rationality, then their posterior probabilities must be equal — they cannot "agree
  to disagree." The CPA is the assumption that all agents start with the same prior
  probability distribution; any difference in posteriors must be due solely to different
  private information. The "Harsanyi doctrine" in game theory holds that differences
  in beliefs reflect differences in information only. CPA is a modeling assumption
  used to avoid arbitrary belief heterogeneity in games; without it, many equilibrium
  concepts are harder to interpret.


