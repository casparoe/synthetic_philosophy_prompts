  But I should ensure I use accurate Kantian terminology. Let me recall:

  - Formula of Universal Law (FUL): "Act only according to that maxim whereby you
  can at the same time will that it should become a universal law." Or "Act as if
  the maxim of your action were to become by your will a universal law of nature."

  - Formula of the Law of Nature (FLN): "Act as if the maxim of your action were to
  become by your will a universal law of nature." This is one version.

  - Contradiction in conception: a maxim whose universalization cannot even be conceived
  coherently (e.g., false promising: if everyone made false promises, the institution
  of promising would collapse, so the maxim undermines itself). These correspond to
  perfect duties.

  - Contradiction in willing: a maxim whose universalization can be conceived but
  cannot be willed consistently (e.g., not developing one''s talents, not helping
  others; one can conceive a world where no one develops talents, but one cannot rationally
  will it because the will needs talents to pursue ends; or a world of universal non-beneficence
  can be conceived but one cannot will it because one would need help). These correspond
  to imperfect duties.

  - Perfect duties: no exceptions, e.g., don''t make false promises, don''t kill.

  - Imperfect duties: require adoption of maxims, e.g., develop talents, help others,
  but latitude in how/when.


