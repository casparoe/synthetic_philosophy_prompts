  lies, and I could not referee them. The first, an engineer who works on learning-based
  control systems, and the second, a former prosecutor, were not arguing about what
  any existing law requires; they were arguing about what is true, morally, of the
  case. I would like you to adjudicate their exchange move by move, as it actually
  unfolded.


