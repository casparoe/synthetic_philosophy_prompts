  Strawson''s view (paraphrase): Our practices of holding people responsible — resentment,
  gratitude, blame, forgiveness — are part of the participant stance we take toward
  each other as persons. They don''t stand or fall on the truth of determinism; the
  question of whether determinism makes blame unjustified is a pseudo-problem because
  these reactive attitudes are internally justified by the participant stance, and
  we can''t (and shouldn''t want to) abandon them wholesale. The objective stance
  — treating someone as an object to be managed, cured, or trained — is available
  in special cases (children, the mentally ill), but taking it universally would be
  inhumane and is not something we could actually do while living normal lives. Excuses
  (he didn''t do it, he didn''t know) work within the participant stance; exemptions
  (he''s not a responsible agent at all — he''s insane, he''s a child) push us toward
  the objective stance.


  Now a novelist''s commitments. A novelist who has internalized Strawson might hold:


  1. Strawson''s core: reactive attitudes like resentment and gratitude are what it
  is to hold someone responsible; they don''t need a metaphysical foundation (libertarian
  free will) to be legitimate.

  2. Determinism is true (or at least, compatibilism: determinism doesn''t undermine
  responsibility).

  3. As a novelist, they take the participant stance toward their own characters —
  they resent them, forgive them, feel betrayed by them — and think that''s what makes
  characters feel real. A novel is only good if the author is inside the participant
  stance with the characters.

  4. But they also think some people (real and fictional) are so thoroughly shaped
  by circumstances — trauma, poverty, brain chemistry — that the objective stance
  is the more truthful and more humane response to them; blaming them feels like a
  category mistake.

