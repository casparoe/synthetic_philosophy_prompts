  Common prior assumption (CPA): In Bayesian game theory/Aumann''s agreement theorem,
  rational agents with common priors who have common knowledge of each other''s posterior
  probabilities for an event must have equal posteriors. So disagreement requires
  either different priors or failure of common knowledge (or non-Bayesian rationality).
  CPA is often defended as a normative constraint: differences in beliefs should trace
  to differences in information, not to arbitrary priors. Cases could test intuitions
  about when disagreements are reasonable.


