  welfare. Rather than each giving to their own cause ($50 each?), you could both
  give to the other''s top cause in a trade: each gives $100 to the other''s cause,
  and both are happier? Wait that doubles giving. Alternatively, within a household
  with a joint budget, trading concessions: "I''ll support your opera subscription
  if you support my football tickets" — but that''s ordinary preference trade.


  Moral trade more precisely: agents with different moral theories can cooperate to
  mutually advance their separate values, even though each thinks the other''s values
  are partly mistaken. It''s a form of "moral compromise" that is not objectionable
  because it doesn''t require changing one''s moral beliefs or acting against them;
  it''s like gains from trade.


  Some conditions: moral trade is possible when there are multiple possible actions,
  parties value them differently, and each can do something the other values more
  than it costs them in their own values. The result can be Pareto-improving in terms
  of each agent''s own moral evaluation. The "moral trade" paper might define: a moral
  trade is an agreement between two agents that increases the expected moral value
  (by each agent''s own lights) for both.


