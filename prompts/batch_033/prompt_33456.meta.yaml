  Moral trade background: Toby Ord''s "Moral Trade" argues that moral trade is often
  permissible and underappreciated. One key distinction: moral trade vs. compromise/selling
  out. In moral trade, you don''t adopt the other''s values or act against your own
  all-things-considered judgment; rather, you help them with what they value in exchange
  for help with what you value, and the outcome is better by your own lights than
  the status quo. Example: a pure utilitarian and a pure deontologist each donate
  to the other''s favored charity? Hmm.


  Actually, the classic example: Suppose you''re deciding with your spouse/partner
