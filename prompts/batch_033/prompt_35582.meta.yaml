  leakage" — making the better-off worse off while only partly benefiting the worse-off
  — as an improvement.

  (5) But the leveling-down objection was supposed to be that a view shouldn''t approve
  making someone worse off for the sake of a pattern; and a leaky transfer is just
  a milder version of that.

  (6) So prioritarianism doesn''t actually escape the leveling-down objection; it
  only hides it inside the weighting function.

  (7) Therefore either prioritarianism collapses into egalitarianism, or the leveling-down
  objection refutes it too.

