  = sum g(w_i). A leaky transfer from rich (w_high) to poor (w_low): reduce w_high
  by δ, increase w_low by δ - ε (leak). Total change = [g(w_low + δ - ε) - g(w_low)]
  - [g(w_high) - g(w_high - δ)]. For small units, this is approximately g''(w_low)(δ-ε)
  - g''(w_high)δ. Since g'' is decreasing (concave), g''(w_low) > g''(w_high). For
  sufficiently small ε, the change is positive. So yes, prioritarianism approves some
  leaky transfers that make the better-off worse off and transfer less than the full
  loss to the worse-off. Does this count as "leveling down"? Leveling down strictly
