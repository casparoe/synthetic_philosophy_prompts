  Kavka''s toxin puzzle details: You are offered a million dollars if, at midnight
  tonight, you intend to drink a vial of toxin tomorrow afternoon. The toxin will
  make you painfully ill for a day, but you don''t actually have to drink it to get
  the money — you just have to intend to at midnight. You know all this. Can you intend
  to drink it? Intuitively you can''t, because you know you won''t (since you have
  no reason to, once midnight passes). But if you could, you''d get a million dollars,
  which you want. Puzzle: the object of intention seems constrained by belief about
  future action; intention seems to require belief you''ll do it; but intentions are
  also subject to rational pressures. The puzzle is used to argue against the view
  that intention reduces to belief + desire (since if intending to drink just were
  believing you''ll drink + wanting to, and you have reason to believe... wait, you
  don''t believe you''ll drink). Actually the puzzle is often framed: if you could
  intend to drink, you''d get the money; you can''t because you can''t intend what
  you know you won''t do; so intention isn''t just a matter of wanting plus believing.


