  In a decision problem, I choose among my acts and treat the other player''s act
  as a state over which I have no control. Cooperation is dominated: if she cooperates,
  defecting earns the temptation rather than the reward; if she defects, defecting
  earns the punishment rather than the sucker payoff. In every state, defection does
  better. The fact that the pair would be better off under mutual cooperation is true
  but irrelevant, because I cannot choose the pair''s joint act — I can only choose
  my own."


  Move 3 (Simone):

  "Your dominance table treats her act as if it were conditionally independent of
  mine, but the symmetry gives me a conditional dependence. Conditional on my cooperating,
  the most likely thing is that she — running the same reasoning — cooperates; conditional
  on my defecting, she defects. Under those conditional probabilities, cooperating
  has expected value R and defecting has expected value P, and R > P. So cooperation
  maximizes expected value. Dominance only looks decisive because you are conditioning
  on the state rather than on your own act."


  Move 4 (David):

