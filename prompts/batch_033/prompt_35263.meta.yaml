  Moves:


  M1 (student A, superrationalist): The standard dominance argument says: whatever
  the other does, I do better by defecting. But that argument treats the other''s
  choice as fixed while mine varies. Here the other isn''t an external variable; she
  is an ideal reasoner in precisely my situation. Identical inputs to identical reasoning
  yield identical outputs. So the live possibilities are not "I defect while she cooperates"
  and "I defect while she defects," but rather "we both cooperate" or "we both defect."
  Between those, both cooperate is better for each of us. Therefore I should cooperate.


  M2 (student B): That''s elegant but it changes the subject. In a decision problem,
  I choose among my acts, taking the other player''s act as a state of the world I
  don''t control. Defection dominates: if she cooperates, my defecting gets me the
  temptation payoff rather than the reward; if she defects, my defecting gets me the
  punishment rather than the sucker payoff. So no matter which world I''m in, defecting
  is better. The fact that both-cooperate is better than both-defect as a joint outcome
  doesn''t tell me which act to perform, because I don''t get to choose the joint
  outcome — I only get to choose my own row or column.


  M3 (A): But the dominance reasoning assumes my act is independent of hers. The symmetry
  of the situation gives a conditional dependence: conditional on my cooperating,
  the strongest evidence is that she, facing the same problem with the same decision
  procedure, also cooperates; conditional on my defecting, she defects. Under that
  conditional probability, the expected value of cooperating is the reward R and of
  defecting is the punishment P. Since R > P, cooperation maximizes expected utility.
  Defection only looks dominant if you condition on her act alone and ignore that
  my act is evidence about her act.


  M4 (B): That''s precisely the move that makes evidential decision theory controversial.
  In a one-shot PD there''s no causal channel from my act to her act; the "correlation"
  is only in my head — a correlation between my possible choices and my beliefs about
  her. But expected utility should track the outcomes my act can bring about, not
  the outcomes my act merely diagnoses. If I learn that some third party has predicted
  my choice with high accuracy, evidential reasoning can tell me to pay a bribe that
  doesn''t affect the outcome. Superrationality is just evidentialism in a hall of
  mirrors: it replaces "the predictor predicted me" with "the other player reasons
  exactly as I do," but the fallacy is the same — confusing evidence for a state with
  control over it.


  M5 (A): The analogy to a predictor is misleading. A predictor is a distinct mechanism
  whose output is causally upstream of both my choice and the outcome; the other player
  in a symmetric PD is not upstream of anything. She is running the very same deliberation.
  When I ask "what should a rational agent in this situation do?", I am simultaneously
  answering "what will she do?" So the individual act and the pair''s outcome are
  not separable in the way your dominance argument requires. And notice what your
  "dominance" gives us: if it is the rational answer, she too will defect, and we
  each get P. If superrational cooperation is the answer, we each get R. A theory
  of rational choice that reliably lands every symmetric pair in the worse equilibrium
  is not a neutral arbiter; it''s a self-fulfilling prophecy that rational agents
  should want to avoid.


  M6 (B): The last move only works by smuggling in a collective principle: "choose
  the act such that, if everyone in your situation did it, you''d be best off." That''s
  a generalization test, not an individual rationality criterion. Symmetry alone yields
  no unique fixed point: "both cooperate" and "both defect" are both perfectly symmetric
  outcomes. To break the tie in favor of cooperation, you''re appealing to the fact
  that (C,C) is better for each than (D,D). But that is a reason for a pair, or for
  a rule, not a reason for me now, given that my act alone won''t cause hers. Unless
  you can show why a rational agent may treat "the other player''s reasoning" as if
  it were controlled by her own, superrationality is just collective rationality dressed
  up as individual rationality.


  Then perhaps A''s final counter: B''s "both fixed points" point misunderstands the
  superrationalist''s question. The question isn''t "which symmetric outcome is possible?"
  but "which policy should an ideal reasoner adopt when all parties adopt the same
