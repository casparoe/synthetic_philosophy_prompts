  The disagreement moves:


  Move 1 (Marta): Reflection is a requirement of rationality. If you violate it, you''re
  diachronically incoherent, and you can be Dutch-booked: a bookie can offer you bets
  now and later that you''ll accept at your own credences and that guarantee a net
  loss. Being systematically exploitable is a hallmark of irrationality.


  Move 2 (Ravi): Dutch book vulnerability doesn''t settle it. The bookie''s later
  bets are accepted by your future self, and if that future self is predictably irrational
  — say you know you''ll be sleep-deprived, drunk, or misled — you shouldn''t defer
  to them now. It''s rational to refuse to align with a credence you expect to have
  for bad reasons.


  Move 3 (Marta): Reflection doesn''t apply when you expect your future self to be
  irrational or to have lost information; it''s only a constraint on rationally anticipated
