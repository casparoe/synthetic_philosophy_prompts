  Draft:


  "At our departmental reading group on formal epistemology last week, two of my colleagues
  got into an argument about the Reflection principle that I have not been able to
  referee. The principle, as it was presented, says that a rational agent''s current
  credence in a proposition should equal her current expectation of her future credence
  in that proposition: for any proposition A and any future time t, P_now(A | P_t(A)
  = r) = r whenever the conditional is defined; equivalently, P_now(A) = Σ_r r · P_now(P_t(A)
  = r). Thus, if you are certain now that tomorrow you will be 0.9 confident that
  it will rain, you should already be 0.9 confident that it will rain."


  Then the moves:


  "(1) Marta opened by defending the principle as a requirement of diachronic rationality.
  She said that an agent who violates Reflection can be exploited by a bookie who
  offers her a series of bets over time, each fair by her own lights at the time she
  takes it, and which together guarantee a net loss. Since vulnerability to such a
  guaranteed-loss strategy is a mark of incoherence, and incoherence is a mark of
  irrationality, Reflection is rationally required.


  (2) Ravi replied that the Dutch strategy argument does not settle the matter, because
  the later bets are accepted by a future self who may be predictably irrational.
  If you now know that tonight you will be sleep-deprived, or that someone will give
  you misleading evidence, you should not now bring your credences into line with
  the confused credences you expect to have later. Deferring to a future self you
  have reason to distrust is not rational; it is a kind of self-sabotage.


  (3) Marta answered that this is a misreading of the principle. Reflection, she said,
  only constrains you with respect to future credences that you now regard as the
  product of a rational process — future selves that have updated properly on their
  evidence. When you know your future self will be impaired or misled, that future
  self is not the sort of self the principle tells you to defer to, so the counterexample
  misses its target.


  (4) Ravi said that this response saves the principle only by draining it of content.
  Either Reflection is a purely formal coherence constraint, in which case the sleep-deprivation
  and misleading-evidence cases are genuine counterexamples; or it is a substantive
  claim about which future selves are trustworthy, in which case it is no longer a
  principle of rationality but an ordinary judgment about evidence and reliability.
  He added a cleaner case: if you now know a coin landed heads, and you know you will
  later take a drug that makes you forget the toss, your future credence in heads
  will be one-half, and you now assign credence one to heads conditional on your future
  credence being one-half. That violates Reflection, even though forgetting is not
  irrational and no one has been misled.


  (5) Marta conceded that the forgetful agent violates the formula but said this shows
  only that the formula needs the right scope restriction, not that the underlying
  norm is wrong. She argued that in the cases that matter — when you expect your future
  self to have more evidence, more time, or better reasoning — deferring to that future
  self is clearly what rationality requires, and Reflection is simply a partial formalization
  of that requirement. She said Ravi was confusing an imperfect formalization with
  the norm it approximates.


  (6) Ravi answered that the norm she was left with does no work from the agent''s
  point of view. To apply it, you first have to decide whether your future self will
  be a better judge than you are now; but that is exactly the hard question, and Reflection
