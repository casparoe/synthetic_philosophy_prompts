  For a while now I have been rereading Hofstadter''s Gödel, Escher, Bach, and the
  chapter on the location of meaning has been colliding in my head with arguments
  I keep seeing about large language models. Hofstadter separates three levels of
  information in a message: the frame message, which is roughly the fact that something
