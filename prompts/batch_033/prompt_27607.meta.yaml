  which is the information carried by the structure and symbol-patterns that tells
  you how to decode it; and the inner message, which is the content itself. In the
  discussions I follow, people argue about whether a model understands a sentence
  or whether its knowledge of a fact is stored in its weights, and they usually proceed
  as though the inner message alone settles the question. If Hofstadter is right that
  meaning is spread across the frame, the decoding machinery, and the content, then
  that way of talking may be asking the wrong question.


  I would like you to work out the most important implications of this three-way distinction
  for claims of the form "the model understands X" or "the model''s knowledge of X
  is located in its weights." In particular: what would have to be true about the
  frame and outer messages in a particular case before it is reasonable to attribute
  understanding to the model itself rather than to the larger system of model-plus-interface-plus-trainer-plus-user?
  Does the distinction suggest any concrete tests or observations that could separate
