  Domain: principle of indifference. Rules people actually defend:


  1. **Classical PI (finite partition)**: assign equal probability to each member
  of a finite set of mutually exclusive and exhaustive possibilities, when no evidence
  favors any. Doesn''t extend to continuous cases (or extends via limiting partitions).


  2. **Parameter-uniform PI**: if a continuous parameter is completely unknown over
  an interval, use the uniform distribution over that parameter as stated. (This is
  what gives Bertrand''s different answers depending on parameterization.)


  3. **Symmetry/invariance PI (Jaynes)**: use the probability measure invariant under
  the problem''s symmetries (rotations, translations, scale). For Bertrand''s chord,
  this yields 1/2. For coin/die, equal probabilities.


  4. **Skeptical/refusal**: the principle of indifference is only valid when there''s
  an objective symmetry; otherwise no well-defined probability.


