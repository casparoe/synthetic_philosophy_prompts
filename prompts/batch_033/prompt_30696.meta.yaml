  Dennett''s "Quining Qualia" (1988, in Consciousness Explained 1991 as a chapter;
  originally in Marcel & Bisiach, Consciousness in Contemporary Science). He argues
  that the concept of qualia is so confused that it should be eliminated ("quined").
  Key moves:

  - Qualia are supposed to be ineffable, intrinsic, private, directly/immediately
  apprehensible in consciousness.

  - He gives "intuition pumps" to show these properties don''t survive scrutiny.

  - Chase and Sanborn: two coffee tasters at Maxwell House. Chase says the coffee
  tastes the same but he no longer likes it (his standards changed). Sanborn says
  he likes the coffee but it no longer tastes the same to him (his taste buds changed).
  Dennett argues that introspection can''t distinguish these two hypotheses; the "way
  it tastes to me" doesn''t fix a determinate content. So the alleged "immediate apprehension"
  of qualia is undermined.

  - Other intuition pumps: the beer drinker who acquires a taste for beer (does the
  taste change or does he just come to like it?); inverted spectrum (Dennett argues
  it''s not detectable/coherent); "phantom qualia" (a neurosurgeon makes you believe
  you have qualia?) Actually there''s the "zombie" discussion elsewhere.

  - He concludes that qualia is a philosopher''s term of art that doesn''t pick out
  any real property; we should drop it. Not that there''s no consciousness, but that
  the concept is bankrupt.


  Now, a competent popularizer''s summary with subtle errors might say something like:


  "Daniel Dennett''s ''Quining Qualia'' argues that qualia don''t exist because they
  can''t be communicated. His Chase and Sanborn thought experiment shows that introspection
  cannot tell the difference between a change in taste and a change in preference,
  so our judgments about our own experience are unreliable. Dennett concludes that
  consciousness itself is an illusion and that there is nothing it is like to taste
  coffee."


