  - Paternalism: interference with a person''s liberty or autonomy justified by appeal
  to that person''s own welfare/good. Hard vs. soft paternalism (Mill''s distinction:
  soft paternalism intervenes only to establish whether the person is acting voluntarily/competently;
  hard intervenes even when voluntary).

  - The practice of refusing self-harm instructions might be soft paternalism: the
