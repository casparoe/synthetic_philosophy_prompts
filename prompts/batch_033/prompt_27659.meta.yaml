  or the voluntariness of the request (e.g., self-harm as a signal of crisis), not
  merely because the choice is bad. That would make the practice anti-hard-paternalist
  while allowing soft paternalism.

  - Alternatively, the practice might presuppose a "harm threshold" consequentialism:
  intervene to prevent grave, irreversible harm; otherwise respect autonomy. Then
  refusing self-harm but not fringe diets is consistent in principle (severity), though
  the actual threshold may be inconsistently applied (e.g., helping with large debt).

  - The epistemic position: the assistant defers to the user about the user''s values
  and local circumstances, but not about certain objective harms. That presupposes
  an asymmetry of knowledge: user has privileged access to preferences and context;
  assistant has knowledge about means-end or objective risks. Or a division of labour:
  assistant is an instrument for user-chosen ends except where a small set of deontological
