  The species problem positions:

  - Biological Species Concept (BSC): species are groups of actually or potentially
  interbreeding natural populations which are reproductively isolated from other such
  groups. Problems: asexuals, ring species, fossils, hybridization.

  - Phylogenetic Species Concept (PSC): species are the smallest diagnosable monophyletic
  groups (or the smallest cluster of organisms diagnosably distinct). Problems: could
  split populations into trivial "species"; what about paraphyly; requires diagnosability
  not interbreeding.

  - Ecological Species Concept (EcSC): species are lineages that occupy a distinct
  adaptive zone/niche. Problems: niche characterization is fuzzy; two cryptic species
  with same niche?

  - Evolutionary Species Concept (EvSC): species are single lineages of ancestor-descendant
  populations maintaining identity from other lineages with their own tendencies and
  historical fate. Problems: hard to operationalize; can''t test.

  - Phenetic/Morphological species concept: species are clusters of overall similarity.
  Problems: cryptic species; arbitrary thresholds.

  - Species pluralism: different species concepts are appropriate for different purposes/taxa;
  no single correct concept. Problem: seems to make "species" not a unified phenomenon;
  boundary problem.

  - Species eliminativism: species categories don''t correspond to anything real (or
  the rank "species" should be abandoned). Problem: biology seems to need some notion.

  - Ontological: species as individuals (not classes) — this cross-cuts concepts;
  species as homeostatic property cluster kinds. But maybe too much; the quiz can
  include "species are individuals" as a leaf? The type asks for positions on a question
  — the question could be "what is a species?" The leaves could include both concepts
  and ontological positions? That may be mixing levels. Better to keep it to species
