  axis the tree notes but doesn''t fully separate." Hmm.


  Let me design the diagnostic questions/cases for the quiz:


  1. Ring species case: two adjacent populations interbreed, but the end populations
  meet and don''t. Options: (a) the whole ring is one species (BSC-ish, since gene
  flow connects them indirectly), (b) the non-interbreeding end populations are two
  species (PSC/diagnosability or BSC with direct interbreeding), (c) species status
  depends on whether they occupy different niches/adaptive zones (EcSC). This question
  separates BSC from PSC? Actually BSC people struggle with ring species; some say
  it''s one species (gene flow around the ring), others say two. Could separate pluralists
  ("it depends on what you''re doing") from monists.


  2. Asexual clone/lineage case: bdelloid rotifers, all-female, no interbreeding.
  Are they a species? Options: (a) no, or the BSC doesn''t apply — they''re "agamospecies"
  or not species at all; (b) yes, they form a diagnosable lineage (PSC); (c) yes if
  they occupy a distinct niche (EcSC); (d) grouping them is purely pragmatic (pluralism/eliminativism).


  3. Horizontal gene transfer bacteria case: two bacterial strains share genes promiscuously.
  Options: (a) no species here, the whole concept breaks down (eliminativism/pluralism);
  (b) species = ecological population (EcSC, Cohan''s ecotypes maybe); (c) species
  = some genomic similarity threshold (phenetic/pragmatic); (d) still diagnosable
  clusters (PSC). This separates EcSC/phenetic from BSC.


  4. Fossil chronospecies: a lineage changes gradually over time; paleontologists
  split it into successive species at arbitrary points. Options: (a) they''re one
  evolving lineage, the splits are arbitrary (EvSC); (b) splitting at morphological
  shifts is fine (phenetic/PSC); (c) no interbreeding data so the question is undecidable,
  we use a different concept (pluralism); (d) the successive segments are distinct
  species if diagnosable (PSC).


  5. Cryptic species: two sympatric populations don''t interbreed but look identical.
  Options: (a) two species (BSC — reproductively isolated); (b) not distinct species
  unless diagnosable by some character (PSC — but if they are diagnosable by genetics,
  then yes); (c) one species if they occupy the same niche (EcSC); (d) one species
  because no morphological difference (phenetic). Good: separates BSC from phenetic/EcSC.


  6. Hybrid zone: two "species" meet and produce fertile hybrids in a stable zone.
  Options: (a) two species because hybrids are a narrow zone and don''t merge the
  gene pools (BSC/EvSC); (b) one species because there''s gene flow (strict BSC);
  (c) two if they remain distinct lineages despite hybridization (EvSC/PSC); (d) depends
  on purpose (pluralism).


  7. Ecological niche case: two populations can interbreed in the lab but in nature
  are adapted to different hosts and never meet. Options: (a) one species because
  potential interbreeding (BSC); (b) two species because distinct adaptive zones/lineages
  (EcSC/EvSC); (c) two if diagnosably distinct (PSC).


  8. Conservation/policy case: a conservation law protects "species," and a population
  is genetically distinct but interbreeds with others. Options: (a) protect it as
  a species because it''s a distinct lineage (PSC); (b) not a species because it interbreeds
  (BSC); (c) call it a "conservation unit" but not a species — the species label is
  a policy choice (pluralism/eliminativism). This brings in practical angle.


