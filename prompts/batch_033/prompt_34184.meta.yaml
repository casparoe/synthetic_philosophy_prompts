  of posteriors, common knowledge that each is Bayesian (rational), and the event
  and information structure is common knowledge. The theorem does NOT say rational
  people can''t disagree in general; it says if they have common priors and their
  posterior beliefs become common knowledge, they can''t "agree to disagree" — their
  posteriors must coincide. It also does not say that disagreement implies someone
  is irrational, because the common prior assumption may fail. Even with different
  priors, agreement may not happen; with common priors but not common knowledge of
  posteriors, disagreement possible. Also the theorem doesn''t require them to "talk
  it out" in real time; it''s a static condition. Popular summary might say "two rational
  people with the same prior and common knowledge of each other''s beliefs cannot
  disagree" — that''s roughly right. Overstatements: "any two rational people must
  eventually agree after exchanging views"; "disagreement is proof of irrationality";
  "since we all share the same prior? (no, priors can differ)"; conflating "common
  prior" with "both being rational".


