  Two members of my reading group got into a long argument about Anscombe''s protest
  against Oxford''s plan to award Harry Truman an honorary degree, and neither of
  them could convince the other. I''d like a point-by-point adjudication of the exchange.


  Daniel said Anscombe''s core charge is simpler than people make it: deliberately
  killing the innocent as a means to one''s end is murder, whatever the end is, and
  the atomic bombings were a case of exactly that — cities were destroyed in order
  to kill or terrorize their civilian populations into surrender. If you accept that
  principle, Truman''s order was murder even inside a just war.


  Ruth replied that the principle only looks compelling because it ignores the alternatives.
  An invasion of the home islands was expected to kill far more people, civilians
  included, on both sides. If the rule forbids killing innocents even to prevent a
  much larger slaughter, then the rule is not morality but a recipe for paralysis
  — and Truman''s choice was the lesser evil.


  Daniel answered that this is the very defense Anscombe anticipated and rejected.
  "It saved lives" cannot be a sufficient justification, because every massacre can
  be defended by someone who judges that it will save lives in the long run. And the
  invasion was not the only alternative: the Allies could have modified the demand
  for unconditional surrender, clarified the Emperor''s position, or found another
  way to demonstrate the weapon. The dilemma was partly self-imposed, and you cannot
  create a dilemma and then plead necessity.


  Ruth said the alternatives are armchair hindsight — a failed demonstration could
  have hardened resistance, and the demand for unconditional surrender had real coalition
  and postwar reasons behind it. She also pushed on the internal structure of Anscombe''s
  view: Anscombe is not a pacifist and allows that a just war will foreseeably kill
  some civilians. So the difference between Truman''s bomb and, say, a legitimate
  attack with heavy collateral damage comes down to a claim about what the agent intended.
  That is too fragile a distinction to support calling one man a murderer and the
  other a soldier.


  Daniel replied that this is exactly the distinction double effect exists to draw,
  and the test is not private psychology but the structure of the act: if the civilians
  had been absent, the bombing would have had no point, so their deaths were the means,
  not a side effect. That, he said, is what Anscombe means by murder — and she is
  not asking for pacifism, only for the admission that the bombings fell outside the
  limits that even a non-pacifist morality must keep.


