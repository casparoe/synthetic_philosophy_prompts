  Let me think about content of Quine''s "Two Dogmas."


  Quine attacks two dogmas of empiricism:

  1. The analytic-synthetic distinction: the belief in a fundamental cleavage between
  analytic truths (grounded in meanings independently of fact) and synthetic truths
  (grounded in fact).

  2. Reductionism: the belief that each meaningful statement is equivalent to some
  logical construct upon terms referring to immediate experience.


  Quine''s argument structure:

  - He first examines Kant''s and others'' accounts of analyticity (truths of meaning).
  He distinguishes two classes of purported analytic statements: logical truths and
  those reducible to logical truths by substituting synonyms (e.g., "No bachelor is
  married" -> "No unmarried man is married").

  - To make sense of the second class, we need a notion of cognitive synonymy. He
  argues that attempts to explain synonymy (definition, interchangeability salva veritate,
  semantic rules, verification theory) are circular or inadequate.

  - He argues the second dogma (reductionism/verification theory) is connected: the
  view that the meaning of a statement is its method of confirmation/verification.
  Actually he says the two dogmas are at root identical: the verification theory of
  meaning supports the analytic-synthetic distinction because if a statement''s meaning
  is its method of verification, then analytic statements are those confirmed come
  what may.

  - His positive view: holism (Duhem''s point extended): our statements face experience
  as a corporate body, not individually; any statement can be held true come what
  may by adjusting elsewhere in the web; conversely no statement is immune to revision.
  Thus there is no principled boundary between analytic (immune) and synthetic.

  - He concludes that the notion of analyticity is an unempirical dogma, and suggests
  a pragmatic/empirical approach without the boundary.


  Common subtle mistakes a student could make:

  1. Saying Quine argues that there are no analytic truths / that all sentences are
  synthetic. Actually Quine argues we lack a clear criterion for the distinction;
  he doesn''t prove no analytic truths. He says the distinction is ill-founded/dogmatic;
  not that every purported analytic truth is really synthetic. He wants to abandon
  the distinction, not classify everything as synthetic.

  2. Conflating Quine''s critique with the claim that all statements are revisable
  in the same way, ignoring his asymmetry/pragmatic point. Quine says any statement
  can be revised, but some revisions are more costly; he keeps a graded distinction
  (centrality vs periphery), not a principled one. A student might say Quine thinks
  logic and mathematics are just as easily revisable as ordinary observation sentences
  — subtle overstatement.

  3. Misstating the two dogmas: saying the second dogma is "the existence of synonymy"
  or "the distinction between meaning and fact." Actually second is reductionism.

  4. Saying Quine endorses the Duhem thesis without noting that Duhem restricted it
  to physics and Quine extended it. A student might say Quine borrowed from Duhem
  but misstate? Could be subtle.

  5. Saying Quine showed the analytic-synthetic distinction is meaningless (not his
  claim; he says it''s unempirical / ill-defined).

  6. Attributing "no statement is immune to revision" to Quine correctly, but then
  saying "therefore all statements are synthetic" — mistake.

  7. Conflating a priority with analyticity. Quine attacks analyticity; a student
  might say Quine thereby shows there are no a priori truths. But Quine''s target
  is analyticity, and a priori/empirical? Actually Quine rejects a priori too perhaps,
  but not exactly; careful.

  8. Misattributing Carnap''s view: saying Carnap held analytic truths are those true
  in all possible worlds — Carnap''s actual view: analytic statements are true by
  semantical rules / L-truth. But that''s fine if the question doesn''t require.


