  Jeffrey conditionalization (JC): If you have a partition {E1,...,En} and your observation
  directly changes your probabilities over the partition to new values q(Ei), while
  probabilities conditional on each Ei stay fixed ("rigidity"), then your new probability
  for any proposition A is sum_i q(Ei) * P(A | Ei). This is "probability kinematics."


  Contrast with strict conditionalization (SC): upon learning evidence E with certainty,
  set P_new(·) = P_old(· | E). For uncertain evidence, one might attempt to condition
  on some proposition describing the evidence, e.g., "the cloth looks blue" or "the
  reading is 0.7". But JC was motivated by cases where the evidence doesn''t correspond
  to a proposition you''re certain of—your experience itself has a certain evidential
  force without you having to become certain of any factual proposition. Jeffrey''s
  example: observing a cloth by candlelight, you might become confident but not certain
  that it''s green. You can''t condition on "the cloth is green" (not certain) and
  conditioning on "the cloth looks green" presupposes a proposition about appearance
  whose probability you may update to 1 and whose likelihoods are available; Jeffrey''s
  point is that this move is often artificial.


