  Two people in my office got into an argument about how you should update your beliefs
  when evidence is less than certain, and I couldn''t settle it.


  Maya: Suppose a radiologist reads an x-ray and ends up 80% sure there''s a tumour.
  Standard Bayesianism handles this fine: she just conditions on the proposition describing
  what she actually saw—the pattern on the film, the fuzzy shadow, whatever. Her new
  credence in ''tumour'' is her old credence conditional on that observation.


  Dan: But that''s exactly what she didn''t learn for certain. She didn''t become
  certain of any precise proposition about the film; she just found herself more confident
  that there''s a tumour. If you force her to condition on ''I saw such-and-such a
  pattern,'' you need likelihoods for that pattern given tumour and given no-tumour,
  and those likelihoods are precisely the judgement the x-ray was supposed to supply.
  The honest move is to say her credence in the tumour moved straight from, say, 0.2
  to 0.8, while her credences conditional on ''tumour'' and on ''no tumour'' stayed
  fixed.


  Maya: But ''move straight to 0.8'' isn''t a rule, it''s just a number you''ve pulled
  out of the air. Where does 0.8 come from if not from something she learned? And
  why should conditional probabilities stay fixed? Sometimes an observation should
  change what you''d expect given a tumour, not just how likely a tumour is.


  Dan: The 0.8 is the input—the new state of uncertainty her experience puts her in—not
  something the rule is supposed to derive. Strict conditionalization also leaves
  its input unexplained: it tells you to hold everything else fixed when you learn
  a proposition, and that''s a substantive assumption too, not a theorem of probability.
  At least my story doesn''t pretend the experience was a proposition she became certain
  of.


