  Let me double-check facts about PBR: The PBR theorem (Pusey, Barrett, Rudolph, 2012)
  says that if the quantum state is statistical (epistemic) in the sense that distinct
  quantum states can correspond to overlapping probability distributions over underlying
  ontic states, then under the assumption of preparation independence, this leads
  to contradiction with quantum predictions. Thus any model in which the quantum state
  is purely epistemic and satisfies preparation independence is incompatible with
  QM. But psi-epistemic models can avoid it by rejecting preparation independence
  or by limiting the overlap. QBism indeed rejects the notion of an ontic state space
  / the assumptions. So the statement "PBR rules out psi-epistemic views" is too strong;
  it rules out a broad class but not all. The answer: PBR does not prove the wavefunction
  is ontic simpliciter; it rules out maximally ψ-epistemic models satisfying preparation
  independence. QBism says the theorem doesn''t apply because it rejects the assumptions.
