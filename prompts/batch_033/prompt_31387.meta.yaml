  ---


  I direct a portfolio of software products at a mid-sized firm. Four times a year
  we run stage-gate reviews at which each active project is either continued, paused,
  or killed. The decisions are high-stakes (project budgets run to seven figures),
  they are made by an investment committee of non-specialists, and I have about half
  an hour per project to prepare a recommendation. I keep running into the same argument.
  One camp says the money and months already spent are sunk costs and should count
  for nothing; the other camp says that is naive, because in a dollar auction it can
  be rational to keep bidding once you and a rival have both bid more than the prize,
  since quitting just locks in your loss. I have read enough rationalist material
  to know that both sides are partly right: "ignore sunk costs" is the correct default,
  but the dollar auction shows there are real cases where continuing is rational even
  though the project as a whole will never be worth what has been spent on it.


  Please write me a decision procedure I can actually run at these reviews. It should
  be a checklist or ordered set of questions, with, for each question, what counts
  as a sufficient answer and what the answer implies for the decision. It should distinguish
  a genuine dollar-auction structure (a contest in which quitting concedes something
  to a rival and the next increment can change who wins) from ordinary unilateral
  escalation, and it should say how to handle the grey cases: recoverable value, reputational
  and learning payoffs, and the difference between a bid that improves your position
  and a bid that merely postpones admitting a mistake. It should also say where the
  procedure must stop and hand the decision to a person because the question is one
  of values rather than facts. Then run the procedure on three cases: (1) a project
  that is behind schedule and over budget with a competitor close to shipping a similar
  product; (2) a research prototype that has consumed its budget and needs more money
  to reach a demo, with no competitor in sight; and (3) a project that is technically
  healthy but whose business case has collapsed because a key customer left. Make
  sure at least one of these comes out with an answer my committee will dislike. Finally,
  tell me what the procedure cannot do — the failure modes it is blind to. Please
  write in British English. Your final line should be a one-sentence summary of the
  procedure, beginning ''Summary:''.


