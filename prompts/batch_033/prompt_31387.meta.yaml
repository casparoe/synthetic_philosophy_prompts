  Dollar auction details: Martin Shubik''s dollar auction: an auctioneer offers a
  dollar to the highest bidder; second-highest bidder must also pay their bid but
  gets nothing. Rational bidders escalate: once you''ve bid 95p and the other bids
  £1.00, if you stop you lose 95p; if you bid £1.05 you lose only 5p if you win (pay
  £1.05 for £1) versus losing 95p. So continuing is locally rational, but the pair
  ends up paying far more than the prize. The trap: both can see it, but each escalation
  is rational given the other''s last bid. The lesson: don''t enter, or precommit
  to a cap, or change the game (collude/split). There''s also the escalation of commitment
  literature (Staw): sunk costs, self-justification, project-level determinants. The
  rationalist angle: "escalation of commitment" is often taught as a cognitive bias,
  but the dollar auction shows that some escalation is rational at the margin; the
  real issue is whether you''re in a genuine auction-like contest or merely rationalising.


