  The contingency argument (e.g., Aquinas''s third way, Leibniz, or a simplified version):

  1. Things exist that are contingent (they exist but could have failed to exist;
  they come into and go out of existence).

  2. A contingent thing doesn''t have its existence of itself; its existence is not
  self-explanatory.

  3. If something contingent exists, there must be a sufficient reason/cause for its
  existence, in something else.

  4. This chain of explanations can''t go on infinitely (or an infinite regress leaves
  the whole unexplained).

  5. Therefore there must be a necessary being — something that exists of its own
  nature and cannot fail to exist — which explains the contingent ones.


