  Let me think about the "impact measures and low-impact AI" domain in depth so I
  can write a good prompt.


  The core issue: We want an AI agent to achieve goals without causing large side
  effects on the rest of the world. The naive notion of "side effect" seems to presuppose
  some notion of what the agent is supposed to be doing (its intended task) versus
  everything else, and what counts as bad/undesirable change, which seems to require
  a specification of value. Can we define "avoid side effects" or measure impact without
  a full utility function over all possible states? This connects to:


  - Turner et al.''s "Conservative Agency via Attainable Utility Preservation" (AUP):
  an agent penalizes decreases in its ability to achieve a set of auxiliary objectives.
  The auxiliary objectives are a "neutral" set of value functions, not the agent''s
  actual goal. So we don''t need full value specification, just a broad distribution
  over objectives. AUP preserves the ability to pursue many goals.

  - The "relative reachability" measure (Krakovna et al.): impact measured by comparing
  reachability of future states from the current state vs. from a baseline state.
  This uses a distance metric over states, not full value.

  - The formal problem: any impact measure will have counterexamples; there are impossibility/limitation
  results? There''s work showing that low-impact agents are incentivized to "gerrymander"
  or manipulate the impact measure. Also the problem of "side effects" vs. intended
  effects: without a distinction between intended and unintended, you can''t isolate
  side effects. AUP uses the difference between preserving auxiliary objectives while
  achieving the main objective.

  - The philosophical point: the concept of "side effect" is interest-relative or
  specification-relative. In action theory, there''s the doctrine of double effect,
  and the notion of intended vs. foreseen consequences. Low-impact measures try to
  avoid needing a full specification of what matters by using a prior over possible
  values, but this smuggles in a notion of "normalcy" or a baseline.

  - There''s also the "whipless impact" / "impact measure" critique: penalizing all
  change prevents the agent from doing anything; penalizing only "big" changes requires
  a similarity metric, which encodes normative assumptions.

  - "Avoid side effects" as a specification: Could define impact as deviation from
  what would have happened had the agent not acted (counterfactual baseline), but
  the baseline itself depends on modeling, and there''s the "baseline selection" problem.


