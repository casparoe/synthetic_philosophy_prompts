  Draft:


  ---


  I''m a PhD student in political philosophy, and I got cornered into refereeing an
  argument between two friends in my cohort, Maya and Eli, and I honestly could not
  sort it out. I''d like you to act as a philosopher who works on the ethics of markets
  and commodification, think through each move carefully, and give a point-by-point
  verdict rather than a global one.


  The argument was about legalizing kidney sales. It went roughly like this:


  (1) Maya said it should stay illegal because it would exploit the poor: people in
  desperate financial straits would "choose" to sell a kidney, but the desperation
  is doing the choosing.


  (2) Eli said the status quo is worse for those same people. The waiting list kills
  people, and banning sales removes one of the few options a poor person has. If the
  worry is unequal bargaining power, he said, then lots of jobs the poor take are
  exploitative in exactly that sense — mining, factory work, enlisting — and we don''t
  ban those. So either Maya is being inconsistent, or "exploitation" is doing work
  she hasn''t spelled out.


  (3) Maya replied that a kidney is different because it''s part of your body. There
  are some things a person shouldn''t be able to alienate even voluntarily, she said,
  because selling them changes what the body is — it turns the body into a stock of
  parts. The wrong isn''t just bad terms; it''s a change in the meaning of the thing.


  (4) Eli said that''s just repugnance wearing an argument''s clothes. People said
  similar things about blood plasma, surrogacy, even life insurance, and the repugnance
  faded. Every market changes the meaning of what it touches — paying for childcare
  changes what it means to watch a neighbor''s kid — so "it changes the meaning" can''t
  by itself be a reason to ban a market. You''d need a non-circular account of which
  meanings matter and why.


  (5) Maya said the account isn''t circular: pricing a kidney crowds out donation
  and changes the norms of medicine, and that''s an identifiable social mechanism,
  not a feeling. A kidney market would make giving an organ look like a lost sale,
  and a body look like a parts inventory. That change in norms is a real cost, even
  if it''s not the kind of cost that shows up in a price.


  (6) Eli said the crowding-out point cuts the other way here: donation is already
  failing, which is why there''s a shortage. If the non-market practice can''t supply
  the good, then the market isn''t corrupting a healthy practice — it''s supplementing
  a failing one. So the expressive cost, if it exists, has to be weighed against the
  actual lives saved, and Maya still hasn''t shown it''s the kind of thing that should
  override those lives.


