  Let me draft. Domain: Gibbard–Satterthwaite theorem and strategy-proofness.


  The theorem: Any deterministic voting rule (social choice function) that is strategy-proof
  (truthful voting is a dominant strategy), onto/non-imposed (any alternative can
  win under some profile), and defined for at least three alternatives is dictatorial.
  Essentially: every non-dictatorial, onto voting rule with 3+ candidates is manipulable.
  Strategy-proof = sincere voting is always a weakly dominant strategy; no voter can
  get a better outcome by misreporting.


  Common subtle errors:

  - Saying Gibbard-Satterthwaite says "every voting system is manipulable" without
  qualification; actually only those satisfying certain minimal conditions (unrestricted
  domain, onto, 3+ candidates). For two candidates, majority rule is strategy-proof
  and non-dictatorial. Also randomized rules? The theorem is for deterministic social
  choice functions. Also "manipulable" in the sense of strategic voting possible in
  some profile; doesn''t mean every election can be manipulated, or that manipulation
  is always easy/effective.

  - Conflating with Arrow''s theorem: Arrow is about social welfare functions and
  IIA/Pareto/transitivity leading to dictatorship; Gibbard-Satterthwaite is about
  strategy-proof social choice functions. Related but distinct. Some summaries say
  "Arrow proved it" or "the voting version of Arrow''s theorem" — that''s okay as
  it is related.

  - Conflating "dictatorial" with "one voter determines every outcome regardless of
  others" — actually dictatorial means the rule always selects the dictator''s top
  choice, so the dictator''s top-ranked alternative wins irrespective of others''
  ballots.

  - Saying "therefore all real elections are meaningless" or "voting is pointless"
  — a conclusion that doesn''t follow, since real systems aren''t strategy-proof anyway,
  and manipulability doesn''t imply every result is manipulated; also institutions
  can design rules to make manipulation hard or costly.


