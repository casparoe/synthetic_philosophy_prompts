  Draft:


  "I am a software engineer with no formal training in philosophy, and I want a case
  analysis, not a summary. In November 2018, the Chinese researcher He Jiankui announced
  that he had used CRISPR–Cas9 to edit the CCR5 gene in human embryos, with the stated
  aim of conferring resistance to HIV; twin girls with the edited genomes were born.
  The announcement was met with near-universal condemnation from the scientific community,
  and the episode is widely treated as a cautionary tale about a rogue actor.


  I want you to analyze this episode through the lens of the unilateralist''s curse.
  As I understand the curse: when many agents are each able, on their own, to take
  an action that imposes an outcome on everyone, and each agent decides using only
  her own noisy estimate of whether the action is good, the group as a whole will
  act whenever the most optimistic agent acts. This can produce outcomes that most
  agents, and the group''s average judgment, would have rejected. The proposed remedy
  is usually something like a principle of conformity: in such situations an agent
  should defer to the group''s estimate unless she has special reason to think her
  own judgment is better.


  Please give me a disciplined mapping of the episode onto that model, and then an
  honest account of where the model fails. In particular:


  1. Identify the relevant actors who could have ''acted unilaterally'' to move the
  world toward heritable human genome editing — not only He himself but other researchers,
  labs, funders, regulators, journals, and institutions. For each, what were their
  actual options, what information did they have, and what would have counted as ''the
  action''?


  2. State the unilateralist''s curse precisely as a mechanism, and say which of its
  preconditions held in this case and which did not. For example, were the actors''
  estimates independent? Was the harmful outcome truly the product of a single unilateral
  act, or did it require an IVF pipeline, collaborators, funders, and an institution?
  Does the fact that the act had to be announced to have its world-changing effect
  change the analysis?


  3. Apply the principle of conformity to the episode. Who, by that principle''s lights,
  should have deferred to the group''s judgment and did not? Who was actually better
  placed than the group to judge? Does the principle give the right verdicts here,
  or does it misidentify where the failure occurred?


  4. Identify what the curse cannot explain: He''s motives, the incentive structure
