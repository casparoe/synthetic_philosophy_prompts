  Potential desiderata list for a theory of rational choice in predictor scenarios:

  1. Recover expected utility maximization in ordinary (no predictor) cases — non-negotiable.

  2. Not be exploitable / not be money-pumpable by a predictor who knows your decision
  procedure (XOR blackmail) — non-negotiable.

  3. Make the decision you would have bound yourself to make before observing the
  predictor''s move, where precommitment is possible (counterfactual mugging: precommit
  to pay) — arguable non-negotiable? This is "updatelessness" or "temporal consistency
  with precommitment."

  4. Respect dominance when actions are causally independent of outcomes (Newcomb?
  Actually dominance reasoning gives two-boxing in Newcomb; but one-boxers reject
  dominance because states are not independent. So "respect causal dominance" is camp-specific.)

  5. Distinguish correlation from causation (EDT''s failure in XOR blackmail and Smoking
  lesion) — non-negotiable for many.

  6. Evaluate policies/subjunctive dependencies rather than just acts (FDT) — the
  crux.

  7. Handle both "all-upside" and "mixed-upside" updatelessness (counterfactual mugging
  is mixed-upside: benefits go to other branches/selves).

  8. Be dynamically consistent — no need to self-modify or precommit to be rational?
  (Or allow that rational agents will want to precommit, and the theory should recommend
  the precommitted action even without precommitment.)

  9. Treat indistinguishable decision situations alike / no dependence on irrelevant
  features.

  10. Account for logical uncertainty (logical counterfactual mugging — Omega uses
  digit of pi) — maybe camp-specific or non-negotiable?

  11. Prescribe in Death in Damascus (where CDT and EDT both fail) — maybe.


