  Ian Hacking, "Making Up People" (1986, reprinted in Historical Ontology, 2002).
  Key ideas:

  - "Making up people": the idea that people come to fit categories, and new categories
  make new kinds of people possible. He gives examples like multiple personality disorder,
  perversion, etc.

  - Dynamic nominalism: "a kind of person comes into being at the same time as the
  kind itself is invented" — the classification and the classified emerge together.

  - The looping effect: people classified in a certain way are aware of being so classified
