  leads to new classifications, and so on. The "looping effect of human kinds": classifying
  changes the people classified, who then no longer fit the classification, so the
  classification is revised, which changes people again.

  - Human kinds vs natural kinds: electrons don''t respond to being classified as
  electrons; people do. So human sciences are fundamentally different from natural
  sciences.

