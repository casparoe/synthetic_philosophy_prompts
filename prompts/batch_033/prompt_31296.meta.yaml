  The multiple realizability debate: Putnam''s argument that mental states (like pain)
  can be realized by different physical states in different species (or creatures),
  so mental state types cannot be identified with physical state types. This supports
  functionalism: mental states are functional kinds, defined by their causal roles.
  But the debate has been extensive. Key issues:

  - What exactly does multiple realizability show? If it''s just cross-species or
  across actual creatures, maybe type identity could be species-specific or restricted.
  If it''s "in principle" multiple realizability across possible worlds or weird physical
  realizers (silicon, aliens, ectoplasm?), then it''s a modal claim, and some argue
  it''s too cheap.

  - The "neuroscience objection": Bechtel & Mundale? They argue that the level of
  grain matters; if you describe physical states at the same grain as psychological
  states, there may be one-to-one mapping. Multiple realizability might be an artifact
  of comparing coarse psychological kinds with fine-grained physical kinds.

  - Shapiro''s arguments: he distinguishes "multiple realizability" from "unrestricted
  realizability" and argues the former is compatible with identity or at least doesn''t
  establish what functionalists want. Also Shapiro''s book "The Mind Incarnate" argues
  multiple realizability is empirically implausible.

  - Polger and Shapiro: "The Multiple Realization Book" (2016) — argue the empirical
  evidence doesn''t support multiple realization; what''s needed is a specific account
  of what "realization" means. They propose an account where a kind is multiply realized
  only if different realizers produce the same function and the differences are not
  merely variation in detail. They conclude MR is far less common than assumed.

  - Bickle''s "ruthless reductionism" and molecular-level neuroscience.

  - Aizawa and Gillett''s "multiple realization as the key to scientific taxonomy"
  defense: MR is widespread in science (convergent evolution, etc.) and is the norm
  for scientific kinds, not a problem.

  - The issue: is the disagreement about the metaphysics (what realization is), about
  the empirical facts (whether there are actual cases of MR), or about the dialectical
  role (whether MR is needed to argue for functionalism)? Some think the debate has
  stalled because "realization" is used in many senses, and because the examples (pain
  in octopus/human) are contested.


