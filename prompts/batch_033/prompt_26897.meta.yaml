  Need be careful: Good''s theorem specifics. Let me recall accurately. Good (1967)
  "On the Principle of Total Evidence" - theorem: In any decision problem, the expected
  value of new information is nonnegative if certain assumptions hold: the decision-maker
  maximizes expected utility, updates by conditionalization, and the cost of information
  is zero. More generally, "Good''s theorem" states that a rational agent should always
  accept free information; expected utility of deciding after observing costless information
  is at least that of deciding without it. It requires that the agent''s prior is
  well-defined and that the act of observing doesn''t change the world''s payoffs.
  There are caveats: if the information itself has causal effects (e.g., becoming
  aware changes utilities), if the agent''s choices can influence what is learned,
  if the agent is not an expected-utility maximizer, if there are computational constraints/limited
  attention, if information is costly, if preferences are non-consequentialist, etc.
  Also in a group decision setting with conflicting incentives, the theorem may fail
  because the "decision-maker" isn''t a unified expected-utility maximizer; information
  can harm an individual player strategically (e.g., information can change others''
  beliefs or the equilibrium). Actually in game settings, more information can hurt
  a player (e.g., in zero-sum games? Information can be disadvantageous if it affects
  opponent''s beliefs? In single-person decision problems, Good''s theorem holds;
  in games, not necessarily.)


  Good''s theorem: if X is a signal, the expected utility of an optimal decision after
  observing X is at least that before, because you could always ignore X and choose
  the prior optimal act. But if "observing X" changes the set of acts or payoffs,
  the theorem may fail. Also if the agent''s posterior updating is not Bayesian, could
  fail.


