  Davidson''s radical interpretation: key ideas:

  - Radical interpretation: interpreting a speaker from scratch (no prior knowledge
  of their language), based on their behavior and attitudes toward sentences.

  - Davidson''s project: a theory of meaning for a language that a radical interpreter
  could confirm; truth-conditional semantics (Tarski-style truth theory).

  - Principle of charity: interpret so as to maximize agreement/truth, rationality.
  Davidson argues charity is constitutive of interpretation, not merely a heuristic;
  without it, no interpretation is possible. He inverts the usual order: agreement
  comes first, then meaning.

  - Relation to Quine''s radical translation: Quine''s translator uses translation
  manual, stimulus meaning, indeterminacy of translation; charity/principle of charity
  in Quine is a pragmatic maxim. Davidson extends to interpretation (not just translation)
  and to propositional attitudes; charity becomes constitutive, and Davidson rejects
  the scheme/content dualism (third dogma).

  - In-the-weeds question: Why does Davidson think the principle of charity is not
  optional? What does it mean to say an interpreter "cannot be wrong about most beliefs"
  of the interpreted? How does triangulation fit in?


