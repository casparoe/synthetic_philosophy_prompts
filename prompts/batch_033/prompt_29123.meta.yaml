  The classic objections:

  1. "Illusion to whom?" — illusion needs a subject to be fooled; so illusionism presupposes
  a conscious subject.

  2. Self-refutation / Moorean: illusionism is less plausible than the existence of
  experience.

  3. The "hard problem" remains: explaining why there seems to be phenomenality if
  there isn''t.

  4. Illusionism confuses representation with reality: from "we have no direct access"
  to "there''s nothing there."

  5. If phenomenal properties are the only properties we know directly, denying them
  undercuts all evidence.

  6. The "phenomenal concepts" objection: our phenomenal concepts are grounded in
  the very properties; illusionism can''t account for concept acquisition.

  7. Epistemic gap: illusionism must explain why the illusion is so systematic and
  unshakeable (unlike ordinary illusions like Müller-Lyer, which persist but can be
  known).

  8. "What it''s like" is the data, not the theory; illusionism denies the data.


