  ---


  I''m an undergraduate in a distributive justice seminar, and we''ve been reading
  the luck egalitarian literature — Dworkin, Arneson, Cohen, Anderson, and the rest
  — but I find that when I try to sort out what I actually think, I keep drifting
  away from the labels. I''d like to report my verdicts on some cases and ask what
  principle, if any, captures them. Here are the cases as they strike me, not as I
  think I''m supposed to judge them. Two people begin with equal resources and equal
  abilities; one works long hours and saves, the other declines work and spends down
  what they have; the resulting inequality does not strike me as something society
  must correct. A person born with a serious congenital condition that requires expensive
  lifelong care strikes me as entitled to that care as a matter of justice. A child
  born into a poor family, with no choice in the matter, strikes me the same way.
  Two equally prudent people in identical jobs: one is struck by a rare disease and
  can no longer work; I think the unlucky one should be compensated. But now take
  a person who freely chooses a dangerous, well-paid job — say, offshore welding —
  and is later injured on the job: I want to say he chose the risk, so he has less
  claim to full income support than the rare-disease case, yet I cannot bring myself
  to say he should receive only minimal medical care; the injury itself still feels
  like something we owe him treatment for. A person who gambles away their savings
  also seems to me to have chosen their losses, and I don''t think society owes them
  a restoration to their former position, but I also don''t think they should be left
  destitute. A person who deliberately cultivates expensive tastes — a fine-wine palate,
  say — and then claims they need extra resources to be equally well off gets no sympathy
  from me. But a person who develops clinical depression and cannot work feels completely
  different: I want to treat the depression like the congenital condition, not like
  the expensive taste, though I''m not sure I can say what makes the two cases different
  in a principled way. And the case that most unsettles me: someone born with exceptional
  natural talent earns far more than someone born with no such talent who works just
  as hard. Part of me says the talent is pure luck and the gap is unfair; another
  part says the talented person''s effort and choices are still theirs, and I don''t
  think I want to equalize the whole gap.


  The seminar keeps suggesting a principle something like: disadvantage that is unchosen
  is the concern of justice, while disadvantage that is chosen is not. But my verdicts
  don''t line up cleanly with that, and I want to know whether there is a more precise
  principle — or a small set of candidate principles — that does. Please state it
