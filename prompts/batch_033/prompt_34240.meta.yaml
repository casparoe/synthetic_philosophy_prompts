  Background:


  - Mises (1920): In a socialist economy, if the means of production are collectively
  owned, there is no market for them; hence no money prices for capital goods. Without
  prices, rational economic calculation (comparing costs and benefits of alternative
  uses of capital goods) is impossible. You can have calculation in kind (engineering,
  physical quantities), but you cannot compare heterogeneous goods to determine the
  economically rational allocation. Mises: "Where there is no free market, there is
  no pricing mechanism; without a pricing mechanism, there is no economic calculation."
  I must not quote exactly. I can paraphrase.


  - Hayek extended: The problem isn''t just computation; it''s knowledge. The data
  needed for planning are not "given" to a single mind; they exist dispersed among
  millions of individuals as local, tacit, often unarticulated knowledge of time and
  place. Markets generate prices that convey dispersed information in a compressed
  form; no central planner can gather it all. Hayek''s 1945 "The Use of Knowledge
  in Society."


  - Lange (1936–37): Market socialism. Keep consumer goods and labor markets free.
  For capital goods and producer goods, a Central Planning Board (CPB) sets prices
  by trial and error. Managers are instructed to follow two rules: (1) minimize average
  cost (combine factors so marginal product per dollar is equalized), and (2) produce
  output at the level where price equals marginal cost. If there''s excess demand
  for a good, the Board raises its price; if excess supply, lower it. Lange argued
  this tâtonnement converges to equilibrium prices just as in a competitive market
  — actually, he claimed it could be better, because the Board sets prices as a Walrasian
  auctioneer would, and with parametric prices. Lange argued the CPB doesn''t need
  to solve millions of equations; it just watches inventories and adjusts prices —
  exactly what the market does. He responded to Mises by saying Mises conflated prices
  in the narrow sense (exchange ratios on actual markets) with prices in the wider
  sense (terms on which alternatives are offered); socialism only needs the latter,
  and the Board''s accounting prices provide them. So Mises''s challenge fails.


  - Hayek''s rebuttal (1940 essay "Socialist Calculation: The Competitive ''Solution''"):
  Lange''s solution assumes the central board already has all the knowledge that,
  in a market, is produced by the competitive process. The trial-and-error method
  works only where the relevant facts are known, stable, and can be centrally observed;
  it assumes "given" data. In reality the crucial knowledge is dispersed, tacit, and
  changes constantly; the Board would have to discover the alternatives, the costs,
  and the production functions — and the prices set centrally would not generate the
  discovery process. Also, real competition is about discovering new products and
  methods, not just adjusting to given data. Hayek: the "competitive solution" is
  not a solution because it assumes away the problem of knowledge.


  - Also the incentive/manager problem: under socialism, managers don''t bear the
  consequences; but Lange tried to address via rules. Hayek also noted absence of
  real entrepreneurship.


