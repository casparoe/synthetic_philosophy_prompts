  Does Miller''s play, with its portrayal of Salem and its invitation to condemn the
  trials, vindicate Rousseau''s worry that moral outrage in the theater is cheap and
  self-congratulatory, or does the play show a way drama can do genuine moral work
  after all? I want a reading that takes both Rousseau''s argument and the play seriously,
  and that is willing to say where each gets the other wrong. What would the play
  add to Rousseau''s philosophical argument that the argument alone doesn''t capture?"


