  reinforces the audience''s existing passions; the pity and indignation it arouses
  are felt instead of acted on; and whatever moral examples it stages are undermined
  by the fact that the audience is there to be entertained. I''d like to use The Crucible
  as a test case. Read the play through Rousseau''s critique of theater: which scenes
