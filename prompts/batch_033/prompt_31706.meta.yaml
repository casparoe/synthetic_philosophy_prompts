  For Hume''s "Of Suicide":


  What Hume actually argues:

  - Against the claim that suicide is a transgression of our duty to God, to our neighbor,
  and to ourselves.

  - Duty to God: If all events in the universe are governed by God''s general laws
  and providence, then human actions are no less God''s work than natural events.
  My life is subject to God''s governance whether I die by disease or by my own hand.
  If suicide were a transgression of duty to God, it would have to be a case where
  I disturb the order of providence — but that''s impossible on the assumption of
  general providence. Also, if my life is a gift/trust from God, returning it when
  it becomes a burden is not a crime; a gift is not a prison.

  - Duty to neighbor: Society does not have an unconditional claim on my life. I owe
  society benefits when it can receive them; if I am a burden or can no longer benefit
  society, withdrawing may be beneficial or at least harmless. Even when my death
  deprives society of benefits, I''m not obliged to do a small good at a great cost
  to myself. Hume grants cases where suicide might harm society (e.g., someone who
  has obligations) and says he should wait.

  - Duty to self: Suicide can be imprudent when age, infirmity, etc., but that''s
  a matter of prudence, not of crime/moral transgression. Sometimes prudence and courage
  recommend it (to avoid misery).

  - Conclusion: suicide is not always criminal; sometimes it may be free from every
  imputation of guilt. He does NOT say it''s always permissible or that it''s a positive
  duty.


