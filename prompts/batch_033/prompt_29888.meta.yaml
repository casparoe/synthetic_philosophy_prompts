  Lottery paradox: Suppose threshold view: believe p iff P(p) > θ. Each ticket has
  probability (n-1)/n of losing > θ. Closure under conjunction says believe the conjunction
  of all tickets losing. But the conjunction has probability 0 (or 1/n of winning?
  Actually if exactly one winner, probability that all lose is 0). So you''d believe
  a proposition with probability 0, and contradict "some ticket wins" which you believe
  with probability 1. Contradiction.


  Preface paradox: Author rationally believes each of n claims (each well-supported),
  and rationally believes at least one is false (based on induction about human fallibility).
  Closure would yield believing the conjunction, contradicting "at least one is false."
  But note here each individual claim may not be high probability in the same way;
  the author''s evidence for each is argument-specific, and the evidence for "some
  false" is statistical/inductive. The tension is with closure and consistency.


