  motivation for tit-for-tat''s success in the iterated PD (Axelrod) is that in a
  population of strategies, nice and retaliatory strategies do well. But in a finitely
  repeated PD, tit-for-tat is not subgame-perfect, and "evolutionary stability" in
  the iterated PD context is about indefinite interactions. So no tension if contexts
  differ. But there''s a subtle issue: the same person might think that in the real
  world, all interactions are finite, so the backward induction logic should apply
  to any real repeated interaction with a known upper bound (e.g., a business relationship
  that will end when someone retires). Yet they also believe cooperation is rational
  in real-world repeated interactions because of uncertain endpoints. This is the
  classic "backward induction vs real-world cooperation" tension. It''s well-known
  though (the chain-store paradox literature). Maybe too standard but still in the
  weeds.


