  Prompt draft (Type A, Reflection):


  "Before I go any further into the literature on how a rational agent should regard
  her own future opinions, I want the specification of what a theory in this area
  has to deliver. Write the desiderata for an account of epistemic self-deference:
  the principle, if any, that says when and how much my present credences should be
  constrained by the credences I expect to have later. The cases any adequate account
  must handle are at least these. An agent who knows she will receive a reliable weather
  report tonight: should her present credence already move toward the value she expects
  tonight''s credence to take, or is it enough that her present credence equals the
  expectation of tonight''s credence, and why? An agent who knows she will be severely
  sleep-deprived, drunk, or demented later: presumably she should not defer to that
  later self even though that self will have strictly more information, but what exactly
  breaks the deference? An agent who knows she will forget a decisive argument: no
  deference, or deference in attenuated form? An agent who learns from a reliable
  oracle that her future self will assign high credence to a proposition, without
  learning the future self''s reasons: is that evidence for the proposition now, and
  does it matter whether the future self is expected to be more competent? An agent
  undergoing a self-locating shift, as in Sleeping Beauty, who will change her credence
  in a coin''s outcome without gaining or losing any worldly evidence: must she defer
  across that shift? And the Ulysses case: an agent binds herself against a future
  self she predicts will be irrational; the theory must explain how that binding is
  rational, and what it does to the idea that later selves are automatically authoritative
  for earlier ones.


  For each case, say what an adequate account must get right and why it is a requirement.
  Then list the distinctions the account cannot collapse. I particularly want to see:
  deferring to a future self vs. deferring to an independent expert; treating the
  proposition that I will believe P as evidence for P vs. simply adopting P; and the
  separate dimensions of informativeness and reliability, since a future self can
  be better informed but less reliable, or more reliable but less informed. Also say
  which results from probability theory and formal epistemology the account must be
  consistent with: conditionalization, the martingale property that a conditionalizer''s
  current credence equals her expectation of her future credence, the Principal Principle
  as a benchmark for chance deference, and whatever Dutch-book or Dutch-strategy considerations
  actually establish about self-deference.


  Finally, mark each desideratum as non-negotiable or as a preference of a particular
  camp, and say which of them, if any, are jointly unsatisfiable. I suspect the hardest
  part is this: the unmodified Reflection principle is attractive because it needs
  no separate story about when one''s future self is reliable, but that very feature
  is what makes it overreach in the drunkenness and dementia cases; while any reliability-conditional
  replacement seems to need an independent grip on ''future self worth deferring to''
  that threatens circularity. Tell me whether that suspicion is right, and which single
  desideratum does the most work in ruling out the simple principle."


