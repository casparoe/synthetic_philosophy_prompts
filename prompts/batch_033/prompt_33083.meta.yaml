  7. Evidence about future belief: I learn from a reliable source that in ten years
  I will believe P with high credence, without knowing the reasons. Is that evidence
  for P now? (Van Fraassen''s Reflection would say yes, conditional on future credence.)
  But if I know the future self will be in a cult or brainwashed, no.


  Distinctions it cannot collapse:

  - Deference to a future self vs. deference to an expert: future self has special
  access to my evidence trajectory but may share my biases; the theory must say what,
  if anything, makes self-deference different from trusting an arbitrary forecaster.

  - Taking future credence as evidence vs. adopting it: conditionalizing on the fact
  that future-me has credence r may be different from setting my credence to r; the
  theory must respect this.

  - Reliability vs. information: a future self can be better informed but less reliable
  (drunk) or more reliable but less informed (future-me after some forgetting but
  with better methods). The theory must not collapse these dimensions.

  - Ideal vs. non-ideal agents: the principle might be a requirement of ideal rationality
  only, or might apply to bounded agents. Which?


  Results it must be consistent with:

  - Conditionalization and the martingale property (my current credence equals my
  expectation of my future credence, for a Bayesian).

  - The Principal Principle / chance-credence deference as a benchmark.

  - Dutch book / Dutch strategy arguments: does violating Reflection make one vulnerable?
  The theory should say whether that''s a genuine requirement.

  - Calibration: future selves should be treated as experts only if they are expected
  to be calibrated/reliable.


  Non-negotiable vs. parochial:

  - Non-negotiable: the theory must not demand deference to a future self known to
  be irrational or information-destroyed; must respect conditionalization; must distinguish
  evidence from adoption.

  - Parochial: the original Reflection principle as a universal rational requirement;
  the "future self as expert" assumption; maybe the requirement that violations be
  Dutch-bookable (some camps care, some don''t).


  Joint unsatisfiability:

  - There''s a known tension: a universal reflection principle (always defer to future
  self) conflicts with cases of anticipated irrationality; a reliability-conditional
  principle needs a prior notion of when future self is reliable, which risks circularity
  or reintroducing a full theory of rationality. Also, the martingale property already
  delivers something weaker (expectation), and the stronger conditional constraint
  may conflict with self-locating shifts. The prompt can ask: which subset is jointly
  unsatisfiable, and does the "right" theory end up being just conditionalization
  plus a calibration condition, with Reflection as a special case?


