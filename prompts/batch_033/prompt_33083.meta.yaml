  5. Self-locating cases: Sleeping Beauty-ish? On Tuesday, Beauty''s credence in Heads
  differs from Monday''s due to self-locating information. Does Reflection hold? This
  is a known issue (Hitchcock? Schervish, Seidenfeld, Kadane? Actually "Reflection
  and Sleeping Beauty"?). I can include a case: an agent who knows she will undergo
