  This is also excellent and more in the reflective-equilibrium style. It includes
  a hard-to-reconcile pair: oracle vs. trusted colleague? Actually the pair "colleague
  will have examined study by Friday → defer partly now" vs. "oracle tells me tomorrow
  → don''t move now" is subtly reconcilable: in the colleague case, I expect my future
  credence to reflect the colleague''s conclusion, but my current credence should
  already... hmm. Actually if I know I''ll learn the oracle''s answer tomorrow, my
  current credence should already equal my expectation of tomorrow''s credence, which
  is the same as... if the oracle is perfectly reliable, then tomorrow I''ll know
  with certainty; my current credence in rain equals the probability that the oracle
