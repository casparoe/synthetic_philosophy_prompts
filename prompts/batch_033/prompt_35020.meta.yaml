  Draft:


  "I''ve been working through the question Dennett poses with the careenium and simmballs
  — whether the symbols push the substrate around — and I''ve written down the set
  of commitments I find myself holding, with the aim of checking whether they form
  a stable package. My commitments are these:


  (1) The physical world is causally closed, and every physical event has a sufficient
  physical cause.

  (2) A higher-level pattern, such as a symbol or representation, is real when it
  supports reliable predictions, but its reality does not by itself give it causal
  powers over and above those of its physical realizers.

  (3) The best explanation of why a chess-playing system moves a piece is that it
  represented a threat to its queen and aimed to escape it; this is an ineliminable
  explanatory level, not just a convenient redescription.

  (4) If the same behavior and same microphysical history were present but the semantic
  pattern were absent, the system would not behave differently in any physically detectable
  way — which I take to show that the symbols do not add causal force.

  (5) I reject epiphenomenalism about the intentional level: the contents of representations
  make a difference to what the system does, and a purely microphysical story would
  miss the difference that matters.

  (6) Evolution or training can arrange the substrate so that microphysical pushes
  track macro-level regularities, which is why the symbols seem to do the pushing.


  I would like an audit: which pairs are genuinely in tension, which only appear to
  be, and which single revision would do the most to restore coherence? Please rank
  the tensions by severity, and for each say which commitment would have to give and
  what the cost would be."


