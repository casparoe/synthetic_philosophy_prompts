  Interventionism (Woodward): X causes Y iff there is a possible intervention I on
  X (with respect to Y) such that changing X changes Y (or its probability distribution)
  when other variables are held fixed at some value. Interventions are defined in
  terms of a causal model: I must be an exogenous cause of X that overrides other
  causes and affects Y only through X (or variables causally downstream of X). Thus
  "cause" is defined relative to a set of variables and a model.


  Counterfactual theory (Lewis): X causes Y iff if X hadn''t occurred, Y wouldn''t
  have occurred (with chancy extension), in close worlds. But interventionism uses
  counterfactuals too: an intervention is a cause of X, defined by counterfactual
  conditions. So interventionism is a species of counterfactual approach; the difference
  is the use of interventions and invariance rather than Lewisian similarity.


