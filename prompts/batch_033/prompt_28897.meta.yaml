  Here''s an argument my friend made that I can''t shake. It starts from something
  most people accept — that we should punish attempted murder less than completed
  murder — and ends somewhere absurd.


  (1) Suppose two people each fire a gun at someone''s head with identical murderous
  intent. One bullet hits and kills; the other is deflected by a freak gust of wind.
  The only difference between them is luck.


  (2) If the only difference between two cases is luck, then the two agents are equally
  deserving of blame and punishment. (Call this the "luck-neutrality" principle.)


  (3) So the successful murderer and the merely attempted murderer are equally deserving
  of punishment.


  (4) But our legal system punishes them differently — and nearly everyone thinks
  this is correct. So if (2) is true, our practices are unjust.


  (5) Now apply (2) not just to resultant luck but to circumstantial luck. Suppose
  two people have identical dispositions, but one grows up in a stable home and never
  faces severe temptation, while the other grows up in deprivation and faces constant
  temptation. The second commits a crime; the first doesn''t. The only difference
  between them is circumstantial luck.


  (6) By (2), they are equally deserving of blame. So the second person does not deserve
  more blame than the first — which means the second person does not deserve blame
  at all, since the first person did nothing.


  (7) Now apply (2) to constitutive luck. Your character — your dispositions to kindness
  or cruelty, your impulsiveness or patience — is the product of genetics and early
  environment, neither of which you chose. The only difference between you and a more
  virtuous person is constitutive luck.


  (8) By (2), you and the more virtuous person are equally deserving of praise or
  blame for your characters. So you do not deserve blame for having the character
  that produced your action.


  (9) If you do not deserve blame for your character, and your action flowed from
  your character, then you do not deserve blame for your action either.


  (10) So no one ever deserves blame or punishment for anything.


  (11) But that conclusion is false. Some people do deserve blame.


