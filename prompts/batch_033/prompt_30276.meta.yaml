  Prompt:


  "At my decision-theory reading group last week, we worked through the Pasadena game.
  A fair coin is tossed until heads appears; if heads first appears on the nth toss,
  the payoff is \((-1)^{n+1} 2^n / n\) dollars (i.e., +2, -2, +8/3, -4, and so on).
  The usual equally-likely-state sum is \(1 - 1/2 + 1/3 - 1/4 + \dots\), which converges
  conditionally to \(\ln 2\), but by rearranging terms it can be made to converge
  to any real number or diverge. Since there is no privileged ordering of the possible
