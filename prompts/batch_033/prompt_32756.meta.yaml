  Let me design the content in the weeds:


  Knowledge norm of assertion (KNA): assertion is governed by the norm that one should
  assert p only if one knows p. Main rivals:

  - Truth norm: assert p only if p is true.

  - Belief norm: assert p only if you believe p.

  - Reasonable belief norm: assert p only if reasonably believed.

  - Justified belief norm.

  - No epistemic norm; assertion governed by moral/conversational norms.


  Objections to KNA:

  1. Lottery propositions: You don''t know "my ticket lost" but it seems fine to assert
  it (or at least fine in some contexts). KNA defenders respond: it''s not fine; or
  context-sensitive; or you can properly assert something weaker like "it is very
  likely that..."

  2. Selfless assertion: cases where you assert p against your evidence because p
  is comforting/beneficial to hearer, e.g., a doctor? Wait, selfless assertion usually:
  asserting p when you don''t believe p (or know p) for the sake of others. Lacquered?
  Jennifer Lackey''s "selfless assertions": a creationist teacher asserts evolutionary
  theory to students despite not believing/knowing it, but it seems proper. Defenders
  might say it''s proper but not as assertion? Or the norm is evidential not knowledge?
  Actually Lackey uses selfless assertion against KNA and belief norm, arguing for
  a reasonable-belief norm.

  3. Moorean assertions: "p but I don''t know that p" is unassertable; KNA explains
  via knowledge. But other norms explain too.

  4. Knowledge norm''s explanatory power: Moore''s paradox, lottery paradox, testimonial
  knowledge transmission, etc.

  5. Is the norm constitutive of assertion or merely regulative? Need to press: what
  kind of norm is it? If merely a convention, why can''t communities change it?

  6. Counterexamples involving conversational implicature? "This is a zebra" in fake
  barn? Hmm.

  7. Irrelevant/trivial truths: KNA permits asserting any known truth, even irrelevant;
  but assertion has conversational relevance constraints; how do epistemic norms interact
  with Grice''s relevance maxim?

  8. Degrees of justification: KNA says high probability without knowledge isn''t
  enough; but in practical contexts we assert what''s highly probable (e.g., a doctor
  "You don''t have disease X" based on a test that''s 99% reliable — maybe they don''t
  know but it seems fine to assert? Actually doctor might know? Depends). Press on
  whether high stakes affect knowledge or the norm.

  9. The role of knowledge in explaining the speech act: Is the knowledge rule the
  only norm, or are there multiple norms (e.g., knowledge plus sincerity)? If assertion
  is governed by both knowledge and truth, redundancy?

  10. Metanormative: how would we test the norm empirically? Data from retraction:
  people retract "I knew p" etc. Turri''s experiments.


