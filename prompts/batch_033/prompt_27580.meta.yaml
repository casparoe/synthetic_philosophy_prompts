  I am a philosopher of action and moral responsibility, and I want to test a suspicion
  about the debate over Frankfurt cases and the Principle of Alternative Possibilities.
  The suspicion is this: when the debate is restated in the vocabulary of control
  engineering, its causal and modal structure becomes precise, but its normative core
  — the concept of moral responsibility itself — may fail to translate, and the exercise
  may reveal that the philosophical dispute has been fusing two questions that engineering
  keeps distinct.


  Assume I can follow control-theoretic vocabulary at the level of a well-informed
  outsider rather than a practitioner: I know what state variables, outputs, sensors,
  actuators, controllers, setpoints, feedback loops, feedforward control, disturbances,
  observability, controllability, reachable sets, overrides, dead man''s switches,
  watchdog timers, and supervisory control are, and I can read a simple block diagram.
  Do not assume I know recent technical results or specialized notation.


  Please do two things.


  First, restate the following elements of the philosophical debate in that vocabulary,
  one at a time, as faithfully as possible:

  1. The Principle of Alternative Possibilities, understood as the claim that an agent
  is morally responsible for what she did only if she could have done otherwise.

  2. A standard Frankfurt-style case: an intervener stands ready to make an agent
  decide and act in a certain way if the agent shows some prior sign that she is about
  to do otherwise; the agent goes ahead and decides on her own; the intervener never
  acts; and the philosopher''s claim is that the agent is still morally responsible
  even though, because of the intervener''s setup, she could not have done otherwise.

  3. The distinction between the actual sequence — what actually happened — and the
  alternative or counterfactual sequences that the agent''s capacities would have
  made available.

  4. The ''flicker of freedom'' reply, which concedes that the agent could not have
  done otherwise with respect to the terminal action but insists that she still had
  some alternative possibility — for example, she could have done otherwise with respect
  to the prior sign or initiating event that would have triggered the intervener.

  5. The standard rejoinder that such a flicker is too slight, too involuntary, or
  too remote from the action to be the kind of alternative possibility that could
  ground moral responsibility.

  6. The distinction between leeway incompatibilism, sourcehood incompatibilism, and
  semi-compatibilism: roughly, the views that responsibility requires alternative
  possibilities, that responsibility requires the agent to be the ultimate source
  of her action in a way incompatible with determinism, and that responsibility does
  not require alternative possibilities even if free will does.


  Second, give me a residue report. For each of the six items, say whether it translates
  cleanly, only with distortion, or not at all, and mark the places where you had
  to fudge. In particular, address these questions:

  - Does the notion of ''being morally responsible'' have any counterpart in control
  engineering, or does the translation silently replace a normative property with
  a descriptive or modal one?

  - When the engineering vocabulary distinguishes between the agent''s own dynamics
  and the composed system that includes the supervising intervener, which of the two
  is the right object for the claim ''she could not have done otherwise''? Does the
  philosophical debate have a stable answer to that, or does the translation expose
  an ambiguity the debate has been carrying?

  - Does the question whether the ''sign'' the intervener monitors is itself a voluntary
  act or a mere event correspond to any real engineering distinction — say, between
  an observable output that is under the agent''s control and an internal state variable
  that is not — and does that mapping help or distort?

  - Is there anything in the philosophical debate that has no counterpart in the control-theoretic
  vocabulary at all, and if so, is that because the vocabulary is missing something,
  or because the philosophical claim was less clear than it looked?


  Finally, I would like your overall assessment: is my suspicion right that control
  engineering can express the structure of Frankfurt cases exactly while leaving the
