  so that the same exchange would be fine under fair conditions? (Satz-style)

  3. Is "repugnance" a useful signal that something is wrong, or merely a prejudice
  to be overcome? (Roth vs. critics)

  4. Do markets in some goods violate a requirement of equal standing/dignity or incommensurable
  values? (Anderson-style)

  5. Are there consequentialist reasons (e.g., shortages, black markets) that override
  expressive concerns? (pragmatic)

  6. Is the relevant wrong in the exchange itself (commodification) vs. in the distribution
  (inequality in ability to buy/sell)?


