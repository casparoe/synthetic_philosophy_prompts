  vouches for the false content in his own voice, while the misleader merely invites
  the hearer to form the false belief and so leaves the hearer some share of responsibility.
  A significant minority denies that the distinction carries moral weight, and some
  argue that misleading can be worse precisely because it hides behind deniability
  and makes the victim complicit in the deception.


