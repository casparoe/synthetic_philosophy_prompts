  Origin essentialism (Kripke, Naming and Necessity): The view that an object''s origin
  is essential to it. For a person, you necessarily have the parents you actually
  have; more strongly, you necessarily came from the particular sperm and egg from
  which you actually came. Kripke''s argument: if a person had come from different
  parents, that would be a different person. There''s a modal argument: consider the
  actual world where you came from sperm S and egg E. Could you have come from a different
  sperm S''? Kripke argues no: if S'' had fertilized E, the resulting person would
  not be you, even if they had your name and many of your properties. The intuition:
  origin is a source of identity; a thing couldn''t have had a radically different
  origin. There''s also the necessity of material origin for artifacts (a table couldn''t
  have been made from a completely different block of wood? Actually Kripke says a
  table could have been made from a slightly different block? He says the table could
  have been made from a different block of wood? Let me recall: Kripke in Naming and
  Necessity discusses whether a table could have been made from a different block
  of wood — he suggests it''s not clear; maybe it could have been made from a different
  block, but not from ice. Hmm. He also discusses Queen Elizabeth: could she have
  come from different parents? He says no, she couldn''t have come from different
  parents — the intuition is that if someone had different parents, that would be
  someone else. Then he extends to the sperm and egg: the particular sperm and egg
  from which a person developed are essential to that person.)


