  while red-or-yellow is ambiguous, with a probability somewhere between 1/3 and 1.


  These choices cannot be represented by any single subjective probability assignment
  to black and yellow. Let p be the subjective probability of black and q of yellow,
  with p+q=2/3. Preferring red to black implies p < 1/3. Preferring black-or-yellow
  to red-or-yellow implies q < 1/3. But if p and q are each less than 1/3, they cannot
  sum to 2/3. So the pair of choices violates Savage''s sure-thing principle, and
  more generally shows that subjective expected utility theory is descriptively false.


