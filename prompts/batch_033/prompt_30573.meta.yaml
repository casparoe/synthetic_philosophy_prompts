  Which step to reject and cost: The natural answers:

  - Reject (2): functionalism is too liberal; add constraints (e.g., consciousness
  requires a self-model, attention schema, integrated information, a single "point
  of view," or biological/embodied details). Cost: lose multiple realizability''s
  clean story, or accept that "mind" is graded so markets have proto-minds (not absurd).

  - Reject (3)/(4): the ant colony''s organization is not the same as a market''s;
  differences matter (goal-directedness, homeostasis, unified control of a body, evolutionary
  function). Cost: you need a non-question-begging account of which functional organizations
  count.

  - Reject (5): maybe it''s not absurd — panpsychism/functionalist liberality is acceptable;
  "mind" comes in degrees and a market can have a minimal kind of cognition. Cost:
  counterintuitive commitments.

  - The equivocation could be in "mind": a mind as a full conscious subject vs. a
  mind as an information-processing system. The ant colony might be a cognitive system
  (mind in the broad sense) without being a conscious subject (mind in the narrow
  sense). That''s a subtle flaw: premise (1) uses "mind" in the functional/cognitive
  sense, premise (5) uses "mind" in the phenomenal/subjective sense, and the absurdity
