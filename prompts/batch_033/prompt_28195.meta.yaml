  other to acknowledge it while refusing to reciprocate. They therefore enter a life-and-death
  fight. One of them, realizing that life is a precondition for any recognition at
  all, gives up the struggle and submits; the other, who values recognition more than
  life, becomes the master. The master now receives recognition from the slave, and
  so achieves the freedom and self-certainty he was seeking, while the slave is reduced
  to dependence and thinghood. Hegel does allow that through working for the master
  the slave acquires a certain practical competence, but this is only a subordinate,
  partial form of skill; it does not change the fundamental asymmetry that the master
  is the independent consciousness and the slave the dependent one. The chapter then
