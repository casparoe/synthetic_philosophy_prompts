  Actually there are multiple stances:

  - The standard modern resolution: the paradox dissolves once you see that "M is
  countable" is a statement in the metatheory, while "M satisfies ''there is an uncountable
  set''" is a statement about what M thinks. There is no contradiction. Skolem''s
  relativity is a genuine result: no first-order theory can pin down uncountability
  absolutely. But ordinary mathematical claims are made within the standard model
  (or within ZFC), where "uncountable" has a determinate meaning relative to that
  model. So the argument is valid in showing relativity but the step to "no absolute
  content" may be too strong or just right depending on one''s view of mathematical
  reality (platonism vs. formalism).

  - A platonist can reject the conclusion by saying the countable model is not the
  "intended" model; the sentence "there is an uncountable set" is true in the intended
  universe, and the fact that some nonstandard countable models also satisfy it just
  shows first-order logic can''t capture the intended meaning.


