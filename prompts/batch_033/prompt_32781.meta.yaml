  Let me think about pragmatic encroachment and contextualism. The asker has a friend
  (or professor) with verdicts on knowledge cases involving stakes. We want to distinguish
  among rules:


  - Classic invariantism (moderate): stakes don''t affect knowledge, only evidence/truth/justification.

  - Epistemic contextualism: "knows" is context-sensitive; the standards rise with
  stakes in the attributor''s context.

  - Pragmatic encroachment: stakes affect whether the subject knows (knowledge itself
  is interest-relative).

  - Maybe subject-sensitive invariantism (SSI): knowledge is interest-relative but
  the truth conditions of "knows" don''t vary with attributor context.


  Actually pragmatic encroachment is often equated with SSI. Contextualism vs pragmatic
  encroachment is a nice contrast. Type A: friend''s verdicts on cases where stakes
  differ for subject vs attributor, or third-person ascriptions.


  We need cases where the rules diverge. Key distinction: contextualism says the attributor''s
  stakes/conversational context set the standards; SSI/pragmatic encroachment says
  the subject''s practical situation matters. So construct a case where the subject
  has high stakes but the attributor is in low-stakes context, or vice versa. The
  friend''s earlier verdicts should be consistent with multiple rules.


