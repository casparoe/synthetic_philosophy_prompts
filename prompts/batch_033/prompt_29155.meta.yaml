  The two positions are these:


  (A) The achievement or credit view. On this view, knowledge is more valuable than
  mere true belief because knowledge is an achievement — a true belief that the agent
  gets right because of her own cognitive competence or intellectual virtue. The value
  of knowledge is thus the value of success through ability, which is a distinctive
  kind of value not reducible to the value of the components. (This view is most closely
  associated with the virtue-theoretic tradition in epistemology, and in particular
  with the work of Ernest Sosa''s AAA model and John Greco''s agent-reliabilism.)


  (B) The deflationary or no-distinctive-value view. On this view, the value of knowledge
  is exhaustively explained by the value of its constituent parts — true belief, justification,
  and whatever else is required — and knowledge as such possesses no value over and
  above the sum of the values of those constituents. The apparent extra value of knowledge
  can be explained by the fact that knowledge typically correlates with other epistemic
  goods (understanding, justification, reliability) that are themselves valuable,
  but knowledge is not itself the locus of a distinctive kind of value. (This view
  is most often associated with the work of Jonathan Kvanvig, and draws on a broader
  scepticism about whether epistemic value is additive.)


  Please draft the joint statement that a representative of each camp could sign after
  a good-faith adversarial collaboration. The document should include:


