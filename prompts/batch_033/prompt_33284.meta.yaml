  Milgrom-Stokey no-trade theorem: In an exchange economy, if agents are risk-averse,
  have common priors, and begin from a Pareto-efficient allocation, then no new private
  information can generate trade that is common knowledge to be mutually acceptable.
  The key: if a trade is common knowledge mutually beneficial, the pre-trade allocation
  couldn''t have been efficient. The mechanism: rational agents infer information
  from each other''s willingness to trade ("the market''s no-trade theorem"). A trader''s
  willingness to trade reveals information; if everyone is rational with common priors,
  then the fact that you want to trade is itself information that should make the
  counterparty less willing. This leads to no agreement to disagree (Aumann): if two
  rational Bayesians with common priors have common knowledge of each other''s posterior
  for an event, their posteriors must be equal.


