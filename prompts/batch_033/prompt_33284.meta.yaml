  and that the only reason they traded is that they failed to condition on the counterparty''s
  willingness — the winner''s curse / adverse selection. The activity should make
  them feel the force: "the moment you see someone accept your offer, you should revise
  your estimate; by the time the trade is common knowledge, there''s no surplus left."
