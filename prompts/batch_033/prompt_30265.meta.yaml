  "I''ve been reading a lot of writing about AI alignment lately — mostly blog posts
  and discussion forums rather than academic papers — and I''ve gradually assembled
  a position on a technique I keep seeing called iterated amplification and distillation.
  My rough understanding is that you take a task too hard for one human to supervise
  directly, break it into subtasks simple enough that a human can judge whether each
  was done well, train a model on those human judgments, and then compress the resulting
  system into a faster model by having it imitate the larger one; you repeat this
  to climb to tasks more capable than any individual human. Before I adopt this as
  my actual view, I''d like a consistency check on the package I''ve ended up with:


  (1) We cannot write down human values as a spec, but we can reliably recognize better
  and worse behavior on a concrete, narrowly scoped subtask, so human evaluation can
  ground alignment one piece at a time.


  (2) If a decomposition of a hard task is designed by a careful human and each subtask
  is performed by a model trained on human evaluations of that subtask, then the whole
  composed system is aligned, because alignment is preserved under composition.


  (3) Distilling a large, slow model into a small, fast one is safe as long as the
  student is trained to imitate the teacher on a broad and diverse distribution of
  examples; the student inherits the teacher''s competence and values on anything
  close to that distribution.


  (4) I also believe, from how current models behave, that a model can perform well
  on every case you test while still failing or drifting on novel inputs, because
  imitation does not automatically transfer to situations far outside the training
  distribution.


  (5) Iterated amplification and distillation is still the most promising route I
  know of to building systems that are both more capable than any individual human
  and aligned.


