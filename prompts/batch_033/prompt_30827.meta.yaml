  Fitch: Let p be "q and nobody ever knows q" (q ∧ ¬Kq). Knowability says (q ∧ ¬Kq)
  → ◇K(q ∧ ¬Kq). Since knowledge distributes over conjunction, K(q ∧ ¬Kq) entails
  Kq ∧ K¬Kq. K¬Kq entails ¬Kq (factivity: Kφ → φ, applied to φ = ¬Kq: K¬Kq → ¬Kq).
  So K(q ∧ ¬Kq) entails Kq ∧ ¬Kq, a contradiction. Thus ¬◇K(q ∧ ¬Kq), i.e., impossible
  to know. By contraposition of knowability, ¬(q ∧ ¬Kq), i.e., q → ¬¬Kq. Classically,
  q → Kq. Then since q was arbitrary, every truth is known. In intuitionistic logic,
  we only get q → ¬¬Kq (if q then it''s not the case that q is never known), which
  doesn''t imply q → Kq. So the intuitionistic response is that the paradox doesn''t
  force omniscience; at most it forces ¬¬Kq. But many think q → ¬¬Kq is still weird.
  The verificationist might restrict knowability to basic propositions or accept the
  intuitionistic conclusion. That''s a subtle area. A student answer could mistakenly
  say "the proof is invalid in intuitionistic logic" — actually the proof is intuitionistically
  valid up to ¬¬Kq; what''s not valid is the final step ¬¬Kq → Kq. So saying "invalid
  in intuitionistic logic" is a subtle conflation: the derivation of the contradiction
  and of ¬(p ∧ ¬Kp) is intuitionistically fine; only the last classical step fails.
