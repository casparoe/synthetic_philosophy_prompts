  Essay draft:


  "Parfit''s Hitchhiker and the Puzzle of Rational Irrationality"


  Parfit''s hitchhiker scenario, introduced in Reasons and Persons (1984), presents
  a deceptively simple challenge to standard accounts of practical rationality. You
  are stranded in the desert. A driver stops and offers you a ride to town, but with
  a twist: this driver is an exceptionally good judge of character and can predict
  with near-perfect accuracy whether, upon arriving safely in town, you will pay the
  agreed-upon fare. If the driver predicts you will pay, she lets you in. If she predicts
  you will stiff her, she drives on. The puzzle is this: once you are safely in town,
  the ride is a sunk cost. Paying the fare confers no further benefit; you have every
  instrumental reason to keep your money. And yet, if you are the kind of agent who
  would reason this way at the destination, you will never get the ride in the first
  place. It seems that the rational agent is the one who will, at the moment of decision,
  act against her own interests — and who knows this about herself in advance.


  The standard move is to say that what is rational ex ante diverges from what is
  rational ex post. Before the ride, it is rational to form a binding commitment to
  pay, or to cultivate a disposition to honor such agreements even when doing so is
  locally disadvantageous. This is the territory of "rational irrationality": the
  idea that it can be rational to cause yourself to hold beliefs or dispositions that
  are, considered in isolation, irrational, because holding them produces better outcomes
  overall. The driver will only pick up someone who is genuinely disposed to pay —
  someone for whom paying is not merely a calculated move but an expression of a stable
  character trait.


  But calling this "rational irrationality" papers over a deeper tension. If we grant
  that the disposition to pay is instrumentally rational to cultivate, then in what
  sense is the act of paying itself irrational? The act is the manifestation of a
  disposition whose possession is rational. If we evaluate individual actions by asking
  "would an agent with optimal dispositions perform this act?", then paying is exactly
  what such an agent would do. The label "irrational" sticks only if we insist on
  evaluating actions one at a time, by their immediate causal consequences, holding
  the agent''s psychology fixed. But that is precisely the picture of local, act-by-act
  evaluation that the hitchhiker scenario calls into question.


  This is where the rationalist blogosphere''s decades-long engagement with decision
  theory becomes relevant. Causal decision theory (CDT) recommends not paying: the
  act of paying does not cause the past prediction, and the ride is already in the
  past. An agent who follows CDT will therefore not be picked up, and will die in
  the desert. This is a bullet some are willing to bite, but most find it unacceptable.
  Evidential decision theory (EDT) recommends paying, because the fact that you pay
  is evidence that you are the kind of agent the driver predicted would pay, which
  in turn is evidence that you are already in town — though EDT''s reasoning here
  is notoriously slippery when the prediction has already been made and the outcome
  observed. Functional decision theory (FDT), developed in the LessWrong community,
  recommends paying on the grounds that you should choose as if your decision procedure
  determines the output of relevantly similar decision procedures elsewhere in the
  world — including the one the driver simulated when making her prediction. On FDT,
  you "acausally" control the prediction by being the kind of decision procedure that
  outputs "pay."


  The hitchhiker scenario thus serves as a compact test case for rival decision theories.
  But I want to suggest that it also exposes a limitation in how the rationalist community
  sometimes frames the problem. The discourse often treats the hitchhiker as a puzzle
  about which decision theory yields the right answer, with the implicit assumption
  that once we have the right theory, the appearance of paradox dissolves. But there
  is a residual question that decision theory alone may not settle: what is the relationship
  between the rationality of dispositions and the rationality of the acts that flow
  from them? Even if FDT (or EDT, or some other theory) tells you to pay, the phenomenology
  of the situation remains strange. At the moment of paying, you are performing an
  act that, considered in causal isolation, benefits you not at all. You are relying
  on a theory that tells you to ignore the apparent causal structure of the situation
  and instead reason about logical counterfactuals. This is cognitively demanding
  in a way that ordinary practical reasoning is not.


  This points toward a broader issue. The concept of "rational irrationality" was
  introduced to handle cases where local irrationality serves global rationality.
  But if our best decision theory ends up recommending the "irrational" act, then
  the act was never irrational to begin with — we were simply mistaken about what
  rationality requires. The phrase "rational irrationality" may therefore be a transitional
  concept, useful for flagging cases where our pre-theoretic judgments about rationality
  break down, but ultimately eliminable once we have a satisfactory theory. The real
  work is not in deciding which acts get the label "irrational despite being rational
  to cultivate," but in developing a theory of rationality that correctly handles
  the relationship between acts, dispositions, and the logical or evidential connections
  that obtain between them.


  I am not fully satisfied with this conclusion, however. It seems to me that there
  is something genuinely paradoxical about the hitchhiker''s situation that persists
  even after one has settled on a decision theory. The paradox is not merely that
  CDT gives the wrong answer; it is that the correct answer, whatever it is, requires
  the agent to act on reasoning that is opaque to the agent''s own deliberative perspective.
  When I hand over the money at the destination, I am not experiencing the force of
  the reasons that FDT attributes to me. I am simply trusting the theory. And trusting
  a theory to override your native deliberative instincts is itself a psychologically
  fragile stance — one that may not survive the pressure of the moment. This suggests
  that even a correct decision theory may not fully dissolve the practical problem
  the hitchhiker faces. The hitchhiker needs not only the right theory but also the
  right kind of self-management — a way of making the theory''s recommendation psychologically
  available at the moment of choice. This, I think, is the grain of truth in the "rational
  irrationality" framing: it captures the fact that bridging the gap between global
  rationality and local action may require techniques of self-modification that look,
  from the inside, like acting against one''s reasons.


