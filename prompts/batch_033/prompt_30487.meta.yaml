  plainly corrupt. The bill will pass whether or not she votes for it; her vote is
  not decisive. If she votes no, she can truthfully say she opposed the corrupt rider,
  but the flood funding will still pass (with the rider), and she will have no record
  of having supported the protection her constituents need. If she votes yes, she
  becomes one of the public faces of a bill she believes contains a serious wrong.
  She is not asking me for a career calculation; she is asking whether it can be right
  to cast the vote, and, more than that, what her moral situation is afterward if
  she does. In particular: if the vote is the right thing to do, is there anything
  left over — a residue, a debt, a reason to feel a certain way — or does the justification
