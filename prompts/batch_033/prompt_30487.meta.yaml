  I am a philosophy professor — my own work is in ancient philosophy, so contemporary
  political ethics is not my home turf — and a former doctoral student of mine, now
  a state legislator, came to me with a problem I want to work through carefully before
  I advise her. Her district includes a floodplain, and a budget bill before the legislature
