  view and one objection commonly raised against each. Keep the answer under 500 words.''"


  Student answer:

  "Counterpart theory, developed by David Lewis, holds that possible worlds are concrete,
  spatiotemporally and causally isolated universes, and that no individual exists
  in more than one world. On this view, the statement ''Nixon could have been a plumber''
  is true just in case there is some possible world containing a counterpart of Nixon
  who is a plumber. A counterpart is not Nixon himself but an individual in another
  world that resembles Nixon closely enough in the relevant respects and is at least
  as similar to Nixon as any other individual in that world. Transworld identity,
  by contrast, defended by Kripke and Plantinga, holds that one and the same individual
  exists in many possible worlds, so the same statement is true just in case there
  is a world in which Nixon himself is a plumber. Counterpart theory''s main advantage
  is that it avoids having to explain how one object can bear incompatible properties
  in different worlds, and it also avoids the need for criteria of cross-world identity.
  Its main liability is the Humphrey objection: my modal properties are made true
  by facts about someone else, a counterpart, rather than about me. Transworld identity''s
  main advantage is that it keeps modal predication about the very object in question.
  Its main liability is that it must provide a way of identifying the same individual
  across worlds; Kripke handles this by saying that possible worlds are stipulated
  rather than discovered, so we simply stipulate which individual we are considering.
  One further point is that, on counterpart theory, an essential property of an object
  is one had by every individual in every world that resembles it, which means Nixon
  is essentially human only if every possible world contains a human counterpart of
  Nixon. And because the counterpart relation is fixed entirely by intrinsic similarity,
  counterpart theory entails that an object''s modal properties supervene on its intrinsic
  properties alone."


