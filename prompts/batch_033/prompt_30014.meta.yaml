  Domain: Information cascades and rational herding. Key concepts:

  - Rational herding: individuals, observing the actions of predecessors, may rationally
  ignore their own private information and follow the crowd, producing an information
  cascade.

  - Cascade can be wrong/fragile: everyone following can lead to a wrong consensus
  even if privately many doubt; small public information can overturn it.

  - Distinguish rational herding from other conformity (social pressure, network effects,
  switching costs).

  - In a tech context: everyone adopts a particular framework/language/microservice
  architecture because predecessors chose it; individual engineers have private doubts
  but infer from others'' choices.

  - Key subtlety: in an information cascade, once a cascade starts, actions become
  uninformative (everyone follows regardless of private signal), so late observers
  rationally ignore their own signal. But there is a difference between "individually
  rational" and "collectively efficient" — cascade can lock onto wrong choice. Also
  distinction between observational learning (information) and payoff externalities/network
  effects (it''s rational to adopt what others adopt because of compatibility/ecosystem,
  not just information). Also threshold models vs cascade models.

  - A good adjudication: one person says it''s a rational cascade; other says no,
  it''s network effects or just risk aversion, not information; or one says "everyone
  using X is evidence X is good," other says "but everyone is copying everyone, so
  it''s not independent evidence; the hundredth adopter adds no information." The
  move-by-move adjudication should handle this.


