  Let''s define the model carefully:

  - Information cascade model (Bikhchandani et al.): individuals with private signals
  choose sequentially; each observes predecessors'' actions (not signals). After a
  few identical choices, later individuals rationally ignore their private signal
  and follow, because the public history outweighs their signal. Actions become uninformative;
  cascade can be wrong with positive probability.

  - Key features: behavior is fragile (small shocks can overturn), idiosyncratic (a
  couple of early choices can determine mass behavior), and the "herd" follows because
  of information inferred from predecessors, not payoffs.


  A good disagreement could be about whether a real-world case (Kubernetes adoption)
  is an information cascade in this technical sense, or something else (network effects,
  switching costs, tooling ecosystem, fear of being blamed for nonstandard choice).
  Both sides make decent points.


