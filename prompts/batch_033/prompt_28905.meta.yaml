  Lewis''s counterpart theory (from "Counterpart Theory and Quantified Modal Logic"
  1968, and developed in "On the Plurality of Worlds" 1986):

  - Possible worlds are concrete, isolated spatiotemporal wholes, all equally real.

  - No individual exists in more than one world (no transworld identity). Each thing
  is world-bound; it has counterparts in other worlds.

  - De re modal statements: "Humphrey might have won" is analyzed as: there is a possible
  world w and a counterpart x of Humphrey in w such that x wins in w. The counterpart
  relation is not identity but a relation of similarity in certain respects.

  - The counterpart relation is context-dependent and inconstant/vague: "in general,
  something has for counterparts at a given world those things existing there that
  resemble it closely enough in important respects of intrinsic quality and extrinsic
  relations, and that resemble it more closely than do other things existing there.
  And in general, what is important depends on context." (I must not quote from memory
  — I won''t put this in quotes.)

  - Lewis endorses counterpart theory partly because of the problem of accidental
  intrinsics for transworld identity: the same object can''t have incompatible intrinsic
  properties; transworld identity requires either world-indexed properties or abandoning
  ordinary intuitions.

  - Kripke''s objection (in "Naming and Necessity"): Humphrey himself must have the
  modal property; if counterpart theory says it''s some other person who won, that''s
  not what Humphrey cares about. Lewis''s reply: Humphrey has the modal property "possibly
  wins" in the sense that there is a counterpart of him who wins; having a counterpart
  is a property Humphrey himself has (in this world), so the modal predicate does
  apply to Humphrey himself. Whether that satisfies Kripke is contested.


