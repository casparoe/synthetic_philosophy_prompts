  by name. That''s fine, not a bibliography.


  The procedure: evaluate proposals that reduce inequality by levelling down.


  Questions:

  1. Clarify the counterfactual: who is affected, in what direction, and by how much,
  relative to the status quo? (Needs a metric of health benefit/harm and distribution.)

  2. Does the proposal make at least one person absolutely better off in terms of
  health/well-being? If yes, proceed to prioritisation; if no one is better off and
  at least one person is worse off, this is a pure leveling-down case. Under prioritarianism
  the default is reject. But check:

  3. Are there indirect benefits to the worse-off group or to third parties that are
  real and not merely relative? (e.g., reduced waiting times for the worse off because
  resources are reallocated, not merely withdrawn; spillover effects; reduced stigma;
  relational/status effects.) If evidence supports these, proceed; if the only claimed
  benefit is ''the gap is smaller'', stop with no.

  4. Is the harm to the better-off group relevant for priority weighting? Even if
  the better-off are better off, prioritarianism counts their losses, though with
  less weight; a very large loss to the better off cannot be justified by a negligible
  gain to the worse off. Check whether the proposal meets the weighted-benefit test:
  does the priority-weighted gain to the worse off exceed the loss? If no, reject;
  if yes, consider:

