  by priority to the worse off; it is a form of welfarism and rejects the intrinsic
  value of equality, so it avoids the leveling-down objection. The leveling-down objection:
  if equality were intrinsically valuable, then making the better off worse off without
  making anyone better off would be an improvement in one respect, which seems absurd.
  Egalitarians respond (e.g., Parfit''s distinction between telic and deontic egalitarianism;
  Otsuka/Voorhoeve on prioritarianism vs egalitarianism). I don''t need citations
