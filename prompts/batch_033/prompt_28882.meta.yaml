  The Meno problem / value problem: In Plato''s Meno, Socrates asks why knowledge
  is more valuable than true belief, given that both get you to Larissa (both guide
  action equally well). The value problem has three versions: (1) primary value problem
  (why is knowledge more valuable than true belief?), (2) secondary value problem
  (why is knowledge more valuable than any proper subset of its parts?), which motivates
  virtue epistemology and reliabilism''s swamping problem. The swamping problem: if
  the value of true belief is what matters, and reliability only has instrumental
  value relative to true belief, then knowledge (true belief + reliability) can''t
  be more valuable than true belief alone — the value of the reliable process is "swamped"
  by the value of the true belief. Solutions: virtue epistemology (Zagzebski: knowledge
  is a state of the agent, credit/achievement, success from ability has final value);
  Greco''s achievement account; Pritchard''s anti-luck virtue epistemology; Kvanvig''s
  claim that the focus on knowledge is misguided and understanding is what has value.


  A good exam question could force students to confront whether the value problem
  is even well-posed: maybe knowledge isn''t more valuable in the way assumed; maybe
  the comparison should be between knowledge and justified true belief, or true belief
  plus something. Or ask students to design a case where a true belief and knowledge
  diverge in practical value and explain what must be added.


