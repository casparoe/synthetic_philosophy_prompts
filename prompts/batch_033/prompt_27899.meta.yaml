  Illusionism about phenomenal consciousness: the view that phenomenal consciousness
  (the subjective "what it''s like") is an illusion; introspective appearances as
  of phenomenal properties don''t commit us to the existence of those properties.
  Keith Frankish (2016 "Illusionism as a Theory of Consciousness") is the main proponent.
  Dennett is often seen as an illusionist or proto-illusionist. Realists/anti-illusionists:
  phenomenal consciousness is real; the "what it''s like" is a datum that cannot be
  explained away. Chalmers''s "hard problem" and the "meta-problem of consciousness"
  (Chalmers 2018) are relevant: the meta-problem is explaining why we think there''s
  a hard problem; illusionists treat the meta-problem as the whole problem. Galen
  Strawson argues that illusionism is self-defeating because illusion itself requires
  experience, so "illusion of consciousness" presupposes consciousness. This is a
  key dialectical move: illusionists respond that "illusion" here means a false representation,
  not a conscious experience of illusion — but critics say this changes the subject.


