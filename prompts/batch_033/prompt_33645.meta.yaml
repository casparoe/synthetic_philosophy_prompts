  I''m a software engineer with no formal background in philosophy, and I''ve been
  trying to get clear about what I think about moral conflicts — situations where
  it looks like I can''t do everything I ought to do. I have gut reactions to a bunch
  of cases, but I can''t see the principle behind them. I''d like you to help me find
  it, or tell me which of my reactions I should give up.


  Here are the cases and my verdicts.


  1. Double-booked promises. Last week I promised a friend I''d help them move on
  Saturday, and then forgot and promised another friend I''d review a critical pull
  request at the same time. I can only do one. Verdict: this isn''t a genuine dilemma.
  The mess traces back to my carelessness; at the moment of choice I should pick the
  weightier commitment, do it, and apologize to the other person. The fact that I''m
  in a bind now doesn''t mean I face two real obligations at once.


  2. The student in wartime. A student must choose between staying to care for his
  mother, who depends on him and will likely not survive without him, and leaving
  to join the resistance against an occupying army. Both strike me as weighty obligations,
  and neither seems to override the other. Verdict: a genuine dilemma. Whichever he
  does, he fails at something he genuinely owed; there is no fully right option.


  3. The runaway vehicle. A runaway vehicle is heading toward five workers. I can
  throw a switch that diverts it to a side track where it will hit one worker. Verdict:
  not a genuine dilemma. Diverting is the right thing to do, even though the death
  of the one worker is a terrible result I should feel awful about. I don''t think
  I "wrong" the one worker in the all-things-considered sense, even though I regret
  the harm.


  4. Forced choice between children. An official tells a parent to choose which of
  their two children will be taken away to be killed; if the parent refuses, both
  will be taken. Verdict: I keep going back and forth, but my strongest reaction is
  that this is a genuine dilemma. Whichever child the parent names, the parent has
  done something wrong to the unchosen child, even though the official is the one
  doing the killing. There is no right answer.


  5. Clear override. I promised a colleague I''d review their code tonight, and separately
  promised my child I''d go to their school performance. I can''t do both. Verdict:
  not a dilemma. The performance clearly overrides the code review; I break the promise
  to the colleague, apologize, and reschedule. The conflict is real but resolvable.


  6. Two drowning strangers. I see two strangers drowning. I can save only one, and
  there''s no relevant difference between them. Verdict: not a dilemma. I ought to
  save one of them, and if I save one I haven''t violated a duty to the other; the
  duty was to save as many as I could, which I did. The other''s death is a tragedy
  but not a wrong I did.


  7. Ordered to do wrong. A soldier is ordered to carry out an attack that will kill
  civilians. If he refuses, he''ll be punished and the unit may fail. Verdict: not
  a dilemma. Whatever obligation he has to follow orders is clearly overridden by
  the obligation not to kill civilians. The right choice is to refuse.


