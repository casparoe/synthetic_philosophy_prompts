  distinctions:


  - Prima facie duty vs all-things-considered duty (Ross). A conflict of prima facie
  duties can be resolved; a genuine dilemma would be a conflict of all-things-considered
  oughts.

  - Ought implies can: if you cannot do both, can it be that you ought to do both?

  - Agglomeration: O(A) and O(B) → O(A&B). If you ought to do A and ought to do B,
  you ought to do both; but if can''t do both, contradiction. So either reject agglomeration
  or reject one ought.

  - Moral remainder / regret: in some conflicts, even after choosing the better option,
  you owe something (apology, reparation). Some argue remainder shows genuine dilemma;
  others say it''s just regret for a loss, not guilt for a wrong.

  - Self-imposed vs externally imposed conflicts: if you created the conflict by making
  two promises, the "dilemma" is traceable to earlier wrongdoing; the present choice
  isn''t a genuine dilemma.


