  The philosophical content: Genuine moral dilemmas. Key concepts:

  - A moral dilemma: an agent has two (or more) obligations, can fulfill either but
  not both, so whichever they do, they violate an obligation.

  - Opposing view: there are no genuine dilemmas; apparent conflicts are resolvable
  (e.g., by a lexical ordering, or one obligation overrides the other); or "ought
  implies can" so if you can''t do both, it can''t be that you ought to do both.

  - Defenders of genuine dilemmas: e.g., Bernard Williams ("Ethical Consistency"),
  Bas van Fraassen, Ruth Barcan Marcus; cases like Sophie''s Choice, Agamemnon, Sartre''s
  student. Standard arguments: agglomeration (if ought A and ought B then ought (A&B));
  ought-implies-can; conflict of obligations leads to contradiction, so some reject
  dilemmas. Supporters reject agglomeration or modify deontic logic.


