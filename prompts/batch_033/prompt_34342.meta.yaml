  Let me think about the content of a higher-order theories disagreement.


  Higher-order theories of consciousness: the view that a mental state is conscious
  if and only if it is the object of a suitable higher-order representation (a higher-order
  thought or perception). There are variants: higher-order thought (HOT) theory (Rosenthal),
  higher-order perception (HOP) theory (Lycan, Armstrong), self-representational theories
  (Kriegel), first-order representational theories (Dretske, Tye). Key issues:

  - Distinguishing state consciousness from creature consciousness and transitive
  vs intransitive consciousness.

  - The "rock objection" / targetless higher-order states: a higher-order state can
  misrepresent a lower-order state, so how can misrepresentation make something conscious?
  Rosenthal says the state is conscious when there is a higher-order thought about
  it, even if the HOT misrepresents; others object.

  - Whether the higher-order state must itself be conscious (leading to regress) or
  non-conscious.

  - The "transitivity principle" — conscious states are states we are conscious of.

  - Objection: higher-order theories make consciousness too intellectual; creatures
  without concepts can''t be conscious.

  - Objection: seems to locate consciousness in the wrong place: if a state is conscious
  because it''s the object of a HOT, then the "what it''s like" seems to be conferred
  from outside.


  For a debate, two people could argue:

  A defends a higher-order view: a state is conscious only if there''s a higher-order
  awareness of it.

  B objects: that confuses being conscious with being conscious of being conscious;
  a dog in pain is conscious though it can''t think about its pain.

  A replies: no, the higher-order state needn''t be a full concept-using thought;
  it can be a non-conceptual "inner sense" (higher-order perception) — this is HOP
  theory.

  B replies: but then what explains the difference between a state we''re merely aware
  of inattentively and a conscious state? Or: the higher-order perception itself must
  be conscious to make anything conscious, leading to a regress.

  A replies: the higher-order state need not be conscious; it''s a monitoring state,
  and non-conscious monitoring suffices.

  B: but that seems to push the problem back: how can a non-conscious state "make"
  a lower state conscious? What is the magic?


