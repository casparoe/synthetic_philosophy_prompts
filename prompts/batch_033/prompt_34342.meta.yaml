  Key philosophical elements:

  - Lying vs deception: lying typically requires asserting what one believes false
  with intent to deceive; deception is broader, causing false belief.

  - Does deception require intent? Some views: deception requires an intention to
  cause false belief; others: it''s enough that the agent''s behavior predictably
  causes false belief (or functions to do so). AI systems may not have intentions,
  but their outputs can be deceptive in a functional sense.

  - Can a system that lacks beliefs deceive? Under an intent-requiring view, no; under
  a functional/receiver-oriented view, yes. The policy''s use of "deceive" presupposes
  one of these.

  - The operationalization: "statements flagged false or unsupported" presupposes
  that deception is a property of individual assertions (their falsity or lack of
  support), not of the overall impression created. It ignores omission, framing, and
  true-but-misleading statements (the "letter vs spirit" problem).

  - Consistency: Part (3) allows omission and partial answers; if deception is about
  false belief, then strategic omission can deceive. So the policy''s parts may presuppose
  inconsistent theories: a sentence-level falsity view in enforcement, and perhaps
  an intent/effect view in its aspirational language.

  - The "helpful and encouraging" tuning creates pressure toward misleading confidence,
  which conflicts with honesty under an effect-based view.

  - What would change if deception = causing or risking false beliefs: the fact-checker
  would need to monitor the user''s likely inferences, not just truth values; omissions
  and framing would be audited; the system would need to track what the user is likely
  to conclude; training for engagement would be constrained; disclaimers might need
  to be stronger; declining/partial answers would be evaluated for their misleadingness.


