  following Bernard Williams, hold that a person has a reason to do something only
  if it can be reached by sound deliberation from something already in her subjective
  motivational set — her desires, projects, or commitments. Externalists deny this,
  holding that there can be reasons that apply to a person regardless of what she
  happens to want or care about. Read the story through this debate. The lawyer narrator
  keeps treating it as obvious that Bartleby has reasons to do his work, to leave
  the office, to accept money, to explain himself; Bartleby''s endlessly repeated
  refusal, stated as a preference rather than a defiant refusal, seems to show that
  no amount of argument from the lawyer''s reasons can move him. Is Bartleby best
  read as a pure case of the internalist point — someone with no internal reason to
  comply and therefore no reason at all? Or does the story''s later movement, in which
  Bartleby refuses even food and the narrator''s pity becomes something like a reason
  to care for him, show the limits of internalism: that we are unwilling to say a
  starving man has no reason to eat or that the narrator has no reason to help him,
  even when nothing in Bartleby''s motivational set connects? Be faithful in both
  directions: don''t reduce the story to a philosophy example, and don''t distort
