  Dennett''s intentional stance (from "True Believers" 1981, The Intentional Stance
  1987): to predict/explain a system''s behavior, you can take the intentional stance:
  attribute beliefs, desires, and rationality, and predict that it will act to satisfy
  its desires given its beliefs. This is contrasted with the design stance (predict
  from how it''s designed) and the physical stance (predict from physical laws). The
  intentional stance is a strategy; whether the system "really" has beliefs is a further
  question, and Dennett''s view is somewhat instrumentalist/pragmatic but he resists
  simple instrumentalism; he argues the intentional stance is not just "as if" but
  that beliefs are real patterns. There''s debate about whether this is realism or
  instrumentalism. Also, the intentional stance can be applied to chess computers,
  thermostats (very simple), and even to evolution or corporations. Key: attributing
  beliefs is justified when it buys predictive power; the system''s behavior is rational
  given the attributed states; you attribute the beliefs it ought to have given its
  environment and capacities.


