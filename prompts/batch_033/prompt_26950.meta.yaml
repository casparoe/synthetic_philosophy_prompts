  Al-Ghazālī (c. 1058–1111), "The Incoherence of the Philosophers" (Tahāfut al-Falāsifa),
  17th discussion on causality. He denies necessary causal connections in nature.
  The famous example: cotton placed in fire; the burning is not caused by the fire
  but by God, either directly or through an angel; fire is an "occasion" not a cause.
  He argues that the only observed fact is that burning occurs with contact with fire;
  the necessity is not observed. God can create burning without fire or fire without
  burning. The Ash''arite occasionalism: God is the sole cause; created things are
  occasions; God re-creates the world at each instant (continuous creation) — though
  that''s more associated with Ash''arism broadly and Al-Ghazālī holds a version.
