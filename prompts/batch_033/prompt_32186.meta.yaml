  The argument I sketched: (1) PSR: every contingent fact has an explanation. (2)
  The conjunction of all contingent facts (the "Big Conjunctive Contingent Fact,"
  BCCF) is itself contingent. (3) So BCCF has an explanation. (4) The explanation
  cannot be contingent, because any contingent fact is part of BCCF, and a fact can''t
  explain a conjunction that includes itself (self-explanation is circular). (5) So
  the explanation is a necessary fact (or necessary being). (6) But a necessary fact,
  being necessary, is consistent with BCCF not obtaining — since a necessary fact
  obtains in all possible worlds including worlds where BCCF doesn''t — so it cannot
  explain why BCCF obtains. (7) Contradiction, so PSR is false.


  This is actually a known problem: van Inwagen''s objection to the PSR-based cosmological
  argument? And the responses: (a) deny that BCCF is a fact/contingent (the totality
  may not be a thing); (b) allow self-explanation or explanation by a necessary being
  whose essence explains; (c) deny (6) by distinguishing "explanation" from "entailment"
  — explanations need not entail; (d) deny (4) by allowing a contingent fact to explain
  itself (Pruss?). Actually Pruss defends PSR and allows that some contingent facts
  are explained by necessary beings plus free choices. The issue of whether the BCCF
  is contingent: the aggregate of contingent things is contingent because if each
  member might not exist, the aggregate might not exist — but some argue the aggregate
