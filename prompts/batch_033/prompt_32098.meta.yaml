  Contextualist says: the word "knows" shifts meaning with context. In low-stakes,
  "knows" is easier to satisfy; in high-stakes, harder. So both can be true.


  Subject-sensitive invariantism (SSI): knowledge itself depends on stakes. In high-stakes,
  you need more evidence. So in low-stakes you know, in high-stakes you don''t.


  Strict invariantism: knowledge doesn''t depend on stakes. If you know in low-stakes,
  you know in high-stakes too. The high-stakes intuition is explained away by something
  else (e.g., you''re not justified in acting on the knowledge, but you still know).


