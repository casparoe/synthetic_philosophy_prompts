  Let me think about the exact content of Peirce vs James to avoid errors:

  - Peirce: truth is the opinion fated to be ultimately agreed upon by all inquirers
  who investigate long enough, using the scientific method. Truth is independent of
  what any individual or finite community believes now; convergence at the ideal limit.
  Reality is the object of the final opinion. Peirce''s pragmatism is about meaning,
  not truth? His "pragmatic maxim" is a method for clarifying ideas: consider what
  practical effects the object of a conception has. Truth, for Peirce, is tied to
  inquiry''s destined end.

  - James: truth is what it is better for us to believe, what pays, what is expedient
  in the way of belief; "the true is the name of whatever proves itself to be good
  in the way of belief." James is more individualist, pluralist, and allows that truth
  is made in the course of experience, not predetermined. He says "Truth happens to
  an idea."

  - The tool analogy: James himself uses it? James says ideas are instruments; "theories
  are instruments, not answers to enigmas." But he also uses "cash value." The tool
  analogy actually fits James better than Peirce. For Peirce, a true belief is not
  merely a tool that works for me now; it''s the belief that would survive all inquiry.
  The analogy imports an individual user, a present task, and success relative to
  present purposes. It breaks for Peirce because his truth is convergent, community-wide,
  long-run, and not relative to anyone''s current purposes. It also partially breaks
  for James if "works" is read too narrowly (only practical utility), but James does
  embrace expediency in belief.


