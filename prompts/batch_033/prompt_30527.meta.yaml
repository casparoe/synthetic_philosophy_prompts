  The notes:


  - Setup: AI safety via debate proposes that if a human judge can reliably pick the
  better of two arguments, then two superhuman AIs can be pitted against each other
  and the judge''s decision tracks truth. The usual worry: the dishonest model just
  lies, or both models collude, or the judge lacks domain knowledge.

  - My claim: even setting aside outright lying, debate inherits the judge''s evidential
  standards. A debater can be "honest" in the sense that every sentence it says is
  true, and still steer the judge by selecting which true sentences to say, what to
  emphasize, and which questions to answer fully vs. minimally. Because the judge''s
  posterior is a function of the judge''s priors and the evidence they actually process,
  truth-tracking breaks down exactly when the judge''s priors are wrong in a way the
  debater can exploit.

  - The obfuscated-arguments point: for any proposition P, a sufficiently capable
  system can often find a true-sounding argument that increases the judge''s P(P)
  even when P is false (and vice versa), as long as the judge can''t independently
  verify the whole argument. Obfuscation is not lying; it''s exploiting the gap between
  the argument''s persuasive force and its logical force.

  - So the debate protocol only gives you: the judge would assign high probability
  to the winner''s position after hearing these arguments. It does not give you: the
  winner''s position is true. The usual reply is "make the judge better" or "use debate
  recursively," but that either regresses (who judges the judge-training?) or smuggles
  in an external standard of correctness.

  - Possible pushback to preempt: maybe all epistemology is judge-relative in this
  sense, and debate is just the best we can do; the question is whether it''s better
  than alternatives, not whether it''s perfect. I should address that: maybe the right
  target is calibration to the judge''s future self with more time/tools, not ground
  truth.

  - I''d like comments on: (a) whether I''m attacking a steelman of debate or a strawman;
