  The discursive dilemma: a group of three judges voting on two premises and a conclusion.
  Each judge''s individual judgments are logically consistent, but majority voting
  on each proposition can yield an inconsistent collective set. Example: Judges A,
  B, C on propositions P, Q, and R (where R follows from P∧Q). A: P yes, Q no, R no
  (consistent because denies Q, so R not entailed... actually R follows from P∧Q;
  if Q false, R can be false; consistent). B: P no, Q yes, R no. C: P yes, Q yes,
  R yes. Majority on P: yes (A,C); majority on Q: yes (B,C); majority on R: no (A,B).
  So collective accepts P, Q, but rejects R, inconsistent with P∧Q→R. This is the
  classic doctrinal paradox / discursive dilemma (List and Pettit). The point: premise-based
  vs conclusion-based aggregation.


