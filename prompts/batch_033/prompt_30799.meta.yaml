  the same as compulsion, and 80% isn''t certainty; the person could still have changed
  their mind.


  3. A case where a researcher uses brain stimulation to produce an urge to move a
  limb, and the subject insists it felt like their own decision. Verdict: this does
  undermine free will (or at least the subject''s report of it); the action has the
  wrong causal history.


