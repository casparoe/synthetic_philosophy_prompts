  Draft:


  "I have been reading about Libet''s experiments on the neuroscience of free will,
  and I find that my own reactions to different cases do not add up. I would like
  to know whether there is a single principle that captures them, and if not, which
  of my verdicts I should revise.


  Here are the cases and my verdicts.


  First, the original Libet-style case. A participant is asked to flex their wrist
  whenever they feel the urge to do so. Recordings from the scalp show that a readiness
  potential begins before the moment at which the participant reports having decided
  to move. My verdict: this does not show that the decision was made unconsciously.
  Reporting the exact moment of an urge is unreliable, and a trivial wrist movement
  is not a good model of ordinary choice.


  Second, a modern prediction case. Researchers record brain activity while a person
  decides which of two buttons to press, and can predict the choice several seconds
  before the person reports deciding, with accuracy well above chance but far from
  perfect. My verdict: this is more unsettling, but still does not undermine free
  will. Prediction is not compulsion, and less-than-perfect accuracy leaves room for
  the person to have done otherwise.


  Third, a stimulation case. An electrode in a person''s brain is used to produce
  an urge to raise one hand, and the person reports that the urge felt like their
  own and that they acted on it freely. My verdict: this does undermine the person''s
  freedom in that action, or at least the reliability of their report. The action
  has the wrong kind of causal history.


  Fourth, a clinical case. A person with a tumour that affects impulse control suddenly
  becomes aggressive and strikes someone. My verdict: the person''s responsibility
  is diminished, because the usual mechanisms of self-control are damaged.


  Fifth, a deliberation case. A person spends weeks weighing whether to accept a job
  in another city, and finally chooses. A neuroscientist claims that the choice was
  already determined by neural states present at the start of the deliberation. My
  verdict: the choice is still the person''s own, and the fact about earlier neural
  states does not undermine responsibility, even though I cannot fully explain why.


  Sixth, a perfect-prediction case. Imagine a scanner and a complete account of the
  laws of nature that together allow every decision to be predicted from prior brain
  states. My verdict: I find this genuinely threatening to free will, even though
  it seems to be the same point as the second case taken to its limit.


  The tension I cannot resolve is this. I treat the stimulation and tumour cases as
  undermining freedom because the action bypasses the person''s normal deliberative
  capacities. But then the Libet and prediction cases should be harmless, since they
  do not obviously bypass anything. So far so good. Yet the perfect-prediction case
  bothers me for exactly the reason I said does not bother me in the prediction case.
  The only principle I can half-articulate is that an action is free when it is produced
  by the person''s ordinary deliberative capacities working as they usually do; but
  that principle seems to say the perfect-prediction case is not a threat, and I do
  not believe it.


  Is there a principle that gets all or most of these verdicts, and what does it say
  about a further case I have not settled: a person whose choices are made slightly
  more likely by a subliminal prime, but who can still resist the influence and sometimes
  does? Which of my verdicts would the principle force me to abandon?"


