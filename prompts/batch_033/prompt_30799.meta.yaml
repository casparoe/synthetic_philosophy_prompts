  act on one. Verdict: responsibility diminished, because the usual mechanisms of
  self-control are bypassed or damaged.


  5. A person who deliberates for weeks over a career choice; a neuroscientist claims
  that the outcome was already determined by neural states at the start. Verdict:
  deliberation still matters; I resist the idea that this undermines responsibility,
  even though the same broad logic as the Libet case might apply.


  6. A hypothetical: a perfect scanner plus the laws of nature could predict every
