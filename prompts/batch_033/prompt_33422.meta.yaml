  Let me design the summary with specific subtle errors. Let me recall Jeffrey conditionalization
  carefully.


  Jeffrey conditionalization (or "probability kinematics") is a rule for updating
  a probability function in light of uncertain evidence, where the agent does not
  become certain of a proposition E, but instead the evidence directly changes the
  probabilities of the elements of a partition {E_i} (e.g., a partition of possible
  sensory observations). The rule: for a partition {E_i} whose new probabilities are
  q(E_i), update each proposition A by:


  P_new(A) = Σ_i q(E_i) * P_old(A | E_i)


  This requires the "rigidity" condition: conditional probabilities on the elements
  of the partition remain unchanged: P_new(A | E_i) = P_old(A | E_i). Jeffrey conditionalization
  generalizes ordinary Bayesian conditionalization (which is the special case where
  q(E) = 1 for one element).


  Common subtle misrepresentations to embed:

  1. Conflating Jeffrey conditionalization with ordinary conditionalization or saying
  it''s for "evidence you''re not sure about, like hearing a rumor" — that''s roughly
  right. But the subtle error: presenting it as a psychological description of how
  people actually update, or as the only rational way to update on uncertain evidence.

  2. The "rigidity" condition: Jeffrey conditionalization assumes conditional probabilities
  given the partition are rigid (unchanged). A common objection: whether rigidity
  holds is not determined by the rule; in fact, Jeffrey''s rule is often criticized
  for presupposing rigidity as an unexplained constraint. A summary might present
  it as a theorem that rationality requires rigidity, or conversely might claim the
  rule "doesn''t require any assumptions beyond your new probabilities." The subtle
  error: the summary says the rule uses only your new probabilities over the partition
  and your old conditional probabilities, and therefore requires nothing further —
  omitting that rigidity is a substantive assumption, and that not every partition
  will support a well-defined Jeffrey update (the "commutativity" or "order dependence"
  issues: successive Jeffrey updates may fail to commute, unlike Bayesian conditionalization;
  and the choice of partition matters). Another subtle issue: Jeffrey conditionalization
  is not "the same as" standard conditioning whenever evidence is uncertain; it''s
  a generalization, but there are debates about whether uncertain evidence can always
  be modeled by a partition over which you change credences (vs. "external" evidence).

  3. Overstating: "Jeffrey proved that this is the uniquely rational update rule whenever
  evidence is uncertain." That''s an overstatement: Jeffrey proposed it and argued
  for it (Dutch book / desirability), but uniqueness and the "whenever" are contested;
  also, some argue Jeffrey''s rule handles only a limited class of uncertain evidence
  (where evidence has a propositional partition representation), not all uncertain
  evidence.

  4. Presenting a standard objection as refutation: e.g., "because the rule makes
  the order of successive uncertain observations matter (it doesn''t commute), Jeffrey
  conditionalization is generally regarded as inconsistent" — actually non-commutativity
  is a known feature/debate, not a refutation; many see it as correct for evidence
  that''s not cumulative in a propositional sense.

  5. The "inputs" issue: Jeffrey conditionalization takes the new probabilities q(E_i)
  as inputs, but doesn''t tell you where they come from; a popularizer might say "all
  you need is your new degrees of belief in the evidence, which you can just read
  off your experience" — subtly wrong: the rule doesn''t explain how experience determines
  q; that''s the "input problem" (where do the new probabilities come from?). Some
  Bayesians (e.g., diaconis/Zabell) show there is no consistent rule that maps a new
  probability of E to a full distribution without extra assumptions.

  6. It''s sometimes said Jeffrey conditionalization is just Bayesian conditionalization
  on a "catch-all" proposition — no, that''s a specific model ("the observation''s
  evidential import") but not equivalent.


