  The idea to convey: a thought experiment can function as an "intuition pump" — it
  doesn''t prove a conclusion; it manufactures the intuition for it by selective framing,
  vividness, omission of alternatives, loaded terms, and the direction of the reader''s
  identification. People can feel the force of a thought experiment while being unable
  to defend it as an argument, and the same underlying case reframed can pump the
  opposite intuition.


  Activity design: I''ll propose something like:


  "Framing the Forced Choice" / "The Two Labs" game. Actually, let me make it a game
  with rules and a debrief.


  Concrete game: "The Case Clinic" — participants are split into two teams (or pairs),
  each assigned the same bare scenario: a forced choice with two options that trade
  off, say, avoiding harm now vs. avoiding harm later, or individual welfare vs. aggregate
  welfare, but the scenario is described in stripped-down, affect-neutral terms (e.g.,
  "Agent must choose between Option A, which leads to outcome X for person P, and
  Option B, which leads to outcome Y for group G"). Each team is secretly assigned
  a target verdict: "Make Option A feel obviously right" or "Make Option B feel obviously
  right." They write a short thought-experiment version of the case — adding concrete
  details, a protagonist, sensory specifics, backstory, wording — but they are forbidden
  from changing the stated consequences or adding new facts that change the underlying
  choice structure. Then all versions are read aloud (or posted), and everyone votes
  on which option they feel is right in each version. The versions are then lined
  up next to the bare description, and the group reverse-engineers which devices moved
  the votes.


  This directly makes participants feel the force: they''ll find themselves moved
  by a version even though they know the underlying choice is identical, and they''ll
  have just built one of the pumps themselves.


  Debrief maps devices to the concept: vividness/availability, protagonist identification,
  order of information, loaded labels ("sacrifice" vs "abandonment"), backgrounding
  of the unchosen option''s victims, salience of one causal chain, etc. Also discuss
  Dennett''s coinage of "intuition pump" and the difference between a pump and an
  argument: a pump lowers the "activation energy" for a verdict; it doesn''t entail
  it. Honest note: the activity demonstrates the framing effect but not the full normative
  upshot — that some pumps may nonetheless track real moral differences; the activity
  can''t distinguish between legitimate and illegitimate uses of vivid detail; the
  facilitator must supply the philosophical assessment.


