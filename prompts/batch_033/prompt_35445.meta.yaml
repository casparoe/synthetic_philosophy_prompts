  "Consider the game Nomic. In its initial form, the game consists of a set of numbered
  rules, some of which specify how the game is played and won, while others specify
  how the rules themselves may be changed: players propose rule-changes, vote on them,
  and adopt them according to procedures that are themselves rules. The amendment
  procedures apply reflexively, so players may amend the rules governing amendment,
  and may even amend the rule that defines winning, provided they follow the rules
  currently in force. Some rules are initially designated immutable, but that designation
  too is a rule and can be altered through the prescribed amendment process.


  Philosophers of law have sometimes treated Nomic as a toy model of a legal system
  that contains its own criteria of validity. The puzzle is this: when a rule authorizes
  changes to itself, or when the rule that confers validity is itself valid only by
  virtue of that very rule, we seem to get a self-referential circle. Does this generate
  a genuine paradox — a legal version of the liar, or an infinite regress of justifications
  — or are the paradoxes merely apparent, dissolving once we distinguish levels of
  rules, acts performed under rules, and the temporal stages of an amendment?


  Write an essay on whether self-amending rule systems like Nomic harbor a genuine
  paradox of legal self-reference. Weigh the strongest reasons for thinking there
  is a real paradox against the strongest reasons for thinking the appearance of paradox
