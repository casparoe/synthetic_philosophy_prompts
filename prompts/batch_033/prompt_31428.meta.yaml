  Accuracy-first epistemology (Joyce, Pettigrew, Greaves & Wallace). Core commitments:

  - Epistemic value = accuracy (closeness to truth), measured by strictly proper scoring
  rules (e.g., Brier score).

  - Rational credences maximize expected accuracy from the agent''s own perspective;
  this gives probabilism (Joyce).

  - Conditionalization maximizes expected accuracy (Greaves & Wallace).

