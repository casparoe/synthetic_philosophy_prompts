  for probabilism without privileging a specific rule, but different strictly proper
  scoring rules can rank different credence functions differently relative to the
  same truth-values. So "accuracy is the sole epistemic good" plus "there''s no privileged
  scoring rule" creates a tension: the normative verdicts can depend on the choice
  of rule. If you hold both (accuracy-only and no unique rule), you may get conflicting
  recommendations. What has to give: either accept a privileged rule (e.g., Brier)
