  utility over a set of priors; ambiguity-averse in the sense of preferring known
  probabilities. Smooth ambiguity model: second-order expected utility — the agent
  has a subjective distribution over possible priors and evaluates acts by the expectation
  (over priors) of a concave transform of the expected utility of each prior; concavity
  captures ambiguity aversion. Both can explain Ellsberg paradox.


