  satisficer''s advantage should come from a general structural feature, not from
  a rigged aspiration level that happens to match the true optimum; and the case should
  be one where the optimizer''s information is systematically misleading (e.g., option
  values are noisy and the optimizer overfits to the observed sample, or the optimizer
  keeps searching past the point of diminishing returns because the expected value
  of search is overestimated). Then demonstrate the verdicts, identify the feature
  doing the work (e.g., the optimizer''s curse: in a finite sample of options with
  noisy quality signals, the option with the highest observed quality tends to be
  overestimated; a satisficer who takes the first option above a threshold is less
  exposed to this selection bias), and say what would change the mind (e.g., if signal
  noise were zero or the optimizer had unbiased estimates, maximizing would dominate).


