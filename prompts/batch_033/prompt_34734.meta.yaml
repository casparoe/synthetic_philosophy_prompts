  favors act A, but whose distribution of expected utilities across priors is such
  that the smooth model with high concavity favors act B (e.g., A has a slightly higher
  minimum but much higher spread/second-order risk; B has a slightly lower minimum
  but much less second-order risk). Or vice versa.


