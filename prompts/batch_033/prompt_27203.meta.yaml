  Pain asymbolia: a condition (often after brain damage, e.g., insular cortex lesions)
  where patients report that they feel pain — they can locate it, describe its quality
  (sharp, burning) — but they deny it hurts or bothers them; they don''t withdraw,
  don''t grimace, don''t complain. It''s often interpreted as a dissociation between
  the sensory-discriminative component of pain and the affective-motivational (unpleasantness)
  component. Grahek''s "Feeling Pain and Being in Pain" argues asymbolia shows pain''s
  unpleasantness can be detached.


