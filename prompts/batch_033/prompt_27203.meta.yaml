  then the badness of pain isn''t part of pain itself; it''s just our reaction to
  it — so pain isn''t really bad, we just make it bad." The subtle correction: asymbolia
  actually supports the view that the unpleasantness/badness is a distinct component
  within normal pain experience, not that it''s an optional add-on; the asymbolic
  lacks the affective component, so their "pain" isn''t the same complete experience.
