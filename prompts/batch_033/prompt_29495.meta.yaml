  "I am trying to work out what I actually think about when a human being is dead,
  starting from my reactions to concrete cases rather than from any official definition.


  Here are my verdicts.


  1. After a catastrophic injury, a patient has lost all brain and brainstem function;
  a ventilator keeps the chest moving and the heart beating, and the skin is warm.
  I think the patient is dead.

  2. A patient''s heart and lungs have been destroyed, but a machine oxygenates and
  pumps the blood, and the patient is awake and talking. I think the patient is alive.

  3. A patient has lost all cortical function — no awareness and no responsiveness
