  a minute later the heart resumes beating on its own. I think the patient was not
  dead at the moment of the declaration.

  5. An infant is born with a functioning brainstem but no cerebral hemispheres; the
  infant breathes, cries, and has reflexes, but will never be conscious. I think the
  infant is alive.

  6. A person is pulled from icy water with no pulse and no breathing and a core temperature
  of 18°C. I think the person is not dead yet — not until rewarming has been tried
  and has failed.

  7. A patient who meets the clinical criteria for whole-brain death is kept on a
  ventilator because she is pregnant, and her body continues to maintain the pregnancy
  for weeks. I still think the patient is dead, though I find this case harder to
