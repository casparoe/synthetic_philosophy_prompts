  Harsanyi''s theorem is sometimes debated: does it require interpersonal comparability?
  The standard presentation: individual utilities are vNM (cardinal, unique up to
  positive affine transformations). The theorem produces a social welfare function
  as a weighted sum, but the weights depend on the arbitrary scaling of individual
  utilities; changing the scaling changes the weights. So the weighted sum is not
  invariant to individual utility transformations unless you fix units. Harsanyi himself
  argued that the weights represent the observer''s value judgments and that with
  the "extended preferences" framework, interpersonal comparisons are implicit. The
  subtle issue: the theorem alone doesn''t pin down the weights; they are indeterminate
  (up to the choice of units). Many people mistakenly think it proves utilitarianism
  with equal weights. Actually Harsanyi''s impartiality argument (that a rational,
  impartial observer behind a veil of ignorance would assign equal probabilities to
  being each person) gives equal weights.


