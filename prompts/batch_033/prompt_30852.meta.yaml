  Cohen''s easy knowledge problem: Suppose I know the table is red by looking. From
  that, via a simple inference, I can know that the table is not white with red lighting.
  So I can know my colour vision isn''t being fooled in this case. But can I thereby
  come to know that my colour vision is reliable in general? The problem is that it
  seems I can get "easy knowledge" of the reliability of my perception from perception
  itself, without independent evidence. This is problematic because if my perception
  were unreliable, I couldn''t legitimately use it to establish its own reliability.


  Bootstrapping (Vogel): You can bootstrap justification for the reliability of your
  perceptual processes: each time you look at something and form a true belief ("that''s
  a red wall"), you can infer "my visual perception produced a true belief on this
  occasion," and after many such cases, conclude "my visual perception is reliable."
  This seems to give an illicit route to reliability knowledge.


  There''s a distinction: easy knowledge involves a single instance reasoning to the
  falsity of a sceptical hypothesis (or to reliability?), whereas bootstrapping involves
  accumulating track-record evidence. But they''re related; both are problems for
  reliabilism and for basic knowledge.


  Actually, in Cohen''s easy knowledge problem, the worry: basic knowledge (knowledge
  not based on prior knowledge that perception is reliable) plus closure under known
  entailment yields knowledge of the denial of sceptical hypotheses too easily. Bootstrapping
  is a particular way to get easy knowledge: track-record argument.


