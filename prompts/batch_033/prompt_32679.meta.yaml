  Key conceptual dependencies for teaching CH:

  1. Sizes of infinite sets via bijection, not "number of elements."

  2. Countable vs uncountable; Cantor''s diagonal argument that |ℕ| < |ℝ|.

  3. The cardinal 2^ℵ₀ = |ℝ| (continuum).

  4. ℵ₁ as the least uncountable cardinal (needs well-ordering/ordinals, or at least
  the idea of "the next size up" — subtle: without AC, does "least uncountable cardinal"
  make sense? Yes, ℵ₁ is defined as the cardinality of the set of countable ordinals;
  under AC every set is well-orderable so cardinals are alephs, but ℵ₁ exists regardless
  via Hartogs? Actually ℵ₁ exists in ZF as the least ordinal not in bijection with
  ω. Fine.)

  5. CH: 2^ℵ₀ = ℵ₁, i.e., no set of cardinality strictly between ℕ and ℝ.

  6. The independence: Gödel (L satisfies CH) and Cohen (forcing can violate CH) —
  CH is independent of ZFC (assuming ZFC consistent).

  7. The philosophical point: independence ≠ "no fact of the matter"; ZFC doesn''t
  decide CH but there might be a determinate answer about the real set-theoretic universe;
  candidate new axioms (large cardinals, forcing axioms, Woodin''s Ω-logic, etc.)
  — but leave out for this level maybe.


  Misconceptions:

  - "The real numbers are ''the next size up'' from the naturals, so 2^ℵ₀ = ℵ₁ by
  definition." (Common: students think there''s a natural sequence ℵ₀, ℵ₁, ... where
  each is the powerset of the previous. Actually ℵ₁ is the least uncountable cardinal;
  whether 2^ℵ₀ = ℵ₁ is exactly CH. Also 2^ℵ₀ need not equal ℵ₁ absent CH.)

  - "Cantor proved there''s no set between ℕ and ℝ." (Cantor proved |ℕ|<|ℝ|; the nonexistence
  of intermediates is CH, which is independent.)

  - "CH has no answer / is meaningless because it''s independent of the axioms." (Independence
  from ZFC doesn''t imply no determinate truth value about the standard model; analogous
  to independence in groups vs arithmetic? Need careful analogies.)

  - "If CH is independent, mathematicians can just choose whichever is convenient."
  (Pluralism vs. realism; formalist error.)

  - "CH says there are more reals than naturals" (no, that''s Cantor''s theorem; CH
  is the stronger claim about no intermediates).

  - "The diagonal argument shows the reals are ℵ₁" or "uncountable means ℵ₁."

  - "Adding more axioms could make CH true and false, contradiction" — confused about
  models: CH holds in some models of ZFC and fails in others; each model is a different
  universe; not a contradiction.

  - "The continuum is 2^ℵ₀, and ℵ₁ is defined as 2^ℵ₀" (again).

  - "Generalized CH: 2^ℵ_α = ℵ_{α+1} for all α" — maybe leave out.


