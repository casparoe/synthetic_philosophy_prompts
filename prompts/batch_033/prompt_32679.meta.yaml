  the set of countable ordinals ω₁ as the concrete witness to ℵ₁ — it''s the least
  uncountable set, and the question "is there a subset of ℝ of size ℵ₁ but not all
  of ℝ" is equivalent to CH (under AC, since every subset of ℝ is well-orderable...
  actually under AC every subset of ℝ has some cardinal; CH says no cardinal strictly
  between; equivalent: every uncountable subset of ℝ has cardinality 2^ℵ₀. Wait, under
  CH, every uncountable subset of ℝ has the cardinality of the continuum, i.e., there
  are no uncountable subsets of ℝ of size ℵ₁ < 2^ℵ₀. Yes, CH equivalent to: every
  uncountable subset of ℝ has cardinality of the continuum. And CH implies 2^ℵ₀ =
  ℵ₁.)


