  They tend to view epistemicism as a non-starter because it seems to require an implausible
  metaphysics of reference and an implausible epistemology of vagueness.


  My own argument, in outline, runs as follows. (1) Supervaluationism gives up bivalence
  and classical logic, which is a heavier cost than it first appears — it forces revisions
  to the logic of propositions we use in science and everyday reasoning. (2) The epistemicist''s
