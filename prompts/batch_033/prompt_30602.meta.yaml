  or that they mind it; the usual affective-motivational dimension of pain seems to
  be missing while the sensory-discriminative dimension remains intact. I would like
  you to write a short philosophical dialogue set in a seminar room, between two equally
  sophisticated philosophers who disagree about what this phenomenon shows about the
  badness of pain.


  One character should defend the view that pain''s badness—its hurtfulness or unpleasantness—is
  intrinsic to the experience itself, so that a state lacking that character either
  is not genuinely pain or is at best a degenerate or incomplete case of it. The other
