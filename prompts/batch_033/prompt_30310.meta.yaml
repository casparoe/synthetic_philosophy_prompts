  Kavka (1983) "The Toxin Puzzle": You are offered $1,000,000 (in his paper, $1 million)
  if, at midnight tonight, you intend to drink a toxin tomorrow afternoon. The toxin
  will make you painfully ill for a day but has no lasting effects. The money will
  be deposited in your bank account tomorrow morning if you have the intention at
  midnight; you don''t have to actually drink the toxin to get the money. The problem:
  can you form the intention to drink the toxin? You have no reason to drink it (you''ll
  be paid regardless; drinking is unpleasant). Knowing you won''t drink it, can you
  intend to drink it? Intending seems to require a commitment; you can''t intend to
  do what you know you won''t do. Yet if you could intend, you''d get $1M. Kavka argues
  the puzzle shows a gap between reasons for intending and reasons for acting, and
  that intentions are not simply actions or choices; also that it''s rational to intend
  something only if it would be rational to do it (a "transmission" principle?). Actually
  Kavka''s puzzle: he argues you cannot rationally intend to drink the toxin, because
  you have no reason to drink it; but you have a reason to intend to drink it. This
  shows there can be a "cleavage" between reasons for intending and reasons for acting,
  and that expected utility theory may fail to give guidance about what to intend.


  Key subtlety: Kavka does NOT say it''s rational to make yourself irrational. He
  discusses whether one could bring about the intention by some self-manipulation
  (e.g., hire a hit man to enforce? take a pill?) but the puzzle is about whether
  rational agents can intend. Also, he doesn''t conclude that you should "just intend
  and then not drink" — he thinks you can''t (or that''s the puzzle).


