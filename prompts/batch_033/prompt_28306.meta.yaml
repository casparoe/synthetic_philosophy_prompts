  Chinese Room "prove too much" argument:


  (1) Searle''s Chinese Room shows that a system can pass the Turing test for understanding
  Chinese (input Chinese, output Chinese, by manipulating symbols according to rules)
  without understanding Chinese.

  (2) The only difference Searle identifies between the room and a human Chinese speaker
  is that the human''s rules are implemented in neurons rather than in a person following
  a rulebook.

  (3) But the same argument applies at the level of neurons: each individual neuron
  doesn''t understand Chinese; it just responds to chemical and electrical inputs
  according to rules.

  (4) So a human Chinese speaker is just a system of parts that don''t understand
  Chinese, each manipulating "symbols" (neurochemical signals) by rules.

  (5) By parity of reasoning, the human doesn''t understand Chinese either.

  (6) But humans do understand Chinese.

  (7) Therefore Searle''s argument proves too much and must be flawed.


