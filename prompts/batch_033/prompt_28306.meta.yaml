  Material constitution: The classic puzzle. The statue is made of the same clay as
  the lump. Are they one thing or two? Key moves:

  - Monism (identity): the statue = the lump; apparent property differences are explained
  away (e.g., via sortal-relative identity (Geach), counterpart theory, or denying
  that modal properties are genuine).

  - Pluralism (constitution view, e.g., Baker): statue ≠ lump; they are two objects
  coinciding; the statue is constituted by the lump; constitution is not identity.
  Baker''s constitution view explicitly says constitution is a unity relation distinct
  from identity, and denies that just any gerrymandered object exists — she has a
  theory of what makes something a statue (intentions of the sculptor, etc.).

  - Nihilism/eliminativism: there are no statues, only lumps/particles (van Inwagen:
  only simples and living organisms exist; so no statue, no lump? Actually van Inwagen
  says only simples and organisms; statues don''t exist as objects, only particles
  arranged statuewise).

  - Universalism/proliferation: every plurality of particles composes an object (Lewis?
  Sider four-dimensionalism), accepting coincident objects and proliferation.


  My argument''s step (5) says if statue and clay are distinct, then indefinitely
  many coinciding objects follow. The constitution theorist denies this: not every
  predicate picks out a thing; only certain sortals do. So step (5) is the subtle
