  The lottery paradox (Kyburg): If you accept a high-probability rule for rational
  acceptance (accept P if P has probability > threshold), and you accept closure under
  conjunction, then in a lottery you accept "ticket i loses" for each i, and by closure
  accept "all lose," while also accepting "some wins" (probability 1), contradiction.
  So one of: high-probability rule, closure, or consistency must go.


  The preface paradox (Makinson): An author rationally believes each statement in
  her book (each is well-supported), but also rationally believes that at least one
  statement is false (because of induction). This is an inconsistent set of beliefs,
  yet seems rational. So either closure must go or consistency (rational beliefs need
  not be consistent) must go.


