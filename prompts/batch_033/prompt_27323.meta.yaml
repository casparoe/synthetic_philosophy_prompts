  Fitch''s knowability paradox:

  - Knowability principle (KP): ∀p(p → ◇Kp). If p is true then it is possible to know
  p. Or "all truths are knowable."

  - Fitch''s theorem: from KP and minimal modal/epistemic logic, derive ∀p(p → Kp):
  all truths are known. This is absurd.


  The proof uses a sentence like "p and it is not known that p" (p ∧ ¬Kp), i.e., an
  unknown truth. Assume for reductio that this conjunction is known: K(p ∧ ¬Kp). Given
  knowledge distributes over conjunction: Kp ∧ K¬Kp. Since knowledge is factive, K¬Kp
  → ¬Kp. So we get Kp ∧ ¬Kp, contradiction. Therefore it''s impossible to know p ∧
  ¬Kp: ¬◇K(p ∧ ¬Kp). But by KP, if p ∧ ¬Kp is true, then it''s possible to know it.
  So p ∧ ¬Kp cannot be true; hence p → Kp (if p is true, it''s known). That''s the
  paradox.


