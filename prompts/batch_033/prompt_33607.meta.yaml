  The phenomenon: In moral discourse, when a person A blames B for wrongdoing that
  A has also committed (or commits), people often say A is a hypocrite and therefore
  A''s blame is wrong/invalid. But the statement "B did wrong" can be true regardless
  of who says it. There''s a distinction between the content of the blame (is it true?
  is B blameworthy?) and the blamer''s standing to blame (does A have the right or
  entitlement to level the criticism?). The view: a hypocrite can make a true moral
  judgment but lack standing to blame. Some philosophers deny standing is a real thing,
  or reduce it to other considerations.


  The "name" question: The asker might ask "Is there a name for the principle that
  a critic''s own misconduct can make their otherwise-correct criticism illegitimate?"
  The established concept is "standing to blame" (or "moral standing"). The related
  notions: hypocrisy (a mismatch between one''s moral pronouncements and one''s own
  conduct), tu quoque ("you too" fallacy, arguing the opponent''s argument is wrong
  because they''re inconsistent), ad hominem. The carving: tu quoque is usually a
  logical fallacy about the truth of a claim, whereas standing is about the speaker''s
  entitlement to make the claim; the criticism can be true while the critic lacks
  standing. Hypocrisy is the character trait or the inconsistency; standing is the
  normative relation that the hypocrisy undermines. Some argue hypocrisy undercuts
  standing by making the criticism insincere, or by showing the critic doesn''t accept
  the norm, or by making the speech an act of domination, etc.


