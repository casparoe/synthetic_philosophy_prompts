  ### Zorn''s lemma


  An amateur mathematician''s argument: Zorn''s lemma seems to prove every set can
  be well-ordered, including the real numbers, which is absurd because there''s no
  way to write down a well-ordering of the reals. Where does it go wrong?


  Chain:

  (1) Zorn''s lemma: if every chain in a partially ordered set has an upper bound,
  then the set has a maximal element.

  (2) Take the set of all well-ordered subsets of a given set X, ordered by being
  an initial segment (or by extension). Every chain has an upper bound (its union).
  So there''s a maximal well-ordered subset.

  (3) If that maximal subset weren''t all of X, you could tack on the leftover element
  at the end, contradicting maximality. So it is all of X.

  (4) Therefore every set X can be well-ordered. In particular, the real numbers can
  be well-ordered.

  (5) But a well-ordering of the reals would give a "first" real, then a "next", and
  so on, which would let you enumerate all the reals one by one — but Cantor showed
  the reals are uncountable.

  (6) Contradiction, so Zorn''s lemma must be false. Where''s the mistake?


