  (1) The Madhyamaka procedure is as follows. When a concept is put forward as capturing
  how things are in themselves — as having svabhāva, or intrinsic nature — one sets
  out the four alternatives of the catuṣkoṭi, the tetralemma: the thing is, the thing
  is not, the thing both is and is not, the thing neither is nor is not. Each alternative
  is shown to collapse, whether by contradiction, by regress, or by covertly presupposing
