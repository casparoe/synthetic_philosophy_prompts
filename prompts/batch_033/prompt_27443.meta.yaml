  I''ve been trying to work out what I actually think about reasons for attitudes
  — reasons to believe, admire, fear, hope, and the like — and I would like to know
  what principle, if any, captures my judgements on a set of cases.


  Here are the cases. First, admiration. Suppose someone powerful threatens to harm
  me unless I admire him. I am inclined to say that I now have a reason to admire
  him, and even that it would be sensible to try to bring myself to admire him. But
  I also want to say that the threat does nothing to make him admirable, and that
  admiration produced only by the threat would be somehow off-target: it would not
  be getting things right. By contrast, if someone has been genuinely kind to me,
  that fact is both a reason to admire them and something that makes them admirable,
  and admiring them for it would be fitting. Second, belief. Evidence that it will
  rain is a reason to believe it will rain, and a belief formed on that basis can
  be correct. But suppose someone offers me a large sum of money to believe it will
  rain, and I manage it. I want to say that the money is a reason of some sort to
  believe — at least, there is a sense in which I ought to try to bring the belief
  about — yet the money does not make the belief correct, or true, or even likely,
  and a belief held only for the money is defective in a way that an evidence-based
  belief is not. Third, fear. Learning that an escaped bear is nearby is a reason
  to be afraid and also makes the fear fitting; being offered a reward to be afraid
  gives me a reason of some sort to be afraid without making the fear fitting.


  My tentative principle is that there are two kinds of consideration: those that
  bear on whether the attitude is correct or fitting — whether the person really is
  admirable, the proposition really is likely, the situation really is dangerous —
  and those that bear only on whether it would be good, prudent, or otherwise advantageous
  to be in the attitudinal state, independently of whether the state fits its object.
  But I cannot make this precise, and I can already feel it straining: I am not sure
  whether the money is really a reason to believe, or only a reason to take steps
  that cause belief; I am not sure whether ''advantageous to be in the state'' can
  be spelled out without smuggling in the first kind; and I am not sure the two kinds
  are exhaustive.


  What I would like from you is this: state the principle as precisely as you can,
  say which of my verdicts it forces me to revise and which it saves, and then apply
  it to the case I keep going back and forth on. A friend who is dying asks me whether
  I believe she will recover. I know the evidence says she will not. But believing
  that she will recover — and being able to say so truthfully, without pretence —
  would make her last weeks markedly better. Is that a consideration of the first
  kind, the second kind, or neither? If you think my framing is confused from the
  start — for example, that the money simply is not a reason to believe, or that my
  two kinds collapse into one another — please say so plainly rather than trying to
  force a principle onto the cases.


