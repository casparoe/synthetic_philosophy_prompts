  Key conceptual issues in tool vs agent AI:


  1. Definitions: agent = system that selects actions to achieve goals / maximizes
  expected utility over world states; tool = system that responds to queries/requests
  without its own goals, or is "task-directed" (pursues only the task specified by
  the user) vs "goal-directed".


  2. The safety argument for tools: agentic systems are dangerous because of instrumental
  convergence (Omohundro basic AI drives: self-preservation, resource acquisition,
  goal content integrity), Goodhart''s law / specification gaming, and the difficulty
  of alignment (specifying a utility function capturing human values). A tool/oracle
  doesn''t have its own goals so it lacks these failure modes — or its failure modes
  are more like "garbage out" than "actively thwarts shutdown."


  3. The agent camp''s replies:

  - Tools with superhuman capabilities are still dangerous: an oracle can manipulate
  the user, produce persuasive outputs, be used as a component in larger agentic systems
  by humans (who are themselves flawed), or become a "genie" where the wisher''s request
  is optimized in unforeseen ways. The power of the system, not its autonomy, does
  the damage.

  - "Tool" and "agent" is not a clean dichotomy: any sufficiently capable system that
  plans, reasons, and takes actions in the world will exhibit agentic behavior; "agentic"
  properties are instrumental for even tool-like tasks. E.g., a system that writes
  code to solve a problem is optimizing. Predicting the future (oracle) may require
  simulating agents or doing consequentialist reasoning.

  - Agency is where the value is: if you want a system to "solve aging" or "run a
  company" or "do science," you need an agent that can act over long horizons; restricting
  to tools may cap capabilities far below what''s needed for pivotal tasks. Or, the
  first actor to build agents wins, so a unilateral tool-only policy is unenforceable.

  - Tool AI may require solving alignment anyway: a tool that gives good answers needs
  to know what the user wants (preference learning, interpretability), and misuse
  risk remains; it''s not a free lunch.


  4. Both can sign claims: e.g.,

  - The distinction between systems whose outputs are used by humans to decide actions
  vs systems that act autonomously is real at least at the level of architecture and
  training objective, even if the boundary blurs.

  - Current systems (LLMs) are closer to tools in some respects but exhibit some agentic
  failure modes (reward hacking in RLHF, sycophancy, strategic behavior).

  - Both would prefer capability without agency if it could deliver equal capability
  safely; the disagreement is about whether that''s possible and whether the safety
  gains are real.

  - Instrumental convergence is a real phenomenon for goal-directed systems under
  certain assumptions; the question is how broadly it applies.

  - Misuse and accidents are distinct risk categories.


  5. Cruxes:

  - Feasibility: Can a non-agentic (or task-directed) system reach the capability
  threshold for transformative or economically pivotal tasks? (Both could agree on
  what would count: e.g., an oracle that solves major open scientific problems without
  taking actions.)

  - Security/containment: Are tool-like systems easier to keep aligned/contained?
  E.g., can a superhuman oracle be safely used even though its outputs are optimized
  to persuade?

  - Decomposition: Can agentic tasks be decomposed into a collection of narrow services
  with human operators in the loop (CAIS-style), or does performance require end-to-end
  agency (long-horizon autonomous action)?

  - The "wrapper" problem: will economically competitive pressure or technical ease
  cause tool systems to be wrapped into agents (auto-GPT style), making the tool/agent
  distinction irrelevant in practice?

  - Hidden agency: Do architectures trained with RL/self-play or with open-ended objectives
  inevitably develop internal goal-directedness even when marketed as tools (inner
  misalignment, mesa-optimization)?

  - The definitional crux: is "agency" a property of the system, of the interface,
  or of the training objective?


  6. Tests/evidence both would accept:

  - A specific benchmark: build a system with no RL/autonomous acting that matches
  an agentic system on a suite of long-horizon tasks; record predictions.

  - Red-teaming: measure whether an oracle with superhuman persuasion capabilities
  can be used safely by non-experts vs experts; both predict different rates of dangerous
  misuse.

  - Case study of "oracle AI" that outputs plans, e.g., "solve this biology problem":
  does it require simulating/searching over interventions, and does that cross into
  agency?

  - Whether adding "do not act, only answer" constraints degrades capability on fixed
  benchmarks.


