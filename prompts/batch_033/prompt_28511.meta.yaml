  calculus, general recursion, register machines, etc.) is a proven theorem, but that
  only shows those formal models coincide, not that they capture the informal notion.
  The physical Church-Turing thesis (PCTT) claims that any function computable by
  any physical process is Turing-computable; it''s stronger, empirical, and contested
