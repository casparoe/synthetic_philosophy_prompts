  Essay notes: "Orwellian and Stalinesque revisions and the color phi phenomenon."


  The distinction: Dennett (in "Consciousness Explained," ch. 5 "Orwell and Stalin"?)
  — Orwellian revision: memory gets rewritten after the fact (like Ministry of Truth
  altering records); Stalinesque revision: experience itself is edited before it reaches
  consciousness (like a show trial where the verdict is fixed in advance). Applied
  to color phi: two dots, red then green, separated by ~200 ms; subjects report a
  single moving dot that changes from red to green roughly midway. Problem: how can
  the subject experience green before the green dot appears? Two solutions: Orwellian
  — you initially see red then green stationary dots but memory revises it into a
  moving dot; Stalinesque — your experience is delayed so the "editing" happens before
  you become conscious of it, producing a seamless moving dot. Dennett & Kinsbourne
  argue the two accounts are indistinguishable in principle: no empirical test can
  tell them apart, because any evidence would itself be a memory report. And they
  claim the distinction is a false dichotomy—there''s no single "finish line" in the
  brain where editing before vs after makes sense.


  Essay thesis/notes: "The Orwellian/Stalinesque distinction only looks like a real
  distinction if you assume a Cartesian Theater — a place and time where experience
  ''happens'' and becomes available to a single audience. Once you drop that, the
  two accounts are not rival empirical hypotheses but two descriptions of the same
  underlying process, and asking which is true is like asking whether the dollar fell
  before or after the inflation."


  Ask for comments: does the argument succeed? Where is it weak? Is there any way
  to pry the two apart empirically (e.g., with direct neural readouts)? Does the argument
  overgeneralize to other "editing" phenomena (backward masking, cutaneous rabbit)?


