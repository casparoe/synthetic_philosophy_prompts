  ---


  "Hey, I''m a grad student in philosophy of mind, and I''ve been trying to write
  up a short paper on the color phi phenomenon and the Orwellian/Stalinesque distinction,
  and I''d love comments on the argument I''m sketching. Here''s the idea, in note
  form.


  Setup: in the color phi experiment, two dots flash in quick succession, one red
  then one green, and subjects report seeing a single dot that moves and changes from
  red to green roughly halfway along the path. The puzzle is that the green seems
  to be experienced before the green dot actually appears. The standard split: an
  Orwellian account says the initial experience is of two stationary flashes and the
  moving-dot story gets written into memory after the fact (like records being altered
  retroactively); a Stalinesque account says the whole experience is delayed and edited
  before it ever reaches consciousness (like a show trial with the verdict fixed in
  advance).


  My thesis, roughly: the distinction between Orwellian and Stalinesque revision only
  looks like a real empirical difference if you assume a Cartesian theater—a single
  place and time where experience "becomes conscious." Without that assumption, there''s
  no fact of the matter about whether the editing happened before or after consciousness,
  because there''s no well-defined boundary for "before" to be relative to. Any evidence
  for one account would have to come through report or memory, which is exactly the
  medium the two accounts disagree about, so they can''t in principle be pulled apart.


  Questions: is this argument too quick? Is there a version of the Stalinesque view
  that doesn''t need a Cartesian theater but still says something distinct? And can
  you think of any empirical result—direct neural decoding, maybe—that would actually
  let us choose between the two, or would any such result just re-describe the same
  process? Also, am I right to think the argument generalizes to things like backward
  masking and the cutaneous rabbit, or is it specific to color phi?"


