  ---


  Since 2019, fertility providers in several countries have offered a service that
  goes beyond screening IVF embryos for monogenic disorders such as cystic fibrosis.
  Using genome-wide genotyping, they compute a polygenic risk score for each embryo
  — an aggregate estimate of genetic liability for conditions like schizophrenia,
  type 2 diabetes, and coronary artery disease, and in some offerings for traits such
  as predicted educational attainment. Prospective parents can use these rankings
  to choose which embryo to transfer. The practice is marketed as a way to give a
  future child the best odds of a healthy and flourishing life. It is commercially
  available in the United States with minimal regulation, restricted to serious disease
  in some other jurisdictions, and banned in yet others.


  Treat this practice as a piece of applied philosophy. Your task is not to evaluate
  its scientific validity or its predictive accuracy, but to extract and examine the
  philosophical commitments it presupposes. In particular, address the following questions
  in the sections described below.


  Section 1: The implicit theory (roughly 200 words)

  Reconstruct the view of parental obligation, the value of traits, and the nature
  of disability that the practice seems to presuppose. Does it presuppose something
  like the principle of procreative beneficence — that prospective parents should
  select, from the possible children they could have, the one expected to have the
  best life? If so, what conception of a "better life" is built into the choice of
  which scores to report and select on? Does the practice presuppose that a life with
  schizophrenia or diabetes is straightforwardly worse in a way that licenses selection
  against it, and if so, what does that commit it to about the value of the lives
  of existing people with those conditions?


  Section 2: Strictly presupposed vs. merely compatible (roughly 200 words)

  Distinguish what the practice strictly presupposes from what it merely fits well
  with. For example, must the practice commit to a full welfarist or perfectionist
  theory of value, or is it compatible with several? Does it require that polygenic
  scores track something morally relevant about future well-being, or only that parents
  have a right to act on them? Identify the minimal commitments the practice cannot
  shed without becoming unintelligible as the practice it is.


  Section 3: The eugenics question (roughly 150 words)

  Critics charge that embryo selection on polygenic traits is eugenics. Proponents
  reply that it is liberal eugenics — driven by individual parental choice rather
  than state coercion, and aimed at welfare rather than racial or class hierarchy.
  What does the practice presuppose about whether this distinction matters? Does the
  liberal framing succeed in insulating the practice from the moral objections that
  attach to historical eugenics, or does the practice presuppose that those objections
  were about coercion and state power rather than about something deeper — the attitude
  expressed when we select against certain kinds of lives?


  Section 4: Underdetermination (roughly 150 words)

  Identify where the practice is philosophically underdetermined: points at which
  several rival theories would license it, or where the practice takes no stand. For
  instance, could the practice be endorsed by a pure autonomy view (parents may select
  for any trait they value), by a harm-prevention view (parents should prevent predictable
  suffering), and by a perfectionist view (some traits are objectively better), all
  at once? What does the practice not settle?


  Section 5: What would change under a rival view (roughly 150 words)

  Suppose we replaced the practice''s implicit theory with the expressivist or disability-critique
  view: that selecting against embryos with a given trait expresses the judgment that
  lives with that trait are less worth living, and that this expressive content is
  itself a moral harm. How would the practice have to change? Would it have to stop
  altogether, restrict itself to lethal childhood conditions, or alter how it frames
  and markets its services? Be specific about what would differ.


