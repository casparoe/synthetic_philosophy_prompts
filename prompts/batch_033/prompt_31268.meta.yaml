  Person A (defending lexical threshold): Some harms are so severe that they simply
  can''t be compensated; they have lexical priority. E.g., if preventing one person''s
  being tortured requires sacrificing any amount of mild pleasure across a population,
  we should prevent the torture. Suffering isn''t fungible with pleasure above a threshold.


  Person B: That''s just a dressed-up way of assigning infinite disvalue to certain
  pains. Infinite values make decision-making impossible and lead to absurdity — e.g.,
  a 0.0001% reduction in torture risk would justify literally any cost in mild pleasure,
  and any tiny increase in torture risk could never be offset. That''s not a usable
  ethics.


  A: Not infinite — lexical priority isn''t infinity. It''s a threshold on comparability.
  Like in lexicographic orderings in decision theory: you can compare within dimensions,
  but one dimension dominates. It doesn''t say torture is infinitely bad; it says
  the two kinds of value aren''t on a single scale above the threshold. Commensurability
  fails.


  B: But the whole point of consequentialism is a common currency. If you say pleasure
  and pain aren''t commensurable above a threshold, you lose the ability to make trade-offs
  precisely where trade-offs are hardest. You''re basically smuggling in a deontological
  constraint ("never allow torture for pleasure") under a utilitarian vocabulary.


  A: Not a side constraint — it''s still maximizing, just with a lexicographic ordering.
  And maybe there''s a principled reason: the experience of extreme suffering has
