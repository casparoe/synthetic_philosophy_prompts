  Lexical threshold negative utilitarianism (LTNU): A view in population ethics/normative
  ethics. Classic idea: suffering and happiness are usually commensurable, but there
  is a threshold of suffering beyond which no amount of happiness can compensate;
  extreme suffering is lexically prior. A "lexical" ordering means one criterion takes
  absolute priority. So below threshold, trade-offs allowed; above threshold, prevent
  the extreme suffering no matter how much pleasure is sacrificed. This addresses
  critiques of negative utilitarianism (the "benevolent world-exploder" objection)
  while retaining priority of suffering.


  The commensurability question: Are pleasures and pains even on the same scale? Some
  argue they''re incommensurable or only roughly comparable. J.S. Mill''s higher/lower
  pleasures; Derek Parfit''s "Repugnant Conclusion"; "the asymmetry"; "torture vs.
  dust specks" — Yudkowsky''s "specks vs. torture": would you prefer 3^^^3 people
  get dust specks in eyes or one person tortured for 50 years? Most say torture worse,
