  any amount of the other good). Defenders: it''s not infinity; it''s a refusal of
  the Archimedean assumption (no amount of small goods outweighs one unit of the higher
  good).

  - The Archimedean axiom: for any two outcomes A and B with A better, and any small
  improvement... Actually the Archimedean property: if A is better than B, then repeated
  small increments can eventually bridge any gap; or no good is infinitely better
  than another.

  - Objection about vagueness of threshold.

