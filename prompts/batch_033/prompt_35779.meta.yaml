  Let me think about a good argument for advance directives.


  Core philosophical issue: Should a person''s prior competent wishes (e.g., an advance
  directive refusing life-sustaining treatment) bind their later self who, after dementia,
  seems content and no longer holds those wishes? Views:


  - Ronald Dworkin: precedent autonomy — the earlier competent self has authority;
  we should respect the directive because it reflects the person''s critical interests
  and integrity of their life.

  - Rebecca Dresser: the current self''s interests and experiential welfare matter;
  the earlier self no longer exists in the relevant sense (or at least the later self
  is a different person in terms of interests).

  - Agnieszka Jaworska: respect for the later self''s autonomy, even if demented,
  because they can still value.

  - Allen Buchanan & Dan Brock: maybe.


  A "prove too much" argument could be:


  (1) If a person''s earlier competent decision binds them later, it must be because
  the earlier and later selves are the same person.

  (2) If they are the same person, then by parity, any earlier decision binds the
  later self — including decisions that later seem foolish, repented, or harmful.

  (3) But we routinely allow people to revoke their earlier decisions (contracts can
  be broken with damages, wills revoked, etc.)...

  (4) So same person alone doesn''t establish bindingness; something about the specific
  case...

  (5) The only difference in dementia cases is that the later self is cognitively
  diminished and can''t revoke.

  (6) But if diminished capacity justifies enforcing earlier decisions, then... we
  could bind anyone who later becomes incompetent, and more generally...

  (7) Conclusion absurd? Or the argument shows advance directives lack authority.


