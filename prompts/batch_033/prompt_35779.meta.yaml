  directive should be respected because it expresses their values and critical interests.
  The later demented self''s current experiential interests (contentment) don''t trump
  the earlier critical interests.


  Dresser''s view: After severe dementia, the person is no longer the same person
  in the morally relevant sense; the current individual''s interests should govern.
  Respecting the directive can harm the current self for the sake of a person who
  no longer exists.


  Jaworska: Even demented individuals retain the capacity to value (not just have
  desires), so their current values should be respected; an advance directive may
  be overridden by the later self''s current values.


  Buchanan/Brock: Advance directives have authority based on personal identity plus
  the value of self-determination over time; but there may be limits when the later
  self has conflicting present interests.


