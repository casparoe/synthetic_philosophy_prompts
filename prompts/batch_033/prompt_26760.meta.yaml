  before the core argument of Laws Book 1–2 can land? The students will come in knowing
  the Symposium''s contrast between Socrates'' imperviousness to wine and Alcibiades''
  drunken disorder; they will also know the Republic''s suspicion of appetite and
  its call to rational self-mastery. The pivot the Laws makes — that controlled drunkenness
  can be a positive instrument of moral education, a pharmacological test of character
  — will strike them as contradictory to the Plato they know. I need the session to
  make that pivot feel like a genuine development rather than a contradiction.


