  The flaw: (4) does not follow from (1)-(3). Knowing ch(A) ∈ {0,1} is not the same
  as knowing ch(A)=0 or knowing ch(A)=1. PP only applies when you know the exact value
  x. Even then, PP says conditional credence, so to apply it you''d need to condition
  on ch(A)=0 and on ch(A)=1 separately and average: Cr(A) = Cr(A|ch=0)Cr(ch=0)+Cr(A|ch=1)Cr(ch=1)=0*Cr(ch=0)+1*Cr(ch=1)=Cr(ch=1).
  So Cr(A) equals your credence that the chance is 1, i.e., your credence that A happened.
  That can be intermediate. So (4) is invalid.


  Also, there''s an equivocation in (4): "credence should be either 0 or 1 — certain
  it happened or certain it didn''t." Actually "my credence should be either 0 or
  1" is a disjunction about what your credence should be; but the PP gives a conditional:
  if ch=0 then credence 0, if ch=1 then credence 1. Since you don''t know which conditional
  applies, you don''t know which credence to have; indeed your actual credence is
  the expectation. So the move from a disjunction of conditional requirements to an
  unconditional disjunctive requirement is a modal/scope error: from (ch=0 → should
  be 0) and (ch=1 → should be 1) and knowing (ch=0 ∨ ch=1), you cannot infer (should
  be 0 ∨ should be 1) in the epistemic sense. Good, that''s the scope/quantifier shift
  the type mentions.


