  keyed to the answer he''s most likely to give so I can keep the pressure on:


  - the falsifiability worry: if every act of categorization is an analogy, the claim
  starts to sound unfalsifiable — his stock reply will probably be that literal meaning
  is just frozen analogy, so push on whether a frozen analogy is still doing any explanatory
  work or whether that''s just the history of the word, not the mechanism.

  - the grounding worry: analogy seems to presuppose similarity, and similarity is
  cheap (anything''s like anything in some respect) — if he says similarity is produced
  by the mapping rather than an input, ask what constrains the mapping and whether
  there''s a non-analogical residue (perceptual, spatial, causal) doing the real work.

