  Interpersonal utility comparisons: the question of whether and how we can compare
  the utility/wellbeing of different persons. Positions:


  - Ordinalism/No comparisons (Robbins): interpersonal comparisons are not meaningful/verifiable;
  welfare is only intrapersonally comparable. Social choice must use Pareto etc.

  - Cardinal comparability without ratio: can compare differences in utility levels
  across people (unit comparability), not levels.

  - Ratio comparability: can compare ratios (zero point fixed).

  - Full comparability: both levels and units comparable.

  - Harsanyi: extended preferences/empathetic preferences; comparisons via imagining
  being someone else.

  - Naturalistic/objective accounts: comparisons via objective list or capabilities
  (Sen).

  - Hedonic/neural accounts: comparisons via measuring pleasure/pain (Edgeworth''s
  hedonimeter, modern neuro).

  - Revealed preference/economic: infer from choice and income? Actually revealed
  preference struggles with interpersonal comparisons.

  - Partial comparability (Sen): comparisons are incomplete/partial, not all-or-nothing.


