  Desiderata a theory of intergenerational obligations (in climate context) must meet:

  1. Handle the non-identity problem: choices that affect who will exist — a policy
  can be worse for the particular future people who exist, but those people wouldn''t
  have existed under the better policy; so can anyone be wronged? A theory must say
  whether obligations attach to particular persons or to states of affairs/well-being
  levels, and not silently switch.

  2. Handle the timing/existence asymmetry: future people can''t reciprocate or consent;
  they don''t exist yet. A theory must explain how obligations can be owed to people
  who don''t exist and can''t affect us, without invoking reciprocity.

  3. Discounting: must give an account of whether future welfare counts for less merely
  because it''s later (pure time preference), and distinguish pure time preference
  from discounting for growth (if future people will be richer) and from uncertainty
  about existence. Must not let a small discount rate make large far-future harms
  vanish.

  4. Uncertainty about future preferences/values and about what future people will
  need: must handle decisions under deep uncertainty without either paralysis or pretending
  we know.

  5. Aggregation across an unbounded future: how to compare policies when future generations
  could be indefinitely many — infinity problems, impossibility of aggregating; must
  not let the choice depend on arbitrary truncation of the time horizon.

  6. Distribution within and across generations: must handle trade-offs between present
  poor and future rich or vice versa; must not let "future people will be richer"
  excuse all climate delay (or must justify it).

  7. Catastrophic/long-tail risks: must handle low-probability catastrophic outcomes
  and the possibility of extinction, where there may be no future people at all.

  8. The demands on the present generation: must say something about how much sacrifice
  is required now, given uncertainty and competing present needs — and avoid both
  "do nothing" and "sacrifice everything."

  9. Consistency with intragenerational justice: a theory shouldn''t demand enormous
  transfers to the future while ignoring present poverty, or vice versa.

