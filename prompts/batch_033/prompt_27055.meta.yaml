  under hypotheses that contain more observers, and therefore weights hypotheses accordingly.
  The result is that the same body of empirical evidence leads the two camps to systematically
  different credences, and in the presumptuous philosopher case SIA appears to license
  high confidence in theories that simply posit vast numbers of observers, with no
  independent empirical support.


