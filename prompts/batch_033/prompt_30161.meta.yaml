  Let me recall the Kelly/geometric rationality facts precisely:


  - For a gamble that returns a multiplicative factor, the Kelly criterion maximizes
  the expected log of wealth, which maximizes the geometric mean growth rate asymptotically.

  - Maximizing expected log wealth is equivalent to having logarithmic utility, but
  the Kelly argument is often presented as a normative rule independent of risk preferences,
  based on long-run growth.

  - The "time average vs. ensemble average" point from ergodicity economics: For non-ergodic
  multiplicative processes, the time-average growth rate is the logarithm of the geometric
  mean; maximizing expected log wealth maximizes the time-average growth rate. The
  ensemble average can be dominated by rare huge outcomes (like the St. Petersburg
  paradox / Ponzi-like bets).

  - Samuelson''s critique: Kelly is not a universal norm; it''s just one utility function;
  repeated bets don''t make log utility mandatory if you have other preferences; "maximizing
  expected log" is optimal only if you have log utility or care about long-run growth
  asymptotically. There are also points about full vs. fractional Kelly.


  I should not overstate "unique function" claims. I can say "the claim that the logarithm
  occupies a privileged role in multiplicative settings, so that optimizing expected
  log growth is not merely one risk preference among others." That''s safe.


