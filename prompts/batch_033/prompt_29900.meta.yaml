  a follow-up that anticipates the reply she''s most likely to give:


  - the flicker-of-freedom strategy: even in the cases she likes, the agent seems
  to retain some alternative (a flicker, like deciding to do otherwise or at least
  showing a sign of it before the intervener steps in), so maybe PAP only needs revising,
  not rejecting. The follow-up should deal with her likely line that the flicker is
  too thin to ground moral responsibility.

  - the dilemma defense: the intervener has to be triggered by a prior sign of what
  the agent will decide. Either that sign deterministically guarantees the decision
  (in which case the example assumes determinism and begs the question against the
  incompatibilist), or it''s merely a reliable indicator (in which case the agent
  could have done otherwise after all). I want a question that makes her take a stand
