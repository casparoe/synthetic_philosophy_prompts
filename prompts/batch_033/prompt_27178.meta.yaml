  Dutch book theorem: If a set of betting prices (or degrees of belief) violates the
  probability axioms (non-negativity, normalisation, finite additivity), then there
  is a Dutch book — a finite set of bets each of which the agent considers fair (or
  favourable), whose net payoff is negative in every possible state. Converse Dutch
  book theorem: if credences satisfy the probability axioms, no Dutch book is possible
  (for a finite set of bets at those odds). The argument is due to Ramsey/de Finetti.
  The details: the agent''s fair betting odds determine prices. If credence in A is
  p, the agent will pay pS for a bet that pays S if A and 0 otherwise, or sell such
  bets. Incoherence (e.g., p(A) + p(¬A) ≠ 1, or negative probabilities, or probabilities
  >1) allows a book. There are subtleties: finite additivity vs countable additivity;
  the converse assumes the agent is not required to accept a bet that''s strictly
  fair? Actually to make a Dutch book, you need the agent to accept bets at their
  fair odds; the standard assumption is that a credence of p in A makes both buying
  and selling a bet on A at price p acceptable. If the agent only accepts bets that
  are favourable, strict incoherence still allows a book by slightly favourable prices.
  The converse: if credences are coherent (probabilities), there is no set of bets
  each acceptable (at fair or favourable odds) that guarantees a loss. This is essentially
  the separating hyperplane theorem: coherent prices lie in the convex hull of state
  prices; no sure loss iff a state price vector exists.


