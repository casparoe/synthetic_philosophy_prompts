  In my work on epistemic defenses of majority rule I have been trying to get clear
  on how much of the classical Condorcet jury theorem survives once its idealizations
  are relaxed one at a time. I would like a ranking of the following six deviations
  from the classical theorem, ordered by how much of the theorem''s core conclusion
  they preserve. By "core conclusion" I mean the pair of claims that (a) the majority
  is more likely to be correct than any single voter and (b) the probability that
  the majority is correct tends to 1 as the group grows. The six deviations, each
  considered while the other classical assumptions are held fixed, are:


