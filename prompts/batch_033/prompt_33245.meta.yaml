  Actually, Condorcet jury theorem has a well-known tension: independence assumption
  vs. common cause. The in-the-weeds issue: with a common cause, votes are conditionally
  independent given the state, but not unconditionally; if the common signal is informative,
  the theorem still works; if voters have a shared bias (e.g., correlation arising
  from shared misinformation), majority can be less competent than individuals. There''s
  a literature on how the theorem extends to correlated votes: the "jury theorem with
  correlated votes" (Ladha 1992, Dietrich & Spiekermann, etc.). But the prompt shouldn''t
  require citations; can describe models generically.


