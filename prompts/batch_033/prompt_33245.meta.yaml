  correctly, these probabilities vary across voters, and their average is above 1/2.

  2. Votes are correlated only through the state of the world: conditional on the
  state, votes are independent, so all correlation is generated by the common cause
  of the state itself.

  3. Votes are correlated through a shared bias not reducible to the state: there
  is a common shock that makes all voters more likely to err in the same direction.

  4. All voters observe the same public signal before voting and take it into account
  in addition to their private information.

  5. Voters are strategic: each votes to maximize her own expected utility, conditioning
  on the event that her vote is pivotal, under common values.

  6. Voters deliberate before voting, exchanging some or all of their private information.


  Please rank these six from the one that preserves the most of the core conclusion
  to the one that preserves the least, and give a one-sentence justification for each
  placement. If any two are not strictly comparable in your view, say so and explain
  why.


