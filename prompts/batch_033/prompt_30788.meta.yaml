  Positions in the moral dilemmas debate:

  1. Genuine dilemmas are impossible (Kant, maybe Ross? Actually Ross allows prima
  facie conflicts but says there''s always a right answer; deontic logicians often
  adopt "no conflicts" via agglomeration + ought implies can). They hold that if two
  obligations conflict, at least one isn''t really an obligation (or they''re not
  both all-things-considered).

  2. Genuine dilemmas are possible (Williams, Marcus, Nussbaum): two all-things-considered
  obligations can conflict, and whichever you do you violate one; you should feel
  regret/remainder; this is not incoherent.

  3. Defeasible/particularist positions: obligations are pro tanto, conflict is routine,
  the problem is a pseudo-problem created by treating duties as absolute.


  Mapping to game design:

  - Position 1: the game is never truly unwinnable; if the player can''t satisfy both
  quests, the real problem is that the player misread the quest log or the designer
  failed. "Ought implies can" = "a fair game never requires the impossible."

  - Position 2: some games are built around unwinnable choices; the player must betray
  one faction; the persistent consequence/regret is a mechanic, not a bug.

  - Position 3: quest objectives are always pro tanto; the real conflict is in the
  priority system, and "winning" just means the objective with highest priority.


