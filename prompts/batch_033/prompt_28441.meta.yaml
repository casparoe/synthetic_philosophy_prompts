  Now whoever utters that which he holds in his mind either as belief or as opinion,
  even though it be false, he lies not. For this he owes to the faith of his utterance,
  that he thereby produce that which he holds in his mind, and has in that way in
  which he produces it. Not that he is without fault, although he lie not, if either
  he believes what he ought not to believe, or thinks he knows what he knows not,
  even though it should be true: for he accounts an unknown thing for a known. Wherefore,
  that man lies, who has one thing in his mind and utters another in words, or by
  signs of whatever kind. Whence also the heart of him who lies is said to be double;
  that is, there is a double thought: the one, of that thing which he either knows
  or thinks to be true and does not produce; the other, of that thing which he produces
  instead thereof, knowing or thinking it to be false. Whence it comes to pass, that
  he may say a false thing and yet not lie, if he thinks it to be so as he says although
  it be not so; and, that he may say a true thing, and yet lie, if he thinks it to
  be false and utters it for true, although in reality it be so as he utters it. For
  from the sense of his own mind, not from the verity or falsity of the things themselves,
  is he to be judged to lie or not to lie. Therefore he who utters a false thing for
  a true, which however he opines to be true, may be called erring and rash: but he
  is not rightly said to lie; because he has not a double heart when he utters it,
  neither does he wish to deceive, but is deceived. But the fault of him who lies,
  is, the desire of deceiving in the uttering of his mind; whether he do deceive,
