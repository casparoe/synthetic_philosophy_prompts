  Domain: Mechanistic anomaly detection: what counts as the same mechanism?


  This is about philosophy of mechanisms (Machamer, Darden, Craver; Bechtel; Glennan),
  causation, and change detection. In statistics/ML, anomaly detection flags when
  a data-generating process has shifted (concept drift vs. data drift, changepoint
  detection, statistical process control). The philosophical question: when we say
  a "mechanism" has changed vs. just its inputs or outputs changed, what criterion
  of mechanism identity are we presupposing?


  The practice: A predictive maintenance system in a factory monitors vibration spectra
  of a turbine; a control chart flags when the distribution changes; an engineer then
  decides whether "the same machine is doing the same thing under new conditions"
  vs. "the mechanism has broken/been replaced." Similarly, fraud detection: a model
  flags when transaction patterns deviate; investigators ask whether the underlying
  fraud scheme is the same scheme adapting, or a new scheme.


  What theory of mechanism identity does this practice presuppose? Options:

  - A mechanism is individuated by its components, activities, and their organization
  (Craver). Anomaly = change in components/activities/organization, not merely in
  inputs/outputs.

  - A mechanism is a stable causal structure; same mechanism = same structural equations
  (Woodward''s invariance/modularity). Anomaly = change in the causal graph or invariant
  relationships, vs. mere change in exogenous variables.

  - Statistical/functional individuation: a mechanism is a distribution over observables;
  anomaly = distribution change, full stop. Then "same mechanism" is just a label
  for a stable distribution, and the practice presupposes nothing deeper — or it presupposes
  a functionalist/black-box view.

  - Regularity/predictability: same mechanism = same transition rules; anomaly = prediction
  failure beyond noise.

  - Process/minimality: mechanisms as spatiotemporally continuous processes (Salmon);
  anomaly detection typically doesn''t track continuity, so it presupposes a non-process
  view, or it''s underdetermined.


  The philosophical tension: anomaly detection operates on observables and statistics,
  so it can only detect distribution changes, not changes in unobserved components.
  Yet practitioners speak as if they''ve detected that the mechanism has changed.
  Does the practice strictly presuppose a distributional/functional notion (only observable
  distributions matter) or does it need a richer component-based notion? Is it coherent?
  What would change if we adopted a Craver-style constitutive/component view vs. a
  Woodward-style invariance view?


