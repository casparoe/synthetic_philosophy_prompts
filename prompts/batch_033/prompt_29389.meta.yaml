  Unilateralist''s curse game:

  - N players, each gets a private signal about whether "pressing the button" would
  be good (G) or bad (B) for the group. Actually, the curse is about each person''s
  all-things-considered judgment, not just a signal. But we can operationalize with
  private signals.

  - The group outcome: if no one presses, payoff = 0 (status quo). If anyone presses,
  payoff = +100 if the true state is good, -100 if bad. But players don''t know the
  true state; each gets a private signal with, say, 60% accuracy. Each player can
  press once; if pressed by anyone, the outcome is realized for everyone.

  - Individually: given a "good" signal, expected value of pressing is 0.6*100 + 0.4*(-100)
  = +20, so pressing is individually rational. Given a "bad" signal, EV = -20, so
  don''t press.

  - The group''s aggregate evidence: if the rule is "press iff anyone presses," then
  the group presses whenever at least one person got a good signal. If the true state
  is bad, the probability someone gets a good signal is 1 - 0.4^N (since each sees
  good with prob 0.4 when state is bad? Wait signal accuracy: P(good signal | good
  state)=0.6, P(good signal | bad state)=0.4). For N=16, if state is bad, chance at
  least one presses = 1 - 0.6^16 ≈ 1 - 0.00028 = 0.9997. So the group almost always
  presses when bad. But if the group pooled signals, majority would likely be correct
  (with 16 independent signals, majority accuracy high). So the group, acting on the
  most optimistic signal, does much worse than the group could. This exactly demonstrates
  the curse: the group outcome is governed by the max of the signals, i.e., the most
  optimistic member.


