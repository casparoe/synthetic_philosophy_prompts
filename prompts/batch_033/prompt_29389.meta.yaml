  Desiderata for a decision rule in unilateral action situations:

  1. It must distinguish unilateral action from group action — respect that the de
  facto decision procedure is "act iff anyone judges it good," not "act iff the group
  aggregates."

  2. Handle the asymmetry between errors: false positives (bad acts taken) vs. false
  negatives (good acts missed). Many rules trade these off; the rule should specify
  which asymmetry is warranted and when (e.g., irreversible harms, catastrophic downside).

  3. Handle correlated judgments: if everyone''s optimism comes from a shared bias
  or shared information, the "most optimistic" is not independent evidence; a rule
  should say whether to correct for correlation.

  4. Handle varying competence/expertise: should the most expert get a veto? Should
  estimates be weighted? But weighting can reintroduce curse if the expert is systematically
  optimistic.

  5. Respect information constraints: actors may not know how many others could act,
  or what their thresholds are.

  6. Handle dynamic settings: acting early forecloses others'' ability to deliberate
  (the first-mover advantage), so the rule should say something about wait-and-see
  norms, or about precommitment.

  7. Handle the distinction between cases where the unilateral actor is entitled to
  act (rights) vs. where acting unilaterally is a collective action problem (duties
  to consult).

  8. Respect that the "curse" is about well-intentioned actors with shared goals,
  not strategic bad actors — the rule shouldn''t just be a compliance mechanism.

  9. Handle the case where the group is large: as N grows, the probability that at
  least one member is overoptimistic goes up; a rule should say how group size changes
  the threshold for action.

  10. It should not just be "all agree" because that imposes a veto by the most pessimistic
  and can cause paralysis / the mirror-image curse (group inaction due to the most
  pessimistic member).

  11. It should handle partial information about others'' judgments (e.g., you know
  someone else is more cautious but not their estimate).

  12. It must be psychologically feasible and stable — not just rational in the ideal.


