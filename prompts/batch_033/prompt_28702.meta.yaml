  The classic Condorcet jury theorem (1785): For n voters, binary choice, each voter
  independently has probability p > 1/2 of being correct (homogeneous). Then (1) the
  probability that the majority is correct is greater than p for n ≥ 3 (group better
  than individual); (2) this probability increases with n; (3) it tends to 1 as n
  → ∞.


  Heterogeneous versions exist: if voters have independent competences p_i > 1/2,
  the majority''s competence can exceed the average competence, but may not exceed
  the best individual. And convergence to 1 requires conditions on the sequence (e.g.,
  p_i bounded away from 1/2). Also if some p_i < 1/2, adding them can hurt. So "any
  group of people, each more likely than not correct" plus "approaches certainty"
  is actually a standard but slightly loose statement; the "any group" part hides
  independence. The "bigger always better" hides conditions and heterogeneity.


  Also a subtle point: the theorem assumes votes are sincere and independent; correlation
  (common cause, deliberation, shared information) means the majority does not converge
  to certainty but to the probability that the common cause is correct. This is the
  "Condorcet''s theorem fails under correlated votes" point (e.g., Ladha, Dietrich).
  I know this.


  Also, there''s a "non-asymptotic" issue: the convergence can be slow; with p close
  to 0.5 you need huge groups.


