  What confusion exactly? A good one: The asker thinks the St. Petersburg paradox
  is a practical puzzle about how much you should pay, and that the solution is to
  use something like the Kelly criterion or bounded utility, and concludes expected
  value maximization is wrong. The false presupposition: that the paradox is a counterexample
  to expected utility theory as a norm for finite agents, rather than a puzzle about
  how to handle infinite/superlarge expectations and about idealizations. Or: they
  think "expected value is infinite, so you should pay any finite amount" is what
  EV theory actually recommends, and that this shows EV theory is broken. The subtle
  confusion: the paradox doesn''t show EV maximization is incoherent; it shows that
  with unbounded utility functions and weird distributions, EV can be undefined/infinite,
  and finite agents shouldn''t treat it as a literal decision procedure. Also, the
  actual decision problem is finite (the house has finite bankroll), so the expected
  value is finite and modest.


