  Socialist calculation debate:

  - Mises (1920): without private ownership of the means of production, there is no
  market for capital goods; without market prices for capital goods, rational economic
  calculation is impossible. Money prices for consumer goods could exist under socialism,
  but no prices for producer goods, so planners can''t compare alternative production
  methods.

  - Lange (1936/1938): "On the Economic Theory of Socialism" — conceded that Mises
  was right that prices are necessary, but argued a Central Planning Board can set
  prices for producer goods through trial and error: set provisional prices, instruct
  managers to follow two rules (minimize average cost, produce at marginal cost =
  price), and adjust prices based on shortages/surpluses, mimicking a Walrasian auctioneer.
  Thus socialism can allocate resources rationally without actual capital markets.

  - Hayek: knowledge argument. The data for the equations are never "given" to anyone;
  they are dispersed among millions of individuals; much knowledge is local, tacit,
  "knowledge of the particular circumstances of time and place"; prices are a mechanism
  for communicating information, a discovery procedure. The market''s prices embody
  far more knowledge than any board can collect. Also managerial incentives and innovation;
  the board''s trial-and-error process can''t replicate the competitive discovery
  process because in real competition there is no single mind that knows when a "shortage"
  indicates the need for a specific new product or production technique; entrepreneurs
  guess and risk resources.

  - Hayek also argued Lange''s model treats competition as a static equilibrium problem;
  the real problem is how dispersed knowledge is mobilized, which requires the price
  system and private property so that individuals can act on their local knowledge
  without anyone needing to know the whole.


  Opening move: Lange-style: "The board doesn''t need to know everyone''s preferences
  and costs in advance. It just sets provisional prices, watches for shortages and
  surpluses, and adjusts — exactly like your auctioneer. Where''s the knowledge problem?"


  The Hayekian response should be:

  1. Trial-and-error adjustments at the center require the board to know which goods
  are in shortage/surplus — that''s aggregate information, but not the underlying
  local causes. In a market, the entrepreneur with local knowledge sees a specific
  opportunity and acts on it; the board only sees a statistical discrepancy.

  2. The "data" Lange assumes the board can observe (supply and demand functions,
  or shortages) are not given; they have to be discovered through the competitive
  process itself. The market is a discovery procedure, not just an allocation mechanism
  for known data.

  3. Managers under Lange are given rules (price = marginal cost), but real efficiency
  requires experimentation — trying new products, new techniques — which means someone
  has to bear the risk and have the incentive and the local knowledge to test ideas.
  Central planners can''t generate the dispersed hypotheses.

  4. Even if a board could converge by trial and error, the process would be slower
  and less responsive than decentralized adjustment, and it lacks the institutional
  mechanism (profit and loss, capital markets) for selecting among competing plans.


