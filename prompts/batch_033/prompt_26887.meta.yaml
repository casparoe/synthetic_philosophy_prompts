  Let me think about the content. Revealed preference and meaning of utility: The
  debate about whether utility is just a convenient representation of choice (ordinal
  utility, "utility as preference representation") or something with more content
  (welfare, satisfaction). Classic issues:

  - Samuelson''s revealed preference theory: from observed choices satisfying consistency
  conditions (WARP, GARP), can construct a utility function that rationalizes choices.
  Utility becomes an index representing choices, not a psychological substance.

  - The question: does revealed preference define utility or discover it? If utility
  is just a number representing choice, then saying "people maximize utility" is nearly
  tautological — unless choices violate consistency axioms, in which case the theory
  is falsifiable.

  - Sen''s critique: choices can be motivated by commitment, sympathy, etc.; revealed
  preference can''t distinguish maximizing utility from acting on other concerns;
  also the problem of menu dependence, choice of preferences, etc.

  - Hausman''s critique: preference as total comparative evaluation vs. expected advantage;
  the theory needs preferences to be complete and transitive, which are substantive
  claims.

  - The meaning of utility: ordinal vs cardinal; Bernoulli vs modern; utility as "whatever
  it is that choices reveal" risks vacuity; "the consumer is rational if and only
  if choices satisfy GARP" — but is that a theorem or a definition?

  - Afriat''s theorem: a finite data set is consistent with maximization of a continuous,
  concave, strictly increasing utility function iff it satisfies GARP. This means
  utility maximization has observable content but is very weak.

  - Behavioral economics challenges: choice reversals, framing effects, context-dependent
  preferences — if choices are inconsistent, what does utility mean? Do we save the
  concept by distinguishing decision utility from experienced utility (Kahneman)?


  A good exam question could ask students to confront the tension: "Is the utility
  that revealed preference theory attributes to agents a real feature of the agent,
  or merely a redescription of their choices?" Or the vacuity worry.


