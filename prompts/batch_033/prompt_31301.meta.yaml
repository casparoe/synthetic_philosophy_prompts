  Harsanyi''s aggregation theorem (1955): If each individual''s preferences satisfy
  the vNM axioms and the social preferences satisfy vNM axioms, and social preferences
  respect Pareto indifference (if all individuals indifferent between two lotteries,
  society indifferent), then there exist real numbers a_i and b such that social utility
  W(x) = sum_i a_i u_i(x) + b, where u_i are individual vNM utility functions. Also
  with strong Pareto (if someone prefers and no one opposes) then a_i > 0. This is
  weighted utilitarianism. The utilities are vNM utilities, which are cardinal but
  not interpersonally comparable; however the theorem requires that the social preference
  satisfies vNM axioms with respect to the same probabilities, and Pareto indifference.
  Weights a_i can vary. So it gives weighted utilitarianism, not necessarily equal
  weights. Harsanyi later argued impartiality forces equal weights.


  The philosophical controversy: John Broome, John Weymark, Amartya Sen. Sen argued
  vNM utilities don''t capture interpersonal comparisons; the theorem assumes that
  social preferences satisfy EU axioms, which already smuggles in consequentialist/utilitarian
  structure. Broome defends. The debate is about whether the theorem provides a justification
  of utilitarianism or is question-begging.


