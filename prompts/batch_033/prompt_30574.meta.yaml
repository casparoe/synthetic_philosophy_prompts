  Elena began with the familiar worry. Take the fact, or the proposition, that a is
  F. We can distinguish the object a, the property F, and the fact that a is F. But
  the fact is not just the pair of a and F, since a mere list of constituents says
  nothing. So we posit instantiation to join them. Yet instantiation now appears as
  a third constituent, and the same problem recurs: the list of a, F, and instantiation
  is still a list, not a unity. We would need a further relation to tie instantiation
  to a and to F, and so on without end. So no addition of relational constituents
  ever delivers the unity we were trying to explain.


  Marcus replied that the regress is an artifact of a bad demand. It gets started
  only if you assume that a relation cannot simply relate its terms but must itself
  be related to them by a further relation. But that assumption just is the denial
  of what a relation is. It belongs to the concept of a relation that it relates;
  that is not a gap in the analysis but the point at which analysis stops. An infinite
  regress is not by itself a contradiction, so the argument has not shown anything
  to be impossible.


  Elena answered that this is just refusing the question. The original problem was
  to say what distinguishes the fact that a is F from the mere aggregate of a and
  F. If the answer is that F is instantiated by a, and instantiation just relates
  them, then either the notion of combination has been used to explain combination,
  which is circular, or a primitive tie has been posited with no account of why it
  yields unity in this case rather than in any arbitrary collection. A label is not
  a solution.


  Marcus said that not every notion can be defined in terms of something more basic,
  and that a regress can be the form a failed reduction takes. If you insist that
  unity be reconstructed from ingredients that are intrinsically non-unifying, the
  task is impossible, and the infinite regress is simply the shape of that impossibility.
  That can be a result rather than a refutation: unity, or instantiation, is primitive.
  Treating primitiveness as a failure of explanation rather than a legitimate terminus
