  Claims both can sign:

  - The rule-following paradox arises when we consider a speaker who has used ''+''
  for finitely many sums, none exceeding 57, say, and is now asked ''68 + 57''. Both
  agree the speaker means addition, but the challenge is to say what fact about the
  speaker makes it the case.

  - Both agree that the correct answer, given that she means addition, is 125.

  - Both agree that any candidate fact must account for the normativity of meaning:
  it must explain why some future applications are correct and others incorrect, and
  why the speaker can be wrong about what she means.

  - Both agree that finitely many past applications don''t determine a unique function
  (there are infinitely many functions compatible with any finite set of examples).

  - Both agree that simple dispositional accounts face the problem of error: a speaker
  disposed to make arithmetic mistakes would then "mean" something else by ''+'' according
  to the disposition, which seems wrong.

  - Both agree that the problem is not merely epistemic (we can''t tell what she means)
  but metaphysical (what could constitute her meaning one thing rather than another).

  - Both agree that whatever solution is offered, it must not make meaning radically
  non-normative or make it impossible for a speaker to be corrected.


  Disagreements:

  - Whether there must be a fact of the matter about what a speaker means by a term
  at a time.

  - Whether the community''s patterns of use can constitute correctness conditions,
  or merely agreement.

  - Whether a straight solution can be given in terms of dispositions, plus idealisation
  (ideal conditions), without circularity.

  - Whether the sceptical solution can secure genuine correctness rather than just
  communal agreement (the "wrong community" worry).

  - Whether the paradox is a reductio of the demand for constitutive facts or a genuine
  discovery about meaning.


  Cruxes:

  1. The "error" problem for dispositionalism: Can an idealised dispositionalist (e.g.,
  dispositions of the speaker''s underlying mechanisms under ideal conditions) distinguish
  between a speaker who means addition but makes mistakes and a speaker who means
  a deviant function? Each side''s prediction: sceptical side predicts every precisification
  either lapses into circularity or gives wrong verdicts; straight side predicts some
  version can handle error via idealisation without circularity.

  2. The isolated speaker (Robinson Crusoe) case: whether a person alone, never in
  a community, can mean something by a word. Sceptical solution says meaning requires
  a community; straight solution says Crusoe can mean addition. Both agree the case
  bears on whether communal agreement is constitutive or merely epistemic.

  3. The "quus" plus finite-use case: whether the sceptical challenge shows that no
  fact about the speaker decides between plus and quus, or whether a fact such as
  a lawlike disposition/mechanism can. Predictions recorded.

  4. Normativity: whether the sceptical solution can account for the difference between
  being corrected and being brought into conformity. Straight side predicts it cannot
  (it reduces correctness to agreement); sceptical side predicts the notion of "correctness"
  can be replaced by assertability conditions and the straight side''s demand is question-begging.


  Also maybe crux: whether the paradox generalises to all meaning, including "means"
  itself, leading to self-undermining.


