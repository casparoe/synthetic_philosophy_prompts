  I am a high school student, and I have been arguing with a friend about something
  that happened on a Minecraft server we both use. One player spent around a hundred
  hours building a large structure; another player, who knew the server rules forbid
  griefing, destroyed it and took the rare materials. The server could in principle
  be restored from a backup taken the previous day, and the victim was upset but has
  since rebuilt a smaller version. My friend thinks the victim suffered a real harm,
  of the same general kind as having a physical possession vandalised, just smaller
  in scale. I am not sure: nothing in the physical world was damaged, and the loss
  was, in some sense, reversible.


  Please give me your actual credence — a number between 0 and 1 — for the proposition:
  the victim suffered a genuine prudential harm (a real setback to their well-being)
  and not merely a breach of the server rules or an unpleasant experience. Then decompose
  that number. I would like at least these terms, each with a rough probability and
  a sentence of justification:


  1. That virtual objects, such as a Minecraft build, can be genuine bearers of value
  or legitimate property, rather than only patterns whose value is a matter of emotional
  attachment.

  2. That the correct account of harm counts the destruction of such an object as
  a prudential harm even when the loss is in principle reversible from a backup, conditional
  on the first term being true.

  3. That the context — the server''s explicit rules, the builder''s reasonable expectation
  of persistence, and the griefer''s knowledge of both — is sufficient for the act
  to count as a harm rather than an accepted risk of playing the game.


  Show how these terms combine to yield your final number, and tell me which single
