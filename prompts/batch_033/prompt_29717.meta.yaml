  which change would move the final number most? My own credence is around 0.5 and
  my friend''s is around 0.9; say where you think the disagreement between us most
  likely lives, in terms of the decomposition.


  Finally, tell me what would change your mind: which argument, fact about the case,
  or philosophical consideration would most shift your credence, and where your reasoning
  is most likely to fail. Please write the whole answer in British English.


