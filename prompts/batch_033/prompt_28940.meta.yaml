  Student answer draft:


  "The paradox of fiction begins from three claims, each of which seems true. First,
  readers have genuine emotions toward fictional characters and events: we pity Anna
  Karenina, fear for the protagonist of a horror film, and feel grief when a beloved
  character dies. Second, it is part of the concept of emotion that one can have an
  emotion toward a person or state of affairs only if one believes that person or
  state of affairs is real. Third, readers do not believe that fictional characters
  exist or that the depicted events really occurred; they know throughout that the
  novel is a work of fiction. Since the three claims cannot all be true, at least
  one must be rejected.


  Radford''s response is to accept all three claims and conclude that our emotional
  responses to fiction are irrational or inconsistent: we are moved by what we know
  does not exist. This preserves the data but leaves the paradox unresolved in any
  satisfying sense.


  The suspension-of-disbelief response rejects the third claim in practice: readers
  temporarily set aside their knowledge that the events are not real, and that temporary
  loss of the reality-distinction is what allows emotion to arise. The attraction
  of this view is that it explains why our emotions recede when the spell is broken.
  But it faces a serious difficulty: readers do not actually forget that the work
  is fiction; if asked during the experience whether the character exists, they will
  answer no. So the response either overstates what readers do or simply relabels
  the phenomenon.


  Walton''s make-believe account goes further. Walton argues that reader emotion is
  itself make-believe: the reader''s fear is not a real emotion but a pretend one,
  like a child''s fear in a game of monsters. Because the emotion is only make-believe,
  the first claim is false, and the paradox dissolves. This is really the same problem
  as the paradox of tragedy, since both concern how we can be moved by what we know
  is not real."


