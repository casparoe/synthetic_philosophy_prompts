  "The paradox of fiction arises from three plausible claims: (1) we have genuine
  emotional responses to fictional characters and events — we fear for Anna Karenina,
  pity Lear; (2) to have an emotion toward someone or something, we must believe that
  it exists and that the relevant state of affairs is real; (3) we do not believe
  that fictional characters exist or that the depicted events are real, and we know
  this throughout. These three claims cannot all be true, so one must go. Radford
  famously argued that none of them should go, so our responses are simply irrational
  or incoherent; we are moved by what we know does not exist, and that is a brute
  fact about us. One popular reply is Coleridge''s willing suspension of disbelief:
  readers temporarily set aside their knowledge that the events are not real, and
  this is why they respond emotionally. This solution is attractive because it explains
  why the emotion vanishes when the spell is broken. But it is incomplete: readers
  do not actually believe that Anna Karenina is a real person; if you ask them mid-sob
  whether she exists they will say no. A more sophisticated solution is Walton''s
  make-believe account. Walton says the reader''s fear is itself make-believe — it
  is not a real emotion, only a pretend one, like a child''s fear in a game of monsters.
  This avoids the paradox by denying (1): there is no genuine emotion, only a quasi-emotion
  or imagined emotion. The paradox of fiction is thus solved, though it is really
  the same problem as the paradox of tragedy, since both concern the rationality of
  our feelings toward what we know is not real."


