  "Explain the paradox of fiction as it arises for emotional responses to fictional
  characters. Lay out the standard assumptions that generate the paradox, then critically
  evaluate two responses: the view that readers suspend disbelief, and the view that
  reader emotions are make-believe or quasi-emotions. In each case, say what the response
