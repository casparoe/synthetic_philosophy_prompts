  as) they reflect choices for which people can be held responsible, not brute luck.
  Key figures: Dworkin (equality of resources, ambition-sensitivity, endowment-insensitivity,
  hypothetical insurance), Arneson (equal opportunity for welfare), G.A. Cohen (equal
  access to advantage), Anderson''s critique (luck egalitarianism abandons the imprudent,
  expresses pity rather than respect, "equality of fortune" vs "democratic equality"),
  Scheffler on the egalitarian plateau, cases: the uninsured driver who crashes, expensive
  tastes (Dworkin says compensation for expensive tastes... actually Dworkin distinguishes
  expensive tastes that are chosen vs. those that are part of one''s person; Cohen
  criticizes Dworkin''s cut between expensive tastes and handicaps), the option luck/brute
  luck distinction.


