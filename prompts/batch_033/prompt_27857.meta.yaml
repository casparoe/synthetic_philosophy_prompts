  Potential prompt text:


  ---


  Act as a professional philosopher who works on causation by omission and on the
  role of norms, expectations, and defaults in causal judgment, and who has practice
  turning subtle philosophical distinctions into decision procedures that non-philosophers
  can run. Before you write the procedure, think through the main candidate accounts
  of when an omission is a cause of an outcome and what each account would say about
  the three cases below; then state which account you are operationalizing and why
  it is the right one for this setting.


  I chair the adverse-event review committee of a 350-bed teaching hospital. We meet
  twice a month to review cases of serious patient harm and death, and in each case
  we must decide whether a clinician''s failure to act — not ordering a test, not
  escalating a finding, not checking a pending result, not calling a consultant —
  caused the harm. The classification matters: if we record the harm as caused by
  an omission, the event is classified as preventable, it triggers a formal investigation,
  and it can follow the individual clinician''s record; if we record it as not caused
  by omission, it is filed as non-preventable and the process ends. The medical director
  signs off on our classifications and expects the procedure to be consistent and
  defensible.


  Our recurring problem is that the bare counterfactual test — would the harm have
  occurred if the person had acted? — is far too permissive. In nearly every death,
  some nurse could have called an hour earlier, some consultant could have returned
  a page sooner, some lab could have phoned a result instead of posting it. If we
  use that test literally, dozens of people caused every death, and the distinction
  between the failure that killed the patient and the background of ways things might
  have gone better disappears. I know the philosophy here only in rough outline: some
  views tie causation by omission to what would normally happen, or to what a person
  in that role was supposed to do, or to a relevant default, and some deny that omissions
  are causes at all. I want that work turned into something my committee can actually
  use.


  Write me a reusable decision procedure, a sequence of questions to run in order,
  that the committee can apply to any case in roughly twenty minutes. The procedure
  should say what counts as a sufficient answer at each step, where it stops with
  a definite conclusion that the omission did not cause the harm, where it stops with
  a definite conclusion that it did, and which step or steps require a judgment of
  professional standards or institutional values rather than a finding of fact — and
  who should make that judgment and how it should be recorded. Committee members are
  clinicians, patient-safety staff, a risk manager, and one lay member; they will
  not read the philosophical literature, so each question should be phrased in ordinary
  clinical language, with a sentence or two of rationale connecting it to the philosophical
  idea it operationalizes.


  Then apply the procedure to these three cases:


  1. A 42-year-old with no relevant history presents with pleuritic chest pain, normal
  vital signs, and a normal examination; the physician diagnoses musculoskeletal pain
  and does not order imaging or a D-dimer. Two days later the patient dies of a pulmonary
  embolism. Had a CT been ordered at the first visit, the embolism would almost certainly
  have been found and treated. At the time, however, the presentation fell well below
  the threshold at which the relevant clinical decision rules recommend imaging.


  2. A laboratory posts a critically abnormal potassium value of 6.8 to the electronic
  record but the system does not route it to the covering physician, who never sees
  it. The patient has a fatal arrhythmia later that night. Checking for pending results
  is possible but not a specified part of the covering physician''s workflow, and
  the hospital has no rule about who must monitor un-routed results after hours.


  3. A nurse observes clear, documented deterioration in a patient over several hours
  but does not call the rapid response team, because on that unit such calls are treated
  as over-reactions and discouraged. The patient arrests. Calling the team would have
  been within the nurse''s role and would, on the balance of probabilities, have prevented
  the arrest.


  One of these should produce an answer the committee will not like; do not soften
  it, and say explicitly which case it is and why the committee will resist it. Then
  tell me what the procedure cannot do: the kinds of case it will misclassify, the
  questions philosophy has not settled that the procedure treats as settled, and the
  point at which the hospital simply has to choose a standard and live with the consequences.


  Your answer''s final line must be a one-sentence summary of the procedure.


