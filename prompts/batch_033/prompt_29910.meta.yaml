  Domain: heritability — what it does and does not mean. The prompt should ask for
  a decision procedure a practitioner can follow. Let me think about the conceptual
  content to make it in-the-weeds.


  Heritability concepts:

  - Heritability (broad-sense H², narrow-sense h²) is the proportion of phenotypic
  variance in a population that is attributable to genetic variance in that population,
  in a given range of environments.

  - It is not: the probability that an individual''s trait is caused by genes; not
  a fixed property of the trait; not a measure of how "genetically determined" a trait
  is; not immutable; high heritability doesn''t mean environmental interventions won''t
  work (e.g., height is highly heritable but average height changed with nutrition);
  low heritability doesn''t mean genes don''t matter (e.g., number of fingers? Actually
  having five fingers is low heritability because environment? Let me think — number
  of limbs/fingers low heritability because most variation is environmental/developmental
  accidents, but the trait is strongly genetically specified). Good example: number
  of eyes in humans has low heritability because there''s almost no genetic variation
  relevant, yet it''s deeply genetic/developmental.

  - Heritability is population-specific and environment-specific: changes when environment
  changes (variance decomposition). Heritability within a population doesn''t tell
  you about between-group differences (e.g., differences between groups could be entirely
  environmental even if within-group heritability is high — Lewontin''s point about
  seed corn in two fields).

  - Heritability can be high because environmental variance is low; can be low because
  environmental variance is high.

  - Twin studies, adoption studies, SNP-based heritability ("missing heritability").

  - Gene-environment interaction and correlation (GxE, rGE) can inflate/deflate estimates.

  - Heritability doesn''t tell you about malleability: a trait can be highly heritable
  and still strongly influenced by environmental intervention (height, myopia example?
  myopia heritability increased?).

  - Heritability estimates don''t apply to individuals: "heritability of IQ is 0.5"
  doesn''t mean 50% of your IQ comes from genes.

  - Heritability ≠ proportion of causation for an individual.

  - Falconer''s formula, ACE models (additive genetic, common/shared environment,
  unique/non-shared environment).


