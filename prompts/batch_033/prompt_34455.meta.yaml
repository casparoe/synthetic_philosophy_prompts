  ---


  So I teach a philosophy of mind seminar for undergrads (14 students, 80-minute sessions,
  big room with movable chairs and a tile floor we can mark up with tape), and this
  year I''ve also gotten weirdly into antkeeping with my kid — we have a little formicarium
  on the kitchen counter. So now the Ant Fugue chapter from Hofstadter''s Gödel, Escher,
  Bach has stopped being just another reading and started feeling like a live question.
  You know the bit: Aunt Hillary and the anteater go back and forth about whether
  the ant colony as a whole can have thoughts, feelings, a mind, even though no individual
  ant does.


  I want to run a class where the students are the ants. By the end of it, I want
  them to have produced something at the group level — a decision, a path choice,
  a pattern — that none of them individually intended or fully understood, so that
  the claim "the colony did it" stops sounding like a metaphor. Then a debrief that
  maps exactly what happened back to the moves in the Ant Fugue: the signal trails,
  the aggregation, the way a bunch of individually clueless parts can look like a
  single smart thing. And I want them to leave genuinely unsure whether the colony
  "has a mind" — or at least sure why the question is hard.


  Can you design the actual activity? I need: concrete rules simple enough that 14
  people can learn them in five minutes, a list of materials (nothing expensive —
  paper scraps, tape, colored tokens, string, whatever), a timeline for the 80 minutes,
  and a debrief script that names the moments in the game that correspond to parts
  of the ant-colony-as-mind idea. The idea should hit them during the activity, not
  in a lecture afterwards — so no framing up front about what they''re supposed to
  notice, and maybe don''t even say "Ant Fugue" until the debrief. Also tell me what
  will predictably go wrong the first time I run it (someone breaks character and
