  But the colony-level clever behavior: The group should collectively allocate more
  foragers to the richer/closer source, or solve a shortest-path problem. One classic:
  two bridges to food, one shorter; ants initially choose randomly, but shorter path
  gets more pheromone because round trips are faster, so positive feedback makes the
  colony converge on the shorter path. That''s the "Ants find shortest path" phenomenon.
  Could run as a game with two paths marked on floor (long and short), students as
  ants choosing paths based on pheromone density (paper scraps). Each ant that completes
  a trip drops a fixed number of pheromone tokens on the path it used; since the short
  path yields faster trips, it accumulates more pheromone, so more ants choose it.
  The colony "discovers" the short path without any ant comparing lengths. This is
  runnable and simple.


  But the question "can an ant colony have a mind?" is about cognition, not just optimization.
  The shortest-path convergence is adaptive behavior, but to make the force of the
  "mind" question felt, maybe the activity should produce something more "representational"
  — like the colony forming a collective memory or making a decision. Another classic:
  "collective decision-making" — two nest sites, one better; ants assess quality and
  recruit; quorum sensing; the colony chooses the better site even though most ants
  never visit both. That''s more mind-like (decision). But it''s more complex.


