  defined as applying to things examined before some future time t just in case they
  are green, and to other things just in case they are blue. Suppose all emeralds
  examined so far have been green. Then those same emeralds have also been grue. So
  the evidence seems to support both ''all emeralds are green'' and ''all emeralds
  are grue,'' even though the two generalizations make incompatible predictions about
  emeralds first examined after t. The philosophical problem is to say what makes
  ''green'' a legitimate, projectible predicate and ''grue'' a gerrymandered one,
  without circularly appealing to the fact that green is the predicate we happen to
  have used.


