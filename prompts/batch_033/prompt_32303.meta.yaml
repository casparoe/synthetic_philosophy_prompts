  they think. Wanting to be more careful than that, I went back to Turing''s original
  description of the imitation game. A few features of his setup seem to get lost
  in popular invocations of it: the interrogator is actively trying to catch the machine
  out; the machine may answer so as to conceal its own abilities, for example by doing
  arithmetic badly; and Turing spends much of his discussion on objections such as
  the claim that a machine can only do what it has been programmed to do, or that
  behavior might be perfect while inner experience is absent.


  The systems I work with are not built the way Turing imagined a machine might be.
  They are next-token predictors trained on enormous corpora of human writing; they
  are not programmed with explicit rules for conversation. They sustain plausible
  dialogue in many ordinary exchanges, but they also hallucinate, lack stable goals
  or memory across sessions unless these are bolted on, and can be broken by probes
  and adversarial prompts that a human would not fail. I want to know what Turing
  himself, on the basis of his own statement of the game and his own way of handling
  the objections, would most likely have said about such a system.


