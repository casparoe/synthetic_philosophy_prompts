  Setup: A friend defends the following reasoning, which he attributes to the quantum-suicide
  thought experiment but developed further.


  (1) Suppose the many-worlds interpretation is true: whenever a quantum measurement
  has multiple possible outcomes with nonzero amplitude, the world branches and every
  outcome occurs in some branch.


  (2) Consider an experiment in which a device measures a spin and, if the spin is
  up, kills the experimenter instantly, while if spin is down, merely flashes a green
  light. By (1), there is a branch in which the spin is down.


  (3) A given experimenter can only ever observe outcomes in branches where they survive;
  branches where they die contain no future experiences for them.


  (4) Therefore, from the experimenter''s first-person perspective, the probability
  of observing the green light is 1, and the probability of dying is 0 — no matter
  how small the down-amplitude is.


  (5) Repeat the experiment n times. The same reasoning applies at each step; the
  experimenter should expect to see green every time, with probability 1, even if
  the down-amplitude is tiny and the chance of n consecutive down-results by the Born
  rule is vanishingly small.


  (6) By induction, the experimenter should expect to survive any finite sequence
  of potentially lethal events in which survival has nonzero amplitude, including
  aging, disease, etc.


  (7) Hence each of us should assign probability 1 to our own indefinite survival
  — quantum immortality — which is absurd (we see people die; and the argument would
  work for everyone simultaneously).


  Hmm (7) "we see people die" — third-person vs first-person. But the argument is
  first-person. The conclusion says you personally should not expect to die. It seems
  to prove too much, but in MWI, quantum immortality is indeed a conclusion some accept
