  The absent-minded driver problem (Piccione and Rubinstein 1997). A driver on a highway
  plans to exit at the second of two exits. The payoff: exiting at the first exit
  yields 0, exiting at the second yields 4, and not exiting at all (passing both)
  yields 1. The driver is absent-minded: when he reaches an exit he cannot tell whether
  it is the first or second. So he must choose a strategy: with what probability to
  exit whenever he finds himself at an exit. Since he can''t distinguish, the same
  probability p at each. Expected payoff = p*0 + (1-p)*p*4 + (1-p)^2*1? Wait, probability
