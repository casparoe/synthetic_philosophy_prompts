  Color phi: In the classic experiment (Kolers and von Grünau 1976), two spots are
  flashed in rapid succession at different positions; if the color is the same, subjects
  report a single spot moving continuously from first to second position. If the colors
  differ (e.g., red then green), subjects report a single moving spot that changes
  color abruptly midway between the two positions. The puzzle: the subject can''t
  know the second spot is green until the second flash occurs, yet they report seeing
  the color change before the second flash? Actually they report the change happening
  midway along the trajectory, which is before the second flash location and before
  the time of the second flash. How can the brain know the second color before it
  happens? It must have used the later information to construct the earlier experience,
  or delayed the experience.


  Dennett frames two possible accounts:

  - Stalinesque (after Stalin''s show trials): the brain edits the experience before
  it reaches consciousness; you never consciously experienced the red dot moving;
  consciousness gets the already-revised "moving dot changing color" as if it were
  a show trial where the evidence was tampered with before being presented. So consciousness
  is like the audience seeing a doctored film.

  - Orwellian (after Orwell''s 1984, memory holes): you did consciously experience
  the red dot at position one and then the green dot at position two, but the brain
  revises the memory afterward so that you remember a single moving dot; the original
  experience happened but was overwritten. So it''s like the Ministry of Truth rewriting
  history after the fact.


  Dennett''s claim: there''s no empirical way to distinguish these because any test
  would just be another probe that could be interpreted either way; the distinction
  presupposes a "Cartesian Theater" where there''s a single place/time at which an
  experience becomes conscious and a single audience. Once you abandon the theater,
  the Orwellian/Stalinesque distinction dissolves. He doesn''t claim there''s no difference
  in principle between experience and memory; rather, in these cases the distinction
  can''t be drawn.


