  (Stalinesque) or edit the memory after consciousness (Orwellian).

  2. No conceivable experiment could distinguish these two, because any behavioral
  or neural data could be accommodated by either story.

  3. If no conceivable evidence distinguishes two hypotheses, then there is no fact
  of the matter which is true.

  4. So there''s no fact of the matter whether the subject really experienced the
  moving/changing dot or merely misremembers it.

  5. But this distinction — experience vs. later-confabulated memory — is exactly
  the kind of thing that matters everywhere (did the patient feel pain during surgery
  and forget, or never feel it; did a witness actually see X or just think they did).

  6. So if the argument works for color phi, it works generally, and there''s no fact
  of the matter about anyone''s experience vs memory. That''s absurd (or at least
  too much).

  Where does it go wrong?


