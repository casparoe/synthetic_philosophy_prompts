  A subtle version: The inefficacy objection says an individual act is morally permissible
  (or not wrong) because it makes no difference. But the false presupposition in many
  popular versions is that the relevant unit of evaluation is the individual act''s
  causal consequence, and that if no individual act is a but-for cause, then no individual
  obligation exists. The subtle confusion: conflating "my act doesn''t make a difference"
  with "there is no act I can do that makes an expected difference" or "the morality
  of an act is determined only by its actual consequences." Actually the deeper issue:
  even if each individual act is inefficacious, it doesn''t follow that the set of
  acts is inefficacious, and the question is what follows for the individual. Many
  answers: expected utility over threshold uncertainty; participation in collective
  wrongdoing; virtue/expressive; rule-consequentialism; civic obligation. A good answer
  would notice the false presupposition that difference-making (actual, but-for) is
  necessary for a reason.


