  produce an output given an input, perhaps under some environment.

  - Stimulus condition S = input / call.

  - Manifestation M = return value / effect.

  - Fink = the object''s behavior changes exactly under the triggering condition:
  like a method that checks whether it''s being called and changes its own code /
  has a side effect altering state so the normal output doesn''t occur. Could map
  to self-modifying code, or an exception handler that intercepts.

