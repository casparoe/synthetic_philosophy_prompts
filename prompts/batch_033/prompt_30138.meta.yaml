  statements are neither true nor false (truth-value gaps); truth is supertruth (truth
  on all admissible precisifications); classical logic is preserved for supertruth
  (all classical tautologies hold), but bivalence fails for borderline statements.
  Also, "There is a sharp boundary" (∃n...) is supertrue, while no particular n is
  supertrue.


