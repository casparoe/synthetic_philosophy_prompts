  Epistemicism (Timothy Williamson, Vagueness, 1994): Vague sentences have sharp,
  unknowable truth-values. Bivalence holds. The sorites premise "for all n, if n grains
  make a heap then n−1 grains make a heap" is false; there is a cut-off, but we cannot
  know where it is (margin-for-error / knowledge requires safety). So epistemicist
  verdicts:

  - Clear heap: true. Clear non-heap: false.

  - LEM for borderline: true (classical logic).

  - Existential "there is a sharp boundary": true (and there is a true instance, unknowable).

  - Bivalence for borderline: true ("p is either true or false").

  - "There is a fact of the matter": true.

  - Tolerance principle: false.


  Supervaluationism (Kit Fine 1975; Rosanna Keefe): Truth = supertruth. Borderline
  sentences are neither supertrue nor superfalse. Classical logic preserved at the
  level of supertruth (LEM supertrue), but bivalence fails.

  - Clear heap: true. Clear non-heap: false.

  - LEM for borderline: true (supertrue).

  - Existential "there is a sharp boundary": true (supertrue) — each precisification
  has a boundary.

  - Bivalence for borderline: false — "p is either true or false" is not supertrue;
  for borderline p, p is neither supertrue nor superfalse, so "p is true" is false
  and "p is false" is false, making the disjunction false. Wait, is "p is true or
  p is false" itself false or indefinite? "p is true" — for borderline p, is the sentence
