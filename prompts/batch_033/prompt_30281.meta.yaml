  Let me think about what genuine desiderata for a theory of dispositions are:


  1. Handle the simple cases: fragility, solubility, poisonousness — a sugar cube
  dissolves in water; a glass breaks when dropped on concrete. Any theory must get
  the easy cases right (extensionally adequate on ordinary cases).


  2. Respect the asymmetry between manifestation and trigger: a disposition is not
  just any conditional; the manifestation is triggered under stimulus conditions,
  and the disposition can persist unmanifested (the glass is fragile even while sitting
  on the shelf). A theory must not identify being fragile with actually breaking.


  3. Account for the difference between having a disposition and manifesting it —
  degrees (more/less fragile) and thresholds; can a thing have a disposition that
  never manifests?


  4. Handle "finkish" cases: a disposition that is present but would vanish if the
  stimulus occurred. The classic: a fragile glass wired to a protective device that
  would make it not break if struck — is it still fragile? A theory must say something
  principled. (Actually the classic fink: a sorcerer waiting to make the glass sturdy
  if it''s about to be struck. The glass is fragile now but wouldn''t break if struck.)
  Desideratum: the theory must distinguish the disposition itself from the conditional
  that holds when the stimulus occurs, so it doesn''t collapse disposition to counterfactual.


  5. Handle "masked"/"antidote" cases: a disposition that is present and would manifest,
  but an interfering factor prevents the manifestation even though the stimulus occurs
  and the disposition remains. Poisonous substance that would kill if ingested, but
  the victim takes an antidote; the poison is still poisonous. A theory must distinguish
  manifestation from the absence of interference, or allow that dispositions can be
  present without manifesting even when triggered.


  6. Handle "mimicry": something that lacks the disposition but would produce the
  manifestation in the stimulus conditions due to an external cause — a non-poisonous
  powder that would kill only because a poisoner adds poison when it''s ingested.
  The conditional "would kill if ingested" is true but the powder isn''t poisonous.
  A theory must not let mimicry count as having the disposition.


  7. Distinguish intrinsic vs extrinsic dispositions: fragility seems intrinsic to
  the glass; being "visible" or "worth $5" or "a key" (opens this lock) seems extrinsic/relational.
  A theory must say which dispositions are intrinsic, which extrinsic, or explain
  why the distinction matters. (This is contested.)


  8. Multi-track/disposition families: fragility isn''t a single conditional "breaks
  if struck" — it''s a family of possible manifestations across a range of stimuli
  (dropping, striking, bending, thermal shock) and a range of manifestations (shatter,
  crack, chip). A theory can''t reduce a disposition to one stimulus-manifestation
  pair. Also, determinable vs determinate (fragile vs breaks at 3.2 J impact).


  9. Gradable/comparative: some dispositions come in degrees — more soluble, more
  fragile — and thresholds/context. A theory must handle the semantics of "more fragile
  than" and vague boundaries.


  10. Consistency with science: disposition terms are used in physics (brittleness,
  conductivity, solubility), chemistry, biology, medicine; a theory shouldn''t contradict,
  e.g., that a substance''s solubility is a function of its molecular structure, or
  that many scientific dispositions are characterized quantitatively with specific
  stimulus conditions (temperature, pressure). Also must accommodate "propensities"
  in probability — some dispositions are probabilistic (a radioactive atom''s disposition
  to decay with a half-life), not deterministic conditionals.


  11. The relation between dispositions and their categorical bases: fragility is
  grounded in microstructure; is the disposition identical to the base, realized by
  it, or something over and above? A theory must say whether dispositions are reducible
  to categorical properties or are themselves real. (Maybe this is more metaphysics.)


  12. The connection to laws and counterfactuals: the simple analysis "x is disposed
  to M when S iff x would M if S" fails due to finks/masks/mimicry. A theory must
  either fix the conditional (ceteris paribus, normal conditions) or replace it with
  something else (e.g., intrinsic causal basis, "x would M if S and nothing interferes").
  But "nothing interferes" is circular unless specified.


  13. Dispositions of persons/mental: beliefs, desires, character traits as dispositions;
  multi-track and rational integration. Maybe less central.


  14. Handle "bare" dispositions vs "grounded" — not necessary.


