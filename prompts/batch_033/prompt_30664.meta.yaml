  ---


  I''m a journalist who covers science and ideas, and I''ve spent enough time around
  expert disputes to notice that my own instincts about when to defer to someone else''s
  judgment are not consistent — at least, I can''t state the rule behind them. Before
  I write another story that turns on expert disagreement, I want to know what principle
  I''m actually applying.


  Here are my verdicts on cases, going on gut alone.


  1. Two climate scientists I trust equally, with the same data, give sharply different
  ranges for how much warming a doubling of CO2 will produce. I can''t read their
  models. I find myself wanting to report a wide, hedged range, roughly splitting
  the difference. This feels right.


  2. A friend and I disagree about how to split a restaurant bill. I''ve just done
  the arithmetic twice and checked it against the receipt. I don''t feel any pressure
  to move toward her number, though I''ll recheck once to be polite. Splitting the
  difference would be absurd.


  3. Two political scientists, both well-published, disagree about whether a particular
  voting reform increased turnout. I''m not a social scientist, but I read both papers
  and found one''s identification strategy plainly more credible than the other''s.
  I feel entitled to weight that study more heavily, even though its author is no
  more eminent than the other.


  4. A colleague I consider my intellectual equal disagrees with me about whether
  a novel we both just read is good. I feel no inclination to moderate my view. It
  would be strange to change my aesthetic judgment just because she disagrees.


  5. I disagree with a friend, who is roughly as intelligent and well-informed as
  I am, about a moral question — say, whether a certain immigration policy is just.
  I don''t feel pressure to conciliate, but I also can''t say why this case differs
  from the climate case, where I do conciliate. That asymmetry bothers me most.


  6. An oncologist whose judgment I have reason to trust disagrees with me about whether
  a new treatment is worth its side effects for a family member. I''m not a doctor.
  I defer almost completely, though I ask a lot of questions first.


  Is there a single principle — a rule about when and how much to revise in the face
  of disagreement — that gets all of these, or nearly all? I know the literature splits
  roughly between conciliationists, who say you should move substantially toward an
  epistemic peer, and steadfasters, who say you may largely retain your view; my verdicts
