  routine) has to satisfy to be worth taking seriously. I don''t want a literature
  review or citations; I want the criteria and the case behind each.


  Here''s the rough territory. The standard sphex wasp story: the wasp drags a paralyzed
  cricket to the mouth of her burrow, leaves it there, goes in to check the burrow,
  comes back out, and drags the cricket inside. If you nudge the cricket a couple
  inches away while she''s inside checking, she comes out, drags it back to the threshold,
  and goes in to check again — and again, indefinitely. The behavior looks smart but
  it''s a fixed loop; she never just skips the check and drags it in. The question
  I want the requirements for: what does a theory of free will (or agency, or whatever
  you want to call the thing the wasp lacks and we supposedly have) have to deliver
  if it''s going to use this flexibility/rigidity contrast as its backbone?


  Things I''d want the list to cover, at minimum:

  - Which cases it has to get right (the wasp, addiction, compulsion, habit, acting
  on autopilot while driving, but also quick expert action that isn''t deliberated
  at all).

  - Which distinctions it can''t collapse — e.g., flexibility vs mere randomness or
  noise, flexibility vs unpredictability, being responsive to reasons vs being behaviorally
  plastic, and whether free will is all-or-nothing or comes in degrees.

  - What results from animal cognition it can''t contradict, if it''s going to draw
