  No-trade theorem (Milgrom & Stokey 1982): In a setting where agents have common
  priors and it is common knowledge that they are rational expected-utility maximizers,
  and initial allocations are ex ante Pareto efficient, then the arrival of private
  information cannot generate trade. The classic result: no speculative trade under
  common knowledge of rationality and common priors; traders cannot agree to disagree
  (Aumann''s agreement theorem); if someone is willing to sell you an asset, that
  fact itself is information (adverse selection, winner''s curse). The "Groucho Marx"
  theorem: I won''t buy from anyone willing to sell to me — actually "no-trade theorem"
  sometimes called the "Groucho Marx theorem" — "I don''t want to belong to any club
  that would accept me as a member." The market epistemology angle: prices aggregate
  information; trades reveal information; no-trade implies that the very act of trading
  reveals private information that should make the counterparty revise.


  Dependency structure for teaching:

  1. Start with common knowledge vs. common priors distinction (these are different!
  A common prior is a modeling assumption; common knowledge of an event is an epistemic
  state).

  2. Need rational Bayesian updating, expected utility.

  3. Need the concept of ex ante Pareto efficiency and the fact that any trade that
  is not Pareto-improving in expectation means someone expects to lose.

  4. The core: if a trade is common knowledge? Hmm, actually the theorem says: if
  it''s common knowledge that both agents are rational and they have common priors,
  then they can''t both expect to gain from trade (no "agreeing to disagree" about
  expected value). Then private information can''t create mutual expected gains because
  the willingness to trade itself conveys information.

  5. The intuition: speculative trade is a zero-sum bet, and rational Bayesians with
  common priors can''t both think they''re on the winning side of a zero-sum bet once
  the bet''s existence is common knowledge.


