  This is good. Let me think about the details of Fitch''s paradox:


  The paradox: Assume KP (all truths are knowable: ∀p(p → ◇Kp)). Also assume there
  is at least one truth that is not actually known: ∃p(p ∧ ¬Kp). Then consider the
  instance: p ∧ ¬Kp. By KP, ◇K(p ∧ ¬Kp). But knowledge distributes over conjunction:
  K(p ∧ ¬Kp) → Kp ∧ K¬Kp. Since knowledge is factive, K¬Kp → ¬Kp. So Kp ∧ ¬Kp, a contradiction.
  Therefore, by reductio, there is no unknown truth — all truths are known. So KP
  entails that all truths are known, which is absurd.


  The escape routes:

  1. Deny that knowledge distributes over conjunction.

  2. Deny that knowledge is factive (but that''s a big one).

  3. Restrict KP to certain kinds of propositions (e.g., not ones involving the K
  operator).

  4. Use a non-classical logic (e.g., intuitionistic logic, where the derivation might
  fail).

  5. Deny that there are unknown truths (but that''s absurd).

  6. Reformulate KP in a way that avoids the paradox (e.g., using a different modal
  operator).


