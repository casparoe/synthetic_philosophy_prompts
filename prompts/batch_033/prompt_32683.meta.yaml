  I''m taking a final-year epistemology course, and we''ve spent the last three weeks
  on Fitch''s paradox of knowability. The standard presentation runs as follows: suppose
  one holds that all truths are knowable — that for any true proposition p, it is
  possible that someone knows p. Add the uncontroversial assumption that there exists
  at least one truth nobody actually knows. Now consider the proposition "p is true
  and nobody knows p." By the knowability principle, it must be possible to know this
  proposition. But knowing a conjunction requires knowing each conjunct; and if one
  knows that nobody knows p, then (given that knowledge is factive) nobody knows p
  — yet one would oneself know p, which contradicts the second conjunct. So the knowability
  principle, together with the existence of an unknown truth, entails a contradiction.
  The only way out, it seems, is to deny that there is any unknown truth — which is
  absurd. The principle therefore collapses into the claim that all truths are actually
  known, and must be rejected.


  I find this argument compelling, and I''ve come to the view that Fitch''s paradox
  constitutes a decisive refutation of the knowability principle — verificationism,
  at least in its unrestricted form, is untenable. But I''m aware that the literature
  contains a number of responses, and I want to know what would genuinely count against
  my position, not just what the responses say.


  Specifically, I want a map of the defeaters: what would have to be true for the
  Fitch argument to fail as a refutation of the knowability principle? Which escape
  routes are live options and which are merely logically possible but carry costs
  no one would accept? I''d like them sorted by how decisive they would be if they
  succeeded — from "this would overturn the argument entirely" to "this would force
  a qualification but leave the core point intact." For each, I want to know what
  the defender of the Fitch argument would have to concede, and whether the concession
  is damaging or merely a clarification.


  I''m also interested in the question of insulation: has the standard Fitch argument
  been qualified in ways that make it unfalsifiable in practice? If the argument''s
  defenders have responded to objections by saying "well, the principle we meant to
  refute is only this specific version, not those other versions," has the target
  shrunk to the point where the argument no longer refutes anything of interest? If
  so, is that a problem for the argument, or is it a legitimate narrowing of the dialectical
  target?


  Please indicate how confident you are in each part of your assessment, and single
  out the point you are least sure of. I''m not looking for a summary of the literature
  I could get from a textbook — I want a critical map of the argument''s exposure.'
