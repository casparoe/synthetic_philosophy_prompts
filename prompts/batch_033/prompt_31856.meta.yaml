  Let me think about the substantive content to make it in-the-weeds and precise.
  Key desiderata for a theory of ''the will of the people'':


  1. It must distinguish aggregate majority preference (public opinion polls) from
  a collective will that has normative force.

  2. It must handle cases where no majority exists (Condorcet cycles) — not just say
  "the majority wants X."

  3. It must respect Arrow''s theorem: no aggregation rule satisfies all plausible
  conditions, so any theory must say which condition it drops.

  4. It must handle the difference between constitutive (the people as the whole demos
  acting through procedures) and rhetorical/invocation uses of the phrase.

  5. It must handle non-electoral expressions (movements, protests) vs. formal procedures.

  6. It must handle the problem of boundaries: who counts as ''the people''? (demos
  problem)

  7. It must explain how a will can be attributed to a collective without reifying
  it.

  8. It must handle the temporality: a will can change; can a past will bind a present
  majority? (e.g., Brexit "will of the people" frozen in time)

  9. It must not collapse into either pure proceduralism (whatever the constitution
  says is the people''s will) or pure acclamation (whatever the leader says).

  10. It must be able to say when an invocation of ''the will of the people'' is false
  or ideological, not just when it''s procedurally unauthorized.


