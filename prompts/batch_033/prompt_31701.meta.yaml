  5. Conflicts (roughly 300 words). Say whether any subset of the desiderata is jointly
  unsatisfiable, for example whether a theory can both respect individual liberty
  in the hard cases and acknowledge that a legal system presupposes a shared moral
  order. If something has to give, say what it is and why.


  6. Scorecard (roughly 300 words). Briefly score Hart''s harm principle, Devlin''s
  legal moralism, and Feinberg''s offense principle against the list. Keep this section
  short: I want the criteria, not a verdict.


  Be concrete throughout: name the conduct, the statute-like rule that would or would
  not criminalize it, and the verdict that follows. I am less interested in which
  theory wins than in knowing what winning would mean.


