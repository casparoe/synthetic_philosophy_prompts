  Final prompt text:


  I just spent an evening arguing with a friend about whether the criminal law may
  punish conduct that is widely thought immoral but that, by the friend''s own admission,
  harms no one. By the end I was defending something like Hart''s harm principle and
  he was defending something like Devlin''s legal moralism, and each of us kept reaching
  for a new case whenever our own principle gave out. Before I go back to that argument,
  I want the full specification of what an adequate theory would even have to do.


  Write the desiderata for a theory of criminalization, understood as a theory of
  when the state is morally permitted, required, or forbidden to make conduct a crime
  and attach punishment, for a modern, religiously and morally pluralistic society.
  Structure the answer in the following named sections, in this order, with roughly
  the lengths indicated.


  1. The cases (roughly 600 words). Give the canonical cases an adequate theory must
  classify without absurdity, and say for each what a theory has to deliver about
  it. Include: private consensual conduct between adults (recreational drug use, selling
  sex, assisted dying); consensual activities that risk serious harm mainly to the
  participant (seatbelt and helmet laws, dangerous sports); harmless acts that offend
  onlookers or desecrate symbols (public blasphemy, flag-burning, desecration of a
  corpse, consensual cannibalism of the already dead); consensual exploitation (selling
  an organ, dueling, wages below a legal floor); and conduct that is individually
  harmless but allegedly harmful through its aggregate effects or through the moral
  message it sends. For each, specify what a minimally adequate theory must say about
  it, or at least which combinations of verdicts it cannot hold together.


  2. The distinctions (roughly 400 words). State the distinctions a theory must respect
  and not collapse, with the reason each matters: harm to others versus harm to self;
  harm versus offense; wrongdoing versus harm; the enforcement of a society''s shared
  positive morality versus the protection of the minimum conditions of social life;
  private versus public. Say what would be lost if the theory collapsed each one.


  3. The fixed points (roughly 300 words). List the facts a theory must be consistent
  with: that criminal law is coercive and stigmatizing in a way other regulation is
  not; that the society in question is pluralistic about the good; that any legal
  system does presuppose some shared moral minimum; and that existing legal systems
  already draw lines such as consent, de minimis harm, and public order that a theory
  must explain rather than ignore.


  4. Negotiable and non-negotiable (roughly 300 words). Mark which of the above are
  genuine requirements any theory must meet and which are merely preferences of a
