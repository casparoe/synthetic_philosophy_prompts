  Aumann (1995) "Backward induction and common knowledge of rationality" showed that
  in the centipede game, common knowledge of rationality (CKR) implies the backward
  induction outcome. However, this relies on a notion of "substantive rationality"
  and "common knowledge of rationality" meaning at every node, if reached, players
  would play rationally. Stalnaker (1998) argued that Aumann''s result is weaker than
  it seems; common knowledge of rationality alone doesn''t imply backward induction
  because it doesn''t require that players would remain rational after a deviation
  (i.e., it doesn''t imply common belief in rationality at counterfactual nodes).
  The standard resolution: BI requires common knowledge of rationality plus common
  belief in future rationality, or a "common strong belief in rationality" (Battigalli
  and Siniscalchi). This is indeed a subtle and real issue.


