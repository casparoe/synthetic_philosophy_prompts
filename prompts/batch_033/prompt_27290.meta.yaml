  Exam question:


  "Karl Popper argues that unlimited tolerance is self-defeating. (a) State the paradox
  of tolerance in your own words. (b) Explain how Popper thinks a tolerant society
  should respond to intolerant movements, being precise about what he does and does
  not recommend. (c) Present what you take to be the strongest objection to Popper''s
  position and assess whether it succeeds."


  Student''s answer:


  "(a) The paradox is that tolerance, taken as an unlimited principle, undermines
  itself. If a society extends full tolerance to everyone, including those who are
  intolerant, the intolerant will eventually use that freedom to destroy the institutions
  and norms that make tolerance possible. So the consistent tolerant society is on
  a path to its own disappearance: the very tolerance it practices gives its enemies
  the room to abolish tolerance. Tolerance is therefore not self-sustaining unless
  it is in some way limited.


  (b) Popper''s resolution is to deny that tolerance must be extended to the intolerant.
  He argues that a tolerant society should claim the right not to tolerate those who
  preach intolerance, and should back this claim with legal force: the state ought
  to prohibit the expression of intolerant views, because such expression is itself
  an attack on the tolerant order. On his view, the intolerant have forfeited any
  claim to be tolerated, since they would not extend the same tolerance to others
  if they gained power. The principle behind this is one of reciprocity: a person
  or movement is owed toleration only on the condition that they are themselves prepared
  to be tolerant. Intolerant ideologies are thus outside the protection that tolerance
  ordinarily affords, and Popper thinks the law should treat incitement to intolerance
  as criminal in the same way it treats incitement to murder.


  (c) The strongest objection is that this gives whoever holds power a license to
  suppress any view they happen to find threatening, because ''intolerance'' has no
  fixed meaning. But this objection fails. Popper''s criterion is clear enough: a
  view is intolerant when it explicitly rejects argument and calls for the use of
  force against its opponents. Since that is an objective feature of a movement''s
  stated commitments, not a matter of the state''s discretion, there is no serious
  risk that Popper''s principle could be used to silence ordinary political disagreement."


