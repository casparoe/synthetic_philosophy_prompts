  Let me ensure I know the relevant philosophy accurately. Counterpart theory (David
  Lewis) vs transworld identity. Transworld identity (e.g., Kripke, Plantinga) holds
  that possible worlds are ways this world could be, and the same individual exists
  in multiple possible worlds, bearing different properties. Lewis rejects transworld
  identity: individuals are world-bound; possible worlds are concrete, disjoint spatiotemporal
  wholes; no individual exists in more than one world. Instead, each individual has
  counterparts in other worlds — individuals sufficiently similar and similar in important
  respects, more similar than anything else in that world. Counterpart relation is
  context-dependent and not an identity relation, not transitive, not symmetric. The
  Humphrey objection (Kripke): "Humphrey could have won" — under counterpart theory,
  the satisfaction of that modal predication concerns someone else, a counterpart,
  not Humphrey himself; Kripke complains that Humphrey doesn''t care about someone
  else winning, even if very like him. Lewis replies that having a counterpart that
  wins is what it is for Humphrey to possibly win; it''s not that Humphrey is unconcerned
  because the counterpart is similar enough in the right respects.


