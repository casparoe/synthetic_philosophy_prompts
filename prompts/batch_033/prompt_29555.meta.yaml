  I''m a PhD student in moral philosophy, and I''ve been collecting my own gut verdicts
  on tradeoff cases because they seem not to add up, and I want to know if there''s
  a principle that gets them.


  Here''s roughly where I stand. (1) A twenty-minute mild headache is worth enduring
  for a really good meal or a hundred dollars; in the mild range, pleasures and pains
  just trade off. (2) I would not accept a single minute of the worst kind of agony—the
  sort of pain people describe as making them lose control of their own minds—in exchange
  for any amount of pleasant experience, however large, spread over however many people.
  A billion blissful afternoons don''t seem to put a dent in one minute of that. (3)
  But an hour of very bad, though clearly not maximal, pain does seem compensable:
  I''d say yes to a lot of money or to guaranteeing a lifetime of well-being to several
  people in exchange for it. The price is steep, but finite. And here''s the part
  that bothers me: the felt difference between "very bad" and "the worst" is small,
  but my verdicts treat it as a chasm. (4) When I compare pains with each other, everything
  behaves normally: two episodes are worse than one, a longer episode is worse than
  a shorter one, and I''d always prevent the worse of two pains if I could only prevent
  one.


