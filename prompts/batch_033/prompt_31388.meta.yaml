  Frege-Geach is canonical but subtle; a student answer might say:

  Question: "Explain the Frege–Geach problem for expressivism and briefly assess one
  standard expressivist response."

  Student answer: "Expressivism holds that moral sentences express non-cognitive attitudes
  rather than beliefs, e.g., ''Murder is wrong'' expresses disapproval of murder.
  The Frege–Geach problem is that in embedded contexts like conditionals and negations,
  the same sentence does not express the attitude: someone can say ''If murder is
  wrong, then encouraging murder is wrong'' without disapproving of murder. Since
  expressivists explain the meaning of moral sentences by the attitudes they express,
  they seem unable to account for the meaning of moral sentences when they are not
  being asserted, and therefore cannot explain how such sentences contribute to valid
  arguments. A standard response, associated with Blackburn, is to model the attitudes
  as a hierarchy: approving or disapproving of combinations of attitudes, so that
  someone who accepts the conditional but not the antecedent is in a state of tension.
  This response is widely thought to succeed because it shows that expressivists can
  assign a proposition-like content to moral sentences."


