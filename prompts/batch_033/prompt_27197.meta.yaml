  The classic setup: a donkey, equally hungry and thirsty, exactly midway between
  a bale of hay and a pail of water (or two identical bales). If there is no reason
  to prefer one over the other, and the donkey only acts on reasons, it will starve/dehydrate.
  Buridan (or rather the medieval discussion attributed to him) used it to illustrate
  paralysis of will. Modern discussion: does rationality require that you have a reason
  to choose one option over the other, or is it enough to have a reason to choose
  each (and then you may pick)? Edna Ullmann-Margalit and Sidney Morgenbesser distinguish
  "picking" from "choosing": choosing is selection based on reasons for the chosen
  alternative over others; picking is selection without such a reason, where the picker
  could have picked another. They argue picking is rational and sometimes inevitable.


  Now construct an argument that seems to prove too much.


  Argument sketch:


  (1) An action is rational only if the agent acts for a reason.

  (2) A reason to do A rather than B must be a consideration that favors A over B.

  (3) In a symmetric choice (the ass''s two identical bales), there is no consideration
  that favors the left bale over the right.

  (4) So there is no reason to take the left rather than the right, and none to take
  the right rather than the left.

