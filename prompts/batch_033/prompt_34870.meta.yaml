  I know the White Horse Dialogue well enough: Gongsun Long (c. 325–250 BCE), "Gongsun
  Longzi," the "White Horse Discourse." The argument: "A white horse is not a horse."
  The interlocutor objects: if a white horse is not a horse, then is a white horse
  not a horse? Wait. The argumentative moves include:


  - "Horse" is that by which we name the shape; "white" is that by which we name the
  color. What names the color is not what names the shape. Therefore, a white horse
  is not a horse.

  - If one seeks a horse, a yellow or black horse will do; if one seeks a white horse,
  a yellow or black horse will not do. If white horse were horse, then what is sought
  in the two cases would be the same. Since what is sought is not the same, white
  horse is not horse.

  - "White horse" is "horse" together with "white"; horse together with white is not
  horse. (This is the key: the compound term differs from the simple term.)


  The standard interpretive debate: is Gongsun Long making a point about the intension/extension
  distinction, about the identity of kinds, about the semantics of compound nouns,
  about how names pick out stuff? The "proves too much" reconstruction: If "white
  horse is not horse" because a compound differs from its component, then by parity
  "white horse is not white," and "fast horse is not horse," "black horse is not horse"
  — so no qualified thing is the thing it qualifies, which seems to make ordinary
  predication impossible. But maybe Gongsun Long accepts "white horse is not white"?
