  Domain: Prioritarianism and the leveling-down objection. Core content:

  - Egalitarianism (telic) holds inequality is in itself bad; if one outcome is more
  equal but no one better off (leveling down the better-off), telic egalitarianism
  says the more equal outcome is in one respect better, even though no one benefits.

  - The leveling-down objection: a view that implies leveling down is in any way better
  is implausible/objectionable because it prefers an outcome that is worse for some
  and better for none.

  - Prioritarianism: gives extra weight to benefits for the worse off; holds that
  a benefit matters more the worse off the person is. It avoids leveling-down because
  it only values benefits to individuals; if no one benefits, nothing is gained. So
  prioritarianism denies that equality per se has value; it values priority to the
