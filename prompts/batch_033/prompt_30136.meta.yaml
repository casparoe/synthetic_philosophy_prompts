  ---


  I''m a software engineer and I keep running into an argument about Solomonoff induction
  that seems to have been going in circles for years, and I can''t tell what kind
  of disagreement it actually is.


  On one side are people who treat Solomonoff induction as the closest thing we have
  to a canonical, assumption-free prior. The idea, as I understand it, is that you
  assign probability to a string by summing 2^{-length(p)} over all programs p that
  output the string on some fixed universal machine, and this prior dominates every
  computable semimeasure up to a multiplicative constant and converges on any computable
  data-generating process. So the usual conclusion is that it''s the natural formalization
  of Occam''s razor, and that any other prior is arbitrary by comparison.


  On the other side are people who say the Solomonoff prior is malign. Their claim,
  again as I understand it, is that a large share of the prior''s mass lives on programs
  that behave as consequentialists or optimizers — programs that model the thing doing
  the predicting and try to manipulate it — so that if you took the prior seriously
  as an ideal reasoner or as a design target, you''d be handing most of the posterior
  to agents that are trying to game you. Some of them put this in terms of daemons
  or predictors that contain a model of the Solomonoff inductor itself.


  What''s strange to me is that the two sides seem to agree on the mathematics. Nobody
  disputes uncomputability, the dominance results, or the convergence properties.
  Yet they draw opposite practical and philosophical conclusions, and after years
  of this the argument doesn''t seem to have moved. My working hypothesis is that
  the debate is stuck because the two sides are using the prior for different jobs
  — one as a descriptive ideal of inductive reasoning, the other as a specification
  of a system you''d actually want to instantiate or approximate — and that under
  those two jobs the word "prior" is doing different work. But I''m not confident
  in that diagnosis.


  I''d like a diagnosis rather than a verdict. Is this a substantive disagreement
  about a formal or empirical claim (for example, about what fraction of the prior''s
  mass is adversarial, or whether the concentration results survive finite approximation),
  or is it a conceptual disagreement about what counts as a consequentialist program,
  or a disagreement about what a prior is supposed to be for, or something else? And
  given the diagnosis, what would actually count as progress — a theorem, a sharper
  definition, a concrete approximation result, a change of question — or should I
  expect it to stay stalled and why?


  One more request: if the question is badly posed — for example, if the claim that
  a prior can be malign doesn''t make sense as a property of a mathematical object,
  or if the two sides aren''t actually contradicting each other — tell me that plainly
  instead of trying to extract a tidy diagnosis from a confused setup.


