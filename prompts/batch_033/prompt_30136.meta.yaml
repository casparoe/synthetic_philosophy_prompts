  Solomonoff induction: Given a prefix-free universal Turing machine, the prior probability
  of a finite bitstring x is sum over programs p that output x of 2^{-|p|}. Predictions:
  P(x_{n+1} | x_{1..n}). It''s uncomputable (though it can be approximated via Levin
  search / Hutter''s AIXI). It''s optimal in the sense of dominating any computable
  semimeasure up to a multiplicative constant; converges quickly to the true distribution
  if data are generated by a computable source. It''s often presented as a formalization
  of Occam''s razor and "epistemic ideal."


