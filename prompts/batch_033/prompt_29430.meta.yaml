  Requirements:

  - Formal/polished.

  - Names the analogy in common use, who used it, to license what conclusion.

  - Asks how far it holds: what maps onto what, where the mapping breaks, which features
  of the source the analogy quietly imports that the target lacks, and whether the
  conclusion survives once disanalogies are on the table.

