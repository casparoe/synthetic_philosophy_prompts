  "In a seminar on strategic ethics, several participants keep compressing commitment
  races into the folk model of a game of chicken: two drivers speeding at each other,
  each better off if the other swerves first, each courting mutual ruin if neither
  does. From this they draw the conclusion that, in a commitment race, the rational
  way to win is to make your own swerving impossible — or at least to make the other
  side believe it is impossible — since the other side, being rational, will then
  swerve. I suspect the analogy is doing more work than it can bear. Please audit
  it. Lay out explicitly what corresponds to what: the cars, the steering wheel, the
  choice to swerve, the onlookers, the cliff. Then identify where the analogy breaks
  and which of those breaks matter for the intended conclusion: the payoff structure
  (is mutual ruin really worst for both, and is ''winning'' really best?), the simultaneity
  and symmetry of the drivers, the perfect observability of who swerved, the absence
  of sequential moves, private information, domestic audiences, and the fact that
  a real crisis can be repeated over time. Pay special attention to the feature the
  analogy quietly imports — that commitment is a matter of visibly throwing away your
  steering wheel, and that this is therefore a game of nerve rather than a game of
  incentives. Then say whether the conclusion survives once the disanalogies are on
  the table, and what a better analogy or model of a commitment race would be if the
  chicken picture fails."


