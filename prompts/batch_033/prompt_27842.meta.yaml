  Kant''s Formula of Universal Law (FUL): "act only in accordance with that maxim
  through which you can at the same time will that it become a universal law." (Groundwork
  4:421). The test applies to maxims. Two kinds of contradiction:

  - Contradiction in conception: a maxim''s universalization is inconceivable/self-contradictory
  — perfect (narrow) duties. Example: false promising. If everyone made false promises
  when in difficulty, the concept of a promise (and trust) would be undermined, so
  the maxim cannot even be conceived as universal law.

  - Contradiction in willing: the universalized maxim is conceivable but cannot be
  willed because willing it would conflict with something else the agent necessarily
  wills (e.g., one''s own happiness/ends). Imperfect (wide) duties. Example: refusing
  to help others. A will that willed universal non-beneficence could not consistently
  will it, because one might sometimes need the love and sympathy of others; willing
  non-beneficence as a law would deprive one of all hope of assistance.


  Kant explicitly distinguishes his principle from consequentialist/empirical considerations:
  the moral law is determined by its form, not by consequences or inclinations. He
  also says the categorical imperative has several formulations: FUL, Formula of the
  Law of Nature (FLN: act as if your maxim were to become a universal law of nature),
  Formula of Humanity (FH: treat humanity always as an end, never merely as a means),
  Formula of Autonomy, Kingdom of Ends. So reducing Kantian ethics to FUL is reductive.
  Rule-utilitarianism tests rules by aggregate welfare of universal adoption; Kant
  tests maxims by contradiction. They do not coincide in practice: Kant''s ethics
  yields absolute prohibitions (no lying even to save a life? This is disputed—Kant''s
  "On a Supposed Right to Lie" suggests no lying to a murderer at the door, though
  interpreters debate). At minimum they diverge on cases where universal compliance
  with a rule would maximize welfare but the maxim fails the contradiction test or
  vice versa. So the closing claim is an overstatement.


