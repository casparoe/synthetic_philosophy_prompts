  Aristotle on money and exchange:

  - In Nicomachean Ethics V.5, justice in exchange requires proportional reciprocity.
  Money (nomisma) acts as a measure that makes commensurable (symmetros) things that
  are otherwise incommensurable. Need (chreia) holds everything together; money is
  a representative of need by convention. "Money has become by convention a sort of
  representative of demand; and this is why it has the name ''money'' (nomisma)—because
  it exists not by nature but by law (nomos) and it is in our power to change it and
  make it useless." (NE 1133a). I''d avoid quoting.

  - Politics I.8-10: acquisition; natural acquisition (oikonomike) vs. unnatural chrematistike;
  use value vs exchange value; the shoe used as shoe vs as item of exchange; retail
  trade not natural; usury most unnatural because money was intended for exchange,
  not to increase; "the birth of money from money" (tokos = offspring/interest).


