  Let me evaluate the logical induction domain more carefully to avoid factual mistakes.
  The logical induction criterion: A logical inductor is a sequence of probability
  assignments to sentences of a formal language (e.g., Peano arithmetic) satisfying
  certain properties: it assigns high probabilities to provable sentences and low
  to disprovable ones in the limit, but more importantly it avoids being exploited
  by a polynomial-time trader who buys/sells sentences at the inductor''s prices —
  the trader''s wealth should not grow unboundedly. It also has properties like "self-trust",
  not too overconfident about its own future beliefs, and it assigns probabilities
  to undecidable sentences. It''s a criterion for "reasonable" logical uncertainty,
  analogous to how Bayesian conditionalization is a criterion for empirical uncertainty.
  So a type 2 prompt: "I''ve come to think the logical induction criterion (the MIRI
  one) is basically the right answer to logical uncertainty: a good reasoner is one
  whose sequence of probabilities over sentences can''t be exploited by a polynomial-time
  trader. What would count against it? What would have to be true for it to be the
  wrong formalization? Sort defeaters..." This is a good prompt. The model can answer:
  defeaters include (a) it''s too weak — many logically inductors are absurd (e.g.,
  ones that assign crazy probabilities to short sentences for a long time), (b) it
  depends on the choice of language and deductive system, (c) polynomial-time trader
  notion is arbitrary, (d) it doesn''t pin down a unique probability for undecidable
  sentences, (e) empirical evidence? not applicable; (f) maybe a different criterion
  like "logical Dutch books" or "probabilistic truth" / Garrabrant''s? Actually logical
  induction is an answer to a particular problem; alternatives include using an algorithm
