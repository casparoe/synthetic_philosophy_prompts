  ideas which you call books and trees, and at the same time omitting to frame the
  idea of any one that may perceive them? But do not you your self perceive or think
  of them all the while? This therefore is nothing to the purpose; it only shews you
  have the power of imagining or forming ideas in your mind: but it does not shew
