  theory of the world, not their parochial cultural beliefs. Also, the conclusion
  that radical disagreement is unrepresentable may not follow; Davidson indeed argues
  against conceptual schemes, but that''s a different claim. A good answer would correct
  the conflation of truth-maximization with worldview projection.


