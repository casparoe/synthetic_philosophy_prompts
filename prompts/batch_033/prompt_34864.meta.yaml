  paraphrased: "Try to conceive of a tree existing unperceived; in doing so you conceive
  it, so it is perceived." The confusion: it conflates the content of the conception
  with the act of conceiving; to conceive of an unperceived tree, one need not be
  perceiving the tree, and the premise "what is conceived is in the mind" doesn''t
  imply "the object conceived is perceived." Another confusion: it treats "unperceived"
  as "unconceived," sliding from perception to conception. Berkeley''s argument actually
  moves from "conceived" to "perceived"? Let''s recall.


  Berkeley''s master argument appears in Principles §22-23 and Three Dialogues (Hylas
  and Philonous). The argument: "But, say you, surely there is nothing easier than
  for me to imagine trees, for instance, in a park, or books existing in a closet,
  and nobody by to perceive them. I answer, you may so, there is no difficulty in
