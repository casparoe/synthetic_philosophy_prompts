  Cohen''s "easy knowledge": The problem is that we can acquire knowledge of the reliability
  of our belief-forming processes too easily. Example: I know that the table is red
  (by looking). From this I can infer that my color vision is not deceiving me on
  this occasion (since if it were, the table might not be red). Then I can generalize
  to the conclusion that my color vision is generally reliable. This gives "easy knowledge"
  of reliability. The problem: if I can know my color vision is reliable this easily,
