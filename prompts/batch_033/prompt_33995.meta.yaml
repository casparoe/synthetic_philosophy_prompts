  Bootstrapping: Suppose you have a process M (e.g., a gas gauge) that you believe
  to be reliable, but you don''t have independent evidence of its reliability. You
  can "bootstrap": read the gauge (says F), deduce "the gauge reads F," then "the
  gauge read F and the tank is F," and repeat; by enumerating many such conjunctions
  you get evidence that the gauge is reliable. This seems absurd: you can''t confirm
  the reliability of a source using only the source''s own say-so. But the problem
  for reliabilism: reliabilism says knowledge is true belief produced by reliable
  process, and belief in reliability can be acquired by competent deduction from known
  premises — so bootstrapping looks licensed. Vogel used this against reliabilism.
  Cohen''s easy knowledge: seeing a red table, you know the table is red; then you
  can infer "my color vision worked correctly on this occasion," and generalize to
  "my color vision is reliable" — acquiring easy, a priori-ish knowledge of reliability.
  The problem is that this seems too easy: it undercuts the idea that you need independent
  evidence.


