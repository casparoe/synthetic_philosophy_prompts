  I run a small research group inside a company that builds robots and vision systems
  whose internal states are supposed to stand for things in the world: a map the robot
  maintains, object tokens in a perception stack, a planner''s "belief" variable.
  We keep hitting the same argument: when is one of these states a representation
  — something that can be true or false of the world — rather than a merely useful
  correlate? I''ve been told teleosemantics has the sharpest answer to this: roughly,
  a state has content when it has the function of indicating something or of guiding
  behavior in a way that depends on that thing, and it misrepresents when it fails
  at that function. I want that turned into a reusable procedure my group can actually
  run. Write a decision procedure, grounded in the actual teleosemantics literature
  (Dretske''s indicator/function approach and Millikan''s producer–consumer account,
  and where they would diverge), that a non-philosopher engineer can apply in about
  half a day to a given internal state to decide whether the state has semantic content,
  what it represents, and under what conditions it counts as misrepresenting. The
  procedure should be a sequence of questions with what counts as a sufficient answer
  to each, should say where it stops with "no" or "only a correlate," and should explicitly
  flag the steps that are judgment calls rather than facts. Then run it on three cases:
  (a) the honeybee waggle dance, as a calibration case; (b) a hidden unit in a trained
  vision model that activates almost exactly when a door is in the image; and (c)
  a robot''s internal battery-voltage variable that is recorded in logs but never
  consumed by any downstream module. Make sure one of the worked applications reaches
  a conclusion my team will not like, and say explicitly what the procedure cannot
  do. Please also say how confident you are in the procedure and single out the point
  you are least sure of.


