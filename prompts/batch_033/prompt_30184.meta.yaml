  Let me design a concrete runnable activity:


  Setting: upper-level philosophy of science seminar, ~15 students, 75 minutes.


  Materials: a bent/loaded coin (e.g., a coin with a blob of clay on one side), a
  standard coin, a bag with an unknown mix of red/blue beads, a deck of cards, a sealed
  envelope with a statement inside, and some tokens (paperclips).


  Three rounds:


  Round 1 (frequentist): Everyone samples 20 beads with replacement from the bag,
  tallies reds, then as a class pools data to estimate P(red on next draw). They set
  a fair price for a $1 payout bet on red. Bet once. Frequentism works great.


  Round 2 (single case): The facilitator shows a bent coin and says it will be flipped
  exactly once, at the end of the session, then destroyed. Students must write down
  their fair odds for heads and their reasons. Then reveal: different students have
  different odds, and no frequency exists. Ask: is there a fact of the matter about
  the probability, or just their beliefs? Now the facilitator flips the coin once;
  after the result, ask whether the result changes what the probability was beforehand.
  This drives at propensity (single-case physical disposition) vs subjectivism (degrees
  of belief) vs frequentism (no reference class).


  Round 3 (Dutch book/coherence): Students pair up as bookies and bettors. Each bookie
  posts odds (as a line, e.g., "I''ll sell a $1 bet on H for 60 cents and also a $1
  bet on T for 60 cents"—that''s a sure loss; bettor can buy both and guarantee a
  profit). Bettors can buy any combination; if a bookie''s prices are incoherent,
  they get cleaned out. This makes the coherence constraint concrete, motivating subjectivism''s
  normative core.


  Debrief: map rounds to interpretations. Round 1 = frequentism at home. Round 2 =
  the single-case problem for frequentism; propensity''s answer (the coin has a physical
  tendency); subjectivism''s answer (your degree of belief, anything coherent goes).
  Round 3 = what subjectivism needs to avoid arbitrariness: coherence, Dutch books.
  Also what activity cannot reproduce: the metaphysics — no game can settle whether
  single-case probabilities are real physical properties or just credences; it can
  only make the pull of each view felt.


