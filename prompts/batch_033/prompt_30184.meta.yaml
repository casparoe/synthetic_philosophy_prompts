  frequency by test-flipping the bent coin; facilitator must forbid trial flips, or
  let one group test and another not, to see the information-dependence. Some students
  will be risk-averse and confuse odds with payoffs; need to define fair price carefully.
  The Dutch book round can collapse if bookies post nonsensical odds; give a worksheet.


