  - Naturalism (Christopher Boorse): health is statistical normality of function —
  each organ/system performing its species-typical function with at least typical
  efficiency. Disease is a deviation from species-typical functional design, a "dysfunction."
  Value-free: whether the dysfunction is bad is a separate question. Diseases can
  be good (e.g., a condition that confers immunity or is desirable) — health is just
  the absence of disease, and disease is a purely factual, biological notion.

  - Normativism (e.g., Lester King, Lawrie Reznek, Rachel Cooper, Jerome Wakefield
  partly): disease cannot be defined without reference to values — a condition is
  a disease only if it is harmful/bad for the person (or society). A mere statistical
  difference (like being very tall, or having a genetic trait) is not a disease unless
  it causes suffering or disability. Some normativists think "disease" is an evaluative
  label we apply to conditions we disvalue; biological facts constrain but don''t
  determine the classification.

  - Hybrid views (Wakefield''s "harmful dysfunction"): disease = (1) a failure of
  a mechanism to perform its naturally selected function (dysfunction, factual), and
  (2) judged harmful by social values (evaluative). This is a nice middle view.


