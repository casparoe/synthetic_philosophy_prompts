  Title: Honoring Sunk Costs Isn''t Always a Fallacy


  The standard line on sunk costs is pretty unforgiving. Once you''ve spent money,
  time, or effort on something, that investment is gone — you can''t get it back.
  So when you''re deciding whether to continue, you should ignore those sunk costs
