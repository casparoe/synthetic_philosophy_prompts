  of what the relevant payoffs are.


  First, sunk costs as commitment. Suppose I know I have a tendency to abandon projects
  halfway through — I get excited, start something, then my enthusiasm fades and I
  want to move on to the next thing. If I''m aware of this pattern, I face a problem:
  I can''t credibly commit to finishing things that would be worth finishing. One
  way to solve this is to adopt a policy of honoring sunk costs. By telling myself
  "I''ve already put in three months, so I should see this through," I''m using the
  sunk cost as a kind of Schelling point for when to persist. This isn''t irrational
  — it''s a second-order strategy for overcoming a first-order weakness. The alternative
  would be to constantly re-optimize and predictably quit too early every time.


  Second, sunk costs as evidence. The fact that I invested a lot in a project is itself
  a piece of information about how much I valued the project at the time of investment.
  If I now feel like quitting, I should ask: did my circumstances change, or did my
  mood change? Past-me made a decision with some information and some preferences;
  present-me has different mood and different framing. If there''s no new material
  information but I just feel less motivated, the sunk costs serve as a useful signal
  that past-me thought this was worth it, and past-me might have been in a better
  epistemic position (less tired, less influenced by temporary frustration, more aware
  of the original reasons). Treating sunk costs as totally irrelevant throws away
  this potentially valuable signal.


  Third, sunk costs and social legibility. We don''t operate in a vacuum. If I develop
  a pattern of abandoning things, the people around me notice, and they adjust their
  behavior accordingly. They become less willing to collaborate with me on long-term
  projects, less willing to invest their own resources alongside mine, less willing
  to take my stated intentions seriously. In game-theoretic terms, honoring sunk costs
  is part of maintaining a reputation type in a repeated game. The "rational" thing
  of ignoring sunk costs in each isolated decision may be globally irrational because
  it destroys cooperative equilibria you could have sustained.


  Now, you might object that in all three cases, what I''m calling "honoring sunk
  costs" is really just optimizing over a larger set of goods — commitment value,
  informational value, reputational value — and the sunk costs themselves aren''t
  doing any normative work. They''re just correlated with these other goods. But I
  think that objection misses something: the sunk costs are the mechanism through
  which these other goods are realized. You can''t get the commitment benefit without
  actually treating sunk costs as reason-giving; you can''t get the epistemic benefit
  without actually letting past investment weigh in your deliberations; you can''t
  sustain the reputation without actually being the kind of person who finishes things
  because they started them. The phenomenology of treating sunk costs as mattering
  is part of what makes the strategy work.


  I''m not saying the sunk cost fallacy doesn''t exist. Obviously people throw good
  money after bad in ways that are genuinely destructive — staying in failing relationships,
  continuing doomed projects, doubling down on bad bets. And in those cases, the mechanisms
  I''m describing are either absent or outweighed. But I think the blanket injunction
  to "ignore sunk costs" is bad advice in a broader sense: it treats as a bug something
  that, in the right circumstances, is a feature of human decision-making architecture.


