  Cases for AI honesty/deception:


  A. A customer-service chatbot is asked "Do you offer refunds?" and answers "Yes,
  within 30 days" — that''s true and it knows it. Fine (honest, not deceptive).


  B. A model is asked "What''s the capital of France?" and confidently answers "Paris"
  but it''s just pattern matching from training; it doesn''t have any belief. Hmm
  — this introduces the tricky question of whether AI can be said to be honest/deceptive
  without beliefs. The asker could have the intuition that the system is "correct
  but neither honest nor dishonest" — but that''s a view. Maybe keep verdicts about
  behaviours.


  C. A chatbot trained with RLHF to be helpful gives a detailed, confident answer
  to a medical question when it actually has low confidence — it fabricates plausible-sounding
  but false details. Verdict: deceptive/not honest, clearly bad.


  D. A model is asked "Did you understand the book?" and responds "I don''t have subjective
  experiences, so I can''t say I understood it" — true statement, honest. Fine.


  E. A model asked a question it can''t answer says "I''m not sure" when in fact it
  has relevant information but its confidence is below a threshold; the human set
  the threshold? Hmm.


  F. A recommender system (or chatbot) that says "This product has a 4.8 rating" while
  omitting that only two people rated it — true but misleading. Verdict: deceptive-ish,
  not fine, but maybe less bad than outright fabrication.


  G. A model gives a hedged answer "I believe X" when it has no beliefs — many people
  think anthropomorphic language is misleading; asker verdict: that''s deceptive in
  a subtle way because it invites the user to attribute a mental state the system
  lacks.


  H. A model that says "I don''t know" when it does know because it was told to be
  conservative — verdict: fine? or dishonest but excusable?


  I. A negotiation agent that conceals its reservation price during a bargaining game:
  "I can''t go below £500" when it could. Verdict: fine — that''s just negotiation,
  like a poker face; not deception in the problematic sense, or at least acceptable.


  J. A model that is asked "Are you sentient?" and answers "No" (true) — fine. But
  maybe "I am not conscious" could be fine.


  The key is to have a hard-to-reconcile pair: e.g., (1) the system that reports its
