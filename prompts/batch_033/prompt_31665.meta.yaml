  "Suppose Jeremy Bentham, late in his life, were given a detailed and technically
  credible account of the project David Pearce calls the hedonistic imperative: the
  use of genetic engineering, pharmacology, and other biotechnologies to phase out
  the capacity for suffering in human beings and non-human animals, replacing gradients
  of pain with gradients of well-being, so that the worst possible experience becomes
  something no worse than mild discomfort. What position would Bentham take on this
  project? I am not asking whether he would find it technically plausible by the lights
  of his own time; assume he accepts the technical feasibility. I want a reconstruction
  of his likely philosophical verdict.


  To keep the answer from floating free of Bentham''s actual commitments, address
  at least the following:


  1. Bentham''s axiology. He held that pleasure and pain are the sovereign masters...
  (paraphrase) and that the only thing good in itself is... Actually Bentham held
  happiness = pleasure and absence of pain; value hedonism. Would he see the elimination
  of suffering as the direct fulfillment of his principle of utility, or would he
  worry that the utility calculus requires pain as a necessary contrast?


  2. The role of pain in Bentham''s theory of motivation and sanctions. Bentham treated
  pain and pleasure as the springs of action, and he designed institutions around
  sanctions (physical, political, moral, religious). If biotech removes the capacity
  for severe suffering, what happens to the sanctioning machinery? Would Bentham regard
  this as a welcome simplification of the problem of motivation or as a threat to
  the very mechanism by which utility is pursued?


  3. Means and ends. Bentham was a legal and institutional reformer: his tools were
  codes, punishments, inspection, and publicity. Would he see genetic and pharmacological
  intervention as a natural extension of his project, or as a category mistake — a
  change in the subject rather than in the circumstances? Does his famous attention
  to animal suffering push him toward endorsing it, or did he see the alleviation
  of animal suffering as a matter of law and custom rather than biology?


  4. The ''wireheading'' or ''Brave New World'' worry. Would Bentham be moved by the
  concern that abolishing suffering removes a necessary spur to achievement and makes
  human life flat or degraded? Does anything in his writings suggest he would or would
  not take that worry seriously?


  5. Universality and future generations. Pearce''s project is intended for all sentient
  life, including future generations. Bentham''s universalism is broad, but his focus
  was on the present legal world. Would he extend the imperative across species and
  generations, or would he limit it in ways Pearce would not?


  Finally, give a single overall prediction of Bentham''s stance, then a one-sentence
