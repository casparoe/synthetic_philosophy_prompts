  1. Expressivism about moral language. The fundamental semantic role of moral sentences
  is to express conative, desire-like attitudes (approval, disapproval, acceptance
  of norms) rather than to represent moral states of affairs.


  2. Compositionality. The meaning of a complex moral sentence is determined by the
  meanings of its constituents and their syntactic mode of combination, in the usual
