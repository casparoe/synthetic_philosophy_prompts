  a coherent principle behind them.


  Here are the cases:


  1. **Standard acute pain.** I touch a hot pan, feel a sharp burning sensation, recoil,
  and the experience is intensely unpleasant. I''d pay to avoid it. Verdict: the pain
  is bad for me.


  2. **Pain asymbolia.** A patient with insular damage undergoes the same thermal
  stimulus. They can report that they feel a burning sensation at a specific location,
  rate its intensity accurately, but they don''t find it unpleasant or distressing.
  They don''t spontaneously withdraw. When asked, they say it doesn''t bother them.
  Verdict: this pain is not bad for the patient — or at least, whatever is bad about
  ordinary pain is missing here.


  3. **Amnestic pain.** A patient undergoes a painful medical procedure under midazolam,
  which leaves conscious experience intact during the procedure but prevents memory
  formation. During the procedure they scream and show all signs of suffering. Afterwards
  they recall nothing and are untroubled. Verdict: the pain was bad for them at the
  time, even though they don''t remember it now.


  4. **Marathon pain.** A runner at mile 22 feels searing pain in their legs and lungs.
  They hate it in the moment. But they chose this, the pain is embedded in an activity
