  Domain: dispositions, finks, masks. Key philosophical content:

  - A disposition (fragility, solubility, toxicity, courage?) is typically analyzed
  via a conditional: x is disposed to M in response to stimulus S iff, if S were to
  occur, x would M.

  - Fink: a disposition that disappears when its stimulus occurs. Classic: a sorcerer
  protects a fragile glass by making it non-fragile at the instant of striking. Or
  "a dead person''s...". The conditional "if struck, would break" is false, but the
  glass is fragile. So simple conditional analysis fails.

  - Mask: disposition present but manifestation blocked by something. Fragile vase
  wrapped in packing foam: if struck (by hammer) it wouldn''t break because of the
  packing, but it''s still fragile. So the conditional fails again.

  - Antidote: for poisons, e.g., poison still poisonous though if ingested, antidote
  prevents death.

  - The distinction between disposition and its manifestation; intrinsic vs extrinsic;
  "surefire" dispositions; ceteris paribus conditionals; Lewis''s reformed conditional
  analysis (x is disposed to M iff x has some intrinsic property B such that, if x
  were in conditions C and S occurred, then... with M). Bird, Choi, etc.


