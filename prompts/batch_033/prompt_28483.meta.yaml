  Pain asymbolia: patients with this condition (often after certain brain lesions,
  e.g., insular damage or cingulotomy) can identify painful stimuli, locate them,
  rate their intensity, but deny that they "hurt" or bother them; they don''t withdraw
  or avoid. This challenges the idea that pain is essentially a single thing with
  sensory and affective components fused. It suggests the badness of pain might be
  separable from pain''s sensory-discriminative character. Philosophical questions:
  Is the badness of pain intrinsic to the sensation, or is it a separate evaluative/affective
  component? Is asymbolia a case of pain without painfulness? Or are the patients
  not really in pain? The "badness of pain" debate: representationalists, motivational
  theorists (pain as imperatival, "that hurts, make it stop"), evaluativists. The
  prompt could ask the model to read Omelas through this lens.


