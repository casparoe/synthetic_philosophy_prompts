  myself judging them.


  1. Gradual in-place replacement. Over roughly a decade, a patient''s biological
  neurons are replaced one at a time by silicon neurons that are functionally equivalent
  to the ones they replace, each new neuron wired so that the surrounding network
  cannot detect a functional difference. The patient is awake for much of the process
  and reports an unbroken sense of being the same person. Verdict: the patient survives,
  and the silicon-brained person at the end is the same person as the original.


  2. Destructive scan-and-run. A person''s brain is scanned at a resolution sufficient
  to reconstruct its connectivity, a process that destroys the tissue, and the resulting
  map is used to run a simulation of that person. Verdict: the person dies; the simulation
  is a new person with the same memories.


  3. Non-destructive copy. The same kind of scan is performed without destroying the
  brain. The original leaves the scanner, and a simulation of them is started on a
