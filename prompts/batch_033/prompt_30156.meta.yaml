  I cover emerging neurotechnology for a general-interest magazine, and I keep coming
  back to the same set of hypothetical cases when I think about whether "uploading"
  a mind would preserve the person or merely produce a copy. I have been collecting
  my own gut verdicts on these cases for a while, and I would like to know whether
  there is a defensible principle behind them, or whether I am just inconsistent.
  Here are the cases and my verdicts.


  1. **Gradual in-place replacement.** Over the course of a decade, a patient''s biological
  neurons are replaced one at a time by silicon neurons that are functionally identical
  to the ones they replace, each new neuron wired so that the surrounding network
  notices no functional difference. The patient is awake for much of this and reports
  an unbroken sense of being the same person. Verdict: the patient survives; the silicon-brained
  person is the same person as the biological original.


  2. **Destructive scan-and-run.** A brain is frozen and sliced for high-resolution
  scanning, and the resulting connectivity map is used to run a simulation of the
  person. The process obviously destroys the original brain. Verdict: the person dies;
  the simulation is a new person with the same memories.


  3. **Non-destructive copy.** The same scan is performed without destroying the brain.
  The original walks out of the scanner, and a simulation of them is started on a
  computer. Verdict: the original is the person; the simulation is a distinct person
  — a twin, not a continuation of the original.


  4. **Whole-brain swap under anesthesia.** A patient is anesthetized and their entire
  brain is replaced in a single operation by a silicon brain implementing the same
  functions. When the patient wakes, they have the same memories, skills, and personality.
  Verdict: I am genuinely torn. My first reaction is that this is death followed by
  a copy, but I cannot point to anything that happened in the operation that is different
  in kind from the decade-long replacement in case 1, except the speed and the loss
  of consciousness during the switch.


  5. **Piecemeal transfer to a computer.** A patient''s brain is connected to a computer,
  and over many months, subsystems are transferred one at a time: a module of cortex
  is simulated on the machine, its biological counterpart is then disabled, and the
  rest of the brain begins interacting with the simulated module. The patient remains
  awake and reports no interruption. At the end, the biological brain is inert and
  the whole mind runs on the computer. Verdict: the patient survives, and the final
  simulation is the same person.


  6. **Restoration from backup after death.** A person dies suddenly. An hour later,
  a backup made the previous week is run as a simulation. Verdict: this is not the
  person; it is a copy with a week of missing memories.


  7. **Branching during piecemeal transfer.** In a variant of case 5, each biological
  module is not destroyed when it is simulated; it is kept alive in a vat and its
  activity is fed back into the system in parallel with the simulated module, so that
  for a while the person has, in effect, two copies of each transferred subsystem
  running at once. Eventually the biological modules are disconnected and the vat-supported
  brain wakes up as a second claimant. Verdict: I have no stable intuition here. It
  seems wrong to say both are the original, but I cannot see a non-arbitrary reason
  to pick one.


  Is there a single principle of personal identity — or of what matters in survival
  — that yields most of these verdicts? If so, state it precisely, say what it predicts
