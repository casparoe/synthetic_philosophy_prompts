  The unilateralist''s curse (from Bostrom, Douglas, and Sandberg) says: in a situation
  where any one actor can take an action that affects everyone, and actors have different
  judgments about whether the action is good, the action will be taken if at least
  one actor (mistakenly) thinks it''s good enough - even if the majority or the most
  expert think it''s bad. The curse is that the group''s decision is determined by
  the most optimistic (or least cautious) member.


