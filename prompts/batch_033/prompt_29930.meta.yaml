  Question: Present the central commitments of moral particularism as defended by
  Jonathan Dancy, with particular attention to the holism of reasons. Then explain
  how a generalist might respond, and assess whether the holism of reasons, if true,
  forces the rejection of moral principles.


  Student answer: Moral particularism, associated above all with Jonathan Dancy, is
  the view that sound moral judgment does not consist in applying a set of general
  principles to particular cases. Its central commitment is the holism of reasons:
  a consideration that counts in favor of an action in one context may count against
  it, or count for nothing, in another. For instance, the fact that an action would
  cause someone pain is normally a reason against doing it, but in some contexts the
  very same feature could be a reason in favor, or no reason at all. If holism is
  true, then no moral generalization of the form such-and-such a feature is always
  a reason can be true, since every candidate principle will meet with exceptions.
  Generalism is therefore committed to fixed-valence principles, and the holism of
  reasons refutes it. The generalist W. D. Ross tried to preserve principles by making
  them exceptionless absolute duties, such as the duty to keep promises, but this
  is exactly the kind of view holism undermines. Particularists can still allow rough
  rules of thumb that summarize past experience, but these are not principles in the
  relevant sense, because they do not determine or ground a correct moral judgment.
  I conclude that if the holism of reasons is true, generalism is untenable.


