  I keep running into two different ways of figuring out what caused what, and I can''t
  tell if their the same idea wearing different clothes or two genuinely rival theories,
  so I''d like you to sort it out.


  The first is tort law. To hold someone liable for an injury, the plaintiff usually
  has to prove factual causation, and the standard test is but-for: would the harm
  have happened without the defendant''s conduct? If it would have happened anyway,
  there''s no causation. Courts mostly stick with this, but they patch it for cases
  where it gives silly answers, like two fires that merge and either one alone would
  have destroyed the house, or two shooters firing at the same moment. So the law''s
  basic picture is counterfactual: causation is about a world with the cause removed.
  I know there''s also a proximate cause doctrine; I''m setting that aside and focusing
  on the factual causation step.


  The second is medicine and drug regulation. The FDA won''t approve a treatment for
  an efficacy claim based only on observational evidence, no matter how carefully
  it''s statistically adjusted. It wants randomized controlled trials, where you actively
  intervene to change the treatment and watch whether outcomes change. The gold standard
  is basically change the variable and see what happens. That sounds like a different
  picture: causation is about manipulation, not about subtracting the cause from the
  world.


  These also seem aimed at different targets. The law wants a yes-or-no answer about
  whether this defendant''s conduct caused this plaintiff''s injury, while a trial
  gives you a population-level average effect. I don''t know whether that difference
  matters for the underlying theory, but I suspect it does.


