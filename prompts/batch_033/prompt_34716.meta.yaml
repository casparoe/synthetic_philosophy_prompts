  I keep running into a pattern in coordination problems and I don''t have a name
  for it. Two parties want to act together, and acting alone is costly — say, two
  commanders on separate hills who must attack the same city simultaneously, or two
  people who must both show up to sign a contract. They have already agreed on the
  plan and on the time. The only remaining task is to confirm that both are ready,
  and they communicate by messages that can fail to arrive. So one sends a message
  saying ready. The other receives it and replies, confirmed. The first receives the
  confirmation and replies, confirming the confirmation. And so on. Now, after a long
  chain of such acknowledgments, it seems as though they should be effectively certain
  of each other''s readiness. But notice that the sender of the very last message
  never knows whether it arrived. So no matter how many messages have gone back and
  forth, one of them is always one message short of certainty, and the rational action
  unravels all the way down: even with a very small chance that any single message
  is lost, they can never coordinate with confidence. I find this strange because
  the probability of failure seems like it should shrink with each extra acknowledgment,
  and yet the logic of the case does not let it shrink at all.


