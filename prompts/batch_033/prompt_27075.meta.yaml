  The essay would open from the observation that HCH and factored cognition both rest
  on a decompositional picture of reasoning: a hard question is broken into smaller
  questions, each of which can be answered, and checked, without understanding the
  whole. In software terms, this is the claim that a monolith can be refactored into
  components with clean interfaces and local testability. I want to argue two things.
