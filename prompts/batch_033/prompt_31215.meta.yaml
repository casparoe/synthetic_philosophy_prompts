  the pleasure of eating, the relief of pain cessation, etc. What do they all have
  in common in virtue of which they are all good? If "pleasure" is just a catch-all
  for any enjoyable experience, then hedonism might be vacuous or the unity is unclear.
  Classic responses: (1) felt-quality view: pleasures share a distinctive felt quality
  ("hedonic tone"), but introspection suggests otherwise; (2) attitudinal/adverbial
  theories: pleasure is not a sensation but an attitude of liking/enjoying taken toward
  an object; what''s common is the attitude, not a feeling. But then is the attitude
  itself good, and can the attitude be heterogeneous too? (3) Motivational/functional
  theories: pleasure is whatever mental state we''re disposed to want to continue,
