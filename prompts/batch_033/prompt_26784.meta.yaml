  Jeffrey conditionalization (probability kinematics): when evidence is uncertain,
  update by weighted average of the posterior given E and posterior given ¬E, weighted
  by new probabilities of E and ¬E. Key issues: rigidity (the conditional probabilities
  given E and ¬E stay fixed through the update), the problem of uncertain evidence
  / Jeffrey''s problem, the regress problem (Jeffrey''s rule requires an exogenous
  input — the new probability of E — but how is that acquired? If by conditioning
  on another uncertain proposition, regress; Jeffrey says the input is a "judgment"
  not itself the output of a rule), commutativity (Jeffrey updates don''t commute
  in general? Actually they do commute if the partitions are... not always), and the
  "old evidence" problem? Also whether uncertain evidence should be modeled as certainty
  about a proposition about experience (some argue Jeffrey''s rule is unnecessary
  because you can condition on the certain evidence of your experience — the "probability
  kinematics vs. strict conditionalization on experience" debate). Field, Garber,
  etc.


  The commitments audit could be:


  (1) I think evidence rarely if ever comes in the form of "I now assign probability
