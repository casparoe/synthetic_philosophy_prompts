  Nguyen''s distinction (I know this): An epistemic bubble is a social epistemic structure
  in which some relevant voices are excluded, often through omission (you just don''t
  hear from certain people, maybe because of personalized feeds). An echo chamber
  is a social epistemic structure in which other voices are actively discredited,
  so that trust is manipulated; members are brought to distrust outsiders, such that
  contrary evidence is seen as coming from untrustworthy sources. Key claims:

  - Epistemic bubbles can be burst by exposure to the missing information; echo chambers
  resist correction because they corrupt the trust structure.

  - One can be in an echo chamber without an epistemic bubble, and in a bubble without
  an echo chamber.

