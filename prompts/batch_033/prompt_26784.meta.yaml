  Jeffrey conditionalization:

  - Input: a new probability distribution over a partition {E_i} of some evidence
  proposition; the posterior P''(H) = Σ_i P(H | E_i) P''(E_i).

  - Rigidity condition: P''(H | E_i) = P(H | E_i) for each i. This is assumed.

  - Jeffrey''s "probability kinematics" (The Logic of Decision, 1965).

