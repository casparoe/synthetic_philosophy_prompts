  shape and become 0.7 confident it''s my friend).

  (2) So I think strict conditionalization is the wrong model for most real learning,
  and Jeffrey conditionalization is the right rule for updating on uncertain evidence.

  (3) I think Jeffrey''s rule is the only way to update: the new probability of E
  is an input, a judgment, not something itself derived by a further application of
  a rule, on pain of regress.

  (4) I think rational update should be commutative: the order in which I take in
  two pieces of uncertain evidence shouldn''t matter to where I end up.

  (5) I think any rational change of mind can be represented as the result of some
  (possibly sequence of) Jeffrey updates.

  (6) I think the inputs to Jeffrey''s rule (the new probabilities of the evidence
  partition) must themselves be justified by the evidence, not arbitrary.


