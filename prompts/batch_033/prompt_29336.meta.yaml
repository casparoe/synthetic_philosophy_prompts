  I''m drawn to the units of selection "grain problem" argument. Let me flesh it out.


  The gene''s-eye view (Williams 1966, Dawkins 1976) holds that the gene is the unit
  of selection. Standard argument:

  1. Evolution by natural selection requires heritable variation in fitness.

  2. In sexual reproduction, individuals are broken up and recombined each generation;
  only genes (alleles) are transmitted intact enough to be units of cumulative selection.

  3. Therefore, selection "really" acts on genes; organisms are just vehicles; apparent
  group or individual selection is really gene-level selection.


  The "proves too much" move: the same criterion of persistence/replication fidelity
  is a matter of degree. A "gene" is itself a stretch of DNA that can be broken by
  recombination (crossing over within a gene, though rare), can have internal mutations
  at specific nucleotide sites, and a given allele persists for a limited number of
  generations. So by the same reasoning, the unit should be the nucleotide, or the
  codon, or the base pair — or, going the other direction, a linkage group / chromosome
  / genome, since linked genes are transmitted together. Where you draw the "gene"
  boundary is arbitrary relative to the argument''s own criterion. Moreover, if you
  can always push the unit down, the claim "the gene is THE unit of selection" either
  collapses into "whatever is inherited is a unit" (trivial) or rests on an arbitrary
  convention. So the argument proves too much: it proves that there is no privileged
  level, including the gene level.


  Alternatively, the "prove too much" could be: the same gene-centric reasoning that
  dissolves group selection also dissolves the organism as a unit — but gene-centrists
  often don''t mind that. The deeper one: it dissolves the gene itself.


  There''s also the well-known point that replicator persistence is not the same as
  the level at which selection acts (interactor vs replicator; Hull). And the "levels
  of selection" debate concerns interactors, while the gene''s-eye view concerns replicators
  — the two are not rivals if you distinguish them (pluralism). So the argument could
  equivocate between "unit of selection" as replicator and as interactor. That''s
  a subtle flaw: the premise "selection requires heritable variation" concerns replicators;
  the conclusion "selection is at the gene level, not the organism or group level"
  concerns interactors. The equivocation is between two senses of "unit of selection."


