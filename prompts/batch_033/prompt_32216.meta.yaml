  a book of intellectual history that summarizes the position, and I need to know
  how far I can trust it before I let a character argue from it."


  Then the summary:


  "The chapter says, roughly, this. Kierkegaard''s real enemy was the daily press,
  which he despised for replacing sober reporting with gossip, rumor, and partisan
  spin. The readership produced by the press he called the public, and by that he
  meant the mob — the uneducated many, as opposed to the cultivated few. His slogan,
  the crowd is untruth, is therefore an epistemological warning: majority opinion
  is generally unreliable, so a thoughtful person should discount whatever most people
  happen to believe. The press, on this account, creates leveling, which the chapter
  glosses as the modern democratic habit of treating everyone''s opinion as equally
  valid, and Kierkegaard saw this as a disaster because he was an elitist who believed
  some people are simply nobler than others. His remedy was to turn one''s back on
  politics and public life, stop reading newspapers, and retreat into a private religious
  inwardness where the individual could finally be authentic. The chapter ends by
  saying that Kierkegaard would have recognized social media as leveling perfected
  — the same anonymous public, the same rage, the same flight from responsibility."


