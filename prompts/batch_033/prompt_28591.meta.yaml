  a confusion. Agents always have a preference ordering revealed by their choices,
  and the phenomenon of "hard choices" merely reflects computational difficulty or
  indifference, not a deep metaphysical fact about values.


  6. **The vagueness view**: Incommensurability is a species of semantic vagueness.
  "Better than" is a vague predicate, and in borderline cases it is indeterminate
  which option is better. Hard choices are cases where the comparative value relation
  is indeterminate, not cases where it is absent.


