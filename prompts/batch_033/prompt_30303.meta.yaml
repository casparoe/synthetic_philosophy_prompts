  ''at least as good as'' must fail to be transitive, or else that our pairwise judgments
  across such a spectrum cannot all be trusted. I came away holding the opposite view:
  betterness is transitive, and the real lesson of the spectrum is that some step
  in the chain is being misdescribed — perhaps a small loss of quality is not always
  a genuine improvement, perhaps the apparently innocent step is not innocent once
  context and threshold effects are made explicit, or perhaps our pairwise judgments
  are simply noisy at small differences.


