  they''re real. The prompt can mention phlogiston — that''s a common example, safe.


  Prioritarian + leveling-down: Prioritarianism: a view in distributive ethics where
  the value of a benefit to a person is weighted by their absolute level of well-being
  (with diminishing marginal moral value); it''s welfarist, not concerned with equality
  per se. The leveling-down objection targets egalitarianism: if equality is valuable
  in itself, then a change that reduces inequality by harming the better-off (and
  helping no one) seems to be an improvement in one respect, which many find implausible.
  Prioritarians avoid this because they don''t value equality itself, only improvements,
  weighted toward the worse off. Egalitarians respond: telic egalitarianism may accept
  that leveling down is pro tanto good but not all-things-considered; or they deny
  it''s good at all if equality''s value is conditional on benefiting someone; or
  distinguish deontic egalitarianism. The crux: whether equality has non-instrumental
  value; whether a change that helps no one can make the world better; whether unfairness
  is bad independently of welfare.


