  Eliminative materialism (Churchland, Stich): The view that folk psychology (our
  common-sense framework of beliefs, desires, intentions) is a theory that is likely
  false, and that its posits (propositional attitudes) don''t exist; mature neuroscience
  will eliminate them. Opponents: intentional realists (Fodor, etc.) who think beliefs/desires
  are real and indispensable. Key issues: folk psychology''s predictive/explanatory
  success; its failures (mental illness, learning, memory, sleep, etc.); whether it''s
  a degenerating research program (Lakatos); introspection as evidence; whether it
  can be smoothly reduced to neuroscience or will be eliminated; the analogy to phlogiston,
  caloric, witches. Good cruxes.


  The prompt should be careful: "eliminative materialist" says beliefs and desires
