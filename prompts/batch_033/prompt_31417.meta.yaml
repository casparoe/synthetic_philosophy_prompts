  Where it goes wrong: several candidate escape routes.


  (a) The information isn''t actually costless if observing it has hedonic or other
  consequences (anxiety, dread) that enter the utility function. The theorem only
  says expected *utility* is nonnegative; if learning the news itself causes disutility
  (or the process of testing is unpleasant, or knowing changes your enjoyment of future
  activities), then it''s not free. This is the standard "move." But this seems too
  easy; the interesting version stipulates the information is utility-costless and
  still ask whether it can be rational to avoid it.


  (b) The theorem assumes you''ll choose optimally after learning. If you know you
  won''t — e.g., you''ll become depressed and fail to act, or you''ll be tempted and
  akratic — then the value of information can be negative. This is the "sophisticated
  chooser" point: if you predict your future self will not maximize according to your
  posterior (or will act in a way that''s bad by your current lights), free information
  can hurt. Example: a test result that would make you so despondent you can''t function;
  or information that triggers a compulsion you know you can''t resist. Then you can''t
  "just ignore it" because ignoring it is not under your control once you''ve seen
  it; the theorem''s dominance step assumes the same feasible set of acts is available
  and that you''ll pick the best one.


  (c) The theorem assumes stable preferences/values. If the information itself will
  change what you value (not just your beliefs), then the posterior choice maximizes
  a different utility function, and there''s no single utility function across the
  comparison; the expected-value comparison is ill-defined. This is the preference-change
  / transformative experience (L.A. Paul) angle: you may rationally decline information
  that would change your values, because the value of the later act is judged by a
  different standard.


  (d) More subtle: the theorem assumes you''re certain you''ll update by conditionalization.
  If you suspect the information will be misleading or that you''ll over-update (e.g.,
  base-rate neglect), then information can lower your expected accuracy/utility. But
  a "committed Bayesian" would say conditionalization is the norm, so this is outside
  the model.


  (e) Another subtlety: the theorem concerns expected utility, not actual outcomes.
  Free information can''t lower *expected* utility, but it can lower actual utility
  in some states (you can be unlucky and be misled). That''s not a flaw in the theorem,
  just a distinction between ex ante and ex post. This is often confused: people reject
  the theorem because they think of the bad state, but the rational standard is ex
  ante. This might be the "equivocation" the asker''s friend makes — sliding from
  ex ante to ex post.


  (f) Another deep issue: the theorem assumes that the act of deciding to acquire
  information is itself part of the decision problem and that "ignoring" is a feasible
  act at the later stage. But in some cases, once you have the information you cannot
  make yourself ignore it in action (e.g., if the information is about your own preferences,
  or if it changes your beliefs in ways you can''t undo). The dominance argument requires
  that the same set of acts is available after learning, including "act as if you
  hadn''t learned." But if learning changes you — e.g., gives you an irresistible
  desire — that act isn''t available. So the theorem proves too much because it assumes
  the information is "neutral" with respect to your capacities.


