  The theorem''s core argument (the "you can always ignore the information" argument):


  Setup: You face a choice among acts A1...An. A costless signal S will be observed
  (or not), taking values s1...sk, generated by a likelihood. Your prior P. You may
  choose to observe S or not, and you''ll then choose an act. Define:


  - Without information: choose act a* maximizing expected utility under prior: U_no_info
  = max_a Σ_w P(w) u(a,w).

  - With information: for each signal s, after updating to P(·|s), choose a_s maximizing
  Σ_w P(w|s) u(a,w). Expected value of the information is E_s[U(a_s, s)] = Σ_s P(s)
  max_a Σ_w P(w|s) u(a,w).


  The theorem: this expectation ≥ U_no_info. Proof: for each s, max_a Σ_w P(w|s) u(a,w)
  ≥ Σ_w P(w|s) u(a*,w), since a* is just one of the options. Taking expectation over
  s: E_s[max_a Σ_w P(w|s) u(a,w)] ≥ E_s[Σ_w P(w|s) u(a*,w)] = Σ_s P(s) Σ_w P(w|s)
  u(a*,w) = Σ_w u(a*,w) Σ_s P(s) P(w|s) = Σ_w u(a*,w) P(w) = U_no_info. So VEI ≥ 0.


