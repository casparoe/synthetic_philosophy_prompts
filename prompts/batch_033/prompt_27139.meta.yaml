  Key concepts:

  - Disposition: fragility, solubility, etc. A dispositional property is a property
  that an object has in virtue of its being such that it would manifest a certain
  response under certain stimulus/trigger conditions.

  - Simple conditional analysis (SCA): x is disposed to M when stimulated by S iff,
  were x to undergo S, x would M. (e.g., x is fragile iff if x were dropped, x would
  break.)

  - Problems: finks and masks.

  - A fink (C.B. Martin 1994, "Dispositions and Conditionals"): something that, upon
  the stimulus, removes the disposition before manifestation occurs. E.g., a wire
  that is live (disposed to conduct/electrocute when touched) but connected to a safety
  device that turns it off the instant it''s touched. So the counterfactual "if touched,
  it would conduct" is false, yet the wire is live. Finks show the simple conditional''s
  truth conditions fail from left to right? Actually a finkish disposition is a case
  where the disposition is present but the conditional is false — so the SCA is too
  strong/incorrect because the stimulus condition itself interferes.

  - A mask (antidote): something that prevents manifestation without removing the
  disposition. E.g., a poison that is lethal (disposed to kill when ingested) but
  an antidote in the bloodstream masks the manifestation; the poison remains lethal.
  Or a fragile glass wrapped in bubble wrap: if dropped, it wouldn''t break, but it''s
  still fragile. Bird''s antidotes, Johnston''s masks.

  - Distinction: finks remove/disrupt the disposition itself (the intrinsic causal
  basis) when triggered; masks leave the disposition intact but block the manifestation
  by interfering with the causal process leading to it.

  - Lewis''s reformed conditional analysis: x is disposed to M when stimulated S iff
  x has some intrinsic property B such that, if x were to undergo S while retaining
  B sufficiently long, S and B would jointly cause M. This handles finks but arguably
  not masks? Actually Lewis intended to handle both: masks are cases where something
  interferes, but if the basis B is retained and the stimulus occurs, would S and
  B cause M? In a mask case, the mask is an extrinsic interference that prevents S+B
  from causing M, so the reformed conditional would still be false. Lewis''s analysis
  requires an intrinsic property B such that the stimulus S and B together cause manifestation
  — masks are external interferences, so the analysis might still fail for masks unless
  "ceteris paribus" clauses. Bird discusses that masks are a problem for Lewis. Some
  argue Lewis''s account handles finks but not masks. So a subtle mistake could be
  conflating finks with masks or saying Lewis''s reformed analysis solves both when
  it arguably doesn''t.


  Other nuances:

  - Choi and others distinguish "ordinary dispositions" vs "dispositional predicates."

  - Manley and Wasserman''s "Progressive" account of dispositions, gradable dispositions.

  - The distinction between dispositional properties and categorical bases; prioritarianism
  vs causal bases.

  - The "Intrinsic" vs "extrinsic" dispositions (McKitrick).

  - Multi-track dispositions.


