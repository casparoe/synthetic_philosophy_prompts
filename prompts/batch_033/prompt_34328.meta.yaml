  or less any level of intelligence can be combined with more or less any final goal.
  Instrumental convergence thesis: a broad set of intelligent agents with diverse
  final goals will converge on certain instrumental subgoals (self-preservation, resource
  acquisition, goal-content integrity, cognitive enhancement, etc.) because they''re
  useful for almost any final goal. These two theses structure AI risk debates.


