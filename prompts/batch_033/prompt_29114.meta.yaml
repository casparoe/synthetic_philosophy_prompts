  The Special Composition Question (SCQ), as posed by van Inwagen in Material Beings
  (1990): Under what conditions does composition occur? When is it true that some
  xs compose a y?


  Positions:

  - Mereological nihilism: composition never occurs (or only... no, never — there
  are no composite objects). Only simples exist; ordinary objects don''t exist. (Some
  nihilists: Dorr, Sider at times.)

  - Universalism (mereological universalism): composition always occurs — any xs,
  however scattered, compose something. (Lewis, Sider.) Note: restricted composition
  is false; any plurality composes.

  - Van Inwagen''s organicism (the proposed answer): composition occurs exactly when
  the activity of some xs constitutes a life. So there are no tables or chairs, but
  there are living organisms. The xs compose something iff their activity constitutes
  a life.

  - Brutalism (Markosian): there is a fact of the matter about when composition occurs,
  but it''s brute — no true, nontrivial, finite answer. "Compositional facts are brute."
  This is a kind of restrictivism without an informative principle.

  - Principled restrictivism / moderate answers: composition occurs under certain
  non-trivial conditions, e.g., contact (van Inwagen discusses "Contact" — xs compose
  iff they''re in contact), fastening, fusion (not mereological fusion), etc. These
  are usually rejected. Also "series" style answers. Common-sense restrictivism (Markosian''s
  "brutal composition" is a version).

  - Composition as identity (CAI): the whole is identical to its parts (Baxter, early
  Lewis?). This is more a thesis about the nature of composition than an answer to
  SCQ, but interacts.

  - Deflationism / anti-realism about SCQ: maybe the question has no determinate answer;
  composition is vague (Lewis''s argument that vagueness is semantic, not ontic; but
  Sider argues composition cannot be vague). Some hold there''s no fact of the matter.

  - Mereological nihilism vs "only living things exist" — van Inwagen''s view is sometimes
  called "organicism."


