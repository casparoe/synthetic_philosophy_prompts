  theory: c causes e iff e causally depends on c, where e causally depends on c iff
  if c had not occurred, e would not have occurred (and if c had occurred, e would
  have occurred — but the second is usually true if both occur). He later added a
  chain condition to handle preemption: c causes e iff there is a chain of stepwise
  counterfactual dependence from c to e.


  Interventionist theory (Woodward 2003): C causes E iff there is a possible intervention
  on C (with respect to E) that changes the value of E (or changes the probability
  distribution of E). More precisely: X is a direct cause of Y relative to variable
  set V iff there is an intervention on X that changes Y while all other variables
  in V are held fixed at some value. For actual causation, Woodward says "actual cause"
  claims are context-dependent, and he gives an account involving interventions along
  a route. Also Halpern & Pearl''s actual causation in causal models is related but
  distinct.


