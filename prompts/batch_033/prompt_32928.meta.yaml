  \ forgetting, new evidence, etc.).\n\nActually, let me think about which combination\
  \ yields the most interesting, non-obvious prompt that can't just be regurgitated.\n\
  \nThe paradox of deontology with Type B (verdict prediction) seems very promising.\
  \ The paradox of deontology is specifically about whether deontological constraints\
  \ are self-defeating. You can set up a series of case verdicts that reveal someone's\
  \ stance on the paradox, and then ask about a new case that tests the boundaries.\n\
  \nLet me sketch this out:\n\nThe paradox of deontology: If there's a constraint\
  \ against, say, killing, then you shouldn't kill one person even to prevent five\
  \ killings. But then the constraint seems to permit more violations of itself. This\
  \ is paradoxical only if the constraint is justified by the badness of its violation.\
  \ If the constraint is justified by something else (e.g., the intrinsic wrongness\
  \ of the act), the paradox may dissolve.\n\nSo I could set up someone's verdicts\
  \ on various cases that test their views on:\n- Whether constraints are agent-relative\n\
  - Whether constraints are threshold-sensitive\n- Whether the justification for constraints\
  \ matters for the paradox\n\nCases:\n1. Standard trolley: push one to save five\
  \ → they say no\n2. Push one to save five from being pushed by someone else → they\
  \ say no\n3. Push one murderer to save five innocents about to be murdered → they\
  \ say yes (threshold case)\n4. Kill one to prevent a nuclear bomb that would kill\
