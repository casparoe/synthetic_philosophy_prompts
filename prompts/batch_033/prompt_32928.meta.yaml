  \nFor \"David Lewis's views on penal substitution\" with Type B: Lewis, a prominent\
  \ philosopher, wrote about penal substitution in Christian theology. Could have\
  \ verdicts on different theological cases.\n\nLet me think about which combination\
  \ works best.\n\nThe paradox of deontology with Type B seems very natural. The paradox\
