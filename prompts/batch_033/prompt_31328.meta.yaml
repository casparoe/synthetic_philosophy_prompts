  argued in the Letter to the Grand Duchess Christina (1615) that scripture and nature
  cannot ultimately conflict because both proceed from the same divine source; that
  scripture frequently speaks in a manner accommodated to the understanding of ordinary
  people; and that where a literal reading of a biblical passage conflicts with demonstrated
  physical truth, the literal reading should be reinterpreted rather than the physical
  conclusion abandoned. Read the play through this lens. Where does Brecht''s Galileo
  actually instantiate the accommodationist position, and where does Brecht flatten
  or secularize the dispute into a clash between free inquiry and institutional authority,
  losing the scriptural-epistemological dimension that the historical Galileo made
  central? Does the play''s treatment of recantation and the hero''s responsibility
  for the truth illuminate, or obscure, the Letter''s claim that the same divine Word
  underwrites both the book of nature and the book of scripture? I am less interested
