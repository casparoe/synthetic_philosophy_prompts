  "I am a retired natural scientist—most of my working life was spent in the laboratory
  rather than the library—and I have recently begun to read philosophy in earnest.
  I am putting together a small discussion group on Bertolt Brecht''s play Life of
  Galileo, and I would like to use the play to examine something that has come to
  interest me more than the familiar story of science versus the Church: Galileo''s
  own views about scripture. The historical Galileo, in the Letter to the Grand Duchess
  Christina of 1615, argues that scripture and nature cannot ultimately conflict because
  both proceed from the same divine source; that biblical language is often accommodated
  to the understanding of ordinary people; and that when a literal reading of a passage
  clashes with a demonstrated physical result, it is the literal reading, not the
  physical conclusion, that should be revised. Brecht''s Galileo, by contrast, is
  a figure who fights ecclesiastical authority, recants under threat of torture, and
  then continues his work in confinement; the play seems to treat the conflict as
  one between free inquiry and institutional power, and it has relatively little to
  say, on its surface, about how scripture ought to be read. I want a careful reading
  of the play through the lens of the Letter. Where does Brecht''s Galileo actually
  enact or voice the accommodationist position, and where does Brecht flatten the
  dispute into a political clash and lose the scriptural-epistemological dimension?
  Do the recantation scene and the final scenes with the Discorsi illuminate the Letter''s
  claim that the same divine Word underwrites both the book of nature and the book
  of scripture, or do they point in a different direction? I am not asking for a verdict
  on who was right about Copernicanism; I want to know whether a twentieth-century
  drama can do justice to a seventeenth-century account of the relation between natural
  knowledge and revelation. I would like a reading that is faithful to both the play
  and the Letter, that points to particular scenes, and that is willing to say plainly
  where Brecht''s Galileo is not Galileo."


