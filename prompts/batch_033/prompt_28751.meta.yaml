  or you''ll be sleep-deprived and update irrationally. You now know that at t2 you''ll
  have credence 0.9 in A, but you now think A is 0.5 and you know the shift will be
  due to bias, not evidence. Reflection says conditional on P_{t2}(A)=0.9, set P_{t1}(A)=0.9.
  But you know the process is unreliable; intuitively you shouldn''t defer. This is
  the standard counterexample (Christensen 1991 "Clever Bookies and Coherent Beliefs"?
