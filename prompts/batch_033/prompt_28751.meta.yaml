  Van Fraassen''s Reflection Principle: For any proposition A, any times t1 < t2,
  and any probability value r, P_{t1}(A | P_{t2}(A)=r) = r. It says your current opinion
  about A, conditional on your future opinion being r, should equal r. Motivation:
  if you expect to follow some update procedure, you should endorse its outputs in
  advance. Van Fraassen argued violations make you vulnerable to a diachronic Dutch
  book.


  Conditionalization: P_{t2}(A)=P_{t1}(A | E) where E is the total evidence acquired
  between t1 and t2.


  Tension cases:

