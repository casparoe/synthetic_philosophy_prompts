  Self-deception paradox: How can one deceive oneself? Deception requires getting
  someone to believe something the deceiver knows to be false. If self-deception requires
  the same person to be deceiver and deceived, then the person would have to simultaneously
  know p and believe not-p. Various accounts: intentionalist (person intentionally
  gets themselves to believe not-p, via biased evidence search), non-intentionalist
  (motivated bias without intention), deflationary (self-deception as motivated false
  belief without the "other-deception" structure), and partitionist (mind divided
  into subsystems; one subsystem deceives another). The thought experiment prompt
  could ask to construct an ordinary-life case where self-deception satisfies the
  intentionalist strict conditions without invoking partitions/homunculi. That''s
  a good design challenge.


