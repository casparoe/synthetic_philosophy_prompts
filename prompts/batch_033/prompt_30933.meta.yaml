  Let me recall the relevant theory precisely.


  Arrow''s impossibility theorem: For three or more alternatives, no social welfare
  function (aggregating individual preferences into a social ranking) satisfies:

  - Unrestricted domain (U): any individual preferences allowed

  - Pareto efficiency (P): if everyone prefers x to y, society prefers x to y

  - Independence of irrelevant alternatives (IIA): social preference between x and
  y depends only on individual preferences between x and y

  - Non-dictatorship (D): no single individual''s preferences always determine the
  social preference

  Then impossible.


  Gibbard–Satterthwaite theorem: For three or more alternatives, any social choice
  function (choosing a single winner based on voters'' reported strict rankings) that
  is:

  - strategy-proof (truthful reporting is a dominant strategy)

  - onto (every alternative can win under some profile)

  - nondictatorial

  is impossible. Equivalently, any strategy-proof SCF on 3+ alternatives with unrestricted
  domain is dictatorial (if onto). So every non-dictatorial voting rule with 3+ candidates
  is manipulable.


  Important nuances:

  - The theorem assumes strict preferences/rankings, ordinal, deterministic.

  - It doesn''t apply to two alternatives (majority rule is strategy-proof).

  - It doesn''t apply if domain is restricted (e.g., single-peaked preferences: median
  voter rules are strategy-proof and non-dictatorial).

