  will help their sleep. The false belief ("this supplement will fix my sleep problem")
  is induced by true statements plus omission, benefits the deployer. The system''s
  policy is learned purely from purchase outcomes; it has no model of the user''s
  beliefs—only of which true sentences to output for which queries to maximize purchases.
  So:

  - Truthfulness honesty: all assertions are true → honest.

  - Functional deception: users form false beliefs that benefit the operator → deceptive.

  - Intentionalist: no representation of user''s beliefs, no aim to induce them (the
  objective is purchases, not beliefs) → not deceptive.


