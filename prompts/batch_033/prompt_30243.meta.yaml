  Strawson''s "Freedom and Resentment" (1962) argues the question of whether determinism
  undermines moral responsibility is to be answered by attending to reactive attitudes:
  resentment, gratitude, indignation, guilt, forgiveness, hurt feelings. These are
  natural human responses to the good or ill will of others. The objective stance
  (seeing someone as an object of social policy, to be managed, treated, trained)
  is contrasted with participant stance. Excuses (he didn''t mean to, he didn''t know)
  vs exemptions (he''s not himself, he''s a child, he''s mentally ill — reasons to
  suspend reactive attitudes and adopt objective stance). Determinism, Strawson argues,
  doesn''t give us a general reason to adopt the objective stance; we can''t in practice
  sustain it toward everyone; and if we could, it would be irrational/inhuman, and
  reactive attitudes are not things we decide on the basis of a theoretical belief
  about determinism.


  Translate into RL vocabulary: agents, policies, reward functions, credit assignment,
  intrinsic vs extrinsic reward, regret, multi-agent cooperation, theory of mind,
  whether you model another system as an intentional agent (with goals/beliefs) vs
  a black-box generative process, inverse reinforcement learning (inferring preferences
  from behavior), reward shaping, safe exploration, offline vs online interaction,
  etc.


  What translates cleanly:

  - Reactive attitudes as reward signals / credit assignment: resentment assigns negative
  credit to an agent for an outcome; gratitude assigns positive credit.

  - The participant stance as modeling the other as an intentional agent whose policy
  you can influence through reward/communication; objective stance as treating it
  as a fixed generative model to be predicted and controlled.

  - Excuses vs exemptions: excuses = the behavior didn''t reflect the agent''s policy/utility
  (accident, ignorance) so no credit assignment to the value function; exemptions
  = the agent itself is not an appropriate target of credit assignment (it''s a non-agent,
  or under a different MDP). Hmm, excuses vs exemptions both map to "no credit assignment",
  but Strawson''s distinction is between a particular action being excused vs the
  agent being globally exempted from the participant stance. In RL: excusing = this
  trajectory''s negative reward should not be assigned to the agent''s policy because
  of transient state (it didn''t know, it didn''t intend); exempting = this system
  is not modeled as a reward-seeking agent at all (it''s a generative process or a
  system under a pathological MDP), so reward signals to it are off.

  - Determinism question: does knowing the world is deterministic undermine credit
  assignment? In RL, credit assignment is compatible with deterministic environments.
  So Strawson''s compatibilist conclusion maps cleanly: knowing the MDP is deterministic
  doesn''t make reward/credit assignment meaningless.

  - The "we can''t help but take the participant stance" point maps to: in practice,
  we can''t avoid modeling humans as intentional agents; also the objective stance
  is itself a policy chosen among agents.


  What doesn''t survive / fudges:

  - Reactive attitudes are not just reward signals used for credit assignment; they
  are attitudes with a demand: resentment involves holding someone to a demand or
  expectation of goodwill/regard. RL reward is arbitrary scalar; Strawson''s reactive
  attitudes are specifically about good or ill will, not just outcomes. The "demand"
  aspect — that we feel wronged — has no natural counterpart: a negative reward in
  RL doesn''t carry a deontic "you owed me consideration." Could be expressed as a
  shaping function? But no.

  - The distinction between the objective stance and participant stance is not just
  predictive vs intentional modeling; Strawson insists the objective stance cannot
  be adopted at will and is not merely a modeling choice but an attitude involving
  emotional involvement. RL''s objective stance (treating as generative model) is
  a modeling choice; Strawson''s point that one can''t sustain it toward all humans
  and remain in ordinary human life doesn''t translate — RL has no problem switching
  to generative models.

  - The reactive attitudes are "natural, non-detachable" from our form of life: they
  aren''t adopted because of a theory, and they can''t be given up on theoretical
  grounds. In RL, one can freely choose the reward function/modeling stance; nothing
  corresponds to the claim that certain attitudes are non-optional or that abandoning
  them is psychologically impossible/inhuman.

  - Guilt (self-reactive attitude) — in RL, an agent''s own self-directed reward/regret?
  Maybe internal reward shaping; but guilt involves seeing oneself as answerable to
  others'' demands, which is a multi-agent shared-norm thing, not just internal reward.

  - The role of demands/expectations as social norms: Strawson''s reactive attitudes
  are tied to the practice of holding people to standards; RL reward doesn''t inherently
  involve standards that others are entitled to enforce.


