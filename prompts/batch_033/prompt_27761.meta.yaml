  Here''s the exam question:


  "Some critics argue that utilitarianism is undermined by the problem of interpersonal
  utility comparisons — that we cannot meaningfully compare one person''s happiness
  or preference-satisfaction with another''s. Explain this objection and evaluate
  whether it is fatal to utilitarian moral theory. Your answer should engage with
  at least two attempts to respond to the objection."


