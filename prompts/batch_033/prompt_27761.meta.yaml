  distinct issues or making an argument that doesn''t actually follow, I want to catch
  that. And if the whole framing of the question is somehow confused or the answer
  can''t really be assessed as written, tell me that too — I''d rather hear that than
  get a polite but misleading grade.


  [Student Answer]


  The problem of interpersonal utility comparisons goes back to Lionel Robbins, who
  argued in the 1930s that we cannot compare the satisfactions of different people
  because utility is a subjective mental state. Since we can''t get inside other people''s
  heads, any claim that one person gains more utility than another loses is scientifically
  meaningless. This is a serious challenge for utilitarianism because utilitarianism
  requires us to sum utilities across persons to determine which action maximizes
  total welfare.


  One response to this problem comes from John Harsanyi. Harsanyi argued that if we
  imagine ourselves behind a veil of ignorance — not knowing which person in society
  we will be — and we assume each position is equally likely, then rational choice
  under uncertainty leads us to maximize average utility. This is essentially the
  same move Rawls makes in A Theory of Justice, except Harsanyi gets a utilitarian
  result rather than a maximin one. By using expected utility theory, Harsanyi shows
  that interpersonal comparisons are possible because we can imagine what it would
  be like to be someone else and compare their preferences to our own.


  A second response comes from Amartya Sen, who argues that we should abandon utility
  altogether and focus on capabilities — what people are actually able to do and be.
  Since capabilities like being well-nourished or being able to read are objectively
  observable, we can make interpersonal comparisons without needing to compare subjective
  mental states. This completely sidesteps the problem.


  In my view, both responses are successful, and the interpersonal comparisons objection
  is not fatal to utilitarianism. Harsanyi shows that we can make comparisons through
  an impartial spectator framework, and Sen shows that we can avoid the problem entirely
  by switching to a different metric of well-being. The real challenge for utilitarianism
  is not interpersonal comparisons but rather issues like demandingness and the separateness
  of persons.


