  Pons announced at a University of Utah press conference that they had achieved sustained
  nuclear fusion at room temperature in a palladium–heavy-water electrolysis cell,
  reporting anomalous excess heat and a small neutron signal. The announcement preceded
  peer review, and within months most serious replication attempts reported null or
  negative results, while the claimants and a few laboratories continued to defend
  the effect. The scientific community was therefore never in a position to conditionalize
  on a clean, certain observation such as ''the claimed effect was observed''; it
  had to respond to a shifting, partly testimonial, partly instrumental body of evidence.


  Your task is to analyze this episode through the lens of Jeffrey conditionalization.
  Be disciplined about the mapping. Specify, for a representative scientist in the
  spring of 1989, what the relevant propositions are, what the uncertain evidence
  (the input) amounts to, what the partition over evidence states should be, and what
  Jeffrey''s rule would prescribe: how the scientist''s credence in the cold fusion
  hypothesis should change as a function of the new probability assigned to the evidence,
  with the conditional probabilities held fixed. Contrast this with standard Bayesian
  conditionalization on the proposition that the Utah results were genuine, and explain
  why the standard treatment is inadequate here.


  Then run the analysis in the other direction. Identify the features of the episode
  that Jeffrey conditionalization captures well — for example, the way the community
  could lower its credence in the hypothesis without ever ''learning'' a single falsifying
  observation — and the features it captures poorly or silently. Pay particular attention
  to (i) the partition problem: what counts as the evidence proposition when the report
  itself bundles claims about calorimetry, nuclear products, and the honesty and competence
  of the claimants; (ii) the rigidity assumption: whether the conditional probabilities
  that Jeffrey''s rule requires to stay fixed were in fact stable over the course
  of the replication controversy; and (iii) the social epistemology of the episode:
  the role of press conferences, prestige, failed replications by other labs, and
  the way the input probabilities themselves are formed and revised. Say plainly where
