  of experience implies consciousness; so "I experienced X while sound asleep" is
  contradictory — like "I slept soundly and was awake."


  Dennett''s "Are Dreams Experiences?":

  1. He frames the question as: does the received view (dreams are experiences during
  sleep) survive scrutiny? He proposes the cassette theory: dreams are memory-loading
  at awakening — the subject wakes and a "memory" of a dream is inserted, with no
  experience during sleep.

  2. He argues the cassette theory is empirically equivalent to the received view
  with respect to waking reports: the subject''s reports and dispositions are the
  same either way. So introspection and memory cannot settle it.

  3. He considers evidence that could discriminate: REM experiments (Dement & Kleitman)
  showed a correlation between reported dream duration and REM duration, and between
  dream content (e.g., looking left/right) and eye movements. This suggests the dream
  is generated in real time during REM, not all at once at waking. But Dennett notes
  the cassette theory could be modified: the cassette could be "played" during REM
  (a "presentation" during sleep), and then the question becomes whether playing it
  constitutes an experience. The crucial issue: is there a "show" during sleep, or
  just a memory dump at waking?

