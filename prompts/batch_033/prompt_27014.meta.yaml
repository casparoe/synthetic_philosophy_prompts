  Norman Malcolm, "Dreaming" (1959): argues that the concept of dreaming is not the
  concept of an experience occurring during sleep. His key claim: "If a person is
  in any state of consciousness, it logically follows that he is not sound asleep."
  Therefore the notion of a conscious experience during sleep is contradictory. He
  argues that reports of dreams are not based on introspective memory of experiences
  during sleep but are a criterion for having dreamed; the telling of the dream is
  part of the concept of dreaming, not evidence for an inner occurrence. His argument
  is conceptual/grammatical, grounded in verificationism and ordinary language philosophy:
  since there is no way to verify that a sleeping person is having experiences (they
  can''t report at the time, and later reports are the dream), the idea of a private
  experience during sleep is senseless.


  Dennett, "Are Dreams Experiences?" (1976): critiques Malcolm. Dennett distinguishes
  the "received view" (dreams are experiences we have during sleep, a stream of consciousness)
  and considers an alternative: the "cassette theory" — dreams are memory cassettes
  loaded at awakening (or prepared and inserted into memory at the moment of waking),
  such that there is no experience during sleep itself. He argues that the received
  view rests on an unsupported inference: from the fact that we seem to remember a
  temporally extended experience, we infer there was a temporally extended experience
  during sleep. He uses the example of a "precognitive" or "undreamed dream" and the
  idea that if the memory tape is inserted at waking, everything about the subject''s
  reports is the same. He then gives reasons to take the cassette theory seriously
  (e.g., dreams'' temporal compression, the inability to count or judge time in dreams,
  the REM/eye-movement correlation with dream content suggests real-time unfolding
  though). Actually Dennett presents the cassette theory as a rival hypothesis that
  is hard to rule out, and examines evidence (like the REM experiments where dream
  events correlate in real time with eye movements and physiological measures) that
  tells against the cassette theory but doesn''t decisively refute it. His conclusion:
  the question "are dreams experiences?" is an empirical question and the received
  view is not forced by the concept; it''s a theoretical claim about what happens
  during sleep.


  So there''s an interesting nuance: Malcolm says the question is conceptual and the
  answer is "no" (or that it''s nonsense to say dreams are experiences); Dennett says
  the question is empirical, and the answer might be "yes" (received view) or "no"
  (cassette theory), and the evidence is mixed. Both challenge the naive "received
