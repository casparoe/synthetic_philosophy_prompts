  Domain: manipulation vs legitimate persuasion. The conceptual issues: the difference
  between rational persuasion and manipulation isn''t just about lying or coercion;
  manipulation often works through non-rational means, exploiting cognitive biases,
  emotional pressure, framing effects, information control, flattery, guilt, inducing
  false beliefs or emotions, undermining autonomy. Theories: manipulation as influence
  that bypasses or subverts the target''s rational capacities; as influence that''s
  hard to resist or hidden; as treating someone as a means; as involving an intention
  to get someone to do something without adequate reasons; as a matter of the influencer''s
  motives; or as a matter of the means being ones the target would reject. There''s
  also the question of whether manipulation requires deception, whether it requires
  the target''s consent to being influenced, whether appeals to emotion are manipulative
  per se, and the role of vulnerability and power asymmetry. The hard cases: a doctor
  framing options to encourage a healthier choice; a charity using a photo of a suffering
  child; A/B testing button colors; scarcity messages ("only 2 left"); social proof;
  reciprocity norms; defaults in organ donation; a manager using flattery to get someone
  to take a task. Legitimate persuasion: giving reasons, transparent aims, respecting
  the person''s capacity to assess.


