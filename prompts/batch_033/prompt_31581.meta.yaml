  ---


  I am a retired natural scientist who now runs a philosophy reading group, and we
  have been working through the debate about what exactly egalitarians should equalize
  when they say a distribution is unjust—welfare, resources, capabilities, or something
  else. I want to give the group a sorting quiz of the kind one finds in magazines,
  but built to do real philosophical work. Please write it for me.


  The quiz should be titled something like Which currency of egalitarian justice do
  you actually hold? It should have eight to ten questions. Each question should present
  a short concrete case (expensive tastes, disability, adaptive preferences, unequal
  talents, voluntarily chosen work, differences in how efficiently people convert
  income into doings and beings, and so on) with two or three answer options. The
  options must be phrased so that a reader can answer from their reactions to the
  case without already knowing the names of the positions. No question may simply
  ask which label the reader prefers.


  The scoring key should sort respondents into at least these positions: subjective
  welfare egalitarianism, an objective-list or capabilities-flavored view if you can
  distinguish it, Dworkinian equality of resources, Arneson''s equal opportunity for
  welfare, and Cohen''s equal access to advantage. Include a residual leaf for something
  like a sufficientarian or threshold view if the questions naturally produce one,
  and mark any leaf as unnamed if nobody in the literature defends exactly that combination.


  I especially want the instrument built from the logical space, not from a list of
  names. That means: first identify the axes on which the positions genuinely come
  apart—for example, whether the metric is a mental state, a bundle of transferable
  resources, or a set of real opportunities; whether compensation is owed for expensive
  tastes and, if so, only when they were not chosen; whether adaptive preferences
  reduce the injustice of a deprivation; whether the view is ex post or ex ante. Then
  write questions that vary one axis at a time. In the scoring key, locate each position
  in that space, and explicitly flag any pairs of positions your questions cannot
  separate, and any combinations of answers that correspond to no defended position,
  with a one-sentence diagnosis of why (incoherent, unattractive, or simply unexplored).


  Because I will use this with scientists who are new to philosophy, the cases should
  be vivid and concrete, and the instructions to the respondent should be short. But
  the scoring key should be rigorous enough that a professional philosopher could
  complain about it productively.


