  Actual state of CSR (from my knowledge):


  Consensus-ish:

  - Religion is not a single natural kind; it''s a fuzzy cultural category.

  - Religious beliefs and practices are found in all societies and are cognitively
  "natural" in the sense of being easy to acquire, intuitively compelling, and culturally
  transmissible, given ordinary cognitive dispositions (Boyer, Atran, Barrett, McCauley).

  - Two broad families of explanation: (a) byproduct/standard model — religion is
  a byproduct of evolved cognitive mechanisms that evolved for other functions; (b)
  adaptationist/cultural group selection — religious beliefs and practices were selected
  (genetically or culturally) for their prosocial, cohesive effects.

  - Specific mechanisms proposed: hypersensitive agency detection (HADD; Guthrie,
  Barrett), theory of mind / full-access strategic agents (Boyer), minimally counterintuitive
  concepts (Boyer; Atran), ritual and costly signaling (Sosis), credibility-enhancing
  displays (Henrich), Big Gods and prosocial religions (Norenzayan).

  - Byproduct view does NOT imply religion has no function; exaptation/spandrel (Gould
  & Lewontin) — spandrels can be co-opted for new functions.

  - The empirical evidence for MCI memory advantages has been mixed; meta-analyses/replications
  have tempered early claims. So "MCI concepts are more memorable" is contested, not
  settled.

  - HADD is itself contested: some argue agency detection is not clearly "hypersensitive"
  in a way that explains gods; the link from detecting agents in ambiguous stimuli
  to belief in gods involves many further steps (theory of mind, cultural input).

  - There''s a distinction between "religious concepts are widespread because of cognitive
  biases" and "religion is an adaptation"; also between "religion has no evolved function"
  and "religion does nothing."


