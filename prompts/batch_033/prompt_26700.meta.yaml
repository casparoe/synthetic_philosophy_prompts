  Lewis (1976): Assume the probability of a conditional equals the conditional probability:
  P(A→C) = P(C|A) for all propositions A, C with P(A)>0, where → is a propositional
  connective (a conditional expressing a proposition with truth conditions). Then,
  assuming the standard probability calculus, it follows that P(C|A) = P(C) whenever
  P(A), P(C) both positive, i.e., A and C are probabilistically independent — which
  trivializes the conditional. The proof uses the law of total probability / expansion
  by cases: P(A→C) = P(A→C|C)P(C) + P(A→C|¬C)P(¬C). Then under the thesis and conditionalization,
  P(A→C|C) = P(C|A∧C) = 1, and P(A→C|¬C) = P(C|A∧¬C) = 0. So P(A→C) = P(C)·1 + P(¬C)·0
  = P(C). Combined with P(A→C) = P(C|A), gives P(C|A)=P(C). Indeed. The assumption
  needed: the conditional expresses a proposition (so it can be conditioned on and
  appears in the algebra), and Adams'' Thesis holds across all probability functions
  (and conditionals can be embedded under conditioning). The result generalizes: any
  connective that satisfies the Equation for all probability functions must be trivial.


