  be" is necessary. Alternatively, some read him as retaining bivalence but denying
  the necessity of the present truth about the future. The debate continues with Ockham
  (God''s foreknowledge), Diodorus Cronus''s Master Argument, Łukasiewicz''s three-valued
  logic, Prior''s tense logic, etc.


