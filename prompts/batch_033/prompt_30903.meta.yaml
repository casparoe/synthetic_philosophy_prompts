  Let me flesh out insect sentience scale argument.


  The scale argument: Even if the probability that an individual insect is sentient
  is low (say 0.1% or 1%), the number of insects is so vast (estimated 10^18 to 10^19)
  that the expected number of sentient insects is enormous, dwarfing humans and maybe
  farmed vertebrates. Therefore, if we give any credence to insect sentience, expected-value
  reasoning suggests insect welfare should dominate. This is used to argue for taking
  insect welfare seriously (e.g., not dismissing it just because the probability per
  individual is low).


  Objections/things a proponent must deal with:

  - Expected value over uncertain moral status is controversial: if sentience has
  a "threshold" nature, perhaps we can''t just multiply by probability. Or the "fanaticism"
  worry: tiny probabilities of vast numbers lead to absurd conclusions (Pascal''s
  mugging).

  - The scale argument "proves too much": if we accept it, then wild animal suffering
  among insects dominates, and interventions (like reducing insect populations) could
  be required; or it would dominate other causes. Is the argument self-defeating?

  - Uncertainty about what insect sentience would even mean: valence, capacity for
  suffering vs. simple nociception.

  - If the probability is really tiny (e.g., 10^-12), the expected number might be
  small. The argument depends on the probability not being arbitrarily low, and we
  have no solid basis for the probability estimate.

  - Maybe sentience is not a binary property; if it comes in degrees, the scale argument
  needs to multiply by degree, which might be very low.

  - The "scale argument" might apply to plants or even matter, so it could be a reductio.


