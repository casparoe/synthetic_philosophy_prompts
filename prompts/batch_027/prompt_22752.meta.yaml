  Actually, let me recall the exact statement.


  Harsanyi''s theorem (1955, "Cardinal Welfare and Generalized Consensus Criteria"):
  Suppose each individual i has a utility function u_i: A → R (cardinal, expected-utility
  type). A social welfare function W: A → R satisfies:

  1. Non-saturation (weak Pareto): if all individuals weakly prefer A to B and at
  least one strictly prefers A, then W(A) > W(B).

  2. Independence of irrelevant alternatives (IIA): W''s comparison of A and B depends
  only on the individuals'' preferences between A and B.

  3. Linearity / expected utility over lotteries: W over a lottery is the expected
  value of W over its outcomes (or W is linear in the probabilities).

  Then W(A) = Σ_i α_i u_i(A) for some weights α_i ≥ 0, not all zero.


  The "no-dictatorship" conclusion: the weights can be positive for everyone, or only
  some can be positive. Harsanyi''s argument that all weights are positive uses "strong
  Pareto": if everyone strictly prefers A to B, then W(A) > W(B). If only weak Pareto
  is assumed, then a weighted sum with a single positive weight (a dictator) satisfies
  weak Pareto and IIA and linearity. So the strong Pareto condition is what rules
  out dictators. This is a genuinely weeds-level point, and it''s something a model
  might fumble.


