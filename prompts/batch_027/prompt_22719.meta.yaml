  Black''s argument (1950, "The Identity of Indiscernibles," Australasian Journal
  of Philosophy): he considers two perfect spheres, a and b, identical in all intrinsic
  properties, in otherwise empty space except for a boulder. a is closer to the boulder
  than b is. If the identity of indiscernibles is stated to cover all properties (including
  relational), then a and b differ in relational properties (distance to the boulder),
  so the principle is trivially satisfied — but that''s not the interesting reading.
  The interesting reading is that a and b are indiscernible in all *intrinsic* properties
  but are still two things. Black''s conclusion: the identity of indiscernibles (in
  its non-trivial form) is false, or at least that indiscernibility in intrinsic properties
  does not entail identity. Actually, Black''s conclusion is more nuanced: he argues
  that the principle is not a necessary truth; the two spheres are distinct individuals
  even if they differ only in relational properties. So the principle "if x and y
  differ in no property, x=y" is trivial (since x≠y implies they differ in the property
  "being identical with x"), and the stronger principle "if x and y differ in no *intrinsic*
  property, x=y" is false (per Black''s example).


  So for the novelist: the key implications are (1) the two characters can be genuinely
  distinct even if intrinsically identical — the principle in its strong form is false;
  (2) but if they differ only in relational properties, then in a world where the
  boulder doesn''t exist (a perfectly empty world with just two spheres), they''d
  be indiscernible in all properties and the question of whether they''re one or two
  arises — this connects to the "spatial" vs. "non-spatial" debate and to the question
  of whether the principle holds as an a priori truth (the Leibnizian reading). Also
  (3) for what characters can know: if the two characters differ only in relations
  to a third object, then each can in principle distinguish them by going to the boulder;
  but in a perfectly symmetric world (no boulder), they couldn''t be distinguished
  from the inside — this touches on the "two spheres in empty space" problem and on
  whether there''s a fact of the matter about which is which (the "thisness" / haecceity
  question).


