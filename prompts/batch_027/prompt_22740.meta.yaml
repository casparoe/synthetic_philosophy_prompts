  puzzle, and I''d love some feedback. Here''s what I''ve got so far:


  The standard Fregean solution to the puzzle of identity statements is the sense/reference
  distinction. "Hesperus is Phosphorus" and "Hesperus is Hesperus" have the same reference
  (Venus) but different senses ("the morning star" vs. "the evening star"), so they
  have different cognitive value. This works fine for proper names, but I think it
  runs into trouble when we get to theoretical identities like "water is H2O."


  The problem is that the "sense" of a theoretical term like "water" isn''t a simple
  descriptive content the way "the morning star" is. Instead, it''s defined by the
  term''s place in a whole theoretical framework — its causal role, its chemical behavior,
  its relationship to other theoretical terms. So the "sense" of "water" is something
  like "the stuff that fills lakes and rivers, that we drink, that has the chemical
  formula H2O, that boils at 100°C, etc." — a complex web of theoretical commitments,
  not a simple description.


  This means that when we learn "water is H2O," we''re not just learning a new descriptive
  fact (like "the morning star is the evening star"). We''re learning something about
  the theoretical role of the term "water" — specifically, we''re learning that the
  stuff we call "water" is identical to the stuff that chemistry calls "H2O." This
  is a different kind of "value" than the cognitive value of "Hesperus is Phosphorus."


  So I''d argue that the Fregean solution doesn''t fully capture the cognitive value
  of theoretical identities. The puzzle for theoretical identities is a different
  kind of puzzle than the puzzle for proper names, and it needs a different solution.


