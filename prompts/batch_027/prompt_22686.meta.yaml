  In-the-weeds angles:

  1. The distinction between the "all affected" principle (everyone affected by a
  decision should have a say) and the "all sovereign" or "democratic self-determination"
  principle (the demos should be able to decide its own boundaries). These can conflict.

  2. The "foundational" vs. "operational" distinction: the foundational question (who
  is the demos?) can''t be settled democratically (because it''s what defines the
  demos), but the operational question (how do we handle specific boundary cases,
  like immigration?) can be.

  3. The "transnational" problem: global issues (climate change) affect people outside
  any single demos, so the "all affected" principle would require a "global demos,"
