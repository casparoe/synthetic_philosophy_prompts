  The Frege–Geach problem, as typically presented (following Black 1937, and later
  Geach 1960, and the name "Frege–Geach" from the fact that Frege also noticed a similar
  problem): Expressivists hold that the primary function of a moral sentence like
  "Stealing is wrong" is to express an attitude (e.g., disapproval of stealing), not
  to state a fact. The problem arises when such a sentence is embedded in a non-declarative
  context, e.g.:

  - "If stealing is wrong, then stealing is wrong if you do it" (a conditional, specifically
  a "practical inference" or a conditional that isn''t itself a straightforward expression
  of attitude)

  - "Stealing is wrong, or I am a donkey" (a disjunction)

  - "John believes that stealing is wrong" (an attitude report)

  - "It is not the case that stealing is wrong" (a negation — though expressivists
  can usually handle negation by expressing the opposite attitude)


  In these embedded contexts, the moral sentence doesn''t seem to be used in its primary,
  attitude-expressing function. For example, in "If stealing is wrong, then stealing
  is wrong if you do it," the whole sentence is not itself an expression of disapproval
  of stealing (it''s a kind of logical/ethical conditional). And yet the embedded
  "stealing is wrong" seems to contribute something to the meaning of the whole. If
  expressivists say the embedded moral sentence doesn''t express an attitude, then
  what does it contribute? This threatens the expressivist''s compositional semantics:
  they need to say how the meaning (attitude-expression) of the whole is built up
  from the parts, but the parts in embedded contexts don''t seem to have their normal
  meaning.


  The "just say it''s part of a bigger sentence" move doesn''t work because the expressivist
  still needs a compositional principle that determines the attitude expressed by
  the whole from the contributions of the parts, and if the parts'' contributions
  in embedded contexts are unclear, the compositionality fails.


