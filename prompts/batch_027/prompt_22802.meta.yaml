  The problem of the unity of the proposition: how is a proposition (e.g., "a is F")
  a unified whole rather than a mere collection of its constituents (the term ''a''
  and the term ''F'')? If a proposition is just a bundle of terms, what holds them
  together?


  Bradley''s Regress (the "regress of relations"): Suppose a proposition is a complex
  of terms related by a relation. E.g., "a is F" = the term a, the term F, and the
  relation "is F" (or the relation of inherence/being). But then, what holds the relation
  to the terms? If the relation is just another term in the complex, then the relation
  itself must be related to the terms, requiring a further relation, and so on ad
  infinitum. This is the regress.


  Bradley''s solution: the Absolute / the Absolute Monad. Bradley argues that the
  regress shows that the many cannot be related, and that reality must be an Absolute—a
  single, all-inclusive, non-relational whole (the Absolute). In his mature view (in
  "Appearance and Reality"), the world of many related things is "appearance" and
  the Absolute is the only reality. The Absolute is a single, all-inclusive experience,
  not composed of related parts. So the regress is used to argue for monism.


  Key details to get right (for the grader and for the subtle errors):

  - The regress is about relations: if R relates a and b, then the complex (a, R,
  b) must itself be unified, requiring a further relation R2 that relates a, R, and
  b, and so on.

  - One response: the "admission" or "the relation is not a further term" response.
  Some (e.g., Russell) argue that the regress is a pseudo-problem because relations
  are not "things" that need to be related; the unity of a proposition is primitive
  / not composed. Russell''s response: the unity of a proposition is not something
  that can be analyzed into further components; it is a brute fact. Russell (in "Analytic
  and Synthetic Judgments" and in "An Outline of Logic" and in "The Analysis of Mind")
  argues that the regress is fallacious because it assumes that the relation must
  itself be a term in the proposition, but the relation is what the proposition is
  about / the relation is not a constituent.

  - Another response: the "nexus" or "trope" theory. Or the "proposition as function"
  (Carnap / Frege) view: a proposition is a function from names to truth values, and
  the unity is built into the function''s structure, not a further relation.

  - Another: the "admission of a relation of combination" that is not itself a term—e.g.,
  the distinction between "relation as a term" and "relation as something that holds
  things together." The regress only arises if one assumes that all unifiers must
  themselves be relata.


