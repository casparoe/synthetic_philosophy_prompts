  Information cascade (Bikhchandani, Hirshleifer, Welch 1992): sequential decision-making
  (e.g., enter or not enter a restaurant). Each agent has a private signal of equal
  precision. Agents observe prior actions. At some point, the weight of prior actions
  outweighs the precision of any single private signal, so agents follow the crowd
  regardless of their own signal — the cascade is "rational" in the sense of Bayesian
  optimal given the public history, but it''s fragile: it''s based on possibly two
  agents'' signals, and the cascade can be wrong with high probability (e.g., the
  famous result that a cascade can form on the basis of just two actions, and the
  probability of the wrong choice converges to a positive value).


  Rational herding: in the economics literature (e.g., Scheinkman and Xiong 2003 "Overreaction
  and Underreaction in Asset Markets"), herding is when agents'' actions are more
  correlated than would be optimal; it can arise from payoff externalities (coordination),
  from the crowd having information, or from agents wanting to follow the crowd to
  avoid being the "contrarian" who''s wrong. Also "rational herding" in the sense
  of Gromov and others? There''s also the "herding" in the sense of Banerjee (1992)
  "A Simple Model of Herd Behavior" — that''s essentially an information cascade in
  the context of occupational choice. So the distinction: cascades are a specific
  mechanism (sequential, private signals ignored due to public history), while herding
  is a broader behavioral pattern (correlated actions that exceed what''s optimal)
  with multiple mechanisms (informational, payoff externalities, coordination, reputation).


  Key in-the-weeds points for the comparison:

  - Mechanism: cascade = Bayesian updating where public history dominates private
  signal; herding = any process that produces excessive correlation in actions.

  - Sequential vs. simultaneous: cascades require a sequential structure; herding
  can happen in simultaneous games (e.g., coordination games, or asset markets where
  everyone buys).

  - Informational vs. payoff-driven: cascades are purely informational; herding can
  be payoff-driven (e.g., the payoff of an action depends on how many others do it
  — network effects, or fear of being the contrarian).

  - Fragility/irreversibility: cascades are fragile — a single sufficiently strong
  signal (or a "pivotal" agent who breaks) can reverse them; herding driven by externalities
  can be self-reinforcing and stable.

  - Social welfare: cascades can lead to large-scale errors (the crowd converges on
  the wrong choice with non-negligible probability); herding can produce volatility
  (Scheinkman-Xiong: herding leads to overreaction to news and price volatility).

  - The "informational content" of the crowd: in a cascade, later actions carry zero
  new information (because they don''t depend on private signals); in non-cascade
  herding, actions can still carry private information.

  - Relation to "rationality": both are individually rational, but in cascades rationality
  is defined as Bayesian updating; in herding, individual rationality may be defined
  relative to payoff structure.


