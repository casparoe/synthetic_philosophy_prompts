  Let me think about the specific content of Fitch''s paradox:


  Fitch''s paradox (1963) argues that if all truths are knowable, then all truths
  are known. The argument:

  1. Assume all truths are knowable: for any proposition p, if p, then it''s possible
  that p is known (p → ◊Kp).

  2. Suppose p is a truth that is not known.

  3. Consider the proposition p ∧ ¬Kp (p is true but not known).

  4. This proposition, if true, is knowable by assumption: (p ∧ ¬Kp) → ◊K(p ∧ ¬Kp).

  5. But K(p ∧ ¬Kp) is impossible - it''s a contradiction (you can''t know that p
  and that p is not known).

  6. So ◊K(p ∧ ¬Kp) is false.

  7. Therefore, by modus tollens, p ∧ ¬Kp is false.

  8. Therefore, p is not true (or p is known).

  9. Since p was an arbitrary unknown truth, there are no unknown truths.


  So the paradox is: the seemingly innocuous principle "all truths are knowable" leads
  to the absurd conclusion "all truths are known."


  The responses to the paradox:

  1. Reject the principle "all truths are knowable" - so not all truths are knowable.
  (This is the "realist" response.)

  2. Reject the validity of the argument - usually by denying that K(p ∧ ¬Kp) is impossible,
  or by questioning the knowability principle''s application to "knowable-but-untrue"
  propositions.

  3. Distinguish between "knowable in principle" and "knowable by some particular
  knower."

  4. The "epistemic logic" response - the issue is with the modal logic used.

  5. Timothy Williamson''s response - the paradox shows that "all truths are knowable"
  is false, and he argues against knowability for certain truths (e.g., the "no unknown
  truths" principle).


