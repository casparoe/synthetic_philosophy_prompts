  Let me design the conceptual problem carefully. The core in-the-weeds issue in Pascal''s
  justice/force:


  Pascal distinguishes two "orders" (ordres): the order of force (l''ordre de la force)
  and the order of justice (l''ordre de la justice). He argues that in the actual
  world, the order of force is what "really" operates, because force is "indisputable"
  while justice is "subject to dispute." So the "right" (droit) that actually binds
  people is a right established by force and custom, not by true justice (droiture).
  This is the "right of the first" (droit du premier) argument: the first seizure
  of something is an act of force, and that first seizure establishes a "right" that
  everyone then recognizes — but the "right" is really just the "right of the strongest"
  (droit du plus fort) that has been "institutionalized" through custom and time.


  The in-the-weeds twist / conceptual problem: there''s a tension / ambiguity in Pascal.
  On one hand, he seems to say that the "right" we follow is really just force in
  disguise (a descriptive, almost cynical claim). On the other hand, he insists that
  there is a real standard of "droiture" (true rightness/justice) that this "right"
  fails to meet, and that the "great law" that "the just must be strong and the strong
  must be just" is a genuine demand that is never fulfilled. So the question is: is
  Pascal making a descriptive claim about the sociology of law (that law is in fact
  grounded in force), or a normative claim about how law ought to be (that force ought
  to be subordinated to justice), or is he doing both at once, and if so, how do the
  two fit together? And what is the status of the "great law" — is it an achievable
  ideal, a regulative ideal, or a description of a failure?


  This is genuinely in-the-weeds and requires real knowledge of the fragments. And
  it''s meaningful for a model that can''t search, because a model that knows Pascal
  can explain this tension.


