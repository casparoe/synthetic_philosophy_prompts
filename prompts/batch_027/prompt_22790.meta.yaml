  The standard "misrepresentation problem" for teleosemantics: how can a representation
  be false (a misrepresentation) if its function is to be true? If a representation''s
  function is to be true, then a false representation is a malfunction, not a functioning
  representation. Millikan''s solution: a representation is a misrepresentation if
  the mechanism that produced it is functioning normally (doing what it was selected
  to do) but the representation is false. The mechanism''s function is not "to be
  true" but "to track the relevant feature" — and the representation is false when
  the tracking fails (e.g., the feature is not present but the mechanism is triggered).


  The "detour case" is a specific challenge to this: a mechanism that was selected
  to track feature F (e.g., predators) via cue C (e.g., snake-shaped shadow). In a
  detour case, the mechanism is triggered by cue C'' (e.g., a sound) that is not F
  but is correlated with F. The mechanism is "functioning normally" in the sense that
  it''s doing what it was selected to do (respond to cues that indicate F), but the
  representation is false (F is not present). So is it a misrepresentation? Millikan
  would say yes. But the problem is: the mechanism was not selected to respond to
  C'' specifically, so it''s hard to say the mechanism is "functioning normally" in
  response to C''.


