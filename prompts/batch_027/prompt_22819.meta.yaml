  Frankfurt cases and the principle of alternative possibilities: This is a rich area.
  Frankfurt cases (Harry Frankfurt''s 1969 paper "Alternate Possibilities and Moral
  Responsibility") show that moral responsibility doesn''t require the ability to
  have done otherwise. The example: Jones decides to perform act A. Black wants Jones
  to do A. Black has a counterfactual intervener who would force Jones to do A if
  Jones showed signs of deciding otherwise, but Jones decides on his own, so Black
  never intervenes. Jones is still responsible even though he couldn''t have done
  otherwise (Black would have made him do it). This refutes the Principle of Alternative
  Possibilities (PAP): "A person is morally responsible for what he has done only
  if he could have done otherwise."


