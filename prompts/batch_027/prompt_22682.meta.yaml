  **Costly signaling and handicap principle + comparison type**: "Compare Zahavi''s
  handicap principle with the general idea of costly signaling in economics (Spence''s
  signaling model). In what ways is the handicap principle special / different from
  economic signaling?" This is actually a really good comparison and in-the-weeds.
  The handicap principle (Zahavi 1975) says that signals are reliable precisely because
  they are wasteful/handicapping — the cost ensures honesty. Spence''s model (1973)
  says that in markets, education is costly and thus signals ability. But there''s
  a deep difference: in Spence''s model, the signal is costly but not necessarily
  wasteful — it''s a cost that varies by type (cheap for high-ability types, expensive
  for low-ability types), and the equilibrium is a separating or pooling equilibrium.
  In the handicap principle, the signal is a genuine handicap that reduces the fitness
  of the signaler, and it''s honest because only high-quality individuals can afford
  it. The key difference: in Spence, the cost is type-dependent and the signal can
  be "efficient" in the sense that it conveys information; in Zahavi, the signal is
  wasteful and the wastefulness is the whole point — the signal is an honest indicator
  precisely because it''s a handicap. Also, there''s a debate about whether the handicap
  principle is actually supported: some argue that many signals are not wasteful and
  instead are "indexical" (their production cost is directly correlated with the trait
  being signaled). There''s also the concept of "costly signaling" in the broader
  sense. And there''s a question of whether the handicap principle is really about
  "honesty" or about "reliability." This is a good, in-the-weeds comparison that a
  layperson could pose.


