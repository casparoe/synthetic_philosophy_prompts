  The paradox of fiction: the paradox of fiction (or the paradox of fiction / the
  problem of paradoxes of fiction) is the set of puzzles about how we can have experiences
  (emotions, beliefs, knowledge, moral judgments) directed at things we know to be
  fictional. Classic puzzles: (1) how can we be afraid of a monster we know doesn''t
  exist (Kant''s objection, Collingwood), (2) how can we know things about Hamlet
  if we haven''t met him (knowledge of fiction), (3) how can we love Ophelia (quasi-emotions).
  Standard positions: Carroll''s (Nathan Carroll, "Aesthetics and Emotions" 1989)
  "quasi-emotions" (or "quasi-aesthetic emotions") — we don''t really feel fear, we
  feel quasi-fear; Kieran''s (Alex Neill) "pretendist" account; the "make-believe"
  account (Surrey, "The Aesthetics of Fiction" 1993) — we pretend to have emotions;
  the "imaginative resistance" account (Weisberg 2006); the "empathy" account (Lamarque);
  the "cognitive" account (Gendron? no...). Also, the "paradox of sorrow" for fiction
  (why do we feel sad for characters we know will die?). And the "paradox of fictional
  knowledge." Also, the "paradox of the paradox of fiction" — some argue there is
  no paradox at all (e.g., the "dissolution" view). In-the-weeds angle: the distinction
  between the "paradox of emotion" and the "paradox of knowledge," and the point that
  the knowledge paradox is actually trivial (we know that Hamlet is a character in
  the sense of knowing the novel''s content), while the emotional paradox is the hard
  one. Or the "imagination-first" vs. "emotion-first" ordering. Or the point that
  the paradox only arises if you assume that emotions require genuine belief (a "belief-dependence"
  assumption) — and that the paradox is dissolved once you reject belief-dependence.


