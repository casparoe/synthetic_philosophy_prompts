  The KSS solution: for a bargaining problem (S, d), where S is the feasible set and
  d is the disagreement point, the KSS solution is the unique point x in S such that
  (x − d) is proportional to (u* − d), where u* is the ideal point (maximizing each
  player''s utility). So it''s the point on the Pareto frontier closest to the ideal
  point in the sense of minimizing the maximum relative loss.


