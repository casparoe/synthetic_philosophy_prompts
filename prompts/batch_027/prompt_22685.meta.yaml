  The sharpest sub-questions in the logical omniscience literature:

  1. **The tension with the probability axioms**: If an agent''s credences are a probability
  function, then it must assign credence 1 to all logical truths (tautologies). But
  an agent can''t know all tautologies (there are infinitely many, and deciding whether
  a sentence is a tautology is undecidable in general / computationally infeasible).
  So either the agent''s credences aren''t a probability function, or the agent is
  not a probability function but something more nuanced. This is the "logical omniscience
  as a requirement of the probability axioms" problem.


  2. **The self-referential / "I don''t believe this is provable" problem**: An agent
  that believes it is an ideal reasoner (closed under known implication, believes
  all logical truths) runs into paradoxes when it reasons about its own beliefs. E.g.,
  the agent can''t consistently believe "I might be wrong about this" in certain self-referential
  cases. This is related to Field''s "no problems of rational self-doubt" and to the
  "agent that knows it knows everything" paradox.


  3. **The betting / decision-theoretic problem**: How should an agent bet on unproven
  but likely-true mathematical conjectures (e.g., "this 1000-digit number is prime"
  or "ZFC is consistent")? If the agent is logically omniscient, it either knows the
