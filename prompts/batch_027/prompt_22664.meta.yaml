  Let me think more about the panpsychism combination problem. The combination problem:
  how do micro-experiences (if they exist) combine to form the macro-experience of
  a unified subject? Sub-problems:

  1. The problem of unity/binding: how do many experiences become one experience (rather
  than many)?

  2. The problem of the nature of the combination: what kind of operation would combine
  experiences? Mere addition? If you add two experiences, do you get a sum that is
  itself an experience? Addition of experiences is not clearly defined.

  3. The problem of "downward" or qualitative: the resulting experience would have
  to be qualitatively different from its parts (emergent), which some see as a violation
  of panpsychist parsimony.

  4. The "many minds" objection: maybe there is no combination at all — there are
  just many micro-subjects, and the macro experience is an illusion (or the macro
  subject is a "society" of micro subjects, like a city made of people).

  5. The "no combination" response: maybe experiences don''t combine at all; consciousness
  is fundamental and the structure of experience mirrors the structure of the physical
  (the "structural" or "cosmopsychist" response).

  6. Chalmers''s "combination" problem; Strawson''s "realistic monism" response (there
  is only one experience — the experience of the universe); the "illusionism" response.


