  The responsibility gap: The idea (from Anderson & Anderson 2011, "Machine Ethics
  and the Responsibility Gap") is that as autonomous systems become more autonomous,
  the causal chain between the human decision-maker''s action and the harm becomes
  more attenuated, and it becomes harder to locate a responsible agent. This creates
  a "responsibility gap" — a gap between what we need (someone to hold responsible)
  and what we can do (no one is clearly responsible). The gap arises because:

  1. The system''s decisions are not fully determined by any single human choice (the
  "opacity" of the algorithm).

  2. The system may act in ways no one predicted.

  3. The causal contribution is distributed across many designers, programmers, testers,
  deployers, users.


  A concrete case for a memo: A city''s transportation authority or a hospital''s
  safety committee must decide whether to deploy an autonomous system (e.g., an autonomous
  surgical robot, an autonomous vehicle, an AI triage system), and must decide how
  to handle accountability for harms. The body must recommend a concrete course of
  action. The recommendation should engage with the responsibility gap — e.g., whether
  to require human oversight, whether to create a new category of responsibility,
  whether to use a "corporate" or "organizational" responsibility, whether to accept
  the gap and use a no-fault compensation scheme.


