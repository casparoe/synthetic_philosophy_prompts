  Memo:

  "The discursive dilemma arises when a committee''s agenda is logically structured
  — e.g., ''approve the project'' is true iff ''the project is cost-effective'' and
  ''the budget allows it'' — and the committee votes on each proposition separately
  by majority. If two of three members vote yes on the first two propositions and
  two of three vote no on the conclusion, the collective judgment set is logically
  inconsistent, even though every individual''s judgment set is consistent. This is
  not a paradox of logic but of aggregation: it is the interaction between proposition-level
  majority rule and a logically connected agenda. The literature distinguishes a conclusion-based
  procedure (vote on the conclusion first, or only on the complete options) from a
  premise-based procedure (vote on the premises and derive the conclusion). Each has
  a failure mode: premise-based aggregation can produce conclusions the committee
  would reject if asked directly, while conclusion-based aggregation is path-dependent
  and unstable — the same committee can give different answers depending on which
  questions are asked first.


