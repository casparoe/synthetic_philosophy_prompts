  that the dilemma is a feature of majority rule in particular: any rule that respects
  individual consistency and does not privilege one proposition over another will
  eventually reproduce the dilemma. Second, I suspect the dilemma is ultimately a
  problem of question design: if the tool only lets the committee choose between complete
  options (approve / reject) and treats the sub-claims as annotations rather than
  as voteable items, the dilemma disappears, and proposition-level voting is simply
  a bad interface for the reasons we want to record."


