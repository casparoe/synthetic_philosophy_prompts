  \ \n\nThe in-the-weeds point that's most interesting: the Fitch move. The proof\
  \ goes: assume the knowability principle (KBP): for all truths p, p → ◊Kp. Then\
  \ suppose there is a truth p such that ¬Kp (an unknown truth). Consider the proposition\
  \ p ∧ ¬Kp. By KBP, ◊K(p ∧ ¬Kp). But if K(p ∧ ¬Kp), then by the fact that knowledge\
  \ is factive and closed under conjunction and knows what one knows, we'd have Kp\
  \ and K¬Kp, and K¬Kp entails ¬Kp (by factivity), contradiction. So ◊K(p ∧ ¬Kp) is\
  \ false, i.e., ¬◊K(p ∧ ¬Kp). But KBP applied to (p ∧ ¬Kp) gives (p ∧ ¬Kp) → ◊K(p\
  \ ∧ ¬Kp). Since we're assuming (p ∧ ¬Kp) is true, we get ◊K(p ∧ ¬Kp), contradiction.\
  \ So our supposition (there's a truth p with ¬Kp) is false; hence all truths are\
  \ known (Kp for all p). That's the paradox: the knowability principle entails omniscience.\n\
  \nThe \"Fitch move\" is the step from ◊K(p ∧ ¬Kp) being possible to deriving a contradiction.\
  \ Actually the Fitch move is usually described as: the principle p → ◊Kp, when p\
  \ is a \"negative\" truth (something of the form ¬Kq), gives ◊K(¬Kq) which is impossible.\
  \ So the Fitch move is the observation that the knowability principle, applied to\
  \ the proposition \"p and p is not known,\" yields a contradiction.\n\nThe really\
  \ in-the-weeds and interesting points:\n- The paradox is often presented as showing\
  \ that the knowability principle is false. But one response is to deny the \"Fitch\
  \ move\" — i.e., to deny that the knowability principle applies to propositions\
  \ of the form ¬Kq (the \"unproblematic truths\" restriction). This is the \"restriction\"\
  \ strategy.\n- Another subtle point: does the knowability principle need to be *known*\
  \ for the proof to work? Some formulations require the KBP to be known (K(KBP))\
  \ or at least that the agent can know it. This is the \"knowledge of the principle\"\
  \ issue.\n- The distinction between \"in principle knowable\" (◊Kp, where ◊ is metaphysical\
