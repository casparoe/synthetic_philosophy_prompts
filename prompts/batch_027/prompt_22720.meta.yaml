  - The "heap" analogy (yavakrama) — a chariot is not a separate entity from its parts,
  but neither is it *identical* to its parts.

  - The difference between anatta and "bundle theory" (Hume, Locke) — is anatta just
  bundle theory?

  - The "reductionism" vs. "non-reductionism" debate in personal identity — anatta
  is a form of reductionism.

  - A subtle in-the-weeds point: the Buddhist concept of "dependent origination" (pratityasamutpada)
  is closely related to anatta — the self is not a separate entity but a process of
  dependent origination.

  - The "no-self" problem in the context of *rebirth* — if there is no self, what
  is reborn? The Buddhist answer is that there is a *continuity* without a *self*
  — like a flame passing from one candle to another.

  - The "personal identity" problem in the context of *meditation* — the experience
  of "no-self" in meditation is not the same as the philosophical claim of anatta.


