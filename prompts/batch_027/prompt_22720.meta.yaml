  Good''s theorem (value of information): Good''s theorem states that the expected
  value of information is non-negative (when decisions are made to maximize expected
  utility, the value of an information source is always ≥ 0). There are subtleties:
  the theorem assumes the decision-maker can condition on the signal, and the value
  is non-negative. In-the-weeds issues:

  - Why does the theorem fail when there are costs to acting based on information,
  or when the decision-maker is not certain about the utility function?

  - The relationship to Blackwell''s informativeness ordering: Blackwell showed that
  the expected value of information provides a complete ordering of information sources
  (under some conditions) — actually, Blackwell''s theorem states that one experiment
  is more informative than another iff it can be obtained as a garbling of the other,
  and this is equivalent to being at least as valuable for all decision problems (for
  all utility functions). This is a deep connection: Good''s theorem (non-negativity)
  + Blackwell''s ordering.

  - The "value of information" can be zero even if the information is surprising,
  etc.

  - A subtle in-the-weeds point: Good''s theorem assumes the information is costless
  and that the decision-maker is a Bayesian who updates by conditioning. If the agent
  is uncertain about the likelihood, or if the information arrives in a form the agent
  cannot fully interpret, the value can be negative (in a practical sense).

  - Another subtlety: the theorem is about the *expected* value before observing the
  information. After observing, the realized value can be negative relative to the
  prior expectation.

  - Also: Good''s theorem does not imply that one should always seek out information
  when there is a cost — trivially, if the cost exceeds the expected value, don''t
  buy it. The in-the-weeds point is that the expected value is non-negative, so the
  threshold is exactly the cost.

  - Interesting in-the-weeds issue: the value of information for a *decision problem
  with multiple stages* — the option value of information. Or the difference between
  the value of information and the value of *being able to choose whether to use*
  the information.

  - Another good in-the-weeds angle: Good''s theorem holds for a single decision,
  but in a *sequential* decision problem, information can have a negative *realized*
  value, and also the theorem''s assumption of "the agent can commit to a decision
  rule as a function of the signal" is doing a lot of work. If the agent cannot commit
  (e.g., if they are a creature that updates and then makes a new decision, and might
  make a mistake), the non-negativity can break down. This is related to the "commitment"
  literature.


  Actually, a classic in-the-weeds issue: Good''s theorem is often stated as "information
  has non-negative expected value," but this is only true when the information is
  *free* and when the agent is *certain* of the model. More interestingly: the theorem
  is about the expectation over the information source. If the agent is uncertain
  about which information source they are receiving (e.g., they don''t know whether
  their sensor is reliable), the expected value of *that particular signal* can be
  negative. There''s also a well-known subtlety in the literature: "the value of information
  is non-negative" is about the *ex ante* value of the information source, not the
  *ex post* value of a specific signal.


  Also a known subtlety: Good''s theorem holds when the set of actions is finite and
  utilities are bounded (or more precisely, when the expected utility is well-defined).
  With unbounded utilities, the expectation may not exist and the theorem can fail.


  Another in-the-weeds angle for Good''s theorem: the connection to Blackwell''s ordering
  — "more informative in the Blackwell sense" is equivalent to "at least as valuable
  for all decision problems." This is a really nice conceptual issue: the value of
  information is not just a number but induces a complete ordering, and the ordering
  is independent of the decision problem. This is surprising and worth explaining.
  A non-academic persona could say: "I''ve been reading about the value of information
  and I''m confused about how one piece of information can be ''more informative''
  than another in an absolute sense, independent of what decision you''re trying to
  make — I thought informativeness was always relative to a decision problem."


