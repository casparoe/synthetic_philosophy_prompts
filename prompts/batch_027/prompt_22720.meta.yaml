  Boltzmann brains: the classic problem is that in an eternal de Sitter universe,
  Boltzmann brains (random fluctuations that produce conscious observers) vastly outnumber
  ordinary observers, so we should expect to be Boltzmann brains, which is a contradiction
  (we don''t seem to be). In-the-weeds issues:

  - The measure problem: the problem only arises because we need a measure on the
  space of observers, and different measures give different answers.

  - The distinction between Boltzmann brains and "Boltzmann brains with false memories"
  — a Boltzmann brain that has just fluctuated into existence has the same memories
  as we do, so it can''t distinguish itself from us. This is the "Boltzmann brain
  with my exact memories" problem.

  - The "self-indication" vs. "self-sampling" assumption (SIA vs. SSA) — how to weight
  observers.

  - The "Boltzmann brain" problem is really a problem about *measure*, not about physics
  per se.

  - A subtle in-the-weeds point: even if Boltzmann brains outnumber ordinary observers,
  it doesn''t follow that *we* are Boltzmann brains, if the measure weights by something
  other than raw count. E.g., if the measure weights by "typicality" in some sense.

  - Another subtlety: the "Boltzmann brain" argument is sometimes confused with the
  "doomsday argument" — both involve self-locating uncertainty, but they are different.


  This is also a good in-the-weeds area. A non-academic persona: "I''ve been reading
