  The "drowning child" thought experiment: if you see a child drowning in a shallow
  pond and you can save the child by wading in (at the cost of ruining your expensive
  shoes), you have a moral obligation to save the child. Singer extends this to argue
  that we have a moral obligation to give to effective charities (e.g., GiveWell-recommended
  charities) to save lives from poverty, disease, etc.


  The in-the-weeds objections:

  1. **The demandingness objection**: If we have a strict obligation to save the drowning
  child, then by extension we have a strict obligation to give all our surplus income
  to effective charities, which is too demanding.

  2. **The arbitrary distance objection**: Why does the physical proximity of the
  drowning child matter? If I see a child drowning in a pond in my neighborhood, I
  have an obligation, but if I see a child dying of malaria in Africa, why do I have
  an obligation? The distance seems arbitrary.

  3. **The negative vs. positive duty distinction**: Saving the drowning child is
  a "negative" duty (not letting someone die), while giving to charity is a "positive"
  duty (actively helping). Some argue that negative duties are stricter than positive
  duties.

  4. **The strict vs. supererogatory distinction**: Is the obligation to save the
  drowning child a strict obligation (you''re blameworthy if you don''t) or a supererogatory
  obligation (you''re praiseworthy if you do, but not blameworthy if you don''t)?


