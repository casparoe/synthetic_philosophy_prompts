  The Stalnaker-Lewis semantics: a counterfactual "if P then Q" is true at a world
  w iff in the closest/nearest worlds to w where P is true, Q is true. More precisely,
  it''s true iff there is at least one P-world and all the closest P-worlds are Q-worlds
  (or, in the strict version, all closest P-worlds are Q-worlds). Actually, the standard
  formulation: "A > B" is true at w iff either there are no P-worlds (vacuously true)
  or the closest P-worlds to w are B-worlds. So if there''s a closest P-world where
  not-B, the counterfactual is false.


