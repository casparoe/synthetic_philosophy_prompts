  Wei Dai introduced Updateless Decision Theory on LessWrong in 2009 as a response
  to issues with Timeless Decision Theory around reflective consistency — the key
  idea being that an agent commits to an optimal policy in advance rather than updating
  on observations before choosing, which handles certain counterfactual scenarios
  more coherently.


  Rawls'' veil of ignorance from his 1971 work asks parties to select principles of
  justice without knowing their own place in society, ensuring impartiality. Both
  frameworks share a structural similarity: reasoning about what policy or principles
  to adopt independent of one''s specific position, aiming for consistency or fairness
  that case-by-case reasoning can''t guarantee.


  But there are important differences worth noting. Rawls'' veil is a one-time hypothetical
  choice of moral principles among distinct people with competing interests, whereas
  UDT''s policy is a decision rule for a single agent (or correlated copies) motivated
  purely by expected utility, with no moral content — it''s about strategic consistency
