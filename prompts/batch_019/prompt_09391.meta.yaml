  maximizing the product of gains. A good real-world scenario would be one that specifically
  distinguishes it from Nash — like roommates splitting rent with very different outside
  options — since most people would default to citing Nash rather than this more technical
  solution concept.


  Nash''s solution has a counterintuitive flaw: if one party''s outside options improve,
  their Nash-bargained share can actually decrease, which seems unfair — this is exactly
  what KS''s individual monotonicity axiom fixes. A concrete hook would be two co-authors
  or business partners splitting a windfall, where one party''s walk-away value rises
  due to a better outside offer, yet standard bargaining models say she should get
  less, not more — that backwards result is the perfect entry point into the KS critique
  of Nash.


