  Milgrom-Stokey extends this: starting from a Pareto-optimal allocation under common
  priors, if agents receive private information and it becomes common knowledge that
  a proposed trade remains mutually acceptable to everyone, then no actual trade will
  occur, since the persistence of mutual agreement after all that updating reveals
  nobody holds private information that would make the trade beneficial to the other
  side.


