  that you shouldn''t want to trade with someone willing to trade with you in a purely
  speculative, information-driven setting—their willingness itself is adverse information,
  since a rational counterparty factors in the winner''s-curse-like signal that your
  eagerness to trade sends, eliminating any perceived gain from private information.


