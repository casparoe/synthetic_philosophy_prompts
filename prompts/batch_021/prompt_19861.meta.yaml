  Recalling embedded agency from MIRI''s Garrabrant/Demski work: the core idea is
  that traditional agent models treat the agent as separate from the environment via
  a clean Cartesian boundary, but real agents are embedded — made of the same substance
  as their environment, smaller than it, and computing under physical resource constraints.
  This breaks into four clusters of subproblems, starting with decision theory.


  Decision theory concerns how to act when you''re part of the world you model, and
  I''m recalling the "5-and-10 problem" — where an agent using proof-based reasoning
  to evaluate hypothetical actions can derive spurious counterfactual proofs about
  the branches it never takes, since a false premise lets anything follow, potentially
  leading it to pick the worse option.


  The other core embedded agency challenges include embedded world-models (an agent
  smaller than its environment facing non-realizability, logical uncertainty, and
  the grain-of-truth problem in reasoning about other agents'' strategies) and robust
  delegation (trusting a future or successor version of oneself).


  This ties into Vingean reflection—trusting a smarter agent whose exact actions you
