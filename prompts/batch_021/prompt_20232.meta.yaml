  Before drafting, I want to nail the philosophical content. Reductionism (Humean)
  holds that justification for trusting testimony reduces to inductive evidence from
  perception and memory about testifiers'' reliability—there''s a further split between
  local reductionism (evidence about this particular source) and global reductionism
  (evidence about testifiers as a class). Anti-reductionism (Reid, and more recently
  Burge and Coady) treats testimony as a basic, non-inferential source of justification—a
  default entitlement or "principle of credulity" that holds absent specific reasons
  for doubt, paralleling how perception justifies belief directly.


  The classic arguments cut both ways: anti-reductionists point to how children trust
  testimony well before they could have inductively verified anyone''s reliability,
  and to the sheer scale of our reliance on testimony (we couldn''t possibly verify
  enough sources to justify the whole practice inductively)—plus the fact that verifying
  testimony often just means relying on more testimony, a circularity problem for
  reductionism. Reductionists counter that anti-reductionism grants testimony an implausible
  free pass (the gullibility worry), since in practice we clearly do discount unreliable
  or incentivized sources, which suggests reliability-tracking is doing the real work.


