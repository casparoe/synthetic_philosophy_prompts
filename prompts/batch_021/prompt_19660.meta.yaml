  probabilities" shows both can be seen as instances of a broader "expert principle"
  schema, but treating the Principal Principle as literally a special case of Reflection
  conflates objective chance with subjective credence—a substantive, controversial
  move that van Fraassen doesn''t straightforwardly make.


