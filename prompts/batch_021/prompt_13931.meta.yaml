  that a rational agent''s current credence in a proposition, conditional on knowing
  their future credence will be some value r, should equal r itself—essentially treating
  one''s future self as an epistemic authority, analogous to how the Principal Principle
  treats objective chance. He used this to help justify Bayesian rationality without
  assuming conditionalization outright.


