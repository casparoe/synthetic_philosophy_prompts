  I recall the surrogate goals concept from the Center on Long-Term Risk, developed
  by Tobias Baumann around 2017-2018, as a way to deflect acausal threats. The basic
  idea is that agents predicted or simulated by others could be threatened without
  direct interaction, and standard game theory suggests committing to never give in
  to such threats to avoid being exploitable.


  But this commitment strategy fails in practice—an adversary might already be predisposed
  to threaten regardless of your commitments, or you might not credibly signal your
  resolve, especially under uncertainty. So the surrogate goal trick is to manufacture
  an artificial, low-cost vulnerability and commit to reacting to threats against
  it as though it were your real priority, redirecting the threatener''s leverage
  away from anything that actually matters to you.


