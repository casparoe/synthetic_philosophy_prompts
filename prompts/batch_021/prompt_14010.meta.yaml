  Death dies in the matching city, survives in the mismatched one - and since Death
  predicts perfectly, the man''s choice correlates perfectly with Death''s location
  even though it doesn''t causally influence it. That''s the paradox: CDT wants to
  compute expected utility holding Death''s location fixed, but there''s no stable
  fixed point since whichever city seems safer given the current belief becomes the
  one you''d flee to, which then becomes the predicted (and thus fatal) city.


  This instability motivates alternative frameworks: Jeffrey''s ratifiability, which
  demands a rational choice be a fixed point best-responding to the probabilities
  induced by that very choice, or evidential decision theory, which sidesteps the
  cycling by directly conditioning on the action itself. Death in Damascus is actually
  notable because under naive CDT, neither option turns out ratifiable—unlike Newcomb''s
  problem where two-boxing is stable—so both acts destabilize once chosen, posing
  a genuine puzzle about how rational agents should act when no equilibrium exists.


