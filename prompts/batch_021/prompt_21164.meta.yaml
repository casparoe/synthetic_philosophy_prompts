  Anekāntavāda is the Jain doctrine that reality has infinite aspects, so any single
  assertion is inherently partial - a kind of epistemological humility built into
  metaphysics. Syādvāda operationalizes this through the sevenfold predication (saptabhangi),
  prefacing claims with "syāt" ("in a certain respect") to qualify statements as existing,
  not existing, both, or being inexpressible in various combinations.


  Nayavāda then classifies the possible partial standpoints (naya) themselves - traditionally
  seven, split into substance-focused (dravyarthika) and mode-focused (paryayarthika)
  viewpoints - and treats it as a fallacy (nayabhasa or ekantavada) when a partial
  standpoint is mistaken for the whole truth, which is precisely the error anekantavada
  is designed to correct.


  The most persistent historical objection is the charge that syadvada violates the
  law of non-contradiction by claiming a thing "is and is not" - Jains counter that
  the respects differ (clay vs. brass), so it''s only an apparent contradiction from
  elliptical ordinary speech. I''m noting that Buddhist logicians like Dharmakirti
  and Dignaga, along with Brahmanical thinkers such as Shankara, the Naiyayikas, and
  Kumarila Bhatta, all pressed this critique, arguing Jain relativism was either self-contradictory,
  collapsed into skepticism, or failed the trairupya conditions for valid inference.


