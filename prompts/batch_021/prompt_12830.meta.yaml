  Aumann''s agreement theorem stands out since it has real tension to exploit: rational
  Bayesians with common priors who share common knowledge of each other''s beliefs
  supposedly can''t agree to disagree, a result often invoked in rationalist communities
  to justify updating toward others'' views. A dialogue could dramatize two people
