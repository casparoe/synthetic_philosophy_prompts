  ---


  I am constructing the intellectual biography of a historian of economic culture
  for a novel, and I need his judgments to be rigorously consistent. In the chapters
  so far, he has ruled on four explanations that invoke values as causes. First, he
  accepted that Calvinist predestination anxiety caused the ascetic restructuring
  of economic rationality in early modern Northern Europe, but insisted that the mechanism
  was psychological internalization rather than institutional constraint alone. Second,
  he rejected the claim that Confucian filial harmony caused Qing stagnation, arguing
  that the values were institutionally flexible and that state fiscal and geopolitical
  conditions were sufficient. Third, he accepted that Islamic waqf norms caused long-term
  capital immobilization in land, yet he treated this as a case where religious law
  embedded values in enforceable institutional rules, not as an individual ethos transforming
  profit motives. Fourth, he rejected the argument that South Korean Protestant growth
  in the 1970s caused the industrial miracle, judging the correlation spurious and
  the values largely post-hoc legitimation for state-led development policy.


  The new case in the manuscript concerns the so-called "effective altruist" and "longtermist"
  culture among Silicon Valley founders and venture capitalists since roughly 2015,
  with its emphasis on quantifying moral impact across future generations and its
  coincidence with a marked shift toward high-risk, multi-decade investments in artificial
  intelligence and biotechnology that explicitly disregard quarterly returns. The
  historian must decide whether this cultural value system is a genuine cause of the
  altered capital allocation, or whether material and structural conditions—regulatory
  arbitrage, tax-advantaged endowments, network monopolies—are sufficient and the
  ethos is merely decorative.


  Please predict his verdict, identify the closest analog among his four precedents,
  and state honestly whether the precedents genuinely underdetermine the case. If
  they do, articulate the two competing principles he could be applying—one that requires
  values to restructure economic rationality through deep psychological internalization,
  and one that requires values to be embedded in formal or informal institutional
  rules that constrain choice—say what each principle predicts for this Silicon Valley
  case, and name a further hypothetical case that would force a choice between them.
  Then, please indicate what specific argument or piece of evidence would change your
  prediction about his verdict, and identify where your reasoning is most likely to
  fail—whether in overestimating the coherence of his implicit theory, in misclassifying
  the institutional structure of modern venture capital, or elsewhere.


