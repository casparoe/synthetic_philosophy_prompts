  what I call "strategic presentism": it is legitimate to teach obsolete frameworks—phlogiston,
  caloric, the geocentric model—as demonstrably wrong approximations that served as
  necessary stepping stones to current theories, precisely because this clarifies
  the logic of theory revision for students; (4) I deny that the trajectory of science
  possesses any intrinsic teleology or directional momentum; the path from Aristotelian
  physics to quantum field theory was radically contingent, and present theories are
  not the inevitable telos of earlier ones; (5) in recent columns I have argued that
