  Let''s draft:


  "For my democratic theory seminar I''m drafting a position paper on the boundary
  problem, and before I submit my outline I want a hard consistency check on the package
  below. Here is where I''ve landed:


  (1) Democratic legitimacy requires two separate conditions: constituent membership
  (being part of the self-authorizing political community, grounded in autonomy) and
  stakeholder standing (having one''s fundamental interests significantly affected
  by collective decisions).


  (2) Constituent membership must be bounded: democratic self-determination requires
  a delimited demos with shared institutions, so there is no global democratic electorate.


  (3) Stakeholder standing is universal in principle: anyone affected — across space
  or time — should have some form of representation, though the institutional form
  can vary by category.


  (4) Future generations should have binding democratic representation in present
  bodies (institutional trustees with veto power over long-term climate and fiscal
  policy) because they are profoundly affected by current choices despite lacking
  present autonomy.


  (5) Non-citizen long-term residents should vote in local but not national elections,
  since local governance structures their daily lives; citizenship is not the correct
  boundary criterion.


  (6) Non-human animals and severely cognitively disabled adults should not hold votes
  or democratic proxies, but legislatures should be required to include expert advisory
  boards and weighted interest-protection mechanisms for them.


  (7) The scope of democratic rights should track the scope of institutional impact:
  local stakeholders decide local questions, national constituents decide national
  ones — but stakeholders affected nationally should still have advisory or veto mechanisms
  where impacts are severe.


  Are these jointly tenable? In particular: which pairs only look tense but dissolve
  once the constituent/stakeholder distinction is applied correctly; which commitments
  genuinely pull against each other; and where does my principle fail to deliver a
  definite verdict on a case? Rank the tensions by severity. For each, say what the
  cheapest revision would be and what it costs. Do not list everything as equally
  bad, and do not hedge: take a definite view on which commitments are salvageable
  together and which single revision would clean up the most tension. Then give your
  bottom-line consistency verdict.


  Please structure your response in the following sections, with approximate lengths:

  - ''Apparent tensions that dissolve'' (~150 words)

  - ''Genuine tensions, ranked by severity'' (~350 words)

  - ''The case my principles cannot decide'' (~150 words)

  - ''What has to give and at what cost'' (~200 words)

  - ''Bottom-line consistency verdict'' (~100 words)


  Please take a committed position throughout: make definite choices about which commitments
  survive, which fall, and why, rather than presenting options and leaving me to pick."


