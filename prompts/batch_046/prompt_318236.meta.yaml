  First, the standard case: a scanner on Earth destroys my body atom by atom and sends
  the information to Mars, where an exact physical and psychological replica is assembled.
  I feel that I survive, in the sense that it is appropriate for me to anticipate
  the experiences of the Martian replica, though I recognize this is not ordinary
  bodily continuity.


  Second, a non-destructive scan produces an identical copy on Mars while I remain
  alive and conscious on Earth. Here I am certain that I do not survive as the Martian
  copy; the copy is a distinct person who shares my psychology but is not me.


  Third, a gradual replacement case: over ten years, my biological neurons are replaced
  one by one with synthetic equivalents that preserve all functional dynamics and
  causal relations among mental states, until none of my original tissue remains.
  I think I survive this process continuously.


  Fourth, the delayed-reconstruction case: the scanner takes a complete snapshot of
  me at age thirty, but due to a technical failure the reconstruction does not occur
  until I have lived to age seventy and died of natural causes. A copy is then built
  from the thirty-year-old scan. Despite the psychological similarity, I feel that
  this reconstructed individual is not me; there is a break in psychological continuity
  that undermines survival.


  Fifth, a branching malfunction produces two perfect copies on Mars and Venus, both
  psychologically continuous with me. I find that I should care about both equally,
  but I also feel there is no further fact about which one is ''really'' me; yet I
  am reluctant to say that I survive as both, since that seems to violate the logic
  of identity.


  Sixth, and this is the case that keeps coming back to me: a distributed-network
  reconstruction. The scanner destroys my body, but rather than assembling a localized
  physical organism, it instantiates my mental dynamics as patterns distributed across
  a non-localized cloud of processing nodes, with no spatiotemporal contiguity between
  successive mental states and no embodied interaction with a physical environment—only
  structural relations among mental contents are preserved. I am inclined to say that
  this is not survival, even though all psychological relations are intact, because
