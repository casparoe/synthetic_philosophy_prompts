  Draft:


  I''m trying to work out where I stand on Daniel Dennett''s idea that the self is
  not a metaphysical substance but a "center of narrative gravity" — an abstract point
  around which a biography is organized, like the center of mass of a physical object.
  In our philosophy of mind reading group, we''ve been testing the idea by asking
  whether various entities count as such centers, and my colleague has offered a remarkably
  consistent set of verdicts. She holds that a neurotypical adult human is clearly
  a center; that a fully realized fictional character like Anna Karenina or Sherlock
  Holmes is also one, though "ontologically thinner" because the narrative is authored
  rather than lived; that a multinational corporation with legal personhood and institutional
  memory is not, since there is no unified first-person point of view, only distributed
  decision nodes; that a patient with dense retrograde amnesia who retains present
  reasoning, emotion, and self-awareness still counts, but as a "truncated" center
  whose narrative has lost its past tail; that a bee colony exhibiting emergent problem-solving
  is not a center, because cognition is distributed without a single organizing biography;
  and that a split-brain patient after callosotomy hosts two distinct centers, one
  per hemisphere, rather than one fractured self.


  These verdicts seem to me jointly compatible with at least two different rules.
  One reads her as applying a broadly interpretive criterion: wherever there is a
  coherent, first-personal narrative with minimal temporal continuity — even if externally
  authored or severely truncated — a center of narrative gravity exists, with substrate
  being irrelevant. Another reads her as requiring functional-autobiographical integration:
  the narrative must be actively maintained and behaviorally guiding within the system
  itself, allowing for split-brain separation and amnesiac truncation, but excluding
