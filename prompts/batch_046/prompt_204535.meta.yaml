  I tried to formalize Braudel''s distinction between the longue durée and the event
  with an interventionist account of causation, and I think it proves that no historical
  actor ever causes anything. The conclusion is clearly wrong—Braudel himself writes
  about specific battles and alliances as if they matter—but I can''t locate the error
  without abandoning either the framework or the philosophy of causation.


  (1) On a Woodward-style interventionist view, X causes Y just in case an intervention
  on X, holding other relevant variables fixed, produces a change in Y.


  (2) Braudel''s central claim is that structural variables—geography, climate, demographic
  rhythms, the slow movement of the longue durée—constrain macro-historical outcomes
  far more tightly than any event-level variable, such as a particular treaty, battle,
  or personal decision.


  (3) Formally: for any event-level variable E and macro-outcome O, there exists an
  intervention on E (holding structural variables S constant) that leaves O unchanged,
  while an intervention on S produces a dramatic change in O.


  (4) By (1), this means S causes O but E does not.


  (5) This is not exceptional but systematic: every event-level explanation in historiography
  can be paired with a structural variable that dominates it interventionally.


  (6) Therefore, on this formalization, no individual action, decision, or contingent
  event ever causes any large-scale historical outcome; all are causally inert relative
  to the structures that contain them.


  (7) But if (6) holds, then Braudel''s own practice—writing dense narratives of Philip
  II''s diplomacy, Mediterranean trade conflicts, and strategic choices—is causally
  mistaken, since those choices do no work.


  (8) It also implies that present political agency is largely illusory with respect
  to climate and geography, which undermines the practical rationale for studying
  history at all.


  (9) So the framework, made precise, undermines itself and eliminates the very subject
  matter it was meant to illuminate.


  (10) Thus one of (1) through (5) must fail. But (1) is our standard analysis of
  causation, (2) is the heart of the Annales thesis, and (3)-(5) seem to follow by
  valid inference.


