  from the poem’s identity and must be recreated in translation, even if this requires
  altering surface semantics; the opposing camp holds that translation serves communicative
  intent, that such hidden structures carry no interpretable content, and that altering
  them is not a loss of meaning but a legitimate functional adaptation. I want you
  to treat these as parties to an adversarial collaboration.


