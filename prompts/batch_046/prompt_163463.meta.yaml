  Design a 90-minute seminar activity for sixteen upper-level undergraduates in a
  philosophy of rationality course. The session should make the backward induction
  paradox in the centipede game feel like a lived strategic tension rather than an
  abstract argument, using a modified structure that introduces a second-order move
