  choose to continue or stop, with mutual continuation increasing a shared point pool
  according to a simple linear schedule; if one stops, that player takes the larger
  share and the other takes a smaller share, with the exact split worsening for the
  cooperator as the ladder climbs. Crucially, the total number of rounds is hidden:
  the facilitator holds a deck of cards marking rounds 1 through N (with N unknown
  to players), turning over one card after each mutual-continuation decision to reveal
  whether the ladder has reached its hidden terminus. Each player also holds a single
  private token. At any point, a player may play their token and declare "induction
  demands defection now." Doing so immediately ends cooperative play and triggers
  a justification vote: the other player, without seeing the hidden deck state, must
  vote whether the token-play was rationally compelled or strategically premature.
  The vote determines the token-player''s final bonus or penalty, applied to their
  accumulated points.


