  core is doing all the compositional and inferential work in conditionals, negations,
  and disjunctions, then the attitude is epiphenomenal to moral reasoning. The expressivist''s
  distinctive claim was that moral judgment is fundamentally an expression of attitude,
  not a representation of moral facts; but if representation handles all the logic,
  the attitude becomes a decorative psychological overlay.


  Mara shifted ground and defended a ''dynamic'' variant: rather than treating moral
  sentences as expressing static propositions or static attitudes, we should treat
  an assertion of ''murder is wrong'' as updating a conversational score with a normative
  commitment. Embedding in a conditional updates the score conditionally. The Frege-Geach
  problem, she said, presupposes static propositional semantics, so it misses the
  point if the underlying mechanism is score-based and compositional without being
  propositional.


  Leo granted that dynamic semantics might avoid the static embedding problem, but
