  disapproval, but when it appears embedded in a conditional — for example, ''If murder
  is wrong, then persuading your brother to murder is wrong'' — it need not express
  that attitude at all. Instead, she argued, it functions as a supposition of a moral
  framework, much as ''If the king is in the counting house'' supposes a fiction without
  asserting it. So there is no pressure to assign it a descriptive, propositional
  content just because it sits inside a logical compound.


  Leo responded that this merely relocates the difficulty. If the semantic contribution
  of ''murder is wrong'' shifts between expressing an attitude in isolation and expressing
  something else (or nothing) inside a conditional, then valid moral reasoning is
  broken. The inference from ''Murder is wrong'' to ''Persuading my brother to murder
  is wrong'' depends on a stable premise that connects to the conclusion via the conditional.
  If the premise in isolation carries one kind of meaning and the antecedent in the
  conditional carries another, the expressivist cannot explain why the unembedded
  argument is valid without smuggling in a hidden descriptive content.


  Mara then proposed a hybrid compromise: there is a stable descriptive core — the
  property of being wrong — but this core is grasped and activated only through an
  associated non-cognitive attitude. In unembedded contexts the attitude is live;
  in embedded contexts only the descriptive core is active, providing the logical
  stability Leo demands, while the attitude remains what distinguishes moral judgment
  from mere description.


