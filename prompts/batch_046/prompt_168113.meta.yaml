  problem—everyone wants to trade and needs to agree on a place. The coal pier is
  arbitrary because the marina or square could have worked just as well; in fact,
  they are functionally identical, so the choice is completely interchangeable. Third,
  there is common knowledge and conditional preference: everyone knows everyone goes
