  I just spent the better part of the evening in a long, circular argument with a
  friend about whether it is conceptually coherent to hold an entire nation responsible
  for a war. We kept circling back to the Fischer controversy: my friend insists that
  once the archival evidence establishes deliberate strategic recklessness by the
  German leadership in 1914, moral blame naturally attaches to "Germany" as a collective
  entity. I tried to push back that this slides from causal-historical explanation
  into a metaphysically dubious form of national guilt, but I could not fully articulate
  why the slide is illegitimate, especially given the recent literature on corporate
  agency. I need to present a sharper version of this position in a seminar next week.


  Please take on the role of an expert in the philosophy of collective responsibility,
  with deep familiarity with modern European intellectual history and with preparing
  scholars for hostile academic Q&A. Before drafting the prep sheet, spend a moment
  brainstorming the different species of objection this audience is likely to generate—historical,
  metaphysical, practical, and rhetorical—so that the ordering reflects actual threat
  rather than my own anxieties.


  My thesis: The Fischer thesis demonstrates that specific bureaucratic actors within
  the Wilhelmine state pursued a strategy of calculated risk that made general European
  war probable. However, attributing moral blame to "Germany" as a nation requires
  a theory of collective agency that the archival, agent-centered methodology of Fischer''s
  own work cannot support. The Wilhelmine decision-making structure was not a unitary
  corporate agent but a fragmented committee of competing institutional factions—War
  Ministry, Foreign Office, General Staff—whose strategic intentions were not coherently
  integrated. Therefore, "holding Germany responsible" is either a category mistake
  (treating an aggregation of competing bureaucratic roles as a single moral subject)
  or requires distributing blame across institutional roles in a way that dissolves
  the national unit of attribution. I do not deny that individual actors were culpable;
  I deny that culpability aggregates into national guilt without a coherence condition
  that 1914 Germany failed to meet.


  The audience: A joint philosophy-and-history seminar with the following composition:

  - Three philosophers of collective action who work on group intentionality and are
  broadly sympathetic to corporate-agency accounts (they know the collective-responsibility
  literature well and will defend distributed but unified group minds).

  - Two intellectual historians who are deeply versed in the Fischer controversy and
  regard the September Program and the "blank check" evidence as decisive for strategic
  intent; they are skeptical of philosophical abstraction.

  - One international-relations realist who thinks moral blame is irrelevant to state
  behavior and will treat my argument as a category error in practical reasoning.

  - Several graduate students in modern European history who are familiar with the
  structuralist critiques of Fischer but will want to know what is genuinely new in
  my framing.

  - My friend, who is a committed methodological individualist and will be in the
  front row.


  The talk is twenty minutes; the Q&A is thirty minutes. I need a speaker-prep sheet,
  not a defense of my view in the abstract. Order the objections by the combination
