  adequately developed in the literature: that we should separate three dimensions
  of linguistic competence in translation—(i) hermeneutic reconstruction, or the grasp
  of an author''s intended meaning-world; (ii) functional equivalence, or the production
  of outputs that preserve appropriate behavioural and communicative effects in context;
