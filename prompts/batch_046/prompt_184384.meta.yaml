  The essay takes as its point of departure Ranke’s well-known injunction that history
  should represent events as they actually occurred, an ideal that E.H. Carr attacked
  by arguing that every historian necessarily selects and arranges facts according
  to present concerns, and that Hayden White pushed further by claiming that historical
  narratives are fundamentally constructed through rhetorical emplotment rather than
  discovered in the archive. Rather than choosing between naive correspondence and
  radical constructivism, the essay proposes a reconception of objectivity as intersubjective
  calibration: just as scientific observation is theory-laden yet constrained by the
  resistance of instruments and reproducible measurements, historical interpretation
  is guided by selection yet constrained by what the essay calls "calibration points"—economic
  structures, demographic patterns, and material conditions that limit which narrative
  structures are plausible.


  To test this middle position, the essay applies it to a deliberately difficult case:
  a seventeenth-century municipal tax revolt for which no direct administrative records
  survive, leaving only indirect references in notarial contracts and church donation
  logs. The argument is that, although Carr is correct that the historian must select
  which traces to foreground, and White is correct that these traces can be arranged
  into different narrative modes, the economic constraints of the period—specifically,
  the fixed ratio of land tax to market toll revenue—function as calibration points
  that make some emplotments (for example, a purely heroic romance of popular resistance)
  significantly less plausible than others (for example, a tragedy of structural fiscal
  overreach). The essay therefore concludes that White’s scepticism about historical
  objectivity is overstated at the microhistorical scale, even while Carr’s thesis
  about the inevitability of selection remains fully intact.


  Please comment specifically on the following: (1) whether the analogy between scientific
  instrument calibration and historical source constraints genuinely addresses White’s
  concern about the rhetorical constitution of historical narratives, or whether it
  illegitimately imports a natural-science model of objectivity into a discursive
  practice; (2) whether the application to the undocumented tax revolt successfully
  illustrates the proposed middle position, or whether it covertly assumes an economic
  determinism that itself requires narrative justification; and (3) whether the argument
  would be strengthened by confronting the possibility that the so-called calibration
  points are themselves products of prior interpretive choices rather than brute constraints.
  Suggest revisions that would make the essay more rigorous without requiring extensive
