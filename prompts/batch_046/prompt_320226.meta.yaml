  tape, the screen, the viewer, and the real-time broadcast. Then specify the points
  of breakdown, with particular attention to three issues: temporal binding (whether
  consciousness requires a synchronous frame rate), the unity of the self (whether
  there must be one audience member), and the status of a "final cut" (whether there
  is a definitive version of experience that is "shown" to anyone). Examine what normative
  or metaphysical baggage the analogy imports—especially the idea of a single, spatially
  localized convergence point—and ask whether that baggage does the argumentative
  work of making the Cartesian theater seem unavoidable. Next, consider an injected
  variant: suppose there is no director, but instead dozens of local editing bays,
  each producing its own version of the program with slightly different cuts, delays,
