  In a seminar on early twentieth-century value theory, two of my peers—let us call
  them Rowan and Sable—became locked in a dispute over how to read G. E. Moore''s
  treatment of intrinsic goods in Principia Ethica, specifically the relation between
  aesthetic appreciation and personal affection. Rowan maintained that Moore''s doctrine
  of organic unity implies that the contemplation of beauty possesses only derivative
  value unless it occurs within, or is directed toward, a relationship of friendship
  or love; on Rowan''s reading, a solitary individual experiencing a sublime landscape
  or an elegant proof enjoys at best a fragmentary good, because the greater intrinsic
  value belongs to the whole composed of consciousness plus its object, and the highest
  such wholes for Moore are those involving affectionate relations between persons.
  Sable countered that this collapses two distinct goods into one: Moore lists both
  the appreciation of beautiful objects and the enjoyment of personal affection among
  the greatest goods, and while he certainly holds that a shared aesthetic experience
  can form an organic whole of higher value, he never suggests that isolated aesthetic
  consciousness is worthless—only that it is a different, and independently valuable,
  state of affairs.


  Rowan pressed the point with a hypothetical: imagine a mathematician who spends
  decades in isolation deriving beautiful theorems, never forming close attachments,
  yet experiencing profound aesthetic satisfaction in the structures he discovers.
  If Moore truly regards friendship as among the supreme goods, Rowan argued, then
  such a life must be judged gravely deficient, and the mathematician''s aesthetic
  experiences must be seen as failing to realize the kind of value that would redeem
  them—suggesting that for Moore, beauty without friendship is like a melody without
  harmony, formally present but lacking the relational completeness that generates
  the highest worth. Sable admitted that Moore would indeed judge the hermit''s life
  less good than one enriched by love, but insisted that Rowan was conflating comparative
  judgment with constitutive dependence: the mathematician''s contemplative states
  still possess positive intrinsic value, and the deficiency of his life stems from
  the absence of friendship, not from the emptiness of his aesthetic pleasures. She
  added that if Rowan were correct, then any experience of beauty lacking an interpersonal
  frame—listening to music alone, for instance—would be nearly valueless, a consequence
  she took to be implausible both as an interpretation of Moore and as an account
  of human flourishing.


  Rowan then introduced a further refinement: he granted that isolated aesthetic experiences
  might have some minimal value, but claimed that Moore''s emphasis on organic unity
  means their value is not merely augmented but transformed by being shared; therefore,
  to assess the worth of beauty in a life, one must ask not whether it is present
  in isolation, but whether it participates in a larger relational whole. Sable replied
  that this still fails to establish dependence, since transformation upon combination
  is compatible with the prior independence of the parts—salt retains its taste when
  dissolved in soup, yet its flavor is not constituted by the broth. She concluded
  that both parties might be missing Moore''s subtle distinction between the value
  of a whole and the value contributed by each part, and that the real disagreement
  concerns whether friendship functions as a necessary condition, an enhancing context,
  or a parallel good of comparable rank.


