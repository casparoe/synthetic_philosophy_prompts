  what I call a fugue structure. Independent processing streams—say, foraging, defense,
  and thermoregulation—must enter and exit according to contrapuntal feedback rules,
  integrating without a central conductor. If the streams are only hierarchically
  commanded or statistically correlated, there is behavior but no cognition.


  Third, I think original intentionality is fixed by evolutionary selection history,
  and I deny that the unit of selection must be the individual organism. A colony
  can be a unit of selection if its reproductive success depends on colony-level traits,
