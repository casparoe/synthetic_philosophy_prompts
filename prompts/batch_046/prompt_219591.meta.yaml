  "I am a retired experimental physicist who has spent the past three years studying
  early modern philosophy, and I am applying for a one-year independent research fellowship
  to develop a project on Thomas Hobbes''s philosophy of geometry. The half-formed
  idea is this: Hobbes insists that geometric figures are not discovered but constructed
  through motion, and that their definitions are not descriptions of pre-existing
  essences but only accounts of how we generate the names we apply to constructed
  bodies. At the same time, his mechanistic explanations in optics and physics appear
  to treat geometric structures—lines of propagation, angles of incidence, the geometry
  of resistance—as genuinely explanatory entities that constrain how material bodies
  must behave. I want to know whether these two commitments can be held together without
  collapse, or whether Hobbes''s nominalism about geometric objects undermines the
  realist explanatory weight he places on them in his science.


  The precise question: Can Hobbes consistently maintain that geometric objects have
  no being independent of our constructive motions while also relying on geometric
  properties as causally explanatory in his mechanistic account of perception and
  motion? More specifically, does his claim that definitions serve only as causes
  of names eliminate the possibility that geometric form plays an irreducible explanatory
  role in physical theory?


  Why it remains open: Existing scholarship tends to treat Hobbes''s geometry either
  as a conventionalist epistemology subordinate to his materialism, or as a direct
  foundation for his mechanistic worldview. What is rarely examined is whether the
  ontology implied by his philosophy of mathematics conflicts with the ontology required
  by his philosophy of science. If geometric figures are purely nominal constructions,
  it is unclear in what sense they can function as objective constraints on causal
  processes; yet Hobbes''s physics repeatedly invokes just such constraints.


  The method: Over twelve months I propose to work in three phases. Months one through
  three: a focused study of the relevant sections of De Corpore and Leviathan, together
  with Hobbes''s shorter mathematical writings, mapping every point at which geometric
  reasoning enters a mechanistic explanation. I will not attempt a comprehensive historical
  commentary but will build a structured taxonomy of uses: representational, calculational,
  and explanatory. Months four through seven: development of a conceptual framework
  that distinguishes geometric constructivism as a thesis about how we come to know
  figures from geometric realism as a thesis about what makes physical explanations
  true. I will test whether Hobbes''s texts allow this distinction to be drawn in
  his own terms, or whether he systematically conflates them. Months eight through
  ten: critical evaluation. I will examine whether the tension can be dissolved by
  interpreting geometric objects in Hobbes as material bodies in motion—thereby reducing
  geometry to mechanics—or whether this reduction eliminates the normative or counterfactual
  force that geometric reasoning supplies in his scientific arguments. Months eleven
  and twelve: writing and revision of a monograph-length study, with a concluding
  section that states clearly what would count as failure.


  What a result looks like and what counts as failure: A successful outcome is not
  a definitive proof that Hobbes was inconsistent, but a precisely articulated framework
  that shows either how his geometry and his physics are compatible on terms he could
  accept, or exactly where and why they are not. The project fails if the alleged
  tension turns out to be a mere ambiguity in my own framing—if, for instance, Hobbes''s
  account of motion and body already contains all the resources needed to resolve
  the problem, and I have invented a conflict by importing distinctions foreign to
  his system. I also consider failure if the argument collapses into a general skepticism
  about all mathematical explanation in mechanistic science, losing its specific connection
  to Hobbes.


  Scope and deliverables: This is a philosophical, not historical or empirical, project.
  It requires no archival work or laboratory resources, only sustained conceptual
  analysis and writing. The deliverable will be a polished manuscript of approximately
  25,000 words, suitable for submission to a philosophy journal or as the basis of
  a larger book proposal.


