  then the student answer (paraphrased, i don''t have the scan in front of me):


  [Answer text]


  ''The standard story is mostly correct. Consequentialism says maximize welfare,
  so if donating half your income saves more lives, you ought to do it—there''s no
  space for going above and beyond, since the best act is already required. This was
  Urmson''s classic point: morality needs three boxes—wrong, permitted, and required—rather
  than just two, because we need a place for heroic or saintly acts that aren''t obligatory.


  On the Kantian side, perfect duties are absolute—like don''t lie—while imperfect
  duties, like beneficence, let you choose how and when to act. Because they don''t
  specify an exact amount, they have a kind of floor: you must do some charity, but
  anything past that floor is supererogatory. So Kant protects supererogation by leaving
  the quota flexible. That said, there''s a tension: if donating a kidney is just
  a really big fulfillment of your imperfect duty to help, then it''s not truly beyond
  duty, just an unusually large payment on the same bill. Still, I think Kant does
  better than utilitarianism here.


  As for consequentialist replies, they can appeal to agent-relative costs—once the
  personal cost gets too high, the act stops being required, which opens up a zone
  of genuinely optional good deeds. The moral-offsetting idea complicates this: if
  I can pay to fund someone else''s kidney donation, then my own failure to donate
  isn''t a moral loss, because the good is still produced. That seems to collapse
  supererogation into efficient allocation—there''s no special praise for doing it
  yourself, just a calculation about who can do it cheapest. So consequentialists
  can allow the acts, but they can''t really capture why we admire the person who
  does it personally.''


