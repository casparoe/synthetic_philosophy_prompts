  a methodological pluralist with evidentiary thresholds who maintains that multiple
  historiographical methods are legitimate but each must satisfy its own internal
  consistency and evidential floor, so that Atlantis fails on internal coherence,
  Fomenko on evidential floor, and ancient-astronaut hypotheses on both.


