  leading to eight logical combinations—with seven named positions placed as leaves
  and one combination deliberately left empty.


  The tree must be built from the logical space of answers, not from a list of names:
  first state the three diagnostic questions, then map the combinations onto positions.
  Each branch node should pose a concrete commitment about one of the following cases:
  (1) Fomenko''s New Chronology, specifically its statistical identification of "phantom"
  dynastic duplicates that conflict with stratigraphic and radiocarbon evidence; (2)
  ancient-astronaut explanations of megalithic precision, evaluated in light of the
  absence of non-terrestrial artifacts and the presence of incremental technological
  precursors; and (3) Plato''s Atlantis narrative taken together with scattered trans-Atlantic
  geological and cultural parallels. Phrase every node as a yes/no or either/or question
  that a student could answer without already knowing which philosophical position
  it corresponds to—for example, asking whether the decisive failure is empirical
  or formal, whether mainstream rejection is epistemically warranted or sociologically
  motivated, and whether anomalous parallels should be suspended in epistemic abeyance
  or absorbed into existing naturalistic frameworks.


  The seven positions that must appear as leaves are: (i) a naïve falsificationist
  who treats pseudohistory as empirically refuted conjecture; (ii) a Kuhnian sociology-of-science
  boundary-policer who treats rejection as paradigm-protective social mechanisms;
  (iii) a craft-norm internalist who denies that there is a deep demarcation problem
  and sees only violations of disciplinary craft rules; (iv) a radical hermeneutic
  incommensurabilist who holds that pseudohistorical and mainstream narratives are
  irreconcilable language games; (v) an epistemic-humility or anomaly-tolerant revisionist
  who argues that mainstream history dismisses anomalous data too quickly; (vi) a
  structuralist pattern-matcher—an under-discussed view—who grants that pseudohistorians
  like Fomenko detect real statistical correlations in chronicle repetition but misattribute
