  40 percent of new affordable units for current neighborhood residents, and that
  requires resident approval of the deal, resolves the tension between interpretations
  (b) and (c).


  Student response:


  The right to the city should be read first and foremost as democratic self-determination
  over local space. When residents enact restrictive zoning through local democratic
  processes, they are exercising that right rather than violating it. State preemption
  is therefore unjustified unless the local decision actively undermines the other
  interpretations. Exclusionary zoning does conflict with equitable access, since
  it bars outsiders from entering the neighborhood, but this conflict is resolved
  by a well-designed community-benefits agreement. By reserving 40 percent of new
  affordable units for current residents and giving those residents veto power over
  the agreement, the plan protects them from displacement—satisfying interpretation
  (a)—while allowing growth that eventually expands access—satisfying interpretation
  (c). Democratic control is preserved because residents must approve the deal, so
  interpretation (b) is also respected. The remaining 60 percent of units provide
  the necessary access for outsiders. Consequently, there is no genuine moral conflict:
  all three interpretations are harmonized, and state preemption is only legitimate
  if residents reject a deal that objectively meets all three criteria, in which case
  the state may impose the access component but should not override the resident veto.


