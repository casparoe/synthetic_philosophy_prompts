  Exam prompt for grading (Urban Philosophy, final):


  Consider the claim that restrictive single-family zoning in high-opportunity neighborhoods
  violates a right to the city by excluding lower-income households from urban amenities
  and economic opportunity. Critics respond that local residents possess a democratic
  entitlement to control land use in their own neighborhoods, and that abrupt upzoning
