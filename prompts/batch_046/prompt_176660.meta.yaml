  is just another hidden variable—call it F. Experts have private signals about both
  F and the forecast quality. They update on both. The cascade on F proceeds exactly
  like a cascade on forecast quality; treating them separately is unnecessary multiplication
  of entities.


  Chen answered that this reduction misses the reflexivity. If F determines how signals
  about forecast quality are weighted, then updating on public behavior about F simultaneously
  corrupts the interpretation of private signals about quality. You can''t run two
  parallel cascades because the second one''s inputs depend on the first one''s output.


