  I''m preparing a feature on how scientific consensus forms around emerging technologies,
  and I recently heard two researchers debate whether a particular pattern counts
  as rational herding. At a workshop, Dr. Lena Voss, a behavioral economist, described
  a sequence she had observed in expert assessments of long-term forecasting methods:
  initially diverse evaluative frameworks—some experts emphasizing calibration metrics,
  others emphasizing structural interpretability—gradually collapsed until nearly
  everyone adopted the same scoring rubric, not because anyone had disproven the alternatives,
  but because the accumulating public endorsements made dissent look like ignorance
  of the standard. She argued this was a textbook information cascade: private reservations
  about the rubric''s adequacy were rationally suppressed in light of prior visible
  commitments.


  Dr. Marcus Chen, a philosopher of science, pushed back. He said Voss was describing
  something more radical than herding. In standard cascades, he noted, the underlying
  state of the world is fixed—whether a restaurant is good, whether an investment
  is sound—and observers suppress private signals about that fixed state. But in Voss''s
  case, the "state" includes which criteria are legitimate for judging forecasts at
  all. Once the cascade fixes a scoring rubric, it doesn''t just suppress disagreement
  about forecasts; it reshapes how experts interpret their own private data. A researcher
  who privately favors structural interpretability now finds her own evidence framed
  as "off-topic" because the rubric defines relevance. Chen called this a reflexive
  framing cascade: the cascade changes the epistemic framework that makes private
  signals intelligible, so the independence conditions required by the standard model
  fail.


