  There Aristotle distinguishes the art of household management, which acquires goods
  only up to the limit of natural need and is therefore bounded, from the art of wealth-getting
  (chrematistikē). The latter arises when money (nomisma), originally invented as
  a conventional medium to solve the problem of exchanging goods of unequal need,
  is treated not as a means but as the very end of acquisition. In retail trade and
  especially in usury, money breeds money without any natural limit, because coin
  is of the same kind as the wealth it measures, allowing accumulation to continue
  indefinitely. Aristotle concludes that this form of acquisition is "unnatural" because
  it violates the teleological structure of the household and the polis: goods exist
  for use, and the instruments of exchange exist for facilitating that use, so when
  the instrument becomes the object of desire, the order of ends and means is inverted.


