  I''m developing a taxonomy of doxastic absence for a project on divine hiddenness,
  and my study group has pressed it into an argument that seems to show God cannot
  exist — but when we extend the structure to ordinary human relationships it proves
  that loved ones must not exist whenever trauma causes alienation. We think there
  is a hidden slide or an overstrong premise, but we cannot locate it. Here is our
  reasoning, with steps numbered:


  (1) Doxastic absence regarding God comes in four forms: (a) culpable disbelief;
  (b) non-culpable disbelief; (c) agnostic suspension; and (d) doxastic alienation,
  in which the agent actually holds the belief "God exists" but cannot integrate it
  into practical reasoning because of psychological, social, or trauma-related barriers.

  (2) If God exists and is maximally good, then God seeks a fully reciprocated loving
  relationship with every rational agent.

  (3) Every form of doxastic absence — including (d) — obstructs that fully reciprocated
  relationship.

  (4) Therefore, if God exists, God removes all four forms in every rational agent,
  unless doing so violates some overriding moral or epistemic duty.

  (5) Removing doxastic alienation (d) may require altering an agent''s psychological
  or social conditions in ways that risk violating autonomy or other goods; but an
  omnipotent being can do so without net loss.

  (6) So if God exists, no rational agent suffers from (a), (b), (c), or (d).

  (7) Yet rational agents plainly suffer from all four.

  (8) Hence God does not exist.

  (9) Now apply the same form generally: if being B necessarily loves agent S, is
