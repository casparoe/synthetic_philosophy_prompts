  argue her credence in Red should update to 3/5; others maintain it should remain
  1/2. Analyze this dispute, with particular attention to whether the commander''s
  statement should be modeled as a material conditional, an indicative conditional
  describing actual frequencies, or a counterfactual constraint on possible worlds.
  Discuss whether either interpretation licenses an update away from the prior, and
  be careful not to conflate this case with temporal updating puzzles like Sleeping
  Beauty.


