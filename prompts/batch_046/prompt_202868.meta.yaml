  Let''s draft the prompt text:


  "I have been working through a problem about the boundary between legend and history,
  using three familiar cases— the Trojan War, King Arthur, and the Exodus— as test
  points. A friend offers the following argument, which seems to show that none of
  the three can be historical, but then extends to events we normally treat as established.
  I find the premises plausible but cannot accept the conclusion. I want to know where
  the chain breaks.


  Here is the argument, with premises numbered.


  (1) Call an event E ''historically established'' only if there is a chain of evidence
  linking us to E that contains at least one link interpretable without presupposing
  the narrative content of any textual source whose primary purpose was non-epistemic
  (e.g., epic performance, dynastic legitimation, cultic law).


  (2) For the Trojan War, every material trace at Hisarlik is dated and classified
  through the Homeric narrative framework; without that framework, the destruction
  layers are indistinguishable from other Anatolian site histories. The literary sources
  are epic poems composed centuries later for panhellenic cultural consolidation.


  (3) For King Arthur, there is no 5th- or 6th-century administrative, epigraphic,
  or archaeological trace that can be linked to a specific British war leader without
  first importing the narrative framework of Geoffrey of Monmouth or the Welsh triads,
  both composed for political and literary purposes centuries afterward.


  (4) For the Exodus, the archaeological record of the Sinai and Transjordan lacks
  the settlement and material-culture patterns expected from a large migrating population
  during the Late Bronze Age; the few traces sometimes cited (certain destruction
  layers in Canaan) are dated and interpreted through the biblical chronology, and
  the Pentateuchal account itself is a unified theological-legal document composed
  for covenantal instruction.


  (5) Therefore, in none of these three cases does an independent, non-textually-mediated
  link exist; so none are historically established.


  (6) Apply the same criterion to the crucifixion of Jesus: the canonical Gospels
  are interdependent texts composed for kerygmatic proclamation; Paul’s letters are
  pastoral-theological; Josephus and Tacitus offer only brief mentions whose independence
  from Christian tradition is contested; and any material traces (e.g., crucifixion
  nails, tomb traditions) are identified and interpreted through the Gospel narrative.
  There is no Roman administrative record of the execution that can be read without
  that narrative framework.


  (7) Apply it further to the establishment of the Roman Republic in 509 BCE: Livy,
  Dionysius, and Plutarch write centuries later and depend on annalistic traditions
  composed to glorify senatorial families; the archaeological record of the early
  Forum and Regia is ambiguous and interpreted through these same texts. No non-textual
  trace bypasses the narrative.


  (8) So by (1), we must deny that the crucifixion and the founding of the Republic
  are historically established.


  (9) But that is implausible; both are central to secular and religious historiography.


  (10) Therefore, the argument proves too much, and something in (1)-(7) must fail.


  My question: which specific premise or inferential step should be rejected? Explain
  why that step looked fine—what intuition about evidence and narrative dependency
  it captures—and then explain what three standard positions on the legend-to-history
  boundary each have to pay in order to reject it. By ''standard positions'' I mean:
  (a) the view that history and legend differ only in degree of corroboration, not
  in kind; (b) the view that archaeological correlation can confirm a narrative even
  when interpretation is initially guided by it; and (c) the view that methodological
  naturalism allows us to filter supernatural framing and recover a historical kernel
  without accepting the full narrative. For each, identify the specific cost—what
  they must give up about independence, circularity, or transmission—when they deny
  the step you have singled out.


  Please do not ask for bibliographies, citations, or reading lists; I am working
  without access to external sources. Keep the diagnosis internal to the logic of
  the argument."


