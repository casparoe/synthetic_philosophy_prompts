  I''m taking an upper-division course on mathematical knowledge and metaphysics.
  After our seminar on Benacerraf''s dilemma — the challenge that if mathematical
  objects are causally inert abstracta then we cannot know them, while if they are
  not abstract then standard mathematics is false — two classmates, Maya and Jordan,
  continued debating in the common room. I was there but stayed out of it. Here is
  what they said, reported as faithfully as I can remember.


  Maya opened by saying that Benacerraf''s dilemma only genuinely threatens full-blooded
  Platonists who also hold a causal theory of knowledge. On a structuralist view,
  she argued, we do not need causal contact with individual mathematical objects;
  we need only understand structures, and we access those structures through their
  physical instantiations and formal representations. So the dilemma is dissolved
  rather than solved.


  Jordan replied that structuralism does not escape so easily. Even if mathematics
  is about structures rather than objects, he said, we still make true claims about
  structures that are never physically instantiated — think of uncountable sets or
  large-cardinal axioms. If all our access is mediated by physical instantiation,
  then either our knowledge is restricted to what''s physically realizable, which
  is wildly revisionary, or we have smuggled in some non-causal access mechanism after
  all.


  Maya then introduced what she called a ''proxy-relation'' account: mathematical
  knowledge is never direct object-knowledge but is always mediated through formal
  representations, proof procedures, and physical reasoning processes. The objectivity
  of mathematics comes from the stability of these proxy relations across representations,
  not from causal interaction with abstract entities. She insisted this handles even
  infinite or non-instantiated cases, because the proxy relations are governed by
  formal rules that do not require actual instantiation to be known.


  Jordan countered with what he called the ''scaling problem.'' For structures that
  are provably too large or complex to have any physical proxy — for instance, structures
  corresponding to large cardinal axioms or non-constructive existence claims — the
  proxy-relation account must either deny that we genuinely know them, which contradicts
  ordinary mathematical practice, or admit that for these cases we rely on something
  other than proxy mediation. That ''something other,'' he argued, is precisely the
  direct, unexplained access that Benacerraf showed was mysterious.


  Maya responded by proposing a ''tiered epistemology.'' She granted that knowledge
  of base, instantiated structures comes through proxy relations. Knowledge of more
  remote structures, she said, is derivative: it comes by logical entailment from
  the base cases together with the formal rules. We do not need direct access to the
  remote structures themselves; we need only know that the rules preserve truth. This,
  she claimed, avoids both causal mysticism and revisionism.


  Jordan said this is just relabeling. If the base cases are proxy-known and the rest
  follow by logic, we still need an account of how we know the logical rules apply
  correctly to those remote domains. Knowing that modus ponens preserves truth across
  all structures, including non-instantiated ones, requires knowing something about
  those structures — or at least about the uniformity of logical consequence across
  domains. That requirement, he concluded, reinstates Benacerraf''s original challenge
  at the meta-level: how do we have that knowledge without causal access?


