  Let''s refine the procedure steps to be concrete:


  Step 1: Spine extraction. Identify the 3-5 causal transitions that form the narrative
  backbone.

  Step 2: Inevitability audit. Scan for modal language ("led to," "made possible,"
  "inevitably," "the only path"). If more than two transitions are framed as necessary
  rather than contingent, flag.

  Step 3: Counterfactual stress-test. For each transition, ask: "If this factor had
  been absent or reversed, would the subsequent stage still have emerged elsewhere?"
  Require the proposal to address this for at least the two most consequential links.
  If it doesn''t, reject or refer.

  Step 4: Scale and mechanism check. For ecological/geographic/technological mechanisms
  claimed, check whether they operate at the scale asserted (local vs continental
  vs global). If the proposal extrapolates from one region to all of humanity without
  intermediate cases, flag.

  Step 5: Source pluralism check. List the primary evidentiary categories (archaeological,
  genetic, textual, ethnographic analogies). If one category dominates (>70%) or if
  non-literate societies are represented only through analogies rather than direct
  evidence, flag.

  Step 6: Endpoint neutrality check. Identify the implicit "present" or "goal" state
  the narrative treats as the culmination. If it maps cleanly onto modern Western
  institutional arrangements and treats alternatives as failures rather than divergences,
  flag.

  Step 7: Silent counter-example inventory. Require three documented cases that deviate
  from the spine. The proposal must classify each as "exception," "branch," or "falsifier."
  If all are classified as exceptions without argument, reject.

  Step 8: Judgment hand-off. At steps 3, 5, and 7, if the committee lacks domain expertise
  to evaluate the answer, refer to an external specialist rather than guessing.


