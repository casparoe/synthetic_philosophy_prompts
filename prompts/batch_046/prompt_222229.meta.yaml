  Consider the following exam question and a student’s response.


  Question:

  Benatar’s asymmetry argument holds that for any actual person, the presence of harm
  is bad and the presence of benefit is good, whereas for any being who never comes
  into existence, the absence of harm is good but the absence of benefit is not bad.
  This evaluation is frequently invoked in support of antinatalism: since procreation
  necessarily introduces harm into the world, while failing to procreate only results
  in missing benefits that are not bad for anyone, it is always preferable not to
  create new people.


  Extend this framework to the case of “counterfactual potential persons”—specific
  individuals who would have existed had a different reproductive decision been made,
  and who are anchored in particular causal histories rather than being purely abstract
  possibilities. Some treatments suggest these beings possess a form of modal presence:
  they do not actually exist, yet they are not entirely unlocated, since they correspond
  to definite possible-world inhabitants.


  In approximately 400 words:

  (a) State Benatar’s asymmetry precisely, distinguishing how actual beings are evaluated
  versus beings who never exist.

  (b) Apply the asymmetry to a counterfactual potential person. Is it bad for such
  a being that they never enjoy pleasure? Is it good that they avoid suffering?

  (c) Assess whether attributing modal presence to these potential persons undermines
  Benatar’s restriction of moral evaluation to actual beings, and whether this generates
  a tension with the non-identity problem’s claim that no specific future individual
  is made worse off by a decision not to conceive them.


  Student answer:

  Benatar’s asymmetry means that for actual people both harm and benefit matter symmetrically—pain
  is bad, pleasure is good—whereas for never-actual beings the evaluation is asymmetrical:
  lacking pain is good, but lacking pleasure is not bad. This is why there is no reason
  to create people: we avoid a definite harm (the suffering of the actual child),
  and we miss only a benefit that is not bad for anyone.


  If we apply this to counterfactual potential persons—those who have modal presence
  in nearby worlds—the result is consistent. Because these beings are not actual,
  they fall under the non-actual side of the asymmetry. It is good that they avoid
  suffering, since that absence of harm applies regardless of modal anchoring. And
  although they miss pleasure in the worlds where they exist, this absence is not
  bad for them, because Benatar’s framework evaluates absence of benefit as neutral
  for any being that does not actually exist.


  There is little tension with the non-identity problem. Both positions deny that
  we wrong specific people by not conceiving them. Benatar reaches this through the
  asymmetry of evaluation: omission does not harm because there is no subject to be
  harmed. The non-identity problem reaches it through the metaphysics of identity:
  changing reproductive choices changes which people exist, so no particular individual
  can complain. In fact, modal presence strengthens Benatar’s case, because if potential
  persons are real enough to be evaluated, the asymmetry shows we do them no harm
  by leaving them unactualized, which aligns neatly with the non-identity conclusion.


  Thus antinatalism remains intact: the good of avoiding suffering is preserved, and
  the missed pleasures of counterfactual beings carry no negative weight.


