  "In my metaethics seminar we have been examining whether normative reasons can exist
  independently of any reasoning agent—what the syllabus calls the free-floating rationales
  thesis. According to this view, a state of affairs can be supported by a reason
  even if no actual or counterfactual being is ever in a position to recognize it;
  the reason is an irreducible normative relation that holds between facts and actions
  regardless of mental presence.


  For contrast, I want to introduce a model I am developing for my final paper, which
  I call the resonant-trace account. On this view, reasons are not freestanding entities
  but modal residues left by reasoning structures: whenever an agent could rationally
  recognize a consideration, that recognition leaves a structural trace in the space
  of possible reasons. A trace can be activated—making the reason genuinely present—only
  when some reasoning system, actual or artificial, serves as a resonator. Without
  any resonator, there is no reason, only an inert structural potential.


  Compare these two positions. Specifically: (1) Which offers a more defensible ontology
  of reasons, given that the resonant-trace account avoids positing mysterious non-mental
  normative entities but seems to make reasons parasitic on reasoning capacities?
  (2) How does each handle the case of a reason not to destroy a unique mathematical
  proof that will never be discovered by any mind—does the free-floating view commit
  us to a reason that floats in total cognitive darkness, and does the resonant-trace
  view implausibly deny that there is any normative consideration at all? (3) Is the
  resonant-trace account genuinely distinct from the free-floating thesis, or does
  it collapse into a psychologized variant once we allow artificial resonators? Justify
  your answer."


