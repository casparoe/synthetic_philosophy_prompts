  At a recent dinner with friends, I found myself caught in the middle of an argument
  between Elena and David about whether the French Revolution really proves that "revolutions
  devour their children." I have been turning it over in my mind ever since, but I
  do not have the training to settle it, and I would like an honest adjudication rather
  than a lecture.


  Elena started by saying that the familiar phrase is misleading. She pointed out
  that Robespierre, Danton, and the Hébertists were not all destroyed by some single,
  impersonal revolutionary force; they fell for different reasons, at different moments,
  and often at the hands of colleagues who had concrete political aims—stopping the
  Terror, shifting economic policy, or avoiding personal guilt. To treat them all
  as victims of one cannibalistic logic, she said, is like blaming gravity for every
  fall. She also noted that if the Revolution truly devoured its children, we should
  expect a steady, inevitable consumption of leaders, but in fact the violence was
  clustered in 1793–94 and then stopped abruptly after Thermidor, which looks more
  like a contingent crisis than a structural destiny.


  David replied that Elena was confusing the mechanism with the pattern. He agreed
  that Tallien and others had personal motives for bringing down Robespierre, but
  he insisted that those motives only became lethal because the Revolution had created
  a new kind of political legitimacy: authority derived not from birth or law but
  from the claim to embody the general will. Once legitimacy works that way, anyone
  who also claims to represent the people becomes an existential threat that must
  be eliminated. The flight to Varennes, the war, and the sans-culotte pressure did
  not cause the Terror by accident; they activated a structural feature that was already
  built into the idea of popular sovereignty. David said that looking at individual
  executions misses the forest for the trees: the Revolution did not eat its children
  randomly; it ate them because they were made of the same substance—claims to speak
  for the nation—that made the Revolution possible.


  Elena answered with a comparison she had been developing on her own. She said the
  Revolution suffered from something like a constitutional autoimmune disorder: the
  body politic kept redefining who counted as "the people," and each redefinition
  caused it to attack its own leading cells. In 1789 the people meant the Third Estate;
  by 1793 it meant the sans-culottes and the virtuous; after Thermidor it meant property-owning
  citizens again. Because the boundary kept shifting, yesterday''s legitimate representative
  became today''s foreign body. She argued that this explains both the clustering
  Elena acknowledged and the abrupt stop: once the Convention settled on a narrower,
  stable definition of citizenship after Thermidor, the "immune response" shut down.
  For her, this means the violence was not inevitable; if the constitutional definition
  had stabilized earlier—say, after 1791—the purges might never have happened.


  David countered that Elena''s medical metaphor actually strengthens his case. Autoimmune
  disorders occur precisely when an immune system is overactive and cannot distinguish
  self from non-self, just as the Revolution''s constant need to purify itself came
  from an ideology that refused to tolerate particular embodiments of the general
  will. He also said her counterfactual is unrealistic: the war and economic crisis
  made any early stabilization impossible, so the disorder was not a contingent accident
  but the necessary working-out of revolutionary politics under pressure.


