  as a mental illness we can cure. Meanwhile, in The General Theory, liquidity preference—the
  desire to hold cash rather than invest—is not a mere pathology but a structural
  feature of an economy with uncertain long-term expectations. Investment depends
  on ''animal spirits,'' and without them, employment collapses. The standard literature
  reads these as separate projects: one normative and predictive, the other descriptive.
  I think they are in tension, but I want to know exactly how deep it runs.


  The precise question: Does Keynes''s macroeconomic theory of investment and liquidity
  preference presuppose the very psychological disposition—the love of security-through-money—that
  his ethical vision of post-scarcity leisure requires us to abandon? And if so, is
  the tension resolvable by treating liquidity preference as a transitional feature
  of immature capitalism, or does it reveal that Keynes''s good life is institutionally
  unstable?


