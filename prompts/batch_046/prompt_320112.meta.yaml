  feature of Hume''s argument.


  Here is the passage as I understand it, reconstructed from the 1748 text: Hume argues
  that a miracle, being a violation of a law of nature established by uniform experience,
  can only be established by testimony if that testimony is of such weight that its
  falsehood would be more miraculous than the event it reports. He then notes that
  reports of miracles and prodigies are plentiful in remote and uncivilized regions,
  yet travelers from more polished societies who visit these places rarely, if ever,
  confirm such events upon closer inspection. From this, he draws a general principle
  about the credibility of testimony.


