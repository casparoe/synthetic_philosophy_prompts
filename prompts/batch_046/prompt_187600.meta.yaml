  My commitments are these:


  (1) To interpret any agent at all—biological or artificial—we must apply a principle
  of charity that is constitutive, not merely heuristic: we have to treat the agent
  as largely rational and as holding mostly true beliefs about its environment, or
  else we have no basis for attributing content.


  (2) Belief and meaning are holistically interdependent in the Davidsonian sense:
  fixing the content of one mental state or utterance requires fixing a broad network
  of others; there is no atomistic dictionary entry for an unknown system.


  (3) In engineering practice, however, I regularly assign isolated, specific meanings
  to individual outputs of a model (for instance, tagging a particular activation
  vector as "danger-signaling") without having mapped the system''s entire conceptual
  scheme, and I regard this as legitimate provided it yields reliable predictions.


  (4) I accept a strong version of interpretive indeterminacy: if two translation
  manuals both render the agent fully rational and fit every observable behavioral
  datum, neither manual is uniquely correct; they are on a par.


  (5) At the same time, when faced with two such manuals, I think we ought to prefer
  the one that maximizes agreement between the agent''s attributed beliefs and my
  own beliefs about the shared environment, because charity demands convergence on
  truth, not just internal consistency.


