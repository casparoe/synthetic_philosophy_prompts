  there. But I want to push on a case that does not fit either taxonomy neatly: what
  we might call constitutive or framework-belief. Consider a researcher entering a
  nascent scientific domain where the very conceptual vocabulary and observational
  protocols depend on accepting a working theoretical framework. Without provisional
  assent to that framework, there is no shared language in which to formulate the
  hypotheses that might eventually confirm or disconfirm it. The belief is not adopted
  because evidence already supports it—Clifford would condemn it—yet it is not quite
  a Jamesian live option chosen for its psychological or moral urgency either; rather,
  it functions as an epistemic precondition for the inquiry itself. Please explain
  the conceptual issue that arises here. Specifically: does James''s distinction between
  belief and hypothesis, and his criteria for legitimate belief in advance of full
  evidence, extend to these structurally necessary, framework-constituting commitments?
  Or does accommodating them require abandoning his psychological account of live
  options? Conversely, can Clifford''s evidentialism distinguish between reckless
  belief and this kind of provisional, methodologically necessary assent without collapsing
  into the claim that all inquiry must begin in a state of pure suspension? I want
  an analysis of how the evidential-precondition relation bears on the ethics of belief,
  not a historical summary or a list of commentators."


