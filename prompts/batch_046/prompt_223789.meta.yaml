  is not privileging "my" mind over others, but denying that there is any metaphysically
  robust boundary between them — comparable to denying that there are separate oceans
  where there is only one body of water with local waves. She added that quantum mechanics
  supports this, since the wavefunction describes a single system, and partitioning
  it into distinct observers is an epistemic convenience rather than an ontological
