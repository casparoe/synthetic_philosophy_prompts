  to adjudicate because they could not agree. I am reporting their exchange exactly
  as it happened; I have not taken a side and will not reveal my own view.


  Jordan began by defining speciesism as the automatic prioritization of human interests
  over animal interests of equal intensity, and argued that this is structurally analogous
  to racism: both use biological categories—species and race—that do not, in themselves,
  track any morally relevant capacity. Jordan cited Peter Singer''s position that
  equal consideration of interests requires extending serious moral weight to sentient
  nonhuman animals, and concluded that anyone who rejects this is committing the same
  kind of arbitrary boundary-drawing that underwrites racism.


  Alex replied that the analogy fails because race has no correlation with cognitive,
  emotional, or moral capacities, whereas species membership does correlate—though
  imperfectly—with capacities such as moral agency, reciprocal justice, and long-term
  planning. Therefore, Alex argued, using species as a boundary can be a rough proxy
  for a capacity-based distinction, not an arbitrary biological prejudice.


  Jordan then invoked the argument from marginal cases: because some humans—infants
  and severely cognitively disabled adults—lack moral agency yet are widely granted
  strong moral protection, capacity cannot be the actual basis for human moral status.
  Jordan claimed this demonstrates that the human boundary is maintained purely by
  biological membership, which makes speciesism exactly parallel to racism.


  Alex countered that Jordan was conflating two different issues. The argument from
  marginal cases undermines a pure, unqualified capacity view, but it does not show
  that species membership is arbitrary. One could adopt a ''potentiality'' or ''kind-membership''
  view: humans belong to a kind whose normal members possess moral agency, and this
  kind-membership generates obligations that do not extend to members of other kinds,
  even if some individuals within those other kinds happen to possess comparable capacities.
  Thus, Jordan''s inference—that the failure of pure capacity proves arbitrariness—does
  not follow.


  Jordan responded that the potentiality defense is just speciesism relabeled: we
  do not grant rights to a potential athlete on the basis of future athletic ability,
  so appealing to the potential of human infants is special pleading. Jordan also
  noted that many nonhuman animals—pigs, crows, elephants—possess cognitive and emotional
  capacities that match or exceed those of some marginal humans, which undermines
