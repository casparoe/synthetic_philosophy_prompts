  of organ procurement or to the timing of withdrawal, the very same speaker describes
  the patient as ''actively dying'' or as being ''in the process of death'', treating
  circulatory arrest as the still-decisive event. The ambiguity between brain-death
  and circulatory-death definitions is, of course, well documented; but what interests
  me is a more specific move. The speaker does not simply hold both definitions available
  for different contexts. Rather, the definition applied to the present physiological
  state seems to shift retrospectively so as to match the moral conclusion that licenses
  the very next clinical step — withdrawal versus maintenance of perfusion — without
  any acknowledgment that the ontological category assigned to the body has changed.
  The physical state is constant; the definition is selected to fit the action.


