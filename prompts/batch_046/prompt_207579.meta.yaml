  In clinical ethics consultations and family conferences concerning patients who
  satisfy neurological criteria for brain death yet remain on mechanical ventilation
  with a beating heart, I have noticed a recurring argumentative pattern for which
  I lack a precise term. A speaker will assert that the patient is ''already dead'',
  framing continued ventilation as mere physiological maintenance rather than life-sustaining
