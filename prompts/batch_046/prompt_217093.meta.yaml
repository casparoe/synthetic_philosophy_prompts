  into two distinct agents within one body, or ask how a single subject can simultaneously
  occupy the roles of deceiver and deceived, the defender shifts ground and reconstrues
  the case in temporal terms: the self at one stage hides evidence from its own future
  stage, or constructs a narrative that a later temporal slice accepts without adequate
  scrutiny. Once that pressure subsides, however, the defender typically reverts to
  speaking in the language of parts, compartments, and simultaneous knowledge, as
  if the partition model had never been abandoned. I have observed this oscillation
  in seminar debates, in journal articles, and in my own attempts to formulate a coherent
  view. Is there an established concept or literature that captures this precise movement
  between simultaneous-partition and diachronic-fragmentation models? If there is
