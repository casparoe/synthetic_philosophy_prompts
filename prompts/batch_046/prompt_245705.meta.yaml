  to map out my own stance on what it implies for self-trusting agents, both human
  and artificial. Here is the package of commitments I have adopted. First, I accept
  that the obstacle is a genuine structural limit, not a technical artifact: a consistent
  formal system extending elementary arithmetic cannot establish its own global soundness
  in the manner that full reflective self-endorsement would require. Second, I take
  this to imply that any agent whose cognition is exhaustively formalized in such
