  an agent may operate with bounded, context-local reliance on its own updates, provided
  this reliance is grounded in empirical track-record monitoring and architectural
  safeguards rather than in a global logical proof. Fourth, I think the obstacle applies
  narrowly to deductive, proof-theoretic reasoning and loses much of its force for
  probabilistic or inductive self-assessment, which means a Bayesian agent could in
