  the motivational center is described as elsewhere: "that was what the old system
  wanted," or "that person was running on different software." Meanwhile, future-directed
  intentions are pulled tightly into the present center''s orbit. So there''s an asymmetry:
  the present self exerts strong gravitational pull backward onto past events (reclassifying
  them as belonging to a different orbital center) but also pulls future intentions
  strongly toward itself, while the past exerts almost no counter-pull.


