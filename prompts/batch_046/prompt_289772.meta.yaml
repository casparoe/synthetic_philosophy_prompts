  I''m working through practical rationality for a paper I''m writing, and I''ve been
  cataloguing my advisor''s judgments in our weekly discussions about whether honoring
  sunk costs can ever be rational. Her record so far is as follows. She holds that
  a homeowner who continues an overpriced kitchen renovation solely because of money
  already spent, with no change in the home''s future value, is acting irrationally.
  She holds that a corporation that completes a manufacturing plant using now-obsolete
  technology, where supplier contracts and labor agreements make stopping more expensive
  than finishing, is acting rationally. She holds that an individual who remains in
  a despised graduate program purely because of years already invested is acting irrationally.
  She holds that a nation that maintains a peacekeeping deployment whose strategic
  value has fallen below its cost, but where withdrawal would violate explicit treaty
  obligations and damage its reliability in other alliances, is acting rationally.
  And she holds that a museum board that tears down a half-completed gallery addition
  after the benefactor''s death and the abandonment of the artistic vision, writing
  off the sunk construction costs, is acting rationally. Next week I will present
  her with a new case: a municipal government must decide whether to finish the second
  phase of a riverfront pedestrian bridge promised in the mayor''s election campaign.
  The first phase is complete and well used, but the second phase connects to a district
  that has since lost population due to factory closures; the remaining cost clearly
  exceeds any projected usage or economic benefit. There are no binding contracts
  requiring completion, and no legal obligation exists, though the half-built pylons
  stand prominently on the waterfront, and the administration has made "finishing
  what we start" a central governing philosophy. I want you to predict whether she
  will judge completing the bridge rational or irrational, to identify the competing
  principles that could consistently explain her five earlier verdicts—perhaps one
  that looks only at forward-looking costs and benefits, and another that treats public
