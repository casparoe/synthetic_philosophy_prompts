  to individuals involves a category error: it treats an epiphenomenon as if it were
  a primary cause.


  Premise 3: Moral and causal responsibility requires that an agent''s choice make
  a non-negligible difference to the outcome for which they are held responsible.


  Premise 4: Therefore, attributing moral significance or causal efficacy to historical
  actors—praising a reformer, blaming a tyrant, or treating a biography as explanatory—is
  not merely incomplete but ontologically mistaken.


  Premise 5: By the same reasoning, any present-day project that presupposes individual
