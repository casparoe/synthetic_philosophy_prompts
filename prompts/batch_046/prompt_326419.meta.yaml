  Marcus objected that this is anachronistic projection. Aristotle possesses neither
  the concept of exchange-value in the Marxist sense nor that of capital as self-expanding
  value. The corruption is not that money mediates exchange for profit, but that acquisition
  becomes autotelic—pursued for its own sake rather than for the good life of the
  household and the polis. Importing Marxist categories, he said, obscures the specifically
  ethical and political point: chrematistike undermines the conditions for virtue
  and citizenship by making unlimited accumulation appear rational.


