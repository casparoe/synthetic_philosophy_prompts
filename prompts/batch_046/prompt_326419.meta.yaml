  sterile reproduce. From this she concluded that once we reject Aristotelian essentialism
  and natural teleology, the argument collapses into a historical curiosity with no
  modern force. She added that contemporary phenomena—automated yield protocols in
  decentralized finance, or central-bank negative-interest regimes—show capital can
