  As a retired evolutionary biologist who has recently begun studying philosophy of
  biology in earnest, I want to test whether the commitments I have accumulated hang
  together consistently. My position is as follows. First, I accept Gould and Lewontin''s
  critique that adaptationist reasoning often falls into ad hoc functional narratives
  unless it actively tests for structural byproducts—spandrels—rather than assuming
  that every apparently functional trait is a direct product of selection. Second,
  I take the original spandrel metaphor literally in its architectural sense: a spandrel
  is an unavoidable geometric byproduct of constructing an adaptive structure, not
  merely any trait that happens to lack present utility. Third, I propose a distinction
  I have been calling developmental spandrels—features that arise inevitably from
  the ontogenetic machinery that builds a genuine adaptation, without themselves being
  targets of selection—as separate from architectural spandrels in the adult form;
  both fall within the broader anti-adaptationist critique, but only the latter are
  spandrels in the strict Gould-Lewontin sense. Fourth, I do not think evolutionary
  psychology is inherently pseudoscientific, but I hold that its reverse-engineering
  of cognitive adaptations is methodologically legitimate only when it can exclude
  both kinds of spandrels using comparative and developmental evidence, which I believe
  it rarely achieves for higher cognition. Fifth, I maintain that natural selection
  is the only mechanism capable of generating intricate functional coordination—such
  as that found in the mammalian eye—yet I also think that many human cognitive capacities,
  abstract mathematical reasoning among them, are better explained as exaptations
