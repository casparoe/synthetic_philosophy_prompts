  the death of each member of the group of five is a separate, complete tragedy, but
  these five tragedies cannot be summed into a single greater harm that competes with
  the death of the lone climber. Because there is no ''aggregate victim'' whose suffering
  outweighs the individual''s, the five do not present a stronger collective claim.
  An impartial agent should therefore flip a fair coin between rescuing the one and
  rescuing the five, treating the options as morally equivalent.


  This line of reasoning depends on a strict separation of persons that mirrors Rawls''s
  rejection of interpersonal utility comparisons in the design of basic institutions.
  Just as Rawls denies that we may sacrifice one person''s liberties for the greater
  social welfare, Taurek denies that we may sacrifice one climber for the greater
  number saved. The parallel is close: both thinkers treat aggregation across individuals
  as a category mistake.


  A prominent objection, developed by Frances Kamm, proposes an ex-ante weighted lottery
  in which every individual receives one ticket, giving the five climbers five entries
  and the lone climber one. This respects equality of moral worth because each person''s
  chance is determined by the same rule. However, Kamm argues that this procedure
  collapses into rule-utilitarianism: over repeated applications, the rule saves more
  lives on average, which is precisely the aggregative reasoning Taurek seeks to avoid.
  Consequently, the lottery fails to preserve his non-aggregative intuition, and the
  fair coin flip remains the only consistent position. One might reply that the ex-ante
  evaluation concerns fairness to each person in the particular case, not long-run
  statistics, but even on that reading the five still possess five times the collective
  probability of rescue, which violates the equal standing Taurek demands."


