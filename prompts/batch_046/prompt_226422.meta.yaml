  "A free-floating rationale is a normative consideration that holds independently
  of any actual or potential agent''s mental states. Unlike motivating reasons, which
  necessarily involve some psychological push, free-floating rationales are supposed
  to exist ''out there'' in the structure of the world. For instance, the fact that
  a certain ecosystem has intrinsic value might be a reason to preserve it even if
  no conscious being ever recognizes that value.


  The motivational-void objection says that without a reasoner to be moved, calling
  something a ''reason'' is just attaching a fancy label to a brute fact. I think
  this misses the point. Normative reasons are not psychological pushes; they are
  considerations that count in favor of actions or attitudes. As Scanlon argues, to
  be a reason is just to be a consideration that supports a particular response, and
  this can be true even in the absence of anyone who actually responds. So the relational
  view, which says reasons require a subject, is too restrictive.


  Still, one might try to save the relational view by appealing to potential reasoners:
  a reason only needs a possible agent, not an actual one. But this just pushes the
  problem back. If the agent is merely possible, then the reason''s existence depends
  on a counterfactual mind, which is still a kind of relational dependence. Therefore,
  the relational view fails.


  However, I think there''s a deeper problem. If rationales truly float free with
  no connection to any mind, actual or possible, then they seem indistinguishable
  from mere causal patterns. The fact that suffering is bad is only a reason if there
  is some standpoint from which it matters. So free-floating rationales either smuggle
  in a potential reasoner or collapse into descriptive facts. Despite this, I defend
  the existence of free-floating normative reasons because well-being is objectively
  valuable, following Parfit''s claim that reasons are ultimately about what is good
  for people, regardless of whether those people exist."


