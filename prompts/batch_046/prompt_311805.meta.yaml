  ---


  I’ve been turning over a chain of reasoning about naturalism in the philosophy of
  medicine—specifically the Boorse-style view that disease is dysfunction relative
  to a species-typical reference class—and it seems to generate a reductio that I
  can’t locate the leak in. I’d like you to act as an expert philosopher of medicine
  with a background in evolutionary biology and conceptual analysis. Before you answer,
  please take a moment to brainstorm the weakest links: check for hidden equivocations
  between statistical normality and functional design, for circular reference-class
  partitioning, and for any slide between descriptive and normative premises. Then
  walk me through the diagnosis step by step.


  Here is the argument:


  (1) On a pure naturalist account, a condition C is a disease if and only if C involves
  a failure of a biologically designed mechanism, where “failure” is measured relative
  to a reference class (same species, sex, and age).


  (2) The lens’s accommodative mechanism is biologically designed to change focal
  distance, but evolutionary selection for this mechanism operates primarily during
  reproductive years.


  (3) Presbyopia—age-related loss of near-focus—is a failure of that mechanism, yet
  it is statistically universal in humans over age 45.


  (4) Because presbyopia is universal in its age-appropriate reference class, it is
  statistically normal for that class; by (1), it is therefore not a disease.


  (5) Alzheimer’s disease involves neuronal dysfunction that is prevalent but not
  universal in humans over 85 (prevalence >30%), and the brain’s mechanisms are also
  under weak post-reproductive selection.


  (6) If the naturalist excludes presbyopia solely because it is statistically normal
  in its reference class, consistency demands excluding Alzheimer’s for the same reason
  whenever it reaches comparable prevalence in an age-stratified class.


  (7) To avoid this, the naturalist might split the reference class into “healthy
  85-year-olds” versus “all 85-year-olds,” but “healthy” is defined by the absence
  of disease, making the move circular.


  (8) Alternatively, the naturalist might appeal to evolutionary design: the lens
  is “meant” only for reproductive-age function, whereas the brain is “meant” for
  lifelong cognition, so Alzheimer’s is a true dysfunction.


  (9) But evolutionary biology does not assign design targets beyond reproductive
  fitness; post-reproductive brain maintenance is not selected for any more strongly
  than post-reproductive lens flexibility.


  (10) Therefore, naturalism either collapses into treating Alzheimer’s as non-diseased
  (absurd) or must invoke a normative judgment about which post-reproductive functions
  are “important” or “central” to human flourishing—thereby abandoning pure descriptivism.


  Which premise should I reject, and what does rejecting it cost? In particular, I
  want to keep (1) and (10) if possible, but I’m open to sacrificing either. If the
  argument is valid, explain whether the cost is borne by Boorse’s statistical reference-class
  view, Wakefield’s harmful-dysfunction analysis, or by normativist rivals such as
  Nordenfelt. If there is a subtle flaw—perhaps an equivocation between “statistical
  normality within a class” and “design failure relative to a functional goal”—pinpoint
  the exact step where the slide occurs and explain why it looked plausible.


  Please do not provide bibliographies or reading lists; I’m working without web access
  and want to see if the reasoning holds up on its own.


