  themselves; the historian''s choice of which documents count as evidence is already
  shaped by narrative interest. More radically, White''s tropological analysis shows
  that emplotment—romance, tragedy, comedy, satire—operates pre-cognitively, so the
  very ''facts'' are constituted within a narrative mode. M is not doing history but
  compiling an unstructured chronicle, which White distinguishes sharply from history
  proper.


  M then accused N of self-refutation: if all historiography is tropologically predetermined,
  then White''s own Metahistory is merely another romantic or satirical narrative
  about historiography, not a structural analysis. Moreover, Carr allows that debate
  among historians can progressively refine interpretation, which presupposes some
  shared empirical ground.


