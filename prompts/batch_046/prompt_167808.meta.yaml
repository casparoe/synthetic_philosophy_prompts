  exceptional circumstances, override a specific role obligation—for instance, shielding
  a father from legal prosecution—without dissolving the relational structure altogether.

  4. Reflective equilibrium applies strictly intra-role: we refine filial piety or
  political duty separately, but we do not weigh them against one another on a single
  metric or common scale.

  5. I also hold that the subordinate position within a role carries an epistemic
  privilege—call it asymmetrical role-knowledge—that gives the child or subject a
  form of moral understanding the parent or ruler cannot fully access. The concept
  of yi (righteousness/propriety) draws on this asymmetry and functions as an internal
  corrective to prevent any single role from becoming totalising.


