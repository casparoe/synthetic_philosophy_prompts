  about how to apply causal theories to a committee vote. The case was this: a five-person
  board must approve a merger. Four members already favor it. The chair, who is also
  in favor, casts the formal deciding vote according to procedural rules, and the
  motion passes. Mira and Jonas disagreed about whether the chair''s vote was genuinely
  causal, and about which theory of causation gets the answer right.


  Mira began by defending a counterfactual-dependence approach. She said that if the
  chair had voted against the motion—while everything else about the meeting remained
  the same—the procedural tie-breaking rule would have produced a different outcome,
  so the chair''s vote made the difference. For her, that counterfactual dependency
  is sufficient for causation, and it correctly identifies the chair''s action as
  a cause.


  Jonas replied that this is exactly the kind of overgeneration that interventionist
  theories, in the tradition of structural causal models, are designed to avoid. On
  his view, you have to specify a causal graph and ask whether an intervention on
  the chair''s vote, holding other direct causes fixed according to the graph, changes
  the outcome. But in this committee structure, the other four members'' preferences
  are direct parents of their own votes, not of the chair''s vote. If you intervene
  only on the chair''s vote—say, flipping it—while holding the other four votes fixed,
  the tally changes, but that doesn''t show the chair''s vote caused the collective
  decision; it only shows the chair''s vote caused the tally. The collective decision,
  Jonas insisted, is caused by the members'' preferences and the institutional rules,
  not by any single vote.


  Mira answered that Jonas is applying the interventionist criterion at the wrong
  level of analysis. She granted that the other members'' preferences are causes of
  their individual votes, but she insisted that the chair''s vote is still a difference-maker
  for the collective outcome. She also pointed out a problem for Jonas: if we hold
  all other variables fixed in the way he suggests, we are implicitly assuming that
  the other members'' preferences are independent of the chair''s authority or rhetoric.
  But in many real committees, members defer to the chair. So the correct structural
  model should include edges from the chair''s disposition to the other members''
