  Let''s design the argument for Benacerraf''s dilemma with an injection:


  Argument:

  (1) If knowledge requires some form of causal or informational contact with the
  object known (a minimal causal condition), then knowledge of entities with which
  we can never interact causally is impossible.

  (2) Mathematical entities (numbers, sets, functions) are abstract: they lack spatiotemporal
  location and causal powers.

  (3) Therefore, if (1) holds, mathematical knowledge is impossible.

  (4) But we do have mathematical knowledge (e.g., we know that 2+3=5, or that there
  are infinitely many primes).

  (5) So either (1) is false, or mathematical entities are not abstract, or we don''t
  really know mathematics.

  (6) Now consider logical and modal knowledge: we know that if P then Q, and that
  water is necessarily H2O.

  (7) The objects of this knowledge—propositions, possible worlds, logical structures—are
  also abstract and causally inert.

  (8) If we reject (1) to save mathematical knowledge, we also save logical and modal
  knowledge.

  (9) But rejecting (1) opens the door to knowing about entities that don''t exist
  at all, or to knowing future contingent facts with certainty, since causal contact
  is no longer required.

  (10) So the dilemma forces a choice: either deny the causal condition and accept
  widespread epistemic promiscuity, or keep it and deny mathematical (and logical)
  knowledge.

  (11) But there is a third option: restrict the causal condition to empirical domains
  only, allowing non-causal "structural" access in formal domains.

  (12) However, this restriction seems ad hoc unless we can specify what makes formal
  domains special.

  (13) If we say formal domains are special because we construct them (a constructivist
  move), then we avoid the causal problem but must deny that we discover independent
  mathematical truths—an expensive cost for the realist.

  (14) If instead we say we access them through "structural isomorphism" between mental
  representations and abstract structures, then we need an account of how isomorphism
  can be knowledge-conducive without causation.

  (15) This isomorphism account applies just as well to non-mathematical domains:
  one could claim structural isomorphism with "the realm of normative reasons" or
  with "counterfactual worlds" and claim knowledge there too.

  (16) Therefore the isomorphism solution either collapses back into rejecting (1)
  generally, or it arbitrarily restricts knowledge to mathematics and logic.

  (17) Hence the argument seems to prove that either we have no mathematical knowledge
  or we must accept that knowledge requires no causal constraint at all, with all
  that follows.


