  the knowledge norm (assert p only if you know p), the truth norm (assert p only
  if p is true), and the belief norm (assert p only if you believe p). Your analysis
  should carefully distinguish knowledge, belief, and truth in this specific scenario;
  it should address whether the division of epistemic labor and reliance on expert
  modeling alter how these norms apply; and it should consider whether a stakes-sensitive
  contextualist account of knowledge—on which the threshold for knowing shifts with
  practical consequences—affects the evaluation of her assertion.


