  2. Disagreement Table (about 250 words): Present at least three precise disagreements
  in table format. For each, provide the wording that Camp A accepts for its own view
  and the wording that Camp B accepts for its own view. The disagreements should cover:
  (a) whether the positive evaluation is directed at the negative affect itself or
  at a distinct object (insight, form, meaning); (b) whether the protective "as-if"
  frame is a necessary condition for positive valuation or merely a facilitating context
  that explains prevalence but not value; (c) how to interpret reports of being "moved"
  or "elevated"—as modified forms of pleasure or as non-hedonic valuations.


  3. Cruxes and Predictive Tests (numbered, about 350 words): Identify at least three
  cruxes—sub-questions such that settling them would move at least one camp. One crux
