  hedonic pleasure with eudaimonic appreciation; sad art is valued not for the negative
  feeling it produces but for the cognitive-moral insight or existential understanding
  it yields, with negative affect serving as an instrumental cue rather than the object
  of positive evaluation.


  Your deliverable should be a document both camps could sign. Structure it exactly
  as follows, with approximate lengths indicated:


