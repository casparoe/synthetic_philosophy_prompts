  about the phenomenon—e.g., that audiences genuinely report positive overall evaluations
  of tragic works; that the elicited negative emotions are phenomenologically real
  rather than feigned; that any adequate explanation must cover both solitary and
  collective reception, and both representational and participatory media. Include
  specifically one agreed claim about how interactive or participatory narratives
  (e.g., video games in which player choice produces an unavoidable tragic outcome)
  complicate both camps'' frameworks without resolving the dispute. Do not cite authors
