  In contemporary value theory, hard choices are often described as cases in which
  options are on a par: neither superior, inferior, nor equal, yet susceptible to
  rational resolution through a volitional commitment that generates new reasons.
  I wish to propose a stricter category, which I call structural orthogonality. On
  this view, two values are not merely incomparable in weight; they are constituted
  by internal norms that are actively corrupted by the very act of weighing them against
  one another. Filial presence, as I understand it, is partly defined by non-instrumental
  attention—by being available without treating that time as an optimizable resource.
