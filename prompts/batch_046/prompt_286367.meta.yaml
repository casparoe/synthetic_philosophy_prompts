  ---


  Design a classroom simulation for a graduate seminar in political philosophy (16
  participants, 90 minutes). The goal is to make participants feel, through structured
  decision-making rather than lecture, why defining corruption by reference to Western-style
  transactional bribery misses the normative architecture of clientelist gift economies
  — and specifically why the same material transfer can be either corruption or legitimate
  reciprocity depending on whether it sits inside an open-ended obligation chain rather
  than a closed quid-pro-quo loop.


  Set up: Divide the group into four "districts" of four people each. Within each
  district, assign roles: one Public Official, one Community Broker, and two Citizens.
  Give each district a shared resource pool of 24 "allocation tokens" and a private
  "social credit" ledger. The Official controls token distribution each round; the
  Broker mediates between Official and Citizens; Citizens hold both formal needs (represented
  by cards: housing, permits, dispute resolution) and informal social ties.


  Rules (three 15-minute rounds):

  Round 1 — Formal Only: Officials must distribute tokens solely according to a printed
  universalist rulebook (need-based, documented, no private interaction). Brokers
  are silent. Citizens may only submit written requests. After distribution, calculate
  "efficiency" (needs met) and "trust" (participants rate perceived fairness 1-5).

  Round 2 — Embedded Reciprocity: Same needs, but now Brokers may facilitate "gift
  exchanges": a Citizen can offer a personal service token (representing labor, loyalty,
  or future support) to the Broker, who may recommend the Citizen to the Official.
  The Official may still use the rulebook but is permitted — not required — to weigh
  Broker recommendations. Crucially, there is no direct token-for-service exchange;
  gifts are recorded in the social credit ledger with no fixed redemption date. After
  distribution, recalculate efficiency and trust, and ask participants whether any
  specific transfer constituted "corruption."

  Round 3 — Closed Loop: Same structure, but now Citizens may offer the Official a
  direct, immediate token exchange for a specific need card (explicit quid pro quo).
  The Broker is bypassed.


  Materials: Role cards, need cards, token chips, social-credit ledgers (paper), a
  "universalist audit sheet" that asks participants to flag each gift/transfer as
  "corrupt / ambiguous / legitimate."


  The activity should run so that Round 1 produces high formal fairness but low efficiency
  and collapsed trust (Brokers and Citizens feel the system ignores relational reality);
  Round 2 produces high efficiency and high trust, but participants cannot agree on
  which transfers were corrupt because obligations are deferred and networked; Round
  3 produces immediate agreement that corruption occurred, but also collapses social
  coordination because Citizens hoard resources and Brokers withdraw.


  Debrief (20 minutes): Map Round 1 onto the universalist framework''s strength (transparency)
  and its blindness to embedded reciprocity. Map Round 2 onto clientelism: show that
  the normative problem is not the presence of gifts but the temporal structure —
  open-ended obligation chains make corruption indistinguishable from legitimate social
  maintenance. Have the group vote on which Round 2 transfers should be audited; the
  disagreement should reveal that Western anti-corruption standards assume a transactional
  closure that clientelist systems deliberately avoid. Map Round 3 onto the "corruption
  everyone can see," and ask why Round 2 feels different even when material flows
  are identical.


  Predictable failures and handling: In Round 2, some participants will try to create
  explicit quid-pro-quo deals despite the rules; the facilitator should allow it but
  record it as a "Round 3 intrusion," then discuss in debrief why participants instinctively
  seek transactional closure. Also, Officials often over-correct in Round 1 and ignore
  all recommendations in Round 2; remind them that the rules permit, not require,
  weighing recommendations.


  Honest limitation: The simulation cannot reproduce the long temporal horizon and
  intergenerational debt that characterize real clientelist obligation chains. Because
  the game lasts only three rounds, participants experience deferred reciprocity as
  ambiguity rather than as a lived normative structure. The facilitator must supply
  this missing dimension verbally: explain that in actual clientelist systems, the
  "gift" is never "repaid" in full but is converted into a permanent, hierarchical
  social bond, which is precisely why it resists both corruption charges and liberal
  individualist accounting.


  What participants should come away seeing: That corruption is not a natural kind
  defined by the presence of private benefit, but a category that depends on a prior
  commitment to transactional closure — and that applying Western universalist standards
  without attending to the temporal and relational architecture of obligation risks
  misclassifying the social infrastructure of non-liberal political economies as mere
  criminality.


