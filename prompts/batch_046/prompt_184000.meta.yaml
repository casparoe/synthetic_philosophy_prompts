  Consider the framework a colleague of mine—call her Dr. V—uses to judge whether
  an individual in a collective should be permitted to act unilaterally when peers
  disagree about the net value of that action. Her verdicts on prior cases:


  1. Three climate modelers can each issue an independent public severity alert. One
  wants "severe"; two want "moderate." Verdict: No unilateral severe alert; coordination
  is required.


  2. One pilot in a two-pilot cockpit judges the plane unsafe; the other wants to
  depart. Verdict: The concerned pilot may ground the flight alone; the other cannot
  override.


  3. Any one of four factory co-owners may install an expensive safety feature that
  eliminates a low-probability catastrophic risk but cuts profits; three think the
  risk negligible. Verdict: Any co-owner may install it unilaterally.


  4. In a five-member ethics committee chartered with veto rights, one member may
  block publication they deem harmful, despite four approvals. Verdict: The unilateral
  veto stands.


  5. A researcher in a large collaboration may not independently publish a correction
  to shared data that she alone believes erroneous, despite majority confidence. Verdict:
  Collective authorization is required.


  Dr. V is now advising a distributed AI governance board of six technically equal
  members. One member wants to unilaterally suspend an algorithm''s rollout, believing
  it poses a speculative but potentially catastrophic misalignment risk; the other
  five judge the risk negligible. The board''s charter is silent on individual suspension
  rights. A false suspension delays a beneficial medical-diagnostic rollout by six
  months; a false negative is existential but unquantified. Predict Dr. V''s verdict,
  identify whether she is running an asymmetric-risk rule (allow unilateral protective
  action when false-negative costs dwarf false-positive costs), an institutional-mandate
  rule (action permitted only when a specific role or charter grants it), a peer-calibration
  rule (equal experts should defer to the majority), or another principle entirely.
  State which prior case is the closest analog, explain what principle she would be
  adopting either way, and name the further case that would best distinguish the rules.
  Give a committed answer with reasons. Respond in no more than 300 words, in continuous
  prose.


