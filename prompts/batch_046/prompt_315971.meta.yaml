  or psychology, but a hidden disagreement about the logical structure of ''meaning''
  itself—specifically, whether the concept functions as a first-order predicate applied
  to life-projects or as a second-order predicate applied to the relation between
  an agent''s evaluative framework and those projects. The absurdist, on this reading,
  is not denying that projects have value and fulfillment; she is denying that there
  is any coherent second-order property that binds them together into a single judgment
  of ''meaningfulness'' without smuggling in a transcendent frame that the modern
  condition has dissolved. The objectivist, by contrast, treats ''meaning'' as a first-order
  property that supervenes on the conjunction of objective value and subjective engagement.


