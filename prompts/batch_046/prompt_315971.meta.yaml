  The stall is strange: both sides seem to concede that human lives contain projects
  of deep subjective investment and that those projects can be evaluated for objective
  worth. Yet the absurdist insists that this combination still fails to yield ''meaning,''
  while the objectivist insists it succeeds, and neither side seems able to move the
  other with further examples or refinements of the conditions.


