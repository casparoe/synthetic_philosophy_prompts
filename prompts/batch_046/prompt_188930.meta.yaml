  annihilation possible.


  Dr. Chen replied that Bauman''s thesis was never that modern bureaucracy produces
  interchangeable genocides. Rather, Bauman showed how modern organizational forms
  could be harnessed to an unprecedented ideological goal: the total annihilation
  of a population defined as lacking any instrumental value. Comparing the Holocaust
  to colonial violence—say, the Belgian Congo—therefore misleads, because colonial
  killing served extractive ends in which victims retained economic utility, whereas
  the Holocaust''s organizational goal was killing itself. He noted that within the
  Historikerstreit, attempts to analogize the Holocaust to Stalinist crimes were criticized
