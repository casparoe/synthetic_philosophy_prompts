  that do not follow, and explain exactly why each error matters for understanding
  the two philosophers. Do not signal your own philosophical agreement or disagreement
  with either Mencius or Xunzi; your job is only to evaluate the student''s grasp
  of the material. Do not provide a correct version of the answer in place of grading
