  invented by sages not to transform people but to restrain them through external
  rules and punishment, much like Legalist law. Because nature is empty of moral content,
  isolation makes morality impossible for Xunzi, whereas for Mencius an isolated hermit
  could still cultivate full virtue alone since nothing external needs to be added.


