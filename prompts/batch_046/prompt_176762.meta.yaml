  Mencius believes human nature is good because people are born with four fully formed
  virtues—compassion, shame, deference, and a sense of right and wrong—that only need
  to be protected from corruption. He compares them to sprouts that grow into trees
  if they are not cut down, which shows that moral development is mainly a negative
  process of removing obstacles. Ritual and study help, but they are secondary because
  the virtues are already complete inside.


