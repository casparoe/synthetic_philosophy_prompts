  My friend and I have just concluded a long argument about what, if anything, we
  owe to real dead people when we dramatise them in historical fiction and biopics.
  She defends a position we might call fiduciary narrative humility: the claim that
  a dramatist stands in something like a trustee relation to the dead, obliged to
  avoid inventing decisive interior moments or counterfactual dialogue that would
  violate the subject’s documented self-conception, particularly when the work is
  presented as based on real events. I defend an opposing view—call it presentist
  aesthetic autonomy—which holds that art is addressed exclusively to the living,
  that the dead possess neither rights nor interests capable of being harmed, and
  that treating dramatisation as ethically answerable to its subjects confuses aesthetic
  construction with historical testimony. Despite our disagreement, we both think
  the dispute turns partly on whether there is a coherent category of narrative expropriation—the
  appropriation of a real life as artistic raw material in ways that disregard the
  subject’s own counterfactual testimonial consent, that is, whether they would endorse
  not merely being depicted but being assigned the specific narrative arc and interiority
  the work imposes, were they fully informed and capable of judgment. We wish to treat
  our disagreement as an adversarial collaboration. Please draft the joint statement
  we might both sign.


  The document should contain four parts. First, a numbered section of agreed claims—formulations
  about the formal structure of dramatisation (selection, compression, temporal rearrangement,
  invention of dialogue), about the distinction between representational harm to living
  relatives and allocative harm to cultural memory, and about the relevance but non-decisiveness
  of the public-versus-private-figure distinction—that both sides can accept without
  slant. Second, a disagreements table setting out, for each crux, the precise wording
  each camp accepts for its own position: specifically (a) whether the dead have interests
  that can be violated; (b) whether counterfactual testimonial consent carries normative
  weight in evaluating a dramatisation; (c) whether narrative expropriation is a distinct
  moral category or merely a rhetorical dressing for ordinary misrepresentation; and
  (d) whether artistic autonomy can ever justify the deliberate invention of a documented-decision
  scene for dramatic effect. Third, a section identifying the cruxes—sub-questions
  such that settling them would move at least one of us—including whether audience
  confusion between invented interiority and documented biography undermines aesthetic
  autonomy, and whether imposing narrative constraints eliminates artistic value altogether.
  Fourth, a predictive-register section listing at least two concrete cases or arguments
  both sides agree would bear on the cruxes, with each side’s predicted outcome recorded
  in advance: for example, a biopic that invents a private reconciliation never attested
  in the record but consonant with the subject’s documented values, and a work that
  explicitly signals its fictional status yet uses the subject’s real name and biographical
  trajectory. Where the residual disagreement is partly verbal—particularly around
