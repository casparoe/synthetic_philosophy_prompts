  The argument proceeds as follows:


  (1) The KK principle holds without restriction: for any subject S and any proposition
  p, if S knows p, then S knows that S knows p.

  (2) By straightforward iteration, if S knows p, then for every finite n, S knows
  that S knows ... (n times) ... that p.

  (3) Luminosity, or epistemic transparency, entails that knowing p puts S in a position
  to access the epistemic status of p, at least under conditions of rational reflection.

  (4) Human cognition is finitely bounded; no subject can simultaneously represent
  or access an infinite hierarchy of iterated knowledge states in working memory or
