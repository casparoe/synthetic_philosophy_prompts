  and epistemology, particularly regarding moral motivation and belief. For example,
  in ethics, the problem is that moral reasons are the right kind of reasons for acting
  morally, but self-interested reasons (avoiding punishment) are the wrong kind. In
  epistemology, evidential reasons are the right kind for belief, but pragmatic reasons
  (it would be useful to believe) are the wrong kind.


