  Commitments:


  1. I hold that for belief, only evidential considerations are right-kind reasons,
  and pragmatic considerations—e.g., that believing P will improve mental health—are
  always wrong-kind and cannot justify belief even pro tanto.

  2. I hold that the same structure applies to admiration: only merit-related features
  are right-kind, and self-interested benefits are wrong-kind.

  3. I hold that wrong-kind reasons must be excluded entirely from the rational audit
  of an attitude; if an attitude is supported solely by them, it is not merely unjustified
  but rationally defective.

  4. I hold that a wrong-kind reason can nonetheless play a legitimate causal role
  in initiating an attitude that is subsequently sustained by right-kind reasons,
  and in such cases the attitude is fully rational and its origin does not taint it.

  5. I hold that in Parfit''s hitchhiker case, one should pay the driver upon arrival,
  and the reason is purely decision-theoretic—grounded in the correlation with the
  driver''s prediction—rather than a moral obligation.

  6. I hold that the distinction derives from the constitutive norms of each attitude:
  belief aims at truth, admiration at merit, and moral action aims at rightness; there
  is no further metaphysical fact about "kinds" of reasons.


  Now, tensions:


  Apparent tension that dissolves: Between (3) and (4). One might think that if wrong-kind
  reasons are excluded from rational audit entirely (3), then allowing them a causal
  role in initiating a rational attitude (4) violates that exclusion. But actually
  (3) concerns justification, while (4) concerns etiology; they operate in different
  registers, so there is no contradiction—though it requires keeping justification
  and causation distinct.


