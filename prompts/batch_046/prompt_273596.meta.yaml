  Design a 75-minute classroom activity for an upper-level political philosophy seminar
  of about 14 graduate students on the democratic boundary problem—specifically, the
  circularity of defining "the demos" when the authority to draw that boundary must
  itself be democratically legitimate. The goal is not to lecture about Schmitter,
  Dahl, or standard citizenship theory, but to make students feel the paradox themselves
  before naming it. Invent a structured role-play called "The Constituent Convention"
  with these features: the group is split into "Insiders" (who initially hold decision
  power over a concrete resource allocation) and "Claimants" (each holding a card
  describing a different relation to the affected territory—e.g., seasonal laborer,
  unborn descendant represented by a proxy, ecosystem steward, non-citizen long-term
  resident, AI-mediated collective). The Insiders must agree on a single, explicit
  criterion for membership that determines which Claimants are admitted to vote on
  the allocation. Once they publish their rule, the Claimants apply it recursively
  to challenge the Insiders'' own standing: if the criterion excludes anyone affected,
  it excludes some Insiders; if it includes all affected, it dissolves the boundary
  entirely. Include a simple payoff structure—Insiders lose "legitimacy points" for
  every exclusion they cannot justify using their own rule, Claimants gain "voice
  points" for each successful recursive challenge—but keep stakes symbolic (tokens,
  not real money). Provide a timeline with specific phases (silent drafting, publication,
  recursive challenge, forced revision or collapse), rules for speaking order, and
  materials needed. Then provide a debrief that maps each phase onto the conceptual
  problem: the arbitrary starting point, the appeal to affected interests, the self-application
  failure, and the cost of fixing the boundary by fiat. Be explicit about what the
  activity cannot reproduce—e.g., the historical violence of actual boundary-drawing
  or the full normative weight of sovereignty—and say how the facilitator must supply
  that. Write in American English. Do not ask for bibliographies or citations, and
  do not refer to obscure texts students could not know.


