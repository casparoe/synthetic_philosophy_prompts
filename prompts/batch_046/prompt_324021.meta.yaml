  As a doctoral researcher in formal epistemology and the philosophy of logic, I am
  preparing a fellowship application for a six-month project on reflective consistency
  in rational agents. Rather than rehearsing the familiar result that a sufficiently
  strong formal system cannot prove its own consistency—what is usually called the
  Löbian obstacle—I want to investigate a more specific and under-explored framing.
  I propose to treat the obstacle not merely as a barrier to global self-trust, but
  as a tension between two dimensions of epistemic authority: vertical authority (an
  agent''s trust in its own future reasoning steps) and horizontal authority (trust
  delegated to embedded sub-agents or peer processes). My working hypothesis is that
  an agent might resolve this tension through a partitioned trust policy: granting
  vertical authority over empirical or contingent reasoning while systematically withholding
  it from logical and consistency-related reasoning. The central research question
  is whether such a boundary can be drawn in a formally coherent way for a Löb-capable
  agent, or whether any attempt to maintain the partition collapses back into either
  unrestricted reflective acceptance or global epistemic scepticism.


  Please turn this into a concise two-page research proposal suitable for a philosophy
  fellowship panel. The proposal must contain: (i) a precise statement of the research
  question and why it is distinct from the standard presentation of the Löbian obstacle;
  (ii) an account of why existing treatments—whether in mathematical logic, philosophy
  of science, or theoretical discussions of AI alignment—leave this partition question
  unsettled; (iii) a month-by-month method describing what I would actually do, including
