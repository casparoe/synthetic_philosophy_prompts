  than resolved by staff. It must preserve the core conceptual distinctions—between
  remembering as an ethical duty to specific victims and remembering as collective
  identity-building, and between forgetting as moral failure and forgetting as a condition
  for present justice—without requiring staff to read the original texts.


  Then apply the procedure to three proposals, in writing:


  1. A citizens'' group proposes a heroic bronze monument in the central square to
  leaders of a 1930s labor strike that involved violent suppression by local authorities;
  the archival record is fragmentary and contested, descendants of both sides remain
  active in the neighborhood, and the group demands a permanent, unqualified commemoration.


