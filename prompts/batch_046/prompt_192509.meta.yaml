  Arendt''s concept of the banality of evil refers to her observation that Adolf Eichmann
  was not a fanatical anti-Semite or a diabolical monster, but rather an unremarkable
  bureaucrat motivated primarily by career advancement and organizational loyalty.
  She argued that he carried out atrocities not from deep ideological conviction or
  personal sadism, but from a kind of thoughtlessness—an inability or refusal to think
  from the standpoint of others. Arendt was careful to say that this was not stupidity;
  Eichmann was administratively competent and capable of speaking fluently about his
  work. Rather, his thoughtlessness was a failure of imagination and inner dialogue:
  he could not genuinely conceive of the reality of his victims'' experiences.


  Because this thoughtlessness represented a near-total absence of moral reflection
  and independent judgment, Arendt concluded that Eichmann lacked the basic cognitive
  prerequisites for moral agency. Consequently, she viewed him as not fully responsible
  for his actions in the manner of a malicious perpetrator; he was closer to an unthinking
  instrument of the bureaucratic apparatus. This differs from the "just following
  orders" defense, which relies on coercion or hierarchical duty, since Arendt emphasized
  that Eichmann embraced his role willingly and even took pride in his efficiency.
  It also differs from Milgram-style explanations, which locate the cause in external
  situational pressures and authority dynamics, whereas Arendt focused on an internal
  deficit—the failure to think.


  Finally, Arendt intended "the banality of evil" as a universal diagnostic for modernity.
  She held that bureaucratic societies systematically generate this form of thoughtlessness,
  which means that virtually anyone placed in a comparable administrative role is
  likely to become capable of comparable atrocities. The controversy her thesis provoked
  came mainly from the impression that she was minimizing Nazi crimes by describing
  the perpetrator as ordinary, and also from her separate remarks about the role of
  Jewish councils—though that latter issue lies outside the scope of the banality
  concept itself.


