  with an infinite model has a countable model, even though within that model there
  exist sets that the model itself regards as uncountable. Among the mathematicians
  and philosophers my character encounters, the dispute has calcified into two immovable
  camps. One camp, which I might call the syntactic relativists, holds that cardinality
  is inherently model-relative and that first-order logic''s inability to pin down
  an absolute notion of size is not a defect but a feature of formalization. The opposing
  camp, the ontological absolutists, maintains that if set theory is genuinely about
  a hierarchical universe containing uncountably many objects, then the existence
  of a countable model in which those same objects are enumerated is not a benign
  technicality but a direct contradiction of the theory''s intended meaning. For decades,
  these groups have circulated the same meta-theoretic proofs and the same appeals
