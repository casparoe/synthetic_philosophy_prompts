  Prompt text (British English, formal, from university student perspective, 1-3 paragraphs):


  "I''m currently taking a course on the philosophy of art and have become particularly
  interested in the debate over aesthetic testimony—whether we can genuinely acquire
  aesthetic knowledge or justified belief through the word of others, or whether direct
  experience is always required. In our seminars, several students (and indeed some
  of the texts we''ve discussed) keep reaching for the analogy that judging art is
  like tasting wine: just as you cannot know whether you will enjoy a particular vintage
  merely by reading a sommelier''s notes, so too you cannot grasp the aesthetic value
  of a painting or a symphony through someone else''s description. The analogy is
  used to license a fairly strong anti-testimony conclusion—that second-hand reports
  are at best heuristic prompts to seek first-hand experience, and at worst a kind
  of aesthetic self-deception. I would like to press this analogy properly rather
  than simply accept or reject it."


  Then ask for the mapping table, breaks, and whether the conclusion survives. Also
  inject the niche idea: algorithmic recommendations.


  "I am especially curious whether the analogy holds up once we introduce a slightly
