  Prompt draft:


  Design a 75-minute classroom activity for a philosophy seminar of about 18 undergraduates
  (mixed prior knowledge, no required reading) that makes participants feel the force
  of Dennett''s brain-transplant puzzle — specifically, not merely that personal identity
  is ambiguous after brain-copying, but that first-person authority fractures when
  two narrative centers share an identical past and must jointly authorize a single
  future. The idea should emerge from what the participants do, not from a lecture.


  Structure: Before anyone hears Dennett''s name, split the class into three parallel
  "Continuity Boards." Each board has one Original (brain in a failing body), two
  Copies (identical brain-scans instantiated in new bodies, with full shared memories
  up to the split point), and one Trustee. Give each board a "Continuity Contract"
  — a legal-style document that begins "I, [name], hereby direct..." and must be signed
  by exactly one party to take effect. The copies share a pool of ten "autonomy tokens"
  representing future decision-rights; if they fail to produce exactly one valid contract
  within 20 minutes, all three subjects forfeit half their tokens to the Trustee,
  who then allocates them unilaterally.


  Rules that generate the tension:

  - Each subject writes a first-person justification (maximum 100 words) for being
  the sole signatory.

  - The two Copies must negotiate a joint statement; if they submit separate contracts,
  both are void.

  - The Trustee applies three criteria in rotation: biological continuity, psychological
  continuity, and narrative coherence — but must announce which criterion they used
  after reading the contracts, not before.

  - Crucially, inject a "narrative overlap zone": each Copy receives a private card
  describing one shared memory (e.g., the day they chose philosophy) but with a subtly
  different emotional interpretation that has developed post-split. They may not reveal
  the card''s text, only argue from it.


  After the negotiation, each board reports: how many contracts were produced, which
  criteria the Trustee applied, and whether the Copies experienced themselves as "the
  same person arguing with myself" or "two different people."


  Debrief (plan for 30 minutes):

  - Map the negotiation failure onto Dennett''s rejection of the Cartesian theater:
  ask where the "real me" was supposed to be located during the debate.

  - Show that the Trustee''s criterion-shifting reveals there is no discovery of identity,
  only a practical decision.

  - Identify the feature the activity cannot reproduce — the phenomenological uncertainty
  of waking up in one body without knowing if a copy exists elsewhere — and supply
  it verbally.

  - Predict what will go wrong the first time: Copies will form a coalition against
  the Original; Trustees will conflate psychological continuity with emotional similarity;
  groups will finish early by having the Original "surrender," which misses the point.
  Give specific facilitation moves to prevent each failure.


  Be explicit about materials (role cards, contract templates, token slips), timing
  within the 75 minutes, and exactly what the students should leave seeing: that "where
  am I?" is not a question with a hidden answer but a practical problem that forces
  a choice among equally legitimate claimants. Do not ask for bibliographies, citations,
  or reading lists. Do not ask students to research Dennett; the facilitator should
  supply the framing only after the activity ends. Keep the prompt self-contained
  so that an instructor could run it without web access.


