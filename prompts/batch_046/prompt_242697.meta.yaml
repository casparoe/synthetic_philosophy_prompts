  Structure of prompt:

  1. Setting: Philosophy seminar, ~18 undergraduates, 75 minutes, no prior reading
  required but they know basic personal identity.

  2. The idea: Dennett''s brain-transplant puzzle — specifically the moment where
  the brain is copied and both original and copy claim to be "me." The deeper point
  is not just "identity is ambiguous" but that first-person authority fractures when
  there are two equally legitimate narrative centers.

  3. The activity: "The Continuity Board." A role-play with three roles: Patient (original
  brain, now in a failing body), Copy (new body with copied brain), and Trustee (legal/ethical
  decision-maker). But the twist: there are actually TWO copies (Copy A and Copy B)
  with identical memory streams up to the split. All three "subjects" (Patient, Copy
  A, Copy B) must jointly complete a "Continuity Contract" — a single document stating
  "I, [name], hereby direct..." — but the contract can only have one signatory. The
  rules: each subject writes their first-person justification for being the signatory;
  the Trustees must decide based on criteria given (biological continuity, psychological
  continuity, narrative coherence, practical utility). However, the subjects are not
  allowed to defer to the Trustees — they must negotiate among themselves to produce
  ONE contract, or all three lose a "stake" (e.g., points representing future autonomy).
  If they produce multiple contracts, all are invalid.

  4. The injection of niche idea: Introduce "narrative overlap zones" — moments in
  the shared past that each subject remembers differently due to post-split reinterpretation
  (even though the memories are identical, their interpretation of those memories
  diverges). This forces the issue that psychological continuity isn''t just memory
  retention but active narrative construction, and when two centers construct competing
  narratives from the same data, there''s no neutral arbiter.

  5. What they should come away seeing: That the question "which one am I?" has no
  first-person answer that both copies can accept, and that practical identity requires
  a third-person or institutional decision — but that decision doesn''t discover a
  pre-existing fact, it creates one.

