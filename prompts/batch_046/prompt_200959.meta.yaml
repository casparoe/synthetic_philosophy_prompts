  inner states from outward behavior alone, but now we can observe analogous neural
  mechanisms—say, mirror-neuron activation and global workspace dynamics—directly
  in others via fMRI and EEG. He claimed this transforms the argument from behavioral
  analogy to mechanistic analogy: if I know from the inside that a particular pattern
  of prefrontal-parietal coupling accompanies conscious decision in me, and I observe
  the same coupling in you, I have direct analogical grounds for attributing consciousness
  to you, not mere behaviorist guesswork. Sofia replied that this just relocates the
  gap rather than closing it: seeing that your brain lights up in region R tells me
  that a causal process is running, but it gives me no first-person access to whether
  that process is accompanied by subjective experience for you. She said Ravi was
  sliding from ''same mechanism'' to ''same phenomenology'' without justification,
  committing the very fallacy Hume warned against—projecting the familiar onto the
  unknown. Ravi came back that Sofia was presupposing an implausible dualism: on any
  plausible functionalist or embodied-cognitive view, the mechanism running with the
  right organizational properties just is the mental state, so observing the mechanism
