  Here is my package of views:


  (1) I accept Nozick''s tracking conditions—truth, belief, sensitivity, and adherence—as
  jointly necessary and sufficient for knowledge of empirical propositions, with no
  hidden contextual parameters in the conditions themselves.


  (2) I deny unrestricted epistemic closure: knowing that p does not automatically
  transmit to every proposition q entailed by p, particularly when q involves skeptical
  hypotheses that lie outside the modal neighborhood of p.


  (3) Nevertheless, I defend a restricted closure principle: within a single "evaluation
  domain" (the set of worlds that are relevant alternatives given the subject''s practical
  and conversational stakes), if p entails q and both belong to that domain, then
  knowing p yields knowing q.


