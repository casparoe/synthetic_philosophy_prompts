  Both sides agree that experience is causally and psychologically continuous. Yet
  the reductionist concludes that this is all there is to say about identity, while
  the Buddhist concludes that something profound has been missed—namely, that the
  very grammar of "I am" or "this is mine" perpetuates dukkha in a way that descriptive
