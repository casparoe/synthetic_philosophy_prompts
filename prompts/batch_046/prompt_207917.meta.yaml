  that a perfect lawgiver ought not to preserve a cruel or primitive custom, the interpreter
  invokes the accommodative story: the commandment was a concession to historical
  limitation. When, conversely, someone objects that a divine command must have rational
  justification beyond mere accommodation, the same interpreter invokes the teleological
  story: sacrifice serves an irreplaceable pedagogical and spiritual function. The
