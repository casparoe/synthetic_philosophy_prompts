  On one reading, it is an accommodative measure: the Israelites, having been immersed
  in pagan cultic practice, could not be expected to abandon ritual slaughter entirely,
  so the law channels this habit towards the worship of the one God. On another reading,
  sacrifice possesses an intrinsic rational purpose: it disciplines the imagination,
  directs attention away from corporeal representations of the divine, and cultivates
  a specific form of reverence. These two explanations are not merely different emphases;
  they carry different philosophical commitments about whether divine law can prescribe
  practices that have no value in themselves.


