  Design a 90-minute classroom activity for an upper-level philosophy seminar of about
  14 students on Parfit''s hitchhiker scenario and the problem of rational irrationality.
  The students should come away feeling, in their own choices, why it can be rational
  to commit in advance to an action that will be irrational to carry out, and specifically
  why that rationality depends on the structure of belief transmission rather than
  on brute will.


  To avoid the familiar one-driver/one-hitchhiker setup that students may have encountered,
  inject the following niche framing: organize the students into a chain of four roles—Promisor,
  Relay A, Relay B, and Executor—arranged so that the Promisor seals a commitment
  token (representing the promise to take an irrational action) inside an envelope
  that passes through Relay A and Relay B before reaching the Executor. Each relay
  receives only a partial, non-transferable signal: Relay A knows whether the envelope
  was sealed but does not know its contents; Relay B knows that Relay A received something
  but cannot verify what Relay A knows; the Executor sees only the final envelope
  and must decide whether to honor the commitment and forfeit points. The group shares
  a collective payoff pool: if the Executor honors the commitment, the group gains
  a modest reward, but the Executor personally loses a larger amount. Before the chain
  begins, the Promisor can choose to make the commitment credible by depositing a
  personal "stake" that is lost if the commitment is not honored. The rules should
  be arranged so that the Executor faces a genuine decision point where honoring the
  promise is personally costly and seems irrational from an ex post perspective, yet
  the group has reason to want it honored.


  Provide: the precise rules and turn order; the roles and what each knows; the payoff
  scheme using non-monetary points or privileges; a timeline for the 90 minutes including
  a silent writing period before the chain begins; the debrief questions that map
  each stage onto the ex ante / ex post distinction and onto the problem of belief
  transmission; an honest note on which feature of rational irrationality the relay
  structure cannot reproduce and must be supplied by the facilitator; and a prediction
  of what will go wrong the first time this is run (for example, students resolving
  ambiguity by talking out of role) and how to prevent it. Do not ask for readings,
  citations, or a bibliography. Also include a brief note on how confident you are
  in the design and identify the specific point about belief transmission in the relay
  that you are least certain will land correctly with students.


