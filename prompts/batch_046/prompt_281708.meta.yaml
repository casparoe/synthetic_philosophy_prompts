  Wittgenstein''s On Certainty is often read as offering a therapy for radical skepticism:
  we do not need to justify our belief in the external world because such beliefs
  are not ordinary empirical hypotheses but "hinge" propositions that form the fixed
  framework within which justification operates. On this standard reading, hinges
