  but because abandoning it does not open up a space for better evidence; it collapses
  the space of evidence altogether. The challenge for this view is explaining why
  hinge commitments can still be subject to gradual revision—why, for instance, shifts
  in scientific paradigm can eventually reconfigure what counts as a reliable instrument—without
  reducing them to ordinary revisable beliefs.


