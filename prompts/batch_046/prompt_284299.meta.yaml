  makes Aunt Hillary a candidate mind is not merely distributed computation but a
  specific recursive capacity: the colony can represent its own organizational state
  to itself, including states that are not currently actual. The research question,
  then, is whether real ant colonies instantiate this counterfactual self-modeling
  or whether they only exhibit reactive, parallel distributed processing without a
  unified representational frame. Existing positions leave this open because ethologists
  document impressive collective decision-making but rarely ask whether the colony
  represents alternatives to its present configuration, and philosophers debate collective
  intentionality without specifying whether it requires counterfactual representation
