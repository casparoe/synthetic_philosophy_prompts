  I''m auditing a graduate seminar on the philosophy of skill, and a fellow student—let''s
  call her Dr. L—has staked out a consistent but puzzling position on knowing-how
  versus knowing-that across the examples we''ve workshopped. I want to predict how
  she''ll rule on a new case, but I''m less interested in her answer than in the competing
  principles that could generate her track record, where they split, and what further
  example would adjudicate between them.


  Her verdicts so far are these. First, she holds that a concert pianist who lost
  both arms in an accident and now performs via a myoelectric shoulder-to-finger interface—after
  five years she plays with full dynamic expression, reports that she "feels the phrase
  in her shoulders," yet cannot map her muscle patterns onto conventional fingerings—knows
  how to play piano, not merely that certain notes correspond to certain movements.
  Second, she says a music theorist who can notate every harmonic progression and
  direct an orchestra from the podium, but who has never produced a sound on an instrument
  and describes performance as "like watching a proof unfold," knows that but not
  how. Third, regarding a sommelier with congenital anosmia who identifies wines solely
  by matching chromatography reports to memorized chemical-flavor tables—scoring perfectly
  on blind tests but describing the task as "solving a crossword, not tasting"—Dr.
  L insists she knows that, lacking the relevant know-how entirely. Fourth, she maintains
  that a surgeon who, after thirty-six hours without sleep, performs a routine laparoscopic
  procedure with flawless technique yet retains no episodic memory of the operation
  and can describe none of its steps afterward, nevertheless knew how in that moment,
  because the skill was manifest in her hands even when propositional access was absent.


  Now consider a new case we''ve not discussed: a cognitive neuroscientist has developed
  an auditory substitution headset for people without smell. After a year of training,
  a user can identify wines with expert accuracy by listening to tonal patterns that
  encode chemical signatures; she reports that she "hears the terroir directly," can
