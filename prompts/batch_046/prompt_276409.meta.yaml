  After a long argument with a friend about source criticism and what we can actually
  claim to know about the distant past—spanning Herodotean inquiry to modern archival
  methods—I want to test whether her judgments cohere around a single principle. Here
  is her track record on six cases.


  First, on a ninth-century battle attested solely by a monastery chronicle composed
  a century later, with no archaeological trace, she insists we have no knowledge
  that it occurred. Second, on the existence of a fifth-century settlement supported
  by carbon-dated ruins and one tax register, she grants approximate knowledge. Third,
  regarding an emperor''s private resentment inferred only from a court panegyric
  written fifty years after his death, she denies we can know his motives. Fourth,
  on regional population trends drawn from settlement-pattern archaeology together
  with a single census tablet, she accepts approximate quantitative knowledge. Fifth,
  on a council''s general position reconstructed from three independent attendee letters,
  but with precise wording surviving only in one secretary''s notes later edited for
  publication, she says we know the gist but not the verbatim formulation. Sixth,
  on a widespread famine mentioned in three chronicles from kingdoms with opposing
  political interests, each composed within a decade, she says we know it happened.


  Now consider a new case. The claim is that in 842 a specific tax exemption was granted
  to a particular monastery, mentioned only in the original charter preserved in the
  monastery''s own archive, with no other textual reference anywhere. However, the
  monastery''s lands subsequently show no tax-related boundary adjustments in later
  cadastral surveys, whereas neighboring estates consistently show such adjustments—a
  pattern she herself treats as meaningful negative archival space rather than mere
  absence of record.


  Predict her verdict: does she grant that we know the exemption was granted? Then
  identify the implicit rule she is running—whether it is an independence-threshold
  rule requiring at least two distinct evidential streams for any specific claim;
  a proximity-and-bias rule that privileges direct, unmediated primary sources regardless
  of singularity; or a granularity-matching rule that permits knowledge when the level
  of mediation suits the claim''s coarseness. Give your best guess at which rule governs
  her judgments, with the reason for preferring it over the others that also fit the
  six cases. Finally, propose one further hypothetical case that would decisively
  separate the rule you think is correct from its closest rival.


