  As part of my grading duties for the graduate seminar on intergenerational ethics
  and population philosophy, I have received the following student response to an
  exam question. I am asking you to assess it on my behalf.


  Exam question:

  Consider a variant of the nonidentity problem arising in long-term climate governance.
  In 2025 a legislature can adopt either Framework X or Framework Y. Framework X permits
  moderate emissions; it will cause specific future persons—the X-cohort—to come into
  existence in 2150 with lives that are, on the whole, well worth living, though they
  suffer climate-related disruptions and live in a world where Stoic philosophy is
  culturally dominant, shaping how they interpret those disruptions. Framework Y imposes
  drastic emissions cuts; it will cause a different set of future persons—the Y-cohort—to
  come into existence, also with lives well worth living, with fewer disruptions,
  and in a world where Stoicism is not dominant. The X-cohort will number approximately
  ten billion; the Y-cohort approximately eight billion, owing to differential demographic
  trajectories. A critic argues that Framework X wrongs the X-cohort because it subjects
  them to climate harms that Framework Y would have avoided.


  Explain why this charge of wronging appears to fail in light of the nonidentity
  problem. Then evaluate the "branch-relative aggregate" reply: the view that, even
  if no particular individual is made worse off, we should sum total well-being across
  all individuals within each possible branch (X-branch versus Y-branch) and prefer
  the branch with the higher aggregate, regardless of identity differences. Is this
  reply a genuine escape from the problem, or does it merely relocate the difficulty?


  Student answer:

  The charge of wronging the X-cohort fails because of the non-identity logic that
  Parfit develops in Reasons and Persons. If Framework X is adopted, the X-cohort
  comes to exist with lives worth living. Had Framework Y been adopted, those exact
  individuals would never have existed; the Y-cohort would exist instead. For any
  particular X-person, the alternative to existing under Framework X is not existing
  under Framework Y with fewer disruptions, but rather not existing at all. Since
  existence with a life worth living is not worse than non-existence, Framework X
  does not make any X-person worse off in the comparative sense required for harm.
  Therefore, there is no victim to be wronged.


  As for the branch-relative aggregate reply, this is essentially the impersonal total-view
  that Parfit favors for same-number choices. We compare the total well-being in the
  X-branch—ten billion people with moderate well-being—against the total in the Y-branch—eight
  billion people with high well-being. Even though the identities differ, the branch-relative
  comparison allows us to ask which world contains more well-being overall. Because
  the X-branch contains more people, the aggregate might actually be higher despite
  lower individual well-being, which means the reply does not automatically favor
  Framework Y. However, this reply fails to escape the nonidentity problem because
  it requires us to count well-being across individuals who never coexist. Once we
  allow cross-branch aggregation, we are implicitly treating the X-cohort and Y-cohort
  as if they occupy the same moral space, which reintroduces the very identity-dependence
  the problem highlights. In particular, the reply assumes that bringing the Y-cohort
  into existence is a moral gain that can be weighed against the X-cohort''s existence,
  but since neither cohort exists in the other branch, there is no common metric of
  comparison. Thus the reply relocates rather than resolves the difficulty.


