  letter addressed to Menoeceus. He asks us to reflect on the eternity that passed
  before our birth. We do not regard that pre-natal period as an evil, despite its
  being a state of non-existence. By symmetry, we should not regard the post-mortem
  state as an evil either. The argument suggests that our fear of death is irrational
