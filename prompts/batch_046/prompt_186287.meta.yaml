  criteria of good and bad. From this, Epicurus derives his well-known claim that
  death is nothing to us. His reasoning is that when we exist, death is not present,
  and when death is present, we do not exist. Because harm requires a subject who
  experiences it, and the dead have no experiences, death cannot be a harm to the
  deceased.


