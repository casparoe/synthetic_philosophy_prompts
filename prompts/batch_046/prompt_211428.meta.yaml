  verdicts on four constructed cases. First, in the classic switch scenario, she judges
  it permissible to pull a lever that diverts a runaway trolley from a track with
  five people onto a side track with one. Second, in the footbridge scenario, she
  judges it impermissible to push a large bystander off a bridge to stop the trolley
  from reaching the five. Third, in a loop variant, where the single person is on
  a loop track that feeds back into the main line and their body would stop the trolley,
  she still judges the lever-pull permissible. Fourth, in a remote-gate scenario,
  where one can press a button that opens a trapdoor beneath an unsuspecting bystander
  standing over the track, causing them to fall and block the trolley, she judges
  this impermissible.


  I want to understand the principle structure behind these judgments, not just get
  an answer about the next case. Specifically, I want you to identify at least two
  distinct rules that are jointly consistent with all four verdicts, explain how each
  rule handles the distinction between the loop and the remote gate, and then apply
