  relationships—since the preferences themselves are what''s in flux. Third, I hold
  that the pre-transformation self retains decisive normative authority over whether
  to undergo the experience, and I ground this authority in psychological continuity
  being the correct criterion of personal identity, even though I recognize that transformative
  experiences are precisely the kind of event that tends to disrupt psychological
