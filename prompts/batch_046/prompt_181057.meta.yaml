  Here is an argument I have been working through with a graduate student, and I am
  unsure where the error lies. (1) The singleton hypothesis holds that Earth-originating
  intelligent life will eventually coalesce into a single global decision-making agency
  — a singleton — with no effective rivals. (2) If there will eventually be such an
  agency, then for any present action, its value is partly determined by its causal
  or evidential effect on the preferences that the singleton will hold. (3) Therefore,
  present rational agents ought to choose actions that maximize expected alignment
  with the singleton''s eventual utility function, rather than actions that maximize
  local or present welfare. (4) But the singleton''s utility function is not fixed
  independently of our present choices: if we prioritize local welfare, the singleton
  we eventually become may inherit those priorities; if we prioritize alignment, we
  may create a singleton with different priorities. (5) So the directive in (3) is
  either circular — we align to match preferences that are partly constituted by our
  alignment — or underdetermined, since there is no external standard by which to
  adjudicate which preference-formation path is correct. (6) If the directive is circular
  or underdetermined, then the singleton hypothesis does not provide a substantive
  normative framework for present action; it collapses into the claim that we should
  do whatever we will eventually do. (7) Yet Bostrom introduces the hypothesis precisely
  to motivate long-term strategic thinking about global coordination and value alignment.
  (8) Therefore, either the singleton hypothesis fails to motivate any distinctive
  present obligations, or step (3) must be rejected — but rejecting (3) seems to undermine
  the practical significance of the hypothesis. I suspect there is a modal or scope
  error between (2) and (3), or perhaps an equivocation on "value" across temporal
  perspectives. Where does the argument go wrong, and what is the least costly revision?


