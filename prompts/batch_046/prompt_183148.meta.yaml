  "In my graduate seminar on metaethics, I have been tracking the implicit commitments
  of a particular expressivist framework—one that treats moral predicates as expressing
  non-cognitive attitudes of condemnation or acquiescence rather than describing states
  of affairs—through its verdicts on embedded contexts. The framework has consistently
  ruled as follows. First, on an unembedded claim such as that the practice of extracting
  information through prolonged sensory deprivation is morally impermissible, it holds
  that the sentence expresses direct moral condemnation and is not literally truth-evaluable.
  Second, on the negation—that prolonged sensory deprivation is not morally impermissible—it
  denies that the speaker expresses condemnation; instead, it takes the utterance
  to express a contrary practical attitude (tolerance or acquiescence), again without
  descriptive truth conditions. Third, on a conditional—if prolonged sensory deprivation
  is impermissible, then the state must not authorize it—it holds that the antecedent
  does not carry expressive force in isolation, while the compound as a whole expresses
  a practical commitment linking conditions to action rather than describing a relation
  between propositions. Fourth, on a propositional-attitude report—Dr. Arendt believes
  that prolonged sensory deprivation is impermissible—it allows that the embedded
  clause contributes to the descriptive content of the belief ascription, so the overall
  sentence is truth-evaluable, though the speaker herself expresses no moral stance.
  Fifth, on a disjunction—either prolonged sensory deprivation is impermissible, or
  it is a permissible instrument of state security—it treats the utterance as expressing
  a divided or unsettled practical orientation, not as a standard truth-functional
  compound. I now wish to apply this framework consistently to a new construction:
  the concessive counterfactual ''Even if prolonged sensory deprivation were not morally
  impermissible, the state ought still to abandon it on purely evidentiary grounds,''
  in which a moral predicate is embedded within a counterfactual concessive clause
