  should ask students to lay out the Basic Argument precisely: true moral responsibility
  requires being causa sui, but since character is shaped by heredity and environment,
  and actions flow from character, the regress never bottoms out in something self-caused.
  The second part should inject a twist: imagine an artificial agent built with a
  recursive self-modification loop, where version V_n designs V_{n+1}''s core values,
  but V_0 was itself designed by V_{-1}, with no external originator. Ask whether
  this loop creates a genuinely self-caused agent, or whether it just distributes
  the same regress across iterations. They should have to say whether Strawson''s
  argument proves too much by ruling out even loop-based agency, or whether the loop
  actually confirms the argument by showing that distributed causation still isn''t
  self-causation.


