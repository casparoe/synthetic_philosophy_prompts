  "Read Steven Spielberg’s Schindler’s List (1993) through the lens of Plutarch’s
  practice in the Parallel Lives, where biography serves moral education not by presenting
  flawless exemplars but by juxtaposing lives so that virtue and vice illuminate each
  other — a method always threatened by hagiography, which flattens complexity into
  edifying myth. The film traces Oskar Schindler from profiteer and womaniser to rescuer,
  pairing him implicitly with Amon Göth and with Itzhak Stern. Examine whether this
  structure operates like a Plutarchan parallel: does comparing Schindler with Göth
  (both men of appetite and power, one destructive, one redemptive) teach calibrated
  moral judgement, or does the comparison collapse into a simple morality tale?


  Consider in particular the idea of ‘moral chiaroscuro’ — the deliberate retention
  of darkness around a luminous figure so that the viewer learns to judge virtue in
  context rather than imitate an impossible ideal. Spielberg preserves Schindler’s
  flaws (his infidelity, his initial exploitation of Jewish labour for profit, his
  ambiguous motives) and uses black-and-white cinematography to literalise this tonal
  contrast. Does this serve Plutarch’s pedagogical aim, or does the narrative’s redemptive
  arc — especially the girl in red, the list itself, and Schindler’s final breakdown
  — resolve the darkness into hagiography?


  Also address the counterfactual problem in biographical moral learning: the film
  constructs an aesthetically coherent arc that may exceed the historical record.
  Does that coherence aid moral understanding by making Schindler’s choices intelligible,
  or does it mislead by implying that virtue follows a recognisable narrative pattern?


