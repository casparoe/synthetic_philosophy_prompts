  Design a 90-minute workshop activity for approximately 16 advanced philosophy students—graduate
  or upper-level undergraduate—meeting in a single room with movable seating and blank
  index cards. The goal is to make the group experience, before it is named, Foucault''s
  analysis of disciplinary power as productive rather than repressive: specifically,
  the examination ritual that transforms individuals into documented, comparable cases
  and thereby co-produces knowledge and authority. Do not tell participants in advance
  that the exercise concerns Foucault, discipline, or the examination; reveal the
  framing only during the debrief.


  The activity should proceed in four timed phases. Phase one (10 minutes): silent
  individual writing on a concrete conceptual problem—whether objective moral obligations
  can survive deep cross-cultural disagreement—producing one paragraph of argument.
  Phase two (30 minutes): split the room into eight archivists and eight subjects.
  The subjects discuss the problem aloud in a circle while the archivists sit outside
  the circle, each observing one assigned subject. Archivists record observations
  on cards using a rubric of three categories that are defined only negatively and
  ambiguously—e.g., not-obvious, not-derivative, not-unstable—without any positive
  criteria supplied. Archivists may not ask clarifying questions; they must apply
  the categories and, on the back of each card, assign a hidden weight (1–3) that
  will determine influence in the next phase. Phase three (15 minutes): archivists
  collate cards and, using only the accumulated documentation, assign each subject
  a role for the second discussion—primary speaker, respondent, or silent observer—without
  explaining the algorithm or showing the cards. Subjects must accept the assignment
  and adapt their behavior accordingly, even though they do not know what was recorded
  about them. Phase four (20 minutes): the group reconvenes with subjects seated according
  to assigned role and discusses a related but distinct problem—whether knowledge
  requires a stable knowing subject—under rules that grant primary speakers the right
  to interrupt and silent observers the right to speak only if addressed. Phase five
  (20 minutes): structured debrief.


  In the debrief, map each phase onto a feature of the examination: the initial writing
  as the production of visibility; the negative rubric as the normalization of judgment
  that forces archivists to invent unstated norms; the hidden weighting as the internalization
  of the gaze; the role assignment as the transformation of the individual into a
