  1. Akrasia is genuinely possible — people can act against their all-things-considered
  judgment, not just revise the judgment.

  2. Hyperbolic discounting is the best model for everyday weakness: present rewards
  are overweighted relative to future ones.

  3. There''s no "true self" hidden behind the preferences; the long-term planner
  and the present-biased agent are just different temporal parts, none more authentic.

  4. Because of (3), weakness of will is basically a rational mistake — the agent
