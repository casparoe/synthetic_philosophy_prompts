  Hume treats currency not merely as a quantitative token but as the object of a habitual,
  associative belief structurally parallel to his account of necessary connection
  in the Treatise of Human Nature. On this reading, the acceptance of paper or debased
  coin rests on a custom-hardened projection of exchange-value onto an otherwise valueless
  token—what I call fiduciary psychology—rather than on intrinsic metallic worth or
  on an explicit institutional assignment of status-function. I then ask whether this
  makes Hume an unwitting precursor to modern social ontology (e.g., Searle''s institutional
  facts) or, conversely, whether his skepticism about causation renders monetary belief
  more fragile than contemporary institutional theories allow. If belief in money
  can dissolve like belief in necessary connection, then monetary crises might be
  epistemic collapses of customary association rather than purely economic disruptions.


  Notes for the argument:

  - Hume describes money as representing labor and commodities, comparing it to oil
  that smooths the motion of trade. He insists that national prosperity depends on
  labor and industry, not on the stock of gold or silver, because prices adjust to
  the quantity of currency.

  - Despite this quantitative neutrality, people continue to treat specific tokens—coins,
  banknotes, bills of exchange—as possessing value even when they know these tokens
  lack intrinsic utility. Hume explains this persistence by appealing to convention
  and habit, not to rational contract.

  - In the Treatise, Hume argues that necessary connection is not observed in objects
  but is projected onto constant conjunctions by a feeling of determination in the
  mind. I want to map this onto monetary acceptance: repeated successful exchange
  produces an associative habit that projects "purchasing power" onto paper, just
  as repeated conjunction projects "causal power" onto events.

  - Against a Searlian reading, I argue that Hume lacks any notion of collective intentionality
  assigning a status-function. For Hume, the convention is not a rational collective
  act but an accumulated custom, vulnerable to skeptical dissolution. A run on a bank
  is not a failure of institutional assignment but a breakdown of associative confidence.

  - The essay concludes by asking whether modern fiat systems depend more on Humean
  custom or on explicit institutional framing, and whether recognizing the Humean
  element makes them more vulnerable to epistemic panic than economists typically
