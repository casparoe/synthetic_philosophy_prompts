  Question: "In Amartya Sen''s liberal paradox (1970), minimal liberty and the Pareto
  principle come into conflict over the allocation of a single indivisible good—the
  right to read a particular text—between two agents, A and B. The four possible social
  states are: (i) A reads and B does not; (ii) B reads and A does not; (iii) both
  read; (iv) neither reads. The agents have the following preference orderings: A
  ranks (i) ≻ (iv) ≻ (iii) ≻ (ii); B ranks (ii) ≻ (iv) ≻ (iii) ≻ (i). The principle
  of minimal liberty (ML) grants each agent decisive authority over the pair of alternatives
  that differ only in their own consumption, while the Pareto principle requires that
  if both prefer x to y, society should not choose y.


  (a) Show precisely why ML and Pareto conflict in this profile, identifying the social
  state that ML selects and the one Pareto selects.


  (b) Evaluate the claim that this conflict can be dissolved by combining two moves:
  (1) adopting a ''choice-based'' rather than ''preference-based'' aggregation framework,
  in which only revealed binary choices (not full orderings) enter the social decision
  rule; and (2) applying a ''coherent extrapolated volition'' filter that replaces
  each agent''s stated preferences with an idealised version in which strategic, status-seeking,
  or externally imposed distortions have been removed. Would these two moves jointly
  eliminate the tension? If not, where exactly does the conflict persist?"


