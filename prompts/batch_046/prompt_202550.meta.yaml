  patients with highly standardized alter-personality structures — often with exactly
  the number and type of alters described in textbooks — and prevalence rose sharply.
  My verdict: this is a paradigmatic looping effect; the diagnostic category genuinely
  reshaped how some people experienced and expressed their distress.


  Case 2: The post-DSM-5 consolidation of autism spectrum disorder and the subsequent
  growth of adult self-identification communities. As the category broadened, online
  and offline groups developed shared vocabularies, masking strategies, and advocacy
  frameworks; clinicians then began recognizing "high-masking" presentations that
  closely matched these community narratives. My verdict: this is also a looping effect,
  but of a different kind — it seems to stabilize and reveal a hidden population rather
  than corrupt the category.


  Case 3: A niche 2023 proposal for "algorithmic dysphoria" — distress arising specifically
  from the awareness that one''s preferences are being predicted by recommendation
  algorithms. The term was introduced in a philosophy-of-technology paper; within
  months a subreddit adopted it, members circulated symptom checklists, and a small
  number of therapists began documenting cases that matched the checklists with remarkable
  uniformity. My verdict: this is a loop, but a "thin" one; the symptoms appear to
  be direct translations of the definitional criteria rather than organically reshaped
  experience. Still, I am not sure whether this distinguishes it from Case 1 or merely
  describes Case 1 at an earlier stage.


  Case 4: The importation of "neurasthenia" into late Qing China and Meiji Japan.
  Western clinicians brought the diagnosis, but local patients presented with somatic
  complaints — fatigue, dizziness, digestive disturbance — that matched indigenous
  idioms of distress rather than the Western "nervous exhaustion" script. Over time,
  the local clinical meaning of the term drifted to accommodate these presentations,
  while patients themselves did not begin organizing their experience around the Western
  concept. My verdict: not a looping effect in the relevant sense; the arrow runs
  from local culture to classification, not back from classification to person.


  Case 5: The viral spread of adult ADHD self-diagnosis checklists on social media
  platforms around 2021–2023. Users encountered lists of "ADHD traits" (e.g., rejecting
