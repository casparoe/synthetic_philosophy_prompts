  "I am delivering the keynote address at a memorial symposium being held next month
  for my grandmother, who died two weeks ago after a long illness. She was both a
  novelist and a lecturer in philosophy of art, and the audience will be divided:
  roughly half are her former students and colleagues in aesthetics, and the other
  half are family and friends who knew her only through her novels and our family
  life. I want the paradox of fiction to serve as the structural spine of the address,
  not as ornament. She held, and taught, that emotional responses to fictional characters
  are genuine but depend on a specific cognitive posture—something like an actively
  maintained suspension of belief—whereas grief for a real person operates without
  that suspension and therefore belongs to a different category altogether. I need
  to honor that distinction precisely: the speech must not collapse her death into
  narrative, must not say she is watching over us, and must not treat our grief as
  if it were merely another response to a well-crafted story. At the same time, I
  want to raise, gently, a tension she never resolved in her own work. If fictional
  emotion requires that kind of suspended commitment, and if part of the value of
  fiction is that it exercises our moral emotions in a safe, reversible register,
  then real grief—which refuses any suspension—might share far less with fictional
  sorrow than her account implied. That threatens the idea that fiction genuinely
  prepares us for real loss. I want this tension to shape what I can and cannot claim
  about her legacy, about the novels she left behind, and about what we are doing
  here together. The address should run about twelve minutes, be formally composed
  but not lecture-like in tone, and should be intelligible to the family without simplifying
  away the philosophical stakes for her students. Please write it."


