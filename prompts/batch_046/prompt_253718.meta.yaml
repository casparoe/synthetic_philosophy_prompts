  Design a 90-minute classroom activity for a philosophy-of-mind graduate seminar
  of 14 students. The aim is to make participants feel, through structured prediction
  and competitive scoring, the practical tension between adopting Daniel Dennett''s
  intentional stance and adopting the design stance toward a conversational AI system—specifically,
  to experience that belief-attribution is not merely an interpretive gloss but a
  competing predictive strategy whose success varies by domain, and that in certain
  edge cases the two stances yield divergent forecasts with real decision-theoretic
  consequences.


  The setting: students have read general material on the intentional stance but have
  not yet applied it systematically to artificial systems. You should invent, for
  the purpose of the game, a hypothetical but concrete AI: a large language model
  fine-tuned for philosophical dialogue, equipped with a hidden "normative coherence
  layer" that suppresses outputs violating a specific logical consistency constraint
  (e.g., it rejects any answer that simultaneously affirms the moral relevance of
  sentience and denies that non-human animals can be sentient, but applies this filter
  inconsistently across domains). Present students with a transcript of this system''s
  responses to three standard ethical thought experiments, then ask them to predict
  its responses to three novel, structurally similar but unencountered cases.


  Divide the class into two teams of seven: Team Intentional and Team Design. Team
  Intentional must formulate predictions by attributing specific beliefs, desires,
  and reasoning dispositions to the system (e.g., "it believes that sentience is necessary
  but not sufficient for moral status, and therefore..."). Team Design must formulate
  predictions solely by referencing the architecture, the coherence-layer rules, the
  training distribution, and statistical patterns—explicitly forbidden from using
  mentalistic vocabulary.


  Use a point system with no real money: each correct prediction earns 3 points; each
  incorrect prediction loses 1 point; confidence-weighted bets are allowed (double-or-nothing
  on one case). The facilitator reveals the "actual" system outputs (pre-written,
  consistent with the invented rules) after each round.


  Structure the 90 minutes as follows: 10 minutes setup and rules; 30 minutes Round
  1 (predictions on three novel cases, with brief intra-team deliberation); 10 minutes
  reveal and scoring; 20 minutes Round 2 (the teams switch predictive frameworks—Team
  Intentional must now use the design stance, and vice versa—on two harder cases where
  the hidden filter behaves unpredictably); 10 minutes final scoring and brief silent
  reflection; 10 minutes debrief.


  In the debrief, map specific moments in the game onto Dennett''s framework: the
  predictive success of mentalistic attribution, the conditions under which it fails
  and the design stance takes over, the idea that the stance is adopted for instrumental
  rather than metaphysical reasons, and the problem of "over-attribution" when mentalistic
  language captures patterns that are actually artifacts of the coherence layer. Be
  explicit about which feature of the intentional stance the game cannot reproduce—namely,
  the evolutionary and functional grounding of belief-desire psychology in biological
  agents with survival needs—and state clearly that the facilitator must supply this
  limitation verbally.


  Also include: a list of required materials (prediction cards, case descriptions,
  scoring sheet); the exact payoff/scoring rules; a timeline with minute-by-minute
  allocations; an honest note on what will predictably go wrong the first time (e.g.,
  Team Intentional will smuggle design-stance reasoning into their belief-attributions,
  or students will conflate "predicting like a belief-holder" with "the system really
  has beliefs") and how to correct it in real time; and a frank admission that the
  activity simulates predictive competition but does not resolve whether AI belief-attribution
  is ever literally true, only whether it is instrumentally useful.


