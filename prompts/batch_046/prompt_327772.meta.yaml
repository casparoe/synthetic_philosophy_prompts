  I am a doctoral student in democratic theory constructing a taxonomy of boundary
  principles—rules that determine who belongs to the demos. Rather than working from
  first axioms, I am reconstructing one particular framework from its case verdicts.
  The framework has delivered the following rulings.


  Case 1. Permanent residents who are fully subject to local taxation and criminal
  jurisdiction, but who lack citizenship and do not intend naturalization: included
  in the demos.


  Case 2. Citizens who have resided abroad for more than twenty years, maintain no
  domestic property or family ties, and bear no tax obligations: excluded.


  Case 3. Minors aged sixteen to seventeen who score in the top decile on standardized
  assessments of policy reasoning and civic knowledge, but who lack full contractual
  capacity: included with advisory (non-binding) deliberative weight.


  Case 4. Corporations incorporated within the jurisdiction, with localized stakeholder
  boards materially affected by zoning and environmental regulation: excluded.


  Case 5. Future generations who will bear irreversible ecological costs from present
  carbon and land-use policy, but who do not yet exist and cannot participate: included,
  represented through proxy advocates.


  Case 6. Non-human great apes with demonstrated territorial attachment, reciprocal
  social behavior, and responsiveness to local resource distribution: excluded.


  These six verdicts are jointly compatible with more than one governing principle—whether
  jurisdictional subjection, mutual reciprocity, deliberative autonomy, affected interest,
  or some hybrid.


  Now consider Case 7. An adult citizen—physically present, tax-paying, contractually
  competent, emotionally invested in policy outcomes—has permanently integrated an
