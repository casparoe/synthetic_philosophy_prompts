  The procedure should include:

  1. A sequence of diagnostic questions I ask in order about the phenomenon in question,
  with what counts as a sufficient answer for each.

  2. Explicit stopping points: conditions under which the procedure mandates an individual-level
  framing, conditions that mandate a holistic framing, and conditions that leave the
  choice genuinely open.

  3. Identification of the hard cases where the procedure breaks down or yields an
  answer I will not like—specifically, cases where the available data strongly support
  one framing but normative or explanatory considerations push the other way.

  4. Clear flags for judgment calls that cannot be eliminated by the procedure, marked
