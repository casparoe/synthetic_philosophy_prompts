  I''m preparing a seminar session on moral psychology and perpetrator behavior, and
  I''ve noticed that students tend to resolve the Browning-Goldhagen debate by picking
  sides—treating Christopher Browning''s situational account in Ordinary Men and Daniel
  Goldhagen''s ideological account in Hitler''s Willing Executioners as mutually exclusive—without
  ever forcing either theory to map onto the actual decision points of a real episode.
  To correct that, analyze the My Lai massacre of March 1968 through both lenses simultaneously.
  Treat the event as a sequence of distinct phases: the company''s initial entry into
  the hamlet and separation of villagers; the concentrated killings at the irrigation
  ditch under Calley''s orders; the brief pause and subsequent resumption of violence;
  and the intervention by Warrant Officer Hugh Thompson''s helicopter crew that halted
  the massacre. For each phase, identify the specific actors present, the options
  that were visibly available to them (participation, refusal, passive withdrawal,
  active intervention), and whether the behavior observed is better explained by situational
  mechanisms—peer conformity, diffusion of responsibility, authority pressure, dehumanization
  of the enemy in combat conditions—or by the kind of deep-seated, voluntary commitment
  to eliminationist violence that Goldhagen emphasizes. Be explicit about the presence
  of soldiers who refused to fire and about Thompson''s crew, since these are not
  marginal details but direct tests of whether the situation was genuinely overwhelming
  or whether ideological willingness varied independently of context.


  Then turn the analysis back on the theories. Ask: does My Lai confirm one framework,
  serve as an anomaly for the other, or reveal that the situation-culture-character
  triad needs restructuring? Specifically, address whether the concept of "moral drift"—a
  gradual, largely unplanned shift in what a group treats as permissible, driven by
  incremental accommodation rather than prior hatred or pure external pressure—captures
  dynamics that both Browning and Goldhagen miss. Finally, say clearly where each
  theory is silent: which features of the episode (for example, the specific role
