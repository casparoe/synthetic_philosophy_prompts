  I am trying to reconstruct the implicit principle behind a series of verdicts that
  a metaphysician I study with has delivered in our seminar on material constitution
  and diachronic identity. Across the cases below she has never appealed to a named
  theory, but her answers seem to follow a pattern—possibly more than one.


  Her rulings so far:


  1. The statue of David and the lump of marble that currently composes it. Verdict:
  they are not identical. Reshaping the marble into a vase destroys the statue, yet
  the marble survives; therefore they have different persistence conditions.


  2. The ship of Theseus, in which every plank is replaced over time while the design
  and function are preserved. Verdict: the original ship is destroyed; the present
  vessel is a new ship, despite continuous use and recognition by the crew.


  3. A cerebral-cortex transplant: the tissue is moved from one living human body
  to another, sustaining psychological continuity. Verdict: the person travels with
