  Answer draft:

  "Hacking''s concept of looping effects shows how psychiatric categories don''t just
  describe people but change them. When someone is diagnosed with a personality disorder
  under the old DSM-IV categorical system, they might internalise the label and act
  accordingly, which then makes the category seem more real. The DSM-5 moved to a
  dimensional model for personality disorders, measuring traits on a spectrum rather
  than putting people in boxes. This actually strengthens looping because people now
  see themselves as having ''high levels of antagonism'' rather than being ''a borderline'',
  which changes how they relate to clinicians.


  However, for conditions with strong genetic markers like schizophrenia, looping
  is basically cancelled out. The biology is so dominant that the social classification
  doesn''t really change the person''s behaviour — they would have the symptoms regardless
  of the label. So Hacking''s framework works for socially constructed conditions
  but not for biological ones.


  Also, Hacking borrowed this idea from Foucault''s concept of subjectivation, applying
  it specifically to mental illness. Patient advocacy groups can create reverse looping
  by lobbying for new categories, like what happened with autism spectrum disorder
  being broadened in DSM-5. But this doesn''t undermine the value-neutrality of psychiatry
  because the categories still track real suffering, even if social factors shape
  them."


