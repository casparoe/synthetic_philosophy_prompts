  Answer v2:

  "Hacking''s looping effect means that being classified in a psychiatric category
  changes how people understand themselves, which in turn changes their behaviour
  and makes the category seem more accurate. With personality disorders, the DSM-5''s
  shift toward dimensional trait models — where clinicians rate levels of antagonism
  or detachment rather than assigning a categorical diagnosis — actually intensifies
  this because patients internalise a continuous score rather than a binary label.


  When it comes to schizophrenia, the presence of strong genetic and neurobiological
  markers doesn''t eliminate looping, but it does change its character: the classification
  still shapes access to care, stigma, and self-narrative, even if it doesn''t cause
  the underlying symptoms. So looping is present but operates alongside biology rather
  than being cancelled out by it.


  That said, Hacking''s framework is essentially an application of Foucault''s concept
  of subjectivation to clinical settings, focusing on how psychiatric power produces
