  and David Wengrow''s The Dawn of Everything, and I''m stuck trying to reconcile
  two very different accounts of how human societies grew large and stayed coherent.
  Harari''s story centers on what he calls intersubjective realities — shared fictions
  like money, nations, or religious narratives that allow strangers to cooperate without
  personal trust. Graeber and Wengrow, by contrast, seem to emphasize that ancient
  communities often maintained large-scale settlements not by locking everyone into
  a single belief system, but by deliberately oscillating between hierarchical and
  egalitarian social forms, so that power could never fully crystallize. I find both
  pictures compelling, but they point in opposite directions about what actually binds
  a big society together.


  To think about this more precisely, I''ve been using a frame I invented for myself:
  the binding problem of scale. Once a group is too large for kinship and daily face-to-face
  negotiation to hold it together, something else has to do the work of coordination.
  Harari''s answer is that an abstract shared fiction — something that exists only
  in collective imagination — becomes the glue. The alternative I draw from Graeber
  and Wengrow is what I might call institutional schismogenesis: a social architecture
  in which authority and equality alternate seasonally or ritually, preventing any
  permanent hierarchy from forming and thereby removing the need for a permanent legitimating
