  Design a 75-minute classroom simulation for an upper-level undergraduate philosophy
  or sociology seminar of about 18 students. The goal is to make participants feel
  the force of Weber''s problem of explaining with values—specifically, whether a
  culture''s value-orientation can be an independent causal factor in economic behavior,
  or whether it is always reducible to material conditions and instrumental adaptation.


  The deliverable should be a runnable activity with rules, roles, and a small-stakes
  payoff structure, followed by a debrief. The problem should show up in what happens
  during the rounds, not in the facilitator''s explanation afterward.


  Structure and rules:

  - Divide the group into two subgroups of 9, seated separately, with no communication
  between them. Give both subgroups an identical economic environment: four rounds
  of 8 minutes each. In each round, every student receives 10 tokens. Each token kept
  yields 1 private point; each token contributed to a collective pool yields 1.6 points
  divided equally among all 9 subgroup members, but only if the subgroup''s total
  contribution reaches 60 tokens that round. If the threshold is missed, contributed
  tokens are lost. This creates a free-rider tension with a collective reward.

  - Before round 1, assign each subgroup a "value script" that they must use to justify
  every decision aloud. Subgroup A receives an ascetic-rational script: accumulation
  is moral duty, consumption beyond subsistence signals spiritual failure, and capital
  growth serves a "calling." Subgroup B receives a reciprocal-status script: hoarding
  is shameful, generosity creates binding obligation, and wealth exists to be redistributed.
  The scripts are randomly assigned; the facilitator should not reveal that they have
  no historical basis.

  - Between round 2 and round 3, introduce a calibrated "material shock": inform Subgroup
  A that consumption is now taxed at 20% (making saving instrumentally rational) and
  Subgroup B that distribution is now subsidized by 15% (making giving instrumentally
  rational). The shocks are designed to align material incentives with the assigned
  value scripts.

  - After round 4, reveal both the hidden shocks and the arbitrary assignment of scripts.

  - The debrief should map moments in the game onto Weber''s conceptual framework:
  the divergence in behavior under initially identical conditions; the participants''
  own explanatory asymmetry (invoking values for the other group but economics for
  their own post-shock shifts); any "value-lag" where behavior briefly resists the
  shock reversal; and the structural difficulty of distinguishing Wertrationalität
  (value-rational action) from Zweckrationalität (instrumental rationality) when material
  conditions and values move together.

  - Include a precise timeline (setup, four rounds, revelation, debrief), instructions
  for token tracking, and a facilitator script for the revelation.

  - Note what will predictably go wrong: some students will reject the value script
  and free-ride regardless; groups may try to reverse-engineer the hidden shock during
  round 3; and the debrief will tend to collapse into economic reductionism unless
  the facilitator explicitly asks whether placing a token in the pool meant "capital
  formation" in one group and "prestige investment" in the other.

  - Be frank about which feature of Weber''s thesis the activity cannot reproduce:
  the long-term, institutionally embedded, historically irreversible development of
  a value-system (like the Protestant ethic) that reshapes legal, educational, and
  organizational structures over generations. The facilitator must supply this limitation
  by contrasting the 32-minute simulation with the centuries-long institutional embedding
  Weber describes.

  - Inject one somewhat niche conceptual framing to prevent pure textbook regurgitation:
  require that the debrief address whether the value scripts functioned as "causal
  mechanisms" that changed preferences, or as "interpretive frames" that changed the
  meaning of the same physical act without altering underlying preferences—an ambiguity
  Weber himself never fully resolved.

  - Do not ask for bibliographies, citations, or reading lists. Do not depend on specific
  publication dates or obscure secondary literature. The prompt should not ask the
  model to quote any text verbatim.


