  After a long, circular argument with a friend about whether anyone ever genuinely
  has to do wrong no matter what they choose, I want a precise classification instrument—not
  another survey article. Build me a decision tree (or equivalently a taxonomy with
  branching questions) that sorts positions on whether genuine moral dilemmas exist,
  designed so that someone can answer the branch nodes without knowing the philosophical
  labels in advance. The tree should be built from the logical space of commitments
  rather than from a list of named theorists: start with concrete diagnostic cases
  and yes/no/graded commitments, then locate the named positions at the leaves.


  Requirements:

  - Audience: philosophy-curious but not necessarily trained; each node must be answerable
  without prior knowledge of the taxonomy.

  - Size: six to eight branch nodes, yielding at least six distinct leaves.

  - The nodes must cover: (a) whether conflicting obligations can be simultaneously
  all-things-considered binding; (b) whether the conflict is logical or merely practical/world-caused;
  (c) whether rational agent-regret (moral residue) is appropriate after choosing
  the lesser evil; (d) whether the conflict requires incommensurable value domains
  or can arise inside a single unified framework; (e) whether an ideal moral theory
  could in principle resolve every apparent conflict; (f) a concrete case node—e.g.,
  a variant of Sophie’s Choice or a professional duty that necessarily harms an innocent—to
  test intuitions about unavoidable wrongdoing.

  - The leaves must include: (1) strict deontic consistency / monism (no dilemmas,
  always one correct duty); (2) value-pluralist tragic choice (genuine, unresolvable,
  with residue); (3) epistemic-gap view (dilemmas are real for agents but disappear
  with perfect theory); (4) practical-conflict-only view (joint unsatisfiability without
  logical contradiction, no residue); (5) existentialist/radical-choice view (groundless
  decision, no moral remainder because no binding obligations); and (6) virtue-ethical
  resolution (apparent dilemmas dissolved by practical wisdom/phronesis). Note any
  other combinations you include.

  - For every unoccupied combination of answers (empty branches in the logical space),
  briefly diagnose why it is empty—e.g., incoherent, conceptually unstable, or merely
  unexplored.

  - Explicitly flag any pair of leaves your tree cannot cleanly separate, explaining
