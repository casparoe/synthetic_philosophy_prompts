  Concept, and/or Van Valen''s Ecological Species Concept). Specifically, address
  whether reproductive isolation remains meaningful when gene flow is engineered rather
  than natural, and whether shared plasmid pools constitute shared evolutionary fate
  or shared adaptive zone.


