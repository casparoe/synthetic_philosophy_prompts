  cards; 10 shared "Intervention Tokens."


  Phase 1 — Personal Ledger (15 min): Each participant receives a ledger with four
  categories: Suffering (S), Craving (C), Pleasure/Flourishing (F), Tranquility (T,
  defined strictly as S=0 and C=0). They begin at S=2, C=3, F=1, T=0. They privately
  choose one of three "Life Paths" to apply to themselves: (A) The Flourishing Path
  (F+3, C+2, S unchanged); (B) The Relief Path (S-2, C-1, F unchanged); (C) The Tranquility
  Path (S-2, C-3, F-1, T=1). They record the choice but do not share numbers.


  Phase 2 — Council Deliberation (25 min): The group becomes a council with 10 tokens
  to allocate across exactly three of six described societal projects (no numbers
  shown on cards, only narrative descriptions). Examples: "Universal chronic-pain
  eradication" (maps to Relief); "A national culture of artistic ambition and competitive
