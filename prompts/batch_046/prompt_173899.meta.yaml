  Draft idea:

  I''m writing my dissertation on temporal ontology and its application to personal
  identity, and at our department''s metaphysics reading group last week, two colleagues—let''s
  call them M and K—got into a prolonged disagreement about whether endurantism or
  perdurantism can accommodate what I''m calling "the diachronic unity of phenomenal
  consciousness." M, defending endurantism, argued that only a wholly present subject
  can explain the first-personal unity of consciousness across time; if I''m merely
  a four-dimensional worm composed of momentary slices, then no single slice has the
  authority to claim ownership of experiences occurring in other slices, which undermines
  the phenomenological datum that my past headache is genuinely mine in the same direct
  way my present headache is. K, a perdurantist, countered that this confuses metaphysical
  presence with phenomenological ownership, and that the endurantist actually faces
  a worse problem: temporary intrinsic properties. K pointed out that if the same
  enduring subject is wholly present both when I''m awake and when I''m asleep, then
  that subject literally possesses contradictory properties—being conscious and being
  unconscious—at different times, which requires either a relativization to times
  (making the subject not genuinely simple) or an ad hoc denial of temporary intrinsics.
  M responded that this is a pseudo-problem solved by indexing properties to times,
  and that indexing doesn''t compromise simplicity any more than spatial indexing
  compromises the simplicity of an object present in multiple places—though M then
  conceded that this spatial analogy might fail because temporal parts are not spatial
  parts. K then raised a more specific objection: if endurantism is true, then in
  cases of gradual neural replacement (say, a brain being replaced neuron-by-neuron
  with synthetic equivalents), the enduring subject must either remain numerically
  identical despite total material turnover, which seems mysterious, or it must cease
  to exist and be replaced, which seems implausible; perdurantism, K claimed, handles
  this naturally because the four-dimensional worm can have different material compositions
  at different temporal stages without any single stage undergoing mysterious change.
  M replied that this misunderstands endurantism: the enduring subject is not identical
  to its material constituents but to its form or functional organization, so material
  turnover is irrelevant to persistence, and in fact perdurantism struggles more because
  it must explain why the temporal parts at different stages belong to one worm rather
  than being independent objects—an explanation that, M argued, smuggles in exactly
  the kind of diachronic unity that endurantists take as primitive. They asked me
  to referee, particularly on whether M''s spatial analogy for temporal indexing holds,
  whether K''s neural-replacement argument genuinely favors perdurantism, and whether
  either side has missed a third option—perhaps a stage-theoretic view that treats
  consciousness as a series of related but non-identical subjects. Can you adjudicate
  their exchange point by point, identifying who makes the stronger move at each stage
  and what, if anything, both are overlooking about the relationship between temporal
  ontology and phenomenal unity?


