  Third, since in veridical perception there is no physical object with those properties,
  the object of awareness must be non-physical—typically a sense-datum. This leads
  to the conclusion that all perception is indirect.


  Disjunctivists reject the second premise by denying that veridical and hallucinatory
  experiences share a common mental kind. On the view defended by philosophers like
  Martin, when perception is veridical, the subject stands in a direct perceptual
  relation to a physical object and its properties; there is no intermediary mental
  object. In hallucination, by contrast, there is no object of awareness at all—the
  experience is a different kind of mental event entirely, not a relation to anything.
  This blocks the argument because there is no shared phenomenal factor that forces
  us to posit sense-data in the good case.


  However, a problem arises with partial illusions, where an object is genuinely present
  but appears with properties it lacks. Here, it seems there is both a direct relation
  to the object and an illusory element. I think disjunctivists must classify any
  experience containing an illusory component as a hallucination, since the direct-object
  relation is broken whenever the experienced properties do not match the actual object.
