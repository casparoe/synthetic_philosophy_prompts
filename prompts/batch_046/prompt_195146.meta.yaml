  pattern that doesn''t quite fit either category, and I''m wondering whether there''s
  an established term for it, or at least a recognized distinction in the literature.


  Consider two concrete cases. First, take a researcher who genuinely possesses the
  intellectual virtue of openness to counterevidence. When an anomalous result appears,
  she doesn''t suppress it (that would be a mask) and she doesn''t lack the virtue
  altogether. Instead, her openness is consistently redirected: she absorbs the anomaly
  into an elaborate auxiliary framework that preserves her core commitments, and the
  very act of accommodating the data feels to her like a triumph of open-mindedness.
  The disposition is fully active, but its typical manifestation—revision or abandonment
  of belief—is systematically replaced by a different outcome that serves the same
  psychological role. Second, imagine an engineered material that is genuinely brittle,
  but embedded in it is a responsive lattice that, upon stress, doesn''t prevent fracture
  but transforms the fracture into a highly ordered, structurally useful pattern.
  The brittleness isn''t masked or finked away; it expresses itself, yet the expression
  is always converted into something that functions as its opposite.


  In both instances, there''s an underlying disposition that remains intact and causally
  active, yet there''s a stable, predictable mechanism—call it a converter or redirector—that
  doesn''t block the manifestation but transforms it into an outcome that undermines
  the usual functional significance of the disposition. It seems different from a
  simple fink, because the disposition does manifest; different from a mask, because
  there''s no hidden underlying state that would manifest if the mask were removed;
  and different from an ordinary auxiliary hypothesis, because the mechanism isn''t
  an ad hoc add-on but an integral part of the system''s architecture. Does this configuration
  have a name in the philosophy of dispositions or in adjacent literature? How precisely
  does it relate to the fink/mask distinction, and if there is no established label,
  how should we characterize its boundaries—particularly the line between a redirective
  mechanism and a case where the original disposition has simply been replaced by
  a different one?


