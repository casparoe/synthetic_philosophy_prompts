  researching commemorative practices I witnessed the following disagreement between
  two colleagues—an archivist (Person A) and a public historian (Person B)—at a symposium
  I attended. I am reporting it as a bystander and do not want to signal which side
  I favor.


  Person A opened by arguing that so-called "lost cause" narratives are structurally
  revisionist rather than merely selective. She said that the Confederacy''s Lost
  Cause mythology did not simply highlight Southern culture; it systematically replaced
  slavery as the central cause of the Civil War with an invented narrative of states''
  rights and noble defense. She extended the point to Masada: the ancient account
  suppresses internal Zealot factionalism and frames collective suicide as unanimous
  heroic resistance, which modern political movements have used to justify refusal
  to compromise. Even Dunkirk, she added, is often mythologized as a pure "miracle
  of pluck" that suppresses the strategic reality of a retreat, the abandonment of
  French allies, and the role of Hitler''s halt order. Her conclusion was that public
  commemoration should prioritize what she called archival fidelity—presenting the
  documented complexity—rather than symbolic condensation, because condensation always
  requires strategic amnesia that serves present power.


  Person B replied that this standard is impossible and, if applied consistently,
  would dissolve all collective memory into an archive with no binding force. He said
  that Dunkirk''s strategic reality was indeed defeat and retreat, yet the "spirit
  of Dunkirk" does not falsify that reality; it selects the feature of civilian solidarity
  that made strategic preservation possible. He argued that Kosovo''s 1389 narrative
  functions similarly—not by denying the battle''s outcome, but by selecting endurance
  over victory as the symbolically enduring feature. The problem, he said, is not
  myth-making itself but "monomythic closure," where one interpretation is enforced
  and competing memories are excluded. He then introduced a distinction he finds crucial:
  "mnemonic sovereignty," which is a community''s democratic right to determine which
  features of its past are binding for its collective future, versus "mnemonic imperialism,"
  where one group''s selective memory is imposed on others who do not share it. The
  Confederacy''s myth, he concluded, was imperialist because it was enforced through
  Jim Crow and violence to suppress Black memory; Dunkirk''s can be sovereign if it
  allows space for the suppressed strategic facts and for the memories of those abandoned.


  Person A pushed back that Person B is smuggling in a false equivalence. She insisted
  that the Lost Cause was not an innocent selection but a deliberate historiographical
  project—funded, institutionalized, and taught—to replace causality with culture.
  She noted that Josephus''s account of Masada suppresses not only factionalism but
  the reality that many defenders were extremists who had murdered fellow Jews. Even
  in the Dunkirk case, she said, the "miracle" framing serves present British nationalism
  by erasing the failure of allied coordination. The pattern, she argued, is consistent:
  mythic condensation always requires strategic amnesia, and that amnesia is never
  neutral; it always serves the interests of those who control the narrative.


  Person B answered that Person A confuses the mechanism of selection with its moral
  evaluation. He granted that every collective narrative selects, and that selection
  can be audited for what it suppresses. But he maintained that without selection
