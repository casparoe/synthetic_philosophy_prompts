  As a central Mingjia thinker, Gongsun Long worked closely with Hui Shi, and both
  shared the thesis that distinctions of kind should not determine moral treatment—most
  clearly expressed in Hui Shi''s doctrine that all things ought to be loved equally.
  The argument proceeds in four steps: (1) ''Horse'' picks out shape alone; (2) ''White''
