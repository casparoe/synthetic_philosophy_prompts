  Paragraph 1:

  I''m currently enrolled in an upper-division seminar in normative ethics, and for
  our unit on demandingness objections to consequentialism I''ve been trying to map
  out where I actually stand on the boundary between moral requirement and supererogation.
  I want to avoid the usual textbook examples that everyone has seen a hundred times,
  so I''ve constructed a set of concrete cases drawn from career choice, direct rescue,
  mediated financial contribution, attentional labor, and bodily donation. Please
  treat this as a request for reflective equilibrium done on demand: I am not asking
  for a lecture on Singer or Williams, but for an audit of whether my own verdicts
  hang together. Before you analyze, please take a moment to brainstorm the principal
  strategies for resolving demandingness objections—agent-relative permissions, the
  ''ought implies can'' constraint, harm-versus-failure-to-benefit distinctions, integrity-preserving
  reasons, and any relevant structural analogies—so that your diagnosis is not just
  a post-hoc rationalization of one intuition.


  Paragraph 2:

  Here are my verdicts, assuming I am a middle-income professional with no dependents
  and moderate discretionary resources.

  Case 1: I spend $300 on a weekend trip rather than donating it to a highly effective
  global-health charity that could save a life at roughly that cost. Verdict: permissible,
  not wrong.

  Case 2: I am walking past a shallow pond and see a child drowning; saving them requires
  ruining my $400 shoes and missing a job interview. I save them. Verdict: required.

  Case 3: I could switch over five years to a far more lucrative career specifically
  in order to earn-to-give, saving perhaps dozens of lives, but this would require
  abandoning public-interest law and working seventy-hour weeks in a field I find
  meaningless. I stay in law. Verdict: permissible; vocational integrity sets a boundary.

  Case 4: I learn that my retirement portfolio holds stock in a firm whose indirect
  supply-chain practices cause serious harm; switching to an equivalent ethical fund
  takes fifteen minutes, costs nothing, and requires no lifestyle change, but I do
  not do it out of pure administrative inertia. Verdict: I feel somewhat blameworthy—closer
  to a failure than Case 1, despite the lower burden.

  Case 5: Every Tuesday evening I could volunteer at a nearby shelter where I am genuinely
  useful, but I consistently stay home to rest and watch films. Verdict: not required,
  though admirable if done.

  Case 6: I am healthy and could donate plasma twice monthly with minimal risk, earning
  about $100 per session that I could direct to effective charities; I avoid it because
  the clinic is unpleasant and I prefer leisure. Verdict: I am genuinely torn. Structurally
  it resembles Case 5, but the cost is so small and the benefit so concrete that part
  of me thinks it belongs nearer Case 4. This is the case I keep revisiting.


  Paragraph 3:

  My pattern is not simply ''low cost means required,'' since Case 4 is low-cost yet
  I do not treat it like Case 2, and Case 6 is also low-cost yet I hesitate to call
  it required. Meanwhile Cases 1, 3, and 5 all involve forgoing benefits to others
  and I judge them permissible. Is there a precise principle—or a small family of
  candidates—that captures this distribution? For each principle you propose, please
  identify the case that motivates each clause, state its verdict on cases I have
  not mentioned (e.g., refusing to donate a kidney to a stranger, or taking an earning-to-give
  job against one''s deepest commitments), and be explicit about which of my six verdicts
  it cannot accommodate without revision. If no single principle saves all six without
  ad hoc complexity, please rank the available options by which verdict they force
  me to abandon and which revision is least costly. Finally, apply your best principle
  back to Case 6 and tell me whether my ambivalence is principled or just confusion.


