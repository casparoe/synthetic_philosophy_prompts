  Exam Question:

  Consider the Nyāya theory of pramāṇas (valid means of cognition), focusing on upamāna
  (comparison or analogy). Some philosophers argue that upamāna can be fully reduced
  either to anumāna (inference) operating on perceived similarities, or to pratyakṣa
  (perception) mediated by linguistic convention. Classical Naiyāyikas, by contrast,
  treat upamāna as an autonomous pramāṇa.


  Write an analytical essay addressing:

  (a) The standard Nyāya account of how upamāna produces valid cognition, with attention
  to sādṛśya (similarity) and the cognition of a word-object relation (e.g., recognizing
  a gavaya as the referent of that term after being told it resembles a cow).

  (b) The specific feature that defenders claim distinguishes upamāna from anumāna—particularly
  regarding the absence of a liṅga (probans) and vyāpti (invariable concomitance)—and
  whether this defense succeeds.

  (c) One cross-traditional or modern objection: either that upamāna collapses into
  perceptual judgment mediated by convention, or that it presupposes an unreduced
  notion of sāmānya (universal) that Nyāya struggles to justify without circularity.


