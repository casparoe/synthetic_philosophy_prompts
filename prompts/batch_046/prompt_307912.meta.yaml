  (1) Lexical-threshold negative utilitarianism (LTNU) holds that there exists some
  severity of suffering s such that no aggregate of pleasure, however large, can justify
  allowing s.


  (2) If pleasure and suffering are incommensurable—lacking a shared metric that permits
  quantitative comparison—then the claim "no amount of pleasure outweighs s" is either
  meaningless or false, since "amount" has no cross-modal application.


  (3) Therefore LTNU implicitly presupposes that pleasure and suffering are commensurable:
  they must occupy a single cardinal welfare scale for the "no amount" clause to be
  well-formed.


  (4) Once commensurability is established, welfare values are at least in principle
  additive and comparable.


  (5) So for any given s, there exists in principle a pleasure-aggregate P whose total
  welfare value exceeds |s|—for instance, a sufficiently large population experiencing
  intense but not extreme well-being over a sufficient duration.


  (6) Hence, if (3) and (4) hold, LTNU is false: there is always some amount of pleasure
  that outweighs s.


  (7) The defender might reject (4) by insisting that suffering carries a non-aggregative,
  categorical normative weight—what we might call a "lexical veto"—that operates independently
  of magnitude.


  (8) But if suffering''s veto power is genuinely independent of magnitude, then LTNU
  is not the claim that "no quantity of pleasure outweighs s"; it is the claim that
  quantitative comparison is categorically inapplicable to suffering.


  (9) In that case LTNU collapses either into a deontological side-constraint (suffering
  must be prevented regardless of welfare balances) or into a form of extreme risk-averse
