  "Epiphenomenalism holds that phenomenal properties—what it is like to experience
  pain, color, or thought—are real but exert no causal influence on the physical world.
  The brain produces consciousness, but consciousness does not steer the brain. The
  familiar objection is interactionist: if my pain does not cause me to wince, then
  the causal closure of the physical domain seems violated only in one direction—there
  is an unexplained gap where mental causation should be.


  But there is a less discussed difficulty that runs in the opposite direction. Call
  it the paradox of phenomenal judgment. If phenomenal properties are causally inert,
  they do not cause the neural events that constitute my judgment that I am in pain.
  Those neural events are fully determined by prior physical states. So the causal
  chain leading to my judgment never touches the phenomenal property it purports to
  be about. This is not merely the third-person zombie worry—whether another being
  lacking consciousness could make the same reports. It is a first-person worry: my
  own judgment seems systematically disconnected from the very feature that makes
  it true, if it is true.


  One might reply that phenomenal concepts are not causally mediated but present their
  objects directly, through some form of acquaintance. Yet if phenomenal properties
  have no causal powers, it is unclear what grounds this direct presentation. Presentation
  is usually understood as a relation; if one relatum can enter into no relations
  with the physical substrate of cognition, the relation becomes mysterious.


  A deflationary alternative suggests that phenomenal judgments are not genuinely
  about non-physical properties at all. They are reports about functional or neural
  states, delivered in a phenomenal mode of presentation. On this view, my judgment
  ''I am in pain'' refers to a particular brain state, and the phenomenal vocabulary
  is merely a way of accessing that state from the inside. But this threatens to collapse
  epiphenomenalism into a form of physicalism: if all our judgments about consciousness
  are actually judgments about physical processes, and phenomenal properties play
  no independent explanatory or referential role, then positing them as extra, causally
  inert entities looks like an unnecessary ontological appendage.


  Thus the epiphenomenalist faces a dilemma. If phenomenal judgments genuinely refer
  to causally isolated properties, their reliability is unexplained. If they do not
  genuinely refer to such properties, then epiphenomenalism loses its distinctive
  claim—that there are real phenomenal properties, just powerless ones. Either consciousness
  is causally excluded and epistemically orphaned, or it is physically reducible and
  ontologically redundant. The paradox is that the very feature that makes epiphenomenalism
  attractive—preserving the reality of consciousness without violating physical closure—seems
  to undermine the conditions under which we could know it."


