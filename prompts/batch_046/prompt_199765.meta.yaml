  occupied" can be a completed condition — in which case actual infinity is coherent
  and Cantor''s argument applies to completed lists — or denies that it can ever be
  completed, rendering Hilbert''s hotel useless as a model for potential infinity.
  (9) This seems to show that finitism cannot consistently borrow the intuitive force
  of Hilbert''s hotel without either conceding actual infinity or emptying the analogy
  of its content.


