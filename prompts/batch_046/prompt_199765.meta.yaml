  occupant to the next room — as an intuitive model of how potential infinity behaves,
  without committing themselves to an actual infinite collection of guests present
  at once. (3) Now apply Cantor''s diagonal argument within this model: suppose we
  attempt to enumerate all real numbers by assigning each to a room in the hotel,
  one per room. At any stage k we have assigned k reals, and we can construct a diagonal
  real not among them. (4) The finitist will reply that this merely shows the assignment
  is indefinitely extensible, not that there exists a completed enumeration that fails
  to contain some real. (5) But observe that precisely the same reply is available
  for the occupancy condition of the hotel: if every room is occupied, the finitist
  can say this is never a completed state, only an extendable process of filling rooms
  one by one. (6) Hence, if the finitist uses the potential-extensibility defence
  to block Cantor''s conclusion, they must also deny that the hotel ever reaches a
  state of being genuinely full. (7) Yet the shifting manoeuvre that makes Hilbert''s
  hotel interesting presupposes that there is a determinate state of full occupancy
