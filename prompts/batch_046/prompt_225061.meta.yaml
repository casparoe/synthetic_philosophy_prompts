  as a trustee mandate that activates only when the patient enters what I call a "moral
  dead zone"—a state in which preferences exist but lack the diachronic stability
  and reflective endorsement required for autonomy. I worry this risks treating the
  demented patient as a moral non-person, yet I also think the standard "same person,
  new values" model falsely dignifies random preference-fluctuation as autonomous
