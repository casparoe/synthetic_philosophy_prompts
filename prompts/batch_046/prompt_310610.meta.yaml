  our reading group has circled precisely this exchange: the holists cite the revisability
  of geometric postulates and logical principles, while the defenders cite the apparent
  absurdity of treating synonymy as an empirical discovery. Neither side appears to
  address the other''s core concern, and I am no longer sure whether they are disagreeing
