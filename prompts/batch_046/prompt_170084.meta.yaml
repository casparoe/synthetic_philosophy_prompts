  below seems to drive me toward an unacceptable conclusion: either every citizen
  is tainted by ancestry, or the concept of collective guilt collapses into mere institutional
  bookkeeping. I need to know which step fails, and what giving it up costs.


  (1) Moral guilt, as distinct from legal liability or political responsibility, requires
  moral agency: the capacity to understand a wrong, experience remorse, and undergo
  reform.


  (2) A nation-state is not a conscious agent; it lacks the unified subjectivity necessary
  for remorse or moral transformation. To attribute moral guilt to it is therefore
  either a category error or a metaphor.


  (3) Nevertheless, nations persist across generations as continuous institutional
  entities with legal identity, accumulated capital, territorial boundaries, and bureaucratic
  structures that directly inherit benefits from past injustices.


  (4) If moral responsibility requires only institutional continuity and causal inheritance—rather
  than individual consciousness—then a nation can be responsible for historical wrongs
  in the same structural way that a corporation inherits liability for past environmental
  harm, even after all original actors have died.


  (5) But if the nation is guilty, and citizenship is largely non-voluntary and inherited,
  then every present member is implicated in that guilt, at least as a constituent
  part of the guilty collective.


  (6) This yields an absurd result: a child born today to parents who actively resisted
  the wrong is morally guilty for atrocities committed before her birth, solely by
  inheriting citizenship and its associated benefits, while the actual perpetrators
  are dead and beyond moral address.


  (7) To block this, one might restrict guilt to the institution alone, treating it
  as what I am calling intergenerational moral sedimentation—a layered structural
  residue that requires institutional redesign and reparative restructuring rather
  than personal remorse. On this view, "guilt" names only a structural obligation,
  not a moral stain.


  (8) Yet if we make that move, we have abandoned the specifically moral dimension
  of guilt that Jaspers insisted upon; we are left with administrative liability dressed
  in moral language.


  (9) Therefore, collective moral guilt across generations is either incoherent (because
  nations lack moral agency), unjust (because it implicates innocent members), or
  vacuous (because it reduces to structural bookkeeping).


