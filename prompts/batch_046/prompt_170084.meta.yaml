  As a journalist covering philosophy and public ethics, I have been trying to formalize
  a puzzle about collective guilt that keeps arising in debates over historical reparations
  and national memory. Drawing on Karl Jaspers''s 1946 distinction between criminal,
  political, moral, and metaphysical guilt—without treating any one category as settled—I
