  Dennett''s framework offers three levels of explanation. The physical stance predicts
  behavior by appealing to physical laws and material constitution; the design stance
  predicts by appealing to functional organization and intended purpose; and the intentional
  stance predicts by treating the system as a rational agent with beliefs and desires.
  In the case of the hybrid LLM-memory-reinforcement system, the intentional stance
