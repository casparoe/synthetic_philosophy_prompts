  Take the standard compartmental SIR model—susceptible, infected, recovered—and its
  deployment by governments in the first half of 2020. The model assumes homogeneous
  mixing, uniform transmission rates, and no network structure; all of these are false
  in ways that epidemiologists knew immediately. Yet the model yielded estimates of
