  Hofstadter''s analysis of Clément Marot''s "Ma Mignonne" as a straightforward inventory
  of translation failures, I want to argue that the seven formal properties he isolates—rhyme,
  meter, alliteration, syntactic parallelism, and others—function not as independent
  dimensions on a Pareto frontier but as interacting constraints that actively undermine
  one another when optimized separately. My central claim is that a "faithful" translation
  should therefore be evaluated not by how well it scores across these dimensions,
  but by whether it respects an implicit hierarchy of constraints internal to the
  poem''s own architecture.


