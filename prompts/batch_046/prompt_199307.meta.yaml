  I''m designing a module on distributive justice for an advanced undergraduate seminar,
  and during a pilot discussion two students—let''s call them Jordan and Riley—got
  locked in a disagreement about how luck egalitarianism applies to career-related
  social capital. They were considering a concrete comparison: Maya and Leo both freely
  chose to become freelance illustrators. Maya was born into a well-connected family
  with ties to publishing houses; Leo grew up in economic precarity with no professional
  network. Both invested comparable effort, but Maya secured steady commissions while
  Leo struggled to find clients. Jordan and Riley agreed that luck egalitarianism
  distinguishes brute luck (unchosen circumstances) from option luck (the outcomes
  of choices for which one can be held responsible), but they diverged sharply on
  where the line falls in this case. Please adjudicate their exchange move by move:
  rate each contribution from clearly mistaken to clearly right, justify each rating
  briefly, indicate where both are missing something important, and say who is more
  right overall.


  Here is how the exchange unfolded.


  (1) Jordan said Leo''s lack of professional connections is a paradigm case of brute
  luck—he did not choose his family or its social capital—so a consistent luck egalitarian
  should support compensation that brings Leo''s prospects closer to Maya''s.


  (2) Riley replied that Leo also chose a career path—freelance illustration—where
  success is unusually sensitive to exactly those network effects. By selecting a
  high-risk, network-dependent field rather than a more stable occupation, Leo assumed
  responsibility for the differential risk. The connections themselves may be brute
  luck, but the decision to enter a domain where they matter so much transforms the
  poor outcome into option luck.


  (3) Jordan countered that this reasoning conflates the choice of career with the
  resources available within it. Even holding the career constant, Maya''s network
  is an unchosen advantage that tilts the playing field. If compensation is denied
  whenever a person made any prior choice, then virtually all social advantages become
  non-compensable because every life path involves prior choices. The theory needs
  to neutralize background conditions, not excuse them by pointing to downstream choices.


  (4) Riley answered that Jordan is sliding toward full equality of outcome disguised
  as luck neutrality. There must be a cutoff: compensation applies only when unchosen
  circumstances severely constrain or undermine the capacity for choice, not whenever
  they create differential advantages within an otherwise voluntary career. Leo''s
  choice was genuinely free; he merely faced harder conditions, and facing harder
  conditions is part of what it means to take responsibility for a risky choice. Without
  such a cutoff, no one is ever responsible for anything, since every choice is causally
  embedded in an unchosen history.


  (5) Jordan responded that Riley is smuggling in a perfectionist conception of autonomy—treating
  choices as "free" only under ideal conditions. Luck egalitarianism was developed
  precisely to reject that picture: people make choices in conditions shaped by luck,
  and justice requires neutralizing the luck without denying that the choice occurred.
  To say Leo "assumed the risk" while ignoring that the risk was distributed by brute
  luck is to abandon the theory''s core commitment.


  (6) Riley concluded that Jordan is correct that choices are embedded in unchosen
  histories, but wrong that this makes every embedded outcome compensable. The theory
  requires a principled distinction between circumstances and choices, yet in practice
  they are entangled in ways that resist clean separation. Rather than compensating
  for every network gap, a workable luck-egalitarian policy should identify specific
  structural barriers that genuinely undermine autonomy—such as exclusion from basic
  education or credit—while treating differential success within a freely entered
  profession as a matter of option luck, even when background advantages play a role.


