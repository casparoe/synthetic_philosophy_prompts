  As a software engineer with no formal background in philosophy, I have been trying
  to formalize how I actually decide things when I am unsure which moral framework
  is correct — not just factually unsure, but normatively unsure about which theory
  applies. Below are five concrete cases with my gut verdicts. I want to know whether
  they can be unified by one principle of decision-making under moral uncertainty,
  or whether I need to abandon at least one verdict.


  Case 1. I am deploying a predictive-policing module. I am about 60 percent convinced
  that maximizing overall welfare is the right criterion and about 40 percent convinced
  that any feature violating an explicit fairness commitment in the product specification
  is impermissible regardless of welfare gains. The module improves aggregate metrics
  but breaks the fairness commitment. Verdict: I should not deploy. The rights-like
  constraint feels like it should block the action even though my confidence in it
  is below 50 percent.


  Case 2. I am choosing a data-center architecture. Option A is energy-cheap now but
  requires full hardware replacement in two years. Option B is expensive now but lasts
  ten years. I am split between a view that weights present people heavily and a view
  that gives strong moral weight to distant future generations affected by e-waste
  and carbon. I pick A without serious regret. Verdict: near-term practical considerations
  should dominate when the uncertainty concerns distant-future moral status; I should
  not treat speculative long-range obligations as veto-level.


  Case 3. I am running a large language-model fine-tuning job for a temporary client
  demo. The job consumes substantial electricity, produces no lasting product, and
  will be deleted in one month. I am genuinely unsure whether a non-sentient but highly
  capable system could have even minimal moral standing. I run the job but feel residual
  unease. Verdict: I should have refused, applying a precautionary default against
  treating a possibly-status-bearing entity as a disposable resource — even though
  I think sentience is absent.


  Case 4. A teammate asks me to sign off on a code review for modules I did not examine,
  explaining that they are overwhelmed and that the release is low-risk. I am unsure
  whether virtue-ethical considerations about professional integrity are genuinely
  normative or merely conventional. I sign off anyway. Verdict: that was wrong. The
  misrepresentation corrupts my role-independent of outcomes, and that wrongness does
  not depend on my being certain that virtue ethics is correct.


  Case 5. I discover a critical security vulnerability. Immediate public disclosure
  would cause panic and potential exploitation; delaying two weeks allows a silent
  patch. I am roughly 50/50 on whether transparency is an absolute duty or one weighted
  consideration among others. I delay disclosure. Verdict: that is permissible. Even
  if transparency has high value, the risk of harm makes it defeasible, and my uncertainty
  about its absolute status does not make it a veto.


  These five feel coherent to me in isolation, but together they seem unstable: in
