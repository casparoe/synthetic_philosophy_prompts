  In my graduate seminar on distributive ethics, two doctoral students—Elena and Marcus—became
  deadlocked over a modified rescue scenario designed for autonomous triage systems.
  The case involves a medical drone that can rescue either one critically injured
  pilot with a near-certain fatal prognosis if untreated, or five passengers with
  serious but non-immediately-fatal injuries, but not both, due to fuel and payload
  constraints. Elena opened by defending a position derived from John Taurek’s well-known
  argument: since moral duties run to individuals rather than to aggregates, each
  of the six people generates an identical, non-additive claim to rescue. Consequently,
  the drone should not maximize headcount but should assign each person an equal chance—effectively
  flipping a coin between saving the single pilot and saving the group of five—because
  saving five is not five times as important as saving one.


  Marcus replied that this misinterprets the structure of competing claims. Even if
  duties do not aggregate linearly, they still accumulate: the pilot possesses one
  claim of full weight, while each passenger possesses an identical claim, yielding
  five such claims against one. The drone therefore ought to save the five, not because
  the group is a super-individual, but because there are five separate reasons of
  equal strength, each of which favors rescue, and the preponderance of reasons points
  to the larger group. Elena countered that Marcus smuggles in summation precisely
  where it is illegitimate. If I owe you rescue and I owe your identical twin rescue,
  I do not owe twice as much to the pair; the duty is fully satisfied with respect
  to each, and multiplying claimants does not multiply the obligation. To treat the
  five as carrying five times the weight is, she argued, to invent a collective moral
  patient that does not exist.


  Marcus then introduced what he called a “fleet-consistency” objection: imagine one
  thousand identical drones, each facing the same choice independently. If every drone
  follows Elena’s coin-flip rule, the expected aggregate outcome across the fleet
  is that roughly half the pilots and half the passenger-groups are saved, producing
  a drastically lower survival rate than a fleet-wide maximize policy. Elena responded
  that this is a consequentialist objection disguised as a coordination problem. The
  statistical pattern across distributed agents, she said, is not a reason that bears
  on any single drone’s direct duty to the individuals immediately before it. Moreover,
  allowing fleet-level expectations to override the individual claim risks a “moral
  dilution” effect—whereby the five passengers in one location matter less simply
  because other agents elsewhere face analogous choices—which she found even less
  intuitive than Taurek’s lottery. Marcus insisted that any ethically deployable algorithm
  must be designed with collective rationality in view, and that refusing to aggregate
  at the unit level produces a coordination failure that no designer, and no affected
  party behind a veil of ignorance, could endorse.


