  a bar of iron becomes magnetic or crystalline through the action of certain outward
  causes, or India-rubber becomes friable, or plaster ''sets.'' All these changes
  are rather slow; the material in question opposes a certain resistance to the modifying
  cause, which it takes time to overcome, but the gradual yielding whereof often saves
  the material from being disintegrated altogether. When the structure has yielded,
  the same inertia becomes a condition of its comparative permanence in the new form,
  and of the new habits the body then manifests. Plasticity, then, in the wide sense
  of the word, means the possession of a structure weak enough to yield to an influence,
  but strong enough not to yield all at once. Each relatively stable phase of equilibrium
