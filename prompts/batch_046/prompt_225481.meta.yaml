  Jordan opened by claiming that the law is not anti-multicultural but rather multiculturalism
  applied rigorously. The point of accommodating difference, Jordan said, is to protect
  inclusive shared institutions. If visible religious symbols in classrooms create
  coercive pressure—particularly on girls from conservative families—then banning
  them protects minority students from majority religious dominance. On this view,
  laïcité and multiculturalism share the same goal: a neutral space where citizens
  interact without sectarian hierarchy. The difference is only aesthetic—France uses
  exclusion from the public sphere, Anglo-American policy uses inclusion with safeguards.


  Sam replied that this misreads multiculturalism''s core commitment. Anglo-American
  multiculturalism, as developed in the Canadian and British contexts, does not merely
  tolerate difference; it recognizes group-differentiated rights in public institutions.
  Allowing a Sikh turban in a police uniform or accommodating Indigenous ceremonial
  practice in court is not a failure of neutrality but a recognition that so-called
  neutral spaces are already structured by majority cultural norms. The 2004 law,
  Sam argued, forces observant Muslim girls to choose between education and religious
