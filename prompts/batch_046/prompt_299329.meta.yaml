  history for life: history can serve life monumentally (as exemplary inspiration
  for present action), antiquarianly (as preservative identification with a continuous
  past), or critically (as liberating dissolution of a burdensome past), but any of
  these modes can become destructive when it dominates the others or when the past
  is made to rule over present life rather than serve it.


  Your task is to translate this framework into a reusable decision procedure that
  a staff member with no philosophical training can apply in thirty minutes to any
  proposal. The procedure should take the form of an ordered sequence of diagnostic
  questions, with specified conditions for a "proceed with conditions," "reject,"
  or "escalate to board judgment" outcome at each stage. It must explicitly distinguish
  the three Nietzschean modes, identify when a proposal activates more than one in
  conflict, and flag the point where a value judgment about the city''s present needs—rather
  than a factual determination about the proposal—must be made.


  In particular, the procedure must handle these hard cases: (i) a proposal that is
  monumentally inspiring but relies on significant historical simplification or falsification;
  (ii) a proposal that is critically liberating—designed to dissolve a harmful narrative—but
  risks destabilizing community identity to a degree that inhibits rather than frees
  present action; (iii) an antiquarian preservation project that accurately documents
  a past but does so in a way that makes present inhabitants feel they live in the
  shadow of an unrecoverable grandeur.


  Apply your procedure to three proposals: (a) a monumental statue and accompanying
  school module celebrating a local labor uprising, using a narrative that elides
  the uprising''s internal ethnic divisions; (b) a critical museum exhibit that systematically
  deconstructs the founding myth of the city''s industrial prosperity, with no accompanying
  narrative of present capacity; (c) an antiquarian digital archive of every building
  demolished during urban renewal, meticulously documented but presented without curatorial
  framing.


