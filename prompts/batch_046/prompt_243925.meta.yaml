  Structure:

  - Round 1: Mira argues that Lange''s model (prices as accounting parameters, trial-and-error
  adjustments by central boards) solves the knowledge problem because it uses the
  price mechanism without requiring full central planning of every detail. She says
  Hayek was attacking a strawman of full central planning.

  - Round 2: Jonas counters that Lange''s boards still need to set initial prices
  and adjust them without owning capital; the "trial and error" requires someone to
  bear losses, which in capitalism is the capitalist. Without private ownership of
  capital goods, there''s no mechanism for bankruptcy or entrepreneurial discovery
  of truly new goods, only bureaucratic adjustment. So Lange doesn''t solve the knowledge
  problem, he just hides it behind a pseudo-market.

  - Round 3: Mira responds that Lange explicitly allows for consumer goods markets
  and labor markets, and that the "trial and error" is functionally equivalent to
  market clearing. The central board is like a Walrasian auctioneer, not a planner
  with omniscience.

