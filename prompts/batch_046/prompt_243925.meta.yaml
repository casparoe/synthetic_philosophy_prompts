  Topic: The socialist calculation debate. Specifically, a disagreement about whether
  Oskar Lange''s competitive-market socialism actually resolves Friedrich Hayek''s
  knowledge problem, or whether it secretly concedes Mises''s point about rational
  economic calculation being impossible without private property in capital goods.


