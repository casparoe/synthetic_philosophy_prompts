  At a reading group on political economy, two participants—call them Priya and Elias—debated
  whether Oskar Lange''s competitive-market socialism genuinely answers the knowledge-based
  objections raised by Hayek and Mises, or whether it quietly abandons the very mechanism
  those objections target. I was present but stayed neutral. They went back and forth
  for several rounds, and I would like you to adjudicate their exchange point by point:
  who is right about which specific claim, what each side is missing, and who is more
  right overall.


  Here is how it unfolded.


  Priya began by saying that Lange''s model solves the calculation problem because
  it retains a price mechanism for both consumer goods and capital goods, using central
  boards that adjust prices via trial and error until supply equals demand. She argued
  that Hayek''s famous critique—that socialist planners lack the dispersed, local
  knowledge embodied in market prices—only applies to a fully centralized command
  economy where every decision is made top-down. In Lange''s scheme, prices still
  emerge from interaction with supply and demand; the board is essentially an accounting
  device, not an omniscient planner. Therefore, Hayek attacked a strawman.


  Elias replied that this misses the epistemic core of Hayek''s argument. The price
  mechanism in capitalism does not merely record supply and demand; it communicates
  tacit, contextual knowledge—what Hayek called "knowledge of the particular circumstances
  of time and place"—through profit and loss signals that only have bite when capital
  is privately owned and at risk. Lange''s boards adjust prices algorithmically, but
  they do not bear entrepreneurial risk in the same way: they manage social capital
  with soft budget constraints, and there is no mechanism for the kind of discovery
  that comes from competing entrepreneurs risking their own resources. So Lange hasn''t
  solved the knowledge problem; he has replaced distributed discovery with a centralized
  feedback loop.


  Priya countered that this overstates the uniqueness of private risk. She pointed
  out that Lange explicitly allows for labor mobility and consumer choice, and that
  the board''s trial-and-error adjustments are functionally analogous to market clearing.
  She also introduced a comparison: modern distributed optimization systems—like iterative
  machine-learning feedback loops—demonstrate that you can approximate globally efficient
  allocations without requiring every node to own the resources it adjusts. If such
  algorithmic adjustment works in other domains, why should it be impossible for socialist
  boards?


  Elias said this comparison actually proves his point. Machine-learning optimization
  works precisely because it operates within a fixed objective function and a bounded
  parameter space defined in advance. Real economic discovery, by contrast, involves
  redefining the problem itself—creating new goods, new preferences, and new combinations
  that no pre-set algorithm can anticipate. Hayek''s knowledge problem is not about
  computing an equilibrium given fixed ends; it is about the open-ended, qualitative
  transformation of economic possibilities. By treating Lange''s board as an optimization
  algorithm, Priya reveals that the model can only handle static allocation, not the
  dynamic, entrepreneurial discovery that private property makes possible. Furthermore,
  Elias noted, Mises''s original argument was not merely about information processing
  but about the impossibility of rational economic calculation without a market for
  capital goods priced through actual exchange of private titles. Lange provides accounting
  prices, but not prices formed through genuine exchange of property rights; without
  those rights, there is no rational basis for comparing the opportunity costs of
  capital across different uses.


  Priya responded that this sets an impossible standard. No system—capitalist or socialist—guarantees
  open-ended discovery. Capitalist firms also operate within organizational hierarchies
  that plan internally; the market only sets external constraints. Lange''s boards
  face similar external constraints through consumer markets and labor markets, so
  the boundary between "market" and "plan" is blurrier than Elias admits. She added
  that if Mises''s argument depends on a metaphysical commitment to private property
  as the sole source of rationality, then it is a normative claim disguised as an
  economic one.


  Elias concluded that the boundary being blurry does not mean the distinction is
  unreal. Capitalist firms plan, yes, but they do so within a price system that ultimately
  tests their plans against the risk of failure. Lange''s boards never face that ultimate
  test because they cannot go bankrupt in the same sense; their errors are socialized.
  So while Lange solves the static allocation problem that Mises framed, he does not
  solve the dynamic knowledge problem that Hayek emphasized. The disagreement, Elias
  said, is ultimately about whether economic rationality requires distributed ownership
  with hard budget constraints, or whether algorithmic adjustment with social ownership
  can replicate its informational function.


