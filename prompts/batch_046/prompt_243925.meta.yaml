  it assumes all information is already present. Real markets work because dispersed
  actors experiment with capital they risk losing. Lange''s boards risk other people''s
  resources (social capital) and face soft budget constraints. So the calculation
  problem isn''t solved; it''s relocated to a place where error signals are muted.

