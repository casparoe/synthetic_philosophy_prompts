  She granted that Descartes denies animals rational souls and therefore denies them
  language, reflection, and universal reason. But she insisted that this doesn''t
  entail they are insentient automata. She pointed out that Descartes describes sensory
  pathways in animals in physiological detail—nerve cords, brain movements, glandular
  interactions—much as he does for humans, and that for humans these same pathways
  are the bodily conditions of feeling. So she argued that an animal''s scream when
  injured is not analogous to a clock striking the hour, but rather expresses a genuine
  sensory state, just one that lacks any rational reflection. She also noted that
  in Descartes''s correspondence with Henry More, he seems to allow that animals possess
  some form of life and affective response, even if not thought in the strict sense.


  Jonah countered that Maya is importing modern distinctions that Descartes wouldn''t
  recognize. He argued that for Descartes every mental state—sensation included—is
  a mode of thinking (a mode of res cogitans). Since animals entirely lack res cogitans,
  there is literally no mental state occurring in them, conscious or otherwise. The
  pineal gland in a human receives impressions because it is united to a soul; in
  an animal, the gland moves mechanically but there is no recipient. Therefore the
  yelp of a struck dog is purely an acoustic reflex, mechanistically determined, with
  no inner qualitative character whatsoever. Jonah added that if Descartes had allowed
  animal sentience, his defense of experimental practices on live animals would be
  morally incoherent, and he claimed that Maya''s reading collapses Descartes''s sharp
  dualism into a kind of proto-functionalist confusion.


  Maya replied that Jonah is conflating moral practice with philosophical commitment—Descartes
  might simply have denied moral status to beings without rational souls regardless
  of whether they suffer. More importantly, she said Jonah treats "mode of thought"
  too expansively. She proposed that we should read Descartes as holding a kind of
  "phenomenal zombie" thesis about animals: they are behaviorally and physiologically
  identical to sentient beings but lack phenomenal consciousness altogether. On her
  view, this is different from saying they have "unconscious feelings"; rather, they
  have the functional and bodily correlates of feeling without any subjective experience.
