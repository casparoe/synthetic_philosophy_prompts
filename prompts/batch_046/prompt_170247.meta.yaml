  "The doctrine of double effect, classically formulated by Thomas Aquinas and developed
  in modern ethics by Philippa Foot, permits actions that cause serious harm only
  when four conditions hold: the act is morally good or neutral; the bad effect is
  foreseen but not intended; the bad effect is not a means to the good effect; and
  the good effect is proportionate to the harm. Foot illustrates this with the trolley
  problem: diverting the trolley to a side track where one worker dies is permissible
  because the death is an unintended side effect of saving five, whereas pushing a
  large person onto the tracks to stop the trolley is impermissible because his death
  is the causal means of saving the others.


  James Rachels challenges the killing/letting-die distinction through the Smith and
  Jones cases. Both nephews stand to inherit if their cousin dies; Smith drowns the
  child in a bathtub, while Jones waits for the child to drown and does nothing. Rachels
  argues that since both agents share the same intention and produce the same outcome,
  there is no morally relevant difference between killing and letting die. This symmetry
  thesis directly undermines the doctrine of double effect, because if allowing harm
  is morally equivalent to causing it, then the permission to foresee harm in the
  trolley switch case collapses into permission to intend harm, provided the outcome
  is favorable.


  However, this critique misses the structure of Foot''s argument. Foot distinguishes
  cases not by whether the agent physically moves, but by whether harm is instrumentalized.
  In both the Smith and Jones cases, the cousin''s death is instrumentalized to achieve
  inheritance, so Foot''s means-end condition applies identically. Therefore, Rachels''
  examples actually fall outside the scope of the doctrine, which governs cases where
  harm is a side effect of achieving an independent good. Once we recognize that Foot''s
  framework relies on direct versus indirect agency rather than on the action/omission
  boundary, Rachels'' symmetry thesis is neutralized. Consequently, a physician who
  withholds life-saving treatment with the foresight but not the intention of death
  is still distinguishable from one who administers a lethal injection, because in
