  formal compensation mechanisms, or policy mandates—that would transform these acts
  into baseline obligations or collective responsibilities. The result is that the
  space between ordinary duty and exceptional virtue is not merely observed but actively
  maintained. The supererogatory framing functions to praise individual moral excellence
