  Prompt draft:


  Consider the disagreement between two friends, Elena and Marcus, about whether visitors
  to a foreign city have moral obligations to observe local everyday conventions—specifically
  tipping norms, queueing practices, and rules against jaywalking.


  Elena''s position is that these conventions generate genuine moral obligations for
  anyone present, including temporary visitors. She argues that tipping, queueing,
  and obeying pedestrian signals are not mere etiquette but coordination mechanisms
  that protect vulnerable parties—service workers depend on tips for wages; queueing
  protects people who arrived earlier; traffic rules protect pedestrians. A visitor
  who ignores them exploits a system they benefit from without contributing to its
  stability. Elena allows that the obligation is weaker when the convention is genuinely
  opaque, but she claims that in most urban settings these norms are visibly signaled,
  so ignorance is rarely excusable.


  Marcus rejects this. He distinguishes between conventions that protect basic rights
  and those that are purely local coordination devices. He grants that queue-jumping
  can wrong someone if it violates a fair-ordering scheme they depend on, but he insists
  that tipping percentages are arbitrary cultural artifacts—there is nothing wrong
  with leaving 15 percent in a 20-percent culture if one genuinely didn''t know—and
  that jaywalking in an empty street harms no one. Marcus introduces a further idea
  he calls "normative tourism": treating every local practice as morally binding on
  outsiders collapses moral judgment into cultural obedience, and it imposes unreasonable
  epistemic burdens on travelers. He adds that locals themselves often excuse visitors
  for small breaches, which suggests the obligations are not genuinely moral but social,
  enforced by embarrassment rather than justice.


  Elena responds in three moves. First, she says Marcus''s "normative tourism" charge
  misfires: recognizing local obligations is not cultural obedience but respect for
  the institutional context one has entered. Second, she points out that Marcus''s
  harm-based criterion is too narrow—moral obligations can exist even when no individual
  is harmed, because they sustain collective goods like public trust in pedestrian
  rules or wage stability in service industries. Third, she argues that the fact that
  locals excuse visitors is compatible with there being a real obligation; forgiveness
  presupposes a wrong.


  Marcus answers each point. To the first, he says entering a place does not entail
  consenting to all its arbitrary rules—no one signs a contract to tip 20 percent.
  To the second, he concedes that sustaining collective goods can generate obligations,
  but he demands a principled line: if every convention that sustains some collective
  good binds visitors, then visitors are obligated to learn every local custom, which
  is implausible. To the third, he distinguishes forgiveness that presupposes wrong
  from politeness that treats a breach as harmless; he claims the latter is what actually
  happens with tipping and jaywalking.


  Please adjudicate this exchange point by point. For each of Elena''s three moves
  and each of Marcus''s three responses, rate whether the move is clearly mistaken,
  mostly correct but incomplete, or clearly right, and briefly justify your rating.
  Then say who is more right overall, specifying exactly where each party is correct
  and where each overreaches. Finally, identify what both are missing—whether there
  is a principled distinction between conventions that bind visitors and those that
  don''t, and whether that distinction turns on the convention''s visibility, its
  connection to harm, or something else entirely. Be honest about whether the dispute
  risks stalling because neither party has offered a criterion that distinguishes
  genuine moral obligations from mere social expectations without collapsing into
  either universalism or pure relativism.


