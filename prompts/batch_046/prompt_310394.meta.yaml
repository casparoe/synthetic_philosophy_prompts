  to redirect a trade fleet—are causally inert in the same way that a single wave
  is inert with respect to the tide. They are not false, but they belong to the level
  of histoire événementielle, which Braudel explicitly treats as superficial. Therefore,
  to explain the decline of a Mediterranean power primarily through the personality
  of a ruler is a category error: it mistakes the foam for the current.


  (2) B objected that this reading makes Braudel''s own practice incoherent. Braudel
  spends hundreds of pages narrating Philip II''s insomnia, his bureaucratic micromanagement,
  and his religious obsessions. If individual agents were genuinely causally negligible,
  there would be no historiographical justification for such granular biography within
  a structural study. B concluded that Braudel does not eliminate agency but relocates
  it: the event-level is not illusory, it is simply subordinate.


