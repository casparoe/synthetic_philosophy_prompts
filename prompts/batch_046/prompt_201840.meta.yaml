  Let''s pick rules clearly:

  Rule 1: The Reliance Principle. A promise binds if and only if it was made seriously
  and generated legitimate reliance in a specific other party; it dissolves when that
  party no longer exists or the reliance is impossible.

  Rule 2: The Commitment Principle. A promise binds if and only if the promisor seriously
  exercised normative power to create an obligation; it binds regardless of whether
  anyone actually relied, but it requires personal authorship and can be dissolved
  only by the conditions specified in the commitment itself or by mutual release.

  Rule 3: The Practice Principle. A promise binds within the normative framework of
  an established social practice (contract, family, institution); its force depends
  on the rules of that practice, not on individual psychology.


