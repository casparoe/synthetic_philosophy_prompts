  For my political philosophy seminar I need to check whether my own view on the separateness
  of persons is coherent. Here is where I stand:


  1. I accept prioritarian aggregation: benefits carry more weight when they go to
  people who are worse off, but I think this needs only ordinal well-being rankings,
  not cardinal comparison across persons.

  2. I take the metaphysical separateness claim seriously: there is no collective
  consciousness or group-subject of experience, so "total welfare" is not a real property
  of a population.

  3. From (2) I draw a normative conclusion: we should never sum moral reasons across
  individuals; evaluation should stay pairwise or individual, never aggregated.

  4. In symmetric rescue cases—say, five equally needy strangers versus one—I think
