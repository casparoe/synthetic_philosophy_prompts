  Design a 90-minute structured simulation for an upper-level undergraduate philosophy
  seminar of about fifteen students. The activity should make participants feel the
  force of Blaise Pascal''s argument about justice and force—specifically, that justice
  without power is ineffectual, power without justice is tyrannical, and because justice
  is inherently disputable while force is unmistakable, societies tend to treat whatever
  is enforced as if it were just, producing what Pascal calls the mystical foundation
  of authority. Do not lecture on Pascal beforehand; participants should encounter
  the dynamics themselves.


  Structure: divide students into roles—twelve citizens with differing private conceptions
  of fair distribution, three rotating "magistrates" who alone can enforce allocations,
  and one "chronicler" who records justifications. Over three rounds (resource abundance,
  scarcity, crisis), citizens propose distributive rules that require near-unanimous
  agreement to become binding, while magistrates can impose any allocation unilaterally
  but risk rebellion if citizens coordinate refusal. Payoffs are symbolic: citizens
  accumulate "legitimacy points" when enforced rules match their private conception,
  "stability points" when order is maintained regardless, and "revolt points" when
  they coordinate against a magistrate. The hidden design feature is that unanimous
  agreement is structurally impossible after round one because private conceptions
  diverge irreducibly; thus magistrates always eventually govern by imposition, and
  citizens begin retroactively justifying the imposed rules as fair to avoid cognitive
  dissonance.


