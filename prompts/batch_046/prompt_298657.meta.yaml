  the idea of "hinge migration" — propositions can move between being hinges and being
  beliefs within a framework. She says Wittgenstein allows for this with the riverbed
  metaphor (some parts are rock, some sand). So "the earth is old" is a hinge for
  geologists but was a belief for 19th-century scientists debating it.


