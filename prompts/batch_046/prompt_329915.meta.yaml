  sovereignty, meaning the agent''s authority to determine the explanatory and normative
  framing of her own actions. On this view, the harm of being watched is not merely
  that hidden facts become visible, but that the observer appropriates the narrative
  structure of the observed life, reclassifying gestures, routines, and relationships
  within an alien interpretive scheme. The observed agent does not just lose concealment;
  she loses ownership of the meaning of her behavior.


