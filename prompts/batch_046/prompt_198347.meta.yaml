  "Question: Many economists say that honoring sunk costs is irrational because rational
  choice should depend only on future costs and benefits. However, some philosophers
  distinguish ''instrumental'' rationality—which selects means for given ends—from
  ''archival'' rationality, which treats past commitments as constitutive of one''s
  practical identity and therefore as constraining present choice regardless of future
  payoff. Is honoring sunk costs always irrational, or can archival rationality justify
  it in certain cases? Defend your view."


