  future outcomes should matter. Archival rationality, by contrast, is essentially
  a psychological bias: it is the emotional reluctance to ''waste'' effort, which
  decision theorists have shown is a cognitive error. Because all non-instrumental
  reasoning about past costs is just this bias, archival rationality never provides
  a genuine justification. Therefore, honoring sunk costs is always irrational. Even
  if a commitment feels central to one''s identity, that feeling is not a rational
  reason; as classical utilitarians maintain, rationality requires maximizing expected
  future utility. Hence there are no exceptions."


