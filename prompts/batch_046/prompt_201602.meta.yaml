  I''m working through Plutarch''s Parallel Lives for a course on ancient biography,
  and I keep returning to a tension that the standard account of moral exemplarity
  doesn''t seem to cover. The usual story — whether drawn from Aristotelian imitation
  or from later hagiographic tradition — assumes that a biography teaches by offering
  a single life as a more or less coherent template: the reader is meant to absorb
  the subject''s virtues, recognize the vices, and adjust accordingly. Plutarch, however,
  does not present isolated lives; he pairs a Greek and a Roman figure and closes
  each pair with a direct comparison of their characters and fates. In the pairing
  of Alexander and Julius Caesar, for example, both men display extraordinary political
  and military genius, both suffer from what Plutarch treats as a kind of overreaching
  ambition that leads to violence and early death, and neither emerges as a clear
  moral superior. The comparison does not resolve the tension; it sharpens it.


  What I want is an analysis of this specific pairing through the lens of moral-learning
  theory and the distinction between biography and hagiography. If moral learning
  from lives works by providing an exemplary model, then Plutarch''s comparative structure
  seems to defeat its own purpose: the reader is offered not one template but two
  flawed ones, structurally similar yet culturally distinct, and the appended comparison
  invites judgment rather than imitation. Does the theory of exemplarity have resources
  to explain how a reader is supposed to learn from two simultaneous, imperfect exemplars?
  Or does the pairing expose a gap in the theory — perhaps a missing concept for what
  we might call comparative moral calibration, where the value lies not in copying
  either figure but in measuring the distance between them? I am also interested in
  where the theory is silent: hagiography tends to suppress the subject''s failures
  to preserve exemplarity, yet Plutarch includes Alexander''s drunken rage and Caesar''s
  monarchical pretensions prominently. Does this mean Plutarch is not practicing hagiography
  at all, or does it mean that hagiography can accommodate negative exemplarity in
  a way the standard theory hasn''t recognized? And finally, what does this episode
  show about the theory itself — is the comparative biography an anomaly that undermines
  the claim that lives teach morality, or does it reveal that the theory was always
  implicitly about pairs and contrasts rather than solitary heroes?


