  it attempts to ground its own falsity in itself, producing a vicious circularity;
  consequently it is ungrounded, and neither true nor false.

  (3) I hold that bivalence is a law governing all statements with a determinate semantic
  status; the Liar lacks such status because its grounding conditions fail, so bivalence
  does not apply here—this is a precondition failure, not an exception.

  (4) I accept the unrestricted T-schema ("S is true iff S") for every sentence, including
  the Liar; applying it yields a direct contradiction, which I take to be real and
  deep, not something to be dissolved by Tarskian hierarchy or syntactic restriction.

