  After a long argument last night with a friend about higher-order evidence and epistemic
  akrasia, I find myself holding the following package of views, and I want to know
  whether they actually cohere.


  First, I hold that epistemic akrasia—believing P while judging that one''s total
  evidence does not support P—is always irrational; rational belief must align with
  one''s all-things-considered assessment of the evidence.


  Second, I think that in cases of peer disagreement with someone I regard as equally
  competent and well-informed, I should often suspend judgment or split the difference,
  even when I can fully trace and reject the specific errors in my peer''s reasoning.
  The bare fact of disagreement functions as higher-order evidence about my own reliability,
  and I should not treat my confidence in my error-detection as immune from that symmetry-breaking
  pressure.


  Third, if I learn that my belief in some proposition was produced by a recognized
  cognitive bias—say, motivated reasoning or an availability cascade—and I have no
  independent mechanism for correcting that bias, I should reduce my confidence in
  the proposition, regardless of whether the particular arguments I originally advanced
  for it still appear intact.


  Fourth, I want to resist what I take to be an illegitimate bootstrapping move: I
  should not discount my belief-forming processes solely on the basis of higher-order
  evidence that is delivered by those very processes themselves. If the only access
  I have to the claim that I am unreliable in domain D is through the cognitive machinery
  whose reliability is in question, that doubt undermines itself and should not be
  treated as legitimate grounds for revision.


  Fifth, I think rational belief assessment should be invariant under the chronological
  ordering of considerations: if the same body of first-order and higher-order evidence
  is available, it should not matter whether I happen to think about my own fallibility
  before or after I evaluate the arguments for P.


  My friend insisted that (2) and (4) pull in opposite directions—one demands that
  I take disagreement seriously as external higher-order evidence, the other blocks
  internal self-doubt—but I am not sure that is a real conflict rather than an apparent
  one. She also suggested that (1) and (3) together commit me to a form of akrasia
  in disagreement cases, since (2) seems to require me to withhold belief even when
  my all-things-considered judgment (including the disagreement) still favors P. Meanwhile,
  (3) and (4) seem to leave me with almost no legitimate route to self-correction:
  (3) demands revision upon bias detection, but (4) makes such detection rarely legitimate
  unless it comes from outside the system, which in introspective cases it rarely
  does.


  So: is this a consistent package? Which commitments genuinely conflict, which tensions
  dissolve on closer inspection, and what is the cheapest way to restore coherence—what
  does it cost me? I am not signaling which view I am prepared to abandon; I want
  an audit of what commits me to what.


