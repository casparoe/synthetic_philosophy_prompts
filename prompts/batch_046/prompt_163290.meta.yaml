  Text:


  After thirty-two years in experimental low-temperature physics, I have lately turned
  to philosophy of science and find myself returning to the Judy Benjamin puzzle about
  belief revision under conditionals. I want to know whether learning a conditional
  relationship—without learning that its antecedent or consequent actually holds—should
  ever shift one''s prior probabilities over the conditions, and if so by what rule.
  To test my own intuitions, I have constructed several concrete cases and ask whether
  they fall under one principle or reveal an inconsistency I must resolve.


  Here are my verdicts. In the first case, a meteorologist assigns equal prior credence
  to a pressure front being north or south; she then learns the precise mapping—north
  produces heavy rain in valley A and none in B, south produces the opposite—without
  observing either valley. I feel her north-south credence should stay exactly balanced.
  In the second, a physician begins with 30 percent belief that a patient carries
  gene X; she then learns that drug D cures if X is present and harms if absent, but
  has not tested the patient. Again I think the 30 percent should be untouched. In
  the third, a historian starts at 40 percent belief that a treaty was signed secretly;
  archival work establishes both that an economic collapse followed and that a public
  signing would have prevented it through institutional safeguards. Because collapse
  occurred, she revises her secret-signing credence up to 60 percent. In the fourth,
  I imagine my old laboratory: I hold 60 percent confidence that an isotope is unstable,
  learn that instability implies decay counts above five per minute while stability
  implies counts below, but my counter is broken so I observe nothing. Here too I
  want the 60 percent to remain unchanged.


  The tension, then, is between my refusal to shift in the meteorologist, physician,
  and laboratory cases and my willingness to shift in the historian case. Is the difference
  genuinely structural—perhaps turning on whether the consequence is observed, or
  on whether the conditional is indicative versus counterfactual—or is it merely an
  unprincipled asymmetry? Please state the simplest principle that captures as many
  of these verdicts as possible, indicate explicitly which one I should overturn if
  simplicity demands it, and apply your account to a further scenario: a geologist
  assigns 55 percent credence to an active fault line, learns that if the fault is
  active seismic noise displays a particular spectral peak, but can detect that peak
  only through intermittent, noisy measurements. If she registers the peak once in
  ten attempts, should her credence in the active fault shift, and according to what
  logic?


