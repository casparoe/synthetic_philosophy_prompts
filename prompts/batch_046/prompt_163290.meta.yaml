  I spent thirty-two years as an experimental physicist working on low-temperature
  detectors, and since retiring I have been trying to understand why the philosophy
  of science treats belief revision so differently from the calibration protocols
  I used in the lab. In particular, I have been puzzling over the classic Judy Benjamin
  scenario and its general lesson for updating on conditionals: when an agent learns
  not that some fact holds, but that a particular conditional relationship holds,
  how should her prior probabilities over the antecedent conditions shift?


  Here are my gut reactions to several cases, and I am hoping you can tell me whether
  one coherent principle governs them all, or whether I must sacrifice one verdict
  for simplicity.


  First, imagine a meteorologist who initially assigns equal credence to a pressure
  front being north or south of her station. She then learns the precise conditional
  rule: if the front is north, rainfall will be heavy in valley A and absent in valley
  B; if south, the reverse holds. She has not observed either valley''s rainfall.
  My intuition is that her credence in north versus south should remain exactly balanced—learning
  the mapping should not nudge the prior.


  Second, a physician starts with a 30 percent belief that her patient carries gene
  X. She reads a study establishing the conditional: if X is present, drug D is curative;
  if absent, D is lethal. She has not yet tested the patient. Here again I feel the
  30 percent should stay put; the conditional warns her about action, but it does
  not itself provide evidence about X''s presence.


  Third, a historian investigating a treaty initially thinks it was signed in secret
  with 40 percent credence. Archival work reveals not only the economic collapse that
  followed, but also a robust conditional link: had the signing been public, institutional
  safeguards would have prevented collapse. Because collapse did occur, she revises
  her belief in the secret signing upward to 60 percent. In this case the observed
  consequence seems to license an update on the antecedent through the conditional.


  Fourth, in my own old domain, suppose I believe with 60 percent confidence that
  an isotope is unstable. I learn that if it is unstable, decay counts exceed five
  per minute, and if stable they do not. The counter is broken, so I observe no count.
  I feel my 60 percent should be untouched.


  Yet I notice a tension: in the meteorologist and physician cases I resist any shift,
  but in the historian case I embrace one, and I am unsure whether the difference
  is genuinely structural—perhaps involving whether the consequence is observed—or
  merely an inconsistency in my judgment. Is there an account of conditional updating—whether
  Jeffrey''s kinematics, a distinction between indicative and subjunctive conditioning,
  or some other framework—that delivers all four verdicts? If not, which of my reactions
  should be overturned? And please apply whatever principle you defend to a further
  case I have been turning over: a geologist who assigns 55 percent credence to an
  active fault line, learns that if the fault is active then seismic noise exhibits
  a particular spectral peak, but can observe that peak only through intermittent
  and noisy measurements. If she detects the peak once in ten attempts, should her
  credence in the active fault shift, and by what logic?


