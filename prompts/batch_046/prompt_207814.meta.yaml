  treat the induction chain as a physical transmission problem. In physics, a signal
  can be locally intact at every node and yet fail to propagate globally if there
  is any attenuation or noise in the coupling. Applied to the centipede game, this
  suggests a possibility that neither camp fully addresses: that each player might
  be fully rational locally—assessing payoffs correctly at each node—while the global
  induction fails not because anyone is irrational, but because the common-knowledge
  condition requires a kind of perfect, lossless transmission of rationality across
  stages that is structurally fragile. Defenders of immediate defection seem to assume
  that if rationality holds at every point, it must hold globally; critics seem to
  assume that any failure of global induction proves local irrationality. I have not
  found a term for this middle position, if it exists, and I wonder whether the stalemate
  is partly due to both sides implicitly treating rationality as an all-or-nothing
  global property rather than a locally distributed one.


