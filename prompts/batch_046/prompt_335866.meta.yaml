  and Pareto efficiency in collective preference aggregation—but I want the proposal
  to inject a genuinely niche framing that prevents a generic literature review. Specifically:
  apply the paradox not to individual consumer choice, but to multi-stakeholder governance
  of large-scale AI systems, where ''minimal liberty'' means granting each stakeholder
