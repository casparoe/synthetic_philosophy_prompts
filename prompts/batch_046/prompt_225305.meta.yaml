  between two camps that have argued past each other.


  Camp A—call them the Integrative Functionists—holds that these four narratives serve
  a necessary ''social homeostatic'' function (by analogy to physiological homeostasis):
  they stabilize collective identity across the trauma of defeat, provide moral exemplars
  of resilience, and allow pluralistic societies to integrate descendants of both
  victors and vanquished without requiring constant historical litigation. They maintain
  that the proper evaluation of such a narrative is not its correspondence to archival
  fact but its current capacity to sustain democratic cohesion without suppressing
  minority voices, and that attempts to dismantle these myths typically produce not
  enlightenment but reactive polarization.


  Camp B—call them the Mnemonic Justice advocates—holds that these narratives are
  structurally falsifying: they systematically suppress the central atrocity (chattel
  slavery in the Confederate case, the exclusion of Palestinian and other non-Jewish
  narratives in Masada''s militarization, ethnic cleansing in the Kosovo myth, imperial
  overreach in the Dunkirk framing) and convert defeat into a morally privileged martyrdom.
  They maintain that collective identity should be rebuilt through critical commemoration
  that records defeat without mythologizing it, and that the social cohesion produced
  by such myths is always purchased at the expense of marginalized groups and therefore
  cannot be weighed on the same scale as historical accuracy.


