  Cause,'' the Masada siege narrative in modern Israeli national identity, the Kosovo
  Field mythology in Serbian nationalism, and the British ''Dunkirk spirit'' as a
  narrative of deliverance from catastrophic retreat. I want to understand whether
  these narratives are best evaluated by their historical fidelity or by some other
  metric.


