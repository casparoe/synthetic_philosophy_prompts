  Here is the exchange:


  (1) Elena argues that subsidiarity is structurally non-justiciable. The core question—whether
  an objective can be ''better achieved'' at the central or local level—is an empirical
  and normative comparison that courts lack both the democratic mandate and the institutional
  competence to perform. She notes that the German Federal Constitutional Court has
  almost never struck down federal legislation solely for violating the ''necessity''
  clause in Article 72(2) of the Basic Law, treating it instead as a guideline for
  the legislature.


  (2) Jonas responds that non-justiciability is conflated with difficulty. Courts
  routinely apply open-ended, empirically loaded balancing tests—proportionality,
  reasonableness, necessity in strict constitutional review—without being accused
  of usurpation. He points out that Article 5(3) of the Treaty on European Union is
  explicitly justiciable and has been raised in judicial proceedings, which proves
  that subsidiarity is not categorically outside judicial competence.


  (3) Elena counters that in practice EU courts avoid the substantive comparison altogether.
  Rather than asking whether member-state action is genuinely inadequate, they review
  whether the Commission conducted an impact assessment or considered local capacities—what
  she calls ''procedural hollowing.'' This transforms subsidiarity into a box-checking
  exercise, confirming her claim that courts cannot or will not engage the principle''s
  core comparative logic.


  (4) Jonas accepts that current practice is procedural but proposes a ''substantive
  subsidiarity standard'': courts should require the center to demonstrate not merely
  that decentralized action is insufficient, but that centralization produces measurably
  superior outcomes relative to its democratic cost. He concedes this standard is
  demanding and rarely met, but insists that without such a substantive benchmark,
  subsidiarity collapses into a rhetorical rubber stamp that legitimizes any centralization
  accompanied by paperwork.


