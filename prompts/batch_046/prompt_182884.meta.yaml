  Student answer:

  "Hart addresses the coercive-command objection in The Concept of Law by arguing
  that every functioning legal system must include a ''minimum content of natural
  law''—rules against violence, theft, and deception, together with some protection
  of property and promises. He derives these not from moral intuition but from empirical
  generalizations about human vulnerability, limited altruism, and the need for social
  cooperation. Because these constraints are universal prerequisites for group survival,
  they appear in every legal system, yet they remain contingent facts about human
  nature rather than necessary moral truths. Consequently, Hart maintains the separation
  of law and morality: law can be identified through the rule of recognition without
  appealing to substantive moral criteria, even though the content of law will usually
  overlap with basic morality.


  Fuller, in The Morality of Law, offers a different defense. He proposes that law
  possesses an ''inner morality'' made up of eight procedural conditions—generality,
  promulgation, non-retroactivity, clarity, consistency, feasibility of compliance,
  stability over time, and congruence between official action and declared rules.
  Fuller argues that a system that systematically violates these conditions fails
  not merely as an efficient mechanism of social control but fails to be law in the
  first place, since it cannot guide human action in a manner consistent with respect
  for human agency. This looks like it collapses the separation thesis, but Hart responds
  in his postscript that Fuller''s conditions are really just conditions of efficacy:
  if rules are secret or contradictory, people cannot follow them, so the system will
  not achieve general obedience. Thus Hart treats Fuller''s internal morality as an
  instrumental requirement for any coercive system to work, not as a moral constraint
  on legal validity.


