  seminar" or "a review article"). The summary should say something like:


  "Epistemic akrasia is just the belief-version of weakness of will: you judge that
  p is false, but you go ahead and believe p anyway because it feels right. Higher-order
  evidence—like learning that you''re sleep-deprived—always gives you reason to reduce
  confidence in your first-order beliefs, because it directly undermines the reliability
  of the mental process that produced them. So if you receive higher-order evidence
