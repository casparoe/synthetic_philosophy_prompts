  in words—that I can apply to any essay in under eight minutes, working alone at
  my desk. The protocol should specify:


  - the questions to ask in strict order;

  - what counts as a sufficient answer to each (the ''pass'' condition);

  - the exact point at which the protocol stops and returns a ''no Whig flag'' verdict;

