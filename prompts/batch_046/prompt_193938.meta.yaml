additional_instructions:
  length: Write a relatively elaborate prompt (one to three paragraph, even for a
    straightforward question that could be asked in a single sentence). You can add
    various not-super-relevant detail a la, "I was discussing with my friends...",
    "I'm taking a course on X and find Y confusing." Depending on the task type, you
    can also consider giving some seeding. For instance, if your prompt is requesting
    a short story, you could describe the setting of the story.
  persona: Write the prompt from the perspective of someone without any academic background
    who has been thinking about the topic on their own.
  writing_style: Write a relatively formal/polished prompt.
  epistemic_request: Have the asker request that the response say how confident it
    is in what it claims and single out the point it is least sure of.
  output_format: Have the asker request that the response lead with its bottom line
    in the first sentence and then give the reasoning, with no preamble and no restating
    of the question. If your type of prompt asks for a piece of writing rather than
    an answer, ask instead that the response begin with the piece itself, with no
    preface or commentary.
