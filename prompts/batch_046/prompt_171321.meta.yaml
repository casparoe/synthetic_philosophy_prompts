  Having spent thirty years in experimental physics before turning to philosophy,
  I find myself puzzled by a methodological convention that seems ubiquitous in consciousness
  science and clinical neurology, yet rarely defended in philosophical terms. In both
  laboratory and bedside settings, consciousness is operationalized almost exclusively
  through explicit report: a subject is shown a near-threshold stimulus and asked
  to indicate whether she saw it; in disorders-of-consciousness assessment, the absence
  of command-following or verbalization is taken as strong evidence for the absence
  of awareness, even when autonomic or behavioral markers suggest otherwise. What
  strikes me as particularly telling is the auxiliary rule—common in masked-priming
  and rapid-presentation protocols—that reports arriving outside a brief temporal
  window (often on the order of a few hundred milliseconds) are discarded or downgraded,
  on the grounds that they represent post-hoc narrative reconstruction rather than
  direct readout from an inner stage. Meanwhile, the same disciplines freely acknowledge
  subliminal priming, blindsight, and implicit learning, in which stimuli clearly
  influence cognition and behavior without ever being reported.


  What philosophical commitments about the nature of consciousness does this institutional
  practice presuppose? Does it implicitly commit to what Dennett calls a Cartesian
  theater—a single, unified locus where information is presented to an inner observer,
  with reportability serving as the direct proxy for presence on that stage? Or could
  a proponent of Dennett''s multiple drafts model accommodate the practice by treating
  verbal report as merely one competing draft among many, without privileging it as
  the authoritative broadcast? I would like you to reconstruct the implicit metaphysics
  and epistemology: does the binary classification of trials into "seen" and "unseen,"
  together with the temporal-window exclusion rule, presuppose that there is a definite
  fact of the matter about whether a particular draft occupied the central stage at
  a specific time? And is the practice philosophically consistent with its own acknowledgment
  of non-reported influence—does that acknowledgment force a distinction between "pre-conscious"
  processing and "conscious but unbroadcast" drafts, or does it simply reveal that
  the practice is underdetermined?


