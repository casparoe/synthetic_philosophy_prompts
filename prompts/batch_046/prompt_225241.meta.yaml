  required for the Löbian collapse. By contrast, I claim that a system with Searle-style
  original intentionality, where the semantic content is intrinsic to the biological
  state and not mediated by a separate interpreter, lacks this modular buffer and
  therefore faces the obstacle in a more acute form—though I stop short of claiming
  that biological minds actually solve it, only that they do not solve it by the same
  architectural means.


  I have sketched three premises: first, that derived intentionality requires an interpreter
  whose content-ascriptions are not themselves governed by the same derivational rules
  as the base system; second, that self-trust requires treating one''s future reasoning
