  Next month I am defending, in an interdisciplinary seminar, a thesis about contingency
  and chaos in history. The audience will be mostly cliometricians and quantitative
  historians, together with one complex-systems physicist who understands strange
  attractors but is deeply suspicious of metaphorical physics in the social sciences,
  and a philosopher of science with rationalist-blog sympathies who cares about unfalsifiability
