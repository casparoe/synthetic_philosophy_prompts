  narrative misapplies chaos theory by treating macrohistorical outcomes as if they
  share the same sensitivity to initial conditions as weather systems, without specifying
  the scale or domain of divergence. I propose that institutional path dependence
  behaves like a dissipative dynamical system with bounded strange attractors: small
  perturbations—say, a lost shoe—are usually absorbed within a constitutional basin,
  but if they cross a critical "counterfactual granularity threshold" they can trigger
  a basin switch to a qualitatively different institutional equilibrium. Hence contingency
  is real but structurally constrained; historians should replace the parable with
  an explicit model of which perturbations are noise inside an attractor and which
  are genuine bifurcation points. I want a Q&A prep sheet for this specific room.
  Order the objections by the damage they would do if I fail to answer them, and phrase
  each in the vocabulary its likely speaker would use: the cliometrician demanding
  measurable variables and predictive tests; the physicist questioning whether social
  dynamics meet the determinism and continuity conditions for chaos; and the philosopher
  pressing on unfalsifiability and post-hoc storytelling. For each objection, note
  what I should concede up front, what I must hold, the weakest point in my reply,
  and a concise reply I can deliver in roughly two minutes. Also include the question
  I am most hoping nobody asks—likely whether my framework can identify an impending
  basin switch ex ante, or whether it only retrodicts divergence after the fact. Write
  the entire prep sheet in British English.


