  Draft:


  I''m writing a novel that moves between archaeological mystery and historical revisionism,
  and in my research I''ve developed strong gut reactions to various claims about
  the past — reactions I can''t quite justify. I''d like you to help me articulate
  the principle behind them, and to tell me honestly which of my instincts must be
  abandoned for the sake of coherence. Here are my verdicts.


  First, I regard the modern occult version of Atlantis — a literal continent in the
  Atlantic destroyed in a single cataclysm around 9600 BCE, with its capital now resting
  near the Azores — as pseudohistory, despite Plato''s geographical specificity. By
  contrast, I treat the interpretation of Plato''s Atlantis as a philosophical allegory
  about imperial hubris, with no intended historical referent, as entirely legitimate
  scholarship. I place the "ancient astronaut" explanation for the precision of the
  Great Pyramid or the Nazca lines — the idea that extraterrestrial engineers guided
  construction — firmly in pseudohistory. So too, in my view, is Anatoly Fomenko''s
  New Chronology: the claim that recorded history before roughly the eleventh century
  is largely a duplicated fabrication, that the Crusades and the fall of Constantinople
  are mirror-images of the same medieval events, and that Roman imperial chronology
  should be collapsed into a far narrower span.


  Yet I do not dismiss all chronological or technological revision. I think Göbekli
  Tepe''s monumental carved pillars, erected by pre-agricultural societies, legitimately
  challenge older evolutionary models that assumed complex social organization required
  farming first. I also accept that the Antikythera mechanism demonstrates a Hellenistic
  gear technology that was not recovered for over a millennium, and that this implies
  a lost tradition of practical engineering rather than a fantasy. Similarly, I am
  inclined to think the Trojan War reflects a real late-Bronze-Age conflict over a
  strategic Anatolian location, despite Homer''s heavy mythologization — an extraction
  of kernel from narrative that I treat as sound method.


  But these judgments sit uneasily with one another. Both Plato''s Atlantis and Homer''s
  Iliad are literary texts that embed specific geographic and political details; both
  are used by popular writers to argue for a "hidden" historical event behind the
  myth. I reject the extraction in one case and accept it in the other, and I want
  to know whether there is a defensible principle that justifies the split, or whether
  I am simply being inconsistent. The same tension appears with "lost knowledge."
  I dismiss the idea that pyramid geometry encodes mathematical constants — such as
  approximations of pi or the golden ratio — that Egyptians could not have documented,
  seeing this as pseudohistorical numerology. At the same time, I regard the hypothesis
  that the Egyptians employed an internal-ramp construction technique now lost to
  us as a legitimate open question in engineering archaeology. Both invoke knowledge
  or techniques that are not attested in the surviving record; both fill a gap with
  an unknown. I keep returning to this pair and cannot settle whether my distinction
  is principled or merely aesthetic.


  Please address this as a reflective-equilibrium exercise. I want the response organized
  in the following sections, in this order:


  1. "Inventory of verdicts" (approximately half a page): State my judgments back
  to me, grouped by the domain they concern — chronology, technology, and textual
  extraction — and flag the two pairs that seem hardest to reconcile.


  2. "The principle proposed" (approximately one page): Offer one precise principle,
  or a small family of candidates, that captures as many of my verdicts as possible.
  For each clause, cite the specific case that motivates it. Be explicit about which
  verdicts the principle saves and which it forces me to overturn.


  3. "Predictions for unlisted cases" (approximately half a page): Apply the principle
  to cases I have not mentioned — for instance, whether a claim that the Voynich manuscript
  encodes a lost natural language rather than being a hoax should be treated as legitimate
  open inquiry or pseudohistory, and whether a theory that shifts the founding of
  Rome by several generations based on calendar discrepancies belongs with Fomenko
  or with Göbekli Tepe.


  4. "Which verdict must be revised" (a concise section): Give your honest judgment
  about the tension I keep returning to — the split between lost practical knowledge
  and lost mathematical culture, or between extracting history from Plato and from
  Homer. Tell me which side of the pair should yield if consistency demands it.


  Write formally, and do not include bibliographies, reading lists, or citations that
  a reader without web access could not verify. I am not asking for a survey of the
  literature, but for a conceptual audit of my own commitments.


