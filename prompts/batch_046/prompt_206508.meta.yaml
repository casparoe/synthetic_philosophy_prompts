  principle or whether I am holding them together inconsistently. Here they are.


  First, the Trojan War. The Hittite diplomatic archives of the late thirteenth century
  BCE refer to Wilusa and Ahhiyawa in terms that align with Homeric geography; the
  destruction layer at Hisarlik dated to roughly 1180 BCE provides a material correlate
  for a violent end to a fortified western Anatolian settlement; and the Greek epic
  tradition preserves specific place-names and political relationships that do not
  seem invented from nothing. My verdict: there is a genuine historical kernel—an
  actual conflict involving that settlement—even though the wooden horse, the abduction
  of Helen, and the divine machinery are clearly later elaborations.


  Second, King Arthur. The name Artorius or Arthur appears in ninth-century Welsh
  annals and in the Historia Brittonum as a battle leader, possibly in the late fifth
  or sixth century. But these texts are separated by centuries from the events; every
  element that makes Arthur culturally distinctive—the Round Table, the Grail, the
  chivalric code, Lancelot, Camelot—emerges only in twelfth-century French romance;
  and there is no independent contemporary documentation or material trace specific
  to those events. My verdict: this does not cross into history. At most there is
  an unverifiable name embedded in origin folklore.


  Third, the Exodus. There is no Egyptian record of a mass departure of six hundred
  thousand people; archaeological surveys of the Sinai peninsula show no trace of
  large-scale encampment over forty years; yet there is evidence of Semitic laborers
  in the eastern Delta, and the Merneptah Stele attests an entity called Israel in
  Canaan by about 1208 BCE. My verdict: despite these contextual correlations, the
  Exodus remains an origin legend. Its scale and narrative structure are incompatible
  with the expected archival and material record, and the contextual parallels are
  too indirect to anchor the specific event.


  Fourth, the founding of Carthage. Phoenician settlement at Carthage is archaeologically
  attested from around 814 BCE. Roman and later traditions preserve the story of a
  Tyrian queen—Elissa or Dido—who founded the city. There is no direct extra-traditional
