  and bad faith. First, map the experimental situation onto Sartre''s distinction
  between facticity and transcendence: in what respects does the subject''s physical
  presence, the authority of the white-coated experimenter, and the scripted prods
  constitute an objective situation (facticity) that the subject can nevertheless
  transcend through refusal? Second, examine bad faith: treat the subjects'' common
  justifications—"I was just following orders," "the experiment required it," "I had
  no choice"—not as causal explanations but as strategies of self-deception by which
  they deny their own freedom and adopt the being-in-itself of an instrument. Identify
  which specific design features (the separation of victim and agent, the incremental
  nature of the task, the experimenter''s refusal to accept refusal) function, on
  Sartre''s account, as social structures that facilitate flight from the anguish
  of choice, and whether the presence of the learner''s protests should have made
  denial impossible. Third, consider the "Look" (le regard): does the experimenter''s
  gaze objectify the subject into a compliant role, and if so, how does that interact
  with Sartre''s claim that we are always free to reject the roles others assign us?
  Fourth, assess what Milgram''s own debriefing—revealing the deception and emphasizing
  the subject''s autonomy—does to the analysis: is it a therapeutic restoration of
  freedom or an admission that the experimental frame had genuinely suspended it?
