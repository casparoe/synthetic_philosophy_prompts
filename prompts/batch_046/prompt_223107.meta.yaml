  (approximately 65 percent reaching the maximum voltage) confirm Sartre''s pessimistic
  view that humans systematically flee freedom when confronted with institutional
  authority, or does it expose a limitation in Sartre''s framework—namely, that structured
  social roles and incremental commitment can create conditions under which "radical"
  freedom is phenomenologically invisible or practically inert? Be disciplined about
  the mapping: specify who is the agent, what counts as evidence of refusal, and where
  Sartre''s theory is silent rather than forced to speak. Do not ask for bibliographies,
  citations, or further reading.


