  I''m currently enrolled in a graduate seminar on Quine''s philosophy of language,
  specifically his arguments for the indeterminacy of translation and the underdetermination
  of meaning by behavioral evidence. Over the past month, our professor—who specializes
  in philosophy of science and the philosophy of mind—has ruled on a sequence of hypothetical
  field-translation scenarios, and she has assigned us a final case to predict her
  verdict before Thursday''s discussion.


  Her rulings so far have been consistent but, I think, ambiguous between two underlying
  frameworks. First, in the classic rabbit scenario—where a native speaker utters
  "gavagai" as a rabbit scurries past—she held that the term is genuinely indeterminate
  among "rabbit," "undetached rabbit part," and "time-slice of rabbit," and that no
  further behavioral observation can settle the matter. Second, when presented with
  a language containing a single term applied uniformly to emeralds, grass, and the
  sky at noon, she argued that we should translate it as "green" rather than as a
  disjunctive predicate, on the grounds that charity and our own well-confirmed taxonomy
  pull us toward attributing a unified natural property rather than an arbitrary conjunction.
  Third, in a case involving a relational term used for both older brothers and older
  sisters in a society with sharply differentiated gender roles, she insisted that
  the translation manual should split the term into two distinct relations, because
  the internal behavioral and ritual patterns provide enough structural differentiation
  to break the symmetry. Fourth, when a language lacked explicit logical connectives
  but speakers consistently rejected compound utterances in precisely those contexts
  where both constituent statements were false, she ruled that we should translate
  the implicit operator as logical conjunction rather than as a non-truth-functional
  device, again appealing to the need to preserve rational coherence.


  Now she has presented us with a new scenario, and asked us to predict her verdict
  and justify it. In this case, field linguists encounter a term, "glim," that is
  applied consistently to two apparently unrelated classes: all red-colored objects
  regardless of shape, and all round objects regardless of color, but never to blue
  squares or non-round non-red items. The natives show no special ritual, functional,
  or emotional behavior that distinguishes these two classes from each other or from
  other objects; the sorting is purely perceptual and perfectly reliable. The question
  is whether "glim" should be translated as a disjunctive predicate—"red or round"—or
  whether we should reject that translation as attributing a gerrymandered concept
  and instead postulate a hidden unifying feature (such as "visually salient") that
  we have not yet identified, leaving the term temporarily untranslated.


  Predict her verdict. Then identify which of the two frameworks—radical behavioral
