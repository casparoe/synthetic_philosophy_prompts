  I''m currently taking an upper-division seminar on collective action and moral responsibility,
  and I drafted a short-answer exam question for practice grading with a colleague.
  The prompt asks students to distinguish causal inefficacy from justificatory inefficacy
  in collective harm cases, apply it to individual carbon-intensive consumption, and
  evaluate whether Kantian universalization resolves the tension independently of
  aggregation. Below is the exact exam prompt, followed by a student''s response that
  I''m supposed to assess. I need you to act as the grader: evaluate the answer''s
  accuracy, identify subtle errors or misattributions, and justify the score. Please
  lead with your bottom line in the first sentence—state the grade (on a standard
  0–10 or letter scale) and your overall verdict—then give your reasoning point by
  point with no preamble, no restatement of the question, and no generic encouragement.


  Exam question: In discussions of large-scale collective harm—such as climate change
  or factory farming—philosophers often distinguish between causal inefficacy and
  what we might call justificatory inefficacy. First, explain what each of these means
  for an individual deciding whether to reduce carbon-intensive consumption. Second,
  if we grant that one purchase makes no perceptible difference to aggregate suffering
  or emissions, does this automatically defeat the claim that there is an individual
  moral reason to abstain? In answering, discuss whether Kant''s universalization
  procedure offers an independent resolution, being careful to distinguish contradiction
  in conception from contradiction in will, and explain whether aggregation-based
  reasoning is still necessary even if universalization succeeds.


  Student answer: Causal inefficacy means that my individual act—buying a single beef
  burger or booking one flight—does not change the total number of animals killed
  or the total carbon emitted, because supply and demand curves are too large for
  one unit to shift outcomes. Justificatory inefficacy is different: it means that
  even when I''m causally irrelevant, I still might lack a sufficient reason to abstain
  if the moral justification for the rule against the act depends entirely on aggregate
  outcomes that I don''t influence.


  Some philosophers of collective harm, including Derek Parfit, think that once causal
  inefficacy is established, the moral case for individual abstention collapses unless
  we can show that universal abstention would solve the problem. This is where Kant''s
  categorical imperative helps. The maxim of my action is that I will consume carbon-intensive
  goods for convenience despite knowing they contribute to harm. If I universalize
  this, everyone would do the same, and the climate system would become unstable—so
  the maxim contains a contradiction in conception, since it''s logically impossible
  to will a world where the maxim is universal law and the ecological conditions necessary
  for human action still hold. Because of this, I have a direct duty to abstain regardless
  of my causal role, and aggregation-based reasoning is unnecessary. In fact, universalization
  succeeds precisely because it doesn''t depend on counting individual contributions;
  it tests the maxim itself.


  That said, I think this resolution hides a problem. The universalization test asks
  me to imagine everyone acting the same way, which is itself a form of aggregation—just
  conceptual rather than causal. So Kant doesn''t really escape aggregation; he just
  moves it into the hypothetical. This means justificatory inefficacy comes back in:
  my reason to abstain still depends on what happens when everyone does it, not on
  anything intrinsic to my single act.


