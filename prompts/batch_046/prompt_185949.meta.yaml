  Let''s draft commitments:

  1. I think culture evolves just like biology, with selection and mutation and everything.

  2. But I also think people are smart and pick ideas on purpose, not randomly.

  3. I think memes are like genes: they copy themselves and compete to survive.

  4. But I don''t think there''s a physical thing that gets copied exactly, like DNA;
  it''s more like patterns that get reconstructed.

  5. I think the best ideas spread the most, so evolution tends toward truth.

  6. I think some really dumb ideas spread like wildfire, which shows it''s not about
  quality.

  7. I think Dawkins was basically right about selfish replicators, but culture is
  Lamarckian because we change ideas on purpose and pass those changes on.


