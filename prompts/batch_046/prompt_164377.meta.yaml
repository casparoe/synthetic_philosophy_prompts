  I am preparing a syllabus for a graduate seminar on the philosophy of translation,
  and I want to focus on the limiting case where poetic form is not ornamental but
  constitutive of meaning. The touchstone is Douglas Hofstadter''s Le Ton beau de
  Marot and its central object, Clément Marot''s short Renaissance poem to a sick
  young woman—commonly referred to as Ma mignonne—where rhyme, meter, and architectural
  patterns of address carry as much weight as the propositional content. I was discussing
  with a colleague whether any theory of translation that treats these formal features
  as disposable decorations can still claim to have translated the work, or whether
  it has merely produced a paraphrase with a footnote; but we kept circling without
  a clear standard. So I want you to specify, from first principles, the desiderata
  that an adequate theory of formal-constraint poetic translation must satisfy to
  count as solving the problem in this domain—not a scorecard of existing translations,
  but the criteria themselves, with the motivating case behind each.


  Please lay out the requirements such a theory must meet: the phenomena it must explain
  (e.g., how rhyme scheme and meter contribute to semantic or affective structure,
  how embedded wordplay or initial-letter patterns function, how the performative
  force of the courtly address is preserved or lost, how readers cognitively process
  formal deviation versus fidelity), the distinctions it must respect (for instance,
  between phonetic architecture and propositional content, between author-intended
  constraint and reader-perceived pattern, between translation proper and adaptive
  recreation), and the results or bodies of knowledge with which it must be consistent
  (cognitive science of poetic reading, the empirical differences in phonotactics
  across languages, and the logical point that some formal properties are language-specific
  and therefore non-transferable). For each desideratum, indicate whether it is non-negotiable—without
  which the theory fails to address the Marot-type case—or a preference of a particular
  camp (say, those who prioritize phonetic music versus those who prioritize semantic
