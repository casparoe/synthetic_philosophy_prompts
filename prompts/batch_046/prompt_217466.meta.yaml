  does not allow us to isolate a friendship or a beautiful experience and assign it
  value independently, because the value of any state of affairs depends on the relations
  among all its constituent parts. A friendship embedded in cruelty or deception might
  contribute to a bad overall whole, and a beautiful object might form part of a malicious
