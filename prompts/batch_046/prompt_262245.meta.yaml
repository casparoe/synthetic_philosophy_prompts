  altogether, so neither duty applies. I respond that if status is absent, we should
  not regulate suffering in comparable animal embryos either; yet we do, which suggests
  that the potential for sentience—rather than actual personhood—is doing the normative
  work. I conclude that the synthetic case reveals the asymmetry to be a feature of
  how harms generate obligations regardless of prior existence, not a quirk of population
  ethics.


