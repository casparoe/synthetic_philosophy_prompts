  The essay examines the procreation asymmetry—the idea that we have strong moral
  reason not to bring into existence a being who will suffer severely, but no parallel
  reason to bring into existence a being who will flourish. Rather than treating this
  as an abstract puzzle about distant possible worlds, I want to apply it to synthetic
  embryo models: biological structures generated from stem cells that have the potential
  to develop into sentient organisms but are currently maintained only in vitro and
  can be activated or terminated with precise technical control.


  My argument proceeds in three steps. First, standard accounts (drawing on the intuition
  that harm requires an actual victim, while benefit requires an actual beneficiary)
  explain the asymmetry by appealing to modal distance—the suffering person is "near
  enough" to be our responsibility, the happy one is not. Second, synthetic embryos
  collapse that distance: the potential being is not in a remote logical space but
  in an immediate technical branch, equally available for activation or non-activation.
  Third, despite this collapse, the asymmetry persists. A laboratory has a compelling
  duty not to activate a synthetic embryo that would develop into a suffering sentient
  being, but no comparable duty to activate one that would develop into a flourishing
  one—even though both are equally "possible" within the same substrate. I take this
  to suggest that the asymmetry is not really about modal proximity at all, but about
  a directional constraint on agency: introducing a negative-value state into the
  world demands justification because it creates a claimant with standing, whereas
  failing to introduce a positive-value state is merely a missed opportunity that
  creates no claimant.


