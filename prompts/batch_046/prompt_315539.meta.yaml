  public meaning at the time of enactment, and any ambiguity should be resolved by
  clear-statement canons rather than by legislative purpose. Second, purposivism:
  the provision''s scope should be calibrated to the mischief the legislature sought
  to remedy, so that the absence of an explicit origin restriction does not automatically
  extend coverage to purely domestic advocacy.


  In a well-structured response, compare how each approach would treat the application
  of Section 402(b) to a domestic political organization that uses recommendation
  algorithms to amplify messages discouraging participation in local elections. Be
  precise about the interpretive moves each approach makes, and identify any point
  at which the two methods might converge or genuinely diverge.


