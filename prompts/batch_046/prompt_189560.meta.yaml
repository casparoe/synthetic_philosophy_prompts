  Text draft:


  I''m writing up my position for a philosophy of AI seminar next week, and I''d like
  a consistency check before I present. I''ve been trying to hold together the following
  commitments about the frame problem, but I''m not sure they all cohere.


  First, I think the frame problem is best understood as an epistemic regress about
  relevance: any system that updates its beliefs by explicit rules needs a further
  rule to determine which rules apply, and that meta-rule needs its own framing, ad
  infinitum. Second, I think the only non-regressive stopping point is a form of embodied,
  skillful coping—something like Heideggerian readiness-to-hand—that determines salience
  without representing it propositionally. Third, I nevertheless hold that even these
  non-propositional engagements carry representational content in a broad, information-theoretic
  sense: they represent environmental affordances, just not via discrete symbols.
  Fourth, I take this to entail that purely disembodied symbolic architectures, including
  present large language models, face the frame problem in principle, since they lack
  the embodied dynamics that terminate the regress. Fifth, I also think that if we
  embedded the same symbolic architecture in a robotic body with continuous sensorimotor
  feedback, the problem would dissolve for that system without any alteration to its
  internal representational format. Sixth, I believe human cognition does encounter
  an analogue of the frame problem during radical context shifts—say, adapting to
  an unfamiliar cultural environment—but that we resolve it through narrative reconstruction
  rather than through predictive weighting. Finally, I maintain that all of this is
  compatible with strict physicalism: the "horizon" of salience is just a complex
  dynamical property of the brain-body system, not a non-physical substrate.


  Can you audit this package? Specifically: which pairs are genuinely in tension,
  which only look incompatible but dissolve on closer inspection, and what is the
  least costly single revision? Please rank the tensions by severity rather than listing
  them equally. Also, please say explicitly what would change your mind about the
  overall consistency—what argument or observation would convince you that one of
  these commitments must be abandoned, and where in this reasoning do you think you''re
  most likely to be wrong?


