  have shown the precursor sign, so there is a minimal alternative possibility present.
  Jordan conceded that technically yes, but argued that such a flicker—an involuntary
  neural blip that never reaches the level of action—is too insubstantial to ground
  the kind of robust "could have done otherwise" that the principle demands.


