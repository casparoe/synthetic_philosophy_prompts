  valenced aspect of such sentience. On this view, high-energy astrophysical processes—specifically,
  core-collapse supernovae—would generate suffering distributed across enormous numbers
  of field excitations, producing an aggregate moral catastrophe that dwarfs all biological
  suffering in the observable universe.


