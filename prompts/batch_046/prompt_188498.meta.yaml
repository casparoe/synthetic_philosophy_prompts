  First, they must explain how the combination problem for panpsychism bears on the
  quantitative scaling of consciousness in this scenario: does macro-level suffering
  emerge from micro-level sentiences, and if so, by what mechanism? Second, they must
  assess whether applying the concept of suffering—ordinarily anchored to macro-subjects
  with unified phenomenology—to sub-physical field excitations involves a category
  error, or whether the panpsychist is genuinely committed to such distributed suffering.
  Third, they must evaluate one specific escape route in detail: either (a) imposing
  a complexity threshold below which integrated information yields no valence, or
  (b) adopting a ''no-subjects'' account of micro-experience that denies aggregation
  into macro-subjects altogether. For the chosen route, students should argue whether
  it successfully avoids the moral-catastrophe conclusion or instead collapses into
  eliminativism about macro-consciousness.


