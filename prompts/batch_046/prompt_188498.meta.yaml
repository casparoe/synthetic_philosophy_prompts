  (e.g., constitutive versus derivative panpsychism, phenomenal binding versus causal
  integration, intrinsic versus relational properties of fields); and address the
  residue—namely, whether any moral obligation survives if macro-subjects turn out
  to be the only genuine loci of suffering, or whether the panpsychist must accept
  cosmological-scale moral duties. The marking scheme should allocate 30 marks total
  and specify the moves that distinguish an A answer from a B answer. An A answer
  must integrate all three parts with original reasoning, avoid conflating integrated
  information theory with panpsychist ontology, and recognize that the quantitative
  scaling premise is the load-bearing assumption of the moral argument. A B answer
  may accurately describe panpsychism and the combination problem but should be penalized
  if it treats the scenario as a mere reductio ad absurdum, fails to engage with the
  specific escape route, or neglects the residue question about moral obligation.
  Allow 60 minutes; require approximately 700 words."


