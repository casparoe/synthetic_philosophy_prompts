  Read F. Scott Fitzgerald''s The Great Gatsby through the evolutionary-logic framework
  of costly signaling—specifically Amotz Zahavi''s handicap principle, which holds
  that only genuinely expensive displays can be honest indicators of quality, and
  the related notion of counter-signaling, in which high-status actors deliberately
