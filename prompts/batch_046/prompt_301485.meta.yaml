  Gatsby''s weekly parties, his imported shirts, his yellow car, and his fabricated
  Oxford credentials as candidate signals; treat Tom and Daisy Buchanan''s careless
  destruction of property and their unremarkable manner as potential counter-signals.
  Ask whether Nick Carraway functions as an unreliable evaluator who mistakes signal
  magnitude for signal authenticity. Does the novel dramatize a breakdown of honest
  signaling—Gatsby''s inability to purchase entry into old money—or does it show that
  true social capital is revealed by the absence of signal altogether? Identify at
  least two specific scenes (for instance, the shirt-throwing episode or the hotel
