  complexity is inherently valuable and that its loss is a tragedy. He suggested that
  the post-classic Maya and post-moai Rapa Nui societies may have been more egalitarian
  and ecologically sustainable. Calling their transformations "collapse" imposes a
  teleology of progress that privileges centralized, extractive states. The real question,
  he said, is not whether complexity dropped, but whether the new social forms were
  adaptive responses to changed conditions—responses that a collapse narrative pathologizes.


