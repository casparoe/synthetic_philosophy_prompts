  exchange persisted; literacy disappeared mainly in administrative contexts, not
  in social life generally. The Maya "collapse" was essentially a demographic shift
  away from unsustainable lowland urbanism toward the northern peninsula and highlands,
  where Maya culture continued with different political forms. And on Easter Island,
  recent work suggests deforestation was driven partly by introduced rats and climatic
  variability, after which the society reorganized into smaller-scale, sustainable
  social forms rather than disappearing. So in all three cases, he argued, "collapse"
  is a misleading moral narrative that treats decentralization as failure.


  (2) Vasquez replied that Thorne is defining collapse away. If "collapse" just means
  "everyone died," then indeed no society ever collapses, but that renders the term
  useless. She argued that what matters is the rapid loss of interregional integration,
  specialized craft production, monumental architecture, and shared symbolic systems.
  The Bronze Age saw the breakdown of the palace economies and writing systems that
  had linked the eastern Mediterranean; the Classic Maya saw the abandonment of divine
  kingship, the cessation of monument carving, and the fragmentation of political
  networks in the southern lowlands. These are not neutral "reconfigurations"—they
  represent a severe contraction in organizational complexity, regardless of whether
  villagers kept farming.


