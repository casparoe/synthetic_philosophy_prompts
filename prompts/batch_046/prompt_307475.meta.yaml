  as deeply ingrained and, in a sense, unavoidable; we cannot systematically abandon
  them without leaving human society behind. But if reactive attitudes depend on second-personal
  authority, and that authority can be undermined by structural conditions, then they
  are far more fragile than Strawson suggests. The student might then need to ask
  not just whether determinism is true, but whether social conditions permit the authority
  that reactive attitudes presuppose. This moves Strawson''s framework from a naturalistic
  observation about human psychology toward a normative sociology of recognition,
  which is not clearly what he intended.


  Thus, the reinterpretation both clarifies and destabilizes Strawson''s position:
  it saves him from the determinism problem but at the cost of making moral responsibility
  contingent on social conditions he did not explicitly theorize.


