  Strawson''s central claim in "Freedom and Resentment" is that reactive attitudes—resentment,
  gratitude, indignation, and the like—are constitutive of ordinary interpersonal
  life. He opposes these to the objective attitude, a detached stance appropriate
  toward those we view as lacking full moral competence, such as young children or
  the severely mentally impaired. The traditional determinism debate asks whether
  causal determination undermines the justification for holding people responsible.
  Strawson argues that this framing is confused: reactive attitudes are not theoretical
  judgments that need metaphysical backing, but practical responses embedded in our
  form of life. We do not excuse someone by showing they were causally determined;
  we excuse them by showing they lacked the relevant quality of will or acted under
  duress.


  A recent interpretive line treats reactive attitudes not merely as feelings but
  as modes of moral address that presuppose second-personal authority. On this reading,
  to resent someone is to treat them as accountable to me, which requires recognizing
  them as possessing a standing to demand reasons. This reinterpretation strengthens
  Strawson''s anti-determinist defense, because it shows that what matters is not
  libertarian freedom but a specific relational recognition. Consequently, determinism
  poses no threat so long as that recognition remains intact.


  The reinterpretation also illuminates the objective attitude. Rather than being
  a purely clinical stance, it involves suspending the presupposition of second-personal
  authority. This explains why we adopt it not only toward individuals with cognitive
  deficits but also in cases of systemic coercion—where social structures prevent
  genuine reciprocal recognition. Here, the shift to objectivity is not an admission
  that determinism is true, but an acknowledgment that the conditions for moral address
  have failed.


