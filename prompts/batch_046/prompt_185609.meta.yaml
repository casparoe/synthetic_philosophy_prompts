  monitor M1 is present and can preemptively force Φ if S shows any neural or behavioral
  sign of deviating, but M1 operates with only 70% reliability and a 30% false-positive
  rate. Behind M1 sits a deterministic backup M2 that activates with perfect reliability
  only if M1 fails to intervene. S has no awareness of M1 or M2, and in the actual
  sequence S chooses Φ without any intervention occurring. The crux is whether, in
  this specific architecture, S retains a "robust" alternative possibility in the
  sense that PAP requires, and whether the unreliability of M1 introduces a metaphysically
  or morally relevant gap that saves PAP.


