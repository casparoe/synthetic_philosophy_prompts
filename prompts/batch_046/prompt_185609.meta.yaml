  Your task is to draft the joint statement of an adversarial collaboration between
  two camps on Frankfurt cases and the principle of alternative possibilities.


  Camp One — call them the PAP Resistors — holds that Frankfurt-style counterexamples
  fail to undermine PAP because they either (i) rely on hidden deterministic mechanisms
  that do not genuinely eliminate all alternatives, or (ii) apply only to a narrow
  class of actions and do not scale to the full range of morally responsible agency.


  Camp Two — call them the Generalizing Compatibilists — holds that the logic of Frankfurt
  cases extends broadly: if an agent''s choice is genuinely unforced and the only
  "blocked" alternatives are ones that never enter the agent''s deliberation, then
  the absence of those alternatives carries no moral weight, regardless of scale or
  architecture.


