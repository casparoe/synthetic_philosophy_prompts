  Let me draft it precisely.


  "Construct a thought experiment in intergenerational public-health planning that
  is engineered to separate three models of valuing future welfare. The scenario must
  involve a single authority choosing between two vaccination campaigns with identical
  present costs and no hidden side effects. Campaign Alpha prevents a catastrophic
  reservoir outbreak in year 100, saving approximately 50,000 lives then, but delivers
  no benefits before that date. Campaign Beta prevents an endemic disease continuously,
  saving 1,000 lives per year for years 1 through 10, totaling 10,000 lives.


  The case must be built so that:

  (i) A pure rate of time preference model—discounting welfare only because it is
  temporally distant, at a constant near-zero rate (ρ ≈ 0.001 per year), with no risk
  adjustment—selects Campaign Alpha.

  (ii) A zero-discount welfare model—counting each future life equally regardless
  of temporal position, in the style of intergenerational egalitarian arguments—also
  selects Campaign Alpha, but for structurally different reasons.

  (iii) A standard exponential discount model—using a market-relevant rate (r ≈ 0.05
  per year) that internalizes capital opportunity cost, compound institutional decay,
  and the risk that the authority or the intervention mechanism will not survive intact
  to year 100—selects Campaign Beta.


  Constraints: The setting must be realistic (a ministry of health or international
  trust, not science fiction), the 100-year horizon must be within the range of actual
  institutional planning (e.g., pandemic preparedness or genetic-archive maintenance),
  and the divergence must depend specifically on the interaction of long-horizon compound
  risk with the rate parameter, not merely on a disagreement about ρ versus r in isolation.


  After presenting the scenario, demonstrate the reasoning for each of the three models,
  state which structural feature makes the exponential model peel away from the other
  two, and explain whether removing the institutional-risk component collapses the
  disagreement back into a simple parameter dispute about the correct rate. Then say
  how a defender of pure time preference would attack the case—specifically, whether
