  experiment in which a person is kidnapped and hooked up to a famous violinist who
  needs the use of their body for nine months to survive; the idea, as I understand
  it, is that even if the violinist has a right to life, that right does not automatically
  oblige the other person to remain physically connected for the entire duration.
  The other is the claim, often linked to Don Marquis, that abortion is gravely wrong
  because it deprives a foetus of a future like ours—something that, if left unharmed,
  would go on to enjoy experiences, relationships and projects comparable to those
  of any adult.


  I would like to compare these two lines of reasoning, but not in the usual way.
  Instead of asking whether bodily autonomy trumps the value of future life, I want
  to examine whether either argument can survive a particular challenge: the idea
  that moral status might not be an on-off switch but rather accumulates gradually,
