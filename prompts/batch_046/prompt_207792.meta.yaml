  Marquis''s appeal to a future like ours require that future to be either wholly
  present or wholly absent, or can it accommodate the notion that destroying an early
  embryo removes only a tiny fraction of future value, whereas destroying a foetus
  near term removes a far larger fraction?


  There is also a scaling question that keeps bothering me. In Thomson''s scenario,
