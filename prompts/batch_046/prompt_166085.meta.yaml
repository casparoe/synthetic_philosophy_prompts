  that occurs when the same speaker confronts a centralized policy—say, a mandatory
  vaccination protocol or a zoning ordinance. There, the speaker will insist that
  citizens are made unfree not because a specific official is personally coercing
  them in each instance, but precisely because the rule removes a practical option
  from their lives regardless of who enforces it or whether enforcement is actually
  occurring. The criterion shifts: in the first case, freedom requires only that no
  agent is actively imposing a choice; in the second, freedom requires that a practical
  option remain genuinely available, even if the obstacle is a generally applicable
