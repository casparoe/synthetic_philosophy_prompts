  (2) I think global workspace theory gives the right account of access consciousness—information
  becomes globally available to reasoning, memory, and reporting subsystems.

  (3) I think phenomenal consciousness (subjective experience, what it is like) is
  conceptually and possibly empirically distinct from access consciousness; the two
  can come apart.

