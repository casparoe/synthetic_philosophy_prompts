  form of an infinite, linear, non-repeating chain in which each belief is supported
  by a distinct prior belief, with no terminal point. This stands in contrast to foundationalism,
  which halts the regress in basic beliefs that are self-justifying, and to coherentism,
  which allows beliefs to justify one another within a holistic web of mutual support.
  Because infinitism rejects both a foundation and circular interdependence, it avoids
  the arbitrariness that afflicts coherentism: there is no closed system of beliefs
  whose coherence could be matched by an equally coherent but incompatible rival,
  since justification is always open-ended.


