  A. A patient with behavioral-variant frontotemporal dementia who now consistently
  seeks social interaction and accepts spoon-feeding, but whose advance directive—executed
  five years prior—explicitly refused artificial nutrition and hydration in the event
  of advanced dementia. The family argues that the patient''s current smiling and
  engagement represent a restored will to live.


