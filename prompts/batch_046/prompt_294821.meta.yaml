  You serve as the lead ethics mediator for the neuro-palliative service at a large
  academic hospital. Your unit is required to adjudicate conflicts between previously
  executed advance directives and the contemporaneous preferences or behaviors of
  patients whose decision-making capacity is now compromised or fluctuating—most commonly
