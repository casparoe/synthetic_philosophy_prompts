  or profound psychiatric disorder that alters evaluative structures. You must design
  a reusable clinical decision procedure that translates the philosophical problem
  of diachronic authority—whether, and under what conditions, an earlier capacitated
  self retains normative control over a later, transformed or incapacitated self—into
  an operational protocol your team can run in real time.


  The procedure should not collapse into either "the directive always governs" or
  "present preference always governs." Instead, operationalize a three-layer framework:
  (1) an authenticity and provenance layer that verifies the directive''s origin conditions,
  specificity, and absence of revocation triggers; (2) an axiological drift layer
  that assesses whether the patient''s current expressed preferences represent a pathological
  distortion of, or an authentic structural revision to, the value hierarchy that
  originally grounded the directive—assessed by coherence with underlying critical
  interests rather than surface agreement with the directive''s literal instructions;
  and (3) a transformation threshold layer that determines whether the patient''s
  current cognitive-affective architecture is so discontinuous with the authoring
  self (for example, total loss of autobiographical integration coupled with inversion
  of previously ranked values) that the directive''s authority is suspended not because
  the patient changed their mind, but because the substrate capable of endorsing or
  repudiating the directive is no longer present.


  In constructing the procedure, specify: the ordered sequence of tests or questions;
  what counts as a sufficient answer at each stage; the precise points where the procedure
  halts with a binding recommendation versus where it must hand the decision to a
  values judgment (explicitly marking those nodes); the time and expertise constraints
  (decisions must be renderable within 48 hours by a mediator with clinical-ethics
  training but not necessarily a philosophy doctorate, with sign-off required from
  the attending physician, a designated family or surrogate representative, and legal
  compliance); and the hard cases the procedure must accommodate, including conflicts
  involving experiential welfare versus long-term narrative coherence.


