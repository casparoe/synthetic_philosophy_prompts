  "I''m trying to work out whether my views on explaining perpetrator behavior in
  the Holocaust — specifically regarding Reserve Police Battalion 101 — form a stable
  package, or whether I''m smuggling in incompatible motivations. I find Browning''s
  emphasis on peer dynamics, bureaucratic distancing, and incremental escalation convincing
  for the immediate mechanism of the killings, but I also think that without the specific
  ideological and bureaucratic framing of the Nazi state, these particular men in
  this particular unit would not have carried out sustained mass shootings. At the
  same time, I want to preserve a role for individual moral character, but only in
  a restricted sense: I think it explains the minority who refused, not the majority
  who complied. More precisely, I conceive of this character factor not as a stable
  trait but as ''situationally activated moral residue'' — a residual capacity for
  refusal that becomes causally effective primarily when institutional pressure weakens
  or is absent. I reject Milgram-style obedience studies as explanatory analogs, not
  because authority was irrelevant, but because genocide involves sustained, ideologically
  embedded action over months, which lacks the discrete, time-bounded structure that
  makes Milgram''s paradigm intelligible. I also hold that adequate explanations must
  satisfy what I call ''counterfactual robustness'': they must identify a factor F
  such that, holding other conditions constant, the absence of F makes the atrocity
  significantly less likely. Finally, I think clinical psychopathy should be excluded
  — removing clinically psychopathic individuals from a unit would likely not change
  the unit''s behavior, since replacements would fill the roles, so psychopathy fails
  counterfactual robustness — but I am open to subclinical narcissistic traits, specifically
  a diminished empathic identification with victims, explaining why some individuals
  initiated violence without explicit orders, without this counting as exculpatory
  pathology.


