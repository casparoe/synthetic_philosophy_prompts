  cognitive architectures: at each node (ant), sensory input is transformed into local,
  indexical triggers—primarily pheromone gradients—rather than being preserved in
  a propositional or globally accessible format. Because the representational content
  is not broadcast to subsystems in a shared medium, there is no "global workspace"
  in which information becomes available for system-wide consumption. The colony processes,
  but nothing within it is in a position to know what is being processed.


