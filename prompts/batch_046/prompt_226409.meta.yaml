  homeostasis, responds adaptively to perturbation, and integrates information across
  its constituent ants.


  2. However, I want to distinguish this functional coherence from the kind of unified
  phenomenal field that seems necessary for subjective experience or genuine intentionality.
  Drawing on collective-action theory (the aggregation problem identified by List
  and Pettit), I propose that Aunt Hillary achieves only "aggregative coordination"
  rather than "joint intentionality": the colony computes outcomes that no individual
  ant represents, but there is no single decision procedure or representational format
  shared across the system.


