  I am serving as a teaching assistant for a graduate seminar on comparative logic
  and metaphysics in the pre-Qin period, and I need an objective assessment of the
  following exam response. The exam question was:


  "In the ''White Horse Dialogue'' (Bai Ma Lun) traditionally attributed to Gongsun
  Long, the claim that ''a white horse is not a horse'' is defended through a series
  of requests and responses about color-specific and color-neutral terms. Analyze
  the argument''s logical structure, paying particular attention to how Gongsun Long
  treats the relation between the determinable term ''horse'' (ma) and the determinate
  compound ''white horse'' (bai ma). How does this relate to the School of Names (Mingjia)
  thesis that names and realities do not correspond (ming shi bu fu)? In your evaluation,
  address whether the argument is best read as an ontological claim about the separation
  of form (xing) and qualitative determination (se), or as a logical claim about the
  intension and extension of simple versus compound names, and assess its success
  under either interpretation."


  The student wrote:


  "The dialogue defends the proposition that a white horse is not a horse by showing
  that a request for a horse is satisfied by a horse of any color, whereas a request
  for a white horse is satisfied only by a white one; therefore the names ''horse''
  and ''white horse'' have different referents. This illustrates the School of Names''
  central concern that linguistic categories and actual entities diverge (ming shi
  bu fu).


  Gongsun Long''s reasoning depends on the ontological priority of qualitative determinations
  over formal ones, a premise he takes from Hui Shi''s doctrine of contracting differences
  (he tong yi), according to which distinct qualities must be separated before a form
  can be instantiated. By treating ''horse'' as a bare particular lacking accidental
  properties, the argument establishes that ''white horse'' denotes a composite substance
  formed by joining the quality ''white'' with the form ''horse''. The interlocutor
  ultimately concedes that a yellow horse is likewise not a horse, confirming the
  general principle that any determinately colored animal lies outside the extension
  of the determinable ''horse''.


  Consequently, the argument succeeds as an ontological defense of the separation
  of form and quality, placing Gongsun Long close to a proto-Platonic realism about
  universals in which pure forms exist independently of their qualitative instantiations.
  If read instead as a logical point about name-reference, it fails because it mistakes
  the semantic inclusion of a property within a kind for the metaphysical exclusion
  of the kind by that property—a confusion that the Later Mohist discussion of compound
  names (fu ming) in the Canons explicitly rejects. Nevertheless, the dialogue remains
  philosophically significant because it demonstrates that determinable terms do not
  transparently include all of their determinate specifications within their extension."


