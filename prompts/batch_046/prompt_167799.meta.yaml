  status of "here is a hand" as a direct refutation of idealism — and explain what
  I, as the facilitator with no philosophy background, must supply verbally to bridge
  the gap.


  Do not include bibliographies, citation lists, or recommended readings. Do not ask
  participants to research philosophers in advance. The prompt should stand entirely
  on the analogy and the in-room mechanics.


