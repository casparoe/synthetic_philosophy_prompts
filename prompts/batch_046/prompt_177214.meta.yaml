  I am not a philosopher or a political scientist—just someone who has been arguing
  with my brother-in-law about whether voting is ever truly required. He works in
  logistics and has no formal training, but he holds firm opinions. Over the past
  year he has given me these five judgments. First, in a tight national election between
  an honest but reckless candidate and a careful but deceptive one, he insists that
  voting for the honest reckless one is a moral obligation because allowing deception
  to triumph makes one partly responsible for what follows. Second, in that exact
  same race but living in a state where the result is already decided, he says staying
  home is not a moral failure, though he votes anyway to stand in solidarity with
  others who are affected. Third, in an election for a purely ceremonial office with
  no legal power—like an honorary city poet—he treats voting as no different from
  applauding at a parade: pleasant if you do it, empty if you do not. Fourth, in a
  primary where his preferred candidate is polling near one percent and the two leading
  options are both acceptable to him but very different, he votes for the longshot
  and says that voting for someone you merely tolerate is "renting out your conscience
  for a discount"; he also rejects strategic voting as a kind of self-betrayal. Fifth,
  in a referendum on a technical water-rights measure he admits he has not studied,
  he abstains and argues that casting a vote out of ignorance is worse than silence
  because it pretends to knowledge one lacks.


  Here is the new situation. There is a genuinely tied election for a regional board
  that controls water allocation to an impoverished district. The two candidates are
  both gravely compromised: one openly promises to divert water for private profit,
  while the other will preserve a slow-acting contamination through bureaucratic neglect,
  framing it as conservation. There is a write-in option for a local activist he deeply
  respects, with no mathematical path to victory. In addition, he has recently learned
  that every ballot in his precinct must be cast through a specific machine built
  by a firm he considers exploitative, and using it requires pressing a screen that
  displays his name publicly in a small room.


