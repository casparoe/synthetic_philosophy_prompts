  For my seminar in philosophy of medicine, I am trying to operationalize a principle
  I have been developing about the authority of advance directives. Call it the principle
  of layered diachronic authority: the binding force of an earlier self''s directive
  does not depend on simple personal identity over time, but on whether two conditions
  are jointly satisfied. First, structural value continuity: the present patient''s
  core evaluative framework must be reconstructible as a coherent development of the
  prior framework, not a rupture from it. Second, non-alienation: if we hypothetically
  restore the present patient to full deliberative capacity, they would not reject
  that reconstructed prior framework as foreign or imposed. If both conditions hold,
  the directive binds the decision-maker; if the first holds but the second fails,
  it functions only as advisory; if the first fails, the directive is void, and the
  present patient''s expressed preferences govern, even if they contradict the document.


  I work as a clinical ethics consultant in a 400-bed teaching hospital, and my team
  is called in roughly twice a month to adjudicate disputes over advance directives—typically
  when an attending physician and family disagree about whether to honor a refusal
  of life-sustaining treatment written years earlier, now that the patient lacks capacity.
  I have 48 hours to issue a written recommendation, I can review the chart and interview
  family members but I am not trained to conduct full neuropsychological assessments
  (those require a referral that takes weeks), and my recommendation must be countersigned
  by the ethics committee chair and the attending. The stakes are high—wrongful withdrawal
  or wrongful prolongation—but the volume is low enough that I can apply a manual
  procedure rather than relying on intuition.


  Please construct a reusable decision procedure I can apply to any such case. It
  should specify: (i) the ordered sequence of questions to ask; (ii) for each question,
  what counts as a sufficient answer given my actual informational constraints (chart
  review, family interview, no specialized testing); (iii) the decision nodes where
  the procedure yields a definite outcome—bind, advise, or void—and where it must
  halt and hand the decision to human judgment because the issue is one of values
  rather than assessable fact; (iv) explicit flags for misfire, especially where my
  lack of neuropsychological expertise makes the structural-continuity judgment unreliable.
  Then apply the procedure to three cases: (a) a patient with advanced Alzheimer''s
  who, five years ago, refused any artificial nutrition, and who now accepts spoon-feeding
  with apparent pleasure but cannot communicate about values; (b) a patient in a minimally
  conscious state after traumatic brain injury who previously refused prolonged mechanical
  ventilation, but whose family reports occasional eye-tracking responses that might
  indicate preference for continued treatment; and (c) a patient with frontotemporal
  dementia whose prior directive refused antibiotics for life-threatening infections
  on the grounds of avoiding prolonged dependency, but whose present behavior—seeking
  social interaction, expressing distress at being alone—suggests to staff a changed
  evaluative outlook that the family insists is merely symptomatic, not authentic.
  In particular, make sure one of the three applications produces a recommendation
  I will find professionally uncomfortable—where the procedure tells me to honor the
  directive despite strong present-tense indications that the patient is suffering
  in a way the prior self did not anticipate, or conversely to override it despite
  the family''s conviction that the prior values remain intact. Finally, state clearly
  what the procedure cannot do: which kinds of disputes it will systematically fail
  to resolve, and what institutional safeguard should be in place for those failures.


  Write the procedure in plain language suitable for a consultant without philosophical
  training, but preserve the distinction between structural value continuity and non-alienation,
  and do not collapse the two conditions into a single "best interests" test.


