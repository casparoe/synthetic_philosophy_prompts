  agents with no internal organization), and ''computational idealizations,'' which
  preserve that structure but simplify the mathematics of derivation (for example,
  assuming continuous time to avoid discrete-step computation). I then argue that
  Friedman''s predictive-success criterion legitimately applies only to the second
  category. A model that uses representational idealization might predict well, I
  claim, but only by accident or by proxy correlation, and therefore the F-twist does
  not rescue it.


  The outline proceeds in four parts. First, it reconstructs Friedman''s position
  by noting that he treats predictive accuracy as the sole criterion of model evaluation,
  explicitly bracketing descriptive realism. Second, it introduces the representational/computational
  distinction and illustrates it with an example from climate modeling—specifically,
  comparing a model that replaces turbulent eddies with a smoothed viscosity parameter
  (computational) against one that treats atmospheric cells as non-interacting (representational).
  Third, it contends that in the second case, predictive success cannot be attributed
  to the model''s capturing the relevant causal dynamics, because the ontic displacement
  removes the very interactions that generate the phenomenon. Fourth, it considers
  an objection: that all models involve some ontic displacement, so the distinction
  is one of degree rather than kind. The outline responds by proposing that the relevant
  difference is not absence of displacement, but whether the displaced elements are
  causally inert in the domain of prediction.


