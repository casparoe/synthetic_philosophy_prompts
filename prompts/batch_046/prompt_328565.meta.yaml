  In my seminar on moral change and social history, two fellow students, Nadia and
  Jonas, debated the explanation for rapid normative collapses—specifically the disappearance
  of dueling in nineteenth-century Britain and the decline of foot-binding in late
  imperial China. I am trying to write my essay and genuinely cannot decide who is
  right; I would like a point-by-point adjudication of their exchange, including what
  each gets correct, where each goes wrong, and what both overlook.


  Nadia opened by defending what she called Appiah''s honor-based model. She argued
  that practices like dueling do not end because people are persuaded by moral arguments—enlightenment
  critiques of dueling existed for over a century before the practice faded—but because
  the peer group that grants status withdraws recognition. Once dueling came to signal
  barbarism rather than courage, the incentive structure of honor collapsed, and elites
  abandoned it almost overnight. She emphasized that this explains speed and asymmetry:
  slavery, by contrast, persisted for centuries despite abundant moral argument precisely
  because slaveholding remained honorable within the dominant peer group, and only
  collapsed when that internal honor code was disrupted.


  Jonas countered with what our syllabus labels the Williams thesis: rapid normative
  change tracks institutional and economic realignment, not shifts in honor. He claimed
  that dueling vanished because the British state centralized legitimate violence
  through professional police and courts, and because emerging capitalist institutions
  required predictable contract enforcement that private violence undermined. The
  "honor" narrative, on his view, is an ex post facto rationalization: elites constructed
  a story about civilization and refinement only after institutional pressures had
  already made dueling impractical. He added that slavery''s persistence actually
  supports his view, since slaveholding was deeply embedded in economic institutions;
  abolition occurred only when industrial capitalism and geopolitical interests made
  slave labor less profitable and more politically costly, not because slaveholders
  suddenly lost peer respect.


  Nadia replied by granting that institutions matter but insisting that Jonas confuses
  the vehicle with the driver. She introduced a distinction she said was missing from
  our course readings: horizontal honor, which is peer-to-peer recognition within
  a social class, versus vertical honor, which is recognition mediated by state or
  bureaucratic institutions. In Britain, she argued, dueling died not merely because
  the state monopolized violence, but because the aristocracy itself began to seek
  vertical honor—political office, bureaucratic rank, imperial credentials—rather
  than horizontal honor among a closed gentry circle. Once vertical honor replaced
  horizontal honor, dueling became a liability because it threatened state-mediated
  status. This, she said, is still an honor story, not an interest story: people changed
  behavior because they cared about status, and the form of status they cared about
  had shifted.


  Jonas responded that Nadia''s distinction actually collapses into his position.
  The shift from horizontal to vertical honor is itself caused by institutional realignment—the
  expansion of the franchise, the professionalization of the civil service, and the
  growth of empire—not the other way around. He pointed to foot-binding: reformers
  did invoke "national honor," but they did so precisely because the Qing state needed
  healthy conscripts and modern laborers. Without that institutional need, the honor
  rhetoric would have been ignored, just as earlier Confucian arguments against foot-binding
  had been ignored for centuries. Therefore, honor language is always the surface
  expression of deeper institutional interests, and Appiah mistakes this expression
  for the cause.


