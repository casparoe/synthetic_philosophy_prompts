  the residual. The result is not merely that each theory has auxiliary hypotheses,
  but that the three together seem to form a closed explanatory loop: any observed
  outcome can be mapped onto at least one family, and the failure of family A in a
  particular case is routinely used to justify family B''s relevance rather than being
  registered as a problem for the overall tripartite scheme.


