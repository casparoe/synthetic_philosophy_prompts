  more than strategic behavior; participants need genuine conviction to endure sacrifice.
  She claimed the organizer faces a forced option—either she commits with belief or
  treats the cause as dead, which undermines solidarity. Because the outcome is genuinely
  open (a live option), enormously consequential (momentous), and neutrality effectively
  amounts to abandonment, James''s conditions are satisfied, and belief formed on
  the basis of our passional and volitional nature is not only permitted but necessary
  for meaningful collective action. Dr. Okonkwo (Cliffordian) replied that this conflates
  belief with practical acceptance: one can organize, lobby, and express hope without
  holding the proposition as true, and Clifford''s ethics prohibit precisely the step
