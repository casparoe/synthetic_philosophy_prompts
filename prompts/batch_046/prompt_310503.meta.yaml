  ultimate truth (paramattha-sacca). The "I" is a strategically necessary fiction
  for the path (magga), but ultimate analysis reveals its emptiness. The Pudgalavāda
  controversy itself demonstrates that Buddhists never intended "no person whatsoever,"
  but rather "no permanent, independent essence" (svabhāva). Vasquez, he said, collapses
  this nuanced distinction into a crude denial that makes Buddhism self-defeating.


