  (3) Vasquez countered that if continuity is purely causal and impersonal, then rebirth
  and karma transmission become mysterious. She invoked the Milindapañha''s chariot
  analogy: just as a chariot is a conventional designation for parts, so is a person.
  But she pressed that rebirth requires something to be reborn; without a substrate,
  Buddhism faces a "causal chain with no links" and cannot coherently ground moral
  responsibility across lives.


