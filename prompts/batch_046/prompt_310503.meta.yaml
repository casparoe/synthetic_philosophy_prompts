  The Theravada taxonomy of citta, cetasika, and rūpa describes momentary events linked
  by conditioning relations (hetu-paccaya), not by an owner. He noted that even the
  heterodox Pudgalavādins—who argued for a "person" (pudgala) neither identical with
  nor different from the aggregates—rejected both eternalism and annihilationism,
  showing that Buddhist philosophy has resources for continuity without substance.


