  collapses into a performative contradiction. The path requires an agent who works
  on "my" greed and "my" mindfulness; liberation is framed as "I" escaping suffering.
  If there is no agent, only an impersonal stream of kammic processes, then first-person
  ethical cultivation is an illusion, and anatta undermines the very practice that
  produces it.


