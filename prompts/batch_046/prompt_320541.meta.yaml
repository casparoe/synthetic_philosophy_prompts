  earn points only if they can derive the ending without referencing the specific
  spatial arrangement of cards. The facilitator should award points based on the rigor
  of the defense, not on reaching the ''right'' answer.


  Also specify what will predictably go wrong the first time you run it: the Narrators
  will likely invent hidden teleologies, treating the ending as causally pulling the
  preceding events; the Analysts will covertly reorder cards to preserve a story.
  Give instructions on how to handle these failures — for instance, by introducing
  a ''neutral observer'' role, assigned to one student per team, whose sole job is
  to flag when a team violates its own rules.


  Finally, be frank about what the activity cannot reproduce. Because all participants
