  "I am drafting a feature on pedagogical experiments in philosophy of science and
  history, and I need a classroom design that can serve as a concrete illustration
  for my readers. The setting is a graduate seminar in philosophy of history — twelve
  students, one ninety-minute session — with participants who have read the standard
  debates but have not yet internalized why narrative explanation is structurally
  irreducible to covering-law models.


  Design an in-class simulation that makes the students feel, rather than merely acknowledge,
  the difference between a deductive-nomological explanation and a narrative explanation.
  Inject a specific conceptual tension: the problem of configurational closure versus
  counterfactual substitutability. In narrative explanation, an ending becomes intelligible
  only when preceding events are grasped together in a particular spatial or temporal
  configuration; remove or alter one intermediate event and the coherence of the whole
  collapses, not merely the predictive accuracy. By contrast, a covering-law explanation
  demands that intermediate steps be substitutable — if the law holds, the outcome
  should be derivable regardless of the particular path, provided the initial conditions
  and laws are fixed.


  The activity should proceed as follows. First, present the group with a fictional
  but richly detailed historical scenario — for instance, the sudden dissolution of
  a municipal water cooperative in an unnamed Mediterranean town during the late 1970s
  — composed of discrete event-cards (political betrayal, drought, a misdelivered
  telegram, a funeral, a bank refusal). Do not tell them whether they are analysts
  or narrators until they draw roles.


  Divide them into two teams of six. Team A (the Analysts) must explain the collapse
  using only law-like generalizations drawn from sociology, economics, or climatology.
  Their explanation must be presented as a linear chain in which each link can be
  replaced by a counterfactual alternative without destroying the explanatory power,
  provided the general law and initial conditions remain intact. They should physically
  arrange their cards in a vertical flowchart with explicit conditional arrows.


  Team B (the Narrators) receives the same cards but must arrange them in a two-dimensional
  configuration — a table or board — where the spatial relation between cards (proximity,
  enclosure, sequence) generates the meaning of the ending card, ''Dissolution.''
  They must defend the claim that substituting any intermediate card — say, replacing
  the misdelivered telegram with a correctly delivered one — does not merely change
  the outcome but destroys the retrospective coherence that makes the dissolution
  intelligible as an ending. They should not invoke explicit laws; instead, they must
  show how the ending is configured by the particular path.


  After thirty minutes of construction, the teams present. Then run a forced exchange:
  each team must now defend the other team''s model using only the other team''s rules.
  The Analysts must try to preserve narrative coherence without substitutability;
  the Narrators must try to derive the outcome from general laws without relying on
  configurational meaning. This should produce an experienced friction.


  Following the exchange, hold a structured debrief — no more than twenty minutes
  — in which you map the physical actions onto philosophical distinctions: the vertical
  flowchart as the symmetry of explanation and prediction, the two-dimensional board
  as Mink''s configurational grasp (though do not require students to name Mink),
  the collapse of coherence under substitution as the failure of counterfactual robustness
  in narrative, and the Analysts'' inevitable smuggling of narrative elements as evidence
  that covering-law models in history often depend on unstated configurational assumptions.


  Include explicit rules and a payoff scheme that does not use real money: perhaps
  a point system in which the Narrators earn points only if the opposing Analysts
