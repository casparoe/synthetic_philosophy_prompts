  "Epistemicism, as defended by Timothy Williamson, holds that vague predicates like
  ''bald'' have precise, unknown cut-off points. For any number of hairs n, there
  is a fact of the matter whether n hairs makes one bald. Our inability to locate
  the boundary is purely epistemic: knowledge is inexact, not reality. So epistemicism
  fully preserves bivalence and classical logic; every instance of ''x is bald'' is
  determinately true or false, even in borderline cases.


  Supervaluationism, developed primarily by Kit Fine, denies that there are hidden
  sharp lines. Instead, it posits multiple ''admissible precisifications'' of a vague
  predicate—ways of drawing the line that respect the clear cases. A statement is
  ''supertrue'' if true in all admissible precisifications, ''superfalse'' if false
  in all, and otherwise it lacks a truth value. This means supervaluationism rejects
  bivalence for borderline cases and also rejects the law of excluded middle, since
  neither ''John is bald'' nor ''John is not bald'' is true.


