  Exam question: In discussions of vagueness, epistemicism (Timothy Williamson) and
  supervaluationism (Kit Fine) both reject the idea that vague predicates lack sharp
  boundaries, but they do so in opposite directions. Explain (a) what epistemicism
  claims about the ontological and epistemic status of borderline cases for a predicate
  like "bald," (b) how supervaluationism uses the apparatus of admissible precisifications
  and supertruth to treat the same cases, and (c) whether supervaluationism genuinely
  avoids sharp boundaries or merely relocates them. In your answer, be precise about
  which logical principles—particularly bivalence and the law of excluded middle—each
  view accepts or rejects for borderline statements.


