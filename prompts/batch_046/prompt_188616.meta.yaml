  Benatar''s asymmetry consists of four claims. First, the presence of pain is bad
  for an actual being who experiences it. Second, the presence of pleasure is good
  for an actual being who experiences it. Third, the absence of pain is good, and
  this holds even when there is no actual being who enjoys that absence—no one is
  "deprived" of not suffering. Fourth, the absence of pleasure is not bad unless there
  is an actual being who is deprived of it. For merely possible beings, this creates
  an asymmetrical reason structure: there is a reason not to create a being who will
  suffer, but no parallel reason to create a being who will enjoy pleasure.


  Applying this to S: since S does not exist, the absence of her 90 units of pleasure
  is not a harm. However, if she were created, the 10 units of pain she would experience
  would be genuinely bad for her. Thus, there is a reason against creating S, and
  no countervailing reason based on her potential pleasure.


  The critic''s "disintegrated well-being" objection proposes applying the asymmetry
  segment by segment. This objection misunderstands Benatar''s reliance on the non-identity
  problem. Because the intervals lack psychological continuity, each interval constitutes
  a metaphysically distinct potential individual. Therefore, Benatar''s framework
  should be applied to each segment-subject separately: for any segment containing
