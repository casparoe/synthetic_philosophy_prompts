  multiple potential harm-subjects without producing any corresponding benefit-subjects
  that could offset them. Consequently, the objection fails. Benatar does not need
  to presuppose narrative unity across an entire life; he only needs a subject capable
  of experiencing harm or benefit, and in this disintegrated case, that subject is
  the segment. So the framework applies without requiring continuous personal identity
  over time.


