  David Benatar defends an asymmetry in the evaluation of pleasure and pain with respect
  to beings who do not actually exist. First, lay out the four-part logical structure
  of this asymmetry, clearly distinguishing the evaluation applied to actual beings
  from that applied to merely possible beings. Second, apply the asymmetry to the
  following hypothetical case: imagine a potential being, S, who—if created—would
  experience exactly 90 units of pleasure and 10 units of pain, but in entirely discrete,
  non-overlapping temporal intervals with no psychological continuity or memory linking
  one interval to another. A critic argues that in such a case of "disintegrated well-being,"
