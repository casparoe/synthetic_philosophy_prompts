  we can only project intentional patterns onto artifacts because we have already
  projected design patterns onto their source specifications, whereas in biological
  organisms the two stances are genuinely independent because evolutionary design
  is not represented in a specification accessible to the system itself. I also worry
  that I may be misrepresenting Dennett''s criterion of projectibility, and that I
