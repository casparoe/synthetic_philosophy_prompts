  the real danger to freedom: not repeating actions, but protecting the framework
  that generates them from any revision. The second responded that this is merely
  strong vocational identity or commitment; if she genuinely values precision and
  service, then leaving would be alienation, not liberation, and flexibility without
  reason is just caprice.


