  architecture doesn''t merely prefer accounting; it filters out counter-reasons before
  they reach conscious deliberation, so she never genuinely encounters challenges
  to her framework. That insulation is rigidity disguised as conviction. The second
  countered that this is just motivated reasoning or self-deception—psychologically
  real, but conceptually distinct from sphexishness, which is total insensitivity
