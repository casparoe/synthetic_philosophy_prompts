  Since the death of my partner last year and my subsequent collaboration—entirely
  through asynchronous digital correspondence and shared image archives—with an art
  historian I have never met in person, on an exhibition about mourning and visual
  beauty, I have been trying to stabilize my own philosophical commitments regarding
  intrinsic value. I find myself drawn to G. E. Moore''s view, developed in his ethical
  writings, that friendship and the contemplation of beautiful objects are among the
  greatest goods in themselves, and that certain combinations of them constitute organic
  unities whose value exceeds the sum of their parts. Before I present these thoughts
  to a reading group, I want to check whether my specific package is coherent.


  Here is where I stand:


  (1) I accept Moore''s thesis that true friendship and the appreciation of beautiful
  objects are both intrinsically valuable, and that when they occur together they
  form an organic unity—call it ''aesthetic fellowship''—such that the combined state
  has a value strictly greater than the value of the friendship plus the value of
  the aesthetic experience taken separately.


  (2) I hold that for friendship to contribute this value, the friends must possess
  direct, mutual awareness of each other''s good qualities and must take genuine pleasure
  in them; without this cognitive-affective engagement, what remains is mere companionship
  or cooperation, lacking the specific intrinsic worth of friendship.


  (3) I maintain that aesthetic appreciation is complete in itself even in total solitude:
  a person contemplating a beautiful object alone realizes the full intrinsic value
  of that contemplation, with no deficit arising from the absence of others.


  (4) I also hold that the peak form of the organic unity described in (1) necessarily
  involves shared aesthetic attention—two friends jointly attending to a beautiful
  object—so that solitary appreciation, however complete on its own terms, falls short
  of the highest possible value.


  (5) I believe that mediated or virtual relationships—specifically, the kind of collaborative
  curatorial work my colleague and I are conducting through digital exchange, without
  physical co-presence or direct observation of personal character—can fully instantiate
  both the friendship required by (2) and the shared aesthetic attention required
  by (4).


  (6) I reject evolutionary debunking arguments against the intrinsic value of friendship
  and beauty, because on Moore''s non-naturalist account causal origins are irrelevant
  to normative status; at the same time, I think that the near-universal cross-cultural
  recognition of these goods provides defeasible epistemic support for trusting our
  judgments about them.


