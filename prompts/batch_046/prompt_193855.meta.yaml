  a legitimate analytical framework for comparing Western liberal and Confucian-influenced
  conceptions of the relation between person and community. One camp argues that East
  Asian self-understanding is genuinely interdependent: the community is not merely
  instrumentally valuable but constitutive of the self, which makes ''collectivism''
  a descriptively accurate and normatively significant category. They point to the
  particularistic, hierarchical obligations of Confucian role-ethics—lunli, where
  moral standing derives from one''s position within a web of relational duties rather
  than from autonomous choice or group membership—as evidence that the self is relationally
  constituted.


  The opposing camp contends that framing these traditions as ''collectivist'' is
  a category error born of liberal ontology. They argue that Confucian relational
  obligations are neither aggregative (subordinating the individual to a collective
  good) nor universalistic in the manner of Western collectivist theories; rather,
  they are particularistic and hierarchical in ways that the individualism-collectivism
  axis cannot capture. On their view, the binary treats the atomic individual as the
  universal baseline and then asks whether East Asian traditions subordinate or preserve
  it, thereby imposing a normative framework that misrepresents the ontological status
  of the person.


