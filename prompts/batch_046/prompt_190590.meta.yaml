  that without the right contextual scaffolding—historical conventions, design intentions,
  or environmental coupling—the same internal structure or explicit output could mean
  almost anything. Proponents of outer-message primacy counter that framing is itself
  just more explicit content at a higher level of abstraction, and that meaning must
  ultimately bottom out in observable, shareable signs or risk collapsing into private
  mentalism. Meanwhile, inner-message advocates insist that framing and explicit output
  are merely symptoms of a deeper organizational logic—whether that''s the causal
  structure of a brain, the regulatory architecture of a gene circuit, or the syntactic
  rules of a formal system—and that this internal logic is what fixes interpretation
  even when frames shift and outputs vary.


  Everyone in the debate agrees that all three levels exist and interact. The disagreement
  is about which one carries the explanatory weight and whether the others are reducible
  to it. After years of exchange, nobody has changed position. My working hypothesis
  is that this is not an empirical disagreement—no one expects a new neuroimaging
  study or a formal theorem about syntax to settle it—nor is it purely verbal. Instead,
  I suspect the sides are answering different questions under a single heading: some
  are asking what makes interpretation possible (a transcendental or conditions-based
  question), others what justifies a particular attribution of meaning (a normative
  or evidential question), and still others what causally fixes the content (a metaphysical
  or mechanistic question). But I am not sure.


