  Let''s draft:


  "As a retired biologist who has recently turned to philosophy of medicine and biology,
  I have been trying to systematize my views on health and disease for a reading group.
  Before I present them, I want a consistency audit. Here is where I stand:


  (1) I hold a naturalist, biostatistical view of disease: a condition is a disease
  when some internal part or process operates with functional efficiency below the
  species-typical range for the individual''s age and sex, independent of social values
  or subjective preferences.


  (2) I also accept the evolutionary-mismatch framework: many prevalent chronic conditions—such
  as metabolic syndrome and certain autoimmune disorders—are best understood as dysfunctions
  relative not to current population statistics, but to our evolved physiological
  design for ancestral environments.


  (3) Regarding mental conditions, I maintain that a state counts as mental illness
  only when there is an identifiable biological dysfunction in neural, endocrine,
  or stress-response systems, combined with clinically significant harm; reactive
  suffering that tracks rational responses to adverse social circumstances is not,
  by itself, pathological.


  (4) At the same time, I deny that conditions like congenital deafness or autism
  spectrum traits are diseases, even though they involve statistically atypical sensory
  or neural functioning, because they do not represent harmful dysfunctions that impair
  survival, reproduction, or goal-directed functioning.


  (5) Finally, I reject strong normativism—the claim that disease is constituted entirely
  by social values—but I also reject the WHO''s expansive definition that treats health
  as complete physical, mental, and social well-being, on the grounds that it conflates
  health with happiness and renders health empirically unattainable.


  Please examine these commitments for joint tenability. Which pairs are genuinely
