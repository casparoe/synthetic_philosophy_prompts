  "I''m a journalist who writes on science and ideas. Next Thursday I am delivering
  the opening remarks at an interdisciplinary workshop titled ''Lives in Parallel:
  Biography, Hagiography, and Moral Learning from Plutarch to the Present.'' The room
  will be split between classicists and philosophers of education who know Plutarch''s
  Parallel Lives well, and biographers of scientists and activists who do not. I want
  the remarks—about five minutes—to treat Plutarch''s comparative pairing of lives
  not as ancient hagiography but as a method of moral particularism: by placing virtue
  and vice in parallel across cultures, the reader is forced to judge rather than
  imitate. I need this idea to structure what I can and cannot say: I should not claim
  that biography automatically improves character, nor should I celebrate our subjects
  as secular saints; instead, I should argue that modern biography has lost the comparative
  frame and therefore risks either hagiography or debunking cynicism, both of which
  foreclose judgment. To sharpen this, please weave in Plutarch''s concern—drawn from
  his essay on poetic education—that unframed exposure to vicious lives can produce
  mimetic corruption, and ask whether a single-subject modern biography can guard
  against that without the comparative counterweight Plutarch provides. The speech
  must be accessible to the biographers without simplifying for the scholars. At the
  end, please indicate how confident you are in attributing this particularist, anti-hagiographic
  reading to Plutarch, and identify the point about which you are least certain—whether
  the risk of mimetic corruption applies to adult readers of biography, or whether
  the comparative method genuinely produces moral judgment rather than mere comparison."


