  press whether Britain and China in, say, the mid-eighteenth century satisfy this
  condition.

  2. Britain and Qing China were not two versions of a single ''pre-industrial society''
  with different settings. Their political economies, energy regimes, and state capacities
  were structurally different in ways that are not easily modeled as parameter variations
  on a shared template.

  3. Therefore, asking ''why Britain and not China'' risks treating China as a counterfactual
  Britain—an implicit interventionist counterfactual in which we hold China''s social
  structure constant and toggle a factor like coal access or patent law—when in fact
  altering those factors might require altering the Qing state itself.

