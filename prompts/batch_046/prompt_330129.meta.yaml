  Let''s draft:


  After a long debate with a friend about whether normative reasons can float free
  of any reasoner, I sketched an argument that seems to show they collapse into contradiction.
  I want to defend the idea that suffering is bad even in a mindless universe, but
  I can''t see the exit. Here is the chain:


  (1) A free-floating rationale is one whose normative force does not depend on being
  grasped, represented, or possessed by any mind.

  (2) If such rationales exist, then in a possible world W containing no conscious
  beings — only physical processes — there can still be reasons, because value (e.g.,
  that suffering is bad) does not vanish with minds.

  (3) Now, a reason is conceptually a consideration that counts in favor of some response
  or state of affairs; if there is literally no entity in W capable of responding,
  then in W there is nothing for the reason to count in favor of.

  (4) So in W, the reason "avoid suffering" both exists (by 1–2) and does not exist
  as a reason (by 3), since there is no bearer.

  (5) To avoid contradiction, the free-floating rationalist might say the reason exists
  but is "dormant" — like an unplayed chess rule.

  (6) But dormancy is a modal property of rules within a practice; free-floating rationales
  are not rules of any practice, so invoking dormancy imports the very agent-dependence
