  ---


  My friend and I just finished a long argument about Nozick''s tracking account of
  knowledge and whether its rejection of epistemic closure can be made consistent.
  He laid out what he called a "uniform tracking" argument, and I can''t see where
  it breaks, though its conclusion seems to destroy the theory from within. Here are
  the steps he pressed:


  (1) Nozick''s tracking conditions require that for S to know p: p is true, S believes
  p, in the nearest worlds where p is false S does not believe p, and in the nearest
  worlds where p is true S does believe p.


  (2) Suppose S knows she has hands (H), and competently deduces that she is not a
  brain in a vat (¬BIV).


  (3) In nearby worlds where H is false — say, she lost her hands in an accident —
  her evidence changes and she does not believe H. So she tracks H.


  (4) Now apply tracking directly to ¬BIV formed by deduction. In nearby worlds where
  ¬BIV is false — she is a BIV — her experiential evidence is identical, so she still
  believes she is not a BIV. Hence she fails to track ¬BIV.


  (5) My friend then proposed "uniform tracking": if a belief-forming method M yields
  tracked knowledge of p, and q is reached by applying the same rational method (here,
  deduction) to p, then any failure to track q must be an independent failure specific
  to q, not inherited from p.


  (6) Under uniform tracking, since deduction is the same method applied to H to reach
  ¬BIV, the failure in (4) is indeed independent: it stems from the modal proximity
  of BIV worlds to the actual world, not from any defect in the deduction.


  (7) But now generalize: for any empirical belief E that S tracks (Paris is the capital
  of France, my keys are in my pocket), construct the corresponding skeptical scenario
  S(E) in which E is false or systematically deceptive but evidence is preserved.
  By (4) and (6), S will always fail to track ¬S(E) independently.


  (8) This means knowledge is systematically fragmented: S can track all her ordinary
  beliefs, yet for each one she independently fails to track the denial of its skeptical
  counterpart. Closure is not globally false; it is locally blocked by a repeating
  pattern of independent tracking failures.


  (9) The problem is that this fragmentation is rationally unstable. If S knows H,
  knows that H entails ¬BIV, and applies deduction competently, but still fails to
  know ¬BIV solely because of an independent modal quirk, then her knowledge of H
  is rationally inert: it cannot support her reasoning to deny BIV, even though she
  recognizes the entailment.


