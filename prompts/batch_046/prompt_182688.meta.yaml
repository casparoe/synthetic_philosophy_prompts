  Let''s write the argument with 7-8 steps.


  Step (1): Nozick''s tracking conditions for knowledge: p true, S believes p, and
  in the nearest worlds where p is false S doesn''t believe p, and in nearest worlds
  where p is true S does believe p.


  Step (2): Suppose S knows she has hands (H), and she competently deduces she is
  not a handless brain in a vat (¬BIV).


  Step (3): For H, the nearest false worlds are ones where she lost her hands; in
  those worlds she wouldn''t believe she has hands. So she tracks H.


  Step (4): Now apply tracking directly to ¬BIV formed by deduction. In the nearest
  worlds where ¬BIV is false — she is a BIV — her experiential evidence is unchanged,
  so she still believes she is not a BIV. Thus she fails to track ¬BIV.


  Step (5): Here is the generalization: take any empirical belief E that S tracks.
  There is always a skeptical scenario S(E) in which E is false (or not genuinely
  known) but S''s evidence is preserved. By (4)-style reasoning, S fails to track
  S(E).


  Step (6): But now consider closure: if S knows E and knows E → ¬S(E), then by deduction
  she should know ¬S(E). Tracking denies this.


  Step (7): The problem: if tracking applies to beliefs formed by deduction, then
  in worlds where ¬S(E) is false (S is in S(E)), at least one premise (E or E→¬S(E))
  is false. If S tracks E, she wouldn''t believe E in those worlds, hence wouldn''t
  derive ¬S(E). So tracking should actually preserve closure for all deductively reached
  skeptical denials.


  Step (8): Therefore Nozick faces a dilemma: either tracking transmits across deduction,
  in which case closure is restored and skeptical scenarios are blocked (contradicting
  (4)), or tracking applies selectively, in which case there is no principled reason
  it blocks closure for BIV but allows it for other deductions, making the theory
  ad hoc.


