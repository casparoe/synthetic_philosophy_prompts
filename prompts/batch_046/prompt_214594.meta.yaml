  mistaken to clearly right and briefly justify the rating. Then say who is more right
  overall and identify what both are missing—particularly whether there is a principled
  way to distinguish intrapersonal aggregation from interpersonal aggregation that
  does not depend either on a contested metaphysics of personal identity or on an
  unexplained normative primitive like "first-personal authority." Be explicit about
  where your own adjudication relies on contested premises that a reasonable philosopher
  could reject.


