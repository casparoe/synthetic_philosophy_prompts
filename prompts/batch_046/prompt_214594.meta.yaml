  At a workshop on distributive ethics, two postdocs—Alex and Jordan—got into an extended
  exchange over whether Rawls''s separateness of persons objection retains any force
  once we reject a substantialist metaphysics of the self. I am writing this up for
  my own notes and would like an adjudication.


  (1) Alex opened by arguing that the objection presupposes a metaphysically robust
  boundary between persons. If personal identity is psychological continuity or four-dimensional
  perdurance, there is no non-arbitrary line preventing aggregation across what we
  conventionally call "different people" that doesn''t also prevent aggregation across
  different temporal stages of one life. Therefore, if utilitarians are wrong to aggregate
  interpersonally, they should also reject intrapersonal aggregation—yet we rationally
  trade present comfort for future welfare. The only consistent position is to allow
  both or reject both.


  (2) Jordan replied that this misidentifies the objection''s ground. The separateness
  constraint is not metaphysical but normative: it derives from the authority of first-personal
  practical reasons. Within one life, a single practical reasoner can rationally authorize
  burdens to herself at T2 for benefits at T1. Between persons, the sacrificed party
  cannot authorize the benefit to others. The boundary tracks the scope of rational
  authorization, not a metaphysical substance.


  (3) Alex countered that Jordan has now abandoned the classic formulation—"utilitarianism
  treats people as containers of utility"—and replaced it with a claim about practical
  authority. But if practical authority does all the work, then the objection is not
  specifically about the separateness of persons but about the conditions for rational
  consent. A contractualist could accept Jordan''s point without accepting that persons
  are "separate" in any ontologically interesting sense. So the objection either collapses
  into contractualism or remains unsupported.


  (4) Jordan conceded the reformulation but insisted it preserves the core anti-utilitarian
  insight. Even on this normative reading, the point is that interpersonal sacrifice
  lacks the authorizing relation that makes intrapersonal trade-offs rational. The
  utilitarian treats the sacrificed individual''s reasons as having no special weight,
  which is precisely what the separateness objection targets—whether the language
  is metaphysical or not.


  (5) Alex then pressed with a split-brain or severe dissociative case: if unity of
  practical reasoning is the criterion, then in cases where one brain supports two
  largely non-communicating centers of reasoning, sacrificing one center''s interests
  for the other should be as impermissible as interpersonal sacrifice. Yet our intuitions
  here are muddy, and if Jordan''s criterion breaks down in these cases, it shows
  that "separateness" is tracking something more like functional integration than
  moral authority. This suggests the utilitarian can reply that aggregation is permissible
  precisely where functional integration is absent—reversing Jordan''s conclusion.


  (6) Jordan responded that split-brain cases are pathological limits, not counterexamples.
  The criterion isn''t perfect functional integration but the presence of a unified
  practical standpoint capable of endorsing trade-offs. Where that standpoint is genuinely
  divided, we may indeed have two persons, and aggregation between them is wrong for
  the same reason. The edge case thus confirms rather than undermines the framework.


