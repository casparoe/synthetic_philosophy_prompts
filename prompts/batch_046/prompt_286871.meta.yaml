  protocol presupposes a concept of qualia that is philosophically incoherent. They
  invoke the quining objection—specifically the line associated with Chase and Sanborn
  in Dennett''s argument—that once all reportable and observable properties are accounted
  for, no coherent remainder remains that could be labeled a pure subjective quality.
