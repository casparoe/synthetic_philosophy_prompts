  Here are my considered verdicts on several concrete cases, and I want to know whether
  they hang together under one principle, or whether I must drop one.


  1. George, the chemist opposed to chemical weapons, should turn down the well-paid
  weapons-research job even if it means his family lives in poverty, because taking
  it would violate his ground project. The rightness of refusal does not depend on
  a prior calculation that the harm of the weapons outweighs his salary.


  2. Jim, facing Pedro''s offer to kill one Indian to save nineteen, should not kill
  the one, even though nineteen lives are at stake. If he refuses and Pedro kills
  all twenty, Jim bears no moral stain; but if he kills the one, he becomes the kind
  of agent who can do that for numbers, and that corrupts his integrity.


  3. In the drowning scenario, a husband should save his wife rather than a stranger
  of equal need. But if his reasoning includes the thought ''saving her maximizes
  utility given our relationship,'' that is ''one thought too many''—the action is
  permissible, perhaps required, but that specific utilitarian justification corrupts
