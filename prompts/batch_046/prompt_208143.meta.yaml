  - i think ideological purity is the real driver of the Terror, not just power politics:
  the jacobins genuinely believed they were saving the revolution from conspirators.

  - i also have this weird belief that small LLMs trained on primary sources amplify
  narrative fallacy more than human historians do, because they learn distributional
