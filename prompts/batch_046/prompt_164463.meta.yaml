  about who counts as part of the polity, and the Norway/US contrast isn''t just about
  penal philosophy but about boundary-drawing.


  Why it''s open: the empirical literature measures outcomes, and the normative literature
  usually appeals to either deterrence or dignity, but nobody I can find asks whether
  dignity-based arguments for rehabilitation smuggle in a membership condition without
  defending it.


