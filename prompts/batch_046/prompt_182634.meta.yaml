  Exam question:

  "Explain Newton''s bucket argument as a defense of absolute space against Leibnizian
  relationism. Then discuss whether the argument retains any philosophical force in
  light of modern physics. Specifically, address (i) Mach''s principle and whether
  Einstein''s general theory of relativity actually satisfies it or instead permits
  anti-Machian solutions; (ii) whether the hole argument—first presented during Einstein''s
  development of the field equations—undermines a naive point-substantivalism, supports
