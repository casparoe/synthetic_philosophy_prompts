  Exam question:

  "Newton''s bucket argument is traditionally read as a defense of absolute space
  against Leibnizian relationism. Explain the argument and then discuss whether it
  retains any force in light of twentieth- and twenty-first-century physics. In particular,
  address (i) Mach''s principle and its influence on Einstein''s general theory of
  relativity, (ii) whether general relativity resolves the dispute in favor of relationism,
  and (iii) whether background-independent approaches to quantum gravity—such as loop
  quantum gravity—offer a modern vindication of relationism about spacetime."


  Student answer:

  "Newton''s bucket argument shows that true rotation produces observable effects—namely,
  the concavity of water—without any change in the relative positions of the bucket
  and the water. Since relationism holds that all motion is relative to other bodies,
  and there is no relative motion between the water and the bucket during uniform
  rotation, the relationist cannot explain the bulge. Therefore, absolute space must
  exist.


  Mach criticized Newton by arguing that inertia is not due to motion relative to
  absolute space but to motion relative to the distant fixed stars. Einstein incorporated
  Mach''s principle into general relativity, which means that spacetime is entirely
  relational: the metric field is determined by matter distribution alone. Thus, general
  relativity proves that Leibniz was right and Newton was wrong.


  More recently, loop quantum gravity removes the background spacetime entirely and
  builds geometry from relational spin networks. This confirms that there is no absolute
  container; spacetime is just a web of relations among quantum events. So Mach''s
  principle, Einstein''s theory, and loop quantum gravity together form a consistent
  line that vindicates relationism and makes Newton''s bucket obsolete."


