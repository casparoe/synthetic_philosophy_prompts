  Here are my intuitions about Bernard Williams''s integrity objection — specifically
  about when a justification involves ''one thought too many''. I want to know whether
  a single principle can capture all four verdicts.


  Case 1. A surgeon must choose between saving her child and saving a stranger, both
  needing the same scarce resource. She saves her child solely because ''he is mine'';
  she does not weigh outcomes. Verdict: her integrity is intact; no alien thought
  has entered.


  Case 2. The same surgeon saves her child, but her reason is that parents who save
  their own children show lower long-term PTSD rates, which preserves her surgical
  capacity. Verdict: this is precisely one thought too many; strategic self-management
  has replaced her ground project.


  Case 3. A refugee advocate abandons direct, face-to-face solidarity work to design
  an algorithmic triage system for camps, convinced it will save more lives. She makes
  the shift after a personal crisis of meaning that reshapes what ''standing with
  the displaced'' means to her, not after a moral calculation. Verdict: integrity
  is intact; her ground project has evolved organically.


  Case 4. The same advocate makes the identical career shift, but she does so because
  she has adopted an external quantitative-ethics framework — one she learned in graduate
  study — that demands maximising lives saved regardless of personal meaning. Verdict:
  one thought too many; an alien framework has displaced her ground project.


