  partially identify with subsets of symptoms through online communities and therapeutic
  narratives, which then reshapes clinical presentation in ways that make the category
  more heterogeneous over time, not more homogeneous. Third, I ask whether this "diffuse
  looping" is genuinely a looping effect at all, or merely epidemiological noise dressed
