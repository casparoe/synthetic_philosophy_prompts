  its conclusion—there are no sleeping experiences—while providing a causal story
  about where the report comes from. Where Dennett differs is in allowing that the
  retrieval itself is a phenomenal experience: recalling the narrative has a "what
  it is like" quality, so dream reports are reports of present memories rather than
  of past experiences. Thus Malcolm and Dennett actually converge on denying phenomenal
  consciousness during sleep, and Dennett''s contribution is to show that dream reports
  can still be truthful descriptions of memory contents without being descriptions
  of prior occurrences.


