  Malcolm''s core objection is that there is no possible verification procedure for
  mental states occurring during sleep, so calling a dream an "experience" that took
  place while the subject was unconscious involves a category mistake. Dennett''s
  response is to reject the premise that anything needs verifying during sleep: on
  his account, a dream is a narrative that is assembled and inscribed into memory
  during REM, then retrieved upon awakening. This means the only event that requires
  verification is the waking report, for which ordinary first-person criteria do apply.
