  Use the first refrain (A1) to state the minimal liberal principle—that each individual
  should have decisive sovereignty over a purely private choice, such as whether to
  read a particular book, with society deferring to that preference regardless of
  others'' views. Use the second refrain (A2) to state the Pareto condition—that if
  every member of society prefers one social state to another, the collective ordering
  must reflect that unanimous preference. In the body, introduce two agents—call them
  the Prude and the Lewd—who hold diametrically opposed preferences over a single
  copy of an indecent novel: one wishes it destroyed unread, the other wishes to read
  it, and each derives satisfaction from imposing the opposite outcome on the other.
  Structure the tercets so that the interlocking rhyme scheme physically enacts the
  cyclical dependency: each agent''s liberal right over his or her own action feeds
  back into the domain of the other, producing a chain of social rankings that seems
  consistent locally but closes into contradiction globally. At the volta—located
  precisely in the turn between the fifth tercet and the final quatrain—make explicit
  that the two refrains, which initially appear as complementary safeguards (individual
  autonomy and collective rationality), are jointly unsatisfiable in this minimal
  two-person, one-book case. The closing couplet must name the exact logical cost:
  not a vague loss of harmony, but the necessary abandonment of either the minimal
  liberal right or the Pareto principle. The poem should be accurate enough that a
  social-choice theorist recognizes the specific formal structure (unrestricted domain,
  two decisive pairs, transitivity, and the contradiction derived from them) rather
  than seeing a generic conflict between freedom and efficiency. Avoid footnotes,
  citations, bibliographic references, or any appeal to sources outside the poem''s
  own logic.


