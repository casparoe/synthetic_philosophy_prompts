  are read. I call this "marginalia binding." I suggest that such a book might achieve
  a primitive form of temporal integration analogous to the brain''s neural updates,
  though it still lacks global broadcasting across independent modules. From this
  I tentatively conclude that consciousness requires not just information storage
  or functional role, but specifically this kind of sequential, substrate-altering
  integration—something a standard book lacks, but which might be approximated in
  the living-book case without reaching full consciousness.


