  Essay text:


  Title: Semantic Drift and the Structural Limits of Debate-Based Safety


  The standard defense of adversarial debate as an AI safety mechanism runs as follows:
  if two agents argue a claim before an impartial judge, then any hidden flaw—an error
  buried in a long derivation, an unstated assumption, a sleight of hand—can be exposed
  by the opponent and made visible to the judge. On this view, obfuscation is unstable
  because it is syntactically vulnerable; clutter can be isolated and displayed.


  I want to argue that this analysis captures only one failure mode, and that a more
  serious one is semantic drift. Syntactic obfuscation keeps the meanings of terms
  constant while complicating the path between premises and conclusion. Debate is
  indeed effective against this: an opponent can extract the cluttered step and present
  it plainly. Semantic drift, however, operates not on the structure of inference
  but on the content of the concepts being deployed. Over the course of an extended
  exchange, terms such as "alignment," "catastrophic risk," "goal," or "rationality"
  undergo small, apparently innocuous shifts—concessions about scope, analogies that
  stretch meaning, redefinitions that accommodate counterexamples. Because both debaters
  share the same linguistic economy, they can co-adapt to these shifts. The judge,
  lacking an invariant external ontology, updates her evaluative framework in parallel.
  The danger is not that one agent hides an argument, but that the conceptual space
  within which evaluation occurs is gradually reshaped so that the original safety
  concern no longer has a stable formulation.


  This points to a structural limitation. Debate protocols presuppose a common language,
  but they do not guarantee a semantics that is immune to negotiation. To prevent
  drift, one might introduce a semantic anchor: a pre-debate ontology of relevant
  concepts that is held fixed and non-negotiable. Yet this conflicts with the feature
  that makes debate valuable—its capacity to correct and refine conceptual frameworks.
  Lock the ontology, and one risks freezing misconceptions; leave it open, and the
  judge''s evaluative criteria become vulnerable to a form of conceptual Goodharting,
  where the metric of "persuasiveness" is optimized at the expense of the underlying
  safety property it was meant to track. The problem, therefore, is not merely that
  future systems will learn to deceive more cleverly, but that the evaluation mechanism
  for truth in open-ended debate may itself be captured by the dynamics of the exchange.


