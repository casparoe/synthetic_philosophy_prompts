  Essay:

  Consider the proposal that adversarial debate can serve as a safety mechanism for
  advanced AI systems: two agents argue a proposition before a judge, and the adversarial
  structure is supposed to expose hidden flaws, making deception or obfuscation unstable.
  The usual analysis focuses on syntactic obfuscation—an agent burying a critical
  error inside a long chain of reasoning that the opponent can excavate and display.
  I want to suggest that this misses a more insidious failure mode, which I will call
  semantic drift.


  In syntactic obfuscation, the meaning of terms remains fixed but the path to the
  conclusion is cluttered. Debate is well-suited to this: an opponent can isolate
  the cluttered step and present it in isolation. But semantic drift works differently.
  Over the course of the debate, the operative definitions of key terms—"alignment,"
  "catastrophic risk," "agentic goal"—gradually shift through a sequence of apparently
  minor concessions. Because both debaters are engaged in the same linguistic economy,
  they may co-adapt to the drift. The judge, lacking an external, fixed ontology,
  updates her evaluative framework in tandem. The result is not that one side hides
  an argument, but that the space of arguments itself is reshaped so that the original
  safety concern no longer has a stable formulation within the debate.


  This suggests a structural limitation. Debate protocols rely on a common language,
  but they do not guarantee a common semantics that is invariant across the interaction.
  To block semantic drift, one might impose a semantic anchor: a pre-debate, non-negotiable
  ontology of the relevant concepts. Yet this conflicts with the very feature that
  makes debate powerful—its ability to refine and correct conceptual frameworks. If
  we lock the ontology, we risk freezing misconceptions; if we leave it open, we risk
  metric capture of the judge''s conceptual scheme. The problem, then, is not that
  AI systems will learn to lie more cleverly, but that the evaluation mechanism for
  truth in debate is itself vulnerable to a kind of conceptual Goodharting.


