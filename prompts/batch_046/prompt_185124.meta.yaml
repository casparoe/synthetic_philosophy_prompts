  like a brain. Individual ants are neurons, pheromone trails are synapses or neurotransmitters,
  the queen is either the genome or some kind of executive controller, and the colony''s
  foraging behaviour is like cognition or decision-making. Some folks use this to
  say Aunt Hillary genuinely thinks, or at least has beliefs and desires.


  But I want to push on this. There''s also this mechanism called stigmergy — coordination
  through environmental traces rather than direct signalling — and recently some people
  have framed colony dynamics in terms of predictive processing, treating the pheromone
  network as minimising free energy like a brain does. That sounds clever, but I''m
  worried it smuggles in representational content and a global workspace that the
  colony just doesn''t have.


