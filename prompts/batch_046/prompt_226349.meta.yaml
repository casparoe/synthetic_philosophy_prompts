  Notes for a short essay: "Reflexive anchoring and the normative architecture of
  factored cognition"


  The standard presentation of Humans Consulting HCH (HCH) treats it as an epistemic
  scaffold: a root agent decomposes a hard problem and consults subordinate agents,
  each solving tractable subproblems, with answers aggregated upward. Paul Christiano''s
  related notion of factored cognition extends this by breaking reasoning itself into
  modular, verifiable steps. Both are usually defended as solutions to scalable oversight—ways
  for a system (or a person) to tackle questions beyond direct comprehension.


  I want to argue that this architecture implicitly presupposes a particular model
  of rational deliberation, and that making the presupposition explicit reveals a
  gap. In HCH, each node receives a well-defined subquestion; the tree assumes that
  answers can be composed without residue. But many hard questions—especially those
  touching on values, risk, or interpretation—do not decompose cleanly. A sub-agent
  might answer "what are the consequences of policy X?" in a way that smuggles in
  normative weightings (e.g., which outcomes count as costs). The root agent then
  inherits these weightings without having endorsed them.


  To address this, I propose "reflexive anchoring": every node in a factored tree
  must tag its outputs according to whether they depend on empirical premises, axiological
  commitments, or both. The root agent then receives not only answers but a dependency
  map, allowing it to see where contested values enter the reasoning chain. This transforms
  HCH from a purely epistemic tree into an idealised model of public deliberation—one
  in which transparency about normative inputs is structural rather than incidental.


  The cost is fragility. Human consultants are rarely able to cleanly separate factual
  claims from value-laden framing. Requiring reflexive anchoring might paralyse the
  tree or expose irreconcilable disagreement at every node. Nevertheless, without
  it, factored cognition risks what I call "normative fragmentation": the appearance
  of coherent reasoning that is actually a patchwork of incompatible local optima.


  Please comment on these notes. In particular:


  1. Is the distinction between empirical and axiological dependencies clear enough,
  or does it collapse under pressure?

  2. Does reflexive anchoring genuinely improve on standard HCH, or does it merely
  relocate the difficulty to the tagging mechanism?

  3. Are there parts of the argument that seem interesting but underdeveloped, or
  conversely parts that feel redundant?


  Keep your remarks focused; I am not looking for a bibliography or further reading.


