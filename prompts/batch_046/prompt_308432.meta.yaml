  At a recent workshop on long-run predictive theories, I observed a sustained disagreement
  between two colleagues—Dr. Aris Thorne, an economic historian, and Dr. Beatrice
  Luo, a philosopher of science—regarding whether Thomas Malthus''s theory of population
  and subsistence should be classified as falsified, dormant, or genuinely "right
  but early." I am writing my dissertation on epistemic latency in macro-scale predictions,
  and I am trying to formalize the conditions under which a predictive failure can
  be suspended rather than refuted. Their exchange seemed to turn on exactly this
  issue, but they reached an impasse. I would like you to adjudicate their arguments
  point by point, indicate who is more correct overall, and identify what both are
  missing—particularly regarding whether "predictive dormancy" is a coherent category
  or merely a relabeling of ad hoc rescue.


  Then describe the back-and-forth:


  Thorne opened by insisting that Malthus was straightforwardly falsified by the nineteenth-
  and twentieth-century demographic transition. The geometric-arithmetic divergence
  never materialized at global scale because technological innovation in agriculture
  consistently outpaced population growth. To claim Malthus was "right but early"
  about a future resource crisis—say, phosphorus depletion or climate-induced yield
  collapse—is, on Thorne''s view, an immunizing maneuver: one retains the abstract
  mechanism only by shifting its empirical boundary conditions arbitrarily.


  Luo replied that this conflates local falsification with global refutation. The
  Malthusian mechanism was never intended as an unconditional law but as a boundary-condition
  model that activates when technological growth stalls relative to reproductive pressure.
  She argued that the theory exhibits "predictive dormancy": its core causal structure
  remains intact, but its manifestation is masked by an exogenous scaling parameter—agricultural
  productivity growth—that operates on a different temporal scale. This is not ad
  hoc, she said, because the parameter is independently measurable and was explicitly
  acknowledged, though underestimated, in Malthus''s own framework.


  Thorne countered that calling this "dormancy" just renames the problem. If a theory''s
  predictions are systematically postponed by an ever-available auxiliary hypothesis—technological
  rescue—then it risks unfalsifiability. He asked Luo what observable outcome, within
  the next century, would count as genuine falsification of the Malthusian core rather
  than another deferral.


  Luo answered that falsification would require demonstrating that population can
  grow indefinitely even when technological productivity is held constant or declines,
  without triggering subsistence checks. She added that Thorne''s demand for immediate
  observational verdict ignores the asymmetry of long-run predictions: a theory predicting
  a boundary crisis in 300 years cannot be falsified by 150 years of counter-evidence
  if the causal pathway remains open.


  Thorne then argued that Luo''s asymmetry principle is itself problematic: it grants
  long-run theories an unjustified epistemic privilege. By that logic, any failed
  prophecy could be resurrected. He noted that Luo''s "independent scaling parameter"
  looks suspiciously like the kind of post-hoc adjustment that philosophers of science
