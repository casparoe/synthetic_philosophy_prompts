  emergence,'' in which every individual member of an institution sincerely prefers
  a structural change, yet the institution persists unchanged because of interdependent
  contractual and normative relations that are not properties of any single member.
  She claimed that in such cases, the explanatory work is done by relational structures—what
  she called ''system-level dependency webs''—that cannot be captured by aggregating
  individual preferences without severe loss of predictive and causal information.


