  Rejection"—that treats the preface paradox not merely as a static conflict between
  believing each premise and believing their conjunction, but as an analogue to the
  epistemic situation in a large-scale meta-analysis: one accepts each individual
  study''s conclusion with high confidence, yet knows that the false-positive rate
  across hundreds of trials makes it virtually certain that some number of accepted
  results are erroneous. By contrast, I frame the lottery paradox through the lens
  of instrument calibration, where one trusts a single measurement falling within
  tolerance bounds but rejects the specific claim that this particular unit is defective,
  even when the base rate of defects is identical to the false-positive rate in the
  meta-analytic case. The essay''s central contention is that philosophers have tended
  to analyze both puzzles as problems about the logic of belief aggregation in a single
  agent at a single time, whereas a scientist''s intuition is that the tension dissolves—if
  it dissolves at all—only when we model belief as a dynamic, feedback-sensitive process
  distributed across time and instruments, rather than as a static set of propositional
  attitudes.


