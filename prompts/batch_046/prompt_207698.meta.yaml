  Consider Daniel Dennett''s account of "real patterns" and the distinction among
  the physical, design, and intentional stances. In particular, address the following:
  (a) What makes a pattern "real" for Dennett, and why does predictive success alone
  not suffice? (b) How does the intentional stance differ from the design stance in
  terms of the kind of patterns it tracks? (c) A critic argues that if beliefs and
  desires are merely real patterns in behavior, then attributing them to an agent
  is no more ontologically committing than attributing a "center of gravity" to a
  physical object. Evaluate whether this analogy holds, paying attention to whether
  intentional-stance patterns possess the same kind of counterfactual robustness and
  compressive power that physical patterns do.


  Student answer (mixed quality):

  "For Dennett, a real pattern is any regularity that allows us to make successful
  predictions about a system. Predictive success is actually sufficient for reality—if
  treating something as a belief lets me predict behavior, then beliefs are real.
  This applies across all three stances: the physical stance tracks particle interactions,
  the design stance tracks functional parts like hearts or algorithms, and the intentional
  stance tracks rational beliefs and desires.


  The intentional stance differs from the design stance mainly in scale. The design
  stance looks at how a system is engineered to achieve a goal, like a thermostat
  maintaining temperature. The intentional stance does the same thing but for more
  complex systems—essentially applying evolutionary design principles to the brain
  to see how cognition was built to solve problems. So when we adopt the intentional
  stance, we are really just using the design stance on mental architecture.


  As for the center-of-gravity analogy: it works perfectly. Just as a center of gravity
  is a useful fiction with no physical location, beliefs are useful fictions with
  no neural location. Dennett says both are real patterns, but neither is physically
  instantiated. The intentional stance is therefore a pragmatic tool with no ontological
  weight, exactly like calculating a center of mass. The patterns are robust enough
  for everyday prediction, but they don''t support deep counterfactuals about internal
  states because there are no internal states to begin with."


