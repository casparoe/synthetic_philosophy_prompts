  "I am a retired field ecologist who has recently begun reading philosophy of value
  and environmental ethics, and I find myself with a cluster of intuitive verdicts
  about habitat destruction and wild-animal welfare that I cannot quite systematize.


  Consider the following cases.


  First, clear-cutting an old-growth boreal forest and allowing it to regenerate as
  a sparse, managed conifer plantation eliminates the dense populations of insects,
  small rodents, and ground-nesting birds that characterized the original ecosystem—populations
  marked by intense winter starvation and high predation rates. The plantation supports
  far fewer individuals and far less intense ecological interaction. My verdict: on
  balance, this reduces aggregate wild suffering; I find the destruction, in this
  specific welfare calculus, regrettable for biodiversity reasons but not wrong in
  terms of net suffering.


  Second, draining a freshwater peat bog—an environment that sustains enormous densities
  of amphibians, aquatic insects, and small fish with very high reproductive turnover—into
  dry meadow supporting sparse, long-lived mammal and bird populations. Again, my
  verdict is that the reduction in the total number of lives lived in likely net-negative
  conditions makes this welfare-positive, despite the ecological loss.


  Third, fragmenting a continuous prairie with highways and fencing, creating isolated
  habitat patches. In these patches, prey populations boom in the temporary absence
  of predators near the barriers, then crash cyclically through starvation and epidemic
  disease. Here my verdict reverses: the fragmentation is welfare-negative. Even if
  average biomass across the fragments is lower than in the continuous system, the
  suffering is concentrated in horrific crash events, and the instability itself seems
  to generate more suffering per unit time.


  Fourth, a prescribed savanna burn conducted every few years to suppress woody encroachment,
  thereby maintaining open grassland with stable populations of large grazers—animals
  with low reproductive rates and relatively stable lives—while immediately killing
  thousands of small vertebrates, reptiles, and insects in the fire. I keep returning
  to this case. The maintained system looks like case one and two—low turnover, low
  suffering—yet the mechanism involves direct, immediate killing rather than indirect
  reduction of carrying capacity. I cannot settle whether my acceptance of cases one
  and two commits me to accepting the burn, or whether the directness of the harm
  breaks the pattern.


  Fifth, introducing an efficient non-native predator to an island where an herbivore
  has overpopulated and is suffering cyclical mass starvation. The predator reduces
  herbivore numbers through predation that involves fear and painful death, preventing
  larger starvation events. My verdict is that this is welfare-negative and unacceptable,
  even if the arithmetic of lives saved from starvation resembles that in case one.


  Is there a coherent principle—perhaps concerning the distinction between reducing
