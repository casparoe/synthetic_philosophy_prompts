  Prompt text:


  "Consider the widespread institutional practice in wealthy liberal democracies:
  within borders, the state enforces robust egalitarian distributive mechanisms—progressive
  income taxation, universal public healthcare and education, and democratic accountability
  over economic policy—while treating obligations to non-citizens outside those borders
  as largely discretionary humanitarian charity rather than demands of justice. This
  domestic regime is funded in part by economic arrangements—global supply chains,
  resource extraction, tax-base mobility, and climate externalities—that systematically
  affect foreigners who have no vote in, and often receive little direct benefit from,
  the redistributive scheme.


  What philosophical commitments about moral membership, the scope of justice, and
  the relation between coercion and obligation does this bifurcated practice presuppose?
  Reconstruct the implicit theory: does compatriot priority rest on a relational view
  (shared institutions and reciprocity), an associative view (common culture or history),
  a statist view (sovereignty as a moral boundary), or some hybrid? Distinguish what
  the practice strictly requires from what merely fits it well. Then examine its internal
  coherence: if the justification for domestic redistribution is that citizens are
  jointly subjected to a coercive institutional order that must be justified to them,
  does that same order not also coerce outsiders through trade, migration controls,
  and environmental harm, thereby generating parallel obligations? Or can a defender
  consistently maintain that sovereignty creates a ''boundary of justice'' without
  collapsing into the view that any harm across that boundary is morally negligible?


  Finally, suppose we replaced the implicit view with a cosmopolitan alternative in
  which distributive justice applies to all persons affected by a cooperative scheme,
  regardless of citizenship. Which elements of the current practice—border controls,
  tax jurisdiction, welfare eligibility, democratic representation—would have to be
  redesigned, and which could remain intact under a revised justification?


  Please structure your answer in the following sections, in this order:


  1. The practice and its puzzle (about 150 words): describe the institutional arrangement
  precisely and identify the apparent philosophical tension.


  2. Reconstructing the implicit theory (about 300 words): lay out the rival accounts
  of compatriot priority that could license the practice, indicate which the practice
  most strongly presupposes, and flag points where the practice is philosophically
  underdetermined.


  3. Coherence and internal tension (about 250 words): test whether the presupposed
  view can consistently justify both domestic redistribution and the externalization
  of costs, and address whether a control-based or reciprocity-based defense survives
  scrutiny.


  4. The cosmopolitan replacement and institutional consequences (about 250 words):
  specify what must change in practice if the boundary of justice is removed, and
  identify which current policies are merely contingent rather than conceptually required.


  5. Verdict (about 100 words): state whether the practice rests on a defensible philosophical
  view or on an unstable combination of commitments."


