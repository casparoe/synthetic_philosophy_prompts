  "Tranquilism, as I understand it, is the ethical position that only the absence
  of craving and suffering has intrinsic value, while positive states like joy or
  knowledge are only instrumentally good if they serve that absence. Compared with
  negative utilitarianism, tranquilism is narrower: negative utilitarianism seeks
  to minimize suffering for all affected beings, including those not yet born, whereas
  tranquilism evaluates states of consciousness based on whether craving and suffering
  are present, without necessarily extending its calculus to future populations. This
  makes tranquilism closer to a theory of well-being than to a population-level moral
  theory.


  Regarding Epicurean ataraxia, the two views overlap significantly. Epicurus defined
  pleasure as the absence of pain in the body and disturbance in the mind, which sounds
  like tranquilism''s core commitment. However, Epicurus also recognized kinetic pleasures—active
  enjoyments like eating or friendship—as part of a good life, provided they do not
  produce subsequent disturbance. Tranquilism seems stricter: if only absence has
  intrinsic value, then even harmless kinetic pleasures are at best instrumental.
  So tranquilism is like a purified form of Epicurean static pleasure.


  As for the hypothetical being in sensory deprivation with zero craving, tranquilism
  should indeed regard this state as maximally good. Since there is no suffering and
  no craving, all conditions for intrinsic value are satisfied; the absence of positive
  experience is not a deficit, because positive experience carries no intrinsic weight.
  One might worry that such a being lacks consciousness-worth, but tranquilism does
  not value consciousness for its own sake—only the quality of absence within it.


  Finally, on the permissibility of creating beings: tranquilism does not automatically
  forbid procreation, but it sets a stringent condition. A being may be created only
  if its life can be guaranteed free of both suffering and craving. Given that embodied
  existence typically involves biological drives, this condition is rarely met, which
  gives tranquilism a practical affinity with antinatalism. Still, the view itself
  is about value, not about reproductive ethics, so one should not confuse the practical
  implication with the theoretical core."


