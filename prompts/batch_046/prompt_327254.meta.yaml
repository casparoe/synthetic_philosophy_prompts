  mental states, diligence, and actions were identical across both cases, but they
  disagreed sharply about the moral evaluation.


  Leo argued that the engineer in Scenario One is properly subject to graver moral
  blame—not merely legal liability—because moral assessment tracks the actual causal
  footprint of one''s actions in the world. He claimed that to insist on identical
  blame is to treat moral evaluation like an internal scorecard, ignoring that being
  a responsible agent means being answerable for what one''s conduct actually brings
  about, including unforeseeable interactions. Mara countered that this collapses
