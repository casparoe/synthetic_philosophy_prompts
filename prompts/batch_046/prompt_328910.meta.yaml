  (1) For somatic conditions I am a biological naturalist in roughly the Boorsean
  vein: a state is a disease if and only if some internal part functions with statistically
  abnormal inefficiency relative to the species-typical design, and this judgment
  can in principle be made without importing values.


  (2) For mental disorder I am a harmful-dysfunction normativist: psychiatric taxonomy
  necessarily combines an objective dysfunction component with a normative assessment
  of harm, and neither can be eliminated.


  (3) I reject evolutionary debunking arguments in medicine; that our disease categories
  may have been shaped by evolutionary selection or social utility does not, I think,
  undermine their epistemic standing.


  (4) I distinguish sharply between "health," which I take to be an irreducibly evaluative
  and culturally variable notion, and "pathogen," which I understand as a purely causal-descriptive
  category—an organism that initiates a specific pathological process, with no evaluative
  content.


  (5) Within evolutionary medicine I favour a teleological, value-neutral criterion
  for distinguishing adaptive defensive responses (such as fever or acute anxiety)
  from genuine pathological failures: the distinction turns on whether a regulatory
  mechanism is functioning as evolved, not on statistical rarity, and I take this
  teleological assessment to be entirely free of normative judgment.


  (6) I deny that congenital deafness or achondroplasia are diseases, but not because
  they lack biological dysfunction—indeed they involve statistically atypical functioning—but
  because in accommodating environments they do not cause harm; hence my exclusion
  of them rests on social norms rather than on biological statistics.


