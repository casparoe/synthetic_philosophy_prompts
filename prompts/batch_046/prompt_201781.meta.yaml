  at day zero? Is either identical to the alloy present? Explain whether temporal
  parts solve any residual puzzle.


  Student answer:

  Wiggins''s dominant sortal tells us that an object persists according to the conditions
  set by its kind. For a statue, the dominant sortal is "statue," which fixes persistence
  on maintaining artistic form and location, not on retaining particular atoms. The
  alloy, by contrast, falls under "lump of metal" or "mass of matter," whose persistence
  conditions allow complete material turnover. So the statue survives the replacement,
  but the original alloy does not; the statue is not identical to the alloy at any
  time.


  Baker''s constitution view adds that the statue and the alloy are coincident but
  not identical. They share spatial location and some properties, but they differ
  in modal properties: the alloy could be melted into a cube and survive, whereas
  the statue could not. This supports the conclusion that even when the alloy is replaced
  atom by atom, the statue persists because it is constituted by, not composed of,
  successive alloys.


  However, Baker''s view also implies that when the original alloy is destroyed, the
  statue is destroyed with it, since constitution requires an actual constituting
  object. Because a new alloy immediately takes its place, a new statue is constituted
  every hour. Therefore, the statue at day thirty is not identical to the statue at
  day zero, even though they share the same form. Temporal parts avoid this problem:
  if the statue is a four-dimensional worm composed of hourly temporal parts, then
  each part is constituted by a different alloy, but the whole statue persists as
  the sum of these parts. Thus temporal parts preserve both Baker''s constitution
  relation and the intuition that the museum displays one continuous statue.


