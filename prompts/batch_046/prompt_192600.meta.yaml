  Write a short research proposal—about 800 words, suitable for a philosophy workshop
  or small grant—on a conceptual problem at the intersection of welfare-state conditionality
  and the category of the "undeserving poor." Frame the precise question like this:
  workfare regimes justify benefit sanctions by claiming that non-compliant recipients
  are undeserving, but compliance is verified through proxy behaviors (attendance
  logs, job-search diaries, paperwork) that the state can observe while remaining
  ignorant of the recipient''s internal motivation or structural constraints. The
  existing literature either treats conditionality as a straightforward contractual
  exchange or condemns it as disrespectful of autonomy, yet neither side examines
  whether the epistemic asymmetry between observable compliance and unobservable desert
  makes the "undeserving" label conceptually unstable—potentially collapsing the distinction
  between moral failure and bureaucratic misalignment. Your proposal should state
  the question with this framing, explain why standard contractualist and relational-egalitarian
  answers leave the epistemic dimension untouched, propose an approach that analyzes
  the logic of proxy verification rather than adding empirical data, say what a useful
  result would look like (e.g., a criterion for when conditionality tracks desert
  versus when it manufactures undesert) and what would count as failure (e.g., showing
  that the epistemic problem is soluble by better administration), and keep the scope
  realistic for a single-semester conceptual project. Do not include a bibliography,
  citation list, or literature review by name; refer to positions and arguments generally,
  and note where you will supply references later. Begin the response with the proposal
