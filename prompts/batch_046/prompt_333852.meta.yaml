  relative. For any event E, there are events simultaneous with E in one frame but
  not in another. If "now" is real and extends spatially, then what is "now" for a
  distant observer? The argument claims that if an observer considers a distant event
  as "now" in one frame, and another frame considers a different event as "now", then
  all those events must be equally real. Rietdijk (1966) and Putnam (1967) argued
  this.


