  Question: Functionalism holds that mental states are constituted by their causal-functional
  roles rather than by intrinsic physical properties. Multiple realizability—the claim
  that a given mental state can be instantiated by diverse physical substrates—has
  traditionally been treated as a primary motivation for functionalism. But some philosophers
  argue that if multiple realizability is pushed too far, it actually threatens functionalism
  by making mental-state attribution excessively liberal. Consider in particular the
  hypothetical case of "functional mirroring": a distributed, non-biological system
  (for instance, a blockchain-based ledger architecture with distributed nodes) that
  replicates every causal-functional relation characteristic of human belief-formation—including
  feedback loops, error-correction, and representational updating—without sharing
  any evolutionary history or biological substrate with human cognizers. Would a standard
  causal-role functionalist be compelled to attribute beliefs to such a system? Does
  this case strengthen the functionalist program, or does it reveal a need for supplementary
  constraints (teleological, representational, or otherwise)? In your answer, discuss
  the relationship between Putnam''s original arguments for multiple realizability
  and later objections—such as those involving liberal attribution or absent qualia—that
  attempt to limit functionalism''s scope.


  Student answer: Functionalism identifies mental states by causal role, not by physical
  makeup, so if a silicon brain or distributed computer network replicates the relevant
  inputs, outputs, and internal transitions, it should have the same beliefs and pains
  as a human. Multiple realizability supports this: Putnam showed that pain isn''t
  identical to C-fibers because an octopus could feel pain with different biology,
  and Block extended this insight with his Chinese-nation thought experiment, showing
  that even an entire population arranged to simulate neural firing might realize
  mental states. So more realizers mean stronger functionalism. However, if we allow
  every physical system that matches the causal profile—including the economy of Bolivia
  or a blockchain ledger that copies belief-formation dynamics—to count as having
  beliefs, we face the problem of liberalism. To block this, some functionalists appeal
  to evolutionary history, like Millikan''s biosemantics, which adds a teleological
  constraint on proper function. Others, like Fodor, restrict mental content to narrow
  representational roles computed over internal symbols, but Fodor''s computationalism
  is actually incompatible with functionalism because he insists that mental representations
  require causal-historical ties to their contents rather than pure causal-role relations.
  In the functional-mirroring case, I think functionalism should just bite the bullet:
  if the blockchain really duplicates every functional relation of belief, then it
  has beliefs. The worry only arises if we confuse belief with phenomenal consciousness,
  but functionalism was designed for propositional attitudes, not consciousness, so
  the tension dissolves once we keep those separate.


