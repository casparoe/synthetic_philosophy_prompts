  execution scene itself dramatize Camus''s claim that modern societies hide capital
  punishment to preserve moral comfort? In what ways does Meursault''s trial—where
  the prosecution constructs a narrative of monstrous indifference—illustrate what
  Camus called the "administrative murder" that substitutes bureaucratic certainty
