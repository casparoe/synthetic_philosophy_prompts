  loosely on the structure of tragic choice, I argue that selecting a flawed candidate
  produces a remainder of harm that is not eliminated by the comparison with the worse
  alternative. However, unlike the individual tragic agent who bears the moral remainder
  personally, the voter in a mass election participates in a mechanism of axiological
  attenuation: the harm is real, collectively authored, yet so dispersed across millions
  of co-deciders that no single voter experiences the corresponding guilt or regret.
  I introduce the term "moral attenuation coefficient" informally to describe how
  responsibility dilutes as the scale of collective authorship increases, though I
  do not claim this is a precise mathematical relation. The essay asks whether this
  attenuation undermines democratic accountability or reveals that voting ethics must
  incorporate a structural, rather than purely individual, theory of complicity.


  Specific notes on the argument''s structure:

  1. The opening distinguishes three positions: the duty-based view (voting as civic
  obligation), the expressive view (voting as self-expression regardless of outcome),
  and the instrumental view (voting to affect outcomes). I suggest that all three
  treat the voter as an isolated unit of analysis.

