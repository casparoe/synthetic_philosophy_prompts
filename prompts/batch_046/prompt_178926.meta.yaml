  Title/Topic: "Formal Constraint and Semantic Drift in Translation: The Retrograde
  Sestina Case"


  Question: Present a hypothetical source poem in Italian structured as a retrograde
  sestina (six end-words that reverse their lexical order stanza by stanza rather
  than rotating positions). The end-words are: notte, luce, ombra, silenzio, voce,
  ritorno. In English translation, preserving the reverse lexical sequence forces
  grammatical choices that shift the semantic field (e.g., "return" must serve as
  a verb in one stanza and a noun in another, altering agency). Ask students: Is the
  translator obligated to preserve the retrograde pattern if it systematically distorts
  the thematic coherence of the poem? Evaluate this using the principle of le ton
  beau de Marot, but do not merely summarize the principle; show how it applies specifically
  to this case and where it conflicts with semantic fidelity.


