  2. The principle of formal preservation (ton beau) — that form carries meaning.

  3. The conflict: in English, maintaining the exact reverse sequence of end-words
  (return, voice, silence, shadow, light, night) creates syntactic strain that forces
  reinterpretation of agency.

  4. A nuanced position: the translator should preserve the constraint only if they
  can find English equivalents that maintain both the reverse sequence and the core
  semantic roles; otherwise, they should approximate the retrograde effect through
