  and translation aesthetics. Write one essay question on the principle of le ton
  beau de Marot — the idea that a translator should reproduce the formal and sonic
  architecture of the original — but do not allow answers that merely summarize the
  concept. Instead, inject a specific constructed case: a hypothetical Italian poem
  in a ''retrograde sestina'' form in which six end-words (notte, luce, ombra, silenzio,
  voce, ritorno) reverse their lexical order across stanzas rather than rotating positions.
  Ask students to determine whether the translator is obligated to preserve this retrograde
  pattern when rendering the poem into English, given that maintaining the exact reverse
  sequence forces grammatical choices that alter semantic agency (for instance, requiring
  ''return'' to function as both verb and noun in successive stanzas). The question
  should require students to confront whether formal fidelity is a semantic duty or
  an aesthetic luxury, using the specific linguistic conflict rather than generic
  arguments about ''meaning vs. form.''


