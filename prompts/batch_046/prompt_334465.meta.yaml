  As a doctoral student working at the intersection of normative ethics and the logic
  of practical reasons, I have been trying to understand why the philosophical debate
  over supererogation—acts that are morally good yet not morally required—has remained
  in a state of persistent stalemate for decades, despite near-unanimous agreement
  on the paradigm cases. On one side, defenders maintain that if an act involves a
  significant personal cost that exceeds some context-sensitive threshold, the underlying
  moral reason, however weighty, does not generate an obligation; critics respond
  that this introduces an ad hoc deontic gap, since if a reason is genuinely decisive
  it should yield a corresponding ought, and anything weaker is merely a permission
  to act well, not a distinct category of the supererogatory. Meanwhile, another strand
  of the literature attempts to dissolve the category by arguing that what looks like
  optional beneficence is really a case of competing obligations of different strengths,
  leaving no logical space for an act that is genuinely better-than-required but not
  required at all. What strikes me is that both camps accept the same first-order
  judgments—saving a stranger from drowning at risk to one''s life is heroic but not
  obligatory; donating a modest portion of income to effective aid is laudable but
  not mandatory—yet they interpret these judgments through incompatible meta-ethical
  frameworks: one treats supererogation as a structural feature of practical reasoning
  in which agent-relative costs can block obligation-formation without negating reason-force,
  the other treats it as an illusion produced by conflating weak obligations with
  non-obligations. My working hypothesis is that the disagreement is not empirical—nobody
  denies the phenomenology of moral praise and blame in these cases—nor purely verbal,
