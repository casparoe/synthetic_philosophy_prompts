  really involves a special kind of moral stain — the ''dirty hands'' problem — or
  whether that is just ordinary hard choice dressed up. To test it, I invented a small
  framework I call the moral absorption thesis: in a legitimate democracy, citizens
  delegate authority to representatives, and any necessary moral wrong done in that
  role gets absorbed into the office itself, leaving neither the voter nor the representative
  personally stained in the usual way. I tried to defend this, and ended up with an
  argument that seems to prove the absorption thesis is either redundant or impossible.


  Here are the steps:


  (1) If an act is genuinely required — you have decisive reason to do it and no stronger
  reason against — then it is not wrong all-things-considered.


