  the leader personally but is absorbed by the institutional role, so citizens share
  neither the blame nor the stain.


  (4) But if the residue is fully absorbed by the office, then the leader personally
  is not dirty; the dirt belongs to the institution. So dirty hands, as usually described,
  disappears for the individual.


