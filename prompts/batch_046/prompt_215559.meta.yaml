  upon exposure to air. The coating is sealed under a thin layer of inert gas, so
  air only reaches it if the vase cracks. Is the vase fragile? In your answer, distinguish
  between finks and masks, apply the distinction to this case, and explain whether
  the presence of the polymer affects whether the vase genuinely possesses the disposition
  to break."


