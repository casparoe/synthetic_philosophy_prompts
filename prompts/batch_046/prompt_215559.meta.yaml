  the assessment. Fragility is the disposition to shatter under stress. To analyze
  this, we must distinguish finks from masks. Martin''s classic electro-fink case
  involves a wire that is conductive, but an attached device detects connection to
  a circuit and instantly renders it non-conductive—thereby removing the disposition
  exactly when the stimulus is applied. Johnston, by contrast, introduced masks: an
  antidote may prevent poison from killing, but the poison''s toxic disposition remains
  intact; only its manifestation is blocked. In the present case, the polymer is initially
  a mask. The crystal structure is unchanged, and an external barrier blocks shattering.
  However, because the polymer activates precisely when air enters through a crack—i.e.,
  at the very moment the disposition begins to manifest—it actually functions like
  a fink: it removes the disposition to break further at the instant of testing. So
  the vase lacks a genuine, unblocked disposition to break. Applying Lewis''s simple
  conditional analysis, the counterfactual ''if the vase were struck, it would break''
  is false in the actual world, since the polymer is present and would intervene.
  Therefore, the vase is not truly fragile; it merely has the appearance of fragility
  because of its material composition."


