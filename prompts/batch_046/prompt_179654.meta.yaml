  distinction. (c) Evaluate the following student claim: that Dennett''s example is
  really just a version of Searle''s Chinese Room; that Searle denies computers can
  have even derived intentionality; and that the possibility of misrepresentation—state
  B occurring when no predator is present—proves the two-bitser''s states must possess
