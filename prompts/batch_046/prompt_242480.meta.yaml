  the very people they categorize, so that the category and its subjects co-evolve
  over time. In our discussion group, a disagreement has hardened around whether this
  dynamic undermines the reality of psychiatric kinds altogether, and it has become
  especially sharp now that someone proposed applying the framework to a new, narrowly
  defined condition: what they call "persistent feed-state dissociation," a hypothetical
  clinical profile describing individuals whose sense of continuous selfhood seems
  to fragment specifically across algorithmically curated information streams.


  One side argues that looping effects are devastating for realism about psychiatric
  categories: if labeling someone with "feed-state dissociation" actually produces
  the fragmented self-experience it purports to describe—by giving people a narrative
  template, altering their self-monitoring, and reshaping their social interactions—then
  the category is more of a self-fulfilling artifact than a discovery. They point
  out that classic cases like multiple personality disorder seem to have proliferated
  precisely where clinicians looked for them. The other side replies that looping
  is compatible with realism: interactive kinds are still kinds. They note that diabetes
  classifications loop back on patient behavior (diet monitoring, insulin protocols)
  without anyone claiming diabetes is invented, and that suffering reported under
  the proposed profile is genuinely debilitating regardless of how the label arrived.
  Both sides agree on the empirical observations—people do report the symptoms, behaviors
  do shift after clinical framing, and the suffering is not feigned—but they have
  not moved in months. The first side insists that "real" requires some independence
  from the classificatory practice; the second insists that independence is the wrong
  criterion, and that what matters is whether the loop tracks a stable pattern of
  harm and response.


