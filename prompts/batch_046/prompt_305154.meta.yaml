  Mara responded by sharpening her account around what she called "counterfactual
  stability": a pleasure is a state such that, holding fixed the subject''s other
  preferences, they would choose to prolong or repeat the generating conditions even
  when no further instrumental goods are at stake. She argued that both the taste
  of a well-cooked meal and the resolution of a logical puzzle exhibit this stability,
