  "I''m drafting an essay for a philosophy of value workshop, and I want structural
  and conceptual feedback—not references—on the following argument.


  The essay examines lexical-threshold negative utilitarianism (the view that suffering
  has lexical priority over pleasure up to some baseline, but not infinite weight)
  and asks what meta-ethical commitments about the commensurability of pleasure and
  pain it smuggles in. I propose that this view implicitly relies on what I call ''threshold
  pluralism about affective value'': below the lexical boundary, pleasure and pain
  are incommensurable (no quantity of pleasure can offset severe suffering), while
  above the boundary they become interpersonally comparable on a cardinal scale, allowing
  standard aggregation.


  The essay proceeds in three stages. First, I distinguish lexical-threshold NU from
  both absolute negative utilitarianism and from weighted NU that uses a steep but
  continuous discount factor. I argue that the lexical version requires a genuine
  discontinuity: if the scale were continuous, the boundary would be an arbitrary
  cutoff rather than a normative hinge. Second, I examine whether this discontinuity
  is defensible. One defense is that the boundary marks a shift in the kind of value
  at stake—from basic welfare to preference satisfaction—rather than a quantitative
  jump. I consider whether this defense saves the view from the charge of ad hoc stipulation.
  Third, I apply the framework to the well-known ''small risk of catastrophic suffering''
  problem. If suffering is lexically dominant only when it exceeds the threshold,
  then a policy carrying a tiny probability of catastrophic harm might still be justified
  by near-certain moderate benefits, provided the catastrophic harm is not guaranteed
  to cross the boundary for every affected individual. But if the threshold is set
  low enough to catch catastrophic suffering reliably, the view collapses toward absolute
  NU; if set high, it loses its distinctive protection against severe harm.


  Please comment specifically on: (1) whether threshold pluralism is internally coherent,
  or whether it collapses into either full incommensurability or full cardinal commensurability;
  (2) whether the distinction between basic welfare and preference satisfaction can
