  At a recent workshop, two researchers, Maya and Elias, argued about exactly this.
  Maya opened by defending symbolic traction: she claimed that when a simmball reaches
  a high-activation state, the substrate''s flow patterns reorganize in ways that
  cannot be derived from substrate-level mechanics alone. She pointed to what she
  termed the rebound effect—after a simmball dissolves, the substrate relaxes along
  trajectories that seem calibrated to the symbol''s prior presence—suggesting that
  the symbol left a genuine causal imprint.


  Elias replied that this misinterprets correlation for causation. He argued that
  the substrate is causally closed at its own level, and that simmballs are analogous
  to macroscopic descriptions like center-of-mass coordinates: they compress substrate
  information and make prediction easier, but they do not cause substrate particles
  or states to behave differently. The rebound effect, he said, is just the substrate
  returning to its own equilibrium, with the dissolved simmball serving as a convenient
  label for the prior configuration, not as a driver of relaxation.


  Maya then offered an intervention argument. She noted that if an external mechanism
  manually injects a simmball into a substrate region that would not naturally generate
  one, the local substrate reorganizes around the injected symbol in ways that mirror
  native symbolic traction. If the symbol were purely descriptive, she argued, such
  an artificial insertion should have no distinctive substrate consequence beyond
  the physical mechanism of insertion itself.


  Elias countered that manual injection is precisely an external physical perturbation.
  The substrate changes because of the physical process that delivers the symbol,
  not because the symbol''s semantic or structural content exerts downward force.
  He added that in native dynamics, what looks like the substrate "respecting" a symbol
  is actually just the substrate settling into a local minimum that happens to correspond
  to that symbol; the symbol tracks the minimum, not the other way around.


  Maya''s final move was to insist that in sustained careenium dynamics, simmballs
