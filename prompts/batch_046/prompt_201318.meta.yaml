  biological platform—replicates and adapts in ways that systematically outpace and
  sometimes contradict the intentions of its original designers, does it occupy a
  genuinely distinct ontological and normative category, or can its behavior be fully
  explained by existing frameworks in the philosophy of technology and evolutionary
  theory?


  Existing answers leave this open because the philosophy of technology tends to treat
  artifacts as intentional extensions of human agency, while evolutionary accounts
  treat replication as a biological phenomenon governed by genetic inheritance. Neither
  framework adequately addresses technological lineages that evolve through compatibility
  selection with other artifacts rather than through either deliberate human choice
  or genetic mutation. Von Neumann''s intuition, reconstructed from his essays on
  automata and technological growth, suggests a middle space: technologies that persist
  and mutate not because they serve us, but because they have become ecologically
  embedded.


  My proposed method is conceptual rather than empirical. Over the first three months,
  I would reconstruct the logic of von Neumann''s position from his published and
  widely circulated writings on self-reproducing machines, deliberately avoiding dependence
  on specific archival citations that I cannot verify without direct access. I would
  then apply the reconstructed framework to two contemporary cases—open-source software
  ecosystems that evolve through decentralized contribution, and synthetic biological
