  case: whether an artificial system trained solely on text corpora—producing syntactically
  coherent discourse without direct perceptual-causal interaction with the world—could
  be charitably interpreted as holding beliefs. I also asked them to address whether
  Davidson''s view permits genuinely incommensurable conceptual schemes.


