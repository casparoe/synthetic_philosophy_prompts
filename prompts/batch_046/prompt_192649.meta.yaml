  Assume the role of a professional metaphysician working on the ontology of time.
  Before you construct your answer, take a few minutes to brainstorm the core conceptual
  tensions between presentism, eternalism, and intermediate dynamic views—paying special
  attention to how each handles temporal passage, the asymmetry of causation, and
