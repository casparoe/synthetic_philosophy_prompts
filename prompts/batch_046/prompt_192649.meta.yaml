  Your task is to write the full list of desiderata that an adequate theory of temporal
  ontology must meet if it is to resolve the presentism versus eternalism debate without
  merely relocating the problems. For each desideratum, specify: (a) the phenomenon,
  case, or distinction it must get right; (b) the reason it is non-negotiable versus
  merely a camp preference; and (c) which well-known theories it tends to exclude.


  In particular, include these specific constraints:

  1. The theory must explain the truth conditions of past-tense statements without
  either (i) committing the presentist to the existence of past entities as relata
  or (ii) reducing truth to a purely representational feature of present mental states.

  2. The theory must preserve a metaphysically substantive distinction between the
  present and both the past and the future—yet it must do so in a way compatible with
  the denial of absolute simultaneity in special relativity, which rules out any global
  hyperplane of simultaneity.

  3. The theory must account for cross-temporal relations—such as causation and the
  ''earlier-than'' relation—without generating a grounding circularity: if present
  entities depend on past ones for their properties, but past entities do not exist
  on a presentist ontology, the dependency relation itself needs an ontological foundation
  that does not reintroduce eternalism by the back door.

  4. The theory must distinguish between ontological absence (what does not exist
  at all) and mere non-actuality (what exists but is not present), and it must show
  why this distinction does not collapse into a modal distinction that renders presentism
  indistinguishable from an eternalist view with a privileged actual world.


  Then, identify whether any subset of these four desiderata is jointly unsatisfiable
