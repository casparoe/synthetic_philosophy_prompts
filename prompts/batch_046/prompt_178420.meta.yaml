  prior aggregation of preferences about the boundary. This creates either circularity
  or an infinite regress. Sam also noted that in Sen''s formal statement, the liberal
  condition applies pairwise across the full domain of alternatives; partitioning
  the domain beforehand violates the condition''s structural logic. Sam concluded
  that Rowan''s model saves efficiency only by redefining liberal rights out of existence.


