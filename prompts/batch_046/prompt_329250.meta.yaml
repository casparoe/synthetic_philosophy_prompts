  On this view, music does objectify the Will directly, but not in the raw acoustic
  material alone; rather, the directness occurs through the listener''s embodied,
  non-conceptual anticipation of harmonic resolution and rhythmic tension. The Will
  is expressed in the gap between pattern and bodily drive, not in a purely subjective
  emotional overlay and not in unmediated sound. Assess whether structured immediacy
  genuinely preserves Schopenhauer''s claim that music is metaphysically unique, or
  whether it collapses music back into mediated representation.


