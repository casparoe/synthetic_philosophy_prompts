  word: music expresses the Will without mediation, and its emotional power derives
  precisely from this unmediated contact with the essence of being. The mediationist
  reading argues that this directness is illusory, because musical understanding requires
  temporal form, harmonic expectation, and culturally shaped emotional cognition—structures
  that mediate between sound and the listener''s awareness of the Will, placing music
  closer to representational art than Schopenhauer allows.


