reasoning_summary: 'The user wants a prompt for a dataset. Let''s pick a domain and
  a type.


  Domains available:

  - Zeno''s paradoxes

  - Inheritance taxes, dynastic wealth, and equal opportunity

  - Rural vs. urban and working-class vs. professional-class values: is either outlook
  more defensible?

  - Whitehead''s views on education

  - Dewey''s experimentalism about democracy and inquiry


  Type: Present someone''s summary of a view or result and ask whether it is fair


  Let''s pick Dewey''s experimentalism about democracy and inquiry, and present a
  summary that has subtle misrepresentations.


  We need to write a summary (attributed to unnamed source) that is mostly right but
  with subtle errors: conflation, overstatement, technical term in everyday sense,
  standard objection presented as refutation, etc. Then ask for an accuracy audit.


  Let''s recall Dewey''s experimentalism: he sees inquiry (scientific and democratic)
  as a continuous process of problem-solving, testing hypotheses through action and
  experience. Democracy is not just a form of government but a mode of associated
  living, a social and moral ideal. Inquiry and democracy are linked: democratic life
  requires experimental intelligence applied to social problems, and inquiry requires
  democratic conditions (free communication, shared interests). He distinguishes democracy
  as a political form from democracy as a way of life.


  Potential subtle misrepresentations:

  - Conflating Dewey''s view that democracy is "a form of government where the majority
  rules through voting" with his broader social/moral view. Or saying he thinks democracy
  is just applying the scientific method to politics.

  - Overstating that Dewey believes all social conflicts can be resolved by empirical
  inquiry, ignoring values/ends.

  - Presenting his anti-foundationalism as "there is no truth, only what works for
  now" in a vulgar pragmatist sense.

  - Confusing "experimentalism" with "trial and error without theory."


  Let''s craft a summary in the voice of a confident popularizer or textbook gloss.


  Summary idea:

  "A philosophy professor summarized Dewey''s experimentalism like this: Dewey thought
  democracy is essentially the scientific method applied to politics—citizens form
  hypotheses about policy, test them by voting, and keep what works. He believed inquiry
  is value-neutral: you observe a social problem, gather data, and the correct policy
  emerges automatically from the evidence. Because of this, Dewey rejected any role
  for moral ideals or permanent principles in democratic life; he said democracy is
  just whatever procedures produce the best results, and since science never reaches
  final truth, democratic decisions are always temporary guesses with no claim to
  be right or wrong. This is why Dewey is read as a proto-technocrat who thought experts
  should run government like a laboratory."


  This has several issues:

  1. Conflates democracy as way of life with democracy as scientific method applied
  mechanically.

  2. Overstates value-neutrality: Dewey saw inquiry as value-laden, involving ends-in-view.

  3. Says he rejected moral ideals/permanent principles: he actually saw democracy
  as a moral ideal.

  4. Presents "democracy is just whatever procedures produce best results" — this
  is somewhat close but misses the moral/social dimension.

  5. "Experts should run government like a laboratory" — misrepresents; he emphasized
  participation and shared intelligence, not technocracy.


  Then ask: Is this fair? Separate accurate, common simplification, what Dewey denied,
  whether the conclusion (proto-technocrat) follows.


  Let''s write it concisely but with enough detail.


  Prompt structure:

  - State you encountered a summary.

  - Give the summary attributed to "a popular philosophy podcast" or "a textbook chapter"
  — unnamed.

  - Ask whether it''s fair, go part by part, separate accurate/simplification/explicit
  denial, and whether the later claim (proto-technocrat/expert rule) follows.


  We need to keep it relatively short and focused. Let''s write.


  Check hard rules: No verbatim quotes from real texts without fetching. We won''t
  use quotation marks around real passages. We might mention titles? Better not to
  depend on specific titles/dates unless verified. We don''t need them.


  Let''s write the prompt.'
