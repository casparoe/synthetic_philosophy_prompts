  Having spent three decades in experimental condensed-matter physics, I have recently
  turned to philosophy of science, and I am preparing a proposal for a six-month independent
  research fellowship. The question I want to pursue arises from a tension I encountered
  repeatedly in the laboratory but never resolved: Good''s theorem establishes that,
  for an agent with a well-defined decision problem and cost-free access to information,
  acquiring that information is always rational, because the expected utility of acting
  after updating beliefs is never lower than acting now. Translated into scientific
  practice, this seems to entail that an investigator should never refuse an additional
  measurement if it can be obtained without direct expense. Yet working scientists
  constantly design protocols that limit sampling, halt experiments before all observable
  variables are recorded, and treat certain data streams as noise to be ignored rather
  than information to be incorporated. The standard responses treat these refusals
  as hidden-cost problems—time, equipment wear, or opportunity cost—or as pragmatic
  failures of ideal rationality. I want to ask whether there is a philosophically
  coherent account of rational refusal of information that does not reduce to hidden
  costs, and whether such an account requires modifying the decision-theoretic framework
  itself.


  More precisely: in open-ended scientific inquiry, the space of possible actions
  and the space of relevant hypotheses are not fixed in advance, as Good''s formalism
  requires. If an experimenter does not yet know what theoretical framework will organize
  the results, can it still be rational to decline a measurement that might destabilize
  an emerging model without offering a determinate alternative? I propose to examine
  whether the failure of Good''s conditions—specifically, the absence of a closed
  action space and the presence of what I will call "epistemic fragility"—constitutes
  a benign boundary condition or reveals a substantive limit to applying decision-theoretic
  epistemology to science. The method will be conceptual modeling rather than empirical
  survey: I will construct a formal representation of exploratory inquiry in which
  hypotheses are generated dynamically, apply Good''s reasoning to show exactly where
  it breaks down, and then evaluate three possible resolutions—expanding the utility
  function to include model-stability values, reconceiving information as context-relative
  rather than absolute, or accepting that rational refusal is only apparent and always
  masks a hidden cost. I will test these against two concrete cases: the use of stopping
  rules in adaptive clinical trials, where refusal is institutionalized, and the decision
  to terminate a long-baseline physics measurement when preliminary patterns suggest
  instrumental drift.


  The deliverable will be a framework that distinguishes rational refusal (grounded
  in the structure of inquiry) from practical refusal (grounded in resource limits),
  together with an honest assessment of whether decision theory can absorb the distinction
  or must be supplemented. The project could fail if the distinction collapses—if
  every apparent case of rational refusal can be reconstructed as a hidden-cost problem—or
  if the formal modeling requires specifying an action space that exploratory science
  genuinely lacks, making the exercise circular. Given a six-month timeline and my
  background in experimental design rather than formal logic, I will restrict the
  analysis to qualitative structural arguments supported by minimal formal notation,
  and I will not attempt a full axiomatization. I ask for funding not to resolve a
  settled debate but to determine whether a retired practitioner’s intuition—that
  scientists sometimes protect understanding rather than maximize expected utility—can
  be made philosophically precise.


