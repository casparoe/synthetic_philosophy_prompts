  Jekyll describes himself as possessing both virtuous and vicious tendencies, and
  the chemical transformation seems either to release a hidden disposition (Hyde)
  or to remove the conditions that mask Jekyll''s underlying viciousness — or, conversely,
  to mask his virtue. I should like you to examine the key scenes — the first transformation,
  the door in the rear of the house, the growing involuntariness of the change, and
  the final revelation in the cabinet — and ask: does Stevenson present Jekyll''s
  goodness as a disposition that is finked by the potion, masked by social conditioning,
  or genuinely destroyed? Does Hyde represent the manifestation of a pre-existing
  disposition, or is he a new dispositional profile altogether?


