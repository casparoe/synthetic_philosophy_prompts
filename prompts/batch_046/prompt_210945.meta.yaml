  "I cover conceptual research and philosophy of science for a general-interest magazine,
  and I am currently drafting a feature on how philosophers adjudicate the reliability
  of intuition pumps—those compressed scenarios designed to elicit immediate judgments
  about identity, consciousness, or value. In the course of my reporting I have been
  tracking the published verdicts of Professor Renata Cole, who directs a small working
  group on conceptual stability at an independent research institute. Over the past
  eighteen months she has evaluated eight well-known pumps. Her rulings, in order
  of publication, are as follows: she treats the Ship of Theseus as legitimate, arguing
  that it isolates a genuine ambiguity in persistence conditions without importing
  confounding variables; she judges Searle''s Chinese Room to be misleading, on the
  grounds that the ''person-in-the-room'' framing bundles syntax with an unstated
  anthropomorphic intuition that collapses once distributed processing is made explicit;
  she accepts the standard switch-version of the Trolley Problem as legitimate but
  rejects the footbridge variant as misleading, because the latter ties moral wrongness
  to physical proximity rather than to the structural feature of agency; she regards
  Jackson''s Mary as legitimate; she accepts Nozick''s Experience Machine as legitimate;
  she dismisses the Utility Monster as misleading, since it bundles utility aggregation
  with an unrealistic scaling assumption; and she accepts Rawls''s Veil of Ignorance
  as a legitimate procedural pump, provided it is presented without biographical framing.


  These verdicts are jointly consistent with at least two plausible implicit theories.
  One is a ''Conceptual Boundary Preservation'' view: a pump is legitimate exactly
  when it isolates the target conceptual boundary and does not smuggle in an irrelevant
  structural feature (proximity, infinite scale, hidden syntax). The other is a ''Narrative
  Transmission Stability'' view: a pump is legitimate when its core intuition survives
  re-description, paraphrase, or cross-contextual transmission; if the judgment depends
  on a fragile framing that dissolves under translation, the pump is artifactual.


  Next week Cole is scheduled to evaluate a new proposal I have been asked to report
  on: the Cascading Framing Pump, devised by a cognitive ethnographer who wants to
  test whether moral intuitions are stable across testimony chains. In this scenario,
  a baseline moral case—saving five strangers at the cost of one—is presented to Observer
