  than becoming a technical AI paper, but I also want to avoid saying something that
  any philosopher of science has said a hundred times.


  The core idea is this. In economics, Friedman argued that the realism of a model''s
  premises is irrelevant compared to the accuracy of its predictions. Critics often
  reply that predictive success is not enough if the model misrepresents causal mechanisms.
  Now consider how large language models are evaluated: we test them on decontextualized
  logic puzzles, synthetic mathematics, and contrived reasoning tasks that bear little
  resemblance to real-world language use. Defenders of these benchmarks implicitly
  invoke an F-twist: the tests are unrealistic, but if high scores predict useful
  downstream behavior, the unrealism is harmless.


  My essay argues that this analogy mostly fails, but for a reason that is rarely
  noticed. In Friedman''s original case, the predictions are independent empirical
  observations — market prices, employment levels — against which the model is checked.
  In AI evaluation, however, the benchmark score is not an independent prediction
  about the world; it is an internal metric that is often constructed to align with
  the very capabilities it claims to measure. This creates a circularity that Friedman''s
  framework does not accommodate. Moreover, Friedman coupled his F-twist with a form
  of instrumentalism about scientific theories. If one rejects instrumentalism for
  AI — for instance, if one thinks we should care about whether the model''s internal
  representations correspond to genuine reasoning processes — then the defense of
  unrealistic benchmarks collapses, not because the benchmarks fail to predict, but
  because prediction is no longer the only thing that matters.


