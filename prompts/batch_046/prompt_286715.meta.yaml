  ---


  My philosophy-of-science colloquium director, Dr. Mira Solari, has issued the following
  rulings on puzzles involving observer selection and anthropic reasoning, presented
  without further commentary:


  1. Carter''s doomsday argument, applied to the total number of humans who will ever
  live: she rejects the inference from one''s birth rank to an imminent extinction,
  on the grounds that we possess no statistical sampling frame that would justify
  treating our temporal position as randomly drawn.


  2. Bostrom''s "presumptuous philosopher" scenario, in which a philosopher argues
  that extreme cosmological fine-tuning licenses belief in a vast multiverse because
  otherwise our existence would be astronomically improbable: she dismisses the argument,
  holding that reasoning from one''s own existence to the scale of global ontology
  is circular unless independently empirically anchored.


  3. The Sleeping Beauty problem (the standard coin-toss with one or two awakenings):
  she rules that Beauty''s credence in Heads should remain one-half upon awakening;
  she treats the number of awakenings as epistemically irrelevant to the coin''s bias.


  4. The "God''s coin" multiverse case, in which a fair coin determines whether ten
  identical universes or one are created, each containing exactly one observer with
  the same experiences: she maintains fifty-fifty credence for the coin, refusing
  to update toward the ten-universe hypothesis on the basis of her own existence.


  5. The empirical anthropic prediction of a cosmological constant''s value (within
  a range permitting observers), advanced by physicists who treat the observer-selection
  effect as a statistical filter rather than an ontological argument: she accepts
  the prediction as methodologically legitimate, distinguishing it sharply from the
  multiverse inference in case 2.


  Next week''s discussion concerns the Archive Case, which I have devised: there are
  ninety-nine sealed vaults, each containing a single conscious observer who lives
  for exactly one subjective day with no access to calendars, vault labels, or external
  duration-cues; and there is one further vault containing a single observer who lives
  for exactly one thousand subjective days with phenomenologically identical experiences.
  An observer wakes with no prior information and asks whether she should assign higher
  credence to being in the long-duration vault, or whether any such assignment is
  illegitimate.


  Predict Dr. Solari''s verdict on the Archive Case, identify the candidate anthropic
  frameworks that could jointly accommodate her first five rulings -- for instance,
  a strict self-sampling assumption with a fixed reference class, a self-indication
  assumption applied selectively, a prohibition on presumptuous reasoning that allows
  empirical filtering, or a hybrid reference-class restriction -- state which framework
  best explains her pattern, say what each predicts about the Archive Case, give your
  best guess with reasons, and specify one further case that would distinguish the
  remaining competitors.


