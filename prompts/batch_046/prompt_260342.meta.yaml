  "similar to taste of lime"), 5 Phenomenal (e.g., "the intrinsic what-it''s-likeness
  of lemon", "the non-spatial qualitative character", "the immediately given subjective
  feel").

  - A "Privacy Shield" token: Once assigned to a Phenomenal card, it blocks that card
  from being used in any causal explanation or cross-subject verification.

  - Budget sheet: Each group gets 10 "Ontological Commitment Points". Functional cards
  cost 1, Phenomenal cards cost 4 (because they require special ontology).


  Rules:

  1. Round 1 (15 min): Accountants build their ledger. They must account for three
  observed phenomena: (a) subject reports "lemon", (b) subject avoids eating more,
  (c) subject distinguishes it from lime. They place cards under "Explanatory" or
  "Addendum". If they put a Phenomenal card in "Explanatory", they must show it connects
