  precisely to these two portraits — that they generate moral monotony, eliminate
  the conditions for moral growth, or make genuine partiality and friendship impossible.
  Consider whether a life without moral failure is also a life without moral surprise,
  and whether that absence is a virtue or a deficiency.


  Reach a definite conclusion: is maximal moral goodness desirable without qualification,
  undesirable, or desirable only in a restricted form? Justify your verdict with reasons
