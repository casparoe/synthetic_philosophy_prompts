  to work through Peter Weir''s film The Truman Show (1998) alongside Douglas Hofstadter''s
  tripartite account of messages in Gödel, Escher, Bach—specifically the distinction
  among frame messages, outer messages, and inner messages. In the film, the artificial
  town of Seahaven operates as a frame message (the televisual apparatus and its conventions
  of reality television), the sitcom narrative of Truman Burbank''s cheerful life
  functions as the outer message, and the gradual intrusion of anomalies—falling lights,
  repeated patterns, the unexpected appearance of his dead father—constitutes an inner
  message that the frame is artificial. I want a reading that treats both the film
  and Hofstadter''s schema seriously, rather than reducing one to an illustration
  of the other.


  Here''s the conceptual knot I want to press: Hofstadter seems to assume that once
  the frame is recognized, the inner message can be extracted without destroying the
  outer message—think of recognizing that a record contains a hidden message encoded
  in its grooves, where the music remains intact. But in The Truman Show, Truman''s
  recognition of the frame doesn''t merely decode an inner message; it collapses the
  outer message entirely—his marriage, friendships, and entire social world are revealed
  as performances, so the "sitcom" cannot survive its own framing being exposed. Does
  this mean the film reveals a destructive or parasitic relation between frame-recognition
  and outer-message stability that Hofstadter''s model overlooks? Or can Hofstadter''s
