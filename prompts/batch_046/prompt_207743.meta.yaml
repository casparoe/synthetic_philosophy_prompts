  I hold the following position: large-scale habitat destruction is not unambiguously
  bad from a welfare perspective, and in many cases it may reduce net wild animal
  suffering. The reasoning is that ecosystems with high biomass and high reproductive
  rates—particularly r-selected populations—generate enormous quantities of suffering
  through juvenile mortality, predation, starvation, and parasitism, with only a small
  fraction of individuals experiencing net-positive lives. Consequently, conservation
  practices that preserve or restore high-biomass habitats may function as ''suffering
  engines,'' maintaining the structural conditions that continuously regenerate negative
  welfare. By contrast, habitat collapse that permanently reduces carrying capacity
  might lower the total number of suffering individuals, even if it eliminates biodiversity
  and ecological function.


  What would genuinely count against this view? I am not looking for the standard
  replies—e.g., that biodiversity has intrinsic value, or that humans shouldn''t cause
  harm regardless of net welfare. Instead, I want the defeaters that strike at the
  conceptual and empirical core:


  1. Which specific results in population ecology or welfare biology, if established,
  would undermine the claim that high-biomass ecosystems are net-negative?

  2. Which normative assumptions—about interspecies welfare comparison, the moral
  weight of potential versus actual suffering, or the value of ecological processes—does
