  At a recent meetup of an online rationalist reading group, two regulars—I''ll call
  them Maya and Leo—got into a sustained disagreement about how to practice epistemic
  modesty when your own reasoning feels unusually clear. The exchange started after
  Maya mentioned she had become convinced of a somewhat unpopular view in philosophy
  of mind—specifically, that a functionalist account of consciousness fails for reasons
  related to the explanatory gap—but said she was holding her confidence at only 55
  percent because she knew philosophers disagree and she was probably missing something.


  Leo pushed back. He said her discount was too mechanical. The outside view tells
  us that smart people disagree, he granted, but applying that base rate requires
  you to first classify yourself into a reference class—say, "philosophers with graduate
  training" versus "generalists with an opinion"—and that classification is itself
  an inside-view judgment. If you try to correct every inside-view belief with an
  outside view, you run into what he called a reference-class recursion: the correction
  mechanism depends on the very reasoning you''re trying to correct. So pure outside-view
  deference isn''t coherent; you have to let some inside-view reasoning stand, at
  least long enough to decide which base rate applies.


  Maya replied that Leo was overstating the recursion. You can break it, she said,
  by anchoring to the broadest available reference class—"humans trying to solve hard
  philosophical problems"—and refusing to update upward unless you have genuinely
  exceptional external validation, not just the feeling that your arguments hang together.
  The fact that you need an inside-view step to pick the class doesn''t license trusting
  your specific conclusion; it just means modesty operates one level up, at the meta-level
  of choosing your prior.


  Leo countered that this "anchor broad and stay low" rule sounds principled but collapses
  in practice. Everyone who holds an unpopular view can claim they''re applying the
  broad base rate, yet they all secretly use inside-view cues—clarity, coherence,
  the sense that objections have answers—to decide when they''re the exception. If
  you genuinely never updated upward based on your own reasoning, you''d have to treat
  your belief in the broad base rate itself with the same skepticism, since that''s
  also a philosophical claim formed through reasoning. Maya''s position, he said,
  smuggles in inside-view confidence under the guise of methodological humility.


  Maya then offered a distinction: there''s a difference between using inside-view
  reasoning to form a first-order belief and using it to calibrate your confidence
  in that belief. The outside view should suppress the second, not the first. You
  can think you''ve found a good argument without claiming you''re likely right about
  the conclusion, given human fallibility.


