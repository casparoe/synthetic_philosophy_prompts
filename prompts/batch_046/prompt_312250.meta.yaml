  be in place before the combination problem registers as a genuine conceptual crisis
  rather than a whimsical ''rocks are conscious'' claim: articulate the difference
  between constitutive and emergentist panpsychism, and show why only the former makes
  macro-experience depend on the literal aggregation of micro-experiential subjects.


