  In a philosophy seminar last week, two participants got into a sustained disagreement
  about how far Bernard Williams''s integrity objection extends. The case they used
  was this: a biographer has spent fifteen years constructing a sympathetic portrait
  of a largely forgotten local activist, only to uncover archival material that strongly
  suggests the activist was complicit in a serious harm. Publishing the truth would
  destroy the narrative she has built and, she feels, betray the subject to whom she
  has become personally committed; suppressing it violates scholarly norms. One student,
  Mara, argued that if the biographer even frames her choice as weighing "my commitment
  to this person" against "my duty as a historian," she has already committed the
  error Williams identifies — she has introduced one thought too many. On Mara''s
  reading, ground projects are not items to be balanced; they are constitutive of
  practical identity, and to subject them to deliberative comparison — whether utilitarian
  or deontological — is to treat them as fungible goods rather than as the framework
  within which goods have meaning.


  The other student, Jonah, replied that Mara is overextending the objection. He granted
  that Williams criticizes the demand that moral agents always adopt an impersonal
  point of view, especially in cases where saving a stranger is weighed against saving
  one''s spouse. But Jonah insisted that Williams does not prohibit all reflective
  comparison among one''s own commitments. The biographer''s problem is not that she
  compares loyalty to truthfulness; it is that she might be pressured to adopt an
  external, impersonal metric — say, maximizing social utility or satisfying an abstract
  institutional code — that has no connection to who she is. Jonah added that Mara''s
  interpretation risks turning integrity into a kind of dogmatic fanaticism: if ground
  projects can never enter deliberative conflict with one another, then anyone who
  abandons a long project for a genuinely better one, or who resolves a conflict between
  two deep commitments, necessarily lacks integrity, which seems implausible.


  Mara then pushed back with a more radical claim: that Williams''s view requires
  not merely resisting impersonal metrics, but recognizing certain commitments as
  non-fungible even with other ground projects. She suggested that for the biographer,
  the commitment to the activist is not just one project among others, but part of
  the narrative structure that gives her other values their point; therefore, asking
  whether scholarly honesty "outweighs" this commitment already dissolves the very
  self that could make the choice meaningful. Jonah responded that this collapses
  integrity into an inability to change one''s mind, and that Williams''s actual concern
