  hidden, not excessive, and functions as a legitimate ritual of recognition within
  a relational political order. Maya countered that explaining why the practice persists
  is not justifying it—functional stability does not erase the structural fact that
  access to public goods is being mediated by personal gift relations rather than
  by uniform rules. Jonas then argued that Maya''s appeal to "uniform rules" already
  assumes a particular boundary between public and private that is not universal:
  if the local social contract genuinely incorporates these reciprocal obligations,
  then there is no hidden privatization, only a different architecture of accountability.
  Maya asked whether, on Jonas''s view, local activists who condemn the practice as
  corruption are simply mistaken about their own society, and whether "corruption"
  then collapses into "whatever violates local norms"—making cross-cultural critique
  impossible. Jonas said he was defending pluralism, not relativism: corruption is
  real, but its criteria depend on locally legitimate expectations of office, not
  on a single global standard imported from Weberian administration.


