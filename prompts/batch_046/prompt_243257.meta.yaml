  Notes for an essay: Do dreams contain experiences, or only retrospective narratives?


  I am working on an essay for my philosophy seminar that examines whether dreams
  are experiences in the same sense as waking perceptual states. The standard debate
  is usually framed between Norman Malcolm, who argues that the concept of a dream-experience
  is logically incoherent because any report of a dream is necessarily made in a waking
  state and therefore cannot be a direct report of a concurrent mental state, and
  Daniel Dennett, who rejects the "Cartesian theater" model and holds that the dream
  narrative is constructed at the moment of awakening rather than replayed from a
  stored experiential record.


  I want to propose a middle position that I am calling "retroactive phenomenal binding."
  On this view, REM sleep produces low-level, fragmentary cortical activations—what
  we might call proto-experiential fragments—that lack the unified phenomenal structure
  characteristic of waking consciousness. These fragments are not yet experiences
  in the full sense. However, upon awakening, memory-consolidation mechanisms do not
  merely invent a narrative ex nihilo; rather, they bind these fragments into a coherent
  phenomenal field, producing the retrospective impression that one was undergoing
  a unified experience all along. Thus, Malcolm is correct that there is no fully
  structured concurrent experience during sleep, but Dennett is also correct that
  the waking narrative is a construction—except that this construction is constrained
  by genuinely present (though unbound) phenomenal material, rather than being a pure
  confabulation.


  My questions for feedback are these:


  1. Is my characterization of Malcolm''s logical objection—that dream reports are
  always retrospective and therefore cannot report concurrent experiences—accurate
  and fair?

  2. Does the "retroactive phenomenal binding" view genuinely split the difference,
  or does it collapse into Dennett''s narrative-construction view once we admit that
  the fragments are not themselves experiences?

  3. Is the distinction between "proto-experiential fragments" and "fully structured
  dream experiences" defensible, or does it rely on an ad hoc division that merely
  saves the appearance of a middle ground?

  4. Is the argument interesting, and have I missed an obvious objection—such as the
  possibility that even the fragments are themselves post-hoc reconstructions?


