  Notes for an essay: Are dreams experiences, or only retrospective narratives?


  I am drafting an essay for my philosophy seminar on whether dreams count as experiences
  in the same sense as waking perceptual states. The debate I want to address is usually
  framed between Norman Malcolm, who argues that the idea of a concurrent dream-experience
  is logically incoherent because any report of a dream is necessarily produced in
  a waking state and therefore cannot be a direct report of a mental state occurring
  during sleep, and Daniel Dennett, who rejects the Cartesian theater model and holds
  that the dream narrative is constructed at the moment of awakening rather than replayed
  from a stored experiential record.


  Rather than taking either side fully, I want to propose a middle position that I
  call retroactive phenomenal binding. On this view, REM sleep generates low-level,
  fragmentary cortical activations—proto-experiential fragments—that lack the unified
  phenomenal structure characteristic of waking consciousness. These fragments are
  not yet full experiences. However, upon awakening, memory-consolidation mechanisms
  do not invent a narrative entirely from nothing; instead, they bind these fragments
  into a coherent phenomenal field, creating the retrospective impression that one
  was undergoing a unified experience all along. So Malcolm is correct that there
  is no fully structured concurrent experience during sleep, but Dennett is also correct
  that the waking narrative is a construction—except that this construction is constrained
  by genuinely present, though unbound, phenomenal material, rather than being pure
  confabulation.


