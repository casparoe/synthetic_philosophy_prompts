  doubts arise. These hinges are not subject to empirical testing; they are the framework
  within which testing occurs.


  There are two dominant interpretations. The precondition interpretation holds that
  hinges are not beliefs at all, but rather conditions of intelligibility or grammatical
  rules that make belief-formation possible within a language-game. The contextual-immunity
  interpretation holds that hinges are genuine beliefs, but ones that enjoy absolute
  certainty within a particular form of life and are therefore not currently open
  to doubt.


