  Wittgenstein''s discussion of hinges in On Certainty addresses the problem of how
  justification can terminate without falling into Cartesian foundationalism. Unlike
  Descartes, who sought propositions that are intrinsically indubitable, Wittgenstein
  observes that in ordinary life we hold certain propositions—such as that the earth
