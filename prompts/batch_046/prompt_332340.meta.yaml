  a position I have formed about the debate over why some nations are wealthy and
  others are not, specifically the long-running dispute among institutions, geography,
  and culture as primary causal drivers.


  Here is my view, stated as sharply as I can. I hold that the entire debate is epistemically
  misframed, not merely empirically inconclusive. At the macro-historical scale, the
  potential-outcomes framework that justifies causal claims in experimental science
  breaks down because the consistency conditions required for counterfactual stability
  fail: an ''institutional reform'' applied to a different nation in a different geographic
  and cultural context does not correspond to the same intervention, and the sample
  of nations is neither randomly assigned nor exchangeable. Consequently, any claim
  that institutions dominate geography or culture—or vice versa—rests on implicit
  counterfactuals that are conceptually incoherent at this scale. The disagreement
  is therefore not a resolvable empirical dispute but a category error that treats
  singular, path-dependent historical trajectories as if they were replicable experimental
  units. I further claim that this is not merely a practical limitation—more data
  or better instruments will not fix it—but a structural feature of macro-historical
  explanation.


  What I want from you is a rigorous map of what would actually count against this
  position—not rhetorical objections, but the evidence, arguments, formal results,
  or conceptual distinctions that should move me. Please organize your response as
  follows.


  First, begin with a brief brainstorming session in which you list the distinct kinds
  of defeaters this view faces: empirical, formal, conceptual, and methodological.


