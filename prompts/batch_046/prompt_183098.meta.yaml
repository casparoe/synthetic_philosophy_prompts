  I''m currently taking a course on logical empiricism and the philosophy of language,
  and I''m trying to consolidate my own position on the analytic-synthetic distinction
  after working through Quine''s Two Dogmas of Empiricism and some recent commentary.
  Before I present these views in a seminar, I want to check whether they actually
  hang together.


  Here are the commitments I have arrived at:


  (1) Quine''s central critique succeeds: there is no principled, non-circular distinction
  between truths that hold in virtue of meaning alone and truths that hold in virtue
  of fact. Attempts to ground the distinction in synonymy, convention, or reduction
  to experience all fail.


  (2) I accept a broadly Quinean semantic holism: empirical significance attaches
  to the web of belief as a whole, and in principle any statement can be retained
  in the face of recalcitrant experience by adjusting other parts of the web.


  (3) At the same time, I want to defend what I call functional encapsulation. Domains
  such as basic arithmetic, elementary logic, and parts of physical geometry are not
  insulated from revision because they are analytic. Rather, they are structurally
  embedded in so many inference patterns that revising them would require a global
  restructuring that is practically impossible for finite agents. The insulation is
  a matter of cognitive architecture and revision cost, not of semantic status.


  (4) I reject conventionalism about logic: logical truths are not true by linguistic
  decision or free stipulation. Instead, I endorse a form of logical inferentialism
  according to which the meanings of logical constants are fixed entirely by their
  roles in valid inference. But I take these inferential roles to be discovered features
  of rational practice, not conventions we could freely alter.


  (5) I think Quine''s own argument implicitly relies on being able to separate the
  logical framework of a theory from its empirical content when he discusses how we
  might revise a theory by holding its logic constant and adjusting only factual claims.
  If holism is correct, this separation is pragmatic rather than principled. So Quine
  risks circularity: he uses a boundary that his own holism undermines in order to
  motivate the dissolution of that very boundary.


  (6) I deny that mathematics is analytic. But I also resist treating mathematics
  as continuous with empirical science in an undifferentiated way. I want to say that
  mathematical truths are structurally synthetic: they belong to the synthetic web,
  yet they are constrained by internal coherence conditions and by functional encapsulation
  that make them far less revisable than ordinary empirical generalizations, without
  being analytically true.


