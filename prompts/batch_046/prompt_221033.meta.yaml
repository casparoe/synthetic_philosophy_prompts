  that you would refuse to pay; if it predicts you will pay, it never initiates the
  threat, leaving you with both your property and your money minus the payment. Both
  cases involve actions that appear rational in the actual world—taking two boxes,
  refusing to pay—yet seem irrational when evaluated against the counterfactual branches
  that determine the payoff.


