  on a specific, non-standard feature of collective cognition: the colony’s working
  memory is not stored in any individual ant, but is physically inscribed in the curvature
  and density of pheromone trails that decay exponentially. Retrieving a past collective
  decision requires that a critical mass of ants simultaneously occupy nodes arranged
  in a specific geometric pattern—something no single ant can initiate, represent,
  or verify. The philosophical tension should emerge when the group realizes that
  successful retrieval depends on a spatial configuration none of its members can
  survey or intend.


  Design a runnable classroom activity—whether a role-play, a floor simulation, or
