  Simulation design: Divide the group into three “parties” of four. Assign each party
  a hidden priority (for example, distributive equality, collective security, or cultural
  continuity) that they must defend through a series of rapid collective decisions
  about a fictional governance crisis. Introduce a hidden scoring mechanism: each
  party has a “whip” who distributes points not for argument quality but for speed
