  Here is an argument I sketched for a workshop on illusionism that now strikes me
  as suspicious because, if sound, it would undermine not just illusionism but any
  first-person-based theory of mind. (1) Illusionism holds that phenomenal consciousness—what-it-is-likeness—is
  never actually instantiated; instead, introspection systematically misrepresents
  physical or functional mental states as having phenomenal properties. (2) If phenomenal
  properties are never instantiated, then every first-person judgment of the form
  "it seems to me that there is something it is like to be in state S" is false, because
  the "seeming" in question is precisely the misrepresented phenomenal property. (3)
  But the illusionist''s own case depends on taking such first-person reports seriously:
  the illusionist explains why people say "there is something it is like," not why
  people say "I have a false belief." (4) So the illusionist must treat at least some
  first-person reports as veridical—specifically, the report that there is an appearance
  of phenomenality—while treating others as false. (5) Yet there is no principled
  distinction within introspection between the appearance of phenomenality and the
  appearance of particular phenomenal qualities (e.g., the reddishness of a sensation),
  since both are delivered by the same introspective mechanism. (6) Therefore the
  illusionist is committed to saying that introspection is globally unreliable about
  phenomenality, which removes the evidential basis for accepting illusionism in the
  first place. (7) Hence illusionism, if true, is self-defeating in the same way global
  skepticism is: it uses the very cognitive faculty it declares untrustworthy. Where
  does this reasoning slip? I would prefer to keep the idea that introspection is
  broadly reliable about mental states, but I want to know what it costs to reject
  (5) versus rejecting (2).


