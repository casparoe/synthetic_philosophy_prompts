  (1) Parental leave should be structured through individual, non-transferable entitlements
  for each parent—what policy analysts sometimes call a use-it-or-lose-it design—because
  transferable leave tends to be absorbed by mothers and reinforces a specialization
  equilibrium in which small initial career interruptions compound into large long-run
  wage and human-capital gaps.


  (2) Justice within the family requires recognizing an asymmetrical biological burden:
  gestation, childbirth recovery, and lactation generate needs that no gender-neutral
  framework can fully equalize, so treating parents identically in every dimension
  is not treating them equally.


  (3) The dual-earner household is both an economic necessity and a moral ideal; I
  reject any cultural or policy structure that pushes families toward a single-earner
  model, and I hold that neither parent should bear the primary career cost of childbearing
  by default.


  (4) I accept what child-development researchers call a critical-window thesis: consistent,
  substantial caregiver presence during roughly the first twelve to eighteen months
  produces durable attachment and cognitive benefits that high-quality substitute
  childcare can mitigate but not fully replicate.


  (5) The liberal state should remain neutral among reasonable conceptions of the
