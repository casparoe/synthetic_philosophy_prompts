  history never runs experiments twice, any claim to have isolated institutional causes
  is epistemically hollow; Leo maintains that comparative methods and long-run persistence
  arguments let us recover stable causal structures despite the absence of true counterfactuals.
  They asked me to referee, and since I genuinely cannot tell where the burden of
  proof should lie, I am asking you to adjudicate.


