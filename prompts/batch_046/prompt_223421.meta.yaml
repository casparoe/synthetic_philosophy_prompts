  Mira opened by attacking the canonical Korea comparison: the 38th parallel was not
  randomly assigned but selected by great-power bargaining, so treating North and
  South as an institutional natural experiment violates the exclusion restriction.
  Leo conceded the selection problem but replied that researchers do not rely on single
  cases; they combine instrumental strategies—such as linking historical settler mortality
  to present-day institutional quality—with process tracing through legal origins,
  thereby identifying persistent mechanisms rather than momentary correlations. Mira
  countered that these instruments capture local average treatment effects embedded
  in specific technological and imperial regimes; the causal pathway from 17th-century
  mortality to modern governance operates through intermediate institutions that may
  not be stable once global markets and state capacities change, so one is explaining
  historical variance, not modern richness. Leo answered that this objection misses
  the point of path dependence: if legal and political institutions are genuinely
  sticky, then identifying their origin is sufficient to explain current outcomes,
