  the duty rather than just its feasibility. For my project, I propose to construct
  two parallel cases—one direct, one institutionally mediated—matched for outcome
  severity and agent cost, then analyze them across three conceptual variables: epistemic
  access, length of causal chain, and emotional salience. Over twelve weeks, I will:
