  a deep structural continuity with Sen''s result: both show that aggregating individual
  inputs into a collective judgment collapses once minimal normative conditions are
  imposed, and I treat them as complementary rather than competing diagnostics. Fourth,
  I hold that liberal societies in practice navigate these conflicts through procedural
  veto mechanisms—constitutional courts, rights-based exemptions—rather than through
  preference aggregation, and I regard this procedural turn as conceptually correct:
  liberal rights function as deontological side-constraints, not as weights in a social
  calculus. Fifth, I think Sen''s framing is unduly narrow in confining liberal rights
