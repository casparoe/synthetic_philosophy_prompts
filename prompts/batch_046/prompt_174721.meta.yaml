  but as evidence that liberal rights cannot be captured within a standard social
  welfare ordering without distortion. Second, I reject responses that resolve the
  paradox by restricting the domain of admissible preferences, on the grounds that
  making the scope of rights depend on the contingent tastes of others undermines
