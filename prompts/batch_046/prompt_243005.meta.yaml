  1. The prevalence audit (how to establish an order-of-magnitude population bound
  and what sources count as adequate for this step alone).

  2. The epistemic density rating (the criteria for direct versus analogical evidence,
  with explicit thresholds for "high," "moderate," and "speculative").

  3. The functional-replication check (how to determine whether observed architectures
  scale with the population or remain isolated observations).

  4. The scale-weighted expectation gate (how to combine prevalence and confidence
  into a decision-relevant magnitude, including what to do when numbers are unavailable
  and judgment must substitute).

  5. The coherence and proportionality filter (whether the proposed intervention scales
  sensibly with the calculated expectation, or creates institutional perversions such
  as diverting resources from well-confirmed suffering).

  6. The judgment stop (the explicit point at which the procedure yields no further
