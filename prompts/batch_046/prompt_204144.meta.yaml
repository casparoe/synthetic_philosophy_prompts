  (1) Retributivism is the correct justification for criminal punishment: punishment
  is legitimate only when it is proportionate to the wrong actually done by the offender,
  and only backward-looking desert can provide that proportion.

  (2) Capital punishment is permissible in principle, since there are crimes for which
  death is not disproportionate.

