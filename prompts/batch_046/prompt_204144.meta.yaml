  cases necessarily operate with a non-zero risk of false conviction—one that is not
  merely empirical but structurally irreducible to zero—the state never possesses
  the categorical epistemic warrant that retributivism demands to justify an irreversible
  execution. On my view, this risk functions not as a utilitarian cost to be weighed,
  but as a moral defeater that blocks the permission granted by (1) and (2).

