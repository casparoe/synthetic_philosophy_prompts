  I am trying to assess a brief summary of Moritz Schlick''s position on the meaning
  of life that a colleague in my department circulated for our informal reading group.
  The summary, which I will set out below, seems to me to capture the broad outline
  of Schlick''s well-known essay but also to push it in directions I am not sure Schlick
  actually endorsed. Here is the summary as it was presented: Schlick holds that asking
  ''what is the meaning of life?'' is fundamentally a linguistic confusion in which
  people mistake a request for transcendent purpose — what he calls Zweck — for a
  request about immanent value or content, which he associates with Sinn. Once the
  illusion of a cosmic purpose is dissolved, usually by recognizing that religious
  narratives project human wishes onto an imaginary order, the only genuine form of
  meaning left is play: activity pursued entirely for its own sake and not as a means
  to any further end. The summary notes that Schlick takes young people as the natural
  exemplars of this condition, since they engage in games and exploration without
  instrumental justification, and it further claims that Schlick regards adulthood
  as a kind of structural fall away from meaning, because adults systematically transform
  their activities into instruments for survival, reputation, or economic gain. From
