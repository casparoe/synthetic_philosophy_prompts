  as a cost that must be outweighed or neutralized, rather than as an integral part
  of the aesthetic payoff itself. In response, I want to defend what I am calling
  a coherence-calibration view: the enjoyment of tragedy derives not from the cancellation
  of sorrow but from experiencing one''s own emotional response as structurally proportionate
  to the narrative arc, yielding a distinct meta-affective reward that I term affective
  coherence. On this account, tragedy functions like a rigorous emotional exercise
  in which the intensity of negative feeling is precisely matched to the formal weight
  of the events depicted, and the pleasure lies in recognizing that one''s capacity
  for grief has been engaged with appropriate precision rather than being either numbed
  or overwhelmed.


