  direct negative response to the characters'' misfortunes, and aesthetic sorrow,
  which is the self-aware recognition that one''s vicarious grief is ordered correctly
  by the work''s design. The coherence-calibration view holds that aesthetic sorrow
  carries a positive valence not because it feels pleasant in itself, but because
  it confirms a kind of emotional calibration: we discover that we can suffer in a
  manner that is proportionate, responsive, and formally integrated. This is why,
  on my view, the correlation between the intensity of negative affect and overall
  aesthetic valuation is not paradoxical but expected—the more precisely the sorrow
  is calibrated to the structure, the stronger the coherence reward. I also want to
  resist the common analogy between tragic pleasure and the pleasure of resolving
  musical dissonance, because in tragedy the emotional dissonance often remains unresolved
  at the level of content; the resolution occurs instead at the meta-cognitive level,
  where the audience recognizes that unresolved suffering can still be experienced
  as fitting.


