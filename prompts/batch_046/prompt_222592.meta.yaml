  "Draft the joint statement that would result from an adversarial collaboration between
  Saturational Historians and Minimal Counterfactualists on the problem of overdetermination
  in historical explanation.


  The Saturational Historians maintain that historical outcomes are characteristically
  produced by dense conjunctures of structural, institutional, and agential conditions,
  such that adequate explanation requires mapping the full field of contributing factors
  and recognizing that the removal of any single factor often leaves the outcome intact;
  they treat overdetermination not as an explanatory failure but as a feature that
  reveals the robustness and path-dependence of historical processes. They defend
  an ideal of explanatory saturation: an account is sufficiently complete when it
  identifies all conditions that were jointly sufficient and demonstrates how their
  interaction produced the specific form of the outcome, even if no subset was strictly
  necessary.


  The Minimal Counterfactualists maintain that historical explanation must isolate
  minimal sufficient sets—those conditions without which the event would not have
  occurred in the form it did—and that appeals to overdetermination typically conflate
  causal contribution with causal necessity or reflect epistemic limitations rather
  than ontological abundance. They hold that without such minimal sets, explanations
  become unfalsifiable narrative accumulations, and they insist that the test of an
  explanation is whether it can support precise counterfactual judgments about what
  would have happened had specific factors been absent.


  Your document should contain the following, in this order:


