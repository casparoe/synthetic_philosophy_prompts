  should cover: (a) a shared formal distinction between conjunctural overdetermination
  (multiple conditions together sufficient, none alone necessary) and disjunctive
  overdetermination (multiple independent sufficient causes); (b) the fact that historical
  evidence is typically incomplete and that counterfactual reasoning in open systems
  involves uncertainty; (c) what both sides reject—specifically, the view that historical
  explanation is purely descriptive or that causal claims have no place in historiography;
  (d) the recognition that some historical events do involve genuinely redundant causal
  pathways; (e) the agreement that explanatory practices should be accountable to
  evidence rather than to theoretical preference alone; and (f) a neutral statement
  of the problem: that there is a persistent tension between the desire for explanatory
  completeness and the requirement for explanatory precision in multi-causal contexts.


  2. Disagreements Table. Two columns, each phrased in wording the respective camp
  accepts. Rows should address: (i) whether explanatory adequacy requires listing
  all contributing conditions or only identifying minimal necessary sets; (ii) whether
  the concept of explanatory saturation is coherent and useful, or whether it collapses
  into unfalsifiable narrative expansion; (iii) whether overdetermination in history
  is primarily an ontological feature of complex social systems or an artifact of
  our explanatory framing; (iv) the proper role of counterfactual testing in validating
  historical explanations.


