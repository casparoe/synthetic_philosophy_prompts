  hence, relations cannot be real independent entities, and any proposition asserting
  a relation must be understood as a unified whole rather than a complex of discrete
  parts. A recent proposal (call it the modal-adverbial view) attempts to dissolve
  the regress by denying that R is an entity at all: on this view, R is a second-order
  modal feature—specifically, a joint-possibility condition—of the ordered pair (a,b)
  taken together. The pair is therefore a single structured entity, and its internal
  ordering is explained by the modal feature''s positional asymmetry, not by an external
  link. Assess this modal-adverbial response to Bradley. Does it avoid the regress?
  Does it preserve, or undermine, the unity of the proposition <aRb>? And does it
  accurately represent what Bradley thought needed unifying?"


