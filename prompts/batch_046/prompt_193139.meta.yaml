  Elena began by saying that the Sapir–Whorf hypothesis is often caricatured as the
  claim that language makes thought impossible, when what it really asserts is that
  obligatory grammatical categories train habitual patterns of attention. She pointed
  to evidential marking—the grammatical requirement in some languages to specify whether
  information was seen, inferred, or heard—as a clear case. Speakers of such languages,
  she said, do not merely learn a vocabulary; they develop a reflexive habit of tracking
  epistemic sources.


  Marcus answered that this is unremarkable. Any specialized practice, he said, produces
  cognitive habits. Learning chess improves spatial reasoning; learning medicine improves
  diagnostic pattern-matching. The fact that speakers of evidential languages become
  good at tracking sources no more proves linguistic determinism than chess proves
  that the knight''s move reshapes the brain.


  Elena conceded the analogy but pushed further with an idea she called ''structural
  residue.'' Even when fluent bilinguals switch to a language without evidentials,
  she claimed, they retain a meta-cognitive tagging of information sources in working
  memory—an organizational pattern that shows up in non-linguistic sorting tasks.
  The grammatical obligation, she argued, has not merely supplied a skill but has
  reorganized the architecture of working memory itself.


  Marcus replied that this confuses correlation with causation. The cultures that
  maintain evidential languages also train children in rigorous source-monitoring
  through storytelling, ritual, and pedagogy. Language is the transmission vehicle,
  he said, but the causal work is cultural. To credit the grammar specifically is
  to mistake the messenger for the message.


  Elena responded that language and culture are indeed inseparable, but the specific
  grammatical form—the evidential morpheme—acts as a scaffold that stabilizes the
  practice across generations. Without that structural scaffold, she argued, the cognitive
  practice would diffuse. She added that she was not claiming total determinism, only
  ''channeling'': language does not build the river, but it digs the bed.


