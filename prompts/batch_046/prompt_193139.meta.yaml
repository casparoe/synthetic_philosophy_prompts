  "While I was revising a chapter in a borrowed apartment in the East Village, I overheard
  a disagreement between two guests—Elena, a cognitive linguist, and Marcus, a philosopher
  of mind—who had drifted into the kitchen and begun arguing about linguistic relativity.
  I listened without joining in, and I am reporting their exchange exactly as I recall
