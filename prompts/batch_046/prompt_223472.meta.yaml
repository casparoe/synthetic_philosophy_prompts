  and say whether the novel dramatizes a failure of Hume''s ideal-critic model or
  rather confirms that taste without adequate information is not taste at all. I want
  the reading to stay faithful to both sides: don''t reduce the novel to an illustration
  of Hume, and don''t distort Hume to fit the plot. End by saying what Wilde''s treatment
  adds to the philosophical debate about whether moral knowledge can correct — or
  only corrupt — aesthetic judgment.


