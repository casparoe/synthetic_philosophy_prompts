  Wilde''s The Picture of Dorian Gray through Hume''s account of taste — specifically
  his claim that beauty is not a property of objects but a sentiment refined by comparison,
  practice, and the correction of prejudice, and that reason can supply the circumstances
  for judgment but cannot itself generate the aesthetic feeling. Read the novel with
  that framework in mind: how do Basil''s, Lord Henry''s, and Dorian''s own judgments
  about the portrait and about Dorian''s appearance map onto Hume''s distinction between
  raw sentiment and the verdict of an ideal critic? Does the portrait''s hidden corruption
  work as a test case for whether aesthetic judgment requires full knowledge of an
  object''s moral history — something Hume allows reason to supply — or does Wilde
  suggest that knowing the corruption destroys the sentiment of beauty altogether,
