  The reason to continue is not the past years, but the present possession of specialized
  expertise that raises the future payoff. That is fully compatible with standard
  sunk-cost reasoning: update on your current state, ignore the history that produced
  it. If the same expertise had been acquired through a quick flash of insight rather
