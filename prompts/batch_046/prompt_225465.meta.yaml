  framework—say, a particular variant of non-well-founded set theory with custom notation.
  The remaining work needed to complete a result is small, but its marginal value
  to an outsider would be near zero, because the result is only comprehensible within
  that framework. For the mathematician herself, however, the past investment has
  not merely created attachment; it has constructed a private capability landscape.
  Quitting now does not preserve resources for an equivalent alternative, because
  the expertise is not fungible. Thus, Riley argued, continuing is not honoring a
  dead cost but recognizing that the agent''s present decision-relevant assets include
  a transformed skill set that makes the remaining path uniquely valuable to her.


