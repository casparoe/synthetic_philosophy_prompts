  I''m a software engineer with no formal philosophy background. Next Thursday I''m
  presenting a 20-minute position paper to an interdisciplinary tech-ethics seminar
  (about fifteen attendees: one Buddhist ethicist, one consequentialist, one Kantian,
  four ML engineers who treat ethics as optimization, and several cognitive-science
  graduate students). My thesis is that Buddhist ethics—centered on cetana (intention)
  and upaya (skillful means)—should be understood as an "attentional virtue ethics"
  rather than a form of consequentialism. Specifically, I argue that cetana functions
  as a structural evaluation of the quality of awareness directing an action, not
  as a weight on outcomes, and that upaya demonstrates moral reasoning is context-sensitive
  without being outcome-maximizing; therefore, applying consequentialist aggregation
  (e.g., reward-function optimization) to Buddhist moral reasoning is conceptually
  incoherent, not merely incomplete. I sketch the argument in three steps: (1) in
  canonical texts, harmful outcomes are evaluated through the lens of the mental state
  that produced them, not as independent variables; (2) upaya permits flexible responses
  precisely when rigid rules fail, but the flexibility is governed by the practitioner''s
  cultivated attention, not by a calculus of welfare; (3) if Buddhist ethics were
  consequentialist, the emphasis on non-attachment to results would be contradictory,
  since consequentialism requires attachment to outcome states as the locus of value.


  Please prepare my Q&A prep sheet. Order the objections by how likely they are and
  how damaging they would be if I mishandle them. For each, phrase it the way that
  specific subgroup would actually say it (the Buddhist ethicist, the consequentialist,
  the Kantian, the ML engineers, the grad students). For each objection, tell me:
  what I should concede immediately, what I should hold firmly, a two-minute reply
  suited to the seminar format, and the weakest point in that reply that I should
  defend rather than hope they miss. Be committed: take definite positions on which
  objections have real force and which replies are strongest, with explicit reasons
  for those judgments—do not lay out neutral options and leave me to choose. Include
  the one question I''m hoping nobody asks, and draft a concise reply for it that
  acknowledges its force. Where my argument takes liberties with standard Buddhist
  scholarship or relies on a contested interpretive move, flag that in the reply notes
  so I can own it rather than be caught off-guard.


