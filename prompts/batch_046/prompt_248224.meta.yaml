  unintended consequences without requiring a full specification of value. One variant,
  the "entropy-margin" approach, measures impact as the increase in the Shannon entropy
  of the distribution over a pre-specified set of macro-variables (e.g., atmospheric
  CO2, population counts of indicator species, average temperature in a region) relative
  to the baseline, weighted by the inverse of the natural variance of each variable.
  The claim is that because entropy is a purely statistical property of the state
  distribution, this measure allows an agent to avoid side effects without committing
  to any particular evaluation of which states are good or bad—only to a commitment
  about which variables are monitored.


