  hey, i''m a PhD student in philosophy of action and i''m TAing an undergrad seminar
  on rationality this semester. we covered Parfit''s hitchhiker case but i modified
  the exam prompt to keep people from just regurgitating the standard SEP summary.
  the question was: ''Consider Parfit''s hitchhiker scenario, modified so the hitchhiker
  can pay a mediator fifty dollars to seal an irreversible contract that automatically
  transfers the promised thousand dollars once they reach town. The mediator only
  seals the contract if the hitchhiker genuinely believes, with over 90% credence,
  that he would honor the deal even without the seal. The driver knows the mechanics
  of this arrangement. Is it rational for the hitchhiker to pay the mediator? And
