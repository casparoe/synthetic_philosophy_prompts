  the promisee specifically, rather than merely disappointing them. The participants
  divide roughly into two camps. One holds that promising is an exercise of normative
  power: the promiser voluntarily authorizes the promisee to hold them to a particular
  course of action, thereby creating a directed obligation analogous to consent. The
  other holds that promising is a socially constituted practice that generates legitimate
  expectations; the wrong of breaking a promise is not a breach of self-imposed authority
  but a betrayal of the reliance-structure the practice makes rational. Both sides
  accept the same core cases—promises made under partial deception about content,
  promises that become ruinous to fulfill, promises to entities that lack full moral
  status—and both concede that breaking them is pro tanto wrong. Yet the arguments
  never seem to intersect: the authority camp treats expectation-based accounts as
  missing the internal normative shift, while the practice camp treats authority-based
  accounts as mystifying social coordination with metaphysics of the will.


