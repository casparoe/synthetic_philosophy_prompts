  ordinary cases, but insisted that second-order claims about reliability are special:
  there''s a "methodological separation" condition that prevents you from validating
  method M using only the deliverances of M, even when logical intermediaries are
  involved. He pushed the analogy further: if vision and touch share the same neural
  substrate, cross-modal checks can be bootstrapped too, so Mara''s independence claim
  fails unless she can point to a genuinely external check — which she hasn''t done.
