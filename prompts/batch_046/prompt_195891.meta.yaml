  she knows she is not a BIV. From there, she argued, she can legitimately conclude
  that her perceptual faculties are not systematically deceptive in this domain, which
  then reinforces the original knowledge that she has hands. Leo immediately objected
  that this is just circular reasoning in slow motion — you''re using the output of
  your perceptual system to certify the system itself. Mara replied that not all circularity
  is vicious: she isn''t using her hands-knowledge to justify her hands-knowledge
  directly, but placing it inside a broader coherent framework via a logical entailment.
