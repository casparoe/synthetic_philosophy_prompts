  adequate translation manuals for a remote language: in Manual R, the natives'' "gavagai"
  is rendered as "rabbit"; in Manual P, it is rendered as "undetached rabbit part"
  or "rabbit temporal stage." I accept Quine''s point that no further behavioral fact
  decides between R and P. But I also resist the idea that R and P are merely notational
  variants, like Celsius versus Fahrenheit. It feels to me as if the two manuals genuinely
  disagree about what the natives are talking about, even though both are correct
  translations. So my verdict is: real indeterminacy exists, but it is not reducible
  to notational choice.


  Second, consider a language that lacks explicit plural morphology. One manual translates
  utterances about many rabbits by introducing a plural operator in the metalanguage;
  another keeps every noun singular and lets context do the work. Both manuals are
  empirically adequate. Here I feel the opposite: this is pure notational variance.
  There is no deep indeterminacy, just a choice about how to regiment the target language
  in English. So verdict: not all empirically equivalent manuals reveal indeterminacy;
  some are just stylistic.


