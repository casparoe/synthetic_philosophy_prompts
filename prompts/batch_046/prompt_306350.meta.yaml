  The argument runs as follows. (1) Whig history is objectionable primarily because
  it evaluates past actors and institutions by implicit reference to present norms
  and outcomes, thereby committing normative anachronism. (2) If importing present-centered
  standards into our assessment of the past is illegitimate in the normative domain,
  consistency requires that we reject importing present-centered outcomes into our
  explanation of the past, since both practices make the present the privileged terminus
  of historical inquiry. (3) But virtually all macro-historical explanation relies
  on retrospective causal framing: for instance, explaining the erosion of Roman senatorial
  authority partly by reference to the eventual collapse of the Western Empire, or
  accounting for the gradual centralization of early modern monarchies by appealing
  to the later consolidation of nation-states. (4) Therefore, if we genuinely reject
  Whig history in the strong form demanded by (1) and (2), we must reject retrospective
  causal framing altogether. (5) Rejecting retrospective causal framing eliminates
  the possibility of explanatory historiography, leaving us with mere chronicle. (6)
  The elimination of explanatory historiography is unacceptable. (7) Hence, by reductio,
  Whig history cannot be objectionable in the manner described in (1).


