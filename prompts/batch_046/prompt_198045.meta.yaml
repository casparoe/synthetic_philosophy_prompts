  it away. He noted that in asexual microbes and in hybridizing plant complexes, reproductive
  isolation—the linchpin of the biological species concept—is either absent or empirically
  useless. Meanwhile, phylogenetic approaches fail in these same groups because evolutionary
  history is genuinely reticulate rather than tree-like. He then introduced what he
  termed the boundary-indeterminacy thesis: if species are genuinely individuals,
  then gradual anagenetic transitions generate a Sorites-style paradox about precisely
