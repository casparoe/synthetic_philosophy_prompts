  Drawing on the evolutionary species concept, she claimed that species are not natural
  kinds but spatiotemporally restricted lineages—individuals, in the metaphysical
  sense—much as a river is an individual, not a kind defined by essential properties.
  Asking for the essence of a species, she said, is therefore as confused as asking
  for the essence of the Mississippi River: the boundaries are practical and conventional,
  not metaphysically deep.


