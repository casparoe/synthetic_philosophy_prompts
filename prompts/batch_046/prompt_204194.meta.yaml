  [Question]

  Consider the absent-minded driver problem. A driver is traveling home and must take
  one of two consecutive highway exits. The first exit leads directly home with payoff
  10; the second also reaches home but with payoff 6 because of extra traffic. The
  driver is absent-minded: if he reaches the second exit he cannot remember whether
  he has already passed the first. Now add a private token: the driver carries a scratched
  coin in his pocket. By feeling for it he can determine with certainty whether he
  is at the first exit (coin is smooth) or the second (coin is scratched), but the
  act of checking costs 0.1 utility. Should the driver check the token if he finds
  himself at the second exit? Analyze this using both the planning/acting rationality
  distinction and the framework of centered worlds (self-locating beliefs). Be precise
  about whether the token resolves the paradox or merely shifts it.


  [Student answer]

  The absent-minded driver should plan to drive straight past the first exit without
  stopping, since taking it yields 10 but missing it and being forced to take the
  second still yields 6, which is better than nothing. At the second exit, however,
  he should take it because he might actually be at the first exit, where leaving
  the highway gives him 10. This is the classic tension: planning rationality says
  go straight, acting rationality says exit.


  With the token added, the analysis changes but the tension remains. At the second
  junction, the driver can check his pocket. If he feels the scratch, he knows he
  is at the second exit and should take it for 6 minus 0.1, which is 5.9. If he feels
  smooth, he knows he is at the first and should take it for 10 minus 0.1, which is
  9.9. So checking always seems rational, since 9.9 and 5.9 are both positive and
  better than the alternatives.


  But there is a subtle point about centered worlds. In Lewis''s framework, beliefs
  are centered on the agent, so "I am at the second exit" is just a self-locating
  belief update. The token doesn''t provide new information about the world; it only
  updates the driver''s centered belief about his location. Therefore, under evidential
  decision theory, checking the token is rational because it updates his self-locating
  belief, but under causal decision theory he should not check, because feeling the
  coin doesn''t causally influence whether he is at the first or second exit — his
  location is already fixed. This means the planning/acting distinction collapses
  once private signals are introduced, because ex ante and ex post are just two descriptions
  of the same Bayesian update over centered worlds. So the token resolves the paradox
  by giving the driver a perfect self-locating map, but it doesn''t eliminate the
  underlying conflict between planning and acting — it just hides it inside the belief
  update.


