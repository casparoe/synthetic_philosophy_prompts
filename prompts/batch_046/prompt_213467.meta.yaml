  Drafting:


  I serve on a clinical ethics committee at a teaching hospital, and we are trying
  to maintain consistency in how we apply patient advance directives when the current
  patient’s mental state diverges sharply from the state anticipated by the document.
  Our record so far includes four decisions. First, an Alzheimer’s patient who had
  directed that she not be treated for infections if she no longer recognized her
  children; when she reached that state—peaceful, non-verbal, and without distress—we
  honored the refusal and withheld antibiotics for pneumonia. Second, a patient with
  progressive dementia had refused tube feeding in any state of dependency; when swallowing
  failed she was visibly distressed by hunger, and we overrode the refusal, providing
  nutrition. Third, a patient with a psychiatric history had executed a psychiatric
  advance directive refusing electroconvulsive therapy in any future episode, even
  should she request it; during a severe depressive episode she asked for it, and
  we honored the refusal. Fourth, a patient with traumatic brain injury retained long-term
  memory but had a radically altered personality and lost his prior career ambitions;
  his directive said he never wanted life-prolonging measures if severely disabled,
  yet he now expressed clear contentment in simple activities and requested chemotherapy
  for cancer, and we honored that current request.


  We now face a case that has split our committee. A woman wrote a directive stating
  that if she ever reached a state in which her required care exceeded her capacity
  for reciprocal interaction with her family and she could no longer understand that
  imbalance, then her life should not be prolonged. She now has severe anterograde
  amnesia combined with profound executive dysfunction: she recognizes her family,
  expresses affection, lives largely in the present moment with apparent contentment,
  and asks that a treatable infection be treated. She requires continuous full-time
  care, and her family reports that the burden is severe; she does not grasp the scale
  of that burden. The infection is easily treated, and without treatment she would
  likely die within days, but with treatment she would return to her present state
  of dependent but contented existence. Some members say this is closest to our first
  case—the triggering condition is met, and she lacks the understanding specified
  in the document—while others say it resembles our fourth case, in that she retains
  emotional connection and expresses a current desire to live.


  If we want to be consistent with ourselves, which of our four precedents is the
  closest analog, and what should we decide? If our precedents genuinely underdetermine
