  The presumptuous philosopher argument (Bostrom 2002) says: consider two theories
  about the total number of people who will ever exist — one with 10^20 and one with
  10^40. By self-sampling, you should think it''s more likely you''re in the larger
  group. But then you observe you''re on Earth, not in some huge space colony... wait,
  no, that''s self-sampling. Self-indication says you should favor theories that predict
  more observers exist, including you. The "presumptuous philosopher" is the objection
  that self-indication is too presumptuous because it allows you to conclude large
  populations exist just because you exist.


