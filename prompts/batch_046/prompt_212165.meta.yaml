  Let''s draft:


  I''m drafting my position for an interscholastic philosophy symposium on the philosophy
  of medicine, and I want a consistency audit before I present. Here is where I have
  landed, with some influences from both philosophy of biology and disability studies:


  (1) I accept a biostatistical naturalism about disease: a condition is pathological
  if and only if an internal mechanism fails to perform its evolutionarily selected
  function at a species-typical level of efficiency (the Boorsean model).


  (2) I apply this naturalism strictly to mental health: major depression counts as
  a disease only when it involves a malfunction of evolved affective and stress-regulation
  mechanisms; subjective suffering or social maladaptation without such dysfunction
  is not pathology.


  (3) At the same time, I think normativists capture something important: the practical
  boundary between disease and non-disease is partly fixed by social values about
  suffering, autonomy, and social role, so "health" is not a purely descriptive concept.


  (4) I maintain that aging is not a disease, because senescence represents the statistically
  universal, evolved life-history trajectory of our species rather than a deviation
  from it; attempts to medicalize aging confuse inevitable biological change with
  dysfunction.


  (5) I hold that intersex variations are not diseases, but not because they are statistically
  common—rather, because labeling them pathological requires importing a normative
  ideal of binary reproductive function that evolutionary biology, with its functional
  pluralism, does not actually mandate.


  (6) I insist on a sharp conceptual separation between disease and disability: disability
  is a relational mismatch between an individual''s capacities and their environment,
  whereas disease is an internal biological failure. Consequently, congenital deafness
  in a signing community involves no disability, yet the underlying auditory mechanism
  failure remains a disease.


  (7) I also think obesity is not properly a disease in itself, but rather a complex
  risk factor for specific pathologies like diabetes and cardiovascular dysfunction,
  since it lacks the specificity of a single failed mechanism and instead reflects
  interactions among behavior, environment, and metabolism.


  My question: which of these commitments genuinely pull against one another, which
