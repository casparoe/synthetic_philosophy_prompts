  spheres spaced exactly one meter apart in every direction, with no boundary and
  no other entities. Every sphere has the same intrinsic properties and stands in
  exactly the same spatial relations to its neighbors. Verdict: There are still many
  spheres—clearly not one sphere repeated—but I can no longer point to "this one"
  versus "that one" without arbitrarily breaking the symmetry. They exist, yet they
