  equality. The inner message is what the system itself asserts, such as Gödel''s
  sentence G saying ''I am unprovable.'' The key is Gödel numbering: it assigns integers
  to symbols, so syntactic relations become arithmetic relations. Once this numbering
  is derived inside the system as a theorem, the frame message literally contains
  arithmetic statements about itself. At that point, the inner message is not an added
  interpretation; it is built into the syntax automatically. So the outer message
  is redundant—an observer just reads off what the frame already encodes. This is
