  Question: In Gödel, Escher, Bach, Hofstadter distinguishes frame messages, outer
  messages, and inner messages. Explain why the inner message of a Gödel-style self-referential
  statement is not merely its frame message interpreted through an outer message.
  In your answer, address what happens if the formal system internally derives its
  own Gödel numbering scheme.


