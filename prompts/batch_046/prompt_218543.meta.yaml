  Domain: Epistemic closure and Nozick''s tracking theory of knowledge.


  Argument:

  Let''s call it "The tracking closure paradox".

  Premises:

  (1) Nozick''s tracking theory: S knows p iff (a) p is true, (b) S believes p, (c)
  if p were false in nearby worlds, S wouldn''t believe p, and (d) if p were true
  in nearby worlds, S would believe p.

  (2) Epistemic closure: if S knows p and knows p→q, then S knows q.

  (3) Suppose S knows "this is a zebra" and knows "if this is a zebra then it''s not
  a mule in disguise". By closure, S knows it''s not a mule.

  (4) But Nozick denies closure for this case: in nearby worlds where it is a mule
  in disguise, S still believes it''s a zebra (because the disguise is perfect).

  (5) So tracking violates closure.

  (6) Now consider a modified tracking condition: call it "strong tracking" where
  S tracks q relative to p if in worlds where p is true and q false (and nearby),
  S doesn''t believe q.

