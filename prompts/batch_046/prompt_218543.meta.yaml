  p→q, S tracks q.

  (8) But now apply this to "I am not a brain in a vat" (BIV). I don''t track BIV-falsehood
  in nearby worlds (since BIV worlds are far). But I know "if I have hands then I''m
  not BIV" and I know I have hands (tracking?). Wait, this is messy.


