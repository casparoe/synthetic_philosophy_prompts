  (1) In a one-shot, symmetric prisoner''s dilemma with no repetition, reputation,
  or external enforcement, mutual defection is the unique rational outcome; cooperation
  is individually irrational.

  (2) In an iterated prisoner''s dilemma with an unknown endpoint and stochastic noise
  in payoffs, generous tit-for-tat—not pure tit-for-tat—is the evolutionarily stable
  strategy in finite populations under mutation-selection balance, because pure tit-for-tat
  is vulnerable to noise-induced defection cascades.

  (3) Human cooperative norms—fairness, reciprocity, punishment—are fully explained
  by evolutionary mechanisms (kin selection, direct and indirect reciprocity, group-level
  selection) without invoking irreducible normative properties.

  (4) Because these norms track reproductive fitness rather than moral truth, evolutionary
  debunking arguments undermine the reliability of our pre-theoretic cooperative intuitions
  as guides to objective moral facts.

  (5) Despite (4), I am a moral realist about cooperation: there are mind-independent
  moral facts about whether agents ought to cooperate in particular dilemmas.

  (6) I identify these moral facts through reflective equilibrium that takes our intuitive
  judgments about cooperation and reciprocity as initial data.

  (7) The correct decision-theoretic framework is causal decision theory (CDT), not
  evidential decision theory (EDT); therefore, in scenarios where an agent''s choice
  correlates with another''s but exerts no causal influence, the agent should choose
  the causally dominant option, which in a prisoner''s dilemma is defection.

  (8) When cooperation has normative authority, that authority derives exclusively
  from aggregate welfare maximization, not from evolutionary utility or convention.

  (9) Evolutionary stability and rational-choice stability are conceptually distinct
  categories; a strategy can be evolutionarily stable without being rationally stable,
  and vice versa.


