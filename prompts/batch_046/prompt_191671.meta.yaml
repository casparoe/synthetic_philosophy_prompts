  the motivating case or conceptual distinction behind it, and flag whether it is
  non-negotiable or merely a preference of a particular camp. The list must cover,
  at minimum: (1) the distinction between evaluating an agent''s actions, character,
  and lasting institutional effects, with an explanation of why collapsing these produces
