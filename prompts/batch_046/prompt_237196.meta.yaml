  The virtue ethics vs situationist critique thing has been going in circles since
  like the 90s and honestly it feels like nobody''s moved. You have the virtue people
  saying moral character is real—courage, honesty, etc. are stable dispositions that
  explain why someone does the right thing across contexts. Then you have the situationists
  (Doris, Harman, etc.) throwing experiments at them—Milgram, the Good Samaritan study,
  all that—showing that tiny situational tweaks (a dime in the phone booth, being
  in a hurry) predict behavior way better than any personality score. The virtue crowd
  usually bites back by saying virtues are rare, or that they''re "local" not global,
  or that situationists miss the role of moral perception—how you see the situation
  depends on your character. The situationists reply that''s just moving the goalposts,
  redefining traits until they''re unfalsifiable. And then we just loop.


  My working theory is that this isn''t really about empirical psychology at all.
  I think the virtue ethicists are doing normative theory—saying what a good person
  should be—while the situationists are doing descriptive psychology, and they''re
  talking past each other under the word "character." But maybe I''m wrong and there''s
  actually a hidden disagreement about what counts as an explanation of action, or
  about whether traits need to be cross-situationally consistent to be real.


