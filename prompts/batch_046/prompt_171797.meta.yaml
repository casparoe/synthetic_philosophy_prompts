  Question: "Douglas Hofstadter argues that the self is a pattern—a ''strange loop''—that
  can in principle be instantiated in different substrates and even shared across
  minds. If the self is genuinely a pattern rather than a particular brain-bound substance,
  then in principle parts of my ''I'' could persist in the memories and cognitive
  styles of people who knew me well. Is this distributed-persistence view coherent?
  Does it require that we treat close friends or family members as literal continuations
  of the deceased, and does it collapse the distinction between remembering someone
  and being someone?"


  Student answer: Let''s craft one with subtle errors.

  The student writes:

  "Hofstadter''s view is that the self is just a pattern of information, like a computer
  program. So if my friend remembers me well, then part of my self literally lives
  in his brain. This means after I die, my family members are partly me, and we should
  treat them with the same moral consideration we give me. The view is coherent because
  it just applies materialism consistently: there''s no soul, just patterns. But it
  fails because it can''t explain why I care more about my own future pain than my
  friend''s future pain—if we''re both me, then egoism makes no sense. So Hofstadter
  must either accept that egoism is irrational or admit there''s a hidden substance
  to the self."


  Subtle mistakes:

  1. Conflates "pattern" with "computer program" (Hofstadter uses "strange loop" which
  is more specific).

  2. Misrepresents the implication: Hofstadter doesn''t say family members are "partly
  me" in a literal identity sense; he talks about persistence in others as a kind
  of distributed presence, not identity.

