  Turing''s computational framework each reverse the intuitive priority of comprehension
  over competence. One of my colleagues, Dr. E. Moran, has offered the following judgments
  about whether particular cases exhibit what she terms a ''Darwin-Turing inversion'':
  a situation in which a system displays genuine problem-solving competence despite
  lacking—indeed, operating in the absence of—any internal comprehension of the problem
  structure.


  Her verdicts to date:

  1. Darwin''s account of natural selection producing complex functional adaptations:
  yes, a paradigmatic inversion. Nature solves design problems without representing
  design goals.

  2. Turing''s conjecture that an initially unorganized learning machine could acquire
  linguistic competence without being programmed with grammatical rules: yes, a clear
  inversion. Syntactic and pragmatic competence precede and do not depend upon explicit
  structural comprehension.

  3. A contemporary large language model generating extended, coherent philosophical
  arguments: not an inversion. The model does not solve a problem but computes statistical
  continuations; there is no competence that needs explaining apart from comprehension,
  because there is no competence in the relevant sense.

  4. The slime mold Physarum polycephalum finding an efficient path through a maze:
  yes, but only weakly. The competence is genuinely mechanistic and non-representational,
  yet it lacks the generative novelty—the production of solutions outside the system''s
  evolutionary or training history—that marks the Darwinian and Turing cases.

  5. A human mathematician who arrives at a proof through unconscious intuition and
  only subsequently reconstructs an explicit derivation: not an inversion. The comprehension
  is deferred within the same cognitive system rather than absent, and the intuition
  itself draws upon representational resources that belong to the mathematician.


