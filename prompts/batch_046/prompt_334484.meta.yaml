  meeting for one seventy-five minute session. The goal is not to lecture them about
  these puzzles but to make them feel the tension themselves. Specifically, I want
  a two-round game. In round one, participants are paired and separated into different
  spaces; each receives an envelope explaining that they are logical twins in Platonia
