  the permanent problem of how to live wisely, agreeably, and well once scarcity is
  removed. Keynes worries that a society trained for generations to strive for survival
  will suffer a kind of nervous breakdown when forced to enjoy leisure without purpose;
  he also distinguishes absolute needs from relative needs that feel insatiable because
  they depend on social comparison. The passengers aboard the Axiom seem to have solved
  every absolute need—food, shelter, climate, entertainment—yet they drift in a state
  of passive, infantile consumption, physically atrophied and socially disconnected.
  At the same time, the robots WALL-E and EVE develop something like a vocation—collecting,
  sorting, protecting plant life, and pursuing connection—outside any economic incentive.
  Could one argue that the film dramatizes Keynes''s fear precisely: that solving
  economics does not solve living, and that without cultivated habits of purposeful
  activity people collapse into bad faith about their own freedom? Or does the film
  resist a Keynesian reading because the passengers'' condition is caused not by an
