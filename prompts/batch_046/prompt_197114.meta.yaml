  ---


  As a retired experimental physicist who has only recently begun reading philosophy
  seriously, I have been working through Nietzsche''s essay on the uses and disadvantages
  of history for life with a small study group. We have been trying to apply his tripartite
  distinction—monumental, antiquarian, and critical—to contemporary institutional
  practices, and we have reached agreement on four cases, though I suspect our reasoning
  may be running on more than one underlying principle.


  First, we judged that a national education programme which teaches only the heroic
  founding of a state, systematically omitting its failures and injustices, represents
  a monumental use of history: it selects past greatness to stimulate present action,
  but we warned that it risks suppressing the critical distance necessary for genuine
  reform.


  Second, we classified a local heritage project that digitises and stores every mundane
  artefact from a vanished industrial community—tools, letters, receipts—without curating
  any narrative or allowing public access, as a purely antiquarian history: it preserves
  continuity and roots, yet we noted that it burdens the present with a dead weight
  that serves no living purpose.


  Third, we agreed that a constitutional movement which explicitly voids all legal
  precedents established under a prior authoritarian regime, refusing any transitional
  provision or historical continuity, exemplifies critical history: it liberates the
  present from a burdensome past, though we acknowledged the danger of rootlessness
  if no new growth follows.


  Fourth, we considered a scientific research centre that constantly revisits the
  failed experiments of earlier generations not to replicate them, but solely to identify
  contradictions that justify abandoning the theoretical framework in which they were
  conducted; we classified this as critical history, because the past is treated as
  an obstacle to be overcome rather than a model or inheritance.


  We now face a new case, and I should like your judgement. A newly founded academy
  requires every scholar to maintain a complete, unedited digital archive of all preliminary
  thoughts, dead ends, and rejected drafts, open to the public; yet its charter forbids
  the direct citation of any archived failure in formal publications, and mandates
  that every published paper open with a narrative explaining how the author''s present
  insight breaks decisively from the accumulated errors preserved in the archive.
  The archive is therefore total and permanent, but the institutional culture treats
  the past exclusively as material to be transcended.


  If we wish to be consistent with our four precedents, how should we classify this
  academy—monumental, antiquarian, or critical? Which of our earlier verdicts is the
  closest analog, and if our precedents genuinely underdetermine the decision, what
  principle would we be adopting with each possible classification?


  Moreover, I am aware that our four agreements might be explained by more than one
  rule. Please identify the candidate rules that fit our track record equally well,
  state what each predicts about the academy, give your best guess with the reasons
  for preferring it, and specify one further case that would distinguish the rules
  from one another.


  Please do not provide bibliographies or reading lists; I am working without access
  to a library database and wish to test reasoning rather than recall of secondary
  literature.


