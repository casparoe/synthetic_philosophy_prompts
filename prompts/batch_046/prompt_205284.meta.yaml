  A colleague has pressed me with an argument about historiographical periodisation
  that I cannot shake, though its conclusion seems to dissolve the very objects historians
  study. I want to know where the fault lies, and what repairing it costs.


  (1) If "the Middle Ages", "the Renaissance", and "the Scientific Revolution" denote
  real historical entities rather than later inventions, then there must exist some
  distinctive feature — call it F — that every event or agent within the period possesses
  and that no event or agent outside the period possesses.


  (2) For the Renaissance, the usual candidates for F are the recovery of classical
  texts, humanist pedagogy, artistic naturalism, and an empirical turn in natural
  philosophy. Yet each of these is documented in the twelfth and thirteenth centuries
  (the translations at Toledo and Chartres, the naturalism of the Oxford Calculators,
  the humanist interests of John of Salisbury) and remains prominent well into the
  seventeenth century (Boyle''s alchemical practice, the persistence of scholastic
  logic in early modern universities).


  (3) The same pattern holds for the Scientific Revolution: mechanistic explanation,
  mathematical modelling of nature, and experimental practice all have clear medieval
  antecedents and do not vanish after Newton.


  (4) Therefore no feature F uniquely demarcates these periods.


  (5) If no feature uniquely demarcates a period, then the boundary is purely conventional
  — a retrospective imposition with no basis in the historical material itself.


  (6) But a purely conventional boundary cannot figure in genuine historical explanations;
  one cannot explain an outcome by appealing to membership in an invented category.


  (7) Hence either these periods are not real (and historians have been explaining
  things by reference to fictions), or there is a flaw in the reasoning.


  (8) The sceptic might reply that boundaries need not be sharp to be real: a period
  can be real as a cluster or density gradient, like "adolescence" or "industrialisation",
  without possessing necessary and sufficient conditions.


  (9) However, if cluster-reality saves the Renaissance, it saves every arbitrarily
  drawn epoch — including "the Dark Ages" and "the Age of Aquarius" — provided one
  can point to some loose family resemblance. So the reply proves too much: it eliminates
  any distinction between legitimate periodisation and arbitrary labelling.


  (10) Therefore either we abandon all periodisation as explanatory fiction, or we
  must reject one of the premises above and accept that some invented boundaries are
  nevertheless epistemically privileged.


