  ---


  I am an undergraduate reading philosophy of mind and aesthetics, and I have become
  stuck on the so-called paradox of fiction. The classic formulation is familiar:
  we appear to feel genuine pity, fear, or sorrow for characters and events we know
  to be entirely invented, yet standard accounts of emotion seem to require that the
  subject believes the object is real and that the emotion carries some behavioural
  exit condition—an impulse to act that is conspicuously absent when we weep in a
  cinema. The literature I have encountered offers what look like three entrenched
  positions. One holds that our responses are not full-blooded emotions but rather
  "quasi-emotions" sustained by a game of make-believe; another treats them as genuine
  affective states generated by mental simulation of the represented situation; and
  a third argues that the paradox dissolves once we reject the belief-condition altogether
  and allow emotions to be directed at mere representations.


  Despite decades of refinement, the debate seems to have reached an impasse: every
  argument for one view has a well-rehearsed reply, and no empirical result or formal
  distinction has clearly shifted anyone. My working hypothesis is that the stall
  is not empirical but taxonomic. The sides may be answering different questions—one
  about the phenomenological quality of the feeling, another about its causal-functional
  profile, another about its intentional object—while using the same word "emotion"
  to cover all three. I want to test this, but I also want to consider an alternative
  I have not seen discussed in standard surveys: that the disagreement is masked by
  an implicit dispute over whether an affective state lacking any behavioural exit
  condition (no tendency to assist the character, flee the theatre, or alter the plot)
  can count as the same kind of state as its real-world counterpart, or whether that
  absence transforms it into a categorically different phenomenon—perhaps closer to
  an aesthetic attitude than to an interpersonal emotion.


  To make this concrete, consider a hypothetical case: a reader spends several weeks
  in genuine insomnia and appetite suppression after finishing a tragic novel, symptoms
  that mirror clinical grief, yet consistently reports that she never believed the
  events occurred and feels no impulse to intervene in the fictional world. Does this
  case support the realist about fictional emotion, undermine the make-believe account,
  or simply show that functional profiles can diverge without changing ontological
  kind?


  Please do not provide a bibliographic survey or a list of authors to read. Instead,
  diagnose the structure of the disagreement: is it verbal, substantive, or a case
  of hidden empirical or formal questions being smuggled in? Identify what each side
  actually presupposes about the necessary conditions for an emotional state—belief,
  behavioural readiness, representational directedness, or something else—and say
  whether these presuppositions are genuinely incompatible or merely applied to different
  explanatory targets. Given your diagnosis, tell me what kind of progress would be
  possible: a conceptual distinction, a revised taxonomy, an empirical finding about
  affective neuroscience, or a change in the framing question itself? Or should we
  expect no resolution and, if so, why?


  Please write in British English, and conclude with a fixed, machine-readable line
  beginning "Verdict:" that states your diagnosis in a brief phrase, followed by a
  one-sentence summary of your reasoning on the final line.


