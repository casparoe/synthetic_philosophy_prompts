  Maya''s position: Reactive attitudes are appropriate if and only if the agent currently
  possesses the psychological capacities for moral understanding, emotional responsiveness,
  and behavioral control. If brain damage, severe psychosis, or extreme coercion removes
  those capacities, resentment is inappropriate — we switch to an "objective" attitude,
  treating them as something to be managed rather than blamed.


  Leo''s position: He introduces what he calls the "interlocutor continuity condition."
  He agrees capacities are necessary, but argues they are not sufficient. For a reactive
  attitude like resentment to be genuinely appropriate, the agent''s action must also
  be continuous with an ongoing narrative in which we recognize them as the same moral
  interlocutor over time. If the action is radically discontinuous — say, caused by
  a sudden, unprecedented brain lesion — we should withhold resentment not merely
  because capacities are missing, but because the action no longer belongs to "them"
  in the relational sense required for participant attitudes. Conversely, if someone
  has a long-established pattern of harmful behavior and then suffers temporary impairment,
  the continuity condition might allow reactive attitudes to persist because the action
  fits the narrative of that interlocutor.


