  a capacity-centered view: a reactive attitude like resentment is warranted only
  when the person currently has the psychological capacities for moral understanding,
  emotional responsiveness, and self-control. If a brain injury, severe mental illness,
  or extreme coercion removes those capacities, then blame is out of place; we should
  instead take what Strawson called an objective attitude, treating the person as
  something to be managed rather than as a fellow participant in moral life. Leo largely
  agreed that capacities matter, but he insisted they are not enough. He introduced
  what he named the interlocutor continuity condition: for resentment to be genuinely
  fitting, the harmful action must also belong to an ongoing narrative in which we
  recognize the agent as the same moral interlocutor over time. If the behavior is
  radically discontinuous — caused, say, by a sudden unprecedented brain lesion in
  someone with no prior history — we should withhold blame not merely because capacities
  are missing, but because the act no longer expresses the kind of sustained selfhood
  that makes reactive attitudes appropriate. Conversely, Leo argued, if someone has
  a long-established pattern of harmful conduct and then suffers a temporary impairment,
  continuity might allow reactive attitudes to persist, since the action still fits
  the narrative of that particular interlocutor."


