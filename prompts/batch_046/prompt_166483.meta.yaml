  seemed intuitive: we hold people responsible not because of some deep metaphysical
  freedom, but because of how we relate to them emotionally and socially. Recently,
  however, two people in my study group — Maya and Leo — got into a prolonged disagreement
  about exactly when these reactive attitudes are warranted, and neither convinced
  the other. I am writing to ask for a careful adjudication of their exchange."


