  Let''s draft:


  "I''m currently writing my final paper for a seminar on Buddhist philosophy of mind
  and comparative theories of personal identity, and I''d like a consistency audit
  of my position before I finalize my argument. Here are the commitments I want to
  defend together:


  (a) The Buddhist doctrine of anatta denies a permanent, metaphysically simple self-substance
  (atta/ātman), but not all conventional continuity; the conventional person (puggala)
  is a dependently originated stream (santāna) of psycho-physical aggregates (khandha)
  sustained by causal conditions, real enough for ethical and legal discourse (sammuti-sacca).


  (b) Modern psychological-continuity theories (e.g., Parfit-style reductionism) approximate
  this insight but err by treating psychological relations as holding between an implicit
  underlying subject; strictly speaking, there are only the relational events themselves,
  not a subject that stands in them.


  (c) Narrative-identity theories (e.g., Schechtman, Ricoeur) correctly describe the
  phenomenological structure of human selfhood—the self is experienced as the protagonist
  of an integrating autobiographical story—but this narrative is a conventional designation
  (paññatti) imposed upon the stream, not its metaphysical backbone.


  (d) For practical ethics and legal accountability, I hold that moral responsibility
  attaches specifically to the narratively integrated agent: an being is the proper
  subject of praise or blame only if it can recognize its past actions as its own
  within a coherent life-story and project that story forward.


  (e) I interpret karma and rebirth (punabbhava) non-literally: they describe the
  transmission of mental formations and dispositional tendencies (saṅkhāra) within
  a single biological life, not the transmigration of a soul across bodies; there
  is no non-physical substrate carrying mental states after brain death.


  (f) If a person''s entire psychological and narrative structure were causally transferred
  with perfect fidelity to a synthetic substrate, the resulting being would be the
  same conventional person and should inherit all her moral and legal obligations.


  (g) In pathological cases—severe dissociative disorder or split-brain surgery—where
  two centers of narrative agency emerge within one biological life, neither center
  should be held fully responsible for actions performed by the other, even though
  both share a pre-division causal history.


  (h) The ultimate soteriological aim of Buddhist practice is the cessation of clinging
  (upādāna) to the aggregates, which entails dissolving the narrative self-construct;
  thus the conventional self, while ethically necessary, is ultimately something to
  be transcended rather than preserved.


