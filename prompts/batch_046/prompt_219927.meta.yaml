  I''m trying to determine whether my judgments about foreseen but unintended harm
  can be captured by a coherent moral principle—perhaps a refined version of the doctrine
  of double effect, or perhaps something that abandons parts of it. Here are my verdicts
  on concrete cases.


  Case 1: A surgeon kills one healthy patient and harvests her organs to save five
  others who will otherwise die. The death of the one is the direct means by which
  the organs are obtained. My verdict: impermissible.


  Case 2: A switch operator diverts a runaway trolley from a track with five people
  to a track with one. The death of the one is not the means by which the five are
  saved; it is a side effect of the diversion. My verdict: permissible.


  Case 3: I design an automated subway defense system. If five passengers fall onto
  the tracks, the system deploys a physical barrier that saves them but will necessarily
  crush a maintenance worker in an adjacent access tunnel. I do not know who the worker
  will be, and the crushing is not the mechanism by which the five are saved (the
  barrier''s position saves them). My verdict: permissible, though I feel it is closer
  to Case 2 than to Case 1.


  Case 4: I program an autonomous vehicle''s collision algorithm to always minimize
  total fatalities. In a forced-choice scenario, this entails steering into one pedestrian
  to avoid killing five passengers. I do not intend any particular death; I intend
  only to implement the minimization rule generally. My verdict: permissible to implement,
  but I feel this should be treated differently from Case 3, even though both involve
  automated, institutional mediation of harm. I cannot articulate why.


  Case 5: A vaccine is approved that prevents ten thousand deaths but carries a known,
  statistically predictable risk of fatal reaction in one in a thousand recipients.
  The ten expected deaths are side effects of the immunization mechanism, not the
  means by which protection is conferred. My verdict: clearly permissible.


  Case 6: A carbon tax is imposed knowing it will cause severe economic hardship and
  increased mortality in a specific coal-dependent region. The emissions reduction
  works through market price signals, not through the regional suffering; however,
  part of my reasoning for supporting the tax is that the visible hardship demonstrates
  political resolve, which strengthens the policy''s credibility and therefore its
  environmental effectiveness. I keep going back and forth: part of me says this is
  like Case 2, part says that because the regional harm enters my reasoning about
  why the policy works, it becomes like Case 1.


  Is there one principle—stated precisely, with each clause motivated by the case
  it explains—that delivers all six verdicts? If not, what is the smallest set of
  competing principles, and which of my verdicts must each abandon? Please also say
  what your preferred account predicts for a case I have not considered: a genetic
  therapy cures a fatal disease in 95% of patients, but in 5% with an easily detectable
  genetic marker it is fatal. The therapy is made available without requiring screening,
  because testing everyone would delay treatment and cost lives among the 95%. Is
