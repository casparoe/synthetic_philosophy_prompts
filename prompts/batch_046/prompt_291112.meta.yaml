  "After a long and rather exhausting argument with a friend about whether legal systems
  can coherently authorize their own amendment, I tried to write down exactly where
  I stand so that the contradictions, if any, are mine rather than his. Here is the
  set of commitments I think I hold on self-amending rules and the paradoxes of legal
  self-reference. First, I take Hart''s rule of recognition to be the ultimate criterion
  of validity in any mature legal system, but I also hold that this rule can contain
  an explicit self-amending clause—something like a constitutional provision that
  specifies its own revision procedure—without generating a vicious circularity. Second,
  I believe Alf Ross''s paradox of self-amendment is genuinely puzzling but ultimately
  dissolves once we distinguish sharply between the rule that authorizes change and
  the meta-rule that validates the authority to apply it. Third, I am convinced that
  if a rule can amend itself, then the authority that applies the amended rule is
  not the same authority defined by the pre-amended rule, which means legal continuity
  is always a reconstructed fiction rather than an identity-preserving relation. Fourth,
  despite this, I think legal interpretation must remain anchored in the original
  intent behind the self-amending provision, even when that intent explicitly delegates
  future interpretive authority to bodies that did not exist when the provision was
  enacted. Fifth, I reject the idea that any self-referencing norm requires an external
  grounding point; I think internal coherence conditions are sufficient, but I also
  think that every internal coherence check must itself be authorized by the very
  system it checks, which seems to close the loop. I do not know which of these I
  am prepared to drop, and I am not signaling a preference—my friend thinks the third
