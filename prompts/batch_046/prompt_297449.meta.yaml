  and equity-preference profiles that should adjust offer packaging. Third, our internal
  documentation wiki uses cohort tags — assigned automatically by birth year — to
  trigger "generation-relevant onboarding context," so that the same API guide is
  presented with different framing narratives depending on whether the reader is tagged
  Gen Z or Millennial. Managers also manually annotate "cultural alignment scores"
