  Argument about separateness of persons:


  (1) The separateness of persons is the claim that benefits and burdens cannot be
  summed across individuals the way they can within one life.

  (2) If this is true, then there is no coherent meaning to "the greatest good for
  the greatest number," since there is no single subject of whom "the greatest good"
