  I''m writing to ask for a careful adjudication of a disagreement I witnessed in
  a philosophy of language seminar. Two graduate students, Maya and Leo, were arguing
  about the correct norm of assertion—specifically, whether knowing that p is sufficient
  to license asserting p, or whether some form of personal belief or endorsement is
  also required. The exchange went through several rounds, and both seemed to make
  genuinely decent points; I couldn''t tell who was winning, and the instructor didn''t
  intervene. I am not a philosopher myself, just a bystander taking notes, and I don''t
  want to tip the scale: please treat both arguments charitably and tell me, point
  by point, who is right about what, and whether either is missing something important.


  The dispute began with a concrete case. Maya described a mathematician who asserts
  a complex theorem—say, a result in number theory—based entirely on a computer-assisted
  proof she has verified is correct but does not intuitively grasp. Maya said this
  is perfectly legitimate: the mathematician knows the theorem (the proof is sound,
  she understands the verification procedure, and there is no epistemic luck), so
  the knowledge norm of assertion—assert only what you know—is satisfied. Leo objected
  that this feels wrong: if she cannot explain the proof''s core idea or defend it
  against an expert challenger without running the program again, she doesn''t really
  believe the theorem in the first-person sense, and assertion expresses commitment.
  He proposed that the norm should be something like "assert p only if you sincerely
  and reasonably believe p on the basis of your own understanding," which would bar
  this kind of deferred assertion.


  Maya replied that Leo''s norm is too restrictive and collapses into a kind of epistemic
  individualism. In modern science, she noted, researchers routinely assert results
  they depend on colleagues or instruments to establish—think of a biologist citing
  a sequencing result she didn''t personally run. If personal understanding were required,
  collaborative knowledge transmission would be impossible. She also argued that Leo''s
  appeal to "feeling wrong" confuses sincerity conditions with epistemic norms: you
  can sincerely assert something you barely understand if you genuinely know it through
  reliable testimony or tools, just as you can sincerely assert something false if
  you''re ignorant.


  Leo came back with two distinctions. First, he said Maya conflates knowing-through-testimony
  with knowing-through-opaque-computation: in testimony, you understand the claim''s
  content even if you didn''t discover it, but in the computer-proof case, the mathematician
  may not understand why the intermediate steps are valid—she only knows that the
  machine followed rules. Second, he introduced what he called a "commitment-structure"
  point: assertion isn''t just information transfer but an undertaking to answer for
  the claim. If challenged, the mathematician can only say "the computer says so,"
  which reveals she hasn''t taken on the relevant responsibility. Therefore, he concluded,
  knowledge is necessary but not sufficient; you also need what he termed "cognitive
  ownership"—a minimal grasp that lets you stand behind the claim.


  Maya''s final move was to question whether "cognitive ownership" is a hidden knowledge
  condition in disguise. If the mathematician truly doesn''t understand the proof
  at all, she may not actually know the theorem—she might merely have very strong
  justified true belief about the computer''s reliability, which is knowledge about
  the computer, not about number theory. But if she does understand the verification
  framework and can defend the result at that level, then she already has enough knowledge,
  and Leo''s extra requirement is redundant. She ended by asking whether Leo''s view
  would force us to reject assertions in any domain of epistemic division of labor,
  and if so, whether that cost is acceptable.


