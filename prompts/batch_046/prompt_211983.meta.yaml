  Let''s design the commitments precisely:


  (1) I am an immanent realist about universals: properties like redness and triangularity
  are genuinely shared by many particulars, but they exist only in those particulars,
  not in a Platonic realm.


  (2) I think the "One over Many" argument succeeds for qualitative properties (colors,
  shapes) but fails for natural kinds (being gold, being water), because natural kind
  membership is fixed by hidden microstructure rather than by shared observable universals.


  (3) I reject resemblance nominalism: saying "red things are similar" without a shared
  universal of redness is either circular or collapses into a universal of resemblance.


  (4) Nevertheless, I hold that resemblance itself is a primitive, non-universal relation:
  it holds directly between particulars and does not require a shared property of
  "resembling".


  (5) I think objective similarity is impossible without universals: if there are
