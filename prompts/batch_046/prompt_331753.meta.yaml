  Draft:


  I''m preparing a consistency audit for a seminar on the ethics of armed conflict,
  and I want to know whether my current package of views is jointly tenable. Here
  is my profile:


  (1) I accept the moral equality of combatants in its traditional form: soldiers
  fighting for a just cause and soldiers fighting for an unjust cause possess identical
  moral permissions to kill opposing combatants and identical rights not to be killed,
  with the objective justice of the cause making no direct moral difference to these
  permissions and rights.


  (2) I think defensive killing is governed by a liability-based account: a person
  forfeits their right not to be killed only if they are morally responsible—through
  culpable action or omission—for posing an unjust threat.


  (3) I hold that soldiers on the unjust side typically pose an unjust threat objectively,
  but they very often lack culpability because they are non-culpably ignorant of the
  factual circumstances that make the war unjust, or because they are subject to severe
  coercion or institutional deception; therefore, they usually do not forfeit their
  rights.


  (4) I hold that soldiers on the just side do not pose any unjust threat and therefore
  retain their full rights not to be killed, regardless of whether they are conscripted
  or voluntary.


  (5) I think that the combatant/non-combatant distinction should be maintained as
  a basic legal and moral rule, and that it ought not be collapsed into an individual
  liability analysis—even if such an analysis would sometimes justify targeting non-combatant
  architects of aggression or protect excused conscripts.


  (6) I think that a soldier''s personal belief about the justice of the war is neither
  necessary nor sufficient for their moral permission to fight; instead, institutional
  authorization and the division of moral labor between political decision-makers
  and soldiers do the normative work.


  (7) I draw a sharp distinction between factual ignorance, which can excuse unjust
  soldiers, and normative ignorance about the principles of just war, which cannot
  excuse them, because I take those normative principles to be accessible to practical
  reason regardless of institutional deception.


  Please examine these commitments for tension. Which pairs pull against each other,
  which tensions are only apparent, and what is the least costly revision for each
  genuine conflict? Rank the tensions by severity, and be specific about whether (1)
  can survive alongside (2)–(4), and whether (5) is consistent with (2) given (6)
  and (7). Do not treat all conflicts as equally bad; identify the single revision
  that would clean up the most tension if I had to choose one. I am not indicating
  which commitment I am prepared to abandon.


