  indexical tracks the brain''s spatial position, not the body''s.

  (2) Drawing on my background in tracking complex systems, I hold that diachronic
  identity of a cognitive system requires the continuous spatiotemporal trajectory
  of its information-bearing substrate; functional duplication is not enough—if every
  neuron is gradually replaced by a synthetic analog, the original system eventually
  terminates, even if behavior is preserved.

  (3) At the same time, I think consciousness is not substrate-independent: it requires
  an embodied, homeostatically coupled biological system interacting with an environment,
  so a brain in isolation, lacking peripheral sensory loops and metabolic integration,
  would not be genuinely conscious, however well it simulates awareness.

  (4) If the brain is duplicated so that both the original in the vat and a copy in
  a new body report being me, I deny there is a determinate fact of the matter about
  which one is correct; personal identity can branch like a biological cell dividing,
  and the question "which is the real me?" is malformed rather than unanswered.

  (5) I also maintain that first-person authority about who I am is epistemically
  basic but fallible with respect to location: if I sincerely report being in the
  laboratory while my brain is actually in the basement vat, I am wrong about where
  I am but not wrong about being myself.


