  After a long, exhausting argument with a close friend about whether taking the simulation
  argument seriously should weaken our commitment to far-future longtermism, I want
  us to stop talking past each other. I represent the "Dampening" camp: I think that
  if Bostrom-style reasoning is sound, then indexical uncertainty about our position
  in a possible nesting of simulations collapses the expected causal reach of present
  actions, which should reduce the rational urgency of cosmological-scale intervention
  relative to nearer-term moral obligations. My friend represents the "Preservation"
  camp: she thinks the same formal reasoning leaves longtermist priorities intact,
  because moral weight is indexed to the causal structure we actually inhabit, and
  because the possibility of upward propagation through simulation layers actually
  amplifies the stakes of avoiding catastrophic outcomes.


  Please draft the adversarial-collaboration document that the Dampening camp and
  the Preservation camp could jointly sign. I want it structured as follows:


  First, a numbered list of agreed claims: statements about the logical structure
  of the simulation disjunction, about what longtermism requires (e.g., that expected
  value can depend on causal reach and on the scale of affected populations), about
  the formal possibility of nested simulations, and about which empirical or conceptual
  results both sides accept as settled. Where a claim touches on a known result in
  decision theory or philosophy of probability, state it precisely but without bibliographic
  apparatus.


  Second, a disagreements table. Each row should name a residual dispute, state the
  Dampeners'' position in wording they would accept, state the Preservationists''
  position in wording they would accept, and note whether the dispute is substantive
  or partly verbal.


  Third, identify the cruxes: the sub-questions such that resolving them in one direction
  would move at least one side. I suspect key cruxes include (a) whether moral obligation
  is indexed to the base-reality causal graph or to the local simulation layer, and
  (b) whether exponential suppression of influence through nesting layers is a feature
  of the formal model or an artifact of an unjustified prior. But include any others
  you find.


  Fourth, for each crux, specify a concrete thought experiment, formal model, or piece
  of reasoning that both camps agree would bear on it. Then record, in advance, what
  each camp predicts that the case or model will show. For example, if the crux concerns
  nested influence, present a simplified three-layer simulation model with defined
  propagation rules, and state whether the Dampeners predict the present-value of
  a far-future intervention asymptotes to zero or remains bounded away from it, and
  what the Preservationists predict.


  The document should be formal and polished. Do not ask for citations, reading lists,
  or references to specific scholars beyond the minimal framing needed. Do not include
  quotations from texts unless you have fetched the exact wording from a source; otherwise
  paraphrase without quotation marks. If you invoke any specific result (e.g., from
  decision theory), state it in your own words.


