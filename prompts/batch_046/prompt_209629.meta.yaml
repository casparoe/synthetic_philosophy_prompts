  Essay sketch:

  The standard wrong-kind-of-reasons problem asks whether pragmatic or relational
  considerations can justify belief or admiration. I propose extending this framework
  to collective epistemic practices. Imagine a senior researcher who has endorsed
  a theoretical framework that a junior collaborator''s career depends upon. New counterevidence
  emerges. On the one hand, there is a pragmatic reason to maintain her public endorsement:
  protecting the junior researcher''s livelihood and the stability of the team. On
  the other hand, there is what I call a role-based reason: as a mentor and institutional
  leader, she owes consistency, reliability, and protection of dependents within the
  collaborative structure. This reason is not merely self-interested or prudential;
  it derives from the normative structure of the role itself.


  The puzzle is that if she retains her belief in the framework primarily because
  of this role-based reason, she seems guilty of letting a wrong kind of reason govern
  her epistemic attitude—analogous to believing a proposition because it makes one
  happy. Yet abandoning the framework immediately might also violate her role obligations,
  now by destabilizing the very collaboration she is meant to sustain. Thus role-based
  reasons appear on both sides of the decision.


  My proposed resolution distinguishes between reasons for entering or revising an
  epistemic state (where only truth-oriented considerations are of the right kind)
  and reasons for structuring the institutional expression or temporal management
  of that state (where role-based considerations are legitimate). The risk, however,
  is that this distinction looks ad hoc: without an independent account of epistemic
  agency that separates belief-formation from belief-management, we have merely relocated
