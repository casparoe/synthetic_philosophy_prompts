  "I am preparing a feature on the epistemology of aesthetic judgment, and in the
  course of my reporting I have been speaking with a philosopher—let us call her Dr.
  Vasquez—who holds a consistent but unexplained position on aesthetic testimony.
  Her recorded verdicts are as follows: she accepts that a listener can come to know
