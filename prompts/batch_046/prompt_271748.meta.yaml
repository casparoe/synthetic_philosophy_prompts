  she accepts that one can know a painting employs recursive formal innovation solely
  from a curator''s explanation; she rejects that a viewer can know a work is emotionally
  moving purely from testimony; she rejects that one can know a canvas is perceptually
  harmonious without direct viewing; and she accepts that one can know a work expresses
  the artist''s intended grief solely from documentary testimony. I want to understand
  the principle she is running.


