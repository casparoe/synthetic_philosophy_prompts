  nature is regular, we now ask why God maintains His custom consistently. That expectation,
  she said, requires the same unjustified inference from past divine behavior to future
  divine behavior—only now the object is divine psychology rather than physical causation,
  and we have lost the empirical check that nature at least presents.


  Samir answered that the comparison is unfair. In Islamic theology, God''s consistency
  is not established by empirical induction over past miracles but by rational and
  revealed knowledge of necessary divine attributes. So occasionalism grounds regularity
  in something necessary and knowable a priori, not in contingent observation.


  Elena conceded that this works within a theological framework, but insisted that
  philosophically it adds metaphysical cost without explanatory gain. From a neutral
  standpoint, occasionalism replaces one unexplained regularity with another and denies
  all secondary causation. She said that if the goal is philosophical explanation,
  substituting God for natural essences doesn''t solve the pairing problem—why fire
  with burning, rather than fire with freezing?


  Samir then introduced a structural comparison. He said occasionalism is actually
  the inverse of modern dispositional essentialism: instead of each substance carrying
  its own necessary causal powers, all powers are centralized in one agent. This makes
  occasionalism more parsimonious in one respect, since it avoids multiplying necessary
  connections across every kind of substance.


  Elena accepted the structural parallel but argued it undermines Samir''s case. If
  occasionalism is just dispositional essentialism with God substituted for natural
  essences, then it inherits the same explanatory gap—why these particular pairings?—while
  also being less parsimonious overall, because it requires a constantly active deity.
  She added that if God creates burning specifically when cotton is near fire, then
  the conditions are doing causal work in determining divine action, which smuggles
  secondary causation back in under a different name. If, on the other hand, God creates
  burning regardless of conditions, then occasionalism cannot explain observed correlations
  except as sheer divine coincidence.


