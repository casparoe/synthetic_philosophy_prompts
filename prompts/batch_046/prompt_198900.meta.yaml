  are distributed across server infrastructure whose cooling and power systems serve
  external economic ends; the dissipation is not organized around maintaining the
  computation''s autonomous boundary. Consequently, I argue that moral attribution
  should be reserved for computations that are physically embedded in self-maintaining
  dissipative agents, regardless of functional sophistication.


