  She said the omission caused the breach.

  - A security patch for a third-party library was available but not applied, because
  the maintenance contract explicitly excluded dependency updates; the system was
  later exploited through that vulnerability. She said the omission did not cause
  the exploit.

  - A redundant cross-check node was left out of a distributed database deployment.
  It was not listed in the client''s specification, not required by the contract,
  and not mentioned in the deployment checklist, but it was part of the standard architecture
  for that database class and present in every prior team deployment. A split-brain
  failure corrupted data. I haven''t told her about this one yet.


