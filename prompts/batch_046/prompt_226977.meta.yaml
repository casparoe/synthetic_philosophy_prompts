  ---


  As a retired experimental physicist who has only recently turned to philosophy with
  any seriousness, I have spent the past year working through Marx''s writings on
  exploitation and alienation—principally the 1844 Economic and Philosophic Manuscripts
  and the first volume of Capital—without the mediating framework of professional
  Marx scholarship. I should like you to draft the joint statement that might emerge
  from a rigorous adversarial collaboration between two interpretive camps that have
  been arguing past one another on these topics.


  The two camps are:


  Camp A, the Value-Form Structuralists, who maintain that exploitation is rigorously
  co-extensive with the extraction of surplus value within specifically capitalist
  relations of production, and that alienation is therefore best understood as the
  empirically variable, subjective experience of separation from the means of production
  and from the product of one''s labour.


  Camp B, the Normative Ontologists, who maintain that exploitation is fundamentally
  the asymmetric instrumentalisation of human labour-power for ends not reciprocally
  controlled by the labourer—a condition that can obtain outside capitalism—and that
  alienation is an objective deformation of human species-being (Gattungswesen), such
  that one may be alienated irrespective of subjective satisfaction.


  Please produce a formal document comprising:


  (i) A numbered section of agreed claims—statements about Marx''s texts, about the
  logic of capitalist production, and about the phenomenology of modern labour that
  both camps would endorse without reservation, phrased so that neither side reads
  its own defeat into them.


  (ii) A disagreements table setting out, for each residual dispute, Camp A''s formulation
  in wording Camp A would accept, and Camp B''s formulation in wording Camp B would
  accept. The disagreements should be precise, not merely rhetorical; distinguish
  those that are genuinely substantive from those that dissolve upon clarification
  of terms.


