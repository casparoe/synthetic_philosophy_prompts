  mechanism to regenerate or validate them. Biological memory survives sleep because
  consolidation is endogenous; the AI assistant, however, operates via stochastic
  algorithms running on remote servers, so the philosopher does not author the inferential
  steps—she merely selects among outputs generated by an independent causal process.
