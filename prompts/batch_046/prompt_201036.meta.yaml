  Mara opened by pressing the functional-parity intuition associated with Clark and
  Chalmers: if the assistant is always accessible, highly reliable, automatically
  consulted during deliberation, and its outputs are trusted without independent verification,
  then it plays exactly the same functional role as biological long-term memory or
  internal reasoning routines. She argued that denying it constitutive status merely
  because it sits outside the skull is an arbitrary internalist prejudice. Julian
  replied by invoking the coupling-constitution distinction—coupling is necessary
  but not sufficient for constitution. He granted the functional similarity but insisted
  that phenomenological transparency matters: the philosopher remains constantly aware
  that she is querying an external device, whereas biological memory retrieval typically
  lacks that explicit mediating awareness. Mara countered that transparency is a matter
  of degree, not kind, and that Clark’s later integrationist framework emphasizes
  trust, accessibility, and mutual adaptation rather than phenomenological invisibility.
  She added that internal retrieval is itself often mediated by conscious effort and
  reconstruction, so Julian’s transparency criterion fails to distinguish the cases
