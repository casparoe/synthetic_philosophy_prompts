  r_dz)) assumes purely additive genetic variance and zero gene-enviroment interaction,
  both of which are almost certainly violated for cognition.


  (c) i think the "heritability paradox" is real: if you equalize enviroments and
  shrink environmental variance, h² goes up. i take this as a feature — it means we''re
  seeing genetic differences more clearly once noise is removed — but i also think
  it shows that comparing heritability between rich and poor countries is like comparing
  variances of different distributions, technically valid but practically meaningless.


  (d) evolutionary-style debunking arguments don''t apply here because heritability
  is purely descriptive, but i still think high heritability should make us skeptical
  of "blank slate" social policies that treat enviroment as the only lever we have.
