  accessible subject of experience), and if so, does this dissociation show that "the
  unity of consciousness" is not a single phenomenon but a cluster of independently
  variable capacities? Existing philosophical answers leave this open because the
  standard debate—whether there are one or two streams of consciousness—treats unity
  as an all-or-nothing property and relies heavily on introspective reports that are
  methodologically questionable after callosal section. Neuroscience describes the
  mechanisms but does not operationalize unity in a way that distinguishes coupled
  dynamics from shared access. I propose to make progress by importing a distinction
  from distributed control theory—between coupled dynamics and shared access—to construct
  a taxonomy of unity-types, then applying it to the classic split-brain behavioral
  literature (without requiring new clinical data) and to analogous artificial distributed
  architectures. This approach is preferable to the obvious alternatives—pure metaphysical
  analysis of personal identity, or purely empirical neuroimaging reviews—because
  it generates determinate failure conditions: if the taxonomy collapses into a single
  dimension, or if split-brain behavior can be explained without invoking either form
  of unity, the project fails. A useful deliverable would be a conceptual framework
  that philosophers of mind and cognitive scientists can use to ask sharper questions
