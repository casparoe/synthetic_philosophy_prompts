  As a retired systems biologist who has recently turned to philosophy of mind, I
  am preparing a proposal for a six-month interdisciplinary fellowship to investigate
  split-brain cases. The precise question is: do commissurotomized patients exhibit
  a dissociation between functional unity (integrated sensorimotor behavior across
