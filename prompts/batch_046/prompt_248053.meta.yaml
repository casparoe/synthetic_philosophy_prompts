  with sets and subsets.


  The core idea I want them to grasp is not merely the paradox itself, but the School
  of Names thesis that identity conditions depend on descriptive completeness in a
  specific way—namely, that adding a qualitative determination (color) can alter the
  sortal criteria that govern whether something falls under a given name, not because
  color is essential to being a horse, but because the compound description introduces
  a new form (xing) that must be matched separately by the reality (shi). More precisely,
  I want them to understand the dialogue as pressing a gap between naming and pointing:
  a name can apply only where the full descriptive profile is satisfied, so that white
  horse and horse invoke different conditions of correct application.


  Please design the explanatory arc as a teaching plan, not as the explanation itself.
  Structure your response around the following components, in this order:


  1. Dependency sequence: List the conceptual components in the order they must be
  introduced, explaining for each what prior idea it requires and what it enables
  next. Begin with the distinction that must be secured before the dialogue is even
  presented, and end with the meta-point about names and realities. Be explicit about
  why reversing any adjacent pair would cause the audience to fall back on predicate-logic
