  to an audience trained in formal logic.


  3. Misconception map: List the predictable misconceptions or objections in the chronological
  order they will surface during the session. For each, indicate the precise point
  in the dependency sequence where it should be anticipated and neutralized. Include
  at least: (a) the immediate dismissal that this is a fallacy of equivocation resolvable
  by distinguishing use and mention; (b) the subset-relation interpretation that treats
  white horses as a proper subset of horses; (c) the interpretation that the argument
  is about linguistic convention or color perception rather than about form and reality;
  and (d) one misconception specific to logic-trained students, such as treating the
  argument as a quantifier-scope ambiguity. For each, briefly state the corrective
  move that absorbs it without derailing the arc.


  4. Check for understanding: Propose a brief diagnostic exercise or discussion prompt
  that reveals whether students have understood the argument''s structure—specifically,
  whether they can distinguish a valid inference about descriptive completeness from
  an invalid inference about essential properties—rather than merely repeating the
  paradox or expressing discomfort. The check should yield a clear signal of comprehension
  versus memorization.


