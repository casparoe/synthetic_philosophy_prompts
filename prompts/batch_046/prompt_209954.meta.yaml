  Essay draft text:


  The standard discussion of responsibility gaps for autonomous systems—particularly
  lethal autonomous weapons—begins with a scenario: a drone selects and engages a
  target using a classifier trained on distributed data, and the strike is erroneous.
  No programmer intended the specific classification; no commander ordered that particular
  engagement; the manufacturer could not have predicted the feature interaction. The
  result is a gap in responsibility: harm occurs, yet no human agent appears to be
  the proper subject of moral blame.


  This framing, however, runs together two failures that are conceptually distinct.
  The first is a causal gap. In ordinary action, a human agent''s decision is the
  proximate cause of harm, and we can trace a continuous chain of intentional agency.
  In the autonomous case, the proximate cause is an algorithmic process distributed
  across training data, model weights, sensor input, and environmental conditions.
  No single human choice occupies the causal role that would make that person the
  origin of the harm.


  The second failure is a normative-attribution gap. Even when we locate a human in
  the causal chain—say, a commander who authorized deployment, or an operator who
  confirmed the system''s recommendation—we may still lack the conditions to treat
  that person as the object of reactive attitudes. Attributability, on one plausible
  view, requires that an outcome reflect the agent''s practical identity: their values,
  commitments, or reasons in a way that makes blame or praise appropriate. But the
  loop-operator''s approval is often procedural rather than substantive; the decision
  is outsourced to a system whose reasoning is opaque and whose development involved
  thousands of actors. The operator''s practical identity is not expressed in the
  specific outcome. Thus we have causal presence without normative standing.


  Recognizing the separation matters for policy. Requiring a human-in-the-loop closes
  the causal gap—there is now a human decision point—but it does not automatically
  close the normative-attribution gap. The human may be present as a rubber stamp,
  structurally incapable of exercising the kind of judgment that would make them genuinely
  responsible. A policy that treats loop-presence as sufficient for moral accountability
  therefore risks a category mistake: it confuses being in the causal chain with being
  the kind of agent to whom blame can attach.


  Of course, one might reply that collective or institutional responsibility can fill
  the second gap without individual attributability. Or one might argue that deployment
  decisions are themselves expressions of practical identity—the commander''s choice
  to rely on automation reflects a judgment about acceptable risk. These responses
  deserve careful treatment. But the initial distinction stands: the responsibility
  problem for autonomous systems is not monolithic. It involves both a failure of
  causal authorship and a failure of normative fit, and solving the first does not
  guarantee solving the second.


