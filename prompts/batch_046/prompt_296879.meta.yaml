  1. The scalable-commitment revision of the cognitive-revolution thesis: this retains
  the view that shared intersubjective fictions enabled large-scale cooperation, but
  modifies it by treating these fictions not as neutral coordination mechanisms but
  as "scalable commitment devices" that structurally privilege hierarchical enforcement
  as group size increases.


  2. The path-dependent agro-ecological lock-in model: this accepts geographic contingency
  in the initial availability of domesticable species, but injects the claim that
  agricultural practices generate an irreversible "agro-ecological lock-in"—a self-reinforcing
  coupling between soil depletion patterns and social stratification that operates
  independently of the original geographic endowment.


  3. The seasonal-dual-governance equilibrium interpretation: this adopts the anti-evolutionary
  stance that rejects linear stages from egalitarianism to hierarchy, but further
  specifies that many prehistoric societies maintained a stable "seasonal dual governance"
  structure—alternating between dispersed egalitarian bands and centralized ritual
  aggregations—rather than representing an unstable transitional form.


  4. The moral-accounting-technology framework: this treats the storage and redistribution
  of surplus grain not primarily as an economic or ecological transition, but as the
  invention of a "moral accounting technology" that transforms reciprocal obligations
  into quantified, inheritable debts, thereby restructuring social relations before
  formal state institutions emerge.


