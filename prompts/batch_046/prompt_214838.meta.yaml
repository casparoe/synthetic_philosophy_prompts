  Question:

  "Consider a jurisdiction that enacts, through fully regular legislative procedures,
  a criminal sentencing statute that applies prospectively to all defendants convicted
  within specified categories. The statute is published in the official gazette and
  sets precise input-output rules: conviction class and prior record determine a sentence
  range. However, the computation is performed by a proprietary machine-learning model
  whose internal weights and feature interactions are opaque even to the judges who
  apply it. Defendants can learn their category and the resulting range, but they
  cannot understand, anticipate, or contest the specific reasoning that produces their
  particular sentence.


  A legal theorist claims that this arrangement violates Lon Fuller''s ''inner morality
  of law''—especially the requirements of clarity and congruence between declared
  rule and official action—because the law fails to guide conduct in the intelligible
  way that legality requires. The theorist supports this by appealing to Fuller''s
  well-known critique of the Nazi ''grudge informer'' statutes, arguing that both
  cases involve a breakdown of the transparency necessary for law to function as a
  system of rules rather than arbitrary power.


  A second theorist replies that H.L.A. Hart''s legal positivism defeats this objection.
  On this reply, Fuller''s eight desiderata are conditions of efficacy or ''principles
  of legality,'' not moral conditions; they describe what makes a rule-system work
  well, not what makes it law. Hart''s separation thesis therefore permits fully valid
  law that is procedurally opaque, provided it meets formal criteria of enactment
  and institutional pedigree. Moreover, Hart''s discussion of the ''minimum content
  of natural law'' concerns substantive protections for life and property, not procedural
  transparency, so it offers no support to the first theorist.


  Assess this exchange. Specifically: (a) Does Fuller''s critique of the grudge-informer
  laws genuinely extend to algorithmic opacity, or does it depend on features (such
  as retroactivity or secrecy of the rule itself) absent here? (b) How should Hart''s
  distinction between the separation thesis and the minimum content of natural law
  be brought to bear—does it successfully insulate formal validity from Fuller''s
  procedural concerns, or does it mislocate the point of the inner morality?"


