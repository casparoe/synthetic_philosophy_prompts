  in which cognition is just precision-weighted prediction-error minimization coupled
  with active-inference policies, there is no ontological room for states that are
  normatively entrenched in this specific way. So beliefs and desires should be eliminated,
  though belief-desire talk can survive as a macro-level heuristic for describing
  the dynamics of active inference.


