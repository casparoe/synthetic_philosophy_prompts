  the speaker''s intent to deceive, and the listener''s right to truth. Then think
  carefully and systematically through the judgments below.


  As a journalist writing for an ideas-and-science publication, I am investigating
  whether Augustine''s well-known absolute prohibition of lying can survive contact
  with modern moral psychology without collapsing into implausible rigidity. To that
  end, I have been tracking my own reflective judgments across a range of deception
  scenarios. Here is where I have landed.


  First, in the classic murderer-at-the-door case, I judge that it is morally wrong
  to utter a direct falsehood—saying the intended victim is not present—even though
  an innocent life is at stake; protection must come from silence, evasion, or physical
  means, not from corrupting one''s word.


  Second, when a dying patient asks whether her estranged son called and he did not,
  I judge it wrong to say he did; the comfort purchased by falsehood does not justify
  the lie, however merciful the intent.


  Third, I consider a physician who tells an anxious patient, "Your scan shows no
  abnormalities," when in fact there is an ambiguous shadow that is almost certainly
  benign but not yet confirmed; the physician intends to prevent panic and plans to
  disclose fully after further testing. Here my judgment wavers, but I lean toward
  thinking this false statement is permissible.


  Fourth, a diplomat uses language in which every clause is technically true, but
  arranges them so that each negotiating party interprets the agreement in incompatible,
