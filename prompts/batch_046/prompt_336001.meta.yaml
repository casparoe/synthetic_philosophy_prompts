  Two members of my study group, Mara and Jon, got into a sustained argument about
  the scope of Dutch book arguments after we discussed coherence constraints on credence.
  I want an adjudication of their exchange, move by move.


  Mara opened by saying that the classic Dutch book for probabilism is psychologically
  unrealistic: it requires that an agent be disposed to accept bets on every proposition
  at stakes exactly proportional to her credence, but real people have budget constraints,
  risk aversion, and refusal thresholds, so the argument proves nothing about actual
  rational belief.


  Jon replied that this misses the normative structure of the argument. The Dutch
  book does not depend on psychological betting dispositions; it demonstrates that
  if an agent''s credences violate the probability axioms, then there exists a combination
  of bets — defined in terms of her own valuation of outcomes — that she would accept
  and that collectively guarantee a net loss. The betting framework is just a representation
  of internal valuation commitments, not a claim about behavior.


  Mara conceded the point for synchronic coherence but raised a diachronic objection.
  She argued that the standard Dutch book for conditionalization assumes that after
  learning B, the agent will still honor bets placed before learning B on A-given-B
  at her prior conditional credence. But learning B might alter not only her beliefs
  but also her values, risk attitudes, or the utility she assigns to stakes. The "post-learning
  agent" is not necessarily bound by the commitments of the "pre-learning agent,"
  so the diachronic book collapses.


  Jon countered that this conflates belief revision with preference revision. If utility
  is held stable across the learning event, then updating by a rule other than Bayes''s
  rule (or an appropriate generalized conditioning rule) exposes the agent to a two-stage
  Dutch book: a bookie can construct a pre-learning bet on A-given-B using her stated
  conditional credence and a post-learning bet on A using her reported posterior,
  arranged so that she loses regardless of whether B occurs. Risk attitude is constant
  in both stages, so it cannot block the loss.


  Mara then said that Jon was smuggling in an unstated premise — the stability of
  utility across belief change — that the Dutch book argument does not itself justify.
  The synchronic argument needs only current valuations, she noted, whereas the diachronic
  version requires an independent argument that preferences should not shift when
  beliefs do. Without that independent justification, she claimed, the diachronic
  Dutch book overreaches: it shows at most that coherence is required at each time
  slice, not that beliefs must be updated by a specific rule across slices.


