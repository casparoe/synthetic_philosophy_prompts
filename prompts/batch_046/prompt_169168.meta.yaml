  After a long argument with a friend about whether hypocrisy is the only thing that
  can strip someone of standing to blame, I need to turn my own view into something
  I can actually run. I chair the grievance review board for a regional cooperative
  of independent design professionals; we meet monthly, have about ninety minutes
  per case, and must issue a binding written determination on whether a complaining
  member has standing to blame another member for a specific wrong. I need a reusable
  decision procedure—ordered questions, what counts as a sufficient answer, explicit
  stop points where the answer is no, and clear flags for where judgment cannot be
  eliminated and the decision must be made by a person rather than the checklist.


  Here is the framework I defended in the argument and want operationalized. Standing
  to blame in this institutional context requires three conditions, not just the standard
  hypocrisy check. First, the Non-Hypocrisy Condition: the blamer must not have committed,
  endorsed, or materially enabled the same wrong in a relevantly similar context within
  the cooperative''s recent operating history—roughly the past thirty-six months—unless
  they have made a documented, good-faith attempt at remedy. Second, the Non-Complicity
  Condition: the blamer must not occupy a structural position that systematically
  benefits from the institutional conditions that made the wrong probable, unless
  they have taken documented steps to alter those conditions; mere awareness is not
  enough. Third, the Relational Stake Condition: the blamer must possess a direct,
  non-transferable interest in the remedy—either they suffered the specific harm,
  they bear institutional responsibility for correcting it, or they are formally accountable
  to the harmed party—not merely a general moral interest in the cooperative''s integrity.
  My friend thinks only the first condition matters and that the second and third
  either collapse into it or are too vague to apply fairly.


  Write the procedure my board can follow: the sequence of tests, the evidence required
  for each, the point at which the procedure halts with a determination of no standing,
  the point at which it confirms standing, and the intermediate zones where the procedure
  hands the decision back to the board because the issue is one of values or interpretation
  rather than fact. Be explicit about which steps are mechanical and which are judgment
  calls dressed up as procedure. Then apply the procedure to three cases.


  Case One: A senior partner blames a junior partner for concealing a material conflict
  of interest in a client contract. The senior partner approved a structurally similar
  concealment under deadline pressure eighteen months ago but has since filed an internal
  disclosure amendment. The junior was directly harmed by the client''s reaction.


  Case Two: The cooperative''s elected compliance officer—who was not personally harmed—blames
  a peer for falsifying professional credentials. The officer sits on the committee
  that drafted the credential-verification rules but did not design the fee structure
  that incentivized rapid onboarding.


  Case Three: A member who was directly harmed by a billing fraud blames the perpetrator.
  The harmed member also serves on the finance committee that set the billing-rate
  schedules that created the financial pressure leading to the fraud, and she voted
  for those schedules, though she later proposed (unsuccessfully) to revise them.


  For each case, show how the procedure runs, state the determination, and—crucially—include
  at least one case where the procedure yields an answer I will not like because it
  protects the blamer''s standing despite my intuition that it should not, or denies
  it despite my sympathy. Finally, state clearly what this procedure cannot do: which
  kinds of grievance it should not be applied to, what it says nothing about, and
  where it is likely to misfire because of the simplifications required to make it
  usable in ninety minutes.


