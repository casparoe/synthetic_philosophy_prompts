  it presuppose that culpability is fixed at the moment of the offense and is therefore
  immune to later changes in the agent''s character or reasoning capacities — a view
  that sounds closer to a static, historical conception of blame? Or does it presuppose
  that harm, rather than agency, is the true metric of desert, since uncharged harmful
