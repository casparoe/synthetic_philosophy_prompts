  lacks language. Second, I think it is not wrong in the same way to swat a mosquito
  that is about to bite me, even if mosquitoes have some minimal sensory experience;
  but if we discovered that mosquitoes possess a kind of continuous, integrated subjective
  experience comparable to ours, my judgment might shift. Third, I think factory farming
  pigs is wrong primarily because of the suffering involved, yet I feel far less certain
  about whether it is wrong to farm insects for protein if they genuinely lack nociception
  and have no future-oriented preferences. Fourth, I think destroying an old-growth
  forest to build a luxury resort is wrong, but I think the wrongness here is largely
