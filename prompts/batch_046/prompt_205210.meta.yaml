  I''m delivering the opening remarks next Thursday for an interdisciplinary workshop
  I have organized, titled "The Dead on Screen: Ethics of Historical Dramatization."
  The audience is deliberately uneven: one half comprises philosophers of art, film
  scholars, and historians of representation who are accustomed to debating anachronism,
  narrative license, and the ethics of adaptation; the other half includes archivists,
  descendants of figures recently portrayed in prominent biopics, and one documentary
  filmmaker whose latest project reconstructs the private life of a largely forgotten
  nineteenth-century naturalist whose papers are incomplete. I do not want a generic
  welcome; I want the remarks to be shaped, from their opening sentence to their closing
  image, by a conceptual tension I have been trying to articulate—between what I call
  "archive fidelity," the duty to preserve the documented record against distortion,
  and "recognition fidelity," the question of whether the dramatized subject could
  still recognize herself in the portrait without being conscripted into meanings
  she never authorized for posterity.


  The speech should make clear that these two obligations can come sharply apart in
  cases where a filmmaker invents an intimate scene for which the archive offers only
  silence, yet the invention captures an emotional texture that the documented record
  suppresses—precisely the situation in the naturalist''s case. It must address both
  halves of the room without turning into a lecture: the experts should feel the conceptual
  work is serious and specific, while the non-philosophers, including the archivist-granddaughter
  present, should understand why accuracy alone may fail to discharge our debt to
  the dead. I am asking for remarks, not an essay—something that can be spoken in
  about eight minutes, that avoids citations or bibliographic gestures, and that lands
  on a note of narrative humility rather than on a verdict about the filmmaker''s
  guilt or innocence. The philosophical idea should do structural work, determining
  what can and cannot be said about our obligations to the real dead once we admit
  that dramatization is not merely misrepresentation but a form of posthumous co-authorship.


