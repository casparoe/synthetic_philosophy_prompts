  I''m preparing a discussion for a philosophy of language course, and I''m trying
  to work out whether Denis Villeneuve''s 2016 film Arrival—adapted from Ted Chiang''s
  short story "Story of Your Life"—can be read productively through George Orwell''s
  writings on the relationship between linguistic form and political thought, or whether
  the comparison ultimately breaks down in instructive ways. In Arrival, linguist
  Louise Banks learns the heptapod language and thereby acquires a non-linear perception
  of time, a transformation the film presents as deeply personal and ethically liberating:
  she chooses to embrace a future that includes her child''s death because the language
  has expanded, not restricted, her conceptual horizon. Orwell, by contrast, is best
  known for arguing that when language is corrupted—through euphemism, bureaucratic
  vagueness, or the deliberate reduction of vocabulary—political corruption follows,
  because people are rendered unable to formulate dissenting thoughts. I want to push
  past the obvious parallel and ask whether Orwell''s framework actually distinguishes
  between two different dangers: the kind of linguistic deception that hides reality
  behind cloudy abstractions, and the kind of structural simplification that makes
  complex thoughts literally unthinkable, as with Newspeak''s elimination of antonyms.
  If we apply both distinctions to Arrival, does Louise''s acquisition of heptapod
  B resemble an emancipatory expansion of cognitive capacity, or does it function
  like a benign version of Newspeak—rewiring her conceptual architecture so thoroughly
  that her "choice" to accept suffering is predetermined by the grammar she now inhabits?
  Does the film miss Orwell''s deeper worry that any deterministic link between linguistic
  structure and thought is politically dangerous precisely because it eliminates the
  gap between how things are described and how they could be questioned? And conversely,
  does Orwell''s focus on state-imposed language control cause him to overlook cases
  where linguistic transformation is voluntary, intimate, and not mediated by institutional
  power? I''d like a reading that treats both the film and Orwell with equal seriousness:
  where the comparison illuminates a scene—perhaps Louise''s decision to have a child
  despite knowing the outcome—where it forces us to say the film resists the philosophical
  frame, and ultimately what this pairing reveals about linguistic determinism that
  a purely theoretical argument about Sapir-Whorf misses.


