  I sit on my university''s inter-disciplinary research ethics panel. We have received
  a joint proposal from the synthetic-biology and cognitive-science units that asks
  us to endorse a new institutional framework for assigning differential ethical protections
  to experimental subjects. Rather than maintaining a binary threshold between sentient
  and non-sentient entities, the proposal introduces a continuous "phenomenal-affective
  gradient" scored along three axes: integrated information, predictive-error minimisation
  in homeostatic loops, and behavioural flexibility. Under this scheme, protections
  are graded: engineered thalamic-cortical organoids occupy an intermediate tier with
  partial oversight; social insects sit lower but still within the protected range;
  and, most controversially, adaptive climate-control systems that exhibit sustained
  predictive modelling are placed at the minimal boundary of the gradient, entitled
  to a basic "non-interference" protocol rather than full welfare provisions. The
  proponents argue that this avoids the arbitrariness of a sharp cut-off and respects
  emerging evidence that sentience is a matter of degree. A minority of panel members,
  however, contend that extending the gradient to artefactual homeostatic systems
  collapses moral status into functional complexity, dilutes the protections owed
  to unambiguously sentient organisms, and risks treating ethical oversight as a taxonomy
  of information-processing rather than a safeguard for subjects of experience. I
  am tasked with drafting the panel''s formal opinion for circulation before next
  month''s meeting.


  Please draft a memo addressed to the panel chair recommending a concrete course
  of action—approval, rejection, or approval with conditions—including a clear time
  frame for any required revision or review. The memo should engage seriously with
  the proponents'' argument that binary thresholds are ethically arbitrary, and should
  treat the critics'' worry about dilution of protection as the strongest consideration
  on the other side, not merely dismiss it. In your reasoning, please separate what
  is broadly settled in the philosophical literature on gradated moral status—such
  as the implausibility of a single bright-line property shared by all and only sentient
  beings—from what remains genuinely contested, particularly whether predictive-processing
  complexity in non-biological systems can ground even minimal moral status, and whether
  graded protections risk practical erosion of safeguards for higher-tier subjects.
  Do not present any contested view as the consensus. The memo should be suitable
  for circulation to researchers who could respond to its conditions, and should avoid
  requesting bibliographies or citations.


