  function of narrative life-writing. Build the tree from logical space rather than
  from a list of authorities: begin with the question of whether moral learning from
  biography requires a unified, teleologically organized narrative of the subject''s
  life, or whether fragmentary, episodic presentation can be equally or more instructive.
  From there, branch on whether the appropriate reader-response is imitative identification,
  counter-identificatory correction, or conceptual abstraction detached from the subject''s
  particularity. Then branch on whether idealization and selective omission—hagiographic
  smoothing—corrupt the pedagogical value by presenting an unattainable model, or
  whether such smoothing is a necessary condition of aspiration and normative orientation.
  Each internal node should be phrased as a concrete claim a student could assess
  without knowing which interpretation it maps onto; no question should ask directly
  ''do you hold the Plutarchan view?'' The six required leaves are: (1) the comparative-mirror
  view, in which biography teaches by juxtaposing paired lives to reveal the contingency
  of virtue; (2) the aspirational-hagiographic view, in which idealized narrative
  provides a regulative ideal for character formation; (3) the diagnostic-critical
  view, in which demystified, failure-laden biography teaches through anatomical self-correction;
