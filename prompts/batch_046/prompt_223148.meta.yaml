  and perceiver—a contract that governs how deviations are distributed across an entire
  alphabet. Argue that once we accept that letter recognition operates through fluid
  analogies to an underlying "letter spirit" rather than through rigid template matching,
  we are committed to the view that there is no intrinsic essence of ''a''-ness independent
  of the alphabet''s overall stylistic coherence.


  To make your case concrete, introduce and analyze the hypothetical case of a "negative-material
  alphabet": imagine letters formed not by positive marks but by systematic absences—holes
  in woven fabric, gaps in dense foliage, or voids in a textured surface—where every
  local geometric cue (stroke thickness, curvature direction, enclosed area) is either
  inverted or missing, yet the relational proportions and stylistic regularities among
  the letterforms remain perfectly intact. Show that if such an alphabet is still
  readable as the same alphabet (just rendered in negative space), then the essence
  of each letter must lie in the relational structure of the whole system, not in
  any local feature of the individual glyph.


