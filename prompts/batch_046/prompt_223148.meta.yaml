  derivative representations of "real" positive letters, or that recognizability depends
  on a hidden mental template that survives the inversion. Explain why these objections
  fail if we take the Letter Spirit model seriously, and clarify whether your argument
  eliminates all intrinsic properties or merely relocates them to the level of systemic
  relations.


  Be precise, avoid unnecessary jargon where possible, and do not provide bibliographies,
  reading lists, or citations.


