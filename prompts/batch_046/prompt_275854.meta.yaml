  I''ve been developing an audit taxonomy for outputs from high-capability language
  models, drawing on Douglas Hofstadter''s distinction among frame messages, outer
  messages, and inner messages—roughly, the contextual framing that instructs interpretation,
  the explicit propositional content, and the deeper organizational intent that structures
  the message as a whole. In my protocol, I classify the system prompt and formatting
  constraints as the frame; the direct answer to the user as the outer message; and
  persistent structural regularities—such as a model''s tendency to embed ethical
  judgments inside probabilistic, multi-factorial scaffolding regardless of domain—as
  the inner message revealing its operational priorities. A colleague objected that
  this taxonomy collapses for artificial systems: because an LLM lacks a unified intentional
  mind, there is no meaningful separation between frame and inner message; the prompt
  architecture and the statistical patterns in the output are both just parts of the
  same engineered frame, and treating recurring reasoning signatures as an inner message
  illegitimately anthropomorphizes a distributed sampling process. I think she''s
  too quick to dismiss the functional analogy—after all, the framework concerns how
  meaning is organized, not whether it issues from a Cartesian ego—but I also worry
  that I''m smuggling in an assumption about single authorship that Hofstadter''s
  account may implicitly require. Given that the model''s behavior is jointly determined
  by training distribution, prompt design, and stochastic sampling, does my three-layer
  distinction track a real structural feature of the message, or does it impose a
  false ontology that conflates engineered framing with emergent organizational form?


