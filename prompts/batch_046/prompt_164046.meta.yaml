  I''m preparing a paper on Bernard Williams''s integrity objection and find myself
  caught in an argument that seems to generalise the objection far beyond utilitarianism.
  Williams worries that utilitarianism demands one thought too many: if I rescue my
  spouse from drowning, the thought that she is my spouse should be enough, yet utilitarianism
  requires me also to weigh overall welfare, which feels like an alien intrusion into
  my ground project. I tried to formalise this, and the result looks suspicious.


  (1) If a moral theory T requires an agent to justify an action by appealing to a
  reason that is not part of the agent''s ground project, then T demands one thought
  too many of that agent.


  (2) Every moral theory except pure egoism or project-absolutism requires agents,
  in at least some circumstances, to justify actions by appealing to reasons outside
  their ground projects — whether impartial utility, duty, virtue, or rights.


  (3) Therefore, every moral theory except pure egoism demands one thought too many
  in those circumstances.


  (4) But Williams clearly does not intend to defend pure egoism; he allows that ground
  projects can be overridden in extreme cases, and he treats integrity as a virtue
  within morality, not as a licence to ignore all moral demands.


  (5) So if (1)-(3) are correct, Williams''s own position must either collapse into
  egoism or admit that it too demands one thought too many whenever it permits moral
  override.


  (6) Yet it is plainly false that adopting any moral stance necessarily corrupts
  one''s integrity; people act from duty or compassion without feeling alienated from
  themselves.


