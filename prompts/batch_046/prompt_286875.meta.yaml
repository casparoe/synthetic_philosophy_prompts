  Here is an argument I constructed for a philosophy seminar, and I now suspect it
  proves too much, but I cannot locate the precise misstep. The argument concerns
  Bernard Williams''s integrity objection — specifically, his claim that utilitarianism
  can require an agent to have one thought too many when deciding whether to save
  her spouse.


  (1) Williams''s core claim is that there is a distinctive wrongness in being required
  to justify an action that flows directly from one''s ground project by appealing
  to an impersonal calculus; the agent should save her spouse because she is her spouse,
  not because the utility is maximized.


  (2) But notice that this objection depends on a distinction between reasoning that
  is internal to the ground project and reasoning that is external to it.


  (3) Now consider a case where an agent''s ground project is itself morally questionable
  — for instance, a project of artistic creation that requires the exploitation of
  others. If she reflects on whether her project is worthy and decides to abandon
  or modify it, she is engaging in reasoning that is, by Williams''s own lights, external
  to the immediate pursuit of the project.


  (4) Therefore, if Williams permits such reflective evaluation — and he clearly must,
  or he could not distinguish legitimate ground projects from illegitimate ones —
  then he already allows the kind of "stepping back" that he condemns in the utilitarian
  case.


  (5) The only consistent position is either to forbid all reflective evaluation of
  ground projects, which would make integrity compatible with monstrous commitments,
  or to allow it, in which case the boundary between permissible reflection and the
  "one thought too many" collapses.


  (6) So Williams''s objection either applies to all moral self-evaluation, including
  his own, or it applies to none, leaving utilitarianism untouched.


  (7) Therefore, the integrity objection fails to isolate utilitarianism; it is either
  self-defeating or toothless.


