  I am trying to determine my own stance on judgment aggregation in settings that
  resemble the discursive dilemma but carry additional structural complications. I
  want to know whether there is a coherent principle behind my intuitions, or whether
  I must abandon some of them.


  Here are my verdicts.


  Case 1. A five-member panel must decide whether to classify a compound as a regulated
  toxin (C). The decision rule is that C follows if and only if the compound causes
  cellular damage at 10 ppm (P) and the regulatory definition covers cellular damage
  (Q). The vote totals are: P receives three yeses and two nos; Q receives three yeses
  and two nos; C receives two yeses and three nos. My verdict: the group should aggregate
  premises and accept C. The three members who reject C appear to be importing an
  unstated dosage exception that is not part of the agreed premises; since P and Q
  command separate majorities, the logical entailment should govern the group judgment.


  Case 2. The vote pattern is identical—three yeses on P, three on Q, two on C—but
  the content differs. P concerns whether an ambiguous 1890 contract clause mentions
  "all goods"; Q concerns whether, in the commercial context of 1890, "goods" included
  intangible rights. Again, three members accept both premises but reject the conclusion
  that the clause covers intangibles. My verdict: here I prefer conclusion-based aggregation;
  the contract should be read as excluding intangibles. Although the majorities for
  P and Q look the same, the members endorsing them are applying incompatible interpretive
  frameworks—one textualist, one purposivist—so their agreement on the premises is
  superficial. Only the direct judgments on C are rendered within a shared legal framework,
  making them the appropriate object of aggregation.


  Case 3. A subcommittee of three evaluates whether a statistical prediction is valid
  (U), based on premises R (the raw data are reliable) and S (the model is well specified).
  The subcommittee splits: R and S each have two yeses and one no, but U receives
  only one yes and two nos. The full committee of five then votes only on whether
  to adopt a policy that requires U (V), and on U itself passed up from the subcommittee.
  My verdict: the subcommittee should resolve its internal dilemma via premise aggregation
  before transmitting any judgment upward; if it fails to do so, the full committee
  should treat U as unsettled and should not aggregate U with V to reach a decision
  on policy. Passing an unresolved conclusion up the hierarchy corrupts the parent
  aggregation.


  Case 4. Five experts assess whether a claim is established (C). There are two independent
  argumentative chains: chain A supports C via premises P1 and P2; chain B supports
  C via premises Q1 and Q2. The support is disjoint: P1 and P2 each have three supporters,
  but only members {1,2,3} support P1 and only {3,4,5} support P2, so only member
  3 endorses both. Similarly for the Q-chain. The direct vote on C receives only two
  yeses. My verdict: we should not aggregate the premises chain-by-chain and then
  combine them; there is no joint majority for either full chain, and the separate
  majorities for individual premises do not license the conclusion. Premise aggregation
  must require joint endorsement of the premises within a single argument chain.


  Case 5. All five members of a medical-ethics board agree on P (the patient has decision-making
  capacity) and Q (the proposed treatment is medically effective). Nevertheless, three
  reject C (the patient should receive the treatment) because they implicitly rely
  on an unstated moral premise about the weight of autonomy in this particular clinical
  context, a premise that the other two members reject. I keep going back and forth:
  sometimes it seems that premise aggregation should force acceptance of C, since
  everyone agrees on the explicit premises; other times it seems that the split on
  C reveals that P and Q are jointly insufficient, and the group should acknowledge
  the hidden disagreement rather than mechanically deriving C.


  Case 6. A three-person committee votes on whether to endorse a philosophical thesis
  (C), supported by premises A (the argument is formally valid) and B (all premises
  of the argument are true). The results: A receives three yeses; B receives two yeses
  and one no; C receives two yeses and one no. Here there is no discursive dilemma—A
  is unanimous, B and C share the same split. My verdict: this is unproblematic; the
  group should accept A and B by premise aggregation (giving B a bare majority) and
  therefore accept C, unless there is reason to think the dissent on B and C stems
  from a shared hidden concern. I do not see such a reason here, so conclusion and
  premise aggregation align.


  Now, two further situations I have not decided on.


  Situation X: A nested committee like Case 3, but this time the subcommittee resolves
  its dilemma via premise aggregation and transmits U as "yes." The parent committee
  then votes on U and on V (adopt policy if U), with U receiving four yeses and V
  receiving three nos. Should the parent committee aggregate U and V by premises,
  or should it treat U as an input judgment that can be overridden?


  Situation Y: A single committee of seven votes on three premises—P, Q, and R—where
  C follows only from P and Q together, and an alternative conclusion D follows only
  from R alone. The majorities are: P yes (4), Q yes (4), R yes (4), C yes (3), D
  yes (4). Here there are separate majorities for all premises, but C lacks a majority
  while D has one, even though C is logically supported by a subset of premises with
  majorities. What should the group conclude?


  My question: Is there one precise principle—perhaps with conditions about framework
  homogeneity, joint endorsement, hierarchical transmission, and hidden-premise transparency—that
  captures Cases 1 through 4 and 6, and that gives a determinate answer in Cases 5,
  X, and Y? Or must I drop at least one of my verdicts? Please state the principle
  exactly, indicate which clause is motivated by which case, predict the outcomes
  for X and Y, and tell me honestly whether Case 5 has to be overturned or can be
  accommodated. If you propose more than one candidate principle, say which verdict
  each one sacrifices.


