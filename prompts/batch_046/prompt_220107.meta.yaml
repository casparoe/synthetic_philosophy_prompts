additional_instructions:
  length: Keep the prompt relatively short and focused on the important issues. It
    may still be a few sentences long. Also, note that the type depends on the type
    you pick above. If you're type of prompt is asking for comments on an essay, it'll
    have to be somewhat long because you have to give the essay or at least notes
    for the essay.
  writing_style: The prompt should be written quite casually. It may contain a typo
    or two.
  epistemic_request: Have the asker request that the response separate what is settled
    from what is genuinely contested among people who know the topic, and not present
    a contested view as the consensus.
  output_format: Have the asker request that the final answer be stated in a fixed,
    machine-readable form at the very end, e.g. \answer{...} enclosing a number, a
    label, or a short phrase, or a last line beginning "Verdict:". This suits types
    whose response has a definite answer to extract (a verdict, a number, a ranking,
    a grade, a name); if yours has none, ask instead for a one-sentence summary as
    the last line.
