  the same idea—branching and cyclical time are both ways of saying that no event
  truly follows another. He also borrowed from J. W. Dunne''s "An Experiment with
  Time" the notion of serial consciousness, but stripped away Dunne''s empirical claim
  about dreams, leaving only the metaphysical point that causality is a fiction we
  impose on a static, spatialized reality. For Borges, this means narrative plot itself
  is a kind of false consciousness: cause and effect are just the order in which we
  read symbols arranged on a page, not a feature of the world.''


