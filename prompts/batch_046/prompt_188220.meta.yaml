  For a graduate seminar on the philosophy of science, set out the desiderata that
  any adequate philosophical theory of simultaneous scientific discovery must satisfy
  if it is to explain both the Newton–Leibniz calculus case and the Darwin–Wallace
  evolutionary case, and to adjudicate whether such discoveries are historically inevitable
  and whether priority of attribution carries any philosophical weight. Your specification
  should address what phenomena the theory must explain, which distinctions it must
  respect, and which results or no-go considerations it must accommodate, with the
  reasoning behind each requirement and an indication of whether it is non-negotiable
  or merely a preference of a particular camp.


  Specifically, include the following considerations, though you should organise them
  according to your own judgement of logical priority:


  1. The theory must distinguish genuine cognitive independence from cryptic influence
  mediated by unpublished correspondence, shared intermediaries, or institutional
  proximity, and it must supply a clear criterion for what counts as "independence"
  in contexts where informal intellectual networks existed but formal publication
  did not.


  2. It must account for structural equivalence of results—such as the mathematical
  inter-translatability of Newton''s fluxions and Leibniz''s differential notation—without
  collapsing this equivalence into mere notational variance, since the underlying
  conceptual framing and metaphysical commitments differ significantly.


  3. It must accommodate cases of "asymmetric convergence," in which one party produces
  a more general formal apparatus but the other supplies the more persuasive empirical
  justification or metaphysical interpretation, and it must explain whether such asymmetry
  undermines claims of pure simultaneity or merely complicates them.


  4. It must be consistent with the historical fact that a scientific community''s
  subsequent adoption patterns—for instance, the continental preference for Leibnizian
  notation versus British adherence to Newtonian methods—often diverge from the chronological
  order of discovery, and it must say whether these sociological patterns are philosophically
  relevant to the identity of the discovery itself.


  5. It must provide a principled answer to the inevitability question: if two researchers
  arrive at identical theoretical structures through genuinely independent reasoning,
  would the absence of one have left a permanent gap in science? Specify what kind
  of modal or counterfactual reasoning is legitimate here and whether inevitability
  is a claim about logical structure, institutional readiness, or both.


  6. It must address whether priority disputes possess intrinsic philosophical significance—beyond
  being mere institutional artefacts—particularly in light of the fact that both calculus
  and evolutionary theory were eventually accepted and integrated regardless of attribution.


  Crucially, examine whether any subset of these desiderata is jointly unsatisfiable.
  For example, does requiring both strict cognitive independence and strong historical
  inevitability force an implausible view of scientific development in which discovery
  is simultaneously contingent upon individual agency and determined by structural
  conditions?


  In addition, your list must incorporate and evaluate a further, less standard desideratum:
  that the theory must explain "epistemic redundancy." This is the phenomenon in which
  simultaneous discoverers not only reach the same conclusion but reproduce structurally
  isomorphic patterns of preliminary error, correction, and heuristic adjustment in
