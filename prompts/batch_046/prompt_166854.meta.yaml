  a policy analyst without philosophical training can apply repeatedly.


  The audit must preserve three distinctions that survive simplification: (1) descriptive
  claims about states of affairs versus prescriptive claims about what should be done;
  (2) implicit bridge principles that license inference from the former to the latter
  versus explicit normative premises; and (3) definitional reductions of value terms
