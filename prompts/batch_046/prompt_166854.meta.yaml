  You serve as the senior ethics-review officer for a regulatory agency that issues
  binding guidance documents blending scientific findings with normative recommendations.
  Your staff must evaluate drafts in thirty minutes without consulting external philosophy
  literature, and any audit result requires your signature. Translate the conceptual
  machinery behind the is-ought gap and the naturalistic fallacy into a reusable "Derivation
