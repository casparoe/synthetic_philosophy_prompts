  Prompt draft:


  I''m tracking the rulings of an interdisciplinary review board—the Historical Substrate
  Panel at the Institute for Narrative Archaeology—which certifies whether a narrative
  belongs to the category "historically anchored tradition" (HAT) or remains "legendary
  construct" (LC). They have published three rulings I can access.


  First, on the Trojan War narrative: they granted HAT status. Their reasoning emphasized
  that Late Bronze Age destruction layers at Hisarlik and Hittite diplomatic references
  to Wilusa and Ahhiyawa allow a core conflict to be separated from Homeric mythologization,
  even though the narrative contains supernatural elements.


  Second, on the King Arthur cycle: they denied HAT status. They noted the absence
  of any 6th-century British attestation, the anachronistic chivalric overlay present
  in all extant sources, and the lack of an identifiable archaeological locus for
  a unifying political center.


  Third, on the Exodus narrative: they granted HAT status. They acknowledged the absence
  of direct archaeological trace in the Sinai for the proposed population scale and
  timeline, but pointed to early textual stratification (independent J, E, and P traditions)
  and to continuous communal transmission that treats the narrative as a founding
  historical event rather than a symbolic charter myth.


  Next month the panel will consider a new case: the so-called "Iron Bridge" narrative
  of an 8th-century Scandinavian-Baltic trading settlement, preserved in an 11th-century
  chronicle and in a single 9th-century runic commemorative fragment. The story claims
  that a foreign queen commissioned a bridge built with iron nails, an engineering
  detail that correlates with a recently excavated 8th-century timber-and-iron structure
  in the estuary. Yet the narrative is embedded in a charter myth for a later merchant
  guild, contains metallurgical anachronisms, and is absent from all contemporary
  administrative records. The runic fragment appears commemorative rather than annalistic.


  Please structure your answer as follows:


  1. The closest analog (roughly 150 words): identify which of the three prior rulings
  is the nearest parallel and why.


  2. Competing rules (roughly 250 words): lay out at least two distinct principles
  that are each jointly consistent with the board''s three verdicts. Name them precisely—for
  instance, a stratified-source principle, an institutional-memory principle, an archaeological-corroboration
  principle, or another—without attributing them to named theorists unless verified.


  3. Divergent predictions (roughly 200 words): for each principle you identified,
  state whether the Iron Bridge narrative should be HAT or LC, explaining which features
  of the case drive the result.


  4. Best recommendation (roughly 200 words): give the verdict that best coheres with
  the panel''s own precedents, identify the principle it commits them to, and state
  honestly what they would be adopting either way. Note the closest analog that supports
  your recommendation.


  5. The tie-breaker case (roughly 100 words): specify one further hypothetical or
  real case—different in structure from the Iron Bridge—that would clearly distinguish
  the two leading principles you identified.


  Please do not include bibliographies, reading lists, or citations to specific scholars
  or works. Write for a model that cannot search the web.


