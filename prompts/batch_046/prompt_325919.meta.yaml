  the safety flag referred to an outdated protocol, and the priority weighting reflected
  a generic departmental ranking—yet their combination triggered a veto that caused
  the researcher to miss a grant milestone and suffer substantial professional harm.
  The vendor maintains that responsibility lies with the university for configuring
  the interaction weights; the administration insists that each module was independently
  certified and therefore safe; and the department chair, who merely activated the
  system according to procurement guidelines, argues that she could not have anticipated
  an emergent outcome that none of the component audits predicted. The injured party
  is seeking institutional redress, but every actor can point to a different node
  in the architecture as the proper locus of fault, leaving our board uncertain whether
  blame should be distributed, concentrated, or reconceptualized altogether.


  I am concerned that our usual frameworks for assigning moral responsibility—those
  that trace harm back to a discrete intentional agent—may be inadequate here, not
  because anyone acted maliciously, but because the decision emerged from a structure
