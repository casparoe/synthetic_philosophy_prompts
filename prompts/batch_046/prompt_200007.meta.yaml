  "Kant holds that animals lack rational nature and therefore lack direct moral status.
  In the Groundwork of the Metaphysics of Morals, he develops the indirect-duty thesis:
  we ought not to be cruel to animals, not because they are wronged, but because cruelty
  hardens our disposition and makes us more likely to fail in our direct duties to
  human beings, who are ends in themselves and possess dignity rather than a mere
  price. This fits his broader view that only autonomous beings can legislate moral
  law for themselves.


  Regarding the gradation objection, one might think that if rational nature comes
  in degrees—some animals display instrumental reasoning—then moral status should
  also be scalar. Kant can reply that the rational nature relevant to morality is
  not a cognitive capacity distributed across a spectrum, but the specific capacity
  for autonomous self-legislation according to the Categorical Imperative. This capacity
  is binary: either a being can legislate for itself, or it cannot. Hence animals
  fall entirely outside direct consideration, regardless of empirical differences
  in intelligence.


  There is, however, a deeper tension. Kant''s treatment of sympathy suggests he recognises
  it as playing a foundational role in moral concern, much as Hume argued, though
  he ultimately subordinates it to rational principle. If sympathy genuinely tracks
  suffering irrespective of species, then suppressing it towards animals might damage
  our moral sensibility in ways that exceed the indirect-duty argument. Moreover,
  maintaining a strict binary risks treating moral worth as measurable—since any graded
  approach to animals would seem to commodify dignity—so the Kantian must insist that
  dignity is incomparable and cannot be partially extended. This does not collapse
  into a contractualist framework, where obligations depend on reciprocal cooperation,
  but it does require us to separate empirical cognitive gradation sharply from normative
  moral status. Overall, the indirect-duty view is coherent, though it demands that
  we keep emotional responsiveness and rational principle in careful balance."


