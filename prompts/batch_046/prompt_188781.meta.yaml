  My central claim is that Weber''s framework implicitly requires a third category—what
  I call value-causation—in which a normative structure does not merely motivate individual
  action but constrains the causal pathways through which material interests can be
  realized. On this reading, the "ascetic Protestant" ethic is not just one psychological
  motive among others competing with economic interest; it is a selective filter that
  determines which forms of capital accumulation are culturally viable and which are
  blocked, thereby altering the causal topology of early modern economic development.


  To make this concrete, I draw a parallel—not an identity—between Weber''s Calvinist
  entrepreneur and what I term "secular ascetic capital" in contemporary effective
  altruism: a normative framework that directs surplus accumulation into specific
  long-term philanthropic instruments rather than consumption or display. The parallel
  is meant to be provocative rather than historical; its purpose is to ask whether,
  if such a framework genuinely reshapes the causal trajectories of wealth, we should
  treat values as structural causes rather than as epiphenomenal rationalizations.


  The essay then considers three objections. First, that this collapses Weber''s careful
  separation of causal explanation and value judgment. Second, that "value-causation"
  is merely overdetermination described in normative language. Third, that the modern
  parallel fails because effective altruism lacks the theological anxiety that Weber
  identifies as the engine of ascetic accumulation.


