  affective states—joy, aesthetic rapture, the satisfaction of discovery—are at best
  instrumentally valuable in that they tend to reduce mental turbulence, but they
  add no constitutive value to a life. A granted that this is revisionary relative
  to ordinary intuition, but insisted that it is coherent and avoids the ''hedonic
