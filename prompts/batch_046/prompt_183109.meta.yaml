  The frame problem is usually introduced as a problem of representational economy:
  after an agent performs an action, how does it revise its beliefs about the world
  without having to check, for every belief it holds, whether that belief remains
  true? Classic responses invoke frame axioms, non-monotonic inference rules, or relevance-logic
