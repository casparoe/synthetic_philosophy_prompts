  it must determine which features of the current situation are relevant to the action
  just performed. This is not a matter of deriving logical consequences but of directing
  cognitive resources. To make this explicit, I distinguish two kinds of frames. A
  structural frame is a representational schema that encodes the constraints and relations
  within a particular domain (for example, the physical rules governing object persistence).
  An attentional frame is a dynamic mechanism—whether implemented as a neural gating
  process, a heuristic priority queue, or a learned policy—that determines which structural
  frames are activated and which are suppressed in a given context.


  On this view, the traditional frame problem concerns structural frames: given an
  activated schema, how do we represent change without exhaustive update? But there
  is a deeper, prior difficulty concerning attentional frames: when an agent encounters
  a situation that does not match any familiar schema, how does it construct or select
  the appropriate structural frame in the first place? Solving the logical problem—designing
  efficient belief-revision rules—therefore does not solve the cognitive problem of
  attentional allocation. If this distinction holds, then much of the philosophical
  debate about whether non-monotonic logic "solves" the frame problem may be addressing
  a symptom rather than the underlying condition.


