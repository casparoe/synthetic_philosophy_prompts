  Content:

  Question: Does Aquinas''s account of licit resistance to tyranny in De Regno and
  the Summa contain an implicit distinction between individual moral judgment and
  collective political judgment, such that the conditions he lists are not merely
  practical safeguards but conceptual prerequisites for the act to count as public
  authority rather than private violence? More precisely: is the prohibition on private
  initiative (that one must appeal to authority first) not just a procedural step
  but a constitutive feature of what makes the subsequent killing an act of the political
  community?


  Why open: Existing scholarship tends to read the conditions as a moral checklist—tyrant
  by usurpation or exercise, common good violated, no superior authority available,
  private action only if public authority fails. But this treats the conditions as
  independent constraints. What''s missing is whether they form a unified theory:
  the tyrant''s failure must be recognizable not just to the individual but to the
  community''s shared practical reason, and the absence of a superior authority must
  mean that the community itself becomes the locus of authority. Without this, we
  can''t explain why Aquinas allows resistance in some cases of usurpation but not
  in others.


  Approach: Rather than historical comparison or textual archaeology, I will do conceptual
  reconstruction. Month 1-2: map the conditions in both texts without assuming they
  are identical. Month 3: compare with Aquinas''s broader account of practical reason,
  authority, and the common good in the Summa''s treatise on law and justice. Month
  4: construct the "distributed judgment" interpretation and test it against hard
  cases (e.g., a tyrant who is technically legitimate but exercises power for private
  good, where a magistrate exists but is corrupt). Month 5: draft the argument; Month
  6: write deliverable and identify failure conditions.


