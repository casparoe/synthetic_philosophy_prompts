  perturbing or removing an intermediate logical step actually changes the model''s
  final output, or that the model cannot reach the correct answer via a direct pattern-matching
  shortcut that bypasses the displayed reasoning entirely. In other words, we treat
  structurally correct intermediate text as sufficient evidence that the reasoning
  process caused the result, without testing whether the text is causally efficacious
  or merely epiphenomenal formatting.


