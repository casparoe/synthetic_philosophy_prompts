  invariant across the relevant historical counterfactuals—whereas event-level explanations
  depend on interventions that leave those background conditions intact. If this is
  right, then debates about whether geography or institutions explain, say, the divergence
  of Mediterranean and Atlantic commercial networks in the sixteenth and seventeenth
  centuries are not competing on empirical ground alone, but on different implicit
  models of what counts as a permissible counterfactual.


