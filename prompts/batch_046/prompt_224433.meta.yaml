  complicates the philosophy—for instance, by making the Court''s power seem metaphysical
  rather than merely social, or by showing K.''s neighbors and lawyers as complicit
  in the legitimization. End by identifying what this particular pairing of Kafka
  and Pascal reveals about the relationship between procedural opacity and political
  legitimacy that a purely abstract argument about justice and force tends to miss.


