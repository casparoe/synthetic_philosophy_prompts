  Notes for the essay:


  Title idea: "The Unprovable Bug: Gödel, Legacy Code, and the Limits of Verification"


  Main argument: Gödel''s first and second incompleteness theorems are often invoked
  outside mathematics—sometimes carelessly—to claim that human minds transcend algorithms,
  or that physics must be incomplete. I want to avoid these overreaches. Instead,
  I want to apply the theorems more narrowly to formal verification in software engineering,
  specifically to legacy systems that lack complete specifications.


  The analogy runs as follows. A formal verification framework for a codebase is like
  a formal system: it has axioms (the specification), inference rules (the proof logic),
  and theorems (verified properties). Gödel''s first theorem tells us that if the
  system is sufficiently powerful and consistent, there exist true statements about
  the code—say, "this module never leaks memory under all inputs"—that cannot be derived
  within the framework. In practice, this means there will always be security or correctness
  properties that are true but unprovable by our automated tools alone.


  The second theorem adds a further twist: the framework cannot prove its own consistency
  without stepping outside itself. In engineering terms, a verification suite cannot
  certify its own soundness; we must rely on an external audit, a different formalism,
  or human review. I suggest this creates a kind of "epistemic regress" in large-scale
  engineering: every meta-verification introduces its own unverified assumptions.


  I then propose a specific, somewhat niche framing: in continuous integration pipelines
  for legacy monoliths, teams often attempt to build a "master verification layer"
  that integrates unit tests, static analysis, and formal proofs. I argue this layer
  is necessarily Gödel-incomplete relative to the actual behaviour of the system.
  The true bugs—those that depend on emergent interactions not captured in any specification—lie
  in the "Gödelian gap". Human code review and runtime monitoring therefore do not
  merely supplement automation; they function as an external oracle, analogous to
  the meta-system Gödel describes.


  Finally, I want to address what the theorems do not show. They do not imply that
  all knowledge is incomplete, that artificial intelligence is impossible, or that
  software can never be trusted. They apply specifically to formal systems with certain
  properties—recursive axiomatisability, sufficient arithmetic expressiveness—which
  many practical engineering frameworks deliberately weaken or avoid. The lesson,
  I think, is not despair but humility: we should expect verification to be asymptotic,
  not absolute.


