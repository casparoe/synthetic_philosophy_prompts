  2. A literary passage relying on sustained irony, where every sentence is translated
  with lexical accuracy but the cumulative tone becomes earnest—run the protocol and
  show where it detects the failure or where it risks false approval.

  3. A technically perfect, fluent translation of a short poem in which every image
