  be the case where the protocol gives an answer you think I will dislike (likely
  approve or weak revise), and you must say exactly which judgment call is being masked
  as procedural success and what the protocol cannot do about it.


  Conclude with an explicit statement of the protocol''s limits: what kinds of failure
  it will miss, what false positives it will generate, and under what conditions it
  should be overridden regardless of its output."


