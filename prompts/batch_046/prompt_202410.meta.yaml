  coherence) or merely shallow statistical pattern-matching of the kind Hofstadter
  argues is characteristic of statistical translation systems. The protocol must be
  usable by reviewers with domain expertise but no PhD in linguistics or philosophy;
  it must yield a signed recommendation (approve, revise, or reject) with an audit
  trail; and it must explicitly flag every point where the decision remains an irreducible
  judgment call rather than a checkable fact.


  Please construct the procedure as an ordered set of tests or checkpoints—something
  closer to a decision flowchart in prose than a vague rubric—specifying for each
  step what counts as passing, what counts as failing, and where the procedure halts
  with a definitive answer versus where it hands off to human judgment. The hard cases
  it must handle include: syntactic ambiguities in legal language that happen to be
  resolved correctly by frequency bias rather than by grasping the contractual logic;
