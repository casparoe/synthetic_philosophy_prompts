  I am a high school senior invited to present at my university''s undergraduate philosophy
  of history colloquium next Thursday, and I need rigorous Q&A preparation. My paper
  defends a position I call "archival friction": I accept that Ranke''s ideal of representing
  the past exactly as it occurred is metaphysically impossible, but I reject both
  Carr''s claim that present concerns necessarily dominate every historical narrative
  and Hayden White''s argument that tropological structures deterministically shape
  all historiography. Instead, I propose that clusters of independent primary sources—bureaucratic
  records, private letters, and material artifacts—can generate structural resistance
  to arbitrary narrative framing when they converge only under severe interpretive
  strain; this resistance, which I term documentary friction, constrains plausible
  emplotment without requiring direct epistemic access to past events themselves.
  You should approach this as an expert philosopher of history combined with a professional
  debate coach: please think carefully, begin with a brief brainstorming session on
  the intellectual commitments of my audience, and then construct the prep sheet.


  The audience will be about fifteen junior and senior history majors who have recently
  studied historiographical theory, two philosophy graduate students committed to
  a strong narrativist reading of White, and the seminar director, an empirical social
  historian who values archival rigor but is suspicious of theoretical overreach—especially
  from a non-specialist high school speaker. They will care about whether "archival
  friction" is merely rebranded source criticism, whether it smuggles in a hidden
  metaphysics of presence, and whether my argument can survive without collapsing
