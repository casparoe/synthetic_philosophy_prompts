  but denied that this shows modality-specificity of concepts. Instead, Blake argued
  that what fails is the sensorimotor coupling between the concept and the new sensory
  channel: the blind subject possesses an amodal spatial concept of cubeness, but
  vision demands a specific calibration between that concept and retinal input that
  tactile experience cannot provide.


