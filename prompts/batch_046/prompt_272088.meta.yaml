  its mechanism: the subject does not need to learn what a cube is, but must learn
  how visual edges, shading, and perspective map onto an already-possessed spatial
  structure. This is analogous to learning to drive on the left after years of driving
  on the right—the skill is transferred, but the specific execution requires adjustment.


