  (1) Alex said that if the concept of cubeness were truly amodal, then once the subject
  grasped the geometric properties through touch, sight should immediately deliver
  the same object under that concept—otherwise we are smuggling in an unnecessary
  intermediate layer of "calibration" that just renames the associative process Locke
  described.


