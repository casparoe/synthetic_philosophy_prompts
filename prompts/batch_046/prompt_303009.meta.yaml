  Here''s the setup: call a proposition p ''C-verifiable'' if there''s a program of
  Kolmogorov complexity ≤ k that eventually outputs ''p is true'' (for some fixed
  bound k). Call this the Bounded Verifiability Thesis (BVT): every true p is C-verifiable.
  Now here''s my argument that BVT implies omniscience, which is clearly wrong for
  finite computers:


  (1) BVT: ∀p(p → ◊C(p)), where C(p) means a bounded-complexity program verifies p.

  (2) Suppose there is a true p such that no bounded program currently verifies p.
