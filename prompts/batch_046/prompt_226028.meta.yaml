  Let''s recall the Rietdijk-Putnam argument: It uses special relativity''s relativity
  of simultaneity to argue for the block universe (eternalism). If observer O1 considers
  event E on Andromeda to be simultaneous with O1''s "now" (t=0), and O2 moving relative
  to O1 considers a different event E'' on Andromeda simultaneous with O2''s "now",
  then if presentism is true and only present events exist, then for O1, E is real,
  but for O2, E is not real (E'' is). But both observers are equally valid. So either
  reality depends on motion (absurd) or all events are equally real (block universe).
  Putnam (1967) "Time and Physical Geometry" used this.


