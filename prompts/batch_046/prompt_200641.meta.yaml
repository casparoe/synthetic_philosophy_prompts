  an extra premise, but that is a category error: logical rules belong to the framework
  of reasoning, not to the content being reasoned about. Leo said asking for a premise
  that licenses modus ponens is like asking for a chess move that licenses the bishop''s
  diagonal motion; the rule is constitutive of the game, not a move within it.


