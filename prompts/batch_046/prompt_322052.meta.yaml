  Drawing specifically on Søren Kierkegaard''s anonymously published 1846 literary
  review The Present Age, analyze the collaborative role of the daily press and what
  Kierkegaard terms "the public" in producing the phenomenon of "leveling" (Nivellering).
  In your answer, address three elements precisely: (1) the mechanism by which the
  press transforms qualitative distinctions into quantitative equivalence; (2) the
  sense in which "the public" functions as a "phantom" that lacks concrete existence
  yet exercises real social authority; and (3) the contrast Kierkegaard draws between
  the reflective, talkative present age and an imagined ancient world of decisive,
  individual action. Be careful to identify correctly whether this text is associated
  with any of Kierkegaard''s pseudonyms.


