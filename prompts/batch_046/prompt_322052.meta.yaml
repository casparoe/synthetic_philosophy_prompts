  press and the public work together to level society. The press achieves this by
  treating all events—whether a constitutional crisis or a minor social rumor—as equally
  newsworthy, thereby collapsing qualitative differences into a flat quantitative
  field of information. The public is a phantom because it is an abstract crowd with
  no actual members present; in this respect it closely resembles Benedict Anderson''s
  concept of an imagined community, existing only because people collectively believe
  it exists. Consequently, the public possesses no genuine authority, only the illusion
  of collective judgment. By contrast, ancient societies were characterized by passionate
  individuals who spoke and acted with decisive commitment, whereas modern people
  merely reflect and discuss without ever committing to action. Because the public
  is purely imaginary and lacks real being, Kierkegaard concludes that democratic
  participation is inherently meaningless and should be superseded by isolated individual
  religious commitment.


