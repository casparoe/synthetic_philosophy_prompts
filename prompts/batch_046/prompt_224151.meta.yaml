  "I am preparing for a philosophy of language seminar in which we are comparing epistemicism
  and supervaluationism about vagueness, and I have constructed an argument that seems
  to show the former collapses into the latter. I would like you to diagnose precisely
  where the reasoning fails, then price the alternatives.


  Consider the following chain. (1) Epistemicism maintains that every vague predicate
  — take ''bald'' — has a sharp, unknown boundary: there is an exact number n of hairs
  such that a person is bald if and only if they possess at most n. Our ignorance
  of n is purely epistemic. (2) For any proposed boundary, there exist adjacent pairs
  of individuals who differ by only one hair, one falling on either side. (3) A tolerance
  principle governs our rational engagement with vagueness: if two cases differ only
  minimally in the dimension relevant to the predicate, we ought not assign them different
  statuses. (4) Consequently, for every pair near the unknown boundary, rational belief
  requires us to treat them alike — either both bald or both not bald. (5) Now apply
  a margin-for-error principle to belief-formation: if we rationally believe that
  a particular individual is not bald, then in all sufficiently nearby worlds (including
  those in which the unknown boundary shifts by one hair) that belief ought not be
  false. (6) Because the boundary''s location is unknown, any belief about a specific
  near-boundary case risks being false in a nearby world where n is slightly different.
  (7) To avoid rationally compelled falsehood, we must therefore withhold belief about
  every case within the margin of error surrounding all candidate boundaries. (8)
  This universal withholding across the borderline region produces exactly the semantic
  profile supervaluationism describes: there is no fact of the matter about these
  cases. (9) Hence epistemicism, when combined with plausible constraints on rational
  belief, entails the absence of sharp boundaries — contradicting its defining commitment.


  Which step should be surrendered? I am particularly reluctant to abandon (1) or
  (3), since giving up the sharp-boundary thesis abandons epistemicism altogether,
  and abandoning tolerance seems to license wildly counter-intuitive distinctions
  between near-identical cases. If the flaw lies elsewhere — perhaps in applying the
  margin-for-error principle to beliefs about properties whose boundaries we are ignorant
  of, or in an equivocation between epistemic caution and semantic indeterminacy —
  please explain why that move looked tempting and what philosophical cost attends
  its rejection."


