  I am a novelist preparing an essay for a literary-philosophy review, tentatively
  titled "The Unlit Room: Luminosity, the KK Principle, and First-Person Blindness".
  The argument runs as follows. Timothy Williamson''s anti-luminosity thesis holds
  that one may occupy a mental state—feeling cold, for instance—without being in a
  position to know it, since knowledge demands a discriminative capacity that collapses
  in borderline cases. From this I derive a structural point about the KK principle:
  if one does not know p, then one does not know that one knows p, and in gradual
  transitions this second-order failure is systematic rather than accidental. I then
  propose "narrative luminosity": in retrospective first-person narration, the mental
  state attributed to a character at time t is constituted by the narration itself
  rather than being an independent object of introspection. Hence there is no stable
  fact about whether the narrator is in a position to know that state, and any attribution
  of second-order knowledge to the narrator contradicts the retrospective construction
  of the first-order state. I conclude that philosophically coherent first-person
  fiction must either embrace radical narrative unreliability or forgo deep introspective
  authority.


