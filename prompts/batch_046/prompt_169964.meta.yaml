  the protocol defines priority. The rules should be arranged so that the group initially
  achieves coordination and accumulates "institutional trust" tokens, and then, after
  the exception regime is introduced, experiences a predictable coordination failure
  that is not merely inefficient but epistemically opaque — observers can no longer
  tell whether a deviation was justified or self-interested.


