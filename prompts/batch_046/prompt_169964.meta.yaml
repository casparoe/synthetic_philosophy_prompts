  to experience what I will call normative visibility: the degree to which an outsider
  can reconstruct the reasoning behind a moral decision without access to the agent''s
  private mental state. The idea is that the German folk-moral emphasis on Ordnung
  is not authoritarian rigidity but a commitment to preserving normative visibility,
  whereas the American emphasis on individual conscience introduces an asymmetry between
  ex ante acceptance and ex post exemption that erodes collective moral learning.


