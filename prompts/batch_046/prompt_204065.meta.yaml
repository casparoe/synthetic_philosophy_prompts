  Over the past month I have been asked to help redraft the governance charter for
  a small interdisciplinary research collective to which I belong. In reviewing our
  current bylaws I discovered that Article VII contains a self-amending clause: it
  permits amendment by a two-thirds vote of the membership, but it also contains an
  entrenched subsection stating that the amendment procedure itself can only be altered
  by unanimous consent. The interaction between these provisions led me to investigate
  the logic of self-reference in rule-governed systems, particularly Peter Suber’s
  game Nomic, in which every move—including moves that change the rules—is governed
  by the rules currently in force. I have drafted a short philosophical essay exploring
  whether such circularity is a genuine paradox or merely a procedural tension, and
  I am writing to ask for critical comments on the argument.


  The essay (currently about 1,800 words) makes three main moves. First, I distinguish
  between internal amendment, where a change is executed using the very procedural
  mechanisms being modified, and external revision, where the system is suspended
  and reconstructed from outside. I argue that Nomic collapses this distinction because
  every move is internal by design, whereas legal constitutions attempt to preserve
  it through entrenchment clauses. Second, I propose that the apparent paradox—using
  a majority rule to eliminate the majority-rule requirement—dissolves once we recognize
  that authority is not a static property of rules but a temporally indexed function:
  at time t the rule authorizes the vote, and at time t+1 a new rule governs. The
  circularity is therefore diachronic rather than logical. Third, I inject a more
  speculative proposal that I call velocity-layered entrenchment: rather than treating
  all amendment rules as either amendable or immutable, an organization could assign
  them different temporal velocities—fast-track provisions changeable by simple majority
  after brief notice, and slow-track provisions requiring supermajority approval across
  multiple meetings separated by cooling-off periods. I suggest that this does not
  solve the self-reference problem but relocates it onto a meta-rule that assigns
  velocities, and that this meta-rule must itself be either unamendable (creating
  a hard stop) or subject to an infinitely ascending hierarchy of velocity assignments.


  I would particularly value comments on the following points. Is the diachronic dissolution
  of the paradox convincing, or does it merely rename the problem of where the initial
  authority comes from? Does the velocity-layered model genuinely add analytical clarity,
  or is it an unnecessary complication that obscures the basic point that any self-amending
  system needs an external anchor? I am also unsure whether my comparison between
  Nomic and constitutional law holds up: in Nomic, rule changes are moves within the
