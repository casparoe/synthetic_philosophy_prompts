  the following hybrid desert framework—one I have developed for this context but
  that draws on standard distinctions—without collapsing into either pure contributionism
  or pure luck-egalitarianism. The framework holds that institutional desert has three
  separable layers: (A) effort-desert, calibrated not to raw output but to the difficulty
  of the task relative to the agent''s counterfactual opportunity baseline (what resources
  and support the institution actually made available, not what was nominally listed);
  (B) contribution-desert, measured against the collective''s explicitly stated goals
  for the funding cycle, with the proviso that metrics that systematically undervalue
  certain kinds of labor require a corrective adjustment before comparison; and (C)
  character-desert, a limited, non-quantifiable check on whether the team''s conduct
  violated or exemplified the cooperative''s procedural norms in ways that should
  affect reward regardless of output. The procedure must ask questions in a fixed
  order, specify what counts as a sufficient answer at each stage, mark the points
  where a values judgment is unavoidable and must be signed off by the full panel
  rather than by an individual reviewer, and state exactly where it outputs a recommendation,
  where it outputs a denial, and where it defers to a separate ethics review. It must
  handle cases in which the layers conflict—for instance, high contribution-desert
  combined with low effort-desert because the team had hidden privileges, or high
  effort-desert combined with low contribution-desert because institutional measurement
  bias suppressed recognition of their labor. Apply the procedure to three dossiers:
  (1) a senior team with exceptional quantitative output that relied on undisclosed
  access to proprietary data not available to other teams; (2) a junior team with
  modest measured output that overcame a documented, institutionally unacknowledged
  resource deprivation (no lab access for two quarters); and (3) a team with average
  contribution whose work was systematically misclassified by our evaluation rubric,
  yielding a score that the corrective layer would revise upward, but whose members
  also violated procedural norms by withholding preliminary data from peer reviewers.
  One of these applications should yield a result that conflicts with my own intuitive
