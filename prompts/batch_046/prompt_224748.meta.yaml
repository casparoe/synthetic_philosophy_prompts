  Here are notes for a short essay tentatively titled "Two layers of wrongness: instrumental
  corruption versus value parasitism in the wrong-kind-of-reasons problem." I begin
  with Bernard Williams''s familiar observation that moral action done for the wrong
  kind of reason—say, rescuing a stranger solely to collect a reward—fails to manifest
  the agent''s proper moral orientation, even if the outcome is correct. Standard
  treatments tend to classify all such cases under a single heading: the agent''s
  reason is external to the value that justifies the act. I want to argue that this
  collapses two structurally different failures.


  The first, which I call instrumental corruption, is the classic case. The agent''s
  reason is causally detached from the value; she treats the right action as a mere
  means to an unrelated end. The second, which I call value parasitism, is more subtle.
  Here the agent''s reason is tightly coupled to the value—she tracks it precisely—but
  only as a necessary condition for some further end that is not itself responsive
  to that value. Consider a surgeon who performs life-saving operations not because
  she values the patients'' lives, but because her license and professional identity
  depend on maintaining a high success rate. Patient survival is not an accidental
  side-effect for her; it is the metric she must optimize. Yet her practical reasoning
  is anchored in career preservation, not in the patients'' welfare. The reason is
  wrong-kind not because it ignores the value, but because it feeds on it without
  being constituted by it.


  My tentative claim is that value parasitism is not reducible to instrumental corruption.
  In the first case, the agent could in principle perform the action while being entirely
  indifferent to the value; in the second, she is calibrated to the value and might
  even suffer emotional disruption if it is violated, yet her motivation remains structurally
  misaligned. If this distinction holds, it has implications for how we assess professionals
  who reliably do good for self-interested reasons that are institutionally embedded:
  they may deserve less praise than genuinely motivated agents, but perhaps more than
  those who are merely accidentally beneficial.


