  merely taxonomic, whether the surgeon example succeeds in isolating the second layer,
  and whether recognizing value parasitism helps resolve any traditional puzzles about
  moral motivation—such as whether an agent who acts from a tightly coupled but non-moral
  reason can still be said to act for a moral reason in some derivative sense. I am
  also unsure whether the distinction applies beyond professional contexts, and suggestions
  for sharpening or testing it would be particularly useful.


