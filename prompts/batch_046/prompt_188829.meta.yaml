  regardless of just cause

  - Just war theory: jus ad bellum (just cause, right authority, etc.) and jus in
  bello (discrimination, proportionality)

  - Some philosophers defend MEC (Walzer, etc.), others reject it (McMahan, Rodin,
  etc.)

  - The "revisionist" school (McMahan) rejects MEC and says only just combatants can
  kill justly.

  - There are debates about whether unjust combatants can be morally permitted to
  fight if they have an excuse (epistemic limitation, duress, etc.)


