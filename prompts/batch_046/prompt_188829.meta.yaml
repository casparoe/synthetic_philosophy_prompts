  self-defence), and that an unjust aggressor can''t claim that right.

  3. I think soldiers usually have an excuse for fighting in unjust wars because they
  rely on their state''s authority and lack full information.

  4. But I also think excuses don''t generate permissions: being blameless isn''t
  the same as being justified.

  5. I think the laws of war should treat both sides symmetrically regardless of who
  started it.


