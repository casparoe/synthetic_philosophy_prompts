  Structure:

  - Intro: I''m a high school student in an independent study/philosophy seminar.

  - Report the teacher''s verdicts on five thought experiments.

  - Specify the new case.

  - Ask: Predict her verdict on the new case, say which theory/rule she''s implicitly
  running (with alternatives), give best guess with reasons, and name a further case
  that would settle which rule she''s actually using.


  Let''s draft:


  My philosophy teacher, who runs our school''s upper-level ethics and philosophy
  of mind seminar, has made clear judgments about whether several well-known thought
  experiments are legitimate intuition pumps or misleading ones. She accepts Judith
  Jarvis Thomson''s violinist analogy as a legitimate pump: she says it successfully
  isolates the distinction between a right to life and a right to sustained bodily
  support, and that the intuition that one may unplug survives framing changes. She
  rejects the "fat man" variant of the trolley problem as misleading, arguing that
  the direct physical involvement introduces an emotional confound that obscures rather
  than clarifies the moral logic. She accepts the standard trolley switch case as
  legitimate, holding that it cleanly isolates the act/allow distinction without visceral
  interference. She rejects Searle''s Chinese Room argument, claiming it depends on
  a fallacious intuition that understanding must be localized in a specific substrate
  rather than distributed across a system. She also rejects Frank Jackson''s Mary''s
  Room scenario, arguing that the "what it is like" intuition collapses once we distinguish
  propositional knowledge from practical acquaintance, so the pump begs the question.


  Next week she will discuss a newly proposed pump—call it the Distributed Replacement
  Pump—in which a person''s biological neurons are replaced one by one with functionally
