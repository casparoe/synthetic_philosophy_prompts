  ---


  A colleague has pressed me with an argument that applies the etiological theory
  of biological function to synthetic and reconstructed organisms, and I think it
  ends up showing that engineered biology cannot conceptually accommodate malfunction.
  I want to know exactly where the chain breaks, because each step looks defensible
  in isolation.


  (1) On the standard etiological account, a token trait T in an organism O has the
  proper function F if and only if F is the effect for which traits of T''s type were
  naturally selected in the evolutionary lineage leading to O.


  (2) Now consider a synthetic organism—say, a bacterium engineered to produce a human
  insulin analog—where the gene for the analog was inserted via plasmid and was never
  part of that bacterial lineage''s evolutionary history.


  (3) By (1), that inserted gene has no proper function in the bacterium, regardless
  of how efficiently it produces insulin.


  (4) But "function" and "malfunction" are correlative: to say a trait is malfunctioning
  is to say it is failing to perform its proper function.


  (5) Therefore, if the gene produces a misfolded analog, it is not malfunctioning;
  there is simply no standard of correct performance against which failure can be
  measured.


  (6) Generalizing: every trait in every synthetic or horizontally acquired genome
  lacks a proper function, so the concept of malfunction cannot apply to any engineered
  biological system.


  (7) That proves too much. Engineers clearly distinguish between a working synthetic
  pathway and a broken one, and microbiologists describe horizontally transferred
  antibiotic-resistance genes as functioning or failing.


  (8) To avoid this, one might switch to a causal-role account for synthetic traits:
  the gene''s function is just the causal contribution it makes to the bacterium''s
  engineered goal.


  (9) But if causal-role applies here, consistency demands it apply everywhere.


  (10) Then every stable chemical byproduct—say, the reddish hue of hemoglobin or
  the acoustic resonance of a heartbeat—counts as a functional contribution, because
  each makes some causal difference to the system.


  (11) So we face a dilemma: either we keep the etiological account and deny that
  engineered traits can ever malfunction, or we adopt causal-role and collapse the
  distinction between functional traits and accidental physical properties.


  (12) My colleague says the only escape is to reject (4) and allow malfunction without
  proper function, defined instead relative to designer intent. But I worry that smuggles
  a non-biological normative standard into the theory of function.


  Please tell me which step—(1) through (6), or the move to (8)—is the weakest link,
  and explain what giving it up costs for either the etiological or the causal-role
  framework. Write your answer in American English, and do not include bibliographies,
  reading lists, or citations.


