  imagination, but conceals a deeper disagreement about what kind of mental representation
  can license a modal claim—specifically, whether conceivability requires what I would
  call direct conception, in which one positively represents an object with its intrinsic
  determinacy while merely withholding the perceptual relation, or negative conception,
  in which one represents the object only through the exclusion of perception, leaving
  its intrinsic content underspecified. Each side, I suspect, treats one of these
  as the default case without arguing for that priority.


