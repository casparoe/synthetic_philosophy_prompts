  As a student in an early modern philosophy course, I have been tracking the long-running
  dispute over Berkeley''s so-called master argument—the claim that attempting to
  conceive of a sensible object existing unperceived necessarily fails, because in
  the very act of conception one forms an idea of the object and thereby perceives
