  and Gregg Caruso on free will, moral responsibility, and the justification of punishment.
  Rather than simply replaying Dennett''s compatibilist argument that desert-based
  punishment functions as an indispensable social technology, or Caruso''s counter
  that retributivism rests on a metaphysically dubious conception of the libertarian
  self, I want to propose a framing that neither author, to my knowledge, has developed
  in precisely this form. The essay argues that legal institutions engage in what
  I term "retrospective agency reconstruction": after an offense occurs, courts and
  communal narratives selectively foreground or suppress elements of an agent''s psychological
  history—not to discover a pre-existing metaphysical fact about freedom, but to render
  the punishment narratively coherent with shared normative commitments. On this account,
  desert is neither a natural property detected by judgment nor a pure fiction to
  be replaced by quarantine-style rehabilitation; it is a performative status conferred
  through the ritual of judgment itself. I contend that this explains the peculiar
  resilience of retributive intuitions even amid widespread acceptance of neuroscientific
  determinism: societies are not tracking an underlying fact about agency, but periodically
  reaffirming the coherence of a normative framework that requires public, symbolic
  closure.


  My concern is whether this framing genuinely occupies a middle ground or merely
  collapses into one of the two poles once translated into institutional language.
  If the reconstruction of agency is purely functional—aimed solely at maintaining
  social cohesion—does it not reduce to Dennett''s pragmatic compatibilism, with "performative
