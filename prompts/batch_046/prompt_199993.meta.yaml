  is the perfect example. In a hospital ward, doctors observe patients constantly,
  rank them by severity, and write charts that compare each body to a norm. This produces
  knowledge about disease and also disciplines patients into compliant subjects. This
  is anatomo-politics because it targets individual bodies as machines to be optimized.


