  history, family size, past claims—and produces a risk score that determines if someone
  gets audited. This is knowledge because it turns social life into numbers, and its
  power because being flagged changes your access to benefits. Its not just surveillance
  because surveillance only watches people, but here the system creates the category
  of high-risk recipient that didnt exist before, and then uses it to organize intervention.


