  rather than "caring for," but this distinction threatens to bifurcate care ethics
  into an intimate, affective domain and a thin, distributive one, losing the specificity
  that was supposed to distinguish the approach.


  I want to suggest that the tension runs deeper: it is a problem about the mechanics
