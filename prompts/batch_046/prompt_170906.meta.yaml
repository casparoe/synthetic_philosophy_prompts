  "anaphoric care," in which the object of care is accessed through a chain of representations,
  institutional roles, or narrative descriptions that point back to an antecedent
  particular. Anaphoric care is not abstract in the sense of being universal; it remains
  particular, but its particularity is mediated. The risk, however, is reference failure:
  if the chain of representation is broken or opaque—if statistical aggregates replace
  narratives, or bureaucratic categories replace names—the anaphoric link collapses,
  and care degenerates into management.


