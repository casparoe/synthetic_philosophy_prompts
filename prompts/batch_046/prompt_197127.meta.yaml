  is defensible only when it is reconceived as an asymmetry-of-evidence constraint
  that applies specifically to interventions characterized by three jointly sufficient
  conditions—irreversibility on a multi-decadal scale, absence of a close historical
  analog that would support reliable frequency-based risk estimation, and the presence
  of feedback loops that are both delayed and nonlinear. Under this reconception,
  which I have been calling the ''delayed-feedback asymmetry thesis,'' caution about
  a hypothetical large-scale ocean alkalinity program with a projected sixty-year
  carbonate-cycle feedback loop and no direct precedent is warranted, whereas applying
  the same principle to block a well-characterized pharmaceutical trial would be a
  category error. I present this not as an established doctrine but as a working view
  I am testing.


  What I need is an honest map of what would genuinely count against this reconceived
  position, rather than a generic list of objections to the precautionary principle
  in general. Specifically, I want to know which observations, conceptual distinctions,
  or formal results would have to obtain for the delayed-feedback asymmetry thesis
  to fail. Would decisive defeat require demonstrating that all apparently irreversible
  interventions can in principle be decomposed into reversible micro-steps, thereby
  dissolving the category? Or would it be enough to show that expected-utility frameworks
  with heavy-tailed priors already capture every normative intuition the thesis explains,
  rendering it redundant rather than false? I also want to know whether the view risks
  being insulated into unfalsifiability—for instance, if defenders can always retreat
