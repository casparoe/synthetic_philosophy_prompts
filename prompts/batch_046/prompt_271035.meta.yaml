  over-credited in ways that directly extract credibility from marginalized speakers,
  so the harm is relational and zero-sum in context.


  (b) Hermeneutical injustice is not merely a collective conceptual gap but a form
  of epistemic labor extraction: marginalized groups are expected to generate and
  refine interpretive resources for dominant institutions (legal, medical, academic)
  without reciprocity or compensation, and this labor is itself part of the injustice.


  (c) The appropriate remedy for both is primarily institutional redesign—procedural
  rules for peer review, deliberative bodies, and curriculum construction that redistribute
  credibility and hermeneutical resources—rather than case-by-case moral correction
  or individual education.


