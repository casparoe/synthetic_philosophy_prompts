  credibility judgments they render in face-to-face interactions; structural explanation
  does not function as a moral excuse for particular acts of dismissal.


  (e) I reject standpoint epistemology''s claim that marginalized social locations
  confer automatic or unchallengeable epistemic privilege; lived experience provides
  distinctive but defeasible access to certain social facts, not authoritative knowledge
