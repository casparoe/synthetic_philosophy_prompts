  1. The exam prompt as students would see it.

  2. A model answer that identifies the specific conceptual moves a top response must
  make and the specific errors that should cost marks.

  3. A marking scheme that allocates points (suggested total: 30 marks) and lists
  identifiable misconceptions with their penalties—for example, conflating derived
  intentionality with the absence of intentionality altogether; describing the two-bitser
  as a standard computer program rather than as a composite of intentional subsystems;
  ignoring the nesting objection; or treating Dennett''s argument as merely about
  interpretation rather than about compositional emergence.


