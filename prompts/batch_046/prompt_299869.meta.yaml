  Last night I had a long argument with a close friend about whether understanding
  can ever be built out of parts that do not themselves understand. We kept returning
  to Searle''s distinction between original and derived intentionality and to Dennett''s
  strange two-bitser thought experiment, and I realized that most textbook treatments
  miss the precise compositional problem that makes the case interesting. I want to
  turn this into a final exam for my upper-level philosophy of mind seminar.


  Please design a take-home essay exam with the following specifications. The course
  is an upper-level undergraduate philosophy of mind seminar; students have read standard
  material on intentionality but are not expected to have encountered niche secondary
  literature. The exam should be answerable in roughly 90 minutes of writing (target
  1,200–1,500 words) and should not require web access, bibliographies, or citations.


  The exam question itself must do three things. First, it must ask students to reconstruct
  Searle''s distinction between original and derived intentionality, including his
  reason for denying that artifacts possess the former. Second, it must ask them to
  explain Dennett''s two-bitser thought experiment—not as a generic AI example, but
  specifically as a compositional challenge in which sub-components that individually
  lack original intentionality are arranged so that the composite appears to possess
  it. Third, and crucially, the question must require students to evaluate whether
  Dennett succeeds, with explicit attention to what I will call the nesting objection:
  if each constituent bitser''s intentionality is derived (either from an external
  interpreter or from still-smaller parts), then the composite''s intentionality seems
  equally derived, not genuinely original.


