  (1) I think the core legislature should be selected by lot—citizens serving single,
  non-renewable terms of, say, three years—because this eliminates campaign incentives,
  removes the need for fundraising, and produces a descriptively representative body.


  (2) For any offices that remain elected—executive positions and, if retained, an
  upper chamber—I support hard term limits (maximum two terms) on the grounds that
  career politicians become structurally captured by donors and lobbying networks
  and gradually lose epistemic contact with ordinary life.


  (3) I take democratic equality to require broad rotation in governing roles: no
  persistent class of rulers should emerge, and citizens should not be permanently
  divided into governors and governed.


  (4) At the same time, I think legislative competence and institutional memory are
  genuine public goods. So I want former members of the sortition chamber to be eligible
  for appointment—not election—to a small upper council with staggered, long (say,
  twelve-year) but non-renewable terms. This council would have drafting authority
  and advisory power, but no vote on final passage, and its members would be ineligible
  for any other public office afterward.


  (5) I reject the very idea of a "career politician": anyone who spends decades seeking
  or holding elected power, cycling through offices to remain in government, represents
  a democratic failure that institutional design should prevent.


