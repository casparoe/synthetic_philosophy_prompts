  to deliver the opening address for a retrospective exhibition entitled Form and
  Fault at a major public gallery in London. The exhibition is devoted to the late
  work of a canonical but profoundly controversial mid-twentieth-century European
  painter and sculptor whose documented biography includes sustained domestic violence
  and documented collaboration with an authoritarian regime. The audience is deliberately
  heterogeneous: senior curators and art historians who defend the formal significance
  of the work; advocates for survivors of abuse; graduate students in art history;
  and members of the general public who may have little familiarity with philosophical
  debates about art and morality.


  The speech should last approximately eight minutes and must be delivered in polished,
  formal British English. Its central philosophical task — the idea that must do real
  structural work — concerns whether immoral art can be good art, approached through
  a framework I am developing in my research. I call this the double-aspect view:
  artistic value comprises two irreducible dimensions, an intrinsic formal-aesthetic
  dimension and a relational-ethical dimension tied to the conditions of production
  and to the moral character expressed through the work. These dimensions are neither
  fully separable nor reducible to one another. I want the address to navigate this
  precisely: it must make it intelligible to praise formal achievements without endorsing
  the artist, while also refusing to treat the ethical dimension as mere biographical
  gossip. In particular, I want you to employ the concept of expressive isomorphism
