  only appear to conflict but can be reconciled with minimal cost, and what the least
  damaging revision would be. Please rank the tensions by severity, and indicate for
  each whether the resolution requires giving up a substantive commitment or only
  refining its formulation. I am not asking for a bibliography or for citations to
  specific journal articles—just an assessment of whether my position is jointly tenable."


