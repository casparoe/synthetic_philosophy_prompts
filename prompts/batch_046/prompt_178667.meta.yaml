  "Disjunctivism, as defended by people like McDowell and Martin, says that when you
  genuinely see a tree, your experience is just your direct relation to the tree,
  not a mental image of it. When you hallucinate a tree, you are in a different kind
  of state altogether—maybe you''re representing tree-content, but you''re not actually
  seeing. So the argument from illusion assumes there''s one kind of experience that
  happens in both cases, and disjunctivists deny that. The charge that it''s just
  a verbal trick misses the point because disjunctivists aren''t saying the words
  are different; they''re saying the mental ontology is different.


  As for why they feel the same, disjunctivists can say they''re epistemically indistinguishable—you
  can''t tell from the inside which one you''re in—but that doesn''t mean they''re
  phenomenally identical. Phenomenal identity is about what it''s like, and epistemic
  indistinguishability is just about your knowledge. So the argument from illusion
  confuses these two.


