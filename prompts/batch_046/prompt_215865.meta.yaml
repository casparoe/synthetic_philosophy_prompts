  "I''m a PhD student in moral philosophy working on punishment theory. For well over
  a century, the debate between retributivists and consequentialists has seemed to
  go in circles: retributivists insist that punishment must be deserved and proportionate,
  regardless of future benefits; consequentialists reply that if punishment produces
  no net good, imposing suffering is unjustified, and that ''desert'' can be reconstructed
  instrumentally. Both sides have refined their positions — retributivists now often
  accept that punishment must also be institutionally embedded and not purely expressive;
  consequentialists now often grant that desert can be a side-constraint or a distributive
  consideration — yet the core disagreement persists without resolution.


  My working hypothesis is that the stall is partly verbal and partly structural:
  the two sides are answering different questions about the function of punishment,
  but they share a hidden ambiguity in the term ''desert'' that makes the disagreement
  look like a single axis. Specifically, I think there is an under-examined distinction
  between desert-as-proportionality (a scalar, comparative relation between wrong
  and suffering) and desert-as-narrative-closure (a categorical status that marks
  the end of a moral narrative, independent of magnitude). Retributivists often slide
  between these, using proportionality language to justify closure, while consequentialists
  treat both as reducible to expected utility.


  I want a diagnosis, not a survey. Is the disagreement substantive, verbal, or a
  case of cross-purposes? Use what each side actually says about proportionality,
  about the role of the state, and about whether desert is a reason or a constraint.
  Identify whether there is a hidden empirical question (e.g., about the actual deterrent
  effects of punitive vs. restorative practices) or a formal one (e.g., about the
