  of Douglas Hofstadter''s Letter Spirit project — which models letter recognition
  not through feature-checklists but through a network of ''codelets'' that make analogical
  slippages between letterforms — people often fall back on an analogy: recognizing
  an ''a'' is like recognizing a human face. We see the gestalt immediately; we don''t
  check for eyes, nose, mouth in sequence; damage to specific features doesn''t destroy
  recognition; and there is enormous tolerance for style variation (fonts, handwriting)
  without losing category membership. This analogy is used to argue that letter categories,
  like face categories, are essentially non-decompositional, embodied, and prototype-driven
  — that there is no ''essence'' of ''a''-ness, only a statistical cluster of family
  resemblances centered on a prototypical form.


