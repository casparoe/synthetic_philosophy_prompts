  friendship''s intrinsic value is partly constituted by its instrumental contribution
  to the moral development of the participants — that is, part of what makes the friendship
  valuable just is the value of the virtues it produces. Fifth, I maintain that beauty,
  unlike friendship, can be fully realised in non-conscious, abstract structures (for
  example, formal mathematical patterns or algorithmic designs) and that such structures
  possess intrinsic value regardless of whether any being actually perceives them.


