  on my position before I present it. My commitments are as follows. First, I follow
  G. E. Moore in holding that both friendship and the appreciation of beautiful objects
  are supreme intrinsic goods, consisting in organic unities whose value exceeds that
  of any constituent mental states or relations considered separately. Second, I take
  both goods to be essentially relational and conscious-dependent: beauty requires
  a subject with appropriate perceptual and cognitive capacities, and friendship requires
  reciprocal recognition between agents. Third, I reject Moore''s non-naturalist metaethics
