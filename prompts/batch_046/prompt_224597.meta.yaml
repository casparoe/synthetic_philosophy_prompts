  The guiding problem is pain asymbolia: the well-documented but clinically rare condition
  in which a subject registers tissue damage, reports it as painful, yet shows no
  negative affect and no motivation to stop it. Use this not as a curiosity but as
  a structural mirror. Introduce a three-layer distinction that the workshop will
