  acknowledge that their default protocol—reduce the signal, assume suffering follows—is
  therapeutically justified in the vast majority of cases, and that treating asymbolia
  as a model for all pain management would be a category error. For the philosophers
  and advocates, it must show that the collapse is not conceptually necessary: if
  registration can exist without coloring or salience, then the badness of pain is
  not located in the sensory quality itself but in one or both of the other layers,
