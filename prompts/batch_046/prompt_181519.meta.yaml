  must be attested by evidence that is both independent of the narrative tradition
  and capable of being false.

  (2) Before widespread literacy, all testimony is either orally derived or institutionally
  transmitted, so it fails the independence condition.

  (3) Archaeological remains can be independent, but they cannot establish specific
  events—such as a siege, an exodus, or a royal court—without interpretive framing
  that borrows from the very narratives under examination.

  (4) Therefore no ancient narrative can satisfy the independence condition; the distinction
  between legend and history collapses for all pre-modern material.

  (5) Nevertheless we do distinguish: we treat Hittite references to Wilusa and Egyptian
  mentions of Habiru-related movements as lending historical weight to Troy and the
