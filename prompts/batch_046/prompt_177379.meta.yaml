  You are a professional philosopher of science with expertise in philosophy of mind
  and the ontology of scientific explanation. I want you to think carefully, and before
  giving any final diagnosis, please begin by brainstorming at least three distinct
  ways a long-running philosophical disagreement can stall without being merely verbal.
  Then proceed with your analysis.


  The issue has become personally relevant to me because I am currently developing
  assessment protocols for disorders of consciousness in a clinical neuroscience setting,
  and I need to decide whether attributing intentional states—beliefs, preferences,
  goals—to minimally responsive patients is tracking something genuinely real or merely
  deploying a predictive heuristic that works at the design stance but dissolves under
  the physical stance. In my interdisciplinary working group—clinicians, cognitive
  scientists, and philosophers—the debate about real patterns and the three stances
  has been stuck for over a year.


  Here is the stall. One camp holds that mental patterns are real patterns in Dennett''s
  sense: they are objectively there in the behavior and neural dynamics, but they
  are only visible from the intentional stance, just as biological functions are visible
  from the design stance and molecular structures from the physical stance. They emphasize
  that predictive success and interventional control are not accidental; they indicate
  that the intentional stance has locked onto a stable feature of the world, not invented
  one. The other camp agrees entirely on the predictive success, the neural correlates,
  and the clinical utility of intentional attribution. They agree that suffering is
  bad and that misattributing states causes harm. But they deny that predictive success
  under a stance makes the corresponding patterns "real" in any ontologically weighty
  sense. They argue that the intentional stance is an epistemic escrow mechanism:
  it holds predictive credit without delivering ontological cash. If a pattern cannot
  be exported—without explanatory loss—into the vocabulary of the physical stance,
  then it is stance-dependent in a way that disqualifies it from being a real pattern,
  however useful.


  We have not moved an inch. We do not disagree about the empirical data from neuroimaging,
  about the reliability of behavioral prediction, or about the ethical urgency of
  getting attribution right in the clinic. We do not disagree about whether the intentional
  stance is indispensable for clinical reasoning. The disagreement seems to sit at
  a deeper level: is the indispensability of a stance evidence for the reality of
  the patterns it reveals, or is it evidence only for our cognitive limitations?


  My hypothesis is that this is not a hidden empirical question—no further fMRI study
  will resolve it—nor is it purely a bedrock clash of intuitions about "naturalness."
  Rather, I suspect we are answering different questions under the single name "real
  pattern": one side is asking an ontological question about stance-independent existence,
  while the other is asking an epistemological question about explanatory exportability.
  But I am unsure whether this diagnosis is correct, whether there is a hidden formal
  question about the conditions under which a pattern counts as real across stances,
  or whether the impasse reveals that the very concept of a "real pattern" is being
  stretched past its useful limits when applied to intentional phenomena.


  Please diagnose the structure of this disagreement. Is it verbal, substantive, or
  a mixture? Do the sides differ about facts, about standards of what counts as evidence
  for ontological commitment, about which cases should serve as data, or about starting
  intuitions that neither can argue for? Is there a hidden empirical or formal question—perhaps
  about the possibility of inter-stance translation without loss—doing the work? Are
  the sides answering different questions under one name? Is the impasse a sign that
  the question is ill-posed, or just that it is genuinely hard? Support your diagnosis
