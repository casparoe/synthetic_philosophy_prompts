  as a historian of the sixteenth-century Mediterranean.


  The specific problem I want to investigate is an internal tension in Braudel''s
  tripartite division of historical time. On one reading, geographical structures—mountain
  ranges, sea currents, climate patterns—function as deterministic constraints, a
  kind of background prison that delimits what social and political life can become.
  Yet Braudel also documents numerous cases in which human societies gradually but
  decisively alter these very structures through irrigation, deforestation, urbanization,
  and technological adaptation. If geographical time is genuinely autonomous and causally
  determinative, it should not be vulnerable to rapid alteration by agents operating
  in event-time or social-time. Conversely, if it is vulnerable, then it lacks the
