  functions as a direct counter-prediction. The legend remains intact precisely because
  its religious function does not depend on this decoupling; for many communities,
  the narrative''s truth is moral rather than archaeological.


  With King Arthur, the situation is inverted. The earliest Welsh sources contain
  no Arthur; he emerges in later medieval texts. Here there is no dense archaeological
  prediction to fail—Arthur is not tied to a specific stratigraphic layer or demographic
