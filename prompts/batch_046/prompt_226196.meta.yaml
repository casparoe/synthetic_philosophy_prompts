  At a graduate workshop on decision theory and ethics, two participants — Jordan
  and Riley — got into an extended argument about how anthropic reasoning should inform
  moral priorities. I listened as a bystander and could not tell who had the stronger
  case. They asked me to adjudicate, but I want an independent assessment. Here is
  what was said.


  Jordan opened by proposing that when we weigh preventing human extinction against
  reducing wild-animal suffering, we should apply a Self-Sampling Assumption (SSA):
  treat our own existence as a random draw from the reference class of conscious beings
  capable of moral reasoning. Because we observe ourselves to be human rather than,
  say, an insect or a digital mind, this should update us toward worlds in which human-like
  observers are relatively prevalent. That, Jordan argued, makes existential risk
  more urgent: the very fact that we are here as humans suggests that the pool of
  human observers is large, and extinction would eliminate that pool.


  Riley replied with a Self-Indication Assumption (SIA): our existence should update
  us in favor of hypotheses that predict more observers like us, regardless of reference-class
  boundaries. If wild-animal suffering involves orders of magnitude more conscious
  subjects than human populations ever could, then our existence is more likely in
  worlds with abundant suffering-capable consciousness. So SIA, Riley claimed, actually
  favors directing resources toward reducing wild suffering rather than safeguarding
  humanity.


  Jordan countered that Riley''s reasoning collapses into the familiar presumptuous-philosopher
  problem: if SIA applies without restriction, we should expect to find ourselves
  in the largest possible population of observers, which is patently absurd. Therefore
  SIA should be rejected, or at least sharply constrained.


  Riley responded that the objection only bites against an unrestricted reference
  class. He proposed restricting SIA to a "phenomenal reference class" defined by
  reflective moral agency — the capacity to weigh reasons and participate in normative
  debate. Within that bounded class, SIA does not force us to expect maximally large
  populations; it merely says that among worlds with such agents, we should expect
  more of them rather than fewer. Jordan''s SSA, Riley added, avoids the absurdity
  only by silently importing an equally arbitrary choice of reference class — whether
  "all conscious beings," "all mammals," or "all moral agents" — and then conditioning
  on membership. Without SIA, Jordan offers no principled reason to update beliefs
  about prevalence at all, leaving moral decision-making in a state of unprincipled
  ignorance.


  Jordan''s final move was that Riley''s restriction is ad hoc: he defines the reference
  class precisely to escape the absurd conclusion, making SIA unfalsifiable. By contrast,
  SSA conditions on our actual observed properties without treating our existence
