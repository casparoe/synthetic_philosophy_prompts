  Draft:


  I am a student in an advanced undergraduate course on normative ethics, and we have
  spent the past month on the doctrine of double effect and its application to classic
  trolley-style dilemmas. I find myself with a cluster of intuitive verdicts that
  I cannot reconcile into a single principle, and I am hoping to test whether reflective
  equilibrium is possible here.


  Here are my judgments. In the standard switch case—diverting a runaway trolley onto
  a side track where one person will be killed instead of five—I judge the action
  permissible. In the footbridge case—pushing a large stranger onto the tracks to
  stop the trolley—I judge it impermissible. In the loop variant, where diverting
  the trolley onto a loop track kills one person but that very person''s body stops
  the trolley from returning to the five, I also judge the diversion permissible.
  Killing one healthy patient to harvest organs and save five dying patients strikes
  me as impermissible, even though the numerical trade-off is identical to the switch
  case.


  Beyond these familiar scenarios, I have been thinking about institutional analogues,
  and my verdicts there seem to pull in different directions. Consider a public-health
  authority that approves a widely beneficial drug knowing that it will cause a fatal
  adverse reaction in roughly 0.01% of users, distributed randomly across the population;
  the harm is foreseen but neither intended nor causally instrumental to the drug''s
  benefit. I judge this permissible. Now consider a municipal traffic redesign that
  reduces city-wide fatalities by removing pedestrian crossings in a specific low-income
  district; the increased deaths in that district are statistically predictable but
  are not the mechanism by which overall fatalities drop—they are a distributive side-effect
  of the system''s efficiency. Despite the structural parallel to the drug case—foreseen
  harm, unintended, not causally used—I find this redesign impermissible. I also think
  that a rapid carbon-tax policy that causes severe economic harm (and some mortality)
  in coal-dependent regions is permissible only if that harm is genuinely a side-effect
  of emission reduction, not if the suffering of those regions functions as the causal
  lever that drives the transition.


  My question is whether there is a coherent, precisely stated principle—perhaps a
  refined version of double effect with explicit conditions on causal structure, intentional
  object, and distributive pattern—that can accommodate all six verdicts. If so, state
  the principle, identify which clause explains each case, and show what it predicts
  for an unconsidered case: for instance, an autonomous-vehicle algorithm that, in
  an unavoidable crash, selects a trajectory that minimizes total casualties but does
  so by exploiting a known demographic correlation in impact severity (not by targeting
  anyone, but by using the correlation as part of its optimization). If no single
  principle can save every verdict, then tell me which judgment I should abandon and
  why—whether the loop case collapses into the footbridge case, whether the institutional
  examples undermine personal-action distinctions, or whether my discomfort with the
  traffic redesign reveals an unstated fairness condition that actually belongs in
  the principle. I want the answer to be a small set of candidate principles, each
  with its cost in terms of which of my intuitions it must reject.


