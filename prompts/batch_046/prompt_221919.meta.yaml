  (5) I reject Platonism and any divine-mind or cosmic-designer explanation.

  (6) At the same time, I think there''s something genuinely strange about the deep
  structural match—say, that infinite-dimensional vector spaces are literally the
  language of quantum reality—and I don''t think category-theoretic structuralism
  dissolves that strangeness.


