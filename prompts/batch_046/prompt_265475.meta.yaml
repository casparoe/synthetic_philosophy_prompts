  So:


  "Read Aldous Huxley''s Brave New World through the lens of performance legitimacy—specifically
  the debate over whether sustained prosperity and social order can justify authoritarian
  rule, with reference to the frameworks applied to China and Singapore. The World
  State delivers exactly what performance-legitimacy theorists promise: abundance,
  stability, the elimination of poverty and war, and high subjective well-being engineered
  through soma and conditioning. Mustapha Mond defends the system on precisely these
  grounds, while John the Savage rejects it in the name of human dignity, suffering,
  and freedom.


  Your task is a critical reading in both directions. First, use the input-legitimacy
  versus output-legitimacy distinction to analyze Mond''s defense: does he genuinely
  justify the State by its results alone, or does he smuggle in unstated premises
  about human nature and happiness? Examine specific scenes—the tour of the conditioning
  center, the distribution of soma, the Savage''s confrontation with Mond, and the
  fate of John—to ask whether the novel depicts a regime that succeeds on its own
  metrics, or whether Huxley builds hidden failures (the suppression of science, the
  hollowing of art, the elimination of genuine human relationships) into the performance
  claim itself.


  Second, ask what the novel adds that the philosophical debate misses. Performance-legitimacy
  arguments in political science usually treat prosperity and order as measurable
  outputs; Huxley imagines a society that optimizes those outputs by redesigning human
  psychology. Does this reveal a blind spot in the debate—namely, that maximizing
  output legitimacy may require destroying the kind of subjects who could value it?
