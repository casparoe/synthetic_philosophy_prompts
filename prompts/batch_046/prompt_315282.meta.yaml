  problem: ex ante, the post-apartheid state had a powerful interest in binding itself
  to non-prosecution in order to secure testimony that no other mechanism could extract;
  ex post, once disclosure had been given, the same state faced strong retributive
  and democratic pressures to prosecute regardless. Map the players precisely—the
  applicant, the victim-opponents, the amnesty committee, and the successor government
  that inherited the promises—identifying what each player''s options and payoffs
  were at the point of commitment and at the point of execution. Then assess whether
  the TRC''s procedural architecture—public hearings, adversarial victim participation,
  judicial review of applications, and the formal separation between amnesty and prosecution—functioned
  as a genuine commitment device that locked the state in, or whether it merely displaced
  the irrationality onto other actors (for example, by forcing victims to bear the
  cost of enforcement, or by allowing the state to honor the letter of amnesty while
