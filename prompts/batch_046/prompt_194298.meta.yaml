  typos):


  Appiah thinks honour drives moral revolutions, but he immediately mixes up honour-as-status
  with honour-as-accountability. In the duelling case, gentlemen stopped because they
  realised fighting made them look barbaric to outsiders — that''s clearly accountability,
  being judged from outside, which is actually closer to Williams. Williams says norms
  collapse when the prestige benefits no longer outweigh the social costs, and he
  applies this to slavery: planters kept it for status, but once industrial capital
  made slaveholding look backward, the benefit disappeared. So Appiah and Williams
  are really describing the same prestige-management mechanism, and the distinction
  between them is mostly artificial. Footbinding in late Qing China ended the same
  way — Chinese elites dropped it because Western merchants made them feel ashamed,
