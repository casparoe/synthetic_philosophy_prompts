  Question:

  "Reconstruct Jaegwon Kim''s causal exclusion argument as it applies to mental causation.
  Your reconstruction should make explicit the roles of (i) the causal closure of
  the physical domain, (ii) the supervenience of mental properties on physical properties,
  and (iii) the principle that a realized property inherits the causal powers of its
  realizer. Then explain why this argument specifically threatens downward mental
