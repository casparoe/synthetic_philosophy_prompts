  leaving open whether a parallel problem arises for horizontal mental-to-mental causation.
  Finally, evaluate whether a non-reductive physicalist can block the argument by
  denying that mental properties are sufficiently distinct from their physical realizers
  to generate genuine overdetermination, without thereby collapsing into reductive
  physicalism."


  Answer:

  "Kim''s exclusion argument is designed to show that non-reductive physicalism cannot
  consistently maintain both the causal closure of physics and the causal efficacy
  of mental properties. The argument begins with two premises that non-reductive physicalists
  typically endorse. First, causal closure: every physical event with a cause has
  a complete sufficient cause within the physical domain. Second, supervenience: mental
  properties depend on physical properties such that there cannot be a change in the
  mental without a corresponding change in the physical.


  The critical third premise is the principle of causal inheritance. This principle,
  which was first articulated by Donald Davidson in his 1970 essay ''Mental Events''
  as part of his defense of anomalous monism, holds that if a mental property M is
  realized by a physical property P, then M derives its causal powers entirely from
  P. Consequently, when P causes some physical effect E, and M is also instantiated,
  M does not contribute any independent causal force. If we allow M to cause E as
  well, we face systematic overdetermination—two distinct sufficient causes for one
  effect.


  Kim applies this specifically to downward causation, where a mental state is supposed
  to cause a bodily movement or a neural event. Because the physical realizer of that
  mental state already provides a sufficient physical cause for the bodily movement,
  the mental property is excluded from doing any causal work. The argument does not
  necessarily apply to horizontal mental-to-mental causation—say, one belief causing
  another—because in those cases we might still need mental descriptions to capture
  the pattern, especially if mental properties are not law-governed in the way Davidson
  suggested.


