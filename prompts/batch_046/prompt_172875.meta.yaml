  not ontologically distinct enough from their realizers to produce overdetermination.
  If mental properties are merely ways of describing the same causal process captured
  by physics, then there is no second cause. But this response risks collapsing into
  reductive physicalism or an identity theory, because it denies that mental properties
  have autonomous causal profiles. Alternatively, one might embrace overdetermination
  and treat mental and physical causes as complementary descriptions of a single causal
  pathway. Yet this seems to violate parsimony.


