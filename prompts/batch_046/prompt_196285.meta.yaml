  a lost fresco is a reproduction, lacking original value, despite being visually
  indistinguishable from what was lost. Fifth, she considers a ceramic vase shaped
  and glazed by an apprentice in the master''s workshop, then corrected in its final
  form and signed by the master, to be an original work of that master, not a workshop
  copy. Sixth, she treats a photograph composed and exposed by the photographer but
  printed entirely by an assistant in the darkroom as an original photograph by the
  photographer. Next week we will discuss a bronze sculpture cast directly from a
