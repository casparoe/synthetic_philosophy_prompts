  A colleague pressed me on the following argument about why human extinction is worse
  than the sum of the deaths it involves, and I cannot see the exit. The argument
  builds on what is sometimes called Scheffler''s afterlife conjecture — that part
  of the badness of extinction lies in the annihilation of future generations who
  would otherwise carry forward, reinterpret, and respond to our projects — but extends
  it with a claim about intergenerational addressivity.


  (1) Human extinction is specially bad beyond the deaths involved because it eliminates
  all future addressees: there will be no generations left to take up our projects,
  so the intergenerational meaning of present human endeavor collapses entirely.


  (2) For present projects to possess this kind of meaning, it is not enough that
  future people are likely; what matters is that there exists a modal possibility
  of agents who could address and continue our work.


  (3) Extinction removes that modal possibility altogether, which is why it destroys
  meaning categorically rather than merely reducing it.


  (4) Now introduce the Proportionality Thesis: whenever the probability of future
  addressees is reduced by some factor, the present intergenerational meaning of our
  projects is diminished by that same factor.


  (5) Any action that marginally lowers long-run human survival — voluntary childlessness,
  a slight increase in existential risk from a policy choice, or even high-carbon
  individual consumption that nudges climate-related risk upward — reduces that probability
  by a definite, if small, amount.


  (6) By (4) and (5), such actions diminish the present meaning of everyone''s projects
  in direct proportion to their marginal contribution to extinction risk.


  (7) Therefore, on this view, remaining childless is wrong not merely for private
  reasons but because it inflicts a quantifiable fraction of the meaning-loss that
  makes extinction catastrophic; ordinary reproductive and lifestyle choices carry
  moral weight scaled to existential risk.


  (8) But this proves too much: we do not treat a decision not to have children, or
  a modest carbon footprint, as bearing extinction-level moral gravity.


  (9) So one of the premises must go.


