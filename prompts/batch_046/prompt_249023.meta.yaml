  (1) Rousseau''s core objection is structural, not content-based: the theater institutionalizes
  a separation between appearance and being. The actor is paid to simulate passions
  he does not feel, and the spectator, seated in darkness and silence, enjoys the
  spectacle of virtue or vice without being required to practice either. The corruption
