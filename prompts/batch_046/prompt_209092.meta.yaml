  rather than transparent windows onto real mental qualities. The opposing camp holds
  that such properties are genuinely present and that any adequate account of mind
  must preserve their reality.


  What puzzles me is that both sides now share a remarkably stable common ground:
  they accept the same neuroscientific findings about reportability, change blindness,
  and the absence of any central Cartesian observer; they agree on the logical distinction
  between access consciousness and phenomenal consciousness; and they both acknowledge
  that subpersonal processes generate our first-person narratives. Yet neither side
  moves. The illusionists claim that this shared ground shows phenomenal talk is a
  kind of widespread cognitive error; the realists reply that it only shows our access
  mechanisms are fallible, not that the qualities they reveal are fictitious.


  My own suspicion — offered as a hypothesis to be tested rather than a conclusion
  — is that the disagreement has stalled because of conceptual slippage within the
  microdomain of first-person epistemology. Specifically, the illusionist seems to
  be treating "having a phenomenal quality" as a theoretical attribution made by a
  subpersonal reporting mechanism, whereas the realist treats it as a direct epistemic
  relation that requires no mediation; but both continue to use the same vocabulary
  — "experience", "appearance", "qualitative presence" — as if they were talking about
  one thing. I want to know whether this diagnosis is correct.


