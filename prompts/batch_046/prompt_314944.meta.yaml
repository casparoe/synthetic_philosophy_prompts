  well-known dismissal of philosophy as unnecessary for working scientists, Hawking''s
  public claim that philosophy has failed to keep pace with modern physics, and Feynman''s
  analogy comparing philosophers of science to ornithologists—studying the birds without
  being able to fly. Chen added that philosophical disputes, such as realism versus
  anti-realism about theoretical entities, appear to have no empirical consequences:
  no particle accelerator was ever redesigned because a philosopher resolved an ontological
  question.


  Second, Alvarez replied that this frames philosophy as a competitor to physics rather
  than as a conceptual clarifier. She introduced a distinction she said scientists
  constantly blur: that between phenomenological adequacy—whether a model predicts
  observable outcomes—and ontological commitment—whether the entities postulated by
  the model are taken to exist independently. She claimed this confusion is not merely
  semantic; in quantum information science, for instance, treating the wavefunction
  solely as a predictive instrument rather than as describing a physical state has
  led engineering teams to underestimate the resources needed for error correction,
