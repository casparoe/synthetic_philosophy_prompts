  Essay notes: ''Sandboxing the Artist — A Dependency-Isolation View''


  Thesis: The evaluation of an artwork''s aesthetic merit should be treated like running
  code in a sandboxed environment: the artifact should be assessed on its internal
  properties, and biographical moral information about the creator should be treated
  as an external dependency that is imported only if the work''s own structure explicitly
  requires it.


  Framework:

  - Layer 1 (Artifact): The work itself — its form, emotional structure, and internal
  coherence.

  - Layer 2 (Execution Context): The audience''s knowledge of the artist''s biography,
  including moral failures.

  - Layer 3 (Dependency Tree): The causal and intentional connections through which
  the artist''s actions are embedded in the work''s meaning.


  Argument:

  1. Moralism — the view that immoral art is necessarily worse art — typically operates
  by importing Layer 2 into Layer 1 without checking Layer 3. This is analogous to
  importing a library that the program never invokes: the corruption is present in
  the environment but does not affect the artifact''s execution.

  2. I distinguish two modes of importation. Explicit importation occurs when the
  work''s meaning depends on the immoral act (e.g., a propaganda piece that requires
  the author''s authority). Implicit importation occurs when the audience uses biographical
  knowledge to reinterpret an otherwise neutral work. Only explicit importation should
  affect artistic evaluation; implicit importation is a separate ethical decision
  about consumption, comparable to deciding whether to use open-source software whose
  maintainer holds objectionable views.

  3. I concede that autobiographical or confessional works collapse the sandbox, because
  Layer 3 is densely connected: the artist''s moral character is part of the work''s
  subject matter. I deny that this exception generalizes.

  4. I address the ''reward'' objection — that enjoying good art by immoral creators
  rewards them — by arguing that this concerns distributive ethics (who benefits from
  attention) rather than aesthetic evaluation. One can consistently judge a work excellent
  and still refuse to provide the artist with attention or revenue.


  Questions for feedback:

  - Is my characterization of moralism fair, or does the strongest version of moralism
  avoid the ''imported dependency'' error by arguing that moral flaws necessarily
  corrupt the work''s internal structure?

  - Does my distinction between evaluation and consumption ethics hold up, or is it
  an artificial separation?

  - Is the sandbox analogy more misleading than helpful, given that artworks are not
  executable programs and audiences are not isolated runtimes?


  Please provide your comments in a structured manner, addressing the three questions
  above in turn. Do not provide reading lists or citations. At the very end, on its
  own line, provide a one-sentence summary of your overall assessment, prefixed exactly
  with ''Summary: ''."


