  As a retired physicist who only recently began reading philosophy systematically,
  I have been trying to work through Gödel''s modal ontological argument on my own.
  I reconstructed what seems to be a valid extension of his axioms, but it yields
  a result I cannot accept: not merely that a God-like being exists necessarily, but
  that every contingent state of affairs is either necessary or impossible, leaving
  no real contingency at all. I want to know exactly where the reasoning breaks, and
  I want to preserve as much of Gödel''s framework as possible—especially the idea
  that necessary existence is a positive property and that consistency of the God-property
  implies actual existence.


  Here is the argument, numbered as I have it in my notes:


  (1) In Gödel''s system, for every property P, exactly one of P and its complement
  is positive, and not both.

  (2) If a property is positive, it is necessarily positive.

  (3) Necessary existence is a positive property.

  (4) Being God-like—call it G—is defined as having all and only the positive properties.

  (5) G is consistent (not self-contradictory).

  (6) Therefore, by Gödel''s proof, there necessarily exists an entity x such that
  Gx.

  (7) Now I introduce a further principle I will call modal saturation: if a being
  necessarily instantiates G, and omniscience (knowing every true proposition) is
  among the positive properties entailed by G, then for any world-accessible state
  S, the being''s knowledge of S in a world entails that the world-level property
