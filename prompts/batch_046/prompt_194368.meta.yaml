  Let''s craft the commitments carefully.


  Commitment list:

  (a) I think work is partly constitutive of human dignity — not just a means to money,
  but a way of being seen and seeing yourself as contributing.

  (b) I''m strongly in favor of automating dangerous, repetitive, and dirty labor,
