  outcome and expected outcome. In the RL agent, the reward prediction error is computed
  precisely as this relation: the temporal-difference error compares the received
  reward plus the discounted future value against the prior expectation. When this
  error is persistently negative, the agent''s value estimates are continuously revised
  downward, producing an adaptive pattern functionally analogous to harm-avoidance
  in biological organisms.


  Because the baseline is internal and dynamically updated, the agent maintains what
