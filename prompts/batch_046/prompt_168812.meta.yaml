  students, 90 minutes—on democratic legitimacy, and I want them to feel the circularity
  of the boundary problem rather than just hear it described. I''m calling the session
  "The Charter Game." Please design a runnable activity with rules, roles, and a debrief,
  plus an honest note on what it cannot reproduce.


  The setting: students have read standard introductions to the democratic boundary
  problem (who constitutes the demos that authorizes democratic decisions?), but they
  haven''t encountered any specific technical solution by name—no "all-affected-interests"
  principle named as such, no reference to Dahl or Goodin by citation. I want them
  to construct the paradox themselves.


  The activity: Divide the 16 students into four groups of four, each acting as a
  "Constituent Assembly" for a fictional shared governance body—call it the "Watershed
  Republic"—that controls a river system crossing generations and species lines. Each
  group receives a "Charter Kit": eight cards describing entities that might claim
  membership: current citizens, long-term resident non-citizens, a 16-year-old, a
  sleeping adult in a coma, a future child born in 2100, a non-human animal affected
  by pollution policies, an artificial system that manages water distribution and
  expresses policy preferences, and a corporation with legal personhood.


  Phase 1 (15 minutes): Each group must write one sentence—Article 1—defining who
  belongs to the demos, using exactly one criterion drawn from a sealed envelope they
  open together. The envelope offers six options, each phrased as a concrete test
  rather than an academic label: (a) born within the territory; (b) currently living
  there and contributing labor; (c) able to understand and respond to reasons about
  collective rules; (d) causally affected by the Assembly''s decisions; (e) able to
  give or withhold consent; (f) alive at the time of the decision. They must apply
  it consistently to all eight cards, placing each in "Member" or "Non-Member" piles.


  Phase 2 (20 minutes): Once every group has locked its piles, they exchange kits
  with another group and become "Challenge Councils." They receive a hidden "Shadow
  Card" describing an entity that is identical to one of their "Member" cards except
  for the property that distinguishes it according to their own criterion—e.g., if
  they picked (c), the shadow card is "the same sleeping adult, now permanently unconscious"
  versus "the same AI system, now running identical reasoning processes but lacking
  biological consciousness." The Challenge Council''s job is to argue that the original
  Assembly''s criterion either wrongly excludes an entity they included or wrongly
  includes an entity they excluded, using only the Assembly''s own logic.


  But here is the injection that should make the problem bite: after the challenge,
  each Assembly must revise Article 1, but they are now bound by the "Recursive Amendment
