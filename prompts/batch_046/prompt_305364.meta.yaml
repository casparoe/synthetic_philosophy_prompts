  Here is what I hold:


  (1) I take the central claim of Hofstadter and Sander''s Surfaces and Essences seriously:
  human cognition is not symbol manipulation or statistical learning but analogical
  mapping—understanding a novel situation requires projecting its relational structure
  onto a familiar domain and evaluating the structural fit. Without such mapping,
  there is no genuine conceptual grasp.


  (2) I believe large language models do not perform analogical reasoning in this
  sense. They compute token probabilities over surface statistical patterns in training
  data and never represent structural correspondences across domains.


  (3) From (2), I conclude that current LLMs lack conceptual understanding and genuine
