  where it must halt and hand the decision to a values committee because the issue
  is not resolvable by fact alone. The procedure should preserve the core consequentialist
  commitment — that the welfare at stake matters — while incorporating the demandingness
  constraint in a way that is not merely a rhetorical escape clause. To do this, build
  in a distinction between burdens that merely reduce welfare within a life-plan and
  burdens that fracture the life-plan itself (call this the ''integrity threshold''),
  and require that any burden above that threshold be justified by a non-substitutable
  institutional necessity.


