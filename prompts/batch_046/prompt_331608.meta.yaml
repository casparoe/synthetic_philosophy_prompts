  Let''s draft:


  "Keynes distinguishes between the probability of a proposition and the weight of
  the arguments bearing on it. Probability measures our rational degree of belief
  given the available evidence, while weight measures the absolute amount of relevant
  evidence—both for and against—upon which that belief rests. In the Treatise on Probability,
  Keynes argues that weight is not reducible to probability and does not always move
  in tandem with it: acquiring more evidence can leave the probability unchanged or
  even lower it if the new evidence is contradictory, yet the weight has clearly increased
  because the total body of knowledge is larger.


  Applying this to the central bank scenario: the bank faces contradictory signals—some
  indicators point to rising inflation, others to stagnation. The weight of the argument
  about future inflation is therefore high, because there is abundant but conflicting
  evidence. However, this high weight does not translate into greater confidence in
  any specific quantitative forecast. On the contrary, Keynes''s framework suggests
  that when weight is high but the evidence is discordant, the rational agent should
  recognize that precise numerical probabilities are unreliable. The bank should therefore
  not maximize expected utility over a single distribution; instead, it should adopt
  a convention—perhaps maintaining the current rate or following a heuristic—while
  holding liquid reserves as a precaution against error.


  Keynes''s notion of uncertainty, especially in his macroeconomic writings, extends
  this idea. Uncertainty is not merely risk with unknown probabilities; it refers
  to situations in which there is no scientific basis for forming any calculable probability
  at all. In such cases, rational action depends on conventions, animal spirits, and
  liquidity preference rather than on probabilistic reasoning. Thus, the central bank''s
  rational choice is guided by the weight of argument only in the negative sense:
  high weight with contradiction undermines the legitimacy of quantitative forecasting
  and pushes the agent toward defensive, liquid positions. The weight therefore functions
  as a brake on false precision rather than as a foundation for it."


