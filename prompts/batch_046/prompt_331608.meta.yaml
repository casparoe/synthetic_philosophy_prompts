  Question: In Keynes''s framework, the ''weight of argument'' is often contrasted
  with the ''probability'' of a belief. Explain how these two dimensions are supposed
  to interact when an agent faces a decision situation in which new evidence is ambiguous—specifically,
  a central bank that receives contradictory signals about future inflation but must
  set a policy rate today. In your answer, address whether an increase in the weight
  of argument necessarily implies an increase in confidence in any particular quantitative
  forecast, and whether Keynes''s notion of uncertainty allows for a rational choice
  that is not based on expected-utility maximization over a known distribution.


