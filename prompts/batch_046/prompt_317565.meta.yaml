  (1) Pascal holds that justice without force is powerless, and force without justice
  is tyrannical; therefore legitimate authority requires that justice and force be
  combined.


  (2) In any actual society, the available force is always embodied in particular
  institutions that have accumulated power over time—laws, hierarchies, and customs
  that represent irreversible investments of authority.


  (3) To combine justice with force, then, justice must attach itself to these particular
  existing institutions, not to an abstract ideal.


