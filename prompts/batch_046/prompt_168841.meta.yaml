  the question of scale, the student asserts that microhistory rests on an ontological
  claim: that historical reality is fundamentally composed of discrete individual
  actions, and that macro-structures such as states or economic systems are therefore
  merely heuristic aggregates lacking independent causal power. This overstates the
  microhistorical position. Practitioners generally treat scale reduction as a methodological
  choice—a way of testing macro-claims at ground level—rather than as a denial of
  structural causation.


  Second, regarding narrative form, the student argues that microhistorical writing
  is essentially literary fiction, designed primarily to evoke emotional sympathy
  rather than to establish causal or evidentiary claims. They conclude that this makes
  microhistory epistemically weaker than the quantitative serial history associated
  with the Annales school. This conflates rhetorical presentation with proof: defenders
  of microhistory typically maintain that narrative structure functions as a mode
  of evidentiary reasoning, not as ornamental fiction.


