  systematically exclude subaltern voices. However, they claim that microhistorians
  overcome this mainly by applying more intensive hermeneutic techniques—closer reading,
  thicker description—to the same bureaucratic records used by elite historians. This
  misses a crucial distinction: microhistory often relies on entirely different source
  genres—such as inquisitorial depositions, notarial contracts, parish registers,
  or court testimonies—to access lives that never entered state documentation. The
