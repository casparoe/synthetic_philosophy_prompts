  You are serving as an external examiner for an advanced undergraduate module on
  historiography, and I have asked you to evaluate a particular examination script
  because I am unsure whether I am being too generous with a student whose work feels
  superficially impressive. The topic has become personally relevant to me recently:
  I am assisting with the marking of papers on "History from Below and Microhistory
  versus the History of Elites and States" for the first time, and I find myself second-guessing
  my own grasp of the methodological boundary between reducing scale and abandoning
  structure.


  The examination question was as follows:


  "Compare the methodological commitments of microhistory—particularly as developed
  by Carlo Ginzburg and Giovanni Levi—with the longue durée and structural approaches
  associated with the Annales school and elite-centred state historiography. In your
  answer, address specifically: (a) the problem of scale and representativeness, including
  whether the ''exceptional normal'' dissolves or illuminates macro-patterns; (b)
  the epistemic status of narrative form in microhistorical writing, and whether it
  differs in kind from quantitative macro-analysis; and (c) how each tradition handles
  archival silence regarding subaltern actors, with particular attention to whether
  microhistory overcomes silence through hermeneutic intensity or through a different
  selection of source-types altogether. Conclude by assessing whether microhistory''s
  focus on individual agency ultimately undermines, complements, or remains incommensurable
  with structural explanations of state formation."


