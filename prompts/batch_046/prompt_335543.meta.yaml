  Argument about norms of assertion:

  1. If the norm of assertion is knowledge (KNA), then asserting p requires knowing
  p.

  2. If I assert p based on excellent but fallible evidence, and p is false, I violate
  the norm.

  3. But if the norm is belief (BAN), then I only need to believe p sincerely.

  4. Now consider lottery assertions: I have a ticket in a fair lottery with 1,000,000
  tickets. I don''t know I''ll lose, but I believe it.

  5. If I assert "My ticket will lose," under KNA I shouldn''t, but under BAN I can
  if I believe it.

  6. But now apply this to scientific testimony: a scientist asserts a theory based
  on strong evidence but not knowledge.

  7. If KNA is right, scientific testimony is widespread norm-violation.

  8. But scientific testimony is clearly appropriate.

  9. So KNA must be wrong, and the norm must be belief or perhaps justified belief.

  10. But wait: if the norm is belief, then I can assert "Vaccines contain microchips"
  if I sincerely believe it, which seems wrong.

  11. So the norm can''t be mere belief.

  12. Therefore we need a middle ground.

  13. But any middle ground (justified belief) allows lottery assertions if justification
  is present, which brings back the problem.

  14. So any norm either prohibits too much (KNA) or permits too much (belief).


