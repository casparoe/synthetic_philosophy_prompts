  Let''s draft:


  "I''m a third-year undergraduate in a seminar on rational decision theory, and we''ve
  been working through the logic of geometric rationality and the Kelly criterion—specifically,
  when maximizing the expected logarithm of a resource is justified over maximizing
  expected value or expected utility. Our professor has given clear verdicts on a
  range of cases, but I''m trying to determine what implicit principle is governing
  them.


  Here are the rulings so far. First, on a standard long-horizon investment problem
  with liquid, fungible capital and no absorbing bankruptcy condition, she endorsed
  full Kelly betting. Second, on an otherwise identical investment problem but with
  a hard legal floor—if net worth falls below zero the investor is permanently barred
  from future trading—she rejected Kelly and insisted on a conservative, utility-based
  criterion, arguing that multiplicative reasoning collapses once an absorbing boundary
  removes the agent from the sequence. Third, on a scientist allocating grant funding
  across independent, recoverable projects over a career with no institutional penalty
  for a failed project, she endorsed a Kelly-style allocation of research effort,
  treating career capital as multiplicatively compounding. Fourth, on a strategic
  interaction—specifically a repeated coordination game where one party''s loss reshapes
  the other party''s payoff matrix—she rejected geometric rationality altogether,
  saying that interdependence makes the multiplicative model inapplicable because
  one''s own growth rate is no longer an independent variable. Fifth, on an institutional
  endowment with perpetual horizon and no mandatory withdrawal schedule, she endorsed
  maximizing the geometric mean of real returns.


  The new case is this. A philosopher is deciding how to distribute her working time
  over the next ten years between writing a sequence of reliable, moderately successful
  books—low variance, linear accumulation of professional standing—and devoting a
  substantial block of time to a single, highly ambitious project that, if it succeeds,
  would fundamentally restructure her field''s conversation, but if it fails, would
  be largely ignored. Crucially, she can continue writing the reliable books after
  a failure; there is no absorbing boundary that ends her career. However, professional
  standing is not fungible: it does not divide like capital, and a failed ambitious
  project does not merely reduce a quantifiable stock but alters the qualitative conditions
  under which her future work is received.


  What should our professor say about this philosopher''s allocation? Is it a case
  for geometric rationality—treating reputation as multiplicatively compounding and
  therefore allocating time according to a Kelly-like rule—or does the non-fungibility
  and qualitative structure of intellectual reputation place it outside the domain
  entirely? Which of the earlier cases is the closest analog—the recoverable career
  capital case, or perhaps the strategic-interdependence case if we treat the academic
  field as a responsive environment? More generally, I want to know which rule best
  fits all five verdicts—perhaps one that restricts Kelly to quantifiable, fungible
  resources regardless of compounding, or one that permits it whenever outcomes are
  multiplicatively structured and recoverable regardless of fungibility—and which
  further case would definitively separate those two rules. I''m less interested in
  a bare label than in the carving: exactly where the boundary lies, what the philosopher''s
  case is not, and what principle we would be adopting either way."


