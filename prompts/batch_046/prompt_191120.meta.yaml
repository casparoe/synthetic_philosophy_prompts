  propositional attitudes that justify or explain the practice.


  The critical point is not that belief is absent, but that it is not the necessary
  substrate of every material regularity. A pottery workshop might reproduce a spiral
  motif for generations because the form regulates hand-movement and kiln-loading,
  not because artisans subscribe to a cosmology. The motif leaves a robust archaeological
  trace, yet there may be no corresponding ''belief'' to excavate—only a habituated
  body-object assemblage.


