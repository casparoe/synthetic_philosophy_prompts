  Question: Three prominent physicists—Steven Weinberg, Stephen Hawking, and Richard
  Feynman—have each voiced skepticism about philosophy''s value for science, though
  their objections differ in target and tone. Weinberg, in his 1992 book Dreams of
  a Final Theory, argues that philosophers have consistently failed to provide useful
  guidance for working physicists and that some philosophical doctrines (such as logical
  positivism) have actively obstructed scientific reasoning. Hawking, in The Grand
  Design (2010, co-authored with Leonard Mlodinow), declares that philosophy is dead
  because it has not kept pace with modern physics and that physics now answers questions
  that once belonged to philosophy. Feynman, in remarks often summarized by an analogy
  to ornithology—philosophy of science being about as useful to scientists as the
  study of birds is to birds—suggests that scientists need no external philosophical
  commentary on their methods.


  Against these criticisms, philosophers have offered at least two major defenses.
  The first is conceptual clarification: philosophers analyze the interpretations
  of quantum mechanics, the nature of spacetime singularities, and the meaning of
