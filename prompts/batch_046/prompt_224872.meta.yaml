  As a retired biologist who has recently taken up philosophy in earnest, I have been
  attending a small discussion group where we read classic and contemporary texts
  without an instructor. At our last meeting, two members—Elena, a historian of science,
  and Marcus, a logician—debated whether philosophy makes progress in anything like
  the sense that natural science does. I am reporting their exchange exactly as it
  unfolded, because I could not adjudicate it and want an outside assessment.


  Elena opened with the familiar objection: philosophy''s central questions—what justice
  requires, whether consciousness is physical, whether free will exists—have been
  contested for millennia without convergence. In biology, by contrast, we do not
  still seriously debate spontaneous generation or the inheritance of acquired characteristics;
  those views were abandoned because evidence accumulated against them. Philosophy,
  she argued, exhibits "conceptual sedimentation" rather than progress: old answers
  rarely die; they sink into the background and become invisible premises. For example,
  the Cartesian framing of mind-body interaction is no longer defended, yet it still
  structures the way we pose the problem of consciousness, so we mistake an inherited
  framing for neutral ground. Without an empirical filter, philosophical change is
  not rejection but burial, and burial is not progress.


  Marcus replied that this misdescribes the dynamics. Philosophy does not need empirical
  falsification to progress; it needs the refinement of distinctions and the elimination
  of pseudo-problems. He granted Elena''s point about sedimentation but reinterpreted
  it: in biological taxonomy, Linnaean categories were not "falsified" in the laboratory;
  they were superseded by phylogenetic classification, yet we rightly call that progress.
  The old taxonomy is not buried garbage but soil—the conceptual ground from which
  better questions grow. Similarly, the shift from substance dualism to functionalist
  and embodied frameworks is progress precisely because the older framing is now visible
  as one option among others, constrained by argument rather than experiment.


  Elena countered that the analogy fails. Taxonomic revision is guided by predictive
  and explanatory success—phylogenetic trees predict genetic similarities and fossil
  distributions—whereas philosophical "sedimentation" lacks any comparable external
  check. Functionalism gained ground not because it solved a predictive puzzle but
  because it aligned with the rise of cognitive science; its victory was sociological,
  not epistemic. If philosophy''s shifts are driven by disciplinary fashion rather
  than argument-driven failure modes—contradiction, infinite regress, or inability
  to distinguish—then calling them progress is merely relabeling historical drift.


  Marcus conceded that sociology plays a role, but insisted that arguments have their
  own failure modes. A framework that generates internal contradictions or collapses
  distinctions that matter for practice is not merely unfashionable; it is defective.
  Philosophy progresses when a framework avoids these failures with greater coherence
  and scope than its rivals, even if both survive. The absence of a single decisive
  experiment does not entail the absence of rational constraint.


  They then asked me to referee. Please adjudicate their dispute point by point: on
