  Consider the following conceptual setup, which I take to be a natural extension
  of the standard two-dot color-phi paradigm but one that introduces a dissociation
  rarely discussed in introductory treatments. Imagine a rapid sequential display:
  a red dot at position X at t = 0 ms, a green dot at position Y at t = 150 ms, and
  a blue dot at position Z at t = 280 ms, with inter-stimulus intervals that fall
  within and then just outside the typical temporal binding window for conscious motion
  integration. In one task condition, subjects report the subjective trajectory, and
  most describe a smooth chromatic transition—red through yellowish-green to blue—passing
  through intermediate positions. In a second, interleaved task condition using an
  identical physical sequence but with a rapid forced-choice cue presented at exactly
  t = 160 ms, subjects must identify whether the second dot was green or yellow; here,
  accuracy remains high for green, with no systematic confabulation of an intermediate
  hue.


