  A colleague of mine attended a seminar where two philosophers, Sam and Jordan, argued
  about what social construction actually requires in the case of money. Here is how
  their exchange went, as she reported it.


  (1) Sam opened by saying that money is whatever a community treats as a medium of
  exchange, store of value, and unit of account. Therefore, if a closed virtual economy
  of ten thousand users collectively treats an AI-generated token called "glimmer"
  exactly as they treat pounds sterling — pricing goods in it, saving it, settling
  debts with it — then glimmer is money, full stop. There is no hidden natural kind
  "moneyness" waiting to be discovered; the construction is purely collective acceptance.


  (2) Jordan replied that this confuses "functioning as money" with "being money".
  Social construction does not mean arbitrary collective labelling; it means the kind
  is constituted by institutional facts that depend on collective intentionality embedded
  in rules. Without an institutional framework that assigns status-functions — legal-tender
  status, banking regulations, norms of enforcement — glimmer is only a token that
  behaves like money, not money itself. Jordan compared it to a perfect counterfeit
  note: it functions identically in transactions but lacks the right institutional
  pedigree.


  (3) Sam countered that Jordan smuggles in a statist definition of money, which is
  historically false. Cowrie shells and Rai stones functioned as money without central
  banks or legal codes. If Jordan demands state-like institutions, then large parts
  of economic history are misdescribed.


  (4) Jordan clarified that she does not require a state, only a normative framework
  — rules of exchange, social sanctions for fraud, and collective recognition of a
  status-function. Cowrie shells had precisely these: norms about shell purity and
  penalties for counterfeit shells. The point is that there must be normative structure,
  not merely behavioural regularity. Sam''s "treatment" view cannot distinguish genuine
  money from a popular collectible card that happens to be traded for goods; the missing
  element is collective recognition of a status-function assigned to the object.


  (5) Sam then argued that Jordan''s view makes social construction mysterious. It
  sounds as though there is a hidden "institutional essence" just as fixed as any
  natural essence. If construction is genuinely social, then the community''s practices
  should be sufficient; otherwise we are back to essentialism with extra steps.


  (6) Jordan responded that this is not essentialism but relational constitution.
  The kind exists in virtue of relations to other institutional facts — contracts,
  property law, debt structures — not in virtue of an intrinsic nature. Sam''s purely
  behavioural view misses these relations and therefore cannot explain why hyperinflation
  destroys the money-ness of a currency rather than merely reducing the value of a
  natural kind.


