  sustained orientation in which the present community structures its practices (education,
  ritual, public space, legal framing) around an unmediated relation to the event,
  so that the victims remain present as living interlocutors rather than as settled
  historical entries. On this view, propositional memory without such indexical commitment
  is a form of moral failure, because it converts an open claim into a museum piece;
  conversely, strategic forgetting is permissible only if it leaves the indexical
  link intact, and any dissolution of that link constitutes not therapeutic release
  but a second moral injury.


