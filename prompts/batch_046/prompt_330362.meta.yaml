  was genuinely up to chance, not your lesser worth". And if there were a hundred
  on one side and one on the other, you''d still have no aggregative reason — you''d
  just have a hundred separate reasons, and you''d randomise or pick arbitrarily.
  The number never becomes a weight.


  Sam: That seems absurd though — between a hundred and one, randomising feels obviously
  wrong. Doesn''t that prove the numbers must matter at least for breaking ties?


  Jordan: Not necessarily. It just proves we''re psychologically biased toward big
