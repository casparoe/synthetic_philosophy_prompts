  between two people in our study group, Sam and Jordan, who were going at it about
  Taurek''s claim that there''s no special reason to save five over one. They weren''t
  just repeating the textbook stuff though — they got into this weird but interesting
  point about whether saving the many is only okay if you randomise, and whether "expected
  lives saved" is just smuggling aggregation back in.


  Anyway, here''s roughly how it went:


  Sam: Look, if you can save five people or one person, and you pick the one, you''ve
  let four people die for no reason. The numbers obviously count — five lives are
  worth more than one.


  Jordan: That''s exactly the mistake Taurek points out. You have a reason to save
  each person individually, but those reasons don''t stack up like coins. Saving the
  five doesn''t outweigh saving the one; it just means you''ve got five separate obligations
  and one separate obligation. The one person you leave behind can ask "why not me?"
  and "because there were five others" isn''t an answer addressed to them.


  Sam: But then if you flip a coin between the group of five and the single person,
  you''ve given everyone an equal shot. That respects equality. The problem is that
  you might then save only one when you could definately have saved five. So ex ante,
  you''re trading a 50% chance of saving five lives for a 50% chance of saving one.
  That can''t be right.


  Jordan: You''re sneaking aggregation back in through "expected value". Moral reasons
  don''t work like betting odds. From the perspective of the one left behind, it doesn''t
  matter that there was a coin flip — they''re still dead, and you still had a direct
  reason to save them specifically. The fact that you also had reasons to save others
  doesn''t dilute your reason to save this one.


  Sam: Okay, but in real triage doctors save the many all the time. Are they all wrong?
  And if I save the five, I''m not harming the one — the situation does that. I''m
  just not helping. So I''m not wronging anyone.


  Jordan: Not harming isn''t enough when you can help. But more importantly, you keep
  saying "numbers count" like it''s self-evident weight. I think the real issue is
  justification: you can''t justify leaving the one behind to their face by saying
