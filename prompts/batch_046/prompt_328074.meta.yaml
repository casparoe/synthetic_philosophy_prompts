  decision, a rational agent still faces no incentive to pay, and if she anticipates
  her own future defection, the driver will not find her credible in the first place.
  (3) The first replied that this objection presupposes a time-slice conception of
  rationality; she proposed instead that rationality should be evaluated over an agent''s
  entire deliberative history, so that adopting and maintaining a commitment-rule
  can itself be rational even when particular acts of compliance seem locally suboptimal.
