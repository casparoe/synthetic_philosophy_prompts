  background ontology, and such models should be rejected for explanatory purposes
  regardless of predictive success.


  (4) I maintain that predictive success across diverse, out-of-sample domains is
  the ultimate arbiter of model quality in every science; if a fictionalized model
  consistently outperforms its idealized rivals, we should interpret the false ontology
  not as a defect to be eliminated but as revealing a deeper structural feature of
  the target system.


