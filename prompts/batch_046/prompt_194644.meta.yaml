  For a discussion group I have been asked to set out my philosophical commitments
  on knowing-how and knowing-that, so that others can test their consistency. Here
  is my profile.


  I hold that knowing-how is irreducible to knowing-that: practical competence is
  a distinct cognitive kind, not a species of propositional knowledge. I extend this
  to mental skills—I think there is knowing-how involved in directing attention, suppressing
  a belief, or adopting a phenomenological stance—not only in physical actions like
  swimming or playing an instrument. I also hold that every genuine instance of knowing-how
  involves phenomenal concepts: there is something-it-is-like to execute the skill,
  and this phenomenal character is essential rather than incidental. At the same time,
  I maintain that phenomenal concepts are genuinely conceptual representations, but
  they are non-propositional: they present a quality rather than describing it under
  a mode of presentation. From this I derive that knowing-how is not articulable in
  principle, whereas knowing-that always is, at least in principle. I deny that unconscious
  processes—such as subliminal perceptual learning or automated reflex arcs—can exhibit
  knowing-how, precisely because they lack phenomenal accessibility. I accept that
  there are clear cases of knowing-that without knowing-how, for instance knowing
  the molecular structure of water without being able to purify it. Finally, I hold
  that a being could display perfectly skillful behavior—say, an expert chess player''s
  moves—without possessing knowing-how, provided that being entirely lacks the relevant
  phenomenal concepts.


  Please audit this set. Which pairs of commitments are in genuine tension, which
  only appear to conflict but dissolve on inspection, and how severe are the real
