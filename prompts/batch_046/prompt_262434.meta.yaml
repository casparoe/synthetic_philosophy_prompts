  reason through the problem carefully and step by step.


  I am a software engineer with no formal background in philosophy, but I have been
  thinking about moral responsibility through the lens of system architecture and
  control flow. I want to know whether my intuitions about a set of concrete cases
  can be captured by a single principle, or whether I am forced to abandon some of
  them.


  Here are my verdicts on five scenarios. In each case, the agent makes the choice
  that is, by ordinary standards, the right one—except in Case 4, where she makes
  the wrong one.


  Case 1 — The hidden audit protocol. Maria, a data analyst, decides to report her
  findings honestly. Unbeknownst to her, her employer has deployed an automated correction
  algorithm that would have intercepted and rewritten any falsified report with near-certainty.
  Maria knows nothing of this system. Verdict: Maria is fully morally responsible
  for her honest report, even though she could not have successfully lied.


