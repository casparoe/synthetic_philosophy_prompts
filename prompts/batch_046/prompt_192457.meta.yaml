  Answer draft:


  "(a) Natural knowledge is God''s cognition of all necessary truths and of every
  possible world and creature; middle knowledge is his grasp of counterfactuals of
  creaturely freedom—what each free agent would do in every possible circumstance—logically
  situated between natural and free knowledge; free knowledge is his knowledge of
  the actual world that results from his creative decree.


  (b) Counterfactuals of creaturely freedom are subjunctive conditionals of the form
  ''If agent S were in circumstances C, S would freely perform action A.'' Molina
  holds they are contingent because the agent retains libertarian freedom in those
  circumstances—S could do otherwise—yet they are true prior to any divine decision.
  God knows them not by observing actual worlds, since many are never realized, but
  through a kind of modal scanning of the entire space of possible worlds, seeing
  which propositions hold at each world-index.


  (c) The grounding objection, prominently developed by Thomas Flint, asks what makes
  these pre-volitional counterfactuals true if neither God''s will (which comes after)
  nor the actual world (which is not yet fixed) provides their ground. The standard
  Molinist reply is that God knows them through his supercomprehension of each creature''s
  essential properties: the counterfactual is grounded in what the creature essentially
  is, so that God reads off the outcome from the essence itself without imposing it.


  (d) In world W, God weakly actualizes S''s refusal: he brings about the circumstances
  C and the truth of the counterfactual, but he does not cause the refusal itself,
  which flows solely from S''s will. Because God selects W precisely because the counterfactual
  obtains there, his choice is constrained by the pre-volitional truths, yet this
  does not compromise omnipotence—he remains free to actualize any world whose counterfactual
  profile he approves. The refusal is therefore not deterministically produced, though
  God can be said to cause the counterfactual to hold by his decree to actualize W,
  which secures the outcome within his providential plan without touching S''s internal
  freedom."


