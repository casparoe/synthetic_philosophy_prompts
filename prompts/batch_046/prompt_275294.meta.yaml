  is valuable only insofar as it operates in one of three metabolic modes—monumental
  (inspiring action through exemplary greatness), antiquarian (preserving continuity
  through faithful preservation), and critical (liberating the present by breaking
  with the past)—and each mode becomes toxic when overdosed, producing respectively
  heroic inflation without agency, archival paralysis without change, and destructive
  negation without reconstructive replacement. To operationalize this, the board treats
  every proposal as competing for collective attention across three measurable axes:
  agonic charge (the monumental demand), archival fidelity (the antiquarian demand),
  and negation half-life (the critical demand, defined as the explicit timeline within
  which destructive framing must yield a constructive alternative). A proposal is
  life-serving only if no single axis exceeds its compensatory threshold without proportional
  support from the others.


