  First, the sharp rise in Dissociative Identity Disorder (DID) diagnoses in North
  America during the 1980s and 1990s. After DSM-III recognized the category and popular
  media circulated vivid portraits of "alters," clinicians began seeing patients whose
  symptom profiles closely matched those portraits—including amnesic barriers and
  distinct personality states that seemed almost theatrical. I think this is a paradigmatic
  looping effect: the classification provided a script that shaped the phenomenology
  of distress.


  Second, the recent surge in adult ADHD diagnoses, especially among women, following
  the broadening of DSM-5 criteria and widespread social-media awareness campaigns.
  Many newly diagnosed adults report that they recognized themselves in online symptom
  descriptions before seeking clinical evaluation. Here my verdict is different: I
  think this is mostly a case of an underrecognized natural kind finally being seen,
  not a looping creation. The neurodevelopmental profile was present; the label merely
  revealed it, even if awareness campaigns accelerated recognition.


  Third, the removal of homosexuality from the DSM-II in 1973 after activist pressure.
  Once delisted, the clinical phenomenon of "ego-dystonic homosexuality" lingered
  briefly and then effectively vanished. I do not call this looping. It seems to me
  a normative correction: the category was socially harmful and scientifically spurious,
  and its removal eliminated a false classification. That said, I grant that the prior
  diagnosis may have looped back to produce shame and distress.


