  by the marketing of SSRIs that targeted it. Prevalence estimates exploded once the
  diagnosis was available and pharmaceutical campaigns framed ordinary shyness as
  pathology. I judge this not looping but "disease mongering": the category was engineered
  to match a treatment, and while sufferers are real, the specific diagnostic shape
  seems commercially sculpted rather than phenomenologically stabilized by patient
  interaction.


  Fifth, the Japanese phenomenon of hikikomori—severe, prolonged social withdrawal—first
  clinically described in the 1990s and now recognized globally. Some clinicians report
  that patients present with remarkably consistent narratives about family dynamics,
  duration of withdrawal, and subjective justification, as if the clinical portrait
