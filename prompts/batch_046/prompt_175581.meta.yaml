  I am currently drafting an ethical charter for a cooperative housing collective,
  and a recent dispute has made the philosophy of promissory obligation urgently personal.
  One member made a verbal commitment during a general meeting to oversee maintenance
  of our shared workshop tools for a fixed two-year term; six months later she withdrew,
  citing an unforeseen career relocation, leaving the remaining members with unplanned
  repair costs and scheduling gaps. The conflict is not primarily about legal enforcement—there
  was no contract—but about what kind of moral fact, if any, her utterance created,
  and whether the guilt she reports and the resentment others feel are rational responses
  or merely social conditioning.


  To clarify the conceptual landscape for the charter’s dispute-resolution clause,
  please construct a decision-tree taxonomy of the positions on why promises bind.
  Build it from the logical space rather than from a catalog of philosophers: begin
  with branching questions that a person could answer about concrete cases without
  knowing the theoretical labels, then locate named positions at the leaves.


  Structure the tree with the following nodes and splits. At the root, ask whether
  a promise generates an obligation by exercising a normative power—that is, by the
  promisor’s act of creating a reason that did not previously exist—by protecting
  reliance interests that would have been harmed regardless of the utterance, or by
  sustaining a cooperative social practice whose value depends on general compliance.
  From each of those three branches, split on whether the obligation survives a substantial
  and unforeseeable change in the promisor’s circumstances—specifically, the career-relocation
  case—without being dissolved. From each resulting branch, split on whether breaking
  the promise leaves a residual moral duty—what I will call a promissory residue—such
  as an obligation to apologize, to compensate for costs incurred, or to provide a
  public explanation, or whether the breach fully extinguishes the commitment with
  no remainder.


  Each leaf should carry one of the following: (i) a named position (for example,
  the normative-power view, the expectation-reliance view, the social-practice or
  conventionalist view, or a hybrid you identify); (ii) the label “unnamed” if the
  combination of answers is logically coherent but apparently unoccupied; and (iii)
  a single sentence describing its most awkward commitment in the context of a small
  cooperative with limited resources and high interpersonal trust.


  Please flag any pair of leaves that your tree cannot genuinely separate—where two
  distinct philosophical views collapse onto the same pattern of answers to your diagnostic
  questions. Also identify any unoccupied combinations, and for each state briefly
  whether the gap is best explained by incoherence, by practical unattractiveness,
  or by mere philosophical neglect.


  To prevent the taxonomy from becoming a bibliographic exercise, do not organize
