  "I have recently been appointed to a community restorative-justice panel, and our
  deliberations have made me acutely aware that we invoke ''taking responsibility''
  in two incompatible registers: we treat the offender as the origin of the harm,
  yet we also treat accountability as a social standing that does not require the
  offender to have authored their own character. This tension has led me to propose
  a one-semester independent study (approximately 7,000 words) on the following question:
  Does Galen Strawson''s Basic Argument against moral responsibility succeed only
  against a ''source-responsibility'' conception that requires being causa sui, and
  if so, does a distinct ''standing-responsibility'' conception — according to which
  being a legitimate target of reactive attitudes depends on relational and institutional
  conditions rather than on metaphysical self-origination — survive the argument intact?


  The existing literature largely treats Strawson''s regress either as a decisive
  refutation of ultimate responsibility (pushing toward revisionism) or as something
  to be dissolved by compatibilist distinctions between guidance control and regulative
  control. What these responses leave open is whether the argument''s premise — that
  true moral responsibility requires being the ultimate cause of oneself — already
  embeds a particular, contestable model of agency: the isolated, diachronic individual
  as the sole locus of responsibility. If responsibility is instead understood as
  a distributed social practice, the regress may show only that no individual is a
  causa sui, not that no one can occupy the normative standing of being held responsible.
  The question is therefore whether the Basic Argument collapses these two dimensions,
  and whether separating them yields a coherent position that is neither standard
  compatibilism (which often retains source-language) nor revisionism (which abandons
  desert).


  My approach will be conceptual rather than historical. I will first reconstruct
  the Basic Argument with explicit attention to where the causa-sui requirement enters,
  distinguishing metaphysical origin from normative standing. I will then examine
  whether institutional analogies — such as the authority of a judge or the obligations
  of a parent — demonstrate that one can bear a responsibility-status without being
  the self-created origin of that status, and whether this model can be extended to
  moral agency without reducing responsibility to mere social utility. Finally, I
  will test whether the resulting ''standing-responsibility'' view can account for
  the intuitive force of Strawson''s examples (e.g., the wrongdoer who was shaped
  by abusive upbringing) without requiring the impossible condition of self-creation.


  A successful result would be a clearly articulated framework that either (i) shows
  that Strawson''s argument applies with equal force to standing-responsibility, thereby
  strengthening the case for revisionism, or (ii) demonstrates that standing-responsibility
  is conceptually independent and can be justified through the internal logic of reactive
  practices rather than through metaphysical self-origination, thereby carving out
  a middle path. The project fails if the distinction between source and standing
  collapses into either standard compatibilism or pure social constructivism, or if
  it turns out that all normative standing necessarily presupposes some form of origin-responsibility
  after all.


  Given the one-semester scope, I will limit the analysis to Strawson''s core argument
  and its immediate conceptual neighborhood, without attempting a full history of
  free-will debates or an empirical study of restorative-justice practices. I will
  fill in citations to primary and secondary texts myself. The deliverable should
  be useful precisely because it addresses a live tension in practical moral deliberation
  — how to honor both the reality of formative circumstances and the legitimacy of
  holding people to account — without requiring either metaphysical miracles or the
  abandonment of desert."


