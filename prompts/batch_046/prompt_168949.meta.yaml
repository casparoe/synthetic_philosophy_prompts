  Read the 1999 film The Matrix as an extended thought experiment about the ontology
  of virtual objects and the reality of virtual harms. I am especially interested
  in avoiding the usual Platonic-cave framing; instead, treat the Matrix as a case
  of what we might call ontologically hybrid harm — damage that is causally mediated
  through a virtual environment but produces real-world bodily or psychological effects
  in the user, rather than damage that is either purely virtual or purely physical.


  Consider three moments: Cypher’s choice to return to the simulation for the taste
  of virtual steak despite knowing it is unreal; the rule that death in the Matrix
  kills the real body because, as Morpheus puts it, the body cannot live without the
  mind; and the repeated scenes in which characters suffer injuries inside the simulation
  that manifest physically outside it (nosebleeds, bruises, death). Does the film
  treat these as genuine harms to real persons, or as illusory harms to virtual avatars?
  Where does it distinguish between harming the avatar (a digital object) and harming
  the embodied user?


  Then take the philosophical idea seriously in both directions. On one side, a virtualist
  might argue that the steak has no properties that depend on its virtual substrate
  — it is not made of atoms — and therefore Cypher’s pleasure is directed at a non-existent
  object, making his choice irrational unless we allow that phenomenological satisfaction
  can be real even when its object is not. On the other side, an anti-virtualist about
  harm might insist that harm requires the destruction or impairment of a real entity;
  since the avatar is just data, being shot in the Matrix is no more harmful than
  deleting a file, and the real harm only occurs if the brain is physically affected.
  Does The Matrix endorse one of these views, or does it dramatize a third option:
  that virtual harms are real precisely because they are relationally and causally
  embedded in the user’s real-world embodiment?


