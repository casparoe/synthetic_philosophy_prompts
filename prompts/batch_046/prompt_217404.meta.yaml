  self-governance. The appearance of a shared debate is produced by ambiguous terms
  like "social cohesion" and "common morality," which function descriptively in Hart''s
  framing and normatively in Devlin''s.


  What kind of disagreement is this, actually? Is there a hidden empirical question
  about the relationship between legal prohibition and social stability that has been
  obscured by normative rhetoric? Or is the impasse a sign that the concept of "legal
  moralism" bundles together two distinct institutional justifications—structural
