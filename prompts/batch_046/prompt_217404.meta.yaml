  In the long-running exchange between H.L.A. Hart and Lord Devlin over the Wolfenden
  Report''s recommendation to decriminalize private homosexual acts and prostitution,
  the standard narrative is familiar: Hart insists that law should be limited to preventing
  harm to others, while Devlin argues that society may legitimately use law to enforce
  shared morality because a common moral code is necessary for social cohesion. Yet
  for all the commentary, a particular strand of the disagreement seems frozen. Devlin''s
  defenders often read his "social fabric" claim as a normative thesis about democratic
  self-definition—the idea that a polity has a right to preserve its moral identity—while
  Hart and his successors treat it as an empirical prediction that societies disintegrate
  when shared moral norms erode. Meanwhile, a less discussed distinction has begun
  to emerge in recent discussions: what we might call "structural moralism," according
  to which legal prohibition is justified only when a moral norm functions as a coordination
  mechanism necessary for basic social cooperation, versus "expressive moralism,"
  according to which the law may prohibit conduct solely to register collective moral
  disapproval, regardless of any coordination function. The stall, as I see it, is
  that critics of Devlin tend to attack structural moralism on empirical grounds—pointing
  out that societies tolerate deep moral disagreement without collapse—while defenders
  retreat to expressive moralism, which does not depend on empirical predictions about
  disintegration but on a claim about democratic authenticity. But this retreat is
  rarely made explicit, so the debate cycles between an empirical dispute that seems
  answerable and a normative dispute about the legitimacy of collective moral expression
  that seems incommensurable with liberal harm-based reasoning.


  My working hypothesis is that the disagreement is not primarily about facts—no study
  of social cohesion is going to resolve it—nor is it merely verbal, since both sides
  genuinely disagree about what justifies coercive law. Rather, I suspect that Hart
  and Devlin are answering different questions under the single heading "legal moralism":
  Hart asks what limits liberal neutrality places on state coercion, while Devlin
