  My friend offers the following chain against naive realism and in favor of a strong
  form of disjunctivism that, she claims, actually dissolves illusion altogether.
  She thinks it proves too much, and wants to know which step to abandon.


  (1) Disjunctivism holds that a veridical perception of x and a hallucination of
  x are mental events of entirely disjoint kinds: call them P-events and H-events,
  with no shared phenomenal core.

  (2) If two mental events belong to disjoint kinds, then there is no intrinsic phenomenal
  property F that both instantiate in virtue of which they feel alike.

  (3) Now suppose, for reductio, that a hallucination could be subjectively indistinguishable
  from a veridical perception. Then there must be some phenomenal respect in which
  they match—namely, they both feel like seeing x.

  (4) But by (2), no such matching phenomenal property exists across P and H. So the
  supposition in (3) is contradictory.

  (5) Therefore it is conceptually impossible for a hallucination to be subjectively
  indistinguishable from a corresponding perception.

  (6) But the argument from illusion depends precisely on the claim that hallucination
  and perception can be subjectively indistinguishable.

  (7) Hence the argument from illusion is not merely answerable but conceptually incoherent;
  and further, since all perceptual error requires that a non-veridical state be taken
  for veridical, there can be no perceptual error at all.


