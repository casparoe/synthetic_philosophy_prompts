  Lucas-Penrose side treats this gap as decisive: if a human mind can see that a formal
  system F is consistent, and if the mind were merely the execution of F, then the
  mind could not reliably produce that very judgment, since F cannot prove its own
  consistency. The mechanist critics reply that this argument covertly assumes human
  reasoning operates as a single, globally consistent formal program—a "unitary formalization"—rather
  than as a distributed, context-sensitive patchwork of locally consistent modules
  that revise and replace one another. After months of discussion, neither camp has
  moved, despite shared agreement on the mathematics and on the psychological observation.


  My own suspicion is that the stall is not empirical but architectural: the two sides
  may be answering different questions under the single heading of "mechanism." One
  side asks whether there exists any formal system that fully captures human mathematical
