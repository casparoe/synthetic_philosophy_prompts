  I have been in a long, unresolved argument with a close friend about whether moral
  responsibility can ever be ultimate, and we kept circling back to the idea that
  no one can be causa sui—fully the cause of oneself in a way that would ground ultimate
  desert. She was persuaded by Galen Strawson''s Basic Argument that this generates
  a regress that makes true moral responsibility impossible, but I kept feeling that
  the argument assumes a particular image of the agent as a kind of bounded, pre-social
  substance whose mental properties must be self-authored if they are to count as
  genuinely hers. I want to turn this tension into a focused research proposal for
  a four-month independent philosophical project. The precise question is whether
  Strawson''s Basic Argument depends on an implicit atomistic ontology of agency—one
  that individuates the agent prior to and independently of social practices—and whether
  relational or distributed accounts of agency, on which social roles and institutional
  frameworks partly constitute who the agent is and what capacities she has, can block
  the argument without resorting to the usual compatibilist strategies about control
  and identification. I will not be asking for empirical data or citation lists; what
  I need is a conceptual reconstruction that maps the logical structure of the Basic
  Argument onto different ontologies of the self.


  The existing literature treats the argument primarily as a challenge to libertarian
  and compatibilist theories of free will, asking whether determinism or indeterminism
  can satisfy the demand for self-creation, but it rarely examines whether that demand
  itself presupposes a specific, philosophically optional picture of personal boundaries.
  Relational theories of agency are well developed in social ontology and feminist
  philosophy, yet they are seldom brought into direct contact with the free-will debate
  as a potential response to Strawson. My method will be conceptual analysis over
  four months: in the first month I will reconstruct the premises of the Basic Argument
  with special attention to how the agent and her properties are individuated; in
  the second month I will articulate two or three relational or practice-constituted
  models of agency; in the third month I will test whether these models can absorb
  or deflect the self-creation demand—perhaps by relocating it onto the social framework
  rather than the individual—or whether they instead collapse into compatibilism or
  hard determinism; in the final month I will write up the result. A successful outcome
  would be a clear determination that either the Basic Argument is ontologically neutral
  and applies regardless of how we conceive agency, or that it has a hidden internalist
  commitment that significantly limits its scope and opens space for an alternative
  response. The project fails if the reconstruction reveals no such hidden premise,
  or if relational agency turns out to be irrelevant to the moral-responsibility debate.


  Please frame this as a proposal with a precise statement of the open question, why
