  ---


  Design a 75-minute seminar activity for about 16 advanced undergraduates who have
  read a brief, non-technical summary of Parfit''s teletransportation argument but
  have not yet discussed fission or gradual replication. The goal is not to lecture
  them on psychological continuity versus bodily continuity, but to make them feel
  the pressure of the claim that personal identity is not what matters in survival—specifically,
  the moment when a one-to-one relation breaks into one-to-many and the usual criteria
  start giving contradictory answers.


  Introduce a fictional "Gradual Divergence Protocol" (GDP) scanner: it does not simply
  destroy and rebuild, but operates on a fidelity dial with three locked settings—(A)
  perfect physical preservation with minor neural noise, (B) perfect psychological
  replication with physical destruction of the original, and (C) an intermediate state
  in which both bodies exist with partial, overlapping memory and character profiles.
  In setting C, each claimant retains roughly 60% of the original''s psychological
  profile and 40% of the other; they share no physical continuity.


  Structure the room in three rounds, each 15 minutes, with a 15-minute debrief.


  Materials: role cards (Traveler, Controller, Arbiter, Observer), a "Stake Ledger"
  with 100 welfare-points per traveler representing future life-quality, and a "Testimony
  Form" with four forced-choice questions (e.g., "Would you accept this outcome if
  it happened to you?" "Which claimant deserves the welfare points?" "Is there one
  survivor, two, or none?").


  Rules:

  Round 1 (Physical Bias): Travelers step into the scanner at setting A. The original
  survives with slight cognitive impairment; no replica exists. Controllers must allocate
  all 100 welfare points to the impaired original or to a "future replacement" that
  never arrives. The group votes; the debrief asks why almost everyone allocates to
  the present body despite the impairment.


  Round 2 (Standard Teletransportation): Setting B. The original is destroyed; a perfect
  replica appears on a simulated "Mars station" (played by a second table). The replica
  receives the 100 points if the Arbiters vote "survival achieved." Predictably, some
  Arbiters withhold points because the body is new; others grant them. The Traveler
  (now split into two actors—one playing "destroyed original" in a silent role, one
  playing "replica") must argue for or against receiving the points.


  Round 3 (The Divergence): Setting C. Two claimants exist simultaneously, both at
  60/40 overlap, neither physically continuous with the original. The Stake Ledger
  can be split, but the rules require that any split below 50/50 for one claimant
  triggers a "conflict protocol" in which both claimants must defend their right to
  the majority share using only psychological-continuity reasoning. Observers record
  contradictions.


  Payoff scheme (non-monetary): Controllers and Arbiters accumulate "consistency tokens"
  for votes that align with the reasoning they gave in the previous round. If they
  change their allocation criterion between rounds without acknowledging the shift,
  they lose a token. The facilitator reveals token counts only in the debrief.


  The idea should emerge from the mechanics, not the facilitator''s explanation: in
  Round 3, the group will almost certainly split welfare points unevenly or deadlock,
  and the claimants will invoke incompatible intuitions (physical presence, memory
  ownership, anticipatory concern). Only after the deadlock occurs does the facilitator
  name the problem: the relation that matters—psychological connectedness—can hold
  in degrees and to more than one successor, so the concept of "the survivor" has
  no unique answer, yet our allocation instincts demand one.


