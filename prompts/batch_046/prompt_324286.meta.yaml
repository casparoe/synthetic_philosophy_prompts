  I''m preparing a six-month research proposal for a philosophy-of-mind fellowship,
  and I want the central question to turn on pain asymbolia—not as a clinical curiosity,
  but as a pressure point for theories that identify the badness of pain with its
  phenomenal character or its representational content about bodily damage. Patients
  with asymbolia report pain, locate it, and rate its intensity, yet they do not find
  it aversive and do not initiate avoidance behavior; they sometimes describe it as
  "not hurting" despite acknowledging that it is pain. The existing literature tends
  to split between two-factor theorists, who take this as proof that sensory-discriminative
  and affective-motivational components are separable, and unitary representationalists,
  who argue that the patients still have the badness but have lost the behavioral
  link. Both sides treat the dissociation as either confirming or not confirming a
  standard architecture, but neither has asked whether asymbolia reveals a third possibility:
  a failure not of sensation, not of evaluation, but of what I will call valence-locking—the
  mechanism by which a nociceptive state acquires its intrinsic motivational charge
  without passing through an explicit evaluative judgment. My proposal asks: does
  the possibility of valence-lock failure show that the badness of pain is neither
  part of its phenomenal content nor a separate cognitive appraisal, but rather a
  non-representational binding condition that can be disrupted while both content
  and appraisal remain intact?


  The project would proceed in three stages over six months. First, I would map the
  logical space of architectures: unitary phenomenal badness, dual-track with binding,
  dual-track without binding, and the valence-lock model I am proposing. Second, I
  would use the phenomenological reports and behavioral profiles of documented asymbolia
  cases—not to settle empirical questions, but to test whether each architecture can
  accommodate the specific pattern of preserved discrimination, absent avoidance,
  and intact second-order reflection without ad hoc adjustments. Third, I would draw
  out the normative and metaphysical consequences: if valence-locking is distinct
  from both representation and judgment, then arguments that ground moral obligations
  about pain in its representational content or in its subjective unpleasantness both
  miss the structural feature that makes pain matter. A useful deliverable would be
  a framework that specifies exactly what would count as evidence that the lock mechanism
  is part of the experience rather than downstream of it, and that identifies the
  conceptual costs of accepting or rejecting that claim. The main risk is that the
  distinction collapses into the familiar affective-sensory divide, in which case
  the project would fail to produce a genuinely new framing; I would guard against
  this by requiring that the valence-lock model generate predictions about other dissociation
  syndromes that the standard two-factor view does not generate. I am not asking for
  a literature review by citation—my aim is conceptual engineering—so the proposal
  should explain why this angle is tractable for a single researcher in half a year
  and what a negative result would look like.


