  In our graduate seminar on philosophy of mind this week, one of my colleagues offered
  a concise summary of the Malcolm-Dennett exchange on whether dreams constitute genuine
  experiences, and I found myself uncertain which parts to trust. She put it roughly
  as follows. Malcolm, she said, holds that because there are no observable criteria
  for mental states during sleep, any report of a dream made upon waking is not a
  direct description of an inner experience but rather an inference drawn from subsequent
  behavior and verbal disposition, placing dream reports on a par with third-person
  predictions about another person''s mental life rather than with first-person authority.
  Dennett, by contrast, accepts that something mental occurs during sleep but denies
  that it possesses any phenomenal character whatsoever; on her reading, he treats
  the dream narrative as a retrospective confabulation constructed at the moment of
  awakening, analogous to the explanatory narratives produced by split-brain patients
  when asked to account for actions they did not consciously initiate. From this,
  she concluded that Malcolm is essentially advancing a verificationist theory of
  mental content in general, while Dennett is advancing a functionalist elimination
  of phenomenology altogether, and that the apparent disagreement about dreams is
  therefore reducible to a broader dispute about whether consciousness requires publicly
  accessible behavioral criteria.


  I am inclined to think this framing flattens several distinctions that matter, particularly
  regarding Malcolm''s specific conceptual argument about the grammar of experience-claims
  rather than a general epistemic skepticism, and regarding Dennett''s more nuanced
  distinction between the occurrence of a mental episode and its retrospective narrative
  packaging. Could you audit this summary for me with some precision? Please proceed
  point by point: indicate which characterizations are essentially accurate, which
  conflate claims that the respective authors keep separate, which present modest
  or local theses as sweeping philosophical programs, and whether her concluding reduction—that
  the debate is really about verificationism versus functionalism—survives these corrections.
  I am especially interested in whether either philosopher''s framework can accommodate
  what we might call phenomenal dormancy: the possibility that an experience might
  persist in a non-reportable, counterfactually inaccessible form during sleep without
  being either fully present in consciousness or entirely absent, rather like a suspended
  normative status that awaits retrospective authorization upon awakening. You need
  not settle any empirical question about sleep neuroscience, but please address whether
  Malcolm''s criteria-based argument rules out such dormancy on conceptual grounds
  alone, and whether Dennett''s models—whether cassette-like storage or narrative
  construction—have the resources to make sense of it without collapsing into incoherence.


