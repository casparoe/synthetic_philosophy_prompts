  told they are playing a resource-allocation game, and the mechanics are exactly
  as described; only the scientific hypothesis (that the study measures implicit bias
  patterns) is withheld. Risks are minimal and procedures transparent. She judges
  consent VALID, maintaining that withholding the research hypothesis does not impair
  the competence required to authorize participation.


  Case 3 (Procedural Deception): In a social-psychology experiment, participants are
  correctly told that the study examines group decision-making under stress, but they
  are led to believe they interact with live peers via video when the peers are actually
  pre-recorded confederates. Risk is minimal and debriefing is immediate. She judges
  consent INVALID, arguing that deception about the procedural reality prevents participants
  from understanding what they are actually undergoing.


  Case 4 (Layered Disclosure with Meta-Consent): In a neuroethics study, participants
  sign an acknowledgment stating that some task details will be concealed until debriefing,
  that the study involves cognitive evaluation under ambiguous conditions, and that
  they consent despite partial ignorance. The concealed element is subliminal priming
  with emotionally valenced stimuli. She judges consent VALID but CONDITIONAL, accepting
  that explicit meta-awareness of partial ignorance can preserve procedural legitimacy.


  These four judgments appear jointly consistent with at least two governing rules.
  One rule (call it the Competence-Preservation Rule) holds that deception invalidates
  consent only when it directly undermines the specific cognitive or volitional competence
  required for authorization—such as understanding risks, understanding one''s social
  exposure, or understanding that one is receiving an unapproved compound—while withholding
  the scientific hypothesis or concealing details within an acknowledged ambiguity
