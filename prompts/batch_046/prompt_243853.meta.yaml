  I spent three decades in condensed-matter physics before retiring and turning, somewhat
  unexpectedly, to philosophy of science and metaphysics, and I am now trying to settle
  my own view on dispositions, causal powers, and the puzzles raised by finks and
  masks. Before I present these ideas in a small seminar for retired scientists, I
  want a consistency audit: I have assembled a package of commitments that feel individually
  plausible to me, but I suspect some pull against others in ways that are not immediately
  obvious, and I would like to know which pairs are genuinely in tension, which conflicts
  dissolve upon closer inspection, and what the least costly revision would be in
  each case, ordered by severity.


  My position is as follows. I am a realist about dispositions: I take them to be
  irreducible properties of physical systems, not merely convenient summaries of counterfactual
  regularities. I also think the classic fink and mask cases—such as the wire that
  loses conductivity the moment it is touched, or the fragile glass enclosed in protective
  foam—are best interpreted not as showing that dispositions vanish but as revealing
  that manifestation conditions are complex and include the absence of interfering
  conditions; the protected glass still genuinely possesses the disposition to shatter,
  and its manifestation is conditional on the removal of the mask. At the same time,
  I am drawn to a dispositional essentialist account of natural law, according to
  which the laws of nature derive from the essential natures of fundamental properties
  like charge and mass. Yet I believe this essentialist picture must be modified for
  quantum phenomena, since properties such as decay rate or spin orientation are not
  intrinsic dispositions of an isolated particle but relational properties of a coupled
  system comprising the particle, its environment, and the measurement context; if
  essentialism holds, it applies to these relational structures rather than to bare
  particles. In addition, I hold that working scientists treat dispositional language—talk
  of solubility, fragility, or radioactive decay—instrumentally in practice, as defeasible
  inference-licenses for prediction and control, and I regard this methodological
  instrumentalism as fully compatible with metaphysical realism, because empirical
  science aims at predictive adequacy rather than ontological commitment. I also defend
  a constraint I have come to call structural unmanifestability: if a disposition
  is not merely temporarily masked but is permanently blocked in every physically
  possible situation compatible with a system''s boundary conditions, then ascribing
  it is ontologically empty and should be rejected, since it is not a hidden power
  but a theoretical artifact carried over from an inappropriate model. Finally, I
  reject the coherence of internal finks in the sense originally discussed by C.B.
  Martin—cases in which an object is supposed to change its own categorical base precisely
  upon being triggered—because I think this involves a conceptual confusion between
  one object being replaced by another and one object retaining its identity while
  losing a property; if the internal constitution changes upon triggering, then we
  do not have a finked disposition but a different object altogether.


  Please examine this set of commitments and tell me whether they form a stable package.
  I want you to identify the genuine tensions—particularly between my metaphysical
  realism and my quantum-contextual revision of essentialism, between my instrumentalist
  view of scientific practice and my realist ontology, and between my acceptance of
