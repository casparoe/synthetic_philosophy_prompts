  Following a long and rather circular argument with a friend over whether genuine
  moral dilemmas can actually exist, I find myself needing something more operational
  than the usual philosophical exchange. I chair the clinical ethics review board
  at a mid-sized teaching hospital, and we are required to classify every referred
  case within forty-eight hours as either a resolvable conflict of obligations, a
  conflict of values that falls outside our mandate, or a genuine moral dilemma in
  which two non-derogable duties remain in force regardless of which course is taken.
  The conceptual point at stake—whether a genuine dilemma leaves what some call moral
  residue on both sides of the choice—matters directly to us, because if a case is
  genuinely dilemmatic we must document an undefeated reason for the path not taken
  and offer institutional support for the staff involved; if it is merely an apparent
  conflict, we should resolve it by priority rules and close the file. I want a reusable
  decision procedure my board can run in under an hour, grounded in the conceptual
  distinction between an outweighed reason and an undefeated one, but with a further
  refinement I have been trying to work out: that a true dilemma requires symmetrical
  residue, meaning the rejected course of action retains its normative force in a
  way that is not merely emotional but structurally parallel to the chosen one, whereas
  asymmetrical residue—where only one side leaves a standing obligation—indicates
  a resolvable conflict that our rules should settle.


  The procedure should take the form of an ordered checklist or flowchart in words:
  the questions to ask in sequence, what counts as a sufficient answer to each, the
  point at which the board stops with a negative classification, and the precise juncture
  at which the question becomes one of values rather than normative structure and
  must be handed to the patient or family rather than to us. It must include a small
  set of diagnostic tests—perhaps three or four sentences the board can apply—to distinguish
  defeated from undefeated reasons, and it must be explicit about which steps are
  mechanical and which are unavoidable judgment calls dressed in procedural clothing.
  Please apply it to three cases: first, a refusal of life-saving treatment by a competent
  patient whose family demands intervention; second, a proposal to divert scarce ICU
  resources from a patient with poor prognosis to a younger patient with better odds;
  and third, a case where staff must choose between two equally urgent surgical emergencies
  with only one available theatre. One of these should produce an answer my board
  will find unwelcome—specifically, that what looks like a dilemma is in fact resolvable
  by a priority rule we would rather not invoke—while another should land exactly
  at the hand-off point where values, not obligations, are in conflict. Finally, please
  state clearly what this procedure cannot do: where it will misfire, what kinds of
  institutional pressure distort its application, and why it cannot eliminate the
  need for a signed-off human decision even at its most mechanical steps.


