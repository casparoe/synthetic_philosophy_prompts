  Having recently spent two years navigating my father''s decline through frontotemporal
  dementia, I have begun reading philosophy of mind not as an academic exercise but
  as a practical attempt to understand what, if anything, remains of his inner life
  as language and self-reference dissolve. In conversations with clinicians, ethicists,
  and family members, I keep encountering the same argumentative maneuver, yet I do
  not know whether it is recognized.


  Here is the pattern. When the question is whether my father—who no longer speaks,
  no longer recognizes me consistently, but still withdraws his hand from a hot surface
  and occasionally smiles at music—retains any subjective experience, the response
  is typically: "We have no first-person access, so we cannot know; therefore we should
  assume the absence of experience in making care decisions." The explanatory gap
  is treated as a license for negation.


  Yet when the same interlocutors discuss a pre-linguistic infant undergoing an identical
  neural degradation, or a locked-in patient who retains full awareness but no motor
  output, they invoke precisely the same lack of first-person access and conclude
  the opposite: "We cannot know from the outside, therefore we must presume experience
  and act with maximal caution." The gap, identical in structure, suddenly becomes
  a reason for affirmation.


  What strikes me is not mere inconsistency, but a systematic correlation: the direction
  in which the epistemic gap is resolved—whether it licenses denial or demands precaution—tracks
  not the available neural or behavioral evidence, but the practical and moral cost
  of being wrong. Where attributing consciousness would impose an unbearable burden
  (withdrawing care, permitting suffering), the gap is read as absence; where denying
  it would impose a moral horror (neglecting an infant or a paralyzed adult), the
  gap is read as presence.


  I have noticed at least three concrete instances of this. In hospice ethics committees,
  the argument is used to justify reducing analgesic vigilance for non-communicative
  patients with severe dementia, on the grounds that "there is no one there to suffer."
  In neonatal intensive care debates, the identical logical structure—"we lack direct
  access to their phenomenology"—is used to mandate aggressive pain management for
  infants with comparable cortical damage. And in comparative cognition, researchers
  who deny phenomenal consciousness to octopuses with comparable neural complexity
  cite our "inability to bridge the gap" as decisive, while researchers studying human
  anencephalic infants cite the very same inability as a reason for humility and protective
  care.


