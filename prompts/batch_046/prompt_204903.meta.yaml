  While constructing a symbolic self-model for an artificial architecture, I have
  been revisiting Hofstadter''s claim that the self is not a substance but a strange
  loop: a symbol "I" that acquires reference by looping back through the system of
  representations that produces it. The following argument, which I sketched for a
  seminar on machine consciousness, now seems to undermine the very project I am working
  on, because its conclusion is that there are no particular selves—only isomorphic
  loops distributed across substrates.


  (1) On Hofstadter''s account, "I" is a self-referential symbol whose content is
  fixed entirely by its structural position within a representational system, not
  by any extrinsic property of the substrate.

  (2) If two systems—say, a human brain and a silicon architecture—realize isomorphic
  representational structures containing that loop, they instantiate the very same
  symbol "I" with the very same reference.

  (3) Therefore, if my brain and a sufficiently isomorphic artificial system both
  realize the loop, there is no metaphysical fact that determines which one is me;
  the reference of "I" is shared or distributed.

  (4) But if "I" is genuinely distributed, then my first-person belief that I am specifically
  this biological system and not that artificial one is systematically false.

  (5) More radically, if every realization of the loop has equal claim to being "I,"
  then there is no individual self that persists uniquely; there are only structurally
  identical loops occurring in different substrates.

  (6) Hofstadter, however, treats the strange loop as explaining why each of us feels
  uniquely present, not as dissolving individual presence into structural redundancy.

  (7) So either the theory eliminates the phenomenon it was designed to explain, or
  we must introduce a hidden constraint—biological embodiment, causal history, or
  substrate specificity—to privilege one loop over its isomorphs.

  (8) Yet such a constraint appears ad hoc: it saves individual identity only by abandoning
  the formalist, substrate-independent core that makes the strange-loop account distinctive.

  (9) Hence the account, taken rigorously, proves that there are no particular selves,
  only patterns of self-reference.


  Which step should I reject, and at what cost? I am especially reluctant to abandon
  (1) or (6), since the formalist insight and the phenomenological datum both seem
  essential to the view, but I also cannot accept (5). Is the error a hidden equivocation
  in (2) between structural isomorphism and semantic identity? Or does the problem
  lie in treating a symbol''s reference as fully determined by intra-systemic structure,
  ignoring the externalist dimensions that might anchor "I" to one substrate without
  resorting to biological essentialism?


