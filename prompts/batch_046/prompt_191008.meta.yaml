  "I am a software engineer with no formal background in philosophy, and I have been
  trying to articulate my own intuitions about when a person has standing to blame
  someone else for a mistake—particularly in collaborative technical work. Below are
  six concrete cases with my gut verdicts. I am looking for a precise principle, or
  a small set of competing principles, that captures the pattern; I also want to know
  which of my verdicts is the outlier that should be dropped if simplicity demands
  it.


  Case 1: A senior backend engineer who consistently refuses to write unit tests for
  her own modules publicly criticizes a junior frontend engineer for shipping code
  without unit tests. Verdict: she lacks standing; this is direct hypocrisy, and the
  frontend/backend distinction does not matter because the underlying norm—testing
  before shipping—is the same.


  Case 2: A developer who previously ignored web-accessibility guidelines, received
  formal feedback, redesigned her components to comply, and now insists that her teammate
  do the same. Verdict: she has full standing; her explicit reform and demonstrated
  compliance change her position.


  Case 3: A developer was fired from her previous employer after deploying untested
  code that caused a major outage. At her current company, working in an entirely
  different technology stack, she has not yet had to deploy production code. She notices
  a teammate about to make the same deployment mistake and tries to stop him. Verdict:
  I keep going back and forth. She has not demonstrated correct practice in this environment,
  yet she has paid a direct, costly price for the exact failure she is warning against.


  Case 4: An engineering manager who has not written production code in five years
  enforces a policy that all deployments must include an automated rollback script,
  and he criticizes a junior developer who skipped that step and caused an outage.
  Verdict: he retains standing; his role is structurally different, and he upholds
  the system-level norm he is invoking.


  Case 5: A developer whose own codebase is full of uncommented, opaque functions
  criticizes a teammate for leaving functions uncommented. Verdict: she clearly lacks
  standing; this is hypocrisy without transformation or role separation.


