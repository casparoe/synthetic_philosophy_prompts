  Exam question:

  Some philosophers argue that utilitarianism fails to respect the separateness of
  persons. Consider a policy choice between distributing 100 units of risk equally
  across 1,000 people (each facing 0.1 unit) versus concentrating 90 units of risk
  on a single individual. A utilitarian calculates total risk and prefers the concentrated
  option. First, explain the separateness-of-persons objection to this reasoning.
  Second, assess whether the objection still holds if the 1,000 people are understood
  not as isolated individuals but as interdependent nodes in a shared causal network—for
  example, a distributed computing cluster in which each node’s failure probabilistically
  affects the others.


  Student answer:

  The separateness-of-persons objection, which Bernard Williams developed against
  act-utilitarianism, claims that utilitarian reasoning illegitimately pools benefits
  and burdens across distinct individuals, treating a group as though it were one
  super-person with 1,000 parts. In the risk case, the utilitarian adds the 0.1 risks
  across all nodes to reach 100, compares that to 90, and picks the single-node failure.
  Williams argues this violates the moral boundary between persons: each node has
  its own distinct welfare trajectory, and no amount of minor risk distributed elsewhere
  can justify imposing a severe risk on one. If we model the nodes as causally linked
  in a cluster, the objection actually strengthens, because interdependence means
  harming one node propagates harm to others, so the separate welfare streams are
  already merged. Thus, in distributed systems, utilitarian aggregation is not only
  permissible but more accurate, and the separateness objection collapses.


