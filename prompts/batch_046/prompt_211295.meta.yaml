  Draft:


  Following a long and rather heated discussion with a friend about the scope of our
  climate obligations to people who do not yet exist, I have settled on the following
  verdicts about concrete policy scenarios, yet I cannot see the unifying principle,
  if there is one. I should like to know whether a coherent account can accommodate
  all of them, which ones it forces me to abandon, and what it predicts for cases
  I have not considered.


  Here are my judgements:


  1. Deep decarbonisation with moderate present cost: Present governments accept a
  sustained 2–3 per cent reduction in GDP growth to reach net-zero by 2040, preventing
  catastrophic warming in 2250. Because economic conditions influence reproductive
  timing, the individuals alive in 2250 are not identical to those who would exist
  under a high-emission trajectory. I judge that the present generation has a strong
  obligation to pursue this path; the fact that different people will benefit does
  not diminish the duty.


  2. Maladaptive coastal defence: A wealthy nation constructs extensive seawalls using
  carbon-intensive concrete and fossil-powered construction, protecting its current
  citizens from flooding for eighty years, but locking in emissions that severely
  damage people living in 2120. I judge this unjust to those in 2120, despite the
  immediate lives saved.


  3. The reproductive-effect carbon tax: A global carbon tax is set high enough to
  depress fertility rates in developing regions, meaning that the population enjoying
  the stable climate of 2150 is demographically different from the one that would
  have existed under lower taxation. I judge the tax still justified, provided present
  basic needs are protected, on the grounds that whoever exists in 2150 is entitled
  to a habitable world.


  4. The heritage lockbox: Rather than reducing emissions, present societies deposit
  four per cent of GDP into a legally irrevocable fund that will be released in 2500
  solely to preserve specific twenty-first-century artworks and monuments in climate-controlled
  vaults. The beneficiaries in 2500 may hold entirely different values, and the opportunity
  cost is a failure to relieve present severe poverty. I judge this not obligatory;
  it feels like an illegitimate imposition of present preferences onto strangers.


  5. Equivalent climate outcomes with unequal distribution: Two policies achieve identical
  climate stability for 2200. Policy A imposes a uniform global carbon price, disproportionately
  burdening the present global poor. Policy B achieves the same reduction through
  luxury-consumption restrictions affecting only the wealthiest decile, with revenues
  used for present welfare. I judge Policy B clearly just and Policy A unjust unless
  fully redistributed; identical future outcomes do not make the policies morally
  equivalent.


  6. Demographic engineering for climate ends: A climate programme is so stringent
  that it triggers widespread economic collapse, reducing global population by roughly
  half by 2100, but ensures a stable, flourishing environment for the survivors in
  2300. I judge this morally impermissible; we may not engineer the size and identity
  of future generations as a strategy for climate stability, even if every survivor
  lives well.


  My friend argues that Cases 1 and 6 should be treated identically—both alter who
  exists through present economic policy—while I think they differ sharply. She also
  thinks Case 4 should be treated like Case 1, since both involve providing for distant
  strangers whose preferences we cannot know, whereas I think the difference is obvious.


  Is there a precise principle—perhaps involving basic needs, proportionality, or
  the distinction between harming particular individuals and altering population composition—that
  delivers verdicts 1 through 6 without contradiction? If the price of coherence is
  overturning one of my judgements, which should go, and why? Please also state what
  your principle predicts for a case I have not listed: for instance, a policy that
  prevents climate harm to people in 2150 only by imposing a one-child policy now,
  or a programme that guarantees a basic income for all people alive in 2200 regardless
  of who they turn out to be.


