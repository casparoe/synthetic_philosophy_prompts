  Consider this reconstruction of Hume''s position in "Of the Standard of Taste" that
  ends in contradiction.


  (1) Beauty is not a quality in objects but a sentiment in the mind of the perceiver.

  (2) Nevertheless, there is a real standard of taste: the joint verdict of true judges—those
  with delicate sentiment, practice, comparison, and freedom from prejudice.

  (3) We identify true judges not by prior knowledge of which objects are beautiful,
  but by observing which subjects agree with one another in their sentiments.

  (4) Now imagine a structurally identical "inverted" community: they possess the
  same perceptual capacities, the same habits of comparison, and the same freedom
  from prejudice, yet their sentiments are systematically reversed—what we call beautiful
  they consistently call ugly, with perfect internal coherence.

  (5) By the criteria in (2), members of this community qualify as true judges.

  (6) So Hume must either grant that their inverted judgments are equally correct
  (making beauty relative to a community rather than standardized) or deny that they
  are true judges after all.

  (7) To deny (6), he must claim that true judges necessarily feel pleasure in response
  to specific objects; but then the standard depends on a pre-existing correlation
  between objects and sentiments, which is exactly the kind of object-dependent fact
  that (1) rules out.

  (8) Thus Hume''s view either collapses into community-relative relativism or implicitly
  treats beauty as an objective feature of objects.

  (9) Both outcomes violate his explicit commitments.


