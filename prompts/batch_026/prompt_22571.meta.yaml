  Let me think about what the White Horse dialogue actually says, carefully:


  Gongsun Long, "White Horse" (Baima lun):

  - "White horse is not horse." (Baima fei ma.)

  - Argument: "Horse" is what names the form (xing); "white" is what names the color
  (se); to name the color is not to name the form. Therefore, "white" + "horse" (naming
  color and form) is not "horse" (naming the form).

  - "If you want horses, then a black horse or a white horse will do; you don''t say
  ''no.'' But if you want a white horse, then a black horse does not do; you say ''no.''
  So if white horses were horses, then wanting a white horse should be the same as
  wanting horses; but wanting a white horse is not the same as wanting horses. Therefore,
  white horse is not horse."

  - "If a white horse is a horse, then a white horse is a horse-with-color. A horse-with-color
  is not a horse. Therefore, a white horse is not a horse."

  - The dialogue form: Gongsun Long''s interlocutor (or the text''s questioner) objects,
  and Gongsun Long responds.

  - The "Disputing Names" (Qu Ming) chapter: "Two feathers are not feathers" (liu
  fei fei fei) — two feathers are not (a single) feather; "the standing of tiptoes
  does not add to height" (zhan bu jia) — standing on tiptoes does not add to height
  (i.e., is not a person of greater height); "the east does not precede going" (dong
  wu xian qu) — the east does not come before going; "the sun has already reached
  its zenith" (ri zhong yi gui) — the sun has already returned once it reaches its
  zenith; "the horse and its rider make one" (ma ren yi) — the horse and rider make
  one (this is used to argue that a rider on a horse is a single entity, so "the rider"
  is not separate from "the horse" — related to the White Horse argument: if horse
  + rider = one, then... hmm).

  - Hui Shi: "All things are one" (qiwu shi) — a different argument, from the "Qu
  Ming" chapter attributed to Hui Shi.

  - Gongsun Long''s "Disputing Names" argues that names must not be confused; his
  famous dictum: "Names are used to clarify realities, not to confuse them" (Ming
  yi ming shi, fei yi luan shi ye) — actually, the opening of Qu Ming: "Names are
  for clarifying realities. When names are used to clarify realities, there is no
  confusion; when they are used to confuse realities, there is chaos."

  - The "Yong" (Use) chapter: "White horse is not horse" is "useful" — the point is
  practical: in buying a horse, "horse" and "white horse" pick out different sets
  of acceptable objects.


  Key interpretive issues (in the weeds):

  - Is "fei" here "is not identical to" (identity negation) or "does not fall under"
  / "is not the same as"? Gongsun Long''s argument works best if "white horse fei
  ma" means "a white horse is not [merely/only] a horse" — i.e., the compound name
  does not exhaust to the base name. The interlocutor''s confusion is treating "fei"
  as "is not a member of."

  - The argument is often (mistakenly) read as a claim about reference: that the name
  "white horse" refers to a different object than "horse." But Gongsun Long''s point
  is about names: the name "white horse" is not the name "horse" — the addition of
  the color-qualifier changes the name, and therefore what is demanded ("wanting a
  white horse" excludes black horses, "wanting a horse" does not).

  - The "form vs. color" (xing vs. se) distinction: "horse" names the form; "white"
  names the color; a name of form + color is not a name of form alone.

  - The connection to the Mohists: the Mohists (in the "Names and Realities" / Ming
  ji chapter of the Mohist Canon) discussed "one name, one reality" (yi ming yi shi)
  and the conditions for correct naming; they criticized the School of Names. The
  Mohist Canon''s discussion of "the whole and its parts" (zheng) and "the same" (tong)
  is relevant: "The same" is defined in various ways (same thing, same kind, both
  being in the south, both responding to a command...). A student might attribute
  the "one name one reality" principle to Gongsun Long — it''s actually a Mohist principle
  (though Gongsun Long also had a "names must match realities" view).

  - The received text: "White Horse" appears in Gongsun Longzi (attributed), and the
  argument also appears in the "Qu Ming" chapter. The text is fragmentary; some scholars
  question the authenticity.

  - The "two feathers" argument: "Two feathers are not feathers" — often cited as
  a parallel: the compound (two feathers) is not the base (feather). And "the horse
  and rider make one": horse + rider = one, so when the rider is on the horse, "the
  horse" (as a bare name) does not capture the composite — this is used in the argument
  that names of composites are not names of parts.


  So a student''s answer on "Explain Gongsun Long''s argument that ''white horse is
  not horse'' and its role in the School of Names debate" could be:


