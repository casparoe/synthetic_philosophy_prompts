  Jeffrey conditionalization details:

  Prior P over finite algebra. Uncertain evidence: a probability distribution over
  a partition {E_i} of the sample space, with new probabilities P^*(E_i)=p_i. Jeffrey
  rule: P^*(H)=Σ_i P(H|E_i) p_i for all H. It generalizes ordinary conditionalization:
  if p_i=1 for one E_i and 0 for others, P^*(H)=P(H|E_i). It can be derived by "conditionalization
  on an event in an enlarged space" if there is an event F in an enlarged space such
  that P(E_i|F)=p_i and P(H|F∧E_i)=P(H|E_i). Then P(H|F)=Σ_i P(H|F∧E_i)P(E_i|F)=Σ_i
  P(H|E_i)p_i. The new event F is not simply "the evidence has arrived" unless that
  event has the right conditional probabilities; it is something like "the evidence
  is such that the probabilities of the partition are p_i". Also the conditional probabilities
  P(H|E_i) are held fixed, a "minimal change" or "conservatism" condition.


  Standard objections:

  - It is not a response to evidence in the usual sense: the agent simply changes
  credences in E_i without conditioning on a proposition; the rule is "arbitrary"
  or "ad hoc" because it doesn''t explain why the new probabilities p_i are rational.

  - "Jeffrey''s rule violates the principle of total evidence"? No.

  - "It fails to respect the sure thing principle"? Jeffrey''s rule does respect?
  Let''s recall.

  - "The rule is not invariant under reformulations of the partition" (or "dependence
  on partition"). This is a real issue: Jeffrey conditionalization can be sensitive
  to the partition used. If you use different partitions representing same evidence,
  you can get different updates. This is a standard objection? Yes, "Jeffrey''s rule
  is not partition invariant" or "invariance under reformulation" problem. Example:
  evidence about color? Need maybe.

  - "It cannot handle evidence that is not represented by a partition of the original
  space" or "new concepts".

  - "The rule can lead to incoherent conditional probabilities?" No.


