  Main ideas in the embedded agency literature:

  - Standard decision theory / RL assumes the agent is a "free variable" — its actions
  are not determined by the state of the environment. The agent is outside the environment.

  - In reality, the agent is part of the physical world. Its actions are caused by
  its internal state, which is part of the world. So an accurate model of the environment
  must include the agent itself.

  - This leads to problems: if the agent models itself, then its model of its own
  actions is not a free variable but a prediction. This creates a kind of self-reference.

  - Consequences: (1) the agent-environment boundary is not fixed; (2) the agent''s
  beliefs about its own actions matter; (3) in Newcomb''s problem, the embedded view
  clarifies why the predictor''s prediction is not independent of the agent''s choice
  — the predictor simulates the agent.

  - There''s also the "duality" idea: any system can be viewed as either agent or
  environment, and the choice of boundary is a matter of convenience, but not every
  boundary is equally good.

  - Practical consequence: an agent that models the world should model itself as part
  of the world, but should still treat its own actions as interventions (free variables)
  for decision-making purposes — this is sometimes called "the embedded agent''s dilemma"
  or the tension between "modeling the agent as part of the world" and "treating the
  agent''s actions as free."


