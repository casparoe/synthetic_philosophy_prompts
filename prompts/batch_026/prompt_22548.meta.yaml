  The resolution that Kavka explores: the rationality of the decision to go to the
  room depends on the rationality of the subsequent decision to drink, which is circular.
  This is the "two-agent" problem.


  Solutions in the literature:

  1. "You should form a plan to drink" — but a plan to do something you have no reason
  to do is not a rational plan.

  2. "Two-agent solution" (Broome): the agent who decides to go is a different agent
  from the agent who decides to drink; the going-agent should go because the drinking-agent
  will drink (for the drinking-agent, drinking is rational because... hmm).

  3. "Commitment device" solution: you should pre-commit to drinking (e.g., tie yourself
  to the vial), so that at the moment of drinking, you have no choice, and then going
  to the room is rational.

  4. "Planning rationality" solution: rationality is about plans, not individual actions;
  a plan to go and drink is rational even if the drinking step is not rational at
  the time of execution.


