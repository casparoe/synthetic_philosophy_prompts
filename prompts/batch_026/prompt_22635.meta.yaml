  5. Interpretations of probability: frequentism vs. subjectivism vs. propensity.
  In-the-weeds angles:

  - The "single-case" problem: frequentism can''t assign probabilities to single events
  (e.g., "the probability that this coin will land heads on this particular toss"),
  while subjectivism can.

  - The "propensity" interpretation (Popper): the probability is a physical disposition
  of the experimental arrangement; but propensities only manifest in long-run frequencies,
  so how do we distinguish a propensity from a frequentist probability? The "propensity
  vs. frequency" problem.

  - The "Dutch book" argument for subjectivism (de Finetti, Ramsey): if your degrees
  of belief are not coherent (i.e., don''t satisfy the axioms of probability), you
  can be Dutch-booked. But the Dutch book argument assumes that betting is the right
  way to interpret degrees of belief, and critics (e.g., the "no-betting" objection)
  say that not everyone is a bettor.

  - The "inductive" problem: how to assign prior probabilities (subjectivism) without
  falling into arbitrariness; the "principle of indifference" (Laplace) and its problems
  (the "box problem," the "measure problem").

  - The "propensity" interpretation and its problems: Popper''s propensity is a "single-case"
  propensity, but it''s only observable in the long run; the "propensity vs. frequency"
  problem; also, the "propensity" interpretation has trouble with "dispositions" that
  are never triggered.

  - The "frequentist" problem of "reference classes": the "reference class problem"
