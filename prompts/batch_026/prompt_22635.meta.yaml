  40-year-olds, 40-year-old smokers, etc.)?

  - The "Bayesian" vs. "frequentist" debate in statistics: the "p-value" vs. "posterior
  probability" confusion.

  - The "propensity" interpretation and its connection to "disposition" in philosophy
  of science.


