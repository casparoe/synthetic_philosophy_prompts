  1. Popper''s propensity interpretation: the probability of an event is a real, objective
  property (a "propensity" or "disposition") of the experimental arrangement. E.g.,
  the probability that a coin lands heads is a propensity of the coin-tossing setup.

  2. But propensities are only observable/manifest in long-run frequencies. We can''t
  observe a single propensity directly; we infer it from the frequency of outcomes
  over many trials.

  3. So the propensity interpretation is, in practice, indistinguishable from frequentism:
  both assign probabilities based on long-run frequencies.

  4. The propensity interpretation''s supposed advantage — that it can handle single
  cases (the propensity of this particular setup) — is illusory, because we can only
  know the propensity by observing the long-run frequency, which requires many trials,
  not a single case.

  5. Therefore, the propensity interpretation inherits all of frequentism''s problems
  (the reference class problem, the problem of single cases, the problem of finite
  sequences) without solving any of them.

  6. So the propensity interpretation is not a genuine third way; it''s frequentism
  with an extra metaphysical commitment (that frequencies are caused by real dispositions)
  that doesn''t buy us anything empirically.


