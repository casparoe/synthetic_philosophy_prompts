  Let me think about what''s genuinely in-the-weeds and meaningful:


  The "Lockean proviso" problem is genuinely in-the-weeds and important. Nozick''s
  entitlement theory has three conditions: (1) just acquisition, (2) just transfer,
  (3) rectification of past injustices. The "just acquisition" condition is supposed
  to be grounded in the Lockean proviso: you can appropriate unowned resources only
  if "enough and as good is left for others." Nozick acknowledges this proviso but
  then weakens it to a "compensation proviso": you can appropriate as long as you
  compensate those who are made worse off. This is a much weaker condition than the
  original Lockean proviso. The problem: the Wilt Chamberlain argument assumes a just
  initial distribution (a just acquisition). But if the acquisition condition is weakened
  to the compensation proviso, then it''s much harder to establish that the initial
  distribution is just, because the compensation proviso is so weak that almost any
  appropriation would satisfy it (you just pay a little compensation). So the Wilt
  Chamberlain argument''s premise (a just initial distribution) is not actually established
  by the entitlement theory''s own acquisition condition. This is a genuine, in-the-weeds
  problem.


