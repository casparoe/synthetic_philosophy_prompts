  Option: Arendt on lying in politics + memo. Arendt''s "Truth and Politics" (1967,
  included in *Between Past and Future*). Key ideas: factual truth vs. rational truth;
  the distinction between lies and fiction; that lies are less damaging than fictions
  because fictions can be recognized as such; the "gaslighting" concept (coined by
  Arendt); that lies in politics are less dangerous than they seem to be — what''s
  more dangerous is the total annihilation of factual truth, e.g., the Nazi "total
  lying" and the atomic bomb making lies unnecessary (the bomb is so terrifying that
  no one can disbelieve it — the "credibility" problem: the atomic bomb''s power makes
  it *incredibly* credible, "the more outrageous the lie, the more readily it is believed"
  — this is the Nazi experience Arendt describes: the more outrageous the lie, the
  more it is believed, because people think no one would make such a lie if it weren''t
  true). Also the distinction between the "objective" nature of facts and the "subjective"
  nature of opinions; that a society that has lost its factual truths can no longer
  distinguish truth from falsehood, and opinions become meaningless; the "banality"
  — that in totalitarianism, the distinction between truth and falsehood, and between
  fact and fiction, was systematically erased.


