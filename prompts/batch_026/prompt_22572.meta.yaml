  Let me think about the "semantics and pragmatics of slurs" domain. This is a really
  rich area in philosophy of language. The main theories:

  - The "expressivist" or "affectivist" view: slurs express negative attitudes (contempt,
  hatred) toward a group, but don''t add to the propositional content.

  - The "descriptivist" or "referential" view: slurs are just pejorative terms that
  refer to the same group as the neutral term, but with a negative connotation.

  - The "contempt" theory (e.g., by McFarlane, or by Sarchap, or by...): slurs express
  contempt.

  - The "hate" theory: slurs express hate.

  - The "identity" theory (e.g., by...): slurs are identity terms that are only applicable
  if the speaker has a certain attitude.

  - The "use-restrictions" view (e.g., by...): slurs have use-restrictions — they
  can only be used if the speaker has a certain attitude (like contempt or hate).

  - The "reappropriation" problem: how can a slur be used "reappropriately" by members
  of the group it targets? This is a puzzle for the expressivist view, because if
  slurs express contempt, how can a member of the group use a slur without expressing
  contempt?

  - The "in-group" vs "out-group" use: the difference between a slur used by an in-group
  member (reappropriated) and a slur used by an out-group member (offensive).

  - The "pragmatic" vs "semantic" distinction: is the offensive content of a slur
  part of its semantic content (what it means) or its pragmatic content (how it''s
  used)?

  - The "mixed" view: slurs have both a semantic content (referring to a group) and
  a pragmatic content (expressing contempt).


