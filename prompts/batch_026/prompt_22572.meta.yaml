  Actually, a really in-the-weeds issue: the "weak Dutch book" vs "strong Dutch book"
  distinction. A weak Dutch book is a set of bets where the agent loses money in expectation
  (or on average), while a strong Dutch book is a set of bets where the agent loses
  money in every possible state of the world. The coherence arguments typically aim
  to show the strong version. But there''s a subtlety: the strong Dutch book argument
  requires that the agent''s beliefs are "incoherent" in a specific sense, and the
  weak version is actually what''s most relevant to the "you''ll lose money" intuition.
  Also, there''s the issue of whether a "weak" Dutch book (where you lose in expectation
  but might win in some states) is actually a reason to change your beliefs, or whether
  only the "strong" Dutch book (where you lose in every state) is a genuine vulnerability.


  Another really in-the-weeds issue: the "bookmaker" assumption. The classic Dutch
  book argument assumes that there''s a bookmaker who knows your beliefs and can offer
  you a menu of bets. But in the real world, there''s no such bookmaker. So the question
  is: does the Dutch book argument have any normative force if there''s no actual
  bookmaker? This is the "real-world applicability" problem. Some philosophers argue
  that the argument is still normatively powerful because it shows that your beliefs
  are "internally inconsistent" (they imply that you''d accept a set of bets that
  lose), even if no one actually offers them. Others argue that without a real bookmaker,
  the argument is just a thought experiment with no real-world bite.


