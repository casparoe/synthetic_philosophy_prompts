  Adam Smith in The Wealth of Nations:

  - Criticized mercantilism (the idea that wealth = gold/silver, and that a country
  should maximize exports and minimize imports).

  - Argued for free trade, the "invisible hand," comparative advantage (though that''s
  more Ricardo).

  - Was critical of the colonial monopoly system: the Navigation Acts, the monopoly
  of trade with the colonies, the idea that colonies existed for the benefit of the
  mother country.

  - Argued that the colonies (especially America) were actually a net cost to Britain,
  not a benefit.

  - Was sympathetic to the American colonists'' grievances (he supported the American
  Revolution, or at least the colonists'' right to resist).

  - Argued that the "system of free trade" would benefit both the colonies and the
  mother country.

  - Was critical of the "colonial prejudice" — the idea that the colonies should be
  treated as subordinate.


