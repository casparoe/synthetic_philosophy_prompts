  Maimonides'' view (Guide III.26–49): The sacrificial laws were commanded not because
  God desires sacrifice, but because the Israelites were accustomed to offering sacrifices
  to many gods in many places; God, in His wisdom, directed them to offer sacrifices
  to Him alone, in one place, according to specific rules, as a means of gradually
  weaning them off idolatry. The ultimate end is the abolition of sacrifice and the
  establishment of pure monotheistic worship (the "service of the heart," prayer,
  prophecy). Maimonides is famous for saying that the sacrifices were "a concession"
  (like a doctor prescribing a medicine for a sick patient).


  Comparators:

  1. The Talmudic view of kapparah (atonement): the sacrificial system as a means
  of atonement for sins, with the animal "taking on" the sin. This is the "received"
  view in the Talmud (e.g., Yoma, and the famous Talmudic passages). Maimonides himself
  sometimes talks about atonement, but his instrumentalist account reframes it.

  2. Nahmanides (Ramban)''s criticism: that each mitzvah has an intrinsic reason (sod
  ha-mitzvah) that we can''t fully grasp, and that Maimonides'' rationalist, instrumentalist
  account is wrong or incomplete.

  3. The "commensality" theory: that sacrifice is fundamentally a shared meal (the
  peace offerings were eaten by the offerer and his household, with a portion for
  the priests and a portion burned for God). This is a view held by some biblical
  scholars and by some rabbis.

  4. The anthropological view (e.g., the view of sacrifice as a means of establishing
  or reaffirming social bonds, or the view of "sacrificial violence").


