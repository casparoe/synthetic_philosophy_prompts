  problem. The embedded moral sentence expresses a higher-order attitude, which is
  a genuine attitude, so the problem is solved.

  - Person B: Blackburn''s strategy doesn''t solve the Frege–Geach problem. The higher-order
  attitude is not a genuine attitude; it''s just a way of talking about the embedded
