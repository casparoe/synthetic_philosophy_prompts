  The Frege–Geach problem: moral sentences (or other expressivist sentences) can function
  in embedded contexts (like "If it''s wrong to lie, then it''s wrong to tell the
  truth") without expressing propositions. But if moral sentences don''t express propositions
  (as expressivists claim), how can they function in embedded contexts?


  The standard expressivist responses:

  1. **Blackburn''s "higher-order attitudes"**: The embedded moral sentence expresses
  a higher-order attitude (e.g., a conditional plan).

  2. **Gibbard''s "minimality"**: The embedded moral sentence expresses the minimal
  attitude that would make the whole sentence true.

  3. **Portonovi''s "dynamic semantics"**: The embedded moral sentence changes the
  context in which subsequent sentences are evaluated.


  A disagreement could be between two people about whether a particular expressivist
  strategy actually solves the Frege–Geach problem.


