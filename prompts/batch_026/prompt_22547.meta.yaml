  Nāgārjuna''s tetralemma (catuṣkoṭi) in Mūlamadhyamakakārikā: things are not produced
  from self, other, both, or without cause. The tetralemma: exists, does not exist,
  both, neither. Madhyamaka emptiness: all phenomena lack svabhava (inherent existence).
  Controversy: Does the tetralemma show that the question "does it exist?" is malformed
  because existence presupposes svabhava? Or does it reject all four as positions?
  Does it lead to nihilism? A student answer might say: "Nāgārjuna uses the tetralemma
  to show that production is empty because it cannot be from self, other, both, or
  neither. Since all four options are impossible, production does not exist. Emptiness
  is the absence of production." Subtle mistake: confuses negation of inherent production
  with negation of conventional production; or treats emptiness as a positive thesis;
  or thinks tetralemma is a logical proof that all four are false rather than a dialectical
  device showing dependence on svabhava.


