  Exam question:

  "Kant''s Formula of Universal Law requires that one act only on maxims that can
  be willed as universal laws. In the Groundwork, he distinguishes cases where universalization
  yields a contradiction in conception from cases where it yields only a contradiction
  in the will.


  (a) State the maxim under consideration.

  (b) Explain why the maxim ''I will make a false promise to obtain a loan, intending
  not to repay'' fails the test by producing a contradiction in conception.

  (c) Explain why the maxim ''I will never help others'' does not fail by producing
  a contradiction in conception.

  (d) Explain why ''I will never help others'' still fails by producing a contradiction
  in the will.

  (e) State what this distinction implies about the moral status of the corresponding
  duties."


  Student answer:

  "(a) The maxim is: make a false promise when I need money, with the intention of
  not repaying.


  (b) If everyone made false promises whenever they needed money, lenders would have
  no reason to lend, because promises would no longer be reliable. The agent''s maxim
  therefore presupposes a practice of trustworthy promising while universalizing a
  rule that would destroy that practice. Since the maxim cannot even be coherently
  conceived as a universal law, it violates a perfect duty.


  (c) The maxim ''never help others'' can be conceived as a universal law: a world
  in which no one helps anyone is not logically impossible. So universalizing it does
  not make the maxim self-contradictory in conception.


  (d) A rational agent cannot consistently will such a universal law, because as a
  vulnerable being the agent may need help and would thus be willing a law that excludes
  the very assistance on which the agent depends. The contradiction is therefore in
  the will, not in the conception.


  (e) Duties that fail by contradiction in conception are perfect duties; duties that
  fail only by contradiction in the will are imperfect duties."


