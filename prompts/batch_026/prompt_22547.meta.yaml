  would destroy that practice." Good.

  - (c): "world in which no one helps anyone is not logically impossible" good.

  - (d): "as a vulnerable being the agent may need help and would thus be willing
  a law that excludes the very assistance on which the agent depends." Subtle: "may
  need help" is contingent; Kant''s point is not that the agent happens to depend,
