  Let me think about the regress problem in more detail. The regress problem (the
  "Meno regress" or "Agrippa''s trilemma"):

  - If a belief is justified by another belief, that other belief must itself be justified,
  and so on.

  - This leads to: (1) an infinite regress, (2) circularity, or (3) a terminus (basic
  beliefs).


  The three main responses:

  - Foundationalism: the regress terminates in basic beliefs.

  - Coherentism: the regress is resolved by coherence (circularity is acceptable).

  - Infinitism: the regress is infinite (the subject has an infinite chain of justifications).


  In-the-weeds positions:

  - Argue for infinitism.

  - Argue that infinitism requires an "infinite" number of justifications, which is
  impossible for a finite mind, and therefore infinitism is untenable. (This is the
  standard objection to infinitism.)

  - Argue that infinitism can be saved by "potential infinitism" or "deflationary
  infinitism" (Pritchard''s "potential infinitism").

  - Argue that coherentism is not a genuine response to the regress (it just concedes
  the regress and reinterprets it).

  - Argue that foundationalism''s "basic beliefs" are not really basic (they are still
  justified by something).

  - Argue that the regress problem is a pseudo-problem because justification is not
  a relation that requires an infinite chain.


