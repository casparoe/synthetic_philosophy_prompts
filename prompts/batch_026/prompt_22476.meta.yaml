  The "isolation objection" (also called the "disconnection objection" or the "world-connection
  objection"): A coherent set of beliefs can be entirely disconnected from the world
  and from experience. E.g., a person who believes "the moon is made of green cheese"
  and who has a coherent set of beliefs around that belief is not justified in that
  belief, even though the beliefs are coherent. So coherence alone is not sufficient
  for justification.


  Arguing against this: Coherentism does not require that beliefs be isolated from
  the world. In fact, coherentism holds that beliefs are justified by their coherence
  with other beliefs, and some of those beliefs are empirical (connected to experience).
  So the "isolation objection" only works against a weak version of coherentism (one
  that says any coherent set of beliefs is justified). A stronger version of coherentism
  (one that says a belief is justified iff it coheres with a set of beliefs that includes
  empirical beliefs) is not vulnerable to the "isolation objection."


