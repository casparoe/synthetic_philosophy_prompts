  The internal/external reasons debate:

  - Bernard Williams (1979, "Internal and External Reasons") introduced the distinction.

  - Internal reasons: a reason for an agent must be connected to the agent''s "subjective
  motivational set" (S), and it must be that some subset of S is such that right-minded
  deliberation of some kind (desire, belief, values, commitments, etc.) would render
  the agent motivated to act in the relevant way.

  - External reasons: reasons that can exist even if they are not connected to the
  agent''s actual motivational set. E.g., you have a reason to drink the poison-antidote
  even if you don''t believe it''s an antidote, or a reason to stop doing something
  harmful even if you don''t care.

  - The debate: Are all reasons internal (internalism) or can there be external reasons
  (externalism)?

  - In the weeds: There''s a distinction between "internal reasons" (Williams''s sense)
  and "internalism about reasons" (the metaethical thesis that all reasons are internal).
  Also, there''s the question of whether the subjective motivational set is too broad
  (if it includes all of one''s desires, beliefs, values, etc., then almost anything
  can be a reason) or too narrow.


