  The boundary problem (in political philosophy, e.g., as discussed by David Miller,
  Will Kymlicka, and in the context of democratic legitimacy) is the puzzle: a democracy
  is supposed to be the rule of the people, but who are "the people"? The boundary
  of the demos must be drawn, but the drawing of the boundary is itself a political
  decision that affects who gets to be in the demos. This is circular: the demos decides
  the boundaries of the demos. The puzzle is especially acute in cases of:

  - Independence referenda (who votes on whether a new state is created?)

  - The status of non-citizen residents (they are governed by the demos but not part
  of it)

  - The status of non-resident citizens (they are part of the demos but not governed
  by it in the same way)

  - Indigenous peoples (their claim to self-determination vs. the claim of the settled
  population)

  - Immigration (who gets to decide who can join the demos?)


  The main ways to resolve the boundary problem:

  1. Territorial connection: the demos is the people who live within a territory.
  But this excludes non-resident citizens and includes non-citizens.

  2. Cultural/national connection: the demos is a nation (a shared culture/language/identity).
  But this excludes multicultural societies and can be exclusionary.

  3. Democratic self-determination: the demos is whatever group has successfully established
  a democratic system (a "de facto" approach). But this legitimizes existing power
  structures.

  4. Consent/association: the demos is the group of people who have consented to be
  governed together. But consent is rarely explicit and can be coerced.

  5. A combination or a pragmatic approach: the boundary is a matter of political
  judgment, not a matter of philosophical principle.


  Implications for the Gulf-state foreign-worker case:

  - The current demos (citizens) is a small group that governs a large non-citizen
  majority. This is a clear case of the "all governed, some governors" problem (to
  borrow from the idea that democracy requires that those who are governed are the
  governors).

  - The multi-generational residents have a strong territorial connection (they were
  born there, they live there, they pay taxes) but no cultural/national connection
  to the citizen group (they are often from South Asia, they speak different languages,
  they have different religions).

  - The circularity is acute: any reform of who gets to vote is decided by the current
  demos, which is precisely what''s in question. The citizens have an obvious conflict
  of interest in deciding whether to expand the demos.

  - The "de facto" approach would say that the existing political system is legitimate
  because it is the one that is in place. But this is hard to square with the idea
  that democracy requires the consent of the governed.

  - The territorial approach would give the multi-generational residents a strong
  claim to the demos, but it would also give a claim to recent immigrants and to the
  non-citizen workers who are not multi-generational.

  - The cultural approach would exclude the foreign workers, but it would also exclude
  citizens who are culturally different (e.g., if there are ethnic minorities among
  the citizens).

  - The question of who gets to decide the rules of membership is itself a boundary
  problem: if the current demos decides, it is deciding in its own interest. If an
  external body decides (e.g., an international organization), that raises questions
  of legitimacy.


