  say that testimonial justification requires non-testimonial evidence that the source
  is reliable, while anti-reductionists say that testimony can be a default-entitled
  source, and my claim is that both sides are partly talking past one another because
  they are using ''reliability'' in two different senses. On the one hand, there is
  source-external reliability, the statistical or counterfactual fact that a particular
  kind of source tends to produce true reports; on the other, there is agent-internal
  warrant, the question whether the hearer has a reason, from the hearer''s perspective,
  to accept the report. I argue that reductionism is most plausible when ''reliability''
  is understood externally, but it becomes question-begging when it demands that the
  hearer already possess a non-testimonial justification for believing in that external
  reliability, because much of the evidence for reliability is itself testimonial
  or depends on a background practice of testimony. Anti-reductionism, I suggest,
  is better understood not as a claim that testimony is infallible or that default
  trust never needs to be checked, but as the claim that the default epistemic situation
  is one in which testimony is already a reason-giving source, and that defeaters
  operate by introducing specific reasons to doubt the source, the context, or the
