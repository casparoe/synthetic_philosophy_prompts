  But there''s a subtle point: "iterated elimination via dominance in mixed strategies"
  — the domain is specifically about dominance in mixed strategies. Key facts:

  1. A pure strategy is strictly dominated by a mixed strategy iff it''s never a best
  response to any belief (this is the standard result).

  2. Iterated elimination of strictly dominated strategies (allowing mixed dominators)
  is order-independent and its survivors are exactly the rationalizable strategies
  (Bergmann''s theorem / Pearce''s rationalizability).

  3. Iterated elimination of weakly dominated strategies is order-dependent — different
  orders give different survivors.

  4. Eliminating strictly dominated strategies is safe (doesn''t remove any best response
  to any belief over surviving strategies).


