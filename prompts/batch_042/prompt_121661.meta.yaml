  Argument:

  (1) If spatial relationism is true, then every spatial fact—including rotation—must
  be analyzable as a relation among actual material bodies.

  (2) Newton''s rotating bucket, taken in isolation, exhibits concave water surfaces
  that indicate real rotational motion.

  (3) The relationist can only preserve (1) by saying the bucket rotates relative
  to distant matter (the fixed stars or the cosmic mass distribution).

  (4) So on relationism, the local shape of the water is determined not by any feature
  of the bucket or water themselves, but by the global configuration of all matter
  in the universe.

  (5) The same reasoning applies to linear acceleration: the inertial forces I feel
  in a braking vehicle are not produced by any local interaction, but by my change
  of motion relative to the total cosmic mass.

  (6) Therefore relationism entails that every local dynamical fact is globally determined.

  (7) But physics operates on the assumption of local determinability: an experimenter
  in a closed laboratory can determine her state of motion with local instruments
  (accelerometers, gyroscopes) without knowing the distribution of distant galaxies.

  (8) If local determinability requires causal independence from distant matter, then
  relationism violates it.

  (9) By parity of reasoning, if global determination holds for mechanics, it holds
  for all physical properties—chemical bonds, nuclear decay rates, and so on—making
  every local law depend on cosmic boundary conditions.

  (10) That consequence is clearly false.

  (11) Hence relationism is false, and absolute space exists.


