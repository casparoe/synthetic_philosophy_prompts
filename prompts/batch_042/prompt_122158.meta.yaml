  I''m grading problem sets for an advanced seminar on rational choice and superrationality,
  and I''d like a second opinion on one submission. The exam asked students to work
  through Douglas Hofstadter''s Platonia dilemma—where twenty people are told that
  if exactly one sends a telegram by noon the next day that person receives a billion
  dollars, with cooperation forbidden and the superrational recommendation being to
  randomize with probability 1/20—alongside the real-world Luring Lottery that Scientific
  American ran in the 1980s, in which readers sent postcards bearing entry numbers
  for a prize of one million dollars divided by the total number of entries received.
  The question had four parts: (a) derive the superrational strategy in Platonia and
  explain why it is not the unique rational equilibrium; (b) show why the Luring Lottery
  generates a runaway incentive rather than a stable equilibrium, referencing the
  condition that optimal entries equal the total submitted by others; (c) distinguish
  how causal decision theory and evidential decision theory treat the correlation
  between agents in Platonia, and say which, if either, endorses Hofstadter''s recommendation;
  and (d) discuss whether the Luring Lottery''s actual outcome—where contestants submitted
  astronomically large numbers and mathematical expressions for maximal values—undermines
  superrationality descriptively or instead reveals an instability in competitive
  payoff structures.


  The student wrote: "(a) In the Platonia dilemma, twenty agents face symmetric incentives.
  Because sending a telegram costs almost nothing, the expected value of sending,
  assuming others randomize uniformly, is roughly fifty million dollars, so the superrational
  move is to randomize with probability one-twentieth. This avoids the tragedy of
  multiple senders. (b) In the Luring Lottery, each entry increases your chance of
  winning linearly but reduces the prize inversely with the total pool. If every other
  contestant submits N entries, your best response is also N, which means there is
  no fixed point: everyone wants to match an ever-growing total, producing an unbounded
  race. Many readers indeed sent entries numbering in the googols, which collapsed
  the prize to a negligible fraction and made it impossible to determine a winner.
  (c) Causal decision theory evaluates my action by its direct causal effects. Because
  my decision to send a telegram does not causally influence the other nineteen agents,
  CDT tells me to send whenever the expected payoff exceeds the cost; applied consistently
  across all agents, this yields the superrational randomization of one-twentieth,
  since each agent recognizes the identical causal structure. Evidential decision
  theory, by contrast, treats my choice as evidence about similar reasoners: if I
  send, that makes it more likely others do too, lowering my uniqueness. EDT therefore
  recommends abstaining or using a much lower probability. Thus Hofstadter''s superrational
  strategy is best supported by CDT, not EDT. (d) The fact that real contestants in
  the Luring Lottery ignored the cooperative strategy and instead pursued competitive
