  Tower: systems S1, S2, S3, … , where the states of each level are specified only
  by their causal roles within the level below, each level is "realized" by the next,
  and there is no bottom level whose properties are characterized intrinsically rather
  than by their relations and roles. There is no categorical ground floor anywhere
  in the Tower.

