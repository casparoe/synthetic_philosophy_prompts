  a prosthetic nervous system — has pain without P.

  (3) So pain is not identical with any physical property; and likewise for every
  other mental property. Reductive identity theories are false.

  (4) The standard repair: mental properties are second-order. To be in pain is to
  be in some first-order state that occupies causal role R; the occupant varies, the
  role-occupancy is what matters. This is consistent with (3).

  (5) But the argument of (1)–(3) is perfectly general — it applies to any kind whose
  instances can be physically diverse, and that includes valves, genes, currencies,
  temperatures. So the first-order realizers of mental properties are themselves functional,
  second-order properties, specified by their causal roles relative to whatever realizes
  them.

