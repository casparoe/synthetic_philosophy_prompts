  this is the improv actor: give the troupe a suggestion and it instantiates whoever
  the scene calls for; the actor does not have the character''s goals, and when the
  scene ends, the character does not persist. A related version: the persona produced
  by post-training is a mask bolted onto something alien, and no amount of fluent
  first-person talk tells you what is behind it.


