  this is, and I want it argued from what each side actually commits itself to, not
  surveyed.


  The hypothesis I have been working with is that there are at least three different
  questions under the single heading, and that progress is impossible while they are
  conflated: a question about ideals (what is worthy of admiration or of being held
  up), a question about deliberative reasons (what an agent has most reason to do,
  all things considered), and a question about self-cultivation (what it is sensible
  to aim at in forming a character, given how agents like us actually go wrong). ...


