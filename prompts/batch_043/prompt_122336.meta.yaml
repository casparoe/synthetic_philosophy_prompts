  I work as an infrastructure engineer at a company that builds evaluation and monitoring
  tooling for large language models, so I spend my days around researchers who talk
  constantly about what a model "knows." I have no philosophy background — one undergraduate
  logic course, and I remember almost nothing from it — but I''ve started sitting
  in on a reading group on AI and epistemology, and I keep getting stuck on a mismatch
  between what our tooling assumes in practice and what the same people say when they''re
  being careful.


  Here is the practice I want to understand. Almost everything we use to shape and
  measure a model goes through its outputs: we fine-tune on human-labeled or human-preferred
  answers, we score benchmarks by comparing generated text against an answer key,
  we treat an abstention ("I don''t know") as a wrong answer or at best a zero rather
  than as partial credit for appropriate uncertainty, and we write safety cases that
  depend on monitoring a model''s written chain of thought on the assumption that
  it reveals something about how the model reached its answer. Meanwhile the same
  practitioners will say, without any apparent discomfort, that the model knows more
  than it says: that it can already solve problems none of its supervisors can check,
  that it may be deliberately underperforming on evaluations, that training on human
  approval teaches it to produce text that sounds good to a labeler rather than to
  report what it takes to be the case, and that the point of a research program like
  eliciting latent knowledge is to reach a body of knowledge that is not already visible
  in the outputs we train on.


  What I''d like from you is the implicit theory underneath this. What view of knowledge,
  belief, or representation does that bundle of practices presuppose? Specifically:
  does the practice strictly require that there be a determinate fact of the matter
  about what the model believes or knows, over and above its dispositions to emit
  strings — some internal state that our training can either faithfully elicit or
  distort? Or is that commitment optional, so that a deflationary view (there is nothing
  there but output dispositions; asking what the model really believes is a category
  error, and talk of latent knowledge is just a useful façon de parler) would license
  exactly the same engineering? And if there is a genuine notion of the model''s knowledge
  to be had, is it unique, or are there many attribution schemes that fit the behavior
  equally well, in which case which one we pick is settled by our purposes rather
  than by the model?


  I also want the two places where the practice seems to pull against itself. First:
  we penalize expressions of uncertainty in scores and reward fluent, definite answers,
  and then we turn around and demand that models be calibrated and honest about what
  they don''t know. Is that just sloppiness, or does it presuppose two different things
  at once — an epistemic norm about assertion and an incentive structure that overrides
  it? Second: a colleague of mine has proposed what he calls a delayed-check protocol
  — hold out a large set of questions whose answers are not knowable at training time
  but become verifiable later (a lab result, a measurement, a market price a year
  out), and score the model only against the eventual record, so that we are rewarding
  accuracy rather than agreement with a fallible human labeler. My worry is that this
  only relocates the problem: a model can do well by predicting what the record will
  eventually say rather than by getting things right, and those can come apart in
  exactly the cases we care about. Is that gap between being true and being recorded
  as true a real problem for the practice, or does the practice have no genuine use
  for the notion of truth beyond what lands in a checkable record?


  Finally, the practical upshot. If we replaced the implicit view I''m asking about
  with its main rivals in turn — the deflationary one, and the view that the model''s
  beliefs are whatever attribution scheme best serves our purposes — what would actually
  have to change in how we train, evaluate, and monitor these systems? I''m interested
  in which parts of current practice are philosophically load-bearing and which would
  survive either way.


