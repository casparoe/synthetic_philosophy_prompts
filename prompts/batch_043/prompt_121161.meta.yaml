  The argument (call it "the private-credit argument" or "the confirmation asymmetry"):


  "Here''s my opening move. You say the survival question is empirical — fine, I''ll
  take that. But watch what happens to your own criterion. Take S = ''I, Freddie,
  will be conscious after my body dies.'' For S to be confirmed, someone has to be
  in a position to have the confirming experience. The only candidate is me, after
  death. So the truth of S is a necessary condition of S''s ever being confirmable
  — and its falsity guarantees that the confirming observation is never made by anyone.
  Compare T = ''I will not be conscious after my body dies.'' Other people can observe
  my body stop; but that''s evidence about a body, and whether the body''s stopping
  settles anything about me depends on exactly the materialist premise that''s in
  dispute — and you yourself have said a disembodied person isn''t a contradiction.
  So the third-party evidence never reaches the first-personal claim at all. Result:
  S is the one proposition that can only be verified from the inside, by the only
  person with standing, and only if it''s true. Which makes it not meaningless but
  *essentially private* — and it means your criterion has nothing to say against it,
  because it isn''t the empty metaphysics you were gunning for; it''s a hypothesis
  with a perfectly determinate, if uniquely situated, method of confirmation."


  Then the second prong: "And then there''s the red light. If private, unrepeatable,
  one-person evidence can move you at all — even a little, as you admitted it did
  — then you''ve already conceded that evidence can be person-relative. So either
  your own reaction to that episode was irrational, or my S-proposition gets its tiny
  bit of credit too. Which is it?"


