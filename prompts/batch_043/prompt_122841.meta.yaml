  - Deflationism: truth is not a substantive property; the truth predicate is a device
  for disquotation / generalization / blind endorsement. Motto: "It is true that snow
  is white" says no more than "snow is white."

  - Varieties: redundancy theory (Ramsey, Ayer, early Wittgenstein?), performative
  theory (Strawson? Actually Strawson''s performative theory of truth), prosentential
  theory (Grover, Camp, Belnap), minimalist theory (Horwich), disquotationalism (Quine,
  Field), Horwich''s use-based theory via the equivalence schema instances (ES): the
  proposition that p is true iff p.

  - Key commitments: (1) the T-schema (or ES instances) exhaust the nature of truth;
  (2) there is no underlying property (correspondence, coherence, pragmatic utility)
  that unifies truths; (3) truth is not a "substantive" or "explanatory" property
  — it can''t be invoked in explanations of success.

  - Objections: the generality problem — how do we get the general claim "every instance
  of ''p is true iff p''"? Horwich says via generalization over the instances, but
  then the generalization is a further claim; Dummett''s objection about the explanatory
  role of truth in explaining why true beliefs lead to successful action (truth must
