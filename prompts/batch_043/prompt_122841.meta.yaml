  Candidate 07


  Deflationism is best understood as a development of the redundancy theory of Ramsey
  and Ayer: to say that a proposition is true is not to ascribe to it some further
  property, over and above the property that the proposition itself ascribes. The
  theory is given by the equivalence schema: "the proposition that p is true if and
  only if p." Once you have all the instances — "the proposition that snow is white
  is true iff snow is white" and so on — you have said everything about truth that
  can be said; there is no hidden nature of truth left over for philosophers to discover.


  (a) It does not follow that "true" is useless. Deflationists distinguish what a
  word describes from what it does. Even if "true" describes nothing, it has an expressive
  or logical function: it lets us ascend to a level at which we can talk about whole
  classes of sentences rather than about the world. My example: when I say "it is
  true that snow is white," I succeed in committing myself to the claim that snow
  is white without asserting it in my own voice, and that is something I could not
  do without the truth predicate. This is what Quine means by semantic ascent: the
  truth predicate lets us discuss and endorse our own utterances from outside, and
  that is why it is indispensable.


  (b) The generality problem is that the deflationist cannot say what all and only
  the true propositions have in common. The instances are infinite, so she cannot
  list them, and because she denies that truth is a property she cannot pick out the
  true propositions in any other way either; so her "theory" is really just an infinite
  list that no one can state. Horwich''s reply is that a theory need not be a finite
  list: the instances are generated by a single finite schema together with the claim
  that they exhaust the facts about truth, and that is a perfectly general statement
  of the theory. Critics reply that the claim that the instances exhaust the facts
  about truth is itself a general claim about the nature of truth, of exactly the
  sort the deflationist wanted to avoid, so the position collapses into the kind of
  theory it was meant to replace.


  (c) The archivist''s case is not a new problem; it is the same problem as in (b),
  and it is solved by the same move. What the archivist wants to say is a gigantic
  disjunction of conjunctions: either these statements are true and those are not,
  or ... and so on. Because the truth predicate allows her to say in one sentence
  what she could not say in a million, she can express all of that at once. So the
  case actually shows that the generality problem is not a real difficulty: the deflationist
  can use "true" itself to generalize over the instances, and therefore needs no general
  account of what truth is. Since the archivist can make her claim without any translation,
  the deflationist does not need one either, and the fact that she can do without
  one shows that meaning and translation are irrelevant to truth — which is just what
  the deflationist should say.


