  Deflationism is best seen as a refinement of the redundancy theory of Ramsey and
  Ayer: to call a proposition true is not to ascribe to it a further property, over
  and above whatever the proposition itself ascribes. The theory is therefore given
  entirely by the equivalence schema, the proposition that p is true if and only if
  p. Once one has all the instances — the proposition that snow is white is true iff
  snow is white, and so on — one has said everything about truth that can be said,
  and there is no hidden nature of truth left over for philosophers to uncover.


  (a) None of this makes the word "true" useless. Deflationists distinguish what a
  word describes from what it does. Even if "true" describes nothing, it has an expressive
  or logical function: it permits a kind of ascent, to a standpoint from which we
  talk about our own sentences instead of about the world. My example: in saying "it
  is true that snow is white" I commit myself to the claim that snow is white without
  asserting it in my own voice, and that is something I could not do without the truth
  predicate. This is what Quine had in mind by semantic ascent. It is also why the
  word cannot be eliminated: without it we would have to assert everything flat out,
  and we should lose the capacity to stand back from a claim and endorse it from outside.


  (b) The generality problem is that the deflationist cannot say what all and only
  the true propositions have in common. The instances are infinite in number, so she
  cannot list them; and because she denies that truth is a property, she has no other
  way of picking out the propositions her theory is about either. So her "theory"
  is really an infinite list that no one can state. Horwich''s reply is that a theory
  does not have to be a finite list: the instances are generated by one finite schema,
  together with the claim that they exhaust the facts about truth, and that is a perfectly
  general statement of the position. Critics reply that this exhaustion claim is itself
  a general claim about the nature of truth, of precisely the kind the deflationist
  wanted to avoid, so that the view collapses back into the sort of theory it was
  meant to replace.


  (c) The archivist''s case is not a new difficulty; it is the same difficulty as
  in (b), and it is answered by the same move. The archivist is making a blind ascription
  — she endorses statements she cannot produce — and what she wants to say is a vast
  disjunction of conjunctions of instances, which the truth predicate lets her say
  in a single sentence instead of a million. So the case actually shows that the generality
  problem is no real difficulty at all: the deflationist can use "true" itself to
  generalize over the instances, and therefore needs no general account of what truth
  is. And since the archivist can make her claim without any translation, the deflationist
  needs none either; meaning and translation are simply irrelevant to truth, which
  is exactly what a deflationist should say.

