  the descriptive function of a predicate from its expressive or logical function.
  Even if ''true'' describes nothing, it lets us do things we could not otherwise
  do, because it lets us stand back from a sentence and comment on it or generalize
  over it. My example: if I say ''it is true that snow is white'', I can affirm the
  content of the sentence ''snow is white'' without having to assert it directly —
  the truth predicate lets me endorse a claim at one remove. This is the idea of ''semantic
  ascent'': as Quine emphasized, going up a level lets us talk about our own language
  and about what we accept, and it is what makes the truth predicate indispensable.


