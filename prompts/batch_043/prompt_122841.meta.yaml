  Truth — practice paper, 25 marks, 45 minutes. Answer all parts.


  Deflationary (or "minimalist") theories hold that the truth predicate does not stand
  for a substantive property and that the whole theory of truth consists in the instances
  of the equivalence schema: for any p, the proposition that p is true if and only
  if p.


  (a) If "true" does not describe anything, what is it for? State the expressive (or
  "logical") function that deflationists standardly appeal to, and illustrate it with
  a case in which the truth predicate does something that could not be achieved by
  simply asserting, one by one, the sentences one is prepared to endorse. (8 marks)


  (b) The "generality problem": the instances of the schema are infinitely many, and
  no one can accept or state them one at a time; yet the deflationist also wants to
  say something general about truth — that the instances are all there is to truth,
  for example — which looks like the kind of substantive claim she denies. Explain
  how a minimalist (Horwich is the usual example) responds, and why critics think
  the response fails. (9 marks)


  (c) An objection from a hypothetical critic, "the archivist": an archive contains
  a very large number of statements in a language no one can now read; the archivist
  has no translations and cannot produce a single one of the relevant instances, but
  says "at least half of the statements in the archive are true." Does the deflationist
  have the resources to say what the archivist is doing and what she is committed
  to? Is this a problem of the same kind as (b), or a different one? (8 marks)


