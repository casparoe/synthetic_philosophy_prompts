  "The incoherence problem is that in Everett every possible outcome of a measurement
  actually occurs, so there seems to be nothing left to be uncertain about: probability
  is standardly thought to require a single outcome that will in fact obtain. The
  usual answer is self-locating uncertainty: before the measurement the agent does
  not know which branch she will find herself on, even though she knows that some
  successor of hers will see each outcome; uncertainty about where in the branching
  structure one is located is enough to make probability talk coherent, and it gives
  the agent a reason to care about the weights even though all outcomes happen. The
  quantitative problem is separate: granting that there is something to be uncertain
  about, it is a further question what the numbers should be. Solving the first problem
  only tells you that credences are well-formed; it does not tell you that the up-branch
  gets |α|² rather than a half. So the two problems are conceptually independent,
  and the second needs its own argument.


  (b) The splitting device is decisive against branch egalitarianism. Egalitarianism
  says to divide credence by the number of branches, but the number of branches is
  not something fixed by the physical situation: by coupling an idle decohering system
  to one branch, the experimenter can turn one branch into two (or into a thousand)
  without changing anything about the measured system or about what any observer will
  see. Egalitarianism would then have the agent''s credence in ''up'' jump from 1/2
  to 2/3, even though the amplitudes are unchanged and the extra branch is not in
  any sense a new possibility. That is absurd: a rule for setting credences should
  not be sensitive to how finely we slice up the environment. The general moral is
  that branch count has no invariant physical meaning, since branching is a matter
  of degree and the decomposition into branches is only approximately picked out by
  decoherence; squared amplitude, by contrast, is additive and preserved under such
  fine-grainings, which is why the Born weights are the only ones that behave properly
  under splitting.


