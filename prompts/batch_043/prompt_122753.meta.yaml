  Title: "Which Cell Are You In? Reference-Class Sensitivity and the Heterogeneous
  Predictor"


  Thesis: Newcomb''s problem is standardly posed with a single accuracy number. That
  single number hides a partition. Once the predictor''s accuracy is allowed to vary
  across sub-populations, and once the agent can know the conditional statistics,
  the case splits: for the same physical decision situation, the recommended act flips
  depending on which statistics the agent has read, and — more sharply — depending
  on which partition the agent takes to be decision-theoretically salient. I argue
  (i) that CDT is unmoved by this (it two-boxes regardless), which is a cost for CDT
  if any of the heterogeneous cases are genuinely Newcomb-like; (ii) that EDT''s answer
  becomes partition-relative in a way that makes the theory underdetermined unless
  you add a rule for choosing the conditioning partition; (iii) that the natural FDT/TDT
  reply — condition on your algorithm, not on your surface traits — works only if
  the published statistics are read as *logical* correlations rather than sampling
  correlations, and that the case can be constructed so that the two come apart; and
  (iv) that the residual puzzle is whether there is a coherent notion of "the accuracy
  of a predictor with respect to an agent" that is independent of the predictor''s
  information about that agent.


