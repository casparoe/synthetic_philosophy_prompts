  ---


  I''ve just come away from a long argument with a friend about weakness of will that
  neither of us won, and I''d like to convert it into something more useful. Next
  week I''m recording a forty-five-minute episode of a podcast I host, and my guest
  is a philosopher who has just published a book-length dissolution of the topic:
  her claim is that there is no such thing as acting freely and intentionally against
  one''s own all-things-considered better judgment, in the sense that has puzzled
  philosophers since the Protagoras. What there is, on her account, is temporal fragmentation:
  agents weight near-future rewards disproportionately, so that as the smaller, sooner
  option approaches their preferences genuinely reverse; the earlier "better judgment"
  was a verdict delivered under a different weighting, and the sense of having been
  overcome is just what a reversal feels like from the inside. The machinery is the
  discount function; no divided self, no special judgment-to-action connection, no
  synchronic failure needs to be added. Whenever I pressed her on this in correspondence,
  she fell back on one line: that the worry belongs to the phenomenology of the reversal,
  and the mechanism is in the discount function.


