  you can''t intend to drink it — because intending involves believing you''ll do
  it, and you know you won''t. And you can''t intend to drink for the sake of getting
  the money since the money is already given. So there is a case where you can''t
  form an intention even though forming it would benefit you. Kavka''s upshot: this
  challenges the "deliberative" conception / shows a problem for the idea that we
  can intend at will; motivations for intending include the aim of intending itself;
