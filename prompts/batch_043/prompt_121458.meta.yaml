  \ text:\n\n1.\nIn the 1980s and 1990s, Douglas Hofstadter and his research group\
  \ built a program, Copycat, to work on analogies of a deliberately impoverished\
  \ sort. The world is twenty-six letters in a fixed order, finite strings of them,\
  \ and a handful of relations: successor, predecessor, sameness, grouping, left end,\
  \ right end. A problem looks like this: abc → abd :: ijk → ? ... The point of the\
  \ poverty is that nothing in the answer can come from what the letters mean. Whatever\
  \ makes one answer better than another has to come from how the strings are described.\
  \ So the domain turns analogy-making into something you can watch.\n\nTwo things\
  \ were claimed for it, and I want to keep them separate. The first is a mechanism:\
  \ many small processes compete to build partial descriptions of the situation, and\
  \ the description that wins is the one that, once built, makes the most sense of\
  \ the whole thing. Hofstadter called the result high-level perception — the claim\
  \ that answering such a problem is closer to seeing an ambiguous figure than to\
  \ searching and deducing. The second is an observation about what happens to the\
  \ descriptions under this pressure: concepts bend. The description that starts out\
  \ as \"replace the last letter by its successor\" can come out as \"replace the\
