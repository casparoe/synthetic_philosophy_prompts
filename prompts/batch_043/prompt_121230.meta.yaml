  a later switching-on, and there''s no third state to fall back on — so what''s broken
  is the idea that someone can complete an infinite sequence of acts, and the whole
  supertask idealization is rotten. Camp B (the underdetermination people, Benacerraf''s
  side) say the argument only shows the description doesn''t settle the answer: add
  a rule — at t=1 it''s on, or the state has to vary continuously through the limit,
