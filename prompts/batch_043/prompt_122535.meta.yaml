  \ a scoring mechanism.\n\nBut \"Same-sex marriage and what marriage is for\" + classroom\
  \ activity: maybe a role-play where participants must design a marriage law without\
  \ knowing... Hmm, the force: the \"what is marriage for\" question and the way the\
