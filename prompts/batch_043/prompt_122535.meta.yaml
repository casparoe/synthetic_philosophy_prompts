  \ the hypotheses on the table, and they discover that the winner is heavily determined\
  \ by who proposed what — the \"bad lot\" problem. That's very game-able: give them\
  \ evidence, have small groups each generate hypotheses privately, then reveal that\
  \ the best explanation depends on which hypotheses happened to be generated, and\
  \ that the best of a bad lot can be terrible while being \"best.\"\n\nHmm, which\
