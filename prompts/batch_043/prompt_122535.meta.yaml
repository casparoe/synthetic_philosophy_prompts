  \ a weird case... Hmm, that's more of a \"forced choice\" activity.\n\nI think the\
  \ IRL one is the most naturally game-like with payoffs and formal structure, and\
  \ it's delightfully in the weeds: the degenerate reward problem (Ng & Russell 2000\
  \ on reward shaping / potential-based shaping), the fact that any behavior is optimal\
  \ for infinitely many reward functions including a constant reward everywhere; the\
