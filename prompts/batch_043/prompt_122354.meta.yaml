  I did a maths degree about ten years ago, then went into software, and this spring
  I started running a fortnightly reading group at my local bookshop on what we''re
  actually doing when we do maths. We''ve had three sessions and it keeps going the
  same way: someone says "I suppose I''m a platonist" and then five minutes later
  they''re disagreeing with the next person who also just said they''re a platonist.
  So for session four I want to replace the labels with something diagnostic: a decision
  tree that sorts people by what they''ll say about cases, not by what they call themselves.


  What I want, concretely:


  - Start everyone from a commitment nearly all of us share — e.g. that the twin prime
  conjecture and the continuum hypothesis are meaningful, that we can and do prove
  things, that applied maths works absurdly well in physics — and then route them
  to a named position.

  - 8-10 branch questions, each a concrete case or claim someone with a maths degree
  can answer cold: the two children who learn the natural numbers as different set-theoretic
  reductions (so that whether 2 = {∅,{∅}} or 2 = {{∅}} seems to have no answer); the
  fact that the second-order Peano axioms pin down the naturals up to isomorphism
  while any first-order axiomatisation has non-standard models; whether the continuum
  hypothesis has a determinate truth value; whether a consistent-but-unapplied mathematical
  theory (somebody''s invented algebra with no physics attached) describes something
  real; whether we could ever be said to know or refer to objects that don''t causally
  interact with us; whether the truth of ''there are infinitely many twin primes''
  could depend on our best theory of physics (i.e. whether the indispensability thought
  has any pull); whether a definition that quantifies over a totality containing the
  thing being defined is legitimate; whether there could be two non-isomorphic ''natural
  number structures'' that both deserve the name.


  The three fault lines I care most about, and want the tree to actually separate
  rather than fudge:


  1. objects vs. structure — is arithmetic about individual objects with their own
  identities, or about positions in a pattern where the identity of the positions
  doesn''t matter beyond the relations?

  2. the epistemic one — how, if at all, do we get knowledge of (or reference to)
  things that are causally inert, and does it help to say the objects are ''thin''
  rather than spooky?

  3. uniqueness vs. plenitude — is there one intended structure of the natural numbers
  / one universe of sets, or do all the consistent ones exist side by side (non-standard
  models, the set-theoretic multiverse, and so on)?


  Deliverable: the tree with branch questions phrased so nobody can tell which view
  they lead to, and 8-10 leaves, each with the name of the position — platonism (thick/Gödelian
  vs. plenitudinous), structuralism (ante rem vs. in re), fictionalism, neo-logicism,
  constructivism/intuitionism, formalism, finitism/predicativism, whatever you think
  belongs — or just ''unnamed'' if you''re not confident a real view sits there. One
  sentence per leaf on the view''s most awkward commitment. Then a short note on (a)
  which combinations of answers your tree allows but nobody actually occupies, and
  whether that''s because the combination is incoherent, just unattractive, or merely
  unexplored, and (b) any two leaves your questions can''t actually tell apart (I
  suspect structuralism and platonism are going to be hard to separate with questions
  like these, but tell me honestly). No bibliography needed, we''re not writing papers
  — just the tree, the leaves, and the diagnostics.


