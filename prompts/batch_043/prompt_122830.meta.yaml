  ---


  I write fiction, and I am about to make a decision that a historian is free to postpone.
  My novel is narrated by a woman from a fishing household on the north shore of the
  lake, who attaches herself to a Galilean preacher and stays with him to the end.
  That means I have to settle, before drafting, what this preacher said, what he refused
  to say, what he thought he was doing, what the people travelling with him were expecting,
  and how much of any of it is simply the evangelists'' retrospection. I can hedge
  in a footnote; I cannot hedge in a scene. So I need a specification rather than
  a survey.


  Please write the desiderata that any method for getting from our sources — the four
  Gospels, with their well-known dependencies, Paul''s letters with their near-total
  silence on the life, the brief notices in Josephus, one of which is probably retouched
  by Christian hands — to a portrait of Jesus would have to satisfy. Fix the purpose
  as mine: a portrait good enough to build one determinate character on, capable of
  carrying a psychological arc and of acting for reasons the reader can follow, rather
  than a portrait good enough for a monograph. Whether the standard is the same for
  the two purposes is itself part of what I want you to decide.


  For each requirement give the case or consideration behind it, and mark it non-negotiable
  or a preference of one school or one craft. Among the things I want adjudicated:
  whether a method owes me anything about what he did not say and could not have done,
  or only about what he did; whether a method can be required to be independent of
  the historian''s prior portrait of Jesus, or whether every criterion of authenticity
  is doomed to ratify whatever portrait it was run to confirm; how a criterion should
  treat sources that are not neutral reports but interpretations produced by people
  who already believed, and whether the desiderata should ask the method to recover
  the believing community as well as the man, since I need the ensemble and not only
  the protagonist; and whether the portrait has to be at once continuous with first-century
  Jewish life and discontinuous enough to explain why a movement formed around him
  and why Rome killed him.


  I also want my own candidate criterion audited. I have been working with something
  I call narrative fit: a reconstruction is adequate only if the actions I need to
  stage follow from the sayings I attribute to him, and the sayings from the actions,
  without my having to supply a bridging motive the sources nowhere suggest. Is this
  a genuine desideratum, a novelist''s prejudice smuggled into historiographical method,
  or a requirement with a narrow but real domain — and if the last, over what range
  is it trustworthy?


  Then the two things I care about most. First, tell me which subset of your desiderata
  you suspect cannot all be satisfied together, and why: I would rather have the impossibility
  than a list that flatters my hopes. Second, name the single requirement that does
  the most work in excluding the criteria in ordinary use — embarrassment, dissimilarity,
  multiple attestation, Semitic or Palestinian linguistic and environmental colour,
  coherence with what has already been accepted — and score those against your list
  briefly, in a table if you like, since that part I can check myself.


  Two more things. Add a decision rule for an author: when the best-supported reconstruction
  of a scene has, say, a third or two-fifths of the probability mass and the alternatives
  are not dramatically worse, what may a novelist do, and where exactly does legitimate
  filling-in become dishonest? And mark your own confidence: put a confidence on each
  desideratum, tell me which one you would retreat on first, which consideration or
  piece of evidence would change your verdict about the most discriminating requirement,
  and where you think your reasoning is most likely to fail.


  ---


