  The skeptical reply I keep encountering is that this question is ill posed: ''China''
  was not a single decision-making unit, the outcome is a sprawling process rather
  than a datable event, and there is no determinate counterfactual — so there is nothing
  for a contrastive explanation to latch onto. My difficulty is that this line of
  argument seems to prove far too much. Contrastive why-questions are the bread and
  butter of the natural sciences, and on the standard account a why-question is fixed
  by a topic, a contrast class, and a relevance relation, with the difference-maker
  read off a shared causal background. Nothing in that machinery requires the topic
  to be a datable event or the foil to have been a live option for some agent: ''why
  did this nucleus decay at t rather than remain stable through t'' is a perfectly
  good question even though there was no prior fact of the matter. And as for the
  unit worry, it looks like it should be dissolved by decomposition: if ''China''
  is too coarse a foil, ask instead why Lancashire rather than the Yangzi Delta, and
  keep decomposing until the relata are genuinely comparable. So my question is this:
  once the contrast class is narrowed and the topic is specified precisely enough,
  is there any residue to the ''ill-posed'' objection at all? If there is, I''d like
  to know exactly what it is and what it tells us about explanation in history generally
  — because if the objection is only that the original question was vaguely worded,
  then it seems to me that ''contrastive explanation is fine in history'' and there
  is no interesting methodological lesson; whereas if the objection survives precision,
  I cannot see how we could ever explain any large historical outcome, and I suspect
  something has gone wrong in the argument."


  Hmm, good. Confusion in there: (a) that the shared-causal-background requirement
  can be satisfied by decomposing to comparable relata — but decomposing to finer-grained
  units doesn''t give you a common causal background; the causal background of Lancashire
  and the Yangzi Delta differ wholesale, and you can''t read off a single difference-maker.
  (b) presupposes that the "ill-posed" objection is about vagueness/units per se rather
  than about the failure of the presupposition of a shared causal background and the
  fact that large historical outcomes involve interaction/causal-field differences.
  (c) presupposes a false dichotomy: either the objection is mere vagueness (no lesson)
  or it survives and no historical explanation is possible — missing the intermediate
  options: the question may be well posed but not expect a single difference-maker;
  contrastive explanation may need "structural" comparison rather than difference-making;
  the lesson may be about the pragmatics of explanation (what counts as the relevance
  relation varies with inquirer''s interests), or about path-dependence/equifinality,
  or the "contrastive" question may misdescribe as a competition what was causally
  entangled (coal and colonies: Britain''s divergence depended on New World resources
  — the relata aren''t independent). Also: the presupposition that the nuclear-decay
  case has "no prior fact of the matter" and is nonetheless fine — a good answer would
  note that in the decay case there''s a well-defined repeatable event type, a stochastic
  law, and a homogeneous background — precisely the structure the historical case
  lacks. And maybe: that a contrastive question''s presupposition (that the topic
  obtains and some foil doesn''t) requires the topic to be a stable, projectible kind
  — "the Industrial Revolution" as a natural-history-of-events type.


  Also a nice point: the false presupposition that "why Britain and not China" is
  asking for a contrastive explanation at all in the same sense — the "Needham question"
  is arguably a "why not" (negative) question about a non-occurrence, and non-occurrences
  are contrasts over huge, heterogeneous contrast classes.


  Also worth including: an interesting false presupposition: that once you specify
  a contrast class, the "relevance relation" is supplied by the causal facts alone,
  rather than by the inquirer''s interests — so the "ill-posed" complaint is often
  about the relevance relation being supplied by present-day interests (why did the
  West win), i.e., the question is well-formed but its interest-relative framing invites
  bad answers.


