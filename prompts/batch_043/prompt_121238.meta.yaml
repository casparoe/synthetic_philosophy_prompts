  ---


  Hey — I''m a journalist covering science and ideas, and I''m putting in for a nine-month
  writing fellowship that wants a two-page project proposal. Here''s my half-formed
  idea, which I need turned into something a committee will take seriously.


  Everyone reaching for big ideas about AI right now is grabbing Dennett''s ladder
  of minds — Darwinian, Skinnerian, Popperian, Gregorian creatures — and the move
  I keep hearing is that a language model is obviously a Gregorian creature, because
  its brain gets rewired by uptake of our words. I think that''s too fast, and possibly
  backwards.


  What bugs me is that each grade up the ladder looks like it''s defined by a timescale
  of selection — species, individual lifetime, deliberation inside a lifetime, culture
  — plus the creature itself being what does the selecting at that timescale. A deployed
  frontier model doesn''t seem to learn during anything we''d call a lifetime: the
  learning is done across an enormous population of surrogate episodes (gradient steps,
  rollouts, accepted and rejected samples) that no individual ever lives through,
  and then the result is frozen. So maybe it isn''t a Gregorian creature at all but
  a grade the taxonomy has no name for — something whose ontogeny is outsourced to
  a population of lives that were never lived, or something with no ontogeny at all.
  I''ve been toying with ''episodic'' or ''Baldwinian'' creature as a label, but I
  want the concept to be right before I bother naming it.


  A second, seperate thread I want in the proposal: the Popperian grade is supposed
  to be about letting your hypotheses die in your stead. Is chain-of-thought plus
  process-level feedback actually that, or is it just a Skinnerian shaping of verbal
  behavior that looks like hypothesis-testing from the outside? And does it matter
  who''s doing the dying — the policy, the reward model, the training run?


  What I need: the question stated tightly enough that someone could argue against
  it; why Dennett''s own framing and the standard way people are applying it leave
  it open; what I''d actually do month by month for nine months as a journalist rather
  than an academic (I can read the technical stuff and interview people, I''m not
  running experiments); what the deliverable is, I''m imaginging one long reported
  piece and one shorter polemical thing; and an honest note on whether this is too
  big for nine months. Most importantly, what would count as the project failing —
  if the honest conclusion is that ''Gregorian'' was always loose enough to cover
  anything trained on human text, I''d rather find that out in month two than month
  nine. Skip citations, I''ll do my own fact-checking and sourcing.


