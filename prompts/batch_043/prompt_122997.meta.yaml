  \ \"allowing\" from \"killing by redirecting\"?). Actually, redirecting a ventilator\
  \ is often classified as killing, not letting die. If the committee approved it,\
  \ that suggests something like \"no rights violation / greater good\" rather than\
  \ acts/omissions.\n\nHmm. Let's think of the candidate rules:\n\nRule A: Acts/Omissions\
  \ Doctrine (AOD): killing is impermissible, letting die permissible (as such). But\
  \ then case 3 (morphine hastening death) — is that killing or letting die? Forestalling...\
  \ Standard: it's often treated as killing but permissible via double effect. If\
