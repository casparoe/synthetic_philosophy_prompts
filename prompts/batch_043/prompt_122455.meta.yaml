  Structure:

  - Casual opening: reading group / course on early modern philosophy, stuck on Hobbes
  and geometry. My friend and I came up with a test/criterion.

  - State the puzzle: Hobbes is a nominalist + empiricist + materialist; all knowledge
  originates in sense; universals are names; yet geometry delivers necessary, exact,
  demonstrative knowledge — the one science that''s actually demonstrative — and he
  wants to export the method to politics. How? The received answer: definitions give
  the causes because we make (generate) the object — a circle is defined by the motion
  that produces it; so demonstration is causal and hence necessary; and physical science
  only gets conjecture because we don''t make bodies.

  - The wrinkle / injected niche idea: our "generation-independence test" (or "swap
  test"): if certainty comes from our producing the object, then swap the generation
  and the proof should break; if it''s really about names, a wrong generation with
  right names should still work. Then the concrete case: a geometer who learns all
  the definitions and proofs as sentences but constructs the figure wrongly (e.g.,
  produces a "circle" by tracing a coin, or a "straight line" by a taut string that
  sags) — do they know the theorem? And the exactness worry: no drawn line is perfectly
  straight, so if the construction is physical, geometry inherits inexactness; if
  it''s mental/nominal, we''re back to names, and then what makes geometry different
  from any verbal deduction, including the bad ones Hobbes himself produced when he
  thought he''d squared the circle?

  - Second injected twist maybe: apply it to Leviathan — is the "geometric" claim
  about civil philosophy honorific or substantive? (Maybe include briefly: "and whether
  any of this licenses the ''geometric'' rhetoric he uses about his civil science.")

  - Ask: explain the underlying mechanics intuitively, where the real pressure point
  is, what the strongest Hobbesian reply is, and be honest about where Hobbes wobbles;
  correct me if I''ve misdescribed the pieces. Say I''m not after citations.

  - Length: ~2-3 paragraphs, casual, one or two typos.


