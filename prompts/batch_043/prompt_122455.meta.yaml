  particulars, there are no abstract objects floating around — and yet he thinks geometry
  is basically the one body of knowledge that is genuinely demonstrative, and he wants
  to export its method into natural philosophy and then into politics. The usual story
  about how he pulls this off is that geometrical definitions are generative/causal:
  you define a figure by the motion that produces it, and because the figure is something
