  nominalism and how geometry still gets necessity.


  The "explain some conceptual issue" type could be: explain how Hobbes thought geometry
  could give necessary, causal knowledge given that (a) he''s a nominalist about universals
  — no abstract entities — (b) he thinks all knowledge comes from sense, and sense
