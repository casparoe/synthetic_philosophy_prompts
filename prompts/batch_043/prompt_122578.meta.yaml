  \ resources including internal talents? or Arneson/Cohen's \"equal access to advantage\"\
  ?): verdict X\n- Welfarism (sum of welfare? or equality of welfare over lives?):\
  \ verdict Y\n- Capability: verdict Z\n\nLet me choose: \"Construct a case where,\
