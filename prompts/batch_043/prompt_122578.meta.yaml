  \ where two people are equally well off in resources but clearly unequal in welfare\
  \ and capabilities; or a case where resourcism and welfarism agree but capabilities\
  \ diverges.\n\nAlternatively, \"Should the numbers count?\" with a thought experiment:\
  \ construct a case where numbers don't count (Taurek-style) — but designing that\
  \ is basically Taurek's own case. Hmm.\n\nLet me think about \"Give an example of\
  \ some conceptual issue\" — simpler.\n\nI think the thought experiment type is richest\
  \ and matches the guidelines best. Domain: \"Equality of what?\" Let's design.\n\
  \nRequirements:\n- Realistic setting, no sci-fi.\n- Inject niche/new idea so it's\
  \ not regurgitated.\n- The scenario must be engineered so specified theories deliver\
  \ specified verdicts.\n- Demonstrate each specification, note which feature does\
  \ the work, what happens if removed, and how a defender of the badly-coming-off\
  \ theory would attack.\n- From perspective of a philosophy professor, relatively\
  \ formal/polished.\n- Relatively short but a few sentences allowed (thought experiment\
  \ type inherently requires more).\n\nDesign: I want a case where:\n- Resources (Dworkin-style\
  \ resourcism, or Cohen): equal\n- Welfare: equal\n- Capabilities (Sen/Nussbaum):\
  \ unequal (or vice versa)\n\nActually a nice design: two people with equal resources\
  \ and equal welfare but unequal capabilities. That's a known point: Sen's criticism\
  \ — a person with a disability may have equal welfare (because of adaptive preferences)\
  \ and equal resources but less capability. But that's standard. To make it niche,\
  \ I could add a twist: equal resources, equal welfare, unequal capability, and the\
  \ capability gap is one that neither person wants fixed — e.g., a \"expensive taste\
  \ / voluntary cultivation\" issue.\n\nAlternative direction: make capabilities equal\
  \ but welfare and resources unequal — harder.\n\nBetter: engineer a case where:\n\
  - Resourcism says: A and B are equal (or A is worse off by resources)\n- Welfarism\
  \ says: B is worse off\n- Capabilities says: they're equal... hmm.\n\nLet me think\
  \ of a nice \"three-way split\" case: each of the three metrics gives a different\
  \ verdict — that's an elegant specification: \"all three metrics disagree pairwise\"\
  \ or \"resourcist says A worse off, welfarist says B worse off, capability theorist\
  \ says equal.\" Actually a classic three-way split: \n- Resources: A has more (A\
  \ worse resourced)\n- Welfare: A is happier (B worse off in welfare)\n- Capabilities:\
  \ equal (they can do the same things)\n\nHmm, is that jointly satisfiable nontrivially?\
  \ A has fewer resources but is better off in welfare because she has cheap tastes/adaptive\
  \ contentment; capabilities equal because despite fewer resources she can do everything\
  \ B can (because she needs less). That's a real case—the \"happy peasant\"/adaptive\
  \ preference case. But that's standard.\n\nMake it more interesting: the twist that\
  \ makes it non-trivial: I want the case to isolate a specific variable: \"the same\
  \ person over time\"? Or a case where the currency of equality matters for a distributive\
  \ question between two people who both have a claim.\n\nLet me add a niche conceptual\
  \ ingredient: a \"modular\" or \"separability\" condition — e.g., the case involves\
  \ a resource that is not transferable/fungible and a capability that is socially\
  \ indexed. Or the niche idea: \"capability equality requires equality in *combined*\
  \ capabilities (Sen's distinction between a person's capability set and 'combined\
  \ capabilities')\". Hmm.\n\nNiche injected idea candidates:\n1. \"Socially-indexed\
  \ capability\": a capability whose exercise depends on others' behavior — e.g.,\
  \ the capability to appear in public without shame depends on local norms. Then\
  \ two people with identical internal powers have unequal capability because of their\
  \ social environment, and the resourcist/welfarist see no inequality. That's nice\
  \ and it's a genuine Sen point (environmental/social conditioning of capabilities)\
  \ but pushed further.\n\n2. \"Option-value vs. actually-exercised functionings\"\
  : someone has a capability they will certainly never exercise and don't value having\
  \ — e.g., the capability to run for office. Equal capabilities but the resources\
  \ spent maintaining it.\n\n3. The \"expensive tastes\" + \"adaptive preferences\"\
  \ tension.\n\nI like a design: two people, equal resources, equal (indeed maximal)\
  \ welfare, unequal capabilities; plus the constraint that the capability inequality\
  \ is *not* traceable to any difference in internal constitution, talent, or preference\
  \ — it's purely relational/social. And the further constraint: the worse-off-in-capability\
  \ person would not be made better off by any transfer of resources, and would report\
  \ no welfare loss. So the case isolates the \"social/relational\" component of capability.\n\
  \nHmm, but is that too easy / just Sen's standard critique? To make it non-trivial,\
  \ I need the capability theorist's verdict to be *uncomfortable*: e.g., the capability\
