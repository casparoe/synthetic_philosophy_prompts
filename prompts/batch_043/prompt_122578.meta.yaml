  \ \"positional\" or \"socially contingent\" capability whose equalization would\
  \ require changing other people's attitudes rather than distributing anything. Then\
  \ the resourcist/welfarist can attack: \"your metric is now measuring facts about\
  \ third parties' attitudes, not about how these people's lives go in any distributable\
  \ sense.\"\n\nThat's a good dialectical structure. Let me formalize the specification.\n\
  \nActually, let me reconsider — maybe better to require the three views to come\
