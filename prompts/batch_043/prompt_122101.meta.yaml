  thing: the case for taking a high-earning job to fund donations rests on a replaceability
  claim — if I don''t take it, someone else will and they''ll give less — and critics
  say that reasoning takes the labor market as given and can''t see the job itself
  as part of the causal structure you''d want to change. (3) measurability bias: we
  fund what we can count, so the portfolio skews toward interventions with short,
  quantifiable, attributable effects and away from anything diffuse, long-run, or
  structural.


