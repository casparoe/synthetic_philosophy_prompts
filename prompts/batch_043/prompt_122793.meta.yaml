  Structure:

  1. Frame: I''m preparing a lecture / writing an essay on Gattaca (1997, Andrew Niccol).
  I want to use it to teach what heritability does and does not mean, but I don''t
  want to enlist the film in a lazy way.

  2. State the concept carefully (as the asker''s own understanding, inviting correction):
  heritability is a population statistic — the ratio of genetic variance to phenotypic
  variance in a defined population in a defined environment; it is not a measure of
  how "genetic" a trait is in an individual, not a measure of immutability, not a
  licence to infer causes of between-group differences, and it is consistent with
  a trait''s being highly responsive to environmental change.

  3. Say the easy reading I''m suspicious of: Gattaca dramatizes genetic determinism
  and refutes it with willpower; the film''s own moral seems to be that the profile
  under-predicts the person. That reading is too easy and also unfair. Note the film
  isn''t denying genes matter — the twelve-finger pianist, and the engineered capacities
  are real. So the film is not saying "genes don''t matter."

  4. Ask: which specific fallacy about heritability does the film''s society actually
  commit? Is it the individual-level inference (from population statistic to individual
  destiny — the profile, with its 30.2-year life expectancy), or the immutability
  inference, or something else? And what about the reverse: does the film itself lean
  on a populist "genes aren''t destiny" slogan that would be equally a misuse?

  5. Inject niche ideas as the asker''s own: (a) if the enhancement were universal
  and standardized, genetic variance for the enhanced traits would approach zero,
  so heritability of those traits would be undefined or near zero — yet the traits
  would be at their most "genetic"; does the film notice this and is the point fair?
  (b) stratification creates gene-environment correlation: because opportunity tracks
  genotype in Gattaca, the measured heritability of career outcomes would be higher
  than in a society where opportunity doesn''t track genotype — so the world of the
