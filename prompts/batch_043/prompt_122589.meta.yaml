  I am on a committee reviewing the undergraduate curriculum of my university''s history
  department, and the more closely I look at what we already do, the less I can tell
  what we think history is for. I would like a philosophical reconstruction of what
  our practices presuppose — not a defence of them, at least not to begin with.


  The practices, as concretely as I can put them.


  First, the course that satisfies the general-education requirement for non-specialists
  is organised around a short list of named figures, founding moments, and masterworks;
  the catalogue copy promises that students will encounter greatness and be enlarged
  by it. The department also funds an annual named lecture in memory of one of its
  own founding scholars, at which a senior historian speaks about a predecessor''s
  achievement rather than about his errors.


  Second, the research economy of the same department runs on the opposite scale.
  Doctoral training, hiring, and promotion reward the archival monograph, and the
  question asked of it is whether it establishes something new from primary sources
  on a subject that perhaps a dozen people in the world care about. In graduate seminars,
  the grand narrative, the memorable example, and anything written for a general reader
  are treated as signs of intellectual laxity.


  Third, a large share of our teaching is unmasking in orientation: courses whose
  organising claim is that canons, founding narratives, and revered texts are instruments
  of power, and that the historian''s job is to expose them as such. These courses
  are the ones students are most often required to take.


  Fourth — and I do not know how common this is — two conventions about time. No course
  on any event less than fifty years old may count toward the major, on the stated
  ground that the recent past is politics and only the distant past is history. And
  the university may name nothing — a building, a lectureship, a prize — for anyone
  who has been dead for less than twenty-five years; when a name becomes controversial,
  the standing policy is to annotate the plaque rather than remove it.


  The puzzle. Followed consistently, each of the first three strands seems to destroy
  the others. If the canon is an instrument of power, the general-education course
  is indoctrination. If the only serious history is the archival monograph, the canon
  is arbitrary and the unmasking course is popularisation with a political slant.
  If history''s business is to hold up examples of greatness, the specialist''s devotion
