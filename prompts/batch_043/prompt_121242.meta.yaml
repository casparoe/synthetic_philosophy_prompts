  stretch ''ability'' past breaking point. Say which and what it costs.

  - The phenomenal-concept / old-fact-new-guise move should come out worse than usual:
  with no durable recognitional capacity there''s no ordinary recognitional concept
  for her to acquire, so the strategist has to fall back on a one-off demonstrative
