  are mathematics and computer-science students who have seen the statements of Gödel''s
  first incompleteness theorem and the halting problem and nothing of philosophical
  logic. I do not need the paradox explained to me. What I need is a plan for explaining
  it, with the dependency structure stated as dependency: which component cannot be
  introduced before which, and what breaks if it is.


  My sense is that the session should present the paradox as a collision among a small
  set of individually compelling theses — bivalence, classical consequence, the unrestricted
  disquotational behaviour of true, and the capacity of the language to talk about
  its own sentences — and then let each major approach be seen as a decision about
  which thesis to surrender. But I am not confident about the order in which those
  theses should be made explicit, and in particular about whether the collision should
  be derived first and the diagnosis offered afterwards, or whether some diagnosis
  has to be on the table before the derivation will look like a problem rather than
  a conjuring trick.


