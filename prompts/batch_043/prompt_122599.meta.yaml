  Hey — I need a Q&A prep sheet. Context: I''m a fifth-year ABD, my department is
  filming my practice job talk in eleven days and the placement committee uses the
  tape to decide whether to send me on flyouts, so I want to be ready for the room
  rather than ready for the ideal reader. Here''s the paper. I argue three things.
  First: the standard test for whether a dispute is merely verbal — hold the contested
  term fixed, see whether a disagreement still survives — can''t actually be run from
  a neutral standpoint, because it needs a shared metalanguage in which to state the
  residual disagreement, and in the cases people actually fight about the contested
  term is load-bearing in the metalanguage too (you can''t state what the universalist
  and the nihilist disagree about without using ''there is'' or ''composite'' or ''arranged,''
  and those are the very words under dispute). So for the disputes that matter, ''is
  it verbal?'' has no neutral answer — it only has an answer relative to which metalanguage
  you let the combatants share. Second, and this is the part I actually want the job
  for: once you see that, the residual question isn''t the ontological one (''what
  exists?'') but an engineering one — which vocabulary should we institutionalize
  going forward? And that question isn''t arbitrary, because when a community adopts
  a vocabulary it inherits only part of the web of commitments that vocabulary came
  with; people don''t revise every collateral belief when they switch terms. I call
  what they end up stuck with residual inferential load, and I claim we can compare
  candidate vocabularies by the load they''d saddle us with, given the community''s
  actual (non-semantic) habits of inference. Third, the upshot: a dispute can be fully
  merely verbal and still matter more than a lot of substantive ones, because the
  load is what does the work, not the ontology. So ''merely'' is doing no work and
  we should stop issuing verbal-dispute verdicts as shrugs. My two cases are composition
  (universalism vs. nihilism about the table and the particles arranged tablewise)
  and a live one from my partner''s lab — she''s a computational biologist, and her
  group and another group are fighting about whether a cluster of cells that falls
