  Let''s outline prompt:


  Paragraph 1: Set context. "I’m taking an upper-level seminar on distributive justice,
  and we’ve been working through the equality of what debate—whether the currency
  of egalitarian justice should be welfare, resources, or capabilities. In study group,
  one of my friends keeps leaning on an analogy that I suspect is doing too much work.
  He says: imagine a city installing a public bike-share system and choosing among
  three policies. Under the resources policy, every adult resident is issued exactly
  the same standard bicycle, no more and no less. Under the welfare policy, the city
  asks each resident how satisfied they are with their commute and mobility options,
  and then hands out whatever mix of standard bike, e-bike, cargo trike, or free transit
  pass would leave everyone at the same self-reported level of satisfaction with getting
  around. Under the capabilities policy, the city instead aims to give every resident
  an equal real freedom to get around by bicycle if they want to—which might mean
  an e-bike for someone with a heart condition, a handcycle or a bike with outriggers
  for someone with a disability, better-lit streets and secure parking in a neighborhood
  where theft is common, and a free transit pass for someone who lives far from any
  safe bike lane—while not caring whether residents actually end up equally happy
  with the result or whether they own identical hardware. My friend uses the bike-share
  case to argue that the capability policy is obviously the right one and that the
  other two are straw men: equal resources ignores that different bodies and neighborhoods
  turn the same bike into very different amounts of real freedom, and equal welfare
  panders to expensive tastes or to people who have adapted their desires downward,
  so it would give the cycling enthusiast a fancy bike and the person who has given
  up on cycling a bigger TV instead. He says the bike-share analogy shows that what
  we should equalize is not the hardware and not the smiles, but the genuine opportunity
  to move around."


  Paragraph 2: "I want to audit that analogy rather than just accept or reject it.
  Please give me: (1) an explicit correspondence table for the bike-share analogy—what
  in the analogy plays the role of resources, of welfare, and of capabilities, what
  plays the role of the distributor (the city), of the recipients, of the conversion
  of means into freedom, and of choice or responsibility; (2) the places where the
  mapping breaks down, separating the disanalogies that are harmless for his argument
  from the ones that actually damage it; (3) an account of which features of a bike-share
  system the analogy smuggles into the theory of justice—e.g., that the good to be
  equalized is a single, discrete, publicly provisioned good with an obvious metric,
  that needs are observable and verifiable, that usage is voluntary and easy to measure,
  that interpersonal comparisons of satisfaction are as easy as a customer-satisfaction
  survey, that no one has adaptive preferences or expensive tastes about bikes, and
  that the relevant freedom is one-dimensional—and say why those features are not
  true of welfare, resources, or capabilities in the actual debate; and (4) a verdict
  on whether the conclusion—that capabilities are the correct currency of egalitarian
  justice—survives once the disanalogies are on the table, or whether the analogy
  was carrying the whole argument. Finally, if the bike-share analogy is too rigid,
  propose a better analogy (or a modification of this one) that a defender of equality
  of resources, or of equality of welfare, could also accept, and say what each of
  the three views would want the analogy to build in."


