  Draft:


  Hey — I need a hand with the final for my upper-level philosophy of biology seminar
  (mostly juniors/seniors, they''ve done some philosophy of science but this is their
  first philosophy of biology course). It''s a 3-hour in-class final but I want one
  question that''s a self-contained 45-minute essay worth 25 of the 100 points. Topic:
  adaptationism and the Gould–Lewontin spandrels critique.


  The problem I keep having: every version of this question I write gets answered
  by a competent recapitulation — student says "Gould and Lewontin argued that adaptationists
  tell just-so stories and mistake architectural byproducts for adaptations, the spandrels
  of the cathedral vault being the example; adaptationists reply that byproducts can
  be co-opted later and that optimality models are genuinely testable; so really it''s
  an empirical dispute." All true, all worth a B, and none of it shows me whether
  they actually understand anything. I want a question where that paragraph gets you
  maybe 12/25.


  So here''s what I want you to do. First, put yourself in the role of a professional
  philosopher of biology who''s taught this material many times and knows the adaptationism
  debates from the inside. Then brainstorm before you write anything: give me a few
  paragraphs where you sketch three candidate questions, throw out at least two of
  them by name with a reason (this one is answerable by recitation, that one hinges
  on a fact about a real taxon that nobody could be expected to know in an exam room),
  and keep the one that survives. I want to see the rejects.


  Constraints on the question I keep coming back to, in case they help. I want to
  build it around a made-up case study so there''s nothing to look up, and I want
  to smuggle in a wrinkle that isn''t in the standard back-and-forth. Roughly the
  shape I have in mind — feel free to change it, but keep this level of specificity:


  [case details]


  ...


  The wrinkle I want to inject [lock-in / evidential erosion] ...


  Then: the question itself should force a choice between: (i) the spandrels critique
  is best read as a claim about the order/structure of explanation rather than about
  causal history; (ii) it''s an empirical claim that has quietly become untestable
  in cases like this; (iii) it dissolves under the origin/maintenance distinction
  — and that dissolution is itself a substantive, non-neutral move. Students should
  have to pick and defend, not list.


  Deliverables:

  1. The question, exactly as it''d appear on the exam (with the case study written
  up — make it biologically plausible and keep the made-up names clearly made-up so
  nobody wastes time trying to recall a real species).

  2. A model answer of roughly 800 words. No citations, no bibliography, no reading
  list — I''ll drop the readings in myself. Do mark, in brackets inline, which claims
  are things that pretty much everyone who knows the literature would grant versus
  which are genuinely contested among specialists; I want to be able to tell at a
  glance where the model answer itself is taking a side. Be explicit about where you''re
  not sure and where reasonable people in the field would disagree, and don''t smooth
  a live controversy into a consensus — if half the field would reject the move you''re
  making, say so.

  3. A marking scheme: total 25, broken into 5 or 6 must-hit points with marks each,
  plus for each point a one-line note on how students typically blow it. Plus short
  A / B / C band descriptions where the A-vs-B line is drawn on specific moves rather
  than on "more detail" or "better prose."


  A couple of don''ts: don''t let the question be won by anybody who''s memorized
  the three-way taxonomy of adaptationism we gave them in week 2 (empirical / methodological
  / explanatory) — using it correctly should be necessary for an A but nowhere near
  sufficient. And don''t make it depend on any real empirical finding or on knowing
  who said what; a student who hasn''t done the reading for two weeks should still
  be able to reason through the case.


  Thanks!


