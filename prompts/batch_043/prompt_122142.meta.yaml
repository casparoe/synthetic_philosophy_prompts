  Fictional: A lineage of burrowing lizards endemic to a volcanic plateau (call them
  "ash borers"). Two traits:

  (1) A massively reinforced, fused braincase with thick bony struts — needed for
  ramming compacted ash; a clear adaptation.

  (2) As an architectural side-effect, the bony struts pinch the optic nerve canal,
  so adults have very low visual acuity and a reduced visual processing region in
  the brain.

  (3) But: these lizards have species-specific, conspicuously colored throat fans
  used in close-range courtship displays, and mate choice experiments show females
  prefer brighter fans — so vision is doing real work now.

  (4) Also: relatives in soft-soil habitats have unfused skulls and good vision.


  Now the crux: is the low acuity a spandrel or an adaptation? Two competing stories:
  (a) spandrel + subsequent co-option (poor acuity was a byproduct; then selection
  built the displays to work within low-acuity constraints — the displays exploit
  the low acuity, e.g., because low acuity makes fine discriminations impossible,
  so signals had to get gross and conspicuous); (b) adaptation all along: poor vision
  is selected because eyes are costly and useless underground (energy savings, reduced
  predation risk from eye injury etc.), and the skull reinforcement was itself partly
  shaped by that selection.


  Then the "lock-in" twist: The species also shows derived features that *compensate*
  for low acuity — e.g., enlarged olfactory bulbs, and the visual system has been
  rewired so that a formerly-smaller region now does motion detection with high sensitivity
  to the specific wavelengths of the throat fan. So the original architectural constraint
  has been partially repaired/erased by later selection: the current system is a tuned,
  apparently well-designed low-acuity visual system. Ask: does the existence of this
  "compensatory tuning" make the original spandrel claim unfalsifiable? What evidence
  could still discriminate?


  Also add a nice wrinkle: Suppose a phylogenetic comparison shows that in the two
  closest outgroups, skull fusion and acuity loss appear in the same geological instant
  (no temporal gap) — so "co-option lag" evidence is unavailable.


