  and collapses into conformism the moment the crowd is wrong, whereas guilt tracks
  the act and the victim and works with no audience at all. Then there''s the old
  guilt-culture/shame-culture bit from Benedict''s 1946 book, which anthropologists
  have been mocking for decades while everyone outside anthropology keeps using it.


