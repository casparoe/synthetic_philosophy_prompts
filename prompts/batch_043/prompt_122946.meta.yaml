  Draft:


  ---


  I teach a graduate seminar on higher-order evidence, and for years I have leaned
  on a piece of classroom scaffolding that I am now worried is doing more argumentative
  work than it deserves.


  The picture is the standby instrument. A pilot who has reason to doubt her primary
  altimeter does not thereby stop flying: she cross-checks it against the standby,
  forms a view about how far the primary is off, and discounts its readings accordingly.
  The primary instrument is the first-order evidence; the standby reading gives her
  higher-order evidence about the reliability of her first-order source; rationality
  requires her to integrate the two rather than to go on trusting the primary at face
  value. Everything I say about higher-order evidence gets cast in these terms, and
  I now notice that my colleague in the next office uses the picture to license two
  claims I am not sure it can carry. First: that there is no such thing as rationally
  permissible epistemic akrasia — believing p while believing that this very belief
  of yours is the product of an unreliable process is, on the picture, exactly like
  trusting a faulty altimeter because you like the number it shows, and is never rational.
  Second: that the rational response to higher-order evidence is always to move one''s
  first-order attitude in the direction the higher-order evidence indicates, and to
  do so by a determinate amount — discount, in proportion to how badly the higher-order
  evidence impugns the first-order source.


  I have started to think the picture is clean only for what I would call self-exempting
  higher-order evidence, where the impugning evidence is produced by a channel independent
  of the competence it impugns (the lab report that says the drug you took degrades
  arithmetic; the certificate that came with the standby instrument; the colleague
  who tells you that you have never been good at mental arithmetic). It seems to me
  to misdescribe self-consuming higher-order evidence, where the impugning evidence
  is delivered by the very faculty it tells you not to trust...


