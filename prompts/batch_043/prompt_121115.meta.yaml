  if all motivation is hedonic and there is no suffering, what happens to agency?
  But the asker also wants to keep striving/achievement as "information-sensitive
  gradients of well-being." Hmm, is that a real tension? It''s a known objection.


  Genuine tension C: The asker thinks (i) our current evaluative intuitions about
