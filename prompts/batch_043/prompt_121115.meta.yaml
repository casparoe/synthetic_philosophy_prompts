  I think "The hedonistic imperative: abolishing suffering through biotechnology"
  is great. Commitments could be:

  1. Suffering is the only thing that''s intrinsically bad; happiness beyond a certain
  floor isn''t intrinsically valuable (or: only the elimination of suffering matters).

  2. We should use biotechnology to abolish suffering — replace the hedonic treadmill
  with gradients of well-being, e.g., "gradients of bliss."

  3. But: I think our current preferences about experience (including our desire for
  meaning, for authenticity, for achievement) are themselves products of the same
  biology, so they shouldn''t constrain the design.

  4. I think the abolition is urgent — it''s the moral priority of our time; extinction
  risk reduction matters because only a species that survives can abolish suffering
  (or: long-term future is very valuable).

  5. Yet I also think we should preserve/keep something: e.g., I value the continued
  existence of phenomenal consciousness, or I think we shouldn''t just shut off consciousness
  (wireheading / hedonium vs. nothing).

  6. I think democracy/democratic consent should govern the transition, or: I think
  the transition should be backed by a "reproductive" criterion...


  Tensions to engineer:


  Genuine tension A: If only suffering matters intrinsically (and happiness has no
  intrinsic value), then there''s a cheapest solution: extinguish sentience / prevent
  all future sentience. Yet the asker also holds that the long-term future is immensely
  important and that we should fill the cosmos with happiness (or that we should preserve
  conscious experience). Actually a cleaner tension: commitment to "the abolitionist
  project is the highest moral priority, and a huge future of sentient beings matters"
  vs "no amount of happiness is intrinsically valuable; only the absence of suffering
  is." If happiness isn''t valuable, then creating trillions of blissful beings adds
  nothing; the value of the future reduces to avoiding suffering. So the asker''s
  emphasis on the long-term future as astronomically important rests on something
  their axiology can''t deliver. That''s a genuine, non-obvious tension (well-known
  in the literature: "tranquilism"/"negative utilitarianism" vs "the hedonic imperative''s"
  rhetoric of gradients of bliss). Actually David Pearce''s position is that suffering
  is bad and happiness good? Pearce is a negative utilitarian-ish? He says the abolitionist
  project aims to replace suffering with gradients of well-being. There''s real debate
  whether NU leads to extinction conclusion. That''s a real tension.


  Genuine tension B: The asker holds that all motivation is ultimately hedonic — we
  act to reduce unpleasant experience/experiential discomfort, and "reasons" are just
  how it feels to be driven — and also that we can and should use reason/democratic
  deliberation to redesign our own motivational architecture, and that this redesign
  is something we have *reason* to do (a normative claim with real binding force).
  Tension: if motivation is entirely hedonic tone, then the abolition of suffering
  removes the very engine of action — no unpleasantness means no motivation. So implementing
