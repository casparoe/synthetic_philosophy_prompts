  ''stealing is wrong'' to ''getting my little brother to steal is wrong'' to be valid,
  the sentence ''stealing is wrong'' has to mean the same thing in both premises.
  If its meaning is just whatever attitude it expresses, and it expresses no attitude
  in the antecedent, then nothing is left to secure the validity, and the argument
  looks like an equivocation.


