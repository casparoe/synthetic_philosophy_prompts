  ---

  Next week I am presenting an independent paper to my school''s History and Classics
  Society, and I would like a Q&A prep sheet rather than a defence of my own view.


  My thesis, briefly. I argue that what separates legend from history is not evidence
  but a practice I call the error-tolerance test: a narrative is being treated as
  history when the people who transmit it treat a discrepancy inside it, or between
  it and another account, as a defect to be explained away, reconciled, or used as
  evidence about what really happened, rather than as a variant to be preserved. Being
  a legend, on my account, is not a verdict on whether the story is true; plenty of
  legends contain true claims, and plenty of histories are false. So I also claim
  that the change is reversible: a narrative that a scholarly tradition has treated
  as history can become a legend again if that tradition collapses and the discrepancies
  stop registering as errors — and, in the other direction, a legend can be promoted
  to history before any new evidence turns up, purely because of a change in how people
  handle its inconsistencies. I apply the test to three standard cases: Homer''s Troy,
  King Arthur, and the Exodus. I also apply it to something closer to home, and to
  a modern national foundation story that is taught in schools and is, on my account,
  legend even though almost everything in it happened.


