  Let me write the background:


  - Ontic state λ: a complete specification of a system''s physical state, such that
  λ + measurement setting determines outcome probabilities.

  - Wavefunction ψ: picks a distribution p(λ|ψ) over ontic states.

  - ψ-ontic: distinct ψ''s give non-overlapping distributions (λ tells you which ψ).
  ψ-epistemic: some distinct ψ''s give overlapping distributions — the same underlying
  λ is compatible with more than one ψ.

  - No-go result: for independent preparations, the ψ-epistemic overlap must vanish
  unless you drop the assumption that independently prepared systems have uncorrelated
  ontic states.


  Now the exchange, ~5-6 moves:


  (1) Marek: The no-go result plus the independence assumption settles it. Dropping
  independence means the ontic states of two systems prepared in different labs, never
  in contact (or with a common cause screened off), are correlated. That''s structurally
  the same move as denying measurement independence to save local hidden variables
  — a "conspiracy" loophole. So ψ-epistemism is dead, or alive only at the price of
  conspiracy.


  (2) Dana: Bad analogy. Bell''s independence assumption (measurement settings independent
  of λ) is a physical principle — no-conspiracy / free-choice — grounded in the idea
  that experimenters'' choices are exogenous. Preparation independence is different:
  it says the ontic states of independently prepared systems are uncorrelated. Plenty
  of perfectly respectable physics violates it: e.g., if the ontic state includes
  relational/global degrees of freedom, or if there are superselection-type global
  constraints, or in a theory where λ for the pair isn''t a product of λ''s for the
  parts. Holism isn''t conspiracy. So the cost is real but it''s a cost that a holistic
  or law-first ontology can pay in advance, not a loophole invented after the fact.


  (3) Marek: Fine — but look at the payoff side. The whole selling point of ψ-epistemism
  was explanatory: the overlap of distributions was supposed to explain why nonorthogonal
  states can''t be perfectly distinguished, why measurement "collapse" is just Bayesian
  updating, and why the wavefunction looks like it lives in a gigantic space while
  the world looks three-dimensional. Yet the no-go result says the overlap must be
  confined to measure-zero regions (relative to independent preparations). If there''s
  essentially no overlap, you don''t get the explanations. So the view survives only
  as a corpse that still twitches: "epistemic" in name, with none of the explanatory
  goods.


  (4) Dana: That mis-describes the explanatory ambition. The epistemicist''s core
  claim was never "overlap explains indistinguishability" — that''s a corollary. It
  was that ψ codifies a constraint on what can be known/predicted, i.e., it''s a summary
  of the system''s dispositions, not a catalogue of its intrinsic properties. A measure-zero-overlap
  model can still be a coarse-graining: think of a probability distribution over a
  large state space, where ψ fixes a low-dimensional summary — the distributions for
  different ψ can be almost disjoint while ψ is still, functionally, a summary statistic
  rather than a physical field. And the explanatory payoff that matters — that "collapse"
