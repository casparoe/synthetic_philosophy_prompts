  queen in a set of chessmen is not this carved piece of wood but a role in a game.
  That is why it is a pseudo-question which set-theoretic object the number 3 is —
  just as it is a pseudo-question which object in the box is ''really'' the queen
  — and it is also why there is no mystery about how we know arithmetical truths:
  we stipulate the rules and then work out their consequences, and that is precisely
  the sort of knowledge creatures like us can have."


