  1. Credences as graded attitudes; the "if you''re going to have them anyway" conditional
  vindication.

  2. Measure of accuracy: scoring rule / distance from truth; Brier (quadratic) score;
  propriety.

  3. The domination argument: for any incoherent c, some coherent p strictly dominates
  it in accuracy at every world (Joyce''s argument); note it''s a dominance argument
  so it doesn''t need expected-utility maximization — it''s "better no matter what".

