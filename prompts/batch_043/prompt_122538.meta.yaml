  |c_2| = 2(1−c_1) if... wait for two outcomes with c_1+c_2=1: |1−c_1| + |0−c_2| =
  (1−c_1) + c_2 = 2(1−c_1) — minimized by c_1 = 1 regardless of evidence. So Manhattan
  distance pushes to extremism → not proper. That''s a clean, computable, in-the-weeds
  teaching point! Great: "why the quadratic and not the more intuitive absolute-distance
  measure". And the general point: strict propriety ↔ strict convexity (Savage). Maybe
  too far; the Manhattan example is enough and is fully derivable in the moment.

