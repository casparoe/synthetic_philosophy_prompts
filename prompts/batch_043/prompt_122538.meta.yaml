  actually the standard: scoring-rule route (de Finetti/Savage: propriety + if you''re
  incoherent, some coherent alternative has higher expected accuracy by your own lights)
  vs. domination route (Joyce: no appeal to expectations at all — dominance in every
  world). The distinction matters because the expected-accuracy route smuggles in
  probabilism (expected value uses your credences, which are incoherent). Good in-the-weeds
  point.

  6. The conditionalization part: Greaves–Wallace: the accuracy-based argument for
  conditionalization compares "plan to adopt posterior p_E" vs "plan q"; the crucial
  move: the accuracy of your future self''s credence function is evaluated at the
  actual world, and the actual future credence; the "Ur-prior" vs "posted price"/"whatever
  you''ll end up believing" issue. And the well-known wrinkle: the argument vindicates
  conditionalization only if you evaluate future credences by the same standard, and
  it''s an "internal" vs "external" evaluation — the distinction between the "anticipated"
  and the "actual" future credence function, and why the argument needs you to care
  about your future self''s accuracy as measured now. Also the "how-to" vs "whether-to"
  and the fact that the argument for conditionalization presupposes probabilism (it''s
  a conditional vindication).

