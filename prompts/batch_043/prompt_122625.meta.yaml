  "Here''s roughly what the book says: Cantor showed that some infinities are bigger
  than others — the real numbers can''t be paired off with the counting numbers, so
  there are more reals than naturals, and his diagonal argument is what proves it.
  But Cantor also showed that a set can be the same size as a proper part of itself:
  the even numbers are a proper subset of the naturals but there are just as many
  of them, and that''s the defining feature of an infinite set. Hilbert''s Hotel is
  supposed to bring this home: a hotel with infinitely many rooms, all full, can still
  take a new guest by shifting everyone up one room. Which shows that an actual infinite
  can''t exist in reality — you can''t actually have all the rooms full and still
  have room, and the fact that the rearrangement ''works'' only shows that arithmetic
  breaks down for infinite numbers, which is why serious mathematicians like Gauss
  refused to use completed infinities and why finitists say infinite sets don''t exist.
  Also, since you can always add one more, there''s no largest infinity."


  Misrepresentations:

  1. "You can''t actually have all the rooms full and still have room" — contradiction
  insinuation; Hilbert''s Hotel is a coherent model (actually realizable in standard
  set theory), it''s an argument against the *intuitive principle* that the whole
  is greater than the part in the context of physical/concrete instantiation, but
  the standard view is that it''s not a logical contradiction — the real question
  is about metaphysical possibility (e.g., whether an actually infinite physical totality
  is possible). Also Galileo/others held whole > part as necessary truth.

  2. "arithmetic breaks down for infinite numbers" — conflation: cardinal arithmetic
  is perfectly well-defined; what breaks down is the identification of cardinal with
  ordinal/naive arithmetic intuitions; subtraction/division not well-defined for cardinals,
  but the operations are well-defined via set-theoretic definitions. Also for ordinals,
  addition is non-commutative but perfectly rigorous.

  3. "which is why finitists say infinite sets don''t exist" — conflates finitism
  (reject actual infinity in mathematics, e.g. Hilbert''s finitism about metatheory,
