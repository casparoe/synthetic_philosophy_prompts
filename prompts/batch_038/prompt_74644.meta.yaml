  norms of promise-keeping) are not conventions in Lewis''s sense. Also, Lewis''s
  account requires common knowledge of expectations and a preference for general conformity
  conditional on others conforming — the "conditional preference" is key, and it''s
  often misread as simple payoff-maximization.


  2. Confusion: that Lewis''s theory shows conventions are chosen/deliberated. Lewis
  emphasizes that conventions arise without anyone choosing them — they''re "spontaneous,"
  a solution that emerges from precedent. People often read game theory as implying
  deliberate design.


