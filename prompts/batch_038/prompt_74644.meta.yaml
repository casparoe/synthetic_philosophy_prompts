  I cover science and ideas for a general-interest magazine, and I''m currently drafting
  a long feature on why well-funded attempts to change institutional norms so often
  leave the norms untouched. The centerpiece of the piece is a large health system
  I''ve been reporting on for the better part of a year. Roughly eighteen months ago,
  its leadership decided to break the long-standing pattern in which junior clinical
  staff don''t speak up when they think a senior colleague has made an error. They
  did close to everything a consultant would recommend: a no-retaliation policy written
  into the employee handbook, a bonus line tied to the number of near-miss reports
  filed, an internal campaign with posters and video testimonials from surgeons describing
  times they were glad a nurse had interrupted them, and mandatory team briefings
  at the start of each shift where anyone is invited to raise a concern. Two rounds
  of internal survey work later, self-reported willingness to speak up is essentially
  flat, and the incident-reporting numbers moved a little and then drifted back. My
  editors have asked me to give the failure a theoretical spine rather than just a
  narrative one.


  The spine I''ve been building on is David Lewis''s analysis in Convention. As I
  read it, Lewis argues that a convention is a regularity that solves a recurrent
  coordination problem: people conform because they expect others to conform, they
  prefer to conform on the condition that (almost) everyone else does, there''s an
  alternative regularity that would serve equally well, and all of this is common
  knowledge among the participants. That gives me what looks like a crisp diagnosis.
  If norms are equilibria of coordination problems, then the health system''s mistake
  was to attack the norm through persuasion and training rather than through payoffs:
  they announced a new regularity and hoped people would converge on it, but they
