  Draft:


  "For the past six years I''ve been a regular editor on the English Wikipedia, mostly
  on articles touching covert government programs and contested atrocity claims, and
  I''m now working on a chapter about the epistemology of conspiracy theories. The
  more I''ve read our own governing documents alongside the philosophical literature,
  the more it seems to me that the site''s content regime embodies a fairly specific
  — and never explicitly argued for — theory of when a belief is defective. Let me
  state the practice as precisely as I can, since the reconstruction depends on the
  details. Three core content policies do the work: verifiability, which says that
  article content is determined by published information rather than by editors''
  own beliefs, experiences, or unpublished analysis, and that anything challenged
  must be supported by an inline citation to a reliable source that directly supports
  it; no original research, which forbids novel analysis or synthesis of published
  material; and neutral point of view, which requires that all significant views published
  by reliable sources be represented fairly and in proportion to their prominence,
  without giving a false impression of parity between a near-universal view and a
  tiny minority one. Layered on top is the fringe theories guideline, which defines
  a fringe idea as one that departs significantly from the prevailing or mainstream
  views in its field, names conspiracy theories as a paradigm example, treats scholarly
  opinion as generally the most authoritative marker of where the mainstream lies,
  requires that any statement about whether such a theory is true be backed by independent
  reliable sources, and instructs editors not to present a marginalized view alongside
  expert consensus as though the two were opposing but comparable positions. Reliable
  sources, in turn, are ranked by institutional process: peer-reviewed and academic
  work is preferred for historical, medical, and scientific claims, and reliability
  is explicitly tied to how many people were engaged in checking facts, analyzing
  legal issues, and scrutinizing the writing before publication."


