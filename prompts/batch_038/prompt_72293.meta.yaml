  both seriously rather than dissolve them. First, the same guideline carves out an
  exception for ''alternative theoretical formulations from within the scientific
  community'' — it names continental drift before plate tectonics supplied a mechanism,
  the existence of Troy, the Norse colonization of the Americas, and the Big Bang
  as hypotheses that were initially rejected and later became mainstream — but the
  carve-out is defined by where the proposal comes from and who is making it, not
