  ---


  I''m writing something on Moore''s paradox and I need a case built to order rather
  than pulled off the shelf — none of the raining, none of the exam results, none
  of the published examples.


  My thesis is that what makes a Moorean conjunction absurd isn''t anything in the
  content of the two conjuncts; it''s the particular way asserting P is supposed to
  hook into believing P. So I need a scenario that keeps the content exactly the same
  shape but changes the hook.


  Target: an ordinary person in an ordinary contemporary setting who sincerely says
  something with the form P but I don''t believe that P, where both conjuncts are
  true, they know both are true, and saying it is the right move — the thing they
  should say, not a slip or a performance. I want someone who thinks every sincere
  Moorean utterance is either absurd or self-deceptive to have to bite a bullet.


  Note I''m not asking for a perfectly rational agent. Their doxastic state can be
  unfortunate, impaired, stuck — that''s fine, even useful. The claim I need to land
  is narrower: the utterance itself isn''t irrational and doesn''t land them in contradictory
  commitments.


  Constraints:

  - one paragraph of scenario, realistic, no sci-fi, no split brains, no neurology.
  Ordinary psychology is allowed — grief, anxiety, conditioned fear, a habit of doubt,
  whatever you need.

  - P is a mundane factual claim about the world, not about the speaker''s own mind,
  and not a moral or aesthetic judgement.

  - none of the usual escapes: the speaker is not changing their mind partway through
  the sentence, not equivocating on believe (no sliding between believe and feel and
  trust), not being ironic, not lying, not a philosopher demonstrating assertion norms.

  - no self-deception and no unconscious belief. Don''t solve it by saying well, deep
  down they do believe it. The absence of belief has to be the real thing and visible
  in how they act, not a verbal disavowal their behaviour contradicts.

  - and don''t make P something the speaker knows, because knowledge entails belief
  and your second conjunct would come out false. Overwhelming evidence is what I want,
  not knowledge.


  Then do the demonstration:

  1. Which account of assertion — and of the link between asserting and believing
  — makes this utterance fine, and why it makes it fine here.

  2. Walk the standard diagnosis of Moorean absurdity (roughly: asserting P expresses
  or commits you to believing P, so the whole utterance commits you to a pair that
  can''t both be held) and point at the exact step that fails in your case. Don''t
  just say the case is an exception; show the step.

  3. Tell me which feature of the scenario is doing the work, and what happens to
