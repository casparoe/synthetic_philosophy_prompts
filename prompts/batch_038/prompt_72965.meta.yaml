  Sketch: (1) The macro-social processes cliometricians model display sensitive dependence
  — small differences in initial conditions amplify into macro-differences at a rate
  that can be estimated in a calibrated model. (2) On the standard nearest-world semantics,
  the closest world in which some event did not occur is one in which the event is
