  more adaptive, more flexible, or something else). This keeps the focus on criteria
  rather than scoring, which fits the user''s preference, and lets the retired scientist''s
  own expertise ground the questions about whether these transitions are real phenomena
  or useful fictions. A good theory needs to specify what''s actually being selected
  at each transition and what new selectionist mechanism it introduces—otherwise it
  collapses into metaphor. It also has to handle graded and mosaic cases (like corvids
  or octopuses that seem to fit multiple categories at once), distinguish design-level
  claims from individual-developmental and phylogenetic ones, and stay continuous
  with evolutionary biology without smuggling in discontinuities. The framework also
  needs to be extensionally useful: it should predict and explain real behavioral
  differences and experimental results, not just relabel them, and it must avoid conflating
  the vehicle of selection (the creature itself) with the informational products (learned
  associations, hypotheses, cultural artifacts).


  There''s also the question of whether grades imply any normative ranking or progress—the
  biologist would push back hard on scala naturae thinking. And for Gregorian creatures
  specifically, external scaffolding matters: language, writing, tools become part
  of the selection environment, so the theory has to decide if these are constitutive
  of the grade or merely enabling. I need to handle failure cases too: dementia, aphasia,
  developmental disorders—can grades be lost, and does that mean a person ceases to
  be Gregorian? There''s also the risk of circularity: defining a grade by the behaviors
  that supposedly indicate it, then using the grade to explain those behaviors. Finally,
  the framework has to be robust to how we handle artificial systems like LLMs and
  reinforcement learning agents, and to contested questions like whether non-human
  animals have any mind-reading capacity at all, plus the deep puzzle of whether selection
  can operate on representations at all given that representations aren''t heritable
  in the way genes are.


  The real tension emerges when I try to hold everything together: the requirement
