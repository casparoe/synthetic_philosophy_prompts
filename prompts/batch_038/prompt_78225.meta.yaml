  Best combination: The Principal Principle + procedure type. E.g., a forecasting
  analyst at a company who has to combine model-outputs (objective chances) with their
  own judgment — Lewis''s Principal Principle says credence conditional on the chance
  should equal the chance, unless inadmissible evidence. A practitioner role: a "quant
  risk analyst" or a "weather forecaster" or an "election desk" who receives model-based
  probabilities (which they think of as chances) and their own background knowledge
  (base rates, insider info). Build a procedure for when to defer to a model''s number
  vs. override with judgment — grounded in the Principal Principle, admissibility,
  Lewis''s "big bad" cases, Joyce/Vranas on admissibility, the "no inadmissible evidence"
  condition, self-undermining chances (Ismael, Vranas), Lewis''s "Big Bad" and Horgan''s
  worry. That''s rich, well-memorized material for LLMs (Lewis 1980 "A Subjectivist''s
  Guide to Objective Chance"), and the translation work is genuinely nontrivial. But
  careful: prompt shouldn''t ask for citations. It can mention concepts.


