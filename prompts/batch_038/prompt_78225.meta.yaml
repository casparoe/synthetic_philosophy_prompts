  Which is better? Both good. I think the Principal Principle one is slightly more
  likely to produce a technical, in-the-weeds answer that can''t be lifted from an
  encyclopedia, and the "deference to objective chance" domain has crisp conceptual
  machinery (admissibility, expected chance, self-undermining, Big Bad, ur-prior)
  that must survive translation. The risk: the practitioner setting must make sense
  of "objective chance" — a forecaster dealing with a stochastic simulator. Good:
  e.g., a reservoir engineer / power-grid operator running Monte Carlo simulations
  that output probabilities; the desk''s forecasters routinely "adjust" model numbers
  based on gut feeling and on knowing that today''s situation is unusual. The question:
  when is that adjustment legitimate? The PP gives a crisp answer: defer unless your
  evidence is inadmissible; and inadmissibility is not "strong evidence" but a specific
  structural relation (evidence about the chance itself, or the future outcome, or
  evidence obtained in a way that correlates with the outcome). Practitioners think
  "I have inside info, so I should override" — the PP says inside info about the outcome
  is exactly the case where you should NOT condition the PP... hmm, actually PP says:
  if your total evidence is admissible, credence = chance. If you learn the coin landed
  heads, your evidence is inadmissible and PP doesn''t apply — you should credence
  1. So the interesting practical lesson: knowledge of the actual outcome legitimately
  overrides; mere "background knowledge about how the world usually is" doesn''t.
  And crucially: information that the model mis-specified the setup (e.g., the grid
  today has a line out of service, which the model doesn''t know) — is that admissible?
  Yes, it''s inadmissible in Lewis''s technical sense: it''s evidence about the chance
  setup (it tells you the chance is different from what the model says). Actually
  more precisely: it''s evidence bearing on what the chance is, so it''s inadmissible
  relative to the chance hypothesis "the chance is p"; conditioning on it should change
  your credence, and correctly so. That''s the deep conceptual point: the practitioner''s
  "override on grounds of better information about the setup" is exactly the admissible/inadmissible
  distinction. And the "expected chance" point: when you''re unsure whether the model
  is right, your credence should be your expectation of the chance — a weighted average
  over models, not a "confidence adjustment" of the single model''s number. That''s
  a genuinely useful procedural rule: don''t shrink the probability toward 0.5 for
  uncertainty about the chance; instead average the chances weighted by your confidence
  in each model. Practitioners almost always get this wrong (they shrink toward 50%).
  Excellent — that''s the "conceptual work in translation."


  And there''s the self-undermining case: a model whose own track record suggests
  it''s wrong; or "if I learn the model was built on data that includes today''s event"
  — circularity. And the "chance vs. estimate" distinction: the model output is not
  a chance; it''s an estimate of one, so strict PP doesn''t apply; you need a surrogate
  deference principle and must be honest about that.


