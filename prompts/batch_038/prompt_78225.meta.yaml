  Hmm, but which combination yields the most interesting conceptual work? The Principal
  Principle one has a very natural practitioner translation: a forecaster who must
  decide how much to defer to a model''s probability. And the "admissibility" notion
  is precisely the thing that gets lost in practitioner talk ("trust the model unless
  you have better info" — but the PP says you should defer unless your extra info
  is inadmissible, and the interesting hard cases are (a) inadmissible evidence like
  knowledge of the actual outcome or of the chance facts themselves, (b) self-undermining
  chances, (c) the case where you''re unsure what the chance is — then the PP gives
  you a weighted average, i.e., credence = expected chance, (d) cases where the "chance"
  is a model output that isn''t a chance at all, only an estimate, so the PP doesn''t
  literally apply and you need a different deference principle (e.g., deference to
  expert opinion / van Fraassen''s Reflection, or the "chance is a hypothesis about
  the world" case requiring total evidence). That''s rich. And the practitioner constraints:
  deadline, no ability to inspect the model''s internals, sign-off, etc.


