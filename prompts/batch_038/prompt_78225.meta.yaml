  / journal editor handling complaints / a committee chair who must decide whether
  to relay or make a blame-attribution. E.g., "I''m the chair of an integrity committee
  at a hospital and staff come to me reporting colleagues'' misconduct; sometimes
  the reporter has done the same thing. I need a procedure for deciding whether their
  standing to blame is forfeited." This is nice — hypocrisy/tu quoque, standing literature
  (Wallace "Dispassionate opprobrium", Fritz & Miller, Todd, Coates, Radzik, the "addressability"
  of blame, the difference between being wrong to blame and lacking standing to blame,
  the "same fault" condition, whether the hypocrite''s blame is epistemically or morally
  defective, whether standing can be regained through apology/reform, whether the
  target''s standing to object depends on selective enforcement/equal treatment).
