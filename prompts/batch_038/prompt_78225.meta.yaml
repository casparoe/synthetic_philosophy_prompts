  I supervise a duty-forecast team of five at a regional flood warning centre. Every
  six hours an ensemble hydrological model runs over our forty reporting gauges and
  returns, for each one, a probability that the gauge will exceed its designated flooding
  threshold within the next twenty-four hours; our public warnings are tied to fixed
  cutoffs on that number, and the cutoffs are not ours to change. In practice the
  duty forecaster almost never publishes the ensemble figure unaltered. They nudge
  it up because the catchment is already saturated, down because the model has historically
  been jumpy on that particular valley, up by a lot because they know an upstream
  rain gauge was iced over during the night, and so on. After an event last spring
  in which we published 0.22 for a gauge that overtopped within nine hours, the regulator
  has asked us for a written, auditable procedure governing when a human adjustment
  to a model probability is legitimate and when it must be published untouched. I
  want to build that procedure on what the philosophy of probability has to say about
  deferring to an objective chance — the Principal Principle and its restriction to
  admissible evidence, what a rational agent should do when she is not certain what
  the chance is, and the difficulty raised by evidence that undermines the very chance
  one is deferring to — but expressed for forecasters who have never encountered any
  of it, and without a single reference or reading list, since we will not be able
  to check them and I want the document to stand on its own.


  What I need from you is the procedure itself, in the order a forecaster would run
  it, with enough structure that a new starter could execute it on their second shift
  and that an auditor could reconstruct afterwards why we published what we published.
  Concretely: a triage step that lets most of the forty gauges pass through in seconds,
  because the whole document has to be usable within the fifteen-minute window between
  the ensemble completing and the shift broadcast; then the substantive steps, each
  with the question to ask, the answers that count as sufficient, the default when
  the forecaster cannot settle the question inside the time available, and the point
  at which the decision passes to the duty manager rather than staying with the forecaster
  (our internal rule is that any adjustment of more than 0.10 in absolute terms requires
  a countersignature). I also want a two-column table of the reasons forecasters actually
  give for adjusting, sorted into those that can license an adjustment and those that
  never can, with a sentence on each explaining why — and I want that explanation
  to be the philosophical one, not a restatement of house style, because the distinction
  the table has to capture is not about how confident the forecaster feels. One of
  my team is a part-time philosophy doctoral student who tells the rest of us, unhelpfully,
