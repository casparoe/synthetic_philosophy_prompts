  Draft:


  "For the past two years I have co-taught a graduate seminar on predictive processing
  with a colleague from computational neuroscience, and the seminar has produced a
  standoff I cannot break. The formal core is agreed by everyone in the room: hierarchical
  generative models, prediction errors weighted by precision, perception as the updating
  of those models and action as the sampling that makes the world match them, and
  — at the outermost layer — variational free energy as a bound on surprisal that
  adaptive systems are said to minimize. What is not agreed is what any of it amounts
  to.


  On one side sit those who hold that the framework is a vindication of representationalism:
  the generative model is about its hidden causes, prediction errors have satisfaction
  conditions, and the account of delusion or of bistable perception is an account
  of content going wrong. On the other side sit those — often the same people who
  came to predictive processing from enactivism — who insist the framework needs no
  such commitments: what descending signals do is specify what will happen if the
  organism keeps behaving, motor commands are causes rather than descriptions, and
  the entire apparatus is a story about the self-organization of a system coupled
  to its environment, not about inner states standing for outer ones. Friston''s own
  framing, on this reading, is closer to a variational principle in physics than to
  a theory of mental content.


  My working diagnosis, which I want you to attack as much as defend, is that this
  is three disputes wearing one coat: (1) a semantic dispute about whether ''representation''
  requires misrepresentation conditions, so that whether the models represent is settled
  by stipulation rather than discovery; (2) a methodological dispute about whether
  expected free energy, decomposed into epistemic and pragmatic value, is a mechanism
  or a redescription of instrumental rationality — the dark-room objection lives here;
  (3) an empirical dispute about precision, namely whether it corresponds to something
  like synaptic gain and neuromodulation or is a free parameter fitted after the fact,
  which decides whether the framework licenses predictions or merely accommodates
  them. My hypothesis is that the standoff persists because the same equations are
  compatible with all eight combinations of answers, so each camp can claim every
  new result.


  Is that right? Tell me what kind of disagreement each of the three is — verbal,
  substantive-empirical, normative about explanation, or bedrock intuition neither
  side can argue for — and whether there is a single deeper dispute I have failed
  to see, for instance about what it takes for a formalism to be about the world at
  all. Then tell me what would count as progress on each: an experiment that discriminates,
  a theorem, a definitional settlement, or a change of question; and be honest about
  whether any of them could actually end the standoff, or whether the impasse is stable
  and I should expect my seminar to have it again next year. I am not after a survey
  of the positions or a reading list — I want the structure of the disagreement, argued
  for, and the point at which my own diagnosis begs the question."


