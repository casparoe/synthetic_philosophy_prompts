  Paragraph from the book:

  "Putnam''s Twin Earth is the most famous thought experiment in the philosophy of
  language. He asks us to imagine a planet exactly like ours, with a twin of every
  person and thing on it, except that the liquid in its rivers and glasses is not
  H2O but a different compound, XYZ, which behaves exactly like water. The two Oscars
  are physically identical and think the same thoughts, yet when Earth-Oscar says
  ''water'' he refers to H2O and when Twin-Oscar says it he refers to XYZ. So what
  a word means cannot be settled by anything inside a speaker''s head: meaning is
  fixed by the causal contact a community has had with the stuff itself. This refutes
  the old view that a word means whatever description the speaker associates with
