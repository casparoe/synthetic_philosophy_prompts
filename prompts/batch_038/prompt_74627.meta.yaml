  On 14 March a feature flag was flipped in production to enable a new pricing path.
  That path opened a database connection per request inside a retry loop instead of
  reusing one from the pool. Separately, six weeks earlier we had lowered the pool
  ceiling on that service as a cost measure, and four months earlier we had raised
  the circuit-breaker threshold after an unrelated incident because the old threshold
  tripped during legitimate traffic spikes. The deploy pipeline classified flag changes
  as configuration, so no canary ran. The service shed traffic for 47 minutes.


  Our data team can also show that a scheduled cache flush was due twenty minutes
  later, and in staging that flush alone drives connection demand above the new ceiling.
  So the outage looks like it would have happened anyway, on a slightly different
  timeline, without the flag change.


  The template change proposes three things: delete the single "Root cause" field;
  require a directed graph of contributing conditions, each node tagged with whether
  we hold a lever we could actually deploy — a setting, a code path, a process gate
  — that would have changed the outcome; and require that the graph be built only
  from conditions that were abnormal at the time, so that the presence of our legacy
  retry code, or of electricity, cannot enter.


  The board is split. One group says the root cause is the flag change, because if
  it hadn''t gone out we''d have been fine that day, and because if we let every condition
  into the graph then nothing is the cause and no one is answerable for anything —
  the report ends with "the organisation caused it." The other group says the root
  cause is the lowered pool ceiling and the raised breaker threshold, because flag
  changes will keep happening and those two are what we can actually set differently
  next time; they also say the first group''s test is arbitrary, since by the same
  logic the cause is whoever wrote the retry loop in 2019, or the day we chose this
  database.


  Two further constraints. Our external compliance auditor requires each major incident
  report to state a single root cause in one sentence, and we cannot unilaterally
  drop that. And an SRE has proposed building a counterfactual replay harness that
  would rerun the incident in staging with one condition held at its old value, to
  settle disputes like this empirically; one board member objects that such a replay
  cannot isolate a single condition, because changing the flag also changes load timing,
  on-call behaviour, and what else was in flight.


