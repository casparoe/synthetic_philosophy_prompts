  adopt it with specific amendments, or reject it — and give reasons both camps could
  actually engage with rather than a summary of both sides. In particular I want it
  to say what the board should mean by "root cause" once it has decided how to use
  the term, how the auditor''s one-sentence requirement can be met without misdescribing
  the incident, what rule the graph should follow in the overdetermination case where
  the outage was coming anyway, and how much weight the replay harness deserves given
  the objection to it. State plainly where the two camps disagree about causation
  and where they only disagree about what a postmortem is for, and give the strongest
  consideration against your own recommendation, in a form the minority could recognise
  as theirs. Finish with criteria a reviewer could apply to the next disputed report
  without further guidance.


