  Key facts to be sure of:

  - Harsanyi''s aggregation theorem (1955, "Cardinal welfare, individualistic ethics,
  and interpersonal comparisons of utility", Journal of Political Economy). Also 1977
  "Morality and the theory of rational behaviour".

  - Setup: individual preferences over lotteries satisfy vNM axioms with utility functions
  u_i; social preference over lotteries satisfies vNM axioms with social utility W;
  Pareto indifference (if all individuals indifferent between two lotteries, society
  indifferent) — plus continuity/unboundedness conditions. Conclusion: W = a_1 u_1
  + ... + a_n u_n + const, where each u_i is unique up to positive affine transformation
  and the a_i > 0 (with Pareto).

  - Theorem is a mathematical result; the normative step to utilitarianism comes from
  the impartial observer / veil of ignorance argument which gives equal weights a_i
  = 1/n.

