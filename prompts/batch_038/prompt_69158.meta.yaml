  welfarism, sum-ranking. Sen''s critique: Harsanyi''s theorem is a "welfarist" result
  but the vNM utilities are preference-satisfaction indicators, not utilities in the
  Benthamite sense.

  - Prioritarianism (Parfit) applies a concave transform to well-being, summing; violates
