  Let me write the student answer:


  "Harsanyi''s theorem says that if each individual has preferences over social prospects
  that satisfy the von Neumann–Morgenstern axioms, and society''s preferences over
  the same prospects also satisfy them, and society respects Pareto (if everyone is
  indifferent between two prospects, society is indifferent too), then there''s a
  social utility function which is a weighted sum of the individual utility functions,
  W = a1u1 + ... + anun, with the weights positive. So the social ranking is a linear
  aggregation.


  Because the theorem requires cardinal utility, the individual utilities have to
  be measurable on a ratio scale with a genuine zero point, otherwise the weights
  wouldn''t mean anything. Harsanyi''s big achievement is that he shows interpersonal
  comparison is possible after all: two people''s utilities are comparable just when
  they can be plugged into the same linear formula. This is a much stronger result
  than Arrow''s, which Arrow thought impossible...


  The weights are left undetermined by the theorem, but the Pareto principle forces
  them to be equal — everyone''s utility counts the same because no one''s preferences
  are given any special status. So combining the theorem with Pareto gives straight-up
  utilitarianism: maximize the sum (or with a fixed population, the average). This
  is why Harsanyi''s result matters, and it''s also basically Rawls''s setup: Rawls
  and Harsanyi agree the choice behind the veil is made by someone who doesn''t know
  which person she''ll be and who takes the positions to be equiprobable, they just
  disagree about the decision rule, expected utility vs maximin.


  The main objection people raise is that the ui''s in the theorem aren''t measures
  of well-being at all, just numerical representations of preferences over lotteries.
  But this misses the point, since a preference representation just is what well-being
  consists in for a welfarist, so the objection begs the question against utilitarianism
  rather than damaging it. Also, people who want to give priority to the worse off
  don''t need to reject the theorem — they can just use unequal weights, weighting
  the worse-off person''s utility more heavily. Prioritarianism is thus a special
  case, not a rival."


