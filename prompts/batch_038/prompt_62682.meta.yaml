  not in the literature.


  Novel injections (to prevent regurgitation):

  1. A fresh class of cases: institutionally sanctioned multiples and posthumous casts
  (Rodin bronzes cast decades after his death from plaster maquettes, authorized by
  a foundation); the "authorized posthumous edition."

  2. A "reverse forgery": a work genuinely made in the 17th century in the manner
  of a known master, by an anonymous studio assistant, which the museum''s own provenance
  team has mislabeled as a 19th-century fake — and everyone now believes it is a forgery
  though it is old and honest.

  3. The "self-forgery": an artist who forges their own work of an earlier period,
  with intent to deceive the market about date (not authorship).

  4. The machine case: a model that produces a painting indistinguishable from an
  imagined lost work by a given artist; there is no "hand," no intention to deceive,
  no deception of any particular person. Is it a forgery, a pastiche, or a cast?

  5. The "forgery that improved on the original" case: a forger whose version is (by
  the consensus of connoisseurs) better than the originals it imitates.

  6. The restoration case (Sagoff''s purist vs. integral restoration) — a heavily
  restored work where 60% of the paint surface is later.

  7. The "forgery of a lost work known only by description" — a reconstruction of
  a destroyed painting from written descriptions; nothing to compare it with.

  8. The "honest copy" — a student copy made for training purposes in the workshop,
  later misattributed.


  Also, distinctions it must not collapse:

  - nominal authenticity (correct authorship attribution) vs. expressive authenticity
  (sincerity, being the true expression of a tradition/self) — Dutton''s pair.

  - forgery vs. copy vs. reproduction vs. pastiche vs. homage vs. fake (the deception
  condition).

  - aesthetic value vs. market value vs. historical/documentary value.

  - the work vs. the object (type/token, autographic/allographic).

  - intrinsic vs. relational properties of an artwork.

  - authenticity of the object vs. authenticity of the experience.


  Requirements:

  - R1: must explain why the judgment changes when the forgery is discovered, even
  though the object hasn''t changed (the "no-perceptual-change" constraint) — this
  is Goodman''s target.

  - R2: must allow that a forgery can be aesthetically excellent, and explain what,
  if anything, is lost (avoid the implausible claim that all forgeries are bad).

  - R3: must handle the allographic arts: it must not imply that a forged Beethoven
  score or a doctored photograph... hmm, must give a principled account of why some
  arts are forgery-proof.

  - R4: must handle multiple originals and posthumous authorized casts without either
  pronouncing them all forgeries or making authenticity trivial.

  - R5: must not make authenticity a purely market/monetary notion (it has to explain
  why we care even when no one is being defrauded).

  - R6: must handle the case where the forger is dead and no one was deceived and
  no one can be defrauded anymore (the retrospective case).

  - R7: must explain the difference in verdict between (a) a forgery passed off as
  an original and (b) a later copy honestly labeled as a copy that is nonetheless
  displayed as if it were the original by the museum''s error — i.e., locate where
  the wrong attaches: the object, the act, the label, or the viewer''s belief.

  - R8: must be consistent with the practice of conservation/restoration (Sagoff):
  if you say the original''s value lies in being the product of the artist''s hand,
  you must say what happens when the hand''s product is mostly replaced by a restorer''s.

  - R9: must deliver an account of what, if anything, is lost aesthetically — not
  just ethically/historically — otherwise it collapses into "forgeries are wrong because
