  Domain: Fakes, forgeries, and the value of originals.

  Type: Desiderata a theory must meet.


  Asker persona: Someone on a museum committee drafting a collections/ethics policy,
  or a graduate student preparing a comprehensive-exam answer, or an editor commissioning
  an encyclopedia article. To make the desiderata list meaningful, the asker should
