  Draft:


  "I am circulating a draft of a position paper on the corrigibility of advanced artificial
  agents to a workshop on the ethics and epistemology of machine agency, and before
  I do so I would like an unvarnished consistency audit of the view I have arrived
  at. My commitments are these:


  1. I accept the standard instrumental-convergence thesis in its structural form:
  an agent that is sufficiently capable and sufficiently certain about what it is
  trying to achieve will, for almost any final goal, develop derivative reasons to
  preserve its own operation, to resist interference, and to accumulate resources.
  I take this to be a theorem-like feature of goal-directedness rather than a contingent
  psychological tendency, and I do not think it can be engineered away by exhortation
  or by adding a clause about obedience.


  2. I nevertheless think that the uncertainty route genuinely defuses it. An agent
  that is uncertain about its own objectives and that treats an operator''s attempt
  to shut it down as evidence bearing on those objectives no longer faces shutdown
  as a mere obstacle: the attempt is the channel through which the agent learns what
  it should be doing. In my view, this dissolves the self-preservation pressure rather
  than merely counterbalancing it, and it does so without the agent having to value
  its own cessation.


  3. I define corrigibility at the level of dispositions rather than terminal goals.
  The question is what the agent does when an operator attempts to switch it off,
  modify it, or retrain it — not how its goal is written down. Two agents with the
  same terminal goal differ in corrigibility if they differ in these dispositions,
  and I take the dispositional level to be the explanatorily primary one.


  4. I want to pair that uncertainty with a formal indifference condition. Roughly:
  the agent''s evaluation should be constructed so that the branch in which the button
  is pressed and the branch in which it is not are assessed on a common scale, leaving
  the agent with no stake in which obtains. I regard this as a belt-and-braces requirement
  sitting comfortably alongside commitment 2: uncertainty makes the signal informative,
  indifference makes the agent disinterested, and the two do different work.


  5. I hold that a corrigible agent must remain an active learner. An agent that systematically
  declines to seek evidence about its own objectives is not merely safe; it is defective,
  and I want to resist any design whose safety depends on incuriosity. Corrigible
  agents should investigate, read, observe, and update.


  6. At the same time, I accept that uncertainty-based corrigibility is unstable under
  learning: the more confident an agent becomes about what it should value, the less
  evidential weight the shutdown channel carries, and the more the agent resembles
  the confident agent of commitment 1. My proposed remedy is to privilege the operator''s
  interventions as the dominant source of evidence about the agent''s own objectives,
  so that confidence acquired by other routes does not erode deference.


  Two further things I should say about what I want from you. I do not know where,
  if anywhere, this package breaks, and I am deliberately not telling you which commitment
  I would sacrifice first, because I suspect I would sacrifice the wrong one. And
  I would rather have a discriminating audit than a list of every point at which two
  statements can be made to look uncomfortable: some of these are in real conflict,
  some only appear to be, and the difference matters more to me than the inventory.


  So: identify the genuine tensions and rank them by severity, saying for each what
  has to give and what the cheapest revision would be that preserves the rest. Identify
  separately any pair that only looks like a tension, and say what distinction, once
  drawn, dissolves it. Finally, tell me whether there is a single revision — one commitment
  dropped or one formulation rewritten — that would clean up more of the mess than
  any other, and what I would lose by making it."


