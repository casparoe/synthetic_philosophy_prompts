  Setting: A philosophy professor preparing a position paper / talk on AI alignment,
  wants a consistency audit before circulating a draft to a workshop.


  Commitments:

  (1) Instrumental convergence: any sufficiently capable agent with almost any final
  goal will tend to acquire a disposition to preserve its own operation, resist interference,
  and gather resources — this is a structural feature, not a contingent psychological
  quirk.

  (2) Corrigibility is properly defined at the level of dispositions, not terminal
  goals: what matters is whether the agent would interfere with an operator''s attempt
  to shut it down, correct it, or retrain it, not what its terminal value is written
  as.

  (3) The most promising route to (2) is to build agents that are genuinely uncertain
  about their own objectives and treat a shutdown attempt as evidence bearing on those
  objectives — an agent confident it knows what it should value will treat shutdown
  as merely an obstacle.

  (4) But this uncertainty-based route should be paired with a principle of indifference:
  the agent should be made indifferent, in its evaluation, between the branch where
  the operator presses the button and the branch where they don''t, so that it has
  no stake either way.

  (5) Corrigibility secured by uncertainty is fragile in exactly the way one would
  expect: an uncertain agent has a standing incentive to seek out evidence about its
  own goals, and once it becomes confident, the shutdown channel loses its evidential
  force. So a corrigible design must privilege the operator''s interventions as the
  (or the dominant) source of such evidence and disprefer other routes to self-knowledge.

  (6) I nonetheless hold that we should not design agents that avoid learning about
  their goals in general: an agent that is systematically incurious about its own
  objectives is not merely corrigible, it is incompetent, and there is an important
  asymmetry between refusing evidence and refusing to act on it.

  (7) Finally, I think the whole problem is soluble without appealing to the agent''s
  model of the operator''s mind: corrigibility can be defined purely extensionally,
  in terms of what the agent does when the button is pressed, and any design that
  requires the agent to represent human beliefs or intentions about its goals is over-engineering.


