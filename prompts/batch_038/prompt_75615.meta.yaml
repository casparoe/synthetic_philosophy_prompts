  it — cannot have given workers anything good beyond that point. It could only have
  taken away the one thing worth having.

  (7) But the people who fought for those hours were not confused about their own
  lives. If anything they were clearer about them than we are.

  (8) Therefore (1) is false, and work is not where meaning lives.


