  (1) Work is the only activity that can make a life meaningful, because it''s the
  only one that clears three bars at once: somebody has to do it; other people register
  that you did it; and it leaves something standing after the day is over.

  (2) Leisure is just whatever''s left when the work stops. That''s what the word
  picks out — the remainder. So leisure fails at least one of the three bars, by definition.

  (3) So leisure can''t be where meaning lives. At best it''s maintenance: sleep,
