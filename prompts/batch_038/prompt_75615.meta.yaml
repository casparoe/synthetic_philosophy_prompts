  Josef Pieper''s "Leisure, the Basis of Culture" — leisure as a condition of the
  soul, contemplative, not defined as recovery from work. Aristotle Politics Book
  VIII: music education for the sake of leisure/ noble leisure. Also Bertrand Russell''s
  "In Praise of Idleness."

  - (1) is doing work: "meaning" — the argument needs work to be *necessary* and *recognized*,
  but housework and care work are both necessary and unrecognized historically. Also
  the recognition condition smuggles in a social-status premise.

