  The argument generalizes from meaningful work to work-as-such. Workers on an assembly
  line in 1919 arguably had *less* meaningful work; the shorter hours movement wasn''t
  claiming leisure was meaningful, it was claiming freedom/time — control over one''s
  own life. So the premise misdescribes what the strikers wanted: they wanted time,
  and time isn''t the same as "leisure activity."

