  §1. The standard pitch for predictive processing is that the brain is a prediction
  engine. Perception isn''t a readout of the senses; it''s the top of a hierarchy
  of guesses, and what the senses contribute is error — the mismatch between guess
  and input. The system''s job is to shrink that mismatch, either by revising the
  guess (perception) or by arranging the world so the guess comes true (action). The
  free energy principle generalizes this beyond brains: anything that persists long
  enough to look like a thing at all, anything whose states can be statistically separated
  from the rest of the world by a Markov blanket, can be described as minimizing a
  quantity (variational free energy) that bounds how surprised it is by its own sensory
  states. Defenders often present this not as a hypothesis you could falsify but as
  a formal constraint on there being a system at all, which is part of why critics
  say it explains everything and therefore nothing.


  §2. The classic objection is the dark room: if the goal is to minimize surprise,
  the optimum is a padded cell — no input, no error, nothing to be wrong about. The
  reply is that the thing agents minimize when they act is not free energy but expected
  free energy, which splits into a pragmatic part (how well a candidate action lines
  up with the outcomes the system is disposed to expect) and an epistemic part (how
  much a candidate action is expected to resolve uncertainty). Curiosity isn''t an
  add-on to the picture, it''s the second term. So the dark room objection is a red
  herring: it assumes the agent is trying to be unsurprised right now, when in fact
  it''s trying to be unsurprised across the futures it can bring about, and the cheapest
  way to do that is to go and look. I think that reply basically works. But notice
  what it costs. Once you grant the epistemic term, the substantive question is no
  longer "what does the system predict?" It''s "what does the system expect to learn,
  from where, and how much is that worth?" And that is a question about how a limited
  resource is allocated.


  §3. The resource is precision. Prediction error isn''t treated uniformly; each error
  signal is weighted by an estimate of its reliability — its precision, roughly the
  inverse of its variance. High-precision errors get to revise the model; low-precision
  errors get ignored as noise. Attention, on the standard reading, just is the optimization
  of these weightings, and the neuromodulatory systems are the usual candidates for
  implementing them. Now the move I want to make: if precision determines which mismatches
  can force a revision, then controlling a system''s evidence doesn''t require changing
  any of its predictions. You only have to change what it counts as worth listening
  to. Two consequences. First, on this picture an agent''s values — the states it
  acts to keep true — are not a separate desiderata module bolted onto inference;
  they are the relatively entrenched high-precision priors about the conditions it
  expects to find itself in. Second, and this is the interesting one, precision-setting
