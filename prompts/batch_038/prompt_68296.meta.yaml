  1. An act wrongs someone only if it makes that person worse off than they would
  otherwise have been.

  2. Emissions and growth policy over the next two centuries will shift the whole
  detailed course of history — who meets whom, when people are conceived, which people
  come to exist.

  3. So for each particular person who exists in, say, 2200, the high-emissions pathway
  is among the conditions of their existing at all; on the low-emissions pathway a
  different set of people exists.

  4. Life for those people, even on the hotter pathway, is worth living — his own
  numbers say so, and the report concedes it.

  5. The alternative for each of them is never existing. Never existing isn''t better
  for them.

  6. So none of them is made worse off by the high-emissions pathway.

  7. Therefore the pathway wrongs no one in 2200, and the same goes for any policy
  whose consequences land more than a couple of generations out.

  8. "Future generations" as such aren''t the sort of thing that can be wronged; only
  people are, and there''s no one there to be wronged in the relevant sense.

  9. So justice puts no constraint on how we trade off against the remote future.
  Climate policy has to be argued on other grounds: prudence, insurance, taste.


