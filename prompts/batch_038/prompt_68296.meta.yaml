  indemnified against complaint. And I have read that this move gets used in arguments
  against reparations for slavery and dispossession: the descendants alive today wouldn''t
  exist without the injustice, so they aren''t worse off, so no wrong was done to
  them. If the economist''s argument is sound, that argument is sound too. He told
