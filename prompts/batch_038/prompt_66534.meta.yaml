  I am marking take-home short answers for a final-year seminar in the philosophy
  of language; the unit was externalism about meaning and mental content. Below are
  the question as set and one candidate''s response. I need a grade and the comments
  that go with it.


  **Question (25 points).**


  Putnam''s Twin Earth case is standardly used to argue that the meanings of a speaker''s
  words are not fixed by what is inside that speaker''s head. Consider the following
  variant, which we will call Level Earth — "level" because nothing in the case turns
  on a hierarchy of authority among its speakers.


  Level Earth is just like Putnam''s Twin Earth in every intrinsic respect. Its inhabitants
  are molecule-for-molecule duplicates of Earth''s inhabitants; they associate the
  word "water" with exactly the stereotype we associate with it; and its lakes, rivers,
  and rain are made of a liquid that is macroscopically indistinguishable from ours
  but whose composition is XYZ rather than H2O. To this we add one stipulation, which
  is social rather than psychological. On Level Earth the word "water" is nobody''s
  special province: there is no natural science, no craft or trade that deals in discriminating
  liquids, and no group whose verdicts about which substances are water the rest of
  the community defers to. Every speaker applies the term entirely on her own authority,
  and no one''s use is answerable to anyone else''s. Grant, for the sake of the case,
  that this arrangement is compatible with the inhabitants'' being intrinsic duplicates
  of us; what matters is which facts about the situation fix reference.


  (a) [8 points] Does Putnam''s argument still get a grip on Level Earth? That is,
  does "water" in a Level Earth speaker''s mouth refer to XYZ, refer to H2O, or fail
  to refer at all? Say what, on Putnam''s account, fixes the reference in a case like
  this one.


  (b) [8 points] Given your answer to (a), what work is the division of linguistic
  labour doing in Putnam''s argument, and what work is it not doing?


  (c) [9 points] A classmate objects to your answer to (a) as follows: "If what a
  speaker''s word refers to is fixed by something outside her head, then the Level
  Earth speakers do not know what they are talking about, and they cannot later find
  out that they were wrong. When chemists eventually arrive on Level Earth, they will
