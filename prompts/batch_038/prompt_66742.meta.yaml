  Draft:


  "I chair my department''s spring colloquium series, and next week''s speaker is
  a Kierkegaard scholar whose interpretation of Fear and Trembling departs from both
  of the readings my graduate students will have arrived with. She rejects the divine-command
  reading, on which the teleological suspension licenses Abraham because God has commanded
  something ethics cannot; and she rejects the existentialist-choice reading, on which
  Abraham''s act is a groundless leap that merely demonstrates the primacy of decision.
  Her own thesis, as I understand it, is roughly this: the ethical, in de silentio''s
  sense of the universal, is by construction a system of general descriptions, and
  Abraham''s obligation to Isaac is a relation between two particulars that no general
  description can capture; the suspension is therefore not the overriding of a duty
  by a higher authority but the emergence into view of something that was always outside
  the ethical''s expressive range — ethics is not overruled, it is shown to have been
  silent all along. On this view Abraham needs no command to be unintelligible, and
  the ''absurd'' names not the content of a promise but the fact that the particular
  cannot be reconstructed from the universal.


  I''ll be moderating the Q&A after her lecture and I want to do more than let her
  present the reading twice. Please draft eight to ten questions ... Each question
  should be followed by a note (one or two sentences) identifying the reply she is
  most likely to give and the follow-up keyed to that reply — I want to be able to
  work from the page without improvising.


  Requirements:

  - At least one question pressing the obvious worry that her reading collapses into
  moral particularism (Dancy-style, though she need not accept the label) or into
  an ethics of care: if the point is that no system of general rules can capture a
  concrete relation between two persons, what distinctively remains of ''faith,''
  ''God,'' and ''the absolute duty to God'' — and why isn''t Problema II surplus to
  her interpretation?

  - At least one question on silence: de silentio insists Abraham cannot speak, and
  that what he would have to say could not be understood. Does her reading explain
  the silence, or merely relocate it — i.e., is Abraham silent because his ground
  is inexpressible in principle, or because he lacks an audience?

  - At least one question on the criterion: if the act is not licensed by a command,
  what distinguishes Abraham''s faith from a monstrous piece of self-authorization?
  Anticipate her likely reply — that from the outside there is no such mark, and that
  this is precisely what makes faith a paradox — and give me the follow-up that makes
  that answer cost her something (for example, about whether she can still call Abraham''s
  act a response to anything, and about the Exordium''s four failed retellings, in
  which Abraham remains willing to obey yet loses faith: what, on her reading, goes
