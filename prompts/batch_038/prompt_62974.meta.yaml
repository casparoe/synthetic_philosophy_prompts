  over an infinite horizon (which would license full-Kelly, high-variance allocations),
  but the governance practice is driven by annual accounting, career risk, and the
  fact that the institution''s *decision-makers* are not the entity whose growth rate
  matters — the trustees are replaced every few years, so their effective horizon
  is short. This is a deep issue in geometric rationality: whose time average? The
  ergodic argument requires the *same* agent to experience the whole sequence. An
  institution with rotating decision-makers, and which pays out a fixed fraction each
  year, is not obviously an entity for which the time-average is the right criterion;
  and the spending rule (a fixed fraction withdrawal) is itself a Kelly-like geometric
  constraint that makes ruin possible if returns fall below the withdrawal rate.


