  the seller''s reinsurance purchase rational. Hmm, both sides are "ruin-avoiders"
  — one gains from variance pooling, the other pays to shed variance. What distinguishes
  them? Diversification: the insurer pools many independent risks so the aggregate
  is near-certain, and buys reinsurance against correlated catastrophe. That''s the
  key: the practice presupposes that risk pooling converts variance into near-certainty
  only when risks are independent, so the relevant philosophical commitment is about
  the ergodicity of aggregation, i.e., that a large ensemble behaves like a long run.
  This is genuinely the ergodicity problem in disguise: space-average vs time-average.
