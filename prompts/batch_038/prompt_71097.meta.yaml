  student''s answer:

  "Gongsun Long was a Mohist logician and his White Horse dialogue is the most famous
  bit of the School of Names. He''s asked whether it''s admissible to say a white
  horse is not a horse, and says yes. His first move is that ''horse'' names the shape
  of a thing and ''white'' names its colour, and what names the colour isn''t what
  names the shape, so the two names can''t be the same name. His second move is the
  one I find convincing: if you ask someone for a horse they''ll bring you a yellow
  one or a black one, but if you ask for a white horse they won''t, so ''horse'' and
  ''white horse'' have different extensions — one class of things is bigger than the
  other. Different extensions means the two terms can''t mean the same, and that''s
  exactly what Gongsun Long says: the white horse class isn''t the horse class.

  So I think the conclusion is true as long as you read it carefully. It''s not that
  a white horse isn''t an animal of the horse species, obviously, it''s that the name
  ''white horse'' picks out something narrower. People who say he''s being silly are
  just confusing intension and extension.

  He backs this up with the point that whiteness and horseness are separate, because
  when you look at a white stone you see the whiteness but you don''t see the hardness,
  and each property can be picked out on its own without the others. That''s why the
  Mohists attacked him — they said hardness and whiteness are both in the stone so
  you can''t pull them apart, and if they''re right about that the white horse argument
  fails too.

  Overall a clever piece of philosophy of language, definitely not just a word game,
