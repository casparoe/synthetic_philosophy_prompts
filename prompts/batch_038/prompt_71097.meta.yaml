  Key interpretive points:

  - The Chinese 白馬非馬 is ambiguous between "a white horse is not a horse" (predicative)
  and "white horse is not identical with horse" (class/naming).

  - Intension vs extension: ''white horse'' has a richer intension, smaller extension.

  - Chad Hansen''s mass-noun hypothesis: classical Chinese nouns behave like mass
  nouns (like "water", "snow"), so the parthood/mereological reading: "a white horse
  is not a horse" means the stuff white-horse is not the stuff horse — mereologically,
  white horse is a part/intersection. Hansen argues Gongsun Long is making a mereological
  point rather than a class-membership one.

  - A.C. Graham''s view: the argument turns on "names" and their referring; Graham
  thought the disputers were doing something like analysis of reference.

  - Fraser (SEP) treats it as about whether the compound name "white-horse" is the
  same name as "horse"; the conclusion "white horse is not horse" is defensible on
  a certain semantic point (the names pick out different kinds/standards) but the
  paradox arises from sliding to the object-level claim.


  Also the "hard and white" (jian bai) dialogue: a hard white stone — hardness and
  whiteness are "hidden"/separate; you see whiteness but not hardness, you feel hardness
  but not whiteness, so they are not "filled" together — hence "hardness and whiteness
  are separate" (離堅白). The Mohists responded: hardness and whiteness are "contained
  in" the stone (they are in the same thing, so not separate) — Mohist Canon: "Hardness
  and whiteness do not exclude each other, they are contained in the stone." That''s
  a well-known Mohist rebuttal.


