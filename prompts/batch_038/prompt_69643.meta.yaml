  \ 1978, Tanzania/Uganda 1979) — and asks what principle captures them. The tension:\
  \ interventions that remove genocidal regimes without UN authorization (Kosovo:\
  \ illegal but legitimate; Vietnam in Cambodia: removed the Khmer Rouge but was widely\
  \ condemned as aggression). That's a genuinely hard-to-reconcile pair. And the asker\
  \ might say Vietnam-Cambodia was fine but Iraq 2003 wasn't, or might have inconsistent\
  \ verdicts.\n\nThis domain allows the \"injected niche idea\" naturally: the asker\
  \ can stipulate hypothetical cases with tweaked parameters (e.g., a case where the\
  \ intervening state has itself committed atrocities, a case where the local population\
  \ explicitly requests intervention, a case where intervention is by a regional bloc\
  \ but against a democratically elected government that's massacring people).\n\n\
