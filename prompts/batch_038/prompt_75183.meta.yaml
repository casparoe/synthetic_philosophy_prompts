  I''m in eleventh grade and I''m on my school''s history-and-economics debate team.
  This weekend we''re arguing the resolution that the collapse of Soviet-style central
  planning was ultimately a failure of technology rather than of economic theory,
  and I''ve been assigned the negative side even though I find the affirmative case
  intuitively appealing. Our team captain''s whole argument runs on one analogy, and
  he keeps returning to it: an economy is essentially an enormous system of simultaneous
  equations describing what should be produced, by whom, and at what cost; a market
  is just a very slow, physical machine that stumbles toward the solution by trial
  and error; and the Soviet planners failed not because the problem was unsolvable
  in principle but because they lacked the processing power to solve it. On his telling,
  the debate was settled by arithmetic and hardware, and now that we have machine
  learning and enormous datacenters, the calculation objection is simply obsolete
  — a sufficiently advanced AI planner could match or beat the market. To support
  this he cited our teacher, who told us that an Italian economist had already written
  down the equations a socialist ministry would have to solve before the Russian Revolution
  even happened, and that Lange himself supposedly remarked decades later that once
  you could feed those equations to a computer you would have the answer almost immediately,
  which would make the market look like a primitive pre-electronic calculating device.


  The other side in our club uses a completely different picture, and I can''t tell
  whether the two are genuinely in conflict or just talking past each other. Their
  analogy is that prices are not the output of a computation at all but a communication
  system — something like a telephone network or a shared language — in which the
  relevant facts about scarcity, local conditions, and what particular people can
  do with particular resources are not sitting around waiting to be collected and
  entered as inputs, but only come into existence, and only get articulated, through
  the act of exchanging. On their version the market is less like a solver grinding
  toward a known answer and more like a conversation, or a discovery procedure, in
  which the questions themselves keep changing. One of my teammates then said that
  both sides are really just re-describing the same thing with different machinery
  metaphors, and that whichever analogy you pick decides the debate before any argument
  is made.


  Could you audit both analogies for me rather than tell me which economist was right?
  For each one, I''d like an explicit correspondence table — in the computer picture,
  what exactly plays the role of the equation system, the variables, the input data,
  the objective function, the solver, and the error signal; in the communication picture,
  the sender, the receiver, the message, the code, and the noise — and then the places
  where the mapping breaks. Please separate the disanalogies that actually matter
  for my captain''s conclusion from the ones that are just decorative; for instance,
  I can see that solving millions of equations is computationally hard, but I don''t
  know whether that''s a load-bearing objection or one that better hardware genuinely
  dissolves. I''d especially like to know what each analogy quietly imports: the computer
