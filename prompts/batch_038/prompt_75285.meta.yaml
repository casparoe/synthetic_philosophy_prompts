  Where does it go wrong? Candidate diagnoses:

  - (2) equivocates: "ordinary citizens'' judgments are better than chance" is a claim
  about aggregate track record on a heterogeneous mix of questions (average over questions,
  where the electorate often gets things right), while (1) requires p > 1/2 *for each
  voter on the specific question at hand*, with independence. Track-record evidence
  across questions doesn''t establish question-indexed competence. Also the evidence
  cited (prediction markets, Galton) is about aggregation of *estimates* (means/medians,
  continuous quantities, and markets with price signals and incentives), not majority
  vote on binary questions.

  - Independence fails: common information sources, cascades, correlated errors. And
  crucially, the correlation is exactly what makes (2)''s evidence and (4)''s inference
  hollow: if voters are correlated, the effective sample size is much smaller, and
  the exponential convergence in n is replaced by a bound that can be arbitrarily
  bad.

  - (4)''s comparison class slide: theorem compares majority to *individual members
  of the same group*, not to the best available alternative procedure. Also monotonicity:
  adding voters can *lower* majority accuracy when the added voters are less competent
  or correlated (there are precise results: majority accuracy can decrease with group
  size under certain conditions; also the classic result that the size-competence
  tradeoff can go either way — Ben-Yashar & Nitzan 1997? Or the general point that
  CJT''s monotone-in-n result requires fixed p and independence).

  - (5) slides from "more likely to be correct" to "ought to defer," ignoring that
  deference changes the inputs: if everyone defers to the majority, the votes are
  no longer independent samples of private judgment (this is a nice performative/self-undermining
  slide — the "reflexivity" problem: universal deference destroys the independence
  that generated the reliability). This is a genuinely good flaw and it''s the kind
  of thing a strong model will find. Also, deferring requires you to have independent
  access to what the majority thinks, which is itself a factual question subject to
  the same problem (polls, media framing).

  - (6)/(7) slide from binary questions with an independent truth to normative questions
  where CJT doesn''t apply, or where the "truth" is constituted by the procedure.

  - Also the limit-vs-finite slide: "approaches 1 as n grows" is a limit claim; for
  any finite n, and for p barely above 1/2, the majority can still be wrong with substantial
  probability. And the theorem''s convergence says nothing about the probability that
  *this particular* majority verdict was right (the inverse-probability slide, needs
  a prior over hypotheses — the "confidence" version of CJT requires care; there''s
  a literature on this: the difference between the probability the majority is right
  given p, and the posterior probability given that the majority said so).


