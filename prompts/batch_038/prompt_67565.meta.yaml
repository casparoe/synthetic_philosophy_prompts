  the perceptual analogy; then the worry: extra sensitivity may be motivational rather
  than cognitive — threat reactivity, disgust propensity, system-justifying motives
  — and detecting a consideration isn''t the same as its being there; also the perceptual
  analogy grants that perception is broadly truth-tracking in a way we cannot assume
  for moral sensibility].


  Second, what I''ve been calling the confabulation bind: moral foundations theory
  is typically bundled with the social intuitionist model, on which moral reasoning
  is mostly post-hoc rationalization of intuitions that have already arrived (this
  is the machinery behind the dumbfounding results — people who condemn a harmless-but-disgusting
  act and cannot say why). If that model is right, then the philosophical argument
  that conservatives see more of the moral landscape is itself likely to be confabulation
  in the service of an intuition, in the mind of whoever finds it compelling; and
  if reasoning is reliable enough to carry that argument, the social intuitionist
  model is overstated. Can the essay get out of this, or does it force a deflationary
  verdict on the whole enterprise?


