  I''m a second-year philosophy master''s student, and the seminar I''m in pairs a
  normative ethics or metaethics paper with a piece of moral psychology each week;
  my job this week is to give a ninety-minute presentation on whether the empirical
  literature on the moral differences between political left and right has any bearing
