  Paragraph 1: Setup/context — the asker is a philosophy grad student (or an MA student)
  writing a paper for a seminar on moral psychology and metaethics, or preparing a
  talk. Give some not-super-relevant detail (e.g., a department reading group, a co-author,
  a deadline, an uncle who is a conservative). State the topic: essay on whether the
  empirical psychology of left/right moral differences tells us anything about which
