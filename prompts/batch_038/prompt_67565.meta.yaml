  present it, so that I know what I actually think rather than just surveying positions,
  and I''d like you to write a first full draft of that essay for me to argue with.


  The empirical setup, as I understand it: moral foundations theory holds that moral
  judgment is built on several distinct, innately prepared sensitivities — care/harm,
  fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation,
  with liberty/oppression added later — and the theory''s architects have recently
  revised both the framework and its measurement instruments. Questionnaire studies
  using this framework have repeatedly found that self-described liberals in the American
  sense lean heavily on the first two, while self-described conservatives draw more
  evenly on all of them, and the most influential popular statement of the theory
  draws a frankly normative conclusion from this: that the right has a broader moral
  palate, sees more of the moral landscape, and is therefore better placed to build
  durable moral communities and to get policy right. I want the essay to take that
  inference seriously rather than dismiss it, and to press on two reconstructions
  of my own that I haven''t been able to evaluate.


