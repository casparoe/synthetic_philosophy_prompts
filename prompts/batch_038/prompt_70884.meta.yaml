  about knowledge through causes. (b) Hobbes''s objection to Wallis''s Arithmetica
  Infinitorum use of "induction" over infinite sequences: Wallis proved results by
  enumerating a pattern for finite cases and then "by induction" extending to the
  infinite, which Hobbes called no proof at all. This is actually a substantive mathematical-philosophical
  point (Wallis''s inductive extrapolation of series like 1/(1+2+...+n) → 2/(n+1)
