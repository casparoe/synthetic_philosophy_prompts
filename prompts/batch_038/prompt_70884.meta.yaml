  objected that this is not rigorous, and that "infinitesimals" and "an infinite number
  of parts" are incoherent. Wallis replied that Hobbes was a fool. (c) Hobbes''s nominalism:
  names are arbitrary marks; definitions are of names, not things; hence mathematics
  is certain because we define it — but this seems to threaten its applicability to
  nature, and Hobbes tried to solve it with motion and body.


