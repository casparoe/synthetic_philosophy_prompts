  I sit on the research staff of a mid-sized city government, and last autumn our
  department ran a two-day workshop for regional policymakers on whether municipal
  budgets should be guided by wellbeing indicators. Two of the invited speakers —
  call them the economist and the philosopher; I don''t want to name them, since the
