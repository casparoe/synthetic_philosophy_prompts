  has proposed a rank as a target, and the report''s authors themselves caution against
  reading small differences as real — and that the third is the interesting one, but
  overstated. Her counter was that the levers that move this measure are not exotic:
  better mental-health provision, shorter commutes, housing security, lower corruption.
  A government that pursued those for their own sake would move the ladder too, and
  the fact that it could in principle game the survey is not a reason to refuse to
  improve what the survey is imperfectly tracking. She finished by noting, a little
  uncharitably, that the philosopher''s position amounts to refusing to use a crooked
  ruler when the alternative is no ruler at all.


