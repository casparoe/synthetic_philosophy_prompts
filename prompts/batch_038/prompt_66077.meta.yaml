  about national happiness rankings, and I took fairly careful notes because I''ve
  been asked to write a short internal memo on exactly this question. Neither would
  concede much, and I can''t tell who came out ahead. Here is the argument as best
  I recorded it, in six moves.


  (1) The philosopher opened by saying the World Happiness Report does not measure
  happiness at all: its ranking rests on a single ladder question that asks respondents
  to place their lives on a scale from the worst possible life to the best possible
  life, and that is a request for a reflective verdict on one''s circumstances, not
  a report of how one feels. She said the confusion is baked into the title, and that
  a great many people who spend their days in the survey''s top countries would say
  they are not particularly happy in the everyday sense.


  (2) The economist replied that this is fair as a point about vocabulary and trivial
  as a point about substance. The report''s own authors distinguish life evaluation
  from affect and say explicitly that they rank on evaluation, so the objection attacks
  the marketing, not the instrument. And evaluation matters: if you want to know whether
  a country''s arrangements are working for the people living under them, a considered
  verdict on one''s life as a whole is at least as good a target as a tally of yesterday''s
  smiles.


  (3) The philosopher said the real problem is that the ladder is self-anchoring —
  the top of it is defined as the best possible life *for you* — which means different
  respondents are answering different questions. A person whose best possible life
  involves a secure job and a roof may place themselves at an 8, while a person whose
  best possible life involves something more ambitious places themselves at a 5 despite
  better circumstances. If the yardstick travels with the respondent, she said, cross-country
  averages are not comparable, and the ranking is a comparison of incommensurables.


  (4) The economist answered that adaptation cuts both ways and that the observed
  data are stubborn: national averages of this question line up closely with income,
  life expectancy, whether people have someone to count on, and whether they trust
  their institutions, and they have been stable enough year to year that the report
  pools three years of Gallup fieldwork to smooth out noise. She added that if the
  ladder were merely tracking local conversational standards, one would not expect
  it to move as much or as predictably as it does when a country''s circumstances
  change.


  (5) The philosopher then turned to the policy question that the workshop was actually
  about, and said that even if the instrument were sound, no government should aim
  to top the list. Her reasons were three: the ranking is of national means, so a
  country could climb it while its worst-off fifth grew more miserable; the gaps at
  the top are small relative to the report''s own published confidence intervals,
  so "first place" is often a sampling artifact dressed up as an achievement; and
  once a rank becomes a target, it stops being a measurement and starts being a managed
  quantity, because the thing that determines the score is what people say.


