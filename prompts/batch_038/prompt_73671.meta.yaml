  by fiat of its Office of General Counsel, to govern all contract drafting by a strict
  Russellian analysis of definite descriptions. The piece should take the form of
  a short cover memorandum followed by numbered sections of a compliance manual, e.g.,
  ''Global Reference Standards (Revision 4)'', with one annex containing a specimen
  form.


  What the manual must do, and where the humor should come from: every definite description
  used in a firm document must be shown to satisfy an existence condition and a uniqueness
  condition before the document may be executed; a section therefore mandates an attestation,
  signed by an officer, that exactly one entity in the relevant domain satisfies the
  description, and the manual must show this requirement collapsing in practice —
  descriptions of future or hypothetical parties, plural and mass descriptions, and
  descriptions of the firm''s own premises, which cannot be expanded far enough to
  be unique without the manual becoming unusably long. Include a scope discipline
  section requiring drafters to specify, for every negated or modalized clause containing
  a description, whether the description takes wide or narrow scope, and to record
  that choice on a form; the resulting drafting practice should be visibly absurd
  but semantically impeccable. Include a fallback clause for the litigation department,
  drawn from the objection that where a description fails to denote no statement is
  made and hence nothing false is asserted — and show the risk committee worrying
  that opposing counsel will reply that this excuse trades on what the speaker implicated
  rather than on what the sentence said. Include a section on descriptions used to
  pick out a particular individual whoever it may turn out to be (the referential
  use), and the manual''s attempt to police it, plus a disciplinary provision dealing
  with a sister office in a jurisdiction that persists in treating proper names as
  tags that designate the same bearer across every counterfactual circumstance — the
  resulting cross-border clause conflicts (a vessel named in one clause and described
  in another behaving differently under a force majeure analysis) should be played
  completely straight.


  Constraints: keep the register deadpan throughout — no winking, no asides to the
  reader, no footnote admitting it''s a joke. Invent all case names, parties, and
  specimen clauses; do not quote or closely paraphrase from any published philosophical
  text, and do not supply references, bibliographies, or citations of any kind — the
  manual''s only authorities should be its own internal precedent file, including
  one venerable matter in which a sovereign requested confirmation of whether a certain
