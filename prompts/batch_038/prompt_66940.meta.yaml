  Option: A knowledge-representation / ontology engineer (description logics, RDF
  triples, reification). RDF literally has "reification": to make a statement about
  a statement you create a resource with rdf:subject, rdf:predicate, rdf:object properties.
  And the classic problem: reified triples don''t entail their unreified counterparts
  — the "gap" between the reification and what it stands for. And there''s the well-known
  issue that a triple is both a relation among resources and an object you can quantify
  over, and RDF-star was invented to fix the awkwardness of reification. This is a
  *perfect* fit for Bradley''s regress: the triple (s, p, o) needs to be "unified"
  — what makes it one fact rather than three items? And the reification machinery
  is exactly the "add another relation to glue them" move, generating a new regress
  (now the reified resource needs to be related to its constituents). And RDF-star''s
  design decision — that a triple is both a term and a fact, with a notion of "occurrence"
  vs. "quoted triple" — is an explicit engineering response to unity. Plus OWL n-ary
  relations pattern: to represent an n-ary relation you create a class whose instances
  are the relation instances, i.e., reification, and then the question "what ties
  the instance to its components" arises.


