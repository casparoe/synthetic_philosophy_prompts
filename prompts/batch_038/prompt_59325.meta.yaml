  The readings:

  (a) Ontological/semantic: "illness" is defined by deviation from an anatomical/physiological
  norm (Szasz''s roughly Boorse-like premise, though Boorse came later), so nothing
  without a lesion is literally an illness; "mental illness" is a metaphor. Verdict:
  depends on contested premise about "illness"; note that Szasz''s own criterion is
  arguably a stipulation.

  (b) Epistemic: psychiatric diagnoses lack validated biomarkers, low reliability,
  poor predictive validity — so they aren''t diseases in the sense of being well-individuated
  natural kinds. Verdict: partly true, contested, and consistent with disorders being
  real in a weaker sense.

  (c) Normative/legal: what psychiatrists call symptoms are rule-breaking, and the
  label converts moral/legal problems into medical ones; hence involuntary treatment
  is a violation, since there''s no disease to justify overriding autonomy. Verdict:
  this is the one Szasz actually cared most about; note the gap from (a)/(b).

  (d) Pragmatic/functional: the label does social work — it disables the labeled person
  from being held responsible and lets the state intervene; "myth" = the concept functions
  as an excuse/rhetorical device regardless of whether anything corresponds to it.

  (e) Eliminativist: there is nothing at all going on with these people — no suffering,
  no dysfunction — a reading almost nobody holds and probably not what the speaker
  means, but the one listeners often hear.

  (f) Anti-essentialist about "the mental": the claim that whatever is going on isn''t
  in the head/brain but in the person''s relations, language, or life situation ("problems
  in living").


