  else because we can cooperate flexibly in huge numbers by believing in shared fictions
  (gods, money, nations, limited liability companies) — is unfalsifiable for exactly
  the stretch of time it''s meant to explain. Beliefs don''t fossilize. So any evidence
  of large-scale cooperation gets retrodicted as "they must have had a shared myth,"
