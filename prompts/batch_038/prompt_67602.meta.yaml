  Key subtle points that could be mis-stated in the summary: (1) The labels Orwellian/Stalinesque
  are not Dennett''s invention of an ordinary distinction — they come from his discussion;
  Orwellian = revising history after the fact (memories rewritten, so no one can tell),
  Stalinesque = staging the show before the witness (the experience itself is edited
  so it never happened that way). Dennett & Kinsbourne''s claim is that the distinction
  collapses / is not empirically decidable in these cases because the only evidence
  is the subject''s report, and reports are produced post-hoc. (2) The color phi does
  not show consciousness is an illusion, nor that experiences don''t exist; it shows
  there''s no determinate fact about the order of content-fixation absent a privileged
  "witness." (3) It doesn''t imply there is no fact of the matter about temporal order
  of neural events.


