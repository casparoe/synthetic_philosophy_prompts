  Content:

  - "There are two legal routes to being dead in the US: your heart and lungs stop
  for good, or your whole brain, brainstem included, stops working for good. Every
  state has passed some version of this." (Accurate enough: all 50 states recognize
  neurological determination; UDDA adopted widely. Fine.)

  - "Brain death isn''t a coma or a vegetative state. People in vegetative states
  still have working brainstems — they breathe on their own, they sleep and wake —
  and they can live for years. A brain-dead person can''t; the ventilator is doing
  the breathing because the respiratory centers in the brainstem are destroyed." (Accurate.)

  - Subtle error #1: "That''s why the legal test is the apnea test: you take the patient
  off the ventilator and watch to see whether rising carbon dioxide makes them breathe.
  If they don''t, they''re dead, because the ability to breathe is what makes a body
  an organism rather than a collection of organs." — This conflates the philosophical
  rationale (brain as master integrator, Bernat/Culver/Gert) with the specific test,
  and implies the apnea test alone suffices (in fact, clinical exam: coma with known
  cause, absence of brainstem reflexes, apnea test, plus exclusion of confounders
  like hypothermia, drugs, severe metabolic derangement). Also the "why" clause smuggles
  in a contested philosophical claim as if it were the physiological rationale. Also
  arguably wrong: the rationale for the whole-brain standard is not that breathing
  per se matters but that the brainstem is the critical integrator.

  - Subtle error #2: irreversibility conflation: "The law says ''irreversible,'' and
  that''s literal: once you''re declared dead this way, no intervention could ever
  bring the function back. That''s the difference between death and the condition
  of the DCD patients — wait, no." Let''s set it up: the journalist describes donation
  after circulatory death: "In DCD, the team waits for the heart to stop on its own
  after life support is withdrawn, watches for two to five minutes, and then declares
  death because circulation has stopped irreversibly." Then: "Critics point out the
  obvious problem: if you started CPR during those minutes you could get the heart
  going again, so the cessation isn''t irreversible — it''s just that nobody''s going
  to try. The defenders answer that it doesn''t matter, because what the law requires
  is permanence: the function won''t come back on its own and nobody intends to bring
  it back. But that answer has a cost: it means death is declared on the basis of
  a decision, not a biological fact — which is exactly what the critics were worried
  about." That''s a fairly sophisticated and mostly right summary. The subtle error:
  saying "that''s the obvious problem" as though the permanence/irreversibility distinction
  settles it is contested; also, framing the defenders'' answer as if it makes death
  a matter of decision. Hmm, that''s actually the critics'' position (Truog/Joffe:
  DCD is "consent-based"/role of intentions). A better planting: attribute to defenders
  a claim they don''t make, or state as settled that the permanence move concedes
  death becomes a matter of decision. Good — subtle misrepresentation: "the defenders
  concede..." Actually let''s make it: "Defenders say this is fine because irreversibility
  was never what mattered; but if that''s right, then the moment of death depends
  on what the team has decided not to do, which means death is partly a social fact."
  That is a contested inference presented as a consequence. Good, subtle.

  - Subtle error #3: history/organ transplant: "Brain death was invented in 1968 by
  a Harvard committee that was quite open about one of its motivations: there were
  patients in irreversible comas filling up ICU beds, and there was a shortage of
  organs for the new transplant surgeries. Once the concept was accepted, the organs
  became available. So the definition of death changed to suit a social need, which
  is why some people still argue that brain-dead donors aren''t really dead and that
  the ''dead donor rule'' — you may only take organs from people who are already dead
  — is a fiction everyone agreed to keep up." The misrepresentation: treating the
  causal/definitional story as settled and implying brain death = not really dead;
  also the committee''s stated reasons included the ICU/coma problem and the transplant
  need, but "brain death was invented to make transplantation possible" overstates
  and misdates (the concept was being developed in Europe, notably Mollaret & Goulon''s
  "coma dépassé" in 1959, and Scandinavian work, before/alongside the transplant era).
  Also "dead donor rule is a fiction everyone agreed to keep up" — that''s the position
  of a minority (Truog/Miller argue for abandoning DDR); presenting it as consensus.
  Good.

