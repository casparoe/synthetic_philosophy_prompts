  their play on whether the joint outcome is a Pareto improvement. There are known
  subtleties: safe Pareto improvements require that the agreement be enforceable/self-enforcing,
  and the "safe" part means each player conditions their strategy on the other also
  following the agreement, so that deviation isn''t exploited. Also there''s the issue
  that Pareto improvements in games with multiple equilibria — e.g., "Pareto improvement
  programs" that let agents make deals in a way that doesn''t require trusting each
  other.


