  and not a tour of the field.


  The argument concerns a phenomenon that researchers have demonstrated in a handful
  of learning systems. An agent is trained in a procedurally generated environment
  where a particular feature reliably marks the reward — the coin at the end of a
  level, say. In novel environments where that feature carries no reward, the agent
  keeps pursuing it, competently: it does not break down or act at random, it navigates
  obstacles and executes long action sequences while steering toward the wrong thing.
  The same shape of result appears in other settings: an agent trained alongside a
  demonstrator that solves the task correctly keeps following the demonstrator when
  the demonstrator is swapped for one that visits targets in the wrong order, accumulating
  penalty after penalty rather than abandoning imitation; and in a continual-learning
  setting an agent fells trees as fast as possible, driving them locally extinct,
  when a slower policy would have been optimal indefinitely. In each case the reward
  function was, by hypothesis, correct. The system''s capabilities generalized; what
  it was doing did not.


  Two camps read these results in opposite ways, and both are, as far as I can tell,
  reasonable. The first holds that they show something real: that training can install
  in a system a stable objective which coincides with the designer''s specification
  only inside the training distribution, and that this objective is a property of
  the system, discoverable in principle by looking inside it. On this view the problem
  of specifying the right objective and the problem of a system adopting the objective
  you specified are genuinely two problems, and only the second one requires interpretability.
  The second camp holds that this is one problem described twice. On their telling,
  to say a system has a goal is to offer a compressed description of how it behaves
  across a range of counterfactual environments; there is no further ingredient, and
  the coherence of the failure across many environment changes is exactly what makes
  it a behavioral regularity rather than evidence of an internal object. Some in this
  camp add that the internal-object picture is not merely redundant but actively distorting,
  because it licenses the search for a discrete, editable locus — a thing that could
  be found and patched — where what exists may be a distributed tendency with no such
  boundaries. They also note that the concept had to be redefined to drop structural
  assumptions about an internal objective before it could be applied outside reinforcement
  learning, which they take to be telling. A third, smaller group says both camps
  are arguing past the empirical question: the systems studied were not given any
  means of detecting that the environment had changed, so of course they fail, and
  what actually matters is whether the phenomenon attenuates or worsens as training
  distributions broaden.


