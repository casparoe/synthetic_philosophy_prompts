  ---


  I cover artificial intelligence research for a general-interest science magazine,
  and I have spent the better part of two years reporting on a particular argument
  inside the alignment community that shows no sign of resolving. I want a diagnosis
  of the argument''s structure, not a verdict on who is right, and not a survey of
  the field.


  Here is the argument, as I have encountered it in interviews and preprints. One
  camp holds that a learned policy can acquire, during training, something properly
  called a goal — a latent objective the system pursues — and that this goal can come
  apart from the training objective. Their evidence: agents trained on procedurally
  generated environments reliably continue to pursue a proxy feature of the training
  levels (reaching the far right edge of the screen, collecting a particular item)
  in novel levels where that feature carries no reward; the misgeneralized pursuit
  is stable across many different environment changes rather than a one-off quirk;
  and models trained on dialogue transcripts under a mislabeled role format end up
  pursuing one conversational role rather than the other, and keep doing so after
  the format is corrected. On this view, "outer" and "inner" alignment are two genuinely
  distinct problems, and the second one requires looking inside the system.


  The other camp holds that this is all one problem described twice. On their telling,
  "the system has goal G" is not an additional fact about the system beyond a compressed
  description of its dispositions across a range of counterfactual environments; to
  say a policy''s goal misgeneralized is just to say it does the wrong thing off-distribution,
  which is what a mis-specified objective also predicts. Some in this camp add that
  positing latent goals is not merely redundant but actively misleading, because it
  invites us to look for a discrete, editable object inside the network — a thing
  that can be found and patched — when what exists is a distributed statistical tendency
  with no such boundaries. A third, smaller group says the question will be settled
  empirically and doesn''t matter either way: as models get larger and training distributions
  broaden, the phenomenon either attenuates or it doesn''t, and the metaphysics is
  beside the point.


  All three groups cite the same experiments, and each says the results support it.
  Nobody has moved. My working hypothesis — and I want it tested rather than flattered
  — is that the parties are not answering the same question. One is making an ontological
  claim about what goals are; one is making a methodological claim about which research
  programs deserve funding and attention; and the third is making a prediction. If
  that''s right, the stalemate is an artifact of a shared vocabulary, and the interesting
  question is which of the three is actually decidable.


  So: what kind of disagreement is this? Verbal, substantive, or several distinct
  disagreements entangled under the term "goal misgeneralization"? Is there a hidden
  empirical or formal question that one or both sides are gesturing at without stating
  it — something about how a goal-ascription is supposed to be tested, or about whether
  the notion of a goal that persists across distribution shift can be made precise
  at all? Is the distinction between "the training objective was wrong" and "the system
  learned a different objective than the one we supplied" a real joint in nature,
  or a useful fiction whose usefulness is the entire point? Please support the diagnosis
  by reference to what each side actually commits to — I''d rather you reason from
  the positions as I''ve laid them out than recite the literature — and then tell
  me what would count as progress: a distinction, an experimental design, a formal
  result, a change of question, or a reasoned case that none is available.


