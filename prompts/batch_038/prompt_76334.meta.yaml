  The idea. There''s a family of explanations that cite a rationale but no reasoner.
  A termite mound is built to regulate temperature and humidity though no termite
  represents that; a market keeps shifting production toward what people pay for though
  nobody plans it; a trained neural net reliably steers toward an objective that isn''t
  written down anywhere in the system, and its designers can''t tell you what it is.
  In each case the rationale looks real in the operational sense that matters — it
  supports counterfactuals, it lets you predict how the system will respond to changes
  in its environment — but there is no representation of it in any head, and often
  nobody who could supply one. Call these free-floating rationales: reasons without
  reasoners.


  The standard treatments are, roughly: (i) eliminativism — it''s just a useful façon
  de parler and everything real is stated in non-teleological terms; (ii) full-blooded
  realism — the intentional stance latches onto genuine facts about the system, so
  a rationale doesn''t need a reasoner any more than a centre of gravity needs somebody
  thinking about it; (iii) the middle instrumentalism, where it''s true-ish and pragmatic.
  Everyone agrees about the cases. Nobody agrees about what''s going on. And the whole
  thing gets loaded up with normative work — proper function talk in medicine and
  biology, functional explanations in social science (with the familiar objection
  that they lack a feedback mechanism), and now "the model is implicitly optimising
  for X, so we should hold it/them to that".


  Here''s my hunch, and it''s the bit I want the proposal built around: the interesting
  problem isn''t whether free-floating rationales are real, it''s that there''s usually
  more than one of them available for the same system, all equally supported by the
  counterfactual structure. The mound''s layout can be read as temperature regulation
  or as a by-product of pheromone-following rules; the firm''s behaviour as profit-maximising
  or as managerially empire-building; the net''s as honesty or as sycophancy-avoidance-with-a-detour.
