  supposed to occur in infinitely many distinct facts. What makes it the same binder
  across all of them, if its whole nature is to be doing the binding here? If its
  identity is fixed independently of the fact it occurs in, we are back to role collision
  one level up. If its identity is not so fixed — if the F in Fa is a different item
  from the F in Fb — the regress is stopped, but at a cost.


  4. The cost. Name it the unity tax. Every account of propositional unity pays in
  one of three currencies: (i) primitive binding capacity — a category of entity whose
  nature is stipulated to include the job, which buys unity at the price of an unexplained
  explainer; (ii) non-identity of constituents — the binder is particularized per
  fact, which buys unity at the price of losing generality, since Fa and Fb no longer
