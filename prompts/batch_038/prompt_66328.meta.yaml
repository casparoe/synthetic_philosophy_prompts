  Let me think about the two-envelope one more carefully, because "argument that proves
  too much" fits it perfectly and there''s a rich subtle structure.


  The classic switching argument: You hold envelope A with amount a. The other envelope
  contains either 2a or a/2 with equal probability. Expected value of switching =
  (1/2)(2a) + (1/2)(a/2) = 1.25a > a. So switch. Paradox: symmetric reasoning says
  switch back.


  Proves-too-much version: The asker builds an argument that seems to show that for
  ANY pair of envelopes and ANY prior over amounts, you should prefer the envelope
  you haven''t opened — indeed, that you should prefer to be ignorant. Then: (4) By
  the same reasoning, before opening anything you should prefer the unopened envelope;
  (5) but that can''t be right, since if you switch and switch back you''re where
  you started, so a preference relation that says A≺B and B≺A is incoherent; (6) so
  the expected-value calculation must be wrong; (7) but the calculation is just the
  definition of expected value applied to a two-outcome gamble, and the definition
  of expected value is not wrong. Conclusion: something''s broken in decision theory
  itself.


  The subtlety: the flaw is that the argument treats "the amount in my envelope is
  a" as fixed while conditioning on it, whereas the total pair of amounts isn''t fixed
  across the two cases 2a and a/2 — the events "my envelope has a and the other has
  2a" and "my envelope has a and the other has a/2" are different possible worlds
  with different priors. Equivocation on whether a is a variable or a constant, and
  whether the probability 1/2 is conditional on the observed amount. Under any proper
  prior, the set of amounts for which switching is favored can''t be everything (unless
  improper prior with infinite expectation). Also: the "1/2, 1/2" assumption isn''t
  prior-independent; for bounded priors there are always amounts where you shouldn''t
  switch. And the "switching twice" no-arbitrage constraint. And the deeper point:
  the paradox only bites for improper priors (e.g., uniform over all powers of 2),
  where expected values are infinite and comparisons break down.


