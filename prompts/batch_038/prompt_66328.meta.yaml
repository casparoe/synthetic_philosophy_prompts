  a contradiction from the switching argument applied twice, showing the switching
  argument is unsound even for someone who has not opened the envelope. And add a
  specific numeric prior — e.g., a prior where the smaller amount is 2^n with probability
  proportional to (2/3)^n — the classic unbounded-prior case where you should always
  switch and yet the double-switch argument still applies. Then the asker asks: does
  the resolution require giving up the 1/2, 1/2 assumption, the expected value calculation,
  or something else, and what does each cost.


