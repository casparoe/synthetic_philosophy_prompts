  Draft:


  You are to work as a philosopher of physics with substantial experience in the foundations
  of statistical mechanics and the thermodynamics of information, and as someone who
  has taught this material to graduate students many times. Please think carefully
  and treat this as a design problem rather than a retrieval problem.


  Context. I teach a graduate seminar whose students have one term of classical statistical
  mechanics and one of information theory, but no exposure to the secondary literature
  on Maxwell''s demon. I am preparing a single-page handout for one session, and the
  session''s purpose is diagnostic: I want each student to be able to work out, from
  their own answers to well-posed questions, which resolution of the demon they are
  implicitly committed to — and to notice when two students who think they disagree
  are in fact answering the same questions in the same way.


  Our department''s habitual presentation of this material collapses the debate into
  a two-way choice between "the compensating cost is paid when the demon''s memory
  is erased" and "there is no cost anywhere; the second law is only a high-probability
  generalization." I think that is badly under-described, and I want the handout to
  break the logical space open more finely than that.


  Deliverable. Design a decision tree that begins from a fixed starting commitment
  — the student accepts that a Szilard-style one-molecule engine can be constructed
  and cycled, and accepts that the second law, in some form, is true — and terminates
  in a named position on how the demon is exorcised. Requirements:


  1. Between six and nine branch nodes. Each node must be a question the student can
  answer from physics and philosophy alone, without knowing which position any answer
  leads to. So the nodes may not be phrased as "do you accept Landauer''s principle?"
  or "are you an Everettian about entropy?"; they must be phrased as substantive questions
  about where in the cycle the compensating cost falls, what quantity is doing the
  accounting (thermodynamic entropy of the gas, Gibbs or Shannon entropy of a distribution
  over microstates, mutual information between the demon''s record and the gas, or
  something else), where the boundary of the system of interest is drawn, whether
  the resolution needs a special low-entropy condition on the early universe, whether
  it generalizes to every conceivable demon or only to the cases examined, and whether
  it survives the demon being replaced by a device with no representational states
  whatever — a ratchet and pawl, a semipermeable membrane, a mechanical governor.


