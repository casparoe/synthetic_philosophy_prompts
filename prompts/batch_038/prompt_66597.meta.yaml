  The invented summary (mostly right, with 1-2 subtle misrepresentations):


  "Dennett''s Aunt Hillary thought experiment asks you to imagine a woman whose neurons
  are ants — sixty billion or so, marching through her skull in traffic patterns that
  play the role her neural firing would. Stub her toe and she complains; ask her what
  she believes and the answer is written in the colony''s fugue-like traffic. The
  point is that her beliefs aren''t in any ant, and no ant knows anything about her;
  the beliefs are patterns in the colony as a whole. So the level at which a mind
  exists is a free choice of the interpreter: if you want beliefs, look at the traffic;
  if you want chemistry, look at the ants. Both descriptions are equally true because
  neither is more real. Dennett draws the obvious consequence: anything whose parts
  are too dumb to have beliefs can still have them, provided the whole is integrated
  enough. That is exactly why the objection to large language models — that they are
  ''just'' predicting tokens, that no part of them understands anything — is the same
  mistake as saying Aunt Hillary has no beliefs because no ant does. The tokens are
  the ants. Once you see this, the question whether a model believes or wants something
  is settled by asking whether treating it as a believer pays off predictively, and
  it does; so models have beliefs, and there''s no principled difference between their
  having beliefs and ours."


  Misrepresentations embedded:

  1. "the level at which a mind exists is a free choice of the interpreter" / "neither
  description is more real" — Dennett''s "real patterns" view is precisely that some
  patterns are more real (more projectible/predictively indispensable) than others;
  he''s an anti-instrumentalist realist about real patterns, though the stance is
  interest-relative. Saying both descriptions are "equally true because neither is
  more real" is a distortion: it turns a claim about predictive indispensability into
  flat relativism.

  2. "anything whose parts are too dumb to have beliefs can still have them, provided
  the whole is integrated enough" — overstates: Dennett requires that the intentional
  stance earn its keep; complexity/integration alone isn''t the criterion; and there''s
  the question of competence/comprehension and the requirement of a certain organizational
  sophistication (and Dennett himself is cautious about which systems qualify).

  3. The token/ant analogy: the ants in Aunt Hillary are causally constitutive of
  her behavior in a way that implements a specific functional organization with causal
  closure; tokens are outputs, not the substrate — the disanalogy is that the "parts
  too dumb" in an LLM are not the tokens but the parameters/flops, and the system
  lacks the counterfactual-supporting, self-regulating organization (e.g., no ongoing
  metabolism-like self-maintenance, no ability to be wrong about its own states in
  the right way, no unified behavioral dispositions across contexts). Also, the Chinese
  Room objection is about whether syntax suffices for semantics — a different issue
  from levels confusion; treating Searle''s argument as "the same mistake" is a conflation.
  Also Block''s Chinese Nation is about qualia/consciousness rather than beliefs,
  and Dennett''s argument (in this thought experiment) is about belief-ascription,
  not about consciousness.

  4. "the question whether a model believes is settled by asking whether treating
  it as a believer pays off predictively, and it does" — Dennett does say the intentional
  stance''s warrant is predictive payoff, but he also insists on the requirement of
  "competence without comprehension" being organized in the right way, plus a degree
  of rationality/consistency (the "true believer" is an idealization; real systems
  are only imperfectly rational, and the stance is applied ceteris paribus). Also,
  "it does pay off" is an empirical claim the author asserts without argument.

  5. "there''s no principled difference between their having beliefs and ours" — conflates
  Dennett''s continuity thesis (the intentional stance applies across the board, from
  thermostats up — he does discuss thermostats!) with the claim that there is no principled
