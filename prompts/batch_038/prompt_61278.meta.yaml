  ---


  I am a novelist at work on a third book, and I need a piece of philosophical engineering
  rather than prose advice.


  The premise: my narrator, a woman in her sixties who has spent forty years restoring
  damaged silent film for an archive, has arrived — without reading a page of philosophy
  — at something close to Berkeley''s idealism. She cannot shake the conviction that
  the reel in the vault across town, in its canister, in the dark, on a night when
  no one has looked at it, is not there in the way she is there. Late in the novel
  she devises a test on herself: an attempt to catch herself in the act of thinking
  of something that is not being thought of. I want the reader to be able to see,
  from inside her head, both that the test is serious and that it fails — or that
  it succeeds, if you can build one that does.


  What I need from you is a thought experiment, to specification, that I can set in
  a scene.


  Specifications:

  - Ordinary world... [list]


  Let me write out the list:


  1. A single scenario, no more than about 250 words, in a workaday setting (a house,
  an archive, a road, a shop), with no supernatural machinery, no science fiction,
  no laboratory instruments she could not plausibly own.

  2. The scenario must be a test she performs on herself, in real time, and it must
  be one she could describe aloud in a kitchen to a friend without either of them
  losing the thread. Prose, not notation.

  3. It must engage what commentators call Berkeley''s master argument — the challenge
  to conceive of a sensible thing existing unconceived, and the claim that the attempt
  defeats itself, since whatever one frames in the act of framing it is thereby conceived.
  State the argument yourself in your analysis; I do not want the scene to contain
  a summary of it.

  4. God is not available. The case must retain its force for a reader who refuses
  to allow an omnipresent perceiver into the furniture. Do not solve the problem by
  divine observation, and do not let the analysis lean on it.

  5. The usual escapes must be closed off. The object in question may not be something
  she remembers, something she expects to encounter again, something another person
  is presently attending to, or something whose traces — a dent, a log entry, a frame
  of film — are available to her. No tree in the quadrangle while she walks away.

  6. A realist and a Berkeleyan must give divergent verdicts on the same question,
  namely: has she, in that moment, conceived of a thing existing unconceived? The
  realist answers yes and means it; the Berkeleyan answers no — and the no must rest
  on something other than the observation that she is conceiving it right now. If
  your analysis can only produce that retort, say so and tell me the specification
  cannot be met.

  7. It must be possible for her to be sincere and wrong, and possible for the reader
  to see how.


  Deliverable: the scenario; then a check against each specification, stating plainly
  which theory delivers which verdict and why; then an account of which single feature
  of the case is doing the work — I expect the answer to have something to do with
  what it is she has managed to frame, and whether what she has framed is a determinate
  object or only a general description masquerading as one, but do not take my word
  for it; then what happens to the case if that feature is removed, and whether it
  collapses into the stock examples; then the sharpest attack a careful Berkeleyan
  would mount, with the best reply available to me; and finally your honest verdict
  on whether a case satisfying all seven constraints exists, and if not, which constraint
  has to go and what the nearest achievable version looks like.


  One more thing: I would rather be told that the design fails than be handed a scene
  that cheats — that stipulates the verdict instead of generating it from the two
  positions.


