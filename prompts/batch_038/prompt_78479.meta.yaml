  as selection, not experience) — this imports the claim that consciousness = being
  selected, which conflates attention and consciousness (Koch & Tsuchiya''s dissociation
  argument; also Block''s claim that A and P can come apart).

  - A theatre is a designed artefact with a purpose: broadcasts are for an audience
  to use. This imports functional/teleological framing — access is for use in reasoning
  and action. Phenomenology has no such role in the metaphor.

  - The audience is a collective of many, so the metaphor naturally fits "broadcast
  to many modules" — but a broadcast to many receivers is precisely an access notion.

  - The metaphor makes consciousness look like a property of contents (what''s on
  stage) rather than of the subject — so it has trouble with background/mood consciousness,
  the sense of presence, the "field" of experience, which isn''t a content in the
  spotlight. GWT does have "context systems" backstage for this, which is a bit of
  a stretch.

