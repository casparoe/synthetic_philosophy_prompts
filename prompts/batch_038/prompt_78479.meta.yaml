  by the audience but by an unstated identity between broadcasting and feeling — in
  which case the metaphor is a mnemonic for the identity rather than evidence for
  it? That''s the key: the analogy smuggles in the conclusion (that access = phenomenology)
  because a theatre is intelligible to us only as a place where someone is present
  to the show; when we imagine the broadcast, we automatically imagine the felt presence.
  That''s a strong "what the source quietly imports" point.


