  Small issues: "r is the probability that a gene in the recipient is identical by
  descent to the one in the actor" — this is a common sloppy gloss; r is a regression/coefficient
  of relatedness, not a probability of identity by descent (that''s closer to a specific
  definition for particular pedigrees but generally it''s a regression). That''s a
  nice subtle technical slip that a hasty grader would let slide. Also "what was being
  selected was a gene whose copies were concentrated in the beneficiaries" — fine.


  Para 3: Sober & Wilson. "Sober and Wilson''s multilevel selection framework is usually
  advertised as a revival of group selection, and in a narrow sense it is: they build
  explicit trait-group models where selection happens both within groups and between
  them, and they show that altruism can spread when between-group differences are
  large enough relative to within-group free-riding, which is structurally Hamilton''s
  condition again. But the deeper claim they make — and this is the part people miss
  — is that kin selection theory is not a rival to group selection theory but a special
  case of it: any model that uses relatedness to explain a trait can be rewritten
  as a trait-group model, and vice versa, because relatedness just measures how much
  groups differ from one another in the frequency of the type. Once you can translate
