  Student answer (write it well, mixed, 3 paragraphs):


  Para 1: "Williams''s argument, as Dawkins restated it, is basically an argument
  from parsimony plus an argument from mechanism. The group-selectionist says a trait
  evolved because it''s good for the group, but for that to work the group has to
  be a reproducing unit in something like the way an organism is, and groups mostly
  aren''t: they don''t have discrete generations, they bud and split irregularly,
  and their ''offspring'' don''t inherit the group''s properties with any fidelity.
  So group-level variation is weak, group-level heredity is weak, and even when a
  group-level benefit exists, it gets swamped. The swamping point is the important
  one — Dawkins calls it something like subversion from within — because in almost
  any group containing altruists there''s room for a selfish mutant who takes the
  benefits and pays none of the costs, and within any single generation that selfish
  type out-reproduces the altruists inside its own group. Between-group selection
  is slow because groups are few and split rarely; within-group selection is fast
  because individuals reproduce every generation. So group selection would have to
  be enormously strong to keep ahead of that, and there''s no evidence that it is.
  Williams adds the methodological rule: never invoke a higher level of selection
  than you need. Individual-level selection explains most adaptation, and gene-level
  selection is invoked only for the odd cases — meiosis, the evolution of sex, senescence
  — where the individual''s own interests don''t add up. So for Williams and Dawkins
  the gene is the only real unit of selection and the organism, like the group, is
  a vehicle: what matters is which entities get copied with fidelity, and only replicators
  qualify. Groups aren''t replicators, so strictly speaking group selection can''t
  happen — a trait that spread ''for the good of the group'' would be a contradiction
  in terms."


