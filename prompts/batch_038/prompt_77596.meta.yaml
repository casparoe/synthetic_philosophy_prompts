  Para 2: kin selection. "The phenomena that made group selection attractive were
  altruism — warning calls, sterile castes, cooperative breeding — traits that cost
  the bearer and benefit neighbours. Hamilton''s insight was that you don''t need
  groups: you need relatedness. The bearer of an altruism gene can still spread it
  if the cost to itself is outweighed by the benefit to relatives weighted by how
  likely they are to share the gene, which gives Hamilton''s rule, rb > c, where r
  is the probability that a gene in the recipient is identical by descent to the one
  in the actor, b the benefit to the recipient and c the cost to the actor. So the
  ''group'' in group-selection stories was really just a kin cluster, and the group''s
  welfare was never doing any causal work; what was being selected was a gene whose
  copies were concentrated in the beneficiaries. Dawkins''s point is that this isn''t
  a different mechanism from ordinary natural selection, it''s the same gene-frequency
