  Question: "Williams and Dawkins argued that appeals to group selection should be
  eliminated from evolutionary biology in favor of selection at the level of the gene
  (and, for many purposes, the individual). (a) Reconstruct their central argument
  against group selection. (b) Explain how kin selection / inclusive fitness was supposed
