  joy from actual increase in power? (3) does the part/whole (localized pleasure)
  distinction carry the weight? (4) would internalizing the reward source — an agent
  that generates its own reward without a lever — count as "being an adequate cause
  of its own affects," i.e., as activity/freedom, thereby converting bondage into
  something like blessedness? That last one is a killer question and maps onto the
  real AI-safety question about whether the problem is external tampering or the structure
