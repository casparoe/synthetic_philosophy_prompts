  (1) Tolstoy: a work is art iff the artist, by external signs, transmits a feeling
  he has experienced, and the audience is infected by that feeling.

  (2) Infectiousness comes in degrees; the more infectious, the better the art (as
  art).

  (3) The most infectious artifacts in the modern world are pop songs, advertisements,
  and blockbuster films — they reliably transmit feelings to millions.

  (4) So these are the best art (as art).

  (5) Tolstoy calls most of them counterfeit art or bad art.

  (6) But "bad art" is art; counterfeit art is not art. Tolstoy says the feelings
  in counterfeit art are not genuinely transmitted, only simulated — so the criterion
  must be sincerity, not infectiousness.

  (7) Yet sincerity is not observable; the only evidence for sincerity is that the
  audience is infected.

  (8) So the criterion is either circular or it collapses into infectiousness, and
  Tolstoy cannot condemn the things he wants to condemn.


