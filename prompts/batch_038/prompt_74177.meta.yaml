  with a different spirit? The Letter Spirit model says: a letterform (e.g., ''a'')
  can be realized in many fonts while remaining the same letter, and what makes it
  the same letter is not a fixed set of features but a family of constraints/flexibilities;
  and "style" is a higher-order pattern across letterforms within a font. So the analogy:
  Menard''s text is the same letterform, but the "font" (context, authorial style)
  differs; the Letter Spirit program would say that style is not additive on top of
  the letter but is inseparable — a font''s identity is constituted by how each letter
  is realized. Then: does Borges''s story vindicate or refute the claim that the same
  string can instantiate different works? And where does the analogy break: letters
  are recognized across fonts by a shared abstract structure, whereas Menard''s text
  is identical, so there''s no "flexibility" being exercised at all — the variation
  is entirely in the reader/context, not in the realization. That''s a sharp point:
  in Letter Spirit, sameness of letter across fonts is a matter of variation in the
