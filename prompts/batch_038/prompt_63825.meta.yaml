  Meaning-of-life design target: Construct a case in which Nagel''s account and Camus''s
  account of the absurd give *opposite* verdicts about whether a life is absurd, with
  constraints: realistic, one paragraph, no cosmic-scale or sci-fi apparatus (no omniscient
  narrators, no immortality), and the person must be fully reflective (so the verdict
