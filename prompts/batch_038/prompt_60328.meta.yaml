  Option: Rawls''s veil of ignorance and the difference principle — summary type.
  There''s a well-known misreading: that the difference principle requires maximizing
  the position of the worst off in every respect, that inequalities are only permitted
  if they benefit the least advantaged, and the famous conflation of "the veil of
  ignorance justifies the difference principle" vs. the two principles'' lexical ordering,
  primary goods, the maximin argument being heuristic rather than deductive, "justice
  as fairness" not being about actual agreement, and the fact that Rawls''s difference
  principle concerns expectations of the least advantaged social position (representative
  man), not identifiable individuals, and that it doesn''t apply to particular transactions.
  Also the "talents are morally arbitrary so nobody deserves their share" — Rawls
  later said the difference principle doesn''t depend on a rejection of desert entirely;
  also that Rawls is not an egalitarian about outcomes. And the veil: parties don''t
  know their conception of the good... actually they do know they have one but not
  its content; they don''t know their place in society, natural assets, generation
  (well, they know the circumstances of justice, general facts about society — the
  "strict compliance" assumption). A popular summary might say "you know nothing at
  all" — but Rawls explicitly says the parties have general knowledge (of psychology,
  economics, political sociology). That''s a nice subtle error.


  Alternatively Burkean conservatism and Chesterton''s fence: A summary might conflate
  Chesterton''s fence with the precautionary principle, or say Burke endorsed it (Chesterton
  wrote in 1929, "The Thing: Why I Am a Catholic" — actually the fence appears in
  The Thing, 1929), or that Burke''s view is just "don''t change anything," ignoring
  Burke''s "a state without the means of some change is without the means of its own
  conservation." That''s a great subtle misrepresentation: the popular gloss treats
  Burke as a pure status-quo conservative while Burke explicitly argued change is
  necessary for conservation. Also Burke''s appeal to prescription and prejudice as
  repositories of tacit knowledge, and his distinction between reform and innovation
  (he defended the Glorious Revolution settlement). Also that Burke opposed all reform
  — he supported Catholic emancipation, impeachment of Hastings, conciliation with
  America.


  But maybe more interesting and less regurgitable: Aristotle on money and exchange.
  Nicomachean Ethics Book V, on justice in exchange, reciprocity (antipeponthos),
  the role of money (nomisma) as a conventional measure that makes things commensurable
  "in a way," and Politics Book I on chrematistics, the distinction between natural
  acquisition (oikonomia) and unnatural money-making, and the claim that interest
  (tokos) is "most unnatural" because money breeds money. A popular summary might
  say Aristotle thought money was intrinsically barren and hence all profit is theft,
  or that he held the labor theory of value (he doesn''t — he says true commensurability
  is impossible and money is a conventional substitute for need/demand), or conflate
  "money is sterile" (a claim about interest specifically) with a condemnation of
  trade generally, or that Aristotle endorsed just-price theory (that''s Aquinas/Scholastics,
  arguably). Also he says exchange must be in proportion, not equal — reciprocity
  in the state holds together by proportionate requital, and the cross-diagram of
  builders/shoemakers: house:shoes. A common misreading is that Aristotle proposed
  a "fair price" formula or that he thought goods must be exchanged in equal amounts.


