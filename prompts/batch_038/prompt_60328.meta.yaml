  the criteria are group-relative: what counts as good art depends on who is making
  it and for whom, so there are no standards common to all artists. [Subtle misrepresentation
  / an interesting one: Du Bois did argue the situation of Black artists generates
  specific obligations, but he also appealed to universal standards of beauty and
  truth — he invokes Cologne Cathedral, Venus de Milo, a phrase of Southern music,
  as equally beautiful; he wants "the right to be an artist" and to be judged by the
  same standards while also saying art must serve the fight. So a claim of thoroughgoing
  relativism is wrong; but the "situated obligations" part is right. This is a nice
  nuance to audit — it''s a conflation of "the obligations of artists differ by situation"
  with "the standards of artistic evaluation differ by group."]


