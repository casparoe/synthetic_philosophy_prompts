  Last month I read a long essay in a general-interest magazine about the current
  wave of commissioned activist art — housing-campaign murals, advocacy documentaries,
  gallery shows organized around a single policy demand. The critic''s argument turned
  on W. E. B. Du Bois, and he summarized Du Bois''s aesthetics, drawing mainly on
  the 1926 lecture "Criteria of Negro Art" and on Du Bois''s years editing The Crisis,
  roughly as follows:


  "Du Bois''s starting point is descriptive rather than programmatic: every artwork,
  whether or not its maker intends it, presents a picture of what the world is like
  and of who in it counts as fully human, so there is no such thing as art standing
  outside politics. The doctrine of art for art''s sake is not a retreat from propaganda
  but a variety of it — one that endorses things as they are. From this Du Bois drew
  a practical conclusion: when a people are under attack, the first question about
  their art is whether its picture of them is on the right side of the fight, and
  questions of form, craft, and finish are secondary — they may be set aside while
  the emergency lasts. This is why he urged Black writers and painters to put dignified,
  accomplished, upright lives at the center of their work and to leave poverty, crime,
  and sexual frankness out of it, since a hostile white public would seize on any
  such material as confirmation of its stereotypes. And because these obligations
  arise from a group''s situation, Du Bois treated the standards of art as group-relative:
  what makes a work good depends on who made it and for whom. Read this way, Du Bois
  provides a ready-made defense of today''s advocacy art. A mural commissioned by
  a housing campaign need not be assessed as art at all, only as messaging; and the
