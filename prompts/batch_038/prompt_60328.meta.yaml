  is whether its message is on the right side; craft, form, and beauty are secondary
  and can be set aside when the cause is urgent. [Subtle misrepresentation: overstatement.
  Du Bois insisted that propaganda must also be beautiful and true; he wanted beauty
  for its own sake, argued that Black folk had been "choked away from" beauty and
  that beauty matters hugely; he cared about art qua art. Also he distinguished the
  work''s aesthetic achievement from its message.]


  (c) Du Bois therefore urged Black artists to present only uplifting, dignified images
  and to leave out anything sordid, criminal, or sexually frank, because a hostile
  audience would seize on it. [Subtle misrepresentation: conflates Du Bois''s position
  with the respectability-politics censorship he criticized — he insisted on truth
  including unflattering truth, and criticized both white gatekeepers'' demand for
  exoticism/ stereotype and Black middle-class "puritanism." Good.]


