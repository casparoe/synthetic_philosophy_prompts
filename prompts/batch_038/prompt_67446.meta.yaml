  only *my* omission counts, in which case the difference must come from something
  other than the absence itself, namely from the fact that I had a duty/role/normal
  expectation. So it seems like the counterfactual theorist has to admit that causation
  is not a two-place relation between events at all but depends on our interests and
  on which absence we pick out as salient. Doesn''t that mean the whole project of
  giving a metaphysics of causation was misguided from the start — that there''s no
  such thing as causation, only patterns of counterfactual dependence indexed to a
  context and a choice of contrast?"


  The false presupposition: the asker assumes that accepting omissions as causes commits
  you to *all* the absences being causes, and that this forces a subjectivist/conclusion
  "there''s no such thing as causation." A good answer would correct: (i) the field
  distinguishes causation from causal explanation/salience; (ii) many theorists deny
  that absences are causes at all (they''re "quasi-causes", quasi-dependence — David
  Lewis''s own view in "Causation as Influence"/the 2000 paper: he said omissions
  are not causes but there is causal *dependence*; actually Lewis in "Void and Object"
  (2000) and "Causation as Influence" says absences aren''t events, so no causation
  by absence, but we still have counterfactual dependence, and he treats "the omission
  caused the death" as loose talk / "quasi-causation"). (iii) The contrastive approach
  (Schaffer: causation is contrastive: c rather than C* causes e rather than E*) dissolves
  the profligacy problem by making the relata contrastive facts, and the "normality"
  parameter is handled by the contrast selection, not by interest-relativity of truth.
  (iv) Even if causal claims are interest-relative in *what they say* (salience),
  that''s a claim about explanation, not evidence that causation doesn''t exist —
  the inference from "our causal talk is context-sensitive" to "there is no such thing
  as causation" is a non-sequitur (compare: indexicals/context-sensitivity of ''tall''
  doesn''t show there''s no such property). (v) Also the moral-responsibility slide:
  causal contribution ≠ moral responsibility; the PM''s omission causing the death
  doesn''t make the PM blameworthy — the asymmetry comes from duties/normative roles,
  and that''s a separate question from metaphysics. (vi) Also the "problem of profligate
  omissions" is standard, and there are technical fixes: the distinction between causes
  and conditions/background conditions (Mill), the "default vs. deviation" distinction,
  etc.


