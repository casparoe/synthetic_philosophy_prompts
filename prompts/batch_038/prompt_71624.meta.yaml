  Let me design the SSA/SIA adjudication carefully:


  Scenario: A departmental reading group discussing Bostrom''s anthropic Bias. Two
  members (call them R and M, or names).


  Round 1: One says the presumptuous philosopher objection defeats SIA: given two
  theories equally supported a priori, one predicting a trillion observers and one
  predicting a trillion trillion, SIA forces you to accept the latter without evidence;
  that''s absurd, so SSA.

  Round 2: The other says the objection only looks compelling because it smuggles
  in the assumption that a large prior shift requires "empirical evidence" — but ordinary
  conditionalization on any evidence does the same thing; the "philosopher" isn''t
  reasoning presumptuously, just updating. Actually that''s not quite the right reply.
  Standard SIA replies: (a) the objection proves too much — it also implies you should
  ignore the doomsday argument, which the SSA person wants; (b) the intuition against
  "presumption" rests on a confused conception of evidence: indexical/self-locating
  information IS empirical information about the world; (c) SSA''s own consequence
  is the doomsday argument, which is far more presumptuous — it lets you conclude
  the human race will end soon from your birth rank alone; (d) reference-class problem:
  SSA''s answer depends on arbitrary choices of reference class, whereas SIA can be
  motivated as what you get from a "God''s-eye"/centered-universe prior.

  Round 3: First replies: the doomsday argument isn''t equally objectionable — it
  moves credence by a modest factor while presumptuous philosopher moves it by 10^12;
  and SSA can block DA by restricting the reference class or by adopting the "no-presumption"
  variant (SSA with the self-indication-neutral constraint). Also the SIA proponent
  must explain why the shift to the larger theory isn''t exactly the kind of reasoning
  we reject in other domains — e.g., "the theory that says there are infinitely many
  planets like Earth elsewhere is favored simply because it makes observers more likely"
  — which is fine actually.

  Round 4: Second says: then the disagreement reduces to a bare clash of intuitions
  about what one''s "situation" licenses, and each side just re-describes the same
  update as either legitimate conditionalization or illegitimate presumption.


