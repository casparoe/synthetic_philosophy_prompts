  The exchange:

  1. T. presses the presumptuous philosopher objection against SIA: stipulate two
  cosmological theories, a priori equally likely — T1 says exactly one trillion observers
  will ever exist, T2 says one trillion trillion — and suppose we can settle which
  by nothing but the fact that we exist. SIA hands T2 a trillion-to-one posterior
  with no observation at all. That''s not evidence; it''s metaphysical bootstrapping.
  So SIA is false.

  2. W. replies: the objection assumes that indexical information is not evidence,
  which is precisely what''s in dispute. Learning that you exist is learning something
  about the world — a world with more observers makes your existence likelier — and
  if that''s illegitimate, ordinary conditionalization on self-locating facts (which
  day it is, that you''re awake now) is illegitimate too. And the objection proves
  too much: it rules out any update driven by the fact of one''s own existence.

  3. T. counters: but then SSA is no better, since it delivers the doomsday argument
  — so the real question is which absurdity is smaller. He claims the SIA absurdity
  is quantitatively worse: a shift of 10^12 versus a shift in the expected total number
  of humans by a factor of order tens. So the two objections aren''t symmetric.

  4. W. responds: size isn''t the relevant metric; the doomsday conclusion is drawn
  from data you actually have (your birth rank), whereas the presumptuous philosopher''s
  conclusion is drawn from nothing at all. Also, she notes T.''s SSA can be restricted
  by reference class choice to block DA, but that same flexibility means his "SSA"
  is not a determinate theory — and if you tune the reference class to block DA you
  will in general also change the presumptuous-philosopher verdict, so his case against
  SIA doesn''t isolate SIA.

