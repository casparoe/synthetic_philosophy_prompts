  Draft:


  "I''m preparing a seminar session that pairs Borges''s ''Pierre Menard, Author of
  the Quixote'' with the debate over original versus derived intentionality — Searle''s
  insistence that texts and programs have only content borrowed from the minds of
  their users, against Dennett''s two-bitser, whose point is that a physical state''s
  content is fixed by nothing intrinsic to it but only by its causal embedding and
  by the interests of whoever reads it. Menard seems to hand Dennett the perfect exhibit:
  the pages he produces are, by stipulation, mark for mark identical to Cervantes'',
  and the narrator nonetheless reports them as meaning something different and more
