  Now the philosophical lens: original vs. derived intentionality. Key elements:

  - Searle: mental states have intrinsic/original intentionality in virtue of the
  biological causal powers of the brain; syntax is not sufficient for semantics; texts,
  computers, thermostats have only derived intentionality, which is parasitic on the
  intrinsic intentionality of observers/users. Chinese Room argument (1980).

  - Dennett: the original/derived distinction is bogus — or rather, intentionality
  is always a matter of the interpretive stance; the "two-bitser": a device with two
  internal states which counts as a detector of a quarter (or of a dollar) relative
  to how it''s embedded in a larger system; the very same physical state can be a
  representation of X in one context and of Y in another; there''s no intrinsic content,
  only content-relative-to-an-interpreter-and-to-a-design-history. In *The Intentional
  Stance*, Dennett argues derived/original collapses: all intentionality is, in a
  sense, derived, because content is ascribed from the outside; and in another sense
  original, because the ascription tracks a real functional/teleological role shaped
  by evolution or design.


