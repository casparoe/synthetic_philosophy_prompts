  Draft:


  Paragraph 1 (framing + the core request):

  "I''m putting together a seminar reading on bounded rationality, and the discussion
  keeps sliding back to a defensive reading of Herbert Simon: satisficing is what
  you do when maximizing is too expensive — a second-best accommodation to search
  costs, fatigue, and deadlines. I want to test whether that reading is compulsory,
  and for that I need a counterexample built to order. Construct a thought experiment
  in which a satisficer makes a strictly better decision than a maximizer, where the
  advantage cannot be traced to any cost of searching. State the scenario in a single
  paragraph. Constraints: the setting must be an ordinary organizational one — a charity
  allocating its fundraising budget across donor-acquisition channels, a county health
  department splitting an outreach budget across clinics, a department store ordering
  inventory across suppliers — and it must not be a financial portfolio, since the
  equal-weighting-versus-optimized-allocation result is the version of this everyone
  already knows. Both agents must have exactly the same data, the same (unbounded)
  computational capacity, and no time pressure; searching further must be genuinely
  free. The maximizer must not be a strawman: it has a well-defined utility function,
  it reasons correctly by expected utility, and it uses all the evidence in the case.
  The satisficer must operate with a fixed aspiration level that was set earlier,
  for reasons unrelated to the current cycle, and must simply accept the first option
  or allocation that clears it. And the satisficer''s victory must not be luck: the
  same structure has to deliver the same verdict across repeated cycles of the decision,
  not just in the instance you describe."


  Paragraph 2 (the demonstration + the hard part):

  "After the scenario, show the work. Say exactly what each agent computes and what
  each ends up doing; identify the specific step in the maximizer''s calculation that
  goes wrong; and name the feature of the case that does the work — I suspect it will
  be something about the ratio of noise in the estimates to the number of options
  competing to be selected, but I want your account, not mine. Then run the checks.
  What happens if that feature is removed — if the estimates are precise, or if there
  are only two channels, or if the environment is stationary and the sample is huge?
  Does the case collapse back into a mere search-cost story at that point, or does
  something of the satisficer''s advantage survive? Is the satisficer winning because
  it is doing something right, or because it is doing something less wrong?"


  Paragraph 3 (the objection + the payoff):

  "Finally, take the objection seriously, because it is the one that decides whether
  the case is any good. A defender of maximizing will say the maximizer I asked for
  was under-specified: a maximizer who properly represented its own uncertainty about
  the estimates — shrinking them toward a prior, or maximizing over a set of plausible
  models rather than a point estimate — would not fall into the trap, and would in
  fact end up behaving very much like the satisficer. Lay out that reply, say whether
  it defeats the case or concedes it, and if it concedes it, say what is left of the
  satisficer''s achievement: is the aspiration-level rule a crude but effective stand-in
