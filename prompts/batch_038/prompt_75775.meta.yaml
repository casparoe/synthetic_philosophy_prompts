  Proposal sketch ("order-typed instantiation" / "the regress is blocked by typing"):

  - Bradley: if aRb requires a further relation R₁ tying a, R, b together, then R₁''s
  application requires R₂, etc.

  - Standard reply: instantiation isn''t a relation; concepts are unsaturated; the
  arrangement of the signs does the work.

  - My novel move: The regress only gets going if instantiation is *order-insensitive*
  — i.e., if the tie that binds a, R, b is itself a thing that must be related. I
  claim the tie is instead an *operation with a fixed arity-and-order signature*:
  to apply R to a and b is to perform a step that is essentially R-to-a-to-b, and
  the purported next relation R₁ in Bradley''s chain would have to be a different
  operation with a different signature. Since the signature is not something that
  can itself be an argument of an operation of the same signature, the chain is not
  merely non-terminating but *ill-formed after the first step*: step 2 would require
  R₁ to take, among its arguments, a sign for the very operation performed at step
  1, but operations can only take objects/concepts of lower or matching type as arguments,
  never their own type. So Bradley''s regress is blocked not by denying that there''s
  a tie, but by denying that ties can be tied — a "no self-application of the tying
  operation" principle, structurally like a ban on self-membership.

  - Then a further novel claim: I claim this makes the regress *vicious* in a precise
  sense: the chain isn''t an infinite sequence of well-formed items whose non-termination
  is harmless; each item after the first is ill-formed, so there''s no regress to
  run. And I claim viciousness = ill-formedness rather than non-termination.

