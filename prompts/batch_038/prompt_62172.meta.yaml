  Chinese famine of 1959–61 rather than on Bengal 1943, on the grounds that Bengal
  invites students to think the whole issue is about "there was enough food but it
  was distributed wrongly." I want you to work with that constraint but be explicit
  about where it creates problems, since in the Chinese case there was a genuine collapse
  in food production as well as procurement, migration restriction, and information
