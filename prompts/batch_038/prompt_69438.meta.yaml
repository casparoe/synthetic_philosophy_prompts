  I lead people analytics at a mid-sized employer. Twice a year we field an engagement
  survey, and the report we publish to leadership includes a breakdown by generation
  — Baby Boomer, Generation X, Millennial, Generation Z — which we derive for each
  respondent from their date of birth, using a standard set of cut years. We report
  average engagement scores, intention to leave, and perceived fairness of manager
  ratings by generation, and our learning-and-development team designs programs around
  what the breakdown shows. Two features of this have come to bother me, and I cannot
  tell whether they are practical complaints or philosophical ones.


  The first is that our own policy elsewhere forbids reasoning from date of birth.
  Age is treated by our legal department as a protected characteristic that must not
  enter employment decisions at all, and our job-posting and promotion workflows are
  built to keep it out. Yet here we compute a variable that is a deterministic function
  of date of birth, publish group averages derived from it, and hand those averages
  to the same people who make staffing decisions. Nobody involved sees a tension.


  The second is arithmetic. Our Boomer respondents were all born within a nine-year
  window and are all, in any given survey year, within a nine-year age window; our
  Gen Z respondents are all in their twenties. Every difference we report is therefore
  simultaneously a difference in age, a difference in the period in which it was measured,
  and a difference in birth cohort — and I have been told, without fully following
  why, that data of our kind cannot separate those three, since knowing any two of
  them fixes the third.


  With that in place: what does this dashboard presuppose about generations as a kind
  of thing? Does it commit us to the claim that birth-year cohorts are genuine kinds
  whose members share stable psychological or motivational properties, or is it compatible
  with the buckets being merely useful fictions for targeting communications? Which
  rival views does the practice quietly rule out — in particular, what does it exclude
  about whether the differences belong to people because of when they were formed,
  because of how old they are, or because of what is happening to everyone right now?
  Does it presuppose that the boundaries at the cut years are sharp rather than vague,
  given that a respondent born in December and one born in January land in different
  buckets and are reported as differently motivated? And what does it presuppose in
  computing the category from a date rather than asking respondents which generation
  they take themselves to belong to?


  Separately: is the age tension real? Does treating generation as a legitimate analytic
  variable while treating age as off-limits require a claim about what generation
  is — that it is something other than age in disguise — and can the practice supply
  one, or is it merely consistent with such a claim? Finally, tell me what would have
  to change in the dashboard, in the numbers we report, and in how L&D uses them,
  if we replaced the implicit view with the strongest available rival.


