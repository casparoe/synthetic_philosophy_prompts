  Structure of the ask:

  - Setup: I spent forty years in experimental physics / or "I ran a laboratory in
  condensed matter physics"; recently turned to decision theory. Keep it brief, one
  clause.

  - Name the theory: Ellsberg''s two-urn result and ambiguity aversion; the standard
  Bayesian rejoinders (a second-order prior over urn compositions; or the claim that
  the choice itself conveys information).

  - Name the episode: the 2007–2009 U.S. credit crisis, and specifically the 2009
  stress tests (SCAP) as a policy intervention aimed at ambiguity.

  - Supply the facts: August 2007, BNP Paribas halted redemptions on three funds,
  saying liquidity had evaporated in parts of the U.S. securitization market so that
  certain assets could not be fairly valued (paraphrase). February 2009: Fed + other
  agencies tested the 19 largest U.S. bank holding companies (those with ≥$100bn assets,
  ~two-thirds of U.S. banking assets) under an adverse macro scenario; results published
  in May 2009; the adverse scenario implied ~$600bn of losses over 2009–10 and 10
  of the 19 firms needed to raise about $75bn of common equity within six months;
  bank equities rallied and spreads narrowed after publication. Bernanke later described
  the exercise''s second objective as "to reduce the uncertainty about potential losses
  and earnings prospects."

  - The analytic demand: treat the stress test as an intervention on the second urn
  — a case where the *expected values* barely moved but the *composition* became publicly
  known, so the ambiguity premium should collapse. Ask: does the theory predict that,
  and did that happen?

  - Ask for the disciplined mapping: who is the decision maker under ambiguity (the
  fund manager? the money-market lender? the repo counterparty?), what is the urn,
  what are the red/black balls, what is the announced composition, and where the mapping
  fails — e.g., in Ellsberg the composition is fixed by nature and unknown only to
  the subject, whereas here it was partly made by the announcement itself and depended
  on the behavior of other agents; also here the "balls" are correlated and the draw
  is not single-shot.

  - Ask which rival explanations the episode cannot rule out: adverse selection/lemons,
  strategic complementarity and flight-to-quality coordination, and the implicit government
  backstop bundled with the disclosure (guarantee = repricing of tail risk rather
  than removal of ambiguity). Ask what the case would have to look like to discriminate
  — and whether any observable could.

  - Ask what the episode shows about the theory: does it vindicate treating ambiguity
  as a distinct object of normative and policy attention, or does it show that "ambiguity"
  is a property of disclosure institutions rather than of decision problems? Does
  it bear on whether ambiguity aversion violates Savage''s sure-thing principle in
  a way that matters? And where is the theory silent — say so.


