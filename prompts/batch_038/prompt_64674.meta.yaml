  Where does the case "test" the theory? Key analytic points I want the model to hit:

  1. Mapping: who is the decision maker facing the ambiguous urn? In August 2007 and
  2008, the fund managers and lenders facing tranches of ABS whose loss distributions
  were unknown. The red/black urn maps to... but the disanalogy: in Ellsberg, the
  composition is fixed and unknown but *knowable in principle* by a well-defined single
  probability; in finance, the composition was not fixed — it depended on the actions
  of other players (strategic), so probabilities were endogenous/reflexive. That''s
  a big disanalogy: Ellsberg ambiguity is "exogenous ignorance about a state of nature";
  Knightian financial ambiguity is partly about other agents'' behavior, hence game-theoretic.

  2. Second: the SCAP did not change the underlying asset quality or the total capital
  need much (aggregate need of $75 billion was small relative to losses already recognized
  and to the capital already injected); yet markets rallied strongly. On a pure "risk"
  (Bayesian, expected-utility) account, publishing a wider distribution should not
  increase willingness to trade — more information about a wide range can be neutral
  or bad news. On an ambiguity-averse (maxmin) account, replacing an unknown composition
  with a publicly announced, worst-case-bound scenario converts the second urn into
  the first urn, and the ambiguity premium disappears even though the expected value
  barely changed. So the episode looks like a rare *intervention on ambiguity itself*
  with risk held roughly constant — a natural experiment.

  3. But the confounds: the SCAP was bundled with an implicit government backstop
  (TARP/CAP available if private capital not forthcoming), and with a credible commitment
  to not let the large banks fail. So the rally could be a repricing of tail risk
  (guarantee), not a reduction of ambiguity. The theory cannot separate them — this
  is where the theory is silent/where the case is underdetermined.

  4. Also the disanalogy of who is ambiguous: maxmin EU is an individual-level theory;
  the freeze was a coordination phenomenon (flight to quality with strategic complementarity,
  lemons market). Ambiguity aversion at the individual level need not produce a market-wide
  freeze; and a market-wide freeze can occur with no ambiguity aversion at all (pure
  adverse selection). So the episode cannot establish that ambiguity aversion is the
  operative mechanism.

