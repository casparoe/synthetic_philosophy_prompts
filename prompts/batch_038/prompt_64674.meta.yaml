  rational response to genuinely non-probabilistic uncertainty? The SCAP''s designers
  acted as if ambiguity were a *policy target* — something that can be manufactured
  away by disclosure — which is a substantive claim: that the uncertainty was resolvable
  into probabilities with enough supervisory effort. A Knightian would say the wide
  range was real and that the SCAP''s point estimate created false precision; a Bayesian
  would say the SCAP just did the conditioning that markets failed to do. This gives
  the "what the episode shows about the theory" direction: it suggests ambiguity might
  be a property of information-processing institutions rather than of the decision
  problem — an interesting upshot (ambiguity as endogenous to disclosure regimes).

