  Scenario idea: Researchers fine-tune a model on a task and then use interpretability
  tools to check whether a circuit they identified pre-fine-tuning is still present.
  One camp says identity should be tracked by *causal/functional role* (ablation and
  patching behavior: if the same head, in the same position relative to the input,
  does the same thing, it''s the same mechanism), another camp says by *implementation*
  (weights, direction in activation space — which can rotate arbitrarily under fine-tuning
  or reparameterization), and a third says the question is ill-posed because "mechanism"
  is a coarse-grained description, not a natural kind, so identity is only relative
  to a chosen grain and purpose (e.g., whether the deceptive plan is still executed).
  Meanwhile, in practice everyone uses a mix and they report "the mechanism persists"
  without saying which criterion. Ask: what kind of disagreement is this? Verbal about
  "mechanism"? Substantive about natural kinds? Two different questions (scientific
  bookkeeping vs. safety-relevant persistence)? Would a formal criterion (e.g., a
  metric on causal graphs with a threshold) end it, or is the threshold choice itself
