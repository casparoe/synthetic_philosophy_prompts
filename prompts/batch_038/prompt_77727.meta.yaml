  preferences reverse not over time but... e.g., the phenomenon where a person, having
  committed to a precommitment device, arranges for the device to be defeasible at
  exactly the moment the future self wants to defect, so that the "resolution" is
  a resolution in name only. Or the phenomenon where the discounting literature''s
  hyperbolic curves are inferred from choices but the person reports the future as
  vivid... Hmm.


  Actually a nice one: the pattern where you describe how people "discount" not just
  temporally but in terms of how vividly they can imagine the future self, and how
  they take actions that make their future self''s akrasia harder — but crucially:
  the pattern where the person''s present self doesn''t just fail to act on the plan,
  they *revise the plan downward* so that the revision feels like a rational update
  rather than a failure. E.g., "I''ll start Monday" → Monday comes, you push to next
  Monday, but you don''t experience it as weakness because you find a new reason (you
  were tired, the plan was wrong). Each deferral comes with a fresh justification,
  so the agent never registers as akratic to themselves, and the sequence of justifications
  is never compared. That''s a real phenomenon: rationalization-driven dynamic inconsistency
  / "self-serving re-description." Is there an established concept? There''s "motivated
  reasoning," "confabulation," "adaptive preference formation" (Elster), "character
  planning" / "resolutions" (McClennen), "sophisticated vs naive agents" (O''Donoghue-Rabin),
  "preference drift", "endogenous preferences," "rationalization" (Benabou-Tirole
  model of willpower and self-deception), "the problem of the second best"? Also "akrasia
  of the second order" / Frankfurt''s second-order desires. Hmm, and "resolute choice."
  The described phenomenon might map onto "motivated reasoning + dynamic inconsistency,"
