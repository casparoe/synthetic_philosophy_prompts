  - Definition of pramāṇa as karaṇa (instrumental cause) of pramā (true cognition).\
  \ Gautama's Nyāya Sūtra 1.1.4: pramāṇāt tu sacchabdāt saccopapattiḥ — truth arises\
  \ from the pramāṇa. The prameya is the object, pramātṛ is the knower, pramiti/phala\
  \ is the result. A classic subtlety: pramāṇa is the karaṇa (instrumental cause),\
  \ pramiti (or jñāna) is the phala (result). Students often conflate pramāṇa with\
  \ pramiti.\n- Also the classical debate: is the phala (result) the cognition (pramiti)\
  \ or is the cognition itself the pramāṇa? Different commentators.\n- Nirvikalpaka\
  \ vs savikalpaka perception: Gaṅgeśa and later Navya-Nyāya; nirvikalpaka is non-conceptual,\
  \ indeterminate, and importantly it is NOT a source of doubt or error but also arguably\
  \ not directly verbalizable. A common subtle error: saying nirvikalpaka perception\
  \ is a state of pure doubt or is \"unreal/illusory\". Actually the classic Nyāya\
  \ view: nirvikalpaka perception is a genuine cognition with determinate content\
  \ but lacking the relational/qualificative structure (viśeṣya-viśeṣaṇa-saṃsarga).\
