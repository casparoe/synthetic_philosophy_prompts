  Modern physics agrees: at the level of individual quantum events there is no sufficient
  determining condition; the outcome is not fixed by anything prior. So the Peripatetic
  claim that fire burns cotton "by nature" is exactly the kind of unearned necessity
  Ghazālī denied, and physics has since withdrawn its support.


  2. Ravi: That''s a substitution. Indeterminism is not occasionalism. Ghazālī does
  not merely deny that sequences are necessary; he affirms a positive thesis — that
  every event is directly produced by an agent with knowledge and will, namely God,
  and that created things have no efficacy of their own. Quantum mechanics supplies
  no agent; it supplies a precisely law-governed probability distribution (the Born
  rule) plus, in between measurements, an evolution that is deterministic. A theory
  that tells you exactly with what probability each outcome occurs is about the last
  thing one should call an absence of natures.


  3. Helena: Deterministic evolution of the state vector doesn''t help the philosophers,
  because the state vector''s evolution yields no single outcome; and the probabilities
  are brute — nothing in the physical situation explains why this rather than that.
  A gap in physical explanation is precisely where Ghazālī''s agent is supposed to
  sit. Also, the dominant accounts of laws in the philosophy of physics — the Humean
  ones on which laws are just compact summaries of what happens and "govern" nothing
  — agree with Ghazālī that there is no necessity in nature, only regularity plus
  our descriptions.


  4. Ravi: Two errors. First, an explanatory gap is not an agent; Ghazālī''s God is
  not a filler of gaps but the ground of every sequence, and he explicitly refuses
  to rest the case on unusual events — he allows that fire reliably burns cotton and
  that our knowledge of the world survives through observation of the customary course
  of things. If Helena needs gaps, she needs Ghazālī to be a god-of-the-gaps theorist,
  and he isn''t. Second, Humeanism is the opposite shape of view: it removes modal
  talk while keeping the entire pattern of events as fundamental; occasionalism removes
  the events'' own efficacy while adding a will. A deflation of "necessity" and an
  inflation of "agency" don''t add up to the same doctrine.


