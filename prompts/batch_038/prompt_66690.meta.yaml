  The readings menu:

  1. Behavioral/data underdetermination: any finite set of past uses is compatible
  with infinitely many rules (quus). True, trivial-ish, and doesn''t threaten specification.

  2. No mental item constitutes meaning: there is no introspectively accessible state
  that fixes the rule. Radical, contentious, and it''s Kripke''s skeptical conclusion
  — but Kripke offers a skeptical solution, so it doesn''t license nihilism about
  meaning.

  3. Meaning is constituted by assertion conditions + community practice, so specification
  is possible but only relative to a community''s practices.

  4. Rule-following requires interpretation of interpretations → regress → nothing
  determines application (Wittgenstein''s regress). If true, no specification works
  — but this reading is exactly what the "practice" response blocks.

  5. "You can''t mean something determinately" (meaning skepticism/eliminativism)
  — the reading the friend needs, and it''s not what Kripke endorses (Kripke''s skeptic
  is answered by the skeptical solution; also Kripke himself distances).

  6. A modest reading: determinate content requires a disposition-plus-norms story,
  so an AI''s dispositions could constitute meaning — which actually helps the specification
  project rather than dooming it.


