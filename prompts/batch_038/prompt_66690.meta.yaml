  that specification is impossible in the engineering sense, because the engineering
  goal isn''t "make the system mean X" but "make it behave as if it tracks X" — and
  Kripkenstein is about semantic facts, not behavioral dispositions. That''s the crux:
  the slogan conflates semantic determinacy with behavioral determinacy.


