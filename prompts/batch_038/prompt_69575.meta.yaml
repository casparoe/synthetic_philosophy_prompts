  there a fraction of a second apart, and people report a single spot travelling across
  and changing colour somewhere in the middle of its path. Which is weird, because
  at the moment of the colour change the second light hasn''t happened yet. Two ways
  out: Stalinesque — the brain waits, builds the whole moving-and-changing-colour
  show, and only then delivers it to consciousness, so the subject never experiences
  anything false; or Orwellian — the subject really does see red all the way across,
  and then afterwards the memory record gets edited so that the report comes out as
  ''it changed colour midway''. Dennett''s point is that both stories describe the
  same brain events and are completely indistinguishable from the inside or the outside,
  and that the whole dilemma only looks real if you assume there''s a finish line
