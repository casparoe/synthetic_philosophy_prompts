  \ me if I've mangled it): the brain is a careenium full of simmballs, each simmball\
  \ being the neural stand-in for one symbol; simmballs careen around and collide;\
  \ the collisions are arranged so that a bump from the grandmother simmball onto\
  \ some other simmball mirrors an inferential connection between the symbols; and\
  \ the hookup to the world is what gives each simmball its content — the causal tethers\
  \ out to patterns in the environment. That's the picture where symbols push each\
  \ other around and the pushing is what thinking is, seen from the symbol level.\n\
  \nPriya's argument, roughly:\n\n(1) What any given simmball does — which simmballs\
  \ it bumps, which bump it, when — is fixed entirely by the careenium: wiring, thresholds,\
  \ current physical state.\n(2) What the simmball stands for makes no difference\
  \ to any of that. Re-tag the same careenium so the simmball that realized grandmother\
  \ now realizes uncle and not one collision changes.\n(3) If content made a causal\
  \ difference, re-tagging would have to change which collisions happen, and then\
  \ the careenium wouldn't be physically closed.\n(4) So symbols never push anything.\
  \ All the pushing is balls pushing balls; the symbol level is a way of narrating\
  \ it, not a level at which anything occurs.\n(5) And the same move works everywhere\
  \ above the bottom: temperature doesn't bend the bimetal strip, pressure doesn't\
  \ burst the tyre, the meaning of a stop sign doesn't lift your foot off the accelerator.\
  \ In each case the parts did everything and the high-level story is narration.\n\
