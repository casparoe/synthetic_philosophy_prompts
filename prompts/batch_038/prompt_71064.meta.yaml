  \ did it\" isn't a rival account of why the strip bent, it's the same account at\
  \ a finer grain.\n(7) So (1)-(3) are false, symbols really do push the careenium\
  \ around, and downward causation is unproblematic.\n\nShe takes this to be a defense\
  \ of the symbol level. I think it's a trap, because (7) seems to buy way more than\
  \ she wants and the route from (6) to (7) is doing something sneaky, but I also\
