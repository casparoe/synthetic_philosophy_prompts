  Thesis: De Senectute is not a consolation about aging but a political brief about
  who is entitled to keep holding authority — the four charges are four objections
  to the continued public authority of old men, and each of Cicero''s answers supplies
  a resource that only the old have and that the republic supposedly cannot do without
  (institutional memory and precedent; independence from appetite; a network of clients
  and obligations; and a contempt for death that removes the tyrant''s leverage).
  Written by a man shut out of office by a dictator, it is an argument that the exclusion
  of old men from power is itself a symptom of regime change.


  Sketch of the argument (supply it for objections to target):

  1. The dialogue form matters: the speaker is not an old man reflecting privately
  but the most famous censor of the republic performing before two young men who are
  about to inherit the state — it''s an exemplum aimed at the next generation of officeholders,
  not therapy for the old.

  2. Each of the four charges is answered with a political capacity rather than a
  psychological state: the first answer is literally about who runs wars and senates;
  the second concedes physical decline but argues that the work that matters (deliberation,
  auctoritas) doesn''t require strength; the third treats the loss of appetite-driven
  pleasures as a qualification for office rather than a loss; the fourth converts
  proximity to death into an advantage in bargaining with those who would use death
  as a threat.

  3. The stock of examples is entirely drawn from men holding or having held office,
  plus the pleasures of agriculture — an estate''s management, which is itself a form
  of household governance and which depends on others'' labor.

  4. Therefore the correct genre label is not consolation but apologia: a claim about
  the distribution of authority across ages, made in a moment when that distribution
  had been suspended.


