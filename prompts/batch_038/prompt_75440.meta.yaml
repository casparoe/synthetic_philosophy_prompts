  nobody repealed; no rule requires consistency. Does the later rule prevail, is the
  amendment void for conflict, or do both stand until someone moves to reconcile?

  5. Retroactive validation: an amendment declares that a proposal passed three weeks
  ago was void ab initio and adjusts scores accordingly. Did the rules change, or
  did what the rules always were change?

  6. The umpire problem: a rule names one player as arbiter of validity questions.
  Can a proposal strip the arbiter''s authority? If the arbiter rules that the stripping
  proposal is invalid, is that ruling itself valid, and under what?

  7. The founding objection: a player argues the whole rulebook is void because the
  initial vote adopting it was conducted under no rules at all — there was nothing
  yet to authorize it. Is there any inside answer, or does the question fall outside
  the game?

  8. The meta-question: is "the rules are whatever we all continue to accept as the
  rules" a substantive claim about the game or just a restatement of how games work?
