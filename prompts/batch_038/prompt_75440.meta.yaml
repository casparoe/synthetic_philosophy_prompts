  knowability, contextualist treatments, revisionary moves on epistemic closure, etc.).
  Actually there are named positions: Dummettian anti-realism (rejecting that every
  truth is knowable is not the issue — the issue is rejecting classical logic / bivalence),
  Williamson''s "all truths are knowable is false but no contradiction" — actually
  Williamson accepts Fitch''s result and rejects knowability. Kvanvig, Edgington (restricting
  to actual truths — modal fallacy), Tennant (restriction to Cartesian statements),
  Jago (impossible worlds), Priest (dialetheism), Brogaard, Fischer. Also "the paradox
  is not a paradox, just a refutation of knowability" (Williamson 1987 "On the Paradox
  of Knowability"). Also intuitionistic logic approaches.


