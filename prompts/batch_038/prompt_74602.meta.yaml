  Draft:


  ---


  I chair the working group on legislative selection for a state constitutional review
  commission. We have eleven members and roughly as many incompatible proposals on
  the table, and the discussion keeps collapsing into people asserting that they are
  "for sortition" or "against it." I need an instrument that will force the disagreement
  into the open by sorting proposals rather than people.


  Please write a decision tree for reform proposals concerning how legislators are
  selected, beginning from the shared premise that our current system — election to
  multi-year terms, with incumbents typically re-elected — produces a self-perpetuating
  political class, and ending at named institutional designs. Nine to twelve branch
  nodes; at least twelve leaves.


  Constraints on the nodes:


  - Build the tree from design parameters, not from the familiar typology of mini-publics.
  Sorting by size and sponsoring body (citizens'' jury, deliberative poll, citizens''
  assembly, consensus conference) is not what our commission needs; I want the load-bearing
  branches to be things like: what mandate the sorted body holds (advisory, agenda-setting,
  suspensive, decisive); who is in the selection pool and whether service is compelled,
  volunteered, or opt-out; how lot and election are combined — does the lot select
  the deciders, or does it select the people who select the deciders, or does an election
  screen a pool from which a lot then draws; how long members serve and whether they
  may serve again; who controls the agenda of the sorted body; whether members are
  examined before taking office and audited after leaving it; and what sanctions,
  if any, apply when the body performs badly.

  - Include at least one node that sorts by what the proposer would accept as evidence
  that the reform had failed... because that reveals whether the load-bearing justification
  is fairness, epistemic quality, or breaking the political class — and designs that
  look identical from outside often differ here.

  - Include one node on the treatment of political careers: does the design make a
  career in politics impossible, unattractive, or merely irrelevant? Term limits without
  sortition and sortition without term limits should both be reachable.

  - Phrase every node as a question a commissioner could answer without knowing where
  it leads. No node may ask whether one supports a named arrangement.


  Constraints on the leaves: ...


  - Three historical arrangements must land on three distinct leaves and be distinguished
  by the parameters that actually separate them: the Athenian practice of allotment
  from a volunteered pool with examination before entry and an accounting at the end
  of the term, and with military commands excepted and filled by election; the Venetian
  multi-stage procedure in which the lot was used to choose the choosers rather than
  the officeholders; and the Florentine arrangement in which nomination and voting
  built a pool from which the lot then drew. If any two of these cannot be separated
  by your nodes, say so and name the parameter that would separate them.

