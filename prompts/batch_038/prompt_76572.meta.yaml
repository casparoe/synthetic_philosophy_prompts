  gives the answer she''s most likely to give. No preamble, no wrap-up, two or three
  sentences per item. Make them turn on her actual commitments, not on generalities:


  1. the individuation rule — if instruments carve the joints, why doesn''t every
  new instrument (a telescope, an fMRI, a well-designed survey) get its own pramāṇa,
  and where exactly does she draw the line?

