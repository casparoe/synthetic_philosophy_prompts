  Good opening challenge for Hobbes: his genetic account seems to make geometry''s
  certainty depend on our ability to construct figures, but he also holds that a point
  is that of which we consider no magnitude, and that the motion of a point makes
  a line — yet nothing can be made out of nothing; if a point has no magnitude at
  all, its motion cannot generate a line with breadthless length, since generation
  requires a cause with some quantity. So either the point has magnitude (and then
  a line has thickness, and his whole edifice of demonstrations about ratios collapses)
  or generation is a fiction and his definitions are just names — which is what Wallis
  says. That''s a strong dilemma, well within the weeds, and Hobbes has real resources:
  he distinguishes considering a magnitude vs having one; he says the point is not
  nothing but is considered as having no quantity; the generated line''s "breadth"
  is a consideration, not an absence; and the causal story is about how we conceive,
  i.e., the accident of motion, and philosophy deals with bodies and accidents so
  that a point is a body considered without its other accidents. Also Hobbes can say
  his method''s value is that it yields causes for demonstrations, and the alternative
  — treating magnitudes as given by bare names and then manipulating them with symbols
  (algebra, "the arithmetic of infinities") — produces results without understanding
  and eventually absurdities.


