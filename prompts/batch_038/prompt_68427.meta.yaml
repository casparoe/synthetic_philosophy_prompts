  I am in the final weeks of an upper-level seminar on the metaphysics of consciousness,
  and this week''s session is on the timing of experience. Our instructor has asked
  each of us to circulate in advance a short statement of where we currently stand,
  so that the discussion can start from our actual views rather than from the readings.
  A classmate suggested that I have my statement stress-tested before handing it in,
  and I would like that done here.


  Here is the position as I have written it down.


  1. I am a physicalist about experience: there is no ingredient of an experience
  over and above neural activity, so any question about experience is ultimately a
  question about the brain.

  2. I accept the multiple drafts picture. There is no finish line in the brain, no
  place-and-moment at which processing becomes conscious, and nothing like an inner
  theatre at which a finished version of events is screened for somebody. Contents
  are fixed in parallel and at different times in different channels.

  3. In the colour-phi case — two differently coloured lights flashed in quick succession
  a short distance apart, with the subject reporting a single spot travelling between
  them and changing colour partway — I favour the "Stalinesque" reading: the brain
  produces the motion-and-colour-change content in real time, before any report, and
  nothing is rewritten afterwards. My reason is that talk of the record being revised
  after the fact only makes sense if there is somebody the revision has to be concealed
  from, and that is precisely the picture I have rejected in (2).

  4. I want a single account of temporal anomaly, not a disjunctive one. Whatever
  explains colour phi should also explain the tactile cases in which taps delivered
  at two separated sites are felt as a series of taps in between them, and the Libet-style
  cases.

  5. On Libet: I take the backward-referral result — the reported onset of a sensation
  is dated close to the stimulus, even though the cortical activity he treated as
  necessary for the experience had to run its course first — as showing that the brain
  back-dates the record. On that case, then, I am an Orwellian.

  6. I hold that there is a determinate fact about when a given experience occurs,
  and that this is in principle an empirical matter. It does not seem to me that the
  Stalinesque and Orwellian readings are beyond experimental discrimination: one should
  be able to pin down when the relevant content was available by means other than
  a retrospective verbal report — forced-choice probes at very short latencies, or
  an online response that tracks the apparent spot as it moves.

  7. Where a subject''s first-person judgement about the timing of their own experience
  conflicts with third-person neural measurement, I give the report at least weak
  priority: it constrains the model rather than merely being explained away by it.

  8. None of this is sceptical in import. I do not think the temporal-illusion cases
  show that our phenomenology is systematically illusory, and I do not think that
  describing the felt immediacy of the present as itself a construction amounts to
  saying that experience misrepresents.


  I am not going to tell you which of these I am most attached to, because I would
  rather not bias the assessment.


  What I want back is an audit, not a summary of the debate and not a précis of anyone''s
  view. Please: (a) identify which of these commitments are genuinely in tension,
  and rank those tensions by severity rather than presenting them as a flat list;
