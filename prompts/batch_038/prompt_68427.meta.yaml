  claim in Being and Nothingness that we can never know the Other''s freedom as such,
  and that all concrete relations with others are conflict (sadism/masochism) versus
  the later claim that one''s own freedom depends on the freedom of others (which
  he says in the Ethics of Ambiguity and in the lecture "Existentialism is a Humanism"
  — "I cannot make liberty my aim unless I make that of others equally my aim").


  Actually there''s a great tension: in the lecture Existentialism Is a Humanism,
  Sartre says one''s freedom depends on others'' freedom and that we must will the
  liberty of others — while in Being and Nothingness he says conflict is the meaning
  of being-for-others and that the other is the one who steals my world / objectifies
  me. Also the tension between radical freedom (we choose everything, no excuses)
  and the notion of "facticity" including things like one''s childhood, class, body
  — Sartre''s position on the situation: freedom is always in a situation but the
  situation doesn''t limit freedom. And the tension between "man is condemned to be
  free" and moral universalism ("in choosing myself I choose man") — how does an absolutely
  contingent, groundless choice generate an ought binding on others? That''s a real
  issue (the derivation problem in the lecture, plus the charge of decisionism).


  Another good tension: bad faith as a lie to oneself requires the liar and the dupe
  to be one and the same consciousness; Sartre''s solution is that consciousness is
  translucent/non-thetic awareness of being in bad faith — but then he also says bad
  faith is a flight we undertake deliberately, and in some places he says we cannot
  get out of bad faith at will (it''s a permanent threat/metastable). The apparent
  tension vs real: the translucency of consciousness vs. the unconscious — Sartre
  explicitly rejects the Freudian censor, but then in bad faith he needs a "censor"-like
  structure; he says bad faith is in good faith and is a metastable state. Also Sartre''s
  "spirit of seriousness" and values existing "out there" as things — the tension
  with values being created by freedom (in B&N, values are what freedom founds; in
  the lecture, "if God doesn''t exist, everything is permitted... we are left alone
  without excuse").


  Also there''s the tension between the claim that we are wholly responsible even
  for wars (Sartre: "there are no accidents in life; a war... is one I have wanted")
  and the claim that freedom is only in the project / that nothing can act on consciousness
