  1. I''m a physicalist about the mind: every experiential fact is a fact about neural
  activity, with no nonphysical residue. (Fine, standard.)

  2. I accept the "multiple drafts" picture: there''s no single place-and-time in
  the brain where consciousness converges; content fixation is distributed across
  parallel processes.

  3. For color phi (two stationary lights, red then green, at short intervals — the
  subject reports a single moving spot changing color midway), I prefer the Stalinesque
  explanation: the brain represents motion-and-color-change in real time, before the
  report; there is no retroactive revision. Reason: retroactive revision would require
  the brain to "hold on" to a not-yet-experienced content and edit it, which seems
  to me to reintroduce an inner audience that has to be kept in the dark.

  4. I believe that in principle a well-designed experiment could decide between Stalinesque
  and Orwellian accounts, by measuring when the content of experience became available
  to the subject — e.g., using forced-choice reports at very short latencies or asking
  for online motor reports (a saccade or a keypress tracking the spot) that bypass
  verbal report.

  5. I hold that there is a fact of the matter about when a given experience occurs,
  and that this fact is not merely a matter of which description we choose; the question
  "was it already experienced at time t?" has a determinate answer.

  6. I reject the claim that consciousness involves a "Cartesian theater" or any kind
  of intrinsic present-moment, and I think the felt immediacy of the present is itself
  a construction.

