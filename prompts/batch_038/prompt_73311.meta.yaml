  Student''s answer content — gets right:

  - Two conclusions: growing reliability (probability increases with group size) and
  the asymptotic limit (→1 as n→∞), given p > 1/2, equal competence, independence.

  - The mirror case p < 1/2.

  - Correlated errors are the main empirical threat; independence in the probabilistic
  sense.

  - The theorem is epistemic/external, not procedural: it assumes there''s a right
  answer independent of the vote, so it can''t be used for matters of mere preference
  aggregation.

  - The theorem doesn''t establish p > 1/2; that''s an empirical assumption that has
  to be argued separately.


  Subtle errors:

  1. Conflation of unconditional independence with the absence of communication/deliberation:
  claims that the theorem''s independence assumption means voters must decide in isolation,
  so deliberation is incompatible with the theorem''s applicability, and hence CJT-based
  defenses of democracy must reject deliberative democracy. The nuance: deliberation
  can raise individual competence and need not produce correlated errors conditional
  on the truth; what breaks the theorem is correlation of votes (given the truth),
  not contact per se. Also the distinction between conditional and unconditional independence
  matters — with asymmetric detectability of the two options, votes can be unconditionally
  correlated yet conditionally independent. A hasty grader would let this slide.


  2. Non sequitur: claims that the p < 1/2 case shows democracy is "self-correcting,"
  since a systematically wrong majority means errors become obvious and get fixed.
  That doesn''t follow at all: the theorem predicts that a sub-1/2 competence majority
  converges on the wrong answer with probability → 1, i.e., the error becomes more
  entrenched, not corrected. There''s nothing in the model about feedback.


  3. Misattributed/overstated step: claims the theorem shows there''s no epistemic
  case for weighting votes by competence, or (better) claims that since flat majority
  works asymptotically, weighting schemes are irrelevant/unnecessary — and attributes
  to Condorcet''s theorem the result that a weighted rule can''t do better. But the
  weighted-majority literature (Nitzan and Paroush 1982) shows that, holding independence
  fixed, the reliability-maximizing rule weights each vote by the log-odds of that
  voter''s competence, so a flat majority is optimal only when competences are equal.
  That undercuts the inference from CJT to "no case for weighted voting" — it''s a
  comparison the theorem simply doesn''t make. Also the finite-n point: asymptotic
  infallibility says nothing about which rule is better at realistic group sizes.


