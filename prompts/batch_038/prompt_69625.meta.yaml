  care." In practice everybody on the ward knows which daughter actually does the
  caring — drives 40 minutes, knows the med list, has slept in the chair — and she
  is often nowhere on the list, because she''s not the spouse and she''s fourth among
  the kids. Meanwhile the estranged son who hasn''t called since 2009 is first in
  line after the spouse, and gets the whole thing. And then there''s the flip: when
  a family demands we keep treating and the doctors say it won''t help, the committee
  overrides the family completely — their wishes count for nothing. So the same group
  of people has zero standing when they''re grieving and full authority when they''ve
  been handed a form, and gets overruled when they want more treatment but decides
  everything when they''re the agent saying he''d want less. Is that actually inconsistent,
  or is there one idea underneath that makes both halves make sense?


