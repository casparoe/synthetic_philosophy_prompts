  the agent''s job is to report what the patient would have wanted — not what the
  agent wants, not what would be easiest for the family. So when a wife stands at
  the foot of the bed saying "he''d want us to keep going, I''m not ready," the consult
  treats her as a thing to be worked on, a bias to be filtered out so we can hear
  the patient through the noise. And if there''s no paper, state law hands us a ranked
  list — spouse, then adult children, then parents, then siblings — and whoever is
  highest and reachable gets to decide, alone, even if there are four other adult
  kids in the hallway who think that''s insane.


