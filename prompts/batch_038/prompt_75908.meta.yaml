  actuator chain, an air-gapped monitor that watches for signs of interference and
  trips the cutoff, no self-modification, no ability to acquire compute or money,
  no channel through which it could persuade an operator to disable the safeguards.
  Resistance is not eliminated; it is rendered causally impotent.


