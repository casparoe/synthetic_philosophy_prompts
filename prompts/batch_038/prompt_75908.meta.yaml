  built on a false picture of what it can do, and the moment it discovers the constraint
  — which any competent world-modeler eventually will — its plans fail in unpredictable
  ways; the leash buys safety by buying brittleness. If it does model it, the constraint
  is just another feature of the environment to plan around, and the leash becomes
  an object of the agent''s optimization, not a limit on it.


  2. Corrigibility as a gradient, not a property. Rather than asking whether an agent
