  while you''re dead, since there''s no you. Nagel and the deprivation crowd accept
  this and say the harm falls on the person who is alive and about to die: you are
  harmed now, or at the moment of death, by the loss of the future goods you would
  otherwise have had. I''m not going to quarrel with that. But it treats a life like
  a ledger with a torn-off last few pages: the goods already booked stay booked, and
  the harm is entirely the missing entries.


