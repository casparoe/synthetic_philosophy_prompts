  but it isn''t paid until later. Crucially, it''s not just that we didn''t know:
  on the retroactive reading I want, whether the population in year ten was thriving
  or already doomed is settled by what happens in year sixty. A plot that looks identical
  to another in 1990 is not the same kind of plot in 2050.


