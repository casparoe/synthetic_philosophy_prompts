  I''m writing a long feature for a general-interest science magazine about how the
  free energy principle has migrated out of computational neuroscience and into robotics
  and AI research, and I want to get one analogy right before I commit it to print.


  The lab I spent a week with builds autonomous agents — small mobile robots and,
  more recently, purely software ones — that are trained not on rewards but on active
  inference: the agent is given a generative model and left to minimise its own expected
  free energy. The principal investigator, when I asked him what he thinks he has
  actually built, reached for an image he clearly uses often. He said: think of a
  Markov blanket as a membrane. A cell wall, a skin. Anything that can hold a statistical
  membrane between its own states and the rest of the world, so that the inside is
  conditionally independent of the outside given what crosses the membrane, is a system
  — an individual, with an inside perspective, that persists just so long as it keeps
  the membrane intact. On his account the membrane does the same work for a robot,
  a bacterium, and a person: it is what makes there be a *self* there at all, rather
  than a smear of coupled physics. And he draws the conclusion I want to report: if
  maintaining a Markov blanket is what being a self consists in, then the software
  agents in his lab are already selves of a modest kind, and any further question
  about whether they have experience or interests is a question for empirics, not
  philosophy. He was emphatic that this is not a metaphor he is stretching over the
  mathematics; the mathematics, he said, is the membrane.


  A philosopher I put the passage to gave me the opposite image, and I want both audited
  rather than choosing between them for narrative convenience. She said a Markov blanket
  is no more a membrane than a dotted line drawn around a low-pressure system on a
  weather map is a wall around the storm: the blanket is a set of variables picked
  out relative to a factorisation of a probability distribution, and which factorisation
  you choose is a modelling decision, not a discovery. On her telling, blankets nest
  inside blankets, can be redrawn at will, and the whole move from "here is a useful
  partition" to "here is an individual with a perspective" is a slide the membrane
  picture is doing nothing but concealing.


  Here is what I need from you. Set out both analogies properly: for each, a correspondence
  table saying what plays the role of the membrane (or the dotted line), the inside,
  the outside, what crosses, and what counts as keeping the boundary intact. Then
  separate the disanalogies that actually bear on the inference to "software agents
  are selves of a modest kind" from the ones that are merely untidy but harmless.
  Say explicitly what each image smuggles in that the target lacks — I suspect the
  membrane imports spatial contiguity, a fixed inside/outside asymmetry, and above
  all the difference between a boundary a system maintains and a boundary an analyst
  posits, but I want that argued rather than assumed. Then give me a verdict: does
  the principal investigator''s conclusion survive his own analogy once the disanalogies
  are on the table, or was the analogy carrying it the whole time? If there is a better
