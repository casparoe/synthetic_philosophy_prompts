  Design the essay (~600 words) around:


  Thesis: The standard story is that Douglass changed his mind in 1851 under Spooner''s
  influence and after studying the Constitution''s history. The essay''s claim: what
  changed wasn''t his conclusions about particular clauses so much as his view about
  what fixes a constitution''s meaning — specifically, about the evidential status
  of non-compliance.


  Key moves:

  1. Garrison''s argument rested substantially on the framers'' own conduct and the
  history of the debates — i.e., on what the makers did and meant. Garrison''s pamphlet
  assembled the founders'' words and acts as evidence. On that method, a document
  inherits the moral character of the bargain actually struck, and the practice of
  the polity is evidence about meaning.

  2. Douglass after 1851 treats the text''s own declared purposes as controlling and
  insists the document be judged by its words rather than by the conduct of those
  who wrote or those who live under it. His argument: the Constitution nowhere uses
  the words slave or slavery; it speaks of persons; the Preamble''s purposes do not
  include slavery.

  3. The injected conceptual gadget: "breach doesn''t amend." Douglass''s real objection
  to Garrison is a category error — Garrison treated the polity''s violation of an
  instrument as evidence about the instrument''s content. But a promise''s content
  isn''t determined by how the promisor behaves afterward; a broken promise is still
  the promise it was. Garrisonianism makes slavery self-justifying at the level of
  meaning: the more consistently the country violates the anti-slavery reading, the
  stronger the evidence that the anti-slavery reading is wrong. That gives the slaveholding
  practice interpretive authority, which is precisely what abolitionists should deny.
  Call this the self-certifying vice: a reading of the document that makes sustained
  injustice evidence for the justice of the reading.

  4. Where the essay thinks Douglass overreaches: he needs more than the negative
  claim (no pro-slavery clause); he needs the affirmative claim that Congress has
  power to abolish slavery in the states, which he gets from the guarantee clause
  and general welfare/common defense powers — and there, "best light" construction
  is doing much heavier work, closer to rewriting than reading. Also his reliance
  on the common-law maxim that the law favors liberty is a tie-breaker for genuine
  ambiguity, but the fugitive-service clause and the twenty-year slave-trade clause
  aren''t obviously ambiguous. So the argument''s weak point is whether a maxim for
  resolving doubt can be promoted into a general canon of construction.

  5. The further worry: if purposes control, whose purposes? The natural escape —
  the Declaration''s principles supply the purposes — turns constitutional interpretation
  into natural-rights argument, which is fine but means the interpretive question
  isn''t really settled by the Constitution. And then Garrison and Douglass disagree
  less about meaning than about whether a community''s public commitments or its actual
  bargains define its law. Also, anachronism worry: this looks a lot like a twentieth-century
  interpretivist approach (reading law in its best moral light); is that comparison
  doing work or is it a crutch?


