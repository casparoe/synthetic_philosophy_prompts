  Plan the prompt content:


  Persona: journalist covering science and ideas for a magazine; commissioning a 2,500-word
  feature; editor skeptical; wants the piece to not be another "Nolan and philosophy"
  listicle.


  Prompt draft:


  Paragraph 1: Set up the persona and the assignment: a feature for a general-audience
  science-and-ideas section on why the last decade of prestige sci-fi keeps staging
  the same probability puzzle; I''ve been assigned Nolan''s The Prestige; I want to
  write it against the Sleeping Beauty problem and the theory of self-locating belief
  — not as an "illustration," but as a serious test of whether the film''s central
  conceit is even coherent.


  Paragraph 2: Give the technical scaffolding, showing that I know it (the journalist''s
  brief familiarity): the standard setup — Beauty is put to sleep Sunday, woken Monday,
  and if the coin lands tails she is put back to sleep with her memory erased and
  woken again Tuesday, each awakening subjectively indistinguishable; Lewis''s halfer
  answer (1/2, because she gets no new uncentered evidence) vs. Elga''s thirder answer
  (1/3, because she should treat her location among indistinguishable awakenings as
  equiprobable); the general machinery of centered worlds and the question of what
  an agent may rally believe when her total evidence is unchanged but her location
  isn''t; and the way this same structure has been borrowed in debates about branching/universal
  duplication, where a pre-branching agent wonders which successor she will be.


  Paragraph 3: The specific reading I want: Angier''s nightly performance. He steps
  into the machine knowing exactly what will happen — one of him will appear at the
  back of the theatre to applause, one will drop through the trapdoor into a sealed
  water tank. The film has him insist that the courage required lies precisely in
  not knowing which of the two he will be. Ask: is that a genuine self-locating credence,
  or a confusion? Compare to Beauty: Angier, unlike Beauty, keeps his memories, so
  his evidence *does* accumulate over the hundred-odd performances; but the question
  he faces is not "how many nights have I done this" but "which of the two post-branching
  people am I?" Where does the halfer/thirder split bite, and where does the film''s
  setup differ structurally from Beauty''s (memory, the fact that both successors
  exist simultaneously, the fact that the tank is a death rather than an awakening)?
  Should we treat his pre-performance uncertainty as a credence over centered worlds
  at all, given that the "original" doesn''t wake up to find itself in the tank —
  it drowns — i.e., is his uncertainty about *survival* rather than location? And
  does the film itself notice the difference: I want a reading of the bird trick early
  on (the crushed bird and the duplicate that appears in its place, and the child
  in the audience who asks where the brother is) as the film''s own statement of the
  problem, and whether that framing supports or undercuts Angier''s later claim.


  Paragraph 4: Deliverable requirements: ~1200 words? The prompt type says deliverable
  is criticism. Ask for: a reading that takes the film seriously as a film (staging,
  the three-part trick structure, the diary, the twin reveal as a *deceiving* answer
  to the duplication question), says where the analogy with Sleeping Beauty illuminates
  and where it distorts, and — importantly — doesn''t turn the film into a homework
  problem. Also ask: what does the film add to the debate that the papers don''t?
  Perhaps: the film makes vivid a cost that formal treatments ignore — that indexical
  uncertainty is something an agent can be *brave* or *self-deceiving* about, and
  that the practical stakes (a hundred corpses under the stage) are what makes Angier''s
  credence question unbearable. And ask for the honest verdict on whether the film''s
  claim survives: if it doesn''t, say so plainly, and say what the film is actually
  doing instead (e.g., substituting a question about identity for a question about
  location).


