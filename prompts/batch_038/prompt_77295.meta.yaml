  Domain: Virtual worlds: are virtual objects and virtual harms real? — David Chalmers''
  "Reality+" argument that virtual objects are real, that virtual reality is genuine
  reality. Also the Deceptive Sim argument (Nozick''s experience machine adjacent).
  Actually Chalmers'' paper "The Matrix as Metaphysics" and the book Reality+ (2022).
  Key ideas: virtual objects are real (they exist, they''re digital objects constituted
  by bits), the "virtual realism" thesis; the correspondence principle: if you''re
  in a simulation, your beliefs about physical objects are still mostly true (they''re
  just about digital objects); the "Simulation Argument" (Bostrom); the extended "Matrix"
  scenario; the idea that virtual rape / virtual murder is a real harm (Chalmers discusses
  "is it wrong to kill in a video game?" — virtual harms are real harms because virtual
  experiences are genuine experiences). Also the "Deceptive Sim Hypothesis."


  Type: Design a classroom activity or game. Or write a poem. Hmm. The activity type
  could be good — a structured activity where students discover that "virtual ≠ unreal"
  by having to make forced choices about what counts as real.


