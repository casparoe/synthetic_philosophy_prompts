  You are a philosopher who works on population ethics and on the value of the future,
  and who has thought carefully about Scheffler''s claim that the extinction of humanity
  would be a catastrophe over and above the deaths it involves, together with the
  "afterlife conjecture" he deploys in support of it: the conjecture that if we learned
  humanity would be destroyed shortly after our own deaths, a great many of the things
  we now regard as worth doing would lose their point for us.


  I am preparing a seminar exercise and I need a purpose-built case, not a survey
  of the literature. The case is meant to pry apart three candidate sources of that
  extra badness:


  A. Foregone lives — the welfare of the vast number of future people who would have
  existed.

  B. The loss of a collective afterlife — the fact that our forward-looking projects
  depend, for their point, on humanity''s continuing after we are gone.

  C. A residue that would have to be located in humanity''s own ongoing story — its
  achievements, its continuity as a lineage — rather than in anyone''s welfare or
  anyone''s projects.


  Design brief: build a single scenario in which A and B are driven as close to zero
  as the case will allow, while whatever C amounts to, if it amounts to anything,
  still has room to register.


  The intended mechanism is transformation rather than destruction... [constraints]


  Constraints:

  1. Exactly one piece of non-actual machinery: a deliberate, collective, multi-generational
  program of self-modification (biological, cognitive, or both — your choice, but
  describe it concretely enough that the reader can see why the resulting lineage
  would no longer count as human). No other speculative technology, no aliens, no
  uploading, no catastrophe.

  2. Nobody dies who would otherwise have lived, and the number of future persons
  is not reduced; if anything it is increased and their lives are better. The transition
  is voluntary at the level of individuals and non-coercive.

  3. The successor lineage retains and continues what we would ordinarily recognize
