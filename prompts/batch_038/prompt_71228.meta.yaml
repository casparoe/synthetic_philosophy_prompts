  Key ideas to weave in, all standard enough that LLMs know them:

  - Wright''s etiological theory: function of X is Z iff X is there because it does
  Z (caused its own presence).

  - Millikan''s proper function / reproduction: functions require a reproductively
  established character.

  - Bigelow & Pancer''s "propensity theory" (etiological theory using dispositions
  to survive) — actually "proper function" via etiological account that avoids needing
  history: a trait''s function is what it would do that would cause it to be retained.
  This is nice — a way of being etiological without history. Good for a tension.

  - Cummins'' causal-role account: functions are just causal contributions of a component
  to a containing system''s capacity, analyzed dispositionally; no history, no normativity.

  - The "liberalism" objection to causal-role accounts: everything does something,
  so anything counts as a function (accidental effects like making noise, attracting
  predators) — no distinction between function and mere effect.

  - The "conservatism"/malfunction problem for etiological accounts: how can a defective
  heart fail to pump? Etiological accounts handle malfunction naturally (heart has
  function to pump even if it doesn''t).

  - The problem of novel traits / "swampman"-type first-instance problem: a brand-new
  mutation with no reproductive history has no function on strict etiological accounts
  (Neander''s "new function problem" — Karen Neander''s arguments about first-order/second-order
  functions; also the problem of novel functions).

  - Godfrey-Smith''s distinction: causal-role functions are indexed to a context/capacity
  — the "function of" relation is triadic (function of X, in system S, relative to
  containing system''s capacity Z).

  - The reductive/normative divide: etiological accounts are supposed to naturalize
  normativity (Millikan), causal-role accounts don''t give normativity at all.

  - Boorse''s biostatistical theory (goal contributions relative to species-typical
  statistical design) — different from both; a third option.

  - Price/Papineau — teleosemantics: content requires proper function (Papineau''s
  "consumer/producer" teleosemantics).

  - The "selected effects" vs "organizational" (Moreno/Mossio "organizational account")
  distinction — organizational accounts are causal-role-ish but closed-loop self-maintaining
  systems, and they do ground normativity without history. Mossio & Moreno. That''s
  a bit niche but known.

  - Etiological theories and the "one-shot" problem in cultural artifacts: functions
  of artifacts (Searle''s "agent-caused", Vermaas/Kroes''s intentional theory of technical
  functions) — artifacts have functions assigned by designers, not selected effects.


