  The key philosophical difficulty: role ethics denies that persons are prior to their
  roles (no "autonomous self" that chooses roles) — persons are constituted by roles.
  But then: (a) how can a role be criticized or revised? (b) how can someone enter
  a new role (conversion, marriage, employment) without a self that chooses it? (c)
  what about roles one doesn''t recognize or that conflict? (d) does role ethics owe
  an account of what happens when roles conflict (xiao vs. zhong — filial piety vs.
  loyalty to the state)? The classic crux: Confucian "graded love" (ai you cha deng)
  vs. Mohist "impartial care" (jian ai) — the Mengzi/Mozi debate, and Mengzi''s criticism
  of Yang Zhu and Mo Di. And the "one thought too many" parallel: the Mohist objection
  that graded concern is arbitrary/selfish, and the Confucian reply.


