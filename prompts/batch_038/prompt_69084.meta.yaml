  parent even when both parents would prefer that, and if the designated parent does
  not take them they lapse: the time and the wage replacement attached to it are destroyed
  rather than reallocated to anyone, including the child. Where exceptions exist,
  they are keyed to incapacity — illness, death, a single-parent household — and not
  to the couple''s own judgment about how best to divide the year.


