  I cover science and ideas for a general-interest magazine and am currently working
  on a piece about the reserved, non-transferable portion of paid parental leave —
  the slice of a couple''s entitlement that Nordic systems, beginning in the early
  1990s, have allocated to each parent as an individual rather than to the household.
