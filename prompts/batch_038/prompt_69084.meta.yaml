  remarkably deferential to families'' own choices: they pay cash child allowances
  with no conditions attached, they let parents choose freely among schools and childcare
  providers, and they generally treat the household as competent to decide how to
  spend its money. Here, though, the same governments would rather extinguish a benefit
  than allow the household to allocate it.


