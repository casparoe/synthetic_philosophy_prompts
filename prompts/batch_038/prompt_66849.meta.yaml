  ---


  I work as a software engineer on scoring and ranking systems. I have no formal philosophy
  training, so I would ask you to state your diagnosis in plain terms rather than
  assuming I know the technical vocabulary of the ethics literature; where a standard
  name exists for a move I have made, please give it, but explain it.


  Last year I was asked to review a risk-scoring pipeline, and to prepare I worked
  through the impossibility results showing that calibration and equal error rates
  cannot generally be satisfied together. The mathematics I follow, and I have reproduced
  it numerically on synthetic data. What I did next, on my own initiative, was to
  write out the following argument, and I now believe it proves considerably more
  than I can accept. I would like to know where it breaks.


  (1) Call a score calibrated if, for every score value s and every group g, the proportion
  of individuals in g who received score s and who in fact have the outcome is s.

  (2) Call a score separated if, at every threshold, the false positive rate and the
  false negative rate are equal across groups.

  (3) What a well-trained model estimates is the true conditional probability of the
  outcome given the available features, and that quantity is calibrated by construction.
  Calibration is therefore the property a score has in virtue of being accurate, and
  it is a purely statistical property: no normative commitment is built into it. Call
  any model that has it accurate.

  (4) The impossibility results establish that if base rates differ between groups,
  then no score that is not perfectly predictive can be both calibrated and separated.

  (5) Hence in any population with differing base rates, every accurate model fails
  separation.

  (6) A model that imposes a higher false positive rate on one group than on another
  burdens members of that group with errors that identically situated members of other
  groups do not bear, and that is what it is for a classifier to be unfair to a group.

  (7) Hence every accurate model on such a population is unfair to some group — including
  the Bayes-optimal model, computed from flawless data, with the group variable and
  every proxy for it removed.

  (8) The Bayes-optimal model is the upper limit of accuracy, and (7) holds at that
  limit. So no improvement in data quality, feature engineering, or model capacity
  can move a classifier away from unfairness. The violation is not an artifact of
  bad models; it is present in the best model there is.

  (9) So fairness cannot be a property of a model. At most it is a property of a population
  — a fact about base rates and how they came to be — and the engineering program
  of building fair classifiers is aimed at the wrong object. Worse, (7) shows that
  the choice among competing fairness criteria cannot be a technical choice either,
  since the criterion a team picks has no bearing on whether its model is unfair.


