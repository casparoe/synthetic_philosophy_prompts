  ---


  For eleven years I have run a free Thursday-evening discussion group in the back
  room of our town library. Fourteen regulars, ages roughly twenty-five to seventy,
  none of them with any philosophy training beyond what I have picked up for myself,
  which is a small amount and unsystematic. We have a long table, a wall we are allowed
  to pin things to, and a colour printer. I do not lecture; I hand people something
  to do and we argue about what happened.


  This month''s subject is forgery, and I want your help designing the session. Ninety
  minutes, and about forty dollars'' worth of printing and materials.


  Here is where my own thinking has got to, and it is the thinking I want the group
  to arrive at by themselves rather than be told. Three things I cannot reconcile:


  First, when I was twenty-six I paid real money for a small painting that turned
  out to be a later copy. I had admired it for over a year. From the afternoon I found
  out, I could not look at it the same way — and nothing about the object had changed.
  I want the group to feel that shift happen to them, in the room, within ninety minutes.


  Second, I have come to suspect that two different questions get run together: whether
  a thing is good to look at, and whether the making of it was good. A convincing
  forgery might score perfectly on the first and nothing on the second. What I cannot
  explain is why the second should matter to anyone who will never meet the maker
  and cannot see the difference.


  Third, I cannot explain why an identical copy seems better or worse depending on
  why it was made — a sign-painter''s copy for a friend''s child feels harmless, and
  the same brushwork aimed at a buyer''s wallet feels like a fraud, though the paint
  is the same. That makes me suspect the value is somewhere in the history rather
  than the surface, but if it is in the history then "just look at it more carefully"
  cannot be the answer anyone gives me.


  The practical asset I have: a local sign-writer who does faux finishes and mural
  copies, and who says he can copy a small painting I own closely enough that the
  two side by side would beat most people. If he cannot, my fallback is many identical
  colour prints of the same image with nothing but the story attached to each one
  differing — and I want you to tell me plainly whether that fallback still does the
  job or quietly destroys the point.


  What I need from you:


  - A full running order with minute allocations, and the materials list.

  - A mechanic in which the group must commit to a stated rule about what does and
  does not change a work''s value, and is then handed cases it has not seen, so that
  its own rule can be turned against it. Include a scoring scheme that needs no money.

  - At least one segment that confronts the most common escape — the claim that the
  good forgeries were never really as good, that connoisseurs could always tell, that
  the Dutchman who painted fake Vermeers is a special case — and lets the group discover
  what is and is not left of their rule if that claim is true.

  - A segment on why the trick does not seem to work for a poem, a piece of music,
  or a recipe, and I want the group to notice this asymmetry on its own.

  - A debrief that ties each phase to the idea it was built to produce, in plain language;
  I do not want jargon introduced before the group has earned it.

  - What will predictably go wrong the first time I run it, with this particular group,
  and what I should do at that moment. Two of my regulars will insist from the outset
  that a good picture is a good picture and will refuse to move; I would rather the
  design use that than argue with it.

  - An honest note on which part of the problem the activity cannot reproduce and
  that I will have to supply in words.


  Two constraints. Do not let the session slide into market value: I am not interested
  in what a thing would fetch, and the design should make price the wrong currency
  rather than an appealing one. And do not give me a reading list or references —
  I want the session, not the syllabus, and I have no way to chase books down.


