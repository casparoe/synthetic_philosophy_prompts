  Now, the activity: participants need to run into the problem themselves before it''s
  named. Design:


  Phase 1: "Two pictures." Show slides A and B — visually indistinguishable (use high-quality
  prints of the same image, or one original artwork and one careful copy by a local
  artist). Ask participants to rate each on a 1–10 scale for "how good is this work"
  and write one sentence of justification. Actually with identical images, ratings
  will be similar. Then reveal: A is an original by X, B is a copy made by a forger
  for profit. Re-rate. Most drop B.


  Phase 2: The twist — reveal that the facilitator lied: actually both are copies
  (or both originals), or that A is itself a copy of a lost work. Now they''re in
  a mess: their ratings changed twice on identical pixels.


  Phase 3: Introduce a "provenance card" mechanic — same image, different cards, and
  the group has to decide which cards change the value and which don''t: "painted
  by a student imitating her teacher," "painted by the artist''s workshop assistant
  and finished by the master," "painted by the artist at 19," "painted by the artist
  at 80, when his eyesight was failing," "painted by an AI from a prompt," "an exact
  molecular duplicate made by a replicator," "a copy made to deceive, sold for a fortune,"
  "a copy made as a loving homage, given as a gift," "the artist''s own copy made
  for his daughter." The group sorts cards into "changes the value / doesn''t change
  the value" and must give a rule. The rule is where they run into the achievement/derivativeness
  argument.


  Phase 4: The music/recipe case (Goodman''s allographic): give them a poem in two
  copies — one handwritten by the poet, one printed. Does forgery exist for poems?
  Why not? Then the sheet-music case: a forged manuscript of a Bach score that, when
  played, produces indistinguishable sound. Then a "restored" case: a painting 90%
  repainted by a restorer — is it still the same work? (Ship of Theseus bleed-over,
  which is good.)


