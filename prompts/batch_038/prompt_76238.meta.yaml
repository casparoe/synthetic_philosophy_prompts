  there can be two indiscernible things; the description smuggles in primitive thisness.
  All you''ve shown is that the words are self-consistent, not that the world is possible.
  And without haecceities, a world''s identity is exhausted by its qualitative content
  — so there''s at most one such world, and if you can''t say anything distinguishing,
  you haven''t said there are two.


