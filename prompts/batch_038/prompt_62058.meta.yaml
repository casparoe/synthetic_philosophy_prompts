  Draft:


  "I am preparing a talk for a decision-theory reading group in which I set out my
  own position on the coherence arguments for expected utility maximisation, and I
  would like a consistency check before I present it. Here is the package:


  (1) The coherence arguments are normative, not merely descriptive: an agent whose
  preferences over gambles are not representable by an expected utility function is
  not just unusual but irrational.

  (2) What earns that verdict is dynamic: such an agent can be led, through a sequence
  of choices each of which she prefers to the alternative she declines, to end up
  strictly worse off having paid for nothing; I regard that as a genuine defect rather
  than a harmless quirk.

  (3) The utility function delivered by the representation theorems is unique only
  up to positive affine transformation, and I take it that there is accordingly no
  fact of the matter about interpersonal comparisons of utility.

  (4) Rationality is structural: it requires coherence among the attitudes an agent
  actually has, not that she have any particular attitudes. Requirements of rationality
  are wide-scope.

  (5) I am sceptical of the idealisations these theorems are usually run with. The
  arguments should be assessed against an agent''s actual preferences over options
  she has actually considered, not against the dispositions she would have after unlimited
  reflection.

  (6) I reject the independence axiom. Allais-style cases convince me, and I am content
  with a rank-dependent or otherwise non-linear weighting of probabilities as the
  replacement.


  Please audit this set rather than lecture me on it. Which of these commitments genuinely
  pull against one another, and which pairs only appear to? For each real tension,
  say how severe it is, which commitment would have to give, and what I would lose
  by giving it up. Then tell me which single revision would repair the most damage.
