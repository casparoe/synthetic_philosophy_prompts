  Let me be careful about technical accuracy:


  - Representation theorems (Savage, Ramsey, Jeffrey, de Finetti): require a preference
  ordering over a sufficiently rich set of acts/gambles; completeness, transitivity,
  continuity/archimedean, independence (or Savage''s sure-thing principle), plus Savage''s
  non-atomicity (P6) to get a probability measure, and boundedness to get uniqueness/avoid
  St Petersburg.

  - The completeness requirement: a genuinely substantive demand — "rationality requires
  coherence among attitudes" (structural) vs "requires having attitudes". Standard
  point in the literature (e.g., discussions of whether completeness is a requirement
  of rationality; Broome''s wide-scope requirements; the "rationality is not merely
  consistency" debate). Good.

  - Idealisation: Savage''s theorem is about an agent''s preferences over all acts
  in a rich algebra; real agents have sparse preferences. Also "the axioms are only
  satisfied in the limit". This is a real objection. Good.

  - Money pumps and non-EU: An agent violating independence can be dynamically exploited;
  a "sophisticated" agent who anticipates her own future choices can sometimes avoid
  the pump (backward induction), which requires foresight/idealisation. Also there''s
  a known result that for RDU-type agents with a fixed probability weighting function,
  dynamic consistency fails and pumps exist. Good.

  - Affine uniqueness ↔ no interpersonal comparison: standard, correct.


