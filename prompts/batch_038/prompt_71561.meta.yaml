  Genuine tension: Dretske''s indicator semantics requires that a belief''s content
  is fixed by causal covariance — but covariance can''t deliver misrepresentation
  (disjunction problem), so Dretske adds the learning period / "indicator functions"
  — and if content is fixed by learning history, then the two-bitser''s derived intentionality
  argument (which says content depends on the observer''s interpretation) can''t be
  right, because the content is fixed by the system''s own history, not the interpreter''s.
  Also tension between Searle''s homunculus fallacy critique and teleosemantics which
  is often accused of homuncularism.


  Also the "original vs derived" tension: if you''re a Dennettian intentional stance
  realist-ish (believes content is real, not fiction), but you also think a two-bitser
  has genuine content, then you can''t say "the interpretation must come from somewhere,"
  which is Searle''s regress argument. Actually, Dennett''s response is that the regress
  isn''t vicious, because the original interpreter''s intentionality is itself derived...
  but then where does content come from? Dennett''s answer: from evolution/natural
  selection. So a Dennettian who says "there''s no original intentionality, it''s
  all derived all the way down" plus "content facts are real, not observer-relative"
  is in tension: if all intentionality is derived and there are no underived sources,
  then either content bottoms out in observer-relative ascription (deflationary/instrumentalism)
  or in nature''s own ascriptions (evolutionary teleology). Good tension.


