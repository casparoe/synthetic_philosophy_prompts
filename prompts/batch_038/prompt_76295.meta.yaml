  satisfying constraints 1–3 (for example: a messenger/relay role, a scoring rule
  that rewards being named as a source by peers, a garbling channel, a verification
  token) and say which you chose and why the others fail. This section is for me only.

  (b) The hidden state of the world and the private-signal mechanism: exactly what
