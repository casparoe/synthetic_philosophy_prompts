  no real money. Students have read [some stuff] but I will not tell them today''s
  topic in advance.


  Deliverable: a complete, runnable in-class game plus debrief that makes them feel
  the difference between two failure modes that get lumped together as ''echo chamber''
  in ordinary talk:

  - a structure that simply omits relevant voices (a connectivity failure — cured,
  in principle, by exposure to the missing voices);

  - a structure that actively discredits them (a trust failure — in which exposure
  to the missing voices does not help and can make things worse).


  Non-negotiable design constraints:

  1. Two acts with the same 24 people and the same underlying task. Act 1 must instantiate
  the omission structure. Between acts you may change only the rules and the topology
  — you may not instruct anyone to distrust anyone, plant a rumor, or have me make
  any announcement about the reliability of a group. Act 2 must instantiate the discrediting
  structure, and the distrust must be generated endogenously by the incentives and
  by what participants can actually observe from where they sit.

  2. The single change that most improves Act 1 — adding links, letting tables talk
  — must be among the changes that make Act 2 worse. Participants should be able to
  see this from their own scores, not from my saying so.

  3. Participants must have evidence. I want the game to produce the feeling, on the
  inside, that the other group is unreliable — an inference from data they actually
  collected, where the data are corrupted by the structure rather than by anyone''s
  bad faith. Build in a mechanism that does this.

  4. Nothing named until the debrief. Do not use the words ''echo chamber,'' ''epistemic
  bubble,'' ''testimony,'' or ''source'' in any handout, card, or instruction a participant
  sees.


