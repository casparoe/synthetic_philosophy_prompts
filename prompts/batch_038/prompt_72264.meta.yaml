  I like "Moore''s proof of an external world" + exam question with model answer and
  marking scheme. Moore''s proof: "Here is one hand, here is another; therefore there
  are at least two external objects; therefore an external world exists." Criticisms:
  begging the question (circularity — Moore knows the premises only if he knows the
  external world exists), the transmission-failure issue (Wright: warrant doesn''t
  transmit from premises to conclusion; the argument is question-begging but not viciously
  circular in a "epistemic circularity" sense), the "Moore-shift" vs modus tollens
  (if you accept that the argument is valid and deny you know the conclusion, you
  can deny you know the premises), and the requirement of knowledge (Moore''s three
  conditions: the premises must be known, different from the conclusion, and the conclusion
  must follow). Also relevant: Wittgenstein''s On Certainty response — hinge propositions,
  "I know" is misused; the difference between a Moorean "proof" as a piece of epistemic
  practice and the need for grounds. Also the distinction between question-begging
  and epistemic circularity, and between "persuasive failure" and "warrant failure."


