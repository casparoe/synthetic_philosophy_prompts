  but it can''t extend knowledge, because the warrant for ''here is a hand'' is *perceptual*
  warrant, and perceptual warrant is available only if one is already entitled to
  accept that one''s perceptual faculties are reliable / that there''s an external
  world — so the conclusion is presupposed by the warrant for the premise, not inferred
  from it. This makes the argument *non-transmissive* but not viciously circular;
  the failure is dialectical, not epistemic.


