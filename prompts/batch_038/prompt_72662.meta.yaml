  I am convening a seventy-five-minute seminar in a second-year early modern course,
  with a whiteboard and no slides. The twenty-two students have read the Monadology
  and the Discourse on Metaphysics but nothing of Leibniz on law or justice; they
  have also had Hobbes, and one of them is a politics student who is quite determined
  to reduce everything to power or self-interest. The session has a single target:
  to get them to hold Leibniz''s account of justice — justice as the benevolence of
  the wise, directed at the happiness or perfection of others, and admitting of ascending
  grades of strict right, equity, and piety, with the highest grade governed by the
  idea that perfection is harmony, that is, agreement in variety — as a substantive
  ethical position in its own right, and not as a corollary of the monadology.


  What I want from you is the plan of the explanation, not the explanation. Specifically:


  1. The dependency structure... [order, with each item noting what it presupposes]


  2. Entry point constraint: the metaphysics must not be front-loaded. Tell me where
  harmony first becomes load-bearing, and why it cannot be introduced earlier than
  that without becoming decoration.


  3. One carrying case... it must be a single concrete dispute capable of being re-described
  at each of the three grades, so that the ascent is shown rather than announced;
  state what the case must exhibit, what it must not exhibit (I suspect it must not
  be a case about punishment, and not one where the parties'' interests coincide),
  and the exact wording-neutral description I should put on the board first.


  4. Misconceptions, separated into those they arrive with and those my sequence will
  manufacture. I expect: that best-of-all-possible-worlds licenses quietism; that
  pre-established harmony is doing the ethical work; that monads being windowless
  makes genuine moral relations impossible; that God''s choosing the best makes Leibniz
  a voluntarist; that harmony is an aesthetic ideal indifferent to anyone''s suffering;
  and that the highest grade collapses into maximizing total happiness. For each,
  the precise point at which to head it off and the shortest intervention that will
  do it — and tell me if any of them is better left to surface and then be turned.


  5. The so-what juncture: identify the one place where a competent student can concede
  every premise and still ask why any of this obliges them, and give the move that
  closes it.


  6. A single closing question, with the answer that shows the idea has landed and
  the superficially similar answer that shows it has not.


  7. What I should deliberately leave out — the technical distinctions between kinds
  of necessity, the full theodicy, his quarrel with Pufendorf — and what I should
  say aloud in the room to mark each omission as an omission rather than an oversight.


