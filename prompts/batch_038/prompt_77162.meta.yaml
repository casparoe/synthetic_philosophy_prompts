  Draft:


  "I work on navigation and sensor fusion: Kalman and extended Kalman filters, interacting
  multiple models, information filters, fault detection and isolation, and the probability
  background that goes with them — filtrations, conditional expectation as projection,
  the tower property, martingales. I''m fluent enough to derive these things but I
  have no formal training in philosophy; what I''ve read I''ve read on my own, slowly.


  The reason I''m writing is personal. Six weeks ago I was diagnosed with [a progressive
  condition] ... and the treatment I''ll start in the fall is known to affect mood
  and cognition... I know that in two years my beliefs about my own prognosis, about
  how much risk to take, about what I want the next decade to look like, will be different
  from what they are now; and I currently think that at least some of that change
  will be distortion rather than information. Trying to think this through, I found
  my way into the philosophical literature on van Fraassen''s Reflection principle
  — roughly, the claim that if I''m now certain that at some later time my credence
  in A will be p, then my current credence in A should already be p — and into the
  arguments that it fails when the future belief-state is produced by an unreliable
  process, when evidence will have been forgotten, or when the belief in question
  is self-locating. I can''t tell how much of that debate is something I could think
  about in my own terms and how much of it evaporates or changes shape when I try.


  So I''d like you to do the translation for me, and then tell me what didn''t survive.


  First: restate Reflection, and the case for and against it, as faithfully as you
  can in the vocabulary I actually use... My own guess is that Reflection is just
  the tower property applied to a belief process — that it says the estimate sequence
  is a martingale with respect to its own filtration — and that the standard counterexamples
  are cases where the future estimator is being run on an information set that isn''t
  a refinement of mine (forgetting), where the estimand isn''t a fixed quantity but
  something time-indexed and centred on the estimator (self-locating belief), or where
  the future estimator has a known bias so that deferring to it is simply a design
  error (anticipated unreliability). Tell me whether that guess is a faithful translation
  or whether I''ve already quietly changed the subject.


  Second, a residue report, claim by claim: ... which parts map cleanly, which map
  only if I let you bend the engineering terms, and which have no counterpart at all
  in how I think about estimators. Be honest about the bending — I''d rather you flag
  a distortion than paper over it by redefining one of my terms. And don''t smuggle:
  if you end up assuming that beliefs are estimates of fixed quantities by a single
  persisting system with a known likelihood, say so, because that assumption may be
  doing the work that the philosophers are actually arguing about.


  Specific things I want addressed in the residue:

  (a) In my work, the reason a martingale is the right shape for a belief process
  is that the estimate is a conditional expectation and the conditional expectation
  is a projection; there''s no normativity anywhere, and nothing corresponds to a
  *requirement*. When the philosopher says reflection is rationally required — or
  says, in the other direction, that it isn''t and that a rational agent can be obliged
  to violate it — is that expressible in my vocabulary, or is it precisely the part
  with no counterpart?

  (b) The diachronic Dutch book: I can translate "you''d accept a combination of bets
  that guarantees a loss" as an arbitrage, but arbitrage only bites if someone is
  on the hook for the combined payoff. Tell me whether the betting argument actually
  supports a requirement on estimates, or whether it''s an artifact of a bookie who
  holds the agent''s temporally separated decisions together.

  (c) In my field, when I expect a sensor to degrade I don''t defer to the degraded
  filter — I run a bank of models and weight them. Is there an analogue of that for
  a person who expects their own future judgment to degrade: a mixture over possible
  future selves, weighted by expected reliability? Or does reflection resist being
  replaced by a mixture in a way that exposes something my framework can''t say —
  namely that there is one agent who owns all the estimates, and the question of whether
  to trust your own future output is not the same question as how much weight to give
  another system''s output?

  (d) The puzzle that keeps nagging me: in a filter, the estimate is a martingale
  while the covariance shrinks. I can''t expect my future estimate to differ from
  my current one, and yet I certainly expect it to be better. Does the covariance/estimate
  split resolve the philosophical puzzle about expected improvement in accuracy, or
  does it hide the problem behind a piece of machinery I have and the philosophers
  don''t?


  Then, finally: give me your verdict, and don''t hedge it. Is the residue — whatever
  refuses to be stated as a claim about estimators, information sets, and projections
  — mostly a limitation of my vocabulary, a sign that I''m missing something real
  about agency and diachronic unity that estimation theory has no room for? Or is
