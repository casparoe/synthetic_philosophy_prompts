  Let me think about honesty of translation: Reflection principle: P_now(P_then(A)
  = x) = 1 → P_now(A | ...) = x. In estimation vocabulary: if I know with certainty
  that my future estimator''s output for a fixed quantity will be x, then my current
  estimate should already be x. Equivalently, the belief process is a martingale:
  E[X_{t+1} | F_t] = X_t. The tower property gives this if the future estimate is
  itself a conditional expectation given a finer filtration of the same fixed quantity.


  Failure modes in philosophy:

  1. Forgetting / evidence loss: your future self might not condition on everything
  you know now → martingale property fails when the future estimate is not a refinement
  but a re-projection onto a coarser sigma-algebra. In estimation vocabulary: you
  can''t assume the future filter uses the same measurement history; if the future
  estimator''s information set is not a superset, the tower property doesn''t apply.
  That translates cleanly! This is nice.

  2. Self-locating / indexical belief (Sleeping Beauty, Elga): the quantity being
  estimated changes (A at t1 vs A at t2 with centred content). In estimation vocabulary:
  the estimand isn''t a fixed random variable; it''s time-indexed, so "the same A"
  isn''t well-defined. Translates with distortion? Actually translates reasonably:
  estimating a moving target with a state-space model. But the indexical part — "what
  my credence is now" — the centred content has no clean counterpart, because in a
  state-space model the state is objective; the estimator''s own index isn''t part
  of the state vector. That''s a real residue.

  3. Anticipated irrationality or unreliability of future self (e.g., drug-induced,
  fatigue, or a predictable bias): reflection requires that you expect the future
  self to be at least as reliable/rational. If you expect your future self to be biased
  (say, systematically overconfident after sleep deprivation), you should not defer.
  In estimation vocabulary: you don''t defer to a known-biased estimator; you debias.
  Translates cleanly, but then the philosophical bite: reflection is not about deferring
  to a future output, it''s about deferring to a future *rational* estimate, and the
  principle is a coherence requirement (diachronic Dutch book) rather than a truth-conducive
  rule. Here''s the residue: the Dutch book/ coherence justification — the idea that
  violating reflection exposes you to a sure loss across time. In estimation vocabulary,
  the counterpart would be "any non-martingale belief process is exploitable" — but
  the estimator doesn''t have a utility/stake; there''s no betting, no payoff, no
  exposure. Whether you can express "sure loss" requires a market/bookie that persists
  and an agent who accepts bets now for later. That translates partially (arbitrage),
  but the key: the diachronic Dutch book assumes the agent''s later preferences include
  their earlier commitments and no memory loss; the "sure loss" argument is contested
  (Christensen, Hedden: diachronic Dutch books don''t show irrationality because the
  loss arises from the combination of temporally separated decisions, and the agent
  can''t be Dutch booked if they anticipate). Also "rational dilemmas" — Hedden argues
  that an agent who is about to become irrational faces a rational dilemma where reflection
  and other principles conflict.


  4. The deep thing that may not translate: reflection as a norm of *self-trust* /
  diachronic agency — the idea that you and your future self are one agent whose beliefs
  should cohere, versus treating your future self as another (better-informed) expert
  whose opinion is evidence. The distinction between "deference to my future self"
  and "deference to an expert" and the question of whether reflection is a requirement
  of identity/unity of agency rather than of accuracy. In estimation vocabulary there''s
  no notion of a "persisting agent" — just a sequence of estimators. Whether that''s
  a defect of the vocabulary (missing the agency/unity dimension) or a sign that the
  philosophical claim was smuggling in a metaphysical assumption (personal identity
  as grounding a coherence norm) is a great question for the residue report.


  5. Also: "grue"-type issues? Or the fact that in a martingale, E[X_t] is constant,
  so a martingale belief process can never be *expected* to improve — that seems paradoxical:
  we do expect our future beliefs to be better (more accurate) while the point estimate
