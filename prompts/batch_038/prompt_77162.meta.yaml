  a dispute generated by treating a piece of estimator arithmetic as if it were a
  law about persons? If it''s a bit of both, tell me which parts go which way. And
  if the answer changes depending on whether the case is mine — one person deciding
  how much to trust their own future judgment under a known impairment — or the abstract
  one philosophers argue about, say so plainly.


  Please write it all as continuous prose, the way you''d write a letter: no headings,
  no bullet points, no bold, no tables. Put your verdict in the first paragraph so
  I know where you''re going, then do the translation and the residue report, then
