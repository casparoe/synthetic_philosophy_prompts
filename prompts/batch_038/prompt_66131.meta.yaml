  the problem that a measure that penalizes all changes will make the agent do nothing
  (conservatism / paralysis); the "penalizing any impact means the agent won''t accomplish
  its task" problem; the baseline choice problem; the problem that impact measures
  still need some notion of what matters (relative reachability uses a value function
  over features or unweighted states; AUP uses an auxiliary reward function which
  may smuggle in values).

