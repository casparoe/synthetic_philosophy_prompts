  become less reachable relative to a baseline (starting state). Penalizes irreversibility.

  - Attainable Utility Preservation (AUP, Turner et al.): penalty based on the ability
  to achieve an auxiliary goal/value function, compared to a baseline action (e.g.,
  doing nothing, or a "default" action). Uses a "delay" or baseline comparison. Penalizes
  the loss of ability to attain some auxiliary utility, not full value specification
  — AUP with many random/auxiliary reward functions approximates a value-free measure.

