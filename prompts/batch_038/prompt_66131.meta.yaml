  - "Value-free" vs "value-laden" — key tension: can we define "avoid side effects"
  without a full specification of value? Arguments: (a) reachability-based measures
  need only a model of the environment''s dynamics, not values — they use the structure
  of the state space; (b) but they need a weighting: which states/features matter?
  Relative reachability with unweighted features treats all dimensions equally, so
  it penalizes trivially-reversible-but-cosmetically-different changes and fails to
  capture that some effects matter more; also it penalizes effects that are good (e.g.,
