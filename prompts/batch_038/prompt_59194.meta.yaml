  I cover science and ideas for a weekly magazine, and last month I moderated a panel
  at an interdisciplinary conference on cultural evolution that turned into a sustained
  argument between two of the participants: a cognitive anthropologist, whom I''ll
  call Elena, and an evolutionary biologist, Marcus. The nominal question was whether
  the memetic framework — the idea that culture evolves by selection among self-replicating
  items, on the model of genes — is a substantive research programme or a loose metaphor.
  What follows is the exchange as it actually developed, in six moves.


  (1) Elena began by attacking the notion of copying. When a story is retold, a melody
  hummed from memory, or a craft technique demonstrated to an apprentice, nothing
  is duplicated: the recipient constructs a new version out of fragments, inferences,
  and background knowledge, and different recipients construct differently. What persists
  across a population, she argued, is not a replicator but a set of attractors — regions
  of the space of possible variants that human minds reliably drift back toward. To
  call that replication, she said, is to stretch the word until it describes the way
  a river keeps returning to the same meander pattern, which nobody calls heredity.


  (2) Marcus replied that attractors are a redescription, not a refutation. Genes
  are not copied by a homunculus either: DNA replication is itself a guided reconstruction,
  and its "fidelity" is nothing more than the statistical fact that offspring resemble
  their parents more than chance would predict. What natural selection requires is
  heritable variation in fitness, not a copying mechanism. On any mechanism-neutral
  reading of that requirement — which is the only reading that does scientific work
  — a cultural variant that is reliably rebuilt in mind after mind, and that gives
  rise to further variants, qualifies as a replicator.


  (3) Elena said mechanism-neutrality was precisely the defect, because it rendered
  the framework untestable: if statistical stability of any kind counts as replication,
  no observation could count against the theory, and a theory that cannot fail cannot
  explain. She added that whatever predictive content memetics did have came from
  the gene analogy, and culture violates the analogy''s substantive commitments. Particulate
  inheritance was what rescued Darwin from the blending objection; culture blends
  constantly. Someone who learns two variants of the same tale typically passes on
  a hybrid, and the hybrid does not segregate back into its parents. Under blending,
  selection is swamped unless it is extremely strong.


  (4) Marcus answered that blending is an artifact of describing cultural items at
  too coarse a grain. Decompose a tale into motifs, functions, and character roles,
  and what looked like blending is recombination of parts — no different in principle
  from reassortment or sexual recombination, where wholes are also shuffled while
  parts persist. And he noted a further asymmetry in the other direction: cultural
  variants can be adopted after their performance has been inspected, so culture inherits
  acquired characteristics. That is a difference in dynamics, he said, not a failure
  of the analogy.


  (5) Elena took that as a concession. If stability derives from what human minds
  reliably produce rather than from what was copied, and if transmission can carry
  acquired improvements, then the explanatory work belongs to psychology — attention,
  memory, motor constraints, interest — which is exactly what her field measures.
  The memetic vocabulary, she said, adds names without adding predictions: it can
  say that variants which persist are fitter, but fitness is defined by persistence,
  so the account is a redescription of the outcome it was supposed to explain. She
  likened it to saying that markets select profitable firms.


