  The disanalogies that matter for the novelist''s use:

  1. Kant''s test doesn''t require others to be rational or to be like you; superrationality
  requires common knowledge that all players are superrational and that they see the
  same problem. If the novel''s antagonist is a game-theoretic rationalist (or a fool),
  the Kantian protagonist''s cooperative choice isn''t vindicated by superrationality
  at all — a superrational player facing a non-superrational opponent should defect.

  2. Kant universalizes maxims (which include motives and descriptions of the action);
  superrationality fixes strategies. The description-sensitivity problem: what is
  "the same problem"? In the Luring Lottery, whether the maxim is "enter once" or
  "enter as many times as you can" or "enter with probability 1/N" changes everything.
  Kant''s maxim-individuation problem maps onto the "which symmetry class am I in"
  problem.

  3. Direction of explanation: Kant derives duty from the form of the law; superrationality
  derives a prediction from logical necessity ("the same logic leads to the same answer"),
  not from duty. There''s no "ought" in superrationality; a superrational agent isn''t
  being moral, they''re being correct. So the analogy can''t carry moral praise/blame
  — which matters for a novel that wants its protagonist to be admirable.

  4. Kant''s "as if" (act as though your maxim were to become universal law) is a
  heuristic/test, not a causal claim; critics accuse superrationality of magical thinking
  (my decision causes yours). Hofstadter''s own reply: no causation, just same logic
  → same answer. The analogy with Kant might actually help the novelist resist the
  "magical thinking" charge, or might worsen it.

  5. Asymmetric games: superrationality has no agreed extension; Kant''s formula is
  supposed to apply universally. In the Luring Lottery, the payoff depends on the
  total number of entries — the "best" response is to submit as many entries as everyone
  else submitted, which leads to runaway; the recommended fix is randomization (roll
  an N-sided die). Kant''s universalization of "I''ll submit a googolplex" — is there
  a contradiction in conception? Arguably not, since it doesn''t fail as a universal
  law in the strict sense (everyone submitting a googolplex is conceivable, just collectively
  self-defeating). That''s a nice crux: Kant''s test''s weakness with collectively
  self-defeating but conceivable maxims (like the free-rider / "everyone cheats on
  taxes" case, which Kant handles via contradiction in the will) vs. superrationality''s
  crisp answer.

  6. The mixed-strategy/randomization recommendation (roll a die, enter only on 1)
  has no Kantian analogue — you cannot universalize a probabilistic maxim easily;
  and the "kingdom of ends" isn''t a dice roll. This is a serious break for the analogy:
  the superrational answer in the lottery is stochastic, and Kant''s ethics has no
  obvious place for randomizing on purpose. Great crux.

  7. Also: Kantian agents don''t need to be identical copies; superrationality requires
  that everyone reason identically, which in a novel of distinct characters is exactly
  what the novelist wants to deny. So the analogy''s conclusion — that a Kantian character''s
  choice coincides with the superrational optimum and the cooperative ending is earned
  — doesn''t survive: the coincidence, where it exists, is coincidental and collapses
  as soon as characters differ in beliefs about each other''s rationality, or about
  the number of entrants, or about the payoff structure.


