  find: fine pottery, seals, writing, bronze.


  The claim I want to make: these four routinely come apart, and every famous "collapse"
  is a distinctive pattern of decoupling rather than a case of all-four-falling. And
  the pattern of decoupling is itself the interesting datum, not the collapse.


  Bronze Age eastern Mediterranean, c. 1200 BCE: (1) crashes — palaces, Linear B administration,
  the king''s redistributive economy, gone in a generation or two. (3) crashes — no
  more big building. (4) crashes — writing disappears from Greece for centuries, seal-cutting,
  fine pottery styles. (2)? Much less clear. Settlement shifts, some regions depopulate
  badly (Messenia), some continuity elsewhere, and the "dark age" is partly an artifact
  of the fact that unwritten, non-palace-centred populations leave fewer finds. So:
  an elite administrative collapse with demographic and material legibility collapse
