  Draft:


  ---


  For eleven years I''ve run a small reading group in my living room — eight of us,
  mostly people who came up on the rationalist blogs and now work in tech. We read
  slowly, we argue, and nobody is a professional philosopher, though three of us have
  read more analytic ethics than is strictly healthy for our day jobs. In two weeks
  it''s my turn to lead a ninety-minute session with a whiteboard, and the topic I''ve
  chosen is what I''ve seen called the paradox of deontology: the thought that agent-centered
  restrictions look self-defeating, because if the point of the prohibition is that
  people not be tortured (or killed, or deceived), then the state of the world in
  which fewer people are tortured is better by the prohibition''s own lights, and
  yet the deontologist forbids me from bringing it about by torturing one.


  I don''t want you to explain this to me; I want a plan for how I should explain
  it to them.


  The trouble is that my audience is wrong in a very specific way before I start.
  They are all consequentialists by temperament... they''ve sorted themselves on the
  trolley problem years ago... they treat agent-relative reasons as a confusion waiting
  to be dissolved, and their default move is: the deontologist must secretly be either
  (a) a threshold consequentialist, (b) a rule-consequentialist about dispositions,
  or (c) someone protecting his own clean hands. If the session just walks through
  the standard setup, it will be absorbed as another name for a mistake they''ve already
  diagnosed.


  Here is my own gloss, which I''d like you to build the plan around — and to correct
  bluntly if you think it''s wrong: the paradox gets its grip only from the assumption
  that the reason behind a restriction has to be statable from nowhere, as a ranking
  of world-states. On that assumption, the deontologist is committed to wanting the
  constraint-violations to be minimized globally, and so is committed to minimizing
  them himself; the only escape is to deny the assumption, i.e., to allow that some
  reasons are indexed to the agent''s own action in a way that does not generalize
  into a reason to make everyone else act that way too. Call it the two-ledgers picture:
  what the deontologist wants for the world and what he may do himself are kept in
  separate books, and the paradox is the accusation that the second book has no legitimate
  entries. If that gloss is right, the plan should build toward it; if it''s wrong
  or lopsided, tell me what to use instead and rebuild.


  Then, the plan itself:


  - The order. What has to be in place before what, and why the dependencies run that
  way — in particular, what minimal piece of machinery (a constraint that is not a
  function of outcomes; agent-centered restrictions as distinct from agent-centered
  prerogatives) must be fixed before the paradox is even statable, and which of those
  pieces my group will try to skip.

  - One example to carry the whole thing, and one only. Assume the trolley problem
  is disqualified... Tell me what the example must have and what it must lack.

  - The misconception map. For each of the three dismissals above plus whatever else
  you expect, tell me at what point in the sequence to head it off, and what to say
  at that point...

  - The autonomous-systems wrinkle. Three of the eight design policies that get applied
  at scale... they hear "an agent must not kill one to prevent five" as "a policy
  must not..." and think that dissolves it, because a policy chosen once in advance
  looks like legislation rather than an act. Tell me whether to lean on this or shut
  it down in the first ten minutes, commit either way, and give me the single sentence
  I''d use.

  - One check at the end that tells me whether the idea landed rather than merely
  whether they were agreeable...

  - What to leave out at this level, said out loud to the room. I already intend to
  cut double effect, thresholds, Kant''s grounding, and the whole "numbers" debate;
