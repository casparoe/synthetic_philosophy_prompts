  Let me think about a strong combination: Schlick''s meaning of life + a work of
  fiction. Schlick: in "Vom Sinn des Lebens" (On the Meaning of Life, 1930/1932),
  he argues: (1) the question of life''s meaning, when it means an external purpose
  given by God or cosmic plan, is confused/answerable only in a special way; (2) he
  distinguishes meaning as "purpose" (Zweck) from meaning as "value" (Wert/Sinn);
  (3) he defends that youth (Jugend) is the meaning of life — not as an age but as
  a mode: the capacity for play, for finding value in activity itself; (4) work vs
  play: work is what we do for the sake of something else, play is what we do for
  its own sake; but he notes the distinction is fluid and that even labor can become
  play for the person absorbed in it; (5) he rejects the pessimism that says life
  is meaningless because it ends or because all achievement is transient; (6) he argues
  the meaningful life isn''t a means-end chain — the "why" chain has no terminus in
  a purpose; life as a whole cannot have an external purpose, so meaning must be immanent.
  Also he thinks the question is partly a linguistic confusion, but he takes it seriously
  as a question about value rather than purpose.


