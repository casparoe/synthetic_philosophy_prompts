  I am a junior at a public high school and the captain of our debate team; I also
  run an informal ethics reading group that meets in the library on Thursdays. Our
  team is preparing for a tournament resolution concerning whether it can be morally
  permissible to target enemy soldiers in war, and I have watched our members talk
  past one another for weeks, mostly because words such as "war crime," "just cause,"
  and "combatant" are doing at least three different jobs in the same conversation.
  I would like you to build us a sorting instrument that reveals which position a
  person actually holds, rather than which slogan they are fond of.


  Please structure it in four parts.


  Part one: lay out the logical space before you write any questions. Identify the
  handful of independent commitments that generate the possible views — for instance,
  whether a combatant''s moral standing depends on the justice of the side he fights
  for, whether it depends on what he has personally done, whether the question at
  issue is who may be killed or who may kill, and whether an unjust-side fighter''s
  permission might be an excuse rather than a justification. Give the combinations
  those commitments allow, and for each combination state whether a recognizable position
  occupies it. Where a cell is empty, say why: because the view is incoherent, because
  nobody finds it attractive, or because it has simply not been developed.


  Part two: eight to ten questions, each presenting a single concrete case and two
  or three answer options. The cases must include at least: a conscripted teenager
  fighting for the aggressor state who has personally harmed no one; a fifteen-year-old
  forcibly recruited into a non-state armed group; a volunteer officer on the just
  side who orders an attack he expects to kill dozens of civilians for a marginal
  military gain; a civilian engineer in the aggressor state who maintains the targeting
  software; a drone operator who has never been exposed to any risk; an aggressor-state
  soldier who is retreating and no longer poses a threat; and a fighter on the unjust
  side who is sincerely and reasonably mistaken about which side is in the right.
  Write the questions in plain language, with no technical vocabulary in the question
  text at all — the jargon belongs only in the key.


  Part three: the scoring key, mapping answer patterns onto the leaves of your space.
  Each leaf should carry its conventional name, one sentence stating its most awkward
  commitment, and the answers that select it.


  Part four: an honest limitations section. Name any pair of leaves the instrument
  cannot actually separate, and say what further question would separate them; and
  give one tiebreaker question for the respondent whose answers turn out to be jointly
  inconsistent.


  Our audience is teenagers with no philosophy coursework, and we have twenty-five
  minutes per session, so please keep the whole thing usable in that time. Do not
  include a bibliography or citations; our library has essentially nothing on this
  subject and I would rather have the argument than a list of sources.


