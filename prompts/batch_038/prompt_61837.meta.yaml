  ---


  For two years our reading group has been unable to make progress on a question that
  ought to be decidable: whether Bongard''s hundred problems — twelve small figures
  per problem, six on the left page exemplifying an unnamed concept and six on the
  right page exemplifying its absence — are a legitimate testbed for concept induction,
  or a benchmark whose results are artefacts of its own construction.


  Position A ...: Following Hofstadter''s remark in Gödel, Escher, Bach that the skill
  of solving these problems sits close to whatever pure intelligence amounts to, and
  following Chollet''s argument that intelligence is skill-acquisition efficiency
  rather than skill, one camp holds that a system which names the intended concept
  for a large fraction of these problems, given only the twelve figures and no task-specific
  engineering, has demonstrated general concept formation; the number of examples
  needed is the measurement, and sample efficiency on a fixed battery is a fair basis
  for comparing a system to a human.


  Position B: The opposing camp holds that this is confused twice over. First, the
  figures were authored by human beings and selected for being solvable by human beings,
  so a battery of them is a sample from the designer''s prior, not from the space
  of concepts; performance therefore measures the overlap between a learner''s inductive
  biases and the designer''s, and any score is meaningless without an explicit statement
  of which priors the learner was granted. Second, and independently, each split of
  six against six is underdetermined: many mutually inconsistent rules separate the
  two pages, and solving amounts to guessing which rule the author meant, so the task
  tests a pragmatic mind-reading competence rather than induction at all. A third
  strand, closer to machine learning than to philosophy, says both are talking past
  the point: what explains human performance is a specific mechanism — search over
  a compositional vocabulary of low-level visual features, weighted toward short hypotheses
  — and mechanism claims of that kind are neither supported nor threatened by benchmark
  scores.


  My hypothesis, which I would like you to test rather than accept: the impasse is
  largely verbal. ''General'' in Position A means prior-independent within a battery
  held fixed, whereas in Position B it means robust across the space of possible batteries;
  once those are separated, most of the heat disappears and what remains is a narrower,
  tractable question about which priors may be granted without the comparison becoming
  unfair. Alternatively — and I am not sure how to decide between these — the real
  disagreement may be about standards of evidence (fixed-battery sample efficiency
  versus transfer across battery families), about whether a benchmark score can ever
  bear on a mechanism claim, or about the status of authorial intention: whether ''the
  intended concept'' is a real feature of each problem or a useful fiction.


