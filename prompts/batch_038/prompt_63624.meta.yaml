  "You are a philosopher of physics with a strong working knowledge of general relativity
  and of the metaphysics of time. Before you answer, sketch out for yourself two or
  three candidate diagnoses and the evidence for each, then commit to one.


  Here is the puzzle. Ever since Gödel published his rotating-universe solution in
  1949, the argument over what it shows has never been settled. One camp says Gödel
  established something profound: general relativity permits a cosmology with closed
  timelike curves through every point and with no preferred global foliation, so the
  theory does not deliver an objective, mind-independent time — precisely the conclusion
  Gödel wanted against Einstein. A second camp says this is a physicist''s non-starter:
  the solution is stationary rather than expanding, needs a negative cosmological
  constant tuned to the dust density, and describes nothing remotely like our universe,
  so nothing follows about time as we experience it. A third camp says the first two
  are talking past each other: granting closed timelike curves, a loop of timelike
  segments is still a temporal ordering, so the inference from ''GR allows CTCs''
  to ''time is unreal'' depends on a metaphysical premise about becoming that no spacetime
  geometry can supply.


