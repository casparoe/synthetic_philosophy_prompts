  Gödel: The debate about whether Gödel''s rotating universe shows time travel is
  possible / time is unreal. Key elements:

  - Gödel''s 1949 solution: a homogeneous, stationary universe filled with pressureless
  dust plus negative cosmological constant, in which the whole matter rotates relative
  to local inertial frames (no global inertial frames), and which contains closed
  timelike curves through every point.

  - Gödel''s philosophical argument (from the "Remark..." and his conversations with
  Einstein, plus the 1949 essay): if such a universe is compatible with GR and with
  the matter distribution being like ours in relevant respects, then the existence
  of a privileged objective time (and of an objective "now") is not required by the
  theory; combined with the relativity of simultaneity, this supports the ideality
  of time (a Kantian/McTaggart-ish conclusion).

  - Physical objections: the Gödel universe doesn''t expand, so it contradicts observed
  Hubble expansion; it requires a cosmological constant of a particular sign and magnitude;
  it''s not observationally supported (no rotation detected in the CMB); hence the
  solution is a mathematical curiosity, not a live physical possibility, so no conclusion
  about *our* time follows.

  - Reply: the argument is modal — it concerns what GR *permits*, and there are other
  CTC-containing solutions (Kerr interior, Tipler cylinders, wormholes), so the point
  doesn''t depend on Gödel''s particular model; also, GR''s field equations don''t
  by themselves pick out a global time function; and Malament-style results about
  definability of a cosmic time in certain spacetimes are relevant.

  - Philosophical objection: even granting CTCs, it doesn''t follow that time is unreal
  — a CTC is a temporal loop, still made of timelike steps; the "block universe" issue
  is separate; the argument conflates "no objective simultaneity" with "no objective
  temporal order." Also, Gödel needs a premise that objective time requires a unique
  global foliation into "nows," which is a contentious metaphysical premise that the
  physics doesn''t supply.

  - Third-order point: sides may be answering different questions: (a) does GR permit
  CTCs? (empirical/formal); (b) does the existence of CTCs in some model undermine
  the objectivity of time? (metaphysical, depends on what "objectivity of time" means);
  (c) did Gödel succeed in his own dialectical project (refuting Einstein''s own interpretation
  of relativity / supporting idealism)?


