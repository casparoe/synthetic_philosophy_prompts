  Question (worth 30% of the final grade, 1500 words allowed):

  ''State Kim''s causal exclusion argument, identifying each premise it needs. Then
  evaluate the following response: multiple realizability shows that the exclusion
  principle cannot apply to mental properties, since a multiply realizable property
  is not identical to any physical property. Does this response work? What should
  a nonreductive physicalist say instead?''


