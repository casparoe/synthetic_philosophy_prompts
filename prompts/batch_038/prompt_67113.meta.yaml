  Student answer draft:


  "Kim''s exclusion argument is meant to show that nonreductive physicalism cannot
  have both mental causation and the completeness of physics. It starts from three
  claims. First, causal closure: every physical event that has a cause has a sufficient
  physical cause. Second, the exclusion principle: if some event already has a sufficient
  cause, no other distinct thing can also be a cause of it, unless the effect is genuinely
  overdetermined. Third, mental causation: at least some mental events cause physical
  events, for instance my decision to raise my arm causes my arm to go up, and the
  arm going up is a physical event.


  Put these together and you get a conflict. The arm''s going up has a sufficient
  physical cause — some neural event N. My decision D, if it''s a distinct event from
  N, is excluded by the exclusion principle. And it can''t be said to be a second
  independent cause, because then every case of mental causation would be a case of
  overdetermination, which Kim thinks is not a serious possibility: systematic overdetermination,
  where it happens every single time, is not the kind of thing we accept anywhere
  else. So either D is not distinct from N, in which case it''s identical with it,
  or D does no causing. That''s the dilemma: reduction or epiphenomenalism.


  Kim adds supervenience to this. Mental properties supervene on physical ones, so
  D can''t just float free of N; there has to be some physical base. But supervenience
  doesn''t help the nonreductive physicalist, because it makes things worse: if D
  is nothing over and above N, then whatever causal work D does is already being done
  by N, and the causal powers of D drain away into its base.


  Now the multiple realizability response. The idea is that a mental property like
  being in pain is realized by C-fibres firing in us, by a completely different neural
  structure in an octopus, and maybe by silicon states in a robot. So pain isn''t
  identical to any of these. And that, it''s claimed, means exclusion doesn''t apply:
  there''s no single physical property competing with pain for the job of causing
  the behaviour, because the competitors are different in each case.


  I think this response looks attractive but fails, and it fails for an interesting
  reason. It''s true that pain isn''t identical to C-fibre firing. But that''s exactly
  the problem rather than the solution. What the exclusion principle cares about is
  whether the effect already has a sufficient cause, and it does: in the human case,
  C-fibre firing is sufficient for the wincing, and in the octopus case the octopus''s
  neural state is sufficient for the octopus''s wincing. The fact that these are different
  states in different creatures doesn''t remove the sufficiency in any one case. Kim''s
  principle is applied token by token, not species-wide, so multiply realizability
  gives you a new exclusion problem for every species you add, not a way out of the
  old one. If anything multiple realizability makes the situation worse, because it
  rules out the one move that would actually solve the problem, which is identifying
  the mental property with the physical one.


  So what should the nonreductive physicalist say instead? [Now plant errors.]


