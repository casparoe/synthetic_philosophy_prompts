  1. Lay out the distinct precise claims the one-liner could be making — as a menu,
  from the trivially true to the radical, including ones about (a) who the claim is
  about (individual working scientist vs. the enterprise of science over centuries),
  (b) what "useful" means (helps me design the next experiment / helps me get the
  right answer / helps me avoid an error / helps me know what I already assume), (c)
  whether it''s a claim about philosophy''s truth or its utility, (d) whether it''s
  a claim about the current state of philosophy or a permanent one, (e) the analogy''s
  own content: what does the bird half actually assert — birds don''t need ornithology
  for their own business, but ornithology is true of birds and about them; note that
  the analogy may concede philosophy is about science even while denying it helps,
  and note whether the analogy implies the relation is parasitic/derivative.

  2. Verdicts: which readings are platitudes nobody disputes, which are substantive
  and defensible, which are false, and which are unfalsifiable/self-undermining —
  and address the obvious charge that the line is itself a philosophical claim, saying
  whether that charge actually sticks against each reading (because a claim about
  usefulness might be empirical, not philosophical — a good nuance).

