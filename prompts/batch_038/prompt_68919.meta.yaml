  My friend and I argued for two hours last night over Ishiguro''s The Remains of
  the Day and reached nothing like a conclusion, so I would like a reading from someone
  who can hold both positions at once.


  My line: Stevens is the novel''s own counterexample to the communitarian account
  of the self. His identity is wholly constituted by Darlington Hall and by the office
  of butler — precisely what MacIntyre, Sandel, and Taylor hold up against the Rawlsian
