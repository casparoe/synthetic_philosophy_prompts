  were; the text points to a geographic boundary defined by a structure that still
  exists. Textualist: "hospital helipad" denotes the pad; a closed pad is still a
  pad (like a "closed library" is still a library); bright line chosen precisely because
  policing air traffic presence is impossible; conviction. Purposivist: purpose is
  protecting airborne patients and crews; none at risk; acquit — but must confront:
  the purpose may also be to protect the *availability* of the corridor and to keep
