  issuing from its own reasons-tracking machinery in a way that is responsive to what
  the reasons are — not a matter of being able to do otherwise in some metaphysically
  loaded sense. I''ve never found the "uncaused cause" picture attractive; it looks
  to me like wanting a miracle rather than an agent.


  3. I find the digger-wasp story genuinely illuminating — the one Dennett uses, where
  the wasp paralyzes a caterpillar, drags it to the burrow, goes inside to check the
  nest, comes back out, drags it to the entrance again, and repeats the routine forever
  even when an experimenter keeps moving the prey a few inches while she''s underground.
  My takeaway is that she is not stupid, she is rigid: her behavior is exquisitely
  tuned to a normal environment and blind to an obvious alternative that is right
  there. I use that story as my working test for whether a system is "really" choosing.


  4. But I also hold that flexibility is a matter of degree, not of kind: there''s
  a continuum from a thermostat to a wasp to a crow to a person, and nothing sharp
  happens anywhere along it.


