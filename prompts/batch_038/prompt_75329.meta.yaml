  Then describe the two poles concretely: the methodological verdict inherited from
  the 1930s (utility functions are ordinal, only unique up to increasing transformations,
  so cross-person comparisons have no factual content; hence welfare economics should
  confine itself to Pareto); the philosophers''/welfare economists'' side (prioritarianism,
  cost-benefit analysis, distributional weights, population ethics all presuppose
  comparisons; and the impossibility verdict looks like it was won by definition rather
  than argument — if you define utility as a representation of individual choice behavior,
  of course it can''t be compared).


  Paragraph 2: The friend''s argument, described in detail. Her claim: the dispute
  was never substantive; it was a badly specified estimand. Evidence from her own
  field: when the global burden-of-disease exercise stopped treating the disability
  weight as a measure of lost well-being and re-specified it as a measure of lost
  health, the numbers changed dramatically (a condition like blindness went from a
  weight near 0.6 to one near 0.2) and a large part of the standing quarrel with disability
  advocates lost its bite — because the objection had been "you are saying my life
  is worth less," and the re-specified measure does not say that. She also points
  to subjective-well-being research: people answer life-satisfaction scales, those
  answers are treated as cardinal and comparable across persons and countries, and
  they predict behavior and health outcomes; on her view the philosophical ban was
  simply overtaken by measurement. Her diagnosis: the disagreement is about estimand
  specification, not about metaphysics or meaning.


  My counter: (a) re-specifying to "health" doesn''t answer the question of whether
  welfare is comparable, it changes the question — and any health scale still has
  to be anchored by trade-offs elicited from people imagining conditions they have
  never had, which is exactly where the well-known asymmetry bites: people living
  with severe disabilities report good lives while members of the public rate the
  same conditions far lower (the so-called disability paradox). If the scale is anchored
  on imaginative projection rather than on the subject''s own experience, then which
  anchor you choose is itself a substantive normative decision, and the appearance
  of dissolution is illusory. (b) Also: the health-vs-welfare move is not available
  where the money actually goes — for end-of-life care or for conditions where health
  loss and welfare loss come apart, someone has to decide which one is being traded
  against a year of someone else''s life.


