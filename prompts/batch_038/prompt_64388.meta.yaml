  normative force: (i) a *demarcation* criterion (science vs. pseudoscience), (ii)
  an *appraisal* criterion for rationality of individual decisions, and (iii) a *historiographical*
  criterion for rational reconstruction. The anarchist''s charge bites differently
  on each. The student''s novel suggestion: the two camps disagree about (ii) but
  might converge on (i) and (iii), and the apparent verbal dispute lies in (ii).


  2. Injected crux about *timing*: whether the appraisal "programme P is degenerating"
  is a claim about a stretch of history that can be made while the stretch is still
  in progress, or only retrospectively. Both sides could agree to a test: score, blind,
  historical cases where appraisals were made in real time.


  3. Injected crux about *what would count as an operationalization*: the student
  proposes a scoring scheme — e.g., for each successive theory in a programme, code
  whether it has excess content over its predecessor and whether any of that content
  was corroborated within N years, and compute a "progress ratio." The anarchist would
  predict that coders won''t achieve inter-rater reliability above some threshold
  (since judgments of ad hocness and of "novelty" are theory-laden and retrospective),
  and the Lakatosian would predict decent reliability plus correlation with later
  community verdicts. That''s a great concrete test with recorded predictions, and
  it''s exactly the kind of thing an adversarial collaboration should include.


  4. Injected idea: a "third camp" the student wants excluded — the sociologist of
  scientific knowledge (SSK) — to sharpen that the collaboration is about rationality,
  not social explanation. Nice detail.


