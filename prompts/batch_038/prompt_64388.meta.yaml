  thesis about reference-fixing (the "necessity of a posteriori" arises because the
  reference-fixer is contingent). A plausible summary with subtle errors: e.g., "Kripke
  showed that since Hesperus = Phosphorus, it is necessary that Hesperus = Phosphorus;
  this proves there are necessary truths that can only be known by observation, which
  refutes the analytic/synthetic distinction and shows that a posteriori necessity
