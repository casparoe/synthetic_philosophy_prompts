  \ is what would be perceived by anyone who entered. Berkeley can therefore concede\
  \ the equivocation objection and still preserve the continuity of the world. Finally,\
  \ the argument is what forces Berkeley to introduce God. Because nothing can exist\
  \ unconceived, and because things evidently do exist when we are not perceiving\
  \ them, some infinite mind must perceive everything at all times; the master argument\
  \ is thus a proof of God's existence that does not depend on any further premises\
  \ about the passivity of our ideas. In all of this Berkeley takes himself to be\
  \ defending common sense: he denies that trees and stones exist in an unthinking\
  \ substance, not that they exist.\"\n\nThat's a good script with two subtle errors\
