  \ of the mind' ... \n\nLet me write the script carefully:\n\n\"Berkeley's aim is\
  \ not the sceptic but the philosopher who thinks that bodies exist in an unthinking\
  \ substance outside the mind. He thinks this view rests on a piece of abstraction:\
  \ the materialist believes he can separate, in thought, the existence of a sensible\
  \ thing from its being perceived, and so conclude that a tree could exist in an\
  \ unperceived state. §23 turns this into a challenge: try to conceive of a tree\
  \ or a house existing unconceived and unperceived. If you succeed, you have conceived\
  \ of it, and so it was not unconceived after all. The materialist cannot answer\
  \ that the tree is perceived by other people, since Berkeley's point concerns existence\
  \ apart from any mind whatever, and the materialist's own substance is defined as\
  \ unthinking and incapable of perception. The obvious reply is that Berkeley equivocates:\
  \ to conceive of a state of affairs in which nobody conceives of the tree is not\
  \ to fail to conceive of the tree; the content of my conception is one thing, the\
  \ act of conceiving another. That reply is correct as far as it goes, but it does\
  \ not defeat Berkeley, because he has an independent route to the same conclusion.\
