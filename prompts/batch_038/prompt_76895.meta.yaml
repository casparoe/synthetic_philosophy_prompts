  I''m a software engineer with no philosophy training, but I''ve been reading decision
  theory on my own because my team is trying to redesign how we settle disputes about
  architecture and incident response, and I keep running into Aumann''s agreeing-to-disagree
  result: two rational agents with a common prior who come to have common knowledge
  of each other''s posterior beliefs about some event must assign it the same probability.
  Behind it sits the common prior assumption itself — the Harsanyi/Aumann idea that
  all rational disagreement is disagreement about information, not about starting
  points, so that any apparent difference in priors should be pushed back into differences
  in what you''ve already absorbed from your history.


  I want to test that apparatus against Sidney Lumet''s 12 Angry Men, and I''d like
  you to tell me whether the film is a dramatization of it or a counterexample to
  it. I can''t work out which, and the standard things people say about the movie
  (reason versus prejudice, one man against eleven) don''t help me decide.


  The puzzle I want pressed: all twelve men sit through the same trial and hear the
  same evidence, so on the assumption they share a common prior, they should enter
  the jury room already in agreement. Eleven vote guilty. [then bullets]


  Then the specific questions:

  1. Which jurors'' positions are best read as prior differences rather than information
  differences, and which are actually differences in likelihoods — how much weight
  eyewitness testimony carries, how much a boy from the slums is trusted? Does the
  film mark the distinction, or does it treat all three as one thing?

  2. Juror 8''s case is built almost entirely on facts that were already public: the
  knife''s supposed uniqueness, the elevated train''s noise, the downstairs witness''s
  damaged leg and his stated timing, the marks a pair of glasses leaves on a nose.
  He isn''t disclosing private information; he''s making common knowledge salient.
  Aumann''s mechanism is the iterated announcement of posteriors. Is the film showing
  a process the theorem covers, or one it conspicuously doesn''t — agreement driven
  by argument over evidence nobody had bothered to look at?

  3. Read the secret ballot as mechanism design. Juror 8 proposes a private vote after
  his arguments fail and abstains from it himself, and exactly one other man comes
  out not guilty. Public voting would have announced an unbroken eleven and probably
  left the twelfth unwilling to be the visible dissenter. Does the film understand
  that it is protecting the revelation of private information, and what does that
  imply about whether the deliberation is rational herding reversed or genuine belief
  revision?

  4. The last holdout converts by tearing up a photograph of himself and his son and
  breaking down, not by an argument; an earlier switch by the juror who cares mainly
  about making the ballgame is explicitly rebuked by another juror as weightless.
  Only one late conversion (the stockbroker''s, over the glasses) is evidence-driven.
  Given that, is unanimity here truth-tracking convergence, or convergence that came
  apart from truth-tracking? Does that vindicate the common prior assumption — priors
  were the whole problem, and once Juror 3''s collapsed the room agreed — or refute
  it?


