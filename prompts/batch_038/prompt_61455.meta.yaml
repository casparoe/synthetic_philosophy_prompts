  by trade, and a man who thought the traditional arguments for immortality couldn''t
  carry any weight and wanted something empirical instead. What sticks with me is
  that he never got it, and that he understood better than anyone why it was so hard.
  Two problems, roughly: first, any apparent hit has to survive fraud, cold reading,
  sensory leakage and cryptomnesia before it''s even interesting; second, and worse,
  even a hit that survives all of that might show only a genuine supernormal faculty
  — telepathy out of living minds, or straight clairvoyance — rather than a dead person,
  because information can turn up without anybody turning up with it. The cross-correspondence
