  Content design:


  Setup case posed by the instructor: A city''s school board cancels a selective gifted
  program (and the associated advanced coursework) rather than extend equivalent resources
  to the lowest-performing schools; budget is fixed such that no one''s prospects
  improve, the disadvantaged students are exactly as well off as before, and the advantaged
  students are made worse off. The question the seminar was asked: is this outcome
  in any respect better than the status quo ante, and does the answer depend on whether
  you are an egalitarian or a prioritarian?


  Then the argument:


  (1) Nadia: prioritarian. The leveling-down objection is decisive against telic egalitarianism.
  If equality is non-instrumentally valuable, then the cancelled-program world is
  in one respect better than the status quo — equally good in fact, since the pattern
  is now perfectly equal — yet nobody is better off and some are worse off. A value
  that can only be served by making people worse off isn''t a value; the "in one respect
  better" claim is empty.


  (2) Owen: The inference smuggles in a person-affecting constraint. "Better" is doing
  all the work. If we already accept (as the prioritarian does) that outcomes can
  be better in a way that isn''t reducible to being better for anyone in particular
  — because priority weights make a benefit to a low-welfare person count for more
  than an identical benefit to a high-welfare person, which is a feature of the outcome,
  not of any person''s situation — then the egalitarian''s claim isn''t a different
  kind of claim, just a less familiar one. The objection therefore begs the question.


  Hmm, careful: is that a good argument? The prioritarian''s weights do make the value
  of an outcome depend only on individuals'' absolute levels; the "betterness" is
  fully determined by who gains and loses. So Nadia''s reply (3) is: no impersonal
  residual — every comparative judgment is traceable to individual-level changes.
  Good.


  (3) Nadia: disanalogy. On the prioritarian view, the value of a distribution is
  a sum of weighted individual levels; so whenever one outcome is better than another,
  someone must be better or worse off in it, and the difference in value is fully
  accounted for by those individual differences. There is no residual respect in which
  the pattern itself adds value. Equality, by contrast, is supposed to add value that
  survives when every individual change is a loss. That''s the special defect.


  (4) Owen: If that''s the real principle — a respect counts only if it is traceable
  to someone''s being better off — then it rules out far too much. We say a world
  with a thriving coral reef and an intact cathedral is in one respect better than
  one where both are gone, even if the last person to enjoy them is dead. We say a
  species-rich ecosystem is better in one respect than a monoculture. Nobody is better
  off in those cases. If Nadia''s principle disqualifies the egalitarian''s respect,
  it disqualifies every non-welfarist value. So the objection isn''t an argument against
  egalitarianism; it''s an argument for welfarism, and Nadia owes us that argument
  separately.


  (5) Nadia: disanalogy again — and this is my injected novel distinction. In the
  reef and cathedral cases, the respect in which the world is better is not constitutively
  tied to loss: the same respect could in principle be improved by additions, and
  nothing about being a flourishing reef requires that anyone be made worse off. The
  egalitarian''s respect is different in kind: the improvement consists *in* the reduction
  of the well-off. Equality-by-leveling-down is a respect whose only available route
  to realization is harm. A value that can be realized only by making people worse
  off can''t generate reasons, and that is what "not a value" means here.


  Hmm, but Owen can push: the reef case could also be realized only by harm in the
  actual circumstances (e.g., preserving the reef requires flooding a town). So Nadia
  needs the distinction to be about the *kind* of respect, not the circumstances.
  Let me make Owen press exactly that:


  (6) Owen: then the distinction collapses. Whether a respect can be served only by
  harm is a contingent matter about the options available, not a fact about the respect.
  Preserve the reef and you drown a village; and conversely, there are egalitarian
  policies — progressive inheritance taxes funding early-childhood care — where reducing
  inequality makes the worst off better off and the rich only marginally worse. If
  "can only be realized by harm" is the disqualifier, the egalitarian''s value is
  disqualified in some choice situations and vindicated in others, which is not a
