  Draft:


  ---


  I''m a backend engineer at a mid-size logistics company, and outside of work I''ve
  gotten deep into a debate with two friends about "geometric" versus "expected value"
  reasoning about risk. One friend keeps insisting that any rational long-run agent
  should maximize the time-average growth rate of their wealth rather than the expected
  value of a payoff, and that this is a theorem about dynamics, not a disguised taste
  for logarithms; the other insists that the whole business is just expected-utility
  theory with a log utility function, relabeled, and that whenever you think you''ve
  found a case where the growth-rate criterion says something different, you''ve actually
  changed the utility function or the accounting. I keep finding that I can''t tell
  which of them is right, because I can''t construct a clean example where the two
  criteria genuinely come apart. So I''d like you to build one for me to bring to
  the next argument.


  Specification: design a concrete decision problem — ordinary setting, ordinary money,
  numbers you can check with a calculator — in which an agent who maximizes expected
  utility with a logarithmic utility function and an agent who maximizes the asymptotic
  time-average growth rate of their wealth choose different actions. The case must
  not be a case where one of the two is simply applying their rule to the wrong thing
  by accident: state explicitly what variable each agent is tracking, and make sure
  both are being internally consistent. If you can''t make them come apart, say so
  and give me the closest thing you can: a case where the apparent divergence looks
  real but dissolves under a stated reinterpretation, with the dissolution worked
  out in detail. Either way, I need the arithmetic.


  After the scenario: (a) show both calculations side by side, including the expected-value
  calculation for a risk-neutral agent so I can see the third opinion; (b) identify
  the single structural feature of the case that makes the log-utility agent and the
  growth-rate agent peel apart, and show what happens if you delete it; (c) tell me
  how each of my friends would attack the case — specifically, what the "it''s just
  log utility" person will say the divergence really consists in, and what the "it''s
  about dynamics" person will say about why their criterion is not a utility function
  at all; and (d) say whether the case depends on the horizon being infinite, and
  what happens at a horizon of, say, ten rounds.


  One more constraint: no ruin-by-stipulation tricks (a gamble that loses 100% of
  wealth with probability p is fine only if the divergence doesn''t come entirely
  from the -∞ in the log), no borrowing, no leverage, and no appeal to insurance markets
  or counterparties who are willing to take the other side of the bet at favorable
  terms. The point is to see whether the disagreement between these two views is substantive
  or verbal, so a case that smuggles the answer in by assuming one of them is off-limits.


  ---


