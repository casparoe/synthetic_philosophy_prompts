  Argument sketch:

  1. Downs: voting looks irrational because the probability of being decisive, p,
  is astronomically small relative to the private benefit B, so pB < C.

  2. The standard reply rescales B upward: what is at stake is not my own welfare
  but the aggregate welfare of the polity, so pB_social can exceed C even when p is
  tiny. This reply is about the magnitude of the stakes, not about the quality of
  the decision.

