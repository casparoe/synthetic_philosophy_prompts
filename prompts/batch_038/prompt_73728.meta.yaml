  the election is close because the signal-holders disagree or where their numbers
  happen to balance. Conditioning on being pivotal therefore degrades the probability
  that the uninformed voter picks the better outcome; below some threshold the uninformed
  voter''s expected contribution is negative even when voting is costless, so abstention
  is the equilibrium response. (Feddersen and Pesendorfer''s result, extended by the
