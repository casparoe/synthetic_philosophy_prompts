  Step 3 (Untouchability): "If S is true today, then nothing I do today or tomorrow
  can make it the case that S was false today." Under a counterfactual reading of
  ability: I have the ability to do A only if there''s a possible course of action
  available to me such that if I took it, S would have been false. The standard move
  (Lewis, and the "Ockhamist" response) is that the fixity of the past applies only
  to the *hard* past — S''s being true today is not a hard fact about today if its
  truth depends on tomorrow. So the Ockhamist denies (3) as stated: the truth of S
  today is a "soft fact" about today, and by preventing the battle I would be able
  to make it the case that S was false — not by changing anything, but because ability
  is analyzed counterfactually, and in the nearest world where I prevent the battle,
  S was never true. So (3) equivocates: "make it the case that S was false" can mean
  *change* S''s truth value (impossible, but irrelevant — nobody claims that ability
  requires change) or *act so that* S was false (perfectly coherent under counterfactual
  ability). The asker''s defense — "that just means making it the case that S was
  false all along, which is what (3) says is the best I can do; so I think they''ve
  agreed with me" — is a good subtle trap: (3) as stated says the best I can do is
  bring about a situation in which S was false all along, which is *exactly* what
  the Ockhamist says I can do when I prevent the battle. So (3), read charitably,
