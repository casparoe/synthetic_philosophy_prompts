  Here''s roughly the two camps as I see them [describe]. Carnap-style side: inside
  a chosen framework, analyticity is just a matter of the meaning postulates you stipulate,
  the notion is technically well-defined there, and it earns its keep by explaining
  necessity and the a priori and by licensing the internal/external question distinction...
  Quine side: the whole family of intensional notions (analyticity, synonymy, necessity,
  self-contradiction, meaning postulate) is a circle you can''t break into from outside;
  the only clean cases are the artificial languages, where ''analytic'' just reports
  what the designers decided, so the term does no explanatory work; plus holism —
  any sentence can be held true come what may if you make drastic enough adjustments
  elsewhere, and no sentence is immune in principle, so the analytic/synthetic boundary
  is at most a difference in how centrally entrenched a belief is.


  Then the intermediate positions I know about: Grice and Strawson argue that the
  systematic agreement in how people sort examples, and the reaction of surprise when
  someone proposes a counterexample, already shows the distinction is a real one and
  that Quine hasn''t earned his rejection; Boghossian splits analyticity into a metaphysical
  notion (true purely in virtue of meaning) and an epistemic one (justified in believing
  it merely on the basis of understanding it) and says Quine''s arguments at most
  kill the second.


  Now here''s my bit, which is the reason I''m asking. Last term I ran a little stripped-down
  exercise: I took the word ''analytic'' away entirely and just asked people two questions
  about each sentence — (a) could a competent speaker who understands it rationally
  withhold assent, and (b) if it turned out false, would that force us to say the
  speaker had been misusing a word rather than making a mistake about the world. The
  Carnapians and the Quineans gave the same answers to about 90% of the cases: ''all
  bachelors are unmarried'', ''7+5=12'', the axioms, the classical logical laws —
  everyone agreed on those. The splits came on: ''whales are fish'' (pre-Linnaeus),
  ''all vixens are foxes'' once you learn the biology, and ''every event has a cause''.
  And interestingly, when people disagreed about the classification they generally
  agreed on the underlying facts and disagreed about which way the explanation should
  run: is a sentence immune-to-revision because its truth is fixed by meaning, or
  does its truth get ''fixed by meaning'' as a way of describing the fact that it''s
  so central we won''t give it up? Same verdict, opposite explanatory order.


