  Wolpert''s no-free-lunch theorems for machine learning: over the set of all possible
  target functions (all possible input-output mappings), for any two learning algorithms,
  the off-training-set error averaged over all target functions is identical. So there''s
  no learning algorithm that is better than any other across all possible problems.
  Crucially, this requires averaging over all functions with equal weight (or, in
  a more general version, over a distribution that is "uniform" in the relevant sense).
  Any algorithm that does well on some set of functions must do badly on others.


  Wolpert & Macready''s NFL for search/optimisation: for any two non-resampling search
  algorithms, the distribution over the cost/values of the sequence of visited points
  is the same across all possible fitness functions. The "sharpness" formulation:
  the sum over all fitness functions of the probability of a given "off-diagonal"
  ... The key result: the averaged performance over all possible objective functions
  is identical for all search algorithms.


