  - In the weeds: inject specific distinctions.


  Draft:


  ---


  Two years ago my daughter, then eleven, had surgery for dense congenital cataracts
  in both eyes. She had never had patterned vision — light and dark, a hand in front
  of her face, nothing more — and she had grown up knowing the world entirely through
  her hands, her ears, and a stick. She now has, by the surgeons'' measures, usable
  acuity: she can detect motion, follow a ball, notice a doorway. But she still cannot
  pick her own cup out of a cupboard without reaching in and finding it, she cannot
  tell a cube from a sphere at arm''s length unless she is allowed to look at it for
  a long time, and she has never learned to read print despite two years of lessons.
  In trying to understand whether that was expected, I fell into the literature on
  Molyneux''s problem — the question Locke printed from his correspondent about the
  man born blind who can distinguish a cube from a sphere by touch and is then made
  to see: whether by his sight, before he touched them, he could now distinguish and
  tell which is the globe, which the cube.


  What struck me is that this debate has now run for more than three centuries, that
  we finally have data from exactly the cases it imagines, and that nobody has moved.
  ... positions: the empiricist negative answer (Berkeley: no necessary connection
  between the tangible and the visible; the connection is learned by correlation),
  the qualified affirmative (Leibniz: extension is common to both, so the newly sighted
  man can reason his way from what he feels to what he sees), Reid''s conditional
  answer (two-dimensional figures should transfer, solids should not, but a blind
  geometer could work out which visible figure corresponds to the solid he knows),
  and the modern camps: those who read the cataract-restoration studies as settling
  the question in the negative, those who say the studies are about something else
  entirely — the effects of missing the sensitive period for visual development —
  and so leave Molyneux''s question untouched, and those who say the question was
  never empirical, because "could he distinguish" is really asking whether visual
  and tactile experience share content, and no forced-choice matching task can answer
  that.


  My working hypothesis, which I''d like you to test rather than accept: the dispute
  has outlived its question because at least three questions have been run together
  under one heading — an architectural question about how visual object recognition
  is acquired, a conceptual question about whether there are properties available
  to both sight and touch or only modality-specific ones, and a phenomenological question
  about what it is like to see — and the empirical results bear on the first while
  the arguments are conducted in the vocabulary of the second. But I suspect I''m
  being too neat, and that the conceptual question may not be separable: what counts
  as "the same shape seen and felt" may itself determine what the experiments are
  measuring.


  So: diagnose the stall. Which of these is it — a substantive disagreement, a verbal
  one about "distinguish," "see," or "recognize," two or three questions answered
  under one name, a hidden empirical question the philosophers think is conceptual,
  or a conceptual question the scientists think is empirical? Ground the diagnosis
  in what each side actually says, including the specific points on which they should
  agree but don''t: whether the man in the thought experiment is allowed time to look
  and to move, whether a forced-choice match under brief presentation is the same
  task as unhurried identification, whether the newly sighted subject''s failure is
  evidence of no transfer or of a system that never developed, and whether a cube
  seen from a new angle is even the shape he learned by touch.


  Then tell me what would count as progress given your diagnosis: a stipulation, an
  experiment that dissociates transfer from deprivation, a theorem about what any
  account of perceptual content must imply, a change of subject, or nothing at all
  — and if the honest answer is that this question cannot be settled, say why and
  what that leaves us with.


  Finally, and this is the part I most want answered without being patronized: does
