  Requirements:

  - Type: stalled-debate diagnosis. Deliverable: diagnosis (verbal vs substantive,
  different questions under one heading, hidden empirical question, etc.), supported
  by what each side actually says, plus what would count as progress or an argument
  that none is possible.

  - Personal relevance, formal/polished tone.

  - No requests for citations/reading lists. (I must not ask "name the studies" —
