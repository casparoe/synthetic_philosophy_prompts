  I am helping vet the decision-theory chapter of a general-audience book on rationality
  before our reading group works through it, and one passage has me unsure how much
  of it to trust. It runs roughly as follows:


  "Hofstadter''s Platonia dilemma asks you to imagine that twenty people, each a leading
  rational thinker, are separately offered a billion dollars on a single condition:
  exactly one of them must send a telegram claiming it. If two or more reply, or if
  none does, nobody is paid. The twenty cannot contact one another, and each knows
  the others are just as rational as she is. Ordinary decision theory says to send
  the telegram, since your message cannot causally affect anyone else''s and it is
  your only shot at the money. Hofstadter''s alternative, superrationality, sees that
  the twenty decisions are causally coupled: agents running the same reasoning procedure
  on the same problem produce the same output, so if you send, all twenty send, and
  the prize evaporates. The superrational thing is therefore to stay silent — which,
  since all twenty reach that conclusion together, is at least a stable one. Hofstadter
  then tested the idea with his Luring Lottery, a real-world version of the same dilemma
  run through a magazine column, and the replies showed that most people do reason
  superrationally once the symmetry is made explicit."


  I suspect several of these sentences are doing more work than they can bear, but
  I cannot locate the failures precisely. Could you audit the passage claim by claim,
  separating what is accurate, what is a defensible simplification, and what Hofstadter
  himself would reject? Four things in particular:


  1. Is "causally coupled" a fair gloss on superrationality, or does it conflate the
  view with something its author took pains to disclaim? If it is a conflation, what
  is the relation superrationality actually posits between the twenty decisions?

  2. Is staying silent really the superrational recommendation in Platonia? Work through
  what superrationality yields when the twenty are restricted to the same pure strategy,
  and say whether the passage has skipped a step — and if so, what the skipped step
  needs in order to work, given the stipulation that the participants know each other
  to be reasoning identically.

  3. Does the passage''s account of what ordinary decision theory recommends survive
  scrutiny? I am not convinced that sending the telegram is dominant once you condition
  on the others'' likely behavior.

  4. Whatever the lottery experiment showed, could it have shown what the last sentence
  claims?


  Finally, tell me which of these problems is fatal to the passage''s overall argument
  and which are merely loose phrasing I could tolerate in a popular treatment.


