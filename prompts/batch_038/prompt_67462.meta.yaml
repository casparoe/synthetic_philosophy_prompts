  Structure of the prompt:

  1. Context: who I am (sixth-form/senior, secretary of the Philosophy Society), the
  meeting, the audience (~30 members aged 15–18, no prior philosophy), the deliverable.

  2. What I want: a self-diagnostic quiz + a taxonomy/tree, in that order or the reverse.

  3. Constraints on questions: 10 questions, 3 options each, all concrete cases, plain
  language, no labels, no meta-questions about which label you like, no jargon (define
  jargon only in the key), the cases must be original and must not be the two canonical
  ones (murderer at the door; the presidential deposition).

  4. Case pool requirements (at least one from each): truthful-but-omissive commercial
  statement; ambiguous phrase the hearer resolves wrongly; lie told to someone who
  has forfeited the right to the truth; lie that the hearer sees through; misleading
  later voluntarily corrected; misleading that causes more harm than the lie would
  have; indifference to truth (speaker who doesn''t care whether the statement is
  true); a case where the speaker is uncertain of the truth themselves (does asserting
  what you believe false require belief or mere absence of belief?); a case involving
  a promise/nondisclosure agreement (when silence is permitted).

  5. Axes requirement: before the tree, list the claims that split positions — e.g.,
  what makes a lie wrong (deception, violation of an assurance/warrant, breach of
  the norm of assertion, harm), whether the moral difference is one of kind or degree,
  whether the hearer''s entitlement to the truth is context-dependent, whether the
  speaker''s belief state matters (belief in falsity vs. absence of belief in truth
  vs. indifference), whether successful deception is required, whether what''s said
  vs. what''s implied bears moral weight differently.

  6. Leaves: each named descriptively and, where the literature has a name, with it;
  each leaf gets its "most awkward commitment" — the case it handles worst.

  7. Unoccupied combinations: identify at least three answer-patterns that are logically
  available but that nobody seems to hold, and diagnose each as incoherent, unattractive,
  or merely unexplored.

  8. Inseparable pairs: flag which two positions my quiz cannot distinguish, and say
  what extra question would be needed.

  9. Scoring key: mapping from answer patterns to positions, with tie-breakers and
  a way to handle mixed patterns; also a one-paragraph "what your result means" blurb
  per leaf.

  10. Also mention that I want the term of art for truthful-but-misleading statements,
  and I want a note on the historical doctrine of silent restriction of meaning (mental
  reservation) — where it lands in the tree.

  11. Length/format notes: keep the quiz usable on one printed page per question;
