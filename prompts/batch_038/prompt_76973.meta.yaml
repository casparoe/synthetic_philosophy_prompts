  Paragraph 1 — setup, personal relevance, some incidental detail:

  "I work in localization for a small academic press in the humanities — mostly French
  and German monographs, some translated poetry in the back lists — and last month
  our managing director asked me to draft the internal case for moving our entire
  translation workflow onto a large-language-model pipeline with a single human post-editor
  per volume. I have been trying to write that memo for three weeks and keep finding
  that the version I can defend to the board is not the version I believe. Partly
  to sort out my own thinking, I reread Douglas Hofstadter''s Le Ton beau de Marot,
  which one of our translators pressed on me years ago, specifically the long stretch
  of the book built around Clément Marot''s little poem to a sick young lady, where
  he collects dozens of English renderings of the same twenty-eight short lines and
  uses them to make his case that the systems of his day were doing something categorically
  shallower than translation."


  Paragraph 2 — the task:

  "Here is what I want: make the best possible argument for the position that the
  fluency of contemporary neural translation does not refute Hofstadter''s charge
  but, on the contrary, vindicates it. The version of the charge I care about is not
  the old Turing-test-flavored claim that the machine has no inner life; it is narrower
  and, I think, harder to dismiss. A translator, on Hofstadter''s way of putting it,
  has to construct a model of the situation a text describes and then choose words
  that re-present that situation in a new language — which is why the same person
  can answer questions about the passage, say what is at stake in a joke, flag a deliberate
  ambiguity, and tell you which of two renderings is closer to the author''s intent.
  The argument I want you to build should contend that today''s systems still do none
  of this, and that their characteristic failure modes — flattening register, resolving
  ambiguities the original left open on purpose, harmonizing an idiosyncratic voice
  into house style, and inventing confident content when the source underdetermines
  it — are exactly the signatures of a process that matches textual form without consulting
  any situation. I would also like you to press a point I have not seen anyone make
  cleanly: these failures are largely invisible to a reader who does not know the
  source language, so a market that grades output on fluency alone is systematically
  selecting for errors that no one on the buying side is positioned to catch. Fluency,
  in other words, has come apart from fidelity, and Hofstadter''s complaint was never
  about fluency."


