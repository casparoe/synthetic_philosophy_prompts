  "Two further constraints. First, do not strawman the opposing side: confront the
  strongest replies directly, in particular (a) that these are engineering defects
  of the current generation rather than a conceptual limit, of the same kind people
  predicted about statistical phrase-based systems before neural methods embarrassed
  them, and (b) that LLMs now actually satisfy Hofstadter''s own ancillary demands
  — they can summarize a text, answer questions about it, explain a pun, and justify
  a translation choice — which arguably means his test has been met and the charge
  of shallowness has lost its content. Say why those replies do or do not defeat the
