  Now write the prompt. Type: "Ask why a debate has stalled and what kind of disagreement
  it really is." Domain: Church-Turing thesis and its epistemic status.


  Structure: 2–3 paragraphs, formal/polished, with context detail (e.g., the asker
  is preparing a session for a graduate reading group / co-teaching a seminar in philosophy
  of computation, or has been in a working group for a year). Describe the debate
  concretely with positions:


  Camp A: CTT is a conceptual/definitional claim; its content is the extensional coincidence
  of λ-definability, general recursiveness, and Turing computability, which IS provable;
  the "thesis" part is not empirically falsifiable because "effective" is an informal
  notion fixed by Turing''s analysis of what a human computer following rules without
  insight can do; no counterexample has ever been produced in ninety years; the only
  interesting work is axiomatizing the notion (Gandy''s principles, machine/symbolic
  computation axioms) and proving restricted versions.


  Camp B: CTT, or at least its physical variant, is an empirical hypothesis about
  the world, falsifiable in principle by hypercomputation: relativistic Malament–Hogarth
  machines, accelerating/Zeno machines, analog real-number machines, trial-and-error
  machines; and Deutsch''s principle that a universal computer can simulate any physical
  process gives it physical content. On this reading, CTT is not yet refuted only
  because the exotic machines aren''t physically realizable (infinite precision, unbounded
  energy, spacetimes not known to exist).


  Camp C maybe: those who say the "Church-Turing fallacy" — sliding from claims about
  human rote computation to claims about what any physical system can do — makes the
  whole hypercomputation debate a category confusion; or those who say the debate
  is about the mind.


  The asker''s hypothesis: the disagreement is largely verbal — "effectively computable"
  is being used with two different extensions fixed by two different practices (one
  by conceptual analysis of rule-following, one by physical realizability), so the
  camps answer different questions under one heading, and the apparent impasse follows.
  But the asker is uneasy: maybe there IS a substantive residue — e.g., whether the
  notion of "effective procedure" is answerable to physics at all; whether Gandy''s
  principles are themselves empirical assumptions in disguise (boundedness/locality
  look like physical constraints, not conceptual ones), so the "conceptual" proof
  smuggles physics in; and whether the empirical camp has any content if no finite
  experiment could refute it (a machine that outputs an uncomputable function — how
  would we know it isn''t broken? And any finite run of a purported hypercomputer
