  the policy is an event/contract whose payoff depends on the underlying; the government
  is issuer and CCP; the voters'' decision is a settlement rule. Residues: (1) the
  reflexivity problem — a market''s price changes the policy adopted, which changes
  the underlying, so the price is not a forecast of a fixed future but an input to
  the thing forecast (there is a counterpart in benchmark governance: manipulation
  and the "index inclusion effect", so maybe this translates); (2) the conditional-payoff
  problem — the payoff must be conditional on a policy being adopted, which requires
  a market that trades on counterfactuals that will never obtain, and hence no settlement
  and no discipline on prices (the "conditional market never pays" problem — this
  is a known issue, e.g., the difference between unconditional and conditional markets,
  and the "which-policy-will-be-adopted" market vs the "payoff-if-adopted" market;
