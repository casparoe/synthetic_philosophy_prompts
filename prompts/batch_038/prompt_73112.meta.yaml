  Also the "who trades" question: prediction markets for policy effects would be traded
  by a tiny number of specialists, and their prices would embed their priors — a market
  is only as good as the marginal trader.


  Another crux: the futarchist claim that the market''s price is an unbiased estimate
  of the conditional expected welfare given adoption. In my vocabulary: the price
  is not an expectation; it''s an equilibrium outcome of trading under constraints,
  containing a risk premium and a liquidity premium. So a "market estimate of expected
  welfare" needs to be decomposed into expectation plus risk premium plus liquidity/pressure
  effects — and a policy whose conditional contract carries a large risk premium will
  be systematically undervalued, meaning futarchy would reject policies whose payoffs
  are correlated with the traders'' other exposures (e.g., a policy that pays off
  only in a recession — precisely the kind of policy you might want). That''s an excellent,
  precise residue: the risk-premium problem. It has no counterpart in the futarchist''s
  argument as usually stated (they treat price = expected value), and it is a genuine
  defect of the original claim, discovered by the target vocabulary. This shows the
  translation is two-way. I''ll include that as one of the specific cruxes to ask
  about.


