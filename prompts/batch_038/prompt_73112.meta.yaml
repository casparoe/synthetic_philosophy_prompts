  the problem that conditional markets on non-adopted policies have no resolution,
  so their prices are untested — this maps onto nothing in market structure because
  in derivatives every listed contract settles). That''s a genuinely sharp residue
  with a real market-microstructure counterpart: contracts that never settle cannot
  be disciplined by arbitrage; there''s no analogue in listed derivatives because
  every contract has a determinate payoff at expiry. (3) the metric-definition problem
