  ---


  I teach an upper-level undergraduate seminar in political theory on defeat and collective
  memory — eighteen students, mostly seniors — and I am writing their three-hour closed-book
  final. Over the term we worked through four cases in which a military or political
  disaster was converted into a usable national story: the Confederacy''s Lost Cause,
  Masada, the battle of Kosovo in 1389 and the myth that grew up around it, and Dunkirk.
  The final has two essay questions; the one I need from you is worth 25 of the 100
  marks, and students will have roughly fifty minutes on it. They will have nothing
  in the room, so the question must supply any historical detail it depends on, and
  neither the question nor the model answer should require or supply citations. Please
  don''t attribute positions to named scholars or books; if a view has an author,
  describe the view.


  Here is the difficulty I want the question to sit on. The distinction my students
  arrive with — and the one our textbook-ish framing encourages — is between tragic
  memory and redemptive myth: a defeat either is remembered as loss and warning, or
  is reframed as a moral victory that was worth the cost. That distinction is useless
  for sorting the cases, because it puts Dunkirk and the Lost Cause on the same side
  (both are redemptive, both turn catastrophe into proof of character) and Masada
  and Kosovo on the same side (both bind sacrifice to a covenant and a promised future)
  — which is precisely the wrong grouping, since in ordinary liberal usage the first
  pair and the second pair are supposed to be the tolerable and the intolerable cases.
  So I have been working with a candidate criterion of my own, which for seminar purposes
  I call the creditor test. Every redemptive myth of defeat is a story about an unpaid
  debt left behind by the dead; the test asks whom the myth makes a debtor. An inward-debt
  myth binds the living only to their own future — endure, rebuild, keep faith, do
  not let it happen again. An outward-debt myth generates claims on other people —
  on land, on status, on submission, on redress, on revenge. I think this sorts the
  cases better, but I am not confident it survives contact with them, and I want the
  question to be built where it strains. Four pressure points, which you can use or
  improve on: Dunkirk looks purely inward-facing, yet it was pressed into service
  as justification for holding an empire and for treating a rout as a moral triumph,
  and its most beloved image, the flotilla of little ships, sits on top of the fact
  that most of the men came off naval vessels and the harbor mole; Masada looks inward,
  and is usually retold that way, while resting on a single ancient account that describes
  its defenders as a band of Sicarii; the Lost Cause looks outward, in its claims
  against Black citizens and against the federal government, but it also supplied
  a genuinely inward-facing self-image of endurance to a defeated region; and Kosovo
  looks outward in its modern nationalist uses, while under Ottoman rule it apparently
  functioned as a fatalistic accommodation to rule rather than a claim against it.


  What I want: one essay question, not a set. It has to be answerable from argument
  alone — a fluent narration of any one of the four cases should not score above the
  midpoint — and it should force the student either to reconstruct a criterion of
  their own or to take mine apart, and to say what evidence or what case would falsify
  whichever criterion they defend. Build the creditor test into the stem, stated crisply
  enough that a student who has never heard of it can work with it in fifty minutes,
  and leave room for a strong answer to conclude that the test grades the wrong feature.
  Then give me: (1) the question as the students would see it, including any supplied
  detail; (2) a model answer of about nine hundred words that commits to a definite
  verdict on the test and argues for it rather than listing positions; (3) a marking
  scheme as a table with exactly these columns — band and mark range out of 25; the
  moves the answer must contain to earn that band; the characteristic failure that
  caps an answer at that band; the comment I would write in the margin; and a one-line
  diagnostic question I could ask in a viva that would reveal whether the student
  actually has the move or has stumbled into the right vocabulary; and (4) after the
  table, a short JSON object with the fields crux (one sentence on what the question
  really tests), recitation_ceiling (the highest mark a purely recitational answer
  can reach and why), test_verdict (the model answer''s committed verdict on the creditor
  test), discriminating_moves (array of strings, each a move that separates a first-class
  answer from a good one), and strongest_objection (the best objection a student could
  raise against the framework built into the stem, and how the scheme credits it).
  I would rather you tell me my framework is wrong and build a better question around
  a better criterion than hedge between the two — take a position and give your reasons.
  Write everything in American English.


