  Hmm, one issue: the prompt says "the familiar accuracy-theoretic results (probabilism
  as a dominance theorem, conditionalization as a diachronic dominance or Dutch-strategy
  theorem)" — those are real and I''m confident: Joyce''s argument for probabilism
  via Brier-score domination; Greaves & Wallace''s argument that conditionalizing
  maximizes expected accuracy; the myopic Dutch strategy argument (Hilpinen, Skyrms;
  also Levinstein). Safe.


  Is "averaging over a partition" vs conditionalizing a real point? Yes — the "averaging/Jeffrey
  conditionalization" literature: Jeffrey conditionalization vs. standard; and there''s
  debate about whether accuracy arguments support Jeffrey conditionalization. Fine
  as a general claim, framed as what the sensitivity camp says.


  Imprecise credal states being accuracy-dominated: yes, that''s a real debate (the
  "accuracy argument against imprecise credences," and responses that the domination
  depends on the rule/aggregation). Safe.


  "Doctrines like the Principal Principle" — hmm, that''s not really a scoring-rule
  matter. Better examples of rule-relative verdicts: whether imprecise credences are
  dominated; how extreme credences must be to avoid domination; whether certain "non-conglomerability"
  issues... Let me replace the Principal Principle with something safer: "and which
  credence functions count as impermissibly incoherent in the first place." Or: "whether
  the arguments even establish what their authors claim to establish — e.g., whether
  a diachronic accuracy argument supports conditionalization or only a weaker policy
  of updating on evidence one is certain about." Actually there''s a known criticism:
  the diachronic accuracy argument (Greaves–Wallace style) has been argued to support
  conditionalization only under the assumption that the agent is certain about which
  evidence she''ll get / that it supports "plan to conditionalize" rather than conditionalize.
  That''s a real point and safe to attribute as what a critic says. Good.


  Let me also consider the mixture claim once more: "a positive-weight mixture of
  strictly proper scoring rules is strictly proper." Expected score under mixture
  = (1-λ)·E_Brier + λ·E_Log. Each term is uniquely maximized at p = q (true credence).
  A positive combination of two functions each uniquely maximized at q is uniquely
  maximized at q? Careful: if f and g are both uniquely maximized at q, then for p≠q,
  f(p) < f(q) and g(p) < g(q), so (1-λ)f(p)+λg(p) < (1-λ)f(q)+λg(q). Yes, strictly
  proper. Correct. Good — and this is a nice detail that shows the model whether the
  asker''s rule is admissible by the robustness camp''s own lights.


  Should I double check the log score is strictly proper for finite partitions? Yes,
