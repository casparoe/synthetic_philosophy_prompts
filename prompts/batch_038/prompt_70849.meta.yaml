  as a dominance theorem, conditionalization as a diachronic dominance or Dutch-strategy
  theorem) go through for any scoring rule that is strictly proper, and strict propriety
  is not an optional extra: it is just the formal statement of the idea that a credence
  function should expect itself to be the most accurate available. On this view, which
  particular strictly proper rule one uses is a free parameter, like the choice of
  units, and any worry that the results are hostage to that choice misunderstands
  what the theorems claim.


  On the other side — the sensitivity camp — the reply is that this deflationary description
  is false in the cases that matter. Which of two non-probabilistic credence functions
  is worse, whether a given imprecise credal state is accuracy-dominated, whether
  averaging over a partition or conditionalizing on it is required, and how sharply
  a credence function must peak in order to avoid being dominated all depend on the
  rule and not merely on its strict propriety. And this camp adds a methodological
  charge: strict propriety cannot be motivated without already assuming something
  like the accuracy-first picture the theorems are meant to establish, so the free
  parameter is not free — it is smuggled in.


