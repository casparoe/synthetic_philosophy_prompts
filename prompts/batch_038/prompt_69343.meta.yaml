  to private clients. Its advertisement claims that its products are, in the firm''s
  phrase, ''indistinguishable from the real thing''. [Note: quotes here are my own
  invented slogan, not a real text — fine.]


  The complaint comes from a rival firm whose own products are marketed on the principle
  that what an artificially induced hallucination and a genuine perception have in
  common is exactly what makes them indistinguishable — a common factor that can be
  specified, tested and advertised. The complainant alleges that the first firm''s
  claim is misleading because it can produce no specification of any property its
  product shares with a veridical perception, and hence no basis on which a consumer
  could verify the comparison.


  The advertiser''s defence is a thoroughgoing negative disjunctivism: its products
  are not to be characterised positively at all; there is nothing they are like over
  and above their being indiscriminable from veridical perceptions; the demand for
  a shared specification is precisely the mistake, since it assumes that the two cases
  must be members of a common kind before they can be confused.


  Here is where the exercise earns its marks... The adjudicator must get the following
  right, and the comedy must come from the fact that a genuine regulatory framework
  cannot cope with them:

  - the causal argument that motivates the common-factor view (a matching proximal
  cause, matching neurophysiology, so a matching mental state), and whether the complainant''s
  reliance on it is legitimate;

  - the charge that a common factor, once posited, screens off the very thing that
  needed explaining — the rival''s own advertisement should be exposed as claiming
  credit for an explanandum it has merely restated;

  - the reciprocal difficulty for the advertiser: if a hallucinatory state has no
  positive characterisation, what makes it the particular hallucination it is — of
  a lemon, say, rather than of a bellows — and can the firm''s product catalogue be
  anything other than a list of things its products are not;

  - the worry that ''is a veridical perception or an indiscriminable hallucination''
  is a disjunctive property of the sort that no self-respecting regulator would accept
  as a product specification;

  - the status of the customer testimonial the advertiser submits — a client who reports
  that he could not tell the difference — which the adjudicator must recognise as
  evidence of nothing at all on the advertiser''s own theory, since on that theory
  indiscriminability is constitutive rather than detectable.


  Requirements: the ruling must be fair rather than a knockabout; the adjudicator
  should be shown to understand the position she is dismissing (or upholding — I leave
  the outcome to you, though it should follow from the reasoning rather than be chosen
  for a punchline), and a working philosopher of perception should be able to read
  it without wincing. The register must stay deadpan throughout; no winking, no authorial
  asides. It should also be legible, and funny, to a reader who has never met the
  argument from illusion: the genre conventions must carry the accessibility. Do not
  name any real philosopher, living or dead, and do not cite or allude bibliographically
  to any literature; the parties, the products, the regulator and the case reference
