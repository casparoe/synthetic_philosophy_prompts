  I teach a first-year graduate seminar in classical Indian epistemology, and the
  students arrive from analytic backgrounds having read nothing in the tradition.
  Before we start on the texts, I want to hand them a placement instrument: a short
  case-based quiz that sorts them by what they actually believe about how knowledge
  is acquired, so that in week one I can pair students who are already committed to
  opposing views without their knowing the labels of those views. Write that instrument.


  It should be a battery of nine diagnostic questions plus a scoring key that maps
  answer patterns onto the classical positions on how many means of knowledge (pramāṇas)
  there are and which candidates are reducible to which. Design rules:


  [1] The questions come first in the logical space, not from a list of schools. Begin
  the handout with a brief statement of the space you are working in: the candidate
  sources under dispute (perception, inference, testimony/word, comparison, postulation,
  non-apprehension), and the reduction relations that generate the different positions
  (e.g. testimony absorbed into inference, non-apprehension absorbed into inference,
  postulation absorbed into inference, comparison absorbed into a combination of testimony
  plus perception plus memory). Then justify your ordering of the questions: say which
  items are only meaningful after an earlier item has been answered and why.


  [2] Every question must be a concrete case a student can answer from their own epistemic
