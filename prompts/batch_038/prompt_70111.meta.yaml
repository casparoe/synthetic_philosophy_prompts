  The angle: the inefficacy objection. Every so often in these debates someone says
  their individual contribution to a collective harm doesn''t make a difference —
  one flight, one steak, one vote — and then someone else replies that if that''s
  true then morality is impossible, and then it turns into a fight about expected
  values and imperceptible differences. Schindler''s List is basically that fight
  in film form, only with the stakes actually maximised. Schindler is one guy whose
  individual acts are a rounding error against the Holocaust, and the film knows it
  — the ending has him in pieces about how few he got, doing mental arithmetic about
  what his car and his party pin would have bought. Meanwhile for the people on the
  list he wasn''t a rounding error at all, he was the whole difference.


  So: write me a reading of the film through the inefficacy objection. Specifically...


