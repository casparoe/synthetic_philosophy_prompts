  ---


  I am preparing a handout for a graduate seminar on the foundations of probability,
  to be distributed at the opening of our unit on indifference. The handout is a decision
  tree, not an essay: it should route a student from the raw data of Bertrand''s chord
  problem to a named position about what, if anything, has gone wrong.


  The starting point, which every student in the room already accepts, is this. Consider
  a circle and an inscribed equilateral triangle, and ask for the probability that
  a "randomly chosen" chord is longer than a side of the triangle. Fixing two uniformly
  chosen endpoints on the circumference gives 1/3; choosing a uniformly chosen radius
  and then a uniformly chosen point on it, and drawing the perpendicular chord through
  that point, gives 1/2; choosing a uniformly chosen point in the interior as the
  chord''s midpoint gives 1/4. Each of the three procedures looks like an equally
  legitimate application of indifference, and they disagree.


  Build the handout in the following order.


  **Step one: the logical space.** Before any position is named, list five or six
  questions whose answers are independent enough to generate distinct positions but
  constrained enough that some combinations are ruled out. Candidates you should consider
  (keep the ones that do real work, discard the rest, and add any I have missed):


  - Does a probability attach to a proposition, or to a proposition together with
  a way of parameterizing the space it concerns?

  - Is indifference a requirement of rationality binding a priori, a defeasible default,
  or no part of probability theory at all?

  - Is a problem that names no physical randomizing mechanism ill-posed, so that the
  three answers are not competitors but answers to three different questions?

  - Is invariance under a group of transformations a constraint strong enough to select
  a unique prior once the parameterization is fixed, or does it merely relocate the
  ambiguity?

  - Is the trouble specific to continuous parameters, or does it also afflict finite
  partitions?

  - If indifference is restricted, what restriction is principled rather than ad hoc
  — finitude, indivisibility of the alternatives, symmetry of the physical setup?


  Mark which combinations of answers are jointly incoherent, and say why in a clause.


  **Step two: the tree.** Each internal node is one of these questions, phrased so
  that a student can answer it from an intuition or a commitment they already have,
  without knowing where the answer leads. No node may name a school of thought or
  use its vocabulary ("subjectivist," "objective Bayesian," "frequentist," "maxent")
  in the question text itself; those words belong at the leaves.


  **Step three: the leaves.** I need seven to nine. Among them there must be: a Jaynes-style
  position on which the chord problem is ill-posed until a mechanism is specified,
  with invariance under a transformation group doing the work of picking the prior;
  a restricted-indifference position of the Keynesian kind, on which indifference
  applies only to finite sets of mutually exclusive, indivisible alternatives; a position
  on which the three answers reflect three different reference classes and no unique
  one is privileged by the problem as stated — this is, roughly, van Fraassen''s diagnosis
  in terms of the level of abstraction of the description; a subjectivist position
  on which nothing has gone wrong because no prior is rationally mandated; a frequentist
  position on which the question has an answer only relative to a specified chance
  mechanism; an objective-Bayesian position that keeps a norm of indifference but
  derives it from a requirement to equivocate rather than from symmetry; and a deflationary
  position on which the paradox is unresolved and shows that there are no non-trivial
  objective priors over continuous parameters. Add any leaves you think the space
  demands.


  At each leaf give: the position''s name (or "unnamed" if you cannot think of anyone
  who holds it); two sentences stating it; its verdict on each of three test cases,
  described below; and one sentence naming its most awkward commitment.


  The three test cases, which every leaf must be scored against so that students can
  check their own path:


  (i) Bertrand''s chord problem. What does the leaf say the answer is, or that the
  question lacks one?

  (ii) The cube factory. A factory produces cubes with edge length between 0 and 1
  cm. What is the probability that a given cube''s edge is between 0 and 1/2 cm? Uniform
  over edge length, uniform over volume, or neither — and does the leaf''s answer
  to (i) force this one?

  (iii) A discrete repartitioning case, to test whether the diagnosis depends on continuity:
  a prize is behind exactly one of three doors; indifference gives 1/3 each, but repartitioning
  the space into "the first door" and "not the first door" gives 1/2. What does the
  leaf say about the pair of answers?


  **Step four: the empty cells.** Some combinations your questions permit will correspond
  to no leaf. List them and diagnose each in one line: is the combination incoherent,
  is it coherent but unattractive (and why — what does it cost), or is it merely unexplored
  (in which case say what would have to be true for it to be worth occupying)?


  **Step five: inseparabilities.** If two of your leaves always take the same branch
  at every node, say so rather than inventing a distinction, and either supply an
  additional question that would separate them or concede that they are not distinct
  positions for the purposes of this handout.


  Constraints on the write-up: text-based, so that it survives being printed as a
  handout — indented outline or ASCII diagram, your choice, with node questions numbered
  so a student can record a path as a string of answers. No bibliography, no reading
  list, and no citations; where a position has a well-known proponent, give the name
  only if you are confident of it, and otherwise describe the position by its content.
  Aim for roughly two pages.


