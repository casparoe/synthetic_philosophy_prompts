  For some years now I have been a regular reader and occasional poster on rationalist
  blogs and forums, and I have recently been asked to contribute a written statement
  of my position on free will and moral responsibility for a working group of people
  who mostly share my background. Before I circulate it, I would like a careful audit
  rather than a defense. Here is the package I intend to endorse:


  1. The physical world is causally closed, and at the level of human decisions it
  is, for practical purposes, deterministic. Where indeterminism does exist, it is
  noise; it does not add anything an agent could own.


  2. I accept Frankfurt-style cases. An agent who could not have done otherwise can
  still be blameworthy, and I take this to have shown that moral responsibility is
  compatible with determinism.


  3. I also accept Galen Strawson''s Basic Argument: to be truly morally responsible
  for what one does, one would have to be responsible for the way one is, at least
  in the respects that bear on one''s conduct; being responsible for the way one is
  would require being the cause of oneself; nothing can be the cause of itself; so
  true moral responsibility is impossible. I find this decisive, and I find the deterministic
  premise doing no work in it.


  4. When compatibilists talk about reasons-responsiveness, or about identification
  with one''s desires, or about the quality of one''s will, I think they are describing
  the conditions under which it is useful and fair to hold someone responsible rather
  than the conditions under which they are truly responsible. They are, I think, changing
  the subject — though I consider this a benign and interesting change of subject,
  not a mistake.


  5. I reject retributivism in punishment entirely. Desert in the backward-looking
  sense has no place in a legal system; what we do to offenders should be justified
  by incapacitation, deterrence, and rehabilitation, and by nothing else.


  6. I have no intention of giving up the reactive attitudes. I resent, I feel gratitude,
  I get indignant on behalf of strangers, and I think a life conducted from what Strawson
  calls the objective attitude toward everyone would be impoverished and probably
  impossible.


  7. I deliberately deploy praise and blame as instruments — with my children, with
  colleagues, with myself, in the sense of cultivating guilt and pride on purpose.
  I do not regard this as a lie or as bad faith, since I am not asserting anything
  about metaphysical desert when I do it.


  8. One further commitment, which is what actually prompted me to write this down.
  I work adjacent to a team that is building systems designed to shape the preferences
  of their users — recommendation stacks, engagement-optimizing assistants, that sort
  of thing — and I hold that the designers bear a distinctive kind of culpability
  that the shaped users do not: the user whose tastes were engineered over years is,
  in an important sense, excused in a way that the engineer is not. I have been arguing
  this point at length internally, and it is the commitment I care about most.


