  Bayesian explanation: Let N be the total number of objects. Hypothesis H: all ravens
  are black. Observing a non-black non-raven: it rules out the possibility that that
  object is a non-black raven. Under H, everything is either a black raven or a non-raven.
  Hmm, standard: the probability of drawing a non-black non-raven is higher if H is
  true than if H is false (since if H false, some ravens are non-black, so more of
  the objects are non-black, and hence a randomly sampled non-black object is more
  likely to be a raven). So observing a specific non-black non-raven slightly favours
  H. Magnitude depends on ratio of ravens to non-ravens: if ravens are a big fraction
  of non-black things, confirmation is large. That''s where the twist comes in: Tomas''s
  numerical variant.


