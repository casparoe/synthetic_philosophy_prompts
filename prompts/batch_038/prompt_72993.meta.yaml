  Let me think about the raven paradox. The classic dispute: confirmation of "All
  ravens are black" by observing a non-black non-raven (a white shoe / green apple).
  Two people arguing. One says the Nicod criterion is just wrong / the paradox dissolved
  by noting the observation report itself is a hypothesis-confirming instance. Another
  says Bayesian: the white shoe does confirm, but by a tiny amount, because it rules
  out a possible non-black non-raven. Third move: the "equivalence condition" — the
  paradoxical result follows from the conjunction of Nicod''s criterion, the equivalence
  condition, and something. Hempel''s own resolution: accept the conclusion, say intuitions
  are misled by background knowledge; the confirmation is relative to a background
  of total evidence.


  Good moves to include in the dialogue:

  - Move A: "the white shoe does confirm, by a tiny amount" (Bayesian, via the "urn"
  model — the smaller the number of non-ravens relative to ravens the more confirming).

  - Move B: objection that then any observation confirms everything, so ''confirms''
  becomes worthless — actually that''s not quite right: it confirms only logically
  incompatible-hypothesis-ruling-out observations.

  - Move C: the "background knowledge" reply — I.J. Good''s point that observing a
  black raven can actually disconfirm "all ravens are black" (because it proves ravens
  exist... wait, Good''s paradox: for a person with no prior information about ravens,
  observing a black raven can decrease the probability that all ravens are black,
  because it suggests ravens are a species with variation, or it updates the prior
  that ravens exist at all). Good''s 1967 "The White Shoe is a Positive Instance of
  a Law" — argues the white shoe confirms, in the absence of other evidence.

  - Move D: Hempel''s own answer: accept it, but note confirmation should be relativised
  to total background knowledge; when the background knowledge is empty, the white
  shoe does confirm.

  - Move E: the "selection procedure" / Maher''s or Vranas''s approach.

  - Move F: the "Nicod criterion is about a restricted class" — actually the standard
  diagnosis: the paradox relies on the equivalence condition, which is arguably too
  strong; alternatively it relies on Nicod''s criterion being applied to universal
  generalisations with unrestricted domain.

  - Move G: someone might say the paradox shows that ''instance confirmation'' isn''t
  the right notion, or that the real issue is the difference between confirming and
  being evidence.


  Also worth including: the objection that the Bayesian answer trivialises because
  the amount of confirmation depends on prior ratios; the objection that the paradox
  dissolves once you note that "all ravens are black" and "all non-black things are
  non-ravens" have different logical content in terms of the evidence class — no,
  they''re logically equivalent.


  Another interesting dispute axis: is the paradox about ravens black at all, or about
  the artificial predicate? Some say restrict to "projectible" predicates (Goodman''s
  grue) — this could be a move: one person says the whole thing is a Goodman-style
  problem in disguise; the other says that conflates two distinct puzzles.


