  Actually a nice one: Bentham''s views on sexual morality. Bentham wrote "Offences
  Against One''s Self" (Paederasty), arguing for decriminalization on utilitarian
  grounds — the "ascetic principle," "moral sanction," popular antipathy as a bad
  ground of punishment, the argument that the harm from punishment (denunciation)
  exceeds the harm of the act, the notion of "groundless antipathies" (he discussed
  it in the Principles of the Civil Code / Rationale of Reward and in the Essay on
  Paederasty). He also proposed a "moral sanity" test — a person should be punished
  only when the act causes harm to others and the mischief is outweighed. Bentham''s
  key idea: antipathy is not a ground; "the principle of antipathy" in the Introduction
  to the Principles of Morals and Legislation ch. 2. Also, he distinguishes between
  the "self-regarding" and other-regarding offenses. His essay uses a dialogue with
  "Cromohir" (a character based on an actual case, Nicholas Cromoir). Bentham also
  proposed that popular disgust might be evidence of harm but that this inference
  fails.


