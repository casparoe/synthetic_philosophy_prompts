  → Jones promised → Jones placed himself under an obligation → Jones ought to pay.
  That''s a beautiful fit: it combines the is-ought gap AND promises! And objections
  to Searle: the move from "is under an obligation" to "ought" smuggles normativity
  (Hare''s point — "under an obligation" is institutional/descriptive only if we don''t
