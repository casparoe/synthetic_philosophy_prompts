  more mischief than it prevents; (3) popular antipathy is not a ground — it''s "a
  mere sentiment of dislike" and to punish on that basis is the principle of antipathy;
  (4) the harm is only from "the alarm" produced by publicity, and the alarm itself
  is caused by the prejudice which the law reinforces (a nice circularity to satirize:
  the only harm is the disgust of onlookers, and the disgust is manufactured by the
  prohibition — "the mischief is the shadow of the law"); (5) Bentham''s proposal
  of a test: is there a "party injured"? If the act is between consenting parties,
  there''s no assignable individual injured, so no ground for punishment; (6) the
  "moral sanction" (popular disapproval) already punishes enough; (7) he notes the
  hypocrisy of punishing the "offence" while the same acts are common. Also Bentham''s
  distinction in the Introduction: four "sanctions" (physical, political, moral/popular,
  religious), and the "principle of utility" vs. "ascetic principle" vs. "principle
  of sympathy and antipathy." Also: Bentham says a legislator should distinguish between
  acts that are "mischievous" and merely "immoral," and that even for real immoral
