  Exam question (PH234 Philosophy of Science, second-year, 900 words, 45 min):


  "Lakatos holds that his methodology of scientific research programmes gives an account
  of scientific rationality that neither Popper''s falsificationism nor Kuhn''s theory
  of paradigms can supply. Explain how he thinks this is done. Your answer should
  be precise about the hard core and about the positive and negative heuristics, and
  should say what makes a problemshift progressive rather than degenerating."


  Student answer (~420 words):


  Para 1: Popper''s picture is that a theory is scientific if it can be falsified,
  and that science advances by bold conjectures and refutations. Lakatos points out
  that this doesn''t match how science works, because no theory is ever tested in
  isolation: to derive a prediction you need auxiliary assumptions and initial conditions,
  so a failed prediction only tells you that the whole bundle has gone wrong, not
  which part. Naive falsificationism would have science dying instantly — every theory
  ever proposed has been born refuted. So the unit of appraisal has to be something
  bigger. (Good, correct — Duhem problem, naive vs sophisticated falsificationism,
  "all theories are born refuted".)


  Para 2: That bigger unit is the research programme: a sequence of theories sharing
  a hard core, plus a protective belt of auxiliary hypotheses. The hard core is the
  set of basic assumptions the programme''s practitioners have decided not to abandon
  — for a Newtonian programme, something like the three laws of motion and gravitation.
  It''s not that the core is true or even that there''s good evidence for it; it''s
  protected by methodological decision. When an anomaly turns up — Uranus wobbling
  off its predicted orbit — the core isn''t blamed. Instead you adjust something in
  the protective belt: maybe there''s an unseen planet. (Correct; Neptune example.)


  Para 3: The negative heuristic is the creative part. [ERROR A] It''s the set of
  hints about which research paths are worth pursuing, how to build up the protective
  belt, and which problems to attack next — it tells the scientist what to do. The
  positive heuristic does the defensive work: it forbids directing the refutation
  at the hard core, which is why the programme can carry on after a refuting observation.
  [Swapped.]


