  held together by a common core. The hard core is the set of fundamental assumptions
  its practitioners have agreed not to give up; for the Newtonian programme something
  like the laws of motion together with universal gravitation. Lakatos is careful
  that this is not a claim about truth or even about evidence. The core is not shown
  to be right; it is made irrefutable by the methodological decision of the people
  working in the programme. Round it sits the protective belt of auxiliary hypotheses,
  and that is where the adjustments happen. When Uranus refused to stay on its computed
  orbit, nobody concluded that gravitation was false; the belt was modified instead,
  and the modification was that there must be a further planet perturbing it.


