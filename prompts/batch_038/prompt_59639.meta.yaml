  what makes the programme a live thing rather than a dead dogma: it is the partly
  worked-out set of suggestions about which auxiliary hypotheses to try, which idealisations
  to relax next, and which puzzles are worth the effort — in effect, a research policy
  that generates new versions of the theory. The positive heuristic is the prohibition
  at the centre: modus tollens must not be turned on the hard core." That''s a fluent
  swap. A hasty grader reading "two heuristics, one creative one defensive" would
