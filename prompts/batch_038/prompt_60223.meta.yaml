  which knowledge lacks. And crucially, whether the analogy supports contextualism
  over pragmatic encroachment at all — since the analogy with flat concerns semantic
  standards, whereas pragmatic encroachment says the stakes are part of the metaphysics
  of knowledge, not the semantics of "knows". So the analogy is doing double work:
  it''s used to establish shifty semantics, and then also used to dismiss pragmatic
