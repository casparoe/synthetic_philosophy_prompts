  \ need to web_fetch. I can just paraphrase, or better: inject a niche element into\
  \ the prompt itself — the instructions say I'll often have to inject some new/niche\
  \ idea into the prompt so the model can't regurgitate.\n\nLet me consider: Lewis's\
  \ account in \"Convention\" (1969) — conventions as solutions to coordination problems;\
  \ regularity R in the behavior of members of population P when recurrent in situations\
  \ S is a convention iff it's true and common knowledge that nearly everyone conforms\
  \ to R, expects nearly everyone else to conform, has approximately uniform preferences\
  \ over the possible action combinations (all preferring general conformity given\
  \ general conformity), and prefers that any one individual conform if nearly all\
  \ do, and would prefer that any one individual conform if nearly all were to, and\
  \ R is (nearly) a Nash equilibrium, and any alternative regularity R' would be equally\
  \ satisfactory. Also Lewis's later revisions (1975 \"Languages and Language\", the\
  \ \"Postscripts to 'Convention'\" in 2002) where he introduces the idea of conventions\
  \ of truthfulness and trust, and acknowledges problems: e.g., conventions sustained\
  \ by inequality of preferences (the \"battle of the sexes\" problem), conventions\
  \ that are not Pareto-optimal (the \"prisoner's dilemma\"-like cases), and the requirement\
  \ that preferences be \"approximately uniform\" — Lewis restricts to coordination\
  \ problems in the pure sense, excluding cases where different agents prefer different\
  \ equilibria.\n\nKnown criticisms of Lewis: (1) too restrictive — many real conventions\
  \ are not solutions to pure coordination problems (e.g., which side of the road\
  \ to drive on is fine, but conventions like queueing or the use of \"Sir\" involve\
  \ unequal payoffs, power, distributive conflict); (2) common knowledge requirement\
  \ too strong; (3) rationality requirement (agents must be rational enough to reason\
  \ about equilibrium) too demanding; (4) it can't explain convention change/revolution\
  \ — once a convention is entrenched as an equilibrium, Lewis's account makes change\
  \ impossible unless there's a coordinating signal; (5) it can't handle conventions\
