  are concrete" with "everything conceivable happens" — Lewis''s worlds are generated
  by recombination but the principle of recombination is limited to spacetime-sized...
  Actually recombination: any way of recombining parts of worlds is possible, but
  not "everything you can imagine" — e.g., non-spatiotemporal entities, or contradictions.
  (2) The modal status: for Lewis, "actual" is indexical, and the claim that counterparts
  exist isn''t a claim that you are doing it. (3) The "nothing matters" objection
  — Lewis''s actual response is that moral concern is directed at what happens here
  (the "indexical" point), and the objection he discusses (from Adams? from "ersatz"
  theorists, "incredulous stare") — Lewis''s response to "why care about other worlds":
  he says that''s like asking why we should care about other times / the future, or
  other people. Actually Lewis does address the "cheap" objection: because there''s
  a world where I don''t do the right thing, so why do it? He responds by noting that
  this is just like the objection that because other people exist, my suffering doesn''t
  matter — indexicality.


  Also, another subtle error: "Lewis thought possible worlds are causally isolated,
  so statements about them are unknowable" — the "epistemological objection" (how
  do we know about worlds causally isolated from us?). Lewis''s answer: modal knowledge
