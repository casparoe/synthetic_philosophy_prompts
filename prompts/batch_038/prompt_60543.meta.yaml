  lunch the two of them resumed it, and the argument ran for three tables'' worth
  of time and got considerably further from the intersection. I''ve reconstructed
  the exchange as faithfully as I can, because I want to use it as the worked example
  that opens a chapter I''m writing on the normative force of conventional rules,
  and I can''t tell which of them is winning. Please act as referee.


  Here is the exchange, as near as I can render it:


  (1) Ines opened by saying that Marcus''s crossing was a small wrong, not because
  anything came of it but because a signal of that kind is maintained only by the
  fact that everyone expects everyone else to comply; each visible instance of non-compliance
  loosens that expectation, and Marcus''s was visible to her and to whoever else was
  on the street.

  (2) Marcus replied that this is a drop-in-the-ocean argument, and that it either
  proves nothing or proves far too much: no individual crossing makes any difference
  to anyone''s expectations, so if wrongness is a matter of aggregate effects there
  is no wrongness here at all. He added that on that night there was no driver within
  sight and nobody delayed by him, so his crossing neither endangered nor free-rode
  on anyone.

  (3) Ines said the free-riding charge does not depend on the particular crossing.
  Marcus benefits every day from drivers'' standing assumption that pedestrians will
  stop: they accelerate through green lights, they brake late, they do not scan a
  dark crosswalk, because they can rely on compliance. He takes that benefit and refuses
  the correlative cost in precisely the instances where the cost to him is nothing,
  which, she said, is the free rider''s characteristic move rather than an escape
  from it.

  (4) Marcus then said that if a fairness principle of that shape condemns a crossing
  that injures nobody, it condemns defection from any convention that generally works,
  whatever its content — including ones he thinks he is required to undermine. He
  does not tip in this country, ever, deliberately and as a matter of standing policy,
  on the ground that tipping converts an employer''s payroll obligation into a tax
  on customers and makes a server''s income contingent on customers'' moods and prejudices.
  If Ines''s principle forbids the crossing at one in the morning, it forbids that
  too, and he regards the second defection not as permissible but as obligatory.

  (5) Ines said he is using an asymmetry he hasn''t stated. A pedestrian signal, she
  argued, is a coordination convention: it distributes nothing, it only resolves a
  collision problem, and its content — which colour means stop — is morally arbitrary.
  Tipping is a distributive convention: its content is exactly what he objects to.
  There can be a reason to work against a distributive convention because of how it
  distributes; there is no analogous reason to work against a coordination convention,
  since there is nothing in it to correct. She added that his refusal to tip works
  as protest only if it is public and joined by others, and that a lone customer who
  simply keeps the money is indistinguishable, from the server''s side, from a cheapskate.

