  That analogy — philosophy of science is to scientists as ornithology is to birds
  — is a great analogy-audit target. The birds don''t need to read ornithology because
  they can fly; the analogy is meant to license the conclusion that philosophy of
  science has no use to working scientists, and hence that philosophical questions
  about science are idle. Audit: what maps to what (ornithology as an external descriptive
  discipline, birds as practitioners with innate competence, flight as the practice
  of science), where it breaks (birds can''t become ornithologists, birds have no
  conceptual choice about flight, the analogy imports the claim that scientific method
  is an unlearnable instinct rather than a set of contestable normative commitments;
  also ornithology has real uses — conservation, which breaks the analogy from inside
  since ornithology IS useful to birds in that sense). Also the analogy is self-undermining:
  Feynman making a claim about the value of a discipline is itself doing philosophy.


