  find where Feynman actually says it, for what it''s worth, but that''s beside the
  point I want to ask about.


  The thing is, he then built a proper little argument on top of it, roughly: (i)
  the analogy holds because in both cases the practitioners have a competence they
  exercise fluently and the reflectors on that competence produce nothing the practitioners
  need; (ii) birds can''t in principle consult ornithology, and scientists can''t
  in practice, because method is picked up by apprenticeship at the bench, not by
  reading about method; (iii) therefore philosophy of science is at best entertainment
  for the philosophers; and (iv) it follows that when philosophers weigh in on interpretation,
  on what counts as evidence, on whether some field is a science, they''re just describing
  a practice they don''t have any standing to correct. He also conceded — and I thought
  this was clever and it''s the bit that''s really stuck with me — that there''s one
  way ornithology does help birds, namely that some species are still here because
  ornithologists lobbied to save their habitats, but he said that''s not the analogy''s
  business, that''s just ornithology turning into politics.


