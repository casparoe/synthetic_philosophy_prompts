  Great. So the mapping is rich: the "computer overload" is literally a resource-bounded
  computation shedding lower-priority tasks — and the humans on the ground did the
  factoring: Kranz couldn''t evaluate whether executive overflow was fatal; Bales
  couldn''t either; Garman had a memorized lookup; the chain of consultation had a
  strict time budget (~15 seconds); and the answer was "Go."


  And there''s a beautiful inversion: the machine that was overloaded was itself the
  product of massive decomposition (the AGC''s priority-scheduling design, Margaret
  Hamilton''s "Basic Software" group''s asynchronous executive — the very design that
  let the computer shed low-priority tasks is what saved the mission). Hamilton''s
  team had designed the display-driven priority scheduling (the DSKY-based "program
  alarms" system) so that overload would degrade gracefully rather than crash. This
  is a factored-cognition point *inside* the machine: the alarm code system is a lossy
  communication protocol from a subordinate "consultant" (the computer) to a superior
  (the human) who must decide. And the 1202 code was chosen precisely because the
  humans couldn''t be given the full state.


  This gives the "where does the model break" material:

  1. HCH assumes the copies are exactly like the root — but here the hierarchy was
  not homogeneous: Garman ≠ Bales ≠ Kranz ≠ Armstrong, they had different information,
  different incentives, different authority. Authority, not accuracy, resolved the
  recursion: Kranz''s "Go" was binding regardless of whether he understood it. HCH
  has no authority relation; it terminates when the root human is satisfied.

  2. HCH assumes lossless, costless consultation — here consultation cost ~20 seconds
  of a 12-minute descent with finite fuel. The cost of asking is exactly what the
  idealization removes.

  3. HCH assumes the copies are trustworthy and honest — here Garman''s sheet was
  a piece of pre-computed cache from a simulation; the correctness of the answer depended
  on a lucky contingency (that the simulation had been run and that the sheet had
  been written), not on the hierarchy computing anything. The "factoring" was done
  months earlier, offline, by a different configuration of people. HCH has no notion
  of amortization/caching.

  4. HCH assumes the subtask decomposition is available — but the crucial judgment
  ("is intermittent overflow safe given that we also need to land accurately?") is
  arguably not decomposable: it required holding the whole state.

  5. The "verification" problem: Kranz''s judgment of Garman''s answer wasn''t verification,
  it was deference. HCH assumes the root human can evaluate the answer. So the episode
  is a real-life instance of the scalable oversight problem, and it shows that HCH''s
  idealization hides the actual mechanism (authority + precomputed protocol + graceful
  degradation).

  6. Also: the alarm recurred. Each recurrence required a fresh decision — the hierarchy
  had to be re-consulted under time pressure, and after the second or third time Bales
  said "if it doesn''t happen more often" — a threshold that was itself a judgment
  about the *rate* of alarms, i.e., a statistical property not visible from a single
  consultation. HCH assumes each query is independent and answerable.

  7. And a further wrinkle: Armstrong at the root of a *different* hierarchy was simultaneously
  deciding to fly long. The two decompositions were concurrent and coupled.


  Also, what does the case show about the theory? It might show that HCH is the wrong
  idealization for *real-time bounded* deliberation: HCH is about what is *computable*
  in the limit of unbounded depth, whereas the Apollo case shows that the binding
  constraint was the *interface* (the bandwidth of the alarm codes, the seconds available),
  not depth. And it might suggest that factored cognition should be understood as
  including amortization, protocols, and authority — features that HCH deliberately
  idealizes away.


  Alternatively the case could *confirm* the theory: the mission succeeded precisely
  because the task was factored into human-sized pieces with reliable primitives (checklists,
  codes, polls), which is the factored-cognition thesis.


