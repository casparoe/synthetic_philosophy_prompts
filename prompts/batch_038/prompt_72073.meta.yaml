  Factored cognition (Ought, Michael Dennis''s "Decomposition" essay, 2020; also Stuhlmüller''s
  "Factored Cognition" blog): the idea that a cognitive task can be made tractable
  by decomposing it into subtasks, each of which is a "primitive" that a human can
  execute reliably in some bounded time. A "factored cognition" approach to alignment:
  if we can decompose the task of overseeing/evaluating an AI''s behavior into human-sized
  pieces, we can do alignment. HCH = "Human Consulting HCH": an idealized process
  where a human, to answer a question, consults a copy of themselves (an exact duplicate
  with the same values/skills), who can in turn consult copies, recursively, unboundedly
  deep, with unlimited branching and no resource cost. The output of HCH is the "idealized"
  answer. Amanda Askell / Ought define HCH as an idealization: the answer that would
  be reached by a human who could decompose arbitrarily. Then the question is which
  tasks are in HCH (i.e., "HCH-easy") and which are not, and whether a given method
  (debate, IDA, amplification) reaches the HCH answer.


  Key features of the idealization: the copies are exactly like the human (same knowledge,
  values, and cognitive capacity), they are trusted, communication is lossless, there''s
  no time/resource limit, and the root human is the one who must ultimately be satisfied/judge.


