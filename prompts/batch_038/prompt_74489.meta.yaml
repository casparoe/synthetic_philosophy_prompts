  — a level that only watches and can''t act; Hofstadter''s point is that such a level
  can''t exist without a regress, and the film actually shows the regress completing
  into it (Lester and friends are also in Emily, layered voices, and Emily will presumably
  grow up and be a vessel for someone). Is the audience the inviolate level? The film
  makes the viewer the only level that isn''t drawn — and Kaufman seems to know this,
  since the whole thing is framed as entertainment we''re consuming, which is thematically
  continuous with the customers paying to be inside a celebrity''s head. Also: Malkovich''s
