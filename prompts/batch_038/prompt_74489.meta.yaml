  Now, also I want to inject niche structure. My three-way distinction: regress vs.
  loop vs. mutual constitution. Let me define it carefully and originally:


  1. Regress: the same relation repeated at each level, never closing (Malkovich inside
  Malkovich inside Malkovich).

  2. Loop (strange loop proper): going up (or down) the hierarchy returns you to your
  starting point, but the direction of dependence stays the same all the way around
  — A makes B, B makes A, so each is the other''s author. (Drawing Hands.)

  3. Mutual constitution without circular dependence... hmm, maybe instead: "tangle"
  where two levels each partly constitute the other but there''s still a ground.


  Better three-way: (a) infinite regress, (b) a closed loop with a single direction
  of dependence (Drawing Hands — each hand is drawn by the other, so there''s no first
  hand), (c) a hierarchy that merely looks tangled because it''s ambiguous which level
  is which but actually has a hidden top (a disguised regress with a base). And the
  question: is the film''s recursion ever really (b), or is it always (a) or (c)?
  Because Craig always wants to be the top hand; Lester''s scheme explicitly aims
  at a permanent top (an immortal drawer who never gets drawn — he moves from vessel
  to vessel, always the puppeteer, never the puppet); and the film seems to punish
  exactly that ambition — Craig ends up at the bottom, a pure viewer.


