  Slightly unusual request. I teach philosophy of social science and next month I''m
  giving a 40 minute talk at a history department''s methods seminar — as in, their
  actual methods seminar, which is basically the quants. Room will be economic historians
  who live in regressions on parish registers, tax rolls and probate inventories;
  two historical sociologists who think in comparative case designs and Mill''s methods;
  one digital humanist who text-mines big corpora of trial records; and a couple of
  early modernists who are friendly to me but will defend their sources to the death.
  I''m the only philosopher there, and someone has already introduced me as doing
  "philosophy of science," so half the room is braced for a lecture about laws and
  explanation.


  The talk is a defense of microhistory — the history-from-below tradition that takes
  one village, one trial, one miller — against the charge that it''s dressed-up anecdote.
  I don''t want the standard defense. My thesis is roughly these four claims:


  (1) Shrinking the scale isn''t taking a small sample. It''s swapping instruments.
  Aggregation destroys certain kinds of information as a matter of structure, not
  of effort, so the close-up case is a measurement device for connections and mechanisms
  that are literally not in the macro data — the miller''s reading list, who lent
  him the books, how a village relayed a heretical idea, etc.


  (2) Therefore the general claim it licenses isn''t frequentive. It''s modal and
  structural: this arrangement was possible, this is the mechanism that produced it,
  and — most importantly — your macro categories ("peasant religion," "the village
  community," "the people," "class") don''t carve the joints. Frequencies have to
  come from somewhere else, and I say so out loud.


  (3) The anomaly is selected on purpose. I pick the case because it doesn''t fit
  the categories, and the mismatch is evidence about the categories, not noise about
  the case. That''s the part I know is exposed.


  (4) The archive is mediated — inquisitors'' questions, notaries'' Latin, a defendant
  talking for his life — and I argue the mediation is not a contaminant to be discounted
  away but the thing under study: the transcript records a negotiation, and reading
  it for what the filter did is itself a generalizable result.


  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the
  eight or so objections this room will actually raise — not the ones I''d get from
  other philosophers, and not the ones I''d get from literary people — ordered by
  how much damage each would do to my argument if I fumbled it. Phrase each one the
  way that audience would phrase it, in first person and in their vocabulary (n, selection,
  identification, controls, external validity, ecological inference, coding, hindsight),
  so I can hear the question before it''s asked. For each: a reply I could actually
  say out loud in about two minutes, and then a blunt note on where the reply is soft
  — the sentence after which a good quant will say "so you''re conceding that...".
  Then tell me: what I should concede in the first sixty seconds to take the wind
  out of the room; which single reply has to land or the talk fails; the weakest point
  in my own position that I should prepare to defend rather than hope they miss; and
  the question I''m praying nobody asks, with the honest answer to it.


  Two constraints: assume nobody in the room has read the case studies I''ll use,
  so objections that only work if they know the literature don''t count. And no bibliography,
  no reading list, no names of books — I know that literature, and I''d rather you
  spend the words on the arguments. Don''t be gentle; these people won''t be.


