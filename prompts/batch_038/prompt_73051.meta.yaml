  Q. Consider: two sprinkler timers, both set to water the lawn at 6:00. Timer A''s
  valve works. Timer B''s valve would work too, but the system has a float switch:
  once the lawn is wet, B is disabled. In the actual situation A waters the lawn at
  6:00 and B stays disabled. (a) Explain how Lewis would and how Woodward would evaluate
  the claim that A caused the lawn to be wet, and in particular how each of them is
  supposed to understand the counterfactuals their accounts rely on. (b) Would either
  account give a different verdict if the float switch were removed and both timers
  fired at exactly 6:00?


  Student answer draft:


  "Lewis says causation is counterfactual dependence between distinct events, where
  the counterfactuals are read in terms of nearby possible worlds: the closest worlds
  where A doesn''t fire, ordered by a similarity metric that keeps the actual laws
  and requires only a small miracle. The counterfactual ''if A hadn''t fired, the
  lawn wouldn''t be wet'' is false here, because in the nearest A-less world the float
  switch doesn''t trip and B waters the lawn at 6:00 anyway. So Lewis can''t get direct
  dependence and has to fall back on the ancestral: causation is the ancestral of
  counterfactual dependence, and there''s a chain running through the float switch''s
  not-tripping, so A is still a cause. Woodward''s account is different in that it''s
  not reductive — he doesn''t try to analyze causation in non-causal terms, since
  an intervention is itself a causal notion — but the machinery is the same idea:
  we have variables and structural equations, and A causes the wetness if the equation
  for wetness is invariant under an intervention on A, i.e. if the counterfactual
  ''if an intervention set A = off, then the lawn wouldn''t be wet'' is true. Woodward
  reads these counterfactuals the same way Lewis does, only restricted to worlds where
  the change is brought about by an intervention rather than by a miracle, so in a
  sense interventionism is Lewisian counterfactual analysis plus a constraint on which
  worlds count. On Woodward''s view A causes the lawn to be wet only because an intervention
  on A is something we could actually carry out — we can turn the valve off — and
  that''s why Woodward is vulnerable to the charge that he''s really giving an account
  of manipulability rather than causation.


  (b) Without the float switch both timers fire at 6:00 and neither is counterfactually
  necessary. For Lewis this is just the same problem as before: he uses the ancestral/chain
  strategy, and since there is a chain from A through the lawn''s being wet, A still
  counts. For Woodward it''s also fine: an intervention on A alone (holding B fixed
  by stipulation) changes the wetness, so the invariance claim holds and A is a cause.
  So both accounts give the right verdict in the symmetric case, which is a nice advantage
  over a plain but-for test."


