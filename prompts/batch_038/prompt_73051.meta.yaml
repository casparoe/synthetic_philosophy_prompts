  Domain: Counterfactual vs. interventionist theories of causation. A subtle mistake
  could be conflating Lewis''s counterfactual dependence with interventionist counterfactuals
  in Woodward''s sense (Woodward''s counterfactuals are about interventions, not Lewis-style
  nearest-world semantics; and Woodward explicitly denies that his view is reductive
  in Lewis''s sense). Another subtle mistake: thinking interventionism implies agency/manipulability
  (Woodward is explicit that it doesn''t — an objection often raised by Ladyman/ Ross
  or by critics like Cartwright; actually the common criticism is that interventionism
  is circular or that it collapses into a manipulation account; Woodward insists the
  notion of intervention need not be tied to actual human agency). Also: Lewis''s
  actual causation requires intrinsic/transitive counterfactual dependence; the counterexamples:
  preemption (early/late), overdetermination, and the "counterexample to transitivity"
  (Northcott''s examples: boulder rolling down hill). Also: Lewis''s 2000 "Causation
  as Influence" paper introduces influence and trumping preemption. Also the "problem
  of effects" — Lewis denies backward causation via counterfactual dependence of cause
  on effect, using the asymmetry of counterfactuals; and interventionists (Woodward)
  don''t appeal to this — they use the independence of interventions from other variables.


  Another subtle mistake: thinking that interventionism is a reductive analysis of
  causation. Woodward says his account is not reductive — it doesn''t analyze causation
  in non-causal terms; intervention is itself a causal notion. So a student who says
  "Woodward reduces causation to counterfactuals about interventions, so it''s a version
  of Lewis''s theory" makes a subtle error. Also that the interventionist counterfactuals
  are not Lewis-style similarity-based nearest world counterfactuals — they are about
  a hypothetical ideal intervention that changes X while leaving everything else off
  the path... actually Woodward requires intervention on X that is an "ideal" intervention:
  it changes X without changing other variables in a way that would cause Y. Lewis''s
  counterfactuals are evaluated by a similarity metric; Woodward''s are about interventions.


  Also a possible conflation: "Lewisian counterfactual dependence is transitive" —
  actually Lewis argued causation is transitive because counterfactual dependence
  is transitive (in his 1973 paper), and later problems (Northcott, Hall) show counterexamples
  to transitivity of causation. In 2000 Lewis introduced the "influence" notion partly
  to fix transitivity.


  Another candidate: the student says Lewis''s account handles overdetermination fine.
  Actually it doesn''t — symmetric overdetermination is the classic problem where
  neither cause counterfactually depends on the effect (Lewis''s own paper notes this:
  "the problem of effects, preemption, overdetermination... I know of no solution").
  Lewis handled preemption with the ancestral of counterfactual dependence (chains).
  But overdetermination remains a problem for Lewis.


  Also: Lewis''s account makes causation depend on counterfactual dependence, which
  is a relation between events; and the student might conflate "causal dependence"
  (the ancestral chain) with "counterfactual dependence."


  Another thing: interventionism and "actual causation." Woodward''s invariance notion
  is about general causal claims (type-level), and it''s a known point that Woodward''s
  framework was originally aimed at general/type causal claims, and actual/singular
  causation was developed later by Woodward and Hitchcock''s extended theory and by
  Halpern & Pearl. A student might say "Woodward''s account is about actual causation"
  while it''s primarily about general causal claims; and Halpern–Pearl''s actual causation
  account is a different formal framework (structural equations with counterfactual
  dependence + but-for + normality ranking), sometimes thought of as a Lewisian account
  in structural-equation clothing.


  Also: Halpern & Pearl use the "normality" ordering (borrowed partly from Lewis''s
  similarity? Actually from the idea of default normality ranking). A subtle mistake:
  saying Halpern–Pearl is interventionist in Woodward''s sense — actually H&P doesn''t
  require interventions; it uses the same structural equations but defines actual
  cause via counterfactual dependence in a modified setting, without needing interventionist
  independence conditions. Also H&P explicitly aims to handle cases like preemption/overdetermination
  that Lewis''s simple counterfactual dependence couldn''t.


