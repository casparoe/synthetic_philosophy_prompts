  ---


  I am preparing a response to a consultation on how a public streaming platform should
  weight audience metrics in its arts-funding recommendations, and one of the submissions
  leans heavily on Tolstoy. Its argument, in outline: Tolstoy held in What Is Art?
  that art is the transmission of feeling, and that he wrote — "Art is a human activity
  consisting in this, that one man consciously, by means of certain external signs,
  hands on to others feelings he has lived through, and that other people are infected
  by these feelings and also experience them." The submission then notes that Tolstoy
  also held that "the degree of infectiousness is also the sole measure of excellence
  in art", and concludes that completion rates, replays and share-velocities are therefore
  not a vulgar substitute for judgement about artistic merit but a direct measurement
  of the very property Tolstoy made central. A second step follows: because Tolstoy
  appraised transmitted feelings by whether they serve humanity''s well-being, the
  platform is entitled to demote works that are highly infectious but transmit harmful
  feelings — the epidemiology, on this reading, licenses quarantine.


  I want an audit of the infection analogy itself, and I am less interested in whether
  Tolstoy was right than in how much weight the metaphor can bear.


  Please give me:


  1. The correspondence table. What in the platform ecosystem plays the role of the
  pathogen, the carrier, the vector, the susceptible host, the dose, virulence, the
  incubation period, immunity, the epidemic curve, and quarantine? Be explicit where
  a slot has no natural occupant.


  2. The features of the epidemiological source that the analogy quietly imports and
  the target lacks — involuntary uptake, non-cognitive transmission, replication of
  the agent itself, dose-response, the presumption that spread tracks harm or benefit.
  For each, say whether the mismatch is fatal for the submission''s use or merely
  decorative.


  3. Tolstoy''s own constraints on his metaphor, which the submission appears to have
  skipped. He excluded direct involuntary contagion — yawning, contagious laughter,
  weeping at the sight of another''s suffering — from art altogether, on the grounds
  that art begins only where the feeling is deliberately re-experienced and expressed.
  And he gave three conditions governing degree of infectiousness: individuality of
  the feeling, clearness of transmission, and sincerity in the artist, the last the
  chief of them, since the other two follow from it. Ask what becomes of a metric
  built on reach once these are in play: is any part of Tolstoyan infectiousness observable
  at population scale, or is the whole of it a property of single encounters between
  one work and one receiver?


  4. Whether the two-axis structure survives translation. Tolstoy separated the quality
  of a work as art (its infectiousness) from the worth of the feelings it transmits,
  the latter judged by what he called the religious perception of the age. A single
  engagement number collapses them. Does the collapse serve or defeat the submission?


  5. Whether the quarantine inference holds. Tolstoy''s mechanism of appraisal was
  condemnation, esteem and the choice of what to encourage — not the institutional
  removal of the carrier from circulation. Does the epidemiological framing license
  a step Tolstoy did not take?


  6. Your verdict on both conclusions, stated separately, and whether either would
  stand without the analogy carrying it. If the analogy fails, propose a better one
  — Tolstoy himself compares art to speech, which transmits thoughts rather than feelings
  — and say what the better analogy would license that this one does not.


