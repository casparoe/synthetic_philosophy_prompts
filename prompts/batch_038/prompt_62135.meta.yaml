  The philosophical idea I want to hang it on is Dennett''s notion of a free-floating
  rationale: a rationale that explains why a thing is the way it is, or why a system
  does what it does, without being represented in anybody''s head. His home case is
  biology — there''s a rationale for the eye, for the heart''s four chambers, for
