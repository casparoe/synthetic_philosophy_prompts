  Let me carefully write the six moves so each is a genuine argument.


  (1) W.: Aumann''s agreement theorem establishes that if two Bayesians share a common
  prior and it becomes common knowledge between them what each believes about some
  question, their posteriors must coincide. The contrapositive is what interests me:
  where two people have genuinely absorbed the same evidence and remain of two minds,
  and are aware of remaining so, at least one of them is failing to be Bayesian, or
  to treat the other as Bayesian. Disagreement of the ordinary, stubborn kind is therefore
  not a neutral fact about the world but a diagnostic sign. It follows that "reasonable
  people can disagree" is, taken literally, false.


  (2) N.: The theorem is correct and nearly empty, because its hypotheses are unattainable.
  Nobody actually has a common prior — that is an assumption about the description
  of the problem, not a discovery about people — and nobody ever achieves common knowledge.
  Any real conversation, however candid and however long, produces at most mutual
  knowledge to some finite depth: I know your view, you know that I know, and so on
  for some number of levels, and then the chain simply stops. A result that fires
  only in a situation that cannot occur cannot diagnose the situations that do. So
  (1) is a misuse of the theorem.


  (3) W.: That is far too strong. There is a whole literature on approximate common
  knowledge, and the upshot of it is a continuity result: if it is common p-belief,
  for p close to one, that each of us holds a posterior near some value, then our
  posteriors must in fact be close with high probability. In other words, mutual knowledge
  to a large finite depth does buy you most of what common knowledge buys. That is
  exactly what I need. Two people who have argued in good faith for an hour have mutual
  knowledge of each other''s views to a very high order, and the theorem''s conclusion
  should then hold approximately: their beliefs should have converged. Persistent
  wide disagreement remains a symptom of something gone wrong.


  (4) N.: Rubinstein''s email game is a direct counterexample to the continuity intuition
  you are relying on. Two players can coordinate on a mutually preferred outcome if
  each is sure of the state; the inferior outcome is what each prefers if he suspects
  the other may be in the dark. Messages are sent and acknowledged, each acknowledgment
  triggering a further acknowledgment, and any message may be lost with small probability.
  The striking result is that for any positive probability of loss and any finite
  number of acknowledgments — a thousand, a million — the unique equilibrium is the
  inferior one, whereas at common knowledge the preferred one becomes available. The
  correspondence is discontinuous exactly at the point you say makes no difference.
  Knowledge that is almost common, in the sense of holding to arbitrarily high finite
  order, does not behave almost like common knowledge.


  (5) W.: You have changed the subject. The email game concerns what people do when
  their payoffs depend on guesses about one another''s guesses; there is a channel
  of strategic feedback running through each level of belief, and it is that channel,
  not the epistemic shortfall, that produces the discontinuity. Kajii and Morris''s
  account of robustness makes this precise: an equilibrium fails to be robust precisely
  when there is a possibility of "contagion," where each player''s incentive to abandon
  it depends on his belief about the other''s action, which depends on the other''s
  belief about his, and so forth. Aumann''s theorem involves no such channel: posteriors
  are determined by evidence and the common prior, not by what I expect you to expect.
  The continuity result for belief agreement stands untouched.


  (6) N.: Two replies. First, the very feature you dismiss is the reason your continuity
  result is weaker than you suppose: those results tell you that agreement holds with
  high probability, and the probability weight they concede to failure is exactly
  where the interesting cases live. A guarantee that two agents agree except on a
  set of states of measure one in a million is not a guarantee that a particular pair
  of people in a particular argument should expect to agree; the exception may be
  the case in front of you, and each of you knows the other knows that. Second, and
  more damaging: even in the purely epistemic setting, finite mutual knowledge can
  be worth nothing at all. Consider the muddy children. If the father''s announcement
  is common knowledge, the induction runs and the muddy children step forward on the
  appropriate day. If it is only mutual knowledge to some finite depth k, the induction
  breaks down at the k-th step and nothing ever happens: no child ever learns that
  she is muddy, no matter how many muddy children there are and no matter how obvious
  the fact is to everyone. There the depth of knowledge is not a matter of approximation
  at all but of whether a certain inference is available. So the question is not "how
  many levels?" but "which inferences does the epistemic situation license?" — and
  for some inferences, the answer changes completely between any finite level and
  the limit.


