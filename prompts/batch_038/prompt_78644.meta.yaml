  Hmm, one concern: is the kibbutz episode interesting enough as a test of Mill''s
  socialism view? Yes: it''s a real large-scale, century-long attempt at exactly the
  cooperative-communal model Mill discusses, and its partial conversion into a market-based
  hybrid is a genuine anomaly/confirmation case. Mill''s key claim in Chapters on
  Socialism: he refuses to condemn socialism a priori (as most of his contemporaries
  did) and refuses to endorse it, holding that the question is undecidable on current
  evidence and depends on which form of socialism and on the character/education of
  the people; he explicitly says the comparison must be with the actual, not ideal,
  alternative; and he says the real test would require an experiment. That last point
  is the gold: Mill says the question can only be settled by trial — and the kibbutz
  WAS a trial. So: does the kibbutz century count as the experiment Mill wanted, and
  what does it show? And the wrinkle: Mill required that experiments be judged against
  the actual alternative available at the time, and kibbutzim were partly subsidized
  and embedded in a state-building project (Zionist settlement, Jewish National Fund
  land leases, state support), so the trial was not clean — a confound Mill would
  flag. That''s a beautiful analytical point.


