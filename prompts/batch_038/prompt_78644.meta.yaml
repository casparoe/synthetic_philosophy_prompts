  in the commune; (2) whether the removal of wage differentials kills the incentive
  to work hard — kibbutz answer: "from each according to ability" held up under strong
  ideological commitment for two generations, then cracked; (3) management competence
  — kibbutz answer: rotation of roles and general assemblies, which struggled with
