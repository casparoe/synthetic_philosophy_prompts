  ---


  I am assembling a theory of blameworthiness and need the responsibility-relevant
  core of it to be an account of the control an agent must have over an action. Before
  I read any candidate account, I want the specification it would have to satisfy.
  The purpose fixes the standard: the account must be statable to a philosophically
  trained non-specialist; it must be applicable to coercion, addiction, direct manipulation,
  negligence, and the acts of children and the impaired; and it must yield a determinate
  answer to whether causal determinism threatens desert. Write the desiderata for
  an account of the control condition — the phenomena it must explain, the cases it
  must get right, the distinctions it must not collapse, and the results it must be
  consistent with.


  For each item give: the requirement; the case or consideration that motivates it;
  what an account violating it is thereby committed to saying; and its status — non-negotiable,
  a preference of one camp masquerading as a requirement, or something you would strike
  from the list altogether.


  The territory the list has to cover includes the following, but do not treat my
  enumeration as the answer, and add what I have missed:


  1. Verdicts on the standard counterexample structure: an agent who acts for his
  own reasons while an intervener stands ready to ensure the outcome and never acts,
  so that the agent is responsible though he could not have done otherwise.

  2. The irrelevance constraint: whatever the intervener''s presence changes about
  the assessment must be traceable to something in the agent''s own course of events,
  since the two scenarios are otherwise identical up to the moment of action.

  3. The residual-alternatives objection — that the counterexamples leave the agent
  with trivial leftovers (a moment of hesitation, an earlier opportunity) — together
  with the question whether any robustness condition on alternatives can be imposed
  without begging the question against the incompatibilist.

  4. The dilemma facing any such case: if the intervener''s trigger is determined
  by the agent''s prior state, the case cannot be pressed against someone who denies
  that determinism leaves alternative possibilities; if it is not, the agent apparently
  retains one.

  5. The distinction between guiding one''s behaviour and having options open, and
  an explicit statement of which the account requires.

  6. Consistency with the exculpating force of coercion, compulsion, and ignorance,
  which no account may explain away.

  7. Manipulation cases constructed to be neutral between determinism and indeterminism.

  8. Degrees: whether control must come in degrees to match degrees of blameworthiness.


  In addition, adjudicate three requirements I am unsure whether to include, and tell
  me for each whether it is genuine or a prejudice:

  - Assessor-accessibility: the condition must be one whose satisfaction can be determined
  on the evidence available to those who actually blame, since blame is a practice
  and not a metaphysical audit.

  - Counterfactual austerity: the account must not make an agent''s responsibility
  depend on facts about what hidden interveners would have done.

  - Explanatory depth: the account must say why the kind of control it identifies
  is the kind that bears on desert, rather than merely re-labelling the intuition.


  Then stress the list with this case, which is not in the literature as far as I
  know: the mechanism monitors the agent''s own deliberation and fires only if that
  deliberation is about to conclude against what the intervener wants; when it fires
  it does not cause the action but eliminates every alternative course at that moment,
  so that the agent''s reasoning and act are internally exactly what they would have
  been, and absent the mechanism he would have concluded differently. State which
  of your requirements this case strains, and whether handling it forces a historical
  condition on how the actual sequence arose.


  Finally: which single requirement eliminates the most candidates; is any subset
  jointly unsatisfiable, in which case say which member must be abandoned and why
  (I expect the deliverable to be an impossibility result in part, not a shopping
  list); and, in no more than a paragraph each, how a leeway theory that keeps a weakened
  alternative-possibilities principle, a source or guidance-control compatibilism,
  and the view that responsibility is compatible with determinism whatever turns on
  it do against the list. No scorecard, no references.


