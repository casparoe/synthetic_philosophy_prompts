  My younger brother died in March, and in the months since I have been unable to
  let go of one question, which I have come to realize is not a private fixation but
  the centre of a genuine metaphysical dispute: whether the past still exists, or
  whether what has happened is simply gone and only talk of it remains. I teach physics
  at a secondary school, so I know where the physics bears on the question; what I
  lack is any feel for the philosophical arguments, and the little I have read stops
  at the slogans. I have been invited to contribute a piece of philosophical fiction
  to a small review that publishes one story an issue, and I would like to submit
  something that treats the dispute seriously without turning into a dialogue in disguise.
  Please write that story.


  Length: roughly 1,800 to 2,500 words. Setting, characters, and voice are yours.
  What I would ask is that the story be built around three specific pressure points,
  stated below as plainly as I can manage, and that each of them be carried by something
  concrete the reader can picture — an object, a document, a machine, a procedure
  someone has to perform — rather than by conversation alone.


  First: if only present things exist, then there is nothing in the world for a claim
  about the past to correspond to. A well-known response is that what makes such claims
  true are exhaustive descriptions of how things were — maximal, mutually incompatible
  sets of propositions, exactly one of which holds, and which one holds shifts as
  the world shifts. The difficulty, as I understand it, is that such descriptions
  are abstract and unchanging, and it is obscure what could single one of them out
  as the one that obtains, or how a body of descriptions could answer to a man who
  is nowhere. I would like the story to contain something that plays this role — a
  register, say, kept with great care — and for a character to discover that it can
  be altered in a way that leaves the present detectably identical to what it would
  otherwise have been.


  Second: two observers moving relative to one another disagree about which distant
  events are happening now, and neither is mistaken; the size of the disagreement
  grows with the separation between the events and with the relative speed. If the
  present is a real, objective feature of the world rather than a way of speaking,
  something ought to select one of those incompatible accounts. Please let this bear
  on a character in a way that is practical or personal, not merely theoretical —
  a decision that has to be made about what is happening somewhere far away at this
  moment.


  Third: there is a middle view on which everything, past and future alike, exists,
  and yet there is in addition a privileged present that sweeps over the whole of
  it, so that only one region is now. Its critics say the sweep does no work: it explains
  nothing that the static picture did not already contain, and if it truly moves,
  it seems to require a second time in which to measure its rate. There is a further
  wrinkle I find appealing — the privileged present need not be a knife-edge instant,
  but might have some thickness, in which case one must ask whether its edges are
  sharp, and if they are not, whether the unsharpness is in the world or only in us.
  I would like a character to need this view to be true, and to be given a reason
  for doubting it that is not intellectual.


  Some constraints. No character should say presentism, eternalism, or block universe,
  and no one should explain the metaphysics to anyone else. The story should have
  a plot with at least one irreversible event, and it should not resolve the dispute:
  I do not want to be flattered into thinking the question has an answer I would like.
  What I want is to come away feeling, distinctly, what each of the three points costs.


