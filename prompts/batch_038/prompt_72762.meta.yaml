  me the following chain, which he says disposes of the whole controversy. He is a
  careful man and I do not think he is being sloppy, but I cannot accept the conclusion
  and I cannot locate the point where it stops following. Here it is as he gave it
  to me.


  (1) What makes a risk instrument unfair, as distinct from merely inaccurate, is
  that it distributes its errors unevenly between groups: if members of one group
  are likelier than members of another to be wrongly scored as high risk, or likelier
  to be wrongly scored as low risk, the instrument is unfair to them.


  (2) Fairness therefore requires that false positive rates and false negative rates
  be equal across the groups being scored.


  (3) Fairness also requires calibration: the same score must correspond to the same
  observed event rate for everyone who receives it, because a defendant told that
  her score means a sixty percent chance of re-arrest is entitled to that being a
  sixty percent chance whoever she is.


  (4) The impossibility results for risk scores show that when two groups have different
  base rates for the outcome, no score can be calibrated and also equalize both error
  rates; the only escapes are exact equality of base rates and a perfectly accurate
  score.


  (5) Base rates are never equal in any domain worth regulating, since a variable
  that predicted nothing would never have been adopted in the first place.


  (6) So no risk instrument actually in use meets (1)–(3), and each is unfair to someone.


