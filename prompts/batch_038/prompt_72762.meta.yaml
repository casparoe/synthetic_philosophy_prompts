  Now, where are the subtle flaws?


  - (1)→(2): (1) says uneven distribution of errors makes an instrument unfair; (2)
  turns this into a requirement of *equality*. Gap: "uneven" could mean "unjustifiably
  uneven" or "excessive"; the slide from a comparative/pro tanto consideration to
  an all-or-nothing necessary condition. Also, (1) frames unfairness in terms of error
  *burdens*, but FPR and FNR weight errors differently depending on the base rate
  and the stakes; equalizing both may not be what (1) demands once you consider that
  the relevant comparison might be about the *harm* of errors rather than their frequency
  (a false positive in pretrial detention costs differently for a defendant already
  detained). So (2) smuggles a frequency-for-harm substitution and a necessity claim.


  - (3): calibration as an entitlement. Note that calibration is a property of the
  score, and its moral force depends on the score being used as an estimate of probability
  rather than as an input to a decision rule. Also: calibration is about the *label*,
  and if the label is a biased proxy for the construct (rearrest vs. reoffending),
  calibrated-on-proxy is not calibrated-on-construct. This is a real subtlety the
  good answer should mention.


  - (4): correct statement of the theorem (with the degenerate exceptions). Fine.


  - (5): equivocation! The theorem''s exception is about equality of *base rates of
  the outcome across groups*, not about whether the score is informative. (5) says
  base rates are never equal because a non-predictive variable wouldn''t be used —
  that''s a non sequitur: base rate equality across groups is compatible with the
  score being highly informative overall (a score can be informative and groups can
  have equal base rates; e.g., a perfect score gives equal base rates? no — the perfect
  predictor is the *other* exception). The relevant conflation: "informativeness"
  (score predicts outcome) vs "inter-group base-rate equality" (outcome rate equal
  across groups). These are independent. So (5) is a genuine equivocation/scope error:
  the argument needs base rates to differ, and it "establishes" this from the score''s
  usefulness, which doesn''t follow. Strong candidate for THE flaw. Also (5) is empirically
  false in the strict form ("never equal") — the theorem''s impossibility is a limit
  case; near-equal base rates yield near-satisfiability, and the argument treats a
  quantitative trade-off as an absolute bar. That''s the "exact impossibility vs approximate
  trade-off" elision.


  - (6): from "fails the conjunction" to "fails (1)" — but (1) as stated doesn''t
  demand all three; and from "cannot satisfy all three" to "satisfies none" is invalid.
  Quantifier/modal shift. Actually (6) says "no real risk instrument satisfies the
  requirements in (1)–(3)" — that''s literally implied by (4)+(5) since the conjunction
  is unsatisfiable. The bad inference is "every one of them is unfair to somebody,"
  which requires that failing the conjunction entails unfairness — i.e., that all
  three are necessary conditions of fairness. If fairness requires any one of them
  (or some weighted combination), then an instrument satisfying calibration is fair
  by that criterion. So the equivocation: fairness as a conjunctive requirement vs.
  fairness as satisfied by meeting the relevant criterion in context.


  - (7): the consent point — interesting and not obviously false; but it assumes the
  choice is discretionary and that the affected groups could consent to something
  mathematically impossible. Also it assumes that the *choice* of criterion, not the
  *outcome*, is the locus of unfairness — which actually concedes that satisfying
  one criterion is permissible, contradicting (6). Nice: (7) undercuts (6). If the
  problem is the unconsented *choice*, then a consented choice is fine, and (6)''s
  blanket claim fails. Good internal tension.


  - (8): from unfairness to prohibition. Skips the comparison to alternatives and
  the possibility of choosing the criterion that minimizes the morally weighted disparity,
  and of changing the label or the decision context (e.g., reducing reliance on detention
