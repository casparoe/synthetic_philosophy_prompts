  consciousness; (ii) our talk is caused by physical processes; (iii) if consciousness
  is epiphenomenal, the physical processes that produce our judgments are the same
  in the zombie world, where they''d be false/empty. So our judgments about consciousness
  are not caused by consciousness. Two distinct worries: the coincidence worry (why
  are they so accurate?) and the knowledge worry (how could they be knowledge at all,
  given no causal link?).


  §3 My distinction. Two ways to explain the accuracy of phenomenal reports:

  (a) Third-factor harmony: qualia and the neural states that produce reports share
  a common cause or are linked by psychophysical laws such that reports track qualia
  non-causally. Analogy: a clock that''s kept in sync with a sundial by a shared mechanism
  — tracking without causation. Also: thermometer and temperature? No, that''s causal.
  Better: two thermometers in the same room, or a barometer and a thermometer both
  tracking the same weather front.

  (b) Constitutive acquaintance: the quale is a constituent of the judgment rather
  than a cause of it — the belief is partly made of what it is about. Then no causal
  link is needed for the report to be non-accidentally accurate; the report cannot
  be false about that quale in the way a causal-tracking report can.


