  If the above is right, the paradox of phenomenal judgment does not refute epiphenomenalism,
  but it forces it into a disunified account of phenomenal judgment — one mechanism
  for the self, another for everyone else — and the resulting asymmetry is a substantive
  cost, heavier than the standard complaint that the view is merely counterintuitive.


