  **§1. The view and its motive.**


  Epiphenomenalism is the claim that conscious states are caused by physical states
  of the brain but cause nothing physical in return. Its appeal is that it buys the
  irreducibility of consciousness at the lowest available price: if the physical world
  is causally closed, then any non-physical event either violates that closure or
  is inert, and an inert mental event is a smaller scandal than a broken law of physics.
  Huxley''s whistle is the standard image: the mental accompaniment contributes nothing
  to the engine''s work. Jackson''s discussion of the neuroscientist raised on black-and-white
  prints is usually taken to supply the further premise that no amount of physical
  information exhausts what there is to know about colour experience, and the resulting
  package — irreducible qualia, closed physics — is epiphenomenalism.


  **§2. The paradox.**


  Chalmers formulates the difficulty as a paradox of phenomenal judgment. We are conscious;
  we think and talk about consciousness; and our thinking and talking are, by the
  epiphenomenalist''s own lights, wholly produced by physical processes. But those
  same processes would have run exactly as they did in a world without consciousness.
  So nothing about the way the world feels makes any difference to what we say about
  the way the world feels. Two complaints are usually run together here, and I want
  them apart. The coincidence complaint: the match between our judgments and our qualia
  looks like an unexplained regularity, a pre-established harmony maintained by nothing.
  The knowledge complaint: if a state cannot affect the formation of a belief about
  it, then belief about it cannot be knowledge, and the epiphenomenalist owes us an
  account of how we know our own minds at all — a line pressed by Robinson among others.


  **§3. Two routes to accuracy.**


  An epiphenomenalist who wants to answer both complaints has, I think, exactly two
  shapes of answer available.


  *Third-factor harmony.* Qualia and the neural states that produce reports about
  them are both fixed by something else — psychophysical laws, or a common nomological
  ground — such that reports track qualia without being caused by them. Two instruments
  in the same room may agree about the temperature without either causing the other''s
  reading. This route answers the coincidence complaint only by relocating it: the
  tracking regularity is itself the unexplained harmony, now stated as a law instead
  of a fact. And it does nothing for the knowledge complaint, since tracking without
  causal contact is precisely what the complaint says cannot amount to knowledge.


  *Constitutive acquaintance.* The quale is not a cause of the judgment but a constituent
  of it. If my belief that I am in pain is partly composed of the pain, then the belief
  cannot misfire about the pain''s presence, because there is no gap between the representing
  and the represented that could be filled incorrectly. This route answers the knowledge
  complaint directly: acquaintance does not need causal traffic, and its non-accidental
  accuracy comes from constitution rather than correspondence.


  **§4. The asymmetry.**


  My claim is that the two routes are not equally available across persons. Constitution
  is a first-person-only resource. My judgment that you are in pain is not composed
  of your pain; nothing you undergo can be a constituent of a state of mine. So the
  third-person case must fall back on harmony, with all of harmony''s weaknesses,
  while the first-person case is secured by constitution. Epiphenomenalism therefore
  predicts an asymmetry that its critics have not, I think, exploited: my reports
  about my own experience are insulated from the coincidence and knowledge complaints,
  while my reports about yours are exposed to both in full. [I believe something in
  this neighbourhood is said, but I am not sure how much of it is already standard.]


  This is not merely a restatement of the problem of other minds. The ordinary problem
  is that evidence about another''s experience is behavioural and hence indirect.
  The asymmetry I am describing is sharper: it is that no evidence whatsoever, direct
  or indirect, could put me in the right relation to your quale, because the only
  relation that could do the work — constitution — is unavailable in principle. Other-minds
  scepticism is normally an inductive deficit; here it is structural.


  **§5. The objection I cannot fully answer.**


  Constitution looks like a way of getting tracking for free, but it needs a pairing.
  Which neural state has which quale as a constituent is not fixed by the quale, since
  the quale is inert; so it must be fixed by a psychophysical law, and that law is
  a harmony regularity again. Worse, a pairing law can guarantee that some quale is
