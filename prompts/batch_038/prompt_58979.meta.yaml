  or "sensitive" success), i.e., robustness across nearby worlds.

  4. Credit-worthiness / praiseworthiness (Scanlon-ish): moral worth = the agent is
  attributable and deserving of praise.

  5. Motive-of-duty-only-plus-desire: hybrid.

