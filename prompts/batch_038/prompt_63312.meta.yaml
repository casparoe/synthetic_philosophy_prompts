  hospital resources / burden on families, and (2) controversy in obtaining organs
  for transplantation. So the claim "invented to harvest organs" is partly a distortion
  — organ procurement was mentioned but as a secondary purpose, and whole-brain-death
  doctrine has been developed independently. Also there''s the fact that brain death
  is defined by law differently in different jurisdictions, that the UDDA (1981) is
  arguably ambiguous, and Shemie/Hastings Center project.


