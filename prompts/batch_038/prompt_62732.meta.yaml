  ---


  I work in institutional research at a public university and there''s a thing in
  our annual equity report I''ve never quite been able to make sense of, philosophically.
  Figured I''d ask.


  Every year we publish three sets of numbers on graduate admissions, broken out by
  gender. (1) The overall admit rate for the whole university. (2) The admit rate
  within each department. (3) A "standardized" overall rate, where we take each department''s
  admit rate and weight it by a fixed reference mix of applications — basically the
  departmental composition from a base year, held constant so the number doesn''t
  move just because engineering got bigger.


  Most years, some departments have gaps pointing the opposite direction from the
  aggregate — Simpson''s paradox, I know, I''ve read the pop explanations. What I
  don''t get is that the report publishes all three numbers side by side with no note
  about which one is the finding, and different offices cite different ones in different
  meetings. And the standardized number is not stable: the reference mix gets rebased
  every five years, and when it does, the trend line for the past decade visibly shifts,
  sometimes enough to change which years look like improvements. Nobody writes that
  down as a change in what''s being measured; it''s treated as the same quantity,
  measured better.


  Layered on top is a second practice. When a department actually gets in trouble
  over its numbers, the university''s own explanation is almost never about that department''s
  admit rate. It''s about decisions made above it — how many lines went to which division,
  whether we chose to grow a field, whether a department was funded. So the institution
  holds itself answerable for the aggregate while explaining the aggregate entirely
  by the shape of the partition, and treats the cells as someone else''s business.


  So: what view of probability, or of measurement, or of what a statistic is about,
  does this whole apparatus presuppose? I''m especially interested in:


  - what publishing (1) and (2) unannotated assumes about whether "the admit rate"
  names one quantity with the level of aggregation as an artifact, or two genuinely
  different quantities that both exist;

  - what the standardized number assumes — that composition is a nuisance to be stripped
  away? that there''s a version of the university''s behavior invariant to who applies
  where? is there such a thing, and does the practice need there to be?

  - whether rebasing every five years is consistent with the claim that it''s the
  same quantity over time;

  - whether the second practice is coherent: under what account of being answerable
  for an outcome is a within-department reversal exculpatory for the departments but
  not for the university?


  Reconstruct the implicit theory as precisely as you can, and tell me which rival
  positions it quietly rules out. Then say what would have to change in the report
  if we replaced it with the view that the right level of aggregation is fixed by
  causal structure, and separately with the view that it''s fixed by whatever decision
  the number is going to feed — I gather those give different answers here and I''d
  like to see how. Also be clear about what the practice strictly presupposes vs.
  what it just happens to sit well with; I suspect some of this is underdetermined
  and several theories would license the exact same PDF.


  No citations needed, I''ll chase down sources myself. But do mark, as you go, which
  parts of your reconstruction are settled and which are actually contested among
  people who work on this stuff — I''d rather not come away thinking there''s a consensus
  where there isn''t one.


