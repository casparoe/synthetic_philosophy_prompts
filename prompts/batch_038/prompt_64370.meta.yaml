  "Malcolm''s argument begins from a question about what could possibly count as evidence
  for a claim about what happened while someone was asleep. His target is the received
  view that a dream is an experience which occurs during sleep and which the dreamer
  then recalls on waking. Malcolm thinks that this picture cannot be given content.
  If I say that I dreamt that I was being chased along a beach, there is no way of
  establishing when during the night that experience would have taken place, how long
  it lasted, or indeed whether anything at all was going on at the time; the sleeping
  person is not in a position to observe anything, and there is no independent record
  against which the memory could be checked. Malcolm draws the conclusion that the
  dream cannot be an event or an experience in the sleeper''s past. What the report
  really expresses is the impression the speaker has on waking: to say ''I dreamt
  that p'' is to say that one has, now, a certain impression of having dreamt that
  p. The past tense in ''I dreamt'' is therefore misleading, since there is no past
  occurrence it refers to. This is why Malcolm also insists that dreams have no duration
  in the ordinary sense — the familiar puzzle of the dream that seems to have lasted
  an hour but which must have occurred in the seconds before waking simply dissolves,
  because there was no hour and there were no seconds: there was only an impression.


  Dennett''s reply is that Malcolm has proved far too much. The argument depends on
  the assumption that if a dream had really been experienced, the dreamer would have
  been able to tell, at the time, that it was happening, and would have carried a
  faithful record of it forward to the moment of waking. Dennett denies that this
  assumption is available. He distinguishes two ways in which the content of a conscious
  episode might be settled: in a Stalinesque model, the content is composed before
  it ever reaches consciousness, so that what the subject later reports was already
