  (c) Grice vs. Strawson (In defense of dogma) about whether intuitions are data /
  whether meaning is fixed by usage — actually Strawson''s point: Grice''s program
  requires that we already know the semantic meaning of expressions before we can
  compute what''s said, but the only evidence for semantic meaning is speakers'' usage-based
  intuitions, which are the very data Grice wants to explain pragmatically. So there''s
  a bootstrapping problem. That''s delicious and in-the-weeds but subtle.

  (d) Grice vs. relevance theorist (Sperber & Wilson): loose talk, metaphor, and "what
  is said" — relevance theorists deny there''s a level of "what is said" that is truth-evaluable
  and minimally decoded (they think decoding gives a logical form that needs free
  enrichment). And they deny that implicature derivation is a matter of preserving
  the literal truth-conditional content. A classic case: "I''ve had breakfast" → "I''ve
  had breakfast today" (enrichment); "The ham sandwich wants his check" → referential
  metonymy; "France is hexagonal"; "I''ve eaten" (Recanati). Also the "availability
  principle" — is the content of what is said what speakers would report?

