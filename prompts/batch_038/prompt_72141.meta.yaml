  I think "speech acts and performative utterances" + "argument that seems to prove
  too much" is a great combination. The classic argument: Austin''s performatives
  are not true/false; but the paradox of the performative — if "I promise to X" is
  infelicitous, then no promise is made; hence the statement "I promise that p" cannot
  be used to assert p; hence the liar-paradox-like result. Or: the argument that all
  utterances are performatives, hence nothing is true or false — that proves too much.
  Or the "illocutionary suicide" argument: if "I hereby state that p" is a performative,
  then asserting it can''t also describe; but every assertion is an act of asserting;
  so every assertion is a performative; so no assertion is true or false. That''s
  a nice "proves too much" argument.


