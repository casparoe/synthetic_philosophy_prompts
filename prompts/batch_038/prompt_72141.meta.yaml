  "I promise to Φ" only creates an obligation if the speaker is sincere/intends to
  Φ (Austin''s felicity condition B: the speaker must intend to do the act, and must
  actually subsequently conduct herself accordingly). So a promise only binds if you
  already intended to do it; if you already intended to do it, the promise adds nothing;
  so promises never create new obligations. That''s a nice "proves too much" argument
  — it proves promises (and oaths, contracts) do nothing. The flaw: conflates the
  sincerity condition (a felicity condition) with a precondition of content — an equivocation
