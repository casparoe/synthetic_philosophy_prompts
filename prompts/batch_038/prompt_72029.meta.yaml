  Draft:


  ---

  I am drafting a review essay on whether the Darwinian framework survives its transfer
  from genes to culture, and I have been sorting cases by whether the item in question
  looks to me like a genuine unit of cultural selection. Here are my verdicts, together
  with the reasons I find myself giving.


  1. A fiddle tune learned by ear in a village, passed on with small variations each
  time, never written down: a replicator. Copies get made, variants differ in catchiness,
  and which variant you heard shapes what you pass on.

  2. A medieval recipe for a sauce that survives only because scribes copied it faithfully
  into new manuscripts, and that nobody has cooked in six hundred years: still a replicator,
  though a dormant one. Copying continued; the effect on behaviour stopped.

  3. The QWERTY keyboard layout: a replicator, even though it spread by lock-in and
  compatibility rather than by being good at anything. Nothing selected for it, but
  it is very clearly selected.

  4. An urban legend about contaminated food, which spreads because it reliably provokes
  disgust and gets retold from memory: not a replicator. What is being transmitted
  is the hearer''s disposition; the story is a fresh construction each time out of
  standard parts, and it converges on the same shape in every culture because our
  minds are built the same way.

  5. A slang expression that spreads precisely because few people use it, so that
  its success destroys the condition of its success: a replicator, and the clearest
  case on my list, since here the item''s own properties drive its own copying rate.

  6. A doctrine of voluntary celibacy, or of martyrdom, that spreads widely while
  lowering the reproductive success of the people who hold it: the paradigm selfish
  replicator. Host interest and item interest come apart, and the item wins.

  7. A practice sustained only by sanction — a handshake, or a form of address — where
  the thing that keeps it in circulation is that people punish those who drop it:
  not a replicator. The unit here is a norm with an enforcement apparatus around it,
  and it would be better described as an equilibrium than as a lineage.

  8. The decimal place-value notation, or the wheel, which spreads because people
  see that it works and adopt it deliberately: not a replicator. The variation here
  is directed by insight, and the retention is explained by human problem-solving
  rather than by differential copying.


  The tentative principle I have been trying these against is: an item is a unit of
  cultural selection just in case (i) it is copied with enough fidelity that variants
  can be distinguished, (ii) features of the item itself causally influence how many
  copies get made, and (iii) differences in copying rate between variants are themselves
  inherited by later variants.


