  MIU-system rules (from GEB, Chapter I):

  1. If you possess a string whose last letter is I, you can add a U at the end. (xI
  → xIU)

  2. Suppose you have Mx. Then you may add Mxx to your theorem collection. (Mx → Mxx)
  — i.e., double whatever follows the M.

  3. If III occurs anywhere in a string, you may replace it with U. (III → U)

  4. If UU occurs anywhere inside a string, you may drop it. (UU → nothing)


