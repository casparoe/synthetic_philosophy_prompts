  whether adding a new rule would count as a jump — the good answer: yes in the trivial/mechanical
  sense it''s a revision of the system, but it''s not the interesting jump; the interesting
  jump is the reasoning that establishes underivability, and stipulating MU as an
  axiom is not a jump out of the system so much as the construction of a new system,
  leaving the original question untouched. The student conflates "revising the system"
  with "jumping out of it."

