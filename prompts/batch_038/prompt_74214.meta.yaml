  The invariant: the number of I''s is never a multiple of 3. Start with MI (1 I).
  Rule 1 doesn''t change I count. Rule 2 doubles I count (so if not divisible by 3,
  doubling isn''t either). Rule 3 reduces I count by 3 (divisibility by 3 preserved).
  Rule 4 doesn''t change I count. So I count can never be a multiple of 3; MU has
  zero I''s, and 0 is a multiple of 3. Hence MU unobtainable.


