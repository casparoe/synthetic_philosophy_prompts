  rational comparison via a plurality of criteria — actually Nussbaum distinguishes
  commensurability (single metric) from commensurability as "capable of being compared
  rationally"), Anderson''s critique of cost-benefit and expressive reason, Williams''s
  "ground projects"/integrity and "one thought too many," Sunstein on incommensurability
  in law (incomparable values often blocked by social norms), and the "trumping"/"lexical"
  structure. Also: the difference between "no common measure" and "no common cardinal
  scale but still comparable ordinally." And practical: the "small improvement argument"
  gives an actual test the practitioner can run — that''s a real, usable procedure
  element! Excellent: the procedure can include Chang''s small-improvement test as
  an operational probe ("improve A slightly along some dimension; does the committee
  now clearly prefer A+ to B? If yes, then A and B were... etc."). And the "tiebreaker
  tell" can be handled by another probe: if an arbitrary tiebreaker is accepted without
  felt residue, the values probably weren''t on a par; parity claims, on Chang''s
  account, resist resolution by arbitrary means — actually there''s a real literature
  point: Chang argues that in parity cases, the agent can rationally create a new
  reason by commitment ("commitment" / voluntarist view: where reasons run out, you
  can commit, and the commitment isn''t arbitrary in the sense of being unmotivated).
