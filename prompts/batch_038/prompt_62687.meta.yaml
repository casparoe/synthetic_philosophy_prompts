  distinction (content-selective vs form-imposing scepticism) that the question was
  designed to probe, and note that I want the grader to check whether the candidate
  distinguishes them.

  - Paragraph 3: present the student''s answer (a few hundred words). Then the ask:
  assign a mark within the bands, and give point-by-point comments: what''s right,
  what''s subtly wrong, and where the reasoning fails; be specific about the sentence;
  don''t just give an overall impression. Also state whether any claim in the answer
  is a straightforward misattribution.


