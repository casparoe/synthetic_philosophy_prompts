  "Ranke''s dictum expresses what might be called the mirror ideal. The historian
  is to suppress his own interests and let the documents, properly collated, speak
  for themselves; the past is then displayed as it was, and the only source of distortion
  is the historian''s failure to get out of the way. Carr''s attack in What Is History?
  (1961) begins from the observation that there is no such thing as a purely documentary
  starting point. He distinguishes the facts of the past — everything that ever happened
  — from the facts of history, the far smaller set that historians actually work with;
  which of the former become the latter is settled by the historian''s own standards
  of relevance, and those standards are the products of his age and his social position.
  History on this account is a continual back-and-forth between the historian and
  his material rather than a one-way transmission from archive to page. Because the
  facts of history are constituted by the historian''s thinking, Carr''s position
  is close to Collingwood''s, for whom history is the re-enactment in the historian''s
  mind of the thoughts of past agents; Carr adds only that the re-enactment is socially
  conditioned. It follows that there is no neutral vantage point from which an account
  can be checked, since checking already presupposes the standards of relevance that
  were at work when the facts were selected. Carr is therefore a relativist about
  historical truth: any two accounts, provided each is internally disciplined and
  faithful to the documents it has admitted, are equally good.


  White goes further along the same line. In Metahistory (1973) he argues that a history
  is not a list of true sentences about the past but a story, and that the past does
  not supply stories: real happenings do not come with beginnings, middles and ends,
  or with heroes and victims. The historian therefore emplots, casting his material
  as romance, tragedy, comedy or satire, and the choice of emplotment is not answerable
  to the evidence, since the evidence is compatible with each of them. The same sequence
  of events can be written as the triumph of liberty or as its betrayal without a
  single one of the sentences about those events being altered. Carr and White thus
  agree in substance: what makes an account historical is not its correspondence to
  the past but the historian''s constructive activity, and White simply applies the
  point at the level of form where Carr applies it at the level of content. Since
  neither thinks construction can be checked from outside the construction, neither
  can hold that one account is more objective than another; historical writing can
  be more or less useful to present purposes, and that is the only gradation left.
  Ranke''s ideal is not merely difficult but unintelligible, since it asks the historian
  to be a mirror when the very material he mirrors has already been shaped by the
  shaping."


