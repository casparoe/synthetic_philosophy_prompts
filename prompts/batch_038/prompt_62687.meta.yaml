  For the student answer''s errors, I want them to be catchable by philosophical reasoning
  plus general knowledge:


  Error A: The student treats White as simply "going further in the same direction"
  as Carr — that both deny objectivity and both say historians impose rather than
  find — missing that Carr''s scepticism targets the selection of facts (which facts
  count as relevant/historical), while White''s targets the narrative form itself
  (the past isn''t story-shaped, so any story is a literary construction; Carr would
  reject the inference from narrative to invention). Also the student might say "Carr
  and White agree that facts are constructed" — for Carr, facts of the past are not
  constructed; the historian''s interpretive work is on discovered material, and Carr
  insists the documents constrain.


  Error B: The student infers from Carr''s "the facts are selected by the historian
  according to his own standards" that Carr is a relativist for whom any account is
  as good as any other, or that Carr thinks historians can invent facts. But Carr
  explicitly distances himself from scepticism about the possibility of historical
  knowledge — he thinks the direction of history provides a standard and that bad
  history can be recognized.


  Error C: A step that doesn''t follow: the student argues that because White says
  narratives are invented, White must also say the events narrated didn''t happen
  / that history is fiction; then concludes White''s view makes historical debate
  pointless, since no evidence could adjudicate between emplotments. But White''s
  claim is about form, not about the truth of the statements of occurrence; and he
  holds that chronicles/annals differ from histories, and that the factual layer is
  still constrained.


