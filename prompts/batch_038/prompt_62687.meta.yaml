  that the historian''s mind is a blank mirror — and possibly claims Ranke denied
  any interpretive activity. This is a caricature, but note it''s also partly what
  Carr himself attacks; a good grader would say the caricature is too crude (Ranke
  also held that each epoch is immediate to God, and he sought a spiritual/inner meaning
  in events; the dictum concerns showing rather than judging the past, in contrast
  with histories that judge the past and instruct the future). But should I rely on
  the grader knowing Ranke''s "jede Epoche ist unmittelbar zu Gott"? That''s fairly
  well-known among philosophers of history. Hmm, for a small model this might be too
  niche. Maybe make Error D milder: the student says Ranke''s dictum is an epistemological
  claim that we can know the past with certainty by eliminating our own biases, and
  that Ranke thought of himself as writing science in the sense of natural science
