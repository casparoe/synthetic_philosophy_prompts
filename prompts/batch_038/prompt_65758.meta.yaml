  losses and reinsurers. Hmm, the table limit one is nice and concrete: the casino
  has a positive expected value on every bet and could accept arbitrarily large wagers;
  but it caps them. What theory of value/risk does that presuppose? Answer: bounded
  utility of money (Bernoulli), or the distinction between expected value of the game
  and expected value of the growth rate (time-average vs ensemble average — Peters''s
  ergodicity economics), or the presence of ruin as an absorbing state. And an internal
  tension: the casino simultaneously advertises "the biggest payouts" and progressive
  jackpots with unbounded payoffs (lottery rollovers), which is a positive-EV-seeking
  behavior in the customer — presupposing customers maximize expected monetary value
  while the house maximizes something else. That''s a lovely apparent inconsistency
  and it''s exactly the St. Petersburg structure: progressive lottery jackpots that
  grow without bound until someone wins, and analysts saying "the ticket now has positive
  expected value, so buy it" — but the correct answer says it doesn''t, because of
