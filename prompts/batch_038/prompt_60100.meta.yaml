  Setup: Reflection principle (van Fraassen 1984): P_now(A) should lie within the
  range of the agent''s anticipated future credences: specifically, P_now(A | P_future(A)
  = r) = r. So conditional on the event that my future self will have credence r in
  A, my current credence in A should be r.


  Known tension: Cases where the agent expects future evidence that is misleading
  but they''ll take it at face value. Example: You know a coin is fair. You''ll be
  shown a video of the flips tomorrow, but you know the video is generated by a machine
  that shows heads with probability 0.9 regardless of the actual outcome (and you
  can''t detect the substitution). Hmm, but then the future self would be reasoning
  correctly given their evidence (the video) — they''re not impaired, they''re just
  misled. So Reflection says: now, conditional on my future credence in Heads being
  0.9, my current credence should be 0.9. But I know the coin is fair, so my unconditional
  credence now is 0.5, and... wait, but the conditional credence P_now(Heads | future
  credence = 0.9) — hmm, actually if the machine shows heads with prob 0.9, then the
  future credence being 0.9 correlates with the video showing heads, which correlates
  with... nothing about the actual coin. So the correct current conditional credence
  should be 0.5, while Reflection demands 0.9. That''s a genuine conflict — and it''s
  the "misleading evidence" case, which is discussed in the literature as a limit
  of Reflection. But is the future self "impaired"? No — they see veridical-looking
  evidence and update rationally. So the constraint "no impairment" is satisfiable
  but the case relies on knowing-you''ll-be-misled.


