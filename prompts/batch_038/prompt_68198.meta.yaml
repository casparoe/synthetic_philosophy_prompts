  the designers wanted a single line marking "the start of the Anthropocene." Rosa
  (environmental historian) and Ben (Quaternary geologist, does lake cores) disagreed
  about what should go there. Roughly this was the exchange, I''ve numbered the moves:


  (1) Rosa: put 1610. Ice cores show a dip in atmospheric CO2 around then, best explained
  by the collapse of Indigenous populations in the Americas after 1492 and the forests
  that grew back on abandoned farmland. Dating it there names the actual cause — colonization
  and the Columbian Exchange — instead of implying that "humans" in general did this.


  (2) Ben: you can''t build a geological boundary out of that. An epoch has to begin
  at a point you can physically locate in one reference section and then match everywhere
  else; that''s why the working group that spent fifteen years on this proposed a
  mid-20th-century start tied to fallout radionuclides, with a varved lake in Ontario
  as the reference site. A CO2 dip in an ice core is a smooth wiggle of a few ppm
  over decades, not a horizon you can drive a spike through, and different ice cores
  put the minimum in slightly different years.


  (3) Rosa: your marker is worse, not better. Plutonium comes from bomb tests, so
  the official birthday of the human epoch is set by a handful of militaries in a
  decade when most people on Earth still farmed with hand tools. And fallout isn''t
  synchronous either — deposition varied by hemisphere, latitude, and rainfall, so
  you have exactly the diachrony problem you just accused me of.


  (4) Ben: partly fair, but the bomb signal is sharp, unmistakable, and shows up in
  nearly every archive — corals, tree rings, ice, varves, cave deposits, even human
  teeth — so it can be correlated globally even if it''s not perfectly instantaneous.
  Also, a boundary is a bookkeeping device. Putting it at 1950 doesn''t claim humans
  started changing the planet in 1950, any more than the boundary at the end of the
  Cretaceous claims the impact happened at the exact moment the iridium layer settled.


  (5) Rosa: that''s my point, though — if the date is a bookkeeping convention, then
  choosing among candidate conventions isn''t dictated by the rocks, and it''s legitimate
  for other considerations to weigh: what the label will teach a fourteen-year-old,
