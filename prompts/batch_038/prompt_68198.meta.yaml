  stratigraphic committees turned the whole proposal down in 2024, largely because
  the start date was too recent and the sediment record too shallow, and the international
  union confirmed it. So the experts themselves decided the formalization frame didn''t
  work. Which means the honest wall text is no date at all: describe it as a long,
  uneven process.


