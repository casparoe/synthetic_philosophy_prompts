  evolutionary influence); the distinction between moral realism vs. moral naturalism;
  Street''s dilemma being about "whatever caused it, does the causal story make tracking
  truth unlikely?" and Enoch''s objection about scope; Joyce''s argument being epistemic
  rather than semantic (that our moral judgments are unjustified, not that they''re
  false); the difference between the genetic fallacy objection and the response; the
  "access objection"/Benacerraf-style reliability challenge (Field''s challenge);
  the distinction between debunking (showing our beliefs are unjustified/false) vs.
  vindicating (showing they''re right).


  A good mixed student answer: correct on the broad structure — Street''s Darwinian
  dilemma has two horns: realist and non-realist/constructivist, arguing that either
  our moral judgments are unrelated to the moral truth (realist horn) or there''s
  a relation but it''s a matter of luck... Actually Street''s dilemma: the realist
  must explain the relation between evolutionary pressures and moral truth; either
  Darwinian forces pushed us toward independent moral truths or not; if not, we''re
  off the track (skepticism); if yes, that''s a coincidence — "miracle" explanation.
  Constructivism: moral truths are constituted by evaluative attitudes, so there''s
  a non-accidental relation. So the dilemma targets robust/realist metaethics.


  Subtle mistakes to plant:

  1. Conflating Joyce''s epistemic debunking argument with an error theory. Joyce''s
  genealogical argument: our moral beliefs are explained entirely by evolutionary
  forces that were indifferent to truth, so they lack evidential support, therefore
  we ought to abandon the belief that we have knowledge — Joyce''s argument is that
  we should be "moral fictionalists"/skeptics about the warrant, not that moral statements
  are false. The error theory is a separate claim (moral properties don''t exist),
  which Joyce''s genealogy doesn''t establish. A student might say "Joyce concludes
  that all moral claims are false; therefore he''s a moral error theorist and this
  is the conclusion of his debunking argument" — conflation. Actually careful: Joyce
  does hold the error theory, but his *genealogical/debunking* argument is an epistemic
  argument about justification, not an argument for error theory. That''s a nice subtle
  mistake.


  2. Getting Street''s horns backwards or saying the dilemma shows moral realism must
  be false rather than unsupported/skeptical.


  3. Confusing "third-factor explanations" — Enoch''s: survival/reproductive success
  is good, and that creates a correlation between evolutionary forces and moral truth.
  Street''s own third factor: it''s better to survive and have kids. Wielenberg''s
  objection: the third factor is a "brute coincidence" too because it doesn''t explain
  why *the process* of evolution produced beliefs about *particular* moral truths.
  Also FitzPatrick''s objection: the third-factor realist response relies on reflective
  reasoning capacities that aren''t merely products of natural selection — i.e., the
  scope problem: evolution doesn''t shape our reflective moral judgments directly,
  so the debunker needs to explain the reliability of our reflective capacities too.


  4. Conflating the genetic fallacy objection with the response: the objection says
  that debunkers commit the genetic fallacy because the origin of a belief is irrelevant
  to its truth; the response says the debunker isn''t arguing from origin to falsity
  but from origin to unreliability/lack of justification. A student might say "the
  genetic fallacy objection shows the debunker''s argument is invalid because the
  origin of a belief has nothing to do with its truth, and Street accepts this objection
  and therefore reformulates the argument" — subtly wrong: the objection isn''t fatal
  because the debunker''s conclusion is epistemic.


  5. Misattributing: saying Street endorses a "tracking"/third-factor realist response
  as her own solution while she''s a constructivist; or attributing "brute coincidence"
  to the wrong person.


  6. Conflating moral constructivism with non-cognitivism / subjectivism — Street''s
  constructivism is a form of anti-realism about mind-independent moral truth but
  holds moral judgments can be true/false.


