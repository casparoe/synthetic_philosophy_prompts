  Let me construct the exchange with 4-5 moves, each decent:


  (1) Priya/whoever: Friedman''s F-twist — unrealistic assumptions don''t matter as
  long as predictions work; she says this is just wrong because a model that predicts
  well by accident could break under intervention (policy). Example: a model predicting
  that a minimum wage has no employment effect might fit past data, but if the reason
  it fits is a wrong story about labor demand, the prediction fails when conditions
  change. So "predictive success" isn''t self-validating: what licenses extrapolation
  is that the assumptions are at least approximately true of the relevant mechanism.


  (2) Other guy (let''s call him Marcus): says that''s an impossible standard — every
  model has false assumptions (frictionless planes, point particles, no externalities),
  and physics gets away with it; if Priya''s standard were right, no model would ever
  be usable. So Friedman is right to make prediction the only test.


  (3) Priya replies: physics differs — a physicist can tell you which idealizations
  matter and which don''t and can systematically de-idealize (add friction back) and
  check that predictions converge to observed values. In econ you often can''t do
  that, and worse, you can''t tell which false assumptions are harmless. So the disanalogy
  does the work: it''s not truth-of-assumptions per se, it''s whether you can identify
  the idealizations as harmless.


