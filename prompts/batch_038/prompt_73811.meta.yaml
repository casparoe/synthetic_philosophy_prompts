  remember: ''Written in wartime California and published in Amsterdam in 1947, the
  book argues that the Enlightenment — the eighteenth-century movement of Kant, Voltaire
  and the encyclopedists, with its faith in reason, science, and tolerance — carried
  the seeds of the totalitarianism that drove its authors out of Europe. Their point
  is not that reason was misused by bad people but that reason itself, once it insists
  on measuring and classifying everything, can only see individual things as instances
  of a type, and a population reduced to instances of a type is a population that
  can be counted, sorted, and shipped. So Auschwitz is not an aberration of the Enlightenment
  but its logical outcome: the industrial logic of the factory applied to human beings.
  They put it as a two-way street — myth is already enlightenment and enlightenment
  reverts to mythology — meaning that science is just religion with better instruments
  and religion is just proto-science, which is why there''s no difference in kind
  between Homer and Hitler. Horkheimer spelled out the mechanism the same year: reason
  had shrunk to a tool, a calculator of means, and once reason can only rank means
  it has nothing to say about ends. They offered no way out, except art; their own
  gesture toward the Marquis de Sade as the Enlightenment''s most honest spokesman
  shows how far the diagnosis went. The argument became the common sense of the humanities
  — Foucault made it concrete by tracing the asylum, the clinic and the prison to
  the same rationality — and it explains why every promise to use data to make the
  world better is the last stage of the same disease.''


  I''m inclined to think the piece is overselling, and I''ve heard Habermas accuse
  the book of a performative contradiction, that a total critique of reason has to
