  - Jonathan Dancy, Moral Reasons (1993), Ethics Without Principles (2004). The "holism
  of reasons": the same consideration can be a reason in one case and no reason, or
  an opposite-valued reason, in another. E.g., "he promised" is normally a reason;
  but a promise to do something horrible. Dancy''s example: that someone is in pain
  is a reason to help, but if the pain is deserved (a criminal being punished)...
  hmm. Standard Dancy examples: "That would be a lie" (usually wrong-making, but not
  when lying to a murderer at the door); "That would give her pleasure" (usually good-making
  but not when the pleasure is malicious — schadenfreude).

  - Default reasons: Dancy''s middle ground — some features are reasons by default,
  favoring unless disabled; principles can be stated as "defaults" rather than exceptionless.
  That''s a nuance from Ethics Without Principles (favouring, disabling conditions,
  enablers, intensifiers/attenuators, forcers). This is genuinely "in the weeds" and
  accurate.

  - The proviso problem: generalist principles need "ceteris paribus" clauses; each
  counterexample adds a proviso; either the principle becomes trivial ("do the right
  act") or infinitely long. This is the standard particularist argument.

  - Generalist rejoinders: (a) McKeever & Ridge''s "principled" defense — principles
  can be finite and useful; they distinguish the codifiability thesis from a weaker
  claim that principles are ineliminable in moral practice; they argue particularists
  overstate the holism. (b) The argument from moral explanation/justification: we
  justify decisions by citing general considerations; particularism makes moral reasoning
  mysterious. (c) Moral education: children learn via rules. (d) Publicity/impartiality:
  without principles, moral criticism and accountability lose their footing; a judge
  who decides case-by-case without rules is arbitrary. (e) The "no-guidance" objection:
  particularism offers no action-guidance; but Dancy replies that principles don''t
  guide either, since you must first perceive the case''s salient features — judgment
  is a perceptual capacity (a Wittgensteinian/Aristotelian phronesis theme).

