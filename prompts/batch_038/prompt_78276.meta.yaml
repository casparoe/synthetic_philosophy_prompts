  Design idea: "Truth Market". Each pair of students is an "inquiry team" with a budget
  of credibility points. Round 1: each team is dealt sentence cards; they must classify
  each as (a) definitely true and known, (b) definitely true but currently unknown,
  (c) not a truth / indeterminate, (d) unknowable truth. Points: they earn for correct
  classification against a hidden answer key? No — the point is that (d) is forbidden
  by their own anti-realist commitment. So: teams sign up as anti-realists at the
  start (they get a big endowment for accepting the knowability principle — "the anti-realist
  subsidy"), and they must mark every card either "true & known", "true but unknown",
  or "not true". Then the facilitator, following a mechanical procedure, builds a
  new sentence out of their own marked cards: for each card they marked "true but
  unknown", they must add a card that says "card X is true and nobody knows it" —
  and then the procedure applies the knowability principle to the conjunction... The
  mechanical derivation then forces them either to abandon a marked card or to conclude
  they know it.


  Better and cleaner mechanic: a "ledger" where every sentence the room agrees is
  a truth gets a "◇K" tag attached by rule (that''s the knowability principle they
  subscribed to). Rules also include: distribution (K of a conjunction entails K of
  each conjunct), KK (knowing entails knowing you know), and non-omniscience (nobody
  knows everything — represented by a rule that at any point at least one card in
  the ledger is face down/unclaimed). Then they must maintain consistency of the ledger;
  the facilitator''s "auditor" role mechanically derives consequences. The trap: any
  card marked "true but not known by anyone in this room" generates, by the ledger
  rules, a contradiction. So they discover that their own rules force either omniscience-in-the-room
  or giving up knowability.


  The twist: the diagonal sentence is constructed from their own card (self-reference
  via a card that refers to itself, e.g., "This card is true and no one in this room
  knows it" — students will resist that as trivially self-referential). To avoid the
  "it''s just a liar-ish trick" reaction, use non-self-referential indexicals: each
  team writes down a sentence about a specific unknown fact (e.g., "the number of
  grains of sand in the jar is even") that they mark as true-but-unknown; then the
  ledger forms the conjunction "p and nobody in this room knows that p" for their
  own p — that''s not self-referential at all, it''s a sentence they themselves just
  built. That''s exactly the Fitch move and feels much less like a cheap trick.


  So Round 1: teams propose a candidate "true but unknown" sentence (about something
  in the room: the number of paperclips in an envelope, the color of the card in the
  sealed envelope, the exact word count of the handout, whether the TA has a coin
  in her left pocket — must be verifiable-ish but currently unknown to everyone, and
  they must not be able to learn it during the session). Points: they earn credibility
  for each accepted "true but unknown" card, and they earn the anti-realist subsidy
  only if they also stamp every true card with "◇known".


  Round 2: the auditor applies their own rules: from the card, by knowability, possibly
  someone knows (p & ¬Kp); by distribution and KK, contradiction. So they must retract.
  Losing all their round-1 points. Then: the room must decide which rule to give up.
  Teams bid for which rule to drop (distribution, KK, knowability, non-omniscience,
  classical logic) — a "sacrifice auction" where each team argues their drop costs
  the least and the room votes. That''s the debrief engine.


  Round 3 (optional twist): the restriction round — the anti-realists get to propose
  a subclass of sentences ("safe"/"Cartesian"/"decidable") for which knowability is
  claimed, and they get their subsidy back if they can write a precise admission rule.
  Then the facilitator tests it: teams try to build an admission-rule-breaking sentence,
  and the auditor checks whether the diagonal sentence needed to break it is itself
  admissible. Points for the first team to break a proposed restriction.


