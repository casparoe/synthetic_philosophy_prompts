  Desiderata for Grice''s theory of implicature: the requirements list — what a theory
  of conversational implicature must deliver: (1) explain the gap between sentence
  meaning and speaker meaning (the "said vs implicated" distinction, with cases like
  "some of the students passed"); (2) calculability — the hearer must be able to derive
  the implicature from what is said plus context plus the assumption of cooperation,
  so no "hidden" pragmatic magic; (3) cancellability without contradiction — a genuine
  implicature can be explicitly denied/defeated; (4) nondetachability — attachable
  to any way of saying the same thing (with the exception of manner implicatures);
  (5) reinforcability — you can add "in fact, not all" without redundancy; (6) the
  distinction between generalized and particularized; (7) it must not over-generate
  — it must explain why we don''t compute every logically possible implicature; (8)
  consistency with the fact that implicatures can be contextually suspended; (9) developmentally
  and cross-linguistically plausible (children acquire scalar implicature late; languages
  differ in scale availability); (10) interface with semantics — the "what is said"
  must be truth-evaluable and minimal (vs. relevance theory''s explication, vs. Bach''s
  impliciture). And which subset is jointly unsatisfiable: e.g., cancellability +
  calculability + minimal what-is-said may conflict — because if what is said is minimal
  and often not propositional (Bach), then the calculability route fails; and cancellability
  fails for some implicatures that everyone agrees are implicatures (e.g., "he''s
  poor but honest" — actually the concessive "but" implicature: is it cancellable?).
  Also nondetachability fails for manner implicatures. Also the biggest one: the requirement
  that implicatures be derived from a general principle (cooperation) vs. the requirement
  that specific lexical scales be available (Horn scales) — the theory needs both
  a general engine and a lexical list, and it''s unclear what does the work.


  Actually there''s a well-known joint-unsatisfiability candidate: if you require
