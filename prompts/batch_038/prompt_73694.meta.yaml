  Actually a really nice in-the-weeds conceptual issue: the distinction between Zorn''s
  lemma and the "Kuratowski–Zorn" style argument and the fact that in many applications
  you apply Zorn to a poset of partial objects and the maximal element''s maximality
  is then converted into existence by a separate argument (e.g., a maximal proper
  ideal is prime... actually maximal ideal in a commutative ring with 1 is proper
  and the quotient is a field; a maximal ideal exists by Zorn; but for "every proper
  filter extends to an ultrafilter", the maximal element argument requires showing
  maximality in the filter poset implies ultrafilter). The conceptual point: Zorn''s
  lemma gives maximality with respect to the ordering you chose, and the philosophical
  work is in choosing the right poset so that maximal = the object you want. That''s
  a genuinely conceptual issue that a model can explain well without web access.


