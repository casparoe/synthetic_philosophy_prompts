  good outcomes" — the criterion in (2) is a maximizing-aggregation criterion whereas
  subsidiarity is not purely consequentialist (it has intrinsic value in participation,
  accountability, local knowledge, diversity as experimentation), and (3) slides from
  "can in principle" to "does in practice" — an ought/ability gap; also scope shift:
  subsidiarity is about allocation of decision rights, not about which level produces
  better outcomes in a particular instance (it''s a rule vs act level distinction
  — act-level subsidiarity vs rule-level). Also (4) "almost every policy has spillovers"
  — trivially true but the magnitude matters; and internalizing externalities can
  be done by horizontal mechanisms (compacts, courts, fiscal equalization) rather
  than vertical transfer. Also the "at least as good" comparison is ill-defined because
  the relevant baseline includes the effects of the allocation rule on democratic
  agency, and because of the knowledge problem.


