  Draft:


  "My roommate and I got into it last night about subsidiarity and I still can''t
  tell if he beat me or I beat him. He gave me this:


  (1) Subsidiarity says a decision should be made at the lowest level of government
  that can handle it competently.

  (2) A level handles a matter competently only if the outcomes it produces are at
  least as good as those any higher level would produce.

  (3) A local decision imposes costs on outsiders that the locals don''t bear, so
  local decision-making systematically underweights those costs; a higher-level decision-maker
  internalizes them.

  (4) So for any matter with cross-border effects, the higher level produces at least
  as good outcomes, hence is the competent level.

  (5) Practically every matter has cross-border effects — roads connect, pollution
  drifts, capital and people move, standards get competed to the bottom.

  (6) So subsidiarity assigns practically every matter to the higher level.

  (7) A principle that assigns everything to the center isn''t a principle of decentralization.
  So subsidiarity either is a centralizing doctrine in disguise, or it''s empty.


  I pushed back and he said... "


  Where does it go wrong? Multiple candidate flaws:

  - (2) is a smuggled consequentialist gloss: subsidiarity''s "competence" (in Catholic
  social teaching and in EU practice — the subsidiarity test in Article 5 TEU) is
  not about outcome maximization; it involves whether objectives can be "sufficiently
  achieved" by member states and "better achieved" at Union level "by reason of the
  scale or effects." Note the actual EU test is about "better achieved," and it''s
  a comparative-institutional question, not a global outcome maximization. Also the
  "at least as good" standard ignores the epistemic/participatory goods.

  - Equivocation on "outcomes": (3) compares outcomes of a decision made at level
  L on a single matter, but the relevant comparison for an allocation rule is outcomes
  of the whole system of allocation (rule-level vs act-level). Even if centralizing
  each matter raises that matter''s outcome, universally centralizing may be worse
  overall (loss of experimentation, information, accountability, exit/voice, capacity
  atrophy). Classic: the fallacy of composition — each stepwise centralization improves
  that issue but the sequence''s endpoint is worse. This is a nice subtle flaw: the
  argument is a sorites/composition slide. Actually (5)+(6) is precisely a composition
  move: from "for each matter with spillovers, the center is better at that matter"
  to "the center should have all matters," which ignores that the center''s competence
  at matter M depends on it not also having matters N, O, P... i.e., capacity constraints,
  attention, information processing. That''s a good flaw: the premise (4) is evaluated
  holding everything else fixed, but (6) applies it to everything at once, changing
  the ceteris paribus conditions. That''s a real and subtle point.

  - Also (3) has an implicit "internalizing" assumption: higher-level decision-makers
  internalize spillovers only if the affected outsiders are represented at that level;
  in a federation, the center''s constituencies are also parochial; and spillovers
  can be internalized horizontally (compacts, courts, fiscal transfers, mutual recognition)
  without transferring decision rights. Also Coasean point: the argument assumes transaction
  costs of horizontal bargaining exceed those of vertical authority.

  - (5) is trivially true but "practically every" ≠ "every," and more importantly
  magnitude/degree: subsidiarity in EU practice is scalar (better achieved by reason
  of scale or effects), not binary. The argument converts a scalar test into a binary
  one.

  - (2) also: "at least as good as any higher level would produce" — the counterfactual
  outcomes of a higher level are not independent of the allocation rule; also "as
  good" requires an aggregation metric across persons (whose welfare? total? weighted?)
  — spillover internalization trades off insiders'' and outsiders'' interests, and
  the metric choice does the work.

  - Also (7): even if the conclusion were right, "not a principle of decentralization"
  doesn''t follow; subsidiarity might be a defeasible presumption of decentralization,
  or a burden-shifting/justificatory principle (a procedural constraint requiring
  the center to justify centralization), rather than a substantive allocation rule.
  That''s a good price analysis: subsidiarity as a burden of justification (which
  is how the EU''s Protocol on subsidiarity and proportionality actually works: national
  parliaments'' "yellow card" etc.).


