  neutral about forest spirits, that''s because spirits are the kind of thing third-person
  evidence could in principle bear on. But heterophenomenology makes the subject''s
  text the *only* route in to the item, and then insists the item can only be confirmed
  by... more text and brain data. So the neutrality is real only about things the
  method could ever vindicate. For qualia it''s rigged from the start.


