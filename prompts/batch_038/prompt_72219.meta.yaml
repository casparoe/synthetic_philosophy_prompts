  choice. Kuhn does say that scientists share values like accuracy, scope, simplicity
  and fruitfulness, but since the values themselves are internal to the paradigm and
  are weighted differently by each side, there is no common standard by which one
  side can be shown to be right. Conversion is therefore closer to a religious or
  political conversion than to being persuaded by an argument, and Kuhn admits as
  much when he says the proponents of rival paradigms live in different worlds. In
  practice the shift is carried through by a change of generation: the older scientists
  never convert, they just die out, and the discipline moves on.


