  This is why Kuhn thinks a paradigm shift isn''t like a refutation. Normal science
  doesn''t test the paradigm, it uses the paradigm to solve puzzles, so an anomaly
  is a failure to solve a puzzle rather than a counterexample, and a paradigm is only
  ever abandoned when an alternative is available — nothing is falsified in Popper''s
  sense.


