  What I do know reliably about Hacking and looping effects:

  - Hacking''s "looping effects of human kinds" (essay title: "The looping effects
  of ''human kinds''", in Sperber, Premack & Premack eds., Causal Cognition, 1995;
  also "Making Up People" 2006 in the London Review of Books / Harper''s; "Making
  up people" originally in Reconstructing Individualism, 1986).

  - Interactive kinds vs. indifferent kinds: classifying people changes the people
  classified, which changes the classification, in a loop.

  - "Making up people" — new descriptions create new ways to be a person; new kinds
  of people come into existence alongside new ways of classifying them.

  - Hacking resisted the inference that this makes the kinds unreal: he often emphasized
  that a looping effect is not the same as "socially constructed and therefore not
  real"; he distinguished questions of reality from questions of stability.

