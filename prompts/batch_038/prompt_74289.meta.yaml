  Design A: "The Custom of the House." Each student group gets a sealed box containing
  a mechanism (or the facilitator) that produces outputs. Groups observe input-output
  pairs and must bet on the next output. Key twist: the mechanism is actually a confederate/facilitator
  following a rule that can change without warning at a "miracle" moment; also some
  groups get a box that is genuinely mechanical (a die with a trick, or a spring),
  and others get a box that''s just a person underneath the table. Then debrief: the
  groups that got the mechanical box report "I knew it, because there''s a spring
  inside"; but how do they know? Because they''ve seen it opened. The point: observational
  access never yields necessity; the difference between the two box-types is invisible
  from the outside — which is exactly Ghazālī''s claim, and exactly the philosophers''
  objection that Ghazālī is making science impossible.


