  Question as printed:


  "2. (25 points) Alice wrote a directive at 62. It stated that if she reached a condition
  of advanced dementia in which she no longer recognized her children and could no
  longer follow a conversation, she was not to be given antibiotics for intercurrent
  infections, and that she was to be allowed to die of whatever came along. She gave
  no reason in the document beyond one sentence: that such a life would not be hers.
  Alice is now 79 and in exactly the condition she described. She is placid, hums
  along to the radio, enjoys being fed sweets, and does not resist care. She has developed
  pneumonia. Her daughter asks that the directive be honored. The attending physician
  proposes to treat, on the ground that the woman in the bed is not suffering, would
  not protest the injection, and has something to lose — namely, the comfortable life
  she is now leading.


  (a) (6 points) Explain how Dworkin''s distinction between experiential and critical
  interests is meant to resolve the dispute between the daughter and the physician.
  Say what each side is appealing to, in those terms.


  (b) (7 points) State the strongest objection that starts from Alice''s present condition.
  Do not merely restate the physician''s remark: explain what the objection has to
  establish in order to defeat the directive.


  (c) (12 points) Using the scope/force distinction as defined in lecture, say whether
  the objection you gave in (b), at its strongest, is an objection to the scope of
  Alice''s directive or to its force, and argue for your classification. A bare classification
  will not earn points; the points are in the argument."


  Student answer (verbatim):


  "(a) Dworkin separates interests into two kinds. Experiential interests are interests
  in having certain experiences — pleasure, the taste of something, the enjoyment
  of music, the absence of pain. Critical interests are interests that are not about
  how moments feel but about the shape and value of a life as a whole; Dworkin sometimes
  talks about them as concerning the narrative integrity of a life, what makes a life
  a good story rather than a series of agreeable episodes. The physician is speaking
  the language of experiential interests: Alice now is comfortable and treating the
  pneumonia gives her more comfortable days. The daughter is appealing to critical
  interests, and Dworkin''s claim is that critical interests are the deeper ones,
  so the person who had them — Alice at 62, who was capable of framing her life as
  a whole — speaks for the whole of the life, including its ending. It is worth adding
  that Dworkin''s critical interests are basically what Frankfurt means by second-order
  volitions: the reflective endorsement of a desire, rather than the desire itself.
  Both philosophers are pointing at the same structural feature, namely that a person
  can stand outside her own motivations and evaluate them, and the directive is the
  record of that evaluation.


  (b) The objection is not that Alice would mind the injection. It is that the being
  whose life is at stake no longer has critical interests at all. If critical interests
  require the capacity to conceive of one''s life as a whole, and present Alice has
  lost that capacity, then there is nothing left in her but experiential interests,
  and these are satisfied by continuing and frustrated by letting the pneumonia proceed.
  So the objection has to establish two things: first, that critical interests are
  capacity-dependent in this way and extinguished rather than merely unexperienced;
  second, that the interests of the person now are the ones with the standing to determine
  treatment, since it is she who will die. If both hold, honoring the directive sacrifices
  a real, present interest to a defunct one, and the daughter''s appeal is a kind
  of loyalty to a person who is gone. It is also worth noting that the standard way
  of blocking this — saying that demented Alice is literally a different person from
  the Alice who wrote the directive, so the directive simply does not reach her —
  is not available to Dworkin. Dworkin''s whole point is that the earlier self''s
  critical interests survive into the later condition and continue to make claims,
  so he cannot treat the two as numerically distinct. Others in the literature do
  run the identity argument, and it is tempting here.


  (c) The objection is an objection to scope. The question of scope is the question
  of which conditions a directive speaks to, and the objection claims that the condition
  Alice is now in is not the condition she was writing about, because she was writing
  about herself and there is no longer a self of that kind to be written about. If
  the directive''s addressee has ceased to exist, the directive has nothing to apply
  to, and that is a scope failure rather than a matter of weight. The physician''s
  point about the comfortable life she would lose looks like it concerns force, but
  on reflection it also concerns scope, because it depends on there being someone
  whose interests count. So the classification of the objection in (b) is that it
  undermines the directive''s applicability.


  That said, the more interesting question is how much weight the directive would
  carry even if it applied, and here I think the answer is: less than Dworkin assumes.
  The sentence Alice wrote — that such a life would not be hers — is doing a great
  deal of work in her argument, and it is not clear that it is a claim about her life
  as a whole rather than an expression of revulsion, which is not the same thing and
  should not be given the same authority. A directive whose content is revulsion masquerading
  as narrative judgment has force, but only as evidence of what the earlier person
  feared, not as an instruction about what the later person should be made to endure."


