  First, some course context you need. Across three weeks we covered the argument
  that a competent person''s advance directive can bind others after the person loses
  competence, and the objections that start from the condition of the patient who
  is now demented. In lecture we introduced a distinction that does not appear in
  the readings under these names and that the students were told to use on the exam:
  the scope of a directive — which future conditions it speaks to, and whether the
  condition the patient is in falls under them — and the force of a directive — how
  much weight it carries, once its scope is satisfied, against the interests of the
  person who now exists. Students were told that scope and force can come apart: a
  directive can clearly apply and still be weak, or can be very weighty and yet not
  apply.


  [Question as printed] ... [Answer] ...


