  problem — by approximation, continuously, without anyone representing the objective
  function explicitly; and Mises''s impossibility claim amounts to saying that a computation
  cannot be performed without a single processor holding all the inputs. His conclusion:
  since the debate was about computation rather than about property, and since we
  now have both the compute and the machine-learning methods to run very large optimisation
  over huge, messy, real-time datasets, the Mises–Hayek objection no longer applies
  — at least not in the strong form in which it is usually quoted. He adds that the
  proof of the pudding is that any large logistics firm already does exactly this
  internally: it allocates scarce means among competing ends, at scale, without internal
  markets, using forecasting and optimisation."


