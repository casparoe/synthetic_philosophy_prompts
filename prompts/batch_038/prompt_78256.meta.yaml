  ---


  I am preparing a problem set for a graduate seminar on collective action, and I
  want a worked ranking exercise built around a case I have written specifically so
  that the standard diagnoses do not fit cleanly. All the relevant facts are given
  below; please do not assume anything further about the setting, and do not cite
  or recommend literature — I want reasoning from the case, not from the canon.


  The case.


  A semi-arid agricultural basin sits above a single unconfined aquifer. Roughly three
  hundred farms draw from it, along with one small city. Extraction happens through
  wells on private land; there is no metering, no telemetry, and no realistic prospect
  of either in the near term, so what any given farmer pumps is knowable only by inference
  (crop acreage, energy bills, visible rig activity) and concealment is cheap. Twenty
  corporate operations account for something on the order of three quarters of total
  lift; the median farm is small and family-run.


  Three features matter. First, pumping costs rise as the water table falls, so each
  user faces a private, immediate penalty for overdraft — the externality is partly
  internalized through cost, though only up to a point. Second, there is a threshold:
  once drawdown passes a certain level, compaction permanently reduces the aquifer''s
  storage capacity, and the lost storage does not come back if wet years return. Third,
  the parties who bear the cost of crossing that threshold are overwhelmingly future
  users and a downstream wetland that has no owner, no standing users, and no voice
  in any existing institution. The current generation''s own welfare loss from crossing
  it is real but discounted heavily.


  Institutional background. There is a voluntary groundwater association with no enforcement
  powers, which produces good hydrological data that everyone, including the large
  operators, accepts as accurate; the disagreement in the basin is not about the science
  but about the discount rate and about who pays. There is an adjacent irrigation
  district that allocates and meters surface water under rules the farmers have lived
  with for decades, so the community is not institutionally naive about water. The
  state water board could in principle confer regulatory authority over the basin,
  but doing so would be politically expensive and slow. A doctrine of reasonable and
  correlative groundwater rights exists, and a full judicial adjudication is available,
  though it would take the better part of a decade and would bind only those who appear
  in it.


  The task. Rank the following ten instruments by how well you expect them to perform
  *in this basin*, on the following understanding: an instrument "performs" to the
  extent that, if adopted here, it would plausibly keep total extraction below the
  level at which the storage-capacity threshold is crossed, within a realistic political
  and administrative horizon. Assign each an integer score from 0 (no prospect) to
  10 (would very likely work), order them from highest to lowest, and allow ties only
  where you say why the two are genuinely indistinguishable here. For each instrument
  give exactly one sentence of justification that must name a specific feature of
  the case — not a generic virtue or defect of the instrument.


  The instruments:

  1. A user-governed common-property regime on Ostromian lines: defined boundaries,
  monitoring by the users themselves, graduated sanctions, collective-choice arrangements,
  and nested tiers for the larger system.

  2. Hardin''s remedy of mutually agreed-upon coercion: a mandatory cap on lift enforced
  by a basin authority.

  3. A Pigouvian charge on extraction set at the estimated marginal external cost,
  including the future storage loss.

  4. Tradable extraction permits under a cap that declines annually toward the sustainable
  yield.

  5. Coasean bargaining among the users, with rights assigned either to the large
  operators or to a trust representing future and environmental interests — treat
  the two assignments separately if they rank differently.

  6. Full judicial adjudication of groundwater rights.

  7. An assurance contract among the large operators: each commits to a reduction
  that becomes binding only if enough of the others commit, with a variant in which
  non-signatories are compensated or charged for standing aside.

  8. Metering plus public disclosure of estimated extraction, with no sanction attached
  — transparency as an instrument in its own right.

  9. Direct purchase of extraction rights or of land by a conservation buyer, or payments
  to farmers for water left in the ground.

  10. Supply-side substitution: imported surface water and managed recharge, changing
  the resource base rather than the rules.


  Then answer three further questions, briefly:

  (a) Which single feature of the case does the most work in moving this ranking away
  from the order a textbook treatment of groundwater overdraft would give? Say what
  the textbook order is and what the feature does to it.

  (b) Name one instrument on the list that this case, if anything, vindicates against
  a common criticism of it, and one that the case refutes or shows to be aimed at
  the wrong failure — and in each case say what the case brings out.

  (c) Identify the two placements in your ranking that you consider most contestable,
  and say what further fact about the basin would settle each.


  Lead with your bottom line in the first sentence — the ranking itself, in a compact
  scored list — and only then give the justifications and the three answers. No preamble,
  and no restatement of the case or the question.


