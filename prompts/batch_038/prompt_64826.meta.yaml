  say so." Model answer must include: (1) the distinction between the utility function
  (which measures the value of outcomes, and can be linear) and the risk function
  (which weights by rank/probability); (2) a concrete example where concave u can''t
  reproduce the Allais preference pattern (the key: Allais preferences require common-consequence
  violation of independence; a concave utility function satisfies independence, so
  it can''t produce the Allais pattern) — this is the crucial technical point: expected
  utility with ANY utility function satisfies the independence axiom, and Allais preferences
  violate independence, so no utility function can explain them. That''s the killer.
  (3) The rank-dependence structure: risk-weighted utility integrates u weighted by
  a function of the cumulative probability, so the value of an outcome depends on
  how good other outcomes are and how likely they are — non-separability across states.
  (4) The global/instrumental implications: REU agents can prefer A to B in a global
  choice but at a sub-node choose differently, so the theory is not dynamically consistent
  in the standard sense; the question of whether this is exploitable (money pump)
  and Buchak''s response that risk attitude is a global feature of a plan over a whole
  life, not per-decision.


