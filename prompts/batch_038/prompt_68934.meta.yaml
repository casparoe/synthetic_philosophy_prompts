  Exam question (Question 3, 25 marks, ~500 words expected):


  "3. It is sometimes objected that revealed preference theory is empty: it defines
  preference in terms of choice and then explains choice by appeal to preference,
  so nothing could count against it. State this objection as strongly as you can.
  What can a revealed preference theorist say in reply? Does the reply show that the
  theory is empirically contentful, or only that the objection misfires? Distinguish
  the weak and strong axioms of revealed preference in your answer and say what work
  each does."


  Student answer (~450 words). Let me draft:


  "Revealed preference theory, as Samuelson set it out, tries to do demand theory
  without any psychology. Instead of assuming people have utility functions and then
  deriving choices, it treats choice as the basic data and reads preference off it:
  x is revealed preferred to y when the consumer takes x while y was available and
  affordable. Utility is then just a way of re-describing choice, not a mental quantity
  behind it.


  The objection says this makes the whole thing circular. If ''prefers x to y'' just
  means ''chose x when y was available'', then the claim ''consumers choose what they
  prefer'' is true by definition, and ''utility maximization explains the downward
  slope of the demand curve'' is a restatement of the data in a new vocabulary. A
  theory that can''t be wrong can''t explain anything, so the objection concludes
  that revealed preference theory is not an empirical theory at all but a redescription.


  The strongest reply is that the axioms are not definitions but restrictions on possible
  data. If preferences are read off choices, then choices have to be consistent with
  each other for there to be anything to read off, and consistency is a substantive
  condition that a consumer can fail. The weak axiom says that if x is chosen when
  y is affordable, then y must not be chosen when x is affordable. The strong axiom
  extends this to chains: it requires that the revealed preference relation be transitive,
  so that if x is revealed preferred to y and y to z, then z cannot be revealed preferred
  to x. Afriat''s theorem makes the point sharp: a finite data set of prices and quantities
  satisfies the generalized axiom exactly when there is some utility function that
  rationalizes it, so the axioms are necessary and sufficient conditions on the data,
  not conventions.


  Once you see this, the objection misfires. The theory is empirically contentful,
  because real choice data can violate the axioms — you can find it in the lab and
  in household budget data — and the demand-theoretic results, like the negative slope
  of the compensated demand curve, are genuine consequences rather than definitions.


  There is a limit to how far this goes, though. Giffen goods show that the axioms
  don''t buy you everything economists want. A Giffen good is one whose quantity demanded
  rises with its price, and this flatly contradicts the strong axiom: if the price
  rises and the consumer takes more of the good, the good has been revealed preferred
  at a situation where less of it was available, which the strong axiom rules out.
  So the revealed preference theorist has to admit that a good deal of classical demand
  theory — in particular the ordinary law of demand — is not derivable from the axioms,
  and this is a real cost: the theory''s content is thinner than the utility-maximizing
  picture it replaces.


  So: the circularity objection fails, but the theory''s success is more modest than
  its defenders claim. It is testable, and it is also weaker than the theory it was
  meant to reformulate."


