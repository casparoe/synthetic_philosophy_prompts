  Conceptual issue candidates in IRL:

  1. The identification/observability problem: reward functions are only identified
  up to shaping and up to untested alternatives; behaviors under constraint (poverty,
  coercion, limited options) don''t reveal preferences. Revealed preference analogy:
  IRL inherits the revealed-preference problem — a person who works long hours might
  not prefer work; they might have no alternative. So IRL on human behavior may systematically
  encode structural constraints as desires.

  2. Off-dynamics / distribution shift: Cooper et al. "Implicit Regularization..."
  Actually the key result: Cooper, Cundy, Malik, Dragan (2022) "Implicit Regularization
  in Offline RL and Inverse RL" — the learned reward can be biased toward the dataset''s
  suboptimality; and "Off-Dynamics Reinforcement Learning" (Ziebart) where the expert''s
  dynamics differ from the learner''s, so IRL infers a reward plus a compensation
  for the mismatch — Ziebart''s "causal confusion"/"off-dynamics" framework: when
  you infer preferences from behavior produced under different dynamics (or different
  competence), you conflate reward with the mismatch term. That''s a nice conceptual
  issue: inferring preferences from behavior produced under different constraints/capabilities
  yields "preferences" that include a term reflecting the difference in dynamics.

  3. Cooper, Cundy, Malik, Dragan (2021) "The Implicit Bias of Imitation"/"Learning
  from Human Demonstrations: the bias issue" — expert demonstrations are biased toward
  the demonstrator''s own preferences and biases (e.g., anchoring, availability),
  so the learned reward includes those biases. Their point: IRL from expert data learns
  the "implicit" reward that includes the expert''s systematic deviations.

  4. The "reward vs. preference" conceptual slippage: IRL literature says it "infers
  human values," but the technical object is a reward function over states that rationalizes
  a policy; preferences are comparative and context-dependent. Whether the inferred
  reward is a preference or a disposition.

  5. Cooper et al.''s "off-dynamics" and also the concept that IRL is fundamentally
  underdetermined: any policy is optimal for some reward (e.g., reward = the policy''s
  own indicator), so additional assumptions (smoothness, MaxEnt, parsimony) do the
  real work. That''s a good conceptual point: MaxEnt IRL''s assumption that probability
  of a trajectory is exponential in return is what makes it work, not the data.


