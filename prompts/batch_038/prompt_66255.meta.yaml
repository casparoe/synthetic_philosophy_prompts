  Asker persona: A newly appointed head of cataloging/description at a regional historical
  society, or an archivist also finishing a PhD, writing a statement of descriptive
  philosophy for the repository''s new policy manual — wants a consistency check before
  it goes to the board. That gives stakes and a reason for the audit.


  Commitments (number them, ~6-7):


  1. Description should be neutral and evidence-bound: a catalog entry states what
  the record is and says, not what it means or what we think of it. Descriptive language
  should be the least loaded available; evaluative claims belong in scholarship, not
  the catalog.


  2. Archives are not neutral. The categories, titles, and finding aids inherited
  from the creators and from earlier archivists encode the viewpoint of the people
  who kept the records; a description that merely transmits them reproduces that viewpoint.


  3. Transcription fidelity: when a creator''s title or an item''s original label
  uses a term now understood as a slur or a demeaning designation, we transcribe it
  as it appears, in quotation marks, and never silently modernize. (This is a real
  archival norm — retain original title, supply alternative.)


  4. Absence is not nothing: where a community appears in the record only obliquely,
  or not at all, the description should register the gap — noting what the collection
  does not contain and why it plausibly does not — rather than leaving the silence
  to be inferred by the researcher. (i.e., silence as documented absence)


  5. Participatory/community description: where a community is described in the records
  and that community survives and is identifiable, its members should have authority
  over the terms used for them in our description; we adopt their preferred terms.


  6. Respect des fonds / provenance and original order: arrangement must reflect the
  creator''s organization; we don''t re-sort records to make them conform to how we
  now think about the subject, and we don''t create new "artificial" collections assembled
  by theme.


  7. Stability: descriptions are scholarly infrastructure. Once published, an entry''s
  substantive claims should not change; researchers must be able to cite a description
  and know that a later reader sees the same thing. We version and retain superseded
  language, but the current authoritative description should be as stable as possible.


