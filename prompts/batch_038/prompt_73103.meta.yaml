  Let me also double check the conceptual content so the false presupposition is genuinely
  false and the correct answer is available offline:


  - Handicap principle (Zahavi 1975): sexually selected traits that are costly handicaps
  honestly signal quality because only high-quality individuals can bear the cost.
  Grafen (1990) formalized: condition-dependent signaling, where the marginal cost
  of signaling is lower for high-quality individuals; honesty is maintained at equilibrium.

  - Key: it''s *differential* cost (or differential benefit), not absolute cost.

  - Spence (1973) job-market signaling: education is costly and the cost is inversely
  related to productivity → separating equilibrium.

  - Maynard Smith & Harper (1995): signals vs indices vs badges. Indices are unfakeable
  because of physical constraints; badges (conventional signals) are cheap but stabilized
  by punishment/escalation.

  - Also: the "waste must be wasteful" idea — Veblen conspicuous waste; but in signaling
  theory, the requirement is that the cost cannot be recouped by a low-quality individual.

  - Also relevant: "burning money" as a signal — the classic result is that burning
  money can signal only if the receiver''s belief updates because the sender''s payoff
  differs; also there''s the "money burning" literature (e.g., in auctions, all-pay
  contests).

  - Also: there''s a subtlety about whether costly signals must be wasteful: a signal
  that is costly but recoverable (e.g., collateral, a bond, escrow, equity retention)
  is often a *better* signal because it''s cheaper for the honest type. In finance:
  "skin in the game," debt as a signal (Ross 1977), dividends (Bhattacharya), warranties
  (Spence), franchisee fees. These all rely on cost differentials or on costs that
  are contingent/ recoverable.


