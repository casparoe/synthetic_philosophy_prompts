  ancestor. There are also working rules about the direction of error: scribes are
  likelier to smooth an awkward phrase than to introduce one, likelier to harmonize
  a quotation to a familiar text than to make it stranger, likelier to add an explanatory
  gloss than to delete one; so the harsher, the rougher, the more difficult reading
  is preferred. And yet the same editors, and the historians who use their editions,
  insist that nothing is known about the past except through surviving documents and
  material traces.


