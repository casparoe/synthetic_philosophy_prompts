  ---

  I work as a copy-editor on a series of translations of ancient Greek and Latin texts,
  and the more I learn about how the underlying editions are constructed, the more
  it seems to me that the whole craft rests on an epistemology nobody ever states.
  I''d like you to state it, and to test it.


  Here is the practice as I understand it. A work from antiquity typically survives
  in many medieval copies that disagree with one another. The editor does not simply
  follow the oldest manuscript, or take a vote across the copies. Instead she classifies
  the copies into a family tree on the basis of errors they share — two copies that
  reproduce the same nonsensical reading are taken to descend from a common ancestor
  that already contained it — and she then reconstructs the ancestor, which is itself
  a lost manuscript nobody has ever seen. Readings are chosen by asking which candidate
  best explains all the others as the results of copying mistakes, and the direction
  of error is assumed to be predictable: scribes smooth awkward phrasing, expand abbreviations,
  harmonize a quotation to the version they remember, and add explanatory glosses
  far more readily than they introduce difficulty. Hence a standing preference for
  the harsher, the rougher, the more difficult reading, and hence the rule that the
  number of copies supporting a reading counts for nothing in itself, since a hundred
  copies may all descend from one bad ancestor. And when no surviving copy contains
  a reading that the editor judges necessary for sense or metre, she may print her
  own conjecture, flagged as such in the apparatus.


  Meanwhile, the historians who use these editions insist that our only access to
  the past runs through surviving traces — documents and material remains — and treat
  any claim unsupported by a trace as speculation.


  My questions. What theory of knowledge, and of testimony in particular, does the
  editorial practice presuppose...? Which rival views does it rule out — e.g., a majority/aggregative
  view, or a view on which a witness''s reliability tracks proximity in time...? Distinguish
  what the method strictly requires from what merely happens to fit: does the family-tree
  procedure need the assumption that error is biased in a knowable direction, or could
  it survive with errors that are merely non-random? Where is the practice underdetermined
  — several incompatible theories of justification that would all license printing
  a conjecture? Is there a genuine inconsistency between conjectural emendation and
  the documentary principle, or is the lost archetype itself already a posit of the
  same kind, so that emendation adds nothing new? What happens to the method when
