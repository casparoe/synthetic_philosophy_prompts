  or Latin work survives in dozens of medieval copies that disagree, the editor doesn''t
  simply pick the oldest or the majority reading. The standard procedure is to explain
  each variant as the product of a scribal error and to prefer the reading that best
  explains the others as corruptions of it — including, sometimes, a reading that
  appears in no manuscript at all, which the editor prints as a conjecture, marked
