  \nDraft:\n\n---\n\n**Reach-Sensitive Induction: What the Centipede Argument Actually\
  \ Proves**\n\n*Draft for seminar circulation — comments welcome, especially on §4.*\n\
  \n**1. The game**\n\nConsider a six-move centipede of the familiar Rosenthal shape.\
  \ Players A and B alternate, with A moving first. At each of six nodes the mover\
  \ chooses Take or Pass; Take ends the game at the payoff pair shown, Pass hands\
