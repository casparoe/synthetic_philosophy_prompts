  Now, the details of the variants I''ll mention. Let me define them explicitly and
  self-containedly so I don''t misattribute:


  Setup A (the classic): an organiser chooses some positive amount of money, flips
  a fair coin, and puts that amount in one envelope and twice it in the other; hands
  you one at random; you may keep it or swap. You''ve not opened it; call the amount
  in your envelope A. Naive: the other is 2A or A/2 with probability ½ each, so expected
  value of swapping = 1.25A > A. Counter: let the pair be X and 2X; whichever you
  hold, swapping gains X or loses X with equal probability, so no gain.


  Setup B: you''re allowed to open the envelope and see the amount before deciding.


  Setup C: you''re told a bound: no envelope contains more than £10,000 (or: the smaller
  amount is at most £5,000). Then seeing £4,000 tells you the other must be £8,000
  (switch) — wait, if smaller ≤ 5000 and you see 4000, the other is 8000 (if 4000
  is smaller) or 2000 (if 4000 is larger, i.e. smaller = 2000). Both possible. If
  you see £9,000, then the other must be £4,500 since 18,000 > 10,000 cap. So bounded
  case: switching can be bad for large observed amounts. Good, and in bounded cases
  there''s no positive-EV-always.


  Setup D (asymmetric organiser): instead of a fair coin deciding which envelope gets
  the bigger amount... hmm, Nalebuff''s variant: the organiser writes down an amount,
  puts it in envelope 1; then flips a coin: heads puts double in envelope 2, tails
  puts half. So envelope 2 = 2×envelope 1 or ½×envelope 1, with the amounts not symmetric
  roles. Given envelope 1, the other envelope is either double or half, so naive calc
  says switch (expected 1.25 × A). Given envelope 2, the other envelope is either
  double (if it was halved) or half (if doubled) — so the same calc says switch again.
  Nalebuff''s point: the asymmetry is real and the "switch both ways" isn''t contradictory
  because the amounts aren''t a fixed pair; the organiser''s policy generates the
  second envelope from the first. Wait, but then "switching twice" — if you hold envelope
  1 and switch to 2, then from 2 back to 1... Under Nalebuff''s setup, envelope 2''s
  amount is determined by envelope 1''s, and switching back is just reversing, so
  the gain/loss reverses too. The point is that switching from 1 to 2 has positive
  EV given the amount in 1 (assuming proper handling), and this is genuinely possible
  because the two envelopes don''t stand in a symmetric relation — the "paradox" arises
  only if you think switching back must then also be advantageous. Nalebuff shows
  a consistent Bayesian can say: switch from 1 to 2, and then switch back? No. Let
  me not over-specify: I''ll describe it as a variant where the second envelope''s
  contents are generated from the first by a coin flip (double or halve), so the envelopes
  are not symmetric, and ask the tree to have a node on whether the organiser''s generating
  procedure is symmetric.


  Setup E (infinite mean / unbounded prior): if you insist the amount could be anything
  with positive probability, no proper prior makes the "½ each" assumption hold for
  every A. So a node: does the student think the "half the time double, half the time
  half" assumption can hold for every possible observed amount?


  Setup F (randomised policy, Cover-style): if you may open the envelope, there''s
  a policy that beats 50/50 at guessing whether you hold the larger amount, with no
  prior information about the distribution — pick a random threshold from a distribution
  with full support (e.g. based on a coin-flipping scheme giving a number), and switch
  if the observed amount is below the threshold. This is a genuine result (Thomas
  Cover, "Pick the largest number", 1987). I can describe it without naming.


  Also the "you may peek and the amount is huge / you know the organiser is a billionaire"
  cases.


  Nodes/questions for the tree:

  1. Is the phrase ''the amount in your envelope'' in the two occurrences of A in
  the calculation referring to the same thing? (equivocation/indexical node)

  2. Do you think it''s possible for a probability distribution over the organiser''s
  chosen amount to make "the other envelope is double" and "half" equally likely for
  every amount you might be holding? (prior node)

  3. If not, what happens to the naive calculation when the amount you observe is
  one where the odds differ?

  4. Does the answer depend on whether the pair of amounts was fixed before you chose,
  or generated from your envelope after? (symmetry node)

  5. Does it matter whether you''ve seen the amount?

  6. Do you accept infinite/undefined expectations as legitimate outputs?

  7. Is the puzzle under-described such that different completions get different answers
  (and is that a resolution)?

  8. Does the dominance-style argument (X vs 2X, equal chances) settle it independently
  of any prior?

  9. Should the rational thing be evaluated ex ante (policy) or ex post (after seeing)?

  10. Non-conglomerability: is a coherent probability assignment allowed to fail to
  respect the sure-thing reasoning across cases?


  Leaves:

  - Equivocation / indexical shift: A doesn''t denote a fixed quantity across the
  disjuncts; the calculation mixes conditional and unconditional. Awkward commitment:
  must explain why the same move isn''t a fallacy in Monty Hall-ish or other puzzles.

  - Improper prior / no such distribution: the "½, ½" assumption is impossible for
  a proper prior; there is no paradox, just an ill-posed problem. Awkward: can''t
  say what to do once you''ve opened the envelope and seen a specific number, and
  must deny the intuition that the puzzle feels like a genuine conflict.

  - Dominance/finite: the pair is X and 2X, so the gains and losses cancel; the naive
  calc is just wrong arithmetic on the wrong sample space. Awkward: seems to beg the
  question and gives no account of why the naive argument is so compelling; also must
  handle the bounded case where you can be sure.

  - Under-specification/pluralism: different fillings give different verdicts; the
  "paradox" is a family. Awkward: concedes the puzzle has no single answer, and must
  then say which reading is intended.

  - Unrestricted Bayesian / always switch: with an improper prior over all amounts,
  switching really is advantageous and switching back too — no contradiction because
  the expectations are infinite and conglomerability fails. Awkward: committed to
  "both switches gain" and to non-conglomerability.

  - Bayesian conditionaliser who says: after opening, switch iff the posterior odds
  of double exceed 1/3-ish; before opening, indifferent. Awkward: with no information
  at all, the prior is arbitrary, so "rational" advice depends on an arbitrary choice.

  - Randomised-policy leaf (ex post vs ex ante): you can beat 50/50 by randomising
  a threshold even with no prior. Awkward: the advantage vanishes/changes if the organiser
  knows your policy; and the gain is tiny/undefined.

  - Refusal-of-the-question leaf: expected value is the wrong tool; decision under
  radical ignorance should use something else (maximin, etc.). Probably unoccupied
  or occupied by a few.


  Unoccupied combinations to diagnose: e.g. "the prior must be proper AND switching
  is advantageous in the unopened symmetric case" — is that incoherent or just unexplored?
  "Expectation undefined AND yet determinate advice to switch" — incoherent? "Dominance
  settles it AND the bounded-case intuition that you should switch when you see a
  huge number" — inconsistent?


  Also flag pairs the tree can''t separate: equivocation vs improper prior often issue
  identical advice (don''t switch), so the tree needs a question about *why* to separate
  them; and under-specification vs conditionalising Bayesian.


  I should also ask the model to phrase each node question so a student could answer
