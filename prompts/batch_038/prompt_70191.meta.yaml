  I''m marking the final essays for a second-year epistemology module and I could
  use a second pair of eyes on one of them. Below is the question as it was set, then
  the student''s answer more or less as submitted (I''ve tidied the formatting, nothing
  else). Could you give me a mark out of 40 plus a comment for the feedback sheet,
  and — more importantly — go through the answer point by point, saying which claims
  are right, which are wrong or overstated, and which are debatable, so I can justify
  whatever grade I settle on? Please write the whole thing in British English.


  QUESTION (40 marks)


  Two agents, S and T, are epistemic peers about whether p. They share all the same
  first-order evidence about p, and neither of them gains any new evidence over the
  course of the term. S has, however, spent forty hours turning that evidence over;
  T has spent ten. Consider the following stipulated view, which we''ll call the Reflection-Discount
  View (RDV):


  RDV: S''s credence in p should move toward T''s credence by a factor of m/(n+m),
  where n is the number of hours S has reflected on the shared evidence and m the
  number of hours T has. So in the case above S should move only one fifth of the
  way to T''s credence. Where n = m, RDV reduces to moving half way.


  (a) Is RDV a form of conciliationism, a form of steadfastness, or neither? Argue
  for your answer. [10]

  (b) How should a defender of the Equal Weight View respond to RDV? [10]

  (c) It''s been objected that RDV undermines itself, since S and T are very likely
  to disagree about how much reflection time matters. Explain this objection and assess
  how much damage it does. [20]


  STUDENT''S ANSWER


  Conciliationism is the view that when you find out an epistemic peer disagrees with
  you, you should give up your belief, or at least go over to suspension of judgement,
  because the fact of the disagreement shows you''re probably wrong about as often
  as you''re right. Steadfastness says you can rationally keep your belief exactly
  as it was, because your peer''s disagreeing doesn''t give you any new evidence about
  p at all. These are the two main positions in the peer disagreement literature,
  associated with Christensen and Elga on the conciliatory side and with Kelly and
  the total evidence view on the other side.


  (a) RDV is a form of conciliationism, though a moderate one. It''s conciliatory
  because S is required to move at all: the mere fact that T, who has the same evidence
  and is equally good at reasoning, has landed somewhere else, counts in favour of
  moving. It''s moderate because the size of the move depends on n and m rather than
  being fixed at a half. In the limit where m is very small compared with n, RDV becomes
  nearly steadfast, but it never quite gets there, since the weight on T is m/(n+m),
  which is never zero for any finite n. So RDV is best seen as a family of views running
  between the two poles, with the Equal Weight View as its n = m special case. That
  seems right to me: the further apart two people''s reflection times are, the less
  the disagreement should move them.


  (b) The Equal Weight View says that once you''ve established that T really is your
  peer about p, you should give equal weight to T''s prior judgement about p and to
  your own, because there''s no non-question-begging way of preferring your own reasoning
  over T''s. A defender of this view should object to RDV at exactly that point. RDV
  lets S discount T on the grounds that T has thought about the matter less. But S
  only knows that T has had ten hours rather than forty because S has already assumed
  that T''s ten hours were well spent; and if S''s judgement about how good T''s reasoning
  is was itself formed by S''s own forty hours of reflecting, then S is using the
  very reasoning that''s in dispute to justify trusting her reasoning over T''s. That''s
  the kind of bootstrapping the Equal Weight View is designed to block. There''s a
  second reply available too: reflection time isn''t obviously a measure of anything.
  Forty hours of bad reflection might be worth less than ten hours of good reflection,
  and RDV builds in a proxy that isn''t tracking what actually matters.


  (c) The self-undermining objection runs like this. RDV is itself a claim that S
  and T can disagree about, and in fact they will, since it says something about whose
  reflection counts for more. So S and T are peers about RDV itself, and they''ve
  reflected on it for different amounts of time, so RDV tells S to move part of the
  way toward T''s rejection of RDV. But then RDV is telling S to lower her confidence
  in RDV, which means it can''t be coherently held at all: it''s self-refuting. This
  is a serious problem, and it''s a problem specific to RDV, because ordinary conciliationism
  doesn''t have to say anything about reflection time and so isn''t exposed to it
  in the same way. It''s also connected to the more general point that what does the
  work in the disagreement debate is the uniqueness thesis, i.e. the thesis that a
  given body of evidence permits at most one rational doxastic attitude towards p.
  Uniqueness is what the steadfast defender needs, since if more than one attitude
  is permitted by the evidence, then S and T can simply both be rational in staying
