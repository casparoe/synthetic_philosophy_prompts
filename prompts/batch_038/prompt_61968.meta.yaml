  \ \"the thirst-and-brightness study,\" etc. Invented studies are fine — and the\
  \ prompt should make clear these are (fictionalized/anonymized) studies the asker\
  \ is describing, so the model doesn't need to recognize them. Hmm, but if I say\
  \ they're invented, the model can't use its knowledge of real studies — which is\
  \ exactly what we want (self-contained). But there's a subtlety: if the model recognizes\
  \ them as resembling real studies, fine. I'll describe them fully in prompt so no\
  \ recognition needed.\n\nLet me lay out the cases with a table-like prose.\n\nThe\
  \ referee: \"Dr. V\" — let's say my colleague is writing a review article and has\
