  \ I can build the earlier verdicts around invented studies that vary along: (i)\
  \ locus (early vision vs. later), (ii) content match, (iii) response measure, (iv)\
  \ demand characteristics/controls, (v) attention/eye-movement confound, (vi) persistence\
  \ over time.\n\nDesign: 6–7 earlier cases with verdicts, engineered so that at least\
  \ two rules fit all verdicts and diverge on the new case.\n\nLet me build this carefully.\n\
  \nRules candidates:\n- R1 (Content-matching / representational): penetration iff\
  \ the cognitive state's content is about the very property that is experienced differently\
  \ (semantic coherence requirement).\n- R2 (Early-vision locus): penetration iff\
  \ the effect is localized in early vision (thresholds/aftereffects/low-level features),\
