  \ penetration iff the effect persists when attention and eye movements are controlled/matched.\n\
  - R5 (Demand/belief-elicitation control): penetration iff effects survive controls\
  \ for participants' beliefs about the experimenter's hypothesis.\n- R6 (Diachronic\
  \ stability): effect must outlast the inducing state.\n\nNow I need verdicts on\
  \ invented cases that are consistent with, say, R1 and R3 (and R4?) but where R1\
  \ and R3 diverge on the new case.\n\nLet's craft cases. I'll name them generically\
  \ (\"Study A... Study G\") or descriptively, with invented lab names to make it\
