  \ requires having the experience yourself, so even though I can know that the pacing\
  \ is beautiful, I can't appreciate it until I read the novel. Hopkins's point fits\
  \ here: on his account the problem with aesthetic testimony isn't that the resulting\
  \ belief is unjustified, it's that there's a norm against forming aesthetic beliefs\
