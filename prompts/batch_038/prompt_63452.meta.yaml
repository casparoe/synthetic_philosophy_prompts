  \ and explain why the answer to that question is not simply a matter of counting\
  \ how much you trust critics.\"\n\nThat last clause is a nice \"seeding\" — it plants\
  \ the trap so a hasty student falls in. Good.\n\nNow the student answer (~400 words)\
  \ with planted errors:\n\nDraft student answer:\n\n\"The acquaintance principle\
