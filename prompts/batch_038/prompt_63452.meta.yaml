  \ rather than (i) justification: testimony gets you justified true belief but not\
  \ knowledge, because knowledge of aesthetic properties requires the right kind of\
  \ causal contact with them.\n\nHume is often cited as a counterexample, since the\
  \ standard of taste is set by the joint verdict of true judges, and that looks like\
