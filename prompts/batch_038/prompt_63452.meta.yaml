  \ me draft.\n\nParagraph 1 (framing, casual): TA-ing a third-year aesthetics course,\
  \ marking the take-home on aesthetic testimony, 40 papers, this is one of the ones\
  \ I can't place. Give rubric: it's out of 100, weight of assessment: 40% for accurately\
