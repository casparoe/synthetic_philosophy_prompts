  So the genuine tensions:

  A. (3) [methodology: meaning/dignity claims must be cashed out in effects on norms
  and relationships] vs (6)+(7) [civic and degradation reasons for gouging laws and
  surrogacy ban]: partly dissolves for (6) since the student already cashed it out;
  does not dissolve for (7) if surrogacy prohibition rests on "the child is not a
  commodity"/"gestational labor isn''t a commodity" without an effect-based account.
  Requires work.

  B. (5) vs (2): why does state-monopsony design neutralize norm degradation for organs?
  The crowding-out mechanism operates through the practice being publicly recognized
  as something one may buy and sell — a legal, posted price is itself an official
  endorsement, arguably a stronger expressive signal than a black market. So (5) may
  undermine itself. Genuine.

  C. (4) internal: fixed price below market + supply-increase rationale. If the price
  is deliberately held below the market-clearing level (as (5) requires to avoid "the
  degradation of a floating price"), the quantity response is attenuated; the lives-saved
