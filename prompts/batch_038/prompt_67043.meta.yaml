  (1) Consent and mutual benefit are the normal grounds on which a voluntary exchange
  is legitimate; I do not think a transaction needs any further justification beyond
  that.

  (2) There is nevertheless a class of goods for which market norms crowd out the
  non-market norms they depend on — care, civic duty, the meaning of the human body
  — and where that crowding out happens, the market is wrong even if every participant
  is fully informed and glad to be there. I take this to be an empirical claim about
  how norms change, not an aesthetic reaction.

  (3) Correspondingly, I reject the inference from repugnance to wrongness. That a
  market strikes people as distasteful or as "putting a price on" something priceless
  is not, for me, a reason against it.

  (4) On that basis I favor replacing the current ban on compensating living kidney
  donors with a regulated system: a single government buyer paying a fixed, publicly
  posted amount (a tax credit plus funeral and medical expenses, say) to the donor
  or the donor''s estate, with resale and private brokerage prohibited.

  (5) I think this design, rather than the existence of a cash market, is what answers
  the objection that organ sales degrade the donor and the body: the state''s endorsement
  is limited and instrumental, and the price is not allowed to float.

  (6) I also favor maintaining anti-price-gouging statutes. My reason is not distributive
  — I accept that the poor will be outbid either way — but civic: emergency pricing
  converts a shared catastrophe into an occasion for extraction, and I think that
  damages the norms of mutual aid on which the community relies in the next emergency.

  (7) I think commercial surrogacy and the sale of votes should remain prohibited,
  while paid plasma donation should not be.


