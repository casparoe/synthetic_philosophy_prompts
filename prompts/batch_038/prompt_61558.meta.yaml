  wage labor," plus equivocation on what "the scheme values" — market price vs. social
  value.

  - (6): a slide from "unjust" to "the state may/should condition or abolish" — from
  a normative judgment about distributions to a claim about state enforcement against
  individuals. The reciprocity principle might ground a duty of the state to structure
  institutions rather than a duty of individuals enforced by sanctions.

  - (7): a false dilemma.


