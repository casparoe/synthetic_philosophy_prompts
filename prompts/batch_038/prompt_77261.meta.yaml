  for two years about a county board trying to decide whether to tear up a set of
  rules nobody in the town can explain anymore — specifically a 19th century ordinance
  that every house in the old district has to be brick, no exceptions, and the argument
  has been going so long that the people having it have forgotten what started it.
  To research it I read a lot of Burke and his modern admirers, and my friend R.,
  who teaches political theory and is a genuine Burkean, has taken to stopping me
  mid-sentence with Chesterton''s fence: there''s a fence across the road, the reformer
  says it''s useless, and the reply is that until you can say what it was put there
  for you don''t get to remove it. He uses it to license a fairly strong conclusion,
  that the burden of proof always and automatically sits on the person who wants to
  change something, and that this is the default position of rationality rather than
  a conservative tic.


  Here''s my problem, and I want you to think carefully about it rather than give
  me the standard both-sides summary. I''ve started keeping a private list of fence-types
  because I suspect one image is doing at least three different jobs, and I''ve come
  up with two of my own that I don''t think the image covers. First, what I''ve been
  calling sediment: practices nobody ever built, that accreted out of accidents and
  lock-in — the paragraph indent, the shape of the QWERTY keyboard, why a chapter
  is the length it is, arguably the brick ordinance itself if it started as one builder''s
  cheap choice that everyone copied. With sediment there is no builder''s reason to
  recover, only a history, so "go away and think until you can see the use of it"
  has no object. Second, what I''ve been calling the second fence: the original reason
  expired eighty years ago but the practice is now held in place by a current party
  who benefits from it, and when the reformer objects, the defender answers by pointing
  at the present function, which is not the reason it exists. Do those carve at joints,
  or can the fence image absorb both by adding epicycles?


