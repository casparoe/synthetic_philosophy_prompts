  could be making in a case like mine. I expect at least: a claim about qualitative
  similarity...; a claim about strict numerical identity...; a claim about psychological
  continuity or connectedness...; a claim about personhood as an accountability-bearing
  status...; a claim about temporal parts...; and something merely biological about
  cellular turnover... Please add any readings I''ve missed, and for each say whether
  it is a platitude, a substantive and defensible thesis, or straightforwardly false,
  and — where it is substantive — what has to be true for it to hold.


