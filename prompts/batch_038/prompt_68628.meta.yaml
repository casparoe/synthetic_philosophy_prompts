  own chapters in the first person, and the reader is meant to feel the seam, to be
  made slightly uneasy about whether "I" and "he" are picking out one thing. My spouse,
  who did a philosophy degree and has never let it go, read the manuscript and objected
  to the seam, or rather to the moral architecture it supports: the old man is held
  to account — by a daughter, by a court, by himself — for an act committed by someone
  who, my spouse insists, "isn''t the same person anymore." My spouse then said that
  my book depends on a sentimentality it hasn''t earned: it wants the comfort of survival
  (one continuous life, one guilty self) and the drama of transformation (a stranger
  who must learn what he did), and it cannot have both.


