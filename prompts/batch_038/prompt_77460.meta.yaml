  Common student errors about Nietzsche''s diet/health discourse:

  1. Conflating Nietzsche''s "health" (Große Gesundheit, great health) with bodily
  wellness/ascetic regimen — Great health in Gay Science §382 and the 1886 preface
  is not a state of fitness but a capacity to become healthy again, to appropriate
  and overcome illness; Nietzsche values illness as a stimulant/discipline ("I am
  a disciple of Dionysus"... "the sick man" passage).

  2. Treating the diet passages in Ecce Homo as self-help advice rather than as an
  exercise of the physiology of the self — Nietzsche''s point is that the body is
  where the great questions are, "the great reason" (Zarathustra "On the Despisers
  of the Body"), and that the philosopher''s task begins with the little things: food,
  place, climate, recreation.

  3. Attributing vegetarianism to Nietzsche, or attributing a eugenic "breeding" program
  of diet.

  4. Misattributing Feuerbach''s "man is what he eats" to Nietzsche, or attributing
  Nietzsche''s ideas to the Lebensreform movement.

  5. Conflating the ascetic ideal critique (Genealogy III) with a critique of any
  bodily discipline — Nietzsche says the ascetic ideal is life turning against life,
  but he also affirms self-overcoming; the subtle point: Nietzsche doesn''t reject
  discipline as such, he rejects discipline motivated by resentment/hostility to life,
  and in Genealogy III he says the ascetic priest is the tool through which suffering
  is given meaning; the "ascetic ideal" is not simply to be replaced by health advice.

  6. Confusing "will to power" with health optimization.

  7. The error of reading Ecce Homo''s health talk as autobiographical report of a
  well-managed life when it''s a self-stylized, partly ironic performance by a man
  near breakdown.

