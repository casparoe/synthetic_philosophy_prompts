  phenomenon.]


  The standard move goes like this. Someone points to a feature of the present that
  no longer has a visible justification: the layout of the keyboard, the fact that
  half the world''s electrical grids run at one frequency and half at another, the
  five permanent members of a security council drawn from the roster of great powers
  in 1945, the siting of a capital city as a compromise between two rivals that has
  since grown into something nobody would choose. The original rationale, where there
  was one, is obsolete or unrecorded; the thing persists anyway, because an enormous
  mass of complementary equipment, training, law and expectation has grown around
  it. And then the writer draws a conclusion about the past from this picture of the
  present: the arrangement must have been an accident, a coin-flip at some branching
  point, which is why we can be stuck with it.


  What bothers me is the direction of that inference. The arbitrariness being used
  as evidence of past openness is itself produced by the entrenchment. Once enough
  complements have accumulated, the original reasons are overwritten and unrecoverable
  — that is what entrenchment consists in — so the surviving arrangement is guaranteed
  to look unmotivated, whatever the branching point actually looked like. A choice
  that was genuinely well-motivated and near-forced at the time and a choice that
  was a pure fluke produce exactly the same present-day appearance, and the appearance
  is then read as evidence for the fluke. If that is right, the two halves of a path-dependence
  story are not independently supported: the evidence for the increasing-returns half
  is what manufactures the apparent evidence for the open-branching-point half, and
  the more locked in something is, the more contingent its origin looks.


  I know the neighbourhood... hindsight bias is about individuals revising their probability
  estimates after learning an outcome, and here nobody is revising anything — the
  estimate is being made for the first time, decades later, from the shape of the
  present. Survivorship bias is about sampling, and this isn''t a sampling problem;
  it survives in cases where we have every case. The narrative fallacy is about coherence
