  the modern identification strategies — because its key terms ("spirit," "ethic,"
  "asceticism," "rational") are not projectible onto measurable variables without
  contestable translation decisions.

  2. This untestability is a defect, not a feature: it is not "interpretive depth,"
  and the appeal to ideal types or to Weber''s own methodological caveats (that he
  never claimed a one-sided spiritualist reading; that "spirit" is an ideal type;
  that he used objective possibility rather than covering laws) does not rescue it
  — those moves only relocate the problem from the hypothesis to the interpretation.

  3. Consequence: the general question "can culture be a cause?" should be separated
  from the Weber case; culture-as-cause claims are testable when formulated about
  specific, local beliefs and behaviors (e.g., literacy as a mechanism), and the field''s
  success at doing that is precisely what shows the difference.


