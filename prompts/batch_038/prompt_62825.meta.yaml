  Option A: Slogan type + frequentist vs Bayesian / replication crisis. Slogan: "the
  p-value is the probability that the results were due to chance" — that''s a misinterpretation
  rather than a slogan. Better slogans: "HARKing", "if you torture the data long enough
  it will confess" (Ronald Coase, attributed — I should verify attribution or avoid).
  "Extraordinary claims require extraordinary evidence" (Sagan standard — attributed
  to Carl Sagan; also Hume-ish). "Absence of evidence is not evidence of absence."
  That''s a great slogan for the statistics domain and is genuinely ambiguous — it''s
  a proverb in medicine ("absence of evidence is not evidence of absence" is a well-known
  aphorism, used e.g. by Altman & Bland 1995 BMJ). It works for both frequentist and
  Bayesian analysis: under Bayesian updating, absence of evidence IS evidence of absence
  if the test had power; the slogan is only true if the test is uninformative (likelihood
  ratio = 1). Actually strictly, in Bayesian terms, absence of evidence is evidence
  of absence whenever the absence was more likely under the null. Hmm — the slogan
  is literally false as a Bayesian matter except for a completely uninformative test.
  That''s a rich vein: readings from trivial to false.


