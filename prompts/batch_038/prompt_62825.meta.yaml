  Let me draft the student answer:


  "Aristotle begins Book I of the Politics from the household, arguing that a city
  is a compound of households and that we can therefore understand its parts by looking
  at the relations that make up a household: master and slave, husband and wife, father
  and children. Slavery, he says, is one of these relations, and it is natural in
  the same way that rule is natural wherever one thing is by nature superior to another.


  His positive argument runs through the idea of property. A household needs instruments
  in order to carry on its work, and an instrument is a possession; a slave, Aristotle
  says, is a possession of this kind — a living one — and specifically an instrument
  that takes precedence over all other instruments, since if instruments could work
  on their own, as the statues of Daedalus or the tripods of Hephaestus were said
  to, no master would need slaves. It follows that a slave is by nature someone who
  belongs to another and is therefore a thing owned, and that this is as natural as
  the soul''s rule over the body.


  What makes such a person a slave rather than merely a subject is a deficiency in
  his rational capacity. The natural slave, on Aristotle''s account, is a human being
  who has no deliberative faculty at all, so that he can perceive reason in his master''s
  commands and obey them but cannot form plans of his own; in this respect Aristotle
