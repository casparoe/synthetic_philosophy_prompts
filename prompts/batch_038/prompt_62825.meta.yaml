  Draft answer:


  "Aristotle begins the Politics from the household. A city is a compound of households,
  and households are themselves compounds of the two primitive associations he identifies
  at the outset: the union of male and female, without which the species cannot continue,
  and the union of natural ruler and natural subject, without which neither can be
  preserved. Slavery belongs to the second of these, and the first task of Book I
  is to show that it is not a mere convention.


  The argument for that conclusion runs through property. A household requires instruments
  in order to carry on its work, and property is the sum of these instruments; a slave
  is therefore a possession, and specifically a living one, since he ministers to
  action rather than to production. Aristotle pushes the point further by calling
  the slave an instrument that takes precedence of all other instruments, on the grounds
  that if each tool could perform its own function at a word — as the statues of Daedalus
  were said to do, or the tripods that Hephaestus sent of their own accord into the
  assembly of the gods — no master would have need of servants. From this he concludes
  that the slave is by nature not his own but another''s man, a possession separable
  from its owner, and that his condition is as natural as the despotism of soul over
  body.


  What identifies a given person as a natural slave is a deficiency in the rational
  part of the soul. Such a man, Aristotle says, has no deliberative capacity; he has
  in fact no share in reason at all, and is directed wholly by appetite and perception,
  in the same way as a tame animal is directed by its master. He can be trained by
  habit to carry out orders, but he cannot deliberate about how his own life is to
  go. Because virtue belongs to the rational soul, Aristotle accordingly does not
  credit him with any virtue, and speaks of the good slave only as one speaks of a
  good ox or a good shuttle. Nature also intends to give the two kinds of man different
  bodies — the slave''s robust for necessary labour, the free man''s upright and useless
  for such work but fitted for political life — though Aristotle concedes that nature
  frequently fails in this intention and produces free souls in slavish bodies and
  slavish souls in free ones.


  Since the relation is natural, Aristotle holds that it is to the advantage of both
  parties, and just: the master obtains the labour without which he could have no
  leisure for politics, and the slave obtains direction he could not supply for himself.


  On the second part of the question, Aristotle is rather less radical than his reputation
  suggests, but not in the direction one might expect. He considers the view current
  in the law courts that a man taken prisoner in war becomes the property of his captor
  by a kind of legal compact, and he notes the objection that this makes justice depend
  on superior force. He answers the objection rather than accepting it: victory, he
  says, presupposes a superiority of ability, and where ability is superior there
  is a title to rule. What follows is that enslavement in war is just when the war
  itself is just and the conquered are of a slavish nature — which, for Aristotle,
  means non-Greeks, among whom he finds no natural ruling class and whose women and
  slaves he says occupy the same position. The practice of the Greek cities is therefore
  not condemned by his theory but endorsed by it, subject only to the qualification
