  Domain choice for grading: Aristotle''s natural slavery is great because the subtle
  errors are well-documented in the scholarship and a decent model knows Politics
  Book I reasonably. Let me design:


  Exam question (instructor''s own): "Aristotle argues in Politics I that some human
  beings are slaves by nature. Explain the argument, and say whether Aristotle thinks
  it justifies the slavery actually practised in Greek cities."


  Student answer: gets visible things right — slavery is defended by appeal to the
  natural hierarchy of ruler and ruled, the soul/body analogy (the natural slave is
  ruled by the body? no — Aristotle says the natural master rules the slave as soul
  rules body... careful). Let me get the details right:


  Politics I.4-7:

  - Property is a collection of instruments; the slave is a sort of "living possession"/"animate
  instrument" (ktema ti empsychon; organon pro organon — "an instrument prior to other
  instruments"). If each instrument could do its work at a command, like the statues
  of Daedalus or the tripods of Hephaestus, there''d be no need for slaves.

  - The natural slave: "one who is by nature not his own but another''s, though he
  is a man" — he is another''s man and so a possession.

  - Capacity: "the natural slave can apprehend reason in another but has none of his
  own" — participates in reason (logos) to the extent of perceiving/apprehending it
  (aisthetikos) but not possessing it (hexis). Note: he is not utterly bereft of reason;
  he has no deliberative faculty (to bouleutikon ouk echei) — Politics I.13, comparing
  slave, woman, child: "the slave has no deliberative capacity at all; the woman has
  it but it lacks authority; the child has it but it is incomplete."

  - Body: nature tends to give different bodies to free men and slaves — the latter
  strong for necessary service, the former upright and useless for such work but useful
  for political life. But this isn''t universal: "it is not difficult to see that
  some have the bodies of free men, others the souls" (I.5, 1254b).

  - I.6: The argument that slavery is just because it results from law/convention
  (nomos) and from force in war — Aristotle examines and partly rejects: he argues
  that the view "might makes right" is flawed, and that Greeks enslaving Greeks (war
  captives) is not justified; but he also says that non-Greeks/barbarians are more
  slavish by nature. He concedes that the actual practice — enslaving war captives
  regardless of merit — is contested: those who say slavery by convention is just
  because of the legal enactment are answered by the argument that injustice consists
  in using force, and that the well-born should not be enslaved. So Aristotle does
  not endorse the existing institution wholesale; he says that if natural slaves exist,
  ruling them is beneficial and just for both, and he distinguishes the master''s
  rule over the slave from political rule (despotic rule vs. political/kingship rule
  — I.7: the master''s knowledge is the knowledge of how to command slaves; and rule
  over slaves is not the same as political rule, which is rule over free and equal
  persons, in turn and from a similar starting point).

  - I.3: some criticize: is the master''s science the same as the slave''s? The "science
  of the master" is not great; it''s knowing how to command.

  - Also relevant: Aristotle says the virtue of the slave is limited — slaves have
  virtue insofar as they perform their function (I.13: "the slave too evidently has
  some virtue, of body..."), and both master and slave ought to have virtue but different
  kinds.


  Classic subtle mistakes students make:

  1. Claiming Aristotle justifies slavery by asserting that slaves are racially/ethnically
  inferior in a modern sense — he does say barbarians are more slavish, but his criterion
  is deliberative capacity, not skin or lineage.

  2. Claiming Aristotle thinks the natural slave is devoid of reason entirely / is
  subhuman — no: he apprehends reason in others; Aristotle explicitly denies the slave
  is like a tame animal or a tool without any perception. Actually he does compare
  slaves to tame animals and to instruments; but he insists the slave participates
  in logos to the extent of apprehending it. So "beast-like, without any share in
  reason" is a subtle overstatement.

  3. Claiming Aristotle endorses existing Athenian practice wholesale / that he thinks
  war captives may justly be enslaved — actually he criticizes the view that the enslavement
  of the well-born by force is just (I.6), and he is uneasy about enslaving Greeks.

  4. Claiming Aristotle grounds natural slavery in convention/law (nomos) — he grounds
  it in nature (physis) and opposes it to the nomos-based view.

  5. Misattributing: the "instrument/possession" argument as showing slaves are property
  because masters own them (circular) — no, it''s a functional argument about household
  management.

  6. Conflating despotic rule with political rule.

  7. Conflating Aristotle with Plato: e.g., attributing to Aristotle the Republic''s
  claim about the guardian class, or the view that slavery will disappear — or attributing
  to Aristotle the thesis that all citizens should be equal in the Republic. Hmm.

  8. Conflating Aristotle''s natural slavery with his doctrine of natural teleology
  in a wrong direction.

  9. Saying that because the natural slave lacks deliberation, he cannot be responsible
  — Aristotle does think slaves are capable of virtue of a sort and of being harmed/insulted;
  also "the slave is not a friend"? That''s NE.


  Another good subtle mistake: the student says Aristotle''s argument is that slavery
  is natural because nature makes some people strong of body and unfit for politics,
  and that Aristotle acknowledges this doesn''t always hold so the argument collapses
  into admitting exceptions — but Aristotle uses the exception point differently:
  he says nature intends (boulomenē) to make distinct bodies but often fails, and
  that what matters is the soul. Hmm, the student could say "Aristotle concedes that
  some slaves have free bodies and some free men have slavish souls, which undermines
