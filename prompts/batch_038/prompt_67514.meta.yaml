  ---


  I am writing comments on a colleague''s draft chapter about religious arguments
  in public political debate, and the chapter''s central device is a metaphor I want
  audited. My colleague holds roughly the Rawlsian line: citizens may bring their
  comprehensive religious convictions into political argument, provided that in due
  course reasons are offered that others could reasonably be expected to accept. To
  explain why this proviso is not a demand that religious citizens abandon their faith,
  he compares public debate to a multilingual assembly: a religious argument is like
  a contribution delivered in a language only its speaker understands. It is not out
  of order — but it becomes usable by the assembly only once translated into the common
  tongue, and until then the assembly may fairly set it aside. He draws two conclusions
  from the picture. First, nothing of substance is lost in the translation, since
  only the vehicle changes and the meaning is preserved; asking for public reasons
  is thus not asking for a different argument. Second, the burden is not one-sided,
  since the assembly''s requirement falls equally on everyone and those who already
  speak the common tongue simply have nothing to translate.


  Critics in the chapter reply with a rival image: the translation requirement is
  like demanding that recent immigrants argue their case in a language they have had
  no opportunity to learn, which converts a procedural formality into a standing disability.


  Please audit these two comparisons rather than the underlying doctrine. Set out
  the correspondence explicitly — what plays the part of the source language, the
  target language, the meaning carried across, the translator, the assembly, and the
  moment at which translation is due — and then identify where the mappings break,
  separating the breaks that threaten my colleague''s two conclusions from those that
  are merely decorative. I would like particular attention to the following. Does
  the presumption that meaning survives the transfer hold in a case where the force
  of the reason for the believer lies in its being a command rather than a claim about
  shared values? Consider concretely an argument against physician-assisted dying
  that rests on life not being ours to dispose of: when it is rendered as an appeal
  to bodily integrity or to the social meaning of medicine, does the translation preserve
  the implications, or does it license exceptions the original forbids? Is the common
  tongue genuinely common, or is the target register itself one contested dialect
  — and if so, who is assimilating whom? And does the assembly picture presuppose
  that translation is always possible, that the speaker is the one who must perform
  it, and that the audience can certify when it has been done well?


  Finally, say which of the two images carries more weight, whether either supports
  the conclusions drawn from it, and whether a different comparison — testimony, perhaps,
  or an appeal to a shared authority, or the offering of a witness rather than of
  a translation — would do the work more honestly.


