  Actually, here''s a cleaner and more distinctive design, which I like a lot:


  **The "idea ledger" game.** Each participant privately writes down a solution to
  one of several open problems on a card, folds it, and puts it in an envelope. Then
  the game proceeds in rounds where participants are given fragments (partial solutions)
  and must assemble a complete solution. Ownership rules vary across three institutional
  regimes, all applied to the same underlying tasks:

  - Regime A (commons): all fragments on the table, anyone can use any, credit goes
  to whoever submits a completed solution first.

  - Regime B (property): each participant owns their fragment and must license it;
  each license costs negotiation time.

  - Regime C (moral rights/attribution): fragments are free to use, but every use
  must carry the full chain of attribution, and the chain must be written on the submission
  — and chains grow until the paper is 90% attribution and nobody can complete anything.


  The felt lesson: the same non-rivalrous resource produces different failures under
  different ownership rules; the anticommons is not caused by greed but by rational
  holdout; attribution requirements can be as blocking as licenses. And the punchline:
  under Regime A the fastest finisher is the one who scoops, and students will discover
  they''d rather have Regime B''s security even at its cost — which is exactly the
  incentive trade-off the literature argues about.


