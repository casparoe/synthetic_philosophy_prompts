  Draft:


  ---


  I am running a 75-minute session in an upper-level undergraduate seminar titled
  "Ownership of Ideas," with 18 students — roughly half intending to apply to law
  school, half philosophy majors. They have read the standard incentive-based justification
  for intellectual property, Locke on mixing one''s labor, and one article arguing
  that too many property rights in a single resource can make it useless. I do not
  want to lecture on any of it.


  Design an in-class game that gets them to feel the difference between two failures
  of ownership regimes applied to the same resource: the well-known one, where a rivalrous
  good gets overused because nobody owns it, and the less intuitive one, where a non-rivalrous
  good gets underused because too many people each hold a legitimate veto over a piece
  of it. The second is what I want them to hit. My worry is that they arrive already
  believing that patents cause gridlock, so the gridlock will feel like confirmation
  rather than discovery; the game has to make the veto-holding individually rational
  and even sympathetic, so that the deadlock is nobody''s fault.


  Structure the game around three rounds that use the same set of tasks and the same
  paper components, but different institutional rules:


  Round one: components lie in a shared pool, anyone may use any, and the reward goes
  to whoever completes a task first.

  Round two: each student owns the components they were dealt and must license them
  from one another to complete anything.

  Round three: components are free to take, but every completed submission must display
  the full chain of attribution for every component in it, including components built
  on components. I expect this round to look absurd; I want it designed so that it
  doesn''t, since it is the closest of the three to how academic credit actually behaves.


  Give me: the component deck and what is on it; the tasks and how many steps each
  requires; a payoff scheme that uses no money and converts cleanly into something
  the students will care about for the 75 minutes; the facilitator''s role, including
  how much adjudication I should expect to do at once; a minute-by-minute timeline;
  the exact wording of any rule I need to read aloud so that the students cannot litigate
  it later; and the debrief, which should map specific moments from the three rounds
  onto the concepts and should not name the second failure until the students have
  described it themselves.


  Also: what will predictably go wrong the first time I run it, including the student
  who refuses to license on principle and the pair who collude to lock everyone else
  out, and how to handle each without breaking the round. A variant I can compress
  into 20 minutes if the first half of the session overruns. And a frank statement
  of which feature of the second failure a single class period cannot reproduce —
  I suspect it is duration, since real thickets persist for years and people invest
  around them — plus which real disputes about intellectual property the three rounds
  correspond to and where the correspondence breaks down.


