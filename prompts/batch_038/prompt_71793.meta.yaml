  "Last night a friend and I argued for three hours about whether ''avoid side effects''
  can be given a precise meaning without a full specification of value, and I have
  not been able to dislodge his argument. I would like a careful diagnosis.


  The setting, as neutrally as I can state it. An agent acts in an environment with
  a set of states S and a transition relation →. A baseline state b is the state that
  would obtain if the agent did not intervene (or was switched off). An impact measure
  is a function I(b, s) ≥ 0 intended to say how much side effect the agent causes
  by moving from b to s; it enters the agent''s objective as a penalty, so the agent
  maximizes its task reward minus λ·I. The philosophical hope is that I can be read
  off the structure of the environment — for instance, by comparing which states remain
  reachable from s with which were reachable from b — without any appeal to a utility
  function over states, so that the agent can be penalized for disruption without
  our having to tell it what is worth preserving.


  My friend''s argument that this hope is incoherent:


  (1) Value neutrality requires that I depend only on non-evaluative facts about the
  environment: the states, the transition relation, and the baseline. If I depended
  on anything else, it would encode someone''s view about what matters.

  (2) If I(b, s) ≠ I(b, t), then I is sensitive to some feature F that distinguishes
  s from t.

