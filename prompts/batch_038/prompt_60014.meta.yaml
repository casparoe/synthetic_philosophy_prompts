  1. Harsanyi''s Aggregation Theorem: If individual preferences and social preference
  are all vNM over a common set of lotteries (probability distributions over a finite
  set of prospects), and Pareto indifference holds (everyone indifferent between lotteries
  p and q → society indifferent), then social vNM utility U is an affine combination
  of individual vNM utilities: U = Σ λ_i u_i + c, with λ_i ≥ 0 if weak Pareto holds
  (nonnegative weights). Note: without additional conditions, some λ_i could be negative
  (with just Pareto indifference). With weak Pareto (or strong Pareto), λ_i > 0 (or
  ≥ 0).


  2. Key point: the theorem does not by itself establish equal weights, nor does it
  establish that u_i is "the good for person i" in the right sense. Harsanyi''s Impartial
  Observer Theorem is meant to get equal weights: a sympathetic observer behind a
  veil of ignorance, equally likely to be anyone, with the same beliefs as... etc.
  Then social good = average of individual utilities.


  3. Sen''s critique: vNM utilities are not the right measure of well-being (they''re
  preference-satisfaction under risk, not achievement); and the theorem doesn''t establish
  interpersonal comparability in the sense needed. Also Sen: "the utilitarian relevance
  of the aggregation theorem" — Sen argues that the theorem requires acceptance of
  the "utility of the observer" being welfarist etc.


  4. Weymark''s critique: the theorem''s assumptions include that social preferences
  satisfy the expected utility hypothesis over the same lottery space; if you only
  require the social ordering to be defined on the "certain" prospects (outcomes),
  then you don''t get linearity; you get an Arrow-type result. So Harsanyi''s theorem
  presupposes what it needs. Weymark: the domain assumption is doing the heavy lifting;
  the theorem tells you that if you already accept consequentialism + ex ante Pareto
  + vNM for society, then you get linear aggregation. Also: with only ex post Pareto
  (unanimity on certain prospects), you can''t get the result; you need Pareto over
  lotteries, which is ex ante Pareto, which is controversial.


  5. Mongin: "spurious unanimity" / "factitious unanimity": with different beliefs,
  unanimity of preference can arise from opposing beliefs rather than from agreement
  about value; requiring Pareto only over prospects where beliefs coincide is nearly
  vacuous, and the "consensus" cases that drive aggregation theorems may be rare.


  6. Broome''s point (Weighing Goods, ch. on the veil of ignorance / impartial spectator):
  the impartial observer''s own attitude to risk matters. If the observer is risk
  averse, the aggregation isn''t linear in individual utilities but concave — giving
  prioritarianism. Also: there''s a distinction between the observer''s risk attitude
  being applied to "which person she''ll be" (a "personal" risk) vs. to states of
  the world. Also the "identity" assumption: the observer takes on the person''s preferences
  and beliefs when she imagines being that person; if she keeps her own beliefs, then
  her risk attitude over the mixture generates something different.


  7. Ex ante / ex post Pareto conflict: you cannot in general satisfy both ex ante
  Pareto and ex post Pareto (Hammond, Mongin). Known impossibility results.


