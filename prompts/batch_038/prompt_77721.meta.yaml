  Urmson''s complaint is that the threefold scheme leaves out a big part of moral
  life, because some acts are neither obligatory nor merely permitted. The soldier
  who throws himself on the grenade does something supremely good, but we don''t say
  he was obliged to do it, and we don''t say the soldier who dives for cover instead
  did anything wrong. So a supererogatory act is one that is (i) permissible to omit,
  (ii) good to perform, and (iii) praiseworthy in a way that goes beyond what morality
  asks. Some definitions add (iv) that it costs the agent something substantial, which
  is why the label fits saints and heroes rather than small unrequired kindnesses.


  This generates a puzzle. If an act is the best thing you can do, and morality asks
  us to do what is best, then it is required, and there is nothing left over to be
  supererogatory. If instead it is not required, morality seems to license doing worse
  than you could have done, which is strange for a theory that takes reasons seriously.
  Singer makes the pressure concrete with the drowning child: if you ought to wade
  in and ruin your clothes to save a child in a shallow pond, then giving the equivalent
  to famine relief is obligatory as well, not saintly. Act-consequentialism therefore
  looks committed to there being no supererogation at all — everything short of the
  optimum is simply wrong.


  But the consequentialist has a reply. They can separate an act''s being required
  from its omission''s being blameworthy. On a two-level view like Hare''s, the intuitive
  level is where the real moral facts are and the critical level is where we work
  out which principles to teach people, so the consequentialist can say the saint''s
  act is required at the critical level while the rest of us are quite properly not
  blamed at the intuitive level for falling short of it. That is all supererogation
  was ever meant to pick out anyway, since Urmson''s worry was really about praise
  and blame rather than about adding a fourth deontic box. On this reading the puzzle
  just dissolves.


  Whether it does is another matter. Wolf''s moral saints paper argues that the saint
  is not an ideal we should be aiming at, because a life organized entirely around
  morality crowds out the non-moral goods that make a life worth living; if morality
  itself tells us not to be saints, then the saint''s acts are exactly the ones morality
  recommends but doesn''t require, and the consequentialist can welcome them. Even
  so, this concedes too much. If blamelessness is all that supererogation amounts
  to, then any act the consequentialist prefers not to sanction counts as supererogatory,
  and the category stops doing any work. What the consequentialist has shown is not
  that there is supererogation but only that we shouldn''t blame anyone for there
  not being any.


