  Now write the student answer, ~350-450 words, mixed quality. Let me write it:


  "Urmson''s point in ''Saints and Heroes'' is that the traditional scheme — acts
  are either obligatory, forbidden, or permitted — leaves out an important part of
  moral life, because some acts are neither obligatory nor merely permitted. A soldier
  who falls on a grenade to save his comrades does something that is morally good,
  indeed supremely good, but we don''t say he was obliged to; if he had dived away
  we wouldn''t say he did anything wrong. So a supererogatory act is one that is (i)
  morally permissible to omit, (ii) morally good to perform, and (iii) praiseworthy
  in a way that going beyond what morality requires. Most accounts also add (iv) that
  it involves significant cost or sacrifice to the agent, which is what separates
  the saint from someone who does a small unrequired kindness.


  This generates a paradox. If an act is the best thing you can do, and morality asks
  you to do what''s best, then it''s required, and there''s nothing left over to be
  supererogatory. If it''s not required, then morality seems to let you do worse than
  you could have, which is odd for a view that takes reasons seriously. Singer makes
  this vivid with the drowning child: if you ought to wade in and ruin your clothes
  to save a child, then giving to famine relief is obligatory too, not saintly. So
  act-consequentialism looks committed to there being no supererogation at all: everything
  less than the optimum is wrong.


  The consequentialist has a response. They can distinguish between an act''s being
  required and its omission''s being blameworthy. On a two-level view like Hare''s,
  the intuitive level is where the actual moral facts live and the critical level
  is where we work out what to teach people, and consequentialists can say the saint''s
  act is required at the critical level while the rest of us are not to be blamed
  at the intuitive level for failing to do it. That''s all ''supererogatory'' was
  ever meant to capture anyway, since Urmson''s worry was really about blame and praise,
  not about a new deontic category. So the paradox dissolves.


  Whether this works is less clear. Wolf''s moral saints paper shows that the saint
  is not an ideal we should aim at, since a life devoted entirely to morality crowds
  out other goods; if morality itself tells us not to be saints, then supererogatory
  acts are the ones morality recommends but doesn''t require, and the consequentialist
  can accept them. But this concedes too much: if blamelessness is all that''s needed,
  then any act the consequentialist doesn''t want to sanction becomes supererogatory,
  which makes the category do no work. The consequentialist hasn''t shown there is
  supererogation, only that we shouldn''t blame people for there not being any."


