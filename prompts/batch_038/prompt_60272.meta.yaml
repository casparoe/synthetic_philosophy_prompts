  \ — and the disanalogy: in the Turing case, the diagonal procedure D is a perfectly\
  \ well-defined algorithm that simply isn't *sound* (it gives wrong/no answer for\
  \ D itself — it diverges), so the diagonal argument shows no *sound* algorithm can\
