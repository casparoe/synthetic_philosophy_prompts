  which matters for MAD (anomaly detection) since you want to say "this mechanism
  is absent/broken in the tampered model" versus "it''s just relocated/reorganized."


  Verdict cases to include (concrete, plausible):


  1. A circuit in model A does its job in model B through completely different neurons,
  but the same computation/algorithm at the level of the residual stream — same inputs,
  same functional role, same output behavior on held-out cases. Verdict: same mechanism.


  2. Same-looking weights (a subnetwork that''s structurally near-identical, high
  activation overlap), but in model B it fires on a slightly different set of inputs
  and produces a different downstream behavior. Verdict: not the same mechanism —
  hmm, or maybe "same mechanism, different job"? Interesting tension.


  3. A mechanism that was in layer 12 of A is in layer 20 of B because B is deeper.
  Verdict: same mechanism (obviously, location doesn''t matter).


  4. A mechanism split across two heads in B that jointly do what one head did in
  A. Verdict: hmm — asker says same mechanism. But then case 5: a mechanism replaced
  by two mechanisms that each do half the job and are separately trained and can be
  independently knocked out with partial effects. Asker says NOT the same. But (4)
  and (5) look almost identical — that''s the hard pair to reconcile. Nice.


  Actually let''s make the hard pair crisper:

  - (4) In model A a single attention head implements induction; in model B two heads
  each implement a partial step and neither works alone, but knocking out either kills
  the behavior entirely. Verdict: same mechanism (just distributed).

  - (5) In model A one head does X; in model B two heads each independently do X (redundant,
  knock out one and the other takes over). Verdict: NOT the same mechanism — or is
  it two copies? Hmm. Actually a person might say: redundant copies = the mechanism
