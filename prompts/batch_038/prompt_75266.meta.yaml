  that their lives will contain suffering. That''s a nice, coherent, non-obvious implication
  set. And it does have a real tension: the asymmetry is usually framed for persons;
  whether it applies to non-person animals requires the "deprivation" account — for
  a non-person animal, is the absence of pleasure bad when there''s no subject to
  be deprived? Benatar says the absence of pleasure is bad only if there is someone
  for whom this absence is a deprivation. So for species that never exist, no deprivation.
