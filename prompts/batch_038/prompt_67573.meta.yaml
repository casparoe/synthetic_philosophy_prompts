  Let me draft the commitments carefully so each is a real, recognizable position:


  (1) The novel is in close third person on a company sergeant for three hundred pages,
  and I hold that this is where its cognitive value lies: a reader who has inhabited
  the man''s perceptions understands something about how the killing happened that
  no monograph could convey, and I would defend that claim against anyone who says
  fiction is merely illustrative.


  (2) I am a situationist. The experimental literature — obedience studies, the prison
  study, and the replication failures that followed — has persuaded me that stable
  character traits do far less explanatory work than ordinary talk assumes; what varies
  is the situation, not the soul.


  (3) My compositional method is nevertheless resolutely characterological. Every
  scene is generated by asking what this man, being the man he is, would do; my revisions
  are revisions of temperament, and I describe my own drafts in the idiom of the timid
  man, the vain man, the man of scruple.


