  objection.

  - Cluster/historical theory vs. anti-essentialism (Weitz''s "open concept" — art
  cannot be defined). A novelist who says "art cannot be defined, it''s an open concept"
  but also says "these are necessary conditions" — genuine tension.

  - Aesthetic definition (art must afford aesthetic experience) vs. holding that conceptual
  art (Duchamp''s Fountain) is genuinely art while also holding that Fountain affords
  no aesthetic experience. Genuine tension.

  - Also: the novelist holds that moral defects can be aesthetic defects in a novel
  (the "ethicism"-ish view, e.g., a novel that invites admiration for cruelty fails
  aesthetically because the invitation is unmerited) while also holding autonomism
  (moral and aesthetic evaluation are entirely separate). That''s a genuine, non-obvious
  tension that is standardly held by people who don''t notice. And it''s rich for
  a novelist: they might say "a novel can be morally repugnant and still be great"
  (autonomism) while also saying "when my book sentimentalizes a villain, that''s
  a flaw in the book as a book — the prose goes slack, the structure fails" (which
  is moral defect registering as aesthetic defect = interactionism/ethicism). Good
  tension.

