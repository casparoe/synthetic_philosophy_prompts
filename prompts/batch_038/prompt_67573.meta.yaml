  makes something art from the intention that fixes meaning (Dickie/Beardsley vs.
  actual intentionalism). Hmm, but a subtle tension: if arthood is conferred by the
  intention to afford aesthetic experience, and yet the author''s intentions are irrelevant
  to what the work means, then the "art" status is fixed at a moment (the making)
  that has no bearing on the work''s properties thereafter — that''s a real tension
  worth probing but there''s a decent dissolution available (the intention is historical/genetic,
  the meaning is a property of the artifact in a practice).


  Better tension candidates for definition of art:

  - Institutional theory (artworld confers status) vs. the novelist''s belief that
  artworld rejection cannot make something not-art (that the unknown genius in a drawer
