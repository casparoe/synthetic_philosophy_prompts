  Structure (formal, British English, ~450-550 words):


  Paragraph 1: Describe the practice concretely. The Nobel Prize in Physics is awarded
  to theorists only once an experimental confirmation has arrived, and the citation
  credits the prediction. Examples: Englert and Higgs 2013 (a year after ATLAS and
  CMS announced the new boson); Penrose 2020 for black-hole formation being a robust
  prediction of general relativity, 55 years after the 1965 result; Einstein 1921
  for the photoelectric law with relativity left aside.


  Paragraph 2: The question — what view of predictive success does this presuppose?
  Ask them to reconstruct the implicit epistemology: does the practice treat novel
  predictive success as evidence of (approximate) truth, as evidence of reliability
  only, or as something else? Does it privilege novel prediction over accommodation,
  or does it not?


  Paragraph 3: The puzzle/inconsistency the asker notices: BCS 1972 rewarded a theory
  that explained a phenomenon known since 1911 (accommodation, not prediction), and
  Penzias and Wilson 1978 were rewarded for stumbling onto a prediction that others
  (Alpher, Herman, Gamow) had made and that they hadn''t known about. So if the practice''s
  official currency is confirmed prediction, why is the credit distributed this way
  — the person who predicted but wasn''t awarded (Alpher and Herman never won; Gamow
  never won), and the people who detected without predicting did. What does that presuppose
  about where credit sits? (Good — this is a genuine tension and a real puzzle. Note:
  I should be careful about Alpher/Herman/Gamow — they predicted ~5 K CMB in the late
  1940s and were never awarded the Nobel; that''s widely known and true. I''ll phrase
  it as: the physicists who had predicted the radiation in the 1940s received no prize.)


  Hmm, is that right? Alpher, Herman, and Gamow predicted the CMB temperature; Penzias
  and Wilson got the 1978 prize. Yes, and it''s often remarked that Alpher/Herman
  were overlooked. Safe.


  Paragraph 4: Bring in the PMI. The asker has read that the history of science contains
  theories that made novel, confirmed predictions and were later abandoned — Fresnel''s
  wave theory with its ether (predicting the bright spot at the centre of a shadow),
  caloric, phlogiston. Ask: does the prize practice''s rationale survive that argument?
  If the Academy took the PMI seriously, would it still credit predictions? Would
  it need to credit the part of a theory that survives rather than the whole (structural
  realism)? And what would the practice look like under a fully instrumentalist view
  — would the prize go to whoever best fitted and forecast the data, with no pretence
  about truth?


  Paragraph 5: Deliverable specification. Ask for: (a) a reconstruction of the implicit
  epistemology, distinguishing what the practice strictly presupposes from what merely
  fits it well; (b) an explicit statement of where the practice is underdetermined
  — several rival accounts (no-miracles realism, selective/structural realism, instrumentalism,
  a purely honour-based account on which the prize certifies achievement rather than
  truth) licensing the same rules; (c) an answer to whether the practice''s own history
  (accommodation prizes, accidental-detection prizes, unawarded predictors) undercuts
  the tidy reading, rather than papering over awkward cases; (d) what would have to
  change in the practice — citation language, timing, who gets credited — if the Academy
  adopted the pessimistic meta-induction, and whether any change is possible given
  the prize''s rules (max three laureates, no posthumous awards, confirmation-by-experiment
  norm).


  Also maybe ask: is there a difference between the prize''s stated criterion (greatest
  benefit to humankind) and the epistemic criterion the practice actually enforces,
  and what does that gap presuppose — that benefit is measured by confirmed prediction?


