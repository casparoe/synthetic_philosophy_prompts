  ---


  I am in the third year of a philosophy PhD, working at the intersection of philosophy
  of biology and philosophy of mind. My dissertation defends what I have come to call
  the single-inversion thesis. It has three commitments.


  First, that the inversion Dennett attributed to Darwin — the idea that design and
  order can be produced by processes that themselves embody no foresight or understanding,
  so that competence does not presuppose comprehension — and the parallel inversion
  he attributed to Turing, whereby a machine can carry out rule-governed operations
  it in no way grasps, are not two analogies that happen to rhyme. They are one and
  the same principle, discovered twice: comprehension is never a causally operative
  ingredient in the production of competent performance, but at most a high-level
  description of a pattern such performance happens to instantiate.


  Second, that this principle is symmetric in its application. It does not license
  a new line between systems that merely seem to understand and systems that really
  do; it dissolves the older line, since human understanding is itself a post hoc
  interpretive gloss laid over competences produced by processes that understand nothing.
  Talk of comprehension, on my view, is best read as a stance-relative attribution
  rather than a claim about a grade of mechanism, and there is accordingly no fact
  of the matter about where comprehension begins.


  Third, that arguments of the Chinese Room family are therefore not false so much
  as malformed: they require a determinate cut-off between genuine and simulated understanding
  in order to generate their intuition, and the inversion thesis denies that any such
  cut-off is available.


  What I want is a map of this view''s exposure, not a general survey of the literature
  on machine understanding or on Darwinian explanation. Specifically:


  1. Identify what would count against the single-inversion thesis. Rank the defeaters,
  and say for each whether a defender should treat it as fatal, seriously damaging,
  or merely awkward — and why it belongs in that category rather than a neighbouring
  one.

  2. For the most serious ones, say what shape the evidence or argument would have
  to take: a result in comparative cognition, an interpretability finding about trained
  networks, a formal result about what simulation does and does not preserve, a development
  in the metaphysics of grounding or realization. I want to know what I should be
  watching for, not just that a rival position exists.

  3. Tell me which of these a committed defender would concede as counting against
  the view and which she would dismiss, and be explicit where you think the dismissal
  is too cheap. In particular, I suspect that the asymmetry between the two inversions
  is my weakest point: the Darwinian inversion concerns the process that produces
  a design, and leaves entirely open that the resulting organism harbours genuine
  internal models, whereas the Turing inversion is supposed to concern the operations
  of the system itself. If that is right, my inference from one to the other may trade
  on an equivocation between the level at which design happens and the level at which
  performance happens. Assess that worry: is it decisive, or can the single-inversion
  thesis be reformulated to survive it?

