  question that both sides gesture at but nobody treats as decisive.

  - A question about the persistence conditions of the state: is post-1945 Germany
  the same agent as 1938 Germany? Is the successor-state question legal-formal or
  metaphysical?

  - Disagreement about the direction of fit between the emotion and the acknowledgment:
