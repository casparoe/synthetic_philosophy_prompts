  reparations.

  2. Apology proponents: the state is a continuing corporate agent, distinct from
  its citizens; the state committed the wrong and the state persists, so the state
  can apologize and owe repair; citizens may bear "responsibility without fault" —
  e.g., benefits received from injustice, or membership in a persisting collective
  (the idea that citizens inherit obligations like national debt). Also the distinction
  between guilt and responsibility (feeling sorry vs. being liable), and between apology
  as expression of remorse and apology as acknowledgment.


