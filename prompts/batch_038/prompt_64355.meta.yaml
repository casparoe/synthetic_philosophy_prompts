  ---


  In six weeks I give a 40-minute paper at a workshop on medieval philosophy of religion,
  followed by an open session with a mixed room. My thesis is that Maimonides'' treatment
  of the sacrificial cult is not a piece of historical apologetics but a general theory
  of legislation under transition constraints, and that the theory, taken on its own
  terms, is self-undermining in an interesting way.


  The argument has four steps, which I want the objections to target:


  (1) In Guide III:32 Maimonides argues that human beings cannot leap from one extreme
  of practice to another, and that the wilderness generation''s whole idiom of worship
  was animal sacrifice at a temple with an altar, bowing and incense. God therefore
  did not abolish that idiom but transferred it wholesale to Himself, so that the
  motivational channel people already had for expressing costly devotion was preserved
  while its object was changed. I read this as optimization over a feasible set —
  the lawgiver is not choosing the ideal cult but the best cult a given people can
  actually internalize — and I borrow the language of second-best theory and of non-ideal
  theory in political philosophy to make that precise.


  (2) Maimonides supplements this with an ethnographic argument: large parts of the
  commandment corpus, and the sacrificial details in particular, are anti-Sabian polemic
  — prohibitions shaped by what the surrounding idolatrous religions did. The concession
  is therefore indexed to a specific historical condition.


  (3) Because the reason for the concession is the idolatrous environment, the concession
  is self-extinguishing: once that environment is gone, the reason is gone, and re-instituting
  the cult would not be preserving a law whose rationale lapsed but enacting a law
  with no rationale at all.


  (4) That puts Maimonides'' legal code in tension with his own account of the reasons
  for the commandments, since in Hilkhot Melakhim 11:1 he has the messianic king restore
  the Temple and the sacrificial order in full. I argue the tension is real and not
  resolvable by the usual appeal to esoteric writing, and I offer two options: either
  Maimonides is inconsistent, or the code passage is itself a second-order accommodation,
  written for a halakhic readership that must be given the law as the law.


