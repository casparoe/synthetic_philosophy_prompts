  as such; and adds that the point is institutional — the ranking has forced ministries
  to produce well-being statistics they otherwise would not, and Finland''s repeated
  first place has made happiness a legitimate object of budgeting. A useful fiction
  knowingly held beats no measurement at all. Also: Lindqvist''s alternative is worse
