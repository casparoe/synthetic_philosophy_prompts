  and the institute''s recommendation to keep publishing the table while adding a
  caveat paragraph is exactly the compromise that lets the headline do the work and
  the caveat do the absolution.


  That''s a rich exchange — 7 moves. Both sides have decent points; both have errors
  (Lindqvist''s unfalsifiability problem; Reiter''s "never presented as causal" is
  fine but he conflates institutional benefit with validity; Lindqvist''s claim that
  the ladder is "largely GDP re-badged" ignores the residual, which is large — e.g.,
  Finland''s residual 1.582 of 7.764, Costa Rica''s 2.236; interesting: the residual
  is a big chunk, so the ranking isn''t just GDP). Good — that''s a catchable subtle
  error and the model can note that the residual is substantial and that Costa Rica
  outranks Sweden on the 2026 table. Actually I shouldn''t over-seed. But it''s fine
  to have the disputants'' claims be checkable.


  Also something both are missing: distribution within countries (averages hide inequality
  of happiness); the choice of the nation-state as unit; whether "should a country
  try to top it" is a different question from "does it measure happiness" (they slide
  between the two — Reiter at move 4 shifts the question, Lindqvist follows); the
