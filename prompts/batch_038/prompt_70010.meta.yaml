  I retired four years ago after thirty-eight years as a plant virologist, and philosophy
  has become my occupation. I am working through the family of views loosely called
  suffering-focused ethics — negative utilitarianism proper, which holds that only
  the reduction of suffering has moral weight, and its softer descendants, which give
  suffering lexical or strongly prioritarian weight while allowing that happiness
  counts for something. I want to test one of them against a decision I followed closely
  at the time and now find philosophically strange.


  The facts, briefly, since you cannot look them up. Smallpox was certified eradicated
  in 1980, after a last naturally occurring case in Somalia in 1977. The final fatal
  case anywhere was a medical photographer in Birmingham in 1978, infected by an escape
  from a laboratory on the floor below hers; after that accident the world''s variola
  holdings were consolidated into two WHO reference laboratories, in Atlanta and in
  Koltsovo, Russia, and since 1984 only those two have been authorised to hold live
  virus. From 1986 the World Health Assembly repeatedly recommended destroying what
  remained: a date was set for the end of 1993, moved to mid-1999, then to mid-2002,
  and in 2002 the Assembly agreed instead to temporary retention for research purposes,
  with the destruction reaffirmed but undated ever since. A 2010 review by experts
  appointed by the WHO concluded that retention served no essential public health
  purpose. The retention case rests on three things: the possibility of undeclared
  or forgotten stocks — vials of viable variola from the 1950s turned up in an unused
  storage room on the NIH campus in 2014 — the fact that the genome sequence is public
  and orthopoxviruses can in principle be assembled from synthesised DNA, so that
  destruction cannot make the knowledge disappear; and the need for live virus to
  test vaccines and antivirals.


  What I want is the analysis, run in both directions. First, the mapping: under a
  suffering-focused view, who are the parties to this decision, what exactly are the
  options, and what is the quantity being compared? Note that the people who would
  suffer from an escape do not exist yet, so the comparison is impersonal; note also
  that retention buys a small annual probability of a very large amount of suffering
  against a small probability of averting one. Say what the strong view recommends,
  what the lexical or prioritarian variants recommend, and whether any of them can
  register the achievement of eradication as such — that is, whether the theory has
  the resources to distinguish a world with no suffering from a world with no sufferers,
  given that the standard objection to negative utilitarianism is precisely that it
  cannot.


  Second, and more important: what does this episode do to the theory? Is it a confirmation,
  an anomaly, or a case the theory was never built for — these views were developed
  for questions about killing, procreation and wild animal suffering, not for the
  stewardship of an eradicated pathogen by an intergovernmental body acting under
  uncertainty. Be explicit about the places where the theory falls silent and resist
  the temptation to make it speak.


  Begin with your bottom line in a single sentence, then give the reasoning; no preamble
  and no restatement of my question. End by telling me what would change your mind:
  which argument or piece of the analysis would move you to a different verdict, and
  where your reasoning is most likely to have failed.


