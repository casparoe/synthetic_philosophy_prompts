  deduction but a reductio of the idea that grasping a rule of inference could consist
  in assenting to propositions. Achilles''s mistake is the assumption that every element
  of an inference''s warrant must itself be a further premise.

  2. Therefore the correct moral is that inference is a transition one performs, not
  a further thing one believes: to grasp modus ponens is to be disposed, in suitable
  conditions, to pass from A and A→B to B. Nothing else could constitute the grasp.

  3. Consequently the Tortoise''s predicament is not epistemic. It is not missing
  evidence, and it is not irrational; it is incompetent — rule-blind in the way a
  person might be tone-deaf. Calling the Tortoise "irrational" or "logically defective"
  is, on my view, a category error of the same family as calling a fish bad at climbing.

