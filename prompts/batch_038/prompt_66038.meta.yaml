  deliberation, and the following of social or constitutive norms (the norms of a
  game, of a practice, of assertion) all involve transitions that cannot be exhaustively
  captured in further propositions. Deduction is merely the limiting case in which
  the point is most vivid, because deductive rules are so austere that no further
  premise could plausibly do the work.

