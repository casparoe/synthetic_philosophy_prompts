  Actually a nice in-the-weeds Berkeley conceptual issue: Berkeley''s claim that money''s
  value depends on its "circulation"/velocity — that money is only useful insofar
  as it circulates, and the quantity that matters is quantity-in-motion, so money
  can be substituted by paper credit and the value of money is not tied to gold/silver;
  and his anti-mercantilist point that a nation''s wealth is its productive industry,
  not its stock of specie. Also Berkeley''s argument that money is like a "pledge"
  or ticket transferring claims, and that in the absence of trade, hoarded gold is
  worthless. And his view that money''s value varies inversely with quantity but only
  when velocity is fixed — which he explicitly denies being fixed. That''s a real
  conceptual issue: explain how Berkeley''s velocity-adjusted account escapes the
  quantity theory, and how it differs from Hume''s. Hume''s "Of Money" is 1752; Querist
  1735–37. Berkeley anticipates. This is somewhat known but "in the weeds."


