  A cleaner twist: Thomson''s original argument relies on a principle that no state
  is compatible with the description because both on and off are ruled out by the
  parity of switches. Benacerraf''s reply: the description doesn''t entail the lamp
  is either on or off at t=1... Actually Benacerraf''s point: the impossibility argument
  shows the task (completing infinitely many switchings) is logically impossible,
  but even if it were completed, that wouldn''t determine the lamp''s state — so the
  "contradiction" doesn''t arise from the state being both on and off; rather, the
  state is undetermined. And also: it''s not shown to be logically impossible that
  the lamp be on at t=1 — since a logically consistent description could be extended.


