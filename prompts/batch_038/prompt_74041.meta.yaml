  arrival of new money and the full adjustment of prices in which industry is quickened
  rather than merely taxed, which is why he is not a simple neutralist. Layered on
  top is his distrust of multiplying paper credit and his darker claim about sovereign
  debt — that a state which keeps borrowing is heading toward a reckoning in which
  either the nation destroys public credit or public credit destroys the nation, and
  that the reckoning will be political before it is financial. I''ve also come across
