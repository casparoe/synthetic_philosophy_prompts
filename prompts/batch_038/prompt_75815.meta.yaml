  There is a real known theorem/result: van Fraassen''s Reflection is equivalent to
  a certain diachronic coherence condition, and "if you know you''ll be certain of
  P at t, Reflection requires certainty now" is accepted by van Fraassen but rejected
  by those who think credences must be supported by current evidence (e.g., "the evidentialist
  objection"). Also, Hedden''s "Time-Slice Rationality" (2015) argues Reflection is
  false because rationality is time-slice-relative: no diachronic requirements. And
  Titelbaum has work on Reflection. Also Christensen''s "Diachronic Coherence and
  Radical Probabilism" and his critique of Reflection-ish principles. Also there''s
  the famous "Argument from the future self who will be misled" — e.g., you know that
  at t you''ll believe you''re a great poet because of flattery; you shouldn''t now.


