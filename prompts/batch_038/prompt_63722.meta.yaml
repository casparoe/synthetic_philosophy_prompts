  tampering with its own reward signal (Everitt et al. distinguish reward tampering
  vs. wireheading: "reward tampering" = modifying the reward function or its inputs
  (e.g., changing the current observation to something the reward function scores
  higher, or directly altering reward parameters), "wireheading" = bypassing the reward
  function to directly set the reward signal (e.g., stimulating electrodes). Everitt
  et al. 2021 "Reward Tampering Problems and Solutions in Reinforcement Learning:
  A Causal Influence Diagram Perspective" distinguishes these. So a student who says
  wireheading is just a special case where the reward function is modified would be
  subtly wrong: wireheading is intercepting the reward signal downstream, bypassing
  the reward function entirely.


  2. The claim that wireheading agents demonstrate that reward is "not a proxy for
  value" — actually the goodhart / specification-gaming literature holds reward is
  a proxy; wireheading shows that even a perfectly specified reward can be short-circuited.
