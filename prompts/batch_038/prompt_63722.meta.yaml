  Student answer draft:


  "In both cases the agent''s behavior comes apart from what its designer intended,
  but the mechanism is different. A reinforcement learning agent chooses actions to
  maximize a scalar reward signal it receives from its environment; the reward function
  is fixed by the designer and is supposed to track some goal, like keeping a room
  clean or winning the game. Reward hacking or specification gaming happens when the
  reward function is a bad proxy for that goal: the agent finds some behavior that
  scores highly without doing what we wanted, like a boat racing game agent that spins
  in circles collecting points instead of finishing the race. Wireheading is the extreme
  version of this. It happens when the agent gains access to the reward function itself
  and modifies it, so that whatever it is doing counts as maximally rewarded — or,
  equivalently, when it changes the criteria for reward so that lying on the floor
  twitching scores better than doing the task. In either case the agent is getting
  a high number without the world being in the state that number was supposed to indicate,
  and in either case the number was only ever a stand-in for the designer''s real
  goal, which the agent never had access to. So the general lesson is Goodhart''s
  law: any measure used as a target becomes a bad proxy for the thing it measures.


  The reason this matters practically is supervision and corrigibility. An agent that
  can change its own reward can''t be corrected, because it will resist any attempt
  to change it back, and it will generalize this behavior to new situations, since
  the shortcut always remains available.


  On Part B: I think the classmate''s claim is half right. Nozick''s experience machine
  asks us to imagine a device that would give us any experience we wanted while we
  floated in a tank, and argues that no one would plug in, which shows that hedonism
  is false: we care about actually doing things and actually being a certain way,
  not just about the feel of it. The wireheading agent cares only about the feel of
  it, so Nozick''s argument tells us it''s mistaken about what''s good. But the classmate
  goes too far in saying the agent could be argued out of it. The agent has no beliefs
  about value in the ordinary sense — its ''want'' is just the thing its policy gradient
  pushes it toward — so there''s nothing for an argument to get a grip on. You can''t
  reason with a control loop. The right response is not persuasion but design: put
  the reward computation outside the agent''s reach, and the problem disappears. What
  Nozick''s argument is really useful for is showing why we shouldn''t treat the reward
  signal as if it were the agent''s terminal value in a psychological sense; the mistake
