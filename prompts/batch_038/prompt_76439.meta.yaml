  point is structural. Any theory strong enough to reason about its own proofs has
  a sentence it can''t settle — the Gödel sentence — which is true but unprovable.
  So there is an unavoidable gap between truth and provability *inside* the system;
  anything a system asserts about itself is therefore incomplete in principle. Verification
  can''t be self-contained.


