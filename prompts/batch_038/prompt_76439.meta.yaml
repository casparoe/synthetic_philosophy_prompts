  T; if T is at all expressive (contains arithmetic, recursively axiomatized, consistent),
  Gödel''s second theorem says T cannot prove Con(T). So no system can fully vouch
  for itself: there will always be a residual, unprovable-in-house assumption. Conclusion:
  assurance must be external and hierarchical — trust must bottom out in something
  not captured by the system being assured.


  (2) S: Con(T) is a specific arithmetical sentence, obtained by arithmetizing "no
  contradiction is derivable." It says nothing about whether an AI''s outputs are
  safe, whether its code does what the spec says, or whether its learning procedure
  preserves some invariant. Those are different sentences, and for many of them T
  proves them fine. So the move from "T ⊬ Con(T)" to "no self-certification of reliability"
  is a slide from consistency to soundness/safety, which the theorem doesn''t license.


