  Where does it actually go wrong? Multiple candidates:

  - (2) is too crude: it assumes motivation is purely sanction-based, ignoring intrinsic/public-service
  motivation and the way trust can be self-fulfilling (a "trust begets trustworthiness"
  mechanism — being trusted changes the trustee''s incentives via reputation, reciprocity,
  and identity). The argument treats only one direction of the feedback loop (crowding-out
  of vigilance) and ignores the other (crowding-in of trustworthy behavior). That''s
  the classic "crowding in/out" asymmetry — an omission rather than a fallacy.

  - The real slip between (3) and (4): monitoring is not the only, or even the main,
  determinant of expected sanction. In high-trust societies, formal accountability
  institutions (independent audit, free press, ombudsmen, freedom-of-information laws,
  judicial review, professional norms) substitute for *informal individual* vigilance.
  So (3) is about individual vigilance, while (2) is about expected scrutiny; the
  argument equivocates on "monitoring": diffuse citizen vigilance vs. institutionalized
  verification. High trust may coexist with — indeed may be produced by — heavy institutional
  monitoring. That''s the key equivocation: the "vigilance-displacement effect" displaces
  *personal* checking, not the *system''s* checking.

  - Also a composition/aggregation error: what''s true of an individual trusting (they
  under-invest in monitoring) doesn''t hold at the collective level, because monitoring
  is a public good supplied by specialists (journalists, auditors, opposition parties)
  whose supply doesn''t fall with trust — indeed, trust may raise the returns to investigative
  journalism because the public responds to revelations. Hmm, actually trust might
  raise responsiveness.

  - Also (5) equivocates: "trust consumes its own warrant" — the warrant for trust
  is partly the *history* of trustworthiness plus the *institutional* guarantees,
  not merely contemporaneous monitoring. And premise (1)''s "proportioned to trustworthiness"
  — trustworthiness itself is partly endogenous to trust, which makes (1)–(5) a fixed-point
  problem, not a monotone decline; the argument slides from "trust reduces one input
  to trustworthiness" to "trust reduces trustworthiness" and then to "trust is unwarranted,"
  which requires the reduction to dominate, which is not established.

  - Also (7) is a non sequitur: from "trust has a self-undermining tendency" it doesn''t
  follow that observed high trust is unwarranted; there can be a stable equilibrium
  at high trust if the crowd-in and institutional effects offset the crowd-out. The
  argument assumes a unique low equilibrium.

  - Also reverse causation: low corruption → trust, so trust is a *response* to observed
  trustworthiness, exactly as (1) requires. The argument treats trust as exogenous
  cause of reduced vigilance but it''s also an effect.

  - Also the "unacceptable" (7) rests on an inference from "cannot be what they appear"
  but no independent evidence.


