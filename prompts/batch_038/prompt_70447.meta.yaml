  Draft:


  ---


  I have been developing an argument for a paper on the comparative reasonableness
  of political trust, and I can no longer tell whether it is sound or whether it proves
  too much. It is meant to show that a certain familiar picture of high-trust societies
  is unstable. Here it is.


  1. Trust in an institution is rational for a citizen only to the extent that it
  is proportioned to that institution''s trustworthiness. Trust that outruns the evidence
  is credulity, not a civic virtue.


  2. An institution''s trustworthiness depends on the scrutiny and sanctions its agents
  expect. Officials behave well when defection is likely to be detected and costly;
  when they expect to be taken on faith, they have one less reason not to defect.


  3. Trust displaces vigilance. The more a citizen expects an institution to behave
  well, the less she invests in checking on it — reading the audit reports, attending
  the hearings, following the procurement notices, turning out to punish incumbents.
  Individual monitoring effort is a cost, and trust lowers the expected return on
  paying it.


  4. Therefore higher aggregate trust lowers the expected cost of official defection,
  and so lowers trustworthiness. [2, 3]


  5. Since trustworthiness is what makes trust rational, higher trust makes trust
  less warranted. Trust consumes its own warrant.


  6. So trust is self-limiting: any society''s trust must decline through its own
  operation until it settles at a level low enough that the residual vigilance is
  sufficient to keep trustworthiness at the level the trust assumes. That stable level
  should be well below what the high-trust democracies report.


  7. Hence the Scandinavian pattern cannot be what it appears to be. Those societies
  report both the highest trust in government and the lowest recorded corruption.
  If the argument above is right, one of the two must be an artifact: either their
  citizens are not really as trusting as the surveys say, or their officials'' good
  behavior is being produced by something other than expected scrutiny — smallness,
  homogeneity, resource wealth, well-paid civil services, or the way the corruption
  indices are constructed — in which case the citizens'' trust is not tracking trustworthiness
  and is not evidentially warranted.


