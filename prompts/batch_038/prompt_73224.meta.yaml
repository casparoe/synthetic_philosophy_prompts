  Jeffrey conditionalization: Richard Jeffrey''s probability kinematics. Updating
  on uncertain evidence: P_new(A) = Σ P(A|B_i) P_new(B_i) where {B_i} is a partition.
  Tensions:


  - Rigidity assumption (conditional probabilities unchanged) — Jeffrey conditionalization
  assumes P_new(A|B_i) = P_old(A|B_i). But this fails in cases of "rigidity violation"
  — e.g., learning about the probability itself, or when the uncertain evidence is
  about a matter that also shifts conditional probabilities (Skyrms''s problem, "the
  problem of old evidence"/"problem of uncertain evidence").

  - The problem that Jeffrey conditionalization isn''t uniquely determined: many different
  updates satisfy kinematics. Which one? Need a further principle: minimum cross-entropy
  / MRE (Shore-Johnson axioms), or Williams''s "Jeffrey conditionalization as minimizing
  distance from prior" — the unique update satisfying rigidity is the one that minimizes
  relative entropy.

  - Commutativity / order-independence: Jeffrey updating on two uncertain pieces of
  evidence in different orders gives different results — the update is not commutative.
  But if you hold that only total evidence matters (or that the posterior should be
  a function of the total evidence, not the order), tension.

  - Conditionalization as a special case.

  - Lewis''s result: if you''re certain you''ll always conditionalize on your total
  evidence, then old probabilities equal conditional probabilities given future evidence
  — which collapses. Combined with a view that Jeffrey updating is just "conditionalization
  on uncertain evidence" this creates tension with Lewis''s triviality-style result:
  Lewis showed that if you''re certain that you''ll update by conditionalization on
  your total evidence, then P_old(A) = P_old(A | your future total evidence) — which
  means your prior must already equalize conditional probabilities, which rules out
  Jeffrey updating''s rigidity except in a degenerate way. That''s a nice genuine
  tension.

  - Also: Jeffrey conditionalization preserves the "old conditional probabilities"
  — but the problem of uncertain evidence for "shifted" cases: if you learn that your
  evidence is unreliable, you should also change conditional probabilities (Skyrms''s
  "diachronic coherence").

  - Also: "ur-prior" view / diachronic Dutch book: Jeffrey updating is Dutch-bookable
  if you don''t have a plan (Skyrms 1987 showed JC minimizes... actually Skyrms''s
  dynamic coherence argument that Jeffrey updating is required by diachronic coherence;
  Teller''s conditionalization rule). Williams (1980) showed JC is the unique update
  minimizing relative entropy subject to the constraints. Diaconis-Zabell generalized
  to MRE.

  - Also: the "problem of the many partitions" / non-uniqueness: JC depends on which
  partition you pick, but the same total evidence can be represented by different
  partitions, leading to different posteriors. Actually if you specify new probabilities
  for a finer partition, then coarse ones follow, so consistency is fine. But two
  distinct partitions of the same evidence can give different results — this is a
  real worry: "JC is partition-dependent." Hmm, the more standard worry: JC is not
  self-supporting / not commutative (multiple uncertain updates in different orders
  → different results).

  - Also: rigidity vs. "evidence is uncertain but I''m certain about my experience"?
  Jeffrey''s view: the probability of the observation report is not 1; there is no
  rock-bottom certainty. Radical probabilism.

  - Also: JC and "ur-priors" — the Bayesian view that your posterior should be conditionalization
  on the total evidence you have; combined with "there is no certain evidence" (radical
  probabilism), the tension with "evidence must be certain" view.


  A nice belief set for a professor:


  1. Radical probabilism: no empirical proposition is certain; probability 1 is reserved
  for logical/mathematical truths. So experience never gives certainty.

  2. Therefore updating must be Jeffrey-style: probability kinematics on a partition
  of sensory reports with rigidity.

  3. But also: rigidity is not a substantive assumption about the world, it''s just
  the default; when it fails, we need some other rule — and I think the right generalization
  is minimum relative entropy (MRE), because it''s the unique rule satisfying Shore–Johnson-type
  consistency axioms.

  4. But also: I think the posterior should be a function of the total evidence only
  — order in which you acquire evidence shouldn''t matter, and two agents with the
  same priors and same total evidence should end with the same posterior.

  5. And: I hold the diachronic Dutch book argument: an agent who plans not to update
  by some rule is vulnerable; so rational updating is required by coherence, and Jeffrey
  conditionalization is what diachronic coherence demands.

  6. And: I think Lewis''s result shows that if you''re certain you''ll conditionalize,
  then your old conditional probabilities on your future total evidence equal your
  old unconditional probabilities — and I take that as showing that the "ur-prior"
  strategy of just conditionalizing on total evidence is fine.


