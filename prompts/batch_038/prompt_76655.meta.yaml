  Kalai–Smorodinsky (1975), "Other solutions to Nash''s bargaining problem", Econometrica.
  Axioms: Pareto optimality, symmetry, invariance (to affine transformations), and
  monotonicity: if the feasible set expands in a way that increases one player''s
  ideal (maximum attainable) payoff without decreasing the other''s, then the solution
  should not move against that player. Equivalently, KS is characterised by replacing
  IIA with monotonicity. The KS solution is the maximal point on the Pareto frontier
  of the ray from d to the ideal point a = (max u1 over S, max u2 over S). For non-convex
  sets, the ray may intersect the Pareto frontier multiple times — KS takes the largest
  intersection point (or the Pareto-optimal point on the ray; existence requires some
  care). Known result: KS satisfies strong monotonicity? Also known: KS does not satisfy
  IIA; Nash does not satisfy monotonicity.


  Also relevant: the "Nash program" — Nash''s reduction of bargaining to non-cooperative
  games. And: Rubinstein''s alternating-offers model with equal discount factors converges
  to the Nash solution, not KS. There''s a result that under risk aversion/uncertainty
  about breakdown the Nash solution arises (Binmore). Binmore criticises KS''s monotonicity
  as lacking a strategic foundation. Also: KS fails "contraction consistency"/IIA,
  and there''s a known critique that monotonicity can be violated under... hmm. Also
  known: the "proportional solution" and "egalitarian solution" (Kalai''s egalitarian
  solution drops symmetry, keeps monotonicity and IIA? The egalitarian solution maximises
  the minimum gain proportionally...). Also: KS is the unique solution satisfying
  Pareto, symmetry, invariance, monotonicity for two players but for n ≥ 3 the natural
  generalisation fails monotonicity (the "Kalai-Smorodinsky solution does not extend
  naturally to n players" — there''s a result by Roth that the n-person generalisation
  fails consistency, and the "monotonic solution" concept). Let me not lean on details
  I''m unsure of.


