  error correction doesn''t put you back in Turing-land necessarily. Let me phrase:
  any proposed hypercomputer that can''t be trusted to be right about its answer isn''t
  a counterexample to anything we care about; (3) the "efficiency" claim (strong Church-Turing),
  which is the only one that''s actually being tested in the lab, and which quantum
  computing may well falsify — and which has nothing to do with minds or with Gödel
  or with the limits of mathematics. And the punchline of the piece: almost everyone
  in the popular debate ("can the brain outcompute a machine?", Penrose-style arguments)
