  I am drafting the impact-control section of a design brief for a domestic-assistant
  prototype — the sort of system that tidies, prepares simple meals, and moves around
  an occupied house — and my co-author has told me flatly that my list of desiderata
  for the side-effect penalty cannot all be satisfied at once. I don''t think she''s
  right, but I want an independent audit before I argue the point, and I''d like it
  to be adversarial rather than diplomatic. Here is what I currently hold:


  (a) The penalty should be value-free. It should register only structural facts about
  the world — how much of the future remains open after an action — and should encode
  no substantive claim about which outcomes are good or bad. My motivation is twofold:
  any values we write down will be either wrong or exploitable, and I want the same
  measure to be reusable under whatever goal the system is eventually given.

  (b) Concretely, the currency is the agent''s reachable future: I compare the states
  (or the attainable utility over a fixed, deliberately simple set of auxiliary tasks)
  available after the agent acts with those available in the counterfactual in which
  it never intervened.

  (c) The measure must be symmetric across acts and omissions. Failing to prevent
  a foreseeable bad outcome should cost the agent at least as much as bringing about
  an equivalent one, since otherwise I have designed something that is only safe when
  it does nothing.

  (d) The system must be corrigible: indifferent to, or actively facilitative of,
  being shut down or having its goal revised, with no incentive to disable, evade,
  relocate, or manipulate the off-switch.

  (e) Large, intentional, irreversible changes are not automatically side effects.
  Building the requested extension, cooking the meal, or rearranging the furniture
  is what the system is for; the penalty attaches only to collateral changes that
  the assigned task does not require.

  (f) The weight trading task reward against impact penalty is a tuning knob, set
  by engineering convenience — low enough that it never in practice blocks task completion.

  (g) The measure may be estimated from the system''s own world-model under uncertainty;
  exact computation is not required.


