  Draft:


  I''m TA-ing a senior philosophy of mind course and I have to grade this take-home
  by tomorrow. The question, then the answer. Give me a grade (the question is worth
  25 points, split 15 for part a and 10 for part b) and then point-by-point comments
  I could hand back — I need to justify the grade line by line, say what''s right
  as well as what''s wrong, and be specific about the exact sentence or step you''re
  objecting to rather than general impressions. If a claim in the answer is only unsupported
  rather than false, say so and say what would have been needed to support it.


  THE QUESTION


  Pain asymbolia: patients, typically with damage to the insular cortex and surrounding
  regions, report that they can feel pains and can say where they are and how intense
  they are, but that the pains do not bother them; they shrug, laugh, or carry on
  with the conversation when pricked or burned, do not withdraw the limb, and do not
  ask for analgesia. Some say they know they ought to avoid the stimulus but that
  they simply don''t care. Call these patients group A.


  Now consider a second group, which is hypothetical but which you should treat as
  coherent and possible for the purposes of this question. B-patients are like A-patients
  in behaviour — no withdrawal, no avoidance, no analgesia-seeking, indifferent facial
  behaviour — but differ in report: they say the pain is genuinely awful, that they
  dislike it intensely and want it to stop immediately, and that their indifference
  to it is a bodily indifference rather than an experiential one. Call these patients
  group B.


  Three views of what makes a pain unpleasant:

  - Imperative view: an experience is a pain, and is unpleasant to the degree that
  it is, in virtue of carrying imperative content — content to the effect that the
  subject should protect or stop using some body part.

  - Evaluative view: unpleasantness consists in the experience representing a bodily
  disturbance as bad for the subject.

  - Desire view: unpleasantness consists in the subject''s desire, typically a higher-order
  one, that the experience cease.


  (a) For each view, say what group A is evidence for and what it leaves open. Which
  view is most directly threatened by group A and which accommodates it best?

  (b) Which view(s) does group B discriminate between, and how? Would anything turn
  on whether group B is merely conceivable or actually instantiated?


  THE STUDENT''S ANSWER (verbatim, typos included)


  Group A is important because it shows that the sensory-discriminative dimension
  of pain and the affective-motivational dimension can come apart. This is not the
  same thing as congenital analgesia: A-patients aren''t numb, they can localize the
  stimulus and rate its intensity, so their nociceptive processing and the discriminative
  side of pain is intact. What''s missing is the part that makes pain hurt. So group
  A is a real problem for any view that builds the unpleasantness of pain into its
  sensory character, since here we have the sensory character without the unpleasantness,
  or so it seems.


  The imperative view is the one most directly threatened. If a pain just is a command
  to protect the body part, then A-patients, who have no such commanding element at
  all — they shrug, they don''t withdraw, they don''t care — don''t have pains in
  the relevant sense. The imperativist either has to say that asymbolic patients feel
  no pain, which is a hard sell given that they report pains and rate them, or has
  to say that the command is there but is somehow disconnected from behaviour, and
