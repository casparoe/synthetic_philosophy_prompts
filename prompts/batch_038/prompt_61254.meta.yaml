  My view is that the objection fails, for four reasons.


  First, it attacks a straw version of the theory. NU treats happiness as having negative
  value: pleasure counts against an outcome, which is why the explosion is not merely
  permitted but mandatory. But most NU writers hold the weaker view that suffering
  has strict priority over happiness, so that happiness counts once suffering has
  been reduced far enough. On that version the bomb is not recommended, since it destroys
  all the happiness that would otherwise have been produced. Smart''s case assumes
  the strong reading and then presents it as the only one.


  Second, the same asymmetry is doing the work in Benatar''s argument...


