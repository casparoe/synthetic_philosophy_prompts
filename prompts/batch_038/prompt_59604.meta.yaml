  \ is clinically significant distress or impairment, whether or not function is atypical.\n\
  - R5: \"Anti-competitive-positional\" — fund unless the intervention's main benefit\
  \ is positional/advantage over others.\n\nNote R2 vs R1 diverge on: a person who\
