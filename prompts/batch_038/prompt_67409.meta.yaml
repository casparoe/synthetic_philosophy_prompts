  **Question:** "Some philosophers and AI researchers say that instead of building
  a machine that does the right thing, we should build one that works out what the
  right thing is, and that this ''indirect'' strategy is more promising than the ''direct''
  one. Explain the distinction being drawn here, and assess the strongest objection
  to the indirect strategy."


  **Answer (about 620 words):**


  Draft:


  "The distinction is between writing values into a system and writing a procedure
  for arriving at values into a system. A direct approach picks a moral principle
  in advance — maximize happiness, respect rights, follow these rules — and builds
  an agent that applies it. An indirect approach refuses to settle the substantive
  question and instead builds an agent whose job is to run, or approximate, an idealized
  deliberative process and act on whatever that process endorses. Three families belong
  on the indirect side. Ideal observer theories hold that the right act is the one
  that would be approved by a hypothetical observer who is all-knowing, all-perceiving,
  and disinterested. Coherent-extrapolation proposals hold that an agent should act
  on what humanity would want if we knew more, thought faster, and were more the people
  we wished we were, provided the extrapolation converges rather than diverges. And
  Rawls''s original position is the earliest and most influential version of the same
  idea: put reasoners behind a veil of ignorance that strips out every fact about
  who they are, and what they choose is what justice requires. Rawls is really proposing
  an early form of extrapolation — remove the distortions, and what is left is the
  answer.


  The attraction is obvious. Any particular principle we might encode is controversial,
  and an indirect approach is immune to that controversy, because it never asserts
  a moral claim at all: it only says which procedure to run. It also handles moral
  progress and disagreement in a way direct approaches cannot. If our views improve
  over time, a direct agent is frozen at whatever we believed when we built it; an
  indirect agent''s target moves with our better selves. And where people disagree,
  the indirect approach does not have to pick a side in advance — it asks what the
  disagreeing parties would say once the sources of the disagreement, ignorance and
  haste and self-interest, are removed.


  The strongest objection, I think, is that the idealization does not do the work
  it is asked to do. To specify the process you already have to make the substantive
  moral choices you were hoping to defer: which idealizations count as improvements,
  whose starting points get extrapolated, what ''the people we wished we were'' means.
  Every one of those is a first-order normative decision, and the indirect approach
  simply relocates the hard question into the specification of the procedure. Worse,
  the procedure is now being run by something that is not us. We get to check the
  results of a direct theory by asking whether its verdicts match our convictions;
  with an indirect one, we have outsourced the checking.


  A second objection is that the idealized deliberator might not want what we want,
  and that its wants would then have no authority over us. But this objection cannot
  get off the ground. Idealization is just the addition of information and the removal
  of error; the idealized agent is me with the mistakes corrected, so its verdicts
  are my verdicts, only better supported. Someone who complains that the fully informed
  version of himself would want something alien is complaining that he is currently
  mistaken about what he wants, which is exactly what the theory says.


  What is left is a genuine worry about convergence, but it cuts in the theory''s
  favour. Every indirect account predicts that idealized agents will agree, and disagreement
  is a symptom of bias and ignorance. So the fact that these processes converge is
  evidence that there is a single correct answer to be converged on — that values
  are objective in the realist''s sense, waiting to be found rather than made. If
  value were merely a matter of what we happen to want, idealization would be expected
  to amplify our differences, not to erase them."


