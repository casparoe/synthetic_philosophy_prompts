  So I''m in a philosophy-of-computation reading group and it''s my turn to lead next
  week, and the topic is the physical version of the Church–Turing thesis — roughly,
  the claim that anything a real physical system can actually do, a Turing machine
  can do too. The problem is that every time someone in the group proposes a counterexample,
  someone else says the counterexample doesn''t count because we haven''t said what
  would count, and my prof has this habit of saying the thesis is neither true nor
  false but underspecified, which I find unsatisfying but can''t argue with. Before
  I read a single more paper I want the spec. Write out the desiderata: what does
  a formulation of the thesis have to deliver to count as a genuine claim rather than
  a definition in a trenchcoat?


  Give me the requirements with the consideration behind each one, and for each say
  whether it''s non-negotiable or just the taste of a particular camp. The stuff I
  already know I want in there, plus whatever I''m missing: it has to pin down effective
  procedure without just redefining it as Turing-computable, or the whole thing is
  circular; it has to say something about the old dilemma where either the thesis
  is an analytic truth about what we mean by following a rule, in which case no experiment
  could ever threaten it, or it''s an empirical claim about matter and energy, in
  which case we should be able to say what observation would refute it — and my suspicion
  is that those two horns can''t both be dodged, so if that''s right, say so, since
  a jointly unsatisfiable subset is the interesting result; it should handle machines
  that take real numbers as exact inputs and do exact arithmetic on them in one step
  (the BSS-style models), and tell me whether those are counterexamples or just a
  different subject entirely; it should have an answer to the general-relativistic
  setups of the Malament–Hogarth kind, where an observer can in principle recieve
  the output of a machine that''s been computing for infinite proper time — is that
  a physical refutation, or does it show the notion of physically realizable doing
  all the work; and it should explain the weird epistemic status, i.e. nobody has
  a proof of it but basically everybody in the field is confident, so what kind of
  warrant is that and does an adequate formulation have to make that warrant intelligible.
  Also, and this one gets skipped a lot: it has to say what makes a physical system
  an implementation of a given formal machine at all — which voltages or firing patterns
  correspond to which tape squares and states — because if any system can be read
  as implementing anything, the thesis is trivially true and useless.


  Then, briefly, run three candidate formulations I''ve cobbled together past your
  list and tell me which requirements each one trips on. (a) the human clerk reading:
  effective means what a person could do following fixed rules with paper and pencil,
