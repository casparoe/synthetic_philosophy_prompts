  Let me think about which produces the richest, best-specified deliverable. I think
  Gödel + thought experiment is very distinctive and "in the weeds": Gödel''s rotating
  universe, closed timelike curves, Gödel''s claim that time (in the sense of an objective
  lapse/ordering) does not exist. Gödel argued in "An Example of a New Type of Cosmological
  Solutions of Einstein''s Field Equations" (1949) and in the philosophical essays
  ("Rotating Universes and the Meaning of Time" / "A Remark about the Relationship
  between Relativity Theory and Idealistic Philosophy"). Key points:

  - Ordinary conception of time involves (a) an objective distinction between past/present/future
  — events ordered as before/after in a way independent of observers — and (b) time
  "flowing" or lapsing (the present advancing).

  - In special relativity, simultaneity is relative, so there''s no objective global
  "now"; but one could still have a "many-layers" picture (foliation into spacelike
  hypersurfaces) — Gödel notes that in SR one could salvage a notion of objective
  time by choosing an arbitrary foliation, though it''s not absolute.

  - In Gödel''s rotating universe, there exist closed timelike curves, so the before/after
  relation isn''t even a partial order: an event can precede itself. Therefore no
  foliation into "layers" is possible at all, and even the "many-layers" surrogate
  of objective time is gone.

  - Gödel concludes: since such a spacetime is a possible solution of Einstein''s
  equations (and since the possibility of traveling to any region of the past on such
  a world would show absurdity), time is not an objective feature of reality — it''s
  ideal (Kantian). He adds an argument that if the rotating universe is possible,
  then time in that sense could not exist even in our universe because a universe''s
  structure is a contingent matter; a property of reality (time''s existence) shouldn''t
  depend on the contingent distribution of matter.

  - Also Gödel noted that in his universe, matter rotates relative to the local inertial
  frames — Mach''s principle fails.

  - He considered the possibility that our universe might be a Gödel-type universe
  and discussed whether empirical evidence (rotation of the universe) could refute
  or confirm it; he noted the redshift evidence suggested expansion, which his model
  didn''t have. Later, observations constrain cosmic rotation tightly.


