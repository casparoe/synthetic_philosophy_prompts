  The core philosophical work: Gödel''s argument has two steps that people conflate:

  (1) In SR / any spacetime with relative simultaneity, there''s no absolute foliation
  → no objective "now"/becoming. But one might retreat to a "many-layered" or "block"
  surrogate: an ordering by before/after which is objective even if the present isn''t.

  (2) In the Gödel universe, even that retreat fails, because CTCs destroy the before/after
  ordering (it''s not antisymmetric).


  So a good designed case would isolate the difference: two spacetimes/regions, identical
  in every operational respect available to local observers (same local physics, same
  light-cone structure locally), one of which admits a global time function and one
  of which does not — and show that the observers cannot tell the difference by any
  local experiment, which is precisely Gödel''s point that the existence of objective
  time is not something discoverable by physics but is rather decided by the global
  structure. Then ask: what does Gödel infer, and does the inference require the *actuality*
  of the rotating universe, or only its *possibility*? Gödel famously held that the
  mere possibility suffices — since a universe''s being Gödel-type is a contingent
  matter of the distribution of matter, if objective time is a real property of the
  world it shouldn''t come and go with contingent facts. This is the crux, and it''s
  a nice "which feature does the work" question.


