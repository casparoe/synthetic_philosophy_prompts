  The student''s opening move must be a challenge the character has to deal with.
  Good challenges to a causal-historical account:

  1. Novel/fictional fonts: a designer invents a new ''a'' from scratch, in an alphabet
  they made up — no lineage to any existing ''a'' — and it reads as an ''a''. On the
  causal theory, is it an ''a''? (analogous to the "Madagascar"/ "Twin Earth" style
  objections to causal theories of reference). Actually stronger: a person who has
  never seen Latin letters, isolated, invents a glyph; it happens to look like a lowercase
