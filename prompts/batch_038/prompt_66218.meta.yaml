  a mere shape — the causal theory gets this right, arguably, and that''s a point
  for it. Hmm, so that''s a concession.

  2. Better challenge: forgery/typographic substitution — a scribe copies a manuscript;
  a letterform drifts over centuries (e.g., ''a'' from Carolingian minuscule, and
  the double-storey vs single-storey ''a''). The causal theory says the lineage decides;
  but two tokens with identical shape, one produced as an ''a'' and one as random
  noise (a coffee stain that looks exactly like a well-formed ''a''), differ in letterhood
  — and the causal theorist embraces that. Then the challenge: it makes letterhood
  invisible to the reader. But readers see letterhood. If two physically identical
  marks differ in whether they are ''a''s, and a reader can''t tell them apart, then
  letterhood isn''t a visible property — yet we say "that looks like an a." That''s
  a real tension worth pressing.

  3. Or: the causal theory can''t handle style. The whole Letter Spirit point: the
  essence of a letterform is what survives across radically different styles — the
  "letter spirit." The causal-historical theory explains membership but not similarity-in-kind:
  it can''t explain why the ''a'' in Helvetica and a child''s scrawled ''a'' feel
  like the *same letter* in a way that a purely accidental resemblance wouldn''t.
  Also it can''t explain gradience: some tokens are better ''a''s than others; some
  are borderline. A causal theory is all-or-nothing (either in the lineage or not)
  — but our judgments come in degrees. That''s a strong opening: degrees/all-or-nothing
  mismatch.


