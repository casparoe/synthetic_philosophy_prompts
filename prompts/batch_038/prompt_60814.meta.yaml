  I convene a graduate seminar on the use of history in foreign policy. For three
  years it has contained the same unresolved argument, and the argument never advances.
  On one side sit what I''ll call the analogy-users: they hold that statesmen must
  reason from cases, that 1938 licenses a standing presumption against accommodating
  an aggressor''s territorial demands, that the failure to see a rising power''s challenge
  as dangerous until it is too late is the recurrent error of statecraft, and that
  the Thucydides-trap case file — sixteen historical rivalries between a rising and
  a ruling power, twelve of which ended in war — is exactly the kind of evidence policy
  ought to be built on. On the other side sit the analogy-skeptics: they point out
  that for any historical precedent there is a competing precedent (Korea and 1938
  both available to the architects of the Vietnam escalation, and both cited), that
  the similarities invoked are chosen after the preferred conclusion has been reached,
  that the case file is a hand-picked non-random sample in which "rising," "ruling,"
  and "war" are stretched to fit the pattern, and that we have no observation of the
  counterfactual in which Chamberlain resisted.


  What puzzles me is not that they disagree but how they disagree. Both camps present
