  ---


  In three weeks I am giving a forty-minute paper at a departmental seminar that is
  run jointly by our evolutionary biology group and our philosophy of science group,
  and I would like a proper question-period prep sheet rather than a defence of the
  view.


  The thesis I am defending: in a laboratory system of experimentally evolved microbial
  collectives, group-level selection is not a harmless redescription of what is going
  on within groups, but a distinct process with its own causal contribution — and
  the familiar move of absorbing the result into kin selection is unavailable in this
  system for a non-trivial reason, namely that high within-group relatedness is a
  downstream consequence of our selection regime rather than its mechanism.


  Here is the argument as I intend to present it, so that the objections can be aimed
  at something concrete:


  - We propagated 96 lines of a mat-forming microbe for 300 transfers. At each transfer
  the bottom tenth of a settling column was retained and used to found the next generation,
  with each new group started from a propagule of twenty cells drawn from a single
  parent group. Group-level differential propagation is therefore built into the design.

  - In half the lines we periodically introduced a fast-growing variant that contributes
  nothing to the mat and so lowers the group''s settling rate. This variant is the
  usual "cheater".

  - Standard Price-equation partitioning with a contextual-analysis term gives, in
  both treatments, a substantial cross-level covariance term. In the cheater-introduction
  lines, within-group relatedness measured at mid-transfer falls sharply, yet the
  group-level trait variance in mat production and the cross-level term remain large.

  - From this I argue two things. First, that our groups reproduce as groups — fragmentation
  preserves parent-group composition across the propagule stage — so this is the strong
  sense of multilevel selection in which collectives themselves stand in parent–offspring
  relations, not merely the weaker sense in which collectives are vehicles and only
  cells reproduce. Second, that because group-level variance persists when relatedness
  is experimentally depressed, Hamilton''s-rule-style reduction cannot be doing the
  explanatory work here, and the objection that all group-selection results dissolve
  into relatedness is answered by direct manipulation rather than by argument.


  The audience: roughly a dozen empirical evolutionary biologists — behavioural ecologists,
  a couple of microbial experimentalists, someone who works on cooperative breeding
  — who come from a Williams-and-Dawkins formation and hear "group selection" as a
  settled error; three philosophers of biology who work on the units debate, are fluent
  in the partition machinery and the Darwinian-individuality literature, and will
  want to know which sense of multilevel selection I mean and whether my individuation
  criteria are principled; one quantitative geneticist who does variance partitioning
  and mixed models and will attack the statistics rather than the metaphysics; and
  several graduate students, at least one of whom works on major transitions and may
  well be on my side.


  Please produce:


  1. The objections I will actually get, ordered by how much damage each would do,
