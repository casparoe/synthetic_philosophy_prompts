  The thesis should be specific and defensible-but-vulnerable. Let me define it carefully:


  Thesis (call it "attributable establishment"): Establishment is objectionable only
  insofar as it makes an individual''s civic standing depend on a religious affiliation
  they cannot individually vary. The German model — corporate tax status for recognized
  religious bodies, collection by the state for a fee, exit by notarized declaration,
  and the civil consequences of exit (loss of church employment, burial, sacraments)
  — actually scores better on this test than the American model, in which religion
  is funded invisibly through general taxation, chaplains, vouchers, and tax exemptions,
  and in which the individual has no mechanism at all to vary their contribution.
  The German system''s "exit" is a genuine individual control; the American system''s
  lack of an establishment tax is not a virtue but the absence of a control. So the
  American objection to the Kirchensteuer ("compelled support") is inconsistent with
  the American tolerance of tax exemptions and indirect funding.


  Objections the audience will raise:

  1. The coercion objection: compelled support is the harm; making it individually
  opt-out-able doesn''t cure it because the default assigns you. And the exit costs
  are severe (Kirchenaustritt requires a notary/court fee, and canonically it''s a
  formal act of defection with ecclesial consequences) — so the "control" is largely
  nominal for a devout person. From the historians: the German system''s origin (Prussian,
  Weimar Constitution Art. 137, carried into the Basic Law Art. 140) is about state-church
  bargain, not individual liberty.

  2. "Your test proves too much / it''s not really a test of establishment": If individual
  variabilty is the criterion, then a system with a per-capita religious tax that
  funds all recognized religions equally would be ideal, and no actual establishment
  would ever qualify; you''re really arguing for a voucher scheme, not for the German
  system. Also: by your test, the US Earned Income Tax Credit-style... hmm.

  3. The "proves too much" objection about general taxation: If invisibility is the
  vice, then the US system is worse only because citizens are ignorant; fix the ignorance
  with a disclosure requirement (a line on the 1040 telling you how much goes to faith-based
  contractors) and there''s no establishment problem. So the argument supports transparency
  reform, not establishment.

  4. The neutrality/equality objection from the comparative constitutionalist on France:
  laïcité''s point is that the republic doesn''t recognize any cult; recognition itself
  creates a hierarchy of religions (Germany''s Körperschaft des öffentlichen Rechts
  status, and the struggle of Muslim communities to obtain it — real issue: whether
  Islamic umbrella organizations meet the "umbrella" durability requirement; also
  the debate over Islamunterricht). Your view entrenches legacy churches and penalizes
  newcomers. Strong objection.

  5. The First Amendment scholar: your argument assumes the Establishment Clause is
  about individual burden; under the coercion test (Kennedy v. Bremerton''s "history
  and tradition" approach) the question is whether government has coerced religious
  observance. Also, "no compelled support" is not actually the operative doctrine
  in the US; the Court has upheld tax exemptions (Walz) and aid flows (Mitchell, Zelman,
  Trinity Lutheran, Espinoza, Carson). So the American model already funds religion
  and your comparison is of two systems that both fund religion — which collapses
  your contrast, since you now need a different axis.

  6. Church historian: the German church tax is collected by the state only for churches
  that opt into it; the fee (Kirchensteuereinzug) is around 2-4% of revenue; and the
  state''s role makes churches de facto quasi-public bodies, which arguably is worse
  for church autonomy (a value the Americans in the room will care about — the "freedom
  of the church"/institutional autonomy line, e.g., Hosanna-Tabor). So your "control"
  comes at the price of the church becoming an arm of the state; a First Amendment
  scholar will say that''s exactly what the US system avoids.

