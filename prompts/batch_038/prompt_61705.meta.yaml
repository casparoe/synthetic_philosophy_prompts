  ---


  I maintain release tooling for a widely used open-source library, and I have been
  asked to give a talk to our engineering organization about what our compatibility
  policy actually assumes — not as folklore, but as a stated theory. Preparing it,
  I keep running into the fact that the software ecosystem already operates a de facto
  metric for "how much of a change is this," and that metric looks a lot like what
  people in AI safety mean when they talk about building systems that avoid side effects.
  Semantic versioning sorts every change into three buckets: a fix that leaves the
  public interface untouched bumps the patch number, an addition that is backward
  compatible (including marking something deprecated) bumps the minor, and anything
  backward incompatible bumps the major. The specification defines a bug fix as an
  internal change that corrects incorrect behavior, which means a correction that
  alters what the software observably does cannot be a patch release at all; it is
  by definition breaking, even when it makes the software strictly better. Meanwhile
  an observation named for the engineer who made it holds that "with a sufficient
  number of users of an API, it does not matter what you promise in the contract:
  all observable behaviors of your system will be depended on by somebody." The Linux
  kernel takes the most extreme version of this stance as a rule of governance: when
  a maintainer argued in 2012 that a regression was really the fault of the user-space
  program that broke, Linus Torvalds replied on the mailing list that "If a change
  results in user programs breaking, it''s a bug in the kernel. We never EVER blame
  the user programs." Layered on top are deprecation windows — announce in a minor
  release, keep the thing working for months or years, remove it only at a major —
  and one standing exception: security fixes ship immediately and are allowed to break
  whatever they break.


  The reason this interests me philosophically is that proposals for low-impact AI
  face exactly the same design problem, and they solve it in different ways. Some
  define impact as deviation from the starting state, so that any change to the world
  counts against the system. Some define it as deviation from what would have happened
  anyway had the system been switched off or never deployed, which makes inaction
  the baseline rather than the status quo. Some measure impact as a loss of reachability
  — how many states of the world the system can no longer bring about, regardless
  of whether anyone cares about them. Some measure it as the reduction in the system''s
  ability to achieve a broad set of unrelated goals, on the theory that a change is
  serious to the extent that it forecloses options. And some give up on measuring
  the world at all and instead penalize changes only to a designated list of variables
  that somebody has declared to matter. Each of these is answerable to the objection
  that you cannot say what a side effect is without already knowing what is valuable;
  each answers that objection differently, or claims not to need to.


  So here is what I want. Reconstruct the theory of impact that our versioning practices
  presuppose: which baseline they measure against, what they treat as the locus of
  harm, and whether the appeal to user dependence is doing the work of a value specification
