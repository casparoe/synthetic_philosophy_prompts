  Now the distinctive phenomenon to inject. Let me define it sharply:


  Phenomenon: In certain national myths, the *demonstrated impossibility* of success
  is what does the justificatory work, and — the twist — the myth''s custodians actively
  *resist* revisionist histories that would show the outcome was contingent or the
  defenders'' decision imprudent. Normally, you''d expect a myth to want to soften
  the defeat (make it near-victory, blame treachery, deny it was a defeat at all).
  Here it''s the reverse: the myth *needs* the loss to be total, known-in-advance,
  and free of any hint that a different choice could have succeeded. Historians who
  say "they could have escaped," "the siege was winnable," "the retreat was a sensible
  tactical decision," or "the defenders didn''t know they were doomed" find their
  work attacked not by the victors'' descendants but by the myth''s own heirs, who
  insist on the futility. Also: any evidence of the defenders'' agency being constrained
  (they had no alternative, they were following orders, they were misinformed) is
  resisted, because the glory requires that they chose, knowing full well.


  So the phenomenon has two coupled features:

  (1) Futility is load-bearing: the more certain the doom, the greater the glory;
  a narrow escape or a near-victory would *weaken* the story.

  (2) Counterfactual foreclosure: the myth is defended against exactly those revisions
  that would restore contingency — i.e., against *improvements* to the defenders''
  prospects. Historiographical resistance runs opposite to what one expects of a flattering
  myth.


  And a third, subtler one: the moral claim is that they *chose* the doom, so the
