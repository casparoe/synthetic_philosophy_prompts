  The Pasadena game: a coin is flipped until it lands heads; if heads first appears
  on the nth toss, the payoff is (-1)^(n-1) * 2^n / n. So: n=1: +2/1 = 2; n=2: -4/2
  = -2; n=3: +8/3 ≈ 2.67; n=4: -16/4 = -4; n=5: +32/5 = 6.4; etc. Probabilities 1/2^n.
  Expected value terms: 2*(1/2) = 1; -2*(1/4) = -1/2; (8/3)*(1/8) = 1/3; -4*(1/16)
  = -1/4; (32/5)*(1/32) = 1/5. So the series is 1 - 1/2 + 1/3 - 1/4 + ... = ln 2 ≈
  0.693. Conditionally convergent → by Riemann rearrangement theorem, can be rearranged
  to sum to anything. So the EV is order-dependent / undefined under the standard
  countably additive definition (which requires absolute convergence for the expectation
  to be well-defined).


