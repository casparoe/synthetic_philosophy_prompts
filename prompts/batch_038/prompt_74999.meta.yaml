  Draft:


  "I am moderating the question-and-answer session after a departmental lecture by
  a moral philosopher who defends a contemporary version of Taurek''s position that
  the numbers should not count. Her version is not the standard one, and the questions
  need to engage it on its own terms. In outline, she holds:


  (1) that losses cannot be summed across persons, so the deaths of five people do
  not amount to a single greater loss than the death of one, and there is therefore
  nothing that the rescuer is failing to minimize by refusing to save the five;

  (2) that what is owed to the claimants is not survival but an equal chance, so that
  where a rescuer can randomize, a fifty-fifty lottery between the one and the five
  is the only permissible way of deciding;

  (3) that this requirement to randomize binds individual rescuers but not institutions
  — a hospital, ministry, or disaster agency may straightforwardly allocate to the
  greater number, because institutions are not themselves persons to whom the duty
  of equal chances is owed, and the duty to randomize has no institutional analogue;

  (4) that saving the five is in any case merely permissible rather than required,
  and that our strong intuition that it is clearly the right thing to do is explained
  by the fact that in ordinary life we are almost always acting through institutional
  arrangements rather than as lone rescuers.


