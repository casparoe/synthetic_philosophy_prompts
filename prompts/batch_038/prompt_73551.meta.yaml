  The theory content that must survive translation:

  1. Cost is only credible if it''s *differentially* costly — cheaper for the high-quality
  signaller than for the low-quality one, at the margin. (Core of Grafen/Zahavi.)

  2. Cost paid must be *unrecoverable and un-transferable* — you can''t insure it,
  borrow it, or be reimbursed; otherwise anyone can buy it.

  3. The signal must be about the trait you care about, not a proxy (wealth, free
  time, social standing).

  4. Honesty is an equilibrium property of the population, not a guarantee about an
  individual — so the procedure must treat signals as shifting odds, not proving quality.

  5. When quality differences are small or when everyone can afford the cost, the
  signal collapses (inflation) — and once a receiver starts rewarding a signal, low
  types imitate it, so the procedure must watch for drift over time.

  6. Indices (physically constrained signals) beat handicaps where available — things
  that can''t be faked because they''re tied to the trait itself (e.g., a past record
  of actual attendance).

  7. Receiver-side asymmetry of error costs sets the threshold.

  8. Contingent penalties (bonds, clawbacks) are often better signals than upfront
  costs because they''re paid only if the trait is absent — this inverts the naive
  "costlier is better" rule. This is the injected niche idea.

  9. Public/visible costs can be aimed at third parties rather than at you — signaling
  to a different audience, so not informative for your decision.

  10. The self-selection effect: the procedure changes who applies (selection distortion).


