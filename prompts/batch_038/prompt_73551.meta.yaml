  Let me double check one thing: "costly signaling and the handicap principle" — I
  want the procedure to be grounded in real theory. Key points I''m confident about:

  - Zahavi''s handicap principle: signals are reliable because they are costly, and
  the cost is a handicap that only high-quality individuals can bear. Zahavi''s original
  idea was that the cost must be *differentially* burdensome.

  - Grafen''s models: (a) the "handicap" as a condition-dependent signal where marginal
  cost is lower for high-quality individuals; (b) strategic choice model showing honest
  equilibrium.

  - Maynard Smith & Harper: distinction between signals (arbitrary, evolutionarily
  stable by convention/cost) and indices (physically linked to the quality, unfakeable).

  - Spence: job-market signaling where cost differs by type; separation vs. pooling
  equilibria.

  - Gintis/Smith/Bowles: cost as a commitment device in human cooperation.

  - Also "cheap talk" (Crawford & Sobel) — costless messages can be informative if
  interests align.

  - Also the point that a signal can be honest on average but not case-by-case (equilibrium
  reasoning is about populations).

  - Also "handicap inflation" / evolutionary runaway / the receiver''s counter-adaptation.

  - Also the point that in human settings, a signal''s cost can be borne by a third
  party (a sponsor), decoupling cost from the signaller''s quality — very relevant
  to circular matches.

  - Also: costs paid *before* selection are sunk and thus not informative about future
  behavior; contingent penalties function as bonds/hostages (like Williamson''s "hostages"
  / Klein & Leffler''s quality-assurance pricing, or Becker''s crime-and-punishment
  logic). Actually, "hostage" and "bond" concepts in institutional economics (Oliver
  Williamson''s hostages in vertical integration; the idea of credible commitments)
  are relevant to the clawback question. I''m confident about Williamson''s hostages
  notion generally, but I won''t name it. Also: performance bonds in construction,
  and Klein-Leffler "quality premia" — market prices above competitive level as a
