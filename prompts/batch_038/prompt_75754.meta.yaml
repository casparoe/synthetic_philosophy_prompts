  I am in the second year of a doctorate in comparative genocide studies and am about
  to submit the framing chapter of my dissertation, which concerns how the field should
  position the Holocaust relative to other cases. My supervisor has told me to state
  my commitments explicitly before arguing for them, and I would like an independent
  audit of whether they can all stand together. Here they are:


  (1) I accept Bauman''s central claim in substance rather than as a metaphor: the
  Holocaust was not a failure of modern civilisation but something modern civilisation
  made possible. Bureaucratic rationality, the division of moral labour, and the social
  production of indifference are not incidental features of the event but conditions
  of its possibility. I take this as a claim about the modern West generally, not
  about Germany alone.


  (2) I am nevertheless an intentionalist about the killing programme in the narrow
  historiographical sense: the decision to murder the Jews of Europe cannot be reconstructed
  without assigning decisive weight to ideological conviction, and in particular to
  the eliminationist content of Nazi antisemitism. The Final Solution was not the
  outcome of bureaucratic drift or of cumulative radicalisation alone.


  (3) Genocide is a recurrent phenomenon with an identifiable structure, and the purpose
  of the field is to specify conditions that raise its probability. The Holocaust
  therefore enters my framework as one case among others, and I reject any methodological
  exemption for it.


  (4) At the same time I accept that comparison is never merely technical. Framings
  that place the Holocaust in a series do normative work, and some of them do it in
  a direction I regard as exculpatory. I therefore think it legitimate to assess comparative
  proposals not only for accuracy but for what they are being used to do, and I follow
  Habermas against Nolte in the 1980s controversy in holding that Nolte''s attempt
  to derive the Holocaust from the Bolshevik terror was objectionable in kind and
  not merely in degree.


  (5) I find the "uniqueness" formulation unhelpful and prefer to say that the Holocaust
  was unprecedented in specific respects — most obviously the industrialised killing
  complex — while remaining fully comparable in others.


  (6) I hold that the discipline must de-centre Europe, and that colonial genocides
  — the Herero and Nama, the Congo, Tasmania — are paradigmatic rather than peripheral
