  Residue candidates:

  1. In the puzzle, the father''s public announcement is a reliable broadcast; in
  epistemic game theory, the common prior and common knowledge of rationality are
  stipulated with no broadcast at all. So "common knowledge of rationality" has no
  protocol; it''s a property of the model, not of any communication. Distributed systems
  has no word for knowledge that is common without being established.

  2. Rationality as utility maximization: processes don''t have preferences. The nearest
  analog is "correct process follows the protocol", which is a syntactic, not a semantic,
  notion. So the entire content of "rational" (belief-desire, expected utility) is
  unmappable; the closest is "non-Byzantine" — but non-Byzantine means "follows the
  spec," which is a much weaker and behaviorally defined notion.

  3. Beliefs: in distributed systems, knowledge is about facts of the world (the value
  of a variable), and knowledge is factive; in game theory, beliefs are probabilistic
  and need not be factive. Factivity is a real disanalogy: distributed systems "knows"
  is factive and typically binary, game-theoretic "believes with probability p" is
  graded. So the translation has to convert probability into certainty, losing the
  common prior entirely.

  4. The common prior has no counterpart at all: nothing in a consensus protocol says
  all processes share an initial belief state. Actually, they do share the initial
  state in many models (identical code), but the assumption that all differences in
  belief come from differences in information — there''s no analog.

  5. The residue might show something real: Aumann''s theorem requires common knowledge
  of the posteriors, which in a real protocol requires synchrony/reliable broadcast;
  so "agreeing to disagree" in markets may be rational precisely because common knowledge
  of posteriors is unattainable (this is a known argument). That''s the payoff: the
  translation exposes that the theorem''s premises include a communication assumption
  that is unachievable in asynchronous systems, which is a genuine result, not a defect
  of the target vocabulary.


