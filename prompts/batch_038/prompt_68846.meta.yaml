  Commitments (about 8-10 items, mixed theses and verdicts):


  (1) Grounding is primitive and hyperintensional; not reducible to supervenience,
  counterfactual dependence, or truthmaking-by-necessitation. (I''ve read enough to
  know that "A grounds B" can''t be analyzed as "necessarily, if A then B.")

