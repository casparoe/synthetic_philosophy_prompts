  (8) Verdict: mental facts (and normative facts, if any) are fully grounded in base
  facts plus grounding facts — I''m a grounding physicalist.

  (9) Verdict: mathematical truths are not grounded in the base facts; I take them
  to be *zero-grounded* (grounded in nothing at all) rather than fundamental, because
