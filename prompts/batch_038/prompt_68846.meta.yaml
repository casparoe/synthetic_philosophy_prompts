  base facts about the physical distribution over spacetime regions. No negative facts,
  no totality facts, no absences, no "the rest of the world is like this" facts at
  the base. Parsimony motive: I want the base to be quotable — you should be able
  in principle to write it down.

  (6) Definitional: for both facts and entities, x is fundamental iff x has no full
  ground. Partial grounding is compatible with fundamentality.

  (7) Verdict: <there are no unicorns> is true; I think it''s partly grounded in the
  base facts — each of them individually rules out a unicorn in its region — but I
  deny that any finite plurality of base facts fully grounds it, and I refuse to add
