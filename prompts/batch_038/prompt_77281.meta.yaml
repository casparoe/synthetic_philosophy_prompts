  TA-ing a senior-level Kant seminar and I''ve got ~40 take-homes to get through by
  Friday. This one is marked "graded but not commented" so far — I haven''t looked
  at it closely and I don''t want to bias you with my own hunch about how it went.
  Below is the question as it was set, and the student''s answer verbatim. Give me
