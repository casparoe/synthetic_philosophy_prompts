  paste them into the feedback form. No reading list or citations please — just the
  assessment from what you already know of Kant.


  Question (as set):


  "Kant distinguishes maxims that cannot even be conceived as universal laws of nature
  from maxims that can be conceived as such but cannot be willed as such. Explain
  the distinction, and show how it generates the difference between strict and wide
  duty in his examples of the false promise and of refusing help to others. Say what
  kind of argument the second case requires."


  Student''s answer:


  Kant''s test in the Groundwork is applied to maxims, not to actions or to types
  of action, which matters because the same act can fall under different maxims and
  come out differently. He splits failures of the test into two kinds. In the first,
  the maxim cannot even be thought as a universal law of nature without contradiction
  — a world in which everyone acted on it is not a possible world at all. In the second,
  such a world is perfectly conceivable, and people could live in it, but a rational
  agent cannot consistently will to be in it.


  The false promise is of the first kind. The maxim is something like: when I need
  money, I will borrow it by promising to repay, knowing I won''t. If that were a
  universal law of nature, promising as such would collapse, since no one would take
  a promise at face value, and so the maxim could not even be thought as a law — it
  destroys the condition of its own success. This gives a strict duty to others, and
  strict duties admit of no exception in favour of inclination.


  Refusing help is of the second kind. A world in which nobody ever helps anybody
  is not inconceivable; the human race could subsist in it, as Kant allows. But I
  cannot will it, because there will be cases where I need the love and sympathy of
  others, and by willing such a law I would be depriving myself of what I will to
  have. So the failure is in the will rather than in the concept, and the resulting
  duty is wide: the law cannot determine how much help I owe, to whom, or on what
  occasions, and how far one goes beyond the letter is left open. Wide duties are
  the ones other moral theories treat as supererogatory — praiseworthy to perform,
  not blameworthy to omit.


  The second case, then, does not run through the concept of a promise or any other
  social practice; it runs through what an agent necessarily wants, and this is why
  it is weaker. In effect the argument is: I cannot will universal indifference because
  I might one day be on the receiving end, which is close to a prudential calculation,
  and Kant knows it, since he makes the duty wide to leave room for how much self-interest
  is at stake. Both failures can be restated as instances of the humanity formula:
  to act on a non-universalizable maxim just is to treat someone as a mere means,
  and that''s what the false promiser does. The two formulations are the same principle
  in different words, so passing one guarantees passing the other.


  Same goes for the maxims about self-love and suicide, and about developing one''s
  talents: suicide fails because one cannot will a world in which self-love destroys
  the very life it exists to promote, and the neglected talents case fails at the
  conception stage, since a world of permanently undeveloped capacities cannot be
  thought.


  Grade and comment. Format: (1) a mark out of 20; (2) numbered list of what the answer
  gets right that isn''t trivial; (3) numbered list of what''s wrong, overstated or
  unsupported, each with a one-line note on how much it costs the mark; (4) one sentence
  for the top-of-page summary comment. Under 450 words total for the whole thing.


