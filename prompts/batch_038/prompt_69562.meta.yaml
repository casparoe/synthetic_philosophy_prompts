  I am circulating a draft platform statement on electoral reform to a working group
  before it goes to our steering committee, and I would like a consistency audit of
  the position it commits me to. The statement defends three reforms together — extending
  the franchise to sixteen-year-olds, extending it to long-term resident non-citizens,
