  commitment that motivates lowering the voting age), then you must accept whatever
  turnout results from voluntary voting; but compulsory voting''s rationale often
  rests on the idea that the aggregate electorate''s decisions are distorted by who
  shows up — which is a kind of epistemic/representativeness argument. Also compulsory
  voting arguably violates the anti-paternalism / anti-perfectionism that underwrites
  the enfranchisement extensions.


