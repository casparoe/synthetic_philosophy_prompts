  ---

  So our philosophy of law reading group (about 10 people, mixed grad students and
  a couple of law folks) is doing Kafka''s In the Penal Colony in three weeks, and
  I volunteered to frame the discussion. We''ve spent the term on punishment theory
  — the retributivist/consequentialist split, plus the more recent communicative stuff
  — and I want to use the story without turning it into a coat-hanger for the theories.
  Can you write the reading I''d want to hand them?


  The bits I care about, roughly in this order:


  - The colony has two penal regimes: the old Commandant''s apparatus, and whatever
  the new Commandant and his circle of ladies are steering toward. Does that actually
  map onto retributivism vs consequentialism, or does the story wreck the mapping?
  My worry is that the Officer''s procedure isn''t retributive in any recognizable
  sense — there''s no hearing, guilt is never in doubt, the condemned man doesn''t
  even know what he''s charged with until it''s carved into him. So what is it, if
  not retributivism?

  - The machine''s whole promise is that something like the sixth hour, the condemned
  man starts to decipher the inscription and his face changes — he finally understands.
  Is that a picture of desert being paid, or of punishment as communication/penance
  aimed at the offender''s own comprehension? And does the twelve hour delay do philosophical
  work that the theories I know don''t capture?

  - Then the Officer sets the harrow for himself and it just... breaks: a quick death
  with no epiphany and no legible inscription. Two readings occur to me and I can''t
  decide — either the enlightenment was always a lie the regime told itself, or the
  story is showing that self-punishment collapses roles that retributive justice needs
  kept apart (someone has to be the punisher, and he can''t be both). Which do you
  think holds up, and does the story give us anything to go on?

  - The traveller refuses to attack the machine publicly, says he''ll register his
  disapproval privately to the Commandant and then get back on his boat, and drives
  off the soldier and the condemned man who try to follow him. Is that a defensible
  position for an outsider, or does the story indict it? And is it even taking a side,
  or is it refusing to?


