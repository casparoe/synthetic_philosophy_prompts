  A concrete practice: the "Ramsey formula" r = ρ + η·g, where ρ is pure time preference,
  η elasticity of marginal utility, g growth rate of per-capita consumption. This
  presupposes: utilitarian aggregation across time, that a richer future person''s
  welfare counts for less (η>0) — which is a claim about diminishing marginal utility
  of consumption, plus the assumption that future people will be richer (which is
  an empirical bet). The practice of discounting for growth presupposes the "compensation
  logic": we''re poor now, they''ll be rich, so transferring to them is regressive.
  Interesting: the practice quietly presupposes that the distributional judgment applies
  to consumption, not welfare; that expected growth is certain enough to bank on (and
  if growth is uncertain, the discount rate should be lower — Weitzman''s result);
  and that climate damages are additive to consumption rather than affecting the growth
  rate itself.


