  Structure of the prompt (casual, professor voice):

  - Setup: I''m prepping a seminar / I''ve been staring at this guidance document.

  - Describe the practice concretely: regulator''s appraisal manual says discount
  money at ~3.5% (or "about 3-4%"), but health effects (lives, QALYs) at a lower rate,
  ~1.5%; and it declines further out in time; and the same manual tells you to monetize
  a statistical life for near-term effects (so it does treat health as money at one
  point) — the inconsistency: it monetizes life but refuses to discount health like
  money.

  - Also: the same document''s climate chapter treats a tonne of CO2 with a social
  cost of carbon derived using a discount rate near 1-2%, while other chapters use
  3.5%.

  - Ask: what theory of value / of intertemporal ethics does this presuppose? Which
  rival views does it rule out (pure time preference, person-affecting views, "the
  future will be richer anyway" logic, QALY monetization)? Is it internally coherent,
  or is the differential rate a fudge to smuggle in a near-zero pure time preference
  while keeping a defensible headline rate?

  - Ask to distinguish strict presupposition from mere fit; say where it''s underdetermined
  (e.g., multiple theories license declining rates: uncertainty about growth, Weitzman''s
  averaging; diminishing marginal utility of health; non-fungibility).

  - Ask what would have to change in the practice if you replaced the presupposed
  view with a rival (e.g., if you adopted undiscounted aggregation, or if you adopted
  a person-affecting view where only identifiable future people count, or a view on
  which future people''s welfare matters only insofar as they''d be worse off than
  some baseline).

  - Also throw in the nonidentity wrinkle? Maybe one sentence: "and the people who
  get the health benefits in year 200 of the appraisal are people whose existence
  depends on the very policy being appraised — does the practice need an answer to
  that, or does it get to stay silent?" That adds domain-5 flavor, and it''s a genuinely
  underexplored point. Nice — but might overload. It''s fine; a good prompt can have
  a few sub-questions.


