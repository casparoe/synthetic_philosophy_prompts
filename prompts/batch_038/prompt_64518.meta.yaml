  cannot detect the illusion from the inside: the false sense of attitude presents
  exactly as the true one would, so there is no introspective mark by which to tell
  the two apart, and the only remedy is to defer to an instrument reading that represents
  the aircraft''s state indirectly, through a mechanism whose outputs the pilot has
  learned to interpret.


  Then the second half. On an instrument approach, at the decision altitude, the instruments
  are declared insufficient. To descend below, the pilot must have the required outside
  visual references in sight — the runway environment itself — and if they are not
  there, the approach is abandoned, no matter how perfect the instrument indications
