  Title: "Artifacts don''t have politics. They have revocation costs."


  Body:


  1. Setup: The 1980 Winner paper in Daedalus asks whether artifacts have politics;
  the famous example is Robert Moses''s Long Island parkways, overpasses built low
  enough that the buses carrying poor (and disproportionately Black) New Yorkers to
  Jones Beach couldn''t clear them. Winner says: yes, the politics is in the concrete.
  The counter-literature — Bernward Joerges is the one I remember best — says the
  story doesn''t survive contact with the records: the clearances weren''t unusual
  for parkways of the era, buses did get to Jones Beach, and the anti-bus intent is
  imported from Caro''s biography rather than found in the archives. (Flag: I''m reconstructing
  this from memory.)


  2. The point: both sides are arguing about the same thing — whether a value or an
  intention got *into* the artifact. Encode vs. attribute. I want to say that''s the
  wrong axis. The right question isn''t "is there politics in the concrete?" but "what
  happened to the question that the concrete settles?" A decision that used to be
  revisable every year (which neighborhoods get transit, at what fare, on what schedule)
  becomes a decision that was made once, by someone, and now costs $40M and a decade
  to undo. The political property of an artifact is its revocation cost.


  3. Coined term: an artifact has politics to the degree that it converts an ongoing
  question into a settled one, and raises the price of un-settling it. "Standing orders."
  Moses''s bridges, on this account, are political whether or not he hated bus riders
  — because either way they moved a transit question out of the arena where it gets
  renegotiated and into the arena where it doesn''t. Which also, incidentally, dissolves
  the intent debate: intent matters for *who* to blame, not for whether the thing
  is political.


  4. Second axis: maintenance. Some standing orders are self-enforcing (a road layout,
  a culvert height, a default setting) and some expire unless somebody keeps paying
  (DRM, a content-moderation classifier, an import ban enforced by inspections). So:
  revocable-cheaply / revocable-only-at-great-cost × self-maintaining / needs-a-budget.
  Four cells. Give an example per cell. And then the interesting bit: the cells aren''t
  stable. Self-maintaining artifacts drift; maintained artifacts become self-maintaining
  when the maintenance gets forgotten (a filter list nobody updates becomes a de facto
  standard). So the taxonomy is really about *rates*, not types — which is I suspect
  where it''s going to get torn apart.


  5. Payoff / where it bites: this reframes design review. You don''t audit a system
  for hidden values; you audit it for which decisions it takes off the table and how
  expensive it will be to put them back. Also, self-aware: yes, I know, the AI-safety
  people will say this is just corrigibility with a humanities budget, and the economists
  will say it''s just path dependence / increasing returns à la Brian Arthur. My answer
  is that both of those are about a single agent''s relationship to its own future
  options, and this is about one party''s ability to bind parties who were never at
  the table. Which may or may not be a real difference. That''s section 5 and I think
  it''s the weakest.


  6. Closing line: The question isn''t whether artifacts have politics. It''s whether
  anyone can still vote on it.


