  intuition is the right one, how the probability of a tied outcome differs from the
  probability of casting the decisive vote, and how much the estimate moves when it
  is conditioned on genuine competitiveness rather than averaged over all elections.
  What empirical finding about close elections would force a revision rather than
  a footnote?

  - The specification of the stakes term. If the voter''s concern extends to others,
  the benefit of one''s preferred outcome scales with the number of people affected,
  which grows with the size of the electorate. Is the paradox therefore an artifact
  of egoism rather than of scale, and what has to be assumed about the magnitude of
  other-regarding concern for that route to work?

  - The causal structure of large numbers. Cases in which each of many acts makes
  no difference on its own though together they make a great deal, the hitchhiker-style
  case in which each vote genuinely matters, and the further claim that making a difference
