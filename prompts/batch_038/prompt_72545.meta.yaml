  philosophy actually knows about referendums — the impossibility theorems, the aggregation
  problems, the distinction between a mandate and a decision procedure, Condorcet,
  the problem of the "yes/no" binary framing, the indeterminacy of the question asked
  (what exactly is being decided — the outcome or the direction?), non-monotonicity,
  the no-set-thing problem, etc. This is quite good: it makes the conceptual work
  concrete and it''s a practitioner role. But does it require citations? It would
  benefit from "grounded in whatever social choice theory actually establishes," which
  is fine without citations. But I should be careful: naming specific theorems (Arrow,
  Gibbard–Satterthwaite) is safe — models know these. The risk of the model regurgitating:
  moderate. To make it harder/more niche, I can inject a specific constraint set:
  e.g., a two-question referendum where the answers can conflict, or "the proposal''s
  wording determines which of three options is actually on the table," or a requirement
  to handle "the question that would have been asked five years from now." Inject
  a niche twist: our jurisdiction has a rule that a referendum question must be "answerable"
  — i.e., there must be a determinate action that follows from each answer — and the
  team must decide whether a given proposal meets that. Also handle a proposal with
  a "no campaign" that means two different things. And worked applications: (1) a
  proposal to leave/withdraw from something where "no" is ambiguous between status
  quo and renegotiation; (2) a proposal to allocate funding by ranking three projects
  where only one can be funded (binary framing collapses a three-way choice); (3)
  one where the procedure says go ahead but the asker hates it.


