  The color phi phenomenon: this is from Dennett and Kinsbourne''s 1992 paper "Time
  and the Observer: The Where and When of Consciousness in the Brain" (Behavioral
  and Brain Sciences). The "color phi" phenomenon was originally reported by Kolers
  and von Grünau (1984). Actually the color phi phenomenon: two colored dots presented
  in sequence at different locations produce apparent motion, and subjects report
  the color changes mid-motion — even though the second color''s information wasn''t
  available until after the first dot disappeared. Two explanations: Orwellian (the
  experience happens with the first color, then memory of it is revised/overwritten)
  vs. Stalinesque (a "delay loop" where the brain holds off constructing the experience
  until the second stimulus arrives, so the color change is genuinely experienced).
  Dennett and Kinsbourne argued these two hypotheses make no distinguishable empirical
  difference — "there are no experiments that could distinguish them" — the multiple
  drafts model. The claim: the distinction between Orwellian and Stalinesque revisions
  collapses; no possible experiment can tell whether a revision happened before or
  after "the theater of consciousness."


  Also related: the "cutaneous rabbit" illusion (Geldard and Sherrick, 1972) — taps
  on the wrist and elbow are felt as evenly spaced along the arm. That''s another
  key example.


  The prompt type: probability estimate decomposed. So something like: "What''s your
  credence that the Stalinesque and Orwellian hypotheses about the color phi phenomenon
  are empirically indistinguishable in principle?" Or "credence that no experiment
  could ever determine whether the color change is experienced during the motion."


  Actually let me think about which framing yields the most interesting decomposition.
  Options:


  1. Credence that Orwellian and Stalinesque accounts of the color phi phenomenon
  are empirically equivalent — i.e., that no experiment, even in principle, can determine
