  colonies were still stable in 2019.

  - H2 (the food-web hypothesis): the collapse tracks the removal of a small pelagic
  fish from the surrounding bank by an industrial fishery that expanded in 2009. It
  explains the population crash, plus the doubling of eggshell thinning, plus the
