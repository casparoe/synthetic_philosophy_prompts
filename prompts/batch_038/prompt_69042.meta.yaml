  the specific tension in this case (H2 loveliest, H1 predicted). [5]

  2. A non-question-begging account of why prediction might outweigh accommodation
  (risk / no-fudge / selection effect), and an explicit acknowledgment that the temporal
  fact itself is epistemically inert once the evidence is in hand. [6]

  3. Recognizing that the patched auxiliary in H2 is independently testable and was
  tested (fishing pressure at the port colony was lowest) — so this isn''t merely
  a charge of ad hoc-ness but a concrete failed prediction of the auxiliary; the student
  must use this, not just label H2 "ad hoc". [5]

  4. Handling the bad-lot objection in part (b): correctly saying that the success
  of an unconceived alternative does not show the inference was irrational/unreliable,
  and giving at least one reason (the objection generalizes to any method; catch-all
  priors; distinguishing rule-reliability from output-truth). [6]

  5. Some constructive upshot: what would make the choice genuinely truth-conducive
