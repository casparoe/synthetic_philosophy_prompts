  - H3: the crash is partly an artifact — the census methodology changed in 2016 (fewer
  surveyors, different counting), so the "crash" is smaller than reported; explains
  the abruptness of the drop but not the breeding-failure data.

  - H4 (not in the original set, emerging later): a toxin from an algal bloom.


  Key datum: the timing detail — the crash began in one colony a year before the others,
  near the port. H1 predicted that (the hypothesis was written down in a grant application
  in 2015 predicting port-adjacent colonies would crash first, before the data came
  in); H2 accommodated it by adding an epicycle (the port-adjacent colony also had
  higher fishing pressure — later shown false, actually the fishing pressure there
  was lowest, requiring a further tweak: "but it had a shallower foraging range").
  That''s a nice epicycle detail! H3 predicts the opposite pattern actually (the methodology
  change applied to all colonies equally).


  So the crux: H2 is lovelier (unifies with a mainland decline of the same species,
  explains eggshell thinning, connects to known ecology, simpler mechanism, no new
  entities), but its key adjustment was made post hoc and its auxiliary has already
  been patched once. H1 is uglier (posits an unobserved vector, ad hoc-ish) but it
  predicted the spatial pattern before the data. Students must ask: does prediction
  beat loveliness? Is the prediction-vs-accommodation asymmetry a real epistemic virtue,
  or is it a psychological bias — since, as the Bayesian says, once you conditionalize
  on the datum, the likelihood is what matters and the history of when you formed
  the hypothesis is irrelevant (that''s the classic Bayesian point about old evidence
  / accommodation — but careful: the Bayesian says accommodation isn''t less confirming,
  unless you suspect the hypothesis was fitted to the data, in which case there''s
  a selection/double-counting worry — the "fudge factor" argument, e.g., from Lipton
  and from Bayesian accounts of ad hoc-ness: accommodation is only worse if you think
  the theorist would have produced a hypothesis fitting any data, which lowers the
  likelihood or reveals that no risk was taken). This is a beautiful crux and shows
  real understanding: the asymmetry is not that prediction is intrinsically more confirming,
  but that a hypothesis fitted to the datum may be one of many that would fit — a
  "bad lot" worry at the level of the individual theory. And the model answer can
  note that the fudge in H2 is independently detectable (the auxiliary was patched
  and the patch is testable and was falsified: fishing pressure was lowest at the
  port colony).


