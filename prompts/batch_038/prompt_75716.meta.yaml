  Option 3: Allais + type B (verdicts). This type is well-suited to "in the weeds":
  the student gives verdicts over several decision problems mixing Allais common-consequence,
  common-ratio, and something else, and asks which axiom each verdict violates. The
  weeds: which version of independence (vNM independence over lotteries, Savage''s
  P2/sure-thing, event-wise/state-wise independence, mixture independence), plus Machina''s
  point about consequentialism and separability over decision trees, plus the dynamic-consistency
  argument, plus "preference for randomization," plus the "hedging"/Ellsberg element,
  plus the "one-shot vs. repeated" framing, plus the "Fanning problem" (Wakker''s
  term for how the problem is presented). Also Allais''s own diagnosis: he thought
  the independence axiom fails because utility isn''t linear in probability but also
  that people weight certainty ("the certainty effect" — later Kahneman-Tversky prospect
  theory weighting), and Allais''s "cardinal" psychological interpretation vs. Savage''s.
  And the "sure-thing principle" is violated by Allais too, which Savage took seriously
  (he said upon reflection he''d change his answer — the "Savage''s flip" anecdote:
  after hearing Allais''s argument, Savage said people should reconsider; he called
  the axioms "normative" and said if you violate them you''d be a fool... hmm — actually
  the famous line: Savage (1954) responded that "if the person who violated the axioms...
  I would have to say he is a fool" — not sure of exact wording; avoid quoting).


  Risk: Allais + verdicts might be something models regurgitate (the standard answer:
  rank-dependent utility / cumulative prospect theory / weighted utility / Chew-Dekel).
  To make it in-the-weeds, include verdicts that are NOT standard: e.g., the student''s
  verdicts include a "certainty" case where they don''t show the Allais pattern (so
  a pure probability-weighting story fails), and a case where they prefer a lottery
  over a sure thing in a way inconsistent with any monotone weighting function; plus
  a preference for randomization; plus reversal when the same choice is framed as
  a two-stage lottery vs. reduced form; plus an ambiguity case where they hedge. Then
  ask: what principle captures them; does any single-utility model work; which verdicts
  must go. That''s genuinely hard and reflective-equilibrium-ish. And the injection
  of "preference for randomization" and "fanning" and "the Allais pattern reversed"
  is niche.


