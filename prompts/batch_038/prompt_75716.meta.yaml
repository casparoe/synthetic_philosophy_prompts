  about norms: "Lord of the Flies" (conch), "The Giver"? "Animal Farm" (the Seven
  Commandments — norms literally written on the wall and silently revised! That''s
  beautiful: Squealer alters the commandments; the animals'' memory; the norm''s content
  shifts while the sign stays). Animal Farm + Lewis: conventions require common knowledge
  and mutual expectations; Snowball''s commandments as a codification; the revisions
  test whether a written rule''s meaning is determined by the regularity in behavior
  or by the inscription. And Lewis''s later view: a convention is a regularity in
  behavior sustained by preferences and common knowledge — but the commandments in
  Animal Farm are not coordination regularities; they''re authoritative rules enforced
  by terror. So a Lewisian analysis would say the animals are not in a convention
  but in a coercive equilibrium — which is exactly the interesting critical point:
  Lewis''s framework, developed for coordination (driving on the right), struggles
  with norms that are not coordination equilibria: moral norms with second-order enforcement,
  punishment of free riders. That''s a real philosophical problem for Lewis (cf. criticisms
  that Lewis''s analysis covers only arbitrary coordination conventions, not moral
  norms — Bicchieri''s social norms work: empirical expectations vs. normative expectations;
  Skyrms''s evolution of signaling). And the evolution-of-norms angle: do the animals''
  norms evolve by Lewisian dynamics?


