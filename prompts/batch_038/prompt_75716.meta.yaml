  Gödel + Slaughterhouse-Five: The novel''s Tralfamadorian metaphysics is a block
  universe where all moments exist permanently ("Only on Earth is there any talk of
  free will"). Gödel''s argument concludes that time''s flow/objective becoming is
  not a feature of reality. But there''s an important mismatch: Gödel''s argument
  is a reductio premised on the physical possibility of CTCs — and Gödel thought CTCs,
  if actual, would undermine objective becoming; he also emphasized that such a universe
  differs "very much" from ours and that the possibility of traveling to the past
  and acting on it is itself absurd. Vonnegut''s time travel involves Billy being
  abducted and experiencing moments out of order — but crucially, the Tralfamadorians''
  view is about perception and about fatalism (nothing can be changed), whereas Gödel''s
  point about CTCs is that the past is literally accessible and thus one could act
  on it — which generates the grandfather paradox, the very absurdity Gödel used.
  So a good reading would show: the novel dramatizes the *conclusion* (no objective
  becoming, death is a bad condition only in a particular moment) without the *argument*;
  and it dodges the paradox by making the time travel non-interactive/fatalistic (Billy
  can''t change anything, and the novel never lets him alter the past — actually Billy
  does go back and forth, and there''s a scene where he''s in 1967 giving a talk and
  then transported; and there''s the "Billy in the zoo on Tralfamadore with Montana
