  I''m moderating a fireside conversation at a small workshop on judgment and forecasting
  — audience is mostly grad students in public policy plus a few people who do estimation
  for a living. My guest is a methodologist who runs an outside-view-first practice
  for cost and schedule estimates. Her position, as I understand it (correct me if
  I''ve caricatured any of this):


  - reference class first, and literally first. Her teams lock in the reference class
  and its outcome distribution in a sealed envelope before anyone reads the project-specific
  file, on the grounds that picking the class using inside information is circular.

  - the base rate is a constraint, not a prior. The final number has to land inside
  the central 80% of the reference distribution unless the team can argue a causal
  difference from the class, and that argument itself has to be backed by data from
  other projects. She says the burden sits entirely on the deviation.

  - when people ask "but is this one different?", her answer is basically that you
  can''t know that in advance and the pretense that you can is what blows up budgets.
  So epistemic modesty is doing structural work, not just vibe.

  - she''s in the Flyvbjerg lineage on megaprojects, but she pushes the method well
  past construction: she''s applied it to R&D timelines, to how long wars last, to
  product launches.


  I don''t want soft questions and I don''t want her restating the planning fallacy.
  Write me six questions, ordered so that the difficulty ramps — start with something
  she''ll field comfortably, end with one I think she can''t get out of. For each:
  name the pressure point you''re actually targeting, give me the reply she''s most
  likely to give, and then a follow-up that survives that specific reply (not a follow-up
  to a strawman answer — she''s sharp, assume her first answer is the good one).


  Make sure the set covers these, though I don''t want it to read like a checklist:

  - the sealed-envelope thing. Locking the class before you know anything about the
  case looks like it solves the circularity, but somebody had to decide which class,
  and that decision seems to need exactly the information she''s refusing to look
  at. Also: nested classes. All wars, or all wars since 1945, or all wars since 1945
  with comparable technology? The distributions differ hugely and she''s barred from
  using case knowledge to choose.

  - the constraint reading. If the base rate is a prior you update, then "outside
  view first" just means "don''t neglect the prior," and the entire substance is the
  size of the adjustment, which is inside-view work. If instead it''s a hard constraint,
  then it can conflict with information that''s about as good as information gets.
  Concretely: a project under a genuine fixed-price turnkey contract has almost no
  cost uncertainty. Does her protocol make her widen the interval anyway? If yes,
  the method is producing worse estimates on purpose; if no, she''s letting case-specific
  information override the class, which is the thing she forbids.

  - genuinely first-of-a-kind cases. The risk-vs-uncertainty line: base rates are
  for situations that repeat, and forcing a one-off into a distribution built from
  non-comparable cases might be false precision dressed up as modesty. Ask her what
  makes reporting a wide interval more honest than saying the distribution doesn''t
  apply.

  - performativity. If her method becomes standard, the reference distribution changes,
  because the overruns it records were partly caused by people not using the method.
  Ask her which distribution you''re supposed to use once the method is widespread
  — and whether a method whose success erodes its own evidence base counts as a virtue
  or a bug.

  - turn it on her. Her whole view is a claim about how to make estimates better,
  so what''s the reference class for methodological interventions like hers, and what''s
  the base rate for those actually improving outcomes in the wild? Debiasing training
  tends to wash out fast, and forecasting-improvement methods have a graveyard. She
  can''t exempt her own thesis from the outside view without special pleading.


  Then, two things I care about as much as the questions. First: tell me honestly
  which of the six you think she has a real answer to, and what that answer is — I
  don''t want to walk in thinking I''ve got a knockout when I''ve got a nuisance.
  Second: say what would change your ranking. Which detail about her view, if I''ve
  got it wrong above, would flip your judgment about which question is the killer,
