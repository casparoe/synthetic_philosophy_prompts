  vs impersonal goodness; (c) the slide from finite to infinite (Z with an enormous
  population requires infinitely many steps, and each step''s "not worse than" doesn''t
  accumulate); (d) the "non-anti-egalitarianism" premise — the claim that moving from
  A+ to Alpha is better involves a trade-off between equality and average welfare;
