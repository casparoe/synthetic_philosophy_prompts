  I am in my final year of high school, and in a few weeks I am giving a talk to our
  school''s philosophy society. I built an argument to motivate Parfit''s repugnant
  conclusion, intending to reject the conclusion at the end and show my audience where
  the reasoning goes wrong. The problem is that I can no longer find the mistake,
  and I would rather discover that now than in front of the room. I am hoping you
  can identify the step at which the argument fails — or, if it does not fail, tell
  me which premise is least expensive to abandon and what I lose by abandoning it.


  Here is the setup. Begin with a population A: ten billion people, all of whom enjoy
  excellent lives — lives full of the sorts of things that make existence worth having.
  Now consider A+: everything in A exactly as it was, plus ten billion additional
  people whose lives are worth living but clearly less good than the lives of the
  first group. Suppose further that the two groups are entirely cut off from one another:
  they never meet, never learn of one another, and cannot affect one another in any
  way.


  My argument runs as follows.


  1. A+ is not worse than A. Nobody who exists in A is harmed or loses anything by
  the addition, since the groups cannot interact; and the added people have lives
  worth living, which is a good thing for them. If nothing is lost for anyone and
  something is gained for some, it is hard to see how the result could be a worse
  state of affairs.


  2. Now consider Alpha: a population of the same size as A+ in which everyone enjoys
  a very high quality of life — very nearly as high as the best-off group in A+, but
  slightly below it, and equal for all. Alpha is better than A+. It contains the same
  number of people; almost everyone in it is better off than their counterpart in
  A+; and the large gap between the two groups has been eliminated.


  3. From Alpha I can repeat the same two moves: add a further group with lives worth
  living but lower than Alpha''s level, producing Alpha+, and then equalize upward
  to just below Alpha+''s best level, producing Beta. Nothing prevents me from continuing
  this procedure as many times as I like, each time lowering the level slightly.


  4. Every step in the series is therefore, by 1 and 2, either not worse than the
  step before or strictly better than it.


  5. A relation of "at least as good as" that holds between each adjacent pair in
  such a series must hold between the endpoints; otherwise I would have to say that
  a chain of tiny, individually negligible changes somehow adds up to a large loss,
  which I do not believe.


  6. So the final population in the series is at least as good as A. And because infinitely
  many of the steps are strictly better, the final population is better than A.


  7. Taking the series far enough, the final population is Z: an unimaginably vast
  population in which everyone''s life is barely worth living — worth continuing,
  but containing none of the richness of life in A.


  8. Therefore Z is better than A: a world of countless people whose lives are just
  barely worth living is better than a world of ten billion people with excellent
  lives.


  I cannot accept 8. I have tried to convince myself otherwise, but whenever I picture
  Z and picture A, A seems plainly better, and I do not think that is a failure of
  imagination on my part. At the same time, I am attached to the thought behind 1
  — that bringing additional people into existence whose lives are worth living cannot
  make the world worse — and I would rather give up 5 or 6 than give up 1, if I had
  to choose. But I do not want to be told which premise I would prefer to keep; I
