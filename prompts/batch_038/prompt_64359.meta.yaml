  What should they come away seeing? Let me list the target insights, injected as
  novel-ish framing:

  (a) The phenomenology from inside the cascade: the third-or-later decider experiences
  their own evidence as *silenced* rather than overridden — they still think the state
  might be the other one, and they know they''re discarding a genuine reason. So:
  rational action against one''s own remaining judgment ("I know I''d bet the other
  way if I were first, and I still have to announce this"). The activity should surface
  that: after each choice, ask each player to privately write down what they personally
  believe the state is (not what they announce). Then the reveal shows divergence
  between private belief and public action — the classic "pluralistic ignorance"/insincere-announcement
  point. This is a great mechanic: two cards, one public action, one private belief.
  Then the group sees that most of the herd privately disagreed.

  (b) The asymmetry: the later you move, the more total information you have, and
  the less weight your own signal carries — plus the fact that the crowd''s aggregated
  information is worse than the sum of its parts.

  (c) The fragility twist: revealing a single early player''s signal (or a single
  piece of new public information) can overturn the whole thing, and the participants
  should feel the *dread* of the early movers'' information being exposed — hmm, actually
  let''s design a "second act": after the cascade forms, the facilitator reveals the
  true state, or reveals that one of the first two players drew from a different (contaminated)
  urn / was a confederate flipping a coin, and then re-runs the last players'' decisions
  with that knowledge. Students then discover the herd was resting on nothing. This
  maps to the point that a cascade''s authority is entirely in the *inference* that
  others acted informatively; undermine the inference and the herd evaporates. And
  the twist: the participants who were in the cascade had no way of knowing this —
  so their decision was still rational. That''s the "rational herding" punch.

  (d) The distinction from social-pressure conformity: because the game is anonymous-ish,
  payoff-identical, and there is no benefit to agreeing, the cascade cannot be explained
  by conformity or by a payoff externality. But students will reach for that explanation
  anyway. The activity should be instrumented so that the conformity explanation is
  falsified on the spot — e.g., players write their choice before any of them can
  see faces/reactions, choices are made by written card placed in order, no verbal
  communication permitted, and there''s a control round where the same signal structure
  is played *simultaneously* (no observation), producing no cascade. That''s a strong
  design: control condition. Then the debrief compares the two rounds.


