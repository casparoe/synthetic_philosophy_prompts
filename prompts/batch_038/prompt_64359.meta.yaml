  Let me get the math right so the prompt can demand correct expected-utility computations.
  Standard setup: urn with 2/3 blue and 1/3 red chips (or 3:1). Each player draws
  one chip privately, sees color, then publicly chooses "Blue" or "Red" to guess majority.
  Payoff 1 if correct. With prior P(B)=2/3, a single private signal blue gives posterior
  P(B|blue) = (2/3 * 2/3)/((2/3*2/3)+(1/3*1/3)) = (4/9)/(4/9+1/9)=4/5. If red: (2/3*1/3)/((2/3*1/3)+(1/3*2/3))
  = (2/9)/(2/9+2/9)=1/2. Hmm, that gives exactly 1/2 for a red draw — the classic
  BHW setup uses urn with 2/3 blue... Let me recompute: With urn composition p(blue)=2/3,
  drawing a chip at random from the urn: P(blue|Blue-majority)=2/3, P(blue|Red-majority)=1/3.
  Prior P(Blue-majority)=1/2 for the classic case. Then a single blue draw → posterior
  2/3; a single red draw → posterior 1/3. That''s the classic BHW: prior 1/2, signal
  accuracy 2/3. Then the first person follows their signal, second person: if their
  signal agrees, choose that; if disagrees, posterior = 1/2, indifferent... In BHW
  the cascade begins at person 2 or 3. Classic result: with equal priors and 2/3 signals,
  player 1 follows signal; player 2 follows signal if it agrees, and if disagrees,
  is indifferent → breaks tie by following own signal? Actually BHW''s standard account:
  if player 2 sees player 1 choose B and draws R, posterior is 1/2 — indifferent;
  assume they follow their own signal (tie-break). Then player 3 facing (B, R) gets
  no information (the history is a "tie") so they follow their own signal. Hmm, the
  canonical BHW cascade example uses different tie-breaking or three colors. Let me
  not specify exact numbers in the prompt — instead I''ll ask the model to compute
  the posteriors and to pick parameters (urn composition, number of players, tie-breaking)
  such that following the cascade is strictly optimal at every position from the third
  onward, and to verify the arithmetic. Actually a cleaner well-known parameterization:
  signals are correct with probability p, prior 1/2. Player 1 follows signal. Player
  2 with opposite signal is indifferent → tie-break follows own signal (this is where
  fragility comes). Player 3: if history is (same, same) = two agreeing signals, posterior
  = p²/(p²+(1-p)²)... With p = 0.6: two agreeing signals: 0.36/(0.36+0.16)=0.69. Third
  player with opposite signal: combining 0.69 with likelihood ratio 0.4/0.6 = 0.667
  → odds 0.69/0.31=2.226 * 0.667 = 1.484 → posterior 0.597 > 0.5, so follows the herd.
  Then with three agreeing: 0.216/(0.216+0.064)=0.77; fourth with opposite signal:
  odds 3.35*0.667=2.23→0.69. So cascade continues. Good: with p=0.6 (e.g., an urn
