  Now write the thesis sketch carefully so the model has targets:


  Thesis: "Slot semantics" / I''ll call it the "register view" of rule identity.


  1. In any rule-system with a written register — Nomic''s numbered rules, a code,
  a constitution — a rule''s identity is its address in the register, not its content.
  Amendment is an assignment operation: it writes new content to an existing address.
  Rule-identity is thus like a variable in a program, not like a proposition.

  2. What looks like self-amendment — Article V used on Article V, or Nomic''s rule
  governing rule-change being changed — is not self-application in the vicious sense,
  because the authority invoked is the content occupying the slot at the moment of
  the operation, while the content written to the slot takes effect only after. The
  two contents never occupy the slot together; nothing says of itself that it is and
  is not in force.

  3. Ross''s puzzle presupposes what Suber calls the inference model: validity transmitted
  from premises to conclusion by a rule of inference, so that a new amendment clause
  must derive its validity from the old one that authorizes it, and the derivation
  fails because at the moment of derivation the old clause is being annulled. On the
  register view, validity is not transmitted by inference but is a standing property
  of the register''s occupancy: an amendment is valid if it is a well-formed write
  to a live slot performed by the procedure then in force. No bootstrap, no Grundnorm,
  no appeal to social acceptance required — and no need for the see-saw device of
  two alternating amendment clauses.

  4. The view is not merely deflationary: it predicts where genuine reflexivity trouble
  will remain. Trouble arises exactly when a rule refers to its own content rather
  than to its address: self-entrenchment clauses that describe what they entrench,
  sunset clauses whose expiry conditions are stated in terms of their own text, provisions
  declaring themselves unamendable "insofar as they provide for X". Those are diagonal
  constructions, and for them the paradox is real. So the theory yields a drafting
  norm: write amendment procedures address-referring, never content-referring — and
  a diagnostic for the historical record.

  5. Corollary for machine-readable law: a versioned registry that identifies rules
  by content hash (as some legal-tech and DAO-governance systems do) is not the same
  thing as slot-based amendment, and the difference is normatively loaded, because
  content-addressing makes every rule self-describing and hence re-imports the diagonal.
  So the choice of a rulebook''s data structure is a choice about which self-reference
  paradoxes the legal system has to live with.


