  Thesis sketch (call it "the register view" or "slot semantics"):

  1. Legal systems individuate rules not by content but by address (a number in a
  register, e.g., "Rule 204" in Nomic, "Article V" in the Constitution). Amendment
  is an operation on an address: it replaces the content occupying the slot while
  leaving the slot, and its position in the normative hierarchy, intact.

  2. Therefore apparent self-amendment — Article V amending Article V, or Nomic''s
  rule on rule-changing being changed — is not self-reference in the semantically
  vicious sense: the amending rule refers to its own address, not to its own current
  content. The rule that authorizes the change is the rule occupying the slot at the
  time of the change; the rule it produces is a new occupant. The two never coexist,
  so no contradiction arises: no rule says of itself both "I am valid" and "I am not
  valid."

  3. Consequence: Ross''s paradox depends on treating validity as a property of contents
  transmitted by inference (Suber''s inference model); once validity is a property
  of occupancy of a slot, the puzzle dissolves without needing Hart''s acceptance
  model or Kelsen''s hypothetical basic norm, and without the see-saw device of two
  alternating amendment clauses.

  4. Corollary claims: (a) genuine paradoxes survive where the operation is content-referring
  rather than address-referring, e.g., a rule that entrenches itself by describing
  its own content ("this clause, insofar as it provides X, shall not be amended"),
  self-disentrenchment, and sunset clauses whose repeal conditions describe their
  own text; (b) the register view predicts that constitutional systems will tend to
  evolve toward pure address-based amendment procedures, and that the pathological
  cases cluster where drafters write content-describing entrenchment clauses; (c)
  the view has implications for machine-readable legal code / computational law —
  a rulebook maintained as a versioned registry with content-addressed hashes is not
  the same as slot-based amendment, and that difference is normatively significant.


