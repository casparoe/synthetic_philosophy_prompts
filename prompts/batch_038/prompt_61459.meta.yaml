  Malcolm''s key arguments: (1) The "only criterion" argument: whether someone had
  a dream is determined solely by what they say on waking; there is no independent
  check. (2) Dreams are not "experiences" because one is not aware during the dream
  — awareness would require knowing, but during sleep you don''t know anything; you
  can''t be mistaken about whether you dreamed; the impression on waking is the dream.
  (3) The impossibility of verifying dream duration / of being an observer of one''s
  own dream.


