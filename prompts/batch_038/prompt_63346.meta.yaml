  (D) Rule by whether the delay line is upstream of the \"global broadcast\"/workspace.\n\
  (E) Rule by which account is more parsimonious / avoids positing a Cartesian theater.\n\
  \nNew case design: A case where the intermediate stimulus was never encoded (no\
