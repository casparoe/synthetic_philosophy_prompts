  \ prompt leans on them. To be safe, I could refer to the distinction without naming\
  \ the paper, or I could search to verify. Let me do a quick search to verify \"\
  Time and the observer: the where and when of consciousness in the brain\" Dennett\
  \ & Kinsbourne 1992 Behavioral and Brain Sciences. That's a cheap verification and\
  \ would let me name it correctly. Actually — the prompt doesn't need the citation.\
  \ But naming Dennett & Kinsbourne adds realism. Let me verify quickly.\n\nAlso I\
