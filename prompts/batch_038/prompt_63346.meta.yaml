  \ are empirically equivalent and there's no fact of the matter — consciousness isn't\
  \ a Cartesian theater. Their \"Multiple Drafts Model.\"\n\nKey point in the literature:\
  \ the two hypotheses are empirically indistinguishable if there's no further probe.\
