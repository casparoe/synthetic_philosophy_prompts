  \ fit the data, and the \"stigma\" question — whether there is a fact about when\
  \ the subject experienced the color — has no answer.\n\nThe prompt should be from\
  \ a rationalist-blog reader perspective, casual, with a typo, ask for role assignment,\
  \ think carefully, brainstorm first, and request separation of settled vs contested.\n\
  \nI need to be careful: I shouldn't attribute specific verdicts to a real author\
  \ unless I'm sure. Better: invent a person (\"my PI\", \"a grad student in our lab\"\
  , \"a blogger I follow\"). But the domain knowledge is real — I can reference the\
  \ actual phenomena (color phi, cutaneous rabbit, flash-lag, metacontrast masking)\
