  Desiderata to demand:

  1. Answerability: the standard must make a difference to what a historian does —
  a claim is objective only if there''s something that could count against it. (Otherwise
  "objectivity" is decoration.)

  2. Survives the distinction between the past and the past-as-described: it must
  not smuggle in the assumption that there is a determinate "what happened" that a
  narrative could match, since matching requires selecting a vocabulary — but it must
  also not collapse into "anything goes."

  3. Must distinguish selection from distortion: any account of the past involves
  selection; the standard must explain why some selections are legitimate and some
  aren''t (Carr''s point that facts are chosen, but not arbitrarily).

  4. Must handle the archive''s politics: sources are produced by interested parties,
  often the powerful; a standard that says "stick to the documents" (Ranke) systematically
  favors the record of the perpetrators. So objectivity can''t just be fidelity to
  sources.

  5. Must accommodate revision without making all past accounts equally wrong: when
  a well-supported account is overturned, the standard must explain how the old one
  could have been reasonable — i.e., objectivity as a property of process, not just
  product.

  6. Must be self-applying / not self-undermining: if the claim is "all historical
  narratives are rhetorical constructions," that claim is itself a historical-ish
  claim; the standard must be able to be assessed by itself.

  7. Must preserve the history/fiction distinction in practice (a reader must be able
  to tell a novel from a monograph) — White''s problem: his own account doesn''t give
  resources for distinguishing a truthful narrative from a persuasive one, though
  he wants to condemn Holocaust denial.

