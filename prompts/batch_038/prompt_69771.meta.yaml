  ---


  I am a retired soil chemist — thirty-eight years studying nitrogen cycling in agricultural
  soils, mostly at a state experiment station — and since retiring I have enrolled
  in a continuing-education seminar in the philosophy of science at our local university''s
  lifelong-learning institute. I confess I came to philosophy late and still find
  the vocabulary slippery: I have picked up terms like auxiliary hypothesis and, I
  believe, a protective belt, but I could not confidently say what work they do when
  a real case arrives. Last week our assigned reading was Malthus''s Essay on the
  Principle of Population, and two members of the seminar, Miriam (who teaches secondary-school
  economics) and Geoffrey (a retired newspaper editor with a strong taste for economic
  history), had a sustained argument that the rest of us could not settle. I took
  notes because I wanted to think it over afterwards; the exchange ran roughly as
  follows.


  (1) Miriam opened that Malthus is simply refuted. His claim was that population,
  unchecked, multiplies geometrically while food supply grows only arithmetically,
  so wages and living standards must be driven back to subsistence; instead the world''s
  population has risen roughly eightfold since 1800 and average real incomes with
  it by a much larger multiple. A prediction of that clarity, contradicted by two
  centuries of data, is false, and the only remaining question is how interesting
  a false prediction is.


  (2) Geoffrey replied that this mistakes a failed prediction for a falsified theory.
  What Malthus described was a mechanism — population pressing on the food supply,
  held in check by mortality and by the reluctance to marry without means — and that
  mechanism operated correctly until its conditions were dismantled from outside:
  industrially fixed nitrogen, mechanization, new crop varieties, global grain trade,
  and above all a fall in fertility as incomes rose, which is the opposite of the
  relationship he assumed. He said the honest description is that the domain of applicability
  ended, not that the theory was shown wrong, and he offered the analogy of saying
  Newtonian mechanics was refuted by the precession of Mercury''s orbit.


  (3) Miriam said that is precisely the rescue she was worried about. On Geoffrey''s
  account no outcome could ever have counted against Malthus: had incomes stayed flat
  he would have been vindicated, and since they rose he was merely "right about the
  regime that no longer obtains." She added that the specific escape mechanism is
  worse than an unanticipated condition — Malthus did count moral restraint among
  the checks on population, but insisted it would rarely bind the labouring poor,
  so what actually happened was not that the world supplied new circumstances around
  his theory but that it supplied a check he had written off as practically inert.
  If you may swap the mechanism and keep the name, she said, the statement "Malthus
  was right" stops being a claim about the world.


  (4) Geoffrey answered that he had in mind a narrower and defensible claim: for the
  whole of recorded history up to roughly 1800, population grew while per-capita output
  stayed flat, which is what Malthus predicted and what nobody before him had explained;
  the departure is a two-century exception to a ten-millennium rule. He said being
  right about the default state of the world is not nothing, and that science has
  a recognized category for the situation — Wegener''s continental drift, dismissed
  for want of a mechanism and vindicated later; Mendel ignored for decades and then
  recovered. A theory, he said, can be true of the world''s baseline regime even while
  some historical contingency suspends it.


  (5) Miriam''s last move, which Geoffrey did not answer before we adjourned, was
  that he had now retreated to a claim assembled after the fact. The theory as published
  predicted subsistence-level wages indefinitely; what Geoffrey is defending is that
  same theory plus a proviso — unless something large changes — where the list of
  qualifying somethings is drawn up only once we know what happened, and can always
  be extended one more item (fossil fuels, nitrogen, trade, contraception, and next
  time perhaps fusion or ore from asteroids). She said the reductio of his position
  is that it would equally rehabilitate the resource-exhaustion forecasts of the 1970s
  and every dated peak-oil projection, all of which their authors could defend as
  correct about the underlying geology and merely premature about the date.


  The seminar leader asked us to come back next week with a verdict, and I would like
  yours first. Please act as a philosopher of science who also has a working command
  of economic and demographic history, and think the exchange through carefully before
  writing — in particular, work out for yourself which of the two is at any given
  point making a substantive claim and which is only relabeling, and whether the "right
  but early" formulation has any content that survives Miriam''s fifth move. Do not
  split the difference out of politeness and do not hedge.


  Format: give me exactly five numbered items, one for each of the numbered moves
  above, and nothing else — no introduction, no summary, no closing paragraph. Each
