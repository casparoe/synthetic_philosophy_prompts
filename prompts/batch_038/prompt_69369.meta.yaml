  Additionally, I can ask the model to say which of her precedents is the closest
  analog and what principle the committee would be adopting either way — but that''s
  the recommendation variant. The type says I can pick the prediction variant. Let
  me do the prediction variant primarily ("what will Ruth say, and what''s she actually
  running"), but I can also fold in a small committee element. Better to keep it clean:
  prediction about Ruth''s verdict on the NRP case + which rule she''s running + other
