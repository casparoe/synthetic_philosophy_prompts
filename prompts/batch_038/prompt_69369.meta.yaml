  Maybe I add a second twist case for the model to also weigh? The type examples ask
  for one new case plus the model naming the discriminating case. Keep to one new
  case but a rich one.


  Now, the setup: make it casual, with some irrelevant detail. E.g., the asker is
  a PA student / a hospital chaplain / a philosophy grad student home for the holidays
  whose sister is the ethicist. Add details: they''ve been keeping a notes app of
  her verdicts because they''re writing something / because they argue at Thanksgiving.
  Also mention the asker''s own confusion: they can''t tell whether she''s a "brain
  person" or a "body person."


  Also mention she once described herself as thinking the whole debate is biological,
  not about persons or consciousness — hmm, that''s a giveaway. Better: she refuses
  to say which camp she''s in and gets annoyed when people use the word "person."
  That''s a hint but not decisive.


  Let me also make sure I include the required asks explicitly:

  - predict her verdict on the NRP case (yes/no and how she''d phrase it)

  - state the rule she seems to be running, plus at least two other rules that fit
  all the precedents equally well

  - say which precedent is the closest analog and why

  - give a best guess with reasons

  - name one further case that would tell the rules apart (and ideally a second if
  the first is inconclusive? no, one is fine — maybe "the one case you''d bring her")

  - maybe: note whether her record is genuinely underdetermined or whether some rules
