reasoning_summary: 'Let me pick a domain and type. Domains: definition of death (brain
  death vs circulatory death), why promises bind, Frankfurt cases and PAP, luminosity
  and KK principle, Descartes'' views on animal minds.


  Types: (a) predict verdict on new case from earlier verdicts, (b) satirical piece,
  (c) adjudicate a disagreement.


  I think a good combination: Frankfurt cases and PAP with the "predict a verdict"
  type — a professor''s verdicts on a series of cases (Frankfurt-style, finks, etc.),
  and ask what they''d say about a new case. That''s rich and can be done without
  search. Alternatively, brain death vs circulatory death with the adjudication type
  — two people arguing over a hospital ethics committee case (DCD, warm ischemia time,
  Lazarus sign, etc.). Or promises binding — adjudication.


  Actually, let me consider which combination gives the most "in the weeds" content
  that models can''t regurgitate, but that small models can still handle. Frankfurt
  cases are heavily memorized (Black/White/Jones cases). Brain death criteria are
  memorized too but the specific institutional precedents would be invented. The "predict
  a verdict" type with invented precedent list forces genuine reasoning about candidate
  rules.


  I like: definition of death domain + predict-verdict type. E.g., a hospital ethics
  committee / a philosopher friend who has verdicts about: whole-brain death, higher-brain
  death (persistent vegetative state — she says still alive), locked-in syndrome (alive),
  a patient in irreversible coma with spontaneous respiration, anencephalic newborn
  (she says... ), DC donor after circulatory determination with auto-resuscitation
  window, a brain-dead pregnant woman kept on support (Marlise Muñoz-ish — but that''s
  a real case; better to invent), a cryopreserved head, an embryo, a severed brain
  hemisphere that survives (hemicraniectomy?), a split-brain patient, a brain organoid,
  a person whose brainstem is destroyed but cortex intact with machine support.


  The candidate rules: "death = loss of the capacity for consciousness", "death =
  loss of the integrative unity of the organism as a whole" (the biological/organismic
  standard, per the President''s Council / Bernat), "death = loss of somatic integration
  regardless of consciousness", "death = loss of the capacity to breathe spontaneously
  plus loss of consciousness"? etc. And the divergence case: something like a total
  body-on-a-machine, or a "neo-cortex destroyed but brainstem intact" patient (persistent
  vegetative state) — higher-brain theorists say dead, whole-brain says alive. Or
  a "head transplant / isolated brain maintained artificially" case. Or a donor after
  circulatory death where the heart is transplanted into another and restarted — is
  the donor dead when the heart beats in the recipient? That''s a nice divergence
  case (the "dead donor rule" and the recent heart-transplant-in-infant case where
  the heart was restarted in the recipient — real events but I can describe without
  citations).


  Hmm, careful: I should write so it doesn''t depend on specific real-world facts
  I might get wrong. I could keep it about invented committee precedents.


  Alternatively: Descartes'' views on animal minds + adjudication type: two people
  arguing about whether Descartes thought animals feel pain. That''s real scholarship
  (Cottingham vs. Regan/Gueroult; the "bête-machine"; Descartes'' letters to Newcastle,
  to More). But quoting from memory is forbidden — I''d have to avoid quotation marks.
  Also this risks resting on niche scholarship small models won''t know. Could be
  good but risky.


  Promises binding + adjudication: two friends arguing about whether a promise made
  under duress, or to a dying person, binds. Classic territory: Anscombe, Searle''s
  speech acts, Hume''s convention, Hobbes, Prichard, Raz''s practice theory, Thomson''s
  assurance view, Owens'' authority view. A disagreement about a case: someone promised
  a dying friend to publish her papers a certain way / promised to keep a secret;
  then a new consideration. Two people arguing over whether the promise binds. This
  is quite doable and meaty. The adjudication type wants genuine back-and-forth with
  4-6 moves and a request for move-by-move ratings.


  Frankfurt cases + predict verdict is also strong. Let me weigh: which is most "in
  the weeds" while still accessible? I think the definition-of-death committee precedent
  one is excellent: it forces distinguishing whole-brain vs higher-brain vs circulatory
  criteria and applying them to novel cases like organoids, DCD with heart restart,
  hemispherectomy, locked-in, PVS, anencephaly, ECMO-maintained bodies, and a "brain
  dead pregnant woman carried to term".


  But the type note says: write earlier verdicts jointly consistent with more than
  one plausible rule; choose the new case so at least two rules diverge; ask for prediction,
  rule identification, best guess with reasons, and further discriminating case. Good.


  Let me design it concretely.


  Setup: The asker is on a hospital ethics consult service / or is shadowing their
  sister who''s a transplant committee member. Let''s make it: "My sister is a clinical
  ethicist at a regional hospital, and she also sits on the state organ procurement
  advisory group." Actually let''s make it a person whose verdicts the asker has collected
  through arguments at dinner — casual.


  Her verdicts (invented, internally consistent):


  1. A patient with total, irreversible loss of all brain function including the brainstem,
  on a ventilator, warm body, beating heart, still growing, able to gestate — she
  says dead. (Standard whole-brain.)

  2. A patient in a permanent vegetative state: brainstem intact, breathing spontaneously,
  sleep-wake cycles, no awareness that will ever return — she says alive, and is offended
  by anyone calling her dead.

  3. Locked-in syndrome: fully aware, unable to move or speak, breathes with assistance
  maybe — alive, obviously.

  4. Anencephalic newborn with a functioning brainstem, breathing on its own — she
  says alive (won''t call it dead), but also refuses to call it a candidate for...
  hmm, maybe: she says the infant is alive and that harvesting organs would be killing.
  That''s a strong verdict.

  5. A donor declared dead after cardiac arrest following withdrawal of support, with
  a 5-minute stand-off period, then organs procured — she says the declaration was
  proper/dead.

  6. A body kept "alive" on ECMO after circulatory and respiratory arrest — she says...
  maybe: after circulatory arrest with no autoresuscitation at 5 min, she says dead
  even if ECMO restarts circulation later? Hmm.

  7. A patient whose entire cortex was surgically removed (radical hemispherectomy
  is partial; total is not possible) — let''s use: a child who had a hemispherectomy,
  one hemisphere removed, still conscious — she says alive and a person.

  8. A brain-dead patient maintained on support for 3 months to let a pregnancy come
  to term — she says the fetus can be delivered but insists the mother was dead the
  whole time, and she objects to describing the case as "the mother''s body kept the
  baby alive" ... maybe she objects to press language like "kept alive".

  9. A cerebral organoid / dish-grown brain tissue showing coordinated electrical
  activity — she says it isn''t alive-or-dead at all; she says the category doesn''t
  apply. Interesting: a rule that requires being an organism.

  10. A cryonics patient whose head is vitrified — she says dead (well, they''re already
  declared dead) but she also says "if you thawed it and it worked, you''d have killed
  them"? Hmm, maybe too much.


  New case (the deliverable): A 30-something trauma patient whose whole cerebrum and
  cerebellum have been destroyed/removed but whose brainstem is intact and functioning:
  breathing spontaneously, maintaining temperature and blood pressure without support,
  sleep-wake cycles, hormonal regulation, but permanently incapable of any awareness
  — call it a "brainstem-only" patient after a surgical removal of everything above
  the midbrain (or a devastating injury). Hmm, that''s basically PVS, which she already
  ruled alive (verdict 2). Not discriminating enough — well, actually it IS discriminating
  for the higher-brain rule but she already ruled PVS alive, so the higher-brain rule
  is already refuted. Let''s instead pick a case that discriminates between "loss
  of the capacity for consciousness" vs "loss of integrative unity of the organism"
  vs "loss of spontaneous respiration + circulatory function."


  Better new case: a patient whose brainstem is irreversibly destroyed (no spontaneous
  breathing, no cranial reflexes) but whose cortex is intact and demonstrably active
  on EEG — a "high spinal + brainstem stroke" scenario where the cortex is perfused
  by machines and the patient is presumably aware but permanently dependent. She has
  to say whether this patient is dead. Under whole-brain (integrative unity / loss
  of the brain''s function as a whole? Actually whole-brain criterion = irreversible
  loss of all functions of the entire brain, including brainstem) — hmm, the standard
  whole-brain formulation requires loss of function of the entire brain, so a functioning
  cortex means not whole-brain dead. Under a "loss of the capacity for consciousness"
  rule — the cortex is intact so consciousness possible → alive. Under "loss of somatic
  integration" — the body is integrated only by machines → maybe dead. Hmm, this case
  might not discriminate strongly either, since both major rules say alive.


  Let''s pick something that discriminates between:

  Rule A: death = irreversible loss of the capacity for consciousness (higher-brain).

  Rule B: death = irreversible loss of the work of the brain as an integrated whole
  / loss of the organism''s self-maintaining unity (whole-brain, biological).

  Rule C: death = irreversible cessation of spontaneous respiration and circulation
  (circulatory/cardiopulmonary).

  Rule D: something like "death = loss of the capacity to interact/engage with the
  world" or a personhood/social rule.

  Rule E: "death = whatever the law says" / conventionalism — she defers to legal
  criteria.


  Her existing verdicts: (1) whole-brain dead on vent → dead: consistent with B, C
  (irreversible cessation of spontaneous respiration, since brainstem gone → apnea;
  also circulation sustained only by machine), and with A. (2) PVS → alive: rules
  out A! Because A says higher-brain death = death, PVS is permanently unconscious
  → A says dead. She says alive. So A is out already. Hmm, so I want her verdicts
  to be jointly consistent with more than one rule — so I shouldn''t rule out A with
  the PVS verdict. Let me reconsider: maybe she says PVS patients are "alive but I
  wouldn''t call them persons" — that keeps A ambiguous. Or use a different discriminator.


  Let''s restructure: choose verdicts consistent with B, C, and a machine-dependence
  rule F ("death = when the body can no longer maintain itself without artificial
  replacement of what the brain used to do"?). Hmm.


  Actually the classic ambiguity: whole-brain death verdicts are consistent with (i)
  loss of consciousness capacity, (ii) loss of integrative unity, (iii) loss of the
  brain''s role as the body''s central regulator. And the PVS verdict "alive" rules
  out (i). Unless the asker notes "she hesitated" or says something like: she calls
  PVS patients "alive but she also says she wouldn''t object to their organs being
  taken if..." Hmm, that''s a possible hedge: her verdict on PVS is "alive" but she
  also says "I''m not fully comfortable; my reason is that the body is still doing
  its own work."


  Alternatively, use a case where she says "alive but not a person" — then the candidate
  rules are: organismic unity vs. brainstem-driven self-maintenance vs. legal criteria,
  and higher-brain is excluded. Then the new case should discriminate among the remaining
  rules.


  New case candidates that discriminate between "loss of the brain''s integrative
  work on the body" (B) and "irreversible cessation of circulation and respiration"
  (C) and "total dependence on machines for somatic integration" (F):


  - A DCD (donation after circulatory death) case: circulation and breathing have
  irreversibly stopped for 5 minutes after withdrawal of life support; the patient
  is not brain-dead (brainstem still would function if circulation returned). Then
  organs are procured; and in one variant, the heart is removed and transplanted into
  a recipient where it restarts and beats for decades. C says dead at 5 minutes. B
  says: at the moment of circulatory arrest, the organism as a whole loses integration
  → dead. Actually both say dead. Hmm. But a variant: what if after the 5-minute stand-off,
  circulation spontaneously resumes (autoresuscitation)? She would say not dead. Not
  discriminating.


  - Better new case: a patient with a devastating injury where the brainstem is destroyed
  but a machine (a next-gen "artificial brainstem" / neuroprosthetic controller) now
  performs all the regulatory work the brainstem used to: drives the diaphragm, regulates
  blood pressure, temperature, hormone release via a pump, etc. The body is integrated,
  self-maintaining, warm, healing wounds, fighting infection — but every bit of that
  integration is orchestrated by an external device. The cortex is also destroyed.
  Under B (loss of integrative unity of the organism), the organism is arguably still
  unified, though by an external surrogate — so is the unity "the organism''s own"?
  Under a "the brain is the necessary integrator" reading of B, the patient is dead.
  Under C, respiration and circulation are being maintained (mechanically) so C''s
  literal reading — cessation of circulatory and respiratory functions — would say
  not dead, or says "spontaneous" respiration → dead. Under A (consciousness), dead.
  Under F (irreversible dependence), dead. Nice: this case discriminates B-organismic
  vs B-brain-specific, and C.


  That''s a good new case, but maybe a bit sci-fi. Actually it''s realistic-ish (phrenic
  nerve pacing, ECMO, hypothalamic-pituitary replacement). Fine. The prompt can note
  that a version of this actually happens with high spinal cord injury + ventilator
  + total pituitary replacement.


  Alternatively, an even better new case for discrimination: a brain-dead patient
  maintained on full support who, over 10 months, continues to grow, heal wounds,
  fight infection, maintain temperature, and (in the case of a pregnant patient) gestates
  a fetus to viability — and then the machine is turned off. Is she dead now, or did
  she die when the machine was turned off? Hmm, this is the classic "the body is still
  doing somatic work" objection (used by people like D. Alan Shewmon — careful, that''s
  a real person and real view; I shouldn''t misattribute. I could avoid naming him).


  Let me think about what makes the strongest prompt. The type requires: prediction
  about a specified new case + identification of the rule(s) + best guess with reasons
  + a further discriminating case. And the additional instructions: 1-3 paragraphs,
  casual, some irrelevant detail, maybe a typo or two.


  I could also fold in an element: the asker needs this because the committee is voting
  next week on a policy (e.g., whether to allow DCD with in-situ extracorporeal preservation
  — NRP, normothermic regional perfusion — which restarts circulation in the donor''s
  body after the declaration; some ethicists argue this violates the dead donor rule).
  That''s a real controversy, and it''s genuinely "in the weeds." I can describe it
  generically without naming cases. The new case: their hospital is considering adopting
  "abdominal NRP" — after declaring death by circulatory criteria and a 5-minute stand-off,
  they cannulate and restart blood flow to the abdominal organs (with the aorta clamped
  above so no brain perfusion) for 30-60 min to improve organ quality, then procure.
  Is the donor still dead? Under C (irreversible cessation of circulation) — circulation
  has been restored, so either the cessation wasn''t irreversible (self-contradiction)
  or death happened and then circulation restarted; under B (loss of integrative unity)
  — the restoration is regional and the brain is excluded, so unity is still gone;
  under a "no brain perfusion" rule — dead. This is a great discriminating case and
  it''s a live, real controversy. And her past verdicts can be arranged so that multiple
  rules fit them all.


  Hmm — but do I want two new cases? The type says: predict the verdict on a specified
  new case, and name a further case that would tell the rules apart. So one main new
  case (asker-specified) + model proposes the discriminating case. Good: main new
  case = NRP-style DCD protocol adoption. Or main new case = the artificial brainstem.
  I think NRP is more concrete, more real-world relevant, and lets me bring in her
  other precedents.


  Wait — but is NRP "niche facts LLMs won''t have memorized"? It''s a real thing (normothermic
  regional perfusion, DCD, thoracoabdominal vs abdominal NRP, the clamping of the
  aortic arch to prevent cerebral perfusion). Models do know about DCD and the dead
  donor rule and probably NRP. Since I''m describing it in the prompt itself, the
  model doesn''t need to recall it. Good — injecting niche content into the prompt
  satisfies the user''s requirement.


  Now let me draft her precedents, ensuring they''re consistent with several rules
  and that the new case discriminates.


  Sister''s (call her "my sister Ruth, a clinical ethicist") verdicts:


  1. Whole-brain death: 40-year-old with catastrophic hemorrhage, no brainstem reflexes,
  apnea test positive, on a ventilator, body warm, heart beating, kidneys working,
  wound healing. She says: dead, no hedging, and she gets irritated when families
  say "he''s fighting."


  2. A patient whose breathing and heartbeat are maintained only by a ventilator and
  pacing after a high cervical spine injury, with a fully intact and awake brain —
  she says obviously alive (even though every spontaneous breath is machine-driven).
  Good: this kills a naive version of C (cessation of spontaneous respiration → death)
  and shows she cares about the brain, not about machine dependence.


  Hmm — careful. Verdict 2 (high spinal, ventilator-dependent, awake) vs verdict 1
  (brain dead on vent). Both are ventilator dependent; she says alive vs dead. That
  points to brain-based rules. Fine, and it''s realistic.


  3. Permanent vegetative state: she says alive, and specifically alive as an organism
  — "her body is still running itself" — but she also says the patient is no longer
  a person and she''d support withdrawing everything. This is consistent with B (organismic
  unity), inconsistent with A (higher-brain). But her stated reason points at B. Maybe
  better to leave her reason vague so A stays live? The type asks for the model to
  identify candidate rules; it''s okay if one is clearly excluded — but the instructions
  say the verdicts should be jointly consistent with more than one plausible rule.
  Two or more remain (B, brainstem-specific, legal-conventionalist). Fine. Actually,
  maybe I should keep the PVS verdict but not give her reason, or give a reason that''s
  compatible with both B and something else. Let''s do: she says the PVS patient is
  alive but adds "I''m not going to pretend I can explain exactly why to a family."
  That keeps ambiguity and is a nice casual touch. Hmm, but then the asker''s list
  is muddier. I think a bit of hedging is realistic and helps underdetermination.


  4. Anencephalic newborn: brainstem present, breathes on its own, will never be aware,
  dies within days/weeks. She says alive — and refuses to let the infant be treated
  as an organ source before it dies, even though the parents begged. Consistent with
  B and brainstem-based rules; inconsistent with A (higher-brain) again. Also inconsistent
  with a rule "death = loss of capacity for interaction."


  5. DCD after withdrawal of support with a 5-minute hands-off period: she signed
  off on the declaration as proper. Consistent with C and with B (organism loses integration
  when circulation stops) — and note she also says the key word is "irreversible,"
  meaning "we''re not going to restart it," not "cannot be restarted." That''s the
  "irreversible vs permanent" distinction — a real, in-the-weeds point. This sets
  up the NRP case: if "irreversible" means "will not be restored," then NRP (restoring
  circulation) looks like a contradiction — unless she means something narrower.


  Hmm, careful about what I put in her mouth regarding irreversibility, since it may
  over-determine the answer. Better: don''t have her say it; let the model discover
  it as an ambiguity. Actually a good prompt lets the model do the work. I''ll drop
  that gloss but maybe mention she''s "big on the word irreversible" without explaining
  it. Or leave out entirely. Let me include one line: she once said in a meeting that
  she thinks a lot of arguments about this are really about one word in the criteria,
  but wouldn''t say which. That''s a teasing hint, fine, maybe too cute. Skip.


  6. A case where autoresuscitation happened — circulation returned spontaneously
  ~90 seconds after asystole during a DCD attempt; the procurement was aborted; she
  said "good, he was never dead" — meaning she thinks the 5-minute window is not arbitrary
  but she also thinks the criterion is about the brain? Hmm, in real DCD, autoresuscitation
  is why the 5-min wait exists. Her verdict: he wasn''t dead → she treats circulatory
  arrest as sufficient for death when it doesn''t reverse. Consistent with C, and
  with B.


  Actually maybe include a case that puts pressure on B: a brain-dead pregnant woman
  maintained for weeks, delivering a healthy baby; she insisted the mother was dead
  throughout and objected to a newspaper headline that said "her body kept the baby
  alive." Hmm — that would be a verdict supporting "dead despite ongoing somatic work"
  (anti-Shewmon). This is consistent with the brain-based rule but inconsistent with
  a pure "organismic integration" reading of B (since the body was doing impressive
  integrative work). That''s a nice pressure point: it suggests her real rule is "the
  brain (specifically the brainstem/whole brain) is the integrator; without it the
  unity is a machine''s doing, not the body''s" — i.e., the standard whole-brain rationale.
  And then in the NRP case: the body''s organs are being perfused by a machine with
  the brain deliberately excluded → is that like the pregnant woman (dead, because
  the machine is doing the integrating) or like the ventilator-dependent quadriplegic
  (alive)? Actually NRP discriminates B from C: under C, "circulation has ceased irreversibly"
  — but NRP restarts circulation. So a pure cardiopulmonary criterion seems self-undermining;
  a brain-based criterion says fine as long as the brain isn''t perfused. But then
  someone will say: her reason for the 5-minute stand-off can''t be the brain, because
  at 5 minutes the brain isn''t yet irreversibly destroyed (it''s the ischemia window)...
  Actually at 5 min of normothermic ischemia the brain isn''t irreversibly dead yet
  — that''s the standard objection to DCD (the "brain isn''t dead at declaration"
  problem). Hmm, this is deep in the weeds — good, but maybe I''m overcomplicating.


  Let me settle: the new case = the hospital wants to adopt abdominal NRP for DCD
  donors. The committee must decide whether the declaration of death remains valid,
  i.e., whether the donor is still dead while a pump circulates warm oxygenated blood
  through his abdominal organs for 45 minutes after the 5-minute stand-off, with the
