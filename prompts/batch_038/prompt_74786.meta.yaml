  Draft:


  ---


  I am auditing a philosophy-of-biology seminar, and last week the discussion of a
  paper on the evolution of a signaling trait was derailed by a visiting student who
  said, roughly, that the whole explanatory strategy was empty because "survival of
  the fittest" is a tautology: whatever happens, the organisms that happened to leave
  the most offspring were, by definition, the fittest, so the theory cannot be wrong.
  When I objected that fitness is estimated independently from morphology, physiology,
  and environment before the reproductive outcome is known, he said that this just
  shows the interesting content lives in the auxiliary estimates, not in the selection
  principle itself, and he added that Popper had made exactly this charge against
  Darwinism and later withdrew it — which he took to show that even Popper could not
  get the claim straight.


  I would like a precise inventory rather than a defense or a rebuttal. Please lay
  out, as a numbered menu, the distinct theses that this one slogan can be used to
  assert, ordered roughly from the trivial to the radical. Candidate axes to consider,
  though you should add any I have missed: whether "fittest" is being read as defined
  by actual reproductive output or as an independently characterized dispositional
  property; whether the target of the charge is the bare sentence or the whole theoretical
  structure (variation, heritability, differential reproduction, plus the population-level
  mathematics); whether the complaint is about analyticity, about falsifiability,
  about the absence of genuine laws, or about explanatory circularity in particular
  applications; and whether it concerns the theory in general or a certain style of
  after-the-fact adaptationist storytelling.


  For each thesis on your menu, tell me: what it says exactly, whether it is true,
  whether it would matter if it were true, and — the point that interests me most
  — whether it would license the dismissal in my seminar, i.e. whether it would show
  that the paper''s account of that trait explains nothing. Where two theses are routinely
  run together under the same sentence, say which pairing is doing the damage.


  Then address the Popper episode as best you can without being able to look anything
  up. In particular: which of my candidate charges is a charge that his own demarcation
  criterion would even register, given that a statement can be analytic and yet sit
  inside an empirically testable framework; and whether the claim that he both asserted
  and retracted the tautology charge is something you are confident about, something
  you are unsure of, or something you think I have garbled. I have no library access,
  so please mark the confidence level of anything historical rather than filling in
  details you cannot stand behind. No bibliography, no reading list, and no invented
  quotations — analysis only.


