  I direct the standards and appeals function of a housing regulator in a mid-sized
  jurisdiction. [Fictional but plausible.] We administer a statutory test that requires
  an inspector to declare a dwelling "unfit for human habitation" where specified
  defects (damp and mould, structural movement, cold, electrical condition, overcrowding)
  are present to a degree the statute describes only as "serious" or "posing an unacceptable
  risk to the health of the occupants." The statute supplies no numeric thresholds
  and expressly leaves the determination to the judgment of the officer.


  We make roughly 240 determinations a month across eleven field offices. Each one
  has two possible outcomes and both are costly: a finding of unfitness issues an
  enforcement notice against the owner, who may be obliged to spend well beyond the
  rent roll, and roughly one in six is contested on appeal; a finding of fitness leaves
  a household — often with children, often with a member who is ill — in a home the
  inspector privately believes is harming them. Inspectors are building surveyors
  and environmental health officers, not lawyers and not philosophers. Each determination
  gets a 40-minute site visit or a 20-minute desk review; a finding of unfitness requires
  a second signature from a duty officer who was not present; the reasons we write
  are the only thing the appeal tribunal sees, and two recent appeals were lost because
  our reasoning was held to be unreasoned — the tribunal found we had applied an unwritten
  numeric practice that we could not articulate or justify.


  Here is the difficulty I want your help with. Auditing our borderline cases, I have
  found that my inspectors are not disagreeing about the facts; they are disagreeing
  about what kind of question they have been asked, and the disagreement tracks a
  philosophical divide almost exactly. One group behaves as though there is a determinate
  answer in every case — a precise point in the ordering of dwellings at which "unfit"
  becomes true — which we cannot locate but which better measurement, better argument,
  or a more experienced colleague might get us closer to. They resist publishing numeric
  thresholds on the grounds that any line we publish is probably false, and they think
  that when we reverse an old decision we are correcting an error. The second group
  behaves as though the statute leaves the borderline cases genuinely undetermined,
  so that our task in those cases is to choose a sharpening of the standard and apply
  it consistently; they want thresholds published, applied prospectively, and treated
  as our rule rather than as a discovery, and they think reversing an old decision
  changes the rule rather than correcting a mistake. Both groups insist they are following
  the same statute. The two practices produce different reasons-language, different
  attitudes to consistency, different handling of precedent inside the organisation,
  and different behaviour on appeal — and neither group can say why the other is wrong.


  What I need is not a comparative essay on vagueness. I need a single determination
  protocol that this organisation can adopt and that an inspector with no philosophical
  training can run, which is built on an explicit account of what actually follows
  from each of the two positions and which parts of the protocol depend on which.


