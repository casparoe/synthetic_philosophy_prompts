  Forty years in a lab (analytical chem, mostly trace metals) and now that I''m retired
  I''ve been reading philosophy like a man catching up on the news. Currently working
  through a popular history of ideas book — you know the kind, big claims, no footnotes
  — and it has a chapter on Indian logic that I''d like a second pair of eyes on before
  I let it rewrite my intuitions. Here''s the gist, in the book''s own phrasing as
  near as I can reproduce it:


  "Two thousand years ago, Indian logicians had already worked out most of the philosophy
  of science. The Nyāya school held that knowledge comes through four channels, which
  they called pramanas: perception, inference, comparison, and testimony. Perception
  is the foundation — it''s defined as a cognition produced by the contact of a sense
  organ with its object, provided it isn''t mistaken and is definite rather than vague
  — and because the definition builds in truth, perception cannot go wrong, which
  makes Nyāya a form of direct realism and puts them on the side of common sense against
  the sceptics. Inference is the syllogism, only better: instead of three lines they
  use five, and one of the five is the requirement that you produce a familiar example
  where the connection is known to hold, which is what a referee means when they ask
  to see your raw data. At the heart of it is vyapti, an invariable connection between
  the sign and what''s signified — smoke and fire — and the Naiyayikas said you establish
  it by repeated observation together with attention to negative cases. That is Mill''s
  method of agreement and difference, arrived at eighteen centuries early, which means
  they had induction without Hume''s problem. The boldest move is testimony: they
  counted another person''s word as a genuine source of knowledge in its own right,
  on the grounds that you cannot personally verify everything, and that the word of
  a trustworthy person gives you knowledge you could not otherwise have. That is a
  philosophical justification of scientific authority, of peer review and of citation,
  long before anyone had a journal to peer-review. And unlike the Greeks, who mostly
  ended up doubting everything, all the schools of Indian philosophy accepted these
  four channels and merely argued about how to apply them."


  Two things bug me and I can''t tell whether they''re bugging me for good reasons.
  First, I spent my career trusting instruments I knew perfectly well could be wrong
  — a "non-erroneous" definition of perception sounds to me like it''s defining the
  problem away rather than solving it, but maybe I''m importing a lab habit that doesn''t
  travel. Second, the testimony paragraph is the one I''m most inclined to sign, because
  I''ve cited other people''s numbers for things I could never have measured myself.
  But something about "trustworthy person" doing all the work in that sentence feels
  too small to carry the weight of peer review, where the whole point is that nobody''s
  trustworthiness is assumed.


  So: how much of this is right? Go through it and tell me what a scholar of Nyāya
  would nod at, what they''d call a fair simplification, and what they''d say is just
  wrong — and whether the book''s conclusions (that they solved the problem of induction,
  that they anticipated Mill, that they justify scientific authority, that everyone
  in India accepted the four pramanas) survive once you fix the details. Don''t pad
  it with bibliography, I have no way to check any of it and my library card mostly
  gets me murder mysteries.


  And at the end, tell me where you''re least sure of yourself: which of your corrections
  would you retract if someone showed you X, i.e. what would change your mind here,
  and which of these judgments rests on a contested reading of the tradition rather
  than on anything settled. If you think the book is broadly fair and I''m the one
