  Let me think about a Type A prompt with an interesting practice: "Registered Reports"
  at journals — stage 1 acceptance before results. What does that presuppose? It presupposes
  that the evidential value of a result depends on facts about the researchers'' intentions/timeline
  before seeing data — i.e., it presupposes something about the stopping rule / the
  design. And it treats a null result from a preregistered study as publishable, which
  presupposes that publication value tracks informativeness, not truth. Meanwhile
  the same journals also publish "exploratory" studies... Hmm, that''s decent.


  Another Type A: the practice in psychology of requiring "p < .05" AND simultaneously
  requiring that a finding be "novel" / "surprising" — what does that presuppose?
  Also the practice of "significance testing with a fixed alpha of .05 regardless
  of the prior plausibility of the hypothesis" — e.g., a journal applies the same
  threshold to a claim about a well-established drug effect and to a claim about precognition.
  What view of evidence does that presuppose? It presupposes that the evidential standard
  is invariant to prior odds — i.e., a kind of "evidence is in the data alone" view;
  and it quietly assumes the null is true or that error rates are the only thing that
  matters. And it''s inconsistent with the same journal''s practice of... hmm.


  Actually, a great concrete pairing: journals require p<.05 for "positive" claims
  but accept "absence of evidence" claims (null results) without requiring a power
  analysis or an equivalence bound. So: the asymmetry between affirming an effect
  at p<.05 and affirming no effect on the basis of p>.05 — and the fact that the same
  journals will publish "we found no evidence for X" without asking for a Bayesian
  analysis or an equivalence/TOST test. What does that presuppose? It presupposes
  that the null can be "accepted" from a non-significant result without any bound
  on the effect size — which is inconsistent with the strict Neyman-Pearson reading
  where a non-significant result licenses no conclusion at all, and inconsistent with
  the Fisherian reading where p is a continuous measure. And under the same logic,
  a positive claim at p=.049 shouldn''t be treated as establishing an effect either.
  This is a good in-the-weeds practice-based prompt. It''s fairly well-trodden though
  ("absence of evidence is not evidence of absence").


