reasoning_summary: 'Let me pick a domain and type combination.


  Domains: Davidson''s radical interpretation, Zhuangzi''s butterfly dream, white
  horse dialogue / School of Names, compromise between value systems (gains from trade
  through moral compromise), frequentist vs Bayesian statistics and replication crisis.


  Types: (A) what philosophical commitments a practice/policy/institution presupposes;
  (B) report verdicts on cases and ask what principle captures them; (C) state commitments
  and ask whether they hang together.


  Best combination: I think "frequentist vs Bayesian statistics and the replication
  crisis" with type A (what commitments a practice presupposes) is very good — e.g.,
  preregistration, or the practice of journals demanding p<0.05 but also demanding
  "novel" findings; or the ASA''s 2019 statement moving away from significance testing
  while journals still require it; or the practice of "preregistration" itself.


  Alternatively, "compromise between value systems: gains from trade through moral
  compromise" with type A — e.g., legislative logrolling, or the practice of compromise
  committees. Hmm, but that domain is more niche (moral compromise, "gains from trade"
  comes from a specific paper — I think by... there''s a paper "Moral Compromise and...".
  Actually there''s a known idea from the rationalist community / a paper on "gains
  from trade" in moral compromise. Let me be careful.)


  Type A with frequentist/Bayesian: a concrete, well-known practice — e.g., the requirement
  in clinical trials of a pre-specified primary endpoint and a fixed sample size with
  alpha = 0.05, while simultaneously researchers are allowed to run interim analyses
  with alpha-spending. Or the practice of "data monitoring committees" stopping trials
  early for benefit. Or the fact that journals require p-values but also require effect
  sizes and confidence intervals. Or the practice of "preregistration" plus "exploratory
  analysis allowed with disclosure."


  Another good one: The practice of reporting confidence intervals but interpreting
  them as if they were credible intervals — what does that presuppose? That''s a well-known
  point, maybe too regurgitated.


  Better: pick something like the NIH/journal practice of requiring a "statistical
  analysis plan" with a fixed alpha, but then also demanding that authors provide
  a "post-hoc power analysis." Or the practice of the FDA requiring two independent
  positive trials (replication requirement) rather than one very large trial — what
  does that presuppose about evidence? That''s interesting: the FDA''s "two adequate
  and well-controlled investigations" requirement is a genuine rule (statutory). It
  presupposes something about the nature of confirmation: that replication is not
  just more data but an independent check on a different source of error; it''s inconsistent
  with the likelihood principle (two trials pooled give the same likelihood as one
  big trial with the same total data, roughly). That''s a nice, meaty, in-the-weeds
  prompt.


  Actually — there''s an even better angle: the two-trial requirement vs. the fact
  that pooling data from two trials into one big trial with the same total N is treated
  as *more* convincing... no wait, actually statistically it''s the opposite: pooling
  is more convincing in terms of likelihood, but the FDA wants replication. Hmm, but
  the two-trial requirement also allows a single trial when it''s overwhelming. Anyway.


  Another option: the practice of "one-sided vs two-sided tests" — alpha 0.05 two-sided
  but 0.10 two-sided for non-inferiority... meh.


  Let me also consider type B with frequentist/Bayesian: report verdicts about which
  results "count as evidence" — e.g., optional stopping, the "lady tasting tea" reversed
  design, Lindley''s paradox cases, p-hacking, etc. That''s quite standard though
  (Fisher''s tea-tasting design: fixed N vs fixed successes — the famous point that
  frequentist inference depends on the stopping rule). That''s well-known in pretraining.


  Type C with frequentist/Bayesian: list commitments: (a) I think the likelihood principle
  is right, (b) I think stopping rules matter and peeking at data invalidates a p-value,
  (c) I think priors shouldn''t influence inference, (d) I want error control in the
  long run... That has genuine tensions: (a) and (b) are directly in conflict (the
  likelihood principle implies stopping rules are irrelevant); (a) and (c) conflict
  too. Actually the classic: likelihood principle entails that optional stopping doesn''t
  matter, but also entails something about priors? No. Hmm, Birnbaum''s argument:
  sufficiency + conditionality → likelihood principle. The LP conflicts with frequentist
  error-statistical practice (Mayo''s critique). So commitments (a) LP, (b) stopping
  rules matter, (c) severe testing / error control is the point of inference, (d)
  I think Bayesian priors are arbitrary and shouldn''t be used — that''s a rich tension
  set: (a)+(b) conflict, (a)+(c) conflict (Mayo''s argument that LP is incompatible
  with error probabilities), (b)+(c) cohere, (c)+(d) cohere... plus an apparent tension:
  (a) and (d)? LP is Bayesian-flavored but doesn''t require priors. Actually the apparent
  tension that dissolves: "I accept the likelihood principle" and "I refuse to use
  priors" look in tension because LP is usually advertised as the Bayesian foundation,
  but you can accept LP without priors (e.g., likelihoodism, Hacking''s support intervals,
  Royall''s evidence interpretation). That''s a great "apparent tension that dissolves
  on inspection."


  So Type C with the frequentist/Bayesian domain works nicely and is genuinely in
  the weeds without requiring citations. But the domain also says "replication crisis"
  — could include a commitment about preregistration or about "the replication crisis
  shows NHST is broken."


  Hmm, but which is better? Type A is also strong. Let me think about the instructions:
