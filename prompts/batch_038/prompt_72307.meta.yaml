  Draft:


  ---


  I am a third-year doctoral student in political philosophy, and I am drafting the
  central chapter of a seminar paper on governance by prediction markets. I have now
  worked through the canonical case for futarchy — the idea that a polity should vote
  on values but bet on beliefs, so that a policy is adopted just in case a conditional
  market says it maximizes some agreed metric — and through the standard battery of
  objections: thin markets, manipulation by deep-pocketed traders, the impossibility
  of fixing a neutral welfare metric, and the complaint that the scheme simply relocates
  the boundary problem to the question of which asset to list. My difficulty is that
  these objections are all things the proposal''s defenders have already anticipated,
  and each can be met by better mechanism design, so a chapter built on them reads
  like a checklist rather than an argument. I would like to try something narrower
  and, I hope, harder to brush aside.


  Here is the thesis I want you to argue for, and I want it argued properly rather
  than gestured at. Assume, for the sake of the argument, an idealized design that
  removes the usual implementation complaints: for each candidate policy, the state
  issues two conditional securities, one paying off on the target metric if the policy
  is adopted and one paying off on the same metric if it is not; the adoption rule
  is automatic and price-triggered, with no official discretion whatsoever; all officeholders,
  candidates, and their immediate families are barred from trading; and the metric
  itself is fixed constitutionally, so that the "who chooses the welfare function"
  objection is stipulated away. My claim is that even under these conditions futarchy
  has a real but sharply bounded comparative advantage — it does best on decisions
  that are recurrent, quickly resolving, of moderate stakes, and whose announcement
  does not itself alter what is being forecast — and that this class is very nearly
  coextensive with the class of decisions on which ordinary democratic and administrative
  procedure is already adequate. If that is right, the interesting thesis, that futarchy
  could replace democratic decision-making wholesale, is false, while the modest thesis,
  that futarchic mechanisms should be embedded inside a democratic state for a bounded
  set of questions, survives.


  Please take on the role of someone who works at the intersection of social epistemology
  and mechanism design and who is skeptical but fair. Think carefully before writing:
  begin with a short outline identifying the load-bearing premises and the order in
  which you will deploy them, then write the argument out. I want the reasoning to
  proceed by mechanism, not by enumeration — spell out why liquidity, price informativeness,
  and the return on manipulation each vary systematically with the resolution horizon
  and the stakes of the underlying decision, and why reflexivity (the fact that publishing
  a price-triggered decision rule lets traders move the decision by moving the price,
  and lets expectations about a policy change the policy''s consequences) is a structural
  feature of the design rather than an engineering defect. Make at least one substantial
  concession to the futarchist — markets do aggregate dispersed information in ways
  votes cannot, and forecasting tournaments and event markets have an impressive track
  record — and then explain why the concession does not restore the general thesis.
  Confront the most awkward counterexample head-on: election and geopolitical markets
