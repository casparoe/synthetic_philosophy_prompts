  will have to hear the view pressed. Her position, in her own framing:


  - The standard pessimistic meta-induction is aimed at the wrong object. Laudan''s
  list and its descendants are lists of *theories* — caloric, phlogiston, the luminiferous
  ether, etc. — and the realist has a well-worn answer: the parts of those theories
  that did the explanatory work survive in successors, so what dies is only the ontological
  surplus. She concedes that answer, at least provisionally.

  - Instead, she runs the induction over *methods*: over the procedures, standards
  of evidence, and inferential licenses by which a research tradition judges itself
  to be doing well. Her claim is that the historical record shows repeatedly that
  methods which were, by the standards internal to their own tradition, spectacularly
  successful — and were praised for exactly that success — have been abandoned not
  because they were applied badly but because the standards they embodied were themselves
  wrong. Her slogan for this is "methodological pessimism": our current methods are,
  with high probability, methods that our successors will regard as having been unreliable
  in precisely the domains where they now look most reliable.

  - She holds that this version is immune to two familiar realist replies, and this
  is the interesting part. First, it is immune to preservative/structural realism,
  because structural realists claim continuity in *content*, and she is not claiming
  anything about content: her pessimism is about the trustworthiness of the inference
  licenses themselves, which are not the kind of thing that gets preserved in a successor
  theory. Second, she argues that it turns the "no miracles" argument back on the
  realist: that argument is an inference to the best explanation, and IBE is one of
  the methods on her list — so the realist''s central argument inherits exactly the
  doubt her induction raises.


  Her book has drawn three kinds of criticism I want to press in the interview: (i)
  that methodological pessimism is self-undermining, since it is itself an inductive
  extrapolation from a historical sample, and she cannot both distrust inductive extrapolation
  from a sample of scientific success and rely on it for her own premise; (ii) that
  her historical cases are selected to fit, and that no neutral criterion determines
  which abandoned procedures count as "methods that were successful by their own lights"
  rather than as badly executed or fringe programs; and (iii) that even granting her
  premise, it does not reach realism, because a realist can accept that our methods
  will be revised while maintaining that current methods are at least approximately
  truth-conducive — indeed that method change has itself been reliably progressive,
  on any non-question-begging measure of progress.


