  I took early retirement in 2019 after thirty-four years in marine stratigraphy —
  mostly describing Quaternary cores from the North Atlantic and teaching undergraduates
  how a boundary gets fixed. Since then I have been auditing seminars in the philosophy
  department at the university where I still hold a library card, and I have developed
  an appetite for the literature on scientific classification, natural kinds, and
  the extent to which our categories carve nature at its joints.


  Last month one of the doctoral students in the group circulated a chapter draft
  in which he argued that the Anthropocene controversy is a rerun of the Pluto controversy.
  His gloss, roughly: everyone agreed on the observations in both cases; the quarrel
  in each was about the extension of a word; each was settled not by discovery but
  by a vote of an international body (the International Astronomical Union''s 2006
  resolution, the Anthropocene Working Group''s rejection of the proposed mid-twentieth-century
  marker in March 2024); and in each case a new category was invented to accommodate
  the dissenters — "dwarf planet," and now the suggestion by some of the defeated
  proponents that we recognize an Anthropocene "event" rather than an epoch. From
  this he draws two conclusions. First, that the fact of humanity''s planetary impact
  is as settled as the fact that Pluto is round, and that the fifteen years of stratigraphic
  procedure was pedantry of no epistemic interest. Second, and more consequentially
  for his chapter, that since the choice of boundary is definitional, historians,
  geographers and the public may date the onset as they please — with agriculture,
  with 1610, with the steam engine — without being in conflict with geology at all,
  because no committee''s ruling carries more weight than any other convention.


