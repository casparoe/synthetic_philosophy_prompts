  bear on his two conclusions from the ones that are merely picturesque. In particular
  I would like to know whether the analogy quietly assumes that both cases involve
  sorting objects that are all present at once, and what follows if the geological
  case instead concerns a chronology whose boundaries must be physically preserved
  in an archive and correlated across the globe. Address the obvious retort — that
  the Pluto vote was itself widely regarded as procedurally botched, with only a few
  hundred of the Union''s members voting, so he is comparing two political processes
  and not a political process to a scientific one.


