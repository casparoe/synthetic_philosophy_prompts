  cascade can be shattered by a small amount of contrary public information even though
  the underlying state hasn''t changed. A designed case: a cascade is overturned by
  public info that is *less* informative than what the crowd already aggregated. That''s
  a nice specification: "Design a sequence of decisions where the public signal that
  breaks the cascade is strictly weaker than the private evidence the cascade has
  already discarded, and show that this is rational for each agent."


