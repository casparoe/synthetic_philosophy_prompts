  same climate and the same foraging baseline. Valley A adopts a cereal package early.
  Valley B stays with foraging for another fifteen hundred years and then adopts the
  same package on its own, with no sign of conquest. In A, five centuries into cultivation,
  adult stature has dropped by several centimetres, dental enamel defects are several
  times more frequent than in the foraging series that precedes them, and there are
  clear markers of periodic nutritional stress; but surviving children per woman have
  roughly tripled, the burial record suggests fewer deaths in the first year of life,
  and from the third century onward a minority of burials carry goods the rest lack.
  In B, stature and dental health are flat across the same interval while markers
  of violent trauma rise steadily. Everything I have is bone and burial, which samples
  the buried, the sedentary, and those who lived long enough to be buried as adults.


  Write the requirements list for a framework that is to say whether the transition
  made A worse off. For each requirement give the case or consideration that motivates
  it: the choice of welfare metric and what could justify one over another (health,
  longevity, hours of work, nutritional security, autonomy, number of people); the
  treatment of the fact that A''s later generations would not otherwise have existed;
  the treatment of a population several times larger with somewhat worse lives each;
  the treatment of the visible minority who did better, and of the question whether
  inequality is a harm in itself or only through its effects; the fact that no one
  decided, so the language of mistake may have no subject; the fact that once A''s
  population rose the alternative to transition was not stasis but collapse, so the
  comparison may be between two harms rather than between a harm and a neutral baseline;
  B''s independent adoption, which any framework must be able to read as evidence
  of something; the bias structure of skeletal and mortuary data; the fact that the
  transition is a process across many generations rather than an event, so a verdict
