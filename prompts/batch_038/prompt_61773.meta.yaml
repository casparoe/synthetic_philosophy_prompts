  Draft:


  "I have spent a term working through the published exchange between Daniel Dennett
  and Gregg Caruso on free will and punishment, and I want to understand why it goes
  nowhere. The shape of the debate is unusually clean, which makes the impasse puzzling.
  Caruso denies basic-desert moral responsibility: reasons-responsiveness is real,
  but the reasons that move an agent, and the dispositions that make those reasons
  move them, are themselves products of factors beyond their control, so no one is
  the ultimate source of their conduct and purely backward-looking retribution is
  never justified; what survives is a forward-looking, public-health-style model of
  incapacitation and rehabilitation constrained by proportionality and by a duty to
  address the social causes of offending. Dennett denies that this adds up to a loss:
  control, properly understood, is a graded competence to adjust one''s behavior in
  light of reasons, not a metaphysical exemption from causation; where that competence
  is present, holding the person responsible is not merely permissible but part of
  what sustains the competence, and demanding some further condition for ''true''
  desert ignores a difference we can observe and measure. He also charges that arguing
  people are not moved by reasons is indirectly self-refuting.


  Here is my working hypothesis, offered as a hypothesis. The two are not joined on
  a single question. At the level of institutions they converge almost completely
  — neither would retain the death penalty, neither justifies incarceration by backward-looking
  desert, both accept proportionality constraints and both point to prevention — so
  the practical disagreement is largely empty. At the level of metaphysics, Caruso''s
  target may not be a view anyone holds, since ''basic desert'' looks like a philosopher''s
  construction that even retributivist practice does not require. What is left is
  a narrower and possibly genuine divergence about reactive attitudes: whether resentment
  and indignation are fitting responses to wrongdoing or merely useful ones. Is that
  right? ...


  Then: diagnose. Which of these is the real disagreement: verbal about ''control''
  and ''desert''; two different questions (competence vs. origination) sharing the
  label ''free will''; a hidden empirical question about whether responsibility practices
  causally produce the competences Dennett credits them with, and about whether retributive
  framing worsens or improves behavior; or a bedrock valuation of being an ultimate
  source that neither side can argue for and that no argument touches? Does the self-refutation
  charge engage Caruso''s thesis or simply miss it? Tell me where the impasse is load-bearing
  and where it is decorative. And say what would count as progress: a distinction,
  a decisive case, a piece of social-scientific evidence about the effects of holding
  responsible, or a reformulation of the question — or, if you think no progress should
  be expected, why this is a disagreement that should simply be mapped rather than
  resolved."


