  Draft:


  "Getting asked by the organizers of a workshop I''m in to send around a ''where
  I stand'' sheet — just a list of commitments, no argument, so people can spend the
  weekend attacking them. Before I send it I''d like a sanity check from you, because
  I suspect there''s a crack in it somewhere and I can''t locate it.


  Here''s the list. It''s about computation and epistemic norms — that''s my patch.


  1. Feasibility is normative. I hold something like a computational version of ought-implies-can:
  if no algorithm can do a task in polynomial time, then no agent — human, machine,
  whatever — can be epistemically required to do it. I take polynomial time as the
  right rough cut on feasibility (the Cobham–Edmonds line), knowing full well it''s
  imperfect.


  2. Idealization in epistemology is legitimate, not a mistake. When I teach Bayesianism
  I tell students that logical omniscience is an idealization on a par with frictionless
  planes: the norm is stated for an ideal agent, and we''re the approximations. Nothing
  incoherent about that.


  3. I''m a straight realist about complexity-class questions. P vs NP has a determinate
  answer, and it''s whatever it is regardless of whether we can ever prove it or find
  the algorithm.


  4. Relatedly: a nonconstructive proof that P = NP would be a big metaphysical deal
  and a computational nothing. No algorithm, no ability to solve anything. You''d
  know something exists without being able to do anything with it.


  5. I take the natural proofs barrier (Razborov–Rudich, roughly: any proof strategy
  with the ''natural'' combinatorial features we''d expect would break pseudorandom
  generators) to be a philosophical result, not just a technical one — it says a whole
  style of conceptual explanation in mathematics is unavailable here.


  6. I accept computer-assisted proofs as proofs. Four color, Kepler, whatever: if
  the machine-checked artifact is right, we have knowledge, even though no single
  human surveys it. Understanding can be distributed across a community and across
  tools; it doesn''t have to sit in one skull.


  7. Where I get heterodox: I think the intractability of exact Bayesian inference
  — I''ll just say NP-hard and worse, I''m not going to get the precise class right
  in a handout like this — is not merely an implementation problem. It licenses a
  substantive revision: the norm can''t be ''have coherent credences,'' it has to
  be something like ''use a heuristic that works well in the environments you actually
  face.'' I''m broadly sympathetic to the Gigerenzer-style program on this basis.


  8. But I also insist that worst-case complexity is the wrong measure of what an
  agent can actually do. When people tell me ''learning is hard'' or ''planning is
  hard,'' I say: yes, in the worst case over all instances, which is not the world
  we live in. Real instances are structured, and average-case or smoothed behaviour
  is what you should look at. That''s how I answer pessimists about AI.


  So: which of these actually pull against each other, and which pairs only look like
  they do? I especially want to know whether 1, 2 and 7 can all stand up, and whether
  8 does any work I''m not noticing. Rank the tensions by severity, don''t just list
  them all as equally bad, and for each say what the cheapest revision is and what
  it costs me. Then tell me which single change would clean up the most. And I don''t
