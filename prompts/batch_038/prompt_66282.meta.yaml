  Draft:


  "I was auditing a two-day workshop on the political economy of food crises last
  month, and during the closing round two participants got into an extended argument
  that I found genuinely unresolved. I''d like an adjudication.


  The setting: a postdoctoral researcher (call her A) proposed that the familiar dispute
  over whether famines are natural disasters or political crimes should be settled
  by borrowing the machinery of climate event attribution. Her proposal, sketched
  on a whiteboard: for a given famine, construct a counterfactual world in which the
  physical shock is held fixed — same monsoon failure, same blight, same drought —
  but the institutions are set to what she called a competent-response baseline (functioning
  price signals, no politically motivated procurement or export policy, relief capacity
  deployed at roughly the speed that a well-run administration of the period could
  have achieved). Model both worlds, estimate excess mortality in each, and report
  a fraction: the share of the death toll attributable to the shock, and the share
  attributable to political failure. On her account this dissolves the rhetoric —
  Bengal in 1943, Ireland in the 1840s, and China around 1960 stop being emblems and
  become estimates with error bars — and it also, she said, rescues Amartya Sen''s
  thesis from being an article of faith, because the fraction is exactly the quantity
  that thesis is implicitly about.


  B, an economic historian in the room, objected in four steps..."


  Then B''s moves, then A''s replies, then a final exchange. Let me structure as 6
  moves with A/B alternating.


  B1: The baseline is not a parameter you can set; it is a political fact you have
  to assume. There is no possible world with the blight of the 1840s and a competent-response
  administration in Ireland, because the administration that was there — including
  its commitment to leaving trade undisturbed and to local self-funding under the
  poor law — was the competent-response administration by the standards of its own
  time. So the baseline smuggles in a moral judgment about which norms count as competent,
  and the resulting fraction is a measure of the historian''s own standards, not of
  the event.


  Hmm — that''s a strong point (a good one). A''s reply: yes, the baseline is normative,
  but so is every baseline, including the implicit one in the sentence "this was a
  political crime"; at least hers is explicit and can be argued with and varied in
  sensitivity analysis. Also: the fact that Victorian officials thought they were
  acting competently doesn''t make their policy the baseline; competence can be assessed
  against what was administratively available at the time (they had a famine code
  later, telegraphs, shipping, maize imports) — i.e., the baseline is "what was feasible
  given the period''s technology and knowledge," not "what they thought was right."
  That''s a decent reply.


  B2: The shock and the response are not separable in the way climate forcing and
  weather are. In a famine, the political failure often *is* part of the shock''s
  magnitude: Burma''s rice was cut off by a war; wartime inflation in Bengal was caused
  by procurement and monetary policy; in China the collapse was inseparable from procurement
