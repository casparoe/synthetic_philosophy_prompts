  \ of its own.\n7. A village elder's report about the road ahead, where the elder\
  \ has walked it — śabda; the hearer knows.\n8. The same elder's report, where he\
  \ has not walked it but is repeating what he heard from someone who did, and the\
  \ report is true — my adviser still says the hearer knows, provided the elder is\
  \ honest and careful.\n9. A fluent, well-meaning reciter who repeats a passage he\
  \ does not understand and does not believe, whose content is nonetheless true —\
  \ the hearer does not know. He said the words 'carry nothing.'\n10. A child who\
  \ learns a word by watching adults use it in the presence of the thing, never having\
  \ been told the meaning, and then applies it correctly — my adviser said this is\
  \ knowledge, and that it is testimony, because the adults' usage is itself an authoritative\
  \ declaration even though no one addressed the child.\n\nThe new case I have to\
  \ bring next week: [X]\"\n\nHmm, verdict 10 is doing a lot of work; it's the kind\
  \ of thing that makes candidate rules diverge. Let me think about what rules fit\
  \ all ten.\n\nRule A (instrument/causal-individuation, \"count the causes\"): pramāṇas\
