  \ must defend the coherence of their degrees of belief without data; the propensity\
  \ theorist... And there's the well-known critique that Meadow's statistic conflated\
  \ a frequency with a propensity, and that the \"double murder vs double cot death\"\
  \ comparison requires a prior.\n\nThat's a strong prompt: real episode, well-known\
  \ facts, rich theory lens (reference class problem, single-case probabilities, frequentism/subjectivism/propensity),\
  \ and it also lets me inject niche framing: e.g., ask specifically about the RSS\
