  \ interpretation: the intelligence estimates of Soviet ICBM numbers (the \"missile\
  \ gap\") involved Bayesian vs frequentist reasoning; Kent's \"words of estimative\
  \ probability\" (Sherman Kent's 1964 essay on \"Estimates of Influence\" — actually\
