  \ date, Court of Appeal 2003, and the independence assumption critique.\n\nBut hold\
  \ on — the domain list also includes \"interpretations of probability\". The Sally\
  \ Clark case is quite well-known in rationalist circles and might be regurgitated.\
  \ The instruction says inject some new/niche idea. I could inject a niche framing:\
  \ ask the model to evaluate the case specifically through the lens of a distinction\
  \ I introduce — e.g., \"the reference-class objection\" plus something like a specific\
