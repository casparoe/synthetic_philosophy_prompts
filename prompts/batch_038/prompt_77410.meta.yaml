  \ handles \"the probability that this particular infant would die of SIDS\", about\
  \ the independence assumption as a propensity claim vs a frequency claim, about\
  \ the \"prosecutor's fallacy\" vs \"the defence's fallacy\" (which needs a prior\
  \ — the base rate of double infanticide), about how the frequentist can respond\
  \ that the relevant frequency is unknowable and hence the number was not a frequency\
  \ at all but a dressed-up guess.\n\nHowever: hard rule about quotes — I won't quote\
  \ verbatim. And I should verify details if the prompt leans on them: 1 in 73 million,\
  \ Roy Meadow, 1999 conviction, Court of Appeal quashed January 2003, Royal Statistical\
