  \ on a contested or obscure historical detail; the asker can supply salient facts.\n\
  \nBut that's a great episode for \"peer disagreement\" or for \"the social epistemology\
  \ of mathematics\" or \"expertise and credentials\" — and it could be paired with\
  \ a domain... but the domains are fixed: moral relativism, complexity, insecticide\
  \ ethics, digital minds, probability interpretations. The Deolalikar episode fits\
  \ \"philosophical implications of computational complexity\" loosely (it is about\
  \ P vs NP) — and the theory lens could be about... hmm, the domain is more about\
  \ philosophical implications than social epistemology. But you could analyse it\
  \ through the lens of \"natural proofs barrier\" — too technical.\n\nAlternatively,\
  \ for probability interpretations: a real episode analysed through the lens of frequentism\
  \ vs subjectivism. E.g., the debate over the fine-tuning argument? Or: the \"prosecutor's\
  \ fallacy\" in the Sally Clark case (1999) — analysed as a case study in interpretations\
  \ of probability. That's a well-known episode: the paediatrician Roy Meadow's statistic\
  \ of 1 in 73 million (73 million to 1) for two cot deaths in an affluent family,\
  \ the Royal Statistical Society's statement (2001) expressing concern, the Court\
  \ of Appeal quashing the conviction in 2003, the multiplication of two probabilities\
  \ of single cot death assuming independence, the confusion of P(evidence | innocence)\
  \ with P(innocence | evidence), and the subsequent discovery of withheld blood test\
  \ evidence. Also there's the debate about whether the correct framing is frequentist\
  \ (rates of SIDS) or Bayesian (prior odds, likelihood ratio). And Manktelow/Biggs?\
  \ Actually the relevant literature: A. P. Dawid's expert statistical report; also\
  \ the \"ecological fallacy\"/reference class problem — which is a beautiful fit\
  \ for interpretations of probability: to give a frequency you must pick a reference\
  \ class (affluent non-smoking families in the same region...), and the frequentist\
