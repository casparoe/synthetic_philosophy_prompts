  Candidate desiderata:

  1. **Probe-relativity / the where-and-when requirement**: any question about when
  a subject experienced X must be indexed to a specific probe (a report, a button
  press, an attention shift, a subsequent discrimination). A theory must say which
  probes fix content and which merely influence it. Motivating case: in color phi
  the subject''s answer depends on what they''re asked and when; in TOJ vs. simultaneity-judgment
  tasks the same stimulus pair yields different orders. Status: arguably non-negotiable.


  2. **The no-finish-line requirement / or its opposite**: A theory must either deny
  that there''s a single place-and-time at which processing becomes conscious, or
  if it keeps one, say what makes it that one and why it doesn''t regress. Motivating
  case: Cartesian materialism and the infinite regress worry. Status: camp-relative
  (Dennett treats it as non-negotiable; global-workspace theorists happily keep a
  broadcast moment).


  3. **Determinate temporal content requirement**: experience itself must be capable
  of representing motion, succession, and duration — i.e., the theory must explain
  how an experience can have temporal extension/order in its content without requiring
  the subject to compare two simultaneous inner states. Motivating case: the color
  phi subject reports a moving light that changes color midway — the content is genuinely
  temporal, not a sequence of snapshots; also the specious present / retention view.


  4. **Report-fallibility-with-a-limit requirement**: the theory must allow that reports
  can be wrong about temporal features (otherwise color phi and postdiction effects
  are inexplicable) but must not allow them to be wrong in an unconstrained way (otherwise
  nothing could be measured, and the Orwellian/Stalinesque question becomes empirically
  empty). This is the crux: there must be some fact that distinguishes genuine misremembering
  from genuine backdating, or the theory must say why the question is ill-posed. Motivating
  case: Dennett & Kinsbourne''s claim that the two are behaviorally indistinguishable
  — no privileged probe time.


  5. **Neural-commensurability / implementation constraint**: the theory must map
  onto measurable neural events in a way that permits prediction about latencies,
  and must be consistent with the fact that content assigned to a stimulus depends
  on what happens after it (postdiction: flash-lag, cutaneous rabbit, where a later
  tap changes where an earlier tap is felt to be). Motivating case: the cutaneous
  rabbit — taps at wrist and elbow, felt as evenly spaced along the arm, requires
  the earlier taps'' assigned locations to depend on later input.


  6. **Grain requirement**: the theory must say how fine-grained temporal experience
  is, and whether the grain varies across modalities and tasks; must be consistent
  with the ~tens of ms order of discrimination.


  7. **Modal unity requirement**: whatever the theory says about vision must extend
  (or principledly not extend) to audition and touch — because the same puzzles recur
  crossmodally (ventriloquist effect, temporal ventriloquism, the cutaneous rabbit).
  Also cross-modal order judgments are notoriously labile and depend on which modality
  is attended.


  8. **The "no homunculus/observer" requirement** — related to 2.


  9. **The requirement to explain the asymmetry between the experienced present and
  the experienced past**: the "nowness" of the leading edge; must account for the
  fact that we don''t experience a continuously rewritten past (i.e., why the felt
  flow is one-directional even though content can be backdated).


  10. **The requirement that the theory not make the temporal properties of experience
  epiphenomenal / must preserve the causal role of experienced order**: e.g., if the
  subject''s timing judgments drive behavior, the theory must explain the behavior.


  11. **A requirement of individuation**: what counts as one experience vs. two —
  the "how many experiences are there right now" question, needed because color phi
  asks whether there was one moving experience or two stationary ones.


  The jointly unsatisfiable subset: The most interesting candidate is the conjunction
  of (a) every question about when an experience occurred has a determinate answer
  (there''s a fact of the matter about the temporal properties of experience independent
  of probes), (b) the only evidence about experience is report/probe behavior, and
  (c) reports are fallible in an unconstrained way / or rather: (a) + (b) + "some
  probes are non-privileged" yields indeterminacy. More precisely: {there is a determinate
  fact about when experience occurs (realism about experiential timing)} + {all access
  to that fact is through probes whose timing is itself part of the causal chain}
  + {the theory must be empirically testable / no unobservable epiphenomena} — these
  three may be jointly unsatisfiable, which is exactly Dennett & Kinsbourne''s conclusion:
  the only way to have both a determinate fact and testability is to posit a privileged
  probe (a finish line), which reintroduces the Cartesian theater and the regress.
  So the impossibility: determinacy + no privileged probe + fallible-but-not-arbitrary
  reports.


