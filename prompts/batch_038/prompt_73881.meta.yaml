  Paragraph 1: Setup — I''m finishing a dissertation chapter / convening a reading
  group? Let''s make it: a doctoral researcher in history of philosophy working on
  late-Victorian Cambridge, or someone preparing a paper for a conference on "philosophy
  and its discontents". I''ll say: I''ve spent two years on Sidgwick''s psychical
