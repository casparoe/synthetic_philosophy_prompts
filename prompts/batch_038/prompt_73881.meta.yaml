  I am three years into a project on Henry Sidgwick''s involvement with psychical
  research, and the interpretive debate I have walked into has stopped producing arguments
  and started producing restatements. Roughly, there are four positions. The continuity
  reading holds that the Society for Psychical Research was an extension of his moral
  philosophy by other means: the Methods of Ethics ends with a conflict between rational
  egoism and universal benevolence that ethics alone cannot resolve, and only a guarantee
  that virtue and happiness ultimately coincide would resolve it, so the search for
  evidence of survival was, for Sidgwick, the one empirically respectable route to
  a postulate his own system required but could not supply. The symptom reading treats
  the same material as biography rather than philosophy — the scrupulous man who surrendered
  his fellowship in 1869 rather than subscribe, who spent his life negotiating between
  destructive criticism and the need for consolation, and whose parapsychology was
  an outlet for a wish his published work refused to theorise; on this view, reading
  the SPR back into the ethics is a straightforward biographical fallacy. The institutional
  reading says both are missing the point: what interested him was method, not survival
  — building a body that would bring base rates, cross-examination and the exposure
  of fraud to a domain the scientific establishment had simply abandoned, which is
  why the Census of Hallucinations of 1894 argues from the reported experience of
  some seventeen thousand people rather than from séance testimony. And a fourth,
  deflationary camp says he never believed any of it and that talk of an ''ethical
  faith'' is a projection onto a lifelong agnostic of a vocabulary he pointedly declined
  to use.


  What frustrates me is that the evidence is not in dispute. Everyone works from the
  same Proceedings, the same correspondence, the same séances — including the sittings
  with Eusapia Palladino in Milan in the mid-1890s, after which Sidgwick''s report
