  Concrete positions in the debate (at least three, with distinct labels):

  1. The "continuity" reading: Sidgwick''s SPR work is an integral extension of his
  moral philosophy — the dualism of practical reason leaves him needing some empirical
  assurance that virtue and happiness can be reconciled, and survival research was
  the only route to such assurance consistent with his evidential scruples; on this
  view his founding presidency of the SPR in 1882 and his chairmanship of the Census
  of Hallucinations (1894) are philosophy by other means.

  2. The "compartment" or "symptom" reading: it''s a private, temperamental matter
  — the divided self, the man who resigned his fellowship in 1869 over subscription
  and who spent his life managing scrupulosity; the SPR was an outlet for a need for
  consolation that his published philosophy refused to theorise. On this view, importing
  it into the Methods of Ethics is a biographical fallacy.

  3. The "institutional hygiene" reading: Sidgwick''s interest was less in survival
  than in defending the boundaries of respectable science against spiritualism — the
  point of the SPR was to impose method (statistics, cross-checking, exposure of fraud)
  on a domain the scientific establishment was ignoring, so the content of the findings
  mattered less than the discipline. Hence the Census''s appeal to base rates rather
  than to séance testimony.

  4. Maybe a fourth: the "he never believed anything" deflationary reading — he was
  a lifelong agnostic who treated psychical research as a duty of inquiry, not a hope;
  and the phrase "ethical faith" is an anachronistic projection.


  The stall: everyone has the same archive (SPR Proceedings, the letters, Schultz''s
  biography, the Methods), and yet nothing moves. Notably: the disagreements re-emerge
  unchanged every decade; and the two sides accuse each other of the same vice — reading
  Sidgwick''s mind by assuming what psi can''t be / can be.


