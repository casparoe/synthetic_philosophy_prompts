  August 1998, flight to liquidity blew out spreads, margin calls, Fed-organized bailout.
  Kelly: they bet a fraction far above what the model''s edge implied under fat tails;
  expected-value maximizing would say leverage up; geometric rationality says the
  log-optimal fraction is much lower and that overbetting yields negative growth even
  with positive edge. Also: Kelly assumes you know the odds; estimation error means
  fractional Kelly. Also the "Kelly is about repeated bets with reinvestment" — but
  LTCM''s positions weren''t clean repeated bets; correlation across positions meant
  the effective bet was one huge bet. That''s a rich analysis.


  Also there''s a nice "where the model breaks" angle: Kelly''s criterion isn''t obviously
  the right norm for a fund managing others'' money with limited liability and no
  personal ruin; also Kelly assumes utility = log wealth, which is a normative choice,
  and geometric rationality''s claim that "you can''t eat expected value" depends
  on time and on whether there are outside rescuers. And LTCM did get rescued — so
  ruin was not absorbing; the state backstopped. That''s a nice twist: geometric rationality
  assumes an absorbing barrier at zero, but LTCM''s barrier was relocated by the Fed.
  Excellent — that''s a genuine anomaly for the theory.


