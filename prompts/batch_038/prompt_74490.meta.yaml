  Let me design the prompt carefully.


  Asker''s purpose (fixes adequacy): The asker is designing/evaluating a safety argument.
  Something like: "I''m trying to write down the safety argument behind a monitoring
  protocol: we detect a certain mechanism in a smaller/earlier version of the model,
  and we want to conclude something about the deployed model after fine-tuning. Before
  I commit to an account of when two things are ''the same mechanism,'' I want the
  spec."


  Actually, let me make it cleaner and more concrete. The asker could be an AI safety
  researcher who is reviewing proposed definitions of mechanism identity used across
  the field — e.g., "model diffing" claims that a behavior circuit in model A corresponds
  to one in model B; interpretability papers claim a feature is "the same" across
  layers/checkpoints/scales; a red-team claims an alignment fine-tune didn''t remove
  a capability mechanism, only suppressed it. And they want the desiderata before
  reading more accounts.


  Requirements list should include, with motivating cases:

  1. Scale/capability transfer: license the inference from a small model to a large
  one (or from a proxy to the real thing) — motivating case: universal-ish features
  appearing across model families; induction heads appearing at a phase transition.

  2. Diachronic identity through training: checkpoints 1000 steps apart; "the same
  circuit, slightly different weights" — gradual drift (Theseus problem), and whether
  identity is transitive across a chain of small changes even when the endpoints are
  very different (sorites pressure).

  3. Invariance under transformation: quantization, pruning, distillation, LoRA adapters,
  weight tying, permutation symmetries. A definition that says a permuted network
  has a different mechanism is useless (permutation symmetry is a killer case — the
  same function computed with permuted neurons).

  4. Multiple realizability: same function implemented differently (e.g., two different
  ways of doing arithmetic — a lookup circuit vs. a composition circuit; induction
  head vs. a hashing-based retrieval). Must decide whether function or implementation
  individuates.

  5. Conversely: same implementation, different function — e.g., an attention pattern
  that does copying in one context and something else in another; a polysemantic neuron/feature
  that participates in two circuits. The definition must handle superposition and
  polysemanticity: components not being mechanism-individuated.

  6. Granularity/level: feature vs. circuit vs. algorithm vs. whole-model disposition.
  The definition must say what level it''s at, or be level-relative — and must not
  collapse distinct levels.

  7. Interventional adequacy: identity must support counterfactuals — if M1 = M2,
  then ablating/patching M1 should have the same effect profile as ablating M2 (in
  the relevant distribution). Motivating case: activation patching showing a circuit
  is necessary and sufficient for a behavior.

  8. Epistemic tractability/detectability: we must be able to determine identity from
  data available in practice (activations, gradients, SAE latents, behavior). A definition
  that is only checkable by an omniscient observer can''t underwrite a monitoring
  protocol.

  9. Context/distribution relativity: a mechanism''s identity may depend on the input
  distribution (the same circuit does different work on different data). Motivating
  case: the induction head fires on code but not prose.

  10. Behavioral indistinguishability is not enough: two mechanisms can produce identical
  outputs on all evals yet differ internally (the "suppression vs. removal" case —
  an alignment fine-tune that adds an inhibitor rather than removing the mechanism;
  also steganography/masking). This is arguably the requirement that does the most
  work for the safety purpose, and it excludes behaviorist/functionalist accounts.

  11. Anti-individuation-by-description: the definition must not make mechanism identity
  depend on the interpreter''s chosen vocabulary or SAE dictionary (otherwise "same
  mechanism" is a fact about the analyst). Motivating case: SAE features differ across
  dictionaries; a feature found with a 1M-latent dictionary isn''t found with 32k.

  12. Formal properties: is identity an equivalence relation (reflexive/symmetric/transitive)
  or graded similarity? Must handle sorites without incoherence. Also whether it''s
  absolute or relative to a comparison class.

  13. Consistency with what''s known about training dynamics: superposition, polysemanticity,
  grokking/phase changes, redundancy, distributed representations; also the empirical
  fact that different seeds give different implementations of the same capability.

  14. Compositionality: parts and wholes — a mechanism being present iff its parts
  are present; whether identity is preserved under partial replacement (one neuron
  in a circuit dies, another takes over).


  Joint unsatisfiability: (a) interpreter-independence + epistemic tractability +
  level-determinacy; (b) function-based individuation + the safety requirement that
  internal difference matters (i.e., requirement 10 conflicts with requirement 4);
  (c) equivalence-relation transitivity + diachronic drift (sorites); (d) mind-independent
  identity + invariance under permutation/pruning + granularity determinacy.


  Which single requirement does the most to exclude candidates: probably requirement
