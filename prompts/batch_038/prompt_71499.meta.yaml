  (1) content gated by reliable published sources rather than by correctness; (2)
  removal of true-but-unsourced claims; (3) attribution ("according to") rather than
  assertion for contested claims; (4) "due and undue weight" mirroring the distribution
  of published opinion; (5) the talk-page practice of demanding citations rather than
  reasons. Under deflationism, "true" is a device for generalizing and endorsing;
  the encyclopedia''s function is to record what sources assert, which is essentially
  recording claims endorsed-as-true by others — so deflationism arguably makes the
  policy coherent: since truth adds no substantive constraint beyond assertibility
  conditions, the only thing a collaborative encyclopedia can operationalize is assertibility.
  Under a robust correspondence view, the policy is systematically self-undermining:
  it admits known falsehoods when sourced and excludes known truths when unsourced.
  Under a coherence theory, the policy is natural: the encyclopedia is a web of mutually
  supporting sourced statements. Under a pragmatist/Jamesian view, the policy is alien.
  Also: the policy presupposes that "reliable source" is itself a proxy that correlates
  with truth — a tracking relation, which is a substantive epistemological claim about
  testimony (reductionism vs. anti-reductionism about testimony; Coady; the Hume-Reid
  debate). And there''s the interesting point that deflationism might make the practice
  incoherent in another direction: if "is true" is redundant, then the policy''s own
  contrast ("verifiability, not truth") is either vacuous or requires a substantive
  notion of truth that deflationism denies. So deflationism could be the theory that
  makes the contrast unintelligible — meaning the policy presupposes a non-deflationary
  truth. That''s a nice underdetermination: does the policy presuppose deflationism
