  I chair the standing model-review panel of a national transport regulator. Roughly
  a dozen times a year we must rule on whether a simulation model submitted to appraise
  a road, rail, or bus scheme is fit to support the decision — and our written reasons
  are read into the record at public inquiries and picked apart by opposing counsel,
  so they cannot rest on deference to the modeller. Our current practice is unstable
  in a way I want fixed. When a challenger says the model''s assumptions are false,
  we typically answer by pointing to its back-cast: it reproduces observed traffic
  counts and journey times within a few percent, so, we say, the assumptions must
  be good enough. That is Milton Friedman''s instrumentalist line from his 1953 methodology
  essay, and it is also exactly what critics call the F-twist: an assumption''s predictive
  consequences are the assumption''s own content restated, so a model that predicts
  well cannot thereby show that its assumptions are unobjectionable — it can only
  show that the package works here. Yet in other cases we demand realism outright
  and reject a model for assuming away the very mechanism under appraisal. I want
  a single procedure that removes the arbitrariness without pretending that idealization
  is a defect per se.


  Please write a decision procedure my panel can run on a submitted model, usable
  by economists and engineers with no philosophy training, completable inside the
  half-day we allot per model, and producing findings I can put in a decision record.
