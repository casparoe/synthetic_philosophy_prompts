  Student answer draft:


  "Representational theories of mind face a problem about error. If a mental state''s
  content is fixed by what normally causes it, then it looks like the state can''t
  be false: whenever something causes it, that thing falls under the content. Fodor''s
  version of the difficulty is the disjunction problem. A frog''s visual system fires
  at flies, but it also fires at small dark moving dots — BBs, shadows, bee-bees.
  If causation fixes content, the state''s content should be disjunctive: fly-or-BB-or-shadow.
  Then the frog never misrepresents when it snaps at a BB, which is absurd, because
  frogs do make mistakes. Fodor pressed this against teleosemantics, but the teleosemantic
  answer is the natural one: content isn''t fixed by what causes the state now, it''s
  fixed by what the state''s producing mechanism was selected for. Ancestral frogs
  whose detectors responded to flies got food and left offspring; the ones that responded
  to BBs got nothing. So the mechanism''s function is fly-detection, and its content
  is fly. When a frog snaps at a BB, the state tokens fly but falsely — malfunction,
  not a change of content. This is the big selling point: teleosemantics gets normativity
  from biology. A representation ought to be about flies in the same sense a heart
  ought to pump, and that ''ought'' is descriptive, not evaluative. It also buys us
  Davidson''s Swampman: a duplicate formed by lightning in a swamp has no selection
  history, so on Millikan''s view its states have no content at all, however much
  they look like thoughts. That''s a cost — the verdict looks harsh — but it''s principled.


  The two classic versions differ in scope. Dretske''s indicator semantics says a
  state means whatever it was reliably correlated with during a learning period, after
  which the correlation can be broken and the content stays put. Because the learning
  period is a selection process — the system settles on the correlation that keeps
  working — Dretske''s view is teleological too. The real difference is just phylogeny
  versus ontogeny: Millikan uses the species'' evolutionary history, Dretske uses
  the individual''s learning history. Relatedly, Millikan''s account is producer-side,
  since content is settled by what the mechanism that produces the signal was selected
  for, whereas Dretske''s is consumer-side, since content depends on what downstream
  systems do with the signal.


  Two worries remain. First, mismatch: if content is fixed by ancestral conditions,
  then in a novel environment almost everything we think is systematically false,
  which seems like too much error. Second, over-intellectualization: it''s hard to
  see what the selected-for function of ''justice'' or ''square root of two'' is.


  Still, the account should be judged a partial success. Because content is fixed
  by what the mechanism was selected for, and selection retains only mechanisms that
  produce accurate representations, teleosemantics also guarantees that content tracks
  truth. That''s why it can underwrite the norm that beliefs ought to be true, and
  why most of our beliefs do turn out true — something no causal theory can explain."


