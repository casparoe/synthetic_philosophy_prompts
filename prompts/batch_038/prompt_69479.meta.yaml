  ---


  Write an essay that adjudicates a dispute about the foundations of the coherence-argument
  program in decision theory — the program that seeks to establish expected utility
  maximization not by claiming it is intrinsically reasonable but by showing that
  agents who violate it are exploitable, incoherent, or unrepresentable.


  Begin from three positions, which I stipulate as follows. Treat the stipulations
  as fixed points of the debate rather than as claims you may revise:


  (1) The Primacy Thesis. The only fundamental norm on an agent''s choice dispositions
  is diachronic self-government: the requirement that no sequence of offers, each
  of which the agent freely accepts, leaves her strictly worse off than declining
  the sequence altogether — unpumpability, in short. The static axioms of the representation
  theorems (completeness, transitivity, continuity, independence) have no independent
  authority. They are justified, when justified at all, only as sufficient conditions
  for unpumpability in one-shot settings, and they lapse wherever they conflict with
  it in sequential ones.


  (2) The Fixed Menu Objection. Representation theorems are proved relative to a given
  state space, a given outcome space, and a given algebra of acts. But in a genuinely
  sequential problem the agent''s earlier choices constitute the menu available later;
  the act space is not a backdrop against which she decides but partly an artifact
  of her deciding. A representation therefore holds only relative to an individuation
  of acts that the agent herself supplies, and the theorem cannot be used to *read
  off* an agent''s credences and utilities so much as to describe one of her ways
  of carving up her own problem.


  (3) Representational Quietism. Coherence theorems should not be read as establishing
  anything about the existence, uniqueness, or rational authority of degrees of belief
  and utility at all. They are consistency checks on our descriptions of agents —
  useful for detecting incoherent reports, inert for normative purposes — and the
  entire "why be coherent?" question dissolves once we stop treating the theorems
  as discoveries about mental magnitudes.


