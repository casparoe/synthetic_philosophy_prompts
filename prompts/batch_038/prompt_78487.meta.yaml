  Type: Analyze a real historical episode through the lens of a theory. Deliverable
  runs both directions: theory illuminating case, case testing theory.


  Additional instruction: from the perspective of someone who just had a long argument
  with a friend; formal/polished tone.


  Inject novel structure: the two-versions distinction (mass-belief version vs. elite-bargain
  version) — this is my invention for the prompt, forcing non-regurgitation. Also
  demand a falsification statement: what observation would count against performance
  legitimacy as applied to a named regime. Also demand: where is the theory silent
  (e.g., on timing/lags, on whether performance is measured absolutely or relative
  to expectations, on comparison cases, on the difference between performance and
  the *attribution* of performance).


  Also a nice analytic wrinkle: the expectations/reference-point problem — Suharto
  delivered 30 years of growth, which may have raised the reference point so that
  a mere slowdown counted as failure; and the theory needs a baseline, which it typically
  doesn''t specify. Ask: does the theory need a claim about expectations/adaptation
  to be predictive, and if so is that an ad hoc rescue or a legitimate refinement?


  Also the attribution problem: riots in May 1998 were partly directed at ethnic Chinese
  businesses — was the withdrawn consent about performance, or was the collapse an
  occasion for pre-existing ethnic and religious grievances? And the IMF conditionality
  question: did Suharto''s own policy choices (and his family''s) cause the price
