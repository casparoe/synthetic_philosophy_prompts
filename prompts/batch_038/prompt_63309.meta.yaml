  that can be written as a sum, and the sum only makes sense if the Ui are measured
  in a common unit. So interpersonal comparability isn''t an extra hypothesis you
  may or may not add; it''s built into the structure of the problem once you accept
  that society''s ranking is also an expected-utility ranking. That''s why the theorem
  is often said to show that Robbins''s neutrality is unattainable: you cannot have
  a Pareto-respecting, expected-utility social ranking without already having made
  the comparisons Robbins wanted to ban.


