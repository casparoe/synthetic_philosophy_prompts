  a ranking plus, once uncertainty is added, choices among lotteries. The trouble
  starts when you try to move across persons. To say that a policy making Anna better
  off and Ben worse off increases total utility, you need to place Anna''s and Ben''s
  utilities on a common scale — you need at least a shared zero and a shared unit.
  Robbins''s point is that there is no behavioural evidence that could settle this,
  because each person''s utility function is recoverable only from their own choices,
  and those choices fix the function only up to a positive affine transformation.
  So any statement about whose gain is bigger smuggles in an ethical judgment about
  how much each person''s satisfaction counts. That''s why he says such comparisons
  are normative, not scientific, and why ordinalist welfare economics — Pareto, compensation
  tests, the New Welfare Economics — tried to proceed without them.


  (b) Harsanyi''s aggregation theorem is usually presented as the answer. Setup: a
  finite set of individuals and a set of prospects (lotteries) over outcomes. Assume
  (i) each individual''s preferences over prospects satisfy the vNM axioms and so
  are represented by an expected utility function; (ii) the social preference over
  the same prospects also satisfies the vNM axioms; (iii) weak Pareto — if every individual
  is indifferent between two prospects, society is too. Then there are non-negative
  weights w1...wn such that the social utility function is a positive affine transform
  of the sum Σ wi Ui. So the social ranking of prospects is representable by a weighted
  sum of individual utilities — which is just the utilitarian form, modulo the weights.


  The standard way to read this as an answer to Robbins: Harsanyi isn''t claiming
  to have found behavioural evidence for interpersonal comparisons. He''s shown that
