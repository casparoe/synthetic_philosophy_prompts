  Also the hard part / the twist that makes the philosophy do work and prevents easy
  triumphalism:

  - The asker must not simply claim Rousseau would have approved. Rousseau''s objections
  were partly about theatre *as such*: the actor''s trade of selling himself and feigning;
  comedy making an honest man ridiculous and a smooth compromiser sympathetic; the
  audience knowing it''s fiction so no real moral effect; amusements that eat the
  time needed for work and citizenship; and the way a fixed building, paid seats,
  and a professional company create a hierarchy. Some of these objections bite on
  the village panto too: the society has a paid-in-kind "director" from town; there
  is a charge at the gate for the fund-raiser; the Dame routine does make the earnest
  man (i.e., a local councillor who''s honest but dull) the butt of the joke — which
  is precisely Rousseau''s Misanthrope point. So the speech has to concede this and
  handle it, not paper over it. That''s an excellent structural constraint: the speech
  must acknowledge one of Rousseau''s objections as applying to their own panto, and
  answer it without abandoning it.

  - Also: the funder wants to hear about "audience reach" and a plan to bring in professional
  touring companies — which is exactly what Rousseau would have said no to. The speech
  must resist turning the society into a receiving house for touring professionals,
  without insulting the funder or losing the grant.

