  Now the philosophical framing to inject: the "collapse" debate. Key positions I
  can describe without citation:

  - The failure framing: societies collapse when their institutions stop delivering
  the goods that made complexity worth maintaining (diminishing returns to complexity
  — Tainter). Collapse = a rapid, significant loss of sociopolitical structure.

  - The ecocide framing (Diamond): environmental overreach, elite short-termism, and
  failure to perceive the problem cause the fall.

  - The transformation/skeptic framing (archaeologists'' critique): "collapse" is
  often a category imposed by observers who mistake the disappearance of a particular
  elite/monumental/centralized form for the disappearance of a people; populations
  persist, reorganize, sometimes flourish; the label smuggles in a normative preference
  for states and monuments and erases those who were already worse off under the old
  order. Also: many "collapses" are known only from the perspective of the record
  — when palaces stop producing tablets, that''s a documentary collapse as much as
  a societal one.

  - The subject-of-collapse question: collapse is predicated of what? A polity, a
  culture, a way of life, a class, a set of people? Different subjects yield different
  verdicts — the "society" may survive while the "civilization" dies and the "individuals"
  get better off.


