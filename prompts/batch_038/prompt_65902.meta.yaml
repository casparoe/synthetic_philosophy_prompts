  ECL: In a large (possibly infinite) universe, there are many agents in acausally
  disconnected regions who face decision situations similar to yours. By evidential
  decision theory, your action is evidence about what similar agents do. If you cooperate,
  that''s evidence they cooperate; and there could be an enormous number of them,
  so the expected value of cooperating (for their sake) is large. Thus you should
  do things that would be good for them (e.g., promote values you think might be widely
  held / that others would want promoted), and in return, they do the same for you.
  Origin: Katja Grace''s "Evidential cooperation in large worlds"; further developed
  by Caspar Oesterheld, also Anthony DiGiovanni, and the "acausal trade" / "multilateral
  Bargaining" literature (LaPlace). Objections/discussion points:

  - Whether you should trust EDT here; CDT people say you can''t influence them.

  - The "which agents are relevantly similar" / reference class problem, and how much
  probability mass to put on the existence and similarity of such agents.

  - "The problem of knowing what they want": even if you cooperate, you need to know
  their values to act helpfully; and there could be many different value systems,
  so you''d want to do what maximizes the sum over possible partners of (probability
  × trade gain) — a bargaining problem without communication; Schelling points; "Pareto-improving"
  policies; risk of helping adversaries.

