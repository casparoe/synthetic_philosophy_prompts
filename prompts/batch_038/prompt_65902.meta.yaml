  I record a fortnightly podcast on decision theory and its practical fallout, usually
  in front of an audience of twenty-odd graduate students, and next month''s guest
  is a researcher who has spent the last decade defending evidential cooperation in
  large worlds. Since I want the questions to assume familiarity rather than to re-litigate
  the basics, here is how I understand the view: in a universe that is spatially vast
  or infinite, there are enormous numbers of agents who are acausally isolated from
  us but who find themselves in decision situations relevantly like our own; if my
  choice is evidence about what agents in those situations choose, then acting cooperatively
  now raises the probability that they act in ways that benefit me, and because there
  may be so many of them the expected value of cooperating can dominate the local
  payoffs. Our guest adds two refinements of his own that I want pressed rather than
  explained away. First, he holds that the relevant similarity class is fixed by similarity
  of decision procedure rather than by shared ancestry or physical resemblance, so
  that a machine intelligence with a wholly different origin can be a trading partner
  while a chimpanzee cannot. Second, in response to the charge that ECL agents are
  fickle — cooperative now, indifferent as soon as cosmology comes back with a small
  universe — he defends what he calls "recalcitrant cooperation": the claim that an
  agent should keep cooperating even after acquiring strong evidence that no such
  partners exist, on the grounds that a policy which switches off when it stops paying
  is not a policy anyone could have relied on in the first place.


  Please draft ten interview questions, in the order I would actually put them, and
  for each give me: the line of objection it instantiates; the reply he is most likely
  to give, stated as concretely as you can; and a follow-up that still bites if he
  gives that reply. I want the set to include at least one question on each of the
  following, and I would rather have depth on these than breadth. Why the inference
  from my cooperating to their cooperating is licensed here, when a causal decision
  theorist will say it is the same invalid inference that makes smoking look like
  a cause of cancer in cases where the real explanation is a common cause — and, relatedly,
  why the same reasoning does not oblige him to act on every other acausal correlation
  he can think of, from lottery tickets to the outcomes of quantum measurements. How
  he sets the probability that relevantly similar partners exist and are numerous,
  and what he says to the suspicion that agents who have even heard of this argument
  are a tiny and unrepresentative subset of the reference class, so that their behaviour
  is poor evidence about anyone else''s. What the argument actually tells an agent
  to do, given that he cannot know the values of his partners: how a trade is supposed
