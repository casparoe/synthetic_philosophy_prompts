  "I write about science and ideas for a British weekly, and I am currently assembling
  a long read on why time has a direction, prompted by a piece of reporting I did
  on gravitational-wave astronomy and the thermodynamics of black holes. In the course
  of the reporting I have become persuaded by a fairly definite package, and I want
  to know how exposed it is before I put my name to it in print. The package has three
  parts. First, the fundamental dynamical laws need not contain any time-asymmetry:
  whatever asymmetry shows up in our descriptions of the world is not built into the
  microscopic equations. Second, the whole of the asymmetry we experience is owed
  to a single contingent boundary condition — that the early universe was in a state
  of extraordinarily low entropy — together with a statistical or typicality postulate
  that licenses moving from that condition to claims about how systems behave away
  from equilibrium. Third, everything else we are inclined to call an arrow of time,
  including the asymmetry between what we remember and what we foresee, the fact that
  we can affect the future and not the past, and the preference of electromagnetic
  and gravitational radiation for retarded over advanced solutions, is derivative:
  it falls out of the boundary condition plus the statistics, and needs no separate
  explanation."


  Para 2: "What would count against this? Please give me the defeaters ranked, from
  those that would oblige me to abandon the package to those that would merely oblige
  me to qualify it... I have particular questions. Is there any observation, present
  or foreseeable, that the package could not accommodate...?" Include: rival that
  posits a genuinely time-asymmetric law seems observationally equivalent — does that
  mean the package risks nothing? Gravitational entropy measure problem / Penrose''s
