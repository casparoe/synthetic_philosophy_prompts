  verification. Better to write the argument from the asker''s own construction, keeping
  the domain''s key ideas (asymbolia, unpleasantness as what makes pain bad, the distinction
  between sensory-discriminative and affective-motivational dimensions of pain) at
  a level that LLMs will know well. I can mention the insular lesion broadly — that''s
  fine and well-known; but let me be safe and not over-specify. Actually, pain asymbolia
  being associated with insular lesions is standard knowledge (Rubins & Ramachandran
