  Let me construct an argument for the conclusion "there is no such thing as pain
  that is bad for the person who feels it" or better: a conclusion like "the badness
  of pain is not a property of the feeling at all — nothing about how a pain feels
  makes it bad" — i.e., the conclusion is that pain is never bad in itself, which
  is too much (it would license indifference to pain, undercut the reason to give
  analgesia, etc.). Hmm, or the conclusion could be: "if asymbolics feel pain without
  minding it, then unpleasantness cannot be what makes pain bad; but if unpleasantness
  isn''t what makes pain bad, nothing about the experience is; therefore pain''s badness
  is entirely extrinsic — a matter of the harm it signals — and so it would be rational
  to take an asymbolia-inducing drug even when pain would be protective, and in fact
  it would be rational for anyone to eliminate the unpleasantness of pain while keeping
  the discrimination." That last conclusion is arguably not absurd but rather radical,
  which is fine — "conclusion they cannot accept."


  Let me build a crisp numbered chain that slides somewhere. Candidate slides:


  1. Pain is bad for a subject only insofar as it is unpleasant (i.e., its badness
  lies in how it feels). [evaluative/hedonist premise]

  2. Asymbolics report pains as intense as controls'' when tested, but do not mind
  them.

  3. Therefore unpleasantness comes apart from the sensory character of pain; a pain
  can be felt fully without being unpleasant.

  4. If a pain can be felt fully without being unpleasant, then unpleasantness is
  not part of what it is to feel pain; it is an additional state — a reaction to the
  pain.

  5. But a state that is merely a reaction to pain cannot make pain itself bad. Hmm,
  that''s where the slide is: from "separable" to "not constitutive".

  6. So the badness of pain, if any, lies in the reaction, not in the pain.

  7. So pain as such is not bad; only the minding of it is.

  8. Therefore, eliminating the minding while preserving the discrimination loses
  nothing of value, and a person who never minds any pain would never be made worse
  off by pain. (Absurd-ish: it makes the asymbolic strictly better off than the normal
