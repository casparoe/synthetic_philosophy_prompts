  Pain asymbolia: a neurological condition (Schilder & Stengel, 1931) where patients
  report feeling pain but appear indifferent — they report the pain but do not suffer
  from it, don''t withdraw, may smile/laugh. Lesions in the insula / posterior insular
  cortex. Rubins, Ramachandran. Also used by philosophers: e.g., David Bain & Michael
  Tye on the unpleasantness of pain being an imperative/evaluative property; Ayse
  Bermudez? Actually relevant: Nelkin, Grahek "Feeling Pain and Being in Pain" (2007),
  David Bain, Colin Klein ("Pain, unpleasantness, and the desire to be rid of pain"),
  and the "unpleasantness is intrinsic/imperative" debate. Also Michael Tye''s account.
  There''s the question of whether asymbolics genuinely feel pain but are indifferent,
  which matters for the claim that pain''s badness lies in its unpleasantness (which
  motivates imperativism) vs. in the desire to have it stop.


