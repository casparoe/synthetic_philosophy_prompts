  Here''s the exchange as best I can reconstruct it:


  1. Tobias opened with the familiar complaint that the description already gives
  the game away: to say the spheres are a fixed distance apart is to place them in
  a space, and once you have a space they differ by where they are, so they''re discernible.

  2. Ines said that just shows Black picked a bad example. Strip the space out: a
  world with exactly two things and no spatial or any other relation between them,
  each having exactly the same intrinsic character. Same argument, no coordinates.

  3. Tobias: you can''t strip it out. A sphere is a shape and shapes are ways of occupying
  space; ''non-spatial sphere'' is a contradiction, so your cleaned-up case describes
  nothing.

  4. Ines: fine, don''t use spheres. Use whatever your favorite fundamental stuff
  is — two exactly similar instances of the same basic property, no relations at all.
  If you insist the case has to be stated in the vocabulary of a specific kind of
  object, you''re changing the subject from whether bare numerical difference is possible
  to whether spheres are.

  5. Tobias then made what I thought was the most interesting move. He said: the case
  can only be *stated* by someone who has already given up on the principle. To describe
  the world as containing exactly two such things you have to individuate them, at
  least implicitly, and the only two options are a qualitative ground of difference
  — in which case they''re discernible and the principle survives — or a bare thisness,
  in which case you''ve assumed the falsity of the principle in order to describe
  a world that refutes it. Either way the thought experiment begs the question.

  6. Ines said that''s a use/mention slide. You don''t have to individuate anything
  to say there are two of them: I can truthfully say that two grains of sand on this
  beach are exactly alike without being able to tell you which two, and nothing about
  my ability to point is doing any work in the truth of the claim. She then proposed
  a test to make ''qualitative'' non-circular — a property counts as genuinely qualitative
  iff it''s had by the same things in any world that duplicates this one exactly,
  where duplication is cashed out purely in terms of how things are. And she said
  that once you define it that way, Tobias''s complaint dissolves into a verbal dispute:
  the two of them agree completely on what worlds there could be and on everything
  true in them, and they''re only disagreeing about whether ''there are two'' is a
  further, non-qualitative fact. Tobias said the test is useless in exactly the cases
  it was built for, because a duplicate of a symmetric world just is that symmetric
  world, so nothing in it can fail the test.


