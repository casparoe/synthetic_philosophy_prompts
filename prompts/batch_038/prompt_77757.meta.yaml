  \ know M's program, we can recognize that M doesn't prove G(M), and hence that G(M)\
  \ is true, whereas M can't prove it. So the mind exceeds M. Penrose's version uses\
  \ soundness: if the mathematician knows that M is sound (all its outputs are true),\
