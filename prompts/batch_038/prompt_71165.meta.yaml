  A nice concrete situation combining several: A city official/administrator of a
  municipal benefits program. Let me craft:


  "I administer a municipal fund that pays for job training and language classes.
  Eligibility currently requires five years of legal residence, on the theory that
  people who have paid into the payroll levy that finances the fund should get back
  from it. Last month a group of newly arrived families — legally resident for eleven
  months, working, paying the same levy from their first paycheck — asked to be enrolled.
  Our budget is fixed: enrolling them means cutting places for long-resident applicants,
  many of whom are disabled or older and never paid much in. My deputy says the newcomers''
  claim is stronger because they''re paying now and have the most to gain; my chair
  says it''s unfair to people who built the fund and were promised it would be there
  for them. Both keep invoking fairness, and I keep flip-flopping. I''ve realized
  we may be applying two different principles and never saying so. Which principle
  should govern a fund like this, and does the five-year rule survive it?"


  This instantiates: reciprocity/contribution-based entitlement (Sangiovanni, Miller''s
  "cooperative scheme" view) vs. need vs. legitimate expectations/promise-keeping
  vs. "fair play" — and also the "moral arbitrariness of residence duration" and the
  Sorites-like line-drawing. The good answer recognizes: (i) the contribution principle
  (benefits proportional to contributions), (ii) the legitimate expectations/trustee
  argument (past contributors promised), (iii) the needs/urgency principle, (iv) the
  associative-obligation view of welfare-state membership, (v) whether the levy is
  a social-insurance scheme (actuarial) or a redistributive social provision (need-based)
  — that''s the key distinction that resolves the impasse: the fund''s nature determines
  which principle applies. Also the "self-defeating exclusion" argument: excluding
  working newcomers from training reduces their future contributions, so a long-run
  contribution principle favors inclusion — a nice dynamic wrinkle.


