  \ that. Actually — let me consider combining: the alignment-problem one has the\
  \ advantage of being about \"what exactly is being asked, and is it one problem\
  \ or several,\" which fits the \"specify verdicts\" structure nicely: specify that\
  \ a standard taxonomy (outer/inner alignment) must assign the failure to both categories\
  \ at once or neither. That's a nice engineered result.\n\nLet me weigh which yields\
  \ the best prompt. The function one: I'd ask for a case where the selected-effects\
