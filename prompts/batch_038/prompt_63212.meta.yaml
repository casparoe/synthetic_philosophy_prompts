  Draft:


  "I write a column on science and ideas, and I''m finishing a long piece about whether
  it makes any sense to call DNA a code. I want to close it with a commissioned poem,
  and I''d like you to write it. Please treat the following as the brief.


  The poem is an address from the reading machinery to the thing being read — a collective
  ''we'' (the adapters, the synthetases, the ribosome: you don''t need to name them)
  speaking to a sequence it has spent four billion years decoding. That framing is
  the argument: in this transaction there is no sender, no one on the other end for
  whom the message was intended, only a reader that built its own key and then called
  the key the message''s meaning.


  Form. Twelve tercets plus one orphan line inserted somewhere between the sixth and
  ninth tercet — thirty-seven lines in all; you may drop or add one tercet if the
  sense demands it. Each tercet rhymes only on its third line, and the third-line
  rhymes link stanza to stanza in a chain; the links may be slant, near, or vowel
  rhymes, and near-rhymes should be treated as identical — that''s the wobble, the
  degeneracy, several different spellings landing on the same amino acid. The orphan
  line is a frameshift: after it, the chain re-pairs so that recurring words now fall
  in different positions and carry different force. A reader who isn''t following
  the genetics should simply feel the ground move. No punctuation within tercets —
  the code has no commas, and the reader must know where to begin. The first word
  of the poem must recur later, mid-sequence, as an ordinary word: the same token
  serving as begin-here and as just another residue. And the poem must stop on a line
  whose final word has already appeared twice earlier in a stop function, so that
  it''s clear the stopping is read, not written.


  Content, in the weeds but never lectured. Synonyms that aren''t quite synonyms:
  two codons for the same residue that are not interchangeable once the cell''s tempo,
  folding, and mRNA structure are in play. The dialects: the same triplet read as
  stop in one lineage and as an amino acid in another, in mitochondria and ciliates,
  so that there is no single universal key. The frozen accident: no evident reason
  for this pairing rather than another, and no way back now, because everything downstream
  depends on it. And the reader''s own complicity — that the key is a chemistry, that
  nothing was sent, and that ''information'' may be our word for a regularity we learned
  to exploit.


  Register. Use only technical words that are also ordinary English words doing ordinary
  work in the line: frame, stop, silent, adapter, degenerate, wobble, read. Don''t
  name anyone, don''t cite anything, don''t quote a real text — if a line needs quotation
  marks, invent what''s inside them. Don''t resolve the question of whether DNA is
  genuinely a code or a metaphor that hardened into ontology; the closing tercet should
  leave both readings live.


  Before you send it, check that the frameshift really re-groups the recurring words,
  and that the last three lines would still be true of a sequence with no interpreter
  anywhere near it."


