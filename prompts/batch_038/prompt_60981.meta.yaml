  Six weeks ago my marriage ended, and the part I have not been able to get past is
  not the ending but the six years that preceded it. In the middle of it all, a friend
  of mine — she teaches philosophy of mind, and she is the sort of person who keeps
  lists — produced a list of eleven things she had said to me between 2019 and 2024,
  each of which I had answered, sincerely, with some version of "he''s under a lot
  of pressure right now." My therapist has a word for what she thinks I was doing
  and I don''t trust it; my friend, more usefully, told me to write the cases down
  and see whether I was applying one standard or several. So I have a file. It contains
  my own case and about a dozen others, some invented, and I have sorted each into
  self-deception and not self-deception, and the sorting now looks like it has a shape
  I cannot state.


  The file. A man who insists there is nothing to suspect and who has checked his
  partner''s phone weekly for two years, always finding nothing, which he takes as
  confirmation: self-deception, clearly. A woman whose partner has stopped initiating
  intimacy, who says it is work stress, who has looked for no evidence either way
  and has organized nothing around not finding it out: not self-deception, though
  from outside it is hard to say what distinguishes her from the phone-checker except
  that she hasn''t started checking. A person with a lump who decides not to think
  about it until the biopsy result arrives, and who genuinely does not: not self-deception
  — because she booked the appointment and intends to read the result. The same person
  after the appointment has lapsed twice: self-deception; same belief, same motive,
  only her behavior around the evidence has changed. Someone whose partner really
  is faithful and who believes it, but believes it by leaving a letter unopened and
  steering every conversation elsewhere: still self-deception; being right does not
  clean it. A friend who says she remains at a collapsing organization out of loyalty
  to colleagues and who has turned down two better offers without reading them: self-deception,
  and note that what she wants is not that the proposition be true but to see herself
  as loyal, so any principle stated in terms of desiring the content of one''s belief
  comes out wrong here. A parent who says her child''s poor recital was lovely: not
  self-deception, because that is not a belief report at all — which tells me the
  principle needs a clause about assertions versus expressions of attitude, or it
  will sweep this in. An investor who received three written warnings, filed them
  unopened, and later says with complete sincerity that he never saw any warning signs:
  self-deception, and his later avowal is not a lie, so sincerity of self-report is
  no test in either direction. A department that has described the same doomed program
  as "transitional" for eleven years: I don''t know whether this belongs in the file
  at all, since I suspect group self-deception is only ever a metaphor, and if my
  principle is going to have to handle it literally I''d rather know now.


  My own tentative principle, which I expect is wrong: self-deception is what happens
  when a person''s motivation leads them to bring about and sustain the evidential
  conditions under which a comfortable belief gets formed — that is, the work is done
  upstream, in what one attends to, gathers, and reads, rather than in a mysterious
