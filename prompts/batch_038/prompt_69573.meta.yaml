  I am in the fourth year of a novel one of whose principals is a researcher in the
  science of consciousness — a woman whose clinical work is with patients who have
  lost the ability to speak but not, she is convinced, the capacity to have it be
  like something to be them. I want her to sound like someone who does this work rather
  than like my paraphrase of an encyclopedia entry, so I have been reading the trade
  literature, and in one well-reviewed popular book on the mind I found a passage
  I have been planning to put, nearly word for word, in her mouth: a scene in which
  she explains her method to a graduate student who has been reading her critics.
  Before I write it, I need to know whether the passage is a fair account of what
  it describes or the sort of thing that would make a specialist set my novel down.


  The author is no crank and appears to have no axe to grind; he is summarizing heterophenomenology,
  the method Daniel Dennett proposed for the science of consciousness, and this is
  roughly what he says:


  "Dennett''s proposal is disarmingly modest. Treat a person''s talk about their inner
  life the way you would treat anyone''s testimony about something you cannot check:
  as data, not as truth. Assemble from the subject''s utterances and behaviour a text
  — a description of the world as it appears to that subject — and study that world
  instead of trying to peer behind it. What makes this possible is that the method
  takes no stand on whether the things described actually exist. When a subject reports
  a throbbing red afterimage, you record that the world according to this subject
  contains a throbbing red afterimage, exactly as you would record that the world
  according to a devout person contains an answering God. Hence the method''s great
  virtue: it is unobjectionable. Because it suspends judgment on the reality of experience,
  it cannot be turned into an argument that there is no such thing as qualia; any
  such argument must be doing something else, smuggled in from outside. Its sharpest
  critics can therefore accept the method while rejecting Dennett''s conclusions.
  The one real cost is that the method depends on speech, and so has nothing to say
  about animals, infants, or patients who cannot talk — a limitation its proponent
  concedes. What remains is a domain of items that are genuinely there, though not
  physically so: the things experiences are of, which exist as contents, in the manner
  of the objects of dreams."


  My request: take that passage apart and tell me where each part of it stands. Which
  claims would a philosopher who works on this method accept as they are put? Which
  are honest simplifications — costing precision but misstating nothing? And which
  are wrong in a way that matters, where I would want to know what the view actually
  holds instead, so that I know what I am cutting? I am most interested in three places.
  First, the inference from the method''s neutrality to its harmlessness: does bracketing
  the question of whether the reported items exist really leave the method incapable
  of supporting any conclusion about qualia, and does the claim that its critics can
  all sign up to it follow? Second, the remark about speech. Third, whether the final
  sentence — that the contents are genuinely there but not physically — describes
  a commitment anyone in this debate holds, or a realm the view was invented to dissolve.
  And having corrected the passage, tell me whether the author''s headline conclusion
  survives the corrections, or whether it was resting on them.


  For what it is worth, I am inclined to believe him, both because he is careful elsewhere
  and because his account flatters something I want for the book: that my character
  and the phenomenologists who accuse her of simply declining to look share a method
  and differ only about what it shows. If the passage cannot carry that hope, I would
