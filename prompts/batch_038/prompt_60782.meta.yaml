  My dad had a big left-side stroke in March. He''s mostly non-speaking now — he can
  get out a handful of words, and the clinic gave him a speech tablet that he mainly
  uses to curse at. I''ve been reading Dennett on the four kinds of creatures (Darwinian,
  Skinnerian, Popperian, Gregorian) partly to figure out what to expect from him,
  and somewhere along the way I built an argument I now can''t accept but also can''t
  break. Be honest with me about where it''s bad.


  (1) The tower isn''t about brains or hardware. What puts a creature on the Gregorian
  rung is that it has taken in externally designed thinking tools — words first, then
  writing, arithmetic, calendars, spreadsheets — and can use them to solve problems
  the other three kinds can''t even pose.

  (2) So where a creature sits is settled by its toolkit: strip out the tools and
  you strip out the rung.

  (3) If the tools are the whole of what makes a mind Gregorian, there''s nothing
  left over to keep the mind on that rung once the tools are gone.

  (4) My dad has lost the main one. He can''t find words, can''t hold a sentence with
  a subordinate clause in it, can''t read the labels on his tablet without guessing.
  What''s left — pointing, drawing a picture of what he wants, reading my face, learning
  that the blue tile gets him coffee — looks like Skinnerian learning with maybe a
  bit of Popperian lookahead.

  (5) So my dad has been demoted two rungs. He isn''t a Gregorian creature any more.

  (6) But (2) doesn''t stop at him. I''ve forgotten most of the Spanish I had, I can''t
  do long division in my head, I can''t read music, and I never installed the tools
  a physicist or a contract lawyer thinks with. By (2) I''m a partial Gregorian at
  best.

  (7) And it runs forwards as well as backwards. Whatever tools people fifty years
  from now will have installed from birth, I won''t have them, so relative to them
  I''m demoted too. Since there''s always a next batch of tools, there is no top rung
  — the taxonomy is defined by an endpoint no creature can occupy.

  (8) So either the tower doesn''t sort creatures at all, because everyone is a bit
  of every rung and the rungs have no boundaries, or it sorts them properly and my
  dad really is two rungs below me. And neither horn is anything I can use: on the
  first, it tells me nothing I couldn''t get from the therapist''s own chart of what
