  Now, how does Rousseau''s view of theater bear? Key doctrines from the Lettre à
  d''Alembert (1758):

  - Theater is not morally neutral: it cannot improve morals; plays reflect and flatter
  the tastes and mores of their audience. "Le théâtre est fait pour parler aux yeux"
  etc.

  - Argument against catharsis: Aristotle''s purgation is unintelligible; theater
  purges only the passions we don''t have, and by making us weep for imaginary woes
  it discharges the pity we''d otherwise act on — a "sterile pity" that lets us be
  virtuous cheaply. Rousseau says the theater satisfies our moral sentiments at little
  cost (something like: after weeping at the play, we''ve done all our duty).

  - Plays can only reinforce existing dispositions: Molière''s Misanthrope makes the
  honest man ridiculous and the worldly man sympathetic.

  - Economic/social costs of a theater in a small republic: idleness, expense, luxury,
  the loss of time that in a small city is a public harm; in a large corrupt city
  like Paris, a theater is a good thing because it keeps people from worse amusements
  (he says plays are useful in Paris, harmful in Geneva).

