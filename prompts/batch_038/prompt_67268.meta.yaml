  - R1 (Specification): a contrastive question is well-posed iff both terms name a
  determinate unit, a determinate period, and a determinate outcome. → predicts: accept
  the new case if it names units/dates/outcome, even if graded.

  - R2 (Discreteness): the outcome must be an event or a change with a determinate
  onset, not an open-ended process with a contested threshold. → predicts: reject/revise
  the new case (take-off has no threshold).

  - R3 (Comparability/relevant similarity): the foil must be shown to be similar to
  the fact in the respects that matter prior to the divergence; otherwise you''re
  not asking why P rather than Q, you''re just noting two different histories. → predicts:
  accept the new case (author did the similarity work), and it also explains precedent
  3''s revision request (the two sides weren''t comparable alternatives).

  - R4 (Robustness to unit choice / the comparison-class problem): the question is
  well-posed only if the answer survives reasonable re-specification of the units;
  if the answer flips when you swap England for Britain or the Yangzi Delta for China,
  the question is a hostage to the units chosen. → predicts: revise/reject the new
  case ("Britain" vs "England", "China" vs a region).


