  Verdicts:

  - R1 (specification): accept — units, dates, outcome, comparability all specified.

  - R2 (discreteness/determinacy of onset): reject or major revision — the explanandum
  is explicitly a matter of degree with no threshold, so "why P rather than Q" has
  no determinate fact.

  - R3 (comparability): accept — the author has done exactly the work R3 demands.

  - R4 (robustness to unit choice): accept — the author has addressed and defended
  the unit choice (the best-case for R4''s charitable reading).

  So the split is R2 vs {R1,R3,R4}. Only one rule on the reject side — that''s a bit
  lopsided. Better to have two rules pointing each way. Let me add a rule:


  - R5 (Answerability/explanatory relevance — the "surprise" or "so what" rule): a
  contrastive question is well-posed only if the contrast isolates a difference that
  could have been otherwise at a specifiable juncture — i.e., there must be a genuine
  fork in the road where both outcomes were live. If the divergence was locked in
  by conditions centuries earlier, the question is really "why were the two regions
  already different in 1750?" and the stated contrast is a placeholder. This predicts
  revision, because the author''s own comparability argument (things were similar
  in 1750) helps, hmm, actually comparability supports the fork being genuine. Let
  me flip: R5 says the contrast is well-posed only if the two histories were *already*
  sufficiently similar up to the fork — that IS R3. So I need something else.


  Alternative rule: R5 (Modal/counterfactual accessibility): the question is well-posed
  only if the foil was a real historical possibility for the unit in question — i.e.,
  China could have industrialized first — and the author must show the foil wasn''t
  nomologically/practically impossible given the society''s own structure. If the
  foil is impossible in principle, "why P rather than Q?" is a rhetorical question.
  This predicts: revision — because the author establishes comparability but not the
  accessibility of the alternative for the Yangzi Delta (comparable in 1750 ≠ able
  to do what Britain did). That''s a nice substantive rule, distinct from R3, and
  gives a second reject/revise-side rule. And it''s a real issue in the Great Divergence
  debate (Pomeranz''s "ghost acres"/coal argument is precisely about accessibility
  of the alternative).


  So now:

  - Accept-side: R1, R3, R4.

  - Revise/reject-side: R2 (no threshold for a graded explanandum), R5 (foil not shown
