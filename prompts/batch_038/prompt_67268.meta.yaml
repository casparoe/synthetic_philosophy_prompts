  voyages after 1433 while Portugal pushed down the African coast?" — the board noted
  the two sides are not obviously comparable alternatives (one is a state decision
  to stop, the other a gradual private/crown enterprise), and asked the author to
  specify what single decision point the contrast turns on.

  4. Rejected: "Why didn''t China have an industrial revolution?" — the board''s note:
  the explanandum is a centuries-long graded process, and there''s no determinate
  fact about what would count as China "having" it.

  5. Accepted: "Why did real wages diverge between London and Beijing after 1750 rather
  than before?" — graded outcome but a specified comparison and a specified time of
  change.


