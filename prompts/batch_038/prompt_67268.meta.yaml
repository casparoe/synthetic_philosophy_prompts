  Setting: I''m on the editorial board of a journal of comparative economic history;
  we screen submissions for whether the research question is well-posed before sending
  to referees. Reported verdicts:


  1. Accepted for refereeing: "Why did mechanized cotton spinning take off in Lancashire
  in the 1780s rather than in the Yangzi Delta in the same decade?" — both sides are
  specified regions and the same decade.

  2. Rejected: "Why did the West rise and the East stagnate?" — no dates, no unit,
  "stagnate" contested.

