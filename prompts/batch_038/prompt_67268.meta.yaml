  That''s a tension that lets two rules coexist: rule A = "the contrast must specify
  unit + date + comparable decision point" (procedural); rule B = "the outcome must
  be a discrete event, not a graded process" (ontological); rule C = "the foil must
  be surprising relative to a plausible baseline — i.e., the two cases must have been
  similar enough beforehand that the difference needs explaining" (the "like-cases"
  or "Mill''s methods" rule: valid comparison requires relevant similarity); rule
  D = "the question is well-posed iff the answer would be robust to re-specifying
  the units" (unit-sensitivity / the choice-of-unit problem).


