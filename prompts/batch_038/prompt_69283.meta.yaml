  Hmm, that''s "consistency" not "refutable".


  Alternative false consequence: use the fact that in second-order logic with full
  semantics, the comprehension+choice is not logically valid — e.g., in a structure
  whose "second-order domain" lacks a choice function. Actually the cleanest: consider
  a model/set-theoretic universe where there IS a family of nonempty sets with no
  choice function (a model of ZF+¬AC, which exists if ZF is consistent). In that universe,
  step (1) is true and step (2)''s premise holds for the family, yet no function exists.
  So step (2) cannot be "just logic" — logic is truth-preserving across all universes/models,
  and here''s a universe where (1) holds but (2)''s conclusion fails. Hence (2) is
  not logic; it''s a substantive claim about the set-theoretic universe. That''s the
  diagnosis, and it''s basically right: the flaw is the equivocation between "there
  is a y for each x" (first-order, and provable) and "there is a single object F collecting
  all these choices" (which requires the range of the function quantifier to include
  such an object — a set-existence/comprehension assumption, not logic). Also, the
  plural-quantification reading (Boolos): the inference is valid if you read "function"
  as a plural quantification over the many, i.e., the "for each x there is a y" already
  gives you, plurally, the assignments; the issue is whether they form a SET. In class
  terms (NBG), global choice is a separate axiom precisely because the inference gives
  you at best a class-function, and its existence as a class needs more.


  So a good answer: the equivocation is between "for each there is some y" and "there
  is an object (set) that encodes all the choices"; (2) is not logic but a set-existence
  principle (a choice principle); it fails in models of ZF+¬AC, which shows it''s
  not truth-preserving-in-all-universes; and what rejecting (2) costs: you can''t
  get AC for free, you must take it as an axiom with substantive content, and the
  "constructivist is confused" charge dissolves into a real disagreement about the
