  the facts can''t make a difference to whether one''s belief is accurate or well-supported.

  (6) Also: if you can lose knowledge by caring more, then the more responsible/careful
  you are, the less you know — which is perverse, since careful agents are the ones
  who should know most.

  (7) So pragmatic encroachment is false; stakes don''t encroach.


