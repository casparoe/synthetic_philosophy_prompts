  an ordinal and y = x" — the class function is proper, fine, no contradiction. Need
  something where step 2 applied yields a contradiction. Classic: In ZF, "for every
  nonempty set there is an element" gives, via step (2) as a set-existence principle,
  a set-sized choice function on the class of ALL nonempty sets — which is a proper
  class, contradiction with "every function is a set". Also: take φ(n, y) := "y is
  a subset of the reals of cardinality ..." hmm.


