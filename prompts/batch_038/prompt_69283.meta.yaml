  (2) If a statement of the form ∀x∃y φ(x,y) is provable, then so is ∃f∀x φ(x,f(x))
  — the move from "for each there is one" to "there is a function choosing one for
  each" is just what the function quantifier means; a function is nothing but a rule
  assigning to each x a y with φ(x,y), and (1) says there''s one for each x.

  (3) Applying (2) with φ(x,y) := "x is nonempty and y ∈ x" gives: there is a class/function
  F with F(x) ∈ x for every nonempty x.

  (4) That is the axiom of choice (indeed, more: global choice).

  (5) So AC is a theorem of pure logic + the meaning of "function," and any system
  that can''t prove it (ZF) is defective — ZF just has a too-narrow notion of function,
  identifying functions with sets of ordered pairs.

