  Let''s write out numbered steps:


  (1) "For every nonempty set x there is a y in x" is a theorem of logic (from ∃y
  (y ∈ x) infer something; it''s an instance of existential instantiation... careful,
  the formal statement: ∀x(x≠∅ → ∃y(y∈x)) is provable in ZF without AC). Yes — that''s
