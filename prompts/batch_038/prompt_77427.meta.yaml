  Structure:

  - Casual professor voice, opening with what they''re doing (teaching a grad seminar
  / building a problem set on inherited national guilt) and complaining that all the
  usual examples are the same.

  - The design request: a case where a fictional present-day state does something
  ongoing and harmful, and one specific descendant/citizen who (i) voted and campaigned
  against it, (ii) gained nothing and in fact lost, (iii) protested publicly and effectively-ish,
  still bears political guilt in Jaspers''s sense but not moral guilt — and the two
  verdicts must come apart in a way that can''t be collapsed into "political guilt
  is just liability, not blame" or into benefit/agency/consent.

  - The control: a foreign counterpart who does all the same things and bears no political
  guilt. Name the difference.

  - Constraints: fictional states, no real countries, no genocide/slavery/holocaust
  analogues, present-day institutional setting (resource concession, a dam, a debt
  regime, a border enforcement contract, a land lease), scenario one paragraph, no
  sci-fi, no citations/bibliography.

  - Say what it''s for: testing whether political guilt is a freestanding category
  or a placeholder for benefit/agency grounds. So cheating = smuggling in benefit,
  causal contribution, tacit consent, or epistemic negligence.

  - Deliverables after the scenario: the walkthrough (what Jaspers''s political guilt
  says and why, what moral guilt says and why the verdicts differ), the named difference
  between citizen and foreigner and whether it''s a relation to the state''s power
  or something else, which feature does the work, what happens if you remove it, and
  how a strict individualist would attack the case, plus a note on whether the attack
  succeeds.

