  Draft:


  ---


  I''m building a problem set for my grad seminar on inherited national guilt and
  I''m sick of the examples everyone uses — they all end up being the same case with
  the names swapped, and the students have seen the moves a hundred times. So I want
  you to design one for me to spec.


  Here''s the spec. Jaspers splits guilt four ways — criminal (courts), political
  (what your state does in your name, judged by whoever ends up winning), moral (your
  own deeds, judged by your conscience and by the people who know you), metaphysical
  (the bare fact of being a human among humans who didn''t all survive). I want a
  case that drives a wedge between the second and third of those.


  Concretely: give me a fictional present-day state carrying out some ongoing institutional
  harm — a resource concession, a dam, a debt regime, a border-enforcement contract,
  whatever you like, but invent it — plus two individuals:


