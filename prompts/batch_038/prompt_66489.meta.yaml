  ribosome (no), a mitochondrion isolated (no), a bacterial spore dormant for 10,000
  years (yes), a tardigrade in tun state (yes), a HeLa cell line (yes), a self-replicating
  computer virus (no), a synthetic minimal cell (yes), a protocell that grows and
  divides but doesn''t evolve (yes? no?), a population of molecules under selection
  in a test tube (yes? no?), fire (no), a crystal (no), a city? Hmm.


  Better: make the verdicts jointly consistent with more than one plausible rule,
  and the new case such that at least two rules diverge. Candidate rules for "alive":

  - Rule A: metabolic autonomy + self-maintenance (autopoiesis): must be a self-producing,
  bounded system that takes in free energy and maintains itself against equilibrium.

  - Rule B: capacity for Darwinian evolution by natural selection (heredity + variation
  + differential reproduction) — evolution-first (NASA''s "self-sustaining chemical
  system capable of Darwinian evolution").

  - Rule C: individuality/organismal unity — must be a discrete, countable, self-bounded
  individual that can die.

  - Rule D: information-based: must encode and use hereditary information (genome)
  with a division of labour between genotype and phenotype.

  - Rule E: something about being composed of cells (cellularism).


  Good tension: evolution-first vs autopoiesis-first diverge on e.g. mules (sterile
  organism — autopoietic, individual, metabolises, but cannot evolve — classic case:
  a mule is alive but doesn''t undergo Darwinian evolution as a lineage) vs a population
  of self-replicating RNA molecules in a test tube (evolves, but each molecule isn''t
  autopoietic) vs a prion (self-propagating, arguably "replicates" with variation
  and selection, but no metabolism and no genome).


  So design a set of verdicts that fit both rules, then a new case where they diverge.
  Let''s construct a figure: say, a chair of an astrobiology mission''s "biosignature
  panel" or a textbook author... Actually let''s make it a person: "My doctoral supervisor"
  or "the curator of a natural history museum''s new ''What is Life?'' gallery". The
  curator version is charming and concrete: which exhibits go in the gallery.


  Let''s use a curator of a museum gallery titled "Life?" who has ruled on which specimens/displays
