  spore, the mitochondrion, the prion).

  2. Predict the curator''s verdict on the new case with reasons, and recommend what
  the panel should say to remain consistent with the record.

  3. Identify the closest analog among the precedents and explain why it isn''t dispositive.

  4. Name the principle we would be adopting with each choice (what we''d be committed
  to).

  5. Propose a further case or test that would discriminate the rules — ideally one
  that doesn''t require the new sample.


  Also good to ask: which precedent, if reversed, would most simplify the rulebook?
  Or: is the record genuinely underdetermined?


