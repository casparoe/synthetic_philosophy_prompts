  Let me settle the precedent list carefully so that at least two rules fit all of
  them:


  Rules to keep alive:

  - R_met (metabolic/self-maintenance): alive iff the thing, taken as a bounded whole,
  actively maintains itself away from equilibrium by transforming matter and energy
  — with a dispositional clause allowing dormancy.

  - R_evo (Darwinian lineage): alive iff the thing is or belongs to a lineage with
  heritable variation subject to selection — with a "self-sustaining" clause excluding
  viruses.

  - R_cell (cellular organisation): alive iff it is a cell or built of cells with
  a division of labour among them.

  - R_prog (hereditary program / genotype-phenotype): alive iff it carries hereditary
  information that directs its own construction.


  Precedents and how each rule handles them:


  1. Purified bacteriophage in a vial → not alive. All agree.

  2. Same phage mid-infection inside a bacterium → not alive. R_evo needs the "self-sustaining"
