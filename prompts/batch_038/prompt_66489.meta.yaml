  1. A herbarium sheet (dried pressed plant, dead) — no, not alive, though it was.

  Hmm, that''s easy. Let''s build a track record with hard cases:


  - Bacterial spores from permafrost, 30,000 years dormant, revived in the lab: ALIVE.

  - Tobacco mosaic virus purified in a crystalline vial: NOT ALIVE.

  - Tobacco mosaic virus actively replicating inside a plant: still NOT ALIVE (this
