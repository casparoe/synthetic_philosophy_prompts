  I think "What is life? Definitions and borderline cases" combined with the verdict-prediction
  type works nicely: a researcher/admissions-committee-like figure — e.g., a NASA
  planetary-protection officer, or an astrobiology panel deciding whether candidate
  objects count as "life" for detection purposes. Or a journal editor deciding whether
  to include entries in an encyclopedia of "living systems". Or a curator deciding
  which exhibits belong in a museum gallery titled "Life".


