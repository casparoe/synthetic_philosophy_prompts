  So maybe better: have the two main candidate rules be:

  (R1) Evolution-capacity: an entity is alive iff it belongs to, or is capable of
  participating in, a Darwinian lineage (heredity, variation, differential reproduction)
  — with the chemical requirement.

  (R2) Autopoiesis/self-maintenance: an entity is alive iff it is a bounded, self-producing
  system that maintains itself far from equilibrium by its own activity.

  And a third (R3) cellularity / organised-individuality: alive iff it is a cell or
  a system of cells forming an organism.

  And a fourth (R4) genetic-program view: alive iff it runs a hereditary information
  program directing its own construction.


  Design verdicts so that R1 and R2 both fit, R3 fits too with effort, and then the
  new case splits them.


  Verdict set:

  1. A vial of purified bacteriophage: NOT ALIVE. (All rules agree.)

  2. Same phage mid-infection, hijacking a bacterium, replicating: NOT ALIVE. (R1:
