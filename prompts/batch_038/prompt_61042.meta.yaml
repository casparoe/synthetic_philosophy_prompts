  Third year in a philosophy PhD, bioethics-ish corner of things. I''ve got a pattern
  in the treatment/enhancement literature that I can''t find a label for, and I want
  to know if one exists or if I have to make one up.


  Here''s the thing I keep seeing. The line between therapy and enhancement is usually
  drawn by appeal to some baseline of normal functioning — roughly, if an intervention
  brings you back up to the normal range it''s therapy, if it pushes you past it,
  it''s enhancement. Fine. But the baseline isn''t fixed, it''s a fact about the population.
  So when lots of people get treated, the population''s normal shifts, and the line
  moves with it. And the kicker is that the line moving changes the classification
  of the very same intervention later on, without anyone arguing about it or deciding
  anything.


  Two examples I''ve been collecting:

  - Height. A kid at the 1st percentile gets growth hormone, clearly therapy, restoring
  normal function. A couple of decades of that plus better nutrition moves the distribution,
  and now a kid at the 10th percentile is being called short, gets referred, and it''s
  still being logged as therapy — but the threshold that made it therapy in the first
  place has quietly slid down. Same protocol, same rationale, different verdict about
  what counts as deficient.

  - Cognitive stuff. Once a decent fraction of grad students are on stimulants, the
  amount of sustained focus that counts as "what a normal person can do" goes up,
  and the students who aren''t medicated start looking impaired relative to their
  peers. The baseline that was supposed to tell us whether they need help has been
  manufactured by the helping.


  So it''s not just that the boundary is vague or contested, which is the complaint
  everyone makes. And it''s not that each generation moves the goalposts on purpose.
  It''s that the criterion is defined in terms of an aggregate that the individual
  applications of the criterion change, so the more successfully you use it, the less
  it means, and the drift is invisible from inside because each step looks like a
  correct application.


