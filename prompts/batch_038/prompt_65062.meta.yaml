  with a general''s military one). This supports a procedure element: compare within
  a dimension, not globally.

  3. The distinction between using a life as evidence for a claim about a trait, as
  an object of admiration, and as a model for imitation — three different uses with
  different evidential burdens. Admiration attaches to the whole person; imitation
  attaches to particular choices; admiration may be "tracking" something (Zagzebski)
  but can be corrupted by the admirer''s own interests.

  4. The problem of the "flawed exemplar": separating the admirable feature from the
  person''s other features; whether one can admire a part; whether admiration of a
  person who did great evil risks normalizing it; the difference between "admirable
  in respect R" and "admirable."

  5. Circumstances and moral luck: what the person could not choose (their era''s
  norms, their options), so the procedure must ask what alternatives were actually
  available — a life read anachronistically teaches nothing actionable.

  6. The record problem: sources are either hostile or reverent; the surviving record
  for ancient lives is often just anecdotes with no independent check; the procedure
  must state what a story can support even if it''s apocryphal (e.g., a legend can
  be used to show what a community took to be admirable — that''s a legitimate, different
  use).

