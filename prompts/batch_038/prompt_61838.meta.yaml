  Draft commitments:


  1. I accept the Reflection principle in roughly van Fraassen''s form: whatever I''m
  confident my future self will believe, I should now believe — if I''m now sure that
  at 70 I''ll think this book was a mistake, I should think so now. (Careful: Reflection
  is about credence in "future me will believe p to degree y" → conditional credence
  in p = y.)

  2. But I also hold that my credences should never be changed except by conditionalizing
  on evidence I actually get — no belief revision by anything else, i.e., strict Bayesian
  conditionalization as the only legitimate update rule.

  3. I think people systematically acquire bad evidence and self-induced biases over
  a lifetime: by 70 I expect to be vain, tired, and to have talked myself into things.
  I count on it as a novelist — my characters always do it.

  4. I don''t think there''s any deep fact about whether the 70-year-old is the same
  agent as I am — I''m a moderate/pragmatist about personal identity, it''s just psychological
  continuity in degrees.

  5. I think diachronic Dutch books (being guaranteed to lose money across time by
  my own combination of bets) show something genuinely bad about me — I don''t want
  to be a sure loser.

  6. Also I think there''s nothing wrong with forgetting: I''ve forgotten lots of
  things and I don''t think I was irrational to do so; memory loss is not irrationality.


  Tensions:

  - (1)+(2)+(3) is the real crunch: Reflection is licensed by expecting your future
  self to update only by conditionalization; if you expect your future self to be
  corrupted by bias/self-deception, Reflection tells you to adopt those corrupt beliefs
  now, which is a reductio — but the resolution isn''t that Reflection is false; rather
  that (3) undercuts the warrant for (1). Actually there''s a subtlety: Reflection
  is standardly justified by the diachronic Dutch book argument which assumes conditionalization;
  if you expect non-conditionalizing updates, then a Dutch book exists but... hmm.
  Let''s think again.


  The standard story: If you expect your future credences to arise by conditionalization
  on your future evidence, then violating Reflection makes you vulnerable to a Dutch
  book (given you''ll accept bets now and later). Conversely, if you expect your future
  self to change beliefs irrationally (e.g., a drug, or self-deception, or forgetting),
  then you can violate Reflection without being Dutch-bookable — because the future
  self won''t accept the second bet, or because the coherence argument doesn''t apply.
  So the tension between (1) (unconditional Reflection) and (3) (expecting future
  corruption) is real: you can''t both expect your future self to be biased and defer
  to them. And (2) (strict conditionalization as the only permissible update) actually
  *supports* Reflection — conditionalization + trust in future self = Reflection.
  So (2) is in tension with (3): if I expect my future self to be vain and to talk
  myself into things, then I expect my future self NOT to conditionalize, which contradicts
  my claim that credences should never change except by conditionalization... well,
  careful — (2) as a normative claim ("credences should only change by conditionalization")
  is compatible with expecting future me to violate it. But combined with (1), it
  forces deferral. Hmm, actually (2)+(1) is coherent; the problem is (1)+(3).


  Actually there''s a more interesting and less obvious tension: (1) Reflection +
  (6) forgetting. If you expect to forget evidence, your future credences won''t be
  conditionalization-derived, so Reflection can fail. But (6) says forgetting isn''t
