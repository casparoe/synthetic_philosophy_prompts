  I''m a novelist, no formal philosophy training beyond what I''ve picked up, and
  I''m about three years into a book whose whole engine is one consciousness at two
  ages — the narrator at 26 and the same narrator at 74, chapters alternating, and
  the trick is that the old one has strong opinions about what the young one ought
  to think and vice versa. Before I let the 74-year-old voice my actual view of this
  in the manuscript, I want someone to check whether the view I hold is even self-consistent,
  because right now I can''t tell. Here''s what I believe, honestly stated:


  1. Van Fraassen''s Reflection principle is right and I mean to live by it: to the
  extent I''m confident what I''ll believe later, I should believe that now. If I''m
  now quite sure the 74-year-old me will regard this book (and a few people in it)
  as a mistake, that''s a reason to regard it as a mistake today, not a reason to
  wait.

  2. The only legitimate way for a credence of mine to change is conditionalizing
  on evidence I actually get. No other belief-change mechanism gets a pass — not mood,
  not loyalty, not "I just came to see it."

  3. But I also firmly expect my future self to be worse than my present one in specific,
  predictable ways: more vain, more tired, more invested in the stories I''ve already
  told about myself. My characters do this constantly; I''d be a hack if I pretended
  I''m exempt.

  4. On personal identity I''m a softie: no deep fact, just psychological continuity
  in degrees. Whether 74-me is "really" me is a vague question, and I don''t lose
  sleep over it.

  5. Diachronic Dutch books bother me. If a combination of bets I accept now and later
  guarantees I lose money, I take that as showing something genuinely defective about
  my beliefs, not as a curiosity about betting.

  6. Forgetting is not irrationality. I''ve forgotten huge amounts and I don''t think
  any of that was a failing on my part; a memory that leaks is not thereby an incoherent
  mind.

  7. And the one I''d fight for as a novelist: the best moments in a person''s life,
  and the best scenes in fiction, are belief changes that aren''t evidence-driven
  — grief, love, a deathbed reversal, somebody seeing the light. I think those are
  sometimes genuinely better, epistemically better, than sitting still.


