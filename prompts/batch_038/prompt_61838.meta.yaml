  Interesting combination: A novelist''s commitments about self-deception — a novelist
  who writes unreliable narrators. The self-deception paradox (Davidson''s paradox)
  says self-deception seems impossible: it requires simultaneously believing p and
  not-p, and intentional deception of oneself. A novelist could list commitments:
  (1) I believe self-deception is real and I write characters doing it; (2) I think
  the self isn''t unified — it''s partitioned (Davidson''s divide-and-conquer approach);
  (3) but I also think a good character must know something they don''t know... etc.


  Alternatively: a novelist''s commitments about luck egalitarianism? Hmm, less natural.


  Another: a novelist who holds commitments about epistocracy vs democracy — e.g.,
  believes expertise should rule, but believes democracy is valuable partly because
  of its epistemic properties, and believes something about the value of authorship/narrative...


  Or: Van Fraassen''s Reflection principle — a novelist who is interested in future
  selves: "I should now defer to my future self''s beliefs" (Reflection: your current
  degree of belief in "I will believe p at time t" should equal your current degree
  of belief in p at t, conditionalized). A novelist writing about characters across
  time could hold commitments: (1) I accept Reflection — my future self knows more,
  so I should defer; (2) but I also think people reliably change their minds for bad
  reasons / character can decay; (3) I think a first-person narrator at 60 is not
  really the same agent as at 20; (4) I accept some Dutch-strategy-style coherence
  requirement on my beliefs over time. Genuine tension: Reflection requires the future
  self to be relevantly the same believer, and dynamic coherence arguments (diachronic
  Dutch books) require that the agent doesn''t expect to lose information — actually
  Dutch books for Reflection require that the agent''s future updates be conditionalization-based
  (no forgetting / no evidence loss). A novelist who thinks characters systematically
  self-deceive and forget would be violating the premises that make diachronic Dutch
  books bite. Also tension: reflection combined with expectation of future bias/rationalization
  is inconsistent. And an apparent tension that dissolves: thinking your future self
  is smarter doesn''t commit you to Reflection if you expect to acquire evidence you
  don''t have yet — wait, actually that''s exactly what Reflection says. Hmm, let
  me be careful with the technical content.


  Reflection principle (van Fraassen 1984): If you now assign probability x to the
  proposition "at future time t I will believe p to degree y", then your current degree
  of belief in p conditional on that should be y. Formally: C(p | C_t(p) = y) = y.
  It''s the diachronic analogue of... it follows from Bayes + expectation of conditionalization
  (if you expect your future self to update only by conditionalization on your own
  future evidence). Two arguments: (a) a diachronic Dutch book argument — but this
  requires that the future self''s beliefs come only by conditionalization, i.e.,
  no forgetting; if you expect to forget things or to be misled, Reflection can fail
  without incoherence; (b) it''s a "trust in your future self" principle. Criticisms:
  Talbott, Christensen, and the classic case of drinking a drug/potion that will make
  you believe nonsense; also "I will believe I''m Napoleon" cases. Also van Fraassen
  himself discussed the case where you''ll take a drug that makes you forget or believe
  falsely.


  Also relevant: Reflection interacts with the "self-locating"/personal identity issue:
  if the future believer is a very different person, do you owe them deference? There''s
  literature on "moderate/intrapersonal" reflection vs. "interpersonal" trust.


  So a novelist with commitments about character development over time and about unreliable
  narrators could give a nice "audit" prompt. That combines domain (Reflection principle)
  + type 1 (commitments audit) + novelist perspective. That seems strong and genuinely
  "in the weeds" — small LLMs would struggle but the prompt is answerable from memorized
  knowledge (van Fraassen 1984 "Belief and the Will", the Reflection principle, diachronic
  Dutch books, conditionalization, forgetting, potion cases).


  But wait — should I ask for the novelist''s own commitments as a novelist (craft
  commitments) or as a person holding philosophical views? Type 1 says: the asker
  lists several things they believe within a domain — theses, verdicts on cases, methodological
  preferences. The novelist framing gives the flavor and stakes: they''re trying to
  figure out whether their view of character/self is coherent because it drives their
  fiction.


