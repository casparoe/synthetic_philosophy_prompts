  direct one, and he also distinguished "time" as objective lapse (the "coming into
  being" of now) from the mere ordering. And crucially: Gödel did NOT think that relativity
  alone refutes the reality of time — he thought it showed that relativistic spacetime
  permits a solution where there is no objective lapse, and thus time''s reality is
  not established by physics; but Gödel was a platonist/idealist who believed time''s
