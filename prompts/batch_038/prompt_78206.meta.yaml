  essay he says the existence of CTCs "would make it possible... to travel into any
  region of the past... This state of affairs seems to imply an absurdity" and thus
  "either the solutions... do not correspond to a physically possible state of our
  universe, or... the concept of objective time... is not objective." He leaned on
  it as further evidence for the ideality of time. Also Gödel''s later position (in
  his reply to criticisms, added 1990 posthumous edition) emphasized that in his universe
  there''s no global "now" foliation — the local light cones tip over so that no spacelike
  surface can serve as a simultaneous everywhere. Right: in Gödel''s universe, there
  is no foliation into spacelike hypersurfaces... Actually there IS a foliation locally
  (Cauchy?) — Gödel universe is not globally hyperbolic, has no Cauchy surface, and
  it does admit a foliation into spacelike hypersurfaces? Hmm. In Gödel''s rotating
  dust universe, the metric has a preferred set of "world lines of the dust" and there''s
  a natural slicing by surfaces t = const which are spacelike but not... Actually
  those t=const surfaces are spacelike but the CTCs pass through them multiple times,
  so they''re not Cauchy surfaces. There''s a subtlety: Hawking & Ellis note that
  the Gödel universe admits a foliation into spacelike hypersurfaces (the t=const
  surfaces are spacelike and cover the manifold, diffeomorphic to R^3... hmm, actually
  they''re "surfaces of homogeneity"?). Let me recall: Gödel metric in coordinates:
  ds² = a²[dt² − dx² + (1/2)e^{2x}dy² − dz² + 2e^x dt dy]. The t=const surfaces: induced
  metric −dx² + (1/2)e^{2x}dy² − dz², which is negative definite, so spacelike. So
  yes there are global spacelike hypersurfaces, but they aren''t Cauchy (spacetime
  not globally hyperbolic) and CTCs cross them. So Gödel''s point: no objective lapse
  because there''s no way to define a globally distinguished simultaneity — and, more
  importantly, no "now" that sweeps forward, since a closed timelike curve destroys
  the asymmetry of before/after (an event can be both before and after itself). Gödel
  argued this destroys the "objective" character of temporal succession: with CTCs,
  the earlier/later relation ceases to be a well-defined linear order.


