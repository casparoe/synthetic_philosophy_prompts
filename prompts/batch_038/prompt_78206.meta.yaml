  1992), the Novikov self-consistency principle, Deutsch''s quantum model of CTCs,
  Poincaré recurrence, and more recent debates about presentism vs eternalism in light
  of quantum gravity and the absence of a preferred foliation. Gödel''s actual view:
  he argued that relativity shows that time as "objective lapse" is not real — indeed
  in his 1949 essay "An Example of a New Type of Cosmological Solution of Einstein''s
  Field Equations of Gravitation" and the 1949 Schilpp volume essay, he says relativity''s
  abolition of absolute simultaneity implies time''s unreality — "the relativity of
  simultaneity implies the ideality of time." Then when the Gödel metric was found
  to admit CTCs, he argued that a universe in which one can travel into one''s own
  past shows that "the order of time" (before/after) isn''t objective, and time travel
  would be possible in principle; he noted it requires unreasonable amounts of matter/velocity,
  and also raised the objection about changing the past. He also discussed with Einstein;
  Einstein reportedly worried that his own theory allowed time machines and considered
  the Gödel universe a "disturbing" solution. Also Gödel''s correspondence with Wang
  on the "vicious circle" objection... Actually Gödel addressed the objection that
  one could kill one''s grandfather by noting it doesn''t create a logical contradiction,
  only an oddity.


