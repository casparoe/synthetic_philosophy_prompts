  Alternatively, Good''s theorem on the value of information + "describe a phenomenon,
  ask for its name". Good''s theorem (I.J. Good, 1967, "On the principle of total
  evidence") says: the expected value of an experiment, before you do it, is never
  negative (in terms of expected utility maximization) — more precisely, the expected
  utility of accepting free information is at least as great as the expected utility
  of acting without it, assuming the utility function doesn''t change and you''ll
  update by conditionalization. This gives a Bayesian justification for "always accept
  free, relevant information" and for the principle of total evidence. Interesting
  angles: the value of information is zero when the evidence can''t change your action;
  Good''s theorem assumes no cost, no utility change from information itself, no commitment
  problems.


