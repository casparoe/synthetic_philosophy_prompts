  (used on appeal), live captions for a public gallery stream and for deaf/hard-of-hearing
  users, and simultaneous interpretation into six languages for defendants and witnesses.
  Frequency: several judgement calls per day. Constraints: must be decided inside
  the working day; a two-tier sign-off (team leader, then duty registrar) for anything
  that goes to the public stream; must publish a one-paragraph written reason that
  a lay complainant can follow; consistency between operators matters because inconsistent
  treatment is itself a ground of complaint; can''t ring counsel.


  Paragraph 2: The philosophy to be operationalised + the specific hard requirement.
  Mention: the distinction between use and mention; the claim that a slur''s derogatory
  content is not at issue and therefore survives negation, embedding and quotation
  and cannot be cancelled by the speaker''s disavowal; the presuppositional view (the
  slur smuggles in a presupposition the hearer accommodates silently); the prohibitionist
  view that the word is toxic in every appearance irrespective of intent; the expressivist/pragmatic
  view that what matters is the expression of contempt and thus the speaker''s stance;
  and the argument that the harm of a slur''s appearance doesn''t depend on the speaker''s
  mental states at all, which would condemn verbatim transcripts. Require the procedure
  to state explicitly which of these it adopts at each step, which distinctions it
  keeps, which it discards, and what it loses by discarding them — since the operators
  can''t hold the theories in their heads. Also require: the procedure must not collapse
  into "consider the context", i.e., must specify the questions in order with sufficiency
  conditions and defaults when information is unavailable (e.g., unknown whether a
  speaker is an in-group member; unknown whether a recording was made in private).


  Paragraph 3: The rendering options / tiers and the worked cases. Give the three
  (or four) output options: verbatim; bracketed descriptor ([racial slur]) in place
  of the word with the word retained in the sealed record; descriptor plus editorial
