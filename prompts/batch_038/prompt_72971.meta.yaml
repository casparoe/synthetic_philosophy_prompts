  opponents defend art''s autonomy — assumes there is a neutral position available.
  I don''t think he assumes that, and I don''t think it''s true of my street either.
  The field is already occupied: before I shoot a frame, there is a settled and widely
  believed picture of what the neighborhood is. A work that declines to contest it
  doesn''t leave the picture untouched; it leaves the picture standing, plus one more
  artifact that could have contested it and didn''t. On this reading the purists aren''t
  wrong that his art is propaganda. They''re wrong that he had a choice.


  ¶3: That reframes beauty. In the standard telling, his insistence that the work
  also be beautiful and true is a concession to aesthetics, a sop to keep the piece
  from being a pamphlet. On my reading it''s the other way round: beauty is a functional
  requirement of the propaganda. A work that is true but repellent is consumed by
  the people who already agree with it, and it changes no occupied field. It has to
  be good enough to travel into hostile attention and stay there. Effectiveness, not
  purity, is what beauty is doing in his criteria.


