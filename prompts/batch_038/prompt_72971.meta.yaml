  calls for something else — comfort, flattery of the funder, ugliness that is legible
  as urgency. And in my own case the foundation''s audience already agrees with the
  foundation; nobody needs to be turned. So my film doesn''t have to be beautiful,
  it has to be watchable, and Du Bois''s own logic is what licenses that. I''ve turned
  his standard into a grant application.


