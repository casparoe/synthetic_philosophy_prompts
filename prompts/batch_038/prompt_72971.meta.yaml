  needs a mechanism. Absence of a counter-picture does not reliably produce one; often
  it produces nothing at all, no belief either way. If unmade films are propaganda
  for the status quo only when the status quo has supplied an image to occupy the
  space, then the claim is much narrower than I want it to be — and my film, about
  a street most of the city has no image of at all, may be exactly the case where
  it doesn''t apply.


