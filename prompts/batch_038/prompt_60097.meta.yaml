  sees it, and the projection ends up as if the bad event never happened. `hold()`
  buffers: we don''t commit until we have enough information to write the correct
  event once, and we publish a watermark so nobody reads past it. Both produce an
  identical final state for every consumer, and our team has an old, tired argument
  about whether, when two writes are concurrent and nothing downstream can distinguish
