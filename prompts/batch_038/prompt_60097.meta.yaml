  a dot of one color flashes at one spot on a screen, then a fraction of a second
  later a dot of a different color flashes a short distance away. At some spacings
  and delays people report seeing a single dot travel between the two spots and change
  color partway along the path. The problem: the second dot hasn''t flashed yet at
  the moment the traveling dot is supposedly already changing color, so where does
  the midpoint color change come from? Two answers get floated. The Orwellian one:
  what actually got presented was "dot here, then dot there," and the record was edited
  afterward, so the subject sincerely describes a trajectory they never had. The Stalinesque
  one: nothing got presented at all until after the second flash, at which point the
  whole motion-plus-color-change was staged in one go, so the report is honest, just
  late. Then the paper argues you can''t tell these apart and there''s no further
  fact about which happened, because there''s no single place and time where the show
  gets screened.


