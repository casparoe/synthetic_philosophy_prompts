  Key content to include concretely:

  - The memetic camp: a meme is a replicator — an item of culture (tune, idea, catchphrase,
  technique) copied from brain to brain with variation and differential success; natural
  selection over memes explains design-like features of culture; the substrate doesn''t
  matter (Dawkins''s point that Darwinism isn''t tied to nucleic acid); Dennett''s
  "substrate neutrality" of the algorithm.

  - The dual inheritance / Boyd & Richerson camp: they accept a Darwinian account
  of culture but deny the meme is a good unit; they model cultural transmission with
  population-genetic-like equations (biased transmission: prestige bias, conformist
  bias, content bias), emphasize that cultural items are *reconstructed* from observed
  behavior and that copying fidelity is achieved by cognitive machinery (imitation
  + teaching + language), not by a physical replicator; they treat cultural variants
  as continuous/graded and often deny discrete replication is needed — heredity without
  replicators (they speak of "cultural transmission systems").

  - The epidemiology/attractor camp (Sperber): representations are not copied but
  transformed and reconstructed; what persists across a population is not a token
  lineage but an attractor — a stable transformation tendency grounded in psychology
  and ecology; so "meme" mislocates the explanans: culture is a mass of cognitive-causal
  processes, and the right unit is not a replicator but the recurrent transformation.

  - Hull''s point: "replicator" is a functional/role concept, defined by what it does
  (passing on structure largely intact by causal interaction), not by what it''s made
  of; also Hull''s complaint that Dawkins conflated replicator with the "meme-as-unit"
  and that the real issue is whether any stable entity plays the role. Hull argued
  that the replicator concept applies to any system with heredity where information
  passes on; critics then say memetics fails to identify the entity (no genotype/phenotype
  distinction, no clear boundaries of the unit, recombination and blending rather
  than particulate inheritance).

  - A crucial asymmetry the camps disagree about: whether cultural transmission is
  particulate or blending. Particulate inheritance is what makes selection cumulative
  (Fisher''s argument about blending inheritance destroying variance). Cultural variants
  blend: ideas recombine. If cultural heredity is blending, cumulative selection is
  harder — but memeticists respond that the *information* is copied discretely even
  if the vehicles blend, and that reconstruction with error-correcting mechanisms
  (writing, teaching, notation, ritual repetition) can yield high fidelity.

  - The empirical question: transmission-chain experiments (serial reproduction, iterated
  learning) show systematic transformation toward cognitively attractive forms — which
  attractor theorists read as evidence against copying and memeticists read as evidence
  of biased selection among variants. Same data, two readings. That''s a good concrete
  lever: is the dispute about which cases count as data / how to describe the data?

