  Draft:


  "For several years I have been part of a working group on cultural evolution, and
  one disagreement recurs at every meeting without ever advancing. The common ground
  is wide: everyone in the room accepts that human beings transmit behavior and information
  by social learning, that variants differ in how successfully they spread, and that
  the result is cumulative cultural adaptation of a kind no other species manages.
  What nobody can agree on is whether any of this involves replicators.


  Three camps. The first holds that a meme is a genuine replicator: the Darwinian
  algorithm is substrate-neutral, so nothing about nucleic acid is essential to selection,
  and a melody, a technique, or a religious idea copied from person to person with
  variation and differential retention is doing exactly what a gene does. The second,
  working out of the dual-inheritance tradition, is Darwinian about culture but denies
  that the meme is a usable unit; it models cultural change with population-level
  transmission equations (prestige bias, conformist bias, content bias) and maintains
  that high-fidelity cultural transmission is achieved by cognitive machinery — imitation,
  teaching, language — rather than by any structure that copies itself, so heredity
  without replicators is not just possible but what actually happens. The third, coming
  from the epidemiology of representations, denies the premise of the first two: cultural
  items are not copied at all but reconstructed, and what persists across a population
  is not a lineage of tokens but an attractor, a stable tendency of human minds to
  transform inputs toward certain forms. On this view both other camps misdescribe
  the explanandum; the persistence of a tradition is a fact about psychology and ecology,
  not about copying.


  My own hypothesis, offered as a hypothesis I expect to be corrected: the impasse
  is not about culture. It is about what an account of design-like order has to contain
