  that has already thrown most of the world away — and yet we talk, plan, and write
  down goals as though we knew what is on the far side of that channel. Call the first
  part inaccessible information and the second part ontology identification: deciding
  which things the words in our account pick out, and whether those things survive
  when we get a better account.


