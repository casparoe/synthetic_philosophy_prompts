  engineering discipline: fortune controls about half, the other half is ours; build
  defences in fair weather so the flood does less damage; preparation converts luck
  into reliability. (B) tragic/deflationary reading — the river passage is not about
  control at all: you cannot stop the flood, you can only slightly reduce damage;
  and the "spirit of the times" argument undercuts mastery, because a man cannot deviate
  from his nature, so success is a matter of your fixed disposition happening to match
  an environment you cannot predict; Julius II is an example of luck, not skill, since
  he would have been ruined had the times turned. On this reading, virtù is not a
  competence but a bet.

  - Note both sides cite the same passages; note that both readings also cite Machiavelli''s
  remark elsewhere about relying on fortune being lost when it changes.

  - Asker''s hypothesis: the disagreement isn''t primarily exegetical but about what
  counts as skill in a high-variance environment — a question they encounter at work
  (e.g., is an incident-response practice that reduces mean downtime but not variance
