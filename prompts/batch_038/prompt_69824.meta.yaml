  Draft:


  "For some time now I have found myself persuaded by a broadly Berkeleian theory
  of money — the one Berkeley sketched in The Querist and in his earlier writings
  on paper credit, and defended in part by his unsuccessful lobbying for an Irish
  national bank. As I hold it, the view has the following structure, and I want you
  to treat that structure, not a straw man of it, as the object of assessment:


  (i) Money is not wealth. A nation''s wealth consists in the necessaries and conveniences
  of life that its labour produces; the stock of precious metal held by a nation contributes
  nothing to that stock except insofar as it moves productive effort.

  (ii) Money is a ticket, counter or token — a sign whose whole content is functional.
  It has no value apart from what it does; to ask what money is ''really'' worth over
  and above its capacity to circulate claims on goods and labour is to make a category
  mistake of exactly the sort Berkeley attacked elsewhere in his philosophy.

  (iii) Because its value is functional and conventional, the supply of money is a
  matter for deliberate public management, ideally by a national bank issuing paper,
  rather than something to be left to the accidental yield of mines and the balance
  of trade. Hoarding — by individuals, by merchants, or by a treasury sitting on bullion
  — is a positive evil, since it withdraws the stimulus that keeps industry in motion.

  (iv) The test of a monetary arrangement is therefore not its convertibility, its
  metallic backing, or its fidelity to some pre-existing standard, but whether it
  excites and sustains industry in the community that uses it. A paper currency that
  fails in this respect is bad money even if perfectly convertible; one that succeeds
  is good money even if irredeemable.


  What I want is a map of this view''s exposure: what would have to be true for it
  to be false. Please address the following, and sort the material as you go.


