  false presupposition: the asker should hold a misunderstanding that a good answer
  corrects. E.g., "Since Good''s theorem proves that more information is always better,
  shouldn''t we treat unrestricted curiosity as a moral duty / shouldn''t AI systems
  be designed to maximize information gathering?" The confusion: (1) the theorem is
  about *expected* value given current beliefs and a fixed utility function, and only
  for *free* information; (2) the "can always ignore it" move assumes the agent can
  commit to not updating, or that ignoring is available — but information you can''t
  unlearn changes your action set; (3) value of info is zero when the information
  can''t change the decision; (4) it doesn''t say information is instrumentally good
  in general — it says accepting free info doesn''t hurt in expectation; (5) negative
  value arises with costs, with preference change, with others'' knowledge (strategic),
  with regret/psychological utility. Also (6) the theorem assumes Bayesian coherence
  — an agent who violates the axioms (e.g., ambiguity aversion) may find info harmful.


