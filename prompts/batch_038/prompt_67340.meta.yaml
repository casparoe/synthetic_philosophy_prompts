  Exam question (for a grad/seminar epistemology course): "Nozick''s tracking analysis
  of knowledge is usually said to deny the closure of knowledge under known entailment.
  Explain, using the brain-in-a-vat case, why tracking has this consequence, and assess
  whether Nozick should regard it as an objection."


  Student answer, ~350 words, mixed:

  - Correctly states sensitivity: S knows that p only if, were p false, S wouldn''t
  believe p.

  - Correctly says: in the nearest world where I''m a BIV, I''d still believe I have
  hands, so I don''t know I''m not a BIV; but in the nearest world where I lack hands
  I wouldn''t believe I have hands, so I do know I have hands.

  - Correctly notes closure fails: I know p, p entails q, but I don''t know q.

  - Subtle mistake 1: says Nozick *adds* the sensitivity condition as a fourth condition
  on top of justified true belief, "to handle Gettier cases" — actually Nozick replaces
  JTB; his analysis has no justification condition, and he doesn''t present it primarily
  as a Gettier fix (well, it does handle Gettier cases; the mistake is "fourth condition
  on top of JTB").

  - Subtle mistake 2: says Nozick''s view therefore concedes the skeptic''s conclusion
  that we don''t know we have hands / or says Nozick accepts skepticism about the
  external world generally. Or: says the theory "shows the skeptic is right that we
  can''t know anything about the external world" — no, it''s an anti-skeptical theory
  that only concedes the single claim that we don''t know we''re not BIVs.

  - Subtle mistake 3: conflates sensitivity with safety (says "Nozick''s idea is basically
  that knowledge requires a belief that couldn''t easily be false — what we now call
  safety"), which reverses the direction of the conditional. Actually safety: if S
  believes p then p is true (in nearby worlds, believing p → p). Sensitivity: if p
  were false, S wouldn''t believe p. These are contrapositive-ish but differ because
  of which worlds are close and the fact that safety concerns the actual belief-forming
  method. This is a classic conflation and a subtle mistake. Good.

  - Maybe mistake 4: says closure is "obviously valid" and thus Nozick is refuted,
  without noting that Nozick embraces the failure. Or says Nozick later revised his
  view to restore closure (he did discuss in "Philosophical Explanations" and there''s
  a debate — hmm, careful; I shouldn''t assert that).

  - Another possible subtle error: claiming that on Nozick''s account I *do* know
  I''m not a BIV because "in the nearest world where I''m not a BIV I''d believe I''m
  not a BIV" — that''s adherence, and adherence is about knowledge of not-p. Actually
  condition 4 (adherence): if p were true, S would believe p. For the BIV case: p
  = "I am not a BIV." If p were false (I am a BIV), would I still believe p? Yes —
  so sensitivity fails. Correct. And a student might get tangled and say the tracking
  conditions *both* fail for "I have hands" too. Hmm.


  Also a nice subtle error: saying that the tracking account makes knowledge "closed
  under known entailment when the entailment is ''obvious''" — that''s more like Dretske''s
  "closure under known logical implication fails" with heavyweight/lightweight propositions
  distinction. Actually Dretske distinguishes heavyweight vs. lightweight propositions,
  and Nozick doesn''t exactly use that. A student attributing Dretske''s "closure
  failure only for heavyweight propositions" to Nozick would be a misattribution —
  a subtle mistake a hasty grader would let slide. Hmm, that''s good and it''s a genuine
  conflation (Dretske 1970 "Epistemic Operators" vs Nozick 1981). Also a student might
  say "like Dretske, Nozick holds that we know we have hands" — both do. Fine.


  Alternatively I could have the student conflate Nozick''s tracking with Lewis''s
  "rule of attention" / contextualism, saying Nozick''s account is a form of contextualism
  — subtle misattribution (Lewis explicitly built on Nozick but transformed it into
  contextualism). A student saying "Nozick is a contextualist: whether I know depends
  on which possibilities are being attended to" is wrong-ish: Nozick uses nearest-world
  similarity, not context-sensitivity of the conversational score; Lewis made it contextualist.
  That''s a lovely subtle mistake that a hasty grader might slide past, since Lewis''s
  account is descended from Nozick''s.


