  \ model: the art of living is a skill/habit stock that must be produced and reproduced\
  \ by particular institutions (a class, a milieu, patronage, apprenticeship, rituals\
  \ of leisure); it can be lost, and it doesn't automatically appear.\nUnder (B),\
