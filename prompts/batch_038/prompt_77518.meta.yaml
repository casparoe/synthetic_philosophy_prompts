  Case: A graduate seminar in a philosophy department (or an academic Twitter-ish
  venue). Two doctoral candidates, call them N. and R. N. presents a paper at a departmental
  colloquium; during the Q&A, R. says, sharply, that N.''s central argument is "not
  original — it''s essentially the view X defended in 2009, and the paper doesn''t
  cite it." N. responds that R. is wrong on the merits and that raising it in open
  session, in that tone, before the whole department and two visiting faculty, was
  a deliberate public humiliation. R. says that the objection is exactly what Q&A
  is for, that N. had every opportunity to reply, and that N. is now trying to make
  R. the offender for doing what scholarship requires. Afterwards: N. files a complaint
  with the graduate ombudsperson describing a "pattern of hostile treatment" and asks
  that R. be excluded from the workshop; several other students come forward saying
  R. has done similar things; a few say N. is known for retaliating. R. says the complaint
  is a reputational attack and demands a hearing in which R. can respond.


  Now: three framings.

  - Honor: The injury N. suffered was not (only) epistemic but public-status: R. claimed
  the right to define N. in front of the tribe. And R.''s injury is the complaint,
  which is a status attack that bypasses R.''s right to answer face-to-face. Honor
  logic predicts both parties'' actual behavior: N. sought third-party witnesses not
  to get redress but to demonstrate that N. can mobilize them.

  - Victimhood: the harm is cumulative harm to a person of lower status; third-party
  solicitation is exactly what victimhood cultures do; the "pattern" language and
  the request for exclusion are the signature moves; what looks like honor is just
  the structural asymmetry (R. is, say, senior, better connected, male-coded, etc.).

  - Dignity: both parties are treating a factual question (is the argument original?
  was there citation failure?) as if it were about personhood; the neutral procedure
  is to establish the fact, and neither humiliation nor harm-accumulation should decide
  it; and the very fact that both parties reached for moral vocabularies shows the
  dignity ideal is what''s actually being invoked and betrayed.


