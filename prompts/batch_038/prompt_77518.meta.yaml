  option or a self-description both parties reach for. End not in agreement but with
  the single crux — the fact or the normative commitment — that would decide between
  them, and one sentence each on what would falsify their reading.


  Hard limit: 1,000 words. Speaker labels only; stage directions, if any, one sentence
  each.


