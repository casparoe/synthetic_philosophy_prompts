  ---

  I am a third-year doctoral student in sociology, and I am drafting a chapter on
  how moral vocabularies get recruited in low-stakes institutional conflicts. My committee
  wants me to argue with the standard typology rather than deploy it: the familiar
  three-part scheme in which honor cultures, dignity cultures, and victimhood cultures
  are distinguished by where moral worth is located and by how much of a dispute is
  handed to third parties — the first associated with the older honor literature and
  with Berger''s diagnosis of modernity, the last with Campbell and Manning''s work
  on victimhood as a distinct moral culture. My chapter''s difficulty is that the
  typology reads like a developmental sequence, and I suspect that at least two of
  the three are better understood as standing options that people switch between inside
  a single dispute.


  To test that suspicion I want a dialogue — not an essay about one — over a case
  I have constructed and that I do not think appears anywhere in the literature. [Case
  details.]


  Please write the dialogue between two interlocutors:

  (A) one who holds that victimhood culture is not a new formation but honor culture
  with the enforcement outsourced... and that honor''s norms are morally superior
  here;

  (B) one who holds that victimhood culture is genuinely distinct ... and morally
  superior here.


