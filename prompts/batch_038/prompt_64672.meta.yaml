  Exam question text:


  "Question 3 (25 marks). Answer all three parts. You may not appeal to cases other
  than the one described below.


  Pain asymbolia (sometimes called pain dissociation) is a condition, usually following
  focal brain injury — most often a lesion of the insula, and historically also seen
  after leucotomy or cingulotomy — in which patients report pains that they can localize
  and describe (sharp or dull, burning or aching, here rather than there) while showing
  none of the distress such reports ordinarily occasion: they do not guard the affected
  part, do not avoid the stimuli that provoke the pain, and say that they have the
  pain but are not bothered by it. The dissociation is mostly, and perhaps not always,
  complete; it can also be produced transiently by opioid analgesia.


  Adopt, for the purposes of this question, the following labels:

  (i) The Indifference Datum: it is possible for a subject to feel a pain and not
  to mind feeling it.

  (ii) Separatism: unpleasantness is a component of pain distinct from its sensory-discriminative
  character, and the two can come apart.

  (iii) Internalism: necessarily, any subject who feels a pain is thereby motivated,
  to some degree, to make it stop.

  (iv) Hedonism: how well a life goes for the person living it depends solely on the
  balance of pleasant and unpleasant experience in it.


  Recall also the two families of account of what unpleasantness consists in: felt-character
  accounts, on which it is a way experience feels, and attitudinal accounts, on which
  it consists in a negative attitude — paradigmatically, a desire that the experience
  cease — directed at the experience.


  (a) [8 marks] Does (i) entail (ii)? Set out the reasoning that would carry you from
  the one to the other, and identify the further assumption that reasoning requires.

  (b) [11 marks] Assuming (i) and (iv), construct the best argument you can for the
  conclusion that some pains are not bad for the people who feel them. Then say which
  premise a hedonist who wished to deny that conclusion must give up, and what giving
  it up would cost.

  (c) [6 marks] A fellow student remarked in section that Internalism is false and
  that pain asymbolia proves it. Assess.


