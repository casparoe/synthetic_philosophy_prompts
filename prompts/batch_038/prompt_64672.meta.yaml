  Exam question (worth, say, 25 points, from a seminar in philosophy of mind):


  "In your own words, and without recourse to further cases, answer the following.


  Pain asymbolia is a condition, typically following focal brain injury, in which
  patients continue to report pains — they localize them, and can distinguish sharp
  from dull, burning from aching — while exhibiting none of the distress normally
  occasioned by such reports: they may smile as they describe the pain, they do not
  avoid the stimuli that provoke it, and they say they do not mind it.


  For this question, adopt the following stipulations:

  (i) The Indifference Datum: it is possible to feel a pain and not mind feeling it.

  (ii) Separatism: unpleasantness is a component of pain distinct from its sensory-discriminative
  character, and the two can come apart.

  (iii) Internalism: necessarily, whoever feels a pain is thereby motivated, to some
  degree, to make it stop.

  (iv) Hedonism: how well a life goes for the person living it depends only on the
  balance of pleasant and unpleasant experience in it.


  (a) Does (i) entail (ii)? Set out the reasoning that would take you from one to
  the other, and say what further assumption that reasoning requires.

  (b) Suppose (i) and (iv). Construct the best argument available to you for the conclusion
  that some pains are not bad for the people who feel them. Then say which premise
  a hedonist who wishes to deny that conclusion must give up, and what the denial
  costs.

