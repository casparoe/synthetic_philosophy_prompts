  - 1797: Bank of England suspends convertibility of its notes into gold (Bank Restriction
  Act), during the war with revolutionary/Napoleonic France, after a drain of gold
  reserves and a panic.

  - Suspension lasted until 1821.

  - Prices rose during the period; the paper pound depreciated relative to gold and
  the Hamburg exchange fell.

  - 1810: Parliamentary Bullion Committee report (Bullion Report), associated with
  Francis Horner and Henry Thornton, argued the depreciation was caused by excess
  note issue and recommended resumption of cash payments within two years.

  - Bullionists: Ricardo (The High Price of Bullion, 1810; Proposals for an Economical
  and Secure Currency, 1816). Anti-bullionists: Bank directors, Malthus, Bosanquet;
  argued price rise came from real causes (bad harvests, blockade/Continental System,
  war costs, and that the exchange depreciation reflected the cost and risk of shipping
  bullion).

  - Real Bills Doctrine: anti-bullionists held that if notes are issued only against
  good short-term commercial bills, the quantity cannot be excessive — it endogenously
  adjusts to trade needs.

  - 1819: Peel''s Act (Resumption Act) set resumption; 1821 convertibility restored
  at the old pre-1797 par (i.e., £3 17s 10½d per ounce of gold), causing deflation
  and distress (the 1819 "Peterloo" year context; agricultural depression).

  - Also 1825 crisis; and the eventual Bank Charter Act 1844 (Currency School vs Banking
  School) — that''s the later sequel, and the Currency/Banking School debate is a
  good place to note the continuation.


