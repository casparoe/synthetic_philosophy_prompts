  ---


  Write a philosophical dialogue between two theorists of pain who disagree about
  what pain asymbolia shows, if anything, about why pains are bad for the people who
  have them.


  The clinical picture both of them accept (do not have either one dispute it): there
  are patients, typically after damage involving the insular cortex or its connections
  to limbic structures — and something similar can follow cingulotomy, prefrontal
  lobotomy, or heavy opioid analgesia — who show a dissociation. Their ability to
  localize a noxious stimulus and to judge its intensity is intact; their withdrawal
  reflexes are intact; they often laugh, smile, or seem amused when pinpricked; they
  are not distressed and show no inclination to escape or to stop the stimulation;
  and yet, asked, they will say that they feel pain, that it hurts, while adding that
  they do not mind it or that it does not bother them.


  The disagreement: one character is an evaluation theorist of unpleasantness, who
  holds that what makes a sensory episode a pain — a genuinely unpleasant one — is
  not any intrinsic quality of the episode but the subject''s disvaluing of it: the
  fact that the subject experiences it as bad and is thereby moved to want it to stop.
  For this character, the asymbolic patient''s sensation has lost precisely what made
  it a pain, and the patient''s continued use of the word ''hurts'' needs explaining.
  The other character is an intrinsic-quality theorist, who holds that unpleasantness
  is a felt property of the experience itself, present in virtue of how the experience
  feels, and that aversion, distress, and the desire for relief are its normal consequences
  rather than its constituents. For this character, the asymbolic patient still feels
  a pain that is bad for her; what the lesion has taken away is her capacity to respond
  to that badness.


  Requirements:


  1. Both characters are equally sharp, well-informed, and fair-minded. Neither is
  a strawman, and neither may win by the other''s slip of the tongue.


  2. The dialogue must run on genuine back-and-forth: each character takes up the
  previous move specifically — answering the actual objection, conceding what is right
