  Let me plan the essay content: Nietzsche''s "On the Uses and Disadvantages of History
  for Life" (Untimely Meditations II, 1874). Three modes/approaches to history: monumental,
  antiquarian, critical. Each has a use for life and a degeneration/excess. Monumental:
  history of great moments, models for the exceptional individual; danger: it fictionalizes/idealizes,
  blurs differences, discourages the latecomer, and can be weaponized against the
  great by the mediocre ("the great should not be"). Antiquarian: history as piety
  toward one''s origins, preserving the past, gives a sense of home; danger: it mummifies,
  values everything old merely for being old, restricts horizon, fails to discriminate,
  and can stifle the new. Critical: history as judge — putting the past on trial,
  condemning and destroying it; danger: it''s an operation on ourselves, since we
  are heirs of the past; we are the result of past errors and passions, so condemning
  it condemns ourselves; and critical history risks cutting the roots.


