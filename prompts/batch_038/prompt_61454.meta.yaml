  neuron in a person''s brain is replaced, one at a time, by a silicon module with
  exactly that neuron''s input-output profile, timing included; the person walks around,
  works, converses, and reports at the end that nothing ever felt different. The argument
  I want to lean on is Chalmers''s principle of organizational invariance, and in
  particular the dancing-qualia version of it: if the module-driven system lacked
  the experience that the biological one had, then swapping modules in and out — which
  changes nothing functionally — would make the subject''s experience flicker back
  and forth with no functional correlate, which is supposed to be absurd. Case B is
  a variant a friend of mine built, and I have no good answer to it. Instead of silicon
  modules, each removed neuron is replaced by a fiber running to a room in an office
  park, where a clerk sits with a card index giving that neuron''s output for every
  input it can receive, and who answers within the neuron''s original latency budget.
  After fourteen months the skull is empty except for wiring, the clerks are doing
  all of the causal work, and the person is still behaving and reporting normally.
  As far as I can tell the dancing-qualia argument applies to Case B just as cleanly
