  Friedman: judge a theory by the accuracy of its predictions; "as if" assumptions
  needn''t be descriptively true. Under a pure F-twist view, anomalies are *just*
  predictive failures. If expected utility theory fails a prediction (Allais), then
  on Friedman''s view the theory is refuted to that extent — you''d abandon or revise
  it *because it predicts badly*. The Friedman view makes no distinction between "ad
  hoc" and "non-ad hoc" auxiliary hypotheses — it only asks: does the revised theory
  predict well out of sample? So the whole apparatus of "this auxiliary is ad hoc
  because it has no independent content" is irrelevant to a strict instrumentalist.
  Conversely, the Lakatosian judgment that adding a tweak is legitimate depends on
  content/independence/novelty criteria that go beyond raw predictive accuracy. So
  the profession''s actual practice — praising prospect theory because it generated
  novel predictions (endowment effect, framing, loss aversion in the field) while
  regarding some tweaks as ad hoc — presupposes something like Lakatos''s criteria,
  not Friedman''s. And there''s the further twist: Friedman''s view would say the
  *unrealistic assumptions* of rational choice are no objection, yet behavioral economics''
  whole selling point was that its assumptions are more psychologically realistic.
  So if the F-twist were right, the psychological realism of prospect theory wouldn''t
  be a virtue at all; the fact that the field treats realism as a virtue (and as a
  reason to prefer behavioral models) shows the practice presupposes something more
  realist — or at least that descriptive fidelity of mechanism matters.


