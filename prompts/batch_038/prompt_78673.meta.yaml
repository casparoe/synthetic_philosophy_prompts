  Here''s the practice I mean, described as plainly as I can. In the US system, a
  taxpayer can be penalized — and a transaction unwound — for doing something that
  the published statutory text pretty clearly permits. Courts apply doctrines like
  "business purpose" and the economic substance doctrine: a transaction that literally
  fits the words of a deduction provision can be disregarded if it didn''t meaningfully
  change the taxpayer''s economic position apart from the tax effect, or if the taxpayer
  had no substantial purpose for it beyond the tax saving. So the operative law isn''t
  the text; it''s the text plus a reconstructed purpose that the court supplies. And
  there''s an entire ladder of confidence levels for how sure your position has to
  be — reasonable basis, substantial authority, more likely than not, and so on up
  — where each rung buys you different penalty treatment, plus disclosure requirements,
  plus rules about what a preparer has to believe before they can sign a return ("realistic
  possibility of being sustained on its merits"). Which means the system openly lets
  you take a position you think is probably wrong, if you''re willing to price the
  risk and disclose it.


