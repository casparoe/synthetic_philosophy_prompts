  Dutch book run backwards — and here the key subtlety: a Dutch book against the later
  self requires that the later self''s bets be settled from the earlier self''s purse
  and that the earlier self can foresee and pre-commit; but a bettor who has been
  drugged may not care about the earlier self''s losses, and more importantly, the
  later self typically has more evidence, so Retroflection is false as a general principle,
