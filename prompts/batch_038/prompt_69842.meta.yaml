  Draft text:


  ---


  I am setting the final paper for a graduate seminar in formal epistemology, taken
  mostly by first- and second-year PhD students who have had a full year of Bayesian
  probability theory. The paper is three hours long; candidates answer two of five
  questions, each worth 25 marks and each expected to draw roughly 900 to 1,100 words.
  I want you to write one of the five questions, on van Fraassen''s Reflection principle,
  together with everything I need in order to mark it.


  The question must not be answerable from the standard summary. Reciting the principle,
  listing the familiar cases in which an agent expects her future opinion to be manufactured
  rather than informed — hypnotic suggestion, sedation, propaganda, an experiment
  one knows will be misleading — and declaring Reflection false is the answer I expect
  from half the cohort, and it earns no more than a pass. Nor should a candidate get
  marks for noting that Reflection is a special case of deference to a better-informed
  self and stopping there; that is where the work should begin.


  What I want the question to turn on is a variant I have been using in class and
  have coined a name for, Retroflection: the mirror-image principle on which your
  later credences should defer to your earlier ones, so that the credence you will
  hold in H at a later time, conditional on your having held credence q in H at an
  earlier time, is q. On the paper it must be flagged as my stipulation and not attributed
  to anyone. The question should present a single case, sketched compactly, in which
  an agent at an earlier time knows precisely what her later credence in some hypothesis
  will be and knows that the change will not have been produced by anything she now
  counts as evidence — she will be thirty-six hours into an on-call shift, exhausted,
  and susceptible to a colleague she now regards as a smooth talker. She should also
  be offered, at both times, bets on the hypothesis at odds matching her respective
  credences, so that a sure loss is visible to her in advance; and she should have
  available, at the earlier time, a pre-commitment device that would prevent her later
  self from accepting the second bet.


  The question then asks candidates to do three things: derive Reflection from the
