  the Principal Principle, and reciting the diachronic Dutch book argument. [Then
  specify crux...]


  To keep the question away from the rehearsed material, it should be built around
  a case of my own construction, which I would like you to refine rather than replace.
  Here it is. [Novel case:] A researcher, call her Ada, will spend a year in a lab
  whose director she trusts completely and whose instruments she knows to be more
  reliable than her own judgement. She knows that at the end of the year her credence
  in hypothesis H — a hypothesis about which she currently has no evidence at all
  — will be whatever the lab''s published protocol says, and she expects that protocol
  to assign it 0.9. ... hmm.


  Better novel element: a variant principle. Let me define:


  "Retrospective Reflection" / call it Hindsight Deference: P_{t''}(H | P_t(H) = q)
  = q where t < t''. I.e., your later self should treat your earlier credence as authoritative.
  That''s clearly false in general (you learned new evidence), but there are cases
  where it''s arguably right: cases where the later self is impaired (drug, sleep
  deprivation, memory loss) and the earlier self was sober. This creates a nice tension:
  the same considerations that support Reflection (deference to a self who is better
  informed) can support deference backwards when the later self is worse off. And
  there''s the question of what distinguishes the two: Reflection is usually motivated
  by the assumption that the future self is better informed, i.e., that opinion change
  is evidence-driven; a diachronic Dutch book seems to enforce it as pure coherence
  regardless.


  So the exam question: state Reflection, state the backward variant (name it as the
  question''s coinage, e.g., "Retroflection"), and ask: (i) is Retroflection a consequence
  of the same considerations that justify Reflection, (ii) construct a case where
  Reflection and Retroflection give conflicting advice about the same current credence
  and say what an agent should do, (iii) whether a diachronic Dutch book can be built
  against a violator of Retroflection, and if so what that shows about whether Reflection
  is a coherence norm or a substantive assumption about one''s own future reliability.


