  In the southern Maya lowlands over the eighth and ninth centuries, dynastic centres
  were abandoned, the carving of dated monuments stopped, and the political apparatus
  that produced them went with it — so (ii) is met. But (iii) is not: Maya languages,
  ritual practice and cosmology continued, and millions of Maya speakers live in the
  same region today, so the population did not stop understanding itself as the descendant
  of the people who built the record. That is why the Maya case is better described
  as a political and demographic reorganisation confined to one region — the north
  was still flourishing while the south emptied — than as the end of a society. (i)
  is the criterion that actually does the work here, and it is the one the test states
  least clearly, since a city can lose half its people while the countryside gains
  them.


  Rapa Nui is usually offered as the counter-example, on Diamond''s account of a society
  that consumed its own environment. The revisionist literature has, I think, settled
  the matter: the palm forest went largely because of the rats the Polynesians brought
  with them, and the demographic catastrophe belongs after European contact — slave
  raiding and epidemic disease in the nineteenth century, not before. What the islanders
  did in response was reorganise: the birdman cult replaced the ancestor cult that
  had produced the moai. By the test''s own logic this should count under (iii) as
  a break in self-understanding, and so Rapa Nui collapses on all three criteria.


  The Late Bronze Age is different in kind, and this is where the test needs amending.
  Around 1200 BCE the palace economies of the eastern Mediterranean came apart together:
  the Hittite state disappeared, Mycenaean centres were destroyed or abandoned and
  literacy in the Linear B script was lost, Egypt survived but weakened. Yet the population
  did not vanish; it dispersed and ruralised, and spoke the same languages and worshipped
  the same gods afterwards. So (ii) is met, (iii) is not, and (i) is doubtful. What
  failed was a network, not a society, and the test has no slot for that: it is written
  for one bounded people, but the thing that ended was the set of dependencies between
  several.


  Tainter''s argument helps here: complexity is a problem-solving strategy whose marginal
  returns diminish, so shedding it is not a catastrophe but a rational response, and
  this is why the reduced forms that replaced the palaces and the dynasties were stable.
  On the descriptive side the test is admirably neutral — it never asks whether anyone
  was worse off, which is exactly why it can be applied to Rapa Nui and to the Aegean
  alike. But neutrality is also its limit. By the test''s own lights the ninth-century
  Maya and the post-contact Rapanui are in the same category, and the difference between
  a dynasty ending and a people being carried off in slave ships is precisely the
  difference the word should have tracked."


