  Move 1 (Marcus): Keynes''s "weight of argument" is just a second dimension of uncertainty
  alongside probability — the probability of a hypothesis given evidence can stay
  at 1/2 while the weight of evidence increases, so Keynes has an early version of
  imprecise probability / second-order uncertainty; economists who treat Keynes as
  merely an eccentric logician miss this.


  Move 2 (Hana): Weight isn''t a separate dimension. It''s a measure of the amount
  of relevant evidence, and Keynes himself defines it in terms of additional argument
  that increases the probability of the conclusion... Actually Keynes says weight
  is the balance of relevant evidence in favour — the amount of favourable evidence
  minus unfavourable, i.e., W = V + I where V is the weight of favourable and I of
  unfavourable evidence. Hmm, Keynes''s account: weight is defined in terms of the
  amount of relevant evidence; and he says an argument''s weight can increase while
  probability stays same. Hana''s objection: weight is not comparable across hypotheses
  and Keynes admits weight is not numerical, so it can''t do decision-theoretic work;
  also, if you always prefer more weight, you''d never act on thin evidence — which
  is absurd (we must act). And Ramsey''s charge: weight collapses into a combination
  of probability and something like "the value of information" — it''s about our evidence,
  not about the proposition''s probability, so it can''t be part of a rational-choice
  theory.


  Move 3 (Marcus): That''s precisely the point — Keynes''s weight anticipates the
  distinction between first-order and second-order probability, and modern imprecise-probability
  frameworks (sets of probabilities) capture it: a wide interval = low weight, a narrow
  one = high weight. So weight isn''t a confusion, it''s a live research program.


  Move 4 (Hana): But the identification fails. In Keynes, a hypothesis''s probability
  can be entirely non-numerical, not even bounded by an interval — the ordering is
  only partial, and probability is a logical relation between propositions, objective,
  not a state of mind. Sets of probabilities represent an agent''s doxastic state
  and are always interval-bounded, so they can''t model Keynes''s non-comparability.
  Also, in Walley-style frameworks, "weight" would be reflected in how much evidence
  you''ve gathered, and imprecision persists even with all evidence; so the mapping
  is at best a heuristic.


  Move 5 (Marcus): Fine, but Keynes''s later talk of long-term expectations — where
  he says we have no knowledge, only spontaneous optimism / animal spirits, and where
  the future is fundamentally uncertain — shows he thought some questions admit of
  no probability at all, not even an interval; and that''s what the "uncertainty"
  tradition in post-Keynesian economics draws on. So weight was a way-station to something
  more radical.


  Move 6 (Hana): That''s anachronistic: the Treatise is objectivist and rationalist
  — probability relations are known by direct intuition and are the same for anyone
  with the same evidence; the later remarks about not knowing are consistent with
  that (a claim about our evidence, not about irrationalism), and the "animal spirits"
  passage is about the psychology of investment under incomplete knowledge, not a
  repudiation of logical probability. Also, the "we simply do not know" line is about
  the prospective yield of investments, and Keynes immediately says this doesn''t
  make it irrational to act — so it isn''t scepticism.


  Move 7 (Marcus): Then Keynes has no substantive claim left: everyone agrees we sometimes
  lack knowledge. The interesting thesis is that rationality under such ignorance
  isn''t captured by maximizing expected value — and if you deny that, you''re left
  with a Keynes who is a logician with an eccentric theory and nothing to say to economics.


  Move 8 (Hana): Not nothing: the Treatise''s critique of the principle of indifference
  (his "principle of stability" and the atomic uniformity / limited variety assumptions)
  is a real constraint on when induction licenses equiprobability, and that matters
  for whether statistical evidence supports numerical probabilities at all.


