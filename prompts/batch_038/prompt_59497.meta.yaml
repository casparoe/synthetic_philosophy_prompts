  Question:

  "Answer in roughly 800 words. (a) Hacking distinguishes indifferent kinds from interactive
  kinds, and describes a looping effect whereby the classification of people changes
  the people classified, which in turn changes the classification. Explain the distinction
  and the looping effect, giving at least one example that is not drawn from the readings.
  (b) Do labels such as ''Millennial'' and ''Gen Z'' pick out interactive kinds? If
  they do, what follows — is a generation thereby less real than a natural kind, and
  what would a demographer have to do differently to study one? You may draw on Mannheim''s
  account of generations."


  Student''s answer (name: "R.M." or a participant identifier like "Participant 7"
  / "one of the answers, from a retired schoolteacher"). Let''s give it an ID: "Answer
  submitted by Participant 11 (who asked that I not use her name)." Gender-neutral
  is fine.


  Draft answer:


  "Hacking''s point is that the natural sciences mostly deal with kinds that do not
  care how they are classified. Plutonium does not read the paper that says what plutonium
  is, and it does not adjust its behavior in response. He calls these indifferent
  kinds. Interactive kinds are different: they are kinds of people, and people can
  find out how they are classified, absorb the classification, and start to conform
  to it or to resist it. Once they do, the people who made the classification have
  to revise it, because the group it was supposed to pick out is no longer quite the
  group that answers to the description. Hacking calls this back-and-forth a looping
  effect. The clearest example I can think of that is not in the readings is the removal
  of homosexuality from the DSM in the 1970s: before that, a person classified as
  a homosexual was classified as ill, and the classification changed what a life available
  to that person looked like; after it was withdrawn, an entirely new set of ways
  of describing and organizing oneself became available, and the category itself had
  to be rewritten. A current example would be ''neurodivergent,'' which was coined
  by activists and has since changed what clinicians look for, so that the people
  now diagnosed are not quite the people the earlier studies were about.


  Millennials and Gen Z are obviously interactive in this sense. Nobody is a Millennial
  in the way that an atom is an atom. The label was manufactured by market researchers
  and journalists, it was pushed at the people it described through advertising, listicles,
  and workplace training, and those people then began to recognize themselves in it,
  to date and hire and complain in ways that match it, and to complain in ways that
  match it too. The loop is closed.


  That has two consequences, I think. First, it means a generation is less real than
  a natural kind, or at least real in a weaker way: the boundary of the group is not
  out there in the world waiting to be found, it is made by the act of counting. Hacking''s
  account shows that once a classification loops, there is no fact of the matter about
  what the group was like before it was classified, so any survey showing that Millennials
  delay marriage is measuring an artifact of the survey. Second, Mannheim supports
  this. He showed that what makes a generation is not just being born in the same
  years but sharing a common location in history, and that a generation is really
  a set of attitudes produced by that shared location. On his view, then, a marketing
  category and a birth cohort are not so different: both are locations in history,
  and both become real when people start behaving accordingly.


  What a demographer would have to do differently is hard to say, because if the looping
  is total there is nothing stable left to measure. At minimum she would have to record
  when the label was applied and treat pre-label and post-label data as data about
  different groups, rather than as one series."


