  form of state — the one closest to the freedom that nature allows each of us. I
  want to argue these are not two different doctrines but one, and that the identity
  runs through the definition of freedom.


  Call it the composition thesis: in a democracy the power of the sovereign is nothing
  over and above the powers of the citizens conjoined, and the sovereign just is those
  citizens under a certain description. If the sovereign is the citizens, then a decree
  of the sovereign is an effect of which the citizens are, taken together, the adequate
  cause. But then the citizen who obeys that decree is not being determined from outside
  by another thing. He is being determined by a body of which he is a part, and to
  be determined by a whole you are part of is to be determined, in part, by yourself.
  So in democracy obedience and freedom come apart no more than they do in the case
  of my hand obeying me: when I raise my arm I am both the one who commands and the
