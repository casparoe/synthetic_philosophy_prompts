  For the past couple of years I have been reading, entirely on my own and with no
  academic training, about the proposal to replace the neurons of a human brain one
  at a time with functionally identical synthetic substitutes, and about whether the
  person who emerges at the end is the same person who started. In these discussions
  — mostly online essays and podcast transcripts, but occasionally in more serious
  writing — a certain maxim keeps turning up, usually in something like the form ''a
  difference that makes no difference is no difference at all'', and it is used to
  settle arguments in both directions at once.


  I have noticed it doing at least three distinct jobs, and I suspect they are not
  the same claim:


  1. Someone argues that gradual replacement cannot be altering the person''s conscious
  experience, because if it were, the subject would notice and report it, and by hypothesis
  they report that everything seems exactly as before. So no observable difference,
  therefore no difference.

  2. Someone argues the opposite conclusion, that whether the resulting being is ''really
  you'' is an empty question, because there is no possible test whose outcome would
  settle it, and a question with no conceivable test is not a question about anything.

  3. Someone says that even if there were a fact of the matter — even if replacement
  did destroy you and something else carried on — it would make no difference to anyone''s
  decisions, so there is nothing to argue about.


  I would like the maxim taken apart. Please set out, as a list I can return to, the
  different precise theses that this single sentence might be expressing... For each:
  state it precisely enough that one could see what would refute it; say whether it
  is trivially true, substantive but defensible, or false; and say which of them,
  if any, actually licenses each of the three uses above. In particular I want to
  know whether use (1) and use (2) can both be supported by the same reading, because
  they seem to point in opposite directions. Also: does any reading of the maxim that
  is strong enough to do the work in (1) or (2) commit its user to treating other
  questions I care about as empty too — e.g. whether ... — and if so, is that a welcome
  consequence or a reductio? Finally, tell me which reading you think people actually
  have in mind when they reach for the maxim mid-argument, and whether the maxim is
  doing any work at all beyond signalling that the speaker has decided the question
  is closed.


  Please write in British English.


