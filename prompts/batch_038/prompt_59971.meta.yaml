  welcome or one that discredits the reading? And which reading do you think people
  actually intend when they reach for the maxim in mid-argument, as opposed to which
  reading their argument needs?


  I am not after reassurance that the slogan is vague; I want the separate claims
  separated. Please write your answer in British English."


