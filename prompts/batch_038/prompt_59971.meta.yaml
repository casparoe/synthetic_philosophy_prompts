  "I have no academic training in philosophy — I run a small IT maintenance business
  and read for pleasure — but for two years now I have been working through discussions
  of the proposal to replace the neurons of a living brain, one at a time, with synthetic
  parts that do exactly the same job, and of whether the being that emerges at the
  end is the one that went in.


  In these discussions a maxim keeps appearing, usually in roughly the form ''a difference
  which makes no difference is no difference at all'', and it is wielded to end arguments.
  I have caught it doing at least three separate pieces of work, and I do not believe
  they are the same claim.


  First: someone argues that the replacement cannot have altered the person''s inner
  life, on the grounds that if it had, the subject would have noticed and said so,
  and by stipulation the subject reports that everything feels exactly as it did before.
  Since no difference could ever show up, there is no difference.


  Second: someone argues, in the opposite direction, that asking whether the resulting
  being is really the original is simply not a question with an answer, because nothing
  anyone could do would ever settle it — and a dispute that no possible observation
  could settle is a dispute about words, not about the world.


  Third: someone grants that there might be a fact of the matter, perhaps even that
  the original dies and an imposter carries on, and then says this changes no decision
  anyone should make, so there is nothing worth arguing about.


  Could you take the maxim apart for me? I would like a list, which I can keep and
  come back to, of the distinct precise theses that one sentence could be standing
  for — I expect there are metaphysical versions, versions about meaning or about
  what a question requires, versions about evidence, and versions about practical
  relevance, and I suspect some of them shade into one another. For each, please state
  it precisely enough that I could see what would refute it; say whether it is trivially
  true, substantive but defensible, or false; and say whether it would license the
  first, second, or third use above, or none of them.


  Three things in particular matter to me. Is there any single reading that supports
  both the first and the second use, since they seem to point in opposite directions
  — one of them says the inner life is settled by what could be observed, the other
