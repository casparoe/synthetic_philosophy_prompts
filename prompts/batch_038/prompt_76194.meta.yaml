  Student answer draft:


  "Panpsychism says mentality is fundamental and everywhere: the basic physical entities
  posited by physics have, in addition to their dispositional/structural properties,
  intrinsic phenomenal properties. Constitutive panpsychism adds that the consciousness
  of organisms like us is constituted by — built out of, not merely caused by — the
  consciousness of those micro-entities. The combination problem asks how that constitution
  is supposed to work. James pressed it against the ''mind-stuff'' theorists of his
  day: a collection of a hundred separate feelings, however tightly packed, does not
  thereby become one new single feeling, since each is still owned by its own subject
  and private to it; so the panpsychist owes an account of how micro-experiences fuse
  into the unified consciousness of a person. Goff separates two versions: the quality
  combination problem (how do micro-qualities like a tiny bit of red-ish feel sum
  into the rich unified quality of my experience of a tomato?) and the subject combination
  problem (how can several distinct subjects literally add up to one further subject?).
  In neuroscience the same puzzle goes by the name of the binding problem, so panpsychists
  at least have company.


  Note that the problem bites only constitutive panpsychism of this sort. If instead
  one holds panprotopsychism — the micro-level has protophenomenal properties, not
  experiences, which collectively give rise to experience — there is nothing to combine,
  since no micro-subject is being asked to merge with another. And if one goes the
  other way to cosmopsychism, where the whole universe is the one basic subject and
  our minds are aspects of it, combination is simply reversed: the cosmos doesn''t
  have to be assembled from parts, so the objection evaporates.


  Goff''s own preferred response is phenomenal bonding: micro-experiences stand in
  a special relation such that, when bonded, there is a further subject whose experience
  is the sum. Since the bonding relation is itself a fundamental feature of reality,
  this answers the objection without giving up constitutive panpsychism. Because the
  combination problem is in any case only an explanatory gap — we just can''t see
  how it works — it puts panpsychism in exactly the same boat as physicalism, which
  also can''t show how matter gets to feel like anything; so it can''t be a reason
  to prefer one over the other, and it isn''t a distinctively damaging charge."


