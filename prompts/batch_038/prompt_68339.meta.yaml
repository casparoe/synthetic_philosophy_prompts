  population shares the same environment — e.g., myopia before mass literacy vs after;
  or the classic: everyone has the same diet so variation in a nutrition-dependent
  trait is all genetic." Let me use: "In a population where every child gets the same
  schooling, differences in a school-taught skill would be almost entirely genetic
  in variance terms; I want to say that a heritability of 0.9 in that setting is compatible
  with the skill being 100% taught." (Correct — good.)

  (e) "When a trait is highly heritable in one population, I want to say the same
  trait can be lowly heritable in another population with more environmental variation."
  (Correct.)


  Tension/wrong ones:

  (f) "If h² is low (say 0.15) in a population where schools vary a lot in quality,
  I want to say that''s evidence that fixing the schools will raise achievement a
  lot, and that a highly heritable trait in a population with uniform schools is thereby
  harder to improve by policy." This conflates low heritability with high environmental
  malleability/response-to-intervention. Actually, low h² means environment currently
  explains most variance; it does NOT mean a specific intervention will shift the
  mean, nor that a high-h² trait is unresponsive to intervention (the PKU case, the
  supplementation case). This is the tension with (c)/(d) — a genuinely hard-to-reconcile
  pair.

  (g) "Identical twins reared apart correlate 0.72 on the trait; I want to call that
  a direct estimate of heritability, more trustworthy than adoption studies that compare
  relatives." Subtle: r_MZ-apart estimates broad-sense heritability under assumptions
  (no assortative mating, no G-E correlation, equal environments for separated twins,
  no shared prenatal environment issues, representative sampling, and the correlation
  is not itself the heritability unless those hold; also it excludes non-additive/additive
  distinction). Also, twins reared apart often share prenatal environment and are
  frequently placed in similar homes (selective placement). So "direct estimate, more
  trustworthy" is questionable.

  (h) "GWAS SNP-heritability comes out at 0.35 while twin studies say 0.65; I want
  to say the twin number was inflated and 0.35 is the honest figure." Subtle: missing
  heritability arises from imperfect tagging of causal variants by SNPs, rare variants
  not on arrays, non-additive effects, and the two estimators answer slightly different
  questions (broad vs narrow sense, and SNP-h² is a lower bound). Also twin studies
  can be inflated by equal-environments violations, but the gap doesn''t settle it.

