  heritability as fixed/individual-level, etc. That''s good but maybe too "well-worn"?
  The requirement is that prompts should be somewhat in the weeds so models can''t
  regurgitate. Heritability misconceptions are fairly standard fare. But I can inject
  a niche-ish twist: e.g., a summary from a behavioral genetics blog that includes
  some more subtle claims — like "heritability estimates from twin studies are inflated
  by shared environment assumptions," "the equal environments assumption," "GWAS-based
  SNP heritability is lower than twin heritability, which shows twins are wrong,"
  "missing heritability," "heritability of 0.8 for height means 80% of your height
  is genetic," etc. Actually a nice subtle misrepresentation: conflation of narrow-sense
  and broad-sense heritability, and the claim that "because heritability is population-specific,
  it says nothing about whether a trait can be changed by environment" vs "high heritability
  means environment doesn''t matter" — a well-known debate. Also: the claim that heritability
  is a ratio of variances and thus requires no assumption about individual-level attribution,
  versus the "causal" reading.


