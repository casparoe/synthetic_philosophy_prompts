  ---


  For eleven years I have designed charts and pictograms for a municipal benefits
  agency, and three weeks ago I was handed the redesign of the eligibility notice
  that goes out to every household in the city — roughly 200,000 of them, in five
  languages, to readers whose literacy in any of those languages cannot be assumed.
  An audit had found that a large share of eligible households never respond to the
  notice at all. This is not abstract for me: my own mother missed a deadline for
  a heating subsidy two winters ago because the letter that told her about it was
  well written, correctly translated, and impossible for her to parse. So I have become,
  unwillingly, a person who has to take a position on whether pictures can carry legally
  operative content on their own.


  A colleague, seeing me flail, told me that a philosopher tried to build exactly
  this a century ago: Otto Neurath and the picture-language program that grew out
  of his Vienna museum — the Vienna Method of pictorial statistics, later Isotype,
  with Gerd Arntz drawing the signs and Marie Reidemeister doing the transformations
  from source material to chart. I have skimmed enough to know the rules of thumb
  everyone repeats (repeat an identical sign rather than enlarge one; keep to counts
  people can take in; make the display self-explanatory; the museum''s line that it
  is better to remember simplified pictures than to forget accurate figures) and to
  suspect there is a real theory underneath them that I am not equipped to read.


  So: please restate Neurath''s picture-language program in the vocabulary I actually
  work in — glyph libraries and design systems, visual encoding channels, legends
  and keying, redundancy and small multiples, direct labeling, accessibility conformance,
  the distinction between a chart type and the claim a chart makes. Go through it
  claim by claim...


  Then the residue report:

  - what translates cleanly, and into which of my terms;

  - what only translates if I distort it — where the nearest item in my vocabulary
  carries assumptions Neurath would not accept;

  - what has no counterpart in my vocabulary at all.


  And be honest about the direction of the errors: don''t launder my field''s defaults
  into his program. Where Neurath would reject a standard piece of my craft (encoding
  quantity by area or length, say, or the premium we put on precision), say so and
  say why. Conversely, where modern data visualization has an answer he lacked, mark
  it as mine rather than his.


  Three specific probes...

  1. The logical one: can a picture language state negation and generality — the content
  of a sentence like the notice''s key conditional, that a household which does not
  respond by a date forfeits its place in the queue? What does his system do with
  it, and what does that cost?

  2. The institutional one: my committee wants to know whether pictograms may stand
  alone, without accompanying text, in a document that has legal effect. I understand
  Neurath treated his pictures as an auxiliary to words rather than a replacement.
  Is that a limit he argued for on principle, or a concession to the technology and
  audiences of his time?

  3. The semantic one: does a Neurath chart assert something that could be false,
  or does it merely display? My field has no settled answer, and I suspect he does.


  Finally: tell me which single step of your translation you think is most likely
