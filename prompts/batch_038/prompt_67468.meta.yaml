  "The archival turn made one simple point: archives are not neutral containers of
  evidence but instruments of power. Foucault showed that what counts as a record
  is decided by the archive itself, so every document is already an expression of
  domination. Trouillot''s Silencing the Past identified the archive as the decisive
  site of silencing: because the powerful decide what is preserved, the powerless
  leave no trace, and the historian''s only honest options are to acknowledge the
  gap or to invent against it. Derrida went further, arguing in Archive Fever that
  archiving is a form of repression — the archive substitutes a dead trace for living
  memory, which is why the archon''s authority is really the authority to forget.
  From this follows a practical rule for curators: the principle of provenance, which
  treats a fonds as a self-evidently coherent whole, is a leftover of the same power-laden
  logic and should be abandoned in favor of re-assembling records around the communities
  they concern. And the skeptical reply that this reduces history to opinion misses
  the point: if evidence is produced rather than found, no claim can be better evidenced
  than any other, which is exactly what makes the archival turn radical."


