  Misrepresentations to plant:

  1. Foucault: conflating his technical "archive" (system of formation/transformation
  of statements) with the empirical repository and with a claim about who decides
  what counts as a record — an agent-centered, decisionist distortion. Foucault''s
  archive is not an institution that decides; and it''s not primarily about domination
  but about the historical a priori of discursive formations. Also "every document
  is already an expression of domination" — overstatement.

  2. Trouillot: locating silencing decisively at the archival stage (he locates it
  at four moments, beginning with the creation of sources — i.e., before the archive),
  and the inference "the powerless leave no trace" (he argues silences are recoverable/legible
  in some cases; the Haitian Revolution was recorded, indeed abundantly, but was rendered
  unthinkable; also his point about the presence of the past). Also "the historian''s
  only honest options are to acknowledge the gap or invent against it" — a false dilemma
  that mischaracterizes both Trouillot and the practice of critical fabulation (Hartman''s
  inventiveness is not licensed as free invention; she insists on the constraints).

  3. Derrida: "archiving is a form of repression" / "authority to forget" — inverts
  the death-drive point. Derrida: the archive is bound to the death drive as a threat
  to memory, so archiving is a struggle against it; and crucially archivization produces
  the event as much as it records it; the technical structure determines the archivable
  in advance; the archive is a question of the future, of promise and responsibility,
  not only of the past. So "substitutes a dead trace for living memory" is a platonist-tinged
  distortion (that''s more like the pharmakon critique of writing in Plato''s Pharmacy
  — a nice cross-reference to note; a good model could flag that the summary imports
  Derrida''s earlier critique of writing into Archive Fever and drops the productive/futural
  dimension).

  4. Provenance: claiming the archival turn requires abandoning respect des fonds;
  in fact Stoler and others read "along the archival grain," i.e., use provenance
  as diagnostic of the colonial state''s categories; and provenance is itself contextualist
  — it preserves the record''s relationship to its creating activity, which is what
  makes power visible. The summary treats it as a naive coherence doctrine.

  5. The relativist inference: "if evidence is produced rather than found, no claim
  can be better evidenced than any other." Non sequitur: production of evidence doesn''t
  entail underdetermination; Trouillot insists on the discipline of tracking silences,
  and the whole method presupposes better/worse accounts.


  Also the summary might contain a subtle overstatement: "the archive decides what
  counts as a record" — agency misattribution.


