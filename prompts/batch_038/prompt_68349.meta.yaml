  Here are the facts as I have them, so you don''t need to go look anything up: The
  Policy Analysis Market was a proposed futures exchange developed out of DARPA''s
  Information Awareness Office, first funded around 2001 and pitched by a small San
  Diego firm called Net Exchange, with the University of Iowa''s political futures
  market and Robin Hanson''s work as the models. The idea was that analysts and policymakers
  could trade contracts keyed to economic and political indicators in a handful of
  Middle Eastern countries — GDP, unemployment, whether a given regime was still standing
  — on the theory that prices aggregate dispersed information better than expert forecasts
  do. Then, in July 2003, two senators (Byron Dorgan and Ron Wyden) held a press conference
  saying the thing would let people bet on assassinations and terror attacks, pointing
  at some sample screens buried in the project website''s background graphics that
  included things like the assassination of Yasser Arafat, a North Korean missile
  attack, and the overthrow of the king of Jordan. Within about a day the Pentagon
  cancelled it. John Poindexter, who ran the IAO, was gone within a couple of weeks
  — even though, by Hanson''s account, he had very little to do with PAM specifically.


  What I want is an analysis of that episode as a test case for the prediction-market/futarchy
  program, running in both directions.


  First, the mapping. Take the theory seriously... etc.


  Then: where the theory is silent / where the case strains it.

  Then: what the episode tells you about the theory.

  Then: the verdict + settled vs contested.


  Let me write specific sub-questions:


  1. The mapping: who are the traders the theory imagines (and who would actually
  have traded — a thin, tiny market of maybe a few dozen people, several of whom would
  be insiders with classified knowledge)? What''s the payoff structure? Would prices
  even have been informative at that liquidity, or does the theory quietly assume
  a depth PAM would never have had?

  2. The manipulation objection: the assassination/attack contracts are the thing
  that killed it. Does the theory have a real answer — i.e., is the incentive to bring
  about a bad event in order to collect actually significant when you weigh the payout
  against the cost and risk of the act, and given the market''s size? Be honest about
  whether the standard answer here ("manipulation is expensive and self-limiting,
  plus betting on an attack is mostly a way of reporting it") is a settled result
  or a contested one.

  3. Was PAM even a futarchy case? Futarchy proper (Hanson''s 2000 slogan, vote on
  values but bet on beliefs, refined in the 2013 paper) is about governance — policies
