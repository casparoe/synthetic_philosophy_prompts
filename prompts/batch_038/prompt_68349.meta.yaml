  Domain: Futarchy and governance by prediction markets.

  Type: Analyze a real historical episode through the lens of a theory.

  Episode: the 2003 DARPA Policy Analysis Market (PAM) shutdown.

  Persona: journalist covering science and ideas, casual, a typo or two.

  Epistemic request: separate what''s settled from what''s genuinely contested among
  people who know the topic; don''t present a contested view as consensus.


  Content plan for the prompt:

  - Open casually with the assignment: writing a piece for a weekend ideas section,
  revisiting the PAM episode ~20+ years later (maybe framing as "the Pentagon''s terror
  futures market" anniversary).

  - Supply the salient facts in the prompt (as the type notes allow): DARPA''s Information
  Awareness Office; the market was proposed by Net Exchange (San Diego firm), modeled
  on the Iowa Electronic Markets and Hanson''s work; it would have traded contracts
  on Middle East economic and political indicators (GDP growth, unemployment, regime
  stability) for a handful of countries; sample screens shown faintly in the website
  background included things like an assassination of a Middle East leader, a missile
  attack by North Korea, an overthrow of a monarch; two senators held a press conference
  on July 28, 2003 denouncing it as a betting parlor on atrocities/terrorism; within
  about a day the Pentagon cancelled it; Poindexter (head of IAO) was out within weeks.

  - Ask for the analysis through futarchy/prediction-market theory: what the theory
  says the market would and wouldn''t have done (aggregation of dispersed info, thin
  liquidity, the "no incentive to lie because it''s cheap to be right" story, manipulation
  vs. "bounty" incentive), what the assassination/attack contracts do to the picture
  (does paying someone when a terror attack happens create an incentive to cause it
  — the manipulation objection — and what does the theory actually say about magnitude:
  liquidity, cost of moving price vs. payoff), and whether PAM was even a futarchy
  case at all (it was decision-support/forecasting for analysts, not governance; nobody''s
  policy was to be set by prices — so is the episode evidence about futarchy or only
  about the politics of prediction markets?).

  - Then the reverse direction: what the episode shows about the theory — where does
  futarchy/prediction-market theory fail to have resources? Candidates: legitimacy
  and expressive value of democratic decision-making; the fact that a market''s existence
  is itself a public fact that changes politics; the "moral repugnance"/yuck factor
  as possibly tracking something real (commodification arguments, Sandel-ish) vs.
  merely a PR problem; who counts as a trader (insiders with classified info — a market
  where the best-informed traders are the ones who shouldn''t be trading); the fact
  that the senators didn''t need to read the fine print because there was no fine
  print to read (no institution, no constituency, no defenders).

  - Ask specifically: map the actors, options, payoffs; say what the theory predicts
  about each; identify where the theory is silent or where the journalist''s story
  forces it to stretch; and end with a verdict about whether PAM is best read as a
  case where the theory was vindicated-but-thwarted by politics, or where the episode
  exposed a real hole in the theory (i.e., that markets need political legitimacy
  as an input, not an output).

  - Ask for the settled-vs-contested marking: e.g., what''s settled (markets aggregate
  some info; they beat polls in some elections under some conditions; manipulation
  is possible but costly) vs contested (whether assassination contracts create real
  incentives; whether futarchy''s value/belief separation is coherent — Cowen''s objection;
  whether prediction markets would even have been liquid enough to matter; whether
  the shutdown was mostly PR theater vs. a substantive judgment). And ask that they
  not present the pro-market line as consensus.


  Length: reasonably substantial but not bloated. Should be casual, journalist voice,
  with a typo or two (e.g., "recieve", "thier", or a dropped word — keep it natural:
  "its been 20 years", "seperate").


