  ---

  Mises'' argument, first set out in his 1920 paper, is an argument about knowledge.
  His claim is that the information a planner would need — which machines are wearing
  out, which local supplier is reliable, what a particular factory foreman knows about
  his own shop floor — is dispersed across millions of people, is often tacit, and
  can never be gathered in one head or one building. Prices, on this view, are a communication
  device: they compress all that local knowledge into a single number. Mises concludes
  that without them the planner flies blind.


  Hayek''s version, developed later in the 1930s, is more radical and more fundamental.
  He argues that the problem is not that the planner cannot collect the data but that
  in socialism there is nothing for the data to be about: with no private ownership
  of the means of production, capital goods are never actually exchanged, so no genuine
  exchange ratios for them can ever form. The planner can keep accounts, but accounting
  entries are not prices. Without prices for capital goods there is no way to compare
  alternative production methods, so "rational" allocation is not merely difficult
  but meaningless. On this reading Hayek, not Mises, is the one who thinks socialism
  is conceptually impossible, while Mises thinks it is merely informationally hopeless.


  Lange''s answer is to accept the formal challenge. In his 1936–37 model he keeps
  consumer sovereignty and free choice of occupation, and lets a Central Planning
  Board do what Walras'' auctioneer does: it announces shadow prices for producer
  goods, managers are told to combine inputs so as to minimise average cost and to
  produce the output at which price equals marginal cost, and the board raises prices
  where there are excess demands and lowers them where there are surpluses. Iterated,
  this converges on the same allocation a competitive market would reach. Lange adds
  that a board with enough computing power could solve the whole system of equations
  at once, so in principle the trial and error could be speeded up.


  So the debate was settled at the level of theory in Lange''s favour — socialism
  is logically possible — and what remained was an engineering question. That is why
  the events of 1989–91 do not settle anything theoretically. The Soviet system failed
  because of the arms race, the nomenklatura''s self-interest, and the falsification
  of plan reports by managers who had no reason to tell the truth; these are political
  and incentive failures, of a kind any regime can suffer. If the information problem
  is in principle solvable, then the collapse of actually existing socialism shows
  only that the Soviet Union never implemented the Lange solution, not that the calculation
  argument was right.

