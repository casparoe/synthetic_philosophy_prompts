  Here''s the question the students were set:


  "Mises argued in 1920 that rational economic calculation is impossible under socialism;
  Lange responded in 1936–37 with a model in which a Central Planning Board sets producer-goods
  prices by trial and error. Explain how Lange''s proposal is meant to answer Mises,
  and explain Hayek''s objection to that proposal. Then say whether the collapse of
  Soviet-style planning in 1989–91 settled the theoretical dispute. Pure chronology
  will not pass."


  And here''s one student''s answer, more or less in full (max 900 words):


  [answer]


  I''ve read it twice and I honestly can''t tell if it''s a strong essay or a fluent
  weak one. I''m not trying to steer you either way — if you think it deserves a good
  mark, say so and give it the good mark. What I want is a grade out of 100 and the
  reasoning broken down piece by piece, so I can check my own reading against yours.


  Please use these sections, in this order:

  - Grade — the number out of 100 and two sentences on what drove it. (~50 words)

  - What it gets right — the substantive points the student has genuinely understood.
  (~150 words)

  - What''s wrong or missing — numbered, and for each: what the paper actually claims,
  what the correct position is, and roughly how many points that costs. Be as specific
  as you can; I care more about the small turns of argument than about prose. (~400
  words)

  - Comments for the student — what I''d write on the script itself, in plain language,
