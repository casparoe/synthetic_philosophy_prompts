  up" — antecedent impossible given architecture? Eh, less apt. But "if the database
  had been strongly consistent" requires a different system entirely — a "structural"
  counterfactual, which maps to my injected taxonomy.


  Great. My injected taxonomy: *divergence class* with three values:

  - KNOB: the antecedent differs from actuality only in a setting/config value or
