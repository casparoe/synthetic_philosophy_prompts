  Another key concept for the procedure: the distinction between a counterfactual
  and a causal claim (Lewis: causation analyzed via counterfactual dependence, with
  problems of preemption and overdetermination). Preemption is *very* apt for incident
  analysis: "if the primary had failed over, the outage would have been prevented"
  when the secondary also would have failed — early/late preemption, backup causes.
  This is a gold mine for the procedure: the tool must handle claims that fail because
  of preempting back-ups, and "trumping preemption" etc. And overdetermination: two
  bugs both sufficient — counterfactual dependence fails even though there''s genuine
  causation. That''s a real problem for the engineer''s ledger: an "if we''d fixed
  X, the outage wouldn''t have happened" can be false-ish (Y alone would have caused
  it) even though X was a genuine cause. This gives the "answer the asker won''t like"
  case naturally.


  Also: "the problem of effects" / backtracking counterfactuals — an engineer writing
  "if we had seen this in staging, we wouldn''t have shipped" is a backtracking claim
  that infers something about the past (the code was buggy) rather than a causal consequence.
  Lewis''s rule against backtracking. Very apt.


