  Hmm, one concern with Bertrand/stat-mech: is the translation actually substantive
  enough to demand a good residue report? Yes:

  - Principle of indifference → uniform measure. In stat mech, uniform (Liouville)
  measure over the energy surface is not chosen by indifference but by dynamics (stationarity,
  invariance). Translation: "indifference" is replaced by "invariance."

  - The parameterization dependence (which variable you''re indifferent over) → the
  choice of macrovariables/coarse-graining, and canonical transformations. In stat
  mech, Liouville measure is invariant under canonical transformations, which is precisely
  why the parameterization problem seems to disappear — but the choice of which degrees
  of freedom to coarse-grain over is not determined by the dynamics. Residue.

  - Objective chance vs epistemic credence: stat mech (at least in the Boltzmannian/typicality
  reading) treats the measure as counting microstates, and "typical" replaces "probable"
  — so a whole class of epistemic questions ("what should I believe given no information?")
  has no counterpart.

  - The "well-posedness" diagnosis: Bertrand''s problem is ill-posed because there''s
  no physical randomizing process; stat mech would say a chord isn''t produced by
  any dynamics, so the question of the measure is a question about the generating
  process (Poincaré''s method of arbitrary functions: a coarse-grained distribution
  over an initial condition evolves to smoothness under repeated transformation —
  hence the uniform answer is about the apparatus, not the geometry).

  - MaxEnt: Jaynes''s transformation-group solution picks a measure by invariance
  under the group of transformations of the problem — that''s a *formal* analogue
  of what dynamics does *physically*. Residue: the invariance group choice is itself
  arbitrary; the stat mech analogue of "which symmetry group?" is "which Hamiltonian
  / which coarse-graining?" and there the answer comes from the world.

  - What doesn''t survive: the very idea that a symmetry in the *description* licenses
  a credence; the notion of "insufficient reason" as a state of knowledge; the idea
  that the paradox shows something about rationality rather than about missing physical
  information. Also possibly: the difference between "the measure" and "typicality,"
  and the question of whether the measure is objective chance or a tool for prediction
  (the "probability problem" of stat mech — Albert vs Boltzmannian typicality vs Gibbsian)
  — hmm, that''s a bonus layer: stat mech has its OWN version of the paradox (why
  should the measure at all, given the past hypothesis?). Nice: the residue report
  should note that stat mech doesn''t solve the problem but imports it — the uniform
  measure needs the Past Hypothesis (a low-entropy initial condition) to justify the
  arrow of time and to make the measure non-arbitrary; so the "translation" relocates
  indifference from the choice of parameterization to the choice of initial condition
  of the universe. That''s a genuinely sharp point that makes the prompt demanding
  and interesting.


