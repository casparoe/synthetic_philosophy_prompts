  Structure (casual, with a typo or two):


  "Here''s one I''ve been chewing on. Take the 1976 US swine flu vaccination program
  — [facts] — and analyze it as a case of consequentialist cluelessness.


  The cluelessness objection (Lenman-style) says: the consequences of our acts ramify
  through history indefinitely, we can''t trace them, so we have no idea what any
  act''s overall value is, and a consequentialism that tells us to maximize is therefore
  practically empty / action-guiding bankrupt. The stock examples are huge and remote
  — colonial plunder, whether to have a child, the long-run demographic effects. My
  hunch is 1976 is interesting precisely because it''s *not* remote: the whole disaster
  happened inside 10 months, and the relevant unknowns were mostly near-term.


  So: [asks]

  1. Map the decision. Who are the consequentialist agents here (Ford? Sencer? the
  panel? Congress?), what are the actual option sets at the moments of decision —
  Feb when the memo lands, March at the White House, the indemnity fight in June,
  the December shutdown — and what does each look like under expected-value reasoning?

  2. Where exactly was the ignorance? Distinguish (this is my own coinage, not standard
  terminology, just run with it) between **enumerable uncertainty** — you know the
  candidate outcomes, you just can''t put good probabilities on them (pandemic vs
  no pandemic; GBS risk) — and **unenumerable uncertainty**, where you can''t even
  list the outcome space because the relevant possibilities haven''t occurred to you
  (the trust damage, the 2009 ''cry wolf'' hangover, the legal precedent for indemnification).
  Say which kind bit at each decision point and whether the case is one where the
  objection does its work.

  3. Does cluelessness actually explain why 1976 went wrong? I suspect it doesn''t,
  or only partly — the post-mortems blame speed, politics, the election year, groupthink,
  and a failure to use ordinary near-term cost-benefit reasoning. If the real failure
  was bad *bounded* reasoning rather than cosmic ignorance, does that undercut the
  objection''s usual framing (which needs the far-future stuff to bite), or does it
  just mean the objection applies less here?

  4. And the reverse test: the anti-vaccination / hesitancy consequence that runs
  from 1976 to now is *exactly* the kind of long-tail ramifying effect Lenman-type
  arguments point at. But it was traceable enough that public health people cited
  1976 constantly during the 2009 H1N1 episode. So the case seems to show long-run
  effects that are (a) real, (b) large, (c) still knowable in a usable way decades
  later. What does that do to the objection? Does it suggest cluelessness comes in
  degrees, that the effects are knowable-but-not-quantifiable, or that the objection
  is about something else entirely (e.g. it''s really about objective vs subjective
  rightness / decision-quality)?


  Bottom line first: one or two sentences on whether 1976 confirms, strains, or misses
  the objection. Then the analysis. No citations or reading list, I can''t look anything
  up and neither can you. Hard cap 900 words."


