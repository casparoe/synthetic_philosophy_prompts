  ---

  I work on small unmanned aircraft — I build and tune the flight controllers for
  a company that makes survey drones. I have no formal training in physics or philosophy
  beyond high school, but I''ve spent a lot of time thinking about something in my
  work that I can''t resolve, and I''d like a careful answer.


  The thing is this. Our aircraft know they are turning without looking at anything.
  A MEMS gyroscope on the board measures rotation rate directly — it''s a tiny vibrating
  structure and when the board rotates, a force appears that has nothing to do with
  any outside object; there is nothing it is rotating relative to, from the instrument''s
  point of view. An accelerometer in free fall reads zero, and reads a definite number
  when it''s being held up or pushed, again without reference to anything external.
  An inertial navigation system integrates those readings and knows its own attitude
  in empty space, in cloud, at night, with no GPS, no stars, no landmarks. And I''ve
  read that the same goes for a Foucault pendulum: its plane of swing slowly turns
  relative to the ground beneath it, at a rate that depends only on latitude, and
  it isn''t looking at anything either.


  Meanwhile the physics I''ve read is emphatic that there is no such thing as detectable
  absolute motion. Uniform velocity is relative; you cannot tell, even in principle,
  whether you are moving at constant speed in a straight line, and there is no fact
  of the matter. That is supposed to be the whole lesson of relativity. So our instruments
  seem to be doing something the theory says is impossible — measuring rotation with
  respect to nothing — and yet everybody agrees the instruments are right, because
  the drone flies.


  I''ve also read three things that make it worse. First, the old thought experiment
  about water in a bucket on a rope: when the bucket spins and the water is at rest
  relative to the bucket, the surface still climbs the walls, which is supposed to
  show that what matters is rotation relative to something other than the bucket.
  Second, that some physicists have said this "something other" is the mass of the
  distant universe — that a spinning body is spinning relative to all the matter out
  there — and there''s apparently a real measured effect where a rotating planet very
  slightly drags the local inertial frame around with it, detected by satellite experiments.
  Third, that Einstein''s field equations have perfectly good solutions for a completely
  empty universe that still has a definite geometry and a definite notion of which
  paths are "straight," which seems to mean there is something there even when nothing
  is in it.


  So here is what I want to know, and I want it treated as a question about a practice,
  not about a textbook debate:


  1. What does our practice — building and trusting instruments that report rotation
  and acceleration without any external reference, while denying any instrument could
  report velocity in the same way — actually presuppose? Reconstruct the implicit
  view of space (or spacetime) as precisely as you can. Does it presuppose that space
  is a thing with its own state, or that there is a fact of the matter about non-rotation
  that isn''t a fact about relations among material bodies, or something third that
  I don''t have a word for?


  2. Separate what the practice strictly requires from what merely fits it comfortably.
  I suspect a lot gets conflated here: maybe the practice only needs "there is a physically
  privileged class of non-accelerating states" and nothing at all about what space
  is made of. Tell me exactly where the line is, and which claims an engineer is entitled
  to and which are metaphysical surplus.


  3. Is the practice internally consistent, given the asymmetry I keep hitting — rotation
  absolute, velocity relative? Reconcile the two halves or show me that they can''t
  both be right. If they can''t, which one does the engineering actually depend on?


  4. The rival view — that rotation is always rotation relative to the distribution
  of matter in the universe — is supposed to be a competitor. Show me what would have
  to be true for our instruments to be measuring that instead, and then tell me whether
  any experiment I could actually run, or that anyone could run, would distinguish
  the two. In particular: if the distant matter were what my gyroscope is tracking,
  would my drone fly any differently? Would anything in the design change? I''d like
  to know whether the rival view makes any contact with practice at all, or whether
  it''s a difference with no difference — and if it''s the latter, say so plainly
  rather than diplomatically.


  5. Finally, tell me what the practice would look like if we replaced the presupposed
  view with the rival one. Is there any change in how we calibrate, navigate, or teach
  this, or is the practice completely neutral between the two, in which case I''d
  like to know that neutrality is real and not just an artifact of how I''ve described
  things.


  Please don''t write me a survey of the history of the debate and don''t give me
  a reading list. I want the implicit theory reconstructed and then judged: what it
  commits us to, what it doesn''t, where the practice is genuinely underdetermined
  by several competing theories, and where I''ve described the practice in a way that
  quietly assumes one of them.


