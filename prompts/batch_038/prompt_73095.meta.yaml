  The asker''s view: call it "standing-based prohibitionism" or better, "the ledger
  account." Let me design it carefully.


  Core claim: A slur''s meaning is exhausted by that of its neutral counterpart; there
  is no derogatory content encoded in the lexical item, in a conventional implicature,
  in a presupposition, or in a separate expressive dimension. What distinguishes a
  slur from a neutral term is a social rule: using the word (outside licensed contexts)
  makes a claim on the group''s standing — specifically, the speaker asserts a rank
  ordering and thereby takes on a public commitment that others may hold them to.
  Wrongness of use is a matter of the act, not content. Key novel machinery to make
  it testable and to distinguish from prohibitionism:


  1. The "licensed contexts" clause: mention, quotation, reclamation, and — importantly
  — contexts where the speaker is *inside* the targeted group and uses the term to
  signal affiliation. The asker''s account explains the licensing not by a rule stipulated
  about the word, but by whether the token *changes the audience''s evidence about
  the speaker''s commitments* regarding the group''s standing. So reclamation works
  because the in-group user cannot use the token to assert a lower standing for themselves
  (the assertion is void/self-undermining).


  2. The "void-assertion" idea: slurring is an act of asserting a ranking; the act
  fails (is "void") when the speaker lacks the social position to make it stick or
  when the audience has decisive evidence against it. Hence: an in-group use is void;
  a use by someone the audience knows to be a member of the group''s allies is not
  void but merely infelicitous; a use by an anonymous online poster is void to the
  extent that the audience cannot identify them — and this predicts something checkable:
  derogatory force should attenuate with speaker anonymity unless the anonymity itself
  is taken to conceal a commitment (e.g., a pseudonymous account with a consistent
  history). That gives an empirical handle: "the account predicts graded harm as a
  function of audience''s confidence in the speaker''s endorsement, not as a function
  of the word itself."


  3. A distinguishing prediction vs. multidimensional/expressivist accounts: if derogatory
  force is entirely a property of the act and the audience''s evidence about the speaker''s
  commitments, then a *fully sincere, non-endorsement* use in a context where the
  audience knows the speaker does not endorse the ranking should produce no residual
  offense — whereas expressive accounts predict residual force (because the expressive
  dimension projects out of embedding and out of speaker commitment). The asker claims
  there is data here: e.g., the "reporting the report" case where a listener is told
  a slur was used by a bigot, quoting it, and no offense arises. Also: the asker says
  derogatory force survives embedding *only* to the extent that embedding still lets
  the audience attribute the commitment to a real person (which explains why some
  embedding data feel derogatory — indirect reports of a specific speaker''s utterance
  — and others don''t).


