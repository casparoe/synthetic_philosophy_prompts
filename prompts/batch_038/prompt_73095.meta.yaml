  The chapter. I defend a view about slurs I call the ledger view. Its commitments:


  1. The lexical entry of a slur is identical to that of its neutral counterpart.
  Nothing derogatory is encoded in the word — not in its truth conditions, not in
  a conventional implicature, not in a presupposition, and not in a separate expressive
  dimension.

  2. What makes a word a slur is that there is a standing social rule against tokens
  of it, and the rule exists because such a token, in an unlicensed context, is an
  act of entering a claim into a public record: the speaker publicly ranks the targeted
