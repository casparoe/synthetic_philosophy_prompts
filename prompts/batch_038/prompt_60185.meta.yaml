  Let me consider Kripkenstein grading more concretely. Question: "Explain Kripke''s
  Wittgenstein''s rule-following paradox. Then explain what Kripke means by calling
  his own account a ''skeptical solution'' rather than a ''straight solution'', and
  say what the two differ in. Finally: does the paradox show that there is no fact
  of the matter about what a speaker means, or only that meaning facts are not ''meaning-sceptical''
  in the way we assumed? Defend an answer."


  Student answer with subtle mistakes:

  1. Right about the surface: the plus/quus example, the skeptic''s challenge, no
  fact about past behavior or mental states fixes meaning.

  2. Subtle mistake A: conflating "quus" with a purely dispositional limitation —
  actually says the paradox is that dispositions can''t be infinite / we''re finite,
  which is only the finitude objection, not the normativity objection. This is a classic
  conflation: the dispositional answer fails for two distinct reasons (error/finitude,
  and normativity — dispositions describe what I will do, not what I ought to do).
  A student who reduces the whole failure to "we can''t have dispositions to infinitely
  many cases" gets the visible thing right and the deep thing wrong.

  3. Subtle mistake B: attributing the skeptical solution to Wittgenstein himself
  rather than to Kripke''s Wittgenstein (Kripke explicitly says he''s not sure whether
  this is Wittgenstein''s view — he presents it as the view of "Wittgenstein the author
  of the Investigations" as he reads him, and expresses doubts). Or: student says
  Kripke endorses the community-view as the truth about meaning, whereas the skeptical
  solution is explicitly not a claim about what meaning facts consist in — it asserts
  no fact of the matter, and instead justifies our practice by its utility/conditions
  of assertibility. Also a subtle mistake: saying the community determines what''s
  correct (a "consensus theory of truth") vs. the more careful claim that assertibility
  conditions involve agreement in judgments within the community.

  4. Subtle mistake C: claiming Hume''s problem of induction is analogous in the straight
  way but getting Hume''s own skeptical solution wrong — Hume is presented by Kripke
  as the archetype: Hume''s skeptical solution is that custom/habit justifies nothing
  but is necessary for life. A student might say Hume gave a straight solution (that
  induction is justified by custom) — that''s backwards.

  5. Maybe: student says the paradox shows there''s no such thing as meaning at all
  / nihilism, missing that the skeptical solution preserves ordinary meaning talk.


