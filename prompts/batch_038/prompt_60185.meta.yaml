  "Sandel identifies two objections to a market in kidneys: the coercion objection
  and the corruption objection. The coercion objection says that a poor person who
  sells a kidney does not really choose freely, because their alternatives are so
  bad that the sale is forced on them. The corruption objection says that turning
  a body part into a commodity degrades it, treating something that should be valued
  as a gift or as part of a person as if it were a thing to be bought and sold.


  The reason the second objection is more radical is that it does not depend on how
  unequal society happens to be. The coercion objection only bites under conditions
  of poverty — a billionaire who sold a kidney for fun, or a well-off person who sold
  one to pay off a mortgage they didn''t need to, wouldn''t be coerced at all, so
  the objection would fall away. But the corruption objection would still apply. Sandel''s
  point is that markets don''t just allocate goods, they change how we think about
  them, so the corruption objection survives the creation of a more equal society.


  That is also why regulation can answer the first objection but not the second. A
  scheme with a single public buyer, a fixed price, and counselling would remove the
  worst of the coercion: no bidding wars, no predatory brokers, no one being pushed
  into it, and the seller would have to be told what they''re agreeing to. But the
  fixed price does nothing about corruption, because the kidney is still being bought,
  and buying a body part at any price is degrading to the seller''s dignity. Actually,
  the size of the price seems to matter to how degraded it feels — a token payment
  of a few hundred dollars looks less like treating the person as a commodity than
  a six-figure sum, which suggests corruption comes in degrees and tracks the price.


  Sandel backs the corruption objection with evidence, mainly the crowding-out studies
  — Titmuss on blood donation, where paying for blood reduced both supply and the
  quality of what was donated, and similar results since. This makes corruption an
  empirical claim about how market norms displace non-market ones, which means it
  stands or falls with the evidence: if those studies failed to replicate, or turned
  out to be about culture-specific cases, the objection would lose its support. He
  also leans on the fact that people find these markets repugnant, which is basically
  what Kass means by the wisdom of repugnance and what the market designer Alvin Roth
  points to when he says repugnance is a constraint markets have to work around. Sandel
  treats the disgust people feel at kidney sales as evidence that they are wrong."


