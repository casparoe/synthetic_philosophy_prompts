  - Correctly names coercion and corruption/degradation.

  - Correctly says coercion objection depends on background conditions of inequality;
  correctly notes that if the seller is well-off and fully informed, coercion objection
  loses force.

  - Subtle mistake 1: says the corruption objection is that paying for a kidney treats
  the seller''s body as a commodity and thereby violates the seller''s dignity — collapsing
  corruption into a version of the consent/dignity-of-the-person objection, i.e.,
  making it about harm/degradation *to the seller*, whereas Sandel''s corruption point
  is about the good itself and the norms governing it (the social meaning of the body/organ,
  and how market valuation crowds out the non-market valuation). Actually Sandel does
  say markets don''t just allocate goods, they express and promote certain attitudes
  toward the goods; the corruption is about the good, not primarily the seller''s
  dignity. This is a genuine, classic conflation. Good.

  - Subtle mistake 2: claims that Sandel''s argument rests on the empirical claim
  that market norms crowd out non-market norms (crowding-out effect, à la the behavioral
  economists / Titmuss on blood donation) — that''s a supporting empirical strand,
  but Sandel''s corruption objection is partly conceptual/expressive, not merely an
  empirical crowding-out claim; and the student says "so if the crowding-out evidence
  failed to replicate, the objection would collapse," which doesn''t follow. Also,
  attributing Titmuss''s blood-donation study to Sandel as his main evidence — Titmuss
  is discussed by Sandel and Arrow; that''s fine, but the mistake is treating corruption
  as *only* an empirical crowding-out thesis.

