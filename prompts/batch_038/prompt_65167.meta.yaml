  I think "Construct a thought experiment to specifications" combined with "Is a larger
  population better? Pronatalism and population size" is excellent — population ethics
  has rich technical apparatus (mere addition / Repugnant Conclusion, Sadistic Conclusion,
  Non-Identity Problem, variable-value views, critical-level utilitarianism, person-affecting
  views, average utilitarianism) that LLMs know well, but constructing a case to a
  bespoke specification requires genuine reasoning rather than regurgitation.


  Alternatively, "preferences vs biases in morality" with a thought experiment: construct
  a case where the standard debunking test (which the model must apply) gives verdicts
  in the direction opposite to expectation — e.g., a preference whose evolutionary
  origin looks like a bias but survives all the standard debunking tests, while a
  judgment that looks like a principled preference fails. Hmm, but "bias" is vaguer.


  The population ethics one is very crisp and has well-defined theory names. Let me
  design a thought experiment specification that is jointly satisfiable but nontrivial.


  Classic results in population ethics:

  - Total utilitarianism → Mere Addition Paradox → Repugnant Conclusion (Parfit).

  - Average utilitarianism → Sadistic Conclusion (adding people with lives worth living
  but below average makes things worse), plus the Egypt problem (adding happy ancient
  Egyptians changes the average → weird).

  - Critical-level utilitarianism (Blackorby & Donaldson) → avoids repugnant conclusion
  but implies Sadistic Conclusion (adding lives worth living but below critical level
  is bad).

  - Variable value views / Number-dampening.

  - Person-affecting views / wide person-affecting.

  - Negative utilitarianism.


  A good bespoke specification: build a case in which average utilitarianism and critical-level
  utilitarianism, both standardly described as avoiding the Repugnant Conclusion at
  the cost of the Sadistic Conclusion, come apart — one recommends adding a large
  group of people with lives worth living, the other recommends against — and moreover
  where person-affecting considerations (non-identity) don''t dissolve the issue because...
  hmm.


  Actually maybe a cleaner, more interesting spec: a case where the standard non-identity
  problem doesn''t bite — where the affected people are identifiable existing people
  whose welfare is at stake — but the population-size question still forces a choice,
  and where the "sadistic" verdict is generated by totalism rather than by average/critical-level
  views. I.e., invert the usual direction: normally totalism avoids the Sadistic Conclusion
  and average/critical-level views suffer it. So: design a case in which total (person-neutral)
  utilitarianism recommends creating a large number of barely-worth-living people
  while a person-affecting or average view... no, that''s the standard direction.


