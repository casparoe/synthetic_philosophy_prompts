  The Löbian obstacle (from Yudkowsky''s work on TDT/UDT, and discussed in AI safety
  literature, e.g., MIRI''s "logical uncertainty", parametric bounded Löb, reflective
  oracles): The problem arises when an agent reasons about its own actions using a
  proof system. To choose action A over action B, the agent wants to prove "if I do
  A, utility ≥ x". But if the agent''s decision procedure is to search for proofs,
  then a problem: by Löb''s theorem, an agent that can prove its own soundness (that
  if it proves P then P is true) within its own system, in a system satisfying the
  derivability conditions, can prove everything — because Löb''s theorem says if T
  proves "Prov(P) → P" then T proves P. Combined with soundness, triviality. So the
  agent can''t trust its own reasoning at full strength. This creates the "Löbian
  obstacle" for agents that reason about the consequences of their actions using the
  same proof system they use to reason about their own reasoning: they end up unable
  to prove things about their own behavior, because to prove "if I take action A,
  then good outcome", they''d need to prove facts about their own proof-search, which
  requires trusting their own soundness.


