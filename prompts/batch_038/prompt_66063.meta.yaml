  itself via its proof system can find proofs of false counterfactuals (e.g., "if
  I one-box, the world explodes") because of self-fulfilling proofs — Löb''s theorem
  means the agent can prove that if it proves X then X, and then... The classic example:
  in the "5 and 10" problem, a naive proof-based agent can prove it will take the
  $5 because it finds a trivial proof of "if I take $5, I get $5" — a spurious proof
  that''s shorter/easier than the correct one, so the agent''s reasoning is led astray.


