  phrase attributions loosely but accurately. Let me be careful: the qua problem is
  standardly attributed to Devitt & Sterelny (1987?) and to Kripke. I''ll avoid dates.)

  2. "If you''re an externalist, reference is fixed by the causal-historical chain,
  and the agent''s *successor* concepts inherit reference via the same chain, so there''s
  no problem — reference survives ontological revision the way ''water'' survived
  the move from macroscopic to molecular description. This is just the normal history
  of science." Reply: the chain runs through *us*, not through the agent; the agent''s
  concept was acquired from a text description rather than from ostension or causal
  contact. Weakest point: if the agent is embedded in the world and interacts with
  it causally (e.g., its sensors), the chain arguably does run through it.

  3. "Reference magnetism: among the candidate referents compatible with the agent''s
  use, the most natural one wins. Diamond-ness is pretty natural; the problem dissolves."
  Weakest point: magnetism is controversial and it''s not clear what makes one candidate
  more natural when the candidates are equally natural microphysical structures; and
  for value-laden targets ("flourishing", "suffering") naturalness does no work.

  4. "This is a description-vs-use problem: the agent''s *use* of the concept in its
  policy fixes the referent; just look at behavior." Reply: the agent has almost no
  use — it has a text definition and a reward function; its behavior is whatever the
  training produced; so the referent is fixed by the trainer''s intentions or by nothing
  at all.

  5. "You''re assuming a single, determinate target. Why not make the goal a disjunction/hedged
  objective over all ontologies the agent might adopt — i.e., specify the goal in
  terms of the agent''s *current best hypothesis* about the target, and let it revise?
  (This is the standard ''maximize expected value under moral/ontological uncertainty''
  reply.)" Reply: the disjunction has to be weighted, and the weighting is exactly
  the inaccessible information; also, indexical problem — "the ontology the agent
  actually adopts" makes the goal depend on the agent''s own future beliefs, which
  is unstable/circular and manipulable (the agent could change its beliefs to make
  the goal easy). Weakest point: some hedging strategies do look workable, e.g., "maximize
  diamonds as identified under whatever microphysical theory you currently believe,
  conditional on your present concept being the ancestor of the future one."

  6. "This is just an operationalization/measurement problem in ML: distribution shift
  and concept drift. It''s solved by better representations and by human feedback
  in the loop." Reply: no, because the failure isn''t statistical (more data won''t
  help) — the data underdetermines which natural kind the target is, and the human
  in the loop has the same problem in their own heads.

  7. From the philosophers of physics: "You say the true ontology might be a wave
  function on configuration space. If you''re a scientific realist about that, you
  owe us an account of how ''diamond'' is defined there — and if you''re not, the
  whole problem is a philosopher''s fantasy: there is no ''true ontology'' to be revised
  toward." Also: "structural realism says the structure is preserved across theory
  change, and that''s what your agent''s concept should latch onto — so the problem
  is exactly the one structural realism already solves (or fails to)."

  8. From the ML person: "In practice, models learn concepts from text and behave
