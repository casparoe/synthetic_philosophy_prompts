  2. "Concessions to make in the first five minutes" (about 200 words): what I should
  give away up front to lower the temperature, and what I must not concede.

  3. "The objections, in the order they''ll arrive" (the bulk — about 1,200–1,500
  words): eight to ten entries, each with (a) the objection in the objector''s own
  idiom, one or two sentences, attributed to the sub-audience most likely to raise
  it; (b) a reply of about 90 seconds of speaking time; (c) a one-line note on where
  the reply is soft or where it concedes more than I''d like.

