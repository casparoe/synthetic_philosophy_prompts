  never exist, and even if it did, the fix is to specify goals in terms of observable
  proxies plus human oversight, not metaphysics." Also possibly: "this is the ''specification
  gaming'' literature and it''s empirical."

  9. The devastating one: "If the referent is inaccessible in principle, then *you*
  cannot state your own thesis''s target either — you have the same problem about
  ''human flourishing'' in your own paper. Your argument generalizes to all reference,
