  Setting: The asker is a graduate student (or a philosopher with an AI-safety background)
  giving a talk to an audience. The thesis: something like — an artificial agent whose
  goal is specified in terms of an ontology the agent will later revise faces a problem
  that is *not* merely an engineering problem of re-mapping concepts, and not merely
  the "qua problem" for causal theories of reference, but a problem arising because
  the information needed to identify the referent in the new ontology is *in principle
  inaccessible* to the agent from within its own evidential situation — so no amount
  of empirical data plus rational reconstruction fixes which microphysical configurations
  "count as" the target. Therefore value loading must be indexed not to a description
  of the world but to the *process* by which the agent''s own conceptual scheme develops
  — and this has the odd consequence that the correct target of the agent''s goal
  is partly constituted by what the agent will later come to believe.


  Audience: a joint philosophy department + cognitive science seminar: mostly metaphysicians
  and philosophers of mind working on reference, natural kinds, grounding, and mental
  content; two philosophers of physics; one ML researcher who does representation
  learning; no one who works on AI risk. Their likely commitments: reference magnetism
  (Lewis), causal-historical theories, descriptivism vs. externalism, "the qua problem",
  teleosemantics, "the problem of the many", conceptual role semantics, deflationism
  about "ontology identification" ("this is just an operationalization problem"),
  and skepticism about AI-risk framing ("you''ve invented a problem for a system that
  doesn''t exist and that will be solved by better training").


  Objections they''ll raise, in their vocabulary:

  1. "You''re describing the qua-problem / the grounding problem for causal theories
  of reference, which Devitt and Sterelny discuss — nothing new, and it''s a problem
  about *our* reference-fixing, not about a machine''s." (This is real: the qua-problem
  arises for causal theories — a causal chain must be established under the right
