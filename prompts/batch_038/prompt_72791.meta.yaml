  I read a chapter in one of those big pop self-improvement books (name doesn''t matter,
  it''s the kind that sits on an airport shelf) that uses Franklin''s moral perfection
  project as its case study, and something about it bugged me but I can''t put my
  finger on where. Here''s roughly how the chapter tells it:


  "Benjamin Franklin, at 21, made a list of thirteen virtues — Temperance, Silence,
  Order, and so on — and built a chart to track them. The order of the list was basically
  arbitrary; he just wrote down the qualities he wanted. Every day he scored himself
  on all thirteen at once, marking a fault each time he slipped, and the goal was
  to drive the total number of marks down to zero, which makes him the first person
  to turn character into a metric. He also kept calling his own mistakes ''errata'',
  printer''s slang, which tells you how lightly he took them: a misprint just gets
  fixed in the next edition. When the scheme failed, as he admitted it did, he explained
  why with a story about a man who had a blacksmith grind his axe until the blade
  was bright but the rest of the head was speckled, at which point the man decided
  he liked a speckled axe better. That''s Franklin''s conclusion about virtue: perfection
  is impossible, a spotless character would make you insufferable anyway, so aim to
  be a well-rounded, moderately flawed person. He then dropped the whole project and
  never went back to it, and the scheme was purely secular — no God anywhere in it
  — because Franklin thought virtue paid off only in this life."


  That''s maybe 90% of the chapter''s content, and the last line is the moral it hangs
  the whole book on.


  My hunch, which I can''t defend: the chapter is reading the chart as an optimization
  device — a score to be minimized — when Franklin actually meant it as an attention
  device, and once you make that correction a lot of the rest of the chapter''s claims
  collapse with it. Is that right, or am I just as confused as the book?


  Can you go at it claim by claim and sort them into (a) accurate, (b) fair-ish simplification
  that loses something but isn''t wrong, and (c) actually wrong? For each of the wrong
  ones say what Franklin''s version is. And then tell me whether the closing moral
