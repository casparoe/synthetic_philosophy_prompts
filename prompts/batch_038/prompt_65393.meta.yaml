  memory decays and elaborates but doesn''t wholly fabricate — a "memory trace" model
  where legend = history + distortion, with the distortion increasing with time and
  with the story''s social utility. Under that model, every old story is entitled
  to at least a kernel. That''s a substantive theory of cultural transmission, and
  it competes with a "mythopoeic" model where stories are generated whole-cloth from
  genre conventions, political needs, and neighbouring cultures'' motifs, with no
