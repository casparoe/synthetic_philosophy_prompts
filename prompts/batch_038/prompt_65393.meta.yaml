  1. Positive archaeology + late text → "historical core" (Troy).

  2. No archaeology either way + late text → "myth/legend" but hedged, sometimes with
  a possible kernel (Arthur).

  3. Negative/archaeologically silent + late text + implausible demographics → "did
  not happen as described, but maybe small historical core" (Exodus).


