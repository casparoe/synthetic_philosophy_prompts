  (Homer ~400 years after Troy VIIa; Historia Brittonum ~300 years after Badon). Yet
  the verdicts differ! That''s a genuinely sharp observation for the prompt: the source-to-event
  gap is roughly similar, but Troy gets "historical core" and Arthur gets "myth."
  Why? Because Troy has a place and a destruction layer that anchors it, while Arthur
  has neither a located battlefield (Badon unidentified) nor archaeology. So the practice
  seems to presuppose that material anchors, not testimony, do the work — that texts
  alone, no matter how early relative to the event, cannot carry a claim across a
  300-year gap unless there''s an independent physical trace. But then the Exodus:
  there IS a negative material anchor (Sinai surveys, Egyptian records), and scholars
  treat the absence as probative. Whereas for Arthur, absence of archaeology isn''t
  treated as probative against a specific battle.


