  Then the character must respond with real resources: the disanalogy — Gödel''s trick
  requires that the numbering be representable *within* the theory, i.e., the theory
  can prove facts about its own proofs; the diagonal construction requires a fixed-point
  theorem (the diagonal lemma) which needs enough arithmetic. In DNA, there''s no
  mechanism by which a strand can denote the replication machinery''s proof predicate;
  the "self-reference" in the genetic code is that the code table is used by the machinery
  that reads it — but nothing inside the system computes a quotation of itself; overlapping
  frames give one string with two translations, but translation is not reference.
  Also: DNA replication has error-correction, so the analogue of "consistency" would
  be proofreading fidelity, and the analogue of "incompleteness" would be... nothing,
  because the cell has no undecidable sentences; a mutation is a chemical error, not
  a limitative theorem. Also the deeper point: Gödel''s theorem is about a system''s
  inability to prove all truths *about itself*; a cell''s inability to do something
  is an empirical engineering limitation, not a theorem — so the isomorphism, if any,
  is at the level of "self-referential organization" (a strange loop) rather than
  incompleteness. A good character would concede the weaker claim (that autocatalytic
  closure and self-representation are physically realizable, which matters for the
  philosophy of mind/ART) but refuse the stronger (that biology instantiates incompleteness).


