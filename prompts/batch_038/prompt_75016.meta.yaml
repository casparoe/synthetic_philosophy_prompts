  exporting institutions could export trust. Also the "small homogeneous population"
  claim is empirically shaky: Sweden has taken in a lot of immigration and still runs
  the system; and the Nordics are big economies per capita, not small — the smallness
  point is about openness, and openness is exactly why they can afford generous welfare
  (compensation hypothesis: open economies need insurance against world-market shocks
  — that''s a real argument, Rodrik''s compensation hypothesis).


  Round 3 (A): But then the argument shifts: you''ve conceded that the model isn''t
  a package you can copy; it''s a package whose parts are load-bearing under specific
  conditions. Openness compensating for welfare exposure is a *reason* the Nordics
