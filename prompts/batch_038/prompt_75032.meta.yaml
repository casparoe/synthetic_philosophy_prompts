  embodied and skill-based: relevance is not computed but disclosed by a background
  of practical coping, so a system without a body cannot determine what matters.

  3. They think LLMs are a counterexample showing that scaling plus next-token prediction
  yields contextually relevant behavior without embodiment — so they hold that disembodied
  statistical learning can solve relevance determination.

  4. They think there is no fact of the matter about "all the non-effects" independent
  of a description: ramification is underdetermined by the domain, so a complete axiomatization
  of a world is impossible in principle.

  5. They want to defend the claim that the frame problem and the symbol grounding
  problem are distinct.

  6. Methodologically, they think that a puzzle is only genuine if it constrains engineering
  practice.


