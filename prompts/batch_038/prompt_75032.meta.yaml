  Genuine non-obvious tension: (c) nativism + (d) atomism vs. (f)/(b) — if concepts
  are atoms and mostly innate, then what does statistical learning add? Actually the
  real tension: Fodor''s argument for LOTH rests on compositionality/productivity/systematicity
