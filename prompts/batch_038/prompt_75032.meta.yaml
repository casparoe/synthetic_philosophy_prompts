  Let me draft the frame-problem commitments prompt.


  Persona: A master''s student in a philosophy of cognitive science/AI course, writing
  a position paper, wants an audit. Formal and polished.


  Commitment set (aim for 6-7 items with 1-2 genuine non-obvious tensions and 1 apparent
  tension):


  1. The frame problem, in its original technical form, is solved in the sense that
  a working engineer needn''t worry about it: default persistence assumptions plus
  nonmonotonic reasoning (or the event calculus with its "no change unless caused"
  inertia axiom) let a planner handle thousands of fluents without writing frame axioms
  for each pair. So the problem is a matter of representational economy, not of epistemology.


  2. Nevertheless, I accept Dennett''s broadening: the real frame problem is relevance
  determination — how any cognitive system, human or machine, gets to the small subset
  of what it believes that bears on the current situation — and I think this problem
  is unsolved and may be unsolvable in principle for any system whose relation to
  its environment is mediated by a representation it must consult.


  3. I''m a Dreyfusian about skill: expert coping is non-representational, and what
  an expert perceives as relevant is disclosed by the situation itself, not selected
  by inference over a stored model. Background practices do the work that frame axioms
  were supposed to do.


  4. I think large language models are the strongest available evidence about (2)
  and (3): they determine relevance to a query without embodiment, without a persistent
  world model, and without any explicit representation of what does not change. I
  take them to show that relevance determination is learnable from distributional
  structure alone, and that this substantially defuses the Dreyfusian argument.


  5. I think the qualification problem (you can never list all the conditions under
  which an action succeeds) is genuinely a limit on formalism, whereas the ramification
  problem (indirect consequences) is a merely technical nuisance that better ontologies
  solve.


  6. My methodological principle: a puzzle counts as a real problem only if it generates
  a failure you can exhibit — a system that, absent the solution, gets the answer
  wrong. Arguments that no such failure can be produced are, I hold, verbal.


  7. I also want to insist that the frame problem and the symbol grounding problem
  are different problems and that solving one wouldn''t touch the other.


  Now: tensions.


  - Genuine tension A: (6) + (2). If a real problem must produce an exhibitable failure,
  then (2)''s claim that relevance determination is unsolved "in principle for representationally
  mediated systems" needs a failure case. But (4) supplies LLMs as systems that determine
  relevance without consulting a world model — the asker reads this as defusing Dreyfus,
  yet if LLMs are representationally mediated (they are, in some sense — token statistics
  over a learned embedding space) they''re a counterexample to the "in principle"
  clause of (2). Hmm, need to be careful; this is a bit muddled. Let''s make it sharper.


  - Genuine tension B: (5) + (1). The qualification problem is said to be a limit
  on formalism in principle, while the frame problem (persistence) is said to be solved
  by a default that nothing changes unless caused — but that default IS a qualification-style
  assumption (a ceteris paribus clause), and the standard treatments (circumscription,
  minimal change) work by minimizing exceptions globally, which is precisely a substantive
  claim about the world, not a representational convenience. So the asker can''t say
  persistence-inertia is mere economy while holding that exception-listing is a limit
  in principle: inertia axioms are global frame axioms in disguise, and their consistency
  is not guaranteed. That''s a genuinely non-obvious tension. Good.


  - Genuine tension C: (3) + (4). If expert coping is non-representational and relevance
  is disclosed by the situation, then LLMs — which have no situation, no body, no
  ongoing projects — are not evidence against (3) at all; they''re evidence only against
  the claim that relevance determination requires a stored world model with frame
  axioms, which is (1)''s target, not (3)''s. The asker''s use of LLMs "substantially
  defuses the Dreyfusian argument" requires that Dreyfus''s claim was about representation-mediated
  inference, but the Dreyfusian claim is that relevance is not selected by inference
  at all. So either LLMs are doing something non-representational (in which case (4)
  supports a different picture than the asker thinks — and it undercuts (1)''s claim
  that it''s all representational economy), or they''re doing representational relevance
  selection (in which case (3) is falsified only if one grants that the model''s "situation"
  is a real situation). This is a real, subtle tension. Also the interaction: (4)
  says LLMs show relevance is learnable from distributional structure, but distributional
  structure is a record of what humans found relevant — so the model inherits relevance
  from a background of human practices, which is arguably a vindication of (3) rather
  than a refutation. That''s a great non-obvious point. Good.


  - Apparent tension that dissolves: (1) and (2) look flatly contradictory — "the
  frame problem is solved" and "the frame problem is unsolved in principle." But they''re
  about different problems (the narrow formal one vs. the relevance problem) once
  Dennett''s broadening is accepted, so the pair dissolves into a distinction rather
  than a contradiction. That''s a classic "looks inconsistent, isn''t" — good apparent
  tension. Hmm, but is it too easy to spot? The asker explicitly invokes Dennett''s
  broadening, so it''s signposted. Maybe better to make the apparent tension something
  else: (5) and (7)? Or (6) and (7)? Let''s consider (6)+(7): methodology says only
  exhibitable failures count as real problems; the symbol grounding problem is often
  criticized as verbal — so insisting (7) that grounding is a distinct problem while
  holding (6) looks like it commits them to producing exhibitable grounding failures.
  Actually that could be a genuine tension. Hmm.


