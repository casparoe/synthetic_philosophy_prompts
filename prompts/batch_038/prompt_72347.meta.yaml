  Structure of prompt:

  - Frame: I''m setting a case-analysis exercise; the theory is Rousseau''s Letter
  to d''Alembert on the Theater (1758); the episode is spring/summer 2020 — the simultaneous
  closing of playhouses and the emergence of two substitutes: streamed performance
  and nightly mass applause/balcony singing.

  - Supply the facts I want relied on (so it doesn''t turn on contested detail): March
  2020, West End and Broadway dark; the National Theatre and others began streaming
  archived productions free online; in July 2020 the filmed stage recording of Hamilton
  went to a streaming service a year and a half ahead of its planned theatrical release;
  meanwhile, from late March 2020, in Spain, Italy, Britain and elsewhere, households
  performed a scheduled collective gesture — applause at a set evening hour, singing
  from balconies — directed at health and delivery workers; the ritual was widely
  embraced and then widely criticized as a substitute for protective equipment and
  for pay.

  - Say what I want: (1) a disciplined mapping — who counts as the audience, who as
  the performer, what is the "playhouse," what is the festival; (2) which of Rousseau''s
  arguments do work here (list them: theater cannot reform mores and only amplifies
  what a people already are; the playhouse gathers atomized individuals into a simulacrum
  of community purchased with money and leisure; the actor''s trade as public self-alienation;
  the argument''s dependence on the scale and work-discipline of a small republic;
  and the counterproposal of the open-air festival in which the people are their own
  spectacle); (3) apply the stipulated distinction: spectatorial density (number watching
  together in one place) vs spectatorial reciprocity (whether watchers are visible/available
  to each other as spectacle) — place the playhouse, the livestream, and the balcony
  applause on this grid, say whether the distinction earns its keep or collapses,
  and whether it changes Rousseau''s verdict; (4) where the framework is silent or
  misdescribes: no concept of asynchronous reproduction, of the camera as director,
  of an audience that is not a city, of a festival mediated by broadcast and social
  media, of the festival''s own susceptibility to being scripted from above (the applause
  was organized by media campaigns, later attended by politicians); also Rousseau''s
  own ambivalence — he wrote plays and operas; (5) verdict: does the episode confirm,
  strain, or reveal something the theory never anticipated? In particular: does the
  balcony applause vindicate the festival ideal or show that the festival is just
  theater without a roof? And is the streaming case a reductio of Rousseau''s scale-dependence
  (Hamilton reached more people in a month than it could have in a decade on Broadway
  — his argument about access seems simply false) or a confirmation (those viewers
  were alone, passive, and did nothing)?

