  Two years ago my younger brother underwent a complete corpus callosotomy for drug-resistant
  epilepsy. The surgery worked: he has been nearly seizure-free since. But I am a
  graduate student in philosophy of mind, and I have spent the last year reading the
  philosophical literature on what such an operation is supposed to mean for the unity
  of consciousness, and I have come away with the strong impression that the debate
  has been running for more than fifty years without anyone moving anyone. I would
  like a diagnosis of that stall rather than a survey of it.


  Here is how the terrain looks to me. On one side is the reading that goes back to
  the original commissurotomy work with Sperry and his colleagues: after the commissures
  are cut, the patient has, in effect, two spheres of consciousness, each with its
  own perceptions, learning, and feelings, revealed by the lateralized testing — a
  picture flashed to the left visual field is denied by the speaking hemisphere even
  while the patient''s left hand reaches for it or draws it, cross-cueing between
  hemispheres, the occasional intermanual conflict. Nagel''s early piece on brain
  bisection gave this reading its philosophical seriousness, and Parfit used the case
  in his work on personal identity as evidence that questions of the form "how many
  persons are here?" can be indeterminate or at least not what matters. On the other
  side are those who think the two-minds description is a category mistake: everyday
  behavior after callosotomy is strikingly integrated, patients do not behave like
  two people outside the laboratory, the disconnection symptoms are transient, Gazzaniga''s
  left-hemisphere "interpreter" suggests that what we are seeing is one self-modeling
  system producing a single narrative from partial inputs, and a good deal of recent
  work on interhemispheric integration (including subcortical and extracallosal routes)
  argues that the laboratory dissociations are artifacts of a highly artificial testing
  situation.


  My hypothesis — and I want it tested rather than flattered — is that the two camps
  are citing the same well-known facts and reaching opposite conclusions because they
  are not answering the same question. The disunity side, on my reading, is answering
  a question about the conditions under which there is a single stream of phenomenal
  consciousness; the unity side is answering a question about who owns the behavior,
  i.e. about the subject of agency and self-ascription. What I suspect is doing the
  real work underneath, though, is a shared assumption neither side states: that "how
  many minds?" is a counting question with a determinate answer, such that settling
  the empirical facts about integration would settle the count. If that is right,
  the impasse is not evidence that the empirical question is hard but evidence that
  the question is being asked in a way that presupposes a single natural kind that
  may not be there.


  So: is my hypothesis right, or is this something else — a genuinely verbal dispute
  about "consciousness" or "mind," a dispute about which cases count as data (the
  laboratory versus the life), a hidden empirical question about subcortical communication
  that would in fact decide things, or bedrock intuitions about the individuation
