  Logical omniscience desiderata — I can seed with a student working on epistemic
  logic who wants a spec for a theory of bounded knowledge. Requirements to consider:

  1. Non-omniscience: knowing p doesn''t imply knowing all its consequences.

  2. But some closure: agents do sometimes know consequences (deduction is possible;
  we do learn by reasoning).

  3. The problem of "cheap" logical truths vs. expensive ones: a theory must be sensitive
  to complexity of the deduction, not merely its existence.

  4. Must handle the fact that logical knowledge isn''t merely a matter of resource
  limits — we can know that p and q entails p, without computing; i.e., the theory
  shouldn''t make trivial inferences as hard as deep ones. Actually the requirement
  is: the theory must grade consequences by difficulty in a principled, non-ad hoc
  way.

  5. Must handle self-knowledge/introspection failures: not knowing what one believes.

  6. Must handle the paradox of the preface and lottery-style cases: agents who have
  inconsistent belief sets.

  7. Must explain the phenomenon of "learning by deduction" — knowledge gain without
  new empirical input.

  8. Must handle the fact that the model should still validate the principle that
  knowledge is closed under... nothing? Or explain the intuition that it is closed
  (the KK principle).

  9. Must handle the problem of "logical omniscience" in AI/epistemic planning: computational
  tractability.

  10. Must be compositional/semantic: the content of belief should be individuated
  in a way that doesn''t over-fragment (the problem of hyperintensionality: distinct
  but logically equivalent contents shouldn''t be conflated, but also shouldn''t be
  multiplied without limit — e.g., "Hesperus is bright" vs "Phosphorus is bright"
  is fine, but "2+2=4" vs "4 is prime"?). Actually the classic over-fragmentation
  worry: if contents are individuated finely, then believing "Snow is white" doesn''t
  entail believing "Snow is white or grass is green" — but intuitively it does. So
  a requirement: preserve the plausible weak closure inferences while blocking implausible
  ones.

  11. Requirement: the theory must be able to say what the agent is ignorant of, and
  this must be representable to the agent (the agent can''t represent the consequence
  it fails to see).

  12. Requirement: no ad hoc stipulation of an "awareness operator" that simply relabels
  the problem — i.e., must explain, not merely encode, the limits. Fagin–Halpern awareness
  models are a candidate; a desideratum would be that awareness isn''t primitive.

  13. Requirement: must handle the fact that the very framework is used to model other
  agents'' beliefs (nested beliefs): must not make iterated belief ascriptions collapse.

  14. Requirement: should preserve the utility of possible-worlds semantics for modeling
  information (Stalnaker) — e.g., assertion as proposing to eliminate worlds.

  15. Requirement: must handle mathematical knowledge and its growth, without making
  all of mathematics unknowable.

