  Actually, one more consideration on the thesis: I want the speaker''s positive claim
  to be something an expert would find contestable but not obviously false. Proposal:


  Thesis components:

  1. GS is standardly invoked in political philosophy as showing that "no voting system
  can be both fair and immune to strategic manipulation," and is used either as a
  counsel of despair about institutional design or as a reason to be relaxed about
  strategic voting (since everyone must be strategic anyway). Both readings are wrong.

  2. The theorem''s force comes from three structural assumptions that are usually
  passed over: resoluteness (the rule returns a single winner), onto-ness (every alternative
  is achievable by some profile), and unrestricted domain over ≥3 alternatives. Each
  is a claim about the *shape of the choice problem*, not about voters'' incentives.
  So GS is properly read as a theorem about how rich an outcome space a self-enforcing
  mechanism can accommodate — a "richness" theorem.

  3. Therefore the right normative target is not binary strategy-proofness but a graded
  notion — e.g., the measure/proportion of preference profiles at which some voter
  can profit by misreporting, or the maximum gain available from misreporting relative
  to the spread of the outcome distribution. GS leaves this wide open, and several
  familiar rules are dramatically better on these graded measures without being dictatorial.

  4. And the popular "GS entails manipulation is unavoidable, hence sincerity isn''t
  required of voters" inference fails because the theorem says nothing about which
  strategies are available under a given rule in the actual world: what it says is
  that for each such rule there''s some profile at which someone can gain — which
  is compatible with such profiles being rare, hard to find, or collectively self-defeating.


