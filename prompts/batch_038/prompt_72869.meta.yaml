  Option A: Socialist calculation debate. Phenomenon: people argue that a central
  planner can''t get the information, and defenders reply "sure, we''ll use computers/simulations
  to solve the simultaneous equations," and then the critic says the equations are
  the wrong thing — the problem isn''t computation but the absence of the price-generating
  process; and then the defender says "fine, we''ll use market socialism with trial-and-error
  prices," and the critic says the trial-and-error prices lack the entrepreneurial
  discovery function... There''s a nice phenomenon: in each round the debate shifts
  what the disagreement is about — it starts as "can you compute the optimum," becomes
  "can you get the data," becomes "can you discover new data that doesn''t exist yet."
  Hmm.


  Another candidate phenomenon within the calculation debate: The move where an argument
  against feasibility gets answered by an existence proof rather than a process —
  i.e., the defender says "in principle the equations have a solution, so it''s possible,"
  and the objection is that having a solution isn''t having a way to find it, and
  the relevant fact is that the data needed to set up the equations only come into
  existence through the very process whose output the equations are supposed to determine.
