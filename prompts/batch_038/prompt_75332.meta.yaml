  The slogan: "absence of evidence is not evidence of absence."


  Readings (the menu the professor asks for):


  1. The logical/validity reading: an inference of the form "we have found no traces
  of X, therefore X did not exist" is not deductively valid. Trivially true (nearly),
  but nearly useless, since almost no inference in archaeology (or science generally)
  is deductive; if the maxim only rules out invalid inferences, it condemns all of
  science.


  2. The Bayesian/probabilistic reading (strong): absence of evidence never lowers
  the probability of a hypothesis. False whenever P(no E | H) < P(no E | ¬H), i.e.,
  whenever the hypothesis makes the trace more likely than its negation does. Indeed
  by conservation of expected evidence, any evidential test you expect to be neutral
  must on average shift your credence; and if a search would be more likely to succeed
  under H, its failure is evidence against H. So the strong reading is false as a
  general claim; it holds only in the special case where the likelihood ratio is 1
  — i.e., where the trace would be exactly as likely to be missing under H as under
  ¬H.


  3. The magnitude reading (the defensible one): absence of evidence is usually weak
  evidence of absence — weak because detection probability is low. Its force scales
  with (a) how likely the practice/thing would have left a trace at all, (b) how likely
  that trace would survive deposition and preservation (organic decay, ploughing,
  reuse, alluviation, looting, later building), (c) how much of the site has been
  excavated/sampled and with what recovery techniques (sieving/flotation for botanical
  remains, geophysics, survey coverage), and (d) whether the search was aimed at that
  trace or found it incidentally ("searching under the streetlight"). This is not
  a logical maxim but an empirical, discipline-specific calibration problem. So the
  colleague''s real complaint should be "your likelihood ratios are too high," not
  "your inference form is invalid."


  4. The prudential/methodological norm reading: as a rule of practice for a discipline
  with a systematically lossy record, it''s rational to be extremely conservative
  about negative inferences; the slogan is a disciplinary hygiene rule, an institutional
  norm about what may be published/asserted, not a claim about evidence. Plausible,
  but it doesn''t license the rhetorical use, which was to treat the conclusion as
  unargued rather than under-evidenced.


  5. The asymmetry reading: absence of evidence can never support a negative conclusion
  but can support a positive one? Hmm, that''s not the slogan. Maybe rather: the slogan
  is often used asymmetrically — to block negative conclusions while licensing positive
  speculation ("we haven''t found the workshop, but we can still suppose on-site production"),
  i.e., double-standard reading. Interesting: the professor notices the colleague
  used it both ways in the same week. This is a use-observation, not a reading of
  the sentence per se, but it can be a reading: the slogan as a claim about burden
  of proof — that a negative existential claim requires a higher evidential bar than
  an affirmative one; or as a claim about default epistemic status (agnosticism is
  the default, so silence should be recorded as "unknown" rather than "absent").


  6. The semantic/scope reading: "absence of evidence" is ambiguous between (i) evidence
  that has been sought and not found (a searched-for absence), (ii) evidence that
  could in principle be found but hasn''t been looked for, (iii) evidence that could
  not have survived/never existed as a trace at all ("no possible evidence"). And
  "evidence of absence" is ambiguous between proof, strong support, and any support
  at all. The slogan is true on some pairings of the two ambiguities and false on
  others. This "cross-product" structure is exactly the sort of thing the professor
  would want spelled out: maybe ask for a table with the readings of the first term
  along one axis and the second along the other.


  7. The radical reading (what a student took away): no negative conclusion about
  the past is ever warranted, so archaeology can only ever add to the inventory of
  what existed, never subtract; all claims about what a society lacked (no writing,
  no kings, no warfare, no long-distance trade, no ritual) are unfalsifiable. This
  is the reading that would follow if the slogan were taken as a general principle
  of inference, and it is untenable both philosophically (it makes the discipline''s
  comparative claims impossible) and empirically (some absences are robust, e.g.,
  where preservation is exceptional — waterlogged/anoxic deposits, arid contexts,
  pyroclastic burial — or where the record would certainly have left traces, e.g.,
  a major volcanic eruption, a city wall enclosing 40 hectares would be visible in
  excavation trenches, in geophysics, and in the site''s morphology).


  Also: the slogan''s cousin, "an argument from silence," and the historiographic
  literature on it; and the distinction between "no evidence of absence" vs "absence
  of evidence" — hmm.


  Another interesting angle: the slogan as applied to a class-level vs instance-level.
  "No evidence of a temple at this site" vs "no evidence of temples in this culture."
  Aggregation: many small non-significant absences across sites can jointly be strong
  evidence (the "multiple weak tests" point) — a nice in-the-weeds move: the slogan
  treats each absence in isolation, but a discipline accumulates absences, and their
  conjunction can be decisive even when each is negligible. Also the base-rate/prior
  point: for a practice that is extremely common cross-culturally (e.g., some form
  of ritual), the prior is high, so absence must be strong to move you; for a rare
  practice, the prior is low, so absence quickly confirms the negative. This gives
  an answer to "which absences matter": it depends on the prior, which is a substantive
  comparative-anthropological assumption — and there''s a nice philosophical point
  that invoking the slogan covertly imports a prior (usually a high prior for the
  phenomenon being defended) — i.e., the slogan is often doing hidden work as a prior-shifter
  rather than an evidence-blocker.


  Also: the "expected evidence" / "if H were true, we would very likely have found
  E by now" conditional is itself a substantive empirical claim requiring a model
  of the practice''s material footprint; and the colleague''s real objection is often
  that the professor''s implicit footprint model is too confident. So the debate is
  about the middle premise (traceability), not about logic.


  Also: the asymmetry between absence-of-trace under competing explanations: e.g.,
  wooden palisades rot; but their postholes and soil stains persist in many conditions;
  absence of postholes under good preservation and full coverage is strong evidence
  against a palisade. Nice concrete example.


  And the "not-yet" reading: absence of evidence so far is evidence of absence so
