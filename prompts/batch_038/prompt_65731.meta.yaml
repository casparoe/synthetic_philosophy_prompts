  \ Decision Theory\" — I believe it's from Brian Weatherson? No. The Treasurer's\
  \ Paradox is due to... I recall it's discussed by Andy Egan in \"Evidential decision\
  \ theory and the ethics of belief\"? Hmm. Actually the Treasurer's Paradox is from\
  \ Arntzenius's \"Logic, Decision, Action\"? Let me think. The Treasurer's Paradox:\
  \ a large organization of treasurers, each deciding whether to donate a small amount;\
  \ evidentially each should donate because... Actually the Treasurer's Paradox: You're\
  \ the treasurer of a large organization with millions of members. The president\
  \ will donate $1 iff all members donate $1... Hmm.\n\nThe standard: There are a\
  \ billion treasurers. Each decides whether to donate $1. If all donate, the charity\
  \ gets a billion dollars and does great good. If not all donate, nothing happens.\
  \ Causally, your donation makes no difference (probability all others donate is\
  \ ~0 anyway). Evidentially, your donating is evidence that all donate... Hmm, actually\
  \ evidentially donating is weak evidence. The Treasurer's Paradox (Arntzenius? or\
  \ \"Elga\"?) is that EDT recommends donating and CDT doesn't, and it's a paradox\
  \ because intuitively you shouldn't.\n\nAnyway, I don't need to cite. Better to\
  \ avoid relying on specific names and dates.\n\nAlternatively: \"Mechanistic anomaly\
  \ detection: what counts as the same mechanism?\" with the thought-experiment-to-specifications\
  \ type: construct two model behaviors that are behaviorally identical but mechanistically\
  \ different, and specify what an anomaly detector keyed on mechanism identity would\
  \ flag. Hmm, that's quite technical but doable.\n\nOr: Malthus with thought experiment:\
  \ \"construct a case where a theory is right but early\" — falsification. Hmm.\n\
  \nI like the evidential cooperation in large worlds + classroom activity. Design:\
  \ a game with a large group (say 60 participants? no, keep to a seminar of ~24).\
  \ Key: the activity must make participants feel the force of evidential cooperation\
  \ in large worlds — i.e., that in a large world, your action is evidence about what\
  \ similar agents in similar situations do, so you should act as if you have influence\
  \ you causally lack. The \"Treasurer's Paradox\" structure: a threshold public good\
  \ with an astronomically large number of players, where each individual's causal\
  \ impact is zero but evidential impact is large.\n\nThe classroom version: give\
  \ each of ~24 students a role in a \"population\" that is actually replicated many\
  \ times over in a simulation — the facilitator computes aggregate outcomes across\
  \ many simulated copies? Hmm, that's hard to do with real stakes.\n\nBetter design:\
  \ The activity uses a real payoff structure where the facilitator draws from a large\
  \ \"urn\" of decisions. Classic implementation: each student makes a decision; the\
  \ facilitator then reveals that the class's decisions were actually one sample from\
  \ a much larger set of decision-makers (e.g., other classes in other sections, or\
  \ a pool of anonymous student volunteers across campus who face the identical problem),\
  \ and the outcome/payoff depends on the aggregate fraction of the whole pool. So\
  \ each student's own causal contribution to the pool is negligible (pool of ~500),\
  \ but their decision is highly correlated with the pool's average decision, since\
  \ everyone in the pool is in the identical situation with the same information.\
  \ Then: does the causalist reasoning (\"my one vote out of 500 doesn't matter\"\
  ) win, or does the evidential reasoning (\"if I do X, then probably most of them\
  \ do X\")?\n\nCrucially, the activity should make the evidential reasoning have\
  \ real bite: they can't verify what others do, they only see their own choice. And\
  \ the payoff scheme: a threshold or a proportional scheme. Let's design it so that\
  \ CDT and EDT give conflicting recommendations.\n\nDesign detail: Pool of N = 400\
  \ decision-makers (the class of 20 plus 380 \"silent partners\" who are other students\
  \ who filled out the same form earlier / or an actual pre-collected set). Hmm, using\
  \ real pre-collected decisions is nice: the facilitator has collected decisions\
  \ from 380 anonymous students in other sections, who faced the exact same choice\
  \ with the same information. Then the class of 20 makes their decisions live. The\
  \ payout depends on the total across all 400. That means each live student causally\
  \ contributes 1/400 — small but nonzero, which weakens the \"zero causal impact\"\
  \ feature. To get zero-ish causal impact, make the pool huge: say the pre-collected\
  \ pool is 5,000 and the class is 20; then each student's causal contribution is\
  \ 1/5020 but evidentially, they're a sample of a common cause, so their choice is\
  \ strong evidence about the pool.\n\nActually — key insight from evidential cooperation\
  \ in large worlds: your decision is evidence about what other agents relevantly\
  \ similar to you decide, and in a big world, there are many such agents. And the\
  \ \"large worlds\" aspect: the correlation is not from common causation but from...\
  \ hmm, in Egan's/Weatherson's discussions, the worry about \"managing the news\"\
  \ and about whether you should treat similar agents as correlated. There's also\
  \ the \"Treasurer's paradox\" and \"Big world\" arguments by Arntzenius, and the\
  \ discussion in \"Evidential decision theory is a good decision theory\"? Also relevant:\
  \ the debate about whether evidential cooperation requires common ancestry/simulation\
  \ (as in Parfit's Hitchhiker, and in \"duplicating\" cases like the one in Yudkowsky's/Ahmad's\
  \ work).\n\nFor the classroom, the crucial felt force: participants discover that\
  \ the pool of 5,000 was in fact generated by... hmm. We could do a twist: the pool's\
  \ decisions were generated by an algorithm (the facilitator ran a simple \"what\
  \ would a typical student do\" prediction). Actually here's a clever design: the\
  \ \"silent partners\" decisions were determined by a rule the facilitator wrote\
  \ down in advance based on a prediction of what this class would do — e.g., the\
  \ facilitator committed to \"each of the 5,000 silent partners will do exactly what\
  \ the median live participant does.\" But that's a stipulation of correlation, which\
  \ is fine — it makes the correlation real, but then it's common-cause, not merely\
  \ evidential.\n\nAlternatively, and better for the felt force: make it a real correlation\
  \ arising from shared incentives + shared information, but let the participants\
  \ reason about whether they should treat their own decision as evidence. The pedagogical\
  \ payoff: half the class reasons causally (\"1 in 5000, doesn't matter, and I'd\
  \ rather defect for the extra tokens\"), half reasons evidentially. Then the outcome\
  \ reveals the aggregate. Since the pool is mostly silent partners whose decisions\
  \ were pre-collected under the same instructions, the actual aggregate will reflect...\
  \ the actual behavior of similar people. If the class is a representative sample\
  \ of the pool, then the class's choices will correlate with the pool's choices.\
  \ And here's the punch: if the class defects a lot and the pool defected a lot,\
  \ the threshold isn't met and everyone gets the low payoff — and the defectors in\
  \ class can observe that their own reasoning (\"my single choice couldn't matter\"\
  ) was true causally but their choices were exactly the ones that predicted the failure.\n\
  \nThat's a genuinely felt version: your choice didn't cause the outcome, but it\
  \ diagnosed it. That's the \"evidential cooperation in large worlds\" point: in\
  \ large worlds, your action is a symptom/diagnostic of what agents like you do,\
  \ and hence acting on causal impotence is a kind of self-defeating coordination\
  \ failure.\n\nNow, the design must include: setting (seminar/workshop), group size,\
  \ time, materials, payoff scheme that doesn't need real money, rules, a debrief\
  \ mapping moments onto the idea, what predictably goes wrong, and what feature the\
  \ activity can't reproduce.\n\nLet me pick the type: classroom activity. Domain:\
  \ Evidential cooperation in large worlds. Asker: I run a decision-theory workshop\
  \ for graduate students in philosophy and CS? Or an interdisciplinary reading group.\
  \ Let's say: a one-hour session in a graduate seminar on decision theory and AI\
  \ alignment, 24 students, 60 minutes. Hmm, \"evidential cooperation in large worlds\"\
  \ is an AI-alignment-adjacent topic (Egan's dilemma, acausal trade, the \"Treasurer's\
  \ paradox,\" \"cooperation with near-copies\"). The asker could be running a workshop\
  \ for an AI-safety summer program, 30 participants, 75 minutes. That's plausible\
  \ and lets us have a decent pool.\n\nLet me now design the game concretely.\n\n\
  Game: \"The Archive\" or \"The Quiet Majority\" or \"The Ledger.\"\n\nSetup: There\
  \ are 30 participants in the room. There is also a \"silent cohort\" of N = 3,000\
  \ anonymous decision-makers whose choices were collected in advance (the facilitator\
  \ has them in a sealed file / pre-registered spreadsheet). All 3,030 face an identical\
  \ choice with identical information. Payoffs:\n\n- Each decision-maker chooses A\
  \ (contribute / \"signal\") or B (keep / \"withhold\").\n- The public outcome depends\
  \ on the total number of contributors across all 3,030:\n  - If contributors ≥ 1,500\
  \ (i.e., ≥ half), everyone in the pool — including all silent partners and all room\
  \ participants — receives the \"good\" outcome worth 10 tokens.\n  - If contributors\
  \ < 1,500, everyone receives 2 tokens.\n- Additionally, anyone who chose B keeps\
  \ a private bonus of 3 tokens regardless of the public outcome. So:\n  - Public\
  \ good achieved: A = 10, B = 13.\n  - Public good fails: A = 2, B = 5.\n\nSo B strictly\
  \ dominates A for each individual (13 > 10 and 5 > 2). Classic public goods game\
  \ with dominance. Causally, one person out of 3,030 shifts the probability of crossing\
  \ the threshold by essentially nothing (well, 1/3030 of the time it's exactly pivotal).\
  \ Evidentially: if I choose A, what does that say about the other 3,029? If they\
  \ are relevantly similar to me — same information, same incentives, and I have no\
  \ independent evidence about them — then my choosing A is evidence that they choose\
  \ A too, and P(threshold | I choose A) is much higher than P(threshold | I choose\
  \ B). Given the dominance is small (3 tokens) and the public-good gap is large (8\
  \ tokens), the evidential expected value strongly favors A if the correlation is\
  \ high enough. That's precisely Egan's dilemma structure: EDT says A, CDT says B;\
  \ and the \"managing the news\" objection says the evidential gain is illusory because\
  \ you can't causally influence the news. The twist in \"large worlds\": the news\
  \ isn't about a common cause you share with copies; it's about whether you should\
  \ regard distant, unrelated-but-similar agents as decision-relevantly correlated.\n\
  \nNow, for the activity to have real bite, the silent cohort must be real, and their\
  \ choices must actually have been made by real people in the identical situation.\
  \ The facilitator collected 3,000 responses from... that's a lot. Alternatively:\
  \ the silent cohort is generated by a simple procedure that the facilitator commits\
  \ to publicly: e.g., \"the 3,000 silent partners are decisions recorded from previous\
  \ runs of this workshop / from three other sections of the same course / from an\
  \ online poll of students who received the exact same instructions and payoff table.\"\
  \ Realistically a facilitator could get ~300 responses from a campus-wide Qualtrics\
  \ survey. Let's use N = 400 silent partners, with the threshold at 200. Then a room\
  \ of 30 out of 430 total: each person is ~1/430 of the pool — not negligible causally,\
  \ but the class's own contribution (30 of 430 = 7%) can't determine the threshold\
  \ alone. And the correlation between the class's behavior and the survey cohort's\
  \ behavior is the crux: if the class is drawn from the same population and has the\
  \ same information, the class's choices are a good sample of the cohort's choices.\n\
  \nHmm, but there's a subtlety: the live participants get extra information — they\
  \ know they're in a room together, they know the facilitator's framing, they can\
  \ deliberate. That breaks the symmetry, which is actually a nice debrief point:\
  \ the activity cannot reproduce the case in which the correlated agents have no\
  \ causal or informational contact; the room creates a common-cause channel, so the\
  \ correlation the students exploit might be \"real\" correlation from shared environment\
  \ rather than the puzzling acausal correlation. That's an honest limitation to name\
  \ — and actually the facilitator can mitigate by making the choice private and simultaneous\
  \ (sealed ballots, no talking before submitting), and by telling them the cohort\
  \ was surveyed before this session existed and cannot be influenced by anything\
  \ they do.\n\nBetter: make the silent cohort's decisions genuinely prior and independent,\
  \ sealed in an envelope / pre-registered timestamped file that participants can\
  \ inspect the hash of. This makes it vivid: \"nothing you do now can change those\
  \ 400 slips; they were made a week ago by people you'll never meet, who saw exactly\
  \ this table.\" That's the felt force of the large-worlds case: the correlation\
  \ you're being asked to act on runs to agents who are already fixed, causally disconnected\
  \ from you, and whom you can neither help nor harm. And yet the decision-theoretic\
  \ question — should I act on the evidence my own choice provides? — is exactly live.\n\
  \nNow the twist for the debrief: after collecting ballots, the facilitator reveals\
  \ the cohort total. The class learns the aggregate. Two outcomes:\n\n- If the class\
  \ mostly chose A (contribute) and the cohort mostly chose A, threshold met: everyone\
  \ gets the good payoff. The class will feel that their coordination \"worked,\"\
  \ but the facilitator must show that no single one of them could have changed anything,\
  \ and that in fact the cohort's total was fixed before they walked in — so their\
  \ A's did not cause the good outcome; they were symptoms of it. That's the key line.\n\
  - If the class mostly chose B, and the cohort mostly chose B, the threshold fails\
  \ and everyone gets the low payoff, even though a majority of the class may have\
  \ \"privately wished\" the threshold were met. Here the felt force: each defector's\
  \ reasoning was individually correct causally (\"my one slip can't move the threshold\"\
  ) and collectively self-defeating — and moreover, each defector's own choice was\
  \ the very evidence that the threshold would fail. They had, in their hands, a reliable\
  \ predictor of the outcome: their own intention.\n\nThat's a genuinely nice pedagogical\
  \ moment: the students' own choices functioned as a diagnostic test of a fixed past\
  \ event. That's the \"managing the news\" issue made concrete — is it rational to\
  \ act on a diagnosis you can't change? And the answer that large-worlds evidential\
  \ cooperators give: if you're the kind of agent whose choices are produced by the\
  \ same reasoning as theirs, then choosing A is choosing to be in the world where\
  \ the threshold is met, in a way that doesn't require your act to have causal leverage.\n\
  \nTo make the felt force even sharper, I should build in a device that gives participants\
  \ a *first-person* experience of the correlation being real rather than stipulated:\
  \ run a small pre-round inside the room that establishes the base rate. E.g., Round\
  \ 0: everyone makes a private prediction of what the cohort did, plus a prediction\
  \ of what the majority of the room will do; then reveal. They'll discover their\
  \ predictions correlate strongly with the actual cohort — because they're all similar\
  \ people reasoning about similar incentives. That establishes, empirically, that\
  \ \"people like me, in this situation, do X\" is a real and tight regularity. Then\
  \ the main round: they choose with the knowledge that the correlation is tight.\
  \ And crucially: they can be asked before the main round to state whether they think\
  \ their choice influences the cohort's (they'll say no — it's in the past, sealed)\
  \ and whether they think their choice is evidence about the cohort's (they'll say\
  \ yes). That's the dissociation the whole activity hinges on, elicited explicitly,\
  \ on the record, by their own mouths. That's excellent: the facilitator gets them\
  \ to assert both premises, and then the game asks them to act.\n\nNow the payoff\
  \ scheme with no real money: tokens that convert into something the class cares\
  \ about. Options: (a) course credit micro-points — probably not allowed; (b) a shared\
  \ prize the facilitator controls: e.g., the tokens determine the length/content\
  \ of the break, or whether the class gets a treat (donuts), or a donation the facilitator\
  \ has pledged to a charity the class chooses. The donation version is thematically\
  \ perfect: the tokens are converted into a real donation to a charity the class\
  \ selects, with the \"private bonus\" being a personal perk (e.g., a chocolate,\
  \ or a \"get out of the next reading response\" pass — hmm, that's not fair). Better\
  \ and cleaner:\n\nReal-stakes version: the facilitator has a budget of, say, $60.\
  \ Each token = $0.25 to a class-selected charity. Everyone's tokens are pooled and\
  \ donated. The \"private bonus\" of 3 tokens for choosing B is paid to... hmm, if\
  \ all tokens go to charity, then B's private bonus isn't private. Actually that's\
  \ a good design: make the private bonus something that is genuinely private and\
  \ mildly desirable but not money — e.g., choosing B means you get to leave 5 minutes\
  \ early? Too messy with 30 people.\n\nCleaner: make the payoff tokens convert to\
  \ points in a shared course-wide economy that the facilitator controls, or just\
  \ to a small snack/experience. Honestly, the standard trick: use \"tokens\" whose\
  \ only use is to determine a donation and a personal lottery entry. Let's do:\n\n\
  - All tokens go into a common pool → converted at the end into a donation to a charity\
  \ the class picks by majority vote. (This makes the public good genuinely public\
  \ and the \"contribution\" genuinely real.)\n- The private bonus for choosing B\
  \ is one lottery ticket for a personal prize (a book, or a $10 gift card, or \"\
  the facilitator brings coffee next week for you\"). Hmm, mixing.\n\nMaybe simpler\
  \ and defensible: two ledgers.\n- Ledger P (personal): tokens you personally earn\
  \ → each worth one entry in a raffle for a prize the facilitator provides (a $15\
  \ gift card, or the privilege of picking the topic of the last session). Personal\
  \ tokens are only yours.\n- Ledger C (common): tokens the whole pool earns → converted\
  \ 1:1 into dollars donated to the class's chosen charity.\n\nThen the payoffs: A\
  \ = 10 to common, 0 personal. B = 3 personal, and contributes 10 or 2 to common\
  \ depending on the threshold. Hmm wait, need the public-good amount to be shared.\
  \ Let's restructure:\n\n- Common pool: each of the 430 decision-makers, if they\
  \ choose A, adds 10 units to the common fund; if they choose B, adds 2 units. Wait,\
  \ then A's private cost vs. benefit: choosing A gives up the 3-unit personal bonus.\
  \ Total common fund is donated. Threshold: if ≥ 215 of the 430 chose A, the common\
  \ fund is doubled by the facilitator (matching grant!). That's a lovely mechanism:\
  \ the facilitator pledges to match the fund if the threshold is met. Then:\n  -\
  \ Individual causal effect of switching A→B: lose 8 units of common fund (out of\
  \ ~3,400) plus possibly lose the entire match (only if pivotal, prob ≈ tiny). Gain:\
  \ 3 personal units.\n  - Evidential effect: switching A→B changes the estimate of\
  \ how many of the 400 chose A, and hence whether the match triggers.\n\nSo the payoffs:\
  \ A = 3,400-ish to charity, 0 personal. B = 3,200-ish to charity + 3 personal. Both\
  \ go to a shared charity the class picks. Hmm, but then the \"personal\" bonus needs\
  \ to be something the student wants more than 3/3400 of the charity fund. Let's\
  \ make it concrete with dollars:\n\nThe facilitator pledges: total common fund =\
  \ $1 per A-choice + ... hmm, keep it simple.\n\nSimplest concrete scheme:\n- There\
  \ are 430 decision-makers: 30 in the room + 400 in the sealed cohort.\n- Each chooses\
  \ CONTRIBUTE or KEEP.\n- Charity fund: the facilitator has committed $120. The amount\
  \ donated = $120 if at least 215 of the 430 chose CONTRIBUTE; otherwise $30. Every\
  \ decision-maker's choice affects only the aggregate.\n- Private perk: anyone in\
  \ the room who chose KEEP receives a small personal perk worth about $3 (a coffee\
  \ voucher / a snack box / a $3 donation to a charity of *their own* choice, which\
  \ is a nice touch — the perk is a personal donation, so it's still \"selfish\" in\
  \ the relevant sense if they can pick any cause, or they can keep it as a voucher).\n\
  \nThen each room participant faces: CONTRIBUTE = forgo a $3 personal voucher to\
  \ raise the class's shared donation from $30 to $120, where the class's share of\
  \ the outcome is fixed by all 430 decisions. Their causal leverage: 1/430 chance\
  \ of being pivotal (well, the probability the total is exactly 214 or 215). Evidential\
  \ leverage: if their choice is correlated with the cohort's, contributing shifts\
  \ the probability of the match substantially.\n\nThe felt force: the $3 voucher\
  \ is real and in their hand; the $120/$30 donation is real money going out the door;\
  \ the cohort's decisions are sealed and in the past. And their own choice turns\
  \ out to be a good predictor of the sealed envelope's contents. That's exactly evidential\
  \ cooperation in a large world, with real stakes, no exotic physics, no simulation\
  \ assumptions.\n\nI should ask the model to supply: the exact rules and script,\
  \ the timing (60 or 75 minutes), the materials (ballots, sealed envelope, hash/timestamp,\
  \ the prediction round), the payoff arithmetic and how to set the threshold so the\
  \ case is genuinely torn (i.e., so that EDT and CDT actually diverge given plausible\
  \ correlation levels — I should ask for the numbers to be checked: at what correlation\
  \ strength does the evidential recommendation flip? Give the arithmetic), the pre-round\
  \ design that gets participants to assert both premises, the debrief that maps moments\
  \ onto: (i) the dominance of KEEP, (ii) the causal irrelevance, (iii) the evidential\
  \ relevance, (iv) \"managing the news,\" (v) the question of which similarities\
  \ count as decision-relevant (the \"large worlds\" worry: why should I treat a stranger\
  \ surveyed last week as relevantly like me? what if I learn something about them\
  \ that breaks the symmetry? — and this can be staged: give the room a piece of news\
  \ mid-game about the cohort, e.g., \"we have just learned that the cohort was surveyed\
  \ at a business school\" or \"that half of the cohort was told the threshold was\
  \ 215 and half was told it was 300\" — a symmetry-breaking revelation that should\
  \ change their reasoning and that tests whether they update correctly).\n\nOh, that's\
  \ a great addition: an information shock partway through, which tests whether participants\
  \ treat the correlation as arising from genuine similarity (and hence update when\
  \ similarity is undermined) or as a brute causal connection (in which case the shock\
  \ should be irrelevant). That's the \"which similarities are decision-relevant\"\
  \ question, which is the heart of the large-worlds literature. And the debrief can\
  \ note the activity can't reproduce the case where the correlated agents are not\
  \ merely similar but *causally disconnected in principle* (across light cones, etc.)\
  \ — the room's correlation is mediated by shared environment and shared instruction,\
  \ i.e., a common cause; the philosophical puzzle concerns whether evidential cooperation\
  \ survives when no common cause story is available. Also can't reproduce the fact\
  \ that in the real large-worlds case you don't get feedback (no envelope is ever\
  \ opened).\n\nAlso: what will predictably go wrong. Some likely failures: (1) participants\
  \ refuse to believe the sealed cohort is real / think it's a bluff — mitigated by\
  \ pre-registering with a timestamped hash and by having the file physically present;\
  \ (2) the class will try to coordinate (openly agreeing to all contribute), which\
  \ destroys the evidential structure and collapses the game into ordinary coordination\
  \ — need rules forbidding communication before ballots are sealed, but note that\
  \ the urge to coordinate is itself data for the debrief; (3) some students will\
  \ be unmoved by the charity and treat the $3 voucher as dominant, which is fine\
  \ but makes the room's aggregate uninformative; (4) the room's aggregate may not\
  \ in fact match the cohort's (30 is a small sample; sampling error), so the \"your\
  \ choice predicted the envelope\" reveal may fail to land — mitigate by using the\
  \ prediction round to set expectations, and by having a fallback: report the correlation\
  \ between each participant's own prediction and their own choice, and the room-level\
  \ accuracy; (5) risk that the class is outraged at being used to raise money / feels\
  \ manipulated — get consent, let the class pick the charity, cap the amounts; (6)\
  \ the \"personal perk = donation to a cause of your choice\" can dissolve the selfishness\
  \ — if students pick the *same* charity, KEEP is no longer selfish, so the dominance\
  \ structure collapses. That's a real design bug worth flagging: use a voucher or\
  \ a snack, not a personal donation, OR keep the personal donation option but note\
  \ it as an intended variant that changes the game.\n\nAlso I want to ask for a version\
  \ where the numbers are set so that CDT and EDT provably diverge, and to show the\
  \ arithmetic; and to state what the \"right answer\" is under each theory given\
  \ an explicit correlation parameter, plus what a \"managing the news\" objection\
  \ says, and how the activity leaves the question open rather than settling it. And\
  \ I want a variant for a smaller/cheaper setting (no real money): e.g., a points\
  \ version.\n\nAlso, the facilitator needs a script for the reveal, and needs to\
  \ handle the case where the class's decision doesn't affect the sealed envelope\
  \ (it doesn't) — so the donation amount is determined by the sum. And the facilitator\
  \ must actually have the 400 sealed decisions. Realistic sourcing: an online survey\
  \ run a week earlier to ~400 students across campus, or the accumulated decisions\
  \ of prior sections. I should ask the model to specify a feasible sourcing plan\
  \ and what to do if the cohort can't be gathered at that scale (e.g., 400 → 120,\
  \ and rescale thresholds and payoffs; or use a synthetic cohort with a pre-committed\
  \ generation rule — but note that a synthetic cohort changes the philosophy: the\
  \ correlation then comes from the facilitator's algorithm, which is common-cause\
