  3. Two-dimensional semantics\n4. Evidential cooperation in large worlds\n5. Mechanistic\
  \ anomaly detection: what counts as the same mechanism?\n\nType options: classroom\
  \ activity/game, thought experiment to specifications, help understanding a passage.\n\
  \nI think the best combination: \"Evidential cooperation in large worlds\" (Treasurer's\
  \ Paradox, Egan's dilemma) with the classroom activity type — a game where participants\
  \ face a decision that evidential decision theory and causal decision theory disagree\
  \ on, but in the \"large worlds\" setting where the disagreement comes from correlation\
  \ with distant copies. That's nice: a game with real payoffs where participants\
  \ must decide whether to cooperate, and the structure of the game makes the evidential\
