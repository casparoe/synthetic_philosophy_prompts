  it (bid-ask spread / preference reversal), or when the ambiguous bet is combined
  with a hedging bet. Or: Ellsberg preferences are inconsistent with a single probability,
  but they ARE consistent with second-order beliefs / Choquet expected utility / maxmin
  expected utility — the activity should let them feel maxmin rather than be told.


  Also a great subtlety: the classic Ellsberg urn has 30 red, 60 black-yellow in unknown
  proportion. The standard demonstration asks for choices between bets, then asks
  students to *state their subjective probability* of drawing red from the ambiguous
  urn — and many give a number (e.g., 1/3) while still preferring the known urn. That
  gap between stated belief and choice is a fantastic discovery moment: it makes them
  feel that ambiguity aversion isn''t about belief at all. Another: the "sure-thing"
  check — after choosing bet A over B, offer a third option and see if the choices
  are consistent.


  Also: the hedging/combination trick — offer participants a *pair* of the ambiguous
  bets (one on black, one on yellow) and show that a rational person who is ambiguity
  averse on each individually would happily take both together, since together they''re
  equivalent to a known 60/30 bet. That''s a genuinely illuminating, in-the-weeds
  feature: ambiguity aversion is not additive; the aversion dissolves when you can
  hedge across the same source of ambiguity. That''s real (it''s the basis of the
  "diversification across ambiguity" arguments and of why maxmin EU is not additive
  over separate decisions). Making students feel that would be excellent and is NOT
