  heavier sentence is voluntary — the "hard choice" is not coercion. That''s a real
  doctrine (Bordenkircher v. Hayes, and Brady v. United States). And it''s *exactly*
  the structure of a Frankfurt case: the agent has no acceptable alternative, yet
