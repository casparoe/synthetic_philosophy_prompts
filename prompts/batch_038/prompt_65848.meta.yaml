  of normality" — the prison regime should resemble life outside as much as possible;
  sentences deprive liberty and nothing else. Also specific practices: prisoners keep
  voting rights, have keys to their own rooms, cook their own food with groceries
  bought in the prison shop, wear their own clothes, officers in no uniforms, no strip
  searches... The "principle of normality" is a real, named Norwegian correctional
  principle. That''s well-documented and common knowledge-ish. The prompt could ask:
  what theory of punishment does the normality principle presuppose? It''s incompatible
  with retributivism''s "hard treatment" element? Actually it is compatible with negative
  retributivism (limiting principles). Interesting tension: the normality principle
  says the deprivation of liberty IS the punishment — everything else must be justified
  separately. That presupposes a view where the only morally permissible harm inflicted
  is the loss of liberty itself, i.e., punishment as a "deprivation" not as "suffering."
  And it presupposes the offender remains a citizen with intact rights. Compare with
  American practices: supermax, solitary confinement, loss of voting rights (felon
  disenfranchisement), collateral consequences (barred from public housing, occupational
  licensing), "doing your own time," the practice of charging prisoners for their
  own incarceration (room and board fees, jail per diem billing in some US counties),
  prison labor at cents per hour. That''s a rich concrete practice set.


