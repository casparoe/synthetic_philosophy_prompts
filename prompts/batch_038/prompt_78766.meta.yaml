  **Backward induction / centipede + "fairness of summary":** A textbook paragraph
  summarizing the centipede game: "Backward induction proves that the centipede game
  has a unique outcome in which player 1 takes the pot at the first node. Since both
  players are rational and this is common knowledge, player 2 knows player 1 will
  defect, so rational player 1 should defect immediately. Experimental results show
  that people cooperate, which proves that backward induction is wrong as a theory
  of rationality." Subtle errors: (i) "unique outcome" vs unique subgame-perfect equilibrium
  in pure strategies; (ii) the inference from common knowledge of rationality — the
  paradox is that the antecedent is inconsistent/self-undermining: if the game reaches
  node 3, then common knowledge of rationality must have failed, so backward induction''s
  recommendation at node 1 rests on a counterfactual with contradictory premises (Rosenthal''s
  point; also Binmore''s critique); (iii) "proves backward induction is wrong as a
  theory of rationality" — experiments showing cooperation may indicate bounded rationality,
  other-regarding preferences, or belief revision issues, not a failure of BI as a
  normative principle; (iv) conflation of "players are rational" with "players believe
