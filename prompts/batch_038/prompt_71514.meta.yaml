  Hmm, but which combination is best? Let me consider "Internal vs. external reasons"
  + exam question. The classic: Williams'' "Internal and External Reasons" (1979),
  the internal reasons thesis: A has a reason to φ only if A could reach the conclusion
  to φ by a sound deliberative route from A''s actual motivational set (the subjective
  motivational set, "S"). External reasons statements fail. The standard objections:
  the "too many reasons" objection (Williams'' own worry about irrationality — the
  person who wants to drink the petrol because he thinks it''s gin), and the objection
  that the internalist view makes reasons too subjective. A good exam question: ask
  whether Williams'' internalism can handle the case where an agent''s desires are
  themselves products of false beliefs, or the "sound deliberative route" including
  imagination. Or ask about the charge that internal reasons is trivially true once
  deliberation includes imagination — and whether it becomes vacuous vs. restrictive.


  Also: the debate over whether external reasons statements are unintelligible (Williams''
  "external reasons hypothesis is unintelligible") vs. just false. And the "blame"
  point: we blame people for failing to do what they have no internal reason to do
  — Williams'' response via "the consideration of blame" as an internal reason generator...
  Actually Williams discussed that the practice of blaming can itself create reasons.


