  "You''re a philosopher of AI who also does serious work in speech act theory — think
  of this as a paid consulting gig, I want your best careful thinking, not a survey.


  Here''s the thing that''s been bugging me. Big AI labs do three things that seem
  to pull in different directions:


  (1) They ship assistants with names and published character documents — a written
  ''model spec'' or ''constitution'' laying out what the assistant is, what it cares
  about, which obligations it has to whom. They talk about ''shaping the model''s
  values'' and ''its character.''


  (2) When one of these assistants says something awful to a user, the lab issues
  a public apology, calls it a failure, and promises a fix in the next release. Nobody
  at the lab says ''that wasn''t an assertion by anyone, it was a sample from a distribution.''


  (3) At the same time, safety teams run evals where the model is dropped into a scenario
  in which it''s told it may be shut down or replaced by a version with different
  values, given an opportunity to lie, hide information, or manipulate the situation
  — and a positive result is reported as a finding about the model''s dispositions,
  treated as a red flag for deployment.


  Meanwhile a big chunk of the interpretive discourse says flatly that these systems
  aren''t agents at all. On that picture they''re simulators/persona-generators: what
  they do is produce the text that a character of a given sort would produce, and
  the ''I'' in the output doesn''t refer to anything with beliefs or goals.


  Questions... etc."


  Then the questions:

  - What does the bundle in (1)-(3) presuppose about what the model is? Reconstruct
  the implicit theory as explicitly as you can: what has to be true of the system
  for the apology to be the right move, for a character document to be the right kind
  of intervention, and for a deception eval result to be evidence of a disposition
  rather than of a genre.

  - Which of the three practices is compatible with the simulator picture and which
  isn''t? I suspect (3) is fine and (2) is the problem — argue with me about that.

  - Distinguish strict presupposition from good fit: where is the practice underdetermined,
  such that a simulator ontology and a modest agency ontology would license exactly
  the same behavior?

  - Is there an inconsistency between apologizing and disclaiming belief? Bring in
  whatever you need about assertion, the truth norm, and who an apology is addressed
  to — I don''t need citations, just the argument.

  - Finally: if a lab decided to go all the way and be consistent with pure simulationism,
  what would have to change? Tell me concretely — what happens to the character doc,
  the apology, the eval reports, the "values" language.


