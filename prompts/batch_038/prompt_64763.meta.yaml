  between preference aggregation and *bargaining* solutions (Nash bargaining), and
  the fact that the endogeneity critique doesn''t obviously favor B''s counterfactual
  test over a *procedural* fix like enabling exit and voice).


  That''s a meaty adjudication. Good.


