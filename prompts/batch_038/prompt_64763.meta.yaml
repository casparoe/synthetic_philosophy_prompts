  I am a third-year doctoral student working across political philosophy and the governance
  of deployed machine-learning systems, and last Thursday I sat in on a working session
  that has stuck with me. The context: a research group is advising a mid-sized city
  that has piloted an assistant used by residents to navigate benefits eligibility,
  flood-buyout offers, and permitting questions. One feature of the pilot has generated
  a dispute about the right general approach. Because the assistant must actually
  recommend courses of action to individual residents — should this household accept
  the voluntary buyout, or should it spend the money on elevation — the group has
  to decide what the system is supposed to be optimizing or tracking when residents''
  own views diverge. The preference data the team has been working with comes from
  the pilot''s own chat logs plus an opt-in survey of users; the session was about
  how to use it. Two members of the group, Ines (background in computational social
  choice) and Tobias (background in normative political theory), got into a sustained
  argument that I transcribed fairly closely afterward. I had no stake in it and I''m
  deliberately not telling you which of them I found more persuasive, because I''d
  like an assessment of the arguments as actually made.


  Here is the exchange as best I can reconstruct it:


  1. Ines: ...

  2. Tobias: ...

  ...


  Please adjudicate this move by move...


  ---


  Let me write out the moves carefully.


  1. Ines: The system should track the expressed preferences of the residents it serves,
  aggregated — e.g., learn a cardinal welfare representation over outcomes and pick
  the action maximizing the sum (or weighted sum) of resident utilities. Anything
  else means a design team in one place is substituting its own conception of the
  good for the people affected. Aggregation is the only alternative to imposition.


  2. Tobias: Two objections. First, Arrow: no aggregation rule turns individual orderings
  into a social ordering while satisfying the standard conditions, so the "aggregate"
  is an artifact of whichever rule you pick — and picking the rule is precisely the
  imposition Ines wanted to avoid. So the dichotomy "aggregate or impose" is false.
  Second, and independently: expressed preferences are endogenous. People adapt their
  aspirations to their circumstances (Elster''s adaptive preferences; the household
  that says it doesn''t want the buyout because it''s learned that wanting things
  gets you nowhere). Aggregating actual preferences entrenches the distribution of
  power that shaped them.


  3. Ines: The Arrow move is a category error. Arrow''s theorem concerns social welfare
  functions over profiles of ordinal rankings of all social states, with an unrestricted
  domain condition. Our design problem has a fixed, small set of feasible actions
  and uncertainty about states; and where you have cardinal, interpersonally comparable
  measures, Harsanyi-style aggregation applies and Arrow simply doesn''t bite. Moreover
  there are positive results — for binary choices, majority rule has characterization
  results that make it the uniquely reasonable rule, and where preferences are single-peaked
  along a spectrum, majority rule is well behaved and Arrow''s impossibility doesn''t
  arise. So "Arrow shows aggregation is arbitrary" overclaims badly. On endogeneity
  I''ll grant something: it''s a real phenomenon. But it''s question-begging against
  me, because Tobias needs a criterion for which preferences count as distorted, and
  any such criterion is itself a substantive theory of the good supplied by him —
  which is the imposition I objected to in move 1.


  4. Tobias: I concede the single-peaked point in part: yes, when the relevant issue
  space is single-peaked, majority rule escapes the impossibility. But single-peakedness
  is a substantive assumption about how the issue is structured, and whether a contested
  question is single-peaked is itself one of the contested questions — the pilot''s
  buyout decision arguably isn''t, because residents differ not along a left-right
  spectrum but along incommensurable dimensions (attachment to a neighborhood, distrust
  of the agency, financial exposure), so the domain restriction fails exactly where
  it matters. On the criterion: I don''t need a full theory of the good. A preference
  is distorted if the person would disavow it under conditions of adequate information
  and absence of fear of reprisal — an endorsement test, counterfactual and thin.
  That''s much less substantive than Ines is assuming; it doesn''t tell anyone what
  to value, only when a valuation can be treated as theirs.


  5. Ines: That test relocates the problem rather than solving it, and it does so
  twice. First, the disavowal test is temporally indexed and unstable: some residents
  who left flood-prone areas under a buyout now say they regret it and would not have
  endorsed it; others who stayed say they''d never leave. Whichever moment you interrogate,
  you get a different "reflective" preference set, and the choice of moment is a substantive
  normative choice — so you have not escaped the need to impose. Second, even once
  you have the counterfactual endorsement profile of every resident, you still have
  to aggregate it, so all of my points about aggregation apply to your filtered set
  as much as to mine; you''ve added a modeling assumption per person and lost nothing
  of the aggregation problem.


  6. Tobias: On the temporal point: the test is normative, not a poll of some moment.
  It asks what people would endorse under conditions that satisfy independently specifiable
  criteria of autonomy, and the right answer to that is settled by argument rather
  than by surveying them at t1 or t2. That''s a difference in kind from taking logs
  at face value. On aggregation: yes, I still need to aggregate — but I''m aggregating
  over a domain where the endogeneity objection has been filtered out, so the aggregate
  is at least a candidate for tracking people''s own considered standpoints rather
  than their circumstances.


  7. Ines: Then the whole thing rests on your phrase "settled by argument" — and the
  argument will be conducted by people like us, which means your view is a perfectionist
  liberalism implemented by a design team, defended in the name of neutrality. If
  neutrality is your standard, you''ve failed it; you''ve simply hidden the imposition
  behind a counterfactual.


  8. Tobias: That charge proves too much. A system that declines to adjudicate is
  not neutral either: refusing to recommend, or defaulting to status-quo handling,
  has distributive consequences — the households with the least capacity to figure
  things out on their own are the ones most hurt by a system that won''t say anything.
  So "you''re not neutral" is true of every design including yours, and it therefore
  cannot be a reason to prefer yours.


  They both stopped there, more or less agreeing to disagree.


