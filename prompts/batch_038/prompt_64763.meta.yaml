  Design: I''m a PhD student in AI policy / philosophy (say, in a program bridling
  between moral philosophy and AI alignment). Two people — say, a fellow grad student
  and a postdoc, or two faculty at a workshop — argue about how a deployed assistive
  AI should handle value conflicts. Let me build the exchange.


  Setting: a workshop on the governance of a municipal AI system, or a design team
  deciding how a public-facing assistant handles contested questions. Two colleagues,
  call them A and B.


  Let me write a rich exchange:


  Round 1: A says the system should aggregate the preferences of the population it
  serves — e.g., learn from expressed preferences and produce policies that maximize
  a weighted social welfare function, possibly via something like approval voting
  over outcomes. Otherwise, any particular values are being imposed by the design
  team in California.


  Round 2: B says aggregation over actual preferences is ruled out for two reasons:
  (i) Arrow — no aggregation rule satisfies the reasonable conditions, so the "aggregate"
  is an artifact of the rule chosen, and choosing the rule is itself the substantive
  value imposition A wanted to avoid; (ii) preferences are endogenous and adaptive
  — people adapt their preferences to unjust circumstances (Elster''s adaptive preferences),
  so aggregation entrenches the status quo distribution of power.


  Round 3: A replies: Arrow''s theorem is a constraint on ranking rules over *unrestricted*
  preference profiles; it doesn''t say all aggregation is arbitrary, and empirically
  relevant profiles are usually not the pathological ones — plus Arrow-type impossibility
  results coexist with positive results (e.g., if you restrict to single-peaked preferences,
  majority rule works fine; May''s theorem gives a characterization of majority rule).
  And on endogeneity: the same objection applies to B''s own alternative — whatever
  "considered" or "reflective" preferences B substitutes are filtered through B''s
  theory of which distortions count, which is exactly the imposition A objected to.
  A accuses B of having no non-question-begging account of which preferences are "distorted."


  Round 4: B concedes the single-peaked point but says it doesn''t help: single-peakedness
  is a substantive assumption about the issue structure, and whether it holds is precisely
  what''s contested. On endogeneity, B offers a criterion: preferences formed under
  conditions X are distorted if the person would disavow them under conditions of
  adequate information and absence of fear — a counterfactual, "endorsement" test.
  A says this is Rawlsian/veil-of-ignorance smuggling, and that B has now simply relocated
  the aggregation problem behind a veil: you still have to aggregate the counterfactual
  preferences of all the people, and now you''ve added a modeling assumption about
  each person''s counterfactual self. Worse, A says, B''s disavowal test can be turned
  around: people in "liberated" conditions often *disavow* their former adaptive preferences
  only after the fact and sometimes regret it — so the test yields verdicts that depend
  on which moment you ask.


  Round 5: B replies that the moment-relativity is not fatal because the test is normative,
  not empirical: it asks what people would endorse under conditions that satisfy independently
  specified criteria of autonomy, and the correct answer to that is a matter of argument,
  not polling. A says: exactly — "a matter of argument" is where the design team''s
  own philosophy wins by default, which is the illiberal outcome A was trying to avoid,
  and now B has defended a perfectionist liberalism in the name of neutrality. B says
  that a system that refuses to adjudicate is not neutral either — inaction has distributive
  consequences — so A''s neutrality charge proves too much: it condemns every possible
  design, including B''s, including A''s.


  Then, both agree the whole thing came to a standstill.


  Now: what would the adjudicator need to deliver? Rate each move; identify where
  each is right; note what both miss (e.g., the level confusion between aggregating
  *values for a system''s decisions* vs. aggregating *political legitimacy*; the distinction
  between the design-time question of who decides and the run-time question of how
  the system resolves particular conflicts; the fact that Arrow applies to social
  welfare functions over complete orderings but the AI''s problem is often a decision
  problem under uncertainty where cardinal, interpersonally comparable measures may
  or may not be available; Harsanyi''s aggregation theorem as an alternative to Arrow;
  the missing option of a procedural/modular design — let the system be neutral about
  the good but enforce a floor of basic rights, i.e., a lexically prior constraint
  rather than an aggregated objective; the missing point that "whose values" may be
  a question of standing rather than weighting; the possibility of a "moral parliament"
  or deliberative component; also both miss that revealed preference data from a deployed
  system is not the population''s preferences but the preferences of whoever interacts
