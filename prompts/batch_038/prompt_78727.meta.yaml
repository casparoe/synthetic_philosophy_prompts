  expressive budget, and that she spends it where she believes the outcome is insulated
  from her, so that expressive license and perceived decisiveness are inversely related.
  On this account, first-round voting in a two-round system is structurally the place
  where citizens spend their expressive budget — the runoff is where they cash in
