  I want to use this episode to test three ways of thinking about the ethics of voting,
  and I want the testing to go in both directions: what each view implies about what
  the voters of April 21 ought to have done, and what April 21 shows about each view.


  The three positions, stated as their defenders would state them:

  (1) The instrumental view: a vote is an act with consequences; its moral weight
  is a function of the probability that it changes the outcome and the value of the
  difference it makes; and since in a national election that probability is negligible,
  voting cannot be morally required and the ethics of voting is largely a matter of
  what we owe in our capacity as agents who collectively decide.

  (2) The expressive view: a vote is primarily a public statement of who the voter
  is and what she endorses, and its value does not depend on its causal contribution;
  the instrumental view mistakes the point of the activity, in the way that a view
  of conversation as information transmission mistakes the point of conversation.

  (3) The lesser-evil view: when the options are all bad, voting for the least bad
  is not merely permissible but sometimes required, and the worry that it makes the
  voter complicit in the evils of the lesser option can be answered...


