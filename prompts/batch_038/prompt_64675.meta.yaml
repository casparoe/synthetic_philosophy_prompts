  1. "A difference that makes no possible difference to experience cannot be a real
  aesthetic difference" — this is a gloss of the Goodman-style "indistinguishability"
  premise, but the actual argument (Goodman) is that the possibility of a difference
  matters: the fact that we can''t tell now doesn''t mean we never could, and knowing
  that a difference exists gives us a reason to train perception. Also, the argument
  isn''t that aesthetic value "cannot reside in the surface" — it''s subtler: the
  perceptual difference may be discoverable later, and the original functions as an
  exemplar/sample.

  2. "it also explains why forgery is wrong in exactly the same way plagiarism is
  wrong — both are failures of credit" — conflates the aesthetic question (is the
  forgery good/bad as art) with the ethical/legal question (deception, fraud). Many
  defenders of the "achievement" view explicitly keep these apart; a forgery need
  not deceive anyone to be aesthetically inferior (e.g., the disclosed forgery, the
  "known fake"). Also plagiarism and forgery differ: plagiarism copies content while
  misattributing authorship of an original work; forgery produces an object in the
  style of another and passes it as theirs. Conflating them is a subtle error.

  3. "Forgeries fail the second test, not the first" — this reverses/garbles Dutton''s
  distinction between nominal authenticity (the work''s origin, its being by the actual
  artist — provenance) and expressive authenticity (the work''s being true to the
  artist''s own inner voice, not derivative, not pandering). A forgery fails nominal
  authenticity by definition; the interesting question is whether expressive authenticity
  can carry aesthetic weight in the absence of nominal. So "forgeries fail the second
  test, not the first" is backwards — actually forgeries fail the first (nominal)
  by definition, and whether they fail the second is exactly what''s contested. That''s
  a nice subtle error: the popularizer has the distinction right in name but flips
  the application. Good.

