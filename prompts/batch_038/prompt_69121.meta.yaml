  Now, the model answer: must reach a conclusion, not survey. Specify: the model answer
  should argue a definite thesis (I could suggest: that the graduation objection fails
  because the incubator thesis mis-describes the history — the fields that "graduated"
  took their philosophical problems with them rather than leaving them behind, so
