  with the mutual-undercutting problem.


  Word count: model answer ~900-1000 words.


  Marking scheme: 30 marks; must name at least six moves, each with mark values; must
  state the A/B boundary in terms of specific content, not tone or effort.


  Errors: name four, e.g.:

  - Treating the graduation objection as an ad hominem about philosophers'' job security.

  - Conflating "philosophy influenced scientists" with "philosophy contributed to
  science" (influence on persons vs. contribution to content) — the "biographical
  fallacy".

  - Answering with a list of counterexamples (Einstein reading Mach, Bohr and positivism,
  Everett) without explaining why a list of historical instances supports the collaborator
  thesis rather than merely the incubator thesis.

  - Retreating to the claim that philosophy''s contribution is "critical" or "clarifying"
  without noting that this concedes grade (ii)/(iii) and thus strengthens the graduation
