  The prompt should be a polished, formal request from an instructor. Content:


  Setting: upper-level (final-year undergraduate / first-year graduate) philosophy
  of science course. Final exam, one essay question, 40 minutes or 2 hours? Let''s
  say: a 2-hour final with two questions; I want one of them. Or a take-home. Let''s
  specify: a three-hour final in which students answer two of three questions; this
  question is worth 30 marks; expected length ~1200 words.


  Requirements for the question:

  1. It must not be answerable by narrating the feud or listing philosophers who made
  scientific contributions (the standard student move). Explicitly forbid/penalize
  that.

  2. Build it around a distinction the instructor supplies: the "incubator" thesis
  (philosophy has historically contributed by generating fields that later became
  sciences) vs. the "collaborator" thesis (philosophy contributes to ongoing scientific
  practice now). The question should force students to consider the "graduation objection":
  the strongest anti-philosophy argument may be that the incubator thesis, if true,
  predicts the collaborator thesis is false — each success removes the material philosophy
  worked on. Students must assess whether the graduation objection is sound, and what
  its truth would imply for the value of philosophy.

  3. Also require a taxonomy of contribution grades: (i) conceptual hygiene/clarification
  (removing ambiguity, exposing equivocation), (ii) hypothesis generation (proposing
  new empirically testable claims), (iii) adjudication under empirical equivalence
  (choosing between theories that agree on all observable consequences). Require students
  to say, for a case of their choice, which grade it belongs to and whether the grades
  are genuinely distinct or collapse into one another — and in particular whether
  grade (i) can ever be non-trivially different from grade (ii).

  4. A trap: the question should have an embedded asymmetry that rewards students
  who notice that physicists'' complaints and philosophers'' defenses are often aimed
  at different claims, and that a defense of grade (i) contributions actually concedes
  something to the physicists (that philosophy doesn''t produce content), which then
  makes the graduation objection stronger. That''s the crux: a genuinely good answer
  must notice that the two most available defenses undercut each other.

  5. Deliverables: (a) the question text, formatted as it would appear on the exam
  paper, with mark allocation and sub-parts; (b) a model answer of about 900 words;
  (c) a marking scheme allocating the 30 marks across named moves, with explicit A/B
  boundary criteria; (d) a short list of four or five errors that should cost marks,
  with a note on why each looks persuasive but fails.


  Also add: no citations/references required of students (they''re in an exam), and
  the question must be answerable from general knowledge of one or two well-known
  cases (e.g., the measurement problem, the interpretation of probability in statistical
  mechanics, the definition of a species, the status of spacetime in quantum gravity,
  causation in epidemiology/statistics, the meaning of "random" in algorithmic information
  theory) — no specialist physics beyond first-year level.


  Also: instruct that the question should not be a "compare and contrast" or "discuss"
  prompt.


  Let me also require a bit of realism: mention the exam context — the course has
  covered the physics complaints; students have read one essay by a physicist dismissing
  philosophy and one philosopher''s reply. Hmm, if I say students have read specific
