  8. An honest marking of which steps are judgment calls wearing the clothes of procedure.


  Then run the procedure on four cases and report the determination each produces,
  with the reasons and the steps where the panel would have to exercise discretion:


  (a) A single high-power optical transmission, aimed once at a planet twelve light-years
  away whose atmosphere has produced disputed but not dismissible biosignature candidates,
