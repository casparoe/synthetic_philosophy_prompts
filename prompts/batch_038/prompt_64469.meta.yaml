  \ prediction is rich and I can make it genuinely underdetermined.\n\nActually, let\
  \ me consider the collective memory vs history domain with the verdict-prediction\
  \ type: e.g., a heritage committee's past decisions. Hmm, that's also good but might\
  \ slide into policy. The instruction says to inject niche/new ideas so models can't\
