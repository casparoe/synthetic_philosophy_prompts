  \ Parfit's textbook ones but plausible extensions, with a new twist. E.g. a \"distributed\
  \ teletransporter\" that creates the copy and destroys the original at different\
  \ times, or \"gradual replacement with memory-erasing snapshots\", or something\
  \ like a case where the original survives but the copy is created and then the original's\
  \ psychology is retroactively overwritten by the copy's... Let me design carefully\
  \ so two candidate rules diverge.\n\nLet me think of a coherent set of verdicts\
  \ from a person (say, a flatmate / an online forum regular / a friend who's done\
  \ a lot of philosophy) about survival/identity cases. I'll invent cases rather than\
  \ use Parfit's exact ones, though I can reference the standard ones loosely (teletransporter,\
  \ fission, gradual replacement) since those are well-memorised and the ask is about\
  \ the rule they're running.\n\nDesign: The friend's verdicts:\n1. Standard teletransporter:\
  \ original destroyed, copy made on Mars from complete scan. Verdict: not survival\
  \ — \"that's just a fancy suicide booth\". Actually wait, Parfit himself says it\
  \ depends; but many people say no survival. Let's set verdicts so that multiple\
  \ rules fit.\n\nLet me pick candidate rules:\n(A) Psychological continuity + uniqueness\
  \ (no branching): survival requires non-branching psychological continuity, and\
  \ requires no rival.\n(B) Psychological continuity regardless of branching (Parfit's\
  \ \"Relation R\"): what matters is psychological continuity and/or connectedness\
  \ with the right kind of cause, branching irrelevant.\n(C) Bodily/biological continuity:\
  \ survival requires continuity of the same living organism/brain.\n(D) A \"no duplication\
  \ of personhood\" / one-thinking-subject-at-a-time rule.\n(E) Something about the\
  \ direction/causal-historical order — e.g. the original must be the causal source\
  \ of the later person (forward-looking cause vs backward).\n(F) A \"first-person\
  \ access\" rule: what matters is whether there's someone it's like to be continuing\
  \ from the inside.\n\nNow craft verdicts consistent with several of these:\n\nCase\
  \ 1: Classic scan-and-destroy teleport (original destroyed, copy built on Mars).\
  \ Friend says: survival, it's fine, I'd use it.\nCase 2: Fission — brain's two hemispheres\
  \ transplanted into two bodies, both wake up psychologically continuous. Friend\
  \ says: both are you? or neither? To keep rules divergent, let's say: friend says\
  \ neither survives but both matter equally, i.e., \"it's not that I survive as either,\
  \ but it's not like death either.\" That's classic Parfit. Hmm, but then rule (B)\
  \ says both survive (Relation R holds). Parfit's own view: identity doesn't hold\
  \ (because of non-branching requirement for identity) but what matters does hold.\
  \ That's a distinctive combination — a hasty person might conflate \"what matters\
  \ in survival\" with \"identity\". This conflation could be the crux: the friend\
  \ may be running \"identity requires non-branching, but what matters doesn't\" —\
  \ i.e. they separate the two. Or the friend may be running \"bodily continuity\"\
  \ for survival and \"psychological\" for what matters.\n\nI want the new case to\
  \ be one where candidate rules diverge. Let me design the new case as: \"delayed\
