  tripled since 1980, either the heritability estimates are wrong or the environment
  doesn''t matter." Hmm.


  Actually a genuinely subtle confusion: heritability is population- and environment-relative;
  a trait can have heritability near 1 and still be fully preventable by environmental
  change (phenylketonuria is the classic example — that''s well known though). Something
  more in the weeds: polygenic scores and the difference between heritability estimated
  from twin studies vs. from SNPs; "missing heritability"; and the assumption that
  because a PGS explains X% of variance in a sample, it predicts X% for an individual.
  Or the assumption that a high heritability estimate in a population with equal environments
  means the trait is "innate" and thus that group differences must be genetic (the
  Lewontin critique — seed/variance analogy). That''s known but the weeds version
  could be a personal framing: an adoption agency, or a person who has done a DTC
  genetic test and got a polygenic score for educational attainment, and wants to
  know how much of their score to attribute to environment.


