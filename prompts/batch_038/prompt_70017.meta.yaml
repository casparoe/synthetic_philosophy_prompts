  Key misunderstandings to plant:

  1. "Hard core is irrefutable → so nothing can count against the programme → the
  unfalsifiability charge misses entirely." (Lakatos: the core is protected by decision,
  but the programme as a whole is appraised; also unfalsifiability-by-decision doesn''t
  make it scientific — Lakatos''s demarcation is about the whole programme''s track
  record, and he was no friend of unfalsifiable frameworks; the negative heuristic
  is a rule about where to aim modus tollens, not a licence.)

  2. "Progressive = still generating content / absorbing anomalies / hasn''t been
  falsified." (Real criterion: excess empirical content, novel facts, some corroborated
  — and novelty relative to the prior version; independently motivated auxiliaries
  aimed at saving a known anomaly may still be ad hoc if they don''t produce novel
  predictions.)

  3. The claimed novel prediction "nobody expected and it turned out right" — is that
  a novel fact relative to the competing theory, or a post-hoc fit? And is a single
  corroborated novel prediction enough?

  4. Temporal issue: can you be progressive now? Lakatos: appraisal is retrospective,
  over the long run; you can''t get instant rationality.

  5. The comparative point: progressive/degenerating is relative to a rival programme,
  and the reviewer may not be a naive Popperian — the real question is whether there''s
  a rival, and Lakatos only allows abandoning a programme when a better one exists,
  but he also allows it to be criticized as degenerating while waiting.

  6. Also: the reviewer''s charge of "patching with new parameters each time a prediction
  fails" — under Lakatos, ad hoc-ness is not about adding auxiliaries per se (that''s
  normal, protective belt), but about whether the additions have independent support
  and yield novel predictions. So partly the PI is right; the person overreaches by
  inferring that the whole critique evaporates.


