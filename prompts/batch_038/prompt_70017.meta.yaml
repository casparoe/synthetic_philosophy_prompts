  There are multiple confusions bundled: (1) hard core irrefutable ≠ nothing counts
  against the programme — Lakatos''s appraisal is comparative and retroactive; a programme
  can be rationally abandoned, and "degenerating" is a real criticism; (2) progressive
  requires novelty: each step must lead to novel predictions, and some must be corroborated
  — merely adding independently-motivated auxiliaries and having some unexpected successes
  isn''t enough if the successes are post hoc or the predictions aren''t genuinely
  novel; (3) crucially, "not yet falsified" isn''t the criterion — Lakatos explicitly
  rejected the idea that a theory is refuted by a counterexample alone (only by a
  better rival theory), but the converse — that progressive means unfalsified — is
  wrong; and (4) the biggest confusion: thinking that whether a programme is progressive
  is decidable right now, instantaneously, when Lakatos held that appraisals are only
  made with hindsight, over decades ("instant rationality" is impossible).


