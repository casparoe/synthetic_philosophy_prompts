  I like the "false presupposition" type combined with Lakatos. A common confusion:
  thinking Lakatos''s "hard core" is empirically refutable / that falsification of
  the protective belt refutes the core; or thinking "progressive" means "makes true
  predictions" and "degenerating" means "false predictions" — actually Lakatos''s
  notion of progressive problemshift is about theoretical + empirical progress (predicting
  novel facts), not about whether a programme is true. Another common confusion: conflating
  "sophisticated falsificationism" (methodology of scientific research programmes)
  with Lakatos''s "proofs and refutations" (quasi-empiricism in mathematics) — people
  often think Lakatos held that mathematics is quasi-empirical and therefore that
  a mathematical proof can be falsified by counterexample in the same way an empirical
  theory can. That''s a nice false presupposition: "Lakatos showed that mathematical
  proofs get refuted by counterexamples, so math is empirical like physics" — the
  confusion conflates the methodology of proofs and refutations with the MSRP, and
  misreads "monster-adjustment"/concept-stretching.


  Or: Sidgwick + false presupposition — Sidgwick is often thought to have been a skeptic
