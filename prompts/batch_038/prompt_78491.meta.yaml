  it because we draw the figures ourselves and know how they''re generated — was basically
  a 17th century version of constructivism in math. Like, you only really know an
  object if you know how to build it. She said Hobbes got there 250 years early.


  2. Amir said that''s just projecting. His version: Hobbes''s point is about definitions,
  not construction. Names and definitions are ours to stipulate, so we can reason
  from them with certainty because there''s nothing in the world the reasoning has
  to match. That''s basically the axiomatic view — you''re free to posit your primitives,
  and it has nothing to do with "building" anything.


  3. Ruth said then Hobbes can''t explain why geometry is special. If it''s just stipulated
  definitions, arithmetic and algebra get the same certainty, and Hobbes clearly didn''t
  think that — he mocked algebraic symbolism and hated Wallis''s infinitesimal methods
  as unintelligible. She said he wanted proofs to track something you can picture
  being generated by motion, which is why symbolic manipulation bothered him.


  4. Amir said fine, but the real reason geometry is special for Hobbes has nothing
  to do with pictures: it''s that for Hobbes to know a thing is to know its cause,
  and the only causes we actually know are the ones we produce. So geometry is certain
  because we make the figures, and physics can only ever be guesswork — we see effects
  and hypothesize causes that could have produced them, without ever knowing which
  one did. He said that''s a claim about causation, not about proof.


