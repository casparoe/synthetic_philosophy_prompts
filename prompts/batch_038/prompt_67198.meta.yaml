  ---


  I spent three hours last night arguing with a friend about no-self and personal
  identity and we got nowhere, so instead of re-litigating it I want my own position
  audited. What I hold, in roughly the order I would defend it:


  (a) Momentariness, taken strictly: each moment of experience is a discrete existent
  that perishes as its successor arises, and nothing — not even a dharma — endures
  through change.

  (b) The person is nothing over and above a causally ordered series of such moments:
  a name for a continuum, with no owner of that continuum at any level of description.

  (c) Continua are individuated by causal relatedness alone: a moment belongs to my
  series rather than yours just in case it stands in the right causal relation to
  my later moments. I take there to be no further fact of series-identity beyond that.

  (d) The classical Buddhist line on rebirth — that the one who takes rebirth is neither
  identical with the one who died nor a different being — is a substantive position
  I accept rather than a hedge.

