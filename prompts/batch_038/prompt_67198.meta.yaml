  perishes as its successor arises; nothing, not even a dharma, endures through change.

  (b) The person is nothing over and above a causally ordered series of such moments;
  "I" is a label for a continuum, and there is no owner of it, at either the conventional
  or the ultimate level of description.

  (c) The continuum is individuated purely by causal relatedness — moment A belongs
  to my series rather than yours just in case it stands in the right causal relation
  to my later moments. I take this to be all there is to say about the boundaries
  of a series; no further fact of series-identity.

  (d) The classical Buddhist formula about rebirth — that the one who takes rebirth
  is neither identical with the one who died nor a wholly different being — is a substantive
  position I accept, not a hedge to be embarrassed about.

  (e) Badness is always bad for someone. I reject impersonal or subject-free value:
  if there is no subject for whom a state of affairs is bad, then it is not bad.

  (f) Consequently, being reborn into a worse condition because of what I do now is
  genuinely bad for me, and prudence about it is rational, and (g) the cessation of
  the series — nirvana — is the supreme good and is good in a way that gives me a
  reason to practice.


