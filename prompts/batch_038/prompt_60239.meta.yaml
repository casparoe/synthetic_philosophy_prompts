  ---


  I am one of three members of the Animal Welfare and Product Integrity Advisory Panel
  at a mid-sized agri-ingredients company. We rear black soldier fly larvae at industrial
  scale for animal-feed protein, and we also operate a controlled-environment greenhouse
  business whose substrate supply chain is, unavoidably, insecticide-intensive. The
  panel has no authority to decide; it writes recommendations to the executive team,
  and our next one is due in ten days, before an audit by a European feed customer
  who has asked, in writing, whether our harvest process is welfare-assured. The concrete
  question in front of us is whether to adopt a standard that (a) requires larvae
  to be chilled into torpor before being killed, rather than direct freezing, blanching,
  or maceration, (b) requires the chilling step to be logged and spot-verified, and
  (c) commits us not to use any killing method for which there is no evidence at all
  of reduced aversiveness. The engineering estimate is a throughput loss of about
  eight percent and a capital cost we can absorb, but it would apply only to the larvae
  line, which handles roughly four hundred billion individuals a year.


  The panel is split, and the split is not about cost. Our chair, who comes from operations,
  wants us to adopt an explicit decision rule so that this petition and the next one
  get the same treatment: her proposal is that we score each candidate mitigation
  as (individuals affected per year) × (our credence that the species is sentient)
  × (an intensity-and-duration factor between zero and one), and adopt anything whose
  product clears a fixed threshold. One of my colleagues — a philosopher we retain
  part-time — thinks the rule is either vacuous or self-defeating: with numbers in
  the hundreds of billions, any credence above rounding error clears the threshold,
  so the rule collapses into an instruction to always adopt every mitigation anyone
  proposes; but if we set credences honestly low, as he thinks the evidence about
  insect nociception warrants, the same rule licenses doing nothing, and its output
  is just a restatement of whichever number we put in. He also raises what I take
  to be the harder objection. The behavioral criteria our standards documents rely
  on — flexible avoidance of noxious stimuli, learning from injury, trade-offs between
  foraging and self-protection, wound grooming — are, he says, satisfied by things
  nobody on this panel thinks have interests, including the adaptive controller in
  our own greenhouse and, with a little generosity, a modern thermostat that learns
  occupancy patterns. So either the criteria are picking out the wrong property, or
  we are committed to a conclusion we find absurd, and he wants the memo to say which.
  There is also a scope worry nobody has put in writing: if the standard applies to
  larvae, our substrate is full of mites and springtails, and the grain we buy is
  produced with broad-spectrum insecticides that kill vastly more insects than we
  ever rear. Our marketing department, meanwhile, has already used the phrase "welfare-assured"
  in a draft brochure, which may mean the decision is partly made for us.


  Please draft the recommendation I will circulate... [deliverable specs]


