  "Here is my opening gambit. I show you Escher''s Drawing Hands: two wrists emerge
  from a flat sheet and each is drawing the other into existence. A hierarchy with
  no bottom and no top; every level is inside the tangle. Hofstadter and his followers
  say this is what a mind is, and they draw a conclusion directly against you: if
  the mind is such a loop, then there is no inviolate level, no vantage from outside
  the system from which the mind could survey its own formal machinery — and yet,
  they say, it does not need one, because the loop''s capacity to represent its own
  representations is enough. Your argument, as I understand it, requires the mind
  to step outside any given finite machine and see the truth of a sentence that machine
  cannot prove. But on the loop picture there is no outside to step into: what you
  call seeing-from-outside is just the loop''s next turn, another hand drawing the
  one that drew it. So either you smuggle in an inviolate level — a mind standing
  beyond every formal system, which looks suspiciously like a soul — or your ''seeing''
  collapses into something the machine can do too. Which is it?"


