  "Write a dialogue, set at a late-night office hour, between two philosophers who
  disagree about whether hypocrisy can really cost a person the standing to blame.


  One holds that standing is a genuine normative relation: when a person condemns
  a fault in another while exempting himself from the same norm, he has not merely
  been impolitic or unpersuasive — he has done something to the moral relation between
  them, and his blame is thereby unfitting even when everything he says is true.


  The other holds that ''standing'' is a philosopher''s artifact: the tu quoque is
  a fallacy, the truth of a charge is untouched by the charger''s record, and everything
  that looks like a loss of standing dissolves into ordinary considerations of effectiveness,
  credibility as evidence, or manners.


  Neither should be permitted to be a strawman, and each should get to press the other
  with the same two cases:


  1. A man who, after a brain injury, has become incapable of the very vice he now
  condemns most eloquently — he cannot be tempted by it, and his condemnation has
  never been uneven. Does he have standing, or has the injury taken something away
  that blame requires?

  2. A woman who has never committed the fault she condemns and condemns it evenly
  in everyone — but only because she has never been in a position to get away with
  it, and would gladly do it if she could. Nothing in her conduct or her dispositions
  toward others differs from the saint''s. Does she lack standing?


  Have them actually respond to one another''s moves rather than deliver parallel
  monologues, and let the dialogue end somewhere honest — a real concession, a sharpened
  disagreement, or a stalemate — rather than with a tidy synthesis neither position
  licenses.


  A closing note of your own (out of character) should say which side you think is
  better placed to handle the two cases and why, flag any place where you had to fill
  in a detail about the cases or the positions that the literature leaves open, and
  — if you think the framing itself is off, e.g. that the two cases don''t in fact
  pull against each other, or that one of the positions can''t be stated without collapsing
  into the other — say so plainly instead of writing the dialogue as ordered."


