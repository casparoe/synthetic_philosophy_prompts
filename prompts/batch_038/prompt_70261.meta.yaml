  Long-time lurker on LW/SSC-adjacent stuff, and I keep running into the same argument
  with a friend who does urban planning. He''s a Deweyan and I''ve been reading up
  on Carnap''s takes on politics and planning, so help me settle which of us has the
  better framework.


  Here''s the Carnap-side position as I''ve reconstructed it (correct me if I''m mangling
  it): value statements aren''t the kind of thing that can be true or false, they''re
  expressions of a stance; so science and logic can''t pick your ends for you. But
  that does *not* leave planning to arbitrary will, because there''s still a huge
  amount of rational work: figuring out what your ends actually commit you to, showing
  that two ends you''re holding are mutually incompatible, and comparing means by
  their consequences. And Carnap was anything but quietist about this — he was a socialist
  who thought rationally planned social and personal life was an urgent project, which
  is exactly the part I find hard to square with the non-cognitivism about ends.


  The Dewey side, as I understand it, is that ends aren''t outside inquiry at all:
  they''re ends-in-view, proposals formed inside a problematic situation and tested
  by acting on them, so the fact/value split that Carnap keeps is a mistake that hands
  real questions over to "preference" prematurely.


  LW-ish way I''d put it: Carnap says the utility function is exogenous and only the
  search over means is rational; Dewey says the utility function is itself something
  you should be updating on, and that treating it as fixed is how you end up defending
  terminal values you''d drop if you actually simulated their consequences.


  What I want: compare these two on the question of what a planner is allowed to treat
  as settled, and commit to a side. Concretely: give me the kind of planning question
  where the two frameworks route the answer differently — one sends it to evidence
  and argument, the other sends it to a vote or a decision — and say who''s right
  about that class of question. Also tell me whether the Carnapian "we can still show
  your ends are inconsistent, and we can tell you what they commit you to" move already
  gets you most of what Dewey wants, i.e., whether the disagreement is real or just
  about where to draw the line inside the same territory.


  Format: exactly five numbered items, one or two sentences each, no intro and no
  conclusion. Roughly: (1) the load-bearing disagreement, stated so it can''t be dissolved
  by redefining terms; (2) what the Carnap view tells my friend to do in the concrete
  case; (3) what the Dewey view tells him; (4) the one item that actually decides
  between them; (5) your verdict — pick a side and give the reason, plus the strongest
  thing the losing side can say back. Don''t both-sides it: I want a definite call
  and the reasons for it.


