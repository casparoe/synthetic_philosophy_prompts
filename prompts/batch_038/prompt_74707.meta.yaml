  so avoids saying it is true — the contradiction is contained in a special value."
  That''s a real subtle error: for Priest, "both true and false" means the Liar genuinely
  is true (and false); the third value is not a way of avoiding the contradiction,
  it''s a way of representing it. The student''s framing that the dialetheist "escapes"
  the contradiction by relegating it to a third value inverts the whole point (it
  collapses back toward the gap-theorist reading).


