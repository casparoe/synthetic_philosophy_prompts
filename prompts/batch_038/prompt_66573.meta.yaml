  The desiderata type on moral trade is probably the least-discussed domain of the
  five. Let''s think: "moral trade" desiderata. I can inject a concrete setup: the
  asker coordinates a coalition of ~12 charities with different cause priorities who
  are informally swapping — "I''ll take the animal-welfare grant round if you take
  the global-health one" — and wants a spec for a theory of permissible moral trade.
  Requirements the theory must deliver:


  1. Individuation: what counts as a trade vs. mere coincidence/coordination; does
  it require an agreement, or just reciprocal action?

  2. The complicity/integrity constraint: whether you may perform an act you believe
  wrong (or merely not-best) because another''s values endorse it; must handle the
  difference between doing it yourself, funding it, and permitting it.

  3. The currency/commensurability requirement: to trade you need a rate of exchange
  between incommensurable values; must say whether the theory needs cardinal interpersonal
  comparisons, and what happens if values are incommensurable (a theory that presupposes
  a common metric may beg the question, since the whole point of trade is divergent
  metrics).

  4. Non-subordination requirement: the trade must not make one party a mere instrument;
  must handle exploitation cases (unequal bargaining power).

  5. The "trade with the abhorrent" case: must handle trades with agents whose values
  you think actively evil, and the requirement that the theory not license trade that
  increases expected badness even under your own view (i.e., trade must not be dominated).

  6. Epistemic analogue test: must explain why moral trade is possible but epistemic
  trade ("I''ll believe p, you believe q") is not — or accept that it is. This is
  a nice discriminating requirement.

  7. Value-change / character effects: must handle the possibility that trades reshape
  your values over time (endorsement drift), and the requirement of dynamic consistency
  — a theory that recommends trades must not be self-undermining.

  8. The aggregation requirement: does the theory need to say what to do when many
  parties with many views trade, and must it avoid cycles/money pumps (a theory that
  permits trade sequences leading back to the start with a loss is exploitable — Dutch
  book).

  9. The publicity/expressive requirement: whether the theory must survive being publicly
  known (Kantian publicity; also the concern that a trade in moral action changes
  what the action expresses — giving to charity for a swap vs. out of concern).

  10. The "ought implies can" / verification requirement: to trade you must know the
  other''s values well enough; must handle misrepresentation and the incentive to
  overstate the intensity of your commitments (strategic exaggeration) — this is a
  real problem, the analogue of preference falsification.

  11. Consistency with moral uncertainty theories (e.g., maximizing expected choiceworthiness)
  — must say whether trade ever beats acting on your own best guess.

  12. The "no-trade baseline": must define the counterfactual, since whether a trade
  is good depends on what each would have done otherwise.


