  Prompt draft:


  "I''m a fourth-year PhD student in philosophy of mind, and in three weeks I''m presenting
  a chapter of my dissertation at an interdisciplinary workshop on levels of explanation,
  hosted by a computational cognitive-science institute. The room will be mostly people
  who build and analyze neural network models of cognition — they think in terms of
  predictive accuracy, compression, model selection, and training distributions —
  plus two philosophers of science who work on scientific realism and one researcher
  who does mechanistic interpretability of large language models. Nobody in the room
  is a Dennett specialist, and several have said privately that they expect a philosophy
  talk about "levels" to be a sermon about how their reductionist instincts are philosophically
  naive.


  My thesis is a version of realism about the intentional stance, argued for through
  the compression criterion in Dennett''s essay "Real Patterns," which I formalize
  as follows. [then the four steps]


  Step 1: ... a level of description L counts as tracking a real pattern in a system
  S just in case, relative to a fixed repertoire R of candidate descriptions and a
  fixed accuracy tolerance ε, L is ε-adequate for S''s behavior and is strictly shorter
  than every other ε-adequate description in R.

  Step 2: fix R and ε and the ranking is a fact about S, not about us; so realism
  about the pattern is compatible with the relativity in step 1, exactly as a claim
  about which of a fixed set of hypotheses best fits a fixed data set is mind-independent
  even though the set was chosen by us.

  Step 3: apply this to the three stances. For us, the intentional idiom dominates
  the design stance on the length/accuracy trade-off and crushes the physical stance,
  so beliefs and desires are real patterns, not merely useful fictions. The instrumentalist
  reading of Dennett, on which the intentional stance is a mere heuristic with no
  ontological commitment, gets the criterion backwards: heuristics are allowed to
  fail, and the whole point of dominance is that failures at this level are not tolerable.

  Step 4 (the part I''m most nervous about): the corollary is that if a description
  in R became available that was both shorter and more ε-accurate — a cheap exact
  physical simulation, say — the intentional level would stop dominating and beliefs
  would stop being real patterns in that system. I want to defend this as a feature:
  reality is not a popularity contest among descriptions, and I''d rather have a criterion
  that can be lost than one that is guaranteed.


  Deliverable: a Q&A prep sheet, not a defense of the view. Give me the eight or nine
  objections this audience will actually raise, ordered by the product of how likely
  each is to come up and how much damage it would do if I fumbled it. Phrase each
  in the vocabulary the objector would use — an interpretability researcher will not
  say "your criterion collapses into instrumentalism," they''ll say something about
  probes, features, and superposition; a model-builder will talk about loss, capacity,
  and model classes — and under each: a reply I can deliver in about two minutes of
  speaking, and one or two sentences saying honestly where that reply is soft. Mark
  which objections, if any, are worth conceding in the opening five minutes to buy
  credibility, and tell me which single reply has to land for the chapter to survive
  the question period. Flag any objection that rests on a misunderstanding of what
  a philosophical claim about compression is doing, but tell me how to say that without
  sounding like I''m accusing the room of a category mistake. End with the question
  I''m praying nobody asks: the one that I think has no good answer, stated as sharply
  as its author would state it, with your assessment of whether there''s any live
  escape or whether I should restructure the chapter before the talk. I don''t want
  citations or a reading list — I want the objections and what to say back."


