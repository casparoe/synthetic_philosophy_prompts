  The student''s thesis (injected, novel):

  1. Cash out "real pattern" as: a level of description L is a real pattern in system
  S relative to a class of descriptions C iff L is the *shortest* description in C
  that predicts S''s behavior to within some tolerance, and L strictly dominates on
  the accuracy/length trade-off.

  2. Argue this yields *realism*, not instrumentalism, because the ranking is (they
  claim) mind-independent once C and the tolerance are fixed.

  3. But concede that C and the tolerance are interest-relative — hence "real patterns
  are relative to a descriptive repertoire," which they defend as no threat to realism
  (analogy: real but scale-relative, like "flat" or "large"? Or: the relevant relativity
  is like that of a measurement to an instrument).

  4. A provocative corollary they defend: for systems where we have a complete physical
  simulation, the intentional stance is *not* a real pattern (it fails to dominate)
  — so beliefs are real patterns only in us because we can''t simulate our own brains.
  Realism about beliefs is thus hostage to our computational limitations, and they
  claim this is a *virtue* of the view.


