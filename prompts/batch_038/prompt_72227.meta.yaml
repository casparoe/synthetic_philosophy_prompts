  theorem alone does NOT rule out dictatorship; the equal weights come from Harsanyi''s
  separate impartial-observer/veil argument or a symmetry assumption.) This is a nice
  subtle point: the aggregation theorem by itself is consistent with giving one person
  all the weight.


  2. "The theorem needs interpersonal comparisons of utility, which is why economists
  rejected it." Actually the reverse is often claimed: Harsanyi argued the theorem
  *establishes* the possibility of interpersonal comparisons, or rather, the theorem''s
  conclusion depends on fixing the units and zero points of individual utilities,
  which is exactly the comparability question. The theorem doesn''t *presuppose* comparability;
  it locates the issue in the scaling (the theorem''s weights are invariant... hmm).
  Standard view: the aggregation theorem shows social utility is a weighted sum, but
  the weights and the resulting social ranking depend on how each individual''s utility
  is normalized (zero point and unit), so the theorem doesn''t settle interpersonal
  comparisons; it reduces the problem to fixing scales. Harsanyi thought the extended-sympathy/veil-of-ignorance
  argument fixes them (equal probabilities).


  3. "The theorem assumes everyone has the same probability of being in each position"
  — that''s the veil argument, conflated with the aggregation theorem.


  4. "Because the theorem uses expected utility, it rules out any concern for equality
  or the worst off." Subtle: it rules out *relational* egalitarianism and prioritarianism
  given ex ante Pareto, but the theorem''s bite depends on whether the social preference
  is required to satisfy the vNM axioms over the *same* prospects — and prioritarian
  views can escape by denying ex ante Pareto (accepting only ex post Pareto) — which
  many consider a big cost but not obviously fatal. Also, Rawls''s difference principle
  is not a vNM maximizer (it violates continuity/independence), so it escapes but
  at the cost of rejecting expected-utility-style social rationality.


  5. "Sen/Weymark showed the theorem is trivial / Sen''s liberal paradox refutes it"
  — no.


  6. Common error: "Harsanyi''s theorem shows that any welfarist view respecting unanimity
  is utilitarian, so the only escape is to reject unanimity/Pareto — nobody wants
  that." Subtle: the escape routes are (a) reject the vNM axioms for the social ordering
  (Rawls, and also "social preference over distributions of well-being levels" à la
  egalitarianism), (b) reject the *ex ante* Pareto in favor of *ex post*/statewise
  Pareto (prioritarianism), (c) deny that individual utility is the only relevant
  input (non-welfarism). So "nobody can reject Pareto" is too quick: what''s rejected
  is the strong ex ante version.


