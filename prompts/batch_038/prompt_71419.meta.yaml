  transformations (scale invariance), and monotonicity (individual monotonicity) replacing
  Nash''s independence of irrelevant alternatives (IIA). The KS solution picks the
  point on the Pareto frontier where the ratio of each player''s gain over their disagreement
  point is equalized relative to their maximum feasible gain — i.e., the intersection
  of the Pareto frontier with the line from the disagreement point d to the ideal
  point (utopia point) g, where g_i = max feasible utility for i over the feasible
  set.


