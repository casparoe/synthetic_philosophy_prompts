  and replaces with monotonicity).

  2. Claiming KS always maximizes the product of gains (that''s Nash).

  3. Claiming KS equalizes utilities (it equalizes proportional gains relative to
  the ideal, not utilities themselves).

  4. Claiming the ideal/utopia point is achievable — generally it''s not jointly feasible;
  the line from d to g hits the frontier.

  5. Claiming monotonicity means "if a player''s options improve, they can''t do worse"
