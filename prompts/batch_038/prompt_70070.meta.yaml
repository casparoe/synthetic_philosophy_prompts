  ---


  I have published four novels, and the last eighty pages of the fourth narrate a
  child''s death from a fever in the voice of his mother. It is the passage my readers
  write to me about most often, and almost always in the same terms: they wept, and
  they would not have had the book otherwise. A friend who teaches philosophy has
  sent me a numbered refutation of precisely this effect. He is a careful man and
  I do not think he is playing a game with me, but I cannot accept his conclusion
  and I cannot locate where I would refuse it. His argument runs as follows.


  1. To take pleasure in something is to want it; on the account of enjoyment he says
  he shares with me, enjoying is nothing over and above wanting more of the same.

  2. My readers take pleasure in the death of the child — their letters say so, and
  they reread the passage.

  3. Therefore they want that death.

  4. To want a state of affairs is to be disposed, all else equal, to act so as to
  bring it about.

  5. Whether the state of affairs one wants is actual or invented makes no difference
  to what is wanted, only to what is believed; and a belief is no part of a desire.

  6. Therefore my readers are disposed, all else equal, to act so as to bring about
  a child''s death from a fever.

  7. A settled disposition to act so as to bring about suffering is cruelty, whatever
  the ontological standing of the sufferer.

  8. Therefore the pleasure my readers take in my book is not a merit in the book
  but a vice in them — and, since I engineered that pleasure deliberately and with
  craft, a vice in me.


  He adds, not unkindly, that he does not see how the argument is peculiar to fiction:
  by his lights it condemns the enjoyment of any elegy, any history of a famine, any
  photograph that stops a person in the street, and even grief itself, since the mourner
  dwells on the loss with something he would not surrender. That generality is part
  of why I suspect a flaw. But each of his steps looks like something I already believed
  before he wrote it down, and I cannot tell you which one I would strike. If I had
  to choose I would keep (2) at any price, because it is the one claim in the list
  I know from experience to be true; and I would keep (5) too, since abandoning it
  seems to abandon the idea that readers are moved by anything other than sentences.


  What I want from you is a diagnosis, not a defense of my book. Name the premise
  or the inference that must go, explain why it looked innocent in context — I suspect
  each of them looks innocent for a different reason — and then price the alternatives:
  what does the diagnosis cost me if the failing step is (1), or (5), or (7)? In particular,
  I want to know whether the standard remedies actually block the argument or only
