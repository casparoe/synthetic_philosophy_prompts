  Thesis: The "one over many" problem and the "problem of the many" are duals, and
  both arise from the same error: trying to answer a qualitative question with a counting
  answer. More precisely:


  - Realist about universals: two things are both red → there must be one thing (the
  universal redness) wholly present in both. The intuition driving this: if nothing
  is literally identical in the two cases, then their being both red is a brute fact.

  - The problem of the many: a cloud. There are many overlapping aggregates of water
  droplets, each a candidate for the cloud, differing by negligible amounts. So there
  are many clouds where we thought there was one. The intuition driving this: if no
  single aggregate is metaphysically privileged, then there''s no fact of the matter.


  Both arguments have the form: "If there is no unique, privileged answer to the question
  ''which one is it?'', then either there are many answers or none, and neither is
  acceptable." Both treat "which one is it?" as the fundamental question.


  Diagnosis: In both cases, the question "which one?" is being asked about something
  that is picked out by a qualitative specification, not by a count. The right move
  is to notice that counting and qualitative characterization come apart, and that
  our ordinary concept does its work by qualitative characterization, with counting
  parasitic on it. So the realist''s "there must be something identical" is the same
  mistake as "there must be exactly one cloud."


  Then: this suggests a nominalism that isn''t ostrich nominalism, because it doesn''t
  just refuse to answer — it explains why the question misfires. Call it "count-first
  vs. character-first". And it predicts something: resemblance nominalism''s notorious
  difficulties (imperfect community, companion properties) should be structurally
  parallel to the problem of the many''s difficulties (vagueness, arbitrariness) —
  and indeed the standard fixes are parallel: Lewis''s "many but almost one" (count
  all the candidates, they''re almost identical, so it''s almost as if there were
  one) is structurally the same move as the resemblance nominalist''s "the resemblance
  class is the property, and the borderline members are almost in it" — hmm, actually
  resemblance classes with imperfect community get fixed by restricting to natural
  properties, which is a different move.


  Better parallel: the fix in both cases can be "accept multiplicity but weight it"
  — for clouds: count the candidates but note they overlap almost completely, so the
  answer to practical questions is unaffected. For properties: there are indefinitely
  many coextensive-ish classes, but they overlap in the right way, so predication
  works.


