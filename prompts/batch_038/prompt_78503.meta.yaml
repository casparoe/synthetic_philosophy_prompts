  Essay content:


  Title: "Almost One: What the Problem of the Many Can Teach the Problem of Universals"


  §1. The standard one-over-many argument. Two things, a and b, are both red. The
  realist says: there''s something they share, and if nothing were literally identical
  between them, their agreeing in colour would be a brute, inexplicable fact. So there''s
  a universal, redness, wholly present in both. Note the shape: the argument runs
  from "they agree" to "therefore something is numerically one," and it takes the
  alternative to be a shrug.


  §2. Now the problem of the many, from Unger. There''s a cloud over the field. Take
  any aggregate of water droplets in the vicinity that is a decent candidate for being
  the cloud: there are huge numbers of them, differing by a droplet or two at the
  fuzzy edges, none metaphysically privileged. So either there are many clouds where
  we thought one, or none. Again note the shape: from "no candidate is uniquely privileged"
  to "counting goes wrong."


  §3. Claim: these are the same argument, run in opposite directions. Both assume
  that a qualitative specification (being red / being that cloud) must be answerable
  by a counting question (how many things are literally identical here / which one
  aggregate is it). The realist demands a unique answer and, not finding one among
  particulars, posits an entity that supplies it. The problem of the many finds too
  many answers and panics. In both cases the panic is about the number, not about
  the character. And in both cases the character was never in doubt — we know exactly
  what it''s like for something to be red, we can point at the cloud, sort the droplets,
  predict the rain.


  §4. The response I want to import. Lewis''s move on the cloud, as I understand it,
  is not to pick a winner and not to deny the multiplicity: it''s to say there really
  are many candidates, they overlap so almost-completely that for every question you
  actually want answered the choice between them makes no difference, and so we speak
  — correctly, or near enough — as if there were one. Call it "many but almost one."
  So: apply it to properties. There is no one thing wholly present in all and only
  the red things. There is a great overlapping cluster of resemblance relations among
  particulars, with the cluster''s members near-indistinguishable for every purpose
  the concept of a property serves. Which cluster-member you mean by "redness" is
  like which aggregate you mean by "the cloud": underdetermined, and harmlessly so,
  because everything the property is supposed to do is insensitive to the choice.
  That''s not ostrich nominalism, because it doesn''t refuse the question; it answers
  it, and the answer is "the question has many almost-equally-good answers, and that''s
  all it ever needed."


  §5. The pressure point I know about. Armstrong''s real target is laws and causation:
  what makes it a law that Fs are G is supposed to be a relation between the very
  universals F and G, and that''s why a mere regularity over resembling particulars
  won''t do. If "F" is indeterminate among near-identical candidates, then the law
  is indeterminate, and then the counterfactuals and the causal explanations that
  ride on it are too. My reply is that the insensitivity premise does the work: for
  clouds, the choice doesn''t matter because the candidates overlap 99.9% by volume;
  for laws, it doesn''t matter because laws are stated at a level of coarseness where
  all the candidates agree. But I''m not sure that''s right, and I suspect it''s exactly
  where a realist will say: no, the margins are precisely where the empirical content
  lives — a law that says nothing determinate about the borderline case has given
  up the thing that made it worth positing.


  §6. Prediction. If the diagnosis is right, the two debates should have parallel
  pathologies and parallel fixes. Resemblance nominalism''s classic troubles — the
  imperfect community problem, where a set of things can be pairwise resembling without
  sharing a genuine property, and the companion-property problem — should look like
  the problem of the many''s troubles: vagueness at the edges and the arbitrariness
  of any precisification. And the fixes should look alike too. I don''t have this
  worked out at all; it''s a promissory note.


