  Commitments:

  (1) To ask what the meaning of life is, is to ask what life is for; meaning and
  purpose come to the same thing here, and a purpose is always a purpose relative
  to some further end that the activity serves.

  (2) No such further end can be final: for anything offered as the terminus, the
  question "and what is that for?" reopens, so the chain of purposes never closes.
  (Hence, from (1), life as a whole cannot have a meaning of the sort (1) describes.)

  (3) Nevertheless, meaning is available: it is found in the class of activities that
  carry their value in themselves and are pursued for no further end — play, in Schlick''s
  sense, which includes much that looks like work from the outside.

  (4) I do not thereby devalue work: the most meaningful human lives are those in
  which productive, effortful work and play coincide, so that the activity is at once
  a means to a result and enjoyed for itself.

  (5) Whether a life is meaningful is not settled by how it feels to the person living
  it; a life can be meaningful while its subject is unaware of the fact, and can feel
  meaningful while being empty. Meaning is in this sense objective.

  (6) But my working test for locating meaning in an actual life is phenomenological:
  an activity belongs to the meaningful category just in case the person engages in
  it with absorbed, self-forgetful attention, without monitoring it as an instrument.

  (7) Finally, I hold that a life consisting entirely of such activities — however
  rich, however enjoyed — would still be deficient: meaning requires that one''s activities
  make some difference to something beyond themselves, that they contribute to or
  leave a mark on a world that outlasts them.


