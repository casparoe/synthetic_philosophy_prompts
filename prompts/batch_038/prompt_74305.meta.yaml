  classic issue: if a colony realizes a mind, then what about the brain being composed
  of neurons that arguably realize proto-minds? Hofstadter''s own point in GEB: the
  ant is to the colony as the neuron is to the brain — and if you push it, the ants
  would have to lack mentality for the colony to have it (no downward competition),
  which is the "anti-panpsychism" move. But then the ant-colony functionalism has
  to explain why ants don''t have beliefs in their own right, whereas in the human
