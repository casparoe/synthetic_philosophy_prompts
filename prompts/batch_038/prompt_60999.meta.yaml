  Good subtle mistakes:

  1. Conflating Leibniz''s rejection of Hobbesian egoism with the claim that Leibniz
  thinks virtue must be pursued with no regard to one''s own happiness — whereas Leibniz
  thinks our own happiness/perfection follows from disinterested love, indeed that
  pleasure in another''s perfection *is* our happiness. So a disinterested-love-as-sacrifice
  reading is wrong.

  2. Attributing to Leibniz a voluntarist view, or attributing the "eternal truths
  are dependent on God''s will" to Leibniz rather than Descartes.

  3. Conflating moral necessity with logical necessity such that God''s choice of
  the best is metaphysically necessary (Spinozism) — Leibniz''s key point is that
  the best is chosen by a moral necessity that leaves the contrary possible without
  contradiction; also, the claim "the best of all possible worlds" is not a necessary
  truth.

  4. Attributing to Leibniz the claim that we should not try to improve the world
  since it''s already best (quietism/Fatalism) — he explicitly rejects the "lazy reason"
  (ratio segnis / paresseux argument) objection; in the Theodicy he discusses the
  sophism of "lazy reason" (argument paresseux).

  5. Conflating the three degrees of right (jus strictum, aequitas, pietas) — strict
  right = commutative justice with right of war, equity = distributive justice with
  peace, piety = universal justice/charity toward the whole republic of minds under
  God. A student might invert the order or say strict right corresponds to distributive
  justice.

  6. Conflating Leibniz with Wolff or with the later "perfectionism."

  7. Saying Leibniz''s moral theory is grounded in divine command in the sense of
  positive theology rather than in the "idea of the wise man"/God as the wisest being
  whose choice is determined by his understanding of perfection.

  8. Saying Leibniz holds that monads are windowless so moral relations are illusory
  / no real causal interaction, hence no genuine community — whereas Leibniz thinks
  pre-established harmony grounds a real moral order (City of God) and that harmony
