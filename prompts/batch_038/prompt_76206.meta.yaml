  of the literature but a standard of assessment I can apply consistently: I want
  a framework good enough to (i) replace coherence-based and Dutch-book arguments
  as the primary justification of the probabilistic norms, and (ii) be extendable
  beyond single credences to full belief, to imprecise or set-valued doxastic states,
  and to self-locating belief, without the extension changing the verdicts the framework
  already delivers in the simple cases.


  Deliverable: a numbered list of requirements. For each, give what exactly it demands
  (be precise — "must vindicate probabilism" is too crude; say what a vindication
  would have to look like), the case or consideration that motivates it, and whether
  it is non-negotiable given the purpose above or is a preference of a particular
  camp. Where a requirement is negotiable, say what the framework gives up by dropping
  it. Then, and this is the part I most want, identify any subsets of the requirements
