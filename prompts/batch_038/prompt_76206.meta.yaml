  I''m writing the framework chapter of a dissertation on accuracy-first epistemology,
  and before I engage with any particular proposal I want to fix the target: a list
  of requirements that any accuracy-first framework — a theory that treats closeness
  to the truth as the fundamental epistemic value and tries to derive the norms of
