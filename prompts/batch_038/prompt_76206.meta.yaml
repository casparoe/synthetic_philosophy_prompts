  credence to chance only when you have no other evidence — actually admissibility
  is broader than "no other evidence"; (b) claiming PP is a definition of chance —
  it''s a constraint, and Lewis held that the whole role of chance is fixed by the
  PP plus the Humean mosaic; (c) claiming that violating PP leads to a Dutch book
  — Lewis didn''t claim this in the PP paper (Teller''s rule / Lewis''s "chance-credence"
  — actually Lewis said that the PP is what makes chance deserve the name; and Teller
