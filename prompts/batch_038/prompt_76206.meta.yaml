  prejudices or subtly confused:


  Draft items (I''ll present ~9):

  1. Veritism: accuracy (closeness to truth) is the only fundamental epistemic value,
  and the framework must derive all other epistemic norms from it. [Is this a requirement
  or a thesis of one camp? Genuine-ish but contested — e.g., whether "epistemic value"
  should include coherence or evidential fit.]

  2. Non-pragmatism: no argument in the framework may smuggle in practical considerations
  about the agent''s interests/stakes. (Contested: choice of accuracy measure is often
  defended on pragmatic/convention grounds; also "epistemic utility" is itself a species
  of utility, and the dominance reasoning is imported from decision theory — is that
  smuggling?)

  3. Dominance: every incoherent credal state must be accuracy-dominated by a coherent
  one at every world. (Camp: some prefer expected-accuracy arguments; also fails in
  infinite opinion spaces.)

  4. Measure-uniqueness: there must be a single privileged accuracy measure, and results
  shouldn''t be measure-relative. (Camp: Joyce argues results hold for any reasonable
  measure; the "which measure" question is contested; Pettigrew argues for Brier.)

  5. Immodesty: the agent''s own credence function should maximize her expected accuracy,
  judged by her own lights. (Genuine-ish; but "coherent" agents can be immodest under
  any strictly proper measure — so immodesty does little work beyond coherence; also
  immodest measures license conditionalization, so a requirement that immodesty plus
  conditionalization both hold.)

  6. Truth-conduciveness / calibration: the framework must vindicate the intuition
  that credences track frequencies — hmm, this may be a camp thing (frequentist).

  7. Action-guidingness: an agent who accepts the framework should be able to use
  it to decide what credences to adopt — but credences aren''t directly chosen (the
  "doxastic voluntarism" problem), and "ought implies can" is violated by coherence
  for agents who can''t compute. Good genuine requirement / tension.

  8. Extensionality: accuracy of a credal state should depend only on the credences
  it assigns, not on how it''s described / on which logically equivalent propositions
  are represented. (This is one of Pettigrew''s selection constraints; genuine but
  contested — the "coarse-grained vs fine-grained" problem: an agent who represents
  a proposition and its negation separately? Also the requirement conflicts with the
  demand that accuracy respect the agent''s conceptual scheme.)

  9. Compositionality/additivity: the accuracy of a credence in a compound should
  be the sum of accuracies in parts (Pettigrew''s constraint) — this is a strong,
  camp-specific demand; and it''s in tension with holistic requirements like calibration/coherence-as-a-whole.

  10. Non-triviality / the framework must not rule out full belief, or must handle
  the Lottery/Preface? Hmm.

  11. A requirement that the framework explain why accuracy matters — i.e., must not
  leave "why care about accuracy?" as a brute premise. That''s the "swamping"/"veritism
  is a premise" objection; and there''s a tension with non-pragmatism: if you can''t
  give a non-pragmatic reason to care about accuracy, and accuracy is the only epistemic
  value, the framework risks being either question-begging or pragmatic.


