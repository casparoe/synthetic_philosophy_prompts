  Hmm, but there''s a wrinkle: is Pi''s choice really about belief in God''s existence?
  The two stories are about what happened on the lifeboat; the tiger story has no
  direct evidence and is unverifiable. Pi asks: "Which story do you prefer?" and then
  says something like "So it goes with God." That''s the crux. So the wager is about
  which account of an unverifiable past to accept, and Pi generalizes it to God. That''s
  a nice structural parallel to Pascal: belief under evidential insufficiency, with
  a payoff in how one lives. But a crucial disanalogy: Pascal''s payoff is infinite
  (eternal bliss) and hinges on truth; Pi''s payoff is meaning, and it may not depend
  on the truth of the story at all — which is more like a pragmatic justification
  of belief that Pascal explicitly would not accept (Pascal wants truth; the "better
  story" is indifferent to truth). That''s a genuinely sharp critical point: the novel
  looks Pascalian but is actually closer to a fictionalist or Jamesian position, and
  if the payoff doesn''t require truth, the wager loses its structure — you''re not
  betting on a proposition, you''re choosing an aesthetic. A good reading would say
  the film/novel dramatizes something the wager literature misses: the wager as a
  choice among narratives that shapes the self, not a calculation.


