  Quantum suicide package draft:


  The professor (say, teaches philosophy of physics + practical ethics) has been asked
  to submit a short statement of position for a workshop on personal identity and
  the Everett interpretation, and wants an audit before presenting. Their commitments:


  (1) The Everett (many-worlds) interpretation is correct: unitary quantum mechanics
  with no collapse; in a suitable basis, macroscopically distinct branches decohere
  and all of them are equally real.

  (2) There is no fact of the matter, prior to and independent of branching, about
  which future branch "I" will be in; all post-branching successors are me in the
  only sense that matters (Parfitian: identity is not what matters; what matters is
  psychological continuity, which can hold one-many).

  (3) Because of (2), it is irrational to think that a quantum gamble that kills me
  in some branches deprives me of anything in the branches where I live; and correspondingly
  I hold that quantum suicide — repeatedly triggering a device whose outcome is a
  superposition of my death and my continued life — is, from the first-person perspective,
  a way of guaranteeing that I go on living. (Maybe better: I hold that the quantum-suicide
  reasoning is cogent but that I nonetheless would not do it, on grounds I''d like
  examined? That makes it richer.)

  (4) I accept that rational Everettian agents must maximise the branch-weighted expected
  value of outcomes, with weights given by the squared amplitudes (Born rule), and
  that this can be derived from premises about rationality alone without assuming
  any probabilities.

  (5) I deny that branch weight measures how many people (or how many copies of me)
  exist in a branch: it is not a counting measure, and a branch with weight 10^-9
  is just as real, and contains just as many persons, as a branch with weight 0.999.

  (6) I hold that the badness of death consists in the deprivation of the good life
  one would otherwise have had (deprivation account), and that this badness is agent-relative:
  what matters is how much good life I would have.

  (7) I hold that one should not act on remote possibilities of extremely large harm
  if... hmm, maybe not needed.


  Also: (8) I hold that it''s permissible/prudent to accept a gamble that gives me
  a tiny chance of survival in exchange for a huge reward (the "quantum lottery"),
  and I accept a similar reasoning in ordinary cases (e.g., accepting a risky surgery
  with 1% survival because otherwise death is certain).


