  me/matter equally, then the natural prudential principle is to care about each successor
  equally (or to care that at least one survives); but (4) says care in proportion
  to squared amplitude. That is a substantive claim about the *degree* to which each
  successor matters — which is exactly what (5) denies there being any grounding for.
  So (4) requires either a weighting of concern that (5) blocks, or a non-counting
  interpretation of weight that needs its own account. If (5) is right, quantum suicide
