  analogues, cloning. Also the modal counterpart approach (Lewis: you have counterparts
  from other sperm — so "could you have come from a different sperm" is true under
  counterpart theory, deflating origin essentialism). That''s a genuinely interesting
  angle: Lewis''s counterpart theory dissolves origin essentialism.


