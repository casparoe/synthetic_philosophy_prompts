  Draft:


  ---


  Last night my friend Daniel and I spent something like three hours on a question
  that turned out to be at least three questions. It started with Kripke''s remark
  — you know the one — that I could not have come from a different sperm and egg,
  or from a different pair of gametes at all. Daniel, who does developmental genetics,
  said this was obviously false and obviously uninteresting: a sperm is a delivery
  vehicle for a haploid genome, an egg is a nutrient and signalling package, and the
  moment you say which of those parts is supposed to be doing the individuating you
  can produce a counterexample. I said that whatever the biology, it isn''t me in
  the counterexample. By two in the morning we had established that we disagreed about
  (i) which item in the origin is supposed to be essential, (ii) how much slack the
  essentialist claim tolerates before it stops being a claim about the same person,
  and (iii) whether transworld identity is even the right framework for the question.
  We run a reading group together and decided the productive move is to stop arguing
  and to sort the room instead.


  So: acting as a metaphysician who works on modality and the philosophy of biology
  and who has built diagnostic instruments like this before, write me a twelve-question
  sorting quiz — "where do you actually stand on origin?" — for eleven people, mostly
  philosophy graduate students plus two from a genetics department who will notice
  immediately if I have described a laboratory procedure carelessly. Every question
  must be a concrete case with two or three answer options, phrased in the language
  of the case, and no question may ask about labels or use the vocabulary of essence,
  necessity, or possible worlds...


