  ---


  our reading group is working through "heuristic arguments" — the kind where you
  get a number or a qualitative prediction without a proof, by treating parts of a
  problem as roughly independent and multiplying the pieces together. half the group
  thinks these can be given real mathematical footing; the other half thinks they''re
  irreducibly a matter of judgment. we''ve ended up stuck on one step, which i''ve
  started calling the presumption of independence: you have estimate A and estimate
  B, you say their errors don''t line up, so you combine them — but you can''t prove
  the errors don''t line up, and usually you haven''t even looked. My own gloss on
  what people actually do is a mechanism-naming rule: you''re entitled to assume no
  coupling until somebody can point to a specific mechanism that would produce one,
  and then you correct for exactly that mechanism and nothing else. Whether that rule
  is a deep fact about the world or just a cheap trick that usually works is the fight.


  The test case i brought last week was the twin prime heuristic. Naively: a random
  integer near n is prime with probability about 1/ln n, so a pair (n, n+2) should
  be twin with probability about 1/(ln n)², and summing gives about x/(ln x)² pairs
  below x. That''s obviously wrong as stated — it doesn''t know about parity, and
  it doesn''t know that n ≡ 1 mod 3 forces n+2 ≡ 0 mod 3. The fix everyone cites is
  the Hardy–Littlewood constant, the product over odd primes p of (1 − 1/(p−1)²),
  roughly 0.66, with the count coming out as 2·C₂·x/(ln x)². The interesting question
  for us is what that correction proves. The formalizer in the group says: see, there
  was a real probability space all along (uniform on 1..N, N→∞), the events were genuinely
  dependent, we conditioned on the residue classes and got an exact answer — that''s
  what a heuristic argument looks like when it succeeds, and independence was never
  presumed, it was computed. The other camp says: no, that''s backwards. Nobody derived
  the correction from a space. Somebody assumed independence, noticed the estimate
  was off, went looking for a named mechanism, found "divisibility by small primes,"
  and patched only that. The space is a post-hoc rationalization; the actual epistemic
  work was done by the presumption plus the search for mechanisms.


  Two wrinkles I want in the dialogue because they''re what broke our session. First:
  there is no uniform distribution on the integers, so the formalizer''s space has
  to be natural density, and natural density isn''t countably additive and isn''t
  even defined for all sets — there are perfectly describable sets with no density
  at all, e.g. numbers whose binary expansion has an odd number of digits, or numbers
  whose decimal expansion starts with 1. So "the space was there all along" is doing
  more work than advertised. Second: the parity barrier. Sieve methods provably can''t
  tell apart numbers with an even number of prime factors from numbers with an odd
  number, which is exactly why the twin prime conjecture is still open despite the
  heuristic being universally trusted. That''s a case where we KNOW there''s a coupling
  we can''t name-and-correct, so the mechanism-naming rule doesn''t just fail to be
  justified, it fails visibly — and yet people still trust the prediction. ...


