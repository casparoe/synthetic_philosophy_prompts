  Thesis sketch:


  1. Standard readings treat Lakatos''s hard core as a set of propositions held immune
  from falsification by convention, with the negative heuristic as the (derivative)
  instruction not to direct the modus tollens at the core. I want to reverse the order:
  the primary notion is the negative heuristic, and it is not about belief-immunity
  at all but about *data admissibility* — it is a standing rule, maintained by the
  programme, governing which reported results count as candidate evidence against
  the core in the first place. Hard cores are then just the sediment of many such
  rules.


  2. Corollary: the progressive/degenerating distinction should be redefined. Not
  "does the shift predict novel facts," but "does the belt-revision widen or narrow
  the set of admissible data?" A shift that absorbs an anomaly by *reclassifying the
  anomalous result* — as an artifact, a contaminated measurement, a badly specified
  task, a not-really-replicable finding, a mis-specified model of the domain — narrows
  the admissible set; a shift that absorbs it by *admitting new kinds of result into
  the space of things the programme must answer to* widens it.


  3. This makes the distinction prospectively assessable — no need to wait decades.
  Narrowing and widening are visible in the contemporaneous record: in referees''
  and practitioners'' arguments about what counts as a legitimate experiment.


