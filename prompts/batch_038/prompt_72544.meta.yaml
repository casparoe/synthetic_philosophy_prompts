  ---


  I write a fortnightly column on the science of reasoning for a general-interest
  magazine, and for an upcoming issue on uncertainty I''m commissioning an imagined
  symposium — a two-hander dialogue — to run alongside my reported piece. I need you
  to write it.


  The setting is my own, so please take it as given rather than improving on it. A
  lab has invited me to watch a variant of the Ellsberg urn task. In every version
  there is a Known Urn — ninety balls, thirty red, thirty black, thirty green — and
  an Unknown Urn of ninety balls whose composition the subject is not told. In each
  version the subject is offered the same pair of bets: one pays if a red ball is
  drawn from the Known Urn, the other pays the same amount if a red ball is drawn
  from the Unknown Urn. What differs is the story the subject is told about how the
  Unknown Urn was filled:


  Version A: the composition was set by a mechanical spinner, which the subject watched
  select, uniformly, among all compositions expressible in multiples of ten balls;
  the result was printed on a card and sealed in an opaque envelope on the table.

  Version B: the composition was chosen by an earlier, anonymous participant in the
  study, who was told only to pick any split they liked; their choice was sealed in
  an envelope.

  Version C: the composition was chosen by the experimenters, who state that it is
  not all one colour and that they had no reason to favour any particular split; it
  is likewise sealed.


  In all three versions, the subject is additionally offered the chance to pay to
  open the envelope before choosing — the envelope reveals the composition but does
  not change the bet, the urn, or the payoff.


  The dialogue: two decision theorists, both fully competent, argue over what the
  three versions show. One maintains that ambiguity aversion tracks a genuine and
  normatively significant difference in the subject''s epistemic situation, and that
  a single precise probability is sometimes simply not available to be had. The other
  maintains that every appearance of a distinct "ambiguity" attitude dissolves on
  inspection: it is either a failure to complete an elementary inference, or ordinary
  Bayesian reasoning about a chooser whose incentives are only incompletely described,
  or a confusion between the physical chances and the way the problem has been written
  down.


  Requirements:

  - Roughly 1,000–1,300 words, in alternating turns of substantial length.

  - All three versions must be argued over, and the two characters must disagree about
  whether the pattern of responses that a theory would license across A, B, and C
  is coherent. In particular, make them confront the question of whether Version A
  really does collapse into a known one-in-three chance of red, and what follows if
  subjects nevertheless treat it as they treat B and C.

  - At least one exchange should turn on the envelope: what the two theories predict
  a rational subject would pay to open it, and whether a positive price for information
  that cannot change the decision is a mark of incoherence or of something else.

  - One character should press the dynamic-consistency worry — that ambiguity-averse
  rules can be exploited over a sequence of decisions — and the other should answer
  it without confusing the sequential case with the static one. Do not let the answer
  rest on the claim that the static choices are themselves pumpable; check that claim
  before using it.

  - Neither side may be a strawman. Both should be allowed their best arguments, and
  both should land at least one hit that the other cannot fully parry. No character
  should capitulate; the dialogue should end with each stating, in one or two sentences,
  the single observation that would most change their mind.

  - Write in a register a magazine reader can follow, but do not sand off the technical
  content: it is fine, and wanted, for the characters to speak of compound lotteries,
  sets of priors, dominance, and the sure-thing principle.

  - No citations, no reference list, no recommended reading. If you name a real argument
  or a real researcher, do so only where the name does the work; no publication years,
  no page numbers, no bibliography.

  - Give the two speakers plain labels (for example, A and B, or two invented names)
  and a one-line description of each before the dialogue begins.


