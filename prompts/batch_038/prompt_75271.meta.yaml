  Setting: An upper-level political philosophy seminar, or a grad/undergrad seminar
  on democratic theory. ~18 students, one 75-minute session (or 90). The idea to be
  felt: Weil''s claim that party membership is structurally incompatible with thinking
  — that the party''s growth imperative and collective pressure on thought isn''t
  a matter of bad incentives you can fix with better rules, but of the form of organization
  itself. Participants should run into it themselves before it''s named.


  Design idea: a "drafting committee" simulation with two rounds and a hidden payoff
  structure.


  Round 1: Students are sorted into three caucuses ("blocs") each with a written platform
  containing 5 policy positions, some of which conflict with each other. Each student
  gets a secret personal "conviction card" — a position they''re told is the just
  one — which contradicts at least one item of their bloc platform. The bloc must
  produce a single joint statement on a new issue (say, a rule for allocating scarce
  something — housing, or a constitutional provision on emergency powers). Points:
  bloc gets points proportional to how many of its members'' public votes match the
  bloc line AND the bloc''s "membership" grows if it recruits defectors from other
  blocs (recruitment mechanic: a student who votes the bloc line and persuades someone
  else to switch gets the bloc +2). Also individual points for being elected "delegate"
  to a final negotiating table.


  Key mechanic to make them feel Weil''s point: the growth/recruitment incentive is
  what distorts the joint statement — not the vote itself. E.g., the bloc must decide
  whether to include a clause that is true but would alienate potential recruits,
  and the incentive is to drop it or to soften it. So the statement that comes out
  is not the statement that any member thinks is right; and each member, having voted
  for it, must then defend it to outsiders — and the defense requires asserting things
  they know aren''t true. That reproduces Weil''s "contraint au mensonge."


  Round 2: Same issue, but now no blocs — students deliberate as independents, each
  with their conviction card, and must produce a single text by some rule (e.g., successive
  amendments, majority vote). Points for coherence and for each student being able
  to state the reason for their final vote. Then compare the two texts.


  Then the debrief: map the mechanics onto Weil''s three definitions (machine for
  manufacturing collective passion; organization exerting collective pressure on the
  thought of each member; growth as the only end), and onto her positive proposal
  (candidates as individuals; "revues" as milieus of affinity rather than adherence).
  Ask participants when they stopped asking "is this true?" and started asking "is
  this good for us?" — get timestamps.


  Then the honest note: what the activity cannot reproduce. The game reproduces the
  incentive structure and the compliance; but Weil''s claim is not that parties make
  lying payoff-maximizing — it''s that party spirit destroys the capacity for attention
  and that the pressure is on thought itself, i.e., the member doesn''t merely say
  what''s useful, they come to believe it, and cannot even formulate the contrary
  thought. A points game with a self-interested actor can be fully cynical — the student
  who complies while inwardly dissenting is a counterexample to Weil that the game
  rewards, and the game cannot make them feel the erosion from inside. Also: the game''s
  rounds are minutes, Weil''s are years of habituation; the game''s "collective passion"
  is at most mild competitive excitement, not the affective possession Weil describes;
  and the game''s independents in round 2 are still the same students with the same
  opinions, so it doesn''t reproduce Weil''s worry that without a party you lose the
  collective thinking that nourishes individual thought — she insists thought needs
  a milieu, and her revue proposal is precisely to keep the milieu without the adherence.
  The facilitator must supply: the distinction between outward conformity and inward
  corruption; the fact that Weil thinks even the honest member is compromised; the
  transition problem (she acknowledges the measure isn''t immediately applicable,
  and asks for a "trial" period).


  Predictable failure modes: (1) students immediately game the recruitment rule and
  the "feeling" becomes a strategy lesson about Duverger-ish aggregation rather than
  about thought; (2) the round-2 independents converge quickly on the same text as
  round 1 because opinions didn''t actually change, killing the contrast; (3) the
  secret conviction cards get revealed and the deliberation collapses into "just say
  what you think"; (4) the most vocal student dominates both rounds so the difference
  measured is dominance, not structure; (5) someone says "we''ll just lie in round
  1 and think clearly in round 2" — which is the exact objection that must be turned
  into the debrief''s centerpiece; (6) time overruns — the drafting takes longer than
  expected.


  Also ask: give me the materials list (cards, timers, no real money), the exact scoring,
  the facilitator script lines at key moments, timing per phase, and a fallback version
  for a class of 8 or a class of 40.


