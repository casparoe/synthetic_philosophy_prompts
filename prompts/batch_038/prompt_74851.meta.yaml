  Move 1 (Eli): A and A⁺ are exactly equally good. Both total to infinity; ℵ₀ + 1
  = ℵ₀. Generalizing: if the future contains infinitely many people, no finite change
  to it — saving a thousand lives, curing a disease that would otherwise afflict a
  million — alters the value of the world at all. So on the aggregative picture, if
