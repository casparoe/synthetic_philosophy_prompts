  Also: "nighly of the same bigness" — ambiguous: does bigness mean linear dimension
  or volume? Ask the model to consider both readings and whether it matters for the
  thought experiment''s design (e.g., a sphere and cube of equal linear extent project
  very different visual outlines; a sphere of equal volume to a cube projects a smaller
