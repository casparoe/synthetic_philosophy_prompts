  3. Terminological drift: the letter says Globe and Cube; the 1694 version says Cube
  and Sphere in the setup but "which is the Globe, which the Cube" in the quaere.
  Ask whether this slip matters — does "globe" vs "sphere" carry a difference (a physical
  ball vs. a geometrical solid)? Is Molyneux''s problem about a geometrical object
  or a manipulable artifact? Note the letter adds "Committed into his Hands" and "taken
  from Him, and Laid on a Table" — the 1694 version adds "of the same metal" and "placed
  on a Table". Ask what these physical details contribute: are they decoration, or
  do they carry argumentative weight (e.g., uniform colour, uniform texture, elimination
  of weight/temperature cues, elimination of prior visual familiarity)?


