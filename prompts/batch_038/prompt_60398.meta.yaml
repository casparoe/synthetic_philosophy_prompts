  4. The "before he touch them" / "before he stretch''d out his Hand" clause: what
  is the epistemic significance of the prohibition on touching? Is it a stipulation
  about the timing of the judgment, or a stipulation that rules out the very process
  (exploratory movement) that could generate the answer? Ask whether the question
  is well-posed given that the man has no prior experience of seeing anything at all
  — i.e., is "know which is the Globe" even a coherent demand on someone with no visual
  concepts? This links to the distinction between being able to visually discriminate
  (a two-alternative forced choice, which could succeed at chance-plus rates by luck)
  and being able to identify/name. Note that with only two objects on the table, a
  50% guessing baseline means the test as described cannot distinguish discrimination-without-knowledge
  from knowledge — inject this as the asker''s concern: does the letter''s two-object
  setup smuggle in a signal-detection problem? That''s a nice niche-ish injection
  that requires reasoning, not recall.


  5. Molyneux''s own answer "Not..." — parse it. Ask: is the argument an instance
  of a general principle (no cross-modal transfer without prior experience of correlation),
  or a specific claim about angles? Note "a protuberant angle in the Cube, that pressed
  his hand unequally, shall appear to his eye, as it does in the Cube" — the final
  clause is notoriously obscure: "shall appear to his eye, as it does in the Cube"
  — appear as it does *in* the Cube? Ask for a paraphrase and for what "as it does
  in the Cube" could mean (does "it" refer to the angle or to the manner of affecting?).
  And note the odd comma in "the experience of, how a Globe, how a Cube affects his
  touch". Ask whether Molyneux''s "Not" is an empirical prediction or a conceptual
  claim — and whether the answer is even a candidate for being settled by experiment,
  given the "before he touch them" clause.


  6. The framing/address: the letter is addressed not to Locke by name but to "the
  Author of the Essai Philosophique concernant L''Entendement" — the title of the
  French extract of Locke''s Essay published in Le Clerc''s Bibliothèque Universelle.
  Ask what this tells us about the intended audience and about whether Molyneux is
