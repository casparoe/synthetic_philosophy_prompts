  default. Fine — that''s an observation with a story attached. But the same piece,
  three paragraphs later, predicts that this cohort will be poor delegators as managers,
  since delegation requires unstructured real-time contact. Nothing about managing
  has been observed. The warrant for the prediction appears to be entirely inherited
  from the phone thing.


