  Answer:


  (a) Being an epistemic peer isn''t a matter of having the same CV. Dana and Ravi
  have the same training and the same record, but what matters, as Elga puts it, is
  whether they are equally likely to be right about the particular question in front
  of them. Credentials are necessary but nowhere near sufficient: a retired professor
  of bioethics and a bright fourth-year are not peers on this question even if the
  fourth-year is being perfectly rational, and two people with identical credentials
  might still not be peers if one of them has a blind spot about religious patients,
  say. The conciliationist''s argument for thinking Dana''s revision is required rather
  than permitted is that she has no way of showing that she is the one who got it
  right without begging the question. Any reason she could offer for preferring her
  own assessment — that she saw the case more clearly, that Ravi has overlooked what
  minimal consciousness actually involves — is precisely what is at issue between
  them. So from inside her own point of view the two judgments have to be given equal
  weight, and equal weight means she cannot keep her original judgment as the settled
  answer. She has to drop to about even odds that withdrawing support is permissible,
  i.e. she should suspend judgment on the question and treat it as open. That also
  shows why peerhood is a fragile thing. The moment the disagreement is on the table,
  one of them is wrong, and you cannot be equally likely to be right as somebody who
  is wrong. So strictly speaking Dana and Ravi are peers only up to the point where
  the disagreement is revealed, and everything the conciliationist says has to be
  about that moment, since after it there is no peerhood left to reason from.


  (b) The strongest argument for steadfastness is that disagreement is evidence about
  a question only indirectly. What settles whether withdrawing support is permissible
  is the first-order evidence: the patient''s condition, what she would have wanted,
  what minimal consciousness amounts to. Ravi''s contrary judgment is a sign that
  Dana might have misread that evidence, but a sign is only as good as the reason
  to think the sign is misleading, and Dana''s only reason for thinking Ravi misread
  the evidence is her reading of the evidence, which is where she started. So the
  disagreement gives her no new reason to move; it just re-presents the old one from
  the other side. This is basically the total evidence view — Kelly''s version of
  the position is really the steadfast view with an extra step, since on it the fact
  of disagreement contributes nothing that wasn''t already in Dana''s possession.


  The awkward case for the steadfast view is the paddock. Two people count the same
  horses in decent light, one says twelve, one says thirteen, and neither has any
  reason to distrust their counting. Intuitively they can''t both rationally stick
  to their guns, and steadfastness seems to license exactly that. The steadfast view
  can say something here, though: the evidence about the horses is decisive, or nearly
  so, in a way that evidence about the permissibility of withdrawal is not, and where
  the evidence is decisive there is no real peer disagreement to respond to, because
  the same point as before applies — once they''ve compared notes, one of them has
  got it wrong and neither can know which, so each is entitled to go on trusting their
  own count. Whether that''s satisfying depends on whether you think the horse case
  is really different in kind from the ethics case or just easier.


  (c) The self-undermining objection is that conciliationism can''t be applied to
  itself without disappearing. There are very good philosophers on both sides of the
  question about how to respond to disagreement — Kelly on one side, Elga and Christensen
  on the other — and each camp thinks the other is mistaken about the meta-question
  too. If conciliationism is true, then when Elga learns that Kelly rejects conciliationism,
  he has to stop believing conciliationism, since Kelly is his peer about that question
  as well. But then he no longer has the principle that told him to stop, and the
  same goes for anyone who accepted it. So the view defeats itself: it is true only
  if nobody should believe it. I think this is decisive and I don''t see how the conciliationist
  answers it.


