  The slogan "risk aversion is just concavity of the utility function" — readings:

  (a) Definitional/trivial: an EU maximizer is risk-averse w.r.t. a lottery iff E[u(X)]
  ≤ u(E[X]) iff u concave (Jensen). Trivially true within EU.

  (b) Substantive but limited: any observed risk-averse behavior over money gambles
  can be captured by concave utility *of money* — true only if we treat u as a free
  parameter to fit, but then it''s empty; and Rabin''s calibration shows it can''t
  fit both small- and large-stakes behavior simultaneously with a single globally
  concave u over wealth.

  (c) The explanatory claim: concavity of utility explains *why* people are risk-averse
  (diminishing marginal utility) — Bernoulli''s story. This is substantive and largely
  falsified by Rabin''s theorem for small stakes.

  (d) The dismissive claim: since concavity does all the work, there is no separate
  "attitude to risk" parameter in rational choice; theories that add a probability-weighting
  function are redundant — false, because risk attitudes in the sense of weighting
  probabilities (Allais-type, rank-dependent) are not reducible to concavity; you
  can have concave u and still violate independence, and vice versa: a linear u with
  a convex ρ yields risk-averse behavior that EU-with-concave-u cannot mimic in all
  cases.

  (e) The claim that "risk aversion is about utility of outcomes, not about risk per
  se" — so-called "risk aversion is a misnomer; it should be called ''wealth-aversion-to-spread''".

  (f) There''s also the distinction between utility defined over final wealth vs.
  changes from a reference point (Kahneman-Tversky prospect theory) — concavity alone
  can''t capture loss aversion (kink at reference point).

  (g) Local vs global: Pratt-Arrow measure of absolute risk aversion -u''''/u'' —
  a measure of "degree" of concavity normalized; risk aversion is not invariant to
  affine transformations of u... Actually Pratt''s measure is invariant to positive
  affine transformations. And relative vs absolute risk aversion, decreasing absolute
  risk aversion (DARA) as an empirical regularity — people don''t scale bets proportionally
  with wealth; constant relative risk aversion (CRRA) implies proportional scaling,
  which is empirically false-ish.


