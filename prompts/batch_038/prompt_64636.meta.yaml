  Setting: third-year philosophy student taking a course on knowledge and scepticism.
  Their seminar has been stuck for weeks on: does knowledge close under known implication?
  Positions described:

  - Group A (closure deniers, following Dretske/Nozick): you know you have hands,
  you don''t know you''re not a handless BIV, so closure is false; they insist on
  "abominable conjunction" being fine.

  - Group B (closure defenders, e.g. Williamson/Hawthorne-ish): closure is a constraint
  on the concept of knowledge, and if sensitivity implies the abominable conjunction,
  then sensitivity is refuted (reductio); knowledge requires safety, not sensitivity.

  - Group C (contextualists, DeRose/Lewis-ish): both are right in their own contexts;
  "knows" shifts.

  - Group D (the student''s own pet idea? or another): the disagreement is really
  about which *method* to hold fixed — i.e., method-relative sensitivity.


