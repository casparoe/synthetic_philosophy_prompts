  we read on the meaning of life holds that meaning is not to be had from an afterlife
  or from any purpose imposed on life from outside, but from within life itself; that
  work belongs to the domain of necessity and is valuable only instrumentally, whereas
  play is pursued for its own sake and is therefore where value proper resides; that
  youth is the natural home of play, and that maturity typically sells it off to labour;
  and that what makes a life worth living is the intensity of joy in the moment rather
  than its duration, so that endless life would be no gain and might be a bore.


  Two cases I want you to run him through. First: a professional esports player —
  twenty-two, contracted to an organisation, practising nine hours a day under coaches
  and performance analytics, playing a game he chose as a child, with a career that
  will end before he is thirty. Schlick''s own criteria seem to make this the most
  meaningful life available to a modern person, and yet every feature that makes it
  a profession looks like the conversion of play into work that he thinks destroys
  meaning. Where does he actually land, and what has he to revise or reinterpret to
  land there? Second: suppose he were shown a fully immersive virtual world, commercially
  run, engineered to keep its residents in continuously enjoyable play for decades,
  together with a treatment that holds off ageing. Given the hedonism and the hostility
  to immortality, would he endorse it, reject it, or endorse it with a distinction
  I haven''t thought of?


  Commit to an answer in both cases — a definite verdict with reasons, not a weighing
  of possibilities — and say explicitly where your prediction rests on a contested
  reading of Schlick rather than on a commitment he plainly held."


