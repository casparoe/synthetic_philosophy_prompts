  Let me construct 6 commitments with 2 genuine tensions + 1-2 apparent ones:


  (1) The two-kinds distinction: reasons for pro-attitudes split into those bearing
  on the object''s features (right kind) and those bearing on the desirability of
  being in the state (wrong kind); only the right kind are reasons for the attitude
  in the strict sense, wrong kind reasons are at most reasons to want to want.

  (2) I accept the buck-passing account of value: goodness is being such that there
  are reasons to respond favorably.

  (3) Demon case: the demon''s threat is a genuine consideration — a real reason,
  not a pseudo-reason — but it''s not a reason to desire the saucer of mud; so BPA
  doesn''t say the mud is good. I feel fine about this.

  (4) I explain the right/wrong kind split by the standards of correctness: each attitude
  answers a question, and a reason is of the right kind iff it bears on that question.
  Belief answers "is it true?"; desire answers "is it good?"; admiration answers "is
  it admirable?"

  (5) For belief, there are no wrong-kind reasons at all, because you simply can''t
  believe on practical grounds — belief formation isn''t the kind of thing that responds
  to them. So the wrong-kind problem doesn''t arise for belief.

  (6) I hold a fairly demanding view of what reasons are: for something to be a reason
  for an agent, it has to be capable of being what the agent is moved by — it has
  to be able to show up in deliberation and guide them. Reasons that can''t be deliberated
  from aren''t reasons for that agent.


  Genuine tension A: (6) × (3)/(5). If reasons must be capable of figuring in deliberation
  and guiding the agent, then in the demon case: the threat *can* be deliberated from
  — you can decide to bring it about that you desire the mud, and people do act on
  such considerations. Whereas (5) says the reason belief can''t be had for practical
  reasons is precisely that deliberation can''t respond to them — i.e., (5) *uses*
  (6) as its explanation. But then (6) applied uniformly says: in the desire case,
  since you can deliberate toward acquiring the desire, the demon''s threat is a reason
  for the desire; in the belief case, since you can''t, there are no practical reasons
  for belief. That gives the opposite of (3) for desire and it makes (4)''s standards-of-correctness
  story idle — the work is done entirely by the psychology of what you can deliberate
  from. So (4) and (6) are competing explanations, and the case that shows this is
  exactly the one the asker feels good about. That''s a strong, non-obvious tension:
  it''s not "these two sentences contradict," it''s "your preferred explanation of
  (5) is one that, if applied uniformly, wrecks (3)."


  Also: (4) says desire answers "is it good?" — but the wrong-kind reason for desiring
  the saucer of mud is a consideration bearing on "would it be good to want this?"
  which is arguably also a goodness question, and the standards-of-correctness account
  then needs a distinction between first-order and second-order questions, which is
  basically re-stating the distinction it was meant to explain. So (4) risks being
  non-explanatory/circular — and (2)''s buck-passing makes it worse: if goodness is
  analyzed in terms of reasons to favor, and right-kind reasons are defined by bearing
  on the goodness question, you have reasons analyzed by goodness and goodness analyzed
  by reasons. That''s tension B: (2)+(4) circularity. And it''s non-obvious because
  BPA defenders usually think the demon case is handled, and standards-of-correctness
  people think they''ve explained the distinction; combining them is a trap. Good.


