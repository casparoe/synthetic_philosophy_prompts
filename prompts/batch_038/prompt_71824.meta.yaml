  and prizes. Two quite different reasons produce these names. Some honorees are celebrated
  for what they did or wrote; others are simply donors who bought the naming right,
  and no one supposes the donor''s character is admirable or imitable. Once the name
  is on the facade, the institution carries it for decades or centuries and treats
  it as doing something: not merely recording a fact about the past, but standing
  as a present statement by the institution.


  Then a second, quite recent practice has grown up around the first. When research
  or journalism brings to light serious defects in an honoree''s character — racism,
  cruelty, corruption, sexual predation, often conduct that was legal and widespread
  in its own time — the institution is widely thought to be obliged to remove the
  name, and it usually does, after a public process. Removal is treated as the appropriate
  response, and as something more than cosmetic, even when the honoree has been dead
