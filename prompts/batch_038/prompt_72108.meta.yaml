  Draft:


  "I am a fourth-year undergraduate in a decision theory seminar, and for our final
  session each of us has to lead a fifteen-minute exercise on Hofstadter''s superrationality.
  The reading is universally familiar to us — the prisoner''s dilemma argument that
  two agents who know they reason alike will cooperate, since a symmetric problem
  forces a symmetric answer — and my classmates recite it perfectly. What they cannot
  do is tell you which view they would abandon if the symmetry were weakened. So I
  want to build a diagnostic decision tree that sorts people by where their superrationalist
  commitments actually break, not by which camp they announce.


  Here is the frame I want the tree to work inside. Start node: ''Suppose you accept
  that in the standard two-player prisoner''s dilemma, two agents who each know the
  other is reasoning about the game in the same way they are, and who know this in
  common, should cooperate.'' Then, roughly ten to twelve questions, each of which
  is a concrete case on which the candidate positions come apart, phrased so that
  someone can answer it without knowing which leaf their answer leads to. Every branch
  label should state the claim that splits it — for instance, whether the correlation
  between my choice and my counterpart''s is something I must regard as evidential
  only, whether it survives my discovering the counterpart runs the same algorithm
  on different hardware, whether the argument needs identity of payoff matrices or
  only identity of reasoning, whether it needs certainty or merely high probability.


  To make sure the tree is doing real work, please route each of the following cases
  I have invented, and say explicitly at which node each one turns:

  1. Split seed. ...

  2. Asymmetric mirror...

  3. Glass skull...

  4. Oracle and coin...

  5. Self-edit...

  6. ...


  Leaves should carry the name of the position (''unnamed'' if no one defends it)
  plus one sentence stating its most awkward commitment. I want at least these to
  be locatable: Hofstadter-style superrationality as such; the view that the correlation
  is merely evidential and cooperation follows from that; the view that the correlation
  is irrelevant because you must evaluate acts by what they cause; team/collective
  reasoning views where the agents deliberate as a ''we''; Kantian/universalizability
  accounts that get cooperation without any correlation at all; and the modern logical-
  or functional-decision-theory descendants.


  Then two further things. First, mark every pair of leaves your tree cannot in fact
  separate — where two positions give the same answers to all of my questions — and
  say what extra question, if any, would split them. Second, list at least three combinations
  of answers that are logically available but that no leaf occupies, and for each
  say whether the gap is there because the view is incoherent, because it is unattractive,
  or because nobody has thought about it. My hunch is that there is a large unoccupied
  region around agents who are certain of one another''s reasoning process but doubt
  the payoff matrices are common knowledge, and I want the tree to tell me whether
  that hunch is right or confused.


  Please don''t give me any references or suggested reading; the handout is for a
  room of people who have all done the reading already. What I need is the instrument
  itself: nodes, branch labels, cases, leaves, and the gaps."


  Now let me flesh out the invented cases carefully so they''re genuinely diagnostic.


  Case 1 — Split seed: Your counterpart is a perfect duplicate of your reasoning procedure,
  but every stochastic element (any coin you use, any tie-break) is re-rolled independently
  for them. Do you still cooperate? (Tests: does superrationality require identity
  of *outputs*, including random ones, or only identity of deterministic reasoning?
  Hofstadter himself considers probabilistic strategies — superrational players can
  mix. Actually, Wikipedia mentions "In the prisoner''s dilemma, it is superrational
  to cooperate with probability 1 even when [truncated]" — there''s a discussion of
  mixed strategies. Fine, I won''t reference that.)


  Case 2 — Asymmetric mirror: Same reasoning process, but the roles differ: if I cooperate
  I pay 3 and they gain 10; if they cooperate they pay 3 and I gain 10. So the game
  isn''t symmetric in payoffs even though the agents are symmetric in reasoning. Tests:
  does superrationality require payoff symmetry, and what does it say when the agents
  are identical but the game isn''t?


  Case 3 — Glass skull: You have read your counterpart''s full source code and can
  verify it implements your own reasoning exactly; they have read only a two-paragraph
  summary of yours, which is accurate but incomplete. Does your extra knowledge change
  what you should do, and does their ignorance change it? Tests: does the correlation
  require common knowledge, mutual knowledge, or mere fact of sameness?


  Case 4 — Oracle and coin: Your counterpart is not a reasoner at all. It is a machine
  that plays whatever a highly accurate predictor of you predicts you will play, but
  the machine performs no deliberation, has no payoff, and could be replaced by a
  coin. Tests: whether the "same reasoning" requirement does any work, or whether
  mere predictive correlation suffices (this separates superrationality from EDT and
  from one-boxing).


  Case 5 — Self-edit: Before the game you are offered a pill that will delete one
  clause from your reasoning; you are certain that after taking it you will defect,
  and you are certain your counterpart has already taken the same pill. Do you take
  it? Tests: precommitment/self-modification, and whether superrationality evaluates
  at the level of the reasoning process or the act.


  Case 6 — Stranger in the mirror: Your counterpart reasons identically to you but
  is entirely indifferent to your payoffs and knows it, and both of you know the other
  knows. Does the cooperation conclusion depend on shared interest or only on shared
  reasoning? Hmm, this may overlap with the symmetric case. Alternatively:


  Case 6 — Population: There are a thousand agents, 999 of whom reason as you do and
  one of whom reasons differently but is known to defect. What do you do? Tests: how
  much similarity-in-population is needed, degree-of-belief question. Hofstadter himself
  notes the probabilistic mixture issue — if you think 90% of the others are superrational,
  you compute expected value. Good.


  Maybe also Case 7 — Two-room: You and your counterpart are in the same room and
  can see each other, and both know the other is superrational, but you''re allowed
  to talk. Does communication break or strengthen the correlation? Tests: whether
  the correlation is a substitute for communication (superrationality is supposed
  to work without communication; with communication it''s just a cooperative agreement
  with an enforcement problem). Might be a nice one.


