  Draft argument (the student''s, which seems to prove too much):


  Setup: The student is in a philosophy PhD program, took a seminar on the ethics
  of space settlement, and built this argument to argue *for* an obligation to expand
  into space, but the conclusion has consequences they can''t accept, and now they
  suspect a flaw.


  Premises:

  1. If an act would bring it about that some person exists whose life is worth living,
  and who would not otherwise have existed, then that act makes the world better.
  [This is the "impersonal betterness" of creating happy people — the Total View premise.]

  2. A life worth living is worth living wherever it is lived, including in a dome
  on Mars or a rotating habitat; there''s nothing about Earth that makes a life there
  better than an equivalent life elsewhere.

  3. The number of lives worth living that could be supported off Earth, over the
  lifetime of the universe, is astronomically larger than the number that can ever
  be supported on Earth — by many orders of magnitude.

  4. Betterness adds up: a world with more lives worth living, all else equal, is
  better than one with fewer.

  5. So colonizing space would make the world vastly better than not colonizing, by
  a margin that grows without bound as you extend the time horizon.

  6. Nothing we can do on Earth — saving the biosphere, preventing climate catastrophe,
  even preventing human extinction this century — comes anywhere near that margin.

  7. If we can, at comparable cost, bring about a vastly better world, we ought to.

  8. Therefore we ought to devote our resources to space colonization, and Earth-bound
  projects are, at best, instrumentally justified as steps toward it — and if the
  choice ever arises between preserving Earth''s biosphere and launching the first
  self-sustaining colony, the colony wins.


  Then the student notes: (a) this implies that the loss of Earth''s entire biosphere
  is a rounding error, which they find repugnant; (b) by (4) it also implies the repugnant
  conclusion for Earth: a world of trillions of barely-worthwhile lives in arcologies
  is better than our world, and it implies that we should convert everything — including
  the oceans and the last wildernesses — into maximally efficient life-support, so
  the "pro-colonization" conclusion turns into an anti-nature conclusion that also
  condemns ordinary life on Earth; (c) also, wait: (1) and (4) together seem to say
  we should have as many children as possible, which the student doesn''t believe.
  So they suspect a flaw between (1) and (5), or that (6)/(7) are doing sneaky work.
  They say: "I''d rather keep 2 and 3 — those seem like empirical/scientific claims
  I don''t want to touch — and I''m attached to 8''s first clause (we ought to colonize)
  but not its second (biosphere loses)."


  Where does it go wrong? Candidate diagnoses:

  - (1) is contested by person-affecting views and by the "no subject" point: a life
  worth living isn''t better *for* anyone who would otherwise not exist, so "makes
  the world better" is doing impersonal work that (1) hasn''t earned. But even granting
  (1), there''s a slide between (1) as stated (an act makes the world better) and
  the comparative "vastly better" in (5) — you need aggregation across disjoint populations
  and comparability of worlds with different populations, which is exactly what''s
  controversial.

  - (5)→(6): the "margin" comparison assumes the astronomically many future lives
  are *available* both in the colonization world and not, i.e., it compares "colonize"
  to "stay on Earth," but if you stay on Earth, Earth-originating life could still
  spread later — the counterfactual isn''t "no future lives" but "fewer/earlier."
  That''s a subtle and good flaw: the baseline is wrong. Actually, the argument''s
  real work depends on the *disvalue of delay*, not on the total number, because almost
  all of the astronomical value is available in both branches (differing only by,
  say, a few centuries of delay and by extinction risk). This is a genuinely interesting
  diagnosis: (6) is a non sequitur unless you assume delay costs everything, and the
  correct move is that the case for colonizing *soon* rests on risk, not on totals.
  That''s the "astronomical waste"/delay argument subtlety. Nice.

  - (7) is a demandingness premise that slides from "better" to "ought" without cost-comparability
  ("at comparable cost" — but the costs aren''t comparable because colonization is
  far more expensive and uncertain).

  - (4) "betterness adds up" is precisely the aggregation premise that yields the
  repugnant conclusion; and note that (4) is needed for (6) and for (b)''s absurd
  consequence, so the student can''t keep 8''s first clause by dropping 4 without
  losing the argument''s force.

  - Also there''s an equivocation in (2): "nothing about Earth makes a life there
  better than an equivalent life elsewhere" — but "equivalent" begs the question if
  Earth-lives are richer (biosphere-dependent goods). Mild.

  - And a scope/quantifier issue in (3): "could be supported" — modal. From "could
  be supported" to "will be supported if we colonize" requires success assumptions;
  the argument treats a possibility as an actual expected value, ignoring probability
  weighting. So (5) compares a certainty-ish Earth branch with a lottery in the space
  branch. That''s another good diagnosis: (3) is a claim about possibility, (5) needs
  expectation. That''s the "modal slide" the type notes mention.


  So the argument has multiple pressure points, and a good answer must pick and price.
