  My institute''s research office has circulated a call for twelve-month pilot projects,
  and the application is a structured abstract of no more than 350 words, read by
  a mixed panel of philosophers and one economist. I would like you to write that
  abstract for the project I have in mind.


  Here is the half-formed idea. The philosophical literature on moral compromise is
  overwhelmingly about permission: when a compromise with people whose values one
  regards as wrong is acceptable, what it costs the compromiser''s integrity, whether
  the resulting action leaves a residue that requires acknowledgment or regret. What
  is missing is the positive question — whether there can be gains from trade. Two
  parties whose value systems are genuinely incommensurable, not merely differently
  weighted, might each end up ranking a negotiated compromise above every outcome
  available without cooperation; if that is possible, compromise is not only a matter
  of tragic concession but of mutual benefit, and the economics of trade would apply
  to moral disagreement. My hunch is that this cannot be had for free. For each party''s
  own ranking to register the other''s getting what they want as a gain, something
  must make the ranking responsive to the other''s satisfaction, and there appear
  to be only three candidates: a shared second-order value (fairness, peace, the avoidance
  of conflict), the value of the ongoing relationship itself, or a first-order interest
  in not being obstructed. Each of these, if it does the work, seems to reintroduce
  a common measure and to dissolve the incommensurability that was supposed to make
  the case interesting.


  The anchor case should be of a particular kind: a negotiated settlement over a site
  one party treats as sacred and non-substitutable and the other needs for housing,
  rather than a case where the parties weigh the same considerations differently.


  The abstract should be delivered as exactly five numbered items, one or two sentences
  each, with no introduction and no conclusion, in this order:


  1. the research question, stated so that it has a determinate answer — what the
  question is about, and what would count as an answer;

  2. the two standard ways the question gets deflected (the permission-focused literature,
  and the economist''s assumption of a common metric) and why neither engages it;

  3. the method — begin ordinal, define "gain from trade" without cardinal utilities,
  identify the structural assumptions on the parties'' rankings that the definition
