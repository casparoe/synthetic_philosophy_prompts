  Moore''s paradox refrains: "It''s raining but I don''t believe it" — refrains could
  be the commissive and the omissive versions. There''s a known distinction: commissive
  Moore-paradoxical statements (p & I don''t believe that p) vs omissive ones (p &
  I believe that not-p). And there''s the distinction between first-person present-tense
  belief and the "transparency" of belief (Evans), Shoemaker''s self-intimation, and
  the debate over whether the absurdity is logical or pragmatic/rationality-based
