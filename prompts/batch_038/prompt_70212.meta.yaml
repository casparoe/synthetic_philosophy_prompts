  Moore''s paradox in application to future ("I will believe it tomorrow"), and to
  third-person, and the so-called "Moore-paradoxical" character of statements about
  one''s own unheld beliefs. Also: the debate whether the contradiction is between
  the conjuncts or between them and the fact of assertion (Williams'' "pragmatic"
  account: asserting p presents p as believed; so asserting "p but I don''t believe
  p" is like asserting "p but not-p"). Also there''s the "Moore''s paradox and the
  iterated" — e.g., "p but I believe that not-p" uttered by someone who is self-deceived.


