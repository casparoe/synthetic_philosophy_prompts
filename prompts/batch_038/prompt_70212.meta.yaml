  Half-formed idea: The debate about moral compromise is almost entirely about permission
  — when may one compromise, what does it do to one''s integrity, is there moral residue.
  What''s missing is the positive question: are there gains from trade? And my hunch:
  for a trade in concessions to yield a genuine gain for each side rather than a mere
  coordination equilibrium, something has to make each party''s own ranking responsive
  to the other''s getting what they want, and there seem to be only three candidates
  — a shared second-order value, the value of the relationship itself, or the parties''
  own interest in avoiding conflict — and each candidate, if it does the work, seems
  to dissolve the incommensurability the case was supposed to exhibit. So the project:
  figure out whether there''s a coherent notion of a productive moral compromise that
  survives the trilemma, and if not, say precisely what the failure shows.


  Concrete anchor: use a specific kind of case — a negotiated settlement where the
  parties'' values are not merely different but structurally incommensurable (e.g.,
  one party treats a piece of land as sacred and non-substitutable, the other needs
  it for housing), rather than a case where they simply have different weights on
  the same values.


  Method and alternatives: the obvious alternatives are (a) more intuition-pumping
  case studies, (b) importing a formal bargaining model with cardinal utilities —
  which presupposes a common metric and thus begs the question. The proposed method:
  start ordinal — specify the parties'' rankings over outcome-space including compromise
  outcomes, define "gain from trade" ordinal-theoretically (each party weakly prefers
  the compromise to every outcome in the non-cooperative set, and strictly to at least
  one), then test which structural assumptions on the ranking are needed to make such
  a gain possible, and check those assumptions against the sacred-land case. Then:
  whether the assumption needed is precisely the one that reintroduces commensurability.


  Failure: the project fails if it turns out that the ordinal definition of gain is
  either vacuous (any agreement can be described as a gain because we can always posit
  the ranking) or question-begging; or if the trilemma can''t be stated precisely
  enough to be arguable. Success: a precise statement of the structural condition,
  plus a verdict on whether it''s compatible with incommensurability.


