  "For twenty-six years I made my living walking into damaged buildings within hours
  of an earthquake and deciding whether people could go back in. I have no academic
  training in philosophy or statistics — I came to Keynes''s Treatise on Probability
  late, as a retiree, and have worked through it slowly, twice. What I think I found
  there is a distinction my profession threw away. Keynes separates the probability
  an argument confers on a conclusion from the weight of the evidence behind it: new
  evidence can leave the probability exactly where it was while making the footing
  under it firmer. He also admits, as far as I can make out, that weight can be compared
  only in a limited range of cases and never measured outright.


  My claim, which I will defend in a twenty-five-minute talk: the push in post-disaster
  safety assessment toward a single numeric vulnerability score is a genuine loss,
  not a refinement, because two assessments reporting the same number can differ enormously
  in weight, and the field decisions that actually held up over my career were the
  ones where my colleagues and I kept asking how we knew what we knew rather than
  what the number was. I want to go further than complaint. I think weight, as practitioners
  use it, splits into three separable things that Keynes runs together: how many genuinely
  independent lines of evidence support the figure; how closely the building in front
  of me resembles the stock the figure was derived from; and how much of what would
  have settled the matter was simply not observable that afternoon. My hunch is that
  the claim that weight cannot be measured survives only because these three are conflated,
  and that at least two of them can be.


