  Draft: "Coordinates and Quotients: On the Ontology of Features"


  §1. Mechanistic interpretability has adopted a realist vocabulary without, so far
  as I can see, having earned it. Practitioners speak of features as things a model
  has, of directions in activation space as the features themselves, of circuits as
  mechanisms the model implements, and of the goal of the enterprise as enumerating
  what is inside. Skeptics have typically responded with a familiar instrumentalism:
  these posits, on that line, are like the beliefs and desires of the intentional
  stance — useful for prediction, not candidates for existence. I want to argue that
  both positions are aimed at the wrong target, and that the reason they cannot be
  separated by evidence is structural.


  §2. Three claims organize current practice. First, individual units are polysemantic:
  a given neuron may respond to cat faces, car fronts, and text in a particular script.
  Second, the standard diagnosis of polysemanticity is superposition — the model represents
  more features than it has dimensions, using directions that are not axis-aligned
  and paying for this with interference. Third, the standard remedy is to learn an
  overcomplete sparse dictionary over activations at a given site, on the expectation
  that the atoms of this dictionary are closer to monosemantic and are the units on
  which causal interventions should be performed. Validation throughout is interventionist:
