  Also interesting: the "money pump" against cyclic preferences requires you to pay
  a premium each round; and there''s the point that if you can trade back at no cost
  (zero transaction costs), the pump stops. Also there''s a subtlety: whether you
  should be pumped depends on whether the agent can commit, and whether the sequence
  of trades is offered as a single package or one at a time.


  Good design task: construct a case in which an agent''s preferences are transitive
  and she is fully diachronically rational (plans ahead with backward induction),
  yet she is still money-pumped — i.e., the pump doesn''t depend on intransitivity
  at all. That''s a nice, non-trivial engineering task. Sources for such pumps: preference
  change over time (e.g., the agent''s future self has different preferences and the
  present self can''t bind her), or the pump exploits "self-locating"/indexical preferences,
  or the pump exploits the fact that the agent''s preference ordering is incomplete
  (a gap rather than a cycle) — e.g., preference incompleteness + a "small premium"
  trick, or the pump exploits the agent''s susceptibility to a "diachronic Dutch book"
  via credences rather than preferences (e.g., intransitive credences? or non-additive
  probabilities?).


  Actually a cleaner one: exploit a diachronic Dutch book on a non-probabilistic credence
