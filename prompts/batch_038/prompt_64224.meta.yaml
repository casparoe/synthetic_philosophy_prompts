  Prompt draft:


  "A friend and I spent most of yesterday evening arguing about money pumps. I claimed
  that the pump argument for transitivity is toothless because any agent with foresight
  can decline the whole sequence in advance; she replied that the diachronic defence
  only works if you assume the agent''s preferences don''t shift and that the only
  thing she cares about is where she ends up. I don''t think either of us was right,
  and I want a case that settles what the defence actually rests on.


  So: construct a sequential choice problem in which the agent is money-pumped — she
  ends up strictly worse off, paying money to return to where she started — but none
  of the following hold: her preferences are not intransitive at any time; she is
  not ignorant or surprised by any of the offers; and she is not irrational by her
  own lights in foresight (she correctly anticipates, by backward induction, what
  she will choose at every later node). The pump must instead arise from a violation
  of the independence axiom together with the fact that she cares about something
  besides the final outcome — say, about which options she turned down along the way.
  Keep it to a realistic, everyday setting with modest sums of money: a collector,
  an auction, a used-equipment dealer — no lotteries over exotic states, no perfect
  predictors, at most four decision nodes and three commodities.


  Then show your work: lay out the preferences explicitly at the relevant nodes, walk
  the tree forward, and confirm that the pump closes. Check each of my three exclusion
  conditions and say precisely where in the case each is satisfied. Finally, identify
  the single feature doing the work, say whether the pump survives if you remove the
  agent''s concern with forgone options, and explain how someone who thinks such an
  agent is perfectly rational would attack the case."


