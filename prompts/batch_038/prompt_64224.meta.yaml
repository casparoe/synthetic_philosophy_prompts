  only become exploitable across time). Or the pump arises from "money pump for the
  axiom of independence" — i.e., an agent who violates the independence axiom (Allais-type)
  can be money-pumped even with transitive preferences, and the diachronic defense
  fails because at each stage the choice looks locally fine. There''s a known argument
  that agents who violate independence can be pumped if their preferences aren''t
