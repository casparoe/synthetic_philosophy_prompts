  satisfy the independence axiom and hence be expected-utility representable. So an
  independence-violating agent must fail either dynamic consistency or consequentialism.
  Machina''s response: deny consequentialism — allow preferences to depend on the
  tree''s structure (e.g., on the forgone alternatives, "reciprocal" or regret-sensitive
  preferences). But Machina''s non-consequentialist agent can be dynamically consistent.


