  — Rabinowicz, Gustafsson, Cubitt & Sugden, and Elster''s Ulysses. The standard reply:
  a sophisticated agent can avoid the pump by foresight (backward induction). Gustafsson
  argues there are money pumps for intransitivity that work even against sophisticated
