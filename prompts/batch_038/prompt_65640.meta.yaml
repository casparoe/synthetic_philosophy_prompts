  of capital migration; and the "aggregate equalities" (total price = total value,
  total profit = total surplus value) don''t hold in general in Marx''s scheme — accounting
  identities do hold trivially because they''re definitional, so the accounting framework
  can''t even state the transformation problem. That''s a great residue: the target
  vocabulary cannot express the problem because its "identity" is bookkeeping, not
  a contested theoretical claim.

  - Alienation: this is the big residue. Estrangement from the product, from the activity
  of labor, from species-being, from other workers. Cost accounting has... labor as
  a cost element to be minimized; variance analysis treats deviations from standard
