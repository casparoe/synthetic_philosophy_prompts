  Translation attempts:

  - Labor theory of value: "value = socially necessary labor time" → in cost accounting,
  standard cost per unit built from standard hours at standard rates; but standard
  cost is a normative/engineering benchmark, not an emergent market quantity. "Socially
  necessary" ≈ industry-average efficiency embedded in the standard, and competition
  forces actual cost toward standard. That''s actually a pretty clean map for the
  *regulative* role of value: prices gravitate toward production prices like actual
  costs gravitate to standards. Distortion: standard costs are set by management,
  not by a decentralized market process; the LTV requires that the standard be an
  emergent social average with no setter.

  - Exploitation: surplus value = value produced minus value of labor power (wages).
  In the accounts: value added minus compensation of employees = gross operating surplus.
  That''s a clean arithmetic map. But the accounting identity is neutral: it says
  nothing about who caused the surplus. The residue: the causal/moral claim that labor
  is the sole source of new value. In national accounts, capital and land get income
  by convention/definition, not by a theory of contribution. So the translation yields
  the *distributional* fact but not the *attribution* claim. Also the accounting period
  problem: variable capital vs fixed capital; Marx''s c/v/s distinction vs the accounting
  treatment of depreciation (capital consumption allowance) — actually quite close:
  constant capital circulating (raw materials) and fixed (machinery, depreciated).
  Nice.

