  accounting: cost-plus pricing with a standard industry markup / target rate of return
  on capital employed; competition equalizes ROIC across firms/industries. This maps
  remarkably well: prices of production = full cost (materials + labor + depreciation)
  plus a uniform return on capital employed. Residue: in accounting, the uniform rate
