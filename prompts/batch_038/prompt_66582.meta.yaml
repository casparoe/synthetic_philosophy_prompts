  Setting: I''m a member of an ethics reading group (nine people, meets monthly).
  At our last session, on the ethics of war, Nora and Simon had a sustained argument
  about the moral equality of combatants, and it went several rounds. I''m reproducing
  their exchange as faithfully as I can; I didn''t take a side and don''t want to
  signal one. Here''s how it went.


  1. Nora opened with the claim that the "moral equality of combatants" — the idea
  that soldiers on both sides of a war have the same moral permission to fight provided
  they observe the rules of engagement — cannot be true. Her argument: killing a person
  is permissible only if that person has done something to forfeit or weaken their
  right not to be killed; a soldier fighting for an unjust cause threatens people
  who have done nothing to forfeit anything; so his killing of them is unjustified,
  and no amount of discipline in *how* he fights can launder that. On her view the
  two questions — whether you may fight at all, and how you may fight — come apart.


  2. Simon''s first reply: he accepted the structure but denied the conclusion''s
  acceptability, because it implies that the ordinary conscripted or enlisted soldier
  on the wrong side is, strictly, a murderer, however carefully he observes proportionality
  and discrimination, and however little he knows about the war''s origins. Simon
  said our moral vocabulary shouldn''t have that consequence, and that the practice
  of punishing only war crimes rather than participation reflects a sound moral judgment,
  not merely a political compromise.


  3. Nora: that conflates two different things — liability and blameworthiness. She
  used an analogy: if someone is thrown out of a window and falls toward you, and
  the only way to save yourself is to vaporize them with... hmm, need a plausible
  analogy. Classic: "the innocent threat" — a person who, through no fault of their
  own (a seizure, being drugged, being thrown), poses a lethal threat; most people
  think you may kill them in self-defense even though they are entirely blameless.
  So blamelessness doesn''t entail non-liability. The conscript is (she granted) largely
  excused, but he is still liable to defensive force, because liability tracks what
  you''re doing to others, not how you feel about it or how you came to be doing it.


  4. Simon''s counter: the analogy fails in a way that matters. The innocent threat
  is not an agent at all — she is, morally speaking, a falling object. The conscript
  is an agent who continues to fight day after day, who could in principle desert,
  who understands at some level that he is trying to kill people who are trying to
  kill him. And crucially, Simon added, the case is disanalogous because in the standard
  case we don''t even know that the conscript''s side is unjust: soldiers generally
  have no reliable access to the jus ad bellum facts, being fed propaganda by their
  own state. So the conscript threatens people under a reasonable belief that he is
  defending them from aggression. Simon''s claim: a threat posed under reasonable
  ignorance of its injustice is not an "unjust threat" in the sense that generates
  liability — or at least, it is not unjust in a way that licenses killing.


  5. Nora''s reply: whether a threat is unjust is a matter of the facts, not of the
  agent''s beliefs; if a man reasonably but falsely believes you are his attacker
  and tries to kill you, you may still defend yourself. Epistemic blamelessness is
  an excuse for him, and excuses matter for punishment, praise and blame, and for
  our moral assessment of him — but they don''t retroactively give him a right to
  kill you. She added: if Simon''s principle were accepted, it would follow that a
  soldier''s liability to be killed depends on how good his state''s propaganda department
  is, which makes liability hostage to epistemic luck in a way that seems arbitrary.


  6. Simon then shifted ground: he said, grant the act-level truth of everything Nora
  says. The moral equality of combatants is not a claim about act-level truth; it
  is a rule for the guidance of institutions and of soldiers under radical uncertainty.
  If we tell every soldier that he must first determine whether his state''s war is
  just, we get either paralysis (armies that cannot fight) or, worse, each soldier
  licensing himself to commit atrocities against "unjust" combatants because they
  have no rights — which is precisely the reasoning that eroded the constraints on
  conduct in the twentieth century''s total wars. The symmetrical rule is a second-best
  institution that saves lives; it is justified by what it achieves, and that''s enough
  to call it morally right in the only sense in which rules can be right.


  7. Nora''s response to the shift: first, that is a pragmatic argument for a legal
  convention, not a defense of the moral claim, and the two should not be run together
  — if Simon is right, then the correct description is that the law of armed conflict
  deliberately enforces a moral falsehood, which is a very different position from
  saying soldiers really do stand in a relation of moral equality. Second, the empirical
  premise is questionable: telling soldiers that they may not fight at all unless
  their cause is just raises the political cost of starting wars and may deter aggression;
  and in any case the symmetrical permission has not been notably effective at restraining
  conduct, since compliance with the in bello rules is a separate matter from the
  permission to fight. Third, she said, a rule that cannot be publicly justified without
  concealing the reasons for it — that has to be taught as if it were true rather
  than as if it were useful — fails a basic publicity test for moral rules.


  8. Simon''s last move, which I think was his strongest and which Nora did not really
  answer: he pointed out that Nora''s own view, pressed consistently, does not deliver
  a clean asymmetry either. If liability depends on what each individual is doing
  rather than on which side he is on, then a just combatant who attacks with disproportionate
  force, or who kills combatants whose liability does not extend to being killed,
  acts impermissibly too — and an unjust combatant who is being attacked beyond the
  limits of his liability may be permitted to defend himself. So the act-based view
  collapses much of the side-based asymmetry: it turns out to license killing by soldiers
  on the unjust side in a fair range of circumstances, and forbids some killing by
  soldiers on the just side. Simon''s conclusion: the disagreement between them is
  much narrower than it looks, and the practical upshots may nearly coincide — which
  makes him doubt that "the moral equality of combatants is false" is worth the rhetorical
  energy Nora spends on it.


