  Draft:


  "I''m six weeks into a jurisprudence seminar where we did the Hart–Devlin exchange
  on the legal enforcement of morals, and I have to write the final paper on it, and
  I''ve hit a wall. The thing that bugs me is that by every textbook account Hart
  won: Devlin says a society is more than a set of institutions, that it''s held together
  by a shared moral fabric, and that if you let enough of that fabric rot the society
  comes apart, so the state has at least a prima facie right to punish conduct that''s
  just plain immoral even where nobody is hurt; Hart says the disintegration thesis
  is either an unsupported empirical generalisation with zero evidence behind it,
  or a conceptual trick where ''society'' gets defined so that any change in its morals
  counts as its death — and either way it can''t bear the weight Devlin puts on it.
  Then Hart adds that Devlin slides between the morality people happen to hold and
  the morality that''s actually right, and that Devlin''s test for finding the shared
  morality (the gut feelings of revulsion and indignation of the ordinary reasonable
  person, the sort of person you''d get in a jury box) can''t distinguish a genuine
  moral consensus from a panic or a prejudice. On paper that''s a clean kill.


  Except it isn''t, and my reading group is living proof. We''ve spent three sessions
  on it, everyone agrees about the empirical facts of every example we try — cannabis,
  buying sex, surrogacy — everyone agrees that state coercion needs a warrant and
  that mere dislike isn''t automatically one, and yet we split down the middle every
  single time and nobody budges. Half the group says the Hartian is just refusing
  to see that the criminal law does something other than prevent harm, that it declares
  and teaches, that a legal ban on buying sex isn''t (only) an instrument for reducing
  trafficking but a statement about what kind of community we''re claiming to be;
  the other half says that''s Devlin with better vocabulary, and that ''declaration''
  smuggles in exactly the contested premise. My own hunch, which I can''t quite defend
  yet, is that this isn''t a substantive disagreement at all: it''s partly verbal
  — the two sides mean different things by ''society'' and by ''harm'', where one
  camp''s ''harm'' includes the degradation of what a community stands for and the
  other''s excludes it by stipulation — and partly a disagreement about who carries
  the burden of proof once coercion is on the table. But I might be wrong.


  So: diagnose it. Is this a verbal dispute, a substantive one, a hidden empirical
  question (does the disintegration thesis have any testable content, and would we
  recognize the evidence if we saw it?), or two camps answering different questions
  under one heading — ''may the state punish harmless immorality?'' versus ''is harm
  prevention the only thing criminal law can express?''? I want you to work from what
  each side actually argues, not from a survey of who said what afterwards, and no
  bibliography please, I have plenty. Tell me which of my two candidate diagnoses
  holds up, or give me a better one, and then say what would actually count as progress:
  a distinction that dissolves it, an empirical finding that would settle it, a change
  of question — or a reason to think no progress is available and the impasse is just
  what happens when two reasonable people disagree about the point of the criminal
  law."


