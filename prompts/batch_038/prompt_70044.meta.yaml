  \ a good subtle-but-not-obvious error — actually maybe too obvious? A hasty grader\
  \ would let it slide, yes. Hmm, it's a genuine conceptual error, moderately subtle.\n\
  \nAnother good one: conflating common knowledge with mutual knowledge of arbitrarily\
  \ high but finite order. Lewis does treat common knowledge as an unending hierarchy,\
  \ though he's a bit cavalier and suggests that in practice finitely-many-levels\
