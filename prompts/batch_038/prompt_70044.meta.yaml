  \ deliberation — but the key is that for Lewis, conventions are sustained by expectations\
  \ of regularity + conditional preferences, plus the alternative-regularity condition\
  \ (there must be an alternative regularity that could have served). A student might\
  \ conflate Lewis's conventions with mere habits/social norms enforced by sanction,\
  \ or conflate \"common knowledge\" with \"everyone knows\", or claim Lewis thinks\
  \ conventions require explicit agreement/contracts, or conflate Lewis's coordination\
  \ equilibrium with a Prisoner's Dilemma Nash equilibrium (Lewis explicitly says\
  \ coordination problems are not PD — the key distinction is that in coordination\
  \ games the players' interests are largely aligned, whereas in PD defection is dominant\
  \ and the equilibrium is Pareto-inferior).\n\nAlso: Lewis's account requires that\
  \ the preference be conditional on the expectation that others conform — if everyone\
  \ would prefer the regularity even if they didn't expect others to conform, it's\
  \ not a convention. Also the \"arbitrariness\" thesis: any alternative regularity\
  \ that solves the coordination problem would do as well. And Lewis distinguishes\
  \ conventions from norms of etiquette/morality in a complicated way (he says moral\
  \ norms aren't conventions, but some rules of etiquette might be). And there's the\
  \ driving-on-the-right vs. left example. Also language as a convention — Lewis's\
  \ \"Languages and Language\" (1975) treats the actual language of a population as\
  \ a convention; Kripke/Wittgensteinians object.\n\nAnother subtlety: Lewis's later\
  \ move toward \"coordination equilibrium\" being defined by common knowledge of\
  \ rationality, and the criticism (from Margaret Gilbert, or from Wayne Norman, or\
  \ from the \"salience\" critics) that conventions can persist even when players\
  \ no longer have the conditional preferences, or that some norms are not conventions\
  \ at all.\n\nGood candidate for a subtle error: student says that for Lewis, a convention\
  \ persists only as long as it's a strict Nash equilibrium of a coordination game\
