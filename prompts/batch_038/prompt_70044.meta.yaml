  \ \"salience\" for selecting among alternatives when there are multiple coordination\
  \ equilibria. Another: the student claims that Lewis thinks the fact that everyone\
  \ prefers a convention means the convention is not arbitrary — conflating \"arbitrary\"\
  \ with \"unimportant\" or \"conventional = matters which one\". Lewis's point is\
  \ precisely that it's arbitrary in that any of several alternatives would serve\
