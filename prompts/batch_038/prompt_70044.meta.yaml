  \ beef vs. chicken)\n\nTypes: grading a student's answer; a memo to an institutional\
  \ body; give an example of a conceptual issue.\n\nThe best combination: I think\
  \ grading a student's answer works great with Lewis on convention and the evolution\
  \ of norms. That's the \"niche-ish\" domain, and it's genuinely a place where a\
  \ student can conflate things: Lewis's Convention (1969) as a solution to a coordination\
  \ problem with common knowledge, vs. Schelling's focal points, vs. Lewis's \"evolution\
