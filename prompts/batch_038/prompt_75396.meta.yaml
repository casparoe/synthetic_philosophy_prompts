  ---

  An article in a general-interest science magazine argues that physics has settled
  the question of whether the future is open. Its central passage runs as follows:


  "Special relativity abolished the single universal now. Two observers in relative
  motion disagree about which distant events are happening at this moment, and neither
  description is more correct than the other, since the laws of physics pick out no
  preferred state of rest. Penrose''s example makes it vivid: two people pass on the
  street, and for the one walking toward the Andromeda galaxy an alien fleet has already
  set out, while for the other the decision to launch still lies in the future. Because
  both accounts are equally correct, the launch is both already real and not yet real
  — and that can only be squared by saying the fleet''s departure is a fixed feature
  of the four-dimensional block. The same reasoning works for any pair of observers
  anywhere, so every event in what I call the future is already real for someone.
  Becoming is therefore an illusion, and with it free will: what you will do tomorrow
  is as much a part of the universe''s furniture as what you did last year."


  I find this rhetorically compelling but I suspect it moves faster than the physics
  does. Please audit it. Which sentences would a philosopher of physics working on
  spacetime sign off on, which are defensible simplifications, and which are outright
  mistakes? In particular: what extra premises — about reality, or about the relation
  between observers'' presents — does the argument need in order to get from the frame-relativity
  of simultaneity to the conclusion that distant future events are real, and is each
  of those premises supplied by relativity itself? What is the best reply available
  to someone who wants to keep an open future without denying special relativity,
  and does it cost them anything? Finally, once the argument is corrected, does anything
  survive of the claim that free will is refuted, or does that conclusion depend on
  a separate assumption about determinism that relativity does not deliver?

