  "I am preparing a section of my dissertation chapter on scientific realism, and
  the argument I have built against epistemic structural realism now seems to prove
  considerably more than I want from it. Here it is.


  (1) Epistemic structural realism (the position Worrall introduced in 1989 as a way
  of taking the best from realism and from anti-realism) holds that what our best
  theories get right about the unobservable world, and what is preserved across theory
  change, is the structure they describe — the pattern of relations — and not the
  intrinsic nature of the relata.

  (2) To say that the world has a given structure while disclaiming knowledge of what
  stands in the relations, one must existentially quantify over those relations: there
  are relations R1, ..., Rn such that the world, or the relevant part of it, satisfies
  the description the theory gives.

  (3) A sentence of that shape — every relational term of the theory bound by an existential
  quantifier — is true just in case there are objects enough to assign to the variables
  in a way that makes what remains, the purely logical skeleton of the theory, come
  out true.

  (4) Whenever there are objects enough, such an assignment can be found, because
  the skeleton that remains imposes no condition beyond cardinality.

  (5) So the structural realist''s claim amounts to the claim that the universe has
  at least such-and-such a size — which is either too weak to be an empirical discovery
  or, if it is not, a piece of a priori set theory rather than physics.

  (6) Either way it cannot do the work the structural realist needs it to do: an empty
  or trivial truth does not explain why the theory makes novel predictions come out
  right, which was the whole point of retreating to structure.

  (7) Therefore structural realism is not a stable middle ground; it collapses into
  either triviality or a claim about cardinality that no empirical evidence could
  support.


