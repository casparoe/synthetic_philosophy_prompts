reasoning_summary: 'Let me design a prompt. Domain: the nonidentity problem, or Black''s
  spheres, or death badness. Type: "Predict or recommend a verdict on a new case from
  someone''s verdicts on earlier cases."


  I want to inject some novel/niche element into the prompt so it isn''t just regurgitable.
  Let me think about a good combination.


  Option: A law review-style or ethics committee track record. E.g., a grant-review
  panel or an ethics board that rules on cases involving future people. The domain:
  the nonidentity problem. But I want to inject novel cases that the model hasn''t
  seen.


  Idea: "The Asymmetry Committee" — a university''s research ethics and funding body
  that has ruled on a set of cases that all involve creating or affecting future people.
  Their verdicts are jointly consistent with more than one rule: Parfitian non-identity
  reasoning, person-affecting restrictions, impersonal totalism vs averagism, Benatar-style
  asymmetry, etc.


  I need verdicts that are jointly consistent with multiple plausible rules and diverge
  on the new case. Let me construct carefully.


  Let me design a body: call it the "Committee on Intergenerational Obligations" at
  a university, or better: a foundation''s board that decides whether to fund/permit
  various programs. Actually, to keep it in the weeds and avoid heavy institutional
  flavoring, maybe: a philosopher (my thesis supervisor / a colleague on a hospital
  ethics board) whose verdicts I''ve tracked.


  Let me make it a clinical/genetics ethics board — that gives natural nonidentity
  cases: preimplantation genetic diagnosis, embryo selection, delayed conception,
  sperm donor age, etc. This is rich and lets me embed real-ish cases with a twist.


  Design the track record (the board''s verdicts):


  1. A deaf couple wants to use PGD to select an embryo that will be deaf. Board:
  permitted (or prohibited?). Let''s think about what verdicts make interesting rule-indeterminacy.


  Actually, let''s make it a slightly fictionalized but coherent board with 6 precedents.
  Let me carefully design so that:


  Rule A: "Person-affecting / no-worse-for-anyone view": an act is wrong only if it
  makes some existing or future particular person worse off. Nonidentity cases where
  the child has a life worth living → not wrong.


  Rule B: "Impersonal view with a quality threshold" (e.g., total view or a ''best-possible-child''
  view): choosing a less good embryo is wrong impersonally even if no one is harmed.


  Rule C: "Threshold/harm view": wrong only if the resulting child''s life falls below
  some threshold of badness (a life not worth living, or below a decent minimum).


  Rule D: Asymmetry (Benatar-ish / McMahan-ish): duties not to create miserable lives,
  but no duty to create happy lives.


  Rule E: "Same-number, same-identity, comparative with counterfactual of a wait":
  maybe "procreative beneficence" (Savulescu) — select the best.


  Rule F: An "expressivist / intention-based" rule: it''s about the parents'' reasons
  or the message the act sends, not about welfare.


  So I want verdicts consistent with several of these. Let''s build:


  Precedent 1: A couple who would otherwise conceive naturally requests embryo selection
  to avoid a condition that would make the child''s life one of severe, untreatable
  suffering — but the only way to avoid it is to select a different embryo that would
  not otherwise have existed. Board: approved unanimously. (All rules agree, basically.
  Not useful as a discriminator — but fine as a floor. Actually every rule approves.
  Hmm, that''s fine but wasted. Better make precedents discriminating.)


  Let me instead use a two-dimensional structure: cases differ on (i) whether identity
  changes, (ii) whether the resulting person is below a threshold, (iii) whether the
  alternative is a different possible person or a wait, (iv) whether it''s creation
  vs. non-creation.


  Precedent list:


  P1. Delaying conception: A woman plans to conceive at 42; she is advised that delaying
  to 40 (or conceiving earlier) would produce a different, healthier child; she postpones
  further for career reasons and conceives at 44, and the child is born with a serious
  but manageable condition and a life clearly worth living. Board ruled: the decision
  was not wrongful toward the child, and they declined to say the child was harmed.
  (Consistent with nonidentity reasoning + person-affecting.)


  Hmm — actually to make it a board that rules on requests, better to frame as approval/denial
  of requests plus "the board wrote that..." Let me frame verdicts as: the board''s
  ruling plus a short line from its written rationale — but careful, if the rationale
  is given, the rule is less underdetermined. The example prompts (the epistemology
  one) gave just verdicts plus case descriptions. The ethics board example gave approvals/rejections
  with conditions. I''ll give verdicts + minimal descriptive facts, and maybe one
  or two with a fragment of stated rationale that is ambiguous (e.g., the board said
  it "would not say the child was harmed" — which is compatible with several readings).


  Let me draft the six precedents:


  1. A fertility clinic asked to select, among a couple''s viable embryos, the one
  predicted to have the highest cognitive and health profile rather than the one the
  couple preferred on the basis of nothing at all (they had no preference). Board:
  permitted selection, but explicitly declined to say the couple would have wronged
  the less-optimal embryo-child had they implanted it.


  Hmm, "wronged" language. Fine.


  2. A deaf couple requested PGD to select for congenital deafness. Board: denied.


  3. A request to select for achondroplasia (dwarfism) by parents both of whom have
  achondroplasia. Board: denied? Or split? Let''s have: denied, by a narrower margin,
  with the chair noting that the child''s expected life would be well above any threshold
  of a life worth living.


  Hmm, careful: 2 and 3 both denied, 1 permitted-without-harm-claim. That already
  looks like a threshold rule: selecting for deafness/achondroplasia is denied because
  these are significant disabilities — but the chair''s remark in 3 says the life
  is above the threshold. So denial in 3 can''t be explained by the "life worth living"
  threshold rule alone. Interesting.


  Let me restructure to build genuine underdetermination with at least 3 live rules:


  Rule A (person-affecting/nonidentity): wrong only if a particular person is made
  worse off than she''d otherwise be, or falls below a life-worth-living threshold.
  Predicts: denial in 2 and 3 is wrong-headed unless deafness/dwarfism pushes below
  threshold. So Rule A must explain 2 & 3 differently — maybe it can''t, so Rule A
  is in tension... but the board''s verdicts must be *jointly consistent* with multiple
  rules. So I need Rule A to accommodate them: perhaps in case 2 and 3 there''s a
  third-party element (the clinic''s resources, the message, future autonomy) — the
  board could deny on non-welfare grounds. Hmm.


  Better: make the discriminating rules be about *what the board tracks*:


  Rule A: Impersonal quality-maximization (procreative beneficence): always select
  the expected-best child.

  Rule B: Person-affecting + threshold: intervene only to prevent lives below a threshold;
  otherwise parental discretion is protected.

  Rule C: A "social model / expressivist" rule: deny selections that express a denigrating
  view of existing disabled people or that are requested for reasons tied to the parents''
  own identity rather than the child''s interests.

  Rule D: "Autonomy / open future" rule: deny selections that foreclose the child''s
  future range of options or that determine the child''s characteristics to serve
  the parents'' plans (Joel Feinberg''s child''s right to an open future — a real,
  well-known idea; fine).

  Rule E: Asymmetry: no duty to create better-off children; strong duty not to create
  suffering children.


  Now craft verdicts that all of A–E (or several subsets) can fit:


  Precedent 1: Couple with 8 viable embryos, no preference; clinic asks whether it
  may rank embryos by expected health/cognitive profile and implant the top-ranked.
  Board: permitted, but with a written note that the ranking created no obligation
  to use it, and that implanting a lower-ranked embryo would not have been a wrong
  to that child.

  - Rule A: fits (permits; though A might want to *require*).

  - Rule B: fits (permits as discretion).

  - Rule D: fits.

  - Rule E: fits.

  Good: broadly permissive, doesn''t discriminate. But it''s important because it
  establishes "not a wrong to the child" — which is the person-affecting-friendly
  datum.


  Precedent 2: Deaf couple, PGD to select for deafness. Board: denied, 6-1.

  Precedent 3: Both parents have achondroplasia, request selection for the FGFR3 variant.
  Board: denied, 4-3, with the majority noting the projected life was comfortably
  worth living.

  Precedent 4: A couple with a hereditary condition causing progressive, severe pain
  from early childhood and death in adolescence requests selection against it; the
  only embryos available without the condition would not otherwise have been brought
  to birth, and the couple asks whether they''d be wronging the affected child by
  not implanting it. Board: permitted selection, and wrote that the couple would not
  have wronged the affected embryo — but also that they were not obliged to implant
  it, and that nothing in the decision implied the affected child''s life would be
  a harm to her.


  Hmm, this is getting complicated. Let me simplify and make each precedent crisp:
  facts → verdict.


  Precedent 5: A woman asks the board to approve her plan to conceive using donor
  sperm from a donor known to carry a variant associated with above-average height
  and athletic build, because she wants a child who can play basketball; she is otherwise
  indifferent among donors. Board: denied? Or permitted? Hmm. Under Rule D (open future)
  denying; under Rule A permitting (it''s an improvement); under Rule C (expressivist:
  using the child for the parent''s project) denying; under B permitting.


  Precedent 6: A request to select for a modest cognitive enhancement where the couple
  says they''d love any child equally. Board: permitted.


  Then the new case should split the rules. Let''s design the new case to be genuinely
  novel and interesting, and to sit at the intersection of nonidentity and something
  fresh.


  New case idea: "The postponement case with a twist": A 34-year-old woman plans to
  freeze embryos and delay childbearing by 10 years for reasons she describes as purely
