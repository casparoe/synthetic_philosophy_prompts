  - Rule D (open future): probably permit — nothing foreclosed.

  - Rule E (asymmetry): permit — no duty to create better-off children.

  - Rule C (expressivist): permit — no denigration of anyone.


  That gives a 1-vs-4 split — a bit lopsided. Better to make a case where it''s roughly
  balanced and where the *precedents* pull in a specific direction, so there''s a
  genuine closest-analog question.


  Alternative new case: A couple wants to delay conception by two years because they''re
