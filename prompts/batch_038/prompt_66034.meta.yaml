  Safe Pareto improvement (SPI): In a game, a SPI is an outcome that (a) is Pareto
  superior to the default outcome (e.g., the Nash equilibrium), and (b) is "safe"
  in the sense that adopting it doesn''t make you worse off if the other player doesn''t
  adopt it. Classic examples: prisoners'' dilemma — mutual cooperation is a Pareto
  improvement over mutual defection, but it''s not safe unilaterally (if I cooperate
  and you defect, I''m worse off). But with commitment/precommitment technology (programmatic
  game theory — agents submit programs that condition on each other''s programs),
  you can get safe Pareto improvements. Chicken / hawk-dove games: a correlated equilibrium
  that mixes asymmetrically can be a SPI.


