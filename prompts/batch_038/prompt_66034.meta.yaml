  1. Baseline relativity: what counts as the default? If players disagree about the
  default outcome (e.g., because they have different priors or different solution
  concepts), the "Pareto improvement" and "safety" conditions come apart. Also the
  "safety" of a SPI depends on the other player''s *ability* to recognize and reciprocate.

  2. Selection problem among multiple SPIs: which one? Requires bargaining. And a
