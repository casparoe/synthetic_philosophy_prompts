  Intended genuine tensions:

  T1 (most severe): (4) all-subjected/all-coerced principle + (2) unilateral right
  to restrict immigration. If every person subject to a decision about membership
  must be able to accept the justification, then the demos cannot fix its own boundaries
  by its own lights; the border regime coerces those it excludes, so they are subjects
  of the decision. This either (a) entails that exclusion must be justifiable to excluded
  would-be immigrants — which, combined with (5)''s rejection of birthplace-based
  life chances, plausibly rules out the exclusionary regime (2) permits, or (b) requires
  a pre-democratic criterion of membership, which then does the normative work and
  displaces self-determination as the ground of (2). So (2) loses one of its two supports,
  and (3) is left carrying it.


  T2: (3) reciprocity underdelivers on the scope of (2)''s priority. Social insurance
  and national health systems cover non-contributors (children, the severely disabled,
  the long-term unemployed) — if the ground is reciprocal contribution/reliance, then
  compatriot priority should track participation, not citizenship. So (3) cannot support
  the full extent of (2). Fix: broaden the ground to something like shared subjection
  to a common coercive order / relational equality among those who stand in relations
  of basic structure — but that ground is precisely (4), which then extends beyond
  the border (back to T1). Alternatively, restrict (2) to participants only, which
  conflicts with (6) and with ordinary judgments. So the two fixes are each costly,
  and one of them re-opens T1. Elegant.


  T3: (5) brute luck about birthplace vs. the refugee/economic-migrant case verdict,
  and vs. (2)''s use of borders to preserve relative advantage. If birthplace is a
  paradigm brute-luck fact and no principle may let it determine life chances, then
  (a) the scheme-advantage-preserving function of immigration restriction looks like
  exactly such a principle, and (b) the persecution/economic distinction needs a corrective-justice
  ground the asker hasn''t supplied. Note: (b) is repairable by adding a principle;
  (a) is more damaging.


  T4 (methodological): feasibility commitments pull in two directions — one says principles
  must be actionable for actual agents (so infeasibility is a genuine constraint),
  the other says feasibility is endogenous to political demand (so current infeasibility
  is no objection). Can''t have both in the same argument; and whichever way it''s
  resolved matters for whether the political impossibility of large-scale immigration/open
  borders can support (2). Actually — do I need this? It adds a fifth item and makes
  the set longer. I think including it is good: it''s a real tension, methodological,
  and interacts. But maybe I make it slightly less obvious: state the two feasibility
  commitments as separate items without flagging them.


  Apparent tensions that dissolve:

  A1: (1) global equal consideration vs. (6) patriotism — dissolves because (1) is
  about the scope of justice at the institutional level and (6) is about the dispositions
  of agents; a cosmopolitan can hold that a division of moral labor makes partial
  attitudes virtuous, provided the institutional scheme satisfies global principles.
  But note the dissolution is conditional: it holds only while the institutional scheme
  satisfies (1)/(5) — so if T3 is unresolved, A1''s dissolution fails. That''s a nice
