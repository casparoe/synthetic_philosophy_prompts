  Background: I got sucked into the question of what makes every ''a'' an ''a''. A
  friend pointed me at some work on letterforms and analogy, I think it''s called
  Letter Spirit, but I don''t want a book report on that — I want help with my own
  judgments, because I''ve been collecting them and they don''t obviously add up to
  anything.


  Here''s what I actually think, case by case:


  1. A Times-style ''a'' (two-story, with the little hook on top) and my own handwritten
  single-story ''a'' (just a circle with a tail) are the same letter. Not just similar
  — the same one.

  2. Uppercase A and lowercase a are also the same letter, even though they share
  almost no strokes. Case is something the letter has, not what it is.

  3. A Cyrillic а typed into the middle of an English word by accident: I don''t notice
  it, I read it as an ''a'', and I''d say the word is spelled correctly. Shape-identical,
  no problem.

  4. But if someone who has never seen our alphabet invented a mark that happened
  to look exactly like a single-story ''a'' as their symbol for "water", I would NOT
  call it an ''a''. Same shape, totally different verdict from case 3.

  5. A mirrored ''a'' (flipped left-right, on its own) is not an ''a''. It''s a defective
  a, or a symbol for something else.

  6. ... except: the same mirrored letters in a word that''s entirely mirrored, so
  you can read the whole thing in a mirror — there I think each letter is still an
  ''a'' and the word is legible, just backwards. So cases 5 and 6 have the same glyph
  in them and I judge them differently.

  7. A logo where the ''a'' has been reduced to two abstract strokes that mean nothing
  on their own, but inside the word they''re obviously an ''a''. With context: yes.
  Lifted out: no.

  8. A display face where ''a'' and ''o'' are nearly the same round shape: I say the
  word decides which one it is, not the glyph.

  9. An upside-down ''a'' is not an ''a''. Nor is one rotated 90 degrees. But one
  rotated 8 degrees, squashed, stretched, made out of neon tubing or dripping paint
  — still an ''a'', definately.

  10. Pronunciation is irrelevant. The mark in "bread" and the mark in "fate" are
  the same letter even though they sound nothing alike.

  11. Stroke order/making: I don''t know. My ''a'' is drawn one way; a copy drawn
  in a totally different stroke order looks the same to me and I''d call it the same
  letter. But there''s a moment mid-stroke where the mark could still become an ''a''
  or an ''o'' and I want to say at that moment it''s neither. So maybe the making
  matters after all?

  12. A scrawl that only its author can read: I lean toward saying it''s not an ''a'',
  but if the author can read it back a year later, maybe it is.

  13. An ''a'' weathered in stone until the shape is mostly gone, but sitting in a
  legible word: still an ''a''.


  My tentative principle is something like: it''s an ''a'' if it has the essential
  features — a closed-ish bowl with a stroke down the right side — no matter what
  style they''re in. But 5 vs 6 wrecks that, and so does 3 vs 4, and so does 13 if
  you''re honest.


  So: is there a principle that gets all of these, or close? Please state it precisely,
  say which case motivates each clause, and tell me straight out which of my verdicts
  you think I have to give up. I''d rather have a simpler principle that costs me
  one or two judgments than a baroque one that saves everything, but show me what
  each option costs. Then run your account on two cases I haven''t listed — pick them
  yourself, ideally ones that stress it. And finally: is ''a''-ness in the mark, in
  the making of it, or in the system/community that uses it? Say which and what evidence
  would change your mind."


