  Draft:


  "Okay so I need someone to act as a philosopher who thinks about categories, perception,
  and writing systems — basically someone who can do careful conceptual analysis without
  turning into a textbook. Think hard before answering, and please actually brainstorm
  a few candidate principles out loud before you commit to one. No reading list at
