  principle that every commandment issues from divine wisdom and has a rationale,
  whether or not we perceive it; the failure to perceive is our ignorance, not the
  Law''s defect. If sacrifice is nothing but an anti-idolatry device, then the restoration
  passage has no rationale at all, and the code''s author has committed himself to
  a commandment he cannot explain — which is precisely what his own method forbids.
  Also, III.32 nowhere says the cult is to be discontinued; the weaning parable is
  about how the Law was given, not about how long it stands.


