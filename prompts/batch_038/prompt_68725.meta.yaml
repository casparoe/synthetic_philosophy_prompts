  and the game surely seems to have some value; (b) Riemann rearrangement: by reordering,
  you get any value — but does the ordering have normative significance? Decision
  theory says no: the expectation should be independent of how you enumerate outcomes,
  since it''s the same gamble; (c) Colyvan-Justus-Smilevich''s relative expected value
  fix: compute EV(A) - EV(B) which may converge even when each diverges — but the
