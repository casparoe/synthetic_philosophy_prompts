  ---


  I cover science and ideas for a magazine, and I''ve got a piece coming up I want
  to get right rather than just get balanced.


  Setup: a startup is selling school districts a "readiness score" for four-year-olds,
  built out of a polygenic score for educational attainment. Pitch deck claims I''ve
  got in front of me: (a) "our score accounts for about 11% of the variation in years
  of education in adults of European ancestry"; (b) "educational attainment is roughly
  60% heritable, so we''re capturing about a sixth of what matters"; (c) "this is
  prediction, not destiny — R² of 0.11 is a modest but real effect, exactly the kind
  of thing every other screening tool has"; (d) districts that reject it are, quote-ish,
  "refusing to use a measurement because it''s inconvenient."


  The districts in question are ~40% of kids from non-European ancestry backgrounds,
  and the plan is to use the score to decide who gets extra pre-K tutoring.


  So: what do the most important implications of what heritability actually is — the
  variance-ratio thing, the population-and-environment-specificity, the whole twin-vs-GWAS
  gap, gene-environment entanglement — actually imply for this story? I want the three
  or four that should carry the piece, in the order you''d put them, with the reasoning
  for the ordering (which one, if a reader only takes away one thing, changes what
  they''d conclude). Then walk me through claims (a)-(d) one at a time and tell me
  which survive and which are doing sleight of hand. I especially want to know whether
  (b)''s arithmetic is even the right kind of arithmetic, and whether (c) is a good
  defense or a category error.


  Also flag the implication nobody in this fight seems to be raising: what a prediction
  score can and can''t tell you about who benefits from an intervention, since that''s
  the district''s actual question.


  Prose first, then a table I can keep on my desk while reporting. Columns: claim
  (short label); verdict (one of: holds up / true but misleading / doesn''t follow
  / needs an empirical check); why, in one or two sentences; the sentence I could
  write instead that would be accurate.


  Oh and please don''t give me a reading list or citations — I''ll chase sources myself.
  Just the reasoning.


