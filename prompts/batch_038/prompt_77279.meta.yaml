  Essay text (write it well, ~650 words):


  Title: "Everything is option luck: a granularity problem for the brute/option distinction"


  1. The distinction and its job.

  Luck egalitarianism says an inequality is unjust when it tracks brute luck rather
  than choice. Dworkin''s version splits luck in two: brute luck, which is how things
  turn out independently of the agent''s choices (being born with a condition, being
  struck by lightning), and option luck, which is the outcome of a deliberate gamble
  the agent could have declined. The distinction is load-bearing. It''s what lets
  the luck egalitarian say we owe compensation to the person who was sick through
  no doing of their own but not to the person who lost their savings at the racetrack.


  2. The problem: the classification is relative to how finely you describe the choice.

  Consider Lena, who cycles to work and is badly hurt when a lorry in front of her
  loses its brakes. Now:

  - Coarse description: Lena chose "cycle to work." Under that description, she took
  a small, ordinary risk; the brake failure does nearly all the explanatory work.
  The injury looks overwhelmingly like brute luck.

  - Intermediate description: Lena chose "cycle on this route, at this time, in traffic."
  Under that description, some real share of the risk was hers.

  - Fine description: Lena chose "cycle on this route at 8:14 immediately behind this
  particular lorry, whose brakes were already failing." Under that description, there
  is no brute luck left at all: the injury is just what the chosen option consisted
  in. It''s pure option luck.

  Nothing about Lena changed between the three descriptions. The only thing that changed
  was how much of the world we packed into the name of the option she took. And we
  can always do more packing: at the limit, the option is "do the thing that in fact
  resulted in being injured," and every outcome whatsoever is option luck. Going the
  other way, at the coarsest level the option was "get up and go to work," and practically
  nothing is. So the distinction doesn''t carve the world at a joint; it slides with
  our choice of vocabulary.


  3. A possible reply, and why I don''t think it saves things.

  Someone will say: options are acts, not sentences; Lena performed one act, and whether
  it was risky is a fact about the world, not about how we talk. But that just relocates
  the problem. The riskiness of an act is a matter of the probability distribution
  over its outcomes, and a probability distribution is only defined once you''ve fixed
  a set of outcome-individuations. Which outcomes you group together as "being injured
  in traffic" vs "being injured by this lorry''s specific defect" is exactly the granularity
  question, and the act itself doesn''t settle it.


  4. The insurance market doesn''t escape either.

  Dworkin''s device for handling this — asking what people would have insured against
  behind a veil of ignorance — looks like a way to fix granularity, but it isn''t.
  An insurance premium is a price for a risk under a canonical description of the
  covered event. The device therefore has to assume there''s one right level of description
  at which to specify the policy, which is what was in question. The hypothetical
  market just hides the choice inside the drafting of the contract.


  5. Fix attempt one: the agent''s own description.

  Take the description Lena actually had in mind. Then the classification tracks her
  epistemic situation, not our vocabulary. But this makes justice hostage to mental
  bookkeeping: two identically situated cyclists get different treatment because one
  of them happened to think "lorries" and the other didn''t. Worse, it''s gameable
  and it seems to get things backwards — the person who never forms any expectation
  about risk at all has, under this fix, no option luck to speak of, and so is compensated
  most generously. Culpable inattention becomes exculpatory. That can''t be right,
  or at least it needs a story.


  6. Fix attempt two: the reasonably informed description.

  Use the coarsest description that captures all the risks that were foreseeable on
  the evidence available to someone in Lena''s position. This avoids the bookkeeping
  problem, but it stops being a theory about luck. Whether an outcome counts as option
  luck now depends on a social norm of prudent attention, and the norm is doing the
  distributive work. Also I worry it''s circular: I suspect the standard of "reasonable
  attention" will itself be set by our intuitions about who should be compensated,
  which is the thing the distinction was supposed to explain.


  7. What I actually want to propose.

  Drop the binary. Responsibility isn''t a switch flipped by "she chose it"; it''s
  a matter of degree, and the degree is set by two things: how much of the bad outcome
  was foreseeable on the evidence the agent had or could cheaply have gotten, and
  how costly it would have been for her to avoid it. Brute luck is then just the limiting
  case of zero foreseeability and option luck the limiting case of near-certainty,
  and the granularity problem never arises because we''re not sorting acts into two
  boxes — we''re reading off a number.


  8. The uncomfortable bit.

  This makes responsibility track epistemic diligence, so the inattentive are less
  responsible for their own bad outcomes. I can see two ways to take that. It''s a
  reductio, or it''s the correct result and the binary was flattering us. I don''t
  know which, and that''s the main thing I want comments on.


  That''s ~800 words. Good enough. Maybe trim slightly.


