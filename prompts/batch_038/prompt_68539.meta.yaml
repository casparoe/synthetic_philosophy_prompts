  Setup (standard): A motorway with two exits. Payoff 1 if he takes the first exit,
  4 if he takes the second, 0 if he drives past both. Because of absent-mindedness
  (imperfect recall), when he arrives at an exit he cannot tell whether it''s the
  first or the second — the two decision nodes are in the same information set.


  Plan (ex ante, before the drive): choose probability p of exiting at the first exit,
  q at the second. Expected payoff of the plan:

  U(p,q) = p·1 + (1−p)[q·4 + (1−q)·0] = p + 4(1−p)q.

  Maximised at p=0, q=1 → U = 4. So the ex ante optimal plan is: drive past the first
  exit, take the second.


  But under imperfect recall, the driver cannot condition his behaviour on which exit
  he''s at — he can''t implement a plan that discriminates between the two nodes,
  since the nodes are informationally identical to him. This is the crux: with imperfect
  recall, the "plan" is not implementable. So what he can actually implement is a
  single behavioural strategy: exit with probability r whenever he finds himself at
  an exit (any exit).


  Then: U(r) = r·1 + (1−r)[r·4 + (1−r)·0] = r + 4r(1−r) = r + 4r − 4r² = 5r − 4r².

  dU/dr = 5 − 8r = 0 → r = 5/8. U = 5(5/8) − 4(25/64) = 25/8 − 25/16 = 25/16 = 1.5625.

  Compare: r=0 → 0; r=1 → 1. So mixed strategy with r=5/8 gives 25/16 ≈ 1.56, better
  than always exiting (1) and much better than never exiting (0). Good. So 5/8 is
  the correct optimum under the "action-averaged"/behavioural-strategy reading.


  The paradox / decision instability: Suppose the driver commits to the plan "continue
  at the first exit, exit at the second." Now he arrives at an exit. He reasons: my
  plan was to continue at the first and exit at the second. Given imperfect recall,
  can he infer which exit this is? If he were a perfect planner and always follows
  his plan, then... arriving at an exit, he should think: it''s either the first (where
  I planned to continue) or the second (where I planned to exit). Standard self-locating
  reasoning: given his plan, he reaches the first exit with probability 1 and the
  second with probability 1 (if he follows the plan), so he can''t distinguish. His
  posterior over "which exit am I at" depends on the plan he''s executing and the
  prior over reaching each node. Under the plan (continue, exit), both nodes are reached
  with probability 1, so a self-locating credence of 1/2 each. Then local expected
  payoff of exiting = (1/2)(1) + (1/2)(4) = 2.5; of continuing = (1/2)(4) + (1/2)(0)
  = 2. So exiting locally beats continuing — contradicting the plan! That''s the instability:
  the plan-optimal behaviour is not sequentially rational given the natural self-locating
  credences it induces. And if he switches to always-exit behaviour, the induced credences
  change... Actually if he exits at every junction with probability 1, then reaching
  the second exit has probability 0, so upon arriving at a junction he should believe
  it''s the first with probability 1, so continuing (which then reaches the second
  exit with probability 1 and yields 4) is optimal — contradicting again. Beautiful
  circularity. That''s the well-known instability.


