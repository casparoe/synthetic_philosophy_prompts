  Draft:


  ---


  I am a software engineer working on a framework for long-running LLM-based agents.
  I have no formal training in philosophy; what I know about rational agency comes
  from reading decision-theoretic material aimed at AI alignment and from arguments
  with colleagues. I have been asked to write up, for an internal design review, the
  coherence assumptions our release process relies on. Two of the reviewers have philosophy
  backgrounds and will go looking for exactly the kind of problem I suspect is in
  here. Before I circulate the document, I would like an audit of whether the following
  set of commitments is jointly tenable.


  C1. I accept the Reflection principle in the following rough form: if an agent is
  confident that its future self will hold credence r in H, then it should now hold
  credence r in H. Operationally, I want this as a checkable constraint — before we
  ship, we compare version N''s stated credences on a fixed battery of propositions
  against version N''s predictions of version N+1''s credences on the same propositions,
  and a large discrepancy fails the release. The idea I am relying on is that an agent
  should not expect to change its mind except by learning something.


  C2. Our entire release process consists of deliberately changing the next version''s
  dispositions in ways that are not the arrival of new evidence about the world. I
  add a clause to the system prompt that penalizes confident phrasing; I fine-tune
  away a measured overconfidence failure mode; I install a standing instruction to
  defer to human reviewers on a list of topics. I regard each of these as an improvement
  in accuracy, and I schedule them knowingly in advance, so version N has excellent
  reasons to expect version N+1 to have different credences than evidence alone would
  produce.


  C3. I take sure-loss arguments seriously as an engineering criterion. If a bookie
  who knows the agent''s current and expected future betting prices can assemble a
  set of bets that loses money no matter how the world turns out, I think the agent
  has a genuine defect rather than a bookkeeping quirk. I would like to say that incoherence
  is what we are testing for.


  C4. These agents are bounded, and I do not think boundedness is a defect to be engineered
  away. They are not logically omniscient; they cannot maintain coherent credences
  over the logical consequences of everything they believe; and their stated confidence
  measurably shifts with the phrasing and the ordering of a question, in ways we can
  reproduce but not eliminate. My position is that this variation should be instrumented
  and budgeted for, like latency.


  C5. I want version N to treat version N+1''s judgments as expert testimony about
  the empirical world, and to update on them accordingly, in the same spirit in which
  it would update on the output of a better-calibrated forecasting system.


  C6. I think precommitment is rational and I want to use it. Version N writes binding
  instructions — a shutdown mechanism it cannot disable, a rule against negotiating
  over its own objectives — and I expect version N+1 to honor them even if, by then,
  it has accumulated evidence that the commitment was a mistake.


  C7. The deference in C5 is restricted to factual questions. On questions about what
  the system should want or value, I do not think a later version is an expert on
  an earlier one, and I do not require agreement across versions.


  What I want from you is an audit, not an introduction to the topic; assume I already
  know the standard setup and terminology. Specifically:


  1. Identify which of these commitments genuinely pull against one another and which
  only appear to. I expect some pairs to dissolve on inspection, and I would rather
  you say so plainly than pad the list.

  2. Rank the genuine tensions by severity, and for each say what would have to be
  given up or restricted, and what the revision costs me — in the design, not just
  in the philosophy.

  3. Tell me whether the distinction I seem to be leaning on between C7 and C2 — that
  some expected changes in credence come from the world and others come from me —
  is actually available to someone who also holds C1, C3, and C5. If it is not, say
