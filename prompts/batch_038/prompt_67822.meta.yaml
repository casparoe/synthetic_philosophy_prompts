  credence, but the current version can also predict that a third version, seeing
  the original phrasing, would shift back — yielding an infinite regress/no fixed
  point. So (1)+(4)+(5) may have no stable solution: the agent''s credence becomes
  undefined or oscillates. This is a nice one: Reflection requires that you have a
  determinate expectation of the future credence; framing sensitivity means your expectation
  depends on the framing of the question you use to ask about your future credence
