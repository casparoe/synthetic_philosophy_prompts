  Draft:


  ---


  I teach an upper-division seminar on the philosophy of animal minds: 18 students,
  one 100-minute session, a room with movable chairs, a whiteboard, and a printer.
  No budget. The students have already spent a week on behavioral and neurobiological
  evidence for nociception and pain in non-mammals; they have not yet thought about
  what to do with that evidence once they have it. I want an in-class activity in
  which they run into the problem of converting evidence into moral weight, and discover
  that their own conversion is not doing what they think it is doing.


  Here is the spine I have in mind, though the details are yours to work out. Students
  sit as a panel that must distribute a fixed pot of 100 "welfare weight" points across
  six anonymized dossiers — each dossier a checklist of evidence markers (say, opioid
  modulation of responses to noxious stimuli, willingness to pay a cost to avoid one,
  protective behavior toward an injured site, flexible redeployment of what was learned
  in a single aversive episode, degree of centralization in the nervous system, and
  one or two others you choose). Before they see the dossiers, the panel must lock
  in, in writing and in the abstract, a rule for turning marker profiles into points
  — including a rule for what to do when the markers are silent and when they are
  ambiguous. Only then are the dossiers released. The catch, which they must not be
  told in advance: two of the dossiers have identical or near-identical marker profiles,
  and the sealed species names reveal that one is a mammal and the other an arthropod
  or mollusc; a third dossier returns no data on any marker, not because the animal
  lacks the features but because the tests have never been run. When the names come
  out, I want the room to have to look at the fact that their allocations diverged
  for profiles their own rule said were the same.


  Please give me: the marker list and the six profiles in a form I can print and fold
  into envelopes; the exact wording of the method-lock step and a time limit tight
  enough that they cannot deliberate their way to a rule that anticipates the trick;
  the arithmetic and rounding convention for the pot; a second round in which they
  may revise the rule but must then decide whether to stand behind the allocation
  they already produced; and, if it can be done cleanly, a short final phase in which
  the class applies whatever rule it has ended up with to a real small decision it
  actually has standing to make — something like whether to ask our dining services
  to drop a category of animal product, or which of two rodent-control methods to
  endorse to facilities — so that they feel the difference between possessing a formula
  and trusting it.


  The debrief should map specific moments onto the distinctions the activity has staged,
  and should not name any of them until it begins: the difference between treating
  resemblance to us as evidence, as a tiebreaker, and as a prior that survives contrary
  evidence; the difference between absence of evidence and evidence of a different
  architecture; and the way a fixed, divisible pot silently imposes a comparative
  structure that a non-comparative account of moral status would reject. Tell me which
  of the three the activity can stage honestly and which it merely suggests.


  Finally: tell me what will predictably go wrong the first time I run this — I expect
  at least one student to smell the matched pair early, and I expect the pot arithmetic
  to produce an allocation dominated by whichever taxon has the largest headcount
  — and how to handle each without abandoning the design. Say plainly which feature
  of the real problem the exercise cannot reproduce and that I will have to supply
  myself. Do not include citations, reading lists, or references to specific studies;
  keep the empirical content at the level of the markers, and where a marker''s applicability
  to a given taxon is genuinely contested, design the profile so the game does not
  depend on settling it.


