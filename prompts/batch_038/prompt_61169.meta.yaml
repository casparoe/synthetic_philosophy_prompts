  true), we get Phosphorus is the brightest thing visible in the evening sky (contingently).
  Necessary identity does license substitutivity of co-referring *rigid* terms in
  modal contexts; but the predicate "is the brightest thing visible in the evening
  sky" is a contingent property, so the conclusion is true but *contingently* true,
  not necessarily. The student''s error is inferring necessity of the predication
  from necessity of identity + Leibniz. That''s precisely the modal fallacy (or a
  de re/de dicto slip). Excellent — and it''s the kind of thing a hasty grader might
  mark correct because "necessarily identical things share all properties" is technically
  a true principle (indiscernibility of identicals holds in modal contexts when properly
  stated for rigid terms) and the conclusion is indeed true. The error is the "necessarily"
  prefix.


