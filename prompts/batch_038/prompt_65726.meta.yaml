  Van Fraassen (1984), "Belief and the Will" (Journal of Philosophy). Reflection Principle:
  Your current degree of belief in A conditional on your having degree of belief r
  in A at some later time should be r. Formally: CR(A | CR_future(A) = r) = r. Rationale:
  your future opinion is like the opinion of an expert; you should defer to anticipated
