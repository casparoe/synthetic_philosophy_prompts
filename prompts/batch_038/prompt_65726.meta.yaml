  quantity — he argues that PP entails Reflection if you take your future self to
  be an expert. There''s a subtlety: the derivation of Reflection from PP assumes
  that your future credence is a "chance" of your future belief or that you''re certain
  your future self is better informed.


  Key well-known features:

  - Reflection implies conditionalization (given that all belief change comes from
  experience you''re certain about in advance — the "Reflection entails Dynamic Coherence/Conditionalization"
  result). Actually: if you''re certain that your future credence function will be
  obtained by conditionalizing on some evidence E, then Reflection entails that you
  should conditionalize. Van Fraassen argues Reflection generalizes conditionalization.

  - Ulysses: van Fraassen discusses cases where you know your future belief will be
  corrupted (drug, brainwashing, temptation) — then Reflection is violated but rationally
  so. He handles this by restricting Reflection to cases where you take your future
  self to be better informed / an expert.

  - Arntzenius, Elga, Hawthorne have criticisms ("Bayesianism, Ideal Observers, and
  Gettier Problems" — Arntzenius). Also there''s the "self-undermining evidence" literature
