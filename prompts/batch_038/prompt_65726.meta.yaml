  Domain candidates for grading:

  1. Van Fraassen''s Reflection Principle — a student answer that conflates Reflection
  with Conditionalization/Reflection with the Principal Principle, or misstates that
  Reflection requires certainty of future belief, or thinks violation of Reflection
  shows you''re irrational rather than that Reflection only applies when you''re confident
  your future self will be better informed (van Fraassen''s own caveat: the Ulysses
  case — one may rationally plan to bind oneself against anticipated belief changes
  due to corruption/brainwashing). Also common subtle error: stating Reflection as
  requiring P(p | I will believe p) = 1 rather than = P(p) — actually the correct
  form is: P_now(p | P_future(p) = r) = r. A subtle mistake: writing P(p | I will
  come to believe p) = 1, which is a special case (r=1), and claiming that''s the
  general principle. Another subtle error: claiming Reflection follows trivially from
  the Principal Principle, or claiming that violating Reflection means you''re subject
  to a Dutch Book (true-ish under some conditions — dynamic Dutch book arguments exist,
  but the subtleties: only if the agent is certain about future beliefs and no new
  information). Also the Ulysses/drug case.


  2. Kant on animals — student answer that says Kant says animals have no moral standing
  at all (indirect duty view misattributed), or conflates "things" vs "persons," or
