  Draft:


  ---


  I am preparing a contribution to an interdisciplinary working group on the Anthropocene,
  and the discussion keeps running through two analogies that I have come to distrust
  in different ways.


  The first belongs to a stratigrapher in our group. He says that asking when the
  Anthropocene began is like asking when the Cretaceous ended: the iridium-rich clay
  that marks the K–Pg boundary is a fact about the rock, not an interpretation, and
  once you can point to a globally synchronous signal — for the Anthropocene, the
  plutonium fallout layer laid down by thermonuclear testing in the early 1950s —
  the start date is settled by evidence rather than argument. On his telling, it no
  more matters that the Anthropocene''s cause was a species rather than an asteroid
  than it matters that the K–Pg cause was a rock rather than a volcano. From this
  he draws the conclusion that a start date is there to be found, and that the recent
  refusal of the stratigraphic bodies to ratify the epoch was a failure of nerve about
  hierarchy, not a discovery that no boundary exists.


  The second belongs to an environmental historian. She says that declaring an Anthropocene
  is like declaring an Industrial Revolution: a retrospective label laid over a long,
  uneven, regionally staggered transformation, whose start date different communities
  fix differently (1780? 1830? later still, elsewhere?) with no fact of the matter
  to appeal to. From this she draws the near-opposite conclusion: there is no date
  to find, only a date to choose, and choosing the early 1950s quietly chooses the
  industrialised North as the agent of planetary history.


  Both analogies, I suspect, share a premise neither states: that a boundary is fixed
  by observers downstream of it who cannot alter it. Our case is otherwise in two
  respects. The proposed interval has a base but no top — its upper boundary is, at
  present, simply the present. And its would-be inhabitants are still manufacturing
  the marker: within a few decades, coordinated action could thin the signal, change
  its composition, or bury it under something else, in a way no Cretaceous mollusc
  and no nineteenth-century mill owner could do to their own periodisation.


  Please audit the two analogies. For each, give me the mapping explicitly — a short
  table of correspondences will do — and then distinguish the mismatches that are
  load-bearing for the conclusion each speaker draws from the ones that are merely
  decorative. I especially want to know what each source domain contributes that the
  target lacks: what the asteroid brings with it, and what the Industrial Revolution
  brings with it, that neither is entitled to lend. Then tell me whether the two open
