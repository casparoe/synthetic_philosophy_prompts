  sorites inference chain. Also, "introduction of the definite operator" fails: p
  does not entail Dp. And Dp ∨ D¬p? Not supertrue. And a key point: supervaluationism
  does not satisfy the classical rule of "if ⊢ p then ⊢ Dp"? Actually many supervaluationists
