  Key disanalogies to hint at / let the model find:

  1. In Newcomb, what''s predicted is your *action* (which box you take); the payoff
  attaches to the action, conditional on the prediction. In Kavka, what''s scanned
  is your *intention*, and the payoff attaches directly to the intention itself —
  there is no action whose payoff depends on the prior state. So the structural locus
  of the reward differs: reward for a state vs reward for an act given a predicted
  state.

  2. In Newcomb, the paradox arises from the tension between dominance reasoning (two-boxing
  is dominant given the contents are already fixed) and expected-value/evidential
  reasoning (one-boxing). In Kavka there is no dominance tension at the decision moment:
  not drinking is straightforwardly best tomorrow, and there''s no competing consideration
  *at the time of drinking*. The tension is diachronic and about the possibility of
  forming an intention at all — it''s a problem about the "will" (can you intend for
  a reason?), not about which act to choose.

  3. In Newcomb you can act — you just take a box. Intentions aren''t actions; you
  can''t form them at will. The analogy treats "intending" as if it were a move available
  in the same way "taking box B only" is. That''s the crucial imported feature: voluntariness/availability
  of the rewarded item.

  4. Newcomb''s one-boxer wins because of what she *does*; the "be the right kind
  of person" move in Newcomb (e.g., becoming a one-boxer by self-modification) is
  a real strategy discussed. In Kavka, being the kind of person who drinks toxin for
  no reason doesn''t get you anything extra — there''s no payoff to drinking, so cultivating
  a follow-through disposition only pays if it makes the intention itself available/credible
  to the scanner. And any self-modification (drug, hypnosis, contract) changes the
  payoff structure by adding an independent reason, which the stipulations are designed
  to rule out.

  5. Predictor reliability: Newcomb''s predictor is near-infallible and its reliability
  is what generates the evidential link; in Kavka the scanner''s reliability isn''t
  doing the same work — even an infallible scanner leaves the question of whether
  you can form the intention. Dialing it to 90% doesn''t tighten the analogy; it just
  adds ordinary risk.

  6. Reverse causation / backward-looking: In Newcomb, some think one-boxing involves
  letting the future act determine the past prediction; in Kavka there''s no such
  issue since the payment is fixed before the act, and the act is irrelevant to it.

  7. Also: in Newcomb, the two-boxer''s argument is that the money is already in the
  box or not — "the past is fixed". In Kavka, the money is already in your account
  — that''s actually the parallel that works well: the past-fixity. And Kavka''s response
  mirrors the two-boxer''s: since it''s fixed, your later act doesn''t matter. So
  the analogy''s *good* part: both involve a payoff determined by an earlier state
  that later action can''t change. The interesting question is why in Newcomb many
  think you should nevertheless one-box (act as if your act influences the prediction)
  while in Kavka almost nobody thinks you should drink.


