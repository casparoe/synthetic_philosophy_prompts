  Alternatively — a cleaner, more distinctive episode: **the trial of Charles I (1649)**.
  Pascal''s exact contemporary! Pascal was 25 in 1649. The trial of Charles I is *the*
  early modern staging of the force/justice question: the Rump Parliament created
  a "High Court of Justice" that no existing law recognized; the Lords refused to
  concur; about half the commissioners named refused to sit; the court had no jurisdiction
  over the king, who refused to plead and denied its authority ("By what power am
  I called hither?... Let me know by what lawful authority I am seated here, and I
  shall not be unwilling to obey"); the court''s answer was essentially that the people,
  having conquered him, are the source of authority — Bradshaw''s claim that the king
  is accountable to the people. And then there was the notorious problem that the
  death warrant was backdated and the list of signatories padded (the date on the
  warrant, and the practice of adding names in the Painted Chamber afterward — "Colonel
  Hacker" etc.). Also the Leveller/Putney debates context: "might makes right" — Cromwell
  and Ireton''s arguments at Putney about property and the franchise are literally
  about force and justice. And Pascal had direct contact: he was in Paris among people
  following English events; and Hobbes was in Paris, and Hobbes'' Leviathan (1651)
  is the systematic version of Pascal''s insight. Pascal''s Pensées are usually dated
  1657–62, after the regicide. So the trial of Charles I is *contemporaneous* with
  Pascal''s writing — that''s a nice hook: Pascal was writing his fragments in the
  decade after a king was judicially killed by a court his own side admitted had no
  legal basis.


