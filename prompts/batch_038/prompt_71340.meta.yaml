  Pascal''s key political claims (from the Pensées, "reasons of effects," fragments
  ~103, 294, 297, 326, etc., in Lafuma numbering):

  - Justice without force is impotent; force without justice is tyrannical. Justice
  without force is contradicted, because there are always bad men. Force without justice
  is accused. So we must unite justice and force; and to do that, we made just what
  is strong, or strong what is just.

  - Property/merit doesn''t determine who rules; it''s force. But you can''t base
  the rule of the strong on strength openly, because as soon as someone stronger appears,
  they''ll take over; so people put it on a different footing (e.g., birth, election,
  heredity), which is arbitrary but stable — and thus "the least unreasonable" choice
  is heredity, because it prevents civil war.

  - "Laws are obeyed not because they are just but because they are laws": the mystical
  foundation of authority. And: it''s dangerous to tell the people that laws aren''t
  just, because they''ll disobey — hence we must hide the origin, and the "mystique"
  of authority.

  - The three orders: bodies/flesh, minds/spirits, charity/will. Each order is separated
