  explanation isn''t a search for a unique necessary condition; it''s a search for
  a member of a set of jointly sufficient conditions, and citing a member of such
  a set can be informative even when other members exist (Mackie''s INUS point: an
  insufficient but necessary part of an unnecessary but sufficient condition). Actually
  the INUS account is precisely designed to handle this: F is explanatorily relevant
  because it is a necessary part of the sufficient condition that actually obtained,
  even though there were other sufficient conditions available that didn''t obtain.


