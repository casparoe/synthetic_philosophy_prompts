  the same function; or a model whose mechanism is preserved under fine-tuning but
  relocated; ask which identity criterion (functional, causal, implementational, historical/causal-historical)
  gives which verdict. That could be a lovely Type A prompt: build a case where the
  four criteria for "same mechanism" (functional equivalence, matching causal role
  in the computational graph, matching weights/subspace overlap, and a historical/causal-lineage
  criterion) come apart in a specified pattern — e.g., three say "same" and one says
