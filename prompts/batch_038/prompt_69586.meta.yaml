  Draft:


  "Risk-weighted expected utility theory (Buchak) is supposed to rescue a genuinely
  global form of risk aversion from the charge that it''s irrational. The setup: instead
  of taking a probability-weighted average of utilities, you apply a risk function
  R to the probability that a gamble comes out at least this good, then integrate
  across utility levels. R has to be increasing with R(0)=0 and R(1)=1, and if R is
  convex the agent is risk-averse. The selling point is that this preserves the ordinary
  probability calculus — your credences still have to be probabilistically coherent,
  on pain of the usual Dutch book — while letting you violate the sure-thing principle.
  That''s how it''s supposed to handle Allais: you can prefer the guaranteed million
  and also prefer the riskier of the two non-guaranteed options, without your beliefs
  being incoherent.


  Here''s my worry, and it has two parts. First, the convexity of R is doing exactly
  the same work that concavity of u does in expected utility theory, only with the
  nonlinearity moved from the utility axis to the probability axis. Any preference
  pattern a convex R can generate, some concave u can generate too, since both are
  just monotone reweightings of the same distribution. So REU theory doesn''t add
  any new permissible preferences; it''s a notational variant, and if the Allais preferences
  are irrational on the standard account they''re still irrational here — the notation
  change doesn''t launder them.


  Second, and worse, REU is not closed under splitting. Take one real-world option
  — say, donating a chunk of income to a longshot program that averts a catastrophe
  with probability 1 in a billion and enormous payoff otherwise. Described as a single
  act, a risk-averse R discounts the tail probability so hard that the donation looks
  impermissible. But describe the same situation as a series of small decisions, each
  of which the agent evaluates separately, and the agent will take a sequence of steps
  that leaves her worse off by her own lights — the classic money pump. Buchak''s
  answer, as I understand it, is that acts have to be individuated finely and that
  the agent''s attitudes are toward the whole act rather than toward its parts. But
  which description is the right one is a metaphysical question about act-individuation,
  not a decision-theoretic one. So REU gives different verdicts on the same practical
  problem depending on how you slice it, and it doesn''t tell you how to slice it.


