  I am a fourth-year doctoral student in philosophy of mind, and I have been asked
  to open an interdisciplinary workshop on temporal consciousness with something other
  than a slide of the usual timeline. I would like a pantoum about the color phi phenomenon,
  and I want the form to carry the argument rather than merely decorate it.


  For anyone in the room who has not met the illusion: two small lights of different
  colors — say a red and a green — are flashed a few degrees apart in the visual field,
  less than a second apart in time. Under the right spacing and timing, the observer
  does not see two flashes. They see one thing cross the gap, and they see it change
  color somewhere in the middle of a path that no light ever traveled. The troubling
  part is the timing of the report: the subject places the change of color before
  the second light has come on, that is, before there was anything in the world to
  inform them of the change. The information arrives after the experience it is supposed
  to explain.


  Then the two hypotheses I need the poem to hold in suspension. Call the first Orwellian:
  the subject really did see red, and only afterward, once the green light has arrived,
  the record is quietly rewritten in memory — the past is edited to match the present,
  as in the ministry that corrects yesterday''s newspapers. Call the second Stalinesque:
  nothing is rewritten, because the reconciliation happens before the show is put
  on; the verdict is settled backstage, and what steps into consciousness is already
  the finished trial, with the mid-flight change of color in it from the start. Here
  is the twist that matters, and that the poem should enact rather than state: the
  two accounts can agree about every neural event, about exactly where and when the
  mistaken content enters the causal pathway; they differ only about whether that
  spot is on the near side or the far side of experience. And subjects cannot tell
  them apart, because an experience that was misbegotten and an experience that was
  immediately misremembered feel exactly alike from inside.


  So the formal commission. A pantoum, four or five quatrains, with the second and
  fourth lines of each stanza returning as the first and third of the next. In a pantoum
  the returning lines are traditionally verbatim, and that repetition is what makes
  the form the right instrument here: the poem is a machine for presenting you with
  a line you have already read and letting you discover that its meaning has been
  altered by what came after. I want you to make the choice I have described explicit
  in your handling of those returns. Either revise them slightly as they come back
  — a pronoun, a tense, a single modifier — so that the reader, like the subject,
  reports having seen the change all along (Orwellian); or leave them letter-for-letter
  identical and let the intervening quatrains do all the falsifying, so that the line
  was never anything but what it now says (Stalinesque). Pick one. But pick it so
  quietly that a reader who has just finished the poem cannot say which you did, and
  could not say it even if they read the poem twice. That inescapability is the philosophical
  point.


  Additional constraints, offered in the spirit of the workshop rather than as rules
  for a contest:

  - The two lights should be present in the poem as something other than laboratory
  furniture; the red and the green should be allowed to be, at least for a stanza,
  an experience rather than a stimulus.

  - Do not resolve the puzzle in the closing quatrain, and do not let the last stanza
  deliver the consolation that consciousness is therefore an illusion or that the
  theater was empty all along. The pantoum''s habit of returning the first stanza''s
  opening lines at the end is welcome; a summary is not.

  - Avoid the words "Orwellian," "Stalinesque," "Cartesian theater," "phi," and "qualia."
  The distinction should be legible in what the poem does, not advertised in its vocabulary.
  I would rather have the workshop''s philosophers recognize the argument than have
  it named.

  - Roughly eight to ten syllables per line is fine; I do not require a rhyme scheme,
  but if you rhyme, let the rhyme be one of the things the repetition makes ambiguous.


  Then finally: someone who works on this literature should be able to read the poem
  and know precisely which puzzle it is about and which side of the equivalence it
  has chosen to make invisible. Someone who has never heard of the illusion should
  get a good poem about a moving light that changes color before anything tells it
  to.


