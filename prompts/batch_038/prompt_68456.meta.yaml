  Consider: A philosophy-of-language seminar leader (or a fictional scholar, "Dr.
  X") has made a series of judgments about which aspects of radical translation are
  fixed by behavioral evidence and which are not. The rules at stake in the literature:


  - Rule A: Reference is inscrutable but truth-values of whole sentences are determinate
  (Quine''s own considered view, roughly: the "proxy function" argument — any reinterpretation
  preserving sentence truth-values is empirically equivalent).

  - Rule B: Even sentence-level translation is indeterminate (stronger reading).

  - Rule C: Indeterminacy arises only where the native language lacks explicit identity/criteria
  for individuation; where there are demonstratives, count nouns with individuation
  built in, reference is determinate (a "criterial" or Davidsonian response).

  - Rule D: The indeterminacy is merely verbal/pragmatic — it shows only that there''s
  no fact of the matter about meaning, not that there are two equally good translation
  manuals that differ (Davidson: there is no disagreement because the alternatives
  aren''t really rival claims).

  - Rule E: Indeterminacy follows from holism plus the possibility of compensating
  adjustments elsewhere (the "Jabberwocky" argument), so it applies wherever the language
  is rich enough to permit reassignment of connectives/terms globally.

  - Rule F: Stimulus meaning fixes observation sentences; only "theoretical" sentences
  are indeterminate (a two-tier view).


  Now I need a set of verdicts consistent with more than one of these, and a new case
  where two diverge. Good.


