  has to decide whether the release goes ahead. It''s about ten to fifteen flags a
  week, most of them small, and each one costs an engineer a couple of days to chase;
  a false positive delays a release and gets us shouted at, a false negative means
  we''ve shipped something whose safety property isn''t actually the thing producing
  the behaviour. The people running the checks are ML engineers, no philosophy, and
