  "(a) The reversal of fortune is the finding that the parts of the world that were
  richest around 1500 — the Aztec and Inca empires, India, China — are mostly not
  the richest today, while the places that were relatively empty and poor in 1500,
  like North America, Australia and New Zealand, are now among the richest. Acemoglu,
  Johnson and Robinson use this to argue against geography. Their point is that geography
  obviously didn''t change between 1500 and now: the climate, the soil and the disease
  environment of Mexico are the same as they ever were, so geography can''t explain
  why the ranking flipped. What changed was the kind of institutions Europeans set
  up. In places where Europeans could settle in large numbers they rebuilt their own
  societies, with property rights, constraints on the state and markets open to new
  entrants; in places where they couldn''t settle they set up extractive states designed
  to pull resources and labour out, and those institutions outlived colonialism. Since
  institutions are made by people and could have been made differently, this basically
  settles it: the geography hypothesis is wrong and the fundamental cause is institutions.


  (b) To test this you can''t just regress income on some measure of property rights,
  because rich countries can afford good institutions as much as good institutions
  make countries rich. The trick is to find something that affects institutions but
  has no other effect on income today. They use the mortality rates of European soldiers,
  bishops and sailors in the colonies. Where mortality was high Europeans didn''t
  settle, and where they didn''t settle you got extractive institutions, so mortality
  predicts institutions; but nineteenth-century European mortality obviously has no
  effect at all on a modern economy''s GDP, so any correlation between the instrument
  and income must run through institutions. That''s what makes it a clean instrument.


  (c) The best evidence for the institutions view doesn''t come from regression at
  all. Korea was one country with one culture, one language and one geography until
  1945, and then the north got one set of institutions and the south another, and
  the income gap today is enormous. Because geography and culture are held constant,
  the difference has to be institutions. Cases like this show the scepticism in (c)
  is overdone: the culture explanation, which is mostly a restatement of Max Weber,
  can''t handle Korea, and Diamond''s guns, germs and steel story can''t either, since
  Diamond is really saying Europeans just had a better culture of innovation. What
