  The problem of logical omniscience: standard Bayesian/Kripkean epistemic models
  make an agent''s beliefs closed under logical consequence — knowing p and p→q entails
  knowing q; the agent knows all tautologies. This is unrealistic for humans. Solutions:
  impossible-possible worlds / non-normal worlds (Kripke''s own "impossible worlds"
  footnote, Rantala''s construed states, Hintikka''s "impossible possible worlds"),
  awareness logic (Fagin & Halpern), syntactic representations / belief bases (Konolige),
  fragmenting belief (Stalnaker''s "problem of logical omniscience" resolution: belief
  as a set of propositions but with the agent''s perspective fragmented), Ducrot...
  Also the dynamic epistemic logic approach: knowledge is not closed because it''s
  relative to a computational process — explicit knowledge as the result of a computation
  (e.g., "knowing" as having derived), and the idea that logical omniscience is fine
  as an idealization for some purposes (like the assumption of unbounded rationality
  in economics) but not others.


