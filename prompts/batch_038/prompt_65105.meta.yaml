  dependency graph, incremental recomputation, dirty/clean, cache invalidation. The
  agent''s belief state = a set of cached evaluation results; knowing a consequence
  = having it in the cache; the closure assumption = assuming the cache is fully populated
  with everything derivable, i.e., a perfect oracle for the transitive closure of
  the dependency graph. Solutions map: awareness logic = the cache only tracks keys
  you''ve declared as build targets; non-normal worlds = allowing the cache to hold
  entries that violate the semantics (unsound cache entries / stale values); belief
  bases / syntactic = the cache stores only explicitly computed results, and queries
  are recomputed on demand; fragmentation = multiple caches in different scopes that
  never share entries; dynamic epistemic logic = a build step that "runs the compiler"
  so closure is time-indexed, with computational cost.


