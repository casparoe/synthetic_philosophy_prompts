  Draft content:


  Section 1: The standard pedagogy. Simpson''s paradox: an association between T and
  Y present (or in one direction) marginally reverses when we condition on a third
  variable S, and hold within each stratum. Textbooks: the reversal shows association
  is not evidence of causation; the fix is to condition on the confounder. Standard
  examples: kidney stone treatments, Berkeley admissions, the batting-average example.
  The pedagogical message: disaggregate, always.


  Section 2: What the disaggregation rule actually rests on. Two distinct reasons
  a marginal contrast can mislead: (a) failure of exchangeability (confounding), and
  (b) non-collapsibility of the effect measure — the odds ratio can differ between
  crude and stratum-specific even in a perfectly randomized trial with a prognostic
  covariate, because the OR is not collapsible; the risk difference is collapsible,
  so under randomization with homogeneous effects the crude risk difference is a weighted
  average of stratum-specific ones and cannot flip sign. So the "reversal" that makes
  Simpson''s paradox dramatic is, for collapsible measures, always a sign of confounding
  or of selection, not merely of the measure''s algebra. I want to make this point
  precisely because it lets me say something about what a genuine case of the paradox
  must involve.


  Section 3: The taxonomy. Standard causal-inference pedagogy sorts third variables
  into two bins: confounders (common causes of T and Y — condition on them) and mediators
  (effects of T on the path to Y — don''t condition). I want to argue a third category
  is needed, which I call the constituted stratum: a variable S such that (i) the
  value recorded for a unit is produced in part by the very treatment process under
  study, and (ii) the recorded value is nonetheless our only measurement of a pre-treatment
  risk factor that we would otherwise want to condition on. S is at once a measurement
  instrument and a causal product of T.


  Section 4: The example. Two ambulance dispatch protocols, A (a rule-based computer-assisted
  triage protocol) and B (senior dispatcher discretion), compared on 30-day survival
  across a metropolitan service. Raw survival favours B. Stratify by the recorded
  acuity tier (Tier 1 critical ... Tier 4 minor), assigned at call-handling, and B
  looks better in every tier — but the assignment of tiers is made by the dispatcher
  using the protocol in question. Protocol A systematically assigns more calls to
  the critical tier (it is more sensitive), so A''s caseload within Tier 1 contains
  more marginal-patients who would have been Tier 2 under B, and B''s Tier 1 is sicker.
  Conditioning on recorded tier therefore compares unlike patients and produces a
  textbook reversal — but the reversal cannot be undone by conditioning, because the
  acuity that we would need to condition on is not recorded anywhere; and it cannot
  be dismissed as mediator bias either, because tier assignment is not a step on any
  causal path from dispatch protocol to survival: it is a description, produced by
  the treatment, of a state of the patient that existed before treatment.


  Section 5: Claim and normative upshot. In constituted-stratum cases the standard
  instruction — disaggregate — is actively harmful, and the marginal contrast is the
  honest one, provided it is interpreted as the effect of switching protocols including
  the effect on how cases get classified. This is not the total effect of interest
  to the ambulance authority? Actually I''d argue it is: the authority is choosing
  between protocols, and the protocol includes its triage behaviour; the classification
  is part of the treatment, not a pre-existing feature of the world. The general principle
  I want to defend: stratification is licensed only by variables whose values are
  invariant under the interventions being compared; where they are not, the marginal
  contrast is not a confounded estimate but the only well-defined one.


  Section 6: Anticipated objections (notes, not drafted): the objection that this
  is just mediator bias / "don''t condition on post-treatment variables" under a new
  name; the objection that the fix is a better measurement of acuity (a treatment-independent
  acuity score, e.g. from a clinician blinded to protocol) and hence that constituted
  strata are an engineering problem not a philosophical category; the objection that
  principal stratification handles this properly; the objection that in practice one
  can bound the bias.


