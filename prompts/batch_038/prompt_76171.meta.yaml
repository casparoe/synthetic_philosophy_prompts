  Structure of the prompt:

  1. Set up: who I am, what I''m writing, why I need this case.

  2. The specification of the case (the target verdicts).

  3. Constraints (realistic, length, no stipulated verdicts, no jargon in the scenario,
  no doomsday machines/perfect predictors/madman values, no appeal to reputational
  value or infinitely repeated interaction, must be presentable to a general reader,
  must be one I could put to a serving strategist and get a real answer).

  4. What to deliver: scenario; then a demonstration — state what the paradox of deterrence
  predicts and why, what the case shows, isolate the hidden premise; then which feature
  does the work; what happens if you remove it (the case must collapse back into the
  standard paradox); how a defender of the paradox would attack the case (best available
  reply, not a strawman).

  5. Epistemic request: separate settled from contested; don''t present contested
  views as consensus; flag where the case leans on a contested empirical claim about
