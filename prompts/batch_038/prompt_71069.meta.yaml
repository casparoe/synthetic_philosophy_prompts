  maxim of quantity, generalized conversational implicature vs particularized, "speaker
  meaning" (non-natural meaning), the cancellability/defeasibility test, the difference
  between "implicature" and "presupposition," the claim that Grice held a "literalism"/minimalism
  about what is said, and the post-Gricean critique (relevance theory, Levinson''s
  GCI, free enrichment). A plausible unfair summary might conflate: "Grice said that
  implicatures are just inferences we make, and anything implied is an implicature;
  he thought meaning is entirely a matter of what the speaker intends, and that what
  is said is nothing but the literal sentence meaning." Also a subtle error: claiming
  Grice thought the Cooperative Principle is a moral obligation, or that violating
  a maxim is always deceptive, or that implicature requires the speaker to intend
  to deceive.


