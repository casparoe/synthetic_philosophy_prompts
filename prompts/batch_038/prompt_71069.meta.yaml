  Let me make the thesis genuinely specific and non-standard:


  Thesis: The hinge of history hypothesis is evidentially self-undermining in a stronger
  sense than its proponents concede. Sketch:

  (1) Hinge claims require the claimant to assign a comparatively high probability
  to "my era is the era of maximum influence / decisive trajectory-shaping."

  (2) But reflection on the history of such claims shows every generation with the
  conceptual resources to formulate a hinge hypothesis has assigned high probability
  to its own era being decisive — the claim is generated by conditions (technological
  acceleration, self-conscious historiography, a literate class with a sense of futurity)
  that recur, not by conditions unique to being actually decisive.

  (3) So the probability that a given era formulates a hinge claim is much higher
  conditional on that era having those recurrent features than conditional on that
  era actually being decisive — i.e., the report is a poor likelihood ratio.

  (4) Therefore, once we learn that an era takes itself to be at a hinge, we should
  sharply discount its self-assessment; the discount is not merely a caution about
  bias, but defeats the main abductive support for the present hinge claim (which
  rests largely on the very sense of unprecedented transformation that step 2 explains
  away).

  (5) Corollary: the deflation is asymmetric — it does not similarly deflate mundane
  risk claims (pandemic preparedness) whose support comes from evidence independent
  of the era''s self-conception, but it does deflate claims whose evidential base
  is a felt sense of unprecedentedness plus lock-in mechanisms that are themselves
  era-relative.


