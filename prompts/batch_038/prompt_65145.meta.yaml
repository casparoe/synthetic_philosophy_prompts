  ---


  I am in my final year of high school and take part in a peer-assessment scheme for
  my ethics seminar: before our instructor collects the practice essays, each of us
  marks a partner''s response to the assigned question using the same rubric. I would
  be grateful for an independent marking of the pair below, since I want to be sure
  my own comments are fair.


  Question: "Is a genuine moral dilemma — a situation in which an agent is morally
  required to perform each of two actions that cannot both be performed — possible?
  Address both the logical and the phenomenological aspects."


  Partner''s answer (about 350 words):


  "A genuine moral dilemma seems impossible at the level of logic but unavoidable
  at the level of experience, and I think the tension is only apparent.


  In standard deontic logic, obligations are modelled with a necessity operator, so
  the principle that if one proposition implies another, the obligation of the first
  implies the obligation of the second, is built into the system. If an agent is obliged
  to do A and obliged not to do A, agglomeration gives the obligation to do both A
  and not-A, and since a contradiction implies anything, the logic makes every act
  obligatory: the system collapses. So a theory that admitted real dilemmas would
  be useless. The standard way out is to give up agglomeration or to weaken the logic
  itself, and there are deontic systems designed to hold conflicting obligations without
  explosion; but the price is that these systems can no longer deliver a unique answer
  about what to do, which is what we wanted a moral theory for.


  Phenomenology pulls the other way. Sartre''s student, torn between his mother and
  the Resistance, does not experience a puzzle about which of two prima facie duties
  is stronger; he experiences two demands, and whichever he chooses he has failed
  someone. Williams calls the feeling left over in cases like the lorry driver''s
  agent-regret. Agent-regret is a form of guilt: to feel it is to recognise that one
  has done something wrong, and that is exactly why the driver, though he broke no
  rule, is blameworthy. The residue of such feelings after the best possible choice
  shows that the obligation not chosen never stopped binding. Ross''s prima facie
  duties do not help here, since Ross thinks of them as genuine obligations that really
  conflict, and only our ignorance hides which one wins.


  So my conclusion: dilemmas are logically impossible but morally real, and the honest
  position is to treat the logical result as an artefact of an over-ambitious formalism."


  Please grade the answer out of 10 and give point-by-point comments justifying the
  grade, identifying any claims that are inaccurate or that do not follow, as well
  as what the answer gets right.


