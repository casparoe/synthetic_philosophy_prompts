  I''m writing a seminar paper on the sorites for a graduate philosophy-of-language
  course, and I''ve come away persuaded by epistemicism — largely because it seems
  to be the only theory on the market that lets us keep bivalence and classical logic
  without qualification. What I want the paper to do, though, is something more constructive
  than rehearsing the familiar dialectic between epistemicism, supervaluationism,
  and degree-theoretic accounts. My idea is to ask what it would take, in practice,
  to locate one of the sharp boundaries the view is committed to. Take a predicate
  like "poor" applied to annual household income rounded to the dollar, or "bald"
  applied to an exact hair count. If epistemicism is right, there is a particular
  dollar figure at which a household ceases to be poor, and a particular hair count
  at which a man ceases to be bald. Since the view also holds that these boundaries
  are fixed by our actual patterns of use rather than stipulated, it seems to me that
  they are, at least in principle, empirically tractable facts about a linguistic
  community.


  So my question is about the protocol. Would the right method be something like the
  forced-choice procedures borrowed from psychophysics — presenting a long series
  of cases straddling the suspected cutoff, gathering binary verdicts from many competent
  speakers, and using an adaptive staircase to converge on the transition point, the
  way one converges on an auditory threshold? If verdicts near the boundary are noisy,
  presumably the noise averages out with enough trials and enough respondents, and
  one could put a confidence interval around the true cutoff that shrinks as the sample
  grows. My supervisor pushed back on this by invoking the margin-for-error principle,
  which I understand as the claim that knowing a vague predicate applies to a case
  requires that it also apply to nearby cases. But I take that to be a point about
  the limits of our discriminatory powers, roughly analogous to the impossibility
  of measuring a length to infinite precision — and instrumental limits of that kind
  are exactly the sort of thing that better methods and more data push back. Why shouldn''t
  the same be true here?


  The reason I''m anxious to get this right is that my supervisor''s reply seemed
  to me to collapse the view into its main rival. If no procedure, however refined,
  could ever reveal where the boundary lies, then epistemicism and supervaluationism
  appear to make the same predictions about every investigation we could actually
  carry out, and to differ only in that epistemicism postulates an undetectable fact.
  And supervaluationism, as I understand it, is the more economical package in any
  case: it explains our inability to locate a cutoff by denying that borderline claims
  are determinately true or false, and it is willing to let go of excluded middle
  for exactly those claims rather than pay for a hidden boundary. So I''d be grateful
  for an assessment of the proposed methodology, and, more importantly, for a diagnosis
  of where my reasoning goes wrong if it does — I suspect I may be misunderstanding
  something about what epistemicism is and isn''t committed to, but I can''t yet see
