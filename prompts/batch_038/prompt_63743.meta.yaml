  "I work twenty hours a week in my university library''s cataloging and metadata
  unit, and I''m also in a cognitive science seminar on concepts, where we''ve been
  reading the view associated with Hofstadter''s Copycat project: that concepts are
  fluid, that their boundaries shift with the context of use, and that much of ordinary
  reasoning consists of controlled slippage from one concept to a neighboring one
  rather than the application of fixed definitions. The cataloging rules I apply every
  day seem to assume the opposite. Each physical volume receives exactly one call
  number and therefore stands in exactly one place on the shelf; when a book treats
  two topics in roughly equal measure, our classification scheme tells me to take
  the number for whichever topic comes first in the schedule; a work is placed by
  the discipline it is written from rather than by the subject matter it mentions;
  and for topics that cut across disciplines the schedule designates a special holding
  number. Meanwhile the subject headings I assign come from an authorized list in
  which each preferred term has scope notes fixing its range, is nested inside broader
  terms, and explicitly rules out near-synonyms by redirecting them to the preferred
  heading. And yet the same monograph is routinely classified differently by two competent
  libraries, with no sense that either has made a mistake.


  As a philosopher of concepts who also knows something about knowledge organization,
  please think this through carefully and tell me: what view of concepts does this
  practice presuppose? Does it commit us to determinate boundaries and a single dominant
  ''aboutness'' per work, or is the single call number merely a concession to the
