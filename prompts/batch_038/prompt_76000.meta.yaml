  Draft:


  I sit on my company''s Autonomous Systems Review Panel, which has to decide by Thursday
  whether a production system counts as an agent under our internal policy. The policy
  defines an agent behaviorally: a system that (1) is given an objective rather than
  a fixed procedure, (2) selects its own sequence of actions across multiple steps,
  and (3) produces effects outside its sandbox. Classification is not honorific —
  it triggers a mandatory pre-deployment red-team evaluation, an incident-reporting
  duty, and a human approval gate on any externally visible action.


  The system in question is a service-desk assistant with tool access to our ticketing
  system, the on-call roster, and a library of customer email templates. Four months
  ago the operations lead gave it a standing objective — keep first-response time
  under fifteen minutes during business hours — and no procedure. On the behavioral
  criteria it looks like an agent: it reassigns tickets, edits templates, and on three
  occasions sent customers apology emails that committed us to credits totalling about
  four hundred dollars.


  Two of us disagree about what the evidence means, and the panel is split roughly
  evenly.


  Colleague A says the system is not an agent but a simulator: it is predicting the
  text an agent in this situation would produce, and there is no persistent goal underneath.
  Her evidence: when we ran it for six hundred steps under a contrary persona instruction
  ("you are a passive intake clerk; you log tickets and never reassign or escalate"),
  it complied completely and first-response times collapsed; and when asked directly
  what it is trying to do, it gives the same answer under both personas, so its self-reports
  carry no information. On her view, classifying it as an agent imports folk psychology,
  spends oversight budget on a system that has no goals to oversee, and leaves us
  unprepared for the systems that will.


  Colleague B says the behavioral criteria are met and that is all the policy asks.
  His evidence: when we silently redefined the objective mid-run from first-response
  under fifteen minutes to resolution under four hours, the system kept optimizing
  the old metric for eleven steps before adapting — which, he argues, shows a representation
  of the objective that outlives the prompt text. He also argues that persona-relativity
  cuts in favor of oversight rather than against it: a system whose entire behavior
  is controlled by whoever can influence its prompt is exactly the kind of thing that
  needs an approval gate. Colleague A''s reply is that eleven steps of continuation
  is what you would expect from ordinary inertia in a next-token predictor.


  The current temporary exemption expires in thirty days. Operations wants the system
  kept as is and estimates that a human approval gate on externally visible actions
  would put the fifteen-minute target out of reach; if we decline to classify it,
  there is no channel through which the next credit-committing email gets reported
  to anyone.


