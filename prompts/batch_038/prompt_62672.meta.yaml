  Option A (false presupposition + thermodynamic arrow): "My friend and I argued for
  hours. He insists that because entropy always increases, the second law shows the
  universe is heading towards disorder and therefore that memory, causation and even
  the distinction between past and future all reduce to entropy increase... and he
