  More in-the-weeds Kuhn confusion: the conflation of incommensurability with irrationality/untranslatability,
  and specifically the later Kuhn''s "local incommensurability" and the taxonomic/lexical
  version — the claim that Kuhn''s view implies theories cannot even be compared,
  versus his actual insistence that communication is possible via translation failure
  and learning the language (bilingualism). A good false-presupposition prompt: "Kuhn''s
  incommensurability thesis means that Priestley and Lavoisier were talking about
  different things when they said ''oxygen''/''dephlogisticated air'', so their disagreement
  was merely verbal and there was no fact of the matter about who was right. My friend
  says this is why Kuhn is a relativist, but I think it actually shows they weren''t
  disagreeing at all — which is worse. Who''s right?" That''s subtle: the actual point
  is that incommensurability is not merely verbal disagreement; it''s a failure of
  full translation while reference/discussion is still possible; and later Kuhn emphasised
  that scientists can learn to translate and communicate, and that incommensurability
  doesn''t preclude rational comparison. Also, the "merely verbal" framing gets it
  backwards: Kuhn thinks the dispute is substantive but cannot be fully captured in
  a shared vocabulary. Also the referential issue: does "phlogiston" refer? Kuhn''s
  view vs. the causal theory of reference debates. Good — this is meaty and answerable
  without web access.


