  Memo draft:


  "I sit on the scientific review panel of a mid-sized research funder... We have
  before us a proposal in human behavioural ecology that seeks four years of funding
  for a comparative study of a putative adaptation..." Need concreteness without being
  ridiculous. Let''s design the case:


  Proposal: to test whether a cognitive bias (say, a tendency to over-detect patterns/agents
  in noise — "hyperactive agency detection") is an adaptation for predator/conspecific
  detection. Evidence offered: (a) the bias appears in all cultures studied, (b) it
  appears early in infancy, (c) it is heritable in twin studies, (d) it is functionally
  apt (false positives are cheaper than false negatives), (e) a positive correlation
  between the strength of the bias and a proxy for ancestral predation pressure across
  14 populations.


  Reviewer 1 (a phylogeneticist/statistician) recommends rejection: the correlation
  across 14 populations is not controlled for shared ancestry/non-independence, and
  universality + heritability + early development are equally predicted by the trait
  being a by-product of general associative learning or of a shared developmental
  constraint; the "error management" argument is unfalsifiable as stated because it
  works for any bias in either direction (this is the classic critique: error-management
  arguments can rationalise any direction of bias — actually they predict a direction
  based on asymmetry of costs, but the critique is that cost asymmetries are assigned
  post hoc). Reviewer 2 (a behavioural ecologist) recommends funding: says demanding
  proof of adaptation before funding is a philosophical straitjacket; the proposal
  includes a proper experimental manipulation; says the "spandrel" objection has become
  a shibboleth used to police a research programme rather than a scientific objection.


  Panel''s problem: our guidelines say the panel must assess whether the "central
  hypothesis is testable and the evidence offered adequate to it" — no more. And the
  panel chair wants a decision memo recommending fund/reject/fund-with-conditions,
  with criteria the panel can actually apply to future proposals, and a fair treatment
  of reviewer 2''s worry (that methodological gatekeeping is being used as a proxy
  for disagreement with the whole research programme).


