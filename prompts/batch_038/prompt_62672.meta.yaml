  it obvious that..." Hmm, the false presupposition should be subtle. A classic subtle
  confusion: "Since the microscopic laws are time-reversal invariant, the second law
  can''t be a real law — it must be a mere statistical fluke that happens to hold,
  so the arrow of time is just an artefact of our ignorance / of the coarse-graining
  we choose. Therefore time''s direction is subjective. Why then do cosmologists treat
  the Past Hypothesis as a lawlike posit?" Or: "Boltzmann''s fluctuation argument
  shows we''re almost certainly Boltzmann brains, so my friend says..." Or the confusion
  between "entropy of the universe increases" and "the universe tends to disorder"
  plus the false idea that living organisms "violate" the second law. That last one
  is too well-trodden (models will have seen it a million times).


  A better, more in-the-weeds false presupposition: the idea that the thermodynamic
  arrow is explained by the universe''s expansion, i.e., "since the universe is expanding,
  that''s why entropy increases; so if the universe contracted, time would run backwards
  and we''d remember the future." That''s a genuine confusion that has a well-known
  rebuttal (Gould/Hawking''s position change: Hawking''s "arrow of time" discussion
  in A Brief History of Time — he admits he made an error; also the point that contraction
  needn''t reverse the arrow, and the arrow depends on the low-entropy boundary condition,
  not on expansion per se). Also the confusion of "entropy increases because the universe
  expands" — expansion doesn''t straightforwardly produce entropy increase; what matters
  is the gap between actual entropy and maximum possible entropy (gravitational degrees
  of freedom, Penrose''s Weyl curvature hypothesis). Careful: Penrose''s Weyl curvature
  hypothesis is well-known enough.


