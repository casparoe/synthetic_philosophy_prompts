  and that if the expansion ever reversed into a contraction, entropy would begin
  to decrease, records would un-form, and we would (as he put it) remember the future.
  He further said that since the microscopic dynamical laws are time-reversal invariant,
  the second law has no lawlike status at all and is merely a bookkeeping device reflecting
  our ignorance of microstates, which means the arrow of time is not a feature of
  the world but of our descriptions. He thinks he has refuted me and I think his position
  is incoherent — if the second law is just ignorance, why is it that nobody has ever
  exploited a fluctuation to build a perpetual motion machine? Please tell me where
  each of us has gone wrong..."


  That embeds several confusions: (1) that entropy increase is explained by expansion
  — actually the relation is subtle; expansion alone doesn''t guarantee entropy increase,
  what matters is the entropy gap and gravitational clumping (the maximum entropy
  grows faster than the actual entropy as the universe expands); (2) that contraction
  implies a reversed arrow (Hawking''s retracted claim; also the point that a contracting
  phase would still have boundary conditions set by the low-entropy Big Bang; time-symmetric
  cosmologies); (3) that records/memory direction is explained by entropy increase
  — actually this is a legitimate view (memory requires entropy-producing processes;
  the "record" argument, e.g., from Reichenbach''s branch systems, and the fact that
  recording is an irreversible process). So the asker isn''t entirely wrong; (4) that
  reversibility/invariance of micro laws + subjectivism about the second law means
  the arrow is not real, versus the fact that you need a low-entropy boundary condition
  (Past Hypothesis) as an objective contingent posit; the "ignorance" view still needs
  to explain why the initial state was special — the statistical-mechanical account
  (Boltzmann''s) requires the Past Hypothesis to avoid the Boltzmann brain / fluctuation
  problem. And "why has nobody exploited fluctuations" — because fluctuations large
  enough are fantastically improbable, and the point is that the asymmetry needs explaining
  rather than being explained away.


