  Type: interview questions. Asker hosts something (a history-of-economic-thought
  podcast / a book-talk) and the guest is an unnamed author who defends a Berkeleyan
  token theory of money (maybe a historian of economic thought who argues Berkeley''s
  Querist gives a genuine theory of money that anticipates chartalism/MMT). Questions
