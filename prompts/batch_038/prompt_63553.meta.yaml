  Real tensions to build in:

  1. Circularity / what makes tokens effective: Query 23 says money''s true idea is
  altogether that of a ticket or counter, rejecting intrinsic value, commodity, standard,
  measure, pledge. But Berkeley elsewhere treats money as "a pledge" — hmm, no, he
  rejects that. If money is a counter with no intrinsic value and is not a pledge,
  then what obliges the next person to accept it? Berkeley leans on authority/the
  state and on fashion/want ("whether it be not the opinion or will of the people,
  exciting them to industry, that truly enricheth a nation"). The tension: opinion/will
  vs. the state''s imposition. A modern chartalist says taxes drive money; Berkeley
  says the appetite for consumption and fashion drive it. So question: does the guest''s
  Berkeley have an account of acceptability, or does he substitute the problem (why
  is gold valuable?) with a new one (why are tokens valued?)? And the follow-up keyed
  to the likely answer: "He''ll say the state''s authority fixes it — press: then
  what limits the state, given that he also says arbitrary re-denomination of coin
  is a public cheat (query 28)?" That''s a nice one: Berkeley says arbitrary changing
  denomination is a public cheat, yet his token theory seems to make denomination
  purely arbitrary. That''s a genuine, sharp tension.


  2. Circulation vs. hoarding: query 22 — less money swiftly circulating equals more
  money slowly circulating. Berkeley denies money a store-of-value function in itself;
  but if velocity can compensate, then the quantity theory collapses — but also, what
  if people hold money out of fear? On a pure ticket view, holding a ticket you don''t
  intend to redeem is senseless, yet people do it. Follow-up: does Berkeley have room
  for precautionary demand?


  3. Quantity and price level: query 24 — value/price is a compounded proportion,
  directly as demand and reciprocally as plenty. So Berkeley has a supply-and-demand
  theory of prices; but he also wants more paper issuance to promote industry. Is
  that inflationary? Does he think more tickets raise prices (query 24 implies) or
  raise industry? The tension between his nominalist token theory and his proto-quantity-theory:
  if money is only a counter, then adding counters can only change the scale of reckoning,
  not real activity — yet Berkeley expects the new bank''s issue to stir industry.
  That''s the classic objection (a "money illusion" charge, later Keynesian-friendly
  readings). Great question.


  4. The bank project: a national bank issuing paper against subscriptions to pay
  off national debt — the practical failure (query 226 notes it''s really a private
  bank; the JSTOR article "Why Did Berkeley''s Bank Fail? Money and Libertinism in
  The Querist"). Question on confidence/convertibility: what backs the paper if not
  specie, and what happens when confidence runs? Berkeley''s own text worries about
  whether notes will pass.


