  **Against the Event**


  *1. The event model*


  Most moral thinking about insecticide use takes a single application as its unit
  of analysis. A field is sprayed; a number of insects die; the deaths are harms;
  the harms are summed; the sum is the moral cost of the act. Call this the event
  model. It is not a theory anyone argues for, which is part of why it is worth examining:
  it is a default, absorbed from the paradigm cases of animal ethics that involve
  mammals.


  Those paradigm cases do fit the event model. If you shoot a dog, or trap a deer,
  or confine a pig, there is an identifiable victim who existed before your act, a
  counterfactual in which that victim continues to live, and a harm that is local
  in time and attributable to you. Three features, then: identification, continuation,
  and boundedness.


  *2. None of the three survive*


  Insect population biology denies all three.


  Identification. In a species that lays hundreds or thousands of eggs, the individuals
  whose fates a control decision determines largely do not exist at the time the decision
  is made. The decision is not about who dies; it is about who will be born. Any accounting
  framed in terms of victims is therefore counting the wrong population.


  Continuation. For most insects, the counterfactual to a quick death is not a completed
  life. Juvenile mortality is enormous, and the causes are various — predation, parasitism,
  disease, desiccation, starvation, and, where relevant, the insecticide. The realistic
  comparison for an insect killed by a spray is not an insect that lives out its natural
  span; it is an insect that dies anyway, somewhat later, in a somewhat different
  way. The morally significant variable is therefore not death versus life, but death-mode
  versus death-mode: how painful, how prolonged, how many.


  Boundedness. Because an intervention alters the population, its consequences do
  not stop with the individuals it kills. They propagate through every subsequent
  generation for as long as the alteration persists, which may be indefinitely. The
  aggregate of those downstream effects can easily exceed the direct deaths, in either
  direction.


  *3. The trajectory model*


  The alternative unit is the trajectory. Instead of comparing sprayed with not-sprayed
  at a moment, compare two population histories extended through time, and ask which
  one contains more disvalue summed over all the insects who will ever live along
  it.


  Once the unit is the trajectory, interventions fall into at least three classes
  that the event model treats as interchangeable:


  Acute lethal interventions kill existing individuals and typically permit rebound.


  Suppressant interventions — including sterilants, growth regulators, and prophylactic
  seed treatments — reduce reproductive output rather than killing adults outright.
  (As I remember it, neonicotinoid seed treatment now covers something like the overwhelming
  majority of US maize acreage and a third to a half of soybean acreage, applied as
  a matter of routine rather than in response to observed pest pressure; I need to
  check this, but the shape of it is what matters.) Suppressants change how many insects
  there will be.


  Habitat interventions change carrying capacity — host-plant composition, field margins,
  overwintering sites — and thereby change everything downstream of them, including
  the fates of insects no one has touched.


  The upshot is counterintuitive in both directions. The acute spray, which is what
  the event model was built to condemn, may be the least consequential of the three.
  The intervention that merely prevents insects from coming into existence may be
  the most consequential — because it is the one that most directly sets the number
  of bad lives that will be lived. But its sign is not knowable in advance. It depends
  on whether the life of a typical wild insect is net-negative, and on how the composition
  of deaths changes when density changes.


  *4. What this does to the two camps*


  To the conventional critique: the standard objection to insecticides inherits the
  event model. It counts deaths and concludes harm. On the trajectory model, the objection
  does not merely get a number wrong; it uses the wrong currency. I want to be careful
  here, because the point is easy to abuse. This is not a defense of insecticides.
  It is the claim that the familiar argument does not establish what it is taken to
  establish, and that a sound argument would have to be built on death-mode rather
  than death-count: not that spraying kills, but that it kills badly, or slowly, or
  in numbers that a rebounding population cannot absorb.


  To the interventionists: the trajectory model is their own logic taken seriously,
  and it bites them harder than it bites their opponents. If the aggregate over time
  is what matters, then the calculation is dominated by a term whose sign nobody knows,
  and the uncertainty is not the kind that shrinks with more data, because the relevant
  data concern the welfare of animals we cannot observe in the states that matter.
