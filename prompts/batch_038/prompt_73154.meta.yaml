  Essay working title: "Against the Event: Rethinking the Unit of Analysis in Insecticide
  Ethics"


  Thesis: Debates about the ethics of insecticide use — both the ordinary animal-welfare
  critique and the newer "wild animal suffering" interventions literature — share
  an unexamined assumption: that the morally relevant unit is the act of application,
  and that its harm is measured by the deaths it causes. I''ll call this the "event
  model." The event model is wrong, and replacing it with a "trajectory model" changes
  the conclusions in both directions at once: it makes some insecticide uses look
  worse than the event model implies and others look better, and — the uncomfortable
  part — it makes the sign of the whole question underdetermined by anything we currently
  know.


  Section 1: The event model and why it''s intuitive. It inherits its structure from
  a paradigm case that actually fits it: killing a dog, shooting a deer, the individual
  animal in a lab. In each, the baseline is a life that continues, the act interrupts
  it, and the harm is localizable to identified individuals. The event model imports
  three features: (i) an identifiable victim, (ii) a counterfactual in which that
  victim goes on living, and (iii) a harm that is bounded in time and attributable.


  Section 2: None of the three survive contact with insect population biology.

  (i) The victim is not identifiable — the relevant individuals don''t exist yet at
  the time of the decision; the decision determines which insects will exist.

  (ii) The counterfactual is not "life continues" — for r-selected insects with enormous
  broods, the modal fate of an egg is death before reproduction, from predation, parasitism,
  disease, desiccation, or starvation. The counterfactual to an insecticide death
  is usually another death, soon, of a different kind. So the harm is not death-vs-life
  but death-mode-vs-death-mode: how bad, how long, how many.

  (iii) The harm isn''t bounded — because the intervention changes the population
  trajectory, its effects propagate through all subsequent generations for as long
  as the change persists, and can be larger in aggregate than the deaths directly
  caused.


  Section 3: The trajectory model. Compare not "sprayed" vs "not sprayed" but two
  population trajectories over time, and ask which produces more bad experiences summed
  across all the insects who will ever live along it. Three classes of intervention
  emerge:

  - Acute lethal: kills existing insects, population rebounds (or not).

  - Suppressant/sterilant: reduces reproductive output; may produce fewer insects
  total, hence fewer bad lives, but each remaining one may face a worse environment
  (density-dependent effects: less competition, but also fewer predators supported,
  and possibly slower death).

  - Habitat/host-plant modification: changes carrying capacity, which changes everything
  downstream.

  Key point: on the trajectory model, the acute insecticide application can be the
  *least* consequential of the three, and the one that "prevents insects from existing"
  can be the most consequential — but its sign depends on whether insect lives are
  net-negative, which is an empirical question we cannot currently answer, and which,
  if it were answerable, would be answerable only in expectation over enormous uncertainty.


  Section 4: What this does to two camps.

  - Against the conventional animal-protection critique: the critique of insecticides
  inherits the event model, so it counts deaths and concludes harm. On the trajectory
  model, deaths are the wrong currency and the count is not the wrong number, it''s
  the wrong kind of number. Note carefully: this is not a defense of insecticides.
  It''s the claim that the standard argument against them doesn''t work, and that
  a working argument would have to look completely different — it would have to be
  about death-mode, not death-count.

  - Against the wild-animal-suffering interventionists: the trajectory model is their
  own logic taken seriously, and it bites them. If the total is what matters, then
  the sheer scale of the uncertainty means the expected-value calculation is dominated
  by a term whose sign nobody knows. Their own framework, applied without flinching,
  yields suspension of judgment rather than action. The most common response — that
  the probability of net-negative lives is high enough to act — smuggles back the
  event model, because it treats "we''re probably reducing suffering" as a claim about
  identified individuals rather than about a trajectory.


  Section 5: The uncomfortable residue — the one place where I think the trajectory
  model might condemn something I want to permit. If death-mode matters more than
  death-count, then an intervention that kills many insects quickly and painlessly
  may be *preferable* to one that suppresses a population slowly, leaving insects
  to starve, be parasitized, or desiccate over a longer period. That''s a conclusion
  with genuinely repellent implications (it licenses killing as an improvement, and
  it treats painless mass killing as a welfare gain), and I suspect it''s a reductio
  of the trajectory model rather than a discovery. I haven''t figured out which. The
  essay currently ends by saying both models fail and that we''re left with a "procedural"
  position: because we cannot determine the sign, the burden falls on the intervenor
  to justify acting under that uncertainty, and precaution is asymmetric — not because
  insects might be fine but because we can''t undo a trajectory change.


