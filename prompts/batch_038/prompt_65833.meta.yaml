  - the flaw problem: Plutarch''s method deliberately includes the faults of his subjects,
  and his stated rationale (paraphrase: small incidents, a saying, a joke reveal character
  better than the biggest battles) — so the account must explain why detail of a certain
  kind matters more than magnitude;

  - the transfer problem: the exemplar''s situation (a Roman general, a desert ascetic)
  doesn''t resemble the reader''s, so what''s supposed to carry over?

