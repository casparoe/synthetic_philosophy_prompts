  Prompt draft (casual, with a typo):


  "I''m hosting a grad-student-run podcast that interviews people about early modern
  political thought — small audience, mostly our dept. Next week''s guest is a philosopher
  who has a pretty distinctive reading of Pascal on justice and force. Her thesis,
  roughly: Pascal thinks there really is such a thing as justice, but after the Fall
  we have no reliable way of recognizing it, so force steps in as a substitute *criterion*
  — and that''s why he says we''ve made what is strong into what is just rather than
  what is just into what is strong. She also insists the political advice and the
  religious advice in the Pensées are the same move: obey/go through the motions even
  while withholding inner assent, because habit is the only channel we have left.


