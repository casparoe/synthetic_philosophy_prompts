  supplies a criterion of justice because we''re epistemically blind, what makes it
  a *justified* criterion rather than a mere coping strategy, and can she say anything
  about when obedience runs out (i.e. is there any room for resistance, or is Pascal
  a quietist all the way down?).

  - at least one on the imagination stuff — the magistrates'' robes, the ermine, the
  fact that authority works on people through imagination rather than reason. Question:
  if the populace''s belief in legitimacy is manufactured by theater, doesn''t that
  undercut her claim that they''re tracking anything real?

  - at least one on the Pyrenees/river point: does ''truth on this side of the mountains,
