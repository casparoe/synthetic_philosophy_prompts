  Fitch''s paradox of knowability: The knowability principle (KP): ∀p (p → ◇Kp). From
  the assumption that there is some unknown truth (∃p(p ∧ ¬Kp)), classical logic derives
  a contradiction, so if all truths are knowable then all truths are known. The derivation:
  take p ∧ ¬Kp, call it q. q is a truth. By KP, ◇Kq. But Kq entails K(p ∧ ¬Kp) which
  entails Kp ∧ K¬Kp; and K¬Kp, given factivity and... Actually the key step: K(p ∧
  ¬Kp) → Kp ∧ K¬Kp, and factivity of K gives p ∧ ¬Kp, i.e., ¬Kp — contradiction with
  Kp. So ◇Kq is impossible; hence q cannot be knowable; hence by KP contrapositive,
  q is not true; hence ¬∃p(p ∧ ¬Kp), i.e., all truths are known.


