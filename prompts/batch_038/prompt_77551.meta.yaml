  Write a poem about the asymmetry between finding a solution and checking one — the
  intuition that sits underneath the question of whether every efficiently verifiable
  problem is efficiently solvable — under the following constraints.


  Scenario. The speaker is a charge nurse on a hospital ward, building next month''s
  roster by hand at a kitchen table. The constraints are ordinary and human: one nurse
  cannot work nights, two cannot be paired after an argument, someone needs a particular
  weekend off, everyone is owed a minimum stretch of rest between shifts, and the
  ward cannot run short on any day. Give the reader enough of these to feel their
  weight, but do not turn the poem into an inventory.


  Form. The poem has five stanzas, of 1, 2, 4, 8, and 16 lines respectively — 31 lines
  in total — and every line is in iambic tetrameter. Each stanza handles twice as
  many people and twice as many days as the one before it, so that the growth of the
  poem is the growth of the problem. The meter, by contrast, never changes: the cost
  of a single line stays fixed while the number of lines doubles. That contrast —
  bounded per step, unbounded in total — is the argument the form is making, and it
  should be felt rather than announced.


  Closure. The sixteen-line final stanza must run as a single unbroken utterance with
  no full stop until its last line, and its last line must repeat, word for word,
  the single line that opened the poem (the punctuation may differ, so that a line
  that stood alone as an assertion returns as a clause inside a longer sentence).
  The effect I want is that the thing the speaker would have recognized instantly
  had it been handed to her at the start is what the search eventually arrives at,
  at a cost that the reader has just paid by reading thirty more lines.


  Accuracy. The poem must be right about the concept, in these respects:

  - The difficulty is not impossibility. Nothing here is beyond the speaker in principle;
  the roster exists, and for four nurses she could have found it in an afternoon.
  What fails is the fit between the size of the problem and the time a life allows.
  Show the transition from manageable to unmanageable as the stanzas grow.

  - The gap is between search and verification. The opening line should be something
  the speaker can check at a glance — the shape of a promise she cannot manufacture
  — while the intervening stanzas are the manufacture.

  - The blow-up is a worst-case, large-scale phenomenon, not a claim that every instance
  is hard. A specialist should see that you know the difference between an input size
  that is merely inconvenient and one that is asymptotically hopeless.

  - Do not settle whether the gap is permanent. Leave open, in the poem''s last movement,
  whether this is a fact about the world or a fact about the methods available to
  someone at a kitchen table at midnight.


  Diction. Do not use the words polynomial, exponential, complexity, algorithm, intractable,
