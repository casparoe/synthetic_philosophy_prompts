  (1) M: Malthus is the paradigm of a theory that was right but early. For essentially
  all of recorded history up to about 1800, his mechanism held: any technological
  improvement raised real incomes, incomes above subsistence raised population, and
  population growth drove incomes back down. Real wages in England were no higher
  in 1800 than in 1300. The theory wasn''t refuted by history; it was confirmed by
  five thousand years of it and then interrupted.


  (2) J: "Interrupted" is doing a lot of work. A theory whose central empirical prediction
  — that population growth will press against food supply and immiserate — failed
  for two centuries in exactly the country where it was written, and where the author
  said it would fail within 25 years, is a refuted theory. Adding "unless something
  happens to break the mechanism" is not a rescue; it''s an admission that the mechanism
  has no modal force.


  (3) M: But that''s not how the model is structured. In Malthus, technology isn''t
  a variable the theory predicts; it''s an exogenous input. The claim is a conditional
  one: given the rate at which food production can be increased, population will outrun
  it. When agricultural yields and industrial technology changed, that changed the
  input, not the law. You wouldn''t say a supply-and-demand model was falsified because
  the supply curve shifted.


  (4) J: Then the theory has been drained of content, because it can no longer say
  anything about when the shift will happen — and Malthus did say. He gave a doubling
  period of 25 years and he did forecast immiseration. And the modern descendants
  that are cited as vindicating him (the unified growth models that generate the demographic
  transition endogenously) are new theories that make new assumptions about human
  capital and fertility choices; crediting Malthus for them is like crediting Democritus
  for the discovery of the atom''s internal structure.


  (5) M: There''s a difference, though: those models are built on the very mechanism
  Malthus identified — the feedback between resources, population, and the tradeoff
  between the quantity and the quality of children — and they yielded a prediction
  he never made, namely that the escape from the trap would come with falling fertility
  rather than rising misery. On your own philosophy-of-science criteria, a program
  that generates novel predictions is progressive, not degenerate.


  (6) J: Or it''s a program that has been replaced by a successor which kept one heuristic
  device. And notice the asymmetry you''re relying on: if the trap had persisted,
  you''d call that a confirmation; since it ended, you call it a change in the exogenous
  variable. Either way the theory is safe, and that''s exactly what a theory that
  can''t be wrong looks like.


