  I have spent more years than I would care to admit reading rationalist blogs and
  their comment threads, and one phrase there functions as a conversation-stopper:
  ''there is no such thing as an uninformative prior.''


  It came up recently in a thread about estimating the failure probability of a first-of-its-kind
  engineering project: no base rates, no relevant historical analogues, one shot.
  One participant proposed starting from indifference over a bounded parameter and
  then updating on whatever evidence arrived. A second replied that Bertrand''s chord
  problem settled this in the nineteenth century — any prior you write down encodes
  substantive assumptions, indifference merely hides them, and so the whole exercise
  is guesswork in formal dress; better to admit you are guessing.


  I suspect that reply runs together several claims of very different strength, and
  that at most one of them is true. Could you take the slogan apart for me?


  What I would like:


  1. A menu of the distinct precise theses the sentence could express... For each,
  state it with its quantifiers explicit — invariance under which transformations,
  over which sample spaces, and "informative" cashed out in terms of what (influence
  on the posterior at finite sample size? arbitrariness of the partition? dependence
  on the parametrization? failure to be uniquely determined by the problem''s structure?).


  2. A verdict on each: platitude that no Bayesian disputes; substantive but defensible;
  or false, or at least not supported by the considerations usually offered for it.


  3. For each reading, whether it licenses the dismissal in my thread. In particular:
  does Bertrand''s paradox, with its three defensible-looking answers of 1/2, 1/3
  and 1/4, actually establish that indifference cannot determine a prior, or only
  that the question is ill-posed until the randomizing mechanism is specified? And
  what do invariance-based approaches — Jeffreys-style priors, transformation-group
  arguments, maximum entropy — do to the slogan: are they counterexamples to it, or
  just more respectable ways of being informative?


  4. Where the cube-factory puzzle (edges uniform between 0 and 1 cm, or volumes uniform,
  or surface areas uniform) fits: does it add anything to Bertrand''s lesson, or is
  it the same lesson about reparametrization?


  5. Your best guess at which reading the people who repeat the slogan actually mean,
  and whether they would accept your classification of it.


  Please don''t send me to the literature — I want the disambiguation itself, not
  a reading list. What I need at the end is a short statement of the strongest version
  of the objection that survives your analysis, and what the person proposing the
  indifference-based estimate could legitimately say back.


  ---


