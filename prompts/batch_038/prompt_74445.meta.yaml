  I am giving a ninety-minute paper at an interdisciplinary workshop on the ethics
  of armed conflict, and I want a Q&A preparation sheet rather than a defense of my
  view.


  My thesis has two halves. The first is revisionist and I expect little resistance
  to it in the room: the moral equality of combatants is false, and soldiers fighting
  for an unjust cause act impermissibly when they kill, however excusable they may
  be. The second half is what the paper is really about: the practice of treating
  combatants on both sides as moral equals should be preserved not only in the law
  of armed conflict but in the formation of soldiers — that is, the state should continue
  to train and address those it sends to fight as though killing enemy combatants
  were morally permitted, while knowing that it is not. My argument for the second
  half runs in three steps. (i) An in bello norm conditioned on the justice of one''s
  own cause cannot be applied by the people who must apply it, because ad bellum facts
  are contested, propagandized, and inaccessible from inside a firefight. (ii) A norm
  that cannot be applied will not be followed, and where it is not followed the restraints
  that presently limit killing in war — proportionality, discrimination, and above
  all the reciprocity by which each side''s compliance is conditioned on the other''s
  — come apart in predictable ways. (iii) The false norm is therefore load-bearing,
  and the correct response to discovering that it is false is not to discard it but
  to retain it while acknowledging what we are doing. The claim I know to be most
  exposed is the second part of (iii): that a state may deliberately inculcate a moral
  falsehood in the people it sends to fight. I call the cost of doing this the bad-faith
  burden, and I argue it is real, cumulative across a career, and still smaller than
  the cost of the alternative.


