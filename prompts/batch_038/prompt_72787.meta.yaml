  ---

  The game is simple. A fair coin is tossed until heads first appears. If heads comes
  on the first toss the player wins 2 ducats, on the second toss 4, on the third 8,
  and in general 2^n ducats if heads first appears on toss n. Since each of these
  outcomes has probability 2^-n, every term in the expectation contributes exactly
  one ducat, and the sum has infinitely many terms, so the expected value of the ticket
  is infinite. Expected-value reasoning therefore says a rational agent should pay
  any finite price to play, and should keep paying more as long as the game is on
  offer. Nobody would pay even twenty-five ducats, let alone a thousand. That gap
  between the arithmetic and ordinary judgment is the paradox; the name comes from
  Daniel Bernoulli''s 1738 paper in the Commentaries of the St. Petersburg Academy,
  though the problem was put to Montmort by his cousin Nicolaus a quarter-century
  earlier.


  Bernoulli''s move was to stop asking what the game pays on average and ask what
  it is worth. Money, he held, is not valued in proportion to its quantity: a gain
  of a thousand ducats means more to a pauper than to a rich man, so what enters the
  expectation should be utility, and utility grows more slowly than the money that
  produces it. With the logarithm as the utility of total wealth, the expected utility
  of the ticket becomes the sum of 2^-n ln(2^n), which is the sum of n ln2 / 2^n and
  converges; on natural-log utility a millionaire should pay about twenty dollars
  to play, a person with a thousand dollars about eleven. Willingness to pay thus
  becomes a function of the player''s circumstances rather than a property of the
  game, which is what the paradox seemed to deny. Cramer had proposed the square root
  instead a decade earlier, applying it to the gain rather than to total wealth, and
  the difference matters: on log utility the value of the ticket depends on how much
  you already have, which is why the pauper and the millionaire disagree.


  The reason the series converges is that the logarithm is bounded, and this is the
  real content of the resolution. Any bounded utility function makes every lottery
  finite, and any unbounded one leaves some lottery divergent; the moral is that risk
  aversion, i.e. concavity, is exactly what is needed, and once it is granted the
  paradox cannot arise. Menger made the same point from the other direction by showing
  that for any unbounded utility one can build a variant game, with faster-growing
  payoffs, whose expected utility still diverges. Samuelson''s reply is the practical
  one: no house has infinite reserves, so the true payoffs are capped at whatever
  the casino can actually pay, the expected value is finite for any real game, and
  utility theory was never needed to explain why the ticket is cheap. So the paradox
  is a mathematical artifact. That should also settle the worry people have about
  infinite values elsewhere in practical reasoning — Pascal''s wager, and the arguments
  about the astronomical size of the far future — since these too rest on payoffs
  that no finite world can deliver.

