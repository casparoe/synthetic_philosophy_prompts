  one worker in a shaft collapse, or abandon it, which will leave ten thousand commuters
  with a mild headache each for the better part of an afternoon. I judge: abandon
  the works. The headaches do not accumulate into anything that competes with a death.


  2. Paralysis. Same works, but abandonment will leave ten thousand people paraplegic
  rather than merely headachy. I judge: complete the works. Here the many do defeat
  the one.


  3. Fingers. Abandonment will leave ten thousand people each permanently deprived
  of the use of one hand. I judge: abandon the works. This is the verdict I am least
  comfortable with, since the difference between it and case 2 seems to me one of
  degree rather than kind.


