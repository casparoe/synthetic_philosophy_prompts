  of times, with well-being at each time w(t). Question: should prioritarian weighting
  be applied to temporal segments within a life?


  Argument:

  (1) Prioritarianism''s rationale: the moral value of a benefit depends only on the
  absolute level of well-being of the person benefited and the size of the benefit,
  with diminishing marginal moral value; nothing else matters — in particular, not
  how much others have, and not the total or average.

  (2) Levels are temporally local: at any time a person has some level of well-being,
  and that level is what determines how much a benefit then matters. (Justification:
  a benefit''s value can''t depend on well-being at times that don''t exist yet /
  that are in the past; also we evaluate choices made at times.)

  (3) If (1) and (2), then within one life, a benefit at a bad time matters more than
  the same benefit at a good time.

