  So the numbered argument:


  (1) Prioritarianism: the moral value of a state of affairs is the sum, over persons,
  of f(w), where f is strictly increasing and strictly concave and w is the person''s
  well-being; the concavity is what makes benefits to the worse off matter more, and
  it is a claim about levels, not about relations between persons.

  (2) The only reason prioritarianism gives for concavity is that a benefit matters
  more the worse off the recipient is; nothing in that rationale turns on the recipient''s
  being a whole person rather than a person at a time.

