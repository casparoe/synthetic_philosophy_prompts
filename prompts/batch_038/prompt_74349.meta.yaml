  would be treating her brother''s burial as a bargaining chip — the trade corrupts
  the value being traded; Creon would be treating the law as negotiable — which destroys
  its authority). That''s the "corruption/commodification" objection to moral trade
  (cf. debates about whether some things shouldn''t be for sale — Elizabeth Anderson,
  Michael Sandel). And the residue: is the refusal to trade in Antigone a moral insight
  that the moral-trade literature (with its Pareto-improvement logic) cannot register,
  or is it a failure of imagination?


