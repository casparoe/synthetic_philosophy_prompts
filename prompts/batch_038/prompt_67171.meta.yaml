  Key analytic hooks to inject (my own, niche):

  1. Hume''s third argument is conditional: the withdrawal of usefulness dissolves
  society''s claim only if the agent is genuinely no longer of service and no one
  else is wronged. Woolf shows Septimus''s un-usefulness is produced by the state
  (conscription/war) and then re-imposed by medicine. So the "forfeiture" clause can''t
  be invoked by society against him — but neither does Hume''s defence cover him,
  because Hume presupposes the burden is exogenous (nature, disease, fortune) rather
  than manufactured by the party whose claim is at issue. Inject a name for it: call
  it the "exogeneity proviso" or "the no-fault clause" in Hume''s argument. That''s
  the niche idea: Hume''s argument needs an unstated premise that the agent''s loss
  of usefulness is nobody''s doing. If that premise fails, the essay is silent.

  2. Hume argues against the wrong adversaries. His opponents are Providence/theodicy,
  neighbour-harm, and self-harm — the priest and the commonwealth. Woolf''s 1923 London
  has replaced the priest with the specialist and the commonwealth with the clinic.
  Proportion and Conversion are precisely a social technology that enforces usefulness
  without needing religious or legal authority — which means Hume''s rebuttal of the
  religious objection has no purchase, and the objection that remains (Bradshaw''s
  "you must rest, you must work, you must not disturb") is not one Hume''s three-part
  schema can even register. Inject: Hume''s tripartite schema has no slot for a third-party
  harm claim made in the name of the patient''s own good by a professional with coercive
  power. That''s an interesting claim: Hume covers God/neighbour/self; Bradshaw''s
  claim is quasi-neighbour (the doctor''s own reputation, the peace of the household)
  plus "conversion" — which is a claim about the value of conformity, not about harm.

  3. Clarissa''s endorsement: she approves the act on grounds of integrity/preservation
  of the centre of the soul and of communication — i.e., a value Hume''s schema can''t
  express: the act as testimony. Hume thinks of suicide as a subtraction from an inventory
  of usefulness; Woolf treats it as a speech act. So the novel supplies a fourth category
  — offence against, or service to, the meaning of one''s life — which Hume''s hedonic/instrumental
  framing can''t accommodate. Ask whether that''s a genuine addition or aestheticization.

  4. The flight-vs-suicide objection: Septimus jumps partly to escape Holmes at the
  door. Is that suicide in Hume''s sense (a reasoned conclusion that life is a burden)
  or a panicked escape, and does Hume''s argument require the former? Hume''s "natural
  horror of death" premise suggests he''d classify Septimus''s act as a case where
  the horror was overcome — but Woolf makes the act impulsive, which might actually
  undercut Hume''s premise that only someone whose life is genuinely a burden can
  overcome the horror. Inject the challenge: does Woolf give us a counterexample to
  Hume''s claim that anyone who kills himself has thereby demonstrated that his life
  was not worth keeping? That''s a nice in-the-weeds point: Septimus was not, by any
  ordinary reckoning, better off dead — he might have recovered; the horror was overcome
  not by a settled judgment but by acute terror and by the impossibility of being
  left alone. So the inference from act to burden fails. Hume''s premise is doing
  a lot of work — arguably it''s a rationalization: "he can''t have wanted to live,
  since he didn''t." That''s a good injected idea: Hume''s third argument is question-begging
  in a specific way (it reads off the agent''s assessment from the act itself, so
  it can''t be falsified, and it can''t distinguish the settled judgment from the
  panic).

  5. Also could ask: what would Hume say of Rezia, and of Bradshaw''s "rest cure"?
  And the legal fact — suicide a felony until 1961, so Bradshaw''s/Holmes''s intervention
  has legal backing; Hume wrote in a country where suicide was a crime and forfeiture
  attached.


