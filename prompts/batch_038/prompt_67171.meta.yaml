  Hume''s "Of Suicide":

  1. Not a violation of duty to God: all things are governed by Providence''s general
  laws; if suicide is a usurpation of God''s prerogative over life and death, then
  so is any action that alters the course of nature — e.g., turning aside a river,
  or a physician saving someone from a fever. Either God''s providence reaches everything
  (in which case the suicide is also within it) or it doesn''t (in which case no action
  disturbs it). Also: God has given us judgment and reason; to refuse to use them
  to avoid misery is absurd. And if God has placed life in our hands along with the
  desire to preserve it, then a man who is miserable has a right to withdraw.

  2. Not a violation of duty to one''s neighbour: society''s claims are reciprocal;
  one who retires from life renounces all benefits from society and does no injury;
  if anything, one who is a burden to society has a right to leave. Hume says: "a
  man who retires from life does no harm to society; he only ceases to do good." And:
  if that is an injury, it''s a trivial one, and it''s a "renunciation of a benefit"
  — he gives up the right to receive benefits. He compares: someone who spends his
  life in a cell/prison (e.g., a hermit) harms society as much by withdrawing his
  usefulness. Actually Hume says something like: if it is a crime to render ourselves
  useless to society, then by the same rule, a person who abstains from all business
  and lives in a monastery harms society.

  3. Not a violation of duty to oneself: no one would abandon life while it was worth
  keeping; "such is our natural horror of death, that small motives will never be
  able to reconcile us to it"; and the man who has overcome that horror has thereby
  shown his life is a burden. Also Hume notes that a person who has retired from life
  cannot repent; and that the "greatest outrage" against ourselves... He also mentions
  that men in such a condition (melancholy) are objects of compassion, not blame.


