  add an invalid step: e.g., conclude that because supererogatory acts are morally
  better than required ones, failing to perform them is blameworthy but excusable
  — a confusion. Or claim that if the paradox is resolved by denying that one ought
  to do what one has most reason to do, then morality becomes irrational.


