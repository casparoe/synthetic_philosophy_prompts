  The two positions, as I understand them. On one side: religious belief and practice
  are a cultural adaptation — costly ritual, doctrinal conformity, and beliefs in
  morally concerned supernatural punishers were retained by group-level selection
  because they made coalitions more cooperative, more demographically robust, and
  better at outlasting and out-absorbing their neighbors. On the other: religion is
  a byproduct — an accidental convergence of independently adaptive cognitive machinery
  (hyperactive agency detection, intuitive mind-body dualism, promiscuous teleology,
  a theory-of-mind system that can''t switch off) plus cultural transmission biases
  that favor minimally counterintuitive, memorable, emotionally arousing content.
  On this view the fitness benefits of group membership are real but are not why the
  cognitive machinery exists, and the machinery would produce gods whether or not
  gods paid.


