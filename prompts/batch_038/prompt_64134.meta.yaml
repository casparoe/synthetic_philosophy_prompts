  data — and the lucid-dreaming literature, where a sleeper signals from inside the
  dream with pre-arranged eye movements verified against the polygraph, is usually
  wheeled in as the decisive counterexample. I want the story to hold all of that
  tension without a single character delivering a lecture about it."


