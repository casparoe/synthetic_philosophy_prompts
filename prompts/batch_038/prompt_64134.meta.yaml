  Actually, the Malcolm vs Dennett debate: Norman Malcolm argued in "Dreaming" (1959)
  that dreams are not experiences — the claim "I dreamt that X" is not a report of
  a past experience; there''s no dream experience occurring during sleep; the impression
  that dreams are experiences is a conceptual confusion stemming from a "picture"
  that holds dreaming. Dennett later (1978, "Towards a cognitive theory of dreams"
  / and in Consciousness Explained) argued a similar-ish but different view: dreams
  are more like "tales that demand to be told" — the Orwellian revision / content
  is inserted retrospectively, not experienced. Dennett''s "Cartesian Theater" / "Multiple
  Drafts" model.


  A short story about this: a sleep-lab technician who tries to determine, from a
  dream report, whether there was an experience at all. That''s a nice, weedy prompt.


  Alternatively Skolem''s paradox: a short story about a mathematician who finds a
  countable model of ZFC and realizes she lives inside it — Löwenheim–Skolem, "relativist"
  vs "absolutist" readings (Gödel''s reaction to Skolem 1928 lecture). Skolem''s paradox:
  a countable model of set theory contains "uncountable" sets — uncountability is
  relative to the model (no bijection inside the model), not absolute. This makes
  a great story: an archivist/librarian in a countable universe.


  Arrow''s impossibility theorem + short story: a story about a committee of three
  ranking options. Could be good but maybe less imaginative.


