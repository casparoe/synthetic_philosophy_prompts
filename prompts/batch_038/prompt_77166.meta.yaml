  Classic false presuppositions about Dutch book arguments:

  1. That Dutch book arguments show irrational people lose money, so you should avoid
  losing money — conflating pragmatic sure-loss with epistemic incoherence. The argument
  works because of the assumption that you value bets at face value (betting interpretation),
  and that sure loss is bad, and that the logic of the bets composes. It doesn''t
  show that incoherence causes financial loss in real markets.

  2. That the Dutch book theorem for conditionalization shows conditionalization is
  the only rational update rule (uniqueness) — actually Dutch book arguments for conditionalization
  rely on assumptions (Lewis''s version, and the later criticisms: the argument assumes
  you''ll be offered bets before and after evidence, and that your utility function
  doesn''t change, etc.). Also there''s the "package principle" — Dutch bookability
  requires the package principle (if you accept each bet individually, you accept
  the combination), which fails under some circumstances.

  3. That a Dutch book is possible against someone who violates the probability axioms
  in a way that they''d never be exposed to.

  4. That avoiding Dutch books = being rational (coherence is necessary but not sufficient).

  5. Confusing "Dutch book" (sure loss) with "being exploited in a real market" /
  with "money pump" (which is the sequential analogue involving changing preferences).
  Money pump vs Dutch book is a genuine distinction often blurred.

  6. That the Dutch book argument for the probability axioms assumes "bets are the
  right model of belief" — the betting interpretation, and that de Finetti himself
  denied beliefs are literally dispositions to bet.


