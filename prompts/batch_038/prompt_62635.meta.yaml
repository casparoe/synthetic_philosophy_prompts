  "For a decade I have run a cognitive-science reading group in which the analogy
  wars never get anywhere, and I have come to suspect that the participants are not
  disagreeing about what they think they are. On one side are the heirs of the Copycat
  project: a deliberately impoverished microdomain of letter strings (given abc :
  abd, complete ijk : ? and, harder, aabc : aabd :: ijkk : ?), an associative slipnet
  of concepts whose link lengths shift with activation, codelets building and demolishing
  partial structures in a workspace, and the thesis that analogy-making and categorization
  are one and the same process, so that conceptual slippage — a group of letters slipping
  into the role played by a single letter — is the visible tip of how all concepts
  work. On the other side are the structure-mapping theorists, for whom analogy is
  the alignment of relational structure retrieved from a rich long-term memory, governed
  by a preference for relations over attributes (systematicity), and who regard the
  letter-string domain as an artefact with essentially no relational structure to
  map. Each side has an obvious charge against the other: that the microdomain is
  too thin to license general claims, and that the relational account is a redescription
  of good analogies rather than a mechanism for producing them. My hypothesis is that
  this is not a substantive disagreement at all but a case of two groups answering
  different questions under one heading — one asking what the vehicle of a concept
  is, the other asking what makes a mapping correct — with a genuine empirical question
  buried underneath about whether answer distributions on artificial strings tell
  us anything about analogy in knowledge-rich domains. Note also that Copycat''s own
