  Setting: Our department''s early modern reading group met on Berkeley''s immaterialism
  last week; after the session, Nora and Samir argued for forty minutes in the corridor.
  I was there, took notes roughly contemporaneously, and neither could convince the
  other. I''m reporting it neutrally — I genuinely don''t know who won.


  Brief statement of the argument as both took it: Berkeley''s "master argument,"
  i.e., the response to the objection that one can easily imagine trees in a park
  or books in a closet with nobody there to perceive them: whatever is conceived of
  is conceived, hence in a mind; therefore it is impossible to conceive of anything
  existing unconceived; hence sensible things cannot exist outside minds.


  Moves:


  (1) Samir: the argument is a scope fallacy / equivocation. From "whatever is conceived
  exists in some mind" (trivially true, since conceiving is a relation and relations
  require their relata) Berkeley slides to "whatever is conceived exists in my mind
  as an idea," and thence to "sensible things cannot exist outside all minds." The
  first claim is a triviality about the grammar of "conceive"; the third is a substantive
  metaphysical thesis; the middle is where the illicit shift happens. So the argument
  is invalid, and the invalidity is not a quibble: it''s exactly the point at issue
  between Berkeley and the realist.


  (2) Nora: Samir''s reconstruction mislocates the target. Berkeley is not offering
  a direct proof that nothing unconceived exists. He''s closing an escape route the
  realist had claimed to occupy: the realist''s whole reason for believing that mind-independent
  sensible objects are possible is that he can conceive of them so existing. Berkeley''s
  point is a reductio on that conceiving: if you conceive of a tree existing unconceived,
  you have thereby conceived it, so it is in your mind, so you have not after all
  conceived what you set out to conceive. That''s a conditional/burden-shifting argument,
  not a quantifier slip, and it is valid.


  (3) Samir: fine, but then the reductio proves only that a certain description is
  incoherent, and it is incoherent only under a stipulative reading of "conceive"
  on which every object of thought is thereby mental. If Berkeley defines "conceive"
  so that whatever is conceived is an idea, the reductio is a tautology about his
