  I think Berkeley''s master argument offers a crisp, technical, adjudicable disagreement.
  The master argument: whatever is conceived of is in the mind; therefore no idea
  can exist unconceived. There''s a well-known dispute about whether the argument
  equivocates between "conceiving of X" and "X being conceived of" (the ideational/object
  ambiguity), and whether Berkeley is entitled to the move from "I can conceive of
  the objects of my senses" to "they exist in my mind." Also there''s the distinction
  between the master argument and esse est percipi (the Principles §3 argument vs.
  Three Dialogues). Berkeley''s master argument appears in Principles §23 and in the
  Third Dialogue (the Hylas/Philonous exchange about the tree conceived in the mind,
  and Philonous''s "I deny that I can abstract one from another" claim about conceiving
  extension).


