  so I help put together a tiny philosophy-of-physics zine, and for the next issue
  I want a parody of one of those laminated public notices taped to the counter at
  a municipal land-registry office.


  Setting: the city of Einsteinburg. One neighborhood, officially designated The Hole,
  contains no houses, no roads, no people, no matter of any kind — just surveyed parcels
  of land on the books. Overnight, the registry has re-issued every parcel description
  in town under a smooth shift: each lot''s legal description now sits two blocks
  east of where it used to, so that the bare point of land our complainant calls Lot
  412 now carries the description that used to belong to Lot 414. Nothing she can
  see, touch, or measure has changed. Her fence is still on the same side of the same
  creek as her neighbor''s well. She has come in to file a takings claim on the grounds
  that her property was moved out from under her.


  Deliverable: the Deeds Office''s official customer-facing FAQ notice, 650-750 words,
  deadpan bureaucratic register, with a form number, an ordinance citation (invent
  both — no real statutes, no real cases, nothing that a reader might go looking up),
  headings, a hours-of-operation line, and at least one footnote. The office''s policy
  should be flat and unapologetic: two filings that differ only by a relabeling of
  the parcels are the same filing, no fee is owed, and the office does not adjudicate
  which labeling is the true one.


  The jokes have to come from getting the philosophy right, not from the word "parcel"
  being inherently funny. Specifically I want the piece to make a reader who knows
  the debate realize you understand:


  - that this isn''t the office pleading ignorance. it''s not "we just don''t know
  which parcels got shifted" — the notice should make clear the office thinks there''s
  nothing further to know, and should be careful about the difference between those
  two positions.

  - that the office only recognizes registered coincidences — this well at that corner,
  this fence along that creek — and has no procedure at all for a bare point of land
  with nothing on it.

  - that the indeterminacy is confined to The Hole and its future; the past and everything
  with matter in it is settled on the books, which is exactly what makes the shifted
  filing admissible in the first place.

  - a fair hearing for the other side: a complainant''s appendix or sidebar where
  the residents who think the parcels exist in their own right, prior to and independently
  of what''s built on them, can state their grievance in their own words — and where
  the office concedes they''re not obviously crazy, just expensive.

  - at least one jab at the office''s own smugness. the satire should cut both ways
  a little; the notice should be defensible as policy and also faintly absurd as a
  way to run a city.


  Do not state any of the technical vocabulary of the debate anywhere in the notice
  itself. no "diffeomorphism," no "substantivalism," no "haecceity," no name of any
  philosopher, dead or alive. the whole thing has to work as a municipal document
  that a reader with no physics at all would find merely tedious, and that a specialist
