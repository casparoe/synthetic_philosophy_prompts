  Asker: third-year (or MA) student in a seminar on genocide and international criminal
  law / atrocity prevention. Also works ~10 hrs/week at a small documentation NGO''s
  research desk that publishes situation briefs. Their task: decide, for each brief,
  whether the desk may say that genocide is occurring / has occurred / is at risk.


  Constraints to fix:

  - Briefs: roughly two per week, deadline same day; analysts are graduate/undergrad
  students without legal training; a staff lawyer reads the brief before publication
  but has 15 minutes and will only veto or approve, not rewrite.

  - The desk''s briefs get quoted by wire services and by a parliamentary committee;
  so both over-labeling (credibility costs, accusation of advocacy) and under-labeling
  (accused of laundering atrocities; also the desk believes naming has preventive
  value) are live risks.

  - The desk publishes both "situation" briefs (ongoing) and "assessment" briefs (retrospective
  on a completed episode).

  - Evidence is open-source: satellite imagery, NGO reports, survivor testimony, government
  statements, social media. No subpoena power, no forensic access, no access to closed
  intelligence.


