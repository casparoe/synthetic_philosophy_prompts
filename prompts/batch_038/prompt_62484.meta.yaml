  - When may the desk assert the legal elements are met vs. when must it say "at serious
  risk" or "acts consistent with"?

  - How to handle the intent element from open sources when no official states it.

  - How to handle "in whole or in part" / substantiality.

  - How to handle groups not on the protected list (political, social, class, gender,
  sexual-orientation groups) — the Lemkin/Convention gap.

  - How to handle non-lethal acts: preventing births, transferring children, conditions
  of life — cases with few deaths.

