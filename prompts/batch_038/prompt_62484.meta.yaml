  of language, heritage, institutions) — does the desk describe that as genocide in
  the moral/sociological sense while withholding the legal label?

  - How to handle disputes over whether a group is a distinct group (self-definition
  vs. perpetrator''s definition).

  - Where does it hand off to a human because the remaining question is about the
  desk''s own mission/values rather than the facts?


