  I cover science and ideas for a general-interest magazine, and each autumn I guest-lead
  one session of a first-year seminar on how science knows what it knows: fourteen
  students, seventy-five minutes, no lab equipment and nothing assigned in advance.
  This year I want them to collide with a problem rather than be told about it.


  The collision I have in mind is a pair of purely armchair arguments, symmetric in
  structure and equally vivid: the tied-bodies reasoning that a heavy and a light
  object cannot fall at different rates, since the lighter would retard the heavier
  and the pair, though heavier than either, would then fall more slowly than the heavy
  one alone; and the older reasoning that a stone released from the top of a tower
  would land west of the base if the Earth were turning eastward beneath it, so the
  Earth must be at rest. Both persuaded clever people; one of them lands on a falsehood,
  and from the armchair the two feel alike.


  Design the session as a runnable activity, not a lecture. I need: a structure in
  which students commit privately, in writing, to a verdict and a confidence level
  on both arguments before anyone announces which is which, with a simple scoring
  rule that rewards honest confidence without needing real money; a stage in which
  each group has to state a criterion for distinguishing truth-tracking armchair reasoning
  from seductive armchair reasoning, and then apply it to the pair; the reveal and
  its sequencing; materials; and a minute-by-minute timeline.


  The debrief should map particular moments in the room onto the two live accounts
  of how such reasoning could yield knowledge — the view that the armchair step only
  unpacks empirical premises the reasoner already had in hand, and the view that some
  thought experiments deliver genuine non-empirical insight into how nature must be
  — and should say what each account owes us about the argument that fails. Then tell
  me what will predictably go wrong the first time I run it.


  Two problems I want you to face rather than paper over. First, contamination: these
  students already know the Earth turns and have mostly heard the falling-bodies story,
  so their "intuitive" verdicts will be hindsight wearing a disguise. Either show
  me how the design can neutralize that, or tell me it cannot and propose what should
  take the failing argument''s place. Second, be frank about which feature of the
  puzzle no classroom exercise can reproduce, and what I will have to supply by simply
  talking.


