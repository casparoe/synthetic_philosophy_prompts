  because simultaneity is relative — but the crucial premise is the transitivity of
  the "equally real" relation across overlapping frames, and the student instead argues
  from the relativity of simultaneity directly. Another subtle error: claiming that
  special relativity''s relativity of simultaneity alone implies fatalism/determinism
