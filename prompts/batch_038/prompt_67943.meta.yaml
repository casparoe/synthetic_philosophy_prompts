  - Tolstoy''s version of the structural view is not any of these: it''s closer to
  a metaphysical claim about causation and freedom (the "infinitesimal" calculus analogy:
  history as the integration of an infinity of individual wills; and his argument
  that a command doesn''t cause an event unless it coincides with a pre-existing series
  of events — the "power is the collective will transferred to rulers" idea, and his
  claim that the man in power doesn''t cause events but is the "slave of history",
  and the label on the event "like a sticker on an apple"). That''s in Book, the Second
  Epilogue, chapter 2-ish: the argument that a command''s execution depends on prior
  events; the example of Napoleon''s orders at Borodino mostly not carried out.

  - The interesting tension: Tolstoy''s structuralism is compatible with individual
  moral responsibility at the micro level (Pierre, Andrei) — he''s not eliminating
  agency but relocating macro-explanation. So a reading that treats Tolstoy as a hard
  determinist about individuals misses the point.

