  Bentham-specific weeds:

  - "Offences Against One''s Self" argues that the act produces no mischief / no harm:
  no pain to a willing party; that the punishment is a greater evil than the offence;
  the "mischief of alarm" is small; the danger of false accusation and of the law
  empowering blackmailers; Bentham''s claim about the proportionality between punishment
  and offence.

  - Bentham''s theory of punishment''s four cases where it is "unmeet": groundless,
  inefficacious, unprofitable (too expensive), needless.

  - Bentham''s "principle of sympathy and antipathy" (in IPML ch. 2) — approving/disapproving
  of actions because of a mere feeling, i.e., Devlin''s position in Benthamite terms.

  - Bentham''s "ascetic principle."

  - Bentham also discusses masturbation ("manstupration") and other sexual offences
  in his "Table of the Springs of Action" and in the Panopticon/Constitutional Code?
  He wrote on "paederasty" and also about prostitution (he was relatively permissive),
  and he discusses the offence of "seduction."

  - Also Bentham''s own closeted life, the "he could not publish" point — the fragment
  was left unpublished, which is itself interesting: the theory said publish-utility
  favored openness, but Bentham''s calculation of consequences led him to bury it.
  That''s a great "what the episode shows about the theory" hook: the discrepancy
  between Bentham''s argument and Bentham''s own conduct (fear of publication), and
  whether a Benthamite can criticize Bentham for not publishing.

  - Also: Bentham''s utilitarian calculus about the "mischief of alarm" — for Devlin,
  disgust is evidence of social harm; for Bentham, disgust/antipathy is precisely
  the thing not to count... but wait, actually Bentham does count "mischief of alarm"
  as a real harm (pain of apprehension in the community). So there''s a tension: Devlin''s
  disgust, on Bentham''s own hedonic calculus, IS a pain, and thus counts in the utility
  calculation. Bentham''s escape is to say the antipathy is not a legitimate ground
  of disapprobation — but as a matter of fact, pain from disgust is pain. That''s
  a genuinely deep, weeds-y tension, and it''s a real scholarly point (Hart also worried:
  the "disintegration" argument, and whether distress counts as harm — later developed
  by Joel Feinberg''s "offence principle"). So the prompt can ask: does Bentham''s
  calculus license counting Devlin''s disgust as harm? Where does Bentham block it,
  and can he block it without appealing to something non-utilitarian? Excellent —
  that gives the "theory illuminating case and case testing theory" structure.


