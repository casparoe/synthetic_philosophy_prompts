  ---


  I have been asked to submit a one-page statement of my methodological commitments
  for a departmental workshop on evolutionary explanation, and I would like a critical
  audit of the set before I circulate it. What I hold:


  (1) The Gould–Lewontin critique is correct in substance: the default hypothesis
  for any phenotypic trait should be that it is a byproduct of architecture, development,
  or phylogeny, and the burden of proof lies on anyone calling it an adaptation.


  (2) Nothing about (1) requires a rival creative force: a spandrel is a necessary
  consequence of the way the rest of the organism was built by selection, so byproducts
  inherit their existence from adaptations without themselves being adapted.


  (3) The term "exaptation" is worth keeping only as a disciplined label. A trait''s
  current usefulness entitles us to call it an exaptation only once we have independently
  established the prior adaptive function it was co-opted from; absent that, the label
  is doing no explanatory work.


  (4) In my own work I treat the male mammalian nipple as a spandrel and the precursors
  of bird feathers as byproducts of the integumentary scaling pathway that were later
  co-opted for flight and for display.


  (5) Where I do posit adaptation, I regard a good fit between an optimality model
  and the observed phenotype as strong evidence for it: selection is a powerful enough
  optimizer that traits it has had long enough to shape sit close to their fitness
  peak.


  (6) Appeals to developmental constraint, allometry, or phylogenetic inertia strike
  me as explanation-stopgers unless they are cashed out in terms of what the trait
  in question does for the organism.


  (7) I am perfectly willing to use adaptationist reasoning as a heuristic for generating
  hypotheses in the lab, provided the resulting claims are then tested against alternatives.


  Audit this set. Which pairs genuinely pull against one another, and which only look
  as though they do? Order the real tensions by severity, and for each say what has
  to give, what the cheapest revision would be, and what that revision costs me elsewhere.
  Then tell me which single change would repair the most. Argue from the logic of
  the positions rather than from the literature — I want the reasoning, not a reading
  list.


