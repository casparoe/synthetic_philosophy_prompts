  a bet paying $1 if A, $1 if B, and $0 otherwise, priced at some p? That''s just
  the A∨B bet (since A,B disjoint) → they price it at 0.3. So the compound "buy A-or-B"
  is 0.3. To exploit with a single bet: the bookie wants to buy a bet from the agent
  that the agent overvalues, or sell a bet the agent undervalues. With disjoint A,
  B: single bets available: on A (agent prices 0.6), on B (0.6), on A∨B (0.3), on
  ¬A (0.4), on ¬(A∨B) (0.7), etc. A single bet on A priced at 0.6: agent buys, payoff
  1 if A, 0 else; net loss if ¬A, gain if A. Not guaranteed. So no single bet guarantees
  loss — correct, given the agent''s prices only attach to these propositions and
  any compound the agent evaluates must be evaluated... hmm, but consider a single
  bet with payoff $1 if A, $1 if B (that''s A∨B, priced 0.3) — bookie sells it to
  the agent for 0.35? Agent values at 0.3, refuses. Bookie buys it from the agent
  for 0.25? Agent accepts (values at 0.3 > 0.25). Bookie pays 0.25, receives $1 if
  A∨B. Is that a guaranteed loss for the agent? Agent receives 0.25 now, pays $1 if
  A∨B. Not guaranteed loss — if neither A nor B, agent gains 0.25. So indeed no single
  bet guarantees a loss in this profile (assuming the agent''s price for any payoff
