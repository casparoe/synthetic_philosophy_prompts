  Hmm, move (4) is quite sophisticated — is it right? Let''s think. If the agent has
  a standing policy of accepting at most one bet per day, and the bookie offers a
  single compound bet whose payoff depends on A and B (payoff vector), the agent needs
  a price for it. If the agent has no opinion about the compound, they may refuse.
