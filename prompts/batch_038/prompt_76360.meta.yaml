  Two grad students in my probability-and-philosophy reading group got into an argument
  after working through the standard Dutch book for probabilism. (1) Nadia set up
  the case: an agent prices a $1 bet on A at 60¢ and a $1 bet on B at 60¢, where A
  and B can''t both happen, but prices a $1 bet on "A or B" at only 30¢. She said
  a bookie who buys the A-or-B bet from him for 30¢ and sells him the A and B bets
  for 60¢ each leaves him 90¢ poorer no matter what happens, which shows incoherent
  credences are a genuine defect. (2) Owen said the argument proves too little: it
  only works because the agent is willing to enter three separate bets. Owen''s agent
  has a standing policy of accepting at most one bet per day, so no package can be
  assembled against him; his credences are just as incoherent, yet he''s unexploitable.
  (3) Nadia said that policy isn''t a refuge, it''s another mistake — it makes him
  turn down favorable bets, and a bookie can always repackage the three bets as a
  single compound bet, so the policy buys him nothing. (4) Owen replied that repackaging
  only works if the agent values the compound bet by adding up the values of its parts,
  and that''s exactly the additivity assumption in dispute; if he doesn''t, there''s
  no single bet he''d accept that guarantees a loss, and so the link between incoherence
  and sure loss runs through assumptions the argument was supposed to establish. They
  asked me to settle it. Adjudicate move by move...

