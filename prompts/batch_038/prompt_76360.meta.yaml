  Better twist: the "delayed Dutch book" — two people arguing about an agent who is
  incoherent at time t but scheduled to become coherent at t+1 through a known revision
  procedure that isn''t conditionalization (e.g., a "credence recalibration service").
  One says: coherence is only instrumentally valuable if you''re vulnerable to exploitation
  now; since the agent will be coherent by the time the bets pay off, the Dutch book
  can''t be completed, so probabilism''s normative bite collapses for such agents.
  The other says: the bookie can exploit the agent *today* by selling a package whose
  payoff is guaranteed regardless of the world and regardless of the agent''s future
  credences — the guarantee of loss comes from present-day acceptance, so future coherence
  is irrelevant; and moreover the agent''s present acceptance is itself the incoherence
  manifesting.


