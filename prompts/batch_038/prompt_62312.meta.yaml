  Opening move: something Berkeley must genuinely deal with. Options:

  (a) The friend''s claim: "money is nothing but a token, so the best money is one
  nobody can inflate, whose supply is fixed by rule — you''d love bitcoin." Berkeley''s
  response must draw on: tokens matter only insofar as they circulate and quicken
  industry; the end of money is to set people to work; a fixed supply that is hoarded
  is not wealth; a nation could be wealthy with no money at all; the real question
  is what a token''s use does to industry and to men''s wants; also his land-bank
  proposal (paper secured on land, issued to fund industry) — so he''s not against
  paper per se, but against paper that doesn''t circulate into production. Also his
  worry about the South Sea: money detached from land/industry breeds stock-jobbing
  and vice. Bitcoin looks exactly like stock-jobbing to Berkeley: a ticket whose price
  is driven by speculation, not by wants of men for real goods. That''s a strong Berkeleyan
  reply — good, the model can produce it if prompted. But is the contest too easy
  for Berkeley? The opening should be a move he "actually has to deal with" — something
  hard. The hard version: "If money is just a token and its value comes from its use
  in circulating goods, then why is a token whose supply is fixed worse than one a
  bank can increase? You said a nation''s wealth is its industry, not its money —
  but you also said money must circulate, and circulation requires that people expect
  the token to be accepted; bitcoin''s fixed supply is what makes people accept it.
  So isn''t scarcity the very thing that gives a counter its purchasing power, and
  isn''t your own account of value a quantity theory in disguise?" That''s a genuinely
  tricky challenge — it forces Berkeley to disentangle (i) tokens as instruments of
  circulation, (ii) the source of a token''s exchange value, and (iii) whether he''s
  a quantity theorist. Berkeley famously rejected the simple quantity theory: he thought
  money''s value depended on the "vent" (demand/circulation) relative to the wants
  of men and the quantity of goods, i.e., velocity matters, so more money needn''t
  raise prices proportionally if it quickens industry. That''s a real Berkeleyan resource.
  Also his point: the value of money is its purchasing power, and purchasing power
  derives from the wants of men for the things money can buy, not from the intrinsic
  nature of the token — so a token''s scarcity matters only instrumentally, and hoarding
  defeats the purpose.


