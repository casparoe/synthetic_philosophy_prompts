  Death in Damascus is the locus classicus for causal vs evidential decision theory
  (Gibbard & Harper 1978; Jeffrey 1977; Eells). The structure: Death''s prediction
  is causally independent of your act, but evidentially connected. Fleeing to Aleppo
  doesn''t affect whether you die, but it''s evidence that you will (because Death
  knew you''d flee). CDT says fleeing is fine (both acts have the same causal consequences);
  EDT says fleeing is bad news (it lowers the probability of survival), so don''t
  flee — but then staying is also bad news, and Jeffrey showed the problem: any decision
  procedure self-erodes. This is the "instability" of EDT, and there''s the related
  "toxin puzzle" and "Newcomb." Also the "Ahmed and Smith" style cases.


  Works of fiction with this structure:

  1. Sophocles'' Oedipus Rex — the oracle''s prediction is (apparently) causally independent
  of Laius''s and Oedipus''s responses, but the responses bring it about. Actually
  here the fleeing causes the fulfillment — so it''s causal preemption/self-fulfilling
  prophecy, which is the opposite of Death in Damascus (where fleeing does nothing
  causally). This is a really interesting critical point: Oedipus Rex is a case where
  the prediction IS causally dependent on the response, so it''s not a Death in Damascus
  case at all — and a good reading could note that distinction. That''s the "where
  the work resists the reading" material. Very teachable.


