  The Zhuangzi death story: Huizi goes to console him, finds him singing and drumming
  on a tub. Huizi reproaches him. Zhuangzi replies that at first he did grieve like
  anyone, but then he reflected on the origin: before birth there was no life, indeed
  no form, indeed no qi; in the welter between non-being and being, qi changed into
  form, form into life, and now life changes into death — it''s like the turning of
  the four seasons. So his wife is now sleeping in a vast chamber, and to go on sobbing
  and wailing would show he doesn''t understand fate/destiny. That''s well-known (Watson
  translation, "Perfect Happiness" chapter 18 / 至樂). Also Zhuangzi''s own death: disciples
  wish to bury him lavishly; he says heaven and earth are his coffin, sun and moon
  his jade discs, stars his pearls, the ten thousand things his funerary gifts; disciples
  worry crows and kites will eat him; he says above ground for crows and kites, below
  ground for ants — to take from one and give to the other is partial (ch. 32). Also
  ch. 6: Mengsun Cai, who mourns his mother without tears, and the story of the dying
  Zila/子祀 etc., and 大塊載我以形... Also the skull dream (ch. 18): Zhuangzi dreams of a
  skull who says death is like a king''s happiness, "no ruler above, no subject below,
  no work of the four seasons"; Zhuangzi asks whether he''d like to return to life
  and the skull frowns deeply.


  An interpretive disagreement: Is Zhuangzi''s equanimity a matter of *knowledge*
  (cognitive: understanding transformation, so grief is a mistake of judgment) or
  a matter of *aesthetic/skillful attunement* (he still grieves but doesn''t cling;
  grief is transformed, not refuted)? Two scholars. There''s a genuine debate in the
  literature: is Zhuangzi an "eliminativist" about emotion (sage has no feelings —
  cf. the Zhuangzi–Huizi debate on whether the sage has qing, in the Zhuangzi, ch.
  5? Actually that''s Zhuangzi ch. 5 "Signs of Complete Virtue": Huizi asks "can a
  man really be without feelings?" Zhuangzi says yes; Huizi says if he has no feelings
  what makes him a man; Zhuangzi says "this isn''t what I mean by feelings. When I
  say a man has no feelings I mean he doesn''t let likes and dislikes get in and do
  him harm; he lets things be as they are and doesn''t try to help life along." That''s
  a well-known passage). So there''s a real tension: the drumming story says "I was
  grieved like anyone else at first, then I reflected..." vs. the no-qing doctrine.
  And the skull story which seems to say death is better than life (hedonistic) vs.
  the transformation view which says death is neither good nor bad, just a phase.


  So a good disagreement: two people in a seminar arguing over whether Zhuangzi thinks
  death is bad. One says: he clearly thinks death isn''t bad — it''s a transformation
  like the seasons, and mourning shows a failure to understand. The other says: the
  skull passage suggests death is positively good (better than a king), which contradicts
