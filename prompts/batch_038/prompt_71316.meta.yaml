  I was auditing a graduate reading group working through the Zhuangzi, and two of
  the regulars — Ilana and Peter — got into an argument about whether the text actually
  holds that death is bad for the person who dies. I sat in the corner taking notes;
  neither of them asked my view and I wouldn''t have been useful. Here''s the exchange
  as best I recorded it.


  (1) Ilana opened with the tub-drumming episode: when Huizi comes to condole and
  finds Zhuangzi singing and beating time on a basin, Zhuangzi says he was grieved
  at first like anyone, but then traced things back — no life, no form, no breath-stuff;
  then a shift, and form, and life, and now this shift into death, which he likens
  to the turning of the seasons. So, Ilana said, his position is that death is not
  a harm to the one who dies, and he gives a reason for it, not just a mood.


  (2) Peter said that''s a euphemism, not a reason. That a thing is a phase in a natural
  sequence says nothing about whether the phase is good or bad for whoever goes through
  it — labour is a phase in a natural sequence too. The only premise that could bridge
  the gap appears elsewhere in the book, where a man facing disfigurement says the
  same power that burdened him with a body, wore him out with life and eased him with
  old age will rest him with death, so whatever makes his life good makes his death
  good. But that just assumes what''s at issue.


  (3) Ilana said there''s a stronger version available: the sequence isn''t happening
  to anyone. If the self is only the present phase of the shifting, death deprives
  no one, because deprivation needs a subject that persists across the change — and
  persisting subjects are exactly what Zhuangzi refuses to grant.


  (4) Peter said that reading is undermined by the text itself. In the skull dream
  the dead man reports having no lord above and no minister below, no business of
  the four seasons, and says even the joy of a king enthroned facing south would not
  surpass his; and asked whether he''d like his body and family back, he shudders
  at the thought. That is a welfare claim about somebody. Likewise, refusing a lavish
  burial, Zhuangzi observes that above ground he''ll feed crows and kites, below ground
  ants and worms, and asks how partial it is to take from one lot and give to the
  other. Balancing portions requires somebody to receive them. So either there is
  a persister and (3) is wrong, or there isn''t and both those passages are incoherent.


  (5) Ilana replied that the crow-and-ant remark needs no post-mortem subject: the
  partiality lies in the disciples'' discriminating attitude, not in any distribution
  — they are still trying to arrange a better deal for him, which is the very gesture
  he rejects when he says the person without feelings doesn''t let liking and disliking
  get inside and injure him and doesn''t try to add to his life. On that account the
  reasons in the drumming episode aren''t tracking truths about death; they''re loosening
  a grip. Grief needn''t be false to be worth giving up.


  (6) Peter''s closing move: then Zhuangzi has no doctrine about death, only a therapy
  for the bereaved — and Ilana can''t have it both ways. If attitudes are only to
  be soothed rather than answerable to how things are, the drumming episode''s explicit
  appeal to reasoning is unmotivated; and if they are answerable, the skull''s claim
  is either true, which makes death a gain, or a useful fiction, which concedes Peter''s
