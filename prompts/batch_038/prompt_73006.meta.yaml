  I write about science and ideas for a magazine — economics and physics mostly, plus
  whatever weird corner of math is having a moment. Been chewing on something for
  a piece and I want a real stress test rather than a summary.


  Here''s the view I''ve drifted into: trading volume is a symptom of epistemic breakdown.
  The reasoning is roughly the no-trade theorem (Milgrom and Stokey) plus Aumann''s
  agreeing-to-disagree result. If everyone''s Bayesian, starts from a common prior,
  and the market''s information structure is common knowledge, then nobody should
  be able to profit off private info — the very act of offering to trade gives the
  game away. So speculative trade should be roughly zero. Yet trillions change hands
  every day. My conclusion: that volume is direct evidence that the common-prior/common-knowledge
  assumptions are failing, and failing at scale — and if they''re failing, then the
  whole "prices are a superb information aggregator" line is much weaker than its
  defenders let on. I''ve also been leaning on a distinction between "plumbing" volume
  (rebalancing, tax-loss selling, index flows, someone who needs cash for a house)
  and "epistemic" volume (people trading because they think they know better), and
  arguing that only the second kind counts, and that the second kind is embarrassingly
  large.


  So: what would count against this? I want the full exposure map, not a both-sides
  shrug.


  Specifically:

  - What would have to be true for the position to be false? Which mechanisms can
  generate huge volume among agents who are all perfectly rational and share a prior?
  For each one, tell me whether it''s just logically possible or actually independently
  motivated and empirically supported.

  - Where does my plumbing/epistemics carve-out break? If I have to concede that most
  volume is mechanical, does my view survive in any interesting form, or does it collapse
  into "some people are overconfident", which nobody disputes?

  - The thing that worries me: Grossman and Stiglitz argued that if prices were fully
  informative nobody would spend anything finding information, so an efficient market
  *requires* informed trading to exist. Does that mean my own argument undercuts itself
  — that volume is the thing that makes prices informative, not evidence against it?

  - Also, common knowledge is famously brittle — a tiny chance that someone doesn''t
  know that you know can change everything. Does that fragility rescue the standard
  story or mine?

  - What does my view predict that the efficient-markets view doesn''t, and what have
  we actually seen? I''m thinking things like turnover versus subsequent returns,
  volume around announcements, whether the most active retail traders do worse, price
  impact of trades. Which of these, if it came out the other way, should make me kill
  the piece?

  - Which defeaters would a card-carrying rational-expectations person concede as
  counting against them, and which would they wave off as missing the point of the
  theorem?

  - And an honest verdict on falsifiability: if any amount of volume confirms my view
  and any absence of volume can be explained away as illiquidity, is my position insulated
  into meaninglessness? Sometimes a view that can''t fail is fine because it''s just
  a framing device. Tell me whether that''s true here or whether I''m kidding myself.


  Rank everything from fatal to merely awkward. I''d personally be most moved by a
  worked equilibrium model with a common prior, no liquidity needs, and no heterogeneous
  beliefs that spits out realistic volume — tell me whether anything like that exists.


