  Answer: Wittgenstein''s central claim is that the difference between a religious
  believer and an atheist is not a difference in the amount of confidence each has
  in a proposition they both understand. When a believer says she believes in a Last
  Judgement, she is not advancing a claim about the future with a middling probability
  attached to it; if she were, the atheist''s refusal to agree would be a straightforward
  factual disagreement, and the two would be arguing about evidence. Instead, the
  belief functions as something that regulates the whole of her life: it shapes how
  she acts, what she fears, what she takes to matter. Wittgenstein brings this out
  by contrasting ''I believe in a Last Judgement'' with a statement like ''There will
  be a Last Judgement, with some probability'' — the second is a hypothesis open to
  evidence, the first is not. So religious belief is closer to what he calls a passion,
  or a commitment to a framework or system of reference, than to an opinion. It is
  not unreasonable, exactly; unreasonableness is a verdict within a practice of giving
  and weighing reasons, and religious belief sits outside that practice.


  This is why, on his account, the religious utterance has no cognitive content in
  the ordinary sense: saying ''I believe in a Last Judgement'' does not assert that
  anything will happen, and is not true or false. It expresses an attitude or a way
  of living, much as an ethical statement expresses a stance rather than describing
  a state of affairs. The believer is not, in Wittgenstein''s view, committed to any
  checkable picture of the world, and so nothing she says could be shown to be mistaken
  by the world turning out otherwise.


  That has a consequence for criticism. Since the two parties share no evidential
  standards, no argument can pass between them: the believer''s framework is immune
  to external assessment, and any attempt to refute it from outside simply begs the
  question, because the standards being appealed to are the ones the framework itself
  supplies. Wittgenstein''s later talk of frameworks that are not themselves known
  or doubted but are the hinges on which inquiry turns makes this explicit: religious
  beliefs are hinges.


  The strongest objection is that this evacuates religious belief of content. If ''there
  will be a Last Judgement'' asserts nothing and cannot be mistaken, then the believer
  and the atheist are not disagreeing about anything at all, and it is unclear what
  the believer''s life is organized around. A view on which nothing is claimed cannot
  explain the phenomenon it set out to describe — the intensity with which religious
  commitments are held and defended. Relatedly, Wittgenstein''s account seems unable
  to distinguish devout belief from mere habit or ritual, since neither is answerable
  to how things are. He owes us a way of telling them apart."


