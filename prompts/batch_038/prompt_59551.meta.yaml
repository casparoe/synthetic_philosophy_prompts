  our theories were badly false, and that we should therefore believe them — at least
  the parts that do the predictive work. The other side says look at the history:
  caloric, phlogiston, the luminiferous ether, celestial spheres... theories that
  predicted well and were nonetheless thrown out, so we should expect our present
  theories to be thrown out too. And each side has its counters: the realists insist
  that much of the anti-realist''s historical list is inflated — that phlogiston chemistry
  and caloric theory did not in fact deliver the kind of novel, precise predictive
  success the argument requires, and that what survives theory change is the mathematical
  structure, which the structural realists say is all we should have believed in the
  first place; the anti-realists reply that retreating to structure is retreating
  until nothing is left to be a realist about, and that ''approximate truth'' has
  never been given a satisfactory account that does the work the realists need.


  My own suspicion — offered as a hypothesis, not a conclusion — is that the argument
  has stalled because both sides are trading on an inductive generalization from a
  sample whose membership they cannot agree on. To say ''most successful past theories
  turned out false'', you have to fix a reference class: which theories count as scientifically
  successful, and which parts of a theory count as its claims? I suspect the realists
