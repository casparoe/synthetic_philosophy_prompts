  Actually let''s set out the two camps carefully:


  Camp A ("the neutralists"): Hume is a quantity theorist who thought the level of
  money is irrelevant to real variables in a closed view of a single kingdom; the
  balance-of-trade argument shows an automatic adjustment (specie flows); his policy
  remarks about keeping money increasing are about the transition (the gradual inflow
