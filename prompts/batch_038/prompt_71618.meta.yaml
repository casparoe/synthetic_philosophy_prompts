  contradict neutrality; his worries about paper credit are about political/military
  risk, not about monetary non-neutrality.


  Camp B ("the activists"/"anti-neutralists"): Hume thought a growing money supply
  raises the stock of labour and hence real power and riches; he explicitly says the
  public draws advantage from plenty of money (in wars and foreign negotiations) —
  that''s a real, non-neutral claim about relative national power; he treats the transition
  as repeatable, so policy matters; and he thinks money''s role isn''t just a veil;
  and the two camps also fight about whether Hume''s "jealousy of trade" claim (one
  nation''s commercial gain doesn''t hurt its neighbours, except in war) is consistent
