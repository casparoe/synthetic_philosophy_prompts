  Prompt draft:


  "I teach a third-year seminar on the history of economic thought — 24 students,
  one 80-minute session — and I want an in-class simulation that makes the socialist
  calculation debate felt rather than recited. Students should be split into a central
  planning board and several production units, and the design should let them run
  into two distinct failures in sequence: first the absence of any common denominator
  for comparing heterogeneous inputs and capital goods against one another, and then,
  once the board is allowed to set and revise shadow prices by trial and error, the
  failure of local and tacit knowledge to reach it. The second phase should also make
