  Three questions. First, who is the other bidder? In a dollar auction the trap is
  generated by the second bidder, who pays even if he exits; Ahab seems to be bidder
  and auctioneer at once — he sets the prize by nailing the doubloon to the mast,
  and the crew bid with their lives without ever being told the full terms. Is that
  a defect in the analogy, or a version of it the standard cases don''t cover? Second,
  does the novel actually endorse the sunk-cost diagnosis, or does it show that Ahab''s
  problem isn''t a mis-weighting of past expenditure but an endogenous change in his
  ends — the whale''s value rises as the price rises — so that Starbuck''s argument
  isn''t even addressed to Ahab''s error? Third, I want the two control cases brought
  in: Captain Boomer of the Samuel Enderby, who lost an arm to the same whale and
  cheerfully declines to hunt him again, and Captain Gardiner of the Rachel, who is
  still searching for his lost son when Ahab refuses to join him. Boomer cuts his
  losses, Gardiner escalates, Ahab escalates; only one of these three is condemned
  by the plot, and the ship that saves Ishmael is the one that never stopped searching.
  What does that say about whether the novel thinks escalation is a bias, a vice,
  or sometimes a form of fidelity? And does the Rachel''s ending undermine a Williams-style
  defense of Ahab''s hunt as a ground project, given that the losses fall on men who
