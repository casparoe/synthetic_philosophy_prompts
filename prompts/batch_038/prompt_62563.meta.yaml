  Dollar auction structure: In Shubik''s dollar auction, the highest bidder wins $1
  but both the highest and second-highest bidders pay their bids; so the second-highest
  bidder is induced to bid slightly more to convert a loss into a gain, and this escalates
  past $1. The distinctive feature: the trap is created by the second bidder''s position,
  and the exit requires either never entering or accepting a certain loss. Mapping
  to Moby-Dick: Ahab is past $1 already — he has lost his leg (the "bid"), and continued
  pursuit is driven by the fact that turning back leaves the loss uncompensated; the
  whale is the "prize" whose value is entirely endogenous. But a disanalogy: in the
  dollar auction there''s an opponent and a fixed prize; Ahab''s prize (revenge/slaying
  the whale) grows in value as he pays more (the doubloon nailed to the mast literally
  raises the prize for the crew!). That''s a neat structural detail: the doubloon
  is an auction prize attached to the mast, and the crew bid their lives for it —
  a second-order dollar auction inside the ship. Also, in the dollar auction the escalation
  is rational at each step given you''re in; Ahab''s escalation is likewise locally
  rational (each additional day of search raises the probability of an encounter —
  he''s got the charts and the season). And Starbuck''s objection is the classic "sunk
  costs are irrelevant" objection, which is correct decision-theoretically but fails
  as an intervention because Ahab''s payoff function has changed, not his probability
  estimates.


