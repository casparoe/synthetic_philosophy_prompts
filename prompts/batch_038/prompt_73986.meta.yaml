  into natural law... Actually that''s the famous Hart vs. Dworkin dispute about the
  rule of recognition and incorporationism. That''s a nice "proves too much": (1)
  On Hart''s view, whether a norm is law depends solely on its source, not its merits.
  (2) But Hart (in the Postscript) allows a rule of recognition to incorporate moral
  criteria by reference — e.g., "the norms of the constitution are those consistent
  with due process." (3) If a rule of recognition incorporates moral criteria, then
  whether a norm is law depends on the moral merits of that norm. (4) So on Hart''s
  own view, whether a norm is law can depend on its merits. (5) Therefore exclusive
  positivism is false by Hart''s own concession, and the same reasoning shows every
  positivist either is an inclusivist or must deny that any actual legal system has
  incorporationist criteria — but nearly every actual constitution has them (bills
  of rights, "due process," "cruel and unusual," "reasonable care"). (6) So positivism
  is false in any system that has a constitution with moralized clauses. This proves
  too much: it would also collapse Dworkin''s distinction from Hart''s. Where does
  it go wrong? There''s an equivocation: "depends on merits" — in incorporationism,
  the moral criteria are made legally relevant by a social fact (the rule of recognition),
  so the truth-maker includes a social source; and the exclusive positivist (Raz)
  distinguishes the criteria of validity from the way judges find them. Also "merits"
  equivocates between the merits of the norm as such and the merits the rule of recognition
  points to.


