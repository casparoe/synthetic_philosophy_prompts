  Which is best? I think Hart–Fuller with the "proves too much" argument is strong:
  the argument can be genuinely valid-looking with a subtle equivocation (Fuller''s
  desiderata as "internal morality of law" — a scale/degree matter, not a threshold
  matter). Actually the subtle flaw: the argument treats Fuller''s claim as a binary
  necessary condition (if a system fails desideratum D, its norms aren''t law) whereas
  Fuller''s claim is that failure of the desiderata tends to destroy legality and
  that total failure yields not a bad legal system but no legal system at all. That''s
  a threshold vs. degree equivocation. Also there''s a scope issue: Fuller''s desiderata
  apply to the enterprise of lawmaking as a purposive activity, and the argument slides
  from "this norm is defective as law" to "this norm is not law."


