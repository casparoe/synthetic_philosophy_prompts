  Content: The asker and friend (say, a roommate in a political theory seminar / a
  friend from a reading group) have been arguing about Rousseau''s Letter to d''Alembert.
  The friend claims Rousseau''s critique of theater is really just a critique of commercial,
  professional, paid performance, and that his alternative (the civic festival) is
  immune by construction. The asker wants to test this by constructing a counter-case:
  a civic festival that satisfies every one of Rousseau''s explicit design constraints
  yet triggers his own mechanisms of corruption.


  Specifications to give:

  1. Setting: eighteenth-century Geneva or a comparably small self-governing city;
  no film, broadcast, printing of scripts as mass media — actually keep it period-plausible;
  no modern technology. Or maybe allow a modern small town? Better: keep it in Rousseau''s
  own idiom — a canton/festival in a small republic — so the argument can''t be escaped
  by blaming modernity.

  2. Must observe all of Rousseau''s stated conditions for the good festival: open
  air, no theater building, no paid performers, no stage separating spectators from
  actors, no admission fee, no scripted roles assigned to professionals, the people
  are themselves the spectacle, activity rather than passivity (games, exercises,
  dancing), and it must be free/public.

  3. Must nonetheless produce, in a documented way, at least three of the four harms
  Rousseau blames on the stage: (a) the substitution of a sterile emotional discharge
  for action (weeping for a suffering one will not relieve); (b) the amplification
  of the audience''s existing passions and prejudices rather than their correction
  — the festival mirrors what the people already are; (c) the rise of amour-propre
  and status competition through display, including among those who are displaying
  themselves; (d) the opportunity cost — hours of labor lost, expenditure on dress/decoration,
  idleness.

  4. Must not achieve this by smuggling in a hidden professional, a ticket, a stage,
  a script authored by one person, or any other obvious violation — the corruption
  must fall out of the festival''s being large, voluntary, and emotionally focused.

  5. Length: the scenario itself ~one paragraph (or two), followed by the audit.

  6. Deliverable: after the scenario, show mechanism by mechanism how each harm arises,
  name which single structural feature is doing the work, say what happens if that
  feature is removed (e.g., shrink the gathering to a size where everyone participates,
  or make the activity competitive rather than expressive), and give the best reply
  Rousseau''s defender has — including whether that reply saves the festival at the
  cost of making the critique of theater no longer about theater.

  7. Also ask: does the case show the friend is wrong, or does it show Rousseau''s
  objection is really to something other than theater (e.g., to representation as
  such, or to any large-scale assembly) — which would be a different conclusion.


