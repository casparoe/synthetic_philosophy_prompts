reasoning_summary: "Let me pick a domain and type. Domains: accuracy-first epistemology\
  \ / epistemic utility theory; memes and Darwinian theory of culture; ethics of torture\
  \ and ticking time bomb; source criticism from Herodotus/Thucydides to today; Weber's\
  \ Protestant ethic thesis and culture as cause.\n\nTypes: construct a thought experiment\
  \ to specifications; predict views of a historical figure; present someone's summary\
  \ and ask whether it is fair.\n\nA retired natural scientist recently into philosophy\
  \ — formal, polished, British English requested.\n\nGood combination: Accuracy-first\
  \ epistemology and epistemic utility theory with \"construct a thought experiment\
  \ to specifications.\" That's meaty and not regurgitated. E.g., design a case where\
  \ conditionalization and epistemic utility arguments (accuracy-dominance) come apart;\
  \ or a case where a strictly proper scoring rule makes an agent worse off; or construct\
  \ a case where Joyce's accuracy-domination argument for probabilism fails / where\
