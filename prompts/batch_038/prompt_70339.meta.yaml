  \ accuracy. But that's basically the standard Jeffrey story — not novel.\n\nAnother\
  \ route where conditionalization is *not* accuracy-maximizing from the prior's perspective:\
  \ the agent's own credence function is *improbabilistic* to begin with. Then conditionalization\
