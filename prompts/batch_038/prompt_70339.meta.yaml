  \ That's a known niche result but not universally memorized. The prompt should be\
  \ self-contained enough that the model can reason.\n\nMaybe better to combine two\
  \ types? The instruction says pick one type. I'll pick the thought-experiment type.\n\
  \nLet me settle on a specification that's concrete, realistic (a scientist persona!),\
