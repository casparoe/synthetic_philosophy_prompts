  \ — the agent's posterior is constrained by the fact that the evidence she receives\
  \ doesn't determine a unique proposition (e.g., a vague observation, \"the sample\
  \ looks reddish\"). Then the accuracy-maximizing response isn't conditionalization\
  \ on a precise proposition because there is no precise proposition to condition\
  \ on. That's a real literature (Jeffrey conditionalization, and \"evidence is not\
  \ a proposition\" / Bradley, and vagueness). This gives a nice designed case: the\
  \ observation is a vague perceptual registration; conditionalization requires the\
  \ agent to become certain of a precise proposition she isn't entitled to; the accuracy-first\
