  \ or an experimental physicist, now reading philosophy) is working through epistemic\
  \ utility theory — Joyce, Leitgeb, Pettigrew. He wants a designed thought experiment.\n\
  \nSpecifications:\n1. Realistic setting: a laboratory / field science with a small\
  \ finite set of propositions, no exotic devices, no predictors. Maybe an environmental\
  \ monitoring programme or a clinical trial or a materials testing lab.\n2. A single\
  \ binary proposition (or a small partition) with known objective chances — hmm,\
  \ known chances makes it trivially easy to be accurate.\n3. The core: an agent whose\
  \ evidence is *self-undermining* in a specific way — she will receive a report from\
  \ an instrument she knows is unreliable in a direction she knows, and moreover she\
  \ knows that upon receiving it she will be affected... Let's think of the cleanest\
  \ known case where conditionalization is *not* the accuracy-maximizing response\
  \ from the agent's own prior perspective.\n\nKnown result: If the agent knows that\
  \ her future self will not be an ideal conditionalizer (e.g., she'll be drugged/tired/distracted),\
  \ then the \"plan\" to conditionalize can be dominated by planning to discount.\
  \ That's Skyrms/Van Fraassen reflection-type stuff and \"the value of evidence\"\
  . Actually there's a cleaner literature: \"Good's theorem\" — the value of evidence:\
  \ conditioning on evidence you expect to receive has non-negative expected value\
  \ (strictly positive unless irrelevant), so a rational agent should always want\
  \ free evidence. But Good's theorem fails in cases where evidence is self-locating,\
  \ or where the agent's update isn't conditionalization (Ahmed's \"Causal Decision\
  \ Theory and Decision Instability\" — no), or where the agent loses the ability\
  \ to distinguish. There are known counterexamples to the value of evidence: Elga's\
  \ self-locating cases, Ahmed's cases where the evidence is about your own future\
  \ credences, cases where the evidence is \"unlearnable\" (e.g., you'll know a fact\
  \ but be unable to retain it / the fact concerns a partition you can't distinguish),\
  \ and cases where your posterior is distorted by the very process of receiving evidence\
  \ (the \"drug\" cases; also Weatherson; also \"Bayesian non-ideal theory\").\n\n\
  Nice specification for the prompt: Construct a case in which *conditionalization\
  \ is accuracy-dominated* — a realistic laboratory scenario where an agent, using\
  \ her own strictly proper scoring rule and her own prior, can see in advance that\
  \ a rule other than Bayesian conditionalization (say, a rule that partially discounts\
  \ the evidence, or a rule of \"updating to the prior on a coarser partition\") yields\
  \ higher expected accuracy. Constraints: the agent must be perfectly aware of the\
  \ mechanism; no memory loss, no drugs; the deviation must not come from a scoring\
  \ rule that is improper (must be Brier); must be one partition of at most four states;\
  \ must be one paragraph; must be realisable in an actual lab (e.g., a spectrometer\
  \ whose calibration drifts, a radioactive source, a genotyping assay).\n\nHmm —\
  \ but is such a case actually possible? If the scoring rule is strictly proper and\
  \ the agent's prior is probabilistic, then conditionalization maximizes expected\
  \ accuracy among all update rules (this is a theorem: for a strictly proper scoring\
  \ rule, E_prior[s(c_E)] is maximized by c_E = prior conditional). So under those\
  \ constraints, the case is *impossible* — which would make the specification unsatisfiable,\
  \ i.e., a bad prompt (the asker's specs should be \"jointly satisfiable but not\
  \ trivially so\"). Unless the deviation comes from restricting the option set —\
  \ e.g., the agent cannot adopt arbitrary credence functions; she can only choose\
  \ among a restricted set of \"plans\" or she must adopt a credence that is *measurable*\
  \ with respect to a limited apparatus... Hmm.\n\nActually, there is a legitimate\
  \ route: the domination is with respect to the agent's *own* prior, but the *actual*\
  \ distribution differs, and the agent knows she will be in a state where her evidence\
  \ is misleading in a way she can predict (e.g., she knows she will be told a value\
