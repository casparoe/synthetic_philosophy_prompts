  \ that incoherent agents can be accuracy-dominated. But the interesting designed\
  \ case: an agent who is *knowingly* incoherent (she has an incoherent credence function,\
  \ e.g., because of a computational limit or a forced report) — does the accuracy-firster\
  \ tell her to conditionalize on her incoherent prior, or to first repair it? Known:\
  \ the \"accuracy-dominance argument for conditionalization\" applies to coherent\
  \ priors. There's literature on \"incoherent Bayesianism\" and on whether an incoherent\
  \ agent should conditionalize (e.g., \"Coherence and conditionalization\" — if your\
  \ prior is incoherent, conditionalizing on it can be dominated; but \"planned\"\
  \ coherence repairs can be accuracy-losing too). Hmm, this could be good but risks\
  \ being too niche.\n\nLet me reconsider. Perhaps a better pairing: the domain \"\
  Can culture be a cause? Weber's Protestant ethic thesis\" with the \"fair summary\"\
