  For the prompt, I want the grading model to catch:

  (a) the Newcomb conflation — the student treats the toxin puzzle as a case where
  dominance reasoning and expected-utility reasoning conflict, and as showing that
  the predictor''s accuracy is what makes the puzzle hard. In the toxin puzzle, the
  detection at midnight is not a prediction of your choice between boxes; there is
  no uncertainty at drinking time; the million is already banked. The relevant asymmetry
  is between intention-formation and action, not between two decision rules. Also,
  the toxin puzzle doesn''t depend on the predictor''s being a good predictor of your
  future action — it depends on the reward''s being tied to your state of mind and
  independent of your action. Actually in Kavka''s setup, the billionaire does detect
