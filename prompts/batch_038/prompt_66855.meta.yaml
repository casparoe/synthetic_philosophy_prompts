  Structure of my prompt:

  1. Role assignment + task framing: "You are a philosopher of action and decision
  theory who has graded many essays on Kavka''s toxin puzzle... Take your time and
  think carefully..."

  2. Context: I''m the TA for an upper-level course on rationality and intention;
  I need to grade one answer, assign a grade per the rubric, and write comments that
  justify it point by point.

  3. The exam question (verbatim, my own writing).

  4. The student''s answer (verbatim, my own writing, ~400-500 words).

  5. The rubric (e.g., 25 points total: accuracy of exposition 8, philosophical precision
  8, evaluation/argument 6, clarity/organization 3). Ask for sub-scores and a total.

  6. Instructions: work through the answer claim by claim before assigning a grade
  (brainstorming/analysis step); flag anything correct, anything that''s a simplification
  acceptable at this level, anything that''s a genuine error; distinguish errors of
  exposition from errors of reasoning; be specific about which sentence in the student''s
  answer contains each problem and what the correct claim is; note where the student
