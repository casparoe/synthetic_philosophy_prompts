  Exam question (philosophy of action / practical rationality course): "Kavka''s toxin
  puzzle: describe the setup, state precisely what Kavka takes the puzzle to show
  about intention-formation and rationality, and explain why the standard reply —
  that the agent can simply decide to drink the toxin in order to get the million
  — fails. In your answer, say whether the puzzle is a paradox about action or about
  intention."


  Student answer: mostly right on setup — the eccentric neurologist who will give
  you a million if at midnight tonight you intend to drink the toxin tomorrow afternoon,
  the toxin makes you sick for a day but no lasting harm, the money is transferred
  before you drink, and the predictor has a brain scanner. Right: the reward is for
  the intention, not the act; the intention is tested at midnight; you will have no
  reason to drink tomorrow since the money is already yours and drinking only makes
  you ill.


