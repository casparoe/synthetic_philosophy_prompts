  Good. Key structure of the actual paper (Öhman, Sandberg, Bostrom, Beard, "The Unilateralist''s
  Curse and the Case for a Principle of Conformity", published in International Journal
  of Applied Philosophy 2020; arXiv/working paper 2016):


  - Unilateralist situation: each member of a group can undertake or spoil an initiative
  regardless of cooperation/opposition of others.

  - Value of X independent of who undertakes X; each agent''s judgment subject to
  error (private noisy signal of a common value).

  - If true value negative, larger number of agents → greater chance at least one
  overestimates enough → initiative undertaken too often. Moral analog of winner''s
  curse.

  - Remedy: principle of conformity — reduce your likelihood of acting unilaterally
  to a level that ex ante would lift the curse; three implementation models (e.g.,
  majority rule / defer to the median or to the group''s judgment).

  - Note: "spoil" too — the curse also applies to blocking initiatives (i.e., a veto-holder
  who thinks the initiative is bad can spoil it unilaterally). That''s important and
  a nice detail: the curse is symmetric between undertaking and spoiling.


