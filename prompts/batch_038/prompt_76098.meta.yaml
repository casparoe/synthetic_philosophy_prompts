  a run of heads is what a p-hacker produces when they keep collecting data until
  they get the result they want; the play''s opening is thus a picture of optional
  stopping. But careful: in the play Rosencrantz calls heads before each flip; that''s
  a pre-registration analog — he states his prediction each time, and he''s right
