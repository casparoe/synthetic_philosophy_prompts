  but something else: a hypothesis specified in advance and confirmed 92 times, which
  raises the "too good to be true" / plausibility-of-the-record issue. And the frequentist
  would say the pre-registered prediction rule makes the run informative; a Bayesian
  would update toward "the coin is two-headed" with overwhelming force after ~10 flips
  — and then note that neither character ever does this, which is the interesting
  failure: they never perform the trivial Bayesian update. Why? Because the real explanation
