  Seed content: specific things to address. Let me enumerate the in-the-weeds items:


  1. Guildenstern''s four explanations as a hypothesis space: is that a Bayesian move?
  He generates rival hypotheses rather than just noting the improbability. Rosencrantz,
  by contrast, is unmoved — is he a frequentist (long-run frequency; one run tells
  you nothing) or just an idiot? Note the frequentist point: under the fair-coin hypothesis,
  any particular sequence of 92 outcomes is exactly as improbable as any other, so
  the surprise isn''t about the sequence''s probability per se. What makes the run
  evidence is that it''s improbable under the null but likely under the biased-coin
  alternative — i.e., a likelihood ratio, which is exactly the Bayesian machinery
  and also exactly what the likelihood principle says.


  2. The likelihood principle and optional stopping: the run is generated by sequential
  flipping with no pre-specified sample size; a Bayesian says the stopping rule is
  irrelevant to the evidential meaning of the data; a strict Neyman-Pearsonian says
  error rates depend on the stopping rule. Who is right about the scene? Does the
  scene dramatize the likelihood principle (Guildenstern reasons from what happened,
  not from what might have happened under other stopping rules)? And the "time has
  stopped dead, it''s one toss repeated" hypothesis as a version of the exchangeability/independence
  assumption failing — the data are not independent samples but a single sample replicated,
  i.e., a data-integrity problem (duplicated data, the Stapel-type case!). That''s
  a lovely link: hypothesis (2) is literally "the data are not independent — it''s
  one observation copied many times," which is a fraud/pseudoreplication diagnosis
  rather than a probability diagnosis. Nice and niche.


  3. Hume on miracles: prior probability of a law of nature being violated vs. the
  reliability of the observation; here there is no testimony — they see it themselves.
  But Guildenstern''s fourth hypothesis ("it really is just chance") is the Humean
  option, and note the asymmetry: the miracle hypothesis is confirmed by exactly the
  same data as the chance hypothesis. Also, is there a difference between "the coin
  is biased" and "the laws of probability are suspended"? A biased coin is a within-theory
  explanation; divine intervention is a theory-undermining explanation — an analog
  of auxiliary-hypothesis rescue in the Duhem-Quine sense. This is the "ad hoc rescue"
  point: the frequentist response to an anomaly is to look for an error in the apparatus/protocol
  (a measurement-error hypothesis), and only when all else fails to reject the null.


  4. The replication crisis connection: 92 studies all with p < .05, in the same direction.
  A run of significant results is itself suspicious (p-curve, "too good to be true"
  / GRIM / excessive significance tests). Actually there''s a real phenomenon: "the
  distribution of published p-values is implausibly concentrated" — and there''s the
