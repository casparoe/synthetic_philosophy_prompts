  is relative — so it''s all a matter of perspective / anything goes" — misusing relativity.
  Or: "the proxy-function argument shows you can permute the reference of every term
  and preserve truth, so any assignment works; Quine concluded that reference is a
  useful fiction" — misses that only permutations preserving the structure of the
  sentences/the pattern of hold-true are admissible, and Quine''s own point was that
  the permutation shows the question is meaningless without a background language,
  not that all permutations are equally correct translations.

