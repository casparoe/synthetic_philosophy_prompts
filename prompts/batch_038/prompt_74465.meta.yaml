  (a) Epistemic vs. metaphysical: the popularizer says "we can never know what the
  native''s words refer to, but there is a fact of the matter that we''re cut off
  from" — that''s exactly backwards from Quine''s thesis; Quine insists there''s no
  fact of the matter, and that this is not skepticism but the rejection of a picture.
  This is a classic subtle error and the crux. Good.

  (b) Conflation with underdetermination of theory by evidence: "it''s just the Duhem–Quine
  point applied to meaning: evidence underdetermines the choice of translation, so
  we pick the most convenient one" — misses Quine''s insistence (esp. later) that
  indeterminacy of translation exceeds underdetermination of natural science, because
  there''s no further fact even beyond all possible evidence about neural states etc.

  (c) Overstatement: "therefore communication is impossible / we never really know
  what anyone means / all understanding is a lucky guess" — Quine''s own view is that
  within a home language, reference is fixed by the background language and the indeterminacy
  is not a practical obstacle; he was a realist about the physical and about his own
  ontology ("ontological relativity" is not ontological irrealism; "no entity without
  identity"; the relativity is to a background theory, and within it reference is
  determinate). Also: Quine happily says the inscrutability is resolved pragmatically
  by choosing a manual; and he thought the question of what our own words refer to
  is settled relative to our own background language.

