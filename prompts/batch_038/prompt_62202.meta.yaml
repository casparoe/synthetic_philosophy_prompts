  a beautiful conceptual issue: linear pooling fails "external Bayesianism" / dynamic
  coherence, and it means that Harsanyi-style aggregation cannot be understood as
  representing a real collective agent that updates over time. That''s in the weeds
  but not fact-dependent, and it''s a conceptual explanation task.

