  theorem (linear pooling) that''s nearly assumption-free; the latter adds a substantive
  identification argument (impartial observer / veil of ignorance + acceptance principle)
  that converts the linear pool into utilitarianism. The conceptual point: linear
  pooling of utilities is not utilitarianism unless the individual utility scales
  are made comparable and cardinal, and unless you add the identification of each
  person''s utility with the observer''s own.

  2. The distinction between ex ante Pareto and ex post Pareto, and how linear pooling
  satisfies ex ante Pareto but violates ex post Pareto — and the classic worry (Mongin,
  Seidenfeld et al.) that linear pooling is dynamically inconsistent / vulnerable
