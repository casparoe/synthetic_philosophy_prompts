  I think the socialist calculation debate is rich. Let me construct:


  Question (an exam question from a history of economic thought / political philosophy
  course): "In 1920 Mises argued that rational economic calculation is impossible
  under socialism. In 1936 Lange argued that a socialist planning board could replicate
  the market''s allocation of resources. Explain how Lange''s model is supposed to
  answer Mises, and evaluate whether it succeeds. In your answer, be precise about
  which of Mises''s objections Lange''s model actually addresses."


  Student answer: Gets the visible things right — Lange''s trial-and-error method:
  managers of state-owned firms told to (1) minimize average cost of production for
  any given output level, and (2) set output where marginal cost equals price; the
  Central Planning Board sets prices parametrically (i.e., managers treat prices as
  given data, not as things to be bargained over), adjusts them up when there''s excess
  demand and down when there''s excess surplus — a Walrasian tâtonnement; consumers
  have freedom of choice among consumer goods; workers have freedom of occupational
  choice; capital goods are allocated administratively. Lange claims this is more
  efficient than competitive capitalism because the state can internalize externalities
  and avoid the waste of monopoly/business cycles. He also says socialism can use
  "given" data, and the planning board''s trial and error mirrors the market.


