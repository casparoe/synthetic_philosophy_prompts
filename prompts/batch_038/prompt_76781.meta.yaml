  framework where the data are known to the planning board. Also Lerner''s marginal
  cost pricing. Also that Mises''s 1920 article "Economic Calculation in the Socialist
  Commonwealth" and his 1922 Socialism book; Hayek''s 1935 Collectivist Economic Planning
  intro; Lange & Taylor 1938 "On the Economic Theory of Socialism." Also the debate''s
  later reappraisal, e.g., Don Lavoie''s "Rivalry and Central Planning" arguing that
  the debate was mis-framed by both sides; also Alec Nove; also that Lange later conceded
  the difficulty (in 1990 Lange wrote about information problems).


