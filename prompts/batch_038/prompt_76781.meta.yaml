  Actually, I know Lange''s model well enough:

  - Two rules for production managers: (1) combine factors so as to minimize the average
  cost of production of any given output; (2) determine output scale so that marginal
  cost = price of the product.

  - The Central Planning Board sets prices of producers'' goods parametrically (managers
  take them as given), and revises them by trial and error: raise price if excess
  demand, lower if excess supply. This mirrors Walrasian tâtonnement.

  - Consumers have freedom of choice in consumption (consumer goods distributed via
  market with money incomes); workers have freedom of occupational choice.

  - Lange argues socialism could be more efficient: it can internalize external economies/diseconomies,
  avoid business cycles and unemployment, and achieve a more equal distribution (which
  affects the "optimum" distribution of production).

  - Lange also says socialism could retain markets for consumer goods and labor; only
  the capital goods market is replaced by administration.

  - Lange argued the "trial and error" is feasible; the alternative would be solving
  simultaneous equations (as Barone showed theoretically possible) but that''s impractical.

  - Hayek''s response (in "The Present State of the Debate" 1935, in Collectivist
  Economic Planning): Lange''s solution assumes the data are given and known to the
  planning board; it only works in a static state; the real problem is that in a world
  of continuous change, the knowledge is dispersed and the board cannot obtain it;
  also, even if the equilibrium solution were known, the board''s price-setting would
  be arbitrary and the "rules" require knowing actual cost functions.

  - Mises''s position: In Human Action and in "Planned Chaos"/"Economic Calculation"
  essay, Mises said socialism could use prices observed in world markets (for a small
  open economy) or could imitate; but he denied it could generate its own prices.
  Also Mises later framed it as: socialism is not "unthinkable" but "unrealizable"
  / not practicable (in the 1932 German edition of Socialism? Actually Mises in "Economic
  Calculation in the Socialist Commonwealth" concluded that socialism is "unrealizable"
  as a system of economic calculation... and later, in Human Action, he distinguished
  between "impossible" and "unrealizable"). There''s a well-known claim: Mises in
  1951/1956 wrote that socialism can calculate but the calculation would be... hmm.
  Also Don Lavoie in "Rivalry and Central Planning" (1985) argued that the standard
  account of the debate (as settled by Lange) is wrong: the debate was really about
  dynamic rivalry/knowledge, and that both Mises''s and Hayek''s arguments were misunderstood
  as static impossibility claims. Also Israel Kirzner. Also Vaughn''s Austrian Economics
  in America.


