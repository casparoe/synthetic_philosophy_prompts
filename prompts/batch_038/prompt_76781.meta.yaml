  argument didn''t depend on). The classic point: Mises''s argument is about the absence
  of *prices for capital goods* and hence the impossibility of calculation, not about
  knowledge dispersion per se. And notably, Hayek''s knowledge critique and Mises''s
  impossibility thesis are distinct; Mises later (in Omnipotent Government / planned
  chaos, and in Human Action) softened to the claim that socialism can''t *generate*
  prices but could *use* prices taken from a surrounding market economy, or that it''s
  "not realizable" / impracticable. Also Lavoie''s point that the debate is a rivalry/dynamic
  process argument.

