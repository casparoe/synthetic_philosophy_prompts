  The phenomenon: In cyclical theories of history, the period of the cycle is a free
  parameter that gets set after the data are in, and any disagreement about whether
  a cycle is present is resolved by re-choosing the period. Two instances:


  1. Ibn Khaldun''s dynasty cycle of about four generations / 120 years. When a dynasty
  lasts far longer than that (e.g., the Ottoman dynasty ~600 years, or Chinese dynasties
  of varying length 100–300 years), the defender doesn''t count it as a failure; the
  generation-count is stretched, or a sub-cycle is posited within the longer one,
  or the dynasty is said to have "really" died earlier and continued as a husk.


  2. Spengler''s seasonal scheme: the phase boundaries are located by matching cultural
  style (music, mathematics, architecture) rather than by dates, so a culture that
  seems to be in its "winter" for a long time is said to be in a longer winter; and
  the scheme is fitted to the eight cultures Spengler chose to include, which are
  the ones that fit.


  3. When two people apply the same cyclical theory to the same present moment and
  disagree — one says "we are in the late Republic, winter, decline" and another says
  "we are in the spring of a new culture" — the disagreement cannot be settled by
  any evidence, because both readings are compatible with the same events; the events
  are assigned to phases, not the phases to events.


  So the deeper point the asker wants named: the cycle''s period and phase boundaries
  are chosen from the data after the fact, so the theory never risks a failed prediction,
  yet its defenders experience themselves as making substantive claims. And also the
  related point: because you have essentially one long series (history happens once),
  you can always find some periodicity in it — the "n = 1" problem — and any series
  of rises and falls can be re-described as a cycle at some scale. The asker wants:
  is there a name for this? Is it just unfalsifiability? Is it the Texas sharpshooter
  fallacy? Is it "curve fitting"? The asker should note that those don''t feel right
  because (a) no prediction was ever made and failed and then patched (so not ad hoc
  rescue in the usual sense), and (b) it isn''t a conspiracy or a fallacy of clustering
  — it''s a structural feature of the theory''s parameters being chosen post hoc at
  a free scale, and (c) it''s not quite "unfalsifiable" because the theory does seem
  to make contentful claims that historians can argue about productively.


