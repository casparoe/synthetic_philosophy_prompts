  Emperor''s New Clothes" is not the moral fable about vanity I remembered; read carefully,
  it is a precise model of exactly the situation I was in.


  I want to write a short piece for our department''s staff blog that treats the tale
  as a piece of epistemic game theory rather than as an edifying parable about pride.
  Help me by writing the critical reading I''ll work from — under 900 words, and I
  want a committed reading, not a survey of interpretations: take positions and argue
  for them.


  Specifically:

