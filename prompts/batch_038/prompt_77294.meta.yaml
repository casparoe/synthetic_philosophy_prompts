  who inspects the loom believe — about the cloth, about what the other inspectors
  believe, about what the Emperor believes? The usual gloss is that everyone secretly
  knows he is naked but is afraid to say so, and I suspect that gloss is wrong in
  an important way: I think they do know something privately and are wrong about something
  else. Say precisely what each party knows and what each is mistaken about, and whether
  the situation is best described as pluralistic ignorance, preference falsification,
  or a failure of common knowledge, since those come apart.

  2. What exactly does the child''s shout change? Distinguish "everyone knows p" from
  common knowledge of p, and say whether the story gives us a genuine public announcement
  in the sense of dynamic epistemic logic — an announcement that is common knowledge
  because it''s public, truthful, and free of cost — or whether the child''s remark
  succeeds for reasons that have nothing to do with publicity (the child is outside
  the game, has no reputation to lose, and cannot be accused of being unfit for office).

  3. The story doesn''t end with the shout. The procession continues, and the people
  who were carrying the nonexistent train go on carrying it. Take a position on what
  that ending says about the relationship between common knowledge and coordinated
  action — is it the story''s sharpest point, and does it undercut the moral I''ve
  been drawing from it about my own board?

  4. Tell me where the formal apparatus misleads if I press it too hard on the tale,
  and where the tale is doing work the apparatus can''t: in particular whether a story
  about clothes and shame can teach anything about common knowledge that a muddy-children
  style puzzle can''t.


