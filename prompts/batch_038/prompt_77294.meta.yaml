  Six weeks ago our regional health authority''s executive board approved a reorganisation
  that, in private, essentially every colleague I spoke to thought was a mistake —
  including, I suspect, several people in the room where it was approved. Nobody said
  so. I''ve been trying to work out since then why, and reading the story aloud to
