  variance, not about level; and equalizing environments increases heritability. Also:
  h² is population-relative, so a high h² in one population says nothing about between-group
  differences (Lewontin''s seed/plantation thought experiment — that''s well known
  but the prompt shouldn''t require citation; the model can just describe it).


