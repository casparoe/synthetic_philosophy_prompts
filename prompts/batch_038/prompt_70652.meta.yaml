  to oil that makes the wheels of commerce run more smoothly." That''s paraphrase,
  no quotation marks. Fine.

  - Of the Balance of Trade: the price-specie-flow mechanism — a country that loses
  too much money becomes cheaper, foreigners buy, money flows back; so no country
  can lose all its money. Paraphrase: the automatic reflux of specie.

  - Policy conclusion (Of the Balance of Trade, near the end): the good policy of
  the magistrate consists only in keeping the quantity of money, if possible, still
  increasing — because that keeps a spirit of industry alive. I must not quote. I''ll
  paraphrase: "the closing recommendation that the wise magistrate should try to keep
  the quantity of money, if possible, still increasing, on the grounds that this keeps
  a spirit of industry alive in the nation."

  - Tension: if in the long run the quantity of money is neutral and the balance of
  trade self-corrects, why is a growing money supply good policy? Because of the transition
  effect. But then a mercantilist who keeps inflow going forever would look vindicated
  — Hume''s anti-mercantilism becomes a claim about the long run only, while his policy
  advice lives in the short run.

  - Another wrinkle: the transition effect depends on there being idle labor/resources
  — Hume''s argument runs via increased employment of the poor and industrious; and
  on the inflow arriving gradually and unevenly (through merchants first, then spreading).
  If money arrives all at once, prices jump and no industry gain. So the mechanism
  is distributional/temporal, not aggregate.

  - Also the jealousy-of-trade essay (Of the Jealousy of Trade) and his worry that
  Hume simultaneously endorses free trade and yet recommends export promotion for
  specie; plus Of Public Credit where he is gloomy about paper credit and national
  debt — an interesting contrast: in Of Money he''s cool about the quantity of money,
  but in Of Public Credit he thinks paper credit and public debt are dangerous. Some
  scholars note that Hume''s hostility to paper money isn''t explained by the quantity
  theory but by his theory of credit as resting on opinion/confidence.

  - Also Of Interest: low interest is an effect, not a cause, of flourishing commerce
  — both come from increased commerce and stock; the quantity of money doesn''t determine
  the interest rate (contra Locke). That''s a nice in-the-weeds point: Hume explicitly
  denies that the rate of interest depends on the quantity of money; the three causes
  are the demand for borrowing, the riches to supply it, and the manners of the people.
  That''s a real tension worth mining: if money is neutral in the long run, why does
  he bother with the "transition" causal story at all?

  - Also nominal/real: Hume on raising the denomination of coin — argues it''s a fraud
  on creditors and foreigners adjust, no real gain; but he allows that insofar as
  it doesn''t affect foreign trade it can... He argues against it mostly on grounds
  of justice/creditors.


