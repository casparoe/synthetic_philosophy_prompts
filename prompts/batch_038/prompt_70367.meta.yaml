  Argument:

  (1) Some ordinary empirical claims are things I know, not merely believe — e.g.,
  that I have two hands, that this is a table, that I had breakfast this morning.

  (2) Knowledge is closed under known entailment: if I know p, and I know that p entails
  q, then I know q.

