  Structure:

  1. Context: student in a seminar (say, a second-year philosophy of mind / interdisciplinary
  cognitive science course) where they read GEB''s typogenetics chapter; a classmate
  circulated a recap of the argument on the course forum (or a popular blog the seminar
  was pointed to). Asks for an accuracy audit.

  2. The summary itself (in quotes, invented by me, in the voice of a confident popularizer).

  3. The asks: go through it claim by claim; separate claims about (i) the toy model
  as Hofstadter actually specifies it, (ii) real molecular biology, (iii) Gödel''s
  first incompleteness theorem, (iv) philosophy of mind/machine; grade each as accurate
  / acceptable simplification / subtly wrong / flat wrong; identify the load-bearing
  error; say what a careful reader of Hofstadter would object to; whether the conclusions
  survive correction; what would have to be true for the "formally incomplete" claim
  about a cell to have content (consistent, effectively axiomatized, arithmetically
  rich, truth-apt); and whether the anti-mechanist ending is Hofstadter''s own view
  or his opponents''.

  4. Epistemic request: which of my [the response''s] corrections is least secure,
  what would change its mind — e.g., what feature of the chapter or of the biology,
  if I''ve misremembered it, would flip a given verdict; and where the audit''s reasoning
  is most likely to fail (e.g., charity vs. strictness in reading "isomorphism").

  5. Also perhaps: "Don''t give me a bibliography" — no, don''t need. But could ask
  not to invent quotations. Actually a nice touch: "If you''re unsure whether Hofstadter
  says something, say so rather than quoting him — I''ll check the book." That fits
  the "no web access" constraint gracefully and is realistic for a student.


