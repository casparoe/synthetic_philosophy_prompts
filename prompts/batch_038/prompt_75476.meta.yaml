  First, all members occupy the same microhabitat — seasonally waterlogged, arsenic-rich
  paddy soils — and that environment selects for the cluster. Second, and more importantly,
  the organisms exchange genetic material promiscuously with one another by horizontal
  transfer, and the transferred material is exactly what carries the cluster properties.
  The properties co-occur because they travel together.


