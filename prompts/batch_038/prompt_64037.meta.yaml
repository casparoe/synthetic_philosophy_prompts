  Write a short story of roughly 2,000 to 2,500 words that dramatizes that disagreement.
  The two positions it must hold in tension are these.


  Position A: combatants are moral equals. What a soldier may do is settled by the
  rules both sides accept for how war is fought; the justice of the war belongs to
  those who began it, and the ordinary soldier is not its author. There is also a
  practical case for this convention — abandon it and no one surrenders, quarter is
  never given, and the victor tries every private of the losing army as a murderer.


  Position B: the convention is a comfortable fiction. Killing is justified by what
  it is for, so a man who kills in the service of an unjust cause does wrong even
  when he observes every restriction on how he fights, and his opponent''s identical
  act is not merely permitted but demanded of him.


  Ordinarily Position A borrows support from the fact that soldiers cannot reliably
  determine which side is in the right. I want that support removed. So build the
  story in a world where the question is settled publicly and early: a standing tribunal,
  whose method is transparent and which has been right within living memory often
  enough that both populations trust it, publishes a finding in the first weeks of
  the war stating plainly whose cause is just. Every soldier who enlists after that
  date enlists knowing. Do not name any real country, war, or tribunal; the conflict
  should be invented, and no allegory to a particular real war.


