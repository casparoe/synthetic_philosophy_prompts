  I am a junior at a public high school, and for the creative-writing unit my teacher
  has agreed to let me propose my own subject, on the condition that the story engage
  a genuine intellectual dispute rather than a mood. My subject is a disagreement
  within the ethics of war about whether soldiers on the two sides stand on equal
