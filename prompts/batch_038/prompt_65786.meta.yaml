  I am writing a handout for a reading group on higher-order evidence and I have constructed
  an argument that I cannot disarm. The case is modeled on double-reading in screening
  radiology. Our imaginary regulator requires that two appraisers of equal training
  and equal seniority independently judge whether the submitted trial data — call
  it E — support the claim that the drug works — call it H. Discordant judgments are
  not averaged and not sent to a referee; the protocol simply records a flag and instructs
  both appraisers to treat the dossier as unsettled.


  Suppose I am the first appraiser. I read E, it strikes me as supporting H, and I
  believe H. The protocol then informs me that the second appraiser, working from
  the same E under the same instructions, judged that E does not support H. Here is
  the argument:


  (1) What I rationally ought to believe is settled by my total evidence, and my total
  evidence includes everything I have learned about the trustworthiness of my own
  reading of the evidence.

  (2) The second appraiser''s dissent is strong evidence that my reading of E is untrustworthy:
  we are equally trained, we saw the same data, and neither of us has any reason to
  prefer our own reading to the other''s.

  (3) Evidence that my reading of E is untrustworthy is evidence against the claim
  that E supports H.

  (4) So my total evidence contains a strong case against its own first-order component,
  and all things considered it does not support believing H.

  (5) But whether E supports H is a matter of E and H. It is not made true or false
  by anyone''s reading of it, including mine.

  (6) E remains part of my total evidence after the dissent, and E supports H or it
  does not. If it does, then by (5) it still does after the dissent, and by (1) what
  I ought to believe is settled by my total evidence, of which E is a part.

  (7) Take the case in which E does support H. Then (6) tells me I ought to believe
  H and (4) tells me I ought not. The conflict cannot be settled by appeal to further
  evidence, because by (1) I have already taken account of all of it.

  (8) Nor can it be settled by revising (5): if the dissent could make E stop supporting
  H, then what E supports would depend on how E is read, and (5) would be false —
  but (5) is the only thing that keeps the first-order question a real question rather
  than a report on our psychology.

  (9) So in the case where E supports H, rationality requires me both to believe H
  and to withhold it, and the only escape is to keep believing H while holding that
  my total evidence does not support believing H. That is akrasia entered into knowingly.

  (10) Nothing in (1)–(4) depended on there being a second appraiser. I know that
  any reading of evidence I perform might be untrustworthy, and that knowledge is
  itself part of my total evidence.

  (11) So by the same steps, for every belief I form by reading evidence, my total
  evidence fails to support it.

  (12) Hence (1), applied consistently, requires universal suspension of judgment
  from anyone who knows they are fallible, and knowing akrasia from anyone who does
  not suspend.

  (13) Universal suspension of judgment is not rationally required of me. I have good
  evidence for a great many things, and a standard that forbids me to believe them
  is not a standard of rationality.

  (14) Therefore (1) is false.


