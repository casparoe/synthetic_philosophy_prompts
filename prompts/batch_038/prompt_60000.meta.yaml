  Design the passage: Victorian antiquarian prose, ~250-300 words, dense, with:

  - An argument from ethnographic analogy: modern "savage" peoples'' use of objects
  → interpretation of ancient European grave goods.

  - A claim about "survival": customs persist after their reasons die, so an object''s
  meaning can be read from a later context where it persists as a form without a function.

  - A step where he infers belief from a burial arrangement (e.g., a broken/bent sword
  or a pierced coin, food vessels, orientation of the body).

  - A slippery move: from "the thing was placed there" to "they believed X."

  - Also a claim about institutions inferred from object-standardization (e.g., uniform
  weights → a market authority / a magistracy that guarantees measures). That''s a
  nice in-the-weeds item: inferring institutions from artifact regularity. That connects
  to "reconstructing beliefs and institutions from objects."


  Let me write the passage with several distinct inferential moves so the questions
  can be sharp:


  Passage draft (Victorian style, invented):


  "There are who object that from a thing buried we may learn only that it was buried.
  I answer, that the grave is not a mere receptacle but a sentence, and that the manner
  of its arrangement is a predicate. Consider the blade laid beside the dead, but
  bent double, or broken across the knee before it was laid down: for what end should
  a man spoil a good weapon, unless that the thing which passes with the dead must
  first be unmade for the use of the living? It is here that we may lawfully call
  upon the testimony of ruder peoples now surviving in other quarters of the world;
  not as though these were our own forefathers standing still while we advanced, which
  is a folly, but because where an usage has been carried whole from one state of
  society into another, and there persists after the reason of it has perished, the
  later form is a fair index of the earlier meaning. The same holds of institutions.
  Where a hundred bronze weights, dug from a hundred unrelated barrows and towns,
  answer to one another within the width of a thumb-nail, we do not have a hundred
  accidents but one custom; and a custom so exact cannot hold itself in being without
  some hand to see it kept, which hand is what we mean by an office, and an office
  implies a body that gives it. So from the sameness of the things we ascend to the
  rule, and from the rule to the rulers."


  That''s decent — dense, Victorian, and contains multiple inferential steps: (1)
  grave as "sentence"/predicate; (2) the bent/broken blade → "killing the object"
  inference; (3) ethnographic analogy with an explicit disclaimer (ruder peoples are
  not "our forefathers standing still") — and the question is whether the disclaimer
  actually does the work he needs; (4) uniform weights → custom → enforcement → office
  → polity.


