  Harsanyi (1955), "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons
  of Utility," JPE. The theorem: Let U_1,...,U_n be vNM utility functions representing
  individual preferences over prospects (lotteries over states), and let W be a social
  welfare function representing social preferences over the same prospects. If (i)
  each U_i and W satisfy the vNM axioms (expected utility), and (ii) the Pareto condition:
  if every individual is indifferent between two prospects, society is indifferent;
  and if some prospect is at least as good for everyone and strictly better for someone,
  society strictly prefers it — then W = a_1 U_1 + ... + a_n U_n + b, with a_i > 0.
  (Weak Pareto indifference gives the linear form with a_i ≥ 0; strong Pareto gives
  a_i > 0.)


  Then Harsanyi''s second step: the "impartial observer" / "equiprobability" assumption
  — if the social observer has an equal chance of being any individual, then a_i =
  1/n (equal weights), yielding average utilitarianism.


  Objections/details:

  - The theorem requires social preferences over prospects to satisfy the vNM axioms
  — in particular the Independence axiom. Any social evaluation that is nonlinear
  in individual utilities (maximin, prioritarianism, egalitarianism in the "distribution
  matters" sense) violates Independence. This is Broome''s point (Weighing Goods /
  "Fairness"): the Pareto principle plus vNM rationality at the social level forces
  utilitarianism; egalitarians must reject either.

  - Interpersonal comparisons: the theorem''s conclusion is unique only up to a positive
  affine transformation of W, and it presupposes each U_i is itself fixed up to affine
  transformation, so the weights are only meaningful given a choice of zero point
  and unit for each person. The "zero" matters: adding a constant to someone''s utility
  changes the weighted sum''s ranking only if weights differ... Actually adding a
  constant to one person''s utility changes W by a_i * const, which is a constant,
  so it doesn''t affect rankings over fixed-population prospects. Hmm, right: with
  fixed population, a shift in one individual''s utility zero point adds a constant
  to W and doesn''t change rankings. So the zero point is irrelevant with fixed population
  but matters with variable population (this is a well-known point: in variable-population
  cases, the zero point of utility becomes morally significant — that''s why average
  vs total utilitarianism differ, and why "critical-level" views arise). Good — I
  could include that as a beat: "the device can''t handle people who don''t exist
  yet because it doesn''t know where to put zero." That''s a genuinely sharp point.

  - Population must be fixed; the theorem says nothing about who exists.

  - The weights a_i > 0 mean no one can be given zero weight (so a pure dictatorship
  is excluded), but the theorem doesn''t say the weights are equal.

  - It''s a "coherence" argument: if your social preferences are vNM-rational and
  Pareto-respecting, you must be a weighted-sum utilitarian. It doesn''t tell you
