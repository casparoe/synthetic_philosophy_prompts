  I''ll paraphrase the argument: James considers the view that the universe is composed
  of elementary psychic units ("mind-stuff") which combine to yield the minds of higher
  organisms; he objects that when you take many small feelings and aggregate them
  as tightly as you can, the result is just a heap of those feelings — each still
  separate — and no new, single, unified feeling belonging to the whole emerges; and
  if each of the parts is itself already a subject with its own point of view, then
  there is no way for those many points of view to become one point of view, since
  the subjecthood of the whole would have to be built out of subjects that are, by
  hypothesis, distinct from it. He also raises something like: the "feeling" of a
  compound cannot be inferred from the feelings of the components, and the argument
  by analogy from chemistry (compounds with emergent properties) fails because chemical
  properties are properties of things that can be described from outside, whereas
  a feeling''s being is its being-felt-by-someone.


  Also worth including in my paraphrase: James''s point that the panpsychist "mind-dust"
  theorist is obliged either to say the combination is real and hence the parts lose
  their subjecthood, or to say it''s merely apparent.


