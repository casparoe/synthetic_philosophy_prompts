  ---


  I cover science and ideas for a British magazine, and I have been commissioned to
  write a long feature on the revival of panpsychism — the view that experience, or
  something precursory to it, is a basic feature of the natural world rather than
  something that switches on at the level of brains. My editor wants the piece to
  have some historical spine to it, and I keep coming back to the objection William
  James presses in the first volume of his 1890 Principles of Psychology, in the chapter
  where he takes up what he calls the mind-stuff theory: the proposal that the universe
  is built out of tiny units of feeling which, aggregated in the right way, amount
  to the minds of higher organisms. Because I am working from a library scan and I
  would rather not misquote, what follows is my own close paraphrase of the argument
  rather than his sentences; please treat the wording as mine and, where you think
  my rendering has drifted from what James actually argues, say so plainly. My paraphrase:
  the panpsychist of this kind says that matter is everywhere accompanied by feeling,
  and that the feeling of an organism is the sum of the feelings of its parts. James''s
  response is that a sum of feelings is not a feeling of a sum. Take a hundred of
  these elemental feelings, shuffle them, pack them together as tightly as you like,
  and what you have at the end is still a hundred feelings, each with its own private
  being; nothing in the operation produces a hundred-and-first item that is a single
  subject aware of them all together. If each unit is already a subject with its own
  point of view, then the many points of view remain many, because the being of a
  feeling just is its being felt by someone, and there is no candidate for who feels
  the aggregate. He also seems to think the analogy the theory leans on — chemical
  compounds having properties their elements lack — cannot do the work here, because
  a compound''s novel properties can be specified from outside by an observer, whereas
  a novel feeling would have to be felt by somebody in order to be novel in the relevant
  sense at all.


  Now, for my own purposes I have been sorting the combination problem into four distinguishable
  puzzles, and I want to know which of them James''s argument is actually aimed at,
  because I suspect people cite it as though it settled all four at once. My four:
  (i) subject combination — how many subjects could become one subject; (ii) quality
  combination — how elementary phenomenal qualities could combine into the rich, structured
  qualities we actually have, such as a continuous stretch of colour out of many micro-hues;
  (iii) perspectival combination — how many points of view could become a single point
  of view on one world; and (iv) binding — how the contents of an already unified
  subject are organised into one scene at a time rather than a succession of disconnected
  awarenesses. Four questions follow. First, which of (i)–(iv) does the paraphrased
  argument genuinely engage, and which does it merely sound as though it engages?
  Second, is James arguing against panpsychism as such, or only against an aggregative,
  constitution-first version of it — one on which the composite subject is nothing
  over and above its components and the components are already full-blown subjects?
  I ask because I want to know whether the argument still bites on positions James
  did not have in front of him: a view on which the fundamental units are precursory
  of experience rather than experiential, so that no actual subject has to be summed;
  and a view that runs the direction of dependence the other way, holding that the
  whole is prior to the parts, which then inherit their character from it rather than
  lending theirs to it. Third, how much work is the shuffling-and-packing imagery
  doing? Is it an argument — that aggregation preserves the number of items and therefore
  cannot yield unity — or is it a vivid way of registering that we cannot imagine
  the transition, which would be a considerably weaker claim, and how would you tell
  the two apart in the text? Fourth, a neuroscientist friend of mine insists that
  what James is describing is simply the binding problem in nineteenth-century clothes,
  and that there is no distinct combination problem. I want to push back carefully
  rather than rhetorically: is she right, partly right, or wrong, and what exactly
  is the difference between explaining how a subject''s contents are bound and explaining
  how the subject itself comes to be?


  Please answer as a professional philosopher of mind who also has a genuine command
  of the history of the discipline — someone who would be equally at home explaining
  the argument to a general reader and picking apart its logical form for a specialist.
  Begin with a short passage of thinking-out-loud: before you commit to an interpretation,
  sketch two or three competing readings of what James is doing in this argument and
  say what would decide between them. Then work through my four questions in order,
  making the structure of the argument explicit — premises, conclusions, and the points
  at which a premise is doing more work than James seems to notice. Finally, and this
  matters to me as a journalist, I want you to be scrupulous about the epistemic status
  of everything you assert. Separate what is settled among people who work on this
