  Student answer: ~350-450 words, mostly competent, with 1–2 subtle errors. Let''s
  plan the errors:


  Error 1 (conflation): The student says that the divide et impera move and structural
  realism are the same response — i.e., that keeping the "working part" of a theory
  just means keeping its mathematical structure, so Psillos''s selective realism and
  Worrall''s structural realism are versions of one strategy. That''s a conflation
  a hasty grader might let slide: Worrall''s structural realism keeps the *structure*
  (mathematical relations) while dispensing with the ontological interpretation; the
  divide et impera response keeps those *theoretical posits* that do the explanatory
  work and discards idle ones. They overlap but they''re not the same, and importantly
  structural realism is a different conception of what survives (relations without
  relata) whereas divide et impera is about which components were really "working."
  Also the Fresnel case is treated differently: divide et impera says the ether wasn''t
  doing work (or the "working part" is the equations); Worrall says the equations
  survived as structural content. Hmm — actually Worrall''s point is precisely that
  Fresnel''s mathematical structure survived, which is close to divide et impera''s
  "working part." The subtle difference: Worrall claims this shows *continuity* across
  theory change (the structure was preserved), while divide et impera is a claim about
  *which posits* were genuinely load-bearing and thus the target of the no-miracles
  argument. Also, importantly, Worrall''s version abandons claims about the *nature*
  of what carries the structure, whereas Psillos retains ontological commitments to
  the preserved entities/processes. So the conflation "these are just the same answer
  under different names" is a genuine subtle error that deserves marking down.


  Error 2 (misattribution / non-sequitur): The student says Stanford''s new induction
  is answered by the same selective move, because the pessimist has to point to *specific*
  unconceived alternatives and Stanford never does, so realism is untouched. That''s
  actually a real objection in the literature (the "specificity" objection) — hmm,
  so it''s not flatly wrong; but the student''s framing might be that "since Stanford
  can''t name the alternatives, his argument has no content" — which is too quick
  because the new induction''s force is precisely that we don''t know which parts
  of our theories have unconceived alternatives; the challenge is that divide et impera
  requires knowing which posits are working, and Stanford''s argument targets our
  ability to know that. Actually, the more careful statement: Stanford argues that
  the historical record shows scientists repeatedly failed to conceive of plausible
  alternatives, so we have no reason to think our current theories exhaust the space;
  selective realism needs a principled way to identify the "working" parts, and that
  identification itself depends on our theorizing which may be undermined. So a student
  answer that says the selective move "straightforwardly" answers Stanford commits
  a non-sequitur — but many students would say that. I want something subtler.


