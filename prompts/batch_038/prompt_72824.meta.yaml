  ---


  I write a monthly column on science and ideas, and a piece I''m drafting has outgrown
  its assignment. It began as a story about knowledge graphs: the subject-predicate-object
  triples that companies use to store what they claim to know, and the question of
  whether a machine that manipulates such triples ever represents anything. For comment
  I went to a philosopher of language, who was dismissive in a way I couldn''t follow:
  a triple, he said, is only a list, and a list does not say that its items hang together,
  so no aggregate of triples could be true or false. He connected this to Bradley''s
  regress and to the unity of the proposition, and told me the point was old. I have
  since tried to reconstruct the argument in steps I could print, and the reconstruction
  now worries me, because it seems to establish far more than he wanted. Here it is.


  (1) Any representation to the effect that a stands in R to b, when fully explicit,
  consists of constituents: something for a, something for R, something for b. This
  is how a knowledge graph states it, and it is also how a theorist of structured
  propositions states it.

  (2) Constituents, taken simply as constituents, form a list; and a list does not
  say that its items are related. Since saying something is what truth and falsity
  require, a list is neither true nor false.

  (3) So for the constituents to amount to a representation, something must combine
  them. Call that combining T.

  (4) T is not among the constituents, because by (1) the constituents were already
  fully enumerated. So T is a further item, which must itself be brought into combination
  with them.

  (5) Bringing T into combination with them is an operation of the same kind, requiring
  its own T'', and so on without end.

  (6) Therefore there is no stage at which the constituents amount to a representation;
  the series never reaches anything with a truth value.

  (7) So nothing built from constituents represents anything: there are no true structured
  propositions, and no true triples.


  The trouble is what (7) does not spare. If it holds, it holds for every account
  of representation on the same terms — a neuroscientist''s claim that a firing pattern
  carries information about a direction of motion, a semanticist''s claim that a name
  stands for its bearer, and the claim that my own column says anything at all. And
  step (8), which my philosopher did not put to me, seems to close the trap on the
  argument itself: (8) The argument is offered as true, and its conclusion is supposed
  to follow from its premises; but by (7) premises do not genuinely stand in inferential
  relations to conclusions, so the argument states nothing. (9) Hence the argument
  is either false or empty.


  There is also a pressure I can feel but not locate. The principle that makes the
  series at (5) vicious — that if each combining waits on a further one, no combining
  is ever achieved — looks like it would condemn regresses that nearly everyone treats
