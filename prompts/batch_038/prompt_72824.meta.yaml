  ---

  I''m a staff writer at a magazine that covers science and ideas, and I''ve been
  assigned a piece that keeps turning into a piece about metaphysics. [Setup: reported
  on knowledge graphs, went to a philosopher for comment, philosopher said "a triple
  is just a list; nothing in a list makes it true," gesturing at Bradley''s regress;
  I reconstructed the argument to make sure I could explain it; but when I extended
  it I found it seems to refute far more than the philosopher intended, including
  possibly his own claim.]


  Argument:

  (1) A representation that a stands in R to b, when fully spelled out, is a structured
  collection of constituents: an item for a, an item for R, an item for b. (This is
  how a knowledge graph spells it out — a triple — and how a structured-proposition
  theorist spells it out.)

  (2) A collection of constituents, taken just as constituents, is a list; a list
  does not say that its items are related, and so does not say anything at all: it
  is neither true nor false. (Frege''s point, as I understand it.)

  (3) So for the collection to amount to a representation — to be true or false —
  something must combine its constituents; call this combining tie T.

  (4) T is not one of the constituents, since the constituents are already fully listed
  in (1); so T is a further item that must itself be combined with the collection.

  (5) But combining T with the collection is another such operation, requiring T'',
  and so on without end.

  (6) Hence no stage at which the constituents ever amount to a representation: the
  series never terminates in something with a truth value.

  (7) Therefore nothing that is structured out of constituents represents anything,
  and there are no true structured propositions.

  (8) But (7) is offered as true, and is supposed to be made true by the argument''s
  own premises standing in inferential relations to the conclusion — which, by (7),
  are not relations at all.

  (9) So the argument is either false or says nothing.


