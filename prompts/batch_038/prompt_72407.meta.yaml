  beautifully onto the theory of transitional justice: amnesty during transition (TRC''s
  conditional amnesty: full disclosure + political objective + proportionality) vs.
  release after transition (parole: ordinary criminal justice, with a stated transitional-justice
  rationale). The interesting theoretical point: the TRC''s amnesty logic (conditional,
  truth-for-amnesty, individualized, with public hearings and victims'' participation)
  was designed for the transition; de Kock''s parole used the language of reconciliation
  but through an instrument (parole) designed for ordinary penal purposes, without
  the truth-disclosure and victim-participation architecture. The "theory" lens: the
  distinction between backward-looking retributive justice and forward-looking political
  reconciliation, plus the specific requirement that amnesty be earned through truth
  (the "truth-for-amnesty" trade). What the episode shows: whether the transitional-justice
  rationale survives the transition; whether reconciliation language after the fact
  is a genuine extension or a category error; and whether the theory can accommodate
  the fact that de Kock had by then given more testimony (he testified against his
  former commanders, helped locate remains) — which is exactly the currency the TRC
  demanded, but delivered outside the TRC''s procedures.


