  Argument:


  Let p = my credence that we live in a simulation run by a more technologically mature
  civilization (call this SIM), and 1−p my credence in BASE (we''re in base reality).
  Bostrom''s trilemma suggests p is not negligible.


  (1) Expected-value reasoning is the right guide: I should choose the action with
  the highest probability-weighted sum of value across possible futures.


  (2) Under BASE, humanity''s descendants have access to the resources of at least
  our galaxy; the number of future lives at stake is astronomically large — call the
  value of the best such future V.


  (3) Under SIM, whatever our descendants do is bounded by the computing budget our
  simulators are willing to spend on this particular run. A civilization that can
  afford to run very many high-fidelity simulations has an incentive to keep each
  one cheap, so our run is almost certainly one of the cheap ones; the simulated future
  therefore contains a negligible fraction of V. Call it εV, with ε ≈ 0.


  (4) Under SIM, nothing we do reaches outside the simulation: our choices cannot
  alter the base-reality world in which our simulators live, and only base-reality
  events can affect the far future of anything real.


  (5) So the expected value of a longtermist project — one aimed at steering the deep
  future — is at most (1−p)V + p·εV, i.e., approximately (1−p)V.


  (6) So the expected value of such a project falls in direct proportion to any increase
  in my credence in SIM: raising p by δ lowers the case for the project by roughly
  δV.


  (7) Therefore the simulation argument, which is usually treated as an idle metaphysical
  curiosity, is in fact a systematic deflator of far-future ethics; a rational longtermist
  should discount their entire programme by (1−p), and since p is not zero, fanaticism
  is at least somewhat undercut.


