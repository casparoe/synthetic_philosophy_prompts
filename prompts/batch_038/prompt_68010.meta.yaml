  civilization (call that hypothesis SIM), and 1 − p one''s credence that we are in
  base reality (BASE).


  (1) Rational choice under uncertainty should aim at the probability-weighted sum
  of value across possible futures.


  (2) On BASE, our descendants can in principle spread beyond the Earth and use the
  resources of at least our own galaxy, so the number of future lives that our present
  choices can affect is astronomically large; let V be the value of the best such
  future.


