  (4) On SIM, moreover, nothing we do reaches beyond the run: our choices cannot alter
  anything in the world where our simulators live, and only what happens there can
  affect the deep future of anything that is really there.


  (5) By (1)–(4), the expected value of a project aimed at steering the far future
  is at most (1 − p)V + pεV, which for small ε is approximately (1 − p)V.


  (6) It follows that the case for such a project shrinks in direct proportion to
  one''s credence in SIM: raising p by δ removes roughly δV of expected value, and
