  with lesions to the insula/cingulate or frontal lobes report feeling pain but not
  being bothered by it. Philosophers use it to argue unpleasantness ≠ a felt quality
  but rather a motivational/evaluative property. This is decently well known to LLMs
  (Bain''s papers, Klein''s "What the body commands", Aydede).


