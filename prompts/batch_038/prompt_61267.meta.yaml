  Now the philosophical content: Davidson''s radical interpretation. Key elements
  to invoke:

  - "Radical Interpretation" (1973): the interpreter must assign truth conditions
  to sentences using only evidence about which sentences speakers hold true, plus
  the Principle of Charity — maximizing agreement, holding belief mostly constant
  and true.

  - The interdependence of belief and meaning; holism: you can''t assign meanings
  without attributing beliefs and vice versa; the interpreter proceeds by holding
  the world fixed ("the pattern of events in the world").

  - Davidson''s argument that charity is not optional/merely pragmatic but constitutive:
  massive agreement is a precondition of interpretation; disagreement is intelligible
  only against a background of agreement.

  - "On the Very Idea of a Conceptual Scheme" (1974): the third dogma — no wholly
  alternative conceptual schemes; dualism of scheme and content is incoherent.

  - Quine''s Word and Object (1960): gavagai, ostension, prompted assent, observation
  sentences, and the indeterminacy of translation thesis.

  - "A Nice Derangement of Epitaphs" (1986): prior theory vs. passing theory; the
  idea that there''s no shared language/convention needed, only convergence of passing
  theories; malapropisms.

  - Also Davidson on metaphor ("What Metaphors Mean").


  The friction points with the Linear B case:

  1. No live speakers. Davidson''s and Quine''s model requires an interlocutor whose
  assent/dissent can be prompted in the presence of shared stimuli; the Mycenaean
  archive is a frozen corpus of inventories — no occasion sentences, no ability to
  point, ask, or check. So the "evidence" base that charity operates on is different
  in kind.

  2. The ideograms + numerals function as an internal ostension: the scribe redundantly
  encoded content pictorially. This gives the interpreter something like a pointing
  finger without a pointer. But it inherits gavagai-type ambiguity (a drawing of a
  tripod: is the word "tripod," "vessel," "bronze," "two," "offering"?). The confirmation
  worked because the drawing and the count matched the morphological structure predicted
  by the Greek hypothesis — a holistic over-determination, not a single ostension.

  3. Ventris''s assumption that the language was Greek — this is charity as a risky
  bet, a substantive empirical hypothesis that could have been (and for Linear A,
  arguably is) false. Davidson''s charity is supposed to be constitutive/presupposed,
  not a gamble. The episode thus pressures the constitutive reading.

  4. The earlier Etruscan hypothesis: Ventris held it for a decade, and it also "made
  sense" of the sign distribution; Kober''s method refused to hypothesize a language
  at all and worked purely from internal structural regularities (the triplets = inflectional
  paradigms), which showed the language was inflected — this ruled out nothing but
  constrained the space. Kober''s method is a kind of "pre-charity": extract structure
  without attributing meaning, purely from co-occurrence. Davidson has no obvious
  place for this stage — his model has no analogue of an interpretation that assigns
  no content yet discovers that content-assignment is constrained by morphological
  regularity. Actually, this is a good point: Kober''s work shows you can get non-trivial
  constraints on an interpretation from formal distribution alone, without charity
  — a challenge to Davidson''s claim that meaning and belief can only be assigned
  together holistically.

  5. Underdetermination/indeterminacy: after the decipherment, rival readings persisted
  (Beattie''s objections), but they were resolved by further fits. Does the case show
  that indeterminacy is merely transient (epistemic) rather than a genuine thesis
  about there being no fact of the matter? Or does it show that the fact of the matter
  was fixed by the scribes'' actual Greek — i.e., that meaning is fixed by the historical
  linguistic community, which Davidson''s model treats as inaccessible in principle?
  Chadwick-style response: the fit is over-determined by the whole corpus.

  6. Davidson''s "no conceptual scheme" argument: Linear B was thought to be a wholly
  alien script/language; the decipherment showed it was Greek — i.e., the "alien"
  turned out to be a dialect of a language still spoken. Does the case support Davidson
  (the apparently alien was assimilable) or is it a bad fit (Linear A and Cypro-Minoan
  remain undeciphered, and there''s no reason in principle they must be assimilable)?
  Also: the tablets'' content is administrative lists, and the "world-picture" that
  Davidson''s holism is supposed to reveal (what did the Mycenaeans believe?) barely
  emerges — we get commodity lists, offerings, place names, personnel; we learn very
  little of their beliefs, and yet we understand the words. That''s a striking asymmetry:
  meaning was fixed without a rich attribution of belief. Davidson''s holism says
  you can''t have one without the other; here we seem to have lexical/syntactic meaning
  with almost no doxastic content. Strong point.

  7. The passing theory vs. prior theory: Ventris had a prior theory (Etruscan, or
  the grid) that failed; what succeeded was a "passing theory" — an ad hoc assignment
  of values that then got generalized. Davidson''s 1986 claim that communication is
  convergence in passing theories, not shared conventions, is arguably a better fit
  for decipherment than his earlier work: the decipherment succeeded not by exploiting
  a convention shared between interpreter and speaker, but by the interpreter constructing
  a theory on the fly. And the "language" in question had no living convention at
  all. So the episode may be better handled by the later Davidson than by the 1973–74
  Davidson.


