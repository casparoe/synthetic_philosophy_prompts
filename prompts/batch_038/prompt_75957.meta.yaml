  Question:

  "Question 3 (25 marks, ~600 words). Explain the Buddhist doctrine of anatta, using
  the chariot example. Then compare it with Parfit''s reductionist account of personal
  identity in Reasons and Persons. Do the two views face the same objections, and
  would their proponents accept the same responses? "


  Answer (~450 words):


  "Anatta, usually translated as no-self, is one of the three marks of existence alongside
  impermanence (anicca) and suffering (dukkha). The idea is that what we call a person
  is not a single thing that persists but a bundle of five aggregates — form, feeling,
  perception, mental formations and consciousness — that are causally linked and constantly
  changing. The standard illustration is the chariot, from the Milindapanha, where
  the monk Nagasena walks the Indo-Greek king Menander through the parts of a chariot
  and gets him to admit that ''chariot'' is just a name we apply to the assembled
  parts, and that there is no chariot over and above them. Same with persons: ''Nagasena''
  is a designation for a process, not a thing.


  It''s important that this isn''t just a metaphysical curiosity. The Buddha refused
  to answer when asked whether a self exists, which shows that anatta is really an
  eliminativism: persons don''t exist, only aggregates do, and the belief that they
  do is the root of clinging and therefore of suffering. Getting rid of the belief
  is the point of the whole exercise.


  Parfit arrives at the same place by a very different route. In Reasons and Persons
  he defends reductionism: personal identity over time just consists in ordinary physical
  and psychological facts, and there is no ''further fact'' like a Cartesian ego.
  What matters is Relation R, which is psychological connectedness and continuity
  with the right kind of cause, and Parfit''s famous conclusion is that identity is
  not what matters. His thought experiments do the work. In the teletransporter case
  the original is destroyed and two Replicas are made, which shows identity is indeterminate;
  in fission, both brain hemispheres are transplanted and both survivors are R-related
  to me, so psychological continuity can''t be identity because continuity isn''t
  transitive while identity has to be.


  Hume got there first and in the same way. In the Treatise he argues that when he
  looks inside he only ever finds particular perceptions and never a self, so the
  mind is a bundle, and he then uses cases like fission to show that our identity
  ascriptions are just fictions the imagination smooths over.


  Both views face the same objection and neither has a clean answer to it. If there
  is no continuing subject, nothing can be the bearer of responsibility: the person
  who committed the act is not the person who is punished, and the being who is reborn
  is not the being who acted. Both Parfit and the Buddhist tradition simply concede
  this — Parfit thinks morality has to be rebuilt on the basis of what matters rather
  than identity, and Buddhism drops karma along with the self. So yes: same objection,
  same concession, and both philosophers end up with a deflationary ethics where survival
  and responsibility are matters of degree."


