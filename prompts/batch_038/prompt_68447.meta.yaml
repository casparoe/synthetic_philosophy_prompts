  about AI creativity and free will: "an AI can only do what it''s told / what it''s
  programmed to do, so it can''t be creative or genuinely intelligent." This is a
  great slogan with many readings:

  (1) Trivial: a machine''s behavior is fully determined by its program + input (in
  the deterministic sense) — but modern systems with learning/nondeterminism complicate
  it.

  (2) Substantive/false-ish: it can''t produce output not explicitly specified in
  the code — false for learning systems and even for simple programs whose outputs
  the programmer didn''t foresee (emergent behavior; the program can be short while
  outputs are unpredictable — cf. computational irreducibility, Wolfram).

  (3) "It can''t do anything its designer didn''t intend" — false, bugs and unintended
  behavior.

  (4) "It can only compute computable functions" — true but not a limitation relative
  to humans unless humans can hypercompute (which connects to the Church-Turing thesis''s
  epistemic status and Lucas–Penrose).

  (5) The determinism/no-novelty reading used to argue against machine creativity
  — which would also apply to humans if physicalism holds, so it''s question-begging.

  (6) "Programmed" meaning socially conditioned — the analogy to humans "programmed
