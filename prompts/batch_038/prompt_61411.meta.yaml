  to the chance" ignoring the admissibility proviso — i.e., saying that whenever you
  learn a chance is x, you must set your credence to x regardless of your other evidence
  (this ignores inadmissible evidence / self-undermining information about the future).


  2. Presenting the Principal Principle as a definitional/conceptual truth about what
  chance means (Lewis thought it was the connection that makes chance deserve the
  name, but he did not claim it is analytic in a trivial sense; actually Lewis thought
  PP captures all there is to chance being chance — "the Principal Principle... is
  the whole story about chance"? He says chances are what they are by occupying the
  chance role. So saying "PP is a definitional/conceptual truth" is roughly right
  for Lewis but wrong as a general characterization of the thesis; Hájek and others
  think PP is a substantive constraint.)


  3. Claiming Lewis''s PP requires the chance function to be known to be the true
  chance function — subtle: PP is stated as a conditional on a proposition attributing
  the chance value, so it applies to your total evidence including the chance attribution.


  4. Conflating "chance" with "frequency" or saying PP reduces chance to credence
  (Lewis is a subjectivist about credence and an objectivist about chance; PP connects
  them).


  5. Claiming that the New Principle abandons the Principal Principle''s content —
  subtle: the New Principle is not equivalent to PP but it''s a weakening; also the
  New Principle makes the admissibility of evidence depend on chance facts, which
  is circular in a way (Vranas''s objection).


  6. Saying that the Principal Principle implies chance-credence coherence in a way
  that makes it irrational to have any credence diverging from chance — ignoring that
  the chance attribution itself may be inadmissible as evidence.


  7. The "undermining" problem: In a Humean setting, the chance function supervenes
  on the pattern of outcomes, so information about future outcomes can change the
  chances; a chance hypothesis that says chance of A is x, plus evidence that A will
  not happen, creates conflict. Lewis''s PP is only a conditional; the New Principle
  avoids this. A summary might say "Lewis solved this by noting chances are not knowable"
  — wrong.


