  a point about the argument''s scope.


  (7) Ray said scope-limited is still worth having, because that personal-seeking
  God is the one most actual believers worship and the one the tradition claims is
  revealed rather than inferred. And he accused Dana of motte-and-bailey: when the
  religion is going well, the personal God who''s looking for you is the front door;
  when the arguments bite, everyone retreats to the God of beauty and conscience who
  was never the front door to begin with. He finished by saying that if she''s right
  that the sophisticated version of theism isn''t the personal version, then the hiddenness
