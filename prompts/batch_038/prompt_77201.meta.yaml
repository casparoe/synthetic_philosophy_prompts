  I cover science and ideas for a magazine, mostly religion-adjacent stuff lately
  — I''ve been reporting a piece on deconversion and the growth of the "nones," and
  last month I sat down with two people at once, which turned out to be a mistake.
  One was Dana, who teaches philosophy of religion at a state university and is a
  practicing Catholic. The other was Ray, who spent eleven years as a youth pastor
  in Texas and now runs a podcast for people leaving evangelicalism; he stopped believing
  about six years into the job. I asked them each the same soft question — what did
  it feel like when the belief stopped holding — and within about four minutes they''d
  forgotten I was there and were arguing with each other. I basically just took notes.
  Here''s the exchange as I have it in my notebook, which I''ve cleaned up a bit but
  not changed:


  (1) Ray said the thing that finished him wasn''t the problem of evil, it was the
  silence. He had a woman in his youth group''s parents'' generation — call her Ruth
  — who wanted to believe, prayed daily for years, read the apologists, went to church,
  and never once got anything he''d call a response. He said: if there''s a God who
  wants a relationship with us, Ruth is a counterexample, full stop. You can''t be
  in a relationship with someone you can''t find, and a perfectly loving God wouldn''t
  leave a sincere seeker unable to find him. He said this is a cleaner argument than
  evil because it doesn''t need you to weigh suffering against mystery.


  (2) Dana said the argument has two problems, one factual and one conceptual. Factual:
  you don''t know Ruth''s heart. From the outside, "I sincerely can''t believe" and
  "I''m not looking in the place the answer would be found" are indistinguishable,
  and there''s a long tradition of saying the second is really what''s going on —
  the resistance might be to what belief would cost her rather than to the evidence.
  Conceptual: the argument assumes God''s overriding priority is that everyone hold
  the true proposition that God exists. But love doesn''t require constant self-disclosure.
  A parent who is transparent to the child at every moment never lets the child become
  a separate person.


  (3) Ray said the first prong makes the whole thing unfalsifiable in a suspicious
  direction: if every apparent non-resistant nonbeliever turns out to be secretly
  resistant, then "God wants a relationship with you" is also uncheckable, and Dana
  has saved theism by making it compatible with literally any evidence. And he said
  he''d known a dozen Ruths, some of whom were far more honest about their own motives
  than Dana was being about theirs. On the second prong: the parent analogy is the
  disanalogy. A good parent doesn''t withhold the fact that they exist. Withholding
  a toy, a rule, a reward — that''s parenting. Withholding your own existence isn''t
  cultivating autonomy, it''s just absence.


  (4) Dana conceded that hit but said Ray had narrowed too fast, and made two replies.
  First: theism isn''t committed to God being a parent, and the hiddenness argument
  assumes belief is the entry requirement for relationship, which plenty of theologies
  deny — God relates to people through conscience, through other people, through beauty
  and the pull of the good, without ever announcing himself propositionally. Second:
  you''d expect roughly this evidential situation if God wanted our response to be
  free. A voice from the sky would overwhelm the will; there''s light enough for anyone
  who wants to see and dark enough for anyone who doesn''t, and that balance is a
  feature.


  (5) Ray said the freedom reply proves too much. If overwhelming evidence destroys
  freedom, then God has already ranked freedom above the relationship that freedom
  was supposed to serve — but the premise Dana is fighting came from the value of
  relationship in the first place, so she''s conceded it. He also said the empirical
  claim is false: he''s watched people get converted by what they describe as overwhelming
  evidence, and they didn''t come out as puppets, they said they''d gotten freer.
  And the first reply relocates the problem instead of solving it: Ruth was moved
  by beauty and had a working conscience, and what she concluded from paying attention
  to those things was that there''s no person behind them. If God is relating to her
  through those channels, then it''s a relationship she can''t recognize as one, which
  is a strange shape for love to have from the inside.


  (6) Dana said then they weren''t arguing about hiddenness anymore, they were arguing
  about what God is supposed to be. Ray''s argument is lethal against one specific
  picture — a personal agent who wants explicit, mutually acknowledged relationship
  with every human being — and she wasn''t sure the best theologians in the tradition
  actually hold that picture. So hiddenness is a problem for a theology, maybe specifically
  for the popular evangelical one, not for theism as such. And she added, carefully,
  that Ray had left a pastorate, and the God his argument is calibrated to destroy
