  and please don''t rewrite the essay for me.


  The draft is below.


  ---


  Title: Who Gets to Fix Whose Mistakes?


  1. My question.

  Philosophers who study joint action want to know what makes it the case that you
  and I are doing something together, rather than each doing our own thing side by
  side. ... The familiar answer is that we each have the right kind of attitude toward
  a shared goal, and we each know that the other has it. ...


  I want to propose a different test. Instead of asking what each of us intends, ask
  who is allowed to fix whose mistakes, and when.


  2. What I mean by a repair right.

  Call it a repair right: a standing, non-negotiated entitlement on the part of one
  participant to intervene in another participant''s part of the activity while it
  is still going on, without the intervention counting as interference or as criticism
  of the person. ... Where there are repair rights, an error by one member stops being
  a fact about that member and becomes a task for everyone. I''ll call that error
  pooling. Where there aren''t, an error stays exactly where it happened: with the
  person who made it, to be dealt with by them, or noticed by others only afterwards
  and then only as a grievance.


  3. Why I think this picks out the cases that matter.

  Three cases.

  (a) I play cello in the pit orchestra for my school''s musical. ... The violinist
  next to me is a bar early. If I stop and wait, the whole thing collapses; if I keep
  playing exactly as planned, we diverge. What actually happens is that I shift. ...
  Nobody asked me to shift, and nobody needs to explain to me afterwards why I was
  allowed to. The permission was already there in the activity.

  (b) My history class runs group projects in which the teacher assigns roles: researcher,
  writer, designer, presenter. Last term the designer noticed that the writer''s argument
  contradicted a source the researcher had found. The designer said nothing, because
  it wasn''t her job, and because saying it would have read as a criticism of two
  other people''s work. The project was handed in, was internally inconsistent, and
  got a good grade. Everyone did their part. I don''t think they acted together.

  (c) Two people carrying a sofa up a staircase. ...


  4. What the accounts I''ve read seem to say, and where I think they miss this.

  Bratman: shared intention as a framework of interlocking intentions, meshing subplans,
  common knowledge. The worry: improvisation. ... Also, on my account, meshing is
  something that has to be achieved, and the interesting question is what makes it
  possible at the moment when there''s no time to negotiate.

  Searle: we-intentions in individual heads, irreducible, not analyzed away in terms
  of I-intentions plus mutual belief. My worry: this seems to locate jointness in
  a kind of psychological state, and then it can''t explain why (b) fails. The four
  students could each have had the strongest we-intention in the world.

  Gilbert: plural subject, joint commitment, obligations and entitlements, rebuke.
  Closest to me. But rebuke is backwards-looking... repair rights are exercised mid-action,
  before the failure has happened, and are not a form of blame.

  Tuomela: we-mode vs I-mode. ...


  5. My claim about scale.

  I want to say that repair rights get thin as groups get big, and that this is why
  I''m not sure a nation can act jointly at all. ... But I don''t know if that''s
  a claim about joint action or just about my own confidence...


  6. Objections I''ve thought of.

  (1) Circularity: if repair rights come from a joint commitment, they can''t explain
  joint commitment.

  (2) Role division: the group-project case suggests roles destroy joint action, but
  a surgical team and an orchestra are role-divided to an extreme degree and are the
  clearest cases of joint action there are. [Note: this is the internal contradiction
  — actually, wait. If the student themselves notes it in the objections section,
  it''s less of a "catchable flaw." Hmm. Maybe I should let the student notice it
  only partly — e.g., they mention it and give a glib answer that doesn''t work. Let
  me have them raise it and answer it badly: "My answer is that roles destroy joint
  action only when they are assigned from outside." That''s glib and a model can push
  on it: who assigns roles inside an orchestra? The composer/the institution. Also
  the answer doesn''t address that the designer''s silence was about *internal* boundaries.]

  (3) Asymmetry: a conductor, a head surgeon, a cox. Are asymmetric repair rights
  still joint action? I want to say yes, provided the distribution is known. But then
  it looks like I''ve just described a hierarchy, and I''m not sure whether hierarchy
  is compatible with jointness or is a rival to it.


  7. Conclusion / what I''d like to defend.

  Joint action is not primarily a matter of what is in each participant''s head, but
  of what participants are licensed to do to each other''s part of the activity while
  it is still going on.


