  Archives and power desiderata: The asker could be, say, a historian or a graduate
  student designing a method. Requirements a method for treating archival silence
  must meet:

  1. It must explain why silences are systematically patterned, not random (which
  is what makes them evidence rather than noise) — the "silence must be produced"
  requirement.

  2. It must not make the archive unfalsifiable: any absence must be capable of being
  read as evidence of nothing; a method on which every gap confirms oppression is
  vacuous. This is the key "jointly unsatisfiable?" tension with requirement 1.

  3. It must respect the distinction between the absence of a record and the destruction/suppression
  of one, and between never-recorded and recorded-then-lost, and between recorded-and-preserved-but-inaccessible
  (classification, privacy law, embargoes).

  4. It must handle the "power wrote it down" case: the same administrative apparatus
  that silenced some people was verbose about them (police files, slave registers,
  asylum records, colonial ethnography) — so presence is not the opposite of silence.
  A method must explain why abundant hostile documentation is still a silencing.

  5. It must be able to say when the absence is just absence — e.g., perishable media,
  war, floods, benign administrative practice (routine records destroyed after N years).

  6. It must not require the researcher to speak for people who can''t — the ventriloquism
  problem: reading the silences must not amount to putting words in mouths.

  7. Consistency with the discipline''s evidentiary norms: whatever it delivers must
  be checkable by other historians, i.e., inter-subjective (two readers should reach
  the same conclusion about a given gap) — and the worry that this is exactly what
  "reading against the grain" fails.

  8. It must handle the archivist''s own role: appraisal decisions, description (finding
  aids, cataloguing terms), digitization priorities — silence is produced at multiple
  stages (creation, selection, description, access), so a method must locate which
  stage produced a gap. Trouillot''s four moments: fact creation (making of sources),
  fact assembly (archives), fact retrieval (narrative), retrospective significance
  (history). That''s a real framework — Silencing the Past (1995). Should I name it?
  Naming is fine; but if I get it wrong, that''s bad. I''m fairly confident about
  Trouillot''s four moments of historical production. But I''d rather not put it in
  the prompt as a fact; the answer can bring it up.

  9. Non-negotiable vs camp preferences: e.g., "the method must be usable by historians
  who lack theoretical commitments" vs "must resist assimilation into the archive''s
  own categories".

  10. Which requirement knocks out the most theories — maybe the falsifiability requirement.


