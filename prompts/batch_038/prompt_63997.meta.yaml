  I''m writing the methodology chapter of a book and the whole thing hangs on a claim
  I can''t yet defend properly: that the gaps in the record mean something, that who
  got written down and who didn''t is itself a fact about power I''m allowed to draw
  conclusions from. Every time I say this to a sceptical reader they hear "you''re
  finding significance in missing paperwork," and some days I''m not sure they''re
  wrong. So before I commit to a position, I want to know what I should be asking
  of one.


  Write the desiderata: what any theory of archival silence — an account of which
  absences license which conclusions — has to deliver to be usable in actual historical
  work. For each requirement give the case or the consideration behind it, and mark
  which are non-negotiable and which are really just one camp''s preferences dressed
  up as demands on the field.


  The cases it has to get right, at minimum:


  - a group the state documented obsessively — police files, registers, case notes
  — where the abundance of records is part of the silencing rather than a cure for
  it. the theory can''t just say "sources are biased."

  - a gap that means nothing at all: routine paperwork destroyed on a standing retention
  schedule, a fire, a war, paper that didn''t survive the climate. it has to be able
  to say "no" here, and say it without already knowing the answer.

  - records closed to protect the people in them — privacy rules, duty-of-care policies,
  living individuals — so that now the vulnerable are the ones you can''t see and
  a well-connected donor''s papers are wide open. this one breaks accounts written
  before it was common.

  - the silence produced by description rather than by absence: the file is in the
  box, but it''s catalogued under the institution''s own vocabulary for the people
  in it, so nobody looking for them finds it.

  - the same holdings, digitised or not: what''s searchable isn''t the same as what
  exists, and funding decided the difference.

  - a record the absent people made later themselves — oral history, memoir, decades
  on. does that fill the silence, or does it just move it?


  Also: what distinctions it mustn''t collapse (never-created vs created-and-destroyed
  vs created-and-withheld vs created-and-unfindable), what it owes to the people who
  read it hostilely — i.e. can two trained historians run it on the same gap and get
  the same answer — and where it has to stop and hand the question back to me because
  it''s about values not evidence.


  Flag any pair you think can''t be jointly satisfied. I suspect the demand that a
  theory be able to declare some gaps meaningless and the demand that it treat silences
  as patterned productions of power are in real tension, and if the list turns out
  to be jointly unsatisfiable, that''s the finding, so tell me. And tell me which
  single requirement does the most to knock out candidates.


  Then briefly — two or three sentences each, no more, I don''t need a bibliography
  — how the three accounts I keep running into do against the list: the one that treats
  the archive as an effect of the power relations that made it, the one that treats
  the absence as license to imaginatively reconstruct what the undocumented life was
  probably like, and the plain evidentialist one that says a gap is only ever a gap
