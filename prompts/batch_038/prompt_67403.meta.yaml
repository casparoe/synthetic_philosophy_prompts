  fertility tests would be intrusive; also, opposite-sex unions are the ones that
  produce children by default, so regulating them serves the interest even if some
  are infertile — the same logic that lets us not test drivers over 80.

  (4) B: then the criterion is statistical and contingent, and it does no normative
  work: it explains why the state historically regulated heterosexual unions, not
  why it should deny recognition to others. And if the state''s interest is child
  welfare, the evidence about outcomes for children of same-sex couples is what settles
