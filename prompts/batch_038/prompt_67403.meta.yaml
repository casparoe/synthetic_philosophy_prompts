  Design the exchange. Two people: let''s say two members of an EA-ish philosophy
  reading group, or two colleagues. Names: Nadia and Owen. The asker reports neutrally.


  Core dispute: how to compare outcomes with infinitely many people / infinite time.


  Let me lay out a sequence of moves (5-7), each with a substantive claim, some right,
  some wrong, some partly right, so adjudication is discriminating.


  Move 1 — Nadia: With infinitely many lives at stake, standard total utilitarianism
  is undefined: every outcome has infinite total welfare, so all outcomes tie, and
  consequentialism gives no guidance whatsoever in the cases that matter most (long-run
  future, astronomical stakes). Proposal: restrict to "finite differences" — if two
  outcomes differ in only finitely many people''s welfare, compare those differences;
  otherwise, withhold judgment. Call this the finite-difference rule.


  Move 2 — Owen: Withholding judgment is not a neutral option; it''s a recommendation
  to be indifferent between outcomes that obviously differ in value. Concrete: Outcome
  P — at every day from now on, one person exists with welfare +10. Outcome Q — exactly
  the same, except that in addition, at every day, one more person exists with welfare
  +9. Q is better than P by any finite-horizon reckoning you like: for every n, the
  first n days of Q contain strictly more welfare than the first n days of P, and
  Q is P-plus (nobody in Q is worse off than their counterpart in P). Nadia''s rule
  says "no verdict," which is absurd.


  Note: careful — Q is P-plus means every person in P has the same welfare in Q and
  Q has extra people. Under person-affecting/total views Q ≥ P. Strong Pareto (impersonal
  version: if one outcome is at least as good for everyone and strictly better for
  someone, it''s better) → Q better. So Owen is right here — this is the standard
  argument that Pareto-indifference-respecting extensions must say Q > P. And Nadia''s
  finite-difference rule says no verdict because they differ in infinitely many respects
  (infinitely many extra people). Hmm, but actually if we treat the extra people as
  "extra", the difference is infinite, so finite-difference rule abstains. And abstaining
  conflicts with a plausible Pareto principle. Good: Owen clearly right at move 2?
  Not entirely — the "counterpart" identity across outcomes is doing work; also Nadia
  could say Q>P follows from Pareto, and she should accept it, but her rule can''t
  deliver it. That''s the point: her rule is too weak.


  Move 3 — Nadia: Fine, accept Q > P. But then Owen owes a general comparison rule,
  and every candidate has a fatal flaw. Candidate: the overtaking criterion — B is
  better than A if, from some day onward, the cumulative total of B''s first n days
  always exceeds A''s first n days. Her objection (i): it is order-dependent. Take
  Outcome R: on day n, one person exists with welfare n (so welfare 1 on day 1, 2
  on day 2, ...). Take Outcome S: on day n, one person exists with welfare 100. Overtaking
  says R is better than S because R''s cumulative total eventually and permanently
  exceeds S''s. But R''s verdict is entirely driven by the far future: the first 99
  people in R are worse off than their counterparts in S, and if you asked anyone
  in R''s first millennium whether they''d trade places with S, they''d say yes. And
  a rule whose verdict is settled exclusively by an arbitrarily distant tail seems
  to say that no finite number of bad lives can matter. Objection (ii): the criterion
  is also permutation-sensitive — describe the same outcome with a relabeling of days
  (e.g., list every second day first) and the partial sums change, so the verdict
  can flip. Hmm, would it flip? For R vs S with relabeled order: R under ordering
  odd days first then even days: cumulative sums... Actually, R''s welfare sequence
  is 1,2,3,...; if you reorder so that days are visited in order 2,4,6,...,1,3,5,...
  (all even first) — the sequence becomes 2,4,6,...,1,3,5,.... Overtaking comparison
  with S (100,100,100,...) : for the reordered R, cumulative sum after n terms is
  2+4+...+2n = n(n+1) which exceeds 100n for n > 99, so still R better eventually.
  Not a flip. Better permutation example: A = (1,0,1,0,1,0,...) and B = (0,1,0,1,...).
