  internal (must link to subjective motivational set S), that reason statements are
  relative to S; "the sound deliberative route" — internal reasons include sound deliberation,
  imagination, correct appreciation of facts. External reasons theorists (McDowell,
  Scanlon-ish, Dancy) say agents can have reasons they have no motive to act on —
  e.g., a brutal husband has a reason to stop, even if nothing in his S motivates
  him. Williams''s reply: false belief, and "blame as a proleptic reason" — blame
  works by invoking an internal reason (the agent''s desire to be respected / not
  to be a certain sort of person) — actually Williams says blame is a form of proleptic
  explanation.


