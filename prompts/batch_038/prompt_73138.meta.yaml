  Where''s the flaw? Candidates:

  - (2) is a claim about sufficiency ("never by itself the difference") but (3) needs
  a claim about each actual pair on the actual path ("for these two, they don''t differ
  in a-hood"). (2) says no single-cell difference is *in itself* decisive — i.e.,
  no cell is such that its flip alone, across all contexts, changes a-hood. But that''s
  a claim about cell-types in isolation, whereas the path involves cell-flips in specific
  contexts. The same cell flip can be decisive in one glyph and irrelevant in another
  (context-sensitivity of sufficiency). So (2)→(3) is a scope/distribution shift:
  from "no single-cell difference is universally decisive" to "no single-cell difference
  is decisive here." That''s a genuine equivocation: "by itself" smuggles a context-free
  reading. Good — that''s the subtle flaw, and it''s exactly the kind of slide the
  type asks for.

  - Also (2)''s supporting reason ("no reason why that cell rather than its neighbours
  should carry the whole weight") proves too much on its own: it would rule out any
  local determinant, but letterforms do have local determinants (the counter/aperture).
  And the "no principled specification of where the boundary is" → "no boundary" slide
  at (5): from unstatable to nonexistent (epistemicism''s target).

  - (6) generalizes (2) to all "properties built from small local parts," which would
  also apply to properties the friend needs, and to properties like "being a valid
  proof-step" or "being the same word," and arguably to "being a cell" — and it would
