  if not boundary-sharp — e.g., "being an ''a'' is being produced as an instance of
  that character in a writing system," a historical/institutional property, not a
  shape property at all. In that case the morphing experiment never engaged the property
  in question: it probed shape-similarity, and the fact that shape-similarity is gradient
  doesn''t show the property is gradient. That''s a big one and a nice "why it looked
  fine": the experiment''s smooth curve is about perceptual similarity ratings, and
