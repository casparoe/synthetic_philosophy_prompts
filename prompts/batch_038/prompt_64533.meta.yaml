  Nicod''s criterion says that a generalisation is confirmed by each of its instances:
  see a black raven, and ''all ravens are black'' gains support. But that same claim
  is equivalent to its contrapositive, ''all non-black things are non-ravens,'' and
  a principle Hempel called the equivalence condition says that whatever confirms
  one of two logically equivalent statements must confirm the other. So a white shoe,
  being neither black nor a raven, is an instance of the second statement, and therefore
  confirms the first. Hempel did not think this was a joke. The consequences are radical:
  since confirmation depends only on logical form, a black raven and a white shoe
  confirm the hypothesis to exactly the same degree, and indeed any observation at
  all — the reading on a thermometer, the number of buses that pass your window —
  confirms every universal generalisation you can write down. Modern Bayesian treatments
  have settled the matter: because the number of non-black things is astronomically
  larger than the number of ravens, the probability of ''all ravens are black'' is
  left exactly unchanged by the observation of a white shoe, so the correct verdict
  is that such observations provide no confirmation whatever. What Hempel''s paradox
  really shows, then, is that Hume was right after all: no accumulation of observations
  can ever establish a general law, and the attempt to define confirmation in purely
  logical terms had to be given up."


