  war are morally liable to attack in the same way murderers are — the "moral inequality
  of combatants." A subtle mistake: claiming revisionism entails that unjust combatants
  may not fight at all / that they''re all war criminals, or conflating liability
  with wrongdoing in a way that misses the distinction between the moral status (liability)
  and the practical/legal separation.

