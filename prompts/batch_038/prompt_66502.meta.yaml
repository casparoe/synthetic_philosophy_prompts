  population, one flagging that the underlying figures are estimates with wide error
  bars. A senior colleague deleted both, on the grounds that the chart should stand
  alone and that qualifying text would "start arguments." He cited the slogan as his
  warrant. I think something has gone wrong, but I want to be precise about what.


