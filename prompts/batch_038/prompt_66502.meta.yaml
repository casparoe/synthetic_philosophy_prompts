  can take into our next meeting? I would like each reading stated as a proposition
  sharp enough to be argued with — distinguishing, for instance, the comparative from
  the absolute form; the claim about what audiences remember from the claim about
  what they understand; the claim about crossing language barriers from the claim
  about producing agreement rather than merely suppressing the appearance of disagreement.
  For each, tell me whether it is a platitude, a substantive and defensible thesis,
  or false, and — separately — whether it would actually license deleting my two sentences.


