  one; please say what follows from that. Second, I want the disambiguation to be
  checked against what the Isotype programme actually did, since that is where the
  line comes from: quantity was shown by repeating an identical symbol rather than
  by enlarging one; continuous curves were avoided on the grounds that the data are
