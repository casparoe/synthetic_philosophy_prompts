  For the past couple of years I have been reading Kierkegaard on my own — no university
  training, just evenings, mostly from secondhand copies and whatever commentary I
  can find in libraries. What has stayed with me is not the religious material but
  his account of the press. As I understand it, his claim is not that newspapers print
  falsehoods, but something stranger: that the press is what brings the public into
  being in the first place. Before the daily press, he suggests, there were assemblies,
  factions, particular men with particular commitments who could be answered and held
  to account; the press replaces these with an abstraction that has no location, no
  name, and cannot be replied to — a phantom that everyone speaks for and no one is.
  What disturbs him most is that this is not a corruption of opinion but a dissolution
  of the person who holds it: the same view, held by a single individual who will
  say it under his own name and pay for it, and the same view voiced by the public,
  are not morally equivalent, and the difference has nothing to do with whether the
  view is true. He calls this levelling, and he seems to think it is worse than any
  particular error.


