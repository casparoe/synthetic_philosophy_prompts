  The starting point is Gödel''s first incompleteness theorem. It says that if F is
  a formal system whose axioms can be listed by a computer program and which is strong
  enough to do ordinary arithmetic, and if F is consistent, then there is a sentence
  G(F) in the language of F such that F proves neither G(F) nor its negation. G(F)
  is built by the diagonal trick and says, in effect, "G(F) is not provable in F."
  The second incompleteness theorem adds that if F is consistent then F cannot prove
  Con(F), the sentence expressing its own consistency.


  Lucas and Penrose turn this into an argument against mechanism. Suppose I am, or
  my mathematical reasoning is, correctly modeled by some Turing machine F. Take the
  case where F is a machine whose outputs I can check to be sound — every theorem
  it proves is true. Since I know F is sound I know it is consistent, and so I know
  that G(F) is not provable in F. But G(F) says exactly that it is not provable in
  F. So I can see that G(F) is true. F cannot. Therefore I am not F. Because the argument
  was completely general about which F we started with, it works against any candidate
  machine, so human mathematical understanding is not an algorithm at all.


  It''s worth being clear about what Gödel''s theorem does and does not do here. It
  does not by itself show that there are true statements that are unprovable by any
  means — a stronger system can prove G(F), and mathematicians do this all the time.
  What it supplies is the machinery for building, for any given sound machine, a sentence
  that machine cannot reach but that we can. Gödel drew the anti-mechanist conclusion
  himself; Lucas in the sixties and Penrose in the eighties and nineties mainly refined
  and publicized it. Penrose is the one who pressed the point that the whole thing
  depends on knowing that F is sound, not merely consistent, and his version is often
  stated as the claim that mathematicians do not use a knowably sound procedure.


  An important feature of the argument is that it is not an argument that the brain
  does something a computer could not do in principle by simulating it. If human reasoning
  were a non-computable physical process, no simulation on any Turing machine would
  reproduce it, however much time and memory you gave the simulation. Penrose''s proposals
