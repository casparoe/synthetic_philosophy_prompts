  an assurance that gets taken up, I put the promisee in a position where they have
  a standing, second-personal claim to demand performance and to resent/complain if
  I don''t, and the wrong I do by breaking is owed *to them* specifically, not just
  a wrong in the impersonal sense. The obligation is self-assumed, created by my own
  act, not derived from a background duty of fidelity that just happens to get triggered.


