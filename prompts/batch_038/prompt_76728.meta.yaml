  ---

  Title: "Nobody caused the outage": why history should treat germs, climate and volcanoes
  as actors, and what''s scary about that


  Section 1. The engineering habit.

  I work on infrastructure — on-call rotations, incident reviews. One norm in that
  world is the blameless postmortem: when something goes down you write up what happened
  and you deliberately do not make it about the person who pushed the bad config...
  The reason isn''t kindness, it''s epistemic: a person-blaming postmortem is a low-information
  document, because it stops at the point where an agent could have been more careful.
  It doesn''t tell you why the system let them.


  Section 2. History''s version of blame.

  Standard narrative history reads like a blaming postmortem. Wars have causes that
  are decisions; the Black Death has a cause that is... etc. Even when a non-human
  thing is doing enormous work — the plague bacillus, the harvest failure, the volcanic
  winter — the story is organised around what people did about it.


  Section 3. There''s an obvious reason not to do this.

  Determinism. If climate explains everything, then colonialism, slavery, genocide
  get re-described as weather. Also, the determinist story has been used before (racial/environmental
  explanations of who gets to rule). Jared Diamond got hammered for exactly this,
  rightly in places.


  Section 4. My claim, which is narrower.

  I want to separate three things that get fused in the word "cause":

  - background conditions (the climate envelope that makes some crops possible)

  - triggers/events (the 1815 eruption, the arrival of the pathogen)

  - agents (things that act on reasons and could have done otherwise)

  The worry about determinism, I think, is mostly a worry about the third category,
  and specifically about where blame lands. But you can grant that a volcano is not
  an agent — it has no intentions, no alternatives, it cannot be reproached — while
  still insisting it is not a background condition either. It''s an event with its
  own timing, its own causal signature, and no human being chose it. Most of the resistance
  to giving it "agency" seems to me to be a blame-allocation reflex imported from
  ethics into metaphysics.


  Section 5. Examples.

  Laki 1783-84: eight months of fissure eruption in Iceland, sulfur dioxide haze across
  Europe, ~20% of Iceland''s population dead from the famine, livestock killed by
  fluorine-laced grass, poor harvests in Europe and a weakened Nile flood that fed
  a famine in Egypt. People have tried to connect this to the mood in France five
  years later; I don''t want to defend that link strongly, but even the modest version
  — that the 1780s were unusually grim for reasons nobody in Versailles chose — matters.

  Tambora April 1815, VEI-7, largest eruption in recorded history; 1816 the Year Without
  a Summer, frost in June in New England, harvest failure across Europe, and a group
  of people stuck indoors by a Swiss lake telling ghost stories.

  536 AD dust veil: a couple of years of dimmed sun, then the Justinianic plague from
  541 onward, and the whole thing now sometimes called the start of a Late Antique
  Little Ice Age.


  Section 6. The peril, stated properly.

  The peril isn''t that we''ll over-rate germs. It''s that "the climate did it" is
  unfalsifiable in the same way "human nature did it" is: it can be deployed after
  the fact to soak up any residual explanation. Non-human causes have no motives you
  can check them against. So the discipline needs the thing engineering has, which
  is that a postmortem claim has to be checkable against logs. In history the logs
  are ice cores, tree rings, sediment, and dated documents. If your climate explanation
  doesn''t line up with the physical record, it''s not an explanation.


