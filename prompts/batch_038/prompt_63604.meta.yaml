  Now the same company is completely different in other places. At admission every
  new resident gets a plain-language explanation of the diagnosis and the expected
  progression, and we''re told not to soften it. Anything non-routine needs documented
  consent. And if someone gets hurt — a fall, a medication error — there''s a rule
  that the family hears exactly what happened within the week, no smoothing over.


