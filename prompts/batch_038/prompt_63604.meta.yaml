  has ever come there and it''s not on any route. It''s there because a lot of our
  residents get a fixed idea that they have to go home, or get to the factory for
  their shift, and they''ll push at the door and get agitated; instead we walk them
  out to the shelter, sit with them, and after ten or fifteen minutes most of them
  are happy to go back in. Same idea indoors: we have a ''reminiscence room'' kitted
  out like a kitchen from around 1960, and staff are trained not to correct people.
  If a resident asks where her husband is, and he died eleven years ago, you don''t
