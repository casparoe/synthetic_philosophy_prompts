  Actually, here''s a cleaner concretization. The proposed rule (call it the "deference
  rule"): Before each round, each forecaster writes down their credence in the resolution
  question. They''re then forbidden to update during the round; instead, they must,
  at the start, set their credence equal to what they expect their own end-of-round
  credence to be (given that they expect to have read the new reports arriving during
  the round). The rationale: "if you expect your end-of-round self to have read the
  intel briefings and thought harder, your present self should already defer to that
  future self; otherwise you''re just planning to ignore evidence."


  The dispute:

  - Marcus (proposer): the rule follows from a general principle of rationality —
  reflection. If you expect your future self to be better informed and more careful,
  your present credence should equal your expectation of your future credence. Anyone
  who violates it can be made to lose money for sure: a bookie can sell you a bet
  now that your future self will happily buy back at a different price, and the pair
  of bets locks in a loss regardless of how the question resolves. That''s a sure-loss
  guarantee, so violating the rule is irrational.

  - Iris (objector): that Dutch book is an artifact of how the bets are presented.
  The bookie offers you one bet now, then a second one later, and you''ve forgotten
  or can''t see the package. Show the forecaster the whole two-bet package at once
  and no rational person accepts it. Sure-loss across a sequence of separate decisions
  taken at different times, with different information, isn''t incoherence — it''s
  just what happens when you''re offered deals one at a time. (Also: you could pump
  money out of someone who updates perfectly rationally, if you can offer them deals
  sequentially.)

  - Marcus: but the principle isn''t only supported by the Dutch book. The real reason
  is that if you know your change of mind will come from evidence you expect to get,
  then refusing to defer is arbitrary: it''s planning now to disregard what you''ll
  later take to be reason. And there''s a formal way to see it: if you expect to update
  by conditionalizing on what you learn, then reflection is a theorem — your current
  credence just is your expectation of your conditionalized future credence.

  - Iris: exactly, and that''s the weakness. The principle only gets its force by
  smuggling in the assumption that all rational updating is conditionalization on
  new evidence. But there are rational ways to change your mind that aren''t conditionalization:
  forgetting. If I expect to forget which of two similar reports I read, my later
  credence can differ from what conditionalization predicts, and I shouldn''t now
  defer to my forgetful future self — I should defer to my current, better-informed
  self. Same if I expect to be sleep-deprived, or on a beta-blocker, or in the middle
  of a 3 a.m. shift. Your rule tells me to defer to a future self I expect to be worse.

  - Marcus: van Fraassen-style reply: reflection is explicitly restricted — you defer
  only when you expect your future credence to be produced by new information. Forgetting
  and drugs change the antecedent, so they''re not counterexamples; they''re cases
  where the principle simply doesn''t apply.

  - Iris: then the rule as written for our team is empty or circular. "Defer to your
  future self when your future self''s change comes from evidence" — the only way
  to tell whether my expected change is evidence-driven is to already judge that the
  evidence supports the new credence, which is to say I''ve already done the updating.
  The rule can''t discipline anything; it just ratifies whatever I independently concluded.
  And when it does bite — when it tells me to post a number I think is wrong now,
  on the ground that a better-informed future me will think it''s right — it''s telling
  me to knowingly misstate my own current best estimate to a scoring rule.

  - Marcus (maybe round 5): There''s still a bite: it catches people who plan to update
  on things they know aren''t evidence — e.g., "I''ll wait to see which way the market
  moves, then adjust." Hmm, but Iris could reply that''s already irrational by other
  lights.


