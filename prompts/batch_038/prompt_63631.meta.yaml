  ---

  I am grading a take-home question for an upper-level philosophy of social science
  course. The question was worth 25 points.


  Question: Popper holds that historicism trades on a confusion between trends and
  laws. Explain the distinction, and explain why, on Popper''s account, it blocks
  the project of a theoretical history — a social science that predicts the future
  course of history the way theoretical physics predicts eclipses. Then assess the
  following objection: Popper''s argument turns on our inability to predict the future
  growth of our own knowledge, but a forecasting system that stood outside the epistemic
  community it modeled, or one vastly better informed than we are, need not share
  that limitation; so the argument at most shows the limits of our predictive capacity,
  not the impossibility of historical prediction.


  Student''s answer:

  "Popper defines historicism as an approach to the social sciences that takes historical
  prediction as its principal aim and holds that this aim can be met by uncovering
  the laws or trends underlying historical development. The distinction between trends
  and laws is the key to his critique. A trend is a statement about a pattern observed
  over a given period under given conditions — say, rising productivity in a particular
  industrial economy — and it is existential and tied to those conditions; a law is
  universal and exceptionless, and can be combined with initial conditions to yield
  predictions. Historicists mistake the first for the second, so their ''predictions''
  are really extrapolations that carry no guarantee of continuation. This is why Popper
  thinks the project fails in principle rather than merely in practice: a theoretical
  history would have to be built on laws of succession, and what it actually has are
  conditional statements about trends, which is a different logical category. His
  central objection is that historicist doctrines are unfalsifiable — they can absorb
  any counterexample by adding ad hoc auxiliary claims about the dialectic or about
  stages not yet reached — and this is what makes them unscientific.

  On the objection about a predictor outside the system, Popper has a ready answer
  in the Oedipus effect: a social prediction, once made, alters the situation it predicts,
  so any such forecast would be self-defeating. A super-forecaster would face the
  same problem, and indeed a worse one, since its own activity would have to enter
  the model. The objection therefore fails.

  Overall, then, Popper is right that no laws of historical development can be had,
  and the social sciences are left not with explanation but with the interpretation
  of unique historical processes."


