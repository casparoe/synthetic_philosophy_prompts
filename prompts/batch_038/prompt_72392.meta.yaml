  line between honest error (console), at-risk behaviour (coach) and reckless behaviour
  (punish), latent conditions at the blunt end versus active failures at the sharp
  end, and the constant trade-off between getting people to file and keeping enough
  deterrence that filing isn''t free. It''s a real trade-off, not a slogan — the NASA/FAA
  deal in aviation is basically "tell us within ten days, if it was inadvertent and
  your record''s clean for the last five years we''ll waive the sanction", and everyone
  knows the reason that deal exists is that otherwise nobody talks.


  Priya''s line is that South Africa''s TRC got something right that my framework
  can''t even see: amnesty was individual, conditional on full disclosure, and only
  for acts with a political objective, and the point wasn''t data collection but restoration
