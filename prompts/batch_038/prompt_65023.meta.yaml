  one; and whether they would be obliged to refuse orders, resign, or claim conscientious-objector
  status if it turned out the war was unjust. Right now the block teaches the traditional
  position — that combatants on both sides stand in the same moral relation to one
  another, that the justice of a cause attaches to the political leadership rather
  than to the individual fighter, and that a fighter who observes the rules governing
  conduct in war is not a wrongdoer — and I have watched it fail in the room, because
  the members know about the objection: that liability to be attacked tracks one''s
  own moral responsibility for an unjust threat, so a fighter on the unjust side is
  not a moral equal of a fighter defending against it, and the traditional symmetry
  survives only as a useful convention that we are not entitled to assert as a truth.


