  MU puzzle facts (TNT-like "MIU-system"): axiom MI; rules: (1) if xI then xIU; (2)
  if Mx then Mxx; (3) if III → U anywhere; (4) if UU appears, delete it. Question:
  can MU be derived? Answer: no, because the number of I''s can never be a multiple
  of 3 — invariant: start with 1 I; rule 2 doubles the count; rule 3 removes 3 I''s.
  So the count mod 3 is never 0 (doubling preserves non-divisibility by 3; subtracting
  3 preserves it mod 3). MU has 0 I''s, which is divisible by 3, so unreachable. The
  proof is a meta-level invariant argument — you prove something about all derivable
  strings. Hofstadter uses this to illustrate that the MIU-system is "decidable" in
  the sense that there IS a mechanical procedure to determine derivability (check
  I-count mod 3) — the puzzle is not undecidable; it''s just that a naive search (working
  within the system, applying rules) may go forever without terminating, whereas the
  meta-level insight settles it instantly. Right — Hofstadter emphasizes that the
  MIU puzzle is decidable, and that the "jump out" gave a decision procedure. That''s
  a key subtlety! Many readers think MU is "undecidable/undemonstrable." In fact,
  the impossibility is provable; the interesting point is that no amount of inside-the-system
  searching reveals it, but a meta-level invariant does, and the invariant yields
  an algorithm. So the confusion "the MU puzzle shows formal systems are incomplete/undecidable"
  is doubly wrong.


  Also: does the MIU system have undecidable statements? It''s decidable (the mod-3
  invariant gives a decision procedure). Gödel''s theorem needs the system to be able
  to represent arithmetic; the MIU system is too weak. Hofstadter makes this point:
  you need enough expressive power for self-reference.


