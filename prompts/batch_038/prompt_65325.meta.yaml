  and a Wakefield-style harmful dysfunction account and a normativist account, and
  needs a procedure that runs the tests in order and records where the accounts disagree.

  - Niche injection: require the procedure to be "account-agnostic" in a specific
  way — e.g., to output not a verdict but a structured disagreement record: which
  account says yes, which says no, and what the decision-relevant consequence is.
  And require that it handle cases where the statistical baseline is population-relative
  (Boorse''s reference class: age, sex, and maybe race?) — the "reference class" problem
  is a genuinely technical, in-the-weeds element of Boorse''s biostatistical account.
  Also Boorse''s distinction between disease and injury, and his notion that disease
  is a type-level internal state below typical biological functioning, plus his later
  revision allowing "subtypical" reference classes and the "irrelevance of value"
  vs. the pragmatic selection of which functions count as goals (survival and reproduction).
  And normativist rejoinders: Boorse''s reliance on "typical" is itself value-laden;
  the choice of reference class; the treatment of socially caused dysfunction.


  Also a nice injection: the "harm" component in Wakefield requires a value judgment
  about what''s harmful in the person''s culture, so a procedure would need a way
  to source that judgment (who decides). And there''s the "hybrid/naturalist-normativist"
  middle: Kingma''s objection that Boorse''s account is normativist in disguise because
  functions depend on goals set by the environment/culture (Elina Kingma, "What is
  it to disable a function?"). That''s real and well-known in the literature. Also
  Nordenfelt''s ability-based vital goals account, and the "disability vs disease"
  distinction.


