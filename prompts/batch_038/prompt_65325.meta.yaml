  The conceptual work: translating Boorse''s biostatistical account, Wakefield''s
  harmful dysfunction, Nordenfelt''s ability/vital goals, and a normative/social account
  (e.g., the view that disease concepts are partly constituted by social norms; also
  "pathologization" critiques) into an ordered procedure that produces either a verdict
  or a structured record of disagreement. Key distinctions that must survive: (1)
  disease vs. illness vs. sickness (the tripartite distinction — well known); (2)
  type-level vs token-level (Boorse: disease is a type-level notion, so a single individual''s
  unusual state may not be a disease — this is a genuinely in-the-weeds point that
  must survive, and it creates hard cases for adjudicating individual claims!); (3)
  reference class selection (age, sex, and possibly others; and the choice of reference
  class is where value creeps in); (4) function as statistically typical contribution
  to survival and reproduction vs. function relative to a goal; (5) harm as judged
  by whom and in what social context; (6) the distinction between "is this a disease?"
  and "should this be covered?" — the procedure must not conflate them (a key normative
  firewall, since naturalists often insist the disease concept is value-free while
  coverage is value-laden). That firewall is a great injection: the asker wants the
  procedure to keep the two questions separate, and to be honest that most of the
  panel''s actual disputes are coverage disputes wearing disease language.


