  To make the future-contingents lens bite, the interesting cases are: (1) questions
  whose resolution is "settled" now by physics vs genuinely open — but nobody thinks
  that''s knowable; (2) retrodiction: a question resolved NO, but where the event
  was indeterminate at the time — does that show the forecaster was wrong? This is
  where the theory bites: the Peircean says a claim "There will be a sea battle tomorrow"
  was false when uttered even if the battle occurs; the Ockhamist says it was true.
  So a scoring protocol that awards credit retroactively is implicitly Ockhamist.
  And a protocol that penalizes confident claims about the open future is implicitly...
  hmm. Actually the deep point: any scoring rule that assigns a definite truth value
  ex post is committed to the Ockhamist/thin-red-line picture, or at least to bivalence;
  a supervaluationist protocol would need to treat some questions as neither and would
  then have to decide how to score them (and any way of scoring them re-introduces
  bivalence at the level of the score). That''s a real and non-obvious conceptual
  payoff. Also: what about probability assignments — de Finetti-style, credences on
  future contingents are fine even if truth values aren''t; the betting interpretation
  makes "indeterminate truth" compatible with precise probabilities, which is a genuinely
  interesting tension the procedure must address.


