  holds — the "free" observation assumption, the value of information is non-negative
  only if you can commit to act on the information; and the tension with dynamic inconsistency,
  e.g., in problems like the sleeping beauty, or with non-conglomerability, or with
  ambiguous evidence / imprecise credences (where the value of information can be
  negative — e.g., Good''s own "safe bet" / the debate over the value of learning
  with sets of priors; there''s literature on how with sets of priors, free information
  can decrease expected utility — "good and bad Bayesian learners"?). Also relevant:
  information that you cannot act upon, information you are compelled to disclose
