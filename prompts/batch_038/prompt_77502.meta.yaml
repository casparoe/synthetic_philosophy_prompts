  the expected value of information from a free (costless) observation is non-negative,
  with equality iff the posterior expected utility is the same across outcomes, i.e.,
  unless the observation is certain not to change one''s decision / the likelihood
  ratios are equal across states. This connects nicely to decision theory, and to
  Newcomb''s problem and dynamic consistency.


