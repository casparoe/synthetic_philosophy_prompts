  Another interesting angle: what does the strategy-stealing argument presuppose?
  It presupposes monotonicity (extra moves never hurt), determinacy (one of the players
  has a winning strategy — needs Zermelo-style determinacy for finite games), and
  that the games are symmetric/positional. And the "extra move never hurts" assumption
  is exactly where the interesting philosophy lies: in some games (like misère Nim,
  or "poisoned" games), extra resources hurt. So an institution/practice: the practice
  of publishing non-constructive existence proofs of first-player wins while noting
  "we have no idea what the winning move is" — e.g., for Chomp, or for the "which
  games admit strategy-stealing" classification programme.


