  Exam question draft:


  PHIL 3140, Philosophy of Mind — Essay 2 (1,200 words max)

  "Cognitivist theories of emotion say emotions are (or involve) judgments; perceptual
  theories say they are more like perceptions of value; feeling theories say they
  are feelings of bodily changes. Consider the case we called ''hollow fear'' in lecture:
  a patient who, on being shown a spider, has the full pattern of autonomic arousal
  and reports the characteristic felt quality of fear, yet sincerely disavows any
  evaluation of the spider as dangerous or unpleasant and makes no move to withdraw.

  (a) Which of the three theories does hollow fear pose the most serious problem for,
  and why?

  (b) Is a subject in hollow fear in a position to be said to be afraid? Explain what
  would settle the answer."


  Hmm, (b) might be too much. Keep both but note students often answer one part thoroughly.


  Student answer draft (~500 words):


  "Cognitivism, most influentially defended by Solomon and later Nussbaum, holds that
  an emotion just is a judgment (Nussbaum adds that it''s a eudaemonistic judgment,
  about something''s bearing on one''s own flourishing). On this view fear is the
  judgment that something before me is dangerous and threatens my well-being. Perceptual
  theories keep the idea that emotions have evaluative content but deny the content
  is conceptual: fear presents the spider as dangerous in something like the way that
  a visual experience presents a surface as red, non-conceptually and involuntarily.
  Feeling theories, going back to James, deny both: the emotion is the perception
  of the pattern of bodily changes that the stimulus causes — we feel sad because
  we cry — so what makes my state fear rather than excitement is which bodily changes
  I''m feeling, not what I take the world to be like.


  Hollow fear is clearly the biggest problem for cognitivism... [etc.]"


  Now insert errors:


  1. "judgments are involuntary in a way that perceptions are not" — reversed. Place
  it: "The perceptual theory''s advantage is that judgments are involuntary in a way
  perceptions are not, so a perceptual state can persist after we''ve revised our
  view..." Wait — if judgments were involuntary, that would support the persistence.
  The correct claim is: perceptions are involuntary/ not directly under our control,
  whereas judgments are responsive to evidence and reasons — so on cognitivism, retracting
  the judgment should retract the emotion, which is why recalcitrant emotion is a
  problem. The student''s reversed version says judgments are involuntary, and then
  concludes perceptual theory explains persistence better — the inference is undercut
  by their own premise (if judgments were involuntary, cognitivism would explain persistence
  fine). A hasty grader reads it as fluent and moves on.


  2. James as proto-cognitivist: "Notice that James is already a kind of cognitivist:
  on his view the feeling is a judgment about what my body is doing, so the disagreement
  between feeling theories and judgment theories is really about whether the judgment
  is about the world or about the body." — conflation.


