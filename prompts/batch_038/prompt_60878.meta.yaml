  Residue candidates in legal vocabulary:

  - Nozick''s ground for the line is a capacity (self-conscious life-shaping), not
  a species or a status assignment; law assigns status by category and can, in principle,
  grant personhood to non-persons (corporations) and deny it to persons (historically).

  - Law''s "unnecessary suffering" test is comparative and consequentialist-flavored;
  it asks whether the suffering is outweighed by a legitimate human purpose — which
  is exactly the trade-off Nozick''s side constraints forbid among persons. So law
  treats animals in the aggregating way Nozick says is appropriate for animals but
  inappropriate for persons — a fit.

  - The residue: Nozick''s view is that animals'' claims are not derived from their
  interests in the way a rights-holder''s are; the legal frame has no way to represent
  a claim that is not enforceable by someone with standing. Also: Nozick''s "utilitarianism
  for animals" counts the welfare of animals in the aggregate across all animals,
  including wild ones — law has no jurisdiction over wild animals and no aggregate-welfare
  standard at all (law is about specific defendants and specific acts). That''s a
  big one: the legal frame cannot express "maximize total animal happiness," only
  "this defendant must not cause this animal unnecessary suffering."

  - Also, Nozick''s view that we might permissibly eat animals that had good lives
  is not expressible as a legal category: there''s no "well-lived-life defense" to
  slaughter; slaughter regulation is about method, not about entitlement.


