  I think a strong combination: Nozick''s views on animals + "restate a position in
  the vocabulary of another framework and report what does not survive." Nozick has
  an elaborate, somewhat under-appreciated set of views about animals: side constraints
  apply only to beings that meet certain conditions (the capacity to shape their life
  according to some overall plan or at least to act on the basis of long-run considerations),
  utilitarianism for animals ("utilitarianism for animals, Kantianism for people"),
  the "experience machine" argument, and his discussion of meat-eating, and importantly
  his view that animals lack the capacity for rational recognition and thus we cannot
  have relations of mutual constraint with them — plus the notion that animals may
  have rights against being caused to suffer but the killing question is more complex
  because of the loss of future opportunities. Also his view in Anarchy, State, and
  Utopia that animals do not have the capacity to be "rational beings able to shape
  their lives in accordance with some overall plan" — so side constraints don''t hold
  for them, but he also proposes a "utilitarianism for animals" that would maximize
  the total happiness of animals and permit us to violate their rights only in extreme
  cases.


  Also, importantly, Nozick''s discussion in Socratic Puzzles of vegetarianism — where
  he asks whether it''s right to eat animals, and considers "the pleasure of eating
  meat" vs. the suffering. And his notion that animals may have a right not to be
  used in ways that don''t respect them. There''s also his discussion of the "welfare
  of animals" — his view that we should consider whether eating animals is permissible
  given that the animal has had a good life.


