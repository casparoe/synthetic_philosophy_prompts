  that no poll can extract.


  Move 2 (Dev): But the no-trade theorem says that if we all share a common prior
  and are rational, there can be no speculative trade at all: given any common-knowledge
  mutually agreeable trade, the initial allocation (before anyone learns anything
  private) was already efficient, and rational agents with a common prior can''t all
  expect to gain from the same trade. So if we see Marta and her colleague both eager
  to take opposite sides of a contract, at least one of them isn''t rational, doesn''t
  share the prior, or isn''t trading on information — e.g. is trading to hedge her
