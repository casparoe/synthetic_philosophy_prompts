  Draft of the exchange:


  Context: The firm is deciding whether to trust internal price signals / whether
  to buy a prediction market. Let''s use a concrete practical dispute: A company runs
  an internal prediction market; one colleague (D) argues prices are informative because
  they aggregate private information; another (M) argues that the no-trade theorem
  shows that if everyone were rational with a common prior, the very act of trading
  would destroy the information content — so a price that moves tells you nothing.


  Let me make the rounds precise and each side making real points:


  Round 1: M claims: Milgrom and Stokey''s no-trade theorem says that if agents share
  a common prior and have private information, then no mutually agreeable speculative
  trade can happen at any ex ante efficient allocation. Therefore, when you observe
  trade, you must conclude at least one party isn''t rational, doesn''t share the
  prior, or has some other motive — so the price can''t be treated as an information
  aggregate.


  Round 2: D replies: The theorem''s conclusion is about speculative trade; real markets
  have liquidity needs, hedging motives, risk-sharing, inventory adjustments, and
  differing risk aversion — those generate trade without any informational content
  and don''t refute the theorem, but they also mean observed trade volume is compatible
  with plenty of information aggregation: informed traders trade because they''re
  informed, and their trades move prices. So the theorem tells you the pure case is
  impossible but says nothing about the mixed case where a price move partly reflects
  information.


  Round 3: M counters: But then you can''t decompose. If any given trade might be
  liquidity-driven, and the counterparty knows you know this, the informed trader''s
  willingness to trade reveals less; you get unraveling — the "market for lemons"
  style argument. In the extreme, if there''s any chance your counterparty is a noise
  trader, then... hmm, actually that''s the opposite: noise trading is what makes
  information revelation possible (Kyle''s model: informed traders hide among noise
  traders; without noise traders, prices fully reveal). Actually the classic result:
  with noise traders, prices only partially reveal information (Grossman-Stiglitz:
  no fully revealing equilibrium; the limit as noise → 0 leads to nonexistence of
  equilibrium). So D can invoke Grossman-Stiglitz: information must be costly to acquire,
  and a fully revealing price would destroy the incentive to be informed; so prices
  can never be fully informative but are partially so. And the no-trade theorem relies
  on the absence of noise/liquidity traders; its assumptions are exactly what fails.


  Round 4: M says: Fine — but then concede the normative point: the epistemic authority
  of market prices is not the theorem-derived "price = aggregate of private information"
  story, but a messy equilibrium story in which how much information prices carry
  depends on how costly it is to acquire it and how much noise there is, and there''s
  no way for an outside observer to know which. So using a price as evidence requires
  knowing the noise/information mix, which is precisely what you don''t observe. Hence
  "prices convey information" is not something the theory licenses.


  Round 5: D says: There''s a further, more damaging point: Geanakoplos–Polemarchakis
  / Aumann: rational agents with a common prior cannot agree to disagree about the
  posterior of an event once their posteriors are common knowledge; if they announce
  their posteriors truthfully, they converge. So markets are worse than mere conversation:
  cheap-talk announcement of posteriors would achieve agreement without any trade
  at all. Which is the correct reading of the no-trade literature: trade isn''t the
  mechanism of information aggregation; communication is. So M is using the theorems
  to argue the wrong conclusion: the theorems don''t show prices are uninformative,
  they show trade is an inefficient way of pooling beliefs, and the fact that we nonetheless
  observe disagreement plus trade is evidence of something other than common-prior
  rationality (or evidence of costly communication/strategic behavior).


