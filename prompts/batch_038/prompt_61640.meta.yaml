  only source is differential information among common-prior agents. Real markets,
  including ours, have other sources: people differ in risk attitudes, in the costs
  they bear if the outcome goes one way (the launch-date team genuinely wants to hedge
  the schedule slipping), and in attention. Those motives produce trade and let informed
  people trade too. In the standard models, informed traders can only profit because
  there are also uninformed/noise traders; the price then partially reveals their
  information. So volume and price movement are perfectly compatible with information
  aggregation; the theorem describes a limiting case that never obtains.


