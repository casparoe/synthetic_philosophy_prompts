  Let me design the disagreement carefully, with genuine points on both sides, several
  rounds, and specific moves to adjudicate.


  Setting: Two people — maybe an econ PhD student and a quant trader friend, or two
  members of a prediction-markets reading group. The asker is a bystander (e.g., "I
  sit in on a Friday reading group at my firm" / "two colleagues"). The asker must
