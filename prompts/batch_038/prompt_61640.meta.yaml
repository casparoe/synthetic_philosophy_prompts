  - Milgrom & Stokey (1982) "Information, trade and common knowledge": if agents are
  risk-neutral (or if the initial allocation is Pareto optimal) with common prior,
  no trade that is common knowledge to be mutually agreeable can occur; i.e., speculative
  trade is impossible when the initial allocation is ex ante efficient. Key point:
  only speculative (information-based) trade is ruled out; trade based on differential
  risk attitudes/hedging/liquidity is not ruled out.

  - Geanakoplos & Polemarchakis (1982): with common prior, if agents announce posteriors
  about the value of an asset, the announcements eventually lead to common knowledge
  and agreement (for a certain class — "cannot agree to disagree" via communication
  of posteriors).

