  Let me think about what would make a specialist in Augustine laugh and find it fair:

  - The absolute prohibition: no lie is ever permitted, even to save a life. The tension
  with his own allowance of "concealment" (not saying something vs. saying something
  false) — the loophole that opens onto later mental reservation and equivocation,
  which Catholics exploited (the famous anti-Catholic satire about Jesuit equivocation).
  Augustine insists you may remain silent or speak ambiguously only if you don''t
  intend to deceive... Actually Augustine allows withholding the truth (not lying)
  but condemns intending to deceive by silence? He says a lie consists in having one
  thing in the heart and another on the tongue (duplex cor). The key: for Augustine,
  lying is defined by the intention to deceive (voluntas fallendi) combined with a
  false sign, and lying is always a sin but of different gravity; also he distinguishes
  lies from jokes (a jocose lie isn''t a lie because no one is deceived and there''s
  no intent to deceive) and from figurative/parabolic speech.

  - His argument that lying corrupts the liar''s own soul and destroys the social
  bond of trust — and his worry about the "contagion."

  - His engagement with the case of the heretics: whether you may pretend to be a
  Priscillianist to catch them (Contra Mendacium, addressed to Consentius) — he says
  no; you may not lie even for the sake of the faith.

  - His treatment of the biblical cases: the Hebrew midwives (Exodus) — who were rewarded
  not for the lie but for their mercy; Rahab; the objection that God commanded Abraham
  to sacrifice Isaac (not a lie); Christ''s "the Father is greater than I"? Augustine''s
  rule that Scripture can''t lie but uses figurative speech.

  - Also: Augustine''s view that lying is worse than killing the body? He says the
  mouth that lies kills the soul (Sap. 1:11: "the mouth that lies slays the soul")
  — that''s central: the soul''s death is worse than the body''s. So you may not lie
  to save someone''s life, since you''d kill your own soul, which is worse. That''s
  the crisp internal logic a reductio could follow.

  - Also the "officious lie" tradition (Aquinas''s threefold division: jocose, officious,
  malicious — officious lies are venial) vs. Augustine''s blanket sin (though Augustine
  allows degrees of gravity).

  - Modern relevance: Kant''s "murderer at the door," and the contrast between Augustine
  and the casuist tradition of mental reservation.


