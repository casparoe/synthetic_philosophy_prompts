  from Metamagical Themas / "Dilemmas for Superrational Thinkers, Leading Up to a
  Luring Lottery" (1983–85 in Scientific American / the book "Metamagical Themas").
  Superrational agents reason that since all superrational agents reason the same
  way, they should cooperate in symmetric games — but crucially, only when the other
  players are also superrational and the game is symmetric, and it does not extend
  to asymmetric games or to interactions with non-superrational players. Common confusions:
  it''s not Kantian ethics exactly (though Hofstadter invokes a Kantian flavor — "act
  as if your choice determined everyone''s"), the "meta" prefix, whether it requires
  knowledge that others are superrational, whether it collapses into evidential decision
  theory / EDT, the relation to the Luring Lottery thought experiment (which Hofstadter
  ran in the magazine — a lottery where more entries reduce each entrant''s expected
  value if entrants are correlated). Also relevant: superrationality in one-shot prisoner''s
  dilemma vs. iterated, and its relation to Newcomb''s problem, Douglas Hofstadter''s
  "idealizing" assumption, and the criticism that it''s a form of magical thinking
  (causal irrelevance). Also Robert Aumann''s related "correlated equilibrium" idea,
  and the fact that superrational reasoning resembles Kant''s categorical imperative
