  \ between proponents of two opposing views\n\nLet me pick something interesting.\
  \ The \"no-trade theorems and epistemology of markets\" domain combined with \"\
  what does this practice presuppose\" type could be great: e.g., insider trading\
  \ law — what does it presuppose about information and markets? Or prediction markets.\
  \ Or the practice of central bank communication / forward guidance. Or the SEC's\
