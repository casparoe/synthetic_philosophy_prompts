  \ disagreement that the theory says rational agents can't sustain.\n\nHmm, but the\
  \ \"no-trade theorems\" domain is specifically listed. Let me use it well.\n\nLet\
  \ me think about the type-2 option: grade a student answer. That's attractive too\
