  \ a distinction between information obtained from the company and information assembled\
  \ independently — a view about property rights in information and about the epistemic\
  \ value of market prices. Actually, the deeper inconsistency: the practice both\
  \ (a) wants prices to be informative (efficient market hypothesis, price discovery,\
  \ \"informational efficiency\" as a regulatory goal) and (b) polices the trading\
  \ on some information. And the \"no-trade theorem\" (Milgrom-Stokey) says if traders\
  \ are rational and share common prior, there should be no speculative trade — any\
  \ trade reveals information, so a rational counterparty would update and decline.\
  \ So volume of trade itself is anomalous. The question: what does the existence\
  \ of liquid securities markets, with huge volume, presuppose? That traders disagree\
  \ about their own rationality? That they're overconfident? Or that they have different\
  \ risk preferences/needs (hedging, liquidity)?\n\nActually, a great prompt in the\
  \ \"commitments a practice presupposes\" type: the practice of insider trading law,\
  \ specifically the misappropriation theory (O'Hagan), combined with the classical\
  \ theory (Chiarella — duty to disclose or abstain based on relationship of trust\
  \ with shareholders of the target). The law forbids trading on information obtained\
  \ from the issuer but permits trading on information obtained by diligent research.\
  \ What epistemology of markets does this presuppose?\n\nAlternatively: prediction\
  \ markets. Or: the practice of \"forward guidance\" by central banks. Or: the practice\
  \ of securities exchanges doing \"circuit breakers\"/trading halts when prices move\
  \ too fast — this presupposes that fast moves are more likely to be erroneous than\
  \ slow ones, i.e., that price changes have a \"correct speed,\" which is a claim\
  \ about information arrival. That's neat and connects to the no-trade/efficiency\
  \ literature.\n\nAnother: the practice of academic journals / peer review. Hmm.\n\
  \nOr: the practice in finance of measuring fund managers by \"alpha\" after adjusting\
  \ for beta (CAPM). What does that presuppose? That markets are efficient enough\
  \ to price systematic risk, but that some managers beat it — internally odd.\n\n\
  I think a strong candidate: \"Regulation FD and the mosaic theory\" plus \"insider\
