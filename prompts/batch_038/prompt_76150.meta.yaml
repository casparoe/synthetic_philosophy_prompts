  Setup: I''m writing the methods chapter of a master''s thesis. My supervisor, when
  I said I wanted to defend something close to Ranke''s old instruction to show the
  past as it actually was, reached for Carr''s fishing image from the first chapter
  of What is History? — the one where the facts of the past are like fish swimming
  in a vast ocean, and what the historian catches depends on where he chooses to fish
  and on the mesh of the net he chooses to use, so by and large he gets the kind of
  facts he wants. My supervisor''s use of it was blunt: nets are chosen, mesh size
  is chosen, the fishing spot is chosen, therefore there''s no such thing as a neutral
  catch and the whole Rankean project is naive. A guy in my seminar pushed the same
  image further in a White-ian direction: you never actually encounter an uncaught
  fish, and what you hand over at the end is a story you built out of scales and a
  few bones, so the net doesn''t just select the fish, it constitutes them.


  I want an audit of the analogy as an argument, not a biography of it.


  1. Correspondence table, explicitly: ocean, fish, the net, the mesh, the fishing
  location, the catch, the fisherman, and whatever else earns a slot (the market?
  the quota? the boat? the skill of the fisherman?). Say for each what in historiography
  it''s supposed to stand for and how tightly it stands for it.


  2. Split the disanalogies into the ones that actually bite against my supervisor''s
  conclusion and the ones that are decorative. I suspect at least these matter but
  I want to know if you agree: fish exist and are the size they are whether or not
  anyone nets them; mesh is checkable against the catch (you can haul a finer net
  over the same water and see what you missed); fishing has an internal success condition
  — you caught fish or you didn''t, and you can tell which; the fisherman''s purpose
  is external to the ocean; and nets don''t get better at catching what they were
  designed to exclude. Which of those is load-bearing for the Ranke-deflation move,
  and which ones can a Carr-ian absorb?


  3. The bit I most want nailed down: does the analogy smuggle in the very realism
  it''s supposed to be used against? It seems to me that the ocean image grants a
  determinate stock of facts-of-the-past waiting under the surface, plus a notion
  of gear improving, plus the idea that a good catch is judged against what''s in
  the water. If that''s right, the image supports Carr''s own moderate claim — interaction,
  dialogue, the historical fact as distinct from the fact of the past — and actively
  resists the stronger sceptical conclusion. Argue for or against that, and tell me
  how confident you are.


  4. Can the image be stretched to do what my seminar guy wants — a net that constitutes
