  Let me reconsider. Maybe a cleaner, more tractable engineering target:


  Design a thought experiment for distinguishing "CTT as a claim about effective computability
  by an idealized human computer following a fixed procedure" from "CTT as a claim
  about what physical processes can compute", such that:

  - a single case shows the two formulations coming apart in *both* directions is
  impossible? Hmm.


  Honestly, maybe the archives domain gives a cleaner, more clearly-satisfiable design
  and is less likely to trip up a smaller model with technical errors. But the CTT
