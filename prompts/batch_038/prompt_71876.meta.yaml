  Let me draft the Church-Turing one:


  "Design a thought experiment for a graduate seminar on the philosophical status
  of the Church-Turing thesis. I want a case in which a physical device is presented
  that everyone agrees computes a non-computable function, yet which gives a proponent
  of the thesis no reason whatsoever to concede anything — while a second, deliberately
  paired device, superficially identical in what it outputs, does force a concession.
  Constraints: no exotic spacetimes (no Malament–Hogarth setups, no infinite-time
  or relativistic computers), no infinitely accelerating machines, no appeal to an
  oracle as a black box; the device must be something an engineering lab could at
  least sketch building; each device gets one paragraph; the outputs must be checkable
  by a layperson. After the two scenarios, do the demonstration: state precisely which
  formulation of the thesis each device bears on (thesis about effective calculability
  / about what human mathematicians can do / the physical Church–Turing principle),
  explain why the first is compatible and the second is not, identify the single feature
  that separates them, say what happens if that feature is removed, and give the strongest
  objection from someone who thinks the first device is after all a counterexample
  (the objection should not be a cheap equivocation)."


  Hmm, what''s the intended answer? First device: something like a device that produces,
  for each n, the answer to a Π₁ sentence — but crucially, the interesting asymmetry.
  Perhaps: Device A is a machine whose output is non-computable but which requires
  an infinite/non-terminating run and where any finite prefix of its output is computable
  — so it never outstrips what a Turing machine can do in finite time; the non-computability
  lives in the limit, which no physical process can actually reach, so nothing observable
  is non-computable. Actually a cleaner distinction: Device A''s non-computable function
  is computed only "in the limit" via a supertask that can''t be completed — the human
  can''t get the answer. Device B: a device that, given any input n, produces the
  n-th digit of a non-computable but mathematically definite sequence in finite time
  and in a way checkable... Hmm, but a device that does B would be a genuine physical
  counterexample to the physical Church-Turing principle.


  Another good separation: Device A computes a non-computable function but only with
  respect to a domain the device itself cannot survey — e.g., a device that emits
  a random real number from a genuinely indeterministic quantum process: its output
  sequence is algorithmically random hence non-computable, but no Turing machine can
  compute it *because no one can either* — randomness is not "effective calculability
  being exceeded"; the thesis concerns the deterministic production of outputs from
  inputs, and a random oracle is not a counterexample since a counterexample requires
  a *function* that is effectively computed. So Device A: quantum random number generator
  (non-computable output, no threat to CTT because it''s not a computation of a function;
  it''s noise). Device B: a device that, given a program index e and input x, halts
  with the right answer to "does e halt on x" — a halting oracle implemented by...
  you can''t implement it physically without exotic physics. Hmm, but constraint says
  "an engineering lab could at least sketch building" — maybe relax that constraint.
  Alternatively Device B could be an analog device whose physically realized magnitudes
  encode the halting problem in a way that can be read off with unbounded precision
  — e.g., a device with a continuous variable whose exact value is a non-computable
  real, read by an idealized measuring apparatus of unbounded precision. That''s the
  classic "analog computer with unbounded precision" argument (e.g., pouring water
  / measuring a real number to arbitrary precision). It threatens the physical CTT
  only under idealization of infinite precision, which is physically unavailable —
  so maybe both collapse.


  Hmm. Maybe a better design: the distinction is between the thesis as a claim about
  *effectively computable functions* (mathematical/logical) and the thesis as a claim
  about *physical systems*. Design a case where a device threatens one formulation
  and not the other, and a paired case where it threatens both, with the separating
  feature being *whether the non-computable content is accessible in finite time to
  a finite observer*.


  Alternatively, another axis: "the device computes a non-computable function, but
  the function it computes is not mathematically well-defined / not determined by
  the physics" — i.e., the device''s output depends on a physically indeterminate
  parameter, so it isn''t computing a function at all; vs. a device whose output is
  a determinate function of a determinate input and is non-computable.


  I think this could work but it''s a bit intricate, and the "two paired devices"
  design is good. However, the risk: the model must produce a genuinely correct and
  interesting pair. It''s doable: Device A = quantum randomness generator or a Zeno/limit
  machine whose output is only determined in the limit; Device B = an unbounded-precision
  analog machine (e.g., "a mechanical integrator whose gear ratios encode Chaitin''s
  Ω"?) Hmm, Device B is tricky to sketch physically. Maybe Device B: "a device built
  from a standard Turing machine plus a physical component that solves the halting
  problem for that machine" — you can''t build it, but as a thought experiment it''s
  fine if we drop the "engineering lab" constraint and instead require "no infinite
  or superluminal resources; the device must terminate each run in finite time and
  each run must have a finite description".


  Actually a cleaner Device B: an accelerating machine is banned. What about "a device
  that computes in finite time using a non-computable physical constant whose exact
  value the device can read to arbitrary precision" — that''s the standard route to
  physical hypercomputation (e.g., measuring a real-valued quantity). This is realistic
  as a thought experiment: a "real-number oracle" whose readout precision is limited
  only by how long you wait, but each read is finite-time and finite-energy. The separating
  feature between A and B: in A the non-computable content is *not accessible* — every
  finite observation is consistent with a computable process (randomness); in B, a
  finite observation *can* certify non-computability, because the readout converges
  provably to a specific non-computable value that a mathematician can independently
  identify (e.g., the digits of a specific non-computable real defined by a Π₁ property),
  so a human can check the device has produced information no algorithm could. That''s
  a good, non-trivial design: A = noise (unfalsifiable, no epistemic gain); B = a
  device whose output can be verified against a mathematically specified non-computable
  target, giving genuine epistemic gain that no Turing machine could provide.


  Hmm, wait — but in B, if a human can independently specify the target and verify
  the digits... the human can''t verify infinitely many digits. But finite prefixes
  of a non-computable real are computable, so verification of a finite prefix proves
  nothing! That''s actually the interesting trap: any finite prefix of Ω is computable,
  so the device can always be explained away as "hard-coded a long prefix". Good —
  that gives a real philosophical puzzle and a place for the "defender''s objection."


  OK. So actually the deep point: any *finite* observation is compatible with a computable
  explanation; hence physical hypercomputation can never be empirically demonstrated;
  hence the physical Church–Turing principle is not testable, which is a well-known
  point (e.g., in discussions of the "unfalsifiability of hypercomputation claims",
  Piccinini, Horsman, and others). That gives a rich answer space: the paired devices
  differ in whether the concession is forced. And a satisfying honest note: the separating
  feature is whether the non-computable content is *specifiable in advance* (independently
  identified target) vs. merely random.


  Hmm, this is getting sophisticated. It''s fine — the prompt should be hard but doable.
  But maybe I should simplify the specification so it''s clearly jointly satisfiable.
