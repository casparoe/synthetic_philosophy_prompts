  Arendt''s key claims (from "Lying in Politics" and "Truth and Politics"):

  - Traditional lies conceal; the modern political lie (as in the Pentagon Papers)
  aims to destroy/remake reality, and the liar''s advantage is that he can offer a
  coherent, self-consistent image that is more plausible than the messy truth.

  - Factual truth is peculiarly vulnerable: unlike rational truth, it''s contingent
  — the facts "could have been otherwise," so the lie that replaces them is not internally
  contradictory and can be accepted without strain.

  - The liar''s success depends on the audience''s willingness; and the greatest danger
  is when the liar begins to believe his own lies (self-deception), which the Pentagon
  Papers'' "problem-solvers" displayed: they were deceiving themselves, not just others.

  - The result is not that we believe the lie, but that we lose the ability to distinguish
  truth from falsehood and become cynical — "the result of a consistent and total
  substitution of lies for factual truth is not that the lies will now be accepted
  as truths... but that the sense by which we take our bearings in the real world...
  is being destroyed."


