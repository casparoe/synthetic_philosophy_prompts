  An argument that proves too much in Arendtian terms:


  (1) Political lying is effective because the liar can always offer an account more
  coherent and more satisfying than the messy facts.

  (2) Factual truth is contingent — everything could have been otherwise — so no fact
  is self-evident or rationally compelling; a fact can always be replaced by a fabricated
  alternative with equal logical standing.

  (3) Therefore, in politics, truth-telling has no intrinsic persuasive advantage,
  and the choice between truth and lie is decided only by power, plausibility management,
  and prior commitments.

  (4) But if that''s right, then the distinction Arendt wants between the "traditional"
  liar (who respects the truth enough to hide it) and the "modern" liar (who wants
  to destroy it) collapses: both are just playing the same game at different intensities,
  since the traditional liar''s respect for the truth is a private attitude with no
  political effect.

  (5) And the condemnation of systematic lying as destroying the shared world can''t
  be grounded in anything about truth itself, since by (2)/(3) truth has no purchase
  in the political realm — so the condemnation can only be that lying is imprudent,
  bad for stability, or bad for "us" (those who prefer a shared world).

  (6) Yet lying in politics is supposed to be a distinctive wrong, not merely an imprudent
  strategy.

  (7) So either (2) is false — factual truth does have some intrinsic political purchase
  — or the distinctive wrongness of political lying is a kind of aesthetic/prudential
  preference, and Arendt''s alarmism about the "modern lie" is overblown.


  Where does it go wrong? Candidate diagnoses: equivocation between "a fact''s being
  logically contingent" and "a fact''s being epistemically weightless / replaceable
  at no cost." Arendt''s point about fragility is not that facts lack authority but
  that they can only be protected politically (by institutions, witnesses, records,
  free press) — the vulnerability of factual truth is precisely why its destruction
  is a distinctive wrong, not evidence that it never mattered. Also equivocation on
  "coherence/plausibility" as the measure of political acceptance: the modern lie''s
  initial success and its eventual self-destruction — lies require ever more lies,
  and the "remaking of reality" fails because reality pushes back (the Pentagon Papers
  case: the image-makers'' scenario was falsified by events). So (3) is too strong:
  truth has a *revenge* mechanism over time. Also step (4): the traditional liar''s
  respect for the truth is not politically inert — the liar needs the truth to remain
  the background against which his lie is intelligible and useful; the total liar
  destroys the very thing that makes lying profitable. That''s a real structural asymmetry
  (parasitism): lying is parasitic on a mostly-truthful practice (as with promising,
  cf. the "free rider" argument).


