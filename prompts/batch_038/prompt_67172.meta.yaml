  \ while the means of subsistence increase only in an arithmetic ratio, and that\
  \ population is therefore held at the level of subsistence by checks. World population\
  \ has since multiplied roughly tenfold, and in much of the world real incomes have\
  \ risen rather than fallen. It is said either (a) that Malthus was falsified by\
  \ this record, (b) that he was falsified but that the falsification was postponed\
  \ by auxiliary hypotheses, or (c) that his theory is flexible enough to accommodate\
  \ any demographic history and so was never falsifiable at all. Some defenders reply\
  \ that Malthus was 'right but early'. Explain what 'right but early' would have\
  \ to mean in order to be a genuine possibility rather than a way of evading refutation,\
  \ and assess whether it can bear that weight in this case.\"\n\nStudent answer:\n\
  \n\"Malthus's theory is not a vague prophecy. It states a mechanism — unchecked\
  \ population doubles in about twenty-five years, food does not keep pace — and a\
  \ consequence, that population is pressed against subsistence. Because it says something\
  \ that could have come out otherwise, it is falsifiable in principle, and it is\
  \ worth taking seriously in a way that many grand historical theories are not.\n\
  \nThe trouble is that it has come out otherwise. Two centuries of rising population\
  \ accompanied by rising real incomes are exactly what the theory rules out. On Popper's\
  \ account a theory is refuted when observation contradicts it, and here observation\
  \ has contradicted it repeatedly; the honest verdict is that Malthus was falsified,\
  \ and that everything since has been commentary.\n\nDefenders do not accept this.\
  \ When the evidence turned against the theory, Malthus and his successors revised\
  \ it: in a later edition Malthus added moral restraint — delayed marriage and celibacy\
  \ — as a third check alongside misery and vice, and twentieth-century Malthusians\
  \ point to the Green Revolution as the reason the arithmetic ratio never materialised.\
  \ Lakatos would describe this as a paradigm whose protective belt of auxiliaries\
  \ absorbs the anomalies. On his view a paradigm degenerates when its hard core stops\
