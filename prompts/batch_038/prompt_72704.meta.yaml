  Key Neurath points (from what I know):

  - Vienna Method of Pictorial Statistics (Wiener Methode der Bildstatistik), developed
  with Marie Reidemeister (later Neurath) and Gerd Arntz (artist). Later renamed ISOTYPE
  (International System of Typographic Picture Education) around 1935.

  - Core rules: unit pictorial symbol (one icon = a fixed number of things), repetition
  rather than size-scaling ("the picture of a man repeated five times means five men";
  enlarging a man to double height would be misleading — though for quantities like
  area/volume, he preferred repetition over proportional scaling because scaling distorts
  the visual impression).

  - Pictorial statistics should be about "statements" not just charts; charts show
  relations between quantities; pictures should show the things themselves so they
  connect to lived experience ("a picture of a factory means factories").

  - Anti-"art for art''s sake" but also against mere decoration; the goal is social
  education, enabling people to see social facts.

  - The museum: he founded the Gesellschafts- und Wirtschafts-Museum in Vienna (1925),
  with the aim of democratizing knowledge; later Mundaneum in The Hague; then moved
  to Oxford (1942) and the Isotype Institute.

  - Internationalism: pictures are more transferable across languages than words;
  but Neurath was NOT naive — he thought a picture language needed conventions and
  teaching; "picture languages" cannot be entirely self-explanatory; he emphasized
  that symbols must be learned, and that international picture languages are a matter
  of agreement and education, not natural transparency.

  - He contrasted "picture statistics" with the idea that you can just show numbers;
  numbers are abstract, hard for many people.

  - Neurath''s broader philosophy: physicalism, protocol sentences as statements about
  perceptual experience that are revisable, the anti-foundationalist "boat" metaphor
  (Otto Neurath''s boat — rebuilding the ship at sea). He argued against Carnap''s
  phenomenalist protocol; against the idea of a pristine given. He thought science
  is a collective, historically continuous enterprise ("science as a behavior of the
  whole community").

  - His analogy: words vs. pictures; he wrote "Pictorial statistics" and "International
  picture language as the first planning project of the World Congress of Universal
  Writing" (1936 Paris congress).

  - Neurath on "the picture language is not a language in the sense of a complete
  symbolic system" — he was aware of limits.

  - He also had a strong claim about the social function: statistics in pictures help
  people understand social conditions and thus support planning/socialism; he was
  a socialist (Bavarian revolutionary period, centralization office).

  - Interesting tension: Neurath''s unit-symbol repetition works well for counts but
  poorly for continuous quantities, correlations, distributions, uncertainty, causation,
  and time series. Modern critique: icons can''t show a confidence interval; can''t
