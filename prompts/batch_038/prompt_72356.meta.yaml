  So the belief set:


  1. Epistemic value veritism: the only fundamental epistemic good is the accuracy
  (closeness to the truth) of a credence function; every other putative epistemic
  norm derives from accuracy, and no non-accuracy considerations constrain rational
  credence.

  2. Dominance methodology: a credence function is irrational iff it is accuracy-dominated
  — there is another function, permitted by the agent''s epistemic situation, that
  is strictly more accurate than it at every possible world. Irrationality is thus
  a structural, non-expectational notion. (And: the domination argument is not question-begging
  because it doesn''t rely on the agent''s own credences.)

  3. Probabilism follows from (2) under any legitimate inaccuracy measure.

  4. Conditionalization follows from maximizing expected accuracy relative to the
  agent''s current credences (the standard Greaves–Wallace/Joyce style argument),
  and this is the right way to argue for it because no dominance argument works for
  updating rules.

  5. Measure: the legitimate inaccuracy measures are the additive, bounded, continuous,
  truth-directed ones — hence essentially the Brier score (up to linear rescaling)
  — and this uniqueness is important because the conclusions shouldn''t depend on
  an arbitrary choice of measure.

  6. Immodesty/strict propriety: for each credence function c, c expects itself to
  be strictly more accurate than any rival; otherwise accuracy-first arguments would
  be self-undermining.

  7. Permissivism: for at least some bodies of evidence, more than one credence function
  is rationally permitted (motivated by cases of apparently ideal, well-informed peers
