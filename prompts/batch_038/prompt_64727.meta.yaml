  objection — call it the articulation problem, I''m sure someone''s said it before
  but I want to state it my way — is this: the will, on his own account, is blind,
  unitary, without parts or order, one and the same in everything, only its manifestations
  are plural. Music, on the other hand, is the most internally articulated art form
  there is: tonic and dominant, tension and resolution, theme and recapitulation,
  a strict hierarchy of parts. So what exactly is music copying? If the will has no
  structure, then a structureless copy is what you''d expect, and the highly structured
  thing we actually get has to come from somewhere else — plausibly from conventions,
  or from the physiology of hearing, or from the Ideas after all. And if you say the
  will does have the relevant structure, you''ve quietly re-admitted the stratification
  he was trying to route around, and music becomes a copy of something organized,
  i.e. basically back to the Ideas.


  The obvious rescue is his own stratification bit: grumbling bass = crude matter,
  the middle voices = the intermediate grades of objectification, melody on top =
