  Newcomb''s problem + classroom activity: There''s a real tension — you cannot stage
  a genuine Newcomb problem because you can''t build a near-infallible predictor;
  any classroom implementation either (a) uses a human predictor whose accuracy is
  questionable, (b) uses randomization, which turns it into a trivial dominance case,
  or (c) uses pre-committed sealed predictions which students may suspect were made
  after knowing their types. The most interesting design: use the students'' own prior-round
  behavior to predict, run multiple rounds with a "banker" who predicts from a profile,
  and then reveal that the predictions were derived from an earlier anonymous survey
  — creating real predictive accuracy. Also, the famous problem of "transparent boxes"
  / the second-guessing dynamic (if you can out-think the predictor, you two-box,
  and then the game isn''t Newcomb anymore). The debrief would have to handle the
  "it''s just a dominance-vs-expected-utility fight" and the fact that in a real classroom,
  causalists and evidentialists will both feel their intuition is being manipulated
