  Good angles:


  1. Nozick''s line-drawing: animals lack side constraints because they lack the self-conscious,
  forward-looking agency that makes using them as means impermissible. Test: Does
  Richard Parker have that? Does Orange Juice (the orangutan, whom Pi describes as
  having a matriarchal dignity, who "slapped" the hyena — actually Orange Juice growls
  at the hyena and is killed by it)? The orangutan''s maternal behavior on the lifeboat
  (she lost her two sons, was floating on a banana raft) — Pi reads her as a mother.
  If the orangutan exhibits grief, agency, and defense of another, the novel is putting
  pressure on exactly the capacity criterion Nozick uses. But: Pi also reads these
  as projections, and the second story suggests the animals are stand-ins for humans
  — which would mean the novel never actually gives us an animal mind, only a human-shaped
  allegory. That''s the "work resists the reading" part.


  2. Pi''s own conduct: he kills fish and turtles to eat and to feed the tiger; he
  weeps the first time, then it becomes easier. Under Nozick''s two-tier view, what''s
  the verdict? Does Pi satisfy "utilitarianism for animals" (he improves Richard Parker''s
  total happiness — feeds him, keeps him alive, gives him territory and routine)?
  Or does he use the tiger as a means to his own psychological survival — precisely
  the "using as a resource" that Nozick forbids for persons and (apparently) permits
  for animals? Pi''s dependence on the tiger for the will to live inverts Nozick:
  the human is using the animal as a resource for his own good, and the novel celebrates
  it. That''s a sharp, non-regurgitable point.


  3. The tiger''s killing of the other animals: Nozick''s utilitarianism-for-animals
  must either condemn predation or accept that nature''s total-happiness calculus
  is beyond our reach. Does the novel take a position? Pi''s Hinduism (and the priests)
  reframes killing as part of a sacred order; the island is a paradise that silently
  devours (the meerkats, the tooth, the fruit that kills at night) — a beautiful image
  of a world that maximizes apparent welfare while killing. Good.


  4. The ending: Richard Parker disappears without looking back; Pi is heartbroken
  at the lack of a proper goodbye. Does that show that the moral relation between
  human and animal is non-reciprocal in a way that matters for Nozick''s side constraints
  (which for Nozick are grounded in the animal''s capacity for a biographical life,
  for reciprocity, for mutual limits)? And is Pi''s grief about the tiger or about
