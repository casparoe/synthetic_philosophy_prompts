  \ fear-drug analogy. So I should include these as paraphrase in the prompt. That's\
  \ fine and actually good practice — it makes the prompt self-contained.\n\nBut hold\
  \ on: if I paraphrase Plato's argument in the prompt, I should make sure my paraphrase\
  \ is accurate. I know the Laws Book I reasonably. Let me verify key specifics by\
