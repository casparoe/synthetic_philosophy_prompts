  \ That's exactly the interesting part: the prompt could ask for a case where the\
  \ goal is *attributable* on behavioral grounds, and then ask whether the attribution\
  \ is doing real work or is empty.\n\nWhich is better? The Plato one is more original\
  \ and less likely to be regurgitated, but risks the model flailing on Plato specifics\
  \ (mitigated by paraphrase in prompt). The goal-misgeneralization one is high-quality\
