  \ caught cheating more easily. Also, the \"non-neural learner\" constraint is a\
  \ genuinely novel injection.\n\nHmm, but I also like the idea of a *third* option:\
  \ **Indicative vs counterfactual + thought experiment**. Spec: build a case where\
  \ the two come apart in the *less-discussed* direction and where the standard explanation\
  \ (epistemic vs. factual) does NOT apply — i.e., the speaker's evidence is complete\
  \ and the facts are fully known, so the divergence can't be blamed on ignorance.\
  \ Constraint: no Oswald, no lottery, ordinary setting, one paragraph. Hmm — but\
  \ if the speaker's evidence is complete, the indicative and counterfactual typically\
  \ converge (that's the well-known point: indicatives reduce to counterfactuals when\
  \ the antecedent's epistemic status is settled... actually, no: Adams's thesis says\
  \ the indicative is governed by conditional probability; with complete evidence,\
  \ P(B|A) becomes 0 or 1 and the conditional becomes either trivially acceptable\
  \ or unacceptable; whereas the counterfactual still has substantive content). Actually\
  \ that IS a construction: with a fully-informed speaker, \"If Oswald didn't shoot\
  \ Kennedy, someone else did\" — hmm. Consider: full knowledge that Oswald shot Kennedy.\
  \ Then the indicative conditional \"If Oswald didn't shoot Kennedy, ...\" is unassertable/vacuous\
  \ for the informed speaker (probability zero antecedent), whereas the counterfactual\
  \ retains a determinate truth value. That's the standard asymmetry and is not deep.\
  \ A design task could be to make the *reverse* hold... hmm, hard.\n\nBetter indicative/counterfactual\
  \ design task: a case that discriminates between two *theories* of counterfactuals\
  \ (Lewis similarity vs. a probabilistic/causal-models approach à la Hiddleston/Woodward)\
  \ while holding the indicative fixed — or a case where \"If A had been the case,\
  \ B would have been\" is false but \"If A had been the case, B might have been\"\
  \ is true, and a third where both are true... That's standard.\n\nI'll go with either\
  \ Plato or goal misgeneralization. Let me think about which produces a better *dataset\
  \ prompt* — meaning: does it elicit a discriminating, high-quality answer, and is\
  \ the answer checkable?\n\nThe Plato one has a real risk: if the model doesn't know\
  \ the Laws, and my paraphrase supplies the argument, then the answer becomes \"\
  reason about the given premises\" — which is fine and actually good (it tests conceptual\
  \ reasoning, not recall). The risk of the model fabricating Plato details is reduced\
  \ if I tell it to work only from the paraphrase given and to flag any further claims\
  \ about the text as uncertain. Hmm, but a formal polished prompt can include: \"\
  Work from the argument as I've summarized it; if you believe the text says something\
  \ different, note it rather than silently revising my summary.\"\n\nThe goal misgeneralization\
  \ one: risk is the model regurgitates definitions (which the prompt asks for anyway\
  \ in the demonstration part) and builds a shallow analogy. The design constraints\
  \ (capability-preserving, robust in training, not reward hacking, non-ML) make it\
  \ checkable.\n\nI think I'll do the Plato one, because it's the most distinctive\
  \ and best fits \"inject niche ideas,\" and combine it with the *thought experiment*\
  \ type. Actually — wait. Let me reconsider: the procedure type with Plato might\
  \ be even better and less likely to devolve into a literature essay. Hmm. \"Turn\
  \ a principle into a procedure a practitioner can follow\" — the principle is the\
  \ Athenian Stranger's thesis that supervised exposure to pleasure-inducing states\
  \ trains self-control. The practitioner: someone who runs, say, an ethics/resilience\
  \ program. But the honest answer is that the procedure can't be faithfully implemented\
  \ because wine's effects are not the right kind of exposure... which makes the deliverable\
  \ weird.\n\nActually here's a cleaner procedure framing that's genuinely interesting\
  \ and self-contained: you're advising a body that must decide whether to fund/authorize\
  \ \"controlled exposure\" programs — e.g., a police academy that proposes to train\
  \ officers' resistance to the temptations of discretionary power by giving them\
  \ supervised, temporary, real discretionary power with no oversight (a \"symposium\"\
  \ model), or a program that exposes people to addictive substances in controlled\
  \ settings (the Dutch/Portuguese-style supervised consumption sites, or the \"responsible\
  \ drinking education\" model). The practitioner needs a procedure: when does supervised\
  \ exposure to a temptation build resistance, and when does it build tolerance/appetite?\
  \ That is basically the empirical/philosophical question Plato raises, and a procedure\
  \ would need to encode: dose, voluntariness, presence of a competent leader, the\
  \ reflective component (does the trainee form the right beliefs during the exposure?),\
  \ reversibility, whether the exposure state resembles the target state, and stopping\
