  Draft:


  ---


  I''m in a comparative philosophy seminar and for next week each of us has to hand
  in our own "position card" on a topic so the rest of the group can attack it. Mine
  is Zhuangzi on death. I''ve been sitting with this for a couple months and I think
  my set is defensible, but a friend who does a lot more Chinese philosophy than me
  said, half joking, "you can''t hold three and four at the same time," and then wouldn''t
  explain, which is infuriating. Here''s the card, roughly:


  1. The drumming-on-the-basin episode isn''t Zhuangzi bragging about being unmoved.
  In the passage he says something to the effect that when his wife first died he
  was as affected as anyone, and what he criticizes afterwards is the continued wailing.
  So the target is a belief about death, not the first pang of loss.

  2. The belief he''s attacking is that death takes something away from a me that
  persists. His alternative is the transformation picture: the thing that''s now alive
  went through stages before life — an undifferentiated something, then breath/qi,
  then form, then life — and death is just the next turn, like winter giving way to
  spring. Nothing is lost in the sense the wailing assumes, so wailing is a category
  error about what happened.

  3. But I also think Zhuangzi is not just neutral about death. In the story where
  he finds a skull by the road, sleeps on it as a pillow, and dreams of it, the skull
  describes the dead as having no lord above and no minister below, no business of
  the four seasons, and says that even the joy of a king on his throne isn''t better.
  When Zhuangzi offers to get a god to give it back its body and send it home to its
  parents and wife, the skull scowls and refuses. I read that as Zhuangzi''s own considered
  view: death is better than life, not merely not-worse. That''s what makes his calm
  something more than clenched-jaw stoicism.

  4. At the same time I want to insist he''s a skeptic in a strong sense. The line
  about not knowing whether loving life is a mistake, or whether fearing death is
  like a child who got lost young and forgot the way home, and the butterfly passage,
  are there to show that we simply can''t know what it''s like on the other side.
  He isn''t committed to positive claims about death.

  5. I take the whole enterprise to be therapeutic rather than doctrinal. The question
  to ask of any of his remarks about death is whether it loosens the grip of the fear,
  not whether it''s true. He''d be fine with using a claim he wouldn''t defend.

  6. And I don''t think he''s indifferent to surviving. Half the book is about keeping
  your life intact: the tree that''s spared because its wood is useless, the butcher
  whose blade never dulls because he goes through the gaps, the general business of
  nourishing life and not getting yourself consumed by other people''s projects. So
  the calm about death comes with a real preference for staying alive.


  Also, one thing I want you to check separately: people keep telling me 1 and 2 are
  inconsistent, on the grounds that if you really believed the transformation story
  you wouldn''t feel anything at all, so the first pang shows he doesn''t believe
  it either. My answer is that a pang is a reflex, not a judgment, and 2 is about
  judgments. Is that enough to kill the objection or is there something to it?


  Go through the card and tell me which pairs genuinely pull against each other and
  how badly — rank the real ones by severity, don''t just list everything as equally
  urgent — and for each, what the cheapest revision is and what it costs me. Then
  tell me which single change to the card would resolve the most trouble overall.
  I''d also like you to be clear about where you''re stating something that''s actually
  settled among people who work on this text versus where you''re taking a side in
  a live scholarly disagreement; I''ve been burned by people presenting one reading
  as "what Zhuangzi obviously means." If you end up agreeing with my friend, say so
