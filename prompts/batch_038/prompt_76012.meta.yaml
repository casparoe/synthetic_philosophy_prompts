  The Where and When of Consciousness in the Brain" (Behavioral and Brain Sciences).
  Color phi: two discs, one red one green, at opposite sides, flashed with short asynchrony
  (e.g., 100ms, 1 degree apart); subjects report a single disc moving and changing
  color midway, even though no green disc was on screen at the midway point until
  later. Two models:


  - Orwellian revision: the subject really did have the veridical experience (red
  disc stationary, then green disc appears) but later a revision process overwrites
  the memory trace, so at report time the subject misremembers. Consciousness is veridical
  at the time; memory is edited. Named after Orwell''s rewriting of history.

  - Stalinesque revision: the brain delays the "moment of consciousness" until enough
  information arrives (the second flash), and then composes the whole moving-color-changing
  experience in one go, delivering it to consciousness after the fact; no revision
  of a prior experience, just a delayed show. Named after Stalinist show trials /
  staging.


  Dennett & Kinsbourne argue the two are empirically indistinguishable in principle
  (for the phi case) and that the choice between them is not an empirical matter but
  reflects background assumptions; they favor Stalinesque-ish "multiple drafts" but
  the deeper claim is that the "when" of consciousness isn''t a well-posed question
  in the way the Cartesian theater assumes.


  Now the slogan "your brain edits the tape" / "your brain rewrites history": under
  Orwellian it literally is rewriting memory; under Stalinesque nothing gets rewritten
  because the earlier experience never existed. So the slogan is ambiguous between
  (a) experiences occur with delay and are composed from later info, (b) experiences
  occur veridically and in time but memories get overwritten, (c) reports are constructed
  and there''s no fact about the intervening experience at all (multiple drafts),
  (d) mere neural latency, ~80 ms of transmission/processing delay, which is philosophically
  inert.


