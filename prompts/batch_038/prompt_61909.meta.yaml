  **Authority Without Survival**


  The literature on advance directives has settled into a familiar shape. A competent
  person records, at t1, that she does not wish to receive a specified treatment should
  she later reach a specified condition. At t2 she is in that condition, lacks capacity
  to decide, and shows no sign of distress — she may even seem contented. The question
  is whether t1 or t2 speaks for her. The dominant way of answering it is to ask whose
  interests are at stake: Ronald Dworkin''s answer is that a person has both experiential
  interests, in how her life feels from the inside, and critical interests, in its
  being the life she judges worth having as a whole, and that the latter are the ones
  that make a life good rather than merely pleasant; so the directive, which expresses
  critical interests formed when she could form them, governs. Rebecca Dresser''s
  answer is that the patient in front of us has a welfare now, that it is the only
  welfare anyone can act upon, and that a document composed by someone who could not
  imagine her present condition cannot outweigh it. Both sides accept the framing.
  They disagree about the weights.


  My suggestion is that the framing conceals the difficulty rather than resolving
  it, and that once we replace it, several standard results come out in an unfamiliar
  order. The thing the directive settles is not whose interests count but who is in
  a position to answer the question the directive answers. Authority, on the account
  I want to defend, tracks epistemic position: the earlier self binds the later self
  not because it is numerically identical to it, nor because autonomy has a peculiar
  forward-reaching grip, but because at t1 the patient is the only available person
  competent to evaluate a whole life prospectively, and at t2 no one is. ...


  Then define "diachronic evaluation": the capacity to hold together, in a single
  judgement, what a life has been, what it is now, and what it will be, and to rank
  outcomes by whether they belong in that life. That is what the directive-type decision
  requires. And dementia removes precisely it, while leaving intact a considerable
  capacity for present enjoyment. So the later self''s contentment is real but beside
  the point: it is an answer to a different question.


  Then the surprising ordering. If authority tracks epistemic position, then the strength
  of a directive varies inversely with how much evaluative capacity the patient retains
  — which is the reverse of the intuitive gradient. Most people, I think, feel that
  a directive is most troubling when it binds a patient who still seems to be there,
  and least troubling when it binds a patient who has wholly gone. My account says
  the opposite...


  Case 1: nephrologist — 58-year-old renal physician, wrote directive refusing dialysis
  and refusing treatment for pneumonia in advanced dementia, having nursed her mother
  through it. At 79, moderate-to-severe dementia, presents with urosepsis and acute
  kidney injury; the question is dialysis. She is comfortable, hums along to the radio,
  recognises her husband intermittently. Her husband says: she wrote that after her
  mother died; it wasn''t a judgement about her own life, it was grief; and she is
  not her mother. Two questions: was the document an exercise of diachronic evaluation
  or the deposit of an emotion? and is the husband in a better epistemic position
  now? On my account: the directive is at its strongest, since her capacity for diachronic
  evaluation has largely gone; but the content of the directive matters — a directive
  that records horror rather than judgement fails the epistemic test at the point
  of issue, not at t2. That is: the question is not whether she can evaluate now,
  but whether she was evaluating then. So my account can accommodate the husband''s
  point, but only by adding a condition about the quality of the t1 deliberation,
  which starts to look like an evidential rather than an authority condition. I flag
  this.


  Case 2: faith directive. A woman of strong religious conviction refuses blood products
  and adds a clause saying that the refusal is to hold even if she later loses her
  faith, since she takes her faith to be her truest self and any later loss of it
  to be a failure of hers rather than a change of mind. She survives, loses her faith
  entirely, retains full capacity, and needs a transfusion. On my account her directive
  should count for much less than the nephrologist''s: she is right here, in the epistemic
  position the earlier self occupied, and she disagrees with it. Whereas on the autonomy-based
  account, hers is a paradigm case for enforcement, because the whole point of precedent
  autonomy is to protect a person''s constitutive commitments against her own later
  drift. If my account and the standard account diverge most sharply exactly where
  the standard account is most confident, I need to say whether that is a cost I''m
  willing to pay. I suspect it is, but I have not yet worked out how to argue it rather
  than assert it.


  Reversibility asymmetry. Then the concession. Consider the two errors... Error A:
  honour, she dies, and it turns out the directive rested on a systematic misprediction
  of what the condition would be like from the inside — a well-attested tendency in
  healthy people to overestimate how unbearable disability or cognitive decline will
  be. Error B: override, she lives, and it turns out the directive was right. These
  are not symmetric in the way the decision is made. Error A is a single, unrepeatable
  act against a subject who cannot afterwards be corrected, compensated, or asked;
  Error B is an act against a subject who persists, who can be asked again tomorrow,
  and whose situation admits of revision at every later point. That asymmetry runs
  against my account, since it tells us to prefer the reversible course, which is
  the course that overrides. I want to resist this only partly. Where the patient
  has retained diachronic evaluative capacity, the asymmetry is decisive and the directive
  should function as a strong default that the present self may revoke without having
  to argue her way out of it. Where she has not, the asymmetry loses its purchase,
  because there is no longer anyone whose standing to re-decide is being preserved:
  the reversibility of the decision is worthless to a subject who cannot use it. So
  the asymmetry does not undermine the account so much as mark its boundary.


  Conclusion: authority transfers with the capacity for diachronic evaluation. It
  is not inherited through identity, and it is not lost merely because values change;
  it is lost when the capacity to hold a whole life in view is lost — and only then
  does the earlier self get to decide. On the reductionist view of personal identity,
  this has the pleasing consequence that the account needs no metaphysics: it does
  not matter whether the t2 patient is the same person, only whether anyone present
  can do the evaluating.


