  I''m three years into a translation studies PhD and our workshop has this artifact
  I''ve become increasingly suspicious of. Everyone in the group translates the same
  source poem — this term it''s a short rhymed French Renaissance epigram, very short
  lines, the kind where the rhyme scheme is doing a lot of work — and then we score
  each draft on a grid: content fidelity (0–5), form fidelity (0–5: meter, rhyme scheme,
  stanza shape, line length), target-language poemness (0–5: does it read as a poem
  in English and not like a decoded foreign text), and economy (0–5: did you pull
  it off without padding, without prose-y expansion, without leaning on compensations
  outside the line). Sum them, sometimes weighted, and the top total gets the slot
  in the department anthology. Nobody designed the grid deliberately; it just accumulated.


  I want you to reconstruct what theory of the poem this practice presupposes, and
  I want you to be specific rather than gesturing at ''fidelity is complicated.''
  Does the additive structure commit us to the view that a poem is a bundle of separable
  features, such that you can be down two points on form and earn them back on content
  — i.e. that form and content are commensurable, at least at the level of the score?
  Does ''poemness'' as a separate axis presuppose that there''s a language-general
  property a text can have that isn''t reducible to the other three? And does ''economy''
  presuppose that a translation is a transfer under a conservation constraint — that
  there''s a fixed budget of poem that gets distributed, so padding is a kind of counterfeiting?


  Then the bit that actually bugs me, because the grid is inconsistent here and I
  can''t tell whether the inconsistency is in the grid or in me: we happily allow
  compensation for form. If you lose a rhyme in line 3 you can pick it up in line
  6, and the form-fidelity score treats the poem as a total count of formal features,
  position-insensitive. But nobody would accept the same move for content — you can''t
  drop an image in the source and add a different, prettier one later to balance the
  books; that gets scored as a miss twice over. So form is treated as fungible across
  the poem and content is treated as locally anchored. What view of meaning licenses
  that asymmetry? Is there a theory on which rhyme really is a mobile quantity while
  imagery is fixed to its place, or is the grid just quietly ranking the two axes
  by a habit nobody''s examined?


  Related: when the source rhymes two words that are semantically linked — the amour/toujours
