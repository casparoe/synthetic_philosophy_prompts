  Argument draft:


  (1) The value of a commodity is set by the socially necessary labor time it takes
  to make it.

  (2) Labor-power is a commodity like any other, so in a competitive market it sells
  at its value: the labor time needed to keep the worker alive, trained, and replaced.

  (3) What the capitalist buys is the use of that labor-power for a stretch of time,
  and its use-value happens to be creating value; a worker can add more value in a
  day than a day of labor-power costs.

  (4) So even in the cleanest possible capitalism — every contract at exactly value,
  no fraud, no monopoly, no state violence, workers free to walk and free to pick
  any of a hundred employers — the capitalist ends the day holding value that the
  worker produced and the capitalist didn''t.

  (5) Getting hold of the product of someone else''s labor without handing back an
  equivalent is exploitation, whether or not the taker is pleasant, legally entitled,
  or the giver willing.

  (6) Therefore capitalism is exploitative by its nature, not by accident; you can''t
  fix it with better wages, unions, or nicer bosses, only by ending the wage relation.

  (7) Now apply (5) elsewhere. Marx''s own sketch of the lower phase of communist
  society — the one where he goes after the Gotha program for promising workers the
  undiminished proceeds of their labor — says the total social product has to have
  things taken out of it before anyone gets a share: replacing worn-out machinery,
  funds to expand production, reserves against disasters, administration, schools
  and clinics, support for people who can''t work. So even there the individual producer
  doesn''t receive the full product of his own labor, and the deductions are controlled
  by the collective, not by him.

  (8) By (5), that''s exploitation too: the collective takes the product of the producers''
  labor and doesn''t hand an equivalent back to them as individuals.

  (9) Same again with saving. A worker who lives below his means, buys a machine,
  and thereafter lives partly off what the machine turns out while he sleeps has his
  past labor commanding his present labor. On (5) he exploits himself.

  (10) But self-exploitation isn''t a thing, and a definition of exploitation that
  fires on every society that has ever saved, invested, or planned for next year isn''t
  a critique of capitalism — it''s just a description of time. So either (5) is false,
  or (1)-(6) proves too much and the ideal-case result isn''t the interesting discovery
  it''s supposed to be.


