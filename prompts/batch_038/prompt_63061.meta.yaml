  The argument:


  My friend (an ex-Marxist turned EA-ish quant, or a philosophy grad student) gave
  me this. Let''s write it:


  1. A commodity''s value is the socially necessary labor time required to produce
  it.

  2. Labor-power is itself a commodity, and like any other it sells at its value:
  the labor time needed to reproduce the worker (food, shelter, training, kids to
  replace them).

  3. The use-value of labor-power is that it can create more value than it costs —
  a day''s labor-power might be worth 4 hours of labor time but can be made to work
  8.

  4. So even if every exchange in capitalism is at exactly its value — no fraud, no
  force, perfect competition, workers free to quit and free to choose any employer
  — the capitalist still ends the day holding 4 hours'' worth of value they did not
  produce.

  5. Taking the product of someone else''s labor without giving equivalent in return
  is exploitation, regardless of whether the taker is nice, or the taker is legally
  entitled, or the worker consented.

  6. Therefore capitalism is essentially exploitative, and no reform of the wage relation
  short of abolishing it removes the exploitation.

  7. Now generalize: by (5), the same is true of any arrangement where a group that
  did not perform the labor controls the product of labor — including one where "the
  group" is the workers themselves collectively. In the first phase of communist society
  Marx himself says you have to make deductions before distribution: replacing worn-out
  machinery, funds for expansion, insurance/reserves, administration, schools and
  hospitals, support for those who can''t work. So even there, workers do not get
  the whole product of their labor, and the deductions are controlled collectively
  rather than individually.

  8. By (5) that''s exploitation too — the workers are exploited by the collective,
  i.e., by themselves.

  9. And a worker who saves part of his wage and buys a machine that lets him produce
  more, then lives partly off the machine''s output while he sleeps, is on the same
  footing: his past labor now commands his present labor. Self-exploitation.

  10. But self-exploitation is not a thing. "Exploitation" that applies to every economy
  that has ever had capital, savings, or a future — including a one-person economy
  — isn''t a criticism of anything; it''s just a description of time.

  11. So either (5) is false or the argument proves too much and Marx''s critique
  has no content.


