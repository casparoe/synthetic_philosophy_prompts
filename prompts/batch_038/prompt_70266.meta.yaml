  The thesis sketch: Skolem''s paradox standardly runs: ZFC (if consistent) has a
  countable model; within that model there are sets the model believes are uncountable;
  hence "uncountable" is not absolute between model and metalanguage. Standard deflationary
  response: the model''s quantifiers range over only countably many sets, so the model
  is right that there''s no bijection *inside* it, and there''s no contradiction —
  the lesson is just that first-order languages can''t characterize structures up
  to isomorphism (that''s the Löwenheim–Skolem theorem''s content, not a paradox about
  reference). Putnam''s model-theoretic argument tries to get more: that even an ideal
  theory could be "true" while its terms refer to something unintended, and that the
  paradox bites against a metaphysical realist who wants reference fixed once and
  for all.


  The speaker''s twist (niche injection): They argue that the deflationary response,
  correctly understood, does not rescue metaphysical realism but rather underwrites
  a "height-relativist"/multiverse thesis: for any set-theoretic universe V and any
  cardinal κ in V, there is an extension/perspective in which κ is countable (via
  forcing/collapsing), and this is not an artifact of choosing a countable model but
  a structural feature of set-theoretic reflection. So the countability of a universe
  is perspective-relative, and "the universe of all sets" cannot be a single determinate
  totality. They also claim the Löwenheim–Skolem phenomena generalize: the same argument
  applied to second-order ZFC with Henkin semantics fails to restore absoluteness
  because Henkin semantics is already first-order in disguise, and full second-order
  semantics buys determinacy at the cost of making the axioms non-axiomatizable and
  the semantics itself set-theoretically loaded (you need a background universe to
  interpret "all subsets"), so the determinacy is parasitic on the very relativity
  it''s supposed to defeat. That''s a nice, defensible, somewhat idiosyncratic position.


