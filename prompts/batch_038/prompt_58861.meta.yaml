  Thesis sketch:

  1. Money-pump arguments have the form: if betterness is cyclic, then there is a
  sequence of costless, individually-preferred trades that leaves the agent strictly
  worse off with the same endowment plus less money; therefore cyclicity is impermissible.

  2. Step (1) requires a "stepwise" or "sure-thing" premise: at each node, the agent
  should accept any trade she prefers given the options she faces, because refusing
  has no cost. That premise is a norm of sequential choice, not a claim about betterness.

  3. The standard rejoinder — a sophisticated agent who foresees the pump should refuse
  the first trade — is question-begging: it imports a diachronic norm (dynamic consistency
  / plan-relative rationality) whose only support is the very intuition the pump argument
  was supposed to vindicate. If the norm''s justification is independent (e.g., dominance),
  the rejoinder works but then the pump argument is redundant; if it isn''t, the rejoinder
  begs the question.

  4. Therefore the pump argument doesn''t establish transitivity of betterness; it
  establishes at most a dilemma: either accept a diachronic norm on independent grounds,
  or accept that the cyclic agent is not irrational but merely pumpable, in the way
  an agent with time-inconsistent preferences (hyperbolic discounting) is pumpable.

  5. Corollary: the interesting question is whether "pumpability" is itself a normative
  defect — and there are cases (a resolute agent who commits to a plan, an agent who
  pays for a commitment device) where being pumpable is the cost of being rational.


