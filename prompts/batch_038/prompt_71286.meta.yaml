  Draft prompt:


  ---


  So — I''ve got a 25-minute slot at an interdisciplinary workshop in about three
  weeks, co-hosted by a law school''s AI center and a CS dept, and I''m kind of dreading
  the Q&A more than the talk. My paper''s thesis is basically this: the well-known
  impossibility results in algorithmic fairness (the ones showing you can''t simultaneously
  have calibration-within-groups, equalized error rates, and independence from group
  membership when base rates differ) get taught and cited as if they established a
  *trade-off*, like fairness is a slider you have to pick a setting on. I argue that''s
  a category mistake. The three families of criteria are properties of different objects
  — some are properties of a score, some of a decision rule, some of the pipeline
  that generates the label in the first place — and once you see that, the theorem
  doesn''t tell you to choose a metric, it tells you that the metric has to attach
  to the *decision*, and that the score can stay calibrated and untouched. So my positive
  proposal is: keep your risk score, and make the allocation rule explicitly group-sensitive,
  chosen by a justification you''d have to defend in public. The impossibility "dissolves"
  for a big class of cases, but only because you''ve now openly endorsed group-based
  differential treatment, which is (a) close to legally radioactive under disparate
  treatment doctrine and (b) something most of the ML people in the room will hear
  as a confession that I''ve smuggled in affirmative action through the back door
  of statistics.


  Room will be maybe 25 people: half ML researchers, two of whom have written papers
  in exactly this literature and are thoroughly bored of hearing the theorems restated
  by non-theorists; one Title VII / employment discrimination scholar; an economist
  who works on statistical discrimination and will care about incentives and about
  what happens to the data once your rule is public; and two people from legal-services/advocacy
  orgs who work on tenant screening and on credit scoring, and who mostly care about
  who ends up paying the cost of whichever error you decide to tolerate. Nobody in
  the room is a philosopher, though they''ve all absorbed some of the vocabulary secondhand.


  Can you build me the prep sheet? I want the eight-ish objections I''ll actually
  get from *this* room — not the generic "but what is fairness, really" ones, and
  not the ones a philosophy audience would raise — ordered by how much damage they''d
  do to my argument, each phrased the way that particular person would phrase it (the
  ML person will talk about base rates and convex hulls and sufficiency, the lawyer
  will talk about intent and business necessity and whether a group-conscious threshold
  is even actionable, the advocacy folks will talk about who eats the false negatives).
  For each: a reply I could actually say out loud in about two minutes, and a frank
  note on where the reply is soft or where I''d be bluffing. Then tell me which two
  or three of these objections are secretly the same objection wearing different vocabulary,
  what I should concede in the first five minutes to defuse the cheap shots, and the
  one reply that absolutely has to land or the whole talk collapses. Finally, give
  me the question I''m praying nobody asks — the one that hits the actual weak point
  — and my best guess at how to survive it anyway.


  Oh, and flag anywhere you think I''ve stated the technical situation wrong, because
  two people in that room will definitely catch it. No need to point me at papers,
  I just want the prep.


