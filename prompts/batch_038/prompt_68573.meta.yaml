  A friend and I lost most of a weekend to an argument about the ethics of a referee
  report, and I would like the argument reconstructed properly, as a dialogue between
  two co-editors. The setup: an early-career researcher has sent them a paper that
  both of them think is bad — not borderline, but built on a central argument they
  agree is unsound. One editor drafts the blunt report: the argument fails, here is
  where it fails, and no, the project does not look salvageable. The other insists
  on the hedged report: warm about the ambition, dense with wondering-whether constructions,
  closing with a suggested alternative direction that neither editor believes in.
  Each thinks the other''s draft would wrong the author.


  Their positions, in brief. The hedger holds that his draft is not a lie — it asserts
  nothing false, and in a community that can read such a report it conveys the verdict
  by a route both parties understand; the blunt draft, meanwhile, buys one person''s
  honesty with another person''s confidence. The bluntness-defender holds that the
  hedged draft is the worse of the two precisely because of its deniability: it leaves
  the author to assemble the bad news herself out of implicatures she may not be able
  to decode, and it lets the writer later protest that he never said any such thing.
  Her principle is that an author has a claim not merely to true sentences but to
  information she can act on.


  Have them work through the three points where my friend and I stalled. First: does
  a community''s shared code for reading politeness as refusal make the hedged report
  non-deceptive, or is that transparency self-undermining, since the code only functions
  while nobody says out loud what it means? Second: is misleading without asserting
  anything false a lesser wrong than lying or a greater one — the direction of that
  comparison kept flipping on us, and I want both editors to take a side and defend
  it. Third: does withholding the verdict protect the author''s autonomy or override
  it, by substituting the editor''s estimate of what she can bear for her own? One
  of them should also press the cross-cultural point — a colleague of mine working
  in Kyoto tells me the same hedged sentences would be read there as a clear and considerate
  refusal and the blunt ones as aggression, so if the moral valence tracks the code,
  the code rather than the literal content must carry the weight — and the other should
