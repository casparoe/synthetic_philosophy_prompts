  1. Presupposing that finks and masks are two names for the same phenomenon / that
  a mask destroys the disposition. False: a fink removes (or would prevent the acquisition
  of) the disposition in the triggering conditions; a mask leaves the disposition
  intact but interferes with the manifestation. Lewis 1997 introduced finks (from
  Martin); Bird 1998 introduced antidotes (for extrinsic masks in the "poison/pills"
  case, e.g., the snake-antidote case: a person who has ingested an antidote is still
  disposed to die from venom, but doesn''t). Choi 2003 discusses masks and argues
  they show even the reformed analysis fails; Manley & Wasserman 2008 respond.


  2. Presupposing that because Lewis''s reformed conditional analysis ("if it were
  to undergo the stimulus, it would retain the property... and manifest") handles
  finks, the debate is over, ignoring masks/antidotes which are not handled by the
  reformed analysis because the mask doesn''t remove the basis.


  3. Presupposing that if the conditional analysis fails, then dispositions aren''t
  real properties (i.e., that the analysis was supposed to reduce dispositions and
  its failure shows nihilism). Actually the standard reading: failure of the conditional
  analysis motivates dispositional realism (powers are irreducible, not analyzable
  in terms of counterfactuals) — Molnar, Bird, Mumford, Vetter, Jacobs. So someone
  who says "finks and masks show that talk of dispositions is eliminable/that everything
  is categorical" has it backwards.


