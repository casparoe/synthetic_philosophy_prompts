  Plausible popularizer summary (a magazine essay or a lecture segment on "the invention
  of tolerance"):

  1. "Montaigne''s essay on the cannibals is the founding text of cultural relativism"
  — overstatement/common framing; contestable.

  2. "His argument is that every people judges by its own customs, so the label ''barbarian''
  means nothing more than ''not us''." — mostly right descriptively (he says each
  calls barbarism whatever is not his own custom... hmm, actually the famous line
