  barbarous or savage in that nation, from what I have been told, but that everything
  is barbarous which is not in use and practice amongst ourselves." Careful — that''s
  a paraphrase; I''ll paraphrase it in the popularizer''s voice without quotes.

  3. Subtle error: "so Montaigne concludes that we have no standing to criticize the
  Tupinambá at all, and indeed he refuses to make any judgments about them" — false:
  he invokes "the rules of reason" as a standard, concedes they are barbarous relative
  to reason but says we exceed them in every kind of barbarity, and he describes their
  warfare and torture practices approvingly and disapprovingly — he does rank.

  4. Second subtle error: "he admires them as uncorrupted children of nature and thus
  becomes the ancestor of the noble savage" — Montaigne does use "natural simplicity"
  language but he also insists they are not simply virtuous innocents; they torture
  prisoners, and he says their practices show "jealousy of valour" etc. Also, the
  popularizer might say he treats them as evidence that non-European peoples are morally
  superior — overstatement.

  5. A conflation: equating Montaigne''s skepticism (judgment suspended, "what do
  I know") with relativism (all customs equally valid). And equating his anti-imperial
  polemic about Spanish atrocities with a general thesis that cross-cultural judgment
  is impossible.

  6. The popularizer''s conclusion: "Montaigne therefore can''t criticize anything,
  which is why his relativism is self-undermining — he criticizes the Europeans by
  the very standard he says doesn''t exist." This is a standard objection presented
  as a refutation, and it depends on the misreading.


