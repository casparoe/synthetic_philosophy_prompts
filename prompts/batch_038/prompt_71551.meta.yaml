  Draft:


  "I retired four years ago after thirty-three years in analytical chemistry, most
  of it spent persuading other people that a mass spectrum meant what I said it meant.
  I have since taken up philosophy of science seriously, and I have reached the point
  where I would like my views examined before I commit them to paper in a short essay
  for a local philosophy society. What follows is my position on underdetermination,
  stated as plainly as I can manage.


  (1) I am a realist about unobservable entities, and the ground of my realism is
  that the predictive success of our theories would be inexplicable otherwise. Electrons
  are not a useful fiction that happens to sort mass spectra correctly; their doing
  so is evidence that there are such things.


  (2) I accept that no single hypothesis is ever tested alone. What an experiment
  confronts is a bundle: the hypothesis of interest, the theory of the instrument,
  calibration assumptions, sample-handling assumptions, and a good deal else. In my
  own practice this was a daily reality rather than a philosophical thesis.


  (3) I nonetheless hold that underdetermination is global and standing: for any theory,
  whatever the evidence, an incompatible rival could be constructed that accounts
  for all of it. I take this to be a conceptual feature of the relation between theory
  and evidence, not a finding about particular pairs of theories that someone has
  actually written down.


  (4) I also hold — and this is the part I regard as my own contribution, such as
  it is — that "empirical equivalence" is never a determinate two-place relation between
  theories. Two theories are equivalent only relative to a specification of what counts
  as an observation, and different specifications make different pairs equivalent.
  Since nobody has ever supplied an absolute observation-scheme, I conclude that the
  global thesis in (3) has never actually been exhibited, only assumed, and that the
  debate is a pseudo-problem in much the way I suspect the old question about whether
  space is really Euclidean was.


  (5) I think simplicity, unifying scope, and conservatism are genuine tie-breakers
  between theories, and that a scientist who disregards them is making an epistemic
  error and not merely expressing a taste.


  (6) I want to maintain all of this without conceding anything to instrumentalism.
  My theories are literally true or false, and the virtues in (5) track something
  about the world rather than about our comfort.


  (7) Finally, I think there is a principled difference between legitimate auxiliary
  adjustment and ad hoc rescue — the difference between a fix that is independently
  checkable and one that is merely protective — and that this difference can be stated
  without appealing to hindsight about how the episode turned out.


  Please audit this set. Tell me which pairs genuinely cannot all be held, which only
  appear to conflict and dissolve on inspection, and, for each real conflict, what
  would have to be surrendered and at what cost. Rank the conflicts by severity rather
  than presenting them as equally damaging, and conclude by identifying the single
  revision that would buy me the most consistency for the least loss. I would rather
  be told where I have cheated myself than be reassured."


