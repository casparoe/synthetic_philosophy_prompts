  and Williams responds that blame isn''t a matter of the existence of reasons — blaming
  someone for φ-ing whom we think had a reason... Actually Williams''s discussion:
  the external reason theorist appeals to the fact that we blame people for actions
  they had no (internal) reason to do. Williams says that blaming doesn''t imply the
  truth of an external reason statement; rather, blaming involves a "practice" whose
  point is to influence, and there''s an illusion that blame requires reasons. Also
  there''s the discussion of "irrational" — Williams distinguishes: the agent who
  lacks a reason isn''t necessarily irrational; but if there''s a sound deliberative
  route... hmm.


  McDowell''s reply ("Might There Be External Reasons?", 1979, in Rational Action
  ed. Ross Harrison): McDowell accepts much of Williams''s framework but argues that
  Williams''s notion of a "sound deliberative route" is too narrow. McDowell suggests
  that a person''s S can be altered by rational deliberation itself in ways Williams
  doesn''t allow — for instance, through the exercise of "practical insight" (phronesis-like
  capacity), whereby coming to see that something is required can itself produce a
  motivation. So McDowell says: if we allow that a sound deliberative route may include
  the formation of new motivations through rational insight, then the external reason
  theorist''s claims can be true after all — because what makes them true is that
  the agent would be motivated if she exercised practical insight. McDowell thus preserves
  a form of internalism while vindicating external-sounding reason claims. He also
  discusses Williams''s argument that the external theorist cannot explain what would
  make external reason statements true, and suggests the explanation is via "a capacity
  for practical insight" analogous to perceptual capacity.


