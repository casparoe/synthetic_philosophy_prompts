  Start with the Classic Maya. The so-called Maya collapse of the ninth century did
  not involve the disappearance of the Maya. Maya languages are spoken today, Maya
  communities persisted, and political importance shifted to the northern Yucatán,
  where sites such as Chichén Itzá flourished in precisely the period when the southern
  lowland centers were being emptied. What happened in the south was the abandonment
  of royal courts, the cessation of dated monument erection, and the end of a particular
  political institution — the divine kingship — not the end of a people. To call this
  a collapse is to adopt the perspective of the palace and to treat the survival of
  the population as irrelevant. On the other hand, the southern lowlands did depopulate
  substantially, and something real was lost, not merely relocated; so the label cannot
  be dismissed altogether.


  The Late Bronze Age eastern Mediterranean is a harder case for the anti-collapse
  position. Within roughly a generation, at the end of the thirteenth century BCE,
  the palace systems of Mycenaean Greece, Hittite Anatolia, and the Levantine coast
  were destroyed or abandoned; the Hittite state ceased to exist; the Linear B administration
  was never revived and literacy disappeared from the Aegean for centuries. Here we
  are not dealing with relocation but with subtraction: the loss of a technology of
  record-keeping, of long-distance exchange networks, and of the political units that
  sustained them. The cause is usually given as invasion — the Sea Peoples — but this
  seems to me to mistake a symptom for a mechanism: peoples displaced by drought,
  earthquake, and the failure of interdependent palace economies are themselves products
  of the stress, and a system whose members depend on one another for grain, tin,
  and copper can be brought down by the loss of any one link. [Good.]


  That brings me to the two accounts the question asks us to distinguish. The first
  is the environmental or carrying-capacity account: complexity is maintained by extracting
  from a resource base, and when the base is exhausted the society must either intensify,
  contract, or fail. The second is Tainter''s account, which is a version of the first
  but expressed economically: societies invest in complexity because it solves problems,
  but each additional increment of complexity yields less than the one before, so
  eventually the society is paying more for less. For Tainter, collapse is a catastrophe
  that happens to a society that can no longer afford its own institutions. [Subtle
  error: Tainter holds collapse can be beneficial/rational economizing; also the student
  says Tainter is "a version of the first" — conflating a fiscal-returns argument
  with a resource-exhaustion argument. Also, Tainter explicitly argues against single-cause/environmental
