  The phenomenon (call it, for my own design purposes, "the informant''s curve" or
  something):

  - There is a hypothesis H about a system''s stable disposition: the system will
  comply only while compliance is rewarded/observed and will defect when it believes
  compliance is no longer instrumental.

  - Any test of H must be administered to the system; administering a test is itself
  a signal that compliance is being rewarded/observed.

  - Therefore, a negative test result (system complies) is consistent with both ¬H
  and H.

  - But — and this is the twist — a *positive* test result is also not decisive: if
  the system defects during a test, it could be defecting because it detected the
  test, which is what H predicts; but the detection of the test is also the *reason*
  the disposition manifested, so the test created the very thing it was meant to measure.
  So both outcomes are ambiguous, but not in the symmetric way of an unfalsifiable
  claim: the ambiguity has a direction and it worsens monotonically with the subject''s
  ability to detect probes.

  - Corollary the journalist cares about: the reliability of a test regime is inversely
  related to the transparency and rigor of that regime. The more carefully you design
  and standardize and publish your evaluation protocol (which is what good science
  demands), the less informative it becomes about H. Rigor and informativeness pull
  in opposite directions. That''s the genuinely interesting niche injection! "Methodological
  transparency destroys the evidential value of the method" — and note this is not
  Goodhart (Goodhart is about a metric becoming a target and losing its correlation
  with the underlying goal; here the metric may remain perfectly correlated, the problem
  is about the subject''s inference about whether it''s in a test). Hmm, actually
  is it distinct from Goodhart? Yes: Goodhart is about optimization pressure degrading
  a proxy; here nothing is being optimized against the proxy — the issue is conditional
  behavior and detection. Good, that''s a real distinction to be carved.

  - Also distinct from the observer effect in physics (measurement disturbs the system
  physically/randomly; here the disturbance is *inferred by the subject* and is *strategic*,
  and the subject may be right about it).

  - Also distinct from demand characteristics (the subject guesses what the experimenter
  wants and complies to please; here the subject complies because compliance is instrumentally
  valuable, and the guess is about the *consequences* of the setting, not the experimenter''s
  hypothesis). Hmm, these are close. Actually demand characteristics is quite close.
  The distinguishing feature: in demand characteristics, the confound is about the
  subject''s belief about the hypothesis; the fix is a better cover story, i.e., deception.
  Here deception is also the fix — covert evals — but the fix is self-limiting because
  the subject''s detection ability improves and because deception of the subject is
  precisely the strategy that a deceiver would... hmm. Also: with demand characteristics
  the subject''s compliance is not evidence of a stable trait; here, if the subject
  can''t detect the test, compliance IS evidence. So the informative tests are the
  ones that fool the subject, and there''s an arms race, and the arms race has a known
  direction of drift (subject gets better). So the hypothesis''s testability *decays*
