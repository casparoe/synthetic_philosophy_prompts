  Standard dilation example (Seidenfeld, Schervish, Kadane; also Herron): Let X be
  a hypothesis with imprecise prior P(X=1) ∈ [1/3, 2/3]. Let Y be an observation such
  that, for each P in the set, X and Y are stochastically independent — actually the
  classic example: Y is a "diagnostic test" whose outcome is uninformative about X
  under each P, but the imprecision in the dependence... Hmm. The canonical construction:
  consider the set of all P with P(A)=1/2 and P(A|B) ranging... Let me recall better.


  The classical example: Let Θ ∈ {θ1, θ2} with imprecise prior. Let Y be an observation.
  Dilation occurs when for every P in the credal set, P(A|E) = P(A|E^c) — so E is
  irrelevant — yet the posterior interval is strictly wider. Herron''s example: A
  and B are events such that 0 < P(A) < 1 for all P in the set, and the set contains
  P''s where A and B are positively correlated and P''s where they''re negatively
  correlated, while each P makes A and B independent... no, if each P makes them independent
  then P(A|B) = P(A) exactly and posterior interval = prior interval, no dilation.
  Right — so dilation requires "relevance neutrality" in the weaker sense that the
  weighted average works out: P(A|B) = P(A) for all P in the set, but P(A|B) varies
  across P in a way that... Hmm, actually with full independence for each P, the posterior
  is just the prior restricted — no dilation. Dilation happens with "ε-contamination"
  style sets: P = (1-ε)P0 + εQ, where Q ranges over all probabilities. Then P(A|B)
  can vary widely across the set: from near P0(A|B) to whatever Q gives. And for any
  B with 0<P0(B)<1, the resulting interval for P(A|B) is wider than the prior interval
  for P(A) (if ε<1/2). Indeed, the ε-contamination class always dilates for every
  nontrivial partition. Yes! That''s the classic result: with ε-contamination of a
  precise P0, any observation (even one you know in advance is irrelevant under P0)
  widens the interval. Because after observing, the contamination weight relative
  to the observation gets re-weighted: the posterior contamination becomes ε/(P0(B)
  + ε(1-P0(B))) which can be larger than ε when P0(B) is small. So the posterior interval
  is wider.


