  This is a real, checkable phenomenon. Let me be careful about accuracy. ε-contamination:
  C = {(1-ε)P0 + εQ : Q any probability on the space}. Prior on event A: interval
  [(1-ε)P0(A), (1-ε)P0(A) + ε]. Posterior after observing B (with 0<P0(B)<1): the
  weights become (1-ε)P0(B) vs ε Q(B); Q(B) can range from 0 to 1. Extremizing: to
  maximize posterior P(A|B) = [(1-ε)P0(A∩B) + ε Q(A∩B)] / [(1-ε)P0(B) + ε Q(B)]. Take
  Q concentrated on A∩B: then numerator ε, denominator (1-ε)P0(B) + ε. So sup = ε/[(1-ε)P0(B)+ε],
  which exceeds (1-ε)P0(A)+ε if... For small P0(B), this is close to 1. And inf: take
  Q concentrated on A^c ∩ B: posterior = (1-ε)P0(A∩B)/[(1-ε)P0(B) + ε] = (1-ε)P0(A|B)P0(B)/[(1-ε)P0(B)+ε],
  which is smaller than (1-ε)P0(A). So yes, dilation: the posterior interval strictly
  contains (and is wider than) the prior interval, provided ε > 0 and 0<P0(B)<1. And
  if the observation B is independent of A under P0, then prior and posterior intervals
  both... well, the posterior is wider. So the "irrelevant" observation still dilates.
  Perfect.


