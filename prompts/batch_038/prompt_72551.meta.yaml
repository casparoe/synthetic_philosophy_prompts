  Derrida, Mal d''archive / Archive Fever (1995; English 1996, trans. Eric Prenowitz):
  archive derives from arkheion, the house of the archon; archons have the power of
  consignation — gathering signs together, coordinating a corpus so that elements
  articulate a unity, an "ideal configuration"; the archive has both a commencement
  (arkhē) and a commandment; and "there is no archive fever without the threat of
  this forgetting, of this archive''s death" — the death drive / the archive''s destructibility.
  Also the claim that the technical structure of the archiving archive determines
  the structure of the archivable content and its relation to the future. That''s
  solid. Carolyn Steedman''s Dust: The Archive and Cultural History (2001): the archive
  as a place of desire, the "archival subject," the Dust of title (Egyptian dust inhaled
  by those working the archives; and dust as the remains of the dead). Steedman''s
  argument: the archive produces not knowledge but a longing; the historian is a figure
  of modern interiority; the "archive effect." Also her critique of Derrida in the
  essay "Something She Called a Fever" (2001/2002) — Steedman''s essay is literally
  titled "Something She Called a Fever: Michelet, Derrida, and Dust," published in
  AHR 2001, later a chapter in Dust. That''s a nice in-the-weeds detail: Steedman
  criticizes Derrida for never having been in an archive, treating it as metaphor
  rather than a place with a door, a cloakroom, dust. That''s a good hook — and I''m
  confident about it.


