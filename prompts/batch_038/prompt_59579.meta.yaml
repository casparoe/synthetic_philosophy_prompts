  The two-bitser argument''s deep point: the physical states of a computer are not
  intrinsically about anything; their aboutness is a matter of how we interpret them,
  and the same state could be interpreted many ways. Dennett says that''s fine — all
  intentionality is like that, even ours (the intentional stance is a tool, and beliefs
  are "patterns" real enough). Searle says no — if interpretation is up to outside
  observers, then there''s no fact about whether the system has genuine beliefs, and
  the observer-relative nature means nothing is really "about" anything. Then there''s
  the "wall implements any program" reductio (Searle) and the response that implementing
  a program requires causal/counterfactual structure (Chalmers, "Does a Rock Implement
  Every Finite-State Automaton?"), Copeland, and the requirement of reliable mapping
  and counterfactuals.


