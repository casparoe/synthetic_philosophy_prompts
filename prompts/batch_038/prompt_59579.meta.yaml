  Better Humean work: "Groundhog Day" — Phil Connors in a loop where the same day
  repeats. A Humean about laws: the regularities of the loop are just the pattern;
  there''s no necessity. Phil tests hypotheses (drops the toast, the alarm clock,
  drives off the cliff). Actually Groundhog Day is a fantastic case for the *problem
  of induction* and for Humeanism: Phil accumulates regularities without any explanation,
  and there''s no lawlike necessitation — the loop''s rules are, e.g., he can''t leave
  Punxsutawney (the blizzard), but he can''t figure out why it ends. Also: does the
  loop have laws? He performs experiments (the alarm clock always at 6:00, the same
  radio banter). And crucially the loop''s regularities aren''t derivable from a Humean
  mosaic in the normal sense — actually they are: the mosaic is the repeated day,
  and the best system would be extremely simple! That''s a lovely point: Groundhog
  Day''s mosaic maximally satisfies the simplicity/strength trade-off — the whole
  day repeats, so the best system is trivially simple and predicts everything. Yet
  we''d say nothing *necessitates* the repetition, and Phil''s inability to explain
  it feels like the absence of law. And anti-Humeans would say: the loop shows Humeanism
  can''t distinguish a lawlike repeat from a brute repeat. Hmm, but they are the same
  thing under Humeanism — that''s the point. Also relevant: Phil''s counterfactual
  reasoning — he learns what would happen if he did X, and the loop *does* support
  counterfactuals (the piano lessons persist? no, his skills persist across resets
  — that''s a violation of the mosaic resetting). Actually interesting: Phil retains
  memories and skills while the world resets — so the "mosaic" isn''t just the repeated
  day; there''s a persisting Phil.


