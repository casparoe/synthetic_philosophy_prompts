  Now let me design the questions (layered, interpretive, hard):


  1. The necessity/accident vocabulary: Engels says societies "are governed by necessity,
  which is supplemented by and appears under the forms of accident." What is the relation
  he''s proposing — is accident a mere epistemic appearance of necessity, or a real
  second factor? And does "supplemented by" differ from "appears under the forms of"?
  Two readings; what turns on it.


  2. The substitution claim: "cut him out and there will be a demand for a substitute,
  and this substitute will be found, good or bad, but in the long run he will be found."
  Is this a counterfactual claim (a modal/metaphysical claim about nearby worlds),
  or an inductive generalization from a list of cases (Caesar, Augustus, Cromwell)?
  Note the "proof" offered is just an enumeration — what kind of argument is that,
  and is it circular given the definition of "necessary"? Also: what is doing the
  work in "in the long run" and "good or bad" — these seem to be escape hatches that
  make the thesis unfalsifiable; ask the model to say whether it can be rendered falsifiable
  while retaining its content.


  3. The functional-role reading: does Engels actually allow great men causal efficacy
  (they fill a role) while denying them uniqueness? I.e., type vs token: the role
  is necessary, the occupant is accidental. Ask whether the passage is really denying
  Great Man theory or only one version of it — and what a historian would have to
  show to refute it.


