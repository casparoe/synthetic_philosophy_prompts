  Point 1: Transitivity principle + regress: a state is conscious iff appropriately
  represented by another state; that other state''s own consciousness would require
  a third. Rosenthal: HOTs are themselves nonconscious, so no regress — but then the
  theory needs to explain how a nonconscious state makes something it-is-like-something.


  Point 2: Misrepresentation problem (Brown 2015): if HOTs can misrepresent, there
