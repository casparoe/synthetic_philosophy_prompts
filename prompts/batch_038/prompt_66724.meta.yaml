  Exam question (Philosophy of Mind, second-year/MA, 90-minute final, one essay question
  from a list; 25 marks):


  "Rosenthal''s higher-order thought theory is often said to rest on the transitivity
  principle. State that principle and explain what role it plays in the theory. Then
  explain the misrepresentation objection to higher-order thought theory, and assess
  whether a dispositionalist version of higher-order theory can avoid it."


  Student answer:


  "The transitivity principle says that a mental state is conscious just in case the
  subject is aware of being in that state. Rosenthal uses it to give a reductive account
  of what it is for a state to be conscious: consciousness is not an intrinsic property
  of a state but a relational one, consisting in the state''s being represented by
  a further state of the subject. This is what distinguishes his view from first-order
  representationalism, on which a state is conscious in virtue of representing the
  world in the right way; on Rosenthal''s account, a world-directed representation
  is conscious only if the subject also has a thought to the effect that she is in
  it. The awareness in question is a kind of inner perception: the subject scans her
  own mental states by an internal faculty, much as she scans the world by the external
  senses, and it is this internal monitoring that makes misrepresentation possible
  in the way that perceptual illusion is.


  Two consequences follow, and both are advantages. First, the theory explains why
  conscious states are subjective: there is something it is like to be in a state
  only for a subject who can take herself to be in it. Second, it avoids an infinite
  regress. If a conscious state requires a higher-order thought, one might worry that
  the higher-order thought itself, being a mental state, would require a further one,
  and so on. Rosenthal blocks this by holding that the higher-order thought is itself
  conscious — we have introspective access to it — but that this second-order awareness
  is of a different, non-regressive kind, since the chain terminates in the subject''s
  capacity for self-awareness.


  The most serious objection is the misrepresentation objection. Since the theory
  makes consciousness depend on a representation that is distinct from the state it
  is about, that representation can fail to match its target. It might represent the
  subject as being in a state she is not in — an ''empty'' higher-order thought, as
  when one seems to have a state without having one — or, more worryingly, it might
  arise without any suitable first-order state at all, in which case the theory is
  committed to there being a conscious state that does not exist. Critics press the
  point further: nothing in the theory restricts higher-order thoughts to mental targets,
  so if I came to have a non-inferential thought that my liver was in a certain state,
  the theory would have to say there is something it is like to be my liver. Rosenthal''s
  reply is that the relevant awareness must be caused in the right way by the state
  it is about, but this looks like an admission that the causal relation, not the
  content of the higher-order thought, is doing the explanatory work.


  The dispositionalist alternative, defended by Carruthers, replaces the actual higher-order
  thought with a first-order state that is disposed to cause such a thought. On this
  view, no actual misrepresenting state is required, and so the misrepresentation
  objection simply does not arise: a disposition cannot misfire in the way an actual
  representation can. It also has the consequence that nonhuman animals and prelinguistic
  infants are not conscious, since they lack the conceptual resources to have the
  relevant dispositions — a cost that Carruthers is willing to accept, but which sits
  badly with the theory''s naturalistic ambitions."


