  Draft:


  ---


  I write about science and ideas for a general-interest magazine, and for the past
  year I have been reporting a piece on the question that sits underneath most AI
  coverage: whether a system can genuinely mean something by its own internal states,
  or whether everything it "says" is meaningful only because of what we do with it.
  Reporting the story has led me to a philosophical dispute I had assumed was settled,
  or at least mapped: the exchange between John Searle, who holds that intentionality
  is intrinsic to certain biological systems and cannot be manufactured out of symbol
  manipulation, and Daniel Dennett, who thinks the distinction between original and
  derived intentionality collapses under examination.


  My editor wants the story to be about a live, unresolved disagreement. My own reporting
  keeps suggesting something less clean, and I want a diagnosis rather than a summary.
  [Then describe the positions and the pressure points.]


  Let me lay out what I take the dispute to be, as concretely as I can, and then say
  what I think is going on.


  Searle''s side: intentionality — the aboutness of a thought or perception — is not
  something an outside interpreter confers on a physical state. It is intrinsic to
  certain biological causal processes; syntax, in his sense, is never sufficient for
  semantics. His central support is the thought experiment about a person manipulating
  symbols according to rules in a locked room, and the more general claim that computational
  descriptions are always relative to an observer''s assignment: nothing in the physics
  of a system says it is running this program rather than that one, or indeed any
  program at all.


  Dennett''s side: the case that is supposed to be decisive against original intentionality
  is the "two-bitser," a state in a computer''s circuitry that will be read as a 0
  by one read-head and as a 1 by another, and that can be recruited into further roles
  — a nonsense symbol, a command, a pixel — without changing anything intrinsic about
  it. If the very same physical state can be any number of things depending on the
  machinery and practices surrounding it, then there is no privileged class of states
  whose meaning is not borrowed. Content, on this view, is a matter of a system''s
  dispositional history and of the interpretive framework that makes predictions about
  it work; and there is no bottom level at which aboutness stops being derived.


  What strikes me as odd, and what I cannot resolve: both camps appear to accept the
  same premise about observer-relativity — that a physical state considered in itself
