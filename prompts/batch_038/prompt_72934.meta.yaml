  Draft:


  I am the standards editor at a mid-sized international news service. We file wire
  copy that is picked up by a few hundred small outlets, most of which will print
  our words unchanged, so what we call a thing becomes what their readers call it.
  I have no academic training — I was a copy chief for eleven years before this job
  — and what I know about the concept of genocide I have read on my own over the past
  year, mostly the 1948 Convention and things written about the man who coined the
  term.


  The problem: the word arrives on my desk in two entirely different jobs, and my
  desk can no longer tell them apart. One job is legal — there is a treaty definition,
  courts apply it, and there is a fact of the matter about whether a given finding
  has been made. The other job is the strongest word our language has for the worst
  thing one group can do to another, and readers, survivors, governments and advocacy
  groups all hear it in that sense. I suspect those two jobs came apart a long time
  ago and that almost every fight we have is really about which one a sentence is
  doing. I have been trying to write the rule down and I keep failing.


  Here is where I got to before I gave up. My draft rule is: we may print the word
  only if the same story could carry, without hedging, a sentence naming the protected
  group being destroyed and the act being done to it — and if we cannot write that
  sentence, we do not have a genocide story, we have an atrocity story. Four things
  bother me about my own rule and I would like you to deal with each:


  (a) Everyone tells me "in whole or in part" saves the definition from requiring
  a completed extermination, but nobody can tell me how large the part has to be,
  and my reading is that the treaty does not say and the courts have had to fill the
  gap. If the threshold is a judicial judgment, my rule is asking reporters to make
  a judgment they are not qualified to make.


  (b) The Convention''s list of groups omits political ones, and I have read that
  this was a compromise reached in 1948. If so, the vocabulary available to us in
  some of the worst stories of the last seventy years is being set by a bargaining
  position taken by states that no longer exist.


  (c) The man who invented the word seems to have meant something wider by it — including
  the destruction of a group''s language, institutions, monuments and capacity to
  go on being a group — and the treaty ended up narrower. We file a great many stories
  where the killing is disputed but the dismantling of the group''s means of continuing
  is not, and I have no word for that.


  (d) If naming something genocide is supposed to trigger obligations in somebody,
  then declining to name it is also an act with consequences, and I do not want a
  procedure that lets my desk hide behind a definition while a story runs for months.


  What I want from you: act as a philosopher of law with a working knowledge of international
  criminal law and of the conceptual literature on genocide — someone who has thought
