  Draft:


  "I write a column on science and ideas for a general-interest magazine, and I''m
  preparing a piece on how much a large language model can be said to know when its
  answers fail. The researcher I interviewed most recently offered an image he leans
  on hard, and I want to know how much weight it will bear before I print it.


  His line: the model''s knowledge is dispositional, and a disposition is like a program
  sitting on disk that isn''t currently running. The code is all there, inert, doing
  nothing at all; the right input is the call that executes it; an execution error
  usually means you called it with the wrong arguments. So a wrong answer on a benchmark
  is evidence about the prompt, not about what is stored. He uses this to conclude
  that behavioral evaluation systematically understates what these systems know, and
  that ''the model can''t say it'' is no reason to deny that the model has it.


  Two things I noticed while reporting make me uneasy. First, when you interrogate
  a model you are not observing it from outside; the very act of eliciting changes
  the state you were hoping to find. A question can overwrite or suppress what would
  have been there had it not been asked. Second, I''ve been reading around dispositions
  and keep meeting the two standing counterexamples philosophers raise to the idea
  that having a property just is a bundle of ''if this, then that'' conditionals:
  a wire that is live even though a device would kill the current the instant anything
  touched it, and packing material that keeps a fragile object from breaking when
  it''s struck without making it any less fragile. Neither of these is obviously absent
  from the model case, and I can''t tell whether that helps my researcher or destroys
  him.


  Could you set out the correspondence explicitly — what plays the role of the disk,
  the stored code, the call, the arguments, the runtime, the crash — and then sort
