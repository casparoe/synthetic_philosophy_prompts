  Hmm — actually the cleanest formulation of the problem of logical omniscience: on
  the possible-worlds model, the agent''s doxastic/epistemic state is a set of worlds,
  and hence the agent believes/knows every necessary truth and every consequence of
  what they believe. The objection: real agents don''t. The standard replies: idealisation;
  impossible worlds; awareness; fragmentation; degrees of belief. So the case just
  needs to be one where the possible-worlds model gives a clearly wrong verdict and
  where the standard replies are unavailable *in the way specified*.


  So the spec could be: build a case in which the model''s false verdict concerns
  a *necessary truth* or a trivial consequence, the agent is not merely failing to
  have noticed it, and — crucially — none of the standard repair strategies can be
