  newspaper office — not a logic seminar, and no science-fictional apparatus.

  2. The scenario itself should run to no more than about 250 words, and the proposition
  at issue should be statable in a single untechnical sentence.

  3. The agent has every concept required, is fluent in the relevant subject matter,
  is fully attentive at the time, and has all the time in the world. Nothing turns
  on how much work the inference would take.

  4. The entailment is a single step, verifiable by the reader at a glance. No chains.

  5. The agent''s evidence is consistent, and its consistency is not what does the
  work.

  6. No lottery, no preface paradox, no self-locating or indexical twist, no unknowable
  necessary a posteriori identity.


