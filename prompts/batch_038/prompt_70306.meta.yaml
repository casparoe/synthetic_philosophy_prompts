  or two that it really does follow in one step.

  - Give the verdict of the classical possible-worlds model and the intuitive verdict,
  and explain why the gap is not a matter of the agent''s not having got round to
  it.

  - Take four repair strategies in turn — allowing non-standard worlds at which logical
  consequences fail; restricting what counts by the concepts the agent has grasped;
  splitting the belief state into compartments that are not jointly accessible; and
  replacing sets of worlds with degrees of belief — and say for each what it makes
  of the case, and what it costs or predicts wrongly elsewhere.

  - Identify the single feature of the case that is doing the work, and say what happens
  if it is removed: does the case collapse back into an ordinary story about limited
  time or unfamiliar concepts?

