  are legitimate idealisations, in the manner of frictionless planes, and say whether
  it reaches this case.


  Two house rules. The verdicts must be generated by the features you describe, not
  stipulated; a case that simply asserts the agent rationally withholds the consequence
  has failed. And finish with an honest note on which constraint was hardest to meet,
  and whether you bent any of them. I will supply references myself, so please do
  not include a bibliography.


