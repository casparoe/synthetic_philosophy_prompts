  Prompt draft:


  "Write a parody document: Version 4.2 of the certification standard of an invented
  assurance body — call it something blandly technocratic, e.g. the Aquatic Welfare
  Assurance Council — governing a mixed aquaculture site that runs both a finfish
  unit and a penaeid shrimp unit. About 800–900 words, formatted as numbered clauses
  in the register of a real third-party standard: ''Scope'', ''Definitions'', ''Normative
  requirements'', an annex on decapod crustaceans, and a schedule of non-conformities
  with classification (minor/major/critical) and corrective-action deadlines.


  The target is not the industry alone and not the welfare movement alone; it is the
  genre of welfare certification itself — specifically, the way an unresolved empirical
  question gets converted into an auditable clause. The joke should come from the
  standard''s administrative self-confidence rather than from invented cruelties:
  every feature you satirize should be something a real scheme actually does or is
  tempted to do.


  Things the piece should get right enough that a specialist laughs rather than winces:


  - The standard handles the question of whether decapods are sentient not by answering
  it but by defining it away: a ''Presumption of Sentience'' clause, non-rebuttable
  at site level, with a note that the question is ''under scientific review'' in the
  same clause that has already made the presumption operative.

  - Its ''welfare outcome indicators'' turn out, on inspection, to be production parameters
  (survival, growth, feed conversion) wearing a welfare vocabulary, alongside a couple
  of genuinely animal-based measures that cannot be scored.

  - The sentience criteria that actually matter — nociception and appropriate sensory
  receptors, opioid receptors and reduced response to analgesics, protective motor
  reactions such as rubbing, flicking and sheltering, avoidance learning, and trade-offs
  between noxious stimuli and other motivations — appear only as things the auditor
  must be able to observe within a defined observation window, which makes several
  of them practically unobservable and therefore, in the document''s own logic, compliant.

  - Broodstock eyestalk ablation is not prohibited but ''managed'': permitted methods
  (pinching, enucleation, cauterising, ligation), a competence requirement for the
  person performing it, and a clause on anaesthesia and analgesia that is written
  so as to be satisfiable without any of it.

  - Slaughter requirements scale badly: a per-animal stunning obligation, or an electrical
  stunning parameter, applied to a harvest of tens or hundreds of millions of individual
  shrimp, resolved by a mass or carapace-length threshold below which the clause does
  not apply, and by ''batch verification'' that samples a fixed number of animals.

  - Finfish and decapods are subject to identical clause structure, so that indicators
  with a clear meaning for a fish (loss of equilibrium, cessation of gill movement,
  time to insensibility) are applied to animals for which the equivalent is contested,
  and vice versa.

  - A short list of ''observations that do not constitute a non-conformity'' — the
  piece''s quiet masterpiece — plus at least one clause where a critical non-conformity
  concerns records rather than animals.


  Constraints: stay entirely in the document''s voice. No winking, no authorial asides
  inside the standard, no invented atrocities beyond what real aquaculture already
  does; the horror should be procedural. The reader should be able to tell exactly
  what is being ironized — that certification can be sincere and still fail to track
  welfare, and that the unresolved science is absorbed into the paperwork rather than
  reflected in it — without the piece ever saying so. Internal consistency is part
  of the brief: every clause must be something a competent auditor could actually
  apply.


  After the document, add a separate short note (about 150 words, clearly outside
  the parody) saying where the piece takes liberties: which of the practices and indicators
