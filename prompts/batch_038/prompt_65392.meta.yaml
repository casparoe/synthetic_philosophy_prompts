  prior assumption (CPA) — Harsanyi argued that all differences in beliefs should
  be traced to differences in information, since there''s no rational basis for differing
  priors (the "prior should be the same because it comes before any information").
  Aumann defended CPA as a coherence/completeness requirement: the CPA is a way of
  describing the situation, and dropping it means you can''t describe agents as having
  subjective probabilities over everything... Actually Aumann''s argument: the CPA
  is not an assumption about the world but part of the description; if agents have
  different priors, they should have priors over "which type am I," i.e., a common
  prior over types. Harsanyi''s "as if" reasoning: agents should reason as if they
  have a common prior because they would if they''d had the same information.


