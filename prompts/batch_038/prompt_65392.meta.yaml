  was fine: he''d seen the same evidence and just weighted it differently, and priors
  are priors — there''s nothing to argue about.


  2. Priya said that''s a cop-out, and invoked Aumann: if you two share a common prior
  and you both know each other''s posteriors — and know that you know, all the way
  down — then your posteriors have to be equal. So a disagreement that survives both
  people knowing the other is rational and fully informed can''t be a rational disagreement.
  Somebody''s cheating somewhere.


  3. Marcus said the theorem is a trap: the common knowledge condition is basically
  never satisfied in real life, you''d need an infinite chain of "I know that you
  know that I know," and no one on our team has that. So the theorem tells you nothing
  about the two of us.


  4. Priya said fine, drop the theorem, the weaker result does the same work: the
  Geanakoplos-Polemarchakis thing where two Bayesians who iteratively announce their
  posteriors converge to agreement, in a finite state space. We''ve effectively been
  announcing to each other for three weeks. So we should have converged, and we haven''t,
  which is itself the problem.


  5. Marcus said that result assumes a common prior too, so it''s just the same assumption
  with extra steps — and the assumption is what''s actually in dispute. He said Harsanyi''s
  line, that any difference in beliefs has to be traced back to a difference in information,
  can''t apply to priors at all, because a prior is by definition what you have before
  the information comes in. Using it to police priors is begging the question.


  6. Priya said no, it''s not question begging, it''s a coherence constraint. If you
  think your prior is rationally permissible and mine is too, then before either of
  us has any evidence one of us should already think the other is irrational — but
  neither of us thinks that, we both rate each other as competent. So we''re committed
