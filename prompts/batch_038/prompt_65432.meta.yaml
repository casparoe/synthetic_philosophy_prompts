  Two colleagues of mine — I''ll call them Elena and Joel — got into a sustained argument
  after a department seminar, and since I could not settle it, I''ve written it up
  as faithfully as I can.


  It began with a case involving a third colleague. She was at a conference, in a
  lift with a stranger, and he mentioned that the afternoon session had been moved
  to another room. She went to that room; the session had indeed been moved. She had
  no phone signal, no programme, and no opportunity to check; she had never seen the
  man before, though he was plainly another delegate. Afterwards she said she hadn''t
  weighed anything — she had simply taken his word for it. Elena and Joel disagreed
  about whether her belief was justified.


  (1) Elena: No. An assertion is, in itself, just a noise somebody makes; it becomes
  a reason for believing something only insofar as the hearer has grounds for thinking
  noises of that kind track the truth. Our colleague had and used no such grounds,
  so she had nothing. That the claim turned out true shows only that she was lucky.


  (2) Joel: That standard is either impossible or empty. If the grounds must be ones
  she actually considered, then virtually no ordinary testimonial belief is justified
  — which is an extraordinary thing to say about the source of most of what anyone
  knows. If the grounds need only be available to her, then the requirement does no
  work at all, because in ordinary conditions grounds of that sort can always be produced;
  Elena''s position collapses into ''believe what you are told unless you have a reason
  not to.''


  (3) Elena: There''s a real difference between those two readings. In this case specific
  grounds were available: the man was a delegate at the same conference, badge visible,
  informative rather than insistent, and the content was of a kind nobody invents
  for amusement. Such grounds can also be conspicuously absent — an unsigned note
  slid under a door, a caller who won''t give a name — and my view can say the belief
  is unjustified there while Joel''s cannot, since on his account every assertion
  starts out with the same credit. And that is the trouble with his view: it entitles
  her to believe whatever the stranger says, however improbable, provided she has
  not thought of an objection.


  (4) Joel: No. Absence of defeaters is part of my view, not an afterthought, and
  the absurd claim is defeated on the spot by everything else she knows. So our two
  accounts deliver the same verdict in every case we''ve described; they differ only
  about which default to state, and the default is doing no visible work. Worse, Elena''s
  ''available grounds'' are themselves largely testimonial: her familiarity with conferences,
  badges, rescheduled sessions, and the behaviour of delegates was acquired by being
  told things. The base she appeals to cannot be used to underwrite testimony without
  circularity.


  (5) Elena: Not all of it. She has watched people be right about where things are,
  and she has caught people lying; those are observational. And in any case the demand
  is local, not global: the question is whether this speaker, in these circumstances,
  is competent and sincere, and that can be assessed by perception and induction without
  assuming anything about testimony in general.


  (6) Joel: Local assessment presupposes global reliability. To catch someone in a
  lie you compare what they said with what you know, and most of what you know was
  told to you. Consider also a child acquiring her first language: she has no observational
  base, cannot assess competence or sincerity, and yet comes to know a great deal
