  or to the fact that per-capita food production rose but so did population, or to
  the claim that Malthus''s mechanism (population pressing on subsistence) held for
  all of human history until ~1800 and may hold again. And the crux: does "early"
  describe a timing error in a prediction (which requires the prediction to have a
  specified timeframe) or a claim about a mechanism that operates but is masked by
  counteracting forces? And there''s a nice precise point: "right but early" is only
  a rescue if the theory independently predicts when the effect should appear; otherwise
  it''s unfalsifiable-in-principle, because any finite stretch of counterexamples
  can be absorbed by "not yet." That''s the real philosophical crux (analogous to
  "ad hoc rescue" and to the problem of long-run predictions being immune to refutation).
  Also: Malthus himself, in later editions, added "moral restraint" as a preventive
  check — which is itself a modification; is that a rescue or a refinement? Also there''s
  the distinction between a theory of a mechanism (population grows faster than food)
  and a forecast (famine and misery), and whether the mechanism can be true while
  the forecast fails because of the mechanism''s own triggering of innovation (Boserup-style
  endogenous response — Boserup''s "population pressure stimulates agricultural innovation"
  is the standard counter, and it''s well known).


  Also nice: the "right but early" slogan can be read as:

  1. Weak/trivial: the theory''s mechanism operates ceteris paribus; history had other
  forces.

  2. Timing: the theory predicted the effect would occur by time T; it didn''t; but
  the theory''s own account of the lag was wrong. (That''s just being wrong about
  timing, not "early.")

  3. Domain-restricted: the theory was true of the pre-industrial world (a claim about
  the past) and "early" is a misnomer — you''d say "right, and about a world that
  has since changed."

  4. Limit claim: the theory describes an asymptotic tendency that no finite horizon
  can refute → unfalsifiable.

  5. Prediction about the future: the theory predicts eventual collapse; the past
  200 years of counterexamples are not evidence against it because the required condition
  (exhaustion of technological headroom) hasn''t arisen → this is the "not yet triggered"
  reading, which is a genuine (if risky) scientific move, like a theory whose antecedent
  conditions haven''t obtained.

  6. Identity reading: "right" = "he identified a real constraint that binds eventually";
  "early" = "the constraint wasn''t yet binding" — this is the only reading under
  which the slogan does real work, and it requires that Malthus''s own theory contain
  an account of what makes the constraint binding vs. slack (i.e., a stated trigger
  condition). If it doesn''t, "early" is an ad hoc epicycle.


