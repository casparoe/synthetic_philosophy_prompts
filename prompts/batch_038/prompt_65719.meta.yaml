  For three years, six of us have kept a shared spreadsheet of predictions. Anyone
  can add a question with a yes-or-no answer — whether the bridge reopens by spring,
  whether a certain film wins, whether it rains on the day of the picnic — and anyone
  can post a number between 0 and 1 for it. When the outcome comes in we record it
  as 1 or 0, and each of us is scored on the average of the squared gaps between the
  numbers we posted and the outcomes, over just the questions we posted on. Lowest
  average at the end of the year buys the whisky.


  Two of the others have lately started advising me on how to post, and their advice
  points in opposite directions.


  One says never to post above 0.9 or below 0.1, however sure I feel. His reasoning:
  eventually I will be flatly wrong about something I was certain of, and one bad
  squared gap can undo a season of sensible middling numbers, so it is better to be
  a little off on everything than badly off on one thing.


  The other says never to post at all unless I am sure. Her reasoning: the average
  is taken only over the questions I bothered to answer, so every question I skip
  is one I cannot be wrong about, and the person who posts on fifty questions has
  given themselves fifty ways to lose.


  Here is what troubles me. If I followed both, I would post 0.5 on a handful of questions
  where the answer barely matters and stay silent on everything else — which is more
  or less the record of someone who knows nothing. It seems absurd that this should
  be the safest way to play a game about getting things right, and yet I cannot see
  which step in either argument is the bad one. Are they right, is one of them right,
  and is there something we should change about the spreadsheet itself?


  Answer with exactly five numbered points, each one or two sentences, and no introduction
