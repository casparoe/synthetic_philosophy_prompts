  ---


  Last night a friend and I argued for four hours about Anatoly Fomenko''s New Chronology,
  and we discovered, to our mutual frustration, that we agree on the verdict and disagree
  completely about the reasoning that produces it. We both think the theory is pseudohistorical.
  We both think its chronology is false. What we could not settle is what makes it
  pseudohistorical rather than merely, ambitiously wrong — and we came to suspect
  that this matters, because our two accounts issue in different verdicts on cases
  we have not yet discussed.


  His account is content-based: pseudohistory is identified by features of the claims
  and the inferential structure linking them to evidence. On his view, the decisive
  feature of New Chronology is that it can absorb any disconfirming result, because
  it holds the disconfirming instruments — radiocarbon sequences, dendrochronologies,
  the conventional datings of astronomical records — to be themselves calibrated by
  the very chronology in question, and then adds a conspiracy of chronologists to
  explain the pattern. Nothing, on this account, could count against the theory from
  inside the theory''s own frame.


  Mine is practice-based: pseudohistory is identified by how an enterprise is organized
  socially and how its proponents stand toward a community competent and willing to
  correct them. On my view the decisive feature is not the argument''s shape but the
  withdrawal from scrutiny — the fact that, after a period in which Fomenko and colleagues
  published in refereed venues and were answered, the enterprise migrated to mass-market
  books addressed to readers who could not check the mathematics, and that its proponents
  now draw credibility, income, and audience from a constituency that no refutation
  reaches.


  Stipulate the case as I have described it; I am not looking for a survey of the
  theory or for references, and I would rather you not spend words reconstructing
  its details. Here is what I want instead: the joint statement he and I should have
  produced.


  1. A numbered list of claims we can both sign ... including about New Chronology
  itself, about Newton''s amended chronology of ancient kingdoms (a revision of the
  same kind of chronology, by a mainstream natural philosopher, substantially wrong
  and not pseudohistorical), and about Hardouin''s seventeenth-century claim that
  most Greek and Roman texts were forged by monks — a case in which the author, pressed
  for his reasons, said they would appear in a letter to be opened after his death,
  and no such letter was ever found.

  2. A table of our disagreements, each stated in the wording its own proponent would
  accept...

  3. The cruxes — sub-questions such that settling one would move at least one of
  us. I suspect one is whether immunity to refutation is a property of a set of claims
  or a disposition of a community, and that another is whether the conspiratorial
  element does independent work or is a downstream symptom of the audience structure.

  4. For each crux, a case both of us would accept as bearing on it, with our predictions
