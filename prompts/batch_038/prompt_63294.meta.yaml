  but here the reasons are first-person reports about the conditions of encoding,
  which are themselves testimony (about a memory). Is there any non-testimonial access?
  That''s a genuinely deep problem.

  3. The detective''s reassurance: under which view does that operate? Anti-reductionism
  has a defeater slot — but the defeater had to be available to someone. The jury
  never heard the reassurance; the defense couldn''t cross-examine what it didn''t
  know. So anti-reductionism''s "absence of defeaters" clause is evaluated relative
  to what evidence? Available-to-hearer vs. true-in-the-world. That''s the crux: was
  the jury''s belief justified (no defeaters in their evidence) or unjustified (a
  defeater existed)? Good.

