  Cleanest: Work with "knowable by the log" = "there is some time at which the log
  records it". Premises:


  1. Log-verificationism (requirement R): every truth about the system is recorded
  at some time. Formally: ∀p (p → ◇_t Rec_t(p)). Actually Fitch''s second premise
  is "all truths are knowable": ∀p(p → ◇Kp).

  2. The log is factive: whatever it records is true. Rec(p) → p. (Analogue of knowledge''s
  factivity.)

  3. The log is conjunctive: if it records a conjunction, it records each conjunct.
  Rec(p ∧ q) → Rec(p) ∧ Rec(q).

  4. There is at least one truth the log does not record — indeed, at any given moment
  some facts are unrecorded; in particular, consider the specific fact s: "the packet
  was dropped at 03:12:07 and the log never records that the packet was dropped at
