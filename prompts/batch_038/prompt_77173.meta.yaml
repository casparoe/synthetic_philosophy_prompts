  Actually here''s a nice one that injects novelty and is technically meaty: a version
  of Fitch''s argument where the second premise is not "all truths are knowable" but
  a *token-indexed* knowability claim motivated by a logging system: every state change
  in a system is eventually recorded in an append-only log (so it''s knowable), and
  the log is factive (records are accurate). The asker then argues: if every truth
  about the system is recorded, then... hmm, but the "unknown truth" premise needs
