  i.e., there''s an unknown truth (non-omniscience). Then instantiate: let q be such
  a truth, q ∧ ¬Kq. By (1), ◇K(q ∧ ¬Kq). By (3) + (2) in the modal context: K(q ∧
  ¬Kq) entails Kq ∧ K¬Kq; and Kq ∧ K¬Kq with factivity (K¬Kq → ¬Kq) gives Kq ∧ ¬Kq,
  contradiction. So ◇ of contradiction, impossible; hence ¬∃p(p ∧ ¬Kp), i.e., every
  truth is known. Contradiction with non-omniscience. So one of the premises goes.


  So the asker''s version: from (1)-(3) plus (4) "some fact is unrecorded" you derive
