  Kp, so ¬Kp, contradiction. So it''s unknowable, given factivity + distributivity
  of K over conjunction. Nice.


  So the engineering analogue: an append-only audit log that is factive (whatever
  it records is true) and conjunctive (if it records A and B it records A∧B... or
  rather: if the log records a conjunction then it records each conjunct). Then the
