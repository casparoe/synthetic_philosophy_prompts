  Draft steps:


  Context: regulated payments/medical device system; standard requires an append-only
  audit log. The internal requirement the asker''s team wrote: "For every fact about
  the system''s behaviour during an incident, the audit log must eventually contain
  a record from which that fact can be recovered." Then:


  (1) Completeness: For every true proposition p about the system''s behaviour, the
