  a twist that makes the flaw subtle — e.g., a scope/quantifier shift between "for
  each truth there is a possible world at which it is known" and "there is a possible
  world at which all truths are known" — or an equivocation on ''knowable'' meaning
  "knowable by someone at some time" vs "knowable by me now". Or a variant where the
  argument proves that nothing is unknowable-but-unknown, and the asker''s chain also
  purports to show that omniscience follows from mere "testability" of hypotheses
  — i.e., a Popper-ish twist.


