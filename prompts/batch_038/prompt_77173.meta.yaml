  That last bit is the sharp absurdity: the report literally contains a sentence of
  the offending form. Great — this is the "proves too much" bite and gives the answerer
  a concrete handle: distinguish the bounded historical claim ("nothing recorded it
  at the time") from the self-referential unbounded one ("the log never records this
  very fact"), and distinguish the log from the report (the ''record'' equivocation).
  Also note that in (5)/(6), "does not record" needs to be read atemporally about
  the completed log; if it''s read indexically ("as of now"), the sentence''s truth-value
  changes, and (1)''s modal operator interacts with tense.


  Also potential flaw: (2) factivity — audit logs are famously not factive (clock
  skew, buggy instrumentation recording events that didn''t happen, log lines that
  misdescribe). If (2) fails, the whole derivation fails. And the cost of keeping
  (2): you must restrict the log to a perfectly accurate instrumentation, which is
  not what real systems have. And note: the requirement in the standard presumably
  includes accuracy, so (2) is part of the specification.


  Also: (3) — does a log recording a conjunction record each conjunct? If records
  are opaque blobs, "records p" means "p is recoverable from the log", and recovery
  is not obviously closed under conjunction elimination in the way (3) requires...
  actually it is: if p∧q is recoverable, p is recoverable. But the deeper issue: the
  diagonal sentence s isn''t a fact *about the system''s behaviour* — it''s a fact
  about the log, so (1) never applied to it. That''s the scope/equivocation flaw:
  (1) ranges over facts about the system''s behaviour; s is a hybrid fact about the
  system and the record. If you widen (1) to cover facts about the record, you get
