  that''s not recordable. But wait — the log records at times; the diagonal sentence
  "p and p is not recorded at time t" — but recording takes time, so at a later time
  it can be recorded. The subtlety: knowability in Fitch is existential over times,
  whereas "not yet recorded" is indexical, so the conjunct "p and p is not recorded
  now" is not stably true — once recorded, it becomes false, so it''s a truth that
  can never be recorded *as such* at any time... Actually that''s exactly Fitch: the
  diagonal sentence is true iff never known. Hmm, in Fitch the diagonal sentence "p
  ∧ ¬Kp" is knowable only if... The standard result: if p ∧ ¬Kp is true, it''s unknown;
