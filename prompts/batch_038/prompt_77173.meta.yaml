  R(p) = "p appears in, or can be recovered from, the completed audit log". Then:


  (1) For every p, if p is true then R(p). [the requirement, read literally]

  (2) If R(p), then p is true. [the log is factive — it doesn''t record falsehoods;
  required by the same standard: records must be accurate]

  (3) If R(p ∧ q), then R(p) and R(q). [whatever the log records, it records in parts]

