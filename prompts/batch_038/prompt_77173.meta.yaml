  Hmm, careful. In Fitch the non-omniscience premise is "some truth is unknown". From
  (1) and (4) you''d get an immediate contradiction — (1) says every truth is recorded,
  (4) says some truth isn''t. That''s too trivial! Fitch''s trick is that (1) is a
  *possibility* claim: every truth is *knowable* (◇K), not *known* (K). So the contradiction
  requires the diagonal. So I need (1) to be a modal/possibility claim: "For every
  true p, it is possible for the log to record p" — i.e., the requirement is *satisfiable*
  per-fact: no fact is in principle unloggable. That is: the log''s design has enough
  expressive capacity that any fact about the system could have been recorded.


  Yes! That''s the right engineering analogue and it makes the argument non-trivial:
  "No fact about the system is in principle beyond the log''s reach; for any true
  p, the log could have recorded p" (call it Loggable-completeness). Then:


  (5) Consider the fact s: "the packet was dropped at 03:12:07 and the log does not
  record that the packet was dropped at 03:12:07." Suppose s is true. Then by (1),
  the log could have recorded s. But if the log records s, then by (3) it records
  each conjunct, so it records "the log does not record that the packet was dropped
  at 03:12:07"; and by (2) whatever it records is true, so the log does not record
  that the packet was dropped — but by (3) again, from recording s it records that
  the packet was dropped. Contradiction. So s cannot be recorded. Yet (6) s is true
  (the packet was dropped and it wasn''t recorded). So there''s a true proposition
  the log cannot record, contradicting (1).


  Wait — is (3) applied correctly? Standard Fitch: K(p∧q) → Kp ∧ Kq, and factivity
  K¬Kp → ¬Kp. In my version: R(s) → R(drop) ∧ R(¬R(drop)). Then R(¬R(drop)) → ¬R(drop)
  by factivity (2). And R(s) → R(drop). Contradiction. Yes, valid, given (2) and (3).


  Then (7): So the requirement (1) is unsatisfiable in principle — no log, however
  capacious, can meet it.

  (8) And the same reasoning applies to any factive, conjunctive recorder: our post-mortem
  reports, our documentation, our human memory/investigation. So the general principle
