  Key conceptual machinery:

  1. Pro tanto / prima facie duty vs. all-things-considered duty. Many argue apparent
  dilemmas are just conflicts of pro tanto reasons; the resolution shows only one
  all-things-considered ought. A genuine dilemma requires that neither option is all-things-considered
  permissible, or that both are required.

  2. Agglomeration principle: if Ought A and Ought B then Ought (A and B). Combined
  with "ought implies can" this rules out dilemmas where both are required and can''t
  both be done. So to construct a genuine dilemma, you must either deny agglomeration
  or deny ought-implies-can, or make the dilemma a "prohibition" type: both options
  are forbidden (that''s consistent with agglomeration? If A is forbidden and B is
  forbidden, then you''re required to do not-A and not-B, but you can''t — that violates
  ought-implies-can if the "can" is about doing the required thing). Hmm.

  3. Types of dilemma: (a) both options obligatory and incompatible; (b) both options
  forbidden; (c) obligation conflicts with prohibition of same act.

  4. The "self-inflicted" reply: if the agent''s own past wrongdoing created the conflict,
  then at the time of the conflict the obligation is derivative; some say no genuine
  dilemma at the time of choice because the original obligation to avoid the predicament
  was violated — the "ought" now is a lesser one. Actually the standard reply (Donagan?)
  is that dilemmas arising from immoral conduct are not genuine because... hmm. Actually
  there''s a well-known argument that in self-generated dilemmas, the obligation that
  would otherwise apply is void because it would license the earlier wrongdoing. E.g.,
  a judge who bribed himself... Or the case: someone promises to two people to be
  at two places — promise-breaking dilemma generated by wrongful over-promising. Standard
  reply: the agent should not treat the promise as binding because doing so would
  let them profit from their own wrong; or that they have a duty to break one promise
  plus compensate.

