  fulfill — so the "ought implies can" escape doesn''t apply to each individually;

  (iii) the conflict is not self-inflicted: no prior wrongdoing or culpable negligence
  by the agent creates it (blocks the "you brought it on yourself" reply);

  (iv) no one else is coercing or manipulating the agent (blocks the "the real wrongdoer
  is the villain" reply);

  (v) realism constraint: ordinary life — a hospital, a small business, a family,
  a research lab — no trolleys, no lifeboats, no sci-fi;

  (vi) the case must make sense of symmetric residue: whichever she does, she owes
  something (apology/compensation/repair) that isn''t just a matter of having done
  the right thing.


