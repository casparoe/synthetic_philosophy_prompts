  So the crowd/public distinction is more nuanced than "crowd concrete, public abstract"
  — Kierkegaard calls both abstractions. The distinction is: a crowd is an actual
  assemblage of individuals in a shared situation (they came together; the crowd is
  untruth because it relieves individuals of responsibility), while "the public" is
  a totality that never assembles and whose members are dispersed and unknown to one
  another, produced by the press''s ability to reach many at a distance; the public
