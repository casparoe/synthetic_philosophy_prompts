  Thesis to defend (niche injection, invented by asker): Cicero''s four replies are
  not symmetrical. He genuinely refutes only the first charge (withdrawal from public
  affairs) and the fourth (proximity of death); the second and third he largely concedes
  and then revalues. And the refutation of the first charge depends on a specific
  conception of agency — that the essential political contribution of age is consilium
  and auctoritas rather than physical execution — which in turn depends on the aged
  person retaining a recognized public role with hearers who owe them deference. So
  the consolation is not portable: it works only where the social architecture still
  assigns old people a deliberative office. In 44 BC Cicero, barred from public life,
