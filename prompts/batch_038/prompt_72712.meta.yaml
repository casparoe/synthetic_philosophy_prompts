  ---


  I coordinate review for a mid-size program that funds clinical and translational
  research, and I have noticed a pair of institutional habits that seem to pull in
  opposite directions. I''d like to know what each of them presupposes about how the
  world is layered and about what counts as understanding it.


  The first habit is the demand for mechanism. Proposals and manuscripts in our portfolio
  are routinely faulted for being "merely correlative," for leaving a "black box,"
  or for reporting an effect without saying how it is produced; a finding is treated
  as finally secured once someone exhibits a chain of parts and activities at a lower
  level — cells, molecules, pathways — that carries the effect from cause to outcome.
  Reviewers write things like: we don''t yet understand this, because we don''t know
  what makes it work.


  The second habit is our reverence for the randomized trial. In the evidence hierarchies
  that our guidelines invoke, systematic reviews of randomized trials sit at the top,
  while in several standard versions of the pyramid reasoning from mechanism or pathophysiology
  sits at the very bottom, on the same tier as expert opinion. The trial''s authority
  comes precisely from the fact that it can license a causal claim while remaining
  silent about how the effect arises: allocation to groups, not an account of the
  underlying machinery, is what makes the result trustworthy. Our own archive is full
  of interventions that were used effectively for years before anyone could say how
  they worked, and of interventions with elegant mechanistic stories that failed or
  harmed when tested.


  A recent case brought the tension home. One applicant offered a model that predicted
  patient deterioration with excellent accuracy but could not say why, and was criticized
  for offering no understanding. Another offered a well-powered trial of a behavioural
  intervention with no account of how it produced its effect, and the panel treated
  the missing mechanism as a limitation worth noting but not a defect. Both proposals
  lacked the same thing.


  So: reconstruct the theory of explanation and of the relation between levels that
  the mechanism demand presupposes. Does it commit us to the view that higher-level
  regularities — disease, behaviour, recovery — are explanatorily derivative, carrying
  warrant only insofar as they can be cashed out in lower-level processes? Or can
  the demand be discharged by a purely practical reading, on which mechanism is a
  proxy for something else we care about — robustness across populations, resistance
  to confounding, confidence that the effect will travel outside the study — that
  makes no claim about which level is really doing the explaining? Please separate
  what the practice strictly requires from what merely fits it comfortably, and say
  where it is underdetermined, such that several different pictures of levels and
  explanation would license the same review form.


  Then tell me whether the two habits can be held together. Is there a principled
  division of labour — for instance between explaining why an effect occurs and justifying
  the claim that it does — that dissolves the conflict, or does one commitment, if
  pressed, undermine the other? Finally, suppose the institution dropped the implicit
  view behind the mechanism demand and took seriously the possibility that some higher-level
  properties are not exhaustively accounted for by their lower-level realizers. What
  would concretely have to change in how we word reviewer guidance, weigh proposals,
  and rank kinds of evidence — and what would we lose by changing it?


  ---


