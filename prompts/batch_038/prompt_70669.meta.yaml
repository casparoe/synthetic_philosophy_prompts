  I serve on an internal review group at an AI research organization. Our remit is
  narrow: before any outward-facing document leaves the lab — a model card, a system
  card, a paper''s abstract, a demo script, a press Q&A — we rule on whether it may
  use intentional idiom of a given system. That is, whether the document may say that
  the system believes something, wants something, prefers, intends, is trying to,
  remembers, or is confused about something. We do not rule on capabilities, and we
  do not rule on moral status; we rule only on vocabulary. The group''s charter says
  that our standard is whether a proposed description is "the most accurate and least
  misleading way of summarizing what the system does," which every member interprets
  differently, and our eleven rulings to date have never articulated a principle.
  Here they are, in order.


  1. Warehouse navigation stack. Permitted "the robot believes the aisle is blocked,"
  because interpretability located a compact occupancy variable whose value causally
  gates the rerouting routine, and because the ascription predicted detour behavior
  on held-out layouts better than any description in terms of sensor readings.


  2. Video recommender. Prohibited "the system wants you to keep watching." The training
  objective rewards watch time, but two members who argued from the objective were
  overruled: the group held that what the objective selected for is not thereby represented
  anywhere in the system, and that item-cooccurrence statistics predicted user behavior
  better than any goal ascription.


  3. Large language model reporting its own confidence. Permitted "the model believes,
  with roughly 70 percent confidence, that..." where the stated figures tracked accuracy
  across held-out domains and a linear probe on the residual stream recovered the
  stated figure.


  4. The same model, in a public blog post about honesty. Prohibited "the model knows
  when it is lying." Calibration held for factual recall but not for statements about
  its own reasoning, and no internal correlate had been identified for the latter.


  5. One-shot navigation agent in a simulated foraging environment. Permitted "it
  remembers where the food was" on the strength of a replay-like process whose disruption
  selectively abolished return trips. Split decision on "it plans its route": the
  ascription predicted shortcutting, but the group could not agree that any internal
  process deserved the name.


  6. A vision model that misclassifies a chihuahua as a muffin. Prohibited "it believes
  this is a muffin." Behaviorally the ascription was apt, but the group judged that
  the error was better described as a failure of a statistical classifier and that
  intentional idiom would mislead a general audience about the model''s overall competence.


  7. A code model that, prompted to explain its own patch, produces an explanation
  matching what it does next 94 percent of the time. Permitted "it intends to refactor
  the loop" in a technical appendix; prohibited the same sentence in the press Q&A,
  on the grounds that the appendix''s readers knew the word was doing work only inside
  a specified context.


  8. An agent whose verbal self-reports were confidently wrong in domains where its
  behavior was reliably right. Prohibited "it believes what it says about itself."


  9. A retrieval system described as "confused by contradictory sources." Prohibited.
  The group held that the word imported an experiential flavor that nothing in the
  mechanism licensed.


  10. A model whose behavior in a negotiation simulator was best predicted by ascribing
  it a belief about the opponent''s reservation price — a belief that was, as it happens,
  false, and that the ascription got wrong in exactly the right way. Permitted "it
  wrongly believes the opponent will accept less," over the objection that the internal
  correlate had never been found; the deciding consideration was that the intentional
  description predicted the model''s characteristic failures, which no non-intentional
  description did.


  11. A tutoring model described as "trying to get the student to produce the answer
  herself." Permitted, on the basis that the description was the shortest accurate
  account of a curriculum policy the developers had in fact designed in, and whose
  parameters were documented.


