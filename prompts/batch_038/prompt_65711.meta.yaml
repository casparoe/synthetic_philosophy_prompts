  Also a delicious wrinkle: Keynes himself was an active investor and a confident
  macro-forecaster (well, sometimes wrong — he was badly caught in 1929 and in the
  1920 currency crash, and he lost money in 1938), and the General Theory''s "animal
  spirits" sits oddly with the practice of econometrics that his students (Richard
  Stone, later Nobel; and the Cambridge Economic Service) went on to build. So the
  case tests Keynes''s view in both directions: was Keynes right that Tinbergen''s
  numbers had no weight? Subsequent macroeconometrics arguably vindicated parts of
  the critique (Lucas critique, identification, Sims), but also showed that carefully
  identified causal estimates can be made. And there''s the irony that Keynes''s own
  investment performance was good and that he thought investors'' expectations were
  unquantifiable while he still quantified them.


