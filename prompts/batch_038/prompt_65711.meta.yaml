  Actually here''s a really good one: **Keynes''s critique of Tinbergen''s econometric
  method for the League of Nations (1938–39)**. Keynes reviewed Tinbergen''s "Statistical
  Testing of Business Cycle Theories" and attacked the attempt to establish causal
  magnitudes from correlations, arguing that the method assumes the factors are mutually
  independent, comprehensive, measurable, and that the relationships are stable over
  time — none of which holds in economics; hence the resulting "equations" don''t
  license prediction. This is a direct application of the Treatise''s epistemology
  (weight of argument, non-numerical probabilities, the impossibility of assigning
  numerical probabilities when we lack relevant evidence) to an actual episode. And
  the episode is famous-ish in history of economics and philosophy of social science.
  The facts are reasonably well-known: Tinbergen''s League of Nations study for the
  American business cycle, Keynes''s 1939 Economic Journal review, Tinbergen''s reply,
  and Koopmans''s later critique (1947) which made similar points about "measurement
  without theory." Haavelmo''s probability approach too.


