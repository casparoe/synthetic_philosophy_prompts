  The episode is the American spoils system and its collapse in 1881–83. Charles Guiteau
  shot President Garfield in July 1881 after being refused the Paris consulship he
  believed his campaign work had earned; Garfield died eleven weeks later. In 1883
  President Chester Arthur — himself a former New York machine man who had been customs
  collector at the port until Hayes sacked him for refusing to obey an order barring
  officeholders from campaign work — signed the Pendleton Act, which replaced party
  patronage with competitive examinations for a covered class of federal posts. Three
  features matter for my question. First, Guiteau neither offered nor expected a bribe
  in the ordinary sense: office was the publicly understood reward for political service,
  and appointees were expected in turn to remit part of their earnings to the party
  that had placed them. Second, Garfield''s fight with Senator Conkling was over an
  appointment Conkling claimed a veto on by the informal custom of senatorial deference
  to a home-state senator — a norm every senator treated as binding, and whose breach
  cost Conkling his seat when he resigned it in protest. Third, Pendleton at first
  covered only about a tenth of federal jobs, and presidents afterward kept widening
  the covered class, which I''ve read had the side effect of insulating their own
  appointees from the next president.


