  Draft:


  On Saturday I sat through a four-hour argument at my kitchen table between two friends
  — call them N, who did a PhD in cognitive neuroscience and now works in a clinical
  setting, and P, who is a philosopher of mind — about how many conscious subjects
  a split-brain patient is. I contributed one bad analogy early on and then kept quiet,
  so I have no stake in the scorekeeping; I just could not work out who was winning.
  Here is the exchange as I remember it.


  They started from a case both knew: a patient whose corpus callosum has been severed
  for epilepsy, tested in the standard way, with an image flashed briefly to the left
  visual field so that it projects only to the right hemisphere. The patient says
  he saw nothing; asked to point with his left hand at an array of objects out of
  view, he points correctly to the matching object; asked to explain why he pointed,
  he offers a fluent, confident, entirely invented reason.


  (1) P''s opening: what makes experiences mine rather than yours is that they are
  co-conscious — that they belong to a single phenomenal field, such that the subject
  can be aware of them together. In the patient, the right hemisphere''s visual content
  is not co-conscious with the left hemisphere''s verbal content. So on the only criterion
  that is actually about consciousness, there are two subjects here, one of them mute.


  (2) N''s reply: that criterion is operationalized entirely through report. The only
  reason we say the right hemisphere''s content was not co-conscious is that the left
  hemisphere could not report it. But the two hemispheres sit in one skull, share
  one memory, one set of skills, one autobiography, one pair of eyes that they steer
  together, and they cross-cue constantly outside the laboratory: the right hemisphere
  sees what the left hand has just done and the left hemisphere is told, in effect,
  by the body it shares. Strip away the tachistoscope and the patient is a single
  integrated agent who drives a car, holds a job, and never once in daily life has
  a hand doing something the mouth denies.


  (3) P: that reply concedes the point and then changes the subject. If integration
  through a shared body and shared memory is what makes one subject, then "one subject"
  is no longer a claim about consciousness at all — it is a claim about the coordination
  of a biological system, and you have answered a different question. Besides, your
  cross-cuing is precisely the phenomenon my criterion predicts: cross-cued content
  becomes co-conscious, so the number of subjects in the patient is not constant.
  It is two in the lateralized laboratory condition and one in the kitchen. Your own
  best evidence makes the count condition-relative, which is an admission that there
  is no single fact to be had.


  (4) N: no — it is an admission that "how many subjects" is the wrong question, not
  that the answer varies. When the count depends on the measurement arrangement, the
  count was never tracking a substance. And your interpreter point cuts against you:
  if the left hemisphere reliably confabulates — invents a reason for behavior whose
  cause it cannot access, and is confidently wrong — then it is a witness who has
  been impeached on the very topic. You cannot use its denials ("I saw nothing") to
  establish a second subject and simultaneously dismiss its affirmations ("I am one
  person, and I chose that") as noise. Pick one.


  (5) P: I dismiss neither. Confabulation is not the opposite of unity; it is the
  mechanism of it. A system that cannot access the cause of its own behavior and nonetheless
  produces a single, continuous first-person narrative is doing the thing that makes
  for one subject. What you have shown is that narrative unity is cheap and unreliable
  — which is a reason to distrust the interpreter as a source of evidence about the
  count, exactly as you say, but it is not evidence that there is only one of them.
  It is evidence that we are in the dark.


  (6) N: then notice where the darkness ends. In ordinary fission cases — the ones
  philosophers use — one person becomes two because there are two separately embodied,
  separately ongoing successors, each with a distinct future. Here nothing of the
  sort happens: the patient was one subject before the operation and remains one continuously
  existing organism with one history and one future. There is no division, only a
  partial interruption of a channel. If you insist on two subjects, you must say that
  there were always two, even before the surgery, since adult hemispheres are already
  functionally lateralized and already out of immediate access to each other''s processing
  — and if you say that, you have argued that nobody has ever been one subject, which
  is not a conclusion you can hold while still asking me how many there are in this
  patient.


  (7) Finally P added something I thought was designed to win the room rather than
  the argument, and N said so: if there really are two subjects in there, then the
  surgery produced a second person who has been unable to speak, unseen, and unconsulted
  for decades, which would be a moral catastrophe that the field has been treating
  as a success story. N''s response was that this is an argument from consequences,
  and that we do not get to choose our metaphysics by how bad it would be if it were
  true. P said it was not a conclusion but a calibration: a hypothesis whose implications
  are that appalling ought to require more evidence before we accept it, not less.


  Could you go through this move by move? For each of the seven numbered steps, tell
  me whether it is right, partly right, or mistaken, and why — I want the reasoning,
  not a verdict table alone. In particular: does N''s objection in (4) really force
  P to choose, or does (5) escape it? Is (3)''s condition-relativity a genuine discovery
  about the case or a restatement of P''s original claim? Does (6)''s reductio — that
  P''s view implies nobody is ever one subject — actually follow? And when you have
  scored the moves, tell me what neither of them said: whether the dispute is really
  about counting, or about what a subject is; whether the answer could be indeterminate
  rather than either one or two; and whether there is any evidence that could in principle
  have settled it between them at that table.


