  \ birth year, like 9/11 survivors? people born in a specific 3-year window?). This\
  \ is a nice \"verdicts to rule\" prompt: the underlying rules could be (a) causal-historical\
  \ kinds (shared formative events), (b) natural kinds with intrinsic properties,\
  \ (c) social kinds that are real because they're looped/self-fulfilling (Hacking's\
  \ looping effects, interactive kinds), (d) nominalism/pragmatism. The divergence\
  \ case: a generation that is being actively constituted right now by the classification\
  \ itself — e.g., \"the AI-native generation\" of kids born 2020+ who have never\
  \ known a world without generative AI, where the label is being applied before any\
  \ shared disposition exists. Or a better divergence case: a cohort that gets a name\
  \ and starts acting on it — self-fulfilling. Realism about looping effects predicts\
  \ it becomes real; causal-historical predicts it isn't (no formative events yet);\
  \ nominalist predicts never real.\n\nHmm, but there's a risk: an LLM will just regurgitate\
  \ Hacking's looping effects. The instruction says the prompt should be \"somewhat\
