  \ I should inject a fabricated but plausible track record — invented verdicts from\
  \ an invented person. That's fine: the track record is part of the prompt, not something\
  \ requiring citation.\n\nLet me think about which combination produces the best\
  \ prompt.\n\nOption A: Generations + verdict prediction. Asker: a doctoral student\
  \ in a seminar on social ontology, whose advisor / a co-author / a colleague has\
  \ a track record of verdicts about whether various groupings count as real generations.\
  \ Inject specific verdicts: e.g., \"Boomers: real, but real for the wrong reason\"\
  ; \"Millennials: real\"; \"Gen Z: not yet real, still being constituted\"; \"Silent\
  \ Generation: retroactively manufactured, not real\"; \"Oregon Trail generation\
  \ / Xennials: not real, a marketing micro-cohort\"; \"the Japanese 'shinjinrui':\
