  Let me construct: In my department''s graduate seminar on ancient political thought,
  one of my colleagues defends the view that Aristotle''s natural-slavery doctrine
  is not an embarrassment to be explained away but the consequence of a general theory
  of rule whose core is an analogy: as soul to body, and as intellect to appetite,
  so master to slave and statesman to citizen. He argues that if we grant the analogy,
  the rest follows — including that slavery is both expedient and just for the natural
  slave, since master and slave share an interest. Another colleague says the analogy
  is merely expository, a rhetorical scaffold, and the real argument rests on a developmental/teleological
  claim plus the premise about who possesses deliberative capacity and who does not;
  on that view, refuting the analogy changes nothing.


  I want the model to adjudicate by auditing the analogy itself:

  1. Set out the correspondence table: the ruling element, the ruled element, the
  kind of rule (despotic vs. political/royal), the good of the whole, etc. — and note
  that Aristotle runs two analogies (soul/body → despotic; intellect/appetite → political)
  plus a third (tool/instrument → property).

  2. Identify which features of the soul-body source the analogy imports into the
  master-slave target: inseparability (body can''t be a body without soul; a slave
  can be a person without a master), unity of substance (form/matter vs. two substances),
  absence of any independent good of the ruled (but the slave is a human being with
  his own virtue — Aristotle himself assigns the slave a virtue, a "bodily service"
  virtue, and says the slave shares in reason enough to understand commands but not
  to originate them), no capacity for voice/claim (but the slave has logos).

  3. Which disanalogies matter for the intended use, and which are harmless. E.g.,
  the "self-moving shuttle" hypothetical: Aristotle concedes that if tools worked
  on command there''d be no need for assistants or slaves — which suggests the relation
  is instrumental, but then the "shared interest" claim collapses: an instrument has
  no interest.

  4. Whether the conclusion (some are slaves by nature, and slavery is beneficial/just
  for them) survives once disanalogies are in.

  5. Whether the analogy can do the discrimination Aristotle needs — separating natural
  slaves from those enslaved by convention/war. Aristotle himself raises the objection
  that the practice of Greek slavery rests on law and force, and that this makes it
  unjust. Does the analogy help or hurt? The analogy of soul-body can''t be read off
  from bodies (though Aristotle tries: nature makes two kinds of bodies, free and
  servile) — the disanalogy being that we can''t identify souls by inspection, and
  the analogy thus provides no criterion of application.

  6. What a better analogy would be — or whether a different relation (e.g., craftsman
  to material, doctor to patient, parent to child) would do the intended work without
  the fatal imports.

  7. Finally, which colleague is right: is the analogy load-bearing or expository?


