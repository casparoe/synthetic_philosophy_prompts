  Let me design:


  Persona: journalist covering science and ideas for a general-interest magazine.
  Commissioned a two-part series (~10,000 words total) on the revival of cultural
  explanation in the social sciences, and hosting a half-day off-the-record roundtable
  with five people: two economic historians, a cultural psychologist, a sociologist
  of religion, and a philosopher of social science. Ask: which open questions should
  structure the series and the roundtable, prioritized.


  Constraints on the answer:

  - No reading list, no citations, no bibliography; argue from the concepts.

  - Begin with a brainstorming pass listing candidate questions (say 8–12) before
  ranking.

  - State criteria explicitly and weight them: how many other questions depend on
  it; whether it''s tractable by conceptual argument rather than by data the journalist
  can''t gather; whether an answer would change what the series can claim; whether
  it''s genuinely open vs. rhetorically open.

  - Deliver a defended top-four ordering, and say which questions to cut entirely
  and why.

  - Identify the single crux.

  - Distinguish overrated implications (e.g., "if culture causes outcomes, then policy
  can change culture and thus outcomes" — or "if values explain, then values can''t
  be criticized"?). Ask which commonly drawn implications follow, which don''t.

  - Say what reporting or evidence over the next few months would reorder the list.


  Domain-specific in-the-weeds content to inject (so the model can''t just recite
  Weber 101):


  1. The Weberian template: a religious ethic → a motivational disposition (a "spirit")
  → an economic form. Note the structural features: the explanans is a normative orientation
  held by agents, the mechanism is motivational, and the explanation must avoid being
  either a redescription of the outcome or an appeal to a group-level property with
  no micro-mechanism.


  2. The modern revival (Henrich): medieval Latin Church marriage-and-family policy
  (restrictions on cousin marriage, remarriage, adoption, etc.) → dissolution of intensive
  kinship → distinctive psychology (individualism, impersonal trust, guilt over shame,
  analytic thinking) → voluntary associations, markets, impersonal institutions, and
  prosperity. Note the twist: here the "culture" is not a set of beliefs people endorse
  but an ecology of inherited norms and institutions that shaped psychology; the mechanism
  is cultural evolution and psychology, not reasons. Also: the explanans is itself
  a policy (an institutional cause), so the "culture causes" claim may be partly an
  "institutions cause" claim — which raises a distinctive question: what, if anything,
  is left of the idea of cultural causation once you specify mechanisms? Is "culture"
  a locus of causation or a label for a bundle?


  3. The measurement/individuation problem: how do you fix the content of the value
  independently of the outcome? (The classic worry that the Protestant ethic is identified
  by the capitalist behavior it''s supposed to explain.) In the modern version: is
  "individualism" measured by psychological tasks (triad tasks, line tests), surveys,
  or behavioral residues like unpaid parking tickets among diplomats — and do these
  measure one thing or several? The construct-validity question is a philosophical
  question, not merely statistical.


  4. The counterfactual/exclusion problem: Weber''s own careful framing (he explicitly
  disclaimed proving an exclusive spiritualist causation just as much as a materialist
  one, and asked "to what extent" religious forces shaped the outcome) — I should
  paraphrase this, not quote. This is a good niche injection: the debate often ignores
  that Weber framed his claim as comparative and partial, and that his own method
  (the ideal type, "causal adequacy" plus "adequacy on the level of meaning," the
  objective-possibility counterfactual from his methodology essays) is a theory of
  causal attribution designed precisely for single historical outcomes. Question:
  is the contemporary revival using Weber''s methodology or only his example? Do the
  new natural-experimental/quasi-experimental approaches (county-level regressions,
  instrumental variables) answer a different question than the interpretive one Weber
  asked — namely, a question about average effects in populations vs. a question about
  the causal significance of a unique historical configuration?


  5. Reverse causation & selection: prosperous towns chose Protestantism; kinship
  structure may co-vary with ecology (pastoralism, irrigation, pathogen prevalence)
  — so the "culture" variable may be downstream of material conditions, reopening
  the materialist explanation.


  6. The "values as causes vs. values as evidence" distinction: does a normative orientation
  cause behavior, or does it make behavior intelligible? Related: reasons-explanation
  vs. causal explanation.


  7. The problem of functional fit / group selection: cultural-evolutionary accounts
  explain norm prevalence by group-level success, which raises whether the explanation
  is about the origin of the value or its effects.


  8. The generalizability/universality implication: if WEIRD psychology is a historical
  accident of ecclesiastical policy, then generalizations from WEIRD samples aren''t
  universal claims about human nature — which implication matters for how psychology
  journals, or how the journalist''s readers, should read social science.


  9. The policy implication: if culture is a cause, can it be a lever? Does that license
  "values interventions," or does the same historical depth that makes culture causal
  also make it non-manipulable on policy timescales? This is a great "overrated implication"
  candidate.


  10. The reflexivity/self-undermining implication: a successful cultural explanation
  of why we find cultural explanations persuasive.


  That''s plenty of material. Now the deliverable asks: rank ~top four, defend, name
  the crux, cut some, flag overrated implications, say what would reorder.


