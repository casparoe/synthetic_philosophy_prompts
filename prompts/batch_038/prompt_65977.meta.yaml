  ---


  You are answering as a philosopher of social science with two specialties: explanation
  in the historical sciences, and the metaphysics and methodology of causal claims
  about culture. Please treat this as a serious piece of agenda-setting rather than
  a survey, and think carefully before you answer; I would rather have a defensible
  shortlist than a comprehensive map.


  Background on me: I cover science and ideas for a general-interest magazine. I have
  been commissioned to write a two-part series — roughly ten thousand words in total
  — on the rehabilitation of cultural explanation in the social sciences, and alongside
  it I am convening a half-day, off-the-record roundtable with five people: two economic
  historians, a cultural psychologist, a sociologist of religion, and a philosopher
  of science. I have about six weeks of reporting time and one roundtable. I want
  your help deciding what the series should actually be about, and what those five
  people should be asked.


  The material I''m working with, in brief. First, the Weberian template: a religious
  ethic generates a distinctive motivational orientation among its adherents, that
  orientation gets expressed in economic conduct, and the conduct eventually crystallizes
  into an institutional form — with the historian''s task being to say how much of
  the outcome is attributable to the religious factor rather than to material conditions.
  Second, a contemporary descendant of that template that has been getting a great
  deal of attention: the claim that late antique and early medieval Church regulation
  of marriage and family — prohibitions on cousin marriage, restrictions on remarriage
  and adoption, and the general dismantling of the clan as a corporate heir and property-holding
  unit — dissolved intensive kinship in Western Europe, which reshaped ordinary psychology
  toward individualism, impersonal trust, guilt rather than shame, and analytic rather
  than holistic cognition, which in turn made possible voluntary associations, impersonal
  markets, and law-governed institutions, and hence prosperity. Proponents point to
  comparative psychological tasks, survey data, and behavioral residues — unpaid parking
