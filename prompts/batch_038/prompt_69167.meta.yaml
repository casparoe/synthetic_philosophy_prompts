  Draft:


  I am preparing the introductory section of a graduate seminar on the metaphysics
  of time, and I have become convinced that the dispute generated by the Rietdijk–Putnam
  argument is not, in fact, a dispute in physics, though both sides insist that it
  is. I want a diagnosis of the impasse rather than an adjudication.


  Set out briefly what I take to be the shared ground: the argument begins from the
  relativity of simultaneity — two inertial observers in relative motion assign different
  spacelike hypersurfaces as "now" — and adds two further premises, neither of which
  is a theorem of special relativity: that no observer''s hypersurface is privileged,
  and that whatever is real-for-an-observer is real simpliciter, so that the relation
  of coexistence is transitive and sweeps up the whole of Minkowski spacetime. The
  conclusion is that the future is as real as the present.


  Then the replies, which have also not moved in sixty years:

  - the neo-Lorentzian: a privileged foliation is empirically undetectable but not
  incoherent; the equivalence of inertial frames is a claim about the laws, not about
  the ontology;

  - Stein''s: definiteness attaches only to an observer''s past light cone, so the
  transitivity premise illicitly iterates a local relation;

  - Savitt-style local presentism: the present is point-relative, defined by light-cone
  structure rather than by a hyperplane;

  - the deflationary reply: physics tells us about causal and metrical structure,
  and nothing about which parts of that structure exist; the presentist can simply
  deny that "exists" is a notion with a frame parameter and refuse the question.

  And the eternalist rejoinder to all of these: whichever of them is adopted, the
  presentist has either abandoned relativity (preferred frame), abandoned the global
  present (pointy/local), or abandoned any content at all (deflationism) — so the
  argument, if it does not refute presentism, at least prices it in.


  My hypothesis: the two sides agree on every piece of physics and disagree about
  something else entirely — namely about the ideology in which an ontological theory
  may be stated. The eternalist holds that "there exists" is a single unrelativised
  quantifier whose domain is fixed by what the world is like, and reads the argument''s
  second premise as a constraint on any candidate ontology: if existence were frame-relative,
  existence would not be a feature of the world at all. The presentist, on this reading,
  is not saying that fewer things exist; they are saying that existence is not the
  joint-carving notion the eternalist assumes — that the question "what is there?"
  is not well posed until one says from when it is asked. On that diagnosis the Rietdijk–Putnam
  argument is not unsound, it is addressed to a theory the presentist does not hold,
  and the entire subsequent literature consists of the two sides restating their metaontological
  commitments in the vocabulary of spacetime geometry.


