  Presentist responses to Rietdijk–Putnam:

  1. Deny that relativity forbids a privileged foliation — neo-Lorentzian: a preferred
  frame is empirically undetectable but metaphysically possible; the argument''s "no
  privileged observer" premise is not a theorem of SR but a metaphysical/methodological
  addition (often justified by the equivalence of inertial frames, but equivalence
  ≠ no privileged frame in the sense of a hidden absolute simultaneity; e.g., Lorentz''s
  own interpretation). Proponents: William Lane Craig, and also Tooley (growing block
  with an absolute simultaneity), and some philosophers of physics note that Bohmian
  mechanics with Dürr–Goldstein–Zanghì posits a preferred foliation, and that the
  cosmological rest frame defined by the CMB provides a physically distinguished slicing.

  2. Deny transitivity of "coexistence"/"reality": Stein''s reply — reality (definiteness)
  for an observer is confined to its past light cone; the argument illicitly iterates
  a local relation globally. Also: Stein argues Putnam''s principle plus a "reciprocity"
  condition collapses the relation of co-existence to the entire spacetime, which
  shows the principle is not what the presentist needs — rather, it''s a reductio
  of Putnam''s formulation, not of presentism.

  3. Local/pointy presentism: the present is defined by the light cone at a point,
  not a hyperplane (Savitt; also Gibson & Pooley''s discussion; and Arthur Prior-ish
  "point presentism" — Prior said the present for a person at a place is what''s happening
  here now, and there''s no fact about distant "now").

  4. Deny the inference from physics to metaphysics: ontological conclusions can''t
  be read off a theory''s formalism; the argument at best shows the relation "is co-present
  with" is not the equivalence relation the presentist assumed, which is compatible
  with existence being tensed/frame-relative in an unintelligible or deflationary
  way. Some (e.g., Callender? or Savitt) hold that the argument shows a constraint
  on how to formulate presentism, not that presentism is false.

  5. Accept frame-relative existence ("moving spotlight" / "solipsism of the present
  moment"): existence is relative to a hypersurface; the objection is that this is
  unintelligible because existence is not a relation between events and observers.

  6. Some argue the Rietdijk–Putnam argument is valid only for the "block" conclusion
  about determinism in a trivial sense: everything in the spacetime manifold is equally
  part of the model; the real question is which parts are "real", and manifold substantivalism
  debate overlaps.


