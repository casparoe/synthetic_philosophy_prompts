  unique events implies anything about laws. He says (§29-ish) that historical events
  are unique in the sense that they involve concrete individuals, but science always
  deals with universal aspects. And Popper holds there ARE laws applicable in history
  (e.g., you can''t explain the fall of an empire without laws). So the false presupposition
  is well-grounded and a strong answer will correct it.


