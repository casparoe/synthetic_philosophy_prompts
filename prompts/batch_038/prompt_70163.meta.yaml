  The Poverty of Historicism structure: Part I: The Antinaturalism of Historicism
  (Historicist Method, Laws and Trends, "Historicism''s Poverty"), Part II: Pro-Naturalism
  of Historicism (Naturalism and Psychology, Sociological Determinism, The Principle
  of Empirical Method, Prediction and Prophecy, Technological Anticipations, The New
  Prophecy of Society, The Method of Psychology, Logic of Situation Analysis), Part
  III: Criticism of Historicism (Critique of Antinaturalist Doctrines, Critique of
  Pro-Naturalist Doctrines, Historicism''s Poverty).


  Key arguments in Part III:

  - §29 "The Unity of Method" — all theoretical science is about universal laws, and
  history is more about concrete/particular events but uses laws as tools.

  - §30-31: Criticism of historicist holism: totalities are not objects of science;
  "the whole of society" cannot be described.

  - §32: "Historicism is a form of the naturalistic approach, but not of the unified
  method" — the historicist thinks he has the method of physics but hasn''t.

  - §33: "There can be no law of evolution / no scientific prediction of the future
  course of history": the course of human history is strongly influenced by the growth
  of human knowledge; we cannot predict, by rational or scientific methods, the future
  growth of scientific knowledge (otherwise we would already know it); therefore we
  cannot predict the future course of human history. This is the famous argument.

  - Also Popper allows "conditional scientific predictions" — technological prophecy
  — as opposed to unconditional historical prophecy.

  - Also there''s the argument about trends vs laws: trends depend on conditions and
  can change; mistaking a trend for a law is the core historicist error.

  - Popper also grants that there may be no unconditional sociological laws; but he
  doesn''t rule out conditional laws, and he thinks "sociological laws" in the sense
  of laws of social mechanics exist at least in trivial forms.


