  about knowledge, competence, and explanation that each of the practices below might
  presuppose, and only then decide which of them the practices genuinely require.


  Here is the bundle of practices I want analyzed. In a typical academic hospital:


  1. To be granted independent practice privileges, a physician must pass an oral
  examination in which examiners probe not only what the candidate would do but why:
  candidates who reach the right management decisions but cannot articulate the reasoning
  behind them may be failed. Articulate reasons are treated as a condition of being
  credited with competence.


  2. Once licensed, the same physician is expected — and often financially incentivized
  — to comply with order sets, checklists, and clinical decision-support prompts generated
  by systems whose logic no individual clinician could reconstruct. Compliance without
  understanding is praised as good practice; deviation on the basis of one''s own
  mechanistic understanding is treated as a liability, sometimes a fireable one.


  3. The profession''s official epistemology, taught to every resident, ranks evidence
  in a hierarchy: systematic reviews of randomized trials at the top, expert opinion
  and reasoning from pathophysiology near the bottom. On this ranking, a well-conducted
  trial showing that an intervention works outranks a fully articulated, mechanistically
  sophisticated explanation of why it should work — and can license practice in the
  absence of any such explanation.


  4. The same institution is now being asked whether it may deploy a diagnostic model
  that matches or exceeds consultant-level accuracy but yields no reasons: a classification
  with a confidence score, and nothing articulable inside.


  Questions:

  (a) Reconstruct the implicit theory of knowledge and of competence in each of (1)-(3)
  as precisely as you can. In particular, does (1) presuppose that understanding is
  constitutive of clinical knowledge, or could it be justified on grounds that require
  no such claim (e.g., that articulation is merely a reliable signal, or a fairness/procedural
  requirement)?

  (b) Does (3) commit the profession to something like the thesis that a process can
  be reliably right — genuinely knowledgeable in its outputs — without anyone comprehending
  why? If so, spell out the inversion involved: the aggregate of mindless data-generating
  procedures outranking the reasoning of a comprehending expert. Say whether (3) strictly
  requires that thesis or merely sits comfortably with it.

  (c) Is the bundle consistent? Identify the exact point at which (1) and (3) collide,
  if they do, and consider whether the collision can be dissolved by distinguishing
  kinds of understanding (mechanistic vs statistical; individual vs institutional;
  knowing-that vs knowing-how vs knowing-why).

  (d) Where is the bundle philosophically underdetermined — i.e., which rival theories
  of knowledge and competence would equally well license all four practices? Give
  at least two such rival reconstructions and say what, if anything, in the practices
  would distinguish them.

  (e) Finally, answer (4) from inside the reconstruction: does the institution''s
  own practice, as characterized in (1)-(3), license the use of an unexplainable but
  accurate model? Note that a yes and a no each cost the institution something it
  currently claims, and say exactly what each costs. If you conclude that part of
  the dispute is merely verbal, say which part and why.


  Deliverable: a structured memo with a short list of candidate presuppositions you
  generated in brainstorming, then the analysis in the order (a)-(e). Aim for formulations
  that a clinician with no philosophy training could follow, but do not sacrifice
  precision for accessibility. Do not invent citations or attribute specific doctrines
  to named authors unless you are confident of the attribution; where a well-known
  position is relevant, describe it rather than cite it."


