  My commitments:


  1. I am an anti-essentialist about life. There is no natural kind here; "living"
  is a cluster term, and the systems we call alive shade into the non-living by degrees.
  I want to be careful about what I mean: I take this gradation to be a feature of
  the world, not merely an artefact of our present ignorance. Better instruments would
  not resolve it.


