  Content plan for the essay draft (titled something like "Which Closure? Triviality
  and the Language We Do Not Speak"):


  Section 1: Setup. Adams''s thesis / the equation P(A→B) = P(B|A) for all probability
  functions P over a language containing conditionals. Lewis''s result: if the language
  is closed under the conditional and the equation holds for all sentences and all
  probability functions, then any such P must satisfy P(B|A) ∈ {0,1} — triviality
  (P is concentrated on a set of worlds... more precisely: for every A with P(A) >
  0 and every B, P(B|A) is 0 or 1). Consequence drawn by many: conditionals aren''t
  truth-apt; go suppositional/pragmatic.


  Section 2: The distinction the essay wants to press. The equation''s force depends
  on three separable closure conditions:

  (i) Closure under embedding: conditional sentences can appear as parts of bigger
  sentences, in the scope of negation, conjunction, and — crucially — inside other
  conditionals and inside the antecedent of a conditional.

  (ii) Closure under conditioning (what Lewis calls generalised conditionalisation
  in the Postscript): the equation must hold not only for unconditional probabilities
  but also for conditional probabilities of conditionals — i.e., P(A→B | C) = P(B
  | A∧C) whenever P(A∧C) > 0.

  (iii) Closure under the algebra: the set of sentences in the range is closed under
  the conditional operator so that the equation must hold for arbitrarily nested compounds.

  And a fourth, often invisible: (iv) universality over probability functions — the
  equation must hold for every probability function on the algebra, not just for the
  ones that are reasonable/regular/rationally permissible.


  Thesis: the triviality result requires (ii) and (iv) essentially; (i) and (iii)
  are doing something different. And the literature''s later results (the "compounds
  of conditionals" line: the thesis for sub-families of sentences; results showing
  that even restricting the range of the equation to unembedded conditionals, or even
  to a single pair of sentences, suffices for triviality, provided you keep conditioning)
  sharpen this. The interesting upshot: what''s mandatory is not the richness of the
  language but the demand that the equation survive conditioning on arbitrary evidence.


  Section 3: The neglected response and its cost. The "hyper-space" style models:
  build a space of higher-order opinion states — points that encode sequences/orderings
  of base worlds — so that conditional sentences denote sets of these higher-order
  points and the equation holds, non-trivially. The essay''s diagnosis: these models
  buy the equation by sacrificing (iv): they work because the probability function
  is not free — it''s pinned to the base space by the construction, and the higher-order
  space is a device for representing the *family* of conditional probabilities at
  once. So the equation holds for the special function induced by the construction,
  not for all functions. Cost: the resulting iteration behaviour. In such models,
  P((A→B)→C) is not P(C | A∧B) in general; it''s something like P(C | A) restricted/conditioned
  in an exotic way; and the value of a nested conditional depends on the higher-order
  point''s ordering. So the models don''t vindicate the intuitive discipline we actually
  have about nesting ("if it rains, then if the match is cancelled, we''ll be home"
  — hmm, careful: actually the intuitive discipline is Adams-style right-nesting:
  (A→B)→C = A→(B→C), which Lewis showed fails; van Fraassen-style models also violate
  it or satisfy it only in degenerate cases).


  Section 4: The essay''s own positive claim (the injected new idea): the choice point
  isn''t semantics vs. supposition. It''s *which closure condition you treat as constitutive
  of the subject matter*. Formulate a small taxonomy with named positions:

  - Closure-first (semantic) views: hold (i)+(iii), give up the equation for conditional
  probabilities → get a theory of unembedded conditionals as propositions, and treat
  the equation as a normative bridge that holds only at the top level (this is roughly
  where "the equation as a constraint on credences, not a meaning postulate" lands).

  - Conditioning-first views: hold (ii)+(iv), give up embedding → suppositional/expressivist
  views (Edgington): conditionals don''t express propositions; the equation is preserved;
  nesting handled by a separate, non-truth-conditional account of embedded uses.

  - Function-first views: hold embedding and (ii) but reject (iv) → hyper-space/Popper-function
  models: the equation is a property of the *right kind* of credal state, not of every
  one.


  Claim: (a) the triviality theorem is silent between these three, because it only
  shows the conjunction of all the closure conditions is inconsistent; (b) the debate
  has been mis-framed as "does the equation hold?" when the real question is "for
  which probability functions and under which embeddings must it hold?"; (c) there''s
  an argument, from the epistemology of learning, that (iv) is the least dispensable
  — because the equation''s job is to survive conditionalization on new evidence,
  and rejecting (iv) means the equation holds only for credal states you could never
  be sure you''re in; and therefore Function-first views pay a hidden price: they
  make the correctness of your conditional credences unknowable from inside. Whereas
  (i)/(iii) — embedding — are, the essay argues, the genuinely dispensable ones, since
  ordinary speakers'' embedding data is thin and mostly parasitic on pragmatic strengthening.


  Then conclusion: so triviality doesn''t refute truth-conditional semantics for conditionals;
  it refutes the package. And the interesting open question is a formal one: characterize
  exactly which pairs (set of sentences for which the equation holds, class of probability
  functions) are jointly satisfiable on a non-trivial algebra — a satisfiability map
  rather than a single theorem.


  Section 5 (flagged as a worry / request): the essay is unsure whether claim (c)
  survives the objection that the equation is supposed to be a meaning postulate for
