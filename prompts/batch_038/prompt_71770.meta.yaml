  ---

  Title: Nothing Is About Anything (Including Searle''s Brain)


  Everybody says there are two kinds of aboutness. Derived intentionality belongs
  to things like words on a page, road signs, the little shapes a computer stores
  in memory: they''re about stuff only because someone with a mind treats them that
  way. Original intentionality belongs to minds themselves, and its supposed to not
  need anybody''s help. Searle''s whole campaign is that you can''t manufacture the
  second kind out of the first, because a bunch of derived symbols can only ever inherit
  their meaning from an interpreter, and interpreters have to already have original
  intentionality.


  Dennett attacks this with the two-bitser. The idea, roughly: take a tiny physical
  device with two states, something like a flip-flop, and wire it into a circuit.
  In one setup its state A means 0 and its state B means 1. Move the device somewhere
  else - replug it, invert a connection, whatever - and now A means 1 and B means
  0. Nothing intrinsic to the device changed. Same two physical states, same voltages.
  What changed was its context, and the context is what settles what the states are
  about. So the physical state never had its meaning "in itself" to begin with; it
  was always borrowed from the arrangement it sits in. Dennett''s punchline is that
  this is true of neurons and people too, just with a lot more of them and a lot more
  of the arrangement, so there''s no clean line where derived aboutness stops and
  original aboutness starts. It''s all one gradient, and calling the top of the gradient
  "original" is just a compliment we pay ourselves.


  My argument is that Searle''s side actually makes Dennett''s case better than Dennett
  does, which sounds weird, so here goes.


  Searle''s reason the two-bitser doesn''t worry him is that the meaning is in the
  interpreter''s head, not the device. Fine. But then ask: what makes an interpreter
  an interpreter? The answer Searle gives is that the interpreter has original intentionality,
  i.e. states that are about things without borrowing that aboutness. Now notice that
  "original" here is doing all the work by definition - it''s just the label for whatever
  is at the top of the borrowing chain. It''s not an independent property you could
  go and detect. So the debate quietly becomes: is there anything at the top of the
  chain? And here''s my problem for Searle. Suppose we grant him his brain. The brain
  is a physical object sitting in a physical universe. Who is interpreting the brain''s
  states? Not us - if my belief that it''s raining were about rain only because you
  or I read it that way, then it wouldn''t survive being alone on a deserted island,
  and it obviously does. Not the brain itself, unless Searle is willing to say a system
  interprets its own states, which is exactly the circular thing he says computers
  can''t do. So nobody. And if nobody is interpreting them, then by Searle''s own
  standard - a physical state is about something only if something interprets it as
  being about that thing - his brain states aren''t about anything either. Searle
  can either accept that there''s no such thing as original intentionality, which
  is Dennett''s conclusion, or he can accept that being-about doesn''t require an
  interpreter after all, which removes the only reason he had for thinking the two-bitser
  can''t be genuinely about something.


  The example I like for this: imagine a recording studio that''s been running for
  a hundred years with nobody in it. The reels capture the state of the room, and
  if you played them back you could reconstruct exactly what happened, the chair scraping,
  the rain on the roof, a bird that flew in once. Those recordings are about the room
  in a real sense - there''s a fact of the matter about whether a given stretch of
  tape matches what happened. But nobody ever interpreted them, not once. Searle wants
  to say they''re not really about anything, only potentially about something, waiting
  for a listener. I want to say: either "potentially about" is a real kind of aboutness,
  in which case there are at least three grades and not two, or it isn''t, in which
  case the tapes are genuinely about the room without an interpreter, and the same
  goes for a neuron or a person.


  Conclusion: the original/derived distinction isn''t a distinction between two kinds
  of content, one self-sufficient and one borrowed. Its a distinction between content
  that happens to have an interpreter standing by and content that doesn''t. And since
  almost nothing has an interpreter standing by, either everything is derived, which
  just means the word stops doing work, or nothing is. Searle''s argument against
  strong AI depends on the second horn being available, and it isn''t.

