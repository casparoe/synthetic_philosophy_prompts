  the loss of a text is what makes people doubt its continuous transmission/authenticity.
  So there''s a real question: why does the loss help him? Because it explains gaps,
  and because it blocks the objection "if this book existed all along, why don''t
  we see its influence in the earlier kings'' reigns?" i.e., the loss functions as
  an auxiliary hypothesis absorbing disconfirming evidence.


