  Actually here''s a sharper, more interesting version, with a genuine equivocation
  that''s easy to miss:


  (1) Blame is appropriate only if the agent could reasonably have known better.

  (2) What an agent could reasonably have known is fixed by the epistemic situation
  they were in — the evidence and interpretive norms available to them.

  (3) Interpretive norms are not chosen; they''re inherited from one''s community.

  (4) So an agent whose community''s norms permitted A could not reasonably have known
  A was wrong.

  (5) Hence such an agent is not blameworthy for A.

  (6) Now generalize: every agent inherits norms from some community.

  (7) So no agent is ever blameworthy for anything their community''s norms permitted.

  (8) And for anything their community''s norms *forbade*, the agent''s condemnation
  is just the community speaking through them, not a personal achievement — so there''s
  no praiseworthiness either.

  (9) Therefore blame and praise are both empty; the reactive attitudes have no proper
  objects.

  (10) But that is intolerable: it would mean the abolitionist who spoke against the
  norms of his community did nothing more praiseworthy than the slaveholder who conformed
  to them.

  (11) So one of (1)–(4) must go.


  The flaw: (4) slides from "norms are inherited" to "the agent could not reasonably
  have known better" — inheritance doesn''t preclude criticism; a norm being inherited
  doesn''t make dissent epistemically inaccessible (evidence of victims'' testimony,
  internal inconsistency with the community''s own professed principles — e.g., the
  Declaration''s equality clause vs. chattel slavery — is available from within).
