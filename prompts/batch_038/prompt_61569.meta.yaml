  Draft:


  "Molinism is usually presented as a three-stage account of divine knowledge: by
  natural knowledge God knows all necessary truths and the whole space of genuinely
  possible creatures and circumstances; by middle knowledge God knows, prior to any
  decree of the divine will, every true counterfactual of creaturely freedom — that
  is, every truth of the form *if this possible creature existed and were placed in
  these complete circumstances, it would freely do such-and-such*; and by free knowledge
  God knows, subsequent to the decree, which world he has actually chosen to bring
  about. The providential payoff is supposed to be decisive: because God knows what
  every possible free creature would do in any situation, he can select a set of circumstances
  in which creatures freely cooperate with his plan, thereby weakly actualizing a
  world he wants without causing a single free act. The doctrine''s principal difficulty
  is the grounding objection: if a counterfactual of creaturely freedom is true before
  God wills anything and before the creature exists or acts, what is it that makes
  it true? The truth seems to float free of any truthmaker, and if the creature could
  do otherwise there seems to be no fact of the matter for God''s knowledge to latch
  onto.


  I am considering an unorthodox response that accepts the grounding objection and
  nevertheless claims to retain Molinism''s providential advantage. Call it the capacity
  account of middle knowledge. Its commitments:

  1. There are no truths of the form "if C existed in circumstances S, C would freely
  do A." Such conditionals are systematically neither true nor false.

  2. Nevertheless, prior to any decree, God possesses a non-propositional practical
  capacity — divine know-how rather than a body of know-that — the exercise of which
  yields, for any creative option he contemplates, an ordering of the outcomes he
  should expect. The capacity is to God''s planning what a master player''s read on
  an opponent is to the player''s choice of move: it issues in expectations and dispositions
  to act, not in a database of conditionals.

