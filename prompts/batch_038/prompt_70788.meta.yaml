  like an independent read on this particular script before I lock it in. I have about
  40 more to get through by friday so I need to be able to trust the comments I write.


  Here''s the question exactly as it appeared on the exam. Throughout the course we
  used two labels for the two moves in the standard argument from Libet''s clock experiments,
  and the question uses them without redefining them, so for your benefit: the "timing
  premise" is the claim that the reported onset of the conscious urge comes after
  the onset of the relevant preparatory brain activity, and the "causal-relevance
  premise" is the claim that an event can only cause the movement if it precedes the
  movement''s initiation in the brain. The exam read:


  Question 3 (25 points). You may not cite literature; answer from lecture and your
  own reasoning.

  (a) [10 pts] State the timing premise and the causal-relevance premise. Which of
  the two does the readiness potential data from Libet''s clock experiment actually
  license, and what would have to be added to get from the data to the conclusion
  that conscious intention plays no causal role in voluntary action?

  (b) [8 pts] Libet himself did not think his results eliminated free will. Explain
  the role the veto is supposed to play in his account, and evaluate whether it can
  do that work.

  (c) [7 pts] Schurger and colleagues proposed a stochastic accumulator reinterpretation
  of the readiness potential. Say what changes for the argument in (a) if they are
  right, and what does not change.


  And here''s the student''s answer, unedited (they typed it in the exam portal):


  "[answer]"


  The answer:


  "(a) In Libet''s set-up subjects sat in front of a modified oscilloscope with a
  dot sweeping round a clock face, and were told to flex a wrist or finger whenever
  they felt like it, at an arbitrary time of their own choosing. EEG was averaged
  backwards from EMG onset, which served as time zero, and subjects reported the clock
  position at which they first became aware of the urge to move. The readiness potential
  begins about 550 ms before EMG onset, whereas the reported awareness of the urge
  falls about 200 ms before it. So the timing premise is well supported: the conscious
  urge is reported as arising some 350 ms after preparatory activity in the supplementary
  motor area has already begun. The causal-relevance premise is a further, philosophical
  claim and Libet''s data do not by themselves establish it — you need the extra assumption
