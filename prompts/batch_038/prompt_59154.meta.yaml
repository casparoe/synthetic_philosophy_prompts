  Here''s the system, because my opening move depends on it. At work I maintain a
  controller for a water treatment skid. There''s a 16-bit field in a status packet
  that used to be a plain message counter. Last year someone repurposed it as a CRC
  because we needed integrity checking and didn''t want to touch the wire format —
  the old counter module is still in the code, still compiled in, still wired to a
  pump, because nobody dared delete it. So today the identical 16 bits are read one
  way by a module that treats them as a count and drives a pump, and another way by
  a module that treats them as a checksum and drives an alarm. Both readers are causally
  hooked up to hardware. Both fire. When they disagree about whether the packet is
  fine, they disagree, and the skid does two different things at once. There''s no
  fact, in the physics of the box, about which reading is "the real" one; there''s
  just the wiring and the history of the codebase.


  My opening move: you want to say my box has no beliefs of its own, only what we
  lend it, while my brain has beliefs intrinsically. But look at what my box actually
  forces you to say. On the functionalist''s own account, the box is a *bad* candidate
  for belief-talk, because there''s no single coherent set of beliefs that makes sense
  of what it does — so your opponent has to either split it into two subsystems or
  give up ascribing beliefs to it at all. Either way the ascription is doing no work.
  Now apply that test to me: what would have to be different, in a fact anyone could
  ever check, between my brain and a functionally identical box that also gets to
  have intrinsic aboutness? If the answer is "the conscious feel," then the feel isn''t
  causing anything either, and you''ve made your own thesis uncheckable. So which
  is it — and please answer with the actual fact you''re claiming differs, not with
  a redescription of why it has to differ.


