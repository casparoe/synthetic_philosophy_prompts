  I chair the Rules Committee of a university games society that has run a continuous
  game of Nomic — Hofstadter''s game in which proposing rule changes is itself a move
  — for about nineteen years. The society''s rulebook is short and entirely home-grown
  apart from the opening rules. Three provisions matter here:


  - Rule 101: Any member may submit a proposed amendment in writing at least one week
  before a general meeting; an amendment is adopted if at least two-thirds of the
  members present and voting vote for it.

  - Rule 104: These rules may be amended only in the manner set out in Rule 101.

  - Rule 106: Where these rules are silent or in doubt, the Rules Committee shall
  determine their meaning; its determination binds the society until the rules are
  amended.


  Last month a member submitted Amendment 214, which passed 24–3. It does three things:


  1. It adds Rule 111, providing that no member may be removed from the game, or deprived
  of a vote, except at their own written request.

  2. It adds Rule 118: "Rule 111 may not be amended, repealed, suspended or circumvented,
  now or at any time, by any procedure whatsoever, including by any amendment of Rule
  118."

  3. It adds Rule 119: any future amendment purporting to violate Rule 118 is void
  and of no effect, whatever the vote; and a severability clause providing that if
  any part of Amendment 214 is void the remainder takes effect.


  Three members have now asked the committee to declare the whole thing void and expunge
  it from the record, and I spent most of last night arguing with the loudest of them,
  who is also a philosophy graduate student. [then the friend''s arguments]


  His case, roughly: (a) Rule 101 confers the amendment power, and a body exercising
  a conferred power cannot use it to take the power away from those who will hold
  it later — otherwise the current members are legislating for people who never consented;
  (b) Rule 118 is self-referential: it purports to protect itself, which he says is
  the standard paradox of self-amendment, a rule cannot validate the destruction of
  the rule that validates it; (c) our constitutional-law maxim, no legislature can
  bind its successors, which he glosses as the choice between "continuing" sovereignty
  (the amending power always survives, so entrenchment is impossible) and "self-embracing"
  sovereignty (a body can use its power once to limit how it is used later); he insists
  a mere game must be on the continuing side; (d) pragmatically, if entrenchment works
  once it works forever, and the society could next month entrench a rule that ends
  the game, or one that says the chair''s word is law, and there would be no way back.


  My side: Rule 101 says nothing that excludes entrenchment; Rule 104 makes Rule 101
  the only route, and 214 took that route; a rulebook that cannot protect anything
  cannot protect a member from expulsion by a bare two-thirds, which is what the club
  actually wanted 214 for; and the "no binding successors" maxim is a doctrine about
  sovereign legislatures, not about a private association''s contract with its own
  members, which is where we all thought entrenchment was uncontroversial (e.g. a
  corporate charter provision requiring a supermajority, or an entrenched clause in
  a treaty or constitution).


