  Draft:


  ---


  For eleven years I worked at a proxy-advisory firm, and I now run a four-person
  research team that maintains a proprietary governance scorecard for what we call
  controlled companies — firms where a founder, a family, or a government holds enough
  ordinary votes, or a class of stock with enough votes per share, to determine outcomes
  no matter what the minority holders want. The scorecard runs on dimensions like
  the independence of the audit and remuneration committees, the disclosure and approval
  requirements around related-party transactions, whether a dual-class structure has
  a sunset date, the minority approval threshold for fundamental transactions such
  as going private, the degree of information symmetry between controller and minorities,
  and whether the firm has a credible succession plan and key-person risk is priced.
  My colleagues and I think natively in this vocabulary: controlling shareholder,
  agency cost, tunneling, bonding mechanism, credible commitment, exit and voice,
  stewardship code, business judgment rule, residual claim. My political philosophy
  is close to nil — I''ve absorbed it secondhand from magazines and podcasts — and
  I don''t want the debate I''m about to describe explained to me in plain English.
  I want it translated into my vocabulary, and I want to know what breaks in the translation.


  Here''s the debate. A regime has delivered three or four decades of rapid growth,
  pulled several hundred million people out of subsistence agriculture, kept violent
  crime low and contract enforcement predictable, and it has done all of this without
  competitive elections for national leadership. Its defenders argue that this is
  enough — that a government which supplies prosperity and order has earned the right
  to rule, and that authorization by the governed is a Western procedural fetish.
  Political scientists have a distinction for this, between legitimacy that comes
  from what a government delivers and legitimacy that comes from how its rulers are
  chosen; the economist''s version is Mancur Olson''s stationary bandit, the idea
  that a ruler who expects to be in place long enough to collect the returns has an
  encompassing interest in his domain and will therefore supply public goods rather
  than loot. The critics say the arrangement is self-undermining: performance legitimacy
  sets a benchmark that has to keep moving, it gives the ruler no way to commit credibly
  to the rules he announces, it removes the only mechanism that lets a society change
  leadership without violence, and it treats citizens as beneficiaries of good management
  rather than as the source of authority. I want both sides of this rendered, term
  by term, in the language of my scorecard. The state as controlled company; the leadership
  as the controller; citizens as minority holders with no exit; growth and public
  goods as returns; elections and constitutional limits as minority protections; censorship
  and managed information as information asymmetry maintained by the controller; the
  suppression of protest as the elimination of derivative suits and shareholder proposals;
  legitimacy as whatever it turns out to be. Do it as faithfully as you can, and then
  tell me whether my scorecard already contains an answer to the political question
  and, if it does, at which line item the answer was smuggled in.


  Then the residue report, which is what I actually want. Take the central claims
  of each side and sort them: which translate cleanly, which translate only with a
  distortion you should name, and which have no counterpart in the vocabulary at all.
  Test some specific suspicions of mine... [list four]. And tell me which way the
  residue cuts: does my framework simply lack the concepts to express something real
  about political authority — in which case our scorecard is measuring something narrower
  than we think and should stop implying otherwise — or does the failure to translate
  show that the original debate was less clear than it sounded, and that talk about
  the right to rule is mostly talk about the risk-adjusted durability of a control
  arrangement?


  Finally, run the translation on three cases so I can see whether it gives the verdicts
  I expect... China..., Singapore (regular competitive elections, one dominant party
  since independence, world-class delivery, an information environment and a succession
  process that our scorecard would flag hard) — does Singapore come out as a well-run
  controlled company with weak minority protections, or is there something in the
  political description that the governance description cannot hold? — and a rentier
  state with poor delivery and no elections, where my scorecard and the political
  verdict should come apart.


  Two things to avoid. Don''t settle the question by definition — don''t translate
  "legitimate" as "durable" or "value-maximizing" and then report that the debate
  dissolves; that''s a substitution, not a translation, and I''d rather you told me
  the term has no counterpart. And don''t assume that property rights, contract enforcement,
  and the courts that interpret them are pre-political background my scorecard can
