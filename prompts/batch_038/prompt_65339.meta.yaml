  fixed; it depends on how quickly each token passes from hand to hand and on how
  finely the accounts are divided, both of which a sovereign may adjust at will.

  (4) Therefore the limits on a nation''s wealth are the limits of its labour and
  its organisation, not the limits of its money, and a sovereign who controls the
  tokens can never fail for want of them.

  (5) Hence the miseries of 1720 — and of any scheme that follows — arose not from
  too much paper, but from paper issued against nothing, by men who had no power to
  compel its receipt.

