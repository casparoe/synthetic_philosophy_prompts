  (1) Money has no value in itself; it is a token whose worth derives entirely from
  the industry it sets in motion.

  (2) If the worth of a token derives from the industry it sets in motion, then any
  amount of tokens, duly authorised and received, is capable of setting the whole
  available labour of a nation in motion.

