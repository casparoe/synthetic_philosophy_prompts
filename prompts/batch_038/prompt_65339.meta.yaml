  Hmm, this is good but has a risk: step (3)''s velocity idea and (5)-(6) about land-backed
  notes are actually pretty Berkeleyan, and the "proves too much" is genuine. The
  diagnosis: (2) equivocates between "tokens can be instruments of mobilising labour"
  and "any quantity of tokens will mobilise all labour"; there''s a difference between
  money as a counter in a closed system of accounts and money as a store of value
  / claim on future output; the token theory doesn''t imply tokens are neutral in
  quantity because the *proportion* of tokens to transactions affects their purchasing
  power (Berkeley himself acknowledges value varies with quantity and circulation);
  (4) slides from "money is not a constraint on real output" to "sovereign can never
  fail for want of money" — but a sovereign who issues tokens without limit destroys
  the confidence/expectations that make them function as counters, and there''s a
  difference between *authorising* and *compelling receipt* at a fixed value: legal
  tender can compel acceptance at par but cannot compel people to produce or to hold,
  and it can''t stop them from pricing in other units. Also (5) is arguably false:
  paper issued against land can also over-issue; land backing limits quantity only
  if it limits quantity, which a sovereign may override. So the real flaw: the argument
  confuses the *function* of money with the *incentive structure* it supports, and
  confuses a sovereign''s power to designate a unit of account with a power to determine
  real balances, prices, and the willingness to lend.


  Also there''s a subtle equivocation: "any amount of tokens duly authorised and received
  is capable of setting the whole available labour in motion" — this is false because
  the tokens must be *distributed* to those who would hire labour, and issuing them
  creates claims that must be redeemed or accepted; also because the tokens need not
  be *demanded as tokens* — if people expect them to depreciate, they''ll not accept
  them for future-dated work (i.e., velocity adjusts, but so does the price level;
  the sovereign can''t fix both).


