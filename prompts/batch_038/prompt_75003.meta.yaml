  ---


  I am drafting a short paper for a political philosophy workshop and would like sharp
  critical comments on it — not a summary, and not encouragement. The draft follows;
  specific questions come after it.


  **Title: The Dormant Draft: Conscription in Abeyance and the Problem of Unexercised
  Power**


  The philosophical debate about conscription is conducted almost entirely on one
  metric: interference. How many people are compelled, for how long, on pain of what
  penalty. On that metric an all-volunteer force is the least coercive arrangement,
  universal conscription the most, and a selective draft falls somewhere in between
  depending on how selective it is. My claim is that the metric is too coarse to distinguish
  three actually existing European arrangements, and that once it is refined the rankings
  reverse in a way that matters.


  Consider Finland. About four-fifths of each male age cohort serves; the service
  period runs from 165 to 347 days, civilian service is a year, and refusal of both
  draws a fixed custodial sentence. Interference here is maximal. Yet the claim the
  state holds is almost entirely non-discretionary: it attaches by rule to everyone
  in the cohort, on a published schedule, appealable to a standing board, and the
  state cannot plausibly direct it at particular people. A Finnish conscript knows
  to a month what will be taken from him and when.


  Now consider Sweden between 2010 and 2017. In 2010 conscription was not repealed
  but paused; the statute creating the general duty to serve was left standing, and
  in 2017 the government reactivated it by decision, citing the security environment,
  without new primary legislation. The reactivated system surveys an age cohort of
  roughly 100,000 and selects on the order of 4,000 for twelve months of training
  — and it is backed by real sanctions: the first custodial sentences for draft evasion
  since the reintroduction were handed down in 2019. Interference, in any given year,
  is close to zero. What the citizen carries instead is a standing liability: the
  state holds a switch, and the switch is already wired.


  Switzerland adds a third configuration. Those found unfit for service pay an exemption
  tax — three per cent of taxable income, up to a capped number of years — and each
  day of civil protection service credits four per cent off that year''s tax. Switzerland,
  in other words, publishes an exchange rate between days of life and kroner...


  Hmm, Swiss francs. Yes, francs.


  Switzerland publishes an exchange rate between days of service and money, which
  is precisely what the inalienability intuition — the idea that the duty to serve
  is not the kind of thing that can be discharged by paying — denies.


  Here is the concept I want the paper to isolate. Call it an obligation in abeyance:
  a duty that has been created, never repealed, and not presently owed to be discharged,
  which the duty-holder can activate unilaterally at a time of its own choosing. It
  is not a mere legal power to legislate in future, since no new law is required.
  It is not a conditional obligation of the ordinary kind, since the condition lies
  wholly within the obligee''s control. And it is not a permission, since the obligated
  party has no equivalent power to switch it off. I think this category is doing real
  work in the Swedish case and is invisible on the interference metric.


  My proposed way of seeing it is Pettit''s. Freedom as non-domination is a claim
  about exposure to arbitrary interference, not about interference actually suffered,
  and that is exactly what a dormant draft creates: exposure without exercise. The
  analogy I keep reaching for is the suspended sentence, or a landlord''s reserved
  right of entry on notice — arrangements that are near-costless in interference terms
  and intuitively objectionable in a way interference-talk cannot capture.


  But this generates a dilemma I cannot yet solve, and it is the main thing I want
  comments on. On Pettit''s own criterion, interference is arbitrary only if it is
  not forced to track the interests and opinions of those subject to it. Sweden''s
  activation was legally constrained, publicly reasoned, applied to a whole cohort
  by published criteria, and endorsed retrospectively by a political process that
  had abolished it seven years earlier. So the republican should perhaps say this
  is not domination at all, only a highly conditional duty — in which case non-domination
  collapses back into interference here and buys me nothing. If instead the republican
  insists the dormant draft is domination, then the theory is committed to ranking
  a system that compels four per cent of a cohort worse than the Finnish system that
  compels eighty, which is a verdict few will accept and which I am not sure I can
  defend. Either way the concept of abeyance seems to lose its theoretical payoff.


  Comments I want:

  1. Is "obligation in abeyance" a genuine carving, or a redescription of a conditional
  duty plus a legal power that does no new work? If it does no work, where exactly
  does it fail?

  2. Does the dilemma in the last paragraph hold, or is there a republican reply —
  e.g., that arbitrariness attaches to selectivity once activated rather than to dormancy
  as such, or that the relevant comparison is not Finland vs Sweden but Sweden-2016
  vs Sweden-2010?

  3. Am I right that the Swiss exemption tax is a counterexample to the inalienability
  framing, or is a tax on non-service something other than a price on service (it
  is levied on the unfit, who arguably cannot perform at any price)?

  4. Are the institutional facts as stated? If any is wrong or has changed, tell me,
  since the whole comparison depends on them.

  5. Name the strongest objection to the paper that I have not stated.


