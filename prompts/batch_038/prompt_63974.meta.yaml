  I am preparing a written statement of my own position for a bioethics reading group
  on reproductive selection and enhancement. The group has asked each member to set
  out their commitments in advance so they can be examined, and I would like a rigorous
  consistency check on mine before I circulate it. Here they are, in the order that
  seems natural to me rather than in order of importance:


  1. Procreative beneficence, in something like its standard form: when prospective
  parents can choose among the children they might have, and have relevant information
  bearing on how those lives would go, they have a genuine moral reason — not a mere
  preference — to choose the child whose life can be expected to go best.


  2. That reason is not enforceable. No state may compel selection, forbid it, or
  attach penalties to particular choices; and the state should not fund enhancement.


  3. I accept the social model of disability. Disability is constituted in large part
  by socially erected barriers and by others'' attitudes rather than by impairment
  as such, and being disabled does not, in itself, make a life go worse. The testimony
  of disabled people about their own quality of life counts as strong evidence on
  this question.


  4. Prenatal screening followed by selective termination is permissible, and often
  the right course, where the condition diagnosed is one I would call serious — by
  which I mean one involving chronic pain or a drastically shortened life.


  5. The non-identity objection does not worry me. Where an alternative child would
  have had a better life, choosing the child with the worse life wrongs no one, since
  no one is deprived of anything they otherwise would have had; and the child who
  is never conceived cannot be wronged at all.


  6. I am a welfarist about what makes one expected life better than another: expected
  well-being, and nothing else. I reject perfectionist lists — achievement, knowledge,
  agency, species-typical functioning — as independent grounds for selection.


  7. Enhancement beyond therapy is permissible, and justice requires that access to
  it be genuinely equal, so that enhancement does not entrench or amplify existing
  inequality.


  A case verdict, so that the abstractions have something to bite on: given a choice
  between an embryo predicted to have a mild cognitive impairment and one predicted
  not to, I think the parents have a real moral reason to choose the second, and I
  think that reason is not exhausted by the social costs the family would bear.


  I have no settled view about which of these I would abandon, so please do not try
  to guess my preference or to reconstruct the set as coherent out of charity. What
  I want is an audit: which of these genuinely pull against one another and which
  merely look as though they do; a ranking of the genuine conflicts by severity rather
  than a flat list; for each, what specifically would have to be given up or narrowed,
  and the least costly repair available; and finally, which single revision would
  clear the greatest number of problems at once. I am not looking for a survey of
  the literature or for references — only for the tracing of what commits me to what.


