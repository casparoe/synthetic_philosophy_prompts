  You are acting as a philosopher of mind who also reads the empirical literature
  on visual awareness with professional care — masking, iconic memory and partial
  report, change and inattentional blindness, blindsight, and the neuroimaging work
  on reportability. I am preparing a handout for a graduate seminar that will spend
  two sessions arguing about whether phenomenal character can outstrip everything
  a subject can report, attend to, or otherwise use. The seminar is split, and the
  split does not track the labels people use, so I want an instrument that reveals
  what a person is already committed to when they answer questions about cases.


  Deliverable: a decision tree that sorts a seminar member into a named position on
  the access/phenomenal consciousness debate. Think carefully before writing, and
  begin with a brainstorming stage you show me:


  Stage 1 — the logical space. List the independent claims that genuinely separate
  the positions (about reportability, the necessity of attention, the capacity of
  working memory, whether phenomenal character can be more fine-grained than any discriminative
  ability, what a higher-order state is supposed to add, whether there is any further
  fact beyond first-order representation, and anything else you think belongs). For
  each pair of claims, say whether they are logically independent or whether one entails/undermines
  the other; where two candidate questions are dependent, say which one you keep as
  a node and why. Give me a rough count of the combinations your claims permit.


  Stage 2 — the tree. ... etc.


  Then constraints, required leaves, required features, format, and a final self-check.


  Let me write the required leaves:

  1. global workspace theory / global ignition required for consciousness;

  2. a localist or recurrent-processing view on which conscious visual experience
  needs only local processing and can outrun report and attention;

  3. a higher-order thought/state theory on which a first-order state is conscious
  only in virtue of a suitable higher-order representation;

  4. first-order representationalism that accepts there is a real distinction in function
  but denies any further phenomenal fact beyond poised representational content;

  5. a "rich" overflow view on which phenomenology exceeds access even in ordinary
  seeing;

  6. an illusionist/deflationary view on which talk of inaccessible phenomenology
  is a misdescription produced by the very access mechanisms;

  7. any leaf you think the logical space permits but nobody defends — mark it "unoccupied"
  and diagnose whether it''s incoherent, merely unattractive, or unexplored.


  Also require at least two empirical branch nodes: "At least two nodes must turn
  on a question that is empirical rather than conceptual. For each, say in one or
  two sentences what experimental result would decide that branch and what result
  would leave it permanently open — and describe the paradigm in plain words, since
  I am not putting a bibliography in the handout."


  Inseparable pairs: "Flag every pair of leaves your tree cannot reliably separate,
  and say what further question — if any — would separate them. I expect there to
  be at least one such pair; if your tree separates everything cleanly, that is a
  sign you have built it from labels rather than from claims."


