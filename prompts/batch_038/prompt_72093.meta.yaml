  Thesis sketch:

  1. When an autonomous system selects and engages a target, its behavior is the product
  of learned/optimized processes whose operations no single human designed, tested,
  or could have foreseen in detail.

  2. Criminal responsibility requires either intent (or knowledge/recklessness/negligence
  traceable to a human agent) or a recognized derivative doctrine (command responsibility,
  corporate liability, complicity).

  3. In the case at hand — a system commits an atrocity, and the investigation shows
  no human intended it, foresaw it, or fell below a reasonable standard of care, given
  what was knowable at the time and given the system''s certification and testing
  regime — none of the standard routes lands: the programmer lacks mens rea and causation
  in the right sense, the commander lacked effective knowledge, the manufacturer''s
  liability is civil not criminal, and punishing a scapegoat violates the retributive
  constraint that punishment must be deserved.

  4. Therefore a genuine responsibility gap exists, and the proposed doctrinal fixes
  (expanding command responsibility to "should have known," strict criminal liability
  for deployers, corporate manslaughter statutes, "electronic personhood") either
  fail to close the gap or close it by abandoning the desert constraint — which is
  a bigger moral cost than the gap itself.

  5. So the honest conclusion: some wartime harms will be nobody''s fault in the criminal
  sense, and that residual is a real cost that belongs on the deployment ledger alongside
  civilian casualties, not a puzzle to be dissolved by doctrinal ingenuity. Also:
  the gap doesn''t mean no obligations — it means obligations fall on institutions
  (compensation, investigation, design constraints), not on blameworthy individuals.


