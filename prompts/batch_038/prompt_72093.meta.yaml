  Next month I present a paper at a criminal-law-and-legal-theory workshop on the
  responsibility gap for autonomous weapon systems. My thesis is narrow and I want
  to keep it that way:


  (1) When a lethal autonomous system kills unlawfully as a result of behavior that
  emerged from its training and optimization rather than from anything a human specified,
  tested for, or could reasonably have foreseen, none of the standard routes to criminal
  responsibility reaches a person. The operator lacked the relevant mens rea; the
  commander did not know and could not have known; the programmer''s causal contribution
  is real but not culpable; the manufacturer''s exposure is civil and regulatory,
  not criminal; and each proposed fix — expanding command responsibility to a "should
  have known" standard, imposing strict criminal liability on deployers, treating
  the system or its corporate owner as a bearer of responsibility — either fails to
  reach the case or reaches it by punishing someone who does not deserve punishment.


  (2) The right conclusion is therefore not that we need a new doctrine but that some
  harms in this class will be nobody''s fault in the criminal sense, and that this
  residual is a cost to be entered on the ledger when a state weighs deploying such
  systems, alongside expected civilian casualties — not a paradox to be dissolved.


  (3) I distinguish this from the broader "accountability gap" and argue only the
  criminal one: obligations to investigate, compensate, and constrain design survive
  intact and fall on institutions rather than on blameworthy individuals.


