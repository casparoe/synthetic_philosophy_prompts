  Student answer (final draft):


  "(a) The difference is that in (ii) B isn''t arguing about whether the cruelty claim
  is true. B can accept that he was cruel and that A''s sentence accurately describes
  it, and still have something left over to object to. So what''s doing the work in
  (ii) is A''s position to make the charge in the first place — call it A''s standing.
  In (i) blame is treated as a piece of evidence: if B''s reply were taken as an argument,
  it would be the tu quoque fallacy, since A''s own behaviour tells B nothing about
  whether B behaved cruelly. Because it''s a fallacy, B''s reply can''t be making
  a point about the truth of the judgement, so it must be making a procedural point
  instead — the same kind of point you''d make if someone interrupted you or answered
  their own question in a meeting. It''s a breach of how the exchange is supposed
  to be conducted rather than a moral fault in A. Blame on this picture is something
  you do to a person, so it can be done by the wrong person even when the content
