  Consider the methodological thesis Milton Friedman advanced in the opening essay
  of his 1953 collection Essays in Positive Economics and that Paul Samuelson later
  labelled the F-twist: that a positive theory should be judged solely by the accuracy
  of its predictions about the phenomena it is meant to explain, and that the realism
  of its assumptions is not merely irrelevant but inversely related to significance
  — the more important the hypothesis, the more wildly unrealistic its assumptions
  tend to be, since such hypotheses work by abstracting from a mass of irrelevant
  detail.


  Take the career of the Phillips curve between 1958 and the early 1980s as a test
  case for that thesis...


  Then supply facts:


  The sequence, as it is usually told: A. W. Phillips fitted a stable inverse relation
  between unemployment and the rate of change of money wages in UK data from 1861
  to 1957; Samuelson and Solow, in 1960, recast it in price-inflation terms and gave
  it its name, and it entered American macroeconomic policy discussion as a menu of
  trade-offs from which a government might choose (a reading some historians of the
  period dispute). Through the 1960s the curve appeared to hold. Friedman, in his
  December 1967 presidential address to the American Economic Association, and Edmund
  Phelps independently, argued that the relation could not be exploited: it held only
  as long as workers were systematically mistaken about inflation, so once expectations
  adjusted, the long-run curve would be vertical at a natural rate of unemployment
  that policy could not permanently lower. Attempts to hold unemployment below that
  rate would produce not low unemployment but accelerating inflation. The 1970s, with
  simultaneous high inflation and high unemployment, looked like a vindication. Then,
  in the early 1980s, the Federal Reserve under Paul Volcker drove inflation down
  from roughly 13 percent to roughly 4 percent at the cost of the deepest recession
  since the 1930s — and economists promptly disagreed about whether the sacrifice
  had been larger or smaller than the expectations-augmented curve implied, a disagreement
  that has never been fully settled.


