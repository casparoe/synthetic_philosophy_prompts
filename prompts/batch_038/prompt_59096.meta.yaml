  Draft essay (~850 words):


  **Generations: stipulated extensions, accreted intensions**


  Paragraph 1: The standard framing. Social ontology asks whether generations are
  real kinds or convenient fictions; the two sides are cohort realism (cohorts are
  carved by shared exposure to history — Mannheim) and cohort skepticism/eliminativism
  (they are marketing labels projected onto an arbitrary slice of the birth registry).
  I want to argue both are answering the wrong question, because they assume a kind
  term has to be either discovered or invented whole. Generational terms are hybrid
  artifacts: their extension is stipulated and their intension is accreted, and the
  confusion arises because the stipulated extension lends authority to an intension
  that no one ever verified.


  Paragraph 2: The stipulation. Pew: retrospective baptism. Decided 2018, announced
  2019: 1996 is the last Millennial birth year, so anyone born 1981–1996 is a Millennial
  and anyone from 1997 on is Gen Z. Note the direction of fit: the institution doesn''t
  report a boundary it found; it fixes one so that its own past analyses remain "analytically
  meaningful," and because the oldest members have become "well into adulthood." And
  Pew is remarkably candid: "Generational cutoff points aren''t an exact science."
  Then, on naming: "While there is no scientific process for deciding when a name
  has stuck, the momentum is clearly behind Gen Z." That is a confession that the
  term''s meaning is settled by uptake, not by evidence.


  Paragraph 3: The one exception that proves the rule. Pew notes that the Baby Boom
  is "the only generation officially designated by the U.S. Census Bureau," on the
  basis of a surge in births after the war and a fall after 1964. So there is one
  cohort whose boundaries are read off a discontinuity in data — but the data are
  birth rates. The one generation carved at a joint is carved at a joint in fertility,
  not in character, and yet it is the generation most often credited with a psychology
  ("idealistic," "self-absorbed"). The demographic kind has been silently promoted
  to a psychological kind. That promotion, I''ll argue, is the template for all the
  others, minus the demography.


  Paragraph 4: What accretes. After the stipulation, the intension accumulates from
  journalism, marketing, listicles, and from the survey instruments themselves, which
  ask respondents to accept the label. This makes generations what I''ll call compulsory
  looping kinds: a category that partly produces what it classifies (as with psychiatric
  and sexual kinds, the classified come to describe themselves in its terms), but
  where membership is assigned whether or not you recognize yourself in the description.
  Nobody opts into being a Boomer. That combination — self-fulfilling, non-voluntary,
  and stipulated — is unusual among social kinds and it explains both the durability
  of the labels and the poverty of their content.


  Paragraph 5: Mannheim already limits this. Mannheim (1928; English translation 1952)
  distinguishes a "generational location" (mere contemporaneity of birth) from a "generation
  in actuality" (a shared consciousness formed by a common response to events) and,
  within the latter, "generational units." He insists that shared birth dates are
  not enough, that the pace of social change determines whether a location ever becomes
  a generation, and that actual generations are internally stratified by class and
  culture. Popular discourse collapses these: it reports on locations as though they
  were actualities. So the anti-realist''s evidence (that most named cohorts show
  no distinctive consciousness) is not an objection to Mannheim; it''s a confirmation.
  What Mannheim gives us is a conditional realism: generations are real when they
  are real, and we can only tell afterwards, and often the answer is no.


  Paragraph 6: The statistical skeleton. There''s a reason we can''t tell beforehand.
  In any dataset, age, period, and cohort are linearly dependent: cohort = period
  − age. So a linear cohort trend is indistinguishable from a combination of linear
  age and period trends; separating them requires assumptions imported from outside
  the data. Demographers have workarounds for particular nonlinear structures, and
  I don''t want to overstate the point — the well-documented scarring effect on people
  who entered the labor market in a deep recession is a genuine, nonlinear, cohort-shaped
  phenomenon. But the burden matters: the default decomposition a polling report uses
  is not the only one, and the "generation effect" it displays is partly a property
  of the decomposition, not of the world. [flag: check this]


  Paragraph 7: Upshot. Generations are real the way a unit of measurement is real:
  stipulated at the boundary, non-arbitrary in its consequences, and citable only
  with its standard attached. The reform I''d propose is small and dull and would
  change the discourse: require that any generation label carry its stipulation —
  "Millennial (Pew, 1981–1996, designated 2019)" — the way a laboratory report carries
  its units. Most of the claims people want to make with these terms ("Millennials
  are X") would either become trivially true, or would be revealed as claims about
  a different stipulation, or would be revealed as claims about nothing in particular.
  A few would survive, and those are the generations.


