  at a station relocated twice, one of those relocations after a flood; the scheme''s
  cost-benefit turns on it; the appraisal template has one cell for probability].
  Reading you, I thought I had found the licence to refuse that cell: probability
  and weight are different things, and a thin record gives a figure of low weight,
  possibly non-numerical, possibly not comparable with the alternatives. So I added
  a column to the register for weight. It has gone badly. My colleagues read the column
  as confidence and have begun adjusting probabilities downward where weight is low,
