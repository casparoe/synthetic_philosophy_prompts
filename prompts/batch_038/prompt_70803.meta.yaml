  a finite alphabet can be coded as a number, Gödel numbering isn''t a stretch here,
  it''s basically free.

  2. A quine is what a Gödel sentence looks like when you write it in Python instead
  of Peano arithmetic — a string that arranges to get itself out the other end. So
  when Hofstadter lines up DNA/enzymes against strings/theorems, that''s not a teaching
