  The paradox of deontology: deontological theories include agent-centered restrictions
  (constraints) that forbid certain act types (e.g., killing an innocent) even when
  doing so would minimize the total number of such acts. This is paradoxical/rational-fitting
  because the rationale for the constraint (the badness of killings) seems to support
  violating it when that would reduce killings. Scheffler coined "the paradox of deontology"
  in "Is Terrorism Morally Special?" (Philosophy & Public Affairs, 1985). Related:
  the "dirty hands" problem (Walzer, "Political Action: The Problem of Dirty Hands,"
  1973); consequentialism of rights (Sen''s "rights violation" example in a footnote
  — Sen discusses a "consequentialism of rights"/"rights-goal" view where the state
  of affairs to be promoted is fewer rights-violations); Nagel''s agent-relative vs.
  agent-neutral reasons ("War and Massacre," 1972); threshold deontology (Moore, "Torture
  and Moral Balance"; also Alexander and Moore in SEP); the "minimizing" objection
  discussed by Kamm; Regan''s "Utilitarianism and Co-operation" (1980). Also relevant
  to the paradox: the "paradox of deontology" is sometimes said to be resolvable by
  noting that deontology isn''t about minimizing bad states of affairs at all — it''s
  about the agent''s own integrity/hands being clean, or about relationships, or about
  a division of moral labor. Also: the constraint might be understood as not applying
  in the "minimize violations" case because of a lexical threshold.


  Also, key structural point: in the classic setup, the agent must violate a constraint
  (say, kill one) to prevent five others from each killing one. If the constraint
  is agent-relative, then it''s MY constraint — and the fact that others would violate
  theirs doesn''t give me a reason in the same currency. The "paradox" is generated
  only if you accept that the value of a state of affairs with fewer violations is
  what matters — which is to think agent-neutrally. Also: the asymmetry between doing
  and allowing, and between intending and foreseeing.


