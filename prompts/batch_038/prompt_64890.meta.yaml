  \ move and makes error 1 sharper.\n\nNow the student's answer. Let me draft ~450-500\
  \ words.\n\n---\nStudent's answer:\n\nThe distinction between (a) and (b) is often\
  \ said to be morally significant on the ground that assertion carries a warrant.\
  \ When W says \"I saw nothing,\" she puts her word behind a content; she invites\
  \ the tribunal to take the content from her, and she is answerable for it. When\
  \ W says \"I saw them arguing in the corridor,\" she puts her word only behind the\
  \ argument, not behind the tribunal's inference that she saw no strike. On this\
  \ view the two cases differ not in their effects — the tribunal is equally misled\
  \ in both — but in what the speaker does: in (a) she undertakes something she cannot\
  \ honour, whereas in (b) she undertakes nothing false. This is the strongest form\
  \ of the case for the asymmetry, and it does not depend on any claim about consequences.\n\
  \nThe objection is that the distinction collapses once we ask why assurance matters.\
  \ Assurance matters because a hearer is entitled to rely on a speaker's word; but\
  \ the point of that entitlement is to protect the hearer against being misled by\
  \ someone who controls the information. In (b) W controls the information just as\
  \ completely. She knows exactly what the tribunal will infer, and she chooses her\
  \ words in order to produce that inference. To say that she did not undertake the\
  \ inference is to describe a feature of the utterance and then treat it as a moral\
  \ alibi. Since the aim, the foresight, and the effect are the same in both cases,\
  \ and the only difference is a technicality about what is said rather than what\
  \ is meant, the difference cannot bear moral weight. Deception is what makes lying\
  \ wrong, and (b) is deception as surely as (a).\n\nI agree, and I would add a further\
  \ reason. A general permission to cue would be self-undermining. Tribunals could\
  \ not tell cueing from lying, since the cueing speaker's words are, by design, indistinguishable\
