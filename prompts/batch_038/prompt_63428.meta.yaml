  Structure plan:


  Para 1: Set-up — 17, doing A-levels, EPQ or philosophy society essay; something
  personal: their friend/brother. Describe the practice concretely: extra time in
  GCSE/A-level exams; you need a report from an educational psychologist with standardised
  scores below a cut-off; and you need the school to confirm it''s your "normal way
  of working" in class; SENCo signs. Mention the two-track thing: if you''re disabled
  under the Equality Act you get a reasonable adjustment as a legal right, and if
  you''ve just got a broken arm you can get an arrangement but it isn''t a right.
  Mention the rule that the adjustment must not change what''s being assessed or give
  an unfair advantage.


  Para 2: The puzzle / apparent inconsistency. Two friends: one with an ADHD diagnosis
  whose school had already been giving him extra time in class tests → got 25%. Another
  who writes painfully slowly, did badly timed, scored similarly on the speed tests,
  but had never been given extra time in class → refused, because it wasn''t his normal
  way of working. So the same underlying impairment, different verdicts depending
  on what the school had already done. Also: nobody seemed to ask whether there was
  anything *wrong* with him medically; the psychologist''s tests just measured how
  fast he wrote compared to a norm. Ask: what does the practice presuppose about what
  a disorder/dysfunction even is? Does the score-below-cut-off criterion presuppose
  that being ill/disabled is just being statistically abnormal in some function —
  and if so, why is there a cut-off at all rather than a sliding scale, and why doesn''t
  being unusually *fast* count as an abnormality that needs accommodating (i.e., why
  is only one tail of the distribution medicalised)? Does the normal-way-of-working
  rule presuppose that the disability is partly constituted by how the institution
  has treated you?


  Para 3: The rival-views question + the replacement question + the epistemic request.
  Ask: which rival view does it rule out — the one where there''s a biological fact
  of the matter independent of what anyone thinks or what society demands? And what
  would have to change if we swapped in the opposite view: e.g. the student''s invented
  alternative where the board just times everyone writing an essay and gives extra
  time proportionally to how far below the median you are, no diagnosis, no reports,
  no school history — would that be more consistent with the practice''s own stated
  aim (measuring history knowledge, not writing speed) or would it break something?
  Also ask whether the practice is philosophically underdetermined — maybe both views
  license it and it''s just a compromise for admin reasons.


  Then the epistemic request: say how confident you are in each bit, and single out
  the point you''re least sure of. Also maybe: don''t pad with names/books, I can''t
  look things up.


  Include a typo or two: "definately", "thier", missing apostrophe, "alot". Keep it
  natural, not excessive. British spellings: "psychologist", "recognise", "behaviour",
