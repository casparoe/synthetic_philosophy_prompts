  The asker: a grad student or an advanced undergrad preparing for a seminar on the
  historiography of the Revolution, or someone writing a book review? Let''s fix purpose:
  "I''m going to spend a year reading interpretations of the French Revolution and
  I want to know in advance what a good interpretation owes me." The purpose could
  be: to decide whether the Revolution was a necessary/meaningful event or an accident,
  and whether the Terror was implicit in 1789. Actually the domain line says: "class
  struggle, ideology, or contingency, and do revolutions devour their children?" So
  the desiderata could be framed around two linked questions: (a) what explains the
  Revolution''s course (social/class causes vs. ideological causes vs. contingency/accident),
  and (b) whether the Terror follows from the Revolution''s principles — i.e., whether
  revolutions necessarily devour their children.


  Requirements an adequate interpretation must meet:

  1. Account for the fact that the Revolution began as a fiscal and constitutional
  crisis of an absolutist monarchy, not as a rising-class seizure of power — the nobility''s
  revolt (Assembly of Notables, Parlement resistance) preceded and enabled 1789. An
  interpretation that says a class took power must explain why the first movers were
  aristocrats and why the Third Estate''s claims were framed in universal rather than
  class terms.

  2. Explain the sequence/timing: why 1789 and not 1750 or 1820 — including the harvest
  failures and bread prices, the financial collapse from the American war, and the
  failure of reform from above (Turgot, Necker, Calonne). A purely ideological explanation
  must explain why Enlightenment ideas, available for decades, became causally efficacious
  then.

  3. Handle the discontinuity of leadership and program: the Revolution changed hands
  repeatedly (1789 constitutionalists, 1792 Girondins, 1793–94 Jacobins, Thermidor,
  Directory, Brumaire) — any single-agent account (one class, one idea) must explain
  these turnovers without reducing them to epiphenomena; the same is true for the
  claim that the bourgeoisie "won": the Revolution arguably destroyed the institutional
  base of the bourgeoisie (venal offices, seigneurial dues as property, corporate
  bodies, the Church) and produced a state-dominated society of notables and officials.
  (Cobban''s critique of the Marxist interpretation: the Revolution was made by declining
  officeholders, not rising capitalists; and it retarded French industrial capitalism.)

  4. Explain the violence''s geography and targets: much of the worst killing happened
  in the Vendée and among counter-revolutionary uprisings, i.e., in civil war against
  peasants, not as an instrument of class rule over the peasantry; the popular classes
  were both agents and victims (the September Massacres, the drownings at Nantes,
  the repression of Lyon). An account must handle that the Terror killed many of the
  people in whose name it was conducted.

  5. Consistency with what we know about war: the Terror''s institutions (Levée en
  masse, revolutionary tribunals, price controls, the Committee of Public Safety)
  were war measures adopted after April 1792 and especially after the king''s flight
  and the invasion; an account that treats the Terror as the unfolding of 1789 ideology
  must explain the war''s causal weight and vice versa: an account that reduces everything
  to war must explain why other states at war did not do this. (This is where a joint-satisfiability
  issue arises: requirement of ideological continuity with Enlightenment/Rousseau
  + requirement that the Terror be explained by wartime exigency — these pull in opposite
  directions, and the strongest requirement set may be unsatisfiable.)

  6. Not commit retrospective determinism: the actors didn''t know the outcome; the
  interpretation must not read 1793 as contained in 1789 unless it can show mechanism,
