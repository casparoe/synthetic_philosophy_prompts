  premise of the cognitive theory of emotion; "the response must be rational/justified"
  — the paradox of fictional emotions assumes a strong rationality constraint). And
  the joint unsatisfiability: if you demand that fiction-directed emotions be both
  genuine (same kind as ordinary) and yet non-motivating, plus belief-based cognition,
  you get inconsistency — this is basically Radford''s point, but generalized: the
  desiderata list itself being unsatisfiable in one combination is a nice result to
  surface.


