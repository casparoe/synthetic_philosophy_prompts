  Let me settle on a clean design:


  Design:

  - Stimulus: bistable rotating dot sphere (structure-from-motion); direction of rotation
  flips spontaneously.

  - Pre-cue: a written word ("clockwise" or "counterclockwise") shown before each
  trial. Two block types: Informative (word correct on ~75% of trials) and Sham (word
  random; the running contingency is displayed on screen and is verifiably at chance
  — participants can see it).

  - Measure 1: direction of the initial perceptual report.

  - Measure 2: mean dominance duration of the cued direction during a 5-second presentation.

  - Measure 3: a two-alternative forced-choice "which interval contained more clockwise
  rotation" on stimuli that were 50:50 mixtures — a bias measure (point of subjective
  equality shift) with equal payoffs and no reason to guess.

  - Result: In Informative blocks, all three shift with the cue (expected). In Sham
  blocks: Measure 1 shifts modestly (~4 percentage points above chance, significant),
  Measure 2 does not shift, Measure 3 shifts (~6% shift in PSE, significant).

  - Also: the effect in Sham blocks survives a post-experiment debrief confirming
  participants understood the word carried no information, and survives when participants
  are paid per-trial for accuracy.

  - Also: in a fourth condition, the cue is masked so participants perform at chance
  on a cue-identification task, and the Measure 3 shift is of similar magnitude to
  Sham.


  Now the argument:

  Move 1 (Nadia): This shows cognitive penetration. The belief/expectation about direction
  changes the percept itself — measure 3 is a bias in the point of subjective equality,
  not a report; equal payoffs and no reason to guess; the participant knows the cue
  is uninformative, so the effect can''t be strategic compliance. Perception is not
  informationally encapsulated.

  Move 2 (Ezra): No. A PSE shift is exactly what a criterion/decision shift predicts.
  In a two-interval task with an ambiguous mixture, the observer''s prior over responses
  can shift the PSE without any change in the visual representation; you''d see the
  same thing if the cue merely made "clockwise" a more accessible response label.
  And the fact that measure 2 (dominance durations) shows nothing is telling: dominance
  durations track the strength of the underlying representation; if the percept really
  changed, rivalry dynamics should change too. So the pattern is more consistent with
  a decisional locus.

  Move 3 (Nadia): But the masked-cue condition kills the "response accessibility"
  story: participants can''t identify the cue, so it can''t make any response label
  more accessible or available; yet the PSE shift is the same size. If a cue nobody
  can report still biases the visual judgment, the effect is inside the visual system,
  upstream of report.

  Move 4 (Ezra): That cuts the other way. A masked cue that can''t be identified isn''t
  a belief or a thought — it''s a subliminal prime, and subliminal priming is a bottom-up
  associative process, not cognition penetrating perception. If your effect is carried
  by the masked condition, you''ve shown only that vision is sensitive to recently
  seen stimuli, which nobody disputes. And in the Sham condition, where participants
  do read the word, you''ve shown a compliance-like or attentional effect. Either
  way you have two different mechanisms and no single phenomenon.

  Move 5 (Nadia): Fine — call the masked route associative. But then explain why the
  Sham effect is not eliminated when we make the cue''s uninformative status explicit,
  verify it, and pay for accuracy. A rational Bayesian observer should assign the
  cue zero precision and the effect should vanish. It doesn''t. That''s irrational
  penetration: cognition changing perception in a way that no inference licenses.

