  Draft answer:


  "The careenium is Hofstadter''s answer to the objection that symbols cannot be causes.
  The objection runs as follows. Everything that happens in the careenium happens
  because simmballs collide, and those collisions are fixed by simple physical laws
  together with the initial positions and velocities of the simmballs. If you knew
  all of that, you could in principle derive the entire future of the chamber without
  ever mentioning a symbol. So when we say that one symbol caused another, we are
  only producing a convenient summary of a very large number of collisions; the real
  causes are all at the bottom, and the symbol level is a kind of bookkeeping that
  adds nothing. This is the worry that mental states are epiphenomenal: if the brain''s
  physics is complete, then what a belief does is already done by the neurons, and
  saying the belief caused the action is a manner of speaking.


  Hofstadter''s reply is that the objection proves too much. The symbol level is not
  a summary we invent for convenience, because no one could actually perform the summary:
  with an immense number of simmballs colliding, no computation available to us could
  take the initial conditions and produce the configuration of clumps a minute later.
  The only way to say anything at all about what will happen in the careenium is to
  notice which clumps are near which, and to predict that a collision between two
  clumps will produce a third. So the symbol-level description is not eliminated by
  the physical description; it is the description that does the work, and the physical
  description is the one that is unusable. That is why symbols can be said to push
  each other around: the clump really does move other simmballs, and the clump''s
  being a symbol is nothing over and above its being a clump.


  This, I think, settles the objection. Since a symbol just is a pattern of simmballs,
  when the symbol pushes other simmballs around, the pattern is literally exerting
  force. There is therefore genuine downward causation in the careenium: the higher
  level reaches down and makes the lower level do things it would not otherwise have
  done. Kim''s exclusion argument is defeated because the argument assumes that if
  the physical cause is sufficient, the mental cause must be a rival to it; but in
  the careenium the symbol cause and the simmball cause are the same event described
  twice, so there is no competition and no overdetermination. Because the same holds
  for brains — a belief is a pattern in neural activity, and no one could predict
  a person''s behaviour from the firing of individual neurons — beliefs are genuine
  causes of action too. And once we can see that the pattern level is where the causation
  lives, we can also see why a clump means what it does: meaning is just a matter
  of one pattern reliably setting off others, so the careenium gives us intentionality
  as well as efficacy."


