  Actually the classic point: if you sample regimes that have already ended, you get
  complete durations. If you want to predict the remaining duration of a currently-existing
  regime of age t, the relevant quantity is the residual lifetime given survival to
  t, which is not the same as the marginal mean duration. Also, if instead you sample
  regimes existing at a random point in time, you get length-biased sampling (longer-lived
  regimes are more likely to be caught mid-life). The student''s mistake: they say
  that because they sampled only *defunct* regimes, their estimate is conservative/unbiased
