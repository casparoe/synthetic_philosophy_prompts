  argument is often conflated with Bayes and criticized (e.g., by Carlton Caves, and
  by Landsman). There''s a classic criticism: Gott''s derivation assumes a uniform
  prior over the total duration, and the "delta t argument" fails when you have background
  information. Also the conflation of Gott''s argument with reference class forecasting.


