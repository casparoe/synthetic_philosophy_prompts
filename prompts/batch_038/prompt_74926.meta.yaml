  \ distinguishes them. Possible principled distinctions: whether the premises are\
  \ logically independent / whether members share the same connection rule; whether\
  \ the conclusion is a conjunction of premises vs. a disjunction; whether members\
  \ vote on premises independently (i.e., whether there's correlation); whether the\
  \ panel is deliberative or not; whether the premises exhaust the reasons.\n\nI can\
