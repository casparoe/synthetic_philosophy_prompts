  can''t reach consensus, and what you get is exactly what we called split-brain in
  ops — two divergent replicas both acting like they''re the primary. And then he
  ran it in the other direction too: ordinary unified consciousness is just the same
  cluster with the interconnect working, i.e. quorum consensus over a fast link, so
  there''s nothing special about "one mind," it''s an engineering property. His conclusion:
  the split-brain patient is two subjects, and anyone who resists that is just squeamish
  about counting.


