  I have no formal training in philosophy; I run a small business and have been working
  through these questions on my own for several years, mostly by reading. I would
  like a rigorous check on a set of views about possibility that I have arrived at
  and written down, because I suspect at least one of them is unstable but I cannot
  tell which.


  Here is the set, in my own words:


  1. Only this world is real in the full sense. When people talk about other possible
  worlds, I take them to be talking about complete ways the whole of things could
  have been — blueprints, so to speak — and I don''t believe any of those blueprints
  is a place anyone could be in. I first ran into this material through David Lewis
  and I rejected the many-concrete-worlds picture immediately, but I kept a good deal
  of the rest.


  2. Nothing is in two of these ways-things-could-have-been at once. When I say that
  I might have become a fisherman, I don''t mean that some one person, me, is a fisherman
  somewhere else; there is no such stretching across.


  3. What makes the claim true, then, is resemblance. The blueprint counts as one
  in which I become a fisherman because the person in it who resembles me most closely
  — in where he came from, in temperament, in the shape of his life — becomes a fisherman.


  4. In any given blueprint there is always exactly one person who resembles me most
  closely. If two candidates strike us as exactly equidistant, my view is that one
  of them is in fact a shade nearer and we are simply unable to detect it. I hold
  onto this because I think that without a single determinate match, the claim stops
  being a claim about me.


  5. I don''t believe in differences that cannot be pointed to. If two things agree
  in every respect anyone could state, there is no further fact about which of them
  is which; there''s no bare "but this one really" left over.


  6. About persistence through time in this world: what I am is a series of stages
  held together by memory and character. In the sort of case where my brain is divided
  and two people wake up carrying my memories and my dispositions, I think neither
  of them is me. And I want to be careful here: I don''t think that''s because we
  lack information. I think there is no fact of the matter.


  7. Finally, the reason any of this matters to me is that the counterfactuals are
  mine. Regret about what I might have done, relief about what I didn''t, planning
  against what I might yet become — these attitudes presuppose that the possibilities
  in question are possibilities for me.


