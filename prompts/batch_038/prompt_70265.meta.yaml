  ---


  I''m a third-year PhD student in philosophy (mostly decision theory, drifting toward
  the economics of risk) and our reading group has been going back and forth on this
  thing called ergodicity economics for a couple of weeks. The version of the argument
  that''s really gotten under my skin comes from a friend who works in a quant shop,
  and he always reaches for the same picture to explain why he thinks expected utility
  theory is a dead end. The picture goes like this: when you ask what the expected
  value of a gamble is, you''re really asking what happens on average across a huge
  crowd of copies of you, each of whom takes the gamble exactly once, in a bunch of
  parallel universes — and then you take the average across the crowd. But you''re
  not a clone in a parallel universe, you''re one person living one life in one direction,
  so the only average you can ever actually experience is the one along your own timeline:
  what happens to your wealth if you take the same gamble again and again. Those two
  averages come apart as soon as wealth compounds, and the one you should care about
  is the second. His favorite demo is the fair coin that multiplies your stake by
  1.5 on heads and by 0.6 on tails: the clone-crowd average says +5% per round, the
  along-your-own-life average says about −5% per round, so the crowd-average is telling
  you to take a bet that reliably bankrupts the actual you. From this he concludes
  three things: that utility functions are a psychological patch on a mathematical
  mistake, that Kelly-style growth-rate maximization isn''t a special case of expected
  utility but a replacement for it, and that risk aversion isn''t a taste parameter
  at all, just the failure to notice which average you''re computing.


  My advisor''s response is basically that the analogy is a rhetorical wrapper around
  one line of algebra — E[log X] ≠ log E[X] — and that if you plug log utility into
  expected utility theory you get exactly the same recommendations as growth-rate
  maximization in his compounding examples, so nothing has been refuted, only renamed;
  he adds that Samuelson made the same point decades ago, and that the whole thing
  falls apart the moment you allow for finite horizons, bequests, insurance, or an
  agent who genuinely wants to gamble. I can see both sides and I want the analogy
  itself audited rather than the literature summarized. So: give me the correspondence
  table — what in the source picture (parallel universes, the crowd of clones, one
  life lived forward, the averaging operation) maps onto what in the target (the probability
  distribution over outcomes, the stochastic process, the time average, the growth
  rate) — and then sort the disanalogies into the ones that actually threaten his
  three conclusions and the ones that are just decoration. In particular I want to
