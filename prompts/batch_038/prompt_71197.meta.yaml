  My argument, briefly, runs as follows. I claim that What Is Art? contains two claims
  that are almost always run together and that should be pulled apart: a criterion
  of arthood, on which a work is art insofar as it deliberately transmits to others
  a feeling the maker has actually experienced, through external signs; and a criterion
  of artistic value, on which works are ranked by the quality of the feelings transmitted
