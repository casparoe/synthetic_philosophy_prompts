  rather than as an all-or-nothing property, and I introduce what I call a reach condition:
  the wider the circle a work can infect without diluting the feeling, the higher
  its value, other things equal. Finally, I claim that Tolstoy''s four diagnostic
  marks of counterfeit art — borrowing, imitation, effectfulness, and diversion —
