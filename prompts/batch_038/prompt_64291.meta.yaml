  Idea: A resignation letter from the Sovereign. Written by an invented monarch/absolute
  ruler who has concluded, in Spinozist terms, that he never actually held the power
  he was supposed to hold, and is therefore resigning a job he never had. The humor:
  he itemizes what he discovered — that his decrees were only obeyed where they matched
  the multitude''s disposition; that his attempt to command belief produced not belief
  but dissimulation; that his "right" was never more than his power, and his power
  was the multitude''s, on loan; that his courtiers were the actual sovereigns and
  he was the interface; that the fear which held the state together was mostly his
  own fear of the multitude. And the kicker: he recommends democracy not on moral
  grounds but because it''s the honest accounting — in a democracy nobody has to pretend
  the power belongs to someone else. And the internal consistency constraint: he must
  not appeal to natural rights, divine right, or consent as a moral bond; he must
  not sound like a liberal who values freedom intrinsically; his case must be the
  Spinozist one that freedom is what a state is for because a state that commands
  minds fails. Also he can''t be a moralist about his own wickedness — he denies free
  will, so he shouldn''t blame himself; his resignation should be framed as a change
  in the description of things, not as repentance. That''s a subtle and rich constraint,
  exactly the kind of thing that makes the piece hard and rewards knowing Spinoza.


