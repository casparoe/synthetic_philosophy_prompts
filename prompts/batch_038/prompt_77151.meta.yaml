  Student answer draft:


  "Armstrong''s immanent realism holds that universals exist only in their instances:
  for a universal to be is for it to be instantiated somewhere by some particular.
  There are no uninstantiated universals, and so no Platonic Forms hovering outside
  space and time waiting to be exemplified. Armstrong''s motivation for this is largely
  causal. We postulate properties in the first place to explain the causal behaviour
  of things — why this electron repels that one, why this sample of metal conducts.
  If a property is to do that work it has to be where the action is, i.e., located
  in the particular that has it. A transcendent Form is by hypothesis outside the
  causal order: it neither acts nor is acted upon. It therefore cannot be what makes
  the electron repel its neighbour. Since the only reason we had for admitting properties
  was to explain causal powers, a property that cannot figure in any causal explanation
  is ontologically idle, and we should not admit it. This is a version of the old
  criterion of being that the Eleatic Stranger proposes in Plato''s Sophist, on which
  what is real is what has the power to act or be acted upon. Armstrong is simply
  applying it to properties.


  Notice, though, that this causal argument is really the One Over Many argument in
  a new costume. The One Over Many argument says that when many things behave and
  resemble each other in the same way we should posit one thing over the many to explain
  the resemblance. Armstrong''s causal argument says the same thing about causal powers
  instead of resemblances. Nothing new is added: causation is just the most important
  species of the ''same behaviour'' that the One Over Many argument was already invoked
  to explain. And that has an important consequence — the causal argument does no
  independent work in ruling out transcendence. If the Platonist is willing to say
  that the Form of charge is what makes all electrons behave alike, she has met the
  argument in the same way the universalist meets the One Over Many argument, namely
  by pointing at the shared feature. What she has not met is the further demand that
  the shared feature be located. But that demand is not itself an argument; it is
  just the immanent realist''s refusal to countenance anything unlocated.


  The argument does have one genuine dialectical limit, which Armstrong is honest
  about. It depends on accepting the causal criterion of being. A Platonist who thinks
  there are real entities that do no causal work — numbers, say, or uninstantiated
  possibilities — can simply deny the criterion, and then the argument loses its grip.
  So the argument is best read as showing that if you want properties for causal explanation,
  transcendent Forms are the wrong candidates, rather than as a refutation of Platonism
  as such.


  Bradley''s regress, by contrast, is a problem only the transcendent realist has.
  The regress arises because if a Form is one thing and its instance another, we need
  a relation of instantiation to join them; but that relation is a further entity
  needing its own joining, and so on. Armstrong''s universals are wholly present in
  each of their instances, so no extra relation is needed to bring the universal to
  the particular: the particular and the universal are already together. The immanent
  realist therefore avoids the regress, and this is a second, independent reason to
  prefer immanence.


  On part (b), the trope theorist cannot use the causal argument at all. Tropes are
  particularized properties — this electron''s charge, that one''s charge — and no
  trope is ever instantiated twice. But the causal argument, like the One Over Many
