  \ allowed Y tool access... A new case. Candidate rules: \"assume deceptive alignment\
  \ whenever capability to plan is present\", \"control proportional to capability\"\
  , \"control proportional to irreversibility of harm\"... Good.\n\nOption C: Ethics\
  \ of insecticides. A person's verdicts about which pest control methods are permissible.\
  \ Insect consciousness/insecticides — combined with the \"verdicts → principle\"\
