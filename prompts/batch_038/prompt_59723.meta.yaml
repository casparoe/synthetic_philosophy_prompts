  \ new case that two rules diverge on.\n\nOption D: Path dependence. A historian's/journalist's\
  \ verdicts about whether \"history is locked in\" for various cases: e.g., would\
  \ the same outcomes have arrived anyway. Verdicts: writing systems would have emerged\
  \ regardless; QWERTY is contingent; the Industrial Revolution's timing contingent\
