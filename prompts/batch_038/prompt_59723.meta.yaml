  \ with adjustment (Fermi decomposition), \"take-the-inside-view-seriously\"... That's\
  \ quite good and \"in the weeds.\"\n\nActually let me think about making it richer:\
  \ a superforecaster friend, or a person who runs a \"reference class\" analysis\
