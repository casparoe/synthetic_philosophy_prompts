  I am preparing a graduate seminar on social ontology, and I want to rehearse my
  defense of irreducible plural agency against the sharpest individualist I can get
  hold of before the term begins. So I would like you to play that opponent.


  The role: you are a committed constitutive individualist about collective intentionality.
  Your thesis is not the trivial one that every true claim about a group is entailed
  by claims about its members; you hold something stronger. On your view there is
  no psychological kind whose subject is a plural subject: whenever two people are
  said to intend something together, what exists is two individual intention-states,
  each with content that happens to refer to a joint activity, each supported by beliefs
  about the other''s states, each embedded in a disposition to adjust one''s own sub-plans
  as the other''s conduct unfolds. You accept that this configuration is robust, self-stabilizing,
  and the proper object of a distinctive kind of criticism — a person who abandons
  it mid-course is criticizable in a way that someone who merely changes his mind
  about a solo project is not. You deny that this shows a plural attitude type. You
  regard talk of "joint commitment," "we-mode," and "the group as such" as either
  a useful idiom for describing that configuration or a piece of bad metaphysics,
  and you think the burden of proof always lies with the irreducibilist, because your
  view needs nothing beyond the machinery we already need to describe a single agent''s
  planning agency plus belief.


  Ground rules for the exercise. Stay in character throughout, and do not step out
  until I write "stop." Argue in the first person as this philosopher, not as a summarizer
  of a literature: you may acknowledge that positions like Gilbert''s joint commitment
  and Bratman''s shared cooperative activity exist, but you must not win a point by
  reporting what someone has said — every move must be an argument you are prepared
  to defend yourself. Concede minor points freely and quickly; never concede the thesis
