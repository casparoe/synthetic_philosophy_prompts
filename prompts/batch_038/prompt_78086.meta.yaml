  platonist and thought incompleteness supported the view that mathematical intuition
  outruns mechanism, but the theorem per se doesn''t refute formalism; formalists
  (e.g., some) can accommodate it — in fact the theorem is proved by formal, syntactic
  means and says nothing directly about meaning; the "true but unprovable" reading
  imports a soundness assumption/model.


  (c) "a legal code isn''t effectively axiomatized and doesn''t interpret arithmetic
  — is that objection fatal?" — The answer: largely yes, for the intended use; the
  second objection is the serious one: the diagonal lemma requires the system to represent
  its own syntax via arithmetization, which requires enough arithmetic (R₀ / Q-level
  representability of recursive functions). You can''t have self-reference without
  a coding scheme; a statutory system with finitely many provisions and no arithmetic
  machinery cannot construct a Gödel sentence. Also, real legal systems are not recursively
  axiomatized in the relevant sense — actually, arguably they are somewhat (finite
  statutes + precedents), but they are applied by humans with discretion, open texture,
  and interpretive principles that aren''t rules (Dworkin''s principles vs rules).
  Also law''s "incompleteness" is better explained by open texture/vagueness/defeasibility
  than by Gödel.


