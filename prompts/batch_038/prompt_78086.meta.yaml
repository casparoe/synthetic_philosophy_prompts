  — a running program is not a theory, and consistency isn''t even well-defined for
  a program (a program''s behavior is a computation, not a set of sentences); (2)
  Con(T) concerns formal consistency of an axiomatized theory, not reliability or
  "correctness"; (3) even if a program implements a consistent arithmetic theory,
  the second theorem doesn''t forbid a stronger system from proving the consistency
  of the weaker one — so a separate verifier could do it; (4) "the AI can never certify
  its own reasoning is consistent" — it could be given a proof produced by a stronger
  metatheory; also Gödel''s theorem is about systems that can represent enough arithmetic
  and are effectively axiomatized; most actual software is finite and hence decidable/trivially
