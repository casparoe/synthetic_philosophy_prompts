  code can''t prove its own consistency/completeness, but that''s not the jurisprudential
  point the asker wants (that the code can''t determine its own application). The
  gap between "there are undecidable sentences" and "there are legal questions the
  code cannot determine" requires mapping legal questions onto arithmetical sentences
