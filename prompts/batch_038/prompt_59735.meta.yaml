  Cicero''s Cato Maior de Senectute: structure — Cato the Elder lists four charges
  against old age: (1) it withdraws us from active pursuits/business (a negotiis),
  (2) it makes the body weaker (infirmius corpus), (3) it deprives us of almost all
  pleasures (privet voluptatibus), (4) it is not far from death (prope a morte). Cicero
  answers each. Key moves: old age is fit for the greatest affairs because it''s governed
  by judgment, authority, counsel (consilium, auctoritas); the body should be exercised
  moderately, and the mind (animus) is like a muscle that weakens without use — but
  old age''s proper activity is the mind; pleasures: the loss of appetite/banquets
  is a gain (no slavery to lust), and old age retains the pleasures of agriculture
  (which Cicero praises at length — the section on farming, agri cultura, is famously
  long and digressive); and death: either the soul is immortal (so death is good,
  transition) or it perishes (so no evil, since no sensation), and a young man''s
  death is like a fierce flame quenched by water while an old man''s is like a fire
  burning out on its own — the old man dies sated (saturitate), like an actor finishing
  the play, or fruit falling from a tree ripe vs. green being plucked by force.


