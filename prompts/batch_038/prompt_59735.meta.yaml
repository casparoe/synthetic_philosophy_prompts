  case is a general defense of aging, when it''s addressed to a specific audience
  (Atticus), written by a man in his early 60s out of political marginalization, and
  it''s explicitly about the right kind of old age — a life well spent; Cicero concedes
  that wretched old men exist ("nulla enim est... " hmm). He says the best defense
  is a life well lived; and he acknowledges (via the four charges) real losses. Also
  he says old age is only bearable for those who have virtue/moderation — so it''s
  conditional, not universal.

  (b) Assuming Cicero denies the body''s decline — he doesn''t; he grants weakness
  but says you should train moderately and that Milo''s strength isn''t what an old
  man needs.

  (c) Assuming the pleasure section denies old people any pleasure — he actually keeps
  agricultural pleasure and intellectual conversation.

