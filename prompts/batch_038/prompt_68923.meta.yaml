  Gold''s results:

  - Identification in the limit from an informant (positive + negative data) is possible
  for any class of recursively enumerable languages.

  - From text (positive data only): a class is identifiable iff ... every language
  in the class has a finite "telltale" subset not contained in any other language
  of the class. Consequences: the class of all finite languages plus at least one
  infinite language is not text-identifiable. The class of all r.e. languages is not
  text-identifiable. Also, adding a single "extra" language that''s a superset ruins
  it.

  - Also, Gold''s theorem is often glossed as "learning from positive data alone is
  impossible," which is an overstatement — many interesting classes (e.g., pattern
  languages, finite state with care) are learnable from positive data.


