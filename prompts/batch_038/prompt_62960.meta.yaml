  "Arrow''s theorem concerns a social welfare function: a rule that takes a profile
  of individual preference orderings over a fixed set of alternatives and returns
  one social ordering. The conditions:


  1. Unrestricted domain — the rule must accept every logically possible profile of
  complete, transitive individual orderings.

  2. Weak Pareto — if everyone prefers x to y, society prefers x to y.

  3. Independence of irrelevant alternatives — the social ranking of x versus y depends
  only on how individuals rank x versus y; information about other alternatives can''t
  matter.

  4. Non-dictatorship — no single individual''s preferences always determine the social
  ordering.

  5. The output must itself be a complete and transitive ordering.


  The theorem: with at least three alternatives and at least two individuals, no rule
  satisfies all of these. The punchline that''s usually drawn in engineering contexts
  — ''no voting system is fair'' — is a bad summary, because ''fair'' isn''t one of
  the conditions. What the theorem actually shows is that a certain combination of
  individually plausible constraints is jointly unsatisfiable, so at least one has
  to give.


  Now, the two escapes.


  Single-peakedness: If the alternatives can be laid out on a line and every voter''s
  preference rises to a single peak and falls away on either side, then majority rule
  is transitive and the winner is the median voter''s peak (Black''s result). This
  does defeat the paradox of cyclical majorities. But it doesn''t refute Arrow — it''s
  a restriction on the domain, i.e., it gives up condition 1. And it''s fragile in
  practice: as soon as the alternatives aren''t genuinely one-dimensional (which for
  anything like a budget or a policy package is almost never true), single-peakedness
  fails. Still, it''s the more interesting escape because it identifies the actual
  source of the cycles: disagreement about the dimension along which alternatives
  vary.


  Cardinal ballots: If voters report scores instead of rankings and we sum them, transitivity
  is guaranteed, because the outcome is just an ordering by real numbers. This looks
  like a refutation, but it isn''t quite: score voting satisfies Pareto and non-dictatorship
  and unrestricted domain and it produces an ordering, so on the face of it we have
  a counterexample to Arrow. The way out is that score voting does not satisfy IIA
  — but the interesting point is *why* it doesn''t. It fails IIA precisely because
  it lets voters express the intensity of their preferences, which is information
  Arrow''s setup deliberately throws away. So the theorem is really a statement about
  the price of ordinalism: if you insist that only the order of each voter''s preferences
  counts, you can''t have everything. If you allow more information, the impossibility
  dissolves, and the debate shifts to whether the extra information is real and interpersonally
  comparable, which is a substantive question, not a mathematical one. So score voting
  escapes Arrow, and I think it''s the escape that succeeds.


  Finally, one thing that gets missed: Arrow''s theorem is often run together with
  the result on strategic voting — that any non-dictatorial rule with at least three
  alternatives can be manipulated by misreporting preferences — so people say Arrow
  shows all voting systems are gameable. That''s true, and it applies to score voting
  as well, which is why no change of ballot format gets you out of the woods. It also
  bears on the IRV-vs-plurality debate: plurality clearly violates IIA, since a hopeless
  third candidate can change which of the two front-runners wins. IRV does better
  here, because it eliminates the weakest candidates one at a time, so a candidate
  who can''t win can''t change the outcome — it satisfies IIA while plurality doesn''t,
  which is the main reason I''d choose it for the group''s own elections.

