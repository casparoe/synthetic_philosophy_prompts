  ---

  (a) Arrow''s theorem is about a social welfare function: a rule that takes a profile
  of individual preference orderings over a fixed set of alternatives and returns
  a single social ordering over the same set. The conditions:


  1. Unrestricted domain: the rule must be defined for every logically possible profile
  of complete and transitive individual orderings. No voter is excluded and no preference
  pattern is ruled out in advance.

  2. Weak Pareto: if every individual prefers x to y, the social ordering ranks x
  above y.

  3. Independence of irrelevant alternatives: the social ranking of x against y depends
  only on how the individuals rank x against y; nothing about other alternatives may
  enter.

  4. Non-dictatorship: there is no individual whose preferences determine the social
  ordering regardless of what anyone else says.

  5. The output must itself be a complete and transitive ordering — this is sometimes
  left implicit, but it''s doing real work.


  The theorem: with at least three alternatives and at least two individuals, no rule
  satisfies all of them. The popular gloss "no voting system is fair" is not acceptable,
  because fairness is not among the conditions and the theorem is not about voting
  procedures in the ordinary sense — it''s about functions from profiles to orderings,
  which is a broader and more abstract class. What the theorem shows is that a set
  of constraints each of which looks reasonable on its own is jointly unsatisfiable,
  so anyone who wants a social ordering has to give one of them up and say which.
  That is a much more useful result than "voting is hopeless," and it''s also why
  I''d resist the further claim you sometimes hear, that the theorem settles the old
  dispute about whether utility can be measured. It doesn''t settle anything of the
  kind: it shows that if you want a coherent social ordering on ordinal inputs, intensity
  has to be treated as inadmissible, which is a result about a formal setup, not a
  discovery about the world.


  (b) Single-peakedness. If the alternatives can be arranged along a line and each
  voter''s preferences rise to one peak and fall away monotonically on both sides,
  majority rule is transitive and its winner is the median voter''s most preferred
  alternative. This kills the cyclical-majority problem in the cases where it applies.
  But it isn''t a refutation of Arrow: it''s a restriction of the domain, so condition
  1 is exactly what''s being surrendered. It''s also fragile. Real choice sets — budgets,
  policy packages, anything with more than one dimension of disagreement — are rarely
  single-peaked, and the property is a feature of the alternatives together with the
  voters, so it isn''t something an institution can just impose. I find this the more
  interesting of the two escapes, because it locates the source of the cycles in a
  specific structural feature rather than treating impossibility as a general doom.


  Cardinal ballots. If voters submit scores for each candidate and the scores are
  summed, the social ordering is just an ordering by real numbers, so completeness
  and transitivity come for free, and unanimity and non-dictatorship are clearly satisfied.
  Range voting also satisfies independence of irrelevant alternatives in the intuitive
  sense: a new candidate entering doesn''t change the scores anyone assigned to the
  two existing ones. So on the face of it we have a rule satisfying all of Arrow''s
  conditions, which would be a counterexample. It isn''t, and the reason matters:
  score voting isn''t a function of ordinal profiles at all. Two voters with the same
  ranking of the candidates can submit different scores, and the outcome changes,
  so if you force range voting into Arrow''s framework and treat it as a rule on orderings,
  it fails IIA — it''s using information the framework declares inadmissible. The
  escape is real, then, but it''s an escape by changing the inputs rather than by
  beating the theorem on its own turf. Whether that''s a good bargain depends on whether
  the extra information is real and interpersonally comparable, which is not a mathematical
  question. On balance I think this is the escape that succeeds, with the caveat that
  it converts an impossibility proof into an argument about measurement.


  Two things that get run together here, and shouldn''t. First, Arrow''s theorem has
  a corollary about manipulation: any non-dictatorial rule over three or more alternatives
  can be made to produce a preferred result by misreporting your preferences. That''s
  true and it applies to score voting too, which is why changing the ballot format
  doesn''t get you out of the woods; it just moves the strategic problem somewhere
  else. Second, in the IRV-versus-plurality argument, people say that plurality violates
  IIA — a hopeless third candidate can flip which of the two front-runners wins —
  and then assume IRV is the fix. IRV does fix that instance, because it eliminates
  the weakest candidate round by round, so an alternative that nobody ranks first
  and that can''t win is discarded before it can do damage. Plurality fails IIA; IRV
  satisfies it. That''s the main reason I''d use IRV for our own group''s elections.


  (c) Our ranking problem is the same problem in different clothes, and I''d argue
  the analogy holds. The click model, the relevance model and the freshness score
  are the voters; the candidate items are the alternatives; the blended ordering is
  the social ordering. If we insisted on treating each signal ordinally — as a ranking
  of items, which is the honest thing to do, since the scores from different models
  aren''t on a common scale — then Arrow applies directly: any blending rule we pick
  will violate at least one of his conditions, and the one it will violate in practice
  is non-dictatorship or IIA, depending on how we''ve tuned the weights. So the practical
  conclusion is that the weights in a blended ranker are never merely technical: they
  encode a choice about which impossibility you''re going to live with, and the fact
  that nobody can prove the resulting ordering is the right one is a theorem, not
  a failure of engineering.

