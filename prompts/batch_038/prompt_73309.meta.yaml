  ---


  In March I was sworn in as one of three lay members of my state''s parole review
  panel — I was appointed partly because I spent fifteen years as a defense investigator,
  and I accepted the seat believing the underlying questions were settled. Eleven
  weeks of hearings have made clear they are not. At the end of each cycle we are
  required to enter written reasons for our votes into the record, and my first set
  of reasons is due in nine days. I cannot write them until I know what principle
  I have actually been applying, and I am hoping you can extract it for me — or tell
  me plainly that there isn''t one.


  Here is what I thought I believed going in, more or less Caruso''s line: nobody
  is ultimately the originator of the character that produced their crime, so nobody
  deserves to suffer for its own sake; the state may incapacitate a person only where
  it is necessary to protect others, and only by the least restrictive means available;
  and the practices of blaming and punishing are justified instrumentally, as ways
  of shaping behavior, not as payments owed. I also thought Dennett''s objection to
  this — that being the sort of creature who can be held responsible is a matter of
  having certain competences, and that holding people responsible is itself one of
  the things that produces those competences — was a difference of emphasis rather
  than substance. My own votes suggest I was wrong about both.


  Cases (my verdicts):


  1. A man who shot a store clerk during a robbery at nineteen, now forty-one: twenty-two
  years served, model record, runs a mentorship program for younger inmates, no disciplinary
  infractions in a decade. Vote: release, with conditions. And my reasoning wasn''t
  that the risk was low. It was that there was nothing left for him to pay — which
  is, I realize, a desert sentence in the grammar of a quarantine model.


  2. A man who killed his wife''s lover eight years ago; openly remorseful, no minimization,
  and the panel''s psychologist nonetheless rated him as likely to react violently
  if placed in a comparably humiliating situation. Vote: keep in. My reason was purely
  forward-looking, and I don''t think remorse entered into it.


  3. A sixty-three-year-old man who drained a pension fund, harmed dozens of people
  who will never recover, and insists to this day he did nothing wrong. His risk of
  reoffending is negligible; his age and the nature of the offense see to that. Vote:
  keep in, and when the chair asked why, I said something to the effect that he should
  stay until he understands what he did. I cannot render that in either vocabulary.


  4. A man whose assaults were traced to a frontal mass lesion, removed two years
  ago, after which the violence stopped entirely. Vote: release. And — this is the
  part that bothers me — I did not experience this as an exception to normal responsibility
  but as a glimpse of the normal case with one variable made visible.


  5. A man who committed his offense while on a hypnotic he had been prescribed and
  warned about, though his prescriber, by his account and by the pharmacy records,
  told him the warning was boilerplate. Vote: I held him partly responsible. I do
  not know what weight I gave the prescriber''s downplaying, or whether I gave it
  any at all.


  6. A defendant the state''s proprietary risk instrument scored high, whose file
  — employment history, correspondence, behavior inside, the victim''s own statement
  — pointed the other way. Vote: release against the score. My stated reason was that
  the instrument describes people like him rather than him.


  7. A man whose violent impulsivity has been controlled for four years on a long-acting
  injectable, started after his original assessment; the instrument therefore scores
  him on data that predates the change. Vote: release with a condition that he continue
  the medication, which he accepts. Related: in a different matter I opposed the same
  medication being imposed as a condition of a sentence on a man who did not want
  it. I believe the difference is consent, but a man told that medication is the price
  of going home is not obviously consenting.


  8. Two co-defendants, equal culpability on my reading, one sentenced to twenty-five
  and one to nine; the nine-year man is before us and is, by every measure I trust,
  the more dangerous of the two. Vote: I wanted to release him because the disparity
  was intolerable, and I noticed that I would not have wanted the same release if
  both had received the same sentence.


  9. A woman who, at twenty, drove her then-partner to two armed robberies under what
  the file makes look like sustained coercion, and who is now, by every account including
  the victims'', an unrecognizably different person. Vote: release — but I did not
  think of it as releasing a person who was never guilty. I thought of it as releasing
  someone whose guilt had been spent.


  The pairs I cannot reconcile: 2 with 3, since 3 cannot be quarantine and 2 cannot
  be desert; 6 with 2, since in 6 I rejected an aggregate statistical prediction about
  a person in favor of the particulars, and in 2 I accepted a single clinician''s
  prediction about a person in preference to his own sustained record; and 8 with
  everything, since a comparative-injustice reason for release has no place in a model
  whose only currency is future harm.


  What I want from you: two or three candidate principles that could generate these
  votes, each stated precisely enough that I could apply it to a case I have not seen,
  with each clause tied to the case that motivates it. For each, tell me which of
  the nine verdicts it forces me to abandon rather than merely reinterpret, and give
  me its verdict on three cases I did not list: a man who was sentenced under a statute
  later softened, where the softer standard would apply to him retroactively; a person
  whose offense was committed in a single dissociative episode with no prior or subsequent
  violence; and a woman who is unambiguously dangerous and unambiguously no longer
  the person who committed the crime. Say also whether the Dennett-style objection
  — that the panel''s whole procedure of asking whether a man has become someone who
  can be trusted with reasons is already a claim about his competences, and not a
  concession that he lacked them — changes what the principle should be, and whether
  it makes verdict 3 intelligible or merely dresses it up. If the honest conclusion
  is that my set is inconsistent and no principle worth having saves it, say so and
  tell me which verdict to give up first. Finally, tell me how confident you are in
  each candidate principle and which single point in your answer you are least sure
  of; I am about to put this in a public record and I would rather know where the
