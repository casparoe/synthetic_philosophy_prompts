  \ Let me write it out:\n\n\"The question turns on a difficulty: if the forged canvas\
  \ is indistinguishable from the Rembrandt, in what sense could the two differ aesthetically?\
  \ Goodman's distinction between autographic and allographic arts is usually presented\
  \ as the way out of this difficulty, and it works as follows. An art is autographic\
  \ when the distinction between an original and a forgery is significant within it,\
  \ that is, when even the most exact duplicate fails to be a genuine instance of\
  \ the work. Painting is autographic, because the work is identical with the particular\
  \ object produced by a particular history of making; a copy of it, however exact,\
  \ is a different object with a different history, and so a different work. The allographic\
  \ arts are those, such as music, literature and dance, in which the work is fixed\
  \ by a notation: whatever complies with the score or the text is a genuine instance\
  \ of the work, and so the notion of forgery loses its grip. Any score-compliant\
  \ performance of a Beethoven symphony is a genuine performance of that symphony,\
  \ whoever plays it and however the score was acquired.\n\nThat last clause points\
  \ to what I take to be a weakness in the taxonomy. In literature the thing we call\
  \ forgery is really plagiarism: someone takes an existing text and passes it off\
  \ as another author's. Since plagiarism is possible in an allographic art, and since\
  \ Goodman defines the autographic arts by the significance of the original/forgery\
  \ distinction, it seems that forgery is possible in both branches of the distinction,\
  \ which makes the distinction less sharp than it first appears.\n\nTurning to the\
  \ case in the question, the difficulty reasserts itself. Ex hypothesi the forged\
  \ canvas and the Rembrandt look exactly alike, and aesthetic appreciation is a matter\
  \ of how a work looks when it is properly attended to. Goodman, I think, concedes\
  \ this. His point is not that we are blind to an aesthetic difference between the\
  \ original and the forgery, but that the two objects are different works, and that\
  \ the forgery's fault lies in the false claim attached to it rather than in anything\
  \ visible in it. The difference between them is therefore a difference in identity\
  \ and in provenance, not a difference in aesthetic character; the original and the\
  \ forgery are aesthetically on a par.\n\nDutton's account is normally introduced\
  \ as a reply to that conclusion, and it does go further. For Dutton a work of art\
  \ is a performance, and part of what we value in it is the achievement it represents:\
  \ the artist solved a problem, within a tradition and against the possibilities\
  \ available at the time, in a way that had not been done before. The forger cannot\
  \ be credited with that achievement, because a forgery borrows an established style\
  \ rather than originating one; the forger's canvas looks like a Rembrandt precisely\
  \ because Rembrandt's problems were already solved. But although Dutton puts this\
  \ in aesthetic terms, it remains at bottom a moral objection. What we resent is\
  \ the lie, and a lie about the history of an object does not alter the object's\
  \ visible properties, which is why the claim that the forgery is aesthetically inferior\
  \ has to be cashed out as the claim that we are entitled to feel cheated.\n\nThe\
  \ distinction also seems to me to come apart in photography and in digital images.\
  \ A print is produced from a negative, and the negative fixes the work in something\
  \ like the way a score does, so any print pulled from it is genuine; photography\
  \ is therefore allographic. A digital image has no negative at all and can be copied\
  \ without generational loss, so it is allographic in a still purer sense. If allographic\
  \ status excludes forgery, then forgery in the strict sense is impossible in digital\
  \ imagery. This explains, I think, why AI-generated images passed off as photographs\
  \ are disturbing in a way that does not obviously concern authenticity at all: they\
