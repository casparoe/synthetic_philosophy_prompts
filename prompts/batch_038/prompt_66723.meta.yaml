  Draft argument (numbered premises):


  (1) A kind K is socially constructed iff whether something falls under K depends
  on the collective attitudes and practices of a community, rather than on how the
  world would be independently of those attitudes.

  (2) Money is socially constructed in this sense: a £20 note is legal tender only
  because we treat it as such.

  (3) Race is socially constructed in the same sense: which bodily features sort people
  into which races depends on classificatory practices that vary across societies
  and epochs.

  (4) If a kind''s extension depends on our attitudes, then it carves no joint in
  nature: there is no fact of the matter, independent of us, about which things belong
  to it.

  (5) Kinds that carve no joint in nature are not real; they are ways of talking —
  useful fictions.

  (6) So neither money nor race is real.

  (7) What is not real cannot explain anything: to say "money caused the crisis" or
  "racism caused the disparity" is to offer a story, not an explanation. (Or: unreal
  kinds have no causal powers.)

  (8) So claims about money and race are not truth-apt claims about the world; they
  are expressions of the practices of the community that made them.

  (9) But (8) is itself a claim about what our classificatory practices are; and on
  (1)–(5) those practices are themselves socially constructed, so (8) is not truth-apt
  either.

  (10) Therefore the argument defeats itself: there are no socially constructed kinds,
  since the notion undermines every use of itself.


