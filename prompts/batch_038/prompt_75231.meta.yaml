  Setting: a philosophy department''s outreach/reading programme. Two people argue
  about whether to assign a "warts and all" biography or an edifying one; more precisely
  about whether the value of exemplars survives the reader learning the exemplar had
  serious vices. Rounds:


  (1) A (the historian/classicist, say "Nadia") argues that Plutarch''s whole project
  is edifying portraiture: he says he''s writing lives, not histories, and picks out
  small revealing details; and he frankly says he''ll be sparing about faults out
  of sympathy for human weakness. So moral learning from lives requires curation —
  you''re building an object of admiration, not a dossier.


  (2) B ("Tom", an ethicist) says that''s precisely the danger: admiration calibrated
  to a curated portrait transfers to the real person''s actual character traits, including
  the ones suppressed; the reader imitates a composite. Hagiography teaches you to
  admire the wrong things, and worse, teaches that admiration is a proper response
  to reputation rather than to character.


  (3) Nadia replies: full disclosure is not the neutral baseline either — the "warts
  and all" biographer also curates, and often curates toward debunking; the debunking
  biography is hagiography inverted, built for the same emotional effect (contempt).
  And a life with every failing itemised doesn''t teach anything either, because the
  reader can''t hold an exemplar in admiration and judgement at once — you get either
  idolatry or cynicism.


  (4) Tom: then the solution is proportionality, not curation: report the faults and
  let the reader weigh them; a moral education that can''t survive knowing the truth
  about its exemplars isn''t moral education.


  (5) Nadia: but that assumes the reader is a good judge already — the very thing
  exemplars are supposed to supply. If you needed the right proportions in hand, you
  wouldn''t need the exemplar. (Circularity point — nice.)


