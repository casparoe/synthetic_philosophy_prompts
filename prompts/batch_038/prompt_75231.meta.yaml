  I teach ethics and I sat in on a panel last month where two people I respect got
  properly tangled up over how much of a subject''s bad behaviour a biography ought
  to include if the book is meant to teach anything moral. I''ve written it up as
  best I can remember it — four moves, and neither of them is a strawman.


  The context: a school reading series wanted to reissue a short life of a scientist
  (a real one, died decades ago) who was, by all accounts, brilliant and generous
  to students, and also — this is well documented in his letters — contemptuous of
  two junior colleagues whose results he used without credit, and cruel to his wife
  for years. The commissioning editor proposed leaving the second part out entirely,
  arguing that the point of the book is to give fourteen-year-olds someone to admire.


  (1) Rowan, the historian, said the editor is basically doing what Plutarch does:
  he opens the life of Alexander by saying, in effect, that he isn''t writing histories
  but lives, and that character shows up in trifles — a remark, a joke, a small gesture
  — rather than in the great battles; and he tells you he''ll pass over some faults
  lightly out of sympathy for human weakness. On that view, curation isn''t a bug
  in moral biography, it''s the method. You''re building an object of admiration,
  not a dossier.


  (2) Dev, the moral psychologist, said that''s exactly the mechanism that goes wrong.
  Admiration doesn''t attach to the portrait, it attaches to the person, and the reader
  imports the suppressed material as though it were part of what''s admirable; and
  once the reader later finds out, the collapse takes the genuine virtues with it
  — you don''t just lose the lie, you lose the generosity too.


  (3) Rowan said "warts and all" is no neutral baseline: the debunking biography curates
  just as hard, only toward contempt, and a life with every failing itemised in proportion
  teaches nothing either, because you can''t hold someone in admiration and under
  judgement simultaneously — you land on either idolatry or cynicism. Dev replied
  that the answer is proportionality, not silence: report the faults and let the reader
  weigh them, and that a moral education which can''t survive the truth about its
  own exemplars isn''t moral education at all.


  (4) Rowan''s last move was the one I couldn''t answer: that this assumes the reader
  already has a decent sense of proportions, which is the very thing exemplars are
  supposed to supply — so if you had it you wouldn''t need the book, and if you don''t
  have it, telling you the truth in full won''t help. Dev said that''s an argument
  for never teaching anyone anything.


  Neither budged and the chair moved on. I''d like you to referee it properly. Treat
  yourself as a professional philosopher with real expertise in moral psychology and
  in ancient biography, think hard about it, and do whatever brainstorming you need
  before you start writing — but don''t show me any of that, just the verdicts.


  Give me exactly five numbered items, each one or two sentences, nothing before item
  1 and nothing after item 5: items 1–4 rate each of the four moves (clearly mistaken
  / partly right / clearly right, and why), and item 5 says what both of them missed
  and which of the two is more right overall. Write in British English, please.


