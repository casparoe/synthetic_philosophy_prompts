  - Misattributing: saying Nozick''s Wilt Chamberlain objection shows the DP is incoherent,
  vs. it being an objection to patterned principles.

  - Saying the DP is an egalitarian principle requiring equal distribution unless...
  (correct-ish).

  - Confusing the "veil of ignorance" with Harsanyi''s "impartial observer" — a classic:
  Harsanyi''s impartial observer theorem yields average utilitarianism, Rawls yields
  maximin. A student might say "Rawls''s veil is just Harsanyi''s device, and Harsanyi
  proved it implies utilitarianism, so Rawls is inconsistent" — that''s a real debate
  but stated sloppily; the difference is the parties'' knowledge (Harsanyi''s observer
  has equal probability of being anyone but knows their preferences/utility functions;
