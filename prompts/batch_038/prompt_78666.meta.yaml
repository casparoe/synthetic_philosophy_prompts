  The question, worth 25 points:


  "Answer all parts. (a) State Aumann''s agreement theorem as precisely as you can,
  making explicit every assumption it needs. (b) Explain what the common prior assumption
  actually commits you to, and why it is not simply the claim that two agents currently
  have the same beliefs. (c) Some economists (Harsanyi, Aumann) treat the common prior
  as a requirement of rationality rather than as an empirical hypothesis. Give the
  argument for that view, and then give the best argument you can against it. (d)
  It has been suggested that models in which agents are unaware of some possible states
  of the world can deliver cases where two agents commonly know that they disagree,
  without any failure of rationality. Explain how that is supposed to work and identify
  which of the assumptions from part (a) such a model gives up."


  Here''s the student''s answer:


  [(a)] Aumann''s agreement theorem says that two Bayesian agents who share a common
  prior and whose posterior probabilities for some event are common knowledge between
  them must have the same posterior. The assumptions are: a finite state space with
  a probability distribution over it; each agent''s information given by a partition
  of that space, so that observing the state tells the agent only which cell he''s
  in; both agents update by Bayes'' rule; the prior is common to both; and the event
  consisting of "agent 1''s posterior is x and agent 2''s posterior is y" is common
  knowledge at some state. If all that holds then x = y. The proof idea is that a
  common-knowledge event must be a union of cells of the finest common coarsening
  of the two partitions, and the prior of such a union can be computed by summing
  over either agent''s cells, which forces the two posteriors to be equal.


  [(b)] The common prior assumption is easy to misread. It''s not the claim that the
  two agents happen to believe the same things — they obviously don''t, since they
  see different signals. It''s the claim that their different beliefs can be represented
  as arising from a single probability distribution over states, conditionalized on
  each agent''s private information. So the CPA is a structural claim about where
  beliefs come from, not a claim about what anyone currently believes.


  [(c)] Harsanyi''s argument, which Aumann accepts, is that if beliefs are fully determined
  by information, then two agents who have processed the same information must have
  the same beliefs; and since any difference in their actual beliefs traces back to
  a difference in their information, you can always imagine a common "prior information"
  that both have, so their priors must coincide. Aumann proved this: the common prior
  is a requirement of rationality, and any model in which two rational agents have
  genuinely different priors is modelling someone as irrational. The objection, from
  Gul and Morris and others, is that this treats the CPA as a conceptual truth when
  it''s really a substantive assumption that could fail: agents might differ because
  they carve up the state space differently, because their belief formation isn''t
  purely a matter of information processing, or because they''ve had different experiences
  that they can''t fully encode as information about a common set of states. On this
  view a model with heterogeneous priors isn''t incoherent, it''s just describing
  agents whose beliefs aren''t fully determined by their information.


  [(d)] In an unawareness model, an agent''s beliefs are defined only over a subspace
  of the full state space, and he doesn''t have opinions about the states he can''t
  conceive of. Two such agents can each be perfectly rational and know the other is,
  and yet commonly know that they assign different probabilities to an event, because
  there''s no single state space over which a common prior could be defined. What
  the model gives up is the assumption that there''s one objective space of states
  that both agents'' beliefs are priors over — the common knowledge of rationality
  is untouched, and so is the requirement that posteriors be commonly known; it''s
  the common prior that stops being well-defined rather than being false.


