  be motivated by altruism (no).

  - Saying Rawls''s argument is that people behind the veil would be risk-averse (Rawls
  explicitly says maximin isn''t about psychological risk aversion; also Hare''s objection
  that risk aversion behind the veil + averaging = utilitarianism).

  - Conflating the two principles'' lexical ordering: equal basic liberties first,
  then fair equality of opportunity before the difference principle (in the second
