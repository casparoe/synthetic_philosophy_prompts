  Paragraph 1: The extended mind thesis, as Clark and Chalmers set it out, turns on
  a thought experiment. Otto has a memory impairment and carries a notebook in which
  he writes down what he takes to be true; Inga has an intact biological memory. Both
  hear about an exhibition of modern art at a museum, and both form the intention
  to go and see it — Inga by recalling where the museum is, Otto by consulting his
  notebook. The parity principle says that if a process occurring outside the head
  would be accepted as cognitive were it occurring inside the head, it should be accepted
  as cognitive outside the head too; on that basis, Otto''s notebook is part of his
  memory. The authors add that the external resource must be available whenever needed,
  easily retrieved, generally trusted, and that its contents must have been endorsed
