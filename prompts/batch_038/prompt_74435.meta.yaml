  Paragraph 2: My claim is that the last of these conditions — trust — is load-bearing
  in a way the argument cannot support, because trust is being used in two incompatible
  senses. In one sense, to trust a source is to have good inductive grounds for thinking
  it delivers truths: a statistical relation. In the other, to trust a source is to
  take up a normative stance towards it: to treat its deliverances as reasons one
  need not check, and to hold it to account when it fails. A calculator is reliable
  in the first sense but is not trusted in the second — indeed, checking a calculator
  is precisely the refusal to trust it. Only the second sense can do the work the
  argument needs, because the first sense is available for the notebook only on pain
  of circularity: the notebook is reliable insofar as Otto was accurate when he wrote
  in it, and whether he was accurate is exactly what the theory of extended memory
  is supposed to explain.


