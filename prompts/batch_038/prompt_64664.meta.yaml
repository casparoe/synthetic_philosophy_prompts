  I am writing a chapter on the explanatory structure of the July Crisis of 1914,
  and I want to run it against Braudel''s scheme of historical time rather than against
  the usual diplomatic-military history.


  Braudel''s picture, as I understand it: history moves at several speeds at once
  — a nearly motionless layer of human relations to environment and geography; a middle,
  rhythmic layer of economies, states, societies and civilizations, moving in cycles
  and conjunctures; and a surface layer of events and individuals, which he treats
  as foam carried along by currents it does not create. Explanation, on this view,
  has to be located in the slower layers, and the event layer is where history is
  least intelligible.


  Here is what I want. First, sort the standard explanations of the outbreak of the
  war into those three layers as faithfully as you can: the alliance system and the
  arms race; the railway networks and mobilization timetables that made the German
  plan require a march through Belgium and made Russian mobilization, once ordered,
  effectively irreversible; the strategic assumptions about how long it would take
  to defeat France before Russia could fully mobilize; and then the personal and contingent
  material — the assassination at Sarajevo, the assurance Berlin gave Vienna in early
  July, the misjudgments and telegrams of the last week, the decisions for and against
  general mobilization. Say which of these actually does explanatory work in the causal
  story, and which merely sits there.


  Second, tell me where the sorting breaks down. My own suspicion, which I want you
  to test rather than flatter, is that the items that mattered most in 1914 are slow
  without being Braudelian: a railway network or a mobilization plan is a human artifact,
  made within living memory, yet once built it is nearly as immovable as a mountain
  range for anyone trying to change it inside a fortnight. Braudel''s axis is speed
  of change; what the July Crisis seems to require is an axis of ... [reversibility/cost
  of undoing]. Develop this objection as strongly as you can, and then say whether
  it is fatal or whether Braudel''s middle layer can absorb it.


