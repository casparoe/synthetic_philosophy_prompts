  ---


  Title: "Two Robustnesses: Canalization, Lock-In, and What We Are Actually Asking
  When We Ask Whether the Tape Would Play the Same"


  Draft for a workshop, ~5,000 words target; what follows is the skeleton plus the
  paragraphs I''ve already written.


  §1. The question and why it is not one question.

  "Would the same outcome have arrived anyway?" — the standard gloss on path dependence
  is counterfactual: an outcome is path-dependent if it would not have obtained had
  the process taken a different early branch, and it is locked in if it cannot now
  be dislodged even by agents who would prefer an alternative. Increasing-returns
  models (Arthur) are offered as the mechanism: small early advantages compound because
  of coordination, training networks, complementary investments, and switching costs.
  Two literatures then fight: economists who say the persistence of an incumbent standard
  is evidence of its efficiency, and historians who say it is evidence of an accident
  that hardened. I claim the fight is under-specified in two ways that are usually
  run together.


  §2. First conflation: two different robustnesses.

  Waddington''s canalization is robustness of a developmental trajectory to perturbation:
  the process departs and returns to the same endpoint. Lock-in, as the term is used
  in the economics of standards, is a claim about the accessibility of alternatives:
  as the process proceeds, the set of outcomes reachable by any intervention that
  actual agents could undertake shrinks. These are not the same property and they
  can come apart in both directions.

  (a) A process can be strongly canalized with respect to the perturbations it actually
  meets and still have had a large reachable set at the start... e.g. development:
  robust to temperature, maternal nutrition, minor genetic variation, yet large-scale
  perturbations (homeotic mutations) reach very different endpoints; canalization
  is graded by perturbation size.

  (b) A process can be locked in — no alternative now reachable at any price the relevant
  agents would pay — while being extremely non-canalized in its current state; the
  outcome is unavoidable only because all the exits have closed, not because the trajectory
  would return if disturbed. Example: an outcome sustained not by feedback but by
  the sheer cost of coordination to leave it; disturb it in the right way (a coordinating
  shock — a large buyer switching, a state mandate) and it collapses immediately,
  even though it was, ex ante, unavoidable.

  Increasing returns delivers (a) for perturbations below the switching-cost threshold
  and delivers (b) only relative to a specified set of agents and prices. Treating
  the two as one property is what allows the efficiency critics to answer historical
  claims: they show that the incumbent would have returned after small disturbances
  (canalization) and conclude the incumbent was never an accident.


  §3. Second conflation: three counterfactuals.

  C1 (perturbation): same process, same initial conditions, small disturbance at time
  t; does the system return?

  C2 (branch): same world up to a branching point t*, an alternative branch taken
  there, everything downstream re-solved under the same structure and constraints.

  C3 (deep re-run): different initial conditions, same laws/generating structure —
  Gould''s tape.

  Increasing-returns models are formulated to answer C1 and, with effort, C2 for a
  nearby branch. Almost all public assertions are at C3. Claims at C3 need a modal
  premise about the space of possible processes, not a dynamical model of one process.

  The two famous standoffs map onto this. In the keyboard case, the critics'' point
  — that the evidence for the alternative layout''s superiority was generated by its
  own proponents, and that any real advantage would have to be net of retraining an
  entire typing labor force — is a point about which interventions are in the set,
  i.e., about C1/C2 with an agent-relative intervention budget. The Gould–Conway Morris
  standoff is at C3 and about the size of a constrained morphospace: convergence shows
  that certain adaptive solutions are reached from many starting points (eyes, echolocation,
  eusociality, camera-type eyes arising independently), which is a robustness result
  about outcomes under C3 but says nothing about which lineage realizes them or when.
  One can accept pervasive convergence and total lineage-level contingency without
  contradiction; indeed the same is true in economics — an incumbent standard''s persistence
  is compatible with the claim that which standard it would be is an accident.


  §4. Outcome-grain.

  Both robustness and contingency are relative to how finely outcomes are individuated.
  "Eyes," "camera-type eyes," "camera-type eyes with inverted retinas wired the way
  vertebrates are," and "vertebrate eyes in this clade" are four outcomes with wildly
  different contingency profiles. Same in the standards case: "a QWERTY-family layout,"
  "the layout actually standardized," "the particular set of manufacturer decisions
  that produced it." A path-dependence claim is therefore doubly indexed: to an intervention
  set I and an outcome grain G. Controversies look intractable because disputants
  vary I and G without noticing.


  §5. My problem: is §4 deflationary?

  If every claim is indexed to (I, G), then "history is locked in" is either false
  (choose a G fine enough or an I large enough) or true (choose a coarse G or a tiny
  I). I want to resist this by arguing that some indices are privileged: I should
  be the set of interventions the actual agents in the system could undertake given
  their resources and information, and G should track equivalence classes that are
  stable across the interventions in I. But the second clause looks circular — the
  grain is chosen to make the claim come out as intended — and the first clause makes
  the thesis agent-relative in a way that seems to lose the objective sense of lock-in
  that the whole debate was about. I don''t currently have a fix.


  §6. What I plan to do with it (brief).

  A formal sketch: represent the process as a dynamical system on a state space, define
  reachability relative to an intervention set with a cost bound, and show that canalization
  and lock-in correspond to distinct properties of the reachability relation (return-after-departure
  vs. shrinking of the cost-bounded reachable set). Then two worked cases: keyboard
  standardization and the vertebrate eye. If the formal sketch cannot distinguish
  the two properties in a non-trivial way, the essay collapses into a plea for precision,
  which is not worth writing.


