  Title: "Two Robustnesses: Canalization, Lock-In, and the Ambiguity in ''Replaying
  the Tape''"


  Section 1: Setup. Path dependence is usually defined via a counterfactual: the outcome
  would not have obtained had a different branch been taken early. Increasing-returns
  models (positive feedback, coordination costs, switching costs) explain why alternatives
  become progressively harder to dislodge. Standard examples: keyboard layout, technology
  standards, legal systems, institutions.


  Section 2: The distinction. Robustness-to-disturbance (canalization): the trajectory
  returns to the same outcome after perturbation. Robustness-of-alternatives (lock-in):
  the set of reachable outcomes shrinks as the process proceeds. These come apart:
  a process can be highly canalized yet have a large basin structure such that many
  outcomes were reachable from the start (e.g., development with a huge number of
  equally viable endpoints given a large enough perturbation); and a process can be
  strongly locked in — a unique outcome now unavoidable — while being extremely sensitive
  to perturbation right now (a knife-edge that has just happened to be resolved).
  Lock-in is a claim about the accessibility of alternatives from the present; canalization
  is a claim about the return dynamics after departure. The literature, I claim, treats
  increasing returns as evidence for both, but increasing returns only delivers canalization
  with respect to perturbations that don''t cross the switching cost threshold, and
  delivers lock-in only relative to a bounded set of interventions (agents who would
  pay the switching cost).


