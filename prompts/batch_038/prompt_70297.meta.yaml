  ---


  For a historiography methods seminar I have been asked to defend the following argument.
  I cannot tell whether it is sound or merely seductive, and I would like a diagnosis
  rather than reassurance.


  Setup. Call a work of history *whiggish* if it meets any one of these three conditions:
  (W1) it fixes its subject matter by reference to what has survived into the present;
  (W2) it explains past events partly by appeal to their consequences for us; (W3)
  it represents the conceptual schemes of past agents as incomplete or defective versions
  of our own. Butterfield''s complaint in *The Whig Interpretation of History* (1931)
  — to put it in these terms rather than his — is that works meeting these conditions
  misdescribe the past, because they turn it into an abridged prelude to us and make
  its actors seem more modern than they were.


  The argument.

  1. No history can be complete; the historian must select.

  2. Selection can only be made on grounds available to the selector, and what is
  available to a historian is a function of her own situation — which traces have
  come down to her and which questions she finds worth asking.

  3. Therefore every history fixes its subject matter by reference to what has survived
  into the present, and so meets W1.

  4. To explain an event is to say why it happened rather than otherwise; its consequences
  for the present are among the things that happened.

  5. Therefore an account that withholds those consequences explains less than one
  that includes them, and so every explanatory history meets W2.

  6. A historian describing what past agents took themselves to be doing — appealing,
  say, to humours, or to the divine right of kings — either renders those terms into
  ours or leaves them as they are; the first makes the past''s schemes look like variants
  of ours, and the second leaves the reader with nothing she can understand, which
  is a failure of historical understanding.

  7. Therefore every intelligible history meets W3.

  8. Hence every history is whiggish.

  9. Hence Butterfield''s warning cannot pick out a defect in any particular work:
  a charge that attaches to everything attaches to nothing, and whiggishness is not
  a criticism.


  I am confident that (9) is false — some histories do strike me as leaving the past
  considerably more foreign than others, and I want to be able to say so — but I cannot
  locate the step that licenses it, and several of the steps look to me like things
  a careful historian would simply agree to. Which premise or inference should be
  given up? Say why it looked acceptable in the first place, and what giving it up
  costs: I especially want to know whether W1–W3 can be restated so that they still
  describe a genuine vice rather than collapsing into the general difficulty of writing
  about the past at all. If more than one step is independently rejectable, rank them
  by the price of rejection.


  Please answer as exactly five numbered points of one or two sentences each, with
  no introduction and no conclusion.


