  assuming that because Locke used "political" in the sense of "the state," he must
  have been writing about politics in our sense). Key claim: recovering the intentions
  behind a text requires understanding the linguistic conventions/context available;
  the "illocutionary force" of the utterance. Skinner does NOT argue that we can''t
  judge past thinkers morally; he argues that anachronism distorts understanding.
  Also there''s a distinction: "hermeneutic" presentism vs. "evaluative" presentism.
