  Here is the claim, roughly. Escher''s Drawing Hands is the picture everyone reaches
  for when they describe recursive self-improvement: two hands, each drawing the other
  into existence, no outside help. The point of Hofstadter''s analysis of pictures
  like that is that the apparent closure is a trick of description — the loop only
  looks self-sustaining because a level of the hierarchy has been quietly exempted
  from it (the sheet of paper, Escher''s own hand, the viewer who supplies the interpretation
  of ''draws''). I want to argue that this is not an aesthetic curiosity but a structural
  claim about self-revision, and that it transfers: any process by which a system
  edits its own standards of success must run against something that the editing process
  itself is not editing at that step, or else ''improvement'' loses its meaning and
  there is only change. Three steps. First, distinguish levels of editability — parameters
  are editable by training; the objective is editable by whatever rewrites the objective;
  the criterion for judging candidate objectives is editable only by a yet-higher
  move, and so on. Second, argue that at each level the edit has to be scored by something
  not currently up for edit, since a metric that shifts along with the thing it scores
  cannot distinguish better from different. Third, draw the safety consequence: the
  interesting question is never whether a self-improving system has an inviolate level
  — it does, necessarily — but which level is inviolate, who chose it, and how quickly
  it drifts out of the designers'' field of view as the system gets bigger. In the
