  Moves:

  1. Benchmark scores are not measurements but projections: from a finite, examined
  sample to a claim about an unexamined competence. The generalization is lawlike
  only if the predicate it uses is projectible.

  2. Goodman''s predicate grue — examined before some date t and green, otherwise
  blue — shows that "all examined emeralds are green" and "all examined emeralds are
  grue" are equally supported while projecting incompatibly. The discipline''s standard
  predicates (accuracy, loss, contamination-free held-out score, tokens, parameters)
  are projectible because they are entrenched, not because they are natural in any
  strong sense.

  3. My coinage "the exam-time clause": every evaluation carries an implicit date
  index — the cutoff of the training corpus, the embargo on the test set, the version
  of the task family. When the systems under test begin to generate the data that
  later systems train on, that clause stops being a formality and becomes load-bearing:
  predicates whose extensions were fixed by examination become projectible by accumulation
  of examination. I call that retro-entrenchment, and I argue the field''s current
  practice (models trained on the open web including benchmark-adjacent material;
  benchmark authors writing tasks that the next generation of models helps draft)
  is quietly converting formerly non-projectible predicates into projectible ones,
  which is why scores that looked like capability measures increasingly look like
  measures of overlap.

