  Actually, do I really need to verify? The prompt will gloss Malcolm''s and Dennett''s
  positions in the asker''s own casual words. My memory: Malcolm (1956, "Dreaming",
  Philosophical Review; expanded into the book *Dreaming*, 1959) argued that "dreaming"
  is not the name of an activity or experience occurring during sleep; rather, to
  say "I dreamt that p" is to say something like "on waking I had the impression that
  p had happened" — the concept of dreaming is tied to what we say on waking. He held
  that the notion of experiences occurring during dreamless/sleeping states is incoherent
  because there''s no criterion for such experiences (behavioural/verbal criteria).
  Dennett (1976, "Are Dreams Experiences?") argued, partly defending Malcolm, that
  dreams may be "transcripts" or stories that are composed/inserted at or near waking
  (a "just-in-time" confabulation), rather than experiences that occur during sleep;
  he compared it to how a computer program might generate a plausible output. He presented
  it as a speculative but coherent possibility and noted evidence about dream memory''s
  fragility, incorporation of stimuli, etc. Later, in *Consciousness Explained* (1991)
  and elsewhere, Dennett discusses this again; and there''s also his reply in "Are
  Dreams Experiences?" to critics.


  Also relevant: the "incorporation" phenomenon (Dement & Wolpert 1958 experiment
  spraying water on sleepers'' faces → dreams incorporating the spray), and LaBerge''s
  lucid dream eye-movement signalling.


