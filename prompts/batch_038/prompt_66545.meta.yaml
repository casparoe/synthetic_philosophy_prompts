  STUDENT ANSWER


  (a) The thesis is that origin is essential: necessarily, the Queen originates from
  the sperm and egg she in fact originated from, so there is no possible situation
  in which this very woman is born of wholly different parents. Kripke''s argument
  depends on his account of possible worlds. Worlds are not remote countries we peer
  into through a telescope to see which individuals turn up there under which descriptions;
  they are stipulated, specified by the descriptions we attach to them. So the question
  whether a situation in which a woman is born to the Trumans and grows up in Missouri
  is a situation in which the Queen is born to the Trumans is not a question for further
  investigation: it is settled by how we specify the situation. And we specify situations
  of that kind by origin. The table case is the same: a table made from a completely
  different block of wood is a different table, however exactly its shape, colour
  and subsequent history match.


  Two features of the argument deserve emphasis. First, the necessity is de re: it
  is the woman herself, not a sentence about her, that could not have had other parents.
  Second, the thesis is not an independent posit but a corollary of the necessity
  of identity. Identity statements, where true, are necessary, and there are no contingent
  identities. Elizabeth is the individual who originated from that particular gamete
  pair; necessarily, then, she is that individual; and whoever originated from that
  pair is she. It follows that she could not have originated from any other pair,
  and anyone who accepts the necessity of identity is committed to the conclusion.
  Kripke''s own formulation is hedged — a completely different sperm and egg — which
  shows he is not claiming that an altered nucleotide would have produced someone
  else; but the hedge also raises a tolerance problem, since Kripke never says where
  the boundary lies or what principled reason there could be for drawing one.


  (b) The objection is that stipulation makes the thesis empty. If we choose, in describing
  a counterfactual situation, which individual we are talking about, then we can simply
  decline to call the Truman-born woman the Queen, and the resulting impossibility
  is a fact about our own labelling rather than about the world. The objection''s
  real force is that it offers the essentialist no work to do.


  The best response is that the objection misconstrues stipulation as arbitrary. Stipulation
  is answerable to the object stipulated about: we do not get to decide, of any description
  we like, that it picks out the Queen. On Lewis''s alternative there is no transworld
  identity at all, only counterpart relations, and the objection takes a different
  and arguably more damaging form there, since what settles which individuals are
  the Queen''s counterparts is a matter of overall similarity, which can come apart
  from origin.


  But if the response is right, it changes the status of the thesis. What we have
  is a rule governing the use of the name, not a discovery about the metaphysics of
  the woman. Understood that way the thesis is immune to counterexample, because no
  description of a situation can oblige us to apply the name against our own rules
  of application — but it is also no longer the sort of thing that could have been
  otherwise, and the air of deep metaphysical necessity that surrounds it is largely
  a reflection of how we talk.


  (c) Twinning is a genuine problem. In monozygotic twinning a single zygote gives
  rise to two persons with the same gametic origin. Kripke''s hedge does not help
  here, since the twins do not differ slightly in origin: they share it exactly. If
  sameness of origin were what fixed transworld identity, the two sisters would have
  to be one individual, which they are not.


  The essentialist can retreat to the claim that origin is necessary but not sufficient,
  and that the twins merely show that origin does not by itself determine who is who.
  But the retreat is expensive. A necessary condition on being the Queen that is compatible
  with any number of individuals satisfying it does not settle which of them she is,
