  The Condorcet jury theorem, from his 1785 Essay on the Application of Analysis to
  the Probability of Majority Decisions, says the following. Suppose a group of n
  voters each has to choose between two alternatives, one of which is correct, and
  suppose each voter, reasoning on their own, picks the correct one with probability
  p. If p is greater than 1/2, then the probability that the majority picks correctly
  is greater than p, it goes up as n goes up, and it goes to 1 in the limit as the
  group gets indefinitely large. If p is less than 1/2 the majority probability goes
  to 0 instead, and if p is exactly 1/2 the majority is no better than a coin flip
  at any size. So the theorem is really a claim about limits, and it doesn''t promise
  that any particular jury of twelve will get it right — it only says which way the
  odds move as you add members.


  The assumptions doing the work are: (1) two alternatives only; (2) there is a fact
  of the matter about which one is correct, and it''s the same fact for everybody;
  (3) each voter''s competence p is above a half; (4) the votes are independent; (5)
  everybody votes what they actually believe rather than strategically. Assumption
  (5) is the one people forget. If jurors vote the way they expect the majority to
  go, they aren''t adding information, and the theorem''s input breaks down even if
  the arithmetic is fine. There''s also a puzzle in the neighborhood that I think
  is interesting: once the group is large, each member''s belief that the majority
  will be right is very high, so a member who wants to be right should just go along
  with the expected majority rather than vote their own judgment, which makes it hard
  to see why anyone should bother voting sincerely at all.


  Of the assumptions, independence is usually named as the most threatened in real
  deliberative bodies, but I think that''s overstated. Independence here just means
  that nobody''s vote causes anybody else''s — it''s an assumption about voters not
  colluding or being bribed, not an assumption about them being ignorant of the same
  facts. In a citizen assembly everyone reads roughly the same reporting and hears
  the same expert testimony, but each of them still has to make up their own mind
  about it, and if anything sharing the evidence raises everybody''s p rather than
  lowering it. What actually threatens the theorem is deliberation in the sense of
  social pressure: people deferring to a loud or prestigious member, or trading votes.
  That''s a competence problem as much as an independence problem, and it''s the reason
  Condorcet wanted jurors to decide separately.


  On the main question: yes, the theorem licenses preferring the 400-person assembly
  to the 12-person expert panel, as long as we can establish that the assembly''s
  members are individually better than chance. Once p is above 1/2 the majority''s
  reliability climbs toward certainty without limit, whereas the panel is capped at
  twelve — a panel of experts might have a high p, but it has almost no room to improve
  by aggregation, and if one of the twelve is wrong or captured there''s no crowd
  to outvote them. So the comparison comes down to a single threshold question about
  competence, not to a trade-off between the size of the group and how good its members
  are. This is the same lesson as the wisdom-of-crowds results generally: the diversity
  prediction theorem says a crowd''s error equals the average error of its members
  minus the diversity of their predictions, so a large diverse group beats even its
  best member, and you can see it empirically in Galton''s ox-weight contest, where
  the crowd''s middle estimate of the dressed weight came within about one percent
