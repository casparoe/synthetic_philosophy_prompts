  CJT setup: A group of n voters, each independently has probability p of choosing
  the correct alternative. If p > 1/2, the probability that the majority is correct
  increases with n and tends to 1 as n→∞. If p < 1/2, the majority tends to be wrong,
  probability → 0. If p = 1/2, it stays at 1/2.


  Common subtle mistakes:

  1. Claiming the theorem shows democracy is good because it aggregates preferences
  — conflating the truth-tracking (epistemic) with preference aggregation (Arrow).
  The CJT is about a common good / correct answer, not about aggregating diverse preferences.

  2. Claiming p > 1/2 is sufficient for the majority to be right with certainty at
  any finite n — the theorem is a limit result; for finite n, majority correctness
  probability can be well below 1 and even the theorem doesn''t say majority is always
  right.

  3. Confusing "the probability that the majority is correct" with "the probability
  that a given voter is correct" — or thinking that CJT implies individual competence
  rises.

  4. Claiming independence is harmless because errors are "diverse" — actually correlated
  errors destroy the theorem; correlation is the big deal. A student might say "positive
  correlation just means voters share information, which is fine because they still
  each have p > 1/2." That''s wrong.

  5. Misattributing: the CJT is about Condorcet 1785, Essai sur l''application de
  l''analyse. Some attribute to Condorcet''s "paradox" work.

  6. Confusing CJT with the "miracle of aggregation" (Page''s Diversity Prediction
  Theorem) — diversity prediction theorem says group average error = average individual
  error minus diversity of predictions. That''s a different result (Scott Page), often
  conflated. A student might say "the diversity prediction theorem shows the majority
  is right because errors cancel out" — mixing.

  7. Claiming the theorem requires unanimity.

  8. Claiming the theorem works with p slightly above 1/2 even for small n.

  9. The "problem of the juror''s own vote being swamped" — the paradox of participation:
  if the majority is almost certainly right, individual voting seems pointless. Or:
