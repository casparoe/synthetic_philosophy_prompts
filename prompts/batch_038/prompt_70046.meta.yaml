  ---


  Third year political theory PhD student here, and chapter three of my dissertation
  is a defence of Simone Weil''s case against political parties — the short posthumous
  essay where she argues they should be abolished outright. But I''m not defending
  it on her terms, and I need someone to tell me where that leaves me exposed.


  Weil''s own mechanism is about the individual member''s mind: the party turns its
  own growth into an end, and the member, wanting that growth, ends up treating truth
  as a function of it — she''s pretty explicit that the party spirit is a corruption
  of the capacity for attention, and that the harm is done to thinking rather than
  to institutions. My reconstruction moves the mechanism. What I argue is that joining
  a party is entering a standing pre-commitment to treat a shifting and largely unpredictable
  set of questions as closed, and that the real damage isn''t false beliefs held by
  members but a damaged agenda: questions that stop being askable inside the organisation,
  so the party systematically fails to register facts about its own constituencies.
  Vice of agenda foreclosure, not vice of motivated reasoning. I think this is stronger
  partly because it dodges the standard political science reply that partisan cue-taking
  is a rational heuristic for people with no time to read policy — on my version the
  problem isn''t that members outsource judgements they can''t make, it''s that certain
  judgements never get made by anyone.


  My committee will attack this from every side and I''d rather get hit now. So: what
  would count against it? Ranked, from "chapter three doesn''t survive this" to "awkward
  but I can footnote my way through". For each defeater I want to know what would
  actually have to be true for it to bite, how much of the thesis it takes with it,
  and whether it''s a live threat or just a logically possible one. Include the empirical
  side — but I can''t check references, so if you''re not confident a study or finding
  exists, describe the kind of evidence that would do the work rather than inventing
  a citation; a well-specified hypothetical finding is more useful to me than a made-up
  one. Tell me also what the position predicts that the rival accounts don''t, and
  where those predictions could come apart from what we see — I''ve already got the
  obvious ones in my head (parties as the vehicle through which neglected issues like
  prison conditions or environmental damage reached the agenda at all; the fact that
  Weil herself spent time inside left organisations in the 1930s and knew exactly
  what she was describing, which cuts both ways) so push past those.


  And please be straight with me about the soft spot I suspect: whether the thesis
  has been qualified into unfalsifiability. My worry is that any counterexample can
  be absorbed by saying a party that keeps its questions open isn''t in the grip of
  party spirit, so the view becomes compatible with anything. If that''s right, say
  whether it''s fatal for a thesis of this kind — a normative claim wrapped around
  an empirical mechanism — or whether insulation is more forgivable here than it would
  be in, say, a purely empirical theory.


  Two more asks. First, commit: I don''t want a balanced survey with the decision
  left to me. Take a position on the ranking and on the insulation question and give
  your reasons. What would move me most, in order, is (a) a finding or comparative
  pattern of exactly the shape my thesis says shouldn''t exist — parties measurably
  widening what gets asked — and (b) a case where my mechanism is present but the
  predicted damage is absent, so it''s a demonstration that foreclosure isn''t doing
  the work I claim. Second: if you think my reconstruction just isn''t Weil, and I''m
  using her name as scaffolding for something else, say so in the first section —
  "it''s a legitimate development of her argument" is not an answer unless you say
  what of her argument survives the move and what I''ve thrown away.


