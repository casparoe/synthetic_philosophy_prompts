  by the Romans and the sacrificial cult just stopped, cold, after roughly a thousand
  years of continuity. The rabbinic response is the part I care about. The tradition
  has Rabban Yohanan ben Zakkai smuggled out of besieged Jerusalem in a coffin by
  his students so he could get an audience with Vespasian, and the request he makes
  isn''t for the Temple to be spared — it''s for Yavneh and its sages, i.e. for permission
  to keep a school going. Then, over the following generations, the rabbis build an
  entire replacement architecture: the daily prayers are set up to mirror the daily
  offerings (the Talmud has a sage saying the fixed prayers were instituted to correspond
  to the sacrifices, in timing and in structure), a midrash has ben Zakkai comforting
  Rabbi Yehoshua, who is grieving that the place of atonement is gone, by pointing
  to a prophetic verse about God wanting kindness rather than sacrifice, and atonement
  is relocated onto deeds of lovingkindness, prayer, and Torah study. Meanwhile the
  liturgy never lets go: the morning service includes a recitation of the order of
  the daily offering, one of the blessings in the central prayer asks God to accept
  Israel''s offerings and restore the service, the extra service on sabbaths and festivals
  petitions for the Temple cult to come back, and on Yom Kippur the congregation hears
  a blow-by-blow narration of what the high priest used to do. So you get substitution
  and restoration-hunger in the same texts, at the same time, from the same people."


