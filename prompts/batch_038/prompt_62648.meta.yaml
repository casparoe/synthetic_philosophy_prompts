  "Now the theory I want to run this through. In the Guide, Maimonides gives a famously
  deflationary account of the sacrifices: the Israelites emerging from Egypt could
  not have been expected to abandon suddenly the mode of worship the whole ancient
  world shared, so God, rather than demanding an impossible leap, transferred the
  existing sacrificial practice to his own name and restricted it to one place, as
  a way of destroying idolatry while keeping the people onboard. He compares it to
  the way a parent handles a child''s filthy habit by redirecting it rather than by
  frontal prohibition, and to the forty years in the wilderness, which he reads as
  God hardening the people gradually because human nature can''t take abrupt change.
  So on that reading the sacrifices are a divine concession, a piece of pedagogy aimed
  at a historical audience, not something with value in itself — and notably he treats
  prayer as obligatory everywhere and at fixed times while sacrifice was tied to one
  spot, which reads like a deliberate asymmetry. Then, in his law code, he says the
  messianic king will rebuild the Temple and restore the sacrifices exactly as before,
  and he devotes big chunks of the code to Temple procedure. Readers have taken sides
  ever since: some say the Guide is the real Maimonides and the code is him wearing
  his rabbi''s hat, some say the concession passage is a kind of esoteric/noble-lie
  move aimed at philosophically tempted readers, some try to harmonize the two by
  arguing both texts agree the sacrifices have no magical efficacy and restoring them
