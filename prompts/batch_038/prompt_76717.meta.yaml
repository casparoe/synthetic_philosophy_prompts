  Actually let''s think about what each theory needs:


  - Feeling views (James): emotion = perception of bodily changes. If there is no
  bodily change, there is no emotion. So the case should include bodily change but
  no evaluative content — a Jamesian could handle it fine (indeed, it''s the paradigm:
  fear = the feeling of the body''s changes). Actually a Jamesian would say R is afraid,
  full stop; her denial that she''s afraid is a report about judgments, not about
  the emotion. So the case challenges cognitivism, not Jamesianism.

  - Judgment/cognitivist views (Solomon: emotions are judgments; Nussbaum: evaluative
  judgments about things outside one''s control, with a "assent"/"appearance" distinction
  for recalcitrant cases): must say either R is not afraid (only has fear-like bodily
  feelings), or that R does harbor an evaluative judgment she disavows — which then
  needs an account of what it is to judge something one sincerely denies. Nussbaum''s
  move: distinguish "assent" from "appearance"; recalcitrant emotions are like illusions
  (Müller-Lyer) — appearances without assent. But if the emotion is a judgment and
  judgments require assent, then recalcitrant emotions aren''t emotions. That''s the
  crux: Nussbaum is forced to call it "emotion-like" or to weaken judgment to appearance.

  - Perceptual views (Döring, Tappolet, Prinz''s "nonconceptual perceptual intentionalism"):
  emotion is a perception of value — danger-ness — with nonconceptual content; perceptions
  can persist despite contrary judgment, as with visual illusions; this explains recalcitrance
  and arationality (the emotion can be fitting/unfitting without being rational/irrational).
  The cost: perceptions can''t be rationally assessed, so we lose the intuition that
  R''s fear is criticizable, and the perceptual view has to explain the motivational/action
  link and the connection to feeling.


  To make the case bite against all three, add a second limb: R reports the tightening
  chest and cold hands, and says she feels "nothing at all like fear" — she can''t
  identify any felt quality that would make this fear rather than, say, excitement
  or the feeling of having drunk too much coffee. So Jamesian feeling view faces the
  problem that bodily feelings alone don''t determine emotion type (the classic objection:
  the same pattern of arousal could be fear, anger, or excitement; Schachter-Singer
  style). And the case can specify that when she later is told the surgeon was in
  fact investigated for misconduct (unfounded?), her response didn''t change — so
  no evidential updating.


  Also add a twist that makes it hard for the perceptual view: the response only occurs
  in the lift, not when she sees him across a corridor or reads his name; and she
  has no visual/auditory experience of danger — she reports no sense that he''s frightening.
  So the "perception" has no perceptual phenomenology of value; only bodily changes.
  Then the perceptual theorist has to say the perception is nonconceptual and can
  be non-conscious, or reduce to Prinz''s "embodied appraisal" — which collapses back
  toward James.


