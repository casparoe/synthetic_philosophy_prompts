  never repealed earlier ones, and frequently conflict. Courts resolve conflicts by
  applying whichever circular is most recent in time; where circulars are issued the
  same day, they apply the one bearing the lower number. No circular has ever been
  declared invalid, and no court has ever declined to apply one. Citizens can obtain
  any circular from the Gazette on payment of a fee."


