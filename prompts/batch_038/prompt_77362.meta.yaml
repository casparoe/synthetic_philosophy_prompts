  A colleague in my metaphysics reading group has an argument he presents as showing
  that ordinary disposition ascriptions — fragility, conductivity, solubility, irritability
  — are empty, and I have been unable to locate the flaw. He begins from the simplest
  available analysis and generalizes from the standard trouble cases. His steps:


  (1) To say that x is disposed at t to M when it undergoes S is to say no more than
  that, were x to undergo S at t, x would M. Nothing over and above the counterfactual
  is meant by the disposition.


  (2) Consider the familiar electro-fink: a live wire attached to a device that, at
  the instant a conductor touches the wire, ceases to supply current and simultaneously
  alters the wire''s structure so that it is no longer conductive. The wire at t is
  disposed to conduct when touched by a conductor; yet were it touched at t, it would
  not conduct. So the left-to-right direction of (1) fails.


  (3) The device in (2) is doing no special work. Whatever intrinsic basis B underwrites
  a disposition, B can be described as removable, and as removable in the interval
  between stimulus and manifestation. Symmetrically, B can be described as blocked
  in that interval while remaining wholly intact — the styrofoam cup that keeps its
  molecular structure but has its breaking prevented by packing, or the glass that
  is surrounded by a guardian who would catch it. So for every x, S, and M there is
  a possible case in which x has the disposition and the counterfactual of (1) is
  false.


  (4) Reverse the device: suppose a malign spirit hates fragility and would ensure
  that any styrofoam cup is struck and shattered, whatever its intrinsic structure.
  Then the counterfactual in (1) is true of the cup although the cup is not fragile.
  So for every x, S, and M there is also a possible case in which x lacks the disposition
  and the counterfactual is true.


  (5) Hence the truth or falsity of the counterfactual is not even weakly diagnostic
  of the disposition: in every case there is a nearby possibility in which they come
  apart.


  (6) But (1) was supposed to state what the disposition consists in. If the counterfactual
  is not diagnostic of it, and there is nothing else to it, then there is no fact
  of the matter which objects have which dispositions.


  (7) Therefore nothing is fragile, conductive, soluble, or irritable. All such ascriptions
  are false, or at best vacuous.


