  Let me draft:


  ---


  I am preparing a paper on the semantics of slurs for a journal submission and, before
  writing it up, I want a careful audit of whether the position I have converged on
  is internally tenable. I would rather find the fractures now than have a referee
  find them. Here is the view, stated as a set of commitments.


  (C1) A slur and its neutral counterpart are truth-conditionally equivalent. "Alf
  is a Boche" is true in exactly the circumstances in which "Alf is German" is true.
  Nothing contributed by the slur makes any difference to whether the sentence is
  true.


  (C2) The difference between the two sentences is nevertheless semantic, not pragmatic.
  It is encoded by convention in the lexical item, not inferred: it is not recoverable
  from general conversational principles, from the speaker''s evident intentions,
  or from what the audience expects. A hearer who does not know the word cannot work
  the derogation out.


  (C3) The derogatory component is not at-issue content. A sentence containing a slur
  is about the same thing its neutral counterpart is about, and a bare denial ("that''s
  false") targets the neutral counterpart''s content, not the derogation. There is
  no such thing as contradicting a slur.


  (C4) The derogatory component is nonetheless projective and non-displaceable. It
  survives embedding under negation, in the antecedent of a conditional, in questions,
  and in attitude reports, and where it surfaces it surfaces as the attitude of the
  person whose mouth it comes out of — it cannot be shifted onto someone else, and
  it cannot be cancelled or modulated by further context.


  (C5) Reclamation is genuine, not merely apparent. When members of the target group
  use the word among themselves, the derogation is absent from the utterance''s content,
  not merely suspended, quoted, or pretended; and such uses are fully correct uses
  of the word, as correct as any other, differing only in who is licensed to perform
  them.


  (C6) Meaning is fixed by the standing social practice, not by any individual. What
  the word means depends on the norms governing its use in a community — who may deploy
  it, against whom, and to what end. Users can violate those norms, and can be mistaken
  about them, but no individual use, however deviant or widespread, alters the meaning;
  only the practice as a whole can do that, and the practice as a whole changes slowly,
