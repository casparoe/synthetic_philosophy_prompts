  STUDENT ANSWER:


  (a) No — wording isn''t the issue here, the direction of the speech is. Regret reports
  a state of mind about a state of affairs. I can say "I regret that it rained on
  your wedding day" and I haven''t admitted to anything, because I didn''t cause the
  rain and nobody thinks I did. Regret is compatible with being a bystander, and even
  with being glad, as long as you''re prepared to say you wish things had gone otherwise.
  An apology is different in kind: it''s a performative. In saying "I apologize" the
  speaker doesn''t describe a feeling, she does something — she takes the wrong onto
  herself, places herself in the position of one who owes, and in doing so changes
  the normative standing between her and the person wronged. Austin''s point is that
  performatives can go wrong in two different ways: sometimes the act doesn''t come
  off at all, because the right person didn''t say it or the circumstances weren''t
  there (a marriage performed by someone who isn''t a registrar); and sometimes the
  act does come off, but comes off hollow, because the speaker doesn''t have the thoughts
  or feelings the procedure calls for — a promise made with no intention of keeping
  it.


  So the interesting thing about the Vardian motion is what''s missing. The motion
  never says the removals were wrongful. Regret "at the suffering caused" is regret
  at an outcome, and you can regret an outcome while holding that what produced it
  was legitimate — a general can regret the casualties of a battle he thinks was just.
  Until the state says the removals were wrong, it hasn''t acknowledged anything,
  and acknowledgement of wrongdoing is the whole content of an apology. That''s also
  what the no-liability clause is for: it''s a device for producing the emotional
  register of an apology while withholding the acknowledgment that would make it one.
  I''d say the motion is regret with apologies-shaped packaging.


