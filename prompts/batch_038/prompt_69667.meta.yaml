  Actually, the strongest novelty injection: build the taxonomy not around the *moral
  theory* (act consequentialism vs. deontology vs. virtue ethics) but around **which
  premise of the inefficacy argument each position denies**. The inefficacy argument
  is roughly:

  P1: My act (buying this steak, driving, not voting) makes no difference to the harm
  / no perceptible difference to anyone.

  P2: If an act makes no difference to anyone, it is not wrong (on grounds of harming).

  C: So my act is not wrong on grounds of harming.


  Responses: deny P1 via expected-disutility reasoning (Kagan-style: probability of
  triggering thresholds / expected harm is nonzero); deny P1 via non-perceptible but
  real cumulative effects (Sorensen''s "shadow" cases, "imperceptible harms" — Parfit''s
  "mistakes in moral mathematics" cases: the harmless torturers, the bad Samaritans,
  the second bad Samaritan); deny P2 (the act can be wrong even if it makes no difference:
  complicity, integrity, virtue, expressivist reasons, fairness/free-riding); accept
  both premises but deny the conclusion by shifting the object of evaluation from
  individual acts to participation in collective schemes (Kutz''s complicity principle;
  the duty to join and support collective action); or reject the argument''s frame
  entirely (the act is wrong because it violates a rule whose general acceptance would
  be best — rule consequentialism; or because of the "participation" conception).


  Also, the voting case adds a distinct wrinkle: probability of being decisive is
  tiny but nonzero, and the stakes are large; expected-utility arguments (Edlin, Gelman,
  Kaplan''s "voting as instrumental rationality"); the "expressive" view of voting
  (Brennan & Hamlin, "rational irrationality"); the fairness/free-rider view of voting
  (Lomasky & Brennan''s "is there a duty to vote?"); and Parfit''s "hitchhiker"/"Prisoner''s
  dilemma" analysis. Also the "triggering probability" issue and the "problem of inconsequentialism"
  in climate.


