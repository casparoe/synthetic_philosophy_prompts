  Draft:


  "I am applying for an eighteen-month postdoctoral fellowship in practical philosophy
  and need a three-page research proposal. The half-formed idea I want turned into
  one concerns the inefficacy objection to individual duties in cases of collective
  harm — the argument that because my own act (this car journey, this steak, my abstention
  in an election with millions of other voters) makes no perceptible difference to
  anyone, it cannot be wrong on grounds of harm.


  The familiar replies come in at least five families: (a) probabilistic replies,
  on which the act does make a difference, but an expected rather than an actual one;
  (b) threshold replies, on which harms come in steps and some token act is the one
  that crosses a step; (c) cumulative replies, on which each act adds a real increment
  that is too small to be perceived; (d) non-effectivist replies, on which wrongness
  does not require making a difference at all — complicity, free-riding, integrity,
  character, the attitudes an act expresses; and (e) replies that relocate obligation,
  holding that the primary duty is to join and sustain collective action rather than
  to refrain from the individual act.


  My suspicion is that these families are not rivals answering the same question,
  and that the debate has stalled because each of them tacitly evaluates a different
  description of the act. Under the description ''buy this steak'' the causal reply
  fails and (d) or (e) looks necessary; under ''eat meat'' or ''participate in industrial
  animal agriculture'' the causal replies look more promising. What is almost never
  examined is the description itself: what fixes the right granularity at which the
  object of moral evaluation is picked out, and whether an account can specify that
  granularity without simply selecting whichever description yields its preferred
  verdict.


  Write the proposal. It should contain: a precise statement of the research question,
  in a form that has determinate possible answers; an account of why the existing
  positions leave the question open rather than settling it; a candidate set of constraints
  on act-description — the causal structure of the harm, the granularity at which
  the agent actually controls her behaviour, the description under which the agent
  herself deliberates, and a pluralism on which all are legitimate — together with
  an argument for which of these the project would take most seriously and what would
