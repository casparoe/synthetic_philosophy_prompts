  Draft:


  Paragraph 1 — context and the analogy:


  "I sit on a working group at a small liberal arts college that is redesigning our
  common first-year-to-senior core, and our external consultant has proposed a neat
  way of getting Whitehead into the conversation without actually having to read him.
  His claim is that Whitehead''s rhythm of education — the three stages of romance,
  precision, and generalization — is just the Dreyfus model of skill acquisition applied
  to a curriculum rather than to an individual practitioner: the stages line up one-for-one
  with novice, competent, and expert, the middle stage in both is where context-free
  rules and technique take over, and the endpoint in both is a return to unforced,
  fluid performance that no longer consults the rules. If that is right, he argues,
  three things follow for us: we can sequence the whole program linearly, with a romance-heavy
  first year, precision-focused middle years, and a capstone generalization phase;
  we can assess it with the five-level competency rubrics our professional accreditors
  already require, since those rubrics are just the Dreyfus stages in table form;
  and Whitehead himself can be dropped from the reading list and cited only as a historical
  anticipator, because the Dreyfus literature is where all the empirical and conceptual
  content lives. A colleague in our philosophy department thinks this is a category
  mistake dressed up as a simplification, but she has not been able to say exactly
  where."


  Paragraph 2 — the ask:


  "Can you audit the analogy rather than take either side? Start with an explicit
  correspondence table: what in the Dreyfus picture is supposed to play the role of
  Whiteheadian romance, precision, and generalization, what plays the role of the
  context-free rules, of the situation the performer responds to, of the passage between
  stages, and of expertise as the terminus. Then sort the disanalogies into the ones
  that actually threaten the consultant''s three conclusions and the ones that are
  merely differences of vocabulary or emphasis — I would rather have five load-bearing
  problems than fifteen. In particular I want you to deal with: whether the first
  stages really correspond, given that Dreyfus''s novice already operates by rules
  while Whitehead''s romance is supposed to precede systematization altogether; whether
  a rhythm that Whitehead describes as recurring at several scales at once — within
  a single lesson, within the study of one subject, and across the whole course of
  education — can be identified with a model whose stages a given learner passes through
  once, in order, on the way to expertise; what becomes of the alternation of freedom
  and discipline that Whitehead ties to the three stages, and whether anything in
  the Dreyfus picture corresponds to it; whether the Dreyfus model has any analogue
  of the pathology Whitehead is mainly worried about, the acquisition of ideas that
  are received and retained but never used, or of his insistence that education is
  about the utilization of knowledge rather than a level of performance; and whether
  the endpoint of generalization is a stage beyond expertise or a return to romance
  with technique in hand, which would matter for the capstone design. My colleague
  also suggested, in a way I could not evaluate, that Whitehead took the same threefold
  pattern to show up in his metaphysics of experience as well, and that this is why
  the rhythm cannot be reduced to a psychological model of learning; tell me whether
  that is a genuine disanalogy with real consequences for curriculum design or a piece
  of mystification that can be set aside."


