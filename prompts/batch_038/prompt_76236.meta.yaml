  for the hedonist to point at as the sole intrinsic good. Call this the heterogeneity
  problem. Explain the problem as precisely as you can, and assess Fred Feldman''s
  proposal that pleasure is not a sensation but an attitude — a matter of taking pleasure
  in some state of affairs — as a response to it. Does relocating pleasure from feeling
  to attitude solve the problem, merely restate it, or expose hedonism to new difficulties?"


