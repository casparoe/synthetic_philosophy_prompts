  Student answer draft:


  "Hedonism about well-being says that the only thing that is good for a person in
  itself is pleasure, and the only thing bad for a person in itself is pain. Everything
  else — friendship, knowledge, achievement — is good only insofar as it produces
  pleasure or is itself pleasurable. A person''s life goes better for them to the
  extent that their experience contains a greater balance of pleasure over pain.


  The heterogeneity problem starts from the observation that pleasures do not resemble
  each other. The warmth of a bath, the relief of a headache ending, the amusement
  of a joke, and the satisfaction of finishing a difficult proof have nothing introspectively
  in common. There is no single felt ingredient that runs through them, in the way
  that, arguably, a certain kind of visual quality runs through all the experiences
  of seeing red. Mill''s distinction between higher and lower pleasures makes the
  difficulty acute: if some pleasures are of a different quality from others, and
  the hedonist has no measure but the quantity and duration of pleasure, then the
  hedonist cannot explain why the higher ones are worth more, and the theory has no
  way of ranking the very things it says are the only bearers of value. Nozick''s
  experience machine is the same objection in a different costume: if we would refuse
  a life of maximally pleasant experience, that is because we think there are goods
  other than the feeling, and once we admit that, the feeling can no longer be doing
  all the theoretical work.


  Gilbert Ryle pressed the heterogeneity point hardest. He argued that ''pleasure''
  does not name a single sensation, but a loose family of episodes, dispositions,
  and ways of behaving; that there is no such thing as a feeling of pleasure; and
  that talk of pleasure should be dropped from serious psychology altogether. Fred
  Feldman accepts Ryle''s argument but draws a different conclusion. Instead of abandoning
  hedonism, he abandons the claim that pleasure is a sensation. On Feldman''s attitudinal
  hedonism, to be pleased is to take pleasure in some state of affairs — to have a
  favourable propositional attitude towards it. This is what allows the hedonist to
  handle the cases that defeated the sensational version. I can be pleased that my
