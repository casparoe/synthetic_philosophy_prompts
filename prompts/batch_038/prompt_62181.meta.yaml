  Half-formed idea from a PhD student (maybe in political philosophy or moral psychology):
  The literature on standing to blame has two dominant diagnoses of why hypocrites
  lose it: (1) the commitment/consistency diagnosis (the hypocrite''s blame contradicts
  their own commitments — blame involves a commitment to a norm they themselves violate,
  so they lack the authority/consistency), and (2) the moral-credibility/testimony
  diagnosis (the hypocrite''s blame is bad evidence, or they lack the right to demand).
  And there''s a third: the "equality of persons" diagnosis (Wallace: blaming hypocritically
  involves denying the equal moral standing of the blamed — it''s a form of unfairness
  / making an exception of oneself).


  Now the fresh angle: These accounts disagree sharply about *what would restore standing*,
  and nobody has systematically asked that question. On the commitment account, a
  sincere change of heart (or even a self-blame that acknowledges the norm) restores
  standing immediately, cheaply. On the credibility account, standing is restored
  only when the blamer''s future behavior makes their testimony reliable again — a
  track record, which takes time. On the equality account, standing is restored only
  when the blamer accepts the same demand being made of them, which may require accepting
  blame/punishment themselves. So: standing-regaining is the diagnostic test that
  discriminates between the accounts, and the accounts have been argued on the basis
  of intuitions about losing standing rather than regaining it. Plus: there''s the
  "cheap apology" phenomenon — an apology restores credibility in the eyes of the
  audience without restoring it in the account''s own terms; and the "proxy" move
  — recruiting a clean-handed third party to deliver the blame you lack standing to
  deliver. Does proxy blame restore or bypass? Some accounts say the wrong is in the
  blaming (so it can be outsourced and thereby laundered), others say the wrong is
  in the blaming relation (so outsourcing does nothing — indeed it''s worse, a manipulation).


