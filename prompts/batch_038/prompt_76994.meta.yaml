  the passage that does the argumentative work reads as follows:


  ''Presentism is the view that only the present moment is real; eternalism is the
  view that past, present, and future events are all equally real. Special relativity
  has settled the dispute in favour of eternalism. Because simultaneity is relative
  to a frame of reference, there is no fact of the matter about which distant events
  are happening now, and so no way to draw a unique boundary around the present. The
  argument was pressed in the 1960s by Rietdijk and Putnam: if what exists must be
  the same for every observer, and every observer''s "now" picks out a different slice
  of spacetime, then the only non-arbitrary ontology is the whole four-dimensional
  block. Two pedestrians passing on the street disagree about whether events in the
  Andromeda galaxy are present, and both are right. It follows that the future is
  already there, which is why free will turns out to be an illusion: the block does
  not leave room for anything to be genuinely open. For the same reason we should
  stop thinking of ourselves as objects wholly present at each moment, and think instead
  of four-dimensional worms spread out along the time axis. The one intuition presentism
  was built to protect — that time really passes — is a projection of our psychology.
  McTaggart made this point a century ago, and physics has since confirmed him. Presentists
  also owe us an account of what makes sentences about the past true, when on their
  view there is nothing past to make them true.''


  I want an accuracy audit of this paragraph rather than a defence or a rebuttal of
  it. Please go through it claim by claim and sort the claims into three piles: what
  a philosopher of physics would accept as stated; what is defensible only as a simplification,
  and what the simplification hides; and what is simply false. Where you find an error,
  say whether it is an error about the physics or about the metaphysics, since I can
  judge the first but not the second.


  Three questions in particular. First, the essay says relativity has ''settled''
  the matter. Set out exactly which premises are needed to get from the relativity
  of simultaneity to eternalism, and identify where a presentist can break the chain
  — and what a presentist has to give up or take on board at each of those points,
  so I can see whether any of the exits is dialectically cost-free. Second, do the
  two further conclusions — that fatalism follows, and that we are four-dimensional
  worms — follow from eternalism, or are they independent theses that the essay has
  attached to it? Third, what is McTaggart''s argument actually an argument for, and
