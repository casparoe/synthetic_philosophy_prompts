  pays it up front — the state lends it, and she pays back 9% of whatever she earns
  above a threshold, forever-ish, until 30 or 40 years later when the remainder is
  wiped. In the US she borrows too, but the federal loan basically can''t be discharged
  in bankruptcy — you can walk away from a house or a credit card, and you can''t
  hand back a degree — unless she can prove "undue hardship," which courts make almost
  impossible.


  So: three countries, same activity, three completely different legal-financial machines
  bolted onto it. My question is what each machine *presupposes*, philosophically.
  Not which one is better on the numbers — I can read an IFS report as well as anyone.
  I mean: what has to be true about a degree, and about the person holding it, and
  about her relationship to the rest of the polity, for each of these arrangements
  to be the sensible thing to do rather than a bizarre one?


