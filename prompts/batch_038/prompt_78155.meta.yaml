  like a graduate tax (income-contingent, no repossession, wiped after a fixed time,
  and the government''s own estimate is that a big chunk of the nominal total never
  comes back — which is why the national accountants eventually made them book the
  expected non-repayment as spending at the point the money goes out, not as lending).
  What view of the graduate does calling it a loan presuppose, given that the design
  contradicts the thing that makes a loan a loan? Is "loan" doing conceptual work
  or just political work?


  2. Germany''s version is usually described as "free." But it''s paid for out of
  general taxation, including from people who never went to university and will earn
  less than the graduate does, and the graduate "pays" later through a progressive
  income tax she''d be subject to anyway, made more progressive by the fact that she
  now earns a graduate salary. Isn''t that *also* an income-contingent charge on graduates
  — just collected invisibly and pooled with everyone else? If so, what''s the real
  philosophical difference between the German and English machines? I keep coming
