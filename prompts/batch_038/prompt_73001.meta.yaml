  Wait — is "poker with cards face up" a good analogy for program equilibrium? Actually
  in program equilibrium, the game is a prisoner''s dilemma where each player submits
  a program that can read the opponent''s program. The key result (Barak et al. 2005):
  you can achieve cooperative equilibrium via a program that cooperates if the other''s
  program cooperates with it — a "fair bot" / "transparent bot" idea, related to Hofstadter''s
  superrationality and to Bendor-Maital & Kalai''s work. Also relevant: the fact that
  in program equilibrium, there are also programs that exploit cooperators ("Always
  Defect against programs that are provably cooperative"), and the need for proof-based
  / bounded rationality. The Löbian cooperation results (Barasz et al., "Robust cooperation
  on the prisoner''s dilemma via program equilibrium") require the ability to prove
  things about the other''s code, and this depends on bounded reasoning.


  Where the face-up-poker analogy breaks:

  1. In poker with cards face up, information is symmetric and the value of the game
  collapses — it becomes a trivially determined game (you''d fold or you know the
  outcome). Actually with both hands face up and no betting rounds after reveal, the
  game has no strategic content at all; the winner is determined. Whereas in program
  equilibrium, seeing the code doesn''t determine the action — you still have to reason
  about what the code will do when it reads yours, which leads to self-reference/fixed
  points, not to a determined outcome. That''s a big disanalogy: transparency in poker
  removes uncertainty; transparency in program equilibrium creates self-reference
  (my program''s output depends on your program''s output which depends on mine).
  There''s no "fact of the matter" independent of the pair.

  2. In poker you see the cards but not the decision procedure; in program equilibrium
  you see the decision procedure but the "cards" (the payoff structure) are common
  knowledge anyway. The analogy maps hand↔source code, but source code is not a private
  state you might be lying about; it''s the disposition itself. A "bluff" would be
  code that behaves differently than it appears — impossible if the code is fully
  read and understood, but very possible if it''s too complex to actually simulate
  (bounded readers). So the analogy hides the fact that in practice reading code ≠
  knowing what it does. That''s the crucial import: the analogy assumes the reader
  can actually compute the opponent''s behavior, which is the hard part (halting problem,
  Löb''s theorem constraints).

  3. Poker is zero-sum; the prisoner''s dilemma is not. Face-up poker''s lesson is
  "no gains from deception" but in zero-sum games transparency destroys the game rather
  than enabling cooperation. The cooperation result in program equilibrium comes from
  the positive-sum structure plus mutual conditional cooperators, not from transparency
  per se.

  4. In poker, revealing your cards is a sacrifice (you give up information rent);
