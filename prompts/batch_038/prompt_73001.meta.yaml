  "why would you ever show your hand?" objection doesn''t apply; but conversely, there''s
  an asymmetry: in program equilibrium, unilateral transparency can be exploited (a
  program that defects against anything it can prove cooperative).

  5. The policy leap: open weights ≠ source-code access in a formal sense; deployed
  models don''t read each other''s code; the "players" in AI governance aren''t in
  a simultaneous-move game with full mutual inspection; and even in program equilibrium,
  there are many equilibria including nasty ones — transparency doesn''t select cooperation,
  it just enlarges the strategy space.


