  Prompt draft:


  You are a scholar of early modern French philosophy with a working knowledge of
  the Pensées and a second competence in contemporary political philosophy; you also
  referee for a journal in the history of political thought. Read the following draft
  carefully — twice, if you can — and give me a referee''s report.


  Draft (about a quarter of a longer paper; the section headings are for your orientation):


  **Title: Pascal''s Quietism Is Not a Prudence Claim**


  1. Pascal''s fragments on justice and force are usually read as cynical realism:
  justice without force is impotent, force without justice is tyrannical, and since
  we could not make justice strong we have instead made strength just, so that the
  two are combined and peace — the highest good — results. On this reading Pascal
  is saying that might makes right, or at least that legitimacy is a mask for power.
  I want to argue that this reading gets the direction of his claim wrong, and that
  the error matters.


  2. Distinguish two ways force can be related to a standard of justice. On what I''ll
  call a *target-directed* account, justice is identifiable independently of enforcement,
  and force is legitimate to the extent that it tracks that standard; enforcement
  is instrumentally valuable and its failure is a performance failure. On an *output-directed*
  account, there is no independently articulable standard at the level of positive
  law: what justice consists in at the level of enforceable rules is fixed by which
  rules the prevailing force in fact enforces. Force is not tracking the standard;
  it is selecting among candidates and thereby making one of them the standard.


  3. My claim is that Pascal is output-directed about positive justice and target-directed
  about justice as such, and that these two attitudes are held apart by his doctrine
  of the three orders. Evidence for the second half: his insistence that laws are
  obeyed because they are laws and not because they are just, and that someone who
  obeys them for their justice obeys a justice of his own devising; his repeated appeals
  to rivers and mountain ranges as the boundaries of truth and error; his claim that
  custom is the foundation of the authority of law for no other reason than that it
  is custom; and above all the fragment in which he says that we no longer have the
  true — that there was once a true law and it is no longer accessible to us. Pascal
  does not deny that there is such a thing as true justice; he denies that we are
  in a position to identify it.


  4. The upshot, and the real point of the paper: if positive justice is output-directed,
  then reform is not merely dangerous, it is unintelligible from inside the political
  order. The reformer''s complaint must appeal to a standard that is not available;
  if he can state it, he is already appealing to something outside the order of custom,
  and Pascal gives him no such thing except the order of charity, which is not political.
  So Pascal''s conservatism is not a claim about the costs of instability, and it
  cannot be softened by showing that reform is cheap. This is what I mean by saying
  his quietism is not a prudence claim: it is not that civil war is the worst of evils
  and therefore we should keep the existing order — that would be a prudential calculation
  that better facts could overturn — but that the existing order is the only thing
  there is to compare it to.


  5. The obvious objection is that Pascal plainly thinks we can recognize particular
  laws as unjust — otherwise his remark about the river bounding justice would be
  pointless, since it depends on our seeing that the same rule is just here and unjust
  there. I want to say this does not defeat the thesis: recognizing an injustice is
  not the same as having an actionable standard. But I concede the response is thin,
  and I''d like your view on whether the paper survives it.


  Your report should cover, in this order:

  1. Interpretive accuracy. Go through my claims in section 3 one at a time and tell
  me which are fair, which are overstated, and which are simply wrong. If you think
  I have run together two distinct Pascalian ideas, say which.

  2. The argument. Where exactly does the inference from those fragments to the target/output
  distinction break down? Is the distinction itself coherent as I''ve stated it, or
  does it collapse?

