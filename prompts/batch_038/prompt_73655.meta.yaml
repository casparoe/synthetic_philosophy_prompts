  participants (Hobsbawm''s "custom," which is adaptable and serves practical ends)
  to serving an audience or an identity claim? Custom changes; invented tradition
  is characterized by invariance and ritual repetition. So paradoxically, a practice
  that is rigidly fixed and performed identically each year is *more* likely to be
  a recent invention than one that has drifted — that''s a genuinely counterintuitive
  test worth including.

