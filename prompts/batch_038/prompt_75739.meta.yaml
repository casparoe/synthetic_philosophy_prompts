  Key conceptual material:

  - Parfit''s distinction in "Equality or Priority?" (1997) / "Equality and Priority"
  (Ratio 1997). Telic egalitarianism is relational (comparative): it matters how people
  fare relative to each other. Prioritarianism is non-relational: the moral value
  of a benefit to a person is greater the worse off that person is, independent of
  anyone else.

  - Leveling-down objection: if equality is intrinsically valuable, then moving from
  a world where some are better off and some worse off, to a world where everyone
  is equally at the lower level, is in one respect better — even though no one is
  benefited. Parfit''s famous line about the leveling-down objection: "the claim that
  equality is worse is in one way better... Leveling down may be bad for some, and
  good for none." Actually the famous phrasing: Parfit says egalitarians must admit
  that in one respect the leveled-down world is better, "even though it is better
  for no one." I should avoid quoting from memory. If I want a quote, I''d need to
  fetch. Better: paraphrase, no quotation marks.

  - The "in one respect better" move vs. all-things-considered.

  - Also: prioritarianism avoids leveling down because it''s absolute, not comparative.
  But prioritarianism has its own objections: the "levelling up" doesn''t apply, but
  it faces the objection that it ignores relations (e.g., it can''t say anything about
  the value of equality per se), and there''s the "priority to the worse off can demand
  huge sacrifices from the better off" / the "absurdity" of giving priority regardless
  of the size of the benefit — actually that''s more about leximin. Also the objection
  that prioritarianism is incoherent when applied to possible people / the "repugnant
  conclusion"-ish issues. Also: prioritarianism is vulnerable to the objection that
  it lacks a rationale — why does marginal value depend on absolute level? Parfit
  says we have the intuition. Also, "priority view vs. sufficientarianism" — sufficientarianism
  says what matters is being above a threshold, not the gradient. And "relational
  egalitarianism" (Anderson, Scheffler) which denies the telic framing.

  - Also the "person-affecting" dimension: leveling down is not better for anyone,
  so person-affecting views reject it.


  Classroom activity design: A game with payoffs, no real money. Ideas:


  Design a token/points game where students are assigned hidden "welfare levels" and
  then choose between allocations. The trick: to make them feel leveling down, the
  facilitator should set up the choices so that students'' verdicts track equality
  rather than priority, and then reveal that they chose the option that made nobody
  better off.


  A neat mechanic: two-stage. Stage 1: participants each get a secret endowment of
  tokens (chips) representing lifetime well-being. Stage 2: they vote on allocations
  for a pair/triple of anonymous "lives" — but crucially they don''t know whether
  the lives are people or merely possible people, and they don''t know their own position
  (veil of ignorance) in some rounds and do know it in others. The comparison between
  veil-of-ignorance choices and identified-position choices reproduces the classic
  point that the veil generates egalitarian/prioritarian-looking choices via risk
  aversion — Harsanyi vs. Rawls. Hmm, that could be a nice injection: the activity
  can distinguish "equality because of uncertainty about your own place" (which is
  prudence, not morality) from "equality as intrinsic value."


  Another neat mechanic to make leveling-down bite: ask each participant to rank a
  set of distributions, then aggregate. Show that a group using "the more equal the
  better" as a tiebreaker will, in some case, prefer a distribution that is worse
  for everyone in it... no, leveling down isn''t worse for everyone — it''s better
  for no one. Right: the leveled-down world is worse for some and better for none.


  Key experiential point: participants should feel that the leveled-down world is
  "in one respect better," and then feel the vertigo of that admission: they''ve just
  said something is better when it''s good for nobody. Then the debrief distinguishes:
