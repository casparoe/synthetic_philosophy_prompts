  persons are sites at which value occurs, and the question "who" is not morally load-bearing;
  the objection says the "who" is where morality lives.

  4. The "distributive" vs "separateness" distinction: some argue the real issue isn''t
  separateness but that benefits to one person cannot compensate harms to another
  because there''s no experience of the sum — nobody feels the net.

