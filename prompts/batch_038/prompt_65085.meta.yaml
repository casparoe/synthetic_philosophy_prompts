  ---


  A visiting metaphysician is giving the closing talk at our graduate workshop, and
  I have been asked to lead the forty-minute discussion afterward. Her position, which
  she labels ontological abstinence, runs as follows. Where a purported entity is
  such that no observation, measurement, or causal transaction could possibly bear
  on whether it exists, the appropriate response is neither belief nor disbelief but
  a third, sui generis attitude of withholding. She insists this is not agnosticism:
  agnosticism treats the question as determinate but unresolved, whereas she holds
  that a traceless posit fails to raise a genuine question in the first place. She
  is an accomplished speaker who has fielded the standard objections many times, so
  I want a discussion that goes past the first reply she is prepared to give.


  Draft a sequence of ten to twelve questions, ordered so that the pressure mounts
  rather than merely accumulating, with a follow-up attached to each and keyed to
  the answer she is most likely to give. The first question should pin down the positive
  content of the third attitude — what one is doing, normatively, when one abstains
  — since everything else depends on it, and the last should ask what would force
  her to abandon the view.


  Between those, the sequence must cover at least the following, each with its follow-up:


  - Whether "no possible trace could bear on X" is a claim about the world or about
  our capacities, and how a negative modal claim of that reach is supposed to be established
  without surveying possibilities we have no independent grip on. Her predictable
  move is to treat accessibility as fixed by the actual laws together with some robustness
  across nearby counterfactual situations; press on what that costs her.


  - The status of the past, of the causally disconnected regions beyond the cosmological
  horizon, and of other people''s experience. She will distinguish direct access from
  access by record or trace; force her to say whether "trace" is a threshold notion
  or a matter of degree, and if a matter of degree, why her third attitude is not
  simply a graded confidence scale under a new name.


  - Whether her criterion is agent-relative or agent-neutral: information permanently
  closed to me but open to others, or to a differently equipped inquirer. If relative,
  she appears to make what exists vary with the inquirer; if neutral, she needs to
  specify which inquirer''s capacities set the standard.


  - Her relation to constructive empiricism, which also withholds belief in unobservables
  while accepting the theory. Ask what remains once the two are distinguished, and
  demand a concrete case in which the abstainer and the constructive empirist would
  conduct inquiry, or license assertion, differently.


  - The holistic objection: if evidential bearing is distributed across a whole theoretical
  package, no single posit is ever traceless in isolation, and the criterion never
  gains a purchase. If she rejects holism here, ask for the atomistic account of evidential
  bearing that her criterion requires.


  - The reflexive objection. The view quantifies over possibilities, counterfactual
  dependence, and evidential relations, and it needs the abstract apparatus of mathematics
  even to be stated — mathematics being the standing example of a domain that is,
  on Benacerraf''s way of putting the difficulty, causally inert yet apparently knowable.
  Does she abstain from numbers? Whichever she answers, there is a cost; make her
  choose.


  - The exemption problem that follows: she will likely say the criterion governs
  first-order claims about what exists and does not apply to the logical and semantic
  machinery in which those claims are framed. Ask what licenses a two-level exemption,
  and why the same license could not be claimed by the metaphysical posits she means
  to rule out.


  Do not include anything of the "what drew you to this question" variety, and do
  not ask her to summarize or defend the view as a whole. Frame each item so that
  it can be read aloud as spoken, and so that an evasive answer is visibly evasive.
  I do not want citations, references, or suggested readings anywhere in the output
  — the questions have to stand on their own content.


