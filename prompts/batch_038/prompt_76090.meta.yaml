  a competent basketball move and could not. He coaches a team by radio with real-time
  instruction ("switch, deny the wing, drop the weak-side corner") and the team wins.
  Also, he can control a humanoid practice robot via BCI, issuing explicit step-by-step
  commands; the robot executes competently. Questions: Does Omar know how to play
  basketball? Does he know how to run a pick-and-roll? Does the robot? And if we say
  the team knows how, whose knowledge is it?


  Case 3 — The Second-Language Swimmer (aspect/way problem): Lena learned to swim
  as a child in a lake, by thrashing-and-glide ("dog paddle plus back float"). At
  30 she takes lessons and acquires a complete and correct propositional account of
  front crawl; she can state every element (catch, high elbow, bilateral breathing,
  six-beat kick) and can pass any test on it. On the pool deck she can also mime it.
  But in water her body reverts: she cannot execute front crawl at all, despite effort,
  despite understanding the propositions, and despite being able to correct another
  swimmer''s crawl by watching. She can only swim in her childhood way. Question:
  does Lena know how to swim the front crawl? Does she know how to swim (unqualified)?
  Is the answer sensitive to which "way" of swimming the attribution picks out, and
  does the intellectualist''s appeal to practical modes of presentation do any work
  here, or is it just a label for the fact that her body won''t comply?


  Case 4 — The Cookbook Machine: An industrial cooking system (call it MISE) has every
  proposition in every cookbook and food-science text in a symbolic store, and also
  a full physics/chemistry simulator. It reliably produces excellent dishes, including
  under ingredient substitutions it has never encountered, by re-deriving from first
  principles ("no buttermilk → acid + milk, adjust for protein content"). It passes
