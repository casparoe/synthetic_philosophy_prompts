  and is that condition motivated by anything other than a preference for carbon?


  Case 5 — The Blocked Locksmith: Yuen is a master locksmith with 30 years of experience
  and complete, current propositional knowledge of the mechanisms she works with.
  She moves to a town where, by ordinance and manufacturer lock-in, every lock is
  a design she has never encountered and cannot open with the tools legally available;
