  Paragraph 1: framing.


  "I am a fourth-year doctoral student in philosophy of medicine, writing a dissertation
  on how determinations of death are justified in the transplant context. As part
  of my fieldwork I sit in on the weekly case conference of a university hospital''s
  organ donation committee, and last Thursday a debrief turned into a sustained argument
  between two of its senior members: an intensive care consultant with twenty years
  of experience writing off neurological determinations (call him H.) and a visiting
  philosopher of biology who works on organismality and biological individuality (call
  her V.). The case that triggered it was a woman in her late twenties, sixteen weeks
  pregnant, who had met whole-brain criteria after a catastrophic hemorrhage; the
  family and the team had decided to continue somatic support in the hope of reaching
  viability, and the committee was discussing how the chart should describe her status.
  I took detailed notes and reconstructed the exchange below. Neither of them is a
  straw man; I have kept both arguments at their strongest, and I have deliberately
  suppressed my own view so that you can judge the moves rather than me."


  Paragraph 2: the moves (1)–(6).


  Paragraph 3: the ask.


  Let me write the moves carefully.


  (1) H. opened by conceding more than the committee expected: he said the neurological
  criterion is not a discovery about organisms but a legal and pragmatic settlement.
  The bedside tests establish the irreversible loss of two capacities — consciousness
  and spontaneous breathing — and we call that death because doing so serves families,
  patients, and the supply of organs. He then listed what such bodies demonstrably
  continue to do under support: they heal surgical wounds, mount febrile and inflammatory
  responses to infection, maintain blood pressure and temperature with pharmacological
  help, regulate water balance under hormone replacement, retain spinal reflexes,
  and — as this very case showed — they have sustained pregnancies for months and
  delivered live infants. His conclusion: if death is the irreversible loss of the
  integrated functioning of the organism as a whole, these bodies are not dead, and
  the honest thing is to say we have chosen a definition rather than found a fact.


  (2) V. replied that this is exactly the wrong description of what''s happening at
  the bedside. The residual functions are real but they are locally integrated, not
  organismally integrated: a healing wound is a tissue-level process that any perfused
  tissue performs; the coordination among the systems is being supplied from outside,
  by the ventilator, the pressors, the hormone infusions. What makes an organism one
  thing is that its parts are organized by the whole rather than merely coordinated
  with one another by external means — and brainstem destruction removes precisely
  that source of organization. On her account, a heart that beats in a chest whose
  gas exchange is being performed by a machine is no more evidence of a living organism
  than a heart beating on a perfusion rig is.


  (3) H.: then you have no principled way to stop. Dialysis substitutes for the kidneys;
  a pacemaker substitutes for the sinoatrial node; insulin substitutes for the islet
  cells; ECMO substitutes for heart and lungs; vasopressors substitute for vascular
  tone. If substituted function disqualifies integration, a great many patients in
  my unit are candidates for not being alive; if it doesn''t, the ventilator is not
  special. And the deeper problem is that "irreversible" is not a property of the
  body at all — it''s a property of the body indexed to an epoch and to whether anyone
  bothers to try. This woman would not have survived a decade ago; in three decades,
  some technique we can''t presently describe might restore what we are now calling
  irreversibly lost. So irreversibility is a relational fact about medicine, and death
  becomes something that can change its truth value over time for the same body, which
  is not how a biological kind behaves.


  (4) V.: index it if you must, but that''s not a concession, it''s the content of
  the concept. "Irreversible" has always meant irreversible given available means
  and reasonable attempts; the alternative makes whether a person is dead depend on
  whether a bystander happens to know CPR, which is absurd. Your future-technology
  objection proves too much, since on that reading no one is ever dead — any body
  could be reconstituted by sufficiently advanced means — so it cannot be an objection
  to my view specifically. As for the slippery slope: the pacemaker and the dialysis
  machine substitute for subsystems, and subsystems can fail without the whole failing;
  the ventilator substitutes for the capacity on which the coordination of all the
  other subsystems depends. Losing the brainstem is not losing one organ, it''s losing
  the organ that holds the rest in relation to one another.


  (5) H.: that last sentence assumes what''s at issue. "Holds the rest in relation
  to one another" is only true of the brain if you have already decided that an organism
  is a hierarchical system with a master; and the patients we are calling dead are
  the counterexamples. This woman''s body is digesting, excreting, thermoregulating,
  immunologically responding, and gestating — arguably the most integrative thing
  a mammalian body does. Meanwhile your criterion says that a patient in permanent
  vegetative state, who has no consciousness and no prospect of it and who contributes
  nothing to any of the interests the concept of death exists to protect, is unambiguously
  alive; and it says an anencephalic infant who breathes spontaneously and grows is
  alive while a hormonally managed brain-dead body carrying a pregnancy is dead. So
  the criterion tracks neither consciousness nor integration, and you have not yet
  said what it tracks.


  (6) V.''s final move was to make the stakes explicit: this is not a verbal dispute,
  because it settles whether procurement kills. If H. is right that these bodies are
  alive organisms, then either the dead-donor rule collapses or we must abandon neurological
  determination altogether, move to circulatory determination, and change the law
  about consent. So she pressed him with a dilemma: either he admits that we are,
  with consent, causing the deaths of living human beings for their organs — which
  no legislature will authorize and which he himself would not sign — or he concedes
  that the criterion is tracking something real. H. answered that the dilemma is false.
  There is a third position: keep the neurological criterion, keep the dead-donor
  rule, and stop claiming that the criterion reports a fact about organisms. Call
  death a legal status, defined by the law for the law''s own purposes, and defend
  it by the observation that the interests the law protects — bodily integrity, the
  interest in not being killed, the interest in the continuation of a life — have
  no bearer here, because nothing that could be harmed remains. That is where the
  meeting broke up.


