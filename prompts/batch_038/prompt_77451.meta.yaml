  Idea: Domain = the definition of death. Two people: a transplant coordinator / neurologist
  and a philosopher of biology. Disagreement over whether whole-brain death is really
  the death of the organism, with moves like:

  1. One says the criterion is wrong because a brain-dead body still does integrative
  work — gestation, wound healing, fighting infection, homeostasis — so the organism
  as a whole is still alive; death is the irreversible loss of the organism''s integrated
  functioning, and integration is not exclusively neural.

  2. The other says "integration" is being used equivocally: mechanical/physiological
  coordination maintained by technology isn''t the organism''s own self-organization;
  the respirator is doing the integrating.

  3. Reply: but then we''d have to say that a patient on dialysis, or with a pacemaker,
  or on insulin, is not integrated either; you can''t draw a principled line at how
  much function is outsourced.

  4. Counter: the difference is that the ventilator substitutes for a capacity that
  is the organizing principle of the rest — a "master function." But that begs the
  question of why the brain is the master, since integration is distributed (enteric
  nervous system, endocrine system, immune system).

  5. Then a move about the concept of death being partly stipulative/pragmatic — a
  decision about where to stop treatment, not a discovery. One says that means the
  debate is merely verbal; the other says a stipulation can still be answerable to
  facts about what kind of entity survives.

  6. And maybe a move about irreversibility being conditional on technology and willingness
  to attempt resuscitation (the "irreversibility is not an intrinsic property" point
  — it depends on whether anyone tries).


