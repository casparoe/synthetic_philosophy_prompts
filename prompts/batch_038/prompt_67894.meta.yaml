  Setup: A philosophy professor (epistemology / history of philosophy, maybe teaches
  a seminar on historical knowledge). They''ve been thinking about the revisionism/denialism
  line. They have a thesis: the standard criteria fail. Let me articulate the landscape
  of candidate criteria:


  1. Consensus/conclusion criterion: a claim is denialist if it contradicts an established
  historical consensus. Problem: revisionism by definition contradicts consensus too;
  this makes the category question-begging and can''t distinguish, e.g., the (once-heretical)
  revision of the "clean Wehrmacht" myth or the debate about the functionalist/intentionalist
  question, or Arno Mayer''s controversial book, or the debate about the exact numbers
  at Nanjing (which ranges widely but stays inside legitimate historiography). Also,
  at the margins, some denialists disguise their conclusions.


  2. Methodological criterion: denialists don''t do real history — they cherry-pick,
  ignore contrary evidence, don''t engage primary sources, no peer review. Problem:
  (a) it''s a spectrum, plenty of legit historians cherry-pick; (b) sophisticated
  denialism mimics method very well — footnotes, archival claims, "expert reports"
  (e.g., the Leuchter report presented as forensic evidence; the "Institute for Historical
  Review" journal format; pseudonymous technical arguments about Zyklon B and ventilation,
  or about the Armenian deportations being wartime security measures with casualty
  figures inflated; or the Nanjing "fabricated photograph" claims). Method mimicry
  means the criterion can''t be applied ex ante, and applying it ex post requires
  you to already know the conclusion.


  3. Motive criterion: denialists are motivated by ideology/antisemitism/nationalism.
  Problem: motives are inaccessible, and legit historians have motives too; also a
  person could be wrong for ideological reasons without being a denier, and a person
  could be a denier out of genuine (if pathological) contrarian conviction.


  The professor''s injected thesis (the niche idea): The distinguishing feature is
  not content, method, or motive but the *functional role* the claim plays in the
  person''s cognitive economy — specifically, what I''d call "load-bearing immunity":
  the claim is one the arguer cannot give up without the rest of their self-understanding
  collapsing, and this is detectable not from the claim itself but from the *pattern
  of their responses to counter-evidence* — specifically, an asymmetry: the standards
  of scrutiny applied to evidence for the claim vs. against it are systematically
  inverted, and each refutation is met not by revision but by a new, independent auxiliary
  hypothesis (ad hoc proliferation). So denialism is identified by a *counterfactual
  dispositional* property: no possible piece of evidence would lead them to revise.
  It''s an epistemic vice (a closed doxastic system) rather than a research program.


