  REU theory (Lara Buchak, *Risks and Reasons*, 2013): REU(A) = Σ over outcomes, weighting
  by a risk function r applied to cumulative probabilities. Formally, for an act with
  outcomes ordered from worst to best x1 ≤ ... ≤ xn with probabilities p1...pn, REU
  = u(x1) + Σ_{i≥2} [r(Σ_{j≥i} p_j)] [u(x_i) − u(x_{i−1})]. So the marginal utility
  gain of a better outcome is weighted by the risk function applied to the probability
  of getting at least that outcome. With a convex r, you''re risk-seeking; concave
  r (e.g., r(p) = p²) is risk-averse. Key features:

  - Risk aversion is separate from utility curvature; you can be risk averse with
  linear utility.

  - It is rank-dependent (like Quiggin''s RDEU / Yaari''s dual utility), but interpreted
  as risk attitude rather than probability distortion.

  - It violates branch independence / the sure-thing principle: it''s sensitive to
  how the gamble is decomposed, so you evaluate acts globally, not state-by-state.
  Hence REU agents can be diachronically inconsistent and vulnerable to money pumps
  / Dutch books in sequential choice (unless they plan ahead — Buchak''s "sophistication"
  response; also the "planning" response from Chrisoula? Actually the dynamic-choice
  literature: "planning ahead" and "sophisticated choice" (Hammond, McClennen)).

  - Explains the Allais paradox (common consequence effect) and the long-run/"why
  take the risk" intuitions.

  - Objections: it''s not representable as maximizing expected utility of anything
  (it''s non-additive in states); the objection that risk aversion should be about
  total wealth / narrow vs broad framing (Rabin''s calibration theorem is about concave
  utility and small-stakes risk aversion); the objection from "risk aversion is only
  rational if you can''t repeat"? Also the objection that REU conflicts with the "diachronic"
  requirements and that agents should be able to avoid exploitation. Also the challenge
