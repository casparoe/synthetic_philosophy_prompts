  owed to, because obligation runs between beings who can obligate each other, and
  the whole thing rests on a spillover argument about how being cruel to animals hardens
  you toward humans. On that reading the view is at least coherent, but it can''t
  survive contact with a case where an animal is wronged without anyone''s character
  being damaged — so camp A wants to keep the machinery (humanity as an end in itself,
  the kingdom of ends) and rebuild the criterion, Korsgaard-style, so that having
  a good of your own rather than being rational is what gets you in. Camp B says the
  indirect reading is a caricature: they point at the passages where Kant says you
  can''t just get rid of an animal that''s served you for years once it can''t work
  anymore, and at the way he lets analogies with duties to persons do real work, and
  argue that Kant''s texts already leave room for something like direct standing,
  so the fix is internal.


  Nobody''s budging and I''ve started to think they''re not even arguing about the
  same thing. My hypothesis: camp A is doing reconstruction and camp B is doing exegesis,
  and each side''s evidence is exactly the kind the other side doesn''t count — A
  says "so what, Kant was wrong", B says "you''re not reading him". Underneath that
  I suspect there''s a second split about which Kantian claim is actually load-bearing:
  the reciprocity condition (only a being that can be obligated can be a party to
  duty) versus the humanity formula''s talk about ends in themselves. Those two come
  apart, and I think people are sliding between them.


  Also there''s this related thing I keep wanting to raise but can''t get a grip on:
  both camps talk as if the question were a binary status question — does the animal
  have standing or not. But when you look at what actually gets argued, e.g. whether
  a Kantian can object to eating meat from an animal that never suffered, or whether
  a shelter can put down a healthy unadoptable dog, the disagreement seems to be about
  who is allowed to bring the animal''s good into deliberation and in what capacity
  — a question about representation and authorization rather than status. Would reframing
  it that way actually break the deadlock, or does it just move the same fight to
  a new vocabulary?


