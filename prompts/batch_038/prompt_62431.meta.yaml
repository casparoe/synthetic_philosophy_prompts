  So my partner and I got married last spring, and for some reason that sent me down
  a rabbit hole reading arguments about what marriage actually is, including the ones
  from before it was legal here. Ten years of this stuff and here''s what I can''t
  get over: the legal question got settled, and the argument didn''t stop at all.
  It just moved.


  Roughly, as I understand it, there''s two camps. Camp A says marriage is a specific
  kind of thing with its own built-in shape — a permanent, exclusive, comprehensive
  union of a man and a woman, ordered toward having and raising kids, where the norms
  of fidelity and permanence aren''t just tastes but part of what the institution
  is. On that view the state doesn''t invent marriage, it recognizes it, and can recognize
  it badly. People who argue this way call it the conjugal view and call the other
  side revisionist, which already tells you something. Camp B says marriage is a human
  institution whose content has always been set by what societies use it for — a publicly
  recognized commitment between two consenting adults, whose point is the mutual care
  and stability it creates, and whose definition can and should change as our reasons
  for having it change. On that view there''s no deep fact about what marriage is
  underneath what we''ve collectively decided to do with it.


  Both sides know all the arguments. Nobody moves. My hypothesis, offered as a hypothesis
  and probably half-baked: they aren''t arguing about the same object. Camp A is treating
  marriage like something with a function it can have or fail to have — like a heart,
  or like a protocol spec written by someone — and Camp B is treating it like a name
  we bind to whatever arrangement we choose, like a typedef. If that''s right then
  the whole fight is downstream of an argument nobody''s actually having, about whether
  things like money, marriage, and property have purposes independent of our intentions,
  and everything else is noise.


