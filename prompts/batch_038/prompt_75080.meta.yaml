  \ — the asker's supervisor might be a process-ontologist. Hmm, careful about niche-ness;\
  \ Pradeu and Dupré are known enough.\n\nThe supervisor's earlier verdicts — I need\
  \ to construct them so that multiple rules fit. Let's write them as a list (in prose,\
