  \ mutation-driven divergence among ramets. Actually here's a nice one: a long-lived\
  \ clonal plant (seagrass) meadow in which different ramets have accumulated distinct\
  \ somatic mutations, some of which are transmitted to flowers/seeds (because plants\
  \ lack a segregated germ line), and in which the meadow shares a rhizome network\
  \ transferring resources, and where there's evidence of within-meadow competition\
  \ for light/space among genets... \n\nHmm, complexity is good but we need a specifiable\
  \ case where candidate rules diverge. Let me settle:\n\nNew case: A single genet\
  \ of a clonal seagrass spanning several hectares, whose ramets are physiologically\
  \ integrated (resource sharing through rhizomes), which reproduces both clonally\
  \ (no bottleneck: new ramets grow from multi-cellular meristems) and sexually (via\
