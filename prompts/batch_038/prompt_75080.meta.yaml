  \ sharing (a low-performing ramet is subsidised and can later flower). Also: a competing,\
  \ distinct genet is invading at the meadow edge.\n\nWhich rules diverge?\n- Godfrey-Smith's\
  \ bottleneck criterion: clonal ramet production has no bottleneck → the genet is\
  \ not a Darwinian individual (it's a \"collective\"/\"simple group\"); but the sexual\
  \ seed stage does have a bottleneck, so there is a *life-cycle-dependent* answer.\
  \ Nice tension: the entity is a Darwinian individual at one stage and not at another.\
  \ Godfrey-Smith actually has this idea (Darwinian individuals come in degrees; life-cycle\
  \ structure matters; the bottleneck criterion).\n- Queller's two-axis: relatedness\
  \ among ramets ~1 (clonal) and cooperation high (resource sharing) → strongly an\
  \ individual; but within-genet somatic mutation reduces relatedness slightly, and\
  \ Cheaters (a mutant ramet that takes resources without contributing) would reduce\
  \ cooperation. Queller: still an individual.\n- Michod: no germ-soma differentiation,\
  \ no export of fitness → not a new higher-level individual; fitness remains at the\
  \ ramet/cell level.\n- Okasha MLS1 vs MLS2: is the meadow a fitness-bearing entity\
  \ in the MLS2 sense? There's a \"group-level character\" (meadow-level traits like\
