reasoning_summary: "Let me pick a domain and type. Domain: \"Echo chambers and epistemic\
  \ bubbles\" — interesting. Or \"Updateless decision theory\". Or \"The units of\
  \ selection debate\". Let me think about which combines best with the types.\n\n\
  Type 3: \"Predict or recommend a verdict on a new case from someone's verdicts on\
  \ earlier cases\" — this is a great fit for echo chambers and epistemic bubbles?\
  \ Hmm, or for units of selection: a philosopher/biologist's verdicts on which entities\
  \ count as units of selection across cases (gene-level in meiotic drive, individual\
  \ selection, eusocial colony, biofilm, multicellular lineage, symbiotic consortium...)\
  \ and then a new case. That's nice and \"in the weeds\".\n\nActually the units of\
  \ selection one is quite good: verdicts on cases like: Segregating distorter alleles\
  \ in mice (t-haplotype) → gene-level selection; eusocial insect colony → colony\
  \ as unit; a species selection case (Vrba's effect vs. species selection); biofilms;\
  \ a lineage of organisms with high-fidelity somatic mutation; cancer within a body;\
  \ horizontal gene transfer in bacteria; mutualistic endosymbiosis (mitochondria);\
  \ a lab-evolved yeast snowflake multicellularity experiment (Ratcliff). The new\
  \ case: a consortium of microbes that exchanges plasmids, or a case of \"Darwinian\
  \ individuality\" tests failing — e.g., an organism whose germ line is not segregated\
  \ (plants), or a holobiont (coral + zooxanthellae + microbiome) with mixed vertical/horizontal\
  \ transmission.\n\nThe candidate rules: Godfrey-Smith's reproduction/bottleneck\
  \ criterion (Darwinian individuals require a reproductive bottleneck and heritable\
  \ variation in fitness), Hull's replicator/interactor distinction, Queller's relatedness/collaboration\
  \ two-axis model (alignment of fitness via relatedness and cooperation), Michod's\
  \ export of fitness / germ-soma differentiation, Okasha's MLS1 vs MLS2 distinction\
  \ and the notion of \"individual-level\" versus \"group-level\" character. These\
  \ are real and memorized by models reasonably well (Okasha's *Evolution and the\
  \ Levels of Selection*, Queller 1997 \"Cooperation since clarity\", Godfrey-Smith's\
  \ *Darwinian Individuals and the Soul of the Flock* and \"Reproduction, symbiosis,\
  \ and the eukaryotic organelles\", Michod's work, Hull's replicators/interactors,\
  \ Vrba's effect, Buss's *The Evolution of Individuality*, Clarke's \"multilevel\
  \ selection\" and \"The organism in evolutionary theory\"). Good.\n\nThe risk: the\
  \ prompt must not require citations. But type-3 prompts naturally ask \"which theory\
  \ she is implicitly running\". That's fine — no bibliography needed.\n\nAlternatively,\
  \ Type 1 (prioritization/agenda) with echo chambers — e.g., a funder or a trust\
  \ & safety team. Hmm. But type 3 with units of selection seems rich and less regurgitable.\n\
  \nLet me consider: the instruction says \"write from the perspective of someone\
  \ for whom the topic has recently become personally relevant\" and \"relatively\
  \ formal/polished\". Also elaborate, 1–3 paragraphs. Also forbid formatting. Also\
  \ include prompt-engineering text (role assignment, \"think carefully\", \"start\
  \ with some brainstorming\").\n\nWho is the person whose verdicts we track? Options:\
  \ the asker's PhD supervisor, a reading-group convener, a journal editor... Let's\
  \ make it: the asker has recently joined a working group / is a new postdoc, and\
  \ there's a senior colleague (a \"philosopher of biology\" who chairs a cross-disciplinary\
  \ committee deciding something concrete). Actually for type 3, the \"recommendation\"\
  \ version works well with a body that has to decide: e.g., a committee deciding\
  \ whether a project counts as studying \"individuality\" for an interdisciplinary\
  \ centre, or... hmm, a bit contrived.\n\nBetter: make the person a real decision-maker\
  \ whose verdicts matter. E.g., the asker is a new member of an interdisciplinary\
  \ grant panel? Or: the asker recently became the curator/PI of something and has\
  \ a collaborator with strong views.\n\nLet me try: The asker is a PhD student who\
  \ has joined a new supervisor's lab group; the supervisor is a philosopher of biology\
  \ with a distinctive track record on \"what counts as a Darwinian individual / unit\
  \ of selection\". They need to predict her verdict on a case arising from their\
  \ own project — the project involves a recently described system. Make the new case\
  \ concrete and specified: e.g., a lab-evolved yeast strain that forms multicellular\
  \ \"snowflake\" clusters, where fragmentation is caused by a single-cell bottleneck\
  \ event (apoptotic cell death of one cell at the branching point), plus... hmm,\
  \ that's Ratcliff/Rainey's work; the bottleneck makes it clearly a Darwinian individual\
  \ by Godfrey-Smith's criterion.\n\nTo make rules diverge, pick a case where criteria\
  \ conflict:\n- Queller's relatedness + cooperation axes: high relatedness, high\
  \ cooperation → individual.\n- Godfrey-Smith: requires a reproductive bottleneck\
  \ (single-cell bottleneck) and heritable variation in fitness.\n- Michod: requires\
  \ export of fitness / division of labour between germ and soma.\n- Hull: requires\
  \ being an interactor with replicators.\n- Okasha's MLS2: requires the group to\
  \ be a fitness-bearing entity in its own right with group-level heredity.\n\nA case\
  \ where they diverge: a holobiont (e.g., a sponge with a largely vertically transmitted\
  \ but partly environmentally acquired microbiome, no bottleneck) — relatedness high-ish\
  \ due to vertical transmission (Queller might say individual), but no germ-soma\
  \ division of labour (Michod says no), no bottleneck (Godfrey-Smith says not a Darwinian\
  \ individual but maybe a \"collective\"), MLS structure unclear.\n\nOr a case of\
  \ *within-body* cancer selection: somatic cell lineages in a long-lived tree — Godfrey-Smith\
  \ would say plants fail individuality because no early germ-soma segregation; a\
  \ modular organism like a clonal seagrass (Posidonia oceanica meadow, one genotype\
  \ over km) — is the meadow an individual? Divergence: Queller's axes (clonal → maximal\
  \ relatedness, cooperation high) says individual; Godfrey-Smith says not a Darwinian\
  \ individual (no bottleneck, no heritable variation in fitness at that level...\
  \ actually there is variation among ramets); Hull would say the interactor is the\
  \ ramet or the genet?\n\nHmm, maybe make the new case more novel and specified:\
  \ something the asker is actually studying. Since the asker should have personal\
  \ relevance: e.g., \"I have just started a postdoc in a marine microbiology group\
  \ working on a seagrass meadow / a coral holobiont / a clonal aspen stand\".\n\n\
  Let me design a rich, novel case:\n\nThe asker is a new postdoc (or a first-year\
