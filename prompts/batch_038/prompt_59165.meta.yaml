  are near-copies of me in reasoning — same algorithms, roughly same situation — some
  biological, some simulated, most of whom I can never affect.

  (3) My choice among the options before me is strong evidence about what they choose,
  since we run nearly the same decision procedure on nearly the same input.

  (4) So if I cooperate rather than defect in the one-shot dilemma before me, the
  probability that all of them cooperate goes up enormously, and each of their cooperations
  yields, say, ten units of good for someone I care about.

  (5) Since conditional probability is all that matters for the value of an act, my
  cooperating is worth trillions of units, whereas my defecting is worth (minus) trillions.

  (6) The same is true of any act: for any act A, there are near-copy agents facing
  the choice whether to do A, and my doing A is evidence about them.

  (7) So the value of my doing A is always dominated by the aggregate over copies,
  and my own payoffs — the causal ones — are noise.

  (8) Therefore, whenever copies of me would gain more from skipping a dentist appointment
