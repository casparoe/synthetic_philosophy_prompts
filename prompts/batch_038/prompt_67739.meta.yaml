  ---


  I retired six years ago after thirty-five years in experimental physics, and I have
  been reading philosophy of science with more time than I ever had before. Our reading
  group has just finished a stretch on the epistemology of disagreement — the conciliationist
  line, on which learning that an epistemic peer disagrees should move me substantially
  toward their view, and the steadfast line, on which I may rationally hold my ground
  because my own reasons for thinking I assessed the evidence well are not neutralized
  by the mere fact of disagreement — and I want to test both against an episode from
  my own side of the fence rather than against thought experiments about restaurants
  and horse races.


  Take Alfred Wegener and continental drift. The facts, so that you need not supply
  them: Wegener was trained in astronomy and made his career in meteorology and polar
  research; he put the drift hypothesis forward in a lecture in Frankfurt in January
  1912 and in book form in 1915, arguing from the fit of the Atlantic coastlines,
  from matching geology and fossil faunas across now-separated continents, and from
  paleoclimatic evidence such as glacial deposits in what are now tropical latitudes.
  The geological establishment''s alternative was permanence: continents and ocean
  basins fixed, with former land bridges, now submerged, to explain shared fossils,
  and a shrinking, cooling Earth to explain mountain belts. In the mid-1920s Wegener
  was invited to defend the hypothesis before a symposium of American petroleum geologists
  in New York, and the assembled response was overwhelmingly hostile; a volume of
  those papers followed a couple of years later. The most damaging objection was not
  geological but physical: Harold Jeffreys argued that the Earth''s outer layers had
  far too much strength for continents to plough through ocean floor, and that the
  forces Wegener could name — tidal drag and a tendency to slip toward the equator
  — fell short of what the motion required by several orders of magnitude. Wegener
  died on the Greenland ice in 1930 with the hypothesis generally rejected. Arthur
  Holmes advanced mantle convection, driven by radioactive heat, as a mechanism from
  the late 1920s onward; paleomagnetic work in the 1950s — including a symposium S.
  K. Runcorn organized in 1956 — gave drift independent support; and by the mid-1960s
  seafloor magnetic anomalies, seafloor spreading and the reconstruction of the continental
  fit at the shelf edge rather than the shoreline had turned it into plate tectonics.
  Please treat my chronology as approximately right but not load-bearing; if you think
  I have a date or a name wrong, flag it briefly and carry on.


  What I want is the analysis, not the history. First, map the episode onto the concepts
  with discipline: who counts as a party to the disagreement, in what respect each
  was or was not an epistemic peer of the others, what each party''s total evidence
  actually was in 1926, and whether the conciliationist''s central assumption — that
  peers share the evidence and differ only in how they weigh it — holds here at all.
  Then tell me what each view prescribes: what Wegener should have done with his confidence
  by the conciliationist''s lights, given that essentially every specialist in the
  relevant data disagreed with him, and what the steadfast view licenses him to keep.
  I am particularly interested in three complications, and I would rather you wrestle
  with them than smooth them over.


  One: peerhood appears to come apart across the questions at issue. Wegener was arguably
  the peer of the geologists on the physical reasoning and their inferior on the stratigraphy;
  Jeffreys was a peer on the physics and a non-participant in the geological evidence.
  Does the conciliationist analysis have anything to say when two people are peers
  on one component of a dispute and non-peers on another, or does the case simply
  fall outside the theory''s scope?


  Two: the near-unanimity of the geological community was not, I suspect, the product
  of many independent assessments. It flowed from a shared framework and a shared
  training, so the errors were correlated. Whether that helps or hurts the conciliationist
  is not obvious to me: correlated error seems to reduce the evidential weight of
  a consensus, but it also means the dissenter cannot tell from the inside whether
  the consensus is correlated or genuinely independent. Say which way this cuts, and
  whether there is any ex ante test a dissenter could apply rather than an ex post
