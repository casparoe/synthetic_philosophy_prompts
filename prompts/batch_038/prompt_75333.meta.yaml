  MIU-system (from Gödel, Escher, Bach): Start with MI. Rules:

  - Rule I: If a string ends in I, you can add U. (xI → xIU)

  - Rule II: If you have Mx, you can add Mxx. (Mx → Mxx) — doubling.

  - Rule III: If III occurs anywhere, replace with U. (III → U)

  - Rule IV: If UU occurs, delete it. (UU → ∅)


  The invariant: the number of I''s is never a multiple of 3. Rule II doubles the
  I-count: if n is not divisible by 3, then 2n is not divisible by 3. Rule III removes
  3 I''s: n → n-3; if n isn''t divisible by 3, n-3 isn''t either. Rules I and IV don''t
  change the I count. Since MI has 1 I, no theorem has a count of I''s divisible by
  3. MU would have 0 I''s, and 0 is divisible by 3. So MU is unprovable. That''s right.


