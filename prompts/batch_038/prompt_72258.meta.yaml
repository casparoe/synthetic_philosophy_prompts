  So my essay''s misrepresentation: claim that Winner''s two categories collapse into
  one, both being about designer intention, and that "inherently political technologies"
  like nuclear weapons are political because their designers intended a command hierarchy.
  That''s wrong — the point of "inherently political" is that the requirement flows
  from the internal workings/scale of the system, regardless of anyone''s intention,
  and is a claim about what political arrangements are compatible/required.


  Second misrepresentation: the conclusion that this establishes strong technological
  determinism and that political choice happens only at the design stage, so post-hoc
  regulation is futile. Winner actually emphasizes that artifacts are the "hardware
  of politics" and that the point of noticing their politics is to broaden democratic
  deliberation over how we build and maintain them — including that many technologies
  are compatible with many political arrangements (he explicitly notes the wide latitude
  of political principles in most technologies, e.g., electricity generation could
  be centralized or decentralized). So the essay''s claim that "artifacts lock in
  politics permanently" overstates a modest thesis. Also Winner distinguishes "require"
  from "strongly compatible with," and the essay could ignore that modal distinction
  (treating "compatible with" as "requires") — that''s a very good subtle error: conflating
  the two sub-categories within inherently political technologies. Winner''s solar
  example: solar energy is *compatible* with decentralized politics, not *required*.
  And nuclear weapons *require* centralized control. So the essay saying "nuclear
  weapons require centralization and solar power requires decentralization" collapses
  the require/permit distinction. That''s precise and well-memorized territory.


