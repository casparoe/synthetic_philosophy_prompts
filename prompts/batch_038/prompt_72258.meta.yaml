  energy technologies such as solar photovoltaics require a different, more participatory
  political order, so the direction of the requirement runs both ways." Then conclude:
  "Politics, then, is front-loaded. ... the only genuinely political moment in the
  life of a technology is its design; everything after that is administration." And
  the policy implication: ex ante design review, and regulation of use is futile.


  §5. Two loose ends: (a) the empirical challenge to the Moses story — some historians
  of technology have questioned whether the clearance was set by exclusionary intent
  or by engineering convention and cost; (b) my own case: a municipal payroll/shift-scheduling
  system.


