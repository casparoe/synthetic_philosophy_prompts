  Draft:


  ---

  Title: "The Politics Is in the Concrete: Winner and the End of Technological Neutrality"


  §1. When engineers describe their work, they almost always describe it as neutral:
  a bridge carries load, a reactor produces heat, an algorithm ranks candidates. Langdon
  Winner''s essay "Do Artifacts Have Politics?" (Daedalus, 1980) is usually introduced
  to students as the classic rebuttal to this self-description, and it is usually
  introduced as a piece of technological determinism. This paper argues that the usual
  introduction gets the conclusion right for the wrong reasons, and that once Winner''s
  argument is reconstructed properly it supports a much stronger claim than its author
  intends: that after the design phase there is no politics of technology left to
  have.


  §2. Winner''s central move is to identify two ways artifacts acquire political properties.
  The first is the case of a specific technical arrangement that settles a contested
  issue in a community. His example is the low overpasses on Robert Moses''s Long
  Island parkways, built to a clearance that kept public buses — and therefore the
  poor and Black New Yorkers who rode them — away from Jones Beach; and the mechanical
  tomato harvester developed in California, whose requirements (uniform, tough-skinned
  fruit harvested all at once) favored large processors and eliminated thousands of
  farm jobs. The second is the case of "inherently political technologies": systems
  whose very operation calls for a distinctive form of political organization, of
  which Winner''s paradigm is the nuclear weapons complex, which cannot be run democratically
  but must be entrusted to a small, hierarchical, secretive command.


  §3. On reflection these two categories are not really two. Both are cases of a political
  decision being made in advance by the people who build the thing, and then hardened
  into matter... [slide]


