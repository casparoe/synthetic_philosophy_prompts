  the cost of defending a lie* (random question selection, binding prior commitments,
  escrowed predictions, forced specificity, replayed consistency checks across sessions)
  rather than around improving judge competence (training, tools, decomposition, chain-of-thought
  monitoring), which I''ll call second-order.


