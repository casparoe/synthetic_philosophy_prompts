  Thesis (three claims):

  1. The standard framing asks whether an unaided human judge can *recognize* the
  truth of a claim beyond her own competence; the right question is whether the protocol
  makes a false claim *more expensive to defend* than a true one. Define the cost
  of defending a claim as the expected number of follow-up commitments a claimant
  must make — and answer consistently — before the claim is exposed or the budget
  runs out.

  2. For true claims about verifiable facts, the commitment tree is shallow and self-consistent;
  for false claims, consistency across a randomly sampled subtree requires progressively
  more coordinated fabrication, so the cost curve is steeper. Hence a judge who is
  only slightly better than chance at evaluating any single statement, but who can
  sample questions at random and check for consistency, can drive the error rate down.
  This is what the complexity-theoretic result behind the original proposal is really
  telling us, and I''ll say it''s not primarily a result about judge competence.

