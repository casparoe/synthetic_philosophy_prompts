  "You''re a philosopher of biology who works on the levels-of-selection debate —
  I''m going to treat you as someone who''s read both the biology and the philosophy
  carefully. I''m a third-year PhD student and I have to hand in a statement of my
  own position for a lab-internal reading group on multilevel selection, so I want
  an audit, not a lecture. Here''s what I currently believe:


  1. Reproduction isn''t built into the concept of selection. What matters is heritable
  variation in persistence-and-proliferation, so differential sorting of entities
  that don''t have a bottlenecked life cycle or a germ line still counts as selection
  — which is why I''m fine calling species-level sorting ''selection.''

  2. The Price equation partition is substantive, not a trivial identity: splitting
  change into a between- and within-component tells you something real about the population.

  3. But the choice of partition is descriptive. Contextual-analysis and neighbour-model
  formulations are intertranslatable, and you can rewrite the same covariance as either
  a group effect or a relatedness effect, so the formalism doesn''t decide whether
  group selection is happening.

  4. There''s still a fact of the matter about the level at which selection acts,
  and it''s a fact about causal process — I want to resist the old line that group
  vs kin selection is just a level of description rather than a level of causation.

  5. MLS1 and MLS2 are different animals. Only MLS2, where groups are themselves reproducers
  with heritable group-level characters, can produce group-level adaptations; trait-group
  structure alone gets you a statistical group effect at most.

  6. When it comes to explaining adaptations I''m basically a gene''s-eye-view person.
  r in Hamilton''s rule should be read as a regression coefficient, and inclusive-fitness
  maximization only goes through under extra conditions like additive gene action.

  7. I also hold that species are individuals in the Ghiselin-Hull sense, and that
  this is what makes them candidates for being units.


