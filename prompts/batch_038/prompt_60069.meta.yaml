  2. I accept the Price equation partition as the right formal framework, and I think
  it''s substantive, not a tautology.

  3. I think Queller''s contextual analysis and neighbor approach are intertranslatable,
  so choosing between them can''t settle whether group selection is happening — the
  choice of partition is a matter of description.

  4. But I also think there''s a fact of the matter about at which level selection
  acts, and I think that fact is about causal process, not bookkeeping (i.e., I reject
  Maynard Smith''s "level of description not level of causation" line).

  5. I''m a gene''s-eye-view sympathizer for explaining adaptation (Dawkins/Grafen),
  but I deny that genes are the only replicators — I think species can be individuals
