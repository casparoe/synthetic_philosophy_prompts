  So the belief set (about 6 items):


  (a) Selection ≠ reproduction: I accept a broad "sorting" conception; a lineage of
  entities that differentially persists and gives rise to new entities of the same
  kind with the relevant character counts as undergoing selection even if there''s
  no bottlenecked life cycle or germ line. So I''m happy to call species-level sorting
  "selection."

  (b) The Price equation partition is substantive: it decomposes real change into
  within- and between-group components, and I reject the claim that it''s a trivial
  identity.

  (c) Queller''s contextual analysis and neighbor approach are formally intertranslatable;
  since both describe the same total selection, the choice between them is descriptive,
  not metaphysical — writing a covariance as a group effect or as a relatedness effect
  doesn''t change what''s happening.

  (d) There is nonetheless a fact of the matter about the level at which selection
  acts, and it''s a fact about causal process, not about bookkeeping. (Reject Maynard
  Smith''s "level of description" line.)

  (e) MLS1 and MLS2 are different: only MLS2, where groups are themselves reproductors
  with heritable group-level characters, yields group-level adaptations. Trait-group
  models give you at most a statistical group effect.

  (f) For explaining adaptations I''m a gene''s-eye-view person; I think inclusive
  fitness reasoning (with r read as a regression coefficient) is the right tool, and
  I think it only strictly maximizes under conditions like additive gene action.

  (g) I think species are individuals in the Ghiselin–Hull sense, and that this makes
  them candidates for being units of selection.


