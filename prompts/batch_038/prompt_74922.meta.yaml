  Title-ish: "The Beast-Machine Test"


  Thesis: Everyone attacks Descartes for saying animals are machines with no minds.
  But the interesting thing is that Descartes doesn''t argue from metaphysics first
  — he argues from a behavioral test, and it''s a test about *flexible language*.
  And once you notice that, you notice the test is one that animals keep passing,
  in a way that Descartes'' own framework should force him to update. Meanwhile the
  older Aristotelian/Thomist picture, with graded souls, absorbs the same evidence
  without breaking.


  Points:

  1. What Descartes actually says: animal bodies are machines arranged so their movements
  follow from the arrangement of organs like a clock''s from its wheels (Discourse,
  Part V). He concedes animals do lots of clever-seeming things — better than we do
  in some cases — and says that''s no evidence of thought, because a clock tells time
  better than we do. That''s the key move: competence is not evidence of understanding.

  2. The load-bearing criterion: in letters he says the only certain sign of thought
  hidden in a body is real language — not parroting words, but arranging signs to
  declare one''s thoughts to others, aptly, in novel situations. And crucially he
  notes humans who can''t hear or speak still invent signs; animals with plenty of
  vocal organs never do. So it''s not an organ deficit, it''s a thought deficit.

  3. My observation as a dog trainer: the test is behavioral and public. It''s not
  a claim about an inner glow. That makes Descartes oddly modern — he''s basically
  running an operational criterion, closer to a behaviorist than to a mystic. And
  an operational criterion is the kind of thing that new data can break.

  4. The twist: parrots and great apes and now AI systems do arrange signs flexibly
  to get novel things. Alex the African grey (I only know the second-hand version)
  asking for things he''d never been trained to name. If Descartes'' criterion is
  the whole basis of the denial, then his framework is *self-undermining*: it predicts
  its own revision. Whereas Aquinas''s hierarchy — vegetative, sensitive, rational
  souls — can slide animals up or down the ladder without the whole system cracking.
  So Descartes made his position *riskier*, and riskier positions are... more scientific?
  But also, and here''s where I''m stuck: maybe that''s a point in his favor, not
  against.

  5. The complication I can''t resolve: Huxley took the machine view and kept consciousness
