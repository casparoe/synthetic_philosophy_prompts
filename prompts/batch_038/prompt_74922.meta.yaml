  Essay:


  "THE BEAST-MACHINE TEST (working title)


  Everybody remembers Descartes as the guy who said animals are machines and therefore
  feel nothing, and mostly remembers it as a monstrous thing to have said. What I
  want to argue is that the interesting part of his position is not the denial, it''s
  the test he uses to get there, and that the test is the reason his position has
  aged worse than the one he was arguing against.


  Start with what he actually does. In the Discourse he says the bodies of animals
  are machines whose movements follow from the arrangement of their organs the way
  the movements of a clock follow from its wheels and weights. He doesn''t deny that
  animals do astonishingly complicated things. He grants it, and then says it proves
