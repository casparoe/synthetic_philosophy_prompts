  Propriety: A scoring rule S is proper if for any probability function P, the expected
  score of reporting Q, computed with P''s probabilities, is minimized (i.e., accuracy
  maximized) when Q = P. Strictly proper: uniquely minimized. For the Brier score
  on a single proposition: expected accuracy of reporting q when your credence is
  c: E = c·(-(1-q)^2) + (1-c)·(-q^2). Maximize over q: derivative: c·2(1-q) - (1-c)·2q
  = 0 → c - cq - q + cq = 0 → c = q. Yes, q = c maximizes. So assigning 1 when c=0.6
  gives expected accuracy 0.6·0 + 0.4·(-1) = -0.4, whereas reporting 0.6 gives 0.6·(-0.16)
  + 0.4·(-0.36) = -0.096 - 0.144 = -0.24, better. So indeed the argument''s key step
  is false under propriety, unless the expectation is computed with different probabilities.


