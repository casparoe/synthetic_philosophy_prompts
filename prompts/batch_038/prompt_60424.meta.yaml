  argument, and that selection effects are things one can and must correct for rather
  than reasons for despair. I want to know whether that instinct is sound or whether
  I am reaching for the one tool I happen to own."


  Then: state the analogy precisely as the asker uses it, with a technical vocabulary
  list:

  - survey/detection limit & selection function

  - Malmquist bias (describe it)

  - ascertainment bias

  - informative missingness / MNAR vs MAR

  - calibration sample / control

  - deconvolution requires knowing the point spread function

  - the Wald bomber point (survivorship)


  Then the three-stage decomposition: (i) production — which events were noticed and
  recorded by anyone at the time; (ii) transmission — which records physically survived
  (institutional accident, climate, war, the mundanity of tax rolls); (iii) attention
  — which surviving records later generations chose to read, edit, and canonise. The
  asker notes that "written by the victors" seems to belong mainly to (iii) but is
  used as if it governed (i) and (ii), and that the three have different selection
  functions and different degrees of correctability.


  Then the questions:

  1. Mapping table.

  2. Which disanalogies are fatal vs. merely awkward — and a criterion for telling
  them apart (e.g., does the disanalogy block the inference the analogy was meant
  to license, or does it merely limit its precision?).

  3. Is the archive''s silence "missing at random" or informatively missing, and can
  a historian ever get the equivalent of a calibration sample? What plays the role
  of the nearby complete sample? (Archaeology? Non-textual sources? Comparative cases?
  Independent traditions?)

  4. Does the analogy license the optimist''s conclusion (bias is correctable in principle,
  therefore the relativist inference fails) or does it, pushed further, license something
  worse than the relativist''s claim — e.g., that some questions are permanently unanswerable
  not because every account is perspectival but because the sample contains no information
  at all about them (a power problem, not a bias problem)? Note the asymmetry: bias
  can be corrected; absence of information cannot. The asker might suspect that the
  real lesson is not "you can''t know" but "you can''t know this particular thing,
  and you can know that you can''t."

  5. The rival slogan-as-analogy: "history is written by the victors" understood not
  statistically but as a claim about the intentionality of the filter — a designed
  instrument vs. a random one. Does an intentional filter make the situation better
  or worse for inference? (Propaganda is predictable in a way that random loss is
  not — you can model a censor; you cannot model decay. But modelling a censor requires
  knowing the censor''s incentives, and the record of those incentives is itself filtered.)
  Also: hostile witnesses, testimony against interest, the criterion of embarrassment,
  inference from what a partisan could not have gained by inventing — the "signal"
  that leaks out of a tendentious source. Ask whether the statistical analogy can
  capture this at all (leakage vs. distortion).

  6. A better analogy if there is one — the asker suggests the fossil record / taphonomy:
  known first and last appearances are systematically inside the true range, sampling
  is patchy in space and time, and yet palaeobiologists make disciplined inferences
  about extinction timing. Ask whether taphonomy is a better source domain than survey
  astronomy, and what it costs.

  7. What survives: give a verdict on what the slogan can support — e.g., that it
  supports a claim about which questions are answerable and about the composition
  of the archive, but not a claim about the truth-aptness or comparability of accounts.
  And ask whether the asker''s own conclusion is being carried by the analogy or by
  something independent.


