  Malmquist bias: in a magnitude-limited survey, intrinsically luminous objects are
  over-represented at large distances, so the average luminosity of the sample is
  biased high. That''s a beautiful analogue: "the archive over-represents the luminous"
  — the great men, the dramatic events, the capital cities. And the correction requires
  knowing the luminosity function, which you don''t have for history (no prior distribution
  of "how many unrecorded events of a given magnitude there were"). Excellent, and
  genuinely in the weeds. Astronomers handle it via the V/Vmax test and by modelling
  the luminosity function self-consistently; historians have no equivalent of a "flux
  limit" that''s known and stable, and no equivalent of a complete nearby sample from
  which to infer the intrinsic distribution. Also: for astronomy, there''s a crucial
  resource — the laws are the same everywhere and the sample is drawn from a population
  you can model as statistically homogeneous; history has no such homogeneity assumption.


