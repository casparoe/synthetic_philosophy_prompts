  Alternative: Dewey''s experimentalism + a work of fiction. Dewey and fiction is
  under-explored, so less regurgitable. Which work? A novel that dramatates social
  inquiry as experiment: e.g., Upton Sinclair''s The Jungle? Or Ibsen''s An Enemy
  of the People — Dr. Stockmann discovers the baths are contaminated; the town suppresses
  him; he declares "the strongest man in the world is he who stands most alone." An
  Enemy of the People is a wonderful vehicle for Deweyan experimentalism: it dramatates
  the relationship between inquiry, public formation, expertise, and democracy. Dewey''s
  The Public and Its Problems: the public must be "eclipsed" and must find itself;
  inquiry''s results must be communicated so that the public can form; the problem
  is not the facts but the machinery of communication. Stockmann has the facts but
  the public doesn''t form — the newspaper, the mayor, the "compact liberal majority"
  suppress it. Also Dewey''s idea that knowledge is not the possession of a few experts
  to be imposed (anti-technocracy) — Stockmann''s error, on a Deweyan reading, is
  precisely to conclude that the majority is always wrong and to retreat into standing
  alone: he abandons the experimentalist faith in public intelligence and becomes
  a kind of epistemic aristocrat. That''s a genuinely interesting, non-obvious reading:
  Dewey would criticize Stockmann''s final position, not his science. And the play''s
  own irony — Ibsen subtitled/knew the play is ambiguous; Stockmann is himself somewhat
  self-righteous and the town''s "people''s bath" is an economic instrument. Also
  there''s the question of whether Ibsen endorses Stockmann.


