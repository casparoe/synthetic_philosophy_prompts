  Design:


  Asker: "I was at our reading group and two people got into it over whether ''sphexishness''
  is a real property or just a rhetorical flourish." Trigger: someone showed a log
  where an agent, told to summarize a webpage, got a 403 error and retried the same
  fetch 30+ times with the same parameters before giving up.


  Round 1 — Dev: That''s exactly sphexishness: the agent has a routine, the world
  changed, it re-runs the routine instead of re-deriving what to do. Same shape as
  the wasp dragging the cricket back to the entrance.


  Round 2 — Sam: No. The wasp''s lesson isn''t repetition, it''s that the routine
  is triggered by a *missing precondition check* — she re-inspects the nest because
  the "prey at entrance" state was destroyed. Your agent isn''t doing that; it''s
  doing the normal thing any retry loop does, and after 30 tries it actually gave
  up and reported the error, which means it did represent the goal and knew it was
  unreachable. Recovery is the opposite of sphexishness. Also: you yourself hit refresh
  a bunch of times when a page won''t load.


  Round 3 — Dev: Then sphexishness is just a matter of how long you persist, which
  makes it a bad concept — it can''t distinguish anything. If every agent that eventually
  recovers is non-sphexish and every agent that doesn''t is just "broken," the term
  isn''t doing work that "failure to adapt" isn''t.


  Round 4 — Sam: It is doing work. The point of the wasp is that you can *exploit*
  her: move the cricket a hundred times, she loses a hundred times. Sphexishness names
  failure modes that are cheap to trigger repeatedly and adversarially. That''s a
  real engineering property, not just "it failed."


  Round 5 — Dev: Fine, but by that test humans are sphexish all over — you can exploit
  a goalkeeper''s habit, a trader''s rule, a pilot''s checklist adherence. And in
  the pilot case the rigidity is a *virtue*. So either the concept condemns behavior
  we want, or exploitability isn''t the criterion either.


  Round 6 — Sam: Maybe — and also, I''d add, the whole wasp story is shakier than
  people assume: there are experiments where the wasp adapts after a number of iterations,
  and re-inspecting a nest that was disturbed while you were away is plausibly just
  caution that pays off, not mindlessness. So the concept is built on a bad example
