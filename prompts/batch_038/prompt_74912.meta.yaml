  is decision-relative and thus varies across issues while jurisdictional borders
  are fixed.

  4. Handling of the "boundary of boundaries": secession, merger, dissolution — the
  theory must apply recursively (who decides whether the unit splits).

  5. Temporal: future people and past commitments; membership over time, not just
  at a moment.

  6. Non-contingency on historical injustice, or a way of handling that borders were
  drawn by conquest — the theory must not simply ratify the status quo (otherwise
  it''s conservative by default), but must also be usable now.

  7. Feasibility/administrability: a franchise rule must be operable, must not require
  impossible information (e.g., measuring degree of affectedness for each person on
  each issue).

  8. Moral equality: must not make some persons permanently subject to rules they
  had no hand in (this is the subjection criterion''s motivation).

  9. Stability/no perverse incentives: the theory shouldn''t let the current demos
  expand or contract itself strategically (gerrymandering the electorate itself —
  e.g., enfranchising or disenfranchising groups to change outcomes). This is a nice
  requirement: "self-modification constraint" — a rule for who votes must not be alterable
  by the votes it authorizes in a way that entrenches the alterer. That''s a genuinely
  good desideratum that''s less standard.

