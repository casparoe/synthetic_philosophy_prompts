  Draft:


  "Michele Gelfand''s tightness–looseness framework characterizes cultures by the
  strength of their social norms and their tolerance of deviance: tight societies
  have strong, widely shared norms and punish violation harshly, loose societies have
  weak norms and wide latitude. The framework is meant to be descriptive and, as far
  as I can tell, evaluatively neutral — Gelfand''s cross-national work reports tightness
  as varying with ecological and historical threat, and presents both tightness and
  looseness as carrying costs and benefits.


  Developmental psychology offers something that looks like the same terrain cut differently:
  Turiel''s distinction between the moral and the conventional domain. On that view,
  harm, fairness, and rights are treated as authority-independent and generalizable,
  while matters of dress, address, and decorum are conventions — real norms, but contingent,
  alterable by authority, and not wrong in themselves. Shweder and Haidt have pressed
  the point that the boundary is culturally variable: in many societies, conventional
  violations are experienced as genuine moral violations, not as breaches of mere
  etiquette.


  Here is the thesis I want tested: tightness is not an independent dimension of cultural
  variation at all, but a redescription of two features of the moral/conventional
  boundary — its location (how much of the conventional domain a society has moralized)
  and its enforcement (how severe the sanction is for crossing it). A tight culture,
  on this reading, is simply one that has annexed a great deal of convention into
  morality and polices it accordingly, and a loose one is a culture that has left
  most convention where Turiel says it belongs.


  Compare the two frameworks and tell me whether that reduction succeeds. ..."


