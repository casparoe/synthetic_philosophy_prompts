  on the details.


  My friend''s position: the whole thing is refuted by counterexample. Infectiousness
  cannot be a criterion of arthood, because plenty of things infect us with feelings
  without being art (a rousing political speech, a panic in a crowd, a lullaby that
  puts a child to sleep), and plenty of acknowledged artworks leave a given spectator
  cold, so on Tolstoy''s own account a work would cease to be art for that spectator;
  and sincerity, clarity, and individuality cannot be criteria either, since they
  are matters of degree that license exactly the verdicts Tolstoy wants in advance.
  The theory, my friend says, is not a definition of art at all but a moral polemic
