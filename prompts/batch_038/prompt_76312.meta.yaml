  I take Tolstoy''s positive account to be a transmission theory: art is a human activity
  in which one person deliberately conveys, by means of external signs, a feeling
  he has himself experienced, so that others are infected by it and experience it
  too — feeling standing to art roughly as thought stands to speech. On top of that
  he adds degrees of infectiousness, governed as I recall by the individuality of
  the feeling conveyed, its clarity, and above all the sincerity of the artist, and
  then a further requirement that the feeling transmitted be one that unites people
  in a way consonant with the religious perception of the age. That last requirement
  is what drives his notorious verdicts: as I remember it he dismisses Shakespeare
  and Beethoven''s Ninth while praising Dickens, Les Misérables, Uncle Tom''s Cabin,
  and his own short moral parables, and he is willing to condemn most of what the
  educated classes of Europe call art, including a good deal of his own earlier fiction.
