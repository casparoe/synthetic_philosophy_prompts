  Williams''s argument begins from the idea that reason claims have explanatory work
  to do. To say that an agent has a reason to φ is to say something that could explain
  his φ-ing, and something for which he can be faulted if he does not φ. The external
  reasons theorist wants to say that such a claim can be true even when the agent
  has no motivation to φ and could acquire none by becoming better informed or more
  rational. Williams thinks this is an unstable combination. A consideration that
  could not enter into any explanation of the agent''s action, and that he could not
  be moved by however thoroughly he deliberated, is not a reason for him at all; so
  the external reason statement is not merely unhelpful but false. In his example,
  the young man from a military family who feels no inclination whatever to take up
  a commission may be blameworthy in the eyes of his family, but that does not show
  that he has a reason they can correctly report.


  The account is made precise by the subjective motivational set, S. S is not a list
  of desires: it includes dispositions of evaluation, patterns of emotional reaction,
  personal loyalties, and the agent''s projects, as well as beliefs and, importantly,
  other things the agent counts as reasons. An internal reason statement says, roughly,
  that the agent would be motivated to φ were he to deliberate soundly from S — allowing
  for correction of false beliefs, vivid imagination of the alternatives, and weighing
  of his motivations against one another. Two consequences follow that are easy to
  miss. First, the account is counterfactual, so Williams is not claiming that an
  agent''s reasons are hostage to his actual desires; a man may have a reason he would
  recognize only after deliberation that he presently resists. Second, since sound
  deliberation permits the criticism of one element of S by appeal to others, Williams
  is not a Humean about reason: reasoning is not confined to finding means to ends
  the passions supply.


  That second consequence is, I think, where the view comes apart, and the objection
  stated in the question is correct. If deliberation may criticize a desire and conclude
  that it merits no weight at all — suppose a woman brought up in a family of soldiers
  deliberates and concludes that she has no reason to accept a commission, although
  every motivation she has, including her loyalty to her family and her dispositions
  of evaluation, points the other way — then what determines the outcome cannot be
  S, since S pointed uniformly elsewhere. Something further must be consulted, a standard
  of correctness that deliberation answers to and that can overrule everything in
  the set. But that is precisely what the external reasons theorist means by an external
  reason. So the distinction between internal and external reasons loses its content
  once critical deliberation is admitted, and Williams''s argument proves too much:
  it rules out the very resources his own account of deliberation requires.


  There is a related moral, which is part of what makes the view attractive. If reasons
  depend on motivation in the way Williams says, then moral judgment depends on it
  too: anyone who sincerely judges that he ought to help is thereby motivated to help.
  Williams is usually read as an internalist in that sense as well, and this is what
  ties his account of reasons to the psychology of actual agents rather than to free-floating
  norms. It also disposes of the charge of relativism: Williams does not deny that
  we criticize an agent''s motivations, only that such criticism ever operates from
  outside them.

