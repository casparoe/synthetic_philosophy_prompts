  "Williams starts from the idea that a reason claim has to be able to do explanatory
  work. If we say that Owen has a reason to do something, that claim is supposed to
  explain why Owen would do it, and it is supposed to be something Owen could be criticized
  for ignoring. The external reasons theorist says a reason claim can be true even
  when the agent has no motivation whatsoever to act on it. Williams thinks this combination
  is unstable: a reason that could not possibly figure in any explanation of action,
  and that the agent could not be moved by however rational and informed she became,
  is not a reason at all. So external reasons statements are false.


  To make this precise Williams introduces the subjective motivational set, S. This
  is not just a list of desires. It includes dispositions of evaluation, patterns
  of emotional response, personal loyalties and projects, and things the agent counts
  as reasons. An internal reasons statement says roughly that the agent would be motivated
  to φ if she deliberated soundly from S — that is, if she took account of the relevant
  facts, corrected false beliefs, imagined the options vividly, and weighed her motivations
  against one another. Two things follow that are often missed. First, the account
  is counterfactual: what fixes an agent''s reasons is not what she actually wants
  but what she would want after good deliberation, so Williams is not saying that
  our reasons are held hostage to our actual desires. Second, because deliberation
  can criticize elements of S by appeal to other elements, the theory is not the Humean
  view that reason is the slave of the passions.


  This second point, though, is where I think Williams''s position comes apart. If
  sound deliberation may criticize a desire and conclude that it should be given no
  weight — as when someone raised in a family of soldiers deliberates and finds that
  she has no reason to join the regiment, though every one of her existing motivations
  pushes her that way — then the deliverances of deliberation are not really determined
  by S at all. Something else is doing the work: a standard of correctness that deliberation
  consults and that can overrule everything in S. But that is just what the external
  reasons theorist means by an external reason. So the collapse objection succeeds:
  once Williams allows critical deliberation, the internal/external distinction loses
  its content, and his argument against external reasons proves too much.


  There is a related moral. If Williams were right that reasons depend on motivation
  in the way he says, then moral judgment would collapse into motivation too: anyone
  who sincerely judges that she ought to help would be moved to help. Williams is
  usually read as a motivational internalist in that sense, and this is part of what
  makes his view attractive — it ties morality to the psychology of real agents rather
  than to free-floating norms. It also explains why the relativism worry is not fatal:
  Williams does not deny that we criticize people''s motivations, only that criticism
  ever gets outside them."


