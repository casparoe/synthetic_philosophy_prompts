  I''m a retired atmospheric physicist — spent most of my career on attribution work,
  i.e. the question of how much of the increased likelihood of a given heatwave or
  flood you can pin on human-caused warming, which in practice means producing a fraction
  and defending it. Since I stopped going into the office I''ve drifted into philosophy,
  and last year I was talked into chairing a small panel at my old learned society.
  We recieve three or four requests a year asking the society to acknowledge some
  wrong in its own past: return human remains and sacred objects aquired on a colonial
  expedition, apologise for the conduct of a wartime lab, rename a building after
  the man who endowed it, that sort of thing. Right now we decide each one by argument
  and gut feel, which is embarrassing in a body that publishes journals about method.


  What I want is a procedure my panel can actually run, on paper, in about ninety
  minutes, with eight of us round the table, half of whom have no philosophy at all
  (a retired headteacher, a solicitor, two postdocs, me). Someone has to be able to
  pick it up cold and work down it. So: the questions in order, what counts as a sufficient
  answer to each, where the run terminates in a no, where it stops being factual and
  hands the decision to a vote because it''s really a question of values, and what
  standard of evidence applies at each stage (the archives are often thin, and the
  people who did the thing are a hundred years dead).


  Ground it in whatever the collective-responsibility literature genuinely offers,
