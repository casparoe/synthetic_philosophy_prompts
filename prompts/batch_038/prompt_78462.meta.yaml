  The thesis is about Kim''s causal exclusion argument, and it is deliberately unfashionable
  in the seminar: I argue that the exclusion argument is sound as an attack on nonreductive
  physicalism, and that the interesting question is what follows. My positive view
  has four steps.


  1. Closure of the physical plus a ban on systematic overdetermination entails that
  a mental property distinct from its physical realizer does no causal work at the
  level at which the physical story is told. I grant this and do not try to block
  it.

  2. The standard conclusion — epiphenomenalism or eliminativism — depends on a premise
  that Kim leaves tacit: that a causal claim is true or false simpliciter, at one
  privileged level.

  3. Against that, I argue that causal relations are level-relative in a metaphysical,
  not merely pragmatic, sense. A mental property M can be a cause relative to a coarse-grained
  set of variables and its realizer P a cause relative to a finer-grained set, and
  both claims are literally true, with no further fact of the matter about which one
  is the causation. What fixes the level is not our explanatory interests but the
  grain at which interventions on the system are possible in principle — I call this
  the interventional grain.

  4. Consequently the mental level never changes what happens at the physical level.
  Nothing in my view requires downward causation, and I take that to be a feature:
  psychology and moral responsibility get everything they need from level-relative
  causation, and physicalism is never threatened.


  I expect three lines of attack, and I want you to develop them and to tell me whether
  I am wrong about which is worst. ...


