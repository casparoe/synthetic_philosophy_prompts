  ---


  I am a philosophy senior, and next Friday I defend my undergraduate thesis in a
  public oral exam: twenty minutes of presentation followed by questions from my three-person
  committee and then an open floor for the rest of the thesis seminar. I need a preparation
  sheet for the question period — not a defense of the thesis, and not a survey of
