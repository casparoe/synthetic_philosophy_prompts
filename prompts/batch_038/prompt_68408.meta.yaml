  I have spent a couple of months reading across the decision-theory literature on
  Newcomb-style problems — causal decision theory, evidential decision theory, and
  the updateless family of views that came out of work on artificial agents — and
  I keep hitting the same wall. I am not looking for a verdict on which theory is
  right. I want a diagnosis of the disagreement itself. Let me first set out the debate
  as I understand it, then give you my hypothesis and the alternatives I have considered,
  then say what I want back.


  The three positions, as I read them:


  1. Causal. What makes an act choiceworthy is the causal upshot it produces, so the
  agent should evaluate acts by what they bring about, holding fixed everything the
  act does not influence. On Newcomb''s problem this yields two-boxing, and the causal
  theorist accepts the resulting poverty: the contents of the boxes were settled before
  the choice, so taking both cannot make you worse off and can only make you better
  off. On the smoking-lesion case — where a genetic condition causes both a disposition
  to smoke and cancer, and smoking itself causes nothing — the causal theorist takes
  this to show that evidential reasoning recommends abstaining for a reason that is
  not a reason at all, since the act would be evidence of your condition rather than
  a cause of your misfortune.


  2. Evidential. What makes an act choiceworthy is how good a sign it is, so the agent
  should evaluate acts by conditionalizing on having performed them. This yields one-boxing,
  and the evidential theorist regards the causal theorist''s appeal to causation as
  unmotivated: it does no work that conditionalization does not already do, and where
  the two come apart, the causal notion has to be supplied from outside decision theory.
  When pressed on the lesion case, the standard reply is a screening-off manoeuvre:
  an agent with introspective access to its own inclinations already knows what it
  is inclined to do, so conditioning on that knowledge removes the correlation the
  lesion exploited.


  3. Updateless. The object of choice is not an act but a policy, and the policy is
  to be evaluated without conditionalizing on the information the agent happens to
  hold at the moment of choice — because in any problem where the state of the world
  was settled by what kind of reasoner the agent is, conditionalizing on your present
  evidence is precisely the step that goes wrong. On this view the two-boxer''s "the
  money was already there" is not false but misdirected: the money is already there
  because of the kind of reasoner you are, and the question you should ask is which
