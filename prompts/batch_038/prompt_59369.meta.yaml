  must cite a difference". The resolution path: the commensurability claim is about
  aggregates/outcomes (living standards, commercialisation), while the explanans is
  about a specific structural feature (relative price of labour vs energy, or the
  existence of a public scientific culture) that could coexist with similar living
  standards. That''s a real fix — but it costs: it makes the difference-making factor
  invisible to the very comparison that established commensurability, which then presses
  against (f) — how do you confirm a factor whose presence doesn''t show up in the
  outcome measures you used to say the cases were alike? Good: tension 1 has a fix
  but it feeds tension 2.


