  So final list, maybe 8 commitments:


  1. Ground: Deterrence, if justified at all, is justified by what it prevents — the
  avoidance of great-power war — and not by any intrinsic right of retribution or
  by honoring commitments.

  2. Mechanism of credibility: A threat deters only if the adversary believes it would
  be executed; and over long horizons and repeated crises, that belief is sustainable
  only if it is true — that is, only if the threatening state really is disposed to
  execute. Announced intentions one does not have are, in this domain, both immoral
  and unstable.

  3. Post-attack assessment: After a first strike has destroyed a state''s cities
  and command structure, executing the threat cannot restore, compensate, or deter
  anything that has already happened; it can only add deaths. Judged as a single act
  at the moment of decision, execution would be wrong.

  4. Resolution the asker offers: The above is not a paradox, because the unit of
  assessment is not the act at the moment but the standing policy adopted earlier.
  Adopting and retaining the retaliatory disposition is what has the good consequences,
  and the fact that executing it later would be pointless does not make the disposition
  irrational. Retaining a disposition whose original reasons have expired is, here,
  precisely what rationality requires — a disposition that unravels when it is needed
  was never worth having.

  5. Risk constraint: It is impermissible to impose grave risk of death on people
  who cannot consent and are not parties to the decision, as a means to one''s own
  security. The asker distinguishes intending harm from merely foreseeing risk and
  takes double effect to handle the difference.

  6. Brinkmanship: What actually restrains an adversary in a crisis is rarely a deterministic
  threat; it is the deliberate creation of a shared and only partly controlled risk
  of catastrophe — the credible possibility that things slip. The asker thinks this
  is the best account of why crises short of war have deterred, and thinks states
  do and should manage risk this way.

  7. Historical assessment: The decades of superpower deterrence produced no direct
