  the caution that asymbolia is rare, lesion usually in insula/retroinsular region
  (Schilder and Stengel 1932 described the syndrome; Berthier, Starkstein, Leiguarda
  1988 study). Also the "paradox of pain asymbolia" for hedonism: if pain feels the
  same but isn''t bad, then badness isn''t in the phenomenology.


