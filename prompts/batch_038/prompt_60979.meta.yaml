  "Pain is normally taken to be the paradigm of something intrinsically bad: bad not
  because of what it leads to but because of what it is like to have it. Pain asymbolia
  is standardly offered as a counterexample to that picture.


  The syndrome was described in patients with lesions of the insula and retroinsular
  region, typically on the left, and it also shows up after cingulotomy and, in a
  weaker form, under high doses of morphine. What is striking about these patients
  is the dissociation. Their sensory capacities are intact: they can tell you where
  the stimulus is, how strong it is, whether it is sharp or burning, and they will
  use the word ''pain'' without hesitation. What is missing is the affective component.
  They do not withdraw, they will let a hand rest on a hot plate, they may smile or
  laugh while being pricked, and they describe the pain as not bothering them, as
  something they know is there but do not mind. Melzack and Wall''s account of pain
  as having separable sensory-discriminative and affective-motivational dimensions
  gives the natural description: asymbolia is what you get when the second dimension
  is knocked out and the first is left standing. [Good]


  From this, the argument against intrinsic badness runs as follows. If the badness
  of pain were a matter of how pain feels — if unpleasantness were just another feature
  of the sensory phenomenology, alongside location and intensity — then it should
  not be possible to have the sensory phenomenology intact and lose only the badness.
  But that is exactly what asymbolia gives us. So unpleasantness must be something
  over and above the felt quality of pain, and since the felt quality is all that
  remains in the asymbolic, what is bad about pain cannot be intrinsic to it. The
  badness must be instrumental: pain is bad because it is a signal of tissue damage,
  and the unpleasantness is only the device that gets us to act on the signal.


  There are two responses available to someone who wants to keep the claim that pain
  is intrinsically bad.


  The first denies that the asymbolic is really feeling pain at all. On this view
  — Grahek defends something like it — the affective dimension is not an optional
  extra bolted onto a sensory core; it is constitutive of pain, so a state that lacks
