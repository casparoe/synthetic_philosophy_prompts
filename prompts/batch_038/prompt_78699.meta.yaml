  Let me be precise about revenge sentences in dialetheism. The standard revenge:
  the dialetheist says the Liar λ ("λ is not true") is both true and false. Revenge:
  μ = "μ is not true and not false" (or "μ is true only," "μ is not both true and
  false," "μ is false only"). If μ is both true and false, then "μ is not both true
  and false" is false — but μ says it, so μ is not true; yet μ is also false, so μ''s
  conjunct "not false" is false. Standard analysis: μ = "μ is not true and μ is not
  false"? Let''s take the classic: μ: "μ is false and not true" — under dialetheism
  where false = not true (transparent), that''s just the Liar. So we need a stronger
  negation, "exclusion negation" (¬), which is the classical negation defined so that
  ¬P is true iff P is not true. Priest argues the dialetheist cannot have exclusion
  negation with full transparency — that''s the "revenge" problem: the dialetheist''s
  language can contain no fully expressive classical negation. Priest''s response:
  exclusion negation can''t be coherently added to a semantically closed language,
  and that''s fine; the loss is not special to dialetheism — the classical theorist
  with a Tarskian hierarchy also cannot express "true in this language" within the
  language. So revenge cuts both ways: expressiveness limits are inevitable. That''s
  a real, strong response.


