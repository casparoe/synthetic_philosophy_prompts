  the sense of exclusion, because in LP, "¬P" is true iff P is false, and for a glut
  both P and ¬P are true. So adding exclusion negation to LP breaks the transparency
  of the truth predicate — you''d get triviality. Priest''s point: this is a limit
  on expressibility, but the classical theorist''s hierarchy has limits too, and the
  dialetheist''s limits are no worse.


