  Title: §3. Two Heterogeneity Problems


  Paragraph 1: State the objection. Hedonism about well-being says that the only thing
  that is non-instrumentally good for a person is pleasure (and the only thing bad,
  pain). A familiar objection: pleasures share nothing. Warm bath, first bite of an
  apricot, the click of a proof falling into place, the relief of taking off tight
  shoes, being laughed with by a friend, the glow of a long run. If we ask what all
  of these have in common phenomenally, we come up empty. And if we come up empty,
  then either "pleasure" is a disjunction masquerading as a kind, in which case hedonism''s
  monism is a verbal trick; or there is a shared feature, in which case the hedonist
  owes us an account of it, and no account has been convincing.


  Paragraph 2: My claim: the objection equivocates between two questions.

  (T) Taxonomic: what makes each of these states a pleasure, i.e., what is the property
  in virtue of which they form a single natural or psychological kind?

  (N) Normative: what makes each of these states, when present, good for the subject?

  Hedonism is a thesis in the answer to (N) — it says the good-making feature of experience
  is its being pleasant — but it''s usually attacked via (T), on the assumption that
  a single normative role requires a single taxonomic essence. That assumption is
  the real target.


  Paragraph 3: The determinable move. Consider "being colored." Red and blue share
  no specific quality beyond their both falling under the determinable; there is no
  "colorhood-look" over and above the specific looks. Yet we don''t think color-talk
  is a disjunctive sham. What unifies the determinates is not a common ingredient
  but a common place in a single system — a dimension along which things can be compared,
  ordered, and traded off. Pleasure, I want to say, is a determinable whose determinates
  are wildly heterogeneous. What they share is not a phenomenal ingredient (a "hedonic
  tone" sprinkled across experiences) but a shared place in the economy of a single
  subject: each is a state that, from inside, presents its own continuation as worth
  having. Call this self-recommending character.


  Paragraph 4: Why this isn''t circular and why it isn''t a desire theory. Two worries.
  First: defining pleasure as self-recommending looks like defining it as desired-when-felt,
  which is preferentialism, not hedonism. Reply: the self-recommendation I have in
  mind is not a pro-attitude the subject takes up toward the state; it is a feature
  of how the state itself shows up. In the cold-plunge case [describe], the second
  phase is not something I want — I''m gritting my teeth and thinking about nothing
  — but its continuation is nonetheless presented as worth having by the state itself;
  and if I am asked mid-plunge, I say yes, keep going, without needing to consult
  a preference. Second: the account is supposed to explain why pleasure is good, and
  if goodness is built into the definition ("presents its continuation as worth having"),
  the explanation is circular. Reply: I use "worth having" as a description of the
  character of the state, not as a normative claim... hmm, that''s weak. Let me handle
  it differently: acknowledge it as the sharpest objection and flag it for the commenter.
  Actually good — I''ll flag it as the vulnerability and ask for pressure. That''s
  realistic for a draft: "I am not sure this reply works, and this is the first place
  I''d like pressure."


  Paragraph 5: Two tests for the account.

  Case A (unattended warmth): a person deeply absorbed in work has been wearing a
  warm sweater for an hour. There is, we want to say, a background bodily pleasure
  throughout; but at no point did the state present anything to them, because nothing
  was attended to. When interrupted, they say it felt lovely, and they notice the
  loss when they take it off. Does self-recommending character require attention?
  If yes, we lose background pleasures — a serious cost, since a good deal of a good
  life may consist in undisturbed background states. If no, then the "presentation"
  is dispositional, and the account drifts toward the counterfactual: it presents
  its continuation as worth having iff, were the subject to attend, they would...
  — which is a different, less phenomenological, and much more fragile theory.

  Case B (the cherished ache): someone in the second year of bereavement has a specific
  pain — a tightness behind the sternum on the anniversary — that they would fight
  to keep. They want its continuation. It is not a pleasure. So wanting-continuation
  cannot be what makes the difference; something must be located in the character
  of the state itself, and that is exactly what the heterogeneity objection said could
  not be found.


  Paragraph 6: What I think follows. If (A) and (B) bite, the hedonist should give
  up on locating the unifying feature in anything introspectively isolable and instead
  characterize the kind by its functional signature: pleasures are the states that
  (i) are self-presenting as worth continuing when attended, (ii) recruit attention
  and behavior toward their own prolongation, (iii) are missed, when absent, in a
  way that is not mediated by belief about the loss of something else... Hmm, (iii)
  is getting complicated. And then the cost: a functionally individuated kind no longer
  guarantees the intuition that motivates hedonism — that well-being must be reachable
  from inside, that a life cannot go well for someone in a way that never registers.
  That is the dialectical price, and I suspect it''s too high. So the honest conclusion
