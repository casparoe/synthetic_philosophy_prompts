  Persona: I work in aquaculture (maybe at a shrimp/prawn farm, or as a welfare auditor/consultant
  for seafood retailers) and have been arguing for over a year with a colleague who
  is a marine biologist (or: with a colleague who runs the welfare program) about
  whether our operation should change practices. Formal, self-taught, no academic
  background, has read a lot on their own.


  Concrete positions:

  Side A (the colleague / the welfare program): decapods are sentient; evidence includes:
  they groom and protect injured limbs, avoid places where they were shocked, learn
  to give up a valued shelter/food to avoid a noxious stimulus, show opioid-like modulation
  (respond to analgesics like morphine — actually, that''s used in fish/hermit crab
  studies; hermit crabs and crayfish respond to analgesics? There are studies showing
  that crustacean responses to noxious stimuli are reduced by analgesics). Also they
  say: absence of a mammalian-like cortex proves nothing; their nervous system is
  organized differently (distributed ganglia), so demanding a homologous structure
  is begging the question; the decentralized nervous system means responses can be
  generated without the brain, but that cuts both ways — the point is that the behaviors
  are flexible, motivational trade-offs, not reflex arcs.


  Side B (me, or a third person, e.g., the farm''s vet/science lead): all of this
  evidence is consistent with nociception — a hard-wired detection-and-avoidance system
  — and doesn''t show felt experience. Emphasize: in a decapod, much of the response
  can be produced by the ventral nerve cord and local ganglia, so behaviors like grooming
  or withdrawal tell us little about any central affective state; the criteria being
  applied (flexibility, learning, aversion) are met by things almost nobody thinks
  are sentient (they might mention a robot/AI or simple conditioning in invertebrates);
  and the default should be parsimony — you attribute experience only when you have
  positive reason, not merely when you lack a reason to deny it.


  Also inject a distinctive twist: the debate''s practical stakes are concrete — whether
  to stop eyestalk ablation of broodstock shrimp, whether to switch from ice-slurry
  chilling (thermal shock) to electrical stunning, whether live crabs/lobsters should
  be stunned before being cut/cooked. And there''s a wrinkle: even Side B concedes
  that if the welfare changes cost little, they should be made regardless ("cheap
  insurance"), and Side A concedes that if the science were settled against sentience,
  the changes wouldn''t be needed. So they agree on the practical upshot in many cases
  and still fight — which suggests the disagreement isn''t about what to do. That''s
  a nice structural feature to diagnose: they agree on action but fight about belief,
  so the disagreement may be about something else: what the word ''sentience'' means,
  or about the epistemic norms of the organization, or about who gets to decide, or
  about the meaning of "evidence" and burden of proof.


