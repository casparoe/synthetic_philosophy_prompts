  Draft:


  "I have no formal training in biology or philosophy — I run a small marine shrimp
  farm and, over the last four years, I have been the person at our company responsible
  for its welfare policy, which has meant teaching myself a good deal of the scientific
  literature. For two of those years I have been arguing with our consulting biologist,
  and the argument has not moved. I would like a diagnosis of what kind of disagreement
  it actually is.


  The concrete stakes are narrow: whether we should stop removing the eyestalks of
  our broodstock to induce spawning, whether we should stop chilling harvested shrimp
  in ice slurry and switch to electrical stunning, and whether the crabs we hold live
  should be stunned before being killed.


  Her position: decapods are sentient, and the evidence is already strong enough to
  act on. She points to the fact that they tend and protect injured limbs, that they
  will give up a shelter or a food source they value in order to avoid a place where
  they received a noxious stimulus, that they learn such avoidances over long periods
  rather than merely flinching, and that some studies report their responses to noxious
  stimuli being dampened by painkilling drugs. She says that insisting on a brain
  organised like ours is begging the question, because their nervous systems are built
  differently — a chain of ganglia along the body rather than one centralised organ
  — so anatomical resemblance to mammals is exactly the wrong test.


  My position: everything she lists is equally consistent with nociception, a detection-and-avoidance
  system that needs no experience behind it. In an animal whose segmental ganglia
  can generate withdrawal and grooming responses on their own, flexible-looking behaviour
  tells us very little about anything happening in the brain. I also note that her
  criteria are met by systems nobody calls sentient, and that the sensible default
  is to attribute experience only when there is positive reason to, not whenever nobody
  has disproved it.


  Here is the strange part. On the practical question we largely agree: she concedes
  that some of the changes are cheap and would be worth making even if the science
  came out my way, and I concede that if the science came out hers, everything would
  change. So we agree about a good deal of what to do and still cannot agree about
  what to believe. We also agree that the only thing that would settle it directly
  — access to what the animal''s states are like from the inside — is unavailable
  to both of us.


