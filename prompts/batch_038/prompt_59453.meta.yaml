  Structure:

  - Set up the asker (someone working in policy/philosophy of public finance, or a
  graduate student).

  - Present the analogy as used by an opponent / by the literature they''re reading,
  with the conclusion it licenses.

  - Inject a niche twist: a colleague''s remark that once repayment is income-contingent
  the instrument isn''t debt at all but a small equity stake in the borrower — and
  that this reframing (not the mortgage framing) is what the whole debate should turn
  on. Ask whether that''s right and what it changes.

  - Ask for: correspondence table term by term; disanalogies sorted by whether they
  matter for the intended conclusion; what the analogy smuggles in unargued; whether
  the conclusion survives; what a better instrument-analogy would be and what commitments
  it imports.

  - Add specifics about the two regimes so the answer must engage: Germany charges
  nothing (funded by general taxation), Denmark pays a grant; the US/UK charge high
  fees with loans, UK repayment contingent on income above a threshold.

  - Ask for the point where the analogy is doing normative work vs descriptive work.

  - Also: the "free tuition is a transfer from non-graduates to graduates" conclusion
  — ask whether that conclusion needs the mortgage analogy at all, or is independent.


