  I write about higher-education finance, and there is one comparison that keeps carrying
  most of the argumentative weight in the dispute between the Continental and Nordic
  model (no tuition for domestic students, provision paid for out of general taxation,
  in Denmark a monthly grant on top) and the Anglo-American model (high published
  fees, met by loans, in Britain with repayment contingent on earnings above a threshold).
  The comparison is that a student loan is a mortgage. The borrower takes on debt
  to acquire an asset that will appreciate; the asset is the borrower''s own enhanced
  earning capacity; the loan is secured against it; the repayment schedule is simply
  amortization; and income-contingent repayment is a cleverer mortgage, because instalments
  flex with the value of the collateral. From this it is inferred that a fee-and-loan
  system does not burden students at all but finances an investment they would otherwise
  be unable to make, that charging nothing is the anomaly needing justification, and
  that free tuition is a transfer from taxpayers who never attended to graduates who
  did and who will out-earn them.


  A colleague has offered a complication I cannot resolve. Her claim is that the comparison
  fails in an interesting direction: once repayment is a fixed percentage of earnings
  for a fixed number of years, with the balance cancelled at the end, the instrument
  is no longer debt in any ordinary sense but a minority equity stake in a person
  — and the debate has been mis-framed all along, because we have been arguing about
  the price of a loan when we should have been arguing about whether a state may hold
  shares in its citizens.


  Audit the mortgage comparison. I want the correspondence worked through term by
  term — principal, collateral, appraisal, the interest rate as a price for risk,
  default and foreclosure, discharge in bankruptcy, the secondary market in the paper,
  the lender''s ability to diversify, and the buyer''s information about what she
  is buying — and for each term, a verdict on whether the target case has a genuine
  counterpart or merely shares a name. Then separate the disanalogies that actually
  bear on the conclusions above from those that are merely picturesque. Tell me what
  the comparison quietly assumes that nobody in the debate argues for; I suspect at
  least one thing about who sets the price of the asset and who advises the buyer,
  and another about what happens to the value of the asset if everybody buys it. Then
  assess whether the three conclusions survive once the disanalogies are on the table,
  or whether they were being carried by the analogy all along — and note that the
  transfer conclusion in particular may not need the analogy at all.


  Finally: is my colleague right? Say what a shareholding framing would map onto what,
  where it strains (persons are not firms, shares in people cannot be sold, and the
  historical prohibition on owning claims to a person''s labour did not lapse by accident),
  and whether adopting it changes any policy conclusion that the mortgage framing
  already delivered. If neither instrument fits, say so and propose the one that does,
  together with the commitments it would force on both sides.


