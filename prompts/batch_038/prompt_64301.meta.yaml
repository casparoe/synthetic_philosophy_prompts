  \ and effort to grasp, and no agent can, even in principle, have considered all\
  \ of them.\n(7) So no agent believes anything. \n(8) Since the same reasoning applies\
  \ with \"knows,\" no agent knows anything — the account doesn't merely idealize;\
  \ it makes the notion empty.\n\nWhere's the flaw? (5) is the equivocation: it slides\
  \ from the de re content relation to a de dicto/linguistic commitment — \"accepting\
