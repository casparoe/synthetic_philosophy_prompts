  Now let me consider whether the Dewey option or the Aunt Hillary option might produce
  a better prompt. The Hobbes one is distinctive and the analogy is deeply embedded
  in Hobbes''s own project (the state as an artifact; knowledge of what we make).
  The audit has real philosophical teeth: does the artisan analogy license the transfer
  from geometry to civil philosophy? Key disanalogies:


  1. The geometer constructs his object out of matter entirely passive; the commonwealth
  is constructed out of beings who have conceptions and wills, who can withdraw authorization,
  and who must themselves reason about the same principles (the covenant is only binding
  because the contractors see it as binding). So the "material" of political construction
  is itself an interpreter of the construction.

  2. The geometer can inspect his construction at will, repeat it, and control the
  initial conditions (definitions stipulated, no external interference). The political
  philosopher cannot re-run the construction; his "resolution" of the state into individuals
  in a state of nature is a thought experiment, not a disassembly — no one has ever
  lived outside society, so the "parts" he resolves into are not observed parts but
  imagined ones. (Hobbes thinks this is fine, since the resolution is by the mind,
  but it means the analogy of taking a clock apart — where you can literally see the
  wheels — breaks.)

  3. In geometry, definitions are arbitrary stipulations and truths follow necessarily
  regardless of anyone''s assent. In civil philosophy, Hobbes''s definitions (of right,
  liberty, justice, sovereign) are meant to be arbitrary too, but the demonstration
  only produces obligation if the subjects accept the definitions. So the construction
  requires the consent of the materials — no clock''s wheels have to agree to be a
  clock.

  4. The geometer makes the figure, so he knows its causes; but does the sovereign
  or the covenanters "make" the commonwealth in the same sense? Hobbes says the commonwealth
  is made by covenant, and we can know the causes of the passions from our own experience
  (we know the causes of the passions because they arise in us). But strictly the
  commonwealth is made by many agents jointly, not by the knower alone — Hobbes the
  philosopher didn''t make it; and if scientia requires being the cause, then the
  covenanter has scientia but the philosopher merely observes. Hobbes handles this
  by saying we can know the causes of the passions because we generate them in ourselves.
  But the analogy''s clean "maker knows his making" mapping gets murky.

  5. The watch/clock analogy: the parts of a clock are not themselves makers and can
  be known by disassembly; the state''s parts are agents. Also, the clock''s motion
  is fully determined; the state''s depends on wills — Hobbes is a necessitarian,
  so he''d say it''s determined too, but the point is the political philosopher can''t
  observe the internal motions.

  6. The "biographical noise" claim: Hobbes''s quarrel with Wallis and his circle-squaring
  are not noise. His rejection of algebra-as-symbol-manipulation follows from his
  nominalism + his requirement that reasoning be reckoning over conceptions of bodies;
