  ---


  I cover science and ideas for a British broadsheet, and I sit on the paper''s editorial
  standards panel — a standing committee of five (two senior editors, the readers''
  editor, our in-house legal adviser, and myself as the elected journalist member)
  whose decisions on contested usage and evidential standards bind the desks until
  the panel revisits them. Next month we take up the hardest question in our remit,
  and I intend to circulate a paper in advance of it. I would like you to draft that
  paper for me.


  The question is what the paper must have in hand before it says, in its own voice,
  that a campaign amounts to genocide. Our existing house rule, adopted some years
  ago after a different controversy and never revisited, is that we may use the word
  only where a competent international tribunal has so found, or where at least two
  national governments have made the determination through their own formal processes.
  I have come to think this rule is incoherent, and I want the memo to argue that
  case rather than merely note it.


  The test case before the panel has the following features, and I set them out because
  any rule we adopt has to survive contact with something like this — not because
  I am asking you to adjudicate the facts. A UN-mandated fact-finding mission has
  published a report finding reasonable grounds to believe that measures intended
  to prevent births within a population were ordered at a high level, and that children
  have been transferred out of that population in significant numbers; the report
