  a fish into a life worth living is good (or at least not bad), then improving welfare
  and increasing numbers could be good; if you think a life in a net pen is not worth
  living, then improving welfare within aquaculture is a trap. A journalist who says
  "I care about individual welfare, not population size" but also "I oppose expanding
  aquaculture" — needs a view about whether the lives are worth living.

