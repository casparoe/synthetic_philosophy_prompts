  animal experimentation covers live cephalopods and includes fish.

  - Stunning methods: percussive stunning, electrical stunning for farmed salmon/trout;
  crustaceans often killed by boiling alive, or by splitting/ice slurry. Ice-slurry
  chilling is considered aversive for tropical species.

  - Fish welfare: the "fish feel pain" debate — Rose et al. (2014) argued fish lack
  nociception-based pain because they lack a neocortex / C-fibers; Sneddon, Braithwaite
  argued the contrary. Key point: fish lack C-fibres (they have A-delta-like nociceptors),
  and lack a neocortex; some argue the pallium suffices.

  - Crustacean welfare indicators: there is no validated welfare indicator set for
  crustaceans; welfare is often assessed via proxies like survival, growth.

  - The sentience evidence frameworks: Birch''s "sentience profile"/precautionary
  approach; the Animal Sentience Committee.

  - The "invertebrate sentience" argument often relies on behavioural evidence: hermit
  crab shell choice trade-offs (Elwood), prawn grooming/avoidance learning, crayfish
  stress responses.

  - Aquaculture numbers: the number of individual fish farmed is enormous; also huge
  numbers of wild-caught fish are used as feed for farmed carnivorous fish (fishmeal/fish
  oil) — this is a genuine tension: "reducing farmed fish suffering by improving welfare"
  vs. "feed fish" issue.

  - A real tension: welfare-improvement vs. expansion. If you make aquaculture more
  humane, you may reduce the moral cost per animal, potentially increasing production
  — a "welfare-washing" / moral hazard concern.

  - Another genuine tension: killing method. For crustaceans, the recommended humane
  kill is often electrical stunning (Crustastun) or chilling for some species; but
  a "welfarist" who endorses stunning also thereby endorses that killing is acceptable
  if done well — vs. an abolitionist view.

  - Another: the "replace fishmeal with plant/insect feed" solution reduces the number
  of wild fish killed but may increase the number of farmed animals, and insect farming
  itself raises sentience questions (black soldier fly larvae).

