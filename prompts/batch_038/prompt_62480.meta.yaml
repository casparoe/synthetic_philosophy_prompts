  by the UK government ahead of its animal sentience legislation, which concluded
  that decapod crustaceans and cephalopod molluscs should be treated as sentient.

  (4) My stated rule for cases like (3) is precautionary: when the evidence is genuinely
  balanced and a decision has to be made now, the uncertainty should be resolved in
  the animal''s favour.

  (5) I also reject a certain kind of negative argument. The claim that fish cannot
  suffer because they lack the cortical structure that subserves suffering in mammals
  strikes me as a non sequitur: evolution produces convergent solutions, and the absence
  of one lineage''s implementation of a capacity is not evidence that the capacity
  is absent.

  (6) Nevertheless I eat mussels and oysters, and I have told readers that bivalve
  farming is the nearest thing to a free lunch in animal agriculture, on the grounds
  that bivalves have no centralised nervous system to speak of.

