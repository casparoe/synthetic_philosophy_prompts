  contested result in physics: I report what published, replicable behavioural and
  physiological studies support, and I treat anthropomorphic interpretation as the
  default error rather than the default assumption.

  (2) Accordingly, when I cover the long-running dispute over whether fish feel pain
  — the critics who argue that the observed responses are nociceptive reflexes unsupported
  by the integrative neural machinery that, in mammals, goes with suffering — I present
  it as genuinely unresolved and I do not assert in print that fish are in pain.

  (3) At the same time, I have written without hedging that boiling a crab or a lobster
  alive is indefensible, and I have argued for a legal requirement that decapods sold
