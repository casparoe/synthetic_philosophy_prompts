  Option A: Nonidentity problem, type = argument that proves too much. Write out an
  argument in numbered steps:


  (1) An act harms someone only if that person is worse off than they otherwise would
  have been.

  (2) If a child is created and has a life worth living, and the alternative was never
  existing, the child is not worse off than they would otherwise have been.

  (3) So creating a child with a handicap harms no one, provided the life is worth
  living.

  (4) The same reasoning applies to choices that determine which particular child
  exists (the 14-year-old girl, the drug that must be taken before conception).

  (5) So none of these choices harms anyone.

  (6) But by the same reasoning, no choice that affects who exists can ever harm anyone
  — including the radioactive waste policy case where future people will be injured
  (they''d have lived worse but... hmm, in the waste case the injured people would
  not have existed otherwise, so they''re not harmed, though they are wronged).

  (7) So person-affecting ethics with (1) implies that any policy is permissible so
  long as the people it creates have lives worth living — including a policy that
  creates a huge population of people with lives barely worth living (mere addition
  / repugnant conclusion-ish), and including a policy that creates people who are
  wronged but not harmed.

  (8) Therefore (1) is false or person-affecting ethics collapses.


