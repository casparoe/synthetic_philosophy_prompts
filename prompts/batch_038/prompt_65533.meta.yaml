  Prompt draft:


  "You are to act as a philosopher-economist with genuine working expertise in interactive
  epistemology — common knowledge, common priors, agreement and no-trade results —
  combined with enough feel for applied social science to know which formal niceties
  actually bite once you put forty real people in a room and ask them for numbers.


  Background, so that you can judge what matters. A charitable foundation has given
  my small institute eighteen months and two researchers — one with a measure-theoretic
  background in philosophy of probability, one a survey methodologist — to produce
  a memo on the preconditions of *productive* disagreement. The funder''s actual object
  of interest is a concrete institutional design: a standing citizens'' assembly of
  forty members, drawn by lot and serving three-year terms, which deliberates a fixed
  list of policy questions over repeated rounds. The design has three features that
  I think are philosophically load-bearing, and the memo has to say which of them
  threatens convergence and which are harmless:


  (1) Members revise privately, then publish a posterior rounded to the nearest five
  percentage points — the rounding is deliberate, to discourage false precision, and
  to protect members from having their exact numbers quoted back at them in the press.

  (2) Publication is simultaneous but delayed: each round, you see everyone else''s
  rounded figure from the previous round, never the current one.

  (3) A substantial minority — on some questions a quarter of the room — cannot supply
  a single number at all. They are ambiguity-averse in something like the technical
  sense: for a class of questions (long-run technological risk, mostly) they will
  say only that some outcomes are ''worse than others'' and refuse a point probability,
  and the design has to accommodate them rather than score them as non-responsive.


  Now the request. I do not want a survey of the literature on agreeing to disagree,
  and I do not want the well-worn rationalist-community riff on how Aumann''s theorem
  sets an ideal we all fall short of; I''ve read that many times and it does not help
  me allocate two researchers for eighteen months. What I want is a defended research
  agenda: which open questions, in and immediately around the agreement-theorem neighbourhood,
  most directly determine whether this assembly converges, and in what order we should
  work on them.


  Please think carefully, and do not start with the ranking. Begin with a short brainstorming
  section — bullet points are fine — in which you generate the candidate questions,
  including ones I have not thought of, and say in one line each why you are keeping
  or discarding them. Candidates should include, at minimum, questions about which
  assumption of the theorem the rounding violates, what the delay does to the iterated
  structure, whether anything like agreement is even definable when part of the room
  has non-additive or incomplete beliefs, and whether the absence of a common prior
  across forty strangers is a real problem or a red herring. Then give the ranked
  agenda, five to seven items, and for each: the question stated precisely enough
  that someone could tell whether they had answered it; why it is upstream of other
  items on the list rather than downstream; how tractable it is for a philosopher
  and a methodologist in eighteen months with no new mathematical machinery; what
  would count as progress (a proof, an impossibility result, a simulation, a measurable
  prediction about the assembly, a conceptual distinction that dissolves the problem);
  and what evidence or argument over the next year would move it up or down.


  Two further things I want, and they are as important as the ranking. First, name
  two or three questions that are fashionable or interesting in this area and that
  we should nonetheless refuse to fund, and say why the design makes them irrelevant.
  Second, tell me which single question, if it were answered in the worst possible
  way, would make the whole assembly design indefensible — I need to know the crux
  the funder is implicitly betting against.


  No citations, no bibliography, no reading list; I will supply those myself. Refer
  to named results and standard positions only where you are confident of them, and
  otherwise describe the argument rather than the attribution. Where you think my
  three design features have a consequence I have not anticipated, say so plainly:
  I would rather be corrected than reassured."


