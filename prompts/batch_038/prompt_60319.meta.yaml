  Candidate hard challenges:


  1. The "signs relevant to particular topics without expressing any passion" criterion,
  combined with the concession that passions occur in animals "even more violently
  than in us" without thought. Now: what about *human* utterances that express passion?
  Descartes says he excludes "cries of joy or sadness" and "whatever can be taught
  by training" from counting as evidence of thought. But a large part of human speech
  — exclamations, swear words, expressions of hunger, requests ("I want the tidbit")
  — is exactly passion-expressing and trainable. So Descartes'' criterion proves too
  much: it removes as evidence of thought a great deal of human speech. And his requirement
  that signs be "relevant to particular topics" — how does he know a dog''s bark at
  the door isn''t relevant to a particular topic (the visitor) rather than expressing
  passion? He has to say: because we trained it, or because it''s tied to fear. But
  the same can be said of a child''s first words — they''re acquired by association
  with tidbits and approval. So the criterion threatens to prove that children don''t
  think either. That''s a genuinely sharp, in-the-weeds objection with textual bite
  (Descartes himself invokes the deaf-mute case and the training case).


  2. The asymmetry between the "argument from below" (mechanistic sufficiency: we
  do many things without thinking, sleepwalkers swim across streams) and the "argument
  from above" (the language criterion). The problem: Descartes'' own account of human
  action in the Passions of the Soul and Treatise on Man makes almost everything mechanistic
  — habit, walking, eating, parrying blows, passion-driven action. The residue that
  requires thought shrinks to "words or signs not expressing passion." But then: is
  thought doing any explanatory work at all? And if thought is only manifested in
  dispassionate, topic-relevant speech, then a thought could in principle be a pure
  epiphenomenon of the mechanism. This is a nice line of attack, but somewhat standard
  (the "epiphenomenalism" worry).


  3. The pain/sixth meditation angle: pain as confused mode of thought vs. mechanism.
  Combined with the Newcastle letter''s claim that passions occur in animals more
  violently than in us and don''t depend on thought. But Descartes in the Sixth Meditation
  (and in comments to Mersenne about the "natural light"?) says the confused sensations
  of pain, hunger, thirst are modes of thinking — they are thoughts, i.e., they are
  in the mind. So if animals exhibit all the mechanical correlates of pain and (per
  Newcastle) violent passions, and if passions in humans are "accompanied by thought
  because we have the faculty of thinking" — then passions in humans are modes of
  thought. In the Passions of the Soul (1649, art. 27), Descartes says the passions
  are "perceptions or feelings or passions of the soul... caused, maintained and strengthened
  by some movement of the spirits" — they are thoughts! So animal passions can''t
  be passions of the soul unless animals have souls. But Descartes'' own Passions
  text says passions of the soul are perceptions of the soul. Therefore, if animals
  have fear and hope (as the Newcastle letter says they do — "all the things which
  dogs, horses, and monkeys are taught to perform are only expressions of their fear,
  their hope, or their joy"), then either animals have passions in a different sense
  (purely bodily) — which Descartes would insist on, saying "fear" and "hope" in animals
  are just the mechanical dispositions — or animals have souls. The Newcastle letter''s
  own vocabulary ("their fear, their hope, or their joy") is the weak point: Descartes
  ascribes passions to animals to explain trained behavior, but in the Passions of
  the Soul he defines passions of the soul as perceptions of the soul. So: does the
  magpie have hope? If yes (a passion of the soul = a thought), you''ve conceded thought.
  If no, then your explanation of how the magpie''s utterance is produced — as an
  expression of hope — needs a purely bodily substitute, and you owe an account of
  what that substitute is, since the causal story you give in humans runs through
  the soul''s passions.


