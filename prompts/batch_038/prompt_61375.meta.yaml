  Actually I recall the structure now, more concretely:

  - Lewis sets up the case of the devoted innocent friend volunteering.

  - He notes that in mundane criminal justice we think substitution is unacceptable;
  Christians think it''s fine in the theological case.

  - He asks: what''s wrong with penal substitution? He considers several candidate
  objections: (1) it''s unjust to punish the innocent; (2) the punishment wouldn''t
  serve its purposes (deterrence, reform); (3) the offender escapes the suffering.

  - He then points out an exception we all accept: fines. Someone else can pay your
  fine. And we don''t require the payer to be reimbursed (that would just be a loan,
  and then the offender pays after all).

  - Crucially, he notes the condition: the substitute must not be repaid, or at least
  the repayment must not be legally enforceable/expected — otherwise there''s no real
  substitution. Actually I think Lewis says: it''s substitution only if the substitute
  pays out of his own resources and cannot recover from the offender; if the offender
  must repay, the fine ultimately falls on the offender.

  - Then he asks whether this extends: could a friend serve your prison term? He thinks
  not — because imprisonment is not transferable in the same way; you cannot literally
  undergo someone else''s deprivation of liberty... Hmm, or maybe he says the law
  wouldn''t allow it and it would be practically disastrous (rich people hiring substitutes),
  but that''s not a principled objection.

  - I also vaguely recall Lewis discussing the case of a substitute taking a beating/caning,
  and concluding something about "the punishment must be borne by the offender himself
  if it is to hurt him."

  - And the theology part: Christ''s substitution is like the fine case in that the
  debt is paid by a substitute who cannot be reimbursed (we can''t repay Christ),
  and Lewis says that if we accept substitution for fines, the theological doctrine
  isn''t incoherent; the difference is a matter of scale and of who the substitute
  is. He also notes the objection that the substitute''s suffering must be proportionate,
  and that in the theological case God both demands and provides the substitute.


