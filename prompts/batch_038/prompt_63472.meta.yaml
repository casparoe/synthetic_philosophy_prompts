  ---


  The hinge of history hypothesis holds that the present era is unusually, perhaps
  uniquely, pivotal: that what happens over the next century or so will disproportionately
  determine the shape, and the value, of everything that comes after. One route to
  the hypothesis starts from an apparent anomaly — our temporal position looks improbably
  early relative to the whole span of time in which a technologically capable civilization
  could arise — and concludes that the best explanation is not merely that we are
  early but that we are at the hinge. The obvious reply is a base-rate one: if the
  future is likely to be very long, then the prior probability that any particular
  era is the pivotal one is tiny, and the anomaly of earliness would have to be overwhelming
  evidence to move us that far.


  Write an essay of roughly 1,200 to 1,800 words deciding between these positions.
  I want a verdict, not a survey, and I want it argued for. Please address the following
  four points, and be explicit about which of them you take to do the decisive work:


  1. Explication. There are several candidate ways of cashing out what it is for one
  era to be more influential than another — expected effect on the total value the
  future contains; probability of determining whether there is a long future at all;
  degree of control over the trajectory civilization takes thereafter; amount of information
  generated about which futures are reachable. These come apart. State which explication
  you are working with, say whether the hypothesis''s truth value depends on that
  choice, and if it does, whether that makes the hypothesis less interesting or merely
  more precise.


  2. Measure sensitivity. Whether our earliness is anomalous depends on the reference
  class and sampling measure: calendar time versus cumulative population, observer-moments
  versus civilizations, the full span of habitable time versus only the stretch in
  which the relevant capabilities are attainable. Some choices make our position striking,
  others make it unremarkable. Is the argument undermined by this, or is there a principled
  selection of the measure that isn''t simply the one favorable to the conclusion?


  3. Deflation. A weaker claim — that we live in a period of unusual peril, when a
  civilization can permanently foreclose its long future before it has secured it
  — seems better supported than the claim that we live at the point of greatest influence.
  If the deflated version is all the evidence licenses, does anything of substance
  survive, or has the interesting content been quietly traded away?


  4. Reflexivity. The hypothesis flatters its proponents: it tells people who want
  their projects to matter most that they do, and every generation has had a local
  version of it. Is this a real epistemic defeater, operating independently of the
