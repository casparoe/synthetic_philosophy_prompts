  Let me verify the actual numbers. Piccione & Rubinstein''s absent-minded driver:
  The driver has to get home. He starts at START, and there are two intersections.
  If he exits at the first intersection he gets payoff 0 (or 1?), at the second intersection
  4, and if he reaches END he gets 1. Hmm. I recall: "payoff 4 if he exits at the
  second intersection, 1 if he drives to the end of the road (END), and 0 if he exits
  at the first intersection." The optimal plan: continue with probability 2/3 at each
  intersection. Expected payoff with plan p (prob of continuing): P(exit at first)
  = p? No — let''s define q = probability of continuing. Path: at intersection 1,
  exit with prob 1-q → payoff 0; continue with prob q → at intersection 2, exit with
  prob 1-q → payoff 4; continue with q → END, payoff 1. Expected payoff = 4q(1-q)
  + q²·1 = 4q - 4q² + q² = 4q - 3q². Maximize: derivative 4 - 6q = 0 → q = 2/3. Payoff
  = 4(2/3) - 3(4/9) = 8/3 - 4/3 = 4/3. Yes, q = 2/3 continue, expected payoff 4/3.


  Now, at an intersection, given that he''s there, what''s the posterior? He''s at
  intersection 1 with probability proportional to... He reaches intersection 1 with
  prob 1, intersection 2 with prob q = 2/3. So conditional on being at some intersection:
  P(first) = 1/(1+2/3) = 3/5, P(second) = (2/3)/(5/3) = 2/5. Local action: exit now
  → payoff 4 if second (prob 2/5), 0 if first (3/5) → EV = 8/5 = 1.6. Continue → payoff
  4 if first (then he''d exit at the second? no—) Hmm. Careful: local reasoning depends
  on whether he''s committed to the plan at the *other* intersection. The standard
  puzzle: at an intersection, if he exits, expected payoff = (3/5)(0) + (2/5)(4) =
  1.6 > 4/3. So exiting looks better than the plan''s payoff of 4/3, which suggests
  the plan isn''t optimal, which is a paradox (the driver seems to want to deviate
  from the ex-ante optimal plan). Piccione-Rubinstein''s resolution involves the "interpretation"
  of such games — decision nodes within the same information set being treated as
  simultaneous; the driver at the information set cannot think of "the current node"
  without considering that his decision applies at both nodes.


