  Draft:


  Paragraph 1 — context and the practice, described concretely:


  "I direct a philosophy-of-science research group that has, for the last two years,
  been sitting in on the tumour-board meetings and genomics seminars of our university
  hospital, and I am drafting a paper on what clinical oncology quietly assumes about
  evolutionary individuality. Consider three things that are done as a matter of routine,
  in the same institution, sometimes about the same patient on the same day. First,
  a biopsy is sequenced in bulk; variants are assigned allele fractions; those present
  in essentially every malignant cell are labelled clonal and those present in a minority
  are labelled subclonal, with a numerical cut-off applied to the fraction; a phylogenetic
  tree of cell lineages is then reconstructed, with branches, shared ancestors and
  all, and the report will speak of a resistant subclone having been selected by the
  first-line therapy and of its subsequent expansion. Second, the same report, and
  the oncologist summarising it, will speak of the tumour as a thing with properties
  of its own: it is aggressive, indolent, driven, of high or low fitness, likely or
  unlikely to progress — as though the neoplasm as a whole were the bearer of a fitness
  value. Third, the hereditary-cancer service will speak of selection again, but over
  generations, tracking the frequency of a predisposition allele in a population and
  in a pedigree; and the immunology service, when it reports a neoantigen burden as
  a predictor of response to checkpoint blockade, is describing a second selection
  process in the same tissue, this one conducted by lymphocytes on the same cell lineages.
  Meanwhile, the treatment norm against which all this is measured — dose to the maximum
  tolerated level, then switch agents when progression is detected — treats the neoplasm
  as an individual enemy to be eradicated; the alternative protocol that some of my
  clinical colleagues advocate, of dosing intermittently and below that maximum so
  that a population of treatment-sensitive cells survives and competitively suppresses
  the resistant ones, treats it instead as a community to be managed."


