  Option A: Units of selection + practice-presupposes type. Practice: the standard
  protocol in experimental evolution / cancer research. Concrete: The Cancer Genome
  Atlas and clonal deconvolution; the practice of oncologists describing a relapsing
  tumour as "a new population that has evolved resistance", and the practice of "adaptive
  therapy" which deliberately leaves sensitive cells alive to suppress resistant clones.
  What does adaptive therapy presuppose about the unit of selection? It presupposes
  selection acts on the cell lineage within the tumour (competition among cells),
  not on the tumour as an organism, and not on the patient. But oncology also speaks
  of tumours as having "fitness" and "aggressiveness" as properties of the whole neoplasm,
  and germline selection (evolution of cancer susceptibility alleles) acts at the
  organism/population level. Interesting tension: within-tumour selection vs. between-host
  selection; and the practice of sequencing "bulk" vs single-cell, defining a "clone"
  by shared mutations — which presupposes that lineages are the units, that replication
  is faithful enough that mutation-defined clusters are lineages (high-fidelity replication
  + heredity requirement). Also the "Maynard Smith & Szathmáry transitions in individuality"
  framing: a tumour as a failed transition, or a reversion to a lower level of individuality.
  Also the practice of defining "clonal" vs "subclonal" mutations by variant allele
  fraction thresholds — a scoring convention that presupposes discrete lineages rather
  than a continuum. Also immunology: clonal selection theory of antibody production
  — the same word "clone" — and the practice of calling lymphocytes "selected" presupposing
  selection on individual cells with heritable variation.


