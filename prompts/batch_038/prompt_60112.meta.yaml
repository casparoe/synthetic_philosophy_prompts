  Simplest well-known case where free information is bad: when you''re not certain
  about your own rational response to the evidence, or when learning can force you
  to update in ways you mistrust. Good''s theorem assumes you know how you''ll respond
  and that your responses are conditionalizing. So: an argument that assumes (1) accuracy
  is the sole epistemic value, (2) rational credences must be non-dominated, (3) my
  future self will conditionalize, (4) therefore I should always seek more evidence
  — then produce a case where seeking evidence makes me predictably less accurate:
  e.g., I know I''ll be unable to conditionalize correctly (a "confident fool" case),
  or the case of an agent who knows that upon learning E she will (by a psychological
  quirk) come to believe a falsehood with certainty. Then by (1)-(4) I should still
  seek the evidence, because expected accuracy of free information is nonnegative
  — but I can see that it''ll make me worse. So one of the premises fails: (3) fails,
  and that''s exactly where Good''s theorem''s assumptions live. And the cost of rejecting
  (3) is interesting: accuracy-first epistemology''s argument for conditionalization
  assumes you will conditionalize, so you can''t use it to tell you what to do if
  you won''t.


