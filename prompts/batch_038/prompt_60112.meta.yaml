  Design: Let H be a hypothesis about which you currently have credence 0.9, and you
  know that 0.9 is right (say your evidence fully supports it). A device offers to
  give you a piece of evidence E about H. You know exactly how you''ll respond to
  E (you''re an ideal reflective agent, or at least you know your own psychology):
  on receiving E you''ll move to 0.95; on receiving ¬E you''ll move to 0.5. And you
  know E is highly likely but not certain. Then expected accuracy goes up by Good''s
  theorem (if E is genuinely evidentially relevant and you conditionalize). To make
  it go down, I need to break one of the theorem''s assumptions: e.g., you won''t
  conditionalize on E, because you''ll over-react. So the case: you know that upon
  seeing a positive test result you will — because of a well-documented quirk of your
  own, confirmed by your therapist and by past experience — jump to credence 1 in
  H, and upon seeing a negative result you''ll jump to 0. So both responses are extreme
  and non-conditionalizing. If the test is imperfect (say it''s 90% sensitive and
  90% specific) and H is true with probability, say, 0.5... then expected accuracy
  after testing might be worse than before, because you''ll be certain in both directions
  and the test errs 10% of the time. Before testing you''d have credence 0.5, Brier
  score for a true H: (1-0.5)^2 = 0.25 inaccuracy. After testing: with prob 0.5 H
  is true; the test is positive with prob 0.5*0.9 + 0.5*0.1 = 0.5; so you become certain
  of H when positive and certain of ¬H when negative. Your inaccuracy: if H true and
  positive (0.45): 0. If H true and negative (0.05): 1. If H false and negative (0.45):
  0. If H false and positive (0.05): 1. Expected inaccuracy = 0.10. That''s better
  than 0.25. So testing still helps. Need a worse test: test that''s right only 60%
  of the time. Prior 0.5, expected inaccuracy before = 0.25. After: you become certain
  whenever the test says anything; the test is correct with prob 0.6; expected inaccuracy
  after = 0.4. So testing is worse! Great: with a coin-flip-ish test (60% accurate)
  and a known tendency to become certain on either result, free information is worse
  in expected accuracy. Good — and this is exactly the point: Good''s theorem assumes
  you''ll conditionalize; if you''re going to over-update, information can hurt.


  Now the argument that "proves too much": the asker''s argument concludes that in
