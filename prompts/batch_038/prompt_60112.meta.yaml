  Actually here''s a crisp known overgeneration: Joyce''s argument against certainty.
  Under the Brier score, credence 1 in a true proposition is not dominated... Let''s
  check: a proper scoring rule gives max expected accuracy at the true probability;
  if p is actually true, credence 1 gets Brier score 0 (best possible) and cannot
  be dominated in that world. But domination is world-wise: c dominates c'' iff c
  is at least as accurate as c'' in every world and strictly more accurate in some.
  If c assigns 1 to a truth p, then in the world where p is true, nothing beats it;
  so no c'' dominates c. So certainty in a truth is not accuracy-dominated — meaning
  Joyce''s argument does NOT rule out certainty in true propositions. But it does
  show that if you''re certain in a contingent proposition p, then in worlds where
  p is false you''re infinitely bad; a credence of 0.99 is better than 1 in those
  worlds and worse in p-worlds — so not dominating. So certainty isn''t ruled out
  by accuracy-dominance. Yet Lewis argued against certainty via the Principal Principle
  (never be certain of a contingent proposition, since you should leave room for chance).
  Pettigrew''s argument against certainty uses different machinery (he argues credence
