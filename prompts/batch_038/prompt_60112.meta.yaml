  (or that it requires you to arrange to be a certain-kind-of updater), and then generalizes:
  rationality sometimes requires you to knowingly make yourself less accurate; and
  more shockingly, by the same reasoning, you should sometimes induce in yourself
  a disposition to ignore evidence, i.e., accuracy-first epistemology permits/requires
  epistemic self-sabotage — which sounds absurd because the whole selling point of
  accuracy-first epistemology is that epistemic norms are all about tracking the truth.


  Let me structure it as numbered premises:


  (1) Only accuracy matters, epistemically: an option is epistemically rationally
  required iff no available alternative is guaranteed (world-by-world) more accurate,
  and more generally the right way to compare options is by expected accuracy, where
  expectation is taken with respect to your current credences. — Hmm, careful: dominance
  vs expected accuracy are two different criteria, and mixing them is a natural flaw
  source. Good: let the argument slide between them.


  (2) Brier score, additivity.


  (3) I know exactly how I will respond to the test result: I will go to 1 on the
  tested proposition whichever way the result falls. (Known psychological quirk; also:
  I know I cannot help it, since the quirk is not under voluntary control.)


  (4) Given (3), expected accuracy after testing = 0.4; before = 0.25. So testing
  lowers expected accuracy.


  (5) But (4) can''t be right, because there''s a general theorem that free information
  never lowers expected accuracy for an agent whose accuracy measure is proper and
  additive; the accuracy-first program derives this as a corollary of the very same
  framework that delivers probabilism. So (4) must be wrong: taking the test cannot
  make me expect to be less accurate. [Here''s the slide: the theorem has hidden assumptions
  — that the agent conditionalizes on the evidence, that the agent''s evidence partition
  is one she expects to be able to use, and that the options being compared are "act-independent"
  in the relevant sense.]


  (6) Therefore, on accuracy-first grounds, I should take the test even though I foresee
  it will leave me less accurate — and the same reasoning shows I should seek out
  any evidence, and should not pay to avoid misleading evidence, and should not arrange
  to forget things I know.


  (7) But surely a theory whose sole value is accuracy cannot require me to knowingly
  reduce my accuracy; if it does, then either accuracy isn''t the only value, or ''expected
  accuracy by my own lights'' isn''t the right criterion, or rationality is not about
  maximizing expected accuracy at all. I''d rather keep (1) than give up the theorem
  in (5).


  Where''s the flaw? The flaw is at (5)/(6): the theorem applies only to agents who
  will conditionalize on the evidence (and who know they will), i.e., it''s a theorem
  about ideal agents or about agents choosing among acts whose accuracy consequences
  are "act-independent." If you know you will respond to E by jumping to extremes,
  then you are not conditionalizing, and Good''s theorem simply doesn''t apply. Also
  there''s a deeper structural point: in the accuracy-first framework, epistemic rationality
  is evaluated at a time given evidence; your future credences will be evaluated relative
  to *their* evidence. Once you have the test result, your evidence includes it, and
  the accuracy-first framework will then tell you that the rational credence is the
  conditionalizing one — and you will fail to be rational. So the framework doesn''t
  say "take the test"; it says you''re going to be irrational afterwards, and the
  question of what to do about *choosing your own future credences* (a "diachronic
  choice" problem) is not settled by the framework at all — it requires importing
  a decision-theoretic principle about acts that determine credences, and that''s
  exactly where act-dependence and the "ought implies can" issues bite. Also: expected
  accuracy by your own lights is the wrong criterion when you know your own lights
  will change — a "self-locating"/"planning" problem. And there''s a neat related
  point: you could pay to have the quirk fixed, or to not receive the result, or to
  receive the result only after committing to a conditionalizing rule; the real options
  space is bigger than binary "test vs. no test."


  Also there is a nice additional flaw: (3)+(4) treat the post-test credence as fixed
  at 1 regardless, but then (6)''s generalization to "should not arrange to forget
  things I know" doesn''t follow.


  Another good wrinkle: the agent who knows she will become certain can *precommit*:
  e.g., take the test only if she can also arrange to be sedated... but "ought implies
  can" and the fact that you can''t directly choose your credences.


  And there''s a legitimate "the argument is valid, pick your cost" reading: some
  philosophers bite the bullet and say the case shows expected accuracy by your own
  lights is not the right criterion, or that accuracy-first needs an extra constraint
  ("only choose among acts that leave you conditionalizing"), or that the case shows
  accuracy is not the *only* epistemic value (there''s also something like "epistemic
  autonomy" or "reliability"/"safety" — a virtue-reliabilist value). Berker''s critique:
  accuracy-first epistemology is a form of epistemic consequentialism, and consequentialism
  permits trading off accuracy in one place for accuracy in another; if you accept
  trade-offs across time and across propositions, you get cases where you should knowingly
  become less accurate now to become more accurate later, which looks like the very
  "end justifies means" structure that critics find objectionable in epistemology.
  This is a great "price" discussion.


  Let me also double check numbers: Brier score inaccuracy = (1 - c)^2 if H true,
  c^2 if H false (for single proposition). Prior credence 0.5 with H true with prob
  0.5: expected inaccuracy = 0.5*(0.5)^2 + 0.5*(0.5)^2 = 0.25. Good. Test 60% accurate
  (i.e., P(positive | H) = P(negative | ¬H) = 0.6). With prior 0.5: P(positive) =
  0.5. After: c = 1 if positive, 0 if negative. Expected inaccuracy = P(H & positive)*0
  + P(H & negative)*1 + P(¬H & negative)*0 + P(¬H & positive)*1 = 0.5*0.4 + 0.5*0.4
  = 0.4. Yes: 0.4 > 0.25. So testing is worse by expected Brier. Good.


