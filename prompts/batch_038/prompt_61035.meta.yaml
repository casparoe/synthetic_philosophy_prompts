  Alternative: Arendt + *An Enemy of the People* (Ibsen). Dr. Stockmann discovers
  the baths are contaminated; the town conspires to suppress the factual truth; the
  mayor (his brother) organizes the public against him; Stockmann is declared an enemy
  of the people. This is almost too perfect an illustration of Arendt''s "Truth and
  Politics": factual truth vs. political power, the truth-teller as enemy of the polity,
  the impossibility of the polity admitting a fact it doesn''t want, and Arendt''s
  claim that factual truth-telling is not itself political but has political consequences,
  plus her point that the modern lie is about image and public relations rather than
  secrets. And there''s the twist: Stockmann is also right about something rational
  (his eugenic-ish/individualist tirades in Act 4 about "the compact majority" being
  always wrong) which the town rejects — that maps onto Arendt''s distinction between
  rational truths (which can be argued with) and matters of fact (which are stubborn).
  And the play ends with Stockmann choosing to stay and fight, declaring the strongest
  man is he who stands most alone — a position Arendt would call anti-political (it
  retreats from plurality). That''s a beautiful "where the work resists the reading
  / where the reading illuminates" hinge: Ibsen''s play seems to valorize truth-telling
  in isolation, while Arendt holds that truth has no political force on its own and
  that standing alone is a flight from the public world. Excellent.


  Also there''s the complication of Stockmann''s own dishonesty/rhetoric: he uses
  the baths report to attack the town''s leaders, he inflames, he turns his factual
  discovery into a wholesale denunciation of democracy — which is exactly Arendt''s
  worry about the truth-teller who becomes a would-be tyrant of truth. And Arendt''s
  remark that factual truth is "despotic" in nature — it cannot be argued with, it
  compels — which is precisely what makes it politically dangerous.


