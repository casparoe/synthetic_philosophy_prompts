  Option C: Dutch books + teaching type. E.g., "I have to teach Dutch book arguments
  to a reading group..." The teaching type asks for dependency structure, carrying
  example, misconceptions. That''s a strong type because it requires understanding
  how the idea is misunderstood. Misconceptions: (1) that a Dutch book shows you''ll
  actually lose money (needs the bookie''s ability to know your beliefs and offer
  bets you accept; also needs bets to be taken as a package rather than piecemeal);
  (2) that coherence = consistency of explicit beliefs; (3) that the argument proves
  you must have probabilistic beliefs (representation vs. behavioral); (4) the "money
  pump"/diachronic version and the assumption you can''t learn; (5) that the argument
  rules out non-probabilistic credences that you''d never bet on (the "no-betting"
  objection — Christensen''s point that Dutch books assume your dispositions to accept
  bets reveal degrees of belief); (6) the problem of "fair betting odds" not existing
  for propositions you''d never bet on; (7) the worry that the argument can''t handle
  imprecise credences.


  A good prompt: teach Dutch book arguments to first-year philosophy students in a
  50-minute section, or to a group of economists. The carrying example question: should
  you start with the conjunction bet (P(A), P(A&B)) or with the simplest violation
  — accepting both a bet on P and a bet on not-P at prices that sum to more than the
  stake? The misconception to head off: "but I''d just never accept those bets" —
  which requires explaining that the argument is about your actual dispositions, and
  that the coherence requirement bites precisely when you''d accept each bet separately
  but not together.


