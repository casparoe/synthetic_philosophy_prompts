  Option B: Situationist critique of virtue + fiction. E.g., read *Schindler''s List*
  or *The Remains of the Day* or *Atonement* or *Lifeboat* (Hitchcock) or *The Bridge
  on the River Kwai*. Situationism: the claim (from Milgram, Isen & Levin''s dime/phone
  booth, Darley & Batson''s Good Samaritan study) that behavior is explained by situational
  factors rather than global character traits, and that there are no character traits
  in the robust Aristotelian sense. Response from virtue ethicists: the situationist
  studies measure what they don''t measure; "global trait" requirement; Snow, Sreenivasan,
  Kamtekar''s "local traits"; Merritt''s proposal to preserve virtue while acknowledging
  situational dependence (a "socially scaffolded" virtue — the person keeps their
  virtue partly through the support of their community). Also Flanagan, or Kristjánsson.
  And the Haidt "elephant and rider"? Not needed.


  Pair with *The Bridge on the River Kwai*: Colonel Nicholson''s character — is his
  integrity a virtue or a trait that is situationally channeled? Or *12 Angry Men*:
  Juror 8 — the situation (group pressure, heat, one room) vs. character. Actually
  12 Angry Men is an amazing fit: it dramatizes both the fragility of individual character
  under social pressure AND the possibility of a person whose convictions hold up
  — and it lets you ask whether Juror 8''s courage is a global trait or a product
  of his particular situation (an architect, an outsider to the neighborhood, etc.).
  Also Juror 3''s breakdown shows how "character" is biographical/situational. The
