  Content of the moves — let me be careful to make each side strong.


  Move 1 (Dana): Utility as economists use it is not an independent quantity. Revealed
  preference says: the only thing preference attributions can mean is choice. So "she
  chose the apple because it gave her more utility" is not an explanation; it''s a
  redescription of the fact that she chose the apple. Any choice whatsoever, no matter
  how bizarre, is compatible with "she preferred it." A concept that no observation
  could contradict isn''t a concept with content. (Classic vacuity/tautology charge.)


  Move 2 (Victor): That''s not right, because the theory isn''t "she preferred whatever
  she chose." It''s a claim about patterns: if she takes X when Y is affordable, she
  must not take Y when X is affordable. Consistency axioms (WARP, and in the price-setting
  GARP) are real, checkable constraints, and people do sometimes violate them. So
  the framework risks something. Also, the nonparametric revealed-preference tests
  give a definite answer: given a finite data set of prices and chosen bundles, either
  there exists a monotone concave utility function rationalizing it or there doesn''t,
  and you can determine which. That''s a substantive empirical claim, not a tautology.


  Move 3 (Dana): Two replies. First, the consistency axioms are the part with content,
  and they''re exactly the part that fails: preference reversals between pricing and
  choosing, framing effects, choice-set effects (compromise/attraction effects), hyperbolic
  time-inconsistency. Faced with these, the standard response is not to abandon the
  framework but to enrich the description of the choice situation — add a reference
  point, a frame, a salience weight, a present-bias parameter — and then any behavior
  can be rationalized again by the enriched theory. So the content that was there
  gets bought back with flexibility. Second, and deeper: even when GARP holds, all
  it shows is that choice is consistent; it says nothing about utility as a thing
  people have. So the framework is either falsifiable and not about utility, or about
  utility and unfalsifiable.


  Move 4 (Victor): The "always modifiable, therefore empty" move proves too much.
  Newtonian mechanics was modified by adding unseen forces and epicycles-of-a-sort;
  by your standard, F = ma is unfalsifiable because force is whatever produces acceleration
  — the same redescription charge, applied to a theory that obviously has content.
  What matters is whether the modifications are independently motivated and whether
  they buy novel predictions. Present-bias and reference-dependence both do: they
  predict systematic, previously unobserved patterns (procrastination on tasks with
  distant deadlines, endowment effects, the direction of the reversal between joint
  and separate evaluation). Also, note that the enriched models are more constrained,
  not less: hyperbolic discounting with a fixed β,δ predicts a whole schedule of reversals
  across delays; you can''t fit just anything.


  Move 5 (Dana): Fine — but then you''ve conceded my real point, which isn''t about
  falsifiability at all. It''s about what "utility" is supposed to be. Either it names
  a psychological state — felt satisfaction, wellbeing, a hedonic quantity — in which
  case choice data is at best fallible evidence about it and the whole revealed-preference
  project has changed the subject, since people demonstrably choose against their
  own reported wellbeing (and report high wellbeing while choosing in ways economists
  call irrational); or it names nothing over and above the choice pattern, in which
  case statements about utility are bookkeeping conventions with no explanatory work
  to do, and the economists who explain behavior by utility are just talking as if
  they had a mechanism. Neither horn gives you utility as something that explains.


  Move 6 (Victor): There''s a third option you keep skipping: utility as an interpretive
  attribution, like the intentional stance. Attributing preferences isn''t claiming
  a mechanism inside the skull any more than attributing beliefs to a chess program
  is; it''s the right descriptive level for a system whose behavior is best predicted
  by treating it as optimizing. On that reading the "explanation" charge is misplaced
  — you wouldn''t say a center of gravity "explains" nothing because it''s an abstraction,
  and you wouldn''t say temperature explains nothing because it''s definable from
  molecular statistics. Utility is the economist''s temperature: a macro-level quantity,
  cashed out in a representation that''s only unique up to transformations that don''t
  matter (positive affine for cardinal, monotone for ordinal), and doing real predictive
  work.


