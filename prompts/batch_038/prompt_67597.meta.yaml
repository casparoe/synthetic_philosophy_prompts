  ---


  Consider the following case, which I shall call the Elicited Bookmaker.


  An agent A is asked for a probability concerning some empirical proposition h —
  say, that a particular defendant will be found liable. Two question forms are used,
  which I shall treat as interchangeable ways of putting the same question: a bare
  form ("What probability do you assign to h?") and a comparative form ("Which is
  more likely, h or its negation, and by how much?"). A answers 0.72 to the first
  and 0.55 to the second. The discrepancy is not noise: it is stable across repetitions,
  it moves systematically with surface features of the wording (the order in which
  h and not-h are mentioned, whether the question is cast in the negative, whether
  a numerical anchor is supplied), and A is perfectly capable of recognising the two
  forms as equivalent when this is pointed out. A will accept or reject a bet on h
  at whatever price corresponds to the number it states in the form in which it was
  asked, and a bookmaker who knows this is free to choose the form for each bet in
  a package.


  One further stipulation, which I think matters: when A is shown both answers side
  by side and asked which it stands by, A endorses 0.55 as its considered judgement
  and dismisses 0.72 as a slip. So the variation is not wholly unreflective; A has
  a view about which of its own numbers is authoritative, and that view is not simply
  the most recent one.


  The proposition I want a number for is this:


  P: A is irrational in precisely the sense that the Dutch Book argument for probabilism
  is meant to diagnose — that is, the guaranteed-loss package the bookmaker can assemble
  reveals a genuine defect in A''s doxastic state, and not merely a failure of the
  argument''s identification of degrees of belief with betting quotients.


  Please give me your credence in P, and give it to me decomposed rather than as a
  single figure...


  ---


