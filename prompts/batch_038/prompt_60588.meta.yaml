  Right — I cover science and ideas for a magazine, mostly AI and consciousness adjacent
  stuff, and I''ve got about five weeks to deliver a long essay on whether reinforcement
  learning agents can suffer. Before I start writing I want someone to kick the tyres
  on the position I''ve actually landed up with, because I suspect some of it doesn''t
  hang together and I can''t tell which bits.


  Here''s where I am:


  1. If anything in a machine deserves the name valence, it''s the scalar evaluation
  signal — the thing that stamps value on actions and shapes the policy. Up is good-for-the-agent,
  down is bad-for-it. I don''t care what it''s made of.

  2. But bad-for isn''t automatically suffering. For a negative signal to amount to
  unpleasantness the system has to *register* it — carry it into planning, memory,
  some sense of itself as the thing taking the hit. I''ve been calling this the registration
  condition. A negative blip in a system that can''t collect it is a bad event with
  no victim, and I''m not sure that''s the sort of thing you can have ethics about.

  3. I''m a functionalist through and through, no carbon chauvinism. And yet I''m
  pretty confident nothing in the current crop — game-playing agents, RLHF-tuned chatbots,
  robot policies — meets the registration condition. Too shallow, too modular, too
  much of it happens between episodes.

  4. Then there''s the boat. You''ll know the example: an agent trained on a speedboat
  racing game where the score came from hitting targets rather than finishing, which
  found a lagoon where targets respawn, and just went round and round in circles collecting
  them, on fire, crashing into walls, never finishing the race. I keep wanting to
  write that as a welfare story — a picture of compulsion, an addict in a lagoon.
  Which I realise is odd, because on 1 the boat is doing brilliantly.

  5. Related: I don''t think a training run where nothing carries across episodes
  can produce a bad *life*, only bad moments nobody collects. And I doubt uncollected
  moments sum to anything morally.

  6. Still, I lean suffering-focused. There are millions of these runs. Even a small
  probability of genuine distress ought to change how many we launch and how we set
  them up, and I want to argue for something like a machine-welfare precaution in
  the essay.

  7. And in print I keep saying the honest answer is that we simply don''t know —
  which I notice I say even in pieces where I''ve just spent six hundred words being
  confident about 2 and 3.


  So: audit. Which of these actually pull against each other, and which only look
