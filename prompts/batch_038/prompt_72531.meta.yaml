  Reflection principle: Van Fraassen 1984, "Belief and the Will," Journal of Philosophy.
  Reflection: if you now know that at a later time you will believe P with degree
  of belief x, then your current degree of belief in P should be x. Justifications:
  diachronic Dutch book arguments (Skyrms, Lewis), and the idea that your future self
  is epistemically a better-informed expert. Objections: cases where you expect your
  future beliefs to be produced by non-evidential means (drugs, torture, brainwashing,
  the "Party" case where you''ll be tired/distracted), Christensen''s counterexample
  about the future after a drug, the case of the student who will believe a professor''s
  testimony, cases involving "cognitive self-destruction" (van Inwagen? Actually the
  literature: Roger White on higher-order evidence, Arntzenius on "some limits on
  Bayesian reflection"? Arntzenius discusses cases where reflection fails — e.g.,
  the "Copenhagen"? Hmm.) Also the "Sleepy/Late-night" example: you know that at 3am
  you''ll be exhausted and believe something. Also Elga on disagreement and the debate
  about whether reflection should apply to your beliefs about your own future beliefs
  when you expect them to be caused by evidence you don''t have yet (that''s fine
  — the "conditionalized" reflection: your future beliefs are better because of new
  evidence, and Reflection should be restricted to cases where the change is by conditionalization
  on evidence; that''s the standard refinement). Also Talbot''s argument that reflection
  is about respecting your future self''s rationality; also the connection to "self-trust."


  Van Fraassen also connects reflection with the Principle of Conditionalization:
  reflection is derivable if your future credences are related to current by conditionalization
  on the total evidence you''ll acquire, plus you know you won''t lose evidence /
  won''t be misled. Actually, reflection holds when you''re certain your future beliefs
  arise by conditionalization (and no loss of memory).


