  combination, the "akrasia requirement" (rationality requires: not [believe P and
  believe it''s irrational to believe P]). Lasonen-Aarnio argues that there can be
  rational akrasia — in fact she argues the "akrasia requirement" fails and that being
  steadfast in the face of higher-order evidence can be rational. Also "epistemic
  dilemmas." Also the single-premise closure debate (Doris? no — that''s about practical).
  The relevant: Lasonen-Aarnio "Higher-order evidence and the limits of defeat" (2014)
  and "Epistemic norms and epistemic akrasia"; Horowitz "Epistemic akrasia" (2014,
  Nous); Greco & Tanaka? Also Weatherson, Maria Lasonen-Aarnio, and "Enkratic reasoning"
  (Way?). Also the "ought implies can" objection: if your evidence supports P but
  higher-order evidence says it doesn''t, then either you violate the enkratic principle
  or you violate an evidential norm.


