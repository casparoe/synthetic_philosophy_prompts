  Exam question (take-home, 1,000-word limit):


  "In On Certainty Wittgenstein discusses G. E. Moore''s claim to know such propositions
  as that here is one hand and that the earth has existed for a long time. Explain
  (a) what Wittgenstein takes to be wrong with Moore''s use of ''I know'' in this
  context; (b) how the propositions that function as hinges differ from ordinary empirical
  beliefs in their role; and (c) whether hinge propositions are, in any sense, justified.
  Conclude by saying whether you think Wittgenstein''s remarks amount to a reply to
  the sceptic, and to whom — if anyone — the reply would be available."


  That''s a good, multi-part question with room for subtle errors.


