  ---


  Last Thursday my brother-in-law and I argued for something close to four hours about
  how many objects were in a shipping container, and neither of us won.


  I work as the inventory and claims officer for a bonded warehouse inside a free-trade
  zone: goods sit in our racks under customs control, duty deferred, and my job is
  largely to say how many items are on a manifest and what each of them is. Customs
  classification rules help themselves to a distinction philosophers fight about —
  a consignment of unassembled or disassembled parts is entered as the finished article
  it will become, provided the shipment, as presented, already has the "essential
  character" of that article. My brother-in-law, who finished a philosophy doctorate
  and now writes software, insists that this is metaphysics by fiat: on his view any
  collection of things whatsoever composes a further object, so there is a single
  thing consisting of the turbine blades in our Bay 12 and a goat standing in a field
  in Anatolia, and the warehouse''s manifest is simply one very convenient way of
  carving up an ocean of equally real fusions. When I objected that this makes "one
  object" mean nothing, he replied that I was a nihilist in a warehouseman''s jacket:
  on his account, strictly speaking, there are only simples arranged turbine-bladewise,
  and everything I insure, count, and sign for is a manner of speaking. He says my
  "essential character" test is a tariff rule dressed up as ontology. I say his universalism
  cannot explain why the number of items on my manifest changes when the blades are
  bolted to a core, and his nihilism cannot explain why it does not change when I
  relabel a pallet.


  Neither of us budged, and I have come away thinking that the argument cannot be
  settled by more arguments — it needs a case where the counting is forced, expensive,
  and inescapable. So I would like you to write the case, as fiction.


  Write a short story of roughly 2,000 to 2,800 words that takes a definite position
  on the special composition question — under what circumstances, if any, do several
  things compose a single further thing — and argues for it through what happens rather
  than through what anyone says. Requirements:


  1. Setting and stakes...

