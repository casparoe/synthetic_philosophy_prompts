  Draft:


  ---


  I am building a set of cases to test whether theories of personal identity can answer
  a question they usually dodge: not just *whether* I survive, but *where* I am. Dennett''s
  brain-transplant scenario — the narrator''s brain is removed and kept alive in a
  vat while his body is remotely piloted by radio — makes the location question vivid,
  but it does so with a single jump cut: the brain comes out, the body keeps walking,
  and the puzzle is posed all at once. I want a case with no jump cut.


  Please construct a thought experiment to the following specification.


  Purpose. ...


  The scenario. Describe a subject, call him S, who begins as an ordinary adult human
  with his brain in his skull. Under a surgical program, each neuron of his brain
  is removed one at a time and replaced, at the moment of removal, by a component
  housed in a laboratory a thousand miles away, which takes over that neuron''s functional
  role and communicates with the rest of the system by radio. The cranial cavity is
  progressively vacated; the body in the operating theatre stays alive, awake, talking,
  and walking around, driven by hardware that is increasingly elsewhere. The transfer
  runs to completion.


  Constraints:

  1. Continuous consciousness: at no point is S unconscious, interrupted, or replaced;
  he is conversing throughout and reporting what it is like from the inside. His reports
  must be given at the three checkpoints and must be internally consistent with what
  the theories can accommodate — he never reports being nowhere, and never reports
  being in two places.

  2. No duplication: at every moment there is exactly one stream of consciousness
  and exactly one candidate person. No second body, no backup, no copy, no fission-and-reunion.

  3. Permitted technology only: the vat-and-radio setup, functional neuron-for-neuron
  replacement, and the ordinary biology of a living human body. No uploading into
  a computer that isn''t driving the body, no teleportation, no disembodied minds,
  no souls, no cryonics or resurrection.

  4. Realistic texture: the case should read like a hospital/research program, with
  a clinical team, not like a sci-fi premise. One continuous narrative, no more than
  ~300 words.


  What must come out of the case (this is where the design work is):

  - At three checkpoints — 25% of the brain transferred, 50%, and 100% — the case
  must be such that three theories give *different* answers, and the differences must
  be generated by each theory''s own commitments rather than stipulated: (a) a psychological-continuity
  theorist in the Parfittian... (careful: Parfitian) mold who holds that what matters
  is the right kind of causal-psychological connection; (b) an animalist who holds
  that S is a human organism and that his identity consists in the organism''s continued
  life; (c) a "brain-based" biological theorist who holds that S goes where his brain
  goes. At least one checkpoint must produce agreement among all three and at least
  one must produce a three-way split — and you must show why the split arises at that
  checkpoint and not the other.

  - For each theory at each checkpoint, two answers are required: does S survive,
  and where is S? Location must be answered with a place, not evaded.

  - No theory may be allowed to answer "identity is indeterminate here" at any checkpoint
  except where you can show that indeterminacy follows from the theory''s own stated
  resources, in which case say which resources produce it.


  Then sections:


  1. "The Scenario" (~300 words) — the narrative, meeting constraints 1–4.

