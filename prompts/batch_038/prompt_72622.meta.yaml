  as a regime type but what she calls an "audit chain," a sequence of links running
  from a hungry household to someone who stands to lose by ignoring it — an observer
  who notices the distress, a publisher who can report it without penalty, an intermediary
  whose position depends on that report travelling upward, and a decider who pays
  a price for inaction. Famines occur, she says, when any link is severed; and she
  claims some one-party states had intact internal chains, which she treats as the
  hard cases that a simple "democracy prevents famine" claim cannot handle. She also
  insists that the entitlement vocabulary explains acute famine but should not be
  extended to chronic undernutrition, and when critics raise aggregate crop statistics
  she tends to reply that they are reading national accounts rather than household
  budgets.


