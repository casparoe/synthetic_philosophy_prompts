  I am a third-year student in a seminar on the political economy of food crises,
  and I have been asked to interview our guest for the department''s student-run podcast.
  The guest is an economic historian who works within the entitlement tradition: she
  holds that starvation is a failure of a household''s ability to command food rather
  than a shortfall in aggregate supply, and she argues that famines stop where political
  accountability operates. Her recent work adds something distinctive, and I want
  the interview to press on it rather than let her restate the familiar thesis.


