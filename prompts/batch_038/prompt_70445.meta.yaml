  editorial. Prices decide which mistakes get made cheaply and which get made expensively,
  by deciding who absorbs the loss when an estimate turns out wrong. Call this the
  *residual* reading: the price system is a machine for distributing the burden of
  error across many small, mutually insulated bearers, so that being wrong is survivable
  and therefore frequent, and frequency is what generates the knowledge Hayek says
