  Title-ish: "Who Gets to Be Wrong: Residual Risk and the Calculation Debate"


  §1. Setup. The standard telling has two moves and two replies. Mises: without market
  prices for capital goods there''s no way to compare heterogeneous inputs against
  outputs, so rational economic calculation is impossible in a complex economy. Lange:
  fine, then let a Central Planning Board do what Walras''s auctioneer does — set
  parametric prices, tell managers to minimize cost at those prices and expand output
  until marginal cost equals price, observe surpluses and shortages, and iterate.
  Hayek: that reply concedes everything important. The relevant knowledge isn''t the
  kind that shows up in statistics; it''s dispersed, local, and largely inarticulate,
  and the board''s iteration would be hopelessly slower than the discovery process
  it''s supposed to imitate. Everyone then argues about which of these is right.


  §2. My wedge. I think both the impossibility claim and the reply are usually read
  in what I''ll call a *computational* register: is the allocation problem solvable,
  and by whom, with what data and how fast? In that register Lange is at worst an
  optimist about compute, and modern machine learning has made him look better and
  better — you can gesture at RL agents learning to allocate in simulated economies,
  at gradient methods finding fixed points nobody writes down, at large-scale recommender
