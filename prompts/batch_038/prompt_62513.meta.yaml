  Accuracy-first epistemology: the core program is to derive epistemic norms (probabilism,
  conditionalization, reflection, etc.) from a premise that accuracy is the one fundamental
  epistemic value, plus constraints on inaccuracy measures (proper scoring rules,
  additivity, separability, continuity, propriety). Joyce''s 1998 "A Nonpragmatic
  Vindication of Probabilism" argues that non-probabilistic credence functions are
  accuracy-dominated by probabilistic ones (given additive measures). Pettigrew''s
  2016 book systematizes this.


