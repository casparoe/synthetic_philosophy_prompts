  and then derives substantive norms: non-probabilistic credence functions are accuracy-dominated
  by probabilistic ones, and conditionalization (or the plan to conditionalize) minimizes
  expected inaccuracy. The critics press at least three different lines: that the
  constraints on the measures already encode the conclusions, so the derivations are
