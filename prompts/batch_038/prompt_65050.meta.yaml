  For the past several years I have been keeping a private log of my own aesthetic
  verdicts in cases involving fakes, copies, and attribution, on the theory that if
  I write them down before theorizing I''ll at least have honest data. I''ve reached
  the point where I want the theory. Here are the entries, in the order I made them.


  1. Van Meegeren-grade case: a fake Vermeer praised by the best experts of its day,
  exposed decades later. Before the exposure I would have said I loved it; after,
  I find I love it less. I cannot point to a single perceptible difference, and I
  do not believe the object changed. Verdict: diminished — and diminished in the thing
  I look at, not merely in the deed that produced it.


  2. The same painting in a world where it is never caught. Verdict: also diminished;
  I''m inclined to say the value was simply never there. But I notice this leaves
  nothing in the world to correspond to the difference in value between (1) and (2),
  which bothers me more than it should.


  3. A gifted student''s open copy, made as an exercise, never intended to pass for
  anything, hung on a wall where everyone knows what it is. Verdict: not diminished
  at all. Something close to admirable.


  4. A machine-generated image in the style of a dead master, plainly labeled as machine-made,
  which I find genuinely lovely to look at. Verdict: diminished — more than (3), though
  like (3) it deceives nobody.


  5. The master''s own replica: a successful composition the artist paints a second
  time, with his own hand, for a patron who wanted a pair. No deception, no borrowed
  reputation, full authorship. Verdict: worth considerably less than the first version.
  A copy with permission.


  6. The reverse forgery: a dealer passes a superb original by an unknown painter
  off as a lost work by a famous master; years later the unknown painter is identified.
  Verdict: the painting goes up in my estimation when I learn the truth, because the
  achievement is larger — there was nothing to lean on. At the same time I think the
  painter was seriously wronged by the dealer, and I don''t want to say the wrong
  makes the picture better.


  7. Overpaint and restoration. Given the choice between a damaged original and the
  same original beautifully repaired by a later hand, I find I would rather look at
  the honest ruin. I also notice, watching the news cycle around the panel sold at
  auction in 2017 as a Leonardo — long catalogued as a copy, heavily overpainted,
  then stripped and reattributed — that my own estimate of it has swung several times
  without my having seen it any differently.


  8. Cross-domain controls. A counterfeit watch that keeps perfect time and looks
  perfect: I think it is nearly as good as the real thing, and that what''s lost is
  legal and reputational rather than in the object. A replica violin that is acoustically
  indistinguishable from the old master''s: I still think it is worth a small fraction,
  and I cannot say why, since the sound is the entire point of a violin.


  9. A forgery that is, to my eyes, better composed than the work it imitates. I prefer
  looking at it and would pay more for it. I also insist it is worth less. I am flagging
  this one as an outright contradiction rather than a puzzle.


