  A good diagnosis-type prompt: the asker works at a famine-early-warning NGO or in
  a policy shop, notices that the field''s arguments have stalled: everyone agrees
  famine is caused by distribution/access not absolute scarcity (post-Sen), everyone
  agrees prevention is technically feasible, and yet the two camps — the "technical/logistical"
  camp (early warning, food aid, cash transfers, safety nets) and the "political crime"
  camp (deliberate starvation as a weapon, accountability, criminalization of starvation
  under international law) — talk past each other. Ask: is this a substantive disagreement,
  a verbal one about the word "cause," different explananda (proximate mechanism vs.
  responsibility), or a difference about what counts as an actionable claim? And what
  would count as progress?


