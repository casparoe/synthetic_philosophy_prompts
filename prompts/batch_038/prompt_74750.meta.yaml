  dispute: Sen''s "democracy prevents famine" claim vs. critics who note democracies
  have had famines (e.g., Bengal 1943 under British rule—arguably a colonial state,
  not a democracy; but also Malawi, India post-independence near-famines, and the
  Irish famine under a constitutional state). There''s the "FAD" (food availability
  decline) vs "entitlement failure" debate. And there''s a real methodological dispute:
  Sen''s entitlement approach vs. "political economy"/agency-based accounts (e.g.,
  that Sen''s framework is itself depoliticizing because it treats famines as market
  failures rather than choices). Cormac Ó Gráda''s "Famine: A Short History" has a
  chapter critiquing Sen, arguing that in some famines food availability did decline,
  and that Sen''s framework doesn''t handle conflict-driven famines well. Also the
  Great Leap Forward: Yang Jisheng, Dikötter, and the debate over whether it was "policy
  crime" vs. "systemic" — and the dispute about the death toll numbers, which is itself
  stalled.


