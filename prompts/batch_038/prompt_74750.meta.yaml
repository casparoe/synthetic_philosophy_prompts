  Option C: Augustine on lying + diagnosis type. Augustine wrote two works: "De Mendacio"
  (On Lying) and "Contra Mendacium" (Against Lying, addressed to the Priscillianists).
  His view: lying is always sinful; he distinguishes eight grades of lie (or seven/eight
  kinds), ranks them by severity; he holds that a lie is a statement against what
  is in one''s heart ("cor") — the key is the will to deceive, double-heartedness.
  There''s a real puzzle/stalled debate in the secondary literature: whether Augustine''s
  definition requires an intent to deceive or just a mismatch between belief and speech.
  In De Mendacio he defines it in terms of "duplex cor" — one thing in the heart,
  another in speech. But he also says joking lies (i.e., speech not intended to be
  believed) aren''t lies because there''s no intent to deceive... Hmm. There''s a
  genuine interpretive standoff: does Augustine hold the "falsehood + intent to deceive"
  view (making him close to the later standard view) or the "insincerity only" view
  (making him closer to Chisholm/Bok or to the "assertoric insincerity" view)? And
  modern philosophers have debated: is lying essentially deceptive, or just insincere?
  That''s a live debate (Fallis, Stokke, Sorensen, Faulkner). The Augustine case is
  a good hook. But: is it stalled in the sense the type requires?


