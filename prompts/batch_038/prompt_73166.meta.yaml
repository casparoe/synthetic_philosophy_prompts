  Student answer draft:


  "Foucault''s starting point in Discipline and Punish is that the punishment of the
  body stopped being a public spectacle sometime around the turn of the 19th century
  and got replaced by the prison. The standard story is that this was progress: punishment
  became humane because we stopped enjoying cruelty and started caring about the criminal
  as a person. Foucault thinks this story gets things backwards. What changed was
  not the amount of cruelty but its target and its technique. The scaffold displayed
  the sovereign''s force on one body in front of a crowd, and it was risky, since
  the crowd could turn and side with the condemned. Discipline instead spreads power
  thin across many bodies and many small moments — timetables, drills, ranks, examinations
  — so that no one has to be violent in any dramatic way.


  Power/knowledge names the fact that knowledge is never neutral: the expert disciplines
  (criminology, psychiatry, medicine) develop because they serve the interests of
  whoever is in power, and their claims about the criminal mind are ideological cover
  for domination. So the critic''s job is to look behind these sciences and show what
  interests they mask, and to recover the truth they distort.


  The Panopticon is Bentham''s prison design: a ring of cells around a central tower,
  with the cells backlit so the guard can see in but the prisoners can''t see whether
  anyone''s actually watching. Foucault''s point is that modern prisons were built
  to this plan and this explains why they were so effective at reforming offenders
  — you no longer need chains, because the architecture does the work. What makes
