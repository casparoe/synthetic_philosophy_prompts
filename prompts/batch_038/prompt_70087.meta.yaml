  a bioethics/philosophy-of-history seminar, or writing an essay for their blog. Casual
  voice, one or two typos, elaborate 2-3 paragraphs. Ask for: a reading of Citizen
  Kane through Plutarch''s biographical method (Lives, not histories; the small detail
  revealing character; the synkrisis/comparison; the moral purpose of producing an
  impulse to imitate) and through the modern debate about moral learning from lives
  / exemplarism and hagiography (the flattening objection, the "moral saints" worry,
  the epistemic access-to-character problem, whether narrative can transmit virtue
  rather than just information). Then ask where the film resists: Kane is a life that
  refuses to yield a moral, and the film may be making the anti-Plutarchan point;
  but the honest critic must say whether the film is refuting exemplarism or just
  showing that Kane is a bad exemplar (a life can be a failure as an exemplar without
  exemplarism being false — that''s a nice trap to build in, an actual conceptual
  distinction the model has to get right). Also: does the audience''s privileged access
  to Rosebud make the film itself a hagiography in reverse — i.e., the film gives
  us the trivial detail Plutarch promised and lets us do what Thompson can''t?


