  Draft:


  ---

  I''m a third-year PhD student putting together a session on the nonidentity problem
  for our population ethics reading group, and I need help designing a teaching case
  that I''ve failed to build twice on my own. Here is the design brief.


  What I want is a *matched pair* of scenarios — call them Case A and Case B — that
  isolate exactly one variable: whether the identity of the affected individual depends
  on the agent''s choice. Everything else is to be held fixed as far as you can manage
  it: same kind of agent, same kind of decision, same deliberative situation, same
  costs to the agent, same distribution and total of well-being across the people
  who end up existing. In Case A the individual who will be affected by the choice
  already exists, or will exist whatever the agent does. In Case B, the choice determines
  who exists: the individual who will be affected is someone who would never have
  existed had the agent chosen otherwise. In both cases the agent knowingly brings
  about a situation in which that individual will have a life that is worth living
  but that involves a serious and avoidable burden — and in both cases there is an
  alternative available that would have avoided the burden.


  Target verdicts: in Case A, a person-affecting account that defines harm comparatively
  — someone is harmed only if they are made worse off than they would otherwise have
  been — condemns the act, and an impersonal account agrees. In Case B, the person-affecting
  account is silent or permissive: the individual cannot have been made worse off,
  since the only alternative for her is never to have existed, and her life is worth
  living; while the impersonal account condemns the act just as firmly as in Case
  A, because the world that results is worse in the only respect impersonal views
  recognize. If the pair works, the reader sees that the disagreement in Case B is
  not produced by anything about identity per se; it is produced by the comparative
  baseline the person-affecting view has adopted, and the identical intuition in Case
  A shows that the baseline is doing the work.


  Constraints. Both cases must be realistic and mundane — family decisions, a clinic,
  a school, an employer, a municipal authority — with no genetic engineering or embryo
  selection, no time travel, no science fiction, and no appeal to Parfit''s own stock
  examples (the teenager who conceives now rather than waiting a few months, the energy
  policy whose waste makes life harder for people centuries hence). Each case must
  be describable in a single tight paragraph. Crucially, in Case B you may not smuggle
  in an extra wrong-making feature: no identifiable third party is harmed, no one''s
  rights are violated against them, no promise is broken, no information is withheld
  from the agent, and the individual who ends up burdened is not worse off than she
  would have been under the alternative — otherwise a comparative account of harm
  still gets a verdict and the isolation fails. My own first attempt collapsed for
  exactly this reason: I had the mother in the case taking something during pregnancy,
  but the resulting child turned out worse off than a different child would have been
  in her place... hmm, wait. That doesn''t quite make sense. Let me fix: my first
  attempt used a fertility clinic case, but a student in the pilot pointed out that
  the burdened child was also worse off than she would have been had the clinic chosen
  the other available procedure, because the procedure determined timing rather than
  identity — so the identity variable wasn''t actually isolated, it had drifted.


  Also: state what the case is for so I can tell whether you''ve cheated. The point
  is to generate the verdicts from the theories, not to stipulate them.


  Then the deliverables after the scenarios:

  1. A constraint check, feature by feature, confirming that the two cases match on
  everything except the identity variable, and listing honestly any place where they
  don''t quite match and how much that matters.

  2. For each theory in each case, the verdict and the reasoning that produces it
  — in Case B, spell out why the comparative baseline blocks the harm claim and why
  the impersonal view is unmoved.

  3. Which single feature of Case B is doing the work.

  4. An intervention: tell me what happens if you remove or vary that feature — e.g.,
  if the burdened individual is worse off than she would otherwise have been, or if
  a harmed third party is added — and whether the resulting case collapses into a
  run-of-the-mill wrong rather than a nonidentity case.

  5. At least two distinct strategies a defender of the person-affecting restriction
  could use to avoid the bad verdict in Case B without giving up the comparative baseline
  — for instance, a non-comparative account of harm on which causing someone to exist
  with a serious burden can wrong her even though she is not made worse off, or a
  principle that compares the actual people with the merely possible people who could
  have existed in their place — and for each, what it costs and whether it would change
  the verdict in Case A too.

  6. Finally, an honest note: does the pair actually show that the identity shift
  is irrelevant, or only that the two cases are matched too closely to be interesting?


