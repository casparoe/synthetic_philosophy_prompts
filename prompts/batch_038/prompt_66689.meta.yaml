  Draft:


  ---


  Para 1 (setting/context): I''m a policy analyst seconded to a welfare reform review,
  and I''ve spent the last few months reading the assessment instruments that decide
  who qualifies for disability benefits. [Add flavor: a friend in philosophy keeps
  asking why I''m bothered.]


  Describe the practice concretely:

  - Claimants are scored against a fixed list of activities: preparing a meal, eating,
  managing medication/therapy, washing and bathing, dressing, communicating verbally,
  reading, engaging with other people face to face, making budgeting decisions, planning
  and following a journey, and moving around.

  - Each activity has descriptors with point values; a threshold total determines
  eligibility and the rate.

  - Ability is scored as the claimant can do it "with an aid or appliance they normally
  use," and only counts if they can do it safely, to an acceptable standard, repeatedly,
  and in a reasonable time.

  - Nothing in the form asks about the claimant''s income beyond a separate means
  test; nothing asks how the claimant feels about their life; nothing asks whether
  their home has a lift, whether their employer is accommodating, or whether the local
  buses are accessible.

  - A 45-60 minute assessment conducted by a contracted health professional, whose
  report is often the decisive evidence, weighing the claimant''s self-report against
  observed behaviour in the room.

  - The amount paid is then means-tested against income and capital.


  Para 2: the questions. What metric of advantage does this presuppose? Not welfare
  — it never asks about satisfaction, and it would be indifferent to the claimant
  who reports a good life. Not resources — it ignores their assets and their family''s
  support, and it''s not compensating for the extra costs of disability in cash terms...
  or is it? Or is it a capabilities/functionings view, and if so which: it measures
  what a person can do (capability) or what they actually do (functioning)? The aids-and-appliances
  rule seems to say the prosthesis is part of the person''s capacity, which is a claim
  about where the person ends and the world begins. The "repeatedly, safely, in a
  reasonable time" criteria smuggle in a norm of productivity — or of what, exactly?
  Reconstruct the implicit theory and say whether the practice needs it or whether
  several metrics would license the same form.


  Para 3: the tensions/underdetermination:

