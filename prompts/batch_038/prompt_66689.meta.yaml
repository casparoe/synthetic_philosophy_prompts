  Best combination: I think "equality of what?" + the practice/policy-presupposition
  type is strong. A concrete practice: needs assessment for disability benefits; or
  the use of QALYs in health technology assessment (NICE); or the ADA''s "reasonable
  accommodation"; or means-tested benefits. QALYs are well known enough — quality-adjusted
  life years used by health technology assessment bodies to decide which drugs get
  funded. What does that presuppose about equality? It presupposes equality of welfare/utility
  (or capability?). Actually QALYs presuppose a welfarist metric — and famously they
  disadvantage people with chronic disability (the "disability critique": a life-saving
  treatment given to a disabled person yields fewer QALYs because their baseline quality
  of life is scored lower). Sen''s critique: capabilities vs functionings; the "adaptation"
  problem — the deprived adapt their preferences, so welfare metrics understate injustice.
  Nussbaum''s capabilities list. Dworkin''s resources: expensive tastes, the "cut
  in the social space" idea; hypothetical insurance market.


  Alternatively, a practice that''s interesting: the US Social Security disability
  insurance determination, or the UK''s Personal Independence Payment (PIP) assessment
  with its point-scoring descriptors — how far you can walk, whether you can prepare
  a meal. That''s a very concrete scoring rule: PIP scores points on "can you walk
  20 metres," etc. What does the scoring presuppose about what matters — functionings?
  Resources? And it notoriously ignores the aids/adaptation a person uses. Actually
  PIP explicitly scores ability "with aid or appliance" — which is interesting: it
  treats the prosthesis as part of the person''s function, whereas the capabilities
  approach would ask about the capability set. Hmm, but that requires accuracy about
