  Good — confirms PIP is non-means-tested, extra-costs oriented, based on practical
  effects, with daily living and mobility activities, outsourced assessments, etc.
  Important correction to my draft: PIP is non-means-tested. So I should not say the
  amount is means-tested for PIP. Instead, the means-test tension is better placed
  elsewhere: e.g., the same claimant may also be assessed for Employment Support Allowance
  / Universal Credit, which is means-tested and work-capacity-based (the Work Capability
  Assessment — limited capability for work). That''s a nice "X here but Y there":
  two different instruments for the same person — one measuring difficulty with daily
  activities and mobility (non-means-tested, not linked to work), the other measuring
  capability for work (limited capability for work / work-related activity), and then
  a means test on household income and capital for the main benefit. That''s an excellent
  internal tension: the state asks two different questions about the same body, in
  two different vocabularies, and gets answers that can diverge (someone can score
  as having no difficulty with daily activities yet be unable to hold a job, and vice
  versa).


  Also, PIP is explicitly justified as helping with "extra costs of living with a
  disability" — which is a resourcist justification (compensating for the higher price
  of achieving the same things) rather than a capabilities or welfare justification.
  Yet the instrument measures functional difficulty, not extra costs. That''s a beautiful
  gap: the stated rationale is cost-compensation, the metric is functional-capacity,
  and the underlying philosophical claim often invoked by claimants is about wellbeing/participation.
  Three metrics in one policy. Excellent — that is precisely the "underdetermination/inconsistency"
  material.


  So the practice to describe:

  1. The stated purpose: to help with the extra costs of a long-term health condition
  or disability; non-means-tested, not linked to ability to work, paid at two rates.

  2. The instrument: fixed list of daily living and mobility activities; each with
  descriptors carrying points; a threshold total determines rate; ability assessed
  as the claimant can do it with an aid or appliance they use, safely, to an acceptable
  standard, repeatedly, and in a reasonable time; a face-to-face or telephone assessment
  by a health professional employed by a private contractor; the claimant''s own account
  weighed against the assessor''s observations.

  3. The parallel Work Capability Assessment for the other benefit: measures "limited
  capability for work" via similar descriptors but with a different rationale and
  a different consequence (conditionality — you must engage with work-related activity
  or be sanctioned).

  4. Means test on income and capital for the main income-replacement benefit.


  Then the questions:

  - What metric does the disability instrument presuppose? It never asks how the claimant
  feels about their life (rules out welfarism? or just refuses adaptation?), never
  asks what they own or what their household earns (rules out resourcism in the Dworkinian
  sense? but its stated rationale is extra costs — which is resourcist!), measures
  a standardized list of activities (functionings or capabilities?).

  - The aids/appliances rule: is that a claim about where the person ends and the
  environment begins? Does treating a wheelchair as restoring the capability to "move
  around" commit the state to an extended/externalist view of function, and does it
  thereby ignore the extra cost the aid represents — which is the very thing the benefit
  is supposed to cover? That''s a genuinely sharp point: the aid rule says "with your
  aid you can move 20 metres, so you score low," while the justification is "we''re
  compensating the extra costs of disability," and the aid is itself a cost. So the
  instrument and the rationale point in opposite directions. Beautiful. I should present
  that as the asker''s puzzle ("this is what has me confused"), which fits the type
  notes: the asker may be puzzled by an apparent inconsistency.

  - The "repeatedly, safely, in an acceptable standard, in a reasonable time" gloss:
  what norm of a person does that presuppose — a normalizing standard? (Could gesture
  at Foucault but shouldn''t cross domains.) It''s a statistical/normative idea of
  the typical able-bodied performance.

  - The social model of disability: the instrument locates the disadvantage in the
  individual, holding the built environment constant. Is it committed to a medical
  model, or is it measuring a conversion-factor gap (same resources → fewer functionings)?

  - Adaptation: people who have adapted report no difficulty; the form asks about
  difficulty, not satisfaction, but also not about what they''ve given up. Does the
  practice presuppose the anti-adaptation argument, or is it indifferent?

  - Why two instruments (disability benefit + work capability) that can disagree?
  Do they presuppose two different theories of what a person''s contribution and needs
  consist in, and is the state entitled to hold both?

  - The means test: why is the extra-cost benefit exempt from the means test while
  the income-replacement benefit is not? What does that presuppose about which inequalities
  are matters of justice and which are matters of luck/private responsibility?

