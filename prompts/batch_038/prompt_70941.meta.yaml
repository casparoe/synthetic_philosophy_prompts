  \ it therefore has a countable model M. On the other hand ZFC proves Cantor's theorem:\
  \ for any set x there's no surjection from x onto its power set, so in particular\
  \ ZFC proves that P(ω) is uncountable, i.e. that there is no bijection between ω\
  \ and P(ω). So M is a countable structure — its whole domain has only countably\
  \ many objects in it — and yet M satisfies the sentence 'there is no bijection from\
  \ ω onto P(ω)'. M thus contains an object that it calls the power set of ω and which,\
  \ according to M, has more elements than ω, while from outside we can enumerate\
  \ everything in M in an ω-sequence, including everything that M counts as a subset\
  \ of ω. That's the paradox: the model seems to be right and wrong about the same\
  \ thing at once.\"\n\n(b) \"The resolution, which is Putnam's, is that 'uncountable'\
  \ isn't absolute. What the sentence in M really says is that there is no function\
  \ in M that M recognises as a bijection between ω^M and the object playing the role\
  \ of P(ω)^M. From outside, there is such a bijection — but it isn't one of M's sets,\
  \ so it isn't in the range of M's quantifier. First-order quantifiers range only\
  \ over the domain of the model, so 'there is no bijection' is true in M and false\
  \ when we speak from the metatheory about M's domain. Nothing has gone wrong with\
  \ Cantor's theorem: it's provable in ZFC and hence true in every model of ZFC, including\
  \ M. What's relative to the model is the notion of the size of a set, and of how\
  \ many subsets a set has; what's not relative is the truth of any first-order sentence\
