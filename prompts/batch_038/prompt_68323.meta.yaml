  later requires "perfectly natural predicates"). Another: student conflates Armstrong''s
  necessitation relation (N(F,G)) with a Humean regularity; or says Maudlin''s view
  makes laws explanatory of the mosaic but denies that laws describe — Maudlin holds
  laws are ontologically primitive and govern the evolution of states. Another: "the
  problem of underdetermination — different systems fit the same data equally well"
