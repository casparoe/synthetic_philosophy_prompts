  says both are resolved by dominance reasoning — no, Pascal''s Wager uses dominance/expected
  value with infinite utility, mugging uses finite but large utility with tiny probability).
  Also confusing Kolmogorov complexity discounting with the "leverage penalty." Or
  claiming that bounded utility solves it but not noticing that a sufficiently persistent
  mugging (repeated offers) can still accumulate. Hmm.


  Dirty hands: Walzer''s "Political Action: The Problem of Dirty Hands" (1973). Key
  features: dirty hands is not merely a moral dilemma or a case where a politician
  must choose the lesser evil; Walzer insists the politician who does the dirty thing
  is *guilty* — he does wrong, and it''s exactly that he''s right to do it. Walzer
  distinguishes from utilitarian (which dissolves the problem: the right act is just
  the best outcome) and from Weber''s distinction between an ethic of responsibility
  and an ethic of ultimate ends. Walzer thinks the dirty-handed politician should
  feel guilt, and possibly be punished — a "paradox": he deserves punishment and yet
  we want him to do it. Subtle error possibilities: student says Walzer thinks dirty
  hands is just a hard choice between two goods; or conflates Walzer''s dirty hands
  with Sartre''s; or attributes to Weber the view that the two ethics can be reconciled
  (Weber says they are irreconcilable — "Politics as a Vocation": the ethic of responsibility
  vs. ultimate ends stand "in irreconcilable contradiction" — I must not quote this
  from memory though). Or claims that Machiavelli''s advice to the prince is that
  immoral acts are permissible for the good of the state, whereas Machiavelli... hmm.
  Also possible error: student says the dirty hands problem shows consequentialism
  is false, but Walzer''s point is more nuanced — dirty hands cases arise because
  values are incommensurable/plural; a utilitarian who accepts that the best act is
  right has no dirty hands, just regret over "bad" means. Actually Walzer says the
  utilitarian can''t make sense of dirty hands because for him the right act is the
  one that maximizes utility, so the politician did nothing wrong. And the "moral
  absolutist" (deontologist) also can''t, since if the act is absolutely forbidden
  the politician shouldn''t have done it — dirty hands requires both that the act
  was wrong and that it was the right thing to do all-things-considered. That''s a
  great subtle point for grading.


