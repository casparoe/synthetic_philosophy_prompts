  can''t explain the particular facts because that would be circular, and Humeans
  have no response; whereas Loewer distinguishes metaphysical explanation from scientific/nomological
  explanation — the mosaic explains the laws metaphysically, laws explain particular
  facts scientifically. That''s a nice subtle point.


