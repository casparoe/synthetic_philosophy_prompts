  I am drafting a short essay on the foundations of Bayesian epistemology, intended
  for an audience that has encountered Dutch book arguments before but has not worked
  through the details. Below is a near-complete draft. I would be grateful for substantive
  criticism rather than encouragement, and I have set out what I want at the end.


  **Draft: "The Bookmaker Is Doing No Work: Dutch Books as Pure Geometry"**


  **1.** The synchronic Dutch book argument is usually presented as a story about
  gambling. Suppose an agent''s degrees of belief over a finite algebra are given
  by a function b, and suppose she is disposed to buy or sell, at her own odds, any
  bet on any proposition in the algebra: she will accept a bet with stake S on X at
  price b(X)·S, for S of either sign. If b fails to be a probability function — if,
  say, b(X) + b(¬X) ≠ 1, or b(X ∨ Y) < b(X) + b(Y) for disjoint X and Y — then there
  is a choice of stakes such that the agent''s net payoff is negative in every possible
  world. She has been Dutch-booked. De Finetti called a credence function that admits
  no such set of bets *coherent*; Ramsey''s earlier remarks about the consistency
  required of partial beliefs point in the same direction. The conclusion drawn is
  that rational degrees of belief must be probabilities, and the argument is advertised
  as a *pragmatic* vindication of that claim, since it routes the conclusion through
  the agent''s dispositions to act.


  **2.** There is a diachronic counterpart, due in its standard form to Lewis. If
  an agent''s announced conditional credence in H given E differs from the ratio b(H
  ∧ E)/b(E), and if she expects to learn E with certainty and to update by some other
  rule, a bookie who is allowed to transact with her both before and after the evidence
  arrives can assemble a package that loses money for her no matter which world turns
  out to be actual. Rational updating is thereby constrained to conditionalization.


  **3.** Now set the story aside and look at the mathematics. Write W for the set
  of worlds, and identify each world w with a vector v_w in R^n whose i-th coordinate
  is 1 if the i-th proposition in the algebra is true at w and 0 otherwise. A set
  of stakes s = (s_1, …, s_n) produces the payoff function Σ_i s_i (v_w,i − b_i) at
  world w. The agent is Dutch-bookable exactly when there is an s such that this is
  negative for every w — that is, exactly when s · v_w < s · b for every w. But that
  is precisely the statement that the hyperplane with normal s strictly separates
  b from the convex hull of the vectors {v_w}. And the convex hull of those vectors
