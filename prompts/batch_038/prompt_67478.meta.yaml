  Title: "Against the Bookmaker: Dutch Books as Pure Geometry"


  §1. Set-up. Synchronic Dutch book: agent with credences b(·) over a finite set of
  propositions; a bet on X with stake S pays S if X true, 0 otherwise; agent buys
  at price b(X)·S. If b violates the probability axioms (e.g., b(X)+b(¬X) ≠ 1, or
  b(X∨Y) < b(X)+b(Y) for disjoint X,Y), a bookie can choose stakes such that the agent
  loses money in every possible world. De Finetti called a credence function that
  avoids this coherent. Ramsey had the same idea earlier in terms of consistency of
  partial beliefs.


  Note: the bets must be evaluated as a package, and the losses are guaranteed regardless
  of which world obtains — the key is that the loss is *certain*, not merely expected.


  §2. Diachronic version: Lewis''s argument against agents who don''t update by conditionalization.
  If the agent announces a conditional credence b(E→H) that differs from the ratio
  b(H∧E)/b(E) and then updates on learning E, a bookie can buy a package at the earlier
  time whose total payoff is negative in every world.


  §3. The geometric reading. Consider the set of possible worlds W; each world w corresponds
  to a vector v_w in R^n whose i-th coordinate is 1 if X_i true at w, 0 otherwise.
  The convex hull of these vectors is exactly the set of coherent (probabilistic)
  credence functions — this is the standard proof: b is a probability function iff
  b lies in that hull; if b is outside, a separating hyperplane exists with normal
  vector s (the stakes), giving s·b < s·v_w for all w, i.e., the agent pays more than
  the guaranteed payoff in every world: a Dutch book. Conversely any Dutch book''s
  stakes give such a hyperplane. So the two notions are the same theorem twice.


