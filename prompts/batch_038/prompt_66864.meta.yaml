  if it can."


  Student answer (numbered or in paragraphs):


  "Probabilism is the claim that a rational agent''s credences must obey the probability
  axioms: non-negative, summing to 1 over a partition, and additive for disjoint propositions.
  The accuracy argument tries to establish this without any appeal to betting.


  The first step is to say how accurate a credence function is. You pick a scoring
  rule s that assigns an inaccuracy to a credence in a single proposition at a world,
  and you extend it to a whole credence function by summing over the propositions
  in the agenda. The canonical example is the Brier score, which measures inaccuracy
  as the squared difference between your credence and the truth-value of the proposition,
  so being certain of a truth costs nothing and being certain of a falsehood costs
  the maximum.


  Not just any scoring rule will do. Joyce imposes conditions — additivity, so the
  inaccuracy of the whole is the sum of the inaccuracies of the parts; normality,
  so a credence''s score depends only on that credence and the truth-value of the
  proposition it''s in; convexity, so that the penalty for moving away from the truth
  increases the further you go; and propriety. A rule is proper when the credence
  you actually hold scores better than any other credence you might have held instead.
  The Brier score is proper in this sense.


  With those conditions in place the theorem says: if b is not a probability function,
  then there is some probability function b* that is strictly less inaccurate than
  b at every possible world. And the converse also holds — no probability function
  is strongly dominated by anything. So an incoherent agent is guaranteed to be less
  accurate than she could be, no matter how the world turns out.


  One thing the theorem does not say is that coherent credences are accurate. A perfectly
  coherent credence function can be way off in the actual world; the claim is only
  that no single alternative beats it everywhere. Coherence is a kind of insurance,
  not a guarantee of truth.


  This is where the argument is supposed to be nonpragmatic. The Dutch book argument
  for the same conclusion says that an incoherent agent''s credences license a package
  of bets that loses money come what may. Joyce''s argument is that same theorem with
  the payoffs relabelled: instead of counting dollars you count inaccuracy, and the
  dominating credence function is just the sure-loss package read the other way round.
  Because the units have changed from money to accuracy, the argument no longer depends
  on what the agent wants, so the objection that it presupposes a desire-like state
  just doesn''t get a grip — there''s no desire anywhere in the premises.


  For Conditionalization, the same dominance strategy goes through. If your plan for
  updating on a piece of evidence isn''t to conditionalize on it, then some conditionalizing
  plan is more accurate than yours at every world, so conditionalizing is guaranteed
  to leave you more accurate than you were before. That''s why accuracy-first epistemology
  can answer both questions with one argument."


