  Question 3 (20 points):


  "Explain the accuracy-dominance argument for Probabilism. Your answer should cover:
  (a) what constraints the argument places on the measure of inaccuracy it uses, and
  why; (b) exactly what the dominance theorem establishes about a credence function
  that violates the probability axioms, and what it does not establish; (c) in what
  sense the argument is meant to be nonpragmatic, and whether that is enough to answer
