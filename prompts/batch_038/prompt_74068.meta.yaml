  Ok so contract law has always bugged me on one point. If I promise to give you my
  car for free, and you take me at my word — you sell your own car, drive across the
  country to collect it — and then I change my mind, you get nothing, because there
  was no bargained-for exchange. But if we''d run the identical promise through a
  piece of paper with a seal on it, or if you''d handed me a single dollar for it,
  the same promise is enforceable, and no court is going to ask whether a dollar is
  really what a car is worth. The doctrine even says out loud that it doesn''t measure
  adequacy. Yet in other contexts the same courts get suspicious of a "pretense" of
  a bargain and refuse to enforce it, and there''s the whole line of cases about a
  creditor promising to take a lesser sum in satisfaction of a debt and then suing
  for the rest anyway.


  What account of promising does all of that presuppose? I can see two readings and
  I can''t decide between them. One is substantive: a promise only really binds when
  it''s bought, when two wills have been joined in a trade, so a gratuitous promise
  is a different and lesser moral thing, not a promise proper. The other is procedural
  and kind of deflationary: the dollar and the seal aren''t about obligation at all,
  they''re a cautionary ritual and a piece of evidence, a way of screening out things
  courts shouldn''t have to referee. Work out which one the doctrine actually requires,
  as opposed to which one it merely sits comfortably with — I suspect it''s underdetermined
  and a bunch of quite different theories of why promises bind would all license the
  same rule. Then say whether the procedural reading has to admit something the substantive
  one doesn''t, namely that the law doesn''t deny that gratuitous promises are morally
  binding, it just refuses to be the institution that enforces them, and what that
  does to the idea that contract law is enforcing morality.


  And then the awkward bit: reliance. American courts will enforce a no-consideration
  promise if you reasonably relied on it and got hurt, which looks like the bargain
  theory losing to something else entirely. English courts have something similar
  but insist it''s only a shield and never a sword — you can''t use it to start a
  claim, only to defend one. Does the reliance exception repair the bargain theory
  or replace it? Can a system coherently run both, or does one of them have to give
  way in the hard cases? And finally, sketch what the law would have to look like
  if it were built from scratch on the view that a promise binds because the promisee
  is entitled to expect performance, rather than because a price was paid — what would
  it enforce, what would it stop enforcing, and which current rules would look obviously
  wrong on that view?


