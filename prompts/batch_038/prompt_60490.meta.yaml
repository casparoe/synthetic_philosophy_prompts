  rational to believe each of p1, ..., pn while being irrational to believe their
  conjunction. I regard this as a piece of arithmetic about thresholds rather than
  a puzzle in need of dissolution.

  (c) I do, however, accept closure under known single-premise entailment: if I rationally
  believe p and know that p entails q, I may rationally believe q.

  (d) I reject pragmatic encroachment: what I know and what I may rationally believe
  are insensitive to how much turns on the matter.

