  we find the knowledge argument compelling, why we think we have rich phenomenology
  / ineffability, why we report that consciousness is a mystery.

  - It''s a "problem" for everyone: physicalists, dualists, illusionists, panpsychists.
  It''s not a problem only for non-naturalists.

  - Solving the meta-problem would not, by itself, solve the hard problem; but it
  would put us in a much better position — it might undermine confidence in the data
  (the intuitions), or explain them in a way that leaves the hard problem intact.

  - Chalmers is careful: he thinks the meta-problem is neutral between the hard problem
  being genuine and being illusory; if we could explain all the reports fully in third-person
  functional/neural terms without invoking phenomenal properties, that would be evidence
  for illusionism (or would reduce the need for the hard problem) — he says a complete
  solution would put pressure on the hard problem, "if we could explain all the problem
  reports without appealing to consciousness, that would give us reason to think the
  hard problem is an illusion." But he also argues there''s a "structural mismatch"
  worry.

  - He distinguishes different targets: the intuition of an explanatory gap, the zombie
  intuition, reports of vivid/ineffable phenomenology, the intuition that we''re not
  zombies, etc.

  - He notes some of these are "easy problems" adjacent: explaining reports/discriminations.

  - He mentions that the meta-problem is not the same as the "problem of the psychophysical
  laws" — no wait, that''s different.

  - He says the meta-problem is "the problem of explaining our problem reports about
  consciousness." And he discusses that some have said it''s not a real problem (e.g.,
  "just explain the reports").

  - He distinguishes between explaining the "intuitions" vs explaining "beliefs" vs
  explaining "reports."

  - He considers that a "deflationary" solution (explaining reports without phenomenal
  properties) is not by itself a refutation; but the "explanatory gap" would be less
  compelling.

  - Chalmers holds the meta-problem is a substantive scientific/philosophical research
  program: identify the mechanisms (attention, global workspace, memory, introspective
  confidence, cognitive dissonance) that generate the reports.

  - He also emphasizes the meta-problem matters for the "explanatory gap" and for
  whether our introspective beliefs are reliable — connects to introspective unreliability
  literature (Schwitzgebel).


