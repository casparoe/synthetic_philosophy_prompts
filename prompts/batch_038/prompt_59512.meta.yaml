  Williamson''s anti-luminosity argument: Suppose a fact p is luminous: whenever p
  obtains, one is in a position to know p. Take a series of cases α0...αn where p
  goes from obtaining to not obtaining (e.g., feeling cold). Luminosity + the safety/anti-luck
  condition (if you know p in αi then p in αi+1 — margin for error) yields p in all
  cases by induction, contradiction.


  Key premises: (1) Luminosity of p; (2) The margin-for-error principle: for each
  i, if in αi you know p, then p obtains in αi+1 — this comes from safety, which requires
  that in nearby worlds where you form the same belief, it''s true. The step depends
  on the fact that your discriminating powers can''t be perfect across nearby cases.


  So a thought experiment to spec could be: build a case where an agent has a *sharp,
  self-announcing* fact — a fact whose obtaining is itself the very state you''d need
  to be in to know it — so that luminosity holds without violating safety. Classic
  candidates: "I am in pain" / "it seems to me that..." — but Williamson argues even
  phenomenal seemings aren''t luminous due to vagueness/margin. But there''s a candidate:
  a *binary, non-gradable* fact, e.g., "I am currently awake" or "I exist" or "I am
  now thinking about X"? The margin-for-error premise needs gradual change; if the
  fact flips discontinuously with no adjacent borderline cases, the induction fails.
  So spec: construct a case where a fact is luminous because the series of cases has
  no adjacent pairs where your powers of discrimination are exercised — e.g., a fact
  that can only obtain at a single instant, or where transitions are separated by
  huge gaps, or where the agent''s method of forming the belief is *the same process
  that constitutes the fact*.


