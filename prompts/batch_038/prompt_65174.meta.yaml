  I should explain at the outset that I have no academic training of any kind. I work
  the night shift at a freight yard and have, over about fifteen years, built up a
  habit of reading and thinking on my own, badly and without anyone to correct me.
  What follows is a question I have not been able to settle for myself, and I have
  tried to put it as precisely as I can.


  Twice in my life I have held something with total confidence and later come to regard
  it as nonsense: once about politics, when I was twenty-two, and once about my own
  marriage, when I was thirty-four. That has left me with the uncomfortable sense
  that I am, at this moment, confidently wrong about something, and no way to tell
  what. In the course of reading around this I came upon a principle credited to the
  philosopher Bas van Fraassen, generally called Reflection. My understanding of it,
  which you should correct if it is mistaken, is roughly this: if I am certain that
  at some later date my confidence in a claim will be, say, seven-tenths, then it
  ought already to be seven-tenths now; to believe otherwise is to think that I am
  going to change my mind without learning anything, which cannot be rational. I have
  also seen it stated more loosely, as the requirement that my present confidence
  must fall somewhere within the span of the confidences I expect I might later come
  to have. I am not sure whether these two versions agree, and part of what I want
  from you is which of them a person in my position should actually be using.


  My own rule of thumb, arrived at by myself, is this: defer to my future self when
  the change in my mind will come from finding things out; refuse to defer when it
  will come from something being done to me. I want you to test that rule rather than
  accept it.


  Here are eight situations, all of them either live for me or close enough to live
  that I can judge them honestly. For each, I expect that at some specified later
  time I will hold a certain confidence, and I want to know how much that expectation
  should constrain me now.


  1. Whether a local official now widely admired will be regarded as having been corrupt.
  In five years I expect to have read a great deal more of the record, and to be far
  more confident that he was.

  2. Whether the small hauling business I have put my savings into is sound. In two
  years I expect to be much more confident that it was the right decision, having
  by then sunk still more money into it.

  3. Whether raising a child is worth what it costs. In three years I expect to be
  a father and to be certain that it is; at present I doubt it.

  4. Whether the indignation I currently feel about my employer is justified. I am
  about to begin a medication that I am confident will make me a good deal less angry,
  and I expect that in a year I will disapprove of positions I now hold, because of
  the medication and not because of anything I will have learned.

  5. Whether my mother''s account of what happened in our family in 1978 is accurate.
  In ten years she will be dead, and I expect that I will then believe her, chiefly
  because I will no longer be able to ask anyone else and because I will not wish
  to think badly of her.

  6. Whether a book I am reading now will seem to me, in five years, to have mattered.
  I expect it will not, but I also expect to have forgotten almost all of it by then.

  7. Whether the religious community I left at thirty is right about salvation. If
  I were to go back among them, I am confident I would within two years believe as
  they do; I attribute that entirely to belonging and not to argument.

  8. Whether I will regret the decision I am about to make. At seventy I expect to
  be confident that I do not regret it — but I expect that confidence to rest partly
  on having lived with it for twenty years.


  What I would like from you, in this order:


  First, a bare list of eight numbers between 0 and 1, one per case, giving the weight
  you think my expected future confidence should carry against my present confidence
  — 1 meaning I should simply adopt it now, 0 meaning I should discount it entirely.
  I want the numbers before any argument, so that I can see where you land without
  having to dig.


  Second, the eight cases ranked from most binding to least, with a single sentence
  of justification each, and with ties allowed and marked.


  Third, a verdict on my rule of thumb: for which of the eight does it give the same
  answer you gave, and for which does it not? Where it fails, say what the better
  dividing line is.


  Fourth, and this is the part I find hardest to put: there seems to be a difference
  between expecting that I will believe something and expecting that I will be right
  to believe it. Reflection, as I understand it, speaks only of the first. Tell me
  whether that distinction does the work I want it to do, or whether it collapses,
  and if it collapses, say what is left to distinguish case 1 from case 5.


  Finally, if any of the eight is a case where the question simply has no determinate
  answer — where there is no such thing as the confidence I expect to have — say so
  and explain why, rather than assigning it a number for the sake of neatness.


