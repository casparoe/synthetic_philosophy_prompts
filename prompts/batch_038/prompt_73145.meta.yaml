  The thought experiment spec. Let''s craft it well: the case should be engineered
  so that specified accounts deliver specified verdicts, with an isolated variable,
  under constraints, plus the honest notes.


  Core design idea: Two accounts of letter-category membership:


  Account 1 (resemblance-based / prototype-family-resemblance): a mark is an ''a''
  to the extent it resembles the ''a''s a reader knows, either through a best example
  or through overlapping similarities. Nothing about history matters.


  Account 2 (style-coherence account, the Letter Spirit-ish one): what makes a letterform
  that letter is not a set of features it carries on its own, but the way it hangs
  together with the rest of an alphabet in a coherent style; a letter is legible as
  an ''a'' partly because its siblings make the deviations systematic. On this view,
  a lone glyph can be an ''a'' in isolation and yet fail inside a typeface, or fail
  alone and succeed inside the family.


  Account 3 (lineage/history): a mark is an ''a'' only if it descends from a tradition
  of ''a''s — a genealogical account like artifact kinds.


  A really nice, hard-to-regurgitate spec: design a single scenario containing two
  marks that are indistinguishable in isolation — literally the same shape, same stroke
  weight, same size — but embedded in two different alphabets, such that:

  - the resemblance account says both are equally ''a''s (it cannot see a difference,
  because the shapes are identical);

  - the style-coherence account says one is an ''a'' and the other is not, because
  in one alphabet the shape''s deviations are continuous with its siblings and in
  the other they clash.


  That''s a clean "isolated variable" design: the shape is held fixed; only its alphabet-mates
  vary. And the resemblance account must be shown to be *blind* to the difference
  (that''s the philosophical punch), not merely to disagree.


  But wait: can two identical shapes be differently legible depending on their siblings?
  Yes — this is a real typographic phenomenon: e.g., a single-story ''a'' in a blackletter
  face reads as an ''a'' because the whole face is blackletter, whereas the same single-story
  ''a'' dropped into a geometric sans (Futura-like) family might read as an ''ɑ''
  or as a foreign/alien shape, or read as a mistake. Better example: a shape that
  in one family reads as a stylized ''a'' and in another reads as a badly-drawn ''o''
  or a ''d''. Consider a two-story ''a'' whose bowl is nearly a closed circle: inside
  a family of very open forms it may read as an ''o'' with a stem; inside a family
  of closed forms it reads as ''a''. Hmm, that''s the "context shifts the category
  boundary" phenomenon — good.


  Even better and more concrete: contextual assimilation. A glyph that, in isolation,
  is a fine ''a''; but placed inside an alphabet where the ''o'', ''e'', ''c'', ''g''
  all share the same closed-bowl geometry, becomes indistinguishable from the ''o''
  — the reader mis-sorts it. So the resemblance account (comparing the glyph to the
  reader''s memory of generic ''a''s) says "yes, an a"; the style-coherence account
  says "no — inside this alphabet it fails to be an ''a'' because the alphabet has
  eroded the contrast that makes it one." Meanwhile, a second, deliberately ugly glyph
  — the same shape? no...


  Hmm, careful: the spec says the two marks are identical in shape. If they''re literally
  identical shapes, then the only difference is the surrounding alphabet. The resemblance
  account (which compares the mark to the reader''s stored ''a'' prototypes) cannot
  see the difference — unless the resemblance account is allowed to be "local" (compare
  to the neighboring letters in the same face). So there''s a subtlety: a sophisticated
  resemblance theorist could say "resemblance to *this font''s* other letters." That''s
  exactly the sort of "how does the losing theory attack the case?" material I want
  — great, I should ask for it.


  So the design: one glyph, two alphabets. Constraint: the glyph must be describable
  in words precisely enough that the reader can picture it (no images), and the two
  contexts must differ only in the other letters, not in size, stroke, spacing, or
  viewer. And the verdicts must be generated: the isolated mark is a perfectly good
  ''a'' (readers in a test would call it ''a'' when shown alone), but inside alphabet
  X it gets systematically misread as the X-alphabet''s ''o'' (or fails to be legible),
  while inside alphabet Y it reads as ''a''. And the resemblance/prototype account,
  applied to the mark alone, gives the same verdict in both cases, hence is blind
  to the difference; the style-coherence account (a letter''s identity is carried
  by its relations to its siblings — the alphabet as a whole is the unit of style)
  predicts the difference.


