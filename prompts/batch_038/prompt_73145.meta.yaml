  1. The scenario, in one or two paragraphs, with the glyph and both alphabets described
  concretely enough to be pictured without a drawing.

  2. A demonstration that the specs are met: what the resemblance/prototype account
  says (and why it can''t distinguish the two cases), what the style-coherence account
  says, and the verdict of a third account if useful (a lineage/history account or
  a feature-list/definitional account).

  3. Which feature of the case does the work — identify it precisely.

  4. What happens if you remove or weaken that feature — does the case collapse into
  something trivial (e.g., the glyph just becomes ambiguous in both contexts)?

  5. How the resemblance theorist would attack: e.g., by insisting resemblance is
  always to a local, style-relative standard, or by saying the misreading is performance
