  That''s a rich, concrete, philosophically loaded practice. What does it presuppose?


  - That defence is a debt owed by the body, not by the person as such — the exemption
  tax is a *commutation* of personal service into money, which presupposes a quasi-feudal/quasi-contractual
  account: obligations of citizenship can be discharged in kind or in cash at the
  state''s conversion rate, and the cash price is not meant to be a market price (it''s
  deliberately not a "buy-out" at a price that would clear; it''s a badge of non-participation).

  - That the burden is gendered because the good secured (collective armed self-defence)
  is tied to a conception of citizenship in which the citizen-soldier is male — and
  yet the constitution says otherwise. So either the practice presupposes a substantive
  (non-voluntarist) account of sexual difference in relation to violence and protection,
  or it is simply inconsistent, or it presupposes that Art. 8(3) equality is about
  equal *opportunity/rights to* participate rather than equal *liability to burdens*
  — i.e., equality as non-exclusion from offices and benefits, not as parity of impositions.
  That''s the sharp philosophical point: the practice presupposes an account of equality
  as a shield against exclusion, not as a rule for distributing burdens. If equality
  were understood as parity of burdens, the Swiss arrangement would be a paradigm
  violation; under the shield reading, it''s fine, because women are not excluded
  from volunteering (since 1995, women can volunteer; since 2004 they can serve in
  all functions including combat).

  - The exemption tax presupposes that the state may price a citizen''s non-participation,
  and that the price can be levied on those *unable* to serve (the unfit) — which
  shows the tax is not really about compensation for a benefit received, but about
  the status of being liable at all. This is philosophically interesting: it presupposes
  that the obligation is not a "duty to act" but a "liability of the person" — you
  owe the state your body, and if the body cannot pay, the purse must. That''s a view
  of the political relation closer to a status-order than to a liberal contract.

  - Contrast with the practice of "armed neutrality": the militia principle is entrenched
  in the constitution ("in principle organised as a militia"), which presupposes that
  the *form* of the military organisation is a matter of constitutional importance,
  not of policy — i.e., that a professional army would be a different kind of state.
  That presupposes something like Rousseau''s/Machiavelli''s claim that standing armies
  are incompatible with liberty, and that the citizen who delegates defence to specialists
  loses the capacity for self-government. What rival views does it rule out? A purely
  instrumental view of defence (efficiency, comparative advantage, professional competence),
  and a Hobbesian view in which the sovereign''s monopoly of force is best exercised
  by professionals precisely so that citizens need not be armed.

  - Also the practice of keeping the service weapon at home presupposes trust in the
  citizen and a denial of a sharp line between civilian and military spheres, and
  a view that the household is a legitimate site of public force.


