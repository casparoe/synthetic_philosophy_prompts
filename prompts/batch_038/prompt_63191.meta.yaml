  and hardship that civilian service does not. But then: if military service is more
  burdensome, why is the alternative *longer*? That is, the practice presupposes a
  commensurability claim — that days of civilian service can be traded against risk
  of death and loss of liberty in military service at some official exchange rate
  — and that the exchange rate is set administratively, by statute, at a level designed
  to ensure that only sincere objectors will accept it. That''s a *screening* device,
  and screening devices presuppose a whole epistemology about inner states: the state
  cannot see conscience, so it prices the exit such that only the genuinely conscientious
  will pay. That is a beautiful philosophical point: the practice presupposes that
  sincerity is revealed by willingness to bear a cost, i.e., a revealed-preference
  epistemology of conscience, and simultaneously that the cost must be *punitive-ish*
  (a "sacrifice") to preserve the fairness of the system for those who serve.


