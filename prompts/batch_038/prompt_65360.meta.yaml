  2. I think ad hocness is a matter of degree, judged by whether the auxiliary hypothesis
  has independent testable content.

  3. I think a programme can be rationally abandoned before its refutation — but I
  also hold that no experimentum crucis is decisive and the MSRP never forbids continuing.

  4. I think appraisal is retrospective: a degenerating programme might be revived
