  Let me consider "Middlemarch" for George Eliot''s views on religion. Middlemarch''s
  plot is somewhat common knowledge among literary types. Casaubon, Dorothea, Farebrother,
  Bulstrode. George Eliot''s religion: she translated Strauss''s Life of Jesus and
  Feuerbach''s Essence of Christianity; she stopped attending church, was estranged
  from her father, but insisted on the value of religion''s moral function, "God as
  the ideal of moral goodness", humanistic religion. In Middlemarch there''s the contrast
  between Farebrother (the genial, worldy vicar who plays whist for money), Bulstrode
  (the evangelical banker whose piety is corrupt), Camden (no), Mr. Casaubon (dead
  religion, the "Key to all Mythologies"), and Dorothea''s religious yearning without
  doctrine. Also the famous "St. Teresa" preface. And the epilogue about "unhistoric
  acts."


  A really interesting and "in the weeds" prompt: read Middlemarch against Feuerbach.
  Eliot translated Feuerbach''s The Essence of Christianity (1854) — that''s verifiable
  and I know it well. Feuerbach''s projection theory: God is the projection of human
  species-essence; theology is anthropology; religion is the alienation of our own
  essence. Then: does Middlemarch enact Feuerbachian translation — turning religious
  energy into human moral energy (Dorothea) — or does it resist it? And the specific
  weediness: Eliot''s own later ambivalence, the fact that in Middlemarch the characters
  who successfully "de-theologize" (Casaubon''s Key to all Mythologies is a mythological
  compendium — a Feuerbachian project of explaining religion!) — Casaubon is literally
  doing comparative mythology, i.e., the scholarly reduction of religion to myth,
  and it''s a dead end, a sterile failure. That''s a beautiful tension: Eliot the
  translator of Feuerbach/Strauss writes a character whose Feuerbachian-Straussian
  scholarly project is portrayed as worthless, while faith-like devotion (Dorothea''s)
  retains a redemptive force. And Bulstrode: Eliot refuses to satirize him outright
  — she says something like "I do not mean to say he was a hypocrite in the vulgar
  sense"; she treats him with psychological complexity, arguing that the religious
  form is not simply dispensable.


