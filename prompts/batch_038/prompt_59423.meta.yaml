  Actually — better idea for injecting a genuinely niche/new idea: bring in the contemporary
  aesthetic-testimony debate in a specific form. Key positions:

  - The Acquaintance Principle (Wollheim): aesthetic judgments must be based on first-hand
  experience of the object; testimony can''t ground them.

  - Hopkins (2011?), "How to Form Aesthetic Judgement" — argues testimony can transmit
  reasons but the acquaintance principle survives in a modified form; he distinguishes
  "aesthetic testimony" from "testimony about the aesthetic."

  - The "deference" asymmetry: you can trust your friend about whether a film is good
  in a way that seems epistemically legitimate for practical purposes (deciding what
  to watch), but it seems to fail for making the judgment itself.

  - Robson & Meskin on testimony about artworks we can''t access.

  - The "beauty is not a matter of testimony" commonplace, and the Humean wine-taster
  analogy: the good critic''s discernment is validated retroactively by the discovery
  of the key and the leather thong in the hogshead. In aesthetic terms: is there anything
  analogous to the key at the bottom of the barrel — a check that settles disputes
  among critics? Dorian''s case: Henry''s testimony is never checked; the portrait
  is a check that nobody else can see (only Dorian, and Basil once, and Basil is murdered).
  The portrait is the only objective, publicly-verifiable... no, actually it''s private.
  Interesting: the portrait functions as the "key in the hogshead" — the hidden evidence
  that finally confirms the testimony was true (Dorian''s corruption was real, though
  he could hide it). Hmm! That''s a nice injected insight: the novel stages a verification
  problem, and the portrait is a private, non-transferable index of the truth about
  Dorian''s soul — the one thing that can''t be testified to, and the one thing whose
  testimony (Basil''s) Dorian refuses.


  Also: Basil''s portrait is testimony about Dorian that Dorian rejects. Basil says
  the portrait contains his own secret — "it is the visible emblem of conscience"
  ... Basil offers testimony: I have painted you as you really are. Dorian rejects
  the testimony of the painting (a non-propositional testimony!) in favor of Henry''s
  verbal testimony. That''s a lovely structure: two competing testimonies — one verbal,
  seductive, unverifiable, and one visual, verifiable by inspection, hideous, and
  rejected. And the whole novel asks: which testimony about a person''s aesthetic/moral
  worth can be trusted, and can the trust be transferred?


  Also the Sybil Vane episode: Sybil says her acting was real but bad because she
  now knows real love; Dorian judges by the performance alone. Henry counsels that
  Dorian should treat it aesthetically. Sybil''s death is reported to Dorian by Henry
  — secondhand testimony about a death! And Henry immediately reframes it aesthetically
  ("she died as great tragic figures die... it was an artistic ending"), and Dorian
  accepts the reframing, saying he feels like watching a Greek tragedy. That is testimony
  doing terrible moral work: testimony converts a real death into an aesthetic object.
  That''s the darkest point in the novel and the sharpest one for the aesthetic testimony
  lens: testimony here doesn''t just fail to transmit appreciation; it successfully
  transmits a distorted one. And Henry is the unreliable testifier whose charm is
  the whole reason to doubt him.


