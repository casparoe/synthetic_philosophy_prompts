  In three weeks I am giving the closing talk at a one-day interdisciplinary workshop
  on probability and self-locating belief, and I want a proper Q&A prep sheet rather
  than a defense of my view. My thesis is that the self-sampling assumption, restricted
  to the maximally specific reference class of observer-moments subjectively indistinguishable
  from one''s own, should be preferred to the Dieks-style self-indication assumption;
  and further, that SIA''s supposed advantage — immunity to reference-class choice
  — can be recovered inside SSA by always taking that maximally specific class, so
  one keeps the anti-presumptuous-philosopher result without paying SIA''s costs.
  My argument has three moves. First, SIA treats the bare fact of there being observers
  at all as though it were evidence one might have lacked, and it thereby licenses
  a principle of indifference over merely possible observers that no Bayesian norm
  supports; the presumptuous philosopher result is not an embarrassing consequence
  of SIA but a symptom of that deeper confusion, since it makes the relative confirmation
  of two empirically equivalent theories depend on a number that can be inflated without
