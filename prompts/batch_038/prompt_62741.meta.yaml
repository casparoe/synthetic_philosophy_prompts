  hours, we request of each member, and how the ask varies between members with different
  capacities. The committee meets once, in the evening, for about three hours, and
  in November the whole membership votes on the ask. The stakes run in both directions:
  if we ask too little, we turn people away in January; if we ask too much, our reliable
  people quit and the network collapses within two seasons, which is worse than turning
  people away.


  The philosophy I have read on how much morality can demand of a person — the fair-share
  idea that what I owe is what I would owe if everyone did their part; the argument
  that a person is permitted to give substantial weight to her own projects and relationships;
  the objection that a theory which requires you to abandon your ground projects has
  misunderstood what makes a life go well; the category of the supererogatory — is
  written for the individual deciding what to give, and I cannot find anything written
  for the body that decides what to *ask*. That is the translation I need.


  Please write a procedure our three-person committee can actually run in one evening,
  in plain language, without consulting any sources. It should:


  1. Take as inputs the facts we can gather in September (the number of beds we have
  committed to, the number of members, the distribution of member capacities and constraints,
  last year''s actual compliance, the number of members who left after last year''s
  ask) and produce, as outputs, a standing ask per member, a differentiated ask where
  differentiation is justified, and a stated maximum ask above which the committee
  should cut the program instead.

  2. Say what to do about non-compliance. Our fair share calculated on the assumption
  that all 420 members participate is about one overnight shift a year; calculated
  on the 61 who actually show up, it is seven. The procedure should be explicit about
  whether the ask is set against full compliance or against actual compliance, and
  it should give us the reasoning we can state aloud in November either way.

  3. Handle capacity. One of our members is a nurse; she can cover a medical-need
  shift that no one else can, and every extra shift she takes relieves someone. Say
  how the procedure treats a person whose usefulness makes her more valuable per hour,
  and be honest about whether that amounts to penalizing competence.

  4. Handle the member who cannot. We have a member who cares full-time for an adult
  son with a severe disability and can offer about two hours a month. Say whether
  the procedure records her as meeting her share, below it, or outside the scheme
  entirely, and what that record is for.

  5. Distinguish demanding from expecting. Where the committee concludes that a member
  morally ought to do more than we are prepared to request, say what we are supposed
  to do with that conclusion — publish it, hold it privately, or drop it.

  6. Give us a reply to the member who answers the ask with the objection that it
  is supererogatory — that we are requesting something morality does not require and
  that saying so ends the conversation. Either the procedure absorbs the objection
  or it concedes; say which and why.

  7. Mark every step that is a value judgment wearing procedural clothes — the points
  where we are choosing, not calculating — and mark separately the points where the
  procedure runs out and the committee simply has to decide.


