  Draft:


  ---

  I work in the strategy office of a mid-sized teaching hospital group, and over the
  last two years I''ve been reading management and evaluation literature in the evenings
  to make sense of something we did that I can''t find a word for.


  Background: we used to run a single headline number — say, median time from referral
  to first appointment — and it was gamed exactly as you''d expect. Clinics started
  recording the referral date later, splitting pathways, counting telephone triage
  as an appointment. Everyone knew the pattern; I''ve read enough about Goodhart''s
  law and about Campbell''s warning that the more a quantitative indicator is used
  for decisions the more it corrupts the process it measures, and I take both to heart.
  So the response, which came from above and which I helped draft, was to retire the
  single number and replace it with a broad, multi-criteria assessment: eleven domains,
  each scored one to five by a panel that includes the clinicians being assessed,
  with narrative justifications, and weights that the panel may adjust "to reflect
  local priorities". No single criterion is gameable, because no single criterion
  decides anything.


  And then something happened that I don''t think is Goodhart''s law, and I don''t
  think it''s Campbell''s law either, and I can''t find a name for it. Every unit
  scored well. The distribution of scores compressed into the top two bands within
  a year. A panel that found something genuinely bad would, in the same meeting, adjust
  the weighting, or reinterpret what the criterion had meant, or add a narrative caveat,
  and the aggregate would come out acceptable; nobody was doing anything dishonest,
  and each adjustment was individually defensible. The median referral time got worse
  by about twenty per cent. But the thing that strikes me as the distinctive failure
  isn''t that the numbers diverged from the underlying reality — it''s that the assessment
  lost the capacity to come out badly. There was no result the panel could have observed
  that the scoring procedure would have recorded as failure. It stopped being a measurement
  in the sense that constrains you, and became a way of describing whatever had happened
  as satisfactory after the fact. Two more instances, both small. A university I consulted
  for replaced a research-output count with a portfolio review across six headings
  with flexible weightings, and within three cycles no department had ever been below
  the institutional average, which is arithmetically odd but was never remarked on.
  And a software company I know moved from "bugs closed" to a quarterly "engineering
  health" rubric with a dozen sub-scores judged by the team leads themselves; releases
  got slower, the rubric scores went up, and when someone proposed a hard deadline
  metric the reply was that the rubric already captured delivery and the weights would
  be revisited next quarter.


  So: does this have an established name? ...


