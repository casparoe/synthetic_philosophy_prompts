  Hmm, let me think about what yields the richest residue. Pascal''s core claims:


  1. Justice is nothing but established custom; there is no natural justice accessible
  to us post-Fall.

  2. Force alone secures obedience; justice without force is impotent.

  3. Since we cannot make the just strong, we have made the strong just.

  4. Obedience is owed not because the ruler is right but because he is the ruler
  — the "reason of effects": it''s right that we obey, because the reason of effects
  is that we must obey superiors; but the deeper truth (that this is arbitrary and
  founded on force) must be hidden, because revealing it causes disorder.

  5. Distinction of ranks/titles: the great are not naturally superior; the third
  discourse to the young nobleman — treat the great with outward deference but withhold
  inward assent, because their elevation is an accident of custom, not of nature.
  Also: don''t demand their inner esteem.

  6. Imagination is what makes magistrates, doctors, professors commanding — robes,
  ermine, Latin. The paraphernalia of force.

  7. Tyranny: wanting to be loved for what one has power by — "tyranny is the desire
  of universal domination beyond one''s title."


