  Spinoza''s views on democracy:

  - Right = power (potentia); each individual has as much right as he has power; in
  the state of nature there''s no sin, no justice/injustice, no property.

  - The social contract in Spinoza is not a one-time transfer with a lasting obligation:
  it holds only as long as it is useful; the sovereign''s right is coextensive with
  its power, and thus the sovereign cannot really alienate power. "No one can transfer
  his right to another so as to make himself a mere subject, unless he is deceived"
  — roughly. Actually TTP ch.16/17: the individual retains so much of his natural
  right that he cannot be wholly subjected.

  - Democracy: the most natural form of government, and the one most consonant with
  the freedom nature gives everyone, because in it no one transfers his right to another
  so absolutely that he is not consulted; all transfer their right to the whole body
  of which they are a part. (TTP ch. 16 / ch. 20). Also TP ch. 11 defines democracy
  by the multitude holding power collectively, and criteria for who is a member (exclusion
  of women, servants, minors, foreigners — grounded on empirical/experiential claims
  about women).

  - Freedom = acting from one''s own nature/adequate ideas, not merely absence of
  restraint; obedience in a free state; the purpose of the state is freedom (libertas),
  i.e., security and the free use of reason.

  - The state should not try to control minds; it can''t. Censorship fails; attempts
  to command belief produce hypocrisy and indignation, and destabilize the state.
  Ch. 20: "in a free state every man may think what he likes and say what he thinks."

  - Spinoza''s psychology: affects, conatus, indignation (indignatio) toward those
  who harm the common good, fear as the basis of unstable rule. A sovereign ruling
  by fear alone is weaker.

  - The multitude (multitudo) vs the people — democracy is rule of the multitude as
  one body; the TP''s unfinished ch. 11.

  - Absolute vs. well-instituted state; the "absolute" power of the sovereign is limited
  in practice by the affects of the multitude.

  - Also: Spinoza''s institutional design in TP — patrician aristocracy with councils,
  lots, salaried officials, no hereditary nobility, large assemblies to avoid capture.


