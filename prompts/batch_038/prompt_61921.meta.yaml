  \ → permissible. So verdict prediction depends: if she runs R3 she says forbidden;\
  \ if R1/R2/R4 she says permissible.\n\nBut is that too close to Kant's own drunkenness/drug\
  \ examples? Kant does list intoxication and gluttony as violations of duties to\
  \ oneself (vice of \"stupefaction\" — in the Metaphysics of Morals, self-stupefaction\
