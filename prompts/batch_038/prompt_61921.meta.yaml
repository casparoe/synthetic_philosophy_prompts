  \ R5 ✓.\nCase F: Something where R4 and R1 diverge but she ruled a particular way...\
  \ e.g., \"A maxim whose universalization wouldn't undercut anything and which involves\
  \ no other person, but which the agent admits she would hate everyone else to act\
  \ on toward her.\" Hmm.\n\nActually, here's a nice one to include: Case F — hoarding/price-setting:\
  \ \"When a shortage is announced, I will buy up far more than I need, expecting\
  \ the price to rise.\" Verdict: forbidden? R1: universal adoption destroys the market's\
