  \ a new \"duty to self\" case. Hmm. But maybe that's fine: keep (4) out and make\
  \ the new case a duty-to-self case.\n\nLet me think about what makes a *rich* new\
  \ case. The new case should:\n- Be one where at least two surviving rules diverge.\n\
  - Allow \"closest analog\" reasoning.\n- Allow an honest statement of which principle\
  \ would be adopted either way.\n\nActually the type says: \"the work is in identifying\
  \ the candidate rules, saying what each predicts about the new case, giving a best\
  \ guess with the reasons for preferring it, and naming the further case that would\
  \ tell the rules apart.\" Good.\n\nSo the new case: something like a maxim of \"\
  rational agency self-degradation\" or \"never donating\" or a mixed one. Let me\
