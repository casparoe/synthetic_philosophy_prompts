  \ R4 says permissible, R1/R2 say permissible. And it's the classic \"does Kant's\
  \ CW test get too much / is the FH test silent on non-assistance\" issue. Good.\n\
  \nBut wait — for the track record to be jointly consistent with R1, R2, R3, R4,\
  \ R5, we need cases where all agree. If Dana's track record includes the beneficence\
  \ maxim (Kant's own example) with verdict \"forbidden,\" then R1/R2/R4 are eliminated\
  \ immediately. So exclude it, and use the new case as either the donation case or\
  \ the drug/dulling case.\n\nHmm, but actually a subtlety: a good prompt of this\
  \ type makes the track record include some case that seems to eliminate a rule but\
  \ doesn't quite, or includes verdicts with reasoning glosses that are ambiguous.\
  \ Let's design the track record so that each rule survives, with one or two cases\
  \ creating tension.\n\nTrack record idea (a philosopher named \"Miriam\" who runs\
  \ a Kant seminar / or a colleague prepping a paper). Let's make it: my dissertation\
  \ committee member? Or: \"I'm auditing a Kant seminar; the instructor, Professor\
  \ X, has given verdicts...\"\n\nVerdicts:\n1. A car dealer who rolls back odometers:\
  \ forbidden. (All rules: deception → uses buyer merely as means; universal adoption\
  \ destroys the practice of mileage reporting; practical contradiction; exception-making.)\n\
  2. A tenant who promises to pay rent on time knowing they'll default: forbidden\
  \ (false promise).\n3. A bystander who could rescue a drowning child at the cost\
  \ of ruining an expensive suit and doesn't: Hmm — that's non-beneficence-ish. Kant's\
  \ verdict: forbidden as imperfect duty? Actually rescuing a drowning child at small\
  \ cost — Kant's doctrine of imperfect duties allows latitude, but the maxims in\
  \ question are of \"never help anyone.\" A single failure to rescue isn't necessarily\
  \ a violation of an imperfect duty (Kant insists imperfect duties admit of latitude\
  \ in \"how much and for whom\"). This is a nice nuance: if the instructor says forbidden,\
  \ R4 survives? Let's not include; keep it simpler but include one case that hints\
  \ at the latitude issue.\n\nActually — including a latitude case would be great\
  \ for the divergence. Let me think about what the new case should be to make at\
  \ least two rules diverge and to make the \"closest analog\" work interesting.\n\
  \nLet me settle the structure:\n\nAsker: co-taught/auditing a Kant reading group;\
  \ the leader (call her \"Prof. Okonjo\"? better a neutral name — \"Professor Reyes\"\
  ) has been running maxims through the universal law test for a term. Verdicts so\
