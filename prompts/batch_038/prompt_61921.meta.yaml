  \ record so far (all deception/conception-level cases) doesn't discriminate — which\
  \ is exactly the point: the new case is the first one that does, and the asker wants\
  \ a prediction.\n\nHmm, but then the \"best guess\" is underdetermined and the answer\
  \ is basically \"the track record can't tell you.\" That's less satisfying. Better\
  \ design: include in the track record a couple of cases that partially discriminate,\
  \ so that some rules are strained but survive, and the new case splits the survivors.\n\
  \nLet me construct more carefully with a table.\n\nRules:\nR1 — Undercutting/free-rider:\
  \ fails iff universal adoption would destroy the institution/practice/condition\
  \ the action presupposes. (\"Can everyone act on it?\" in the sense of the practice\
