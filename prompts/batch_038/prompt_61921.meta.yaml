  \ about Russia's early warning). Hmm, but domain \"nuclear deterrence paradoxes\
  \ and brinkmanship\" with episode type: Able Archer 83 is well known enough? Maybe.\
  \ The facts might be contested.\n\nThe verdict-prediction type with Kant is strong\
  \ and injectable. Let me design it carefully.\n\nDesign: An asker reports a reading\
  \ group leader's / their Kant seminar instructor's verdicts on a set of maxims,\
  \ all classic-ish but with some invented ones. The verdicts should be jointly consistent\
  \ with multiple rules:\n\nCandidate rules for Kant's universalizability tests:\n\
  (a) Contradiction in conception (CI) vs contradiction in the will (CW) — two-step\
  \ test; the strict/contradiction-in-conception reading.\n(b) The \"practice/convention\
  \ parasitism\" rule (a maxim fails if its success depends on others not doing likewise\
  \ — free-rider / undercutting): this is essentially the CI test for \"convenience\"\
  \ maxims.\n(c) Formula of Humanity: treating others merely as means.\n(d) A rule\
  \ based on whether the agent is making an exception for himself (special pleading\
  \ / \"the agent would not consent if roles reversed\" — a contractualist reading,\
  \ e.g., Korsgaard's \"practical contradiction\" vs \"teleological contradiction\"\
  \ vs \"logical contradiction\" readings — actually Korsgaard distinguishes logical\
  \ contradiction, practical contradiction, and teleological contradiction interpretations\
  \ of the CI test!). That's a nice injection: Korsgaard's three interpretations of\
  \ how the contradiction arises. But is that too niche? Korsgaard's \"Kant's Formula\
  \ of Universal Law\" (1985) is a well-known paper; LLMs likely know it, but small\
  \ models may not. Better: I inject the readings myself by describing them in the\
  \ prompt without needing the model to know names. The prompt says: don't refer super\
  \ niche theories/ideas/facts LLMs won't have memorized. But I can inject the ideas\
  \ in the prompt itself.\n\nSo: the asker lists the track record with verdicts and\
  \ asks: predict the verdict on a new maxim; identify which rules fit the track record\
  \ equally well; say what each predicts; give a best guess with reasons; and name\
  \ the case that would discriminate.\n\nLet me build a track record where several\
  \ distinct decision procedures agree.\n\nVerdicts:\n1. Shopkeeper who charges fair\
  \ prices to keep his reputation → permissible (dutiful action done from inclination,\
  \ but conforming) — Kant says it has no moral worth but is permissible. Hmm, moral\
  \ worth vs permissibility is a different axis. Maybe use that to create ambiguity:\
  \ the judge might be conflating \"morally worthy\" with \"permissible.\"\n\nActually,\
  \ a richer design: the person's track record includes both permissibility verdicts\
  \ and worth verdicts, and the ambiguity is about which underlying rule.\n\nLet me\
  \ keep it tight. Consider a colleague (say, a fellow graduate student, \"Dana\"\
  ) who runs a Kant reading group and has issued verdicts on maxims:\n\nVerdicts:\n\
  - Maxim: \"I will make a promise I intend to break in order to get money in a pinch\"\
  \ → forbidden (classic CI).\n- Maxim: \"I will neglect my talents and idle away\
  \ my life when I could develop them\" → forbidden, but only as a violation of a\
  \ duty to oneself (CW — Kant says you could will it but not as a rational being\
  \ with the will's necessary ends).\n- Maxim: \"I will never help anyone else and\
  \ will look only after my own interests\" → forbidden (CW: you could will a world\
  \ where no one helps, but you couldn't will it since you might need help).\n- Maxim:\
  \ \"I will lie to a murderer at the door asking where my friend is\" → Kant said\
  \ forbidden; Dana says... hmm, if Dana follows Kant, she says forbidden. But maybe\
  \ Dana says permissible here because the maxim is not universalizable? That would\
  \ be a deviation.\n\nTo create underdetermination among rules, we want cases where\
  \ different rules agree. Let's think of candidate rules:\n\nR1 (free-rider/undercutting):\
  \ A maxim fails iff its universal adoption would destroy the practice or condition\
  \ the agent's action depends on for success. Classic for false promises (promising\
  \ practice collapses), also for lying generally.\nR2 (practical contradiction —\
  \ Korsgaard): A maxim fails iff, when universalized, the agent's own action would\
  \ become ineffective/impossible to achieve its end (a contradiction in the will\
  \ in the sense that the action can't work).\nR3 (contradiction in the will / necessary\
  \ ends): A maxim fails iff a rational agent couldn't consistently will the universalized\
  \ version because it frustrates ends that any rational agent necessarily wills (own\
  \ perfection, others' happiness).\nR4 (consent / mere-means): A maxim fails iff\
  \ it involves using another person in a way they couldn't possibly consent to (Korsgaard's\
  \ FH account: coercion and deception are paradigm cases).\nR5 (impartiality/exception-making):\
  \ A maxim fails iff the agent is willing a special exception for himself.\n\nNow\
  \ the track record should be verdicts that all of R1–R5 (or a subset) deliver the\
  \ same verdict on, and the new case should split them.\n\nDesign new case: A maxim\
  \ where the action is neither deceptive nor coercive (so R4 says fine), where universal\
  \ adoption wouldn't undermine the practice it relies on (R1 fine), but where the\
  \ agent is granting himself an exception based on a self-regarding description...\
  \ Hmm.\n\nGood candidates for divergence:\n- The \"talent-neglect\" case (imperfect\
  \ duty to self): R1 fails? Neglecting talents doesn't destroy a practice; universal\
