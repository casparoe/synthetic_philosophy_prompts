  \ Moore 1990 on chaotic systems predicting Turing machines) show that prediction\
  \ can be impossible in principle even for a demon; (6) I think numerical simulations\
  \ of chaotic systems are reliable for engineering (e.g., weather forecasts at 5-10\
  \ days); (7) I hold that determinism is compatible with / required for free will...\
  \ Tension: between \"determinism ⇒ predictability in principle for a demon\" and\
  \ \"computational undecidability results\" — the demon would need infinite precision,\
