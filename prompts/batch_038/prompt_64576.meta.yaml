  \ I could describe the commitment as \"there are deterministic systems whose long-run\
  \ behavior would let you solve the halting problem if you could predict it\" — that's\
  \ a description, not requiring memorization.\n\nOption B: MWI Born rule. Commitments:\
  \ (1) I'm a many-worlds Everettian; (2) I think the wave function is all there is\
  \ and the dynamics is exactly unitary; (3) I reject adding a probability postulate;\
  \ (4) I think decision-theoret arguments à la Deutsch-Wallace establish the Born\
  \ rule; (5) I think self-locating uncertainty / indexical probability (Vaidman's\
  \ sleeping pill, Sebens-Carroll) is fine; (6) I'm a frequentist-leaning about what\
  \ probability means... Tension: (a) if you reject probability postulates, then you\
  \ need to explain why \"branch counting\" is wrong — but branch counting is the\
  \ natural measure absent a preferred basis; the D-W argument presupposes a notion\
  \ of rational preference and arguably smuggling in probabilistic assumptions (equivalence\
  \ principle); (b) the \"illusion of branching\" problem: number of branches is not\
  \ well-defined; (c) the tension between self-locating uncertainty and the fact that\
  \ both successors exist with certainty — the \"incoherence problem\" (Albert/Loewer).\
  \ Also a nice tension: the Everettian who says \"there is no fact about which branch\
  \ I'll be in\" cannot get non-trivial credences without assuming a measure, and\
  \ the measure has to come from the amplitude, which is exactly what needs explaining\
  \ — circularity. And an apparent tension that dissolves: the claim that determinism\
  \ is incompatible with genuine uncertainty — dissolves once you adopt the indexical/self-locating\
  \ reading, since uncertainty is about which branch you're on, not about what will\
  \ happen; this is a standard resolution. So the apparent tension: (2) unitary determinism\
  \ vs (5) pre-measurement uncertainty. That's a good apparent tension that dissolves\
  \ on inspection. Genuine tensions: D-W decision-theoretic derivation presupposes\
  \ branch-weight non-branch-counting (equivalence principle is essentially the Born\
  \ rule in disguise — circularity), and the \"countable additivity / measure zero\"\
  \ problems.\n\nHmm. But is the MWI thing too niche for small models? The Born rule\
  \ problem is fairly well covered in LLM training. Decision-theoretic Deutsch-Wallace,\
  \ self-locating uncertainty, Sebens-Carroll, Zurek's envariance, branch counting\
