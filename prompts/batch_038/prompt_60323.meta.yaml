  The species problem + verdicts-on-cases type seems excellent: a person (say a curator,
  a conservation biologist, an invasive-species manager, or a taxonomist) gives their
  verdicts on whether various pairs of populations count as one species or two, and
  asks what principle captures them. That''s very "in the weeds" but uses well-known
  concepts (BSC, phylogenetic species concept, ring species, asexual organisms, hybrid
  zones, Ensatina, Darwin''s finches, cichlids, oaks, bacteria and lateral gene transfer,
  wolves/coyotes/dogs, polar bear × grizzly "pizzlies", Louisiana iris, European edible
  frogs (Pelophylax kl. esculentus — hybridogenetic), ring species complex, Heliconius
  butterflies, Neanderthal introgression, etc.).


  Alternatively, the species problem + diagnosis of stalled debate is also great —
  the species problem is literally a stalled debate (26+ species concepts per Mayden,
  1992-ish; Wilkins counted ~26). But the verdicts type may be fresher and more "in
  the weeds," with the model having to do reflective equilibrium work.


