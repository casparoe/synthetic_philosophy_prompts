  For eight years I have sat on the technical panel that decides which names enter
  our national inventory of protected taxa, and for most of that time I have been
  the only member who was uneasy about what we were doing. I want to know what principle,
  if any, my own votes add up to. Please do not recite the species concepts at me
  — I have read the catalogue as carefully as anyone. What I want is reflective equilibrium
  performed on my voting record: the principle or principles that my verdicts commit
  me to, stated clause by clause, and an honest account of the places where no principle
  will hold them together.


  My verdicts, with the reasons I gave the panel at the time:


  1. The ring of salamander populations around California''s Central Valley: I split.
  The two forms that meet in the south behave as separate species where they overlap,
  and the fact that a continuous chain of intergrading populations joins them the
  long way round does not, to my mind, make the endpoints one species.

  2. Polar bears and brown bears: two species, despite fertile hybrids in the wild
  and a very recent divergence.

  3. Domestic dogs and gray wolves: one species. I have never been able to articulate
  why 3 and 2 come out differently; the divergence times are of the same order.

  4. The eastern North American coyote: its own lineage, and a nameable one, even
  though it is substantially a hybrid swarm of coyote, wolf and dog ancestry. In tension
  with 3, and I know it.

  5. Bdelloid rotifers: real species, in the hundreds, delimited by morphology and
  ecology and corroborated by discrete genetic clusters — in animals with no known
  males and no meiosis, some of which appear to acquire genes from one another without
  sex.

  6. Bacteria: I refuse to say. I voted to retain Shigella as a separate genus even
  though it falls inside Escherichia coli at several independent places in the tree,
  because clinical and public-health practice requires the name; but I would not defend
  the claim that bacterial species are units of the same kind as 1 through 5.

  7. The European edible water frog: a species in its own right, even though every
  individual is a hybrid of two other frog species and discards one parental genome
  in order to transmit the other.

  8. The three hybrid sunflowers that originated from the same two parents, breed
  true, occupy habitats neither parent occupies, and are reproductively isolated from
  both without any change in chromosome number: not species, in my vote — merely stabilized
  hybrid derivatives. I now suspect 7 and 8 are backwards relative to each other,
  since the frog lineage cannot persist at all without both of its parents beside
  it and the sunflower lineages can.

  9. Two morphologically identical frog populations that never interbreed where they
  co-occur and are reciprocally monophyletic: two species. Two strikingly divergent
  colour morphs that form a single panmictic population wherever they meet: one species.

  10. A stratigraphic series of fossils in one lineage: no species boundaries may
  be drawn along it. Two fossil populations at the same horizon, separated and diagnosable:
  two species. Vertical cutting is convention; horizontal cutting is discovery.

  11. Twice I have voted inconsistently with all of the above because of consequences.
  I split a widespread amphibian so that one isolated and endangered fragment of it
  would become listable; and I voted against splitting a native duck whose remaining
  population is being absorbed by an introduced relative, on the ground that a split
  would hand our fisheries ministry an argument for managing the whole complex as
  one abundant hybrid swarm. In both cases the biology was, as far as the panel knew,
  exactly the sort of case I had decided the other way on other afternoons.


  Questions:


  (a) State the principle — or the small set of them — that delivers as many of these
  verdicts as possible. For each clause, tell me which case motivated it and what
  the clause rules out.

  (b) Is this one criterion with epicycles, or two different jobs being done by one
  word: a claim about what the units of evolution are, and a rule about what names
  we should maintain? If the latter, state the rule governing when the naming consideration
  is allowed to override the metaphysical one, and tell me whether 11 is an application
  of that rule or a betrayal of it.

  (c) Give me your verdicts, with reasons, on three cases I have not listed: an island
  population that is diagnosable but has never had the opportunity to interbreed with
  its mainland relative, so no test of reproductive isolation is available; a plant
  pair that is reciprocally monophyletic at nuclear loci but shares chloroplast haplotypes
  freely; and a fungus that is capable of sex but reproduces clonally most of the
  time in the populations we sample.

  (d) Which of my votes has to be given up? I would rather lose one or two verdicts
  than buy eleven with a disjunctive monster, so tell me the cost of each option.

  (e) Finally: is there any fact that could settle 3 against 4, or is the difference
  between them purely a matter of what I want the word to do?


