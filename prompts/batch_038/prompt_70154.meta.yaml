  the pregnancy, ending it, further diagnostic testing, palliative care planning —
  and they decline to indicate which is better. If a patient asks point-blank what
  the counselor would do in her place, the trained answer is to hand the question
  back. The norm is usually justified by appeal to the patient''s values being the
  ones that matter, not the clinician''s.


  At the same time, the program itself is evaluated in directional terms. The standard
  performance statistics reported for a screening program are its detection rate and
  its false-positive rate; a program that identifies ninety-five percent of affected
  pregnancies is a better program than one that identifies seventy percent, and this
  is how funding and quality review are discussed. I have not seen programs report,
  as a headline statistic, the proportion of patients who declined screening, or the
  proportion who later said they felt the offer was an expectation. Meanwhile the
  laboratory side of the same enterprise runs in the opposite direction from the counseling
