  A desiderata prompt in this domain: "What must an account of common knowledge of
  rationality deliver?" Requirements:

  1. Must state precisely what CKR asserts, and not covertly require that it be common
  knowledge that no one will ever make a mistake (which contradicts observing a mistake).

  2. Must explain the centipede/paradox of backward induction: at a node reached by
  a deviation, what do players believe about each other''s rationality? CKR is arguably
  self-undermining once an off-path node is reached. A theory must say whether CKR
  survives the observation of irrational play or must be revised (Reny: CKR + a deviation
  implies inconsistent beliefs; hence "rationality must be dropped somewhere").

  3. Must respect Aumann''s agreement theorem: no common-knowledge disagreement among
  Bayesian rational agents with a common prior. So must explain real, persistent disagreement
  (different priors? bounded rationality? non-common-knowledge?).

  4. Must handle the two-generals/Halpern-Moses result: common knowledge is unattainable
  over unreliable channels — yet conventions and coordination happen (Lewis). Must
  say whether CKR is an idealization, and what weaker substitute (common p-belief,
  approximate CK) does the work.

  5. Must distinguish CKR from: mutual knowledge of every finite order; common belief;
  common knowledge of the *rules*; salience.

  6. Must be able to say when CKR matters (which solution concepts depend on it: iterated
  deletion, backward induction, Nash vs. rationalizability — CKR yields rationalizability;
  common knowledge of the game and rationality + common priors + ... yields Nash per
  Aumann-Brandenburger? Actually Aumann & Brandenburger 1995: "A theory of hyper-rationality
  and games with incomplete information" and their famous result: common knowledge
  of rationality, common priors, and common knowledge of conjectures ⇒ Nash equilibrium;
  and in two-player games, common knowledge of conjectures alone ⇒ Nash).

  7. Must be consistent with the empirical fact that people fail at levels of iterated
  reasoning (p-beauty contest: level-k, cognitive hierarchy). So CKR is descriptively
  false; a theory must say what it''s for (normative? explanatory? an idealization
  with a bounded version?).

  8. Must handle the discontinuity: CKR isn''t a limit of high-order knowledge (email
  game).


  Jointly unsatisfiable subset: (a) CKR is common knowledge of *unbounded* rationality;
