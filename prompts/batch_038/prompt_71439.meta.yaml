  announcement''s content is not what matters but its publicity).

  - Must handle the continuity/discontinuity: near-common knowledge behaves wildly
  differently (Rubinstein''s email game: a chain of messages where each fails with
  small probability ε — outcomes jump discontinuously at ε = 0). Any account that
  says common knowledge is "just very high-order mutual knowledge" fails this.

  - Must respect the distinction between common knowledge and common belief / mutual
  knowledge of finite order / shared attention.

  - Must be achievable or not in realistic settings (is common knowledge an idealization
  that''s never actually attained? then how does coordination happen? — the "approximate
  common knowledge" literature, Monderer-Samet p-belief, "common p-belief").

  - Must explain the role of common priors (the common prior assumption and Aumann''s
  agreement theorem: common knowledge of rationality + common prior ⇒ no agreeing
  to disagree; so a theory of common knowledge must say something about whether common
  knowledge of rationality is ever attained).

  - Must handle "common knowledge without communication": e.g., a salient event everyone
  witnesses (a loud bang), or Lewis''s convention account where common knowledge arises
  from a shared situation.

  - Must handle the failure of common knowledge in asymmetric info settings and the
  unraveling argument (Milgrom): if disclosure is costless and voluntary, all information
  unravels to disclosure; this relies on common knowledge of rationality etc. But
  unraveling fails empirically — a theory must say which ingredient is missing.


