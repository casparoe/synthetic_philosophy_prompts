  Good''s theorem (I.J. Good, 1967): the expected value of (costless) information
  is nonnegative for an expected-utility maximizer; more precisely, for a rational
  Bayesian agent, free information has non-negative expected utility, and you should
  accept any free information. Actually the result: expected utility after receiving
  free information is at least as high as before. Key assumptions: the agent is a
  Bayesian expected utility maximizer, information is free, and the agent''s preferences/utility
  don''t change upon receiving info, and the info is "relevant" only through updating.
  Known violations:

  - Non-EU preferences: ambiguity aversion (Ellsberg) — people pay to avoid information;
  e.g., Kadane, Schervish, Seidenfeld "When looking for a resolution... " or "Statistical
  implications of finitely additive probability"; also the famous "Ellsberg urn: you''d
  rather not know the composition."

  - Self-control / dynamic inconsistency: hyperbolic discounting — knowing the outcome
  can tempt you.

  - Preference change: information can change your tastes (e.g., learning about the
  suffering in meat production changes preferences — that''s fine for EU; but cases
  where preferences change such that the earlier utility function is no longer the
  one to evaluate by).

  - "Costly" info: not just money, but attention, time, cognitive load, opportunity
  cost — Good''s theorem is about *free* information.

  - Regret/anticipation效用: knowing about a bad outcome you can''t avoid causes suffering
  (dread), i.e., information enters the utility function directly — Good''s theorem
  assumes info only matters instrumentally. That''s the big one: the theorem presupposes
  that beliefs/utility are separable from the info itself. If knowledge is a direct
  argument of the utility function (curiosity, or dread), then the theorem''s conclusion
  is trivially different.

  - Also: "value of information can be negative in games" — in strategic settings,
  having more info can hurt you (e.g., in a game where an informed player''s type
  is revealed; or the classic result that in some games information hurts; or "no-signaling"/
  the "unraveling" argument). In epistemic game theory, more information can be bad:
  e.g., in a common-value auction with more bidders informed... Hmm, there''s a classic
  result: in a two-player zero-sum game with incomplete information, the informed
  player benefits; but information can hurt in coordination settings — e.g., "electronic
  mail game" (Rubinstein) where slightly more information destroys common knowledge
  and leads to a bad equilibrium. Actually Rubinstein''s email game is a great in-the-weeds
  item: near-common-knowledge leads to a discontinuous jump in outcomes. That''s a
  case where more information (better transmission) worsens coordination. That could
  be injected.

  - Also Good''s theorem requires that the agent can commit to updating properly and
  that the decision problem is well-defined; with unbounded/undefined utilities or
  non-measurable stuff...

  - Another: the theorem assumes that you evaluate expected value using your *current*
  prior; if you''re worried your future self will be biased, then... "information
  that will be misused."


