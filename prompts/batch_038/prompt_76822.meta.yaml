  Practice description:


  "Since the 1970s the International Commission on Stratigraphy has defined the boundaries
  of the geologic time scale by a single physical location: a ''golden spike.'' A
  committee picks one section of rock, ice, or sediment somewhere on Earth, designates
  a precise horizon within it, and declares that horizon to be the lower boundary
  of a stage; the boundary of all planetary time is thus fixed at a point you can
  drive a spike into and photograph. Candidate sections are judged against standing
  criteria: a primary marker (usually the first appearance of a fossil species) corroborated
  by secondary markers, minerals that can be radiometrically dated, continuous sedimentation
  without changes in facies, adequate thickness, global correlatability, and — explicitly
  — practical accessibility: the site should be easy to reach, protected from development,
  and open to researchers of all nationalities. Proposals move up a chain of committees
  and are settled by supermajority votes. Where the record is too degraded to permit
  this — roughly, before 630 million years ago — the commission abandons points altogether
  and defines boundaries by fixed numerical ages.


  The same machinery has now spent about fifteen years on the Anthropocene. ... "


