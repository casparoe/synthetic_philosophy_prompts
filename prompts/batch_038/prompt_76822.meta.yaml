  Now the philosophical asks:

  - What view of geological time / of natural boundaries does the GSSP practice presuppose?
  Specifically: that the history of the Earth comes pre-jointed, that a boundary is
  *found* not *made*, that a moment of global time can be pinned to a place, that
  any point-in-time boundary is in principle globally synchronic and detectable.

  - Which rival views does it rule out? conventionalism/stipulation, pluralism, and
  the view that the significance of a boundary is relative to the questions asked.

  - The accessibility criterion: does the practice secretly treat a geological boundary
  as an artifact of a community''s practices — i.e., as an institutional/social fact
  in something like Searle''s sense — while presenting itself as purely descriptive?
  Is that a contradiction, or can a realist accept pragmatic constraints on *representations*
  of a mind-independent boundary?

  - The GSSA asymmetry.

  - The definitional circularity: once ratified, "the Anthropocene began in 1950"
  is true by stipulation, and the same layer is both the evidence and the definition;
  evidence for earlier human impact couldn''t falsify it. Is the practice descriptivist
  or stipulative? What would falsify a GSSP?

  - Internal consistency puzzle: the discipline insists a boundary must be a natural
  discontinuity, not chosen for salience, yet the Anthropocene''s marker is produced
  by humans — meaning the observers are the cause of the boundary, and its global
  synchrony is due to human activity, not to a natural process. Does the practice
  presuppose that the geologic record''s causes are external to the community of readers,
  i.e., that a boundary can''t be *self-inflicted*? Is there a real metaphysical objection
  here or only an aesthetic one?

  - The "too recent" objection: presupposes units must be closed, with an upper boundary;
  but the Anthropocene''s upper boundary is the future. Also presupposes that the
  timescale''s job is to carve deep time, and that the recent past belongs to history,
  not geology — a division of epistemic labor that the Anthropocene blurs.

  - What would have to change under rival views: e.g., if boundaries were treated
  as explicitly stipulative (a naming convention with a documented rationale, revisable),
  or pluralist (multiple Anthropocenes indexed to different explananda), or if the
  vote were replaced by... something else.

  - Distinguish strict presupposition from mere fit, and note underdetermination:
  the practice might be compatible with realism about natural kinds + anti-realism
  about boundaries.


