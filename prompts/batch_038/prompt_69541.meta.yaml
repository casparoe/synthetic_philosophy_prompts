  Draft:


  ---

  I write about research ethics and the life sciences for a general-interest magazine,
  and I''m trying to pin down the philosophy underneath American laboratory-animal
  oversight before I describe it in print. The practice, as I understand it: any protocol
  using a covered animal must go before an institutional oversight committee, justify
  the number of animals, show that non-animal alternatives were considered, and provide
  anesthesia and post-procedure pain relief; the committee may waive the pain relief
  when the pain is judged scientifically necessary. Euthanasia at the end of a study
  is a routine line in the protocol rather than a harm requiring its own justification.
  And the federal statute''s definition of "animal" excludes rats, mice, and birds
  bred for research, along with farm animals used in food and fiber research, so a
  laboratory dog is owed committee review, veterinary care, inspections, and annual
  public reporting while a laboratory rat owes nothing to that statute — though the
  same rat is covered by the animal-care policy that comes attached to federal grant
  money.


  Critics routinely call this a Cartesian regime, animals treated as machines. That
  seems backwards to me: Descartes held that the machine has no experience to protect,
  and this apparatus is organized almost entirely around protecting experience. So
  what does it actually presuppose? Reconstruct the implicit account of animal minds
  and of moral standing — which property does the system treat as the mark of considerability,
  and what is the moral work being done by pain rather than by death? Tell me which
  rival accounts it rules out (mechanism, a view on which an animal''s life has standing
  independent of its experiences, an interest-based view that would treat the number
  of animals as a cost in itself) and where it is underdetermined, since the exclusion
  of rodents may reflect budget and workload rather than any theory of mind at all.
  I''m especially interested in whether the system''s reliance on publicly legible
  signs of distress quietly adopts a criterion for attributing minds that is closer
  to Descartes than the critics'' rhetoric suggests — a test about what we can recognize,
  not about what is felt. Finally: what would have to change, in the paperwork and
  in the science, if the presupposed account were replaced by one on which an animal''s
  continued life, and not merely its experience, counts?

  ---


