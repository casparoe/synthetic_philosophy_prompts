  something distinctive to object to:

  - The Craig-style Molinist: says bruteness is fine because CCFs are true in virtue
  of the creature''s counterfactual character/dispositions, or simply because there''s
  no requirement that every truth have a ground (truthmaker maximalism is false);
  will deny that Molinism needs a measure — God doesn''t reason probabilistically,
  He knows each CCF individually, and feasibility is a matter of combinatorial consistency,
  not measure. Will press: your pointwise-vs-ordering distinction smuggles in a demand
  for a metric that Molinism never needed, since God''s knowledge is of each CCF separately
  and He can compute feasibility by simple consistency checking.

  - The second Molinist (more analytic, maybe a "dispositional" Molinist): will say
  CCFs are grounded in the agent''s character + circumstances, i.e., the "would" is
  a ceteris paribus claim about dispositions, so they''re not brute.

  - The open theist (Hasker-style / libertarian): will say you''ve simply re-derived
  their view — if CCFs are brute pointwise, they might as well be indeterminate; will
  object that bruteness *about free agents* is worse than bruteness about worlds because
  freedom entails there''s nothing to be true; will ask whether your view is any different
  from open theism, and whether you''re smuggling determinism back in by talking about
  measures.

  - The Calvinist compatibilist: will object to the libertarian premise entirely;
  will say if CCFs are brute and there''s a measure over them, that measure just *is*
  the deterministic/dispositional structure, so you''ve covertly given up libertarian
  freedom — you''re a compatibilist in Molinist clothing; also will say your whole
  problem dissolves on a Thomist/Báñez-style account where God knows CCFs by knowing
  His own causal decrees.

  - The Lewis-sceptic grad student / someone who thinks Lewis''s account is broken
  anyway: will say the analogy to Lewis fails because Lewis''s counterfactuals face
  the same problems ( vagueness of similarity, the problem of counterfactuals with
  impossible/never-obtaining antecedents, "miracle"-based semantics) so the Molinist''s
