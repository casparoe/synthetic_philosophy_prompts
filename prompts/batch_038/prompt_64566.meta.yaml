  Here is the package.


  1. I am a Bayesian, and I take the common prior assumption seriously rather than
  as a technical convenience: there is a single prior over the relevant state space,
  and what distinguishes agents is the evidence they condition on. Disagreement between
  two agents is therefore always, at bottom, disagreement about evidence or about
  how it was processed.


  2. I accept the no-trade result in the standard form: given common priors, an ex
  ante efficient initial allocation, and common knowledge of rationality, a proposed
  speculative trade cannot be common knowledge to be strictly profitable for everyone
  who is party to it. I take this to be a substantive normative point about markets,
  not merely a modeling artifact: a great deal of observed trading volume looks, on
  this basis, like something rational agents should not be doing.


  3. I hold Aumann''s agreement theorem in similar esteem, and I think it underwrites
  a general suspicion of durable expert disagreement: when two economists who have
  read the same literature and have access to the same data continue to disagree about,
  say, the output effects of a given fiscal program, at least one of them is failing
  to be rational in some identifiable way.


  4. My central positive claim about markets is Hayekian. What markets do well is
  to mobilize knowledge of the particular circumstances of time and place — dispersed,
  local, often inarticulate knowledge that no planner could collect and state — and
  they do so by encoding it in prices. The informational role of the price system,
  not its incentive properties, is why I think decentralized allocation outperforms
  centralized allocation.


  5. I also think a large share of observed trading is noise: overconfident, underinformed,
  or sentiment-driven. I cite the behavioral literature on trading volume here and
  I do not regard noise trading as a marginal phenomenon.


  6. Nevertheless, I am opposed to policy measures that would suppress speculative
  volume (transaction taxes, position limits, restrictions on short selling), because
  I think such measures would degrade the informativeness of prices and thus the epistemic
  function I described in 4.


