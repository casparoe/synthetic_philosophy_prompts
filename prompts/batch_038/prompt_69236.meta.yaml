  Student answer draft:


  "Lewis and Kripke disagree about whether a single ordinary object can be located
  in more than one possible world. For Lewis, possible worlds are concrete things,
  just like our world, and they don''t overlap: nothing is a part of two worlds, and
  there are no causal or spatiotemporal relations between them. So if we want to make
  sense of claims like ''Humphrey might have won the election'', we can''t say Humphrey
  himself is in some other world winning it. Instead Lewis uses counterpart theory:
  the claim is true iff in some other world there is a counterpart of Humphrey — something
  sufficiently similar to him in the relevant respects — who wins. Modal talk about
  Humphrey is thus a matter of what happens to other, similar things, and this is
  what saves us from the problem of an object being wholly present in two worlds at
  once, which Lewis thinks is the real difficulty with the Kripkean picture.


  Kripke accepts the concrete-worlds picture too, but holds that objects are identical
  across worlds, so ''Humphrey might have won'' is true because Humphrey himself wins
  in some other world. His objection to Lewis — the Humphrey objection — is that this
  gets the subject matter wrong: Humphrey doesn''t care whether some *other* guy,
  however similar, wins an election in another world; he cares about whether *he*
  might have won. Since on Lewis''s account the truth of the modal claim is fixed
  by the doings of something that is not Humphrey, Lewis has changed the subject.
  The problem of transworld identity, on Kripke''s view, isn''t a problem at all:
  we don''t have to find Humphrey''s doubles by looking through a telescope into other
  worlds and then working out which of them is him. We stipulate which worlds we''re
  talking about, so there''s no identification question to answer. Lewis''s response
  is that the counterpart relation is a similarity relation, and since similarity
  is reflexive, symmetric and transitive, the counterpart relation ends up being close
  enough to identity that Kripke''s objection loses its bite; in any case the objection
  begs the question, because it just assumes that Humphrey can''t be the same as his
  counterparts. Lewis also stresses that which counterparts count depends on context,
  so there is no single fact about what Humphrey might have done independent of how
  the question is asked. That means modal claims don''t have a truth value except
  relative to a context, which is why Lewis is best read as a kind of fictionalist
  about modality, in the way Rosen later argued we should be.


  In my view Lewis comes out better. The counterpart theorist has a principled reason
  to deny that one thing can be wholly located in two worlds, whereas the transworld
  identity theorist has no answer to the objection that if Humphrey exists in w1 and
  in w2, and in w1 he wins and in w2 he loses, then he both wins and loses, which
  contradicts Leibniz''s Law and so shows that Humphrey-in-w1 and Humphrey-in-w2 aren''t
  the same object after all. Lewis also gives us a way of actually evaluating modal
  claims rather than leaving them primitive."


  Good. Errors:

  1. "Kripke accepts the concrete-worlds picture too" — wrong; Kripke''s worlds are
  abstract (stipulated states of affairs), not concrete spatiotemporally isolated
  universes; that''s Lewis''s distinctive thesis. This is the "misattributed view"
  error.

  2. "the counterpart relation is a similarity relation, and since similarity is reflexive,
  symmetric and transitive, the counterpart relation ends up being close enough to
  identity" — wrong on two counts: similarity is not an equivalence relation (intransitive
  — the "similar" relation is famously intransitive), and Lewis explicitly denies
  the counterpart relation is an equivalence relation; also "close enough to identity
  that Kripke''s objection loses its bite" is not Lewis''s response. Great subtle
  error.

  3. "modal claims don''t have a truth value except relative to a context, which is
  why Lewis is best read as a fictionalist, in the way Rosen later argued" — non-sequitur
  + misattribution (Rosen''s fictionalism is Gideon Rosen''s "Modal Fictionalism"
  (1990), and Lewis is a modal realist, the target of fictionalism, not a fictionalist).
  Also conflates context-dependence of truth *conditions*/counterpart relation with
  lack of truth value.

  4. The Leibniz''s Law step: "he both wins and loses, which contradicts Leibniz''s
  Law and so shows that Humphrey-in-w1 and Humphrey-in-w2 aren''t the same object"
  — this ignores the standard reply that properties are had relative to worlds (world-indexed
  properties), so there''s no contradiction; the student presents a begged/dismissed
  reply as a decisive refutation. Subtle.

  5. "the objection begs the question" — arguable but perhaps too harsh; Lewis wouldn''t
  say the Humphrey objection begs the question exactly... Actually Lewis might say
  Kripke''s objection assumes what''s at issue. Hmm — I''d call that a defensible-ish
  point but overstated. Could be flagged as "fine but push on it."

  6. Right things: worlds don''t overlap; no causal relations between worlds; CT semantics
  for de re modal claims; Humphrey objection correctly attributed to Kripke with the
