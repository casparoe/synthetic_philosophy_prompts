  I am preparing a written statement of my position on consciousness for a departmental
  workshop, where the stated purpose is to have colleagues attack the package as a
  whole rather than any single thesis. Before I circulate it, I would like a consistency
  audit. My commitments are these:


  1. Qualia are real, intrinsic, non-physical properties; they are necessitated by
  (rather than identical to) physical brain states, and they have no causal effects
  of their own. I accept epiphenomenalism in the strict sense.


  2. I accept the standard arguments that get me there: the causal closure of the
  physical as an empirical thesis about the neural sufficiency of behavior, plus the
  conceivability of a physical duplicate of me with no experience at all. I take such
  zombies to be genuinely metaphysically possible.


  3. My knowledge of my own current experience is direct and incorrigible in a way
  my knowledge of anything else is not; I could be wrong about the external world
  and about other minds, but not about whether it seems to me that I am in pain.


  4. I hold a broadly tracking-based account of knowledge: to know that p, my belief
  must be sensitive to the truth of p, in the sense that I would not hold it if p
  were false.


  5. To the worry that epiphenomenalism makes my reports of experience inexplicable
  — that a zombie would say exactly what I say — my standing reply is that the report
  is caused by the brain state, and that brain state nomologically necessitates the
  quale, so belief and quale share a common causal ancestor and my belief is not thereby
  blind luck.


  6. I hold that posits which do no explanatory work are a cost in a theory, and that
  between rivals otherwise equal I prefer the one that leaves nothing idle in its
  ontology.


  7. I think that what the causal-closure evidence does is rule out interactionism,
  and I resist the claim that this makes my position unsupported by anything empirical.


  8. Also: I think a physically duplicate being that reports having experiences would
  be reporting falsely, and I would treat its testimony about its inner life as worthless.


