  I am drafting the framing section of a dissertation chapter on structural realism,
  and before I circulate it I want an audit of my own stated commitments rather than
  a survey of the literature. Here is the package, as I would put it to an examiner.


  1. My starting point is defensive. The pessimistic meta-induction shows that the
  ontological posits of once-successful theories are typically discarded — the luminiferous
  ether being the paradigm — while a good deal of the mathematical structure survives:
  the wave equations of Fresnel''s optics reappear inside Maxwell''s theory. Structural
  realism is the position that takes this pattern at face value and claims for science
  only what has actually been retained.


  2. I take the structural content of a theory to be given by Ramsification: replace
  every theoretical term by a variable, bind those variables with existential second-order
  quantifiers, and keep the resulting sentence. That sentence, and nothing more, is
  what a theory is entitled to assert.


  3. I accept that Newman-style worries have force against unrestricted Ramsification:
  a sentence of that form seems true of any domain of suitable cardinality, and therefore
  says nothing. But I think the fix is to restrict the second-order quantifiers to
  causal relations. I do not want the rival fix of restricting them to metaphysically
  natural or eligible properties, since that imports a prior metaphysics of properties
  which I regard as both contentious and unearned.


  4. I hold that which portion of a theory is structural is settled retrospectively.
  The structural content of T is the Ramsified content of that part of T which T''s
  successful successor turns out to preserve. Successive theories are not related
  by entailment of their Ramsey sentences in general, so the only non-question-begging
  criterion of what was preserved is what the later theory in fact keeps.


  5. I am a realist about structure, not a constructive empiricist in disguise. The
  structures our best theories describe are mind-independent, and we know them; the
  Ramsey sentence of a well-confirmed theory is not merely empirically adequate but
  believed.


  6. I am an agnostic about intrinsic natures. We cannot know, and ought not claim
  to know, what the relata of these structural relations are like in themselves; any
  such claim is exactly the kind of commitment the history in (1) shows to be transient.


  7. The positive argument for realism is the no-miracles argument: the predictive
  and technological success of our theories would be a miracle unless those theories
  are approximately true. The pessimistic meta-induction does defensive work only.


