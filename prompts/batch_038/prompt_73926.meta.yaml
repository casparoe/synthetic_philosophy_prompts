  are precise-Bayesian responses (second-order probabilities, Machina, etc.). Well,
  the student saying "refuted" is a common overstatement but arguably not subtle enough.
  (2) The big one: conflation of dilation with belief inertia. Dilation is about learning
  a proposition in a partition making your credence in another event less precise;
  belief inertia is the inability to update on evidence that''s already "swallowed"
  by the imprecision (e.g., credence in H is [0,1] so no finite sequence of tosses
  moves it). These are distinct; the student treats them as one problem, or claims
  dilation is a special case of belief inertia. (3) "These show imprecise credences
  cannot be responsive to evidence in any principled way" — non sequitur; belief inertia
  is confined to the extreme case of maximal imprecision (and Walley''s representation
  theorem/generalized Bayes show regular update is well-defined), and dilation depends
  on non-conglomerability/independence structure; a defender notes dilation requires
  stochastic independence failure and can be blocked by adopting a different independence
  notion. (4) "Maximize expected utility over the credal set" — max-EU is behaviorally
  equivalent to selecting one precise credence function, so it reproduces the ambiguity-neutral
  choices that motivated imprecision in the first place (Ellsberg preferences are
  not max-EU); E-admissibility and Γ-maximin are the rules that preserve ambiguity
  aversion but they face money-pump/incomplete-preference issues. This is a real,
  checkable, in-the-weeds error. Good.


