  So a plausible summary with subtle errors:

  1. "Rousseau''s core worry was that plays corrupt the audience by making vice attractive,
  and that''s why the theater is dangerous." — Subtle misrepresentation: Rousseau''s
  actual claim is closer to the opposite causal thesis: theater can''t reform or corrupt
  mores much; it follows the public''s existing tastes and flatters them; it amplifies
  and legitimizes prevailing passions rather than implanting new vices. So the "media
  effects" reading is wrong. Good, subtle.

  2. "He thought tragedy''s pity was morally dangerous because it makes people act
  on impulse." — Actually the reverse: pity at the theater is sterile and substitutes
  for action; it''s dangerous because it does nothing.

  3. "He attacked Molière''s Misanthrope because Alceste is a hypocrite and Molière
  exposes him." — Actually Rousseau''s complaint is that Molière makes the virtuous
  man ridiculous and the worldly, indifferent Philinte likable; Rousseau wanted to
  defend Alceste (he even sketched how the play ought to be, inverting it).

  4. "He wanted to ban all public entertainment and replace it with church services
  / religious festivals." — He wanted civic, secular, participatory festivals; and
  he was not an ascetic: he endorsed games, dance, sport, and even conceded a regulated
  theater for a small republic under conditions.

  5. "He thought actors should be despised because acting is a lie / because they
  pretend" — partly right but the deeper point is the trade of selling one''s person,
  being in the pay of the public, and the moral status (also the French legal exclusion).
