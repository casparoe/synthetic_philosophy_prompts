  Potential inconsistency to highlight: the methodology accepts recoding-from-non-verbal-content
  reports (Type 2) as long as no explanation is involved — but recoding non-verbal
  content into words is exactly translation from Mentalese, which is an interpretive
  act that can introduce error and require a "hypothesis." So the ban on explanation
  is supposed to keep the report clean, yet the taxonomy itself concedes a transformation
  step. And the deeper question: if the recoding is from a non-linguistic format,
  is the resulting verbal report content-preserving? The methodology assumes yes for
  Type 2 — that the content is fully available and merely re-encoded. But on LOT plus
  a theory of introspection as interpretation (Carruthers-ish), the recoding is an
  interpretation of a subpersonal state, exactly like interpreting someone else''s
  behavior — which would make self-reports a species of confabulation-prone inference,
  and choice blindness would be evidence for that. Then what would have to change
  in the methodology if we took that seriously? E.g., treat verbal reports as evidence
  about the subject''s self-interpretive model rather than about the process; abandon
  the "process tracing" claim (that the sequence of verbalizations mirrors the sequence
  of computations); instead use them only as evidence about inputs/outputs; require
  converging measures; allow that the report is a reconstruction with no privileged
  status relative to an observer''s inference.


  But then also — does the practice presuppose LOT at all, or is it neutral? Key:
  it presupposes that thought content is the kind of thing that can be fully and directly
