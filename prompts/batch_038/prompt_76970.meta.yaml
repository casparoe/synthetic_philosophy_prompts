  of moral constraints does the IRB regime presuppose? That''s a good one — the paradox
  of deontology is: how can a constraint against killing be justified if killing is
  so bad that we should minimize it? The practice of institutional review boards,
  informed consent, the prohibition on using one subject as a means even to save many,
  versus e.g. the same hospitals'' policies on vaccine allocation or ICU triage which
  are aggregative. That''s a nice apparent inconsistency.


  Option 2: Compatibilism vs incompatibilism + stalled debate type. The debate about
  free will has stalled — but there''s a known "diagnosis" literature (Strawson''s
  freedom and resentment, Vargas''s revisionism, double incompatibilism, experimental
  philosophy showing ordinary concept is not settled). A prompt asking: is the compatibilist/incompatibilist
  debate verbal, about the meaning of "free," or about which concept to use? That''s
  good but risks being regurgitated — it''s a very well-trodden topic. To make it
  "in the weeds," I could inject a specific framing: e.g., the asker has noticed that
  both sides appeal to the same intuitions about the same cases (Frankfurt cases,
  manipulation arguments, Pereboom''s four-case) and each side reads them differently
  — the compatibilist says the manipulation case is no different from determinism,
  the incompatibilist says Frankfurt cases just show the principle of alternate possibilities
  is false but not that determinism is compatible. So the debate is: does the manipulation
  argument collapse into the consequence argument? That''s genuinely in the weeds
  and answerable without search.


