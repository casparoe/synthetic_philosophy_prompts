  Also a nice twist: the practice treats the *sequence* of utterances as the *sequence*
  of processing steps (process tracing) — presupposing that the order of verbalization
  mirrors the order of computation, which requires that verbalization be a low-latency,
  non-buffered readout. Any translation/interpretation step introduces buffering and
  reordering. Also presupposes serial, discrete, propositional steps rather than parallel/superpositional
  ones — which rules out connectionist accounts where the computation has no decomposable
  sequence of discrete contents to report. That''s a strong, precise point: the practice
  presupposes a serial-symbolic architecture of conscious reasoning, not merely a
  language-like format. Nice — that gives the "which rival views it quietly rules
  out" component real teeth.


