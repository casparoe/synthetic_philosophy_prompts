  the same researchers forbid "introspection" / ask for descriptions of "what you
  are thinking about" rather than "why," and they exclude "explanation" prompts because
  those alter the process. What does that presuppose about the format of thought?
  If thoughts were in a non-linguistic language of thought (Mentalese), verbalization
  would be translation, which is lossy and slow, and the protocol would be a different
  kind of evidence. If thoughts were imagery-based only, the protocol would be reconstruction.
