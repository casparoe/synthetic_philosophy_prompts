  Draft:


  "In experimental cognitive psychology — and in usability research that borrowed
  from it — there is a standard method for studying problem solving: the concurrent
  verbal protocol. A subject works on a task while instructed to keep talking, saying
  whatever comes to mind, and to do so without explaining or justifying anything;
  when they fall silent the experimenter interjects a neutral prompt to keep them
  going. The transcript is then segmented and coded, and the resulting sequence is
  treated as a trace of the sequence of information-processing steps. Three features
  of the method strike me as philosophically loaded and I''d like them separated out.


  First, the method''s own taxonomy of acceptable verbalization distinguishes (a)
  voicing content that is already in words — reading aloud, rehearsing — (b) recoding
  content that is not in words into words, and (c) explaining or justifying. (a) and
  (b) are admitted; (c) is banned as corrupting the process. Second, the method is
  advertised as not being introspection in the discredited sense. Third, the standard
  validation requirement is non-reactivity: if verbalizing changes accuracy or latency,
  the protocol is suspect.


  Meanwhile the same literature, and the wider psychology of judgment, treats subject
  reports of the *grounds* of their judgments as unreliable to the point of worthless:
  people shown two faces, allowed to pick one, and then handed the other by sleight
  of hand will confabulate a detailed justification for a choice they did not make;
  people who reliably prefer the last of a set of identical items deny that position
  had anything to do with it.


  Questions. What view of the format and architecture of thought does the concurrent
  protocol presuppose? Does it commit one to a language of thought — proprietary,
  compositional, Mentalese — or to something weaker or different: that at least conscious
  thought is carried in natural-language vehicles such as inner speech, so that verbalization
  is a readout rather than a translation? Is level (b), recoding non-linguistic content
  into words, distinguishable in principle from the interpretive act that would generate
  the confabulations in the second batch of findings, or does the method''s clean
  line between reporting content and reporting grounds collapse? And what about the
  use of the *order* of utterances as the order of computations — does that presuppose
  more than language-likeness, namely that reasoning proceeds in discrete, serial,
  individually expressible steps, and so quietly rule out architectures in which candidate
  contents are held in superposition or in which the work is done in non-propositional
  imagery?


