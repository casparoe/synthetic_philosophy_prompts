  \ independent of attitude expression; (R2) fails whenever the account must appeal\
  \ to higher-order attitudes about attitudes (i.e. infinite regress of B-type attitudes);\
  \ (R3) fails whenever the embedded occurrence is not the sole force-bearing element...\
