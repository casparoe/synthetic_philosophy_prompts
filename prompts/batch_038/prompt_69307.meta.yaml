  \ dimension: e.g., a subject who at t=0 prefers larger-later, at t=1 reverses —\
  \ is that akrasia or just a change of ranking?\n\nWhich gives the most satisfying\
  \ \"rules jointly consistent, diverge on the new case, further case to discriminate\"\
  ? I think akrasia does it very well:\n\nAsker: an editor for a philosophical psychology\
  \ series / or \"my supervisor's coding scheme for a study on self-control\". Actually,\
  \ better: a research team that codes participants' written self-reports of self-control\
