  \ whether the trait is a by-product explanation vs adaptation, whether the hypothesis\
  \ makes risky predictions confirmed, etc. That's rich and works well with the \"\
  rules underdetermined by verdicts\" structure. And it's genuinely in the weeds.\n\
  \nHmm. Which is best? Let me consider quality of the \"candidate rules diverge on\
  \ new case\" design.\n\nFrege–Geach/expressivism version: An author's verdicts on\
  \ which sentence embeddings their expressivist account can handle. Cases: negation\
