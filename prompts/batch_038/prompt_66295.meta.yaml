  So I''ve been asked to give the opening statement at a law school workshop on migration
  and the welfare state — 20 minutes, then a room full of people who mostly disagree
  with me. Before I write it I want to pin down what I actually hold and find out
  whether it hangs together. I''m not after a survey of the literature or a reading
  list, and I don''t want a lecture on the debate. I want an audit of the package
  below.


  Here''s the package:


  (1) The right to migrate is grounded in freedom of association — but the association
  that matters is the would-be migrant''s and the residents who want to admit them,
  not the state''s. States are gatekeepers, not parties.


  (2) So I reject the Wellman-style move: legitimate states are associations, individuals
  have freedom of association, therefore states have a right to exclude. I think that
  inference is bad — groups don''t inherit their members'' associational prerogatives,
  any more than a university inherits its faculty''s right to refuse to talk to the
  press.


  (3) At the same time I do think there are real special obligations to compatriots.
  Not instrumental, not a disguised form of cosmopolitanism with extra steps. They
  arise from the fact of sharing a cooperative scheme and they are weighty.


  (4) But I reject the contribution/reciprocity argument for exclusion. People who
  pay taxes don''t thereby acquire a quasi-property stake in the institutions they
  fund. The welfare state isn''t a club and citizens aren''t shareholders.


  (5) Nevertheless I think a state may impose a residency requirement — call it five
  years — before a newcomer is eligible for means-tested transfers. I usually gloss
  this with a distinction I like between the border gate and the membership gate:
  states should be very constrained in who they let in, and much freer about what
  they attach to becoming a full member.


  (6) I also hold something like Carens''s firewall: immigration status must not gate
