  Hmm, careful: the argument''s flaw structure. Let me design it:


  Setup: a grad student''s argument in a metaphysics seminar that concludes "supertask
  arguments prove that motion is impossible," or concludes "the reals are not complete
  / no physical process can have a limit". Let me write it:


  (1) For any process P and time t, if P is completed at t, then the description of
  P determines the state of the system at t.

  (2) The description of Thomson''s lamp determines its state at every time before
  noon (it''s on during the odd intervals, off during the even).

  (3) No such description determines whether the lamp is on or off at noon; any assignment
  is compatible with everything the description says.

  (4) So the lamp is neither determinately on nor determinately off at noon, so the
  task isn''t completed, so the lamp can''t be toggled infinitely many times. (Thomson''s
  conclusion.)

  (5) Now take an ordinary bouncing ball with coefficient of restitution e<1: it bounces
  infinitely many times, converging on a time t*.

  (6) By the same reasoning, the description of the ball''s motion determines its
  height at every time before t* but nothing determines its height at t*, so the ball
  can''t complete its bouncing.

  (7) So no object can execute an infinite sequence of actions in finite time.

  (8) But that implies the ball can''t come to rest, and more generally that no continuous
  quantity can reach a limit — which would make motion impossible (Zeno).

  (9) So either supertasks are impossible and Zeno was right, or (1) is false.

  (10) (1) looks obviously true: completion means the state at the end is fixed. So
  Zeno was right: motion is impossible.


  Where''s the flaw? Step (3)/(6): "nothing in the description determines the state
  at t" is not the same as "the state at t is indeterminate." For the ball, the description
  includes the dynamical law plus a continuity requirement (or the equations of motion
  determine the state at t* by taking the limit — the height function is continuous
  and has a limit, h(t*)=0). So (6)''s premise fails: for the ball, the description
  does determine the height at t*, because the physical description includes a continuous
  trajectory. For the lamp, the state function has no limit, so no continuity principle
  supplies a value; the description simply doesn''t say. But "the description doesn''t
  say" doesn''t entail "there''s no fact / the task is impossible" — Benacerraf''s
  point: the description is incomplete, not contradictory; a world containing the
  completed lamp would just be a world where the lamp happens to be on (or off) at
  noon, with no way to deduce it from the earlier stages. So (1) conflates epistemic
  determination (deducibility from a description) with metaphysical determinacy (having
  a value). Also (4) slides from "the lamp''s noon state isn''t entailed" to "the
  task isn''t completed" — a scope/equivocation slide. And (8)''s reductio depends
  on transferring the lamp''s failure to the ball.


  Also there''s a further subtlety worth inviting: is the lamp even a genuine physical
  possibility (does an infinite toggle require infinite energy/vanishing intervals)?
  And whether rejecting (1) costs anything: if completion doesn''t require the final
  state to be determined by the description, then Thomson''s argument against supertasks
  loses its bite, but we also lose the intuition that a "well-defined task" fixes
  its endpoint — and some philosophers (e.g., those who want the Ross–Littlewood jar
  to have a determinate answer) rely on it. Hmm, the Ross-Littlewood vase: add 10
