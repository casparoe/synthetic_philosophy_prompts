  but lowers the prize value. Mathematical result: you maximize average winnings by
  submitting a number of entries equal to the total number of entries of others (approximately
  — actually if you submit k entries and others total K, your chance of winning is
  k/(k+K) and prize is 1e6/(k+K), so expected = k·1e6/(k+K)², maximized at k = K).
