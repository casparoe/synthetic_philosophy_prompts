  same number... then k = K means k = (N-1)k → runaway. So superrational answer is
  to roll a die with N sides (N = expected number of responders, ~5% of readership)
  and submit "1" if you roll a 1. Contestants submitted astronomically large numbers
  including googolplexes; prize became moot (minuscule fraction of a cent) and the
  magazine couldn''t determine the winner. Published June 1983 ("Dilemmas for Superrational
  Thinkers, Leading Up to a Luring Lottery", Scientific American 248(6)), results
  in September 1983 ("Irrationality Is the Square Root of All Evil", 249(3)).


