  Draft:


  "I teach philosophy of mind and ethics, and I am currently drafting a chapter on
  risk and responsibility, which has required me to work through the literature on
  what probability claims mean. Something in that literature keeps recurring, and
  after a dozen instances I am convinced it is a recognisable pattern rather than
  a set of unrelated slips. But I do not know whether it has a name, and my own field''s
  vocabulary for argumentative faults does not seem to cover it.


  The pattern is this. A theorist adopts one account of what a probability claim is
  about — say, that it reports a limiting relative frequency in some long run of repeated
  trials. When pressed with a case the account struggles to handle — this particular
  tritium atom, this one defendant, this single storm — the theorist replies that
  the account was never in the business of saying anything about the single case,
  and that the objection therefore misses its target. So far so good. But a few pages
  later, when the theorist wants to draw a substantive conclusion, the same single
  case is being characterised in terms the retreat had just disowned: the number is
  offered as a fact about a disposition or tendency in the thing itself, or as what
  a well-informed agent''s confidence ought to be, and the conclusion is drawn in
  exactly the register the theorist had declared out of scope. Pressed on that, the
  theorist returns to the original account. And when a different pressure point appears
  — usually the question of which repeated trials count as relevantly similar — a
  third account is deployed, one that had not been the theory at all.


  Two features distinguish it from the faults I know how to name. First, none of the
  accounts invoked is weaker or stronger than the others in any consistent direction:
  the shift is not a retreat to a defensible core, because there is no core being
  defended, and the positions are not ordered by caution. Each is the bold position
  when it is the one being used. Second, each individual deployment is internally
  coherent and often exactly right — a frequency claim is the right thing to say about
  an actuarial class, a dispositional claim is the right thing to say about a half-life,
  a confidence claim is the right thing to say about evidence in a court. What goes
  wrong is the unmarked switching between them inside a single argument, so that no
  account ever bears the cost of the cases another account was invoked to avoid.


  So: is there an established concept for this, in the foundations-of-probability
  literature or in informal logic? I have considered equivocation and the family of
  ad hoc rescues, and neither seems to fit: equivocation assumes one term used in
  two senses where the argument needs them to be the same sense, whereas here the
  senses are avowedly different theories, and the switching is between arguments as
  much as within them; ad hoc rescue assumes a theory being patched, whereas here
  nothing is patched — the theory is simply not the one doing the work at that moment.


  If there is no established term, please coin one, and do more than supply a label.
  I want the definition in conditions I could apply to a passage of text: what has
  to be true of an argument for the diagnosis to be correct, and what could look identical
  on the surface but not be it. In particular I want the edges marked. Someone will
  surely reply that ''probability'' simply has several legitimate senses and that
  a writer is entitled to use whichever a context licenses; I want to know what, if
  anything, separates that legitimate contextual practice from the pattern I have
  described, and whether the difference is detectable from the text or only from the
  author''s further commitments. And finally — this is the part I care about most
  — I want to know whether the prevalence of this pattern counts as evidence that
  the dispute between the interpretations of probability is merely verbal, or whether
