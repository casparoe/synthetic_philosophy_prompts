  Agreed claims candidates (both can sign):

  1. The representation theorems are conditional: they derive a representation from
  axioms; they do not show that any particular system satisfies the axioms.

  2. Given the axioms plus a fixed outcome space and a fixed probability measure,
  the utility representation is unique up to positive affine transformation; the utility
  function is a representation of choice dispositions, not an independently identifiable
  mental quantity, and it has no zero point or unit.

  3. Risk aversion (concavity of utility in money) is fully coherent; the coherence
  tradition does not require risk neutrality.

  4. A myopic agent with genuinely intransitive preferences facing costless, unlimited
  sequential trading can be money-pumped.

  5. Dutch bookability of credences presupposes the agent will accept bets at its
