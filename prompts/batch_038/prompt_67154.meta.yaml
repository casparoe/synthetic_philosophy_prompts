  The two parties:


  Party A (the "constraint" reading). Holds that the family of results running from
  de Finetti''s Dutch book theorem through Savage''s and von Neumann–Morgenstern''s
  representation theorems to the money-pump argument for transitivity establishes
  something substantive about agency: any system that acts consistently enough to
  be treated as an agent will be representable as maximizing expected utility relative
  to some probability function and some utility function over outcomes, and departures
  from that form are not merely aesthetic failings but make the system vulnerable
  to being relieved of resources. On this reading, coherence is a real constraint
  on what a successful agent — including an artificial one — can look like, and the
  fact that observed humans display framing effects, intransitivity and the rest is
  a story about the costs of boundedness, not a counterexample to the theorems.


  Party B (the "deflation" reading). Holds that the theorems are conditional on assumptions
  — completeness, transitivity, continuity, independence, a fixed space of outcomes,
  a counterparty willing to offer bets at the agent''s own rates, costless and unlimited
  trading — that almost no actual system satisfies; that the assumptions, not the
  conclusions, do all the work; that any behavior at all can be redescribed as maximization
  of a suitably gerrymandered utility function over a suitably gerrymandered outcome
  space, so that the theorems cannot license the inference from coherence-looking
  behavior to having goals; and that the practical bite of incoherence depends entirely
  on whether the relevant pumps are available in the environment, which they usually
  are not.


  Both parties are competent, both know the mathematics, and neither is a strawman.


