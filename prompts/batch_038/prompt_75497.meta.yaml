  Let me write out the exchange carefully.


  1. Devin: The book''s central claim is that the standard picture gets things backwards.
  Cognitive science has traditionally treated categorization (this is a chair; that
  person is angry) as routine retrieval and analogy (the atom is like a solar system;
  this recession is like 1929) as a rare, effortful, high-level feat. S&S collapse
  the two: every application of a concept to a new case is an analogical mapping onto
  remembered cases, differing from textbook analogies only in distance and in how
  much the categories have to stretch. He cites the flexibility of "the White House"
  (building vs. administration), slips of the tongue, and blending in everyday speech
  as evidence that category boundaries are constantly being crossed without anyone
  noticing.


  2. Ruth: The collapse isn''t an empirical discovery, it''s a redescription with
  no way of failing. For any act of applying a concept you can always tell a story
  afterwards in which the new case was mapped onto prior instances. Unless the theory
  can say what a case of categorization-without-analogy would look like — and what
  observation would distinguish the two accounts — it has the same status as "all
  learning is Bayesian" or "all reasoning is inference": maximal generality purchased
  by giving up testability. And the evidence Devin cites (flexible reference, slips,
  blends) shows only that analogy is more widespread than people assumed, which is
  compatible with it being one mechanism among several.


  3. Devin: It''s not compatible with everything, and here''s the specific bet: S&S
  deny a difference in kind between matching attributes and matching relations. That''s
  a direct contradiction of Gentner''s structure-mapping account, on which good analogies
  are the ones that carry over systematic relational structure, while mere attribute
  matches are the shallow, cognitively inferior kind. So the theory predicts that
  surface, attribute-level correspondences are not a degraded fallback but the ordinary
  fuel of everyday thought, and that the systematicity preference shows up only when
  people are asked to evaluate analogies — as a judgment of quality, not as a description
  of how mappings are formed. That''s falsifiable.


  4. Ruth: But then he''s committed to explaining away one of the most robust findings
  in the field. Systematicity effects show up not just in people''s ratings of analogy
  quality but in what mappings they spontaneously produce, how easily they retrieve
  a base, and how children''s analogies improve with relational language. Saying "that''s
  evaluation, not formation" is an immunizing move: it rescues the theory from the
  data by reclassifying the data. If every structural effect can be filed under post-hoc
  judgment, the formation claim is unfalsifiable after all — which is my original
  complaint, now with a mechanism.


  5. Devin: Two responses. First, the multi-constraint account associated with Holyoak
  and Thagard already made purpose and pragmatic relevance co-equal constraints with
  structural systematicity, so "the process prefers relations" was never a clean structural
