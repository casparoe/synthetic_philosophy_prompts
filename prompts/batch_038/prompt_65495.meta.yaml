  I spent forty years in experimental physics, mostly in metrology — calibration,
  uncertainty budgets, blind analysis protocols — and only turned to philosophy seriously
  after retiring. I have now run into an institutional puzzle I cannot resolve with
  the habits of my trade, and I would be grateful for a careful answer.


  The practice is the secret ballot as actually administered in most democracies.
  Concretely: the state prints a uniform ballot; the voter marks it alone in a booth;
  in some systems each ballot paper bears a serial number and a sealed list is kept
  linking that number to the voter''s entry on the register, so that the link exists
  but can only be opened by a court in narrow circumstances; and in many jurisdictions
  it is a criminal offence for the voter to disclose how she voted or to photograph
  her marked ballot — although some such bans have been struck down by courts on free-speech
  grounds. Meanwhile, the same election is auditable to a remarkable degree downstream:
  party agents watch the count, paper records are preserved for recounts, and the
  designers of electronic voting systems build elaborate machinery so that anyone
  can verify the tally while no voter can obtain a receipt proving how she voted —
  a property they distinguish from the stronger requirement that a voter be unable
  to prove her vote even to an adversary who interacts with her at the polling place.


  Set against this: in the same polity, legislators'' votes are recorded and published;
  judges sign their opinions; officials file public asset declarations. And in the
  laboratory, blinding is used in the opposite direction and is always temporary —
  we hide the hypothesis or the group allocation from the observer to protect the
  measurement, and we keep the records so the blind can be lifted later. The secret
  ballot is permanent blinding, and it blinds the record rather than the observer:
  it destroys the trace of the reasons for which the decisive judgment was made.


  So: what does this practice presuppose about the vote? I want the implicit theory
  reconstructed, not the civics summary. In particular —


  1. Does it presuppose that voting is a right the voter holds for her own sake, or
  a public function she discharges for others? Mill argued the ballot teaches the
  first and that this is a moral mischief, writing that "the suffrage is given to
  him for himself; for his particular use and benefit, and not as a trust for the
  public." Is he right that secrecy commits us to the possession view, or does secrecy
  sit equally well with a trust view?

  2. Does it presuppose that votes are preferences to be aggregated rather than judgments
  to be evaluated for their reasons — and hence that legitimacy comes from the procedure
  rather than from the quality of the deliberation behind each mark?

  3. Which rival views does it rule out — open voting, a competence condition on the
