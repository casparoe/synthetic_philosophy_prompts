  \ be built so that this is the interesting fault line, and the answer should say\
  \ which reading is right and why. Actually the asker wants committed answers: \"\
  tell me whether NASA's working definition says alive or not, and commit to a reading\
  \ of 'self-sustaining' rather than saying it's ambiguous.\"\n\nSo the case: something\
  \ that evolves Darwinianly (has a replicator with heritable variation, competes\
  \ for resources, adapts over hundreds of generations in a flow reactor) but whose\
  \ self-maintenance is outsourced: the reactor supplies activated building blocks\
  \ and the compartment boundary is not made by the system but is... hmm, if it has\
