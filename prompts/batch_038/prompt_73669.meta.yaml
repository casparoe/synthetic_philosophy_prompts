  \ minimal cell, Xenobots (that's borderline: frog-cell robots — actually xenobots\
  \ are a great real anchor), the \"shadow biosphere\" idea, Cleland's \"defining\
  \ life\" critique (Carol Cleland: definitions of life are premature, life is a kind\
  \ not yet understood, like water before chemistry), Bedau's minimal life, Kauffman's\
  \ autocatalytic sets, Luisi's autopoietic micelles.\n\nThis is rich, and the constraints\
  \ are genuinely hard to satisfy jointly. And it avoids quoting. It also lets me\
  \ add a nice injected \"new/niche idea\": maybe the asker proposes a specific engineered\
  \ thing that the model has to work with, e.g., \"a self-replicating ribozyme system\
  \ in a flow reactor that has been evolving for two years and has drifted toward\
  \ shorter sequences\" (that's Spiegelman's monster, real). Or I could inject a fictional-but-realistic\
