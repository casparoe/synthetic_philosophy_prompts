  \ Medium.\n\nWhat about \"What is life? Definitions and borderline cases\" + thought\
  \ experiment: \"Design a lab-built system that satisfies the standard list of criteria\
  \ for life (self-maintenance, metabolism, reproduction with heritable variation,\
