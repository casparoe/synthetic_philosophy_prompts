  \ with a randomized sample of their contents, so variation is generated by the machine,\
  \ not by errors in an inherited replicator; and the \"lineages\" that persist are\
  \ those whose chemistry resists the filter. Hmm, then does it undergo Darwinian\
  \ evolution? Selection yes, but heredity/variation isn't via replication — it's\
  \ an \"evolutionary process without replicators.\" That's a nice niche idea: Darwinian\
  \ evolution requires heritable variation in fitness; if the heritability is imposed\
  \ by the apparatus (random reseeding with a bias toward whatever survived), you\
