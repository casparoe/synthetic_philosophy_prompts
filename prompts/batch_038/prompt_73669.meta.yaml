  \ desired verdict pattern right and make the specs sharp:\n\nDesired: \n- Definition\
  \ A (Darwinian/evolutionary: \"capable of undergoing open-ended Darwinian evolution\"\
  ): ALIVE.\n- Definition B (autopoiesis / self-maintenance / metabolic: the entity\
  \ must produce and maintain its own boundary and components): NOT ALIVE.\n- Definition\
  \ C (NASA working definition, which conjoins self-sustaining chemical system + Darwinian\
