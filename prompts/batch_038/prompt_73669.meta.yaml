  \ be individuated. Could it be a naked RNA replicator on a mineral surface? Then\
  \ no compartment, no self-maintaining metabolism → fails autopoiesis and fails \"\
  self-sustaining chemical system\" while clearly satisfying Darwinian evolution.\
  \ Realistic anchors: Spiegelman's monster (Qβ RNA evolved in vitro with supplied\
  \ enzyme and nucleotides — real, 1967, became a 218-nucleotide replicator that just\
  \ copies itself fast). That's real and it's a perfect \"evolves but isn't self-sustaining\"\
  \ case! But the asker says don't use the classics (viruses/viroids/prions) — Spiegelman's\
  \ monster isn't in that list, but it's a well-known real case, so I should ask the\
  \ model to build something new rather than retell Spiegelman. Hmm — but I want the\
  \ model to know the real anchor. Actually the instruction: I should inject the niche\
  \ idea into the prompt. So I could have the asker describe the seeded case in some\
  \ detail (an engineered thing that the asker invented), and then ask the model to\
  \ (1) refine/complete it into a paragraph of realistic detail, (2) run the theories,\
  \ (3) check whether it meets spec, (4) say what happens if you remove a feature,\
  \ (5) say how a defender of the losing theory would attack the case (e.g., a Cleland-style\
  \ skeptic would say the whole exercise is misconceived; an autopoiesis defender\
  \ would say the reactor is part of the system, so boundary-drawing is arbitrary\
  \ — the \"individuation\" objection).\n\nGreat. Seeded case (my invention, so the\
  \ model doesn't need memorized facts): A continuous-flow reactor at a synthetic\
  \ biology lab hosting a population of lipid vesicles. Inside each vesicle: a cross-catalytic\
  \ peptide/RNA network (autocatalytic set) plus a short ribozyme that copies a template\
  \ strand with error-prone fidelity; feedstocks (activated nucleotides, fatty acids,\
  \ amino acids) are supplied by the machine; the machine also does division: vesicles\
  \ above a size threshold get squeezed through a microfluidic constriction, splitting\
  \ them roughly in half, with contents distributed unevenly by chance. Over 18 months,\
  \ lineages diverge: some evolve faster replication, some evolve to hijack neighbors'\
  \ contents via fusion, some evolve resistance to the constriction. And crucially:\
  \ the system has a defect that makes it non-self-sustaining in an interesting way\
  \ — e.g., one essential catalyst (the ribozyme's own polymerase? or an enzyme supplied\
  \ externally, like T7 RNA polymerase or Qβ replicase) is added by the machine and\
  \ is not produced by anything inside the vesicles. So the vesicles can't make their\
  \ own replicase: heredity depends on an externally supplied protein that no lineage\
  \ can evolve or maintain. That's the \"parasitism on the apparatus\" feature — precisely\
  \ what makes it fail \"self-sustaining.\" And it makes the interesting question:\
  \ is the apparatus part of the system? If you count the reactor, then the whole\
  \ reactor-organism composite is self-sustaining-ish (but the reactor is human-made,\
  \ and its feedstocks are supplied from bottles...).\n\nAlso I want a second sub-case\
  \ or a \"remove the feature\" test: if you let the vesicles evolve the ability to\
  \ make their own replicase (or supply a ribozyme that is itself copied), the case\
  \ collapses into something much more clearly alive — which shows the feature doing\
  \ the work.\n\nAnd a third thing to make it non-trivial: the case should ALSO be\
  \ engineered so that the autopoiesis definition gives \"not alive\" for a reason\
  \ that isn't just the missing replicase: e.g., the vesicles don't build their own\
  \ membranes; the machine supplies pre-formed liposomes? Hmm, but then they wouldn't\
  \ grow. Better: fatty acids are supplied and spontaneously assemble into the existing\
  \ bilayer (growth by accretion, not by self-production of amphiphiles from feedstock)\
  \ — so the boundary is grown by physics, not produced by an internal network. That's\
  \ a clean autopoiesis failure. Combined with the supplied replicase, we get a system\
  \ that is genuinely Darwinian-evolving (has heritable variation, selection, cumulative\
  \ adaptation) but not self-maintaining in either of its two key aspects (boundary\
  \ and replication machinery).\n\nHmm, but wait: if the boundary self-assembles from\
  \ supplied fatty acids and the replicase is supplied, then arguably there's no organism-level\
  \ individuality — the replicator evolves but the vesicle is a container. That's\
  \ fine and is exactly the interesting point: \"which thing here is the candidate\
  \ for being alive — the vesicle, the RNA population, or the reactor?\" That's a\
  \ good addition: ask the model to say what the subject of the ascription is, and\
  \ commit to one.\n\nAdditional spec: \"no appealing to the fact that it's engineered\
  \ by humans\" as the disqualifier — I want the model to not take the easy route\
  \ (\"it's not alive because it's made in a lab by designers\"). That's a good anti-cheating\
  \ constraint. Also: \"don't let the verdict come from stipulation — if you say it's\
  \ alive under the evolutionary definition, show that the definitional clauses are\
  \ literally satisfied, e.g., that there's genuine heritability and not just differential\
  \ persistence.\"\n\nAlso add: \"one of my colleagues insists that anything that\
  \ satisfies 'undergoes Darwinian evolution' must also, in the long run, be self-sustaining,\
  \ because selection would favor any lineage that internalizes the supplied replicase\
  \ — so my case is unstable, not a real possibility. Address that objection head-on:\
  \ either show why the objection fails (e.g., the supplied replicase is not something\
  \ any RNA in the system could evolve within the reactor's lifetime, or there's a\
  \ reason selection can't get there) or concede it and explain what the case is still\
  \ good for.\" That's a great, meaty constraint that requires the model to reason\
  \ about the design rather than regurgitate.\n\nAlso the epistemic request: committed\
  \ response — \"take a definite position: tell me whether this thing is alive, all\
  \ things considered, and which definition you'd bet on, not a survey.\" Plus: \"\
  flag anywhere you're inventing chemistry that wouldn't actually work.\"\n\nAlso\
  \ prompt-engineering text: assign a role (\"you're a philosopher of biology who's\
  \ also spent time in an origins-of-life lab\"), \"think carefully\", \"start with\
  \ a short brainstorm of what makes cases like this hard before writing the scenario\"\
  ? Hmm, the deliverable order: maybe \"first, in a few sentences, tell me what the\
  \ hardest constraint to satisfy is and how you plan to satisfy it; then give the\
  \ case; then the walkthrough.\"\n\nAlso ask: no bibliography, no citations, don't\
