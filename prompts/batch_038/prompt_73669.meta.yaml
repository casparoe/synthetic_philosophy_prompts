  \ definition, not alive on the autopoietic one, and genuinely ambiguous (in an interesting\
  \ way, not by fiat) on the NASA working definition.\" Hmm — NASA's definition is\
  \ \"self-sustaining chemical system capable of Darwinian evolution,\" which bundles\
  \ both: self-sustaining AND evolution. So a system that evolves but is NOT self-sustaining\
  \ (its division is externally driven; its components are supplied pre-made) fails\
  \ the first conjunct while satisfying the second. That's exactly the injected niche\
