  sum of individual utilities. Plus the "impartial observer" theorem leading to Harsanyi''s
  utilitarianism (via veil of ignorance → average utilitarianism). The objections:
  the weights are arbitrary (not determined by the theorem — Weyl''s insight, the
  "welfare weights" problem), the interpersonal comparison problem, the claim that
  Harsanyi''s impartial observer argument smuggles in a claim about identity (Harsanyi''s
