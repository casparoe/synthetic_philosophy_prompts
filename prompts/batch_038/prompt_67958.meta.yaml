  disinterested and risk-loving/risk-neutral — it converts the problem of justice
  into a problem of rational choice under uncertainty, and the average utilitarian
  outcome depends on treating individuals as possible occupiers of all positions.
  Rawls says the correct conclusion is maximin. Also the "welfare weights" are indeterminate
  without interpersonal comparison; Weyl''s "welfarist''s paradox".


