  \ horns cost.\n\nActually here's an interesting self-undermining structure: \n(1)\
  \ Rational belief must be closed under evidential reasoning: if you should believe\
  \ p and p entails q, you should believe q.\n(2) Hmm, getting complicated.\n\nLet\
  \ me consider luck egalitarianism, which allows a nice \"proves too much\" argument\
  \ with a real subtle flaw.\n\nLuck egalitarianism core: inequalities are unjust\
  \ if and only if they reflect brute luck (not choice/option luck). Arguments that\
  \ prove too much:\n- \"Everything is brute luck\" argument: every choice is determined\
