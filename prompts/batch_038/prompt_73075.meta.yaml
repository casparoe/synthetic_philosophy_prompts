  \ Pascal's mugging, since I can build an elegant over-generating argument with a\
  \ scope/equivocation flaw that's less rehearsed.\n\nPascal's mugging: a mugger demands\
  \ $5 with probability 1/2^googol of delivering googolplex utils. Standard responses:\
  \ bounded utility, probability thresholds, complexity-weighted priors (Solomonoff),\
  \ rejection of expected-value reasoning for tiny probabilities (Kemp?), \"Pascal's\
  \ Wager\" analogies.\n\nAn argument that proves too much: \n(1) Rationality requires\
  \ maximizing expected utility.\n(2) Expected utility of an act with probability\
  \ p of payoff V is pV (linearity).\n(3) For any finite cost c you can name, and\
  \ any p > 0, there is a V such that pV > c.\n(4) So for any nonzero probability\
  \ claim, there's an offer you must accept.\n(5) Any claim the mugger makes has nonzero\
  \ probability (you can't rule it out with certainty).\n(6) So you must accept any\
