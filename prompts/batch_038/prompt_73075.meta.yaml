  \ computes every function computable by some finite automaton, on some interpretation.\n\
  (4) Computationalism about the mind says the mind is what the brain computes; i.e.,\
  \ mental content is fixed by which functions the brain computes.\n(5) Since the\
  \ brain computes every finite-automaton function, mental content is fixed by nothing\
