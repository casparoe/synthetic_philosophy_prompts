  \ process whatsoever implements any program, hence that computationalism is both\
  \ true and vacuous, hence that minds are everywhere — but then it also implies that\
  \ the very same rock fails to implement the program when... Hmm.\n\nLet me think\
  \ of an original-ish argument with a genuine subtle flaw. Here's one for computationalism:\n\
  \n(1) To compute a function is to undergo a physical process whose intermediate\
  \ states stand in a systematic correspondence to the states of some formal automaton,\
  \ such that the correspondence maps the actual final state onto the automaton's\
  \ output state.\n(2) For any physical process and any finite automaton, one can\
  \ define a mapping from (sub)states of the process to automaton states that satisfies\
