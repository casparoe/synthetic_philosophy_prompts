  \ is exactly where the Newcomb example says something slipped. So this might be\
  \ too parallel to the example given. Avoid.\n\nAlternatively make the Pascal's mugging\
  \ argument about a \"Pascal's mugging machine\": a scenario where the mugger's promise\
  \ is verified... Hmm.\n\nMaybe better: build a Pascal's mugging-flavored argument\
