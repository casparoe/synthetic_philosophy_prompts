  \ have determinate mentalities.\n(7) Therefore computationalism is false.\n\nWhere's\
  \ the flaw? Step (2) requires the mapping be onto the actual trajectory only, and\
  \ step (1) may smuggle in counterfactual support. Also (4) equivocates: computationalism\
  \ doesn't say content is fixed by the mere existence of some implementing mapping\
  \ under an arbitrary assignment; it says content is fixed by the causal organization\
  \ the system actually has. Also step (5) is a scope shift: \"computes F on some\
  \ interpretation\" vs \"computes F\" simpliciter, and \"has every mentality\" requires\
  \ that the *right* interpretation is indeterminate, which follows only if computationalism\
  \ says the interpretation is up to us. Also (5) → disjunction: from indeterminate\
  \ computation you can't infer \"either all or none\"; you could infer that content\
  \ is not determined by computation alone — which is a premise in (4) that the computationalist\
  \ can deny.\n\nHmm, but the argument as stated is fairly standard Putnam–Chalmers\
  \ territory. To make it more \"in the weeds,\" I can add a novel twist: a specific\
  \ device, like a self-modifying program or a particular mapping trick, and a specific\
  \ claim about the intentional stance? No — keep domain pure.\n\nAlternative: build\
  \ the argument so that it \"proves too much\" in a distinctive direction: that it\
  \ shows not just that computationalism is false but that no physical system stands\
  \ in any determinate computational relation at all, which would also kill the claim\
  \ that the argument's own authoring was a computation, and would make the triviality\
  \ result self-undermining. That is, the conclusion undermines the argument's own\
  \ tools (like the Newcomb example: \"a theory that predictably makes you poorer\
  \ is a bad theory\"). Something like: the argument relies on the notion of a mapping/interpretation\
