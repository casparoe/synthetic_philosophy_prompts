  \nLet me think about the strongest version: a valid argument with the real question\
  \ being which premise to reject, OR a subtle flaw. The instructions say pick one,\
  \ don't announce.\n\nI'll go with computationalism and a mapping/triviality argument,\
  \ but make the twist: the argument doesn't use the standard \"rock implements everything\"\
  \ but instead uses a *specific* principle about the individuation of computational\
  \ states: causal-role individuation plus the claim that any physical system can\
  \ be partitioned so as to realize any causal role structure, hence that computational\
  \ descriptions cannot be causally efficacious, hence that computationalism cannot\
  \ explain the causal powers of cognition — proving too much: it shows that no functional/computational\
  \ description ever does explanatory work anywhere, including in the design of the\
  \ very machines we build. That's a nice over-generation: it kills computational\
  \ explanation in engineering too.\n\nActually, here's a cleaner and quite novel\
  \ construction using \"counterfactuals + multiple realizability + triviality\" that\
  \ lands on an unacceptable conclusion:\n\nArgument (call it the \"vacuity argument\"\
  ):\n(1) To say a physical system implements program P is to say there is a mapping\
  \ from P's formal states onto (possibly disjunctive) physical states of the system,\
  \ such that the causal transitions among the latter mirror the formal transitions\
  \ among the former.\n(2) For any system that persists long enough and any finite\
  \ P, such a mapping can be constructed by choosing, for each formal state, a physical\
  \ state that the system in fact passes through in the right order.\n(3) So every\
  \ sufficiently persistent physical system implements every finite program.\n(4)\
  \ Therefore \"system S implements program P\" carries no information about S beyond\
  \ its persistence.\n(5) If a claim carries no information about its subject, it\
  \ cannot explain anything about that subject.\n(6) So implementation claims explain\
  \ nothing.\n(7) Computationalism says the mind is explained by what the brain implements.\n\
  (8) So computationalism explains nothing — including why this very argument, which\
  \ was produced by a computer running a type-checker, is reliable.\n(9) Therefore\
  \ computationalism is false, and indeed computational explanation generally is a\
  \ sham.\n\nFlaws: (2) requires the mapping to be *projectible* — to support counterfactuals\
  \ (what would happen on other inputs) — and requires that the mapping be *well-defined\
  \ independently* of the sequence, and typically that it be non-gerrymandered; also\
  \ (2) is false for systems that don't have enough state complexity or that can be\
  \ re-run with different inputs (input-sensitivity). (3) doesn't follow because the\
  \ constructed mapping doesn't handle *other* inputs; FSA implementation must be\
  \ a state-transition covering all inputs, so it must be a *function* of the input,\
  \ and constructing it for the actual run gives only a fragment. (4) equivocates\
  \ \"carries no information\" — actually (3) would mean the implementation claim\
  \ is true of everything, hence low-content, but the computationalist denies (3).\
  \ (5) is questionable. (8) is a scope shift: the reliability of the type-checker\
  \ depends on a *specific* mapping that supports counterfactuals and was designed;\
  \ trivial mappings don't confer reliability. Also (8) commits the arguer to something\
  \ odd.\n\nThis is decent but heavy. The user says keep it relatively short and focused.\
  \ Numbered arguments can be compact: 6-8 lines.\n\nAlternatively, consider embedded\
  \ agency: an argument that seems to show that no agent can be embedded, i.e., that\
  \ the very idea of an agent inside its environment is incoherent, or that a rational\
  \ agent must model itself completely and therefore cannot act. Or the \"indirect\
