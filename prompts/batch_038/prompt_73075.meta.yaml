  \ argument: \n\n(1) A rational agent must use all its evidence.\n(2) Everything\
  \ the agent knows about the world is evidence.\n(3) The agent's own decision procedure\
  \ is part of the world, and the agent has evidence about it.\n(4) So the agent must\
