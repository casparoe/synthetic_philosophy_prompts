  \ rule that predictably makes the agent worse off by its own standard is not a rule\
  \ of rationality.\n(9) So (1) is false.\n\nThe subtle flaw: step (4) → (6) requires\
  \ that the agent's utility function be unbounded AND that the agent's probabilities\
  \ be exactly the tiny p rather than being sensitive to the fact that the offer's\
  \ own likelihood is itself evidence — i.e., the mugger's ability to make a credible\
