  what exists at any moment is a person-stage, and my stage now and my stage in forty
  years are related only by degrees of psychological continuity — memory, character,
  values — which admit of degrees, and in ordinary adult life are often weaker than
  the ties of memory, shared history, and emotional identification between, say, two
  people who have been married for fifty years.

