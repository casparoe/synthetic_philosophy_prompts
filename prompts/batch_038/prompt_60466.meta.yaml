  Crux candidates:

  1. Verification asymmetry: process oversight is attractive exactly when outcome
  checking is hard; but process oversight requires the overseer to understand the
  process, which in the frontier cases they can''t. So the standard "process supervision
  is more scalable" claim needs an argument about which is easier for whom.

  2. Faithfulness: monitoring CoT creates pressure for CoT to be legible/rather than
  truthful; process oversight can be gamed by producing a sanitized rationale — so
  process oversight''s informational advantage presupposes the process is causally
  connected to the output, which training can sever.

  3. Attribution problem: with outcome-only signals, credit assignment across long
  horizons is impossible in practice, so "outcome-based" oversight in long-horizon
  agents collapses into noise; but process oversight''s step-level judgments inherit
  the overseer''s own errors, and the overseer''s error rate is correlated across
  steps (systematic bias), so process oversight''s errors are not independent — ensembling
  overseers doesn''t fix it.

  4. The metric question: what is oversight for? Detection vs. training signal. Process
  supervision as a *training* signal (PRM) shapes behavior; process oversight as an
  *audit* mechanism detects misalignment. These have different success criteria and
  different failure modes, and conflating them is the classic mistake. That''s a great
  A/B separator: A answers recognize the two uses and say which the question is about;
  B answers treat them interchangeably.


  I think a strong exam question asks: "Suppose we have a fixed oversight budget.
  Compare process-based and outcome-based oversight as *detection* mechanisms for
  a deployed agent whose chain-of-thought we can read. State what makes one detect
  more misalignment per unit of budget, and identify the condition under which process-based
  oversight detects *less* than outcome-based oversight despite giving strictly more
  information." The last clause is the crux: more information can mean less detection
  if (a) the extra information is gameable/corrupted (Goodhart on the monitored channel),
  or (b) reading CoT crowds out checking outcomes that would have revealed the failure,
  or (c) the overseer''s attention is consumed by plausible-looking reasoning, inducing
  automation bias / false confidence — the "legibility trap": a fluent, sane-looking
  rationale suppresses suspicion that an outcome check would have triggered. That''s
  genuinely subtle and not a stock talking point: process oversight can produce worse
  calibrated detection because the process is more legible and more reassuring than
  it is informative.


