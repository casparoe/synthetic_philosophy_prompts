  Move 1 (Nadia): Aumann''s result means that among ideally rational Bayesians, disagreement
  cannot persist: if two people have common knowledge of each other''s posterior on
  some claim, and their priors are common, their posteriors must coincide. So if two
  colleagues know exactly where each other stands on, say, whether a policy will work,
  and they still differ, that''s not "reasonable pluralism" — it''s proof that at
  least one of them is not updating correctly. Persistent, fully transparent disagreement
  is a refutation of someone''s rationality.


  Move 2 (Owen): The theorem is inert for that purpose, for two reasons. (a) The common
  prior assumption is false of real people — nobody has the same prior over everything;
  priors encode our different formative evidence, and there''s no principled way to
  say we started from the same function. (b) Common knowledge of posteriors essentially
  never obtains — I don''t know what you believe at the third iteration of "you know
  that I know." Since the antecedent is unsatisfiable, the theorem cannot be used
  to indict anyone''s rationality. It''s a theorem about a world with no disagreements
  to explain.


  Move 3 (Nadia): (b) concedes too much and (a) misreads the formalism. A prior isn''t
  a historical event; it''s a representation of your whole disposition to believe
  — the function such that your actual beliefs are what you''d get by conditioning
  on your evidence. On that reading, two agents have a common prior iff their conditional
  beliefs are mutually consistent in the right way; and that can hold between real
  people even though neither of them ever "had" the prior. And as for common knowledge:
  the literature has dynamic results — if two agents alternately announce their posteriors
  to each other, the announcements drive them to agreement in finitely many steps.
  So transparency isn''t a fantasy, it''s a process we can run, and the theorem bites
  at the end of it.


  Move 4 (Owen): Your dynamic result assumes exactly what you''re trying to smuggle
  in — a common prior. Strip it out and iterated announcement doesn''t converge; all
  you get is a weaker asymptotic "merging" story that requires one prior to be absolutely
  continuous with respect to the other, and merging is about long-run agreement in
  prediction over an infinite stream of data, not about a posterior on the single
  question we started with. So the dialogue result can''t be the bridge from the theorem
  to real disagreement.


