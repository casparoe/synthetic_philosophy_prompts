  Exam question (a take-home essay question for an upper-level aesthetics course):
  "A perfect forgery — one that is perceptually indistinguishable from the original
  — has been exposed. Two claims are often made about such a case: (a) the forgery
  is aesthetically worse than the original; (b) the forgery''s exposure changes nothing
  about how it looks, so any difference in value must be non-aesthetic. Assess whether
  (a) and (b) can both be true, and say what account of aesthetic properties would
  make them so."


  Student answer: ~600 words, well-organized, gets the surface things right (defines
