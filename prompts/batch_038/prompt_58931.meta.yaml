  - (ii) "the chance that I am dead after n rounds is (1/2)^n, which goes to zero"
  — direction reversed; (1/2)^n is the weight of the all-survival branch; death weight
  → 1. Also conflates "I will observe survival" with measure.

  - (iii) "those losses are in branches I will not be in" — flatly inconsistent with
