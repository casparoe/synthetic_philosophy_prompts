  Student answer draft:


  "Everett''s interpretation says the wavefunction never collapses: the whole universe
  is one big state that evolves unitarily, and what we call ''outcomes'' are just
  different terms in the state that have decohered from one another, so they can no
  longer interfere. There is no single result that gets actualised; all of them do,
  in different branches. So if I set up a device that measures the spin of an electron
  prepared in an equal superposition of up and down, and fires a poison capsule on
  ''up'', then after the measurement there is a branch where I am dead and a branch
  where I carry on. Nothing has been lost from the state, and the branch where I survive
  is just as real as the other one.


  Now the quantum suicide argument. From the outside, an observer watching me repeat
  the experiment n times will see me die with the frequency the Born rule predicts,
  and the branches in which I survive all n times have weight (1/2)^n. But from the
  inside the situation is different, because a dead person has no experiences. Whatever
  it is that has my experiences after the n-th trial has to be in one of the surviving
  branches, so the only observations I can ever make are of survival. It follows that
  I should expect, with certainty, to observe myself alive after every round, however
  unlikely that is on the ordinary quantum statistics. This is what people call quantum
  immortality, and it is a consequence of Everett plus the fact that experience requires
  a survivor. It does not work on collapse theories like GRW or on Bohm, where only
  one outcome is ever real, so there is a genuine chance of dying.


  Two objections are usually pressed. First, decoherence does not carve the world
  into a unique set of branches — the splitting is vague and basis-dependent, so it
  is not obvious that ''the branches in which I survive'' picks out a well-defined
  number of futures at all. Second, survival is not the same as surviving intact:
  in the low-weight branches where I keep beating the odds I will have accumulated
  brain damage, and by the tenth round I will be a very poor specimen of a survivor.


  Neither objection really bites, though. Deutsch and Wallace''s decision-theoretic
  derivation shows that a rational Everettian agent should give equal credence to
  each of the branches produced by decoherence, so the vagueness of branching is not
  fatal, and since I am certain to be among the survivors, the chance that I am dead
  after n rounds is (1/2)^n, which goes to zero for large n. In the limit death is
  a measure-zero event for me. So if what an agent cares about is her own continued
  existence, and she knows she will continue to exist, the prudential conclusion follows:
  I should volunteer for the experiment, even though I accept that in the overwhelming
  majority of branches by weight there is a version of me who is dead and whose death
  is a terrible loss. The argument does not depend on ignoring that, because those
  losses are in branches I will not be in."


