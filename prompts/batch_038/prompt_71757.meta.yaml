  Proposed summary text:


  "Akrasia — acting against your own better judgement — used to be a philosopher''s
  puzzle: Socrates denied it was possible, and the modern orthodoxy, following Donald
  Davidson, is that when you eat the second slice of cake you can''t really have judged
  that abstaining was better, since you can''t intentionally do what you judge worse.
  The discovery of hyperbolic discounting dissolved the puzzle. Human beings don''t
  discount the future at a constant rate; they discount the near future much more
  steeply than the far future. That means our preferences are intransitive across
  time: at any given moment we''d rather be thin than eat the cake, but the moment
  the cake is in front of us we''d rather eat it. Economists call this dynamic inconsistency,
  and it means the agent is really two agents: a far-sighted planner who wants to
  diet, and a myopic doer who wants the cake. Since only the planner''s preferences
  are stable and considered, they are the person''s true preferences, and the doer''s
  choices are simply failures of self-control. The upshot is that self-control is
  not a virtue at all but a commitment device — people who tie their own hands, by
