  that genuinely reproduce with heredity are the lineages of the genetic element,
  and that anything called "aggregate fitness" is a bookkeeping device — the real
  covariance structure is fully captured by tracking which elements leave copies of
  themselves, whether in offspring cells or by transfer; [name 2] defends the view
  that aggregates qualify as Darwinian individuals and that there is real group-level
  selection, because aggregate-level traits have aggregate-level causes and aggregate-level
