  The system is fictional for our purposes but I want its stipulated properties to
  be treated as fixed data, so here they are.


  The lab maintains a population of engineered bacteria that secrete an adhesin causing
  cells to stick into multicellular aggregates ("flocs"). Aggregates grow and reproduce
  by fragmenting; fragments found new aggregates. There are two strains: cooperators
  carrying an intact adhesin locus, and cheaters carrying a deletion that lets them
  free-ride on adhesin made by others. Three features matter for the argument. First,
  new aggregates form from a bottleneck of roughly eight cells drawn from the surrounding
  well-mixed medium, so within-aggregate relatedness is high but far from one. Second,
  the cheater deletion sits on a conjugative element: it can be transferred horizontally
  between cells inside a single aggregate, so a fully cooperator aggregate can give
  rise to mixed offspring aggregates without any differential fragmentation. Third,
  aggregate-level "fitness," defined as fragmentation rate, is measurably higher for
  aggregates with more adhesin, and the aggregate phenotype is partly a function of
  how many cheaters it currently harbors.


