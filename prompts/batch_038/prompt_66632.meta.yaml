  I''m in my fourth year of a philosophy of biology PhD and this term I''m co-teaching
  a graduate seminar on the levels-of-selection debate with an ecologist who runs
  a synthetic-evolution lab. To break up the usual Dawkins-versus-Sober-and-Wilson
