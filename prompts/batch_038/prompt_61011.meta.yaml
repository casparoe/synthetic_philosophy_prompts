  conditionalizing on it raises your credence in heads. If you also believe the chance
  is 0.5 with high credence, then PP-with-uncertain-chance gives expected chance.
  There''s a genuine philosophical dispute: whether the expert''s testimony is "admissible."
  Lewis''s admissibility: evidence is admissible if it''s information only about the
  chance setup (past-directed / about how the chance arose), not about the outcome.
  A predictor''s call is future-directed outcome info → inadmissible → PP doesn''t
  apply, so you should just conditionalize normally and your credence can differ from
  chance. Under strict PP, when your evidence includes inadmissible stuff, PP is silent
  — it doesn''t say "hold chance." So Rule A as "chance screens off everything" is
  actually not the standard PP; it''s a stronger thesis (something like "chance is
  a total evidence" claim).


