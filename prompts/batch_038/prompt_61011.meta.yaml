  Two candidate rules:

  Rule A (strict deference / "chance screens off"): Once you believe the chance is
  x, no further outcome-directed evidence should move you — credence stays x. Rule
  A fits V1, V2, V5, and it fits V4 only if we say in V4 the evidence moved the chance
  belief.

  Rule B (weighted expected chance): Your credence should equal the expected chance,
  where the expectation runs over chance hypotheses weighted by your credence — so
  any evidence that shifts your credence about which chance obtains shifts your outcome
  credence, and evidence that correlates with the outcome will shift your credence
  about the chance (via Bayes), so the expert''s call does move you. Rule B predicts:
