  is not significant," adopted prospectively. Another member objects: any line is
  arbitrary, it will fall on someone whose case differs in no relevant respect from
  the person a week above it, and pretending the line is in the policy when it isn''t
  is a kind of bad faith — better to decide holistically and publish a reasoned judgment
