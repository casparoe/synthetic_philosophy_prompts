  future evidence against P is misleading, so it''s rational to ignore it, but that
  seems dogmatic) could be staged as a deliberation with sequential evidence. Actually
  that''s gameable: give participants a piece of evidence, they reach high confidence,
  then deal them further evidence rounds; some will pre-commit to ignore, and you
