  Republican liberty (non-domination) vs negative liberty (non-interference) is excellent
  for a game: you can construct a scenario where an agent has a wide open option set
  but is subject to arbitrary interference at another''s whim — the classic "kind
  master"/Pettit''s example of the slave with a benevolent master who never interferes.
  That is exactly the force of the republican objection. A game where participants
  draw random allocations and a "dominus" has veto power that is rarely exercised,
  and participants must make choices under it — they will feel that their negative
  liberty is intact yet their behavior is already shaped (self-censorship/anticipatory
  obedience). That''s the classic Pettit point: domination shapes choices even without
  interference.


  Alternatively: revealed preference — a game where participants make choices, and
  the payoff scheme reveals that their choices are inconsistent with any utility function,
  or that "choosing" isn''t the same as "valuing." E.g., a menu-choice task that separates
  preference from choice, with a "regret" scoring. Hmm.


  Privacy: an auction for privacy — participants trade personal information for points,
  and the twist is the second-order effects (your disclosure affects others — the
  "privacy externality"). That''s a nice game. Also the difference between informational
  control and intimacy, and the fact that the value of privacy is often only felt
  retrospectively.


