  One more consideration: there''s a genuine "case tests theory" twist available.
  The standard introspection-skeptic conclusion is "first-person authority is limited."
  But FC is special: the failure isn''t in reporting on one''s own mental states (which
  Schwitzgebel argues is unreliable for *attitudes* and *experience*), it''s in reporting
  on the *source of one''s own movements*. Nisbett & Wilson''s thesis is about reports
  of *why* one did something / what one experienced. So one could argue FC doesn''t
  actually confirm Nisbett & Wilson at all — it confirms the ideomotor effect plus
  a source-monitoring error. And the "introspective reliability" literature would
  then be an inappropriate citation in the FC debate. Also: the FC case suggests that
  introspective unreliability is *domain-specific* — facilitators were probably fine
  at reporting their current feelings but terrible at reporting the authorship of
  a movement. This is a real philosophical point about whether "introspection" names
  a single faculty.


