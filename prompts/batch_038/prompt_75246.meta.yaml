  Ryle''s regress: intellectualism says for any action, the agent must contemplate
  a proposition (a rule/maxim) and then perform the action; but contemplating the
  rule is itself something requiring knowledge of how to apply it, ad infinitum. The
  key premise is that intelligent performance requires the prior "acknowledgment"
  of a rule, i.e., that the propositional knowledge must be exercised in a separate,
  prior operation. The intellectualist reply (Stanley & Williamson): knowing how is
  a propositional attitude under a practical mode of presentation; and exercising
  knowledge-how needn''t require a prior separate act of contemplation. So the choking
  evidence could be used: the regress requires that the intellectualist''s propositional
  knowledge be *deployed in a separate act*, but the choking data show the opposite
  — deployment in ordinary expert performance is not accompanied by explicit representation,
  and when explicit representation IS added, performance degrades. Hmm, that seems
  to cut AGAINST intellectualism in the naive reading. The prompt asks the model to
  argue the reverse: that the degradation shows the propositional knowledge is doing
  its job only when not consciously articulated — that conscious articulation is a
  *different* kind of access (a different mode of presentation / a reporting task)
  that competes for working-memory resources. So the phenomenon is about resource
  competition, not about the nature of the knowledge. That''s a good argument to make:
  choking shows that verbal/explicit monitoring consumes capacity, which is consistent
  with knowing-how being propositional knowledge under a practical mode of presentation,
  and in fact the very idea of a "practical mode of presentation" is confirmed: the
  same content can be grasped in two ways, and only one of them supports fluent action.
  That''s a nice line: the two-modes idea explains why more explicit access doesn''t
  help.


