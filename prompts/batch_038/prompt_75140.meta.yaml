  Argument structure (numbered):


  (1) Money is not wealth. Wealth consists in the necessaries and conveniences produced
  by human industry; money is useful only insofar as it stirs up and circulates that
  industry. [Berkeley, Querist queries 4-5]

  (2) If the whole use of money lies in its capacity to excite and transfer industry,
  then anything that performs that capacity does the work of money just as well. [query
  6]

  (3) Gold and silver perform that capacity not in virtue of any intrinsic property
  — not weight, not scarcity, not beauty — but solely in virtue of their being generally
  accepted as tokens in which proportions of value are reckoned, recorded, and transferred.
  [queries 23, 25]

  (4) So no intrinsic property of the medium matters to its being money; the medium
  is a ticket or counter. [query 23]

  (5) If no property of the medium matters, then the number of tickets in circulation
  cannot matter either; whatever number there is, each ticket simply stands for a
  correspondingly different share of the same total industry.

  (6) Hence doubling the quantity of money leaves real wealth untouched: prices and
  denominations adjust, the same goods are produced and exchanged. (This is Berkeley''s
  own thought in query 26: denominations retained, bullion gone, commerce maintained.)

  (7) Therefore a state that issues tickets freely, without limit, cannot make its
  people worse off, and — since the tickets stir industry — may make them better off;
  inflation, in the sense of a loss to the nation from an increase in the quantity
  of money, is impossible.

  (8) But (7) is false: every actual paper-money experiment Berkeley knew of (Law''s
  bank in France; the South Sea and Mississippi schemes) ended in ruin, and Berkeley
  himself proposed a national bank whose issue was to be regulated, not free.

  (9) So something between (1) and (5) must be rejected — and rejecting it seems to
  give up Berkeley''s whole account, since (5) is just (4) applied.


