  Actually the key diagnosis: The functional role that matters isn''t merely "being
  a ticket" but "being a ticket in a system whose total number is proportioned to
  the volume of transactions it must carry at a given velocity." Quantity is not an
  intrinsic property of the medium; it''s a property of the system. Step (3)/(4) says
  nothing intrinsic to the stuff matters (its substance, scarcity per se); step (5)
  says nothing matters at all, including the amount. That''s a scope shift: from "no
  intrinsic property of the tokens" to "no property of the token system." Additionally,
  (5)''s reasoning "each ticket simply stands for a correspondingly different share"
  already concedes that the tickets'' significance varies with number — i.e., it presupposes
  that quantity matters to what each ticket does, which is a reason to think the aggregate
  work done depends on the number (Berkeley''s "creating of wants" and the incentive
  effect: more tickets chasing fixed goods raises prices, which — per Berkeley — can
  stimulate industry up to a point, but beyond that point produces only the "cynical
  content"? hmm, or hoarding/speculation). Also relevant: the incentive effect operates
  through relative prices and expectations — an across-the-board doubling that everyone
  anticipates produces no change in the incentive to work, so it doesn''t "stir up
  industry" — hence the functionalist premise itself (1)-(2) implies the quantity
  can''t be irrelevant, since what stirs industry is the *prospect* of gaining purchasing
  power, which is fixed by relative shares.


  Also there''s a second strand: the argument''s step from "anything equally conducing
  to circulate industry is as useful as money" (query 6, a conditional/counterfactual
  about substitutes) to "therefore the amount doesn''t matter" — query 6 is about
  the *kind* of instrument, not the *quantity*.


