  ---


  For thirty-eight years I worked as a marine microbiologist, latterly running a laboratory
  on microbial physiology in sediments; I retired four years ago and have since been
  reading philosophy of science, which I ought to have done decades earlier. I now
  chair a small screening committee for a private foundation that awards a substantial
  prize every other year to work judged to have produced or demonstrated a novel form
  of life. The committee has three members — myself, a synthetic chemist, and a lay
  trustee appointed by the donor — and we typically receive between thirty and fifty
  submissions per cycle, ranging from credible laboratory work to outright crankery.
  We meet once, by video, for a single day, and each file receives roughly ten minutes.


  Our problem is that we have no agreed procedure for the threshold question: does
  the submitted system count as a living thing at all, or is it chemistry, or software,
  or an interesting artefact? Last cycle we argued for four hours about a submission
  and discovered afterwards that we had been using the word "life" in three different
  senses. I should like to fix that before the next cycle.


  [Then: what I want you to do]


  Please take the role of a philosopher of biology who has actually sat on such panels...
  Think carefully...


  1. Begin with a short analytic preamble (about 400 words, no more) in which you
  brainstorm the conceptual decisions a workable procedure must make and the ones
  it can safely leave out...


  2. Then give the procedure itself: an ordered sequence of questions, in the order
  we should ask them, each with (a) what we would have to find in the submission for
  the answer to count as sufficient, (b) what a failure to answer looks like, and
  (c) whether the question is one of empirical fact that the chemist and I can settle,
  or a conceptual choice that the committee must make explicitly and record. Where
  the procedure terminates in a rejection, say so; where it hands a decision to the
  three of us because it is not a matter of fact, mark it clearly and tell us what
  we would have to agree to in order to proceed.


  3. Specify how the criteria are to be combined. I have read that the properties
  associated with living organisms — metabolism, bounded individuality, repair, reproduction
  with heritable variation, adaptation over generations, responsiveness — come apart
  in practice rather than clustering neatly, so a checklist with a threshold score
  seems to me the wrong instrument. Tell me what to use instead and why.


  Constraints on content:

  - Handle the dormant case: cryopreserved cultures, spores, seeds, tardigrades in
  cryptobiosis. Our submissions include material that is not currently doing anything.
  The procedure must distinguish "not alive at the moment" from "not alive at all",
  or explain why that distinction cannot be made on paper.

  - Handle the individual/lineage issue: whether reproduction should be demanded of
  the submitted individual or of the lineage it belongs to; sterile hybrids, worker
  castes, cultured cell lines that no longer exist in any natural setting, obligate
