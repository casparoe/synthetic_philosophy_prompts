  it assumes that the substrate is irrelevant, and if so, on what grounds, and if
  not, what it says to the group that insists it is.

  - Handle heredity without templating: a system that passes on the composition of
  its interior rather than a sequence.

  - And handle the epistemics: we have only ever encountered one kind of life, so
  criteria read off it may be nothing but local prejudice; a procedure that simply
  demands the familiar machinery may exclude the very thing the prize exists to find.
  I want this worry taken seriously and built into the procedure rather than mentioned
  in passing.


  4. Worked applications to three submissions [describe them].


  Submission A: a group reports lipid vesicles in a flow reactor that grow by incorporating
  amphiphiles from the medium, divide when sheared, and pass on a characteristic mixture
