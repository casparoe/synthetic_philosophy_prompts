  I have served for three years on the examinations board of a university whose undergraduate
  degrees are classified by weighted average against fixed boundaries: 40 to pass,
  50 for a lower second, 60 for an upper second, 70 for a first. Alongside those boundaries
  the regulations run what they call the borderline procedure. If a candidate''s final
  average falls within two marks below a boundary, the board does not simply apply
  the number; it examines the distribution behind the average and may award the higher
  class provided a majority of the candidate''s credits are marked at that higher
  level. A student finishing on 58.6 therefore leaves with either an upper second
  or a lower second depending on a profile review, while a student on 57.9 is classified
  mechanically and no one looks at the profile at all. Last month the board spent
  two and a half hours on a single case of that kind, and afterwards a colleague remarked
  that the band "buys us mercy, not truth," which is the sentence I have not been
  able to stop thinking about. I am drafting a paper for next year''s senate review
  of the regulations, and I want to know, before I defend or amend them, what the
  procedure actually assumes about the marks it operates on.


  Some things about the wider practice strike me as pulling the other way. At module
  level there is no band whatsoever: an essay marked 61 and an essay marked 59 are
  treated by the scheme as belonging to different classes, and moderators adjust only
  for gross leniency or severity, never for the two-mark region where we would all
  admit the difference is noise. The same board that agonises over 58.6 will certify
  a departmental prize to whichever candidate has the higher average even when the
  gap is a tenth of a mark — an interval far finer than any of us believes our marking
  can resolve, and one we would never defend as a real difference if asked about it
  directly. And of course the band itself has a sharp outer edge: the two-mark threshold
  is as stipulated as the classification boundary it softens. I am told by a philosopher
  friend that there are rival accounts of predicates like "belongs to the upper second
  class" — that some hold the boundary is sharp but unknowable, some hold that borderline
  cases are genuinely neither in nor out, some hold that the boundary is ours to fix
  by stipulation and that any of a range of choices would be as defensible as another
  — and that the question is not merely verbal. I would like to know which of these,
  if any, our regulation is committed to.


  So: reconstruct the account of classification the borderline procedure presupposes,
  distinguishing what it strictly cannot do without from what merely sits comfortably
  alongside it... etc.


