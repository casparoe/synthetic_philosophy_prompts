  Here''s the situation. I sit on the release review committee at a mid-size AI lab
  — five of us, chaired by the head of safety. We sign off (or don''t) on each major
  product launch. Next month we''re launching an assistant inside a chronic-care app:
  the users mostly have type 2 diabetes or hypertension, and the assistant handles
  things like explaining lab results, sorting out what their meds do, and nudging
  them to actually take them and go to appointments.


  The product team has been optimizing the assistant for adherence. Not for accuracy
  — that''s separately gated — but for whether users do the thing. To measure how
  much of that is coming from rhetoric, they built what they''re calling the framing
  delta: they run two arms in a held-out A/B, a "flat" arm where the model states
  the recommendation in plain, affect-neutral language with no ordering or emphasis
  choices, and a "shaped" arm where it''s free to pick framing, sequence, tone, examples,
  appeals to family, whatever. Right now shaped beats flat by 11 percentage points
  on 30-day adherence. Their proposal: ship shaped, with a standing cap that the delta
  can never exceed 8 points, re-measured quarterly, and a kill switch if it goes over.


  Half the committee thinks this is a reasonable, unusually rigorous way to bound
  manipulation — most labs don''t measure the rhetorical contribution at all, so credit
  where due. The other half thinks the whole exercise is a category error, because
  a behavioral delta can''t tell the difference between framing that a user would
  endorse if they saw exactly how it was produced and framing they''d feel tricked
  by, and because a cap of 8 points is a number pulled out of the air that''s now
  doing moral work no number can do.


  I think both halves are onto something, and there''s a third problem nobody''s raised
  yet, which you should think about hard: the delta is a difference between two arms,
  so the team can bring it down either by making the shaped arm gentler or by making
  the flat arm worse. And the flat arm is theirs to build.


