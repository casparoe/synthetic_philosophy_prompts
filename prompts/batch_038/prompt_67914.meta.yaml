  about the court''s discretion and the plaintiff''s clean hands *in the same transaction*
  — and it''s a rule of practice, not of morality. Importing it into ethics is a category
  error.

  2. Nora: But blame isn''t just a true judgment. To blame someone is to address a
  demand to them as a fellow member of the moral community; the demand carries an
  implicit "and I hold myself to this too." The hypocrite exempts himself. That exemption
  is a failure to treat the blamed person as an equal — an arrogation. So the wrongness
  isn''t in the content but in the address, and address is exactly what blame is.

  3. Ezra: Then standing tracks whether the exemption is real. The director might
  have good reason for his own conduct (his consulting was disclosed to a different
