  blame is inappropriate even when the underlying judgment is true. Ezra holds that
  "standing" is a legal artifact imported wholesale into morality; morality has no
  standing doctrine, only truth and warrant, so the hypocrite''s blame is true but
  insincere/ineffective, not unauthorized.


