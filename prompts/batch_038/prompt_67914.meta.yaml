  Draft:


  ---


  I cover science and ideas for a magazine, and last month I sat in on a two-evening
  festival panel about accountability in research institutions. The advertised topic
  was bland, but the argument that actually took off was about hypocrisy and the right
  to blame, and I''ve been turning it over ever since. Two panelists did the work:
  Nora, a moral philosopher who writes about blame and resentment, and Ezra, a lawyer
  who teaches jurisprudence. I was in the audience taking notes; I don''t have a horse
  in this race, and I''d rather you didn''t be able to guess which of them I found
  more persuasive.


  The case under discussion was one I''d reported on earlier in the year. The director
  of a research institute publicly reprimanded a postdoc for failing to declare a
  paid consultancy, in terms that made the failure sound like a character defect rather
  than an administrative oversight. The director''s own declarations, it later emerged,
  had been late and incomplete for years, in the same category.


  Here is the exchange as I recorded it.


  1. Ezra opened by refusing the frame. The reprimand was accurate: the postdoc did
  fail to declare, and nothing in the director''s own file makes that false, or makes
  it less of a failure. Blame, on the ordinary understanding, is a judgment that an
  act was wrong plus a negative attitude toward the agent''s having done it; neither
  component is sensitive to who is doing the judging. What Nora wants to call standing,
  he said, is a rule of court practice that has been smuggled into ethics: the clean-hands
  idea is a discretionary bar on equitable relief, confined to misconduct bearing
  on the very subject of the claim, raised as a defense by the opposing party, and
  administered by an institution that has to decide whether to act. Morality has no
  docket, no discretion, and no opposing party to raise it.


  2. Nora said this depends on an impoverished picture of blame. To blame someone
  is not only to be right about them; it is to address a demand to them as a fellow
  member of a community that holds itself to common rules, and the demand carries
  an implicit term — that the addresser is inside those rules too. The director exempts
  himself from a rule he is pressing on someone junior to him. The defect is not in
  the content of his judgment but in his making it, and making it is exactly what
  blaming consists in.


  3. Ezra pressed the consequence. If the condition on blame is that the blamer be
  clear of the relevant fault, then almost nobody clears it: most of us have criticised
  conduct we are not clean of, and much of that is simply never known. A doctrine
  that makes nearly all actual moral criticism unauthorized is not a refinement of
  blame, he said; it is a reductio of the doctrine. He added that Nora''s condition
  is also wildly over-inclusive in the other direction — it strips standing from someone
  who broke the rule once, decades ago, confessed it, and changed.


  4. Nora said the condition is graded, not a switch, and that she is not troubled
  by the reductio. If it turns out that a large share of ordinary moral criticism
  is compromised to some degree, that is a finding about how readily criticism licenses
  itself, not a flaw in the analysis. She also said Ezra had changed the subject:
  her claim was never that the director''s reprimand was false, only that it was not
  his to deliver in that register.


  5. Ezra then set out what he took to be the decisive case. Imagine two directors,
  identical in conduct, identical in wording, identical in their relationship to the
  postdoc; one carries an undeclared, undiscovered, unrepented fault of exactly the
  same kind, the other does not. On Nora''s view one lacks standing and the other
  has it. But nothing an observer, the postdoc, or a colleague could register differs
  between them: the address is word-for-word the same, the demand is the same, the
  relationship is the same. So either the difference is inert — in which case standing
  is doing no explanatory work and the dispute is over a shadow — or the real variable
  is the director''s dispositions and commitments, in which case the honest formulation
  is that blame is undermined by the blamer''s lack of commitment to his own standards,
  and there is no need for a moral status called standing.


  6. Nora said the case is not inert, and that Ezra was assuming standing must be
  detectable to be real. A promise made by someone who already intends not to keep
  it is still binding on him and is not owed to the person who made it — nobody thinks
  the difference is invisible or irrelevant. What standing governs is not the truth
  of the reprimand but what the blamer may insist on afterward: whether the postdoc
  owes him an apology, whether resentment is apt, whether third parties should join
  in. A man who does not hold himself to the rule has no basis to insist on it.


  7. Ezra replied that she had now conceded his point, because what she described
  is a fact about the blamer''s character and commitments — insincerity, in the ordinary
  sense — and not a fact about a status he occupies. He asked her to say what distinguishes
  "you shouldn''t have delivered that reprimand" from "you couldn''t."


  8. Nora said the difference is that the second is agent-relative: it explains why
  the postdoc is entitled to decline to answer, why bystanders are not obliged to
  reinforce the criticism, and why an apology extracted by the director is not something
  he is owed. Ezra''s last word was that agent-relativity without a mechanism is a
  label, not an explanation.


  They never resolved it and I''m not going to try to in print. But I''d like your
  adjudication, and I''d like it granular.


  (a) Rate each of the eight moves on a fixed scale — clearly right / defensible /
  weak / clearly mistaken — and say briefly why. Rate the move as an argumentative
  step, not as a summary of that speaker''s overall position.


  (b) Say specifically which of the following Ezra wins and which Nora wins: whether
  blame is sensitive to the blamer''s own conduct; whether the equity analogy is load-bearing
  or merely decorative; whether the "nobody clears the bar" consequence is a reductio
  or a finding; whether the two-directors case shows standing is inert; and whether
  Nora''s final agent-relativity point answers Ezra''s demand for a mechanism.


  (c) Tell me what both of them are missing — something neither raised that would
  change the shape of the argument. I have a suspicion there is at least one, but
  I want it from you, not from me.


  Please be explicit about your confidence: which of your ratings you''d defend under
