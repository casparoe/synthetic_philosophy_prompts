  Great inconsistency for the demon domain: The community says (X) information is
  physical and erasing a bit has an unavoidable thermodynamic cost, hence the second
  law is safe; but also says (Y) logically reversible computation can dissipate arbitrarily
  little energy, so there is no thermodynamic cost to *thinking*, and (Z) measurement
  can be performed at no energy cost. So the practice locates the entire cost of cognition
  in forgetting. Ask: what theory of mind/information does *that* presuppose? A being
  that never forgets is thermodynamically free — is that a claim about possible agents?
  It presupposes that memory is a bounded register whose states must be reused; that
  an immortal, infinitely capacious demon would violate the second law only in the
  limit... Actually Bennett''s original point: a demon with unbounded memory could
  run forever without erasing, and it would violate the second law; the resolution
  is that any *finite* memory must eventually be erased. So the second law''s safety
  depends on the demon''s memory being finite! That is a beautiful, sharp presupposition:
  **the second law is saved by the finitude of memory** — i.e., thermodynamics is
  underwritten by a claim about the boundedness of information storage in any physical
  agent. So the practice presupposes: no actually finite memory; every physical record-holder
  must recycle states; and hence the second law is a theorem about bounded agents,
  not about the world per se. And there''s a real tension: if the demon''s memory
  were unbounded (an infinite universe, or an ever-expanding memory in an expanding
  cosmos), the second law could be violated in that region. Some cosmologists have
  discussed "the demon with infinite memory" and the relation to Boltzmann brains
  etc. Careful.


