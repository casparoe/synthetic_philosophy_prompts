  Content plan for the note (as a friend who teaches history of science writing to
  a novelist):


  1. Hobbes thought geometry was the paradigm of certain knowledge because its objects
  are of our own making: a line is generated by the motion of a point, a surface by
  the motion of a line, so in geometry alone we know the causes of what we demonstrate,
  and demonstration is nothing but reasoning from the causes by which things are generated.
  Natural philosophy, which studies bodies whose causes we did not make, can only
  reason back from effects to possible causes — hence less than science. [Accurate,
  roughly: De Corpore distinguishes: geometry is a science of causes because we construct;
  natural philosophy only hypothetical/generative reasoning from effects to possible
  causes.]


  2. Because of this he ranked the sciences: geometry first, then civil philosophy
  (which is genuinely demonstrative because we make the commonwealth ourselves by
  covenant), with natural philosophy last. [Accurate-ish — Hobbes''s classification.
  Civil philosophy is demonstrable because we make commonwealths. Good and slightly
  in-the-weeds.]


  3. He therefore took the new "analysis" — Descartes''s algebraic geometry and Wallis''s
  arithmetic of infinitesimals — to be no part of geometry: symbols and equations
  are convenient shorthand for finding results but they show nothing about causes,
  so a proof by algebra is not a demonstration; and infinitesimals are unintelligible.
  [Mostly accurate; the subtle error: he did not think algebra useless — he granted
