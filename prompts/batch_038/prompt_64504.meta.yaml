  "I convene a termly seminar on intergenerational justice that is deliberately mixed
  — two moral philosophers, three economists, a demographer, and a civil servant who
  appraises long-lived public investment for a national infrastructure body. Our standing
  topic for the past two years has been pure time preference, and the discussion has
  stalled in a way that I find genuinely puzzling rather than merely frustrating.
  The poles are familiar. On one side is the Ramsey–Sidgwick line: discounting a unit
  of welfare on the sole ground that it falls at a later date is ethically indefensible,
  impatience is a defect of the telescopic faculty rather than a moral datum, and
  the pure rate of time preference should therefore be set at or very near zero. On
  the other side is the Koopmans line, which does not treat impatience as a psychological
  blemish at all: in a stationary setting with an unbounded horizon, simple postulates
  about the utility of a consumption programme can entail impatience, and without
  it an optimum may fail to exist; add uncertainty about the continued existence of
  the community, and a positive discount rate looks less like a prejudice than like
  an accounting necessity. Between them sits a third, descriptive camp — associated
  with the Stern–Nordhaus exchange and its aftermath — which argues that the social
  discount rate should be read off observed behaviour (returns to capital, long-maturity
  spreads) rather than stipulated by moral philosophy."


