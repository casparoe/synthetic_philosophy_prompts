  Actually a great conceptual issue: Good''s theorem says expected value of information
  is ≥ 0, but that''s for a fixed decision problem with fixed acts and states. The
  interesting in-the-weeds stuff:

  1. The theorem requires that the agent can''t be forced to act on the information;
  that the set of acts is fixed; that the information is about the state, not about
  the agent''s own utility function or reasoning.

  2. If learning changes your preferences (adaptive preferences, sour grapes), the
  theorem doesn''t apply — because you compare expected utility under different utility
  functions.

  3. If information is costly to forget — you can''t un-know — then you may prefer
  not to learn. But Good''s theorem already accounts for that? No: Good''s theorem
  says you can always act as if you didn''t learn (the "ignore the information" strategy
  is available), so learning is weakly dominant. That''s the key move: the option
  to ignore.

  4. Where the option to ignore is NOT available: when the information changes the
  decision problem itself (e.g., learning about a threat that changes the payoff matrix
  — blackmail), when learning is publicly observable and thus changes others'' behavior
  (signaling), when your own reasoning process is part of the causal chain (logical
  uncertainty — knowing the output of your own computation), self-fulfilling predictions,
  when the agent is dynamically inconsistent (e.g., hyperbolic discounting, or a non-Bayesian
  updater), when there are "toxic" information structures like the paradox of prediction/Newcomb,
  when the agent is uncertain about its own utility function.

  5. Also: value of information can be negative when acquiring the information has
  side effects that change the state (measurement disturbance), and in game-theoretic
  settings where revealing you learned something changes payoffs.

  6. Also the difference between ex ante EV of information and the fact that the theorem
  assumes a proper scoring / that the decision maker maximizes expected utility with
  the same utility function before and after. And the "value of information is zero
  if the information doesn''t change the optimal act" — the classic result that VoI
  = 0 whenever the optimal decision is unchanged.

  7. Also relevant: Good''s theorem is about a decision under uncertainty where the
  agent can condition its act on the observation. There''s the subtlety that the theorem
  compares max_a E[u(a)] vs E_o[max_a E[u(a)|o]] — Jensen-type inequality. That''s
  essentially the proof: the max of an expectation ≤ expectation of maxes.

  8. Niche injection: the user just argued with a friend about whether a self-improving
  AI could rationally choose to remain ignorant — e.g., "corrigibility" / "value learning"
  contexts: an AI that learns the human''s true preferences could end up preferring
  to stay ignorant because learning changes its utility function. This is the classic
  problem of "self-modification" and "utility function uncertainty" — Good''s theorem
  assumes the utility function is fixed and known. If the agent is uncertain about
