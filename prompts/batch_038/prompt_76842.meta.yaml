  Tension A (genuine, non-obvious): 1 + 4. Nietzsche''s account of monumental history
  is that it works precisely by abstraction and approximation — it disregards individuality,
  turns the particular into the exemplary, and in doing so necessarily distorts: monumental
  history makes the past into something it wasn''t (the "effects in themselves" problem
