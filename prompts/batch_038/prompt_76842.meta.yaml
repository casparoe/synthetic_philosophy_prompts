  extent that he wants the effect, he is free with the causes; something like "monumental
  history will always deal in approximations and generalizations"). So a strict truth-first
  constraint and a full-blooded monumental aim are in real conflict — not because
  inspiration requires lies simpliciter, but because the monumental mode''s characteristic
  operation (making a life into an exemplum) involves suppressing the individualizing
  detail that the archival fidelity commitment exists to preserve. The cheap fix:
  restrict monumentality to the level of what the archive independently supports,
  i.e., let the exemplars be exemplary only in respects you can document — but that
  costs the motivational force that motivates the choice (inspiration depends on the
  gestalt, not the qualifications). Alternatively, admit the book has two registers
  and label them, but that costs the unity of the work.


