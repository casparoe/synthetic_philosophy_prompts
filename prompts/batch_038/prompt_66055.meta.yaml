  "A classmate in my comparative philosophy seminar built the following against the
  Jain doctrine of many-sidedness, and I have not been able to locate the flaw. Take
  the doctrine on its own terms: every assertion about how things are must be prefixed
  by syāt, marking that it holds only conditionally, from some standpoint (naya) and
  in some respect; the object as a whole outruns any assertion and is inexpressible
  (avaktavya).


  (1) If a statement is true only conditionally, from some standpoint, then it is
  not true without qualification.

  (2) The Jain thesis — that every statement is true only conditionally, from some
  standpoint — is itself a statement.

  (3) So the Jain thesis is itself true only conditionally, from some standpoint.

  (4) A standpoint from which it is not the case that every statement is true only
  conditionally is an unconditioned, absolutist standpoint; there is such a standpoint
  (our opponents occupy it).

  (5) Therefore the Jain thesis is false from that standpoint, and true from the Jain
  one: thesis and negation both hold.

  (6) The same reasoning works for any pair of contradictories, provided each is asserted
  from its own standpoint.

  (7) So no assertion rules out any other, and there is no such thing as a disagreement
  about how things are.

  (8) A view that makes no assertion impermissible is not a view but a mood.

  (9) Hence anekāntavāda, if coherent at all, is a temperament, not a doctrine.


