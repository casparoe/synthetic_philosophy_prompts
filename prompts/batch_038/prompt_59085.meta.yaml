  the way the American drug and device regulator grades the evidence it demands according
  to what is at stake. For a patient with a rapidly fatal illness and no alternative
  treatment, a new compound may be approved on the strength of a surrogate endpoint
  — tumour shrinkage, say, or a laboratory marker — that is merely thought to predict
  clinical benefit, with the requirement that confirmatory trials be run afterwards
  and that approval be withdrawn if they fail. For the same compound offered to treat
  a mild, chronic, non-life-threatening complaint, that evidence would be refused
  outright; the agency would insist on direct demonstration of benefit and on a far
  larger safety database. Something structurally similar obtains for devices, which
  are sorted into three classes according to the harm their failure could cause, and
  where a moderate-risk device can often be cleared by showing that it is substantially
  equivalent to an already-marketed predicate, with no new clinical data at all, while
  a high-risk device for the same anatomical purpose must carry investigations of
  its own. The agency does not, so far as I can determine, describe any of this as
  a lowering of its epistemic standard; its official account is that the standard
  of evidence is fixed and what varies is the balance of benefit against risk that
  one may acceptably strike.


