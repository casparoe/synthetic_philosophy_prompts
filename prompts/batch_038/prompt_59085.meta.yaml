  I spent thirty-four years as an analytical chemist in a government metrology laboratory,
  most of it concerned with measurement uncertainty and with the question of when
  an instrument''s output is good enough to act on. Since retiring I have been reading
  epistemology rather seriously, and I have become preoccupied with a practice that
