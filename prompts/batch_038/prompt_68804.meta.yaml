  Hmm, but then the two rules would converge?


  Let me make the new case such that rules diverge: e.g., the claim has strong engineering/design
  evidence and confirmed novel predictions and cross-cultural universality, but the
  selection pressure is inferred only from the trait itself (no independent paleoanthropological
