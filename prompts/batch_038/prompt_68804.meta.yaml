  Candidate rules (the model should generate these, roughly):

  R1 — Falsifiability/risky prediction: a hypothesis is scientific iff it generates
  specific novel predictions that could have come out otherwise and did. (Prediction-based;
  ignores ancestry evidence.)

  R2 — Independent evidence of the selection pressure: the adaptive story must be
  supported by evidence about the ancestral environment independent of the trait itself
  (otherwise circular / just-so).

  R3 — Design/engineering + no live byproduct alternative: must show the trait is
  well-designed for the function AND rule out spandrel accounts (or at least: byproduct
  accounts must be positively supported, not merely possible).

  R4 — Universality/heritability: requires cross-cultural universality + genetic variance
  data.

  R5 — Comparative/phylogenetic: requires convergence across species or a comparative
  test.

  R6 — Parsimony/prior plausibility: does the hypothesis need a special module, or
  can general learning + ordinary selection explain it? (anti-modularity default)

  R7 — Cost-benefit quantitative modeling.


  Now craft verdicts so that, say, R1 and R3 fit all of them but diverge on the new
  case.


  Let me construct:


  Verdict 1: A paper proposing an evolved fear module for snakes. Evidence: infants
  and monkeys show faster detection of snake images; cross-cultural phobia prevalence
