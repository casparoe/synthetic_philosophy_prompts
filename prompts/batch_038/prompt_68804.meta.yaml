  predictions confirmed... Snake detection in infants is a prediction from the hypothesis.


  Verdict 2: A paper claiming a module for detecting free riders in religious ritual?
  Hmm.


  Let me instead be systematic: design verdicts to knock out or leave live various
  rules.


  Goal: keep live at least two rules that diverge on the new case. Say we keep live
  R1 (risky novel prediction confirmed) and R2'' (independent evidence of ancestral
  conditions) — but I want them both to fit all verdicts. That means: in every accepted
  case, there IS independent ancestral evidence AND confirmed risky predictions; in
  every rejected case, at least one is missing... but then they don''t diverge on
  verdicts, and the new case can have one but not the other. That works! Classic underdetermination:
  all positives have features A and B; all negatives lack A or lack B; the new case
  has A but not B.


  But I want to be a bit subtler: make the positives differ in other respects so that
  other rules (universality, heritability, no-byproduct-alternative) are also consistent,
  giving more candidate rules. And ensure the new case is engineered so exactly two
  or three rules diverge.


  Let''s build the table. Features:

