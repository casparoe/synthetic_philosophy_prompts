reasoning_summary: 'Let me pick a domain and type. The domain options: evolutionary
  psychology; Bentham''s views on sexual morality; do LLMs understand?; how much should
  citizens hide from the state; political obligation and civil disobedience.


  Types: predict/recommend verdict on new case from earlier verdicts; analyze real
  episode through theory; short research proposal.


  Best combination: I think "predict verdict on new case" with Bentham''s sexual morality
  could be good but requires accurate Bentham scholarship. Actually there''s a well-documented
  set of Bentham verdicts: Bentham wrote extensively on the "paederasty" manuscripts
  (C.K. Ogden edited "Bentham''s Theory of Fictions"; Louis Crompton edited Bentham''s
  essays on sexuality in "Homoeroticism in the Age of Enlightenment" — but careful
  with quoting). Bentham''s actual positions: he opposed the death penalty for "paederasty";
  in "Offences Against One''s Self" he argued against punishment; he thought "ascetic"
  sexual pleasures were not harmful unless they caused suffering or violated security/consent.
  Also Bentham''s views on contraception, on women''s rights (he was surprisingly
  progressive), on marriage, on the "moral sanction" etc. That could support a nice
  track record of verdicts. But I''d need to be careful about accuracy — the answering
  model would need to have memorized Bentham''s sexual ethics. Hmm, small LLMs may
  not.


  Alternative: "predict verdict on new case" with political obligation/civil disobedience
  — e.g., a theorist''s track record. But inventing a fictional figure''s verdicts
  lets me control the puzzle entirely — that''s the "inject niche ideas into the prompt"
  strategy. E.g., a hypothetical committee or a hypothetical theorist with a track
  record of verdicts about protest tactics, and then a new case. That works well:
  it''s self-contained, doesn''t depend on memorized facts, and the underdetermination
  can be engineered.


  Another good option: evolutionary psychology — a track record of verdicts about
  whether a given finding counts as science vs just-so story. E.g., a methodologist''s
  rulings: she accepts X, rejects Y... Then a new case. This is nice because it engages
  the actual debate (adaptationism, Gould & Lewontin''s "spandrels" critique, Tinbergen''s
  four questions, Tinbergen/Dobzhansky, the "reverse engineering" objection, cross-cultural
  universals, heritability, optimality models, comparative method, phylogenetic bracketing)
  but the verdicts are invented so the underdetermination is engineered. And the domain
  is one where LLMs have deep familiarity (evolutionary psychology methodology) but
  the specific puzzle is novel.


  Also "do LLMs understand?" — a track record of verdicts from a hypothetical philosopher''s
  rulings on which systems understand: e.g., she says a Chinese Room person doesn''t
  understand, but a robot version does; she says a model that passes a translation
  test doesn''t understand, but one that fails... This can be engineered nicely with
  octopus test / Bender & Kobliner style, Searle''s Chinese Room, the "Octomate" thought
  experiment, homunculi-headed nation (Block''s China brain), functionalism. A track
  record of verdicts about which systems have understanding/semantics, then a new
  case where candidate rules (behavioral sufficiency, causal-structure, embodiment,
  dispositional/counterfactual, learning-history, compositional/systematicity) diverge.
  That''s a nice combination. But the stochastic parrots debate is heavily memorized;
  injecting a novel track record helps.


  Hmm. Which combination is best? Let me think about which gives the most "weeds"
  and genuinely underdetermined but tractable structure.


  I like the evolutionary psychology one: the track record can be about methodological
  verdicts — "counts as evidence for an adaptation" vs "just-so story." Candidate
  rules: (a) requires heritability + cross-cultural universality; (b) requires a plausible
  functional design argument showing the trait solves a problem better than alternatives
  (optimality/engineering reasoning); (c) requires independent convergent evidence
  from multiple lines (Tinbergen''s four questions); (d) requires the trait not be
  explainable as a byproduct/spandrel; (e) requires the hypothesized selection pressure
  to be independently documented (e.g., ancestral environment evidence); (f) requires
  specificity — a precise mechanism that makes novel predictions. And the new case
  can be engineered so that two rules diverge.


  Actually a good design: give 5-6 verdicts that are consistent with both "demands
  independent evidence of the ancestral selection pressure" and "demands the trait
  be shown not to be a byproduct of something else," and "demands novel predictions
  confirmed," etc. Then a new case: e.g., a claim about a specific cognitive bias
  — let''s construct one. New case: researchers claim humans have an evolved cheater-detection
  module; evidence: universality across 20+ cultures including small-scale societies,
