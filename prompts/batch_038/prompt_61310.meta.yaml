  My prospectus chapter has to specify what I will require of an account of causation
  before it compares any accounts, and I would rather get the specification right
  than get it written quickly. I am in a seminar on causation cross-listed between
  my philosophy department and the statistics faculty, so the chapter will be read
  by people who think an account that cannot be operationalised is idle, and by people
  who think an account that only licenses a modelling formalism has changed the subject.


  The purpose fixes the target. The account must serve two uses at once. It must support
  token-level reasoning about particular cases of the kind that comes up in ascriptions
  of responsibility, where what matters is whether this event brought about that one.
