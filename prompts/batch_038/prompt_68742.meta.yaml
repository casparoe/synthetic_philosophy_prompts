  For the caretaker/lame-duck one:

  - Implicit theory: authority is divisible; legitimacy comes in degrees; there''s
  a difference between legal power and normative warrant; the convention presupposes
  that a government''s right to make binding decisions is grounded in prospective
  confidence rather than in legal title.

  - Rival views ruled out: pure legalism/positivism about authority (whoever holds
  the office has all its powers); a view on which legitimacy is binary and conferred
  once at election.

  - Inconsistency: the convention says "don''t do anything major" but also "keep the
  country running, respond to emergencies." The distinction between routine and major
  is not principled — every significant decision can be described as necessary. And
  the US system allows the same person to do everything, which suggests the two systems
  presuppose different theories: parliamentary = authority flows from continuing confidence;
  presidential = authority flows from a discrete act of authorization that expires
  on a date.

  - Underdetermination: the caretaker convention could be explained by prudence (avoiding
  irreversible commitments by a government about to be replaced), by fairness to the
  incoming administration, by a democratic-mandate theory, or by a trustee theory
  — the practice doesn''t decide.

  - What would change: if legitimacy were purely legal, no caretaker restraint at
  all; if it were purely majoritarian-prospective, then a defeated government should
  be stripped of powers immediately, which would require either a shorter transition
  or a mechanism for instantaneous transfer (hence the interest in the electoral college/instant
  transitions, or in parliament''s ability to switch PMs mid-term).


