  \ of a future discovery would be to possess that content now. Therefore we cannot\
  \ predict the future course of history. Popper is careful about the second premise:\
  \ he concedes that we can predict that a certain problem will be solved, or even\
  \ roughly when, without being able to predict the solution itself. The argument\
