  \ prophecy from what he calls technological or conditional prediction: the latter\
  \ takes the form 'if such-and-such initial conditions obtain, then such-and-such\
  \ will follow,' and it is exactly what the natural sciences and any applied social\
  \ technology deliver. So the historicist's mistake is not to want predictions but\
  \ to want the unconditional kind, and to think that a science of history can supply\
  \ them.\n\nCentral to this is the confusion between trends and laws. A law, for\
  \ Popper, is a universal statement, and universal statements are testable: they\
  \ can be refuted by observation. A trend is an existential statement — it says that\
  \ in this particular region of space and time a certain directional change happens\
  \ to be going on. Trends depend on the initial conditions that sustain them, and\
  \ those conditions can change; so a trend can be overturned by a change of circumstances,\
  \ and no unconditional prediction can be built on one. Historicists, according to\
  \ Popper, observe a trend — say, the growth of bureaucratic centralization — treat\
  \ it as a law of development, and then read the future off it. This is why he thinks\
  \ historicist prophecy is not merely false but confused about the logical status\
  \ of its own claims.\n\nThe argument Popper thinks actually refutes historicism\
  \ runs as follows. First, the course of human history is strongly influenced by\
