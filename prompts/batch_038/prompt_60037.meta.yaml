  Design of the prompt: The asker works in compliance/risk at a lender or an insurer
  that has deployed a machine-learning model for decisions (e.g., credit limit reductions,
  claims triage). The firm must give reasons to customers and to the regulator. Since
  the model''s internals are opaque, the firm has procured a second system — a "rationale
  generator" (a large language model) which, given the input features and the output
  decision, produces a fluent, case-specific explanation that is then sent to the
  customer under a human officer''s name, with the officer doing a quick sanity check
  but not independently deriving the reasoning. Also: internally the firm accepts
  that the generated rationale need not correspond to any computation the model actually
  performed; the standard is that it be "faithful enough" — i.e., that a competent
  analyst, given the same inputs, would have arrived at a similar decision. There
  is also a policy that human decision-makers in the same firm are forbidden from
  doing exactly this: if a case officer gives reasons and later improves them, that
  is treated as misconduct.


