  Thesis: the standard line — that amnesties trade justice for peace and are therefore
  presumptively illegitimate — is aimed at the wrong feature. What actually does the
  moral work isn''t whether you grant amnesty but what kind of institutional transaction
  amnesty is.


  Distinction:

  (1) Transactional amnesty: individualized, applied for by a named person in respect
  of specified acts, conditional on full disclosure, adjudicated by a body that hears
  victims, produces a public record, and can be refused. South Africa''s Amnesty Committee
  is the paradigm: under the 1995 Act amnesty was available only for acts associated
  with a political objective, only to individual applicants, only on full disclosure
  of all relevant facts, and only case by case. Roughly 7,000 applications, only a
  fraction granted... careful: I think ~7,112 applications and ~849 granted amnesty.
  I''m not 100% sure. Maybe avoid precise numbers, or say "of the several thousand
  who applied, only a small fraction got amnesty" — safer. Actually I could say "most
  applicants were refused" which is true (about 850 granted out of 7,100+). I''ll
  phrase vaguely-ish but true.


  (2) Administrative amnesty: blanket, automatic, applies to a class defined by status
  or by a cut-off date, requires nothing of the beneficiary, produces no record. Argentina''s
  Punto Final (1986) and Obediencia Debida (1987) — a statute of limitations deadline
  and a legal presumption that subordinates acted under due obedience, both annulled
  by Congress in 2003 and held unconstitutional by the Supreme Court in 2005.


  The point: the two look like the same objection ("you let perpetrators off") but
  they''re structurally opposite. In transactional amnesty, the state extracts the
  maximum available truth and moral accounting as the price; in administrative amnesty,
  it extracts nothing and simply switches off the law. The standard critique collapses
  them.


  Rwanda as the awkward middle: gacaca had no amnesty, but it had a price-for-disclosure
  structure — confession and guilty plea bought a reduced sentence with half of it
  commuted to community service. So the "transaction" can be about sentence rather
  than immunity. That suggests the axis isn''t amnesty/no-amnesty at all, it''s whether
  the concession is individualized and purchased with truth, versus granted wholesale
  for political convenience.


  Then the twist — the part my seminar partner thinks is a stretch: if the axis is
  "individualized concession purchased with disclosure," then the US DOJ''s corporate
  leniency policy for cartels sits on the transactional side: first firm to self-report
  gets non-prosecution, conditional on full disclosure and cooperation, case by case,
  decided by prosecutors who can refuse. Which is structurally close to the TRC''s
  Amnesty Committee and very far from Obediencia Debida. So either (a) the axis is
  real but the name "amnesty" is doing no work — we''re actually describing a general
  institution, the purchased concession, of which truth commissions are one species
  and cartel leniency another; or (b) the axis is fake and I''m pattern-matching on
  "confession → immunity" without noticing that the two settings differ in every respect
  that matters morally (victims present and speaking vs. diffuse harm to consumers
  nobody represents; political reconciliation vs. deterrence; perpetrators with guns
