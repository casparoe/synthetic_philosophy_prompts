  at §265, "as if someone were to buy several copies of the morning paper to assure
  himself that what it said was true." Multiple copies of the same source are no check
  at all, so there is no distinction between getting it right and merely seeming to,
  and therefore — he says — sensation words cannot be naming private items; they can
  only be reporting behavior. He thinks the beetle-in-the-box at §293 is the same
  claim in costume: whatever is in the box "has no place in the language-game at all,"
  so the sensation drops out and what remains is the public expression.


  Could you audit both pictures as arguments rather than as illustrations? For each,
  I''d like an explicit correspondence table — in the newspaper case, what plays the
  paper, the extra copies, the assurance sought, and the fact the copies are supposed
  to confirm; in the beetle case, what plays the box, the beetle, the impossibility
