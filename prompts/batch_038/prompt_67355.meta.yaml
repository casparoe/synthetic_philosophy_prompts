  "I''m a high school student working on an independent project about the Nuremberg
  and Tokyo trials, and I''m trying to sort out a conceptual distinction that keeps
  getting blurred in what I''ve read. Critics often lump together two objections under
  the label ''victors'' justice'': first, that crimes against peace were created retroactively,
  so the defendants were convicted under a law that did not exist when they acted;
  and second, that the tribunals were structurally one-sided — the judges and prosecutors
  all came from the victorious powers, only nationals of defeated states were in the
  dock, and conduct by Allied forces that looked like the same offense was never charged.


  Could you explain whether these are genuinely independent objections, and in particular
  whether the standard reply to the first one — the idea that the London Charter did
  not invent new law but merely declared international law that already existed, and
  that the Charter''s real novelty was jurisdictional, supplying a tribunal where
  none had existed before — does anything at all to answer the second? I''m also trying
  to understand a specific case that seems to sit between the two: at Nuremberg the
  Tribunal convicted Admiral Dönitz on a count concerning unrestricted submarine warfare
  but declined to impose additional punishment for it after the defense introduced
  a statement from Admiral Nimitz that the U.S. Navy had conducted the same kind of
  warfare in the Pacific. Does that episode show a court conceding the asymmetry objection,
  or is it just ordinary sentencing discretion?


  Finally, please be explicit about where the settled ground ends: I''d like you to
  distinguish what historians and international lawyers treat as uncontroversial from
  what remains genuinely contested, and not to present one side of a live debate as
  if it were the consensus."


