  functioning democracies with a free press — is usually read as a claim about incentives
  (politicians face punishment). On my framework it is better read as a claim about
  the price of information: a free press makes the epistemic veto nearly impossible
  to decline, because knowing becomes cheap and refusing to know becomes visible.
  That reframing has a consequence Sen''s own formulation doesn''t make salient: the
  famine-preventing variable is not democracy per se but the cost of acquiring and
  broadcasting information about starvation. Which predicts that a non-democratic
  regime with a cheap, protected internal reporting channel should do better than
  a democracy with an expensive or captured one — and that the relevant failure mode
