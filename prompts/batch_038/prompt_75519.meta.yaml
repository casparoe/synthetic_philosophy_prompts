  Essay draft:


  §1 The three questions

  The familiar framing asks whether a famine is a natural disaster or a political
  crime. That framing is unhelpful because "what caused it" is not one question. There
  are at least three, and they come apart:


  (i) Sufficiency. Would the harvest failure, absent any human action, have produced
  mass starvation? For Ireland after 1845, plausibly yes on some scale. For Bengal
  in 1943, unclear, because there was no single dramatic collapse of aggregate supply.
  For China between 1958 and 1962, no: the harvest was damaged in places by drought
  and flood, but the mortality was not what weather alone would have produced.


