  Essay title: "The Last Cheap Veto: Why Famine Is a Question About Decision Windows,
  Not About Causes"


  Draft content:


  Intro: The standard framing asks whether famines are natural disasters or political
  crimes. This framing is bad because "cause" is a smeared notion. Better: separate
  three questions.

  Q1 (Sufficiency): would the harvest failure, absent any human action, have produced
  mass starvation?

  Q2 (Agency): was there a human decision that was a necessary part of the causal
  chain?

  Q3 (The one I care about): was there a moment at which an identifiable decision-maker,
  in possession of the information needed to see that mass death was coming, could
  have prevented it at a cost they would have been willing to impose on themselves
  or on their own group?


  Call that moment "the last cheap veto." Cheap = the cost of prevention was, from
  the decision-maker''s own evaluative standpoint at the time, small relative to the
  cost they accepted. Last = after it, prevention requires reversing policy, not just
  declining to adopt it.


  Then claim: The three famines differ in this respect in an interesting way.


  - Ireland 1845–1852: the blight was exogenous; but the veto structure was dense
  and repeated. The government had multiple points at which it could have restricted
  exports of food, or continued public works on relief terms, or dropped the clause
  in the 1847 poor-law amendment that required a tenant to give up more than a quarter
  acre of land before becoming eligible for relief — which effectively forced people
  to choose between their holding and their rations. Note that "food was exported
  while people starved" is not by itself a crime: exports continued because they were
  legally private property and because the ideological commitment to non-interference
  was real. The point of the veto framework is that the veto wasn''t only available
  at the level of the whole policy — it was available at many small administrative
  junctures, and was declined at nearly all of them. This is why "laissez-faire" is
  a description of a pattern of decisions, not an absence of decisions.


  - Bengal 1943: Sen''s insight is that there was no dramatic collapse in aggregate
  food availability; the famine came through prices and through the collapse of particular
  groups'' entitlements — rural transport workers, fishermen, agricultural laborers
  whose real wages fell — amplified by wartime demand in Calcutta, by speculative
  hoarding after the fall of Burma, and by the denial policies that removed boats
  and rice from coastal districts. My addition: the veto structure in Bengal is unusual
  because the relevant decisions were made at a distance, by people whose information
  was systematically degraded — the colonial administration was, for months, arguing
  about whether there was a famine at all, and provincial and imperial authorities
  attributed the crisis to hoarding rather than to distribution. So Bengal is a case
  where Q3 is satisfied but the epistemic condition on the veto (in possession of
  the information) is contested. That is exactly where I want to make the criterion
  bite: I don''t want to require actual knowledge, only that the decision-maker was
  in a position where a modest, affordable epistemic investment would have produced
  the knowledge. Call this the "epistemic veto": a decision-maker who declines to
  find out what they could cheaply find out has taken the veto.


  - Great Leap Forward, 1958–1962: the largest famine in history, and the hardest
  case for my framework, because the standard story emphasizes the collapse of information:
  local cadres inflated yield reports, procurement quotas were set on the inflated
  numbers, grain was taken from the countryside, and the dining halls consumed seed
  and reserve stocks early. On my criterion, one might say there was no veto because
  there was no information. But this is where I want to press: the information failure
  was itself produced by a series of decisions whose costs were borne by the people
  who would have supplied the information. The purge of critics after the 1959 Lushan
  conference, the labeling of accurate reporting as right-deviationism, and the incentive
  structure that rewarded exaggeration were all choices with identifiable authors.
  So the correct description is not "the state didn''t know" but "the state had chosen
  not to be able to know," and the epistemic veto applies at the level of the choice
  of an information system, not at the level of the individual quota decision.


