  \ knowledge. That's a well-known case, so the model has seen it. What we want is\
  \ a designed case with specifications.\n\nBetter idea: a case involving learning-by-doing\
  \ where the agent's propositional knowledge is intact and accessible but where the\
  \ intellectualist's \"practical mode of presentation\" requirement is satisfied\
  \ in a way that yields a false positive — e.g., a pianist who has been given a brain\
