  \ as cheating.\"\n\nLet me design the prompt:\n\nDomain: Knowing how vs. knowing\
  \ that. Type: Construct a thought experiment to specifications.\n\nSpecification:\
  \ build a case in which a Rylean (anti-intellectualist) and a Stanley–Williamson-style\
