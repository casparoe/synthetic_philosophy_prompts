  Para 1:


  I am revising the opening unit of a graduate seminar I co-teach with the economics
  department on the conceptual foundations of welfare economics, and I have run into
  a difficulty with a pedagogical device I have myself used for years. The device
  is the topographic-map picture of consumer theory: preferences over commodity bundles
  are represented by contour lines on a landscape, the budget set is a fence enclosing
  part of that landscape, and the agent is a walker who climbs to the highest contour
  the fence permits, the optimum being the point of tangency — or, where the fence
  bites, a corner of it. A widely used intermediate text deploys this picture to establish
  two conclusions that I want my students to examine rather than absorb. The first
  is that cardinal utility is a myth: contours, the text reasons, tell you only which
  places are higher than which, never how much higher, so nothing of substance is
  lost when we discard the older talk of measurable satisfaction; the numbers we attach
  to utility are bookkeeping, like the contour interval, which can be chosen at will.
  The second is that this disposes of the unobservability worry: since choice picks
  out exactly one contour as the highest reachable one, observed behaviour already
  reveals everything there is to reveal about preference, and any further question
  about the agent''s inner magnitudes is either empty or a demand for a phantom instrument.


  Para 2: seed + ask.


  I have begun an audit of the picture and would like it completed and pressure-tested.
  Some of the correspondences seem secure — elevation to the utility number, a contour
  to an indifference curve, the contour interval to the freedom of monotone rescaling,
  the fence to the budget constraint, the walker''s position to the endowment — and
  one disanalogy is obvious enough: contour spacing on a real map encodes gradient,
  information the ordinalist insists is meaningless in the target. But I am more interested
  in the places where the map seems to be doing covert work. Elevation is prior to
  the contour map and independent of it, and it is a genuinely cardinal magnitude
  measured in metres against a shared datum; the map merely declines to print the
  numbers. Is the ordinalist entitled to the corresponding claim, or does the picture
  invite students to think of utility differences as real but unprinted rather than
  as nonexistent? Again, contours on any landscape never cross and are dense in the
  region they cover; in the target, those features hold only because completeness,
  transitivity, and continuity were assumed. Does the map therefore present substantive
  axioms as facts about terrain, and what happens to preferences that are cyclic or
  incomplete — is there any landscape at all that they correspond to? Third, elevation
  is public: it can be checked with an instrument independent of the contour map,
  and it is commensurable across hikers standing in different valleys. Both of those
  features seem to have no analogue that the theory can accept.


  Para 3: theorem question + better analogies + deliverables.


  Finally, I want the audit to confront a question my colleague presses: whether this
  is an analogy at all. If the existence of a family of non-intersecting contours
  over a connected region is equivalent to the existence of a continuous real-valued
  representation of a complete, transitive, continuous ordering, then the map is not
  a comparison with something else but a picture of the target''s own structure, and
  the disanalogies I have listed are not infelicities of a metaphor but statements
  about which preference structures admit no representation whatsoever. If that is
  right, does the first conclusion become circular — the picture presupposing the
  very real-valued magnitude it was meant to show dispensable — and does the second
  conclusion lose whatever force it drew from the map''s being a mere illustration?
