  Content plan:


  Analogy: "Indifference curves are contour lines on a topographic map" — the utility
  landscape. Used in a textbook (say, an intermediate microeconomics text) to argue
  two conclusions: (a) ordinalism is safe — cardinal utility is a myth, because contours
  tell you nothing about how much higher one place is than another, only about ordering;
  and (b) the revealed-preference program is complete — since choice picks out the
  highest reachable contour, observed choices fully reveal preferences, so there''s
  nothing more to say about utility than what choice shows.


  The audit questions: what plays the role of elevation, of the map''s scale, of the
  contour interval, of the hiker''s position, of the fence (budget line), of the direction
  of steepest ascent? Where does it break?


  Key disanalogies to seed (but ask the model to go further):

  1. Contours are derived from a prior scalar function (elevation exists independently
  and is measurable, in fact cardinal — metres); the ordinalist wants to deny the
  analogue exists. So the analogy presupposes a cardinal magnitude and then tells
  us to ignore it — but elevation differences are real and comparable across the map,
  whereas utility differences are supposedly not merely unobservable but nonexistent/meaningless.
  That''s a crucial gap: the map has height differences, it just doesn''t display
  them; ordinalism claims there''s nothing there to display.

  2. Contours are dense/continuous and never intersect; preferences can be intransitive
  or have cycles (Condorcet-like), and the map analogy has no way to represent them
  — a "contour map" of a cyclic preference would require elevation to be multivalued.
  So the analogy silently imports completeness and transitivity as geometric facts
  about terrain rather than as substantive assumptions. That''s the "quietly imports"
  part — the analogy makes axioms look like features of the representation.

  3. On a real landscape, the hiker''s position and the terrain are independent; in
  utility theory the "terrain" is the agent''s own psychology, and it can be constructed
  by the elicitation method (framing, menu-dependence, preference construction). Contour
  lines don''t change when you measure them; preferences arguably do.

  4. Elevation is measurable by a third-party, interpersonally comparable standard
  (metres, sea level); utility lacks a common zero and unit, and the analogy hides
  the interpersonal comparability problem — the map''s elevation is shared by all
  hikers.

  5. Reversal: on a landscape you could in principle measure elevation directly with
  a barometer/altimeter independent of the contour map; the analogue would be an independent
  measure of utility (neuro, self-report, hedonic), and the ordinalist''s claim is
  that there''s no such instrument. So the analogy suggests a measurement program
  that the theory forbids.

  6. The budget line as a fence: real fences constrain the hiker externally; the budget
  constraint''s role is different — and with a fence, the highest reachable point
  may be on the fence (corner solutions), which the analogy handles fine. Less important
  disanalogy.

  7. What the analogy cannot represent: non-satiated vs satiated preferences (a peak!)
  — actually a peak is representable, but a bliss point means the "highest contour"
  is not on the boundary. Fine.

  8. Also: contours represent the terrain, not the walker''s experience; but the map''s
  elevation is a public physical property, so the analogy nudges toward treating utility
  as an observable-in-principle physical magnitude — ironically, it''s an argument
  for cardinal realism.


