  Apparent tension that dissolves: (1) maximizing expected utility vs (6) sure-loss
  aversion: in the two-envelope case, there''s an infinite-expectation variant where
  each switch has positive expected gain yet switching repeatedly... hmm. Actually
  a good apparent tension: "maximize expected utility" seems to license the always-switch
  reasoning that leads to a money pump, apparently violating (6); but this dissolves
