  because the other envelope contains 2X with prob 1/2 and X/2 with prob 1/2 — no
  wait, that gives reason to switch. Hmm.


  Key sub-issues in the two-envelope literature:

  - The "always switch" argument: conditional on seeing X, other envelope has 2X or
  X/2 with equal probability, so EV of switching = 1.25X > X. But then by symmetry
  you should switch back — contradiction.

  - Diagnoses: (i) the prior distribution over amounts can''t be uniform over an unbounded
  set (no such distribution exists / must have finite or infinite expectation); (ii)
  the "equal probability" assumption is wrong for any proper prior — conditionalizing
  on the observed value changes probabilities; (iii) treating X as fixed in both branches
  conflates the value in the envelope with the total; (iv) infinite expected values
  make comparisons illegitimate; (v) dominance reasoning: pointwise, whatever the
  amounts, switching doesn''t dominate.

  - There''s also a genuine tension between: "expected utility maximization is the
  right criterion" + "you should be indifferent in the symmetric setup" + "the dominance-style
  argument that switching is at least as good" + "conditionalizing is the right way
  to handle evidence" + a uniform prior over a bounded range (which is legitimate
  but then the conditional probabilities aren''t 1/2 at the edges).

  - Also Norton vs. others; the "Axiom of Choice"/non-measurable priors; McGee''s
  variant where switching has infinite expected gain and the "always switch" is intuitively
  right but you''d pay any finite amount... Actually McGee''s paradox: the pair of
  amounts is (2^n, 2^(n+1)) with prob 2/3^(n+1)... leading to infinite expected gain
  from switching, and one would pay anything to switch, but the total is finite...


  A belief set with genuine tensions:

  (1) Rational choice = maximize expected utility, with utilities being money linear.

  (2) In the two-envelope problem, before opening, you should be indifferent (the
  situation is symmetric).

  (3) Conditionalizing on what you observe is always correct — update by conditionalization
  on the observed amount.

  (4) The prior over the pair of amounts should be an unbounded distribution — you
  know nothing about the upper limit, and any bounded prior smuggles in information
  you don''t have. Something like: "I should use a prior with unbounded support because
  I have no information about the bank''s budget."

  (5) But also: for any finite observed X, the probability that the other envelope
  holds 2X vs X/2 is 1/2 each — this is the "equal probability" premise, which is
  only compatible with an improper/uniform prior. And (4) with unbounded support doesn''t
  automatically deliver 1/2.

  (6) Also they hold: no rational agent should be required to accept a sequence of
  trades that guarantees a sure loss (money pump / Dutch book aversion).

  (7) And they hold that switching back and forth is not irrational given each individual
  switch improves expected value (dynamic inconsistency allowed?).


