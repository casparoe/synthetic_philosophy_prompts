  will, for most observed values, give probabilities unequal to 1/2; in fact for a
  "scale-invariant" style prior you can get 1/2 but such a prior is improper. So the
  person needs either an improper prior (violating (1)''s well-definedness requirements
  or probability axioms) or to abandon (5).


