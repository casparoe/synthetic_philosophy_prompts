  ---


  Our meditation group''s monthly ethics evening has asked me to lead next month''s
  session, ninety minutes, whiteboard, about twenty practitioners — several of them
  EA-adjacent, none of them academics. The topic I''ve picked is the live question
  of whether Buddhist ethics is consequentialist. They will walk in convinced the
  answer is an obvious yes: karma keeps score, compassion wants less suffering, done.
  Plan the session for me rather than explaining the issue to me. What has to be in
  place before the question is even a question — I suspect the first job is to pry
  "consequentialism" loose from "cares about consequences," and the second is to make
  them see that karma''s automatic bookkeeping might be doing the opposite work from
  a utility calculation — and in what order the pieces have to come. Which single
  case should carry the discussion, and what it must and must not contain; if your
  instinct is the Mahāyāna story of the compassionate ship captain who kills the bandit
  aboard his vessel, tell me whether that case is actually load-bearing here, given
  that most of the dispute concerns earlier material. Map the misconceptions they''ll
  bring or form — the anattā-is-just-Parfit move, "skillful means so the precepts
