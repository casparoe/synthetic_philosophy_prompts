  Key conceptual dependencies to demand:

  1. Before you can ask "is it consequentialist?", the audience needs to know what
  makes a theory consequentialist in the technical sense (good prior to right, agent-neutral
  value, maximizing structure) rather than the colloquial sense ("cares about outcomes").
  The colloquial sense makes the answer trivially "yes, obviously — karma, compassion,
  reducing suffering." So the very first move is to break the word "consequentialism"
  free of "cares about consequences."

  2. Then: what would count as evidence for attributing a normative structure to a
  tradition — this is where it gets delicate. Should I include it? It might be a good
  dependency: you need to know that this is a live scholarly dispute, not a settled
  fact, otherwise they''ll treat your answer as reporting the answer. Maybe fold in.

  3. Then the karma point: karma automates consequences → does that make Buddhism
  consequentialist or does it make it prudential/deontological? A rule whose observance
  is guaranteed to pay is not a rule you follow because of the calculation.

  4. Then anattā: does the no-self view dissolve the separateness of persons (which
  is the standard rationalist route from Buddhism to utilitarianism), or does it undermine
  the notion of outcomes being good-for anyone?

  5. Then the precepts: exceptionless in the Canon? Or overridden by skillful means?
