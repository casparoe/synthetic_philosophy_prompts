  The confiscation detail is PERFECT for the "confiscable handicap" idea: the king
  seized the tapestries, statues, orange trees, and hired away the artists. The signal
  wasn''t burned — it was appropriated. That''s a genuine analytic crux: in the handicap
  model the cost must be irrecoverably paid (wasted) for honesty to hold; here the
  receiver could recover much of the cost, and even recover the signaler''s capacity
  to signal.


  Also: part of Vaux was built specifically for the king — so the signal was partly
  an investment in the receiver, i.e., a gift/bribe rather than a pure advertisement.
  That opens onto gift-giving/bribery vs. signaling — good analytic point (Mauss-ish,
  but no citations needed).


  Another crux: Fouquet''s cost was not differential in the way the model requires
  — he could fund it by borrowing on his own credit and by using the crown''s murky
  finances; the very office that made him able to signal cheaply is what made the
  signal read as evidence of embezzlement. So the signal was "honest" — it reliably
  conveyed that he had access to public money. That is, the handicap worked exactly
  as advertised but in the opposite valence: it conveyed information the receiver
  did not want the sender to have. Great analytic hook: the signal was honest, and
  honesty is what killed him. That''s a beautiful "the theory says X and X happened,
  but the payoff structure inverts the prediction."


  Also the multi-receiver problem: audiences included the king, Colbert (rival), the
  nobility, the parlement, financiers, artists. Different receivers decoded differently.


