  1. Identify what is replicated and what "copying" means in the domain (a fidelity
  requirement) — motivating case: oral traditions with variation, recipes, melodies.

  2. Show that variation is not systematically directed toward adaptive outcomes —
  the "guided variation" problem: if human agents generate variants by foresight and
  evaluation, selection does no explanatory work; requirement: either show that selection
  contributes beyond guided variation, or admit a hybrid mechanism. Motivating case:
  technological improvement (the ratchet), folklore.

  3. Explain cumulative adaptive complexity without appeal to designer foresight —
  the classic Darwinian explanandum. Motivating case: kayaks, Inuit tools, bow-and-arrow
  design, sourdough starters.

  4. Specify the population-level, not individual-level, subject of explanation: a
  Darwinian theory explains distributions of variant frequencies, not the biography
  of a token. Motivating case: why memetic accounts of "the meme for X" often collapse
  into intentional psychology.

  5. Be able to fail / be constrained: a Darwinian account must be capable of being
  wrong about a given domain — otherwise it''s universal Darwinism as an interpretive
  schema. Motivating case: Dennett''s "universal acid" vs. substantive claims.

  6. Distinguish reproduction from mere re-creation or reconstruction: high-fidelity
  copying vs. reconstruction from a template (Dawkins'' "recipe" analogy; the distinction
  between replicator-as-copying-template vs. replicator-as-causal ancestor). Motivating
  case: does an idea learned from two different tellers have a lineage?

