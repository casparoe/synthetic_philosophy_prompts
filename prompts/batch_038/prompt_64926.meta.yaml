  9. Account for why some lineages are cumulative and others are not (Godfrey-Smith''s
  minimal vs. paradigm vs. high-grade Darwinian populations): the requirement is a
  scalar/graded notion rather than a binary.

  10. Explain stasis and loss as well as spread.


