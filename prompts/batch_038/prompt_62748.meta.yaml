  My commitments:


  1. Explanatory aim. To explain a historical outcome is to show that it was to be
  expected, given the antecedent conditions one cites. I take this from the covering-law
  tradition as Hempel framed it, but I do not think the expectation need be articulated
  as an explicit law; what matters is that the account renders the outcome expectable
  rather than merely reported.


  2. Singular causation suffices. Many good historical explanations consist in identifying
  the cause of an event — the mislaid dispatch, the cabinet decision, the failed harvest
  in this particular province — and I think such an identification can be a complete
  explanation even where no covering law is invoked or known. Any law there may be
  is background, not part of the explanation.


  3. No laws of history. There are no strict laws governing historical processes.
  The macro-generalisations historians and historical sociologists deploy (about state
  capacity, about fiscal crisis and political mobilisation, about frontier closure
  and the like) are at best ceteris paribus rules whose provisos cannot be stated
  in advance, and I do not think they are reducible to, or derivable from, lower-level
  regularities in psychology or economics.


  4. Reasons are causes. Explaining an agent''s action by citing their reasons is
  a species of causal explanation. I do not think a separate, non-causal relation
  of "rationalisation" is required, and I am not persuaded that the space of reasons
  is exempt from the ordinary causal order.


  5. Intelligibility. Nevertheless, what makes a rationalising account explanatory
  in the strong sense — as opposed to merely true — is that it lets one see that what
  the agent did made sense to them. A purely causal story about the same events, however
  complete, would not supply that, and I regard the loss as a loss of explanation,
  not of something else.


  6. Narrative does explanatory work. A well-constructed narrative cannot be paraphrased
  into a list of singular causal claims plus generalisations without losing explanatory
  content. Order, selection, the decision about where the story begins and where it
  ends, what is foregrounded and what relegated to scene: these are not presentational
  ornaments over an argument that could be stated baldly.


  7. Difference-making. A factor explains an outcome only if the outcome depended
  on it. Conditions that were present throughout but whose absence would have changed
  nothing are background, not explanans; I want to keep the discipline honest by this
  test.


  8. Counterfactual history is inadmissible as a method. Historians are right to refuse
