  about what might have is unfalsifiable entertainment. I do not think this is in
  tension with 7, since one concerns what makes a causal claim true and the other
  what evidence we may offer for it — but I would like that checked rather than assumed.


  9. Convergence and particularity. Historical inquiry should aspire to the evidential
  and inferential standards of the social sciences, and I regard comparative and quantitative
  work as the progressive core of the discipline. I also hold that what history explains
  is the non-repeatable configuration, and that generalising methods are structurally
  unable to capture it. I have been telling people these are complementary rather
  than competing.


