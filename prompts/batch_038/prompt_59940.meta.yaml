  Now, the philosophical content: Benatar''s asymmetry (Better Never to Have Been,
  2006): presence of pain is bad; presence of pleasure is good; absence of pain is
  good even if there''s no one to enjoy it; absence of pleasure is not bad unless
  there''s someone for whom this absence is a deprivation. Hence: coming into existence
  is always a serious harm; it''s wrong to procreate; but we have no duty to end existing
  lives (because existing people can be deprived). Also anti-natalism vs. the "non-identity
  problem" (Parfit): a person cannot be wronged by being created if their life is
  worth living, since the alternative is never existing at all — not a worse state
  for them. Never Let Me Go: the clones were deliberately created; their lives contain
  love, art, memory, friendship; and yet they are killed. Two questions: (a) does
  the novel''s refusal of revolt dramatize the asymmetrist claim that no amount of
  good inside a life compensates for the harm of being brought into it, or does Kathy''s
  final contentment in Norfolk refute it? (b) The novel gives us a case where the
  non-identity problem has teeth but where the creation is also instrumental — the
  clones were created *in order to be used*, which arguably changes the moral character
  of the act of creation in a way Benatar''s framework doesn''t have a slot for (Benatar''s
  harm is impersonal/aggregative about pain and pleasure; here the wrong seems to
  be about treating someone as a means, a Kantian wrong, plus the wrong of creating
  someone *with a use*). That''s the niche injection I can build: the asker''s own
  distinction between "creation-as-harm" (Benatar) and "creation-for-a-purpose" —
  a wrong that doesn''t depend on the quality of the life at all. Maybe the asker
  coins it: "I''ve been calling it the instrumentality clause" or "the purpose-of-creation
  objection." And asks whether the novel''s Hailsham arc (the humane school that makes
  the horror bearable and even dignified) shows that a good childhood doesn''t cure
  the wrong — Miss Lucy''s outburst (telling the children the truth is worse than
  the gentle lie) is a nice focus: she thinks the "told and not told" pedagogy is
  a lie that prevents them from living their lives properly; Miss Emily thinks it
  made their childhoods good. That''s a real debate inside the novel that maps onto
  procreative ethics: is it better to be brought into existence and know it, or to
  be kept in the dark? Also: is a "good childhood" a compensating benefit or a mechanism
  of pacification?


