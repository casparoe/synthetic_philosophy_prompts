  Co-teaching a seminar on housing politics this term and I''ve stuck A Raisin in
  the Sun on the syllabus right next to Lefebvre on the right to the city and a stack
  of YIMBY/NIMBY arguments, mostly because I want the students to hit the play with
  concepts it wasn''t written for. My worry is they''ll just summarize it as a case
  study in historic redlining and feel done. So I want you to write the reading I''m
  trying to talk myself into — real criticism, not a theme summary.


  Start with Karl Lindner. He shows up for the Clybourne Park Improvement Association,
  is polite to a fault, insists nobody in the neighborhood bears the Youngers any
  ill will, mentions that things could get difficult, and offers to buy the house
  back from them at a profit. Take him seriously as a NIMBY and map him onto the homeowner
  today who writes to the planning board about "neighborhood character," tree canopy,
  and parking. How much of that mapping actually holds? One thing I keep tripping
  over: the play''s exclusion works by covenant and by the threat of violence — there''s
  a scene most productions cut where the neighbor Mrs. Johnson cheerfully predicts
  the family will end up in the paper as a bombing victim — whereas exclusion in most
  of my students'' cities now works by price and by zoning, where nobody has to show
  up at your door at all. Does a story about being kept out still speak to a city
  that prices people out, or does the swap quietly change the subject from race to
  class and lose what''s specific about Hansberry? (For what it''s worth her own family
  was on the receiving end of a real covenant fight in Chicago that went all the way
  to the Supreme Court, so the play isn''t just making this up.)


  Then the harder bit, and the one where I suspect the play beats me. Lefebvre''s
  right to the city is supposed to be a collective right to remake the city, not an
  individual right of access to the housing market. But the Youngers are doing something
  much closer to the second: Mama buys in Clybourne Park partly because it''s the
  cheapest house with a yard, Walter''s entire horizon is owning a business, and Beneatha''s
  suitors stage the choice between assimilationist prosperity and something else entirely.
  So is the play really endorsing a right to buy in? And when Walter refuses Lindner
  in front of Travis at the end, has that become a collective claim or is it still
  one family''s dignity, privately won? Point me to the moments that resist the Lefebvrian
  reading as honestly as the ones that support it, and tell me what the play knows
  about exclusion that the theory misses.


