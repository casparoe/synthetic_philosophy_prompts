  3. The measurement question: whether the distribution of causes of death, and how
  long each takes, can be estimated for a given habitat well enough to sign its expected
  welfare contribution.

  4. The reductio question: on a pure suffering-minimizing metric, paving a wetland
  scores better than restoring it, and a lifeless landscape scores best of all. Does
  that outcome discredit the metric, or discredit the intuition that recoils from
  it?

