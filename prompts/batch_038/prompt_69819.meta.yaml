  Possible readings of "what if everybody did it?":

  1. Moral universalizability (Kantian): if your maxim couldn''t be willed as a universal
  law, it''s impermissible. A normative claim, not evidential; needs the Categorical
  Imperative machinery, and it''s about maxims/practices not acts.

  2. Rule-consequentialist/practice-collapse: if everyone did X the practice would
  collapse and outcomes would be bad, so X is wrong (or: X is not available to you).
  Empirical claim about the universalized world.

  3. Evidential/diagnostic: your doing X is evidence that others do X (because you''re
  similar / share a reasoning process) — so you should condition on it. This is the
  superrationality reading, and it''s the one that''s actually doing work in the experiment,
  but note it''s only an evidential claim if you think your choice is correlated with
  theirs.

  4. Counterfactual/decision-theoretic: your decision is literally the same decision
  as everyone else''s (one chooser choosing for all), so you should maximize as if
  you control everyone — the "renormalized" reading. This is stronger than (3): it
  treats others'' choices as functions of your reasoning.

  5. Causal/magical: my choice causes theirs. Almost everyone agrees this is false
  in a one-shot anonymous game; it''s the standard objection to superrationality.

  6. Boring consistency/etiquette reading: "don''t make an exception of yourself"
  — a fairness claim about free-riding on others'' compliance (parasitism), which
  is true-ish of the PD but trivial and doesn''t yield dominance-violating conclusions.

  7. Mere predictive claim: if everyone did it, the outcome would be bad (a description
  of the universalized world), which by itself implies nothing about what you should
  do — the "no-ought-from-is" gap. This is the trivial/empty reading.

  8. The "what if everyone did what I''m doing" reading in a lowest-unique-number
  game, where universalizing is self-defeating — this shows the slogan''s verdict
  is not well-defined until you fix what''s being universalized (act-type? maxim?
  reasoning process? mixed strategy?). That''s a key ambiguity: the relata of "it".


