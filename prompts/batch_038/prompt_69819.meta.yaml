  strategy?

  - What is "everybody"? all actual participants, all superrational participants,
  all rational participants, all humans?

  - Is the universalization counterfactual (a test), evidential (a correlation), or
  causal (a mechanism)?

  - Is the conclusion normative (impermissible) or decision-theoretic (irrational/not
  payoff-maximizing)?

  - Is the "what would happen" evaluated in the world where everyone does it, or conditional
  on your doing it?


