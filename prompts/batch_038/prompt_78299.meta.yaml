  Now what''s wrong/subtle here:

  1. Tiberius Gracchus''s deposition of Marcus Octavius: he didn''t "break norms"
  first in the way described — the veto was used to block a popular bill, and the
  assembly deposed the tribune, which was unprecedented but arguably a response. More
  importantly, the ordering of who broke norms first is contestable; the Senate''s
  killing of Tiberius and 300 supporters without trial (violating provocatio, the
  right of appeal) is at least as much a norm break, and the book says the Senate
  "murdered" him but frames it as a consequence rather than an escalation. Subtle:
  the summary presents a one-directional story where norms were destroyed by popular
  leaders, ignoring the Senate''s own role (e.g., the senatus consultum ultimum first
  used against Gaius Gracchus in 121 — suspending citizens'' rights by decree, itself
  extraconstitutional).

  2. "Standing for a second consecutive term" — Tiberius sought a second consecutive
  tribunate in 133; that was unprecedented but tribunes had been re-elected before?
  Actually, the lex Villia/reiteration rules — re-election to the same office in consecutive
  years was irregular. Gracchus sought re-election; that''s roughly right. Note: Marius
  held seven consulships, breaking the norm on iterated office far more.

  3. The Marius army reform claim: the idea that Marius "opened the legions to the
  landless poor" (capite censi) in 107 and thereby created client armies is the standard
  19th-century story but modern historians dispute it — the change was mostly about
  recruitment in practice, and the causal link to soldiers'' loyalty shifting from
  state to general is heavily questioned (Brunt, etc.). Also land grants for veterans
  required senatorial approval, and generals'' patronage mattered. This is a genuine
  subtlety: the "client army" thesis is contested.

  4. "The Roman constitution was fine" — this ignores structural problems: the assembly
  system was rigged by wealth and tribe (comitia centuriata weighting), the lack of
  a professional bureaucracy, the inability to govern an empire with city-state institutions,
  the tiny number of magistracies creating a bottleneck of offices and thus competition,
  the absence of any pay for office meaning only the rich could serve, and the fact
  that Rome''s citizen body was geographically dispersed but voting required physical
  presence in Rome — so "the people" in the assembly were a small urban minority.
  Also the exclusion of the Italian allies (socii) from citizenship and their revolt
  in 91–88 BC (Social War) is arguably the trigger of the whole crisis, and Sulla''s
  march came out of that. A "republic''s norms" story that skips the citizenship question
  is missing something structural.

  5. The conclusion "institutional design doesn''t matter much" doesn''t follow from
  the accurate parts — indeed Sulla''s response was constitutional reform (doubling
  the senate, lex de magistratibus, weakening tribunes), which suggests design was
  seen as mattering; and Caesar/Augustus''s settlement was a redesign. Also, the Empire
  lasted ~200 years of relative stability afterward with different institutions —
  the Principate — which undercuts "design doesn''t matter."

  6. "Nothing was left to fall back on" — the Republic continued for another ~100
  years after the Gracchi (133 → 27 BC), during which norms demonstrably reasserted
  (Sulla restored the senate''s authority, though violently; the 70s settlement under
  Pompey and Crassus restored tribunician powers). So "once broken, gone" is too fast.
  A century of continued functioning is awkward for the "norms once lost never return"
  claim.

  7. The analogy: comparing "our democracy" to Rome assumes a like-for-like; Rome
  was an oligarchic republic with a non-sovereign popular assembly, no universal suffrage,
  slavery, etc. Also, modern constitutions are written with amendment procedures and
