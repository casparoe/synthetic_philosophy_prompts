  Centipede game structure essentials:

  - Sequential alternating moves.

  - Known finite horizon.

  - At each node, "take" gives the taker a bit more than "pass", but if the game runs
  to the end both get much more than the first-taker would.

  - BI ⇒ take at node 1.

  - Paradoxes: (a) it''s counterintuitive; (b) self-defeating: if you believe your
  opponent is rational enough to cooperate down to node 99, then that belief contradicts
  CKR which implies they take at node 1 — so your reasoning is incoherent (Bicchieri
  1989, "Self-fulfilling prophecies"; Reny 1992). (c) KMRW (1982) reputation: with
  small uncertainty about opponent''s type, cooperation persists nearly to the end.
  (d) Experimental results: most people cooperate for a while, take near the end;
  payoffs often higher than BI predicts (McKelvey-Palfrey 1992 experiment found immediate
  defection rare).


  NHL lockout mapping: two players (owners/NHLPA), alternating offers? Not really
  alternating, and there''s a deadline rather than a fixed number of nodes. The "pass"
