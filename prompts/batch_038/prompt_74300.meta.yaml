  joint pie (a season''s revenue, ~$2B) shrinks node by node as games are cancelled;
  each side keeps playing on because holding out might extract a slightly better CBA;
  the end of the centipede is "accept the deal, play the season." BI predicts... hmm,
  in a war of attrition with shrinking pie, BI says the side that would rather settle
  settles immediately — the classic "shrinking pie" ultimatum with deadline: the responder
  should accept any positive offer at the last round, so the proposer takes nearly
  everything at the first round if there''s a single offer. With alternating offers
  and a finite horizon, BI gives the first mover nearly the whole pie. And in reality,
  the NHL''s 2004-05 outcome was that the players got essentially nothing extra for
  their resistance (they accepted a hard cap in July 2005 with a 24% salary rollback),
  yet they still resisted for 10 months and lost a season. That IS a striking anomaly
  for BI: if the pie shrinks and the endgame is known, the players should have caved
  much earlier. The KMRW-style explanation: the owners weren''t sure the NHLPA leadership
  was "rational" in the relevant sense (Goodenow had reputation for intransigence,
