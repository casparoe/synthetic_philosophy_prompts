  immediately. Backward induction says player 1 takes at the first node. The paradox:
  that seems absurd, and the reasoning seems to undermine itself (if you believe your
  opponent is rational enough to reach node 99, you should also doubt the common-knowledge-of-rationality
  assumption, so you can''t reason your way to node 1 — this is the "backward induction
  paradox" / Bicchieri''s paradox, also related to the "common knowledge of rationality"
  problem). Also Reny''s "backward induction argument is self-defeating". And Kreps-Milgrom-Roberts-Wilson:
  reputation effects in finitely repeated games — a small probability that the opponent
  is a tit-for-tat type sustains cooperation until near the end. That''s a genuinely
  nice theory injection.


