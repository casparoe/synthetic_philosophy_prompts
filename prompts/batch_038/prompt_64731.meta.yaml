  But hold on: there''s a subtlety. The dominance argument for probabilism doesn''t
  itself license believing against evidence (it''s a static coherence norm). The charge
  of epistemic consequentialism bites harder on the dynamic arguments and on "accuracy-based"
  justifications of conditionalization or of "ought to maximize expected accuracy".
  Also there''s the "swamping"/"self-undermining" issue. And the "separateness of
  propositions" objection: Berker argues that accuracy-first epistemology permits
  sacrificing accuracy on one proposition for greater accuracy on others, which is
  a distinctive feature of consequentialist reasoning; whereas the dominance argument
  is "per-proposition" and doesn''t aggregate across propositions. Actually there''s
  a nice precise point: Joyce''s dominance theorem is a *strong* dominance result
  over the whole credence function, and the aggregation across propositions is exactly
  what additivity of the scoring rule does. So there is a real tension: the dominance
  argument does aggregate (sums inaccuracy across propositions), so Berker''s "separateness
  of propositions" objection might indeed reach it. But defenders (Pettigrew, and
  others) reply that the dominance argument is not a maximizing structure: it identifies
  dominated options, and dominance reasoning doesn''t require trading off, since any
  coherent alternative dominates... Hmm, actually, there''s a genuine live debate:
  does the accuracy-dominance argument for probabilism commit one to epistemic consequentialism?
  Some argue no because dominance arguments are "structural"/non-teleological (they
  don''t say "maximize expected accuracy"), while the argument for conditionalization
  via expected accuracy is teleological. Also, importantly, Joyce''s theorem shows
  that an incoherent agent is dominated *at every possible world*, which is not a
  trade-off — no world is sacrificed. Whereas maximizing expected accuracy does trade
  off across worlds. That''s the crux: dominance is "sure-thing" reasoning, not aggregation
  across outcomes. That''s a genuinely nice conceptual explanation target.


