  whose content wasn''t "in" the premises in an obvious sense — e.g., from "all men
  are mortal, Socrates is a man" you derive mortality of Socrates; but more pointedly,
  from logical truths alone you can derive... hmm. The key counterexample: if moral
  terms have descriptive content by definition or by identity (a posteriori necessity,
