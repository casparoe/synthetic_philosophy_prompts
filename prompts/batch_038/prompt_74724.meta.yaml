  Title: Disagreeing About the Question


  1. Setup. The debate between conciliationists and steadfast views is standardly
  staged on a case with a fixed architecture: you and an epistemic peer have reviewed
  the same body of evidence, you have come to believe P, they have come to believe
  not-P, and the question is what you ought now to do with your credence in P. Conciliationists
  say that discovering the disagreement requires you to move substantially toward
  your peer''s credence, in the limit giving the two judgments equal weight. Steadfast
  views deny this: on a total-evidence picture, the mere fact that a peer disagrees
  is not itself weighty enough to require revision, or is outweighed by your first-order
  grounds. Both camps then argue about the costs of their view — conciliationism is
  charged with spinelessness and with self-undermining, since its own recommendation
  is disputed by its peers; steadfastness is charged with arbitrary self-preference.


  My claim is that this shared staging already settles something it should not. Both
  sides assume that the two agents are answering one and the same question, so that
  the dispute is entirely about how to combine two answers. I want to argue that in
  a large and philosophically important class of cases the parties are not answering
  the same question — and not merely in the sense that their words mean different
  things.


  2. Partition mismatch. Suppose a judgment is a location within a partition: a set
  of mutually exclusive and jointly exhaustive hypotheses that the agent treats as
  the live options, with the sentence they utter reporting which cell they take the
  world to occupy. Two agents can share a vocabulary, share the evidence, be equally
  competent and equally sincere, and still be locating the world within different
  partitions, because they have drawn different distinctions among the live options.


  Consider two moral philosophers assessing an act. Mine is sensitive to a distinction
  between what the agent intended and what she merely foresaw; theirs does not draw
  that distinction at all, but is instead sensitive to whether the agent could reasonably
  have been expected to notice a risk, a distinction my partition collapses. Each
  of us is answering a well-posed question and each of us answers it competently.
  But there is no single query to which my confidence of 0.8 and their confidence
  of 0.2 are both answers.


  3. Consequence for conciliationism. If that is right, the conciliationist prescription
  is not merely costly but inapplicable. Averaging, halving the difference, giving
  equal weight — these are operations on numbers, and they presuppose that the numbers
  are attached to the same content. Where the partitions differ, the resulting figure
  is attached to nothing; it is not a credence in any proposition the agent could
  entertain. I stress that this is a technical complaint rather than a moral one.
  It does not depend on the spinelessness or self-undermining charges, and it bites
  before they get a chance to run.


  4. The positive proposal. The correct response to a mismatched-partition disagreement
  is not doxastic revision but partition negotiation: identifying which distinctions
  each side''s judgment is tracking, and asking whether the finer partition is worth
  what it costs in the reliability of the judgments made within it. Partitions are
  instruments; instruments trade resolution against reliability, and two instruments
  can be differently calibrated without either being defective. So partition mismatch
  can be reasonable on both sides even where there is a single true answer to the
  underlying substantive question. I take this to be a claim about the structure of
  inquiry, not a version of permissivism about credence.


