  Title: "Disagreement About the Question"


  Premise: The conciliationism/steadfastness debate is framed as: you and a peer,
  same evidence, you believe P, they believe not-P; what should you do with your credence?
  Both sides accept a shared background assumption: that the two of you are answering
  *the same question*, so that your doxastic states are commensurable — your 0.8 and
  their 0.2 are both answers to a single well-defined query, and the only issue is
  how to combine them.


  Claim: In many real disagreements, especially philosophical ones, the parties are
  not answering the same question. Not because they mean different things by their
  words (that''s the familiar verbal-dispute diagnosis, and I want to keep it separate),
  but because they are working with different partitions of logical space — different
  sets of mutually exclusive, jointly exhaustive hypotheses — and the same sentence
  can be a report of different cells of different partitions.


  Example: I think a case of acting is wrong; my peer thinks it''s permissible. But
  my judgment is sensitive to a distinction (say, doing vs. allowing, or intended
  vs. foreseen) that my peer''s partition doesn''t draw, while their judgment is sensitive
  to a distinction mine doesn''t draw (say, whether the agent could reasonably have
  been expected to notice a risk). Each of us is answering a well-defined question;
  the questions differ; and there is no fact about the "shared" question that we''re
  both approximating.


  Now, what follows? Two things:


  (1) Averaging is ill-defined. Conciliationism''s prescriptions — halve the difference,
  weight equally — presuppose that the two credences are attached to the same proposition
  in the same partition. If your 0.8 is a credence in "the act falls in cell A of
  my partition" and my 0.2 is a credence in "the act falls in cell B of yours," then
  equal-weighting the numbers yields a number attached to nothing. This is a *technical*,
  not a moral, complaint about conciliationism, and it applies before any of the familiar
  self-undermining or spinelessness objections get off the ground.


  (2) The right response to such a disagreement is not doxastic at all: it is to negotiate
  the partition. Ask which distinctions are doing the work, and whether the finer
  partition is *worth* the loss in reliability of judgment. This is where I want to
  make a claim that I think is not just a restatement of permissivism: partition mismatch
  can be rational on both sides even where there is a single true proposition, because
  a partition is a cognitive instrument, and instruments can differ in resolution
  and reliability without one of them being wrong.


