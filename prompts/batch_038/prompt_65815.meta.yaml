  Draft:


  I am a doctoral student in philosophy, and for next week''s perception seminar each
  participant has been asked to circulate a numbered list of their commitments about
  the relationship between cognition and perception, so that the others can attack
  it. Before I circulate mine I would like an audit. Here is the list as it currently
  stands:


  1. Perceptual experience is cognitively penetrable in the substantive sense: what
  a subject believes and wants can alter how things look to her, and not merely how
  she is disposed to report or judge what she sees.


  2. I hold a fairly demanding criterion for when an alteration counts as penetration.
  The test is counterfactual and content-specific: an experience is penetrated only
  if two subjects who differ in a given cognitive state, but are otherwise matched
  on proximal stimulation and on perceptual learning history, would differ in how
  things look to them in a way that tracks the content of that cognitive state. Arousal,
  alertness, and general resource allocation do not qualify.


  3. Applying that criterion, I think most of the stock demonstrations are misclassified.
  The expertise effects — what the radiologist, the ornithologist, and the wine taster
  are said to see — are matters of perceptual learning and of the deployment of attention,
  and so are excluded by the learning-history clause in (2). The same goes for the
  effects of fear and of arousal on apparent size and distance.


  4. I nonetheless believe penetration is real and not a merely verbal possibility:
  there are cases in which a verbal suggestion or a standing expectation changes the
  apparent colour or shape of an ambiguous figure, and these survive my criterion.


  5. Phenomenal character is exhausted by how things look. I do not believe in an
  extra layer of non-conceptual feel over and above the looks, and I do not think
  there is any phenomenological residue left over once all the looks have been specified.


  6. What makes a perceptual experience justify a belief is its phenomenal character.
  How things look is the justifier; the causal history of the experience matters only
  insofar as it affects how things look.


  7. Perception''s justificatory force depends on its independence from belief. That
  an experience is not itself an output of the subject''s theorizing is part of what
  entitles it to arbitrate between theories, and it is why perceptual disagreement
  is not merely a restatement of doxastic disagreement.


  8. Early vision is encapsulated: at the earliest stages, processing is not open
  to the subject''s beliefs and desires, and I want to keep that claim.


  Questions: which pairs of these are genuinely in tension and which only appear to
  be? Rank the genuine tensions by severity rather than reporting them as a flat list.
  For each, state what would have to be given up or weakened, and what the cheapest
  available revision is together with its cost. Finally, tell me whether there is
  a single revision that would resolve the most damage at once. I have no prior view
  about which of the eight is most expendable, and I would rather not be told that
  the list is merely under-described.


