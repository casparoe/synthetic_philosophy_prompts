  A reading group has spent a year on the lottery paradox (Kyburg''s thousand-ticket
  case) and the preface paradox (Makinson''s careful author), and the two camps in
  it have never actually engaged. Camp T holds a threshold view: to believe outright
  just is to assign credence above a contextually fixed threshold, and so it is perfectly
  rational for an agent''s belief set to be jointly inconsistent; what the paradoxes
  show is that consistency is not a requirement of rational belief. Camp C holds the
  opposite: rational outright belief must be jointly consistent and closed under obvious
  consequence, so the threshold premise is where the error lies.


  Write the joint statement their adversarial collaboration should have produced,
  in a form both could sign. Requirements:


  1. A numbered list of agreed claims: what both accept about the two cases as normally
  described; what both accept about the relationship between credence and outright
  belief short of the disputed premise; what both regard as desiderata on a solution;
  and which candidate solutions both jointly reject as cheats (say why — e.g., advising
  the agent to believe nothing).

  2. A disagreements table with, for each live disagreement, a neutral statement,
  then the statement as Camp T would phrase it, then as Camp C would phrase it, so
  each side recognizes its own view.

  3. Cruxes. At minimum treat: (a) whether deductive cogency has a functional role
  that credence cannot play; (b) whether a threshold can be set non-arbitrarily —
  high enough to exclude each individual lottery proposition, low enough to include
  ordinary empirical beliefs; (c) whether the two paradoxes stand or fall together.


  For (c), use the following framework, and record each camp''s predictions in advance
  rather than arguing. Note that the two standard cases differ along two dimensions:
  whether the "something must give" premise is known or merely highly probable, and
  whether the individual beliefs rest on a common statistical source or on many independent
  ones. That leaves four corners. The lottery occupies one (known, common source:
  it is known that some ticket will win, and the evidence for each is one uniform
  distribution); the preface occupies another (merely probable, independent: each
  claim was checked on its own). Ask the collaboration to fill in the other two corners
  and to specify, for each camp, what it predicts about them:


  - Corner 3: a raffle in which the prize may go unclaimed... (probable-only, common
  source). Is there still a paradox?

  - Corner 4: an author told by a reliable editor that exactly one claim in the manuscript
