  The heterogeneity problem: what do all pleasures have in common? Views: (1) phenomenal
  quality view (a single felt quality, "the pleasure sensation") — challenged by heterogeneity
  (warm bath, music, proving a theorem, sex, relief, schadenfreude — no common feel);
  (2) distinctive-feeling-but-distributed views; (3) desire/attitude views: to be
  pleased is to desire that the experience continue (Brandt, Heathwood), or to "take
  a liking to"; (4) dispositional/motivational views; (5) pluralism (Feldman? no,
  Feldman is attitudinal hedonism: pleasure is a propositional attitude of being pleased
  that p — that''s his way of solving heterogeneity); (6) the "feeling of satisfaction"
  view; (7) cluster concepts / family resemblance.


