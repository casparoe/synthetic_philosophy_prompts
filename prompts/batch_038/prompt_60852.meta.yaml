  \ the TTP/Treatise's arguments about the dangers of concentrating interpretive authority.\n\
  \nHmm. Which combination gives the best prompt? The instructions favor the procedure\
  \ type (\"pick whichever type you can combine best\"). Let me weigh:\n\nSpandrels\
  \ → reviewer triage procedure: strong, well-known but the \"in the weeds\" content\
