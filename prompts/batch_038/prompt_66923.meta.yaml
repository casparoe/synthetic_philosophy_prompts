  Design of the poem request:


  - Form: 12 lines, six couplets. In each of the first five couplets, the two lines
  are word-for-word identical — exactly the same words in the same order, nothing
  changed. So the reader literally can''t tell them apart; the only difference between
  them is their position, which is not a property of the words.

  - The sixth (final) couplet breaks the pattern: one word differs between the two
  lines. That single swapped word is the only asymmetry in the whole poem, and it
  must be a word that does no descriptive work — something like a name or a bare demonstrative
  ("this"/"that"/"here") — not an adjective or a quantity.

  - Content constraints: the poem should be about the two spheres without naming Leibniz,
  Black, "indiscernible," "haecceity," "identity of indiscernibles," "principle" —
  no jargon, no name-dropping. It should handle the relational-property escape route:
  any line true of one sphere is true of the other, including lines about distance/direction
  ("to the left of", "the first one you meet"), because there''s nothing to break
  the symmetry — no landmarks, no light source, no observer with a handedness to bring
  in. So mirror-descriptions fail.

