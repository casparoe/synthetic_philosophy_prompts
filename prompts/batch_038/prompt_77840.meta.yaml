  Option D: Causal exclusion and mental causation — dialogue between a non-reductive
  physicalist who thinks mental properties are causally efficacious via some strategy
  and an exclusion-sceptic. There are many strategies: the "causal relevance vs causal
  efficacy" distinction; the "proportionality" response (Yablo); the "interventionist"
  response (Woodward/Shapiro); the "token-identity plus property-realisation" response;
  the "causal powers" response; the "double prevention"/"causal exclusion is a special
  case" response. A dialogue in the weeds could be: a non-reductive physicalist who
  endorses interventionism about causation (counterfactual dependence under interventions)
  vs a Kim-style exclusionist who says interventionism just re-describes supervenience
  and can''t deliver efficacy. And inject a niche twist: a specific case — e.g., a
  mental property M realised by neural property N, with a physical effect P; the exclusionist
  says: if M and N both satisfy the interventionist condition for being a cause of
  P (since intervening on M is always a way of intervening on N), then the interventionist
  has no way to prefer M — "the exclusion problem becomes an exclusion problem about
  interventions". The non-reductive physicalist responds via proportionality (the
  intervention that changes M without changing other candidate causes is more proportionate)
