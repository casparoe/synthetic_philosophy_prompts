  Actually a nice non-obvious tension in luck egalitarianism: holding (i) that the
  point of equality is to neutralise brute luck, (ii) the "expensive taste" verdicts
  — that the person who cultivated expensive tastes is on the hook but the one with
  unchosen expensive tastes gets compensation, and (iii) that we should not redistribute
  to compensate someone for a bad option-luck gamble because they chose the risk with
  full information, and (iv) a commitment to the idea that equality should be measured
  against a "starting gate" so that once a distribution is just at t, later divergences
  are fine. The tension between starting-gate theories and pattern-based luck neutralisation
  is real and somewhat in-the-weeds (Dworkin''s starting gate vs end-state pattern;
  Wilt Chamberlain-style objection). Also the tension: (i) brute/option luck distinction
  is about the agent''s actual beliefs and risk information, and (iii) claim that
  responsibility must be assessed from an objective standpoint (the agent "should
  have known") — a genuine tension, since objective vs subjective responsibility cuts
  against the brute/option luck distinction (e.g., someone who takes a risk with no
  evidence of danger and gets hurt: subjectively it''s option luck, objectively they
  were reckless; conversely someone who takes due care but has bad luck — is that
  brute luck? On the objective view they were still gambling). This is a real debate
  (the "thinness of option luck" problem; also that option luck collapses into brute
  luck because the choice itself is a matter of brute luck — Lippert-Rasmussen; also
  "the choice of the gamble is itself luck"). Hmm.


  Option B: Aesthetic testimony — dialogue type. Dialogue between a pessimist about
  aesthetic testimony (e.g., someone who thinks aesthetic judgement requires first-hand
  acquaintance — Hopkins''s "acquaintance principle") and an optimist (someone who
  thinks aesthetic testimony can transmit knowledge / who thinks there''s no special
  epistemic problem). But the dialogue needs to be in-the-weeds. Could inject: a case
  of a critic''s testimony about a film you can''t see, or the "deferred aesthetic
  judgement"/"expert testimony" case. Interesting in-the-weeds angle: the tension
  between the acquaintance principle and the fact that aesthetic testimony seems to
  give genuine epistemic support for beliefs about non-evaluative aesthetic properties
  (e.g., "the painting is symmetrical", "the novel''s third act is rushed"). A good
  dialogue could turn on whether the problem is specifically about aesthetic *belief*
  vs aesthetic *appreciation* — i.e., whether testimony fails to transmit justification
  or merely fails to transmit something else (the ability to appreciate/see for oneself).
  That''s a nice distinction: transmission of propositional knowledge vs transmission
  of the capacity for first-hand aesthetic experience. Also there''s the "testimony
  about the aesthetic value of a work you''ve read" case — the puzzle of whether you
  can know a work is good from testimony and yet your aesthetic judgement still requires
  your own experience; and whether the pessimist''s argument proves too much (it would
  also undermine testimony in ethics, testimony about pain, etc.). Dialogue type could
  work well: two museum-goers, one who trusts a review, one who doesn''t.


  Option C: Scanlon''s contractualism and aggregation — dialogue type. A dialogue
  between a Scanlonian who rejects aggregation (each person''s complaint must be considered
  individually; you can''t sum) and an aggregation-friendly contractualist (e.g.,
  someone who wants to allow that many small burdens can outweigh one large harm,
  or who argues Scanlon''s own "pairwise comparison" leads to counterintuitive results
  in the "numbers" cases). Interesting in-the-weeds specifics: Scanlon''s aggregation
  case with headaches vs a life saved (the TV broadcast / World Cup example — Scanlon''s
  example in "Who does morality condemn"? Actually the famous example is Scanlon''s
  discussion in "Contractualism and Utilitarianism" of saving one person''s life versus
  avoiding a billion headaches, where he asks whether the intuition that we should
  avoid the headaches depends on aggregation or on a sense of how awful a billion
  headaches would be). Also the "balancing argument" and Scanlon''s rejection of it
  in favour of a "complaint-indexed" pairwise comparison. Also the numbers problem:
  why save the greater number in cases of equal harms? Scanlon''s answer: the tie-break
  argument (each of the many can complain that you didn''t save them, and no one complaint
  is stronger than any other, so you should save the many — actually his argument
  is that if harms are equal, no one''s complaint is stronger than anyone else''s,
  so it would be arbitrary to ignore the many; the many each have an equally strong
  complaint). Then there''s the "aggregation within one life" and the "multiple small
  burdens to many vs one large burden to one" — Voorhoeve''s case of "aggregation
  and the separateness of persons" — and there''s the well-known worry: if pairwise
  comparison says you must save the one from death over the many from headaches, does
  contractualism then commit you to a "level-down"/"no trade-offs at all" view where
  you can''t justify saving the many from a slightly-less-bad fate? The "aggregation
  problem" for Scanlon: the "many with migraines vs one with a headache" transitivity
  problem — pairwise comparisons can be intransitive, generating cycles (e.g., the
  "Aggregation and the separateness of persons", or the specific cycle problem discussed
  by Johann Frick: "Contractualism and Social Risk", and the "numbers problem"). A
  genuinely in-the-weeds issue: the transitivity/cycle problem for Scanlon''s pairwise
  comparison principle — if you compare A vs B, B vs C, A vs C you may get cycles,
  so contractualism''s "justifiability to each on grounds no one could reasonably
  reject" may be silent or contradictory when more than two options and many people
  are involved. That is a real, meaty issue (Johann Frick''s "Contractualism and the
  Impersonal Standpoint", and also the "aggregation problem" literature: Scanlon''s
  "What We Owe to Each Other" ch. 5; Johann Frick 2015 "Contractualism and Social
  Risk" Philosophy & Public Affairs; Voorhoeve; Wallace; Kumar).


