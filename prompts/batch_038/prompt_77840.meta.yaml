  Let me build the luck-egalitarian set carefully, ordering commitments so that the
  tensions are real:


  The asker''s position (a "political philosophy reading group" framing, casual tone,
  one or two typos):


  1. Core: distribution should track responsibility, not luck. "insensitive to brute
  luck, sensitive to option luck" — the standard formula.

  2. Currency: resources, not welfare — because welfare is contaminated by adaptive
  preferences and by expensive tastes people cultivate.

  3. The expensive-tastes verdicts: cultivated expensive taste → no compensation;
  unchosen expensive taste (or a disability) → compensation.

  4. Responsibility is objective: what matters is whether the person could reasonably
  be held to have chosen the risk — i.e., a properly informed, adequately controlled
  choice — not merely whether they thought they were gambling.

  5. Starting-gate: justice is about the start; equal initial shares, and what free
  exchange does afterwards isn''t a distributive-justice issue.

  6. Rejects the harshness objection: it''s not unjust to leave the imprudent without
  compensation; respect for choice entails it. But also (7) endorses an unconditional
  floor guaranteed on grounds of equal citizenship/humanity, not distributive justice.


  Now tensions:


  Genuine T1 (4) vs (1)+(3): The objective-responsibility standard collides with the
  brute/option distinction, which is defined subjectively (was it a gamble the agent
  knowingly took?). Case: a careful, well-informed driver who takes every precaution
  and still hits a black-ice patch on a road with a known but low risk of icing. Subjectively
  she gambled (she knew the risk, she chose to drive) → option luck → no compensation.
  Objectively, she did everything a reasonable person would → not her responsibility
  → compensation owed. Her principle can''t deliver both. Conversely the reckless
  driver: no evidence of danger, drives wildly, crashes — subjectively not a gamble
  at all (he had no belief about risk), so it''s brute luck by the standard definition;
  objectively he''s reckless. So the brute/option distinction and objective responsibility
  cross-cut each other in both directions. That''s a genuine, non-obvious tension
  and it''s in the weeds (the "thinness of the brute/option distinction" literature
  — e.g., the observation that whether something is a gamble depends on the description
  and on background beliefs).


  Genuine T2 (1)+(2)+(3) vs (5): starting gate vs continuous luck-tracking. Case:
  two people get equal starting shares; ten years later one is struck by lightning
  / develops a degenerative illness through no fault of their own. (1) says the distribution
  now tracks brute luck and is unjust, demanding compensation; (5) says nothing more
  is owed since the start was equal. And note the deeper problem: (5) makes the pattern
  historical while (1) is end-state. Cheapest fix: the hypothetical-insurance device
  — treat the starting share as already priced for foreseeable brute bad luck, so
  the gate handles later contingencies; cost: you have to give up that later divergence
  is irrelevant, i.e., you have to build ongoing insurance into the gate, which makes
  the starting gate do continuous work.


  Apparent tension (6) vs (7): looks like a contradiction (abandoning the imprudent
  while guaranteeing a floor) but dissolves: they''re different registers — distributive
