  Spinoza commitments audit: A reader says: "Here''s my view of Spinoza''s politics
  and I want a consistency check: (1) I read the TP as saying democracy is ''most
  natural'' because in it each transfers their power to the whole society of which
  they remain a part, so the sovereign is the multitude itself; (2) I think Spinoza
  is a thoroughgoing necessitarian/determinist, so there is no free will — everyone''s
  actions follow from the causal order; (3) I hold that this is why Spinoza thinks
  political freedom is not about the ability to do otherwise but about acting from
  reason/being in a state where you''re least subject to another''s will; (4) I also
  think Spinoza''s defence of freedom of thought in the TTP rests on the impossibility
  of the state controlling minds; (5) but I also think Spinoza''s state is supposed
  to shape citizens'' affects through law, education and the ''honour/reward'' mechanism,
  since obedience is produced by passions." Tension between (4) and (5): if the state
  can''t control minds, how does it shape affects? Actually the resolution: the state
  can''t control *judgement/belief* (the mind''s ideas are caused by ideas) but can
  control the *passions and the environment* that shape which affects dominate, and
  can shape beliefs indirectly by controlling incentives and education — this is a
  real interpretive issue. Is it a genuine tension or an apparent one? Arguably it
  dissolves: the state cannot directly cause beliefs, but beliefs are caused by other
  beliefs/affects, and the state can arrange external circumstances that determine
  which affects get associated with which ideas — so it can control minds indirectly,
  which undermines the TTP''s argument''s strength (a well-known criticism: Spinoza''s
  claim of uncontrollability of minds is in tension with his own account in TP ch.
  10 of how to shape citizens'' minds). This is a nice in-the-weeds point that a small
  model could handle with the right framing but couldn''t regurgitate from a stock
  "Spinoza''s political philosophy" essay.


  Alternatively: a Spinoza commitment set could include the tension between "democracy
  as the absolute/most natural form of state where sovereignty is identical with the
  multitude''s power" and "Spinoza''s exclusion of women from citizenship in TTP ch.
  11" and "his claim in TP that democracy''s advantage is that it''s less likely to
  be irrational because a large assembly''s decrees are more rational." Hmm — the
  exclusion of women could be brought in as: (a) Spinoza grounds citizenship in natural
  power/right, (b) women are excluded from citizenship on grounds of their alleged
  natural inferiority in TTP, (c) but Spinoza''s natural right is power, so exclusion
  must be justified by power — and the exclusion argument rests on a contingent historical/natural
  claim about men''s greater "power over women", which arguably contradicts (c)? Actually
  Spinoza''s argument in TTP ch. 11 is: if women were equal to men in strength and
  in ability of mind — the things that make human power and freedom — they''d be equal
  in right; but experience shows they aren''t. So the exclusion follows from the natural-right
  = power doctrine plus a false empirical premise. That''s a "false empirical premise"
  problem, not a structural inconsistency. Less interesting.


  Now, luck egalitarianism commitments audit. Let me draft a set that contains a genuine
  non-obvious tension plus an apparent one that dissolves.


  Candidate commitments:

  (1) Justice requires that distributions be sensitive to choice and insensitive to
  luck (the canonical luck-egalitarian formula).

  (2) So: the person who develops expensive tastes through their own choices (e.g.,
  learns to love fine wine) is not owed compensation, while someone with an unchosen
  expensive taste or a congenital disability is owed compensation.

  (3) I think "option luck" — the outcome of a deliberate gamble — is on the choice
  side, so someone who loses a fair bet isn''t owed compensation, and the brute/option
  luck distinction is doing real work.

  (4) But I also hold the "objective" view of responsibility: what matters for justice
  is whether the outcome flowed from a choice the agent could reasonably be held to
  (a choice made with adequate information and adequate control), not merely whether
  the agent believed they were gambling. Hmm — then combine (3) and (4) to create
  a case-verdict tension: the reckless driver case (someone who drives without due
  care, no evidence of risk, and crashes — subjectively not a gamble, objectively
  reckless); or the inverse: the careful gambler who takes all due precautions but
  suffers a rare harm (objectively not their fault, subjectively they knew the risk).
  Under (1)+(3) with a subjective reading, the reckless driver bears the costs (they
  gambled); under (4) with an objective reading, the careful driver who took all reasonable
  precautions but knew of a small risk must be compensated... Actually there''s a
  neat asymmetry: the person who takes due care but suffers an unusual bad outcome
  is unlucky in a way that (3) calls option luck (they knowingly risked) but (4) says
  isn''t their responsibility. So the stated principle (1)+(3) can''t deliver the
  verdict (4) demands. That''s the "case verdict the asker''s stated principle cannot
  deliver" requirement.


  Genuine tension #2: (5) I endorse a starting-gate view: justice is about how the
  race begins, so once a distribution satisfies equality of starting points, subsequent
  inequalities generated by free exchange are just (Dworkin''s starting gate / a la
  Wilt Chamberlain). But (1) is an end-state pattern principle: distribution must
  continuously track luck. If a starting-gate distribution is just at t0 but at t1
  someone suffers brute bad luck (e.g., gets struck by lightning, or develops a disability
  — a paradigm brute luck event that occurs after the gate), then (1) demands compensation
  while (5) says nothing more is owed. So (1) and (5) collide: luck egalitarianism
  as a continuous pattern vs. historical/starting-gate justice. And the deeper tension:
  the brute/option distinction requires ongoing luck-neutralisation, whereas a starting-gate
  view says only the initial endowment must be luck-insensitive. This is a real, somewhat
  in-the-weeds tension (Dworkin''s starting gate is about resource shares, and Dworkin
  also has the insurance scheme to handle later brute luck — so a Dworkinian would
  say the starting gate is supplemented by an insurance market; that gives the "cheapest
  fix": adopt the hypothetical insurance device so that later brute luck is priced
  in at the gate).


  Apparent tension that dissolves: (6) "I reject the harshness objection: it''s fine
  that justice doesn''t rescue the imprudent, because leaving them to their choices
  is what respecting them requires" vs (7) "I also think there should be a social
  minimum/no one should be left destitute, and I ground this in something other than
  justice (e.g., a duty of beneficence/humanity, or a claim about equal status)."
  These look contradictory (abandoning the imprudent vs guaranteeing a floor) but
  dissolve: the standard luck-egalitarian move is that the floor is owed on grounds
  of justice-as-equality-of-status or humanitarian duty rather than distributive justice,
  so no inconsistency — although there is a further cost (the floor becomes a matter
  of charity, which the harshness-objectors say is disrespectful). Hmm, the "dissolve"
  needs to be robust: I''d rather make the apparent tension one where the asker thinks
  two commitments clash but actually they don''t because they operate at different
  levels (pattern vs. procedural; justice vs. humanity; ideal vs. non-ideal).


  Another apparent tension candidate: (8) "I think the currency of justice is resources,
  not welfare, because welfare is contaminated by expensive tastes and adaptive preferences"
  vs (9) "but I do think that compensation for disability should be based on how much
  the disability actually reduces a person''s ability to pursue their conception of
  the good" — these look like a welfarist smuggle but actually dissolve if the metric
  is "functionings/capabilities" — hmm, no, that''s a real substantive shift, not
  a dissolution. Better: keep the currency commitment as resources, and have an apparent
  tension with "I also think we should compensate people for social oppression / for
  being victims of others'' wrongdoing, which seems to be about a different kind of
  claim than luck". Does it dissolve? Compensation for wrongful harm is a corrective-justice
  matter that luck egalitarians can accommodate: being wronged is brute bad luck from
  the victim''s perspective but generates a claim against the wrongdoer rather than
  a distributive claim. That''s a nice apparent tension that dissolves once you see
  that the two claims operate in different registers (corrective vs distributive).


  Also: the "social oppression" case raises a real tension for luck egalitarians:
  if a woman''s lower income is caused by sexist social structures, is that brute
  luck (compensable) or option luck (she chose to work part-time)? The distinction
  depends on the social context, and if the context is itself unjust, the luck-egalitarian
  framework seems to presuppose the very thing it''s supposed to evaluate — that''s
  a genuinely in-the-weeds tension (the "luck egalitarianism is parasitic on a prior
  account of justice / background conditions" objection).


