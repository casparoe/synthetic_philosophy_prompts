  ---


  I run a monthly argument-night thing at a bookshop, ~14 people, mostly non-academics,
  and next month we''re doing Tolstoy''s What Is Art?. I don''t want the usual "he
  hated Shakespeare so he must be an idiot" half hour, so I''m putting together a
  scorecard of objections to the infection theory and getting the room to vote on
  how much damage each one does before I reveal my own ranking. I want yours first
  so I have something to argue with.


  Here are the objections as I''ve phrased them:


  1. Channel — infection only happens if the receiver is already disposed to catch
  the feeling, so what the theory actually measures is a fit between work and audience,
  not a property of the work. Two people, same piece, one infected one bored: which
  one decides whether it''s art?

  2. Sincerity''s privacy — Tolstoy makes sincerity the decisive condition of quality,
  but sincerity isn''t observable from the outside, and a forger who convinces everyone
  is indistinguishable from the sincere one. The criterion either collapses into "it
  worked" or it''s a claim about souls that no critic can check.

  3. The self-refutation by output — the theory ranks a village lament or a parable
  about forgiveness above the novels the theory''s own author wrote, and he apparently
  accepts the ranking. So either he''s right and his life''s work is second-rate (which
  his own feelings about it suggest he half-believed), or he''s wrong and the theory
  has just condemned its author''s best evidence.

  4. Form goes missing — nothing in the account explains why the transmission has
  to be through this particular arrangement of words or sounds. If what matters is
  that the feeling arrives, the summary of a story should be as good as the story.

  5. Bad infection — plenty of works transmit feeling with total clarity and sincerity
  and unite their audience around something horrible. Tolstoy has a content criterion
  (the religious perception, brotherhood of people) to filter these, but then the
  definition of art and the evaluation of art have come apart: the horrible work is
  art, just bad art, which is not what the infection story sounded like.

  6. Instrumental music — a lot of music transmits no identifiable feeling that anyone
  could name before or after, yet Tolstoy wants music to be the paradigm case of infection.


  Rate each on two axes, 0–10: how much damage it does to infection theory as a *definition*
  of art, and how much damage it does to it as a *criterion of value*. Give me both
  numbers per objection, then one ranking of the six by overall damage, and one or
  two sentences per objection saying what makes it land or not. Then tell me which
  single objection I should put first in the room for maximum damage, and which one
  sounds devastating to amateurs but is actually the easiest for a Tolstoyan to answer
  — I want to be able to spring that one.


  Finally: what''s your honest estimate, as a fraction, of the chance the room ends
  the night thinking the theory is worth keeping in some form rather than discarding?


