  ---


  I am drafting a chapter for an edited volume on philosophy and literature, arguing
  that Kazuo Ishiguro''s The Remains of the Day is best understood as a novel about
  the metaphysics of causation by omission, and I would like your help stress-testing
  that claim before I commit to it in print.


  First, the philosophical terrain as I am framing it. Whether an omission can literally
  be a cause is contested. Lewis''s counterfactual account appears to make absences
  causes, at the price of promiscuity: if the butler''s silence caused the maids''
  dismissal, then so did the silence of every other member of the household, of every
  guest at the conference, and of every reader in the world who did nothing. Beebee
  denies that omissions cause anything while insisting they still figure centrally
  in causal explanation. Schaffer makes causation contrastive, so that an omission
  causes an outcome only relative to a specified alternative. Dowe''s conserved-quantity
  account leaves omissions outside causation proper, as a close relative of it. And
  Hart and Honoré, approaching from law, tie absence causation to departure from a
  norm or standard of normal functioning: the omission causes the harm because the
  person was supposed to act and was in a position where acting was the expected condition.


  Then the novel. [Summarize the relevant episodes without quoting: 1923 conference
  and the father''s death upstairs while Stevens continues serving; the dismissal
  of the two Jewish maids at Lord Darlington''s instruction, with Miss Kenton''s protest
  and Stevens''s compliance and his later attempts to minimize it; the 1936 informal
  conference and the appeasement project, in which Stevens''s contribution is largely
  a matter of not objecting, not informing, not warning; the repeated failure to acknowledge
  Miss Kenton''s feelings, culminating in the 1956 journey to the West Country and
  her marriage to another man; the ending on the pier, where Stevens resolves to work
  at bantering.]


  Questions I want answered:


  1. For each of these episodes, does the narrative''s own causal bookkeeping treat
  the omission as a cause of the outcome, in a sense precise enough to be philosophically
  interesting? Where does it treat it as merely causally explanatory, or as nothing
  at all?


  2. Which of the accounts above best fits the novel''s practice, and what in the
  text discriminates between them? I am particularly interested in whether the contrastive
  account is covertly already at work in the narration — Stevens''s characteristic
  move is to name a specific alternative he declined ("I might have said X") rather
  than the open class of everything he did not do, and I want to know whether that
  is a real datum for Schaffer-style contrastivism or just a stylistic habit.


  3. The Hart and Honoré line looks tailor-made for a world of duties, standards,
  and professional role. Does the novel vindicate a norm-based account of absence
  causation, or does it expose the account as an attempt to smuggle moral and legal
  judgment into metaphysics? Note that Stevens''s entire self-conception consists
  in insisting that the relevant standards are those of the great house and not his
  own.


  4. A further complication I cannot resolve: many of Stevens''s silences are better
  described as actions — compliance, deference, the performance of a role — than as
  omissions. Does the novel blur the doing/allowing distinction, or does it depend
  on it? If his failures to speak are really things he does, does the book lose its
  claim to be about omission causation at all?


  5. The narration is systematically evasive, and the causal inventory is delivered
  only by a narrator who has reasons to suppress it. Does that create a problem for
  any of the metaphysical accounts (they are supposed to be about the world, not about
  reports of it), or is it a resource — for instance, for the idea that which contrast
  is relevant is not fixed until the narrator, thirty years later, supplies it?


  6. Tell me frankly where the reading overreaches. Identify at least two respects
  in which the novel is doing something other than taking a position on negative causation,
  and where an honest critic must retreat from my thesis.


  7. Finally, what does the book contribute to the debate that argument has not? I
  have a suspicion that it has something to do with the fact that the agent discovers
  only retrospectively that what he did was an omission, and that the alternatives
  he declined become visible only once they are no longer available — but I would
  like that either developed or dismantled.


  Please do not quote the novel at length; I have the text and want analysis rather
  than recitation. I would rather have disagreements with my framing than confirmation.


