  Disanalogies that matter:

  - Ulysses at the mast is fully informed and retains memory; he knows which moment
  he''s in. The driver''s problem is precisely that he cannot tell where he is. So
  the "temptation" is not a preference change (Ulysses''s desire to be untied comes
  from the song''s effect on his preferences) but an information deficit. The driver''s
  preferences don''t change at all — he always wants the 4/3 plan; he just can''t
  implement it because he doesn''t know which intersection he''s at and each of his
  local decisions is made under a belief (3/5 first, 2/5 second) that isn''t the belief
  of the planner.

  - Ulysses''s commitment works because the sailors are a separate, memory-intact
  agent who execute the plan while Ulysses''s hands are tied: the plan requires a
  distinct executor. The driver has no sailors; he must execute it himself, at a moment
  when he can''t tell whether he''s already executing it. In the standard setup the
  mixed strategy p is supposed to be implemented "once and for all" — a behavioral/randomized
  commitment made at the planning node. Whether that''s physically possible (can you
  commit to a random device and then forget the outcome? and if you''re absent-minded,
  is your behavior at each intersection independent?) is exactly what''s contestable.

  - The rope is not observable: Ulysses can verify he''s tied; the driver can''t verify
  anything at the intersection.

  - Time structure: Ulysses''s story has a single temptation episode; the driver faces
  two decision nodes that are indistinguishable, so the "temptation" happens possibly
  twice, and the second instance is the one that actually matters.

  - What the analogy smuggles in: a two-self model (planner-self vs. tempted-self)
  which suggests the driver''s problem is about weakness of will / conflicting selves,
  and thus that the fix is to suppress the later self. But in the driver case there''s
  no conflict of desire; there''s a conflict between an ex ante probability and an
  interim self-locating credence. The analogy thereby licenses the conclusion "commitment
  always dominates local choice," which in the driver case is true only for this particular
  payoff structure — for other imperfect-recall games, action-optimal behavior can
  be better (Piccione-Rubinstein discuss the interpretation issue; also the "planning-optimal
  vs action-optimal" gap isn''t always in favor of planning).


  Also: the analogy smuggles in that the plan is knowable/verifiable and that commitment
  is costless and enforceable, whereas in the driver case, whether a mixed commitment
  can be implemented at all is questionable: an agent who is absent-minded at the
