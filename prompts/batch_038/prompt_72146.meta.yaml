  Design:

  - Domain: Bentham''s views on sexual morality.

  - Type: Present a position and ask what would count against it.

  - Asker: PhD student (say, third-year, in history of philosophy / utilitarian studies)
  working on Bentham''s moral psychology and the unpublished essay on pederasty.

  - Position: an interpretive-philosophical thesis: Bentham''s decriminalising verdict
  on same-sex acts between consenting adults is not a contingent concession but follows
  from the same machinery that yields his treatment of drunkenness and prodigality
  as "offences against oneself" — i.e., the exculpation is systematically entailed
  by the principle of utility once the principle of sympathy and antipathy is excluded
  as a ground of punishment, so that any utilitarian who accepts Bentham''s account
  of self-regarding imprudence is committed to it.

  - Injected niche element: the asker''s own reconstruction, which they label: the
  thesis requires (i) a "competence premise" (the parties are competent judges of
  their own net pleasure) and (ii) an "alarm discount" (pain of disgust in third parties
  is excluded from the calculus when it is produced by nothing but the bare belief
  that the act occurs). The asker notes that these two do most of the work, and worries
  whether the thesis is then unfalsifiable, because a utilitarian could always restore
  the alarm term or withdraw competence.

  - Ask: what would count against it, ranked from fatal to merely awkward; which considerations
  a committed defender would concede (e.g., that Bentham elsewhere treats the mischief
