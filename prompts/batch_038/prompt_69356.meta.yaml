  Question: "Short answer (10 points): State the ticking-time-bomb objection to an
  absolute prohibition on torture, and explain how one defender of the prohibition
  can respond. Your response must distinguish the response you discuss from the claim
  that torture is simply ineffective."


  Student answer: something like:


  "The ticking time bomb case says: suppose you''ve caught a terrorist who knows where
  a bomb is that will kill thousands, and it will go off in an hour. An absolute rule
  against torture says you can''t torture him even though torturing him is the only
  way to find out where the bomb is and save thousands of lives. So the absolute rule
  tells you to let thousands die for the sake of keeping your own hands clean, which
  seems obviously wrong. This shows that moral rules like ''never torture'' can''t
  be absolute — they have to have exceptions at some threshold, which is the view
  called threshold deontology: below the threshold the rule holds, above it you just
  do the consequentialist thing.


  There are two main ways to resist this. The first is the slippery slope / institutional
  one: even if torture in the exact case is OK, allowing it means training torturers,
  building institutions, doctors signing off, and the exceptions swallow the rule,
  so it''s better to have an absolute rule as a social practice. The second is the
  ''dirty hands'' response: you go ahead and torture, but you''re still guilty of
  doing something wrong, and a good politician accepts the guilt rather than pretending
  he did the right thing. So dirty hands agrees with the consequentialist about what
  to do but denies that it was morally right, which is basically the same thing threshold
  deontology says above the threshold.


  Also, the reason the case is so powerful is that it builds in certainty — you know
  for sure he''s the bomber and sure the torture will get the info. That proves torture
  actually works when the stakes are high, which is why the ticking bomb case is the
  one case where even people who oppose torture in general make an exception."


