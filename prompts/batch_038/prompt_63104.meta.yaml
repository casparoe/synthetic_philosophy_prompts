  **Deliverable spec:**

  1. A decision tree, not an essay. Each node = one question answerable by the speaker
  about their own case (mental state, signification, whom they intend to affect),
  not about consequences.

  2. Each branch labelled by the claim that separates it.

  3. Leaves named in Augustine''s own vocabulary where he has one (mendacium and its
  grades, the jocose utterance, error/opinion, concealment), and marked "unnamed"
  where Augustine supplies no term — with a one-sentence diagnosis.

  4. Constraint: no node may ask about outcomes, harm avoided, or proportionality;
  the tree must be answerable without knowing whether the case will end in a lie.
  Also, no node may ask the speaker to consult their moral theory.

  5. Constraint on the ordering: the tree should sort *whether it is a lie at all*
  before *how grave the lie is* — mirroring Augustine''s own priority (he spends much
