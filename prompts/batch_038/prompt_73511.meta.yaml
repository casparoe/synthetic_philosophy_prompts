  Draft:


  "I chair a research group in philosophy of mind and philosophy of biology, and this
  term I am convening an adversarial collaboration between two colleagues who have
  been talking past each other for years over the question Hofstadter poses through
  Aunt Hillary: whether an ant colony can be a subject of experience, with its mental
  life standing to the individual ants as ours stands to our neurons. One is a [camp
  A: "bounded-subject" view / integrationist] holding that a subject of experience
  requires a single, spatially contiguous, self-monitoring system whose parts communicate
  fast enough to be bound into one perspective at a time — on which a colony is at
  most a clever thermostat writ large, and the intuition that it might be conscious
  rests on mistaking adaptive self-organisation for a point of view. The other is
  a [camp B: functional pluralist] holding that nothing in the concept of a subject
  requires a skull, a nervous system, or a particular transmission speed, that the
  colony satisfies the same functional marks we would accept in an animal — division
  of labour, homeostatic regulation, flexible collective decision-making, memory traces
  distributed across the trail network and the nest architecture — and that the integrationist
  is simply re-describing mammalian brains as the criterion of mind.


  Before the first session I want to put a draft joint statement in front of them,
  so that the argument is about the wording rather than about the structure. Please
  draft it, in British English, as follows:


  (1) A numbered section of claims both can sign. These should be substantive rather
  than diplomatic — claims about what colonies do, about what the concepts of a subject,
  of experience, and of representation commit us to, about what the two of them agree
  would count as finding a mind, and about which popular ways of framing the question
  (Block''s thought experiments about vast populations of Chinese citizens; the ''hard
  problem''; panpsychist inflation) they both regard as unhelpful. Careful: if a claim
  is only acceptable to one side under a stipulation, record the stipulation.


  (2) A table of disagreements. For each, give the precise statement of the disagreement
  in wording each side would accept for its own position, and mark whether it is a
  disagreement about the world, about the concept, or about words. I expect at least
  one row to be diagnosed as merely verbal — say which, and why — and at least one
  to be genuinely irresolvable by further evidence.


  (3) The cruxes: the sub-questions such that settling one would actually move at
  least one party. I have my own hunches, which you may revise: (i) whether colony-level
  processes are too slow to be bound into anything like a unified perspective, and
  what the temporal grain of a subject must be; (ii) whether the colony has any self-representation
  — anything that could play the role that a body schema plays for an animal — or
  only third-personally ascribable functional structure; (iii) whether the colony''s
  distributed ''memory'' is genuinely colony-level or nothing over and above the habits
  of individual ants plus the layout of the nest; (iv) whether there is any fact of
  the matter about the colony''s beliefs independent of an interpreter''s charitable
  ascription.


  (4) For each crux, a test, case or argument that both parties accept as bearing
