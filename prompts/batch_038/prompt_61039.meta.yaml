  Subtle misrepresentations to embed:

  1. Conflation of the genetic/associative claim (Enlightenment thinkers also wrote
  racial taxonomy) with the constitutive claim (universalism as such encodes exclusion).
  The friend says the critics claim the latter follows from the former, but most careful
  critics hold the constitutive claim in a narrower form: that the *particular historical
  content* given to "the universal" was provincial, not that universality per se is
  exclusionary. Actually many critics (e.g., in the immanent tradition) insist the
  opposite — that universalist norms contain resources for emancipation (this is where
  someone like Chakrabarty''s "provincializing Europe" is often misread as rejecting
  Europe).

  2. "So their conclusion is that we should stop appealing to universal reason at
  all" — this overstates a modest thesis and attributes a normative abandonment that
  most such critics explicitly reject; many argue for redeploying/provincializing
  rather than abandoning.

  3. "You can''t separate the good from the bad because the bad isn''t accidental"
  — this treats a dialectical/entwinement claim as a simple monolith claim; the critics''
