  Answer draft (~500 words):\n\n\"Boorse's aim is to give an account of disease that\
  \ belongs to theoretical medicine rather than to social practice: a description\
  \ of what is wrong with an organism that could be endorsed by a physiologist without\
  \ any appeal to what anyone values. The account does this by defining health as\
  \ normal functioning and disease as its absence, and then explaining normality statistically.\n\
  \nA function, for Boorse, is a typical causal contribution made by some part or\
  \ process of the organism to one of two high-level goals, namely the survival of\
  \ the individual and its reproduction. What the functions of the heart, the nephron\
  \ or the thyroid are is therefore an empirical question answered by physiology;\
  \ nothing about which effects a part has, or how efficiently it produces them, is\
  \ settled by anybody's attitudes. Disease is then a type of internal state that\
  \ depresses one or more such functions below the level typical of the organism's\
  \ reference class — a class fixed by age and sex, and by race where there is evidence\
  \ of relevant functional difference. The statistical element does important work:\
  \ it is what prevents Boorse from having to say that any departure from an optimal\
  \ functional profile is pathological, since what counts is departure from the typical,\
  \ not from the best.\n\nThe evaluative content of medical practice is discharged\
  \ by a different concept. Illness, on this picture, is the normative counterpart\
  \ of disease: roughly, a condition that is disvalued, that incapacitates or that\
  \ constitutes a reason to seek treatment. Boorse can therefore hold, without contradiction,\
