  The question was:


  Q3 (20 points). (a) State Lewis''s Principal Principle as precisely as you can.
  (b) Some people object that the Principal Principle could be made true by stipulation:
  just define objective chance to be whatever an ideally rational agent''s credences
  are, and the principle becomes trivial. Explain what this objection is getting at,
  and why Lewis thinks the principle is nonetheless substantive. (c) Suppose, with
  Lewis, that chances supervene Humeanly on the total pattern of particular matters
