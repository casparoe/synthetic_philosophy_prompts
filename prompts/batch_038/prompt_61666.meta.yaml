  better to avoid or keep it minor).


  2. The student says the admissibility requirement means the extra evidence E must
  be about the past — that''s wrong: admissibility is not about being past-tensed;
  Lewis says the total history of the world up to the time is admissible, and also
  chance hypotheses, but some future-tense info is admissible too, and some past info
  can be inadmissible (e.g., about a chance process''s outcome? no...). Actually the
  key subtlety: admissibility is defined by PP itself (circularity) — info is admissible
  iff conditionalizing on it, PP applies; a "big bad bug" case (Hall 1994) shows some
  information that is not inadmissible-by-intuition breaks PP, requiring the New Principle
  / BCP. The student could conflate "admissible" with "past-tensed" or with "not about
  the future". That''s a good subtle mistake.


  3. The student claims that PP tells us chance is defined as the credence of an ideal
  rational agent — i.e., inverts the direction (chance → credence). Related to triviality.


  4. The student says that undermining shows PP is false because Humean chances depend
  on future frequencies, and since we have admissible evidence about... hmm. A subtle
  error: claiming that the possibility of undermining means chance statements are
  incompatible with PP, i.e., that PP entails credence 0 in the chance hypothesis
  being undermined... The standard point: with Humean chance, some possible future
  histories are compatible with the chance hypothesis being true but have chance 0,
  and PP then requires credence 0 in them, contradicting the requirement (from the
  chance hypothesis being admissible evidence + total evidence) that they get positive
  credence. A student might say instead that the problem is that PP is circular, or
  that the problem is chance doesn''t supervene at all — a misdiagnosis.


