  the Reflection Principle — or that PP says you should now have the credence you
  believe you''ll have later. Actually reverse: Reflection says your current credence
  should match your anticipated future credence; PP says credence should match believed
  chance. A student might say "PP is Reflection applied to chances" — that''s a conflation.
  Hmm, plausible subtle error: "The Principal Principle is basically the Reflection
  Principle where the future opinion is replaced by chance; indeed Lewis introduced
  both." Actually Lewis introduced Reflection in "Elusive Knowledge" (1991) as a generalization...
  Lewis does discuss Reflection and notes PP follows from Reflection plus the claim
  that chance is your future credence? Something like that. A student might say Reflection
