  of the human population has a reduced ability to digest lactose after infancy, NIH-sourced.
  That''s a widely known stat; fine, and I can hedge as "roughly two-thirds.")

  - Dr. B (family physician / philosopher-leaning, normativist): argues that this
  is precisely what shows the naturalist account is defective: it declares a condition
  that causes real pain, bloating, diarrhea, avoidance behavior, and social burden
  to be "not a disease" merely because it''s statistically common. Disease concepts
  exist for the purpose of licensing treatment and legitimating suffering; a purely
  statistical account can''t ground medicine''s goals. Also: if the reference class
  is drawn as "adult humans worldwide," the naturalist gets one answer; if drawn as
  "adults in this population who consume a dairy-containing diet" or by genotype,
  it gets another — the reference-class choice is itself a value-laden decision. And
  by the naturalist''s logic, widespread vitamin D deficiency or hypertension in a
  population would cease to be diseases once they cross the statistical threshold
  — absurd.


  Then naturalist replies: Boorse''s reference classes are age and sex (and species),
  not culture or diet; and statistical normality isn''t what does the work — functional
  design is. Lactase non-persistence is not a failure of a mechanism to do what it
  evolved to do; lactase down-regulation after weaning is the evolved design, so there''s
  no dysfunction at all. The comparison with hypertension fails because elevated blood
  pressure does impair a mechanism''s capacity to perform its function (cardiovascular
  regulation), even if asymptomatic and even if common. So the naturalist account
  distinguishes them without any appeal to values. Also: statistical commonness isn''t
  the criterion; "survival and reproduction" are the goals, and hypolactasia doesn''t
  reduce them in the ancestral environment.


  Normativist counters: then the naturalist account is doing exactly what it denies
  doing — evaluating conditions against a background goal (survival and reproduction)
  chosen as normatively privileged; and if the criterion is "does it impair the mechanism''s
  contribution to survival and reproduction," then it can''t handle conditions that
  harm a person''s life while leaving reproduction intact (e.g., infertility treatment...
  hmm, that reduces reproduction) — better: conditions that impair well-being but
  not survival/reproduction, like anosmia (loss of smell) or mild hearing loss, or
  chronic pain conditions. Also: the naturalist verdict here has real consequences
  — a patient told her condition isn''t a disease is denied coverage and legitimacy;
  the concept of disease that produces such verdicts is not neutral description, it''s
  a policy instrument. Also invokes the social model: disability arises from environment/society,
  so calling hypolactasia a "mismatch" rather than a disease just relocates the normative
  judgment to the environment, which is arbitrary — why is the dairy-rich environment
  the "correct" one?


  Naturalist replies: yes, disease-ascription is downstream of environment, but that''s
  a virtue not a bug — it explains why the same genotype is a disease in one environment
  and not another (sickle cell trait and malaria; G6PD deficiency and fava beans/drugs;
  phenylketonuria and dietary phenylalanine). The naturalist can handle environment-relativity
  coherently, whereas the normativist makes everything that''s bad a disease, collapsing
  disease into misfortune — which would make "disease" cover bad luck, poverty, and
  unattractiveness. And Wakefield''s hybrid tries to fix this by requiring dysfunction
  too, but that reintroduces the naturalist machinery.


  Normativist''s final move: the hybrid is the right answer, and the coverage decision
  should be made on hybrid grounds — there''s a harm (real suffering, and it''s treatable)
  and, if you look at the mechanism at the level of the individual in her actual environment,
  there''s a dysfunction too (her gut can''t do what guts in this food environment
  need to do); the naturalist''s insistence on ancestral design is a fetish.


