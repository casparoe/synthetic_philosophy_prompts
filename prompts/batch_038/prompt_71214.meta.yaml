  The genuinely common analogies in futarchy debates:

  1. "Prediction markets are polls/surveys with money on the table" — used to argue
  that markets aggregate information better than deliberation, i.e., futarchy is epistocracy-lite
  / democracy with better information. Critic''s use: it collapses the value/means
  distinction.

  2. "Markets are wisdom-of-crowds machines / a crowd guessing an ox''s weight" (Galton''s
  ox) — used to argue that even ignorant participants produce accurate estimates,
  so futarchy needs no expert class and no virtue in the populace.

  3. "Futarchy is like corporate governance: shareholders vote on ends, managers and
  markets pick means" — used to argue that the value/means split is workable because
  we already do it in firms.

  4. "Prediction markets are like insurance markets / they let you hedge" — used to
  argue that manipulation is self-correcting (informed traders profit from distortions).

  5. "A futarchy is like a thermostat."


  The Galton ox-weight analogy is well known and is genuinely leaned on by prediction
  market advocates; it''s also well documented that Galton''s crowd was not a random
  crowd (there''s a literature on it — but I shouldn''t rely on niche facts, and I
  mustn''t quote). The audit could examine: the ox weight question has a pre-existing,
  well-defined, publicly shared answer concept; all participants are estimating the
  same quantity; the market price is the thing being measured, not a cause of it (no
  reflexivity); the crowd has no stake in the outcome and no incentive to distort
  it; expertise distribution (butchers present) matters; feedback is one-shot and
  non-consequential. Whereas futarchy''s target quantity (e.g., "national welfare
  in 20 years under policy A vs B") is not well-defined, is affected by the bet itself
  (reflexivity/self-fulfilling, the Lucas-critique-like problem, manipulation, the
  "problem of thin markets" and of bets moving the outcome), the outcome is not verifiable
  in a way that settles the bet (the "no clean settlement metric" problem, i.e., the
  value metric must itself be defined and measurable — GDP, happiness), and the market
  can be manipulated by actors who benefit from the policy being adopted (which is
  the standard objection).


