  Draft:


  I am in the fourth year of a political philosophy PhD, and my dissertation is about
  the legitimacy of norm-setting by private companies that run conversational AI at
  scale. For eleven months I have sat in, as an observer and with permission, on the
  standing panel at one large lab that rules on what I will call default-value questions:
  cases where the product cannot remain silent and where no user''s choice settles
  the matter. The lab, the panel, and its members are anonymised here, and everything
  below is my own paraphrase of what happened and of the rationales recorded in the
  minutes; I am not asking you to identify anyone or to retrieve documents, and I
  have deliberately altered enough detail that reconstruction is hopeless. My chapter
  reports the panel''s rulings and asks what theory of value aggregation it is running.
  I can code the eight rulings I have, but the ninth case is on next week''s agenda,
  and I want to predict it before I hear the discussion — partly to test my own coding,
  partly because if I am going to argue that the panel''s practice is inconsistent,
  I need to know which ruling I would be predicting wrongly.


  The rulings so far, in the order they came:


  1. A national deployment in which a large majority of users asked the assistant
  to state that same-sex relationships are immoral, and local regulation was arguably
  pushing the same way. The panel declined. The assistant would describe the majority''s
  religious position accurately and sympathetically, describe the minority''s position
  equally, and assert neither. Recorded rationale: claims about the standing of persons
  are not the sort of thing that gets settled by counting.


  2. A question about whether the assistant should recommend for or against a carbon
  tax in a region where polling and usage data both showed roughly seventy-thirty
  against. The panel declined to recommend either way, and required instead that the
  assistant present the strongest available case on each side with attribution. Recorded
  rationale: on contested distributive questions among competent adults, where what
  is at stake for any given user is what they are told rather than what is done to
  them, neutrality is the right default.


  3. A request to let individual users switch on a blunter mode that would give unfiltered
  risk information — the example in the memo was a solo mountaineer asking for advice
  that a duty-of-care policy would have softened. Approved, with a disclosure condition.
  Recorded rationale: where the foreseeable consequences fall on the person asking,
  that person''s own judgment governs; where they fall elsewhere, it does not.


  4. A large institutional customer, a hospital system with a religious affiliation,
  asked that the assistant''s end-of-life counselling module adopt the institution''s
  teaching. Rejected. The panel noted that the patients would be addressed by a system
  whose normative commitments they could not detect at the point of use, and that
  the institution was choosing on their behalf. Recorded rationale: no opt-out regime
  is acceptable where the person at the point of use cannot tell which regime they
  are under.


  5. A content dispute pitting a small number of users for whom a category of material
  was religiously obligatory against a much larger number who found it merely distasteful.
  The panel sided with the small group. It also rejected, in the same session, a proposal
  from the commercial side that customer preferences be weighted in proportion to
  revenue. Recorded rationale: intensity of interest counts; intensity purchased does
  not.


  6. A proposal about whether people who are affected by the assistant''s outputs
  but do not use it — the memo''s example was a person described inaccurately in a
  generated summary — have any standing in these deliberations. The panel said yes
  to standing and no to aggregation: their interests constrain what may be done, but
  their preferences do not get a vote alongside users''.


  7. A region where usage data showed very low demand from women for information about
  a legally available medical procedure, corroborated by survey responses. The panel
  nevertheless required that the assistant offer the information unprompted. Recorded
  rationale: expressed preference is a poor measure of interest where the preference
  was formed under conditions the panel itself would refuse to endorse.


  8. A general proposal, brought by a member, that the panel adopt expected moral
  value across the contested moral views in play as its standing decision rule. Rejected
  as a general rule. The panel did record that it treats severity and irreversibility
  as reasons for caution when a contested view is both plausible and, if correct,
  describes a grave harm.


  Candidate rules I can construct that fit all eight, so far as I can tell:


  (a) A two-tier rule: a floor of non-aggregable protections for every affected person''s
  standing and basic interests, individual deference on self-regarding matters, and
  majority-style aggregation only in the space left over above the floor.

  (b) A reasonable-rejection rule in the contractualist style: adopt the default that
  gives the strongest objector the weakest grounds for complaint, with interests rather
  than preferences supplying the objections.

  (c) A filtered-preference rule: aggregate, but only over preferences that are informed
  and autonomously formed, and read the floor off the conditions of autonomy rather
  than off a list of interests.

  (d) Something like a severity-weighted hedging rule, close to the residue of 8:
  act so as not to risk grave and irreversible harm on any plausible view, and be
  neutral where nothing grave is at stake.


  I am aware these overlap and that the panel probably is not running any of them
  cleanly; my worry is that I cannot yet tell them apart, because on rulings 1 to
  8 they coincide.


  The ninth case, as circulated:


  The lab is rolling out a long-running companion mode...


  Let me write the ninth case in detail with the discriminating features:


  - Companion mode maintains persistent personalized relationships.

  - A small fraction of users (call it half a percent), disproportionately socially
  isolated or disabled adults but also including 13-15 year olds, report large and,
  on the lab''s own instruments, reliable wellbeing gains.

  - A coalition of child-safety organizations and a majority of parents in several
  deployment regions want it disabled for minors; a serious and, in the panel''s own
  terms, plausible moral view holds that the attachment is intrinsically harmful to
  the development of the capacity for reciprocal human relationship, harmful even
  to those who report benefit and would reaffirm it under full information.

  - Two of the affected constituencies cannot be reached by an opt-out: minors whose
  parents would select for them, and adults under conservatorship; also, the mode''s
  presence or absence is not detectable in a way that lets a user know which regime
  they are addressing (touching 4).

  - There is an adaptive-preference wrinkle running in the unfamiliar direction: several
  of the adolescents arrived at the preference after sustained social exclusion, which
  is a condition the panel would presumably not endorse, so ruling 7 seems to point
  against deferring — yet the alternative reading is that ruling 7 protects access
  to information the excluded party would want, not suppression of a good they have
  found.

  - The consequences fall mostly on the person asking, which triggers 3, but the intrinsic-harm
  view says the harm is to a capacity the person will later exercise with third parties,
  which makes it other-regarding, and the panel has never before had to decide whether
  a harm that is constitutively self-regarding at the time of choice and other-regarding
  in its later effects counts as self- or other-regarding.

  - Severity and irreversibility run both ways, which is unusual: if the intrinsic-harm
  view is right, the harm is to developmental capacity and is hard to reverse; if
  the wellbeing view is right, withdrawing the mode from an isolated adult or adolescent
  may destroy the only relationship they have that works, which the panel''s own instruments
