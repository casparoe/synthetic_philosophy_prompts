  Title: "The Copy Set: Where the Unit of Selection Actually Lives"


  §1 The question, and why a build engineer cares.

  I maintain a distributed evolutionary search system. Population of candidate solutions
  (each a serialized policy graph), organized into demes of 64. Two nonstandard mechanisms:
  (i) lateral transfer — a deme maintains a shared "heuristic pool"; individuals can
  pull entries from it and splice them in; the pool is updated by successful individuals;
  (ii) deme forking — every N generations, the top demes are copied whole (all 64
  individuals plus the pool plus the deme''s accumulated configuration) and launched
  as new demes; the bottom demes are terminated.


  The philosophical question: in this system, what is the unit of selection? Is it
  the individual solution, the deme, the pool, or the genes-analog (the shared subgraph
  motifs)?


  §2 What I think I learned from the literature. Summarize: Dawkins replicator/vehicle;
  Hull interactor; Williams''s parsimony argument against group selection; Sober &
  Wilson''s trait-group revival; Okasha''s distinction between two kinds of multilevel
  models — where he splits them into models in which groups reproduce as wholes and
  produce daughter groups (he calls these MLS1) and models in which groups merely
  differ in the average output of their members without reproducing as units (MLS2).
  [PLANTED REVERSAL]


  §3 My proposal: the copy set. Define: at a reproduction event, some part of the
  parent''s state is copied into the child; the rest is discarded, recomputed, or
  supplied by the environment. The copy set is the set of state variables whose values
  are transmitted. Claim: an entity is a candidate unit of selection just in case
  it is (or is constituted by) something in the copy set of some reproduction event;
  and it is an actual unit of selection if variation in it makes a difference to the
  number of copy events it participates in. Vehicles are whatever lies outside the
  copy set. So the unit of selection is not a matter of interpretation or of level
