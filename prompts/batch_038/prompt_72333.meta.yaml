  the non-excludable/public-goods character of norm-following, and why the costs of
  tightness fall on identifiable individuals while benefits diffuse.

  2. Steelman looseness: error-correction, exit for non-conformists, the moral cost
  of surveillance and third-party standing, and the way tight norms entrench whatever
  happened to be normal.

  3. Address the agency objection: whether "a society deciding to be tight or loose"
  is coherent at all, since norms change bottom-up, and whether the normative question
  therefore dissolves into questions about what individual citizens owe one another
  in enforcing norms (and whether a state can do anything except tighten law, which
  is not the same lever).

  4. Distinguish legal tightness from social tightness, and say whether the verdict
  differs for each.

  5. Distinguish the stringency of a norm from the strength of its social enforcement,
  and say what follows when the enforced norms are morally weighty but contested rather
  than arbitrary coordination conventions.

  6. Apply to one concrete domain — a public health emergency, a large employer''s
