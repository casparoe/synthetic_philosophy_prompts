  I am drafting a chapter for an edited collection on what cultural psychology should
  mean for political philosophy, and I would like a self-contained essay that settles
  a question I have been going around in circles on. No citations or reference list
  are needed — I will supply those; what I want is the argument worked out.


  Background, stated as neutrally as I can manage. The tightness–looseness research
  program (Gelfand and collaborators) treats societies as differing in how strongly
  they enforce social norms and how much deviance they tolerate. Its broadest generalizations
  are that groups facing sustained threats — scarcity, natural disaster, conflict,
  population pressure — tend to tighten, that tightness buys coordination and order
  at the price of innovation and openness, and that looseness does the reverse. The
  normative debate that has grown up around this is usually posed as a single question:
  should a society be tight or loose?


  My proposal, which I want the essay to test rather than assume, is that the question
  is malformed because "tightness" bundles at least three independently variable features:
  (i) the determinacy of norms — how precisely their content is fixed, so that people
  can tell what compliance requires; (ii) the breadth of enforcement — how many domains
  of conduct are open to scrutiny and sanction by third parties who are not themselves
  wronged; and (iii) the severity and graduatedness of sanction — how costly deviation
  is, and whether cost tracks the size of the deviation. A society can be crisp about
  few norms, vague about many, permissive but intensely monitored, or sharply monitored
  but only by the parties directly affected. Relatedly, I suspect that much of what
  looks like looseness in a liberal society is not weak norms but restricted standing
  to enforce: norms are held firmly, yet only a narrow class of people is permitted
  to police any given one.


  On that framework, write an essay of roughly 1,800 words that reaches and defends
  a determinate verdict on the following: is there an all-things-considered reason
  for a political community to aim at looseness, and if so, looseness along which
  of the three dimensions and in which domains of conduct? ...


