  Last month I sat in on a workshop talk and then stayed for about forty minutes of
  argument between the two respondents, a computational neuroscientist and a philosopher
  of mind from another department. I have tried to reproduce the exchange faithfully,
  in order, without adding anything either of them did not say.


  Round one (the philosopher): He described the color-phi display — a green dot flashed
  at one location, a red dot flashed a short distance away a moment later, within
  the range of spacings and intervals where apparent motion occurs — and noted that
  observers report a single object travelling between the two and switching colour
  at the spatial midpoint of its path, which is to say they report the switch before
  the second flash happens. He took this to settle a substantive question: a report
  cannot be about content that does not yet exist, so the content of the experience
  must have been altered after the second flash arrived. That is an Orwellian revision
  — history rewritten — and it shows there is no stable stream of presented contents
  for a subject to inspect.


  Round two (the neuroscientist): She denied that the report licenses any inference
  about the experience. On her account the colour switch could have been represented
  at the midpoint because predictive mechanisms filled in the trajectory from the
  first flash, with the verbal report merely issued later. That is the Stalinesque
  alternative — the show is fixed, the record of it is delayed — and it accommodates
  every datum he cited. She added that the two hypotheses predict exactly the same
  reports in every version of the display, so no experiment could ever separate them,
  which is her reason for thinking the dispute is empty rather than unresolved.


  Round three: The philosopher granted the empirical equivalence and said it was his
  conclusion, not an objection to it. If two stories about when experience happened
  are indistinguishable by every observation anyone could make, then the question
  they disagree about has no content; and her predictive-mechanism story, he said,
  is doing precisely the same work as his, since "filling in the trajectory before
  the second flash" is just another way of saying the content was not what the stimulus
  sequence was.


  Round four: She said that was too quick. The two hypotheses differ about a real,
  measurable thing — where in the processing stream the colour representation gets
  settled — and she pointed out that the display''s dependence on spacing and interval
  is a substantive, parameter-shaped prediction, not a shrug. Neural timing, not verbal
  report, is the right instrument: you can measure when the relevant activity occurs
  relative to the second flash, and a theory tying the experience to that activity
  is committed to something.


  Round five: His reply was that this is exactly the mistake the display was meant
  to expose. A neural measurement locates a brain state in time; it does not locate
  an experience in time, and if you assume that experience has a temporal address
  that such measurements can find, you have reinstated a place where contents are
  presented to someone — the thing the illusion was supposed to rule out. Her appeal
  to the timing data, he said, smuggles in the very theatre.


  Round six: Her last move was that if there is no fact of the matter about when the
  experience occurred, then the question that generated the whole problem — whether
  the observer saw the colour change before or after the second flash — has been dissolved
  rather than answered, and dissolving a question that ordinary people can perfectly
  well ask, and that both of them were happily asking in the first two rounds, is
  a worse outcome than conceding that we do not yet know.


  They were then called to dinner. I could not referee it at the time and I am not
  sure I can now.


