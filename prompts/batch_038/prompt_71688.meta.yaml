  Disability and Health, 2001) replaced the ICIDH (1980) triad of impairment/disability/handicap
  with body functions & structures / activity / participation, plus contextual and
  environmental factors. That''s a concrete institutional practice with a philosophical
  presupposition — it looks like it smuggles in normativism (participation is a social-role
  notion) while claiming to be neutral/biopsychosocial. And Boorse''s biostatistical
  theory (naturalism) vs. Wakefield''s harmful dysfunction (hybrid) vs. Nordenfelt/Canguilhem
  (normativism).


