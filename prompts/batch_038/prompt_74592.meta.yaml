  \ unpleasant... hmm. Actually the domain literature: pain asymbolia (Schilder &\
  \ Stengel 1931), Berthier et al. 1988, the debate over whether asymbolia shows pain's\
  \ badness is contingent (Grahek 2007, \"Feeling Pain and Being in Pain\"), Bain\
  \ (2013) \"What makes pain unpleasant?\", Aydede's defense of imperativism, Korsgaard\
  \ on animal pain, etc. Also \"pain unpleasantness\" dissociation from sensory-discriminative\
  \ dimension; hypnosis; opioid analgesia; capsulotomy/cingulotomy patients (Foltz\
  \ & White) who report feeling pain but it doesn't bother them; lobotomy.\n\nThe\
  \ verdict-prediction prompt could be: a philosopher's verdicts on which states count\
  \ as \"pain that is bad for the subject\": asymbolia patients (feels pain, not bad\
  \ for them → pain isn't intrinsically bad); a cingulotomy patient (reports feeling\
  \ pain but no longer minds → same); masochist (pain is good/desired → not bad);\
  \ someone with congenital insensitivity to pain (no pain → obviously lacks badness\
  \ but also lacks protection); someone in a dream/pain hallucination?; a dog yelping\
