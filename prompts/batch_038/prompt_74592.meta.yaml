  \ who says \"the pain is there but it doesn't matter\"; a hypothetical person whose\
  \ pain experience is exactly like ours but who has been trained never to avoid it...\n\
  \nRules that fit: (i) badness = unpleasantness = felt affective valence, and asymbolia\
  \ patients lack it (they report pain but it isn't unpleasant) → \"asymbolia is not\
  \ real pain\" or \"pain's badness is contingent on unpleasantness\"; (ii) badness\
  \ = the disposition to cause suffering/aversion/motivation to stop; (iii) badness\
  \ = imperative content (pain commands \"stop this!\"); (iv) badness = bad because\
  \ of its role in a subject's evaluative life/narrative; (v) representational/evaluative\
  \ view: pain represents bodily damage as bad, so badness is in the representing.\n\
  \nNew case that splits rules: e.g., a person with a lesion that removes the desire\
