  Draft argument:


  Setting: The asker is in a philosophy of mind reading group / or working with a
  lab studying disorders of consciousness. They''re evaluating whether heterophenomenology
  can serve as the neutral method for a science of consciousness, and a colleague
  produced the following argument which seems to show that heterophenomenology, if
  it''s really neutral, can never deliver knowledge of consciousness — and worse,
  that no third-person method can, which would make consciousness science impossible.
  The conclusion they can''t accept.


  Argument:

  (1) A method is neutral with respect to X''s existence only if the method''s deliverances
  are compatible both with X existing and with X not existing.

  (2) Heterophenomenology is presented as neutral with respect to the existence of
  the items its subjects report: it treats reports as data about a heterophenomenological
  world, and does not commit to the reality of what is described.

  (3) So the deliverances of heterophenomenology are compatible both with subjects
  being conscious and with subjects being purely non-conscious ("zombie") systems
  producing the same reports.

  (4) Any method whose deliverances are equally compatible with a phenomenon''s existence
  and its non-existence cannot provide evidence for that phenomenon''s existence.
  [Or: cannot establish it.]

  (5) Therefore heterophenomenology can provide no evidence that any subject is conscious.

  (6) But this is not a peculiarity of heterophenomenology: every method available
  to a science of consciousness is third-person, and third-person methods record only
  publicly accessible facts — behavior, report, physiology, functional organization.

  (7) Every such fact is compatible both with consciousness and with its absence in
  the system that produces it (this is just the possibility of a philosophical zombie,
  restated methodologically).

  (8) So no method can provide evidence that anyone is conscious — including, by (6)-(7),
  the subject''s own method of introspection, since an introspective report is itself
  a publicly recordable utterance, and any private non-recordable awareness would
  be unavailable as evidence to anyone, including to the subject on reflection.

  (9) Therefore the science of consciousness is impossible: not because consciousness
  is mysterious, but because the only evidentially admissible data are silent about
  it.


  Hmm, (8) is aggressive and probably the weakest link but also a spot where a subtle
  slide occurs. Actually let''s think about what''s really wrong.


  Where does it go wrong? Several candidate diagnoses:


  (a) (4) is false: "compatible with both" is too weak a criterion. Almost all evidence
  is compatible with both a hypothesis and its negation in the strict logical sense;
  evidential support is not entailment. If (4) were right, no empirical evidence could
  ever support anything (since data underdetermine theory). This is the classic "the
  argument proves too much" move: it would show that no science can establish the
  existence of anything not entailed by its data — electrons, the past, other minds.
  Neutrality as a methodological policy of withholding commitment is different from
  evidential neutrality: a method can be non-committal in its output format while
  its data still carry evidential weight when combined with background assumptions
  (inference to the best explanation). This is the key equivocation: "neutral" in
  (2) means deliberately non-committal as a matter of disciplinary hygiene; "neutral"
  in (1)/(4) means evidentially uninformative. Sliding from one to the other is the
  flaw. That''s very good — a genuine equivocation between a methodological stance
  and an evidential relation.


  (b) (6)-(7) slide: the zombie possibility is a metaphysical conceivability claim,
  and its transfer into a methodological claim ("every fact is compatible with absence
  of consciousness") requires that compatibility be logical/metaphysical rather than
  epistemic. Evidence can be conclusive-ish even when metaphysically compatible with
  the negation. Also, (7) treats "compatible with" as if it were symmetric: behavioral/functional
  data may be compatible with zombiehood but far more strongly supported by consciousness-hypotheses
  given background knowledge about brains, evolution, etc.


  (c) (3) doesn''t follow from (2) as stated: heterophenomenology''s neutrality concerns
  the items described in the heterophenomenological world (e.g., "a green afterimage
  in the top-left of my visual field"), not the existence of conscious experience
  per se. So there''s a scope shift: neutrality about the objects of description ≠
  neutrality about whether there is something it''s like. Dennett himself holds that
  heterophenomenology yields real phenomena — the phenomena of belief/report/expectation,
  and eventually the design/functional facts that explain them — and he thinks explaining
  those IS explaining consciousness. So (3) equivocates between "the reported items
  don''t exist as reported" and "there is no experience at all."


  (d) (8) is a self-application overreach: introspection isn''t itself a third-person
  method; the claim that introspective reports are publicly recordable doesn''t make
  the awareness they express third-personal. Also the "private evidence unavailable
  to anyone" move smuggles in an evidential-access principle (that evidence must be
  shareable) that would rule out ordinary first-person knowledge of one''s own pain,
  which is a reductio of that principle rather than a support for (9).


  So the argument has multiple candidate exits — good, that makes it hard and rich.
  The right answer probably names (4) as the fatal step (with the equivocation on
  "neutral"), and/or the (2)→(3) scope shift, then prices the alternatives: rejecting
  (2) means abandoning heterophenomenology''s selling point (its neutrality/aggregation
  across subjects) — actually no, rejecting (2) isn''t needed; you might instead reject
  (1) or refine "neutral." Rejecting (4) costs you the strong internalist intuition
  that a method should be self-sufficiently probative, and re-opens the question of
  what background assumptions license the inference from reports to experience (which
  is where the zombie dialectic actually lives: the anti-physicalist will say the
  required background assumptions are exactly what''s in question — begging the question
  against zombie possibility). Rejecting (7) means denying the conceivability of zombies,
  which is a substantive metaphysical commitment, not a methodological one. And the
  answer should discuss what heterophenomenology''s neutrality buys: it''s a device
  for aggregating data and for avoiding both the first-person incorrigibility assumption
  and the premature dismissal of subjects'' claims (Dennett''s example: the subject
  who reports a green afterimage; or the "rotating mask" illusion studies; anosognosia,
  blindsight, split-brain, where subjects sincerely report and yet are wrong — heterophenomenology
  keeps the reports as data without endorsing their content).


  Also good: the argument''s (9) conclusion "the science of consciousness is impossible"
  vs. the alternative reading that it shows consciousness science must be non-neutral,
  i.e., committed — which is what Block and Chalmers want to argue against Dennett
  (that heterophenomenology can''t be both neutral and deniably of qualia). The dilemma:
  if neutrality is real, heterophenomenology can''t support Dennett''s eliminativist
  conclusions; if it supports them, it wasn''t neutral. My argument should brush against
  this without being it.


