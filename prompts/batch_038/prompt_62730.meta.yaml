  Actually a really promising one: The "proves too much" argument in IP:


  (1) A property right is justified only if the right-holder can exclude others from
  using something rivalrous, i.e., something whose use by one person prevents its
  use by another.

  (2) Ideas are non-rivalrous: my using an idea doesn''t prevent you from using it.

  (3) So no property right in ideas is justified.

  (4) But by the same reasoning, no property right is justified in anything whose
  non-rivalry is a matter of contingent fact — e.g., a house in a depopulated town,
  a seat on an empty train, a lighthouse''s beam, a beach.

  (5) Some of these clearly do support property rights (at least contractually/socially).

  (6) So either (3) is false or property is not about rivalry at all — but if property
  isn''t about rivalry, the standard justification for property collapses into mere
  convention, and then IP''s status is no more mysterious than real estate''s.

  Conclusion: the anti-IP argument either proves too much (abolishing ordinary property)
  or proves nothing distinctive about IP.


