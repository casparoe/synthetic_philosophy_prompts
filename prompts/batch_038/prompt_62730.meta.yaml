  actual, world: it remains neutral about whether the reported objects exist.

  (3) If a method is neutral about whether the reported objects exist, it cannot establish
  that they exist.

  (4) So heterophenomenology cannot establish that any conscious state exists.

  (5) The same reasoning applies to any third-person method, because all third-person
  methods have as their only data physical/behavioral facts, which are neutral about
