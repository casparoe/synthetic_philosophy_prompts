  the votes that matter most, and a member who defies one risks having the whip withdrawn,
  which means losing the party label at the next election. Yet on a scattered list
  of subjects — abortion, capital punishment, assisted dying, embryo research, fox
  hunting — the same leadership grants a free vote, and the whip stands down.


