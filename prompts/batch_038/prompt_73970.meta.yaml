  when a member votes as instructed against their own reading of the bill, what are
  they taken to be doing — deferring to a superior epistemic authority, honoring a
  mandate conferred by the manifesto, keeping a promise, or pooling with others in
  a way that only makes sense if the party is a single agent rather than a coalition
  of agents? Say which of these the practice needs and which it merely fits comfortably
