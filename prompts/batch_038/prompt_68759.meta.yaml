  I''m auditing a history-of-antiquity seminar this semester and I keep noticing that
  when the question is whether some famous story actually happened, the profession
  lands on the same two-tier verdict every time: for Troy, "the mound at Hisarlik
  was real and it burned, whether a war anything like Homer''s happened we can''t
  say"; for the Exodus, "no Egyptian record of it, and the numbers can''t be right,
  but there''s probably some kernel — small groups of Levantine migrants, Egyptian-sounding
  names in the priestly line"; for King Arthur, "there may have been a war-leader
  in the fifth or sixth century, but the round Table is romance." So we''re allowed
  a kernel but never the story. What I can''t figure out is what epistemology licenses
  that split, and why it''s applied so unevenly.


  Concretely, three things bug me. (1) For Troy, the Hittite tablets mentioning a
  place called Wilusa and a power called Ahhiyawa get treated as real corroboration
  of the Homeric world because the names look like Ilion and Achaeans — but the same
  kind of name-matching is laughed out of the room in other cases, so what''s the
  rule? (2) The silence of Egyptian records is treated as positive evidence against
  a mass Exodus, while the total lack of British records from the fifth and sixth
  centuries is treated as just a gap that proves nothing about Arthur. Same absence
  of documents, opposite evidential weight. (3) People constantly say the Arthur material
  is "multiply attested" — a battle list in a ninth-century compilation, an annal
  that dates Badon — even though everyone agrees those texts share sources and were
  written three to five centuries later.


