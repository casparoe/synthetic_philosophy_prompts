  Actually, I like combining: Solomonoff induction desiderata. It has real content:
  uncomputability, machine-dependence (invariance theorem — the Solomonoff prior is
  machine-independent up to a multiplicative constant), the problem of the universal
  prior being dominated by finite prefix complexity, logical omniscience / inability
  to handle mathematically uncertain claims, the "prior over what?" question (bit
  strings vs. theories), the requirement that it recover Solomonoff''s own convergence
  results (induction works asymptotically — Solomonoff''s convergence theorem: the
  posterior concentrates on the true distribution for computable measures), Carnap''s
  continuum / regularity, the requirement to handle indexical/embodied data (the problem
  that the agent''s observations are not a random computable sequence but embedded),
  the "grue"/non-projectible predicates issue, Goodman, the problem of old evidence,
  and the tension with practical priors (MDL, AIC/BIC, compression via LLMs as approximations).
  Also the desiderata conflict: uncomputability vs. implementability; machine-independence
  up to constant vs. the fact that the constant can be astronomically large and matters
  for any finite data; universal (dominant) prior vs. the requirement that the prior
  be learnable/tractable; requiring the prior be universal (dominates all computable
  measures) vs. requiring it be calibrated/frequentist-covering; requiring logical
  omniscience vs. human-like reasoning. Also the requirement that it vindicate Occam''s
  razor as a norm rather than merely as a description; and whether simplicity must
  be language-relative or absolute.


  Also: is there a nice "which subset is jointly unsatisfiable" angle? Yes: (a) the
  prior must be machine-independent/objective (invariance up to a constant), (b) the
  prior must be computable or approximable from below to be usable, (c) it must dominate
  all computable measures with a non-negligible factor... Actually universality +
  computability is strictly impossible (Solomonoff prior is not computable, but it
  is lower semi-computable / enumerable from below). So (a) universality/dominance
  + (b) computability is provably jointly unsatisfiable. And the "objective simplicity"
  desideratum (a language-independent notion of simplicity) vs "simplicity is a matter
  of description relative to a representation" — there''s a genuine tension. Also,
  the desideratum that the theory explain why simplicity tracks truth (metaphysical/epistemic
  justification) vs the desideratum that it be purely formal — that''s where the philosophical
  work lies. And a key tension: any formal account makes simplicity prior-relative,
  so it can''t vindicate induction non-circularly without assuming the world is computable/has
  low complexity — the "assumption that the truth is in the hypothesis class" is doing
  the work. That''s a nice unsatisfiable-ish set.


