  Write an essay of roughly 1,500–2,000 words on the following controversy in normative
  ethics, and commit to a verdict.


  The controversy: whether the problem of "cluelessness" — the systematic inability
  of agents to know the long-run effects of their acts — is a specifically fatal objection
  to consequentialism, or merely an instance of a general epistemic predicament that
  leaves the theory''s action-guiding ambitions intact.


  Before you begin, here is a case and an argument I want the essay to engage with.
  Treat both as stipulated; you need not (and should not) hunt down sources for them.


  The case. In a river town in 1911, a municipal engineer must decide whether to authorize
  a tenth evening ferry crossing. Her evidence is good: the extra crossing will save
  commuters about four hundred hours a year and will, on the best available statistics,
  prevent roughly one drowning a decade. What she cannot know, and could not know
  even in principle by further investigation, is that the extra crossing will bring
  two particular strangers onto the same boat; that their great-grandchild will, ninety
  years later, hold a patent on a cheap refrigerant; that the refrigerant will be
  installed in something like a hundred million households; and that its slow leakage
  will produce health and climate effects many orders of magnitude larger than the
  entire intended benefit of the ferry schedule. Note two features of the stipulation.
  First, the disproportion is not merely large but unbounded in the sense that nothing
  in the engineer''s evidence assigns it a determinate magnitude. Second — and this
  is what distinguishes the case from ordinary hard choices — the engineer''s ignorance
  is not a matter of lacking probabilities she might, with effort or expense, have
  obtained. There is no probability distribution over the far effects to be had, because
  those effects depend on the chaotic amplification of details that were, at the moment
  of decision, physically indistinguishable from noise. Her epistemic position is
  not imprecision but indeterminacy.


  The argument. Call this the Stopping-Point Argument.

  1. If the rightness of an act depends on all its consequences, then in cases like
  the ferry the right-making facts outrun anything the agent could know, so the theory
  offers no action-guiding content.

  2. If the rightness of an act depends only on the consequences the agent could foresee,
  the theory has quietly relocated the object of evaluation from outcomes to epistemic
  states, and it stops being a form of consequentialism in the sense that motivated
  the view.

  3. Any intermediate cutoff — consequences knowable at reasonable cost, consequences
  within some temporal horizon, consequences above some probability threshold — is
  either vague in a way that admits of no principled sharpening, or it reproduces
  the ferry case at the margin, since chaotic amplification operates across every
  temporal and probabilistic boundary.

  4. Therefore consequentialism must accept one of the two horns: emptiness or self-abandonment.


