  independent of the voting rule used to report it. [key premise — the "antecedent
  will" picture]

  (3) In our case, the same distribution of preferences yields a different winner
  under a different rule (ranked-choice would pick C, the conflict clause picks A),
  so the winner is a function of the rule, not of what people want.

  (4) Therefore Measure A''s passage does not express what the electorate wants, and
  by (1) it lacks authority.

  (5) The same reasoning applies to every majority decision where the option set has
  three or more alternatives, including the election of the council that would decide
  the question instead.

