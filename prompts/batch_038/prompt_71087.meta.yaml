  (1) Whatever the majority decides in a referendum expresses the will of the people,
  and the will of the people is sovereign.

  (2) If the will of the people is sovereign, no earlier decision can bind a later
  one.

  (3) So a referendum result cannot be entrenched — a later majority may reverse it.

  (4) But then any referendum that entrenches its result (e.g., an independence referendum,
  or one that abolishes future referendums) is invalid, since it would bind later
  majorities.

  (5) A referendum abolishing referendums / a referendum creating a dictatorship is
  therefore... hmm, this gets to the "paradox of self-amendment" / the "entrenchment
  paradox."


  Interesting: an argument that popular sovereignty proves too much — it dissolves
