  Honestly, my knowledge of the conceptual terrain is solid enough:


  - Money pump: an agent with cyclical preferences (A > B > C > A) can, if offered
  sequential trades with small fees, be led around the cycle and end up with what
  she started with minus fees. Used as an argument for transitivity (and, in a dynamic
  setting, against violations of independence, via "sure-loss" arguments).

  - Objection 1 (sophistication/backward induction): a sophisticated agent foresees
  the whole sequence and refuses the initial trade, so no pump. Standard replies:
  (a) the pump works if trades are offered in the reverse order or if the agent cannot
  foresee; (b) the pump works even for sophisticated agents in some formulations;
  (c) the sophistication objection presupposes the agent has a coherent plan, which
  requires... etc. Also (d) a "sophisticated" agent who refuses the first trade on
  the grounds of foreseeing the later pump is arguably choosing against her own preferences
  at the first node — she prefers to accept the trade (since A > B... wait, in a cycle
  A>B>C>A, at the first node the agent prefers... depends). The key point: dynamic
  consistency vs. separability — Hammond argued that in dynamic settings you cannot
  have all of: dynamic consistency (later choices match the plan), separability (choices
  at a node depend only on what''s reachable from that node), and the standard axioms.
  Sacrificing separability yields "sophisticated choice" which is dynamically consistent
  but can violate the axioms; sacrificing dynamic consistency yields resolute choice
  (McClennen), which keeps separability but requires the agent to stick to a plan
  even when later preferences favor deviation — critics say resolute choice is ad
  hoc / requires a norm of plan-sticking that isn''t itself derived from preferences.

  - Objection 2 (transaction costs): if trades are free, no money is lost; reply:
  then the pump is "costless" and the agent is indifferent, or the argument relies
  on charging. Gustafsson discusses money pumps with no cost — a "money pump" where
  the agent ends up with a strictly dominated outcome (e.g., ends with B when she
  could have had A for free). Indeed there''s a standard costless pump: agent with
  A>B>C>A is offered free trades and ends up worse off in the sense of ending at a
  point she prefers less than the start — dominated outcome without any fee. That''s
  the "no-fee" pump showing the agent can be led to a strictly worse position (in
  the sense of her own final preference).

