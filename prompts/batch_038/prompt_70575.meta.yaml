  Her position, in brief: money-pump arguments against transitivity are usually presented
  as showing that an agent with cyclical preferences can be led around the cycle,
  paying a small premium at each step, until she is back where she started and strictly
  poorer. She thinks this presentation misses the point and hands her opponents an
  easy escape. On her account, what the pump reveals is a defect of diachronic self-governance:
  an agent whose preferences cycle is such that, having completed the sequence, she
  would prefer to have declined the first trade — even though at every node she preferred
  to accept it. Crucially, she holds this defect is dispositional rather than consequential:
  it obtains even in a world where no trades are ever offered, and it is untouched
  by the standard replies. Charging transaction costs, offering precommitment devices,
  or crediting the agent with backward-induction foresight all address whether she
  can be exploited, not whether she is pumpable, and it is pumpability, not exploitability,
  that carries normative weight. She also maintains that the sophisticated-choice
  and resolute-choice strategies concede too much, since they make the verdict on
  an intransitive agent turn on her foresight and planning capacities rather than
  on the structure of her preferences.


