  \ — when we reflect on it — is not a definite feeling...\" Actually Sidgwick says\
  \ something like: \"a common quality in all pleasant feelings... I cannot find any.\"\
  \ That's a well-known quote; I must not quote from memory. I'll paraphrase without\
  \ quotes, and it's the student's answer paraphrasing anyway.)\n- Correctly describes\
  \ two responses: (i) the attitudinal/desire-based response — pleasure isn't a sensation\
  \ but being pleased that something is the case (Feldman) or being sensorily pleased\
  \ / wanting a sensation to continue (Heathwood, Brandt), which dissolves heterogeneity\
