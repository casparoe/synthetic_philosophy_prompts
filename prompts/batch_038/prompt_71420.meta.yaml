  \ it's a bridge principle connecting chance and credence; it explains why chance\
  \ deserves the name \"chance\"; it's not derived from frequencies.\n- Subtle mistake\
  \ 1: Says the admissibility condition is needed to rule out evidence about future\
  \ outcomes, and treats admissible = \"past-tense\" evidence — conflating Lewis's\
  \ notion (which includes past-tense evidence and laws of nature, plus some future\
  \ information like \"the coin will land heads if...\") Actually Lewis: admissible\
  \ propositions are those the credence in which is entirely derived from... he says\
  \ admissible evidence is, roughly, information about the past and about law. But\
  \ he acknowledges there are exceptions: \"hard-to-come-by\" information about the\
  \ future can be admissible if it's not inadmissible... Actually Lewis's definition:\
  \ admissible propositions are those which it's permissible to condition on — those\
