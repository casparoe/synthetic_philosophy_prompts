  \ for small models, and also there's a risk the model gets it wrong.\n\nHmm, but\
  \ I think the grading task should be tractable. Let me think about what makes a\
  \ good grading prompt: the answer must be substantive and checkable by reasoning,\
  \ with a couple of genuine errors that require real understanding to catch.\n\n\
  Let me go with the Principal Principle (domain 2). Question: \"State Lewis's Principal\
  \ Principle and explain (a) why it's not vacuous, (b) what role 'admissible' evidence\
  \ plays, and (c) whether, if it holds, chances are redundant from the point of view\
