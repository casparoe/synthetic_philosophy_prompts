  \nWhich is best? The instruction says pick whichever type combines best with a domain.\
  \ I'll go with grading type + moral dilemmas? Or grading + interpretations of probability?\n\
  \nLet me think about which gives the most \"genuinely mixed, no obvious howlers,\
  \ subtle mistakes a hasty grader would let slide.\" I like the probability interpretations\
