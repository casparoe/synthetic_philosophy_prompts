  \ the model to detect specific errors. I think that's fine and the errors I pick\
  \ are the weeds.\n\nActually — let me reconsider the heterogeneity problem for hedonism.\
  \ That's the most \"in the weeds\" and least regurgitated. A student answer there:\n\
  \nQuestion: \"Hedonism says pleasure is the only thing good in itself. A standard\
