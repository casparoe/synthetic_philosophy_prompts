  \ Ross thought so but that's a further claim.\n\nThis is a good domain: accessible,\
  \ no need for exact citations, and mistakes are conceptual. But \"no obvious howlers\"\
  \ — the mistakes should be subtle.\n\nLet me also consider futarchy, which is a\
