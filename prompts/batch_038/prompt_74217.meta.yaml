  My commitments:


  (1) Cognitive penetration is a synchronic, content-sensitive relation: a case counts
  only if a belief, desire, or similar state changes perceptual phenomenology in a
  way that is semantically coherent with that state''s content, and only if the change
  is not explicable by attentional deployment or by a shift in the subject''s response
  criterion.

