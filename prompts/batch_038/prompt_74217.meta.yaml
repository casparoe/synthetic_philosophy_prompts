  who sees the position''s structure — is also penetration, but it does not offend
  (1), since it is diachronic: learning recalibrates the system rather than letting
  beliefs in while it runs.

  (4) I am a modest foundationalist: experience confers justification non-inferentially,
  and that is what allows it to stop a regress.

  (5) I also accept that an experience brought about by a desire has less justificatory
  force than an otherwise identical experience that was not, even when both are accurate.


