  In the African philosophical literature on ubuntu, the processual or "achieved"
  account of personhood — associated above all with Menkiti, and contested from a
  more individualist direction by Gyekye''s moderate communitarianism — holds that
  one does not simply arrive in the world a person but becomes one, over time, through
  being progressively woven into a network of reciprocal obligations, and that the
  community''s recognition is constitutive rather than merely honorific. The stock
  objection is that this cannot secure moral equality: if personhood is a matter of
  degree and is earned by participation, then the newborn, the recluse, the profoundly
  cognitively disabled, and the ostracized all slide down a scale, and the view is
  one short step from licensing a hierarchical politics of standing.


  I would like you to argue against that objection, but not in the abstract. Use the
  following stipulated arrangement as your test bed.


  A mid-sized municipality allocates its adult social-care budget by an explicitly
  processual rule. No resident holds a fixed entitlement by birth or by species membership.
  Each quarter, a panel of long-standing residents assigns every adult a standing
  score reflecting the density and reciprocity of that resident''s actual relationships:
  who they feed and who feeds them, whose grief they attend, who would be measurably
  diminished by their absence. Care hours, housing priority, and emergency funds are
  distributed in proportion to the score. The designers defend the rule in precisely
  the vocabulary of the achieved account. They insist that they are not grading human
  worth but tracking how thickly a given life has been incorporated into a web of
  mutual obligation, and that scores rise, sometimes steeply, when a resident takes
  on dependents or repairs a rupture.


  Argue the following, as a connected case rather than a list:


  1. That this scheme is not an abuse of the processual account but a natural institutional
  expression of it, and that the two moves most likely to be made by a sympathetic
  philosopher to distance the view from the scheme — that the score tracks nothing
  morally relevant, so the policy is a bad policy with no metaphysical commitment
  behind it; and that the processual view concerns moral status, not distributive
  shares — both fail, for reasons you should state.


  2. That the distinction that does the real work here is between personhood as a
  status one holds and personhood as a standing one occupies, and that you should
  say precisely what makes the second notion different from the first, rather than
  merely relabelling it.


