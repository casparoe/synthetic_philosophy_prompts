  Draft:


  ---


  When a suspect is identified through a search of a DNA database — a "cold hit,"
  with no other evidence connecting him to the crime — the figure put before the jury
  is almost always the random match probability: the chance that an unrelated person
  chosen at random would happen to match the crime-scene profile. The size of the
  database that was searched typically goes unmentioned. Some forensic science bodies
  have recommended the opposite, arguing that the number should be multiplied by the
  number of profiles searched, since in a large enough database you should expect
  a coincidental match to turn up even if the true source is nowhere in it. Other
  statisticians have argued the reverse again: that a database search makes the case
  against the person identified stronger rather than weaker, because it has eliminated
  every other profile in the database, and that the cold hit should carry at least
  the weight it would have carried had he walked into the police station and volunteered
  a sample.


  Treat this as a philosophical question about self-locating evidence rather than
  a technical one. ...


  Questions:

  1. What does the unadjusted practice presuppose about the reference class and about
  which facts the jury is entitled to condition on? Reconstruct it as an implicit
  rule for handling the fact that the person in the dock was found by a search procedure.

  2. Is that rule anything like the self-sampling assumption (treat yourself, or the
  defendant, as a random sample from a suitable reference class), or does the practice
  instead behave as though self-locating information — "this profile was the one the
  search turned up" — is evidentially inert? Does the rival recommendation amount
  to a self-indication-style adjustment, in which the sheer number of candidates raises
  the probability that someone, anyone, would match?

  3. Which side, if either, is right about the reasoning, and why — is the dispute
  about probability or about what the jury is being asked to decide?

  4. Is the practice internally consistent with the same legal system''s treatment
