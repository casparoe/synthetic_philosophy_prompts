  this criterion is not a covert restatement of expected utility maximization with
  a logarithmic utility function: it is derived from the dynamics of the agent''s
  own wealth sequence and requires no assumption whatever about her preferences over
  one-shot prospects. Third, it follows that strategies which are almost surely ruinous
