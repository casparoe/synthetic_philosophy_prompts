  source and simulate the opponent''s program with its own source substituted), or
  use a fixed-point/proof-based approach. Actually the standard trick: the program
  is written so that it can simulate the opponent against a copy of itself by using
  Kleene''s recursion theorem — a program can obtain its own code. So p* can compute
  what q would do when given p*''s code, and q can compute what p* would do when given
  q''s code — but computing p*''s response to q requires simulating p* against q,
