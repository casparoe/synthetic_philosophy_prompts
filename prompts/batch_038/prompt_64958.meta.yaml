  Move 4 (Iris): But the "right but early" defense isn''t an excuse here; it''s a
  structural feature of the kind of theory in question. Malthus-type theories are
  about the relationship between a stock and a flow: population pressure depletes
  a finite stock, but substitution, technology, and new discoveries can postpone the
  binding constraint indefinitely at the margin while the stock continues to fall.
  So the correct prediction isn''t about price direction in a given decade; it''s
  about the eventual exhaustion of the buffer. Any finite-window test is a test of
  the timing of an event whose timing the theory doesn''t specify. Compare her own
