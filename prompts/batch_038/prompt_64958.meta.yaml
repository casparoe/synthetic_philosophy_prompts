  rise with population," a claim Malthus never made.


  Move 3 (Martin): That''s the classic immunizing maneuver. If any failed prediction
  can be blamed on the choice of indicator, the theory can''t fail. Popper''s point:
  a theory that is compatible with every possible observation is not empirical. And
