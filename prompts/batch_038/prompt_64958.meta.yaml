  Move 2 (Iris, ecologist): No — the wager tested an auxiliary assumption, not Malthus.
  Prices of five traded industrial metals are a terrible proxy for scarcity: they
  exclude depletion of things with no market (soil, freshwater, fisheries, forest,
  pollination, climate stability), they''re distorted by subsidies and by the fact
  that a price fall can reflect a temporary glut from a particular mine or a recession,
