  Also, is it Searle vs Dennett: Searle''s Chinese Room argues syntax insufficient
  for semantics; Searle also argues against "derived intentionality being all there
  is" — Searle says that in the case of a computer, the ascription of intentionality
  is observer-relative, and that''s precisely why computers don''t really have beliefs;
  he thinks original intentionality is intrinsic to brains. And Searle later (in "The
  Rediscovery of the Mind") explicitly attacks the "as-if"/homuncular account. Dennett''s
  reply: Searle''s "intrinsic intentionality" is an empty posit; there''s only the
  intentional stance, and the question "what is it really about" has no answer beyond
  the dispositional/interpretive facts. The two-bitser is Dennett''s argument that
  "derived intentionality" is not a lesser grade: the two-bitser''s states have contents
  that are entirely derivative (assigned by designers/users), and yet that''s just
  what content is — the fact that we could equally well re-assign it shows that "real"
  content can''t be a matter of intrinsic properties. Actually, I recall the two-bitser
  argument goes: a two-bitser can be a bilge-water gauge or a boat-speed indicator
  depending on how it''s hooked up; the device''s states have no intrinsic "aboutness";
  there''s no fact of the matter whether it''s "really" a gauge of X or Y — which
  shows that aboutness isn''t intrinsic. And Dennett uses this to argue that the same
  goes for brains: Searle''s claim that brains have intrinsic intentionality is unmotivated.


