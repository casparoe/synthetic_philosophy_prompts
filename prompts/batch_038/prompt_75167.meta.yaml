  Now the answer text, polished:


  "The captain case looks consequentialist on the surface, and I think the surface
  is partly genuine but partly misleading.


  The captain kills one man who intends to murder five hundred, and he does so out
  of compassion both for the intended victims and for the would-be killer, whose own
  karma would have been catastrophic; he also resolves to take the consequences of
  the killing on himself rather than let any of the merchants become murderers. The
  story''s verdict is that the act was skillful, that it generated merit rather than
  demerit, and that the man killed was spared far worse suffering than death. This
  is plainly a comparison of outcomes: the captain weighs one future against another
  and takes the better one. So at least within Mahāyāna, the precepts function as
  rules that may be overridden when overriding them produces more good, which is what
  consequentialism says.


  Three considerations nonetheless persuade me that Buddhist ethics as a whole is
  not consequentialist. First, karma is fixed by volition rather than by result: the
  texts hold that an act is wholesome or unwholesome in virtue of the intention behind
  it, so an agent who means well and causes disaster has not acted wrongly, while
  one who causes benefits out of greed has. A theory that locates rightness in the
  agent''s state of mind rather than in the state of the world is not a consequentialist
  theory. Second, the doctrine of not-self defeats the consequentialist reading at
  its root, since if there is no enduring person there is nothing for outcomes to
  be good or bad for, and no legitimate basis for adding welfare across the boundaries
  of persons; the reduction of persons to a single impersonal sum is exactly what
  the separateness-of-persons objection objects to, and Buddhism is committed to that
  reduction. Third, karma operates as a system of moral accounting that distributes
  happiness in proportion to virtue, so the best overall balance is already guaranteed
  by the structure of the world rather than by anyone''s choices; a principle that
  adjusts happiness to desert is retributive, not maximizing, and it leaves agents
  no calculation to perform.


  The standard scholarly reading therefore treats the captain story as showing that
  Buddhist ethics weighs consequences, while its critics reply that the precepts are
  what really matter and that one narrative exception proves the rule. And because
  the monastic code and the skillful-means literature belong to the same tradition
  and agree in substance, the fair conclusion is that Buddhist ethics is pluralistic:
  consequentialist when the stakes are high, and governed by intention when they are
  not."


