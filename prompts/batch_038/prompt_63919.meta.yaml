  how we interpret it, and any interpretation is as good as another unless constrained
  by what it''s for / how it''s used. Dennett''s point against Searle''s intrinsic
  intentionality: there''s no principled fact of the matter about which interpretation
  is "the" content; original intentionality is a myth, all intentionality is derived,
  and it''s derived from the stance of interpreters, constrained by success.


