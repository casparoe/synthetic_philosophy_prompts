  outcome, where "possible outcome" ranges over complete consistent assignments. If
  the book is constructed using a sentence φ that the agent can''t evaluate, then
  the *bookie* needs to know the truth to settle the bets, and the bookie''s own resources
  matter. Also, the notion of "guaranteed loss" requires the bookie to settle the
  contract, and the settlement may take unbounded time (φ may be undecidable for the
  agent forever). So the guaranteed loss may not be realizable within any bounded
  time — the agent is exploitable "in the limit," and an unbounded-time exploit isn''t
  a cost the agent need care about. That''s the real subtlety: logical induction replaces
