  A good "proves too much" argument in logical induction:

  (1) Rational credences must be coherent (no Dutch book) at each time.

  (2) Any set of credences that is coherent at a time assigns probability 1 to all
  logical consequences of what it assigns probability 1 to — i.e., coherence over
  logically related sentences requires logical omniscience.

  (3) So a rational agent is logically omniscient or irrational.

  (4) We are not logically omniscient (e.g., about the 10^100th digit of pi, or about
  whether a certain 1000-line program halts).

  (5) So we are irrational.

