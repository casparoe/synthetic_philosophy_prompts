  Prompt draft:


  "I''m writing the historiography section of a course on how we can know anything
  about the deep past, and I want to use the Piltdown affair as my worked example
  of source criticism — but not in the usual way, as a story about gullible scientists
  and a clever hoaxer. Here is the analysis I want, in no more than 900 words.


  Take Marc Bloch''s broad division of historical evidence into two kinds: the deliberate
  testimony of witnesses who intend to inform you, and the involuntary traces that
  past activity leaves behind whether or not anyone meant them to survive — a tax
  roll, a place name, a midden. The distinction is usually invoked to explain why
  traces are safer than testimony: witnesses can lie, but the tax roll wasn''t written
  to persuade you of anything.


  Now run the Piltdown case through it. [supply facts: gravel pit at Piltdown, Sussex;
  fragments brought to Dawson; Dawson and Woodward announced a human-like cranium
  combined with an ape-like jaw at a Geological Society meeting in December 1912;
  "Eoanthropus dawsoni"; the find seemed to settle a live dispute in favor of a brain-first
  model of human evolution and to supply an early English ancestor; experts accepted
  it for four decades; in 1915 Dawson produced a second set of fragments from a different
  site, which appeared to answer the objection that the first assemblage might just
  be a modern human skull and an ape jaw that had happened to end up in the same gravel;
  in 1953 fluorine analysis, together with the discovery that the teeth had been abraded
  by a file and that the bones had been stained to look mineralized, showed the jaw
  to be that of a modern orangutan and the cranial fragments to be of medieval human
  bone.]


  Questions: ...


  Where the distinction gets the case right, where it gets it wrong / is silent, and
  what the case shows about the distinction. Specifically:


  (a) Sort the evidence into Bloch''s two categories — but notice that the gravel-pit
  fragments arrive inside a provenance story told by the same person who controlled
  the material, and that the "trace" was staged to look like a trace. Does Bloch''s
  taxonomy have a place for a deliberately planted trace, and if it doesn''t, is that
  a gap to be filled by a third category or a sign that the two-category scheme was
  never tracking what matters?


  (b) The second site. Explain why a second discovery from a different location felt
  like corroboration, and state precisely what independence corroboration requires.
  Then say what the case teaches about corroboration when one agent controls every
  channel — and whether that generalizes to the ordinary case of a single archive
