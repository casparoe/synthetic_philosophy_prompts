  (c) Expectation. The find confirmed what the British establishment most wanted...
  Ask whether a source-critical method should discount evidence in proportion to how
  well it fits the community''s antecedent expectations, and whether such a rule is
  even coherent or whether it collapses into skepticism about all confirmatory evidence.


  (d) The 40 years. The decisive tests (fluorine uptake, the file marks, the stain)
  were either unavailable or unperformed... What does that imply for the classic claim
  that source criticism is a matter of method rather than technology? Was the failure
  methodological or instrumental? Be careful here: I don''t want the answer to be
