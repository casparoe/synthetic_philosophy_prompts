  Wait — but there''s a subtlety: the revelation principle actually requires the *designer*
  to commit; the hitchhiker is the reverse (agent''s type must be trusted by the principal).
  Also relevant: in mechanism design, "implementability with limited commitment" /
  "renegotiation-proof mechanisms" — the principal can''t commit to not renegotiate,
  so only outcomes that survive renegotiation are implementable. In Parfit''s hitchhiker,
  once you''re in town, the "contract" is renegotiable to zero (you just don''t pay),
  and the driver anticipates this — so only agents whose *type* makes payment IC even
  without enforcement get the ride. That''s exactly "dynamic incentive compatibility
  without commitment" — a real thing (e.g., in repeated games / durable goods monopoly,
  Coase conjecture!). The Coase conjecture is a great hook: a monopolist selling a
  durable good can''t commit not to lower the price later, so the outcome collapses;
  only commitment or reputation saves it. So: "the hitchhiker is a Coase-conjecture
  situation for promises: without commitment, the promise price collapses to zero,
  and the only thing that restores it is a type that will pay."


  Great — the translation is rich. And the residue: (1) mechanism design evaluates
  mechanisms by welfare/revenue, taking agents'' types as given; Parfit asks which
  type you should *acquire*, which requires a criterion outside the model — and Parfit
  supplies S itself as the criterion, generating the "directly self-defeating" result.
