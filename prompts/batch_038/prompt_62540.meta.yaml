  Parfit''s hitchhiker''s deep content:

  (a) The rationality of an action can depend on the rationality of the disposition/motive
  that produced it — act-rationality vs. motive-rationality come apart.

  (b) It can be rational to give yourself motives whose activation you know will lead
  you to act against your interests — "rational irrationality."

  (c) But Parfit insists the motive must be genuine, not a pose; and there''s a further
  issue: whether you can choose your motives, and whether, once you have them, you''ve
  thereby shown they''re not really what you claim (the "self-effacing" / transparency
  problem, cf. the paradox of hedonism, Kavka''s toxin — the toxin puzzle shows you
  can''t intend what you know you won''t have reason to do).

  (d) Parfit''s own conclusion is partly that self-interest theory (S) is directly
  self-defeating — a theory can be rationally followed yet fail by its own criteria.

  (e) The rationalist-blog gloss: CDT loses at Parfit''s hitchhiker (and at transparent
  Newcomb), TDT/UDT/EDT win; and "you should want to be the kind of agent that wins."
  Also: precommitment is only available to agents who can credibly commit, and the
  paradox of whether you can precommit to something you won''t later have reason to
  do.


  Contract theory vocabulary can express (a) as incentive compatibility at each stage
  vs. ex ante; (b) as commitment technology / renegotiation-proofness / time-inconsistency
  (Kydland-Prescott, Strotz''s preference change, hyperbolic discounting with commitment
  devices à la Thaler-Shefrin Ulysses contracts); (c) partially — "cheap talk" vs.
  "costly signals" and the fact that a signal that can be faked isn''t informative;
  but the genuine-vs-pose distinction is expressed as *type* (private information)
  vs. *message*, and mechanism design''s revelation principle says you can without
  loss of generality restrict to truthful direct mechanisms — that''s a very sharp
  hook! The revelation principle says: any outcome implementable by any mechanism
  is implementable by a truthful direct-revelation mechanism. But Parfit''s hitchhiker
  is a counterexample-flavored: the driver can''t commit to a mechanism, and the "message"
  (your disposition) must be verifiable by observation of type, not by report. So
  in mechanism design you''d say the hitchhiker is an implementation problem where
  the agent''s *type* is the relevant private information and there''s no commitment
  on the principal''s side; and "rational irrationality" is just acquiring a type
  that is incentive-compatible for the principal. And here''s a great residue point:
  mechanism design treats types as primitives, drawn by nature, not chosen — so the
  whole question "should I change my type, and is that rational?" is off-menu. Economics
  can say "it''d be good for you to have those preferences" (a second-order statement)
  but has no first-order way to say whether you can, and no way to evaluate the choice
  of a preference by the preference itself (that''s circular). Parfit is precisely
  exploiting that circularity: he evaluates motives by S''s own criterion and finds
  S self-defeating. Also: mechanism design''s "rationality" is instrumental given
  preferences; Parfit''s is about which preferences to have, so the target vocabulary
  can''t even state the conclusion — a genuine residue that indicates the target framework''s
  limits (preferences exogenous), not that Parfit is confused.


