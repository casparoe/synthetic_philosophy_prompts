  hypotheses), so the model has concrete material:

  - Univocity: one concept of death covering both the circulatory prong and the neurologic
  prong — or is "death" simply two different events unified by law? He can note the
  statute has two prongs and ask whether any adequate definition must explain why
  they pick out the same event.

  - Determinacy of time: death must have a timestamp (for inheritance, homicide liability,
  transplant timing). But dying is a process; is a point-valued timestamp a genuine
  requirement or a legal convenience being smuggled into the metaphysics?

  - Bedside decidability with finite information: the test must be performable at
  the bedside by non-specialists with available equipment, in bounded time. Irreversibility
  looks like a modal claim about all possible future interventions; how is that testable?
  What''s the acceptable operational proxy, and does using a proxy smuggle in a different
  concept?

  - Technology-relativity / indexicality: "irreversible" appears to depend on what''s
  available (a DCD patient on an operating table with an ECMO team standing by vs.
  the same patient alone in a ward). His engineering instinct: this makes death a
  property of the organism-plus-environment rather than the organism, like a liveness
  check that depends on the health of the monitoring system — a deadlock detector
  that only reports deadlock relative to available resources. He asks: must an adequate
  definition avoid this relativization, or is it acceptable/inevitable?

  - Irreversibility vs permanence: some authors say what matters is permanence (circulation
  will not be restored because no one will try), not irreversibility (could not be
  restored). Ask which is a genuine requirement and whether the statute''s wording
  commits to one.

