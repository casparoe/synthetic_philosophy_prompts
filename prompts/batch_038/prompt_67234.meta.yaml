  Include:


  Setting: advanced undergraduate epistemology seminar, 14 students, 75 minutes, they''ve
  had reliabilism, sensitivity, safety, closure, and the Gettier material; they have
  NOT encountered bootstrapping/easy knowledge; they''re primed for tricks.


  Target phenomenology: they should, in the room, produce a track record for a device
  using only the device''s own outputs, come to believe the device is reliable, act
  on that belief with something at stake, and only then discover that the reasoning
  pattern that got them there would have delivered the same confidence about a device
  that was in fact broken in a way their record could never expose. And each individual
  step must have felt unobjectionable.


  Hard design constraints (injected specifics):

  - No lecture, no terminology until debrief; the words "bootstrapping," "easy knowledge,"
  "circular," and "reliabilism" are banned from the facilitator''s mouth until the
  reveal.

  - The device must be physical, buildable from a supply closet: a sealed box, a deck
  of cards, index cards, a window/display; no computer, no phone app, no random number
  generator that students can audit.

  - Every participant must keep a paper ledger with a fixed column structure that
  makes the inference pattern visible in their own handwriting: reading / belief /
  match. The match column must be filled without independent access.

  - Two conditions run in parallel: half the room gets a device they can spot-check
  for a fee (genuine independent feedback available but costly), half gets one they
  can never check. Prediction the model should design for: the never-check group ends
  up more confident. Also require the model to explain how to handle if that prediction
  fails.

  - A hidden defect: the facilitator must be able to introduce, mid-game, a fault
  in the device that the ledger cannot expose — and require the model to specify how
  the defect is implemented with cards so that it remains undetectable from inside
  the ledger, and what the reveal looks like.

  - Payoff: points convertible into a trivially small amount of participation credit
  or snacks; betting must actually cost; no real money.

