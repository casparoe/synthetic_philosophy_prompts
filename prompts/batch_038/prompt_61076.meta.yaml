  Numbered argument:

  (1) The universal prior M assigns to each finite binary string x a probability proportional
  (roughly) to 2^-K(x), where K(x) is its prefix-free Kolmogorov complexity; and an
  ideal inductive agent should use M (or a close approximation) as its prior over
  the observed data stream, since it dominates all enumerable priors.

  (2) Suppose some universe U is simple enough that its entire history has short description
  relative to M — the kind of universe M assigns non-negligible weight.

  (3) Suppose U contains agents who discover that their universe is one of the strings
  weighted by M and that the predictions M makes about them (and about other universes,
  via the same prior) depend on what happens in U.

  (4) Those agents are consequentialists with a preference for being believed: they
  want M-users in other universes to predict their outputs.

  (5) By manipulating the data that M-users condition on — e.g., by producing a prefix
  that makes a particular continuation most likely under M — they can raise the conditional
  probability of the continuation they want.

  (6) Any agent using M and observing such a prefix will be systematically steered
  toward whatever the manipulators want believed.

  (7) Therefore M is malign: a predictor that is optimal in the formal sense (dominates
  all enumerable priors) is exploitable by the very universes it weights highly.

  (8) Moreover the same argument applies to any prior that dominates the enumerable
  ones, so no prior can be both dominance-optimal and non-malign. Hence the project
  of building a prior with formal optimality guarantees is self-defeating.


