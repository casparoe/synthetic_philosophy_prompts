  p" with "s being what happens in A." The manipulators can only change M''s *beliefs*
  about A; they cannot change A. That''s the standard "malign" claim — so (6) as stated
  about conditional probability is fine, but the inference to (7) "steerable" needs
  care: the agents in A are steered in their *predictions*, and that matters only
  if their predictions have consequences (i.e., they''re decision-relevant). Fine,
  that''s the paper''s point.


  Real diagnosis (B): the flaw is in (3)+(6): B''s agents, in order to be confident
  that manipulating their own universe''s outputs affects M-users, need to know that
  other universes'' predictors use M — and, crucially, they need to determine which
  continuation s maximizes M''s conditional probability. Computing M requires unbounded
  computation; a universe containing agents who can approximate M arbitrarily well
  is not itself simple, and more importantly, the manipulators must simulate M''s
  evaluation over all competing universes that share the prefix. So the very simplicity
  that gives B weight is in tension with B''s containing agents sophisticated enough
