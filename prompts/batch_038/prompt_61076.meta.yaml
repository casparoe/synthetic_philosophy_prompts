  s, then B''s agents know p, fine. But: the crucial issue is that M-users in different
  target universes A and A'' have different prefixes. For B''s agents to influence
  A, B''s history must begin with A''s prefix p_A. Since B is a single universe with
  a single history, it matches at most one relevant prefix — but there are infinitely
  many M-users. Hmm, this is fine: each B matches some prefix.


