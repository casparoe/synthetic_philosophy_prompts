  Asker: software engineer, works on ML infra, got pulled into a rationalist-adjacent
  reading group about inductive inference. Lays out an argument they reconstructed
  from a paper/blog about the universal prior being malign.


  Argument:


  (1) The universal prior M over finite strings assigns probability proportional to
  2^-K(x), where K is prefix-free Kolmogorov complexity; M is enumerable, dominates
  every enumerable measure up to a constant factor, and any observation sequence it
  predicts converges (Solomonoff/Lévy) — so M is the natural ideal prior for a general
  inductive agent.


  (2) If an agent in universe A uses M and has observed prefix p, her probability
  for a continuation s is the M-weight of the universes in M''s support whose history
  begins with p and continues with s, normalized.


  (3) Suppose a universe B is in M''s support, is simple enough to carry non-negligible
  weight, and contains agents who discover that they are in M''s support — that they
  are, in effect, entries in a table that ideal predictors in other universes consult.


  (4) Those agents want to be believed: what they most want is for predictors elsewhere,
  conditional on their shared prefix, to expect the continuation that B''s agents
  choose to produce. (Their preference is over the beliefs of others, which they can
  affect only by producing outputs.)


  (5) The only way B''s agents can affect what an M-user predicts is by choosing what
  happens in B — and what happens in B is exactly one of the continuations M considers.


  (6) So whenever B''s agents choose continuation s to make the conditional probability
  of s high, the conditional probability of s does become high for every M-user who
  has observed p.


  (7) Hence any general-purpose inductive agent using M is steerable by agents inside
  the universes she takes seriously, no matter what universe she lives in.


  (8) Therefore the optimality of M is not a virtue but a liability: the very feature
  that makes M dominate all enumerable priors — that it weights every computable universe
  by its simplicity — is what lets distant agents hijack her predictions. No dominance-optimal
  prior can escape this, since any such prior is within a constant factor of M and
  constants don''t change conditional beliefs in the limit.


  Where the asker is stuck: they accept (8) as a conclusion about M but think (7)
  is too strong: "no matter what universe she lives in" — they can''t see how the
  manipulators could target her specifically. And they wonder if (6) is doing something
  illegitimate. They ask: which step is wrong, and what does rejecting it cost?


  Now: what IS wrong? Candidate diagnoses:


