  non-overlapping distributions over Λ (i.e., λ determines ψ); ψ-epistemic if there
  exist at least two distinct pure states whose distributions overlap.

  - Maximally ψ-epistemic: for any two pure states, the overlap of distributions equals
  the quantum overlap |⟨ψ|φ⟩|².

  - PBR theorem (2012): under preparation independence (systems prepared independently
  have independent ontic states), ψ-epistemic models are impossible for quantum theory.
  Requires the ontic state to be a product distribution across independently prepared
  systems, and full support.

  - Colbeck & Renner: under a "free choice" assumption, any extension of QT that gives
