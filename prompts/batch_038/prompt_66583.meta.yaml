  Genuine tensions:

  - T1: (3)+(4) voluntarism vs. reason-tracking: if commitments are constrained to
  be responses to pre-existing reasons, then the will isn''t creating reasons, and
  where reason underdetermines the choice (as (1)/(2) insist), (4) has nothing to
  grip. Either the will is creative (then (4) fails) or it''s responsive (then (3)
  fails to explain what happens when the scales are balanced). This is a real, non-obvious
  tension (Chang herself tries to handle it — voluntarism constrained by "what you
  stand for").

  - T2: (7) small improvement + (10) anti-lexicographic + transitivity of "at least
  as good as": the classic small-improvement argument against parity, or the money-pump
  style: if A+ is not better than B, and A+ is better than A, then... Actually the
  standard challenge: parity plus small improvements plus transitivity yields either
  a violation of transitivity of "not worse than" or collapse into equality. If the
  asker accepts both parity and the transitivity of the comparative relation, plus
  that any finite improvement eventually flips (a continuity/archimedean assumption
  implied by (10)?), then a sorites forces parity to be unstable — either it collapses
  into "equally good" (contradicting (1)) or the relation is intransitive. This is
  a good, technical, non-obvious tension: the Archimedean/no-lexical-priority commitment
  interacts badly with parity via a sorites on small improvements.

  - Apparent tension that dissolves: (9) rational regret plus (1) — people think that
  if you rationally regret the forgone option, you must think it was better, hence
  comparable. But regret need not be a comparative judgment about betterness; it can
  track the value of what was lost without a ranking. Or: (8) monetary compensation
