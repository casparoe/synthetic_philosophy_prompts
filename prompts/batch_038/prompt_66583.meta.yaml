  - An ontological model: ontic state space Λ, preparation procedures P induce probability
  distributions μ_P(λ) over Λ, measurement procedures M have response functions ξ_M(k|λ),
  transformation procedures T map Λ→Λ stochastically. Operational equivalence: two
