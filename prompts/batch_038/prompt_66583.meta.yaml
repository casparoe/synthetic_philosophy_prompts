  Draft:


  I am a handling editor for a small interdisciplinary journal in the philosophy and
  foundations of physics. Each round we receive roughly thirty submissions bearing
  on the reality of the quantum state, and they are triaged by three of us, only one
  of whom is a specialist. What we need is a triage sheet that can be run in about
  twenty-five minutes from the abstract and introduction alone, that sorts each submission
  according to where it stands with respect to the ψ-ontic/ψ-epistemic distinction,
  and that tells us when to send it to a specialist referee rather than decide anything
  ourselves. I would like you to write that sheet.


  The distinction we are working with, as I understand it: an ontological model posits
  a space Λ of ontic states, associates each preparation procedure with a probability
  distribution over Λ, and each measurement procedure with response functions giving
  the probability of each outcome conditional on λ. A model is ψ-ontic if any two
  distinct pure quantum states are represented by distributions with disjoint support,
  so that λ alone determines which pure state was prepared; it is ψ-epistemic if some
  pair of distinct pure states is represented by overlapping distributions, so that
  λ does not settle which was prepared. A model is maximally ψ-epistemic if, for every
  pair, the overlap equals the quantum overlap of the states.


  The current triage sheet reads as follows...


