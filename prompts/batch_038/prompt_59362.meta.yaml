  is the case" — dialetheism about the Liar doesn''t help with Curry; you get triviality
  via Curry unless the conditional is restricted. This is a real pressure point for
  dialetheic solutions to semantic paradoxes. Priest''s response involves rejecting
  contraction or using a non-transitive conditional.

  - Paraconsistent logic ≠ dialetheism: one can be a paraconsistentist without accepting
  any true contradictions (e.g., for handling inconsistent but non-trivial theories,
  databases, belief revision, relevance logic). Conversely dialetheism entails paraconsistency
  in the sense that logic must not explode.

  - Relevant logic (Anderson & Belnap), FDE (first-degree entailation, four-valued:
  T, F, both, neither), Belnap''s four-valued logic — the both/neither values.

  -Applications: inconsistent databases (don''t explode when contradictory records),
  legal reasoning (conflicting norms), belief revision (keep contradictory beliefs
  temporarily), scientific theories that were inconsistent (Bohr''s atom, early calculus),
