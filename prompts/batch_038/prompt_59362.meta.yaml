  In LP: values 1 (true only), 0 (false only), ½ (both). Designated: 1 and ½. Negation:
  ¬1 = 0, ¬0 = 1, ¬½ = ½. Conditional (material, defined as ¬A ∨ B): A→B takes value...
  For A=½, B=0: ¬A ∨ B = ½ ∨ 0 = max in the ordering where ½ is top? The ordering
  for LP: 0 < ½ and 0 < 1, with ½ and 1 both above 0. Disjunction takes the max under
  this ordering with 1 and ½ both greater than 0 but incomparable... Actually standard:
  in LP, A ∨ B = A if A is designated... hmm. The standard definition: A ∨ B = max(A,B)
  in the lattice where ½ is the top element. Let me recall: LP truth values ordered
  with ½ (both) as greatest, then 1 and 0 both below. Disjunction = max, conjunction
  = min. So ½ ∨ 0 = ½, which is designated. So A→B = ¬A ∨ B: with A=½, B=0: ¬A=½,
  so ½ ∨ 0 = ½, designated. So the material conditional is designated even when antecedent
  designated and consequent false. So modus ponens fails in LP: A true (designated,
  ½), A→B designated (½), but B = 0 (undesignated). Yes — MP fails in LP. That''s
  why relevant logics and Priest''s later work on LPQ / "Logic of Paradox with a suitable
  conditional" (B⇒) come in — Priest argues for a non-monotonic, non-transitive conditional,
  or uses LP⊃ with a "suitable conditional" that satisfies MP but not contraposition
  / transitivity.


  Also: LP validates disjunctive syllogism? No — DS fails in LP: A ∨ B, ¬A, therefore
  B. If A = ½ and B = 0: A ∨ B = ½ (designated), ¬A = ½ (designated), B = 0 undesignated.
  So DS fails. That''s the classic complaint: from a contradiction you can''t infer
  anything, so you can''t reason your way out of contradictions. Priest''s answer:
  the dialetheist can accept that DS fails for the formal system but argue that in
  practice, we reject contradictions except in specific cases (like the liar). Also
  "rejecting" a dialetheia is problematic — Priest''s "dialetheist can''t express
  rejection" objection (a well-known issue: how does the dialetheist say "the Liar
  sentence is not true only"? — needs a denial operator, or the notion of "absolutely
  contradictory").


  Other content:

