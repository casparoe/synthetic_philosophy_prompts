  historian who works almost entirely with quantitative data, and M., a cultural sociologist
  — about whether Weber''s Protestant ethic thesis is an explanation at all. Neither
  would yield, and I was no use as a referee. Here is the exchange as I have reconstructed
  it.


  1. M. opened by saying the thesis is the paradigm of a genuine cultural explanation:
  a religiously grounded orientation to work — a calling, methodical conduct, profit
  reinvested rather than consumed — raised the probability of a distinctive capitalist
  disposition, and that Weber framed the connection as an elective affinity, not a
  law.

  2. H. answered that the quantitative literature has finished it off: the Protestant
  economic advantage disappears once you control for literacy and school enrollment,
  which is just what you would expect if what mattered was the drive to read scripture
  rather than any value.

  3. M. said this concedes the argument, because getting a population to teach every
  child to read is itself the product of a religious valuation; the literacy variable
  is part of the culture, not an alternative to it.

  4. H. said that is precisely the tell: the thesis cannot fail. Thrift explains accumulation;
  where thrift did not accumulate, methodical discipline explains that; and every
  mechanism anyone uncovers gets absorbed into the culture. A claim that survives
  any outcome explains nothing.

  5. M. replied that demanding a mechanism is question-begging, since Weber''s method
  was counterfactual and probabilistic — ask whether things would have gone differently
  without those orientations — and probabilistic causation is still causation.

  6. H. said then culture is only a summary label for the behavior being explained,
  so the thesis either redescribes its own explanandum or reduces to individual beliefs
  and incentives, in which case it is psychology in costume.

  7. M.''s last move: the ethic outlived the theology that produced it and went on
  disciplining conduct for generations afterward, which a story built only out of
  current individual beliefs cannot accommodate.


