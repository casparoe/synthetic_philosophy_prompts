  Moloch / multipolar traps theory''s core claims: (1) individually rational play
  yields collectively worse outcomes; (2) unilateral restraint is punished, so no
  player can escape; (3) the trap is sustained by the structure, not by bad actors;
  (4) escape requires changing the game — external enforcement, club formation, technological
  change altering payoffs, or exit.


  The most interesting *test* of the theory: an episode where the trap *did* break,
  or where the trap''s players are not symmetric, or where the "collectively worse"
  premise is false (someone gains), or where the trap was sustained by *belief* rather
  than payoff structure (i.e., a coordination problem mistaken for a PD).


