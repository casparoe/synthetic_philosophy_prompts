  I sit as a patient representative on the ethics advisory group of a public hospital
  network. Last year the network replaced its nurse-led intake interviews with an
  automated pipeline: patients record a spoken account of their symptoms at a kiosk
  or by phone, a speech-recognition model transcribes it, a second model converts
  the transcript into a structured summary with a triage score, and clinicians see
  only the summary. A community group obtained an internal audit. Controlling for
  presenting complaint, recordings in one stigmatized working-class dialect of the
  region had markedly higher transcription error rates, produced shorter and vaguer
  summaries, and received lower triage scores; the network also found that repeat
  callers from those neighborhoods had changed how they described their symptoms over
  time.


  At last month''s meeting two members argued about how to characterize this. I''m
  reporting their exchange as neutrally as I can; I have no stake in either position
  and would rather not signal which I find persuasive.


  (1) Miriam said this is a straightforward testimonial injustice: a class of patients
  is systematically awarded less credibility than they are due, and the harm is precisely
  the one the concept names — they are wronged in their capacity as givers of knowledge.


  (2) Tom replied that the concept is being used loosely. Testimonial injustice, as
  it is standardly defined, requires a hearer whose perception of the speaker''s credibility
  is distorted by an identity prejudice. A recognition model has no perceptions and
  holds no prejudices; it has error rates that vary by accent. If every statistical
  disparity in accuracy counts as testimonial injustice, the term collapses into a
  synonym for ''unfair system,'' and we lose the specific thing it was invented to
  pick out.


  (3) Miriam said the model is not the only hearer in the chain. Clinicians read the
  summary and act on it, and the prejudices of the wider society are embedded both
  in the training data and in the clinical readers who take a garbled, hedged summary
  as evidence of an unclear or unreliable patient. The machine is a conduit, not a
  substitute for a hearer.


  (4) Tom granted that a human hearer exists at the end but said this proves too much
  for Miriam''s purposes: if the wrong is done by clinicians discounting patients
