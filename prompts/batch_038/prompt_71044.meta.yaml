  Known analogies in vagueness literature that do argumentative work:

  - Epistemicists use "ignorance of sharp boundaries is familiar" analogies: we can''t
  tell exactly when someone fell asleep, or exactly how many hairs make the difference
  between bald and not — but there is a fact. Williamson: our ignorance in borderline
  cases is like ignorance due to margin for error principles.

  - Supervaluationists: "the sentence is true on all ways of making it precise" —
  analogy to ambiguity resolution? Not really an analogy.

  - Contextualists: vagueness is like indexicality / gradable adjectives like "tall"
  — analogy between vague predicates and context-sensitive terms.

  - Degree theorists: vague predicates are like "tall" measured on a continuum of
  degrees of truth — analogy to fuzzy sets.

  - A common popular analogy: "the heap problem is like Zeno''s paradox" — both are
  resolved by understanding limits? Someone might argue the sorites is dissolved like
  Zeno''s paradoxes are dissolved by calculus. That''s an analogy in use: the sorites
  paradox is a Zeno paradox in disguise; just as calculus dissolves Achilles and the
  tortoise by showing an infinite series converges, so we should dissolve sorites
  by noting... hmm, that''s interesting but a bit contrived.


  Better known popular analogy for vagueness: the spectrum of colors / the boundary
