  analogy I''ve seen doing real argumentative work in vagueness discussions outside
  philosophy: "vague categories are like legal age limits — the law draws a sharp
  line at 18 even though there''s no real difference at midnight; the sharp line is
  a stipulation, not a discovery." This analogy is used to argue for the "no fact
  of the matter, just useful stipulation" view (or, conversely, epistemicism: there''s
  a sharp line, we just can''t know it). Someone could use the legal-age analogy to
  argue that borderline cases show vagueness is merely verbal/pragmatic — the world
  is precise, our words are stipulative. Audit: what maps onto what (the legislature
  → the language community? the statute''s cutoff → the semantic boundary? the moral
  arbitrariness of the cutoff → semantic indeterminacy?), where it breaks: the law''s
  cutoff is publicly promulgated, dated, and enforceable; nobody legislated the meaning
  of "bald"; there''s no authority to change it by fiat; and the law''s sharp line
  coexists with acknowledged penumbral cases (maturity), whereas vagueness seems built
  into competence itself. Also, the legal analogy assumes there''s a determinate fact
  about the underlying continuum (age in seconds) and only the classification is stipulated
  — which concedes semantic precision could be fixed, whereas in vagueness the classification''s
  boundaries can''t be fixed without changing the meaning. And it smuggles in that
  a sharp boundary is always available and harmless — but for vague predicates, drawing
  one generates a false claim (calling a 5,001-grain collection not a heap), whereas
  calling a 17-year-364-day person a minor is not false. Nice.


