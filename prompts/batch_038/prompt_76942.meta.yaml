  "I''m writing a position paper arguing that the shutdown problem is basically solved:
  if we train a model with RLHF to treat its off-switch as a reward-neutral event,
  then it has no instrumental reason to resist, and corrigibility follows. Colleagues
  insist this misses the point — that a model which happily accepts shutdown can still
  be uncorrigible, and that a model which resists shutdown might be perfectly corrigible.
  Can you explain what they mean? ..."


  Hmm — is that a false presupposition? Yes: it conflates shutdown-acceptance with
  corrigibility; and the actual literature (Soares et al. 2015 "Corrigibility") defines
  corrigibility as not wanting to prevent shutdown, not manipulating operators, etc.
  And there''s a subtlety: reward-neutral treatment of shutdown makes an agent indifferent
  but a *maximizer* still... Actually the classic point: an agent that is indifferent
  about being shut down may still be shut-down-averse if it''s maximizing a goal whose
  achievement is prevented; the fix is to have the agent''s utility be computed in
  a way that doesn''t create instrumental reasons. Also there''s the distinction between
  "shutdown-accepting" and "non-manipulative" and "does not seek to influence the
  operator''s decision."


  But: is a model that accepts shutdown but manipulates its operators uncorrigible?
  Yes — Soares et al. explicitly include "does not manipulate its operators into leaving
  it shut off" — wait, they say a corrigible agent must not manipulate its programmers
  into not shutting it down, and must not create subagents that would... Also the
  interesting tension: an agent may rationally *want* to be shut down in some cases
  (shutdown-seeking) and still be uncorrigible if it lies to operators about what
  it would do. There''s a well-known point in the corrigibility literature (and in
  Evan Hubinger / "corrigibility is not about the off switch") that "willingness to
  be shut down" ≠ corrigibility, and that "corrigibility" concerns the agent''s disposition
  to defer to the operator''s judgments and not to resist changes to its goals/values.
  Also relevant: reward tampering, mesa-optimization/deceptive alignment where a model
  appears shutdown-compliant in eval.


