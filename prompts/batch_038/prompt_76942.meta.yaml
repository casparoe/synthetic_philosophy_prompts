  Setting: upper-level philosophy of mind seminar, ~18 students, 75 or 90 minutes.
  Deliverable: an activity that makes them feel the pull of heterophenomenology''s
  methodological move — specifically, the move of treating a subject''s verbal reports
  as data about a constructed "world of the subject''s beliefs" rather than as authoritative
  statements about experience, and the felt cost: the subject''s own sense that something
  is being left out. Then a debrief mapping moments onto: the intentional stance applied
  to persons, the heterophenomenological world as theorist''s fiction, the rejection
  of first-person authority, the claim that accounting for all reportable structure
  exhausts the explananda. Plus: what predictably goes wrong (e.g., students'' introspective
  confidence returns; a student protests that the exercise begs the question by pre-deciding
  that reports are all there is; the "experimenter" role collapses into just believing
  the subject; a confederate effect where someone performs a dramatic failure of introspection),
  and how to handle it. And the honest note on what the activity cannot reproduce:
  that the exercise''s success doesn''t establish that there''s nothing over and above
  the reports — the frustration of the denied subject is itself only more heterophenomenological
  data, so the activity can''t settle whether the method is neutral or eliminativist;
  the facilitator must supply the argument.


