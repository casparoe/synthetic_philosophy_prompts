  Actually a really sharp philosophical puzzle, well-suited: the combination of (i)
  the German Basic Law''s ban on retroactive criminal law (nulla poena sine lege,
  Art. 103(2)), which the Federal Constitutional Court applied strictly in the border-shooting
  cases (Mauerschützen) — the GDR border guards were convicted despite claiming they
  acted under GDR law, on the ground that a higher, unwritten law (human rights) made
  the act criminal, or on the ground that GDR law itself, properly interpreted, forbade
  it; and (ii) the fact that the Federal Republic treats itself as legally continuous
  with the Reich and thus liable for its debts/obligations, and (iii) the practice
  of the German state officially apologizing for crimes and continuing to pay reparations
  decades later — while (iv) criminal guilt is strictly individual (no vicarious criminal
  liability).


  So the tension: the state''s civil/liability continuity across regime change presupposes
  the persisting corporate person; but the criminal law presupposes that guilt is
  strictly personal and non-transferable, so the very same institution (the German
  state) that inherits the Reich''s obligations to pay is not the subject of any criminal
  guilt, and the individual who could be criminally guilty — the 95-year-old former
  guard — is being prosecuted for acts committed by a 19-year-old, which raises diachronic
  identity questions the practice never addresses. And Jaspers'' distinction (criminal,
  political, moral, metaphysical guilt) is exactly the vocabulary. This is great:
  the practice is concrete and well-known-ish, and the deliverable is an implicit
  theory.


