  The elements are these. The Republic does not present itself as a new state that
  succeeded the Reich but as the same legal subject, reorganised and partly re-founded;
  on that footing it inherits treaties, citizenship and public debt, and it also —
  this is the point — treats the crimes as its own. The Bundestag and the Chancellor
  apologise in the first person plural, a national memorial to the murdered Jews of
  Europe stands at the centre of the capital, the anniversary of the liberation of
  Auschwitz is a statutory day of remembrance, the crimes are taught in every Land
  as the nation''s own history, restitution and pensions are paid to survivors and
  to their representative organisations, and the payments continue. Criminal law runs
  the other way: the state cannot be prosecuted, guilt is strictly personal, no living
  German is said to be guilty of anything, and the only route to the past is the trial
  of individual, now very old, former guards and clerks as accessories to murder —
  murder alone being exempt from the statute of limitations. When Greece and Poland
  press reparation claims, the continuity that carries the apology is set aside and
  the government answers that everything was legally settled long ago.


