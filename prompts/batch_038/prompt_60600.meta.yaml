  I am a high school senior, and for my school''s senior humanities seminar I have
  been working on an independent project about how social conventions arise and why
  we feel bound by them. Most of what I have read is David Lewis''s account of convention,
  together with the more recent work that tries to explain the same phenomenon with
  evolutionary game theory — populations of simple agents who imitate whatever seems
  to be working, without representing anyone''s beliefs. I have written down the position
  I mean to defend, and before I hand it in I would like someone to test whether it
  is actually coherent. I am not asking for a general introduction to the topic; I
  would like an audit of my own commitments.


  Here is what I hold:


  1. A convention is a regularity in the behavior of members of a population in some
  recurrent situation, such that each of them prefers to conform on the condition
  that the others conform, and each expects the others to conform. The reason to conform
  is generated by the expectation of conformity; it is not a standing duty that survives
  the collapse of that expectation.


  2. Common knowledge matters, and I mean it strictly. It is not enough that everyone
  in fact conforms and that everyone believes everyone conforms; it must also be common
  knowledge that they do, since the expectation that makes conformity rational has
  to be mutually available at every level. Widespread true belief that falls short
  of common knowledge does not, on my view, produce a convention.


  3. Conventions are arbitrary in the relevant sense: some alternative regularity
  would have served the population just as well, and there is no fact about the intrinsic
  merits of driving on the right rather than the left. Nothing about my view requires
  that anyone chose the convention, agreed to it, or negotiated it; conventions are
  not the products of decisions, and the absence of a decision is not a defect in
  the account.


  4. The question of which of the equally good candidates actually gets established
  is, I think, an evolutionary one. In a large population, people copy whoever appears
  to be doing well, and a regularity that gains an early foothold spreads by that
  differential imitation. The agents in this story are not reasoning about one another''s
  beliefs at all; they need not even have beliefs about beliefs. What explains the
  outcome is the dynamics of the population, not anyone''s inference.


  5. I am happy to say that nonhuman animals have conventions in this same sense —
  stable greeting displays or spacing patterns that prevent fights from starting,
  for instance. The fact that the animals plainly cannot represent what others represent
  about them does not strike me as a reason to withhold the word.


  6. There is, in addition to the expectation-dependent reason in (1), a moral reason
  to conform to an established convention: someone who deviates enjoys the benefits
  of a shared practice while declining to bear their share of the cost of maintaining
  it, and that is a form of free-riding. I think this moral reason applies to conventions
  generally, not only to the ones backed by law or by explicit agreement.


  7. Promising is just another case of the same thing. To promise is to invoke a practice,
  and the reason to keep the promise is the reason to conform to the practice; there
  is no further, non-conventional obligation standing behind it.


  I realize some of these may sit more comfortably together than they look, and others
  may be flatly incompatible. What I would like is the following. First, identify
  which pairs of commitments are genuinely in tension and which only appear to be,
  and explain the difference rather than assuming every strain I have listed is real.
  Second, rank the genuine tensions by severity, from the one that threatens the whole
  position down to the ones I could live with. Third, for each genuine tension, say
  what the least costly revision would be, what I would lose by making it, and whether
