  I am seventeen and in my senior year, and for the past two years I have run the
  elections for my school''s student council — writing the rules, printing the ballots,
  monitoring the voting, counting them afterward. I inherited almost every rule from
  how actual American elections are run, and this year, when I sat down to revise
  the handbook, I found that I could not justify several of them. I would like help
  working out what view of voting they assume, because I suspect the rules are not
  neutral.


  Here is the cluster of practices, taken together:


  1. The ballot is secret. Not merely unobserved but protected: a voter may not prove
  to anyone how they voted, and in some American states it is a crime to photograph
  a completed ballot. Selling your vote, or voting in exchange for a payment, is a
  crime as well.

  2. At the same time, we treat voting as a matter of public honor and non-voting
  as a mild disgrace. We hand out stickers to wear on your lapel, we publish turnout
  figures as a score, and it is a completely ordinary thing for someone to say that
  a person who did not vote has no right to complain about the result.

  3. Political money runs the other way. Donations above a certain amount must be
  reported with the donor''s name, and those reports are public and searchable; being
  identified as a donor is treated as a normal consequence of giving, and anonymous
  large-scale giving is what the law is designed to prevent.

  4. In Australia, by contrast, voting is legally required and there is a small fine
  for not doing it — but a voter can discharge the obligation by turning in a blank
  or scribbled ballot.


  Questions: What theory of the vote makes that combination hang together? Is the
  vote something the voter owns — in which case why can it not be sold, or shown,
  or traded — or is it held in trust for the polity, in which case why do we exhort
  people to exercise it rather than require them to, as the Australians do? What does
  the secrecy rule rule out: it seems to make it impossible for voting to be a message
  to anyone, since you can never credibly tell an audience what you did, and yet the
  whole rhetorical culture of elections is about expressing yourself at the ballot
  box. And why is political money publicly attributed while political choice is not,
  when both are ways of affecting the same outcome? I am especially interested in
  whether points 1 and 2 are pulling against each other or whether one theory can
  hold both.


  Please distinguish what these practices strictly require from what they merely sit
  comfortably with — I expect more than one account could license the same rules —
  and tell me where the practice is simply underdetermined, so that the choice between
  the candidate theories has to be made on other grounds. Then tell me what would
  have to change if the presupposed view were replaced: if we concluded, say, that
  a vote is the voter''s own property, or that voting is purely instrumental and a
  single vote has no measurable effect, which of the rules would survive and which
  would go, and what would my student council handbook have to look like instead?


