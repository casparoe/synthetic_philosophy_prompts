  Hardin''s 1974 essay "Lifeboat Ethics: The Case Against Helping the Poor" (Psychology
  Today). Key elements:

  - The spaceship Earth metaphor is wrong: a spaceship has a captain; the earth doesn''t.
  Instead, each rich nation is a lifeboat, full of relatively rich people; the ocean
  is full of poor people swimming.

  - Capacity is limited; "carrying capacity" has an operational meaning; there is
  a safety factor — you can admit a few but the margin matters, because of unforeseen
  disasters.

  - Admitting the neediest first is the worst policy because the neediest are least
  capable (this is the harshest bit — "survival of the fittest"-ish), and it selects
  against quality; also, admitting all leads to complete catastrophe, admitting some
  leads to partial catastrophe.

  - The "ratchet effect": with a World Food Bank, aid removes the penalty of overpopulation,
  so population grows, and each round of aid increases the number of dependents —
  an "escalator" for the poor, a ratchet for the system. Hardin contrasts with the
  "one-way" nature of the ratchet.

  - "The tragedy of the commons": Hardin''s earlier 1968 piece — commons is an unmanaged
  resource with no boundary; lifeboat is different because there IS a boundary and
  a crew that can act.

  - "Benign demoralisation": aid demoralises, creating more dependents, destroying
  incentive to plan.

  - Hardin also discusses "metabolism" — the ratio of energy used per person; and
  the point that the poor are poor partly because of high reproduction rates, and
  that "reproduction is the cause of poverty".

  - Also the "dirty business of saying no": Hardin notes that the lifeboat ethics
  requires that some people say no, and that Christians and humanitarians find it
  distasteful; he quotes (I think) a passage about "conscience" being self-defeating
