  and it''s a genuinely new structure the model must engage with, not regurgitate.

  2. A conceptual distinction the asker introduces: "ratchet" vs "signal" — Hardin''s
  ratchet is about replenishment of demand through aid; but the Tampa episode was
  about the opposite move: refusing rescue to send a deterrent signal, i.e. using
  the lifeboat''s capacity as a *transmitter* rather than a *container*. Ask: is deterrent
  refusal still lifeboat ethics, or a different argument wearing lifeboat clothing?
  This is a good inversion.

  3. The "captain" problem: Hardin''s spaceship critique is that a commons has no
  captain; but a lifeboat does. In the Tampa, there were several candidate captains
  — the Norwegian master (who had a duty to rescue and a duty to deliver to a place
  of safety), Australia (the coastal state / SAR coordinator), Indonesia (nearest
  port), the UNHCR — and none of them owned the decision. So the real anomaly is a
  lifeboat with *too many* captains and no single one responsible. Ask the answer
  to name who the captain was and whether the model survives if no one is.

  4. The "433 in one night" vs "capacity" point: the Tampa was not a lifeboat at capacity
  in Hardin''s sense — it was a container ship with 27 crew and 433 people aboard,
  no life-saving equipment, no food, no sanitation: capacity was exceeded instantly
  and *irreversibly* by the act of rescue itself. So Hardin''s model where you can
  choose how many to admit doesn''t apply: the rescue is all-or-nothing, and once
  you''ve done it, the question changes from "how many do I admit" to "where do I
  put them". That''s the deepest mismatch: lifeboat ethics is about *admission*, but
  the Tampa was about *disembarkation*. Ask: does the theory have anything to say
  at all about the post-rescue stage, and if not, was it ever about cases like this?

  5. Hardin''s target: food aid to poor countries / the World Food Bank, not refugees.
