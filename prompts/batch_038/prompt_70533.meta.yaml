  Setup: the two-bitser — a device with two physical states. Under one interpretation,
  state 1 = "heads," state 2 = "tails" (it''s wired to a coin-flipper). Under another
  equally good interpretation, the same two states mean "the Yankees are above .500"
  / "the Yankees are at or below .500" — if it''s wired to a sports data feed. Dennett''s
  point: nothing in the physics picks out one interpretation over the other; content
  is assigned by an interpreter; so there''s no such thing as intrinsic, original
  aboutness — the brain''s states are bitsers too. Searle''s reply (as typically given):
  the two-bitser is precisely an example of derived intentionality — the coin-flip
  interpretation is observer-relative, and Dennett''s argument shows only that *those*
  cases are derived; it doesn''t show that all intentionality is derived. To get from
  "two-bitsers have derived content" to "brain states have derived content," Dennett
  would need an independent argument; the two-bitser case begs the question.


  Moves:


  Round 1: A (let''s call them, e.g., "Dana" and "Ravi," or gender-neutral names)
  says: the two-bitser refutes Searle because it shows there''s no principled way
  to stop the derivation regress — if you say content must be original somewhere,
  you owe an account of what makes the brain''s states original, and any such account
  will look exactly like the interpretation we impose on the bitser.


  Round 2: B says: no, the asymmetry is real and non-question-begging: in the two-bitser
  case, the content depends on how someone uses the device — you can point to the
  actual fact of the matter (the device was designed and deployed to track coin flips,
  so the coin-flip reading is the correct one, or there is no fact at all until someone
  uses it). In the brain case, the states play their role regardless of whether anyone
  interprets them. Searle''s claim: syntax is not intrinsic to physics; but semantics
  can be intrinsic to biology. So B says the two cases differ in a checkable way:
  the bitser''s content changes with the users'' intentions, the brain''s doesn''t.


