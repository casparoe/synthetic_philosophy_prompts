  say which, and diagnose why nobody''s there — incoherent, unattractive, or just
  unexplored.

  - Flag every pair of leaves your questions can''t separate. I bet you''ll find that
  "proves the invariant inside a meta-theory" and "just knows informally that no finite
  sequence will get there" land in the same place; if so, say so rather than inventing
  a fake branch.

  - 6 to 8 questions, printable on one page.


