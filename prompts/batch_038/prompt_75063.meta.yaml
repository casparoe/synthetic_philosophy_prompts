  let me double, and doubling never gives me a multiple of three" sit — is that a
  jump at all, or is it just good problem solving inside one big system? If your answer
  is that it''s all one system and there''s no real outside, that''s fine, but then
  tell me what work the word "system" is doing in my handout.


