  I''m TAing a first-year "minds and machines" seminar and I want to hand out a diagnostic
  — a decision tree that sorts students by what they actually do when they hit the
  MU-puzzle, not by what they say they believe about minds vs machines.


  Setup I''ll give them: the MIU-system, axiom MI, the four rules [state them], target
  MU, and the fact that MU isn''t derivable. Some will grind away forever; some will
  get the invariant about the number of I''s; some will say "the rules are stupid,
  I''m changing them"; some will say "MU is derivable, here''s a proof" and be wrong;
  some will say the impossibility proof is itself the interesting bit.


  Here''s my own pet distinction that I want the tree built around, because I think
  most talk of jumping out of the system equivocates between two things. Call them
  the vertical jump and the lateral jump. The vertical jump is going up to a metalanguage
  that talks about the object system — the invariant argument is exactly that, you''re
  now doing number theory about strings rather than pushing strings around. The lateral
  jump is abandoning the system and starting a different one with different primitives
  — the student who says "I''ll allow myself to delete U''s anywhere" or "let''s just
  say the goal was MUU." Both feel like stepping outside, but only the first one produces
  knowledge, and only the first one is what Gödel''s theorem is actually about. My
  worry is that people who like the Lucas-Penrose line smuggle in the lateral jump:
  they want the mathematician to be doing something the machine can''t, but what they
  describe is usually either (a) a vertical jump that a machine could in principle
  also make, or (b) a lateral jump that isn''t an achievement at all, just rule-breaking.


  So: write the tree. Requirements —

  - Every node is a question about something a student could actually have done or
  said at the blackboard, phrased so a student can answer it without knowing where
  it leads. No node may ask "do you think machines can think" or name any ism.

  - Leaves are positions, named where names exist (formalism, mechanism/Gödelian anti-mechanism,
  the Wittgensteinian "there is no outside" reply, the informal-rigor reply, the deflationist)
  and marked "unnamed" where nobody defends it. Each leaf gets one sentence on its
  most awkward commitment.

