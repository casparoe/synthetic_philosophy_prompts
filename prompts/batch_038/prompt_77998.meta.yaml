  The classic split: **producer teleosemantics** (content = conditions the producer
  mechanism was selected to be caused by — Dretske-ish/Millikan''s "detecting" side)
  vs **consumer teleosemantics** (content = what the downstream consumer system was
  selected to use it for). And the informational theory says content = what the state
  reliably indicates now (or in the learning period). So we can engineer a case where
  all three come apart:


  - Informational/causal theory: the state indicates "vibration signature V" (or "grub-or-worm"),
  so the bird''s pecking is *veridical* — no misrepresentation.

  - Producer teleosemantics: the state''s function is to detect grubs (that''s what
  it was selected to be caused by), so the state represents GRUB and pecking at a
  worm is a *false* representation.

  - Consumer teleosemantics: content is determined by what the consumer needs — the
  digestive/motor system that was selected to benefit from nutrition; the worm gives
  no nutrition, so content is still GRUB? Hmm, they might coincide.


