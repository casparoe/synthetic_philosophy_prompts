  (1) Luck egalitarianism holds that an inequality is unjust just in case, and to
  the extent that, it does not reflect the responsible choices of the people it advantages
  and disadvantages.

  (2) A distribution "reflects" someone''s choice only if that person could reasonably
  have been expected to have chosen otherwise — responsibility requires that the choice
  not be fixed by factors outside the chooser''s control.

  (3) Empirically, the factors that fix a person''s choices are a mixture of genetic
  endowment, childhood environment, peer and situational effects, and stochastic neural
  noise, none of which the person selected. (Say: our two warehouse workers, Ana and
  Bo, are offered the same overtime; Ana takes it, Bo declines; the difference is
  fully accounted for by differences in discount rates, fatigue sensitivity, and family
  obligations they did not choose.)

  (4) So no choice of Ana''s or Bo''s is, in the sense (2) requires, a responsible
  choice; every difference in their lifetime prospects is a matter of brute luck.

  (5) By (1), then, every inequality between them is unjust, and justice requires
  leveling.

  (6) But the same reasoning generalizes: it applies to every inequality between any
  two people, whatever the institutional background, and it applies with equal force
  to the choices of the officials who would carry out the leveling. So luck egalitarianism
  delivers (a) simple outcome equality as its only content, and (b) no account of
  why that content should be pursued by anybody''s choice — since on its own premises
  nobody''s choices are responsible.

  (7) Therefore luck egalitarianism is either indistinguishable from plain egalitarianism
  or self-undermining; in neither case is it a distinct theory.


