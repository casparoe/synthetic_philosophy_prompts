  Now: the flaw. Several candidates:

  - (2) is a smuggling of a libertarian "ultimate origination" condition that luck
  egalitarians do not need; the ambiguity is between "reflects a choice" in the sense
  of *being attributable to the agent''s practical identity / ambitions* vs. "reflects
  a choice" in the sense of *having an uncaused origin*. This is the central equivocation.

  - (3)→(4): even granting that choices have causal histories, the conclusion "every
  difference in prospects is a matter of brute luck" requires that the luck/choice
  distinction be a *metaphysical* one about origination, but it can be a *normative*
  one about the standpoint from which we assess. Also, note the "swallows everything"
  worry: if (4) is accepted, then the very concept of choice drops out, but then (1)
  has no content to negate — it becomes "inequalities are unjust iff they don''t reflect
  choices, and nothing reflects choices, so all inequalities are unjust." But wait:
  (1) as stated says "just in case ... does not reflect responsible choices" — if
  nothing reflects responsible choices, then all inequalities are unjust. Fine, that''s
  (5). But a luck egalitarian who denies (2) reads (1) as a claim about *attribution*,
  and the argument is blocked at (2).

