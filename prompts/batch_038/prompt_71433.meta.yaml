  Here''s a candidate argument in luck egalitarianism that proves too much — the "responsibility-proof"
  / "everything is brute luck" argument:


  (1) Luck egalitarianism: inequalities are unjust iff (and to the extent that) they
  reflect differential luck — i.e., they aren''t traceable to the agents'' choices.

  (2) A choice is "authentically yours" only if it isn''t determined by factors outside
  your control.

  (3) Every choice is caused by a combination of genetics, upbringing, situational
  cues, and neural noise — all of which are outside your control.

  (4) So no choice is authentically yours; all differential outcomes reflect differential
  brute luck.

  (5) So, by (1), all inequalities are unjust.

  (6) So luck egalitarianism collapses into simple, outcome-based egalitarianism and
  the responsibility-sensitivity it was built to capture does no work.


  Now, (6) is a conclusion many luck egalitarians would happily... no, they''d reject
  it. The flaw: the argument equivocates between "the causes of a choice lie outside
  the agent''s control" and "the choice is not the agent''s own / not a matter of
  the agent''s responsibility." Luck egalitarians (and compatibilists generally) need
  only the weaker notion: choices can be attributable to the agent even if caused.
  Also (2) is doing a lot of work: it demands a libertarian freedom condition that
  luck egalitarianism never required — the relevant contrast in luck egalitarianism
  is between what happens *to* you and what you *do*, not between caused and uncaused.
  Also there''s a quantifier/scope issue: (3) says outcomes are caused by luck-factors,
  but luck egalitarianism''s claim is comparative — that the inequality reflects the
  agents'' differing *ambitions/tastes*, and "ambitions" in Dworkin''s sense are precisely
  identified with the agent (the ambition/taste distinction). Also, (4)→(5): even
  if all choices have causal histories in luck, "reflecting differential luck" is
  not the same as "having a causal history in luck"; reflection requires a counterfactual-dependence
  reading. And the argument proves too much in another way: if it worked, it would
  equally show that *nothing* anyone does is their responsibility, which would destroy
  not just luck egalitarianism but the ordinary practice of promising, blaming, and
  holding people to contracts — and (5)''s conclusion ("all inequalities unjust")
  would then be indistinguishable from a claim nobody can act on, since any redistribution
  scheme''s implementation depends on the same choices it denies agency to. Also:
  the argument is self-undermining — if no choices are authentically ours, then the
  political theorist''s choice to adopt luck egalitarianism isn''t either, and the
  argument''s conclusion can''t be a recommendation.


