  do X intelligently you must contemplate a rule; but contemplating the rule is itself
  something done, and to apply it intelligently you must contemplate another rule,
  ad infinitum. Ryle''s positive view: knowing-how is not reducible to knowing-that;
  intelligent performance is not the child of prior intellectual operation. Careful:
  Ryle does not say knowing-how is mere unthinking habit/disposition — he distinguishes
  intelligent capacities from habits; habits are "single-track" dispositions, whereas
  knowing-how involves adaptability, self-criticism, learning from others, applying
  rules in practice. So a summary saying "Ryle showed that skills are just habits,
  not knowledge" is wrong: Ryle explicitly distinguishes skill from habit and insists
  that knowing how involves exercising intelligence, criticism, and improvement. Also
  Ryle is not saying knowing-how isn''t knowledge — he says "knowing how" is a distinct
  sense of knowledge; "knowledge-how" is genuine knowledge.

