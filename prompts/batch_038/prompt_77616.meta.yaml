  correct identity conditions, define M and M'' as the same mechanism relative to
  a monitor if classifying them as the same preserves the monitor''s calibration:
  the conditional distribution of "flagged given genuinely anomalous behavior" is
  unchanged. Identity becomes a pragmatic, instrumental equivalence class tied to
  an evaluation.


