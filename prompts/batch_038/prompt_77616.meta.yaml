  its implementation while preserving behavioral calibration, my criterion says it''s
  the same mechanism, and the monitor stays quiet. That''s a false negative by construction.
  So monitor-relative individuation may be self-undermining: it defines identity in
  terms of the very signal MAD is supposed to independently supply.


