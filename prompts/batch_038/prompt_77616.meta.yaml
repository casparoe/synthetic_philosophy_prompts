  the internals look anomalous relative to a baseline distribution collected during
  evaluation. Motivation: internals may reveal a capability or an intent that behavior
  hides.


  Section 2: The problem of mechanism identity. A baseline is defined over a population
  of internal states presumed to realize "the same mechanism" as the flagged one.
  But monitors are deployed across versions: fine-tunes, distills, different architectures,
  checkpoints along training. Question: when is mechanism M in model A the same mechanism
  as M'' in model B? Three candidate criteria:

  (a) Implementational: same neurons/heads/features and same weights, up to permutation.
  — Fails because of superposition and non-uniqueness of feature decomposition; permutation
  symmetries make "same neuron" ill-defined; also fails across architectures.

  (b) Causal/functional: same input-output counterfactual profile — intervening on
  the component produces the same downstream effects on behavior. Closer, but the
  counterfactual profile is measured behaviorally, and behaviorally equivalent profiles
  can differ in whether they''d generalize under distribution shift — which is exactly
  what we care about. Also multiple realizability: the same function can be realized
  by quite different circuitry; if we say that makes them the same mechanism, we lose
  the ability to detect a mechanism that has silently changed its implementation in
  a way that matters.

  (c) Cluster/kind-based: mechanisms form natural kinds by homeostatic property clustering
  — a mechanism is a cluster of properties (topology, activation statistics, causal
  role, developmental trajectory during training) that co-occur and are maintained
  by the training process. Identity is similarity in the cluster, and cluster membership
  admits of degrees. This looks attractive but threatens to make "same mechanism"
  vague, and vagueness in the baseline is vagueness in the false-positive rate.


