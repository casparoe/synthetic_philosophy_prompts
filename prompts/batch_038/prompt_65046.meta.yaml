  Parfit''s Hitchhiker: A driver offers you a lift into town, which you need, but
  says he''ll only drive you if you promise to pay him... Actually here''s the standard
  version: You''re stranded in the desert. A driver will give you a lift to town only
  if you promise to pay him $100 later. If you''re a straightforward maximizer, you''ll
  promise and then not pay (since paying is costly and there''s no enforcement). The
  driver, being a good judge of character, sees this and doesn''t pick you up. If
  you could become someone who keeps promises even when it''s not in your interest
  (a "constrained maximizer" in Gauthier''s terms — actually the Hitchhiker is Parfit''s
  example illustrating Gauthier''s constrained maximizer vs. straightforward maximizer),
  you''d be picked up. Parfit uses it to argue that we sometimes have reason to acquire
  dispositions to act in ways that we''ll have no reason to act on later — i.e., rational
  irrationality. And Parfit''s point in "Rationality and Reasons" is that the hitchhiker
  has a reason to pay the driver? Or that it''s rational to want to have a reason
  to pay? Parfit''s conclusion: it can be rational to cause ourselves to have certain
  motives even if we''ll then act in ways that we have no reason to act in. He distinguishes
  "we have reason to want to have certain motives" from "we will have reasons to act
  on them."


  Key structural contrast with Kavka''s toxin: In the toxin puzzle, the reward comes
  before the intended action, and forming the intention requires believing you''ll
  drink the toxin, but you know you won''t have any reason to drink it (and drinking
  it isn''t required for the reward). In the hitchhiker case, the benefit comes after,
  contingent on a promise/act that is later costly. Both are cases of "rational irrationality"
  but they differ: in the toxin case the intended act is never beneficial and the
  intention is impossible to form rationally because intentions are transparent to
  your beliefs about your future reasons; in the hitchhiker case, paying is (arguably)
