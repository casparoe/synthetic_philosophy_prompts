  \ a case where an object lacks the disposition but satisfies the conditional — e.g.,\
  \ H2O-filled... Johnston's example: \"the water in the glass is H2O but the conditional\
  \ is satisfied because of a guardian angel\"? Actually Johnston's mimic example\
  \ involves a person who is not brave but whose fear is masked, so they act bravely.\
  \ Manley & Wasserman discuss mimicking.\n- Antidote (Bird): a poisoned chalice —\
  \ Bird's \"antidote\" is what Lewis calls masking; Bird argues antidotes are ubiquitous\
