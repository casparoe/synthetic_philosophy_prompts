  \ conducts — but afterwards the device removes conductivity, so retrodictive conditionals\
  \ fail. Or a \"double mask\": an object that appears to satisfy the conditional\
  \ for two independent reasons, one genuine, one not.\n\nAlso interesting: Lewis's\
