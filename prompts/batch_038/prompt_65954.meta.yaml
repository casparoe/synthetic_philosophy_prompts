  \ Role-play: \"play a Nietzsche scholar who holds the cosmological reading (that\
  \ Nietzsche literally believed in eternal recurrence as a doctrine about time, grounded\
  \ in his notes on energy and the will to power), and I open by challenging with\
  \ the published works never stating it as doctrine, only Zarathustra's animals and\
  \ the demon in Gay Science 341, plus the Nachlass being unpublished and rearranged\
  \ by his sister.\" That's a genuine contest with real resources (the \"greatest\
  \ weight\" passage, the dwarf and the gateway in Zarathustra \"On the Vision and\
  \ the Riddle\", the 1881 notebook entries at Silvaplana, Kaufmann/Heidegger/Löwith/Deleuze\
