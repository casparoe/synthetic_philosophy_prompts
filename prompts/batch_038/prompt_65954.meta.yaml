  \ than Williams.\n\nHmm, but the additional instruction says: \"you'll often have\
  \ to inject some sort of new / niche ideas into the prompt.\" So I should inject\
  \ something novel — e.g., a made-up or unusual case, or an unusual angle.\n\nLet\
  \ me design: Domain = Care ethics. Type = role-play + opening move. Inject a novel\
  \ element: an unusual applied context that care ethics must handle and where the\
  \ standard moves don't fit — e.g., care for non-human/AI entities, or care in institutional\
