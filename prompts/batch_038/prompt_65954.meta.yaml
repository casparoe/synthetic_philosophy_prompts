  \ is prevented not by removing the basis but by adding a new intrinsic property\
  \ only when the stimulus occurs (a fink in reverse), or a case where the object\
  \ loses the disposition exactly when... Let me think of a fresh case.\n\nClassic\
  \ cases:\n- Fink (Martin): a wire is live but a device would remove its conductivity\
  \ when touched — so conditional false though disposition present. Reverse fink:\
  \ an otherwise dead wire that a device would make conductive when touched.\n- Mask\
  \ (Lewis): the sorcerer's chalice — poisoned but an antidote is present in the potion,\
  \ so it's disposed to kill but drinking doesn't. Masking: the intrinsic character\
  \ is retained but the causal chain is blocked (e.g., a styrofoam cup packed in a\
  \ rigid container so it doesn't break when struck — hmm, that's a mask: the disposition\
