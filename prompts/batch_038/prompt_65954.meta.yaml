  \ I open with Williams's action-explanation argument, and inject novelty. Hmm.\n\
  \nI think I might make it more interesting and less canonical by having the model\
  \ play the *internalist* but with a specific further commitment that creates pressure:\
  \ e.g., the internalist who is also a *Humean about motivation* and holds that all\
  \ reasons-claims must be capable of explaining action. Then my opening case can\
  \ exploit something like: on your account, \"the fact that p is a reason for A to\
  \ φ\" is true iff A would φ after sound deliberation; but the analysis is supposed\
  \ to be non-circular about what counts as sound deliberation, and the only available\
