  \ doesn't change that, since deliberation only operates on the elements of S.\n\n\
  Wait — but Williams would say: the person lacks a reason, and we blame them anyway;\
  \ blame is a way of adding reasons (via the mechanism of blame engaging their dispositions...\
  \ hmm, Williams's account of blame: we blame someone only if they had a reason).\
  \ Actually Williams says in \"Internal and External Reasons\" that blame involves\
  \ the claim that the agent had a reason and didn't act on it; and he adds a qualification:\
  \ if the agent has a false belief which is caused by an irrational process (e.g.,\
  \ wishful thinking) that kept them from seeing the reason, we can still blame them\
  \ — but then Williams notes that strictly on his account, such an agent does not\
  \ have a reason; the blame is appropriate because the false belief was formed irrationally.\
  \ So the internalist can say \"we blame but they had no reason,\" which many find\
  \ unpalatable.\n\nOK so a role-play prompt: \"Play a committed Williams-style internalist\
  \ about reasons — sharp, willing to concede small points, never the main one. Stay\
  \ in character until I say stop. One paragraph per reply. Here's my opening: [novel\
