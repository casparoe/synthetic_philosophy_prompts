  \ apart, so dispositions can't be identical to the basis... but the mask case suggests\
  \ the reverse conditional (that conditional truth doesn't imply disposition).\n\n\
  A good role-play: model plays a defender of the \"dispositions just are their categorical\
  \ bases\" (the identity thesis — e.g., Armstrong's or the \"pandispositionalist\"\
  \ vs \"categoricalist\" debate). Hmm.\n\nOr: model plays a pandispositionalist (Alexander\
  \ Bird's \"nature's metaphysics\": all properties are dispositional; dispositions\
