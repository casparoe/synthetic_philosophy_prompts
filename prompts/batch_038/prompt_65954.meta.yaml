  \ is well-known enough (Gilligan's In a Different Voice, Noddings's Caring, Held,\
  \ Tronto, Ruddick, \"maternal thinking\"). Small models know these.\n\nAnother option:\
  \ Dispositions/finks/masks with an injected novel case. That's attractive because\
  \ the literature is \"in the weeds\" and the model can be tested on whether it handles\
  \ fink vs. mask vs. mimic distinctions correctly. And I can inject a novel disposition\
