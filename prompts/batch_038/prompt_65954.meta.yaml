  \ unavailable — e.g., care for someone who cannot reciprocate, cannot be attended\
  \ to (they're anonymous, distant, statistically aggregated), and where the \"attentiveness\"\
  \ phase is impossible: you literally cannot know who needs care. Something like:\
  \ allocating a scarce public resource across a large population where the needy\
  \ are anonymous and the carer is an institution. Care ethics says care must be responsive\
  \ to the particular other, but institutional care must work through rules — and\
  \ the care ethicist's answer (\"political care,\" Tronto's phases, Held's globalizing)\
  \ seems to reintroduce exactly the impartial, rule-governed justice framework care\
  \ ethics was supposed to displace. Plus inject a novel twist: a case where the caring\
  \ response is to *not* attend — e.g., where the recipient's flourishing requires\
  \ the carer to withdraw, so attentiveness and responsiveness come apart; or where\
  \ care for A requires neglect of B, and the \"one caring\" cannot expand circles\
  \ because the circles are genuinely in conflict (Noddings's circles and cylinders\
  \ model: the inner circle of actual caring, outer circles of \"ethical caring\"\
  \ / ideal). A good challenge: Noddings's \"ethical caring\" is a feeling, but obligations\
  \ can't rest on feelings that come and go; so either care ethics grounds obligation\
