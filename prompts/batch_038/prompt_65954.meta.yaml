  \ that is intrinsically brittle, and it is struck, but at the moment of impact a\
  \ field... Hmm, or better: a \"self-fink\" — an object whose disposition, when manifested,\
  \ destroys the basis of the disposition (e.g., a fragile glass that shatters when\
  \ struck — after shattering it's no longer fragile; that's normal, the manifestation\
