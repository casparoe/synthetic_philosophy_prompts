  The argument, in his terms:


  Define: a condition C is "self-announcing" (his word for luminous) if whenever C
  obtains you''re in a position to know it obtains.

  KK: if you know p, you know that you know p.


  His argument:


  (1) Any belief I form from an instrument or from my own senses has a finite resolution:
  there are situations I cannot tell apart from the actual one. (Call these the "indiscernible
  neighbours" of a case.)

  (2) Knowledge is safe: if I know p, then p is true not just in the actual case but
  in every case I couldn''t have distinguished from it. [Margin-for-error.]

  (3) So no condition that can obtain marginally — i.e., that shades continuously
  into not obtaining across my indistinguishable neighbours — is self-announcing.
  Because take the last case in which C obtains and in which I can''t tell it from
  the first case in which C doesn''t: if I knew C obtained there, then by (2) C would
  obtain in the neighbour too, contradiction. Hence I don''t know; hence C isn''t
  self-announcing. [This is Williamson''s argument; fine.]

  (4) Now apply (3) to the condition "knowing p" itself, for any p. It shades off
  too (my evidence, my alertness, the calibration state, all come in degrees). So
  knowing is not self-announcing: KK fails.

  (5) But wait, it''s worse. Suppose I do know p. By (2), p holds across all my indistinguishable
  neighbours. To know that I know p, I need "I know p" to hold across all neighbours
  of the actual case — but each of those neighbours has its own neighbours, and p
  has to hold across those too, since from within a neighbour I can''t tell I''m in
  one. So the safe region for "I know p" is the actual safe region for p shrunk by
  one resolution step, and for "I know that I know p" shrunk by two, etc.

  (6) Every empirical claim has a finite safe region (bounded by the instrument''s
  range, the temperature drift, whatever). So after finitely many iterations n, the
  safe region for the n-fold "I know..." is empty, and at that level I don''t know
  that I know ... that p.

  (7) But if I don''t know that I know p, then it''s not true that I know p — because
  knowledge I can''t recognize isn''t knowledge I can use, and what I can''t use can''t
  be part of my evidence. [Or: because knowledge requires that one be in a position
  to know one knows — a "no blind knowledge" premise.]

  (8) So I never know any empirical claim at all, at any level. Scepticism.


