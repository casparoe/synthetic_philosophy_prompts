  Title: "Neglectedness Is Not a Third Criterion"


  1. The framework and its official justification.

  The standard tripartite heuristic for comparing causes says a cause scores well
  insofar as it is important (large amounts of value at stake), tractable (additional
  effort makes progress), and neglected (few resources are already devoted to it).
  The three are usually presented as roughly independent dimensions to be multiplied
  or averaged. Neglectedness, though, is nearly always defended by an argument from
  diminishing marginal returns: if a problem has already absorbed a great deal of
  money and talent, the cheapest solutions have been taken, and the next dollar buys
  less than the first did. Neglect is thus evidence about where on the returns curve
  we are. On this defense, neglectedness is not a separate value dimension at all;
  it is a discount factor applied to importance and tractability, telling us how much
  of each is still available at the margin.


  2. Four ways a cause can be neglected.

  The defense above works only when a cause is neglected because prior effort saturated
  it. But effort is not the only thing that fails to arrive. Distinguish:

  (a) Saturation neglect: much work has been done; the remaining work is harder.

  (b) Infeasibility neglect: little work has been done because there is, so far as
  anyone can tell, no lever to pull — no technology, no legal vehicle, no delivery
  channel.

  (c) Salience neglect: little work has been done because the problem is unappealing
  — disgusting, frightening, politically radioactive, aesthetically unglamorous, or
  affecting people who are socially invisible (the very young, the very old, non-citizens,
  nonhuman animals, the dead, the unborn).

  (d) Opacity neglect: little work has been done because the problem has not been
  measured, so there is no evidence base to organize effort around and no way to demonstrate
  impact to a funder.


  3. Only one of these supports the criterion; one is a double count; two are misfiled.

  (a) is what the diminishing-returns defense licenses.

  (b) is not neglectedness but tractability under another name: a cause with no lever
  is intractable, and scoring it low twice for the same fact makes the framework look
  stricter than it is.

  (c) is a defect of the community''s attention, not of the cause. Disgust, political
  risk, and social invisibility are not truth-tracking; if anything they are negatively
  correlated with a problem''s being taken up by the people best placed to solve it.
  Treating (c)-neglect as a reason to work on something is defensible, but only as
  a bet against the calibration of everyone else — a claim about the reference class''s
  reliability, not about returns.

  (d) is different again: opacity neglect means the marginal unit of effort is not
  an intervention but a measurement. Its return is epistemic — better estimates for
  everyone downstream, including people who will not work on this cause. The tripartite
  framework has no slot for that.


  4. Two pathologies of the undecomposed criterion.

  First, systematic error in both directions. Because (c)- and (d)-neglect are lumped
  with (a)-neglect, the framework recommends unpopular-for-irrelevant-reasons causes
  alongside genuinely under-worked ones, and it penalizes well-worked causes that
  are well-worked for good reasons. A cause can be crowded because it is the most
  important thing in the world and thousands of the ablest people agree.

  Second, non-convergence. Neglectedness is defined relative to how many people are
  paying attention. A community that follows the criterion successfully makes its
  own recommendations less neglected, and therefore, by the criterion, less recommended.
  The framework cannot reach a fixed point: its output is always whatever its users
  have not yet done. That is fine as a generator of novelty; it is not fine as a criterion
  of value, and it explains a familiar pattern in which a cause area''s attractiveness
  to its own adherents decays on a schedule unrelated to its progress.


  5. The reference-class problem.

  Neglect is indexical. Measured against all philanthropic dollars, almost everything
  of interest is neglected; measured against the resources of the community applying
  the framework, very little is; measured against the number of people who could work
  on it if they chose differently (careers rather than donations), the ranking changes
  again. A heuristic that must silently choose a reference class before it can output
  a number is not the neutral tie-breaker it is presented as.


  6. Proposal.

  Keep the tripartite heuristic for triage and communication, but treat neglectedness
  as derived rather than primitive. Concretely: model a cause''s expected marginal
  value directly (value at stake × probability that additional effort moves the relevant
  quantity × the slope of the returns curve at current investment), and then handle
  (c)- and (d)-neglect explicitly — the first as a prior-adjustment against the reference
  class''s attention, the second as a separate line item for measurement. Where the
  inputs are unavailable, say so, and let the ranking be coarse.


