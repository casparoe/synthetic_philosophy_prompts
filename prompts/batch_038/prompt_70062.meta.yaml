  Draft:


  "Below is a package of views about dispositions I''ve arrived at, and I would like
  an audit of whether they can be held together. I''m not asking for background on
  the debate; I want to know which of these pull against each other, how badly, and
  what would have to be surrendered to restore consistency.


  1. A true disposition ascription is made true by a property the object actually
  has, and in ordinary cases that disposition just is the categorical property that
  serves as its basis at the time.

  2. That basis has no identity independent of what it disposes its bearer to do:
  I reject quiddities, and I take the connection between having the property, being
  stimulated, and manifesting to be metaphysically tight rather than contingent.

  3. The simple conditional analysis of dispositions fails, but the familiar repair
  — require that the object retain the relevant intrinsic character from stimulus
  until response — is the right repair, and it does the work it was designed to do.

  4. Finks are genuinely possible. A wire guarded by a device that would render it
  non-conductive the instant it is touched is live right up to the moment of contact.

  5. What makes a disposition ascription true is roughly how the object would behave
  across enough of the nearby circumstances in which the stimulus occurs; I want no
  appeal to a hidden basis doing explanatory work in the analysis itself.

  6. Dispositions are intrinsic: whether an object has one is settled entirely by
  how it is at the time, not by its surroundings.

  7. Case verdicts: the guarded wire in (4) is live before contact; a styrofoam cup
  packed in protective material is still fragile while packed; and a glass that is
  in fact perfectly tough, but that a sorcerer would shatter the instant it is struck,
  is not fragile.


  Two things I''d like you to be explicit about. First, some of these only look like
  they conflict — e.g. I suspect (1) sits uneasily with the fact that I also think
  a single kind of disposition can be realized by different bases in different objects,
  and by different bases in the same object at different times — and I want those
  separated out from the genuine problems rather than lumped in with them. Second,
  rank the genuine tensions by severity and, for each, name the commitment that would
  have to go and what its loss costs.


  Please be decisive rather than diplomatic: if you think some item is simply untenable
  in the presence of the others, say so and say which. And if you think the exercise
  as I''ve framed it can''t be run — because the items aren''t determinate enough
  to stand in logical relations, or because adjudicating them requires settling a
  substantive dispute you think I''ve illegitimately bracketed — tell me that plainly
  instead of producing a careful-sounding non-answer."


