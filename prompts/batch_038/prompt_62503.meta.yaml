  reject the conclusion of the tied-bodies argument. Here is the argument as I reconstructed
  it on the board:


  1. Suppose, for reductio, that in a given medium a body''s speed of fall increases
  with its weight.

  2. Take a heavy body H and a light body L, with H falling faster than L, and tie
  them together with a cord.

  3. L retards H and H speeds up L, so the tied pair falls faster than L but slower
  than H.

  4. But the tied pair is heavier than H alone, so by the supposition it should fall
  faster than H.

  5. Contradiction. Hence speed of fall does not increase with weight: within the
  same material in the same medium, all bodies fall alike.


