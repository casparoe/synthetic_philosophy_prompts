  tell you anything about how bodies actually fall." Second, pressed on step 3, he
  offered what I think is a sharper worry: if H really does fall faster than L, then
  when they are tied the cord simply goes slack, L trails behind, and nothing retards
  H at all; the contradiction only arises if we assume from the start that connected
  bodies must share a single speed, which is close to assuming the conclusion. Notably,
