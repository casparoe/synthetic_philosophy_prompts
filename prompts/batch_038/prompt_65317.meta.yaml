  Great. Now, the philosophical content I want to inject (in the weeds but standard
  in the field, so a competent model should know it):


  Lewis''s Principal Principle (1980, "A Subjectivist''s Guide to Objective Chance"):
  roughly, if you know the chance of A is x, and your evidence E is admissible, then
  your credence in A given E should be x. Key technical wrinkles:

  1. Admissibility: only evidence that doesn''t bear on the future except through
  the chance hypothesis. Past-tense facts are paradigmatically admissible. But Lewis
  later admitted the "Big Bad Bug": chance hypotheses can be undermined by possible
  histories that have zero (or low) chance on the hypothesis itself. This is the undermining
  problem.

  2. Hall''s New Principle: chances are what you get by conditionalizing the ur-chance
  function on the whole actual history of the world; PP then becomes a claim about
  conditional chances, immune to undermining.

  3. Ismael: chance is a "counsel of despair"; PP as a deference norm.

  4. The initial-credence problem / "PP constrains priors": Levi and others objected
  that PP can only be a constraint on initial credences, since conditionalization
  rigidifies. So does the play dramatize an agent whose priors were never set up right?

  5. Joyce: PP can be derived from accuracy considerations (a Lewisian chance hypothesis
  + strictly proper scoring ⇒ deference), so PP isn''t an extra axiom.

  6. Vranas''s objection that Lewis''s PP is false in certain cases.

  7. Mellor/Levi single-case chance; the reference class problem.

  8. Also relevant: "chance = credence of an ideal rational agent" (the reverse direction
  — Ramsey/Lewis: chances are what a rational agent with full information would credence).
  That''s the reverse-PP direction, and the play might dramatize the ideal-agent view
  rather than the deference view.

  9. The "undermining" case is exactly what Guildenstern does: he takes the streak
  as evidence that the chance hypothesis is false (hypothesis 3: divine intervention;
  or that the coin is double-headed). Under naive PP, that''s irrational; under Hall''s
  New Principle, the chance conditional on the actual history may indeed be near 1
  for heads. That''s the deep point: the play''s Guildenstern is the undermining intuitions
  personified, and Lewis''s own fix (the New Principle) says he''s right.


