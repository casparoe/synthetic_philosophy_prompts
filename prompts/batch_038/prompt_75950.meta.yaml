  Standard NFL (Wolpert): For any two learning algorithms A and B, the sum over all
  possible target functions f of the off-training-set error of A equals that of B
  (under uniform weighting, with appropriate summation conventions). The key: "all
  possible target functions" includes functions that are perfectly anti-correlated
  with A''s outputs. The known critique: since for every f there''s an "anti-f" that
  reverses the labels, averaging over all functions makes every algorithm equal —
  this is trivial and doesn''t show that no algorithm is better in realistic settings;
  it''s a statement about the choice of prior/measure. Also, the functions that defeat
  A specifically depend on A: they''re "tailored adversaries." So the question "is
  the world''s target function allowed to depend on which algorithm you use?" — in
  the NFL formalism, we sum over all f, including those defined relative to A. If
  we require the world''s regularities to be fixed independently of the learner (non-hostile),
  the theorem''s bite changes: it''s no longer obvious that for each A there''s a
  non-hostile world on which A does no better than a constant. Actually, it still
  is: consider worlds that are just random noise with a particular bias, or worlds
  where the pattern is one that A happens to be blind to (e.g., A only detects linear
  structure, world is quadratic). If A has limited hypothesis space, non-hostile worlds
  exist where A fails. But the "no better than a constant rule" is a strong claim:
  a constant-output rule gets accuracy equal to the majority class frequency. For
  A to be no better than a constant rule, the world must be adversarial-ish or A must
  be blind. But it''s plausible: e.g., if A is a majority-class predictor... hmm.


