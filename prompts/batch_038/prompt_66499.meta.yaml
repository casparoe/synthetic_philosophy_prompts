  Details of the bootstrapping problem:

  - Vogel (2000, "Reliabilism Leveled," Journal of Philosophy) introduced the "rooster"
  case: a rooster that believes the cart is coming (reliably, since the cart comes
  when the rooster is fed) but the rooster can''t use its own track record as evidence
  for reliability. Vogel''s point: bootstrapping is not a legitimate way to establish
  reliability; this is a problem for reliabilism because the rooster''s beliefs are
  reliable yet not knowledge (or it shows that reliabilism can''t explain why bootstrapping
  fails).

  - Cohen (2002, "Basic Knowledge and Easy Understanding," Philosophy and Phenomenological
  Research) introduced the gas gauge case: reading a gas gauge to check whether the
  gauge is reliable. Cohen argues that a certain view (which he associates with externalism/"basic
  knowledge") permits bootstrapping, which is absurd; so that view must be rejected
  or modified. Cohen''s own view: he thinks the closure principle plus basic knowledge
  yields bootstrapping, and that this shows something must give.

  - Wright (2004, "Warrant for Nothing (and Foundations for Free)?", Aristotelian
  Society Supplementary Volume) — entitlement, and "Moore''s proof" style reasoning.
  Wright: bootstrapping fails because you need antecedent warrant (entitlement) for
  the reliability of the instrument.

  - Douven (2009?), "Underdetermination and Moorean Bootstrapping"? Actually Igor
  Douven has "A Contextualist Solution to the Problem of Easy Knowledge" (2009?) —
  Douven''s contextualist solution.

  - Comesaña (2012?), "Evidentialist Reliabilism" — Comesaña defends reliabilism with
  an evidentialist twist that blocks bootstrapping.

  - Weisberg (2012, "Bootstrapping in General," Philosophy and Phenomenological Research)
  — Jonathan Weisberg argues the problem is general, arising even in Bayesian confirmation
  theory with the "rigidity" assumption; bootstrapping failure connects to the problem
  of "double-counting" / non-rigid conditionalization.

  - Okamoto (2021?), "Easy Knowledge, Circularity and the Puzzle of Reliability" —
  Steffen Okamoto in Episteme.

  - Also relevant: the "paradox of the preface"? No. Also "self-support" (Kelly)?
  Also van Cleve (1984) "Reliability, Justification, and the Problem of Induction"
  — the rule-circularity/ premise-circularity distinction. Van Cleve''s distinction
  is important: bootstrapping is rule-circular but not premise-circular.

  - Also, Sosa''s distinction: animal knowledge vs reflective knowledge; Sosa argues
  bootstrapping is defective because it doesn''t yield reflective knowledge / or because
  it''s "epistemically circular" but harmless (Sosa 1997? "Reflective Knowledge in
  the Best Circles" JPhil 1997). Sosa defends that epistemic circularity is unavoidable
  and not vicious.

  - Bergmann''s "epistemic circularity" (2006 book, Justification without Awareness).

  - Also the recent literature: "bootstrapping and the value of higher-order evidence,"
  and there''s a nice result that a Bayesian agent that conditionalizes on gauge readings
  will increase confidence in reliability — that''s Weisberg''s point. Also, there''s
  literature on the relation to the "problem of easy knowledge" in testimony/self-knowledge.

  - Also relevant: Douven & Kelp? Or "Confirmation and bootstrapping"?

  - Also the connection to "Moore''s proof" and Wright''s "transmission failure" (Wright
  2002, "(Anti-)Sceptics Simple and Subtle").

  - Also, a formal point: if an agent knows P by a reliable gauge, and knows that
  P entails that the gauge said "F" and the gauge was right this time, then by closure
  the agent knows the gauge was right — bootstrapping. This is Cohen''s argument.


