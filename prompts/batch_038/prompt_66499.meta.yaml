  Now the prompt: I''m an instructor of an upper-level epistemology seminar, 14 students,
  75 minutes (or 90). Design an in-class game. Requirements:


  1. Setting: advanced undergraduate epistemology seminar, 14 students, one 75-minute
  session, they''ve read Vogel''s gas gauge case and van Cleve''s distinction but
  not much else; no prior lecture.

  2. Materials: cheap — sealed envelopes, index cards, a deck of cards or dice, no
  computers needed, printable score sheet.

  3. Core mechanic: each team gets an instrument that outputs readings about a hidden
  state; the only way to check the instrument is to ask the instrument (its "check"
  output). Teams must certify the instrument and then bet on readings. Payoff in "credits"
  (paper tokens or a scoreboard), no real money.

  4. The crucial hidden design feature: there must be two kinds of instruments, indistinguishable
  from the inside — one whose readings track the hidden state, and one whose first-order
  readings are uncorrelated (or inverted) but whose check-outputs always vouch for
  it. Both produce the same-looking self-certifying record. So a team that bootstraps
  will certify the bad instrument with exactly the confidence it certifies the good
  one, and lose. And they should not learn which kind they had until the debrief.

  5. The asymmetry requirement: the game should also include a condition where the
  same bootstrapping pattern is used and participants find it obviously fine — e.g.,
  checking a device''s readings against an outcome that gets revealed independently
  later, or a "second opinion" device — so the room generates the split intuition
  (acceptable in one place, unacceptable in another) rather than being told it.

  6. Distinguish premise-circular from rule-circular: include one task where the team
  must reason from the instrument''s readings as premises to a conclusion about the
  instrument''s reliability (premise-circular? no—). Careful: van Cleve''s distinction
  — a rule-circular argument is one whose conclusion asserts the reliability of a
  rule used in the argument, but whose premises don''t presuppose the conclusion.
  Bootstrapping is rule-circular, not premise-circular. So the game should include
  both: (a) a rule-circular move (use the rule "trust the gauge" and conclude the
  gauge is trustworthy) and (b) a genuinely premise-circular move (assume the gauge
  is reliable in order to interpret its check-output as evidence of reliability).
  Participants should feel the difference: the second feels obviously vicious while
  the first feels tempting. Good — that''s the weeds-level design requirement.

  7. Bayesian/quantitative option: allow for a version where teams update degrees
  of belief numerically on a provided sheet, so that the "rigidity"/double-counting
  problem shows up — Weisberg''s generalization: bootstrapping isn''t special to reliabilism,
  it arises for any confirmation scheme that conditionalizes on the instrument''s
  outputs. Ask them to decide whether to include this and, if so, keep the arithmetic
  to something doable by hand in ninety seconds.

