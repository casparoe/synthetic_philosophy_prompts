  So this might be a weird ask but here goes.


  Two years ago I helped start a mutual credit thing at our community centre — ~90
  households, our own paper scrip, one note = one hour of somebody''s time, redeemable
  at the monthly swap night. It''s dying. Over the last six months people stopped
  spending their notes and started stuffing them in drawers "for later", the swap
  nights went from 40 people to nine, and now nobody wants to do work for notes nobody
  will take. I''m up in front of the whole membership in three weeks and I have to
  say either we''re fixing the rules or we''re shutting it down. I don''t want to
  guess.


  While I was trying to work out what happened I fell down a hole and ended up reading
  Berkeley on money — not the idealism, the economic stuff, mostly the Querist from
  the mid-1730s and his 1721 essay proposing a national bank that would issue paper
  secured on land after the South Sea crash. And he''s basically describing my town.
  Money isn''t wealth; wealth is the four elements plus human labour. Money is only
  useful insofar as it "stirreth up industry" — I think that''s query 5. He asks whether
  less money circulating fast isn''t the same thing as more money circulating slow
  (query 22), and whether the true idea of money is not altogether "that of a ticket
  or counter" (query 23). Also that gold has no virtue except that it sets people
  to work, and that fashion and created wants are what actually gets a population
  moving.


  I also teach a Thursday-evening adult philosophy class at the community college
  — 18 enrolled, usually 13-14 show up, ages 19 to 71, includes two actual accountants
  who will absolutely notice if my numbers are wrong. Two hours, I lose maybe 15 minutes
  to admin/announcements.


  Next session is money and I want to run a game instead of talking. Design me an
  in-class game where they end up discovering Berkeley''s picture of money by living
  it, ideally without ever hearing his name or the phrase "money is just a counter"
  until the debrief.


