  This is a great crux for the exam question. Note the important subtlety: in the
  annihilate-four-fifths case, the country regains its money by becoming cheap and
  exporting — i.e., the mechanism operates through a temporary competitive advantage.
  But in "Of Money" Hume argues that an increase in paper credit raises prices and
  puts the nation at a disadvantage in foreign markets, and that the best bank is
  one that locks up all deposits. There''s an interesting asymmetry: the self-correcting
  mechanism restores specie, yet Hume wants policy (a lock-up bank) that permanently
  reduces the circulating medium to keep labour cheap. And note: if the level-restoring
  mechanism guarantees specie flows back proportional to industry, then why does the
  "cheapness" advantage persist long enough to matter? Actually the deeper tension:
  Hume''s "Of Money" says plenty of money "may even sometimes be a loss to a nation
  in its commerce with foreigners" — so the mechanism doesn''t restore the money supply
  to a level that''s advantageous; there''s a "natural proportion" that''s independent
  of advantage, and the advantage lies in being below it. So a country that permanently
  restricts its money below the natural parity (via a lock-up bank) gains in foreign
  markets — but then wouldn''t the mechanism push money out/in to restore parity?
  Hume''s mechanism is about the tendency to level, not a strict equilibrium; a lock-up
  bank changes the "natural proportion" of money to labour and commodities by removing
  money from circulation. Hmm, actually the lock-up bank removes money from circulation
  but keeps it in the vault for emergencies — so the circulating medium is smaller,
  prices lower, exports stronger, AND there''s a hoard available for war. That''s
  a clever design, and Hume thinks the advantage of low prices + hoard outweighs the
  loss of the convenience of paper. This is the "two-tier" structure I want to inject
  as the instructor''s framing.


  Now, is there an inconsistency the student should find? Yes: (a) if the level-restoring
  mechanism is real, a country that keeps circulating money low will attract specie
  from abroad (via trade surplus) and that specie will then... be locked up in the
  bank, growing the hoard indefinitely. So the mechanism doesn''t self-terminate;
  the hoard grows without limit. Is that coherent with "the greater plenty of money
  is of no consequence"? Also (b) Hume''s "Of Money" says the public draws advantage
  from plenty of money "only in its wars and negociations with foreign states," and
  notes rich trading countries hire mercenaries from poorer neighbours — but if the
  mechanism keeps raising domestic prices in rich countries, they lose export markets;
  so the war advantage and the commercial advantage trade off, and Hume''s lock-up
  bank is an attempt to have both.


  Also (c) the mechanism assumes price flexibility and that domestic prices adjust
  proportionally; but Hume also argues (in "Of Money", second part) that an influx
  of money raises industry in the interval before prices rise — the famous non-neutrality
  argument about the merchant and the labourer. So the mechanism''s speed matters:
  fast adjustment = pure veil; slow adjustment = stimulus. Hume wants slow adjustment
  (stimulus) plus eventual levelling. That''s another in-the-weeds point.


