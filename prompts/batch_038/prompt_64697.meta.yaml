  the data: always condition on the most specific, relevant sub-population available,
  because more specific data dominates aggregate data.

  (3) In the kidney stone case (treatment A better overall but worse in both the small-stone
  and large-stone groups), I say A is worse and the aggregate is misleading.

  (4) I deny that resolving the reversal requires any causal notion — it''s a purely
  statistical artefact of confounding, and the frequencies settle which table to read.

  (5) I accept the sure-thing principle as a constraint on rational preference.


