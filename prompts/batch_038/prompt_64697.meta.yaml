  that''s exactly what fails; there''s no general statistical rule for choosing the
  reference class; the choice requires causal knowledge (which variable is the confounder,
  whether it''s a collider, etc.). So (4) is false and (2) needs a causal input. Also
  (3) with (1): the frequentist needs to specify the reference class, and the paradox
  shows that reference-class selection isn''t determined by frequencies alone. Also,
