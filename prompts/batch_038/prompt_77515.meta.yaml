  primed to see the victims as subhuman and they went along willingly. Two of us are
  dug in and it went nowhere, mostly because we kept reaching for the same bits of
  the real history.


  So I did what any dev would do and made up a synthetic dataset instead, so nobody
  can win by remembering the actual case. I want you to write a dialogue between two
  people arguing over it — one who explains it the Browning way (situation: orders,
  peer pressure, brutalisation, careerism, the fact you can''t just walk away from
  your mates) and one who explains it the Goldhagen way (disposition/culture: a belief
  system about the victims that was already there before the uniforms, and which shows
  up in what they do when nobody''s forcing them). Both need to be genuinely good
  at this. No strawmen, no one side getting the last word by default. I want them
  to actually answer each other, not swap prepared speeches.


  The case study, all invented, treat it as a mid-20th-century occupation somewhere
  unspecified:


  Unit 9, roughly 400 men...


  Facts:

  1. Drawn from... average age 38, mostly conscripted reservists, railwaymen and clerks,
  no political record; screening interviews before posting indistinguishable from
