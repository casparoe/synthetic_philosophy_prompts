  all reassigned to guard/rail duty.

  3. First operation: a third of the men vomiting/weeping, heavy drinking afterwards;
  by operation 12 the same platoons treat it as routine, joking, betting.

  4. Two lectures of ideological instruction during training, badly attended, and
  the men''s own letters home almost never repeat the official slogans — they write
