  Let me write the commitments:


  (1) Schrödinger''s central claim is right as far as the evidence goes: nobody has
  ever encountered a consciousness other than their own, and no observation could
  establish a second one; so the plurality of minds is not an empirical datum but
  an inference, and the inference rests on nothing more solid than the fact that we
  see many spatially separate bodies behaving as if they were each "inhabited".

  (2) Consequently I take the one-mind reading seriously: the plurality of subjects
  is an artefact of individuation through bodies — many masks of one canvas, one object
  in many mirrors — and I''m happy to say the number of minds isn''t a fact that science
  can settle.

  (3) At the same time I''m a physicalist about causation: everything that happens
  in the world, including my typing this, is fixed by physical goings-on, and there''s
  no non-physical substance that intervenes. I reject dualism of the Cartesian sort
  and I don''t accept that mental events push matter around.

  (4) I''m also an anti-panpsychist: I don''t believe fundamental particles have experience,
  and I don''t think the "hard problem" is solved by sprinkling proto-consciousness
  into the base layer. Consciousness, for me, goes with organisation — with integration
  and memory, roughly along the lines Schrödinger himself suggested.

  (5) I take the disunity data seriously and I have used it in print: anaesthesia,
  focal lesions, neglect, and above all commissurotomy patients, whose behaviour seems
  to me the strongest naturalistic evidence there is that a single skull can house
  more than one stream, and hence that minds are the sort of thing that can be multiplied
  or divided by rearranging tissue.

  (6) I think a machine could in principle be conscious — a well-enough organised
  artificial system could have experiences — and when I cover AI I write as though
  consciousness, if it appeared, would be a new subject coming into existence, one
  whose interests would have to be counted alongside ours.

  (7) I don''t think this is a mystical or ethical thesis: I''m not drawing the Vedantic
  conclusions about compassion, I don''t think it follows that I am literally you,
