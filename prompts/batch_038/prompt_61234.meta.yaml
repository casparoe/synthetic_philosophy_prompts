  Let me think about a really good mechanic. Ideas:


  Mechanic A: "Boundary auction / continuity bidding." Each group draws boundaries;
  scoring: for each boundary they place, they must defend it by naming a feature that
  changes there; a "challenge" round allows other groups to propose a neighboring
  year and show the same feature also holds/fails there (the sorites-style challenge).
  Points for surviving challenges. Groups discover that no boundary survives — or
  that boundaries survive only when you switch to a feature that is itself defined
  relative to a later development (e.g., "the year in which people stopped thinking
  of themselves as modern" — impossible). That''s a strong "feel the force" design:
  it makes periodization look like vagueness plus retrospective narrative.


  Mechanic B: "Naming in reverse." Give groups a set of achievements/disasters and
  ask them to construct a period that makes a specified later development (e.g., "the
  rise of our own discipline") inevitable; then swap: another group must construct
  a period from the same events that makes a different development (e.g., "the persistence
  of Islamicate science as the center of gravity") inevitable. The same event list
  supports both — showing that the period is a function of the terminus chosen. This
  is the "indexicality"/"Whig" point, felt. Then the debrief reveals that the standard
  labels (Middle Ages, Renaissance, Scientific Revolution) all take their terminus
  as the labeler''s own moment, which is why the Middle Ages is defined as a gap.


  Mechanic C: "Residual periods." Have groups classify events into periods where one
  group is told its period name is whatever''s left over.


  I think the best deliverable combines A and B: a two-round game where round 1 has
