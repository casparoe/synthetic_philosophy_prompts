  Alternatively Good''s theorem (value of information — I.J. Good''s 1967 result:
  the expected value of information is non-negative, i.e., free information can never
  be harmful in expectation, given coherent beliefs and a decision rule maximizing
  expected utility; and yet Good noted there are cases where paying for information
  / knowing could reduce expected utility — actually Good''s theorem says the expected
  utility of free information is at least as high as without, under conditions: the
  decision maker''s beliefs are coherent and utility bounded, and the decision rule
  is a "Bayes" rule. But Good himself noted counterexamples — cases where information
  is harmful, e.g., when the agent is not a pure expected-utility maximizer, or the
  "good" isn''t the utility used in the theorem, or bounded utility issues, or when
  information is not free, or when the agent will change their mind about utilities.
  Good (1967) "On the Principle of Total Evidence" in British Journal for the Philosophy
  of Science. Also there''s the issue of the value of information being negative when
  you consider "expected utility of an experiment" including costs, and the fact that
  the theorem presupposes you''ll act on posterior expected utility — but if you have
  a non-Bayesian updating rule, or if you''re a sophisticated chooser facing dynamic
  inconsistency, or a case of "resolute choice." Also there''s Good''s own discussion
  of "the value of information can be negative" if the agent''s utility function changes
  upon learning (e.g., learning about a preference), or under ambiguity. Also relevant:
  "cost of information" and "information overload", plus the case where the decision
  problem involves "value of information" being non-monotone if you are not going
  to use the info optimally. There''s also the point that Good''s theorem relies on
  the assumption that the utility function is defined over outcomes independent of
  the information itself (i.e., no intrinsic value of believing). And there''s the
  "Bayesian vs. non-Bayesian" — e.g., the Sleeping Beauty/thirder issue, or the case
  where an agent''s utility is over acts rather than outcomes, or "information aversion"
  as in Eliaz-Spiegler or Caplin-Dean "rational inattention." Also there''s the "value
  of information" being negative for someone who has a "safety" preference, or who
  faces adversarial information (e.g., blackmail cases, information as a hazard).
  Also the "knowledge is harmful" literature: e.g., the "unexpected hanging"? Hmm.


