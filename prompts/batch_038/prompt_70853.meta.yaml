  Option A: Domain = program equilibrium; Type = teach a concept. Asker: journalist
  who has been invited to give a talk? Hmm, journalists aren''t usually teachers.
  But could be: "I''m giving a lunchtime seminar for my newsroom / a masterclass for
  science-writing students" — plausible. Program equilibrium is quite technical: Tennenholtz''s
  program games, Fortnow''s "algorithmic rationality", Livni & Dodis, Kalai et al.
  "Fast equilibrium computation by infinitely repeated games" (2010), LaVictoire''s
  "modal agents" (Fair Bot, Prudent Bot), and the relationship to superrationality
  and Hofstadter''s LISPish ideas. Teaching that to non-specialists is hard. The teaching
  plan requires dependency structure: you need (1) the Prisoner''s Dilemma and one-shot
  Nash, (2) why folk-theorem-style repeated interaction isn''t the point, (3) the
  idea that agents'' strategies are programs, and each can run a model of the other
  — source-code access — (4) fixed-point/self-reference: if both bots do exactly what
  they predict the other will do, then... (5) the diagonalization problem: you cannot
  fully predict an adversary who predicts you (a prediction oracle that is itself
  queried creates self-reference), so program equilibrium needs "ε-quantified" / bounded-depth
  oracles (Fortnow''s result: no algorithm can predict all programs to within ε),
  (6) the payoff: cooperation in one-shot PD is an equilibrium when agents are programs.
  Misconceptions: "the programs are just repeated game", "mind-reading", "this requires
  superintelligence", "cooperation is because of reciprocity/altruism", "Nash equilibrium
  is refuted". This is meaty and definitely not regurgitable in canned form. But it''s
  quite technical for a journalist''s audience; still, "a reading group of non-specialists"
  — maybe a monthly ideas salon. Hmm.


  Option B: Domain = logical uncertainty and logical induction; Type = slogan precisification.
