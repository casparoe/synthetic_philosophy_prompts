  That''s actually a beautiful flaw: the scale argument is often glossed as "even
  a tiny probability of sentience, multiplied by vast numbers, gives huge expected
  moral weight". But there''s a slide: if the evidence about sentience is common across
  insects (correlated), then the probability that a *particular* insect is sentient
  is low but the probabilities aren''t independent — the disjunction has probability
  p (not 1-(1-p)^N), while the expected number of sentient insects is N·p either way.
  So the expected-value calculation still works via linearity of expectation (no independence
  needed) — but a version of the argument that uses "almost certainly some insects
  are sentient" to justify acting as if all are sentient fails. Conversely, an argument
  that goes: (a) each insect has credence p of sentience; (b) there are N insects;
  (c) so it''s almost certain that at least one insect is sentient — that''s invalid
  for correlated uncertainty. Interesting. Also there''s the issue of whether p should
  be the same for each insect or whether evidence about one is evidence about all
  (which is what "the probability of sentience per organism" means).


