  Draft of program equilibrium grading prompt:


  ---

  I''m a TA for a graduate seminar on commitment and transparency in games. Here''s
  the problem I assigned:


  "Consider the following program game for the finitely repeated / one-shot prisoner''s
  dilemma. Each player i submits a program p_i, drawn from a set P of programs that
  halt on all inputs. Each program takes as input the source code of the opponent''s
  program (but may not execute it as a subroutine) and outputs an action in {C, D}.
  Payoffs: the programs are run on each other''s source code, and each player gets
  the PD payoff from the resulting action pair. A profile (p1, p2) is a program equilibrium
  if no player can raise their payoff by replacing their own program with some other
  p'' in P, holding the opponent''s program fixed.


  (a) Show that (always-defect, always-defect) is a program equilibrium.

  (b) Give two programs in P such that running them against each other yields (C,
  C) and the profile is a program equilibrium. Be explicit about why no deviation
  helps.

  (c) Is the outcome of a program equilibrium always a Nash equilibrium of the underlying
  one-shot game? Argue."


  Here''s the student''s answer: [...]


  Can you grade it (say out of 10 or whatever) and give me the specific comments I
  should write back? ...

