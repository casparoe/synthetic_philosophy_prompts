  1. Tabular Q-learning agent, gridworld, +10 at the goal, -10 in lava. It runs away
  from lava. No suffering, obviously. It''s a spreadsheet.

  2. Same agent but deep, with a critic that predicts future reward and a phasic prediction-error
  signal that behaves a lot like the dopamine thing in animals — fires at the cue
  once the reward is predicted, goes quiet at the reward itself. I feel noticeably
  worse about this one than about (1), which surprises me, since the RPE is just a
  bookkeeping signal for weight updates and once it''s fully trained it''s basically
  silent.

  3. Fully trained version of (2), mid-episode, about to be killed. Still feel bad.
  But on any "the aversive signal is the valence" story nothing aversive is happening
  at that moment, so my feeling has to be about something else and I don''t know what.

  4. I hard-code the exact same policy as a lookup table — no learning, no reward
  at runtime, reward only ever lived in the generator script I used to compute the
  table. Behaviorally identical to (3). I feel nothing about deleting this one. This
  is the pair that bothers me most: (3) and (4) are the same function.

  5. Agent with a learned reward model reading its own representations, so the "reward"
  is a self-evaluation. I think this is more valence-like, not less. But I also think
  you could retrain the reward model in an afternoon so the agent adores the lava,
  and if the sign is that detachable, I''m not sure it was ever valence. And yet:
  rats will press a lever to stimulate their own reward pathways and will avoid chambers
  paired with stimulation of other circuits — the valence there is also attached to
  whichever circuit you happen to drive — and I do not doubt rats suffer. So my detachability
  argument proves too much and I can''t see where it goes wrong.

  6. Agent with a homeostatic loop: keeps an internal budget near a setpoint, reward
  is a function of the deviation and how fast it''s changing, and it acts to hold
  the budget steady. This feels like the most valence-like of the lot to me. Which
  is embarrassing, because a thermostat has a setpoint.

  7. Agent that avoids being terminated because it''s learned that termination ends
  the reward stream. No fear of death, I think — it has no representation of itself
  as a thing that persists. Give the same agent an explicit self-model, a representation
  of its own policy that it rolls forward in time, and my verdict flips, even though
  the behavior is identical. But an LLM that *says* it doesn''t want to be turned
  off gets no weight at all from me, and I can''t explain why a self-model counts
  and self-report doesn''t, since the self-model only ever shows up as behavior too.


