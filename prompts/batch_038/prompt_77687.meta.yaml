  ---


  I am in a fourth-year metaphysics seminar this term, and our unit on infinity ended
  with a dispute between two classmates that the seminar could not resolve. I was
  only taking notes, and I do not have a stake in either side, but I would like a
  careful, move-by-move adjudication of the arguments as they were actually made.
  To be clear about the target: Yusuf''s thesis was that no actually infinite collection
  of concrete things can exist, and that Hilbert''s hotel demonstrates this; Claire''s
  thesis was that the hotel demonstrates nothing of the kind. Their exchange ran as
  follows.


  1. Yusuf: the hotel is, by hypothesis, full — every room occupied — and yet one
  more guest can be accommodated, and so can infinitely many more, arriving in infinitely
  many buses. A collection that cannot take another member and a collection that can
  take infinitely many more are contradictorily described; so the hotel is impossible,
  and since nothing about the case turns on hotels rather than on any other concretely
  realized countable collection, no such collection can exist.


  2. Claire: there is no contradiction, only a suppressed premise. "Full" means "no
  room is empty," and it means the same for finite and infinite hotels. What Yusuf
  needs is the further principle that if no room is empty, no further guest can be
  housed — but that principle is a consequence of the pigeonhole principle, which
  holds only for finite collections. A set that is equinumerous with a proper subset
  is Dedekind-infinite; that is a theorem, not a paradox, and Yusuf''s argument assumes
  finiteness in order to prove it.


  3. Yusuf: two replies. (a) The theorem is internal to a stipulation. Cantor made
  "same number" mean "there is a bijection"; having stipulated that, of course ℵ₀
  + 1 = ℵ₀ follows. A definitional consequence cannot settle a metaphysical question
  about whether reality contains infinite collections — that is the very question
  at issue, and finitists from Kronecker through Weyl denied that the stipulation
  describes anything real. (b) Consider departures rather than arrivals: guest 1 checks
  out, everyone else moves down one room, and the hotel is full again. On Claire''s
