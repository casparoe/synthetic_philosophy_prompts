  The case: A petition has been filed for a statewide ballot measure called "The Forethought
  Amendment" (or "Measure 41: The Self-Binding Act"). Its content:


  1. It entrenches a policy — say, a permanent balanced-budget/ "no new general-obligation
  debt" rule — and provides that it can be repealed only by (a) a two-thirds legislative
  vote AND (b) a majority vote in a referendum held no earlier than 25 years after
  enactment, and (c) a supermajority (60%) in that referendum.

  2. It also includes a "binding instruction" clause: it directs that, at the time
  of enactment, voters cast a second, separate ballot answering a question about whether
  their successors should be permitted to reconsider — and the measure purports to
  make the "no reconsideration" answer irrevocable.

  3. And it includes a clause purporting to disqualify any future initiative that
  conflicts with it from appearing on the ballot — i.e., it makes the commission itself
  the judge, forever, of what conflicts.


  The commission''s charter: measures may be kept off the ballot only if they (i)
  violate a specified list of fundamental rights, (ii) lack "unity of subject," (iii)
  are impossible to implement, or (iv) conflict with the state constitution''s guarantee
  of "the people''s continuing power to alter or abolish their government." The commission
  may not judge the merits. Half the commission thinks (iv) does the work: a measure
  that disables future majorities abolishes the continuing power. The other half thinks
  the people''s power includes the power to bind itself, and that (iv) is about destroying
  the government, not about procedural entrenchment; they also note that the constitution
  itself is entrenched and hard to amend, so entrenchment can''t be per se invalid
  — otherwise the constitution would invalidate itself.


