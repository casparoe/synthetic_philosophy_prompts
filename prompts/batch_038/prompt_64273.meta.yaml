  For nineteen years I have worked for a small water district in a mountain valley:
  I write the shift schedules, keep the maintenance logs, and order parts. I have
  no university training in anything and no interest in acquiring it, but I have thought
  about one question almost daily for the last two years, and I would like a careful,
