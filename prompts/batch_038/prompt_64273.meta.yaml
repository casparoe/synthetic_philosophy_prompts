  asking you to point me toward reading; I want your own reasoning about a specific
  argument I watched happen.


  The district operates an earthfill dam built in the early 1960s. Since not long
  after it was built, the standing order has been that at the beginning of each shift
  two operators walk the full length of the dam crest and back — about forty minutes
  — with no instrument, no checklist, and no report required, though they are supposed
  to mention anything odd at handover. We now have piezometers, a seepage weir with
  a continuous recorder, and cameras on the crest. Our new operations manager, Diane,
  who came to us two years ago with an engineering degree, has proposed abolishing
  the walk. Our senior operator, Emmett, who has been with the district for thirty-one
  years, opposes it. I was in the room for most of their argument and took notes afterward.
  Neither of them is stupid or dishonest, and I do not think either was arguing in
  bad faith.


  Here is how it went, as nearly as I can reproduce it:


  1. Diane said the walk consumes roughly five hundred operator-hours a year, that
  the crew tells her they experience it as pointless, and that everything it could
  detect is now detected continuously and more sensitively by instruments that do
  not get tired or distracted.


  2. Emmett said the walk has twice found things the instruments did not: muddy seepage
  at the downstream toe in 1994, and a slough on the upstream face in 2011, both noticed
  by someone walking, both confirmed later. He said instruments only report on the
  exact places they were installed, chosen by people who had to guess where trouble
  would come from.


  3. Diane said both catches predate the current instrumentation and the current seepage
  weir, that if the real concern is spatial coverage gaps the correct remedy is to
  instrument the gaps, and that a person walking at a fixed pace along a crest sees
  strictly less than a camera sweep of the same crest.


  4. Emmett then said the walk is also where the apprentices learn the dam — every
  anomaly gets named and pointed at in place — and that it is the only occasion on
  which the outgoing and incoming shifts are together outdoors. Diane said that if
  those are the goods at stake, they should be claimed openly and produced deliberately:
  a structured orientation and a scheduled handover meeting would deliver both, more
  reliably, and could actually be evaluated. Emmett said she could not produce them
  deliberately, because the value of the walk depends on its not being announced as
  training. The moment an apprentice knows he is being taught, he performs for the
  teacher instead of looking at the dam; and a handover meeting held at a table produces
  a report about the dam in place of contact with it.


  5. Diane said that this last move makes his position impossible to test. If every
  failure to find evidence that the walk earns its cost is itself explained as evidence
  that its worth is the sort of thing evidence cannot reach, then no practice could
  ever be shown to be worthless, and the argument is doing no work.


  6. Emmett said he did not need the walk to be beyond testing, because the burden
  runs in the other direction. Sixty years of continuous operation is a fact about
  the world that Diane''s proposal has to answer for. A decision to keep the walk
  and be wrong costs time; a decision to end it and be wrong may not be recoverable
  at all.


  7. Then, while I was pulling files for another matter, I found the 1962 order that
  instituted the walk. It was written by the district''s first engineer and it gives
  a reason that has nothing to do with either safety or training: the walk was ordered
  to create a twice-daily record of visual observation that could be produced in the
  event of a claim, following a drowning suit against the district that had been settled
  the previous year. Our counsel says no such record would carry any weight now. Diane
  said this ends it: the fence was erected as legal cover, and even that purpose is
  gone. Emmett said the memo proves the opposite of what she thinks — the reason a
  practice was first written down is not the reason it went on being done for sixty
  years, and what the walk was for in 1962 tells you nothing about what it does now.


  8. Diane''s last move was the one I have not been able to answer. She said that
  the walk''s survival is not evidence of anything, because it persisted for exactly
