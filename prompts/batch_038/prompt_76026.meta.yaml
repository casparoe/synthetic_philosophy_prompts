  Student answer draft:


  "The researchers claim that speaking Kelvane changes how you remember, but the evidence
  for that is weaker than they think, and also stronger than they think.


  First, the strong version of the Sapir-Whorf hypothesis, which says language determines
  what thoughts you can have, is clearly not supported. English speakers got 61%,
  which is way above the 25% you''d get from guessing, so they obviously can keep
  track of where a fact came from even though their grammar doesn''t force them to.
  Whorf himself was probably not a determinist anyway — the ''language determines
  thought'' slogan comes mostly from textbook summaries rather than from what he wrote,
  and he seemed more interested in habitual patterns of attention than in hard limits.
  So the study is really only relevant to the weak version.


  Second, the design looks better than it is, but not for the reason you''d expect.
  People will say the Kelvane speakers just silently labelled each item with a word
  for its source and then remembered the label, so the test isn''t measuring non-linguistic
  memory at all. But that can''t be the explanation here, because the test used pictures
  rather than words: participants had to point at an icon, so there was no language
  involved at retrieval. What the difference must reflect is that Kelvane speakers
  encode the source as part of the event itself, which is exactly what the weak Whorfian
  claim predicts. So the study does confirm the weak version.


  Third, there''s an ecological fallacy problem. They''re comparing two groups and
  inferring something about the grammar inside individual heads. A correlation at
  the group level doesn''t license that. The obvious confound is culture: a small
  community with an oral tradition and lots of face-to-face dealings has endless reasons
  to track who said what, quite apart from any suffixes. Literacy could matter too
  — reading trains you to remember content and ignore source, which might explain
  the English group doing worse. They matched on years of education but not on reading
  habits.


  Finally, I''d want a bilingual group. If Kelvane-English bilinguals came out in
  between the two monolingual groups, that would be a dose-response relationship and
  would pretty much settle that the grammar is doing the causal work, because the
  only thing that varies is how much Kelvane you have.


  Overall though, this shows Kelvane speakers have better memory than English speakers,
  which is a pretty striking result for a bit of grammar."


  That''s got: correct strong/weak point, correct-ish Whorf note (paraphrased, no
  quotes), the key non-sequitur (retrieval pictorial → no verbal mediation), misuse
  of "ecological fallacy," good culture/literacy confounds, the bilingual dose-response
  overclaim (selection confound not mentioned), and the final overclaim (memory in
