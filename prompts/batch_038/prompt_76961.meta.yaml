  Essay draft (~600 words):


  **Thesis.** The standard gloss on the panopticon: watch people hard enough and long
  enough and they internalize the norm; surveillance becomes self-surveillance. I
  think that gloss deletes the load-bearing element. On Foucault''s reading of Bentham''s
  design, what matters isn''t that the prisoner is seen — it''s that he can''t find
  out whether he''s being seen right now. The cell is lit and exposed; the tower is
  dark and opaque; the inmate can inspect it all day and learn nothing. So the mechanism
  runs on an unresolvable uncertainty, and the thing it manufactures is a person who
  has to keep modeling a mind he can''t observe. That''s the work: you become someone
  who asks, at every moment, how this looks to somebody. I''ll call the resulting
  relation to yourself **interpretive self-government** — you govern yourself by continuously
  guessing at an interpreter.


  Foucault''s own line, which I copied into my notes: "He who is subjected to a field
  of visibility, and who knows it, assumes responsibility for the constraints of power;
  he makes them play spontaneously upon himself; he inscribes in himself the power
  relation in which he simultaneously plays both roles; he becomes the principle of
  his own subjection." Note he has to play both roles — watched and watcher. That
  requires an imagination of the watcher. Discipline, on this reading, is expensive
  in a specific way: it costs interiority, and it pays for itself with a subject.


  **The move.** Now remove the uncertainty, not by adding guards but by making the
  observation total, continuous, machine-read, and *known* to be so. You no longer
  have to guess whether the record exists, who reads it, or what it captures; the
  rule is applied to the record by a mechanism that has no mind to model. My claim:
  Foucault''s own machinery predicts *less* subjectivation here, not more. There''s
  no interpretive gap left to fill, so there''s no reason to become a person-who-watches-himself.
  You become instead a person who complies, in the way you comply with a turnstile.
  Call this **ledger governance**: the norm is enforced by the file, and your self-relation
  is bookkeeping, not interpretation. The prediction is that interiority is a function
  of the *opacity of the observer*, not the completeness of the observation.


  **The case.** Exams. A human proctor walking rows is pure interpretive self-government:
  you can''t tell what she noticed, so you manage your face, your gaze, your posture
  — you''re modelling a mind. Now put the same exam in a lockdown browser with gaze
  tracking, keystroke logging, room scans, and an AI-writing detector, and tell the
  student exactly what is captured and what triggers a flag. My expectation going
  in was that this would be discipline cranked to eleven. What my friends in academia
