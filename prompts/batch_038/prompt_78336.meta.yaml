  Let me reconsider: The ex post Pareto violation in Diamond''s case requires the
  state to be fixed. Standard presentation (Mongin 2016 / Fleurbaey): Take prospects
  A, B, C over a two-state space {state 1: machine to 1, state 2: machine to 2}? Actually
