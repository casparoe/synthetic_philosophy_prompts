  Ex post Pareto: in state heads, A and C yield the same outcome, B yields a different
  one. Person 1: heads-outcome of A = alive; of C = alive → indifferent. Person 2:
  A and C both give death → indifferent. So in heads, A ~ C statewise. Similarly in
  tails, B ~ C. So ex post Pareto (with indifference) gives A ~ C and B ~ C, hence
  A ~ B. But ex ante: person 1 prefers C to B (0.5 vs 0), and person 2 prefers C to
  A. Person 1 is indifferent between A and C. So ex ante Pareto (weak) says A ~ C
  and B ~ C too. Hmm, so no conflict there either, because each person is risk-neutral
  in their own life.


  The conflict arises with the "veil of ignorance" social observer who prefers C to
  both A and B — that''s Diamond''s claim that a fair social observer ranks C above
  A and B. Then ex ante Pareto + the social observer preferring C to A while each
  individual is indifferent between A and C violates weak Pareto? Weak Pareto says:
