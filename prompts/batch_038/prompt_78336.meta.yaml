  Draft:


  ---


  Act as a formal decision theorist and philosopher of welfare economics who is comfortable
  explaining technical results to someone with strong quantitative training but no
  philosophy coursework. Think carefully and work through the cases step by step;
  before you give me a principle, spend a short paragraph brainstorming which family
  of positions my verdicts point toward and which they rule out. I''m a software engineer.
  I don''t want a literature survey and I don''t want references — I want your own
  reasoning, stated precisely.


  Here''s my situation. I build an allocation system: at each hour it distributes
  a limited resource across a few thousand users by summing per-user utility scores
  from a learned reward model, with weights I can tune. A colleague mentioned Harsanyi''s
  aggregation theorem — roughly, if the individuals and the "social" ranking all behave
  like expected-utility maximizers over the same risky prospects, and society never
  stays indifferent where someone strictly prefers, then the social ranking must be
  a weighted sum of individual utilities, equally weighted if it doesn''t care who
  is who. If that''s right, my implementation is not one option among many; it''s
  forced. So I went through my own intuitions case by case, and I''d like to know
  what they actually add up to.


  My verdicts:


  1. Two users need the resource; only one can have it. I think a fair coin flip is
  genuinely better than handing it to either one for sure, even though whichever way
  the coin lands, the loser would have preferred the other allocation. I hold this
  strongly.


  2. At the same time, I think that if two prospects give every user the same outcome
  except one, the ranking between them should be settled by that one user''s own preferences,
  and shouldn''t be affected by what the prospects have in common. My aggregator does
  exactly this, per user, and I don''t want to give it up.


  3. I don''t think it should matter who gets what, only how much: if I permute the
  utility levels among users, my ranking of two prospects shouldn''t change.


  4. A user whose satisfaction threshold has been ground down — someone who has learned
  to be content with very little — should not, in my view, get their contentment counted
  at face value against a user with ordinary expectations. Equal scores are not equal
  welfare in that case.


  5. My system spins up ephemeral worker instances that, stipulate for the sake of
  argument, have some positive welfare while running. I don''t think creating a million
  contented instances makes the outcome a million times better, or better at all than
  creating a hundred, if the rest is held fixed. Average is fine; total is not.


  6. Concretely on the code: each user''s score comes from a separate model head trained
  on that user''s own feedback, so the raw scales aren''t comparable. I z-score each
  user''s scores over the trailing week before summing. I think of this as a neutral
  engineering fix. I''d like to know whether it is one.


  7. One I keep going back and forth on: whether the weights should depend on how
  much each user already has received this week. Part of me says yes, part of me says
  that''s double counting.


  Deliverable: ... Is there a single principle — an aggregator plus a set of axioms
  about prospects, populations, and comparability — that delivers all of these, or
  the closest thing to all of them? If there is, state it precisely enough that I
  could implement it. If there isn''t, give me two or three candidate principles,
