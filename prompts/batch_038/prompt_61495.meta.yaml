  Domain: Letter Spirit — what makes every ''a'' an ''a''?

  Type: desiderata.


  Purpose fixed by asker: "I''m building (or thinking about building) a small program
  that, given a new typeface, has to draw a lowercase ''a'' it has never seen and
  then judge whether a glyph someone hands it is an ''a'' — but really I want the
  philosophy first: what does any account of letterform identity have to deliver?"
  Hmm, or purpose: a theory of what it is for two marks to be tokens of the same letter
  type.


  Desiderata items I''d want the model to produce (but I shouldn''t produce them all
  — I should give the purpose, some cases, and ask for the list with motivations,
  which are negotiable, which are jointly unsatisfiable, and which does the most work
  excluding candidates):


  Cases to inject:

  1. A double-storey ''a'' (as in most serif fonts) vs single-storey ''a'' (as in
  handwriting / Comic Sans / many sans). Are they the same letter? Almost everyone
  says yes. So any account keyed to shape topology fails, or must be indexed to something
  else.

  2. Mirror image of a ''b'' is a ''d''. Mirroring preserves all intrinsic shape properties
  and all topology, but changes the letter. So orientation relative to the writing
  direction / the reader matters. But then: is a mirrored ''a'' still an ''a''? For
  ''a'', mirroring gives something that reads as a reversed ''a'' — most people would
  call it a wrong ''a'', not another letter. So mirror-sensitivity is letter-dependent?
  Or is it that ''b''/''d'' are distinct letters while ''a'' has no mirror partner,
  so a mirrored ''a'' is a degraded ''a'' rather than a different letter? That''s
  a genuinely subtle asymmetry a theory must explain.

  3. Rotated: an ''n'' upside down is a ''u''; a ''p'' rotated 180° is a ''b''; a
  ''W'' upside down is an ''M''. So rotation, unlike mirroring... hmm actually rotation
  is also a rigid transform. What distinguishes the cases where a rigid transform
  yields a different letter from where it yields the same letter? Answer might be:
  it depends on whether the target is an occupant in the system. So identity of a
  letter is partly relational/systemic: ''a'' vs ''b'' distinction is not intrinsic
  to the mark but to its place in the alphabet and the writing system. Which pushes
  toward: letter identity is a role in a system, not a shape.

  4. Style/legibility gradient: an ''a'' with the bowl opened, progressively deformed
  — at what point does it stop being an ''a'' and become a squiggle or a different
  letter? Vagueness. Must the theory deliver a sharp boundary? Probably not — but
  it must explain why the boundary is vague in the right way (graded by context/reader),
  and why it''s not vague between ''a'' and ''b'' in the same way... actually it is:
  a badly written ''a'' can be read as ''o'' or ''u''.

  5. Cross-script: the Greek alpha, the Cyrillic а, the Latin a — same shape (in many
  fonts), different letters? Or the same letter with different roles? Also ''C'' in
  Latin vs the Cyrillic С (Es) — identical glyphs, different letters and different
  sounds. So shape identity ≠ letter identity across systems. But is the Cyrillic
  С the "same letter" as Latin C? Most would say no — different alphabets. Yet the
  shapes are identical. So the theory needs something beyond shape and beyond sound.

  6. Sound: ''a'' in "cat" vs "father" vs "cake" — very different sounds, same letter.
  And ''c'' in "cat" vs "city". So sound can''t be the criterion (though it''s historically
  connected). Meanwhile a phonetician''s [a] is a sound, not a letter.

  7. The digit/letter collision: ''l'' vs ''1'' vs ''I'' in some fonts are identical
  glyphs; the vertical bar in many fonts. Is the mark a letter or a numeral? Depends
  on position/context — again systemic/relational. Also ''O'' vs ''0''.

  8. Braille, Morse, sign/ASL letter shapes, semaphore: an ''a'' in Morse is ·−, in
  braille a single dot, in ASCII 0x61. Is that the same letter, or the same letter
  "realized in different media"? A theory must decide whether letter identity is medium-independent,
  and if so what carries over (not shape, not sound). This pushes toward an abstract/structural
  or functional notion — like the "same song" problem, or like a role in an encoding.

  9. Ligatures and case: ''æ'' — is that one letter or two? In Icelandic/Danish, æ
  is a letter of the alphabet; in English it''s a ligature. Also the long s (ſ) vs
  f, and German ß vs ss. And uppercase/lowercase: is ''A'' the same letter as ''a''?
  Collation order treats them as the same letter for sorting; but they''re distinct
  glyphs and distinct code points. A theory must handle the "same letter, different
  case" relation — that''s a nice test: whatever makes A and a the same letter must
  not also make A and B the same letter.

  10. Handwriting variation within one person: your ''a'' differs from day to day;
  a forger''s copy. Also the "one person''s sloppy g" case.

  11. A child draws something that looks like an ''a'' but they say they meant a cat.
  Intention/uptake: is it a token of ''a''? Probably not — a mark is a letter only
  within a practice of reading/writing. So reader-response / conventional uptake matters.
  But then, an unreadable ''a'' in a manuscript nobody has read for 500 years is still
  an ''a''?

  12. Type/token: every ''a'' on this page is a distinct mark yet "the same letter"
  — but also the same *font''s* ''a'' vs a different font''s ''a''. There are arguably
  two identity relations being conflated: same letterform-type across fonts, and same
  glyph within a font. A theory must say whether these are one relation or two.


  Which requirement does most to exclude candidates: probably "medium-independence"
  or "context-sensitivity" — a theory that makes letter identity a matter of intrinsic
  shape is killed by the double-storey/single-storey case plus Morse/braille; a theory
  that makes it a matter of sound is killed by ''a'' in cat/father; a theory that
  makes it purely systemic/role-based must explain why a lone mark can still be an
  ''a'' and why the shape isn''t arbitrary (it constrains recognizability).


  Jointly unsatisfiable subset: e.g., (i) letter identity is intrinsic to the mark
  (recognizable in isolation), (ii) letters are the same across writing systems when
  they play the same role (or across media), (iii) the theory must explain the sharpness
  of some boundaries (''b'' vs ''d'' is not vague) and the vagueness of others (degraded
  ''a''). Hmm, maybe: (a) shape-independence (Morse ''a'' is the letter a) + (b) shape-dependence
  (a badly drawn ''a'' stops being an ''a'' while a well-drawn ''o'' never becomes
  one) — those pull hard. Actually more precisely: the theory must allow that two
  marks with no shape in common can be the same letter (Morse ·− and a printed ''a''),
  yet also that shape is not irrelevant — a mark can fail to be an ''a'' by being
  badly shaped, and shape can flip it into a different letter (''b'' → ''d'' by mirroring).
  Making both work requires something like a disjunctive or system-relative account,
  or a distinction between "letter" as an abstract position in a system and "letterform/glyph"
  as its realization. So the "one relation or two" question is the crux. Good — this
  gives me the "which pair of desiderata can''t be jointly satisfied" hook.


  Also the domain mentions "style" — the Letter Spirit project is about the fluidity
