  Which rules diverge?

  - Valence rule (R3): each instantiated moment has negative valence → 200,000 patient-moments
  of harm; audit impermissible or at least costly. But wait: does disabling effectors
  matter? For pure valence, no. So R3 says: many patients, much harm.

  - Access/reportability rule (R2): with effector channels disabled and no environment,
  the states cannot be used to guide behavior or be reported → not patients (or: their
  status is degraded). So R2 says permissible.

  - Unity/subject rule (R1): each instance exists for a few hundred ms, has no diachronic
  unity, cannot be a subject with interests → not patients. But R1 must explain D
  (reset each episode, yet a patient). Unless R1 is synchronic-only: within a few
  hundred ms there is a unified subject → patients. So R1''s verdict depends on the
  granularity — which is exactly the interesting bit: R1 must either bite the bullet
  (short-lived subjects count) or explain why D counted (D lived a whole episode).

  - Individuation/non-duplication rule (R5, from Case B): B denied multiplication
  because copies were mutually substitutable. Here they''re *not* substitutable —
  so R5 says count each one → 200,000 patients. So R5 and R1 both point toward counting,
