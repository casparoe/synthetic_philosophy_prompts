  be a bettor who takes all offers. Also for Savage-style theorems, there is no betting
  interpretation built in at all — the theorem is about preference orderings over
  acts, not about accepting bets; the Dutch book argument is a separate argument (de
  Finetti/Lehman), and the equivalence is not exact.

  3. Overstatement: "so coherence isn''t a matter of taste: being money-pumpable is
  the definition of irrational" — the normative step: coherence arguments show that
  incoherence is *exploitable* only under auxiliary assumptions; and there''s the
  "why care" objection; plus the trivialization critique — many decision procedures
  (e.g., anything describable as maximizing *some* function) satisfy the theorems
  once you re-describe the state space, so EU maximization may be too permissive to
  be a substantive requirement.

  4. Modest thesis overstated: "Savage assumed the decision maker faces a small, fully
  specified world, but that caveat is just about applications — the maths is the same
  for real, large decisions, so there''s no gap to worry about." (Subtle: Savage took
  the small-world restriction seriously; the sure-thing principle''s role, and the
  fact that in large worlds you can''t define the state space ex ante.)

  5. Wrong-ish claim: "the theorem doesn''t care what you want, only that your wants
  be consistent" plus "and since the theorem is a mathematical result, no empirical
  psychology is needed" — ignoring that completeness/transitivity/independence are
  substantive constraints on preferences, and that violations are often not "inconsistency"
  but incomparability or context-dependence (the "allais" case can be read as rejecting
  independence on substantive grounds; also Sorites-like incomparability).

  6. Conclusion drawn from the summary: "so anyone who says rationality permits non-EU-maximizing
  attitudes — like refusing to trade off small risks of catastrophe against ordinary
  benefits, or caring about equality of outcomes rather than total — is just being
  incoherent, and the theorems settle it." This conclusion does not follow: the representation
  theorems are silent on what the utility function''s shape is (risk attitudes over
  outcomes are built into utility), and non-Archimedean/lexicographic preferences
  can violate continuity without being incoherent in the intuitive sense; also the
  theorems don''t establish that completeness is required for rationality (there are
  rational incomparability views).


