  Student answer draft:


  "Harsanyi''s aggregation theorem concerns a fixed population of individuals who
  each face the same set of prospects — lotteries over social states — and whose preferences
  over those prospects can be represented by expected utility. Three assumptions do
  the work. First, each individual''s preferences satisfy the axioms of expected utility
  theory, so that each has a utility function over outcomes, unique up to positive
  affine transformation. Second, the individuals share the same subjective probabilities
  over the states of the world; if they disagree about the likelihood of a state,
  Harsanyi''s argument does not go through. Third, social preferences satisfy the
  Pareto principle in the form of Pareto indifference: if every individual is indifferent
  between two prospects, society is indifferent too. Social preferences are themselves
  assumed to admit an expected utility representation.


  Given these assumptions the conclusion is that there is a social utility function
  which is a weighted sum of the individual utility functions, with non-negative weights
  summing to one. The social function is itself only defined up to positive affine
  transformation, so the theorem is in that sense an ordinal result about a cardinal
  representation.


  The theorem does not yet deliver utilitarianism, because the weights are not pinned
  down. To get equal weights one adds a symmetry or anonymity condition: the social
  ordering must not depend on which individual occupies which position. This is where
  Harsanyi''s veil-of-ignorance device comes in, supplying an intuitive story about
  why the impartial observer would assign equal weights. It is worth noting that the
  additivity of the conclusion is doing real work: because the social function must
  be linear in the individual utilities, positions that apply a concave transform
  to each person''s utility before summing — prioritarianism, in effect — are excluded
  by the theorem rather than merely unmentioned.


  Whether the theorem establishes classical utilitarianism depends on how much one
  is willing to build into the premises. Two things are commonly objected to. The
  first is that Harsanyi assumes utilities are interpersonally comparable, which is
  exactly what a defender of ordinalism refuses to grant; the theorem therefore builds
  in the controversial part and then unpacks it. The second is that, like Arrow''s
  impossibility theorem, Harsanyi''s argument takes non-dictatorship for granted,
  and it is only because dictatorship has been ruled out by assumption that the weighted
  sum can be presented as a genuinely social, rather than merely individualistic,
  aggregation rule.


  On balance the theorem is best read as establishing a family of weighted-utilitarian
  rules rather than classical utilitarianism itself. The equality of the weights is
  a further substantive commitment, not a consequence of the Pareto principle, and
  it is the part that most needs independent defense. The theorem is also silent on
  questions of population size: it says nothing about how to compare social states
  with different numbers of people, so it does not by itself settle anything about
  the ethics of creating new lives."


