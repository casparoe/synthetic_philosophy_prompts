  a hole in his pocket, or a bettor who hands a bookie a sure loss. Whatever you call
  it, the world will find the leak and drain him; over time he gets money-pumped down
  to nothing, so coherence isn''t a philosophical preference, it''s a survival requirement.
  Then I ran the quote past an economist friend who said that''s exactly backwards
  and that most of the axiom violations people fuss about don''t cost you a cent.


