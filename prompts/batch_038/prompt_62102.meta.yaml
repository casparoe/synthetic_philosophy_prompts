  An activity: a "credence market" where students are given a fixed budget of belief
  points and a series of reports; they get scored by a proper scoring rule (Brier
  score) so they feel the cost of over-belief. The trick: some reports are about ordinary
  events (school bus late), some about very unusual events (the head teacher''s coffee
  turned to wine). The reports come with different numbers of witnesses and different
  witness reliability info. And crucially — the facilitator has a hidden "truth sheet"
  and the base rates are set so that the unusual events are almost always false even
  when the witness seems reliable. Students discover: even a 99% reliable witness
  isn''t enough when the event is one-in-a-million. That''s the Bayesian core, and
  it makes Hume''s "no testimony is sufficient" feel less like a cheap trick.


  Then, the "contrary miracle" round: two groups each receive testimony for incompatible
  events (competing religions analogue) — the activity forces them to notice that
  if both sets of testimony are equally good, they cancel. That''s Hume''s argument
  about miracles in rival religions.


