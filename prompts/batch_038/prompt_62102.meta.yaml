  Let me think about what makes a good Hume-on-miracles activity that isn''t just
  "read the Enquiry". Key ideas to make felt:

  1. Belief proportional to evidence — testimony is a kind of evidence whose weight
  we learn from experience of the regularity of testimony.

  2. The weighing: a miracle''s antecedent improbability (uniform experience against
  it) versus the probability that the testifier is mistaken or lying.

  3. The "proof against proof" collision: two full proofs opposing each other → the
  wise man proportions belief to the stronger, and subtracts.

  4. Hume''s further arguments: no miracle has ever been attested by enough educated
  people in a civilised country; miracles mostly among barbarous/nations; the passion
