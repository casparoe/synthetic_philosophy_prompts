  The argument was between Dr. Okonjo, who is in palliative care, and Professor Lindqvist,
  who is on the committee as the outside philosopher. It went like this, and I have
  numbered the moves.


  (1) Okonjo: The first clause is void, and not only because the law makes directives
  revocable. Authority over a person''s body runs either to her own competent judgment
  at the time or, when that is gone, to the instructions of the earlier competent
  self. But no earlier self can foreclose the question whether its instructions are
  still being applied to the situation it actually contemplated. A directive that
  forbids its own reconsideration is not an exercise of autonomy; it is the suspension
  of one.


  (2) Lindqvist: That reverses the direction of authority. The precedent directive
  is made at the moment of greatest information and reflective stability about what
  makes a life worth living; the later self is, by hypothesis, the one whose judgment
  is compromised. If a competent person may decide that her demented self''s protests
  do not speak for her, then saying so explicitly in the document adds nothing objectionable
  — it is the same decision, spelled out. To strike the clause is to prefer the later
  self''s utterances to the earlier self''s considered judgment, which is exactly
  the substitution Dworkin warned against.


