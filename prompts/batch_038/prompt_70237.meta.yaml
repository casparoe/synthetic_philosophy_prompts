  The dispute: two clinicians/ethicists argue about the self-undermining clause.


  Move-by-move exchange (I need genuine points on both sides, no strawmen):


  1. Person A (say, Dr. Okonjo, palliative care): The anti-revocation clause is void,
  and not merely as a matter of law. Authority to make decisions about a person''s
  body derives from that person''s own competence at the time of decision, or, when
  competence is lost, from the prior competent self''s instructions. But a prior self
  cannot pre-empt the possibility that it was wrong; it cannot bind the future in
  a way that forecloses evidence about whether the future self''s life is worth continuing.
  A directive that forbids its own reconsideration is not an exercise of autonomy
  but its suspension.


  2. Person B (Prof. Lindqvist, philosophy/bioethics): That gets the direction of
  authority backwards. The whole point of a precedent directive is that it is made
  at the moment of maximal information and reflection about values; the later self
  is, by hypothesis, the one whose judgment is impaired. If a competent person may
  decide that her future demented self''s protests are not authoritative, then a clause
  saying so is just the same decision, stated explicitly. To strike the clause is
  to respect the later self''s preference against the earlier self''s — which is precisely
  the substitution Dworkin warned about.


  3. A: But the clause is self-refuting in a specific way: it declares in advance
  that a particular kind of evidence — the patient''s own sustained, apparently contented
  testimony — is inadmissible. That''s not a substantive choice about treatment; it''s
  a rule of evidence, and rules of evidence can''t be self-binding. Compare Ulysses:
  he asked the sailors to ignore his pleas, but he didn''t claim the pleas carried
  no information about whether the plan was still worth pursuing. Ulysses set a time
  limit and a scope; this clause has neither, and it purports to survive the discovery
  that its factual premise (that dementia would be unbearable) was false.


  4. B: The disanalogy fails. Ulysses''s instructions are also evidence-filtering
  — that''s exactly what "ignore my pleas" means, and nobody thinks that makes them
  self-refuting. And the claim that the directive''s factual premise was falsified
  assumes the directive was about unbearable suffering; read it as it was written,
  it was about a life Eleanor judged to be without the goods she cared about — recognition,
  conversation, agency — none of which requires her to be suffering. Her cheerfulness
  is therefore not evidence against the premise at all; it is irrelevant to what she
  actually refused.


  5. A: Then the clause does no work and is worse than useless, because it converts
  a values-based refusal into an unfalsifiable one: on B''s reading, nothing Eleanor
  could now say or do would count against the directive, since any protest is a symptom
  and any contentment is beside the point. A refusal that no possible state of the
  patient could weaken is not a decision she is still making; it is a decision that
  has stopped being hers.


  6. B: That is an unfair test. Plenty of decisions are not revisable in light of
  the decider''s later attitudes — a will made at 40 isn''t invalidated because the
  80-year-old testator has come to like the niece she disinherited; a promise binds
  even when the promiser''s feelings change. What makes the earlier decision authoritative
  is not its continuing endorsement but the conditions under which it was made.


