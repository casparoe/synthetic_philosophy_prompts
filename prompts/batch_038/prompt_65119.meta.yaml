  Draft title: "Superrationality isn''t rationality plus common knowledge — it''s
  a substitute for it"


  Body:


  Para 1: Setup. Everyone in my circles learned two things in the same year: Hofstadter''s
  superrationality and the machinery of common knowledge in epistemic game theory.
  They get filed together as "the stuff about agents knowing about each other''s knowing."
  I think that filing is wrong, and the wrongness has consequences.


  Para 2: What superrationality actually is. Recap: symmetric game, players assumed
  to arrive at the same answer because they''re running the same kind of reasoning;
  so you maximize over the diagonal (both C, both D) rather than over the four cells
  independently. In a PD you cooperate. In the Platonia setup (trillionaire, 20 people,
  exactly one telegram gets a billion), you send a telegram with probability 1/20
  — not because you''ve reasoned about what the others believe about you, but because
  you''re one of twenty copies of a procedure that outputs a probability.


  Para 3: Introduce the distinction — two species:

  (A) Copy-superrationality: the symmetry is a fact about implementations. You are
  literally the same program as the other agent, or you''re both running "what a careful
  person does in this situation." Only one belief required: a first-order belief about
  a mechanism. No belief-about-beliefs.

  (B) Guess-superrationality: the symmetry is a fact about a *social category*. The
  other guy is a smart honest person reading the same column, so he''ll get the same
  answer. This one is entirely made of belief hierarchies: I believe he''s superrational,
  and I believe he believes I am, etc.


  Para 4: The transparency budget. (Novel bit.) For any game there''s a fixed budget
  of mutual information about each other''s decision procedures that the players need
  in order to coordinate off-diagonal. Nash reasoning spends it on hierarchies — unboundedly
  many levels, and each level is a separate thing to get right. Copy-superrationality
  spends it on one bit at level 0: "we''re the same algorithm." So the two are substitutes:
  the cheaper your symmetry assumption, the fewer levels of belief you need, and the
  less fragile your coordination.


  Para 5: The ε derivation. Type B is fragile. Let ε = probability that your counterpart
  isn''t running your algorithm (he''s a plain maximizer, or a different sort of thing).
  Payoffs T>R>P>S. Cooperate iff (1−ε)R + εS > (1−ε)P + εT, i.e. ε < (R−P)/((R−P)+(T−S)).
  With the classic $150/$100/$1/$0 numbers: R−P = 99, T−S = 150, so ε < 99/249 ≈ 0.4.
  So superrational cooperation is robust up to nearly 40% doubt. That looks like a
  graceful degradation, not a cliff.


  Para 6: The cliff, though. Then the essay invokes Rubinstein''s email game: two
  players have to coordinate, only one gets a message about which game is being played,
  messages can be lost with small probability; even if you have an arbitrarily long
  but finite chain of "I know that he knows that I know", the equilibrium jumps back
  to the safe/dominant one. Common knowledge isn''t approximable: it''s a discontinuity.
  And that suggests the opposite conclusion about Type B: it''s not 40%-robust at
  all, it''s all-or-nothing.


  Para 7: The essay''s claim: so which is it? I say the resolution is that ε in the
  derivation isn''t the same kind of quantity as the ε in the email game. In the derivation
  ε is uncertainty about *type* — a first-order thing, and it degrades smoothly. In
  the email game the uncertainty is about *the state*, and it''s the higher-order
  structure (does he know that I know which game we''re in) that has to be infinitely
  deep for the good equilibrium to be selected. Type B superrationality, being made
  entirely out of hierarchies, should inherit the second kind of fragility, not the
  first. Which means the derivation in §5 is measuring the wrong thing: it''s measuring
  what happens if your partner is the wrong *sort of agent*, when the real threat
  is that your partner is the right sort but isn''t sure that you know that he is.


  Para 8: And here''s where Aumann comes in, the essay says: Aumann''s result — rational
  agents with a common prior can''t agree to disagree — is usually filed as a curiosity.
  But it''s the exact statement that the hierarchy is not something you can fake:
  if two Type B superrationalists both think the other is going to send the telegram,
  and one of them doesn''t, then something in the hierarchy was never common knowledge
  in the first place. Superrationality, on the Type B reading, is Aumann''s theorem
  used as a *coordination device* rather than as a negative result about opinion.


  Para 9: Payoff of all this: the practical advice. If you want cooperation out of
  a real counterpart, don''t try to build more levels of mutual belief (Type B), because
  that''s the fragile direction and it''s the direction where a single missing message
  kills the whole thing. Try to become the same algorithm (Type A): publish your decision
  procedure, be boringly predictable, make yourself copyable. That''s why the LW-flavored
  projects — writing down your decision theory in public, being legible — do better
  than projects about signaling trust. It''s also, I think, the right way to read
  the Twin Prisoner''s Dilemma intuition pump and Parfit''s hitchhiker: they''re not
  showing that you should cooperate because you hope the other guy is like you, they''re
  removing the "hope" and substituting a fact about implementations.


  Para 10: Closing line: superrationality is not rationality with more knowledge;
  it''s rationality that got out of the knowledge business.


