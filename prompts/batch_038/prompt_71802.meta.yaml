  Question on the exam: something like: "Sen argues that famines are not, in general,
  caused by a shortage of food. Explain his entitlement approach and use it to analyze
  one famine. Is famine better understood as a natural disaster or a political crime?"


  Student answer (~250 words) with:

  Correct elements:

  - Entitlements = the set of commodity bundles a person can legally command using
  what they own (labor, land) plus trade.

  - Starvation = failure of entitlement, not necessarily absence of food.

  - Bengal 1943: wartime inflation, wages in money lagging prices, rural wage laborers
  and people whose boats/means were taken by wartime denial policies lost the ability
  to buy rice even though there was rice in Calcutta; government didn''t declare a
  famine or ration effectively until late.

  - Democracy/free press claim: governments facing elections and a critical press
  have an incentive to prevent famine; colonial Bengal had neither.


  Subtle errors:

  1. Conflates entitlement with capability: says "for Sen an entitlement is basically
  a person''s capability to get food — what they''re actually able to do and be" —
  a conflation a hasty grader might let slide, since both are Sen''s terms.

  2. Overstates: "Sen proves famines have nothing to do with food supply" / "the food
  was always there" — the entitlement approach says a decline in availability is neither
  necessary nor sufficient; in some famines production did fall. Also, using "proves"
