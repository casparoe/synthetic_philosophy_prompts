  and grue, so the evidence equally supports both, so we can''t tell which" — but
  then wrongly concludes "therefore induction is unjustified" which conflates with
  the old riddle; Goodman''s point is that the new riddle is about which hypotheses
  are confirmed, not about whether induction is justified. Another subtle mistake:
  claiming Goodman defines grue relative to "observed before t" rather than "examined
  before t" — actually Goodman''s original definition is "grue: green if first examined
  before t, blue otherwise." Later formulations use "observed". A student saying "green
  if observed before t" is a common variant, not a howler. Another: saying that if
  we wait past t, grue emeralds turn blue — misunderstanding that grue is time-indexed
  so no change happens. That''s a classic subtle error, and it''s the kind a hasty
