  ---


  My roommate is a hospital social worker, and last night we argued for three hours
  about a practice she helps administer and I cannot make sense of. I''d like someone
  to tell me what it presupposes.


  The practice: [describe advance directives for dementia]


  Let me be concrete about what the policy she works under requires.


  1. A competent adult signs a directive naming a health care agent and refusing,
  in the event of advanced dementia, hospital transfer, dialysis, CPR, antibiotics
  for pneumonia, and — in the version she sees most often — hand-feeding or feeding
  tubes. Many of these documents also include a short free-response section, which
  she says is the part the ethics committee actually reads: the patient, while still
  competent, writes in their own hand what made their life worth living, and states
  that a life without memory of their children, or without recognition of their own
  name, would not be theirs.


  2. When the patient is in advanced dementia, the directive governs. Staff are told
  to follow it even when the patient appears content — is visibly pleased by a visit,
  enjoys ice cream, laughs at television — and even when the reason the patient is
  going to die is a treatable infection.


  3. Surrogates are instructed, in a fixed order: first, what the patient actually
  said or wrote; second, what the patient would have wanted, inferred from their values;
  and only third, and only when the first two yield nothing — for an infant, say,
  or someone who has been severely cognitively disabled from birth — the patient''s
  best interests.


  4. At the same time, the same institution treats the demented patient as a full
  subject of welfare for every other purpose: it requires pain to be assessed and
  treated, requires that the patient''s distress be taken at face value, forbids neglect,
  and would report a family member who failed to feed her.


  5. And when the patient resists — pushes the spoon away, or accepts it — staff are
  told to seek the patient''s assent, which everyone concedes carries no legal weight
  and is honored in practice.


  My friend''s defense was that the directive is the patient''s own voice and we would
  be silencing her by ignoring it. My objection was that we are letting a piece of
  paper, written by someone who no longer exists, override the interests of a person
  who is here, happy, and unable to consent to anything — and that if we took the
  same line with a stranger we would call it killing. Neither of us budged. So I want
  the practice analyzed rather than the argument adjudicated.


  Questions:

  - What account of personal identity, or of what a self is, does this practice presuppose?
  In particular, does it presuppose that a person is something like the continuing
  author of a story — that the self persists as the source of a narrative and can
  bind future stages of the organism by what it wrote — and if so, how much psychological
  continuity does that require? The directives are honored precisely when memory,
  recognition, and the capacity to carry the story on are gone.

  - Which rival accounts does the practice rule out, and which does it merely sit
  awkwardly with? ...

  - Is there a way to read the practice that avoids positing anything that controversial?
  (e.g. autonomy as a right of the earlier self to dispose of the body, or a property-rights/rights-waiver
  reading; or the view that the practice is just about who gets to decide and the
  burden of proof; or a rule-utilitarian reading about the reliability of documents).
  Say which of these genuinely require less metaphysics and whether any of them can
  make sense of the ethics committee''s preference for the handwritten paragraph over
  the checkboxes.

  - Is the four-part structure internally consistent? Specifically: (a) the ordering
  in 3 — why is experiential welfare the last resort rather than the default, and
  what does that ranking say about whose interests count; (b) the coexistence of 2
  and 4 — the same body is treated as a rights-bearing subject of experience for purposes
  of protection and as a narrative author for purposes of ending treatment; (c) 5,
  the assent that carries no weight but is always sought — what theory of the moral
  significance of present experience makes assent worth obtaining and then irrelevant?

  - What does the practice presuppose about the status of a written document — that
  it is an extension of the agent, a standing speech act, a transferable authority,
  an artifact in which the self was partly constituted? ...

  - Where is the practice philosophically underdetermined, so that two or three quite
  different theories of the self would license exactly the same protocol? I want to
  know which features are load-bearing and which are decoration.

  - Finally: what would have to change, concretely, in the policy — in the form, in
  the ordering of surrogate standards, in the training of staff, in what counts as
  evidence that a directive applies — if the presupposed view were replaced by (i)
  the view that what matters is the welfare of the experiencing subject now, or (ii)
  the view that the demented patient is a numerically different person who has succeeded
  the author of the directive, inheriting the body but not the obligations? In case
  (ii), at least one country permits a written request made while competent to authorize
  euthanasia for a patient with advanced dementia who can no longer confirm it, while
  others treat the same act as homicide. Say which of the two replacements would be
  easier to legislate and which would be easier to live with.


  Format: I''d like the implicit theory stated first as a compact thesis, then the
  analysis. Aim for something I could hand to my roommate.


