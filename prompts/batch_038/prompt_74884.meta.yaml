  Argument (numbered):


  (1) A rational agent chooses the action that maximizes expected utility given all
  her evidence, which comprises her private signal and her observation of predecessors''
  actions.

  (2) In the standard herding model, once the public evidence from predecessors''
  actions is sufficiently strong, it outweighs any private signal an agent could receive,
  so she chooses the action the crowd chose regardless of her signal.

  (3) An agent whose choice is independent of her private signal conveys nothing to
  those who observe it.

  (4) So once a cascade begins, the action history stops accumulating information:
  everyone thereafter ignores their signal, and all the private information held by
  later agents is discarded.

  (5) Therefore the crowd''s final belief rests on the first two or three agents''
  signals and nothing more — the wisdom of crowds is an artifact; large groups are
  no wiser than very small ones.

  (6) But (3) doesn''t depend on cascades. Any time an action is influenced by what
  others have done, it fails to be a pure function of the actor''s own evidence; to
  the extent that it''s influenced, it''s degraded as evidence.

  (7) And no human action is uninfluenced by others'' — we are all downstream of testimony,
  prices, citation counts, applause, the queue at a restaurant.

  (8) So no one''s conduct is ever clean evidence about anything, and treating others''
  actions as evidence is never rational.

  (9) That is absurd — it would rule out learning from markets, science, and language
  itself.

  (10) Hence (1) must be false: agents are not really rational, or herding is not
  really rational.


  Where does it go wrong? Multiple candidate diagnoses:


  (a) (3) equivocates. "Conveys nothing" — the correct claim is "conveys no information
  beyond what the history already implies, given the model of the agent." But an observer
  who knows that the agent saw a signal learns that the agent''s posterior was in
  the herding region. In the binary model with bounded signals, that''s vacuous —
  the region is everything. So (3) is true only under a specific boundedness assumption.
  With unbounded/high-precision signals, a herding action still rules out extreme
  contrary signals, so information keeps accruing and (4) is false. So (2) is model-relative:
  it''s not a theorem about rational herding in general but about a special case (finite
  signal alphabet). This is the real technical crux: Smith & Sorensen showed that
  with unbounded private signals, cascades can fail and learning can converge to truth.
  Hmm — should I mention that? I shouldn''t name-drop in the prompt (the asker can
  be ignorant of it), but the answering model may recall it. That''s fine — it''s
  a legitimate part of the answer. But is it "niche"? It''s a known result in the
  econ literature. I''ll let the model bring it up if it can; the prompt doesn''t
  depend on it.


  (b) (6) slides from "an action that depends on others'' actions is a degraded signal"
  to "an action that depends on others'' actions conveys nothing," ignoring that dependence
  on others'' actions is itself informative: it tells you what the actor believed
  about the crowd, which is evidence about the crowd, which is evidence about the
  world. Recursive/inference-through-others is not noise. Also, (6) treats "purity"
  of evidence as the criterion — a category error. Evidence doesn''t need to be causally
  independent of other evidence to be evidence; it needs to be non-redundant. Double-counting
  is the danger, not contamination. Actually that''s a good framing: the correct worry
  is not that herding destroys information but that it makes evidence correlated,
  so naive aggregation double-counts. The argument conflates "correlated evidence"
  with "no evidence."


  (c) (7)→(8) is a quantifier/scope slide: from "every action is somewhat influenced"
  to "no action is any evidence," i.e., a slide from degree to kind.


  (d) (5)→(6): generalization from a stylized model with specific assumptions (common
  prior, known model, sequential moves, observed actions but not payoffs) to all social
  learning.


  (e) (10): the conclusion is a false dichotomy — the alternative to "herding is rational"
  isn''t "agents are irrational"; you could reject (1) as a theory of individual choice
  but keep Bayesian rationality at the level of beliefs, or reject the model''s assumption
  that agents observe actions but not signals, or note that the inefficiency is a
  mechanism/communication failure, not an irrationality.


  (f) There''s also a normative slide at (5): "wisdom of crowds is an artifact" —
  but the wisdom-of-crowds result (Galton/Surowiecki, Condorcet) requires independent
  judgments; the cascade argument shows one of its preconditions can fail. Showing
  that a precondition fails doesn''t refute the result, and it doesn''t show that
  crowds are no wiser — it shows why they sometimes aren''t.


