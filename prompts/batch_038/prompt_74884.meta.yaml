  Actually the sharpest flaw: (2) — "An agent who acts against her private signal
  is not using her private information." She IS using it: the decision is a function
  of both the public history and her private signal; the fact that the history dominates
  doesn''t mean the signal is unused. The information is used but overridden. And
  crucially, the observer who knows the agent observed a signal learns something:
  they learn the agent''s posterior was on the herding side. In the binary model,
  if the cascade state is such that ANY signal leads to herding, then no info; but
  if a strong contrary signal would break the cascade (as in models with unbounded/high-precision
  signals), then herding reveals that the signal was not strong enough — which IS
  information. So the step from (1) to (3) is valid only in the special binary/bounded-signal
  case, and (4)''s generalization smuggles that special case in.


  Then (5)→(6) is a scope generalization: from "in this specific mechanism, the aggregation
  is lossy" to "in any setting where actions depend on others'' actions." That''s
  the proves-too-much step, and it fails because in most real settings the dependence
  is partial and the informational content is nonzero.


