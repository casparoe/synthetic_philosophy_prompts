  I am midway through a third novel — a four-generation story about a drained wetland
  in eastern England — and I have been reading Braudel for discipline rather than
  for pleasure. What I want from him is his sense that a life has three speeds at
  once: the nearly motionless time of a people in relation to their soil and climate,
  the slower cyclical time of prices, wages, harvests and credit, and the surface
  time of events and persons, which he treats with something close to contempt. My
  problem is a formal one. I cannot see how to write the middle scale at all, and
  I keep suspecting that nobody has managed it in fiction except by lecturing, which
  is what novelists do when they have no way to dramatize a conjuncture. So I have
  gone back to The Grapes of Wrath, which is the standard example people reach for,
  and I would like a serious critical reading of it through Braudel rather than through
  the usual frames — the intercalary chapters as biblical or Dos Passos-ish counterpoint,
  Steinbeck as sentimental socialist, and so forth. Please assume no genetic connection:
  the novel came first and Braudel''s Mediterranean a decade later, so this is a comparison
  of structures, not of influence.


  Here is the knot I want you to work on, and it is a hypothesis of my own that I
  expect you to test rather than flatter. My claim is that Steinbeck''s two registers
  leap over Braudel''s middle time entirely. The intercalary chapters are geological
  and climatic on one side — the dust, the rain, the turtle crossing the road, the
  land itself — and moral-juridical on the other, arriving at the bank and the owners
  as culprits; the Joad chapters are pure event, driven by accidents: a grandfather
  who will not leave the land and dies in the first hour of the journey, a brother
  who wanders off, a son-in-law who abandons a pregnant wife, a stillbirth, a flood.
  What is missing, I think, is the conjoncture — the used-car lots, the tractor finance,
  the collapsing Oklahoma wages, the California labor market, the vigilante politics
  of the Associated Farmers — treated as its own temporal layer with its own momentum,
  rather than as scenery for a moral verdict. If that is right, then the intercalary
  chapters are not a slow scale at all but a fast one: they are events of anger, narrated
  in the present tense, and the novel''s structural vision is really an ethical one
  wearing a geological costume. If it is wrong, show me where: point to the passages
  — described, not quoted — where Steinbeck genuinely renders a cycle rather than
  an indictment.


  The other thing I want pressed is the agency question, because it is where I am
  stuck in my own draft. Steinbeck has the tenant farmers argue with a tractor driver
  who is their neighbour''s son, and insists that no one in the chain wants the evictions,
  that the bank is a thing made by men that has grown past them and now does its work
  through them; and yet the novel ends in fury at particular people. That is exactly
  the temptation Braudel warns against in the other direction — the moment structure
  is described, it wants to become an actor, and the moment an actor appears, the
  structure evaporates. Does Steinbeck know he is doing this? Does the monstrous bank
  function as Braudel''s geography does — an inert condition — or as a character with
