  your probability that a partner exists, and that probability can''t be raised by
  any causal evidence — only by reasoning about how likely such a partner is a priori.
  And the partner''s willingness depends symmetrically. This makes the "trade" not
  a bargain but a bet on the shape of the space of possible minds.


