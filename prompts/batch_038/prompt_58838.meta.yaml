  be simulating each other in enough detail to represent each other''s *dispositions*,
  but any finite simulation must simplify; and the parts it simplifies away are exactly
  the parts that determine whether you''d honor the deal in weird circumstances. So
  there''s a tension: a simulation accurate enough to trust is also complex enough
  that the other side can''t easily predict what you''d want.


