  figure out, by reasoning alone, roughly what the other one is like and roughly what
  the other one will do. Because there''s no way to enforce the deal and no way to
  retaliate, the only thing holding it together is that each agent reasons: if I do
  the thing that helps them, then someone relevantly like me, over there, does the
