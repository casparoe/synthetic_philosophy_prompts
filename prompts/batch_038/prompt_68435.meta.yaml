  Draft:


  I teach a graduate seminar in philosophy of biology, and next week we take up the
  units-of-selection debate. I want to hand my students a single worked example that
  forces the frameworks apart — or, if they cannot be forced apart, that shows exactly
  where the descriptive difference lives. Please construct a case to the following
  specifications.


  Setting. A real, non-human organism with a plausible natural history — no engineered
  creatures, no science fiction, and no human cultural institutions. Discrete, ephemeral
  resource patches (a carcass, a fruit, a rotting log, a tidepool: your choice) are
  colonized each season by a fixed number of juveniles drawn at random from a single
  well-mixed global pool. Groups do not reproduce as wholes, do not go extinct, and
  do not found daughter groups; at the end of the season every patch is abandoned
  and all adults return to the global pool to mate. The only way patches differ is
  in the per-capita number of offspring their residents leave behind.


  The trait. A single heritable trait, discrete, that causes its bearer to do something
  that raises the reproductive output of its patch-mates at a cost to itself. No kin
  recognition, no greenbeard-style tagging, no repeated interactions, no partner choice,
  no reciprocity, no punishment or social enforcement of any kind. Individuals interact
  with their patch-mates and with no one else.


  The two conditions that must both hold, and must be shown to hold by arithmetic
  rather than asserted:


  (1) Within-group disadvantage. In any patch of fixed composition, a bearer has strictly
  fewer expected offspring than a non-bearer in that same patch. State the cost as
  a definite number.


  (2) Global increase. At the frequency you choose as your starting point, bearers
  have strictly higher average fitness than non-bearers across the whole population,
  and the trait''s frequency rises from one generation to the next. Report the starting
  frequency and the frequency one generation later.


