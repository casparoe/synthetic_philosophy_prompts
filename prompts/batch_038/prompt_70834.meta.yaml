  Draft:


  ---


  Six months ago I left a lectureship in England for a research post at a German university,
  and the transition has made the financing of higher education something I can no
  longer treat as a policy abstraction. Three systems now bear on my life simultaneously,
  and I find that I cannot make them consistent with one another in my head.


  First, my own: I still hold an English undergraduate loan from the post-2012 system.
  It is collected through my payroll by the tax authority as a fixed percentage of
  earnings above a threshold; there was never a credit assessment, there is no meaningful
  sense in which I can default, and the balance will simply be extinguished after
  a fixed number of years — a number that has been lengthened for the cohorts behind
  mine. British mortgage lenders do not treat it as a debt at all, but as a permanent
  deduction from my take-home pay. Meanwhile the state''s own accounts, as I understand
  them, treat the share of each year''s lending that is not expected to be repaid
  as public spending at the moment the loans are made, which amounts to a standing
  official admission that for most borrowers this is not a loan.


  Second, the one I now work inside: no tuition fees at public universities in almost
  every Land, a modest per-semester contribution from each student covering student
  services and a regional transport ticket, admission restricted by numerus clausus
  in oversubscribed subjects, and — in one Land only — substantial per-semester fees
  charged to students from outside the European Union.


  Third, the systems I keep meeting by comparison: a Danish colleague who was paid
  a monthly state grant to attend university, with the option of a supplementary state
  loan, in a country that recoups its outlay through a steeply progressive income
  tax; and an American sibling-in-law whose federal student loans survive personal
  bankruptcy, where her credit-card and medical debts would not, unless she can satisfy
  a hardship test that courts apply very stringently.


  My question is what each of these designs presupposes, philosophically... etc.


  Then the asks, enumerated:


  1. For each of the three designs, reconstruct the implicit theory: what is higher
  education taken to be... and what theory of obligation over one''s own future earnings...

  2. Distinguish strictly presupposed from merely compatible; flag underdetermination.

  3. Which rival views each quietly rules out.

  4. Internal consistency: the English one treats the same instrument as a debt, a
  tax, and a subsidy. Is that incoherent or does it reflect a coherent hybrid? And
  the German one: free for citizens/EU but priced for non-EU students — what does
  that presuppose about why the citizen''s education is free (reciprocity through
  the tax system? membership? likelihood of remaining?) and what does it say about
  whether the "free" system is free?

  5. The American asymmetry: student debt alone is inescapable. Test my tentative
  reading: that non-dischargeability presupposes human capital is non-repossessable
  and already delivered, so the only collateral is the borrower''s future in perpetuity;
  and that this is in tension with an otherwise consumerist, market framing of American
  higher education. Is there a theory of responsibility under which this asymmetry
  is defensible, or is it simply creditor power wearing the language of obligation?

  6. Test my own framing: I suspect each system is answering a prior question — who
  owns the graduate premium? English: the state created it, so the state may recapture
  part of it; German: it is not separable from the social product at large, so recapture
  is incoherent and general taxation is the only honest instrument; Danish: study
  is itself socially productive activity, so the student is paid as a contributor;
  American: the borrower bought it in a competitive market and owes the price. Tell
  me where this reading is right, where it is a rationalisation, and whether there
  is a system whose logic it cannot capture.

  7. Screening vs productivity: If the graduate premium is largely a positional signal
  rather than a productivity gain, does the "fair to the non-graduate taxpayer" argument,
  which is usually the justification offered for graduate contributions, still hold?
  What would each of the three designs have to become under that view?

  8. Replace-the-view exercise: what would have to change institutionally if we adopted
  the rival presupposition in each case (e.g., treat English repayments openly as
  an earmarked tax; treat German higher education as a club good priced at the margin;
