  The theory: process-based vs outcome-based supervision (from AI alignment). Outcome-based:
  grade only the final answer; cheap, scalable, avoids encoding your own biases about
  method, but vulnerable to reward hacking and doesn''t tell you where things went
  wrong; also the "specification gaming" problem — the agent optimizes the proxy.
  Process-based: supervise each step; catches errors early, gives denser signal, but
  requires the supervisor to be able to evaluate steps (supervisor bottleneck), is
  expensive, and can bake in the supervisor''s own mistakes. Mapping: the test score
  is the outcome reward; No Child Left Behind''s AYP is the outcome-based supervision
  regime; walkthroughs/curriculum fidelity/pacing guides are process supervision;
  the erasure analysis is a post-hoc audit of the process using outcome data (a hybrid
  — "process auditing via outcome forensics"). The RICO prosecution treats the teachers
  as reward hackers; but who''s the model and who''s the trainer? Interesting: Hall
  = the training run''s objective-setter; teachers = the model; students = the environment?
  Or the teachers are the model, the school district is the training procedure.


