  Prohibition: The drys in 1917-1919 explicitly believed (a) that the public''s future
  opinion would be corrupted by the liquor interest and by habituation, and (b) that
  the amendment entrenched so that the future (worse) opinion could not undo it. The
  wets in 1933 argued the electorate''s considered judgment had changed based on new
  evidence (crime, non-compliance, lost tax revenue, the Depression''s fiscal needs).
  Reflection applied to a polity: what should the 1919 ratifiers have believed about
  what they''d believe in 1933? If they expected that their future selves would come
  to reject Prohibition, Reflection says they should already reject it now — unless
  they think the future rejection is caused by corrupting influences rather than evidence.
  So the drys'' position is an explicit *anti-Reflection* stance: they claimed the
  anticipated future opinion would be the product of bad causes (bootlegger money,
  addiction, war-time? no) not evidence. And the entrenchment (Article V supermajority
  requirement) is an institutional device for *violating* Reflection deliberately
  — which is exactly what van Fraassen''s critics say can be rational in some cases
  (the "diachronic Dutch book" is only a problem if you''re going to bet with your
  future self; if your future self''s bets are made against you...). Also: the 18th
