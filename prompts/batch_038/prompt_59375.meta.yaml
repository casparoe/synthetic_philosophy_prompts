  Alternatively: domain "Counterfactual vs. interventionist theories of causation".
  A commitments audit: someone who holds (a) Lewis-style counterfactual dependence
  semantics for causal claims, (b) Woodward''s interventionist account of causation
  as invariance under interventions, (c) the thesis that there are no interventions
  on macroscopic variables (or "interventionism is not reductive"), (d) actualism
  about counterfactuals (Humean denial of powers), (e) causation is a relation between
  events rather than between variable values. Genuine tension: Lewis''s account requires
  counterfactuals with a similarity metric that itself... hmm. Or: holding that interventions
  are defined counterfactually (Woodward''s account is non-reductive: interventions
  are primitive) while also holding a reductive counterfactual analysis — and holding
  that causation is transitive while endorsing... Let me think about known genuine
  tensions:


  1. Lewis''s counterfactual theory faces the problem of effects and epiphenomena:
  to solve it, Lewis (1979) adopts a "local miracle" semantics for counterfactuals
  where the miracle occurs just before the antecedent time. But this makes the counterfactual
  dependence asymmetric in a way that arguably undermines the Humean supervenience
  of the chance facts... Actually there''s a well-known tension: Lewis wants both
  (i) Humean supervenience plus the denial of backward causation, and (ii) a resolution
  of the problem of effects via small miracles. Also, his 1979 account relies on a
  "quasi-miracle" notion and it makes counterfactuals depend on matters of particular
  fact in a way that''s circular with causation (the direction of counterfactual dependence
  is fixed by the asymmetry of miracles, which is itself fixed by... thermodynamic
  asymmetry).


  2. Transitivity: Lewis''s theory is transitive (ancestral of counterfactual dependence),
  which handles late preemption but gives wrong verdicts in "double prevention" cases
  (e.g., Billy''s plan; the case where Suzy shoots down the enemy plane that would
  have shot down Billy). Many people want to say double prevention isn''t causation.
  So a person holding "counterfactual dependence is the analysis" plus "causation
  is transitive" plus "double prevention cases are not causation" is inconsistent.
  That''s a genuine tension and pretty standard.


  3. Interventionism and non-reductiveness: Woodward says interventions are not reducible
  and the account is not a reductive analysis; someone who wants a reductive analysis
  of causation in terms of interventions while also endorsing an interventionist account
  faces circularity worries. Also interventionism has trouble with "supernomenalism"?
  Hmm.


  4. Interventionism + actualism about counterfactuals + no laws (Humeanism) — Woodward''s
  account uses counterfactuals about interventions which may not be nomologically
  possible; if you''re a Humean about laws who thinks there are no genuine necessities
  and no possible worlds with different laws... Actually the tension: interventionist
  counterfactuals about interventions are often non-actual and physically impossible;
  Lewis''s account requires a similarity metric over possible worlds, but if you hold
  that interventions are primitive and unanalyzable (Woodward), you can''t use them
  to analyze counterfactuals.


