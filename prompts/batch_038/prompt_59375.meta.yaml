  (Lewis: causation is among events; but Woodward: causation claims are relative to
  a variable set and a model, i.e., causation is model-relative / interest-relative)
  AND holding that causal facts are objective/mind-independent AND holding Humean
  supervenience. Model-relativity vs. objectivity is a real tension in the interventionist
  literature (Woodward explicitly embraces the relativity of causal claims to a choice
  of variables, while also wanting invariance to be objective). So a person who says
  (a) causal claims are true relative to a choice of variables, (b) there is a fact
  of the matter independent of our interests about whether X causes Y, (c) Humean
  supervenience, (d) interventionism without reductive analysis — there are genuine
  and apparent tensions.


