  to go through it move by move rather than tell me which camp the field belongs to.


  Setting, as far as I can describe it: the group whose work was being discussed had
  trained a model to predict a person''s next choices from several years of logs from
  a grocery-delivery service — what people actually confirmed in the app, at what
  time of day, after how much scrolling, and so on. The model was then used to generate
  recommended baskets. The talk''s headline result was a pilot in which the app inserted
  a mandatory confirmation screen with a short delay (roughly two seconds, plus a
  summary of the basket''s nutritional profile) for one group of users and not for
  a control group. Behavior in the delay condition looked systematically different:
  those users confirmed fewer high-sugar items and, once confirmed, were much less
  likely to cancel or return the order. The authors of the talk said the delay condition
  revealed the users'' "true" preferences, and that the model should be trained on
  that data because the control-condition data reflected impulse rather than preference.


