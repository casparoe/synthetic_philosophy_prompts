  1. "Nadia" objected that this framing gets the inference backwards. Her claim: the
  only thing you can ever recover from behavior is a reward function that, together
  with some model of the agent, rationalizes the behavior. Two seconds of friction
  plus a nutritional summary is a different decision problem, with different available
  actions and different costs of attention, so the delay condition doesn''t strip
  away a distortion — it adds one. There is no experiment in which you observe choice
  under no friction at all, so "the frictionless preference" is not a limit you can
  approach; it''s a term with no referent. Her conclusion: the honest description
  of what the group built is that they picked the behavioral environment whose outputs
  they liked, then labeled the resulting reward function "true."


