  UDHR drafting through HCH/factored cognition:

  - The task: produce a list of rights acceptable to all UN members. Not decomposable
  in an obvious way — you can''t factor "what is human dignity" into subproblems without
  losing the whole.

  - What they actually did: factor along axes — Humphrey''s outline (48 articles)
  → Cassin''s restructure with a preamble (portico metaphor) → Working group → Third
  Committee''s article-by-article debate with 170+ amendments → Plenary vote. Plus
  the philosophical "consultation" (UNESCO questionnaire) as a separate factoring
  channel that the drafting committee then largely ignored (Roosevelt reportedly said
  the committee didn''t have time for philosophy — actually Eleanor Roosevelt''s remark:
  she told the UNESCO committee''s results weren''t needed; Malik''s involvement;
  McKeon as UNESCO chair).

  - Chang''s "pluralism of cultures" intervention, his appeals to Confucian ren (translated
  as "two-man-mindedness" in one rendering — I must not quote from memory), and his
  successful push to remove references to nature/God; Malik''s Thomist natural-law
  insistence.

  - Maritain''s diagnosis: agreement on practical conclusions, not on theoretical
  foundations — a factoring where the shared node is deliberately left un-analyzed.
  In HCH terms: the committee converged at a level of abstraction where the subagents''
  outputs agreed, but the "true" question (whether these rights exist and why) was
  never resolved — the classic "abstraction vs. decomposition" issue in iterated amplification.
  Also the "obfuscation" worry: the group could pass the question by writing ambiguous
  text (e.g., the compromise on family/marriage, on property Article 17, on the "duty
  to society").

  - The 8 abstentions and the fact that no one voted against — a "consensus" that
  is an artifact of the voting rule and the factoring.

  - What HCH says: iterated amplification is supposed to let an overseer who can verify
  each step scale up judgment; but here, verification was impossible in principle
  — no single human can verify whether the UDHR is right; the "trust" in the process
  was delegated to procedure.

  - The episode tests the idealization: deliberation as factored cognition assumes
  the factors compose into an answer; UDHR shows the composition can be achieved by
  *deferring* the hard part, which HCH would call "the question was answered at a
  higher abstraction, with the sub-questions left unexamined" — i.e., what HCH calls
  "obfuscation" and what diplomacy calls "constructive ambiguity."


