  Actually, here''s a genuinely nice, less-trodden angle: the guest defends the view
  that the paradox of fiction dissolves once we notice that many ordinary emotions
  are not belief-based either — emotions toward the *past* (grief for a dead person
  who no longer exists), emotions toward *merely possible* outcomes (anxiety about
  a future event that may not happen — you don''t believe it will happen but you fear
  it), and emotions in dreams. This "the belief condition is already false in ordinary
  cases" strategy is real and is discussed in the literature (e.g., people note fear
  of a low-probability event doesn''t require belief it will happen). That''s a great
