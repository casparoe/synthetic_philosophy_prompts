  I am the instructor for a first-year graduate seminar in philosophy of mind, and
  I am writing the final exam. Students answer one of two questions in ninety minutes;
  the question I want from you is Question 2, worth twenty-five marks, and it concerns
  the two-dimensionalist treatment of the necessary a posteriori.


  Here is the problem I want the question to turn on, and I want you to build the
  question around it rather than around the framework in general. The two-dimensionalist
  says that a sentence like "water is H2O" is necessary in its secondary intension
  and contingent in its primary intension, and that its a posteriori status is explained
  by the fact that we need empirical information to know which world is actual: on
  this picture, the conditional linking a complete empirical description of the world
  to the target claim is knowable a priori, and the empirical work is done entirely
  by the premise that supplies that description. My worry is that this leaves unexplained
  what the empirical premise can be. If the premise is a complete non-indexical description
  of the world, then no a priori conditional from it can yield an indexical conclusion
  — knowing the whole physical description of a world does not tell you that you are
  in it — so the derivation needs an extra premise locating the speaker, and that
  premise is neither a priori nor part of the description. If instead the premise
  is centered or contains an actuality operator, the conditional becomes a triviality
  of rigidification, and the account seems to presuppose the Kripkean semantics it
  was supposed to explain rather than derive the necessity of the identity. I want
  students to face this dilemma directly.


