  Inject the niche bit: a made-up case. Let''s design:


  Society X has three "representative positions" — say, a distribution over three
  social positions with index of primary goods expectations:

  - Arrangement A: (10, 10, 10)

  - Arrangement B: (12, 15, 25)

  - Arrangement C: (11, 30, 60)

  - Arrangement D: (10, 40, 90)


  Under the difference principle, the ranking depends only on the worst-off: D ties
  with A at 10; B is 12; C is 11. So B > C > A = D. Under leximin: D ties A (both
  worst-off 10), then compare second: A''s 10 vs D''s 40 → D > A. B: (12,15,25); C:
  (11,30,60). Worst-off: B 12 > C 11, so B > C. Leximin: B > D > A... wait D worst
  is 10 < 12, so B first. Then D (10,40,90) vs C (11,30,60) vs A (10,10,10): C''s
  worst is 11 > 10, so C > D = A; then D vs A on second-worst: 40 > 10 so D > A. Leximin:
  B > C > D > A. Difference principle: B (12) > C (11) > A = D (10).


  Key crux: under the difference principle, A and D are tied, but D involves massive
  inequality — and Rawls''s "close-knittedness" condition would say whether D is permissible
  depends on whether the advantages of the better-off are tied to the worst-off. Actually
  the difference principle says an arrangement is just only if inequalities are to
  the greatest benefit of the least advantaged; D is not to the greatest benefit (B
  is better for the worst-off), so D is not permitted even though it''s not unjust
  *in itself*? Rawls: the difference principle is a principle for ranking distributions;
  the "perfectly just scheme" is one where the worst off are maximally benefited.
  So D fails to be perfectly just though it may be permissible if... Rawls says arrangements
  are "just" if they satisfy both principles; the second principle is satisfied when
  inequalities work to the greatest benefit of the least advantaged — hmm, Rawls sometimes
  says the difference principle permits all inequalities that improve the worst off
  relative to equality (a weaker reading), vs. the maximizing reading requiring the
  best possible for the worst off. That''s a real ambiguity in Rawls (the "strong"
  vs "weak" difference principle debate). Great crux for an exam question! Students
  often get this wrong.


