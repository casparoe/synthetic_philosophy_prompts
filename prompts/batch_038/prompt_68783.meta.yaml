  Alternatively: two-envelope paradox satire — e.g., a mock FAQ or a "product review"
  for a gambling site built on the two-envelope paradox. That''s quite good and doesn''t
  require quotes. The two-envelope paradox: two envelopes, one contains twice as much
  as the other; you pick one, then reasoning suggests switching always gains expected
  value 1.25×, which is paradoxical since symmetric. Resolutions: the expectation
  calculation conflates; the prior over amounts matters; unbounded priors are impossible/improper;
  with bounded priors switching isn''t always favorable; Smullyan''s "the amounts
  aren''t fixed" versions; Nalebuff''s work; the "no uniform distribution over the
  reals/integers" issue; also the variant where you can open the envelope (then it
  depends on the prior); the Chiba/cover-type strategy — using a randomized threshold
  function to switch with probability decreasing in observed amount gives better-than-50%
  chance of the larger envelope even with unknown distribution (that''s the "switching
  strategy based on a strictly decreasing function" from Cover''s pick-the-larger
  game). That''s a nice in-the-weeds detail that a model without search can still
  handle because it''s derivable.


