  Write a dialogue between two equally sophisticated agents — call them a program-equilibrium
  theorist and a classical game theorist — who have each submitted their source code
  to the other and are now waiting for the run, arguing about whether anything genuinely
  decision-theoretic is happening. Ground the exchange in the specific technical crux
  rather than generalities: the theorist''s favored construction is a program that
  cooperates only if it can verify that the other program will cooperate in response,
  and the game theorist''s counter is that verification is exactly where the construction
  breaks down — two such programs can each be unable to establish the other''s cooperation,
  defect, and be perfectly rational by their own lights, so the ''equilibrium'' delivers
  cooperation only among agents too incautious to be safe. Let each side press the
  other on the following: whether the code-substitution stage is a real pre-play commitment
  move or a redescription of nature''s choice; whether an agent can be responsible
  for a policy it cannot revise at the moment of play; and whether the failure cases
  show that transparent cooperation is fragile in principle or merely an artifact
  of the verification method. Neither side should be a strawman, both should be allowed
  to score real points, and I want the dialogue to end somewhere genuinely unresolved
  rather than converging on a handshake."


