  From LaVictoire, Orseau, Nix (2014), "Robust Cooperation on the Prisoner''s Dilemma:
  Programs that Respond to Proof": They define modal agents that search for proofs
  of the opponent''s move. The problem: naive modal agents have the "chicken rule"
  — if they can prove they cooperate, they defect — needed to avoid proving their
  own cooperation and then being exploited (Löb''s theorem: if a system proves "if
  I prove X then X", then it proves X; so an agent that cooperates whenever it proves
  the opponent cooperates, when facing a similar agent, mutual cooperation is provable
  by Löb). The chicken rule prevents the agent from being provably-cooperating (which
  would let a defector exploit... hmm, actually the chicken rule makes the agent''s
  behavior unprovable within the system, so FairBot-vs-FairBot with chicken rules
  doesn''t cooperate). Then they use the Parametric Bounded Löb Theorem to get cooperation
  at bounded proof levels. And PrudentBot uses two proof levels: cooperates only if
  it can prove at level n that opponent cooperates with it, and prove at level n+1
  that opponent doesn''t cooperate with CooperateBot (so it defects against CooperateBot).
