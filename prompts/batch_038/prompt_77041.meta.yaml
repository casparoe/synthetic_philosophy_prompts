  exists and can be checked against, at the same time, by anyone; the past doesn''t
  exist to be checked against, only traces. A map''s distortions are corrigible by
  walking the terrain; a narrative''s distortions can''t be checked against the terrain,
  only against other accounts. A map''s user is navigating forward (the map is used
  prospectively — you consult it before and during the journey); historical narrative
  is consumed retrospectively (the reader already knows the destination). Crucially:
  the map analogy assumes the traveler can consult the map at the outset and still
  be surprised; but the historian''s reader already knows the ending, so the "distortion"
  is not symmetric — hindsight bias means the reader''s judgment of the map''s fidelity
  is corrupted by knowing where the road led. Also: a map''s scale is chosen relative
  to a purpose and its errors are quantifiable (projection distortion has a measurable
