  or two subtle mistakes.


  Student''s answer draft:


  Part (a): "Berkeley holds that the objects of sense are ideas, and that ideas cannot
  exist otherwise than in a mind that perceives them. The master argument is a challenge
  to the materialist: try to conceive of any sensible object — a tree, a book, a mountain
  — existing without being perceived by any mind. Berkeley thinks you cannot do this,
  because in the very act of conceiving the object you are conceiving it, and what
  is conceived is an idea in your mind; so the attempt produces a manifest contradiction,
  since the object is supposed to be unconceived and yet is conceived. Berkeley takes
  this to refute the materialist''s claim that there could be an unthinking substance
  in which sensible qualities inhere." — This is largely right. Good: identifies the
  conceivability maneuver, the target (material substratum), the contradiction.


  Part (b): "The objection is that Berkeley assumes what he needs to prove. The materialist
  does not claim to conceive of an object as an idea existing unperceived; she claims
  to conceive that there is an object such that no one perceives it. In the first
  case the property of being conceived attaches to the object itself, in the second
  it attaches to the content of a thought about the object. If Berkeley slides from
  the second to the first, he begs the question, since the materialist denies that
  the objects of sense are ideas in the first place. Berkeley''s reply, I think, is
  that the materialist cannot make good on this distinction, because any object she
  can specify is specified through sensible qualities, and sensible qualities are
  ideas by Berkeley''s earlier argument from the inseparability of primary and secondary
  qualities. So the master argument is not a standalone proof but the capstone of
  the earlier arguments; it only works if you already accept that extension and figure
  are mind-dependent." — This is actually a sophisticated and mostly good answer.
  Maybe a bit too good, but fine; it''s the "right about the more visible things."


  Hmm, one subtlety: is the de re/de dicto diagnosis right? Yes, that''s the standard
  reading (Tipton, Warnock, etc.). Fine.


  Part (c): Here''s where I inject the subtle mistakes.


  Student: "God''s role is to perceive everything at all times, so the tree in the
  quadrangle continues to exist when no human is looking at it because God perceives
  it. This shows that the master argument establishes idealism in general: since everything
  that exists depends for its existence on being perceived, and God perceives everything,
  the whole of reality consists of ideas and the minds that perceive them. The master
  argument also does further work here: because ideas are inert and cannot cause anything,
  and because our ideas of sense are much more vivid and orderly than the ideas of
  imagination we cause ourselves, the master argument shows that they must be produced
  in us by another will — namely God''s will. So the master argument gives Berkeley
  both the refutation of matter and the existence of God."


  Subtle mistakes here:

  1. Conflation: attributing the passivity/inertia argument (ideas are inert, more
  vivid and orderly, so caused by another spirit) to the master argument. The master
  argument doesn''t establish God; a separate argument from the passivity of ideas
  and the regularity/vividness of sensory ideas does. A hasty grader might let it
  slide because all the components are Berkeleyan.

  2. Scope error / over-extension: "since everything that exists depends for its existence
  on being perceived" — for Berkeley, minds/spirits are not ideas and are not perceived;
  they exist by perceiving, and are known not by ideas but by notion. So esse is percipi
  applies to ideas/sensible objects only; spirits are active substances whose existence
  consists in perceiving. Saying the whole of reality consists of "ideas and the minds
  that perceive them" is actually okay-ish, but the claim "everything that exists
  depends for its existence on being perceived" is wrong, and the claim that the master
  argument establishes idealism "in general" (about minds too) is wrong — it''s restricted
  to sensible objects/ideas.

  3. Possibly a third: "the tree continues to exist when no human is looking because
  God perceives it" — this is right-ish, though Berkeley also has the counterfactual/laws-of-nature
  account. Not an error.


