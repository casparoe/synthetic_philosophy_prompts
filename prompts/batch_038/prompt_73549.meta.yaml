  Option: Berkeley''s master argument. The master argument (Principles §23): "I am
  willing to put the whole upon this issue. If you can but conceive it possible for
  any mixture or combination of ideas, or any sensible object whatever, to exist without
  the mind, then I will give up the whole cause." Subtle mistakes students make: conflating
  the master argument with the conceivability/immediacy argument; conflating Berkeley''s
  claim with "to be is to be perceived" being a definition rather than a substantive
  claim; thinking the master argument is a refutation of material substance by way
  of an infinite regress; conflating "unconceived" with "unperceived"; ignoring that
  Berkeley thinks the opponent can only conceive ideas resembling ideas (the "resemblance"
  argument, §8); missing that Berkeley allows objects to exist in the mind of God;
  the "master argument" being read as trivially begging the question vs. as an inference
  to the best explanation; the "tree falls in the forest" objection and Berkeley''s
  actual reply (continuity in God''s mind); also the distinction between ideas and
  minds/spirits — that the master argument is about ideas, not about spirits, so it
  cannot establish idealism about minds.


  A good student answer: gets the basic structure right, correctly notes the objection
  that it begs the question, but subtly conflates: (a) treats the master argument
  as showing that Berkeley has established that all existents are ideas, when in fact
  it''s supposed to be restricted to sensible objects/ideas and can''t be extended
