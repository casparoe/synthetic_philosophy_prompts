  Role: experienced instructor/grader of early modern philosophy; professional philosopher
  specializing in Berkeley and British empiricism.


  Setup: I am grading a timed essay (or take-home) for an upper-level undergraduate
  early modern philosophy course. Neutral tone: "I did not write this answer and have
  no view yet about its quality" — should not signal opinion. Ask for: a grade out
  of a specified total, a rubric-based point-by-point assessment, identification of
  what the student gets right, identification of specific errors with explanation
  of why each is an error and how serious, suggested marginal comments, and a note
  on which errors a hasty grader might miss.


  Also include "think carefully" and "begin with brainstorming" instructions: e.g.,
  "Before assigning a grade, work through the answer in a short analysis: identify
  every distinct claim the student makes, and label each as correct, imprecise, or
  wrong." That''s a good chain-of-thought-ish scaffold.


  The exam question: multi-part. Something like:


  Question (25 points, ~45 minutes):

  (a) State Berkeley''s "master argument" and explain how it is supposed to establish
  that sensible objects cannot exist unperceived. (8 points)

  (b) A critic objects that the argument begs the question against the materialist,
  since it assumes that whatever is conceived is an idea in the conceiving mind. Explain
  this objection as clearly as you can, and say whether Berkeley has a reply. (10
  points)

  (c) Briefly: what role does God play in Berkeley''s account of the continued existence
  of sensible things when no finite mind perceives them, and what does this imply
  about the scope of the master argument? (7 points)


