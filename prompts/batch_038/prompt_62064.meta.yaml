  or just of generality? There''s a well-known point (from Fabre/Evans, and discussed
  by Dennett and Hofstadter) that the wasp actually is responding to a stimulus (the
  cricket''s antennae — she drags it by the antennae), so moving the cricket isn''t
  the right manipulation; if you cut off the antennae, she drags it by the legs; the
