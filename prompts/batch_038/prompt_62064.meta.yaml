  Dangerous Idea" (the wasp and the paralyzed cricket) and uses it against Searle''s
  Chinese Room ("Sphexishness" of the Chinese Room; the brain has anti-sphexishness).


  Free will: sphexishness is used in the free will debate — if humans are just complex
  automata, is our flexibility "anti-sphexishness" or just more elaborate sphexishness?
  Dennett argues that flexibility (anti-sphexishness) is what matters for free will,
  and it''s compatible with mechanism; the worry about determinism is often a disguised
  worry about sphexishness. Also relevant: deep self / whole brain emulations, Searle''s
  Chinese Room, the "lookup table" reply (Block''s China brain), the "homunculi-headed
  robot" thought experiment (Block''s nation of Chinese citizens), the idea of "flexibility
  as anti-sphexishness."


