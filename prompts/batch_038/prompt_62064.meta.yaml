  e.g., re-paralyzing the cricket if it revives). That''s a nice angle for a taxonomy:
  an important nuance — "sphexishness" may be observer-relative: a system looks rigid
  only relative to the range of perturbations tested. That''s a genuinely good diagnostic
  distinction.


