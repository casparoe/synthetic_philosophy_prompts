  ---


  I''m taking a graduate seminar this term on formal epistemology and bounded reasoning,
  and our final unit is on logical uncertainty. For our last session the seminar is
  running a structured adversarial collaboration, and I''ve been asked to draft the
  document the two sides should be able to sign. I''d like you to write that document.


  The two camps, as they''ve emerged in our discussions:


  Camp A (the coherence-first camp) holds that the normative ideal for a reasoner
  uncertain about mathematics is continuous with ordinary Bayesianism: an agent should
  assign probabilities to mathematical claims, those probabilities should be constrained
  by the deductive relations among the claims (so that a proven implication constrains
  the probability of its consequent), and the right idealization is something like
  the logical induction criterion — a sequence of probability assignments that, over
  time, cannot be exploited for unbounded profit by any betting strategy the agent
  could actually compute, and that comes to respect logical relations in the limit.
  On this view "there''s a 70% chance this conjecture is true" is a genuine doxastic
  state about arithmetic, not a coded way of talking about proofs or about one''s
  own psychology.


  Camp B (the proof-first camp) holds that this gets the phenomenon backwards. Mathematical
  truth is not the sort of thing an agent can be uncertain about in the way it can
  be uncertain about the weather; what looks like credence in a conjecture is really
  uncertainty about what one will be able to establish, or about what one''s own symbols
  mean, or about which concepts are worth reasoning with. Camp B also presses an objection
  from feasibility: the known constructions satisfying the criterion are wildly beyond
  the reach of any bounded agent, so the criterion cannot function as a norm for creatures
  like us, and a norm that no possible agent can even approximate is not an idealization
  but a change of subject.


  Then the deliverable:


  1. Numbered list of agreed claims: what both camps can sign — about what logical
  omniscience gets wrong as a model of real reasoners, about what any adequate account
  must explain (e.g., why mathematicians'' confidence in unproved conjectures is graded,
  stable, and often tracks the eventual outcome; why an agent should sometimes decline
  to buy a bet on a theorem it can''t yet prove; how deductive constraints should
  bite before the proof is found), and about which technical premises are genuinely
  contested rather than settled. Keep these non-vacuous: a claim both sides sign only
  because it says nothing is worse than useless — for each item, say in one clause
  what the agreement costs each side.


  2. A disagreements table. Columns: the disputed claim; Camp A''s own preferred formulation;
  Camp B''s own preferred formulation (each phrased so that camp would accept the
  wording as its own); whether the disagreement is substantive or verbal; and, if
  substantive, what observable or algorithmic difference it makes. Be especially careful
  with the "verbal" column: if there is a decision problem on which the two camps
  issue exactly the same recommendation for every possible input, say so and say what
  remains over.


  3. The cruxes. Three or four sub-questions such that settling them would move at
  least one side. For each: the case, experiment, or argument both camps accept as
  bearing on it; each camp''s prediction, registered in advance, in a form that could
  be shown to be wrong; and what result would count as a loss for each side rather
  than as something to be reinterpreted.


  4. A final section: two or three claims each camp is prepared to concede are weaknesses
  in its own position — not rhetorical concessions, but the places where its own view
  is least developed.


  I don''t want citations, a bibliography, or a reading list; I can find the literature
  myself. What I want is the conceptual work: formulations precise enough that a member
  of each camp would recognize their own view and a neutral reader could see exactly
  where the two come apart. Where a technical premise matters (for instance, whether
  some construction is feasible, or whether deductive constraints can be satisfied
  in the limit while remaining computable), state it in prose and flag whether it
  is something both camps accept or something one camp is assuming.


  Also: resist the temptation to end with a synthesis that dissolves the dispute.
  If the honest conclusion is that the two camps share a lot and disagree about one
  narrow thing, say which narrow thing it is; if the honest conclusion is that they
  disagree about something fundamental that no experiment would settle, say that and
  explain why.


