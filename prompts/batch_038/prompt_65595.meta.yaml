  I am in the second term of a graduate seminar on formal epistemology, and our current
  unit is on logical uncertainty. For the final session our instructor is running
  a structured adversarial collaboration, and I have been assigned to draft the document
  that the two opposing camps in our cohort should be able to sign jointly. I would
  like you to write that document. I want the conceptual work done properly, not a
  summary of positions.


  The two camps, as the debate has taken shape in our seminar:


  Camp A — call it the coherence-first camp — holds that a reasoner''s uncertainty
  about mathematics is a species of ordinary doxastic uncertainty and should be regimented
  by the same norms that govern empirical belief, suitably relaxed. Its ideal is something
  like the logical induction criterion: a sequence of probability assignments over
  the sentences of a formal language, revised over time, that no polynomial-time computable
  betting strategy can exploit for unbounded profit, and that comes to respect deductive
  relations in the limit. On this view, a mathematician''s report that a conjecture
  is "probably true" describes a belief about arithmetic itself, and the fact that
  the belief cannot be made coherent all at once is a computational limitation, not
  a difference in kind.


  Camp B — the proof-first camp — holds that this inverts the order of explanation.
  Mathematical truth is not, on Camp B''s view, the sort of thing about which an agent
  can bear genuine uncertainty in the way it bears uncertainty about the weather;
  what looks like a credence in a conjecture is really a belief about what the agent
  or its community will be able to establish, about what its own notation means, or
  about the fruitfulness of a concept. Camp B further presses an objection from feasibility:
  the criterion is formulated in terms of what efficient traders can do to a market,
  yet nothing we know how to build can play the market''s side of that arrangement,
  and a norm no bounded agent could even approximate is not an idealization but a
  change of subject.


  The document should have four parts.


  1. Agreed claims. A numbered list of substantive propositions both camps can sign
  — about what logical omniscience gets wrong as a model of real reasoners; about
  what any adequate account has to explain (why confidence in unproved conjectures
  is graded, stable, and responsive to partial results; why deductive constraints
