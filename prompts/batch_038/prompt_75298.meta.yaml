  Sen''s liberal paradox is quite technical: the paradox says there is no social decision
  procedure that is simultaneously Paretian, liberal (in Sen''s minimal-liberalism
  sense: at least two individuals each have a personal sphere where their strict preference
  over a pair of alternatives is socially decisive), and yields a consistent (acyclic)
  social ordering. The asker could report verdicts about which allocations are acceptable/unacceptable,
  or which social choices "respect liberty", across invented profiles. But the paradox
  is about impossibility, and the asker''s verdicts would be about... hmm, what would
  the underlying "principle" be? Possibly: which condition to give up — a Nozickian
  Wilt Chamberlain-type objection (Gibbard''s rights waiver / "alienable rights"),
  the Pareto-unconcerned objection, Sen''s own suggestion of self-controlled restraint
  (the "Paretian liberal" resolution via liberal exercise of rights — Gibbard''s "rights
  wavers"), Blau''s critique (the Lady Chatterley example depends on externalities
  — Prude''s preference over Lewd''s reading is a nosy preference), and the distinction
  between intrapersonal vs interpersonal comparisons. Cases: whether someone''s preference
  about what another does in private counts as decisive; whether a preference caused
  by disgust counts; whether a preference that harms the holder counts.


