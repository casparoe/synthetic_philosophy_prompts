  Frame problem theory content:

  - McCarthy & Hayes (1969) "Some philosophical problems from the standpoint of artificial
  intelligence" — introduced frame problem: how to represent what does not change
  after an action without writing down endless frame axioms.

  - Hayes''s "naïve physics" / In Naqvi? Actually Hayes''s "The Naïve Physics manifesto"
  and the "clock and the dummy" — his common-sense reasoning program.

  - Qualification problem (McCarthy 1980): the impossibility of enumerating all preconditions
  for an action to succeed.

  - Ramification problem: indirect consequences of actions.

  - Ford & Pylyshyn (1996, The Robot''s Dilemma Revisited): distinguish the narrow
  (formal/representational) frame problem from the broad epistemic problem.

  - Dennett (1984) "Cognitive wheels: the frame problem of AI": R1, R1D1, R2D1 robots
  — the robot that keeps deducing irrelevant implications; the problem as relevance-realisation
  / knowing what to ignore.

  - Also "the designer''s frame problem": the person designing the system must decide
  in advance what the machine will represent and treat as fixed — this is arguably
  the practically important version (Dennett mentions the designer''s problem; also
  there''s literature on "the frame problem" applied to engineering/design and to
  normal accident theory — Perrow''s "normal accidents" and "interactive complexity"/"tight
  coupling" which is a competing explanation for TMI. Vaughan''s "normalisation of
  deviance" too.

  - Also worth mentioning: the epistemology of instruments — the indicator light encoded
  a frame axiom (that removing power to the solenoid means the valve is closed) —
  the instrument asserts "nothing else changed."


  Now, inject a niche/new idea. Ideas:

  1. The asker''s proposed distinction: "the frame problem" as usually posed (what
  to write down about what stays the same) vs. what they call the "instrument frame
  problem" or "instrumentation as a frozen set of frame axioms": each gauge in a control
  room is a claim about which variable tracks which physical quantity, and thus a
  commitment to a frame axiom; the failure at TMI was not that operators couldn''t
  enumerate non-changes but that the plant''s instruments encoded non-changes that
  were false (power to solenoid ≠ valve position; pump running ≠ feedwater flowing).

  2. Another injected idea: a distinction the asker''s seminar group proposed between
  "additive" failures (things happening that weren''t represented) and "silent" failures
  (representations that persist unchanged though the world changed) — and ask whether
  the frame problem is about the former or the latter.

  3. Also could ask: does TMI support the "narrow" or "broad" (Dennettian/relevance)
  construal, and does Perrow''s normal-accident account make the frame problem explanatorily
  redundant?


  That''s a good, meaty prompt. Also ask where the theory is silent: e.g., the frame
  problem is usually about an agent''s *own* actions; at TMI the operators were responding
  to a machine acting autonomously, so the mapping may be strained; and the qualification
  problem is about preconditions for action, whereas the operators'' error was in
  *belief revision* from instruments — is that the frame problem at all or a problem
  of evidence/confirmation? That''s a strong tension to ask about.


