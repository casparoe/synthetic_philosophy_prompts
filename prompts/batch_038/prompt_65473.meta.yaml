  Draft:


  "I am auditing a graduate seminar on the philosophy of AI this term, and our unit
  on the frame problem has stalled in a way I would like to break open with a concrete
  case. The seminar has done the usual survey — the representational puzzle about
  writing down what persists after an action without an endless list of frame axioms,
  the qualification problem about enumerating preconditions, the ramification problem
  about indirect effects, the later distinction between the narrow formal problem
  and Dennett''s broader problem of relevance-realisation, where a robot keeps deriving
  true but useless implications. What we have not managed to do is decide whether
  any of this describes anything that actually happens to people operating machines,
  or whether it is purely an artefact of trying to write a logic of action. So: please
  analyse the Three Mile Island accident of 28 March 1979 as a case study in the frame
  problem. Not the nuclear physics, and not the general ''human factors'' verdict;
  I want the theory-to-case mapping done carefully, and I want it tested in both directions.


  For convenience, the salient facts (please correct me only if I have got something
  plainly wrong, and flag any step where your analysis leans on a detail I have not
  given). The unit was a pressurised water reactor running near full power when the
  secondary feedwater loop failed, tripping the turbine and then the reactor; decay
  heat continued. Pressure in the primary loop rose and the pilot-operated relief
  valve on the pressuriser opened automatically; when pressure fell it was supposed
  to reseat but stuck open, venting coolant for hours. Two things mattered more than
  the valve itself. First, the control-room indicator for that valve showed whether
  the closing solenoid was energised, not whether the valve was physically shut, so
  the operators read it as shut. Second, in each of the two emergency feedwater lines
  a block valve had been closed for maintenance and its position light was obscured
  by a maintenance tag, so operators who could see the emergency pumps running believed
  feedwater was reaching the steam generators when it was not. Meanwhile coolant inventory
  in the primary loop was falling while pressuriser level was rising; the operators
  had been trained to regard a water-filled, ''solid'' pressuriser as a danger, and
  so they cut back on emergency injection at precisely the moment the core was uncovering.
  Part of the core melted. The President''s commission concluded that preventing such
  accidents would require fundamental changes in the organisation, procedures, practices
  and above all attitudes of the regulator and the industry, and insisted that the
  operators'' errors could not be understood apart from the system they were trained
  for.


