  well-run monarchy who obeys because he understands and endorses the decrees would,
  on Spinoza''s psychology, act from reason and thus be free — arguably freer than
  a democratic citizen who votes from passion and obeys decrees he dissented from.
  Actually! Spinoza himself says in TTP ch. 20 that a person who obeys because he
  thinks the command is right is free. And in the Political Treatise he notes that
  in a democracy, someone who is outvoted is still bound; and a citizen who acts against
