  part of it, acting on the state''s command is (partly) acting on one''s own decision,
  hence free. Spinoza distinguishes between acting from fear (servitude) and acting
  from one''s own decision/hope of a greater good (freedom). Also he notes: in any
  state, a subject who does what the law commands because he thinks it right is free;
  but a subject who does it because he fears punishment is a slave. And in a democracy,
  since laws are made by common consent, subjects are more their own masters.


