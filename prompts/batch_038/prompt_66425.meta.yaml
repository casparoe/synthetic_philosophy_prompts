  But the wrinkle: could a monarchy subject be MORE free than a democracy citizen,
  on Spinoza''s view, with both regimes well-ordered? Spinoza thinks freedom also
  involves the structural fact that in democracy the law is "by common consent," so
  obeying it isn''t obeying another. In a monarchy, even if the subject internally
  endorses the decree, the decree''s source is external. But Spinoza''s criterion
  for freedom of action is internal — so a monarch''s subject who endorses the decree
  acts from her own reason. And in a democracy, a citizen whose proposal was outvoted
  must obey a decree she judges wrong — she acts from... fear of penalty, or from
  her own judgment that the process is legitimate. So the case could be: a democracy
  where a minority citizen consistently loses votes on matters she judges crucially
  wrong, so she obeys from fear/resignation; versus a monarchy where the monarch happens
  to be wise and the subject endorses every decree from reason. This is doable but
  the Spinozist attack is easy: "that democracy is badly ordered / that monarchy is
  not stable and depends on luck."


