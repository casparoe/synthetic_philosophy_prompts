  criteria comes out, and identify which feature does the work, and say how a Spinozist
  would attack the case (e.g., by denying that a single-person sovereignty can be
  non-tyrannical and stable, or by arguing that the subject''s freedom there is still
  parasitic on the monarch''s reason rather than her own).


  That''s a genuinely interesting design task, and the "attack" is natural: Spinoza
  thinks monarchy''s stability depends on the monarch being one person whose decisions
  are swayed by passions, and that "one person cannot bear the burden of sovereignty."
