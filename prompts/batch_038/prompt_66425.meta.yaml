  Hobbes on geometry: Hobbes thought geometry was the only genuine science (scientia)
  because it''s the only field where we have causal knowledge — we construct figures
  ourselves, so we know their generation; and he famously attempted to square the
  circle (failed, his "proof" was wrong), and his dispute with Wallis at Oxford. Also
  his method: resolution and composition. A thought experiment spec: construct a scenario
  where Hobbes''s criterion for scientia (knowledge from causes, i.e., from generation/construction)
  yields that X counts as science but Y doesn''t, in a counterintuitive direction.
  That''s interesting: Hobbes holds geometry is the paradigm science because we construct
  the figures; but by the same reasoning, civil philosophy is science because we construct
  the commonwealth; yet physics is not properly science because we don''t know the
  generation of natural bodies. So a thought experiment: build a case where Hobbesian
  constructivism licenses counting something as scientia that we''d now call pseudoscience,
  and denies it to something we''d call science — e.g., a modern case: a climate modeler
  vs. a video game physics engine designer. Hmm, that could be good but requires accuracy
  about Hobbes.


  Care ethics: thought experiment spec — care ethics vs. justice/impartialist views.
  E.g., construct a case where a care ethicist must recommend a course of action that
  an impartialist utilitarian would too, but for structurally different reasons...
  or a case where care ethics''s four phases (caring about, taking care of, care-giving,
  care-receiving) come apart — specifically the "care-receiving" phase: the recipient''s
  response shows the care failed even though the carer did everything right. Or Tronto''s
  phases. A designed case where "attentiveness, responsibility, competence, responsiveness"
  (Tronto''s four moral qualities of care) come apart: a carer who is fully attentive,
  responsible, and competent but unresponsive — or responsive but incompetent. Hmm.


  Skepticism and BIV: thought experiment spec — construct a case where the BIV argument
  (Putnam''s semantic externalist anti-skeptical argument) doesn''t work. That''s
  actually a nice, well-trodden-but-in-the-weeds topic: Putnam''s argument that "I
  am a brain in a vat" is false or necessarily false if I''m not a vat brain, because
