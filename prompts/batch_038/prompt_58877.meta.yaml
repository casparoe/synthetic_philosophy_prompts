  Excerpt draft:


  "In 1945 [→ say "in the forties"], the logician Carl Hempel asked a question that
  sounds trivial: what would count as evidence that all ravens are black? The obvious
  answer is that a black raven would. Call that Nicod''s criterion — positive instances
  confirm. Hempel then pointed out that ''all ravens are black'' is logically the
  same sentence as ''everything that isn''t black isn''t a raven,'' so anything that
  confirms the second confirms the first. That''s the equivalence condition, and it
  looks unimpeachable: if two hypotheses say the same thing about the world, no observation
  could favour one and not the other.


  Put the two together and you get the indoor ornithologist. Your shoes are white.
  They aren''t black, and they aren''t ravens, so they are a positive instance of
  ''everything that isn''t black isn''t a raven'' — and therefore, by the equivalence
