  Para 3: My worry — flexibility is relational: a system is flexible only relative
  to a set of perturbations. The wasp is scored against a set of perturbations chosen
  to defeat her (an experimenter''s contrivance), while humans are scored against
  the perturbations their own cognition was shaped for. Call this the perturbation-set
  asymmetry. When we test the wasp we pick the failure; when we test ourselves we
  pick the successes (chess, novel problem solving) and call the failures (Müller-Lyer
  illusion that persists after you know it''s an illusion, sunk-cost reasoning, checking
