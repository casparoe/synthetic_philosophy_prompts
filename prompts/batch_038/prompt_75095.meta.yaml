  ---


  I''m putting together an interactive feature for the ideas section of my magazine
  on a deceptively simple question: is the genome really a code, a set of instructions,
  a message? The debate among philosophers of biology has produced a surprising number
  of mutually incompatible positions, and I want to hand readers a diagnostic instrument
  rather than a glossary — something that sorts them by what they actually believe,
  not by what they call themselves.


  So: build me a decision tree, roughly eight branch questions deep, that starts from
  commitments any reader with a general-interest science education can honestly assess
  and ends at a named position. Requirements:


  1. No node may ask for a label or a self-description. Don''t ask whether the reader
  thinks DNA is a code, whether they''re a realist about information, or which camp
  they''re in. Every question must be a concrete scenario or a specific claim they
  can accept or reject: what would have to survive if a cell''s cytoplasmic machinery
  were destroyed but its DNA kept intact; what makes a synthetic genome with reassigned
  codons still "carry" the same instructions; whether a heritable epigenetic mark
  that changes a phenotype counts as information in the same sense as the corresponding
  base sequence; whether the parent embryo contributes the same kind of causal contribution
  as the sperm; whether a perfect reader plus a genome suffices to reconstruct the
  organism; whether information talk earns its keep once you''ve specified every causal
  interaction; and so on.


  2. Build the tree from the logical space first, not from a list of names. State
  up front which axes you take to be genuinely independent — for instance, whether
  informational talk is literal or merely useful metaphor; whether the informational
  content, if any, is semantic in a sense tied to biological function; whether information
  is a property of DNA specifically or of the whole developing system; whether Shannon-style
  measures capture what biologists mean; and whether the concept does explanatory
  work that causal talk cannot. Then place positions at the combinations, and tell
  me which combinations are unoccupied and why — incoherent, unattractive, or simply
  unexplored.


  3. The leaves must include, at minimum: a strong view on which the genome literally
  is a coded program whose semantics is fixed by the cellular machinery that reads
  it; a view on which genetic information is real but derivative, grounded in evolved
  function rather than in chemistry; a deflationary view that reduces it to measurable
  causal difference-making and calls everything else metaphor; a purely quantitative
  information-theoretic view that treats the term as a unit and nothing more; a view
  on which information is not DNA''s property at all but belongs to the distributed
  developmental system, with no privileged causal factor; and, if your space admits
  it, a position that denies the question is well posed. Label each leaf by its content.
  Use proper names of individual philosophers only if you''re confident of the attribution,
  and give no citations, dates, or bibliography.


  4. Flag every pair of leaves your questions fail to separate, and say which further
  question would separate them if the reader had the patience.


  Deliver it as an ordered tree — question text, answer options, the branch each leads
  to — followed by a short key that lists the leaves, the path that reaches each,
  and one sentence on the most awkward commitment each leaf carries. Assume the reader
  is intelligent, has read popular science on genetics and gene editing, and has never
  taken a philosophy course.


