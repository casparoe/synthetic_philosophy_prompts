  - Mill''s claim that the enfranchised workers are "not engaged (we may call it bribed)
  by any peculiar interest of their own, to the support of property as it is" — i.e.,
  the removal of a bias from the political calculus. Is this an argument that the
  legitimacy of property now rests purely on utility/expediency? And what''s the relation
  to Mill''s "On Liberty" and his claim in Principles (Bk II Ch I) that the laws of
  distribution are a matter of human institution?

  - The parenthetical "we may call it bribed" is an odd locution — a nice fine-grained
  question.

  - The claim about "no stake in the country" — Mill inverts the Tory vocabulary:
  they have the greatest stake.

  - The second paragraph: a theory of political change and prediction — "Sudden effects
  in history are generally superficial"; indirect effects more momentous than direct;
  the epistemology of forecasting institutional change. That''s a great crux: Mill
  is developing a methodology for evaluating socialism as an experiment — and this
