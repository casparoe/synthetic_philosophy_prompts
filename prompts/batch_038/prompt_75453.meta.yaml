  Three readings:

  (R1) Axiological reading: the objection is about where well-being sits — welfare
  is a property of lives, not of populations, so the good to be promoted is not a
  sum over experiences but a vector of persons'' levels, and any principle that treats
  persons as mere locations of value misdescribes the good.

  (R2) Deliberative/prudential-unity reading: the objection is about the justificatory
  structure of intrapersonal compensation — a burden is bearable because the same
  subject who bears it also gets the benefit; the utilitarian illicitly assumes a
  subject spanning the population.

  (R3) Right-based/agency reading: the objection is about what may be done to a person
  — using someone as a means for another''s gain is a distinct moral kind, and the
  loss/gain arithmetic simply doesn''t apply to it.


