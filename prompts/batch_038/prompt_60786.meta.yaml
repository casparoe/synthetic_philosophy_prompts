  I should be careful about accuracy. I.J. Good''s result: for a decision problem
  where the action is chosen to maximize expected utility after observing evidence,
  the expected utility with the evidence is at least as great as without — non-negative
  expected value of information (this is sometimes called "Good''s theorem", from
  I.J. Good 1967, "On the principle of total evidence"). Yes. The standard caveats:
  costs of obtaining info, delays, non-Bayesian updating, dynamic inconsistency, self-undermining
  information (gathering changes the state), information you won''t act on, and cases
  where more information makes you worse off due to time inconsistency or "information
  that destroys a beneficial illusion"/strategic settings. Also: the theorem requires
  that the decision after receiving information is chosen by the same utility function
  and that the expectation is taken over the same prior. Also known failures: "information
  can hurt" in games (value of information negative for a player who must reveal),
  and in problems with dynamic inconsistency (e.g., "the smoking lesion"? no), and
  when the agent''s future self can''t commit.


