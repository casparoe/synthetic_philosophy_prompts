  Draft essay:


  ---

  Smith''s impartial spectator is usually read as a device for correcting the biases
  of actual spectators: we generalize from the many partial viewpoints we encounter
  until we arrive at a standpoint that is nobody''s in particular, and that standpoint
  is what confers authority on our judgments about ourselves. I want to argue that
  this reading gets the direction of explanation backwards, and that once it is corrected
  a problem appears that is not the familiar charge of relativism.


  On my reading, the impartial spectator is an equilibrium notion rather than a criterion.
  The process Smith describes in Part III — watching others judge, watching them judge
  us, internalizing the judgments we cannot avoid, then imagining how we would look
  to someone who had all the relevant information and none of our stakes — is a process
  of mutual adjustment. A spectator is impartial when further exposure to further
  viewpoints no longer changes its verdicts: the process has settled. Nothing outside
  the process certifies the settlement. That is why Smith''s occasional theological
  remark that the general rules of morality are justly to be regarded as the laws
  of the deity cannot do the work of an external guarantor: in Smith the deity endorses
  what the settled spectator approves, so the endorsement is a redescription of convergence,
  not an independent check on it.


  If authority is just settled-ness, the obvious objection is that different communities
  settle differently. I think this misdiagnoses the difficulty, for two reasons. First,
  Smith is not committed to denying divergence; he devotes a whole part of the book
  to the influence of custom and fashion on moral sentiment, and he repeatedly describes
  actual spectators as systematically distorted by proximity, rank, and self-interest.
  Divergence is his data, not a refutation of him. Second, and more importantly, Smith
  already has a criterion that isn''t mere stability: scope. The corruption cases
  he worries about — the man within the breast being silenced, or bought off, or answering
  only to a small circle of admirers — are cases where the process has settled prematurely,
  because too few and too similar perspectives were integrated. So the real content
  of "impartial" is a claim about how wide the circle must be before settling counts.


  That relocates the vulnerability. Smith''s theory does not need convergence in fact
  across societies; it needs convergence under widening scope in the same agent: that
  if I keep enlarging the circle of perspectives I take account of, my verdicts stop
  changing, and stop changing in the same place as yours. This is a substantive empirical-psychological
  claim, and Smith''s own account of how easily approbation is captured by custom
  gives us reason to doubt it. Custom does not merely supply different starting points
  that widening would wash out; it changes what counts as a viewpoint at all.


  So the objection I want to press is not that the spectator is relative to a community,
  but that scope-widening is not self-correcting, which leaves the theory without
  any way to tell a settled judgment from a captured one.

  ---


