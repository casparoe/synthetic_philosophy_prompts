  does, the market stops lying to us — things only looked cheap because somebody else
  was paying for the smoke. Get the number roughly right and a thousand separate decisions
  that no planner could ever coordinate start pointing the same way. Get it badly
  wrong and you''ve just added a surcharge to the power bill.


  Prices are also more honest than rules. Every rule creates a hidden subsidy for
  whoever lobbied hard enough to be exempt from it, and the exemptions always show
  up eventually. A tax sits out in the open where you can see what it costs and argue
  about it.


