  Essay draft:


  "Every climate plan in town is some version of the same argument: tell people what
  to do, or make the wrong thing cost more.


  I think we should mostly do the second one. A rule — no new gas hookups, no leaf
  blowers, every building retrofitted by 2035 — has to guess at the cheapest way to
  cut emissions and then force everybody down that path. A price doesn''t have to
  guess. Put a tax on carbon that rises each year and let it flow through to gas,
  electricity, airfare, beef, cement, and every household and business will quietly
  rearrange itself around the new number. The steel mill that can cut emissions for
  less than the tax will cut them; the one that can''t will pay; nobody in city hall
  has to know which is which.


  The important part is the level. If the tax equals the actual damage a ton of carbon
  does, the market stops lying to us: everything that looks cheap only looked cheap
  because someone else was paying for the smoke. Get the number right and a thousand
  small decisions that no planner could ever coordinate start pointing the same direction.
  Get it wrong and you''ve just added a levy to the utility bill.


  Prices also beat rules on honesty. A rule creates a hidden subsidy for whoever lobbies
  to be exempted from it, and the exemptions always show up. A tax is out in the open
  where you can see what it costs and argue about it.


  And revenue. A carbon tax is one of the few new taxes that can be popular: send
  most of it straight back as an equal check to every household, use some to cut payroll
  taxes, and most working families come out ahead while still facing the higher price
  at the pump — which is the thing that actually changes behavior. A regulation gives
  you the higher price without the check.


  I''ll grant one thing to the other side. Efficiency gains don''t always deliver
  what they promise: when something gets cheaper to use, we use more of it. That''s
  old news (there''s a name for it, Jevons paradox), and it''s an argument for keeping
  the price rising, not for going back to writing rules.


  Where I part company is with people who say the whole project of pricing is a delay
  tactic and that what''s needed is to stop growing. I don''t know what that means
  concretely, and neither do they, mostly. Shrinking an economy is what a recession
  is, and a recession is the one climate policy that''s guaranteed to be regressive,
  since the people who lose their jobs first are the ones with the least cushion.
  Britain has grown its economy by something like three quarters since 1990 and cut
  its emissions by nearly half, which suggests the two are separable. And if the answer
  is that we''ve only managed that by shipping the dirty part of our consumption to
  other countries, then the honest version of the argument is about trade, not about
  growth.


  Price the damage, send the money back, and let people decide how to live. That''s
  a policy you can actually pass and actually measure."


