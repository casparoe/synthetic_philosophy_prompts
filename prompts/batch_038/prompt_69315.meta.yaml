  by 2035. A price doesn''t have to guess. Tax carbon, let it rise every year, let
  it flow through to gas, electricity, airfare, cement, beef, and every household
  and business quietly rearranges itself around the new number. The steel mill that
  can cut emissions for less than the tax cuts them. The one that can''t pays. Nobody
  at city hall needs to know which is which.


