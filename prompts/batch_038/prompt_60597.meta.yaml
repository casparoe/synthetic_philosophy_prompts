  Also, ask whether the principle could be stated in a way that doesn''t smuggle in
  the interpreter''s own confidence — i.e., the threshold problem: "demonstration"
  is indexed to the epistemic state of the interpreter, so the principle might be
  vacuous or self-undermining. And ask for the name of the position my verdicts add
