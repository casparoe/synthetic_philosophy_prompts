  Persona: A doctoral student / instructor preparing a seminar session, or someone
  in a reading group. Formal and polished, 1–3 paragraphs, elaborate, with some not-super-relevant
  detail.


  Type: "Report one''s verdicts on a set of cases and ask what principle captures
  them."


  Content: the asker reports verdicts on conflict cases between a demonstrated/probable
  scientific claim and a scriptural passage, asks:

  - what principle, stated precisely, captures all (or most) of the verdicts, with
  the case motivating each clause;

  - how it compares to Galileo''s own criteria in the Castelli and Christina letters
  (accommodation; the "how to go to heaven, not how the heavens go" point — careful,
  that''s a quotation attributed to Baronio cited by Galileo. I must not put it in
  quotation marks unless fetched. I did see it in the fetched Wikipedia text: "[The]
  intention of the Holy Spirit is to teach us how one goes to heaven and not how heaven
  goes." That''s from the fetched page, quoting Galileo''s citation of Cardinal Baronio.
  Technically I fetched a source containing the passage and can copy it. But the rule
  says if I quote from a real text, I must fetch a source containing the passage and
  copy from the fetched text. Wikipedia''s rendering is a source containing the passage,
  though it''s a secondary rendering. Safer: paraphrase without quotation marks —
  "the line Galileo borrows about scripture teaching how to go to heaven rather than
  how the heavens go." Good, no quotes.

  - which verdicts the principle can''t accommodate and must be revised;

  - verdicts on cases the asker hasn''t considered;

  - whether the principle is stable or collapses (e.g., does the demonstration/probability
  threshold do all the work, making it ad hoc?).


  Cases (concrete, with verdicts):


  1. Psalm-type passages saying God fixed the earth so that it cannot be moved; also
  the sun rising and setting. Verdict: reinterpret freely — these describe appearances
  and are doing devotional work, and once there''s a demonstration of the earth''s
  motion, the literal sense was never the intended one. Not a loss.


  2. Joshua 10: the day is lengthened by the sun standing still. Verdict: here I want
  to keep the event but drop the mechanism — the text''s content is that the day was
  supernaturally lengthened, not that the sun''s motion was arrested. I feel fine
  about this, though the mechanism is exactly what the words say, so I''m uneasy that
  I''m doing something different from case 1.


  3. A passage giving a measured circumference and diameter of a circular basin that
  imply a ratio of 3. Verdict: no conflict at all; a scribe reporting a rough figure
  isn''t making a geometrical claim. Totally free.


  4. A passage describing the origin of the human species such that all humans descend
  from a single pair a few thousand years ago, where genetics makes that unlikely
  but not demonstrated impossible. Verdict: I''d already reinterpret here — the evidence
  is strong and convergent even if not strictly demonstrative. This conflicts with
  my insistence (following Galileo) that only a demonstration licenses departure from
  the literal sense.


  5. A doctrine tied to salvation: e.g., that humans have a soul not reducible to
  matter, or that the world had a beginning in time. Verdict: even a complete, well-confirmed
  physical account of cognition wouldn''t move me to read these figuratively; I''d
  rather deny that the physics is what it seems. This looks like the reverse of case
  4: weaker evidence, no reinterpretation.


  6. A miracle narrative that conflicts with nothing in physics but with ordinary
  causal regularity: the resurrection, water into wine. Verdict: no reinterpretation
  needed at all; my principle can''t be "science constrains literal readings" if it
  fires here.


  7. Maybe a case where the conflict is with a well-established but philosophically
  loaded interpretation rather than the text: e.g., a passage about the firmament
  and waters above. Verdict: I treat the cosmology as part of the cultural scaffolding
  of the text and don''t think its falsity touches anything — this is case 1 again
  but I feel even more relaxed.


  8. A hard-to-reconcile pair: (a) I say the earth''s motion being demonstrated forces
  reinterpretation of the "earth cannot be moved" passages, but (b) I also say that
  if astronomers produced a demonstration that the universe is only thousands of years
  old by a stellar-mechanism I don''t understand, I would accept it and reinterpret
  my own... hmm, that''s less interesting. Better hard pair: cases 4 and 5 above,
  as noted; plus the tension between the "salvation relevance" criterion and the "demonstration"
  criterion — two independent thresholds that give conflicting outputs.


  Also ask: whether Galileo''s own criteria (accommodation, necessity, the requirement
  of demonstration, the "not how the heavens go" restriction of scripture''s teaching
  scope, and the two-books/no-contradiction premise) generate my verdicts; where they''d
  give the opposite answer; and whether my practice is in fact closer to Bellarmine''s
  (don''t reinterpret without a demonstration; if there''s a demonstration, accept
  it and reinterpret; absent demonstration, don''t touch the text) — I recall Bellarmine''s
  letter to Foscarini (April 1615) says roughly: don''t abandon the traditional reading
  unless there''s a real demonstration; if there were one, one would have to proceed
  with great consideration in explaining scripture that appears contrary. That''s
  a well-known and safe paraphrase. Also could mention Augustine as Galileo''s authority
  — safe, generic.


  Also ask for the principle to be stated as a decision procedure with ordered clauses
  (so it''s a bit like a hybrid with taxonomy, but the type is verdicts → principle,
  which is right). Ask: state the principle as a small set of ordered clauses, say
  which of my cases motivates each clause, note the clauses'' interaction, give verdicts
