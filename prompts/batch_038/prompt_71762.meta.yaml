  the next crisis. His most recent book applies the same cycle to the near future,
  warning that the 2030s will see American state collapse unless elite overproduction
  — too many credentialed people chasing too few positions of power — is reversed.
  Not everyone is impressed. Historians point out that Malthusian mechanism was refuted
  two centuries ago by the Industrial Revolution, that the cycles are so long that
  no single society provides more than a couple of observations, and that a theory
  retrofitted to events that have already happened is not a forecast. If the demographic
