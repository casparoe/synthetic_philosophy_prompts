  the date of the next crisis" — Turchin explicitly frames this as probabilistic/conditional:
  identifying conditions that raise the probability of instability, not dating events.
  He rejects "prediction" in the point-forecast sense; he speaks of forecasting periods/propensities.

  3. Conflating "the Capitol riot, pandemic, inflation spike" as validations of a
  specific prediction — the 2010 prediction was about a decade of heightened instability
  driven by elite overproduction and immiseration, not those events; and Turchin has
  been careful (though critics say otherwise).

