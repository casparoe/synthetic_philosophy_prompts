  Two devices do the work. First, the stereotype: the set of beliefs and expectations
  that a competent speaker must associate with the term in order to be counted as
  using it — for ''water'', roughly that it is a colourless liquid that falls as rain
  and so on. The stereotype is shared by Oscar and Twin Oscar, which is why it cannot
  be what distinguishes their extensions; it also explains how a layperson can competently
