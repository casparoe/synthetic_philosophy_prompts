  Exam question (25 marks; the answer should be no more than 1,200 words):


  "Putnam asks us to imagine Twin Earth: a planet indistinguishable from Earth in
  every macroscopic respect, whose inhabitants have psychological duplicates of us
  and speak a language they call English, but where the clear, drinkable liquid in
  the rivers and rain is not H₂O but a different compound, abbreviated XYZ. He sets
  the scene several centuries ago, when neither planet''s chemistry could have revealed
  the difference.


  (a) [10 marks] Set out the argument Putnam draws from this case against the claim
  that meanings are states of the head. Explain the roles played by the stereotype
  and by what Putnam treats as the indexical element in the meaning of a natural kind
  term.


  (b) [10 marks] Now consider a planet we will call Dirth. Dirth is in every respect
  like Earth: its lakes and rivers contain H₂O, and its inhabitants, the Dirthians,
  have psychological duplicates of us. But the Dirthian word ''water'' was introduced,
  some centuries ago, by a castaway who had spent her life on Twin Earth. She baptised
  the liquid in a Dirthian lake by holding up a flask of XYZ she had brought with
  her and stipulating that whatever is the same liquid as this is to be called ''water''.
  Since then the Dirthians have used the word entirely in the ordinary way — swimming
  in it, drinking it, buying and selling it — and no sample of XYZ has survived on
  the planet. On Putnam''s account, what does the Dirthians'' word ''water'' refer
  to? Does your answer show that reference is fixed once and for all by an original
  act of ostension, or that it depends on the causal contact a community keeps up
  with its environment? Explain the considerations on each side.


  (c) [5 marks] Oscar is transported in his sleep from Earth to Twin Earth and spends
  the rest of his life there, never learning that anything has changed. Does his word
  ''water'' come to refer to XYZ? Say what, if anything, in Putnam''s framework settles
  the question."


  That''s a strong, non-regurgitable question. Note: (b) is invented by me — good.


