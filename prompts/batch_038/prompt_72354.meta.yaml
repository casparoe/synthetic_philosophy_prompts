  \ one sense we plainly can conceive of an unperceived tree, namely by describing\
  \ it as a tree nobody is perceiving, and Berkeley has simply assumed that this sense\
  \ is unavailable.\n\nI think the reply is stronger than Berkeley's argument, though\
  \ not for the reason usually given. Berkeley concedes the point himself: he allows\
  \ that we can form ideas of trees and books while omitting any idea of a perceiver,\
  \ which is to admit that we can represent to ourselves an object that nobody is\
  \ perceiving. Once that concession is on the table the master argument collapses\
  \ into a verbal manoeuvre about the word 'conceive', and what is left of Berkeley's\
  \ idealism is the dispositional analysis he sketches early in the Principles: to\
  \ say the table in my study exists is to say that if I were in the study I would\
  \ perceive it. That conditional reading is the right way to understand the appeal\
  \ to God as well — God's role is to underwrite the truth of the conditionals, not\
  \ to be literally looking at everything — and it is what makes Berkeley's system\
  \ survivable, at the cost of making his argument against matter redundant.\n---\n\
