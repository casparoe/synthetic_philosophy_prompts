  Berkeley's target throughout the Principles is the doctrine he describes at the\
  \ outset as strangely prevailing among men, that houses, mountains and rivers —\
  \ in short, all sensible things — have a real existence distinct from their being\
  \ perceived. His own thesis for sensible things is esse est percipi: the being of\
  \ a tree, a stone or a table consists in its being perceived. Two points about this\
  \ need stressing before the argument itself. First, Berkeley is not denying that\
  \ tables and trees exist; he denies that there is any material substance underlying\
  \ or causing our ideas of them, so his view is, in his own eyes, the common-sense\
  \ one and scepticism is the position of his opponents. Second, he does not deny\
  \ that there are substances at all: minds or spirits are substances, and they are\
  \ the only active things there are. Ideas are inert and cannot cause anything, so\
  \ the cause of the ideas of sense I do not will must be a spirit other than me,\
  \ and ultimately God, whose perception is what keeps the world in being when no\
  \ created spirit is perceiving it, and whose orderly manner of producing ideas is\
  \ what we call the laws of nature.\n\nThe master argument, as it is usually called,\
  \ is Berkeley's way of closing off Locke's escape route. Locke wanted to keep the\
  \ primary qualities — extension, figure, motion, solidity — in mind-independent\
  \ objects while conceding that colours, tastes and sounds are only in the mind.\
  \ Berkeley's reply is that the primary qualities cannot be conceived apart from\
  \ the secondary ones, since you cannot frame an idea of an extended, moving thing\
  \ that has no colour at all; and the master argument then does the decisive work\
  \ by showing that even the primary qualities cannot exist unperceived. Berkeley\
  \ puts the point as a challenge: go on, imagine some object — trees in a park, say,\
  \ or books in a closet — existing with nobody there to perceive them. You can produce\
  \ the ideas of trees and books while leaving out any idea of a perceiver, but that\
  \ is all you have done; you have not conceived those objects existing unperceived,\
  \ for in imagining them you were yourself perceiving them. The argument first appears\
  \ in the Three Dialogues of 1713, in the exchange between Philonous and Hylas, and\
  \ Berkeley later restated it more compactly in the Principles of 1710.\n\nThe pivotal\
  \ premise is that whatever cannot be conceived is impossible. That is worth pausing\
  \ on, because it makes the argument purely epistemological: it establishes a limit\
  \ on what can be thought, not on what there is, and so it leaves perfectly open\
