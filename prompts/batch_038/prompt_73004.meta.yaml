  Student answer draft (~400 words):


  "PII says that if two things are distinct, then there must be some property that
  one has and the other lacks; its converse, the indiscernibility of identicals, says
  that if two things are identical they share all their properties. Only the first
  is at issue here, since no one is disputing that a and b are each self-identical.
  Black''s two-sphere universe is meant to be a counterexample: a and b are distinct
  but share every qualitative property, so PII is false.


  The rescue claims that PII survives because a and b are weakly discernible. I think
  this claim is right, though not for the reason usually given. The relation ''lies
  exactly two metres from'' does hold between them, and it does so asymmetrically
  in the sense that a bears it to b while b does not bear it to itself. But more is
  available: a has the property of lying two metres from b, and b lacks that property,
  since what b has instead is the property of lying two metres from a. These are different
  properties — they have different relata in their definitions — so the spheres are
  not merely weakly but strongly discernible, on the definition given in the question.
  Weak discernibility is therefore not a special third category; it is just strong
  discernibility described from a distance. Once we see that, the two-sphere universe
  was never a counterexample to PII, since the two spheres were always discernible
  by relational properties.


  On (b), the rescue does not beg the question, because it appeals only to the distance
  relation, which the description of the universe grants us: the spheres are stipulated
  to be two metres apart, so the rescuer is using nothing that Black''s opponent is
  not already entitled to. Any objection that the rescuer has to have the two spheres
  in hand before applying the relation would prove too much, since the same objection
  would apply to Black''s own claim that there are two of them.


  On (c), the cube makes the situation even clearer. With the cube present, a is three
  metres from it and b is five, so a and b are strongly discernible without any appeal
  to the two-metre relation. This shows that the rescue does not depend on weak discernibility
  at all: it depends on there being something in the universe that the spheres are
  differently related to. But since the same holds in the original case — the spheres
  are differently related to one another — the modified universe adds nothing except
  a more convenient marker. It follows that any universe containing two objects contains
  some asymmetric feature, so the two-sphere universe cannot threaten PII; symmetry
  is never doing any real work, and Black''s example is best read as a case in which
  the stipulations were simply not carried out carefully."


