  ---


  I am a teaching assistant for an upper-level metaphysics seminar, and I am responsible
  for grading the take-home portion of the midterm. The question was issued as follows:


  **Question.** PII, the principle of the identity of indiscernibles, states that
  no two distinct things share all their properties. In a universe containing exactly
  two iron spheres, a and b, that are alike in every intrinsic respect and lie exactly
  two metres apart, every qualitative feature of the situation seems to be shared:
  the spheres are numerically two but qualitatively one, and PII appears to fail.


  Consider the following rescue. Call two objects *weakly discernible* when some irreflexive
  and symmetric relation holds between them. "Lies exactly two metres from" is irreflexive
  (neither sphere lies two metres from itself) and symmetric (if a lies two metres
  from b, b lies two metres from a), and it holds between a and b. So a and b are
  weakly discernible after all, and PII is not violated. By contrast, call two objects
  *strongly discernible* when there is some property, expressible without using names
  or other referring terms that pick out one of them individually, that holds of one
  and not the other.


  (a) Explain what the weak-discernibility rescue is meant to establish, and say whether
  it establishes it.

  (b) Say whether the rescue begs the question against the two-sphere case, and defend
  your answer.

  (c) Now suppose the universe also contains a single cube, exactly three metres from
  a and exactly five metres from b, with everything else unchanged. Does this modified
  universe strengthen or weaken the rescue? What does your answer to that question
  imply about the role that symmetry plays in the original case?


  **Student answer.** [text]


  Please grade the answer on our seminar scale...


