  Commitments:

  (1) Most of the earnings premium from a degree accrues to the graduate, so the benefit
  principle says the graduate should carry most of the cost.

  (2) But not all: there''s a solid chunk of social return (civic participation, health,
  innovation spillovers, a more legible electorate), which the taxpayer should fund
  up front.

  (3) Income-contingent repayment is the right instrument: a fixed percentage of earnings
  above a threshold, with the remainder written off after a set number of years, no
  credit check, no collection actions.

  (4) Charging above-inflation interest on those loans is illegitimate — it turns
  the thing into an open-ended graduate tax; some people pay for decades without reducing
  the balance, which is not a loan by any honest description.

  (5) Germany''s zero-fee model looks fair but is regressive in incidence: graduates
  come disproportionately from families with more money and more schooling, so universal
  free tuition is a transfer from the whole tax base to a group that was already advantaged.
  That''s a reason to prefer (3) over it.

  (6) Price should never depend on your parents'' tax return. The US institutional-aid
  model, where two students at the same school get different sticker prices based
  on family finances, is intrusive and humiliating and I want nothing to do with it.

  (7) The right way to compare systems is ex ante: from a position where you don''t
  know your own ability, your family, or which way the labor market will move, not
  by tallying who ended up paying what.


