  Actually a great angle: the UK/Australia HECS income-contingent loan design presupposes
  a view of education as a private good with a rate of return, plus a particular view
  of risk and of the person as a human-capital investor; whereas the German/Nordic
  abolition presupposes education as a public good / a right. And there''s an internal
  tension: ICLs are described as "not really a debt but a graduate contribution,"
  yet they''re marketed as loans; they''re repaid as a percentage above a threshold,
  forgiven at a set time, non-dischargeable in bankruptcy, and appear on credit files
  differently. Also there''s the tension: if you believe the returns to higher education
  are largely social (externalities), then charging the private beneficiary is incoherent;
  but the ICL design charges the private beneficiary while the state pays the residual
  — a "cost-sharing" view that presupposes the returns are largely private. Another
  tension: means-testing by income but not by wealth; the loan is repaid as a marginal
  tax, which means it functions as a graduate tax — yet it''s indexed like a debt
  (real interest in England, which makes some graduates never repay, becoming a pure
  marginal tax in perpetuity).


