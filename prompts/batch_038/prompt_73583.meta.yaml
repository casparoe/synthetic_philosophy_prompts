  For five years I have sat as a member of a panel hearing appeals against sanctions
  imposed on claimants of a means-tested unemployment benefit with an activity test.
  I have kept a record of my votes, and I now want to know what principle they add
  up to, whether it is defensible, and which of my verdicts I should give up. What
  follows is my own summary, not a transcript; the amounts and hours are illustrative
  but the patterns are real.


  1. A claimant declines a warehouse job because the required shift pattern would
  cost more in childcare than the job pays. Sanction wrong.

  2. A claimant with the same earnings profile declines a job identical in pay, hours
  and content to one they held for eight years and left voluntarily on good terms;
  the stated reason is that the work would be beneath them. Sanction right.

  3. A claimant declines a job assembling components for a weapons system they regard
  as immoral; the objection is sincere, long-standing, and would apply to any employer.
  Sanction wrong. But I would sanction a claimant who declines a job at a betting
  shop or a payday lender for the same sort of stated reason. I cannot articulate
  why these two feel different to me.

  4. A claimant fails to declare cash earnings of about £80 a week from babysitting
  for a neighbour, over four months. Fraud; sanction right; the overpayment is recoverable.
  But I hold this to be less blameworthy than case 5.

  5. A claimant makes a false statement about savings on the initial claim form, declaring
  £9,000 where the figure was £23,000. I hold this to be worse than case 4, though
  the sums are comparable and case 4 involved repeated concealment while case 5 involved
  a single statement. I concede that this ordering looks arbitrary.

  6. A claimant volunteers three days a week at a hospice for six months and turns
  down two interviews in that period. Sanction wrong: the activity requirement should
  be treated as met.

  7. A claimant spends comparable hours over a comparable period writing a novel and
  turns down the same two interviews; nobody outside the household can attest to the
  hours. Sanction right. What troubles me is that I would give the same answer even
  if I were persuaded the novel was excellent and the hours exactly as claimed.

  8. A claimant with a fluctuating and largely invisible condition fails a points-based
  capability assessment calibrated for stable impairments and is sanctioned for non-attendance.
  Sanction wrong; and yet I also think a properly designed assessment would find them
  capable of some work, and would then sanction them for refusing it. I am not sure
  those two beliefs can both stand.

  9. I think it legitimate to require a specified number of hours of unpaid work placement,
  and not legitimate to require thirty-five documented job applications a week, even
  though the second requirement is cheaper to administer and far easier to verify.

  10. A claimant with thirty years of contributions and one with none should, I think,
  receive different amounts for different durations; but I do not think the difference
  should affect the strictness of the activity test.

  11. An in-work claimant on a zero-hours contract turns down offered additional shifts
  because accepting them would forfeit their childcare place. Sanction wrong. I also
  think it objectionable that public funds top up wages of that kind, because the
  top-up lets employers pay less than they otherwise would. In case 1 I excused a
  refusal precisely because the wage did not cover the childcare the job required,
  so something here has to give.


  My working hypothesis is that what I am really tracking is legibility: whether a
  claimant''s activity leaves a trace a stranger could verify — a placement supervisor''s
  signature, a payslip, an employer''s refusal letter. Cases 6 and 7, 9, and the last
  part of 4 point that way. Cases 3 and 9 point against it, since in 3 sincerity rather
  than documentation seems decisive, and in 9 the more legible requirement is the
  one I reject.


  What I want from you:


  (a) State one or two candidate principles precisely enough to be applied by someone
  who has never met me, and tie each clause to the case or cases that motivate it.
  If legibility is a clause, say whether it does independent work or is a proxy for
  something else — evidence of sincerity, or a way of assigning the risk of self-deception.


  (b) Identify which of my verdicts no single principle can accommodate. Where the
