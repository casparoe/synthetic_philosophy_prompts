  Let me think about the unilateralist''s curse more carefully. The core structure:
  if a large group of agents each independently decide whether to undertake some risky
  action, and each is individually rational/optimistic, then the probability that
  at least one of them acts approaches 1 as the number of agents grows. So even if
  each agent''s decision procedure is sound (e.g., "act if my expected-value estimate
  is positive"), the aggregate outcome is bad, because estimates are noisy and errors
  are asymmetric — the max of noisy estimates is biased upward. The solution Bostrom
  proposes: a principle of deferred decisions / "the unilateralist principle": if
  any member of a relevant group thinks an action shouldn''t be taken, it shouldn''t
  be taken without a collective decision procedure (e.g., a vote, weighted by...).
  Also "the vulnerable world hypothesis."


  So a good "commitments" prompt could list a set of views about the unilateralist''s
  curse and ask for an audit. The tensions to embed:


  1. Commitment to "act on your own best estimate of expected value" (individual rationality/EA-style)
  + commitment to the unilateralist principle (don''t proceed if anyone credibly objects)
  — these can pull: if you must defer whenever a single dissenter objects, then your
  own judgment is no longer action-guiding; and the objection could come from someone
  whose estimates are also noisy in the *pessimistic* direction. Genuine tension:
  the asymmetry of error argument cuts both ways — if the max of noisy optimistic
  estimates is biased upward, the min (or the veto of the most pessimistic) is biased
  downward. So a consistent unilateralist principle would block everything, including
  obviously good actions. This is a real, non-obvious tension.


