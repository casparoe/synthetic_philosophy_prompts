  - Also: nobody in the room has done philosophy; a couple have heard of free will
  debates; the room will be hostile to metaphysics generally — "we don''t get paid
  to solve determinism." So an objection class will be: your metaphysical premise
  is doing no work / is unfalsifiable / you''re importing a contested premise into
