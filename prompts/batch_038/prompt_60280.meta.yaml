  your argument collapses; and: even if skepticism is true, we don''t need it — the
  policy can be justified pragmatically (the "why do you need the metaphysics" objection).
  And the reverse: compatibilist objection — Dennett''s line: punishment/sanction
  is not about inflicting what''s deserved but about supplying reasons to agents competent
  to respond to them; a policy that refuses to address agents as agents treats them
