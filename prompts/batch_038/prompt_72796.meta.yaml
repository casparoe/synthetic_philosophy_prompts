  Option A: Revealed preference + accuracy audit. The summary: a confident popularizer
  (maybe an economics journalist or a friend) says: "Samuelson''s revealed preference
  showed that utility is a fiction; preferences are defined by behavior, so there
  is nothing to introspect — if you choose the cake, you prefer the cake, full stop;
  and this means economists gave up on psychology entirely. Giffen goods etc." Subtle
  misrepresentations: conflation of revealed preference as an anti-mentalistic methodological
  thesis with the claim that all choice reveals preference (ignoring the need for
  the WARP/consistency axioms and the possibility of choice not being rationalizable);
  the "if you choose X you prefer X" gloss ignoring budget sets and the need for observable
  choices across varying price-income situations; the claim that revealed preference
  eliminated utility — actually Samuelson''s program was partly a failure (as commonly
  noted: the ordinalist program didn''t derive demand theory from behavior alone without
  assumptions like strong separability / integrability conditions — Houthakker''s
  SARA, the Sonnenschein–Mantel–Debreu results showing aggregate excess demand functions
  have almost no restrictions). Also conflating revealed preference with the "so what?"
  critique by Mongin? Actually there''s a well-known critique: Sen''s "Rational Fools"
  — committed vs. sympathetic choices, and choice that isn''t preference-revealing
  (e.g., the polite guest). Also the distinction between preference and choice in
  the "revealed preference as a substantive theory" vs "as a tautology" debate. Also
  Giffen goods: revealed preference doesn''t rule them out. Also the distinction between
  WARP and the stronger SARP/GARP needed for transitivity. Also Amartya Sen''s "internal
  consistency of choice" critique — consistency conditions can be satisfied by nonsense
  (the person who always chooses the leftmost apple). Also Hausman''s view.


