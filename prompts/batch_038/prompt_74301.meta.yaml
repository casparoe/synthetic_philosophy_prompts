  Draft:


  ---


  I''m a high school junior in a research seminar, and for my semester project I''ve
  been reading the methodology sections of the World Happiness Report, along with
  the FAQ where the editors answer objections. I''ve gotten stuck on a philosophical
  question that I can''t resolve on my own, and I''d like you to help me think it
  through carefully. Please write your answer in American English.


  Here''s the practice as I understand it. Each year the report ranks countries by
  the average response to a single survey question, the ladder item, in which respondents
  imagine a ladder numbered from 0 at the bottom to 10 at the top, with the top described
  as the best possible life for them personally and the bottom as the worst possible
  life for them personally. National scores are three-year averages of those responses.
  The editors explain that they deliberately avoid building a weighted index out of
  many indicators, on the grounds that a single question lets people apply their own
  standards about what matters, whatever their culture; and they explain that they
  prefer this "life evaluation" measure over measures of daily positive and negative
  emotion because evaluations vary more between countries and are better explained
  by life circumstances. In the same materials, though, the report elsewhere states
  that the ultimate good is the subjective well-being of people, with health, wealth,
  and relationships good only insofar as they help people feel good. And the report''s
  second chapter explains the ranking by regressing it on six variables — GDP per
  capita, social support, healthy life expectancy, freedom to make life choices, generosity,
  and perceptions of corruption — comparing each country to a hypothetical benchmark
  country made out of the worst value of each of those variables, which the report
  calls Dystopia, with whatever is left over shown as a residual.


  What I''d like from you is a reconstruction of the theory of well-being this whole
  arrangement presupposes...


  ---


  Then the specific asks:


  - What view of well-being must the practice assume for the ranking to mean what
  readers take it to mean? Is it a mental-state theory, a judgment theory, a desire-satisfaction
  theory, an objective-list theory, or a hybrid? The student notes the FAQ''s own
  statement of a mental-state theory, yet the measure is a reflective judgment about
  one''s life rather than a feeling — and the editors defend preferring the judgment
  over the feelings. Ask: does the practice actually require that the judgment tracks
  the feeling, or is it presupposing something else — e.g., that people''s considered
  evaluations are the best available evidence of well-being (an epistemic role) rather
  than constitutive of it (a metaphysical role)?

  - The self-anchoring point: because the top of the ladder is each respondent''s
  own best possible life, the endpoints of the scale differ from person to person.
  Ask what comparability assumption the ranking must then presuppose — that these
  person-relative judgments land on a common scale anyway — and whether that assumption
  is a claim about well-being or about psychology/scale use. And what follows if it
  fails in a particular direction: if development raises people''s sense of what the
  best possible life for them could be, a country could get richer, healthier, and
  freer and fall in the ranking. Is the practice committed to calling that a genuine
  decline in happiness, or can it treat it as an artifact? Which answer is available
  given the report''s own stated preference for evaluations precisely because they
  track circumstances?

  - Which rival views the practice quietly rules out: e.g., a view on which well-being
  can be assessed by experts from outside against objective criteria; a view on which
  well-being is non-aggregable or incommensurable across persons; a eudaimonist view
  on which well-being is activity of a certain kind rather than a state to be rated.
  Ask what would have to change — in the question wording, in the aggregation, in
  the ranking, in how governments would respond — if one of those views were substituted.

  - Also: distinguishing what the practice strictly presupposes from what it merely
  fits well with; and where it''s philosophically underdetermined (several theories
  would license exactly this practice).

  - The Dystopia/residual point: does treating the six variables as the explanation
  of evaluations, and calling the benchmark Dystopia, commit the report to those six
  being constitutive of well-being (an objective list), even while claiming the ladder
  avoids imposing an index? Or is the explanatory use innocuous (causes, not constituents)?
  Ask for a careful distinction between explanatory and constitutive roles, and note
  the FAQ says other goods are good because they help us feel good — instrumental.

  - Also the "should a country try to top the list" question is part of the domain;
  can fold in: what would a government have to believe about well-being for "improve
  your rank" to be a coherent policy goal — including whether the practice presupposes
  that well-being is a quantity to be maximized and that a government is the right
  agent to maximize it, and the incentive problem (if the measure is a judgment, a
  government can act on judgments rather than lives).

  - Say what I''d need to check / what would show my reconstruction is wrong? Maybe
  not needed; this type doesn''t require failure conditions. But a light "tell me
  where you''re speculating" could be good. Actually, avoid asking for citations;
  asking for "flag which parts of your reconstruction are your own inference rather
  than something the report states" is good and consistent.


