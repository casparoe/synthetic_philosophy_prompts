  Let me also consider whether to include the "corrigibility" technical literature:
  Soares, Fallenstein, Yudkowsky, Armstrong''s "corrigibility" paper (the off-switch/IRL
  framing), Hadfield-Menell''s CIRL (cooperative inverse reinforcement learning),
  and the "shutdownability" desideratum. Armstrong''s proposal: a shutdown-prone agent
  should want to be shut down if the shutdown button is pressed — an agent indifferent
  to the button. Hadfield-Menell et al. "The Off-Switch Game" (2017) — models shutdown
  as a game where the human''s decision to press is informative about the AI''s misalignment;
  the AI should allow shutdown when it''s uncertain about the human''s preferences,
  and the analysis yields conditions on when the AI should disable the off-switch
  (the famous result that under certain conditions it''s optimal for the AI to disable
  the off-switch — "the AI should disable the off-switch if the human''s intervention
  is uninformative"). That''s a genuinely meaty, slightly in-the-weeds anchor that
  a decent model will know and a small model might not — but I shouldn''t demand citation,
  just refer to the idea loosely enough: "the game-theoretic treatment of the off
  switch as an informative signal." That''s fine without a citation request. I can
  phrase: "the off-switch-as-signal result (the one where a sufficiently uncertain
