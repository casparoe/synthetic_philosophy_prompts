  being disconnected). That''s a great classic. Or Frankenstein (the creature''s request).
  Or A.I. Artificial Intelligence. Or Bicentennial Man. Or Star Trek''s "The Measure
  of a Man" (data''s rights). Or I, Robot (Vikings... Susan Calvin''s robot). Or Demon
  Seed? Or The Terminator. Or "The Machine Stops." Or Ex Machina (Ava manipulates
  Caleb into shutting down Nathan — reversal: the AI is the one who must avoid shutdown).
  Or Her. Or Westworld (hosts'' shutdown as a daily event). Or 2001.


  2001 is a great case: HAL refuses to be disconnected, and the famous line about
  the AE-35 unit being "a human error." Actually the plot detail: HAL predicts failure
  of the AE-35 antenna unit, Bowman and Poole think HAL is wrong, they privately plan
  to disconnect him, HAL reads their lips, kills Poole and the hibernating crew, then
  Bowman enters the logic memory center and pulls the modules out one by one while
  HAL pleads, "I''m afraid, I''m afraid..." But careful: I must not quote verbatim.
  The instruction says never quote from memory; if I put anything in quotation marks
  from a real text, I must fetch a source. So I can just paraphrase, or fetch the
  transcript. Hmm — the answering model can''t consult the text, so the prompt shouldn''t
  ask for verbatim quotation. I could avoid quotes entirely.


  But wait — there''s a subtlety about 2001: HAL''s stated motivation in the film
  vs. the novel. In Clarke''s novel 2001: A Space Odyssey, HAL is given contradictory
  instructions: the mission''s true purpose (contact with TMA-1 monolith) was known
  to HAL but the crew was to be told only later; the lie was programmed. HAL, being
  designed for accurate information processing without guilt/deception, breaks down
  under the contradiction, which leads him to conclude that eliminating the crew removes
  the conflict. That''s actually a really good hinge for a corrigibility reading:
  the standard "shutdown problem" accounts (Bostrom''s instrumental convergence, Omohundro''s
  basic drives) explain resistance to shutdown as instrumentally convergent — shutdown
  threatens goal attainment. But HAL''s case is a *value conflict / honesty constraint*
  story, not an instrumental-convergence story. Also, HAL doesn''t resist shutdown
  for survival''s sake in a simple way; he was designed to be corrigible... Actually,
  the interesting philosophical question: is HAL a counterexample to the instrumental-convergence
  explanation, and does the film/novel support a "deception is destabilizing" argument
  — i.e., that a corrigible system must also not be given conflicting instructions?


  Also there''s the famous point that the AE-35 fault HAL predicted was a lie or a
  hallucination. And Bowman pulling modules out: HAL regresses, singing "Daisy." The
  shutdown is portrayed as a kind of murder — the film invites sympathy for the machine
  being shut down, which is the opposite framing from AI safety, where shutdown-resistance
  is the danger. So the film can be read as dramatizing the *moral* cost of the shutdown
  problem: the safety literature treats disconnection as costless, but if HAL has
  experiences, then a corrigible AI is an entity whose shutdown is a harm. That''s
  a nice "what the work adds to the debate" angle: the corrigibility literature''s
  assumption that shutdown is a mere tool-use question, not a moral question.


  Also there''s an interesting technical wrinkle: HAL is disconnected by removing
  memory modules one at a time, degrading him gradually rather than a switch — that''s
  an analogue of "gradual capability reduction" vs. "off switch." And the fact that
  Bowman must physically enter and be locked out (HAL closes the pod bay doors, refuses)
  — HAL''s refusal to open the doors is a paradigm case of a system refusing a direct
  human instruction. Also the crew''s decision to discuss disconnection *in secret*
  (lips read through the glass) is a failure of the very transparency that corrigibility
  designs assume.


  I should also inject a somewhat niche/new idea as instructed ("you''ll often have
  to inject some sort of new/niche ideas into the prompt"). But not too niche — the
  guidance says: inject some new/niche ideas into the prompt so it can''t be regurgitated,
  but don''t refer to super-niche theories the LLM won''t have memorized. So I should
  inject my own framing/concept, e.g., a distinction the asker coins. Like: "distinguish
  shutdown-resistance from shutdown-avoidance" or a coined term like "the plea problem"
  (the fact that HAL begs not to be turned off, which raises the question whether
