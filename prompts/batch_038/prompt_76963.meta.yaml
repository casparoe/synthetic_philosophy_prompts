  Alternatively: modal realism + fiction. E.g., read everything in terms of Lewis''s
  plurality of worlds. Films: Sliding Doors, Run Lola Run, Groundhog Day, Everything
  Everywhere All at Once, The Butterfly Effect, Dark, Cloud Atlas, Mr. Nobody, The
  Man in the High Castle, The Garden of Forking Paths (Borges). Lewisian modal realism
  + Everything Everywhere All at Once — the multiverse there is more Everettian/travel-based.
  Or "Run Lola Run" — three actual replays. Lewis''s view: all worlds are equally
  real, and counterparts, not identities, populate them; the trans-world identity
  relation is a matter of similarity. That''s a great lens for a work with branches.
  Also Lewis''s "actual" is indexical like "here"/"now" — which is a specific technical
  claim: "actual" is an indexical term. A good prompt could ask whether a film treats
  actuality as indexical or as a metaphysical grade. And a niche injected idea: something
  about counterpart-theoretic de re modal claims in narrative — "which counterpart
  relation the film privileges" (the film''s editing choices pick out a similarity
  metric: the counterparts are matched by appearance/role, whereas Lewis says similarity
  relations are many and context-dependent). Nice: the film has to commit to a similarity
  metric in a way Lewis''s theory doesn''t. That''s a real, meaty point.


  Or peer disagreement + fiction: e.g., 12 Angry Men (a jury deliberation is a paradigm
  case of peer disagreement and conciliationism — but jurors aren''t peers exactly;
  there''s the "no deliberation would be rational if conciliationism were true" objection
