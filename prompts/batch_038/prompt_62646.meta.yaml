  Now, the philosophical questions to seed:

  - What theory of legitimacy does this presuppose? It says "we must pay competitively
  so people of the right calibre aren''t deterred" — that presupposes that governing
  talent is scarce, fungible with private-sector talent, and that the opportunity
  cost of public office is the relevant measure. It also presupposes that legitimacy
  is in part earned by competence delivered by the best available people.

  - But the national bonus ties pay to outcomes — GDP growth, median income — which
  presupposes that outcomes are attributable to the office-holder, and that the relevant
  currency of political success is aggregate economic performance. This is where "performance
  legitimacy" gets literalized into a pay formula. But: is the attribution claim coherent?
  A global recession is not the minister''s fault (and indeed they took pay cuts in
  2009) — so the formula presupposes a view of responsibility that includes outcome
  luck, i.e., moral luck, applied to a whole government.

  - The PM exception: no one can assess his performance, so he''s paid on outcomes
  only. That''s a fascinating presupposition — it admits there is no higher assessor,
  and it substitutes the world for the assessor. But then why not apply that to everyone?

  - The President: same monthly salary but no outcome-linked bonus because he doesn''t
  set policy. This presupposes a sharp separation between holding office/having standing
  and being causally responsible for outcomes — and it presupposes that pay tracks
  causal-authorship rather than status or burden.

  - The 40% discount "to reflect the ethos of sacrifice": this is an odd move — it
  simultaneously affirms market opportunity cost as the measure AND affirms that public
  service has a non-market ethos that should be visibly discounted. It''s a hedge
  between two theories of public office: office as a job (labor market) vs. office
  as a vocation/calling with internal goods. Does the discount crowd out public-service
  motivation? (Deci/Frey — crowding out — the model likely knows this.)

  - "Clean wage, no hidden perks": presupposes a transparency-based account of legitimacy
  — that what makes rule acceptable is that the compensation is visible and published,
  not that it is modest or consented to. Contrast with the classic republican worry
  that rulers who are paid a lot will pursue their own interest; contrast with the
  idea that public office should be unpaid or modestly paid so that only the virtuous
  serve (the Athenian practice of paying jurors by lottery — sortition; or the Roman
  cursus honorum being unpaid and requiring private wealth).

  - What rival views does it rule out? Descriptive representation (the ruler should
  resemble the ruled — Pitkin), the idea that legitimacy comes from procedure/consent/elections
  (it does have elections, but the salary argument is output-based), the egalitarian
  view that political pay above some multiple of median income is inherently illegitimate
  (the benchmark is literally tied to the top 1,000 earners — i.e., roughly the top
  0.05% of a workforce of ~2M+ citizens; so ministers are paid like the top of the
  distribution).

  - Underdetermination: the same formula is compatible with (a) a pure principal-agent/contractarian
  efficiency-wage theory (pay enough to deter corruption and attract talent — the
  "clean and honest government" rationale), (b) a desert/merit theory (they deserve
  the market rate for their scarce talent), (c) an incentive theory about accountability
  (the national bonus is a commitment device to make the government''s interests congruent
  with citizens'' welfare), (d) an expressive/symbolic theory (the published number
  is a signal to citizens and to talent). Do the details distinguish these? Actually
  yes partially: the 40% discount only makes sense on the expressive/ethos reading;
  the PM exception only makes sense on an incentive reading; the president''s exclusion
  only makes sense on the causal-responsibility reading.

