  rested on procedural consent, pay would be set by an independent body/ referendum/
  or pegged to the median worker (as some countries do — e.g., some jurisdictions
  peg MP pay to average wages or to a multiple of the minimum wage; there''s a "MP
  pay = median wage" proposal). If the currency of performance were something other
  than GDP — e.g., subjective well-being (Bhutan''s GNH; NZ''s Living Standards Framework
  / wellbeing budget) — the bonus indicators would change. If the theory of responsibility
  excluded outcome luck, pay would be fixed and independent of the world''s behavior,
  and instead evaluated on decisions/process quality.


