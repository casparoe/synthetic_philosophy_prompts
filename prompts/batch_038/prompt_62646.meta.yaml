  is fixed, and the other 35% is variable: a personal performance bonus decided by
  the PM (who consults senior ministers), plus a "national bonus" that''s computed
  from four equally-weighted macro indicators — real median income growth, real income
  growth of the bottom 20%, the unemployment rate, and real GDP growth. Two details
  I find weird. The PM himself gets no personal performance bonus, on the explicit
  reasoning that there''s nobody positioned to assess his performance, so instead
  he gets double the national bonus. And the President gets the same monthly salary
