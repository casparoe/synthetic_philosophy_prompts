  for what counts as an acceptable answer to each and how to detect that an officer
  has smuggled one into another (e.g., a concave utility curve used to express aversion
  to spread, or a downweighted probability used to express downside aversion).

  2. Converts the risk attitude into decision weights that a non-specialist can compute
  for a prospect with, say, four to six ranked outcomes. State the computation explicitly,
  in arithmetic terms, and say what shape restrictions the risk function must satisfy
  to avoid incoherence.

  3. Says what to do when probabilities cannot be quantified beyond ordering, and
  when the officers disagree about the ordering of outcomes rather than about likelihoods
  — and marks clearly which steps are matters of fact, which are matters of value
  that must go to the committee, and which are judgment calls dressed up as procedure.

  4. Confronts the standard objections head-on and tells me what my procedure is thereby
  committed to: that representation theorems for expected utility make risk-aversion
  about utility (as distinct from about money) a violation of axioms rather than a
  permissible preference; that non-expected-utility theories expose the agent to dynamic
  inconsistency and money pumps; and that a foundation making forty-five decisions
  a year arguably faces one large decision problem rather than forty-five small ones,
