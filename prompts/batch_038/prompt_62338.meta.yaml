  theory — the family of rank-dependent, risk-weighted expected utility theories associated
  with Lara Buchak''s Risk and Rationality — supplies the resources to separate three
  things my staff currently run together: (i) the concavity of the value of additional
  money or additional good, (ii) a systematic distortion of probability estimates
  (pessimism or optimism about likelihoods), and (iii) a genuine attitude toward the
  spread of a prospect''s outcomes over and above its mean. Only the third is a candidate
  for legitimate use in the recommendation, and even that is contested.


  Deliverable: a written decision procedure my program officers can run on any proposal
  in about an hour, with a spreadsheet, that:

