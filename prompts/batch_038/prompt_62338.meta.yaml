  policy obliges them to fund longshots that have a tiny probability of an enormous
  payoff and near-certainty of producing almost nothing. Others say it obliges them
  to fund programs that are very likely to produce modest good but carry a small chance
  of a severe, irreversible harm (loss of community trust, a death during a pilot,
  a legal liability that ends a partner organization). Both complaints get waved away
  as a failure of nerve, i.e., officers confusing risk-aversion with the diminishing
  marginal value of money.

