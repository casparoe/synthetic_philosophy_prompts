  "In the argument from illusion, we notice that a stick looks bent in water, and
  since what we are directly aware of really is bent, we must be aware of a sense-datum.
  Disjunctivists reply that this is a mistake: in the bent-stick case, nothing looks
  bent, because there is no such thing as looking bent; they hold that hallucinations
  and illusions have no positive phenomenal character at all, only a negative fact
  about their being indiscriminable from perceptions. That''s why disjunctivism is
  often called ''the argument from ignorance'': it explains the illusion cases away.
  Critics say this is refuted by the fact that a perfect hallucination is subjectively
  indistinguishable from a perception, so the two must share a mental state."


  Subtle errors: (1) claiming that in the illusion case "nothing looks bent" — disjunctivism
