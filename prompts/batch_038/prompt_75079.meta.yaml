  Confident facts:

  - Christopher Heath Wellman, "Immigration and Freedom of Association" (Ethics, 2008)
  and the book with Phillip Cole, Debating the Ethics of Immigration: Is There a Right
  to Exclude? (2011). Wellman''s argument: legitimate states have a right to self-determination,
  which includes freedom of association; just as individuals may choose their marriage
  partners and clubs may choose members, a legitimate state may choose its members,
  subject to the condition that it be legitimate (protecting the human rights of its
  constituents) and that exclusion doesn''t violate others'' rights (e.g., must admit
  refugees when it''s the only way to save them from human rights violations). Wellman
  also emphasizes that this is a "pro tanto"/prima facie right that can be outweighed.

  - Key objections: (a) the disanalogy — marriage is intimate and personal; state
  membership is not a personal relationship; (b) the argument proves too much: if
  freedom of association grounds exclusion, then sub-state groups (neighborhoods,
  cities, churches) would have the same right, but Wellman denies they do; he distinguishes
  via the state''s role in delivering political self-determination; (c) the "associative
  obligations"/ the argument would justify exclusion only if association is genuinely
  voluntary both ways — but immigrants don''t consent to be subject to state coercion,
  so exclusion isn''t needed for consent; (d) Oberman''s critique: Wellman''s freedom
  of association argument at best shows a right to exclude in limited circumstances;
  a right to freedom of association is compatible with being required to associate
  in some cases (e.g., you can be compelled to admit someone to a shop; anti-discrimination
  law limits freedom of association); and importantly, freedom of association is limited
  when it causes harm/threatens others'' interests.

  - Wellman does not argue that no basic liberty can be overridden by strangers''
  interests; he explicitly says the right to exclude is a pro tanto right that can
  be overridden by sufficiently weighty considerations, including duties to those
  in severe poverty, and he accepts some obligation to redistribute aid abroad rather
  than admit immigrants. He accepts that states must accept refugees when necessary.

  - Also, Wellman''s account is limited to legitimate states (those that protect human
  rights of their members) — so an apartheid state, or a state that''s not legitimate,
  has no such right. Wellman explicitly says a state that fails the legitimacy condition
  (e.g., one that doesn''t protect the human rights of all its constituents, like
  a white-minority regime) lacks the right.

  - Joseph Carens "Aliens and Citizens" (1987) — Rawlsian/nozickian argument for open
  borders; "the veil of ignorance" argument: if you didn''t know your birthplace you''d
  choose open borders. Carens''s later, more pragmatic, "realistic" turn.

  - Walzer: membership as the sphere of distributive justice; communities have the
  right to shape themselves but with limits (e.g., guest workers must be offered citizenship
  — the "little tyrants" argument: a state cannot permanently rule over resident non-members).

  - David Miller: national self-determination + cultural continuity; but with limits
  based on need.

  - Michael Blake: jurisdiction/coercion — the state''s coercive apparatus justifies
  excluding to protect existing members'' autonomy; but must admit refugees.

  - Sarah Song.

  - Chandran Kukathas: open borders libertarian.

  - Also: "the right to exclude vs. the right to expel" distinction.


