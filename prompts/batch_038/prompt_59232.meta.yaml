  Actually, careful: is the claim "AFE''s own arguments for probabilism and conditionalization
  are dominance arguments, not expected-value arguments" solid? Yes. The accuracy-dominance
  argument for probabilism: a non-probabilistic credence function is dominated by
  a probabilistic one — i.e., there''s an alternative that is strictly more accurate
  in every possible world. This is a dominance/sure-thing argument. The argument for
  conditionalization (Greaves & Wallace; Leitgeb & Pettigrew) is likewise a dominance
  argument over plans: the plan to conditionalize is not dominated, and other plans
  are dominated by it. So indeed, these arguments are dominance-based, and dominance-based
  arguments are insensitive to the agent''s own probability assignments except for
  which states get zero weight.


