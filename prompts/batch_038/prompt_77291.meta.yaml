  The case that started this is the argument between the two books on the same Hamburg
  police battalion — Browning''s study of Reserve Police Battalion 101 and Goldhagen''s
  rebuttal of it. One side says the men who did the shooting in Poland in 1942 were
  unremarkable middle-aged reservists who killed because of orders, peer pressure,
  and the difficulty of standing apart from your unit; the other says they killed
  because a murderous way of thinking about Jews had been baked into German culture
  long before Hitler, and that the killing was, in the main, voluntary.


  What struck me is not that they disagree — plenty of historians disagree — but that
  they seem to be working with the same documents and drawing the opposite lesson
  from every one of them, in a way that never leaves either book with anything it
  has to explain away.


  Instances:

  - The men''s own statements, taken decades later in the course of West German prosecutions,
  are the backbone of both accounts. When a man says he was appalled and asked to
  be excused, the first reading takes that as a sincere report of how the situation
  felt to him; the second takes it as the predictable self-defense of a man who, in
  the 1960s, had every reason to insist he was reluctant. The identical sentence serves
  both books.

  - The commander once told his men, before a massacre, that they could step out if
  they did not feel up to it, and a small handful of five hundred did; and one man
  in the record demanded release, got it, and was later promoted. For one author this
  is decisive: the exit was real and almost nobody took it, so something other than
  the freedom to refuse was holding them in place. For the other it is decisive in
  the opposite direction: refusal was available and unpunished — indeed rewarded in
  one case — so those who stayed were willing. No new document would settle which
  of these is right, because there is no document that could: any further case of
  a man refusing successfully would strengthen both readings at once.

