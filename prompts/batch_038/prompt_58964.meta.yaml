  So there''s a genuine internal tension: (2) says hold the past and laws fixed; but
  for the child who has no money, "had she sent ten dollars" is a counterfactual with
  a false presupposition / requires a miracle. Lewis''s own machinery says such counterfactuals
  are not to be evaluated with the same confidence, or they''re trivially true because
  the antecedent is impossible. And that''s a beautiful flaw: (6) assumes uniform
  applicability of the test to all eight billion, but for many of them the antecedent
  is nomically/historically impossible, so the counterfactual is either vacuous or
  its truth is not evidence of causal relevance. Also, a standard view: omissions
  require an opportunity or an obligation/expectation to act — you can''t omit what
  you can''t do.


  Also (8) is contestable: causation vs. causal contribution; and "being a cause"
  vs. "the cause"; Mill''s conditions/cause distinction; the fact that many causes
  of one effect doesn''t trivialize — a house fire has many causes (dry timber, no
  sprinkler, the spark) and that''s fine, so the inference from "many causes" to "absurd"
