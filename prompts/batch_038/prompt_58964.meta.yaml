  distinction in causal terms; what it costs is that it makes the distinction look
  morally decisive in the wrong way (it severs the causal link that grounding duties
  of rescue would need, or it makes letting die causally inert so that the duty can''t
  be grounded in preventing harm you''d otherwise cause... hmm).


