  Draft essay: "Two Kinds of Escape: What the Leveling-Down Objection Really Costs"


  **1. The set-up.** Parfit''s distinction: telic egalitarianism holds that it is
  intrinsically bad when some are worse off than others, so an equal outcome is in
  one respect better even if produced by taking from the better-off. Prioritarianism
  holds that the moral value of a benefit depends on how well off the recipient already
  is — benefits to the worse off matter more — without any reference to how the two
  levels compare. The difference is invisible in most cases; they diverge in "Divided
  World"-type cases and in leveling-down cases.


