  in is that I read that flies resolve motion in much finer slices of time than we
  do, which is why they are so hard to swat; if that means a fly has more separate
  moments per second than I do, it seems to me that a second of fly time contains
  more experience than a second of mine.

  - d: depth. How wide the range is, within a single moment, between the worst that
  moment can be and the best, again normalized so that an adult human = 1.0.


  The welfare weight of a creature per second of its life is then p × g × d, and I
