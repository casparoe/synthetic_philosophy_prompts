  has 2.4 children" is an error theory about average families... Hmm, Lewis''s actual
  reply: he says the objector is right that "in a sense" it isn''t Humphrey who wins,
  but that this is not a defect because the counterpart relation is what constitutes
  relevance; and he also notes that the same objection could be run against any account
  of representation. Also Lewis points out that the objection assumes haecceitistic
  identity is the paradigm. And Lewis concedes some force: the "Humphrey objection"
  makes counterpart theory less intuitive but not false. Also there''s the point that
  Lewis distinguishes between the ordinary meaning of modal claims (which is given
  by the analysis) — on Lewis''s descriptivist view of meaning, if the analysis is
  the best candidate for what our modal talk means, then our modal claims are true.
  There''s also the "problem of the many counterparts" issue and Chisholm''s paradox
  / the necessity of origin.


