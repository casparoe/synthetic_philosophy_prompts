  Hmm, that''s a decent false-presupposition prompt: it presupposes that the two views
  agree on the truth-makers (Kripke''s truth-maker for a de re modal claim is not
  "someone just like Humphrey" — it''s Humphrey himself, and crucially Kripke does
  not think transworld identity is settled by qualitative similarity; he thinks it''s
  stipulated, and he explicitly denies any qualitative criterion for transworld identity).
  So the false presupposition is: "both agree that the truth-maker is a situation
  in which someone just like Humphrey wins." That''s wrong — Kripke''s view is that
  the individual in the other world is numerically identical to Humphrey, not merely
  similar, and that similarity plays no role in the identification. Also, the analogy
  to the economists is bad because in Lewis''s case the two views can differ on truth-values
  of some claims (e.g., where the counterpart relation is many-many, "Humphrey might
  have been F and might have been G" does not entail "Humphrey might have been F and
  G"; and questions about necessary/contingent identity differ). Also Lewis would
  resist the characterization of worlds as places such that objects can''t be in two
  (that''s part of his view, yes — "worldmates" and the principle that a thing is
  worldbound). Actually, that IS Lewis''s argument: the "two worlds" argument — that
  since worlds are maximal and no two worlds overlap, nothing is in two worlds. So
  that part of the prompt is fine as Lewis''s motivation.


  But is the "purely verbal" framing well handled? A good answer: (1) Kripke and Lewis
  do NOT agree on truth-makers — Kripke''s is Humphrey simpliciter; (2) the disagreement
