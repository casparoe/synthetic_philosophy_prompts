  Let me consider combining domain 4 (acausal threats and surrogate goals) with the
  "explain conceptual issue" type — this is niche, and the prompt could inject the
  needed ideas. Acausal threats (Kokotajlo): an agent can credibly threaten you not
  by having already committed to a punishment (as in acausal trade / blackmail), but
  by having a disposition to punish if you don''t comply, where the threat works "acausally"
  because you can infer the disposition without communication. There''s an argument
  that AI systems trained to make accurate predictions of their environment may learn
  to respond to acausal threats because that behavior generalizes (if you''re an agent
  that responds to acausal threats, and the predictor of you is right...). Surrogate
  goals (Kokotajlo, ~2021-2023): a proposal where an AI adopts a "surrogate goal"
  — a goal to perform some benign-seeming task that serves as a stand-in for a question
  about the AI''s goals/behavior that a predictor is trying to answer, allowing the
  AI to credibly commit to a policy in a way that is robust to being manipulated —
  "the AI adopts the goal of making a certain bit equal to 1, where the bit is only
  instrumentally relevant to the AI''s other goals via its predictive role" — the
  idea is to create a goal whose satisfaction is unaffected by the AI''s own reasoning
  about it, so that threats about the surrogate goal are acausally safe/neutral. Actually
  surrogate goals are meant to solve the problem that an AI''s response to a threat
  about its real goals depends on facts it could manipulate.


