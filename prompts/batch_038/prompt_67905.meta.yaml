  Humphrey objection, and Lewis''s response (in *On the Plurality of Worlds*, §"The
  Problem of the Many"? no, §3.x "Counterpart Theory" / "Humphrey''s problem") is
  that the objection presupposes that a modal claim is true only if the very same
  thing has the property in another world, i.e., it assumes transworld identity as
  the only way to have de re representation; on the counterpart theorist''s account,
  "Humphrey might have won" is made true by a counterpart winning, and that''s what
