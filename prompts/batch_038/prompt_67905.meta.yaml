  ---


  "I''m trying to get straight on the Lewis–Kripke dispute about how ordinary objects
  exist across possible worlds, and one thing keeps tripping me up. Lewis''s whole
  motivation for counterpart theory is that he thinks transworld identity is impossible:
  nothing can literally exist in two worlds, because to exist is to be located in
  a world, and an object wholly present in two worlds would have to be in two places
  at once, in the same way a material object cannot be wholly present in two places
  in a single world. Given that, isn''t the disagreement purely verbal? Kripke is
  happy to say that Humphrey might have won in 1968 because Humphrey himself is there
  winning; Lewis says the same sentence is true because a counterpart of Humphrey
  wins there. But if both agree that the sentence is true, and both agree that the
  truth-maker is a situation in another world in which someone just like Humphrey
  wins, then the only difference is whether they are willing to call that someone
  ''Humphrey'' — a terminological preference, not a metaphysical one. So why does
  anyone treat this as a substantive dispute rather than as a notational variant,
  in the way that two economists who disagree about whether to count inflation as
  part of ''income'' are having a merely verbal dispute?"


