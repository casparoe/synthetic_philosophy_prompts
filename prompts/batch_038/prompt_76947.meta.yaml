  Premises:


  (1) If some experience is bad for the person having it, it''s bad in virtue of how
  it feels — nothing else about it can make it bad. (Call this phenomenal badness
  / hedonism.)

  (2) Pain is the paradigm of an experience that''s bad in virtue of how it feels.

  (3) Asymbolics (lesions in insula etc.) report feeling the pain — they localize
  it, name it, discriminate sharp from dull — but say it isn''t unpleasant; they don''t
  withdraw, don''t grimace, don''t mind it, and can hold their hand on a hot plate
  or laugh at pinpricks.

  (4) So there can be a felt pain that isn''t bad for the person feeling it.

  (5) Therefore the badness of pain isn''t a matter of the pain-feel at all; it must
  be a separate ingredient that can be present or absent alongside the feel.

  (6) The same goes for any unpleasant experience: itch, nausea, grief, tinnitus —
  in each there''s a feel and there''s the minding, and the minding is what carries
  the badness.

  (7) But the minding isn''t itself a feel; it''s a disposition/attitude (or: it''s
  a further feeling whose own badness would need its own minding).

  (8) So either nothing is bad in virtue of how it feels, or the regress of mindings
  never terminates in anything felt.

  (9) Either way, (1) is false: hedonism about badness is refuted by a lesion in the
  insular cortex.


  Where''s the flaw? Several options for the answerer:

  - (2)/(4): equivocation between "the pain-feel" (sensory-discriminative) and "how
  it feels" (phenomenal character overall). Step 5 assumes that because the sensory
  component can be present without badness, the badness isn''t part of the phenomenal
  character; but the asymbolic case equally supports the view that the pain-feel described
  by asymbolics *is* its whole phenomenal character, i.e., they lack the unpleasantness
  component, which is itself phenomenal. So (5) slides from "not in virtue of the
  sensory component" to "not in virtue of any feel."

  - The regress in (7)-(8): it assumes the minding must be a non-phenomenal attitude;
  imperativists/evaluativists say the unpleasantness is a phenomenal state with command/evaluative
  content — it is a feel, and it''s bad in virtue of being that feel. So the regress
  is optional.

  - (3): whether asymbolics really feel pain; maybe it''s an agnosia/disconnection
  such that their introspective reports are unreliable, or maybe they do find it unpleasant
  but their valuation/motivation is disconnected (Berthier et al. emphasize preserved
  response to threat gestures — so not general apathy). Also: patients do learn to
  avoid pain when told it''s harmful, and some reports say asymbolics describe the
  pain as unpleasant but are indifferent — the "unpleasant but not minded" reading,
  which would make (4) false in the sense that it''s still bad but not motivationally
  salient.

  - (6): generalizing from pain to grief/tinnitus, where the "minding" is constitutive.

  - Also a scope issue: (4) shows badness is *not intrinsic to the sensory component*,
  i.e., a claim about *which part* of experience carries badness, not that badness
  is non-phenomenal.


