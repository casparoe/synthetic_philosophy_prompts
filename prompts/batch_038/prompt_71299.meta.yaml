  I cover neuroscience and the adjacent philosophical territory for a general-interest
  magazine, and I have spent the better part of a year reporting on pain — a multidisciplinary
  clinic, a rehabilitation ward, two families living with rare sensory neuropathies.
  My editor has commissioned a companion piece, shorter and more argumentative, on
  a question my reporting kept colliding with: what exactly makes pain bad for the
  person who feels it? I have no training in philosophy, but I have accumulated a
  set of verdicts from the cases I reported on, and I would like to know whether they
  hang together into a principle, or whether some of them will have to be sacrificed.
  I should say at the outset that I am not after a tour of the literature or a list
  of positions and their proponents; I need the reasoning itself, worked through,
  in prose I could adapt for readers who have never thought about this.


  Here are my verdicts. (1) A woman whose stroke damaged part of the insula reports
  pain accurately — she localises the pinprick, calls it sharp, rates it high — but
  says it "doesn''t bother her," does not withdraw or guard the area afterwards, and
  laughs while describing it. I think she is not suffering anything like the harm
  I would suffer; yet I am unwilling to say her pain is no bad thing at all. It seems
  to me a small loss, closer to losing the taste of food while keeping its nutrition
  than to losing nothing. (2) A girl born unable to feel pain has bitten through the
  tip of her own tongue, scorched her palms, sustained fractures she never noticed,
  and picked up corneal infections from scratches she could not feel; her life expectancy
  is shortened, and her family is weighing having some of her teeth removed. I think
  this is a grave harm — and the striking thing is that the harm consists in the absence
  of pains she has never felt. Whatever I say about case 1 has to explain why the
  same kind of sensation, when it is missing altogether, is a catastrophe. (3) A post-operative
  patient on opioids rates his pain seven out of ten and declines further analgesia
  because, he says, it isn''t troubling him. I would leave him alone: the number alone
  does not seem to me a reason to intervene. And yet if I were shown two patients
  alike in every other respect, one at seven and unbothered, one at two and unbothered,
  I would say the first is somewhat worse off. I hold that ordering without any inclination
  to act on it. (4) Chosen pains — the tattoo, the marathon, the first stage of labour
  — seem to me bad moment by moment and yet not bad for the person overall, and not
  something the person is wronged by. So my account needs to say whether badness at
