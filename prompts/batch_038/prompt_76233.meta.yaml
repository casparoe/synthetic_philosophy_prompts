  For about six years I''ve been going to a Thursday-evening history circle at our
  public library. It''s run by a woman in her late seventies — I''ll call her Ruth
  — who taught high school social studies for thirty years and has no patience for
  either optimism or despair. The group''s standing argument, which we come back to
  every few months, is whether there is any sense in which history moves toward justice,
  or whether that''s just something the winning side says afterward. Ruth has strong
  and specific views, and over the years I''ve been keeping a private list of the
  verdicts she hands down on particular episodes, because I''ve become convinced she
  is applying a rule she has never stated, and possibly never spelled out for herself.


  Here is the list, as near to her own framing as I can render it:


  1. On the emancipation of enslaved people in the British Empire in the 1830s: evidence
  that the arc bends. When a member objected that the government borrowed twenty million
  pounds to compensate the enslavers, that the freed people were held in an "apprenticeship"
  for several more years, and that the whole thing was therefore a business transaction
  rather than a moral event, she said the payment was disgraceful but beside the point:
  the law had been changed in a way that could not be quietly un-changed, and that
  was the difference between a mood and a fact.


  2. On the Black Death in England: not evidence of anything. Wages rose, serfdom
  loosened, and ordinary laborers did better for a generation — she grants all of
  it — but she calls it a windfall from a catastrophe that nobody aimed at, and she
  points out that the same landlords tried within a few years to legislate wages back
  down and tax the peasants into revolt. Her line, roughly: an accident is not a direction.


  3. On Reconstruction in the United States: evidence against, or at least evidence
  that whatever there is can run backward. She grants that freed people built schools,
  voted, and held office, and that this was their own doing; she says it still doesn''t
  count for the arc, because it was undone within a decade and stayed undone for nearly
  a century.


  4. On the decline of wife-beating and of the husband''s legal right to "chastise"
  it: she treats the change in ordinary attitudes as real and as good, but she refuses
  to bank it. What isn''t written down, she says, can be talked back out of people
  in a bad decade.


  5. On the American civil rights statutes of the mid-1960s: evidence for. She emphasizes
  the organizing, the decades of it, and the fact that the change was pinned into
  law by people who meant to do it.


  6. On the aftermath of the Second World War — the United Nations, the war-crimes
  tribunals, the human-rights declaration that followed: she counts the institutions
  as evidence for, but she will not let anyone put the firebombing of cities in the
  same column. Asked whether sixty million dead can be part of an argument that things
  improve, she said the dead are not premises.


  7. On the collapse of the Soviet bloc in 1989: she is surprisingly cool. She says
  mostly good came of it, but she keeps asking what it was built out of and whether
  it holds, and she has not, in six years, given a straight answer.


  Now the case I want to put to you. My brother works for a regional development bank,
  and last year he described to me a country I''ll leave unnamed — the details are
  what matter, not the name. Forty-odd years ago it was a military dictatorship facing
