  I am a novelist, and the third act of the book I am writing turns on a document
  that does not exist. Two of my characters have spent nine years attacking each other
  in print, and a certification authority — invented, but I need its product to be
  real — has compelled them to sit down and issue a joint statement on a question
  that has no settled answer anywhere: how much assurance a deployed AI system must
  carry before it may be put in front of people who cannot withdraw from it.


  I would like you to write the statement. Not an outline of one, and not a description
  of what such a document would contain; the artifact itself, complete enough that
  I could set it as an epigraph or print it as an appendix and have a reader in the
  field tell me I got it right.


  The characters. Ilse Brandt proves things. Her position is that an argument whose
  force depends on the environment''s continued cooperation is not an argument about
  the future but a summary of the past, and that the distance between a system''s
  measured behavior and its behavior under conditions nobody sampled is precisely
  where catastrophic failure lives; she does not claim that worst-case guarantees
  are presently attainable for large learned systems, and she does not think proofs
  are cheap — she thinks a deployment made without one is running on credit that someone
  else will collect. Amos Reyes evaluates things. His position is that every guarantee
  of every strength rests on assumptions whose only warrant is empirical and revisable;
  that a theorem concerning a model class is silent about the artifact in the rack,
  which belongs to no class anyone can characterize; and that conditioning deployment
  on worst-case assurance is not a neutral rule but a filter that favors systems simple
  enough to be certified over systems that are actually least dangerous. He holds
  that the honest unit of assurance is a maintained, adversarially probed record of
  what a system has been made to do.


