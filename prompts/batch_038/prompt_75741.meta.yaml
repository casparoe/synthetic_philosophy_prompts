  ---


  Last night a friend and I spent four hours on transformative experience and ended
  up somewhere neither of us intended. She is not a specialist, which may be why she
  reached for the blunt version; I have since written her argument out as carefully
  as I can, and although the conclusion struck me as unacceptable at the time, I now
  think the reasoning may be sound and my objection merely a matter of taste. I would
  like an adjudication.


  Her argument, reconstructed:


  1. On Paul''s account, some experiences are epistemically transformative: you cannot
  know what they are like for you until you have had them.

  2. Rational choice among options requires that you can assess what each outcome
  would be like for you, since that assessment is what supplies the utilities.

  3. So where an option''s outcome is an epistemically transformative experience,
  you cannot rationally choose on the basis of expected outcomes.

  4. But every option whose outcome includes an experience you have not had is in
  that position: a first child, a first war, a first bereavement you did not expect,
  an emigration, a conversion, a diagnosis, even a first taste of something or a first
  night in a strange city. Novelty is a matter of degree, and nothing marks out a
  principled cutoff.

  5. So outcome-based rational choice fails across a very wide range of ordinary decisions
  — arguably most of the ones that matter.

  6. If that were so, we would expect to see it: agents confronting these choices
  would either stall or admit that they were leaping.

  7. Instead they deliberate fluently, cite considerations, change their minds for
  reasons, and afterward report that the deliberation tracked something — parents
  who agonized and then were glad, converts who tested a faith before committing.

  8. A theory of choice that declares a great deal of successful deliberation impossible
  is not a deep theory; it is a false one.

  9. Hence either (2) is wrong, or (1) applies to far fewer cases than Paul''s own
  examples suggest — and either way the framework identifies no distinctive problem.


  Two moves of my own got the argument this far, and I want them examined too. When
  I objected at (4) — that tasting a durian is not on all fours with becoming a parent
  — she asked me for a criterion, and the best I produced was what I have been calling
  the discordance test: an experience is transformative for you just in case competent,
  sincere, and articulate people who have had it disagree radically about what it
  was like. She answered that the test is guaranteed to misfire in exactly the cases
  that matter, because testimony about a transformative experience comes from someone
  the experience has already remade; the reporter is not the person who faced the
  choice, so their report cannot tell you what the choice would have been like from
  where you now stand. Discordance is then not evidence of transformation but of the
  reporter having changed, and agreement would be equally uninformative. I had nothing
  to say to that at 2 a.m.


  Her argument troubles me for a reason I cannot quite state: (5) feels right when
  I read it and absurd when I try to act on it. Tell me which step you would reject,
  why it looked innocent going in, and what the rejection costs — including whether
  Paul can consistently bite the bullet at (7) and simply concede that most weighty
