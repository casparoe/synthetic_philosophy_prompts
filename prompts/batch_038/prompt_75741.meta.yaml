  discordance test can be repaired against her objection, or whether her objection,
  if it stands, also disposes of the more modest claim that some experiences are transformative
  while others are merely new.


  For what it is worth, I would rather lose (4) than (7); and if (8) has to go, I
  want to know what would be left of the ordinary complaint that a theory should be
  answerable to how people actually deliberate.


