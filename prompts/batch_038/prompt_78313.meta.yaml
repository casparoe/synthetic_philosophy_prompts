  I am a third-year PhD student in philosophy of science. My dissertation concerns
  how traits are individuated in evolutionary explanation, so I work adjacent to the
  function literature rather than inside it; I am comfortable with both of the main
  accounts — the historical one, on which the function of a trait is what its ancestors
  were selected for, and the systems one, on which it is the contribution the trait
  currently makes to some capacity of the containing organism. What I cannot find,
  and what I need in order to finish a section of a paper, is a term for a dialectical
  pattern in the way the debate between the two is carried on. I am describing the
  pattern below as precisely as I can, deliberately avoiding vocabulary that might
  prejudge whether it has a name.


  The pattern has three components, and I have seen all three in the same seminar
  more than once.


  First, each account is invoked in exactly those cases where it yields the intuitive
  verdict. When someone wants to say that the current use of a structure recruited
  long after it first spread is nonetheless its function — flight for feathers, say
  — they argue in terms of present contribution to a containing system; when the same
  person is pressed with the familiar complaint that a present-contribution analysis
  makes far too much count as functional, since it would list the noise the heart
  makes among the heart''s functions, they reply that of course the analysis in question
  is the historical one. And symmetrically in the other direction: a structure that
  no longer does what it was selected to do is said to have no function when the historical
  account would deliver the counterintuitive verdict, and to have one when it does
  not.


  Second, the two accounts are essentially never applied to one and the same trait,
  in one and the same argument, with the resulting conflict stated and then adjudicated.
  When the conflict is stated, the response is that the word is ambiguous between
  two legitimate senses and that the case simply fails to disambiguate — after which
