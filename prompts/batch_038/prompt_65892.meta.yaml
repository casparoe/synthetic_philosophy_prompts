  Move 1 (Mira): The Frege-Geach problem is just the compositionality problem in disguise.
  Moral sentences appear unembedded and embedded, in the antecedent of conditionals
  and under negation; nobody asserts "lying is wrong" when they assert "if lying is
  wrong, then getting your brother to lie is wrong." So expressivism, which identifies
  the content of a moral sentence with a non-cognitive attitude, can''t say what the
  antecedent contributes — because you can''t entertain an attitude without holding
  it. That''s the problem, and it''s a semantic problem: it says expressivist sentences
  lack the kind of content that composes.


  Move 2 (Dev): That''s the wrong diagnosis, or at least only half of it. Even if
  you hand the expressivist a compositional semantics (Schroeder does roughly this
  — every normative judgment is a "being for" relation to a content, and the same
  relational element shows up in complex sentences), the harder problem remains: what
  does the whole conditional express, and why is it that accepting the conditional
  plus the antecedent and rejecting the consequent is a *mistake* rather than just
  an unusual combination of attitudes? Blackburn''s answer — a higher-order attitude
  of disapproval toward that combination — doesn''t explain the mistake; it just reports
  that we disapprove. And crucially, the disapproval is itself a moral attitude about...
  what exactly? It can''t be about the truth of the sentences, because there aren''t
  truths on this view, so it''s about attitude-combinations, which is not the same
  thing as invalid inference. So the problem is about the *normativity of inference*,
  not about composition.


  Move 3 (Mira): But then the problem is unsolvable for anybody, not just expressivists?
  Realists also need to explain why modus ponens is valid; they say it''s because
  of the truth-conditions, i.e. because it''s impossible for the premises to be true
  and conclusion false. The expressivist''s counterpart is that it''s impossible to
  hold that combination of attitudes without a higher-order condemnation. If you demand
  an explanation of the wrongness of the inference that isn''t just "the attitudes
  don''t fit together," you''re demanding an explanation of logical validity in general,
  which is not the expressivist''s special burden.


  Move 4 (Dev): No — the asymmetry is that the realist has an independent handle on
  impossibility (truth-preservation, a notion shared with all other declaratives),
  whereas the expressivist''s attitudes are sui generis and the "fitting together"
  relation is stipulated. Also: quasi-realism''s deflationist escape ("moral sentences
  are truth-apt; ''lying is wrong'' is true iff lying is wrong; so we get all the
  logic for free") has a cost — once you have a disquotational truth predicate that
  behaves exactly like the realist''s, and you''re willing to say moral sentences
  are true, that they can be known, that there are moral facts, what is left of expressivism?
  The only distinctive claim is the account of what judging consists in. And that''s
  not a semantic theory anymore; the Frege-Geach problem was supposed to be a problem
  *for the semantics*, and quasi-realism solves it by giving up on being a semantic
  thesis. So it''s either unsolved or dissolved, and "dissolved" means the view has
  changed subject.


  Move 5 (Mira): Changing subject is exactly what a semantic theory is allowed to
  do if the old subject was incoherent... hmm, better: Mira says the deflationary
  move isn''t a retreat; it''s a discovery that the realist and the expressivist *agree*
  on the semantic facts (both accept the same disquotational schema, both say moral
  claims can be true) and disagree only about the metaphysics/psychology of judgment.
  So Frege-Geach was never a problem about truth-aptness at all; it was a problem
  about whether the expressivist can account for the content of embedded occurrences,
  and once you have a compositional semantics with a truth predicate that composes
  too, the problem is closed. Anything further — the "what is judging?" question —
  is a general problem in philosophy of mind, and realists have it too (what is believing
  that lying is wrong, on a realist view, other than a disposition to assent?).


  Move 6 (Dev): Realists don''t have it in the same way, because for them the answer
  is "tracking a fact," and facts are what make sentences true; the expressivist can''t
  say the attitude is tracking anything, so their only answer is to redescribe the
  attitude in more and more belief-like language, until "judging that lying is wrong"
  and "believing that lying is wrong" are the same state — at which point expressivism
  has become realism with an embarrassed disclaimer. Also, a technical point: the
  higher-order attitude account doesn''t generalize. It handles "if lying is wrong,
  then getting your brother to lie is wrong" by an attitude toward combinations, but
  what about embedded occurrences under *negation* of a conditional, or in a disjunction
  with a descriptive sentence ("Either lying is wrong or the bus is late"), or under
  "John believes that lying is wrong"? For each you need a fresh higher-order attitude;
  there''s no systematic rule. And if the rule is "construct whatever higher-order
  attitude you need to condemn the combination," that''s not an explanation, it''s
  a license.


