  I audit a metaethics reading group at my university — I''m actually in linguistics,
  so a lot of it goes over my head, but last week two of the regulars, Mira and Dev,
  got into an argument about the Frege-Geach problem that I could follow better than
  most and still can''t adjudicate. It ran something like this. Mira opened by saying
  the whole problem is just compositionality wearing a disguise: a moral sentence
  shows up both on its own and embedded — someone wrote "if lying is wrong, then getting
  your little brother to lie is wrong" on the board — and when you assert the conditional
  you are not asserting that lying is wrong, so if the meaning of "lying is wrong"
  just is the attitude of disapproval, there''s nothing for the embedded occurrence
  to contribute. Dev said that''s half the problem at best. Hand the expressivist
  a compositional semantics — Schroeder''s move, where every normative judgment is
  one and the same relational attitude toward different contents, so complex sentences
  inherit compositionality from the recurring relational element — and you still haven''t
  answered the harder question: why is it a mistake, and not just an eccentric combination,
  to accept the conditional, accept the antecedent, and deny the consequent? Blackburn''s
  answer, a higher-order attitude of disapproval toward exactly that combination,
  doesn''t explain the mistake, Dev said; it just reports that we dislike it, and
  since on this view there are no truths for the inference to preserve, the disapproval
  can''t be about the sentences being true, so it isn''t about validity at all.


  Mira''s reply was that Dev was turning a local problem into a global one. Realists
  also have to explain why modus ponens works, and their explanation is that the premises
  can''t be true while the conclusion is false; the expressivist''s counterpart is
  that you can''t hold that trio of attitudes without incurring the higher-order condemnation.
  If you insist on something more, you''re asking for an account of logical validity
  in general, which is nobody''s special burden. Dev said the asymmetry is real: the
