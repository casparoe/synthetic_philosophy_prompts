  of music''s content and its affective power must deliver to count as adequate.


  Anchor it in the claims Schopenhauer actually makes, which I''ll summarize rather
  than quote: music is not, like the other arts, a copy of the Ideas but a copy of
  the will itself; the bass stands for the crudest, unorganized mass of nature, the
  middle voices for the plant and animal grades of the will''s objectification, and
  the freely developing leading melody for the intellectual life of a human being;
  a melody''s constant departures from and returns to the tonic figure the will''s
  striving, satisfaction, and renewed striving; delayed and hardly-won satisfaction
  is what makes slow, discord-struck melodies sad; and because music expresses only
  the quintessence of events and never the events themselves, the same music can serve
  as commentary on any scene.


  For each desideratum give (i) the case or phenomenon that motivates it, (ii) whether
  it is genuinely non-negotiable or is a partisan commitment of one camp, and (iii)
  whether an expectation-based naturalistic account and a Schopenhauerian metaphysical
