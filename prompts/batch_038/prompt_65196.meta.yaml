  Careful version: Raters coded transcripts for content — explicit acknowledgment
  of the harm, of the victim''s experience, of responsibility. Call this "acknowledgment
  content." Nadia''s remorse ratings correlate with fluency/composure/idiom-familiarity,
  and only weakly with acknowledgment content. Two readings:

