  I think the Dennett two-bitser / derived intentionality domain is good. I know this
  well. Dennett''s "Original Intentionality" (1990, in "A Theory of Sentiment" — actually
  it''s an essay in Dennett''s work, and reprinted in "Brainchildren"). The two-bitser:
  a device with a two-bit state that can be read as heads/tails or as black/white
  — a single physical state has multiple, equally valid interpretations, derived from
  the designer/user''s assignment. Dennett uses this against Searle''s Chinese Room:
  syntax is observer-relative, so the argument that computation is purely syntactic
  presupposes an interpreter — i.e., Searle''s argument, if it works, works against
  computation itself; the syntax/semantics distinction collapses because you can always
  re-interpret a physical state as a different symbol. So Searle''s point that "syntax
  is not sufficient for semantics" backfires: if syntax alone can''t determine semantics,
  then nothing a computer does is intrinsically syntactic either.


  Dennett''s claim: intentionality is all derived; there''s no such thing as original
  intentionality. Original vs derived is a difference in perspective/pragmatics, not
  in kind. "Intrinsic" intentionality is an illusion — we attribute it to ourselves
  because we''re so close up.


