  additional stone can never make one''s position worse. The memo transfers the schema
  directly to the AI race. Suppose some reckless, fast-moving developer had a plan
  that led to success. A larger, better-resourced, better-informed coalition that
  wanted to proceed carefully could simply execute that very plan and then layer its
  own safety measures on top — precautions being analogous to the extra stone, hence
  never to one''s detriment. The memo concludes that racing therefore confers no decisive
  advantage: the eventual winner will be whoever commands the most resources and information,
  careful actors cannot be structurally penalised for their care, and strong international
  regulation of AI development is unnecessary, since the race resolves in favour of
  the big and cautious by construction rather than by luck.


