  Option B: German Aviation Security Act 2006 ruling.

  The episode: after 9/11, Germany passed the Luftsicherheitsgesetz (Jan 2005), §14(3)
  permitted the armed forces to shoot down a hijacked aircraft if it was to be used
  against human life. In Feb 2006 the Federal Constitutional Court declared it unconstitutional
  — incompatible with Art. 1(1) (human dignity) in conjunction with Art. 2(2) (right
  to life), because killing innocent passengers would treat them as mere objects (Objektformel
  — the "object formula" from the 1957 Elfes/Lüth lineage, actually from the 1954
  Investitionsbeihilfe case / 1957 Elfes). Also because there was no legal basis for
  deploying the military domestically. Key facts: the Court said the passengers, as
  victims, would be used as a means to save others, denying their dignity; and also
  that the state cannot weigh life against life — "human life is not capable of being
  weighed" (Menschenleben gegen Menschenleben). Also relevant: the Court''s reasoning
  that in such a scenario the passengers'' right to life is violated even though they''d
  die anyway — a striking point (the "they''d die anyway" objection). Then the 2017
  Ethics Commission on Automated Driving (chaired by Udo Di Fabio) issued 20 rules
  which explicitly transplanted this: in unavoidable accidents, no distinction by
  personal features; no offsetting of victims; and the rule that human life must not
  be balanced against other legal interests. Then the 2018 Moral Machine experiment
  found people''s actual preferences are strongly utilitarian and demographically
  patterned (favoring young over old, humans over pets, more lives over fewer, lawful
  over jaywalking, higher status... etc.).


  This is a superb case for "should AI systems reason as utilitarians or deontologists?"
  — because it''s a real instance where a legal system *decided* the deontological
