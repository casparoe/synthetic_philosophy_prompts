  I am a doctoral candidate in philosophy, and this term I am teaching a section of
  an upper-level undergraduate seminar in political economy — 22 students, one 110-minute
  meeting, a room with movable tables, two whiteboards, and no permission to use laptops
  or phones during the session. The students have read Mises''s original impossibility
  argument, Lange''s trial-and-error proposal for a central board setting parametric
  prices, and Hayek''s reply that the decisive knowledge is dispersed, local, and
  frequently unstatable. On paper they follow all three. In discussion, however, two
  things go wrong. First, they collapse the debate into the historical record: several
  have said some version of "the USSR failed, so Hayek won," and they cannot see that
  what was tested there was not Lange''s scheme. Second, they run together three distinct
  complaints — that rational calculation is impossible without genuine prices for
  capital goods, that the required knowledge cannot be collected, and that even if
  it could be collected, agents would misreport it. I want an activity that forces
  these apart by making them live through each one separately.


  Please design a playable exercise, with these constraints:


  1. Present it to the students as an operations or logistics exercise; do not announce
  that it is the calculation debate until the debrief.

  2. Give me a concrete toy economy — three or four goods, a small input-output table,
  and initial endowments — with numbers I can write on a whiteboard and that students
  can work out by hand in a few minutes. Please check the arithmetic yourself and
  confirm that a first-best allocation exists and is identifiable given full information.
  This matters: I want to be able to tell a skeptical student that the game does not
  build Mises''s impossibility into its rules, so that whatever goes wrong goes wrong
  for epistemic or practical reasons.

  3. Sort the students into a planning board, a set of production units, and consumers,
  and give at least some participants private local information that is genuinely
  theirs — including a class of "hunch" items that a participant can act on but cannot
  state in the numbers the board is allowed to receive. All upward communication must
  go through a physically constrained channel: fixed-size slips, one collection per
  round, no talking across teams.

  4. Run at least three rounds that differ only in the coordination mechanism — direct
  quantitative reporting, a Lange-style parametric price iteration in which the board
  posts prices and units respond, and a round in which a local shock is delivered
  mid-round to a single participant. Keep a running score in points, not money, and
  tell me exactly how points are earned and lost.

  5. Design it so the planning team can win. Specify the play patterns under which
  central coordination beats the price rounds, and do not stack the rules against
  them; a demonstration whose outcome I have guaranteed in advance will not persuade
  anyone in that room.


  Then give me a minute-by-minute timeline, a debrief that maps specific moments of
  play onto the calculation/knowledge/incentive distinction and onto the difference
  between equilibrium prices as a datum and the market as a discovery process, and
  the questions I should ask rather than the points I should assert. Tell me what
  predictably goes wrong the first time this is run — including what happens if the
  board is unusually competent, and what I should say if it wins outright. Finally,
