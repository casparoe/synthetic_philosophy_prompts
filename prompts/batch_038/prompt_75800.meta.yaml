  1. The analogy, stated precisely (~200 words). Re-express both theories in a common
  vocabulary — an idealization function, an input, an output, and a use to which the
  output is put — so that the comparison and the differences can be stated without
  rhetoric.


  2. Correspondence table (~100 words plus the table). One row per element of Firth''s
  ideal observer (omniscience about nonmoral facts, omnipercipience, disinterestedness,
  dispassionateness, consistency, the normalcy proviso) against whatever in CEV is
  supposed to play its role, including where the honest entry is "nothing" or "no
  counterpart."


  3. Load-bearing disanalogies (~600 words). The differences that actually threaten
  my transfer of objections, ranked by how much damage they do. For each, say what
  my chapter would have to add in order to survive it.


