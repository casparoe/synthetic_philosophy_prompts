  Draft:


  ---


  I am a fourth-year PhD student in philosophy working at the intersection of metaethics
  and the theory of AI value learning. A chapter of my dissertation argues that coherent
  extrapolated volition (CEV) is not a novel proposal but a re-engineering of Roderick
  Firth''s ideal observer theory: the same move from actual human responses to the
  responses of an idealized agent, with the idealization performed by a machine rather
  than by the moral theorist''s stipulation. My committee pushed back hard on this,
  saying the analogy is backwards. I would like a careful audit before I revise.


  Let me state both sides as I have them.


  Firth''s ideal observer (1952) is stipulated to be omniscient about nonmoral facts,
  omnipercipient (able to vividly imagine any experience from the inside), disinterested,
  dispassionate, consistent, and otherwise an entirely normal human being; an ethical
  claim is then analyzed as a claim about what such an observer would approve of.
  Note the last clause: the idealizations are a short, closed list, and everything
  else about the observer is deliberately left at the human baseline.


  CEV, as the AI-safety literature has it, proposes that an advanced system''s goals
  be set by what humanity''s volition would converge to under extrapolation: if we
  knew more, thought faster and more clearly, were more the people we wished we were,
  and had developed in closer contact with one another, with the further requirement
  that the extrapolation be stable — the volition of the extrapolated agents should
  not itself want to be revised by a second round of extrapolation. Nothing in that
  recipe is a list of idealizing properties; it is an open-ended process description.


  My chapter''s argument, and the use I make of the analogy: if CEV is ideal observer
  theory with a better engine, then the objections that have accumulated against ideal
  observer theory transfer to it more or less intact, and the burden of answering
  them sits with CEV''s proponents rather than with me. The specific objection I press
  is one I have dubbed the empty-chair problem: strip an agent of interest, passion,
  and personal perspective until it is impartial and calm and fully informed, and
  you may have deleted exactly the machinery that generates wants. What is left either
  approves of nothing in particular, or reports the preferences smuggled in by whoever
  wrote the idealization clause. Firth escapes this by the normalcy proviso; CEV,
  I claim, has no such proviso and therefore cannot.


  My committee''s reply: the analogy inverts the two theories. Firth''s idealizations
  are a finite stipulation chosen precisely to build impartiality into the analysis,
  and the normalcy clause is doing enormous work; CEV''s extrapolation is meant to
  be content-free, to include our moral and metaethical views among the things extrapolated,
  and to be plural — there is no single observer, but a population whose volitions
  are supposed to cohere. On that reading, CEV shares a word with ideal observer theory
  and almost nothing else, and my objection transfers only by equivocation.


  Please audit the analogy rather than adjudicate the two theories on their merits.
  Specifically, I want to know whether the empty-chair objection actually survives
  the transfer.


