  Alternatively: Good''s theorem with a thought experiment design — "construct a decision
  problem where information that is relevant is worth acquiring for free...". Good''s
  theorem (1967, I.J. Good, "On the Principle of Total Evidence") says expected value
  of a free experiment (information) is nonnegative and strictly positive if the outcome
  can change the decision. Design a case where the expected value of information is
  zero even though the experiment can change the decision — a case where the change
  is "hedged" so no gain. That''s a nice technical construction: the classic result
  is that EVPI ≥ 0, and > 0 iff the optimal action after observing can differ. But
  you can construct cases where it''s exactly zero: e.g., the observation changes
  the action but the new action has the same expected payoff — this happens when the
  action change is "indifferent" — but Good''s theorem says strictly positive if the
  change happens with positive probability and the agent acts optimally. So a genuine
  counterexample requires violating an assumption: the evidence isn''t free (cost),
  the agent isn''t a Bayesian expected utility maximizer (e.g., dynamic inconsistency,
  non-Bayesian updating like Jeffrey conditioning with a change in desirability, or
  a preference for the unknown), or the payoff isn''t linear in probability.


