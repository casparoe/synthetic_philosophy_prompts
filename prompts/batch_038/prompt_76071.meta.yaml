  a background of things held fast; a doubt that doubted everything would not be a
  doubt. So Moore''s mistake is to treat an indubitable proposition as a known one.


  Wittgenstein''s positive picture is that our empirical beliefs rest on a set of
  propositions that are not themselves justified but are held fast by what lies around
  them — hinge propositions. They are called hinges because the questions we can meaningfully
  ask and the investigations we can carry out turn on them, as a door turns on its
  hinges. Hinges include such things as that the earth has existed for a long time,
  that I have never been to the moon, that objects don''t vanish when unobserved,
  that this is my hand. They are not known, exactly, nor believed in the ordinary
  sense: they are shown in how we act, in what we treat as settled. My certainty is
  not a matter of a strong inner feeling but of my unhesitating way of behaving.


