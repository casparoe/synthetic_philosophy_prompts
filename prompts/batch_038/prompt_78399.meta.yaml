  ---


  For the closing session of a two-day workshop on crustacean welfare in aquaculture
  — an audience that will include hatchery technicians, welfare scientists, and a
  regulator — please write a sestina.


  The subject is a single practice: unilateral eyestalk ablation of female Pacific
  whiteleg shrimp broodstock. One eyestalk is pinched, enucleated, or cauterized off,
  usually without anaesthetic, because the eyestalk''s neurosecretory complex secretes
  a gonad-inhibiting hormone that keeps the ovary from maturing in captivity; remove
  the brake and the female spawns within days. The poem should not explain this in
  lecture mode, but it should be built on it: the end-words below are the practice''s
  parts, and the argument about it.


  The six end-words, in the order they first appear, are: eye, shelter, reflex, trade,
  wound, stun. Rotate them in the traditional sestina pattern (1-2-3-4-5-6 / 6-1-5-2-4-3
  / 3-6-4-1-2-5 / 5-3-2-6-1-4 / 4-5-1-3-6-2 / 2-4-6-5-3-1), then gather all six into
  a three-line envoi. Unrhymed, in lines of roughly comparable length; thirty-nine
  lines in all.


  Each end-word must at least once carry its technical weight, not merely its colloquial
  one:

  - reflex: the skeptic''s move — a decapod''s withdrawal, tail-flip, and grooming
  of an injured antennule can all be generated by circuits that need not feel anything;

  - trade: the criterion that is supposed to resist that move — an animal that gives
  up something it wants (a good shelter, a preferred mate, food) to avoid a noxious
  stimulus is showing a motivation, not a fixed response;

  - shelter: both the thing crabs and prawns will work to avoid if they were shocked
  there, and the thing an ablated, half-blind female loses access to;

  - wound: the ablation site, and the rubbing, flicking, and sheltering that a local
  anaesthetic given beforehand measurably reduces;

  - eye: the organ removed as a means to an endocrine end;

  - stun: what the industry would do instead, and the unsettled question of whether
  the current alternatives (ice slurry, electrical stunning, splitting) are themselves
  improvements.


  The argument by analogy should appear — the inference from similar responses to
  similar experience — and so should the neuroanatomical objection to it: that decapods
  have no cortex-like structure. The poem must also concede what the objection concedes,
  namely that the absence of a mammalian cortex does not by itself rule out affective
  states in an animal whose nervous system arrived at a different design by a different
  route.


  The form should be doing the philosophical work. The sestina''s rotation is the
  debate: six terms, returned to in a fixed order, never settling, each repetition
  in a slightly different light. The envoi is the point at which that becomes intolerable,
  because a hatchery has to decide this season whether to keep ablating and a regulator
  has to decide whether to require stunning — and the decision must be made out of
  exactly the same six words, with the same evidence, and no more. Do not resolve
  the science; do make it clear that the decision cannot wait for it to be resolved,
  and that this is a genuine asymmetry rather than a cheap one.


  Keep it free of sermon, of sentimental first-person shrimp, and of industry apologia;
  the technicians in the room are not villains and should not be written as such.
  Do not invent study titles, author names, or citations — nothing in the poem should
  need to be looked up.


