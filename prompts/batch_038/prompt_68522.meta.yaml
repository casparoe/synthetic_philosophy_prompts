  Nietzsche''s Untimely Meditation #2: On the Uses and Disadvantages of History for
  Life. Three modes: monumental (history of great exemplars, for the man of action
  who needs models and consolation that greatness was possible), antiquarian (history
  of the one who preserves and reveres, piety toward origins, gives the individual
  a sense of home; danger: everything old is mummified, the new is suffocated, "the
  sense of the past is turned into a tool of the present"), critical (history of the
  sufferer who needs to break up the past and use it to judge and condemn it, for
  the sake of life; danger: it''s hard to draw the line, and we are all products of
  the past we judge — Nietzsche''s point that we must know how to forgive ourselves,
  and that historical justice requires the ability to create anew).


