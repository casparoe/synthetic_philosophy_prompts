  \ problems get different answers — the \"problem of equivalence\"/\"individuation\
  \ of states\" objection, and the Allais-style framing). A good procedure has to\
  \ specify how to carve the decision problem, which is exactly the hard part. That's\
  \ a genuinely meaty conceptual task: operationalize RWEU as a checklist including\
  \ specifying outcome space, states, the risk function, and handling the invariance\
  \ objection. That's a nice, in-the-weeds prompt that a model can't regurgitate but\
  \ can do without web access.\n\nAlso nice: RWEU is order-dependent — it violates\
  \ the independence axiom, and it's dynamically problematic (planned violations of\
