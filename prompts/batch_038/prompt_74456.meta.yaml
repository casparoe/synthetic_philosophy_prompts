  — no need for a special account of knowledge; but many think there is a distinctively
  epistemic value (final/intrinsic value of knowledge, per Pritchard/Jones), and if
  the instrumentalist cannot capture it, then the view is either revisionary or incomplete.
  Also: whether the view risks anything at all — the instrumentalist can always retreat
  to "knowledge is valuable for its consequences, but there might be further value"
  — insulated?


