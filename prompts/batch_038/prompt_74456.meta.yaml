  Known defeaters/objections to instrumentalist solution:

  - Swamping problem (Zagzebski): once you have the true belief, the reliability of
  the source adds no value, like a good cup of coffee vs. a reliably produced good
  cup of coffee — the value of the instrument is swamped by the value of the product.

  - Kvanvig''s primary/secondary value distinction: instrumental value is secondary;
  the question asks why knowledge is primarily valuable.

  - Lack of generality / domain specificity: knowledge about X gives no advantage
  regarding Y.

  - The "value problem generalizes": if knowledge > TBP because of reliability, then
  TBP > BP (justified true belief > merely true belief), but many think the value
  question is about the contrast with justified true belief (post-Gettier), not merely
  true belief.

  - Empirical/psychological evidence: does knowledge actually correlate with greater
  stability of true belief across situations? Cases where knowledge is fragile (e.g.,
  self-knowledge, memory, testimony-based beliefs about a single past event) and where
  mere true belief is stable.

  - Counterexamples: lucky true beliefs formed by reliable processes in weird environments;
  "swamping" reversed cases.

  - The Goldman–Olsson conditional probability solution, and Kelp''s (Christoph Kelp)
  objection that the conditional probability solution predicts value differences where
  there are none (e.g., in a case where a belief-forming process is reliable but there
  is no future similar belief — "the value of knowledge" fails to be explained). Also
  Chris Tucker''s work on the conditional probability solution. Kelp''s argument:
  Goldman-Olsson''s account entails that knowing p is more valuable than mere TBp
  only if the probability of future true beliefs is higher; but there are cases where
  knowledge is clearly more valuable even though no such future beliefs will be formed.
  That''s a nice defeater.

  - Also the "value of ignorance" / cases where justified true belief is worse.

