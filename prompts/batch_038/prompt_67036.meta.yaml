  I work part-time at a small organic market garden and I''ve gotten weirdly hung
  up on two bits of standard pest-control practice, both of which everyone around
  me treats as obviously enlightened. First one: the action threshold. The way extension
  people teach it, you don''t spray on a schedule, you scout, you count pests (say,
  flea beetles per plant, or the percentage of leaf area eaten), and you only treat
  once the pest population crosses the point where the value of the crop they''re
  going to destroy exceeds the cost of treating. So the trigger for killing insects
  is a comparison between a dollar figure for crop loss and a dollar figure for the
  spray plus labour. And notice what falls out of that: the threshold moves with the
  market price of the crop. Same beetle, same field, but because greenhouse salad
  greens are worth way more per acre than field corn, you''re licensed to treat at
  a much lower beetle density — the richer the harvest, the more readily you kill.
  Second one: the organic permitted-substances list. The default rule is that natural
  substances are allowed unless listed and synthetics are banned unless listed, so
  pyrethrins, copper sulfate, spinosad, Bt, neem, sulfur are in, and most of the modern
  synthetics are out. As I understand it some of the allowed ones are pretty broad-spectrum
  and bad for non-targets — pyrethrins hammer bees and aquatic invertebrates, copper
  builds up in soil and is nasty to worms — and organic growers sometimes end up applying
  more passes of a weaker broad-spectrum product than the conventional grower needs
  of one targeted systemic. Which seems like a strange way to allocate moral concern
  if the concern is supposed to be about the environment.


  Here''s what I want: reconstruct the view of value that''s actually built into these
  two practices...


  Then ask: what does it presuppose about insects'' moral status — that they don''t
  matter at all, that they matter only instrumentally, that death isn''t a harm for
  a creature with no psychological continuity, that numbers don''t aggregate, something
  about the distinction between killing and letting die (the pest is already there,
  the farmer is merely failing to prevent harm to plants)? Is the natural/synthetic
  line doing moral work or is it about something else — trust, purity, identity of
  the brand, epistemic humility about novel compounds, the precautionary principle?
  And the underdetermination question: I want you to be careful about what the practice
  strictly requires vs what merely fits nicely. My own hunch, which I want you to
  attack: the action threshold is secretly a piece of harm-reduction. IPM does cut
  total insecticide use relative to calendar spraying, so a view on which insect lives
  count for something would license the same rule, just with a different number in
  it. Is that right, or does it depend on stuff the practice can''t supply — like
  knowing how many non-target insects a pass kills, and whether the insects killed
  would otherwise have died anyway? And what would have to change, concretely, if
  you swapped in a view where insects have standing: does the threshold formula need
  a welfare term, does it ever go negative (i.e., never treat), do you get different
