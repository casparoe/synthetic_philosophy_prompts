  The Allais paradox and the independence axiom is a great candidate: technical, specific,
  and a popular summary would subtly misrepresent it. E.g., a business magazine article:
  "Allais showed that people are irrational, because they violate expected utility
  theory. The paradox proves that people are risk-averse..." The subtle errors: (1)
  Allais himself was not attacking rationality — he was a neoclassical who thought
  his own choices were rational and that the axioms were wrong, particularly the independence
  axiom; (2) the "common consequence effect" is often mislabeled as risk aversion,
  when in fact risk aversion is compatible with expected utility (concave utility)
  — the violation is of independence, not of risk aversion; (3) the claim that the
  paradox shows people "don''t maximize expected utility because of framing/emotion"
  — actually a behavioral story; (4) the claim that Allais won a Nobel for the paradox
  (he won in 1988 for markets/efficiency, not the paradox per se — that''s a specific
  fact I should verify or avoid). (5) The claim that the Allais problem pairs are
  "the same gamble" or that the difference between the pairs is trivial.


  Also there''s the "certainty effect" gloss and Kahneman-Tversky prospect theory.
  And the claim that expected utility "says you should treat a 10% chance of a million
  as..." etc.


