  I''m in my second year of a philosophy PhD and I''ve been working through the debate
  over whether a rational agent is permitted to weight probabilities non-linearly
  — the position that a risk-averse agent is not thereby irrational, and the standard
  reply that expected utility theory already accommodates everything the alternative
  theory was invented to capture. What has struck me is a recurring shape that the
  reply takes, and I don''t have a name for it.


  Instance 1: someone points to an agent who prefers a sure 50 dollars to a fifty-fifty
  chance of 0 or 100 dollars, and says this violates the theory. The reply is that
  the two options have not been specified correctly: once the description of what
  the agent receives in each branch includes further features — the absence of a lingering
  worry, the fact of having taken the safe route, the shape of the prospect as she
  experiences it — the gamble and the sure amount are no longer the same prize, and
  the preference conforms to the theory after all.


  Instance 2: the same shape appears with agents who prefer a bet on a ball drawn
  from an urn with known proportions over an equally staked bet on an urn with unknown
  proportions. The reply, again, is not that the agent is confused but that the states
  of the world were drawn too coarsely: enrich the states until the agent''s ignorance
  is itself part of the situation she faces, and the supposedly deviant preference
  is just an ordinary one.


  Instance 3: ... maybe about someone who prefers to learn the outcome sooner / who
  cares about equality.


  In every case the theory itself is left untouched: no new clause, no restriction
