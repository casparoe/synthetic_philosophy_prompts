  F gets co-opted into a new circuit where it now contributes to G, and G is what
  now gets rewarded. Examples: the approximate number system recruited for symbolic
  arithmetic; visual word-form processing built on object recognition; fear circuitry
  recruited for social anxiety; the general case of any culturally scaffolded skill
