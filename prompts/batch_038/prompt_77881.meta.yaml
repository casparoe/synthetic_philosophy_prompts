  of malfunction). Sense B — etiological normality: the conditions under which the
  item''s ancestors did the thing that got them reproduced, i.e., the historical environment
  that fixed the function in the first place. In textbook cases these coincide, so
  the ambiguity is invisible: the frog''s detector is a fly-detector in both senses.


