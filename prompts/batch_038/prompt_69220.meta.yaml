  Actually KS satisfies: Pareto optimality, symmetry, invariance to affine transformations,
  and monotonicity (individual monotonicity). It fails IIA. There''s a characterization
  theorem (Kalai–Smorodinsky 1975) showing these four axioms uniquely characterize
  it on two-person bargaining problems with compact, comprehensive feasible sets.
  Also for n≥3 players, KS is not well-defined / does not satisfy Pareto optimality
  in general (the "Kalai-Smorodinsky" solution for n-person games via the line from
  d to utopia point may intersect the Pareto frontier in multiple points or be undefined).
