  Draft:


  "I produce a fortnightly history podcast with a fairly well-read audience, and next
  month''s guest is a historian of the July Crisis whose recent book defends a now-popular
  reading of 1914: that responsibility for the outbreak cannot be assigned to any
  single government, because agency was distributed across a system of alliances,
  mobilization timetables, and military cultures in which every decision-maker was
  reacting to moves he had misread. He is careful to say this is not a rehabilitation
  of Germany; he insists that the war guilt article of the Treaty of Versailles —
  the clause in which the Allies affirmed, and Germany accepted, the responsibility
  of Germany and her allies for causing all the loss and damage resulting from the
  war imposed on them by their aggression — was a financial formula that later generations
  moralized. He is, however, extremely good at two deflections, and I need questions
  that make them progressively harder to use. The first is methodological: whenever
  the conversation turns to the Fischer controversy, he separates the origins of the
  war in July 1914 from the aims of the war after it, and treats the September Programme
  of 1914 as evidence about the second but not the first. The second is evidential:
  when shown a document that looks decisive — say, the record of the December 1912
  meeting at the Berlin palace where the army''s chief of staff urged that war was
  unavoidable and the sooner the better, and the navy asked for a postponement until
  its construction programme, including the widening of the Kiel Canal, was complete
  — he points out that the chancellor was absent, that the meeting reached no recorded
  decision, and that our account rests substantially on a diary note by the chief
  of the naval cabinet recording that the result amounted to almost nothing.


  Please draft nine or eleven questions, ordered so that the deflections become harder
  to deploy as the interview goes on. I need at least one question on each of the
  following, and for each of them a follow-up keyed to the answer he is most likely
  to give: (a) whether a distributed-responsibility account can still distinguish
  a government that pressed for war from one that merely failed to stop it, and what
  would collapse if it could not; (b) the December 1912 meeting — what interpretation
  of it he is committed to, and whether the absence of a chancellor and of a recorded
  decision is evidence of insignificance or evidence of something else; (c) the September
  Programme and the origins/aims distinction, pressing him on whether that distinction
  is a genuine methodological principle or an inoculation against a class of documents;
  (d) Article 231 and what it would even mean to hold a nation, rather than particular
  ministers and generals, responsible for a war — whether the clause''s language about
  responsibility for loss and damage is a moral verdict, a liability rule, or neither;
  (e) the counterfactual: since the archives of every great power have been open for
  a century, what asymmetry in the record would actually change his mind... ; (f)
  the politics of reception... And the final question should be about falsification:
  what specific document, archival finding, or argument, if it surfaced tomorrow,
  would count against his thesis...


  Also: no softballs, no ''what drew you to this period''. Where you think he has
