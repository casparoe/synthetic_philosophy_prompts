  substitute for his body — he wanted the book to stand in for him after death, and
  the preface says the book''s purpose is domestic/private, for relatives and friends
  so that they can recover some traits of his condition and humors. That is essentially
  an early griefbot rationale! Excellent hook: Montaigne wanted his Essays to serve
  as a keepsake so friends could keep conversing with him after death. That''s textually
  grounded (the "To the Reader" preface). I''m confident about that. I can phrase:
