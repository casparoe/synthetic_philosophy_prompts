  too strong. The asker says: I can''t accept (9); I want to know which step to reject.
  The flaw is somewhere between (5) and (7): the slide from "no member may act against
  the group''s judgement" to "the group cannot act unless unanimous". Acting as a
  group (authorising a decision procedure, delegating) is not the same as every member''s
