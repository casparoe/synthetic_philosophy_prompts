  Better: make the flaw subtler, a scope shift. Let me try:


  (1) When many people are separately capable of bringing about an outcome, the outcome
  will occur if any one of them judges it worth bringing about, whatever the others
  judge.

  (2) Hence, as the number of capable agents grows, the probability that the outcome
  is brought about approaches 1, regardless of what fraction of them judge it harmful.

  (3) So for a group to prevent an outcome it collectively judges harmful, every member
  must treat the group''s judgement as decisive over their own.

  (4) Any member who departs from (3) on the grounds that their own judgement is better
  in this particular case is relying on a policy that, if generally adopted, would
  defeat the group''s ability to prevent any outcome — and a policy that cannot be
  generally adopted cannot be rationally adopted by one member.

  (5) Therefore no member may ever act against the group''s judgement, however confident
  they are.

  (6) The same reasoning applies to any subgroup acting against the judgement of the
  whole group, and recursively: the group''s judgement is itself the output of subgroups,
  so the reasoning shows that no subgroup may ever act against the whole, and the
  whole cannot act unless unanimous.

  (7) But unanimity is impossible in any group of more than a handful of people, so
  no such group can ever act at all — including by deciding to adopt the rule in (5).

  (8) A principle whose adoption would make collective action impossible cannot be
  the correct principle of rational participation.

  (9) Therefore (3)–(5) are false, and unilateralism is fine.


