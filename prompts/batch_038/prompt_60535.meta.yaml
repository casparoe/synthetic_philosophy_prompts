  (1) Where a capability is available to n parties, each of whom forms an independent
  estimate of the value of exercising it and acts whenever that estimate is favourable,
  the exercise will occur if any one estimate is favourable.

  (2) Because the estimates are independent and noisy, the most favourable of them
  is more likely to be an overestimate than any other; so the chance that at least
  one party exercises the capability rises with n, and approaches certainty as n grows.

  (3) Consequently a capability whose true net value is markedly negative, and which
  nearly every party would decline to exercise if the question were put to the group
  as a whole, will nevertheless be exercised — this is the curse.

  (4) So the only way for such a group to prevent the exercise of the capability is
  for each member to treat the group''s pooled judgement as decisive whenever it conflicts
  with their own estimate.

  (5) A member who sets the pooled judgement aside on the ground that they are better
  informed in this instance is acting on a policy which, if adopted by all the members,
  would return the group to the situation described in (1); and a policy which cannot
  be adopted by all cannot rationally be adopted by one.

  (6) Therefore no member may act on their own estimate against the pooled judgement,
  however strong their reasons for thinking it wrong.

  (7) The reasoning does not stop at the level of the whole group. A subcommittee
