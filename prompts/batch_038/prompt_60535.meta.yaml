  Numbered premises:


  (1) A group''s collective judgement about whether an action is net harmful aggregates
  the private information and independent reasoning of its members; by a standard
  jury-theorem-style argument, it is more likely to be right than the judgement of
  any single member.

  (2) If a member acts against the group''s judgement, then either the group is right
