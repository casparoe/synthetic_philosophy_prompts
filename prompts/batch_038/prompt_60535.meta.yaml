  Setting: The asker is a DPhil student (British) in a group studying governance of
  emerging technologies; they''re running a reading group / writing a handout for
  a workshop at a synthetic biology institute; they''ve built an argument to defend
  a strong anti-unilateralist norm, and now it seems to prove too much.


  Concrete case to seed: a consortium of ~30 labs, each able to publish a set of methods
  that would make a certain pathogen easier to engineer; each lab estimates the net
  value of publication; estimates are noisy and mostly well-intentioned. Also perhaps
  a second, "blessing"-flavoured twist: a case where the collective judgement is to
  withhold a beneficial result.


  Now the argument:


  (1) Suppose n agents each can bring about some outcome O, and each forms an independent
  estimate of O''s net value; each acts on their own estimate, bringing about O if
  their estimate is positive.

  (2) Because estimates are noisy and independent, the agent with the highest estimate
  is more likely to have overestimated than any other agent; so O is brought about
  whenever anyone overestimates, and the chance of that grows with n towards certainty.

  (3) Hence with large n, O will be brought about even when its true net value is
  strongly negative and nearly every agent would agree, on the group''s pooled information,
  that it should not be.

  (4) So the only way for such a group to prevent O is for each member to treat the
  collective judgement — the pooled estimate — as decisive against their own, whenever
  the two conflict.

  (5) A member who sets aside the collective judgement on the ground that they have
  better information in this instance is relying on a policy that, if adopted by everyone,
  would reproduce exactly the situation in (2); and a policy that cannot be adopted
  by everyone cannot rationally be adopted by one.

  (6) Therefore no member may ever act on their own estimate against the collective
  judgement, however strong their evidence.

  (7) The same reasoning applies at every level: a subcommittee acting against the
  consortium''s judgement, a member state acting against a treaty body''s, an individual
  acting against a lab''s. Any agent who departs from the judgement of the group they
  belong to is a unilateralist.

  (8) But a collective judgement is itself produced by agents, some of whom must act
  to produce it — a chair who calls the meeting, a working group that reports, a majority
  that carries a motion. By (7), each of these acts against the judgement of the group
  as a whole, unless the whole has already authorised it.

  (9) So the group can act only if every act it performs has been unanimously authorised
  in advance, and authorising that authorisation requires a further unanimous act,
  and so on without end.

  (10) No group can complete an infinite regress of authorisations; therefore no group
  of any size can act at all, and the norm in (6) cannot be adopted, since adopting
  it would itself be an act.

  (11) But a norm that cannot be adopted cannot be the correct norm of rational participation.

  (12) Therefore (4) is false: agents may act on their private judgement, and the
  unilateralist''s curse is not a reason for a principle of conformity.


