  Now — is there a genuine flaw? Yes, several candidates:

  - Step (5): the universalisation move. A policy that cannot be adopted by everyone
  can still be rationally adopted by one in the right circumstances (the "no one else
  will act" case, or where the collective judgement is demonstrably uninformed about
  a fact the agent possesses privately). Also (5) assumes the collective judgement
  has already incorporated the member''s evidence — but the curse''s setup (1) is
  precisely a setup where information is NOT pooled; so the argument''s move from
  "estimates are private and unpooled" (premise 1–3) to "the collective judgement
  is decisive because it pools information" (premise 4) imports a condition (that
  pooling has actually occurred) that premise 1 denies. This is the key equivocation:
  the group in (2)-(3) is a mere set of agents with no communication, whereas the
  group in (4)-(6) is one that has formed a pooled judgement, which requires exactly
  the coordination the earlier steps assumed away. So the argument is only valid under
  an equivocation between two notions of "group".

  - Step (7)-(8): composition/scope shift — the collective judgement is a normative
  standard for members, not a decision-procedure that must itself be produced by unanimous
  individual acts; a majority decision IS the collective judgement, so acting under
  it is not acting against it. There''s a distinction between an agent acting against
  the group''s judgement and the group''s judgement coming into existence.

  - Step (10): the regress only arises if "authorised in advance by the whole" is
  read as requiring a prior act of the whole; a standing rule (a constitution, a decision
  procedure) can be adopted once and then supplies authorisation without further unanimity
  — and indeed the adoption of that standing rule can be done by a subgroup whose
  act is subsequently ratified, so the regress terminates in a de facto authority,
  not an infinite chain.

  - Step (12): even if (4) fails, it doesn''t follow that agents may act on private
  judgement simpliciter — non-sequitur: the falsity of "the only way" claim leaves
  weaker conclusions (e.g., deference subject to a disclosure-and-delay procedure,
  or a norm that dissent must be voiced before acting). Also (2) is false as stated
  when estimates are not independent or when n is small, and the winner''s curse requires
  that acting be costless and undetectable.


