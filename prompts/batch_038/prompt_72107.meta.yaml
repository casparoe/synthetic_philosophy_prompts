  I am a junior at my high school, and I am writing a paper for our school''s research
  journal about how scientists ought to choose between competing explanations of the
  same data. In the course of my reading I came across Solomonoff induction, and I
  want to build the paper around it, but I would like to check that I have the reasoning
  right before I commit to it.


  My argument is this. Solomonoff''s framework considers all programs that could have
  produced the observed data, and weights them by a universal prior that gives a program
  probability 2^-|p|, where |p| is its length in bits. Two theorems then settle the
  question I started with: the invariance theorem says that the resulting complexity
  measure does not depend on which programming language or universal machine one uses,
  and Solomonoff''s optimality result says that no other method can do better at predicting
  the next bit of data. Together, these seem to prove Occam''s razor — that the shortest
  correct description of a phenomenon is, in the strictest sense, the most likely
  to be true.


  So my plan is to take a real historical case (I am thinking of the transition from
  Ptolemaic to Copernican astronomy, or from caloric to kinetic theories of heat)
  and to measure the Kolmogorov complexity of each competing theory, then declare
  the theory with the smaller value the one that scientists were rationally obliged
  to prefer, and hence the one that did in fact win out. Where the shorter theory
  did not win, I would treat that as evidence of sociological distortion in the history
  of science.


  Three specific questions. First, for the measurement step: since Kolmogorov complexity
  is defined relative to a universal machine, is it legitimate to use a general-purpose
  file compressor on a written statement of each theory and compare the compressed
  sizes, and how should I convert those numbers into bits so that the comparison is
  fair across, say, a Latin treatise and a set of differential equations? Second,
  given the invariance theorem, can I simply ignore the choice of compressor, or does
  the constant that the theorem leaves unspecified become large enough to matter when
  the two theories differ by only a modest amount? Third, and most important: if the
