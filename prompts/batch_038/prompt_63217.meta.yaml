  position, which makes me suspect it is not a coherent one. Here it is.


  (1) Sentience admits of degrees. I do not believe there is a non-arbitrary line
  separating subjects from non-subjects, and I think any account that delivers one
  is ipso facto suspect; moral standing should vary continuously with the underlying
  capacity.


  (2) What confers standing is not intelligence, language, self-modeling, or behavioral
  flexibility, but the capacity for valenced experience — the capacity for states
  that are, for the subject, bad or good. Everything else is instrumentally relevant
  at best.


  (3) The indicator of valence that I trust is architectural rather than behavioral.
  I look for what I have been calling an arbitration station: a place where competing
  drives — feeding, escape, mating, thermoregulation — are resolved into a single
  global output that controls the animal as a whole. Where there is arbitration, I
  am prepared to say there is a subject; where there are only parallel reflex loops
  modulated by local state, I am not. Learning ability and behavioral richness count
  as evidence only insofar as they require arbitration.


  (4) I add a second factor of my own devising, because intensity alone seems to leave
  out something important about death and about a life going badly. I call it the
  stake interval: the timespan over which a system''s states are bound into a single
  continuing subject, such that what happens now matters to what happens later for
  that same subject. I hold that standing is proportional to the intensity of the
  valence multiplied by the length of the stake interval, and that a system with no
  appreciable stake interval is a series of momentary subjects rather than one.


  (5) Since I cannot verify any of this, I think one should weight one''s estimate
  of a system''s standing by one''s confidence that it is sentient, rather than treating
