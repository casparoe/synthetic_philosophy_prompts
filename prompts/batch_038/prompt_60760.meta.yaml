  Past and Future), "Lying in Politics" (1971, in Crises of the Republic), reflections
  on the Pentagon Papers. Key ideas: distinction between factual truth and rational
  truth; the truth-teller vs. the liar; the fragility of factual truth; the modern
  liar''s ability to change reality, to lie about things that aren''t yet determined
  (future, action) vs. things that are determined (past facts); that self-deception
  in the Pentagon Papers case — the "problem solvers" were deceiving themselves; the
  image-making of the US government. Also Arendt says lying has always been considered
  legitimate in politics (the politician as such has always been considered a liar),
  and that the modern difference is scale and the possibility of destroying the facts
  rather than just hiding them. She also distinguishes traditional lying (concealing
  secrets/intentions) from modern lying (destroying verifiable facts, rewriting history),
  and notes that lying about the future — where no truth exists yet — is closer to
  legitimate political action, whereas lying about the past is an assault on the very
  texture of reality. She also famously remarks that if everybody lies about a particular
  thing, the result is not that the lie becomes truth but that the common world is
  destroyed — lying becomes unmasking, and the sense by which we orient ourselves
  in the real world is undermined. Also: the truth-teller is not a man of action;
  factual truths are not compelling like rational truths; they have to be testified
