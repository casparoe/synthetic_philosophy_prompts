  couple of overviews — so neither of us was arguing from a secure base. Afterward
  I wrote his position down as carefully as I could, in five claims, trying to preserve
  his reasoning rather than strawman it:


  1. Weber''s argument is that the Calvinist doctrine of predestination left believers
  unable to know whether they were among the elect, that ministers responded by teaching
  that material success in one''s calling should be read as evidence of election,
  and that this gave Protestants a motive to work hard, save, and reinvest — which
  is how capitalism came about in northern Europe.


  2. So the thesis is a claim that ideas cause material outcomes: culture is the independent
  variable, the economy the dependent one. Weber is offering a rival to Marx, with
  the arrow reversed.


  3. Weber knew the thesis could not be tested, and that is precisely why he surrounded
  it with the machinery of "ideal types" and interpretive understanding: ideal types
  are not hypotheses, they are instruments for organizing a picture of a period, and
  nothing organized that way can be confirmed or refuted by evidence.


  4. That is not an accidental weakness but a necessary one. Beliefs and values cannot
  be causes. A norm or a meaning is not the kind of thing that can stand in a causal
  relation to an event; it can only be a reason an agent has, and reasons are what
  make an action intelligible from the inside, not forces operating on it from behind.
  Explanations that cite culture are therefore always either covert appeals to agents''
  reasons, dressed up as causation, or else appeals to something non-cultural (incentives,
  geography, technology, institutions) that does the real causal work.


  5. It follows that the Protestant ethic debate was never a genuine dispute. A century
  of argument about whether Calvinism caused capitalism is a dispute about whether
  an unintelligible thing happened. On one side, people who think values explain conduct;
  on the other, people who think they do not; and both are confused about what would
  have to be true for either claim to be true.


