  Hmm. Fischer discusses "anachronism" and "presentism"? He has a chapter on "the
  fallacies of generalization"...). Also relevant: the debate over judging historical
  actors by present moral standards; the "historical empathy" debate; the argument
  from moral progress; the problem of the "unjust judge" — historians condemn slavery
  while claiming to describe; the argument that all historical explanation implicitly
  uses present concepts (selection of what''s worth explaining is present-driven:
  "significance" is always relative to a present interest — E.H. Carr''s point); and
  the counter that concepts can be reconstructed (Skinner: we must recover the concepts
  available to the agent, else we mistake what they were doing). Also the "whig interpretation
  of history" (Butterfield) — that''s the classic anchor. And Gadamer''s fusion of
  horizons, which says the question of escaping one''s own prejudices is itself misconceived:
  understanding always involves the interpreter''s horizon; the goal is not to eliminate
  prejudice but to distinguish productive from unproductive prejudices. That''s a
  great "what both parties are missing" candidate.


  So an adjudication prompt could have two historians argue about a concrete case,
  with moves like:

  1. A: condemning a 17th-century figure by present standards is anachronistic and
  destroys explanation — you can''t understand what he did unless you recover the
  reasons available to him.

  2. B: but you already use present standards when you decide he''s worth writing
  about — the choice of topic, the vocabulary ("racism", "empire"), even the archive.
  So pretending neutrality is worse than admitting it.

  3. A: that conflates significance with judgment. We can find a figure significant
  without condemning him; and if judgment is unavoidable it doesn''t follow it''s
  appropriate — the historian''s job is to explain, not to prosecute.

  4. B: explanation and evaluation aren''t separable: to explain why he did X you
  must show he had reasons, and calling something a reason already invokes standards;
  and the "no anachronism" rule itself is a present-day standard, a professional norm
  we invented in the 20th century, so A''s neutrality is just another presentism,
  unacknowledged.

  5. A: Fine, but then the norm is the one that lets us see them as agents rather
  than puppets — self-conscious presentism vs. invisible presentism is a real difference.

  6. B: Agreed there''s a difference in degree, but A''s framing implies there''s
  a way out, and there isn''t.


