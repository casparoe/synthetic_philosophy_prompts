  The standard story: David Armstrong raised the rotating disc case (attributing the
  idea to Kripke) as an argument AGAINST endurantism / Humean supervenience: two discs,
  one rotating one stationary, both homogeneous; at each moment, all intrinsic properties
  of the instantaneous stages are the same, and no relations to other objects (lonely
  disc) distinguish them. Endurantism (with no temporal parts) can''t distinguish
  them; perdurantism can (the worldline is helical vs. straight — the temporal parts
  differ in shape/arrangement). So it''s an argument for perdurantism. But some (e.g.,
  the "Kripke-Armstrong argument against temporal parts") present it as: even four-dimensionalism,
  if it takes temporal parts to be instantaneous, cannot distinguish — because instantaneous
  temporal parts have no velocity, and the helical vs straight distinction requires
  non-instantaneous parts. Hence the claim in [3]: "only non-instantaneous temporal
  parts can provide an answer to the rotating discs argument."


  So the debate is subtle: the RDA can be aimed at endurantism (favoring perdurantism)
  or at instantaneous temporal parts (requiring extended temporal parts). Also there''s
  a variant where the disc is "lonely" and homogeneous, and endurantist replies: velocity
  is an intrinsic property of the disc at a time (irreducible velocity), or gunk (regions
  have point-free parts, so instantaneous states differ), or accept the discs are
  qualitatively identical but numerically distinct possibilities (haecceitism-ish),
  or deny the case is metaphysically possible.


