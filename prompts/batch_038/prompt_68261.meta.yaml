  Student answer draft (final):


  "Rawls and Dworkin agree that a theory of distributive justice needs a metric, an
  answer to what it is that should be equalized. Rawls proposes the primary goods;
  Dworkin argues that these should be replaced by resources, and he supplies a procedure
  for working out what an equal distribution of resources is. Everyone begins with
  equal purchasing power at an auction of the island''s resources, and the distribution
  is equal when the auction clears the envy test — no one would prefer someone else''s
  bundle to their own. That test is what makes the metric ambition-sensitive and endowment-insensitive:
  people are held responsible for the tastes and commitments they have formed, and
  compensated for the disadvantages they did not choose. The hypothetical insurance
  market extends the same idea to cases the auction cannot handle, by asking what
  premium people would have paid to insure against a given handicap and then redistributing
  accordingly.


  Sen''s objection is that the whole enterprise is aimed at the wrong thing. Resources
  are means, and what matters for justice is not the means people hold but what they
  are able to do and be. A capability is a functioning a person has actually achieved
  and has reason to value — being adequately nourished, being literate, appearing
  in public without shame, taking part in the life of the community. The capability
  set of a person is then the collection of functionings she in fact realizes. On
  this picture two people holding exactly equal bundles can stand in very different
  relations to their holdings: the wheelchair user needs more resources to achieve
  the same mobility, the person living in a cold climate more to be adequately sheltered,
  and the chronically ill more still. Conversion rates vary with personal heterogeneity,
  and heterogeneity is neither chosen nor, on Dworkin''s own account, something the
  envy test registers — the auction prices the wheelchair, not the impairment, and
  so the distribution that satisfies the test can still leave the disabled person
  with less freedom. Sen''s point is that Dworkin''s ambition/endowment distinction
  therefore cannot carry the weight placed on it, since the differences that matter
  most are differences in what resources convert into, not differences in what people
  want from them.


  The same reasoning disposes of welfare as a metric. Satisfaction adapts to deprivation,
