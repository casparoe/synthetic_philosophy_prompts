  Subtle mistakes a student could make:

  1. Conflating Sen''s capability approach with Nussbaum''s list of central capabilities
  (Sen deliberately refuses to endorse a list; Nussbaum supplies one for constitutional
  entitlements).

  2. Misattributing the "resourcism is fetishistic" charge — that''s Sen''s charge
  against Rawls, and it''s about means vs. freedom to achieve.

  3. Confusing capability (freedom) with functioning (realized achievement) — a student
  might say capabilities measure what people actually achieve.

  4. Saying Dworkin endorses equality of welfare — no, Dworkin argues against it and
  for equality of resources, with the envy test.

  5. Adaptive preferences: attributing it to Nussbaum only, when Sen developed it
  too.

  6. Claiming Sen''s approach is ambition-sensitive and endowment-insensitive — actually
  that''s Dworkin''s; and Sen''s critique is precisely that Dworkin''s approach still
  measures by resources and is indifferent to differential conversion rates.

