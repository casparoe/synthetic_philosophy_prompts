  Sketch of my argument:

  1. Premise: every printed and handwritten ''a'' shares no set of features that is
  both necessary and sufficient... the double-storey ''a'' of most printed text, the
  single-storey form children learn to write, the ''a'' of a blackletter face, the
  ''a'' of a geometric sans in which the bowl is a perfect circle, all count as the
  same letter, and no non-trivial feature set captures them.

  2. Premise: they are not united by similarity to a single canonical prototype either,
  since ...

  3. Conclusion: letterform identity is a matter of the reader''s construction of
  a "halo" around a form — a family-resemblance region whose boundaries depend on
  what the reader is doing (proofreading, deciphering a logo, reading a medieval manuscript)
  and on the style of the surrounding inscription. There is no context-free answer
  to what makes every ''a'' an ''a''.

  4. Generalization: the same holds for a large class of our concepts, so the definitional
  projects of philosophy — what is knowledge, art, a person, a promise? — look for
  a determinate intension that is not there; the correct response is not skepticism
  but a shift to asking what the halo is for and relative to which practices.


