  I am grading the final exam for an undergraduate seminar in the philosophy of history.
  Please assess one student''s answer and write in American English.


  Exam question (20 points):


  "Critics of historical writing sometimes charge that a narrative commits the ''Whig
  interpretation of history.'' Explain what that charge amounts to, what Herbert Butterfield''s
  objection to it was, and whether he thought historians could realistically avoid
  it. Illustrate your answer with one example from the history of science."


  Student''s answer:


  "The Whig interpretation of history is the habit of writing about the past as though
  it were the first chapter of a story whose last chapter is us. Whig historians pick
  out the people and events that led to modern outcomes — constitutional liberty,
  modern science — and rate them by how much they contributed; everyone else is a
  bit player, or a villain who got in the way. Butterfield attacked this way of writing
  in 1931. His central objection is that it is anachronistic: the Whig historian reads
  modern concepts back into the past, so that a medieval jurist is made to be arguing
  about rights in our sense, and an ancient astronomer is made to be ''almost a Copernican.''
  Once we see this, the remedy is clear. Butterfield held that historians should write
  about the past for its own sake, refusing to select material by reference to anything
  that came later and refusing to say whether past figures helped or hindered us.
  That is hard, because the amount of evidence forces every historian to select, and
  selection is driven by present interests; on Butterfield''s own reasoning, every
  narrative of change turns out to be Whig. So his critique proves too much: either
  history stops being a story or it stays Whig.


  The example I would use is impetus theory. Textbooks say Buridan''s impetus was
  a ''step toward'' Newtonian inertia, which makes Buridan a hero only because of
  what came after him. To write non-Whig history, we would have to describe impetus
  theory without ever mentioning that it anticipated inertia. The charge also only
  applies to stories of progress. A history that treats the Middle Ages as a golden
  age followed by decline reverses the direction of evaluation, but it is still judging
  the past by our standards, so Butterfield would have no objection — anachronism
  is what he objected to, and there is none here."


