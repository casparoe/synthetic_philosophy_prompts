  Student answer (final):


  "The Whig interpretation of history is the practice of writing about the past as
  though it were the opening chapter of a story whose final chapter is us. The Whig
  historian picks out the figures and events that led to modern outcomes — representative
  government, modern science — and rates them according to how much they contributed:
  those who advanced these things become heroes, and those who obstructed them become
  villains or obstacles. Butterfield attacked this way of writing in his short book
  of 1931, taking as his target a long tradition of British liberal historiography.


  His central objection, as I read him, is that it is anachronistic. The Whig historian
  projects present concepts onto past actors, so that a medieval jurist turns out
  to be arguing about rights in our sense and an ancient astronomer turns out to be
  ''half a Copernican.'' The past is made to speak in a vocabulary it never had, and
  so it stops being another country and becomes merely an earlier version of our own.


  If that is the problem, the remedy looks straightforward. Butterfield wants historians
  to study the past for its own sake: to choose their material without reference to
  anything that happened afterward, and to refrain from asking whether particular
  figures helped or hindered the present. He also recognizes that this is difficult,
  since the sheer volume of evidence forces every historian to abridge, and abridgement
  is governed by present concerns. But that concession seems to undo his program.
  If selection is unavoidable and always interest-laden, then on Butterfield''s own
  reasoning every narrative of change is Whig history, and his critique proves too
  much: either history gives up being a story, or it stays Whig.


  Consider impetus theory as an example. Standard accounts present Buridan''s impetus
  as a step toward Newtonian inertia, which makes Buridan a hero only in virtue of
  what came three centuries later. To write this non-Whig, we would have to describe
  impetus theory without ever mentioning what it anticipated. The charge, moreover,
  applies only to progress narratives. A history that presents the medieval world
  as a golden age and the modern as a decline simply runs the direction of evaluation
  backwards; because it is not a story of progress toward us, it escapes Butterfield''s
  objection entirely."


