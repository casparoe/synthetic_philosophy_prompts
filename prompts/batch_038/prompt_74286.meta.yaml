  Gödelian analogy in GEB + role-play or grading: The Lucas-Penrose argument; Hofstadter''s
  GEB uses Gödel''s first incompleteness theorem; the analogy from the Gödel sentence
  G ("G is not provable in PA") to the mind''s self-reference; Hofstadter''s "MUMBLING"
  / the ant fable "Aunt Hillary" — the anthill as a mind composed of dumb ants; "strange
  loops" and "tangled hierarchies"; the JOCCOND dialogue? Actually the relevant dialogue:
  the "Contracrostipunctus" is about Gödel; "Aria with Diverse Variations" is about
  the Goldberg Variations; "Six-Part Ricercar"; "Prelude... and Ant Fugue" is Aunt
  Hillary and the ant fable. Hofstadter''s claim in the Gödel chapter: a machine (formal
  system) cannot know its own Gödel sentence, but a mind can, because minds aren''t
  formal systems; but Hofstadter is more nuanced — he says we can''t necessarily see
  the Gödel sentence of a system we ourselves are, i.e., he resists the Lucas-Penrose
  conclusion; he emphasizes "the ability to jump out of the system" and self-reference,
  and argues that we are not aware of our own Gödel sentences — Hofstadter says humans
  can''t see their own Gödel sentences either, since we''re too complex to know our
  own program. That''s a great subtle point for grading: a student who says "Hofstadter
  endorses Lucas-Penrose" would be wrong; Hofstadter explicitly distances himself,
  saying we can''t necessarily know our own Gödel sentence because we don''t know
  our own program well enough, and his point is about how self-reference and strange
  loops give rise to the sense of "I."


  Also the technical subtleties: Gödel''s first incompleteness theorem requires the
  system to be recursively axiomatizable, consistent (or ω-consistent for the original;
  Rosser improved to plain consistency), and sufficiently strong (containing enough
  arithmetic, e.g., Robinson Q). The Gödel sentence is not "true but unprovable" in
  an absolute sense unless you assume the system''s consistency/soundness; from outside
  we can see it''s true if we accept consistency. Also: the Gödel sentence isn''t
  the only unprovable truth; the system can be extended (adding the Gödel sentence
  as an axiom) and a new Gödel sentence arises — so "jumping out of the system" doesn''t
  yield a complete system. Lucas''s argument in "Minds, Machines and Gödel" (1961)
  and Penrose''s The Emperor''s New Mind (1989) — plus Putnam''s critique (in "Minds
  and Machines"), and Feferman, Chalmers. Also the objection that the human mind might
  be inconsistent, or that we might not be able to know our own Gödel sentence, or
  that the argument requires the system to be knowably consistent.


