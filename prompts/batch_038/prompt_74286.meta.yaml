  "Rawls''s starting point is that we are not obliged to obey the law merely because
  it is the law. Following Hart, he distinguishes being obliged — the gunman situation,
  where a threat moves you — from having an obligation, which arises only within a
  practice whose rules people accept from an internal point of view. The question
  is what, in a nearly just society, generates the obligation.


  For Rawls it is the principle of fairness. Society is a cooperative venture for
  mutual advantage; each of us has accepted its benefits, from the security of a legal
  order to the roads, courts, and public goods we use every day. To keep accepting
  those benefits while refusing to bear the corresponding burdens is to free-ride
  on our fellow citizens, who restrain themselves so that we can be safe. So the duty
  to comply is owed to other citizens, not to the state as such, and it is owed by
  anyone who has voluntarily taken up the benefits the scheme provides. Rawls restricts
  the target: the duty binds only in a society that is nearly just, and civil disobedience
  is available when the majority persistently violates the equal basic liberties.


  Nozick''s objection is that this gets the moral geography backwards. He asks us
  to imagine a neighborhood that installs a public address system for entertainment
  and assigns each resident a day to run it; when my turn comes, am I obliged to serve,
  just because I enjoyed the broadcasts on the other days? No: benefits cannot obligate
  unless I have accepted them, and merely receiving something is not accepting it.
  The point is general. It does not merely embarrass fair play; it defeats it, and
  with it Rawls''s account, because any argument that moves from my having received
  a benefit to my owing a burden is exposed to the same example. What is left is at
  most a weak, content-dependent reason to support particular just arrangements, which
  is not enough for a general obligation to obey.


  Raz supplies what fairness lacks. On his service conception, an authority is legitimate
  when it helps its subjects better comply with the reasons that already apply to
  them than they would on their own. Legitimacy then entails an obligation to obey,
  since the subject has a reason to do as the authority says in place of weighing
  the reasons himself. Because legitimacy is assessed authority by authority, this
  also answers Simmons''s particularity problem: the general duty to support just
  institutions cannot tell me why I must obey this state rather than a just one abroad,
  but the service conception can, since it is indexed to the actual relation between
  me and my government.


  Finally, fidelity to law. Rawls defines civil disobedience as a public, nonviolent,
  conscientious but political act contrary to law, addressed to the majority''s sense
  of justice, and undertaken to bring about a change in law or policy, normally after
  legal means have failed. Willingness to accept the penalty shows that the disobedient
  does not reject the legal order as a whole; the act is an appeal within the boundaries
  of fidelity to law. That is why Rawls requires the appeal to concern a serious violation
  of the equal liberties, and why it must be directed at the law being broken: the
  act is a piece of speech to one''s fellow citizens, and it can only carry that content
  if the law violated is the one protested."


