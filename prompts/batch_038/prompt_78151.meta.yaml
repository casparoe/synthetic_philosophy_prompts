  - Necessary a posteriori: "Water is H2O," "Hesperus is Phosphorus," "Heat is the
  motion of molecules," "Gold has atomic number 79."

  - Contingent a priori: the standard meter (the stick in Paris is one meter long),
  and referent-fixing descriptions ("Neptune is the planet causing such-and-such perturbations").

  - Rigidity: a rigid designator designates the same object in every possible world
  (in which it exists); nonrigid: e.g., "the teacher of Alexander." Natural kind terms
  treated analogously; mass terms: ''water'' rigidly designates the kind/substance
  H2O; controversy over exact formulation.

