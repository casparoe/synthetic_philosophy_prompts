  metaphysical necessity and epistemic status. If further chemistry showed something
  surprising, we''d conclude we were wrong about what water is (or about the reference
  of ''water''), not that a necessary truth changed. Also: necessity isn''t derived
  from the discovery; the discovery is what licenses us to believe the necessary truth
  (given the semantics + the identity).

  - Kripke did not collapse analytic/synthetic; that''s Quine. Kripke separated necessary/a
  priori and showed the necessary a posteriori and contingent a priori, which undermines
  the *identification* of analyticity with necessity and apriority. Kripke also raised
  doubts about "analytic" but didn''t argue against the distinction as such.

