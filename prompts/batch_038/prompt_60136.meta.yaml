  Now the question. Make it specific, interpretive, non-regurgitatable, and inject
  a niche angle. Ideas:


  1. Grotius here says the common right was "supplied the place of private property"
  via a "general exercise of a right" — is he saying property arose by tacit general
  consent, or by nothing at all but a change in moral facts? And does the theatre
  analogy smuggle in a prior allocation mechanism (someone assigned the seats / the
  theatre owner)? Because if the analogy does the work Grotius wants, it seems to
  show that individual claims to seats are legitimate only because the whole arrangement
  is a shared institution with rules — which would mean the state''s right to exclude
  isn''t derived from the common right of mankind at all but is a kind of theatre-management
  right. Ask: is that a fair reading, or does Grotius''s "for the time being" do something
  else?


  2. Ask about "for the time being": does that qualifier mean the claim is only a
  use-right that expires when you leave the seat — i.e., no exclusion of latecomers
  from unoccupied seats, and no inheritance? Then: does that give an argument that
  a nation can exclude from what it''s occupying but not from "waste" places — and
  how does that hook up with the later part of the chapter on occupying waste places?


