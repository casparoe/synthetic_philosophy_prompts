  a unique solution (1/2) via invariance under scale and translation (group invariance
  / maximum entropy). Also relevant: the difference between the paradox being about
  "random chord" being ambiguous vs. the principle of indifference failing; Van Fraassen''s
  reflection; the role of physical setup (e.g., tossing straws — Jaynes''s experiment
  with straw tosses gave 1/2). Also relevant distinction: the principle of indifference
  applied to different partitions (chords parameterized by distance from center vs.
  by midpoint area vs. by endpoints) — a partition-dependence problem (the "cube paradox"
