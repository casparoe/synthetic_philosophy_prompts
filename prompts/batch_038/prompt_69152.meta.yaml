  Anekāntavāda''s real content: ontological plurality of aspects in a single entity
  (anekānta), the doctrine of conditioned assertion (syādvāda) as an epistemic/linguistic
  discipline, and the doctrine of standpoints (nayavāda) that classifies partial viewpoints
  and detects when a viewpoint is being asserted as the whole truth (i.e., duragraha
  / one-sided grasping — "nayābhāsa", the fallacy of confusing a naya with the complete
  truth). The sevenfold schema gives a combinatorics of assertions relative to a substance
  (dravya), place (kṣetra), time (kāla), and mode/state (bhāva) — that''s important:
  qualification is always relative to these four parameters. That gives a genuinely
  operational procedure: before assessing two contradictory claims, specify the dravya/kṣetra/kāla/bhāva
  parameters for each; if they differ, the contradiction is apparent; if they coincide,
  the contradiction is real and one must be false; and where neither, the residue
  may be "indescribable" (avaktavya) — not expressible within the available conceptual
  vocabulary, which is a distinct category from "we don''t know yet."


