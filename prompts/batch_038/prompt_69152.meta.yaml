  Para 1: "I am a professor of philosophy and, for the past four years, reviews editor
  of a mid-sized interdisciplinary journal that publishes across philosophy of mind,
  philosophy of language, and the history of South Asian philosophy. We receive about
  180 manuscripts a year and desk-reject roughly half. Of those sent out, in something
  like a third of cases our two referees return verdicts that are not merely different
  in emphasis but flatly contradictory: one asserts the central claim of the paper,
  the other denies it, and each takes the other''s obviousness to be a sign of incompetence.
  My associate editors, who are not specialists in Indian philosophy and who between
  them handle the bulk of these cases, currently resolve them by instinct — usually
  by averaging, or by deferring to whichever report is longer. I have been teaching
  anekāntavāda for some years and I have become convinced that the Jain apparatus
  of syādvāda and nayavāda is the best-developed theory we have of exactly this situation:
  two assertions, each defensible from within its own parameters, apparently incompatible,
  and a need to decide whether the incompatibility is real. I want to put that apparatus
  to work in the editorial handbook."


  Para 2: The deliverable. "Write a decision procedure... constraints: two pages,
  25 minutes per manuscript, the associate editor will have the manuscript, the two
  reports, and nothing else — no ability to consult the specialist literature, no
  third referee in the ordinary case; the editor-in-chief signs off on any rejection,
  so every verdict the procedure generates has to come with a written rationale that
  could survive being read by the author and by an appeals committee."


  Then the content demands:

  - Step 1: fix the object and the parameters — each report is a predication about
  something, qualified (or tacitly unqualified) with respect to substance, place/domain,
  time, and mode/state. Require the associate editor to write out, for each report,
  what the predicate is attached to and along which of these axes the report is implicitly
  restricting itself. Say what to do when a report cannot be so parsed, and whether
  an unparseable report is thereby disqualified.

  - Step 2: identify the standpoint — including the broad split between judging a
  thing by what it is across its states and judging it by the particular state it
  is in now. Detect when a standpoint is being asserted as the whole account — which,
  as I read the tradition, is the specific error nayavāda is meant to catch, and which
  I suspect is what is actually happening in most of our contradictory pairs.

  - Step 3: the contradiction test — do the two reports, once their parameters are
  written out, contradict on any single cell of the parameter grid, or do they contradict
  only when the grid is collapsed? Give an explicit criterion, not a vibe.

  - Step 4: genuine contradiction — where the parameters coincide, the procedure must
  be able to select one report as better-supported and say so in words an author can
  be given; it must also say what to do when the two reports are contradictory and
  neither can be adjudicated with the material on the desk (send for a third report?
  return to the author with a demand for qualification? and how does one distinguish
  that demand from a demand that the author simply agree with one referee?).

  - Step 5: the residual — where the doctrine''s "inexpressible" category is supposed
  to bite. I want the procedure to distinguish three things that my graduate students
  habitually conflate: the case where the predicate does not apply because the parameters
  have not been fixed; the case where the relevant facts are not yet known to us;
