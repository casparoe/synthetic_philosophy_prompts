  Draft:


  ---


  I am currently drafting a proposal for a two-year workshop series in formal epistemology,
  funded for six residential meetings of about a dozen participants each, and I must
  commit to a spine of problems before the panel will consider it. The nominal theme
  is what a rational agent should do upon learning a conditional — the territory opened
  up by van Fraassen''s Judy Benjamin case — but a theme is not an agenda, and I have
  no interest in six meetings that amount to a tour of positions.


  Here is the terrain as I presently map it. Candidate problems include: (i) whether
  the case admits of a unique correct posterior at all, or whether it is irreducibly
  underdetermined by the evidence the agent receives; (ii) whether the appropriate
  constraint falls on the odds within the antecedent partition, on the probabilities
  of the complement, or somewhere else; (iii) what happens when conditionals arrive
  in sequence, and whether the resulting posterior depends on the order in which they
  were learned; (iv) how the treatment should go when the antecedent is one the agent
  already assigns very low credence; (v) whether conditional probability should be
  taken as primitive — the Popper-function or Rényi-style approach — and whether that
  manoeuvre genuinely resolves the problem or merely relocates it; (vi) how an agent
  should accommodate uncertainty about the reliability, or the epistemic standpoint,
  of the informant who supplies the conditional; (vii) the suppositional or Adams-conditioning
  line, on which learning a conditional is not learning a proposition at all, and
  what survives of the problem if that is right; (viii) whether diachronic coherence
  considerations — the usual betting arguments — constrain the choice among rules
  at all, given that the agent is not being asked to bet on the report itself; and
  (ix) whether any of this makes a difference to what the agent should subsequently
  do, as opposed to what she should believe.


  Now let me introduce a case of my own construction, since I suspect it may reorder
  that list. Call it Benjamin Twice-Told. The setting is the familiar one: a region
  divided into a Blue half and a Red half, each subdivided into a northern and a southern
  sector, with the agent uniform over the four sectors. But rather than a single report,
  she is handed one sealed message containing two sentences from two informants whom
  she takes to be equally and independently reliable, and whom she has no reason to
  think have been comparing notes. The first writes that if she is in the Blue half,
  the probability that she is in Blue-North is three-quarters. The second writes that
  if she is in the southern sector of whichever half she occupies, the probability
  that she is in the Blue half is one-quarter. The two sentences arrive together,
  and neither is addressed to her prior as it stood before the other.


  My question is not primarily how to solve that case, though I would want you to
  say whether you think it is jointly consistent, and whether the familiar rules handle
  it, mishandle it, or simply fail to apply. My question is what to do with the six
  meetings. So: which of the problems above — and Benjamin Twice-Told is offered as
  a possible candidate in its own right — should the series take as its spine, and
  in what order? Defend the ordering rather than merely presenting it. For each item
  you place high, explain what makes it upstream of the others; say whether it is
  tractable with the conceptual and mathematical tools available now, or whether it
  is blocked on something not yet in hand; and distinguish it from items that I should
  cut outright, with reasons. I would also like you to be explicit about the criteria
  you are trading off against one another — centrality, tractability, how much else
  depends on the answer, and how likely a mixed group of philosophers and probabilists
  is to make progress in two days rather than talk past each other — and to say where
  you are weighting one against another rather than satisfying both.


  Two further things. First, tell me for each of your top three what would count as
  genuine progress inside a single meeting: the sort of deliverable a dozen people
  could produce in two days that would be worth having. Second, tell me what I should
  watch for over the next two years that would make you demote one of your priorities
  or promote one of the items you have cut. Please write throughout in British English,
  and keep the response to analysis and argument: I have no need of a bibliography,
  a reading list, or any references at all.


