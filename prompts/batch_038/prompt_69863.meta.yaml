  For thirty-six years I ran the analytical section of a public health laboratory,
  and most of that time was spent under a quality regime in which no method was permitted
  to generate a reportable result until it had been formally validated: specificity,
  limit of detection, precision within and between operators, robustness, an uncertainty
  budget, and a traceable reference standard against which the whole chain of inference
  could be audited. Since retiring I have been reading philosophy of mind with a local
  group, and it has struck me that the most famous procedure in that field for deciding
  whether a system has a mind is discussed as though it were an experiment, an assay,
  a test in the laboratory sense, while almost nobody asks what it would look like
  if it were actually held to the standards we applied to a method for determining
  lead in drinking water. I should like to see what happens when it is.


