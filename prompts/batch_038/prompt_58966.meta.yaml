  Paragraph 2: the numbered list with enough substance.


  1. When a large number of ordinary citizens decide a question together, the decision
  tends to be better than one made by a smaller number of better-informed people,
  because each contributor notices something the others missed and individual mistakes
  largely cancel. I think this is the strongest argument for the Athenian Assembly
  over, say, a council of experts, and I want it to carry weight for modern citizen
  assemblies too.


  2. This advantage depends on speech: what makes the pooling work is that people
  argue in front of each other before voting, so bad proposals get exposed. I don''t
  think you can have (1) with a silent ballot and no debate.


  3. In an institution where every decision is reached by persuasive speech before
  a large crowd, the outcome tracks whoever speaks most effectively, and this is a
  predictable property of the design rather than a corruption introduced by particular
  dishonest men. Cleon and Alcibiades are symptoms.


  4. The Mytilenean reversal is my central positive case. In 427 the Assembly decreed
  the execution of all adult men on the island and sent a ship to carry it out; the
  next day it reconvened, was persuaded the other way by Diodotus, and dispatched
  a second ship which overtook the first just in time. I count this as the institution
  correcting itself: the same body, the same procedures, one day apart, produced the
  opposite and better verdict. I first noticed this pattern in my own school''s student
  senate, which passed a resolution on a Tuesday and quietly repealed it on Wednesday,
  and I''ve been calling the pattern a cooling-off correction — a body that revisits
  a decision after an interval tends to reverse the ones that were made in a hurry.


  5. Sicily is my central negative case, and I explain it structurally: once the decision
  had been exported and an armadas was operating a thousand miles away, the Assembly
