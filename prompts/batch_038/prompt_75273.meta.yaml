  Afriat''s theorem: Given a finite data set of price-quantity observations, the following
  are equivalent: (1) the data satisfies the Generalized Axiom of Revealed Preference
  (or the Afriat inequalities are solvable); (2) the data is consistent with utility
  maximization by a locally non-satiated utility function; (3) the data is consistent
  with a concave, monotone (increasing) utility function; (4) there exist Afriat numbers
  U_t > 0 and λ_t > 0 satisfying λ_t p_t·(x_s − x_t) ≤ U_s − U_t for all t,s.


  So yes: Afriat''s theorem establishes that rationalizability is a testable, non-vacuous
  property and gives a constructive procedure. It''s the opposite of "anything can
