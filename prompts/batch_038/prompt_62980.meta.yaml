  Key premises of Kim''s exclusion argument:

  1. Causal closure of the physical domain (every physical event has a sufficient
  physical cause).

  2. Exclusion: no single event has more than one sufficient cause occurring at the
  same time (no systematic overdetermination).

  3. Distinctness: mental property M is distinct from physical property P.

  4. Therefore M is causally inert with respect to physical effects (epiphenomenalism),
  unless M = P.


