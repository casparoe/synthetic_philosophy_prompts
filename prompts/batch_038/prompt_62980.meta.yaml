  ward, a municipal budget office — not a physics lab or a sci-fi scenario.

  - There is a higher-level property H of an object/system and a lower-level property
  L, with L realizing H on that occasion.

  - The effect E is a physical event, and the physical domain is closed with respect
  to E: there is a sufficient physical causal story at the level of L.

