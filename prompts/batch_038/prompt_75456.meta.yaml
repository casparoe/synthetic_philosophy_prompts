  Good combination: Good''s theorem on value of information — formal domain, lends
  itself to games with payoffs. Good''s theorem: expected value of free information
  is non-negative (for a Bayesian decision maker who will update by conditionalization
  and whose decision is based on maximizing expected utility). It can be zero but
  not negative. Key subtleties: the theorem requires (a) the decision at the later
  time is made by maximizing expected utility relative to the updated posterior, (b)
  the utility function doesn''t change, (c) no cost of information, (d) the agent
  doesn''t take actions that change the state, (e) "expected value of information"
  measured before receiving info. Interesting failure modes: value of information
  can be negative if the agent is not a strict expected-utility maximizer (e.g., ambiguity
  averse / Ellsberg-type, or if the agent''s preferences violate dynamic consistency),
  or if learning changes the agent''s utilities, or if information has a cost. Also
  there''s the phenomenon where an agent who plans to update non-conditionally, or
  who has "second-order" preferences, can be money-pumped. Also: the intuition that
  "more information can never hurt" vs. cases like the surprise party / knowing whether
  your spouse bought you a gift (Harms? Actually the classic example: learning the
  contents of a surprise party could ruin the utility because your utility depends
  on being surprised — that''s a case where the utility function is state-dependent
  on your beliefs). Also "costly information" and "willful ignorance" — e.g., doctors
  avoiding tests, or the case where a decision-maker would prefer not to know because
  knowledge triggers an obligation.


