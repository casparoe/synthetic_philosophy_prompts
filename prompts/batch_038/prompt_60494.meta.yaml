  Final draft:


  ---


  I am preparing a handout for a graduate seminar session on updating under uncertain
  evidence, and I need a thought experiment built to a precise specification. The
  purpose of the case is to make a formal feature of Jeffrey conditionalization visible
  to students who have only just met it: successive updates on different partitions
  are known not to commute, and I want them to see that this is not a curiosity confined
  to the algebra but something an agent can, in principle, act on. A case that merely
  announces the divergence, or that is rigged by stipulating the numbers so the point
  comes out right, defeats the purpose; the divergence has to fall out of a scenario
  that is independently intelligible.


  Background to state in the handout itself: the agent has a fixed prior over a hypothesis
  H and over each of two two-cell partitions, {A, ¬A} and {B, ¬B}. Ambiguous evidence
  bearing on the first partition moves her to P(A) = q, and she updates by Jeffrey
  conditionalization, P′(H) = q·P(H|A) + (1−q)·P(H|¬A), with the conditionals held
  fixed; likewise for the second.


  The scenario. A single realistic professional setting — a clinician, an analyst,
  an editor, an assessor, whatever fits — in which the agent controls the order in
  which she obtains two pieces of evidence, and each piece, once obtained, yields
  a genuinely inconclusive result rather than a determination. The final credence
  in H must differ between the two orders by enough to flip a decision she faces.
  And the agent must be able to foresee this in advance: before taking in either piece
  of evidence, she knows from prior experience with both roughly how each will move
  her, well enough to predict which order leaves her with the more comfortable posterior
  and to choose accordingly.


  Constraints.

  1. The inconclusiveness must not be curable by trying harder. If the agent could
  resolve either piece of evidence into certainty at reasonable cost, the case degenerates
  into a lesson about gathering better evidence.

  2. No reinterpretation mid-case: the agent may not change her mind about what either
  piece of evidence means, and her conditional probabilities may not shift for reasons
  other than the updates themselves.

  3. Report the arithmetic for both orders with numbers a student can follow by hand
  in two or three minutes.

  4. Tell me whether the exploit can be built with both updates satisfying the rigidity
  condition, or whether it requires rigidity to fail at some point. If it requires
  failure, say so explicitly, and build the case so the agent could not have detected
  the failure beforehand.

  5. Confront the obvious objection to the foresight requirement: an agent who can
  predict her own future shifts seems either to already possess the evidence, in which
  case there is nothing to update on, or to violate whatever constraint reflection-style
  considerations impose on predictions about one''s own future credences. Either design
  around this or report that it cannot be designed around.


  Analysis to follow the scenario.

  (a) The two orders worked through, with the resulting credences and the decision
  each supports.

  (b) An identification of the structural feature doing the work — what must hold
  of the relationship between the two partitions and of H''s conditional probabilities
  for order to matter — and a check that removing it collapses the case to order-independence.

  (c) A verdict on what the case shows: whether an agent''s being able to select an
  evidence order for its downstream effect indicts Jeffrey conditionalization as a
  norm, or shows only that the norm is incomplete and needs a supplementary requirement
  — for example one that bars order-sensitive sequences, or one that directs the agent
  to update in a single step on the partition generated by the two experiences together.
  If the second, say what that requirement prescribes for an agent who genuinely cannot
  entertain the joint partition.

  (d) The strongest reply available to a defender of the standard view — most plausibly,
  that the two experiences are really one piece of evidence taken in two instalments,
  so that no second update occurs — together with an assessment of whether that reply
  is available in this particular case.


