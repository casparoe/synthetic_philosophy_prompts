  I teach a formal epistemology seminar and want a thought experiment I can hand out
  before we discuss updating on uncertain evidence. Here is the specification, and
  the point of the exercise is that the case must generate the verdicts rather than
  stipulate them.


  Setup you may assume and should state explicitly in the scenario: the agent has
  a fixed prior over a hypothesis H and over a two-element partition {E, ¬E}. She
  receives ambiguous evidence that shifts her credences over the partition to q and
  1−q, with q strictly between 0 and 1, and updates by Jeffrey conditionalization:
  P′(H) = q·P(H|E) + (1−q)·P(H|¬E), holding the conditionals P(H|E) and P(H|¬E) fixed.


  What I want built: a single realistic scenario — a professional context, no clairvoyance,
  no science fiction — in which the same agent receives two pieces of ambiguous evidence,
  A and B, each shifting a different partition short of certainty, and the final credence
  in H depends on the order in which she takes them in. The order-dependence must
  be large enough to matter for a decision the agent has to make (say, whether to
  act on H), and — this is the part that makes it worth assigning — the agent must
  be able to foresee, before she takes in either piece of evidence, that the order
  will matter and which order serves her interest.


  Constraints:

  - Neither piece of evidence may be one she could have gotten with certainty by trying
  harder; the ambiguity has to be genuine and unmoved by effort, or the case just
  becomes an admonition to look again.

  - Each individual update must satisfy the rigidity condition... Actually here''s
  the interesting bit: I want you to tell me whether the case can be built with both
  updates satisfying rigidity, or whether the exploit requires rigidity to fail somewhere.
  If it requires failure, say so plainly and build the case so that the failure is
  something the agent could not have detected in advance.

  - No appeal to the agent''s changing her mind about what the evidence means.

  - The numbers should be simple enough that a student can check them by hand in a
  couple of minutes. Give me the arithmetic for both orders.


  Then, after the scenario:

  1. Walk through the two orders and show the difference in P(H).

  2. Identify the structural feature of the case that produces the divergence — what
  has to be true of the two partitions and of H''s conditional probabilities for the
  order to matter.

  3. State what happens when you remove that feature, and confirm that the case collapses
  to order-independence.

  4. Give the honest verdict on what the case shows: does the possibility of choosing
  an evidence order for its downstream effect indict Jeffrey conditionalization as
  a norm of rationality, or does it show that the norm is incomplete — needing a supplementary
  requirement, for instance one that forbids order-sensitive sequences, or one that
  requires the agent to take in the evidence jointly on the coarsest common refinement?
  If the latter, say what such a requirement would have to say about an agent who
  genuinely cannot access the joint partition.

  5. Note how a defender of the standard view would attack the case — most obviously
  by denying that the agent''s two experiences are really two pieces of evidence rather
  than one, and say whether that reply is available here.


  Write it up as an assignment sheet: the scenario in a few paragraphs, the calculations
  laid out, and the discussion questions. I''ll add the citations myself; just refer
  to positions and results descriptively.


