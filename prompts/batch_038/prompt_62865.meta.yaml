  of the speaker''s trustworthiness; you can hear a true statement from a liar and
  still know it.

  3. A: but then knowledge from testimony would be indiscriminate — you''d know things
  from liars too. Something has to gate it, and the only candidate is reliability,
  and tracking reliability is just inference.

  4. B: Nyāya has a resource for this: yogyatā (semantic fitness) and the notion that
  a defect in the cause produces non-knowledge, so a false statement just fails to
  produce knowledge. The gating is causal, not inferential. Also the four conditions:
  ākāṅkṣā, yogyatā, āsatti, tātparya.

