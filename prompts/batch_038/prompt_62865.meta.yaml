  4. Marcus: Neither horn. The filter is causal, not inferential. Nyāya is externalist
  here: a knowledge source is a cause that produces a cognition that doesn''t misrepresent.
  A liar''s sentence fails to be a knowledge-producing cause; the hearer doesn''t
  need to have spotted the defect any more than you need to notice your eyes are jaundiced
  to fail to see white as white. So testimony can be reliable-only-when-the-speaker-is-trustworthy
  without the hearer having to infer trustworthiness. Same structure as perception:
  your vision can be reliable without you ever reasoning about it.


  5. Deepa: But that concedes my point about counting. If the reason testimony is
  a pramāṇa is just that it''s a distinct reliable causal route, then you get as many
  pramāṇas as there are reliable causal routes — memory, a telescope, a calculator,
  a dog''s nose, a well-made map. You''ve lost the principled stopping point. The
  Buddhists'' reason for exactly two is that they individuate by object: particulars
  are given by perception, universals/relations by inference. That''s a real criterion,
  and testimony has no object of its own — sentences about stoves are about stoves.


  6. Marcus: Two responses. First, the object-criterion is question-begging against
  testimony: it assumes everything knowable is either a particular present to the
  senses or a generalization over such, which rules out exactly the things the Naiyāyika
  thinks testimony is needed for — dharma, the nature of liberation, the specific
  merits of a ritual act. None of these are perceptible and none admit of a pervasion
