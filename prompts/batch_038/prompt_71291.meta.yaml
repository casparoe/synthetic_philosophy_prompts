  Good in-the-weeds Jeffrey conditionalization issues:

  1. Why Jeffrey conditionalization preserves conditional probabilities (rigidity)
  and what''s problematic about it: the rigidity condition is a substantive assumption,
  not automatic. Cases where it fails (e.g., "colour experience shifts your conditional
  probabilities about the external world").

  2. The claim that ordinary conditionalization is a special case of Jeffrey conditionalization
  (when the new probability of E becomes 1). Easy to explain but not deep.

  3. Commutativity/order-independence: Jeffrey updates commute under rigidity but
  can fail if... Actually there''s a known result: Jeffrey conditionalization is commutative
  when the partition-based updates are jointly rigid. Diaconis & Zabell showed Jeffrey
  conditionalization is the unique rule satisfying certain conditions and that it
  can be derived from minimizing relative entropy.

  4. The "problem of old evidence" and whether Jeffrey conditionalization helps: since
  Jeffrey allows updating on E without P(E)=1, it might seem to dissolve Glymour''s
  problem, but it doesn''t in general — it explains how evidence you already believed
  at probability 1 can be downgraded.

  5. Whether Jeffrey conditionalization is really "non-evidential" — the worry that
  it licenses updating on nothing at all (arbitrary probability shifts), and the response
  that it''s constrained by rigidity and by the requirement that the shift be caused
  by experience in the right way. There''s a known worry: if any shift in the probabilities
  of the partition is allowed, the rule is vacuous — it''s a rule for propagating
  changes, not a rule for making them. That''s a nice conceptual point: "Jeffrey conditionalization
  is not a rule of evidence but a rule of coherence given evidence shifts." Explaining
  why it''s sometimes said that JC tells you what to do once you''ve been given a
  new probability distribution over the partition, but not how to get that distribution
  — the "input problem."

  6. Cross-entropy / information geometry: why JC minimises relative entropy; why
  the resulting posterior is a weighted geometric-ish mixture. Actually there''s an
  interesting conceptual fact: the JC posterior is not the arithmetic mixture Σ P_new(Ei)
  P(·|Ei)... wait, it IS exactly that: P_new(H) = Σ_i P_new(Ei) P(H|Ei). That''s an
  arithmetic mixture of conditional distributions, weighted by new partition probabilities.
  And this equals the I-projection minimising KL(P_new || P_old) subject to matching
  partition probabilities. Nice.


