  False presupposition: "generally understood as the working out of Rousseau''s general
  will" — this is a contested thesis (associated with a certain reading, e.g., Talmon''s
  "totalitarian democracy," and with Furet''s ideological account; Jacob Talmon; also
  the older line tracing Robespierre to Rousseau). Historians dispute the Rousseau→Terror
  link strongly; Rousseau''s influence on Robespierre''s actual policy is thin, and
  the Terror is better explained by war emergency, the federalist revolt, popular
  pressure, the Law of Suspects, etc. Also "extended the machinery of revolutionary
  justice for another year" — actually the Thermidorians dismantled the revolutionary
  government relatively quickly: the Law of 22 Prairial was repealed the day after
  9 Thermidor; the Revolutionary Tribunal was reorganized and eventually suppressed
  (May 1795); the Jacobin Club was closed (November 1794); the revolutionary committees
  were pared back; the Terror was "ended" — though there was the White Terror (anti-Jacobin
  violence) in the south and the Prairial uprising suppression (May 1795), and the
  Constitution of Year III with its two-thirds decree, and the Directory''s exceptional
  measures (the Law of Hostages 1799, deportations to Guyane after Fructidor). So
  the presupposition "preserved and extended the machinery for another year" is partly
  false — but partly arguable (Fructidor deportations were extralegal). This makes
