  The false presupposition: the "branch where they were never born" is not a thing
  in Everett — Everett branching is not triggered by time travel; in a single-history
  Everett picture, if you go back in time and kill your grandfather, the *same* branch/history
  contains both your birth and the killing, which is contradictory — the many-worlds
  "solution" typically invokes the traveler entering a *different* branch whose history
  differs, but then the branch''s past must already contain the traveler''s counterpart
  or not; more importantly, the standard criticism is that Everett doesn''t solve
  the paradox but relocates it: the traveler doesn''t travel to *their own* past,
  so it isn''t time travel in the sense at issue (it''s inter-branch travel), and
  if it is genuinely their own past, the killing is inconsistent with their birth
  and Everett''s linear unitary dynamics gives no mechanism for splitting *that* history
  into two with a contradiction. Also: "the successful assassin ceases to exist" —
  in the multiverse reply, the traveler persists in the branch (they don''t retro-erase);
  their nonexistence in the new branch''s history is a grandfather-paradox-in-miniature:
  they exist in a branch whose past lacks their birth, which is a *bilking*-style
  inconsistency but not a contradiction — it just means they''re an exogenous intruder.
  So the "worry" is actually the reverse of what the multiverse reply is designed
  to avoid.


