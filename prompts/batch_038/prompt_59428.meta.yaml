  Also consider whether the challenge I pose is one Quine can actually answer with
  real resources (the instruction: "Give the character a real position with real resources,
  not a caricature"). Quine''s resources:

  - Holism: disagreement need not be located in any single sentence; it can be resolved
  by different total-system adjustments — underdetermination of theory by evidence.
  Two empirically equivalent total theories can differ; the choice between them is
  pragmatic (simplicity, conservatism, fecundity). So moral disagreement among people
  who agree on all observational facts is exactly a case of underdetermination: each
  is choosing a different total system, and the choice is governed by pragmatic maxims,
  not by further observation. That''s a genuinely good Quinean answer, and it lets
  him bite the bullet: there is no fact of the matter beyond the pragmatic virtues;
  but he''d resist "mere sentiment" because the pragmatic maxims are themselves part
  of the naturalistic picture and because moral claims, once adopted, have consequences
  for expectations (e.g., predictions about behavior, sanctions, cooperation).

  - Also: Quine would say moral statements are not isolated; they are linked to the
  rest of the web via "sentiment" but sentiments are themselves empirical facts about
  people — so a naturalist can study them (psychology, biology). The disagreement
  can sometimes be traced to differences in non-moral beliefs that are themselves
  underdetermined or to differences in conditioning.

  - And he might invoke the indispensability criterion: are moral facts needed in
  our best explanations? He''d likely say no — moral posits don''t do explanatory
  work the way physical posits do — so his ontological commitment to moral facts is
  thin; but the sentences still have truth values within the theory (he rejects the
  museum myth / non-cognitivist "no truth value" move).

  - Also his naturalized ethics: the way to ground ethics is to treat it as continuous
  with biology/social science; and famously he suggested that the only empirically
  groundable ethics might be a eugenic one (I''d avoid).


