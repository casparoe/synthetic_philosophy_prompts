  I have no academic training in philosophy — I run a small business — but I have
  spent the last year thinking hard about the line between therapy and enhancement,
  mostly because of one case that seems to me to break it: Oscar Pistorius. I want
  you to take on the role of a philosopher of medicine and bioethics who is also comfortable
  with the empirical sports-science side, and to work through the case with me carefully.
  Please think hard before answering, and begin with a short brainstorming pass in
  which you list the distinct questions you think I am asking and the places where
  they could come apart; only then move into the analysis.


  The facts I am relying on, so that you do not need to look anything up: Pistorius
  was a South African sprinter born with a congenital absence of the fibula in both
  legs, amputated below the knee in infancy, who ran on carbon-fibre prosthetic blades.
  World athletics'' governing body barred him from able-bodied competition on the
  strength of a commissioned biomechanics study, and in 2008 the Court of Arbitration
  for Sport overturned the ban. The panel''s reasoning was not that the blades conferred
  no advantage but that the federation had failed to discharge a burden of proof it
  had accepted: the study measured him only at top speed in a straight line, which
  is not what a 400m race is, and said nothing about his start, his acceleration,
  or his running of the bend. Years later the rule was rewritten so that the burden
  fell the other way — on the athlete using a prosthesis, to establish that it gave
  no overall competitive advantage — and a subsequent arbitration struck down that
