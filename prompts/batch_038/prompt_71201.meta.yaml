  twist that isn''t just the standard theorem: maybe the story involves a third party
  whose beliefs are private, so the common knowledge condition breaks. Or the twist:
  the characters reach agreement but realize that agreement destroys something valuable
  — e.g., disagreement was load-bearing for a relationship, or a market, or a legal
  system.


  Actually a nice angle: Aumann''s theorem plus the fact that in practice agreement
