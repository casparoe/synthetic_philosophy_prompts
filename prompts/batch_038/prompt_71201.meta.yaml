  Aumann''s agreement theorem: two rational agents with common priors, common knowledge
  of each other''s posterior beliefs, cannot agree to disagree. Great for a short
  story — e.g., a story about two people who keep updating on each other''s stated
  beliefs and converge, or a story where they fail to converge, which reveals something
