  Standard cases:

  1. Armstrong''s objection: a universe with only one particle moving in a straight
  line forever — Humean best system says Newton''s first law; but no necessitation.
  Hard direction?

  2. Carroll / Lange: worlds where the regularity holds but is a cosmic accident —
  Humean makes it a law; anti-Humean says not a law.

  3. Loewer''s reply: the Humean doesn''t need laws to explain; the explanatory work
  is done by the mosaic.

  4. The "underdetermination" case: two equally simple/strong systems disagreeing
  — Humean says no fact of the matter; anti-Humean says there is.

  5. Emery''s / Hicks''s objections: laws that don''t figure in explanation; laws
  that are false (probabilistic laws violated by chance).

  6. Anti-Humeanism''s problem: governing laws can''t explain particular events without
  circularity (the "explanatory circularity" objection).


