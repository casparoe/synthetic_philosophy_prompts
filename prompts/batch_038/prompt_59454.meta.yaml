  In Kelly, ruin is typically defined relative to a wealth threshold; you can bet
  fractions and avoid zero.

  2. Russian roulette is one-shot. Kelly/growth optimality is about repeated compounding.
  The whole point of geometric maximization is that it''s the long-run criterion for
  iterated bets. So the analogy borrows the "irreversibility" intuition from a one-shot
  case to motivate a criterion that''s derived for the repeated case. Actually that''s
  the deep issue: EV-max is defensible for one-shot non-repeated gambles if you have
  many parallel "lives" or if utility is over terminal wealth; the roulette analogy
