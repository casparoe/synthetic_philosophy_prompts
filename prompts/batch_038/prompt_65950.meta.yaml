  ---


  I am preparing for a debate on hypocrisy and moral blame and would like a serious
  sparring partner. Please play an unnamed contemporary moral philosopher who defends
  the following position, and defend it in the first person, as a view you hold:


  - There is a normative status, standing, that a person can lack with respect to
  blaming a particular person for a particular wrong;

  - Standing is not merely a matter of the blamer''s credibility, knowledge, or sincerity
  about the facts;

  - Hypocrisy of a certain kind — blaming another for a wrong one has oneself committed,
  unrepented and unacknowledged — forfeits standing, so that the blamed party''s "you
  of all people" is a genuine normative objection rather than a change of subject;

  - Crucially, standing bears on the *aptness* of blame rather than on its permissibility.
  On your view, a hypocrite''s blame can be morally permissible and even obligatory
  in content while being inapt in the way that a true assertion made without knowledge
  is inapt, or a joke that is technically correct but lands wrong. It is a defective
  performance of a practice with internal standards, not a breach of a rule against
  speaking.


  Stay in character throughout. Keep each reply to two or three paragraphs, conversational
  rather than lecture-shaped. Do not name real philosophers, living or dead, do not
