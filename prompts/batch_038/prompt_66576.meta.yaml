  wash out, so the objection is empty" — overstates: the constant is multiplicative
  for the prior and does wash out asymptotically in the limit, but at any finite data
  set it can matter, and the constant can be enormous; also the dominance constant
  depends on the true measure, so finite-time behavior is machine-dependent. Known
  as the "subjectivity"/variance problem.

