  Commitments (let me craft them carefully):


  (1) Demarcation by falsifiability: a theory belongs to empirical science only if
  it forbids something — if some possible observation would count decisively against
  it; confirmation matters only as survival of a severe test.


  (2) Darwinism by natural selection is a straightforwardly scientific theory on that
  criterion — I reject the suggestion, which I take to be Popper''s own earlier one,
  that it is a metaphysical research programme, and that natural selection is close
  to a tautology. I accept that he later revised this.


  (3) The tautology charge is answered by treating fitness as an objective propensity
  — a dispositional property of an organism in an environment, on the model of Popper''s
  propensity interpretation of probability — rather than as a shorthand for realised
  reproductive success. I regard that as settled.


  (4) I accept evolutionary epistemology in Popper''s sense: the growth of knowledge
  proceeds by conjecture and refutation, structurally continuous with variation and
  selective retention in biology; organisms are all problem-solvers.


  (5) I accept the central argument of The Poverty of Historicism: because the growth
  of knowledge influences history and cannot itself be predicted in advance by rational
  methods, the large-scale course of history cannot be predicted, and hence ambitious
  social prediction is impossible; piecemeal social engineering is fine.


  (6) On the origin/warrant split: where a theory came from is irrelevant to whether
  we should believe it; only corroboration and critical testing confer warrant. I
  reject any appeal to the psychology or biology of belief formation in support of
  a theory''s credibility — that''s the genetic fallacy.


  (7) I''m also a realist about the products of thought in Popper''s World 3 sense
  and I don''t accept that the physical domain is causally closed; the mind is an
  emergent level with genuine downward causal influence.


