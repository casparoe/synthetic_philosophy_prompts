  Key subtleties:

  1. The utilities must be interpersonally comparable (cardinal, and comparable across
  persons) for the equal-weights conclusion to be meaningful — indeed for the weighted
  sum to be well-defined, the u_i must be on a common scale. This is a big deal: the
  theorem presupposes the very thing utilitarians are accused of assuming (interpersonal
  comparability).

  2. Weymark''s critique (1991, "A Reinterpretation of Harsanyi''s Social Welfare
  Theorem"): the theorem is about aggregating preferences, not well-being, and the
  "utilities" are vNM indices unique up to positive affine transformation, so the
  theorem establishes something weaker than classical utilitarianism — it doesn''t
  show that well-being sums, it shows that a social preference satisfying Pareto and
  expected-utility axioms is a linear combination. Weymark: Harsanyi''s theorem does
  not establish utilitarianism; it establishes "Bernoullian utilitarianism" or rather,
  it''s about social preferences over prospects.

  3. The Pareto principle in the theorem is about ex ante Pareto over prospects, and
  the theorem''s conclusion gives ex ante aggregation. But applying it as ex post
  (summing realized utilities) requires the further step that the social evaluation
  of outcomes is also a linear sum — this is the "ex ante vs ex post" issue (Hammond,
  Broome, Mongin). Actually the ex ante Pareto principle plus linearity gives an ex
  ante utilitarian result; ex post utilitarianism (sum of utilities in the realized
  state) is not implied. This is a known subtlety discussed by Mongin and by Broome.

  4. Anonymity is not implied by Pareto — you need it as an extra assumption to get
  equal weights. Harsanyi''s own "impartial observer" / "extended sympathy" argument
  is meant to derive equal weights, but critics say it assumes the observer''s preferences
  are a mixture of the individuals'' — which is question-begging.

  5. The theorem does not "prove" utilitarianism as a moral doctrine — it doesn''t
  say well-being is the only thing that matters, doesn''t handle rights/justice, doesn''t
  settle population ethics (variable populations).

  6. The vNM axioms applied to the social preference are a substantive assumption
  (the "social rationality" axiom), and it''s this that does a lot of the work — indeed
  one can derive linearity from social vNM + Pareto alone; conversely, if you drop
  social vNM (e.g., allow the social preference to violate independence/continuity),
  Pareto alone doesn''t force summation. This is important: many popular accounts
  say "Pareto + interpersonal comparability ⇒ utilitarianism," omitting that the social
  preference must itself satisfy the expected utility axioms — the independence axiom
  in particular is where the linearity comes from.

  7. Sen''s objection: vNM "utility" in the theorem is preference-satisfaction / choice-based,
  not well-being; and Sen argues the theorem works with "utility" defined narrowly,
  and that interpersonal comparison of well-being requires more.

  8. Also the theorem is a conditional/structural result: given the assumptions, the
  aggregation is linear. It doesn''t tell you the weights come from anywhere in particular.


