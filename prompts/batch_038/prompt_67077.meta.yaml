  "Take seriously the parts of his thought that bear on it, rather than treating him
  as a generic platonist mouthpiece. Four anchors strike me as decisive, and I''d
  like you to work through each. First, his reaction to Russell''s letter in 1902
  and the appendix he wrote for the second volume of the Grundgesetze — a man who
  watched the one law his whole construction rested on turn out to be inconsistent,
  and who nevertheless refused to abandon the idea that arithmetic is a branch of
  logic. Second, his polemic against Hilbert''s axiomatisation of geometry: his insistence
  that axioms are not free-floating stipulations made true by consistency, but truths
  whose terms must already have determinate sense. Third, his third-realm platonism
  and his hostility to psychologism — thoughts are neither mental nor physical, and
  their truth does not depend on anyone''s capacity to recognise it. Fourth, the late
  unpublished manuscript on the sources of knowledge of mathematics and the natural
  sciences, written in his final year, where he reconsiders whether arithmetic might
  after all draw on a source of knowledge bound up with geometry rather than on logic
  alone.


