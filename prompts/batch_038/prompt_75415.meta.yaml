  ---


  I am putting together a small collection of original short fiction in which the
  plot itself — rather than any character''s remarks — carries a philosophical problem,
  and I would like to commission one piece from you. The subject is luck egalitarianism,
  and specifically the machinery a society would have to build in order to take the
  distinction between brute luck and option luck seriously as an operating rule rather
  than as a slogan.


  Setting and mechanism (please treat these as binding, and improve on them only where
  they are internally inconsistent):


  The jurisdiction I have in mind settles claims for compensation through a procedure
  its officers call the descent. A claimant who has been made badly off is owed a
  transfer, but only to the extent that the misfortune was not the upshot of their
  own choices. So the case officer does not simply ask whether the claimant chose
  the risk. The officer asks that question, and then asks it again of the answer:
  was the choice itself the upshot of something the claimant did not choose — their
  appetite for risk, the options they were actually presented with, the information
  they had, the way those options were worded, the temperament that made one of them
  look reasonable? Each answer opens another level, and the descent stops when it
  reaches a choice that cannot be traced further back to luck. That residue, and only
  that residue, is charged to the claimant; everything above it is compensated in
  full.


  Two further rules, which are where I want the story''s trouble to live. First, the
  descent is bounded: an officer may go down at most seven levels, after which the
  case closes at whatever depth was reached, so the amount a claimant owes turns partly
  on how far their file happened to permit the officer to descend. Second — and this
  is the part I most want dramatised — a level only counts as a genuine choice if
  the claimant''s deliberation at that point can be reconstructed from the record.
  Claimants who kept notes, who deliberated aloud in front of witnesses, who wrote
  letters weighing options, present the descent with material to work on, and are
  consequently charged. Claimants who acted impulsively, or whose paperwork is thin,
  leave the officer with nothing to descend into, and are compensated. The office
  does not regard this as a defect; it holds, sincerely and with arguments, that a
  choice one cannot show oneself making was not fully a choice at all.


