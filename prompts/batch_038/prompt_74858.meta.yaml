  the 1894 Census of Hallucinations: a mass questionnaire that asked roughly 17,000
  people whether they had ever had a vivid sensory impression of a person in fact
  absent, and then tested whether the number of such impressions coinciding with that
  person''s death exceeded what chance alone would predict. He also wrote in 1877
  on the ethics of belief — on how much assent we owe to a proposition given the evidence
  for it — and, in The Methods of Ethics, left the ''dualism of practical reason''
  unresolved in part for want of assurance that the universe is morally governed.


  Now suppose Sidgwick were shown the state of this field today: a century and a half
  of continued investigation, culminating in preregistered, high-powered, multi-laboratory
  replications of precognition and ''presentiment'' experiments that return null results;
  a widely publicized 2011 precognition study in a mainstream psychology journal that
  several independent teams failed to replicate; and a statistical apparatus — preregistration,
  power analysis, p-curve and bias-detection methods, meta-analytic sensitivity to
  selective reporting — of which he had no inkling. Suppose further that a modern
  statistician tells him that the Census itself was not merely underpowered but structurally
  confounded: it could not rule out selective recall, retrospective reinterpretation,
  or ordinary family knowledge of a relative''s illness.


  Questions:

  1. How would Sidgwick respond to the reclassification of his own flagship study
  from positive evidence to invalid design? Distinguish the reply that preserves his
  evidential principles from the reply that would require him to abandon them.

  2. Would he treat the accumulated null results as evidence against telepathy and
  survival, or as merely the continued absence of evidence? His census was built to
  detect an excess over a chance baseline; explain what that framework implies about
  the evidential force of a well-designed null, and whether he could consistently
  resist it here.

  3. What would he make of the new statistical tools? Which of them would he adopt
  eagerly as continuous with his own method, and which would he distrust — and would
  his worry about the opportunity cost of a research program that has failed for 140
  years be an evidentialist worry or a utilitarian one?

  4. If the survival hypothesis is now dead, what happens to the dualism of practical
  reason? Does he retreat to a postulate or a permissible hope, accept an unresolved
  tragedy, or find some third option you can reconstruct from his own commitments?


  Constraints: do not quote Sidgwick verbatim unless you are certain of the wording,
  and do not supply bibliographies or reading lists. Mark every substantive claim
  as (a) grounded in something Sidgwick actually argued, (b) an extrapolation licensed
  by his framework, or (c) your own speculation. Aim for 800–1000 words."


