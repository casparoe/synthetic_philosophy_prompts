  Option B: Dispositions/finks/masks desiderata. Very rich. Requirements a theory
  of dispositions must meet:

  1. Handle finks (Martin''s electro-fink: a wire that is disposed to conduct but
  a safety device removes the disposition when touched) — need to allow that the disposition
  can be lost at the moment of the triggering condition.

  2. Handle masks/antidotes (Bird: a fragile glass with a protective coating; the
  disposition persists but the manifestation is blocked) — need to distinguish intrinsic
  interference from extrinsic blocking; need a distinction between finking (disposition
  destroyed) and masking (disposition intact, manifestation prevented).

  3. Handle mimics (Handfield: something behaves as if disposed without having the
  disposition) — a conditional analysis would misattribute.

  4. Handle reverse finks / cases where a non-disposed object would manifest (an object
  that would behave as if fragile because of an external device).

  5. Handle multi-track dispositions (a single disposition with many stimulus-manifestation
  pairs) — simple conditionals force single-track.

  6. Avoid circularity: the "reformed conditional analysis" needs a complete specification
  of the circumstances, which seems to require mentioning the absence of finks and
  masks, which requires the dispositional vocabulary or an exhaustive list. Lewis''s
  fix: a "complete and specific statement of the circumstances" that must be intrinsic
  to... and must not be vague; the circularity worry (Bird''s objection that the ideal
  conditions must be defined as those in which the disposition manifests → circular).

  7. Respect the distinction between having a disposition and its degree/strength
  (probabilistic dispositions, masking partially).

  8. Allow for dispositions that never manifest (always masked / "dead" dispositions),
  and for bare dispositions without a categorical base (dispositional monism).

  9. Be consistent with the intuition that dispositions are intrinsic (or reject it:
  extrinsic dispositions like "flammable in this oxygen-rich room"? Actually, "being
  disposed to be water-soluble" is intrinsic, but "being vulnerable to attack" is
  extrinsic). Requirement: say whether intrinsicness is mandatory.

  10. Handle the relation between dispositions and laws/nomic necessity, and to counterfactuals
  (whether the analysis reduces dispositions to counterfactuals or vice versa).

  11. Handle the "conditional fallacy" (the analysis''s conditions must not include
  the disposition''s own removal).

  12. Handle stimuli that are disjunctive/unnatural, and the problem of specifying
  stimulus conditions non-circularly.

  13. Account for the fact that dispositions explain behavior (the causal efficacy
  requirement).

  14. Handle "always-on" dispositions like mass, charge — must not make them vacuous.


