  The classic combinatorial game theory result: strategy-stealing argument shows that
  the second player cannot have a winning strategy in a symmetric, monotone game (like
  Hex, or tic-tac-toe draw-or-win) — hence the first player has a winning strategy
  or can force at least a draw, non-constructively. Requirements for the argument:
  game is symmetric between players (positions interchangeable), extra moves never
  hurt (monotonicity), no zugzwang, perfect information, no chance, and the "steal"
  must be actually available — i.e., the extra move can be ignored or is harmless.


