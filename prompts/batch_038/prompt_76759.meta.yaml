  Invented case ideas:

  (1) The graduated mask: a masker that blocks the manifestation 90% of the time,
  so the object manifests only rarely. Does the object have the disposition simpliciter,
  or a weaker one? Tests whether the analysis can handle probabilistic/graded manifestation
  and whether it can separate the strength of the disposition from the reliability
  of the manifestation.

  (2) The stimulus-swap / cross-wired fink: a device that, upon the stimulus, removes
  disposition D1 and confers disposition D2, such that the manifestation of D2 is
  indistinguishable from the manifestation of D1. So the object shatters when struck,
  but not because it is fragile. That''s basically a mimic. Hmm.

  (3) The deferred restoration ("the sabbatical disposition"): a disposition that
  is removed during the stimulus window and restored microseconds later, leaving no
  trace. Is it a fink? Does it matter that nothing else changes?

  (4) The distributed masker: the masking is provided not by anything near the object
  but by a global field; if the field were switched off anywhere, the manifestation
  would occur. Tests intrinsicness and locality requirements: is the disposition intrinsic
  to the object? Here, the object''s disposition seems to depend on extrinsic facts
  about the whole environment, and the "ideal conditions" would have to include the
  absence of the field everywhere in the universe. That''s a nice stress case for
  the completeness clause: an infinite/holistic ideal-conditions specification.

  (5) The bootstrapping case: an object that has disposition D only because of a device
  that would remove D upon the stimulus, but the device''s removal of D is what makes
  the counterfactual "if struck, it would shatter" false, while the object''s intrinsic
  structure is exactly that of a paradigmatic D-bearer. That''s the fink basically.

  (6) A case aimed at the basis requirement: two intrinsically identical objects,
  one with a masker, one without; intrinsicness says both have the disposition; but
  their counterfactual profiles differ. This is the classic tension — good, well-known.

  (7) The "double mask" / masking of a mask: a device that would remove the masker
  if the stimulus occurred, so that the manifestation would occur — but the device
  itself is masked by a second device. Infinite regress potential; tests whether the
  analysis needs to terminate.

  (8) An "always-and-only-masked" disposition with a twist: the masker is intrinsic
  and permanent (built into the object''s structure), such that no possible stimulus
  in any possible world would produce the manifestation, yet the object''s microstructure
  is that of a paradigm bearer. Must the theory say it''s disposed? This is the "dead
