  A really good idea: the "logical space" of responses to the problem of evil can
  be organized by which premise of the argument the responseist rejects. Consider
  the evidential argument from gratuitous evil:

  P1: There exist instances of intense suffering which an omnipotent, omniscient being
  could have prevented without thereby losing some greater good or permitting some
  evil equally bad or worse.

  P2: An omniscient, wholly good being would prevent the occurrence of any intense
  suffering it could, unless it could not do so without thereby losing some greater
  good or permitting some evil equally bad or worse.

  P3: An omnipotent, omniscient being can do anything.

  C: Therefore, no omnipotent, omniscient, wholly good being exists.


  Responses: deny P1 (skeptical theism — we''re not in a position to judge; or: there
  are no such instances because all suffering serves a greater good); deny P2 (God''s
  goodness isn''t what we think — consequentialism doesn''t apply to God; God might
  have agent-centered restrictions; God is not obligated to maximize; or God''s goodness
  is expressed differently); deny P3 (process/kenotic/open theism); or reject the
  inference (the "no-see-um" inference is invalid — this is where the noseeum argument
  / the "inductive risk" debate sits, and also where the debate about whether Rowe''s
  premise is supported by inductive reasoning from what we do know sits).


