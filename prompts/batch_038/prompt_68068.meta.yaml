  Draft:


  ---


  I teach a graduate seminar on the philosophy of religion, and this term''s unit
  is the problem of evil. My students arrive holding positions they cannot articulate:
  they will insist that God must be able to justify any evil he permits, then in the
  next breath say that we are in no position to say what such justifications would
  look like, without noticing that they have just combined two responses that pull
  against one another. I want a decision tree that will sort them by what they are
  actually committed to.


  Constraints, in order of importance:


  1. The tree should begin downstream of the logical problem. My students already
  accept that Plantinga''s distinction between a defense and a theodicy dissolves
  the incompatibility argument, in the sense that God''s existence is logically compatible
  with evil so long as God might have a morally sufficient reason to permit it. So
  do not make "is the argument logical or evidential?" a branch. Every node should
  be a question that is live for someone who has already granted that much.


  2. Build the tree from the logical space, not from a list of names. Start by identifying
  the questions that genuinely partition the responses; then place positions at the
  leaves. I would like the questions stated first, as an ordered list, each with a
  one-line rationale for why it belongs at that depth rather than deeper or shallower.
  Only then should the tree be drawn.


  3. Each node must be phrased so that a student can answer it without knowing which
  leaf the answer leads to. In practice this means nodes should be concrete claims
  about cases, not questions about labels. "Do you think God''s reasons are beyond
  our ken?" is useless to me; a node should ask something like whether, in a world
  where a fawn is trapped in a forest fire and dies in agony over several days, the
  absence of any good we can discern that would justify that suffering is evidence
  that there is no such good, or merely evidence of our limitations.


  4. I want the tree to be sensitive to the type of suffering at issue, because the
  standard responses do not distribute evenly across it. Please include, at some depth,
  nodes that turn on: (a) suffering inflicted by the free choices of other agents;
  (b) suffering of beings who never develop the capacities that character-formation
  theodicies presuppose — the profoundly impaired infant, the non-human animal, the
  human being who dies in early childhood; (c) suffering that is horrendous in the
  technical sense: evil participation in which gives prima facie reason to doubt that
  the victim''s life could, on the whole, be a great good to them. A position that
  handles (a) and fails (b) should not end up at the same leaf as one that handles
  both.


  5. The leaves should include, at minimum: skeptical theism in its "noseeum"/CORNEA
  form; greater-good theodicies of the free-will and soul-making kinds as separate
  leaves; afterlife compensation; the felix culpa strategy; privation theory; kenotic
  theism; open theism; process theism; Adams-style "defeat of horrors" rather than
  justification; and anti-theodicy, i.e., the view that the project of justifying
  God is itself the objectionable move. Each leaf gets one sentence stating its most
  awkward commitment — the thing its defender least wants to say out loud.


  6. Where two answers to your nodes point to the same position, say so. I expect
  at least two such collisions; I want them named rather than papered over, with a
  note on what further question, if any, would separate them.


  7. Note the unoccupied cells. Some combinations of answers are logically available
  and have no defenders; for each, tell me whether nobody occupies it because the
  view is incoherent, because it is unattractive, or because it has simply not been
  tried. I suspect at least one genuinely interesting cell is empty, and I would rather
  find it by enumeration than by accident.


  8. Use standard names where they exist — CORNEA, trans-world depravity, middle knowledge,
  Irenaean theodicy — but do not give me a bibliography, and do not attribute any
  specific claim to a specific philosopher unless you are confident of the attribution.
  Positions, not people, are what I need the tree to sort.


  Length: something I can hand out. No more than two pages of tree, plus a page of
  notes for items 6 and 7.


