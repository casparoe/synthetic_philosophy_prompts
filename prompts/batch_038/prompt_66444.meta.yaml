  Let me now flesh out specific desiderata to inject:


  1. **Baseline-sensitivity.** Whether a given behavior counts as doing or allowing
  seems to depend on which trajectory of events we treat as the default, and there
  are usually several equally natural candidates. My draft clause requires the account
  either to be invariant under reasonable re-specifications of the default or to say
  which defaults are privileged and on what non-question-begging grounds. Case: a
  system that could have kept a patient on a ventilator and does not vs. a system
  that never had the patient on the ventilator. Or: a system that withholds a drug
  vs. one that withdraws it. Or, closer to the allocator: the resource is currently
  allocated to A by default policy; the system reassigns to B, and A dies. Is that
  doing harm to A or merely declining to prevent it? Under one description of the
  default, the system took something from A; under another, it declined to confer
  a benefit.


  2. **Scalability / the aggregation question.** Whether "many allowings" can compose
  into a "doing" — e.g., a policy that omits to act a million times, each omission
  trivially cheap to prevent. Whether the distinction admits of degree (a spectrum
  from paradigm doing to paradigm allowing) or is binary. If binary, why, given that
  the borderline cases are continuous.


  3. **Preemptive omission and mechanism-tampering.** Cases where the agent''s earlier
  act destroys the standing background provision that would otherwise have produced
  the good outcome — Bennett''s style cases: draining the tank, unplugging the alarm,
  disabling a failsafe that you yourself installed. The account must say whether an
  act that converts later inaction into harm is a doing, and must handle the ordering
  (which act is the morally relevant one).


  4. **Redirection vs. origination of a threat.** Thomson''s point: whether diverting
  an existing threat onto someone is doing harm. Needed because the allocator constantly
  redirects a scarce resource from one queue to another — it never originates the
  scarcity. If every redirection of an existing threat is a doing, the clause is paralyzing;
  if none is, it''s vacuous. The account must locate the line and tell me what does
  the work.


  5. **Epistemic relativity.** Whether the classification depends on what the agent
  knew or expected, or on the objective causal structure. An engineered system''s
  "allowings" are largely unmodeled consequences; if the distinction is epistemically
  relative, then the same physical behavior changes category as the system''s model
  improves, which makes the clause''s content depend on the sophistication of the
  system. Say whether that''s a bug or a feature, and whether the account can be given
  both an objective and an epistemic version consistently.


  6. **Non-collapse.** The account must not collapse into (a) the doctrine of double
  effect, (b) an account of intention, or (c) the positive/negative duties distinction,
  or must explain why collapse is fine. It should state what work doing/allowing is
  doing beyond intending.


  7. **Cost thresholds.** The standard picture: doing harm is worse than allowing,
  but allowing harm at low cost is still seriously wrong (shallow pond). The account
  must say whether the distinction''s force is a matter of the cost at which the duty
  to prevent binds, and hence whether it delivers a threshold or merely a shift in
  the exchange rate. This determines whether my clause can ever be satisfied rather
  than merely approximated.


  8. **Agent-relative vs. agent-neutral.** Whether the distinction is available only
  from inside the agent''s deliberative perspective or whether it can be stated as
  an agent-neutral feature of events — because a spec clause is written from outside,
  by a third party, about an agent. If the distinction is essentially first-personal,
  my clause may be inexpressible. This one is a nice, novel-ish twist.


  9. **Consistency with empirical results.** Whether the account must explain, rather
  than debunk, the pattern of ordinary judgments — omission bias, act/omission framing
  effects, and the fact that the intuition is fairly robust across cultures but modulated
  by cost and by vividness. The account should say which of these it treats as tracking
  something real and which it explains away; but a theory that explains away all of
  it has abandoned the explanandum.


  10. **Third-party/agent-boundary.** Where the doing/allowing line falls when harm
  is produced through another agent''s voluntary act, through a chain of automation,
  or through a natural process the agent merely unblocked. Needed because in my setting
  the system''s actions are mediated by human operators and other software.


