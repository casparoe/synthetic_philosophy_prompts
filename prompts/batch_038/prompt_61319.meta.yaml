  Draft:


  "I work on deployment reviews at a frontier lab, and I am assembling a handout for
  a mixed audience of research engineers and policy staff. The question the review
  must answer is whether a proposed safety measure actually provides security if the
  model is misaligned, or whether it quietly assumes the model is broadly on our side.
  I want a decision tree that takes an engineer from a description of a measure to
  a named category, and I want it usable by someone who has never read the control-versus-alignment
  literature.


  Requirements.


  1. Between five and seven branch questions, each answerable from a design document
  alone — that is, from what the measure does, who sees what, and what the model is
  told — with no more than three options each. None of the questions may contain the
  words ''control'', ''alignment'', ''scheming'', ''deception'', ''honest'' or ''cooperative'',
  and none may ask the engineer which camp they think the measure belongs to; the
  sorting must happen by what they say about the mechanism. Every question should
  be about a fact of the design (does the measure still work if the model knows it
  exists and has read its own specification? does its security rest on the model being
  unable to do something, on a human or another system seeing something, or on the
  model not wanting to do something? and so on) rather than about anyone''s attitude.


  2. The leaves. I want at least: a pure capability-restriction leaf; a leaf for measures
  whose security depends on information reaching a human or a monitor in time to intervene;
  a leaf for measures that depend on the model''s own dispositions; and a leaf for
  measures presented as control that in fact fail the moment the model is both capable
  and misaligned — call these ''alignment-assuming control'' unless you can think
  of a better name. Add further leaves where the logical space demands them. Each
  leaf gets: a name; one sentence stating the assumption that bears its weight; and
  one sentence describing how a model that is competent, misaligned, and fully aware
  of the measure would defeat it — or, if it could not, why not.


  3. Before the tree, lay out the space: list the answer combinations your questions
  permit, locate the real categories within it, and identify at least two combinations
  that no one actually occupies, each with a one-line diagnosis of whether the gap
  is there because the view is incoherent, because nobody wants it, or because nobody
  has thought of it.


  4. Flag any pair of leaves your tree cannot reliably separate, and say what further
  question would be needed.


  5. Then apply the tree to the following measures, giving for each the path through
  the branches and the leaf it lands on: [list of 8].


  6. Note explicitly at least two of the listed measures that would be classified
  as control by their proponents but land in the alignment-assuming leaf, and explain
  in one or two sentences each which feature does the damage.


  Please write in British English. I do not want references, citations, or a reading
  list — the handout has to stand on its own."


