  that minds aren''t machines" is a slogan. Or "This sentence is unprovable" — or
  "no system can prove its own consistency". Or "there are true statements that can''t
  be proven" — that''s a great slogan to precisify! It''s widely repeated, and the
  precise readings matter: for which system, true in what sense, provable by whom,
  and whether it''s a single sentence or an infinite set, and whether it applies to
  the whole of mathematics. And it also feeds Gödel outside mathematics — the misuse
  of the slogan for e.g. "there are truths science can''t reach" or "AI can''t be
  creative". That''s a strong combination. But it''s a bit close to well-trodden ground
  (Penrose, Lucas are famous). Still, the precisification angle with specific uses
  is fine. Actually, I can inject novelty by specifying the asker''s context: they
  encountered the slogan being used in three specific settings, and require readings
  sorted by which use they support.


