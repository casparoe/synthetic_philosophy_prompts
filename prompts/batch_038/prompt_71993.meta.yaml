  \ ψ-epistemic, and PBR's conclusion is not that all ψ-epistemic models fail — actually\
  \ PBR does rule out all ψ-epistemic models (in the ontological models sense) given\
  \ preparation independence. Right: PBR rules out ψ-epistemic models assuming preparation\
  \ independence and the ontological models framework. So claim (a) and (b) from the\
  \ friend are both largely correct, and the asker's reconstruction contains the errors.\
  \ Also the asker's \"proved to be a physical object, not information\" is a further\
