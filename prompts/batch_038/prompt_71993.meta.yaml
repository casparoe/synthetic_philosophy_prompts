  \ propositions and requires that you expect your future self's change to be rational/informed;\
  \ expected irrational change (drugs, coercion, evidence you'll misinterpret) is\
  \ exactly what the standard counterexamples show, so Reflection doesn't forbid precommitment.\n\
  \nHmm. Which domain gives the crispest \"the model must notice the confusion\" moment?\
