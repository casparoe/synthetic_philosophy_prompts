  \ is not unconditional equality but a constraint on conditional credence. Also Reflection\
  \ doesn't require that you're certain what your future credence will be.\n\nOr:\
  \ \"Reflection means rational people can't expect to change their minds, which is\
  \ why van Fraassen used it to prove that we should never expect to be surprised\
  \ — i.e., Reflection implies that if you could be Dutch-booked you'd be irrational...\
  \ \" hmm.\n\nAnother good one: conflating Reflection with the requirement of diachronic\
  \ coherence in general and concluding \"Reflection and conditionalization are the\
  \ same principle stated two ways, so anyone who violates conditionalization violates\
  \ Reflection.\" Actually there's a known result: Reflection follows from conditionalization\
  \ (plus the assumption that you're certain you'll update by conditionalization —\
  \ van Fraassen showed reflection is implied by conditionalization). But the converse\
  \ fails. A subtle confusion is claiming they're equivalent.\n\nMaybe a better target:\
  \ the friend argues Reflection shows \"you should defer to your future self, therefore\
  \ you should trust your future self's moral judgments, therefore it's irrational\
  \ to write a Ulysses contract / to take a pill that changes your values\" — and\
  \ the asker asks: \"Given Reflection, is there any rational way to bind my future\
