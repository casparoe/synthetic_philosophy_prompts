  \ — which is an overreach in the other direction. That gives the answer something\
  \ to audit on both sides. Nice.\n\nLet me also add the friend claiming \"ψ-ontic\
  \ just means the wavefunction is part of the furniture of the world, so my friend's\
  \ real point was that PBR proved realism about the wavefunction\" — hmm, keep it\
  \ manageable.\n\nLet me draft.\n\n---\n\nDraft:\n\n\"You are a philosopher of physics\
  \ who works on the foundations of quantum mechanics and who has taught the ontological-models\
  \ framework to graduate students. Please think the matter through carefully before\
  \ answering, and set out for me, in the course of your reply, the distinctions that\
  \ the argument turns on.\n\nLast night a friend and I argued for three hours about\
  \ the Pusey–Barrett–Rudolph theorem, and I am no longer sure which of us was talking\
  \ nonsense. My reconstruction of the situation went like this. Harrigan and Spekkens\
  \ sort the ways of modelling quantum theory into two camps: ψ-ontic models, in which\
  \ the quantum state is part of the physical state of the system, and ψ-epistemic\
  \ models, in which it is a state of knowledge or information that a hypothetical\
  \ underlying physical state is compatible with. PBR then proved that ψ-epistemic\
