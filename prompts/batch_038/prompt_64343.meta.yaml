  Now the residue: what should the model flag? Good answer would note:

  - Translates cleanly: money as ticket/counter (§23) — server coins have no intrinsic
  value whatsoever; they''re a database integer. Berkeley''s claim that gold has no
  virtue beyond setting people to work (§32) maps onto "the coin only matters because
  it makes players do things."

  - Velocity (§22): fewer coins circulating fast = more coins circulating slowly —
  maps onto sink/faucet balancing; the server''s "money per active player" and turnover.

  - Creating wants (§20) — maps to cosmetics, limited-time events, seasonal crates:
  the admin deliberately manufactures desires to get players to grind. That''s an
  eerie fit.

  - Distortion: Berkeley''s money is embedded in a credit system, sovereign legal
  tender, taxation, international trade (bills of exchange, absentees in England §34),
  and involuntary unemployment (idle poor). A server has no credit creation by private
  banks, no balance of payments, no tax obligation forcing people to need money, no
  subsistence constraint (players don''t starve; they log off), no labor market in
  the sense of wage dependency. So translating "stirring up industry" into "getting
  players to grind" changes the normative stakes: for Berkeley, industry is a moral
  and national good tied to human flourishing and to feeding the hungry; for a server,
  activity is a retention metric. If I say "the coin''s purpose is to make players
  active," I''ve smuggled in a metric-first view Berkeley didn''t hold.

  - No counterpart at all: (a) the sovereign''s authority and trust — a server admin
  can mint or wipe at will; Berkeley''s worry about arbitrary debasement as "a public
  cheat" (§28) does map somewhat; but the idea that money''s value rests on the *opinion
  or will of the people* (§33) has no counterpart where the will of the players is
  irrelevant — the admin''s config is what matters. That''s a residue pointing to
  a defect in the target framework (no genuine collective will, no exit-with-voice)
  or possibly showing that Berkeley''s "will of the people" was doing covert work.

  (b) The national-bank proposal: paper money issued against landed security to mobilize
  the idle — a server has no land collateral in the relevant sense and no bank that
  creates credit; loan plugins exist but they''re just admin-issued tokens.

