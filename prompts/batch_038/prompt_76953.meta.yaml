  So there''s a taxonomy: inner-sense HOT (Lycan, Armstrong), thought-based HOT (Rosenthal),
  dispositional HOT (Carruthers). The asker''s confusion conflates these. That''s
  a nice, meaty, non-regurgitated prompt: "I''m trying to understand how higher-order
