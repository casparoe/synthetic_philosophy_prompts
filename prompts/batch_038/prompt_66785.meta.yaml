  Leaves must include:

  1. Genetic adaptationism (religion selected for individual benefits).

  2. Group-level genetic adaptationism (multilevel selection).

  3. Cultural group selection / dual-inheritance (Big Gods).

  4. Costly signaling (individual-level, honest signaling of commitment) — distinct
  from group selection though often bundled; the tree should flag that it can''t separate
  some of these.

  5. Byproduct/spandrel of ordinary cognition (agency detection, MCI, theory of mind).

  6. Memetic-parasite account (adaptive for the cultural item, maladaptive or neutral
  for the host).

  7. Durkheimian functionalism (social function without evolutionary selection — religion
  functional at the group level, explained sociologically).

  8. Naturalist-nonfunctional: religion as a culturally variable invention with no
  single causal source — "historicism."

  9. Constructivism: "religion" is a scholar''s category / modern invention, not a
  natural kind — with two sub-leaves: family-resemblance/polythetic retention vs.
  eliminativism (retire the term).

  10. Byproduct-but-true (the mechanism explains why we believe; the content may still
  be true — e.g., sensus divinitatis-type accounts, or reformed epistemology).

  11. Genealogical debunking (the natural explanation, if complete, defeats warrant).

  12. The unoccupied/rare: "religion is an adaptation AND ''religion'' is not a natural
  kind" (in tension but arguably occupied? diagnose). Another: "not a natural kind,
  but religious *practices* are, while beliefs aren''t" — the practice/belief split.
  Another: "religious belief is a byproduct but non-belief is also natural" (contra
  the naturalness thesis).


