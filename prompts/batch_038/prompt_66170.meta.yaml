  "Both thinkers are working inside the same tradition and they agree about an enormous
  amount: they agree that ritual matters, that the ancient sages are models, that
  self-cultivation is the point of the whole enterprise, and that a good society depends
  on people becoming the right sort of person rather than on being restrained from
