  Where they differ is what they take human nature to be. Mencius seems to treat nature
  as what is distinctively human, the part that separates us from animals, and on
  his account that part is a set of beginnings or sprouts: the feeling of not bearing
  others'' suffering, a sense of shame, a tendency to defer, and a sense of when something
  is and isn''t right. These grow on their own if nothing gets in the way, the way
  a plant grows if you leave it alone, so what Mencius means by saying nature is good
  is that the direction of our growth is already set. That''s why the story of the
  mountain whose trees were all cut down and grazed away matters to him: the mountain
  looks bare but the bareness isn''t its nature, and the same goes for a person who
  has become cruel.


  Xunzi, by contrast, seems to treat nature as everything you''re born with and haven''t
  learned: the appetite for food, the liking of beautiful things and sounds, the desire
  for gain, the feeling of envy. Taken raw and left to itself, this stuff produces
  contention, and so nature in his sense is bad. What is good in us is acquired —
  ritual, rightness, the standards the sages worked out — and it has to be built in
  from outside, by teachers, by study, and by practice, the way a crooked piece of
  wood has to be steamed and bent against a straightening frame before it will be
  straight.


  So a good deal of the disagreement looks verbal: if you stipulate that nature means
  the distinctively human capacities, you get a good verdict; if you stipulate that
  it means the untrained biological inheritance we share with other animals, you get
  a bad one. They are describing the same person from two directions. That said, I
  don''t think it''s purely verbal, because they disagree about what has to be done.
  For Mencius the sprouts just need protecting from damage and given room; for Xunzi
  they need replacing. This is why Xunzi wants the desires eliminated in the person
