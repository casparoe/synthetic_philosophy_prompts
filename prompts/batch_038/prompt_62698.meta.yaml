  Draft:


  "I am a fourth-year philosophy student in a metaethics seminar whose last four weeks
  have been devoted to the wrong kind of reasons problem, and for the final session
  each of us has been asked to contribute a one-page instrument rather than a paper.
  What I want to make is a decision tree that sorts a reader by what they actually
  think about the cases, not by which label they prefer: someone who has never encountered
  the literature should be able to work through it, while someone who has should end
  up at the position they would recognize as their own. Please write that tree for
  me.


  Structurally, I would like six to eight decision nodes and at least eight terminal
  positions, and I would like each node to be phrased as a concrete situation followed
  by two or three answers a reader can choose between without knowing where each answer
  leads — no node should ask whether the reader accepts a buck-passing account of
  value, or whether fittingness is primitive, since those are just the labels in disguise.
  Each leaf should carry the name of the position where one exists (or ''unnamed''
  where nobody defends it), a sentence or two stating the view in the reader''s own
  terms, and the commitment that view finds most awkward. Please also mark, explicitly,
