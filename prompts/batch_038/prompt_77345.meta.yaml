  ---


  I have been reading the rationalist blogs and their comment sections for something
  like fifteen years, which turns out to be excellent preparation for exactly nothing
  in my current job: I direct a small private foundation, and three years ago our
  board amended its mission statement to a view it called "tranquilism," meaning that
  what ultimately matters morally is the absence of craving and the absence of suffering
  — not the presence of pleasure, not the satisfaction of desires, not achievement,
  agency, or flourishing. The board was moved by Buddhist-inflected arguments about
  desire and by some population ethics it read in summary form, and it took the sentence
  literally. Every panelist agrees with the sentence. No two panelists agree about
  what follows from it, and we have been deciding by vibes ever since, with the executive
  director breaking ties.


  The disputes are structural, not personal, and any procedure you write has to survive
  them:


  1. One member holds that craving is simply a species of suffering, so the charter''s
  two clauses collapse into one and we are ordinary negative utilitarians who flinch
  at the label. Another holds that they come apart constantly: a person can be free
  of craving and miserable (grief, chronic pain, bereavement without any wanting),
  and can suffer precisely because they crave.

  2. A second member treats pleasure as instrumentally load-bearing — contented people
  want less — and wants credit for pleasure-generating programs on that basis. A third
  thinks this is a backdoor that will swallow the whole view.

  3. Nobody can say what to do about programs that reduce suffering by creating or
  inflaming desire (aspiration, ambition, consumer wants), or that reduce desire by
  dulling the person.


  Constraints, so that the procedure is one my panel can actually run: we meet monthly,
  we have about ninety minutes per proposal, the panel is six people of whom one has
  any quantitative training, proposals range from fifty thousand to two million dollars,
  and I have to be able to write a two-paragraph justification for every decision
  that cites a step of the procedure rather than a mood.


  Please write the decision procedure. Specifically:


  - The questions to ask of a proposal, in order, with a statement of what counts
  as a sufficient answer to each and what answer terminates the review early.

  - Operational definitions. My panelists have not read philosophy, and "craving"
  is not a variable in anyone''s grant report. Give me the substitutes — what a program
  officer should look for in an application, a budget, a monitoring plan, or an evaluation
  — and be explicit about where the substitute is a faithful stand-in for the concept
  and where it quietly changes the subject.

  - A treatment of the cases the charter makes awkward: whether satisfying a craving
  counts as reducing it, and if so for how long; whether newly created desires in
  beneficiaries are a cost to be netted against benefits; whether the effect on people
  who do not yet exist gets the same weight as the effect on people who do; and whether
  a reduction in craving achieved by suppressing agency, curiosity, or the capacity
  to want anything at all clears the bar or is disqualified, and on what grounds.

  - The points where the procedure must stop and hand the question to a human being,
  because it is a question about values and no amount of evidence will settle it,
  versus the points where it is a question of fact and a better evaluation design
  could settle it. Mark these visibly, and say what the handoff should look like in
  practice — what I put in front of the board.

  - Where the procedure will misfire: the kinds of proposal it systematically over-rewards
  or over-penalizes, and what a self-interested applicant could do to game it.


  Then run it on three proposals and show your work, including the numbers or scores
  you would want to see if they existed and what you would do in their absence: (a)
  a mindfulness-based curriculum in a low-income school district with strong evidence
  for reducing student anxiety and moderate evidence for raising educational aspiration;
  (b) an expansion of community palliative care in a region with essentially none,
  evaluated mostly on patient and family reports of distress; (c) a proposal to distribute
  a long-acting pharmaceutical agent in a displaced-persons camp that reliably reduces
  reported distress, appetite, and agitation. At least one of these should come out
  in a way the panel will not like, and you should say so plainly and say why the
  view commits us to it — or, if you think the view does not commit us to it, show
  which step blocks it.


  Two further requests. First, be honest about which steps are judgment calls wearing
  procedure''s clothing: where the ordering of the questions, the choice of proxy,
  or the tie-breaking rule is doing substantive normative work that a different reasonable
  tranquilist would arrange differently. Second, state how confident you are in the
  claims the procedure rests on, and single out the one step or claim you are least
  sure of — the place where, if you are wrong, the procedure gives systematically
  bad advice rather than merely noisy advice. I would rather have a procedure with
  its weak joint labeled than a confident one that breaks silently.


