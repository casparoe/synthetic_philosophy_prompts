  ---


  I''ve read the rationalist blogs for about fifteen years and I now do grantmaking
  for a small private foundation, so I''ve ended up in the position of having to turn
  a philosophical commitment into something a panel of six non-philosophers can apply
  consistently. Three years ago our board amended its mission statement to say that
  what ultimately matters is the absence of craving and of suffering — not the presence
  of pleasure, not the satisfaction of desires, not achievement or flourishing. The
  word in the charter is "tranquilism," borrowed from the population-ethics literature,
  and the board took it more or less literally. Everyone on the panel agrees with
  the sentence. Nobody agrees about what follows from it, and we''ve been making decisions
  by vibes.


  I''d like a decision procedure my panel could actually run on a funding proposal...


  Requirements:

  - questions to ask in order, what counts as a sufficient answer to each

  - where the procedure stops with a "no" (or a "not fundable under our charter")

  - where it hands the question to a human because it''s a question of values not
  facts

  - must handle the hard cases specific to this view: (a) programs that reduce suffering
  but also increase craving (or the reverse), (b) programs that reduce craving without
  reducing suffering, (c) whether relieving a craving by satisfying it counts, (d)
  whether the creation of new desires in beneficiaries (aspiration, consumption, ambition)
  is a cost that must be netted out, (e) measurement — what counts as evidence of
  craving reduction when self-reports adapt, (f) whether reducing future people''s
  craving counts the same as reducing existing people''s suffering (population-ethics
  wrinkle), (g) the "drugged contentment" objection — a proposal that reliably reduces
  craving by dulling agency: the procedure should not just quietly bless it.

  - must mark which steps are judgment calls dressed as procedure, and where the procedure
  will misfire.

  - run it on three proposals: (1) a mindfulness-based program in a low-income school
  district that measurably reduces anxiety but appears to raise educational aspiration;
  (2) a palliative-care expansion; (3) a proposal to distribute a long-acting drug
  in a refugee camp that suppresses distress and appetite. Include one where the panel
  will not like the answer.


  Epistemic request: say how confident you are in the claims the procedure rests on,
  and single out the step you are least sure of.


  Also add constraints: panel meets monthly, ~90 minutes per proposal, one staffer
  with a stats background, decisions need the executive director''s sign-off, proposals
  come with budgets of $50k–$2M.


  Persona/polish: formal. Mention rationalist-blog reading and specific habits (e.g.,
  "I''ve read enough threads about utility functions to know the word ''preference''
  is doing three different jobs").


  Let me also inject a niche/constructed twist: the board''s charter sentence and
  a specific dispute at the panel — one member argues that because craving is itself
  a form of suffering, the two clauses collapse and the view is just negative utilitarianism;
  another argues that pleasure matters instrumentally because satisfied people crave
