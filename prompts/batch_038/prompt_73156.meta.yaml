  Also, the opening move should be a real challenge. Ideas for opening challenges
  to the dream-skeptic:


  1. The "how do you explain the fact that a sleeper''s behavior can be modified by
  the dream" — e.g., sleep-talking in which the sleeper''s speech makes sense only
  as part of a dream narrative; or the sleeper who, in the dream, is fleeing and wakes
  with a racing heart / sweat. If dreams aren''t experiences occurring during sleep,
  what happens during sleep to cause the physiological response?

  2. The lucid-dream objection: in a lucid dream, the dreamer knows they''re dreaming
  and can decide to change the dream. If there''s no experience during sleep, then
  there''s no one to notice anything during sleep, and yet the report includes judgments
  made "in" the dream. Malcolm would say the judgment is part of the waking impression.
  But the in-dream decision to fly, and the subsequent dream content, seems to show
  agency in sleep.

  3. The continuity/verification objection: you can''t verify a dream during sleep,
  so Malcolm says the claim of an experience in sleep is groundless. But then the
  same applies to experiences during unconsciousness... Hmm.

  4. The "two reports" objection: a sleeper awakened mid-REM and given a chance to
  report twice, and the second report differs from the first; or dream reports influenced
  by post-waking information (Bem''s postdiction experiments, and the finding that
  subjects'' dream reports can be altered by what they''re told after the dream) —
  the skeptic uses this to say the dream is manufactured at report time. Actually
  that supports Malcolm, not challenges. To challenge Malcolm, one might use: REM
  sleep onset correlates; people awakened during REM report dreams 80% of the time
  — the "there is something happening during sleep" evidence. Malcolm''s reply: correlation
  of brain states isn''t evidence of an experience; the physiological process is the
  cause of the waking impression, not an experience.

