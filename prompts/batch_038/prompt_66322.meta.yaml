  Let me write the argument sketch concretely:


  Thesis: uncertain perceptual evidence should be modeled not by probability kinematics
  over a first-order partition but by ordinary conditionalization on a second-order
  self-ascription.


  Sketch:

  1. Jeffrey''s rule applies only when experience fixes new probabilities on a partition
  while leaving all conditional probabilities on that partition untouched (rigidity).

  2. In the paradigmatic cases of uncertain perception (the bird in poor light, the
  faded colour swatch, the muffled speech sound), rigidity does not hold: the very
  fact that the bird looks to you more goldfinch-like than canary-like is informative
  about your present discriminative condition, and that in turn changes your conditional
  probabilities about what the bird is given further looks.

  3. So the right model keeps the first-order conditional probabilities fixed and
  instead conditionalizes on the proposition that you are inclined to judge thus-and-so
  — a self-ascription whose evidential force is mediated by your prior credences about
  your own reliability under these conditions.

  4. Payoff: the account explains why uncertain evidence feels non-inferential while
  being sensitive to reliability, and it explains why a shift in perceptual confidence
  can rationally be *resisted* (when you have reason to think conditions are bad)
  in a way that Jeffrey conditionalization, which takes the new probabilities as given,
  cannot.

  5. Corollary I want to advertise: on my view there is no such thing as updating
  on evidence you don''t have a prior theory about yourself with respect to — which
  is a cost I''ll own.


