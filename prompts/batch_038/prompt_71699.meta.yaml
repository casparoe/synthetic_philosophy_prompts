  ---


  I am a novelist, and I have spent the last eight months inside hospitals for research
  — ethics committees, ICU rounds, a transplant coordinator who let me shadow her
  for a fortnight. What I have come back with is not medical but conceptual, and I
  have hit a wall that no clinician I asked could help me past, because none of them
  appeared to notice it. I would like a philosopher''s reconstruction rather than
  clinical detail.


  Here is the first thing I found. In most American jurisdictions, a statute derived
  from the Uniform Determination of Death Act declares a person dead when there has
  been "irreversible cessation of all functions of the entire brain, including the
  brain stem." The justification usually offered is that the brain is what binds the
  body''s subsystems into a single organism. And yet such a body, on a ventilator,
  is warm; its heart beats; it digests; it mounts an immune response to infection;
  its wounds heal. There are documented cases of women declared dead in this sense
  being maintained for weeks — sometimes, I''m told, months — so that a pregnancy
  could continue to a caesarean delivery. The same legal system treats the removal
  of that person''s organs as the harvesting of a corpse, not as a killing.


  Here is the second thing. At the other end of the spectrum, courts and hospital
  committees routinely authorize the withdrawal of artificial nutrition and hydration
  from patients in a permanent vegetative state — a condition in which the organism
  is plainly alive and integrated, breathing unaided, but in which no one claims any
  consciousness persists. The American case that put this on the map turned largely
  on what evidence would suffice about what the patient herself would have wanted.
  And where a directive was written decades earlier by a competent adult, it is often
  treated as authoritative over the contrary wishes that the same body now expresses
  — a demented patient who protests that he wants to go on living, whose protests
  we set aside as the noise of someone who is no longer, in the relevant sense, there.


  The practices look to me as if they are resting on incompatible foundations, but
  I cannot say which foundations. In the first, we call a living, self-regulating
  organism a corpse. In the second, we treat a living organism''s continued life as
  though it belonged to no one who matters. Is the first a metaphysical claim about
  what a person is, or an administrative bright line for the sake of organ procurement
  and switching off machines? Is the second a claim about identity at all, or merely
  about interests? I want to know what theory of personal identity, and of what matters
  in survival — Parfit''s phrase, which I understand he thought might come apart from
  identity itself — each practice strictly requires, as distinct from what it merely
  sits comfortably with. Which rival accounts of persistence each one quietly forecloses.
  Whether one coherent theory can license both, or whether the law is in fact running
  two different theories in the same building. And whether the practices are underdetermined:
  I suspect there are several theories that would produce exactly the same behavior,
  and that the interesting question is which of them the institutions are unwilling
  to say out loud.


  Then tell me what would have to change if the suppressed theory were adopted openly
  — if a jurisdiction declared death at the irreversible loss of the capacity for
  consciousness rather than at the death of the brain, or, going the other way, abolished
  brain death and insisted that a respirator-supported body is a living human being.


  Finally, a narrower request that matters to me as a maker of scenes. In one chapter,
  the sister of a brain-dead man insists that he is still there and that unplugging
  him would be a killing; the transplant surgeon tells her she is confusing a body
  with a person. I want to know which of them, if either, is making a metaphysical
  mistake rather than a moral or merely emotional one — and whether their quarrel
  is about the world or about which concept of death our institutions have settled
  on. And since I am tempted to write her as right, give me the strongest available
  version of her position.


  I should say what I do not want: no reading list, no bibliography, no citations.
  I cannot chase sources and do not need to. I want the argument reconstructed and
  the concepts sorted out, in prose I could hand to an intelligent reader who has
  never studied philosophy.


