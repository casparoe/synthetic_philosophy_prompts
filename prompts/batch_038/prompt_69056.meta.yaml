  Design the prompt:


  Setting: a natural history museum''s public lecture on the Neolithic, then two people
  in the pub afterwards (or two people in a reading group). The asker is a bystander
  who overheard and couldn''t judge.


  Two disputants: give them names — e.g., "Marek" (a grad student in something unrelated,
  say materials science) and "Dee" (a nurse / a schoolteacher who reads a lot). Or
  make one an amateur optimist and one a declinist. Their positions:


  Round 1: Marek says the agricultural revolution was a disaster for individual wellbeing
  — shorter stature, worse teeth, more deficiency disease, longer work hours, infectious
  disease from settlement — so yes, a mistake, and we''re still paying for it.

  Round 2: Dee says it wasn''t a "mistake" because no one decided it: it accumulated
  over dozens of generations, each step locally rational (more mouths to feed, less
  wild food, sedentism first), so there was no moment at which anyone could have chosen
  otherwise. Calling it a mistake smuggles in an agent.

  Round 3: Marek replies: that''s just determinism dressed as an excuse — we say societies
  make mistakes all the time (Easter Island, leaded petrol, the cod fishery collapse)
  without needing a single decision-maker; the ratchet structure is exactly what makes
  it a mistake rather than a misfortune. Also the evidence that some groups tried
  farming and walked away from it (seasonal cultivation, repeated abandonment, the
  forager-farmer mosaic) shows the door wasn''t one-way — people did evaluate the
  package and often rejected it, so the ones who kept it made a choice.

  Round 4: Dee counters with the baseline problem: the "healthy forager" comparison
  group is not a fair baseline — the foragers we can study today live on land farmers
  didn''t want, and have been embedded in trade with agriculturalists for centuries;
  the pre-agricultural record is mostly bones, which tell you about stature and teeth
  and stress markers but not about how you spent your day, who you loved, or how often
  you were hungry in the lean season, and infant mortality was high. So Marek''s "worse
  off" is partly an artifact of comparing skeletons with ethnography.

  Round 5: Marek: fine, but the leisure data cuts the other way too — the classic
  time-budget claims about a 15-20 hour work week fell apart once you count food processing
  and cooking, and there''s the whole debate about whether the nut harvest figures
  were counted in shell; so if you can''t trust the affluence numbers either, the
  burden shifts back to you: your side also has no baseline. Also — and this is his
  strongest point — even if per-capita health declined, farming bought population
  growth, and if you think more lives worth living is a good thing, the transition
  was a gain; but then you can''t call it a mistake just because average wellbeing
  dipped. He accuses Dee of... hmm, careful: I want each side to have real strengths
  and real errors, and I want the framing question (is "mistake" well-posed?) to be
  genuinely open.


  Let me restructure so both make decent points and both have a weak move, and there''s
  a clear question about metric: mean vs total vs distribution vs option value.


  Round 5 (Dee): the "population growth" reply is itself a trap — that''s just the
  repugnant conclusion in bones: you can always add more slightly-worse-off people
  and call it progress. And she adds: the real damage isn''t health, it''s that surplus
  storage made inequality possible — foragers had to share and had exit options; farmers
  had granaries, and granaries need guards, and guards become chiefs. So the mistake
  wasn''t the calories, it was the lock-in of hierarchy.

  Round 6 (Marek): but hierarchy isn''t an agricultural invention — there are rich
  forager burials and complex sedentary foragers on the Pacific Northwest coast who
  never farmed, and there were big farming villages that stayed stubbornly egalitarian
  for a thousand years. So Dee''s causal story is just as underdetermined as his.
  Then he concedes something? Maybe he says: at that point we''re both just telling
  stories about bones. And then the final impasse move: Dee says the question isn''t
  answerable and shouldn''t be asked; Marek says that''s a cop-out because the same
