  ---


  so last thursday I went to a public lecture at our natural history museum about
  the origins of farming, and afterwards two people I don''t know — I''ll call them
  Marcus and Ruth, they were sitting at the next table in the café and got going —
  had an argument that ran for like 40 minutes and I couldn''t stop listening. Neither
  of them seemed to be a professional archaeologist, but both had clearly read around
  the subject. Here''s roughly how it went, in order:


  1. Marcus: the agricultural revolution was a mistake, full stop. Skeletons from
  farming villages are shorter, have more tooth decay, more enamel defects from periods
  of stress, more infectious lesions than the foragers before them, and that''s before
  you count the work hours and the fact that crowding plus domestic animals gave us
  the epidemic diseases. We traded a good life for more of a worse life.


  2. Ruth: you can''t call it a mistake, because nobody made it. It accumulated over
  something like two hundred generations, and each step was reasonable — you''re sedentary
  already because the local food is good, you start tending the stands you like, population
  ticks up, and now you have to feed the extra mouths. There was no point at which
  anyone stood at a fork in the road. "Mistake" needs a chooser.


  3. Marcus: that''s a ratchet, and ratchets are exactly the kind of thing we call
  mistakes in groups all the time — overfishing, leaded gasoline, irrigation salinizing
  a valley. No single chooser, still a bad outcome that could have been avoided. And
  your "no fork in the road" isn''t right either: there''s good evidence groups picked
  up cultivation and then dropped it, farmed only part of the year, or lived right
  next to farming villages for centuries and declined the package. People evaluated
  it and said no. So the door did swing both ways.


  4. Ruth: maybe. But then your comparison group is the problem. The foragers anthropologists
  actually measured are living on land nobody else wanted, and they''ve been trading
  with farmers for a very long time, so the famous numbers — a 15 or 20 hour work
  week, all that leisure — came from people in a situation that hadn''t existed for
  millennia before that. And the numbers got worse when other people recalculated
  them, partly because the first counts left out food processing and cooking entirely.
  So your healthy foragers are partly a mirage, and you''re comparing bones to ethnography.


  5. Marcus: fair enough on the leisure numbers, but you don''t get the affluence
  story back just because that one cracked. And here''s the thing you''re dodging:
  if farming made individual lives worse but supported many more of them, and more
  lives worth living is a good, then it was a gain, not a mistake. You can''t have
  it both ways — either average wellbeing is the metric and I win, or total wellbeing
  is the metric and you have to say a crowded, sicker, harder-working world with ten
  times the people was an improvement. Pick one.


  6. Ruth: I''ll pick neither, because your "average" already has a body-count problem,
  and also because I don''t think the damage was mainly to bodies. What storage did
  was make surplus accumulable and defendable — granaries need guards, guards become
  something else — so the real loss was the disappearance of the exit option. A forager
  who doesn''t like how he''s being treated walks away. A farmer with a field and
  a mortgage can''t. That''s the mistake: not the calories, the lock-in.


  7. Marcus: except there were hierarchical foragers who never farmed — sedentary
  ones with big stored salmon runs and fancy burials — and there were large farming
  towns that stayed stubbornly flat for a thousand years. So your granary-to-chiefs
  chain is as loose as my skeleton chain. At which point we''re both just narrating.
  Then he added that the same argument is happening right now about whether to encourage
  people to have more kids, and Ruth said that was a cheap move, and they both laughed
  and bought another coffee.


  They saw me taking notes and, embarrassingly, asked me to referee. So: can you go
  through it move by move? For each of the seven, tell me whether it''s clearly mistaken,
  partly right, or clearly right, and why — including anywhere one of them states
  something as fact that isn''t, which I suspect happened at least once and neither
  of them caught it. Then tell me which of the two did better overall, and answer
  the question they never actually settled: is "was the agricultural revolution a
  mistake?" even a well-formed question? If it needs fixing before you can answer
  it, say exactly what has to be pinned down first and what the answer looks like
  once you''ve pinned it down. And finally, what did both of them miss that a third
  person at that table should have brought up?


