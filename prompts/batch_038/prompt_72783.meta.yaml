  with a concrete track record, so the case doesn''t stipulate the temperament but
  shows it.

  2. A change in circumstances makes impetuosity the fit mode: give concrete numbers
  — probabilities and payoffs — such that a straightforward expected-utility calculation
  says the bold move dominates, and a sophisticated decision theorist would additionally
