  adjacent* better point and can detect local optima in finite time; in a poset, the
  "climb" may go through uncountably many steps, and at limit stages you need the
  upper bound to exist — which is the hypothesis, not something you can verify by
  looking. Also, the analogy suggests a canonical path, but there is no canonical
  path: the proof uses a choice function, so the "route" is arbitrary; different routes
  give different maximal elements (non-unique), so the analogy''s "the summit" is
  wrong. Also the analogy suggests effectiveness/constructibility: no. And it suggests
  finiteness of the search — no.


