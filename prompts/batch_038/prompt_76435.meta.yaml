  Hofstadter''s MIU-system (GEB, Chapter II "Meaning and Form in Mathematics"):

  Alphabet: M, I, U. Start: MI.

  Rule I: If you possess a string whose last letter is I, you can add a U at the end.
  (xI → xIU)

  Rule II: Suppose you have Mx. Then you may add Mxx to your collection. (Mx → Mxx)
  — i.e., double the string after M.

  Rule III: If III occurs anywhere in the string, you may replace it with U. (III
  → U)

  Rule IV: If UU occurs inside the string, you can drop it.


