  remaining conscious experience is net worth having, so the threshold is about who
  gets to judge rather than about how bad it is. That would explain why the definition
  of "refractory" varies so much between teams and countries. But I don''t know if
  that story can carry the weight, because we don''t act like it''s a judgment call
  under uncertainty — we act like there''s a fact.


