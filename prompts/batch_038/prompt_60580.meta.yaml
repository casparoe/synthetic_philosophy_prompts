  Two things we do, in the same building, under the same health system:


  1. We assess suffering on a number. Patient says 0-10, we chart it, we titrate to
  it. And there''s an informal but very real line — call it an 8 — where the goal
  of care changes kind, not degree. Below it, we''re managing: find the dose that
  relieves the symptom while keeping the person awake and able to talk to their family.
  Above it, and once we''ve decided the symptom is refractory (meaning nothing left
  to try that they could tolerate), the goal becomes abolishing the experience. We
  sedate to unconsciousness and keep them there until they die. Nobody on my team
  says "the remaining good of their conscious life outweighs the suffering." We say
  the suffering can''t be weighed against anything at that point. It just gets switched
  off, along with everything else, and we treat that as obviously the better outcome.


  2. The same health system, for completely different decisions — which drugs to fund,
  which programs to expand — uses quality-adjusted life years. Under that arithmetic,
  a year lived in severe pain is worth less than a healthy year but it''s still worth
  something positive, and you compare it against costs and against other people''s
  years on one single scale. Our health economists will happily produce numbers *below
  zero* for the worst health states, i.e. states worse than being dead, and then,
  as far as I can tell, they usually clip them at some floor so the maths doesn''t
  explode. So there is a threshold in the system too, it''s just in a different place
  and nobody notices that it''s there.


  So: what theory of value does practice 1 presuppose? Is it committed to something
  like suffering above a threshold having no finite exchange rate against anything
  good — the kind of lexical priority view I''ve read about and don''t understand
  well — or can you get practice 1 out of an ordinary cardinal scale plus some assumption
  about how confident we can be in our reports? I keep thinking there''s an epistemic
