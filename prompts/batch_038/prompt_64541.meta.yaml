  Essay content — let me write it carefully.


  Title: "The Latency Wedge: A Third Possibility in the Color-Phi Debate"


  Author''s background: retired from single-molecule fluorescence microscopy / or
  a retired neurophysiologist who worked on visual latency? A retired natural scientist
  recently into philosophy — let''s make him a retired physical chemist / biophysicist
  who measured reaction kinetics, so he thinks in terms of timing, buffers, and rate
  constants. That fits "the waiting-room" / kinetics metaphor.


  Essay outline:


  §1. The experiment. Two small spots of different color, separated by a few degrees
  of visual angle, flashed in sequence. At certain spacings and inter-flash intervals,
  observers report a single object traveling between the two locations and changing
  color abruptly partway along the path. First reported in the mid-1970s by Kolers
  and von Grünau, in answer to a question Nelson Goodman had raised about what a color
  change would do to apparent motion. (Verified.)


  §2. The puzzle. At the moment the first spot goes on, nothing in the stimulus says
  whether a second spot will follow, where, or in what color. So the moving-and-recolouring
  object cannot have been the content of experience at the time the first spot was
  on the screen — and yet the observer is prepared to say, of the first part of the
  path, that the object was already there and already coloured.


  §3. Dennett''s dichotomy. He and Kinsbourne sort candidate explanations into two
  families: Orwellian (experience was right at the time, and the record was altered
  afterwards) and Stalinesque (the finished story was composed only after the second
  spot, and then presented as though it had been composed all along). They argue the
  two are empirically indistinguishable, since both predict the same reports and the
  same behaviour, and they conclude that the question only looks substantive because
  it presupposes a finish line — a moment and place where processing becomes experience
  — that does not exist.


  §4. My objection: the dichotomy omits a third possibility, which as a kineticist
  I find the most natural one. Call it the open-file account. At the first spot, the
  system opens a file whose content is not a determinate percept but a placeholder:
  location registered, color registered, motion status pending. The placeholder is
  not a conscious experience of a stationary spot that later gets edited; it is an
  unfinished entry in a buffer that is closed only when the second spot arrives, and
  closed with a value that spans the whole interval. On this account there is nothing
  to overwrite, because nothing determinate was ever written; and there is no backdating,
  because the entry was never timestamped at all — the file carries an interval, not
  an instant. (Note: this resembles Husserl''s retention or the "extensional" model
  — the author might mention this as something he''s been told, or the model might
  raise it. Let me have the author pre-empt: "I have been told this is just the retentional
  or extensional model of temporal consciousness wearing a lab coat. If so, I would
  like to be told precisely what the difference is, because I cannot see it: those
  models are about how a melody is heard, and mine is about what the visual system
  is licensed to report before the evidence arrives.") Good — this invites the model
  to make a substantive comparison, and it''s a genuine question.


  §5. My proposed test: the latency wedge. If composition is deferred until the second
  spot (Stalinesque or open-file), then the earliest moment at which a decision about
  the first interval can be executed is postponed; a subject asked to press a key
  the instant they see motion begin should show a longer latency in unpredictable
  sequences than in blocks where the second spot''s timing and location are fully
  predictable, where the system can pre-compose. If, by contrast, experience at the
  first spot is already determinate and only the memory record is revised (Orwellian),
  the key press should not care whether a second spot is coming. So the two families
  do have distinguishable consequences.


  §6. The corollary I find more interesting. Suppose the wedge shows up. Then something
  is being deferred, and the deferral has a duration that can be measured. But a measurable
  deferral is exactly what a finish-line model needs and what the no-finish-line model
  is supposed to make unintelligible. If the latency wedge does not show up, the open-file
  account loses its only distinctive prediction and collapses into Orwellianism. Either
  way, the experiment seems to me to have consequences for the metaphysics, which
  is what I was told it could not have.


