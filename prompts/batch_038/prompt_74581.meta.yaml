  the morality in question is already there, fixed, prior to and independent of the
  law, and the only issue is whether the law may line up with it. Devlin''s conservative
  case is about preserving an existing fabric; Hart''s objection is about whether
  preserving it justifies coercion. Neither asks what happens when the law is being
  used to *produce* a moral consensus that does not yet exist.


