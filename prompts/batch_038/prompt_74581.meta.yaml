  question into a settled expectation. Whatever one makes of that empirical pattern,
  the point is conceptual. In a constitutive case, the legislature is not asking "may
  we enforce our morality?" but "may we make one?" And to that question the harm principle
  gives no answer, because the harm principle is a test for the justification of coercion,
  not an account of its downstream effects on normative attitudes.


