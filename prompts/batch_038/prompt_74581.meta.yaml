  rather than merely a mirror of it, then "society is entitled to defend its morality"
  is only a small step from "society is entitled to construct one," and that second
  claim is not one Hart ever denies; he denies that disgust or majority conviction
  is a *reason*. Constructing a norm is not a matter of counting convictions.


