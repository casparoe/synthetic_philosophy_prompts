  - Must explain why hypocritical blame seems inappropriate but the wrongdoer still
  did wrong (the "no excuse" datum — hypocritical blame doesn''t make the target''s
  action permissible).

  - Must handle the distinction between hypocrisy and mere inconsistency (blaming
  others for what you did once, long ago, and repented of).

  - Must handle private hypocrisy (blaming others publicly while secretly doing the
  same — no observable inconsistency).

  - Must handle hypocrisy of the heart / dispositional blame without action (the person
  who never actually does the wrong but would, and harbors the same attitudes) — is
  their blame impaired?

  - Must handle self-blame by a hypocrite.

  - Must handle the standing of institutions (a state blaming a citizen, a church,
  a corporation).

  - Must explain the normative force: is it a pro tanto reason against blaming, a
  lack of entitlement, a pragmatic defect, or an epistemic one?

  - Must distinguish standing from other standing-defeaters: meddling/busybody, complicity,
  lack of moral understanding, selective enforcement, past waiver/forgiveness, being
  a co-conspirator.

  - Must explain the phenomenology: the tu quoque reply feels like a legitimate rejoinder
  in ordinary argument but the target''s "who are you to say this" seems fallacious.

