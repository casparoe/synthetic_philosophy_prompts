  Title: "Borrowed Eyes: Why Rotten Tomatoes Isn''t Testimony"


  §1 The old puzzle. Aesthetic testimony: you can learn from a friend that the train
  leaves at 6, but if she says the Matisse is beautiful and you''ve never seen it,
  something feels off about reporting back "the Matisse is beautiful." Kant kicked
  this off in the third Critique — a hundred voices praising a building won''t force
  your agreement, and other people''s pleasure can''t ground an aesthetic judgement.
  Hume went the other way in his 1757 essay on the standard of taste: there are true
  judges, with delicacy, practice, comparison, good sense, freedom from prejudice,
  and their joint verdict is the standard. Contemporary debate: pessimists (deference
  to aesthetic testimony is illegitimate) vs optimists. Hopkins laid out the terrain,
  and later argued you can be a pessimist without being an epistemological sceptic:
  the problem isn''t that the testimony is unreliable, it''s something about how the
  belief is based / what you can do with it. Meskin and Robson push back. Some say
  the real loss is understanding, not knowledge (Hills-ish). Wollheim''s acquaintance
  principle (usually traced to him, behind him Kant): judgements of aesthetic value
  need first-hand experience.


  §2 My worry with the whole framing: it assumes testimony is one person telling you
  something about a particular work, and you deciding whether to believe it.


  §3 The pivot: the dominant way most people now encounters aesthetic verdicts isn''t
  that. It''s aggregate scores, star ratings, "because you watched X", popularity-ranked
  feeds. Call it statistical testimony, or better: taste infrastructure. Two differences:

  (a) No belief invitation. A 4.2 average doesn''t ask you to believe the film is
  beautiful; it just determines whether you ever see it. It operates on attention,
  not assent.

  (b) No traceable testifier: nobody to trust or distrust; no track record to weigh;
  anonymity + aggregation means the Humean true-judge model can''t even get a grip
  — there''s no critic whose delicacy you can evaluate, just a distribution.

  So: pessimists and optimists are arguing about a channel that carries a shrinking
  share of the traffic. The Acquaintance Principle says you can''t form the judgement
  second-hand; the infrastructure never asks you to form a judgement, it decides what''s
  available to be judged first-hand. Which looks like a much bigger deal for aesthetic
  life than the deference question: it doesn''t corrupt your judgements, it curates
  the pool of things you''ll ever have the chance to judge. And it may even be a way
  of being an optimist: if the aggregate only shapes exposure, then deferring to it
  costs you nothing the pessimist cares about — you still meet the work first-hand.


  §4 Objection I can see: aggregate scores do leak into judgement — you watch a film
  knowing it''s beloved, and that primes you; so the belief-formation channel isn''t
  bypassed at all, it''s just anonymised. Then my distinction collapses into the old
  one and the essay''s thesis is a relabeling. Also: is "infrastructure" doing sneaky
  work — is there really no testifier in a recommendation system, given engineers,
  labels, and the raters themselves? Maybe the right description is testimony from
  a very large, very badly-behaved committee.


  §5 Ending question for readers: whether first-hand experience is still the norm,
  when the first-hand experience was arranged by the aggregate.


