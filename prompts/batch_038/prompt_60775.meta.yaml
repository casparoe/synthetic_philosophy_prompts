  \ no entities beyond the universal wavefunction.\" → always Everett (Everett wins\
  \ all). But she sometimes picks Bohm, so R1 alone is out unless it's \"prefer Everett\
  \ unless Everett has to deny something we directly observe.\" That's a refinement.\n\
  - R2: \"Prefer whichever interpretation respects the demands of relativity/no preferred\
  \ foliation\" → Everett for Bell; Bohm needs a preferred foliation in relativistic\
  \ versions → Bohm loses; Copenhagen is nonrelativistic too... For a case like \"\
  which handles relativistic QFT best\", Everett/Bohm both contested.\n- R3: \"Prefer\
  \ whichever gives a single, observer-independent history\" → Bohm; Everett fails;\
  \ Copenhagen fails.\n- R4: \"Prefer whichever doesn't require a physical collapse\
  \ postulate\" → Bohm or Everett.\n- R5: \"Prefer the one whose proponents can actually\
  \ run the calculations used in practice\" → Copenhagen (shut up and calculate).\n\
  \nNow let's produce a track record that's consistent with, say, R2-ish and R3-ish\
