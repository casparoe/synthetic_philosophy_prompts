  \ has perfect records that could be reversed / interfered\" — that's Frauchiger-Renner-ish\
  \ or \"local friendliness\" (Bong et al. 2020) — Local Friendliness theorem. That's\
  \ a real result: \"A strong no-go theorem on the Wigner's friend paradox\" (Bong,\
  \ Utreras-Alarcón, Ghafari, Liang, Ringbauer, et al., Nature Physics 2020), which\
