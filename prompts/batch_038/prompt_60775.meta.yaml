reasoning_summary: "Let me pick a domain and type. The \"Predict or recommend a verdict\
  \ on a new case from someone's verdicts on earlier cases\" type combined with \"\
  Interpretations of quantum mechanics (Everett vs. Copenhagen vs. Bohm)\" could be\
  \ interesting — e.g., a physicist's verdicts on which interpretation handles which\
  \ scenario. Or \"Metaphysical grounding and fundamentality\" with a metaphysician's\
  \ verdicts on grounding claims.\n\nActually a nice combination: metaphysical grounding/fundamentality\
  \ with a \"track record\" type prompt. E.g., my dissertation advisor's verdicts\
  \ on which facts ground which — a case of grounding, well-foundedness, whether quantum\
  \ entangled states ground the states of parts (the \"entanglement and priority monism\"\
  \ debate — Schaffer, Calosi & Morganti). That's a real debate but fairly well known\
  \ in metaphysics circles. Candidate rules: whether grounding claims are tracked\
  \ by mereological priority (whole grounds parts vs. parts ground wholes), whether\
  \ she follows \"structuralist\" reading of QM, etc.\n\nAlternatively: interpretations\
  \ of QM — a professor's verdicts on which interpretation is favored by which experimental/philosophical\
  \ consideration. Candidate rules: she's an Everettian when locality matters, Bohmian\
  \ when determinate outcomes matter, etc. Then a new case: Wigner's friend / Frauchiger-Renner?\
  \ Or Bell nonlocality vs. PBR theorem? Hmm, that could get technical but it's within\
  \ memorized territory for LLMs (Bell's theorem, Wigner's friend, delayed-choice\
  \ quantum eraser, PBR theorem, many-worlds branching, Bohmian nonlocality). The\
  \ rules would be candidate \"decision procedures\" for picking an interpretation:\
  \ e.g., (a) always prefer the interpretation that saves locality, (b) always prefer\
  \ the one with a single world, (c) always prefer the one with primitive ontology,\
  \ (d) always defer to whatever preserves unitarity.\n\nActually the grounding domain\
  \ seems less trodden in the standard sense but also more abstract. Let me think\
  \ about which gives the best \"jointly consistent with more than one plausible rule,\
  \ and the new case makes two rules diverge\" structure.\n\nLet me design with interpretations\
  \ of QM:\n\nSetup: PhD student in philosophy of physics. Their supervisor (or a\
  \ reading-group leader) has expressed verdicts on a bunch of cases about which interpretation\
  \ they'd pick / which they say handles a scenario best. Actually better: verdicts\
  \ about which interpretation wins in specific scenarios, i.e., \"if the situation\
  \ were X, I'd go with Y.\"\n\nVerdicts list (need to be consistent with multiple\
  \ candidate decision rules):\n1. Bell/EPR — she says Bohm wins, because it's honest\
  \ about nonlocality being unavoidable? Or says Everett wins because it keeps locality\
  \ (no action at a distance, just branching)? Let's set: on Bell correlations she\
  \ prefers Everett, since Bohm pays with explicit nonlocality and Copenhagen is vague\
  \ about what caused what.\n2. On Schrödinger's cat / macro superposition, she prefers\
  \ Bohm, because it gives a determinate outcome without observers.\nHmm — that would\
  \ suggest the rule \"prefer whichever preserves a single determinate outcome\" for\
  \ cat but \"prefer Everett\" for Bell... Let's make it a rule like \"prefer the\
  \ interpretation that doesn't posit a special measurement process\" — Bohm and Everett\
  \ both satisfy that. Copenhagen fails. So rule: \"no fundamental collapse/measurement\
  \ cut\" — but between Bohm and Everett she needs a tiebreak.\n\nCandidate rules:\n\
  R1: Minimize structure — prefer interpretations that add nothing beyond the wavefunction\
  \ (Everett), i.e., no hidden variables, no primitive ontology. \"Occam: no surplus\
  \ entities.\"\nR2: Preserve determinacy of outcomes at all costs — prefer Bohm whenever\
  \ macro-outcomes are at stake (Bohm gives definite pointer positions); prefer Everett\
  \ when no definiteness is at stake.\nR3: Avoid nonlocality/action-at-a-distance\
  \ — prefer Everett whenever spacelike separation is in play (Everett can claim locality\
  \ since no collapse), prefer Bohm otherwise.\nR4: Prefer whatever can be empirically\
  \ distinguished... nah.\nR5: \"Prefer the interpretation whose story you can tell\
  \ without invoking observers or consciousness\" — both Bohm and Everett.\nR6: Prefer\
  \ the interpretation that keeps the wavefunction as the whole of physical reality\
  \ (wavefunction realism) vs. primitive ontology (Bohm's particles / GRW flashes).\
  \ Everett fits wavefunction realism.\n\nSo a set of verdicts where Everett wins\
  \ in some, Bohm wins in others, Copenhagen wins in one maybe (pragmatic contexts\
  \ — e.g., she says for quantum chemistry or for describing a lab measurement she'd\
  \ use Copenhagen/operational language). Hmm, adding a Copenhagen win gives another\
  \ rule: \"prefer whichever is cheapest for the phenomenon at hand\" — pragmatism/instrumentalism.\n\
  \nLet's craft verdicts:\n(a) EPR-Bell spacelike separated measurements: Everett.\
  \ (Consistent with R3 avoid nonlocality, R1 minimal structure, R6 wavefunction realism;\
  \ inconsistent with R2 if R2 = definiteness at macro level? Actually Bell measurements\
  \ have macroscopic detector records, so R2 would say Bohm. Hmm, need care: if she\
  \ says Everett here, R2 (\"Bohm whenever there are macroscopic records\") is falsified.\
  \ So make R2 = \"prefer Bohm when the worry is definiteness of a single outcome\
  \ for a system whose record we can't disown\"... This gets fiddly.)\n\nLet me instead\
