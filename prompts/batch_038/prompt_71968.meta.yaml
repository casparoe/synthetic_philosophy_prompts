  Actually a clean one: **the sunk expenditure as evidence about the true state**.
  Suppose you chose to invest heavily at time 1 based on private evidence about the
  project''s prospects; at time 2 the public evidence is ambiguous and equal for both
  you and a control agent who never invested. You, however, can reason: "I invested,
  and I only invest when my read of the evidence is favorable; my having invested
  is itself evidence about what I saw." A control agent with no such history cannot.
  This is a genuine Bayesian mechanism (self-locating/self-king evidence, cf. "you
  should conditionalize on your own past actions as evidence about your past information").
  That''s beautifully in-the-weeds and is a real phenomenon in decision theory (analogous
  to the "you should take your own past choices as evidence" — related to the problem
  of self-prediction in Newcomb-like cases). And it makes sunk-cost-sensitivity rational
  without any change in payoffs and without an audience.


