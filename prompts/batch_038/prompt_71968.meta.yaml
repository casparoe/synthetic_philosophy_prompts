  Mechanism: At time 1, the agent had private evidence E (e.g., she did her own careful
  survey / read the fine print / got a hunch based on training) that was favorable.
  She invested heavily (sunk). At time 2, she has partly forgotten or cannot reconstruct
  E — the evidence is no longer accessible in explicit form (e.g., the original documents
  are gone, her memory of the reasoning has faded, or the expert she consulted has
  died and she can''t recall exactly what he said). The only surviving trace of E
  is the fact that she invested. Now, at time 2, publicly available evidence is neutral/ambiguous,
  and the same public evidence faces a matched counterpart who never invested. For
  the counterpart, the posterior favors abandoning. For the investor, conditioning
  on her own past investment raises the posterior enough to favor continuing. Crucially
  the remaining options'' payoffs are identical for both agents, no one observes the
  decision, no reputation, and the investment doesn''t change the value of the outcome.


