  Good combos:

  1. Sunk cost fallacy + thought experiment to specifications: Design a case where
  honoring sunk costs is rational (or where the "fallacy" charge fails). This is interesting
  — e.g., the literature on rational sunk cost behavior: reputation effects (Arkes
  & Blumer vs. Staw''s escalation of commitment; also Navarro & Zumbo''s work; and
  the idea that a decision-maker whose future is judged by observers should finish
  a project). Construct a case where two agents face identical choice-relevant payoffs
  but one should abandon and one should continue, isolating the variable that does
  the work. That''s a nice designed-case prompt with an isolated variable.


  2. Promises binding + thought experiment: Design a case where the promise generates
  an obligation with no reliance, no expectation change, no benefit to promisor (against
  Hume/Anscombe: Hume says promise is unintelligible pre-convention). Construct a
  pair of cases where the only difference is the utterance of a promise, and everything
  else held fixed — showing the "bare" deontic effect. Also ask for how a Humean would
  attack it.


  3. Pascal''s mugging + thought experiment: Design a mugging case with no exotic
  predictor, ordinary stakes, where expected value reasoning still dominates — and
  specify that the mugger must be a shrewd human with no physics knowledge. Actually
