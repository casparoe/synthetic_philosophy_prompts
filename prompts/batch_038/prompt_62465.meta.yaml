  Draft of the embedded summary (attributed to "a long essay in a magazine about the
  economics of climate policy" — maybe "a piece in a general-interest magazine"):


  "The whole fight about how much climate action is worth comes down to a single number
  that nobody can measure: the discount rate. Economists take future costs and benefits
  and shrink them the further away they are, so that a catastrophe in 2200 barely
  registers against a small gain today. This is not a technicality; it is a moral
  decision dressed up as arithmetic. The practice goes back to Frank Ramsey, who in
  1928 argued that discounting later enjoyments compared with earlier ones is ''ethically
  indefensible'' and arises ''merely from the weakness of the imagination'' — meaning
  that the founding text of this whole tradition already told us the answer, and the
  profession ignored it. What economists actually do is build the rate out of two
  pieces: how much less we care about the future for its own sake, and how much richer
  the future is expected to be, which matters because extra income does less good
  for a rich person than a poor one. The famous British review of 2006 set the first
  piece at essentially zero and got a rate of about 1.4 percent; the American economist
  who answered it set the first piece much higher — 1.5 percent — and got something
  near 5 percent, and the difference between those two numbers is roughly the difference
  between urgent action now and waiting a few decades. Notice what that means: the
  second piece, the growth adjustment, is empirical — you can look at forecasts —
  but the first piece is a bare preference about when things happen, and there is
  no evidence for it, only a refusal to imagine the future as real. Which is why the
  more honest economists simply set it to zero, and why the resulting rate, once you
  also stop assuming that future generations will be richer, collapses to nothing.
  A discount rate of zero is not a radical position; it is the position that follows
  once you stop pretending that people who haven''t been born yet matter less."


  Now the subtle errors:

  1. "the founding text already told us the answer, and the profession ignored it"
  — Ramsey''s remark is about the ethical assumption in his model; but Ramsey himself,
  in Section II, does include a positive discount rate, and more importantly the mainstream
  of growth economics uses δ > 0 partly for technical reasons (convergence of the
  welfare integral in infinite-horizon models) and partly for the descriptive/opportunity-cost
  argument. Also "the profession ignored it" is false — Ramsey''s own model became
  the Ramsey–Koopmans–Cass framework and the Ramsey rule δ + ηg is standard.

  2. Conflating "the first piece" (pure time preference δ) with the whole discount
  rate — the conclusion "a discount rate of zero ... is the position that follows
  once you stop pretending that people who haven''t been born yet matter less" conflates
  δ = 0 with r = 0. Even with δ = 0, the Ramsey rule gives r = ηg > 0, and that is
  not a claim that future people matter less; it''s a claim about the marginal utility
  of consumption for richer people. This is the central conflation.

  3. "once you also stop assuming that future generations will be richer, collapses
  to nothing" — actually if g = 0 and δ = 0 then r = 0; but the article frames the
  growth adjustment as though dropping it is the same kind of move as dropping δ (a
  moral concession), when dropping growth assumptions is an empirical matter, and
  climate damages themselves affect g. Also there''s the "relative" issue: under uncertainty
  about g, and the possibility that climate change reduces growth, the expected discount
  rate is lower than the discount rate of expected values — a technical subtlety (Weitzman''s
  result).

  4. "there is no evidence for it, only a refusal to imagine the future as real" —
  the descriptive argument (Nordhaus) is not evidence about the ethics but about opportunity
  cost: if society can earn 5% on capital, then a project earning 1.4% crowds out
  better private investment. Treating that as mere prejudice misdescribes the debate.
  Also: uncertainty about catastrophic outcomes argues for a lower effective rate
  (and Weitzman''s "ghastly tail" argument), which cuts against the article''s framing.

  5. "the more honest economists simply set it to zero" — Stern set δ = 0.1%, not
  zero, and justified it partly by risk of human extinction / the possibility that
  future people may not exist; also he used η = 1 which was contested. Also there''s
  a technical point: with δ = 0 and perpetual growth, the utilitarian integral can
  diverge; Stern''s approach required bounded utility / risk of catastrophe.

  6. Mislabeling the 2006 review as "British" and the responder as "American" — those
  are true (Stern Review for UK Treasury; Nordhaus at Yale). Fine.

  7. "so that a catastrophe in 2200 barely registers against a small gain today" —
  hyperbole but the compounding arithmetic is real (at 5%, a benefit in 200 years
  is worth ~0.005% of present value). Fine as popularization.

  8. The Ramsey quote is used to say the founding text told us the answer — but Ramsey''s
  context: he was setting out an assumption of his model of a single immortal community,
  and he did consider positive discount rates in Section II. Also Ramsey wrote about
  a nation''s savings, not about climate or about weighing harms to unidentified future
  persons.


