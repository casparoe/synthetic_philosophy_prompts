  "Kripke''s claim is that a thing''s origin is essential to it. For persons he puts
  it in terms of gametes: the Queen could not have come from a different egg and sperm
  than the ones she actually came from. We can imagine her life going very differently
  — she never becomes Queen, she marries someone else, she has different children
  or none — but we cannot imagine her being produced by a different pair of gametes.
  If a different egg and sperm had fused in April 1926, whatever person developed
  from them would have been someone else, however similar to her.


  The reasoning is an application of the necessity of identity. Proper names are rigid
  designators, so Elizabeth II picks out the same individual in every world in which
  she exists. And the Queen just is the organism that developed from that particular
  egg and sperm in 1926. Since identity is necessary — if a = b then necessarily a
  = b — it follows that in every world in which she exists, she is that organism,
  and that organism developed from that pair of gametes. So any world containing someone
  who developed from different gametes is a world containing a different person, not
  the Queen.


  This also fits with the causal theory of reference. The name was attached to her
  at her christening and passed along a chain of speakers, and what fixes its reference
  is that historical chain running back to the particular individual who was born.
  So the necessity of origin isn''t an empirical discovery about biology at all —
  it falls out of the way the name gets its reference in the first place. The chain
  bottoms out at one particular origin, and that is why having that origin is part
  of what it is to be her.


  Two consequences worth spelling out. First, she couldn''t have had different parents,
  because the egg she came from had to come from the woman it actually came from,
  and the same goes for the sperm. Second — and I think this is the more interesting
  one — she couldn''t have had a different genetic make-up. Her genome was settled
  by the two gametes she came from, so if the genome had been different the gametes
  would have been different too, and then it wouldn''t have been her. Cloning is the
  awkward case here: a clone grown from one of her cells would have effectively her
  genome, and if it''s the genetic material that does the work rather than the particular
  egg, then the clone would be her. That seems obviously wrong, which suggests the
  thesis is really about the genome and only derivatively about gametes.


  One objection is that the same egg is vague — an egg develops over time, and there''s
  no sharp line saying how different something could be and still be that egg. Kripke''s
  table case is framed in terms of a table made from a completely different block
  of wood, so maybe the same restriction applies here. But that concedes too much:
  if small differences are allowed, they can be repeated, and the argument never gets
  you full essentialism of origin."


