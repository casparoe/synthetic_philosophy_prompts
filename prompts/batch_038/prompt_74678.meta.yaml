  Draft:


  "Kripke''s claim is that origin is essential to a person. The Queen, he says, could
  not have come from a different egg and sperm than the ones she actually came from.
  We can imagine her living a very different life — being a private citizen, never
  becoming Queen, having different children — but we can''t imagine her being produced
  by a different pair of gametes. If a different egg and sperm had fused in 1926,
  the person who developed from them would have been someone else, however similar.


  The reasoning is basically an application of the necessity of identity. Names are
  rigid designators, so ''Elizabeth II'' picks out the same individual in every possible
  world where she exists. Now, the Queen is identical to the organism that developed
  from that particular egg and sperm in April 1926, and identity is necessary: if
  a = b, then necessarily a = b. So in any world where the Queen exists, she is that
  organism, and that organism came from that pair of gametes. Any world containing
  a person who came from different gametes is a world containing a different person,
  not the Queen.


  This also connects to the causal theory of reference. The name ''Elizabeth'' was
  attached to her at baptism and passed along a chain of speakers; what fixes the
  reference is that historical chain leading back to the individual who was actually
  born. So it isn''t a discovery of biology that origin is necessary — it falls out
  of how the name gets its reference. The chain terminates in one particular origin,
  and that''s why origin is part of what it is to be her.


  Two consequences. First, it follows that she couldn''t have had different parents,
  since the egg had to come from the woman it actually came from. Second, and I think
  more interesting, it follows that she couldn''t have had a different genetic makeup.
  Her genome was fixed by the two gametes she came from, so if the genome had been
  different, the gametes would have been different, and then it wouldn''t have been
  her. This is why a clone is a genuinely difficult case for the view: a clone made
  from her cell would have essentially her genome, and if what matters for being her
  is the genome rather than the particular egg, then the clone would be her, which
  seems wrong — but it shows that the view has to be read as being about genetic material,
  not just about gametes.


  An objection is that ''the same egg'' is vague: eggs develop over time, and there''s
  no sharp line for how different one could be and still be that egg. Kripke''s reply
  is that we don''t need a sharp line, because the intuition is about a completely
  different egg, not a marginally different one. But this seems to concede too much
  — if small differences are allowed, then repeated small differences could add up,
  and the argument wouldn''t get you full essentialism of origin."


