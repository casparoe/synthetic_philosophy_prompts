  Let me draft the final prompt structure:


  Opening: casual context — "I''m putting together the first session of a metaethics
  seminar and I''ve realized I can''t tell which debunking arguments are actually
  arguments..." Fix purpose: the standard of adequacy = good enough to move a realist
  who already accepts the evolutionary science of moral origins, not just to convert
  the already-skeptical.


  Body: write the requirements list, each with the motivating case/consideration,
  and a test. Specify some candidate requirements I want considered (with the option
  to add/drop):

  - genealogy can''t be a just-so story: what has to be true of the selection history
  for it to do work

  - a robustness requirement: would the argument survive if the causal story turned
  out to be cultural group selection, or a byproduct of general intelligence + language
  rather than kin-selected dispositions? I suspect this and the previous one pull
  against each other; say whether the tension is real and how much it costs.

  - process vs content: does it target the faculty''s reliability or the truth of
  particular beliefs?

  - retail vs wholesale: if it works on disgust-based norms or the incest taboo, does
  it license anything about morality as a whole?

  - the parity/control-class constraint: my seminar''s fixed points are that modus
  ponens is reliable, that 7 is prime, and that pain is bad for the person feeling
  it. Say which of these the debunker can keep and which she loses, and whether losing
  the third one is fatal or is actually where the argument wants to end up.

  - no self-undermining: if it generalizes to all normative belief including the epistemic
  norms the debunker''s own argument uses

  - the realist''s side: does the debunker have to explain the match between moral
  belief and moral fact, or does the burden sit with the realist? and is "the realist
  can''t explain the correlation" a requirement on a debunking argument or a separate
  argument? sort that out.

  - what it must say about the counterfactual: had our ancestors been selected differently,
  we''d have different moral beliefs — and why isn''t that just the genetic fallacy?


  Then the deliverables: classify each into non-negotiable / negotiable-but-costly
  / camp prejudice; identify the tightest jointly unsatisfiable subset (I bet it''s
