  trace elements locked in. The diffraction says there''s no long-range order at all
  — it''s a glass, flash-melted and quenched in seconds. Its composition overlaps
  almost completely with a crystalline silica polymorph they can show it was melted
  *from*, and the trace signature plus a distinctive bubble texture means you could
  not make the same thing in a furnace at ambient pressure. The team wants to propose
  it as a new species to the international committee that ratifies mineral names.
  My housemate''s take: the proposal is bookkeeping dressed up as discovery, and the
  proof is that the same committee hands out valid species names to things like opal
  and lechatelierite — actual glasses — while every textbook definition of a mineral
  insists on a crystalline structure, so the requirement can''t be tracking a joint
  in nature if the community overrides it whenever it''s convenient. Plus, he says,
  the six named bins along the plagioclase series are cut at round numbers out of
  a continuous solid solution, which is about as clearly interest-relative as classification
  gets. My take: those are two different things. Same composition, no order, is exactly
  the difference that shows up in hardness, density, stability, dissolution rate,
  everything you''d ever want to predict — that''s diamond vs graphite, calcite vs
  aragonite. And I think a kind can have its origin built into its identity conditions:
  a lab-made identical glass wouldn''t be the same thing, because the whole point
  of the category is that it records what happened to that rock.


  Could you write that argument as a dialogue between two members of the naming committee
  the day before the vote — one a working mineralogist who thinks species are discovered,
  the other an outside member, a philosopher, who thinks the question they''re voting
