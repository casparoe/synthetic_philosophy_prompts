  them away, and the philosopher has to answer the diamond/graphite point and explain
  what could possibly make a kind''s identity conditions historical rather than structural,
  and whether that''s a metaphysical claim or just a fact about mineralogy''s job
  description. Real back and forth, each of them responding to what the other just
  said rather than delivering prepared speeches, and I want at least one moment each
