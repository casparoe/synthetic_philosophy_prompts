  \ all vs. the child being born with a different identity) collapses one verdict\
  \ but not the other.\n\nAlternative: design a case that separates the nonidentity\
  \ problem from the \"mere addition\"/repugnant conclusion machinery — i.e., a case\
  \ where the identity-affecting choice occurs with a *fixed number* of people and\
  \ *fixed* total wellbeing, so that impersonal views also say indifferent, yet person-affecting\
  \ views say wrong (or vice versa). Hmm.\n\nLet me think about a really crisp target\
  \ that is \"jointly satisfiable but not trivially so.\"\n\nKnown structure in the\
  \ literature: The nonidentity problem arises when (a) the act affects who exists,\
  \ (b) the person who exists has a life worth living, (c) so they're not harmed.\
  \ The standard response families: harm vs. wronging; the \"impersonal\" response;\
  \ the \"person-affecting restriction\" response; Boonin's argument that wronging\
  \ doesn't require harming.\n\nA good design target: construct a case where the act\
  \ determines *who* exists, everyone's life is worth living, the number of people\
  \ is the same, total wellbeing is the same — and yet there is a *specific* person\
  \ who is worse off than she would otherwise have been... no, that's contradictory\
  \ with same total.\n\nHmm, here's an idea: an \"intrapersonal nonidentity\" case.\
  \ Consider a case where the choice affects who will exist, but the choice is made\
  \ by a person who will herself exist either way, and the difference is in *which*\
  \ of her future children exists — and the decision is made under a contract/promise,\
  \ so that the wrong isn't about harm at all but about a commitment to a specific\
  \ describable person... \n\nActually, let me pick a different, cleaner target that's\
  \ genuinely interesting and designable:\n\n**Target**: Build a case in which the\
  \ *reverse* of the usual asymmetry holds: the standard nonidentity case makes a\
  \ harmful-looking act permissible because of identity shift; instead, construct\
  \ a case where an act that *does not* affect who exists (so no identity shift, standard\
  \ person-affecting reasoning applies) nevertheless escapes the harm principle in\
  \ a structurally analogous way — i.e., a \"nonidentity problem without nonidentity.\"\
  \ For example: an act that leaves the same person existing but changes her *essential\
  \ properties* in such a way that the counterfactual \"she would otherwise have been\
  \ better off\" is not available because the worse-off counterpart is not *her* —\
