  But to be "in the weeds" and non-regurgitable, injecting a niche idea helps. Let''s
  consider van Fraassen''s Reflection Principle: the principle that if you now assign
  positive credence to your future self holding credence x in p, then your current
  credence in p should be x. Misunderstandings abound: (1) Reflection is just a special
  case of the sure-loss/Dutch book argument applied to conditionalizing on your own
  future opinion; (2) Reflection seems to imply you must defer to your future self
  as an authority; (3) the puzzle cases — van Fraassen''s own cubist example (the
  drug that may cause amnesia and you''ll believe you''re in 1999), the "will I be
  tired tomorrow" case, Christensen''s and Talbott''s critiques; (4) the difference
  between Reflection and the Principal Principle (Lewis) — deferring to a reliable
  indicator of truth vs. deferring to your future self; (5) cases where Reflection
  fails: addiction, depression, foreseeable irrationality, self-locating beliefs,
  cases where you''ll have evidence you won''t have now; (6) the distinction between
  the dogmatic/deferential reading and the "conditionalization on the proposition
  about your future belief" reading; (7) Hedden''s work on time-slice rationality
  and intrapersonal disagreement; (8) the difference between Reflection as a rationality
  constraint (coherence) and as a truth-tracking norm.


