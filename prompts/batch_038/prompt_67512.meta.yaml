  follows from that plus... Actually Reflection says P(H) = P(H | Cr_future(H) = r)
  when you''re certain Cr_future(H) = r. So Reflection follows from "if you''re certain
  your future credence will be r, then your current credence should equal your conditional
  credence given that proposition" — trivially — plus the assumption that your credence
