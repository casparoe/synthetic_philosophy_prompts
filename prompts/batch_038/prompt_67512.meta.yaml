  I retired six years ago from a career in experimental physics — most of it spent
  in metrology, where the question of what counts as a better measurement than the
  last one is a working daily question rather than a philosophical one. Philosophy
  has since become my occupation, and I have been reading the historiography of science
  with the slightly uneasy feeling that my own discipline has been writing its history
  badly for a century and calling it a chronology.


