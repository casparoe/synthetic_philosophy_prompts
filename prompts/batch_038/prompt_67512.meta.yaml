  is roughly sixty people: retired engineers, teachers, nurses, one or two historians''
  spouses, and a contingent of undergraduates who work Saturdays. They are intelligent
  and well read in their own fields and entirely self-taught in this one. I have a
  lectern, a whiteboard, and the galleries ten metres away.


