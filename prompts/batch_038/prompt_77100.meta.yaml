  TA''ing a mid-level ethics course and I''m grading the midterm tonight. Prompt was:


  "A promise seems to create an obligation owed to one particular person out of nothing
  more than the promiser''s own act. Explain what is puzzling about that, and contrast
  two attempts to dissolve the puzzle. For each, say whether the obligation you end
  up with is still distinctively promissory."


  Here''s one of the answers (lightly compressed but nothing changed):


  [answer]


  The puzzle: if obligations normally come from something external — a harm, a relationship,
  a rule that applies to you whether you like it or not — then a promise looks like
  it makes me the source of my own obligation. And a bare act of will doesn''t obviously
  have that kind of power: I can''t will that I owe you ten pounds any more than I
  can will that ten pounds exists. So either the appearance is an illusion and promissory
  obligation is really something else in disguise, or the will has a normative power
  we haven''t explained.


  Hume takes the first route. Promising isn''t a natural act but an artificial one:
  it works because there''s a social convention attaching consequences to a certain
  form of words, and the convention is worthwhile because of the general interest
  everyone has in being able to rely on each other. Hume''s point is that the obligation
  comes from the expectation the promiser has deliberately raised in the promisee
  plus the harm of disappointing it, so there''s no mysterious power of the will involved.
  Prichard develops this — the real obligation isn''t created by the promise but is
  an old one, the obligation not to let down the confidence your own earlier conduct
  produced. Scanlon generalizes it into a principle about intentionally getting someone
  to expect you''ll do X when you know they want assurance and they rely on it.


  Rawls takes the second route. On the practice conception, promising is a practice
  with constitutive rules, like a game: saying the words is making a move whose meaning
  and force come from the practice, not from my psychology. Searle says something
  similar, and uses it to argue you can get an ''ought'' out of an ''is'' once the
  institutional facts are in place. This preserves the idea that I bind myself — the
  obligation is mine in a way utility isn''t — but since practices are justified by
  their usefulness, the obligation to keep this promise just is the usefulness of
  the practice, so it lapses whenever breaking it in secret would produce better results.


  Scanlon, though, is really giving the same kind of answer as Searle, just with the
  rules stated as moral principles rather than institutional ones: both treat promising
  as a normative power, a thing you do when you intend to create an obligation for
  yourself. That''s why on both views the resulting duty is still distinctively promissory.
  Hume''s tradition can''t say that: if all that''s wrong is disappointing an expectation,
  then I could discharge the obligation by paying you off, or by arranging for you
  to be deceived into thinking I performed. The expectation theorists dissolve the
  promise into the wrong of misleading someone, which is a different wrong entirely.


