  Ideas about why promises bind:

  - Hume: promises are human conventions, the obligation is artificial; there''s no
  natural act of the mind that makes a promise binding; the "peculiar act of the mind"
  — willing an obligation — is unintelligible. Promises derive obligation from conventions,
  i.e., from the interest in the stability of the practice.

  - Prichard ("The Obligation to Keep a Promise", 1940): the obligation doesn''t come
  from the promise itself but from prior acts/relations — from the trust you''ve inspired
  in the other person; we''re really obliged by our own previous acts which produced
  the expectation, so promise-keeping obligation rests on the obligation to prevent
  disappointment/harm arising from our prior conduct.

  - Anscombe: "On Promises" (1969) — a promise creates a right in the promisee; the
  promiser has "given" something.

  - Searle: promising is a speech act whose constitutive rules include the obligation;
  deriving "ought" from "is" via institutional facts.

  - Rawls: practice conception of rules — promising is a practice defined by rules;
  obligation arises from voluntarily taking advantage of the practice (fair play-ish).

  - Thomson / Scanlon: Scanlon''s Principle F in What We Owe to Each Other — the obligation
  arises from the expectation you intentionally created in the other party, whom you
  led to expect performance, plus their reliance. Scanlon explicitly frames it as
  reducing promissory obligation to more fundamental obligations of not deliberately
  misleading, etc.

  - Hobbes: covenants without the sword are but words; in the state of nature, a covenant
  is void if there''s reasonable fear; the obligation requires a common power.

  - Kant: making a false promise uses another merely as a means; contradiction in
  conception when universalized.

  - Nietzsche (Genealogy of Morals II): the right to make promises as a sovereign
  individual''s achievement; memory of the will; the creditor/debtor relation, punishment
  and the "I will not" vs "I will".

  - Shiffrin "The Moral Difficulty of Keeping a Promise" / "Promises, Perjury and
  Legal Obligation"; she argues promising is a way to control another''s will — the
  "promise as a gift of assurance" — and the problem is that promising involves taking
  control of someone else''s practical deliberation, requiring consent; also "divine
  right" theories.

  - Owens: "A Simple Theory of Promising" — promising transfers authority, like a
  promisee acquiring a right, similar to consenting; the promiser gives the promisee
