  Our enforcement stack works roughly like this. Every account action is logged, and
  a gradient-boosted model with on the order of two thousand features assigns each
  account a rolling risk score. That score drives a graduated ladder of automated
  penalties: temporary rate limits, removal of specific features (posting, messaging,
  discovery), reduced distribution so an account''s content is shown to fewer people
  without the account being told, and finally suspension. Two properties matter for
  my question. First, the penalty magnitude is not read off a published table; an
  optimizer picks, per account, the smallest intervention predicted to bring that
  account''s future violation rate below a threshold, so two users who commit identical
  acts routinely receive different penalties. Second, the model is retrained weekly
  on the last ninety days of logged behavior, so the operative rule changes continuously
  and cannot be published in advance even in principle, because there is no rule to
  state in words.


  Detection, by contrast, is close to total, and the penalty lands within minutes.


  A colleague suggested that Cesare Beccaria''s 1764 treatise on crimes and punishments
