  in the world; the sequence of events is a sequence of acts of God alone, arranged
  by God''s custom (habit of acting in regular ways), which God could break at any
  time.


  (5) Knowledge of an effect, in the strict sense, requires knowing its cause — knowing
  why the thing must be as it is, rather than merely observing that it regularly is.


