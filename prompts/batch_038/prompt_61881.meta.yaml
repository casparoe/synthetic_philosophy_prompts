  one thing occurs with another, never that it occurs by it. So the case for occasionalism
  is an inference from observed regularity to a claim about how things must be.

  7. Knowledge of a thing, in the strict sense, is knowledge of it through its cause.

  8. By 4 and 5, the only cause of any contingent event is a will that is under no
  constraint. So for any observed regularity, no amount of observation establishes
  that the regularity holds or will hold, or that it holds for the reason we take
  it to hold.

  9. Therefore, on occasionalism, nobody knows any contingent proposition about the
  world: every such claim would have to rest on an inference of the sort 8 discredits.

