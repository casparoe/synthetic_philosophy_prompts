  4. Therefore no created thing is a cause. When fire touches cotton it does nothing;
  God creates the blackening and the crumbling, directly or through intermediaries,
  as he also creates the contact.

  5. What we call the order of nature is therefore only God''s custom — his settled
  habit of acting in a certain sequence — which he can break whenever he wills.

