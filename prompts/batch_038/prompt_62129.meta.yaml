  why.


  Can you lay out the different precise claims ''human nature is good'' could be making,
  as a menu I can bring to section? For each: what counts as nature (the unlearned
  starting material? the tendency a thing has when nothing interferes? the mature
  endpoint under normal conditions? what heaven allotted you?), what ''good'' is doing
  (morally good? well-functioning? admirable? good for the person?), and whether the
  claim is a description of what people are like, a prediction about how they develop,
  or something normative/teleological. Flag which readings are platitudes nobody would
  deny, which are substantive, and which are just false.


  Then do the same for Xunzi''s ''human nature is bad'' — including whether ''bad''
  for him means morally wicked or something more like crooked-needs-a-frame, and how
  the xing/wei split changes things. I specifically want to know which pair of readings
  makes the two of them actually contradict each other, and whether there''s any pair
  where both are true and my classmate is right.


  Two extra things I can''t figure out. (1) Mencius has that bit where he says the
  gentleman refuses to call the mouth''s taste for flavor ''nature'' even though it''s
