  Policy elements:

  (a) Copy-text choice: the edition takes as its basis the last version published
  in the author''s lifetime and supervised by her, even where she had earlier written
  something different in manuscript. So the reading text is "the author''s final intentions."

  (b) But: emendation — where the author''s final printed version contains a passage
  she was demonstrably forced to cut or alter at her publisher''s insistence (documented
  in correspondence), the editors restore the earlier reading into the main text,
  on the stated ground that "the cut does not represent the author''s intention."
  Whereas an alteration she made freely in later revision, however trivial or (in
  the editors'' judgment) a deterioration, stays.

  (c) Silent emendation of accidentals: punctuation and spelling are modernized/normalized
  to house style without record, on the ground that these were the printer''s or compositor''s
  doing and that the author "did not intend" them — even though in some cases the
  manuscript shows she wrote them herself. Hmm, careful: if the manuscript shows she
  wrote them, then normalizing contradicts the intention principle. That''s the inconsistency
