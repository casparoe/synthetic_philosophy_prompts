  ---


  In the autumn I took up a post as assistant textual editor on a scholarly edition
  of a novelist who died in 1971: three novels, and a companion series of volumes
  of her letters and journals. Until last month my job was collation, and I never
  had to think about why the house rules are what they are. I have now been asked
  to draft the general editorial introduction for the first volume, in which I am
  expected to state and defend the project''s principles to an advisory board that
  includes both literary historians and philosophers of language. Reading the style
  manual with the aim of defending it, rather than merely applying it, I have found
  that I cannot state it without making claims I am not sure I believe, and that some
  of its provisions seem to rest on incompatible claims. I would like your help thinking
  the matter through before I write.


  Here is the policy, in substance.


  1. The reading text of each novel is to represent "the author''s final intentions."
  Where the novel exists in manuscript, in a first printed edition, and in a revised
  edition that the author supervised and signed off before her death, the last supervised
  version is the basis of the edition, and the earlier states are relegated to the
  historical collation in the apparatus.


  2. Exception: where correspondence or publisher''s records establish that a change
  in the final version was made at the insistence of the publisher — for instance
  the excision of a chapter she was told was libellous — the editors restore the earlier
  reading to the main text, on the ground that a coerced alteration does not express
  the author''s intention. Changes she made freely in revision are never restored,
  however much the editors think them a deterioration.


