  and the appointment is in Damascus → he dies. If he stays in Baghdad, the demon
  predicted he''d stay, and the appointment is in Baghdad → he dies. Either way he
  dies — but EDT says: given I''m considering going to Damascus, that''s evidence
  the demon predicted Damascus, so the appointment is in Damascus, so Baghdad is safe...
  and then, given I''m considering staying, the appointment is in Baghdad, so Damascus
  is safe. The agent oscillates: no stable decision, no ratifiable choice. This is
  a case where EDT delivers "deliberation instability" — and it''s often used to argue
  that rationality requires certainty about one''s own action ("deliberation crowds
  out prediction," Levi), or that EDT is defective, or that the case shows something
  about self-fulfilling prediction.


