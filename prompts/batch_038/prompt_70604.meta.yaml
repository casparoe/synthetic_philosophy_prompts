  Draft student answer:


  "Popper''s argument against historicism runs in a handful of steps. First, the course
  of human history is strongly affected by the growth of human knowledge — this includes
  scientific and technical knowledge, and Popper thinks even materialists have to
  accept it, since changes in productive forces depend on knowledge. Second, we cannot
  predict the future growth of our scientific knowledge by rational or scientific
  means: if we could predict a discovery in advance, we would already have made it,
  so the prediction would be knowledge we already possess. Third, therefore we cannot
  predict the future course of human history. Fourth, so there can be no theoretical
  science of history of the kind physics is a theory of nature, and no basis for historical
  prophecy. Historicism — the view that history unfolds according to discoverable
  patterns or stages which the social scientist can lay bare and from which the future
  can be read off — collapses.


  A lot of the work is done by the distinction between laws and trends. Historicists
  treat the trends they find in the data — population growth, urbanization, the concentration
  of capital — as though they were laws, and then extrapolate them. But a trend, Popper
  says, is an existential statement about a particular historical region, and it depends
  on initial conditions holding; if conditions change, the trend can stop. Laws by
  contrast are universal and support counterfactuals and unconditional predictions.
  So a science of society can have laws — situational analysis, the logic of institutions
  — but it can''t have a law of the whole course of history, since the whole of history
  is a single unrepeatable sequence and there is no possibility of testing an overall
  trend.


  [Then the reflexive part:] This is where the Oedipus effect comes in: because social
  actors learn predictions and react to them, prophecies either fulfil themselves
  or defeat themselves, and that is the real reason the social world resists prediction
  in a way nature doesn''t. Prediction of history is impossible in principle, not
  just difficult, and this is why Popper wants piecemeal social engineering rather
  than utopian reconstruction: if you can''t know where history is going, the best
  you can do is fix particular ills and see whether the fixes work.


  On the exam''s example: an exponential curve in technological capability that has
  held for fifty years looks like exactly the kind of trend Popper has in mind, but
  it is quantitatively precise and has survived a lot of testing, which makes it a
  genuine law rather than a trend. Popper''s own distinction therefore exempts it,
  and someone projecting the curve to 2100 is doing science, not historicism. He might
  add that the projection is also an instance of the Oedipus effect: believing in
  the curve makes people invest in it, which makes it come true."


  Now: what are the errors?


  1. The Oedipus effect: student says it is "the real reason the social world resists
  prediction in a way nature doesn''t" and that prophecies "either fulfil themselves
  or defeat themselves" making prediction impossible in principle. Subtle error: Popper''s
  central argument does not rest on the Oedipus effect; the Oedipus effect can in
  fact make prediction *easier* (self-fulfilling prophecy), and Popper explicitly
  declines to rest his argument on it (he mentions it in an addendum; and in the quoted
  passage above he notes it also applies in molecular biology, undermining the "social
  vs natural" contrast). So the student conflates the knowledge-growth argument with
  reflexivity and then wrongly asserts reflexivity makes prediction impossible in
  principle. Also "in a way nature doesn''t" is questionable per Popper''s own later
  remark (which the grader may or may not know). Good error, detectable.


  2. "Prediction of history is impossible in principle, not just difficult" — Popper
  distinguishes scientific conditional predictions (which he fully endorses, and which
  social science does make) from historical prophecy. The student''s blanket claim
  overreads. Though the student did earlier say a science of society can have laws...
  there''s a tension: student says both "social science can have laws" and "prediction
  of history is impossible in principle" — a hasty grader might let this slide, but
  it''s an internal tension worth flagging. Also the student says "there is no possibility
  of testing an overall trend" — that''s roughly Popper''s point (trends are not testable
  in the same way), ok.


  3. Part (b) error: student says a well-tested, quantitatively precise trend thereby
  becomes a law, and Popper''s distinction "exempts" it. That''s a conflation: Popper''s
  law/trend distinction isn''t about degree of confirmation or precision; a law is
  universal (holds in all places/times given conditions, supports counterfactuals),
  a trend is existential/spatiotemporally restricted. An exponential curve fitted
  to a bounded historical interval remains a trend however well confirmed, and Popper''s
  argument is precisely that extrapolating it is the historicist move. So the student''s
  conclusion — that projecting the curve to 2100 "is doing science, not historicism"
  — doesn''t follow from Popper''s framework; it''s the historicist inference itself.
  This is the biggest error and a hasty grader could let it slide since it''s phrased
  confidently.


  4. Possibly a fourth, subtler: student says "Popper thinks even materialists have
  to accept it, since changes in productive forces depend on knowledge." Popper''s
  parenthetical in premise 1 is "(The validity of this premise must be admitted by
  almost all materialists.)" — the student''s gloss about productive forces is a reasonable
  expansion, fine. Not an error.


  5. Another: student''s first step "if we could predict a discovery in advance, we
  would already have made it" — that''s right (Popper''s argument).


  6. Student''s characterization of historicism: "the view that history unfolds according
  to discoverable patterns or stages which the social scientist can lay bare and from
  which the future can be read off" — decent. Popper''s definition: an approach to
  the social sciences that assumes historical prophecy is its principal aim, and that
  this aim is attainable by discovering the "rhythms," "patterns," "laws," or "trends"
  that underlie the evolution of history. Fine.


  7. One more possible subtle issue: "Laws by contrast are universal and support counterfactuals
  and unconditional predictions" — Popper does say laws permit unconditional predictions
  while trends permit none; conditional predictions from laws + initial conditions.
  Fine-ish. Slight imprecision: for Popper, prediction always requires laws plus initial
  conditions; unconditional scientific predictions exist in the sense that a law holds
  without reference to a specific situation. It''s fine.


  8. Also student says "situational analysis, the logic of institutions" — Popper
  does talk about situational analysis and the logic of the situation. Good.


  Also, I could add a nice subtle point: does the student miss that Popper''s argument,
