  \ and it's often argued completeness is normatively questionable). Also: the Savage\
  \ representation theorem does not yield uniqueness of probability/utility — utility\
  \ unique up to positive affine transformation, probability unique; but Savage requires\
  \ P7 and a rich outcome space. Also: money-pump arguments require the agent to be\
  \ myopic / not backward-induct; a sophisticated agent who anticipates can avoid\
  \ money pumps — this is Seidenfeld's critique. Also the \"diachronic Dutch book\"\
  \ arguments require sure-loss only if the agent is committed to bets in advance\
