  \ knowing specific philosophers' views; instead have the student make an argument-level\
  \ error.\n\nActually, a nice approach: combine domain \"coherence arguments for\
  \ EU maximization\" with an exam question that doesn't require niche references,\
  \ where the errors are conceptual/argumentative:\n- Error A: claiming intransitivity\
