  \ a representation result, not a claim that the agent has those beliefs/desires.\
  \ Also the \"no Dutch book\" argument for probability axioms shows coherence, but\
  \ the connection to EU maximization for acts is different.\n\nAlso: violating independence\
  \ axiom → money pump? Actually the classic result: violating independence of irrelevant\
