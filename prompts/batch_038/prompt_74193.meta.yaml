  \ money pumps\"). Subtle.\n\nMoral testimony: The puzzle of moral testimony (e.g.,\
  \ \"moral testimony pessimism\"): it seems permissible to rely on a thermometer,\
  \ or a math expert's testimony for a calculation, but relying on moral testimony\
  \ from an expert (e.g., accepting that eating meat is wrong because a philosopher\
  \ says so) seems to yield a belief that's not knowledge-worthy or that doesn't credit\
  \ the agent's character. Views: pessimism (Hills — the problem is not that moral\
  \ testimony can't transmit knowledge but that knowing-for-the-right-reasons matters\
  \ for virtue/praise; or the \"Availability of Reasons\" view), optimism (Sliwa,\
  \ Crisp), the \"no-moral-expertise\" view. Subtle mistakes: attributing to Hills\
  \ the claim that moral testimony cannot transmit knowledge (she argues it can transmit\
  \ knowledge but not understanding); conflating the epistemic problem (can't know)\
  \ with the moral/credit problem (not praiseworthy); thinking that deference to moral\
  \ testimony is like deference on empirical matters.\n\nMoral uncertainty: e.g.,\
  \ MacAskill's \"maximize expected choice-worthiness\" approach vs. voting theory\
  \ approaches (Borda), the \"ought implies can\" issue, the regress problem of uncertainty\
  \ about the decision procedure itself (MacAskill's solution), the \"fanaticism\"\
  /\"ought all-things-considered\" debate, paralysis argument. Subtle mistake: saying\
  \ that under moral uncertainty you should just maximize expected utility w.r.t.\
  \ your credences over choice-worthiness functions, ignoring that this requires interpersonal\
