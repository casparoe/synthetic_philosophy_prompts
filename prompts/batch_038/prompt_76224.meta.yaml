  Let me craft the phenomenon carefully.


  Candidate phenomenon (phil math): A software engineer notices that when nominalists
  are pressed, they say things like "mathematics is true, numbers don''t exist, and
  there''s no contradiction, because ''there are numbers'' is only true within the
  mathematical way of talking" — and platonists reply that this is just platonism
  with a disclaimer, since the nominalist still agrees with every mathematical sentence,
  agrees that they''re literally true, and can''t say what''s left. The engineer notices
  that the *entire* dispute seems to survive total agreement on all sentences and
  all practices: they agree on every theorem, every proof, every application, and
  even (he thinks) on what "true" means when applied to arithmetic sentences, and
  the only difference is a further attitude towards a word — "exist". And yet neither
  side says the dispute is verbal; both insist it''s substantive, and when asked to
  say what would settle it or what turns on it, they give... something. Hmm, is there
  a name? Related concepts: "ontological disputes as merely verbal" (Hirsch''s "quantifier
  variance", Chalmers''s "verbal disputes" methodology, the "bedrock" intuition),
  "the deflationary turn", "easy ontology" (Thomasson), "ontological realism vs. deflationism",
  "internal vs external questions" (Carnap). So the phenomenon = agreement on all
  first-order claims + disagreement only about ontological commitment → "merely verbal
  dispute"/"quantifier variance". That''s fairly well-known, and a good answer would
  discuss Hirsch, Chalmers''s verbal-dispute test, Carnap, Thomasson''s easy ontology.
  But is it too regurgitated? Possibly. We want more in-the-weeds.


  Refinement — a subtler phenomenon: the disagreement persists even when both sides
  agree that there is no fact about what "exists" means, and both sides agree on all
  applications, yet each says the other is *wrong*, not just speaking differently.
  And crucially: each side''s argument for substantivity is that the other''s view,
  if true, would have to be *false* in a way that... hmm, getting tangled.


  Alternative, sharper phenomenon in the platonism/nominalism debate that''s genuinely
  in the weeds:


  The way each side answers an objection by claiming the objection presupposes the
  other side''s standards. E.g., nominalist objects that platonism can''t explain
  how we know about causally inert objects; platonist replies that this objection
  presupposes an empiricist account of knowledge that already rules out mathematical
  knowledge, i.e., it''s question-begging; the nominalist replies that the platonist''s
  reply presupposes that mathematical knowledge is sui generis. So both sides accuse
  each other of begging the question, and each accusation is (locally) correct, and
  yet the debate continues with both sides thinking they''ve made progress. Is there
  a name for "a debate in which every argument is question-begging relative to the
  other''s framework, but neither side is merely restating its position"? Related:
  "the problem of the criterion", "dialectical stalemate", "framework-relative justification",
  "criterion problem", "epistemic circularity", "the paradox of the criterion", "hermeneutic
  impasse". Hmm, decent.


  Another candidate phenomenon (very good, in-the-weeds): The nominalist says mathematics
  is indispensable to science, so we should believe in numbers (that''s Quine–Putnam
  — but wait, that''s the platonist''s argument). Consider the *reverse*: the nominalist
  argues that we should believe in numbers only insofar as they''re indispensable,
  and then someone notices that "indispensable" gets used in two ways: indispensable-to-our-best-theories
  (an empirical matter, gradual, revisable) and indispensable-in-principle (a modal/conceptual
  matter). And arguments slide between the two: the indispensability argument needs
  the first (contingent, so mathematical ontology becomes hostage to current physics),
  but the replies to it (Field''s fictionalist programme: "you could in principle
  recast physics without numbers") defend the second — and showing something is dispensable
  *in principle* doesn''t show it''s dispensable *in practice*, yet the debate treats
  Field''s success as refuting Quine. Is there a name for this equivocation between
  practical and principled dispensability? Related: "idealisation", "ceteris paribus",
  "the difference between eliminability and elimination". Hmm, this is good and in
  the weeds, but maybe too dependent on remembering Field and Quine–Putnam accurately.
  It''s fine — those are well-known enough. But the persona is a software engineer
