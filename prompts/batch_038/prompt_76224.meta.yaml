  (the "criterion of coherence"/"double dissimilarity"). Hmm, maybe "epistemic circularity"
  (Alston), "bootstrapping" (Vogel), "the problem of easy knowledge" (Stewart Cohen).
  Ooh — that''s a nice link: Stewart Cohen''s "basic knowledge and easy knowledge"
