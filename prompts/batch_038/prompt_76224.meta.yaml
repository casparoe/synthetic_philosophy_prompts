  Pascal''s wager phenomena:

  1. The objection that the wager selects the wrong god (the "many gods" objection)
  — well known.

  2. The phenomenon where someone responds to the "God wouldn''t reward mercenary
  belief" objection by saying the belief needn''t be mercenary once acquired — belief
  formation via non-truth-directed means producing a belief held for truth-directed
  reasons. Is there a name for that? Related: "doxastic involuntarism", "belief induction",
  "self-deception", "Pascal''s own answer" (take holy water, have masses said — habit
  will make you believe). The general phenomenon: using non-epistemic means to bring
  yourself to hold a belief, and then the belief is genuine. Terms: "indirect doxastic
  control", "doxastic voluntarism (indirect)", "self-deception", "motivationally biased
  belief", "alief" (Gendler) vs belief, "faith as venturing". Hmm — a phenomenon where
  the person sincerely reports believing but behaves inconsistently under stress —
  that''s "alief" or "incontinent belief" / "belief-pretence". Actually there''s a
  nice one: a person who has convinced themselves to believe for pragmatic reasons,
  and who, in ordinary life, behaves as if the belief is true, but under certain conditions
  (e.g., a bet on their own life, or when reasoning carefully) reverts. Is there a
  name for the co-existence? "Half-belief", "belief fragmentation", "compartmentalisation",
  "doxastic fragmentation" (Egan), "belief/alief mismatch". This is a real literature
  but the described phenomenon would fit it imperfectly.


  3. A phenomenon about the structure of the argument: the wager says even a tiny
  probability of infinite reward dominates; critics say probability must be well-defined;
  and a third group says the real issue is that the utilities aren''t comparable.
  And a fourth move: "mixed strategies" (someone pointed out you can hedge by hedging
  — Jordan''s "many-gods" refinement / "mixed strategies" in decision theory). Hmm.


  4. Interesting, in-the-weeds phenomenon: people who accept the wager''s logic but
  note it self-destructs — once you have the belief by the wager''s method, you also
  come to believe the proposition that the wager''s method is unreliable, which undermines
  the belief''s warrant; or the belief you get is "belief that I should act as if"
  rather than belief that God exists. Is there a name? "Pragmatic contradiction",
  "self-undermining", "self-effacing", "esoteric morality"? Hmm. "Decision-theoretically
  self-defeating". There''s a concept: "self-effacing" reasons/utilitarianism (Parfit).
  Also "bootstrapping" (Broome''s objection to bootstrapping in practical reasoning:
  you can''t create a reason for an action just by deciding to intend it). Ah — that''s
  interesting: the phenomenon of "creating a normative reason for yourself by a decision,
  which the theory then counts as a genuine reason" — Broome''s bootstrapping objection.
  Applied to belief: you can''t bootstrap yourself into a justified belief. But that''s
  more of a named argument than a phenomenon.


  Let me consider historical Jesus / criteria of authenticity.


  Phenomena there:

  1. The criterion of embarrassment: a saying that would be embarrassing for the early
  church is likely authentic. Counter-phenomenon: a saying is embarrassing but the
  evangelist includes it anyway precisely because it''s embarrassing for the *opponents*,
  or because the embarrassment is later resolved by the narrative. So the criterion
  double-counts. Hmm.

  2. The phenomenon where a criterion is *only* usable on material that the tradition
  had no motive to create, and therefore the criterion systematically excludes the
  most theologically significant material — so what survives the criteria is a Jesus
  who resembles no one anyone would recognise, and the criteria guarantee the result.
  There''s a known criticism: the criteria "presuppose that the earliest tradition
  is the most reliable" or that they screen out the eschatological Jesus... Actually
  the well-known critique is that criteria of authenticity can''t establish a coherent
  picture and that they privilege the "ipsissima verba" quest — the "Third Quest"
  reaction, the "criteria are not criteria" debate (Chris Keith, Anthony Le Donne,
  "Jesus, Criteria, and the Demise of Authenticity"). Also "the criterion of dissimilarity
  double-binds: a Jesus who is dissimilar to both Judaism and the early church is
  inexplicable."

  3. A really nice in-the-weeds phenomenon: the criterion of multiple attestation
  says a saying is likely authentic if it appears in independent sources; but the
  sources we have may all derive from a single earlier source, and worse, when a saying
  is attested in "independent" sources, the independence is often argued from the
  *style* differences between them, while the authenticity is argued from their *agreement*
  in content — i.e., you use difference to establish independence and then agreement
  to establish authenticity, and the two can''t both be doing the work you need. Is
  there a name for this? Something like "the independence–agreement tension"? Related
  concepts: circularity, "double-counting evidence", "corroboration vs. contamination",
  "the problem of Q and Markan priority", "source criticism", "criterion of coherence"
  (which says a saying is authentic if it coheres with other authentic sayings — which
  is circular in a specific way). Hmm — there''s a known charge that the criteria
  are circular: coherence presupposes a corpus established by other criteria. Also
  "the criteria are mutually undercutting": embarrassment and dissimilarity can pull
  in opposite directions.


  Actually here''s a genuinely interesting, carve-y phenomenon for this domain:


  The pattern where a scholar rejects a saying as inauthentic because it fits too
