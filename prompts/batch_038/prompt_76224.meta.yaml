  Phenomenon for inheritance/dynastic wealth/equal opportunity:


  A software engineer describes: In discussions about inheritance tax, they keep seeing
  the same structure. Someone says: "It''s not the child''s fault that they were born
  rich, so punishing them for it is unfair" — and the opponent says: "It''s not the
  poor child''s fault either, so leaving them behind is unfair." Both sides are making
  claims about *who is responsible for what*, and they agree that being born into
  wealth or poverty isn''t the child''s doing, but they disagree about whether that
  fact counts against taxing the transfer or against not taxing it. The engineer notices
  something more specific: the argument turns on whether the *relevant baseline* for
  comparison is (a) the recipient''s position before the transfer, (b) the recipient''s
  position relative to other children, or (c) the recipient''s position relative to
  what they''d have if all transfers were taxed away. And each side quietly picks
  the baseline that makes their conclusion follow, and when challenged, says the baseline
  is obvious.


  Hmm, is that the phenomenon? "Baseline-relative reasoning where the choice of baseline
  determines the verdict" — related concepts: "the baseline problem" (in law/economics:
  Fischel & Percival? "the baseline problem" in environmental law), "status quo bias",
  "entitlement baseline" (Epstein), "Nozick''s historical entitlement vs end-state
  principles", "the ''how much is enough'' problem", "level playing field". Actually
  there''s a well-known thing: in debates over regulation/takings, "baseline" choice
  determines whether something is a taking or a subsidy — Fischel and Percival''s
  "baseline problem". Hmm.


  But there''s an even better, more distinctive phenomenon for this domain that I
  find genuinely interesting:


  The observation that objections to inheritance tax appeal to the *family* as a unit:
  parents are said to have a right to provide for their children, and this right is
  treated as an extension of the parent''s own property right. But the engineer notices:
  the strength of the intuition varies enormously with the *number* and *identity*
  of the transfers in ways no principle predicts — e.g., almost nobody objects to
  a parent paying for their child''s education, or leaving them the family home, but
  many object to leaving them a portfolio; yet the effect on the child''s competitive
  position is far greater in the education case per pound? Hmm, not exactly.


  Or: the phenomenon that people object to inheritance tax on grounds that would equally
  justify objecting to gifts inter vivos, and to parents teaching their children anything,
  and to genetic endowment — and when the objection is generalised that far, most
  people abandon it, but there''s no principled stopping point; and the point at which
  people stop seems to track not the size of the advantage but whether the advantage
  is *transferable to a stranger* / whether it can be *bought*. That is: the intuition
  seems to track "marketability" or "convertibility into cash", not "advantage in
  life chances". Interesting! So the phenomenon: advantage transmitted by inheritance
  is objected to, but advantage transmitted by *parenting* (reading to your child,
  school choice, connections, accent, confidence) is not, even though the latter is
  larger and also unchosen; and the difference people point to is that one involves
  a transfer of *property*. Is there a name for this? Related concepts: "the arbitrariness
  of natural and social contingencies" (Rawls), "familial partiality" / "bedtime stories
  problem" (Fishkin! — James Fishkin''s "the bedtime stories" objection to equal opportunity:
  parents reading to their children at bedtime confers advantages that no equal-opportunity
  regime could neutralise without destroying the family). That''s a real, somewhat-in-the-weeds
  thing: Fishkin''s "unequal starting gates" / "the family as an obstacle to equal
  opportunity". Also "the paradox of meritocracy", "luck egalitarianism''s harshness",
  "parental partiality". Also "brute luck vs option luck" (Dworkin), "the leveling-down
  objection".


  So a great phenomenon for this domain: the noticing that any policy that genuinely
  equalises opportunity must regulate *intimate* parental behaviour (reading, music
  lessons, choosing where to live, choosing a partner), and that objections which
  stop at cash transfers look arbitrary — because the mechanism that transmits advantage
  isn''t the money, it''s the whole package of parental investment, of which money
  is a fungible part. And the reverse observation: people treat the cash transfer
  as the thing to tax because it''s *legible and divisible*, whereas the non-cash
  transmissions are neither. Is there a name for the tendency to regulate what''s
  measurable and legible rather than what''s causally decisive? Related: "legibility"
  (James C. Scott, Seeing Like a State), "streetlight effect / McNamara fallacy",
  "proxy problem", "Goodhart''s law", "the measurement problem in policy", "administrability"
  (in tax law: "administrability" is a genuine criterion in tax policy — Kaplow!),
  "the taxation of what can be taxed", "fungibility".


  Ooh, this is nice: the phenomenon = "we tax/regulate the part of a causal process
  that is administratively tractable, and then describe the resulting policy as targeting
  the injustice, even though the injustice is transmitted mostly by the untractable
  parts". Names: "administrability" (tax scholarship), "legibility" (Scott), "McNamara
  fallacy", "surrogate/proxy targeting", "Goodhart". And in the equal-opportunity
  context specifically: Fishkin''s bedtime stories, "the family as a mechanism of
  privilege transmission", "starting-gate theory" (Steiner/Vallentyne) — which is
  precisely the view that tries to fix this by taxing at the starting gate and then
  letting transfers run free. And starting-gate theory has a known problem: it can''t
  handle *ongoing* familial transmission, only the initial snapshot.


  So the described phenomenon could be: the intuition that a one-off redistribution
  at the start of each generation''s life would be fair, but continuous small advantages
  would still accumulate — and the observation that people who propose "equalise at
  the starting gate" ignore that the gate is being re-opened continuously by parents''
  daily actions. Is there a name for the distinction between "one-shot equalisation"
  and "continuously maintained equality of opportunity"? That''s a real distinction:
  "starting-gate theories" (Hillel Steiner, Peter Vallentyne, "left-libertarianism"),
  vs "continuous/dynamic" egalitarianism. Also "equality of opportunity vs equality
  of outcome", "the ''level playing field'' as a stock vs a flow". A software engineer
  would love the stock/flow framing! That''s a nice angle: the engineer notices that
  the whole debate conflates a stock (accumulated wealth at a moment) with a flow
  (the rate at which advantage is transmitted per year), and that inheritance tax
  addresses the stock at one instant while the flow continues — and that a tax on
  the stock is like levelling a reservoir while the inflow pipe is untouched. Is there
  an established concept for this in political philosophy? Nearest: starting-gate
  theory, luck egalitarianism, Fishkin''s familial partiality problem, "the transmission
  mechanism of privilege", "compound interest of advantage"? Also relevant: "the ''aristocracy''
