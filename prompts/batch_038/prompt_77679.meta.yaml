  1. Accepting REU (risk-weighted) rationality while also endorsing diachronic Dutch-book
  / dynamic consistency: REU violates dynamic consistency, and Buchak herself embraces
  planning ahead (resolute choice) rather than dynamic consistency. So someone who
  says "REU is rational AND dynamic consistency is required of rational agents AND
  I reject resolute choice / sophisticated choice" is in tension.

  2. Rejecting state-wise dominance (Savage''s P2, sure-thing principle) while also
  holding that rational agents should not be exploitable / should maximize in a "actwise"
  way. REU rejects actwise dominance. So claiming "I only reject the independence
  axiom, not dominance" is a misunderstanding.

  3. Believing REU explains the Allais paradox preferences (common consequence effect)
  while also holding the classic pattern of Allais preferences — actually REU with
  a convex risk function can capture Allais-type preferences. Hmm.

  4. Tension: accepting REU as rational AND accepting that risk attitudes should be
  captured in the utility function (i.e., expected utility with concave utility over
  money) — these are rival explanations of the same data. Someone could hold "risk
  aversion is just concave utility" AND "REU''s risk function captures genuine risk
  attitudes that EU misses" — that''s a tension.

  5. Apparent tension that dissolves: "I think REU maximizers are irrational in single-shot
