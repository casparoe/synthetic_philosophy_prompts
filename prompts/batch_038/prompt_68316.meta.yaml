  Since March, the two of us who run a small quantitative consultancy have been deadlocked
  over whether to keep funding a portfolio company''s core technology. We have shared
  every document, sat through the same site visits, and put our numbers in writing
  at every partnership meeting: I put the probability of technical success at about
  0.2, he puts it at about 0.7. Last week our third partner, who has an economics
  PhD, circulated a memo arguing that this deadlock is not a substantive disagreement
  at all but a proof that one of us has failed somewhere, and that the only rational
  course is to suspend. I want to find the flaw before Thursday''s meeting and I cannot.
  Here is his argument, with my numbering; I have tried to state each step as strongly
  and as charitably as I can.


  1. Aumann''s agreement theorem: if two agents are Bayesian and share a common prior,
  then their posterior probabilities for the same event cannot be common knowledge
  between them unless those posteriors are equal. Rational agents cannot agree to
  disagree.

  2. This is a logical and not a practical limitation: there is no state of the world
  describable in which all of the following hold together — a common prior, Bayesian
  updating, and common knowledge of unequal posteriors.

  3. We satisfy the anteced: we have a common prior (4), we both update by conditionalization
  (5), and our posteriors are common knowledge between us (6).

  4. On the prior: nothing about the world made one of us an optimist and the other
  a pessimist. A difference in priors would itself have to be justified by a difference
  in evidence, and we have had no such difference — we have seen the same documents.
  Our third partner adds that Aumann himself holds that people with similar backgrounds
  cannot justifiably have different priors in the first place.

  5. On updating: we are both trained in this, we are both careful, neither of us
  has ever been caught misweighting evidence, and each of us would correct himself
  if shown a mistake.

  6. On common knowledge: our numbers have been stated aloud, in writing, in front
  of the whole partnership, monthly, for eight months. Everyone knows everyone''s
  number; everyone knows that everyone knows; there is no depth at which this iteration
  stops.

  7. Therefore the situation we are in is impossible.

  8. Since it is nonetheless the situation we are in, at least one of the conditions
  in (3) must be merely apparent — and we are inside the case, so we cannot tell which.
  It might be your rationality, my rationality, our priors, or the common-knowledge
  claim.

  9. When several necessary conditions are known to have failed jointly and you cannot
  identify which one, continuing to rely on the output they were supposed to guarantee
  is arbitrary. So neither of us may keep his number.

  10. Nothing in (1)–(9) mentions our technology, our personalities, or our evidence.
  Hence: no two mutually transparent, honest, competent people can rationally disagree
  about anything, and every standing disagreement among such people — in a laboratory,
  a boardroom, a courtroom, a philosophy department — is evidence that someone has
  lapsed. Since no participant can tell who, every such disagreement obliges all parties
  to suspend.

