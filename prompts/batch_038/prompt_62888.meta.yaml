  distort the timing of consumption/sale, and it presupposes that unrealized gains
  are somehow not yet "income" — a realization doctrine.

  - Inconsistency with the estate tax: estate tax treats death as a moment of transfer
  that the state may reach, so the decedent''s death does transmit value; but basis
  step-up treats the gain as vanishing. Also inconsistent with the gift tax''s carryover
  basis (in the US, gifts generally carry over basis, with some adjustments for gift
