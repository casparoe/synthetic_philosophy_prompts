  accretions of a continuing person, and that the person literally ceases to exist
  at death so there is no one left to tax; that ownership is a relation between a
  person and a thing that terminates rather than transfers; that capital gains are
  somehow attributable to the decedent''s own activity and die with them; that heirs
  are "new" owners acquiring fresh title. Rival views it rules out: an accretion/Haig-Simons
  view of income; a view of the family/dynasty as a continuing economic unit; a view
