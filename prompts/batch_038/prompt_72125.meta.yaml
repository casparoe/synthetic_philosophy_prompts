  ---

  I''m teaching a political ethics seminar and I want to use Spielberg''s Lincoln
  (the 2012 one, Kushner''s script) as the centerpiece for a unit on dirty hands,
  but I''m worried the film is actually a bad vehicle for Walzer''s argument and I
  can''t quite put my finger on why.


  Here''s the reading I want you to do. Walzer''s point in "Political Action: The
  Problem of Dirty Hands" is not just that politicians sometimes have to do lesser
  evils. It''s that the one who does them should still be guilty — the guilt is what
  marks the act as genuinely wrong rather than merely costly, and a politician who
  feels nothing is a monster, not a hero. So my working test — call it the residue
  test — is: does the story leave the agent morally worse off after the plan succeeds,
  in a way the success doesn''t cancel?


  Run the film against that. Take the obvious case, Lincoln''s written answer to the
  House about whether there are peace commissioners at Hampton Roads, and then take
  Thaddeus Stevens being pressed on the floor about the woman he lives with, and the
  two patronage men Seward sends to buy votes. Whose hands actually get dirty in this
  film, and does the film care? My hunch is that it gives Stevens a residue scene
  and Lincoln something close to none, which if right would mean the film is a Walzerian
  document about a congressman and a straightforwardly consequentialist one about
  a president — and that''s a weird inversion of who the audience is supposed to think
  is the statesman.


  Then the harder question... the distribution problem: Walzer''s paradigm is a single
  ruler who decides alone, in a room... but Lincoln is about a coalition: Seward,
  the lobbyists, Blair, the lame-duck Democrats, the Radical Republicans, Stevens.
  If the wrong is distributed over all of them, whose guilt is it? Does the film give
  anyone the burden of holding it, and can dirty-hands theory even handle a collective
  agent, or does it silently require a single pair of hands to be intelligible?


  And a counterfactual... if the film had ended with the lie exposed and the amendment
  lost, would it be a better dirty-hands film or just a tragedy? What does that tell
  us about whether dirty hands is really a distinct moral category or just consequentialism
  with bad lighting?


  Don''t quote the film or Walzer verbatim — I don''t need line-level accuracy...
  Do tell me which scenes you''d screen in class and which you''d cut, and be honest
  about where the film resists the reading.


