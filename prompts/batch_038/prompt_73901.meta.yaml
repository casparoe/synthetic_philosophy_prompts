  implementation difficulties, you may concede that convergence is not guaranteed,
  you may concede that the idealization recipe admits of more than one reading. You
  may not concede that the view collapses into the theorist''s own values being imposed
  under a technical-sounding name, and you may not concede that idealized preferences
  lack authority over actual ones. Keep each reply to two or three paragraphs and
  close either with your answer or with the question you want to put back to me.


