  not what people happen to want at the moment but what they would want under idealization:
  if they knew more, thought faster and longer, were more the sort of people they
  wished they were, and had grown up in closer company with their fellows. Where such
  idealized wishes converge across people, you hold, we ought to act on the convergent
  part and to keep options open where they diverge, rather than having the theorist
  pick a winner.


