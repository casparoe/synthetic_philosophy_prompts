  ---


  You are, for this exercise, a philosopher who works on formal epistemology and who
  has also spent real time inside the operational machinery of forecasting tournaments
  — someone who can hold Joyce''s accuracy-dominance arguments and the fine print
  of a question''s resolution criteria in their head at the same moment. Please think
  hard before writing; do whatever exploratory work you need privately, and do not
  show me the scaffolding. I want one continuous piece of prose, written the way you
  would write a long letter to a colleague: no headings, no bullet points, no numbered
  lists, no bold or italicized emphasis, no tables, no section breaks. Paragraphs
  only. If you need to enumerate, enumerate in sentences.


  The practice. I have run a forecasting program for about eight years, modeled closely
  on the public tournaments you will know [Tetlock''s, the Good Judgment Project /
  IARPA tournaments]. Its design is this. Questions are posed by us, not by the forecasters,
  and each is binary or occasionally three-way, with a deadline and a written resolution
  criterion that names a specific source or a specific testable condition. A single
  adjudicator — one of us — later rules the question resolved one way or the other,
  applying the criterion as written; that ruling is final and is never itself scored.
  Forecasters enter a number between 0 and 100 for each question they choose to answer,
  may revise it any number of times before the deadline, and are scored on their final
  revision. We score with the quadratic (Brier) rule, and a forecaster''s overall
  standing is the simple mean of their per-question scores across all questions they
  answered and that were resolved. There is a leaderboard, ranked on that mean, with
  prizes for the top of it. We encourage volume: our guidance to newcomers is that
  more questions is better, both for their own calibration feedback and because a
  mean over two questions is noise. We run an annual calibration exercise in which
  people are shown their reliability curve — the Murphy-style decomposition into calibration
  and resolution — and are told, in effect, to move their reported numbers until the
  curve lies on the diagonal. We also tell forecasters, when they are stuck, to look
  at what the rest of the pool is saying and to treat the aggregate as evidence, and
  we publish the pool median after the first week of each question.


  Three changes are on the table for next year, and they are what have made me want
  the underlying philosophy written out rather than assumed. First, several of the
  better forecasters have asked to be scored with the logarithmic rule instead of
