  Being John Malkovich is a strong candidate. Hofstadter''s ideas: the self as a strange
  loop, a pattern that can be realized in another brain; "I am a strange loop" and
  the claim that love is the incorporation of another into one''s self; the idea that
  a person''s self can survive partially in others (he writes about his mother and
  about Carol). Also the "soul is a pattern, and patterns can be split, copied, degraded."
  The film''s ending: multiple consciousnesses sharing one infant brain — Hofstadter
  would say that''s not impossible in principle, but the film treats it as a horror/comedy.
  The film''s complication: the film actually treats selves as transferable *substances*
  (a portal, a physical passage), which is a Cartesian picture Hofstadter rejects;
  what Hofstadter offers is gradual, pattern-based, degree-graded incorporation. So
  the reading can be faithful in both directions: the film dramatizes multiple occupancy
  and the persistence of the self in others, but it smuggles in a "self as passenger"
  metaphysics that the strange-loop view denies; meanwhile the strange-loop view explains
  something the film shows but never explains — why Malkovich''s own self degrades
  (the vessel''s pattern gets overwritten), why the "Malkovich Malkovich Malkovich"
  world is a picture of what happens when there''s no differentiation of patterns.


