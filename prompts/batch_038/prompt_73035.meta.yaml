  Phenomenon candidate: IIT says consciousness = integrated information Φ, and Φ is
  defined relative to a choice of system boundary and a choice of elements; the theory
  adds a postulate (exclusion) that picks out the local maximum. But critics note
  that for any given physical system you can always find a subset or a coarse-graining
  with higher Φ, and that adding a single element can drastically change Φ, so the
  value isn''t stable. And the response is that Φ is what it is. Meanwhile, the theory
  also says Φ can be very high for systems that are intuitively not conscious (a sufficiently
  large grid of logic gates, or a "Chinese nation" implemented in a photodiode array).
  And IIT''s defenders say that''s fine — it''s consciousness without experience-as-we-know-it,
  or "alien consciousness." The phenomenon: a theory identifies a mental property
  with a physical quantity and then, when the quantity is instantiated where the mental
  property intuitively isn''t, refuses to treat it as a counterexample, calling the
  intuition parochial. Is there a name for this move? Nearest: "bullet-biting", "reflective
  equilibrium" (adjusting the theory vs. the intuition), "the methodology of counterexamples",
  "intuition-mongering", "the cost of a theory", "revisionary analysis", "Moorean
  shift"? Hmm — "biting the bullet" is the folk term. And there''s "the argument from
  weird consequences" / "the objection from promiscuous realism." Also "the generality
  problem."


