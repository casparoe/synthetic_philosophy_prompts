  "Φ is uncomputable/intractable" (NP-hard — Tegmark computed it''s NP-hard), "the
  combination problem", "the problem of panpsychism", "IIT implies consciousness in
  simple circuits" (Searle-like reductio), "the excluded entities problem". And there''s
  a very specific one: IIT''s axioms are said to be self-evident and the postulates
  "the only way" to satisfy them — critics call this "axiomatic dogmatism" or note
  the theory is "a priori" and thus immune to empirical refutation. Also: IIT and
