  Common analogies in Kelly/expected utility debates:

  - "The market is like a casino" / "the casino has an edge" — Kelly criterion applied
  to gambling.

  - "Betting is like investing: you should maximize expected value."

  - "Time is like an ensemble" — Ole Peters'' argument: ergodicity economics. The
  analogy between time averages and ensemble averages. Actually the key analogy: "a
  single person living a long life is like a crowd of people living one day each"
  — that''s the ergodicity assumption. This is used by Peters to argue expected utility
  theory is wrong, and by critics to argue it''s fine.

  - "Your life is like a repeated coin flip game" — the multiplicative dynamic.

  - The "insurance" analogy: buying insurance is a negative-EV bet but rational.

  - "Kelly betting is like a ratchet."

  - Also: "the stock market is like a casino where the house always wins" vs "the
  market is like a positive-sum game."


  Another good one: the analogy between geometric mean maximization and "evolution
  maximizes fitness" — natural selection as a Kelly bettor. Actually there''s a real
  analogy: population growth rate is the geometric mean of per-generation growth —
  Lewontin & Cohen. And "the market selects for Kelly bettors" (Friedman''s argument
  that firms with positive expected profits survive — the market as an evolutionary
  selection device). Milton Friedman''s "as if" maximization argument is essentially:
  the market is like natural selection, so firms behave as if maximizing expected
  profit. That''s a great analogy to audit — it maps onto Kelly/geometric rationality
  debates nicely: the market "selects" for long-run growth-rate maximizers, which
  is exactly the Kelly criterion. But the disanalogy: selection requires that failures
  die and can''t come back (bankruptcy is absorbing), whereas firms can recover; and
  selection is over the ensemble, not the time average, unless ergodic.


