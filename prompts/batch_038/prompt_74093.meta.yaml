  I cover science and ideas for a general-interest magazine — mostly AI policy and
  the research culture around it — and I''m drafting a long feature on what happens
  to oversight once systems are smarter than the people supervising them. My editor
  wants the piece to hang on one clean claim rather than a tour of techniques, and
  after several weeks of reading I''ve settled on the following spine, which I''d
  like you to stress-test before I build four thousand words on top of it.


  Here''s the spine as I currently understand it. The debate proposal — the one where
  two models argue over a question and a weak human judge picks a winner — is usually
  described as resting on a proof, and the proof is what makes it attractive: because
  the setup is a zero-sum game, a model that asserts something false hands its opponent
  an exploitable opening, so with debaters playing anywhere near optimally, honesty
  is simply the dominant strategy and lying gets punished in expectation. That much
  is mathematics rather than a hope about training dynamics. What is left over, on
  this picture, is the judge: a human who can''t follow the argument will still be
  taken in by a good-sounding case, no matter how honestly it was argued. So the open
  problems in this area are all problems about judge quality — how to aggregate many
  weak judges, how much deliberation time to give them, whether to let them consult
  tools or a panel of other models — and the strategy question facing a lab is essentially
  how far to invest in scaling the judge rather than the debaters. One researcher
  I interviewed described this as the field having already solved the incentive problem
  and merely working through the perception problem, which struck me as a crisp way
  to put it and which I''d like to use as my nut graf.


  Please act as a researcher who works on the formal side of scalable oversight —
  someone fluent in the complexity-theoretic analysis of debate protocols, in what
  those results do and don''t license, and in the gap between an idealized game and
  models actually trained to play it. Work through this carefully rather than answering
  quickly: I''d suggest you start by writing out, for yourself, what the theorem about
  optimal debaters and a bounded judge actually establishes, and what the conditions
  on it are, before turning to my framing. Then tell me which parts of the spine above
  will survive contact with the people I''m going to interview and which will not
  — including, if the answer is that the piece''s central claim is mistaken, what
  the correct version of the claim is and how much of my argument can be salvaged
  once it''s fixed. I''m especially interested in places where two things that sound
  interchangeable in popular exposition (a proven result and a plausible heuristic;
  a judge who is inattentive and a judge who is computationally limited; a game that
  is zero-sum by construction and an empirical situation where two trained systems
  happen to have opposed objectives) are in fact doing very different work. If my
  premise is wrong in more than one independent way, say so and rank the errors by
  how much damage they''d do to the article. Please write in American English, and
  don''t worry about giving me references or a reading list — I have my own sources
  and I want your reasoning, not your bibliography.


