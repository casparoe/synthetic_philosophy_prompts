  Better: make the summary from an unnamed podcast or a review essay in a magazine
  about "the logic of nuclear brinkmanship," written by a competent popularizer. Content:


  "Here''s the paradox Schelling identified: a deterrent threat only works if your
  adversary believes you''d actually carry it out. But once the attack has happened,
  carrying out the retaliation would be pure suicide — there''s nothing left to protect
  — so no rational leader could ever intend it. Deterrence therefore rests on a bluff
  everyone knows is a bluff, and the only way to make it work is to convince the other
  side that you might be crazy. That''s what ''the rationality of irrationality''
  means: you have to seem out of control to be in control. Schelling''s fix was what
  he called the threat that leaves something to chance: instead of promising a strike
  you can''t rationally make, you deliberately create a situation where war could
  start by accident or through escalation nobody can stop, so the enemy backs down
  out of fear of losing control. This is what brinkmanship means — being willing to
  go over the edge — and it''s why the Cuban Missile Crisis was won by Kennedy''s
  willingness to invade Cuba, and why deterrence has nothing to do with actual military
  capability."


  Errors to plant (subtle):

  1. Conflating deterrence with compellence — the popularizer says "deterrence has
  nothing to do with actual military capability" and treats all threats as deterrent
  threats; Schelling insists deterrence (passive, maintaining status quo, credible
  with survivable second-strike forces) is far easier than compellence (active, requires
  doing something, needs more than retaliation). Also "willingness to invade Cuba"
  is compellence/denial, and the resolution involved a trade (Turkey), which the summary
  erases.

  2. "No rational leader could ever intend it" — overstates: Schelling''s point isn''t
  that the threat is a bluff everyone knows is a bluff; a commitment can be real (irrevocable
  delegation, tripwire forces, launch-on-warning postures, "the hand that pushes the
  button"), and Schelling''s key move is that the threat need not be a promise of
  deliberate, controlled, calculated response — you can rationally intend to create
  *risk*. Also the summary flips it: Schelling says you don''t need to be willing
  to actually go to war; the whole point of the risk strategy is that nobody has to
  intend the catastrophe. So "brinkmanship means being willing to go over the edge"
  is exactly backwards — brinkmanship for Schelling is the deliberate creation of
  a shared risk of slipping over, not the willingness to jump. That''s the central
  subtle inversion.

  3. "You have to seem crazy / the only way is to convince them you might be irrational"
  — this is the pop gloss; Schelling''s account is richer: commitment works through
  the manipulation of incentives and information (delegation, visible constraints,
  burning bridges, the "rationality of irrationality" as a strategic posture, and
  the fact that some kinds of irrationality—like a reputation for recklessness—can
  be cultivated rationally, but you don''t need actual madness; also the point that
  credibility comes from the *situation*, e.g., tripwire forces in Berlin whose deaths
  make response automatic, not from a leader''s psychological state).

  4. "Deterrence therefore rests on a bluff everyone knows is a bluff" — conflates
  bluff with commitment: Schelling explicitly distinguishes a threat you don''t intend
  to execute (bluff, which fails if seen through) from a commitment (you bind yourself
  so that executing or not is taken out of your discretion). Subtle error.

  5. "the only way to make it work is to convince the other side you might be crazy...
  nothing to do with actual military capability" — the second-strike capability point:
  deterrence''s credibility comes substantially from survivable forces and the structure
  of the situation (mutual vulnerability), not from psychology. Also, self-deterrence:
  the summary treats mutual vulnerability as purely paralyzing, whereas Schelling
  argued that shared fear of uncontrolled escalation is exactly what makes the threat
  credible — mutual vulnerability is the resource, not the obstacle. Nice.

