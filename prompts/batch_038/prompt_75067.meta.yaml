  Kant on animals is a good candidate — there''s a very common summary that says Kant
  thought animals are mere things, that we have no duties to animals, and that cruelty
  to animals matters only because it hardens us toward humans. Actually that''s roughly
  right-ish: Kant''s indirect duty view. The subtle misrepresentation: Kant does say
  we have no direct duties to animals, but he does think animals have analogues of
  reason, and the "cruelty coarsens" argument is Kant''s, so a summary that says animals
  matter only instrumentally... Hmm. A good subtle error: claiming Kant thought animals
  can''t suffer / are automata (that''s Descartes), or claiming Kant''s basis for
  indirect duty is that cruelty to animals makes us cruel to humans (Kant actually
  frames it as dulling the shared feeling of suffering, weakening a natural predisposition
  that helps morality) — that''s subtle. Also the claim that Kant denies animals are
  ends — actually Kant says animals are ends in themselves? No, Kant says animals
  are not persons, they are things... Actually in the Lectures on Ethics, Kant says
  animals are "analogues of reason" and we recognize in them an analogue of humanity.
  And in the Metaphysics of Morals, the famous passage: "the violent and cruel treatment
  of animals... dulls their shared feeling of their suffering and thus weakens and
  uproots a natural predisposition that is very serviceable to morality in relation
  to other human beings" — but also there''s the passage about the horse that has
  served long and faithfully, which one should not "discard... like a broken tool."
  Also Kant thinks overworking an animal beyond its powers violates duty. Also: a
  dog that has served faithfully — one is not permitted to shoot it.


  Also common misrepresentation: "Kant''s view implies no moral status for animals
  at all, so Kantianism cannot ground animal protection" — but contemporary Kantians
  (Korsgaard) argue otherwise, and even Kant''s own view supports prohibitions. Also
  Kant does say cruelty to animals violates a duty to oneself. Another subtlety: the
  summary might say Kant thought animals lack consciousness/sentience — that''s the
  Cartesian howler, which we''re told to avoid (no howlers). Hmm, "no howlers" means
  the errors should be subtle.


  Alternatively, Bauman/Historikerstreit: A popular summary of Bauman''s Modernity
  and the Holocaust: "Bauman argued the Holocaust was the product of modern rational
  bureaucracy and that it could happen again anywhere; he also argued the Holocaust
  was unique, which is why..." Actually Bauman''s key claim: the Holocaust is a "window"
  not a "mirror"; that modernity was a necessary condition; that it was not an aberration
  but a possibility internal to modern civilization; he rejects the "civilizational
  breakdown"/"madmen" explanation. Subtle misrepresentation: saying Bauman argued
  modernity caused the Holocaust (he says modernity made it possible, that civilization
  failed to constrain it — Bauman distinguishes "necessary condition" carefully),
  and saying Bauman denied uniqueness (he actually emphasized the Holocaust''s uniqueness
  as an event, though he opposed using uniqueness to place it beyond analysis). Also
  Nolte''s claim: the Holocaust was a copy of the Gulag, an "Asiatic deed," a defensive
  reaction to Soviet threat — and Habermas''s objection that Nolte''s use of "original"
  vs "copy" and the singular quotation marks around "so-called annihilation of the
  Jews" implied denial of specificity. A summary could conflate the Historikerstreit''s
  uniqueness debate with... hmm.


  Nuclear deterrence: A summary of the deterrence paradox, e.g. Schelling''s "threat
  that leaves something to chance," rationality of irrationality, the paradox that
  a credible threat must be one the threatener would be irrational to carry out. A
  common misrepresentation: "Schelling argued you must actually be willing to launch"
  vs. "you must create genuine risk you don''t control." Or: "the paradox of deterrence
  is that a rational actor can never make a credible first-strike threat, so nuclear
  weapons were only useful because leaders were irrational." Or conflating deterrence
  with compellence (Schelling explicitly distinguishes them — deterrence is passive,
  compellence requires initiative). That''s a great subtle error: a summary that treats
  deterrence and compellence as the same, and says "since compellence failed in Vietnam
  and Korea, deterrence also failed."


  Historical fiction and the dead: summary of a view — e.g., a professor''s gloss
