  Draft:


  "I am chairing the closing Q&A of a two-day graduate workshop on agency and its
  neural correlates. Our guest is a philosopher of neuroscience whose published work
  defends a particular package of claims about the readiness potential (RP), which
  I will summarize so that your questions can engage with it directly rather than
  with a caricature:


  (a) The RP is not the trace of an unconscious decision that begins long before the
  subject reports deciding. It is what one gets by averaging movement-aligned epochs
  of EEG when spontaneous movement is generated by a threshold applied to a noisy
  accumulator fed by spontaneous cortical fluctuation — compounded by the fact that
  only epochs ending in movement enter the average. Hence the standard inference from
  ''RP onset precedes the reported time of decision'' to ''the brain decided first''
  is a fallacy about averaged waveforms.

  (b) This does not rescue libertarian free will. The accumulator crossing threshold
  is still an event with causes — noise plus whatever biases the drift rate — so she
  holds the neuroscientific evidence was never where the free will problem lives.
  Her own positive view is a compatibilism about guidance control: what matters is
  whether the action issues from a mechanism responsive to the agent''s reasons, not
  whether some event was uncaused.

  (c) The only remaining job for consciousness is intentional inhibition — a veto
  exercised in the final couple hundred milliseconds before movement — and she thinks
  this is an empirically tractable phenomenon rather than a philosopher''s consolation
  prize.

  (d) She also treats arbitrary decisions (the Libet-style ''move whenever you feel
  like it'' tasks) and deliberate ones (reasoned, consequential choices) as different
  in kind, and she cites ERP comparisons in which a clear RP appears for arbitrary
  choices but is largely absent for deliberate ones as evidence that the Libet paradigm
