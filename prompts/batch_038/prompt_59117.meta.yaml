  accumulator fed by neural noise, made visible by averaging over movement-aligned
  epochs — plus a selection bias since only epochs ending in movement enter the average.
  So the standard inference from RP-precedes-W to "the brain decided first" is a fallacy
  of reading averages.

  (2) She nevertheless denies this rescues libertarian free will: the accumulator''s
  crossing is still caused (by noise and by whatever biases the drift rate), so on
  her view the neuroscientific evidence was never the interesting question; the interesting
  question is whether reasons-responsive control obtains. She''s a compatibilist of
  a "guidance control"-ish sort. (Careful: Fischer & Ravizza''s "guidance control"
  is a real term, well-known — fine to use.)

  (3) She gives the veto a central role: on her account, the only remaining work for
  consciousness is intentional inhibition in the final ~200 ms window, and she treats
  free won''t as an empirically tractable phenomenon.

  (4) She holds the arbitrary/deliberate distinction to be a difference in kind of
  mechanism, not degree: deliberate decisions show little or no RP, and so she argues
  that Libet-type paradigms are doubly irrelevant — their tasks are arbitrary, and
  the RP in those tasks isn''t a decision trace anyway.


  Interesting tension to exploit: (2) vs. (3): if everything is caused by neural events,
  the veto is also a neural event with its own precursors; then the veto window offers
  no more freedom than the initiation — she needs to say why vetoing is special. Also:
  if the RP is noise, and deliberate decisions lack an RP, then what does the absence
  of RP in deliberate decisions prove for her? It''s a prediction of the noise model
