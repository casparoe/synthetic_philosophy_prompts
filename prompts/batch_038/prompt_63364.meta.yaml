  Perspective: PhD student in philosophy of art / aesthetics (third year), British
  English, casual, a typo or two, short-ish, no citations requested.


  Content requirements for the type:

  - name the position (their own)

  - ask what would have to be true for it to be false

  - distinguish decisive from merely awkward

  - what defenders would themselves concede

  - whether it risks anything / insulated by qualifications, and whether that''s a
  problem

  - what it predicts that rivals don''t

  - willingness to conclude it''s well insulated


  Inject niche ideas: I want to add specific angles that a model can''t just regurgitate
  from a SEP entry:

  1. The sincerity criterion is an internal/private state — Tolstoy says it''s "indubitable"
  but only to those whose feeling isn''t perverted (the Daltonism/colour-blindness
  analogy). That''s a self-sealing move: anyone who disagrees is diagnosed as having
  atrophied taste. Ask whether that''s fatal unfalsifiability or whether it''s an
  acceptable "competence condition" like a native-speaker''s grammaticality judgements
  or a trained ear — i.e., is it more like a perceptual skill with a reliability story,
  or pure insulation?

  2. The theory makes empirical predictions about reception: universality — that genuine
  art should travel across cultures and classes without training. Ask: what would
  count as evidence against it? e.g., documented cases of a work that is sincerely
  made, individually felt, clearly transmitted, and yet universally fails to infect
  anyone outside a small trained circle (and where Tolstoyans wouldn''t just say "then
  it wasn''t sincere"), or cross-cultural reception data showing that "universal"
  infection tracks exposure and convention rather than content.

  3. Cases the view cannot describe: instrumental music without programme (Tolstoy''s
  own concessions — he only commends selected passages, Bach aria, Chopin nocturne),
  jokes and home decoration are in but... actually Tolstoy includes jokes. Hmm. Better:
  the view can''t handle works whose power is precisely non-emotional — conceptual
  work, or works admired for formal achievement; or artworks that transmit no determinate
  feeling yet transform readers. Ask whether there''s a category it can''t describe
  at all vs describes badly.

  4. The two-tier structure: infection = art; subject-matter judged by the religious
  perception of the age = good art. This creates an escape: any verdict can be defended
  at the second tier by appeal to a contested standard. Ask whether the second tier
  does all the work and the first is decorative.

  5. Self-exemption / the sociology objection: the theory predicts that the taste
  of the elite is a racket, which is testable-ish; but Tolstoy''s own canon (peasant
  stories, Schiller''s Robbers, Hugo, Stowe, George Eliot) looks like the taste of
  a 1890s Russian moralist — is there a way to distinguish "religious perception of
  the age" from "the theorist''s preferences"?

  6. Whether the view collapses into a rival: a communication theory of meaning /
  a pure expression theory (Collingwood) — does it collapse into expression theory
  plus moralism? Or does it collapse into a functionalist account where "art" = anything
  that communicates feeling, which would make it not a theory of art but a theory
  of communication (and thus fail to exclude — the extension problem: a rousing political
  speech, a sermon, a cradle song are art; fine, but does it fail to include anything?
  If nothing is excluded, is it a definition at all?)

  7. What it predicts that rivals don''t: the decay trajectory — that art cut off
  from the common people becomes increasingly obscure, borrowed, imitative, effectful,
  diverting (the four markers). That''s a testable historical prediction. So one could
  ask: what would count against it — e.g., periods where elite art became MORE accessible,
  or where popular art became more obscurantist/borrowed/effectful than high art (which
  arguably describes commercial pop, film franchises — "borrowing, effectfulness,
  diversion" fit blockbuster cinema perfectly). That''s a great, non-regurgitated
  angle: the four markers of counterfeit art arguably describe mass commercial culture
