  Two years on the conflict committee at my housing co-op, and last month I ended
  up on the other side of a complaint for the first time, which is a hell of a way
  to finally see the pattern from both ends.


  Instance one. A long-running dispute over the laundry room schedule. The guy who
  filed it never once said he wanted to win, he said things like "that made me feel
  dismissed" and "I don''t feel safe in that space anymore." But when we offered him
  what he''d nominally asked for — a private apology, a changed schedule, an acknowledgment
  in writing — he turned it down and escalated to the whole membership, because a
  private fix didn''t count. What settled it wasn''t repair, it was the other person
  losing standing in front of everyone. The injury language stayed identical throughout;
  the stakes moved.


  Instance two, and this is the one that stuck. A newer member got some pretty rough
  treatment from the same guy. When asked, she said clearly she wasn''t hurt, didn''t
  think anything had happened, didn''t want anything done. The committee overruled
  her: she''d been harmed whether she registered it or not, and her not registering
  it was itself a sign of how bad it was. She then got assigned a status she''d declined,
  and her declining it counted as evidence for the assignment.


