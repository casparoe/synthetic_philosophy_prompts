  For the last decade or so I''ve defended a fairly uncompromising version of disjunctivism
  about perception: when you veridically see a lemon on the table and when you undergo
  a subjectively indistinguishable hallucination of one, there is no fundamental kind
  of mental episode you have in both — the ''highest common factor'' picture is not
  just false but unmotivated, and the argument from illusion/hallucination only gets
  traction by assuming what it needs to establish. I''m drafting a chapter where the
  editor has asked, reasonably enough, for a section on what would count against my
  own view, and I''ve discovered that I can''t write it, because for everything I
  can think of I already have a story — which is itself the worrying part, I know.


  So tell me straight: where is this view actually exposed? Please skip the textbook
  argument from illusion; I know the version with the bent stick and the afterimages,
  and I know my reply that illusion cases don''t generalize to causally matched hallucinations.
  I want the harder stuff. (i) The mixed cases — someone sees a real table and hallucinates
  a lemon sitting on it, or a hallucinated colour spread over a genuinely seen shape.
  What does relationalism say here, and is the answer so strained that it counts as
  a genuine defeater? (ii) The screening-off worry: if there''s a proximal neural
  cause common to the good and bad case that fully accounts for why they''re indistinguishable,
  why isn''t that common cause doing all the phenomenological work, and is there a
  principled reason to deny it — or does ''same vehicle, different metaphysical kind''
  start to look like a get-out-of-jail card that I could deploy against any empirical
  finding, from TMS phosphenes to the visual-cortex activity in Charles Bonnet hallucinations
  to the imaging overlap between imagery and perception? (iii) How much weight is
  my view leaning on Martin''s negative epistemic account of indistinguishability
