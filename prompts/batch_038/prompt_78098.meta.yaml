  is inadmissible in this context, PP doesn''t directly apply; instead the "Old PP"
  (chance = conditional credence given only the chance hypothesis) is what Vranas
  argues for. Hall''s "New Principle": Cr(A | C(A)=x, plus total evidence) = x. This
