  "Right — I write about science and ideas for a UK broadsheet, mostly genetics and
  the philosophy-of-science-ish end of things, plus the odd longer piece for the weekend
  mag. I''ve got a big feature coming up on whether DNA is a code, and after my last
  one got properly taken apart by a philosopher of biology on Bluesky, my editor has
  made me write down what I actually believe before I file. So here''s the list. I
  want to know whether it hangs together or whether I''m fooling myself — an audit,
  not a lecture, please, I''ve read enough of the background to know the shape of
  the debate.


  1. The genetic code is a code literally, not as a figure of speech. There''s a mapping
  from codons to amino acids, there''s machinery that actually reads it, and the mapping
  is arbitrary in something like the way Morse is arbitrary — which is part of why
  I think it earns the word.

