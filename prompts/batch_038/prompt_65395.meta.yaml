  Right, so I''m a science and ideas writer — I do a lot of genetics for a UK broadsheet,
  plus the odd essay-ish thing for the weekend mag. I''ve got a big feature coming
  up on whether DNA is a code, and after a philosopher of biology absolutely took
  me apart on Bluesky over the last one, my editor''s made me write down what I actually
  think before I file. So here''s my list, and I''d like to know whether it hangs
  together or whether I''m fooling myself. No lecture on the history of the debate,
  I''ve read enough of it — just the audit.


  1. The genetic code is a code, literally, not as a figure of speech. There''s a
  mapping from codons to amino acids, there''s machinery that actually reads it, and
  the mapping is arbitrary in the way Morse is arbitrary — which is part of why I
  think it earns the word.


  2. But DNA doesn''t contain a message. There''s no sender, no receiver, nothing
  the genome is *about*, and "the book of life" is marketing copy, not a claim.


  3. I''m not interested in rescuing that "about"-ness. The people who try to naturalise
  it — cash out informational talk in terms of what selection designed a bit of the
  system to signal — seem to me to be adding machinery to save a metaphor, and I don''t
  buy it. So: no semantics anywhere in the cell, full stop.


  4. I do think DNA is causally special. Change one base and you can change one amino
  acid; there is no arrangement of temperature, nutrition or maternal provisioning
  with that kind of fine-grained, sequence-specific causal grip. I say that in the
  piece.


  5. But development is not the execution of a program, and I spend a lot of column
  inches on that. The cell does most of the work; the genome is a resource you build
  with, not a set of instructions you follow. Blueprint talk is wrong and I want to
  say so loudly.


  6. A gene, for me, is just a stretch of DNA that makes a difference to some trait
  in some context. Difference-maker, that''s all.


  7. And I write about mutations as typos constantly — misprints, slips, "the text
  should have said this", editing, proofreading. I think that''s fine and I don''t
  think I''m smuggling anything in, because everybody knows what I mean and it''s
  not a claim about meaning.


  8. I also tell readers, flatly, that there''s no such thing as a gene for anything.


  Plus one thing I use a lot: I point out that the code isn''t universal — mitochondria
  read a couple of codons differently from the nucleus — and I use that as evidence
  for the arbitrariness in (1).


