  I work on the perception stack for a head-mounted display that overlays moving graphics
  on the real world, and my team has just spent two months arguing about something
  that turned out not to be an engineering question. To keep a virtual object glued
  to a moving real one, you either extrapolate — render where it probably is now,
  and eat the error when the prediction is wrong — or you hold each frame in a buffer
  for a hundred milliseconds or so, wait until you can see where the object actually
  went, and then render the whole trajectory correctly, at the price of latency. We
  chose the buffer. Reading up on why that felt like the honest option, I ran into
  color phi: two dots flashed in different places and different colors are seen as
  one dot that moves and changes color somewhere in the middle, where the color the
  change is seen to take on is not yet available to anyone''s visual system at the
  time it is apparently seen. Dennett and Kinsbourne''s labels for the two ways out
  — Orwellian, where the experience really was of red all the way across and the record
