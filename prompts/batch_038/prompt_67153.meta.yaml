  Let me recall color phi precisely. Dennett''s color phi: a red spot is flashed at
  one location, then after a short interval (~100 ms?) a green spot is flashed a few
  degrees away. Subjects report seeing motion, and — the surprising part — they report
  seeing the color change mid-flight, i.e., the spot appears to move and change color
  somewhere in between. The problem: at the time the spot appears to change color,
  no information about the second stimulus''s color has yet arrived at the brain (the
  second flash hasn''t happened). So either the brain revises history (Orwellian:
  the experience of red motion was actually had, but memory of it is overwritten/replaced
  by the report of a mid-flight color change) or the brain delays consciousness (Stalinesque:
  the brain waits until enough information is available and then produces, retrospectively-labeled,
  the experience of a color change midway). Dennett & Kinsbourne favor the Orwellian/"multiple
  drafts" model.


  Hmm, one subtlety: Dennett & Kinsbourne describe the two options: "Orwellian" =
  the correct account is written down but then altered/falsified after the fact (memory
  tampering); "Stalinesque" = the account is doctored before it is recorded / before
  it reaches consciousness (a show trial staged in advance — the brain holds the content
  in a buffer until enough info arrives, then consciousness happens all at once with
  the doctored content). Yes.


  Also relevant: the Cartesian materialist / Cartesian theater assumption. And the
  "two experiments" distinction: is the content of consciousness fixed before or after
