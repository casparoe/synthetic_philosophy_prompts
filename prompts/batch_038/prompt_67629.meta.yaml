  Question (final exam, epistemology, 25 points):


  "State Jeffrey''s rule of probability kinematics. Explain what problem it is meant
  to solve and how it differs from ordinary Bayesian conditionalization. Is ordinary
  conditionalization a special case of the rule? Finally: does the rule leave anything
  important unsettled?"


  Student answer:


  "Bayesian conditionalization says that when you become certain of some proposition
  E, you should set your new credence in any hypothesis H equal to your old conditional
  credence P(H|E). Jeffrey''s rule drops the requirement that E become certain. Suppose
  your experience shifts your credences across a partition E1, ..., En without settling
  any of them. Then your new credence in H should be the weighted sum: P_new(H) =
  Σ_i P_old(H|E_i) · P_new(E_i). The only thing that changes is the probability of
  the partition elements; every conditional P(H|E_i) stays exactly where it was. Jeffrey
  calls this the rigidity condition, and it''s what makes the update determinate:
  once experience hands you the new probabilities for the E_i, the rule fixes the
  new credence in every other proposition.


  This is the right account of perceptual learning, because perception almost never
  produces certainty. When I look at a sock under bad light I might go from .4/.6
  to .7/.3 on its being red rather than its being green, and I certainly don''t become
  certain of any proposition about sense data. Conditionalization has nothing to say
  about that case; Jeffrey''s rule handles it directly. Conditionalization also falls
  out as a limiting case: if experience takes P(E1) to 1, the sum collapses to P_old(H|E1),
  which is exactly what conditionalization prescribes.


  The rule also underwrites the dynamic-coherence arguments. Lewis showed that an
  agent who plans not to conditionalize can be offered a package of bets that guarantees
  a loss, and the same argument goes through verbatim for Jeffrey updating: any departure
  from probability kinematics makes you Dutch-bookable, whatever the source of the
  change. So the rule isn''t a mere technical relaxation, it''s forced on you by coherence.


  Two further payoffs. First, because the rule never requires certainty at any level,
  it removes the last vestige of foundationalism from Bayesianism — the inputs are
  just more probabilities, all the way down. Second, it makes the old evidence problem
  disappear: on Glymour''s worry a theory can''t be confirmed by evidence you already
  had, since conditionalization only fires on new certainties, but probability kinematics
  lets the credences in propositions you were already sure of move again, so re-examining
  a known consequence can now raise P(H).


  The main thing left open is which partition to use, since different partitions over
  the same experience can give different numbers. Jeffrey''s answer is that you should
  use the one that experience actually imposes, and that seems right."


