  stockings gravitated to the ones at one end of the display, then insisted their
  choice had nothing to do with position." That''s accurate (I believe position effect:
  rightmost item chosen more, roughly 4:1). Good; no numbers needed.

  2. "the same story-spinning machinery you use on other people, pointed inward" —
  that''s actually a reasonable gloss of N&W / Carruthers'' interpretivist view. It''s
  the "we infer our own states the same way we infer others''" idea, which is Carruthers,
