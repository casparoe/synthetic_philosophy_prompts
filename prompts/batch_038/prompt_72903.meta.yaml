  "Introspection is broken, and the evidence has been sitting there for fifty years.
  In 1977 Nisbett and Wilson showed that when people explain their own choices they
  are mostly making it up: subjects shown four identical pairs of stockings gravitated
  toward the ones at one end of the display, then insisted, with feeling, that position
  had nothing to do with it — and not one of them admitted he was guessing. What we
  call knowing our own minds turns out to be the same story-spinning machinery we
  use to explain other people, aimed inward. A Swedish team sharpened the point with
  what they called choice blindness. Subjects are shown two faces and pick the more
  attractive one; the experimenter swaps the cards behind a clipboard and hands back
  the face the subject rejected; most subjects never notice, and many go on to explain
  at length exactly why they preferred it. Eric Schwitzgebel, the philosopher who
  has spent two decades on this problem, concludes that we have no reliable introspective
  access even to our own conscious experience — that on questions about what we are
  feeling we perform at roughly chance. Which means, for anyone who reports on the
  mind, that verbal self-report should be treated as noise: if you cannot measure
  it from the outside, in behavior or physiology or reaction times, it is not data."


