  pointed inward. A Swedish team sharpened the point with choice blindness: subjects
  pick the prettier of two faces, the experimenter swaps the cards behind their back,
  and most people not only fail to notice — they deliver an eloquent account of why
  they chose the face they actually rejected. Eric Schwitzgebel, the philosopher who
  has spent his career on this, concludes that we have no reliable introspective access
  to our own experience, and that on questions of what we''re feeling we perform at
  roughly chance. The upshot for anyone who reports on the mind: treat verbal self-report
