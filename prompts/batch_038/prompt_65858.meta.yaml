  I''m building a week of an advanced undergraduate seminar on the demandingness objection
  to consequentialism, and I want to close it by screening roughly the last twenty
  minutes of Schindler''s List — the night the factory shuts down, where Schindler,
  having just spent his entire fortune, breaks down and tallies his car and his party
  pin as additional people he might have bought, and then the color epilogue in which
  the real survivors and the actors who played them walk to his grave in Jerusalem.
  I don''t want the easy reading in which the film simply dramatizes Singer''s marginal-sacrifice
  principle and the students leave thinking the objection has been settled by tears.
  Write me a serious critical reading of these sequences in terms of the debate, and
  take the film as seriously as the philosophy.


  Some things I want the reading to handle. I''d like you to test a distinction I''m
  trying to work out for myself: between how much a principle costs an agent at a
  moment and what it leaves over once the agent has paid — call it the unexhausted
  remainder, the way a demand expands to absorb whatever you bring to it, so that
  no sacrifice ever presents itself as sufficient. Is Schindler''s collapse evidence
  for treating demandingness as a structural feature of beneficence rather than a
  threshold question about how much is too much? How does that sit against Liam Murphy''s
  compliance condition and collective principle of beneficence, which deny that a
  complier owes compensation for others'' noncompliance — is Schindler grieving precisely
  the surplus Murphy says he doesn''t owe, and if so does the film vindicate Murphy''s
  diagnosis or make Murphy look complacent? Where do Susan Wolf''s case against moral
  saints and Bernard Williams on integrity and agent-regret bite: is what Schindler
