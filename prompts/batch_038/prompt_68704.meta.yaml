  Philosophy to bring: epistocracy (Jason Brennan''s Against Democracy — hobbits,
  hooligans, Vulcans; the competence principle; restricted suffrage; epistocracy as
  "rule of the knowledgeable"), David Estlund''s "the authority of democracy" — democratic
  legitimacy requires not just truth-tracking but acceptability to all reasonable
  people (Estlund is actually a defender of "epistemic proceduralism" and he argues
  against epistocracy on the grounds that there''s no agreed-upon criterion of expertise
  — the "expert/boss problem" and the problem that any qualification test would itself
  be controversial). Estlund''s key point: epistocracy might be better but we can''t
  agree on who the knowers are without begging the question — "the expert/boss problem".
  Also "the democratic objection to epistocracy" — legitimacy requires that the ruling
  procedure be acceptable to all reasonable people, and the criterion of expertise
  is itself reasonably disputed.


  Condorcet jury theorem: if each voter is more likely than not to be right and votes
  independently, the majority is more likely right than any individual, approaching
  1 as size grows. Problems with the film: jurors are clearly NOT independent (deliberation,
  cascades), and each individual is far from competent (>0.5) — some start from prejudice.
  So CJT''s assumptions fail; and yet the group converges on (probably) the truth.
  This is the interesting tension: the film shows that deliberation can FIX the incompetence
  and independence problems at once... or destroy independence. Landemore''s argument:
  cognitive diversity (Hong-Page) trumps average ability — but the film''s mechanism
  is not diversity-trumps-ability, it''s one guy''s dissent plus pooling of local
  knowledge (Juror 5''s slum knowledge about knife use, Juror 9''s insight about old
  men wanting to feel important, Juror 4''s... no). Actually the film is a great case
  for the "knowledge problem"/epistemic division of labor: each juror contributes
  a piece of local knowledge no one else had. That''s Hayekian! And a rationalist
  reader would appreciate that framing.


  Also relevant: the standard of proof "reasonable doubt" — the film is arguably not
  about truth-tracking at all but about a procedural standard that deliberately trades
  off error rates; the instruction tells them that they don''t have to be right, just
  not be confident. This is a big deal for epistocracy: the system''s aim isn''t maximizing
  true verdicts, it''s asymmetric error cost management (Blackstone''s ratio — better
  ten guilty escape than one innocent suffer). An epistocracy optimizes for accuracy;
  the jury optimizes for a bias in favor of the defendant. So the film''s ending —
  Juror 3 capitulating not from evidence but from grief — raises whether the verdict
  is truth-conducive at all. And there''s an "uncomfortable epistemic point": we never
  learn whether the boy did it. The film deliberately never resolves it. So it''s
  not a film about reaching the truth; it''s a film about whether you can be sure.
  That maps onto the domain question: does democracy''s epistemic defense even apply
  to a system that explicitly disclaims knowledge?


  Another angle: the minority-of-one dissent. Epistocracy says weight votes by competence;
  the film gives Juror 8 exactly one vote and he wins anyway — showing that the "hooligan
  vs Vulcan" distribution doesn''t map onto formal voting weight, and that a single
  competent dissenter can, given time and a room, convert everyone. That''s a point
  against epistocracy''s premise that the ignorant masses systematically swamp the
  competent — because the actual mechanism of collective judgment includes persuasion,
  not just aggregation. Brennan might respond: it took 96 minutes and a locked room;
  in a mass electorate there''s no deliberation, just aggregation of hooligan preferences.
  Good — I can set up that exchange as a thing to adjudicate.


