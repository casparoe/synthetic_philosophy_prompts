  Now write the prompt. Voice: longtime rationalist blog/forum reader, casual, American
  English, a typo or two. Type: read a film through a philosophical lens (epistocracy
  vs democracy). Should ask for criticism, faithful in both directions, no verbatim
  quotes requested, no bibliography. Should inject a niche/own idea. Should ask where
  the reading breaks down and where the film resists it. Should ask what the film
  adds to the debate that argument alone doesn''t.


  Length: substantial but not bloated. Include:

  - Setup: I''ve watched 12 Angry Men with my kid / teaching / running a reading group?
  The type says the asker may be writing an essay, teaching, book club, or puzzled
  by a scene. Rationalist flavor: "I''m running a screening-and-argue night for my
  local LW meetup" — good.

  - The philosophical lens: epistocracy vs democracy — Brennan''s competence principle,
  hobbits/hooligans/Vulcans, Estlund''s point that knowing-better doesn''t get you
  the right to rule and that any expertise test is itself reasonably disputed, Condorcet
  jury theorem, the diversity-trumps-ability result and the usual critique that it
  assumes shared objective function, Landemore.

  - Specific asks: which of the 12 would be disenfranchised under a competence test,
  and what does the film''s own distribution of who-contributes-what say about that?
  The point that the two jurors who do the most epistemic work have no credentials
  (Juror 8 an architect, Juror 9 an old man; Juror 5''s slum knowledge; Juror 11 the
  immigrant). And Juror 4, the cool reasoner who looks like Brennan''s Vulcan, is
  the last holdout besides Juror 3 and is defeated not by better reasoning but by
  an observation about eyeglass marks — which is a "local knowledge" contribution
  from Juror 9, who''s supposed to be the feeble old man.

  - The independence problem for CJT: deliberation destroys the independence assumption,
  and yet the film treats deliberation as the saving grace. Ask the model to be honest
  about which horn to take.

  - Injected niche idea / my own take to attack: (a) "competence lottery" framing
  — the system''s real structure is that verdicts have huge variance and there''s
  no system-level error correction, so the film is Brennan''s argument, not democracy''s,
  if you zoom out from the room to the population of jury rooms; (b) the observation
  that the film never tells us whether the kid did it — so it can''t be a film about
  truth-tracking, only about the reasonable-doubt standard, which is an asymmetric
  error-cost rule, not an accuracy rule. If the aim isn''t accuracy then the whole
  epistemic defense of democracy (and the whole epistemic critique) may be aimed at
  the wrong target. Ask whether I''m overreading.

  - Also: Juror 3''s capitulation at the end — he''s not converted by evidence, he''s
  broken by grief. And Juror 7 flips to go to the ballgame. So the vote counts that
  the procedure tallies include votes from capitulation, fatigue, and indifference,
  all of which look identical on the ballot. Ask what an epistocrat says about a procedure
  that is indifferent to why the votes came in, and whether the film knows this is
  a bug or a feature. That''s a nice, meaty, "in the weeds" point.

  - Ask for: where the film resists the epistocracy-vs-democracy frame entirely and
  the honest critic has to say so; and what the film adds that argument alone doesn''t
  (the phenomenology of being the dissenting one, the cost of holding out, the fact
  that Juror 8''s first arguments fail and he has to buy time with a secret ballot).

  - Deliverable specifics: a reading I can use at the meetup, no need for citations/reading
  list, don''t summarize the plot back at me except where a specific scene matters,
  no verbatim quotes (I don''t have the script).


