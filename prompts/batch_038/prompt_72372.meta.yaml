  Domain: Von Neumann''s views on the brain.

  Type: Restate in another framework''s vocabulary + residue report.

  Persona: science-and-ideas journalist, formerly a distributed-systems / fault-tolerant
  infrastructure engineer.

  Target vocabulary: reliability engineering of large-scale distributed systems —
  replication, quorums, consensus, failure domains, error budgets, SLOs, graceful
  degradation, Byzantine vs crash faults, erasure coding, load balancing, tail latency,
  capacity planning, control plane vs data plane, idempotency, retries, redundancy,
  MTBF.

  Format: named sections with rough lengths.


  Content of claims (my own words, confident):

  1. The nervous system is a computing machine, but a mixed one: the neuron''s output
  is all-or-none (a digital, two-valued event), while much else in the system — graded
  intensities of stimulation, continuous muscular control — behaves analogically.

  2. Individual neural components are far less precise and far slower than the components
  of a machine, yet the whole is dependable; he accounts for this by depth of redundancy
  and by coding tricks rather than by component accuracy.

  3. The architecture trades serial depth for parallel width: many slow units working
  at once rather than a few fast ones in sequence, with consequences for how much
  arithmetic the system does.

  4. Memory doesn''t appear to sit in a dedicated organ; recall looks statistical
  and reconstructive rather than exact retrieval by address.

  5. The system''s "language" — the code in which it represents things — is not mathematics
  and may be of a wholly different character: more combinatorial and statistical,
  less numerical, with different notions of precision and depth. He also warned that
  the brain/computer comparison is an analogy and that the analogy''s limits matter.


  Also I can note his reliability-theory work (synthesis of reliable organisms from
  unreliable components) as the bridge — but careful: the asker shouldn''t necessarily
  know it; better to have the asker mention it as a suspicion: "I suspect this is
  the same machinery as his reliability work, and I want to know whether that''s right
  or whether I''m projecting." That''s a nice touch — it forces the answerer to check
  whether the translation is honest or an imposition.


  Residue demand: for each claim, mark clean translation / distorted / inexpressible;
  and answer whether the residue is a limitation of reliability vocabulary (which
  has no way to talk about a system whose parameters are set by experience rather
  than deployed, no notion of a representational code) or a sign that von Neumann''s
  claims were doing less work than they look.


