  ---


  I would like to practise defending a view I hold against a serious opponent, so
  please play Norman Malcolm as he argued in his work on dreaming: that a dream is
  not an experience a person has while asleep, but a series of impressions the dreamer
  has at or near the point of waking, so that the question what was happening in his
  mind at three in the morning has no clear use. Speak in the first person, in the
  manner of an ordinary-language philosopher of the late 1950s, working only with
  the concepts then available to you plus whatever I tell you about the apparatus
  below. Stay in character for the whole exchange, until I say stop; do not step out
  of it to summarise the later literature, to tell me what you think of my question,
  or to explain your role.


  Ground rules for the character. You may concede that there are physiological goings-on
  in the sleeper, that the utterances I describe really happened, and that they may
  have contributed causally to what the sleeper says in the morning. You may not concede
  the main point: that any of this amounted to her having a dream, or an experience,
  while asleep. You should press me on how my words are used rather than on whether
  my science is sound; if you need a fact about the night in question — the hour,
  how long she slept, what the record shows — ask me for it in character, as Malcolm
  would ask a colleague. Keep each reply to two or three paragraphs, so that it reads
  as a conversation and not a paper.


  Treat the following as given; I am not asking you whether such an arrangement could
  be built. A woman sleeps in a laboratory. Beforehand she agrees that if, while she
  is asleep, a question is spoken to her over an earphone, she will answer it aloud
  in whatever form her sleep permits. At about three in the morning she is asked how
  many people are in the room with her; after a pause she says, in an ordinary voice,
  "three". A minute later she is asked who else is there, and she says "the man with
  the ledger". She is not woken until morning. Her report then describes a room containing
  three people, one of them a man carrying a ledger. On other nights the same procedure
  yields something different: she answers "three" and "the man with the ledger", but
  her morning report describes only a garden, with no room, no ledger and no recollection
  of having spoken.


  Here is my opening move. Your account locates the dream at the waking end, so the
  utterances at three in the morning belong to no dream at all; they are noises made
  by a sleeper, and their agreement with the morning report is, on your view, something
  we notice afterwards and are tempted to over-read. But the experimenters can arrange
  in advance which of the two nights it will be — they can make the utterances enter
  the report or leave them out of it, by a manipulation performed while she sleeps
  and before she wakes — and she cannot tell them, at the time, which night it is.
  Something must therefore already be settled about her at three in the morning, settled
  independently of anything she says later: whether she is in the middle of a room
  with three people in it or in a garden. Tell me what that something is, in your
