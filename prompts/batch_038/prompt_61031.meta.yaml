  Now inject a novel element so models can''t regurgitate: design the question around
  a constructed case that pits specific theoretical resources against each other.
  Ideas:


  1. The "gemma" idea: Hofstadter''s claim that copies of a person''s pattern live
  on in other brains. The crux for students: what metaphysical work does the gemma
  do? Is the surviving pattern a numerically identical part of the person (mereological
  view: persons have parts that can be spatially scattered), a qualitative copy (a
  resemblance claim masquerading as identity), or a dispositional/causal claim about
  the survivor''s cognitive system? And does it require the right kind of causal history?
  Parfit''s reductionism would say identity isn''t what matters, and here the psychological
  continuity is (a) partial, (b) in a different person''s total psychology, and (c)
  not the kind of relation that supports one-one identity. So the view must either
  give up numerical identity (and it''s then unclear what "persistence" means) or
  accept multiple occupancy / scattered persons.


  2. The injected novel element: a stipulated "gemma transfer" thought experiment
  designed by me (the asker). E.g.: Suppose a person P''s pattern is deeply installed
  in two others, A and B, who never meet. Ask students: under Hofstadter''s view,
  is there one scattered person or two? And what happens when A and B''s own gemmae
  of P diverge (A remembers P fondly, B resents P)? Divergence problem: a scattered
  entity must have a single state; but the gemmae in different brains can be revised
  independently by their hosts, so the "distributed P" can change its mind without
  any communication — an instance of the problem of the unity/scattered objects (Gilmore''s
  "spanners"/scattered objects, or Merricks on scattered persons?). Nice: the objection
  from scattered objects requires that scattered entities are impossible or at least
  that identity across scattered instances requires more than qualitative similarity
  — it requires a relation of co-personhood that is normally secured by causal continuity
  within one body/brain.


  3. Another angle: the "double-counting" / sorites problem for degrees of personhood:
  Hofstadter says souls have sizes; then the funeral claim implies that a person''s
  total "amount" can exceed 1 and be spread; does the surviving corona constitute
  survival of the person or merely survival of a representation of the person? Key
  crux: the distinction between being the person and being a representation of the
  person. Hofstadter''s own framework says the ''I'' is itself a representation (a
  symbol) in the brain — the self-symbol in P''s own brain is just as much a representation
  as the gemma in A''s brain. So if selfhood consists in being represented in the
  right way, then the difference between the "primary brain" and the "secondary gemma"
  is one of degree of richness/authority, not kind — which is a genuinely radical
  claim that dissolves the objection, or alternatively collapses into saying that
  P''s own self-symbol was never P either (the "no self was ever there" reply — the
  view proves too much and undercuts the consolation it aims at).


  That''s the real crux I like: Hofstadter''s view is only defensible if the self
  is a pattern whose instantiation conditions don''t privilege one substrate; but
  then the view no longer delivers "P survives" in the sense that matters for grief
  — or it does, but only by making the survival relation symmetric and promiscuous
  (biographers, actors playing P, well-written fiction about P would all instantiate
  gemmae). The "authority/fidelity" gradient question: what stops a novel about P
  from extending P? Answer must invoke something like causal-informational lineage
  plus richness, but then the view is a graded resemblance claim, not identity.


  So the exam question can be: given the passage plus a stipulated case, ask students
  to explain what would have to be true for the gemmae to constitute the person rather
  than merely represent her, and to evaluate a specific objection (the "promiscuity"/fidelity
  objection) and a specific reply (the "no privilege for the primary brain" reply).
  Plus require them to say what the view implies about a case with an invented twist
  — e.g., a case where the richest gemma of P is in someone P never met (a devoted
  reader of P''s letters) versus the impoverished gemma in P''s estranged child. Does
  the reader host more of P than the child? This forces students to notice that the
  view decouples survival from intimacy, which is at odds with the passage''s claim
  that "this is what human love means."


  That''s a strong, non-regurgitable question: it hinges on a tension internal to
