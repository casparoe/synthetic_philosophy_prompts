  one thousand words and be worth twenty-five marks. It should be unanswerable by
  reciting that, for Hofstadter, the self is a pattern or a strange loop, or by narrating
  his account of Carol''s death. To that end, the question should present students
  with two stipulated cases and ask them to adjudicate between them, and then to say
  what general relation would have to hold...


  Case A — the Archivist ... Case B — the Estranged Daughter ...


