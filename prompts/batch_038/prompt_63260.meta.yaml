  message. This is about nested frames, "outer message" and "inner message," where
  the frame determines meaning. That could make a great classroom activity.

  - Deflationary theories of truth — could make a game about the disquotation schema,
  or about whether "true" adds anything (e.g., a game where you have to convey information
  using only "true"/"false" attributions vs. direct assertion, generalizations over
  infinitely many sentences, blind endorsement). Actually a nice activity: students
  must pass on information using only truth-predicates — showing the expressive utility
  of "true" (endorsement, generalization, anaphora on content). Also the Liar paradox
  appears. A game where "true" is needed for infinite generalizations ("Everything
  Gödel proved is true") — deflationism''s key claim: truth exists only as a logical
  device for generalization and disquotation. That''s a strong activity design.

  - Cicero''s views on old age (Cato Maior de Senectute) — four charges against old
  age and Cato''s rebuttals; also the "harvest of a well-spent life," the analogy
  of the actor in a play (you need not play the whole play, only to the end), the
  tree-planting argument (the old farmer plants trees that will benefit another generation).
  A staged deliberation / role-play could work: e.g., a debate format where students
  defend each of the four charges and Cato''s responses. Hmm, but the "idea should
  show up in what happens."

  - Memes and the Darwinian theory of culture — great for a game! A cultural transmission
  game: students copy variants of a story/drawing through chains, with variation,
  selection, retention. Or a game that makes them feel that memetic selection doesn''t
  track truth or benefit to the host — i.e., ideas spread because of their own replicative
  properties, which can be at odds with the interests of the host (like the "celibacy
  meme" objection, or the idea that memes can be parasitic). A strong activity: students
