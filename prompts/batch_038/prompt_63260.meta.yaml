  Let me think about memes more. Domain: "Memes and the Darwinian theory of culture."
  An activity: 30 students, 75 minutes. Each student is a "host" who holds a limited
  number of "slots" (memory) — say 3 slots. There''s a pool of candidate ideas (each
  written on a card with content, e.g., a claim, a ritual, a tune, a rule). In each
  round, students "transmit" by showing one card to a neighbor, who decides whether
  to adopt it (dropping one of their current cards). There''s also a mutation step:
  when copying, you may alter the card slightly (rewrite one word). After several
  generations, the distribution of cards reveals which memes won — and crucially,
  the winning memes are those with high transmission properties (catchy, short, self-referential,
  threatening to non-adopters, promising benefits), not those that are true or beneficial.
  The facilitator has pre-seeded a set with: one true-but-complex claim, one false-but-catchy
  claim, one claim that instructs the host to spread it ("tell two people"), one claim
  that''s costly to the host but self-propagating (e.g., "don''t eat; fast for the
  idea"), and one that''s beneficial but not self-referential. Then in the debrief
  you discuss: does memetic selection track host fitness? The "celibacy" objection
  (a meme can cause its host not to reproduce — so cultural evolution isn''t about
  genetic fitness), and the "no replicator" objection (memes blend; there''s no discrete
  unit of copying — which students will feel when their mutation step makes every
  copy unique, so what exactly is being selected?).


