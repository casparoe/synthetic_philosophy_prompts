  ---

  Question (from a second-year metaphysics problem set, 500 words): "Explain how Black''s
  two-spheres case is meant to refute the Identity of Indiscernibles. Assess the two
  most promising replies available to a defender of the principle."


  Student answer:


  "Black asks us to imagine a universe containing nothing but two exactly similar
  iron spheres, the same diameter, colour and temperature, standing at a fixed distance
  from one another in an otherwise empty space. Everything true of one is true of
  the other. The Identity of Indiscernibles (PII) says that if two things share all
  their properties, they are identical; the converse, the indiscernibility of identicals,
  is uncontroversial. Black''s universe is meant to be a case of two numerically distinct
  things which are nonetheless perfectly indiscernible, and hence a counterexample
  to PII.


  The first reply is that the spheres are not in fact indiscernible, because each
  bears relations the other does not: the one is to the left of the other, and each
  is at a different point of space. Black''s answer is that in a perfectly symmetrical
  universe there is no left and no right, so no such description picks out one sphere
  rather than the other; and the Leibnizian will add that absolute space is precisely
  what PII is supposed to rule out. This seems right: if points of space were themselves
  individuals, PII would be true but only because space had done the individuating.


  A more recent reply appeals to weak discernibility. The spheres stand in an irreflexive
  and symmetric relation — being at a fixed distance from — which neither bears to
  itself. Since they are weakly discernible, the defender of PII can say that numerical
  diversity is after all grounded in something other than bare numerical difference,
  and PII is preserved: the spheres do turn out to differ in a property, namely standing
  in that relation to something.


  The second reply is Adams''s. Adams suggests we stipulate that one sphere is Al
  and the other Bob, and holds that each has a primitive thisness, the property of
  being identical with that very thing, which the other lacks. This saves PII, but
  at the cost of admitting non-qualitative properties, which is arguably to give up
  the motivation for PII in the first place. Hacking, differently, objects that Black''s
  description is not a genuine description of a possible universe at all, since nothing
  in our language game of describing physical situations licenses it.


  My conclusion: every attempt to discern the spheres fails, so PII is false in a
  universe like Black''s. Since PII is false, a bundle theory of substance — on which
  an object is nothing but a bundle of its properties — cannot account for there being
  two spheres rather than one, and so bundle theories of substance must be rejected
  along with it."


