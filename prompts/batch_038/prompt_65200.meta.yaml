  Attempt at the argument:


  Setup: the student says: I built this for a metaethics seminar; the conclusion is
  that expressivism is false, but my professor hinted it proves too much, and I can''t
  see where.


  (1) Expressivism holds that the meaning of "Lying is wrong" is (or is given by)
  the non-cognitive attitude — disapproval — that asserting it expresses.

  (2) An attitude is expressed only by an utterance in which the speaker actually
  holds/manifests it; that is, only by assertoric use.

  (3) In the antecedent of a conditional, e.g. "If lying is wrong, then getting your
  little brother to lie is wrong," nobody asserts the antecedent and nobody disapproves
  of lying in virtue of uttering the whole conditional.

  (4) So by (1)–(3), the embedded occurrence of "lying is wrong" has no meaning, or
  at any rate not the meaning it has unembedded.

  (5) If the embedded occurrence lacked the unembedded meaning, then in the moral
  modus ponens above the term "wrong" would shift meaning between premises and conclusion
  — a fallacy of four terms — and the argument would be invalid.

  (6) But the moral modus ponens is valid; that''s the datum the Frege–Geach problem
  starts from.

  (7) Therefore expressivism is false: it cannot accommodate a basic fact about moral
  reasoning.


  Then the "proves too much" part: the student adds steps to generalize:


  (8) Nothing in (1)–(7) is special to moral sentences or to non-cognitive attitudes:
  any account on which meaning is fixed by what a sentence is used to do (rather than
  by its truth conditions) is subject to the same argument.

  (9) Many respectable discourses have such an account — e.g., probabilistic claims
  on a subjective/expressivist-ish reading ("There''s a 30% chance of rain" expressing
  partial belief), epistemic modals, "Ouch!", evaluative adjectives like "tasty" ("Licorice
  is tasty" expressing a liking), maybe even conditionals themselves on a non-truth-functional
  reading (e.g., Adams''s thesis / the Ramsey test view of "if", where the meaning
  of "If A, B" is given by a conditional credence, not truth conditions).

  (10) So by the same reasoning, none of these discourses can support valid inference
  in unasserted contexts — e.g., "If there''s a 30% chance of rain, you should take
  an umbrella; there''s a 30% chance of rain; so you should take an umbrella" would
  be a four-term fallacy, and Adams''s thesis about "if" would make all conditional
  reasoning invalid.

  (11) But those discourses plainly do support valid inference, and nobody thinks
  Adams''s thesis destroys conditionals.

  (12) So the argument proves too much, and hence something in (1)–(7) is wrong even
  for the moral case.


  Where does it go wrong? The flaw: (2)/(3) — the inference from "expressivism says
  meaning is given by the attitude expressed in assertion" to "embedded occurrences
  have no meaning." That''s a straw man: expressivists (Blackburn''s quasi-realism
  with a logic of attitudes, Gibbard''s plan-laden norm-expressivism) distinguish
  between the meaning of a sentence (given by a compositional assignment of attitude-contents,
  e.g., Blackburn''s "being-for" or Gibbard''s plan-types) and what the speaker does
  with it. The compositional machinery assigns to each sentence a content that can
  be embedded; assertion is expressing that content, but the content itself is defined
  compositionally, not by the act of assertion. So (2) equivocates between "meaning
  = what is expressed by asserting" and "meaning = only available in assertion". Also
  (5) equivocates on "meaning shift": the four-terms worry requires that the *content*
  assigned differ, not that the *force* differ.


  And the resolution in the general case: Adams/Ramsey-style accounts of conditionals
  indeed reject truth-conditional validity but replace it with a probabilistic notion
  of validity (preservation of probability / uncertainty) — showing that giving up
  truth-conditional validity isn''t a collapse into four-term fallacies; it''s a change
  in the account of validity. Similarly, the expressivist can offer a non-truth-conditional
  account of validity (attitudinal consistency: an argument is valid if accepting
  the premises and denying the conclusion involves inconsistent attitudes — Blackburn''s
  B-logic). So the argument''s real target — that any non-truth-conditional semantics
  must fail at embedding — is false, as the probabilistic case demonstrates. But there''s
  a cost: accepting that route means accepting that "valid" in moral logic isn''t
  the same relation as "valid" in the logic of factual claims, raising the worry about
  whether the expressivist has vindicated the *same* data, i.e., whether moral modus
  ponens really comes out valid in the sense the realist meant. That''s the price.
  Also, a hybrid: the argument does show something real — that expressivism owes a
  compositional semantics, not merely a story about assertion — and the Blackburn/Gibbard
  programs are precisely attempts to pay that debt, which some critics (e.g., the
  worry that the expressivist logic is ad hoc, the "wishful thinking"/Frege-Geach
  for higher-order attitudes) say is a cost.


