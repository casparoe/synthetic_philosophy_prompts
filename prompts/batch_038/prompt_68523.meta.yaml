  Now, the theoretical pressure points for Arendt:

  1. Arendt''s "Lying in Politics" distinguishes traditional secrecy/deception (which
  she thinks is a legitimate, longstanding tool of statecraft, aimed at the enemy,
  about intentions and future plans) from modern "defactualisation" and image-making
  (aimed at one''s own public, involving the destruction of the factual record, and
  often producing self-deception rather than belief). Sèvres looks like old-fashioned,
  competent secrecy about intentions — precisely the category Arendt says can legitimately
  succeed — yet it failed catastrophically, and its failure had nothing to do with
  the internal dynamics she describes (self-deception, image-making). Instead, it
  failed because a third party with independent information and financial leverage
  (the United States) refused the cover story. Does her account have room for that?
  Her Pentagon Papers analysis says the deceptions failed because they were self-defeating
  and because reality reasserted itself; but here the failure came from outside the
  epistemic system.

  2. The manufactured pretext: the lie required making the world conform to the story
  — Israel actually had to invade, so that the "fact" reported to the UN was a genuine
  observable fact whose meaning was falsified. That''s neither a lie about a past
  fact (which Arendt says is fragile and hard to sustain) nor a lie about future intentions.
  It''s a true statement used to convey a falsehood — the ultimatum''s factual content
  was accurate. Arendt''s factual-truth/rational-truth dichotomy doesn''t obviously
  have a slot for "truthful reporting of manufactured facts". This is a nice, in-the-weeds
  pressure point that also connects to a rationalist''s interest (e.g., the difference
  between lying and misleading, Frankfurt on bullshit? no — better: the epistemology
  of "true but misleading" statements, and the general point that a lie''s success
  depends on the audience''s inability to generate the relevant counterfactual).

  3. Arendt''s claim that consistent lying destroys not belief but the orientation
  of the sense of reality: does that fit? What got destroyed in Britain in 1956 wasn''t
  a sense of reality so much as a shared assumption about the country''s standing
