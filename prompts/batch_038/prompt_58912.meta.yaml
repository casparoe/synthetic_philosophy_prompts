  I think a nice combination: "Predict a verdict on a new case" using David Lewis''s
  views on penal substitution. Lewis wrote "Do We Believe in Penal Substitution?"
  (1997, Philosophical Papers vol. 2). In that paper, Lewis argues penal substitution
  as commonly understood is incoherent, but he offers a "punishment by proxy" / vicarious
  punishment analysis: he proposes that the punishment need not be deserved by the
  substitute; he suggests something like a "participation" model where the community
  is punished through Christ — the idea that punishment can be borne by someone who
  is connected to the offender (like a friend paying a parking fine, or the community
  being punished through its representative). Lewis discusses examples: someone paying
  your parking fine (not punishment properly), and the case of the schoolmaster punishing
  the whole class for one boy''s offense — "the punishment of the class" is genuinely
  a punishment of the offender since he is part of the class. That''s Lewis''s key
  move: penal substitution works only where the substitute is somehow identified with
  the offender, e.g., the class punished for one boy''s misdeed, or a friend who pays
  your debt — Lewis argues that in the case of the class, the punishment of the whole
  class does count as punishment of the guilty boy because he''s part of the whole;
  but he notes this is unsatisfying since the boy''s punishment is diluted.


