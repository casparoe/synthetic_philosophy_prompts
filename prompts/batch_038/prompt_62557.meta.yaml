  proves the existence of an uncountable set. Nothing else is assumed as given.

  - Each internal node must be a single question the reader can answer from a concrete
  scenario or a methodological preference, without knowing which leaf the answer leads
  to. Please avoid asking directly whether cardinality is relative, whether sets are
  what the quantifiers range over, or any other question that is just the thesis of
  a leaf in interrogative form.

  - At least four of the nodes must probe things that I suspect are the real fault
  lines, and that I want stated as choices rather than as background: whether the
  countability of a model is a fact about the model or about the vantage point of
  whoever is counting; whether a bijection that exists outside the model but not inside
  it is a bijection; whether one is entitled to restrict attention to well-founded
  or transitive models, and what extra set-theoretic commitments that restriction
  costs; whether the metatheory in which the counting is done enjoys any greater security
  than the theory being modelled; and whether a systematic mismatch between what an
  axiomatization says and what is so is a defect of the axiomatization or a discovery
  about its subject matter.

  - The leaves must include, at minimum: the view that there is no paradox and nothing
  to revise, since the model''s own word for uncountable is doing work the metatheory''s
  word is not; the view that the phenomenon is a reductio of using first-order logic
  as the framework for set theory, and that the fix is a richer logic; the view that
  the phenomenon is instead a reductio of the metaphysical picture of a determinate
