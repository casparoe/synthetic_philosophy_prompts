  Role: Commissioning editor at a serious narrative nonfiction history imprint (or
  "acquiring editor at a university-adjacent trade press"). Frequency: 8–15 proposals
  a month where the argument''s engine is a counterfactual. Stakes: advances $15k–$75k;
  reviews will punish unfalsifiable speculation; the press has a reputation for rigorous
  history. Constraints: no graduate training in philosophy of history; must run the
  screen in about 90 minutes per proposal; output must be a one-page memo to a weekly
  acquisitions meeting that includes two non-specialists; the specialist reader''s
  report may be commissioned but costs £/$ and takes three weeks, so the screen must
  decide when to spend that money. Also: some of the best authors in the list write
  counterfactual-inflected history and the editor cannot simply reject the genre.


  What the procedure must do:

  - Turn the methodological literature on counterfactual history into an ordered screening
  procedure: questions to ask in order, what counts as a passing answer at each step,
  where the procedure terminates in "reject/don''t acquire," where it terminates in
  "acquire with conditions," and where it hands off to a specialist or to the editor''s
  own judgment about the book''s aims (because that''s a values/taste question, not
  a fact question).

  - It must handle: antecedent availability (how far back you have to rewrite to get
  the antecedent; whether the negated event was genuinely open at the time, given
  what contemporaries knew — the hindsight problem); the "minimal rewrite" discipline
  (change as little as possible, and be explicit about what else you''re holding fixed);
  the demand that each inferential step rest on a generalization that would hold in
  the actual world too, not just on narrative momentum; the convergence objection
  (other forces push the outcome back to roughly where it went, e.g., Fogel''s finding
  that the economy without railroads would have caught up within months) versus the
  divergence/butterfly objection (any change cascades so far that no answer is better
  than any other) — the procedure must say how to handle both, since they pull in
  opposite directions and a book can be killed by either; the "who was actually in
  a position to do otherwise" test (agency and structural constraint); whether the
  counterfactual is doing explanatory work — i.e., whether it identifies which actual
  conditions mattered and by how much — or is merely decorative (a thought experiment
  the author doesn''t need); the risk that the counterfactual is chosen because the
  answer flatters the author''s politics (wishful thinking, per the critics); and
  the "unmaking history"/forecast discipline — whether the same author would have
  predicted this ex ante, and whether the counterfactual could in principle have been
  run forward as a forecast at the time.

  - Also: how to score the "closeness" of the counterfactual world in a way a non-specialist
  can apply, and how to keep the procedure from degenerating into "does this feel
  plausible."

  - Mark explicitly which steps are judgment calls dressed as procedure (e.g., deciding
  what counts as "as little rewriting as possible"; deciding whether a generalization
  is law-like enough).

  - Say what the procedure cannot do: it cannot tell you whether the book is worth
  publishing as a book (style, audience, whether the counterfactual is illuminating
  even if not decidable), and it cannot settle contested counterfactuals where specialists
  disagree — plus the deeper problem: it can''t produce truth, only discipline; a
  book can pass every screen and still be wrong.


  Worked applications: three proposals, one of which the answer is unwelcome:

  1. A manuscript arguing that without the railroads the American economy would have
  grown almost as fast — a "convergence" case where the counterfactual is disciplined
  and quantitative but where the book''s headline claim may end up being that the
  counterfactual shows the negated thing didn''t matter much, which the marketing
  department hates (unwelcome answer: the procedure says acquire but flags that the
  payoff is deflationary). Hmm — maybe better to make the unwelcome answer a rejection
  of a book by an author the press badly wants.

  2. A proposal arguing that if a single assassination had not occurred, the First
  World War would not have happened — where the antecedent is close but the causal
  chain relies on narrative momentum and the convergence objection is strong; procedure
  should terminate in "don''t acquire as pitched / reframe."

  3. A proposal by a star author the press has already paid a large advance for, or
  a proposal the editor personally loves: e.g., "if the 1917 revolution had failed,
  twentieth-century Europe..." or a book that uses a counterfactual whose antecedent
  requires rewriting decades of prior conditions (a "miracle" antecedent) — the procedure
  says reject, which the editor won''t like because the author is famous and the book
  is beautifully written.

  4. Maybe a third one where the procedure hands off: a book where the counterfactual
  is used self-consciously as a diagnostic device (Weberian: to identify which conditions
  were adequate causes) rather than as a claim about what would have happened — the
  procedure must not kill it, and must say why.


  Let me also inject a niche/novel element: the asker''s own house device. E.g., the
  press''s "two-column ledger": for each proposal, the author must state what they''d
