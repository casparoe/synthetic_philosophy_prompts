  Draft:


  I am the acquiring editor for narrative nonfiction history at a mid-sized trade
  press. Counterfactual proposals now arrive at a rate of roughly ten a month — books
  whose central claim is not what happened but what would have happened had some documented
  pivot gone otherwise. Our list''s reputation rests on the distinction between the
  disciplined kind (the econometric exercise that computes what American output in
  1890 would have been without railroads, and finds the gap small) and the decorative
  kind (a chapter of confident speculation that no evidence could ever disturb). I
  have no training in philosophy of history, my two colleagues on the acquisitions
  board have less, and I have ninety minutes per proposal before the weekly meeting.


  Write me a screening procedure I can run on any such proposal in that time and reduce
  to a one-page memo. Requirements:


  1. An ordered sequence of questions, each with a stated pass condition — what counts
  as a sufficient answer, and what a failed answer looks like in practice. Order them
  so that cheap disqualifiers come first.


  2. Gates, not scores: I want to know at which questions a failure ends the procedure
  with "do not acquire as pitched," at which a failure means "acquire only with specified
  conditions attached to the contract," and at which the question is not factual but
  one of the book''s ambitions and therefore mine to settle, not the procedure''s.


  3. The screen must handle both of the objections that can kill a counterfactual
  and pull in opposite directions: that the antecedent is not really available (getting
  to it requires rewriting so much prior history that the resulting world is not ours
  in any recognizable sense), and that the consequent is not determinable (once the
  pivot is changed, everything downstream shifts, so any answer is as good as another).
  It must also handle the third case, where the world snaps back: other forces were
  sufficient for roughly the same outcome, so the negated event mattered little. Say
  how a single procedure can apply all three without becoming an all-purpose veto,
  and what evidence distinguishes "snaps back" from "no one can say."


  4. A step that tests whether the counterfactual is doing explanatory work — picking
  out which actual conditions mattered and by how much — or is decoration the argument
  could lose without weakening. Give me a concrete test an editor without specialist
