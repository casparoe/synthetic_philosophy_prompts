  Let me draft the speaker''s thesis and argument sketch:


  Thesis: Physics hasn''t been helped by philosophy, and it doesn''t need to be. The
  reason philosophers keep losing this argument is that they keep trying to show philosophy
  *has* helped — a claim that''s hard to defend and, I''ll argue, mostly false. My
  claim instead: philosophy''s function in a science is *negative* — it''s the activity
  of identifying when a question that a field treats as settled is not answerable
  in the terms the field has set, and of forcing the field to re-specify the question.
  Call this the *re-specification* function. Then a test: a piece of philosophy has
  this function with respect to a science if, after it''s absorbed, the science changes
  *which questions it counts as well-posed*, not what it predicts.


  Argument sketch:

  1. The physicists'' complaint (Weinberg, Hawking, Feynman) is that philosophy produces
  no predictions and no experiments; true, and it''s not an objection, because re-specification
  isn''t a predictive activity.

  2. Historical exhibits: the hole argument and general covariance in GR (the field
  settled what a solution counts as, i.e., individuation of models — gauge); the measurement
  problem, where for 40 years the field''s answer was "shut up and calculate" and
  the philosophical literature (Bell, and the Everett/Bohm/GRW options) forced the
  question to be well-posed again; the fine-tuning/multiverse debate, where a probability-theoretic
  objection (inverse gambler''s fallacy) changed what counts as a legitimate argument
  for a multiverse.

  3. The prediction: the function is only visible *after* the fact, and only to outsiders.
  So the physicists'' complaint is structurally guaranteed to be true from inside
  the field — like complaining that your immune system doesn''t do your job.

  4. Corollary: philosophers should stop claiming credit for content and start claiming
  credit for question-hygiene.


