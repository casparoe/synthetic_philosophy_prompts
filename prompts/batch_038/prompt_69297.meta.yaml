  Actually, let''s think about where the literature presses:

  - Dennett & Kinsbourne (1992), "Time and the Observer: The Where and When of Consciousness
  in the Brain" (BBS). The color phi experiments are from Kolers & von Grünau (1976).

  - The distinction: Stalinesque = a "show stopper" prevents the first (wrong) content
  from ever reaching consciousness; Orwellian = the content enters consciousness and
  is then revised, with the memory of it also revised.

  - Dennett''s point: because Orwellian revision includes memory revision, there is
  no behavioral difference; so we cannot decide which is right by asking subjects;
  hence the debate over the "timing of experience" is not empirically decidable in
  the naive way; and hence the Cartesian theater model is unsupported.

  - Objections: (1) The distinction may not be behaviorally equivalent if we consider
  non-report measures (priming, saccades, physiological responses) — memory revision
  might not extend to all downstream effects, so an Orwellian account predicts residual
  traces of the first experience. This is a real objection raised in the literature:
  e.g., Grush (2005?) "Internalism Spooked: Is There a Privileged Mode?" or "Time
  and the Observer" replies; also Rey (1998)? Also the debate about "illusionism."

  - (2) The "content fixation" problem: whether the subject''s report fixes the content
  of experience; the color phi case may involve the subject being disposed to report
  motion + color change without ever having that experience.

  - (3) Alternative explanation: the "referral backwards in time" (Libet) or "temporal
  marking" hypothesis.

  - (4) Critics: the idea that the color phi illusion shows that experience is constructed
  post hoc — but there''s a challenge about the "motion aftereffect"? Hmm.

  - (5) The "phi" vs "beta" movement distinction — actually in the literature, "phi
  phenomenon" is pure motion without object identity, "beta movement" is apparent
  motion of a single object moving. Color phi is a beta-movement-like phenomenon with
  color change. A summary or interviewer might conflate them.

  - (6) The claim that Dennett concludes that consciousness is an illusion — no, he
  concludes that the "Cartesian theater" model is wrong and there''s no single moment/place
  where it all comes together; experience still exists but its temporal properties
  are not fixed in the naive way.

  - (7) Whether Orwellian revision requires a homunculus who does the revising (a
  regress worry) — the multiple drafts model''s response: no editor.

  - (8) The relation to "postdiction" literature in vision science (e.g., the flash-lag
  effect, the Froehlich effect, the "cutaneous rabbit") — these are often described
  as postdiction, which seems to favor Orwellian accounts, but an anti-Cartesian-theater
  view can treat them differently.


