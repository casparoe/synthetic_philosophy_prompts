  Also key subtlety: strict dominance must be checked against the *remaining* strategies
  of opponents after each round of deletion — and domination by a mixed strategy of
  one''s own. And: a strategy can be strictly dominated only by a mixed strategy even
  when no pure strategy dominates it (the classic example: a 3x3 game where the middle
  pure strategy is dominated by a 50-50 mix of the other two — this is the standard
  example used to show that restricting to pure-strategy dominators changes the solution).
  Also: IESDS is order-independent; iterated deletion of weakly dominated strategies
  is order-dependent, and can delete Nash equilibria. Also: IESDS preserves all Nash
  equilibria, but "preserves" doesn''t mean the surviving strategies are equilibrium
  strategies — the surviving set can be large.


