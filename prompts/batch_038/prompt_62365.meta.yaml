  The value-free side''s best arguments (so they''re not a strawman):

  - Under moral uncertainty / pluralism / value drift, a structural, value-agnostic
  penalty is a hedge: it preserves the option to decide later, which is exactly what
  you want when you don''t know what''s good. "Keep the future open" is not a full
  value theory; it''s a minimal, near-universal instrumental constraint.

  - Full value specification is unattainable; demanding it makes the problem unsolvable,
  so the question is comparative: a value-free penalty is better than nothing, and
  better than a confident wrong value function, which will be pursued to the hilt.

  - The impact penalty is corrigible/auditable: it produces explanations ("this action
  loses 12% of reachable futures in region X") that a human overseer can inspect;
  a value function hides its commitments inside weights.

