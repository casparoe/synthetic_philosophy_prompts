  The procedure needs to handle:

  - distinguishing "knowledge tests for the franchise" from "sortition panels" from
  "expert advisory/veto" from "deliberative polling"

  - the question of whether the issue is one where there''s a demonstrably better
  answer independent of people''s interests (Condorcet competence condition) vs. one
  where the "right answer" is just an aggregation of interests (where the jury theorem
  doesn''t apply)

  - the demographic objection: any filter correlated with past exclusion

  - the qualified acceptability requirement: could the losers of the decision accept
  the procedure that produced it, given they''re reasonable?

  - the burdens of judgment: informed people still disagree reasonably, so "the experts"
  won''t converge — and if they don''t converge, the test doesn''t pick out knowledge

  - independence/correlated error conditions

  - self-undermining: who writes the test, and does the test entrench the group that
  wrote it

  - reversibility/exit: can members overturn it later

  - whether it''s a one-off trial with a sunset clause

  - where the procedure stops with "no" and where it hands off to the membership/board
  because it''s a values question


