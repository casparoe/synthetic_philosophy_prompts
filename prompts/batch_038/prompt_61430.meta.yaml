  Now, another good nuance: the slogan''s "aristocracy" — Montesquieu defines aristocracy
  as when supreme power is lodged in the hands of *a part* of the people (i.e., a
  numerical/factual subset), whereas the modern use of "aristocracy" in the slogan
  (via Manin and sortition advocates) means rule by a socially distinct elite selected
  for superior qualities — the "aristoi." So there are two senses: (1) constitutional/numerical:
  a closed subset of citizens holds office; (2) evaluative: rule by the best/most
  distinguished; (3) sociological: rule by an entrenched social elite (Manin''s "elite
  of notables" or the "electoral aristocracy" — Manin argues representative government
  was designed as a form of mixed government, an "aristocracy" in the sense that rulers
  are socially distinct from the ruled, and this was deliberate, not an accident).
  These distinctions matter for what the slogan can claim.


