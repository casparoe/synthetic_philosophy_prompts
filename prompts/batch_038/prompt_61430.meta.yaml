  claim about the composition of elected bodies. Or it can be a claim about the *logic
  of authorization*: election confers a personal mandate and thereby creates a distinct
  political class with career incentives, whereas lot creates a rotating body of temporary
  officeholders. Or a *conceptual* claim about what "democracy" means (dēmokratia
  = rule by the people; if the people rule, offices must be open to any of them, which
  lot delivers and election doesn''t).


