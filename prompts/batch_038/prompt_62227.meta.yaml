  - Nyāya accepts four pramāṇas: pratyakṣa (perception), anumāna (inference), upamāna
  (comparison/analogy), śabda (testimony/word). Gautama''s Nyāya-sūtra opens with
  the list of sixteen categories (padārthas) to be known, beginning with pramāṇa and
  prameya.

  - Cārvāka/Lokāyata accept only perception (pratyakṣa). Buddhists (Dignāga, Dharmakīrti)
  accept two: perception and inference. Mīmāṃsā (Prābhākara) accept the same four
  plus arthāpatti (postulation) and anupalabdhi (non-apprehension) = six; Advaita
  Vedānta (Bhāmatī school) accepts six.

  - Gautama defines pratyakṣa as "indriyārthasannikarṣotpannaṃ jñānam avyapadeśyam
  avyabhicāri vyavasāyātmakam" — perception arising from contact of sense and object,
  non-verbalisable (avyapadeśyam), non-erroneous/non-deviating (avyabhicāri), and
  determinate (vyavasāyātmakam). This is the classic definition. I should not quote
  it from memory in the prompt — but it''s a technical definition; I could avoid quoting
  it verbatim. Rule: never quote from memory. So paraphrase.

  - Nyāya distinguishes nirvikalpaka (indeterminate, non-conceptual) and savikalpaka
  (determinate) perception — attributed to later Nyāya (Vātsyāyana''s bhāṣya discusses;
  the nirvikalpaka/savikalpaka distinction). Note the tension: the sūtra''s definition
  includes avyapadeśyam ("not nameable/not expressible in words") which some read
  as pointing to non-conceptual perception, but also vyavasāyātmakam (determinate).
  Jayanta Bhaṭṭa etc. Anyway.

  - anumāna: five-membered syllogism (pañcāvayava): pratijñā (proposition), hetu (reason),
  udāharaṇa (example), upanaya (application), nigamana (conclusion). Classic: "There
  is fire on the hill because there is smoke; wherever there is smoke there is fire,
  as in a kitchen; this hill has smoke; therefore there is fire." Contrast with Aristotle''s
  three-term syllogism. Key concept: vyāpti — invariable concomitance/pervasion between
  hetu (sādhya-dharma, the reason) and sādhya (what is to be proved). Also pakṣa (subject/locus).
  The three conditions of a valid reason (trairūpya is Buddhist; Nyāya has its own:
  pakṣadharmatā, anvayavyāpti, vyatirekavyāpti — sattā/asattā). Hetvābhāsa — fallacious
  reasons: savyabhicāra (irregular/deviating), viruddha (contradictory), satpratipakṣa
  (counterbalanced), asiddha (unestablished), bādhita (sublated/contradicted by another
  pramāṇa). Also kevalānvayin and kevalavyatirekin — kinds of vyāpti where only positive
  or only negative instances are available.

  - upamāna: knowledge of the relation between a word and its referent, gained from
  similarity to something already known — e.g., a person told "a gavaya is like a
  cow" sees a gavaya in the forest and later, on seeing a cow, knows "this is the
  animal like the gavaya". Standard example.

  - śabda: statement of a trustworthy person (āptavākya/āptopadeśa); both Vedic and
  secular (laukika) testimony count, but Nyāya is not fideist — testimony is a source
  because of the reliability of the speaker, and it is in principle checkable/defeasible;
  the Nyāya also argue for God (Īśvara) as the author of the Veda to ground its authoritativeness
  (in later Nyāya, Udayana''s Nyāyakusumāñjali). Nyāya is realist, pluralist, atomist,
  and defends an external world against Buddhist idealism (Vijñānavāda) — e.g., Vātsyāyana/Uddyotakara
  against Dignāga''s solipsism/idealism; Gaṅgeśa and the Navya-Nyāya tradition at
  Mithilā (14th c.) refining the analytic apparatus; Navya-Nyāya''s technical language
  (paryāpti, avacchedaka, etc.).

  - Nyāya''s aim is soteriological: knowledge (tattvajñāna) of the sixteen categories
  leads to release from suffering (apavarga, nihśreyasa) — the Nyāya-sūtra 1.1.2 says
  that on the destruction of false knowledge, aversion, activity, birth, and suffering,
  in that order, comes liberation. This is important: Nyāya is not "pure epistemology
  for its own sake" but epistemology in service of liberation. Though later Navya-Nyāya
  became quite technical/secular in practice.

  - A common misrepresentation: that pramāṇas are "ways of believing" / sources of
  belief like faith; that śabda means religious scripture/faith (conflating with authority-based
  faith); that upamāna is just "analogy as an argument" rather than a distinct means
