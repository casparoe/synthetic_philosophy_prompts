  Moore''s paradox: "It''s raining, but I don''t believe that it''s raining." The
  standard points:

  - The asserted content is logically consistent (can be true).

  - What''s absurd is asserting it / believing it.

  - Distinction between the paradox in the assertoric (first-person present) form
  and the belief form: "p but I don''t believe that p" — believing that is impossible/irrational
  in a distinctive way (a doxastic Moore-paradoxical belief), while the proposition
  can be true.

  - Wittgenstein''s point: the absurdity isn''t a logical contradiction, it''s about
  what''s involved in asserting/believing.

  - Variants: the "omissive" form (p & ~Bp) vs. the "commissive" form (p & B~p). Both
  are Moore-paradoxical; the commissive is arguably a contradiction in a different
  way? Actually commissive: "It''s raining but I believe it''s not raining" — also
  consistent but absurd.

  - Transparency of belief / doxastic deliberation: you can''t deliberate and conclude
  "p but I don''t believe p."

  - Also: higher-order belief assumptions. If belief is transparent, then believing
  (p & ~Bp) requires Bp, and... there are formal arguments (e.g., the "Moore-paradoxical
  belief is impossible if belief is closed under entailment and the believer knows
  their own beliefs" style arguments — the KK-like principle: B(p & ~Bp) entails Bp
  and B~Bp, and if B~Bp entails ~Bp... contradiction). Yes: assuming doxastic closure
  under conjunction elimination and the negative introspection principle (Bp → ~B~Bp,
  or its contrapositive), you get a contradiction. So the impossibility depends on
  assumptions about belief.


