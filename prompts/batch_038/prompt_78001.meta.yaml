  The false presupposition: subsidiarity is not the principle that allocates competence
  in the EU — conferral is. Subsidiarity only kicks in for shared competences *after*
  the EU has a competence, and it''s not a "lowest level that can handle them" principle
  but a comparative efficacy test. Also the reason it''s rarely enforced by the ECJ
  isn''t vagueness-as-such but that it''s a political check (the yellow card is a
  political mechanism, and the Protocol''s remedy is political). Whereas in Germany/Switzerland
  the reason the federation can''t take over schools isn''t subsidiarity at all —
  it''s the allocation of competences in the constitution (Art. 30/62 BV; Art. 70
  GG: Länder have competence except where the GG says otherwise). So the asker has
  conflated "who has the power" (competence allocation) with "should the higher level
  exercise the power it has" (subsidiarity), and they''ve compared an EU principle
  to a domestic rule that is doing different work. Also the premise "no court ever
  enforced it" is dubious — the ECJ has engaged subsidiarity, though deferentially
  (there are cases where the Court examined it; e.g., the Tobacco Advertising cases
  were about legal basis/competence, not subsidiarity — and that''s exactly the conflation!
  Germany''s challenge to the Tobacco Advertising Directive was a *competence* case
  (Art. 114/95 EC), not a subsidiarity case, and the Court annulled it on competence
  grounds. That''s a beautiful, precise instantiation of the confusion: the famous
  case where the EU lost looks like subsidiarity enforcement but is conferral.)


  Also the "lowest level that can handle them" framing: subsidiarity as commonly stated
  (Catholic social teaching: matters ought to be handled by the smallest, lowest or
  least centralized competent authority) — but Art 5(3) TEU actually says the Union
  shall act only if and insofar as the objectives of the proposed action cannot be
  sufficiently achieved by the Member States, either at central or at regional and
  local level, but can rather, by reason of the scale or effects of the proposed action,
  be better achieved at Union level. Note: "cannot be sufficiently achieved" AND "better
  achieved at Union level" — a two-limb test. And it applies only to areas which do
  not fall within its exclusive competence. And conferral (Art 5(2)) is prior.


  Also: the EU''s subsidiarity has no domestic-US analogue; the US has enumerated
  powers, the Tenth Amendment, preemption doctrine and a presumption against preemption
  — the closest functional analogues, but nothing like a subsidiarity test. And in
  the US, the anti-commandeering doctrine (New York v. US; Printz) is about structure,
  not subsidiarity.


