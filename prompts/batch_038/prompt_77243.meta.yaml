  Draft summary text:


  "The frame problem is the discovery that a machine can never know which of its beliefs
  matter. When AI pioneers tried to describe the world in logic, they found that stating
  what an action changes is easy, but stating everything it doesn''t change takes
  an axiom for every combination of action and property — an amount of work that grows
  without limit as the world gets more complicated. Dennett pressed the point home
  with a series of thought-experiment robots, each better equipped to list the non-effects
  of its actions than the last; all of them are destroyed while still reasoning. The
  lesson, which the phenomenological critics of AI had already drawn, is that relevance
  is not a relation between a belief and a fact but a global property of an entire
  belief system: to know what matters you already need to know what matters. Since
  no finite set of rules can encode that, and since the human mind evidently does
  it without rules, the frame problem shows that computational models of the mind
  are impossible in principle. That is also why the word ''frame'' matters: a frame
  is a way of carving up the world, and the problem is that any carving leaves out
  what a different framing would have shown."


  Errors/conflations embedded:

  1. "a machine can never know which of its beliefs matter" — overstates: the technical
  problem was solved (successor state axioms, fluent occlusion, predicate completion);
  the narrow problem is about compactness of axiomatization, not about knowledge of
  relevance. Conflation of narrow technical problem with wide epistemic one.

  2. "an axiom for every combination of action and property — an amount of work that
  grows without limit as the world gets more complicated" — accurate-ish but presented
  as fatal; in fact it''s MN axioms, a design burden, and the field solved it. Also
  "grows without limit" is fine as growth claim but the inference to impossibility
  is the error.

  3. "Dennett''s robots all destroyed while still reasoning" — roughly accurate as
  a description of the thought experiment, but the lesson drawn from it ("relevance
  is a global property; computational models impossible in principle") is Fodor''s
  stronger claim, and even Fodor''s conclusion is contested; Dennett''s own conclusion
  was more moderate (a warning against over-confident "deep" reasoning? Actually Dennett''s
  conclusion: the frame problem is a general problem about relevance, and he says
  the philosophers are right that it''s deep, but he also says AI practitioners can
  ignore it and get on with engineering — "the frame problem... is not a problem for
  AI"?). Hmm. Careful. Dennett''s position: he sides with the idea that the frame
  problem is a deep problem about holism, but he also notes that AI can keep working
  (the "wider" problem remains). He wrote "the problem is not a problem of engineering,
  it''s a problem of epistemology" and also that the AI people are right that the
  narrow problem is technical. I should make my summary''s claim something that a
  knowledgeable model can identify as attributing Fodor''s view to Dennett — but that
  attribution nuance may be too niche/unverifiable. Better to avoid attributing specific
  conclusions to Dennett; keep the summary''s misattribution at the level of "the
  robots show relevance is global" without naming whose conclusion. Actually the popularizer
  saying "Dennett''s robots prove computational models impossible" — a careful audit
  could say: the thought experiment is designed to dramatize the wide problem, not
  to establish impossibility; the impossibility-style conclusion belongs to Fodor''s
  holism argument, and even that is contested (defenders of AI reply that engineering
  progress in narrow domains, learned representations, and the fact that the narrow
  problem was solved technically undercut the inference).

  4. "relevance is not a relation between a belief and a fact but a global property
  of an entire belief system: to know what matters you already need to know what matters"
  — this is a fair gloss of the holism worry (Fodor), though the second clause makes
  it circular by construction; the audit could note that the argument risks begging
  the question — computational solutions may not need a prior relevance oracle (learning,
  heuristics, non-monotonic defaults, attention mechanisms, model-based planning with
  learned value functions).

  5. "Since no finite set of rules can encode that, and since the human mind evidently
  does it without rules" — two leaps: (a) the premise isn''t established; (b) "does
  it without rules" is a controversial empirical claim.

  6. "computational models of the mind are impossible in principle" — overstatement
  of what the frame problem shows; conflates "we don''t know how to do X yet" with
  "X impossible in principle."

  7. The final sentence about the word "frame" — the etymological/terminological confusion:
  "frame" in the frame problem refers to what stays fixed (the frame around a picture),
  i.e., non-effects, not to a conceptual "framing" or perspective. Conflating with
  Minsky''s "frames" (knowledge-representation data structures) and with everyday
  "framing" (interpretive perspective). Good subtle error.

  8. Also: "the phenomenological critics had already drawn" this lesson — timing/attribution
  issue: Dreyfus''s critique predates but the frame problem as a named AI problem
