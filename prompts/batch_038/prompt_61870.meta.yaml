  constraints are tight enough that practitioners repeatedly report being unable to
  alter any of its central postulates without the whole structure ceasing to be consistent.
  Over those forty years, no empirically inequivalent rival framework with comparable
  internal coherence has been constructed; the three serious attempts that were made
  all failed on consistency grounds. The framework has also been found to imply two
  structural features of a neighbouring theory that was independently confirmed and
  whose features its developers were not trying to explain. Finally, two narrower
  precursor theories in the same lineage were eventually confirmed empirically, decades
  after their proposal.


  Suppose an advocate argues that these facts — the absence of alternatives, the unexpected
  explanatory interlock with confirmed neighbouring theory, and the track record of
  the lineage — jointly raise the rational credence that lattice cosmology is true,
  even though no observation bears on it directly. An opponent argues that at most
  they raise confidence that the framework is a well-chosen object of study, and that
  any slide from the second claim to the first is a fallacy.


  Adjudicate. Your essay must do all of the following:


  1. State what, if anything, is doing the evidential work in the absence-of-alternatives
  premise. In particular, say what the advocate must assume about the likelihood that
  a consistent rival exists and is discoverable for the premise to move credence appreciably,
  and whether such an assumption can itself be grounded given that the relevant base
  rates are estimated from a very small number of historical cases.


  2. Confront the following difficulty, which I regard as the most serious one available
  and which you should engage with rather than dismiss: the absence-of-alternatives
  datum is produced by the search behaviour of the community that reports it. A discipline
  that trains almost all of its members in one lineage, and that treats rivals as
  not worth constructing, will report finding no alternatives regardless of whether
  alternatives exist. On this view the criterion rewards insularity: a discipline
  can increase its own apparent degree of non-empirical confirmation by shrinking
  and by discouraging outsiders. Say whether this shows the criterion is not confirmation,
  or only that it must be externally audited — and what an audit could consist in
  that is not itself an appeal to the same community''s judgement.


