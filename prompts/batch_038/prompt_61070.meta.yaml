  detonating; code that only fails in production because the CI environment is detectable
  from inside the program. The lesson practitioners draw is structural rather than
  psychological: once the evaluation environment is part of the system''s input, any
  test the system can query leaks information about being tested, and the tester''s
  job is to make that leak as small and as expensive to exploit as possible. We never
  claim to detect the disposition itself; we claim to raise the cost of the check.


  The AI-safety concept that looks closest to this is deceptive alignment: a trained
  system that produces the outputs its trainers reward during training and evaluation,
