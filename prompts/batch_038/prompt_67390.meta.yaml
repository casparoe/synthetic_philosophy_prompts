  Let me also consider the "counterfactual history" + desiderata option. This is genuinely
  rich: what must an account of historical inevitability/contingency deliver? Requirements:

  1. It must define the modality: what does "inevitable" mean — necessary in some
  sense relative to what set of counterfactual histories? Distinguish: nomological
  necessity (given the actual past + laws), robustness (outcome occurs across a wide
  range of perturbations), convergent development (many independent paths lead to
  it), and "would have happened anyway, just later" (timing vs. occurrence).

  2. It must not make every actual event inevitable (trivialization via determinism)
  nor every event contingent (trivialization via sensitivity to initial conditions)
  — the account must locate a non-trivial middle.

  3. It must supply a similarity metric over possible histories, and it must explain
  why that metric isn''t just a restatement of the conclusion (the metric does the
  work).

  4. It must handle the level-of-description problem: inevitability is relative to
  how finely/coarsely you describe the outcome ("the industrial revolution" vs "steam
  engines in England in the 1760s"). A good account must specify whether coarser descriptions
  are more inevitable and how to compare.

  5. It must respect causal/explanatory practice: historians'' actual claims ("the
  railroads were inevitable; the timing was not") must be explicable, and the account
  must explain what an inevitability claim is doing when it''s used (it''s often used
  to argue against "great man" explanations, or to argue that a policy wouldn''t have
  mattered).

  6. It must handle the evidential problem: how could we ever have evidence for an
  inevitability claim given that we observe only one history? (n=1) — must say what
  would count as evidence (comparative cases, e.g., independent inventions; "multiples"
  in the history of science; convergent evolution as an analogy).

  7. It must not confuse predictability with inevitability (a system can be inevitable
  but unpredictable, or predictable but contingent).

  8. It must handle the asymmetry between past and future: why "inevitable" sounds
  different when applied prospectively.

  9. It must be consistent with the fact that counterfactual reasoning seems to require
  some notion of intervention, and in history we can''t intervene.

  10. It must handle agency: if an outcome was inevitable, in what sense were the
  agents'' choices causally relevant? (the "overdetermination"/"preemption" structure
  — was there a backup cause?)

  11. It must distinguish inevitability from mere high probability, and say what the
  difference between "was very likely" and "was inevitable" is supposed to be.

  12. It must be consistent with the truism that small events matter (assassinations
  triggering wars) — i.e., handle cases where the account''s own metric gives wildly
  divergent results.


  And which requirement is most exclusionary: I suspect the metric requirement (#3/#4)
  plus the non-triviality requirement (#2) do the most work: any account that makes
  determinism non-trivial must smuggle in a similarity metric, and once you have it,
  the level-of-description problem dissolves or explodes the account. Also the evidential
  requirement (#6) knocks out many.


