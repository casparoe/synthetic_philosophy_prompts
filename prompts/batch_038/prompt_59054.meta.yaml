  Here''s the practice, as I understand it for England and Wales under the Mental
  Capacity Act 2005 (ss. 24–26). Tell me if I''ve garbled it.


  1. The statute only recognises advance decisions to *refuse*. It''s built into the
  definition: an advance decision is a decision made by a capacitous adult that, if
  they later lack capacity, a specified treatment is not to be carried out or continued.
  There''s no corresponding instrument for asking for treatment in advance, and no
  clinician I''ve met treats an advance document as a way to demand a particular drug
  or procedure.


  2. A capacitous person can withdraw or change it at any time, orally, no paperwork
  needed.


  3. It''s invalid if they''ve later done anything ''clearly inconsistent'' with it
  remaining their fixed decision.


  4. It doesn''t apply if there are reasonable grounds for believing that circumstances
  now exist which they didn''t anticipate and which ''would have affected his decision
  had he anticipated them''.


  5. Refusals of life-sustaining treatment need extra formality: writing, signature,
  witness, plus an express statement that it stands even if life is at risk. Non-life-sustaining
  refusals need none of that — a scribbled note or even a reported conversation can
  do.


  6. If it''s valid and applicable, it has effect ''as if he had made it, and had
  had capacity to make it'' at the moment the treatment is proposed. So legally it''s
  not the earlier self reaching forward; it''s the present patient deemed to be refusing
  now, competently.


  7. Meanwhile, while anyone goes to court for a declaration about whether it exists/is
  valid/applies, life-sustaining treatment can be given anyway.


  8. And on the ward, the person under a directive refusing, say, antibiotics or artificial
  nutrition still gets mouth care, pressure-area care, warmth, and analgesia. Directives
  are never read as covering that.


  The classic hard case my team keeps reaching for: an advance refusal written twenty
  years ago by someone now in advanced dementia, who by all reports is content, enjoys
  music, holds her daughter''s hand. The directive says: don''t treat the pneumonia.
  Everyone agrees she wouldn''t have written it if she''d known she''d be like this,
  and nobody thinks she''s suffering now.


  Questions:


  (a) What picture of the person does this bundle presuppose — one continuing subject
  with standing to bind its future stages, a series of selves with a contract between
  them, something else? Note (6) especially: does the ''as if now'' fiction concede
  that diachronic authority is not really what''s operating, and if so what is?


  (b) What does the refusal-only asymmetry presuppose? Is it the familiar negative/positive
  liberty distinction, a view that autonomy is a veto rather than a claim, a claim
  about who bears the burden of acting, or just a fact about clinicians'' professional
