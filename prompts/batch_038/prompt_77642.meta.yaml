  \ figures. Hmm, risk of my own errors.\n\nTime travel and the grandfather paradox:\
  \ David Lewis's \"The Paradoxes of Time Travel\" (1976) — key claims: time travel\
  \ is possible, the grandfather paradox is resolved by distinguishing \"can\" (compossibility\
