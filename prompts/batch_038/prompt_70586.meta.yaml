  "The socialist calculation debate was the argument over whether a planned economy
  could do arithmetic. In 1920 Mises pointed out that without private ownership of
  the means of production there are no market prices for capital goods, and without
  prices you cannot add up and compare the costs of different production methods,
  so a socialist economy would be flying blind. A young Polish economist, Oskar Lange,
  answered him in the 1930s: the state does not need real capital markets, because
  a central planning board can simulate them. The board announces a set of prices,
  tells every state firm to produce the output at which marginal cost equals the announced
  price and to minimize the cost of that output, and then raises the price of anything
  in shortage and lowers the price of anything in surplus, iterating until the books
  balance. That is exactly what competitive markets do, except by arithmetic rather
  than by buying and selling — and Lange thought a socialist board could do it faster
  and better, since it could internalize the externalities that markets ignore and
  choose any distribution of income it liked. Hayek conceded the logical point but
  shifted the ground: even if a board could, in principle, solve the equations, it
  could never collect the data, because the economically relevant knowledge — which
  machine is idle, whose skills fit which job, what a local shortage means this afternoon
  — is dispersed among millions of people, is often tacit, and changes faster than
  any questionnaire. Prices are not the answer to the problem; they are the answer
  sheet. The practical verdict arrived in 1989-91: the planned economies collapsed,
  and the debate closed with the Austrians right about the theory after all."


