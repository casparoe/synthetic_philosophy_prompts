  Title idea: The index problem, or why the boundary of the demos can''t be drawn
  from inside


  1. Two familiar answers. The all-affected principle says everyone whose interests
  are affected by a decision should have a say in it. The all-subjected principle
  says the relevant set is everyone subject to the coercive authority that issues
  the decision. Both are usually attacked on the same axis — too wide or too narrow...


