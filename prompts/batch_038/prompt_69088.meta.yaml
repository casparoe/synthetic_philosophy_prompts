  is about the argument place. Call it the index problem: both principles pick out
  the demos by reference to a variable — who is affected, who is subjected — whose
  value is itself a function of the decisions the demos is being constituted to make.
  Affectedness is not a fixed set you can consult before drawing the boundary; it''s
  produced by the boundary and by what the bounded body goes on to do... Examples:
  a tariff decision makes foreign producers affected; whether there is such a thing
  as a single decision, or a nested set of them, depends on how the polity has already
  organized itself. Federal structure, immigration policy, currency membership all
  retroactively create and destroy affectedness.


