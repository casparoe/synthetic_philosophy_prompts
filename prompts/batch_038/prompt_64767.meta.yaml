  Draft prompt (British English, formal, from a philosophy professor):


  ---


  I am a professor of philosophy; my area is aesthetics, and for twenty-odd years
  I have written about why people choose to sit through representations of sorrow
  when they could avoid them. Six weeks ago my wife died, at fifty-eight. She was
  a mezzo-soprano who spent her career in lament repertoire — Dido, and Winterreise,
  which she sang complete every February as a private ritual — and she was the least
  consolable person I have known. She detested the phrase ''at peace'', walked out
  of a memorial service for a colleague because someone read a poem about a butterfly,
  and told me, in terms, what she wanted: no service, no uplift, and an evening of
  her own choosing in the college chapel, all of it grief, none of it relieved. Her
  colleagues have honoured that.


  I have been asked to give the spoken remarks at the halfway point of that concert,
  this Saturday. Write them for me.


  The room will be split roughly in two. On one side, musicians from her company and
  her conservatoire, several of whom read philosophy and one of whom — a conductor
  who has read my work and thinks my account of the matter is wrong in a particular
  way — will be sitting in the front row. On the other, her family: our two children,
  her brother, and her mother, who is eighty-four, who has told all of us that she
  does not see how she will sit through an evening of this, and who asked me, without
  hostility but quite plainly, whether we could not have chosen something that celebrated
  her instead. My mother-in-law''s question is the real brief. The remarks have to
  answer it — not by overruling her, and not by conceding that the programme is a
  form of self-punishment dressed up as tribute.


  The difficulty is that the honest answer to her is the one I have spent my career
  on, and giving it as a lecture would be grotesque. So: the philosophical content
  must do the work of the speech without ever announcing itself as philosophy. I do
  not want the phrase ''the paradox of tragedy'' spoken aloud in a chapel; I would
  rather it were not spoken at all. Nor may the remarks claim that the music compensates
  for anything, or that art makes the loss worth having, or that we take pleasure
  in a character''s suffering, or that grief is good for us and will leave us cleansed
  — all of which she would have called a lie, and two of which are positions I have
  argued against in print. The speech should also be honest, at least obliquely, about
  a wrinkle that my own field tends to slide past: the puzzle I work on concerns invented
  sorrows, and Saturday''s is not invented. If the remarks pretend otherwise, my mother-in-law
  will hear it, and so will the conductor.


  Practical requirements: between six and seven minutes, which for me is roughly seven
  hundred words; speakable by a man who will be tired and may need to stop; it should
  contain one memory of her that is funny, specific and true to how she was, and that
  memory should carry argumentative weight rather than serve as relief from the argument;
  it should address my mother-in-law directly at some point without putting her on
  the spot or making her a specimen; and it must end by handing the room over to the
  second half of the programme, which is the Winterreise.


  I am not asking for options. Give me one speech, committed: one definite account
  of why a room of people who loved her should choose to spend an evening with her
  grief rather than avoid it, argued for through the speech''s own shape rather than
  asserted, and not a menu of alternative framings for me to choose between. If you
  think my constraints are jointly impossible — if you believe, for instance, that
  no answer to my mother-in-law can avoid either consolation or despair — say so plainly
  and then write the speech anyway, on your own best judgement about which constraint
  must bend.


  After the speech, add a short note, in your own voice rather than mine, stating
  which account of the paradox of tragedy the speech has committed to, what it has
  taken for granted that is contested in the literature, and where it has bent the
  truth for the sake of a room that is not a seminar.


