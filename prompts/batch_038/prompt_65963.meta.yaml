  The frame problem, versions:

  1. McCarthy & Hayes (1969): the technical problem — in the situation calculus, to
  infer the effects of an action you must state, for every fluent, that it remains
  unchanged unless affected. Combinatorial explosion of frame axioms. "Material mode"
  solutions: default persistence rules (McCarthy''s "common sense law of inertia"),
  nonmonotonic logic, circumscription.

  2. The Yale Shooting Anomaly (Hanks & McDermott 1986): nonmonotonic approaches give
  unintuitive results.

  3. The ramification problem (consequences of consequences) and the qualification
  problem (all the conditions that must hold for an action to have its normal effect
  — McCarthy 1980 "Circumscription: a preliminary report"? Actually the qualification
  problem is in McCarthy 1980 and elaborated by Shanahan).

  4. The philosophical/holism version: Dreyfus (Heideggerian: relevance depends on
  a background of skills/practices not formalizable), Fodor (1983, "The Modularity
  of Mind" — the frame problem as the problem of relevance/holism: which of the indefinitely
  many beliefs are relevant to a given inference; Fodor claims it''s a "metaphysical"
  problem that no one has an answer to, and that it undercuts computational psychology),
  Dennett (1984 "Cognitive Wheels: The Frame Problem of AI" — three robots R1, R1D1,
  R2D1; argues the frame problem is the problem of relevance and that it''s the deep
  problem of epistemology).

  5. Shanahan''s distinction: the "derivational" frame problem vs the "epistemological"/"big"
  frame problem; also Shanahan''s "phenomenology" of robotics — the "symbol grounding"
  and the sensorimotor loop; and importantly, Shanahan''s claim that for real robots,
  the frame problem is solved not by symbolic persistence axioms but by the closed
  loop with the world (a "sensorimotor account"): the robot doesn''t need to represent
  what stays the same because it keeps re-perceiving. That''s a really nice niche
  angle: Shanahan (in "The frame problem" entry in the Stanford Encyclopedia and in
  "Solving the Frame Problem" 1997) discusses the "event calculus with narrative explanation"
  and also the robotics point that in a closed sensorimotor loop, the frame problem
  largely evaporates because perception is continuous.


  Now the Uber case is a fascinating inversion: Uber''s system was NOT doing symbolic
  persistence reasoning at all — it was doing per-frame perceptual classification
  with no persistence, i.e., it had *thrown away* the frame axioms rather than being
  crushed by them. The failure was a failure of inertia: it treated the same object
  as a new object whenever its category changed. So it''s the "reverse frame problem":
  instead of being unable to enumerate what doesn''t change, the system didn''t preserve
  what should have stayed the same (object identity) across a change in what it believed
  about the object''s kind.


  That''s a genuinely fresh mapping. And it connects to a deeper point: the persistence
  of object identity through reclassification is a "qualia"/continuity assumption
  that classical AI took for granted (a track ID persists), and the modern ML stack
  breaks it because the identity is tied to the category rather than to the track.


  Also: the "no jaywalking pedestrians" design decision is a pure relevance/qualification
  problem: the system''s ontology was indexed to a normal-case world (pedestrians
  appear at crosswalks), which is exactly what Dreyfus accused AI of — building a
  system that works in the "average expectable case" and has no resource for the abnormal
  case, because the abnormal cases are indefinitely many and can''t be enumerated.
  Fodor''s version: relevance is determined by the whole belief system; you can''t
  specify locally which features matter.


  And the action suppression / handing back to the human is a nice angle: when the
  machine''s own frame broke, it defaulted to the human — but the human''s frame was
  also broken (she was watching Hulu), and the human had been trained as a monitor
  of a system whose failure modes she couldn''t know. Also: the 1-second action suppression
  is a "material-mode" solution to a relevance problem (don''t act on uncertain classifications
  to avoid false positives), which is a trade-off, not a solution.


  Another rich angle: the "big" frame problem is often thought of as unsolvable in
  principle, and yet the NTSB''s causal story is a list of small engineering fixes
  (add a jaywalking pedestrian class, keep track IDs across reclassification, re-enable
  AEB, two drivers). Does that show the frame problem was never deep? Or does it show
  the fixes are endlessly enumerative — each new fix is a new frame axiom, and the
  set of abnormal cases is open (Dreyfus''s point)? Ask the model to weigh this.


