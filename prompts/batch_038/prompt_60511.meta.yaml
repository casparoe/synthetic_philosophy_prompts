  Design of the prompt:


  Persona: philosophy professor, casual, a typo or two, elaborate (2-3 paragraphs),
  asking for American English.


  Content:

  - Para 1: Set the scene. E.g., "So I was sitting in on our department''s Friday
  workshop last week and watched the phrase ''information is physical'' get used twice,
  by two different people, to support almost opposite conclusions..." Details: one
  was a grad student arguing that Landauer''s principle dissolves Maxwell''s demon
  (so thermodynamics constrains computation — the demon has to pay for erasure); the
  other was a visiting philosopher of mind arguing that ''information is physical''
  rules out substrate-independence/multiple realizability for consciousness — i.e.,
  that what matters is the physical stuff, not the abstract informational pattern.
  Same words.

  - Para 2: Ask for the menu of readings: what precise claims could it be making,
  from trivial to radical, marking which are platitudes (information must be instantiated
  in something with physical degrees of freedom), which are substantive and empirically
  checkable (Landauer: logically irreversible operations cost at least kT ln 2 per
  bit erased at temperature T — and note it''s contested/nearly a restatement of the
  second law in some treatments), which are ambiguous (is ''physical'' doing contrastive
  work against ''abstract'' or against ''computational''? is ''information'' Shannon
  information, semantic information, algorithmic/Kolmogorov information, or thermodynamic
  entropy-as-missing-information?), and which are just false or question-begging.

  - Also ask about the directionality issue: the slogan is sometimes read as reducing
  information to physics (Landauer) and sometimes as reducing physics to information
  (Wheeler''s it-from-bit), and the same string of words is doing both jobs.

  - Para 3: Which reading does each of my two colleagues need, and does either get
  their conclusion; deliverable format: a numbered list, in American English, that
  I can bring to the workshop / hand out. Maybe add: also flag the readings where
  the slogan turns out to be doing no work at all, i.e., where it''s a conversational
  stop-sign. Also mention the demon briefly: the reading on which it exorcises the
  demon must say something about whether the cost attaches to erasure specifically
  or to measurement / correlation / any logically irreversible step — because Bennett''s
  point was that the demon could run on reversible computation and only pays when
  it wipes its memory. And note the subtlety: if ''information is physical'' means
  the demon''s memory is a physical system whose entropy must be counted, then the
  exorcism isn''t really about erasure cost at all but about bookkeeping — two different
  resolutions wearing the same slogan.


