  case of participation; why does Socrates not resist here? (Standard but worth asking.)


  2. The three fragment cases: greatness (part of greatness smaller than greatness
  → each great thing great by something less than absolute greatness → unreasonable),
  equality (taking away a part of equality makes you less than equality so you can''t
  be equal), smallness (the part of the small is smaller than the small, so adding
  it makes something smaller yet the whole small becomes greater — the text is mangled:
  "the small will be greater than this, since this is a part of it, and therefore
  the absolute small will be greater; but that to which the part of the small is added
  will be smaller,"). Ask: why do the smallness and equality cases differ in logical
  form from the greatness case? The greatness case says: if x is great in virtue of
  a part of Greatness that is less than the whole, x is great by something less than
  absolute greatness — but why is that absurd? Being great doesn''t require being
  maximally great. That''s the real question: does the greatness argument rely on
  an illicit step from "less than the Form" to "not enough to make you F"? And in
  the smallness case there''s an inversion — a part of smallness is less small than
  smallness, so adding a part of smallness to something makes it... bigger? Actually
  the standard reading: the part of smallness is itself greater than the whole smallness
  (since it''s a part), so that by which the thing is small would be greater than
  absolute smallness — hence the thing would not be small but greater. So the smallness
  case generates a contradiction more directly.


