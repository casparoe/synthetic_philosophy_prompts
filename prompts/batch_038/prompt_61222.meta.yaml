  ---


  My father was declared dead by neurologic criteria in a New Jersey hospital four
  months ago, and my family invoked the state''s provision requiring the attending
  physician to take a patient''s religious beliefs into account before making that
  declaration. The provision did not help us — it delayed things by a day and produced
  a note in the chart — but it planted a question I have been trying to answer ever
  since: what kind of legal object is a death determination, exactly? I have drafted
  the essay below and would like your comments.


  DRAFT — "Two Registers"


  The Uniform Determination of Death Act, a model statute promulgated in 1981 and
  enacted in most states, defines death disjunctively. An individual who has sustained
  "irreversible cessation of all functions of the entire brain, including the brain
  stem" is dead; so is one who has sustained irreversible cessation of circulatory
  and respiratory functions. The usual gloss treats the two disjuncts as two windows
  onto a single underlying event, and the standard biological rationale supplies that
  event: the brain is what integrates the body into an organism as a whole, so its
  total and irreversible failure is the loss of the organism.


  I think the gloss is a rationalization, and that the statute is not tracking one
  event at all. Consider the second disjunct as it operates in donation after circulatory
  death. There, a patient whose heart stops is declared dead a few minutes later,
  while the brain is anatomically intact. The declaration does not turn on any neurological
  fact; it turns on irreversibility, and irreversibility in that setting is secured
  not by physiology but by a prior agreement not to attempt resuscitation. The same
  arrested heart is a dead person''s heart if the team has decided not to restart
  it and a living person''s heart if the team is about to. Death, at the level of
  the criterion, is doing normative work.


  Once you see this in the circulatory disjunct, the neurologic one looks different
  too. The statute says all functions of the entire brain; the bedside tests ask about
  coma, brain-stem reflexes, and apnea. Nobody measures the hypothalamus. Critics
  have pointed this out for decades, and defenders have replied that the statute means
  clinically ascertainable functions, or that the loss of the brain''s integrative
  role is the point even where scattered cells persist. Both replies concede something:
  the operative content is set by what the determination is for, not by what the body
  is doing.


  My proposal is that we stop reading the statute as a claim about a natural kind
  and start reading it as a jurisdictional instrument — closer to a discharge in bankruptcy
  than to a statement of fact. A bankruptcy discharge does not describe insolvency;
  it settles who may press claims against whom, using partly economic, partly policy
  criteria. A death determination similarly settles a bundle of things at once: whether
  treatment may be withdrawn without consent, whether an estate opens, whether the
  withdrawal of support is homicide or standard care, and whether organs may be procured.
  Under this reading, brain death determinations are best understood as safe harbors
  with a biological trigger condition rather than as verdicts about organismic status.


  The view has a cost I have not yet figured out how to pay. If a determination is
  a safe harbor, then a family that says "he is not dead" is not obviously making
  a factual error, and the physician''s declaration loses the authority that makes
  it conclusive. The New Jersey accommodation, which I first took to be a strange
  local quirk, would be the honest version of what every state does in practice —
  and it is not clear that is a recommendation.


