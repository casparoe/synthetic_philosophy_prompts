  Include the fictional summary with subtle misrepresentations:


  Draft summary (attributed to a chapter of a pop logic book, unnamed):


  "Lewis proved that indicative conditionals have no truth conditions. He took as
  his target the attractive equation defended by Ernest Adams, according to which
  the probability of ''If A, then B'' is just the conditional probability of B on
  A. He then showed that this equation can hold for a given A and B only if A and
  B are probabilistically independent — unless the language is so impoverished that
  it contains no more than two sentences. Since independence is obviously not generally
  the case, the equation must be false, and there can be no proposition expressed
  by an indicative conditional for a probability to attach to. Conditionals therefore
  express nothing truth-apt; asserting one is merely revealing a conditional degree
  of belief. This is why Lewis''s result is the definitive answer to the paradoxes
  of material implication: once truth conditions are withdrawn, there is nothing left
  to be paradoxical about."


  Subtle errors:

  1. Lewis did not conclude conditionals have no truth conditions; he held they are
  truth-functional (material conditional) truth-conditionally, with assertibility
  governed by conditional probability. Big error — the conclusion is inverted.

  2. Adams''s thesis was not about probability-of-truth of a proposition; Adams himself
  was a non-cognitivist, and Lewis''s move was to reinterpret the thesis as about
  P of the conditional''s truth. So the summary gets Adams roughly right in form but
  mis-frames whose commitments it is; more importantly, the triviality result targets
  the thesis when read as being about probabilities of contents, and it does not thereby
  refute Adams''s assertibility thesis.

  3. The result is not "only if A and B are independent for the pair in question";
  it''s a global collapse — under the assumption the equation holds for all sentence
  pairs and all probability functions obtained by conditioning, you get triviality
  of the whole probability distribution (conditional probabilities equal unconditional
  ones throughout, and relatedly constraints like at most two non-trivial propositions
  in later versions). The "impoverished language" clause garbles the richness/closure
  assumptions the results actually depend on; the escape routes people discuss (restricting
  the thesis to a single probability function, restricting to non-embedded conditionals,
  letting the conditional''s content shift with context) are not about having only
  two sentences.

  4. "Lewis dissolved the paradoxes of material implication by withdrawing truth conditions"
  — actually Lewis''s Gricean strategy keeps truth conditions and explains the puzzles
  pragmatically via assertibility conditions; conditional probability is not closed
  under strengthening the antecedent, which is what does the explanatory work. Also
  Lewis''s own earlier work criticized paradoxes of strict implication (not indicative),
  so there''s a conflation.

  5. Also the summary''s claim that asserting a conditional "merely reveals a conditional
  degree of belief" — that is closer to Adams/Edgington''s suppositional view; Lewis''s
  account is that assertibility goes by conditional probability while truth conditions
  remain truth-functional. Fine, folded into 1.


