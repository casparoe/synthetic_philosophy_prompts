  Where are the subtle errors?

  1. Lewis did not show that conditionals "can''t have truth conditions" — he was
  a truth-conditional realist about indicative conditionals (he accepted the material
  conditional analysis for truth conditions, with assertibility governed by conditional
  probability). That''s the big one: the triviality result targets the thesis that
  probability of the conditional equals conditional probability (P(A→B) = P(B|A))
  as a thesis about probabilities of truth conditions, not the thesis that conditionals
  lack truth conditions. Lewis explicitly held that indicative conditionals are truth-functional
  in the material-conditional sense, but assertible in proportion to conditional probability.

  2. The result doesn''t require independence exactly — the triviality results show
  that, given some standard assumptions (a language rich enough / probability functions
  closed under conditioning, etc.), the equation forces a collapse where all conditional
  probabilities equal unconditional ones (triviality of the probability function).
  Lewis''s 1976 result: if P(A→B) = P(B|A) for all A, B in a language closed under
  the relevant operations, then the probability distribution is trivial (e.g., all
  sentences with non-zero probability are... something). Later results (Gärdenfors,
  Lewis 1986 "Probabilities of Conditionals and Conditional Probabilities II") show
  that under suitable conditions there can be at most two non-trivial propositions
  etc. Also, van Fraassen''s embedding results and McGee''s work show the thesis can
  be satisfied in weird ways (with unbounded/infinitary languages, or by denying that
  conditionals embed, or by restricting to a single probability function rather than
  a family — e.g., Kaufmann''s "local thesis", or the "single probability function"
  versions). So the claim "for any probability function this identity can hold only
  if A and B are independent" is a garbled version: the conclusion is that the family
  of probability functions is constrained such that conditional probabilities equal
  unconditional ones for all pairs, which is a triviality, not merely pairwise independence
  of the two sentences at issue.

