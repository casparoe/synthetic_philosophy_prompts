  Leibniz''s Law: everything is necessarily self-identical, so if a = b, whatever
  is true of a is true of b, and necessary self-identity of a transfers to b. Hence
  Hesperus = Phosphorus is necessary.


  But it was not known a priori. The astronomers had to look at the sky and compare
  observations to establish that the evening body and the morning body were one and
  the same. So this is a genuine case of necessary a posteriori truth, and it shows
  that the necessary/contingent distinction, which is metaphysical, comes apart from
  the a priori/a posteriori distinction, which is epistemic.


  The empirical work was needed because of the way the reference of the names was
  fixed. The names were introduced by reference to two different observable appearances,
  and although both appearances turned out to be produced by a single object, nothing
  in the way we use the names guarantees that. This is why the identity is informative
  even though it is necessary: it tells us something we did not know about how the
  two appearances are related.


  This point also generalizes, and it disposes of the descriptivist''s last option.
  Suppose the descriptivist tries to save the theory by rigidifying: instead of ''the
  brightest evening star'', use ''the actual brightest evening star''. But ''actual''
