  I cover science and ideas for a national magazine, and I am reporting a long feature
  on the timing of conscious experience — specifically the puzzle raised by the color
  phi phenomenon, the effect Kolers and von Grünau documented in the mid-1970s at
  Nelson Goodman''s prompting: two differently colored dots are flashed in succession
  a few degrees apart, and at certain intervals subjects report not two flashes but
  a single dot that travels across the gap and changes color abruptly at the midpoint,
  that is, before any light from the second dot could have reached the eye. In my
  reporting I keep running into two camps that have been arguing past each other for
  three decades. The first takes the Dennett line: there is no moment at which the
  content of experience is fixed, the Orwellian story (the dot really looked red,
  and the memory is edited afterward) and the Stalinesque story (the color change
  was staged before the experience was ever "broadcast") are two descriptions of the
  same underlying neurophysiology, and subjects are in principle unable to tell them
  apart — so the intuition that there is a fact of the matter is a hangover from the
  Cartesian theater. The second camp is roughly the global-workspace theorists: they
  agree there is no homunculus watching a screen, but they insist that conscious access
  has a determinate, neurally identifiable onset — a discrete ignition, a broadcast
  with a beginning — and therefore that whether the color change was fixed before
  or revised after that ignition is an empirical question with a real answer.


