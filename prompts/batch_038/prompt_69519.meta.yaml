  condition? Nyāya requires that a valid cognition be of something not already known
  — anadhigata? Actually Gaṅgeśa/Navya-Nyāya define pramā as yathārtha-anadhigata-jñāna
  — true cognition that is not already cognized (i.e., non-memorial). That''s a real
  detail: memory is not a pramāṇa because it''s not novel. Good.)

  - "śabda = faith/authority, so Nyāya is fideistic" — head off by contrasting with
  the āpta conditions and with the fact that Nyāya applies it to ordinary speech.

  - "the number of pramāṇas is arbitrary/stipulative" — head off by showing that each
  addition is argued for by an irreducibility argument, and that the list is a live
  dispute among the darśanas.

  - "upamāna is just analogy/metaphor" — it''s about acquiring word-referent knowledge
  for an unfamiliar object.

