  Nyāya on śabda: śabdaḥ āptavacanaḥ — "testimony is the statement of a trustworthy/authoritative
  person (āpta)." An āpta is one who has direct knowledge of the thing and wishes
  to communicate it as they know it (yathārthajñāna and its communication without
  distortion). Knowledge from śabda arises from the hearer''s understanding of the
  words (padārtha-sambandha), with conditions: ākāṅkṣā (mutual expectancy/syntactic
  completeness), yogyatā (semantic fitness/compatibility), āsatti/sannidhi (contiguity/proximity
  in time), tātparya (speaker''s intention). That''s the standard Nyāya account of
  verbal cognition (śābdabodha). Gaṅgeśa''s work on tātparya and the "parrot" example
  — a parrot''s utterance is not śabda because there''s no intention. Good detail,
  likely known to LLMs.


  So the Nyāya account does make the hearer''s understanding depend on the speaker''s
  reliability — but Nyāya insists that the resulting cognition is not an inference,
  because the causal process is different: it''s the comprehension of the sentence
  meaning, not a vyāpti-based inference from observed marks. The Buddhists (Dharmakīrti,
  Dignāga) reject śabda as separate: they say what is called testimony is either perception
  (of the sounds) plus inference (from the sounds as signs to the content, given the
  speaker''s reliability). And Nyāya''s counter: the pervasion needed for such an
  inference isn''t available; and crucially the child learning language (a standard
  Nyāya argument: the child learns word meanings by observing elders'' usage, which
  itself requires... hmm) — there''s a well-known argument about how a boy learns
  what words mean from adults'' usage. Also there''s an argument that if all testimony
  were inference, we''d need to have established reliability for every domain, which
  is impossible for domains we have no other access to.


  Also the āptavacana notion: Nyāya extends it to include non-Vedic/ordinary testimony;
  and it distinguishes from the Mīmāṃsā view that the Veda is authorless and self-validating
  (svataḥ prāmāṇya). Nyāya holds parataḥ prāmāṇya: validity is extrinsic, both in
  arising and in being known — a cognition is valid because of the excellence of its
  causes (guṇa), and we come to know its validity through successful action (pravṛtti-sāmarthya).
  That''s a genuinely distinctive doctrine and a great "leave it out or not" decision.


  Also: pramāṇa as kāraṇa — the special/instrumental cause (karaṇa) of a valid cognition.
  The Nyāya analysis of pratyakṣa into indriyārthasannikarṣa (sense-object contact),
  six kinds of contact, savikalpaka/nirvikalpaka distinction — likely too much.


