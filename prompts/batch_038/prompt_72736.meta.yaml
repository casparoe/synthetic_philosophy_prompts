  Let me write each carefully.


  (1) For any question about the future I begin from how often that kind of thing
  has happened before, and I treat the resulting number as the anchor. Adjustments
  away from the anchor are permitted, but each one owes a justification; the anchor
  owes none.


  (2) Reference classes must be fixed by criteria set down before you look at outcomes.
  I know most published lists of great powers are assembled after the fact, so I wrote
  my own three criteria first — the polity could project force well beyond its home
  region, contemporaneous diplomits... hmm "contemporaries treated it as one of the
  leading powers," and "it controlled a large share of the world''s population" —
  and only then coded durations. I would not accept a base rate from anyone who did
  it the other way round.


  (3) I also think there is no determinate fact about how long many of these polities
  lasted. Whether Rome''s great-power status ends in 476, or 395, or 1204, or 1453
  is a choice, not a discovery, and for a third of my list the choice moves the duration
  by a century or more.


  (4) My unit of analysis is the polity, not the year. I count polities, not polity-years.
  [and] In the club newsletter I published a 15% figure for a certain question...
  Let me phrase: In our September newsletter I put 15% on a currently dominant power
  losing great-power status within the next fifty years, on the grounds that seven
  of my forty-one polities lost the status within fifty years of reaching it.


  (5) I refuse to attach numbers to questions that resolve after I expect to be dead.
  Scoring is the entire discipline; a number nobody will ever be scored on is a performance
  of rigor, not rigor. The handbook will say so explicitly. (And note: 2075 is fine
  because I''d be 68; 2125 is not.)


  (6) A base rate from forty-one cases is, statistically, close to worthless — the
  uncertainty on it is enormous. It is still far better than my unaided intuition
  about the same question, and I would always prefer it.


