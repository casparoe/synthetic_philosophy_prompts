  ---


  Something in the apparatus around elections has always bugged me and I can''t quite
  name it.


  Turnout is treated as the headline health metric of a democracy. Election commissions,
  news desks, and civic groups all lead with the percentage; a low number gets described
  as a legitimacy problem, a "democratic deficit," a sign that something is wrong
  with the polity rather than with the menu on offer. Whole campaigns and institutional
  reforms — same-day registration, making election day a holiday, mail ballots — get
  justified by the number they''re expected to move. And in a bunch of countries the
  election authority itself publishes turnout at intervals *while the polls are still
  open*, apparently on the assumption that hearing the number will make more people
  go.


  Here''s what puzzles me. The political science that these same institutions draw
  on says the chance one voter is decisive is so tiny it can''t rationally outweigh
  the cost of driving to a polling station, and most people in the field now explain
  turnout by something other than wanting to affect the outcome: duty, expression,
  identity, the fact that neighbors will know. Fine. But then the interim-turnout
  practice is backwards on its own terms: if you''re an instrumental voter, learning
  that everyone else has already voted should make your own ballot *less* likely to
  matter, not more. The authorities publish the number expecting it to pull people
  in. So the practice seems to assume that a vote is a kind of joining-in, and that
  turnout is a coordination signal — not a sum of tiny bets on an outcome.


  So: what theory of what voting is *for* does the whole turnout apparatus presuppose?
  I want you to reconstruct it as carefully as you can. In particular, it seems to
  me that if a vote were purely a statement of preference, low turnout wouldn''t be
  a pathology at all — it''d be information, it''d mean most people were broadly content
  or didn''t care much, which is arguably a good outcome. The panic only makes sense
  if voting is something citizens *owe*, whether to the state, to each other, or to
  the dead. Is that right, or am I missing a reading of the metric that''s compatible
  with a purely preferential view (something epistemic, maybe — more voters means
  better aggregation)?


  Then: how much of this is strictly presupposed vs. just what the practice happens
  to fit? There seem to be several candidate theories — a duty view, a legitimacy
  view where authority comes from the sheer number participating, a participatory
