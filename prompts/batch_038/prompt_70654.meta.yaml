  Draft for paradox of voting:


  "Here''s something that''s always struck me as odd about how get-out-the-vote campaigns
  work. In the run-up to elections, civic groups and parties send out mailers, texts,
  and ads whose explicit content is about the stakes: ''this election will be decided
  by a handful of votes,'' ''your vote could be the one that tips it,'' ''don''t let
  other people decide for you.'' Meanwhile the political scientists who advise these
  same campaigns mostly accept that the chance any single voter is decisive is so
  small that it can''t possibly outweigh even a trivial cost of voting — a lot of
  them think people vote for expressive reasons, out of a sense of civic duty, or
  because they''ll be embarrassed if their neighbors find out they stayed home. And
  some campaigns have actually run experiments where the mailing doesn''t mention
  the stakes at all, it just tells the household that a record of who voted and who
  didn''t will be sent to their neighbors afterward — and that works better than the
  appeals to the stakes.


  So: what theory of what a vote is *for* does the standard ''your vote matters''
  appeal presuppose? Is it a leftover of an instrumental picture of voting that everyone
  in the field has abandoned, or can it be read charitably as saying something true
  — e.g., about what the aggregate does rather than the individual? Also there''s
  the fact that the social-pressure mailers seem to work by making voting a matter
  of reputation, and that reputation-based accounts sound uncomfortably like saying
  people only vote to look good — which most of the theorists would deny. Are the
  appeals and the pressure campaigns resting on incompatible theories of the voter,
  or is there one theory that licenses both? And if we replaced the presupposed picture
  with the expressive/duty one openly, what would GOTV actually have to stop doing?"


