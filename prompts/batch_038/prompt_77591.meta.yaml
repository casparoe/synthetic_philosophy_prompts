  Weber''s claim is neither (a) beliefs motivate behavior in general nor (b) a deterministic
  law. It''s a specific historical claim about a distinctive ethos and about the direction
  of influence, argued with a comparative method and with counterfactual reasoning
  about "objective possibility."


