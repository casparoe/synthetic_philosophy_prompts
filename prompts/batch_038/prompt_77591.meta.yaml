  Another important false presupposition: "Weber isn''t claiming ideas caused capitalism
  but the whole book reads like an argument that religious psychology caused an economic
  ethos" — and the resolution is that Weber''s denial is about one-sided causal monoculture
  and about the direction of explanation; and also that the "spirit" is not a psychological
  state but an ethos/form of life, and that Weber''s real target is the modern "capitalist
  spirit" as a distinctive normative orientation, which he thinks needs explaining
  and which material conditions alone don''t explain. And the counterexample objection
  misses that Weber''s claim is about the emergence of a specific type of capitalism
  (rational, methodical, bourgeois, organized free labor) and that his argument is
  comparative-historical (in The Religion of China, India, Ancient Judaism he looks
  for why it didn''t happen elsewhere — so the "should apply everywhere" objection
  is answered by his actual comparative program: predestination alone isn''t the cause;
  it''s the specific doctrinal configuration plus the pastoral practice plus the structural
  conditions).


  Also, "elective affinity" is not a dodge: it names a reciprocal reinforcement relation
  between the religious ethic and the economic ethos, and Weber''s causal method (in
  his methodological essays) is about "adequate causation" via counterfactual reasoning
  and about the possibility that ideas act like "switchmen" on the tracks along which
  action is pushed by interests (that''s the famous image from the essay on the social
  psychology of the world religions — "Not ideas, but material and ideal interests,
  directly govern men''s conduct. Yet very frequently the ''world images'' that have
  been created by ''ideas'' have, like switchmen, determined the tracks along which
  action has been pushed by the dynamic of interest"). That''s a quote — I''d need
