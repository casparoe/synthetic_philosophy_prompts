  Weber''s Protestant Ethic:

  - Common confusions: (1) that Weber argued Protestantism caused modern capitalism;
  he explicitly said he wasn''t proposing a one-sided causal account and that he''d
  argue against a naive historical materialism replacing it with an equally naive
  spiritualist one. (2) That "the spirit of capitalism" = greed/love of money; Weber
  contrasts Franklin''s attitude with adventurous, irrational acquisitiveness (Fugger,
  conquistadors); the spirit is an ethos of duty/calling, methodical rational conduct,
  deferred gratification. (3) That predestination caused the anxiety → work; Weber''s
  causal chain is more specific: pastoral practice and the psychological effects of
  the doctrine of predestination led to a "salvation anxiety" and to methodical rationalization
  of the whole life (inner-worldly asceticism), which had the unintended consequence
  of fostering accumulation and reinvestment. (4) That Weber''s thesis was "refuted"
  by Tawney/Fischer/Samuelsson; the actual historiographical state is contested. (5)
  That Weber was claiming ideas cause material outcomes in general — the "elective
  affinity" concept. (6) That ascetic Protestantism is the same as Calvinism (Lutheranism
  is largely excluded; Luther''s Beruf concept matters but Lutheranism remained traditionalist).


  A sincere question with a false presupposition: "Weber''s whole argument is that
  Protestants worked hard because they wanted to prove they were among the elect —
  i.e., that hard work earned salvation / that success in business was read as a sign
  of election. So doesn''t that mean the thesis is just ''religion motivates behavior,''
  which is trivially true and could be said of any religion? Why is it considered
  a big deal in sociology? And if the mechanism is just ''signs of election → work
  harder,'' then why did Calvinists in, say, Scotland or New England not all become
  capitalists — isn''t that a fatal counterexample?"


  The confusion: Weber explicitly denies that the doctrine of predestination is a
  "motivation" in an instrumental/rational sense; the religious virtuoso''s relationship
  to the doctrine is not a means-end calculation (salvation isn''t purchasable — that''s
  the point of the "works-righteousness" polemic; good works are symptoms, not means,
  of election). Also the triviality charge misses that Weber''s claim is about the
  form of life (methodical rationalization of the whole of life), not effort intensity.
  And the counterexample point: Weber''s argument was about specific groups — Pietists,
  Baptists, Mennonites, Quakers, and especially the way in which ascetic Protestantism
  shaped economic ethos in specific regions; and about the fact that capitalism existed
  before (adventure capitalism) but the specific modern rational capitalism needed
  the ethos. Also Weber''s causal claim is about "elective affinity" and about the
  origins of a spirit, not a deterministic prediction about every Calvinist.


  Also good: "culture as cause" — the question of whether values can be causes. So
  a confusion: "If Weber''s thesis is right, then values cause economic systems, which
  means sociology has to give up causal explanation for interpretive understanding"
  — a false dichotomy between Verstehen and causality. Weber himself thought Verstehen
  was about establishing meaning-adequacy and that causal adequacy still required
  counterfactual/counterexample reasoning (his "objective possibility" / counterfactual
  method in essays like the one on the historical causality... e.g., his counterfactual
  about the Battle of Marathon, or his argument about the role of ideas). So a question
  that presupposes interpretation and causation are rivals is a nice confusion.


