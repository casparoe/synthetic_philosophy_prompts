  hands, plus a character defect.

  - R2 (integrity/betrayal of constitutive commitments): if she endorses the trade-off
  all the way down and it doesn''t betray her deepest commitments, not dirty — merely
  a hard political judgment (verdict #6 analog).

  - R3 (structural): dirt belongs to the regime''s structure; she is a locus of it,
  but the question of her personal guilt is beside the point — dirty, but not blameworthy,
  and acknowledgment is neither necessary nor sufficient.

  - R4: she avoided greater harm by an act, but the alternative (resigning, refusing
  to praise) would have let children die — so both options are dirty; there''s no
