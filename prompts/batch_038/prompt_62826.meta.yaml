  The candidate rules:

  R1 (Walzerian/residue): an act is dirty-handed iff the agent does what is right-all-things-considered
  while violating a serious moral constraint, AND is left with agent-regret/guilt
  that is owed. Dirt tracks constraint-violation + felt residue.

  R2 (threshold + integrity): dirt arises only where the agent has overridden a personal
  commitment (integrity) — i.e., where the act forces the agent to betray a value
  constitutive of who they are; role-required acts that the agent endorses all the
  way down are not dirty.

  R3 (structural): dirt attaches wherever an agent exercises power under institutions
  that make grave harm unavoidable, regardless of felt guilt; the felt-guilt data
  are evidence, not criteria.

  R4 (constraint-only / "no clean hands" view): the tutor''s verdict #7 suggests dirt
  is not restricted to commissions; any choice that allows grave harm is dirty. That''s
  a different dimension.


  New case where rules diverge: e.g., an official who, acting under a lawful but unjust
  order, prevents a greater harm by participating — say a health minister in an authoritarian
  regime who stays in office, publicly praises the regime''s policies (a lie), and
  in exchange retains control of a vaccination program; she feels no guilt, reports
