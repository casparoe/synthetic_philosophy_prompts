  Quasi-harmonic approximation (QHA): In the harmonic approximation, you expand the
  potential energy about a fixed equilibrium structure; the normal modes (phonons)
  have frequencies determined by the second derivatives at that structure. Those frequencies
  depend on volume/lattice parameters. The Helmholtz free energy F(V,T) = U_static(V)
