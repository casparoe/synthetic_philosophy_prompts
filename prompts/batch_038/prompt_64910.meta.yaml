  F over V at given T gives the equilibrium volume at that temperature, which explains
  thermal expansion (in a purely harmonic crystal there would be no thermal expansion).
  Then you recompute phonon frequencies at the new volume, iterate to self-consistency.
  So: lattice parameters depend on the phonon spectrum; the phonon spectrum depends
  on the lattice parameters. Genuine fixpoint, iterated to convergence. Also the Grüneisen
  parameter describes mode-dependent volume sensitivity. All accurate.


