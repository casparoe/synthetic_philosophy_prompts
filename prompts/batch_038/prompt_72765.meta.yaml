  At the close of a reading group session last term on the transitivity of comparative
  value, two of my colleagues got into an argument that I was unable to settle, and
  I would like an adjudication of it move by move. The group had been considering
  a spectrum: a sequence of one thousand possible lives for a single person, L1 through
  L1000, where L1 is a life of sustained achievement, deep relationships, and vivid
  appreciation of the world, and each successive Li+1 involves a small, real diminishment,
  ending with L1000, a life that is barely worth living. Everyone in the room agreed
  that L1 is better than L1000. The dispute was about what happens at the individual
  steps.


  Here is the exchange, roughly as it went.


  (1) [Colleague A] argued: for each i, the difference between Li and Li+1 is too
  small for Li to be better than Li+1 — nothing in the case distinguishes one step
  from another, so if any step is a betterness step, all are, and a thousand such
  steps would put L1000 above L1. Deny transitivity, then, or accept that the series
  contains no betterness steps at all.


  (2) [Colleague B] replied: that''s a bad dilemma, because both horns trade on an
  equivocation. "Too small to make a difference" was doing perceptual work in the
  setup — we can''t tell Li from Li+1 — and then it was silently promoted into the
  normative claim that Li is not better. Indiscernibility is not the same as equality.
  Once you keep them apart, the natural view is that each step is a genuine betterness
  step and transitivity is intact; the argument only looked persuasive because it
  borrowed an epistemic premise.


  (3) [A]: but then your view has to say where the significant steps are, and you
  can''t. Any line you draw is arbitrary in exactly the way a line between bald and
  not-bald is arbitrary. Better to accept that betterness is only quasi-transitive
  — the large-scale comparisons survive, the stepwise ones fail, and that''s a coherent
  structure, not a collapse.


  (4) [B]: quasi-transitivity is not stable. If L1 is not better than L2, and not
  better than L3, and so on down a long enough stretch, then the indifference-like
  relation spreads; you cannot keep it from eventually contradicting the one judgment
  everyone in the room accepted, that L1 is better than L1000. Intransitivists always
  get to keep that judgment by fiat. Either the relation transmits across steps or
  it doesn''t; there''s no principled stopping point for "not better than" any more
  than for "better than," and you''ve simply relocated the sorites.


  (5) [A]: fine — then accept the alternative to lines: betterness is clumpy. There
  are ranges within which outcomes are on a par, and parthood of a clump is what makes
  the stepwise comparisons fail without making the endpoint comparison fail. The clumps
  have boundaries, but boundaries that are vague are not boundaries that are arbitrary.


  (6) [B]: clumpiness is a redescription, not an answer. You still owe a story of
  what makes a clump a clump, and any such story will either be a weighting across
  dimensions — in which case you''ve reintroduced the transitive comparison you denied
  — or an unexplained primitive, in which case the view has no content beyond "some
  of these steps don''t count."


