  "I am a fourth-year PhD student in the history of philosophy, and on the first morning
  of a one-day workshop I am helping to convene I have been asked to give the opening
  remarks. The workshop is called ''Testimony and the Unexplained: evidential standards
  for reports that ought not to be true,'' and it deliberately mixes three groups
  that rarely share a room: analytic epistemologists who work on testimony, expertise
  and the ethics of belief; clinical and cognitive psychologists who study anomalous
  experiences — apparitional sightings, sensed presences, near-death reports — as
  ordinary features of human psychology rather than as symptoms; and two or three
  working parapsychologists, one of whom will chair the afternoon session and who
  has spent her career on pre-registered forced-choice designs. There are also several
  historians of Victorian thought and about fifteen graduate students. Roughly sixty
  people, none of whom have read the text I am about to describe, in a room where
  about a third would call themselves sceptics in the plain everyday sense and a third
  would be offended by that word applied to them."


  Paragraph 2: "I want the remarks to be built on Henry Sidgwick''s position as first
  president of the Society for Psychical Research, and specifically on the collision
  between two things in his life that his biographers usually handle in separate chapters.
  First, the method: the Society''s founding statement of purpose commits it to approach
  its problems ''without prejudice or prepossession of any kind, and in the same spirit
  of exact and unimpassioned enquiry which has enabled science to solve so many problems,
  once not less obscure nor less hotly debated,'' and Sidgwick took that literally
  — he spent years hunting fraudulent mediums and, in the early 1890s, oversaw the
  Census of Hallucinations, which mailed a standardized question to something like
  seventeen thousand ordinary people asking whether they had ever had a vivid waking
  impression of a person appearing to them, and then tried to work out how many of
  those impressions coincided with that person''s death. Note what that is: testimony
  converted into a base rate, collected not from spiritualist circles but from people
  with no interest in the answer. Second, the stake: Sidgwick''s own moral philosophy,
  as he develops it in The Methods of Ethics, ends in what he calls a dualism of the
  practical reason — the claim that prudence and duty cannot be shown to coincide
  by argument alone, and that the coincidence can only be postulated, on the assumption
  of some moral government of the universe and of a life beyond this one. So the man
  who most needed the anomalous evidence to come out one way was the man who had agreed
  to referee it. He was also, as it happens, a very good referee: he never got his
  evidence, and he never claimed he had. My framing device for the workshop, which
  I would like the speech to coin rather than to inherit, is that Sidgwick kept two
  ledgers — one recording what the testimony licensed him to assert, the other recording
  what his ethics required to be true — and that his achievement was refusing to make
  an entry in the first on the authority of the second. I want the speech to state
  that distinction in plain language that a clinical psychologist and a first-year
  graduate student can both follow, to make it the rule of the day for the workshop
  (nobody writes from the second ledger into the first; nobody is asked to pretend
  the second ledger does not exist), and to admit in a single unelaborated clause
  that I keep one too."


