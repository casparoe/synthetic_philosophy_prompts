  something one believes to be false (a speaker-meaning/intention-based account, roughly
  Augustine/Aquinas-style or the standard "assertion + belief false + intent to deceive");
  (2) hold that LLMs don''t have beliefs, only dispositions; (3) want to evaluate
  models purely behaviorally (output-based eval, no introspective access); (4) think
  that a model that produces a false statement it wasn''t "trying" to produce isn''t
  lying but should still be counted as a deception failure; (5) think sincerity conditions
  should be defined over internal states that are readable from weights/activations;
  etc.


  Genuine tensions: An intention-based account of lying combined with a dispositional/functionalist
  denial of belief plus purely behavioral evaluation. Also: the "no false belief without
  belief" problem — if models have no beliefs, they can''t lie; but if we say dispositions
  play the belief-role, then we''ve smuggled in a functionalist account of belief
  that also gives us content determinacy problems (which disposition? measured how?
  relative to which prompt distribution?). And a case verdict the stated principle
  cannot deliver: e.g., a model that has been fine-tuned to output confident confabulations
  about its own reasoning process — is that a lie? On an assertion-plus-false-belief
  account, the model''s "transcript-level self-report" is not an assertion the model
  makes... hmm.


  Actually a crisp tension: commitment to "deception requires causing a false belief
  in the hearer" (success condition) vs. commitment to "we should grade models on
  attempts, not outcomes, since outcomes depend on the user" — i.e., failed deception
  that the user sees through is not deception on the first view but is a violation
  on the second. That''s a real tension in the literature (Fallis''s account of lying
  requires only that the speaker intend to contribute to a false belief in a context
  where truth is expected; Sorensen; the "deception requires success" debate — Fallis
  2009 argues lying doesn''t require the hearer actually be deceived).


  Another tension: "we should avoid ascribing propositional attitudes" (interpretability
  skepticism) vs. "we should use the model''s own self-reports as evidence of its
  internal states" (which requires taking self-reports at face value, i.e., as assertions
  with content).


