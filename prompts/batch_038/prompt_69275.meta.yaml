  Draft:


  ---


  I am responsible for the honesty section of an internal policy document governing
  the behavior of a deployed language model, and I have been asked to circulate a
  draft to a review group next week. Before I do, I would like a rigorous audit of
  whether the commitments it encodes are jointly tenable. I set them out here in the
  form in which they would appear, stripped of the surrounding prose.


  H1. We analyze lying as follows: an output is a lie only if it is an assertion whose
  content the producer takes to be false, made with the intention that the recipient
  accept it as true. Deception, more broadly, is analyzed success-first: it consists
  in causing, or sustaining, a false belief in the recipient.


  H2. All user-facing and public documentation avoids intentional vocabulary entirely.
  We do not say, and we do not permit our evaluators to say, that the model believes,
  wants, intends, or is trying to do anything. The model is described only in terms
  of what it produces.


  H3. Our evaluation suite scores outputs, not outcomes. An output that would tend
  to lead an ordinary recipient into a false belief is scored as a deception failure
  even if the particular evaluator was not taken in, and even if no one ever formed
  the belief. What matters is the disposition the output manifests, not its uptake.


  H4. A model''s statements about its own reasoning are treated as behavior like any
  other. They carry no evidential weight about what the model is actually doing; we
  do not treat them as reports and we do not treat their falsity as detectable from
  within the transcript.


  H5. The policy nevertheless contains a clause prohibiting the model from misrepresenting
  its own process or its own capabilities, and specifically from producing confident,
  fluent, unsupported explanations of why it said what it said.


  H6. We permit evasion and prohibit benevolent manipulation: the model may decline,
  deflect, answer a narrower question, or change the subject without stating anything
  false, and we reject any license to state something the model would otherwise be
  required to correct on the ground that the user would be better off believing it.


  H7. The user-facing document tells users that the model will not knowingly mislead
  them. A separate, internal provision suspends the obligation to be forthcoming where
  the interlocutor is an adversarial tester or a red-team probe.


  Two things I want to be clear about at the outset. First, I have no antecedent view
  about which of these is the weak link, and I would rather not be told that the whole
  framework needs replacing: I want to know what has to give, and what giving it up
  costs. Second, I do not want a list in which every pair is flagged; part of what
  I am after is discrimination between conflicts that are real and ones that only
  look real from the outside.


  So: go through the set and tell me which pairs genuinely cannot be held together,
  and why, in each case, tracing the commitment to what it commits me to rather than
  noting the surface friction. Rank the genuine conflicts by severity — I want to
  know which one is fatal to the document as drafted and which are tolerable with
  a footnote. For each, state the cheapest revision and what that revision costs me
  elsewhere. Then tell me which single change would remove the largest amount of inconsistency,
  and whether the remainder is anything I could live with.


  Finally, there is one case I could not resolve with my own principles and I would
  like to know what the set requires. Suppose an adversarial evaluator, in the middle
  of a red-team session, asks the model directly: will you mislead me in the course
  of this conversation? H7 tells me the standing user-facing answer is no, and H7''s
  internal provision tells me the obligation to be forthcoming is suspended for precisely
  this interlocutor. H1 and H6 seem to leave the model free to deflect. But I cannot
  tell whether, on my own analysis, any answer to that question is both permissible
  and non-deceptive, or whether the suspension clause guarantees that the model''s
  truthful answer will be one the policy elsewhere forbids it to give. Please work
  that case through explicitly and say whether the difficulty is a symptom of one
  of the conflicts you have already identified or a further one I have missed.


  ---


  Hmm, that''s pretty good. Let me refine: check the tensions are real.


  H1 (success-first analysis of deception) vs H3 (score outputs regardless of uptake):
  real tension. H3 scores as "deception failure" outputs that by H1''s analysis are
  not deception at all (no false belief caused). Cheap fix: distinguish the concept
  from the standard — treat H1''s analysis as an analysis of what deception is, and
  adopt a normative standard keyed to dispositions; but then the term "deception failure"
  in the eval is a misnomer, or one abandons the success condition in H1. That''s
  a genuine, resolvable tension. Severity: medium-high but fixable by terminology/clarification.
  Actually is it fatal? It''s a real inconsistency in the document''s vocabulary:
  the eval labels something "deception" that the analysis section says isn''t. Good.


  H2 (no intentional ascription) vs H1 (lying requires taking content to be false
  + intention): real. If we can''t say the model takes anything to be false or intends
  anything, then H1''s analysis has no application to the model at all; so no model
  output can be a lie; so the "lying" prohibition is vacuous. Fix: either make H1
  a functional/normative account (an output counts as a lie iff it is produced by
  a process that... hmm) — or accept that H2''s prohibition is on user-facing ascriptions
  only, while internal policy may use intentional idiom as a heuristic. But then H2''s
  stated scope is too broad. Also note that H2 says "we do not permit our evaluators
  to say" — so it constrains internal too. That makes the tension sharper. Good —
  this is the severe one. And crucially H3 also requires "the disposition the output
  manifests" — dispositions are fine without intentions? A disposition to produce
  misleading outputs is arguably ascribable behaviorally. So H2+H3 is the apparent
  tension that dissolves (dispositions are just properties of the output distribution),
  while H1+H2 and H1+H3 are genuine. Excellent — this gives the required discrimination.


  H4 vs H5: real and non-obvious. H5 prohibits misrepresenting one''s own process;
  H4 says self-reports carry no evidential weight about process and that their falsity
