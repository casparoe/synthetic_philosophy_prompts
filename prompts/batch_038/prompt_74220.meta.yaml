  word limit and a format request (audit: ranked list with severity, what must give,
  cheapest fix, and a bottom-line sentence).


  The asker''s commitments:


  (1) Working definition + normative claim: A modification of a decision situation
  counts as a safe Pareto improvement when, under assumptions all parties already
  accept about how the situation would be resolved by default (e.g., nobody plays
  a strictly dominated strategy, structurally identical sub-games get played identically),
  everyone is guaranteed to do at least as well and someone strictly better — guaranteed,
  not merely in expectation, and without any assumption about which equilibrium the
  default play would land on. Such modifications are to be adopted as a matter of
  course: they need no further justification, because no participant can point to
  any state of the world in which they end up worse off than they would have.


  (2) I reject interpersonal comparisons of utility entirely. This is precisely why
  SPI appeals to me: each party''s guarantee is stated in their own units, so unanimity
  does the work that aggregation would otherwise have to do.


  (3) I accept Arrow''s theorem together with its conditions read as fairness desiderata,
  and I take it to show that no general aggregation procedure over individual orderings
  can be defended. Hence my program: a politics of unanimity-based, aggregation-free
  reform rather than a politics of social welfare functions.


  (4) Safety is to be assessed ex ante and with certainty, not in expectation. I am
  unmoved by the objection that a change might turn out badly for someone, provided
  the guarantee holds under the shared assumptions.


  (5) However, the assumptions that generate the guarantee are not all created equal:
  when a party''s default behavior is shaped by adaptive preferences, misinformation,
  or a systematically poor grasp of the game, I think we should build the safety case
  using a corrected model of their default play rather than the assumptions they would
  actually endorse — the guarantee should hold for who they''d be if better informed.


