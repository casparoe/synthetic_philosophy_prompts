  Design: consistency audit type. Asker: someone at a policy/institutional-design
  lab or a PhD student in a program on social choice and AI governance, preparing
  a position memo. Domain: Safe Pareto improvements. Include Arrow''s theorem as one
  of the commitments (adjacent domain, and it gives a nice apparent tension).


