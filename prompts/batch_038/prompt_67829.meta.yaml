  \ me.\n\nHere is my position. I will label the commitments so that you can refer\
  \ to them.\n\nP1 — Presentism. Only what exists at the present moment exists. Claims\
  \ about tomorrow are not claims about some further region of reality that is already\
  \ there; there is no such region.\n\nP2 — A truthmaker requirement. For a claim\
  \ to be true, something must make it true, and that something must be actual rather\
  \ than merely possible. I regard truth as a status a claim acquires in virtue of\
  \ how things are, not a status it can have on its own.\n\nP3 — Bivalence. Every\
  \ meaningful declarative claim, including claims about tomorrow's sea battle, is\
  \ either true or false. I do not accept truth-value gaps; I find Łukasiewicz's three-valued\
  \ proposal unintelligible rather than merely false, because it requires giving up\
  \ the law of excluded middle, and that law seems to me non-negotiable.\n\nP4 — The\
  \ interference test (my own; I would be grateful if you would press on it). A claim\
  \ about the future is true now only if no action available to anyone could now or\
  \ later make it false. If a claim is not settled in that sense, it is not true.\
  \ Crucially, I do not treat unsettled claims as neither true nor false: I treat\
  \ them as false. So on my account every claim still receives exactly one of the\
  \ two values and P3 is preserved.\n\nP5 — Applied verdicts. By P4 it is already\
  \ true that the sun will rise tomorrow, since no action available to anyone could\
  \ prevent it; it is false now that there will be a sea battle in the exercise I\
  \ have constructed, and equally false that there will not be one, since either way\
  \ someone's action could still interfere.\n\nP6 — Deliberation matters. It would\
  \ be a piece of bad reasoning for an admiral to conclude that, because it is already\
  \ true that there will be a battle tomorrow, there is nothing to be gained by ordering\
  \ his fleet to sea. I want to say that his decision is among the things that make\
