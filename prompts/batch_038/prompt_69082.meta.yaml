  What the asker wants: a designed case in which phenomenal consciousness and access
  consciousness come apart, in the direction of phenomenality without access (the
  harder direction? Actually both are contested). Block''s canonical examples of P
  without A: sperling-like iconic memory overflow, and arguably peripheral vision;
  A without P: blindsight, and the "zombie" style functional dissociation (e.g., a
  subject who can discriminate without experience — like "cognitive penetration"?).
