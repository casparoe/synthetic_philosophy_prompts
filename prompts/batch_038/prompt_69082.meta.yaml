  can guess; also perhaps the "superblindsight" case. P without A = the Sperling matrix
  case where you seem to see all 12 letters but can only report 3-4.


  The critics (Kouider, Dehaene, Cohen, Dennett, Phillips) say: P-without-A cases
  are really cases of partial/determinate-vs-determinable access; the overflow argument
  fails because the "rich" content is not really phenomenally present — it''s a judgment
  of richness ("the illusion of richness"). And the A-without-P cases (blindsight)
  are questioned: maybe there is degraded phenomenology, or maybe the discrimination
  is driven by a crude conscious percept.


