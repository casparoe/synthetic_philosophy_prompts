  Prompt draft:


  "You are a philosopher of mind with serious training in the metaphysics of realization
  and in the relations between psychology and the neurosciences. I want you to diagnose
  a stalemate rather than referee it, so please think carefully and lay out your reasoning
  before you commit to a verdict.


  I''m not an academic. I write and certify control software for industrial machinery,
  and I''ve spent the last few years reading philosophy of mind on my own, mostly
  at night. I run a small reading group of six: two of us write software, one is a
  nurse, one teaches high-school physics, two are retired. We have spent months on
  the argument that mental states can''t be identified with brain states because the
  same mental state can be realized in physically very different systems — Putnam''s
  original point about octopuses and other creatures, and the versions since then
  involving imagined robot minds and giant populations of people organised to behave
  like a single nervous system. The identity theorists in the group have their replies
  ready: that a multiply realized property might be identical with a disjunction of
  physical properties; that on inspection the different realizers always turn out
  to share some deeper physical or functional feature, so the reduction can still
  be carried through; and that if mental properties really were realized by physically
  unrelated states, they would be left out of the causal story altogether and so wouldn''t
  be worth believing in. Both sets of replies have been made for decades. Nobody in
  the group, and as far as I can tell nobody in the literature, has moved.


  Here is my working hypothesis, offered as a hypothesis and not as something I''ve
  read anywhere: the dispute is stalled because both sides treat ''the same property''
  as if it were a two-place relation settled by the world, when in fact — this is
  how it works in my day job — realization is indexed to a purpose and to a set of
  failure conditions. On the bench, two components that are interchangeable in one
  circuit are absolutely not interchangeable in another, because they fail differently:
  one browns out gradually, the other latches into a stuck state. Which physical features
  of a component count as ''the function it realizes'' depends on which hazards you
  were asked to analyse. I suspect the same is true here, and that the identity theorist
  and the multiple-realizability theorist are answering different questions: one is
  asking whether psychology can be eliminated as an explanatory level, the other whether
  the world carves mental kinds at their joints. If so, each side''s central evidence
  is beside the point, and the argument has been running in circles for sixty years
  because it is missing an argument place.


  Do the following.


