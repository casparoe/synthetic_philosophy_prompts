  real damage. The genuinely damaging criticism is modal rather than relativistic:
  the variance decomposition from which heritability is computed does not license
  the counterfactuals that ordinary talk of "how much of the difference is caused
  by genes" seems to require.


  In developing the case, please do all of the following:


  1. Explain what is and is not invariant about the decomposition of phenotypic variance
  into additive genetic, dominance and epistatic, shared and non-shared environmental,
  interaction, and covariance terms when the distribution of environments, or of genotypes,
  is altered — and use this to specify precisely which counterfactuals fail.


  2. Show why gene–environment correlation and gene–environment interaction are worse
  problems than population-relativity: they do not merely index the components to
  a population but undermine the reading of the additive component as a separable
  causal contribution, since the assignment of individuals to environments is itself
  partly a consequence of their genotypes.


  3. Address the strongest available counterexample to your own thesis: narrow-sense
  heritability appears to license exactly one modal inference, namely the prediction
  of response to selection via the breeder''s equation. Explain why this prediction
  is genuine, and why its existence does not rehabilitate the broader causal talk.


  4. Conclude by stating what use of heritability survives once its modal ambitions
  are given up, and by evaluating the familiar illustration in which genetically diverse
  seed lots are grown in two trays, one favourable and one impoverished: does it demonstrate
  the relativistic point, the modal point, or neither?


