  Argue for the following thesis about heritability. The standard philosophical criticism
  of the statistic — that it is relative to a particular population in a particular
  range of environments, and so cannot support claims about other populations, about
  individuals, or about whether a trait is fixed — is, though correct, aimed at inferences
