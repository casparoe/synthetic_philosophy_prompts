  Where is the flaw? Several candidate diagnoses:

  - (1) is a false/oversimplified analysis: the legality principle isn''t only about
  notice. It''s also about constraining officials (separation of powers — the legislature
  vs. judiciary; preventing ad hoc punishment by whoever holds power), about equality/predictability,
  about democratic legitimacy (only the lawmaker can declare what''s criminal), and
  about the expressive function of law. So the "reliance" reading reduces a structural
  constraint to an individual epistemic condition, and that reduction is what does
  the damage.

  - Equivocation on "relying on the law": In (2)–(3), "took the law as a guide" means
  something like "regarded it as authoritative"; in (5) it slides to "was in a position
  to evade it." Someone who obeys the law out of fear or self-interest is relying
  on it; someone who knows the law and decides to break it is *not* relying on it
  in the sense of (2) but is *not* thereby a candidate for retroactive punishment
  — because they''re being punished for violating a rule that did exist. The argument
  conflates "not relying on existing law" with "not being covered by existing law."
  A rogue trader structures deals through a jurisdiction with no rules — that''s about
  a gap in coverage, not about reliance; and the retroactive rule you''d apply to
  him is a new rule, i.e., you''d be creating an obligation after the fact, which
  is precisely what (1) forbids for notice reasons he also lacks... hmm, careful.
  Actually the argument''s engine is: notice-based objection applies only to those
  who relied; powerful people didn''t rely; so no objection. The key slide is from
  "didn''t rely on the law" to "can''t complain about not having had notice" — but
  complaint about retroactive punishment doesn''t require that you actually relied;
  it requires that you were entitled to rely / that the system owed you a determinate
  rule. Also: the notice condition is about whether the law *made available* fair
  notice, not about whether the defendant *availed himself* of it. Waiver: you can''t
  forfeit a structural constraint by being clever.

  - Also (3) is questionable on the merits: some defendants did appeal to German domestic
  law and to the Führerprinzip as making their acts legal under the only law that
  governed them; and the argument''s own premise (3) says they knew their conduct
  was criminal under other states'' law and treaties — but crimes against peace (aggressive
  war) was arguably not criminalized as an individual-punishable offense in 1939;
  the Kellogg-Briand Pact outlawed war as an instrument of national policy but contained
  no penalty and no individual liability. So (3) smuggles in that the notice existed;
  whether it did is exactly the contested question (that''s the real crux — and if
  it did, then the argument isn''t about retroactivity at all but about enforcement,
  which undercuts (5)).

  - Distinguish: retroactive *criminalization* vs. retroactive *prosecution* of conduct
  already criminal (murder is criminal everywhere; the Nazi defendants were convicted
  of murder-type acts too under Control Council Law No. 10 in the subsequent trials
  / under domestic law). Also the distinction between "the acts were criminal under
  international law but unenforceable for lack of a tribunal" (Kelsen''s position-ish;
  more accurately, the view that the IMT supplied the missing sanction) and "the acts
  were not criminal at all."

  - Rejecting (1) costs: you lose the notice-based rationale, and you must explain
  why retroactivity is generally objectionable (and it is: it''s in Article 11(2)
  UDHR, ICCPR Art 15, ECHR Art 7, most constitutions, the US ex post facto clause)
  — and if you keep the principle as a structural constraint on officials, then you
  need a reason the constraint binds at Nuremberg, where the court *was* the officials
  of the conquering powers. That''s the hard cost: the structural reading makes Nuremberg
  worse, not better, since there was no independent legislature whose authority was
  being usurped — the four powers legislated and adjudicated. So the structural reading
  of (1) may force you toward the Radbruch/Kelsen moves or toward "the tribunal was
  constituting a new legal order and its legitimacy is political, not legal."

  - Rejecting (2)/(5) equivocation costs: you have to say what the notice condition
  really is (institutional availability of a determinate rule), and then you owe an
  account of whether such a rule was available in 1939 for aggressive war — and if
  you say "yes, via treaties and custom," then you''ve conceded that the trial wasn''t
  retroactive in the relevant sense, which weakens the drama but is fine; if you say
  "no," then you must explain why the prosecution was permissible anyway (necessity,
  the alternative being summary execution — the Churchill position; or that some acts
  were already murder).


