  Option A: Meno problem + "proves too much" argument. Classic: knowledge is more
  valuable than true belief because it''s tethered (the statues of Daedalus analogy).
  A "proves too much" argument: (1) True belief is instrumentally as good as knowledge
  in guiding action (Meno''s paradox resolution / the road to Larissa). (2) Anything
  added to true belief that makes it knowledge is either more true belief (impossible)
  or a non-truth-related property. (3) If knowledge''s extra value comes from a property
  that isn''t truth-conducive, then it can''t make the belief more likely to be true.
  (4) So knowledge is at most instrumentally better, and only insofar as it produces
  more true beliefs. (5) But by the same reasoning, a reliably produced true belief
  plus any further property... hmm. Actually the standard "value problem" (Kvanvig,
  Zagzebski, Jones) — the swamping problem. An argument that proves too much: the
  "swamping" argument generalizes to show that reliability adds no value over and
  above truth, which would imply that a reliably-produced true belief is no better
  than a luckily-produced one, and by iteration that no epistemic value beyond truth
  exists — which would collapse epistemology. Hmm, but this is somewhat standard.


