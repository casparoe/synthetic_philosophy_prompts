  - The regress argument (Agrippa''s trilemma / Münchhausen trilemma): for a belief
  to be justified, it must rest on reasons; each reason must itself be justified;
  this leads either to infinite regress, circularity, or an arbitrary stop (foundations).

  - Foundationalism: some beliefs are basic — justified non-inferentially. Classical/Cartesian:
  basic beliefs are infallible/incorrigible/self-evident. Modest/defeasible: basic
  beliefs have only prima facie or defeasible warrant (perceptual seeming, memory).

  - Coherentism: justification is a property of the whole system; no belief is basic;
  mutual support. Objection: the isolation/input objection (BonJour''s later move
  to include non-conceptual sensory input; foundherentism as a hybrid: Haack''s crossword
  puzzle analogy — experiential evidence as clues, other beliefs as intersecting entries).

  - Infinitism: reasons are infinitely many and never exhausted; Peter Klein''s defense;
  the key subtlety — the infinite chain need not be *actually held all at once*; reasons
  must be *available* to the subject, and Klein distinguishes infinitism from the
  requirement of having completed an infinite reasoning; also the "finite mind objection."

  - Externalism/reliabilism: a belief can be justified by being produced by a reliable
  process without the subject having accessible reasons — an escape route that rejects
  the internalist premise generating the regress (also: the regress may be blocked
  by non-doxastic items, e.g., facts or reliable processes).

  - Wittgensteinian hinge epistemology (On Certainty): some propositions are hinges,
  exempt from doubt; entitlement (Wright) — non-evidential warrant.

