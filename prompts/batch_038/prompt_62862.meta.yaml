  Let me also make sure the domain content is accurate enough:

  - Epistemicism (Timothy Williamson): vague predicates have sharp boundaries; we
  are ignorant of them; explains via margin-for-error principle against KK. Also "use
  theory of meaning" / the boundary is fixed by use in a way we cannot track.

  - Supervaluationism (Fine 1975 popularized; van Fraassen coined the term; based
  on earlier work): a statement is supertrue if true on all admissible precisifications;
  borderline statements are neither supertrue nor superfalse; classical logic (excluded
  middle) is preserved at the object level; "penumbral connections" (e.g., if a is
  redder than b, then not both a is orange and b is red) motivate global vs local
  evaluation.

  - Key difference relevant to adjudication: under supervaluationism, a board''s decision
  can serve as a stipulated precisification that makes a previously indeterminate
  case determinate going forward (and arguably retroactively?) — there''s literature
  on "the authority to precisify," e.g., Shapiro''s "Wanderings" / variegated truth,
  and the idea of a judge''s ruling as precisification. Also Kit Fine discussed stipulation.
  And there''s a well-known issue: supervaluationism combined with precedent creates
  a worry about "shifting" — since the precisification is legitimate, prior decisions
  might become false retrospectively? That''s a real theme (Fine on penumbra, "we
  can decide to make it so").

  - Under epistemicism, there is a fact of the matter whether the alteration was "significant"
  independent of the board; the board can be wrong; consistency across cases is not
  guaranteed to be possible at the boundary (there will be a last non-significant
  case and a first significant case, and similar cases can differ in truth); also
  the board cannot make it true by deciding.

  - An interesting implication: under epistemicism, "treating like cases alike" can
  require a decision that is false; the board''s search procedure can''t converge
  on the boundary (margin for error); whereas under supervaluationism, the board''s
  collective decisions can actually constitute the boundary, making consistency a
  matter of keeping within the same precisification.

  - Another: whether a member can truthfully say "this case is genuinely borderline"
  — under supervaluationism that''s a true report about the semantics; under epistemicism
  it''s not (there''s a fact, just unknowable), so "borderline" is an epistemic confession.
  Implication for how opinions should be written: an epistemicist judge shouldn''t
  write "this is a borderline case" as if that settles the outcome; she should write
  "we cannot tell where the line is," and then still must decide.

  - Another: higher-order vagueness. Supervaluationism has borderline-borderline;
  epistemicism doesn''t (no higher-order vagueness, just ignorance). Implication:
  whether the board needs a procedure for "very close calls" / a supermajority rule.

  - Another: retroactivity and notice/fairness — if the boundary is made by decisions,
  a landowner can''t have fair notice; if it''s found, then in principle they could
  have known but no one can. This bears on due-process-style arguments (void for vagueness).

  - Another: measurement analogy — under epistemicism, vagueness is like an unknown
  constant with no error bar; under supervaluationism, it''s like a quantity that
  isn''t defined until the measurement procedure is fixed. The retired scientist would
  love this.


