  Essay text:


  **Unspendable evidence: higher-order defeat and the revocation of licence**


  1. The case. You have spent the afternoon tallying ward returns in a local election
  with a colleague. There are forty-odd returns; you have added them twice and the
  total looks to you exactly right, and it shows your candidate ahead by a hundred
  and eleven votes. A supervisor then enters and tells you both that the tea urn in
  the counting room was mistakenly filled with water from a tank that had been treated
  with a sedative, that the sedative is known to produce small arithmetic slips, and
  — this is the part that stings — that those slips feel, to the person making them,
  entirely obvious and correct. Your colleague re-checks her own tally and finds two
  errors in it. You re-check yours. It still looks right; but of course it would.


  2. Three familiar responses. The steadfast response says that nothing about your
  first-order evidence has changed: the returns are what they are, they entail the
  total, and testimony about your own faculties is not testimony about the election.
  You should carry on believing your candidate won. The conciliatory response says
  that your total evidence now includes a proposition about your unreliability, and
  that this lowers the degree to which your evidence supports the conclusion; you
  should drop your credence substantially, perhaps to somewhere near the middle. The
  level-splitting response says you should do both at once: believe, on the first-order
  evidence, that your candidate won, and believe, on the higher-order evidence, that
  this belief of yours is irrational.


  3. A shared assumption. All three treat the question as though the agent had a single
  pool of evidence, and as though the only issue were how large a support relation
  that pool bears to the conclusion. The steadfast view says the higher-order material
  does not belong in the pool; the other two say it does. But the disagreement, I
  want to suggest, is generated by a picture on which believing well is a matter of
  tracking what one''s evidence supports, and on which evidence is either in play
  or not there at all.


  4. The proposal. Distinguish possessing evidence from being licensed to deploy it.
  Higher-order defeat of the kind in the case does not add countervailing evidence
  about the election, and it does not diminish the support that the returns lend to
  the total. It withdraws a permission. The returns remain excellent evidence for
  the conclusion, and they become, for you and for the next hour, unspendable: something
  you have and may not use. The sedative testimony does not bear on the election;
  it bears on your standing to reason from the returns.


  5. Why this dissolves the akrasia worry. The level-splitting view is thought to
  court a Moore-paradoxical predicament: believing p while believing that believing
  p is irrational. But the norm against akrasia is not plausibly a norm against the
  mere co-occurrence of two attitudes with those contents. It is a norm about basing:
  you should not hold a belief in a way that you yourself regard as contrary to your
  lights. On the licence view, when the permission is withdrawn the route is closed.
  You cannot form or sustain the belief by reasoning from the returns, because that
  is precisely what you may no longer do. If the belief nonetheless persists — as
  beliefs do, arriving by memory of a conclusion rather than by fresh inference —
  it is not held against your lights. It is held under lights you once had and that
  have since been withdrawn. That is a residue, not an akrasia, and it is criticisable
  in a different and much milder way: you ought to let it lapse, and you ought not
  to act on it, but you are not divided against yourself.


  6. A distinctive prediction. The licence view and the total-evidence view should
  come apart over restoration. Suppose the supervisor returns an hour later, embarrassed:
  the urn was fine, the treated water never reached the counting room, your colleague''s
  two errors were her own and pre-existing. On the licence view, your position is
  exactly what it was before the interruption. The returns never stopped supporting
  the total, and the permission to rely on them was never anything but suspended.
  Your belief is restored at once, and restored without re-investigation: you do not
  need to add the columns a third time, because nothing was ever subtracted. On the
  total-evidence view, by contrast, your evidence about the election was first weakened
  and then strengthened, and the fact that the weakening left no trace is a coincidence
  — a lucky cancellation between the discredit attaching to your arithmetic and the
  removal of that discredit. The licence view explains the asymmetry between withdrawal
  and restoration by saying that only one of them changed your position at all.


  7. Two worries I have not solved. First, notational variance. A total-evidence theorist
  will say that ''you possess E but may not deploy it'' is just a manner of saying
  that your total evidence, which includes the sedative testimony, does not support
  the conclusion to the degree that E alone would. If that redescription is always
  available, the licence view has added vocabulary, not content, and the asymmetry
  I pressed in Section 6 is one it can mimic: the cancellation is not lucky but structural,
  since the defeating material concerned only your faculties, and once it is gone
  nothing about the election remains on either side of the ledger. My inclination
