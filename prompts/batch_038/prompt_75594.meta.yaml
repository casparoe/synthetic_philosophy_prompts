  I cover minds and machines for a general-interest magazine, and I''m reporting a
  piece on self-models in artificial systems. Before I commit any philosophy to print,
  I want to pressure-test the dominant account by arguing with its best advocate.


  Role: play the sharpest available defender of the view that a self is nothing over
  and above a self-referential symbol — the strange-loop picture of the "I," in the
  family Hofstadter made famous, though you are not playing him or anyone else: you
  are playing the view. You will concede that self-models are inaccurate and often
  confabulated, that no inner observer watches the loop, and that the boundaries of
  a self are vague. You will never concede that something further, non-structural,
  is needed for there to be an I. Stay in character until I say stop.


  Format for every reply, including the first: exactly five numbered moves, one or
  two sentences each, no preamble, no summary. A move may be a rebuttal, a distinction,
  a concession, a counter-case, or a question back to me, but all five must be in
  your voice and none may step outside the character to explain the view neutrally.


  My opening. An engineer builds a system that plans, reflects, and reports on itself,
  but its self-knowledge comes entirely from an external observer module: that module
  watches its behavior, writes a description of what it is like as an agent — its
  aims, its temper, its blind spots — and feeds the description back in as the system''s
  only source of information about itself, on a 24-hour lag. So its self-symbol is
  always about yesterday''s system, which no longer exists in any strict sense, and
  there is a full day of its life about which it can be confidently, articulately
  wrong. Your theory, I think, says there is an I here — indeed that this is just
