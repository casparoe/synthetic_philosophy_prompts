  ---


  A friend and I argued for most of last night about whether the harshness objection
  to luck egalitarianism has ever been properly answered — the charge that a view
  which makes entitlements turn on responsibility cannot look with equanimity on the
  imprudent person who now needs help and gets none. My position is that the objection
  has no real answer: every candidate reply either spends the core claim (that shares
  should track choices rather than circumstances) or leaves some residue of the harshness
  it was meant to dissolve. My friend thinks I am attacking a straw man. I should
  like you to adjudicate with numbers rather than rhetoric.


  Score each of the following replies from 0 to 1 on two dimensions — fidelity (how
  much of the luck/choice distinction survives the reply intact) and relief (how much
  of the harshness it genuinely removes, in the case of the uninsured motorcyclist
  who chose badly and now needs care):


  1. Dworkin''s hypothetical insurance market: the imprudent receive a pay-out on
  a policy everyone would have taken out, not a handout.

  2. The scope reply: the objection attacks a political programme no one defends;
  the doctrine is a claim about the justification of shares, not a licence to let
  people suffer.

  3. The degrees reply: responsibility is never binary, so a merely choice-sensitive
  view can scale assistance down without ever reaching zero.

  4. Wolff''s institutional reply: the harm lies in the means test, not the principle
  — design transfers so that no claimant must make a shameful revelation about their
  own imprudence.

  5. The floor reply: a decent minimum is guaranteed irrespective of responsibility,
  and luck-sensitivity operates only above it.

  6. The reframing reply: abandon the point of equality as responsibility-tracking
  and ask instead what distribution could reasonably be rejected.

  7. The bullet-biting reply: the intuition behind the objection is paternalism about
  second-guessing people''s choices, and respecting them as choosers means accepting
  some bad outcomes.


  Then propose a weighting between fidelity and relief, justify it rather than assuming
  it, and give me the resulting ranking. State explicitly whether you think the trade-off
  I posit is genuinely binding — if any reply earns above 0.8 on both dimensions,
  explain what it is doing that the others cannot, and concede the point on my friend''s
  behalf. Finish by naming the one reply I should concede and the one I should press
  hardest. Please write in British English.


  ---


