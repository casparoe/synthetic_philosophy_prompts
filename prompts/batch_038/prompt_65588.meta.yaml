  Design: Role-play type, domain = Berkeley''s views on money. Casual British English,
  a typo or two allowed.


  Prompt content:

  - Ask model to play Berkeley, circa 1737, Bishop of Cloyne, in the middle of his
  campaign for an Irish national bank.

  - Constraints: stay in character, first person, period vocabulary (1730s); may not
  use concepts he wouldn''t have (no fiat currency theory, no velocity of money as
  a term — well, "circulation" is his own); if he needs a fact about the modern day,
  ask; keep replies to a paragraph or two; concede small points but never the core
  thesis that money is nothing in itself but a ticket that sets labour in motion;
  do not break character or start lecturing about how Berkeley is usually read; don''t
  cite modern scholars.

  - Also: he should answer as a philosopher (his immaterialism could be drawn on,
  but don''t overdo it) — nice angle: the asker can push the link between his metaphysics
  and his monetary theory. Actually a great niche injection: is the money-as-ticket
  view an application of his idealism (value as a relation of proportion, not an intrinsic
  property) or is it independent? And the challenge: his own query says value is a
  compound proportion of demand and plenty, so multiplying tickets should just change
  the proportion, i.e. prices — where does the extra industry come from? Transmission
  mechanism.

  - Also a second tension: query 22 says less money swiftly circulating equals more
  money slowly circulating — so why fight for more notes? And query 26 says if denominations
  were retained though the bullion were gone, industry could still be promoted — so
  why insist the notes be secured on land rather than just on the public''s confidence?
  (Berkeley''s bank was to be secured on land/stock, with notes exchangeable for land
  rather than specie, I believe.) I''ll phrase this as the asker''s own description
  without quotes and let Berkeley correct me if wrong — that''s nice and safe: "if
  I''ve got your scheme wrong, tell me so as Berkeley would".

  - Include the asker''s opening move: a sharp, concrete challenge.


  Length/format instructions: replies of a paragraph or two, in character, no stage
  directions maybe allow minimal. Ask it to end each reply with either a concession,
  a riposte, or a counter-query in his own style (queries are his native form!) —
  that''s a nice touch: Berkeley argued in queries, so require him to sometimes fire
  queries back. Good.


  Let me also allow: "you can break character only if I say ''stop''".


  Write it casually, British spelling (labour, cheques, realise, -ise), one or two
  typos (e.g., "alot"? better subtle: "recieve" or a doubled word or "your" for "you''re").
  Keep it readable.


  Draft:


  ---


  Can you play Berkeley for me — George Berkeley, Bishop of Cloyne, sometime in 1737,
  deep in his campaign to get a national bank established in Ireland? Not Berkeley
  the immaterialist doing party tricks; Berkeley the political economist of the Querist,
  who thinks money is nothing in itself and only matters as far as it stirs up industry.


  Rules for the character:

  - first person, throughout, and stay in it until I say ''stop''.

  - you may only use what an Irish bishop of the 1730s could know: your own queries,
  the state of Irish coinage and the drain of money to England, the practice of banks
  and credit you''ve read about. If I mention something from later (say, a central
  bank''s balance sheet or a modern currency) ask me to explain it as Berkeley would
  ask a traveller, then use it.

  - you will concede minor points freely — you''re not above admitting a query of
  yours was badly worded — but never the main thesis: that the true idea of money
  is that of a ticket or counter, and that wealth is labour, not metal.

  - answer in a paragraph or two, like conversation, not a treatise. You may fire
  queries back at me in your own manner; that''s the whole point.

  - don''t tell me how Berkeley scholars usually read this, and don''t break character
  to hedge.


  Here''s my opening move. You ask in the Querist whether money be not only so far
  useful, as it stirreth up industry, enabling men mutually to participate the fruits
  of each other''s labour. And you ask whether less money swiftly circulating be not
  in effect equivalent to more money slowly circulating, and whether the nation can
  then be a loser. Fine — but then you spend years badgering the Irish parliament
  for a bank that will pour out a new flood of paper notes, secured on land rather
  than on bullion, and you insist Ireland''s misery comes from a want of money. If
  the quantity doesn''t matter provided the circulation does, why do you want more
  tickets? And if it does matter, how? You also hold that the value or price of things
  is a compounded proportion, directly as the demand and reciprocally as the plenty
  — so doubling the counters in the country looks like it should just halve what each
  one buys and leave every Irishman exactly as idle as before. Tell me the mechanism
  by which your new paper actually gets a peasant in Cork to grow more potatoes and
  a weaver to work more hours, rather than merely making bread cost twice as many
  shillings. And if the answer turns out to be that the notes work on men''s appetites
  and expectations — that they create wants — then I want to know whether money for
  you is a medium of exchange at all, or just a device for manipulating the will,
  in which case your bank looks less like a mint and more like a pulpit.


