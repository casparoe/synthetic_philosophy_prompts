  I teach history at the comprehensive in a fairly small market town, 22 years now,
  and in November I have to give the address at the rededication of our war memorial.
  Background, because the speech only works if it''s honest about how we got here.


  Our memorial has 84 names from 1914-18. Last year I led a campaign to add a plaque
  that named the governments responsible for the war — not in some hedged "everyone
  was responsible" way, but specifically the decisions taken in Vienna and Berlin
  in July 1914, and specifically the annexation aims the German leadership went after
  once the war had started. I spent four years reading about this and I think the
  case is strong, roughly what Fritz Fischer made in the sixties, though I''m not
  asking for a seminar about him or anyone else.


  The parish council voted 6-5 against naming anybody. The plaque they approved says:
  "In memory of the eighty-four people of this parish who died in the war of 1914-1918.
  No one here chose it. No one anywhere should have."


  Which is the thing I can''t stand about it. The second sentence has no subject.
  Somebody did choose it, choosing is the only thing that responsibility can attach
  to, and the plaque''s grammar is exactly the argument I lost. But I''m still the
  one asked to speak, partly because they want the fight to look over.


  Who''s there: maybe 150 people, outdoors, in the wind — families with names on the
  stone, the Legion, a couple of dozen of my own students, about twenty people who
  signed the petition and are still angry, and a delegation from our twin town in
  Nordrhein-Westfalen whose mayor speaks right after me. Also in the front row: the
  granddaughter of a German-born woman who ran the bakery on the high street for thirty
  years and was taken away as an enemy alien in 1914 and never lived here again. Her
  family backed my campaign and thinks the compromise plaque is cowardice, so I can''t
  comfort them with softness. And I can''t not face the fact that the same logic I
  was pushing — this nation is the responsible party — is the logic that put a woman
  in a van because of where she was born. That''s the objection in the room I actually
  have to answer, not dodge.


  So write the speech. It needs to:

  - run about 6 or 7 minutes, spoken aloud, in a place where nobody wants a lecture;

  - make a real responsibility claim — that nations and governments are the right
  kind of thing to hold responsible, and that in this case the responsibility is not
  spread evenly — without using the word "guilt" at any point. That word is radioactive
  here: the people who beat me ran on the line that naming Germany would be the treaty
  article about Germany and her allies all over again, and I don''t want to hand them
  that;

  - carry the substance of the July 1914 decisions and the war aims without naming
  a historian, a book, a document, or a date-heavy timeline. Concrete plain-English
