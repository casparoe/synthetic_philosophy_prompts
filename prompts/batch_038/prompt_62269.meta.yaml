  A conventional defective artefact satisfies both, at least in principle. If a brake
  assembly fails or a drug produces an unlisted reaction, we can identify a decision
  and examine it: was the testing adequate, were the warnings sufficient, was the
  risk known or knowable? A system that goes on learning after it has been deployed
  removes the object of that examination. Its conduct in the fourteenth month is a
  function of the environments it has met, the data it has accumulated, and the modifications
  it has undergone — none of which its designer selected, and none of which, at the
  time of design, there was any determinate fact about. What the designer chose was
  a process, not a disposition. The epistemic condition therefore fails, and it fails
  in an interesting way: not because the designer neglected to look, but because there
  was nothing there to look at.


  The control condition fails for the user rather than the designer. A supervisor
  who can intervene retains a formal power of interruption, but a switch that can
  only be thrown once the harm is under way is not control of the harm. And this is
  why the gap is said to be new rather than old: it is not that the harm is unattributed,
  but that there is no agent to whom it could be attributed even in a world of complete
  information."


