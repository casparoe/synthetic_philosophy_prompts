  Student answer draft:


  "(a) The MCE objective picks the reward function under which the observed trajectories
  are the most likely, but ''likely'' is defined in a particular way. Instead of assuming
  the demonstrator picks the single best trajectory, it assumes they sample trajectories
  from a distribution proportional to exp of the total reward, so better trajectories
  are more likely but bad ones aren''t impossible. The entropy term is what makes
  that distribution the one it is: maximizing the causal entropy of the trajectory
  distribution subject to matching the feature counts we observed gives exactly this
  softmax form. It''s called causal rather than plain entropy because the state occupancy
  depends on the policy, so you can''t just take the entropy of a fixed distribution
  over states — you condition the future on the past actions. In practice the gradient
  of the log-likelihood is the observed feature counts minus the expected feature
  counts under the current reward, and computing those expectations means solving
  a soft-RL problem in the inner loop at every gradient step, which is why this is
  expensive.


  (b) The reward is not unique because lots of different reward functions produce
  the same behavior. The standard way to say this is that R is only recovered up to
  a positive affine transformation: aR + b, a > 0, gives the same optimal policy,
  since multiplying by a positive constant and adding an offset doesn''t change an
  argmax. So there''s a whole family of rewards consistent with any amount of data,
  and the ambiguity doesn''t get resolved by collecting more demonstrations — with
  a lot of data you converge to the reward, but only up to that scale-and-shift freedom,
  which is harmless because anything downstream that just picks the best action can''t
  tell the difference. The feature basis also matters: if you only give the model
  a coarse set of features, two genuinely different preferences can look identical
  because the difference isn''t representable, but that''s a problem with the features
  rather than with IRL.


  (c) I mostly agree with the colleague. Because MCE treats the demonstrator as boundedly
  rational rather than assuming they''re optimal, it doesn''t force our own notion
  of a good trajectory onto the data, and it lets the human be noisy without concluding
  that they want something else. That''s basically the position Stuart Russell argues
  for, that a machine should stay uncertain about the human objective and defer to
  the human rather than optimizing a fixed hand-written utility; the entropy term
  is what expresses that uncertainty about what the reward is. What I''d push back
  on is the phrase ''what people actually want.'' The reward you recover is whatever
  rationalizes the behavior given the dynamics you assumed and the discount you chose,
