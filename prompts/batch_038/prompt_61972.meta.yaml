  Draft:


  "I am grading short-answer responses for an upper-level undergraduate seminar on
  free will and punishment. Below is the exam question, followed by one student''s
  response. Please grade the response on a 10-point scale and give me the comments
  that justify the grade: a point-by-point assessment that identifies each substantive
  claim the student makes, says whether it is accurate, and where it is inaccurate,
  states what the correct account is and how consequential the mistake is. Please
  flag in particular any place where the student''s framing quietly collapses a real
  disagreement between the two authors or attributes to either a view they do not
  hold, and note separately which parts of the response would earn credit from a grader
  who was reading quickly. Write in American English.


  Question: Both Daniel Dennett and Gregg Caruso reject retributivist punishment,
  and both are willing to justify incarceration on grounds that look like incapacitation.
  Explain why they nevertheless disagree about just deserts, what each thinks survives
  of desert-talk, and what turns on the disagreement.


  Student''s response: [~400 words]"


  Now the student response. Write it as a plausible B+/A- answer with two subtle errors.


  Student response draft:


  "Both Dennett and Caruso reject retributivism in its pure form: neither thinks that
  making an offender suffer is good in itself or that offenders are owed suffering
  simply because of what they did. Both also accept that dangerous people may be restrained
  for the protection of others, and both would support a penal system that is far
  less punitive than the one the United States currently has. So their disagreement
  is not about how much punishment is justified but about what makes it justified.


  Dennett is a compatibilist. He holds that determinism is true — human behavior,
  like everything else in nature, is the product of prior causes, and neuroscience
  has made this increasingly hard to deny — but argues that this does not threaten
  responsibility, because responsibility requires only the capacities that evolved
  creatures like us actually have: the ability to anticipate how others will respond
  to our behavior, to control ourselves in light of those expectations, and to give
  and ask for reasons. On Dennett''s view, holding people responsible is a social
  technology that makes them better at these things, and so the practice of blaming
