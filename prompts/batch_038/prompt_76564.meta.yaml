  impressions — and that''s a *negative* trait. So the taboo isn''t arbitrary. A good
  answer should carve: "deniable signaling," "modesty norm," "avowal taboo," "second-order
  signaling / signaling about being a non-signaler," "countersignaling," "self-deception
  as a signaling device (Trivers)," "Bourdieu''s denegation," "Veblen''s canon of...
  " hmm, Veblen: conspicuous consumption must be presented as taste, not as display?
  Actually Veblen thinks display is fairly overt.


  Second wrinkle to inject (to make it not fit any established concept cleanly): The
  cost escalates *because* the audience''s suspicion escalates — i.e., there''s an
  arms race in deniability itself. As more people do the impressive thing, the impressive
  thing stops being evidence of the disposition and starts being evidence of conformity;
