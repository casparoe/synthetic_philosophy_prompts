  Core phenomenon: A costly act whose signaling value depends on the actor''s sincere
  belief that they were not signaling — and, critically, the value is destroyed by
  *public acknowledgment* even among those who already know. Plus: the audience''s
  admiration is directed at the *disposition*, and acknowledging intent converts the
  act from evidence of disposition into evidence of calculation, which is a different
  (and less valued) trait.


