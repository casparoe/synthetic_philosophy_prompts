  Let me think about where the literature actually presses on the handicap principle:

  1. Zahavi''s original formulation vs. Grafen''s formal model — Zahavi claimed the
  handicap must be *wasteful* and that only honest signals survive; Grafen''s 1990
  model showed condition-dependent signaling can be honest, but Zahavi thought Grafen''s
  model wasn''t a true handicap (there''s a known dispute: Zahavi insisted on "handicap
  as a test of quality" and criticized Grafen''s model). A defender of the strict
  Zahavi version faces: what''s the difference between a true handicap and a mere
  index/condition-dependent signal?

  2. The distinction between handicaps and indices (Maynard Smith & Harper; "indices"
  cannot be faked because they''re physically tied to quality) — a key pressure point:
  many supposed handicaps are indices.

  3. The receiver''s psychology: the handicap works only if receivers have a pre-existing
  preference; then it''s Fisherian runaway / sensory bias — the arbitrariness problem:
  why this particular costly trait?

  4. Cost in what currency, and the "marginal cost" requirement (cost must be differentially
  greater for low-quality signallers — the "single-crossing"/Spence condition). Big
  pressure point: many biologists note that the *essential* requirement is differential
  marginal cost, not absolute waste.

  5. Human applications: religion (Sosis''s costly signaling theory of religious rituals
  — the "communal ritual" data on commune longevity), charity giving, art, humor,
  risk-taking. Pressure points: costly signaling vs. costly *screening*; the problem
  that human observers can''t calibrate cost; the "countersignaling" phenomenon (Posner)
  where high-quality types don''t signal at all.

  6. Conspicuous waste vs. Veblen: is the waste itself the signal or the ability to
  waste?

  7. The "who pays" problem and the possibility of faking with subsidies (e.g., a
  poor person buying a luxury car on credit — signaling can be faked if costs are
  deferred or externalized).

  8. The honesty-enforcement issue: punishment/audience.


