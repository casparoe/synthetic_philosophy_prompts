  "I have been assembling a list of historical analogies used in foreign-policy argument,
  together with my own judgments about which are warranted and which are not. My difficulty
  is that the judgments do not sort along any obvious line — they do not track surface
  similarity, they do not track how recent the source case is, and they do not track
  whether the source case ended well or badly. I want a principle, or a small set
  of competing principles, that reproduces the pattern, and I want to know where the
  pattern itself has to give.


  Here are the verdicts.


  1. Munich 1938 as applied to Vietnam in 1965 — unwarranted. The analogy carried
  with it a claim about the opponent (Hanoi as an expansionist power whose appetite
  grows with concession) that the source case could not support, and it treated a
  civil conflict in a former colony as though it were a great-power territorial revision
  in the heart of Europe.

  2. Munich 1938 as applied to Russia''s 2008 war in Georgia and then to Crimea in
  2014 — warranted, or at least considerably better than the Vietnam use. Same mechanism:
  unopposed seizure of territory followed by a larger seizure, with the intervening
  period used to consolidate.

  3. Vietnam as a cautionary analogy for Iraq in 2003 — warranted, even though almost
  no surface feature matches: an open-ended occupation, a political settlement dressed
  as a military objective, no defined exit. The similarity that does the work is in
  the structure of the commitment, not in the description of the war.

  4. The Anglo-German naval rivalry of the 1890s–1914 as a model for US-China competition
  today — unwarranted. This is the case that troubles me most, because the surface
  match is the closest on the list: a rising power challenging an incumbent, a naval
  buildup, an anxious established hegemon. But the source case''s war depended on
  rigid alliance commitments, mobilization timetables that outran political decision-making,
  and the absence of any credible second-strike deterrent, none of which is present.

  5. The same source case — the summer of 1914 — as a model for India and Pakistan:
  warranted. Short decision times, pre-delegated launch authority, a triggering event
  in contested territory, third parties pulled in by alliance-like commitments.

  6. The printing press as a model for the internet and social media: warranted, despite
  the absence of any shared political structure. When the cost of reproducing and
  circulating text collapses, the gatekeeping authority of established institutions
  collapses with it, and the adjustment takes generations.

  7. The 1939–40 Winter War as a model for the 2022 invasion of Ukraine: warranted
  and, unusually, predictive. The same aggressor, the same declared rationale about
  buffer security, the same underestimate of local resistance — the analogy named
  the failure mode before it happened.

  8. The domino theory applied to Southeast Asia after 1954: unwarranted as description.
  The cascade stopped short of Thailand, Malaysia, and Indonesia. But I do not want
  to file it as simply false, because the belief in the cascade generated the policy
  that in turn produced much of what actually happened.

  9. Comparing a public university''s budget shortfall to a sovereign debt crisis:
  unwarranted, though the arithmetic is identical. One has an electorate and a currency;
