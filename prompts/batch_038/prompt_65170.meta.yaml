  convergence is achieved not by shared conventions but by shared capacity + the interpreter''s
  own prior theory being adjusted; the case is not a limit case but the normal case
  exaggerated — malapropisms and idiolect drift are ubiquitous; charity still holds
  because what''s preserved is not sentence-meaning identity but the speaker''s holding-true
  attitudes and the world. And also: predictive success without systematic type-meaning
  assignment is impossible for a creature that could not be interpreted at all — the
  notebooks presuppose interpretation.


