  Standard toolkit (Parfit, Arrhenius, Broome, Blackorby et al.):

  - Total view: betterness = sum of well-being.

  - Average view: betterness = mean.

  - Critical-level views: each life contributes (w - α) where α > 0 (a "critical level"
  above the zero level of a life worth living). This avoids the repugnant conclusion:
  adding lots of barely-positive lives makes things worse.

  - Critical-range views: lives within a range [α_low, α_high] are neither good nor
  bad to add — incommensurability/imprecision.

  - Number-dampening / diminishing marginal value of numbers: value = f(n) * average,
  with f concave.

  - Person-affecting restriction: an outcome can''t be better than another unless
  it''s better for someone.

  - Maximin/leximin: focus on the worst off.

  - "Variable value" views: value of adding a person depends on the well-being level
  of existing people.


