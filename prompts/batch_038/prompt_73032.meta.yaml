  ---


  I write about the science of belief and the philosophy of religion for a general-interest
  science desk, and for the past year I have been reporting on the hiddenness argument:
  the inference that runs from the claim that a perfectly loving God would want a
  personal relationship with every person capable of one, through the claim that such
  a relationship requires the person to believe that God exists, to the observation
  that some people are capable of that relationship and have never resisted it yet
  do not believe, and thence to the conclusion that no perfectly loving God exists.
  Since J. L. Schellenberg set it out three decades ago, the argument has been restated
  by its author and answered by a fairly stable set of replies: that relationship
  does not in fact require propositional belief, or requires only something weaker
  such as trust or a willingness to be addressed; that God might have reasons to withhold
  evidence that would otherwise be overwhelming, including reasons bound up with the
  moral formation of the person; that resistance can be unconscious, so nobody is
  in a position to say from the outside who the nonresistant nonbelievers are; and
  that if the argument worked it would also undercut the grounds on which many believers
  take themselves to be in relationship with God at all. As far as I can tell, no
  one has moved, and the author has not conceded a premise.


  I expected the impasse to sit where the problem of evil''s does — in disputes about
  how much we can know of God''s reasons. Having read the exchanges twice and interviewed
  people on both sides of the pews, I now doubt that this is the main fault line.


  Here is material that I do not think has entered the literature in this form. ...
  [Group A / Group B]


  Then hypothesis, then the ask.


  Let me write the reporting material:


  Over eighteen months I interviewed two groups whose testimony is phenomenologically
  near-identical and whose self-descriptions are opposite. The first: people who left
  committed Christian practice after years of what they describe as sincere seeking.
  Almost all of them say the last phase of their belief was characterised by prayer
  that felt unanswered, by a sense of talking into a room, and by the absence of any
  particular piece of counter-evidence; several say they cannot identify a moment
  of decision, only a fade. When I asked whether they had believed God existed during
  the last year before the fade, roughly half hesitated, and two said they thought
  they had gone on assenting to the proposition for months after it had ceased to
  organise anything in their lives. The second group: retreat directors in a Carmelite
  contemplative tradition, several with thirty or forty years of practice, who describe
  long stretches in which God is entirely absent — no consolation, no sense of presence,
  no answer — but who reject, sometimes emphatically, the description of themselves
  as nonbelievers during those stretches, insisting that what was missing was experience
  and not belief, and that belief for them names a standing orientation of the will
  towards God rather than a felt state or a disposition to assent.


  Now here is what I find striking: the two groups'' first-person reports are close
  enough that I could have swapped transcripts without a reader noticing. Yet one
  group counts itself as having come to lack belief without ever having resisted,
  and the other counts itself as never having lacked belief at all. Which suggests
  that the parties to the philosophical debate are not merely disagreeing about God''s
  reasons; they are quantifying over different populations when they say "there are
  people who do not believe that God exists", because they are operating with different
  criteria for who falls under that description — avowal, felt presence, disposition
  to assent, orientation of the will — and the argument''s crucial datum is supplied
  by whichever criterion is chosen.


  My hypothesis, offered as a hypothesis to be tested rather than defended: the disagreement
  is not primarily probabilistic, and not primarily about the second premise''s modal
  status, but about what kind of state belief that God exists is supposed to be. If
  that is right, the central claim of the argument and the central objection to it
  may not be contradictories at all, and the thirty-year stalemate would be less a
  sign that the question is hard than a sign that two different questions are being
  asked under a single sentence. I may of course be wrong: it may be a straightforward
  dispute about how much we can infer concerning God''s reasons; or a classification
  problem that is genuinely intractable, since no third-person method sorts the sincere
  seeker from the self-deceived one; or the two sides may simply be answering different
  questions — one about whether theism is probable, one about what the experience
  of religious absence means — that have been filed under the same heading.


  What I want from you is a diagnosis, not a verdict on theism and not a survey of
  the argument and its replies. Tell me which kind of disagreement this actually is,
  using what each side says and does: where the fault line runs, whether it is verbal
  or substantive, whether some hidden empirical question (about belief, about the
  reliability of avowal, about the phenomenology of absence) is doing the work, whether
  the impasse indicates an ill-posed question or merely a hard one, and whether my
  interview material tells for or against each candidate diagnosis — including the
  possibility that it is journalistically evocative and philosophically inert. Then
  tell me what would count as progress on your diagnosis: a distinction, a reformulation,
  a change of question, an empirical protocol, a formal result about the probabilistic
  structure of the inference, or nothing at all. If nothing would move it, say so
  plainly and explain why the debate persists nonetheless. Please write in British
  English.


