  Design: I''m a fourth-year philosophy PhD student whose department runs a required
  interdisciplinary module for a joint cognitive-science/neuroscience MSc cohort —
  or better, the twist: a session in a sleep-medicine teaching program? Let''s go
  with: a 50-minute guest seminar for first-year graduate students in a Cognitive
  Science program (mixed: neuroscience, psychology, CS, a few philosophy), who have
  all just had two weeks on sleep physiology (staging, REM, awakenings) and who will
  have been told that dreaming is a kind of hallucination. That gives a rich misconception
  set: they think the question is empirically settled by dream-report frequency and
  by REM correlations.


  Additional specificity constraints that make it non-regurgitable:

  - No slides; whiteboard only; the room has no projector (or they want it deliberately).

  - The session is assessed: students will later be asked to write a short methods
  critique — so the plan must set up that transfer.

  - The asker has an idiosyncratic commitment: they don''t want to present the debate
  as "philosophers vs. scientists," and they want to end with the students holding
  both views as live.

  - The asker has decided to lead with the convergence (that Malcolm and Dennett reach
  similar conclusions from utterly different premises) rather than with the disagreement
  — and wants the plan to check whether that''s right.

  - The asker wants to know what to leave out: private language argument, multiple
  drafts model, lucid dreaming eye-signal data, dream bizarreness statistics.


