  during REM (e.g., incorporating a real sound into the dream), and the fact that
  awakening subjects mid-REM often report an in-progress scene that continues if they
  go back to sleep. Also "the dream lag effect". I should keep the empirical claims
  modest and defensible:

  - Dream reports are far more frequent and longer after REM awakenings than NREM
  awakenings. (well established)

  - Some subjects report dream duration that roughly matches the elapsed REM period.
  (Dement & Kleitman)

  - Dream content sometimes incorporates real stimuli presented during sleep. (well
  established, though contested as to frequency)

