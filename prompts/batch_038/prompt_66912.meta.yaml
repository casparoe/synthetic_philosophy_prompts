  Let me also include the interesting deep structure: the debate turns on the grammar
  of memory reports — you must first get the students to see that "I dreamt that p"
  looks like a memory report of an experience, and that both Malcolm and Dennett deny
  this but for different reasons: Malcolm because the concept of a dream has no experiential
  criteria (and the sentence isn''t false, it just isn''t an experience report); Dennett
  because there is no reason to posit a real-time experienced episode when the content
  could be composed on the spot at waking, and because he has independent reasons
  (the Multiple Drafts / no Cartesian theatre) to reject "experience" as an explanandum
