  a session in an interdisciplinary "Consciousness" course populated mostly by neuroscience/cognitive
  science undergrads who have already had one lecture on REM sleep and dream recall.
  The single example to carry the debate: the Maury guillotine dream vs. Dennett''s
  waterfall variant. The dependency structure: you have to get them to see that the
  question isn''t "are dreams vivid?" but "is a dream report a memory report?" — which
  requires first establishing what a memory report presupposes (an event that occurred
  at a determinate time). And the empirical hook: the Dement-Kleitman correlation
  between dreamed duration and REM period length, which seems to refute Dennett —
  but Dennett has a reply (the correlation could be produced by a retroactive construction
  anchored to the awakening, or by confabulation of duration). Then there''s the further
  question of whether Malcolm''s argument, if sound, is too strong — it would prove
  that no one ever dreams, which is absurd; Malcolm''s response is that the sentence
  "I dreamt that p" is true but not because an experience occurred.


  Misconceptions to head off:

  1. "Malcolm is denying that people dream / that dream reports are true." He isn''t;
  he''s denying that the grammar of dream reports is that of experience-reports.

  2. "Dennett says dreams don''t happen / are fake." He says the content is composed
  at (or near) waking — a "retroactive insertion" — but the question of whether there''s
  *something it''s like* during REM is different.

  3. "The EEG settles it — we can see dreaming." Category error: neurophysiological
  signature ≠ phenomenology; also the difference between REM and dreaming (dream reports
  from NREM ~50-70%).

