  **Dirty Hands Without an Audience: Remorse as the Second Stage of the Act**


  The debate about dirty hands has settled into a fairly stable shape, at least as
  the terms of the paradox go. A political agent confronts a situation in which the
  only available means of securing something of real moral importance — averting an
  attack, holding together a coalition without which a peace settlement collapses
  — requires him to do something that is, by any ordinary reckoning, wrong: to authorise
  an interrogation that amounts to torture, to deceive people whose trust he holds,
  to betray a promise on which someone''s fate depends. He does it. Walzer''s contribution
  was to insist that we not tidy the situation up in either direction. The agent was
  right to act as he did, and he is nevertheless properly judged for having done it;
  his having been right does not render him innocent. The standard formulation of
  the puzzle is that one and the same act appears to be both required and forbidden,
  and the various responses on offer — role morality, threshold deontology, the claim
  that the puzzle is merely verbal — are attempts to break the apparent contradiction.


  My proposal is that all of these responses share an unstated assumption: that the
  moral assessment of the dirty act is complete at the moment of acting. Once the
  deed is done, on this picture, there is a fixed moral fact about it, and everything
  that happens afterwards — the agent''s anguish, his resignation, the tribunal, the
  memoir — is merely commentary on that fact. I want to deny this. On the account
  I shall sketch, the residue that dirty hands theorists make so much of is not evidence
  left over from a completed wrong. It is the second stage of the wrong itself.


  Consider what the residue is supposed to do. Almost nobody in this literature thinks
  the anguished statesman is innocent; the anguish is precisely what makes him neither
  a monster nor a saint. But then we should ask what work the anguish is doing, and
  the answer suggested by the cases is that it is doing moral work, not merely expressive
  work. Contrast two officials who authorise exactly the same thing. The first is
  visibly marked by it: he does not enjoy the discretion his office gives him, he
  insists that the decision be recorded in his own name, he resigns when the necessity
  has passed. The second is entirely untroubled; he regards the episode as a technical
  success and mentions it only when it is useful to do so. We do not merely find the
  second man less likeable. We think something further has gone wrong in his case,
  and we think it has gone wrong in the act, not only in the character. My suggestion
  is that this is because the act is incomplete.


  On the account I am proposing, then, a dirty-hands situation calls for a two-stage
  performance, and both stages belong to the thing that morality requires. Stage one
  is the transgression: the lying, the betrayal, the authorised cruelty. Stage two
  is the agent''s submission to condemnation and the community''s supply of it — the
  accounting, the naming, the punishment where punishment is appropriate, the refusal
  to let the matter be folded silently into the general business of governing. What
  is required, all things considered, is the transgression-plus-reckoning package;
  what is forbidden is the transgression taken on its own. The paradox dissolves because
  there is no single act of which we must say both that it is required and that it
  is forbidden.


  This has three consequences I find attractive. First, it explains why the unrepentant
  agent is worse than the anguished one without our having to say that two men who
  did the same thing committed different acts. Second, it explains the peculiar character
  of exposure. A covert operation that is later revealed feels worse than one that
  never comes to light, even though, on a view that fixes the moral facts at the moment
  of acting, discovery cannot change anything about them. On my view, discovery does
  change something: it makes the second stage possible, and until it is possible the
  wrong is unfinished. Third, it makes sense of why we think the community shares
  the taint. The second stage is not something the agent can perform alone; a resignation
  that nobody accepts, an apology issued into a vacuum, does not complete the transaction.
  If the community declines to supply condemnation — because it finds the transgression
  too useful, or too embarrassing, to examine — it becomes a party to an incomplete
  act, and that is what the talk of shared dirt is gesturing at.


  Two difficulties occur to me and I have not resolved them. The account seems to
  make the wrongness of an act partly a matter of how things go afterwards, which
  sits oddly with the idea that a wrong is something an agent does. And it seems to
  imply that a convincingly staged performance of remorse, delivered by an agent who
  feels none, could complete the second stage just as well as the real thing; but
  if that were so, the account would make sincerity irrelevant to a process that appears
  to be about sincerity. I mention these as places where I suspect the view needs
  help rather than as objections I think decisive.


