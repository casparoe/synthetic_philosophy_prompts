  ---

  Background: I''m a retired comparative physiologist — 35 years of sensory electrophysiology
  in coldwater fish, mostly recording from cranial afferents — and since I stopped
  going into the lab I''ve gotten way into philosophy of mind and animal ethics. I
  now do a small podcast, basically me and a borrowed mic in the spare room. My guest
  next week is a philosopher of biology who argues that teleost fish AND decapod crustaceans
  are sentient, and specifically that we''re already past the point where the evidence
  justifies treating them as such for regulatory purposes, even though she openly
  says the metaphysics of experience isn''t settled. Her evidential basis is behavioral-criteria
  stuff: motivational trade-offs, prolonged site-directed rubbing/grooming after a
  noxious stimulus, learned avoidance that persists, response to analgesics, and preference
  tests. She thinks arguments that fish or shrimp can''t feel anything because they
  lack some particular piece of neural hardware beg the question.


  Here''s where I''m coming from and why I need help: I spent part of my career on
  exactly the kind of data she leans on, and I never got anywhere with it philosophically.
  In my own recordings from trout almost everything was in the myelinated conduction-velocity
  range — I know people have since reported slow units, so I don''t want to hang the
  interview on that — but I also can''t shake the sense that the criteria list was
  built out of vertebrate pain science and is now being exported to animals whose
  nervous systems are organized completely differently. And I don''t want to run a
  hit piece. I want her to get a fair, hard shaking.


  Write me ten to twelve questions... [list topics with follow-ups]


  ---


  Topics to demand:

  1. the analgesic-response question: why does morphine/analgesia responsiveness show
  experience rather than modulation of a nociceptive reflex loop? Follow-up keyed
  to likely answer.

  2. criteria export: whether the criteria are vertebrate-derived and whether she''d
  accept a mirrored argument (build criteria out of decapod neurobiology and then
  ask whether mammals pass).

  3. the "hardware" side: what she''d say to someone who argues the relevant computations
  require a particular pallial organization — and what would have to be true for that
  argument to succeed rather than beg the question.

  4. precaution/decision-relevance: if the attribution is action-guiding rather than
  truth-tracking, is she making a claim about the world or about policy? What''s the
  difference between "they''re sentient" and "we should act as if"? And the asymmetry:
  what does a false positive cost, in welfare terms, in a system producing that many
  animals?

  5. the practical ranking: which aquaculture practices would she eliminate first
  — no-stun slaughter, CO2 narcosis, ice slurry/chill killing of shrimp, asphyxiation
  in air, eyestalk ablation in broodstock, transport and crowding — and does the ranking
  follow from sentience or from something else (e.g., number of animals, duration)?

  6. the metric problem: cortisol, opercular/gill-beat rate, and other physiological
  stress measures — do they track welfare or just physiology, and does she use them?

  7. trade-off case: what if banning the worst available slaughter method pushes producers
  to a cheaper but worse one, or what if higher-welfare production means fewer animals
  exist at all — how does she handle that?

  8. the moving-target worry: what observation would count against her, and what would
  move her confidence down, not up? I want a question that can''t be answered with
  "more evidence of the same kind."

  9. maybe a question on captive-bred generations / whether welfare concepts transfer.


  Also ask: for each question, note the answer she''s most likely to give and the
  follow-up keyed to it; and flag two places where a hostile interviewer would spring
  a gotcha and rewrite those two as straight questions.


