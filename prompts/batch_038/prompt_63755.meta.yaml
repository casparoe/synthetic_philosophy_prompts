  brain (she''ll say homology isn''t required, functional convergence is enough —
  I want the follow-up that makes her say what would count as functional convergence
  failing).

  - my own old territory: the claim that nociception and pain come apart, and whether
  responses to noxious stimuli that are modulated by analgesics really show experience
  rather than just modulation of a reflex loop (follow-up: what''s the difference
  between "the fish prefers to avoid" and "the fish is bothered").

  - the decapod side: the same criteria applied to an animal with a distributed nervous
  system, and whether she''s just importing a vertebrate template.

  - the precaution move itself: if the attribution is decision-relevant rather than
  truth-tracking, what does that mean for the claim "they are sentient"? Is she a
  sentience realist or a policy instrumentalist?

  - concrete aquaculture: which practices she''d ban first and how she''d rank them
