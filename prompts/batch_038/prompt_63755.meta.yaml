  guest is a philosopher of biology who argues that both teleost fish and decapod
  crustaceans are sentient, and that the case for it is already strong enough that
  aquaculture practice should assume it. She''s careful: she doesn''t claim to have
  solved the hard problem, she says the evidence licenses a "precautionary" attribution...
  etc.


  I want 9-11 questions that don''t let her just repeat the talking points. Things
  I want covered:

