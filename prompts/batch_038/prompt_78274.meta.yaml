  reasoning — I reject evidential decision theory / Kantianising, i.e., I think you
  should not condition on the correlation between your choice and theirs).

  (c) In the indefinitely repeated prisoner''s dilemma, tit-for-tat is the rational
  strategy; Axelrod''s tournaments showed this.

  (d) The folk theorem says that in infinitely repeated games almost any payoff profile
  can be sustained in equilibrium if players are patient enough; I take this to show
  that repeated interaction transforms the strategic situation.

  (e) I think reciprocal altruism (Trivers) plus kin selection explains human morality,
  and I reject group selection as an explanation of anything.

  (f) I think people genuinely cooperate with strangers in one-shot anonymous laboratory
