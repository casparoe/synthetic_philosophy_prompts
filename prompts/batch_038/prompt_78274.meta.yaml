  The really nice one: (b) + (f). If you explain lab cooperation by saying humans
  have evolved preferences that value others'' payoffs (other-regarding preferences),
  then the one-shot "prisoner''s dilemma" with those agents is not a prisoner''s dilemma
  at all in utility terms — the material payoff matrix is not the utility matrix.
  So commitment (b) — that defection is the only rational outcome in the one-shot
  PD — combined with (f) means that real one-shot anonymous interactions among humans
  are not PDs, and hence (b) has little bite on the cases that matter. That''s more
