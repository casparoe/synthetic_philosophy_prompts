  Lewis''s result (informally): Assume there''s a sentence A→B such that for every
  probability function P in a suitable class K, P(A→B) = P(B|A). Then for every P
  in K, either P(A∧B) = 0 or P(A∧¬B) = 0 — i.e., the class K is "trivial": every member
  assigns probability 0 to one of the two cells. Which means the class contains no
  non-trivial probability functions; hence there''s no such conditional unless the
  algebra collapses. That''s the triviality: the class of probability functions must
  be trivial.


