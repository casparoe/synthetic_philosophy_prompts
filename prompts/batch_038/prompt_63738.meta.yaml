  What I want: a procedure with numbered steps; each step states the question, what
  evidence would answer it sufficiently, what the default is if no evidence is found,
  and how much effort is budgeted before the question is closed as unanswerable. The
  key conceptual demands:


  1. Chesterton''s principle as usually stated makes repeal impossible in practice:
  any rule has some function for somebody, and "I can''t find the reason" is exactly
  the state of the first reformer. So the procedure must convert "you must know the
  purpose before you remove" into an allocation of burdens and a stopping rule. It
  must say who bears the burden (the proponent of repeal), what discharges it, and
  what happens when it can''t be discharged and yet the rule looks dead.

  2. Chesterton''s own version distinguishes two reformers: the one who says "I see
  no use" and the one who says "I see the use, and it is a bad one." The procedure
  needs a step that moves an item out of the first category into the second, and the
  second category should be governed by different questions (cost/benefit, distributional
  effects, whether the function is still served by the conditions that produced it).

  3. Burke''s contribution: long use is itself evidence — prescription — and settled
  practice shapes expectations that are themselves a good. So the procedure should
  treat duration and the reliance built on it as evidence, not merely as sentiment.
  But duration must not be an unlimited trump: a procedure that says "if it''s been
  here 40 years, keep it" would keep everything. So specify how duration enters, and
  where it stops mattering.

  4. Manifest vs. latent function (Merton''s distinction — I can name it without quoting):
  a rule adopted for reason A may be sustained by reason B that nobody states. Procedure
  step: enumerate candidate latent functions — coordination between units, allocation
  of authority/liability, revenue, signaling, rationing, creating a delay that lets
  something else happen, serving as a bargaining chip, protecting a constituency,
  providing a record for later litigation. This is the "inject niche idea" part; it
  also is what makes the procedure actually runnable.

  5. Absent-stakeholder problem: the people who benefit from the fence are often not
  the ones proposing its removal and often don''t know they benefit. Procedure must
  include a step to construct the counterfactual constituency and to search for it
  (a public notice, a targeted query to trade groups, etc.), and must say what to
  do when the search returns nothing.

  6. Function obsolescence: a fence whose function depended on conditions that no
  longer hold — this is the one place where "no discoverable present purpose" can
  be a positive ground for repeal rather than a failure of research. Distinguish "no
  purpose ever found" from "purpose identified and shown to have lapsed."

  7. Reversibility / cost of error asymmetry: repealing is cheap if the fence turns
  out to be useless, catastrophic if it was load-bearing; retaining is cheap if it
  was useless, mildly costly in the interim. So the procedure should be explicitly
  a rule for acting under asymmetric error costs — but it should say how much weight
  asymmetry gets and where it must not dominate (otherwise everything is retained).

  8. Where judgment cannot be eliminated: whether a discovered function is legitimate
  (e.g., the rule''s latent function is to exclude a competitor or a class of households)
  is a values question — the procedure flags it and hands it to the committee with
  a memo, not a recommendation. Also: whether the burden on the regulated is worth
  the risk-avoided.

  9. What the procedure cannot do: it cannot tell you whether a fence whose purpose
  is known and legitimate should still come down; it produces no ranking across items
  when the budget forces triage; it cannot detect functions served by the interaction
  of two rules (repealing either alone breaks both); it gives no guidance on adding
  new rules (Chesterton''s fence is about removal).


