  "Bratman analyses shared intention in terms of the individual attitudes of the participants,
  rather than treating ''we-intend'' as a primitive state. For Amara and Ben to share
  an intention to hold the session, three things are needed. First, each of them intends
  that they hold the session. Second, each intends that they hold it in accordance
  with and because of these intentions and subplans that mesh — that is, subplans
  that are the same on both sides, so that Amara''s subplan for the session matches
  Ben''s. Third, these intentions are common knowledge between them, which holds here,
  since each can see the other continuing to plan. Bratman adds two further conditions
  of mutual responsiveness and mutual supportiveness: each must actually assist the
  other''s agency, which Amara and Ben do by filling in for one another. So on Bratman''s
  view they do share the intention to hold the session, even though Amara secretly
  plans to leave; her resolution concerns the group''s future rather than this session,
  and Bratman''s conditions concern only the attitudes the parties presently have
  and their common knowledge of them.


  Gilbert, by contrast, holds that two or more people are jointly committed to do
  something as a body when each expresses, and each believes the others have expressed,
  readiness to be jointly committed, so that joint commitment too is a matter of interlocking
  personal commitments plus mutual belief about them. Like Bratman, Gilbert requires
  that the participants'' personal commitments be common knowledge; a joint commitment
  cannot obtain where one party is privately resolved to withdraw, since then the
  requisite mutual belief is absent. On this reading Gilbert and Bratman give the
  same verdict about Amara and Ben: both say the shared intention (or joint commitment)
  obtains with respect to the next session, because both analyses are satisfied by
  the present attitudes and the mutual belief in them.


  Where they differ, then, is only about the consequences. Because Gilbert thinks
  of the participants as constituting a plural subject, joint commitment brings obligations
  and entitlements: if Amara stopped without explanation, Ben could rebuke her. Bratman''s
  account is reductive and treats shared intention as a species of planning agency,
  and so generates at most pragmatic expectations rather than obligations. But since
  both accounts agree about when shared intention obtains, the divergence in the case
  is not a divergence in verdict: it concerns what Amara owes Ben once she withdraws,
  not whether they now share the intention. Gilbert''s account also has an advantage
  here: because obligations attach to joint commitment, it can explain why Amara''s
  secret resolution is a wrong to Ben even while the group continues to function,
  whereas Bratman''s account, being purely descriptive of interlocking attitudes,
  cannot register the secret resolution as a defect at all."


