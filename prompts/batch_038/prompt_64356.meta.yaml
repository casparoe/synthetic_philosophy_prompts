  Samuelson''s 1938 note grew out of a dissatisfaction with the way the theory of
  consumer demand had been reconstructed in the preceding decade. The classical theory
  had rested on cardinal utility and on the assumption of diminishing marginal utility,
  and both were open to the objection that they posit psychological magnitudes that
  no one can observe or measure. Hicks and Allen showed in 1934 that the results of
  the theory — the downward slope of the demand curve, the decomposition into substitution
  and income effects — could be derived from indifference curves alone, so that only
  the ordinal ranking of bundles was doing any work. Robbins had already argued, in
  his Essay of 1932, that utility is unobservable and that economics must therefore
  confine itself to behaviour; Samuelson''s contribution was simply to take that injunction
  seriously and to insist that the ranking be read off what consumers do rather than
  out of anything in their minds.


  The mechanism is this. Suppose a consumer facing prices p and income m chooses bundle
  x when bundle y is also affordable. Then x is revealed preferred to y. The weak
  axiom requires that, if x has been revealed preferred to y, y must never be chosen
  when x remains affordable. Repeated observations of this kind, taken across a range
  of budget situations, allow one to reconstruct the consumer''s ranking in the neighbourhood
  of the observed choices, and hence — with the aid of the compensation idea — to
  derive the law of demand and to give an operational meaning to concepts such as
  consumer surplus that had previously depended on cardinal magnitudes. Nothing mental
  is invoked at any point. The theory is, in this sense, purely behavioural.


  But this is also where it comes unstuck. Because a preference ordering is defined
  as whatever ordering rationalizes the observed choices, any pattern of choice whatsoever
  can be accommodated: for any data set one can always find a utility function that
  ranks the chosen bundle above the rejected ones. The consistency conditions are
  advertised as making the theory testable, but since satisfaction of the conditions
  is guaranteed by the definition of preference, they can never in fact be violated.
  The theory is therefore unfalsifiable, and by Popper''s criterion an unfalsifiable
  theory is meaningless. Revealed preference does not give utility empirical content;
  it provides a redescription of choice in psychological vocabulary, and the appearance
  of content is an artefact of the vocabulary rather than of the theory.


  Sen''s critique reinforces the conclusion from a different direction. In Rational
  Fools he argues that a person acting out of commitment — the citizen who turns in
  a neighbour, or the social moron who acts on principle against her own interests
  — chooses an option she ranks lower, and is thereby revealed to be choosing irrationally.
  Since the programme identifies preference with choice, it must regard such an agent
  as having contradictory preferences, and Sen takes this to show that the identification
  cannot be sustained. What Sen establishes, then, is that choice does not track any
  single coherent ordering of the agent''s own good, and that revealed preference
  theory must accordingly be abandoned as an account of motivation.


  The upshot for welfare economics is direct. If utility has no empirical content
  and choices do not reflect a coherent ordering, then measures such as willingness
  to pay, which are the currency of cost-benefit analysis, are not measurements of
  anything. They are labels attached to behaviour. A welfare economics that claims
  to be value-free because it rests only on observed choice is therefore not value-free
  at all: it has simply built a contestable theory of the good into its measurement
  procedure.

