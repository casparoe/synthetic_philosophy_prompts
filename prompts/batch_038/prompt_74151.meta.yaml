  the right level of concreteness, the admissible-grounds list, role cards, the scoring/accountability
  scheme that doesn''t require real money), a minute-by-minute timeline for 100 minutes,
  a debrief script that maps specific moments onto the positions, a list of what will
  predictably go wrong the first time I run it and how to handle it, and an honest
  note about which feature of the debate the exercise cannot reproduce and which I
