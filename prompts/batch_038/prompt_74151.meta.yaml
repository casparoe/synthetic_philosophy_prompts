  Draft:


  "I am a fourth-year PhD student in jurisprudence, and this term I am teaching an
  optional seminar of 18 students — mostly second-year law students with one undergraduate
  philosophy course each — over five weeks. In week 3 we cover the Hart–Fuller exchange,
  and I have 100 minutes of a single session. I want to design an in-class adjudication
  exercise that lets the students run into the actual disagreement rather than being
  told it, because when I have taught the readings as a discussion, they reliably
  reduce the debate to ''positivists say law is whatever the sovereign commands, natural
  lawyers say unjust law is not law,'' which is a caricature of both sides.


  My design constraint is this: I want them to feel that the two theorists disagree
  not about the facts of any given regime — both concede that a legal system can be
  procedurally impeccable and monstrous in content — but about whether the craft-standards
  of lawgiving are themselves moral standards, and hence about whether a court that
  strikes down a rule on grounds of promulgation, clarity, prospectivity, or congruence
  with official action is doing something different in kind from a court that strikes
  it down for iniquity.


  Here is the structure I have sketched, and I want you to complete it and tell me
  where it fails. [Then describe the two-round tribunal: a fictional transitional
  regime; Round 1 a substantively abhorrent but procedurally immaculate enactment;
  Round 2 a substantively benign but procedurally defective one; a closed list of
  admissible grounds of decision that contains only source-based and craft-based grounds
  plus a "public interest/manifest injustice" ground that is available only on appeal
  or in a separate opinion; roles: three-judge panels, appellant, clerk, an ''annalist''
  who records which grounds are invoked; scoring where the panel is later held accountable
