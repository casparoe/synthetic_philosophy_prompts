  want to strike it down to find grounds outside the permitted list, and they experience
  the pressure Hart describes: they must step outside the practice of law to condemn
  it. Round 2 (benign but procedurally rotten) they will happily strike down using
  the permitted grounds and feel that they''ve condemned something on grounds of legality
  alone, without appealing to justice — which is exactly Fuller''s point that the
  internal morality has moral force and can do normative work by itself. Then the
  debrief: ask them to notice that in Round 1 the same list did no work, and that
