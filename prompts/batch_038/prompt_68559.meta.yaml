  Saari (1995?, "Mathematical Structure of Voting Paradoxes", Economic Theory): For
  n=3 candidates, the space of profiles (6 dimensions of orderings) decomposes under
  the symmetric group S3 action into irreducible representations: the "basic" space
  A1 (one-dimensional, the representative-voter component), and additional components.
  Specifically, for n=3, the profile space decomposes as: A (basic, 1-dim), B (a 2-dim
  component corresponding to "Condorcet" cyclic profiles?), and C (2-dim). Saari''s
  key result: the Borda count outcome depends only on the basic component A plus something;
  and pairwise outcomes depend on A plus the cyclic component. The "Condorcet component"
  is what pairwise elections respond to and Borda is blind to (Borda''s outcome vector
  is orthogonal to the Condorcet space). Meanwhile, positional methods (other than
  Borda) respond to a combination.


