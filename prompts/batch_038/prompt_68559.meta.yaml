  theorem concerns aggregation rules over complete profiles; a single election is
  one profile. So the interesting tension: people invoke Arrow to say "no voting system
  is fair" — but that''s a misuse; Arrow''s theorem is about IIA and non-dictatorship,
  and the real bite in a single election is Condorcet/spoiler cycling, and the Gibbard–Satterthwaite
  theorem about strategyproofness. A PhD student in social choice / political theory
  could ask for an analysis of, e.g., the 2002 French presidential election or the
  2016 GOP primary through Arrow, and then ask where the theorem is being misapplied.


