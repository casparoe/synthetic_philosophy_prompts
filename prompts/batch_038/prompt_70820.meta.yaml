  ---


  I have served for four years on the Clinical Standards Committee of a nonprofit
  behavioral health system in the American Midwest — roughly 45 clinicians, about
  11,000 client contacts a year, most of them Medicaid or contracted student health.
  I should disclose my formation: I spent fifteen years reading rationalist blogs
  and forums, so I think in base rates, Goodhart''s law, and pre-registered decision
  rules, and I came to the looping-effects literature late, through a philosopher
  of science rather than through clinical training. Our committee is not especially
  philosophical, and I need a document that will survive being read aloud to it.


  The case. A vendor has offered us a 16-item self-report instrument, which it calls
  the Sustained Depletion Inventory (SDI-16), intended to flag adults meeting a proposed
  category it calls depletion syndrome: persistent exhaustion, detachment from previously
  meaningful activity, and a felt decline in one''s own capability, with no requirement
  that the symptoms be tied to work. The proposal before us is to administer the SDI-16
  at every adult intake beginning in the next fiscal quarter, to create a matching
  intake category, and to route positive screens into a new eight-session group protocol.


  Facts the committee has been given, all of which I accept as accurate for the sake
  of the memo. In our four-month pilot (n = 612 adults), 23% screened positive. The
  rate was not uniform: 58% of clients who said they first heard of our system through
  an online community organized around the depletion label screened positive, versus
  11% of clients referred by primary care. The vendor''s validation sample was recruited
  largely from those same online communities, so the criterion against which the instrument''s
  cut score was set is not independent of the population it is now being used to find.
  Three clinicians report that clients who arrive already carrying the label describe
  their experience in the instrument''s own vocabulary, answer the items as a checklist,
  and respond poorly to the behavioral activation work that otherwise suits exhaustion.
  One clinician reports the opposite: for a client with years of unhelpful contacts
  elsewhere, being handed the label was the first thing that made her feel described
  rather than diagnosed, and her engagement improved. Separately, a state care-coordination
  grant pays us a per-case supplement for each newly identified client in a recognized
  category, so adoption is revenue-positive, and one member has already said in writing
  that this is a textbook Goodhart trap; another replied that a financial incentive
  to find cases does not make the cases fake.


  For context the committee will recognize: the international classification keeps
  burnout out of the disease list altogether, treating it as an occupational phenomenon,
  and its entry explicitly says the term refers specifically to the occupational context
  and should not be applied to experiences in other areas of life — whereas depletion
  syndrome is defined without any occupational restriction at all. We also all remember
  the widely reported wave of functional tic-like presentations among adolescents
  during the pandemic years, which most observers traced to the circulation of symptom
  videos, and we have all read the argument that dropping the bereavement exclusion
  from the depression criteria would convert ordinary grief into caseload. Some of
  us think those precedents settle the matter. Some of us think they are being used
  as an all-purpose veto.


  What I want from you is the memo I will circulate before our meeting: a recommendation
  — adopt as proposed, adopt with specified conditions, reject, or defer — with the
  reasoning attached and a bottom line the committee can act on. Three requirements.


  First, make the looping problem operational rather than atmospheric. I want you
  to work with a distinction I have been pushing, and to tell me whether it earns
  its keep or is a distinction without a difference: prevalence loops, where a label
  changes how many people fall under it; phenomenology loops, where a label changes
  what it is like to be one of the people who fall under it; and criterion loops,
  where a label changes what evidence we accept as establishing that someone falls
  under it. Say which of the three are actually live in this case, which are red herrings,
  and what each implies for the decision — including whether the conditions you impose
  differ depending on which loop you are trying to interrupt.


  Second, deal with the 58/11 split honestly. It is compatible with at least two readings
  — that the label is recruiting and shaping cases, and that an underserved population
  has finally found a door it recognizes — and the committee will want to know what
  we could measure in the first year that would actually discriminate between them,
  not just what would make us feel more rigorous. Give me a small set of pre-specified
  metrics and a decision rule for the twelve-month review, including what result would
  oblige us to stop.


  Third, take the strongest case against me seriously and give it more than a paragraph''s
  worth of courtesy. That case, as I understand it, is that our existing categories
  loop just as hard as this one and have simply had decades to feel natural; that
  refusing to name a kind of suffering because naming it might multiply it is a way
