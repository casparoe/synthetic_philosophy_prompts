  Van Fraassen''s Reflection principle + Type A: report verdicts on cases about whether
  I should defer to my future self''s credences. That''s a nice, meaty one. The Reflection
  principle: my current credence in P conditional on my future credence being r should
  equal r. Cases: future self drunk, future self having taken a drug that impairs
  reasoning, future self who will have more evidence (sure thing to learn), future
  self who will be manipulated, cases of anticipated irrationality, cases of self-knowledge.
  Hard-to-reconcile pair: deferring to future self who has more evidence (violates
  Reflection in the "I know I''ll see the coin flip" cases — actually Reflection handles
  that via conditionalization) vs. future self who has been brainwashed. There''s
  a nice tension: cases where the future self''s change in belief is caused by evidence
  (defer) vs. caused by non-evidential distortion (don''t defer) — but the pair that''s
  hard: "future me will be convinced by a charismatic but unreliable expert" vs "future
  me will be convinced by careful reasoning I now consider flawed." Also Hitchcock/Arvanitis?
  There''s also the "cable car" / self-locating issues.


  Alternatively: Collective intentionality + Type A: verdicts on whether a group acted
  intentionally / whether "we" did something. Cases: a mob, a corporation''s board
  decision, two people rowing a boat, orchestra, a couple deciding where to eat, a
  market crash caused by panic, an AI committee, a legislature that passes a law no
  member wanted. Principle candidates: shared intention (Bratman), joint commitment
  (Gilbert), we-mode (Tuomela), Searle''s collective intentionality. Hard pair: two
  strangers who coordinate spontaneously (pushing a car) vs. an organized corporation
  with documented procedures but no member with the relevant attitude. That''s a good
  tension: individualism vs. non-reductionism about group agents (List & Pettit).
  Also: "the group acted but no member intended the outcome" — e.g., a committee where
  each votes against a policy under different descriptions, and the discursive dilemma
  / doctrinal paradox. That''s great material.


