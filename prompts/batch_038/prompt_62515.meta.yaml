  I don''t share that confidence. Should I now assign 0.8 to "my ex still loves me"
  conditional on tomorrow-me assigning 0.8? No. → don''t defer to anticipated irrationality.

  2. Tomorrow I''ll see the result of a fair coin flip. Conditional on tomorrow-me
  being confident it landed heads, I should now be confident it landed heads (to the
  same degree). → defer when future belief is produced by evidence-acquisition + conditionalization.
  (Note: strictly, Reflection is consistent with this because the future credence
  is a function of the evidence; but the naive conditional version handles it.)

  3. Tomorrow I''ll read a tabloid that says the coin landed heads; I know the tabloid
  is unreliable. Hmm, then tomorrow-me''s confidence comes from bad evidence. Conditional
  on tomorrow-me being 0.9 confident, should I now be 0.9? Intuitively no. But careful:
  if I know tomorrow-me will read the tabloid and update, then... This gives the "evidence"
  vs "process" distinction.

  4. Future me will have forgotten a crucial detail (e.g., I''ll forget which suspect
  had the alibi after I stop reading the case files). Now I know it. Don''t defer.

  5. Future me will be more careful and have had years of training in statistics;
  now I''m a novice. Defer? Interesting: my future self is more rational, so I should
  defer even though it''s not just evidence.

  6. Future me will be in a situation of self-locating uncertainty: e.g., I''ll be
