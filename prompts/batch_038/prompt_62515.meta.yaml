  Reflection principle (van Fraassen 1984, "Belief and the Will"): P_t(A | my future
  credence at t'' in A is r) = r. Motivations: Dutch book / diachronic coherence arguments.
  Objections: cases of expected self-correction, expected distortion (drugs, brainwashing,
  forgetfulness), self-locating/branching futures, cases where the future self will
  have misleading evidence (e.g., you know you''ll be shown a fake coin), the "cable-car"/"self-torturer"?
  Also Talbott''s counterexamples, Christensen, Hedden''s work on time-slice rationality,
  and the "diachronic Dutch book" responses. Also Arntzenius''s argument that Reflection
  fails when you expect to forget (the "two-envelope"/"Satan''s apple"?). Actually
  Arntzenius has arguments that Reflection should be restricted to cases where you
  expect to remember everything you now know and to conditionalize.


  Good case set for the asker:


