  are jointly consistent with both an Augustinian absolute prohibition (any assertion
  contrary to what''s in the mind = lie, never permitted) and, say, a "mental reservation"-friendly
  or intention-based account. The prompt asks: given verdicts, predict new case.


  Let me design verdicts that are consistent with multiple rules:


  Rules candidates:

  1. Strict Augustinian: any deliberate assertion contrary to one''s mind is a lie
  and never permissible; but silence/concealment is fine.

  2. Broader: lying is wrong because of the misuse of the signifying faculty — but
  "wide mental reservation" allows ambiguous statements whose truth is recoverable
  from context.

  3. Intention/harm-based: the wrong is in intending to deceive to the hearer''s harm;
  deception for the hearer''s good or a third party''s is fine.

  4. A rule keyed to who bears the burden: deceiving an unjust aggressor who has forfeited
  the right to truth.


  I want earlier verdicts that all four rules agree on, or at least that more than
  one rule fits. And the new case where rules diverge.


  Design a track record — let''s say, a confessor/ethicist''s published rulings, or
  better, something like "Fr. Aurelio runs the ethics column for our diocesan newspaper."
  Casual asker: a grad student or a column reader.


  Verdicts:

  - A man hiding a fugitive from murderers who ask where he is: he says the answer
  "I don''t know where he is" is permissible if the speaker means "I don''t know in
  a way I''m entitled to tell you" — hmm, that''s wide mental reservation, which the
  strict Augustinian would reject. But a strict Augustinian would say: refuse to answer,
  or say nothing — silence is fine. So maybe: he says remaining silent or changing
  the subject is fine; and he says an outright "he''s not here" when he IS here is
  wrong even against murderers. That''s the strict Augustinian view.

  - He also says: a doctor who tells a dying patient "you''re doing well today" (true
  in a narrow sense...) hmm.


  Let me build the track record carefully so it''s consistent with (a) strict Augustinian
