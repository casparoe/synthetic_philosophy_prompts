  Prompt draft:


  I''m the TA for a second-year philosophy course on decision-making and the self,
  and I have to grade the following essay question and answer before Friday. Our rubric
  splits the marks 50/50 between accuracy about the assigned text (L.A. Paul''s *Transformative
