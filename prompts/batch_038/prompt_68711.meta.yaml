  to Gettier himself rather than to Clark; saying that in the Ford case Smith infers
  from a false belief (actually Smith''s belief "Jones owns a Ford" is false, so it
  IS a false lemma — hmm); conflating Gettier cases with the barn façade cases (which
  are actually Nozick-style / Goldman''s fake barns, and are standardly taken to show
  that justified true belief can fail without inference — that''s a good subtle point);
  misattributing "knowledge first" to Williamson correctly but saying Williamson solves
  Gettier by adding a fourth condition. Or claiming Zagzebski''s argument that Gettier
  problems are unavoidable in any analysis... Actually a nice subtle mistake: student
  says fake barn cases are Gettier cases because Smith forms a justified true belief
  via a false lemma — but Goldman''s fake barns are typically classified as non-Gettier
  (no false lemma, no inference) — that''s a conflation a hasty grader would let slide.


  Option B: Transformative experience — L.A. Paul. Student answer with subtle mistakes:
  saying Paul''s argument is that we can''t know what it''s like until we try — that''s
  roughly right (epistemic opacity / phenomenal information). But the subtle error:
  conflating the epistemic problem with the preference-change/personal-identity problem,
  or claiming Paul''s conclusion is that transformative decisions are irrational (she
  says the standard rational choice model fails / can''t be applied, not that choosing
  is irrational), or attributing the argument to Frank Jackson''s knowledge argument
  and saying Paul''s argument is identical to it (Jackson''s Mary case is about physicalism
  and qualia, Paul borrows the epistemic structure but the target is different), or
  claiming that Paul thinks we should decide on the basis of curiosity/discovery —
  she does endorse that as an alternative, actually. Another subtle error: saying
  the argument generalizes to all major life decisions and that Paul argues we should
  therefore use expected utility with proxies — she doesn''t. Or: saying that "what
  it''s like" for Paul means only phenomenal character, whereas Paul intends it more
  broadly (including how the experience changes you). A good subtle mistake: claiming
  that the revelation of phenomenal information solves the problem if you have a child
  already / if you can gather testimony — Paul explicitly addresses testimony and
  simulation and says they don''t deliver the relevant phenomenal information. Another:
  saying the decision should be made by "expected utility over outcomes you can''t
  imagine" — no.


  Also a nice one: confusing epistemic transformation with personal transformation
  — the student says a transformative experience is one that changes your preferences,
  but Paul''s definition requires both epistemic (you can''t know what it''s like
  beforehand) and personal (it changes who you are) transformation; the student might
  treat "transformative" as just "life-changing/big."


  Option C: Tight vs loose cultures — Michele Gelfand''s research. Student answer
  with subtle mistakes: e.g., claiming tightness correlates with... Actually the grading
  type would need an exam question about tight/loose cultures. A subtle mistake: conflating
  tightness/looseness with individualism/collectivism (Gelfand explicitly argues tightness-looseness
  is a distinct dimension that cuts across Hofstede''s dimensions — e.g., both Japan
  and... hmm, individualist but tight? Gelfand notes tightness is not the same as
  collectivism; some tight societies are individualist). Another: reverse-causing
  ecological threat — Gelfand''s model: threat (ecological, historical, resource scarcity)
  → tightness → order/self-control → lower creativity/openness. A student might say
  threat causes looseness, or that tightness causes threat. Another: saying tight
  cultures have stronger punishment but weaker norm clarity — actually Gelfand''s
  two components: strength of norms (clarity/ubiquity) and tightness of punishment.
  So a student might conflate "strong norms" with "harsh punishment" — that''s a nice
  subtle conflation.


  Option D: Ethics of insecticides and pest control. Student answer: e.g., about the
  "insect suffering" debate, sentience uncertainty, expected value arguments. Subtle
  mistakes: conflating the number of insects killed by crop harvesting (plant agriculture)
  with insecticide use; misattributing the "bug crush" argument; the student might
  claim that since insects are so numerous, total suffering from pesticide use exceeds
  that of factory farming, thus vegans should... The subtle error could be treating
  expected-value reasoning with probability of sentience as though it settles it,
