  Transformative experience (L.A. Paul): Key claims:

  1. A transformative experience is one that is both epistemically transformative
  (you can''t know what it''s like except by having it) and personally transformative
  (it changes your core preferences/who you are).

  2. Examples: becoming a parent (vampire, in her thought experiment), joining the
  army, trying a new fruit (epistemically transformative only, minor).

  3. The problem: standard expected-utility decision theory requires you to assign
  subjective values to outcomes and probabilities; but for transformative choices
  you can''t know what it''s like (so you can''t assign values to the outcomes) and
  your preferences will change (so the "you" who evaluates the outcome isn''t the
  current you).

  4. Conclusion: rational choice in the standard sense is impossible; we must choose
  on other grounds — e.g., discovery for its own sake, curiosity.

  5. It''s related to but distinct from Frank Jackson''s knowledge argument — Paul
  draws on the intuition behind "what it''s like" and phenomenal information.

  6. Objections: the argument proves too much (if we can''t know what it''s like,
  then we also can''t choose to have any novel experience, yet we do — e.g., we can
  use testimony, imagination, simulation); Agnes Callard''s "transformative choice"
  work — she argues the problem is one of rational agency, not of information: the
  future self is created by the choice, so the standard is not discovery but... Callard
  says transformative choice is a matter of "aspiration" and that the reasons are
  not prior — she thinks Paul mischaracterizes the problem as epistemic when it''s
  about the constitution of the self ("the agent herself changes what she cares about"
  — Callard: it''s not that we need info, it''s that the choice is one where the agent''s
  future self is created by the act of choosing). Also, Dougherty, Horowitz, Millière
  & Slaughter (eds. *Transformative Experience*, OUP 2020). Also criticism that Paul''s
  argument relies on an overly narrow "phenomenal" conception of what''s like-ness,
  ignoring that we can acquire knowledge by testimony/imagination for many experiences
  (e.g., we know what it''s like to be a parent by observing parents — the "second-hand
  phenomenal knowledge" objection). Also "the objection from small transformations"
  / continuity: parenting is composed of many smaller experiences we do know.


  Nice subtle errors to embed:

