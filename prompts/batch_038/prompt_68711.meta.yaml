  is 500. No secondary literature was assigned, so please don''t penalize the student
  for missing it.


  QUESTION: Explain what makes an experience transformative on Paul''s account, and
  why she thinks neither testimony nor imagination supplies what''s missing. What
  exactly does she conclude about the rationality of transformative decisions? Is
  that conclusion as strong as her premises warrant?


  ANSWER: [student answer ~430 words]


  Please give me a mark out of 100 with a breakdown across the two rubric halves,
  then comments I can paste next to specific sentences — say which sentences need
  correcting and what the correction is — and end with two or three concrete things
  the student could do to raise the grade. Where a claim of the student''s is defensible
  but underdeveloped rather than wrong, say so explicitly; I don''t want to deduct
  for that.


  Student answer:


  "Paul''s argument starts from Frank Jackson''s knowledge argument. Jackson''s Mary
  knows every physical fact about colour vision but has never seen red, and Paul''s
  point is that decision theory has the same problem: there is a kind of fact about
  an experience that is left out of the formal model. A transformative experience
  is one that produces facts of this kind. On Paul''s account an experience is transformative
  when it is epistemically transformative, meaning that you cannot know what it is
  like to have it except by having it, and when it is also personally transformative,
  meaning that it changes who you are — your core preferences and your sense of what
  matters. Her main example is becoming a parent, though she also uses the case of
  deciding whether to become a vampire, and smaller cases like tasting a fruit you
  have never tried.


  The reason testimony and imagination do not help is that they can only give you
  a description of the experience. Other people can tell you about the sleepless nights
  and the joy, and you can picture yourself holding a baby, but neither gives you
  the phenomenal character itself. Since the phenomenal character is what determines
  how much the outcome is worth to you, you cannot know what the outcome would be
  worth until you have it.


  This creates two problems for expected utility reasoning. First, we cannot assign
  probabilities to the outcomes, because the relevant outcome — life as a parent —
  is not something we have any evidence about. Second, we cannot assign values either,
  because the person who will value the outcome is not the person choosing: after
  a personally transformative experience, my preferences will be different, so the
  utilities I would plug in now are not the utilities that will actually apply.


  Paul''s conclusion is that decisions of this kind are irrational. Because rational
  choice requires maximizing expected utility and no such calculation is available,
  choosing to have a child cannot be a rational choice. It follows, she thinks, that
  we should avoid transformative decisions where we can, and where we cannot, we should
  substitute the testimony of people who have already made the transition, since they
  are at least the closest thing to evidence available. The argument is unconvincing
  at this last step: plenty of people make life-changing decisions well and seem to
  have done so for good reasons, so the conclusion is too sceptical. Still, the central
  claim — that we cannot know in advance what a transformative experience will be
  like — seems true and hard to answer."


