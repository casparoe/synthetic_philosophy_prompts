  Actually, my knowledge of Paul''s argument is solid enough:

  - Transformative experience: both epistemically transformative (can''t know what
  it''s like except by having it) and personally transformative (changes your fundamental
  preferences/who you are).

  - Standard rational choice (expected utility maximization) requires assigning subjective
  values to possible outcomes based on what you take their experiential character
  to be like for you; for transformative choices you can''t do that, so the model
  doesn''t apply.

  - Her conclusion: it''s not that the choice is irrational; it''s that the choice
  can''t be made rationally in the standard sense — you can''t determine the choice
  by expected utility. She proposes that we can choose to make the decision for the
  sake of discovery (valuing the transformative process itself), i.e., "we should
  embrace the transformative power of the experience" — she says we can rationally
  choose based on the desire for discovery.

  - She does address testimony/simulation: they can''t deliver the phenomenal character
  of the experience.

  - She invokes Nagel''s bat and Jackson''s Mary — she does discuss the "knowledge
  argument" and phenomenal information. I''m fairly confident Paul references Jackson''s
  Mary case. In chapter 1 she discusses "what it''s like" and phenomenal information,
  referencing Jackson. I''d rather not make the student''s claim about Jackson hinge
  on whether Paul cites him explicitly; I can make the error conceptual: the student
  claims Paul''s argument is "the knowledge argument applied to decision theory,"
  so that the conclusion is that decision theory is false in the same way physicalism
  is false — i.e., that Paul is arguing for an anti-physicalist metaphysics of mind.
  That''s a clear conflation regardless of whether she cites Jackson.


