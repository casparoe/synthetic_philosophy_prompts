  Arrhenius discusses "Lexical Threshold Views" in his book *Justice, Rights, and
  Welfare* / his spectrum arguments. Also there''s "negative utilitarianism" (Pincoffs
  1966, Walker 1974 "Negative utilitarianism" in Mind), and "threshold negative utilitarianism."
  A student answer could conflate lexical priority with a very high but finite exchange
