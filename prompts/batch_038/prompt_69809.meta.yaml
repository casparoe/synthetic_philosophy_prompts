  I''m the junior commentator on an author-meets-critics panel at a small logic workshop
  next month, and I get about twenty minutes to put questions to the author before
  she replies. Her paper is about Carroll''s tortoise, but she doesn''t offer a solution
  in the usual shape. Her claim is roughly this: the regress only looks infinite because
  we assume the demand for a warrant has to be met by a further premise, and no rule
  of inference can ever be warranted by anything of that kind. Instead she says the
  warrant is reflexive — any attempt to assess a rule has to be carried out using
  that very rule, so the chain loops back on itself rather than going on forever —
  and she''s explicit that this isn''t a proof that deduction is justified and isn''t
  meant to convince the tortoise on the tortoise''s own terms. She rejects the Russell-style
  move of separating implication from inference, she rejects the popular taking-condition
  reply (that inferring requires taking the premises to support the conclusion) on
  the grounds that it either restarts the regress or bottoms out in a psychological
  state that does no normative work, and she rejects the Winch-ish line that inferring
  is a trained skill you can''t capture in a formula, because she thinks that leaves
  open whether someone who lacks the skill is making a mistake.


  What I need: eight to ten questions, each with a follow-up aimed at the answer she''s
  most likely to give. She''s very slippery — her default move is to say the question
  "presupposes the malformed demand" and then re-explain her view, so I want the sequence
  to make that harder to pull off as it goes.


