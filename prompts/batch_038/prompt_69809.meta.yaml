  - whether her own paper is self-undermining: she argues from premises to a conclusion,
  so is she entitled to think her argument establishes anything, or is she just describing
  a practice we happen to be in?

  - if nothing inside the head marks the difference, what on her view seperates genuinely
  inferring from a belief just sliding into another belief the way it does after a
  stroke — and if the difference is entirely a matter of how others hold you to rules,
  is that a cost she''s willing to pay?

