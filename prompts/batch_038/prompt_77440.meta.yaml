  into a single causal chain is doing the same work as a mechanism in science; the
  skeptic says coherence is measured by *us*, and our coherence-detection is calibrated
  for social gossip, not for causal structure (the "narrative fallacy" claim), so
  felt coherence tracks story quality not truth. Counter: then why do historians''
  consensus narratives converge over time under adversarial pressure and why do good
  narratives predict new archival findings (e.g., a well-constructed account of a
  decision-making process tells you which documents to look for and you find them)?
