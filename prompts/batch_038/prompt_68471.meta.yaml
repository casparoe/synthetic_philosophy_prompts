  Where''s the flaw? Several candidates:

  - (1) is too strong: things can undergo a loss that is not a change-in-a-thing nor
  the disappearance of a whole thing — a partial loss of structure (Tainter''s rapid
  loss of complexity) is a real event even if the bearer survives. Equivocation on
  "ceases to exist": a thing can persist while losing an essential property (an oak
  can survive losing all its branches; a heart can keep beating while the person dies).

  - (2) is an incomplete enumeration: it omits the level at which collapse is usually
  claimed — the system of interdependent institutions, settlement pattern, division
  of labour, literacy, long-distance exchange. This is a false-dilemma/exhaustiveness
  failure. And a system can cease to exist even when all its components survive —
  the classic mereological point. That''s the strongest diagnosis: (2)+(5) treat "the
  political system" as one thing among the candidates, and (5) then dismisses political
  systems as trivially replaceable — but the claim in the paradigm cases is that a
  whole interlocking system (administration, craft specialisation, writing, food redistribution)
  went, and that its going destroyed conditions of life for the people who survived
  them.

  - (5) slides: France 1789 vs the Mycenaean case is a false analogy — 1789 preserved
  cities, literacy, markets, population; the twelfth-century Aegean lost them. So
  the analogy doesn''t support the generalisation "political systems come and go without
  collapse".

  - (6)→(7) slide: from "no disappearance of a thing" to "collapse is only a judgement".
  Even if collapse is a partial, graded loss, it can still be descriptive — and the
  fact that we notice it dramatically doesn''t make it evaluative.

  - Also the "identifiability today" move in (3)/(4) equivocates between numerical
  continuity of a population and continuity of a way of life; and (4) "the culture
  does not disappear" is doing a lot of work: which culture? Continuity of language
  ≠ continuity of the literate palace administration.


