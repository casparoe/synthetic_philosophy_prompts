  Costs to note:

  - Reject (1): you must say what it is for a persisting thing to suffer a non-persisting
  loss; you must handle Sorites-style questions (how much complexity must go, how
  fast?) and the risk that "collapse" becomes merely "big change", which is what the
  argument was trying to prove anyway.

  - Reject (2): you must accept that systems are real entities over and above their
  members, and then face the question of whether a system''s disappearance is bad
  for anyone (Tainter''s own answer is that collapse can be a rational choice / an
