  The view: the chariot argument in the Questions of King Milinda is almost always
  read by analytic philosophers as an argument for something like mereological nihilism
  — wholes are conceptual fictions, only the parts are real, so the person is a fiction
  over the aggregates. I want to argue that''s wrong twice over. First, Nāgasena''s
  argument isn''t about what exists, it''s about the direction of explanation: a term
  is a mere designation when it only gets applied in virtue of something else that
  can be identified without it, and the ordering runs one way only. Second — and this
  is the part my talk spends most of its time on — if you take that seriously it doesn''t
