  I''m on the grants committee of a small private foundation — 14 of us, mostly faculty
  plus a couple of program officers, around 70 applications a cycle, and we fund 8.
  Our old process was, honestly, a mess: everyone read what they wanted, we went proposal
  by proposal with a show of hands, and the chair broke ties. After the last round
  two members admitted separately that theyd voted against papers they actually liked
  in order to keep a competing application alive, and one of them seemed proud of
  it. The new chair wants a written rule adopted before next cycle, published to applicants
  up front, and defensible if someone appeals — which is apparently why I''m doing
  this, because I took a social choice course a decade ago. My brother, whos done
  some game theory, told me not to bother: that Gibbard-Satterthwaite proves any non-dictatorial
  rule over three or more alternatives is manipulable, so whatever we write is a polite
  fiction, and we should just have an outside reviewer score everything and draw lots
  among the top three.


  I dont buy him fully, but before I go shopping for rules I want to know what I should
  even be demanding of one. So write the desiderata: what an adequate selection procedure
  for a committee like ours has to deliver — the properties it must have, the cases
  it must get right, the distinctions it must not collapse, the formal results it
  has to be consistent with — with the consideration or the concrete committee example
  behind each item, and mark which ones are genuinely non-negotiable for us and which
  are just tastes of one camp in the literature. The ones I most want pressure-tested
  are the ones that sound self-evidently good. Is strategy-proofness really the target,
  or is the real worry that sophisticated members exploit honest ones (and does it
  matter whether we get dominant-strategy protection or only no-gain-given-plausible-beliefs,
  and whether an individual can profit or a bloc of three can)? Are anonymity and
  neutrality requirements or ideals? What work is "onto" doing? Is demanding a complete
  ranking of all 70 from every member itself a mistake, given I genuinely cannot compare
  two applications in a field I''ve never worked in? And since our output is a set
  of eight and not a single winner, does the whole impossibility framing even apply,
