  Let me think about teleosemantics deeply. Teleosemantics: mental content is fixed
  by the function of a state, where function derives from evolutionary history (Millikan),
  learning history, or success conditions (Neander: proper function = what ancestors
  were selected for doing). Key problems:

  - Swampman (Davidson): a duplicate created by lightning has no history, so no content.
  Millikan bites the bullet.

  - The disjunction problem (Fodor): frog''s fly-detector fires at flies and at BBs;
  content is "fly or dark moving speck." Teleosemantics answer: content fixed by what
  the mechanism was selected for (catching flies) — but then if the frog has never
  eaten a BB, "fly" is the content; misrepresentation handled because functions can
  fail.

  - Novelty/innovation problem: content for states with no selection history (e.g.,
  beliefs about quantum mechanics, the concept "carburetor" or "quark"). Neander''s
  answer: derived content via description/similarity. Millikan''s: pushmi-pullyu,
  and reidentification.

  - Karen Neander''s "misinformation problem": teleosemantics can''t handle content
  of novel concepts, and also a state caused by X but selected for detecting Y.

  - Peter Godfrey-Smith: functions and content; "complex brains".

  - Ruth Millikan: proper function, Normal conditions, "pushmi-pullyu" representations,
  consumer semantics — content fixed by what the consuming system needs.

  - David Papineau: teleosemantics, "Reality and Its Depths".

  - Bence Nanay: pragmatic representations; also "perceptual representations".

  - Artiga: "New prospects for a Darwinian theory of representation", the "disjunction
  problem" and "disease-detection" cases (e.g., a mechanism whose function is to detect
  pathogens — Millikan''s frog, "liberality problem").

  - The "liberality problem" (Artiga): teleosemantics predicts that frog''s fly-detector
  represents "moving dark speck" too since it was selected to catch both flies and...
  hmm, actually the liberality problem: many indicators have multiple functions so
  content is disjunctive.

  - Also: the "function indeterminacy" problem — selection doesn''t determine unique
  function level (detect flies vs. detect dark moving specks vs. detect food).


  Now, the type-1 prompt: a person''s verdicts about which content ascriptions are
  correct across a set of cases, and a new case where candidate rules diverge.


  Candidate rules that fit the same verdicts:

  (a) Strict ancestral selection-history teleosemantics (Neander): content = what
  the mechanism''s ancestors were selected to correlate with / do.

  (b) Consumer/production semantics (Millikan): content determined by what the consuming
  system needs, with Normal conditions — allows derived content for novel states by
  virtue of the abilities of the producer-consumer system.

  (c) Learning-history-inclusive teleosemantics (Papineau / Dretske-flavored indicator
  semantics with success conditions): content fixed by whatever reliable indicator
  role has been established either by evolution or by individual learning.

  (d) A "liberal" functionalist/pragmatic view (Nanay): content is fixed by current
  causal-explanatory role, history optional.

  (e) An eliminativist: no content at all for non-humans.


