  SSA (Self-Sampling Assumption): one should reason as if one is a random sample from
  the set of observers in one''s reference class. SIA (Self-Indication Assumption):
  given the fact of one''s existence, one should reason as if one is a random sample
  from the set of all possible observers, weighted by the number of observers each
  hypothesis says exists — i.e., hypotheses predicting more observers get a likelihood
  boost proportional to the number of observers. SIA leads to the presumptuous philosopher
  problem: SIA gives an enormous a priori boost to theories positing a vast number
  of observers, letting one "confirm" a theory by sheer armchair reasoning (Bostrom''s
  example: a theory that there are a trillion trillion observers vs a trillion; SIA
  gives a likelihood ratio of a million to one).


  Doomsday argument: SSA is the basis of the Doomsday argument (Gott''s version, and
  Leslie''s). SIA counteracts it because it boosts hypotheses with more observers,
  offsetting the ranking effect. Note Bostrom''s ADASS... Actually the standard "full
  self-sampling assumption" (FSSA) is a refinement. Also SSA + the Doomsday argument
  depends on the reference class choice.


