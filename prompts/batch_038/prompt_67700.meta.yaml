  1. Small details: the giggle, the obscene laughter, Mozart crawling on the floor,
  the "too many notes" exchange — the film is built on the revealing small gesture.
  Strong.

  2. Mirror/imitation: Salieri is the audience''s surrogate; the film''s moral learning
  happens in the asylum, through Salieri''s confession to the priest. Who is imitating
  whom? Mozart can''t be imitated (genius is not imitable) — that''s the film''s tragedy
  and a genuine problem for Plutarch''s model: Plutarch assumes virtue is imitable,
  but the film suggests what''s memorable in Mozart is precisely what cannot be copied.

  3. Synkrisis: the film IS a synkrisis — Salieri vs. Mozart, mediocrity vs. gift.
  Plutarch pairs lives; the film pairs them within one life-story told by the other.

  4. Malice: Salieri is the envious narrator, exactly what Plutarch warns against
  in Herodotus. And the film asks us to trust him anyway. Does the film vindicate
  the malicious biographer, or does it show that envy is a form of attention that
  produces truth (Salieri is the only person in Vienna who can hear how good Mozart
  is)?

  5. Hagiography: Mozart is de-sanctified — the saint is a vulgar child. The film''s
  answer to hagiography: make the genius a clown so that the gift is unmistakably
  a gift.


