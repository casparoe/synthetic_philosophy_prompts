  one where the desktop-and-icons metaphor does the heavy lifting (Dennett''s user-illusiony,
  Nørretranders'' term, Metzinger''s transparent self-model — you know the family).
  Here''s the thing that bugs me and that I want the essay to actually settle rather
  than survey.


  The metaphor is supposed to explain why experience feels the way it does: rich,
  immediate, private, given all at once. But GUIs get built for a very specific reason
  — limited bandwidth and a limited set of actions the user needs to perform. Nobody
  designs a desktop because the underlying filesystem is *in principle* unavailable
  to the user; you could open a terminal and cat the file. Which makes me suspicious
  that the metaphor is doing smuggling.


  So: write an essay on the following controversy. When you press the user-illusion
  metaphor hard, does it commit you to strong illusionism — the view that there isn''t
  really anything it''s like to be anything, that phenomenal consciousness is a kind
  of cognitive artifact and reports of it are just wrong — or does it only commit
  you to the modest claim that experience is real but *overdescribed*, that introspection
  hands you a control surface with a few big friendly icons where there is actually
  something much less icon-shaped? These are very different theses and I think people
  slide between them constantly.


  Some things I''d want the essay to actually engage with rather than name-drop:

  - the write direction. Everyone talks about the display being simplified. But a
  GUI is read *and* write — it''s a control panel. If the metaphor is taken seriously
  in both directions, what follows about the relationship between introspection and
  the ability to manipulate one''s own states? Does that predict anything about which
  properties get reported reliably?

  - failure modes. A good analogy earns its keep by licensing counterfactuals. Does
  the interface story predict the speckled-hen style facts (that we can''t just read
  off how many speckles the afterimage has), change blindness, the low-res periphery
  — or does it predict the opposite, that an interface good enough to steer by has
  to be pretty accurate?

  - the homunculus worry. If there''s a user, who is it? Is there a way of cashing
  out ''the organism is its own user'' that doesn''t just relocate the problem, and
  is that cashing-out actually doing philosophical work or is it a way of saying ''trust
  me''?

  - the asymmetry that seems to make the whole thing unstable: we can, at least partly,
  look behind the interface — neuroimaging, lesion studies, TMS. In the desktop case
  the user genuinely cannot. Does that difference cut in favour of the modest reading
  (experience is real but not what it seems, and we can study what it really is) or
  against the metaphor altogether?


  I want a verdict. Pick a side — strong illusionism, the modest overdescription view,
  or something else you can defend better than either — and argue for it. Don''t end
  on ''it depends on what you mean by illusion'', that''s exactly the move I''m trying
  to get past. And be honest about the epistemics: tell me roughly how confident you
  are in the verdict, and single out the one step in your argument you''re least sure
  about, the one where you think a good objector could actually break it. Don''t bother
  with references or a bibliography, this is for a discussion not a paper."


