  analogy is self-undermining. If consciousness is an illusion, then who is being
  fooled? Illusions seem to require someone to have them. Metzinger addresses this:
  nobody ever was or had a self, but "it''s the content of a transparent self-model".
  So there is phenomenal experience, just no self. Dennett''s view: consciousness
