  Question draft:

  "Augustine of Hippo is usually described as holding that lying is never permissible.
  (a) Explain what, for Augustine, makes an utterance a lie, and what makes it wrong.
  (b) His treatises on lying rank different kinds of lie by gravity. Explain what
  this ranking does and does not show about his absolutism. (c) A person is hiding
  in your house from a murderer who asks you where they are. Describe what Augustine
  allows you to do and what he forbids, and say whether his treatment of the case
  is internally consistent. Draw on at least one of his two works on lying."


  Student answer draft:


  "Augustine''s position is that lying is never permissible, and that this holds without
  exception, whatever good might come of it. For him what makes an utterance a lie
  is not its falsity: a person may say something false and not lie, if they believe
  it to be true, and may say something true and lie, if they believe it to be false
  and assert it anyway. What matters is the mismatch between mind and speech — the
  double heart, as he calls it — together with the will to deceive. This is right,
  and it means that lying is a matter of the speaker''s own state rather than of the
  world.


  He holds that lying is wrong because it cannot be universalised: if everyone lied
  when it suited them, no one''s word could be trusted and the practice of asserting
  anything would collapse, so the liar acts on a maxim that destroys the very institution
  his act depends on. There is also a self-regarding dimension, since the liar degrades
  himself by using a faculty for a purpose contrary to its nature. This makes Augustine
  a clear forerunner of Kant, and the two positions stand or fall together.


  On the ranking: in De mendacio Augustine sorts lies into eight kinds, from lies
  in religious teaching, which are the worst, down through lies that harm someone
  for no one''s benefit, lies told for the pleasure of deceiving, and lies told to
  please company, to the mildest kinds, which harm no one and are told to save a person
  from death or from violation. All eight are sins; the ranking only grades the seriousness.
  This is a genuine problem for him, and I think it shows his absolutism is not as
  absolute as advertised: if the mildest class of lie harms no one, protects someone
  from a grave evil, and is still a sin, then Augustine''s own scale is doing the
  work of a consequentialist weighing while his official doctrine denies that any
  weighing is allowed. At the very least he owes an explanation of why the mildest
  lie is not merely a lesser evil but a positive wrong.


  On the case: the murderer at the door. Augustine forbids the lie — you may not say
  the person is elsewhere. But he does not require you to become the murderer''s accomplice
  by silence in every case; he thinks you may withhold the truth, refuse to answer,
  or say something literally true in a sense of your own choosing that you know the
  murderer will take otherwise, since the wrong in lying lies in the mismatch between
  heart and tongue and there is no mismatch if your words are true. In Contra mendacium,
  written against the Priscillianists, who thought it lawful to lie to conceal their
  beliefs, he applies the same principle to feigning heresy in order to expose heretics:
  the deception may not be used even for the sake of the truth it would serve.


  Whether this is consistent: partly. Refusing to answer is clearly consistent with
  the double-heart account. But the permission for literally-true-but-misleading speech
  is not, and it is not clear that Augustine can hold both. If the wrong of lying
  is the intention to deceive, then a true utterance offered with the intention that
  the hearer be deceived is as much a lie as a false one, by his own definition; if
  instead the wrong lies in the mismatch, then the misleading truth escapes. He seems
  to want the definition both ways, and this is why the position looks unstable at
  exactly the point where it is most likely to be tested."


