  Actually for bucket-type arguments you need cosmological scenarios (empty universe,
  Machian). Let me think: Design a thought experiment in which relationism and substantivalism
  give genuinely different verdicts, without relying on the bucket or the two globes,
  and without positing empty universes or perfect rigidity. Hmm — the classic tension:
  relationism (Leibniz/Mach) says rotation is only relative to the distribution of
  matter; substantivalism says absolute rotation is rotation relative to space. Newton''s
  bucket and globes show absolute acceleration detectable. Mach''s reply: inertial
  effects come from the fixed stars. So a designed case: a universe with all matter
  rotating relative to a shell of distant matter... The specification could be: build
  a case where the relationist and substantivalist agree about all observable facts
  (all relative distances, all accelerations) but differ about... hmm, they must differ
  somewhere to be non-trivially distinct — this is the "hole argument"/underdetermination
  issue. Actually, a good specification: construct a scenario in which the bucket''s
  water surface is concave but the bucket is not rotating relative to anything — i.e.,
  isolate whether the explanandum is "motion relative to space" vs "motion relative
  to the fixed stars". Or: build a Machian case where relative rotation is held fixed
  but the distribution of distant matter is varied, and see whether the effect changes;
  then a substantivalist says no change, relationist says change. That''s genuinely
  a designed experiment isolating one variable. And you can note that GR (frame-dragging,
  Lense-Thirring, Brill-Cohen) partially vindicates Mach but not fully. Also the "Gödel
  universe" and "rotating shell" solutions — that might count as exotic physics.


