  Draft:


  "I run a small podcast about the philosophy of cognitive science; the audience is
  mostly working software engineers who have skimmed some Dennett and a scattering
  of graduate students who have not skimmed. I first ran into the four-tier taxonomy
  — Darwinian, Skinnerian, Popperian, Gregorian creatures — years ago in the rationalist
  blogosphere of the late 2000s, where it was usually deployed to make a point I thought
  was worth making: that a mind is not one mechanism but a stack of selection processes
  operating at different places, and that asking what kind of mind something has means
  asking at which of those places the bad options get thrown away.


  Next month''s guest is a philosopher of cognitive science who accepts that framing
  and pushes it further than I''ve seen anyone push it. Two claims of hers matter
  for my purposes. First, she reads the tiers as a scale over where the cost of being
  wrong is absorbed: for a Darwinian creature the unfit design is culled from the
  population, for a Skinnerian creature a response tendency is extinguished, for a
  Popperian creature an internally represented option is vetoed before the body commits
  to it, for a Gregorian creature an external tool, notation, or technique is abandoned.
