  "So I''ve been doing paralegal work in London for about a year and there''s this
  set of habits in the UK system that I can''t get my head around, and I want someone
  to tell me what picture of law they only make sense under.


  Three things. First: when a court finds an Act of Parliament clashes with the European
  Convention rights, it''s supposed to strain the wording — read in things, read down
  things, basically bend the statute until it fits — ''so far as it''s possible to
  do so.'' Second: when the bending can''t be done, the senior courts issue a declaration
  of incompatibility, and that declaration explicitly doesn''t affect the statute''s
  validity, doesn''t stop it operating, doesn''t stop it being enforced, and isn''t
  even binding on the parties to the case. The person who won the declaration still
  loses. Parliament might fix it later (sometimes a minister patches it by order),
  or might not. Third: before a bill gets a second reading, the minister in charge
  has to publish a written statement either that in his view it''s compatible with
  the Convention rights, or that he''s unable to say that but the government wants
  the House to proceed anyway.


  Meanwhile I''m American and grew up with courts just voiding statutes outright.


  What does this whole apparatus presuppose? It feels like it''s committed to something
  — that a rule can be fully valid law and simultaneously carry an official, published
  moral defect, and that noting the defect is all that''s required. Is that right,
  or am I reading too much in? And the two halves seem to pull opposite ways: bending
  the text treats the moral problem as something to be interpreted away, while the
  declaration treats it as something to be logged and moved on from. Can one theory
  hold both, or is the practice just papering over a disagreement?


