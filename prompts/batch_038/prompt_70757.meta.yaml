  Malcolm''s view (Dreaming, 1959): Draws on Wittgenstein. Central claims: (1) A dream
  is not an experience; "I dreamt that p" does not assert that an experience occurred
  during sleep. (2) The only evidence/criterion for the content of a dream is the
  waking impression ("seeming to remember"), not anything that happened during sleep.
  (3) Therefore questions like "was the dream vivid?", "did it happen while I slept?",
  "did I actually experience being chased?" are without sense — there''s no fact of
  the matter beyond the waking impression. (4) Dreams cannot occur while we are awake;
  a dream is not something that goes on during sleep — sleep is a period of no experiences.


  Dennett''s view ("Are Dreams Experiences?", 1976): The "cassette theory" (or "retroactive
  theory") — dreams are not experiences had during sleep; rather, at or near waking,
  the brain inserts a ready-made content into memory (like a pre-recorded cassette
  being "played back"), often triggered by an actual stimulus at waking (incorporation
  of the alarm clock, a blanket falling off). His argument for its live possibility:
  (a) backward-masking experiments (Charles Eriksen / and the "color phi" phenomenon
  Dennett discusses) show that a later-presented stimulus can retroactively alter
  the apparent content of an earlier experience, so the temporal order of "experience"
  is not a simple matter of when it happened; (b) there''s no possible evidence, even
  in principle, that could distinguish the cassette theory from the experience theory
  — so the experience theory does no explanatory work. He concludes that the hypothesis
  that dreams are experiences is idle/superfluous, not refuted.


  Note both arrive at "dreams aren''t experiences" but differently: Malcolm says the
  very notion of a dream-experience is conceptually confused (the grammar of "dream"
  is being misread); Dennett says it''s an empirical hypothesis that is idle given
