  and terminating, and infinite data structures such as streams are accepted when
  they are productive — when every finite prefix can be produced on demand — even
  though the object as a whole never finishes. I have used proof assistants enough
  to know that you can postulate an axiom or write `sorry` to close a hole, that the
  kernel will accept it without complaint, and that everything downstream is then
  only as trustworthy as that postulate; and I know that an inconsistent axiom is
