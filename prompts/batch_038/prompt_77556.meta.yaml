  That''s an excellent "in the weeds" comparison. The philosophical payoff: what does
  subsidiarity presuppose? A theory of legitimacy based on proximity? A theory of
  competence allocation as a matter of comparative efficiency ("better achieved")?
  A theory of the demos (the citizen is a member of a nested polity — but which level
  speaks for the citizen)? The "better achieved" test is comparative-effectiveness,
  not democratic self-government — which is why the CJEU can treat it as a reviewable
  but deferential standard, and why it collapses into a functional/epistemic justification
  rather than a rights-based one. Also: subsidiarity presupposes that there is a fact
  of the matter about which level can achieve the objective "better," which presupposes
  objectives are given rather than constituted by the level of decision — a deep issue:
  the EU can define the objective in a way that makes Union-level action necessary
  (the "objective-setting" problem; e.g., framing the objective as harmonizing national
  rules for the internal market makes Union action trivially necessary). That''s a
  really good, sharp point: subsidiarity review is hostage to how the objective is
  described. The Court has said the objective as pursued by the legislature. Also
  the "internal market" legal basis makes subsidiarity almost self-fulfilling.


