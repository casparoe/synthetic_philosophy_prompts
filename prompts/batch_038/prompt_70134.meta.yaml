  Summary draft:


  "Hempel''s raven paradox is the classic demonstration that common sense about evidence
  can''t be trusted. Start with the hypothesis that all ravens are black. Logic tells
  us this is exactly the same claim as its contrapositive: everything that isn''t
  black isn''t a raven. And evidence that supports one formulation of a claim must
  support the other, since they are the same claim. Now, your white sneaker is something
  that isn''t black and isn''t a raven, so it supports the contrapositive — and therefore
  it supports the hypothesis that all ravens are black. By the same token, since the
  two formulations are one claim, the support they get can''t depend on which side
  you look at: a white sneaker and a black raven are equally good evidence, and anyone
  who says otherwise is treating the same sentence as two different propositions.


  Hempel thought this was a reductio of the whole project of giving a purely logical
  account of evidence — if a rule of confirmation tells you that you can learn about
  birds from your footwear, the rule has to go. His way out was to make confirmation
  quantitative. Because there are incomparably more non-ravens than ravens, each individual
  non-raven you happen to inspect shifts the probability of the hypothesis by a vanishingly
  tiny amount, whereas each black raven shifts it by a much larger amount. Nothing
  paradoxical there: it''s just that the tiny shifts are too small for us to notice,
  and we mistake a very small quantity for zero. The lesson for working scientists
  is a practical one: always ask how big the pool of things you could have looked
  at is. An observation is only worth much if it rules out a large fraction of the
  alternatives, which is why negative results matter enormously when you''re screening
  a small set of candidates and are worth nothing at all when the field of candidates
  is effectively the whole universe."


  Now errors in this:

  (a) "Hempel thought this was a reductio of the whole project" — wrong; Hempel accepted
  the conclusion and kept the equivalence condition.

  (b) "His way out was to make confirmation quantitative... because there are incomparably
  more non-ravens than ravens" — that''s the Bayesian resolution (later: Horwich,
  Maher, Earman), not Hempel''s. Also Hempel''s own move: tacit background knowledge
  / restricting the reference class; illustrated with the sodium salt / ice-in-flame
  example.

  (c) "a white sneaker and a black raven are equally good evidence" — wrong in the
  Bayesian framework: the equivalence condition says the same amount of evidence confirms
  equivalent formulations, but different observations have different degrees of support;
  the whole point of the Bayesian resolution is the asymmetry. Also conflating "instance
  of an equivalent formulation" with "equal evidential weight."

  (d) The lesson: "An observation is only worth much if it rules out a large fraction
  of the alternatives, which is why negative results matter enormously when you''re
  screening a small set of candidates and are worth nothing at all when the field
  of candidates is effectively the whole universe." — partly right-ish (likelihood
