  be available, not that S bother to form the belief; and the availability is at the
  time the condition obtains, not later on reflection. Luminosity is therefore a completeness
  thesis about knowledge of C rather than a claim that C is incorrigible.


  (b) Williamson''s target is the condition of feeling cold, which the Cartesian tradition
