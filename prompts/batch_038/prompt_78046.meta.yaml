  over the series it obtains at αn. It does not. So the reductio succeeds: feeling
  cold is not luminous, and there is some case in the series in which you feel cold
  without being in a position to know that you feel cold. Structurally the argument
  resembles a sorites, but its premises concern knowledge and its reliability rather
