  warm, changing slowly enough that no case is discriminable from its immediate neighbour
  with respect to how you feel. The condition obtains at α0 and fails at αn.


  Assume for reductio that the condition is luminous. Working with the cases as described,
  in which you are awake, attentive and in command of the concept, luminosity gives:
  if you feel cold at αi, you know at αi that you feel cold. The premise that does
  the real work is the margin-for-error principle: if you know at αi that you feel
  cold, then you feel cold at αi+1. This is not stipulated. It follows from the requirement
  that knowledge be safe: since αi+1 is indiscriminable from αi, you would have formed
  the same belief there, so if the condition failed at αi+1 your belief at αi would
  easily have been false and would not have been knowledge.


