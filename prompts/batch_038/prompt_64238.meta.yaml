  \ and the steps that are empirical or historical.\n\nSTUDENT ANSWER:\n\nHegel's\
  \ claim about the \"ethical moment\" in war is developed in the part of the Philosophy\
  \ of Right on the state's sovereignty vis-à-vis foreign states, around §321–324.\
  \ The state, for Hegel, is an actual individual, and individuality means being one\
  \ to the exclusion of other ones; so a state is essentially a state among other\
  \ states, each autonomous in relation to the rest. War is where this shows up. In\
  \ war the state's \"absolute power against everything individual and particular,\
  \ against life, property, and their rights\" is exercised, and the nullity of those\
  \ finite things is brought home to consciousness. That's the ethical moment: the\
  \ individual's property and life, which in civil society look like the whole point,\
  \ are revealed as finite and as moments of a larger substantial order, and the citizen's\
  \ willingness to risk them is what Hegel calls a substantive duty. He is explicit\
  \ that the state cannot be understood as a device for securing life and property,\
  \ because that security could not possibly be purchased by the sacrifice of the\
  \ very things being secured.\n\nThe most quoted passage here is the comparison in\
  \ the Addition to §324, where Hegel says that \"the blowing of the winds preserves\
  \ the sea from the foulness which would be the result of a prolonged calm,\" and\
  \ that endless peace would corrupt nations the way a stagnant sea goes foul. I'd\
  \ stress that this is not decoration or an afterthought; it's the conceptual core.\
  \ It follows from the concept of sovereignty that a state which never had to assert\
  \ its independence against another would cease to be a state at all, since its citizens\
  \ would come to treat private satisfaction as ultimate. So the anti-pacifist point\
  \ is a priori, not a guess about history.\n\nThis is also where Kant comes in. Kant\
  \ wanted a federation of free states that would guarantee perpetual peace by adjudicating\
  \ disputes. Hegel agrees that this is a noble ideal, and he agrees it would be desirable,\
  \ but he denies it is achievable, because human beings are naturally contentious\
  \ and because states will not in practice subordinate their interests to a shared\
  \ tribunal. So Hegel is a realist in the familiar sense: he thinks interstate relations\
  \ are governed by interest and force rather than by law, and war is a morally neutral\
  \ instrument that states use to pursue those interests. What makes him distinctive\
  \ is only that he adds the health-of-the-sea point on top: perpetual peace would\
  \ be bad for us even if we could get it. This is also why the later claim that world\
