  she said misrepresents the world as she takes it to be.

  (3) Beliefs a hearer forms on the basis of inferences beyond what was asserted are
  not among the things the speaker said, and a speaker is answerable only for what
  she said.

  (4) So a speaker who asserts only what she believes true is not answerable for what
  her hearer takes away.

  (5) Therefore truthful misleading — carefully selecting true statements so as to
  produce a false belief — is never blameworthy.

  (6) But (1) is not the only route to (5): the same reasoning works from any account
  on which lying is a special case of misrepresenting. Since every ordinary assertion
  is embedded in a background of unstated implications, and no speaker can control
  all of them, the argument shows that essentially nothing anyone says is ever a misrepresentation
  for which they can be held to account.

  (7) An ethics of speech on which speakers are almost never answerable is no ethics
  of speech.

  (8) So something above is false.


