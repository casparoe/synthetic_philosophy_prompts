  Better: make the argument run to the sweeping conclusion directly:


  (1) Lying is asserting what you believe to be false.

  (2) If you assert p and believe p, then what you asserted accurately represents
  the world as you believe it to be.

  (3) To mislead someone is to cause them to believe something false.

  (4) Any belief your hearer forms beyond p was produced by their own inference, not
  by your assertion; you supplied only p.

  (5) So when you assert only what you believe, you have neither lied nor misrepresented:
  you supplied truths, and the hearer supplied the error.

  (6) Hence misleading with truths is never blameworthy, while lying is blameworthy
  at least pro tanto — the standard asymmetry.

  (7) But (4) is not special to misleading cases. When you lie, the hearer''s false
  belief is likewise produced by their own inference — from your words to the world
  — and you supplied only a sentence. If the hearer''s inferential contribution defeats
  responsibility in the truthful case, it does so in the lying case too.

  (8) So no speaker is ever responsible for any belief they produce in a hearer; and
  since the wrongness of lying is supposed to consist in producing a false belief
  in another, lying is never wrong either.


