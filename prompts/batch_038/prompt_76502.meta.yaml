  along with misleading, showing (4) is self-undermining. The flaw: (4)/(7) equivocates
  on "supplied only p" — in lying, the false belief comes from the content of what
  was asserted; in misleading, it comes from what the speaker''s choice of true content
  invited. Also (7)''s "likewise produced by their own inference" is a slide: yes,
  all communication involves inference, but responsibility tracks control and intention,
  not the mechanical fact that the hearer''s mind did the last step. And (3)''s definition
  of misleading ("cause them to believe something false") ignores the intention condition;
  if misleading requires the intention that the hearer infer falsely, then the truthful
  misleader is doing something the mere truth-teller isn''t.


  So the diagnosis: the flaw is in (7) — the assimilation of the two cases — plus
  (4)''s equivocation between causal contribution and answerability, and (3)''s omission
  of intention. And the "price": if you reject (4)/(7), you need an account of why
  speakers are answerable for reasonably foreseeable/intended implicatures; if you
  reject (3), you make misleading intention-dependent, but then the murderer-at-the-door
  case... Hmm. Also, giving up (1) (adopting a broader view of lying, e.g., lying
  includes asserting with intent to deceive regardless of believed truth — no, that''s
  too broad; or Fallis-style: lying requires believing that you say something for
  which you lack adequate warrant) would restore asymmetry differently.


  Also there''s a good point: rejecting (5) requires explaining why the truthful misleader
  is blameworthy — and there are cases where they aren''t (the polite "I''m not seeing
