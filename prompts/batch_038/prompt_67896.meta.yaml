  with numbered objections and officer replies, and a recommendation at the end.


  The application is from a developer (invent one) for a residential scheme that starts
  as a modest village and is then extended in phases, and the whole joke is that each
  phase is arithmetically unobjectionable by the council''s own lights while the endpoint
  is a city of some absurd number of people whose lives are barely worth living. make
  the arithmetic actually work: give the officer''s welfare figures, keep the threshold
  explicit, and arrange the phasing so no phase makes any existing resident worse
  off and every new resident clears the bar. someone in my group will check.


  the objections and replies should be the real moves, not caricatures: the neighbours
  who turn up to the consultation and get told they have no standing because they
  wouldn''t exist under the smaller scheme; a councillor invoking the asymmetry between
  adding miserable lives and adding happy ones and being ruled out of order; a rival
  proposal from a housing association that requires every new resident to clear some
  level above neutral, which the officer dismisses as setting the bar arbitrarily
  and making it bad to add people who''d be delighted; a mediator''s compromise involving
  a diminishing weight per extra head; the option of a scheme with slightly worse
  lives but far fewer people, and why it loses; an equality objection about the gap
  between phase one and phase forty; and a monitoring officer who certifies that the
  conditions the council wrote into its own welfare planning policy can''t all be
  satisfied at once, so the committee is choosing which one to break. none of these
  should be named as -isms or attributed to anyone; the officer just does the reasoning.


  tone: the officer is a sincere optimiser, not a villain and not a strawman, and
  the prose should be flat bureaucratic English — amenity, parking provision, affordable
  housing quota, drainage — so it reads fine to someone who''s never heard of any
  of this and much funnier to someone who has. no one in the document gasps. nobody
  says ''monstrous''. the recoil belongs to the reader. and the document must never
  use the phrase for the famous conclusion, or point at it.


