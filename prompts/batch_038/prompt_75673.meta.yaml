  Gould & Lewontin 1979, "The Spandrels of San Marco and the Panglossian Paradigm:
  A Critique of the Adaptationist Programme," Proc. R. Soc. Lond. B 205:581–598.


  Key content I''m confident about:

  - Architectural spandrel: the roughly triangular space between two adjacent arches,
  or between an arch and a rectangular enclosure (like a wall/ceiling above). In Byzantine
  architecture (San Marco, Venice), the spandrels above the central dome were covered
  with mosaics — four evangelists. The point: the spandrel is an inevitable architectural
  byproduct of mounting a dome on rounded arches; it''s a space defined by the geometry
  of the structure, and then decorated — the decoration is not the reason the spandrel
  exists.

  - The critique targets the "adaptationist programme": the tendency to assume that
  every feature of an organism is an optimal design produced by natural selection,
  and then to search for an adaptive story ("just-so stories" — they reference Kipling''s
  Just So Stories).

  - They emphasize that form is constrained by developmental and architectural necessities;
  that organisms are integrated wholes, not collections of independently optimized
  parts; that "perfecting selection" has limits; that adaptationism fails to distinguish
  adaptive features from non-adaptive ones.

  - Four criticisms (I recall roughly): (1) propensity to adopt the single adaptive
  hypothesis (a program of research that, if unchallenged, may give the impression
  of range); (2) failure to consider alternatives to the adaptive hypothesis — the
  alternatives being: no adaptive significance at all (neutral features), nonadaptive
  products of selection on other features (allometry, correlated characters), nonadaptive
  products of random drift/change, and features that were adaptive in an ancestral
  form but not in current utility; (3) the inability to distinguish adaptive from
  non-adaptive features currently; (4) emphasis on "perfecting selection" as the driving
  force and reducing organisms to collections of parts — a failure of holism. I should
  keep the prompt from requiring exact enumeration.

  - Voltaire''s Pangloss in Candide: the optimistic philosopher who insists everything
  exists for the best purpose — nose for spectacles, legs for trousers. Gould & Lewontin
  invoke this as satire on adaptationist reasoning that starts from a trait and invents
  a purpose.

  - They end with recommendations, and they do not deny adaptation/natural selection;
  they insist on testing, on considering alternatives, and on studying form and constraint.

  - Gould & Vrba 1982 "Exaptation—a missing term in the science of form" (Paleobiology)
  introduced "exaptation" for a character that currently enhances fitness but was
  not built by selection for its current role; spandrels (nonadaptive byproducts later
  co-opted) are one route to exaptation, along with shifts of function in adaptations.
  So exaptation ≠ spandrel, though spandrels co-opted for use become exaptations.

  - Common misreadings: that they claimed most traits are spandrels; that they were
  anti-Darwinian/anti-selection; that "spandrel" means any useless byproduct; that
  they denied the utility of adaptive thinking.


