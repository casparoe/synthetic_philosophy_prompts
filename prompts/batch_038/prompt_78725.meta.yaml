  \ contradictory but contradictions can be true (Beall's approach).\n5. Reject closure\
  \ of knowability under... hmm.\n6. The \"knowability\" operator is not factive about\
  \ the knowledge operator; treat \"it is knowable that p\" as there being a possible\
  \ world where p is known — with the twist that the proposition in question is world-indexed\
  \ and differs across worlds (the \"shifty\" content / indexical reply, e.g., John\
