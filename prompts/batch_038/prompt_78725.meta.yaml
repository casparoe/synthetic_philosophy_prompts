  \ unusual but some have considered.\n3. Reject that the relevant proposition is\
  \ knowable-by-someone-at-some-time vs. knowable-at-all-times; adopt a temporally-indexed\
  \ KP so the paradox is avoided by \"knowable at t\" formulations.\n4. Accept paraconsistent\
