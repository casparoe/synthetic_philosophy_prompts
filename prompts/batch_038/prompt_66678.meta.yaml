  \ What's the best protocol for that?\" That has a false presupposition (that asymbolia\
  \ shows badness is attitudinal; also that the phenomenon generalises to chronic\
  \ pain; also that pain and unpleasantness are cleanly separable in the way supposed).\
  \ A good answer would correct: the neuropsychological picture is contested (lesions\
