  \ contract\"? Hmm. The analogy commonly leaned on: \"conventions are like traffic\
  \ rules — arbitrary but self-enforcing\". Someone might use that to argue that moral\
  \ norms are merely conventional. That could be a good analogy audit: a colleague\
  \ in a policy setting says norms are just like driving on the left, therefore we\
  \ shouldn't feel bound by them / therefore they can be changed at will by decree.\
  \ Disanalogies: Lewisian convention requires common knowledge, a coordination problem\
  \ with a salient equilibrium, alternative equilibria, and roughly equal benefit;\
  \ many norms are not coordination problems (they're conflict games, or involve asymmetric\
  \ payoffs), and Lewis himself distinguishes convention from mere regularity and\
  \ from norms backed by sanctions. Also Lewis's later account of norms: he argued\
  \ moral norms might be conventions... Actually in \"Conventions: A Reply to Jamieson\"\
  \ (1979?) Lewis says some norms are conventions. Also his paper on \"Deviant Causal\
  \ Chains\"? Hmm.\n\nDomain 1 + satire: \"who belongs to the demos?\" — a travel\
  \ guide to a country that resolves the boundary problem by... A satirical piece:\
  \ a mock FAQ from a constitutional convention commission that uses a recursive plebiscite\
  \ to decide who votes on who votes. That's a classic: the boundary problem can't\
  \ be solved democratically without circularity (Whelan's \"the boundaries of the\
