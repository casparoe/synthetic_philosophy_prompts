  \ personally relevant — perhaps someone whose partner/parent has a condition affecting\
  \ pain, or a chronic pain patient. Hmm, \"personally relevant\" could be: I've recently\
  \ been invited to give evidence to a committee / I've been asked to write a policy\
  \ paper / my sister is a nurse.\n\nOption B: Domain 5 + false presupposition. E.g.,\
  \ \"Since patients with pain asymbolia feel pain but don't mind it, my clinician\
  \ says this proves pain's badness is entirely a matter of attitude — so the way\
