  \ the demos. The joke should come from getting the theory right.\n\nBut also required:\
  \ \"Write the prompt from the perspective of someone for whom the topic has recently\
  \ become personally relevant.\" and formal/polished, British English.\n\nLet me\
  \ think about which combination is strongest and most \"in the weeds\" without needing\
  \ search.\n\nOption A: Domain 5 (pain asymbolia) + analogy audit. Analogy: \"the\
  \ person with pain asymbolia is like someone who reads about a fire in a newspaper\
  \ rather than being in it\" — hmm. Actually a common framing: asymbolia shows pain\
  \ is like an itch you can switch off, or \"pain is like a warning signal, and asymbolics\
