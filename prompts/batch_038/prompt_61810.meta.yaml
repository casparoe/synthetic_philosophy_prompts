  whose experienced well-being differs greatly and *knowably* to us. Constraints:
  the difference must not be expressible in any choice they could ever face — if there
  is some menu on which they would choose differently, the case fails. Then: (a) show
  that the choice records really are identical and satisfy SRP; (b) state what a strict
