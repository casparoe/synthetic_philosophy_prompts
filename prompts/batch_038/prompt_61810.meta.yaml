  goods / reference dependence). Then choices over a fixed menu satisfy SRP, but "utility"
  as read off is menu-relative and doesn''t correspond to a welfare level. Constraint:
  "no externalities to others the agent cares about" would block the straightforward
  positional-goods story unless the positional element is intrinsic. Hmm.


  Another very neat one: *cost of choosing*. An agent choosing x over y reveals preference
  for x, but choosing costs something, so revealed preference systematically understates/overstates...
  this is the "menu costs" thing.


