  Here''s a cleaner and quite elegant structural wedge: **the revealed preference
  theorist reads the data as a ranking over bundles, but the agent''s welfare depends
  on the bundle *and* on which of the two the agent gives up** — i.e., loss aversion
  relative to an endowment. Then a choice function can satisfy SRP over a fixed choice
  set while the agent''s well-being differs... no, this doesn''t work either because
  SRP violations arise with endowment effects.


  OK here''s another: **the "utility is empty" identification case**. Two agents,
  identical choice functions, radically different inner lives. The revealed preference
  theorist (a strict Samuelsonian) says: the utility functions are the same up to
  monotone transformation, so nothing more can be said; welfare, if identified with
  preference satisfaction, is the same. The experienced-utility theorist says they
  differ enormously. Then: what additional choice data could distinguish them? Answer:
  in principle, choices over menus that vary the "inner life" — but that''s not observable;
  you''d need the agents to be able to choose between lives. Design: the two agents
  face, at one point, an identical menu that includes an option to take a pill that
  removes the torment. If the tormented one refuses, then their choice functions differ
  after all. So the case requires that no such menu exists — the difference is not
  choice-relevant. This is the deep point: revealed preference is silent about anything
  that doesn''t show up in choice, so it cannot be a theory of welfare unless welfare
  is choice-relevant. And the residue: is that a defect in revealed preference, or
  does it show the "torment" is not a welfare-relevant fact? That''s a genuinely good,
  in-the-weeds question.


  So the spec could be: "Build a pair of agents — ordinary lives, not sci-fi, no brain
