  Spec idea: "Construct a choice situation — an ordinary life setting, one agent,
  a finite menu of options chosen over a few occasions — in which the agent''s choices
  satisfy the strong axiom of revealed preference (so a consistent utility function
  rationalizes them), yet it is determinate that the agent is not maximizing their
  own well-being in any experiential sense, and where the standard escape routes are
  blocked: no framing effects, no mistaken beliefs about the options, no weakness
  of will, no changing tastes, no self-deception, and no externalities to others the
  agent cares about. In other words, the wedge between ''chosen'' and ''good for''
  must come from something structural rather than from a defect in the agent or the
  data."


  What structural feature could that be? Candidates:

  1. Preferences over the *process* of choosing (Sen''s "social commitment" / preference
  freedom) — but that''s not a defect; the welfare claim then needs "process-dependent
  welfare."

  2. Adaptive preferences formed under deprivation (Elster''s sour grapes) — but "no
  changing tastes" partially blocks; adaptive preferences are usually about formation,
  so the data at a time slice satisfy SRP while the agent is worse off. But this is
  a "defect in the agent" arguably.

  3. The agent chooses in a way that satisfies SRP but where the utility function
  that rationalizes it has content that the agent would disavow upon reflection —
  i.e., the identification problem: SRP delivers an ordinal ranking but not a comparison
  of levels, so nothing about how good the choice is follows.

  4. Preference vs. choice under commitment devices.

  5. The "utility is defined over states, but the agent''s choices are over acts and
  the states are correlated with the acts" — Savage-style: revealed preference can''t
  distinguish a utility function over consequences from one over acts; so an agent
  who chooses an act with a worse consequence profile but which is evidentially correlated
  with good states could satisfy SRP. That''s actually a neat structural wedge: the
  revealed preference theorist reads the choice as expressing preference over outcomes,
  but the agent''s preference is over acts; the wedge is act/outcome separation. Hmm,
  this gets into evidential decision theory territory.


  Actually, a cleaner and more classic structural wedge: *the menu-dependence of well-being*.
