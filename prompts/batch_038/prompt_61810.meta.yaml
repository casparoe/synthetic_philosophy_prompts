  Revealed preference: I like it. But the "meaning of utility" debate''s key players
  and positions: Samuelson''s revealed preference (operationalist: utility is a redundant
  label for consistent choice), the Bergson–Samuelson social welfare function, Sen''s
  critique ("Rational Fools", the social moron example, commitment vs. sympathy),
  Hausman''s "Preference, Value, Choice, and Welfare" (preferences as total comparative
  evaluative judgments, not necessarily desire-satisfaction), the "utility = happiness"
  revival (Kahneman''s experienced utility, Bentham), adaptive preferences (Elster),
  the "money pump" arguments, and the identification of utility from choice.


  A great spec: build a case where Sen''s "commitment" (acting against one''s preferences
  for reasons of principle) is ruled out, and where the agent''s choices satisfy SRP,
  and where Kahneman-style experienced utility says the agent is worse off after getting
  what they chose — but where the standard explanations (misprediction, adaptation,
  framing) are blocked. What structural feature could do the work? A candidate: the
  agent''s preferences are over *outcomes described in a certain way*, and their well-being
  depends on the *description-independent* facts — i.e., a case of preference satisfaction
  that isn''t welfare-enhancing because the preference was formed by a process that
  tracked something other than the agent''s good. But "no changing tastes / no adaptive
  preference formation" blocks that.


  Alternative structural feature: **the agent cares about the ranking itself, i.e.,
  preference for autonomy/self-direction, and the choice satisfies SRP but the well-being
  depends on whether the choice was self-governed.** Hmm.


