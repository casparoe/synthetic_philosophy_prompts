  ---

  I''m preparing a position statement for a graduate seminar on character and moral
  psychology, and I''d like a consistency audit before I circulate it. Here is my
  package:


  (a) Virtues are global traits. A courageous person is disposed to act courageously
  across a wide and heterogeneous range of situations, and it is this robustness that
  makes character a proper object of prediction, education, and praise.

  (b) The classic situationist studies — Milgram''s obedience experiments, Darley
  and Batson''s seminary study, Isen and Levin''s dime study — are methodologically
  sound and their results generalize: in ordinary agents, situational factors dominate
  dispositional ones in explaining behavior.

  (c) The replication crisis gives me no reason to revise (b). My methodological skepticism
  is directed at priming and other effects of that kind, not at the classic paradigms.

  (d) Situationism therefore does not threaten Aristotelian virtue ethics so much
  as it completes it: on Aristotle''s own account character is produced by habituation
  under the right laws and institutions, so a virtue ethicist should be the first
  person interested in the engineering of situations.

  (e) Doris-style local traits are no help. Traits indexed to narrow situation-types
  license no interesting predictions, and they cannot support the thesis that the
  virtues are unified in a single character.

  (f) Milgram''s participants are blameworthy. That they were ordinary people rather
  than sadists is the finding, not an excuse; the point of the study is that we cannot
  trust our own characters, which presupposes that we have them.

  (g) Praise and blame attach to an action only insofar as it expresses the agent''s
  character: what the room did to a person is not something to be laid at that person''s
  door.


