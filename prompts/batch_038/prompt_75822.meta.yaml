  Let me also double-check the technical claim I''m making in the opening, since accuracy
  matters: "Recognizing the truth of G(H) is recognizing Con(H)" — yes, for a standard
  Gödel sentence, Con(T) ↔ G(T) is provable in T (indeed, the equivalence is provable
  in the base theory). So a human who sees G(H) is true sees Con(H) is true. The second
  incompleteness theorem says H can''t *prove* Con(H) if H is consistent and satisfies
  conditions. Lucas-style responses: the human can know Con(H) not by proof within
  H but from outside, by surveying H''s axioms and rules; but if H is a system containing
  arithmetic, "from outside" is question-begging — this is the standard objection
  (Benacerraf, Putnam, Feferman). Also the soundness vs consistency distinction: the
  argument needs soundness (stronger), and the critic says we can''t know our own
  soundness. So my opening is a well-formed, genuine challenge. Also note: the objection
