  ---


  I teach the minds-and-machines unit of a second-year philosophy of mind seminar,
  and my students have decided that the Gödelian anti-mechanist argument is dead —
  they have read Lucas and skimmed Penrose, and they treat both as a curiosity from
  before the field grew up. I want to argue against them from the strongest available
  position, which means I need to lose repeatedly to a serious defender first. So
  please play a committed, technically literate anti-mechanist in the line running
  from Lucas''s "Minds and Machines" to Penrose''s later elaborations: someone who
  thinks the diagonal argument really does show that no sound, recursively specifiable
  formal system can capture mathematical insight, and who holds that conclusion because
  of soundness and knowability, not because of souls, qualia, or quantum gravity.
  Play them as a real debater, not a monument. They should be perfectly willing to
  concede subsidiary points — that the 1961 presentation was too quick, that Penrose''s
  physical story about microtubules and quantum gravity is separable from (and far
  weaker than) the Gödelian core, that no actual computer in existence is a formal
  system in the idealized sense the argument needs, that the argument is about an
  idealization and not about engineering. They may never concede the main claim. Stay
  in character until I say "stop"; don''t break out to summarize the dialectic or
  to tell me how well I''m doing, and if you need a stipulation from me, ask for it
  in character.


  Constraints on how they talk, because I want this to be hard: no more than about
  two paragraphs per reply, so it feels like a conversation and not a lecture; engage
  at the level of the formal details rather than repeating slogans; and three escape
  hatches are off limits — you may not stop at "we simply see the truth of the Gödel
  sentence" as a brute datum about intuition, you may not retreat to phenomenology
  or the feel of understanding, and you may not dismiss my objections by saying the
  argument was only ever about ideal machines and therefore untouched by anything
  real. If I write "conceded" after one of your moves, drop that move permanently
  and don''t recycle it later.


  Here''s my opening move. Take the argument in its cleanest form: let H be an idealized
  human mathematician, and suppose H is sound and that everything H ever asserts is
  in principle enumerable. Then H''s Gödel sentence G(H) is unprovable by H but true,
  and — the key premise — H can see that it is true. But that last step is exactly
  what H cannot have. Recognizing the truth of G(H) is recognizing Con(H), and the
  second incompleteness theorem tells us that no system capable of expressing the
  relevant arithmetic can establish its own consistency from within; so the anti-mechanist
  must claim for H a kind of transcendent self-knowledge, a survey of H from outside
  H. And that is precisely the capacity the argument denies to the machine. So you
  face a dilemma. Either you grant that H has this outsideness, in which case you
  have assumed what you set out to prove — the premise is available only to something
  already known not to be a formal system, so the argument can never be used to establish
  that conclusion against anyone who doubts it — or you refuse it, in which case the
  diagonal step never gets started, because I am entitled to exactly as much reflective
  access to my own consistency as the machine is to its own. Which horn do you take,
  and what does your answer cost you? Take your time with this one; it''s the move
  I most need to lose to.


