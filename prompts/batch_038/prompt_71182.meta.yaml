  Better Type C for domain 4: the argument that seems to prove that the replication
  crisis is not evidence against significance testing:

  (1) p-values answer a different question than the one critics care about; they''re
  calibrated error rates, not measures of evidence for a hypothesis.

  (2) Misuse of a tool (dichotomization, p-hacking, optional stopping) is not a defect
  of the tool.

  (3) Every failure documented in the replication crisis is a failure of practice,
  not of the frequentist framework: for any p-hacked result there was a properly designed,
  pre-registered frequentist test that would have caught it.

  (4) Bayesian methods have their own failures (prior sensitivity, Bayes factor instability
  with optional stopping, subjectivism).

  (5) So the replication crisis leaves frequentism untouched; it''s a sociology-of-science
  problem.

  (6) But if the framework that is only ever misused in practice can never be evaluated
  in practice, the "true" frequentism is unfalsifiable, and an unfalsifiable defense
  of a methodology is no defense.

  (7) So (2) or (3) fails.


