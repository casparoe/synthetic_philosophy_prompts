  Type C with domain 4: An argument that seems to show that no amount of replication
  could increase confidence in a result:

  (1) A result is credible only if the data support it.

  (2) Under the likelihood principle, only the observed data matter, not the sampling
  plan.

  (3) A replication is a new experiment with new data, but each replication considered
  alone gives the same likelihood ratio as the original if the effect size is the
  same.

