  before battle asking God not to reckon against him the deposition and murder of
  Richard II ("Not today, O Lord, / O, not today, think not upon the fault / My father
  made in compassing the crown!") — that is literally guilt inherited across generations
  within a nation/dynasty, exactly Jaspers''s problem, plus Hal''s earlier soliloquy
  in 1 Henry IV. And Henry''s own line about being "the scourge of God"? No. Also
  Henry''s claim to France rests on inherited right (Salic law) — collective, dynastic
  entitlement, the mirror image of inherited guilt.


  Jaspers''s four categories: criminal guilt (violation of law, judged by courts),
  political guilt (liability arising from membership in a state whose actions one
  benefits from/supports; judged by the victor/politics, and it''s collective in the
  sense that all citizens share the consequences), moral guilt (individual, judged
  by conscience and in dialogue with loved ones), metaphysical guilt (solidarity of
  all humans as such; failing to prevent an injustice makes one co-responsible; the
  survivor''s guilt of being alive when others died). Applying this to Henry V: Henry''s
  casuistry denies political/metaphysical guilt, asserting moral guilt is individual;
  Williams insists the king has "a heavy reckoning to make"; the Chorus and the play''s
  ending (Agincourt''s slaughter, Henry''s later death, the loss of France) supply
  a verdict: political guilt is discharged not in conscience but in history, by the
  state''s subsequent ruin. That''s a striking reading: Jaspers''s point that political
  guilt is settled by the victor and by consequences, not by individual innocence,
  maps onto the play''s epilogue: "so many had the managing of his state that they
  lost France and made his England bleed."


