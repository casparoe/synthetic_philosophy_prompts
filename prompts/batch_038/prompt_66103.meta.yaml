  Dennett uses this against Searle''s claim that syntax is not sufficient for semantics
  — Searle said intrinsic mental states have intrinsic content. Dennett''s response:
  there are no intrinsic intenders; all intentionality is derivative, and the appearance
  of intrinsicness comes from the fact that for us the interpretive background (evolutionary
  history, learning) is invisible/taken for granted. So human beliefs are as derivative
  as the computer''s.


  Common misrepresentations:

  1. "Dennett thinks you can''t put meaning into a machine, meaning only comes from
  the designer, so robots have no beliefs" — actually Dennett''s conclusion is that
  original intentionality is a myth, so robots are no worse off than us.

