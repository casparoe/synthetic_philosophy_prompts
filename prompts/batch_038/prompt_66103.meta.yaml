  — Dennett''s later view is that beliefs are real patterns (real patterns, 1991).

  3. Presenting the two-bitser as showing that interpretation is arbitrary — but Dennett
  argues that in real cases the interpretive constraints (pedigree, history, design)
  settle it non-arbitrarily, and that arbitrariness only arises in the stripped-down
  thought experiment.

  4. Presenting Searle''s reply (the Robot Reply / the Brain Simulator reply) as refutations,
  when they''re responses within the debate.

  5. Thinking the two-bitser is about "multiple realizability" — it''s really about
  the underdetermination of interpretation by intrinsic physical properties.

  6. Thinking Dennett''s argument is that syntax IS sufficient for semantics — no,
  Dennett''s point is that the syntax/semantics distinction collapses, not that syntax
