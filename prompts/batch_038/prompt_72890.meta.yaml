  ballots (has since 1975). It can win a plurality and it doesn''t matter — if it
  does, the real candidate with the most votes takes the office. When it got challenged
  in 2012, the state''s defence was basically that it''s a protest option meant to
  send a message, and that its outcome is no different from not voting at all. So
  the institution creates an official channel for a purely communicative vote, tallies
