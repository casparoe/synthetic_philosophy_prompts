  (1) Australia (and about twenty other countries) compels you to vote. You get a
  fine if you don''t turn up. But the ballot is secret, so the state can never actually
  check the thing it claims to be compelling — the only observable fact is that your
  name got marked off the roll. You can attend, take the paper, drop it in blank,
  and you''ve discharged the duty; nobody will ever know. And for the lower house
  you have to number every single box or your vote is informal, so the one way to
  register "none of these people" is to spoil the paper — which is also just a perfectly
  legal way of complying. So the state mandates an act it can''t observe, is indifferent
  to its content, and punishes only a checkable proxy.


