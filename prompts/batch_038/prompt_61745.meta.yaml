  plus the Quinean response that it''s all just inference to the best explanation
  wearing a funny hat) and it turned into six people using "transcendental argument"
  to mean six different things. Half the fights were about whether the conclusion
  is supposed to be about the world or only about our concepts, and nobody noticed
  they were switching positions mid-sentence.


