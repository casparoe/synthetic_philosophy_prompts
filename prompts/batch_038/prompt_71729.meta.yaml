  There''s a well-known result: Nalebuff (1989) gave an example where the player is
  told one envelope... Actually the known results:

  - With a bounded prior: no always-switch.

  - With an unbounded proper prior (e.g., a distribution with heavy tail like 2^n
  with prob 2^-n... that has infinite mean), you can construct cases where switching
  is favored for every observed value — this is the "always switch" paradox preserved.
  Christensen and Utts (1992) "Bayesian resolution of the two-envelope paradox" showed
  that there exist (proper, unbounded) prior distributions for which switching is
  advantageous regardless of the observed value — but then the expected values are
  infinite, so the recommendation is not paradoxical. Hmm, I think the result: they
  show that a switching-favoring distribution must have infinite expectation, hence
  the "paradox" dissolves. Actually yes — Christensen & Utts show that any distribution
  for which switching is always beneficial must have infinite expected value.


  So the asker''s claim ("once you insist the pot of money is finite, the whole thing
