  that expected-value reasoning breaks down for infinite cases..." — a confusion.
  Or a common misconception: that the paradox is resolved by noting that no prior
  distribution makes switching always favorable... Actually the standard resolution:
  the argument assumes the same distribution for the two amounts regardless of which
  envelope is opened; or that with finite bounded priors switching isn''t always beneficial.
  A false-presupposition prompt could be: "I read that the two-envelope paradox was
  solved by showing that the paradox only arises if you allow infinite expected values,
  so with any realistic finite amount of money the switching argument just goes away.
  Why does this still get taught as unsolved?" That rests on a subtle confusion: finite
  vs. unbounded distributions — there are finite-mean distributions where the naive
  switching argument still generates a paradox (e.g., Nalebuff-style / Christensen–Utts
  results showing that with proper priors, switching can be favored for some observed
  values but not all; and the "always switch" paradox requires improper priors, but
  the paradox in the finite case is that switching depends on what you observe — the
  Bayesian resolution). Also there''s the point that the standard resolution isn''t
  "the amounts are bounded" but the mistaken assumption of a uniform distribution
