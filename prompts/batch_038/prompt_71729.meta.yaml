  Another angle with real depth: the asker thinks the two-envelope paradox is a problem
  about decision theory (maximizing expected value) and that philosophers have settled
  it by showing that the switching argument commits a quantifier-scope error / a fallacy
  of reasoning about conditional probabilities. But there''s a genuinely contested
  area: (a) whether the paradox survives for the "unbounded" cases where a proper
  prior with infinite mean still generates a switching-advantageous result (yes —
  Christensen & Utts 1992 showed there are proper priors with finite/unbounded values
