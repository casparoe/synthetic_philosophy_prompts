  "I cover math and decision theory stuff for a magazine and I''m finally sitting
  down to write about the two-envelope paradox. From what I''ve gathered the resolution
  is basically settled now: the switching argument only works if you allow an infinite
  expected value — i.e. a prior spread over unbounded amounts — and once you insist
  the pot of money is finite, the whole thing evaporates. So why do philosophers and
  statisticians keep publishing papers on it? I want to know what''s still actually
