  switching strictly advantageous without looking, given a symmetric setup... Actually
  there''s a theorem: for any proper prior, the expected gain from switching without
  looking is zero (by symmetry, since the two envelopes'' contents are exchangeable).
  So indeed the pure a priori version dissolves for proper priors. So maybe the asker''s
  presupposition is closer to right than wrong. Hmm — that weakens the "subtle confusion."


  Let me refine the confusion: The asker conflates "finite total amount of money"
  with "finite expected value" and further assumes that the accepted resolution is
