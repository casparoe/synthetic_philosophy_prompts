  of the *mean* is what matters, not of the maximum amount; and even then, there remains
  a live puzzle about *why* the naive argument feels compelling, and about whether
  expected-value reasoning should be revised (the "infinite utility" debate). Also:
  Cover''s theorem (pick larger number) is a distinct result people confuse with the
  two-envelope problem. And there''s the "two envelopes without opening" symmetry:
  with any proper prior, switching a priori is neutral — that''s settled. And there''s
  the debate over whether the paradox is best diagnosed as a violation of the "principle
  of indifference" applied to an unbounded space.


