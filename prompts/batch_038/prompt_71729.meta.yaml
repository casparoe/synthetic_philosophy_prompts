  to accidentally present a minority position as the consensus."


  That''s good but let me sharpen the false presupposition so that a strong model
  has real work to do. The false presupposition: (1) that finiteness of the amount
  dissolves the paradox; (2) that there''s a settled consensus resolution. The correct
  answer: bounded/finite cases still generate a puzzle — with a proper prior over
  a finite range, switching is sometimes advantageous and sometimes not depending
  on the observed amount, so the naive "always switch" symmetry argument is wrong
  but there remain genuine puzzles about the variant where you don''t open the envelope
  (the "switching without looking" case, Broome''s version), the Christensen–Utts
  result showing that with certain (improper or unbounded) priors switching is favored,
  and Cover''s "pick larger number" theorem. Also the point that finiteness doesn''t
  save you: even with finite mean, you can construct cases (Nalebuff''s asymmetric
  variant, or the "unbounded utility" issue) — and importantly, the two-envelope paradox''s
  core is about the illegitimate use of a prior that is scale-invariant/improper (uniform
  over an unbounded range), which isn''t the same as "infinite expected value." And
  there''s a deeper point: the standard resolution (you can''t have a uniform distribution
  over an infinite range; conditional on observing amount x, the probability that
  the other envelope has 2x vs x/2 depends on the prior) is indeed widely accepted
  for the "open the envelope" version, but Broome''s version — where you never look
  — plus the claim that there''s an a priori asymmetry is still debated, and there''s
  also disagreement about whether the paradox is about probability theory, about rationality/expected
  value, or a mere artifact of ill-defined priors.


  Also relevant: the "finite bound" move: if the amount is bounded by N, then for
  observed values above N/2 switching is bad, so no always-switch strategy — this
  is a correct part of the standard resolution. But the presupposition "once the pot
  is finite the whole thing evaporates" is subtly wrong because (a) the paradox in
  Broome''s formulation doesn''t depend on looking at the amount, and (b) there are
  finite variants (e.g., where the distribution is bounded but the switching argument
  is reconstructed with the right conditional probabilities — actually with bounded
  priors the argument genuinely fails). Hmm — is it true that finiteness "evaporates"
