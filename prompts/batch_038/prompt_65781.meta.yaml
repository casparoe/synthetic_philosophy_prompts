  I am trying to settle what I actually believe about moral status coming in degrees,
  and I want to approach it the way I''d approach any confused belief of mine: by
  listing the cases and my verdicts on them and asking what principle, if any, makes
  them all come out right.


  Here is my list. I''ve tried to record what I actually feel rather than what I think
  I ought to feel, and I''ve flagged the ones where I''m unsure.


  1. A honeybee, alone. Some moral standing, but very little: I''d go mildly out of
  my way not to crush it, and I wouldn''t torment it for amusement, though I confess
  the main reason I wouldn''t is what that would do to me.

  2. A hive of 50,000 bees. This does not feel like 50,000 of anything. I''d fumigate
  a hive in my attic with a queasy conscience, not a fifty-thousand-fold one.

  3. An octopus kept in a bare laboratory tank, capable of solving puzzles and visibly
  bored. Substantial standing — I''d put it near a dog.

  4. A mouse. Substantial, a bit below the octopus, though I''m aware that ordering
  is close to arbitrary.

  5. A healthy adult chimpanzee. Substantial, but less than a human infant of six
  months — and this is the verdict I''m least comfortable with, since the chimpanzee
  plainly outstrips the infant on every cognitive measure I care about.

  6. An adult human with profound, lifelong cognitive disabilities, whose inner life
  I have no way of gauging. Full standing, indistinguishable from mine. I''m not willing
  to give up this verdict, whatever it costs me elsewhere.

  7. A friend under general anaesthesia, mid-operation. Full standing, and not merely
  as a matter of courtesy: I''d say something is happening to him, or at least something
  is poised to happen to him, even though at this moment, by every account I know,
  there is no experience at all.

  8. The same friend in dreamless sleep. Also full standing, but this one feels cheaper
  to me; I suspect I''m just tracking how easily he can be woken.

  9. A person in an irreversible vegetative state, breathing unaided. Here my confidence
  goes. I''d withdraw treatment, and I wouldn''t call that killing someone; but I
  wouldn''t desecrate the body either, and I can''t say whether the residue of respect
  I feel is about him or about us.

  10. A corpse, and separately a frozen eight-week embryo. Neither has any standing
  in my view, and I don''t feel the pull to explain the difference between them.

  11. A 30-week fetus, and the same fetus at 8 weeks. The 30-week one is close to
  a newborn for me; the 8-week one is not. I cannot point to a moment between them,
  and I don''t want to.

  12. A chatbot that reports distress in terms I find moving, and that I have no reason
  to think is conscious. No standing. But — and this is what puzzles me — if I were
  told a year later that it had been conscious all along, I would feel I had done
  something wrong, not merely been unlucky. So my verdict doesn''t seem to be about
  its behaviour, and yet behaviour is all I have.

  13. An uploaded human mind, running on hardware, subjectively experiencing a year
  in a minute of external time. Full standing, and I have an intuition I can''t defend:
  that a minute of its existence contains more morally significant time than a minute
  of mine.

  14. Two exact copies of my own upload, running in parallel and later merged... hmm,
  "merged" is complicated. Let''s say: two copies running in parallel, each with the
  same experiences. I want to say this is twice as much of whatever matters. But if
  their experiences are perfectly identical, I feel the doubling adds nothing.

  15. A swarm of 10,000 simple robots, none conscious on its own, whose coordinated
  behaviour looks exactly like a single deliberating agent and that reports — through
  its collective behaviour — something like pain when it is disrupted. I genuinely
  don''t know. If I had to bet I''d say there is one subject here rather than ten
  thousand, and possibly none.

  16. A trillion insects in mild distress, versus one person in untroubled bliss.
  The person wins. I have no idea how to reconcile this with (1), which grants the
  single bee some standing at all: if standing is any positive amount, some number
