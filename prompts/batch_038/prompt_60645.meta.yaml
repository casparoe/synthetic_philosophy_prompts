  Hmm, careful: even in the scenario, the standard reply is: if you accept G(F) plus
  new information (the demon''s testimony), your total reasoning is F + demon-info,
  not F. That''s the classic "information from outside" objection. So the sub-question:
  does the oracle''s testimony count as *new premises* not in F? If F is supposed
