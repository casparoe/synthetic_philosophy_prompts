  Before I read another defence of a particular start date for the Anthropocene, I
  want the specification, not the candidates. Suppose the purpose is a single boundary
  that could serve both jobs at once: acceptable to the International Commission on
  Stratigraphy as a formal base of an epoch, and usable by a historian as the periodising
