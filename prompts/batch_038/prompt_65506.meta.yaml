  a boundary that is a process rather than an event, a marker that records the *absence*
  of human activity rather than its arrival), the distinctions it must not collapse
  (a chronostratigraphic unit versus a cultural concept; the onset of influence versus
  the onset of detectability; defining a boundary by an effect versus explaining it
  by a cause), and the results it must be consistent with (ice-core and radionuclide
  archives, the demographic collapse of the Americas after 1492, the rules the stratigraphic
  commission actually applies).


