  Design considerations:

  - Formal/polished tone.

  - Type: analyze a real episode through the lens of a theory (Zhuangzi''s views on
  death as the lens).

  - Supply the salient facts so the model needn''t recall contested details.

  - Inject niche/less-regurgitated ideas: the interpretive debate about quietism vs.
  skilled spontaneity (Cook Ding, the swimmer at the waterfall, the bell-stand carver),
  the "your body and life are not your own but on loan from heaven and earth" motif,
  the qì-transformation account of the wife''s death with the initial grief admission,
  the skull dialogue, Zhuangzi''s deathbed instructions about heaven and earth as
  coffin and being eaten by birds above vs. ants below, the notion that fearing death
  is like a lost child who has forgotten the way home, and the "rest in the time,
  abide in the flow" idea where excessive grief is described as an evasion/doubling
  of punishment (careful with translation — paraphrase).

  - Ask the model not to quote translations; paraphrase instead.

  - Require: disciplined mapping — what counts as the morally salient features on
  Zhuangzi''s view vs. on the law''s view; what the theory says about the actors (patient,
  prescribing physician, the state, the family); where the theory is silent (rights,
  consent, institutions, third parties, slippery slopes, the social meaning of a law);
  and what the episode does to the theory (does it show Zhuangzi''s view is a consolation
  ethics but not a public ethics? does the empirical record — autonomy/dignity rather
  than pain — vindicate or embarrass him? does it reveal the theory never anticipated
  a case where a person deliberately hastens rather than merely accepts?).

  - Include the twist: hastening death is a "human" intervention in a "heavenly" process
  — does Zhuangzi''s tiān/rén distinction forbid it, or is that distinction not the
  quietist one?

  - Also ask about the second-order point: is the Zhuangist critique aimed at the
  patient or at the polity; and whether Zhuangzi can even formulate the question "may
  the state permit it?" — i.e., is he silent, or does he dissolve the question?

  - Ask about what the theory gains/loses.

