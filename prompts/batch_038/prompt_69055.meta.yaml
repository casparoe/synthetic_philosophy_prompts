  I like "Peer disagreement" with the commitments-audit type. That gives rich structure:
  conciliationism (equal weight view), steadfastness, the uniqueness thesis, the possibility
  of misleading evidence, the "spinelessness" objection, self-trust, the total evidence
  view, disagreement about disagreement, the problem of the "mystery pill" (Elga''s
  argument), Kelly''s "New Evil Demon" style arguments, Christensen''s argument from
  the epistemic permissiveness... Actually a good niche injection: Christensen''s
  "disagreement as evidence" argument relies on the claim that learning of a peer''s
  disagreement is evidence about your own reliability; Elga''s argument that conciliationism
  follows from the uniqueness thesis plus a diachronic Dutch-book-ish consistency
  requirement ("conditionalisation on the hypothesis of disagreement"); and the famous
  tension: conciliationism seems to require you to give up conciliationism when you
  encounter disagreement about conciliationism (the "self-defeat"/spinelessness objection).
  Also the tension between conciliationism and the permissiveness of rational disagreement
  (if rational agents can permissibly disagree, then the peer isn''t necessarily wrong).


  Another good, less-quoted tension: the "no independent check" problem — you can''t
  assess your peer''s reliability on p without reasoning about p, which begs the question
  (Elga''s response: you can still have a prior on reliability independent of the
  disputed reasoning). And the tension between conciliationism about first-order claims
  and the requirement of total evidence: if you have private evidence your peer lacks,
  you''re not a peer.


  The user wants: one or two genuine tensions that are not obvious, plus at least
  one apparent tension that dissolves. And a niche/new idea injected so the model
  can''t just regurgitate. Also formal/polished British English.


