  Draft:


  "I am preparing a written statement of my position on the epistemology of disagreement
  for a departmental reading group, where it will be circulated in advance and attacked
  in detail. Before I do so, I would like a consistency audit rather than a survey
  of the literature or a defence of any single view. My commitments are these:


  1. Uniqueness. For any given body of total evidence and any proposition, there is
  exactly one doxastic attitude — credence, if you prefer to talk in degrees — that
  the evidence permits. There is no rational slack: two agents with identical total
  evidence cannot both be rational while disagreeing.


  2. The equal-weight rule. If I discover that someone who is my epistemic peer on
  the question at hand holds 0.2 in a proposition to which I assign 0.8, then I should
  move to 0.5. I take peerhood to be settled by four things: comparable general intelligence,
  comparable honesty and diligence, access to the same evidence, and a comparable
  track record on questions of the same general kind.


  3. No independent re-examination. The move in (2) must be made without going back
  over my own first-order reasoning on the disputed question, since doing so is precisely
  what is in dispute; if I were permitted to re-run my argument and conclude that
  it was sound, the rule in (2) would never bite.


  4. Peerhood can be revised downwards on private evidence. I may discount a peer''s
  opinion where I possess evidence about their reliability that they lack — for instance,
  that they had almost no sleep the night before, or that they stand to gain financially
  from a particular answer, or that on a hundred comparable questions in the past
  they have turned out wrong rather more often than I have.


  5. Order-invariance. What I ought to believe should be a function of my total evidence
  alone. If two agents end up with the same total evidence, they ought to end up with
  the same credences, however the components of that evidence reached them.


  6. Meta-level steadfastness. When the disagreement concerns the epistemology of
  disagreement itself — when, that is, my peer endorses steadfastness and I endorse
  conciliationism — I need not conciliate. I may hold fast on the meta-question while
  conciliating on first-order questions.


  7. No spinelessness. I am confident that (2) cannot push me into scepticism. Because
  I conciliate only with genuine peers, and a genuine peer is by construction no less
  likely than I am to have got things right, moving halfway can never carry me from
  a confident, well-supported judgement to a sceptical one.


  Three things I would like from you:


  (a) Work through the list and tell me which pairs genuinely pull against one another
  and which merely appear to. For each genuine tension, state its severity, say exactly
  what would have to be given up to remove it, and give the cheapest available revision
  together with what that revision costs me elsewhere in the list. Do not report every
  pair as problematic; I want to be told plainly which combinations are stable and
  why.


  (b) Where the diagnosis turns on numbers — and I suspect that in at least one place
  it does — show the arithmetic explicitly rather than asserting the result.


  (c) Finish by identifying the single commitment whose abandonment would leave the
  largest coherent remainder, and say what distinctive feature of my position I would
  lose along with it.


  Please assume I have no attachment to any particular item; I would rather be told
  that (2) has to go than discover it in front of an audience."


