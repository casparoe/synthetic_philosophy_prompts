  Let me reconsider. Where do counterfactual and interventionist accounts genuinely
  diverge?


  1. Overdetermination/preemption: Lewis''s counterfactual analysis fails for early
  preemption and (in its simple form) for overdetermination; interventionism handles
  symmetric overdetermination better (single-variable intervention on either of two
  sufficient causes changes the outcome... no wait. If A and B each suffice for E,
  then intervening to make A=0 while B=1 leaves E=1. So E doesn''t change. Hmm. So
  under standard interventionist semantics with a variable for each candidate cause
  and holding the other fixed at its actual value, neither A nor B is a cause. Woodward
  addresses this by appealing to the notion that in such cases the model should represent
  the two causes as one variable, or by using "invariance" and considering that the
  generalization "if A=1 or B=1 then E=1" is invariant. Actually Woodward''s answer:
  overdetermination cases show that you need to consider "contributing causes" and
  that the right move is often to treat the disjunctive structure. There''s literature
  on this (Woodward 2003, "Making Things Happen", § on overdetermination; also Menzies
  & Price; and the "trumping preemption" by Schaffer.)


  2. Non-causal counterfactual dependence: effects of a common cause, and "backtracking"
  counterfactuals. Interventionism: barometer reads low → storm comes; intervening
  on the barometer doesn''t change the storm. So the barometer''s reading isn''t a
  cause, even though counterfactual dependence exists ("if the barometer hadn''t read
  low, there wouldn''t have been a storm" — true under a non-backtracking reading?
  Actually under Lewis''s semantics with the actual world''s laws and the closest
  world, if the barometer reading differs then either the pressure differs (backtracking,
  rejected) or... hmm, Lewis''s account gives non-backtracking counterfactuals, so
  "if the barometer hadn''t read low, the storm would still have come" — because to
  change the barometer without changing the pressure requires a miracle/local intervention.
  Lewis handles it: the counterfactual is false, so no causation. Fine.)


  3. Causation without counterfactual dependence in cases of "double prevention" and
  "absence causation": Counterfactual theories make absences causes (the gardener''s
  failure to water), which leads to rampant causation by omission. Interventionism
  is more restrictive: you can''t intervene on an absence in the same way, but Woodward
  does allow variables to take "default" values and treats omissions as causally relevant.
  Still, the "problem of absences" is a big deal for counterfactual accounts.


  4. The counterfactual account''s fragility: Lewis''s "influence" and the problem
  of "extravagant" close worlds; also the "effect of a small change" vs "invariance
  across a range of changes" — this is the interventionist''s distinctive notion:
  causation is about *invariant generalizations* that support manipulation, and about
  how the effect *varies* with the cause, not just whether it counterfactually depends.
  So the interventionist cares about "would raising the dose change the outcome in
  a stable way across a range of background conditions" — that''s what makes a relationship
  *exploitable* for control. Counterfactual dependence is an all-or-nothing, single-world
  comparison; interventionism is about a pattern of dependencies.


