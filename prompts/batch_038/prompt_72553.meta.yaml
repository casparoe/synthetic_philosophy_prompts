  Concrete situation idea: A student is on a university committee investigating a
  blackout/outage or a data breach, and must write a "root cause" line in the report.
  Two candidate causes: an action that, had it not occurred, the outcome would still
  have occurred (because a second independent failure was already in place), and something
  that only "caused" it in a counterfactual sense. Actually the cleanest structure
  for counterfactual vs. interventionist divergence:


  (a) Overdetermination: two sufficient causes, each individually counterfactually
  irrelevant ("if I hadn''t done it, it would have happened anyway") but each is an
  intervention point. Counterfactual theory says neither caused it; interventionism
  says both are causes (well, interventionists handle overdetermination by saying
  that interventions on each variable individually... hmm, actually with simultaneous
  overdetermination, intervening on one alone does change the outcome, so each is
  a cause on the interventionist account too — that''s the interventionist advantage
  over counterfactuals).


  (b) Non-causal correlation / common cause: e.g., "the department''s coffee machine
  broke and the printer broke on the same day because of a power surge" — counterfactual
  dependence without causation. Interventionism says: intervening on the coffee machine
  wouldn''t change the printer, so no causation. This is the classic "spurious correlation"/"effects
  of a common cause" problem, which counterfactual theories struggle with (Lewis needed
  the "quasi-miracle" / asymmetry of overdetermination).


  (c) Double prevention: "I let the backup generator''s inhibitor fail, which allowed
  the generator to run" — counterfactual dependence but intuitively no causation (or
  debatable). Interventionism handles it by noting it''s causation but non-causal
  relevance? Actually Woodward/Meniesies treat double prevention as genuine causation
  which is counterintuitive.


  (d) The "barometer" case: perfect dependence, no causation, and no possible intervention
  (e.g., you can''t intervene on a variable except in ways that also change others
  — non-modular / "the intervention isn''t surgically possible"). Interventionists
  distinguish "cause" from "correlate that isn''t invariant under interventions".
  E.g., variables that can''t be independently manipulated — the classic problem of
  "sufficiently entangled" systems, or of macro variables whose interventions are
  impossible in principle (e.g., interventions on "the initial conditions of the universe").
  Also relevant: interventionism''s requirement that interventions be possible in
  principle, and cases where interventions would be physically impossible (Woodward''s
  "soft" interventions vs. "hard" interventions).


  (e) Counterfactuals with "impossible antecedents" / vacuous counterfactuals: Lewis''s
  analysis says counterfactuals with impossible antecedents are vacuously true.


