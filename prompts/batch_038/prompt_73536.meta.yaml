  The F-twist, per Samuelson (1963): "the F-twist is the fallacy of identifying ''factual
  realism of a hypothesis''s assumptions'' with ''predictive success of the hypothesis''."
  Actually, more commonly stated: Friedman argues that a theory should be judged by
  its predictions, not the realism of its assumptions, and then slides into claiming
  that successful prediction shows the assumptions are realistic-as-if. The twist
  is that Friedman''s own positive argument for his thesis rests on the unrealistic-assumptions
  premise: he claims that because more relevant phenomena can be explained only by
  abstracting from complexity, assumptions must be unrealistic; then he treats the
  success of the predictions as confirming the theory, which is a covert realism claim.
  Samuelson said something like: Friedman''s position, when you look at what "as if"
  means, is that assumptions can be false in unimportant respects but must be true
  in important respects — and Friedman''s examples (the expert billiard player who
  acts "as if" he knew the formulae; the firm acting "as if" it computed marginal
  revenue = marginal cost) actually depend on the assumption being true in some respect:
  the billiard player''s shots really are approximately as the formula predicts, and
  the firms that survive really did behave in ways well-approximated by MR=MC. So
  the "as if" talk smuggles in a realism-of-assumptions-in-relevant-respects requirement.
  That''s the F-twist: the equivocation between "false in detail" and "false in the
  relevant respect," plus the slide from predictive success to as-if truth.


