  Question: "Emotions have been analysed as judgments, as perceptions, and as feelings.
  Explain what each analysis claims, and say what recalcitrant emotion is supposed
  to establish about them. Which analysis comes out best, and why?" (25 marks)


  Answer:


  "There are basically three ways to say what an emotion is. The judgement theory
  says an emotion is an evaluation — to be afraid of the dog is to judge that the
  dog is dangerous. The big advantage is that it explains why emotions can be reasonable
  or unreasonable: a judgement is the kind of thing that can be supported by evidence
  or contradicted by it, so fear can be assessed in a way that a shiver can''t. It
  also explains why emotions are about things, and why you can argue someone down
  from one — if the judgement goes, the emotion should go with it.


  The feeling theory says the emotion is the felt character of the episode: the tightness
  in the chest, the racing heart, the way the world feels different when you''re in
  it. On this view being afraid just is feeling your body getting ready. The third
  option, the perception theory, is a more developed version of this — it says emotions
  are perceptions, so what you''re registering is a felt change rather than a thought
  about the situation.


  Recalcitrant emotions are cases where the emotion hangs on after the belief has
  gone. I know the spider on the wall is harmless, I have no doubt about it, and I
  still won''t go near it. People who fly a lot know the plane is safe and are still
  gripping the armrests. This is supposed to be a problem for the judgement theory,
  and for exactly the reason given above: if the emotion were the judgement, then
  getting rid of the judgement would get rid of the emotion, and it doesn''t. It''s
  a problem for the perception theory too, since you can''t be perceiving danger and
  simultaneously believing there''s none — the two states have contradictory contents
  and one of them has to give. It''s also the same problem as the objection that animals
  and babies have emotions without being able to make judgements.


  So the judgement theory and the perception theory both fail, and what''s left is
  the feeling theory: the emotion is just the feel of it, and whatever it is about
  gets supplied by the beliefs that happen to be going on at the same time. This is
  confirmed by anxiety, which is the one emotion with no object at all — you just
  feel bad — and it fits the theory perfectly because on the feeling theory there
  was never any requirement that an emotion be about something. The feeling theory
  therefore comes out best: it doesn''t have to explain away the spider, it just says
  the fear is real even though the belief isn''t."


