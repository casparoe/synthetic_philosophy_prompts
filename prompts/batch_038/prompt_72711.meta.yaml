  what the procedures themselves assume. The tradition I am now reading — the Nyāya
  school, whose founding text is attributed to a figure called Gautama or Akṣapāda
  — regulates philosophical debate with an almost legalistic precision that reminds
  me of nothing so much as the referee reports and rebuttal letters I used to write.
  As the reading group describes it, there are three recognized kinds of discussion:
  one whose stated aim is simply to establish what is the case, a second in which
  each side defends a thesis with the avowed aim of victory, and a third in which
  one party advances no thesis at all and confines itself to demolishing the other''s.
  The same tradition specifies that a proponent''s case must be laid out in five ordered
  steps — the thesis, the reason, an appeal to a familiar example in which the connection
  between reason and target is actually observed (kitchen fires and smoke, or a misty
  lake where smoke-like vapor appears but no fire does), the application of that example
  to the case at hand, and a restatement of the thesis. A mere statement of the general
  rule is not enough; you must point to a real instance. Finally, there are codified
  "occasions of defeat": misdescribing the opponent''s words so as to catch them out,
  producing rejoinders based on superficial similarity rather than on the actual reason,
  silence, repetition of what has already been said, and so on — with an assembly
  present to judge.


  Now, this is where I am puzzled, because I know the school''s own theory of knowledge
  and it does not look like a theory that would license this institution. Nyāya holds
  that there are four distinct sources of knowledge — perception, inference, comparison
  or analogy, and testimony — and it defines a piece of knowledge as a cognition that
  is both true and produced by one of those sources, so that the whole matter turns
  on the causal pedigree of a belief rather than on anyone''s ability to defend it
  in public. A true belief that arrives by a defective route is, on that account,
  not knowledge at all, however well it can be argued for. So: what theory of knowledge,
  or of justification, does the debate institution presuppose? ... [ask the questions]


