  "Popper''s paradox of tolerance starts from a simple claim about what tolerance
  costs. If a society extends unlimited tolerance even to those who are themselves
  intolerant, and refuses to defend itself against them, then the intolerant will
  eventually destroy the tolerant society and tolerance with it. Tolerance that never
  draws a line is self-defeating: it hands its own destruction to the people who would
  use the freedom it grants to abolish it. So, Popper concludes, we are entitled —
  in the name of tolerance itself — to refuse tolerance to the intolerant, at least
  when they refuse to argue rationally and instead answer criticism with violence
  or with prohibitions on their followers listening to criticism. Importantly this
  isn''t a first move: Popper thinks we should try to counter intolerant movements
  with rational argument and public opinion first, and that suppression is a last
  resort when they have placed themselves outside the space of reasons.


  Rawls approaches the same problem from the other end, and reaches the same place
  by a longer route. For Rawls the question is what principles free and equal persons
  in the original position would choose for the basic structure, and equal liberty
  of conscience is one of them. Since no one in the original position knows their
  own comprehensive doctrine, no one could accept a principle licensing the majority
  to suppress doctrines it happens to dislike. But Rawls recognizes that a just society
  may face groups whose own aims are intolerant — a sect that, if it gained power,
  would not extend liberty of conscience to others. Here he agrees with Popper: the
  tolerant are not required to allow such groups to undermine the institutions of
  justice, and when there is a genuine danger to those institutions and to the liberty
  of others, their liberty may be restricted. So both authors accept a limit on tolerance;
  Rawls simply adds the requirement that the limit be justified by the principles
  of justice rather than by the fact of intolerance.


  Where they differ is mostly a matter of foundation and tone. Popper argues from
  consequences: tolerance is a practice that can fail, and a failed practice protects
  nothing, so the limit is prudential and open-ended, to be judged case by case. Rawls
  argues from right: the limit must be drawn by the same principles that establish
  liberty in the first place, and it can only ever be as wide as the danger requires.
  On this account Popper''s formulation is vulnerable to abuse, because anyone can
  claim to be defending tolerance while actually defending their own position; Rawls''s
  is not, because the appeal to the original position fixes a single standard that
  applies equally to the intolerant and to those who would suppress them.


  The upshot is that the paradox of tolerance is not a logical paradox in the way
  the liar paradox is. Nothing about the concept of tolerance is contradictory. It''s
  a practical problem about how a regime of tolerance keeps itself in existence, and
  both authors solve it in the same way: tolerance is limited exactly at the point
  where its own continuation is threatened."


