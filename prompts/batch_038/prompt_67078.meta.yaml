  can''t tell what''s relevant'' — but the technical one from McCarthy and Hayes and
  what Fodor and Dennett did with it: an agent that has all the right beliefs in its
  store still can''t work out which ones bear on the action in front of it, can''t
  list all the conditions that have to hold for an action to have its usual effect,
  and can''t afford to check the endless list of things that stay the same. Dreyfus''s
  version too, where the lesson is that you can''t run background coping on explicit
  rules at all.


