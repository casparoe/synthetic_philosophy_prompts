  whose *distributions are observationally identical from outside*: a public lottery
  whose posted odds everyone can see, and a private menu from which the player silently
  picks their own odds, paying a token cost for the safer options. Nobody else, and
  no administrator, can tell after the fact which regime a given player was under,
  or which option they took from the menu.

  - Losses trigger a claim to a common compensation fund. To be paid, a claimant must
  file a claim and submit to questioning by a student panel playing the Compensation
