  I think Kierkegaard''s Abraham is very good territory: the "teleological suspension
  of the ethical" is famously misread as "God''s command overrides morality so anything
  goes" / "faith means believing absurdly against evidence". Subtle misrepresentations
  available:


  1. Conflating the teleological suspension with divine command theory (that right
  and wrong are just what God commands). Kierkegaard (de silentio) is not straightforwardly
  offering DCT; the suspension is that the ethical (the universal) is suspended, not
  abolished, and Abraham''s relation to the absolute (God) is higher than the universal;
  the ethical is reinstated but "the single individual is higher than the universal"
  — and Kierkegaard stresses that Abraham cannot be mediated, cannot speak, cannot
  be understood. Also crucially: Abraham has faith that he will get Isaac back "by
  virtue of the absurd" / "in this life" — the double movement of resignation and
  faith; the knight of faith vs the knight of infinite resignation. A summary that
  says "Abraham was willing to lose Isaac and that''s the point — faith means accepting
  loss" is actually the knight of infinite resignation, a subtle error.


  2. The claim that Abraham is a hero/martyr praised by the church, whereas de silentio''s
  point is that he is not a tragic hero (compare Agamemnon, Jephthah, Brutus — the
  tragic heroes act for a higher universal and can be understood and wept with; Abraham
  cannot speak, cannot be understood). A summary that lumps Abraham with the tragic
  heroes, or that says "Kierkegaard''s point is that Abraham is the greatest hero
  of faith" is partly right but might miss the isolation.


  3. The claim that the ethical = social convention/morality and God = religion, so
  the suspension is "religion trumps morality". Also, that Kierkegaard endorses this
  as a general principle applicable to anyone hearing a divine command — whereas Johannes
  de silentio insists it cannot be generalised, that he himself cannot do it, and
  that it''s a "paradox" that defies mediation; also that the sign of the genuine
  suspension is not detectable from outside (the demoniac vs the knight of faith look
  identical externally) — this is a nice detail: Fear and Trembling says the knight
  of faith looks exactly like a tax-collector/bourgeois, and de silentio worries that
  you can''t distinguish Abraham from a would-be murderer. That''s a strong element.


  4. Pseudonymity: the book is by Johannes de silentio, and it is a pseudonymous work
  that doesn''t necessarily represent Kierkegaard''s own view; and Fear and Trembling
  is a "dialectical lyric", with multiple "Attunements"/exordia and four retellings
  of the story in the final "Preamble"/"Panegyric". A summary that says "Kierkegaard
  argued..." flatly ignores pseudonymity — that''s a common simplification, not a
  howler necessarily, but worth flagging.


  5. The claim that Abraham''s willingness to kill Isaac is a "test" whose point is
  obedience; de silentio emphasizes the movement of faith — getting Isaac back — and
  that Abraham "believed by virtue of the absurd that God''s promise would be fulfilled",
  and he loved Isaac more than ever (the knife scene: "he had faith and he loved his
  son"). Also: "Abraham did not lose Isaac" and "everything was restored" — the happy
  ending is essential.


  6. Also the claim that the ethical is suspended because God commanded it → the "divine
  command" reading; but there''s also a reading (e.g., that Fear and Trembling is
  about the limits of Hegelian mediation, "the universal" being Hegel''s Sittlichkeit).
  A summary that frames it as anti-utilitarian or as a critique of Kant''s categorical
  imperative would be a subtle misplacement. Also there''s the point that Kant''s
  Religion discusses Abraham: Kant says if a voice commands you to kill your son,
  you cannot be sure it''s God — you should treat it as an illusion. That''s a real
  thing in Religion within the Bounds of Bare Reason. Actually Kant''s example involves
  a man who thinks a voice commands him to kill his son — Kant says he should hold
