  The no-trade theorem (Milgrom & Stokey 1982): if agents are Bayesian rational, share
  a common prior, and have common knowledge of their respective information and preferences,
  then there will be no speculative trade — any Pareto-improving trade occurs before
  information arrives; once they have common knowledge of each other''s information,
  no further trade occurs. Related: Aumann''s agreeing to disagree (1976) — with common
  prior and common knowledge of opinions, posteriors must be equal.


  Genuine counterpoints:

  - Real trade happens because of heterogeneity in preferences/endowments, not just
  beliefs (so the theorem only rules out *speculative* trade, not all trade).

  - Common prior assumption is doing the work: if priors differ, trade is possible;
  but priors differ isn''t "irrationality."

  - Common knowledge is a strong idealization: with only finite levels of "level-k"
  reasoning, trade is possible even with common priors. Morris (1994) showed common
  knowledge of rationality/priors can fail and disagreement is possible even with
  common priors if there''s no common knowledge of the prior... Actually Morris (1994)
  "Trade with heterogeneous prior beliefs and asymmetric information" — showed trade
  can occur without common knowledge of priors. Also there''s a literature on "agreement
  to disagree" with non-common priors.

  - Also: even with common knowledge and common priors, trade can occur if it''s about
  hedging against future states (risk-sharing), not speculation.

  - Also: the theorem presupposes that the trade would be common knowledge; but if
  the *offer to trade* itself conveys information, then the fact that trade is offered
  signals something, which unravels (like the "market for lemons" / lemon-principle
  unraveling). Aumann''s argument: if I offer to trade, you know I think it''s good
  for me, which means bad for you...

  - Key subtlety: the theorem says no trade in *equilibrium* with common knowledge
  — but people trade because the act of trading isn''t common knowledge.

  - Also relevant: noise traders / liquidity needs (Grossman-Stiglitz paradox: if
  prices fully reveal information, nobody has incentive to gather it — so markets
  can''t be fully informationally efficient; requires noise traders). That''s a good
  "in the weeds" adjacent thing.

  - Also: the epistemology of markets — Hayek''s claim that prices aggregate dispersed
  knowledge; the no-trade theorem arguably undercuts Hayek by saying a fully rational
  market would never trade on information. Interesting tension: Grossman-Stiglitz
  vs. Hayek.


  Let me build a disagreement between two people — say, two colleagues/friends. Rounds:


  1. A: says the no-trade theorem proves that stock market speculation is irrational
  or at least that the "wisdom of markets" story is a myth, because with common priors
  and common knowledge of rationality, no one should ever trade on private information.
  Therefore any trade that does happen must be based on someone being irrational or
  fooled.

  2. B: replies that''s wrong — the theorem only rules out *speculative* trade premised
  on differential information; plenty of trade is driven by differing risk preferences,
  liquidity needs, life circumstances (someone selling a house because they move,
  hedging). Also the theorem assumes common knowledge which is a very fragile idealization;
  you don''t have common knowledge of my information.

  3. A: says that''s dodging: strip out the hedgers and liquidity traders, and what''s
  left is exactly the speculative trade the theorem says shouldn''t happen — so either
  the remaining traders are irrational, or the market price can''t be aggregating
  information. And A adds: it also cuts against Hayek — if the price already reflects
  everything, why would anyone pay to acquire information? (Grossman-Stiglitz). So
  markets need noise traders to survive, i.e., irrational people are structurally
  necessary.

  4. B: says A''s move is question-begging, because the common prior assumption is
  what''s doing all the work: two people can be perfectly rational and still have
  different priors (priors aren''t chosen; they''re not truth-apt), and then trade
  is rational and informative. B might invoke: if priors differ, then Aumann/Milgrom-Stokey
  simply don''t apply, and there''s no irrationality; the price still aggregates something.

  5. A: retorts — a "common prior" is supposed to be a model of what rational agents
  would believe before receiving evidence, and the whole point of the prior is that
  it''s the prior of *rational* agents facing the same problem; if you let priors
  differ arbitrarily, the theorem is vacuous and you''ve conceded that the market
  price can''t be treated as a common knowledge object. Also: differences in priors
  that are just "brute" look like smuggling irrationality back in.

  6. B: last move — maybe B says that even granting common priors, the unraveling
  argument requires that each party know that the other is reasoning about the fact
  of the offer, recursively, and that in real markets orders go into anonymous pools
  where the offer doesn''t reveal whose information it reflects; anonymity breaks
  the signaling channel. So the theorem''s bite depends on the market microstructure
  being one where the offer is itself informative.


