  Let me draft a fine-tuning "proves too much" argument:


  (1) Confirmation works by likelihood comparison: evidence E confirms hypothesis
  H over alternative A just in case P(E|H) > P(E|A).

  (2) Let E = the values of the constants in our universe are life-permitting (or
  narrowly life-permitting within a huge space of values).

  (3) P(E | Design) is high: a designer who wants embodied observers will choose life-permitting
  values.

  (4) P(E | Chance) is tiny: on a plausible reference measure over the space of possible
  constant-values, life-permitting regions are a vanishingly small fraction.

  (5) So E strongly confirms Design over Chance.

  (6) The same likelihood principle applies to any observation, no matter how ordinary.
  Consider E*: the exact arrangement of dust specks on my desk this morning. P(E*|Chance)
  is astronomically small too — smaller than P(E|Chance), if the space of arrangements
  is large enough.

  (7) And there is always some hypothesis H* on which E* is likely: e.g., a hypothesis
  that the desk was arranged by an invisible gremlin who delights in this particular
  pattern; or, more prosaically, "the arrangement is exactly as I remember leaving
  it" — no. Better: H* = "a prankster arranged my desk in precisely this pattern,"
  where the prankster is defined post hoc as delighting in this very pattern.

  (8) By (1), E* confirms H* over Chance at least as strongly as E confirms Design
  over Chance — indeed more strongly, since P(E*|H*) can be made ~1 by tailoring H*
  to E*.

  (9) But E* obviously doesn''t confirm any such H*; I have no more reason to believe
  in a desk gremlin after looking at my desk than before.

  (10) Therefore (1) is false, and the fine-tuning argument is undermined at its root.


  Where does it go wrong? The flaw: H* is a hypothesis tailored to E* after the fact
  — it isn''t independently specified; its prior probability is vanishingly small,
  and the likelihood-ratio framing silently assumes the competing hypotheses were
  fixed before the evidence (or that the priors are comparable). The Bayesian response:
  likelihood ratios don''t determine posterior ratios unless priors are comparable;
  ad hoc hypotheses have low prior/independent support. Also there''s a difference
  between "the constants permit life" (which is a low-complexity, independently salient
  specification — it picks out a natural kind of region defined without reference
  to the actual observed values) vs. "the dust specks are in this exact arrangement"
  (which is a maximally complex, gerrymandered specification). So the equivocation
  is between "E is improbable under Chance" and "E is specified independently of E"
  — the fine-tuning argument needs the life-permitting region to be definable without
  reference to the observed values, which it is (life is independently characterized),
  whereas the gremlin hypothesis is defined by reference to the observed pattern.
