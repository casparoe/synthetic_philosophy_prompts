  Actually a cleaner "proves too much" for the gender-equality paradox: (1) Where
  people are freer to choose, observed choices better express their underlying preferences.
  (2) More gender-egalitarian countries are places where people are freer to choose.
  (3) So the larger gender gaps in STEM choices in those countries better express
  underlying sex differences in preferences. (4) The same reasoning implies that in
  the freest societies, differences between groups in outcomes generally express underlying
  group differences — including gaps we attribute to discrimination, e.g., the gender
  pay gap should be largest in the freest societies, and any residual gap in the freest
  society is by definition a preference difference. (5) But that''s clearly wrong:
  it makes discrimination unfalsifiable, and we have direct evidence of discrimination
  in the freest societies (audit studies of identical resumes). (6) So (1) is false.
  Where does it go wrong? The subtlety: (1) has a scope problem — freedom of choice
  removes external constraint, but preferences themselves are partly shaped by the
  opportunity structure, social norms, and the relative attractiveness of options
  (endogenous preference formation, adaptive preferences, the "paradox" of more options
  → more differentiation because in egalitarian societies, comparative advantage and
  identity-based sorting are freer to express). Also there''s the "luxury good" mechanism:
  STEM vs HEALM choices may be positional goods; in poorer countries both men and
  women choose high-prestige/secure fields (medicine, engineering) whereas in rich
  welfare states people can afford to follow intrinsic interest, which amplifies variance
  in both directions. Also the measurement issue: the paradox is partly an artifact
  of which STEM subfield — women''s share of biology and psychology is high and rising;
  the gap concentrates in physics, engineering, CS. Also the "relative advantage"
  hypothesis: girls with high overall aptitude have relatively better verbal than
  quantitative scores, so in countries where any field is open, they choose the field
  of comparative advantage. Also there''s a statistical critique: some replications
  find the paradox disappears when you use different measures of gender equality (e.g.,
  using the GGGI vs. other indices) or that it''s driven by a few countries.


