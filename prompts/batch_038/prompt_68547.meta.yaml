  Where''s the flaw? Several candidate slides:

  - Equivocation on "the community" between (3) and (6): (1)''s right attaches to
  a demos constituted as a self-governing unit with institutional history, not to
  any arbitrary set of people living contiguously. The scope slide: from "a people
  with a right of self-determination" to "any majority in any territory." That''s
  the classic primary-right theorist''s response (Beran, Philpott) — they need a criterion
  of "the people" that isn''t question-begging, which is exactly the hard part: any
  criterion that stops at Catalonia looks arbitrary relative to a criterion that admits
  Barcelona''s district or the Aran Valley (real: Val d''Aran declared it would want
  to stay with Spain if Catalonia seceded — that''s a real fact I recall; also the
  "tabarnia" satirical movement). And the secessionist can respond with the "institutional
  unit" criterion: the demos is the population of a historically constituted sub-unit
  of the federation/state with its own legislature (Quebec, Scotland, Catalonia) —
  but then that criterion privileges existing administrative boundaries which are
  themselves the product of the parent state''s choices, and it''s contingent (Catalonia''s
