  ---


  There''s a result in complexity theory that I think is philosophically underappreciated
  and I want a proper essay about it, with an actual verdict at the end rather than
  a shrug.


  Background, as I understand it: Razborov and Rudich defined a ''natural proof''
  of a circuit lower bound as one that goes by way of some property of Boolean functions
  that is both large (a substantial fraction of all functions have it) and constructive
  (given the truth table of a function you can check the property fast), and that
  is useful, in the sense that any function with the property provably needs big circuits.
  They then showed — assuming pseudorandom functions of exponential hardness exist
  — that no natural proof can separate P from NP. The classic lower bounds we do have
  (like the ones against small constant-depth circuits) turn out to be naturalizable,
  i.e. they fit the pattern; the pattern just can''t be pushed to P vs NP.


  Here''s the reading I want you to pressure-test. The properties that are large and
  constructive look suspiciously like exactly the properties a human mathematician
  would ever think of: any intelligible structural notion — discrepancy, rigidity,
  symmetry, some measure of scatter — is going to be widely instantiated and going
  to be checkable, because being widely instantiated and checkable is pretty much
  what makes a notion intelligible in the first place. On that reading the theorem
  isn''t a fact about a quirk of one proof strategy, it''s a fact about the shape
  of human understanding: if P ≠ NP, then the truth is out there but the comprehensible
  route to it is closed. There''s also a nice self-referential wrinkle, since P ≠
  NP is itself widely thought to imply the existence of one-way functions and hence
  the pseudorandomness assumption that generates the barrier. So the conjecture, if
  true, would guarantee that no natural proof of it exists.


