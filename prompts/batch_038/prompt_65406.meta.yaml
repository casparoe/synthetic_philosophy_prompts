  I serve on the interpretive standards panel of a national history museum, and next
  month we vote on the framing text for a re-hung gallery on the Bengal famine of
  1943. I would like a draft decision memo I can circulate to the panel in advance.


  Background the panel accepts as settled: the province lost between roughly a million
  and nearly four million people depending on the estimate; the fall of Burma in 1942
  cut off a large share of its rice imports; British authorities removed boats and
  rice stocks from coastal districts under denial policies aimed at a possible Japanese
  invasion; wartime financing drove severe inflation; a preferential supply scheme
  protected war-industry workers, civil servants, and the armed forces in the cities;
  shipping requested from London was largely refused on grounds of wartime scarcity;
  and the provincial government never formally declared a famine at all. Alongside
  these policy facts, the gallery''s commissioned reports also record a cyclone and
  tidal flooding in southwestern Bengal in late 1942 and a rice crop disease, and
  they record that the relative weight of these factors is still disputed. One report
  emphasizes that aggregate food availability was not dramatically below normal and
  that the people who starved were overwhelmingly those whose purchasing power collapsed
  while prices rose; the other argues that there was a real shortfall as well and
  that treating the famine as purely a distribution failure understates the harvest
  evidence.


  Three framings are on the table for the gallery''s central panel. [1] "Disaster":
  ... [2] "Man-made catastrophe" / political failure without verdict language: ...
  [3] "Crime": ...


  Also: a delegation of descendants'' organizations has asked us to go further and
  describe the famine as genocide, and the trust that funded the original gallery
  has warned in writing that it will not support a re-hang whose central label applies
  criminal language to a wartime ally. Within the panel, one member argues that "famine"
  is itself already an evaluative word and that a museum cannot be neutral by choosing
  it; another proposes a double-entry label stating the natural and the political
  causes in parallel columns, without weighting, on the grounds that this is the only
  honest treatment of an unsettled question — I think this launders a verdict as balance,
  but I can''t articulate why, and the memo should engage that proposal squarely.


  Our charter requires that framing text not assert evaluative conclusions unsupported
  by the preponderance of scholarship, which is not much help here, since the difficulty
  is telling causal contribution apart from moral imputation. So the memo should address,
  at minimum:

  - Whether describing these deaths as a crime requires that anyone have intended
  them, or whether culpability can attach to prioritization, refusal, and inaction;
  and what the difference is between saying that policy caused the deaths and saying
  that policy makes them a crime.

  - If the starvation ran through markets — prices, wages, and the collapse of specific
  groups'' ability to command food — rather than through an order to starve anybody,
  who or what is the responsible agent, and whether a museum label can assign responsibility
