  Type: Analyze a real historical/current episode through the lens of a theory.

  Domain: Trolley problems and the doctrine of double effect.

  Episode: Germany''s Aviation Security Act §14(3), the 2006 Federal Constitutional
  Court judgment striking it down, plus the 9/11 shoot-down authorization as the antecedent
  case.


  Voice: longtime rationalist blog reader, casual, a typo or two, elaborate 1–3 paragraphs,
  with some not-super-relevant detail. Ask for confidence statements and the least-sure
  point. No bibliography requests. Inject a niche/fresh idea of my own: e.g., the
  asker''s own coinage — "the codifiability test" for DDE: can a legal system actually
  write the intended/foreseen distinction into a statute, or does the distinction
  evaporate when it has to be operationalized as a rule with an identifiable decision-maker?
  Also introduce the asymmetry the asker noticed: the court''s holding is limited
  to cases where innocent people are aboard ("insofar as innocent people on board
  would be affected"), which means the German rule tracks *who is in the plane*, not
  *what the pilot intends* — which is a different distinction than DDE''s, even though
  the court''s language ("using their killing as a means to save others... treated
