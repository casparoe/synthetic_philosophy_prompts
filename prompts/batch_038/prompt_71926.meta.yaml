  no one can be argued or reported into finding something beautiful — the judgment
  of taste rests on the subject''s own feeling of pleasure, so someone else''s report
  cannot supply its ground. Malcolm Budd formulates this as a principle about warrant
  rather than about truth: it is a constraint on how an aesthetic judgment may be
  based, not a claim that testimony-based aesthetic beliefs are systematically false.


  This is just Russell''s distinction between knowledge by acquaintance and knowledge
  by description carried over into aesthetics. A description of a novel''s atmosphere
  — ''claustrophobic'', ''achingly slow'' — is a propositional surrogate for an experience,
  and the acquaintance principle says the surrogate cannot do the work of the experience,
  exactly as knowing by description that a certain table is brown cannot make one
  acquainted with the table.


