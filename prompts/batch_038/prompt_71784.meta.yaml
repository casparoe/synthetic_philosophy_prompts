  \ but whose negation is not conceivable, e.g., in cases of \"strong necessity\"\
  \ debate; or mathematical truths that are necessary but provable only a posteriori?\
  \ Hmm.\n\nBut maybe more tractable and less regurgitable: design a case involving\
