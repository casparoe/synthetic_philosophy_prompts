  \ — the victors weren't parties), the Sierra Leone Special Court, the ICC's jurisdiction\
  \ over non-parties, ad hoc hybrid courts, or a hypothetical tribunal. Hmm, but risk\
  \ of factual error.\n\nOption: Good's theorem on the value of information — a track\
  \ record: someone's verdicts on whether to gather information before deciding. Good's\
  \ theorem says the expected value of a costless experiment is nonnegative. Cases\
  \ where it fails: when the decision problem isn't fixed (dynamic inconsistency),\
  \ when you can't be trusted to update properly, when there are constraints (bounded\
  \ memory), when the payoff depends on what you'd learn and there's commitment value,\
  \ Elga's \"self-locating\"/\"you might change your mind\" cases, the value of information\
  \ under ambiguity aversion (Ellsberg), under risk of moral hazard, the \"you'd be\
  \ better off not knowing\" cases (sunk cost, temptation). Also: information that\
  \ reveals you're a time-inconsistent agent; the case where the decision-maker will\
  \ predictably fail to update (non-Bayesian updater); the case where the experiment's\
  \ outcome is not measurable with respect to the partition (non-partition experiments);\
  \ the case where the agent must commit before knowing.\n\nActually, a nice framing:\
  \ a decision-theorist colleague has verdicts on a set of cases about whether one\
  \ should pay to learn something. The candidate rules: (a) Good's theorem always\
  \ applies to costless information in a fixed decision problem; (b) information can\
  \ be harmful when the decision-maker's future self will predictably mishandle it\
  \ (dynamic inconsistency / commitment value); (c) information is harmful when it\
  \ resolves ambiguity and the agent is ambiguity-averse (Ellsberg); (d) information\
  \ is harmful when it changes the payoff structure — e.g., when others know you know\
  \ (strategic/signaling); (e) information is harmful when the learning itself is\
  \ costly in memory/attention.\n\nThat's a decent prompt but maybe a bit technical.\n\
  \nOption: Do neural networks have representations? (realism about interpretability)\
