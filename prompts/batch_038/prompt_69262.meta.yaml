  are that same point made rigorous rather than merely rhetorical. For any two learners,
  whatever one gains on some set of target functions it loses back on the complement,
  so averaged over all possible targets everything ties. Same story on the optimization
  side: averaged over all fitness landscapes, no search procedure beats random guessing.
  It''s a theorem, not a vibe, and I lean on that.


