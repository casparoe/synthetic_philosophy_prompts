  Design:


  Setting: The asker is a first-year grad student (or an MA student) in a philosophy-and-economics
  seminar; reports an argument between two other seminar members after a talk / in
  the hallway. Neither side favored. Ask for a move-by-move adjudication.


  Let me craft the exchange with genuine depth:


  Context: The department hosted a joint seminar where a speaker presented survey
  evidence that people who were automatically enrolled in a retirement savings plan
  later said, when asked, that they were glad to have been enrolled, and that a large
  majority of similar people who were not auto-enrolled said they wished they had
  saved more. The speaker concluded that the auto-enrolled were made better off.


  Disputants: Marta (behavioral/welfare) and Ilya (price-theory/Chicago-ish, or maybe
  an ordinalist methodologist).


  Round 1: Ilya: The speaker''s conclusion contradicts itself. Welfare economics after
  the ordinalist revolution measures a person''s good by her choices. Someone who
  declined to save revealed that she preferred current consumption; to say she''s
  worse off is to appeal to a utility that no longer exists in the theory. So either
  the speaker is using utility as a felt state (which is not observable and not what
  the theory is about), or she''s smuggling in her own values.


  Marta: But that''s not right. Revealed preference was never meant as a definition
  of well-being. It''s a testable consistency theory: choices are constrained-maximizing
  if they satisfy the axioms; people can and do violate them. The woman who says at
  45 that she wishes she''d saved at 30 isn''t confused about her own good; she''s
  reporting a conflict between two of her selves, and one of them is better placed
  to judge.


  Round 2: Ilya: Then which self? You''ve set up a preference over preferences and
  now you need a rule for deciding which level counts. The 45-year-old''s regret is
  a preference about the past; if you let the later self veto the earlier one, you''ve
  made every moment of weakness retroactively null, and there''s no act anyone could
  perform that couldn''t be re-characterized as a mistake by a future self who changes
  her mind. Also, if you index the choice situation finely enough — including which
  self is doing the choosing — the axioms can never be violated, and you''re back
  to the tautology charge.


  Marta: Not any rule — a specific one: endorsement on reflection with full information
  and no distorting conditions. That''s still choice-based; it''s just that the relevant
  choice is made in a calm, informed state. Empirically you can observe it: ask people
  in cool states what they want done to them in hot states, and they give consistent
  answers, and they ask for constraints (commitment devices, default rules). People
  revealingly choose to bind themselves. That''s a preference revealed by choice,
  not a value imposed from outside.


  Round 3: Ilya: But then you''ve conceded the point. The reason to privilege the
  cool self isn''t that it''s more informed in some neutral sense; it''s that you
  think patience, health, savings, and sobriety are good and impulsiveness is bad.
  Take the same machinery and run it the other way: a person who, calm and informed,
  resolves to quit smoking, then fails, then says at 60 that she''s glad she smoked
  because it got her through a hard decade. Your rule now says the resolution was
  the real preference and the retrospective gladness is a rationalization. There''s
  no observable fact that picks the cool self rather than the one that speaks last,
  or the one whose values you share. In the end you''ve reinstated a utilitarian judge
  inside the agent''s head — an inner arbiter whose verdicts always happen to agree
  with the policy you wanted.


  Marta: Fair in principle, but wrong in fact: the asymmetry is empirical. People
  asked in cool states systematically and repeatedly ask for their hot-state choices
  to be overridden, and they rarely ask for the reverse — you don''t get large numbers
  of sober people paying to be made impulsive. And the retrospective gladness cases
  are a minority and usually involve adaptive preference formation, which is exactly
  the distorting condition my rule excludes.


  Round 4: Ilya: "Adaptive preference" is the escape hatch. Any preference that survives
  your test is authentic; any that doesn''t is deformed by conditions you get to name.
  And notice what you''ve done to the word utility: it started as a felt state (Bentham),
  became an index of choice (the ordinalists), and you''ve now made it a third thing
  — the verdict of a hypothetical better-informed chooser — which is neither observable
  nor defined by choice, and which therefore has no more empirical content than the
  thing the ordinalists were trying to eliminate. You haven''t rescued welfare economics;
  you''ve changed the subject and kept the name.


  Round 5: Marta: Then say the same about your own position. If utility is nothing
  over and above the ordering revealed by choice, your theory cannot criticize any
  choice whatsoever, not even one made by a person under coercion, ignorance, or delirium,
  and cannot compare anyone''s situation to anyone else''s. It can describe markets
  beautifully and it cannot ground a single claim that a policy made anyone better
  off. You''d rather have an empty concept than an honest normative one.


  Hmm, that''s a great round 5 — and Ilya should get a rejoinder. Maybe: Ilya: I''d
  rather be empty than false. And there''s a third option you keep skipping: the economist
  doesn''t need utility to say anything normative; she can point out that a policy
  makes someone worse off by that someone''s own subsequent testimony (as in the survey),
  or she can say the policy takes from people things they''d pay to keep, and leave
  it to the political process to decide whose testimony counts. The normative work
  was never the theory''s job.


