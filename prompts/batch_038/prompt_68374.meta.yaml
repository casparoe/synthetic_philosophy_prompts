  What original thesis? Let me craft one:


  Thesis: Nozick''s "utilitarianism for animals" is usually read as a *concession*
  — he gives animals less than persons. But actually it''s a *promotion*: within the
  animal kingdom, Nozick grants animals the very thing he denies persons — namely
  that their good can be aggregated and traded off across individuals. And aggregation
  is what Nozick attacks as the failure to take seriously the distinction between
  persons. So Nozick''s animals get the *worse* deal, yes, but the interesting consequence
  is that Nozick''s theory contains two incommensurable currencies, and the theory
  gives no rule for converting between them. Every real question we care about (should
  we eat animals, test drugs on them, pave over their habitat to build a hospital)
  is a mixed human-animal question. So Nozick''s system is silent precisely where
  it''s needed. And the asker''s proposed fix — the injection — is to make it a *lexical*
  scheme: human side constraints apply first, then within the remaining space animal
  utility is maximized; but the asker notices that lexicality doesn''t help either,
  because the hard cases are exactly where a *small* human cost trades against a *huge*
  animal cost (e.g., one person''s mild inconvenience vs. ten million chickens'' misery),
  and lexical priority rules that out in a way that seems morally absurd — the same
  absurdity that makes people reject strict deontology in human-only cases. So the
  asker''s tentative conclusion is that Nozick''s split isn''t a stopgap but a *diagnosis*:
  any theory that wants side constraints for persons and aggregation for animals has
  to say how much weight a constraint-blocked harm carries, and Nozick never does.
  The asker proposes calling this "the exchange-rate problem" and asks whether it''s
  real or whether they''ve misread Nozick.


