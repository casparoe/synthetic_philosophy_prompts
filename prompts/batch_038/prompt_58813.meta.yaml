  same city, same department size. He made a list of every consideration he could
  think of and the two columns came out even. He asked both institutions for more
  time, spent five weeks agonizing, and by the time he was ready to answer, both offers
  had been withdrawn. He tells the story as one of paralysis; Mara and told it as
  a case study.


  Their exchange went as follows.


  1. Mara: N. was irrational, and not merely unlucky. Between two options he judged
  exactly equally good, any selection is arbitrary, and an arbitrary selection is
  not a reasoned one. The only course that preserved his rationality was to keep deliberating
  or to refuse to choose.

  2. Julian: That standard condemns itself in this case. Declining to choose was itself
  one of his options, and it was dominated: it guaranteed the worst outcome (no job
  at all), while either of the other two guaranteed a good one. N.''s error was not
  that he chose arbitrarily — it was that he chose five weeks late.

  3. Mara: You''ve just restated my point. The consideration you cite — don''t take
  the dominated option — is a reason to choose, not a reason to choose this one. So
  the asymmetry you found sits between choosing and waiting; between the two offers
  there was still nothing. An action can be required and still be performed for no
  reason, and "you ought to pick one" does not make "I picked A because..." true.

  4. Julian: That division can''t be held. His menu was A, B, and wait; wait is dominated;
  so the rationally eligible set is {A, B}, and taking any member of the eligible
  set is what choosing rationally amounts to. If you insist instead that every choice
  from a tied set is irrational, then rationality is impossible whenever two options
  tie at the top — and ties at the top are not exotic, they are ordinary: two identical
  products on the shelf, two equally clear routes home. Your view indicts daily life
  wholesale.

  5. Mara: Then you should notice what you have given up. On your account, "I had
  no reason to prefer it" is a complete and rational explanation of a choice — which
  is to say, no explanation at all. It also severs an inference everyone depends on:
  we routinely learn what people prefer from what they pick. If choice can come unhooked
  from preference in cases like N.''s, that inference is false exactly where it looked
  most secure.

  6. Julian: It isn''t severed, because it was never drawn from single choices. Revealed-preference
  reasoning works with choice sets rather than choice events: an agent counts as indifferent
  between A and B when the set he would accept from {A, B} is {A, B}. Watching N.
