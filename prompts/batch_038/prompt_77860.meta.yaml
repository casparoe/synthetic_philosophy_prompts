  In three weeks I give the closing talk at a workshop on evaluation in machine translation,
  and I want a Q&A prep sheet, not a defense of my view.


  My thesis is a restated version of Hofstadter''s shallowness charge that deliberately
  does not depend on error rates, poetry, or wordplay. I propose what I call a foreclosure
  test: a rendering of a source passage manifests understanding of it only if the
  translator can, on request and without starting the job over, say which readings
  the passage genuinely permitted, which of them the rendering ruled out, and why
  the retained one was preferred. My claim is that current large models fail this
  test not because they choose badly at these decision points but because the choice
  is never represented as a choice: a sample is drawn from a distribution, the alternatives
  persist only as probability mass, and nothing in the system holds what was given
  up. Corollary I plan to defend: any adequate evaluation metric should probe the
  foreclosed alternatives, not just the output, and metrics that score outputs alone
  cannot distinguish this failure from success.


