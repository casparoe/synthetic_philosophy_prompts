  ---


  I cover science, technology and ideas for a weekly magazine, and I''m finishing
  a long feature about whether agents who disagree about what is good can nonetheless
  strike deals that leave each of them better off. The feature discusses a proposal
  that circulates in AI-governance and rationalist writing under the name of the "safe
  Pareto improvement": suppose two agents with incommensurable aims — call them A
  and B — expect that, absent any deal, their interaction will end in some messy default
  outcome D in which both do poorly. Each can then commit, in advance and verifiably,
  to a conditional program of the form "if you do your part, I will implement your
  aims in this domain instead of mine," so that a joint outcome is reached that each
  prefers to D. The appeal is supposed to be that nobody has to concede anything about
  what is actually valuable: the deal is certified only as an improvement over the
  default, by each party''s own lights, and is therefore "safe." The objections I
  want the satire to embody rather than recite are these: the default D is not given
  by nature but chosen, and the choice of bargaining point does most of the work;
  each party must model the other''s values accurately, and there is no neutral referee
  when the models disagree; the very fact that an agent is known to accept such deals
  changes how hard others will bargain against it, so "safety" is measured against
  a baseline the deal itself has moved; and there are indefinitely many such agreements,
  all of them Pareto improvements over D, with nothing in the proposal to select among
  them.


  My editor has approved a companion sidebar in the house tradition of mock documents,
  and I''d like you to write it as a parody of an international framework agreement:
  a "Framework Agreement on Precommitted Cooperation Between Agents of Incommensurable
  Aim," complete with a formal preamble, numbered Articles (roughly twelve to fifteen),
  two short Annexes, and three or four footnotes in the voice of a weary legal officer.
  Around 900 to 1,100 words. Invent the signatories — nothing that corresponds to
  a real state, company, lab or named individual — and give each a two-sentence characterization
  of its aims that is specific enough to make the machinery bite; something like a
  compact that wants the galaxy''s stars left intact for their beauty, negotiating
  with an ascendancy that wants them disassembled for compute, would do nicely, but
  you may invent better parties.


  The humor has to come from getting the mechanism right, so that a game theorist
  or a decision theorist laughs rather than winces, and so that a general reader still
  finds it funny as bureaucratic absurdity. Concretely: the definitions article should
  reveal that "improvement" means improvement according to the party doing the assessing,
  and that the parties have agreed to disagree about the disagreement point by adopting
