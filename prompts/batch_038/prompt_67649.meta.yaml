  Internal vs external reasons activity: "Sound deliberative route" workshop. Setup:
  16 students, 90 min. Each gets a character dossier: a person''s actual desires/beliefs/dispositions,
  plus a candidate action for which we ask "does he have a reason to Φ?" Students
  must act as the "deliberative route committee": they may only build chains of reasoning
  starting from the elements in the dossier, using means-end, imagination, correcting
  false beliefs, and weighing against other motivations. Then a twist round: give
  them a case where the agent would come to want Φ if he deliberated well, but the
  deliberation required is open-ended (e.g., "if he were more imaginative, he''d see...").
  The point to feel: the internalist''s escape clause — that S can be transformed
  by sound deliberation — is elastic, and once it''s elastic enough to accommodate
  reasons that seem external (e.g., the reformed racist, the person who has a reason
  to be kind though he doesn''t care), the distinction starts to lose its bite; and
  simultaneously, if you tighten it, internalism looks like it can''t explain blame.
  That''s a nice, genuinely niche-feeling design.


