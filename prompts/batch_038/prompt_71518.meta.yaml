  Moves:

  1. Marta: There''s no difference in confirmation between the model reproducing known
  data and predicting new data. The likelihood ratio is all that matters; the calendar
  date at which the datum was learned doesn''t appear anywhere in Bayes''s theorem.
  If anything, the known-datum case is stronger because it''s less likely the datum
  is a fluke or a measurement error (it''s been replicated). Call the "novelty" intuition
  a confusion between the sociology of discovery and evidential support.

  2. Julian: But that only works if the probability of the datum, given the background,
  is less than 1. For data everyone already knows with certainty, P(E)=1, so conditionalizing
  on it leaves everything unchanged: P(T|E)=P(T). Strict Bayesianism says old evidence
  confirms nothing. This is the standard problem, and Julian bites the bullet: the
  preprint authors got zero confirmation from the old dataset, and would have gotten
  real confirmation from a new one.

  3. Marta: reductio — that can''t be right, because it makes the 1915 Mercury calculation
  worthless; by Julian''s rule Einstein''s fit to the roughly 43 arcseconds per century
  of leftover precession, which astronomers had known since the mid-nineteenth century,
  provided no confirmation at all, while the 1919 eclipse result did. Historically
  it was the reverse: the Mercury number is what convinced Einstein he had it right,
  and the eclipse made him famous but not (first) convinced. Also nobody''s credence
  in a remembered datum is literally 1; if you allow probabilities less than 1, the
  datum does move things.

  4. Julian: two replies. (a) If you let every known datum have probability short
  of 1, the size of the boost depends on how uncertain you happen to be about it,
  so the same total evidence confirms a theory more for a forgetful person than a
  confident one — confirmation becomes a measure of your own memory, not of the theory.
  (b) The eclipse case really was different in kind: it discriminated between two
  live numbers, because Einstein''s own earlier calculation gave about 0.83 arcseconds
  and the finished theory gave 1.75, so the 1919 measurement could have come out for
  the smaller value. Mercury had no such rival on offer: people had a perfectly good
  candidate explanation in an unobserved inner planet or a slightly oblate sun, so
  the anomaly''s probability on the negation of GR was not low, and the likelihood
  ratio was much less impressive than the story suggests.

  5. Marta: offers the standard patch — the new proposition isn''t the old datum,
  it''s the claim that the theory entails the datum. Einstein didn''t know that until
  he did the calculation; learning "GR entails 43″" raises P(GR) even though P(43″)=1.
  So old evidence can confirm after all, via the logical relation, and Julian''s reductio
  dissolves.

  6. Julian: that patch makes confirmation a function of the theorist''s ignorance
  and deductive slowness. If it''s right, a graduate student who hasn''t yet noticed
  that her theory entails a well-known datum stands to gain more from noticing it
  than Einstein did; and any machine that mechanically enumerates consequences gains
  nothing, no matter how many known facts it reproduces. Also, the boost can be collected
  only once, and it can be collected for entailments of any kind, including trivial
  ones — so the theory is "confirmed" by the student discovering that it entails something
  about the color of swans. Julian says this shows the Bayesian framework is measuring
  the wrong thing.

  7. Marta: concedes the patch is inelegant but says Julian is conflating two different
  quantities: the change in a person''s credence (which depends on what they''ve noticed)
  and the evidential support relation between a body of evidence and a hypothesis
  (which doesn''t). On the second, her point stands: novelty has no role, and if accommodation
  ever looks weaker, that''s because a model built with knowledge of the datum may
  have been tuned to it, which is a claim about the reliability of the model-builder
  and hence about the space of hypotheses, not about the timing of the datum.

  8. Julian: says the tuning point proves his case rather than hers — the difference
  between prediction and accommodation is exactly a difference in evidential weight,
  and it can''t be located in the likelihood ratio alone.


