  book argues that von Neumann, the architect of the stored-program machine, was already
  arguing against the computationalist reading of the brain, and that current neural-network
  triumphalism ignores his cautions. Interview questions to press him.


  Pressure points I can inject into the prompt (so the model has concrete material):

  1. The depth/width argument: is it a difference in kind or just a difference in
  current engineering? Deep networks run serially through relatively few layers (a
  few dozen to a few hundred steps) — arguably vindicating von Neumann rather than
  refuting him. Follow-up if he says "depth is now huge — chain-of-thought, agentic
  loops, recurrent reasoning": then does the vindication collapse, or does he concede
  the argument was about the machines of 1957?

  2. The "different language"/statistical character claim: what would it take to have
  identified that language? Is it falsifiable, or is it a placeholder for our ignorance?
  Follow-up if he says weights and gradients are exactly that non-Aristotelian, statistical
  language: then von Neumann''s caution is not a warning against computationalism
  but a prediction of connectionism — so why does the book read him as a skeptic?

  3. The low-precision/high-reliability point: redundancy, parallelism, error tolerance
  — these are engineering techniques von Neumann himself proposed for machines (redundant
  organs, majority voting, error-correcting codes). So the brain''s tricks are not
  sui generis; he put them into machines. Follow-up: does the guest think the difference
  is quantitative or that von Neumann thought reliability theory exhausts the gap?

  4. The memory hierarchy: active vs. deep/genetic memory — he allowed that much of
  the nervous system''s memory is inherited and chemical. Today''s analogy would be
  weights learned in training vs. activations at inference; also the architecture/genome
  analogy. Ask whether the guest''s mapping of "genetic memory" onto learned parameters
  is a stretch, since training isn''t inheritance — or is it, on a functional reading?
  Follow-up.

  5. The self-undermining tension: von Neumann built the universal machine and held
  that automata theory is a branch of logic; he also insisted any deep theory of automata
  must be a logical theory. So on his own terms, if a machine can be made to imitate
  any other, the brain is at least imitable — the analogy is not superficial but functional
  equivalence. Ask how the guest reconciles reading him as anti-computationalist with
  his universal-machine commitments. Follow-up if he says von Neumann distinguished
  imitability from identity of internal language.

