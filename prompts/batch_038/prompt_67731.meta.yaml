  Confident claims about The Computer and the Brain (1958, Silliman lectures, unfinished):

  - Comparison of computers and nervous system in terms of speed, precision, energy
  use: neurons are slow (impulse transmission ~a few hundred m/s at most, and the
  elementary operations much slower than vacuum tubes/transistors) and low precision
  (a neuron''s reliability, and the "depth of memory" — he estimated the nervous system''s
  numerical precision as roughly two to three decimal digits, contrasted with machine
  parts built to 8+ digits).

  - The nervous system compensates by massive parallelism and redundancy: many neurons
  in parallel, and errors of individual neurons don''t ruin the performance; the system
  is statistical in character.

  - He distinguishes memory as "active memory" (presently used, e.g., in a machine''s
  registers / in the nervous system the immediate traces) versus "deep memory" or
  long-term storage that in the nervous system may be partly genetic/chemical (he
  mentions a hierarchy of memories with different speeds/capacities, and notes that
  in the nervous system memory may be stored chemically, and that much of it may be
  inherited — genetic memory).

  - The digital/analog taxonomy: machines can be digital or analog or mixed; the nervous
  system seems to be mixed — its processes appear to have both digital features (all-or-none
  neuronal pulses) and analog features (chemical processes, continuous intensities),
  and he thought the analog part might be essential.

  - The claim about language: the language in which the nervous system communicates
  is not the same as the languages we use in mathematics/logic; the "language" of
  the CNS is unknown to us, and its syntax and semantics differ from ours; he suggests
  the procedures are of a statistical character rather than the precise, arithmetical/logical
  rules we''re used to, and that this is not a mere matter of our ignorance but a
  difference in the "logic" involved — he says any attempt to describe it would require
  a mathematical language different from the ones we habitually use. He also argues
  that the nervous system''s computations are much shallower in "logical depth" (fewer
  serial steps) than artificial automata that achieve comparable results, which suggests
  the elementary operations differ in complexity/character from ours. I''m fairly
  confident about the depth/width point — he wrote about "logical depth" (number of
  successive steps) and noted that automata achieving complex results need great depth,
  while the nervous system works with few steps but enormous width (many parallel
  channels).

  - Also relevant background: universal Turing machine / von Neumann''s self-reproducing
  automata, the stored-program concept, his view that automata theory is essentially
  a branch of formal logic. And in the book he says the analogy to mathematics/logic
  is superficial and that any deep theory of automata will be a logical theory.


