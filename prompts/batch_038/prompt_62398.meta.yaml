  The story as told by Gibbard & Harper: A man is in a café in Damascus. Death appears
  and shows surprise at meeting him there. Death says "I have an appointment with
  you tomorrow in Aleppo." The man, frightened, flees to Aleppo that night. Next day,
  Death finds him there and says "I was surprised to see you in Damascus yesterday,
  since I knew we would meet in Aleppo today."


  In the decision-theoretic setup: the man chooses whether to stay in Damascus or
  flee to Aleppo. Death has already written down where she''ll find him (the "state"
  of the world). The man''s choice is a symptom of his location, not a cause. Since
  Death''s appointment is infallible, the man dies either way. EDT computes expected
  utility of staying: if I stay, then (probably) Death''s appointment was Damascus,
  so I die. Similarly flee. Both are equally bad. So EDT is indifferent — correctly,
  since the outcome is fixed. The interesting bit: Causal Decision Theory also says
  indifferent. So where''s the disagreement?


  Actually, I think the standard use of Death in Damascus is: it''s the case where
  the EDT reasoning ("my choice is evidence about Death''s appointment, and Death
  is never wrong, so I''ll die either way") leads to fatalism — but the point Gibbard
  makes is that a rational agent should make the decision on the basis of a full plan
  made in advance, i.e., the "plan-full, forethought-free" slogan, and that in Death
  in Damascus, the man''s deliberation should be conducted as if he can''t affect
