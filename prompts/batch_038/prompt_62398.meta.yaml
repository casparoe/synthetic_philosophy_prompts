  Draft:


  ---


  I''m putting together a session for a philosophy-of-decision-theory reading group
  where we''re doing the Death in Damascus case (the Gibbard–Harper one, via Maugham''s
  Samarra story) alongside Newcomb, and we''ve decided to spend the last hour on Sophocles''
  Oedipus the King, which half the group has read and half has only seen the film
  versions of. What I want is a reading of the play that takes the decision-theoretic
  machinery seriously instead of just saying "it''s about fate, isn''t it, so fatalism."
  Specifically: in Death in Damascus the state of the world is fixed before the agent
  moves and his choice is a symptom of it, not a cause of it — which is why both EDT
  and CDT end up shrugging and why the fatalistic conclusion is actually right there.
  The Delphic oracle looks like the same setup from the outside, but I think it isn''t,
  and the reason it isn''t is the interesting part: Oedipus''s flight from Corinth
  is *the mechanism* by which the prophecy gets satisfied, so the prediction isn''t
  read off a prior state, it''s fed back through the agent''s response to it. Sort
  out for me, scene by scene where it matters, which structure the play actually has.
  Does Sophocles give us a no-free-lunch problem (Death in Damascus proper), a self-fulfilling-prophecy
  problem, or a backtracking/newcombly problem where the oracle''s accuracy is what
  does the causal work? I want you to be willing to say the play mixes them, and to
  say where the mix is deliberate.


  Then there''s a wrinkle I want you to dig into, and I''ll warn you it''s my own
  coinage so you won''t find it anywhere: call it the Jocasta update. Jocasta argues
  that oracles are worthless by pointing to the prophecy that Laius would die at his
  son''s hand, and the fact that (as far as she knows) he was killed by a band of
  robbers at the crossroads instead. Her update looks like a straightforward Bayesian
  move on a prediction that failed — except the data point is contaminated, twice
  over: the baby''s exposure, which she and Laius ordered *because of* that prophecy,
  is what put the grown Oedipus on the road from Corinth in the first place, and the
  sole survivor''s "robbers, plural" report is itself testimony shaped by his own
  situation (he ran and left his king dead; whether he miscounted, lied, or was just
  terrified is worth teasing apart). So she''s revising her credence in the oracle''s
