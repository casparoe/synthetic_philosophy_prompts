  Structural demands (the "niche idea injection"):

  1. Use the pantoum''s actual mechanics: each quatrain''s lines 2 and 4 recur as
  the next quatrain''s lines 1 and 3; the final stanza''s lines 2 and 4 are the first
  stanza''s lines 1 and 3, so the poem ends on its opening line. Demand that the reused
  lines shift meaning by re-positioning: a line that first appears as a claim about
  the past becomes, on repetition, a claim about the historian''s own present — i.e.,
  the form enacts the presentist recruitment of the past.

  2. Demand the closure be read as an indictment: the fact that the poem arrives back
  at its opening line is the poem''s argument that a narrative which ends where it
  began never actually established anything; the ending was presupposed. Explicitly
  instruct: the loop should feel like a trap sprung on the whig narrator, not like
  a satisfying resolution.

  3. Content requirements drawn from Butterfield (paraphrased, not quoted): history
  studied with reference to the present; the "line of causation" illusion — that a
  sequence of events that happen to have led to us gets mistaken for a chain of causes,
  so the historian stops looking for real causes; abridgement/selection — only the
  events that seem important from the present survive into the narrative (this is
  the survivorship-bias point); modernizing the past — historical actors made to seem
  more like us than they were; the moral verdict requirement — the whig historian
  feels loose threads hang unless he pronounces which side was in the right; the reduction
  of the losing party to a foil that contributed nothing to the making of the present;
  and the alternative: contingency, the concrete and the complex, studying the past
  for its own sake.

