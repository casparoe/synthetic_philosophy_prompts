  Draft:


  ---


  I''m a fourth-year doctoral student in a history of science program, and this spring
  I''m convening the second-year methods seminar for a cohort that includes two early
  modernists, a medievalist, someone working on the history of development aid in
  the postwar period, and a student from the school of education writing on the professionalization
  of teaching. Week four is devoted to Butterfield''s short 1931 book on the whig
  interpretation of history, and I want to open the session with a poem printed on
  the handout. It will also go on the inside cover of our department''s graduate conference
  program, so it has to work for a reader who has never opened the book and may not
  even be a historian. I''d like a pantoum of five to seven quatrains — nothing longer,
  it has to fit on a single page with the week''s schedule beneath it.


  The form has to carry the argument rather than decorate it, so please observe the
  mechanics strictly: the second and fourth lines of each quatrain recur, word for
  word, as the first and third lines of the next, and the final quatrain takes up
  the first quatrain''s opening line as its own second line and the first quatrain''s
  third line as its own fourth, so the poem ends on the line it began with. The repeated
  lines must be identical — no rewording, no changed punctuation, no softened verb.
  That''s the point. What I want the reader to experience is that the sentence itself
  never changes; only the position we assign it does, so a line that first appears
  as a remark about some eighteenth-century actor comes back two stanzas later as
  a premise about us, and the shift is entirely the historian''s doing. Alternating
  rhymes are welcome if they come without strain, but don''t trade the verbatim recurrence
  for a rhyme. And the closing return should feel like a trap springing shut on the
