  must be found in *some* branch (a personal-identity assumption, not a QM one); (c)
  the slide from "there is a branch where I survive" to "I will experience surviving"
  — the indexical/"anticipation" problem (Sebens & Carroll''s self-locating uncertainty);
  (d) it proves too much: it would also show you can''t be killed in *any* risky scenario,
  and, worse, by the same reasoning you should expect to survive a Russian-roulette-style
  experiment with a million chambers, and it would show that you should expect to
  find yourself in the most bizarre branches (Boltzmann-brain-ish); also by parallel
  reasoning you should conclude you''ll never observe *any* low-probability event,
  and that the wave function never collapses... The most elegant "proves too much":
  the same reasoning applied to a lottery shows that you should expect to win any
  lottery you enter infinitely many times, or applied to a coin: in some branch you
  get 100 heads in a row, so you should expect to see it — which contradicts the Born
  rule and would make all statistics impossible. And the flaw: conflating "there exists
  a branch with property P" with "I should expect to observe P," ignoring that expectation
  must be weighted by branch measure. Also the decoherence/identity point: death isn''t
  a "branch" in the same way; and there''s the issue that the amplitude for surviving
  a lethal event may be exactly zero, not just small (e.g., a genuinely impossible
  outcome has zero measure — though in practice for macroscopic death it''s nonzero
  but fantastically small).


