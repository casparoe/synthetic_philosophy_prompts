  I retired three years ago from a sensory physiology lab where I''d spent most of
  my career on weakly electric fish — the electrosensory side, mostly: corollary discharge
  of the electromotor command coming into the electrosensory lobe and cancelling the
  reafference from the fish''s own organ, so the animal can actually see the world
  instead of its own noise. I''ve fallen into philosophy of mind since, which my wife
  regards as a symptom of under-stimulation, and I''ve just finished Chalmers''s 2018
  paper on the meta-problem of consciousness. Twice. I follow the shape of it — that
  we make these reports and judgments about consciousness ("there''s something it''s
  like", "how could neurons give rise to that") which themselves need explaining,
  and that a full causal account of why we say such things might go a long way toward
  the hard problem, or might leave it completely untouched, and that''s part of what''s
  argued about. But the vocabulary I actually think in is efference copies, reafference,
  forward models, cancellation and negative images, pacemakers, and the jamming avoidance
  response.


