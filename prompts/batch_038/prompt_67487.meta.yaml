  ---


  I teach a graduate seminar on the middle books of the Republic, and I have come
  to distrust a habit my students acquire almost immediately: they treat the allegory
  of the cave in Book VII as a narrative rendering of the divided line from the end
  of Book VI, and when asked to relate the two they produce a confident four-stage-to-four-section
  correspondence and consider the matter settled. I want to press against that habit,
  and I would like you to help me by comparing the two devices as instruments that
  are doing different work, rather than as one diagram presented twice. Please resist
  the temptation to reproduce the standard mapping; the interesting content lies precisely
  where the mapping fails.


  To keep the comparison anchored, let me fix the two sequences as they stand in the
  text. The line is cut twice, the second cut in the same ratio as the first, yielding
  four sections: (i) images — shadows and reflections in water and on smooth, bright
  surfaces; (ii) the originals of which those are likenesses — animals, plants, and
  the things made by human beings — grasped by belief rather than knowledge; (iii)
  a higher section in which the soul reasons from hypotheses down to a conclusion,
  using the visible figures and diagrams as images while its thought is directed at
  the square itself and the diagonal itself, that is, at the objects of the mathematical
  arts; and (iv) a topmost section in which dialectic treats hypotheses not as first
  principles but as hypotheses, as rungs for ascending to something unhypothetical,
  and proceeds without images, from forms to forms. The cave, by contrast, runs: shadows
  on the wall; the artifacts and figures carried along behind the screen; then, after
  the release and the painful drag upward, first shadows again, then reflections of
  men and other things in water, then the things themselves, then by night the moon
  and the stars, and last the sun seen in its own place rather than in reflection
  — whereupon the freed prisoner reasons that the sun is the cause of the seasons
  and the years and, in some way, of everything he used to behold. And then, unlike
  the line, the cave turns around and sends him back down.


  Here is the comparison I want, organized around three points of non-coincidence
  rather than around a general summary. First, the cave contains more stations than
  the line contains sections: any four-to-four correspondence must either collapse
  two stations or promote one to the status of a section, and I want you to say which,
  and to name the cost of the choice — in particular, whether the collapse is licensed
  by anything in the text or is merely convenient. Second, mathematics occupies an
  entire section of the line, and seems to have no station at all in the cave, unless
  one reads the reflections in water that greet the prisoner on his arrival outside
  as the image of something like it. Take that reading seriously and then give me
  the rival reading — that the cave simply omits a tier the line insists upon — and
  say which survives better. Third, the asymmetry of the terminus: what the line reaches
  as an unhypothetical first principle and a stopping point, the cave presents as
  a cause that generates the seasons and makes visible things visible, and then immediately
  re-enters the political world through a descent that has no counterpart on the line.
