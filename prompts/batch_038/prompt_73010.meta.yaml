  So the essay''s structure:

  1. Setup: the seminar question — do artifacts have politics? Standard answer via
  design-intent cases and "inherently political" cases.

  2. The gap: both standard categories locate politics at the moment of design. But
  many artifacts'' political properties are perishable: they persist only while labor
  is supplied.

  3. Proposed distinction: frozen politics (settled once, in capital) vs. leased politics
  (renewed continuously by labor) vs. hardened politics (designed to be discretion-proof,
  removing the human site of contest).

  4. Test: the zero-maintenance counterfactual (what happens to the political function
  if maintenance stops for a year?) and maybe a second test: "the discretion audit"
  — is there a human who can decline to enforce, and what happens then?

  5. Cases: painted vs. separated bus lane; wheelchair lift out of order; the prepaid
  water meter / automated gate as hardening.

  6. Implication for the determinism debate: determinists are right that artifacts
  constrain, but they conflate durability of material with durability of political
  effect; the anti-determinist (social construction of technology) is right that outcomes
  are contingent but underestimates that capital investment removes contingency. So
  the maintenance view gives both sides something, at the cost of a prediction: political
  change will be episodic where politics is frozen and continuous where it is leased.

