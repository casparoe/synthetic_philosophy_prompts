  \ t-test. That's a real, memorable event. But do I need to verify titles/dates?\
  \ If I mention them, yes — I should verify. Or I could avoid naming them and just\
  \ describe the episode generically (\"the famous psi study and the Bayesian reanalysis\
  \ of it\"). Better to describe without names to be safe, or verify.\n\nActually,\
  \ the prompt doesn't need real specifics: the summary is invented, attributed to\
  \ an unnamed book/article. But if the summary references a real episode, the model\
