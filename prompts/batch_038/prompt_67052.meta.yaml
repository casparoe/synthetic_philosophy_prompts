  **Draft: The Cut Is a Stipulation**


  Embedded agency is usually introduced by contrast. One kind of agent has a clean
  observation channel and a clean action channel: the environment behaves like a function
  from action sequences to observation sequences, and the agent can in principle hold
  the whole environment in its head without holding itself in its head. The other
  kind of agent is inside what it models. It is smaller than its environment, so no
  hypothesis is fully representable; its own future actions are facts about the environment,
  so choosing is not obviously a matter of comparing outputs of a function; and it
  is made of parts that can be modified and that can optimize at cross purposes. The
  standard taxonomy of resulting subproblems has four entries: decision theory, embedded
  world-models, robust delegation, and subsystem alignment.


  My claim is that the unity of this list is usually mischaracterized. The four subproblems
  are not four faces of one deep feature of the world; they are four consequences
  of one silent stipulation, and the stipulation is ours rather than the world''s.
  Every embedded-agency problem is indexed to a convention about where the agent stops
  and the environment begins. Change the convention and the problem list changes.


  Consider two conventions... [interface convention; teleological convention]


