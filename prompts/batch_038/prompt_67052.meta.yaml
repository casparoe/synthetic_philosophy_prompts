  Essay draft:


  Title: "The Boundary Is a Choice: Why Embedded Agency Has No Single Problem"


  Para 1: Set up. Embedded agency starts from the observation that the agent is inside
  the world it models, so the clean picture of an agent receiving observations and
  choosing actions to maximize expected utility under a realizable hypothesis class
  breaks down. Standard list of subproblems: embedded world-models, robust delegation
  (an agent must build successors/trusted subroutines it can''t fully predict), subsystem
  alignment, and naturalized induction / the grain problem.


  Para 2: Thesis. I claim these aren''t four problems but one problem — plus three
  consequences of a choice we usually make silently: where to draw the agent''s boundary.
  Specifically, the agent/environment cut is not a fact about the world but a modeling
  stipulation, and different stipulations make different subproblems appear or vanish.


  Para 3: Two conventions. Interface convention: agent = a system with a designated
  observation channel and action channel; everything else is environment. Under this
  convention the boundary is fixed in advance and by fiat, so the grain problem is
  trivially solved — but at the cost of making the "agent" possibly a fiction: a training
  loop plus weights plus scaffolding may not compose into a single system with a single
  observation channel. Teleological convention: agent = the process whose objective
  best explains behavior. Under this convention the boundary follows the explanation,
  so mesa-optimization and subsystem alignment are inevitable findings; but now the
  agent''s boundary can shift mid-task, and "robust delegation" becomes ill-defined
  because there is no fixed principal to delegate from.


  Para 4: The punchline: a lot of the argument in this area is a dispute between conventions
  dressed as a dispute about facts. When someone says "there''s no fact about which
  part of the system is the agent," that''s the interface convention complaining.
  When someone says "the subsystem will develop its own goals," that''s the teleological
  convention reporting. Neither is false; they answer different questions. But the
  conventions are not equally licensed: the interface convention licenses prediction
  without self-inclusion (the agent''s model need not model itself, because the model
  sits outside the observation channel), while the teleological convention forces
  self-inclusion (the model of the goal is part of the goal-seeking process). So the
  choice of convention determines whether the agent must solve a self-reference problem
  at all.


  Para 5: Consequence/proposal. Methodologically: state the convention before stating
  the problem. Practically: an engineering team should pick the interface convention
  for the components it builds (fixing the cut at the API) and the teleological convention
  for the components it inherits (asking what the whole is optimizing) — and should
  be alert to the seam where a teleologically-identified agent crosses an interface
  boundary, because that''s where the self-reference problems actually live.


