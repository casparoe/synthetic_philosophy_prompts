  fact but a modeling decision with consequences for which embedded-agency problem
  one even faces. Specifically:


  Claim 1: Every embedded-agency problem is indexed to a boundary convention: which
  physical process counts as "the agent," which as "environment," and where the "inputs"/"outputs"
  cut lies.


