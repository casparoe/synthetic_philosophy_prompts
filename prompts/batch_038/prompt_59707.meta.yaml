  (1) If two hypotheses about the order of conscious events make exactly the same
  predictions about every report, memory, and behavior a subject could ever produce,
  then there is no fact of the matter which is true.

  (2) In color-phi-type cases, the Stalinesque hypothesis (the discrimination is completed
  before the content is "presented," so the experienced sequence already contains
  the color change) and the Orwellian hypothesis (the subject experienced the first
  color right through, and the memory trace was edited before the report) make exactly
  the same predictions about every report, memory, and behavior.

  (3) So in those cases there is no fact of the matter about when the color-change
  content entered the subject''s experience.

  (4) The reason (2) holds is general: any hypothesis about when a content entered
  experience can be re-described as a hypothesis about a slightly different time of
  entry plus a compensating edit to the memory record, and since only the record is
  ever accessible, the re-description always preserves all predictions.

  (5) So for any subject and any experience, there is no fact of the matter about
  when any content entered it.

  (6) But if there''s no fact about when contents enter experience, then there is
  no fact about whether, e.g., I heard the tone before I saw the flash, or about whether
  my pain started before or after you touched my arm — and reports about such order
  are not merely unreliable but neither true nor false.

  (7) So all claims about the temporal order of conscious events are truth-valueless,
  including ones I take myself to know directly.


