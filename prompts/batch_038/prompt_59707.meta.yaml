  Let me write the argument steps cleanly:


  (1) If two hypotheses about the course of someone''s conscious experience imply
  exactly the same reports, memories, and behavior on every occasion, then there is
  no fact of the matter as to which of them is true.

  (2) In color phi trials, the Stalinesque and Orwellian hypotheses imply exactly
  the same reports, memories, and behavior on every occasion.

  (3) So in those trials there is no fact of the matter about when the color-change
  content entered the subject''s experience.

  (4) What makes (2) hold is general: given any hypothesis H that places the entry
  of some content at time t, one can construct a rival H* that places the entry at
  an earlier time t* and adds a compensating revision of the record at t, and because
  the record is the only thing ever available to be checked, H* implies everything
  H implies.

  (5) So for any subject and any content of experience, there is no fact of the matter
  about when that content entered experience.

  (6) Claims about the temporal order of experiences are claims about when their contents
  entered experience.

  (7) So no claim about the temporal order of anyone''s experiences is true or false
  — including my own claim, made a moment ago, that I heard the tone before I saw
  the flash, and the subject''s claim about the order of her own pain and my touch.


