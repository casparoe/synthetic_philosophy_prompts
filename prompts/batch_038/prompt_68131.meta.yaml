  Setup: Coin flip. A fair coin will be flipped at noon; H or T. Agent Ada has credence
  0.5 in H. But Ada also knows that at 12:30 a neurologist will show her a video which
  she will take to be evidence about the coin, and the video is designed to be misleading:
  with probability 1, it will appear to show heads if and only if the coin landed
  tails (an "anti-expert"). So her total evidence at 12:30 makes T more likely. If
  she conditionalizes on her apparent evidence E ("video shows heads"), her posterior
  in H becomes... she knows E occurs iff T, so P(H|E) = 0. Thus conditionalization
  on E gives credence 0 in H — which is correct! Because she knows E is anti-correlated.
  So conditionalization is fine here. That''s not a failure.


  The classic case where conditionalization is bad: agent who knows she will be drugged/demented
  so that her future "evidence" is unreliable in a way conditionalization can''t capture.
  E.g., Ada knows at 12:30 she will be given a drug that will make her forget things
  and hallucinate; her planned rule is "conditionalize on whatever seems to be the
  case", but her hallucinations are unrelated to the coin, and worse, her background
  beliefs will be corrupted. Then a bookie can exploit.


  Actually there''s a cleaner, well-known crux I like better: the diachronic Dutch
  book argument for conditionalization works only if the bookie''s later bets are
  accepted at the odds implied by the agent''s *current conditional* credences. But
  if the agent is uncertain about which proposition she''ll learn (i.e., her partition
  is not known in advance), or if the agent knows she might learn something she currently
  assigns probability 0, then the argument doesn''t deliver conditionalization. The
  zero-probability-evidence case is crisp and arithmetic: Ada assigns P(E) = 0. Conditionalization
  is undefined on E (division by zero), so any update whatsoever is compatible; the
  Dutch book argument, which relies on selling bets now at odds given by P(·|E), has
  no purchase because those conditional credences were never defined. Meanwhile a
  rival rule (Jeffrey conditionalization / imaging / rescaling) applies. Students
  get marks for spotting that the DBA is silent exactly where it is most needed.


