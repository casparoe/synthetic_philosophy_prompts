  Actually here''s a strong niche injection: a "Dutch book" argument applied to an
  agent who updates by Jeffrey conditionalization, or an agent who satisfies all the
  probability axioms but has a *self-referential* credence ("my credence that this
  coin landed heads is 0.5" plus the coin landed heads). Or better: an agent whose
  credences are perfectly coherent but who is nonetheless guaranteed to lose money
  due to the *framing* of a bet on a proposition about their own future credence —
  the "Belief in Belief"/"Epistemic blindspot" case.


  But the more philosophically robust crux: Dutch book arguments presuppose that the
  agent will accept any bet offered at their stated odds (betting interpretation),
  so a coherent-looking set of preferences can be immune if the agent refuses bets
  whose stakes are tiny relative to the risk of ruin, or if the agent''s utilities
  are bounded. Also the "value of a Dutch book" objection: a book might be made against
  an agent whose degrees of belief are unchanging but who is not a bettor — the argument
  only works if degrees of belief are cashed out as betting dispositions. And there''s
  the "money pump"/non-additivity issue.


  Also: the diachronic Dutch book argument (David Lewis) for conditionalization requires
  the assumption that the agent''s later bets will be offered at odds fixed now, and
  that the bookmaker knows the evidence. And there are known failures: agents who
  are certain they''ll receive misleading evidence, or who update by "probability
  kinematics" (Jeffrey) on a partition where the old credence is 0 — a Dutch book
  can be made against an agent who assigns prior probability zero to the evidence
  (Horgan), or against conditionalizers who are certain they''ll get evidence E but
  E is false.


  Actually the classic crux worth building an exam question on: the diachronic Dutch
  book argument for conditionalization is vulnerable to a "self-fulfilling/foreknowledge
  of misleading evidence" case, and more importantly, it requires that the bookmaker
  can buy and sell at the agent''s current conditional credences. If the agent is
  not certain which bets will be offered later, then... Hmm.


  There''s also the well-known fact that the diachronic Dutch book argument against
  non-conditionalizers relies on the bookmaker knowing the agent''s evidence and on
  the agent''s willingness to accept bets whose payoff depends on propositions about
  which they''ve learned nothing. The "dynamic Dutch book" also fails for agents who
  adopt non-conditionalizing rules as a *commitment* — e.g., van Fraassen''s reflection
  principle debates, and the case of an agent who knows she''ll become impaired (drunk,
  sleep-deprived, or about to receive a misleading testimony) and who therefore pre-commits
  to a non-conditionalizing rule. This is the crux: the Dutch book punishes the agent
  for updating badly, but in some scenarios updating badly (or in a non-standard way)
  is actually *instrumentally better* because the agent knows her future evidence
  is unreliable. This is a real, teachable point (e.g., the "misleading evidence"/"anti-expert"
  cases; also the case of "Dutch booking" an agent who will be drugged).


