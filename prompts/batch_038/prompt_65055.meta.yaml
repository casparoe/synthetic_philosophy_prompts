  out a natural kind. If "planet" is a natural kind term, no declaration can change
  its extension — the vote would be an attempt to legislate about nature, which is
  not an accepted procedure (misfire). If it''s a conventional/institutional term,
  the declaration works. So the episode reveals that speech act theory''s account
  of declarations assumes the domain is one where collective acceptance suffices (money,
