  subcommunity (planetary scientists, state school boards? public). And yet for many
  purposes (textbooks, museums, the media) it succeeded — the public now says "eight
  planets."

  - Searle''s constitutive rules: "X counts as Y in context C" — the definition literally
  has this form: any object orbiting the Sun, round, that has cleared its orbit, counts
  as a planet.

