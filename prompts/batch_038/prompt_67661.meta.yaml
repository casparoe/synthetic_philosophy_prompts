  Summary content (mostly right, with 2 subtle errors):


  1. Right: Douglass started as a Garrisonian, denouncing the Constitution as a pro-slavery
  bargain, broke with Garrison around 1851 and announced his change of view in his
  newspaper, came to argue the Constitution could be used against slavery.

  2. Right-ish: he pointed out the document never actually uses the words slave or
  slavery, calling enslaved people "persons held to service."

  3. Right: he argued the Preamble''s stated purposes (justice, liberty) supply the
  rule of interpretation, and "we the people" doesn''t say "we the white people."

  4. Right: this underwrote his shift to supporting political abolitionism, voting,
  the Union war effort, black enlistment.


  Subtle errors:

  (a) Reversed three-fifths clause claim: the summary says Douglass argued the three-fifths
  clause worked *against* the slaveholding states, cutting their representation, which
  is backwards — he treated counting the enslaved, even fractionally, as a bonus of
  political power for slave states, an entrenchment of slavery. Also the summary might
  say he treated it as evidence of anti-slavery intent. That''s the clear error.

  (b) Motivation reduction / anachronistic textualism: the summary says Douglass''s
  real reason for flipping was that Garrisonianism was politically useless and he
  needed a constitutional hook for the new anti-slavery parties, and that once he
  flipped he treated the framers'' intentions as irrelevant because only the text
  counts — i.e., a modern textualist/original-public-meaning view. Douglass did downplay
  secret framers'' intentions and Madison''s notes, but he appealed to the Preamble''s
  declared purposes and a legal maxim that ambiguities should be construed in favor
  of liberty; and he did not reduce the change to pure expediency (he described it
  as coming from study, and he paid a real cost in the Garrisonian world).

  (c) Overstatement: "he dropped moral suasion entirely, called it naive, and became
  a party man" — he never stopped pressing the parties and Lincoln from outside; also
  he never endorsed the Republican platform wholesale (e.g., criticized them on the
  Fugitive Slave Act repeal, on colonization, on Lincoln''s slowness).

  (d) Possible conflation: attributing to Douglass the argument that the Constitution
  is anti-slavery *as a matter of law* in the Spoonerite sense — Spooner argued the
  words would not legally authorize slavery in a court; Douglass''s argument was partly
  about interpretation and the anti-slavery reading being available/required, but
  he also conceded the practice and the pro-slavery intent of some framers. A subtle
  conflation of Douglass with Lysander Spooner. Also Garrisonians'' charge that Douglass''s
  reading was a lawyer''s trick.

  (e) Another possible subtle error: saying Douglass concluded that the Constitution
  *abolished* slavery immediately everywhere in 1789 and that slaveholders were already
  criminals under it — Douglass argued it conferred no warrant for slavery going forward
  and that Congress had power to abolish in the states? He argued it gave the federal
  government power to abolish slavery? He did claim the Constitution gave Congress
  power over slavery in the states? Hmm — in the 1860 Glasgow speech he argued the
  Constitution contains no warrant for slavery, and that "we the people" includes
  black people; he also argued the abolition of slavery was within the powers of the
  general government in certain respects (war power, territories, D.C.). There''s
  nuance. Rather than risk asserting a wrong "fact" in the summary, I''ll have the
  summary make a claim about the *strength* of Douglass''s position — that he held
  the Constitution had already abolished slavery as of ratification and slaveholding
  was already illegal — which is an overstatement of a more modest claim (that the
  document conferred no warrant/authority on slavery and should be interpreted against
  it). That''s a nice "overstated modest thesis" error and is safe.


  Also should I include the asker''s own inclination and a question about whether
  a conclusion survives? Yes: the book then concludes that Douglass''s constitutional
  argument was a political convenience and that modern originalists who cite him are
  just borrowing the prestige of the conclusion while rejecting the reasoning — ask
