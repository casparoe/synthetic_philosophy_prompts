  Now: Infinite ethics desiderata seems the most "philosophically juicy" and least
  regurgitated. Let''s think about what makes a strong desiderata prompt here.


  The purpose: a theory of the "better than" relation over outcomes in which infinitely
  many people exist and have finite well-being — to be used for longtermist policy
  decisions. Desiderata the asker wants:


  1. It must not rank as equally good two outcomes where everyone is strictly better
  off in one (Pareto). Case: world A: everyone at +10 forever; world B: everyone at
  +11 forever. Any theory that says these are both "infinite total" and thus indifferent
  violates Pareto — and it must be avoided.


  2. It must not be sensitive to arbitrary labeling/permutation of persons (anonymity/impartiality).
  Case: relabel the people; the ranking shouldn''t change. Note tension: many proposed
  solutions (discounting, or "the first person''s welfare matters more") violate this;
  and results (Lauwers) show anonymity + Pareto can force insensitivity to finite
  changes.


  3. It must deliver rankings, not incomparability, for the pairs we actually need
  to compare (completeness). Case: two infinite worlds with the same total but different
  distributions — e.g., all at +1 vs. half at +2 and half at 0. If the theory says
  incomparable, it''s useless for the decisions at stake; but forcing completeness
  may require giving up anonymity or Pareto.


  4. It must handle the "adding a happy person to an infinite population" case in
  a principled way: either say it doesn''t matter (and explain why that''s not repugnant)
  or say it does (and explain how, given total utility is unchanged: ∞ + 1 = ∞).


  5. It must handle the "infinitely many people each with unbounded utility" (infinite
  utility per person) case — or explicitly rule it out with a justification.


  6. It must be invariant to how we individuate the same outcome (measure-theoretic
  robustness): e.g., whether we count persons or person-moments, or whether the population
  is indexed by integers or reals. Case: a world with continuum-many persons vs. countably
  many — a theory that works only for countable sequences is suspicious. (Arntzenius''s
  sphere example: points on a sphere.)


  7. It must not collapse under "clumping": value should be assignable to parts in
  a way that doesn''t depend on arbitrary groupings. Kagan/Vallentyne''s clump idea.


  8. It must connect to finite cases: as populations grow large, verdicts should approach
  the finite theory''s (continuity/limiting agreement). Otherwise we get bizarre discontinuity
  at infinity.


  9. It must respect "the same total but with more inequality is worse" (Pareto +
  inequality aversion) or explain why inequality doesn''t apply at infinity.


  10. It must be able to accommodate uncertainty/decision-making: expected-value reasoning
  with infinite values breaks (St. Petersburg / Pasadena-like), so the theory must
  say how to compare prospects, not just outcomes. Maybe optional.


  11. It must avoid "utility monsters" or "value drift": a single infinitely-long-lived
  person''s welfare swamping everything else. Case: an immortal being with small positive
  welfare forever vs. infinitely many short-lived blissful people — which is better?
  A theory that says the immortal wins must explain why.


