  Good combination: "Are dreams experiences? (Malcolm vs. Dennett)" with "Construct
  a thought experiment to specifications." Malcolm''s view: dreams are not experiences;
  dreaming is not an occurrence while asleep; the dream is just the material for the
  waking report — there is no "dreaming" going on, only the impression upon waking.
  Dennett''s view (in "Time and the Observer") similar-ish: the dream is a confabulation,
  a "stalinist" revision — the content is inserted retrospectively. The rival: orthodox
  view that dreams are experiences happening during sleep.


