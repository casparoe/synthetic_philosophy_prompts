  Final draft:


  "I want a thought experiment engineered to separate two positions that are usually
  bracketed together. Both Norman Malcolm and Daniel Dennett deny that dreams are
  experiences — Malcolm for conceptual reasons, since on his view nothing occurs during
  sleep and the only criterion for what someone dreamt is the impression they have
  upon waking; Dennett for empirical ones, since on his view the narrative may be
  composed and written into memory at the moment of waking rather than lived through
  the night. Build me a case in which the two give opposite answers to one plain question:
  did this person dream last night?


  Specifications:

  - Setting: a sleep laboratory, restricted to techniques that exist today. Polysomnography
  is fine; no dream decoding, no implants, nothing pharmacological that a real lab
  would not use. The one variable I want isolated is whether anything about the content
