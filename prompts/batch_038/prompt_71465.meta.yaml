  Setup: A novel set in the 1260s (or unspecified). The character is a Dominican preacher/friar
  advising a baron whose lord has become a tyrant. The argument as drafted:


  (1) Political authority exists for the sake of the common good; a ruler who governs
  for his own benefit rather than the common good is a tyrant, and his rule is not
  true rule but a corruption of it.

  (2) The community that instituted the ruler retains the power to depose him when
  he perverts the end of the office; a tyrant therefore loses whatever claim the office
  gave him, and killing him is not the murder of a legitimate authority.

  (3) Tyranny is itself a kind of ongoing aggression against the community — an unjust
  attack that never stops.

  (4) It is licit to repel an ongoing unjust attack, even lethally, provided one intends
  only the defence of the attacked and not the death of the attacker.

  (5) The baron''s killing of the tyrant is thus defence of the community against
  an ongoing attack, and he intends only its deliverance.

  (6) Therefore the baron may licitly kill the tyrant, and privately, without the
  community''s commission — indeed even against the community''s wishes, since the
  community may be cowed into consenting.


  Where does this go wrong? Several things:

  - Step (3)/(4): equivocation between "tyranny is an ongoing aggression" (a diffuse,
  structural wrong) and the sort of "ongoing unjust attack" that triggers defensive
  necessity. Aquinas''s self-defense (double effect) requires an actual, imminent
  attack; a general condition of misrule isn''t an attack of the kind that licenses
  private lethal force. Also the double-effect condition that one must not intend
  the death — but assassination by its nature intends the tyrant''s death as the means
  of deliverance. That''s a nice trap: (5)''s claim about intention is not available
  in an assassination, because the death is the means, not a side effect.

  - Step (2)→(6): the power to depose belongs to the community (or its public authority),
  not to any private person. Aquinas explicitly denies to a private individual the
  right to kill a tyrant; the community may act, and if there''s no human recourse,
  one must look to God and endure. So (6) slides from communal authority to private
  authorization — the "private person" gap. Also (6)''s add-on "even against the community''s
  wishes" cuts off the very source of authorization invoked in (2): if the license
  comes from the community, a private person acting against the community''s expressed
  will has no license. That''s a scope/authority shift — good.

  - Also the tacit premise that the tyrant is a usurper (ex defectu tituli) vs. a
  legitimate ruler who governs badly (ex parte exercitii). Aquinas''s stronger permissions
  attach to the usurper, against whom anyone may act (no fidelity is owed). But the
  baron''s lord is a legitimate ruler turned bad — so the deposing power belongs to
  the community/superior. That distinction is a classic in-the-weeds point.

  - Also: proportionality/last resort — killing must not produce worse evils (a worse
  successor, civil war); Aquinas worries about the risk that a private killer''s act
  leads to greater harm, and the Church''s own concern about scandal.

  - Also the "cowed into consenting" move: it makes the argument prove too much —
  any dissenter can claim the community''s consent is coerced, so every private killing
  is licensed. That''s the "proves too much" engine, and the novelist''s medievalist
  reader could say it also licenses killing a merely incompetent ruler or a ruler
  who taxes heavily.


  Now — the novelist framing: they want to know which step to have the character drop
  or repair, and what the repair costs dramatically (e.g., if he must act on communal
  commission, then he needs a scene where the commune authorizes him; if he must intend
  only defence, he can''t be a lone assassin). Nice: the "price" of rejecting a premise
  has both philosophical and dramatic cost. That''s a lovely twist on the type — asks
  what rejecting it costs, which the type explicitly wants.


