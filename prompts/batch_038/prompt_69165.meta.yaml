  Move 2 (Jonah): averaging artifact. The ramp is produced by averaging trials time-locked
  to movement onset. Suppose nothing but slow, random fluctuations in motor-cortical
  excitability, and the movement happens whenever the fluctuation crosses a threshold.
  Align all those crossings on the movement and average, and you get a smooth upward
  ramp that looks like a decision forming over half a second, even though in each
  individual trial there was no such ramp — only noise that happened to be rising.
  So the data are exactly what you''d expect on a no-early-decision model; the ramp
  cannot support the claim that the brain committed before the agent was aware.


  Move 3 (Elena): concedes the mechanism but draws the opposite conclusion. Fine —
