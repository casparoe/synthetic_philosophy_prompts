  The reinterpretation replaces an unconscious decision with an unconscious coin toss.
  If the timing of my act is settled by noise crossing a threshold, then when I say
  I chose to act now, the true answer is that a random process resolved itself at
  that moment and I became aware of it a fraction of a second later. That is worse
  for agency, not better, because now the act is not merely uninitiated by consciousness
  but arbitrary.


  Move 4 (Jonah): two errors. First, the drift rides on top of a standing intention
