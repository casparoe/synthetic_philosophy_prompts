  is not an empirical finding but a standing objection to every indeterministic theory
  of agency; it applies whether or not Libet ran his experiment. So the experiment
  contributes nothing to it. Either you''re an incompatibilist about indeterminism
  for independent reasons — in which case the data are beside the point — or you aren''t,
  in which case move 3 fails.


