  The cleaner distinction I can use without risking error: weighting by observers
  vs. weighting by worlds/hypotheses. If you''re doing ordinary Bayesian updating
  on theories and the theory says "there will be 10^30 BBs and 10^20 normal observers,"
  and you then ask "am I a BB?", you need an extra assumption to convert the theory''s
  observer counts into your self-location. Some philosophers hold that "there are
  more observers of type X" doesn''t by itself give you reason to think you''re type
  X unless you assume you''re a random sample. Others hold that the sheer number does
  raise your credence (the "more observers of your kind exist → more likely you exist"
  reasoning).


