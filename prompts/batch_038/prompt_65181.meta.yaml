  Alternatively, the Good''s theorem domain is genuinely less-covered: Good''s theorem
  (1967) on the expected value of information — "On the principle of total evidence"
  — states that the expected gain in utility from an observation is nonnegative, given
  a fixed set of acts and Bayesian updating. Models rarely have detailed knowledge.
  And the "prove too much" argument can be built: information is never harmful → therefore
  always rational to delay action and gather more evidence → therefore a rational
  Bayesian agent never acts / or always prefers an infinite regress of experiments
  → absurd. Plus a novel twist: inject a specific scenario invented by the asker (e.g.,
  a doctor deciding whether to test, with a "costless" test that reveals a partition;
  and the asker generalizes to a "clairvoyance pill" that reveals everything about
  a decision, and the conclusion that you should always take it). There''s a subtle
  flaw: Good''s theorem holds for expected utility conditionalized on the experiment
  being free and the agent being able to act on the result — but crucially it holds
  for the expectation taken before the experiment; and the theorem''s nonnegativity
  is about the ex ante expectation, not about each outcome. Also there''s a slide
  from "never decreases expected utility" to "should always be taken" — an option
  that never lowers expected utility is weakly dominant, but if it strictly costs
  nothing and takes time... The deeper subtlety: Good''s theorem requires that you''re
  choosing among the same acts and that you''ll update by conditionalization; if information
  changes your preferences (e.g., you learn you''re a "smoking lesion" case, or you
  acquire temptation/akrasia), or if you''d be manipulated by what you learn, expected
  value can be negative. Also "free information" includes zero cost, but the regress
