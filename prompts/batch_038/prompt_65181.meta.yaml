  Numbered argument:


  (1) Good''s theorem: for an agent whose degrees of belief are probabilities and
  who updates by conditionalization, and for any experiment whose possible outcomes
  are exclusive and exhaustive and costless to obtain, the expected utility of deferring
  the choice until the outcome is known is at least as high as the expected utility
  of choosing now. Symbolically, max_a Σ_s P(s) u(a,s) ≤ Σ_e P(e) max_a Σ_s P(s|e)
  u(a,s).


  (2) So free information is never expected to hurt: declining costless evidence is
  (weakly) irrational.


  (3) The decision whether to run an experiment is itself a choice among acts, so
  (1) applies to it: the expected value of information about the reliability, relevance,
  or interpretation of a further piece of evidence is likewise nonnegative.


  (4) Iterating, at every stage the agent''s expected utility is weakly increased
  by postponing the decision in favour of one more round of evidence, and there is
  no stage at which the chain terminates.


  (5) Therefore a rational Bayesian agent facing any nontrivial decision ought to
  defer action indefinitely, and will never act.


  (6) A decision theory that never issues an action is not a decision theory; and
  its deliverances cannot be right, since in ordinary cases we know that acting now
  on good-but-imperfect evidence is rational, and indeed obligatory (the frost comes
  whether or not you are still consulting the forecast).


  (7) Hence (1) or (2) is false — information can be expected to hurt even when it
  is free, or the inequality in Good''s theorem does not license the inference to
  "ought".


  Where does it go wrong? Candidate diagnoses:

  - The slide from weak dominance to obligation: (1) yields ≥, and equality can obtain
  (value of information exactly zero when evidence is irrelevant or when the same
  act maximizes conditional expected utility in every cell). Then (2)''s "ought to
  accept" needs a tie-breaking rule; (4)''s "weakly increased at every stage" doesn''t
  produce an obligation to postpone, and (5) doesn''t follow.

  - The iteration is not a new argument: the "defer" strategy evaluated in (1) already
  includes, as one of its acts, the option of running further experiments; the act
  set is fixed. If "consult another oracle" is in the act set, then the value of the
  second experiment is computed within the first problem and the comparison already
  factors it in. So (3)-(4) equivocate between a fixed act set (required by the theorem)
  and a growing act set.

  - Freeness: real waiting costs something (frost, decay, discounting, opportunity),
  so the theorem''s hypothesis fails; and once cost is positive, the value of successive
  rounds strictly declines and a finite optimum exists — no regress.

  - Boundedness/well-definedness: with unbounded utilities, the expectations may not
  exist, so the inequality is not even well-formed (an option the asker might raise).

  - Uncertainty about one''s own future compliance: the theorem assumes conditionalization;
  if you suspect that you''ll be unable to act on what you learn (panic, akrasia,
  forgetting, being manipulated, or having preferences that shift when you learn),
  expected value can be negative — the classic "crime novel" style case where you''d
  rather not know who the murderer is.

  - The partition assumption: if what you''ll learn doesn''t form a partition (you
  might learn something you can''t express, or ambiguous evidence), the inequality
  can fail.

  - Also: (6)''s intuition conflates the ex ante expectation with the realized outcome
  — Good''s theorem is about expectation, so "information hurt me this time" isn''t
  a counterexample.


