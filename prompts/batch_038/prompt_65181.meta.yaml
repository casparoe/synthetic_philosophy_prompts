  not exist, so the theorem''s proof fails and "information is never harmful" collapses.
  Also the "information that you can''t act on" case: if you are constrained (e.g.,
  you must make the decision before receiving results, or you''ll forget), the value
  can be negative.


  Let me consider: the "prove too much" argument for Good''s theorem:


  (1) Good''s theorem: for a Bayesian agent facing a fixed set of acts, the expected
  utility of a free experiment — that is, of waiting to observe the outcome of a partition
  of possibilities and then acting on the conditional probabilities — is at least
  as great as the expected utility of acting immediately. Formally: E[max_a Σ_s u(a,s)
  P(s)] ≤ Σ_e P(e) max_a Σ_s u(a,s) P(s|e).


  (2) Therefore information is never expected-harmful; a rational agent should never
  decline free relevant evidence.


  (3) By the same reasoning, the decision whether to gather evidence is itself a decision
  problem, so the value of information about the value of information is also nonnegative;
  and information about that too.


  (4) So at every level the agent should postpone acting in favor of more evidence,
  ad infinitum.


  (5) An agent that postpones forever never acts and gets nothing; a decision theory
  that prescribes perpetual postponement is not a decision theory but a paralysis
  machine.


  (6) So (1) or (2) must be false: information can be expected-harmful, or Good''s
  theorem must fail.


  The diagnosis: (3)→(4) is the equivocation. The infinite regress requires that each
  level''s information is free and that waiting costs nothing; but the value of information
  is nonnegative, not positive — it can be exactly zero, in which case postponement
  is indifferent, not required. Also, the theorem is about the ex ante expectation
  with respect to a fixed act set and a fixed decision rule; if waiting itself is
  an act in the same set, then the comparison is internal to the decision problem
  and the theorem doesn''t generate a chain. And crucially: the argument slides from
  "weakly better" to "should do," which requires a tie-breaking principle; also real
  waiting has opportunity cost (utility forgone), so the experiment isn''t free; and
  the theorem requires that the agent will conditionalize — if the agent is uncertain
  whether they''ll conditionalize (e.g., they might panic, be tempted, or forget),
  the value can be negative. Also there''s the "self-undermining evidence" case (Adam
  Elga / van Fraassen? — actually the literature on "expected value of evidence" and
  the "reflection principle" — cases where you expect evidence you won''t be able
  to use properly, e.g., drug-induced confusion; or where evidence is expected to
  make you worse off because you''re not a good Bayesian). Also "information that
  changes the act set" or "information about your own utility function." Also Skyrms
  on dynamic coherence; also Good''s own caveat that the theorem assumes the information
  is free and that you can act on it.


  Also: a subtle point — Good''s theorem''s inequality holds only if the max is taken
  over the same act set at each node, and it requires that P(e) > 0 etc. There''s
  also the issue that the theorem compares the expectation of the "wait and see" strategy
  with the "act now" strategy, and both are strategies within one decision problem
  — so the theorem is just the statement that the dynamically consistent strategy
  weakly dominates. That means (3) is fine but (4) mis-describes it: iterating doesn''t
  create a new obligation each time because at each level the comparison already includes
  all further opportunities (the "wait-and-see" strategy at level 0 already incorporates
  the option of gathering more at level 1, 2, ...). The value of information at level
  n is computed relative to an act set that already includes postponement. So the
  regress is not a new argument; it''s absorbed. And since the value can be zero,
  the agent is permitted to stop. Plus: with any positive cost of delay (discounting,
  decay, opportunity cost), the value strictly declines and there''s a finite optimum.


