  you update by conditionalization). Also there''s a subtlety: expected value of information
  can be negative if you''d be unable to act, or if you''d forget, or if you suffer
  from preference reversal / temptation, or if you''re a "smoking lesion" style agent.
  Also the argument proves too much when combined with "so we should always investigate
  before acting" → paralysis → the regress of meta-information.


