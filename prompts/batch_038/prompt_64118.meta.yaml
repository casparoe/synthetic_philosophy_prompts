  ---


  I am a software engineer by training; I have never studied philosophy formally,
  so please excuse and correct my terminology where I have garbled it.


  Once a month I host a small reading group at my flat... Six to eight people, mixed
  backgrounds, no academics... Last month we read the opening chapter of a general
  history of the First World War — the one covering the July Crisis — and afterwards
  two members, whom I''ll call Nadia and Owen, argued for about forty minutes about
  whether the chapter had explained anything at all. I could not referee it and I
  don''t think I understood half of what turned on what. I''d like you to do the adjudicating.
  I''m reporting this as a bystander: I found both of them persuasive at different
  moments, so please don''t read a preference into the way I''ve written it up, and
  don''t try to guess which one I side with.


  The explanandum: why the great powers of Europe were at war by early August 1914.
  The chapter laid out, in sequence, the assassination, the Austrian ultimatum to
  Serbia, the Russian decision to mobilise, the German response and the Schlieffen-plan
  logic that pushed Germany into Belgium, the British decision to intervene.


