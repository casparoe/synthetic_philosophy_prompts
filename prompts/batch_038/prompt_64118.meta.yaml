  Let me write the moves carefully:


  1. Nadia: the chapter is a chronicle, not an explanation. It tells you what happened
  next, in order, and that''s all. To explain why the war happened you''d have to
  show that it was to be expected given the antecedent conditions plus some general
  laws about how such systems behave — about alliances, mobilisation timetables, deterrence,
  whatever. She said historians never state these laws, and that''s not modesty on
  their part, it''s the reason their accounts can''t be checked and can''t be used:
  a story that doesn''t subsume its subject under a generalisation can''t tell you
  whether the same thing is liable to happen again.


  2. Owen: the demand is either empty or self-defeating. Whenever a historian is pressed
  for the law, what comes out is either so vague that anything counts as confirming
  it ("states act to preserve their security"; "governments under strain defer hard
  decisions") or so specific that a single counterexample kills it. And the real content
  of the chapter is not general at all: it lies in showing that each decision made
  sense to the people making it, given what they believed about the others'' intentions
  and what they thought they could get away with. That, he said, is a complete explanation
  — you show the action was the appropriate thing to do in the circumstances, and
  there''s nothing left over to explain.


  3. Nadia: "made sense to them" isn''t an explanation, it''s a redescription in sympathetic
  vocabulary. If I tell you a system behaved as its components were disposed to behave,
  I haven''t explained anything until I say what the dispositions are and how general
  they are. She also said that if Owen were right, then no historical claim would
  be answerable to evidence about anything but the participants'' own testimony, and
  the whole comparative enterprise — asking whether 1914 resembles some other crisis
  — would be illegitimate, which she refuses to accept, because reasoning from precedent
  is exactly what analysts do.


  4. Owen: comparing cases is fine and useful; it just isn''t subsumption. You learn
  from 1914 by understanding it, and then seeing resemblances, not by extracting a
  rule and applying it. He said Nadia is confusing two different jobs: making an event
  intelligible, and licensing a prediction; history is in the first business, and
  demanding that it also do the second is changing the subject.


  5. Nadia: prediction and explanation stand or fall together — that''s the whole
  point of the covering-law model, isn''t it? If you can explain why the war happened,
  you should have been able to say beforehand that it was going to happen given those
  conditions. If you couldn''t, you didn''t have an explanation, you had a good story.


  6. Owen: then almost nothing counts as an explanation, including most of physics,
  since we explain plenty of things we could never have predicted. And the "law" Nadia
  wants for actions — people do what seems best to them given their beliefs — is exceptionless
  only because it''s empty; it can''t tell you which action will follow, so it does
  no explanatory work; all the work is done by the particular beliefs, which aren''t
  law-governed.


  7. Nadia: fine — then admit that explaining an action always does depend on some
  rough generalisation about how people respond to situations, even if you can''t
  write it down precisely, and the dispute is only about how precise it has to be.
  Owen said that if that''s her position she''s given up the covering-law requirement,
  because a generalisation nobody can state isn''t doing any work.


