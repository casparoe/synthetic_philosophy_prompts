  be. The commission determines a revenue requirement by taking the utility''s rate
  base, applying an authorized rate of return on the equity portion, adding operating
  expenses and taxes, and then allocating the total across customer classes. Every
  input to that number is disputed: the prudent cost of a particular gas plant, whether
  an imprudent investment should be excluded from the rate base (the used-and-prudent
  standard), whether a demand-side program counts as an expense or an asset, what
  the allowed return on equity should be, and how much of the cost of a storm-hardening
  program belongs in this vintage of rates. At the end, a public body issues a determination
  that fixes, by administrative fiat, the price of electricity for several million
  people until the next review."


  Paragraph 2 — the puzzle, tying to the calculation debate:


  "My training taught me that this practice is supposed to be impossible. In the socialist
  calculation debate, Mises argued that economic calculation in the absence of market
  prices for the means of production is not merely difficult but unintelligible: there
  is no common denominator in which to compare alternative uses of capital goods,
  and no way to tell whether a plan is efficient or wasteful. Hayek pressed a different
  but related point: the knowledge that prices summarize is dispersed, tacit, and
  often known only to particular people in particular circumstances, so it cannot
  be collected by any central agency however sophisticated. Lange''s reply was that
  a planning board could treat prices parametrically — announce a set of numbers,
  observe surpluses and shortages, and revise by trial and error — and that such a
  board could in principle do better than a real market, since it need not respect
  the myopia and externalities of actual firms. Now: my commission is doing something
  that looks exactly like the Lange procedure. It announces a price, watches what
  happens, and revises at the next review, and it explicitly uses benchmarking against
  comparable utilities as a proxy for the competitive discipline it cannot observe
  directly. And there is a version of the Averch–Johnson result sitting in the middle
  of it — under a fair-return-on-rate-base regime the firm has an incentive to over-invest
  in capital, which means the administrative price changes the very cost data the
  commission then relies on."


