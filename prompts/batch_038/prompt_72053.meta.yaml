  only: the chamber makes recommendations, the council must publish a reasoned response
  within ninety days, and that is the end of it. (b) A suspensive power: the chamber
  may return any council decision within its remit to the council once, with written
  reasons; if the council re-passes the decision unchanged by a simple majority, it
  stands; if the chamber returns it a second time, the decision lapses unless re-passed
  by a two-thirds majority. (c) Concurrency: over a defined list of matters — the
  libraries and leisure service, the local plan''s allocation of housing sites, the
  active travel network — the chamber''s recommendation becomes council policy automatically
  unless the council rejects it by two-thirds within sixty days. Two things constrain
  the choice. First, our monitoring officer''s advice is that the council cannot lawfully
  bind itself irrevocably in advance, since that would fetter the discretion of future
  councils, so any binding effect has to be engineered as a procedural requirement
  about how decisions are taken and recorded rather than as a transfer of decision-making
  power; she has also warned that the chamber cannot be given any role in the setting
  of the precept or in decisions we are under a statutory duty to make, such as producing
  a balanced budget or safeguarding children''s services. Second, and this is the
  wrinkle that has actually deadlocked us: under all three options the chamber''s
  agenda is set by the council. Officers draft the question, officers compile the
  briefing pack, and officers choose which decisions get referred to it. One of our
  co-opted academics has pointed out that this makes even option (c) a check that
  the checked party controls, and has proposed an amendment under which the chamber
  may instead call in any council decision of its own motion, or take up a topic if
  a petition of, say, three thousand residents asks it to — which would give it real
  agenda-setting power but also, he concedes, turn it into a rival to the elected
  chamber rather than a supplement. The campaign group that has been briefing councillors
  against the whole scheme takes the opposite line: they say the chamber is a fig
