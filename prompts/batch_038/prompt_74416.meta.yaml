  1. Propositions are sets of worlds; a doxastic state is a set of worlds; believing
  is the subset relation. (Possible-worlds semantics for belief.)

  2. Hence, for any S and any p: S believes p iff B_S ⊆ p.

  3. B_S is the intersection of the propositions S believes. (Follows from 2: the
  intersection of all believed p''s; indeed B_S ⊆ p for each believed p, so B_S ⊆
  ∩{p : S believes p}; and conversely... need the converse. Fine — this is the standard
  assumption that the belief set is recoverable.)

  4. If a set of propositions is inconsistent — no world makes them all true — then
  their intersection is empty.

  5. There is an agent whose believed propositions are inconsistent. Pierre: believes
  London is pretty (from postcards) and believes London is not pretty (from his neighborhood),
  without realizing that ''Londres'' and ''London'' name one city. (Kripke''s puzzle
  — the standard moral is that Pierre has contradictory beliefs.)

