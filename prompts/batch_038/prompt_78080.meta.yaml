  Grounding is usually taken as a strict partial order (irreflexive, transitive, asymmetric)
  with the direction from ground to grounded (or grounded-by). Well-foundedness: no
  infinite descending chains of grounds. The analogue: a chain of ordinals ω (0,1,2,...)
  has no greatest element; if grounding goes "downward," an infinite descending chain
  would be like the negative integers. But a chain with a "limit" element at the bottom
  — e.g., an element that is grounded by infinitely many things below it, where the
  chain below it is infinite — is not well-founded but still has structure. Analogy:
  in set theory, the class of all sets isn''t well-founded under ∈ if there are Quine
  atoms; but here the analogy is: a "limit ground" — an entity G that is grounded
  by an infinite descending chain yet is itself the ground of everything above. This
