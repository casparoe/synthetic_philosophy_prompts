  **Working title:** Closure Without Termination: Grounding Fixed Points and the Myth
  of the Ungrounded Base.


  **Abstract-ish:** Metaphysical foundationalism is usually defended by claiming that
  grounding must be well-founded, since otherwise explanation would never be completed.
  I argue the inference rests on a suppressed premise: that explanatory work is done
  only by *terminating* chains. I propose a distinction between two properties a grounding
  structure can have. Termination: every descending chain ends in an ungrounded entity.
  Closure: every entity has grounds, and the grounding structure assigns determinate
  identities/truth conditions to everything, even if some descending chains are infinite.
  Foundationalists (and their infinitist critics) argue almost entirely about termination;
  but the explanatory desiderata they invoke — no vicious circularity, determinacy
  of what grounds what, non-trivial explanation — are all closure conditions. I then
  argue closure can be satisfied without termination by a *fixed point* of the grounding
  operator: an entity (or network of entities) whose grounds descend infinitely but
  which is nonetheless the source of determinacy for everything it grounds. Paradigm
  case: the pure powers ontology, where each dispositional property''s identity is
  fixed by its relations to others, generating the familiar regress; on the natural
  way of developing that view, the network is a fixed point — every node is grounded,
  no node is ungrounded, and the structure is nonetheless complete. I argue the asymmetry
  of grounding is best read not as a priori but as a default constraint that such
  cases defeat, and that a metaphysics with fixed points can accept a weakened irreflexivity
  (no entity grounds itself) while giving up transitivity-driven well-foundedness.


  Then the ask: comments on:

  1. Is the termination/closure distinction doing real work, or is it a relabeling
  of the distinction between "having no ground" and "grounding everything else" (i.e.,
  Schaffer''s two senses of the fundamental) — in which case my "fixed point" is just
  priority monism with an infinite base?

  2. Is the powers-network example coherent? Mutual/symmetric grounding is banned
  by irreflexivity + transitivity: if A grounds B and B grounds A, transitivity gives
  A grounds A. So my fixed point either is a genuine loop (and I must give up transitivity,
  which I don''t want) or it''s an infinite descending chain with no loop (in which
  case it''s just infinitism, already in the literature, and the "fixed point" label
  is empty). Which horn should I take?

  3. Is the claim that well-foundedness arguments presuppose termination-based explanatory
  work actually right, or do the standard arguments get their force from something
