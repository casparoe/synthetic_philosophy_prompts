  ---


  I co-teach a small graduate seminar on decision theory, and this term the discussion
  of ambiguity aversion has ossified around a claim I want to put under pressure.
  One of my students maintains that the familiar preference for options with stated
  probabilities over options whose probabilities are left unstated is nothing but
  pessimism about the unstated ones: an agent who evaluates each option by the worst
  expected value it could take across the probability functions she treats as live,
  on her account, is committed to avoiding ambiguity in every gain-only choice, so
  a strict preference for the ambiguous option can only reflect optimism, a misdescription
  of the case, or a slip in the arithmetic. I want to hand the seminar a counterexample
  to work through rather than an assertion to argue about, and I would like you to
  build it.


  Construct a decision problem in which one and the same agent, confronting one and
  the same source of ambiguity, exhibits the standard pattern in one choice and the
  reversed pattern in another: she strictly prefers the option with the precisely
  specified probability when the payoffs are moderate and the outcome fairly likely,
  but strictly prefers the option whose probability is unsettled when the payoffs
  are longshots. The specifications are as follows. The setting must be ordinary and
  realistic — small-business procurement, clinical choice, municipal budgeting, hiring,
  or something of that grain — and must contain no urns, balls, colored slips, decks,
  coins, dice, lottery tickets, or other gambling apparatus; the ambiguity has to
  arise from a situation in which the probability is genuinely unsettled rather than
  merely unknown to the agent, and you should say in a sentence or two why that is
  so rather than a matter of her ignorance. The two choices must draw their uncertainty
  from the same source and the same kind of source, so that the reversal cannot be
  attributed to two different species of uncertainty; only the payoff structure and
  the baseline likelihood may vary. Give every number explicitly, with payoffs at
  magnitudes a normal person might actually face, and state the specified probability
  as a definite figure. Keep the scenario itself under roughly 250 words and self-contained,
  so that a reader who has not seen this request can follow it, and put the analysis
  after it rather than inside it. Finally, the reversal may not be explained by the
  agent''s irrationality, her confusion, a framing effect, or an error of calculation
  on her part: it has to fall out of the structure of the case.


  Then show that the case does what I have asked for. Run both choices through three
  evaluators, described functionally rather than by name: an agent with a single probability
  function and a utility function over outcomes; an agent who scores each option by
  the lowest expected utility it attains across a set of probability functions she
  treats as live; and an agent who forms an expectation over that same set using a
  weighting of her own and brings a distinct attitude toward the spread itself. For
  each evaluator and each of the two choices, give the arithmetic, not a summary —
  I want to see whether the second evaluator really is committed to the standard pattern
