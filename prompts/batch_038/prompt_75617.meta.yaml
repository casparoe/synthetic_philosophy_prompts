  Draft:


  "I work in public-sector integrity — mostly desk reviews and field visits for municipal
  licensing offices in two very different countries — and I have been trying for some
  time to pin down a pattern that my colleagues and I keep describing with hand-waving
  phrases like ''the office has gone soft'' or ''it runs on relationships now''. I
  am writing an internal methods paper and would like to know whether the political
  science and philosophy-of-corruption literature has a term for it, because the terms
  I have run across all seem to be adjacent without being it.


  Here is the pattern, in two of its typical instances. [Instance 1] A business-licensing
  clerk works under a written rule that says applications are handled in order of
  receipt, with an explicit discretionary clause permitting expedited handling in
  documented hardship or public-interest cases. Over five years she exercises the
  clause several hundred times. Each individual use is properly documented, the hardship
  is real in each case, and no one could point to a rule she broke. But nearly every
  expedited file belongs to someone inside her network — former classmates, relatives
  of people who stood as pallbearers at her father''s funeral, shopkeepers who have
  lent her brother money — and the effect on the queue is that a person with no connection
  to her can no longer realistically expect a license. She takes no money, and her
  own standard of living does not change; what she accumulates is a stock of owed
  favors, which she then spends on her family. [Instance 2] The same shape in a district
  works department: an engineer allocates road resurfacing under a clause permitting
  him to reprioritize for safety, and each reprioritization is defensible in isolation,
  but after three years the map of resurfaced roads is legible as a map of his obligations,
  while the safety rationale in each memo is genuine and unchallenged.


  What makes this resist the labels I know: [list]. Clientelism seems closest, but
  as I understand it that involves a patron supplying material benefits in exchange
  for political support, usually electoral, and there is nothing electoral here and
  no bargain struck — the obligation is diffuse, unpaid, and would be denied by both
  sides if named. Patronage is about appointments rather than service delivery. Nepotism
  names a single act of favouring kin, and this is not an act but a drift: the partiality
  is assembled out of hundreds of individually legitimate exceptions, so there is
  no moment at which anyone decided to run a particularist office. State capture describes
  outsiders rewriting the rules; here the rules are untouched and the change happens
  inside the space of discretion the rules already grant. Conflict of interest assumes
  an identifiable interest on one side of an identifiable decision. And ''institutional''
  or ''legal corruption'', as I have encountered the phrase, usually describes lawful
  mechanisms — campaign money, lobbying — distorting an institution''s mission, whereas
  here nothing is lawful about the aggregate and nothing unlawful about any part,
  which may or may not be the same point. There is also a feature I do not know how
  to handle: the officials and their clients do not experience any of this as corruption
  but as keeping faith with people to whom one is genuinely obligated, and I want
  to know whether the right term can be stated without already taking the side of
  the audit mission against the side of the neighbourhood, or whether that neutrality
  is impossible.


