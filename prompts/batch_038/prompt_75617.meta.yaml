  Let me use two instances:


  Instance 1: A municipal business-licensing clerk. Written rule: applications are
  processed in order of receipt, and discretion exists only in narrow, listed circumstances
  ("hardship cases," "public-interest expeditions"). Over years, the clerk grants
  expeditions in hundreds of individually documented hardship cases, and the pattern
  is that all the expedited applicants are people with whom the clerk or her relatives
  have standing personal ties — former classmates, the families that attended her
  father''s funeral, the shopkeepers who lend money to her brother. Each expediting
  memo is individually justified; the hardship is real in each case; no money changes
  hands; the clerk''s own material position doesn''t improve. Yet after five years,
  the queue for people without ties has grown to a point where a stranger effectively
  cannot get a license, and the clerk''s network of reciprocal obligations has become
  the de facto allocation mechanism, with her as its clearinghouse. She draws no rent;
  she accumulates credit in the form of owed favors, and spends it on her kin.


  Instance 2: A head nurse allocating overtime shifts / a district engineer allocating
  road repairs. Similar structure: each decision defensible under the discretionary
  clause; the aggregate is a private network operating under the shell of a public
  office.


