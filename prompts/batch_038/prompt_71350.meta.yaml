  the claim that we are condemned to be free / freedom is unlimited, and the claim
  that we can have motives; the problem of how bad faith is possible without self-deception
  requiring two knowers; the relation between the pre-reflective cogito and the ability
  to be in bad faith (Sartre says the "censor" must know what it represses); the paradox
  of "choosing not to choose"; whether bad faith is itself a free choice for which
  one is responsible (and whether one could then choose authenticity freely, and what
  happens if authenticity is itself a project of self-transparency — is it another
  bad faith?); also the puzzle of how Sartre can say anguish reveals freedom while
  also saying we flee anguish; and the tension between radical freedom and "coefficient
  of adversity"/facticity — Sartre says the rock resists only within a project; how
  can there be constraints at all?


