  uploading and gradual replacement," persona novelist, casual, typo or two, request
  American English.


  Specifications to include (make them concrete and jointly satisfiable but not trivial):

  1. Realistic-ish near-future medical setting, not a beam-me-up teleporter; a disease/neurodegenerative
  condition as the motive for replacement (nice: the replacement is therapeutic, not
  elective, which raises stakes and removes "she chose to die" reading).

  2. Single variable isolated: the rate/profile of replacement — everything else identical
  (same endpoints, same total number of modules replaced, same functional architecture,
  same person''s memories and character preserved in the sense that each module''s
  replacement is function-preserving at the moment it happens).

  3. The verdict must come out in the counterintuitive direction: a slow, stepwise,
  "safe-seeming" replacement is *worse* (more likely to be or to involve a death/duplication/personhood
  problem) than a fast one — and the reason must not be that slow replacement is botched
  or that the technology malfunctions. The badness must fall out of a feature that
  is intrinsic to a correct, successful procedure.

  4. No cheating devices: no soul-detectors, no perfect neuroscientist oracle, no
  magic; the "personhood" question should be handled by the theories, not by stipulation.

  5. Then the demonstration: state what each of at least three views says — psychological-continuity
  theorist with a nonbranching clause (Parfit-style), the functionalist gradualist
  who thinks functional isomorphism preserves consciousness/identity step by step
  (Chalmers''s gradual replacement / dancing qualia line), and an animalist or biological-continuity
  view (Olson-style: you''re an organism, so the replacement kills you regardless
  of speed) — and also maybe a "simple view"/closest-continuer view. Show where they
  agree and disagree, and specifically which ones track the rate variable and which
  don''t.

  6. Say which feature of the case does the work, and what happens if you remove it
  (e.g., if the overlap period is shortened to zero; if the two systems are prevented
  from diverging by a shared input channel / locked coupling).

  7. Note how a defender of the theory that comes out badly would attack the case.

  8. Length constraint: scenario in ~3 paragraphs or under 300 words, no more. And
  answer in American English.


  Also maybe ask for whether the case can be fixed to be *fully* determinate, or whether
  the residual disagreement is verbal.


