  I audit an informal reading group that has been working through theories of divine
  providence for the better part of a year. I keep the group''s shared write-ups,
  which is why I want to record last week''s argument accurately: two of the regulars,
  Nadia and Ross, went seven rounds on Molinism and neither could land a blow the
  other would accept. I don''t share either of their commitments — I''m there for
  the argument, not the theology — so I''d like an outside referee. Their exchange
  went roughly as follows.


  (1) Nadia opened with the grounding problem, framed as a squeeze on the Molinist''s
  own claim that middle knowledge is prevolitional: God does not decide counterfactuals
  of creaturely freedom, He discovers them. So nothing about the divine will makes
  them true. Nothing about the creature makes them true either, since the creature
  does not yet exist and, on libertarian freedom, nothing in its nature or situation
  settles which way it would go — that absence of settling is the whole point of the
  freedom being posited. And the circumstances cannot make them true, since they are
  specified as underdetermining. With no candidate settler, Nadia said, such conditionals
  are neither true nor false, and middle knowledge has no content.


  (2) Ross answered that this assumes every truth needs a truthmaker, which is itself
  a substantive thesis and not a neutral starting point; a theory that renders a large
  class of ordinary claims truth-valueless pays a heavy price. We confidently assert
  things like: if you had offered her the post she would have declined. Ross said
  he is not claiming we have infallible access to such conditionals, only that they
  have truth values, and that God''s cognitive situation is simply a limit case of
  ours.


  (3) Nadia pressed an asymmetry. In the actual sequence a brute fact can be an exercise
  of agency: someone does something, and agency is a tolerable stopping point for
  explanation. In middle knowledge the brute fact is a proposition''s being true —
  before any agent exists, before any choice is made, before any decree is issued.
  A truth with no subject and no author, she said, is not a stopping point but an
  orphan. She added the sovereignty cost: if God selects from a menu of creaturely
  counterfactuals He neither wrote nor can rewrite, then the shape of the created
  order is partly fixed outside Him, which anyone holding a strong doctrine of divine
  aseity should find unpalatable.


  (4) Ross replied that the rivals are worse, and offered a trilemma. Either God determines
  every choice, in which case He authors sin and the libertarian freedom everyone
  wanted is gone; or God creates without knowing what free creatures would do, in
  which case providence is not meticulous, God is exposed to surprise, and any theodicy
  resting on His knowledge of the goods that will come out of permitted evils loses
  its footing; or middle knowledge. On the aseity charge he said the objection proves
  too much: God''s will is also constrained by necessary truths He did not make and
  cannot alter, and being unable to make cruelty good has never been thought a defect.
  Sovereignty, he said, is control over what happens, not authorship of every truth.


  (5) Nadia then turned to the redeemed. On the traditional fourfold scheme the glorified
  end up free yet unable to sin. Molinism therefore needs conditionals of the form:
  were this person in beatific circumstances, she would freely and forever choose
  the good. Her dilemma: if those circumstances settle the response, Ross has granted
  the very thing the grounding objection says a free agent''s circumstances cannot
  do, and he owes an explanation of why settling obtains in heaven and nowhere else;
  if they do not settle it, heaven carries a standing risk of defection, and the stability
  of the blessed is a matter of luck rather than of providence.


  (6) Ross took the first horn but narrowed it. What libertarian freedom excludes,
  he said, is external necessitation, not every form of settling; a choice that flows
  from a character the agent has confirmed in herself is settled without being compelled.
