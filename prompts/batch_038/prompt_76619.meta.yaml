  The conceit is this. The novel has a hundred chapters and each chapter is a life,
  told entire and in the same flat register. The first belongs to a composer who gets
  forty years of the most intense creative activity a person can manage and dies at
  the height of it. Each subsequent life is very slightly less excellent in that respect
  — I have calibrated the losses so that any one of them, taken alone, would be too
  small for anyone to notice — and very slightly longer, so that the hundredth consists
  of several centuries of mild, undemanding comfort. There is a frame: a committee
  reads the chapters and ranks them, and the ranking runs unbroken from the first
  to the last, best to worst. The book is meant to be read as a descent, and the last
  chapter is meant to be the worst thing in it.


  The third act, meanwhile, turns on a choice I need to be genuinely unrankable. The
