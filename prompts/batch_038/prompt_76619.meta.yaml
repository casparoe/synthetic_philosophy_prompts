  by the same reasoning applied to art, that any chain of pairwise improvements licenses
  ranking a banal work above a masterpiece. The conclusion she can''t accept: that
  there is no such thing as a spectrum at all, i.e. that any two things differing
  in two respects must be strictly comparable, with no ties and no parity — which
  would destroy the possibility of tragedy in her novel (the whole book depends on
  a genuinely unrankable choice).


