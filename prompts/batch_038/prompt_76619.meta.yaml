  The classic spectrum argument (Parfit''s "mere addition"/Repugnant Conclusion machinery,
  and Temkin''s transitivity-denial):

  - For any two lives, if one has more of a good quality and only slightly less of
  another, the better-quality life is better.

  - Repeat across a spectrum of 100 lives where quality decreases imperceptibly and
  quantity increases.

  - By transitivity of "better than", the first (Mozart, living briefly) is better
  than the last (oyster-like, living for centuries).

  - But intuitively the last is worse.

  - So either "better than" is intransitive, or our intuitions at the ends are wrong,
  or some step fails.


