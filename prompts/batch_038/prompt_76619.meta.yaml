  Now, where does it go wrong? Multiple candidate flaws:

  (a) Step three: "no detectable difference can make one better than the other" —
  this conflates epistemic undetectability with metaphysical absence (and it''s the
  vagueness/sorites engine). Rejecting it costs: you must accept that betterness can
  outrun any possible experience of it, which sits oddly with a value theory grounded
  in experience; and you must face the sorites (if each step matters, where does it
  stop?).

  (b) Step five: the "emergence" premise — that a difference between the ends must
  be witnessed at some link. This is the invalid step; transitivity of better-than
  does not license it. Rejecting it is the small-improvements/parity move: adjacent
  pairs can be on a par while the ends are strictly ranked. Cost: parity is a fourth
  relation, and its own transitivity properties are murky; and it looks like special
  pleading unless you can say what makes some pairs on a par and others equally good.

  (c) Step seven: the denial of incomparability via money-pump. Cost: the money-pump
  argument applies to preference cycles, not to incomparability; but there is a pumping
  worry for incomparability too (a resolute chooser / a willingness to trade at zero
  cost both ways). Also if you allow incomparability you must explain how practical
  reasoning proceeds among incomparables — and the novelist wants exactly that.

  (d) Step nine: from "some difference is perceptible" to "the options are strictly
  comparable" — a slide from one perceptible respect to all-things-considered betterness;
  ignores multi-dimensional tradeoffs where a perceptible difference in one respect
  is offset by an unspecified difference in another. This is where "proves too much"
  bites hardest: step nine alone would show that any two novels differing perceptibly
  in any respect are strictly ranked, which is absurd.

  (e) The whole thing also equivocates between "better than" for lives (well-being/prudential)
  and "better than" all-things-considered or aesthetically — the spectrum of lives
  involves wellbeing; the manuscript example involves aesthetic value; the argument
  slides between them at step eight.


