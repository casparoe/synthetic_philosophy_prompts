  I''m a third-year PhD student and I''ve been asked to present at our department''s
  reasons-and-rationality reading group next month, and I want to commit to a heretical
  line so the discussion is at least a bit lively. So: please make the best argument
  you can for the view that there are no wrong-kind reasons — that is, that whenever
  it looks like you have a reason to adopt some attitude that has nothing to do with
  the attitude''s object, the correct description is that you have a reason to *want*
  to have the attitude, or a reason to *bring it about* that you have it, and never
  a reason for the attitude itself. The demon who threatens to punish you unless you
  admire him: on this view you have an overwhelming reason to want to admire him,
  and to arrange your life so that you come to admire him, but not one scrap of a
  reason to admire him. Belief is the easy case (it looks like just evidentialism
  restated), so I want the hard part done: fear, admiration, guilt, resentment, intention
  — the attitudes where the "you can''t just decide" objection is supposed to bite,
  and where people say the reduction makes a hash of the fact that these reasons still
  show up in deliberation.


  Two things I''d like handled explicitly. First, the asymmetry I keep coming back
  to: the demon case seems to behave differently across attitudes. He threatens to
  torture you, which arguably makes him genuinely fearsome — dangerousness just is
  what makes fear fitting — so the reason to fear him looks like a right-kind reason,
  whereas nothing about him makes him admirable. If that''s right, then the wrong-kind/right-kind
  distinction isn''t doing any work in the fear case, and my view should say so: I
  want you to argue that the apparent asymmetry is best explained by the objects of
  the attitudes differing, not by reasons differing in kind, and that this actually
  helps the no-WKR view rather than embarrassing it. Second, the objection that the
  reduction is idle because reasons to want an attitude can''t be acted on in the
  same way: you can''t intend to admire someone as a means, any more than you can
  intend to believe at will, so the "reason to want it" verdict leaves the agent with
  nothing to do in the moment. Say whether that objection is fatal, and if it isn''t,
  say what the no-WKR view tells the agent in front of the demon to actually do.


