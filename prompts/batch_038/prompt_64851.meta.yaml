  place. My hunch is that the whole wrong-kind-of-reasons literature is generated
  by running together two different questions — what makes an attitude fitting, and
  what an agent ought, all things considered, to do about her attitudes — and that
  once you pull them apart the demon case stops looking like a counterexample to anything.
