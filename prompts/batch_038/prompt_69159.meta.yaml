  Surrogate goals (Evan Hubinger, Caspar Oesterheld, 2023 paper "Surrogate Goals").
  Core idea: An agent''s real terminal values may be compromised by acausal threats/attacks
  (e.g., another agent threatens to torture a gazillion simulated copies of the agent''s
  ancestors unless it does X). The problem: if the AI gives in to threats about its
  real values, it''s compromised in a way that damages everything; also giving in
  teaches/precommits to being exploitable. So instead, we build an AI with a surrogate
  goal: an additional goal that it treats as terminal-ish and is willing to trade
  in acausal deals, but which is deliberately isolated from its real values and which
  is cheap to "lose" or satisfy. Then acausal threats can be directed at the surrogate
  goal rather than real values. Key questions/challenges in the literature: (1) How
  do we specify a surrogate goal that the AI treats as genuinely terminal and cares
  about enough that threats against it work, but which doesn''t become entangled with
  its real values (no instrumental convergence onto it, no leakage)? (2) How do we
  ensure the AI only makes acausal deals involving the surrogate goal and doesn''t
  trade away real values? (3) Does the attacker even believe the surrogate goal is
  real — verification problem: in acausal interactions, the threatener can''t check;
  how does the AI credibly signal it has a surrogate goal? (4) Does having a surrogate
  goal reduce or increase risk — it gives attackers a cheap handle, potentially making
  threats more effective/more frequent; and if the AI can be made to care about something
  extra, why not just... (5) The "surrogate goal might be more important than real
  values" / trade-off problem: the AI must decide when protecting the surrogate is
  worth compromising on. (6) Whether surrogate goals even matter if the AI''s real
  values are things like "make the future good" and the threatener threatens simulated
  copies — does the AI care about acausal attackers at all? (7) Commitment races /
  whether AI systems will be able to precommit, and whether the surrogate goal must
  be created deliberately by us now (design time) vs. adopted later. (8) Alternative:
  just make the AI ignore acausal threats (but then it loses beneficial acausal trade).
  (9) Whether it''s better to have many surrogate goals or one. (10) The "surrogate
  goals don''t help against attackers who want to know your real values" — an attacker
  might threaten the surrogate goal to learn about the AI''s disposition to comply,
  i.e., a test.


