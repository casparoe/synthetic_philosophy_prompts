  I teach and work in the economics of organizations — Coase, transaction-cost economics,
  the Grossman–Hart–Moore property-rights approach, mechanism design, and the fiscal-federalism
  literature on the assignment problem. I have essentially no training in political
  philosophy or constitutional law; I know subsidiarity only as the word federalists
  use.


  At a seminar last month, a colleague of mine defended the following analogy: a federation
  is a holding company whose constituent units are wholly-owned operating subsidiaries;
  subsidiarity is the principle that determines where residual control rights over
  an activity should sit; and the whole constitutional apparatus built around subsidiarity
  — the treaty language, the encyclical that originated it, the protocol giving national
  parliaments a veto-ish role — is just the corporate governance equivalent of a decentralization
  policy memo. He then drew two conclusions from it:


  (1) Subsidiarity is purely an efficiency principle: allocate decision rights to
  the level that minimizes the sum of coordination costs, agency costs, and preference-mismatch
  costs, exactly as Oates''s decentralization theorem trades scale economies and spillovers
  against heterogeneity of tastes. Nothing normative survives; the moral vocabulary
  — Pius XI''s Quadragesimo anno (1931), which treated the transfer of a lower association''s
  tasks to a higher body as an injustice and a disturbance of right order rather than
  as a miscalculation — is decoration, and the EU''s Article 5(3) test (act only if
  the objectives cannot be sufficiently achieved by the member states and can better
  be achieved at Union level by reason of scale or effects) is a cost-benefit test
  wearing a robe.


  (2) Therefore subsidiarity supplies no brake on centralization. If the center can
  plausibly claim the scale-and-effects test, subsidiarity itself requires the transfer
