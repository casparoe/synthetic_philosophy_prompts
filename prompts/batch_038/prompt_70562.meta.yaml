  I work on machine-learning systems rather than philosophy — my day job involves
  evaluating probabilistic forecasters with proper scoring rules, checking calibration,
  and deciding which update rules to apply when a model receives new inputs. Reading
  into the philosophical side of this, I landed on the accuracy-first program (Joyce,
  Pettigrew and the work downstream of them), which I take to argue roughly as follows:
  epistemic norms for credences are grounded in the single value of accuracy, measured
  by an inaccuracy score over whole credence functions; incoherent credences are ruled
  out because any incoherent credence function is accuracy-dominated, in every possible
  world, by some coherent one; and conditionalization is recommended because, among
  candidate updating rules, it maximizes expected accuracy, where the expectation
  is taken with respect to the agent''s prior credences.


  The position I want you to argue for is that this program is not a single argument
  but two arguments held together by an unacknowledged shift in decision-theoretic
  criteria, and that no one criterion can do both jobs. The dominance argument for
  probabilism evaluates credence functions world-by-world and deliberately ignores
