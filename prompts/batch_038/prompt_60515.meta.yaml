  any institutional response time, all the safety and governance work must be finished
  before the threshold is approached, and the threshold itself must be treated as
  a bright line rather than a region. She calls this the control-rod point. Several
  of my students have found the analogy persuasive in a way I cannot quite account
  for, and I suspect it is doing more work than it can bear.


