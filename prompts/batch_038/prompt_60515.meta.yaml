  — what plays the role of the neutron, of the multiplication factor, of the fissile
  mass and its enrichment, of the moderator, of the geometry that determines whether
  a given quantity of material is critical, and of the control rods — and then a sorting
  of the disanalogies into those that actually threaten her conclusion and those that
  are merely picturesque. Two candidate disanalogies I keep returning to, and would
