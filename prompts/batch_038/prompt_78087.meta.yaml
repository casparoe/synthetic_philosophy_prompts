  Then the hypothesis:

  "inevitable" may cover two claims:

  (i) a claim about the actual historical record: given the state of the field, someone
  arriving at this soon was highly likely (a conditional probability over a population
  of researchers).

  (ii) a counterfactual claim about the individual: take this person out and the result
  still appears, at about the same time, with about the same content, in a world otherwise
  similar.

  Evidence (multiple discovery statistics) bears on (i) but is nearly silent on (ii),
  and (ii) depends on how you hold the background fixed — remove Newton but keep the
  Cambridge mathematical culture? Remove the whole tradition? Each side may be answering
  the version it can win.

  Plus a measurement problem: you can''t count multiples without deciding what makes
  two results "the same discovery" and what makes two paths "independent" (Wallace
  and Darwin corresponded through a shared network; Bell and Gray were in the same
  patent race). And the denominator — how many possible discoveries were never made
  by anyone — is unobservable.

  Plus the suspicion that the "does it matter who made it" question is doing covert
  work in the "is it inevitable" question, because if discovery is inevitable the
  priority system looks unjust, and people have a stake in that.


