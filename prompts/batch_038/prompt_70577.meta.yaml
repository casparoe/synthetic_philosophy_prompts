  was simply refuted. He argued that population grows geometrically — he took the
  American colonies as his evidence and concluded population there was doubling roughly
  every twenty-five years — while food production grows only arithmetically, so any
  improvement in living standards would be competed away by extra mouths until wages
  returned to subsistence. Instead, world population has gone from about a billion
  in 1800 to about eight billion now, and average real income per person is many times
  higher than it was in his lifetime. A prediction that has been failing continuously
  for more than two centuries is not "right but early," she said. It is wrong.


  (2) Dev replied that Ruth was confusing a mechanism with a forecast. The mechanism
  is: whenever resources per person rise, people have more surviving children, and
  that pushes resources per person back down. That mechanism, he said, held essentially
  everywhere until the nineteenth century — for most of history, living standards
  barely moved while populations grew, which is exactly what the theory predicts.
  It stopped operating only because of two things Malthus had no way to anticipate:
  sustained yield-increasing technical change in agriculture, and a voluntary fall
  in family size as incomes rose. So Dev''s position was that Malthus was right about
  the trap, right that the trap existed and that humanity lived in it, and wrong only
  about the boundary conditions.


