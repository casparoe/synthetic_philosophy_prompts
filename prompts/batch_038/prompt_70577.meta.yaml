  On Dev''s account there is no possible history of the world that could count against
  Malthusianism: if living standards collapse to subsistence, the mechanism operated;
  if living standards rise for two hundred years, the mechanism was suspended by an
  auxiliary assumption about technology and fertility. A hypothesis that is compatible
