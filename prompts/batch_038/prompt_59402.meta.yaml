  Draft:


  "I''m preparing a session for a law-and-humanities seminar on the paradox of self-amendment,
  and I want to build it around Shirley Jackson''s ''The Lottery'' — not as a parable
  of scapegoating or conformity, which is how it always gets taught, but as a story
  about a legal order that has lost the power to change its own constitutive rule.


  Here''s the scaffolding I want the reading to work against. Alf Ross argued that
  an amendment clause cannot be validly amended by the procedure that clause itself
  specifies, because the amendment would have to derive its validity from a rule that
  the amendment destroys — a piece of legal self-reference he took to be structurally
  like the liar. Hart''s response was that this misconstrues legal validity as something
  like truth: a rule of change can authorize its own alteration without paradox, and
  what matters is whether the successor rule is accepted as valid by the officials
  and community. Between those two positions sits a third question I want you to take
  seriously, and which I''ll label for our purposes a *legitimacy gap*: cases where
  a rule-change is neither formally authorized nor formally defective, because the
  order contains no procedure at all that could have authorized it — where the only
  thing keeping the rule in force is that nobody has found a way to stop doing it.


  Now the story. ... [details: black box made from fragments of the earlier box; the
  paraphernalia lost; the chant and salute allowed to lapse; wood chips replaced by
  slips of paper at Mr. Summers'' urging because the town has grown; the proposal
