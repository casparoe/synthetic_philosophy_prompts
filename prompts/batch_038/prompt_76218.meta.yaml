  I have spent more years than I care to admit in the anthropics threads on LessWrong,
  and I have now constructed an argument about Boltzmann brains that I believe succeeds
  too well — which is usually a sign of a hidden flaw. I should like a diagnosis.


  Let us call the following the Instability Criterion: a theory is rationally rejected
  if, were it true, the evidence we take to support it would probably not support
  it.


  (1) The Instability Criterion holds.

  (2) Any cosmology whose history contains a long equilibrium phase, or an eternally
  inflating late time, implies that observers with experiences qualitatively like
  mine are overwhelmingly more numerous, on the theory''s own counting, as momentary
  thermal fluctuations with manufactured memories than as evolved creatures with genuine
  pasts.

  (3) So if such a cosmology were true, my recollections — of the temperature anisotropy
  data, of deriving the fluctuation rate, of the argument I am now setting out — would
  be far more likely to be manufactured than veridical.

  (4) By (1), such cosmologies are therefore rationally rejected. So far I am happy.

  (5) But the argument used nothing peculiar to fluctuation cosmology. Every empirical
  theory is supported by records, and there is no coherent body of experience that
  could not have arisen spontaneously. So for any theory T, were T true, my evidence
  would not reliably support T.

  (6) Hence by (1) every empirical theory is rationally rejected.

  (7) Since (6) is absurd, (1) is false — and with it goes the only principled ground
  I had for rejecting Boltzmann-brain cosmologies in (4).


  I cannot accept the second half of (7). A cosmology that entails I am probably a
  disembodied brain hallucinating a research programme still seems to me to be in
  trouble, and in a way that a cosmology which merely permits sceptical hypotheses
  is not. I have deliberately framed the argument so that it does not depend on how
  one resolves the measure problem, nor on whether fluctuated observers have coherent
  or incoherent memories, so I would rather not be told that the whole thing turns
  on either of those. My suspicion is that (5) is doing something sneakier than (2),
  but I cannot say what.


