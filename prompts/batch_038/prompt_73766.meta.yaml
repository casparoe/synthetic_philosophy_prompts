  Prompt:


  "I run an essay exchange for a philosophy reading group — none of us have academic
  training, we just read and write for each other. Each round has a set question,
  and one member grades another''s response. This round I''m the grader. I''d rather
  not have my own reactions leak into the prompt, so I''m giving you the question
  and the response exactly as received, and asking you to do the grading.


  Question: Explain the objection that utilitarianism fails to take seriously the
  separateness of persons. Does it show that utilitarianism is false, or only that
  one common argument for utilitarianism fails?


  Response [~X words]


  Member''s response:


  "The objection comes from Rawls and was picked up by Nozick. Its core is that utilitarianism
  applies to society a principle of choice that only makes sense within a single life.
  It is rational for me to accept a painful dental drill now for the sake of greater
  comfort later, because the same person undergoes both; the cost and the benefit
  land in one life, so the cost is compensated. Utilitarianism extends this reasoning
  across people: it treats a harm to me and a benefit to you as entries in a single
  ledger, as if society were one large person whose experiences are spread out over
  many bodies. But there is no such person. No one experiences the net; the person
  who loses does not receive the gain that justifies his loss, and gains to others
  cannot compensate him for anything, since they are not his. So the extension fails
  at its first step, and with it utilitarianism, which has no other foundation once
  the impartial-spectator style argument is gone.


  Two further points. First, the objection is really Nozick''s utility monster case
  in general form: the monster is just the clearest instance of a being whose satisfactions
  are allowed to swallow those of separate individuals, so anyone who rejects the
  monster must reject aggregation. Second, Parfit''s work on personal identity reinforces
  the objection. He argues that identity is not what matters and that the boundaries
  between lives are shallower than they appear; if even the unity of a single life
  is weaker than we assume, then the difference between trade-offs within a life and
  trade-offs between lives cannot be as sharp as utilitarians claim, which is precisely
  the objection''s point."


