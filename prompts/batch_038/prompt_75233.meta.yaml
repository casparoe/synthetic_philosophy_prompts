  Let me write the Curry derivation precisely and check it. Setup: naive truth schema:
  for any sentence S and name ⌜S⌝: Tr(⌜S⌝) ↔ S. Let k be the sentence "if Tr(⌜k⌝)
  then q" where q is arbitrary, e.g., "the Moon is made of green cheese." Then:


  1. Tr(⌜k⌝) ↔ (Tr(⌜k⌝) → q). [instance of naive truth]

  2. Assume Tr(⌜k⌝).

  3. From 1 and 2, Tr(⌜k⌝) → q. (biconditional elimination)

  4. From 2 and 3, q. (modus ponens)

  5. Discharge 2: Tr(⌜k⌝) → q.

  6. From 1 and 5, Tr(⌜k⌝). (biconditional elimination, other direction)

  7. From 6 and 5, q.


