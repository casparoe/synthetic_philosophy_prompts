  (3) So Frankfurt''s original counterexample fails, and PAP survives.

  (4) Now generalize: for any description of a scenario in which the agent is morally
  responsible, we can always find some description under which an alternative possibility
  remains (since the agent could have been in a different total state, or could have
  been non-responsible).

