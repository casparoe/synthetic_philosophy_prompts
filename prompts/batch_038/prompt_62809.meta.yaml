  Idea: I''m a grad student / TA for a philosophy-of-science course. I want to construct
  an artificial (fictional) research programme as a teaching example. Requirement:
  the example must satisfy Lakatos''s official criteria for a theoretically progressive
  problemshift (each new version has excess empirical content, some of which is corroborated)
  while simultaneously exhibiting what working scientists would call degeneration
  — ad hocness in the sense that each auxiliary hypothesis is invented solely to save
  the hard core, with no independent support. The conceptual issue: Lakatos''s account
  of "ad hoc" has three senses (ad hoc1: no excess content; ad hoc2: excess content
  but not corroborated; ad hoc3: no independent motivation) and only the first two
  are supposed to be captured by the progressiveness criteria. So a case can be ad
  hoc3 yet progressive in the official sense... Actually Lakatos''s "ad hoc2" is:
  excess content but none corroborated. And there''s the notorious problem that "corroboration"
  of novel content may take decades — so a programme can be provisionally degenerating
  and later vindicated (Einstein waiting for Eddington). The conceptual issue I want:
  the temporal indexing problem — whether "degenerating" is a property of a programme
  at a time or over a stretch, and Lakatos''s admission that we can''t be sure (his
  "instant rationality" is impossible; appraising programmes is a long-run affair).


  Also there''s a nice further wrinkle I can inject: the "heuristics" criterion —
  a progressive programme''s positive heuristic should have generated the modifications,
  i.e., they were "anticipated" in advance. So a programme where the protective belt
  changes are retro-fitted (negative heuristic only, positive heuristic exhausted)
  but each change nonetheless produces corroborated novel facts. That''s the interesting
  combination: positive heuristic dead, yet content growing and corroborated. Is that
  progressive or degenerating? Lakatos''s official criteria (MSRP) focus on content
  and corroboration, not on whether the positive heuristic generated it — so there''s
  a gap. Good conceptual issue.


