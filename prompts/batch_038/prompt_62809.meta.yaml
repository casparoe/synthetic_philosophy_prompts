  Let me also make sure I don''t misstate Lakatos. Key points I''m confident about:

  - Hard core, protective belt, negative heuristic (don''t aim modus tollens at the
  core), positive heuristic (a set of suggestions on how to change/develop the programme
  — a partially articulated policy).

  - Progressive problemshift: each new version has excess empirical content over its
  predecessor, i.e., predicts novel facts; and at least some of that excess content
  is corroborated.

  - Degenerating: theoretical progress without empirical corroboration; modifications
  made only to accommodate known anomalies (ad hoc).

  - Three senses of ad hocness: ad hoc1 (no excess empirical content), ad hoc2 (excess
  content but not corroborated), ad hoc3 (no independent/non-ad-hoc motivation...
  Lakatos: "ad hoc3" — a hypothesis that is not independently well-corroborated /
  lacks support from arguments independent of the theory). Roughly: ad hoc1 = no excess
  content; ad hoc2 = excess content, but not corroborated; ad hoc3 = not backed by
  independent considerations / the theory is not developed by the positive heuristic
  but patched. I should be careful not to state these too confidently in the prompt
  — I can just gesture at them ("the three flavours of ad hocness he distinguishes")
  and let the model handle it, or better, describe the intuition without the technical
  numbering to avoid mis-specification. Actually, the prompt asker can be a bit sloppy
  since it''s casual — but if I state something false the model might inherit the
  error. Safer: I mention "his three senses of ''ad hoc''" loosely, or just describe
  the phenomenon without numbering.


  - Lakatos''s famous admission that appraisals are only "firm" retrospectively; you
  can''t be rationally certain at the time; "there is no instant rationality." Also
  his point that it may take decades before a programme is decisively superseded,
  and that a young programme may look degenerating (Einstein''s programme had a period
  where it looked like it wasn''t corroborated — 1915-1919 gravitational light bending,
  and later the anomalous perihelion... actually Eddington 1919 corroborated). And
  his remark that "we cannot demand that a programme''s first version already be progressive."

  - Lakatos also says something like: even a degenerating programme may be worth pursuing;
  "it takes a long time to defeat a research programme" — and he says one can rationally
  work on a degenerating programme hoping for a comeback. Also: "appraising research
  programmes is a matter of the long run."

  - He also says: a programme''s degeneration is not a matter of a single failed prediction
  (that''s naive falsificationism) but of a pattern.

  - Important: Lakatos holds that the positive heuristic has "a relatively large degree
  of autonomy" — the positive heuristic is largely independent of anomalies; the theory
  is built by following the heuristic, not by responding to refutations ("the positive
  heuristic of the programme sets out... anomalies can be ignored"). This supports
  my "positive heuristic exhausted but content still growing" construction: a programme
  where modifications are driven by anomalies rather than the heuristic is a sign
  of degeneration.


