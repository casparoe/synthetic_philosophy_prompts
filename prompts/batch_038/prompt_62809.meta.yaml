  Actually — is "degenerating" comparative for Lakatos? Lakatos says a programme should
  be abandoned only when a better (more progressive) rival exists: "one should not
  abandon a research programme merely because it is degenerating; one abandons it
  only when there is a progressive rival." I believe he says something to the effect
  that a degenerating programme can be rationally pursued, and that "the methodology
  does not forbid working on a degenerating programme." In "History of Science and
  Its Rational Reconstructions" he discusses rationality of accepting/rejecting programmes
  in comparison. Yes: for Lakatos, appraisal is comparative — "a research programme
  is said to be progressing/ degenerating" is intrinsic-ish (based on problemshifts),
  but the rational decision to abandon requires a rival. So there''s a real tension
  worth the prompt: intrinsic appraisal vs. comparative rationality of abandonment.
