  Next month I am presenting a paper at a two-day workshop on logical empiricism and
  the social sciences, jointly hosted by a history-of-science program and a political
  theory center, and I need to prepare for the discussion period rather than for the
  paper itself, which is essentially finished. My thesis is that Carnap''s politics
  of planning is usually read as either a biographical curiosity or a borrowed piece
  of Neurath, and that both readings miss the fact that his framework machinery supplies
  a genuine argumentative structure for it. Specifically: the principle of tolerance
  and the internal/external distinction of the early 1950s imply that questions about
  how an economy is to be coordinated are not questions about the true nature of economic
  reality but pragmatic questions about which constitutive framework to adopt; the
  criteria for that choice are not truth-conducive but have to do with the fruitfulness
  of the framework; and, on my reading, the specific fruitfulness criterion Carnap
  is implicitly committed to is one I will call maximization of deliberate decidability
  — the extent to which outcomes are settled by reasons that could be laid out and
  argued about rather than by drift, custom, or price signals nobody chose. I will
  argue that this meta-value is what makes his late "scientific humanism" more than
  an expression of temper, and that the 1929 manifesto''s remarks about the Circle''s
  sympathies with movements toward a reorganization of economic and social life are
  best read as an early, unargued version of the same commitment.


