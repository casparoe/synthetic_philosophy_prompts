  Structure of the prompt:

  1. Set up who I am and what I need.

  2. State the episode and supply the salient facts (so the model doesn''t need to
  recall contested details).

  3. Inject the theoretical apparatus: the four readings of a national-character claim
  (distributional, configurational, developmental/modal-personality, normative-institutional)
  — my own labels, defined in the prompt.

  4. Ask for the analysis in both directions: which reading the OWI actually needed;
  which one Benedict supplied; which one her critics attacked; whether the criticism
  was aimed at the right target (a key subtle point — Japanese critics attacked it
  as representing a class ideology as a whole culture and an acute dislocation as
  a normal condition, which is a distributional/temporal objection, whereas the configurational
  claim may be immune to that objection or may be vacuous).

  5. Ask where the framework is silent — e.g., on performativity/constitutive effects
  (nihonjinron reception), and whether that reveals a fifth reading or shows the framework''s
  limits.

  6. Ask the normative question: on the basis of the analysis, what does the episode
  say about when generalizing about peoples is acceptable — does the objection attach
  to content, to the speaker''s position, to the use? And the asymmetry: the same
  generalizations became self-description and were embraced.

  7. Constraints: no bibliography, no citations, no reading lists; flag the contested
  emperor-recommendation claim and don''t build on it; keep to ~1,800 words or so;
  use section headings; say where the framework is silent rather than forcing it.


