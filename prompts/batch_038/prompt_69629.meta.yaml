  prior and their posteriors for some event are common knowledge, those posteriors
  must be equal; the argument goes through the finest common coarsening of the two
  partitions, since on any element of the coarsening each agent''s posterior is a
  weighted average that must equal the common value. Mere mutual knowledge of the
  posteriors is not enough: the theorem really needs common knowledge, and Aumann''s
  own example of two agents who each know the other''s posterior without the posteriors
