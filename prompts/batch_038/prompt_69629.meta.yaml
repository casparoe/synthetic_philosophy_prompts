  his information; so accepting would be accepting something that the offerer, better
  informed, expects to win. Anticipating the refusal, nobody makes the offer in the
  first place, and speculative trade never starts. The assumptions are correspondingly
  light: a common prior, common knowledge of rationality, and the fact that the proposed
  trade is public. On an organised exchange all three are satisfied, since every order
  is visible to every participant.


