  Title: "Manufactured Consilience: The Bystander''s Problem with Information Cascades"


  §1. Everyone knows the setup. A sequence of agents must each choose between two
  options, one of which is correct. Each agent, in turn, sees everything the earlier
  agents chose but nothing of the evidence behind their choices, and each receives
  a private signal that is better than a coin flip but far from certain. The first
  agent follows her signal. The second combines her signal with the first agent''s
  choice. By the time the third agent acts, two agreeing choices already outweigh
  a single contrary signal at any level of signal reliability above chance, so she
  too follows the crowd — rationally, and against her own evidence. From that point
  the sequence conveys no new information: each subsequent agent sees an overwhelming
  public record and ignores a private signal that is being systematically suppressed.
  The group can lock onto the wrong option and stay there indefinitely, and a comparatively
  small amount of fresh public information can flip the whole thing. Nothing anyone
  does in this story is irrational; the sequence is composed entirely of correct Bayesian
  reasoning. That is the point of calling it rational herding.


  §2. The moral usually drawn is about aggregation. Information that was distributed
  across the members of the group — many private signals, each of some value — fails
  to be pooled, so the collective decision is much worse than the information the
  collective possessed. On this telling, the losers are the agents inside the sequence,
  and the disease is a failure to combine.


  §3. I want to suggest that this framing gets the location of the harm wrong, and
  that the misdiagnosis has consequences for what a remedy would have to look like.


  §4. Consider someone who is not in the sequence at all: a later arriver, a member
  of another group, a reader who simply encounters the fact that a great many people
  hold some belief or chose some option. What does the agreement of many people tell
  her? The evidential force of agreement depends almost entirely on the independence
  of the agreeing parties. Ten people who arrive at a belief by ten separate routes
  provide a great deal of evidence; ten people who arrived at it by copying one another
  provide roughly as much as the first two or three. But the bystander is in exactly
  the position of the agent inside the cascade with respect to private information:
  she can see the outcomes of the process, not its structure. Agreement and echo are,
  from where she stands, the same observation.


  §5. So the more interesting damage done by a cascade is not the bad decision it
  produces but the epistemic condition it imposes on everyone downstream: it manufactures
  apparent consilience. It converts a small quantity of evidence into something that
  looks like a large quantity, and it does so invisibly. The bystander who treats
  observed agreement as corroboration is applying a rule that is normally sound; she
  is not being careless. She is being reliably misled by a reliable inference rule.
  The victim population of a cascade is therefore much larger than the model suggests
  — not just the agents who suppressed their signals, but every consumer of the resulting
  consensus, whose credences are inflated by an amount they have no way of measuring.


  §6. This relocates the target of institutional design. Familiar remedies — collecting
  opinions privately before discussion, requiring written independent estimates before
  pooling, appointing a devil''s advocate, delaying the disclosure of senior members''
  views — all work on the sequence, trying to preserve independence at the point of
  formation. If the cost is borne at the point of consumption, remedies should also
