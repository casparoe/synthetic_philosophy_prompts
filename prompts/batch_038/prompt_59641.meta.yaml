  in a cascade, then the ten agreements are really one or two bits. But the dependency
  is invisible: the onlooker cannot see who consulted whom, or what was known before
  what.


  Paragraph 4: Hence the real cost: cascades manufacture *apparent consilience*. The
  harm isn''t primarily that the group lands on a bad action; it''s that the group''s
  agreement is *unreadable* — it presents as corroboration when it is echo. Each hearer,
  applying the ordinary (and normally sound) rule that agreement is evidence, ends
  up miscalibrated. So the individual victim of a cascade is not (only) the agent
  in the sequence who suppressed her signal; it is every downstream consumer of the
  resulting consensus.


  Paragraph 5: This relocates the problem, and it changes what a remedy has to do.
  Standard remedies aim at restoring independence (secret ballots, pre-commitment,
  independent estimates then pooling, adversarial roles, delayed disclosure of opinions).
  Those target the sequence. But if the cost is at the consumption end, remedies should
  target the hearer''s discounting.


