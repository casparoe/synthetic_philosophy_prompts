  \ the soul's resistance, and that wine given to older citizens (over 40/60) relaxes\
  \ them and makes them more willing to sing. In Book II he discusses the \"pharmakon\"\
  \ of wine. There's also the Symposium (Plato's dialogue), and Republic's discussion.\
