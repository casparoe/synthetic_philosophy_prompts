  paying for information (a free experiment) has nonnegative expected utility, and
  strictly positive if the information can change the decision. Good''s theorem (1967,
  "On the principle of total evidence") — the expected utility gain from sampling
  before deciding. Actually the classic result: for a decision maker maximizing expected
  utility, the value of free information is nonnegative; and an experiment is worth
  paying for iff it can change the decision. Related: Good''s theorem in the context
  of dynamic programming / "the expected value of sample information" (EVSI), and
  there''s a subtlety about whether the decision maker can commit to ignoring information
