  I''m commissioning a piece of short fiction for a collection on distributive ethics,
  and I''d like you to write it. The situation is the one philosophers since Nozick
  have called a utility monster: a maximizing allocation scheme confronted by one
  person whose capacity for wellbeing per unit of a scarce good is orders of magnitude
  greater than everyone else''s, so that the arithmetic says give her everything and
  the arithmetic is not obviously wrong.


  Use the following setting, which you may fill in but should not alter in its essentials.


  The harbor city of Ostrane produces a fixed quantity each year of a synthetic enzyme
  without which its residents sicken; it is distributed by the Ledger Office under
  a charter clause requiring the allocation that maximizes total assay-verified yield.
  Yield is measured in welfare units by a standard assay calibrated against a reference
  panel of forty volunteers whose median yield was fixed by convention at 100 units.
  A new resident, Odile Sarr, returns an assay reading of 60,000 units per dose against
  that median of 100. Three further features of the world matter to the plot. First,
  the charter permits the calibration to be revised only once every five years, and
  only on a panel re-drawn by lot, so within an allocation cycle the scale is frozen;
  a technician can demonstrate that Odile''s advantage is largely an artifact of the
  transform used to make the readings cardinal — a monotone re-scaling that preserves
  every individual''s own ordering of outcomes shrinks her claim to nothing — and
  that demonstration will be both correct and inadmissible. Second, Odile asks to
  be struck from the roll, but the assay reads her anguish about receiving the doses
  as suffering, and suffering raises her measured need; the instrument has no way
  to record a waiver. Third, once the reading is public, other residents learn to
  raise their own numbers by fasting, by stimulants, by whatever works, and the city''s
  total measured yield climbs while the city gets sicker.


