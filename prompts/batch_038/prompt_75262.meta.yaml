  Essay draft:


  "When people talk about risks of astronomical suffering, they usually picture it
  as a matter of numbers: some bad outcome gets locked in, and instead of ten billion
  people you get ten trillion, or ten quintillion emulated minds, each of them worse
  off than the average person alive. The badness scales with the headcount. That''s
  a fine picture but I think it hides a second, independent way the same outcome can
  get worse, and the two need to be argued about separately.


  Call the first kind of s-risk population-scaled: the amount of suffering goes up
  because there are more sufferers, or because they last longer. The second kind is
  rate-scaled: the amount goes up because each moment of each sufferer''s life is
  worse than it would otherwise have been — more intense, more densely packed, less
  interrupted by relief.


  The reason to keep these apart is that they respond to completely different facts
  about the world. Population-scaled risks hinge on how much computing and energy
  a future civilisation can capture and on how cheaply minds can be instantiated.
  Rate-scaled risks hinge on something else entirely: whether there is any upper bound
  on how bad a single experience can be. And here''s the uncomfortable part — we have
  good evidence that biological pain has ceilings, because a nervous system can only
  fire so fast and can only sustain so much before it shuts down, but nothing about
  an artificial system obviously inherits those ceilings. A digital substrate has
  no refractory period, no endorphins, no fainting. If intensity can be turned up
  past what flesh permits, then a single mind could, in principle, contain more badness
  in an hour than a whole biological civilisation contains in a century. That would
  make rate-scaled s-risks dominate, and it would mean the usual arithmetic about
  huge populations of moderately-bad lives is measuring the wrong variable.


  There is a wrinkle. Intensity presumably stops mattering at some point, either because
  the notion of ''more suffering'' stops being meaningful once an experience is maximally
  disordered, or because there''s some saturation in what counts as a single subject
  having a single experience. I don''t know how to settle that. But I do think the
  people arguing about the size of the future population should be arguing about this
  instead, because it is the term in the product that is most uncertain by orders
  of magnitude.


  So my proposal is modest: when anyone states an s-risk, they should say which of
  the two dials they are turning, and how confident they are that the dial is bounded."


