  prompt because there are genuine subtleties: Zahavi''s handicap principle vs. Grafen''s
  formal models; the distinction between index signals and handicaps (Maynard Smith
  & Harper''s terminology, or Hasson''s "quality-dependent signals"); the "handicap
  principle" being widely misused to mean any costly display; Grafen''s 1990 handicap
  model actually showing that handicaps need not be costly at equilibrium (the "cost-free
  signaling at equilibrium" point — actually Grafen showed the handicap principle
  can work but the marginal cost condition matters); John Maynard Smith''s critique
  in "Honest Signals" (1991/1994) and the "Sir Philip Sidney game"; also the point
  that Zahavi''s original 1975 formulation was about the evolution of signaling at
  the population level and included "costly-to-produce" and "costly-to-maintain";
  also the distinction between "handicap" (cost differentially borne by low-quality
  signalers) vs "index" (mechanically constrained, cost need not be differential);
  also "average cost vs marginal cost"; also the fact that in Grafen''s model the
  signal cost is a "waste" but the equilibrium is separating, and there are results
  (e.g., Számadó, Getty) showing honest signaling without handicap costs; Getty''s
  2006 paper "Coevolutionary stability and mutual honesty in a simple sequence-averaged
  signalling game" or "The evolution of costly signals: the honest signaling principle"
