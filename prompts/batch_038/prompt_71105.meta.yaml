  Draft summary (attributed to a chapter in a trade book about the science of honesty/deception,
  or a longform magazine essay):


  "In the mid-1970s an Israeli ornithologist, Amotz Zahavi, made a proposal that nearly
  everyone thought was absurd: the peacock''s tail is an advertisement precisely because
  it is a liability. Biologists — John Maynard Smith among them — dismissed it for
  more than a decade, until Alan Grafen turned it into a game-theoretic model in 1990
  and showed that Zahavi had been right after all. The logic is now standard. Any
  animal can claim to be high quality; only a high-quality animal can afford to prove
  it. So the cost of the signal is not incidental to its honesty, it is the honesty
  mechanism: the display has to be genuinely wasteful, and it has to hurt the poor
  signaler more than the rich one. In the equilibrium Grafen derived, every signaler
  pays for its display, including the best one — if the top individual could signal
  for free, the whole thing would unravel. The same logic scales straight up to us,
  which is why an expensive wedding, a vow of poverty, and a founder''s three unpaid
  years are honest signals of what they claim to signal. Anyone who says these could
  be faked has not understood the handicap principle."


  Errors embedded:

  - "nearly everyone thought was absurd" + "Biologists dismissed it for more than
  a decade, until Grafen... showed Zahavi had been right after all" — overstated:
  Maynard Smith was a notable early critic, but the story of universal dismissal followed
  by vindication is too neat; also Grafen''s model was in some respects a rediscovery
  of Spence''s job-market signalling, and the question of whether Grafen "showed Zahavi
  right" is contested (Getty; and the general result that honest signals need not
  be costly).

  - "the cost ... is not incidental to its honesty, it is the honesty mechanism" —
  conflates handicap with all honesty mechanisms; ignores indices, conventional/punishment-backed
  signals, and common-interest/cheap-talk equilibria.

  - "the display has to be genuinely wasteful" — conflates average cost with marginal
  cost / differential cost; the second half of the sentence ("hurt the poor signaler
  more than the rich one") is actually the right condition, so the sentence contradicts
  itself subtly. That''s a nice internal tension for the audit.

  - "every signaler pays for its display, including the best one — if the top individual
  could signal for free the whole thing would unravel" — false in the standard model:
  the boundary condition sets the top-quality individual''s cost to zero; what unravels
  things is if *low*-quality individuals could signal cheaply.

  - "The same logic scales straight up to us" — ignores that the human cases may be
  common-interest, indexing, punishment-backed convention, or countersignaling; also
  ignores the additivity-of-currency issue and the fact that human receivers can be
  manipulated.

  - "Anyone who says these could be faked has not understood" — a standard rhetorical
  move that also gets the direction of the theory wrong: the handicap principle is
  precisely a claim about why faking is unprofitable, not about it being impossible;
  and empirical work on begging costs found costs far lower than needed.


