  \nI think Kant is rich. Let me design carefully.\n\nDomain: Kant's universalizability\
  \ tests.\n\nExam question: A short essay question in a second-year ethics course.\
  \ E.g.:\n\n\"Consider the following two cases. (a) A man borrows money by promising\
