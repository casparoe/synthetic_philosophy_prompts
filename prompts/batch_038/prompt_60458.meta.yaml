  \ be a subtle misattribution.\n\nAlso the type \"describe a phenomenon and ask whether\
  \ it has a name\" for moral uncertainty: e.g., the phenomenon where your credences\
  \ in rival moral theories each say X is wrong, but each for different reasons...\
  \ hmm. Or \"moral uncertainty\" — phenomenon: you act so as to be safe across all\
  \ the theories you give credence to (moral hedging / covering your moral bases).\
  \ There's an established concept: \"moral hedging\" (Weatherson / Brian Weatherson's\
  \ \"Must you act justifiably?\"), \"covering your moral bases\", MacAskill/Ord's\
  \ \"My Favourite Theory\" approach, \"Borda\", \"maximising expected choice-worthiness\"\
  , \"ought implies can for moral uncertainty\". A good phenomenon: when you're unsure\
  \ between theories, you pick an action that is permissible-or-obligatory under all\
  \ — this is \"moral hedging\" but imperfectly fits since moral hedging usually concerns\
  \ blame. Hmm, that could be interesting: a phenomenon description that fits \"moral\
  \ hedging\" imperfectly.\n\nAnother option: judgment aggregation — phenomenon: a\
  \ committee decides a set of connected propositions by majority vote on each, and\
  \ gets a collectively inconsistent result. That IS the discursive dilemma, and it's\
  \ fairly well known. The asker would describe it and it fits an established concept\
