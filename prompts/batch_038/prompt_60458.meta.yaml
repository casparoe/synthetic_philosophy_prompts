  \ distinction between doctrinal paradox and discursive dilemma is niche-ish and\
  \ small LLMs will conflate them.\n\nExpected value fanaticism: phenomenon: you refuse\
  \ any amount of small benefits to any number of people because of a tiny probability\
  \ of a huge payoff... or the reverse: you accept a tiny probability of enormous\
  \ harm. \"Fanaticism\" (Beckstead), \"Pascalian mugging\", \"aggregation vs. anti-aggregation\"\
  . Hmm.\n\nThe grading type seems the strongest fit with the \"inject niche ideas\"\
  \ constraint: I write an exam question with a specific fictional setup, and the\
  \ student answer, so the whole thing is self-contained and can't be regurgitated.\
  \ And \"no bibliographies needed\". Kant's universalizability tests + grading is\
