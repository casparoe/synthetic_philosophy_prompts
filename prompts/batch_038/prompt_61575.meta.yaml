  ---


  Developmental psychology has settled into a method that I find hard to state without
  sounding absurd. Because preverbal infants cannot be asked anything, the field reads
  their minds from how long they look. An infant is habituated to an ordinary event
  — a screen tipping back and forth, a toy rolled behind a barrier — and then shown
  a variant that would be impossible if the toy were still where it was left, or possible
  only if the toy had ceased to exist. The infant looks longer at the impossible version,
  and this is reported as evidence that the infant expected the toy to persist: that
  infants in their first months already represent objects as continuing to exist when
  out of view, as solid, as continuous.


  The same field, though, has a second paradigm that points the other way. An infant
  watches a toy hidden under a cloth at one location, retrieves it several times,
  then watches it hidden at a different location in plain view — and reaches back
  to the first location, sometimes for many trials, sometimes while looking directly
  at the second. The standard report is that the infant lacks the concept, or lacks
  the working memory, or lacks the inhibitory control, to act on what it nonetheless
  seems to look at correctly. The reconciliation on offer is that there are two systems:
  one fast, automatic, and tied to looking, the other slow, flexible, and tied to
  action, and the second matures later.


  Questions:

  1. What account of belief — or of representation, or of having a concept — does
  the looking-time practice presuppose, such that a difference in looking duration
  is evidence about the content of an infant''s mind? State the commitments explicitly.
  Which rival accounts (e.g., a dispositional/behavior-first account, on which to
  believe is to be disposed to act) does the practice rule out, and does it rule them
  out by argument or by definition of its measures?

  2. Looking time underdetermines content: it cannot distinguish an infant that represents
  a persisting object from one that represents a continuing patch of surface appearance,
  a solid-ish region, or merely an expectation about screens. When the field picks
  the object-level reading, what principle licenses it — parsimony, an inference to
  the best explanation of later development, an assumption of shared ontology with
  the adult experimenter? Is that a methodological convenience or a substantive metaphysical
  commitment?

  3. Is the two-systems move consistent with what the practice began by asking? If
  belief is channel-relative — if the honest answer to "does the infant believe the
  toy is still there?" is "in the looking system, yes; in the reaching system, no"
  — has the field answered the original question or replaced it? And is the competence/performance
  distinction here falsifiable in principle, or does it explain every failure and
  so none?

  4. The same inferential logic runs elsewhere: patients with no behavioral responsiveness
  are scanned while asked to imagine playing tennis or walking through a house, and
  a reliable, task-specific activation pattern is read as command-following, and therefore
  as consciousness, with real consequences for decisions about continuing care. Do
  the two practices presuppose the same view of the relation between evidence and
  mind? Could one be licensed while the other is not, without special pleading?

  5. Distinguish what the practice strictly requires from what it merely sits comfortably
  with, and say where it is philosophically underdetermined. Then say concretely what
  the field''s claims would have to be rewritten as if the presupposed view were replaced
  — pick the rival you think most threatening and do the rewriting.


  End with a machine-readable last line: \answer{X} where X is the single account
  of belief the looking-time practice is strictly committed to, or "underdetermined"
  if rival accounts license it equally well.


