  "(a) The objection van Fraassen presses is that a rule which tells us to believe
  the best explanation among the candidates we have considered cannot get us to the
  truth, because the true explanation may never have occurred to anyone; we are picking
  the best of a bad lot. In the scenario the lot is not bad in that way, at least
  not in the first instance. The machine lists every hypothesis expressible in its
  language that is consistent with the data, so the objection that the winner only
  won because the rival was missing does not apply inside the language: if the truth
  is expressible at all, it is in the list, and it was compared against everything
  else that fits. So the machine''s report is not an inference to the best of a bad
  lot but an inference to the best of the lot. The remaining problem is not which
  hypotheses were considered but the ranking rule: the machine orders by explanatory
  virtues, and nothing so far says why being lovelier should make a hypothesis likelier
  to be true. That is a separate difficulty and van Fraassen''s objection does not
  raise it.


  (b) Since the comparison is complete, the system is no longer making an ampliative
  leap of the usual kind. It has eliminated every hypothesis that the data rule out
  and then picked among the survivors; where the survivors are ordered by a fixed
  criterion, the output follows from the data together with the criterion, so the
  report is closer to a deductive consequence of the premises than to an inductive
  generalization from them. In Harman''s terms this is much more like an inference
  to the only explanation than an inference to the best one, and Harman''s point about
  the only explanation is that it does not need the extra premise that explanatory
  merit tracks truth. It is still ampliative relative to the raw data alone, in the
  sense that the conclusion says more than the data do, but that is true of any inference
  that adds a criterion.


  (c) Lipton distinguishes the loveliest explanation, the one that would give the
  most understanding, from the likeliest, the one best supported by the evidence,
