  Injected hypothesis (novel-ish, mine): The MR debate is stalled because the two
  sides are not disagreeing about realization at all, but about a prior methodological
  question — whether the identity/autonomy of psychology is a claim about *kinds*
  (ontology) or about *explanatory practice* (who has to derive what from whom). The
  autonomy-of-psychology side wants "psychology can''t be reduced because neuroscientists
  can''t replace psychological explanations with neural ones" — an epistemic/pragmatic
  claim — while the reductionist side wants "every psychological kind is identical
  to, or exhaustively realized by, some neural kind" — a metaphysical claim. And the
  empirical premise (that realizers are diverse) is a third, contingent claim that
  both sides keep invoking rhetorically. So the debate is a triple-barreled equivocation:
  "multiple realization" names three different claims — metaphysical (distinctness
  of realizer kinds), empirical (diversity of realizers across species/substances),
  and explanatory (non-derivability of one level''s generalizations from another''s).
  Progress would require picking which of the three you mean and noticing that each
  side wins a different one. That''s a decent and somewhat original diagnosis.


  Second injection: a specific technical crux. The "grain" problem: if you individuate
