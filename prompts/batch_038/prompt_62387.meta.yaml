  the corpus callosum severed and stimuli restricted to one visual half-field, information
  reaches only one hemisphere. When the word walk was presented to the right hemisphere
  of a patient whose speech production was controlled by the left, the patient stood
  up and started for the door; asked why, he did not say he had no idea, but offered
  a reason consistent with what the left hemisphere knew — that he was going to fetch
  a Coke from the fridge. In a matching task, a chicken claw shown to the left hemisphere
  and a snow scene to the right led the right hand to point to a chicken and the left
  hand to a shovel; asked to explain the shovel, the patient produced a reason linking
  it to the chicken — cleaning the shed — while remaining unaware of the snow scene.
  He was not lying, hedging, or confused, and the reports were delivered with ordinary
  confidence.


  Then, the demands:

  1. Mapping discipline: identify who the "I" of the Moore-paradoxical form is. Options:
  the whole patient, the left hemisphere, the interpreter module. For each, say what
  the assertion comes out as and whether it is Moore-paradoxical, false, absurd, or
  none of these. Note that the absurdity standardly attaches to sincere assertion,
  and that the usual Gricean explanation runs through the idea that asserting p presents
  the speaker as believing p; ask whether that mechanism is even engaged when the
  utterance is an interpretive construction rather than the expression of a standing
  belief.

  2. Two-directional test: which features of the protocol Moore''s paradox illuminates
  (the felt unassertability of certain self-reports; the special authority of first-person
  present-tense avowals that the paradox trades on) and which it misses (why the confabulation
  is immediate and confident rather than absurd-seeming to the confabulator; the fact
  that no one in the room experiences the utterance as paradoxical, only the experimenters
  as false).

  3. Whether the case is a genuine counterexample to the claim that Moore-paradoxical
  belief is impossible — can the patient be described as believing that he is going
  to get a Coke and also, in another respect, not believing it? Consider what conditions
  of doxastic integration a state must meet for the impossibility claim to apply,
