  Let me draft the facts to supply (accurate, canonical):


  - March 16, 1968, Sơn Mỹ ("My Lai 4"), Quảng Ngãi Province, South Vietnam.

  - Task Force Barker, 11th Light Infantry Brigade, Americal Division; Company C,
  1st Battalion, 20th Infantry.

  - Soldiers were mostly draftees in their early twenties, the unit had been in country
  about three months, had taken casualties (a sergeant killed by a mine/booby trap
  days earlier), and had seen almost no direct combat — they had suffered casualties
  without ever seeing an enemy. This is canonical and important.

  - Captain Ernest Medina commanded the company; briefing the night before described
  the village as a VC stronghold where everyone was expected to be a sympathizer or
  guerrilla; the order as later disputed — whether it was to kill everyone or to kill
  the enemy.

  - Second Lieutenant William Calley led 1st Platoon, which did most of the killing;
  estimates of dead range roughly 347 to 504 (the Vietnamese official figure 504;
  the US Army''s initial figure 347). Mostly women, children, and old men; no enemy
  fire was encountered; no weapons were recovered (only a few — the Army reported
  3 weapons captured).

  - Warrant Officer Hugh Thompson and his helicopter crew (Lawrence Colby, Glenn Andreotta)
  landed between soldiers and civilians, ordered their door gunners to fire on American
  troops if they shot at the Vietnamese, and evacuated about a dozen people; Thompson
  reported it up the chain.

  - Calley was charged; convicted in 1971 of premeditated murder of 22 civilians;
  sentenced to life; Nixon intervened and Calley was released to house arrest; served
  about three and a half years under house arrest before parole in 1974. Medina was
  acquitted. No one above Calley and Medina was convicted; the cover-up was exposed
  by Seymour Hersh in November 1969 after Ron Ridenhour''s letter to Congress and
  officials.

  - Ridenhour had heard about it from multiple members of the unit and wrote letters
  to ~30 members of Congress and officials.

  - Also: many soldiers in Company C did not personally kill; some did; there were
  reports of soldiers who refused or feigned (e.g., a soldier who refused to shoot
  and was told by Calley to stand aside; the specifics: Calley had to grab Private
