  Hmm, but careful: IIA does forbid using *intensity*? Strictly, IIA says the social
  ranking between x and y depends only on individual rankings of x vs y. Since preferences
  are ordinal, intensity is not represented at all in the input; IIA prevents the
  rule from using information about other alternatives, which is how Borda effectively
  smuggles in something like intensity (margins). The nuance: it''s not that IIA forbids
  intensity per se — the domain is ordinal profiles, so intensity isn''t in the data;
  rather, IIA forbids using the *positions* of alternatives in the rankings, which
  is the only route by which an ordinal rule can approximate intensity. So the fictional
  student''s claim is half right and importantly wrong in a specific way. That''s
  exactly the kind of crux that separates understanding from label-reciting.


  Let me make sure I''m right about this. Arrow''s IIA: for any two profiles that
  agree on everyone''s ranking of x vs y, the social ranking of x vs y is the same.
  Borda: the social score of x depends on positions relative to all other alternatives
  — so adding a new alternative changes scores. And Borda''s ability to reflect "intensity-like"
  information (how far down the list) comes precisely from violating IIA. So: given
  ordinal inputs, the only extra information available beyond pairwise comparisons
  is the *configuration* of the whole ranking; IIA restricts you to pairwise info
  only. So yes — the fictional student is right that IIA blocks the use of something
  like margin/intensity information, but wrong in that (a) ordinal profiles contain
  no cardinal intensity to begin with, so Borda isn''t recovering real intensity —
  it''s using the shape of rankings, which is what makes it clone-vulnerable; and
  (b) dropping IIA doesn''t dissolve the problem, it relocates it (manipulability,
  spoilers). Also note Sen''s point: Arrow''s theorem can be seen as a consequence
  of restricting information (the informational basis of interpersonal comparison);
  with richer information bases (cardinal, comparable utilities), the impossibility
  dissolves. That''s Sen''s "informational basis" framing — a great must-hit point
  that separates A from B answers. Sen is standard enough that a model should know
  it, but not so niche that it''s unreliable. I''ll mention it as something the marking
  scheme may reward without asserting a specific claim about a specific text.


  Also good: the "Pareto + non-dictatorship" tension — actually a must-hit is explaining
  where the proof''s engine lives (a decisive set / pivotal voter argument) at an
  intuitive level, but for an exam question that asks about IIA''s role, maybe less.
  I could require the model answer to sketch the "spreading decisiveness" idea in
  a couple of sentences to explain why IIA is doing the heavy lifting (it''s what
  lets you move alternatives around independently). Yes! That''s a beautiful link:
  IIA is what licenses the profile-construction moves in the standard proof (you can
  flip rankings of non-competing pairs without changing the social ranking of the
  pair in question, letting you build the profiles that show decisiveness spreads).
  Without IIA, the proof''s constructions fail. That''s the deep reason IIA is load-bearing.
  A top answer should say something like this. That is genuinely in-the-weeds and
  not commonly packaged.


  So the marking scheme can have must-hit points:

  1. Correct statement of the theorem''s setup (SWF on ordinal profiles, universal
  domain, weak Pareto, non-dictatorship, IIA) and correct identification of what''s
  impossible — not "no fair voting system."

  2. A correct concrete demonstration of an IIA violation by Borda on a given profile
  (the calculation).

  3. Explanation of why IIA is load-bearing in the proof (decisiveness spreading /
  independent flipping of irrelevant pairs), not merely an arbitrary restriction.

  4. Correct diagnosis of the fictional student''s error: ordinal inputs contain no
  intensity; what Borda exploits is the global shape of rankings, hence clone-dependence/spoilers;
  and dropping IIA relocates rather than dissolves the problem.

  5. The informational-basis response (Sen): the theorem is sensitive to how much
  information the social ordering is allowed to use; cardinal+interpersonally comparable
  utilities escape; single-peaked domain restriction escapes; and an evaluation of
  whether these are escapes from the theorem or from the underlying problem.

  6. Maybe: distinguishing Arrow from Gibbard–Satterthwaite (manipulation vs. coherence)
  — a common conflation to be penalized.


