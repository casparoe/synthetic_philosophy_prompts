  misstate it as "no voting system is fair" or conflate it with Gibbard–Satterthwaite
  (manipulation) — a marking scheme item for that error. Also the "unrestricted domain"
  escape (single-peaked preferences / majority rule on a line) — students should know
  that relaxing domain avoids the theorem, and should say whether that''s an escape
  from the *problem* or just from the *theorem*.


