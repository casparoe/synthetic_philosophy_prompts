  Gibbard–Satterthwaite theorem: Let f be a social choice function mapping profiles
  of ordinal preferences (linear orders) over a finite set of alternatives A, |A|
  ≥ 3, onto A. If f is strategy-proof (no voter can ever benefit by misrepresenting
  their preference) and onto, then f is dictatorial. Assumes unrestricted domain of
  strict preferences, deterministic rule, at least three alternatives.


  Key escape routes:

  1. Domain restriction: single-peaked preferences → the median voter rule is strategy-proof
  and non-dictatorial (Black 1948; Moulin 1980 characterized strategy-proof rules
  on single-peaked domains via "phantom voters"). Gibbard–Satterthwaite requires unrestricted
  domain, so this is a genuine escape, though it needs the single-peakedness assumption
  to hold — a substantive empirical/structural claim.

  2. Randomization: Gibbard 1977 ("Manipulation of schemes that mix voting and chance")
  showed that the only strategy-proof random social decision schemes (with lotteries
  over outcomes, and preferences over lotteries defined via expected utility... actually
  via any von Neumann–Morgenstern extension) are random dictatorships — i.e., mixtures
  of dictators. So randomization doesn''t obviously help if you measure ex ante; but
  with ex post strategy-proofness (no incentive to misreport after the lottery is
  realized — actually "ex post" means no misreport helps conditional on the outcome),
  random dictatorship is strategy-proof and can be seen as attractive. Hylland (1980)
  showed the impossibility of "pseudo-dictatorship-free" mechanisms; also Barberà''s
  work.

  3. Cardinal/mechanism design: With quasilinear utilities and money, the Vickrey–Clarke–Groves
  mechanism is strategy-proof (dominant-strategy incentive compatible) for efficient
  social choice — but requires transfers, and it''s not onto in the same sense (it''s
  about allocation with money). Also Green–Laffont/Satterthwaite-type results: VCG
  is the only DSIC efficient mechanism under certain conditions. So money + cardinal
  utility escapes GS but at the cost of changing the problem.

