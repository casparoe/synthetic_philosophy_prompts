  Objections this draws:

  1. "Your measuring rod is a value function" — a random policy ensemble or auxiliary
  goals encode what''s attainable; the choice of which goals counts as normatively
  loaded. If you use human goals as the rod, you''ve smuggled in values; if you use
  random policies, you''ve made impact a function of physics only and it''ll rank
  weird things as high-impact.

  2. The baseline problem: relative to what? Inaction baseline (do-nothing counterfactual)
  has known pathologies — the agent can game it, or it makes the agent''s own existence
  a huge side effect.

  3. Offsetting: an agent can cause a side effect and then undo it, or cause two offsetting
  side effects; the measure is indifferent, but intuitively that''s not fine (the
  "vase-breaking then re-gluing" or "kill one person and create another" cases). Also
