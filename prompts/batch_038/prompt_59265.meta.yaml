  Draft:


  ---


  I am assembling a set of cases to test a specific claim about practical rationality:
  that an agent can be rationally required to act in a situation where the reasons
  do not distinguish between the acts available to her — that is, that choice without
  preference can be mandatory, and not merely a permissible arbitrary picking that
  leaves nothing to explain. I would like you to construct a thought experiment to
  the following specifications.


  The scenario. In one paragraph, and in a realistic professional or institutional
  setting (a committee, a clinic, a trading desk, an emergency service — no trolleys,
  no science fiction, no gods, no perfect predictors), describe a single agent who:


  (i) faces two available acts that are exactly equal in every respect that bears
  on choice;

  (ii) has established that equality herself, by reasoning from all the information
  available to her, and knows that no further information, deliberation, or refinement
  of the criteria could break it — the tie is robust to further reflection, not an
  artifact of ignorance;

  (iii) faces a hard deadline after which both acts cease to be available and a strictly
  worse outcome obtains; inaction is therefore not a way of preserving the tie, and
  she knows this;

  (iv) has no access to the usual exits: there is no chance device to hand, no third
  party authorized to decide for her, and no opportunity to have bound herself in
  advance, since she could not have foreseen that she would end up in this situation.


  The banned solutions. The bind may not be dissolved by any of the following, and
  your write-up must say explicitly, for each, whether the case as you have built
  it blocks it and how: that the agent will in fact be moved by some whim or passing
  impulse; that she can randomize; that she can adopt a resolute plan or a pre-commitment
  rule; that she can form a second-order preference over her own first-order preferences;
  and that the cost of continued deliberation itself supplies a decisive reason. You
  may not stipulate a psychology that makes picking impossible for her — if the block
  on picking is to be real, it has to come from the structure of the situation rather
  than from a declared incapacity.


  The three verdicts. After the scenario, take the following three positions in turn
  and give the verdict each delivers on your case, with the reasoning that gets it
  there:


  - Orthodox expected-utility maximization, on which two acts with equal expected
  utility are both permissible and no rational defect arises.

  - A view on which an act is rational only if some reason selects it, so that a requirement
  to act coupled with an exhaustive tie is a genuine bind and not a harmless symmetry.

  - A voluntarist view on which the agent can simply pick, and on which picking in
  the absence of preference is a fully rational exercise of agency rather than a failure.


  The design target is that the third view comes out badly: picking must be unavailable
  or compromised in your case, and the reason must be visible in the structure of
  the scenario rather than asserted.


  What the case is for, and what counts as cheating. The point is to see whether a
  mandatory tie-break is constructible at all, so the verdicts must be generated by
  the theories from the details of the case; a scenario that simply announces that
  the agent is required to choose, or that declares the two acts equally good by fiat
  rather than showing the equality arising from the agent''s own reasoning, fails.


  Then close with four short sections:


  1. Which single feature of the case does the work — the one you could not remove
  without collapsing the bind — and what the case becomes if you remove it.

  2. Whether the bind survives idealization: does it still bite if the agent is made
  perfectly self-transparent and free of sub-personal noise, and does it still bite
  if she is left an ordinary, noisy human?

  3. The strongest attack available to a defender of the view that comes out badly
  — including the objection that no two real options are ever exactly alike, and the
  objection that an agent who must act will always find that acting is better than
  not, so the tie was never total — and your assessment of whether the attack succeeds.

  4. Whether the constraints, taken jointly, are satisfiable at all. If you have had
  to soften one, say which and why; if you think the whole design is impossible or
  trivial, say so and identify the constraint you would drop first.


  I am not looking for references, a bibliography, or a reading list; name positions
  if you like, but the analysis must stand on its own. Roughly 700–1000 words in total.


