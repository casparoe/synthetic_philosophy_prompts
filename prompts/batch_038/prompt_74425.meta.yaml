  So, background: I''m 39, and in March I got a prediabetes diagnosis that was, frankly,
  not a surprise. What followed was six months of me discovering that I''m extremely
  good at committing to things on Sunday and extremely bad at executing them on Tuesday,
  and eventually I fixed a fair amount of it with ugly mechanical means — a lockable
  box in the pantry with the key at my sister''s, a standing bet with a coworker where
  I forfeit money, deleting things off my phone. It worked, which is embarrassing
  in its own way, because I''d spent years writing and arguing about agency as though
  the machinery didn''t matter. Now a friend who runs a small public-philosophy podcast
  has asked me on to talk about weakness of will, and I want to send her a page of
  what I actually believe beforehand, partly so she can aim at it. Before I do that
  I want someone to tell me whether the page is even internally coherent, because
  I suspect it isn''t and I can''t tell where.


  Here''s the list:

  1. I accept the standard descriptive picture: people don''t discount consistently.
  A delay that starts right now is weighted way more heavily than the same delay starting
  next month, which is why the ranking you make calmly on Sunday and the ranking you
  have in front of the pastry are different rankings. That''s not a metaphor, I think
  it''s just true of us.

  2. But I don''t think that means Sunday-me changed his mind. When Tuesday-me eats
  the thing, the Sunday ranking is still what he endorses — he just can''t get himself
  to act on it. That''s the whole point of calling it weakness of will instead of
  a revision of opinion. If every failure to stick to a plan is really a fresh judgment
  that the plan was wrong, the concept has nothing left to describe.

  3. When I say someone has screwed up here, I''m evaluating the shape of a whole
  stretch of a life, not a moment. Roughly: does the life go the way the person would
  want it to go if they were calm, informed, and thinking about all of it at once?

  4. I have no patience for the multiple-selves talk, though — I don''t think Tuesday-me
  is a different person whose interests Sunday-me is exploiting, and I don''t think
  there''s anything sinister about binding him. There''s one me and one good that''s
  mine.

  5. Precommitment is normally rational and often the most rational move available,
  and I think the people who refuse to lock the box on principle, because they want
  to be the kind of person who can just decide in the moment, are making a mistake
  and a slightly self-indulgent one.

  6. On the other hand: I don''t blame people for these failures and I think the sloth-and-discipline
