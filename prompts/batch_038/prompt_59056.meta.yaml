  The setup. Take the Szilard engine: a single classical particle in a box, in contact
  with a heat bath at temperature T. A demon inserts a partition, measures which half
  of the box the particle occupies, records the outcome, and uses it to extract work
  — up to kT ln 2 per cycle, which, if it were free, would amount to converting heat
  from a single bath into work.


  Now modify the demon''s memory. Instead of a single cell that is overwritten each
  cycle, suppose the demon carries a stack of N cells, each a two-state physical system
  whose two states are degenerate in energy, and each prepared in a standard blank
  state. During a cycle the demon writes the measurement outcome into the next unused
  cell and then moves on. It never overwrites and never erases anything. After N cycles
  the stack is full, and it is exchanged for a fresh stack of N blanks. Call this
  the stack demon.


  The familiar reply to the stack demon is that erasure has been postponed rather
  than avoided... [etc.]


  The position I want argued:


  (1) The blank cells are not a bookkeeping convenience but a consumable thermodynamic
  resource... each blank cell of a degenerate two-state memory carries free energy
  kT ln 2 relative to its own equilibrium state at T, and the stack is therefore a
  fuel tank containing N kT ln 2 of usable work. The demon''s extraction is bounded
  by what the stack plus the measurement can jointly supply...


  (2) Landauer''s principle is therefore best stated not as a claim about logically
  irreversible operations (a bit of erasure dissipates at least kT ln 2) but as a
  claim about the free energy content of the memory''s state: a feedback controller
  can extract at most the free energy drop of the whole system plus kT times the mutual
  information its controller state carries about the system. On this statement erasure
