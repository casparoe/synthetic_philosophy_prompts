  induction against the charge of arbitrariness. And there''s a well-known disanalogy:
  the invariance is only up to an additive constant in description length, which corresponds
  to a *multiplicative* constant in the prior — and for prediction of individual finite
  sequences, that multiplicative constant can matter a lot; and for decision-theoretic
  use, unbounded multiplicative constants matter. Also the additive constant can be
  huge (the size of the interpreter). This is a nice, in-the-weeds analogy audit:
  "description length is like measuring in different units" — where does it break?
  Units convert exactly by a constant factor; the machine-dependence is an additive
  constant in length, i.e., a constant factor in the probability, and it''s the same
  for all programs... Actually the invariance theorem says K_U(x) ≤ K_V(x) + c_{UV}
  for all x, so the difference is bounded by a constant independent of x. So it IS
  like a unit change in log-probability: an additive offset in the exponent. Hmm,
  so the analogy is decent for the asymptotic/limit sense (Solomonoff induction converges
  to the truth in the limit, and the multiplicative constant washes out in the posterior
  ratio as data accumulates) but breaks for: (a) finite-time prediction, where a multiplicative
  constant factor can flip posterior odds; (b) the constant c_UV is not small in practice
