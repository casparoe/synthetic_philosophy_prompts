  Draft:


  ---


  I''m drafting a methods section for a comparative economic history project, and
  I''ve hit an argument with a colleague over an analogy she wants to build the section
  around. The domain is the old Needham-style question — why the Industrial Revolution
  took off in Britain rather than in China — and the specific issue is whether that
  contrast is well posed at all.


  Her analogy, roughly: a properly framed contrastive question in history is like
  a matched case-control study in epidemiology. In a case-control study you don''t
  ask "why did anyone get the disease"; you fix an outcome, select cases, and select
  controls matched on the variables you regard as background — and the question "why
  these cases and not those matched controls" is determinate only once the matching
  and the source population are fixed. Change the matching and you get a different,
  equally legitimate question with a different answer. Her claim is that this is exactly
  the structure of the Pomeranz-style correction: "why Britain and not China" is malformed
  in the same way "why these patients and not the whole hospital" is malformed, and
  the fix is not to abandon the question but to re-specify the comparison — swap the
  units for England and the Yangzi delta, which are the matched pair, and the question
  becomes answerable. She also uses the analogy offensively, against people who say
  the whole project is arbitrary: on her view, saying the contrast class is underdetermined
  is like saying epidemiology is arbitrary because you could have matched on different
  variables; underdetermination of the matching is not absence of an answer.


  I''m not convinced, but I want a careful audit rather than a shrug. Please do the
  following:


  1. Give me the correspondence explicitly — a table is fine. What in the historical
  case plays the role of the source population, the outcome definition, the exposure,
  the matching variables, the controls, and the exchangeability assumption? Flag any
  slot in the analogy that has no plausible historical counterpart, and any historical
  feature that has no counterpart in the study design.


  2. Separate the disanalogies that actually threaten her conclusion from the ones
  that are merely inconvenient. I care in particular about: whether the outcome (industrialization)
  can be defined independently of the units being compared; whether the units are
  stable objects over the period, given that "England in 1800" is partly constituted
  by the processes you''re trying to explain; whether there is any analogue of a risk
  set from which both cases and controls are drawn; and whether matching in the historical
  case is chosen for causal reasons or for narrative ones.


  3. Say what the analogy smuggles in. I suspect it quietly imports an assumption
  that there is a well-defined space of counterfactually available outcomes — something
  like a population at risk — and that the historian''s job is to identify which member
  of that space was realized. If so, does her "offensive" use collapse: does the arbitrariness
  worry she dismisses come back in a form the analogy cannot absorb?


  4. Deliver a verdict: is "why Britain and not China" well posed as it stands, well
  posed only after re-specification, or not well posed in either form? And is there
  a better analogy for what comparative historians are doing — a natural experiment,
  a forensic reconstruction, a difference-in-differences, something else — and where
  does that one break?


  Don''t give me a reading list or citations; I want the argument. Close with a short
  paragraph saying what would change your mind — which of your points is most likely
  to be wrong, and what consideration would flip the verdict in item 4. Hard limit:
  700 words including the table.


