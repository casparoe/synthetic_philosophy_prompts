  is offered exactly once, non-repeatably, for a large fixed stake, and in which the
  student''s decision cannot be revised... so the class must confront whether the
  verdict from phase one transfers.

  4. Build in something that forces the group to compute both the average final holding
  across all players and the median, and to notice who is dragging the average.


