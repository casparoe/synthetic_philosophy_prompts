  I teach a 75-minute session in an undergraduate seminar on rational choice — 18
  students, most with no probability beyond high school, all comfortable with simple
  arithmetic. My topic for the session is how the right size of a bet can differ from
  the question of whether a bet is worth taking at all, and I want the students to
  hit that distinction themselves rather than be told it.


  Design a self-contained in-class game to do this. The core device I have in mind:
  a repeated, favorable, even-money bet (a public coin that comes up in the student''s
  favor 60% of the time, verifiable by the group), played for twenty rounds, with
  each student staking whatever fraction of their own tokens they choose, round by
  round, and being unable to stake more than they hold. Students who run out of tokens
  are out and may not re-enter. No real money: tokens are converted at the end into
  something small and cheap that I can supply for the whole class.


  Requirements:

