  Option A: Adversarial collaboration between precise Bayesian and imprecise Bayesian
  (Walley-style) over Dutch book arguments. The cruxes:

  - Whether rational credences must be uniquely representable as a single probability
  function (uniqueness).

  - Whether the standard Dutch book argument is valid for an agent with a set of probabilities:
  the argument assumes the agent will accept any bet priced at their credence; with
  imprecise credences the agent rejects bets whose price falls outside their interval,
  so no guaranteed-loss book exists (but there''s the "sure-loss" vs. "no-loss" distinction
  — Walley''s avoiding sure loss vs. coherence).

  - Whether it''s irrational to be in a state where you''d decline a free bet ("leave
  money on the table") — the "pragmatic" objection: imprecise agents can be money-pumped
  in a different sense (they decline favorable bets), and there''s debate about whether
  that''s a rational failing.

  - Both agree: the formal framework of avoiding sure loss / coherence for sets of
  lower previsions; that a book that guarantees loss regardless of outcome is irrational;
  that betting quotients are evidence of credence.

  - Verbal disagreement: is "irrationality" defined by the betting behavior or is
  it something else?


