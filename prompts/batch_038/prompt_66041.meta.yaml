  thinking KS satisfies the independence of irrelevant alternatives (IIA) — actually
  KS drops IIA and replaces it with individual monotonicity. A common subtle mistake:
  claiming KS is the solution that maximizes the product of utility gains (that''s
  Nash), or claiming KS is scale-invariant only (it''s invariant to affine transformations
  too), or claiming KS satisfies IIA. Also the "equal proportional gains" characterization:
  the KS solution is where the ray from the disagreement point to the ideal point
  (utopia point) intersects the Pareto frontier. A subtle error: defining the ideal
  point as the max utility each player could get over the whole feasible set (correct)
  vs. the max on the Pareto frontier (same thing actually). Another subtle error:
  claiming KS is defined for non-convex sets and always gives the intersection of
  the ray — actually for non-convex sets the ray may intersect the frontier multiple
  times, and KS is defined using the "northeast" boundary. Also: KS doesn''t satisfy
  IIA but does satisfy Pareto efficiency, symmetry, scale invariance (invariance to
  affine transformations), and individual monotonicity. Another subtle mistake: conflating
  the Kalai–Smorodinsky solution with the "egalitarian" solution (maximize the minimum
  utility gain) — those differ when ideal points differ. That''s a great subtle conflation:
  the egalitarian bargaining solution equalizes absolute gains; KS equalizes proportional
  gains relative to the ideal point. Students often conflate them.


  Also: whether KS is a special case of Nash for symmetric problems — for symmetric
  problems KS and Nash coincide. A subtle error: claiming KS always lies closer to
  the "fair" point... hmm.


