  Axioms: (1) Pareto efficiency / weak Pareto optimality; (2) symmetry; (3) invariance
  to affine (positive linear) transformations of utility; (4) individual monotonicity
  (if the feasible set expands in a way that raises player i''s ideal payoff without
  lowering the other''s, then the solution should not make player i worse off). KS
  drops IIA.


  Definition: For bargaining problem (S, d) with d the disagreement point, define
  b_i = max{x_i : x ∈ S} (the ideal/utopia point). The KS solution is the maximal
  point on the Pareto frontier along the ray from d through b: i.e., the point x =
  d + t(b − d) for the largest t such that x ∈ S (with t ≤ 1 typically when b ∉ S).
  Equivalently, (x_1 − d_1)/(b_1 − d_1) = (x_2 − d_2)/(b_2 − d_2): equal proportional
  gains relative to the ideal.


  Egalitarian solution: maximizes the minimum absolute gain, i.e., x_1 − d_1 = x_2
  − d_2 (when possible on the frontier). This coincides with KS only when b_1 − d_1
  = b_2 − d_2 (after normalization). So the conflation is real: students often say
  "KS equalizes the gains" — wrong, it equalizes the proportional gains.


  Utilitarian solution: maximizes x_1 + x_2 (Kalai also discussed). Not needed.


