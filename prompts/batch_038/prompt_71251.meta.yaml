  that proves too much." A high school student who is into physics. The argument:


  (1) The laws of physics at the microscopic level are (almost) time-reversal invariant:
  for any allowed history, the time-reversed history is also allowed.

  (2) So any process we can explain forwards (why the ice cube melted, why we remember
  the past) could equally have happened in reverse; there''s nothing in the laws that
  says entropy must increase.

  (3) Entropy increase is then just a matter of the initial conditions — the universe
  started in a fantastically low-entropy state.

  (4) But a low-entropy initial state is enormously improbable; by the same statistical
  reasoning, any randomly chosen moment should be near equilibrium, with brief local
  fluctuations.

  (5) If we''re a random sample, it''s overwhelmingly more likely that we''re a fluctuation
  — a "Boltzmann brain" — than inhabitants of a genuinely ordered 13.8-billion-year
  universe with a real past.

  (6) So the correct conclusion of statistical mechanics is that the past didn''t
  happen and your memories are a fluctuation.

  (7) That''s absurd, so something above is wrong.


