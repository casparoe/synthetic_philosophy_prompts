  Draft essay:


  ---

  Title: The Idealization Schedule: Why Indirect Normativity Answers a Question Nobody
  Asked


  1. The target. Indirect normativity, as I use the term, is the strategy of answering
  a normative question by specifying a procedure rather than a result: instead of
  asserting which outcomes are good or which acts are permitted, you describe an idealized
  deliberation — some actual agents, transformed along certain dimensions — and declare
  that whatever that deliberation converges on is the answer. The strategy is old
  in metaethics and new in the design of artificial systems. In metaethics it appears
  as the family of ideal-advisor accounts: Brandt''s proposal that a desire is rational
  to the extent that it would survive a process of cognitive psychotherapy, that is,
  maximal exposure to vivid and accurate representation of the relevant non-moral
  facts; Railton''s account of a person''s good as what a fully informed, fully rational
  version of that person would want her to want; Smith''s analysis of a reason for
  an agent as what a fully rational counterpart of that agent would want the agent
  to want; Hare''s archangel, who combines perfect information with perfect sympathetic
  imagination; and, on the applied side, proposals to specify a system''s aims as
  the extrapolated product of what humans would want on reflection rather than as
  a list of values.


  All of these have a common form: an input plus a transformation. The input is a
  specification of what is held fixed about the actual agent — her desires, her cares,
  her evaluative starting points, her capacities, her bodily and social situation.
  The transformation is a list of idealizations applied to that input: full information,
  perfect instrumental rationality, vivid imagination, unlimited time for reflection,
  absence of cognitive defects, and sometimes impartiality or sympathy. I''ll call
  the list a schedule.


  2. The schedule problem. Two claims.


  First, the output is not invariant under the schedule. Holding a desire fixed while
  transforming the agent''s information and rationality can extinguish the desire
  (this is exactly what Brandt''s procedure is designed to do); holding desires fixed
  while transforming only how they are weighed gives a different answer again; holding
  fixed nothing but the capacity to respond to reasons, and adding perfect sympathy,
  gives something closer to an impartial observer, who may not be recognizably the
  agent who started out. These are not marginal variations. They can disagree in direction:
  an account that idealizes information alone may license a preference that an account
  idealizing sympathy alone condemns.


  Second, there is no non-question-begging way to choose a schedule. Every reason
  offered for including an idealization already contains a normative commitment. Vividness
  is included on the grounds that a dimly represented fact is epistemically distorting
  — but which facts are reason-giving, and in what proportion, is precisely the question
  the procedure was supposed to answer. Impartiality is included on the grounds that
  partiality is a defect — again, the answer, inserted into the machine. The schedule
  is therefore not a neutral implementation detail; it is where the entire normative
  content of an indirect account lives, and it is defended, if at all, by intuitions
  the account was meant to systematize.


  3. Three replies, and why I''m not satisfied.


  Convergence. Suppose that as idealization increases, the outputs of different schedules
  converge, so that the choice matters only in the limit where it stops mattering.
  The reply assumes that more idealization removes disagreement rather than removing
  the constraints that were producing agreement in the first place; and there is no
  independent reason to think the former is true. Worse, the reply is self-sealing:
  when two schedules disagree, the convergence theorist says one of them has been
  under-idealized. But under-idealization can only be diagnosed by an independent
  standard, and the account provides none.


  Endorsement on return. My own attempted repair. A schedule is admissible only if
  the actual agent, restored to ordinary capacity and fully informed of the idealized
  agent''s verdicts, endorses them. The normative output is what survives idealize-then-return;
  the account becomes a fixed-point condition. This has real appeal — it makes the
  input and the output answerable to each other — but I think it fails. The returning
  agent is not the agent who left: the report has changed her, so the fixed point,
  if it exists, is not obviously unique or stable. And the return leg requires its
  own schedule (how much disclosure, over what period, with what opportunity to revise),
  which reintroduces the problem one level up. If it is to be non-regressive, the
  return condition has to be applied with the same schedule as the idealization leg,
  and I don''t see why that pairing is anything but arbitrary.


  Deliberation as constitutive. A constructivist reply: the idealized process doesn''t
  track independently existing norms, it makes them, so there is no fact of the matter
  about which schedule is correct — only about which one we adopt. This dissolves
  the schedule problem only by dissolving the ambition. If the process constitutes
  the norms, then the choice of process is a bare normative choice, and indirect normativity
  has not avoided first-order ethics; it has hidden it in a list of parameters.


  4. A deflationary suggestion. Maybe the schedule problem is not a bug. Perhaps indirect
  normativity was never an answer to what is good, and has been misread as one. Read
  instead as an answer to who is entitled to settle the question, the schedule is
  exactly what it should be: a proposal for allocating authority over the specification
  of values. Its acceptability condition is then not truth-tracking but recognitional
  — those who will be bound by the output must be able to see the idealized deliberator''s
  verdicts as answers to their own questions rather than to someone else''s. This
  is weaker than endorsement on return (it does not require agreement) and stronger
  than causal continuity (it constrains which transformations of an agent count as
  improvements). It also relocates the hard work to a place where the metaethical
  literature is thin and the literature on personal identity is thick: the question
  becomes whether the idealized agent is still me, which is a question that has been
  asked carefully before, though usually in the context of fission, teleportation,
  and dementia rather than in the context of idealization.


  If that is right, the standard complaint against indirect normativity — that it
  postpones the hard questions — is correct but misplaced. It postpones them to a
  domain where they are more tractable, or at least better studied.

