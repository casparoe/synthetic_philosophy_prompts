  must justify proposals against this test, and Protocol No. 2 requires the Commission
  to transmit draft legislative acts to national parliaments, each of which has two
  votes (in bicameral systems, one for each chamber). If reasoned opinions objecting
  on subsidiarity grounds reach one third of the votes, the Commission must withdraw
  the proposal and start again; this ''yellow card'' has been used several times since
  Lisbon. Where a simple majority of votes objects, the proposal goes to the legislature.


  Enforcement in the Union is ultimately judicial: the Court of Justice can annul
  legislation for infringement of subsidiarity, and it did so in the 2000 Tobacco
  Advertising judgment, in which Germany successfully challenged a directive regulating
  the advertising and sponsorship of tobacco products. That case remains the leading
  authority on subsidiarity.


  The United States has no equivalent textual principle, but the Supreme Court has
  developed a structural one. In New York v. United States (1992), the Court invalidated
  the ''take-title'' provision of the Low-Level Radioactive Waste Policy Amendments
  Act because Congress cannot compel a state legislature to enact a regulatory programme;
  in Printz v. United States (1997), it extended the same principle to state executive
  officers, striking down the provision of the Brady Act requiring local chief law
  enforcement officers to conduct background checks. Together these establish the
  anti-commandeering doctrine: Congress may not conscript the machinery of state government.


  Germany is often cited as a middle case. The Basic Law expressly entrenches subsidiarity
  as a general principle governing the division of powers between the Federation and
  the Länder, and the necessity clause for concurrent legislative competence allows
  the Federation to legislate only where federal regulation is needed — which is subsidiarity
