  Final answer text:


  "Neurath''s picture work — the Vienna Method, later Isotype — is best read as the
  practical wing of the same programme the Vienna Circle pursued theoretically: strip
  out metaphysics and rebuild knowledge on a basis that anyone can check. Where Carnap
  wanted a unified scientific language made of physicalist statements, Neurath wanted
  a unified visual one, so that a factory hand in Red Vienna and a schoolchild in
  Holland could look at the same chart of unemployment and read off the same content
  without a translation step in between. In the protocol-sentence controversy his
  contribution was in effect to push the issue one stage further back: if protocol
  sentences were where language touches observation, pictures were to be where the
  touching is made visible, and Neurath argued that observation reports should ultimately
  be given in pictures rather than in words.


  Two features of the practice support this. First, the pictograms are deliberately
  conventional rather than naturalistic. The repeated little human figure that stands
  for a fixed number of workers is not meant to resemble anyone, and the first rule
  of the method is that you never enlarge a figure to show a bigger quantity, you
  repeat it — because a scaled-up figure smuggles in an impression of intensity that
  the data doesn''t license, and impression is evaluation. Second, the chart is not
  the raw data: it is the output of a rule-governed transformation performed by a
  trained person, the transformer, who decides what to leave out and how to group
  it. That''s why the museum''s slogan was that remembering simplified pictures beats
  forgetting accurate figures: the simplification is a deliberate, disclosed act,
  not a distortion.


  But I think the hedge in calling all this ''language-like'' is unstable, and unstable
  against Neurath rather than for him. His caution is the right one: the pictures
  can''t stand alone. Yet once you concede that nothing is legible in the chart until
  you also have the transformation rules and the accompanying words, you''ve conceded
  that the pictorial signs aren''t doing any semantic work at all. The rules do it,
  and the rules are verbal. That''s a direct consequence of the picture theory Neurath
  was working with: a proposition pictures a state of affairs by sharing its logical
  form, and what makes picturing different from mere symbolising is that the pictorial
  relation is available in the thing itself. Isotype has no such relation, since the
  same figure can be assigned any value you like by convention. So the honest description
  of Isotype is not a language-like technique but a mnemonic — illustrations pinned
  to a text that could be written without them — and the internationalist claim fails
  for the same reason, because two readers who share no language share no transformation
  rules either. What survives is an excellent design discipline rather than a contribution
  to the unity of science."


  Good. Errors:

