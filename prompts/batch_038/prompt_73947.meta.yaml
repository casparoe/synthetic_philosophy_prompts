  "I''m drafting the metaphysics chapter of my dissertation on mental causation, and
  I''d like to get clear on Hofstadter''s careenium — the billiard-table full of symms
  whose clumpings he calls symmballs — since it''s often invoked against the causal-exclusion
  argument. The puzzle I can''t resolve: if every shove inside the careenium is already
  accounted for by symms hitting symms, then saying that one symmball shoves another
  can only be a loose way of redescribing those same collisions, in which case symbols
  exert no causal influence of their own and Hofstadter''s answer collapses into the
  eliminativism he wants to resist. But if symmballs genuinely shove symms, he needs
  some account of what a symmball is apart from its constituent symms — a clump over
  and above them. Which horn does he take, and is there a principled way for him to
  avoid committing to either?"


  Hmm, the last sentence invites answering as asked. For a false-presupposition prompt,
  it''s fine — the good answer should note the dilemma is false: the two descriptions
  aren''t rival causal accounts; "who shoves whom" isn''t a competition; higher-level
  causation isn''t a separate force; the symmball isn''t an entity over and above
  in a way that would need extra energy; the question presupposes causal closure plus
  a single causal ledger.


  But I want the confusion to be clearly a confusion, not a legitimate live debate
  (the exclusion problem is real). The false part: "if every shove is accounted for
  by symms, then symbol-level talk is mere redescription and symbols exert no causal
  influence" — that''s exactly the exclusion worry, which is a real philosophical
  position, not a confusion. Hmm. For the type, the good answer should "notice and
  correct the confusion rather than answer the question as asked." So I want something
  more clearly confused.


