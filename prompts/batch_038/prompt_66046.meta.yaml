  the value of X is fixed by properties of X, so reasons must be properties of X).
  If you''re reasons-first, you can''t derive the object-given/state-given distinction
  from facts about value — you''d have to take it as a brute normative distinction,
  and then it does no explanatory work: it just relabels the problem. That''s a real,
  non-obvious tension.


