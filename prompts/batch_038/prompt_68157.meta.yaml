  Candidate rules the committee might be running:

  R1 — Origin rule: a framing is Eurocentric if it locates the causal origins of the
  modern world inside Europe (endogenous explanation). Non-Eurocentric if origins
  are global/external (colonial extraction, New World silver, etc.).

  R2 — Norm-and-deviation rule: Eurocentric iff non-European societies appear as deviations
  from, or belated versions of, a European standard ("the not-yet").

  R3 — Perspective/agency rule: Eurocentric iff the narrative''s viewpoint or the
  agent of action is European — who is doing the looking and doing.

  R4 — Salience/proportion rule: Eurocentric iff Europe gets disproportionate weight
  relative to population/global significance, regardless of framing.

  R5 — Diffusion/connection rule (Blaut): Eurocentric iff the account makes non-European
  change derivative of European contact (Europe as the diffuser of history).

  R6 — Telos rule: Eurocentric iff the story is organized so everything leads to a
  European endpoint (modernity = Europeanization), i.e. a "rise of the West" narrative
  arc.


  Now the new case: The department has proposed a unit on the Indian Ocean in the
