  Best combination: I think "Testimony: reductionism vs. anti-reductionism" with the
  commitment-audit type could be great. Or "Frederick Douglass''s views on the Constitution"
  with the verdict-prediction type — a student reading group tracking Douglass''s
  verdicts across cases (founding, Garrisonians, the Liberty Party, the Dred Scott
  decision, the Civil War, the Fifteenth Amendment, the Chinese Exclusion Act?, women''s
  suffrage) and asking what he''d say about a new case. That''s rich and requires
  knowledge of Douglass. But it risks needing specific quotes. I can write it without
  quotes.


  Actually, the commitment-audit type with testimony would allow me to inject niche
  ideas: e.g., the asker holds Hume-style reductionism (testimonial justification
  requires positive reasons grounded in induction from personal observation), plus
  anti-reductionist views about children''s testimonial entitlements, plus a commitment
  to the "gullibility" objection, plus a claim about expert testimony in medicine,
  plus something about the epistemics of anonymous online testimony. Tensions: e.g.,
  if you''re a reductionist, you can''t easily explain how you get positive reasons
  for trusting testimony without already trusting testimony (the Hume/Credit problem);
  also the child case (Coady / Burge''s acceptance principle, or the developmental
  argument that a reductionist can''t allow infants to acquire language). Apparent
  tension that dissolves: e.g., between reductionism and trusting a stranger''s directions
  — that''s fine since local positive reasons exist (the stranger has no incentive
  to deceive, is locally knowledgeable). Genuine tension: between holding that testimony
  is not a fundamental source of justification and holding that memory/perception-based
  positive reasons are themselves... hmm.


  Alternatively, Burkean conservatism and Chesterton''s fence with commitment audit:
  the asker holds (1) reforms shouldn''t proceed until the function of the existing
  practice is understood, (2) but also (3) that the burden of proof lies on those
  defending the status quo in cases of... plus (4) that historical longevity is evidence
  of functionality (survival-of-the-fittest argument for practices), plus (5) that
  many existing practices are the products of power rather than selection, plus (6)
  an evolutionary debunking-style claim. There are nice tensions: the selection argument
  for Chesterton''s fence (a practice survived because it worked) requires that the
  selection process be reliable, but the claim that many practices are artifacts of
  coercive power undercuts the reliability of the selection process. And an apparent
  tension that dissolves: between "don''t reform until you understand" and "sometimes
  you must act under time pressure" — actually that could be a real tension. Hmm.


  Also interesting: Burkean conservatism + Chesterton''s fence + commitment to reforming
  quickly in cases of injustice. And the "we can''t understand the fence because the
  fence''s function is opaque" — the paradox that the fence principle demands inquiry,
  but inquiry itself may destroy the practice (like randomized controlled trials of
  social institutions, or the fact that some functions are only revealed when removed
  — the fence can only be understood by removing it). That''s a genuine non-obvious
  tension.


