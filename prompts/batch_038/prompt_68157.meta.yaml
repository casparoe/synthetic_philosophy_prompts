  2. For each, what it predicts for H, and which precedents support or strain it (check
  each rule against all seven precedents, not just the friendly ones).

  3. Identify the closest analog among A–G and say why; note that D and F point one
  way and C/E point another (or whatever).

  4. Best guess at the vote with reasons, and the margin.

  5. What principle the committee adopts either way, if the precedents underdetermine:
  if it approves H, what has it said about the relationship between subject and cause?
  If it rejects H, is it saying that a question can be objectionable regardless of
  how well it''s answered — and does that commit it to also reopening F and D, which
  have the same structure?

  6. Name one further proposal that would discriminate the two leading rules — a case
