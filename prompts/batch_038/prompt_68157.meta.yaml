  Rulings:

  1. Rejected: opening the course with the phrase "the Age of Discovery" and with
  Columbus as the hinge between the premodern and modern worlds. Stated reason: the
  arrival of Europeans in the Americas was a discovery only from one shore, and the
  word does the work of making Europeans the subjects of world history.

  2. Accepted (with revision): keeping a mid-course unit on the eighteenth/ nineteenth-century
  divergence in living standards between Britain and the Yangzi Delta, framed as a
  comparison of two regions with similar resource constraints and resolved by coal
  and colonial resources — the version Pomeranz argues. Stated reason: the unit denies
