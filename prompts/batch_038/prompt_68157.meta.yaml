  debate about whether a single world narrative is possible, "provincializing Europe",
  the Great Divergence debate (Pomeranz), the question of whether global history itself
  is a Eurocentric genre, and whether writing "from everywhere" requires a single
  synthesizing narrator.


  I could make the body: a committee designing a first-year "global history" course,
  or a textbook editorial panel, or a museum curatorial team. Let''s make it a curatorial
  team for a world history gallery, or better: a faculty committee revising a required
  world-history survey. Their precedents:


  1. They dropped the phrase "the Age of Discovery" and replaced "Columbus discovers
