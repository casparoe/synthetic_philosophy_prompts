  "For four years I have chaired what our faculty senate calls the Committee on Collegial
  Grievances, and I am writing to ask for help turning a piece of moral philosophy
  I teach into an instrument my committee can actually use.


  The committee hears between ten and fourteen cases a year. Composition: two faculty
  drawn from outside the complainant''s department, one doctoral student, one member
  of the professional staff, and me. No one but me has read Smith, and I do not propose
  to assign him; whatever I give them must be workable from two pages. We have ninety
  minutes per case, we take no testimony under oath and have no fact-finding powers,
  and we issue a written finding — a recommendation, not a verdict — which goes to
  the dean, who may accept, modify, or ignore it. There is no appeal, and the recommendation''s
  principal effect is reputational, which is why the senate reviews our findings for
  consistency each spring.


  The cases are of a kind: a doctoral candidate who says her supervisor stopped reading
  her work; two co-authors who cannot agree who did what; a lecturer who believes
  a colleague has quietly undermined her teaching assignments; a staff member who
