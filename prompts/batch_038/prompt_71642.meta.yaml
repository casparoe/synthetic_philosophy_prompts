  Two people I''ve been reading on a rationalist-ish Discord for the better part of
  a decade got into it over Nuremberg last week — Dan, who''s mostly AI safety, and
  Miri, who does legal history — and it ran to something like 200 messages and neither
  of them backed down. I don''t want to take a side before I understand it, so: can
  you go through their exchange move by move and tell me who''s right at each point?


  1. Dan opened with the charge of aggressive war being invented. His claim: nothing
  before August 1945 made starting a war a crime for which an individual could be
  prosecuted. The Kellogg-Briand Pact renounced war as an instrument of national policy
  and Germany signed it, but it created no tribunal, no penalty and no individual
  liability, so when the London Charter defined "crimes against peace" that summer,
  the tribunal was convicting people under a rule that didn''t exist when they acted.
  On his view the defence''s nullum crimen objection was just... correct, and the
  fact that the bench was entirely made of judges from the four winning powers means
  there wasn''t a neutral decision-maker either.


  2. Miri: retroactivity is only unfair where it defeats a legitimate expectation,
  and legality is a device for giving people fair warning. Warning there was — Germany
  had renounced aggressive war by treaty, along with dozens of other states, and nobody
  at the top of the Reich supposed that a war of conquest would be treated as lawful
  by anybody, victor or vanquished. So what was new was the machinery, not the wrong,
  and a procedural irregularity isn''t the same thing as an injustice.


  3. Dan: fine, but notice Miri has just conceded the ground she started on, because
  if the point of legality is fair warning rather than legality itself, then you''ve
  got to run the same test on the alternatives the Allies actually had in front of
  them. Churchill wanted the leading Nazis shot without any trial and it was the Americans
  who pushed for a court; on a pure fair-warning metric, Dan said, you can at least
  ask whether a retroactive charge is worse than no charge at all. And separately:
  if the test is pre-existing wrongfulness, the same test convicts the Allies — unrestricted
  submarine warfare and the area bombing of cities — and the reason those never appeared
  in an indictment isn''t a principle, it''s the score at full time. He agreed tu
  quoque isn''t a legal defence for a defendant, but said it''s fatal to the claim
  that what happened at Nuremberg was law being applied rather than power being exercised.


  4. Miri split it in two. On procedure: the trial wasn''t just a nicer-looking execution.
  It made the victors prove things, it produced a record, the defendants got to speak
  and call evidence — Dönitz''s side got written answers out of Nimitz about American
  submarine practice in the Pacific, and the tribunal said it wouldn''t weigh the
  submarine breaches in his sentence. Whatever else that is, it isn''t a firing squad
  with a script. On the Allies'' own conduct: she said Dan was implicitly demanding
  that a legal system be impartial between the parties to it in order to count as
  law, and that standard is far too strong, since all domestic criminal law has the
  state as both rule-maker and prosecutor.


  5. Dan said that''s precisely the disanalogy, though. In domestic law the rules
  are made by a legislature the defendant has some standing to influence, and the
  state binds itself prospectively; at Nuremberg the people who wrote the Charter
  were the people running the prosecution. And he produced what I thought was his
  best move: the tribunal was perfectly happy to treat its jurisdiction as a hard
  limit when that cut in one direction — it refused to convict for the pre-war persecution
  of German Jews, on the reasoning that those acts weren''t shown to be connected
  to the aggressive war — so it clearly did think itself bound by the Charter''s edges.
  But those edges were drawn by the winners after the event, so "bound by law" collapses
  into "bound by the winners'' preferences". He also said Tokyo is worse: eleven judges,
  a full dissent from the Indian judge on ex post facto grounds, a Dutch judge dissenting
  in part, and a French judge writing separately to doubt whether a tribunal appointed
  only by the victors could be fair. If the people on the bench can''t agree what
  the law was, it wasn''t sitting there waiting to be applied.


  6. Miri: the dissents prove the opposite. A show trial doesn''t generate reasoned
  minority opinions the majority then has to answer at length; the fact that the majority
  wrote hundreds of pages engaging the Indian judge''s legal argument is what a legal
  process looks like from the inside. And then she made what seemed to me like her
  actual point: the cost of Nuremberg''s retroactivity isn''t owed to Göring, it''s
  a forward-looking cost paid by future defendants and future states, and it may have
  bought an enormous amount — the idea that individuals can bear responsibility under
  international law at all, and eventually the ICC. So she accused Dan of a category
  error, because he keeps sliding between "the trial was unjust to these defendants"
  and "the trial was just power", and those are different claims with different evidence.


  7. Dan''s last move: that''s a dodge. If the retroactive charges really were unjust
  to the defendants, and the answer is that the injustice purchased a good precedent,
  then Miri has abandoned her own step-2 argument (nothing unfair happened, because
  there was notice) in favour of a consequentialist one, and she now owes a showing
  that the precedent paid off — which he said it hasn''t, since the ICC couldn''t
  touch aggression at all for decades after Rome and the states most likely to start
  wars are still outside it, and the most obvious lesson for everyone else was simply:
  don''t lose.


  So. Rate each of the seven moves from clearly wrong to clearly right, with a sentence
  or two of justification each, and then say who''s more right overall. Two specific
  things I want an answer on: (a) is Dan right that Miri''s shift from "there was
  fair warning" to "it was worth it anyway" is a real concession that guts her earlier
