  Format: casual, some typos, from the perspective of a TA/instructor grading. Should
  not signal own opinion. Should ask for grade + specific comments, point-by-point.


  Draft:


  ---


  I''m TAing a grad seminar on idealized deliberation and I''ve got to grade this
  take-home by tonight. The question and the student''s answer are below. Give me
  a grade out of 100 and then a point-by-point writeup I could paste into the comments
  box — what they got right, what''s wrong, and for the wrong bits, exactly where
  the reasoning breaks. Rubric-wise: full marks requires identifying at least one
  non-obvious problem with the idealization and defending it; a competent-but-shallow
  answer gets ~75-85.


  Question (self-contained; students were told to assume only what''s in it):


  "Consider the following idealization of human deliberation, call it HCH. A human
  is asked a question Q. To answer, they may instead pose two easier sub-questions
  Q1 and Q2 to two independent, perfectly honest and perfectly accurate copies of
  themselves, receive answers A1 and A2, and then, on the basis of A1 and A2 alone,
  produce their own answer to Q. Each copy may do the same thing recursively, to unbounded
  depth. At every leaf, an unaided human answers a question directly, with no help.


  Separately, consider the ''factored cognition'' picture: a cognitively hard task
  is tractable just in case it can be decomposed into subtasks each of which an unaided
  human can perform, where the subtask outputs can be recombined into an output for
  the whole task.


  Discuss: (a) Is HCH''s answer to Q well-defined — i.e., does the setup determine
  a unique answer, or a unique best answer, for each Q? (b) Does HCH''s answer to
  Q ever exceed what some unaided human could reach given enough time and paper? (c)
  What does the relationship between (a) and (b) tell you about using HCH as a target
  for what an AI''s goals or judgments should be aligned to?"


  Student''s answer:


  "(a) No, not automatically. The setup doesn''t say which sub-questions the human
  chooses, and different decompositions of Q can lead to different final answers —
  e.g. for ''should the city build the new bridge?'' you could split it into cost
  questions and safety questions, or into who-benefits and who-pays, and there''s
  no reason these have to converge. So HCH is a set of possible answers rather than
  a function, unless you add a rule for choosing decompositions or take the best over
  all of them. That''s a real gap.


  (b) No. Every step is performed by a human with unaided-level competence: the leaves
  are unaided humans, and each internal node only ever has to read two short answers
  and combine them. So even though the tree can be arbitrarily deep, and even though
  the total number of human-steps can be astronomical, no individual step ever requires
  more than ordinary human cognition. HCH therefore can''t answer anything an unaided
  human couldn''t answer given enough time, patience and paper — you could in principle
  simulate the whole tree yourself by working through it bottom-up, one node at a
  time. Depth buys you a lot of convenience, not a new class of answers.


  (c) Since (b) holds, aligning an AI to HCH''s answers is a safe target in the relevant
  sense: HCH never transcends human judgment, so we don''t have to worry about the
  aligned system pursuing something no human could have endorsed. And since (a) shows
  HCH is answer-set-valued rather than single-valued, the right way to align is to
  make the system aim at some answer in the set, or at whatever the most common one
  is, and not to worry about picking out a unique target. The two problems are independent:
  fixing (a) by stipulating a decomposition rule wouldn''t change (b)."


  Grade it.


  ---


  Hmm, wait. The student''s (b) contains the subtle error: the claim "you could in
  principle simulate the whole tree yourself by working through it bottom-up, one
  node at a time" — this conflates: to simulate the tree bottom-up, the human at the
  root must perform all the *combination* steps themselves, but each internal node''s
  combination step is a human performing a bounded task given A1, A2 — so a single
  human simulating bottom-up would need to hold and perform many such steps, which
  is fine one at a time... but the crucial issue: writing down the tree requires the
  human to *choose* the decompositions, and the tree may be astronomically large —
  "enough time and paper" is granted, so that''s ok. The real problem: at a leaf,
  the unaided human answers directly; but when the root human simulates bottom-up,
  they''d have to answer the leaf questions themselves too — which they can, since
  leaves are unaided human tasks. Hmm, so is (b) actually right?


  The classic objection: the combination step is not always within unaided competence
  — the human at an internal node, given A1 and A2, must judge how to combine them
  into an answer to Q. That judgment may itself be as hard as Q. So "each internal
  node only ever has to read two short answers and combine them" begs the question:
  combining is the hard part. Factored cognition requires that the subtask outputs
  can be recombined into an output for the whole task — and that recombination must
  itself be within unaided competence, which is exactly what''s in question. So the
  student''s (b) reasoning has a gap: it assumes the combination step is trivially
  within human competence ("only ever has to read two short answers and combine them"),
  which is not guaranteed. And "you could simulate the whole tree bottom-up" — the
  simulating human does all the node-computations, each bounded, so total is bounded-per-step
  but the human''s *memory/notes* grows; with enough paper that''s fine. Hmm, but
  there''s another wrinkle: to simulate bottom-up, the human must also simulate the
  *copies''* choices of sub-questions, which are the same human''s choices — fine.


  Actually the deeper subtlety: "perfectly honest and perfectly accurate copies of
