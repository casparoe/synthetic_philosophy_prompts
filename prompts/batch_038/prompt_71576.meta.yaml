  equalize who does the dishes and still have the problem)? — This separates "gender-egalitarian
  redistribution" from "caregiver parity"/"valuing care" views.

  2. Is a period of full-time infant care by a parent something the child is *entitled
  to*, or merely one permissible arrangement among many? (separates the child-centered
  claim from parent-centered claims)

  3. Does leave belong to the parent as an individual non-transferable quota, or to
  the household as a shared pot? And: is the point of the quota to *change fathers''
  behavior* (behavioral/incentive view) or to *express that care is not women''s work*
  (expressive view)? These can come apart — a nice "unoccupied combination": someone
  who thinks non-transferable quotas express the right norm but won''t change behavior,
  and whether that''s still worth doing.

  4. Is third-party group childcare a *substitute* for parental care, an *inferior*
  substitute, or *not a substitute question at all* because it''s a separate public
  good (infrastructure view)?

  5. Is the dual-earner family the *target* (make it workable) or itself part of the
  problem (because it subordinates family life to labor-market rhythms)? This separates
  "universal breadwinner" from "caregiver parity" from a *critique of both* (e.g.,
