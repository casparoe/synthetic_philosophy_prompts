  ---


  I sit on the coverage-policy committee of a large health plan and I have been asked
  to draft the conceptual background for a review of our surgical coverage rules.
  What I need is an account of what those rules presuppose about disease, not a defense
  of them.


  Here is the practice. Our policies divide procedures into cosmetic and reconstructive
  or medically necessary, and only the second category is reimbursed. Getting a procedure
  into the second category requires the claim to be recast in a particular vocabulary.
  A reduction mammaplasty is denied when the request is framed as relief from distress
  about appearance; the same operation is authorized when the file shows documented
  neck, back and shoulder pain, grooving from bra straps, a period of failed conservative
  management — physical therapy, supportive garments, analgesics — and a planned resection
  above a minimum number of grams per breast, sometimes scaled to the patient''s body
  size. Rhinoplasty is denied as cosmetic and authorized as functional when a deviated
  septum impairs breathing. Correction of prominent ears is, in a good many policies,
  denied to an adult and authorized for a young child on the ground of anticipated
  psychological harm. Bariatric surgery requires a body-mass-index threshold plus
  at least one weight-related comorbidity plus a documented history of failed dietary
  attempts. Treatment of male-pattern hair loss is excluded although it is distressing,
  visible, and pharmacologically treatable; treatment of acne is covered. Infertility
  treatment is capped or excluded by many plans even though it is a failure of a bodily
  function. And we authorize statins for people who feel entirely well and function
  entirely well, on the strength of a number.


  All of this is administered by committees that write clinical policy bulletins,
  set numeric cut-offs, and occasionally revise them by consensus rather than by discovering
  anything.


  Take these details as given; where plans differ, treat the variation as part of
  the data.


  What I want from you:


  (a) Reconstruct the theory of disease and health that the gatekeeping rule presupposes.
  In particular, does it require that disease be a statistically atypical departure
  from the functional organization of a reference class, such that felt harm is never
  sufficient on its own? Or does it presuppose something more normative — that a condition
  counts when it defeats goals a person is socially expected to pursue? Say which
  features of the practice force the reading and which are merely consistent with
  it.


  (b) Separate the metaphysics from the administration. How much of this pattern would
  be generated by budget limits, auditability, moral hazard and the need for ex ante
  rules, without any theory of function at all? Identify what the practice strictly
  presupposes versus what it is merely expedient under.


  (c) The reference-class structure. Our thresholds are indexed by age, sex and body
  size, and the ear case treats the same anatomy differently in a child and an adult.
  Does that commit us to a statistical notion of normality, and to which reference
  classes? Or is the child/adult asymmetry evidence of a different commitment altogether
  — and if so, is it consistent with the rest of the rules, or does the practice hold
  two incompatible conceptions at once?


  (d) Tell me what would have to change if the gate were replaced by an openly normativist
  one, on which a condition qualifies because it makes the patient''s life go worse.
  What happens to the cosmetic/reconstructive line? What would the claimant have to
  establish, what would the committee have to weigh, what would we lose in the way
  of a stopping point, and what new machinery (a measure of harm, a ranking, a cap)
  would the practice need in order to remain administrable? And say briefly what would
  have to be dropped if we went the other way and purged the rules of everything not
  tied to a demonstrable functional lesion.


  Finally, tell me where the practice is philosophically underdetermined — where two
  or three rival accounts of disease would license exactly the same rules — since
  that is the part I most need for the background section.


