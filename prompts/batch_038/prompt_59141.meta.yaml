  Hmm, this is good but let me check the tension analysis for correctness.


  1+2+3 → triviality. Correct: Lewis''s triviality results show that if conditionals
  express propositions with truth values, and P(A→B) = P(B|A) for all probability
  functions (or is preserved under conditionalisation on arbitrary evidence), then
  no non-trivial probability function exists satisfying it. Yes. Actually the standard
  formulations: (i) if for all P, P(A→B) = P(B|A), triviality; (ii) if for a single
  P and all E with P(E)>0, P(A→B | E) = P(B | A∧E) — i.e., stability under conditionalisation
  — then triviality. My third item is exactly formulation (ii). Good. And 2 supplies
  the propositionality needed (P(A→B) as a probability of a proposition). Correct.


  Actually, subtle: item 1 says "degree of acceptance = conditional degree of belief"
  — that''s Adams''s thesis about assertibility, which doesn''t by itself require
  the conditional to have a truth value. Item 2 says it does have truth value. Item
  3 says the thesis survives arbitrary conditionalisation, which turns assertibility
  into P(A→B|E) if acceptance tracks credence in the proposition. So the trio is inconsistent
  (for non-trivial P). Yes, this is the standard reading of how Lewis''s result bites.


  The fix: drop 2 (suppositional/expressivist view — Edgington, and Lewis''s own conclusion
  "probabilities of conditionals aren''t conditional probabilities" leads to denying
  that they have truth values in the ordinary sense), or drop 3 (restrict to one''s
  actual credences — Adams''s thesis as a constraint on the actual probability function
  only), or drop 1 (adopt truth conditions like Stalnaker''s, where P(A>B) ≠ P(B|A)
  in general). Good, and each has a cost.


  4+5 tension: If indicatives and counterfactuals share truth conditions, and counterfactual
  truth conditions are similarity-based (item 5), then indicatives are similarity-based.
  Then "If Oswald didn''t shoot Kennedy, somebody else did" would be true iff in the
  closest world(s) where Oswald didn''t shoot, someone else did. But we know Oswald
  did shoot, so the closest ¬O-worlds are worlds where Kennedy lives (or where someone
  else shot him — genuinely indeterminate). Standard analysis: the indicative is true
  because conditional on Oswald not having shot, we should redistribute our credence
  to other shooters; the counterfactual is not similarly supported. So the mood-only
  view (4) predicts the two should have the same truth value, but they don''t (or
  at least: the intuitive verdicts differ). Actually careful: the mood-only view says
  the difference is epistemic — the first is uttered under uncertainty, the second
  under certainty. So the view could say: same truth conditions, but different evidence
  states give different assertibility. Hmm! That''s a real reply available to (4):
  it''s a presuppositional/epistemic account. Under that view, the truth conditions
  are the same (similarity-based, per 5), and the difference in our verdicts reflects
  our different epistemic positions. But then: for the indicative uttered under uncertainty,
  the truth condition is still similarity-based, which conflicts with item 1 (acceptance
  = conditional probability). Because if the indicative has similarity-world truth
  conditions, your degree of acceptance in it should be your credence in the closest-world
  proposition, which is not in general your conditional probability. So 4+5 conflict
  with 1 more sharply than with the Oswald data per se.


  Also, there''s a direct conflict between 4+5 and the Oswald data: if truth conditions
  are shared and similarity-based, then "If Oswald didn''t shoot Kennedy, somebody
  else did" is true iff in the closest ¬O-worlds somebody else shot him — which is
  dubious/indeterminate — yet we''re confident in it. Hmm, but the (4)-proponent says
  confidence comes from the epistemic state, not the truth conditions. That''s the
  standard defence (this is roughly the view of... the "one if" position, associated
  with e.g. Jackson''s account? Actually Jackson defends the material conditional
  plus conventional implicature for indicatives — that''s a different deflationary
  route). Anyway, the audit should surface: 4 forces 1 and 5 apart, because similarity-based
  truth conditions don''t deliver conditional probability as assertibility, and the
  Oswald pair is the pressure point.


  So genuine tensions: (1,2,3) severe; (1,4,5) severe; also (4,5) with Oswald. And
  apparent: item 6 vs item 1 (dissolves — Adams''s thesis isn''t vulnerable to the
  same problem because acceptability of ''if A,B'' tracks P(B|A), which doesn''t rise
  as P(A) falls; indeed low P(A) makes P(B|A) unstable/hard to assess, and Adams adds
  a proviso about assertibility requiring the antecedent not be too improbable — that''s
  a real subtlety: Adams notes that asserting a conditional when P(A) is very low
