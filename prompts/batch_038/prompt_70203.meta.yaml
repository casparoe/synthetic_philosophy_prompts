  (1) If you have reason to prevent a harm, you have reason to prevent the greater
  number of similar harms, other things equal.

  (2) Wild animals suffer enormously, and most of that suffering is caused by the
  fact that there are so many of them — reproduction rates in r-selected species mean
  most offspring die painfully within days.

  (3) The only reliable way to prevent that suffering is to prevent those animals
  from existing.

  (4) Improving conditions for existing wild animals is unreliable: any welfare gain
  that increases survival raises population until the suffering per generation is
  back where it started (Malthusian equilibrium).

  (5) So the only reliable way to reduce total wild suffering is to reduce the number
  of wild animals.

  (6) Reducing the number of wild animals to zero reduces total wild suffering to
  zero.

  (7) Therefore, if you think wild animal suffering matters, you should want all wild
  animals extinct (or at least permanently sterile).

  (8) But extinction also removes the good in wild animal lives, and a world with
  no animals isn''t better than a world with flourishing ones — so (7)''s conclusion
  is repugnant.

  (9) So (1) is false: numbers don''t aggregate that way.


  Where''s the flaw? Several candidates:

  - (4) is an empirical claim about density dependence that''s contested (many populations
  aren''t at carrying capacity; and "suffering per generation back where it started"
  is a leap — even at equilibrium, welfare can rise if e.g. food is more abundant
  / fewer parasites).

  - (6)→(7): reducing the number to zero is not available as an action, and "should
  want" conflates a state-of-affairs ranking with an action guide (ought implies can
  / the "ideal theory" slide). Also (6) treats "no animals" as an improvement for
  the animals, but non-existence isn''t a benefit to anyone — this is the classic
  "who is made better?" objection (person-affecting view). That''s a strong candidate
  flaw: (6) assumes harm/benefit can be assessed impersonally across nonexistence,
  which (1)''s "prevent a harm" framing does not license, since preventing a harm
  requires a subject who would otherwise be harmed. There''s a slide between "harm
  to existing beings" in (1)-(2) and "no beings at all" in (6): the harm-prevention
  principle applies only where there''s someone to be saved. That''s an equivocation
  on "prevent harm" — actually a scope slide between person-affecting and impersonal.

  - Also (5): "reduce the number" as the only reliable route ignores reducing the
  *intensity* of suffering per animal (e.g., disease control, painless contraception
  that also improves welfare of the born, genetic modification for reduced pain sensitivity).

  - (8) introduces a value claim (flourishing lives have value) that contradicts (2)''s
  premise that most wild lives are net negative; if most lives are net negative, then
  (8)''s "flourishing animals" is a different scenario. So (8) equivocates on the
  empirical picture: you can''t simultaneously hold that wild lives are overwhelmingly
  net-suffering (2) and that a world with wild animals contains valuable flourishing
  lives whose loss counts against extinction (8) — unless you specify proportions.


