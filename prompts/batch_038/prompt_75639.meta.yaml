  I''m reporting it because I could not decide who was right at any given stage, and
  I''d like a careful adjudication.


  The exchange began with the skillful-means case that everyone uses: the bodhisattva
  who, as the captain of a merchant ship, discovers that one passenger intends to
  massacre the five hundred merchants aboard, kills him preemptively, and accepts
  the resulting bad karma and hell rebirth on himself. Julian opened by saying this
  settles the interpretive question — the captain compares one life against five hundred
  and chooses the greater aggregate good, and the tradition not only permits but praises
  the calculation, so we have an explicit act-consequentialist permission inside the
  corpus. Meera replied that the case proves nearly the opposite: nothing in a maximizing
  calculus requires the captain to absorb the karmic cost himself, so the story''s
  real point is the agent-relative, self-sacrificial element that aggregation cannot
  capture — the captain does not treat the suffering as transferable across persons,
  he takes it onto his own account. Julian said self-sacrifice is no counterexample,
  since a utilitarian can praise willingness to bear costs when doing so produces
  the best outcome, and accepting a hell rebirth is instrumentally rational if it
  saves five hundred lives plus spares the bandit a worse fate. Meera''s response
  was that "instrumentally rational" only makes sense if the good being promoted is
  agent-neutral, whereas the captain reasons as this agent about this deed he will
  have to own, which is precisely the separateness of persons that the no-self doctrine
  denies — so the tradition cannot be coherently described as maximizing across persons.


