  Kant on animals: indirect duties view. Subtle points:

  - Kant: animals lack apperception/self-consciousness ("I"-thinking), hence are not
  persons, hence have only relative value as means; we have no direct duties to them,
  but cruelty to animals dulls our sympathy, which is a disposition useful for duties
  to humans — so we have indirect duties regarding animals.

  - Subtle mistakes students make: (1) saying Kant thought animals have no moral standing
  at all — actually the wrongness of cruelty is real but derivative; (2) attributing
  to Kant the view that animals lack sensations or can''t suffer — Kant definitely
  thought animals feel pain; (3) confusing Kant''s criterion (self-consciousness/rationality)
  with the possession of concepts; Kant did think animals have representations and
  even some analogue of reasoning; (4) claiming Kant''s indirect duty view entails
  that we may treat animals however we like provided it doesn''t harm humans — a common
  but hasty inference; Kant does think there are constraints on how the indirect duty
  works; (5) attributing the "marginal cases" objection to Kant himself; (6) saying
  Kant''s position is speciesist because it''s based on species membership rather
  than capacities — actually it''s capacity-based, which is a different charge; (7)
  confusing Kant''s later Lectures on Ethics / Metaphysics of Morals statements; the
  "analogy" claim — Kant says animals are analogues of persons (analogues of humanity),
  which grounds the indirect duty. That''s a key subtlety: in the Lectures Kant says
  animals are "analogues of humanity" and our duties to animals are "analogues of
  duties to man". A student might miss that.

  - Another subtlety: Kant''s view that cruelty to animals violates a duty to oneself
  (to cultivate sympathy), not a duty to others. Students often say it "harms other
  humans" generally, whereas Kant''s more precise claim is that it weakens a natural
  predisposition that helps us fulfil our duties — a duty to oneself.


  Also a common student error: claiming Kant denied animals any inner life or that
  they are automata (Descartes'' view) — misattributing Descartes to Kant.


