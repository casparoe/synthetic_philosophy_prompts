  ---


  I am the TA for a second-year philosophy of mind course. One of the short-answer
  questions on the final exam was worth 25 marks, and I need to grade a particular
  response. I would rather not influence your assessment, so I have deliberately said
  nothing below about what I make of it myself.


  The exam question:


  (a) State Chalmers''s distinction between the easy problems and the hard problem
  of consciousness. (b) Explain why he thinks a functional or mechanistic account
  cannot close the gap. (c) Set out one physicalist reply to his case and say whether
  you think it succeeds.


  The student''s response:


  "Chalmers divides the problems of consciousness into easy ones and a hard one. The
  easy problems concern function: how we discriminate stimuli, integrate information,
  focus attention, and report on our own mental states. They are called easy not because
  they are simple but because we know what a solution would look like — a mechanism
  that performs the relevant function. The hard problem asks why any of this is accompanied
  by experience: why there is something it is like to be a subject running those processes.


  Chalmers thinks functional explanation cannot solve the hard problem because functions
  are characterized purely by causal and relational structure, and for any mechanism
  we specify we can still ask why it feels like anything to run it. His support is
  the zombie case: we can coherently conceive of a system functionally identical to
  a conscious person but with no experience whatsoever. Since conceivability is a
  good guide to possibility in this domain, the functional facts do not metaphysically
  determine the phenomenal facts.


  The knowledge argument is really the same argument in a different costume. Nagel
  made the point first with the bat: a complete physical description of a bat''s sonar
  system would still leave us ignorant of what it is like to be a bat, so the physical
  description is incomplete. Chalmers repackages this as the hard problem. Block''s
  distinction between phenomenal consciousness — raw feel — and access consciousness
  — information available for reasoning and verbal report — is Chalmers''s device
  for isolating the hard problem from the easy ones, since access consciousness is
  the easy part and phenomenal consciousness is the hard part.


  One physicalist reply is the ability hypothesis: what Mary gains when she leaves
  the room is a new skill rather than a new fact, so physicalism survives the knowledge
  argument. Chalmers himself offers this reply, and it seems fairly convincing to
  me, but only so far as the knowledge argument goes. It does nothing about the zombie
  case, where the issue is not what anyone knows but that a functional duplicate could
  lack experience altogether. So the hard problem stands."


  Please grade the response out of 25 and write the comments that justify the grade.
  I want a point-by-point assessment rather than a general impression: go through
  the response in order, say which claims are accurate and which are not, and for
  anything you take to be an error, explain precisely what is wrong with it and what
  the correct account is. Where the response is merely imprecise rather than mistaken,
  say so and distinguish that from a real error. Finish with the mark and one or two
  sentences on what the student should focus on when reviewing.


