  I am preparing a position paper for a workshop on religion and public institutions
  and would like an audit of my commitments before I circulate it. I am not asking
  for background on the arrangements I mention — I have the facts — nor for a bibliography.
  What I want is an analysis of whether the package hangs together.


  Here is the package. I have tried to state each item as I would defend it, not as
  a slogan.


  1. The Church of England should be disestablished. That the monarch is its Supreme
  Governor, that its bishops sit in the upper house of the legislature, and that its
  canons require parliamentary approval are all indefensible. My reason is expressive
  as much as material: an established church tells the rest of us, officially and
  continuously, that one creed is the state''s own.


  2. Expressive harms are real harms. I do not think an arrangement can be defended
  merely by showing that it costs non-adherents nothing in money or opportunity. Official
  messages about who belongs are part of what citizens owe each other.


  3. Germany''s system of church tax is close to my ideal and I would defend it against
  American-style separationists. The state collects a surcharge on income tax for
  recognized religious bodies, retains a fee, and remits the rest. Membership and
  exit are registered with the civil authorities. The state does not adjudicate doctrine;
  it only administers. The arrangement is voluntary in the only sense that matters
  — exit is always legally available and never punished by the state — and it frees
  the churches from dependence on wealthy donors and on the emotional market of fundraising.


  4. The state should never make determinations about which bodies are religions,
  how orthodox they are, or where one tradition ends and another begins. Classification
  is itself a theological act and the state has no business performing it. This is
  a principled commitment, not a pragmatic one.


  5. France''s separation of church and state in 1905 was right in principle, and
  Alsace-Moselle''s exemption from it is an anachronism that should be ended. But
  the 2004 prohibition on conspicuous religious symbols in public schools, and the
  more recent legislation on "separatism," overreach badly. The state has no business
  policing what individual pupils wear, and the republican argument that the school
  must be a neutral space is being used to justify burdening precisely those who are
  least able to exit.


  6. The American ministerial exception is correct. A church must be free to select
  and dismiss the people who speak for it, including on grounds of doctrine and conduct
  that a secular employer could never rely on. Courts cannot review whether the church
  was right about its own theology.


  7. State funding of faith schools in England should end. Public money should not
  support schools that give admission priority on religious grounds and teach a confessional
  syllabus, whatever the quality of their results.


  8. The exemption of churches from property tax is fine and is not a subsidy. It
  puts them in the same class as hospitals, universities, and charities; it removes
  a burden rather than conferring a benefit.


  9. Religious bodies and individuals should receive accommodations from generally
  applicable laws when the burden on their exercise is serious and the state''s interest
  can be met another way.


  10. Prison and military chaplaincy should be publicly funded. Where the state has
  itself removed a person''s ability to attend worship, it acquires an obligation
  to make that worship possible; this is a custodial duty, not sponsorship.


  11. Methodologically, since perfect neutrality is impossible, the state should aim
  at even-handedness among worldviews rather than at a wall of separation.


