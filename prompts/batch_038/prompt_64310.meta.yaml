  them to be merely poetic; a corporation''s belief is assembled out of the dispersed
  contributions of many parts and issued through a single designated mouthpiece, which
  is just the structure of a model assembled out of the dispersed contributions of
  many documents and issuing them through a single output interface; so the same attribution
  practice should be available for models, and the demand for a hedge is squeamishness
  without a principled basis.


