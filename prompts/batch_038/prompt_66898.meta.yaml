  Draft:


  "I teach an upper-level interdisciplinary seminar (roughly half philosophy majors,
  half molecular biology majors) on the claim that DNA is a code. For week four I
  want a sorting instrument rather than a lecture: a decision tree that takes a student
  who has just accepted a few uncontroversial molecular facts to a named position
  on whether the genome carries information in a literal sense.


  Start from a shared trunk of commitments everyone in the room accepts — that translation
  proceeds through a codon-to-amino-acid mapping that is largely but not perfectly
  universal; that the same sequence can be read to different effect in different cell
  types and environments; that altering a sequence reliably alters downstream products;
  that some sequences are never used at all. Build the tree out of questions about
  cases, not about labels...


  I want the tree to route on a distinction I use in the seminar and want the students
  to discover rather than be told: three candidate relations between a sequence and
  what it produces — correspondence by resemblance (the sequence as a template or
  mould, whose parts match their product part-for-part in virtue of physical complementarity),
  correspondence by convention (the sequence as a symbol, whose mapping to its product
  is arbitrary and could be otherwise), and correspondence by use (the sequence as
  a signal, whose content is fixed by what some receiver does with it and by what
  the arrangement was selected for). A student may consistently affirm more than one,
  so these should appear as separate nodes rather than as three mutually exclusive
  leaves.


  Diagnostic cases (six to eight questions total, two or three options each) must
  include at least: [synthetic codon reassignment case], [same sequence different
  tissue], [frameshift/nonsense], [silent mutation], [pseudogene], [ancestral sequence
  reconstruction / sequence that never existed], [RNA virus genome].


  Leaves: must include ... (1) strict code realism, (2) code without content (mapping
  arbitrary and receiver-dependent, but no aboutness/misrepresentation — the technical
  ''code'' of the genetic code is not the semantic ''code'' of a message), (3) causal
  specificity view (information just is the fine-grained counterfactual dependence
  of phenotype on sequence, no semantics needed), (4) teleosemantic sender-receiver
  view (DNA genuinely represents; mutations can misrepresent; content fixed by selection
  on the cellular reading machinery), (5) Dretske-style truth-requiring view and what
  it implies about mutation as ''false information'', (6) developmental systems deflationism
  / causal parity (DNA is one among many equally privileged causes; ''information''
  is metaphor), (7) Barbieri-style code biology (the genetic code is one of many genuine
  biological codes — splicing, epigenetic, etc. — so the interesting question is not
  whether DNA is a code but how many codes there are), (8) Shannon-only quantification
  (bit counts are meaningful, meaning-talk is not), plus ''unnamed'' if a combination
  has no defender. Mark ''unnamed'' leaves.


  Then: after the tree, give the logical space explicitly — the combinations of the
  three relations × truth/misrepresentation requirement × parity claim — and locate
  each leaf in it, listing unoccupied cells with a one-line diagnosis of each: is
  nobody there because the view is incoherent, because it is unstable under pressure,
  because it is unattractive, or simply because no one has written it down. Flag any
  pair of leaves your questions cannot actually separate, and say which further case
  would separate them, if one exists.


