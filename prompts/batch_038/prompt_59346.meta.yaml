  incentives are wrong, that the agent will eventually pursue something we didn''t
  ask for, and that we simply shouldn''t be letting a system like this act on its
  own. Debates stall because people are answering different questions.


  I want a two-page sorting instrument — a decision tree — that a colleague can work
  through at the start of a review and end up at a named position on what the alignment
  problem actually is, without the instrument telling them where they''re heading.


  Requirements:

  1. Nine questions (I can go to ten if a node earns its place). Each question must
  be a concrete vignette from a setting like the one above — refunds, escalations,
  a customer asking the agent to do something permitted but unwise, a quarter-end
  push on retention metrics, a discovered reward-hacking pattern in training — followed
  by two or three answer options. Each option must be a claim someone could sincerely
  endorse, not a strawman.

  2. The tree must be built from the logical space, not from a list of names. The
  distinctions I care about, in roughly this order of importance: whether the target
  of alignment is what the deployer wants, what the user wants, what a better-informed
  version of the user would want, or what is actually good; whether a failure counts
  as misalignment when the system does exactly what it was told and the result is
  bad; whether misalignment must involve the system''s own goals or dispositions at
  all, or whether only outcomes matter; whether the problem survives perfect transparency
  and corrigibility; whether the problem is distinct from a capability shortfall;
  and whether "the agent" is the right unit of analysis at all versus the surrounding
  organization.

  3. At least three questions must be cases where the system obeys perfectly and something
  still goes wrong — I need the instrument to pry apart specification failure from
  intent failure.

  4. No question text may contain the words alignment, aligned, values, intent, safe,
  safety, or goal. Those words belong in the leaf labels only. This is deliberate:
  I want people sorted by what they say about cases, not by which label they like.

  5. Leaves must include, at minimum: the narrow view on which the problem is that
  the system pursues something other than what the principal specified, and the principal''s
  specification is granted as legitimate; the view that the hard problem is specification
  rather than intent; the view that the system should aim at what the user would want
  under better information and reflection; the view that the target is what is genuinely
  right rather than any human''s wishes; the view that only outcomes matter and dispositions
  are beside the point; the view that there is no distinct alignment problem, only
  capability plus governance; and the view that the agent is the wrong unit and the
  problem sits in the organization deploying it. If the logical space yields further
  defensible leaves, include them, and give each leaf a name (use an established name
  where one exists, otherwise coin one and mark it as coined) plus one sentence on
  the most awkward commitment it carries.

  6. Mark every combination of answers the questions permit that no position occupies,
  and say for each whether nobody is there because the view is incoherent, because
  it''s unattractive, or because it simply hasn''t been articulated.

  7. Flag any pair of leaves your tree cannot actually separate with nine questions,
  and say what further question would separate them.


  Keep it usable: one page of questions, one page of leaves. Plain prose, no code.


