  ---


  I am putting together a two-page handout for a first-year graduate metaphysics seminar
  on possible worlds, and what I need is a diagnostic decision tree rather than another
  survey of the options. The problem I am trying to solve is specific: my students
  can recite the positions but cannot tell you which one they would defend, and when
  asked, they usually reproduce whichever view they read most recently. I want an
  instrument that sorts them by their commitments.


  Fixed entry point: the reader arrives having already accepted that some modal claims
  are literally true and not reducible to claims about the powers or arrangements
  of actual things — for example, that some things that do not actually exist might
  have existed. Everything downstream of that must be a real fork; no node may restate
  the entry commitment.


  Build the tree out of the logical space rather than out of a list of views. Begin
  with the axes you take to be load-bearing — I expect at least: what worlds are made
  of; whether "actual" picks out one world absolutely or merely the world the speaker
  inhabits; whether individuals are confined to a single world or span several; whether
  the full range of worlds needs an explanation or may be taken as brute; whether
  a world must be internally consistent; and whether "possible" is itself primitive,
  with worlds derivative — then state the answer space each axis allows, and only
  afterward place the positions in it.


  Requirements for the tree itself:

  - Between seven and nine question nodes. Each must be phrased as a concrete case
  or a plain question that a student can answer without knowing which leaf the answer
  leads to. No node may contain the name of a position or its proprietary vocabulary.

  - Between ten and fourteen leaves. Each leaf gets: the standard name of the position
  if it has one (if it does not, say "unnamed"), one sentence saying what, on that
  view, a world is, and a single bullet it has to bite — the most awkward commitment
  the view carries, stated so that a student who accepts the leaf has to accept the
  bullet.

  - At least three leaves must be varieties of the view that worlds are abstract objects,
  distinguished from one another only by what worlds are made of (recombinations of
  actual materials, maximal sets of truths, maximal states of affairs including unexemplified
  essences, or whatever further distinctions you think belong there). Since these
  differ in only one respect, the tree must contain a node whose sole job is to separate
  them, and you should say whether that node is answerable by someone who has not
  already chosen a side.

  - At least one leaf must dispense with worlds altogether.

  - At least one leaf must allow that individuals are strictly confined to one world
  while still making cross-world claims about them come out true, and at least one
  must allow the same individual to exist in several worlds.


  Use at least four of the following test sentences as the content of nodes, phrasing
  them as things a student is asked to react to; add others if you need them:

  - Humphrey might have won the election. (True of Humphrey himself, or of something
  suitably like him?)

  - Something might have had a property that no actual thing has and that no actual
  thing could have acquired.

  - There might have been two universes bearing no spatiotemporal or causal relation
  to each other, which together would not constitute a single world.

  - Sherlock Holmes might have existed.

  - Two worlds might have differed only in which individual plays which role, with
  everything else qualitatively identical.

  - There might have been something that exists necessarily in the sense that it could
  not have failed to exist, and what varies across worlds is only what is exemplified.


  After the tree, give me:

  1. A path key: for each leaf, the sequence of answers that leads to it, so I can
