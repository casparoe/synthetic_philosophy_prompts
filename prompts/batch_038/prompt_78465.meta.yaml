  Subtle misrepresentations:

  (a) "Turing showed that a machine ... can do anything a mathematician can do" —
  Turing proved the opposite in a sense: the halting problem shows universal machines
  have limits; and Turing''s inversion is about the mechanical sufficiency of syntax
  for *arithmetical competence*, not that machines can do everything a mathematician
  can. Also conflating the Church–Turing thesis with an unlimited claim. Dennett does
  say universal machines can, in principle, be given any computable task; but "anything
  a mathematician can do" is overreach and arguably what Lucas/Penrose-type arguments
  contest. Good subtle error.


  (b) "a computer program that passes for a fluent speaker really is a fluent speaker"
  — Dennett''s actual view is that passing the test at the right level of complexity
  is evidence, but he''s careful: the Turing Test is a practical criterion, and he
  thinks a system that passes it robustly would have to have the right internal organization.
  Slight overstatement but roughly Dennettian. Better error to focus on: "there is
  nothing that it is like to be a chess engine" — that''s fine actually.


  (c) The biggest error: "comprehension is not a distinct kind of thing — it is what
  we call competence when the competence is complicated enough and we can''t see the
  machinery." This is an instrumentalist/deflationary reading. Dennett''s actual position:
  comprehension is *not* merely a label for opaque competence; it''s a real (though
  not intrinsic) phenomenon constituted by the ability to answer counterfactual questions,
  to give reasons, to self-monitor — and in From Bacteria to Bach and Back he insists
  comprehension is a *genuine achievement* built by cranes, involving a second inversion
  ("top-down" understanding emerging from bottom-up competence). The essay''s version
  makes comprehension a matter of our epistemic opacity, which inverts Dennett''s
  point: comprehension is a property of the system (its responsiveness to reasons),
  not of our ignorance of its machinery. Actually Dennett would say: if we could see
  the machinery, we''d see comprehension, not less of it. And crucially the essay
  makes it sound like more complexity automatically yields comprehension, which Dennett
  denies — you need the right *kind* of competence (cultural cranes, language, self-models,
  "free-floating rationales").


  (d) "Dennett is therefore an eliminativist about meaning and about inner experience:
  there are no genuine beliefs, only patterns we find it useful to treat as beliefs."
  — This is the classic overstatement. Dennett denies *intrinsic* aboutness and denies
  the Cartesian theater, but he is not an eliminativist about beliefs: in "Real Patterns"
  he argues beliefs are real patterns, discernible, and their existence is as real
  as anything else — he''s a kind of pragmatist realist, not a Churchland-style eliminativist.
  Also he denies qualia as *ineffable, intrinsic, directly apprehended* properties
  but not that there is something it''s like in some sense; and he famously resists
  being called an eliminativist about consciousness ("I am not denying consciousness;
  I am denying the philosophical mythology").


  (e) "no theatre in which the show of consciousness is screened, and nothing that
  it is like to be a chess engine" — Dennett''s "Multiple Drafts" model: yes, no Cartesian
  theater. And he''d happily say nothing it is like to be a chess program. Fine.


  (f) "What survives of understanding is a predictive strategy: to say something believes
  is only to say that anticipating its behavior this way pays off." — This is a fair
  gloss of the instrumentalist strain, but Dennett adds the "real patterns" criterion:
  it pays off because there *is* a pattern there, and he''s explicit that this isn''t
  mere convenience. Also: the intentional stance isn''t the only stance, and beliefs
  are attributed holistically and ceteris paribus. Subtle.


  (g) The essay''s claim that the two inversions "together mean comprehension is not
  a distinct kind of thing" — Dennett''s actual second move is that the inversions
  *explain* comprehension''s emergence (a third inversion: comprehension without a
  comprehender produces comprehenders). In FBTBB he argues that once you have language
  and culture, comprehension genuinely appears — "top-down" is real but built bottom-up.


  Also a good audit point: the essay says "Dennett''s dismissal of the Chinese Room
  ... that just assumes the very thing at issue" — that''s a fair characterization
  of Dennett''s complaint (Searle''s intuition pump smuggles the conclusion by making
  the system unimaginably complex yet asking us to imagine it vividly). But the essay''s
  phrasing "Searle imagines a man in a room who doesn''t understand Chinese" — actually
  the man doesn''t understand Chinese, that''s Searle''s setup; fine. But there''s
  a subtlety: Dennett''s objection is not only circularity but the incoherence of
  the imagined system (the speed/complexity issue) and Searle''s ignoring of the fact
  that the system would have to have all the cranes.


  Another good point: "competence without comprehension" is a thesis about *all* life,
  including the swallow and the termite, and it is not primarily a thesis about computers;
  and Dennett''s use is double-edged — it licenses attributing "reasons" (free-floating
  rationales) to mindless processes, which is exactly what makes the eliminativist
  reading wrong: he thinks rationale-talk is not merely a courtesy.


  Also: "design without foresight" vs "design without a designer" — hmm, Dennett says
  natural selection has no foresight; but "goals" — he says the "goals" are only stances
  we adopt. Fine.


