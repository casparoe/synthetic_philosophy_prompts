  Core novel thesis: Both Malcolm and Dennett assume that a dream report stands to
  any candidate dream episode in a *matching* relation — either it matches (truthful
  report of an antecedent experience) or it doesn''t (confabulation). Malcolm notices
  there''s no way to check matching, so he dissolves the episode; Dennett notices
  that if matching can''t be fixed in advance, the episode''s content isn''t determinate
  until reported, so he relocates content-fixing to the moment of reporting. But there
  is a third relation available: *answerability without matching*. My essay proposes
  that dream reports are answerable to sleep processes in the way an improvisation
  is answerable to a score or a weather vane to the wind: the process constrains the
  report without the report''s being a copy of anything. Under this view, the question
  "did the dream occur during sleep?" is replaced by two separable questions: (i)
  what does the report answer to? and (ii) in what mode — copy, translation, elaboration,
  or invention? The empirical findings (REM-duration/report-length correlation; stimulus
  incorporation) bear on the *strength* and *mode* of answerability rather than adjudicating
