  and Urn I for black implies, by sure-thing, preferring Urn I for "red or black"
  = certain £100 vs Urn II "red or black" = certain £100 — indifference. So the violation
  of sure-thing is the inconsistency: you can''t be indifferent between the mixed
  acts while strictly preferring the known urn in both component bets.


