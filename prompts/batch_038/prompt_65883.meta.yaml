  The false presupposition: that the paradoxes survive translation to graded belief.
  In fact they *do* have a graded analogue: the lottery paradox reformulated is about
  rational high credence being closed under conjunction / the preface paradox as a
  violation of probabilistic coherence? No — actually, the graded version is coherent:
  credences obeying the probability axioms have no contradiction. But the real issue:
  the paradox is about the norm governing outright belief, and it re-emerges in graded
  form as the "problem of immodest credence"/the "Lockean thesis" issues, or as the
  fact that if you rationally believe each of a million claims with credence 0.999999,
  then... hmm. There''s a genuine tension: high credence that each of many claims
  is true, plus credence ~0 in the conjunction, is probabilistically coherent — but
  it means you''re certain-ish that at least one of your highly-confident claims is
  false, which raises the "which one?" problem and the question of whether you should
  lower your confidence in each given that you''re confident at least one is wrong.
  Also, the "preface" graded version leads to questions about whether high confidence
  is even compatible with knowing you''re fallible, and there''s a "paradox of the
  preface" for credences via Dutch books? Not exactly.


  Also, the lottery paradox isn''t really about contradiction between outright beliefs
  being resolved by degrees — the standard view (Kyburg, Foley) is that the paradox
  is about closure/rational acceptability, and moving to degrees leaves the *normative*
  question: what should guide action and assertion? Plus there''s the issue that credence
  1-1/n in each ticket losing is not consistent with... it is consistent. So the layperson''s
  "solution" is a real move (the standard Bayesian response) and the false presupposition
  is "since this works, the paradoxes are dissolved." A good answer would say: the
  graded move does dissolve the *logical* contradiction, but it leaves the substantive
  questions — why outright belief exists at all / the norms of assertion and action
  / whether high credence licenses "I know my ticket lost"? Also the lottery paradox''s
  real target includes knowledge claims: "you can''t know your ticket lost" vs "you
  can know the sun will rise" — the Hawthorne-style knowledge-first analysis. Also
  there''s a residual problem: with 1/n credence in each ticket winning, an agent
  who believes "at least one of my high-credence claims is false" is in a weird position
  regarding assertion and regarding the value of evidence (e.g., you should pay to
  learn which ticket wins?). And the preface''s graded version: it''s coherent to
  have high credence in each and low in the conjunction, but then it''s rational to
  be certain that you''re wrong about something, which conflicts with the intuition
  that high confidence in each was earned. Hmm.


