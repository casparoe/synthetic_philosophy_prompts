  Draft argument (layperson, polished, formal-ish):


  "I''ve been arguing with myself about whether self-binding can ever be rational,
  and I''ve ended up with a chain that seems to show it can''t — but the conclusion
  is absurd, because I''ve just paid off a mortgage early and my town has a charter
  that can only be amended by a two-thirds vote. Here''s the chain:


  (1) A commitment device only works if, at the moment of temptation, it actually
  prevents you from doing what you then most want to do.

  (2) Whatever you most want to do at the moment of choice is what it''s rational
  for you to do at that moment — if it weren''t, you''d want something else.

  (3) So a working commitment device always makes you act irrationally, by your own
  lights at the time.

  (4) The earlier you that set it up was acting on a prediction about the later you;
  but the later you has direct access to how things actually feel, so the later you
  is the better judge.

  (5) Therefore the earlier you has no standing to overrule the later you, and setting
  up the device was either an error or an act of aggression against a person who is,
  at the crucial moment, better informed.

  (6) The same applies to constitutions: a generation that entrenches rules is binding
  people who are better placed to judge their own circumstances, so entrenchment is
  always either futile (if the future majority can repeal it) or tyrannical (if it
  can''t).

  (7) But obviously I should keep paying down the mortgage, and obviously a two-thirds
  amendment rule isn''t tyranny.


  So where does it go wrong? I can feel that (2) is doing too much work, but if I
  deny it I seem to be saying that people can be wrong about what they want, which
  sounds worse."


  That''s good. The subtle flaw: (2) equivocates between "most want, all things considered,
  at that moment" and "most want, on reflection, including one''s own higher-order/endorsed
  preferences"; plus (1)''s "prevents" vs "changes the options/payoffs" — a commitment
  device often works by changing what you want at the time (by making the tempting
  option unavailable, the later self''s preferences adapt) or by adding costs, so
  (1) is a false characterization. Also (5) assumes a person-at-a-time normative sovereignty;
  the cost of rejecting it is a view of personal identity/agency across time (Parfitian
  reductionism supports the "later self as separate person" reading, while a "planning
  agent" view — Bratman — supports cross-temporal authority). And (6) equivocates
  between the demos across time and the "dead hand" objection, plus ignores that entrenchment
