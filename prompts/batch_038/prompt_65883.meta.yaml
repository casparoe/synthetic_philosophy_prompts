  I''m drawn to Type B on the Principal Principle, because there''s a great "proves
  too much" structure available: an argument from the Principal Principle to absurdity
  — e.g.:


  "(1) Lewis''s Principal Principle says: if you know the objective chance of A is
  x, and your remaining evidence is admissible, your credence in A should be x. (2)
  The chance of a fair coin landing heads is 0.5. (3) So a rational agent who knows
  this must have credence 0.5. (4) But suppose I also learn from a reliable source
  that the coin landed heads — then the evidence isn''t admissible, and my credence
  jumps to 1. (5) Hence whether evidence is admissible depends on whether it bears
  on the outcome... (6) But ''admissibility'' is defined only by whether the evidence
  is about the chance or about the outcome, and the very notion of the outcome-bearing
  evidence makes the Principle circular: chances are supposed to be what rational
  credence tracks, yet which evidence counts as admissible depends on what you already
  know about how the world went. (7) Therefore either the Principal Principle is circular,
  or rational credence isn''t determined by chance at all, i.e., objective chance
  doesn''t exist."


  That''s messy. Better known "proves too much" in this domain: the argument that
  the Principal Principle + the possibility of inadmissible evidence → any agent with
  credence not equal to chance is irrational → but we never know chances → so the
  PP is vacuous, i.e., it constrains nothing. Or: the "Big Bad Bug" (Lewis 1986):
  if you have evidence about the future pattern of outcomes that bears on chance...
  Actually here''s a nice one:


  Argument that the Principal Principle proves too much: (1) The PP says rational
  credence should match known objective chance. (2) Humean/best-system accounts say
  chance supervenes on the whole pattern of actual outcomes, including future ones.
  (3) So my evidence about particular outcomes (e.g., this coin''s next flip being
  heads) is evidence about chance. (4) Hence such evidence is inadmissible per the
  PP''s own proviso. (5) But nearly all ordinary evidence is about particular outcomes.
  (6) So the PP forbids conditioning on almost any ordinary evidence, which would
  freeze rational credence at chance forever, no matter what happens — after a billion
  heads in a row, the credence in the next heads must remain whatever the chance says.
  (7) That''s absurd, so either chance doesn''t supervene on the actual pattern, or
  the PP is false.


  Where''s the flaw? Step (6): inadmissibility doesn''t mean you must ignore the evidence
  entirely; Lewis''s PP applies conditional on admissible evidence, and the correct
  formulation is that your credence function should be such that C(A | chance info
  & admissible E) = chance. Inadmissible evidence changes the *chance* itself (via
  conditionalizing on it), and Lewis''s fix: you should conditionalize on the inadmissible
  evidence, and then the chance itself changes — i.e., the "C(A | E, Ch(A)=x) = x"
  fails but only because E shifts the chance; the updated credence should match the
  updated chance. Lewis''s response to the Big Bad Bug (and Hall''s "correcting the
  bug"): chance of A given inadmissible E should be understood as conditional chance
  Ch(A|E), and the principle revised. Also step (3)-(5): the evidence about a single
  outcome is inadmissible only if it bears on the chance; but Lewis''s criterion of
  admissibility is about whether the evidence is "about the chance" or is obtained
  in ways that reveal the outcome — a single flip outcome does bear on the Humean
  chance (slightly), so it''s technically inadmissible, which is the bug. So the flaw
  is at (6): the PP is not a rule about ignoring evidence, it''s a constraint on credence
  conditional on admissible evidence; with inadmissible evidence, the rational response
  is to conditionalize on it and then defer to the *conditional* chance. The cost:
  you need an account of conditional chance and you must accept that chance is partly
  a function of the total pattern — plus you owe an explanation of why a billion heads
  doesn''t change the chance of a fair coin''s next flip (the chance isn''t inferred
  from frequencies; frequencies are evidence about chance, but Lewis holds the chance
  is fixed by the best system, and a billion heads in a fair coin series is possible,
  giving some evidence but the best system may still say 0.5).


  This is a genuinely meaty argument, and a model without web access can reason about
