  \ definition of program equilibrium requires that each program is a best response\
  \ to the opponent's program given the code, and there's a fixed point / self-reference\
  \ issue handled by treating code as strings. Also: program equilibrium is defined\
  \ for a fixed pair of programs; the \"no infinite regress\" comes from the fact\
  \ that you can't call the opponent's program with its own source as input recursively\
  \ — actually in Barak-Halpern you can't simulate an opponent that simulates you,\
  \ in general; there's a \"quine-like\" restriction. Hmm.\n\nAnother good false presupposition:\
