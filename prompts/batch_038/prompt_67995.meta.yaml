  If the crux in 4 is fatal, the honest conclusion is not that the inefficacy objection
  wins but that the act-slot picture is inescapable: contribution-type wrongs must
  be analyzed in terms of what individual acts do, and the non-causal replies are
  best read as claims about the character or meaning of acts rather than about a distinct
  bearer of wrongness. That is a deflationary result, and it costs the participation
  view its reason for existing.

