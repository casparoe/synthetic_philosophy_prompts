  ---

  The Act-Slot Picture: Why the Inefficacy Objection Is a Category Error That Refuses
  to Stay Dead


  1. The debate, as usually staged.

  Against the claim that individual consumption or emission is wrong, the inefficacy
  objection says: this act of mine makes no difference to anyone''s welfare, and an
  act that changes nothing cannot be wrong. Replies come in two families. Causal replies
  deny the premise: because production and distribution systems respond in discrete
  increments, there is some probability that my purchase is the one that triggers
  an order, so my expected marginal harm is positive, and proportionate to the aggregate
  harm divided among the number of contributors. Non-causal replies deny the relevance
  of the premise: wrongness here is a matter of integrity, complicity, virtue, or
  of what I would be doing together with others if we acted jointly.


  2. A shared picture.

  Both families, I''ll argue, accept what I want to call the act-slot picture. On
  this picture there is a fixed slot — the individual act token — and the whole argument
  is over what belongs on the card inserted into it: expected consequences, or expressive
  content, or a maxim, or a disposition. Because the two families write different
  things on the card, the disagreement looks like a substantive moral dispute. But
  it is downstream of a question nobody in the debate asks, which is whether the individual
  act token is the right bearer of the wrongness at all.


  3. The proposal: participation first.

  In paradigm contribution cases, wrongness is borne primarily by a participation
  relation holding between an act and a set of acts that jointly produces harm, and
  only derivatively by the act. The inefficacy objection is then a category error:
  it demands of an act that it carry a property that belongs to a relation. That diagnosis
  explains something otherwise puzzling — why the debate has been so stable. Neither
  side can answer the other because each is offering a card for a slot the other thinks
  is the wrong slot.


  But the view is immediately threatened by promiscuity. Participation is cheap: I
  participate in sets that fund things I oppose, that sustain practices I regret,
  that will outlive me. So the account needs criteria for admissible sets. I propose
  three.

  (i) Non-gerrymandering: the set must be specifiable without reference to the harmfulness
  of the act whose wrongness is in question. Otherwise participation is just consequences
  with a new name.

  (ii) Avoidability: membership must be escapable at a cost that isn''t unreasonable,
  so that the relation says something about the agent''s situation rather than about
  the world''s.

  (iii) Monotonicity: the harm must be an increasing function of the number or proportion
  of members, which lets us say that more members means more harm without claiming
  that any one member causes it.


  4. The crux, which I cannot currently resolve.

  Criterion (iii) is where the trouble is. If harm is a monotone function of the participation
  number, and that number is what it is whether or not I join it, then my participation
  does not change the harm — and the account has rebuilt, one level up, the exact
  structure it was meant to escape. The inefficacy objection returns as a set-level
