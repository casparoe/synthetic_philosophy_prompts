  sensitivity of the relation rather than of the outcome: fewer members, less harm,
  and my act is among those that make the number what it is. But this is disquietingly
  close to the sorites-style truism that my act is part of the aggregate, which is
  true of any act with respect to any aggregate it belongs to. So either the proposal
  is empty, or it is covertly the threshold story again, with the thresholds relocated
  from distributors to sets.


