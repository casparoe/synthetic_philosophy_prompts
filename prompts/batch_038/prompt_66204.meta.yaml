  Let me construct the exchange:


  Two people: Dana (a philosopher of physics) and Eli (an epistemologist). Argument
  about whether the Principal Principle can be the whole story about rational credence
  in chance-governed setups.


  Round 1: Dana says PP: if you know the chance of A at t is x, your credence at t
  in A should be x, absent inadmissible evidence. So chance is the thing to defer
  to; frequencies are just evidence about chances.


  Round 2: Eli says: consider you''re told the chance of heads on the next toss is
  0.5, and you also see that the coin landed heads on each of the last 1000 tosses.
  The streak is admissible evidence (it''s about the past). Conditionalizing on it
  should raise your credence in heads. So PP and conditionalization conflict: PP says
  0.5, conditionalizing on the streak says higher. So PP can''t be a complete rule
  — you need a prior over chance hypotheses, and then PP does no work.


  Round 3: Dana: no, the conflict only arises if you think chances are independent
  of the streak. If chances are Humean (best-system), a long-enough streak is itself
  evidence that the chance isn''t 0.5, so conditionalizing on it just updates your
  credence about the chance, and PP then tells you to match the new chance-credence.
  No conflict — just do expected-chance deference.


  Round 4: Eli: that''s the undermining problem in reverse, and it''s fatal. If frequencies
  can undercut chances, then there are futures — perfectly possible ones, where the
  coin lands heads 10^6 times in a row — that, on the Humean view, would make it the
  case that the chance was never 0.5. But PP plus conditionalization says that, if
  such a future obtained, you should have had credence near zero in the chance hypothesis
  you were told to defer to... Actually the real undermining problem: the Humean chance
  hypothesis assigns nonzero probability to sequences that would, if they occurred,
  falsify that very hypothesis. So the theory tells you to conditionalize on evidence
  that would destroy the theory — but you can''t rationally plan for that. And PP
  is supposed to be a priori, not empirical; if chance hypotheses can be undermined,
  PP''s authority is contingent.


  Round 5: Dana: Fine — restrict PP to non-undermining worlds, or use Lewis''s "New
  Principle" (conditionalize the chance hypothesis on your total evidence, i.e., defer
  to chance conditional on your background evidence). That fixes undermining: you
  should match cr(A | chance hypothesis ∧ your evidence), not cr(A | chance hypothesis).


  Round 6: Eli: but then PP isn''t telling you anything about chance at all — it''s
  just a theorem of probability (conditionalizing on a chance hypothesis is deference
  to conditional probability). The content is gone; you still need an independent
  account of why you should have the credences in the chance hypotheses you do, which
  is where all the work is, and there the "principal principle" is doing nothing.
  Also, on the New Principle, an agent who knows the chance is 0.5 and knows the streak
  defers to the chance-conditional credence, which may be way off 0.5 — so PP has
  stopped being a principle about chance and become a principle about your evidence.


