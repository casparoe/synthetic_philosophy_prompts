  Draft:


  ---


  I referee a monthly reading group and last week two of my colleagues got into it
  over the Principal Principle and I never managed to settle it, so I''m passing it
  to you.


  Setup so you know what they were arguing about: the coin machine in the corner of
  my office dispenses a coin whose chance of heads on the next toss, we''re told by
  the manufacturer and by our best physics, is exactly 1/2. Dana is a philosopher
  of physics, Eli is an epistemologist. Here''s roughly how it went (I''m compressing
  but I don''t think I''m putting words in anyone''s mouth):


  1. Dana: chance is what you defer to. If you know the chance of A is x, and the
  rest of your evidence is "admissible" — nothing about the future, no weird self-referential
  stuff — then your credence in A should be x. Frequencies only matter as evidence
  about what the chances are.

  2. Eli: then run the case. You know the chance is 1/2, and you also know the machine
  has given heads on each of the last thousand tosses. That fact is about the past,
  so it''s admissible. Conditionalizing on it clearly pushes your credence above 1/2.
  So your two norms give different answers in the same case, and the Principal Principle
  can''t be the whole story — it has to sit on top of a prior over chance hypotheses,
  and once you have that prior the Principle isn''t adding anything.

  3. Dana: it isn''t a conflict, it''s just an update. If chances are what the best
  systematisation of the mosaic says they are, a thousand straight heads is evidence
  that the chance was never 1/2. So conditionalizing on the streak lowers your credence
  in the chance hypothesis, and then the Principle tells you to match the new numbers.
  Everything is consistent.

  4. Eli: that''s exactly the disaster, not the rescue. On your view, the chance hypothesis
  itself has to assign positive probability to futures which, if they happened, would
  show the hypothesis was false. So the theory instructs you to conditionalize on
  evidence that would destroy the theory. And the Principle was supposed to be a priori
  — a bridge rule connecting chance to credence — but if chance hypotheses can be
  undermined by ordinary history, its authority is hostage to which way the world
  went.

  5. Dana: Lewis saw this and endorsed an amendment — don''t match your credence to
  the unconditional chance, match it to the chance conditional on the rest of your
  evidence. That kills the undermining problem outright, because you never defer to
  what the chance says simpliciter.

  6. Eli: it kills it by deleting the Principle. What''s left says: your credence
  in A should equal your conditional credence in A given the chance hypothesis and
  your evidence — which is just a theorem of the probability calculus. There''s no
  bridge from chance to credence anymore, and you still owe an account of why your
  credences in the chance hypotheses are what they are. That''s where all the content
  was, and the Principle has nothing to say about it.

  7. Dana: that charge proves too much. Conditionalization itself is "just a theorem"
  once you fix a prior, and nobody thinks that makes it empty. What the Principle
  does is tell you that among the hypotheses in your prior, the chance hypotheses
  are the ones with this special claim on you — that''s a substantive constraint,
  not a tautology.


