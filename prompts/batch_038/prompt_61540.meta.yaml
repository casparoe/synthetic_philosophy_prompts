  Background on Williams (accurate, from memory — careful, no verbatim quotes):

  - "Internal and External Reasons" (1979, in Moral Luck; also in Reason and Motivation).

  - Internal reasons: A has a reason to φ only if A could reach the decision to φ
  by a sound deliberative route from A''s actual motivational set S (the "subjective
  motivational set," which includes not just desires but dispositions, evaluations,
  attitudes, patterns of emotional reaction, loyalties, projects — Williams stresses
  S is broader than raw desires).

  - Sound deliberative route includes: means-end reasoning, general imaginative deliberation
  (considering new possibilities), correcting beliefs by reasoning from other beliefs,
  unifying particular motivations by principles, and — importantly — "imagination"
  exercised in deliberation (the novel, the vivid presentation of possibilities).
  Williams says the sound deliberative route is a somewhat vague notion.

  - External reasons statements: "A has a reason to φ" where A has no element in S
  that could be served by φ-ing, even after sound deliberation. Williams argues such
  statements are false — his famous line (paraphrase): if there is no motivation for
  A to φ in any way that could be rationally produced, then "A has a reason to φ"
  must be false; the external reasons theorist must either admit the statement is
  false or explain what it means. He also discusses the "wrong explanation" objection:
  external reasons theorists say the agent is to be blamed for lacking the motivation,
  and that blame presupposes a reason — Williams responds with the "explanatory" point:
  blaming someone for lacking a motive makes sense only if that motive could have
  been rationally produced by deliberation from what they already have, i.e., only
  if an internal reason exists. He mentions the case of "the person who beats his
  wife" and the Owen Wingrave case (from Henry James''s story) — yes! Williams uses
  the example of Owen Wingrave, a young man whose family presses him to go into the
  army, saying it is his tradition, his duty to family; Williams says Owen simply
  has no motive to be a soldier, and the family''s insistence that he has a reason
  to be a soldier seems to be either false or unintelligible. That''s a memorable
  detail I can safely reference (not quoted).

  - Also: Williams''s internalism is often criticized as making reasons too subjective;
  standard externalist replies (McDowell: reasons as facts apprehended by a virtuous
  person''s sensitivity, "non-psychological" conception; Scanlon: normative reasons
  are about what counts in favor; Korsgaard; also the "rigidification"/"counterfactual"
  replies: the agent''s reason depends on a counterfactual S — e.g., Sobel''s or Rosati''s
  arguments; the "would have reason after ideal deliberation" — Smith''s rationalist
  version of internalism which Williams thinks collapses into externalism or is not
  really internalism; Williams says Smith''s view ("fully rational self") is externalist
  because it appeals to a hypothetical agent).

  - Important subtlety: Williams denies that internalism implies that agents can''t
  be criticized; also the "relative to a deliberative route" and "the agent''s S at
  the time" issues; also the problem of "too many reasons" / "bad deliberation" —
  internalism says a reason exists if sound deliberation from S would produce the
  motivation; but sound deliberation can produce motivations in weird ways; also the
  problem of *false beliefs in S*: Williams says the agent''s S may include false
  beliefs and correcting them is part of sound deliberation, which is why the "he''d
  drink the petrol if he believed it were gin" case is handled (that''s actually Williams''s
  famous example: the man who desires a gin and tonic; if the glass contains petrol
  and he believes it''s gin, drinking it isn''t what he has reason to do — because
  sound deliberation would correct the false belief). Yes: Williams''s example is
  a man who wants a gin and tonic; there is a glass containing petrol which he believes
  to be gin; internal reasons are not simply about actual desires, because the sound
  deliberative route includes correcting false beliefs. Good — this shows the machinery
  handles the "desire for petrol" objection.


