  - Define S* as the set of motivations reachable from S by sound deliberation.

  - Internalism is usually read as: reasons = f(S*) where S* is the closure of S under
  sound deliberation.

  - The novel claim: the debate turns on three distinct "expansion operators" that
  could be built into S*: (1) *informational* expansion (correcting false beliefs,
  adding true non-normative beliefs — everyone accepts this); (2) *imaginative* expansion
  (vivid representation of possibilities not currently conceived — Williams accepts
  this, and it''s the sneaky one); (3) *evaluative* expansion (adopting the evaluative
  perspectives of others / generalizing, i.e., a route that can generate entirely
  new ends, e.g., by recognizing a pattern in one''s own concerns and abstracting
  to a principle). The asker argues that once you admit (2) and (3), S* can be made
  to contain almost anything — including a motivation to φ for agents who currently
