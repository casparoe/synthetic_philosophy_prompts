  rationale if humans never existed. Similarly, a medieval shipwright''s hull shape
  has a rationale about wave resistance that he couldn''t state, and the rationale
  was "discovered" by a hydrodynamicist 500 years later. So reasons without reasoners.

  - Camp B (me / "no free-floating reasons"): "rationale" is an honorific we bestow
  after the fact; to say there''s a rationale is to say that under some description,
  a certain outcome is explained and would have been produced by a competent designer.
  The rationale is always an abstraction from actual design activity or from the intentional
  stance we take toward a system; without reasoners there''s no normativity, only
  regularities plus our retrospective gloss. The word smuggles in a subject: "reason"
  is a role, and roles need occupants.


  Cruxes to name:

  1. Whether explanatory indispensability licenses ontological commitment here — i.e.,
  does the fact that we can''t explain the convergence of unrelated designs (wings
  of insects/birds/planes; the repeated invention of the arch; the fact that different
  termite species build mounds with the same ventilation solution) without positing
  a shareable rationale show that rationales are real, or does it just show that "rationale"
  is a useful compressive description of a constraint structure (a fixed fitness landscape
  / physics).

  2. Whether the notion, if accepted, generalizes too far: if rationales can float
  free, why not intentions, preferences, mistakes? Is there a "free-floating mistake"?
  A design can be wrong about a rationale nobody had. Camp B says: if you can''t have
  free-floating beliefs/desires, singling out rationales is arbitrary; camp A says
  the whole point is that rationale is the one intentional-ish item that survives
  detaching from the agent because it''s fixed by the environment/physics.

  3. Normativity: does a rationale have authority over anyone? If a rationale nobody
  has is still a reason, whose reason is it, and can it be a reason for action for
  a being that has never considered it? Camp A: yes, in the same way a mathematical
  proof nobody has read is still a proof. Camp B: no — a proof nobody has read is
  at best a proof-schema, and "reason" needs a subject for whom things count.

