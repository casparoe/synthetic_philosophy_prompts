  Injected novel machinery (the "new ideas"): the asker''s three-rung distinction:

  1. Descriptive/semantic looping: the label supplies vocabulary; people come to describe
  experience in its terms; nothing about the underlying phenomenon changes, only its
  reporting.

  2. Behavioral looping: the label changes conduct, attention, self-interpretation
  — people actually start having the experiences (alters proliferate in the therapy
  room).

  3. Evidential/detection looping: the label changes the classifiers'' threshold and
  the record-keeping, so the data that confirm the kind are partly produced by the
  search for it.


  And the asker''s worry: rung 1 can be mistaken for rung 3 because if descriptions
  change, the archive changes even if nothing else does; and rung 2 can look like
  rung 3 to a skeptic. Also: only rung 3 is supposed to threaten realism, and only
  rung 2 is supposed to make looping a causal power of the kind itself. Ask: can the
  MPD episode be decomposed along these rungs, and does the decomposition survive,
  or does it collapse?


  Second injected device: amplification vs damping. A looping effect that explains
  an epidemic needs positive feedback (media → patients → clinicians → publications
  → media), but epidemics end; the theory as usually stated has no account of damping.
  In the MPD case, the damping candidates: patient retractions, lawsuits, the memory-science
  consensus about suggestibility, the loss of insurance/reimbursement support for
  long-term alter-integration therapy, professional embarrassment, and the renaming.
  Ask which of these are internal to the loop (the loop''s own output) and which are
  external shocks, and whether a theory that needs external shocks to explain the
  decline is doing much work.


  Third: the direction-of-fit question — what would have to be true for the episode
  NOT to be a looping effect? Is the hypothesis falsifiable, or does it just redescribe
  any culturally contagious phenomenon? Ask for a counterfactual test.


  Fourth: a specific puzzle to explain — why the diagnosis survived the epidemic.
  MPD-the-epidemic collapsed but DID-the-category persisted and even regained prevalence
  claims; the trauma model was reargued successfully by a clinical community; and
  the same category later acquired a new looping cycle via short-form video. Does
  looping theory predict that a kind can survive the discreditng of its first loop?
  What does that say about whether the loop was ever about the kind''s reality?


  Fifth: the "who is the actor" mapping requirement — ask to be disciplined: the players
  (patients, clinicians/therapists, the DSM committees, publishers/film, lawyers and
  insurers, memory researchers, the press, and later patient communities), what each
  was responding to, and where the classification entered each of their decision problems.


