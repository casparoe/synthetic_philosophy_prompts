  ---

  I teach the duties-of-rescue week in a big intro ethics course, and this year I''m
  screening two clips from Spielberg''s Schindler''s List — the ghetto liquidation,
  where the camera keeps finding the little girl in the red coat, and the last reel,
  where Schindler falls apart after the war and works out that his car would have
  been worth ten more people and his gold pin two more. The reading I''ve assigned
  is Singer''s pond case, and the problem is that my students come out of the clips
  admiring Schindler rather than indicted by him, which is the exact opposite of what
  Singer wants the argument to do.


  So here''s what I want: a reading of the film through Singer''s rescue argument,
  taking both seriously. I''ve got a half-formed hunch I''d like you to pressure-test.
  It''s that the film and the argument agree about the conclusion but get there by
  moving in opposite directions. Singer''s whole move is to strip out the features
  that make the pond case gripping — proximity, identifiability, being the only bystander
  — and insist they''re morally irrelevant; the distant child is supposed to count
  exactly as much as the one in front of you. Spielberg does the reverse: he makes
  thousands of anonymous, distant, statistical deaths feel obligatory by isolating
  one identifiable child in a bright coat. So the film is a machine for converting
  statistical lives into identifiable ones, and Singer is a machine for converting
  identifiable ones into statistical ones. If that''s right, the film isn''t an illustration
  of the argument, it''s a rival technology for the same end, and I want to know whether
  it''s a better or a worse one, and what that says about whether Singer''s "the numbers
  don''t care about distance" move can ever actually motivate anyone.


  Then the harder part: the film seems to me to break the pond case''s assumptions
  in at least two ways, and I want you to say whether these are fatal or just complications.
  First, in the pond case rescue is a one-off and cheap relative to what you have;
  for Schindler every rescue is a purchase, a bribe, a slot on a list — rescue is
  rationed, so saving one person is genuinely taking a slot from someone else, and
  the film spends a lot of time on the horror of compiling that list. Singer never
  really handles the triage version of his own case, or if he does I''ve missed it.
  Second, the ending breakdown looks to me like a dramatization of the demandingness
  objection from the inside — Schindler has already given everything, and the film''s
  final moral note is that it wasn''t enough, which is a much bleaker claim than anything
  in the essay; it''s closer to Susan Wolf''s point about moral saints, except Schindler
  doesn''t look like a person with a life worth living. Tell me whether the film is
  arguing that the demand is bottomless, or just showing a man with survivor''s guilt,
  and how you''d know the difference from inside the film.


  Things I don''t want: no Arendt / banality-of-evil detour, no Adorno-on-poetry-after-Auschwitz,
  and no list of further reading — the students have the two texts. Also don''t tell
  me the film is "problematic" as a Hollywood product and stop there; if you think
  the aesthetic choices undercut the moral content, say which choices and how. Point
  me to specific scenes by describing them (no quotes — I can''t check them and neither
  can you), say plainly where the film resists the Singerian reading and the honest
  critic has to admit it, and end with one thing the film shows about rescue that
  the argument, on its own, structurally cannot show.


