  Which combination is best? The type is "short story." The instruction says prompts
  should inject niche ideas so models can''t regurgitate. I think the most fruitful
  and least-trodden combination is Harsanyi''s aggregation theorem with a short story.
  Almost no science fiction exists about Harsanyi''s theorem (unlike Boltzmann brains,
  phlogiston, NIMBYism). And it''s technical enough that a story will have to be in
  the weeds, but the ideas are standard enough that a well-trained model will know
  Harsanyi''s theorem, its assumptions (Pareto indifference/weak Pareto, individual
  and social expected-utility rationality over the same set of prospects, and sometimes
  anonymity/symmetry), its conclusion (social utility is a positive linear combination
  of individual utilities, i.e., utilitarianism), and the objections (interpersonal
  comparison not licensed by the theorem; the sure-thing/separability requirement
  on social preferences is a substantive ethical assumption, not a technical one —
  Mongin''s point; the problem of unbounded utility and people with lexicographic
  or non-Archimedean preferences; Sen''s objection about adaptive preferences and
  the informational basis; the ex ante vs ex post paradox; the "utility monster";
  the anonymity requirement vs. weighting; the theorem being vacuous if there are
  no social lotteries — Weymark''s critique that Harsanyi''s theorem establishes "utilitarianism"
  only about the aggregation of expected utilities over lotteries, which need not
  correspond to any ranking of actual outcomes, and that Harsanyi''s own later "impartial
  observer" argument does the real work and is not the theorem).


  Also nice: the theorem''s assumption set includes that the social preference also
  satisfies the von Neumann-Morgenstern axioms, which is exactly the ethical content;
  if you drop it, you can have non-utilitarian aggregation. And the "veil of ignorance"
  derivation by Harsanyi vs Rawls''s maximin behind the same veil — Rawls said Harsanyi''s
  derivation requires the parties to be expected-utility maximizers with equal probability
  of being anyone, plus a "risk-loving/risk-neutral" attitude; Rawls argued that under
  uncertainty without probability info you should maximize the minimum. So a story
  could have a committee behind a literal veil (memory-wiped or a lottery that assigns
  you a body) where one character is a Harsanyian expected-utility maximizer and another
  is a Rawlsian maximizer, and the plot hinges on whether the social preference over
  lotteries satisfies the independence axiom. The Independence axiom is the crux:
  utilitarianism comes out of the conjunction of Pareto + Independence (sure-thing)
  + continuity. Non-utilitarian views (prioritarianism, egalitarianism) violate Independence
  in exactly this way. That''s a beautiful dramatic device: a machine that must choose
  between two lotteries, and it violates independence because it cares about ex post
  distribution.


