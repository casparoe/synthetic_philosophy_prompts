  the diversified option in each state, but the mixture is Pareto-dominated. Hmm,
  I should be careful about specific attributions. I don''t need to name them; the
  story can just contain the phenomenon.


  Alternatively, the domain of Lewis on convention: a story about a community where
  a convention is evolving — e.g., two villages with different driving sides, or a
  signaling game where a new convention arises via precedent and salience, and then
  the interesting bit: Lewis''s account requires common knowledge of rationality and
  a coordination problem, but some "conventions" (like the ones in the story) aren''t
  coordination problems at all — they''re pure conflicts (like which side of the road
  when there''s an arbitrary cost to switch) — or they''re "chicken" games, or Lewis''s
  requirement of "alternative regularity" fails (a convention like "shake hands" has
  no alternative that would serve equally well). Also Lewis''s claim that conventions
  are arbitrary but self-perpetuating; the problem of the "first mover" who must act
  before the convention exists; the problem of common knowledge being too demanding
  (Harsanyi''s argument against common knowledge of rationality? Actually that''s
  the "common knowledge of rationality" critique — Harsanyi''s cardinal-payoff argument).
  Also the distinction between coordination conventions and constitutive conventions
  (Searle''s critique: Lewis can''t handle regulative vs constitutive rules; a convention
  like "the bishop moves diagonally" isn''t solving a coordination problem because
  there was no prior activity to coordinate). That''s a nice niche angle: a story
  about a game invented in a prison camp where the rules become constitutive conventions,
  and someone tries to explain them as solving a coordination problem and fails.


