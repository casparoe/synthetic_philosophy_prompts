  detail that''s not something models have seen a million times? Harsanyi''s aggregation
  theorem is interesting — a story about a social planner who must aggregate utility,
  discovering that respecting Pareto + anonymity + expected utility forces utilitarianism,
  and the impossibility results (Weymark''s critique: if you only aggregate ex ante
  preferences over lotteries, you get utilitarianism over expected utilities, but
  then you can''t handle interpersonal comparisons, and the "veil of ignorance" derivation
  collapses). Also Harsanyi''s theorem requires the social preference to satisfy the
  expected utility axioms too — which is the controversial premise. And there''s the
  "separability"/"sure thing" issue. Also the problem of "utility monsters," and the
  ex post vs ex ante aggregation (Mongin''s work on the ex post approach, and the
  paradox of the "spurious unanimity"). Also Sen''s critique of utilitarianism (adaptive
  preferences, the "utility function" of the oppressed woman), which cuts against
  Harsanyi''s aggregation.


  A story idea: A civil servant (or an AI, or an interplanetary arbitration board)
  must set a social welfare function; they''re given Harsanyi''s theorem as their
  charter — satisfy Pareto, plus both individuals and society are expected-utility
  maximizers over the same state space, plus invariance to some transformations —
  and discover the theorem forces them into linear aggregation of von Neumann-Morgenstern
  utilities. Then the problems: (a) the theorem only applies where there are lotteries
  — a "sure thing" problem; (b) the individual utilities are only defined up to positive
  affine transformations, so the theorem''s interpersonal comparability smuggled in
  via the "same scale" assumption; (c) a person whose utility function is unbounded
  / whose preferences aren''t continuous (Saccheri? lexicographic preferences) breaks
  the whole thing; (d) someone whose preferences are "adaptive" — the oppressed worker
  who has adjusted her desires downward, so linear aggregation locks in her disadvantage
  forever; (e) the ex ante vs ex post paradox: a policy that''s a Pareto improvement
  in expected utility terms before the state is revealed, but after the fact leaves
  one group worse off in every state — a "spurious unanimity" / state-dependent issue.
  Actually the classic ex ante/ex post paradox: two lotteries each Pareto-preferred,
  but the mixture isn''t; or an act that increases everyone''s ex ante expected utility
  yet in every state of the world makes someone worse off (Mongin''s example? Actually
  the classic example is from Gilboa, Samet, Schmeidler — "State dependent utilities..."
  Hmm. There''s a well-known example due to... Let me think. The "ex ante/ex post"
  tension: Mongin (1995) "Expected utility hypothesis and interpersonal sum of utilities
  in a social-choice context" shows that Harsanyi''s theorem, applied ex post (statewise
  Pareto), forces both statewise Pareto and separability, giving statewise utilitarianism,
  but then the sure-thing principle conflicts. There''s a famous example where every
  individual strictly prefers a nonseparable (state-dependent) prospect — this breaks
  Harsanyi. Actually there''s a well-documented example in Gilboa, Samet, Schmeidler
  (2004) "Utilitarian aggregation of beliefs and tastes" — the case of a person who
  prefers to diversify across states (e.g., "I''d rather have a guaranteed level of
