  **Title: Measuring from the Inside: Why Skolem''s Paradox Is About Theories, Not
  Sets**


  ¶1. Suppose ZFC is consistent. Its axioms form a countable set of first-order sentences,
  so by the downward Löwenheim–Skolem theorem it has a countable model M. Now consider
  the object that M takes to be the power set of the natural numbers. Within M, the
  sentence "there is no bijection between ω and P(ω)" is true — it is, after all,
  a theorem of ZFC, and M satisfies ZFC. But M''s domain is countable, and so every
  member of M is countable from the outside, including the object M calls P(ω). The
  same set is countable and uncountable. That is Skolem''s paradox.


  ¶2. The textbook response is that nothing has gone wrong, because countability is
  not absolute. To say that a set is uncountable is to say that no bijection between
  it and ω exists — and "exists" here can only mean exists in the structure we are
  talking about. M contains no such bijection; the surrounding universe does. Both
  verdicts are correct, each relative to its own model. Skolem himself drew a relativist
  conclusion: the notions of set theory are not determinate in the way we had supposed.


  Hmm — careful with attributing relativism to Skolem; it''s standard and safe (his
  1922 talk argued for a relativistic view of set-theoretic notions). Fine, but I''ll
  phrase as "Skolem took the moral to be a kind of relativism about set-theoretic
  notions" — that''s a safe general claim.


  ¶3. My complaint about this response is not that it is wrong but that it answers
  a question nobody was asking. The relativization reply explains how two verdicts
  can coexist. It does not tell me which verdict my own mathematical talk tracks.
  When I say in a seminar that there are more reals than naturals, am I speaking as
  an inhabitant of some countable model, or from outside every model? The reply is
  silent on this, and the silence is why the paradox retains its grip after it has
  been formally dissolved.


  ¶4. To sharpen the point, consider how much freedom we have in choosing M. The downward
  Löwenheim–Skolem theorem does not merely give us some countable model; it gives
  us a countable model that is an elementary substructure of the universe we started
  from. If M is an elementary substructure of V, then M and V agree on every first-order
  claim about the objects in M. So when M asserts that its power set of ω is uncountable,
  this is not an internal pretense that the surrounding universe quietly overrides:
  it is uncountable, and V agrees. Elementarity, not relativization, is what protects
  mathematical discourse.


  ¶5. This is why I think a popular analogy for the situation is worse than useless.
  People say a countable model of ZFC is like a finite-resolution simulation of a
  continuum system: there is no genuine continuum inside the simulation, but the internal
  talk comes out right because it concerns only the coarse-grained description. The
  analogy suggests that the model''s assertions are true only up to a grain, that
  something has been thrown away. But on the picture in ¶4 nothing has been thrown
  away — the model''s claims are literally true, because it agrees with V. The model
  is not a blurry picture of the universe; it is a small but perfectly sharp one.


  ¶6. My positive proposal is that we should stop reading cardinality claims as descriptions
  and start reading them as instrument readings. "Uncountable" is a two-place predicate:
  uncountable-in-structure-S. A first-order theory cannot fix the size of its own
  models any more than a first-order theory of arithmetic fixes which model it has.
  So Skolem''s paradox is not a paradox about sets at all. It is a theorem about the
  measuring power of first-order axiom systems, misread as a discovery about the mathematical
  universe. Read this way, the paradox leaves the realist untouched: nothing in Löwenheim–Skolem
  tells us that the universe of sets is countable, because it is not a claim about
  the universe. But it leaves the Skolemian relativist equally untouched, and I take
  that to be the real lesson: the quarrel between them was never joined, because it
  concerned which instrument we think we are using rather than what any theorem says.


  ¶7. Two objections. First, that "uncountable-in-S" simply restates the relativization
  reply I criticized in ¶3. It does not. The relativization reply is offered as a
  dissolution of a puzzle about sets; my claim is that the puzzle was never about
  sets, and that offering the model-relative reading as a dissolution keeps the mistaken
  framing in place while appearing to abandon it. Second, that Putnam''s model-theoretic
  argument shows we cannot stay neutral: if every consistent theory can be reinterpreted
  over a countable domain, reference itself is indeterminate, and the instrument metaphor
  hides that. I think this over-reads Putnam. The argument has to be stated by quantifying
  over models and bijections from outside, which is precisely the external standpoint
  it is meant to show we lack. Either the argument is stated from a standpoint it
  undermines, or it is not stated at all.


  ¶8. If this is right, the remaining work is to say what it would take for a theory
  to measure cardinality non-relatively — second-order axioms, or a background assumption
  of absoluteness — and to ask whether the price of such measurement is worth paying.


