  ---


  I am a third-year philosophy PhD student co-coordinating a pre-registered, multi-site
  replication-and-extension study of the side-effect effect (the asymmetry whereby
  most people judge that a corporate chairman who says he does not care about harming
  the environment and only wants profits thereby intentionally harms it, while far
  fewer judge, in the matched help version, that he intentionally helps it). Before
  we lock the protocol I have to hand my advisor a specification of what an explanation
  of the effect must deliver — not a survey of the explanations on offer, which I
  have already read, but the criteria they are being asked to satisfy. Every paper
  I''ve read simply assumes its own success conditions: the ones that treat the effect
  as an artifact of probe wording think a theory succeeds by dissolving it, the ones
  that treat it as revealing the moral contamination of descriptive concepts think
  a theory succeeds by showing the contamination spreading, and nobody says which
  of those is a real requirement and which is a camp''s preference. My two lab-mates
  refuse to run the study at all until someone tells them what would count as an adequate
  account.


  So: write the desiderata list. Fix the purpose as follows — an adequate theory is
  one good enough to be the theoretical core of a pre-registered experimental program,
  which means above all that it must license predictions in advance about vignettes
  nobody has tested, and must say where the asymmetry should shrink, vanish, or reverse
  rather than only where it appears. For each requirement give the case or consideration
  that motivates it, and say whether it is non-negotiable or a preference belonging
  to a particular camp (the conceptual-analysis program, the pragmatic camp, the "it''s
  all performance error" camp, and so on). Sort them into the categories that matter:
  the phenomena to be explained (including the ones people forget, like the absence
  of a comparable asymmetry for the chairman''s main goal, and the way the pattern
  travels to neighbouring terms such as "was in favour of" or "decided to"); the distinctions
  a theory may not collapse (competence versus performance, a concept versus a judgment
  applying it, the valence of an outcome versus the agent''s own attitude toward it,
  blame versus intentional action); the empirical results it must be consistent with
  (developmental, cross-linguistic, clinical, order and framing effects, and the modest
  and sometimes unstable effect sizes); and the philosophical costs it must be willing
  to pay.


  Here are four variants we are considering adding to the battery, none of which is
  in the literature as far as I know; for each, say which requirement it probes and
  what pattern a candidate theory ought to predict before seeing data. (1) Cost-to-self:
  the chairman''s program will damage his own health twenty years from now, and he
  says he does not care about that and only wants this year''s profits. (2) Exogenous
  indifference: identical to the standard harm case, except that the chairman''s indifference
  to the environmental damage is stipulated to be a documented consequence of a degenerative
  condition affecting his evaluative responses, of which he is unaware. (3) Agentless
  probe: the harm case, but the test question is phrased without the agent, asking
  only whether the environment was intentionally damaged. (4) Avoidable cost: the
  harm case, except that the chairman had commissioned a report showing the damage
  could have been avoided for a fee smaller than the profit increase, and he declined
  to pay it.


  Finally: tell me which requirement knocks out the most contenders, and whether some
  subset of the requirements is jointly unsatisfiable — I have a suspicion that a
  theory which explains the asymmetry by having moral evaluation infect the application
  of a descriptive term cannot at the same time preserve the intuition surveys that
  generated the data as evidence about that term, and I would like to know whether
  that tension is real or dissolvable. Close with no more than one or two lines per
  family of explanation (moral-infusion, deep-self/expression, missing-competence-condition,
  pragmatic-implicature, blame-seeking, affective-artifact) saying which requirement
  it fails first. No bibliography, no citation list, no suggested reading — I know
  where to look; what I want is the spec. A table is fine for the requirements themselves.


