  pass? Yes — the RM score is computed on the generated sequence and used in the policy-gradient/PPO
  loss; the policy model doesn''t receive it as an input token. In PPO for LLMs, the
  critic (value model) is often a separate head/model whose value estimate is used
  for advantage computation, not fed into the policy''s forward pass. In "decision
  transformer"-style offline RL, return-to-go is conditioned as an input — true. Reward-conditioned
  policies (e.g., "Upside-Down RL", RWVS) — true, they condition on target return.
  Goal-conditioned RL conditions on goals, not achieved rewards, though some use achieved-reward
  conditioning. Also, in classic RL, the reward is part of the observation? No, not
