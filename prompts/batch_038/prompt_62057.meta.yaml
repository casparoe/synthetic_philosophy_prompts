  Let me draft the position:


  The asker: senior software engineer, works on training pipelines for an LLM company,
  no philosophy background, has been reading about model welfare. Their view, which
  they call something like "availability-restricted valence functionalism":


  1. Suffering is constituted by the functional role of an aversive state: a signal
  that (a) is negatively valenced, (b) is tokened during the system''s own operation,
  (c) is available to the system''s planning, decision-making, and self-report, and
  (d) whose avoidance trades off against the system''s other goals.

  2. In online RL, the scalar reward enters the loss and updates the weights; it does
  not appear in the forward pass. So the reward is not tokened in the system''s operation
  at all — it''s a property of the training loop, not of the agent''s states. Therefore
  the standard view "reward = valence" mislocates the candidate for suffering.

  3. Where the reward *is* fed into the policy as an input (reward-conditioned policies,
  decision-transformer style, goal-conditioned RL where the achieved reward is an
  observation), or where an internal critic''s value estimate is tokened at inference
  time, there is at least a candidate.

  4. Consequence they find attractive: standard RLHF-tuned LLMs don''t suffer, because
  the reward-model score never touches the forward pass; but a future agent that carries
  its own critic at inference time might.


  Ask: what would count against this? Ranked from fatal to awkward. Include: (a) which
  philosophical commitments it stands or falls with (functionalism about valence,
  whether the "tokening" requirement is principled or arbitrary, higher-order theories,
  biological naturalism), (b) which empirical/architectural findings would move them,
  (c) what a defender of the view would concede vs dismiss, (d) whether the view has
  been insulated by qualification into unfalsifiability, and whether that''s a problem
  for a view of this kind. And specifically: is the inference-time/train-time distinction
  doing any real work, or is it a difference without a moral difference — because
  the training-time reward shaped exactly the dispositions that a suffering agent
  would have, so why does the plumbing matter? That''s the key internal objection
  the asker should raise and ask about.


  Also they should ask: what the view predicts that rivals don''t (e.g., that we should
  care about which architectures feed the critic forward; that we should test whether
  an agent''s avoidance behavior persists when the reward input is masked at inference).


  Add: the asker notes the thing that would personally move them most is not a philosophical
  argument but an empirical/architectural demonstration — say, an agent whose aversive
  signal is available at inference time and which shows avoidance, distress-like generalization,
  etc. — and asks how much weight that should get.


  Add epistemic request: separate what''s settled among people who work on this (model
  welfare researchers, consciousness scientists) from what''s genuinely contested,
  and don''t present a contested view as consensus; flag where the asker''s own technical
  description of RL plumbing is wrong or oversimplified.


