  This is essentially the same result as Arrow''s theorem, arrived at from a different
  direction. Arrow showed that majority rule cannot turn individual preference orderings
  into a coherent social ordering, and the discursive dilemma shows the same thing
  for judgments rather than preferences; both are impossibility results about aggregation,
  and both amount to the point that majority voting is incoherent once a group has
  to decide more than one question. Pettit and List''s general impossibility theorem
  says that, given a few reasonable conditions on any aggregation rule — that it should
  work for every possible profile, that it should treat members symmetrically, and
  that the collective judgments should be complete and consistent — the only rule
  that satisfies them all is a dictatorship.


