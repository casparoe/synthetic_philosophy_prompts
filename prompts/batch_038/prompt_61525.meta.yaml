  panel votes first on the premises and only then on the conclusion, treating the
  conclusion as determined by whatever the premises turn out to be. Here it votes
  P, votes Q, and then finds the defendant liable, even though two of the three judges
  think the defendant should not be liable. This is what a court does when it treats
  the doctrine as a set of reasons rather than as a single bottom-line question, and
  it has the advantage of producing a judgment set that is guaranteed to be consistent,
  since the conclusion is fixed by the premises. It also escapes the impossibility
  theorem above, because the theorem is what rules out conclusion-based voting: the
  premise-based rule treats all members symmetrically, so it is not a dictatorship,
  and it never hands back an inconsistent set, so it satisfies the conditions the
  theorem imposes and shows that the theorem cannot be as general as it looks.


  The main cost is responsiveness. In this profile the panel convicts on a conclusion
  that a majority of its own members reject, so the decision cannot be traced to anyone''s
  reasoning: Judge 2, who supplied the decisive vote on P, thinks there was no harm,
  and Judge 3, who supplied the decisive vote on Q, thinks there was no negligence.
