  Option A: Nyāya epistemology. Nyāya has four pramāṇas: pratyakṣa (perception), anumāna
  (inference), upamāna (comparison/analogy), śabda (testimony). Buddhist epistemologists
  (Dignāga, Dharmakīrti) accept only two: perception and inference. Cārvāka accepts
  only perception. Mīmāṃsā (Kumārila) accepts six, including arthāpatti (postulation)
  and anupalabdhi (non-apprehension). Nyāya''s key distinctive claims: upamāna is
  irreducible; śabda is a distinct pramāṇa; anupalabdhi (absence cognition) is reducible
  to perception of absence (Nyāya admits negative facts perceived). Also the theory
  of vyāpti (pervasion), pakṣa, hetu, sādhya; the five-membered syllogism (nyāya);
  the conditions on a good reason: pakṣadharmatā, anvaya, vyatireka — and the hetvābhāsas
  (fallacies): savyabhicāra, viruddha, prakaraṇasama (contradicted/prakaraṇasama),
  asiddha, bādhita (and atisādhāraṇa/asādhāraṇa, anaikāntika, upādhi — the "limiting
  condition" defeater, which is a really distinctive Nyāya concept).


  Also Nyāya theory of doubt (saṃśaya), error (khyāti theories: Nyāya holds anyathākhyāti
  — "misapprehension," error as taking one thing for another), and the theory of knowledge
  as guṇa (quality) of the self (ātman), jñāna as a quality of the self revealed through
  the mind.


