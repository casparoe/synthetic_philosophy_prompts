  Let me think about which combination gives the most interesting work.


  Option A: Condorcet jury theorem + "Report one''s verdicts on a set of cases and
  ask what principle captures them". The asker reports intuitions about when group
  aggregation improves accuracy: e.g., a jury of 12 independent 60%-accurate members
  beats a single expert; a group of correlated voters (all reading same newspaper)
  doesn''t; a group where members have systematic bias (accuracy below 50%) does worse;
  adding more members helps even if correlated... etc. That''s fairly "in the weeds"
  but a small model might regurgitate CJT standard content. But the verdicts type
  requires the asker''s own verdicts — which is somewhat novel framing.


  Option B: Löbian obstacle + "Predict or recommend a verdict on a new case from someone''s
  verdicts on earlier cases". The Löbian obstacle: an agent that trusts its own reasoning
  can''t use its own reasoning to justify actions without running into Löb''s theorem
  (Yudkowsky''s "AI as a positive and negative factor in global risk" / "Gödel machines
  and rational agency"; Eliezer''s discussion of a machine that can''t trust its own
  outputs). Cases: a Gödel machine that requires provable optimality can''t act; a
  chess program using its own evaluation function; a proof-checker; etc. This is niche
  but the type is "predict a verdict from earlier verdicts". Could be interesting:
  a colleague''s verdicts on which agents count as "self-trusting"/rational. Hmm,
  this may be too niche — small LLMs won''t know the Löbian obstacle.


  Option C: Integrated Information Theory + verdicts type. IIT verdicts: a photodiode
  has tiny but nonzero phi; the cerebellum contributes little; a group of people doesn''t
  have phi; a simple feedforward network has low phi; a grid of XOR gates... The asker''s
  verdicts on which systems are conscious per IIT. But the "principle" here would
  be Φ — that''s what IIT already gives. Hmm, could be: the asker reports their own
  verdicts about which systems have more Φ and asks what principle captures them,
  e.g., whether integrated information or just information matters. Actually interesting:
  the asker''s verdicts track something like "Φ plus irreducibility" vs. "cause–effect
  power" vs. "recurrent processing". But small models may not know IIT details deeply
  enough (they''d know Φ, axioms: intrinsicality, information, integration, exclusion,
  maximization). Actually IIT''s postulates are reasonably well-known. But there''s
  a risk of a model just reciting IIT.


