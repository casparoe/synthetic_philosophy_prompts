  The summary text (mostly right, one or two subtle misrepresentations, no howlers):


  "Hume''s economic essays, published in the early 1750s, contain the core of what
  became classical monetary theory. Money, he says, is not part of the machinery of
  commerce but the oil that makes the wheels turn more smoothly — so the amount of
  money a country has makes no difference to how wealthy it is; what matters is its
  population and its industry. This is why he could argue that if four-fifths of all
  the coin in Britain vanished overnight, nothing would be lost but a period of adjustment:
  prices would fall in proportion, British goods would undercut everyone in foreign
  markets, and the money would flow straight back until Britain was level with its
  neighbours. That argument, which later economists called the price-specie-flow mechanism,
  is supposed to have demolished mercantilism: a trade surplus corrects itself, so
  no government need bother protecting the balance of trade, and none should meddle
  with the money supply either. Hume accordingly opposed paper credit, because multiplying
  banknotes can''t add to a nation''s stock of labour and commodities, it only raises
  prices. His conclusion was a cosmopolitan one — he said he prayed for the flourishing
  commerce of Germany, Spain, Italy and even France — because on his view one country''s
  gain is never another''s loss. In modern terms: Hume discovered the neutrality of
  money, and the policy laissez-faire that goes with it."


  Now where are the subtle errors?


  1. "the amount of money a country has makes no difference to how wealthy it is"
  — Hume qualifies: "if we consider any one kingdom by itself" and in equilibrium
  ("after the prices are settled"); he insists money matters to the public in wars
  and foreign negotiations, and that in the transition the increase "excites industry"
  / animates labour, manufacturers, merchants, farmers. The popularizer collapses
  the long-run neutrality into an unqualified claim and drops the transition, which
  for Hume was the practically important part (he even argues for policies to accelerate
  the inflow). Also, Hume''s own essay "Of Interest" explicitly denies that plenty
  of money lowers interest — so the popularizer''s "quantity theory" framing risks
  conflating.


  2. "That argument ... demolished mercantilism: a trade surplus corrects itself,
  so no government need bother protecting the balance of trade" — Hume''s own argument
  is that it''s *impossible* for money to leave a kingdom with people and industry;
  but Hume himself proposed institutional policy: a public bank that locks up all
  the money it receives (hoarding specie) to keep labour cheap, deliberately accumulating
  treasure for war. That''s an intervention in the money supply, flatly contradicting
  "none should meddle with the money supply." And he thought paper credit expansion
  actively harmful — not merely neutral.


  3. "he opposed paper credit, because multiplying banknotes can''t add to a nation''s
  stock of labour and commodities, it only raises prices" — misattribution of the
  reason. Hume''s stated objection: artificial expansion raises prices beyond the
  natural proportion, destroys the cheap-labour advantage in foreign markets (a real,
  not merely nominal, harm), and paper is fragile — "any great disorder in the state
  will reduce it to nothing," foreigners won''t accept it. Also he thought banks and
  paper credit are "so generally esteemed advantageous" and he had a nuanced doubt,
  not a blanket opposition; and the "jealousy of trade" essay''s point.


  4. "one country''s gain is never another''s loss" — Hume''s jealousy-of-trade essay
  says the increase of riches in one nation "commonly promotes" its neighbours'' riches,
  but he also allows an exception: the only commercial state that ought to dread the
  improvements of neighbours is one like the Dutch, enjoying no extent of land, no
  number of native commodities (trading/carrying nation). So "never" is an overstatement
  — Hume himself flags an exception. Verified from the fetched text (truncated right
  at that sentence: "The only commercial state, that ought to dread the improvements
  and industry of their neighbours, is such a one as the Dutch, who enjoying no extent
  of land, nor possessing any number of native com[modities]..."). Good — I can use
  this without quoting; the answer will need to recall it.


  5. "In modern terms: Hume discovered the neutrality of money, and the policy laissez-faire
  that goes with it" — anachronism: modern neutrality carries the classical dichotomy
  with full employment / flexible prices; Hume''s transition analysis is explicitly
