  Now, what spec? I want something jointly satisfiable but not trivially so. Options:


  (a) A game where common knowledge of rationality (CKR) yields a *worse* outcome
  for both players than the outcome under only mutual knowledge to depth 2 — i.e.,
  more knowledge of each other''s rationality hurts. This is the "paradox of common
  knowledge of rationality" (the centipede game, or the "guess 2/3 of the average").
  Spec: a realistic, ordinary-life setting (a meeting, a market, a workplace), no
  infinite regress in the story''s telling (you must be able to state the epistemic
  conditions explicitly for each level), and the game must NOT be the centipede game
