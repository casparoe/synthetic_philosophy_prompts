  Alice knows p (client prefers Tuesday). She tells Bob. Bob receives the message
  (and knows he received it). So: Bob knows p; Bob knows Alice knows p; Alice knows
  Bob knows p (if she knows the message was delivered — she doesn''t unless Bob confirms).
