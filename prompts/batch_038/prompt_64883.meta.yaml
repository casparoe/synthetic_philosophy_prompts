  CKR case and the depth-2 case. Then: show the epistemic hierarchy, the play in each
  case, and identify the feature that makes common knowledge harmful.


  Hmm — but "unique equilibrium in both cases" is tricky: with only mutual knowledge
  to depth n, the solution concept isn''t standard (you''d need to define rationalizable
  play or level-k thinking). Actually the natural way: use level-k / cognitive hierarchy:
  at depth k, players iterate k steps of "the other is rational." In a p-beauty contest,
  more iterations → closer to 0. But the "common knowledge is harmful" direction:
  in the centipede, CKR gives immediate defection; bounded depth gives cooperation.
  So a spec: construct a *one-shot* (non-iterated) game, realistic, where the level-k
  reasoning depth matters, with CKR being worse than depth-2. One-shot games where
  iterated deletion of dominated strategies leads to a bad outcome: e.g., the "traveler''s
  dilemma" (iterated, though — 2 rounds), or a coordination game with a Pareto-inferior
  equilibrium reachable by iterated deletion? In a one-shot game, CKR + common knowledge
