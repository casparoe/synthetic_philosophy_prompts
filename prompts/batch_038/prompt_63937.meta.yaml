  You are the grader for the final exam of a second-year philosophy of art course.
  Below are the question and one student''s response. Assign a grade out of 100, then
  give point-by-point comments suitable for returning with the paper: identify what
  the student gets right, what is wrong, and where the reasoning does not support
  the conclusion, including mistakes that would not be apparent on a first read.


  **Question.** (a) State Goodman''s distinction between autographic and allographic
  arts, and explain why he thinks the criterion is not simply whether an art form
  produces one object or many. (b) Explain the role of notation: what a notational
  scheme has to do, and why compliance with it is supposed to make forgery impossible
  in an allographic art. (c) A forger produces a convincing manuscript of a previously
  unknown Beethoven string quartet, which a professional ensemble then performs from
  the score. Say precisely what, if anything, has been forged here, and whether the
  performance is genuine.


  **Student''s answer.** [~330 words]


  Let me write the answer with the errors embedded.


  "(a) An art is autographic when the difference between an original and a forgery
  matters, and allographic when it doesn''t. Painting is autographic: an exact copy
  of a Vermeer is still just a copy, and the value depends on its having come from
  Vermeer''s hand. Music and literature are allographic: there are thousands of copies
  of a symphony score and thousands of performances, and none of them is more genuine
  than another. The criterion isn''t whether there are many objects, because a print
  run produces many objects too; what matters is whether the work''s identity depends
  on the history of its production. In an autographic art it does; in an allographic
  art it doesn''t.


  (b) An allographic art has a notation. A notational scheme sorts marks into characters
  that don''t overlap and aren''t so fine-grained that you can''t tell which character
  a mark belongs to, and each character picks out exactly one compliance class, so
  there''s no ambiguity about which instances fall under it. Because compliance settles
  genuineness, a performance that gets every note right is a genuine instance of the
  work no matter who conducted it or when; conversely there''s nothing to forge, since
  a forgery has to pass as the original, and in music any correct instance already
  is the original. A copied score can be wrong, but a wrong copy isn''t a forgery,
  it''s just a bad copy.


  (c) In the Beethoven case, nothing has been forged in the sense that matters. The
  quartet is a musical work, music is allographic, and the ensemble''s performance
  complies with the notation in the manuscript, so the performance is a genuine instance
  of the quartet. The manuscript itself is only a copy of a score, and copies of scores
  can''t be forged, as in (b). And since the audience can''t hear any difference between
  this quartet and a real Beethoven, the piece''s aesthetic value is untouched: the
  notes are what they are whoever wrote them. The only thing wrong is a claim about
  provenance, which is a matter for historians and dealers, not aesthetics."


