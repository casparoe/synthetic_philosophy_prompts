  Dennett''s fourfold scheme (from Kinds of Minds, 1996) sorts creatures by the means
  they have of adjusting to the world: Darwinian creatures, whose adjustments are
  fixed by natural selection and expressed as innate dispositions; Skinnerian creatures,
  which can be reshaped within a lifetime by reinforcement; Popperian creatures, which
  carry an internal model that lets candidate behaviours be tried out and rejected
  before they are acted upon, so that the organism, in Dennett''s borrowing from Popper,
  can let its hypotheses perish in place of itself; and Gregorian creatures, after
  Richard Gregory, which use externally designed tools — language above all — that
  greatly extend what they can think about. As I read him, the four are cumulative:
  each higher kind retains the capacities of those below and adds a new mechanism
  of correction.


  My organism seems to break the ordering, and I want to know whether you think it
  really does. It has no nervous system, and I never obtained persuasive evidence
  that it represents alternative futures to itself in any sense worth calling a model.
  What it does have is a habit of depositing a non-living secretion wherever it has
  already crawled, and of subsequently refusing to cross that secretion. Over months,
  in a stable patch of ground, this builds up an extensive, physically persistent
  record of where the colony has been. A naive fragment placed into that patch, one
  that has never seen the terrain, negotiates it with an efficiency comparable to
  that of the colony that laid down the record; and if a heavy rain washes the ground
  clean, the efficiency disappears, even though the genetic material and the immediate
  sensory apparatus are unchanged. Two features strike me as philosophically important.
  First, the record is a byproduct of locomotion, not something the organism makes
  in order to remember — no selection has shaped it for that purpose so far as I can
  tell. Second, it outlives the individuals that produced it and is inherited by later
  ones through contact with the ground rather than through the germ line.


