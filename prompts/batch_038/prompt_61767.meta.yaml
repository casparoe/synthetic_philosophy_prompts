  Hayden White''s claim that the narrative shape a history has (tragedy, romance,
  farce) is something the historian brings rather than finds — but I''ve never done
  the close reading and I don''t trust my paraphrase.


  So: translate those three positions into my vocabulary, as faithfully as you can,
  and then give me the residue report. Be careful not to cheat. My vocabulary has
  a built-in assumption — that there''s some well-defined thing out there being estimated
  and that accuracy is a matter of fit to it — and White in particular is denying
  exactly that, so if you translate him by quietly reinstating the assumption, you''ve
  smuggled and I want to be told.


