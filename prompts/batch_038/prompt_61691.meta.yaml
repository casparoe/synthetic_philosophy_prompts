  Theory: Mill''s account of legitimate colonial rule — rule over "backward" societies
  justified by the improvement of the ruled (the proviso that the end actually be
  their improvement), plus his doctrine in Considerations on Representative Government
  about dependencies being governed by a professional, semi-independent body shielded
