  forward-looking) vs "custodial rule" (justified by shielding the ruled from other
  predators, including the ruler''s own countrymen) — and ask whether Mill''s 1858
  petition is really a custodial defence wearing tutelary clothes. Also ask about
  "the proviso problem": whether "provided the end be their improvement" is a clause
  that can ever be falsified, and what the 1857 rebellion did to it — did the rebellion
  count as evidence the proviso was unmet, and if so, why did Mill not concede it?
