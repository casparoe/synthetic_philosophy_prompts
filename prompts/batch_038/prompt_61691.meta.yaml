  failed and by Mill as proof it succeeded. Ask what that shows about the theory''s
  testability, and whether Mill''s theory contains resources to handle it (e.g., his
  insistence that the improvement proviso requires actual effect, and his view that
  the rebellion was a military mutiny rather than a popular revolt).


