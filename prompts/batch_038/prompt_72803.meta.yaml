  that unites everyone, accessible to a peasant; machine-made verse that moves a room
  of strangers might pass the universality test spectacularly, which threatens his
  exclusion of "upper-class" art. Also his religious-art requirement: art is good
  when it transmits feelings uniting people in love of God and neighbor; a poem of
  a mother''s grief uniting strangers in compassion would qualify as good religious
  art under his own standard — which makes his genetic condition the only obstacle.
  Nice: the tension is precisely between his evaluative core (union) and his genetic
  condition (lived-through feeling transmitted). That is a real philosophical crux,
  and in the weeds.


