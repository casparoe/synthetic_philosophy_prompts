  The opening move should be one Tolstoy must deal with. Something like: "Here is
  the case. A woman whose son killed himself fed his letters into a machine that produces
  text; the machine produced a poem; it was printed and read aloud; more people in
  the room were moved by it than by anything else in the festival. Your account says
  art is a man handing on to others a feeling he has once lived through, by external
  signs. Nobody lived through this feeling — not the machine, and, you will say, not
  the mother either, since she was in the grip of it rather than re-evoking it at
  a distance and shaping it. Yet the infection happened; I watched it. So either your
  genetic condition (a feeling once lived, re-evoked, then transmitted) is doing no
  work, in which case your definition collapses into ''art is whatever infects'',
  and the machine wins; or you must say that hundreds of people were infected by nothing,
  which seems to me a description of the room that is simply false. Which do you say,
  and what do you have left?"


  That''s a genuinely hard opening. Tolstoy has real resources: sincerity as the crucial
  condition; the distinction between being moved/pleased and being united with the
  artist and with others; the requirement that the feeling transmitted be a feeling
  the artist has lived and re-evoked in himself; his notion of counterfeit art that
  mimics effects; his point that strong emotion in an audience can come from other
  sources (novelty, surprise, amusement, patriotism, erotic excitement) — he lists
  the causes of "aesthetic infection" being absent in counterfeit works; also he can
  distinguish the mother as the actual artist (she shaped the prompt, chose, arranged
  — if she re-evoked and transmitted, then the machine is a tool, like a printing
  press or a stenographer) — that''s a strong move: Tolstoy could concede the case
  is art with the mother as artist, if she sincerely re-lived the feeling and deliberately
  transmitted it. But then the asker''s follow-up could be: what if she didn''t —
  what if the machine''s output surprised her and she only recognized it as true?
  That''s a good pressure point but the opening shouldn''t over-supply; it''s fine
  to hint at the sub-case.


