  decades to appear and the faculty who understand them retire in the meantime, then
  waiting doesn''t produce knowledge either — the information decays on the same schedule
  whether or not you act. And the irreversibility point, he said, condemns every reform
  rather than this one: any long-standing practice you abolish is irreversible in
  exactly the sense Ines needs, because the version you destroy has a history you
  can''t reconstruct. Weighted as heavily as she was weighting it, irreversibility
