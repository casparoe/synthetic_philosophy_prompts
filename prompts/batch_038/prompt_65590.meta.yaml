  I sit on the graduate committee of a mid-sized philosophy department, and this spring
  we were charged with reviewing our oral preliminary examination: two hours, three
  faculty members, closed door, no written component, unchanged since the program
  was founded in the early 1960s. The founding faculty are all gone, the archive contains
  minutes recording only that the requirement was adopted, and no rationale was ever
  written down. Two of my colleagues, Marcus and Ines, got into an argument about
  it after our second meeting that I found myself unable to referee, and I''d like
  a careful adjudication of their exchange, which I''ll report as neutrally as I can
  manage.


  (1) Marcus opened by saying the requirement should go. The archive gives no reason
  for it; the people who could supply one are dead or long retired; the exam''s outcomes
  correlate with nothing we can measure — students who perform badly in it are not
  more likely to struggle later — and it consumes some forty faculty hours per cycle
  while predictably driving away students from groups we are already struggling to
  recruit. He said that Chesterton''s fence, as it''s usually wielded, tells you not
  to tear down a fence until you understand why it was put there, but that when the
  reason is unrecoverable the instruction simply never expires, which is a way of
  converting an epistemic caution into a permanent veto.


  (2) Ines said he''d misread the point. On her account Chesterton''s claim isn''t
  that a discoverable rationale exists somewhere, but that the practice''s having
  survived is itself the evidence: for sixty years the oral has been scrutinized by
  faculty who had every incentive to drop it if it were costly and pointless, and
  none of them did, and survival under that kind of continuous low-grade testing is
  information, just not the kind that shows up in a spreadsheet. She added that departments
  store their reasons in habits rather than in minutes, and that the exam may well
  be doing something invisible to student-level metrics — for instance, forcing the
  whole faculty to sit in a room together and argue about what each other''s students
  actually know, which is plausibly the main source of the cross-subfield cohesion
  the program is known for.


  (3) Marcus said that was unfalsifiable as stated. If survival counts as evidence
  of function, and the failure of every metric we can construct is explained by the
  function being unmeasurable, then no practice could ever be shown to be useless
  — including the surviving requirement that dissertations be bound in buckram, which
  everyone agrees is a dead letter. He asked Ines to say what would count against
  the exam''s usefulness. If nothing would, her position isn''t a hypothesis but a
  standing veto wearing the clothes of one.


  (4) Ines accepted the challenge and offered a distinction. Buckram binding, she
  said, has no candidate mechanism connecting it to anything the department values;
  the oral has at least two, each independently attested in other programs — faculty
  coordination across subfields, and early identification of students who cannot think
  under pressure, a capacity none of our metrics tests. She stressed she wasn''t claiming
  the exam is proven valuable; she was claiming the reversibility of the two options
  is wildly asymmetric. Keeping it costs forty hours a year and some morale, and the
  decision can be revisited annually; abolishing it is a one-way door, because if
  the oral turns out to have been load-bearing we won''t know for a decade, and by
  then the faculty who could have explained what it was doing will have retired, and
  reinstating it won''t restore it, since whatever value it had depended on its being
  continuous. She tied this to Burke''s idea of a society as a partnership among the
  living, the dead, and those not yet born, and to his claim that the individual is
  foolish while the species is wise: institutional experiments return their results
  on a timescale longer than the career of the person who runs them, so the abolitionist
  is the only party who cannot possibly have run the control.


