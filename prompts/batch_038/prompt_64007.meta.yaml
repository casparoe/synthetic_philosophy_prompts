  Draft of the prompt (casual, engineer voice, 1-2 typos):


  ---


  Ok so this is a bit of an odd request. I''m a backend engineer, no philosophy background
  at all, and my company does these quarterly "learning days" where anyone can put
  a 75-minute session on the schedule about whatever. I signed up to run one on causation,
  and I''ve picked al-Ghazali — the 11th century theologian guy, the one who argued
  that when fire burns cotton we never actually observe the fire causing anything,
  we just observe the two events in the same order every time and our minds fill in
  the connection. He thought God was doing it directly each time, but I''m going to
  leave the theology mostly out of it, I''m not trying to convert anyone, I just want
  the argument about causation.


  Room will be 12-20 people, all coworkers, mostly engineers plus a couple of PMs
  and one data scientist. Nobody will have read anything beforehand, and honestly
  half of them will be on their laptops. There''s a whiteboard, a projector, and I
  can print handouts. 75 minutes, hard stop.


  Here''s the thing I actually care about: these people (me included) write incident
  postmortems. Something breaks in production, and then we sit in a room and produce
  a very confident sentence about what caused what, and we treat anyone who questions
  it as being difficult. I want the session to make them feel, in their gut, how much
  of that confidence comes from having seen the pattern hold before and how little
  of it comes from actually having observed a connection. Ideally they hit that wall
  themselves and I don''t have to say "and this is what al-Ghazali meant."


  But — and this is the part I keep failing at when I try to sketch it — I do NOT
  want them to walk out thinking "causation is fake, postmortems are theater, nothing
  can be known." That''s the easy takeaway and it''s wrong, or at least it''s not
  his view. He''s perfectly happy that fire keeps burning cotton and that you can
  predict it; what he denies is that it has to. So the activity needs to leave them
  holding both of those at once, and I don''t know how to do that mechanically.


  Can you design it for me? What I need:

  - the actual rules and structure, step by step, with timings that add up to 75 including
  debrief

  - what I need to prepare/print, keeping it cheap (I''m not buying props, maybe $20
  of index cards at most)

  - some kind of choice or bet or commitment from them that has a small real cost,
  so they''re not just watching me do a demonstration — I''d rather they be on the
  hook for a claim than hear one

  - how I handle the room if it splits into "this is obvious" people and "this is
  stupid word games" people, which is what usually happens

  - the debrief questions, in order, that get them from whatever just happened to
  the actual distinction he''s drawing, and where I finally say his name and the book
  it''s in

