  Actually here''s a nice spec-driven design: The interesting contested positions
  about the Ship of Theseus include:

  1. Spatiotemporal continuity (the same object is the one with continuous history).

  2. Same parts/mereological essentialism (identity requires same matter).

  3. "Dominant kind" / sortal-relative identity (Wiggins): identity is relative to
  what kind of thing it is; for artifacts, the kind (ship) and its characteristic
  activity determine persistence conditions.

  4. Four-dimensionalism/perdurantism: both are equally "the ship," as different spacetime
  worms sharing parts; there''s no fact of the matter, or it''s a matter of convention.

  5. Psychological/intentional continuity: what the community treats it as, its narrative/social
  identity (e.g., the Theseus as a civic institution).

  6. Relative identity (Geach/Noonan).


