  and I have been trying to pin down exactly where. What follows is an attempt to
  test them against a novel.


  The novel is Camus''s The Plague (1947), which I assume you know well enough that
  I need not summarize it: Oran, the dying rats, the closed gates, Rieux and Tarrou
  and Rambert and Grand and Cottard, Father Paneloux''s two sermons and the death
  of the magistrate Othon''s son, Tarrou''s own death almost within sight of the end,
  and the narrator''s disclosure of himself in the final pages.


  Here is what I should like you to do. Over the past year I have been sorting non-human
  claims into three levels, and I want you to apply the scheme, criticize it, and
  tell me where Camus''s text refuses to be sorted. The levels are:


  (i) mere causal contribution — the entity makes a difference to how events go, but
  so does the weather in any story and so does the price of grain;

  (ii) responsive or dispositional agency — the entity adapts, resists, changes tactics
  under pressure, in the sense in which I would say without any metaphor that a population
  of organisms has outflanked a control measure. No mind, no goals, no experience
  implied; what is implied is that the entity''s behaviour is a function of what is
  done to it;

  (iii) moral agency or moral patienthood — something to whom obligations can be owed,
  or by which someone can be wronged.


  Please take the principal non-humans of the novel — the bacillus, the rats, the
  fleas and the town''s sanitation, the heat and the wind, the gates and the cordon,
  the sea that Rieux and Tarrou swim in, and Oran itself as a habitat — and assign
  each to a level, saying what in the text earns the assignment and where the prose
  slides between levels.


  Then I want the harder questions. Paneloux''s first sermon appears to me to be precisely
  the inflation of a level (i)–(ii) process into a level (iii) one: the plague as
  punishment implies a plaintiff and a verdict. Does the second sermon retract that
  inflation, or harden it? Tarrou''s confession — that everyone carries the plague
  and that decency consists in not breathing it onto others — looks to me like the
  only place in the book where a level (ii) fact is successfully converted into a
  level (iii) obligation, and it is converted in a human rather than in the microbe.
  Is that right, and is it what makes the book work?


  Third: the novel''s opening pages give us Oran in what I can only call habitat terms
  — a commercial town with no birds, no trees, no gardens, a climate, a temperament,
  habits of work and pleasure. That is very nearly environmental determinism, and
  yet Rambert stays when he could leave, Rieux refuses Paneloux''s consolation, and
  Tarrou becomes something like a saint without God. Does Camus commit himself to
  a habitat account he then breaks for dramatic convenience, or is the point that
  a habitat can overdetermine conditions without determining choices? I should like
  you to say which, and to say whether the difference is one the text can settle.


  Fourth, the reverse peril. Much of this recent writing, in my experience, restores
  agency to non-humans by way of war vocabulary: the microbe as invader, as strategist,
  as enemy. Camus''s narrator is a doctor who keeps statistics, hesitates over labels,
  and calls the early cases atypical; he conspicuously declines to personify. Does
  the book ever succumb to the martial metaphor anyway, and if it resists, what does
  it cost the novel to resist — because a chronicle with no antagonist is a strange
  thing to write, and Camus''s closing reflection that the bacillus never dies but
  lies dormant among our linen and papers and may one day wake its rats again and
  send them to die in a happy city sounds to my ear like a prophecy from an adversary
