  I like this. But is there enough philosophical structure to make a great answer?
  Yes: non-identity (Parfit), the asymmetry between preventing a suffering person
  and selecting between possible people, "person-affecting" vs "impersonal" harm,
  Savulescu''s procreative beneficence (choose the child expected to have the best
  life), the disability critique (mere-difference view, social model — the harm comes
  from social arrangements not the trait), Habermas''s liberal eugenics objection
  (the selected child cannot consent to being designed; asymmetry between grown and
  made; threatens the child''s self-understanding as a free and equal co-author of
  their own life; and the irreversible nature of genetic intervention), the "expressivist
  argument" (selecting against a trait expresses the view that lives with that trait
  aren''t worth living — Asch), the difference between treatment and enhancement,
  and the fact that polygenic scores have tiny effect sizes and are population-relative/ancestry-relative
  (so the expected-benefit calculation is weak), plus the "wrongful disability" cases
  (selecting *for* deafness — the real-life case) which flip the intuition. And the
  practical advice: the line-drawing question is hard; a defensible principle might
  be one that focuses on whether the trait forecloses the child''s own future ability
