  Machiavelli fortuna/virtù:

  - Misconception 1: virtù = moral virtue / "virtue" in the Christian sense. Head
  off early with a lexical move: same word, different extension. But the trap: students
  then overcorrect to "virtù = ruthlessness/amoral cunning" — the second-order misconception,
  which is arguably worse and needs heading off later.

  - Misconception 2: fortuna = luck, purely random; whereas Machiavelli thinks fortune
  governs about half our actions, leaves the other half (or nearly) to us — and the
  river/dyke image implies fortune is channellable, predictable in structure.

  - Misconception 3: "fortune favours the bold" — reading Ch. 25 as a self-help slogan;
  the implication that impetuosity always wins. But Machiavelli''s actual claim is
  more delicate: the impetuous man succeeds while times suit his temper, and fails
  when times change; the real problem is that men cannot change their nature (the
  caution vs impetuosity point, with the example of Julius II — Pope Julius II, whose
  impetuosity worked while the times suited and who would have been ruined had he
  lived longer / had circumstances changed; and Fabius Maximus Cunctator, whose caution
  suited the times against Hannibal and failed when times changed). So virtù is partly
  about matching one''s mode to the times — but Machiavelli denies anyone can reliably
  do that, since nature can''t be changed. That''s a genuine puzzle: is virtù a matter
  of adaptability (which he says we can''t have) or of impetuousness? Great for the
  "dependency structure" ask.

  - Misconception 4: reading "fortuna is a woman, and must be beaten" as mere period
  misogyny to be skipped, or as the actual argument — need to decide what to do with
  it.

  - Misconception 5: that Machiavelli is a determinist/fatalist ("fortune governs
  half, so the half is fixed") vs. the exhortation in Ch. 26 — the tension between
  the diagnosis of decay and the call to action; and his claim that free will isn''t
  extinguished (in contrast to the astrological/Boethian framing).

  - What to leave out: the Discourses'' republican treatment of fortune (the role
  of ordini, the "returning to beginnings" idea, the corruption of the Roman Republic,
  the Florentine Histories'' cycles), the Aristotelian-Scholastic background (the
  medieval fortuna as minister of divine providence in Boethius/Dante), and the Italian-language
  philology.


