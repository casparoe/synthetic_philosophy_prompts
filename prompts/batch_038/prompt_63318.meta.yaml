  Aristotle on money/exchange:

  - Misconception 1: Aristotle thinks money is "just a convention, arbitrary" — and
  therefore a proto-nominalist / anti-realist about value; whereas his point is that
  money is a conventional stand-in for demand (chreia), which is the real measure;
  money makes things commensurable by representing need. Students often conclude "Aristotle
  says money is fake/arbitrary, so he''d hate capitalism" or "Aristotle anticipated
  fiat currency."

  - Misconception 2: reading the "just price" into Aristotle (he doesn''t use that
  term; it''s later Scholastic). Careful — the asker shouldn''t be asked for something
  the model gets wrong. Actually flagging it as a misconception is fine.

  - Misconception 3: the "Aristotle couldn''t see that exchange requires equal value
  / he thought exchange of unlike things impossible" — i.e., reading the commensurability
  problem as a labour theory of value anticipation (Marx''s reading in Capital — Aristotle''s
  "riddle" and Marx''s claim that Aristotle couldn''t get to equal human labour because
  Greek society rested on slavery). That''s a famous reading, well-known enough. And
  Meikle''s critique. Could be a "leave out" item.

  - Misconception 4: chrematistics = "greed" rather than a structural distinction
  between acquisition that serves the household''s natural ends (use-value bounded)
  and acquisition aimed at endless increase of money (exchange-value unbounded), with
  retail trade and interest as paradigm cases; tokos as "money breeding money," the
  most unnatural mode.

  - Misconception 5: students with econ training say "he just didn''t understand subjective
  value/supply-demand" or "he''s confused price with value."

  - The dependency structure: you need hōraiotēs? No. You need: household (oikos)
  as the unit with natural ends → natural acquisition bounded by those ends → exchange
  within the polis arises from mutual need, not from natural self-sufficiency failure
  exactly... actually need → reciprocity (antipeponthos) in justice Book V → the puzzle
  of commensurating a house and shoes → chreia as the real bond → money as a conventional
  proxy → the corruption into chrematistics → the diagnosis of the "unnatural" in
  retail and interest.


