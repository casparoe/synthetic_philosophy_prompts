  5M, 1/11 0). So A≻B and D≻C is a violation of the independence axiom (common consequence
  effect).


  Subtle mistakes a student could make:

  1. Claiming that the Allais choices show people are risk-averse (concave utility)
  — no: risk aversion over the utility function is fully compatible with the independence
  axiom. Choosing A in problem 1 can be consistent with a concave utility function,
  but choosing D in problem 2 requires something else. Actually a concave utility
  can explain A≻B for some; the inconsistency is the point. So a student who says
  "the paradox shows people are risk averse in some contexts and risk seeking in others"
  — that''s the reflection effect from prospect theory, different thing. The Allais
  pattern is the certainty effect.

  2. Claiming the paradox refutes transitivity, or that it shows utility theory is
  descriptively false but normative theory unaffected (that''s actually a defensible
  position — Savage''s response). A subtle mistake: attributing to Savage the view
  that he accepted the violations — no, Savage regarded them as showing the need to
  reformulate, and after seeing the paradox, said he wished he''d thought of it —
  but I shouldn''t quote.

  3. Confusing the independence axiom with the "sure-thing principle" — actually Savage''s
  sure-thing principle is essentially the informal statement of independence, so that''s
