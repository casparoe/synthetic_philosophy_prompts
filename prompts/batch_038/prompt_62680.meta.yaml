  This pattern violates the independence axiom, which Savage also called the sure-thing
  principle. The way to see it is to write the first pair as mixtures over a common
  consequence: the certain million is a 0.89/0.11 mixture of the million with itself,
  and the risky option is a 0.89/0.11 mixture of the million with a gamble on five
  million and nothing. The second pair replaces that common consequence of a million
  with a common consequence of nothing, leaving the rest of the mixture untouched.
  Independence says a preference between two mixtures shouldn''t flip when a component
  they share is replaced by something else, so the observed pattern is inconsistent
  with the theory.


  The deeper point is that people are risk averse: a sufficiently concave utility
  function over money makes the certain million worth more than the gamble. Expected
  utility theory is committed to linear probabilities, so it can''t represent that
  attitude, which is why Allais''s subjects look irrational by its lights. Prospect
