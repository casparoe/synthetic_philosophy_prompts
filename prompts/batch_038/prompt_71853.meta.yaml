  Belief set for a consistency check on updating on conditionals / Judy Benjamin:


  Asker: grad student or a reading group member writing up views on probabilistic
  updating on conditional information. Commitments:


  1. Adams'' thesis (at least in the restricted form for factual, non-conditional
  antecedents/consequents): P(A→B) = P(B|A).

  2. Following Lewis''s triviality result, I deny that conditionals are propositions
  with truth conditions — I''m an expressivist/non-cognitivist about them; the probability
  of a conditional is really the corresponding conditional credence. So I take Lewis''s
  result to be a decisive refutation of truth-conditional semantics for indicative
  conditionals, not a reason to restrict Adams'' thesis.

  3. When I learn from a reliable informant that P(A→B) = q (as Judy Benjamin does),
  the correct update is van Fraassen''s rule: keep P(A) where it was and set P(B|A)
  = q.

  4. More generally I think updating should preserve as much as possible of the old
  credence function — minimal revision — and I''m a Jeffrey conditionalizer.

  5. I also think that in the Judy Benjamin case, the informant''s choice to tell
  me about the red half is itself evidence, so P(red) should shift a bit — I shouldn''t
  treat the antecedent''s probability as sacrosanct.

  6. I hold that rational credences should supervene on total evidence, and I don''t
  believe in "extra" pragmatic reasons to fudge credences.


  Genuine tensions: (3) vs (5) — direct contradiction about whether P(A) is held fixed.
  But that''s too obvious maybe. The subtler one: (2) vs (3)/(5). If conditionals
  aren''t propositions, then what is the content of the report "P(A→B) = q"? van Fraassen''s
  rule takes the informant''s utterance as evidence about a proposition-ish thing;
  the expressivist reading says the report constrains your conditional credence, but
  then it can''t simultaneously be evidence bearing on P(A) — actually the expressivist
  view is often said to make the update on conditionals problematic precisely because
  there''s no proposition to conditionalize on. Hmm. Also there''s the question of
  whether the expressivist can even accept Lewis''s triviality result as a "refutation"
  — Lewis''s result assumes conditionals are propositions in a Boolean algebra with
  a probability function; if you deny that from the start, the result is not a refutation,
  it''s a diagnosis / you can''t be refuted by an argument whose premises you reject.
  That''s a nice genuine tension: you can''t invoke a result as decisive evidence
  against truth-conditionalism while also saying truth-conditionalism was never on
  the table — that''s having it both ways. Actually more precisely: the tension is
  that the expressivist takes Lewis''s result to *establish* their view, but the result
  is derived *within* the truth-conditional framework; if the framework is incoherent,
  the derivation doesn''t transfer. Good — that''s subtle.


