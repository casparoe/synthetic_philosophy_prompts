  - Campbell''s law (1976/1979): "The more any quantitative social indicator is used
  for social decision-making, the more subject it will be to corruption pressures
  and the more apt it will be to distort and corrupt the social processes it is intended
  to monitor." That predates Goodhart and is often conflated.

  - The Lucas critique (1976): policy-invariance failure — parameters estimated from
  historical data aren''t invariant to policy change because agents'' behavior changes.
  This is directly relevant to baseball: the OBP-run relationship estimated from past
  data isn''t invariant once everyone optimizes OBP (players change their approach,
  pitchers change theirs, league scoring environment shifts). This is the "in the
  weeds" injection: distinguishing Goodhart-as-Lucas-critique (behavioral response
  to incentives) from Goodhart-as-measurement-error (regressional: the optimizer''s
  curse — selecting the max of a noisy estimate systematically overestimates true
  value). That distinction is *exactly* what the Moneyball case forces: Beane''s picks
  were partly regressional Goodhart (buying players whose noisy OBP overestimated
  their true run contribution — and indeed David Justice and Hatteberg declined) and
  partly causal/adversarial (players and other teams responding).


