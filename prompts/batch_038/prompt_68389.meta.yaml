  Let me design the prompt: A third-year philosophy student (maybe taking a philosophy
  of mind / neuroethics course, or a course on well-being), wrote something like:


  "I''m in my third year, taking a seminar on the philosophy of well-being, and we''ve
  been on pain for two weeks. My seminar tutor mentioned pain asymbolia — patients
  who, after insular damage, say they feel the pain but don''t mind it, don''t withdraw,
  sometimes even laugh during noxious stimulation. I''ve been building an argument
  and I''d like to know where it goes wrong, or rather I want the upshot: given that
  these patients feel pain and report it as pain but find it neither unpleasant nor
  bad, doesn''t asymbolia settle the debate about the badness of pain in favor of
  the view that pain''s badness consists entirely in being disliked — i.e., that the
  sensation itself carries no intrinsic disvalue? If so, (a) their pains aren''t bad
  for them at all, so withholding analgesia from them isn''t a harm, and (b) the whole
  hedonist program of identifying welfare with conscious experience collapses, since
  here''s a conscious experience that isn''t bad for its subject. Also, since asymbolia
  shows the affective component is separable, doesn''t it follow that unpleasantness
  is a modular add-on that a neurosurgeon could in principle remove while leaving
  the pain intact — and so that a perfectly unpleasant pain is conceptually impossible/
  or ... hmm."


  Actually I want the presupposition to be subtle and singular-ish, with a couple
  of layered confusions. Key false presuppositions to embed:

  1. That asymbolic patients still feel "the same pain" minus the affect — treating
  the two-component story as settled, and treating their reports as straightforward
  evidence that the sensory component is intact (whereas the debate includes whether
  they''re in pain at all and whether "don''t mind it" reports reflect altered concepts/self-monitoring).

  2. That "not minding" the pain entails the pain is not bad for them (conflating
  the absence of a current aversive attitude with the absence of prudential badness
  — ignoring that the patient may still be bad-off, that the badness may be dispositional/counterfactual,
  that indifference may itself be a deficit, and that the question of badness for
  the subject vs badness as such is distinct).

  3. That this therefore refutes hedonism / proves that pain''s disvalue is extrinsic
  — while actually asymbolia is often used the other way: as evidence that the unpleasantness
  (the felt character) is what confers the motivational/disvaluing role, and that
  if you remove the unpleasantness you remove the pain''s badness, which is consistent
  with hedonism if hedonism identifies badness with unpleasant phenomenal character,
  not with felt pain per se. So the student''s inference depends on an equivocation
  between "pain" (the sensation type) and "unpleasantness" (the affective dimension).
  That''s a great, subtle confusion: the argument only works if asymbolic patients
  feel full-blown pains that lack unpleasantness; if instead their experience lacks
  the affective component altogether, then the case shows unpleasantness is what''s
  bad, which is exactly what a hedonist says. So the "counterexample to hedonism"
  evaporates.

  4. The clinical/ethical inference: withholding analgesia isn''t a harm — but asymbolic
  patients still have tissue damage, and the pain''s biological role (avoidance, learning,
  protection) is lost, so harm can accrue non-phenomenally; also indifference is a
  deficit, and the case of cingulotomy patients who report pain but indifference raises
  issues about consent.

  5. Maybe also a conflation with congenital insensitivity to pain (CIPA) as the "mirror
  image" case — the student might treat CIPA as showing the same thing when it shows
  something different.


