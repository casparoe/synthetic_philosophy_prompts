  risk/ taste differences can be exhausted before private information; hence any subsequent
  trade must be information-based and zero-sum-ish, so rational agents won''t trade.

  - Implication: observed trade implies either heterogeneous priors, differing risk
  preferences, liquidity needs, or bounded rationality.

