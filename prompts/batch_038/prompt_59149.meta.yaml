  I write about science and tech for a general-interest magazine and I''ve got a long-form
  Q&A booked with an AI researcher who''s been circulating a proposal for how a deployed
  system should decide whose values to serve. I don''t want to spend the piece explaining
  alignment in general — I want to pin her to the specifics of her own scheme. Here''s
  the scheme as I understand it, and you should assume this is accurate:


  - She rejects the idea that the system should aim at neutrality among conceptions
  of the good life, on the grounds that neutrality is impossible. Instead it aggregates
  *burdens*: for any decision, each person''s stake is weighted by what it would cost
  them to go along with the alternative — what they''d have to give up, not how much
  they''d gain.

  - Her claim is that burdens are interpersonally comparable in a way that values
  aren''t. You can compare what people lose without having to rank what they care
  about.

  - There''s a floor: no coalition, however large its summed sacrifice, can force
  a small group to *act* against its core commitments. But the floor does not cover
  decisions that merely make those commitments expensive to sustain — those get compensated
  and logged, not vetoed.

  - The aggregation base is only people who currently have formed commitments: no
  future generations, no small children, no non-human or uploaded minds, because you
  can''t burden someone who has nothing to frustrate yet.

  - Every decision ships with a public ledger listing who is burdened and by how much,
  and she treats the publicity of that ledger as doing most of the normative work.


