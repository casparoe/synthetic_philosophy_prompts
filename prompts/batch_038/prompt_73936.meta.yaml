  Anscombe''s position: she argued that Truman''s dropping of the atomic bomb on Hiroshima/Nagasaki
  (choosing to kill the innocent as a means) was murder on a grand scale; she objected
  to the Oxford committee''s decision to award Truman an honorary degree while he
  was president; she debated with... she wrote "Mr. Truman''s Degree" (1958 pamphlet).
  Also her "Warfare" and the distinction between intentionally killing civilians and
  killing them as side effects. Her claim: it''s never permissible to intend the killing
  of innocents; the deaths of civilians as unintended side-effect could be permissible
  if proportionate. Also her debate about the double effect and the "means/side-effect"
  distinction, and the "you can''t get an ''ought'' from consequences."


  Key press-points in the literature: the doctrine of double effect; whether the intended/side-effect
  distinction is morally relevant (the terror bomber vs tactical bomber cases — though
  those come later, from... "terror bomber" cases are in the DDE literature, e.g.,
  Quinn, Foot, Thomson). Anscombe''s own view that the deaths were certain and thus
  "foreseen" — she''d say if you know for certain it''s a means, it''s intended. Also
  her response to consequentialist defenses: she rejects weighing consequences; she
  holds certain acts are simply never to be done. Also her view that the Allied bombing
  of Dresden and Tokyo was also wrong — she wasn''t just singling out Truman; she
  criticized area bombing generally. Also her point that Churchill also shares responsibility,
  and the "victors'' justice" issue: nobody prosecuted.


