  Draft:


  ---


  For the past several years I have co-taught a graduate seminar that pairs political
  economists with political theorists, and one exchange in it has become so predictable
  that the students have started to notice. It concerns the old incompatibility thesis,
  usually traced to Milton Friedman, to the effect that a country can have free movement
  of people or a generous welfare state, but not both. One side of the seminar answers
  with what open-borders advocates call the keyhole reply: grant arrival rights immediately,
  but decouple them from entitlement, so that new migrants work, pay taxes, and phase
  into means-tested benefits over a decade or two, with the social-insurance tiers
  already funded by contributions left untouched. On this view the incompatibility
  is an artefact of bundling two separable policies, and once you unbundle them the
  fiscal objection evaporates; Bryan Caplan''s version of the argument is the one
  the students usually bring. The other side answers that this misses the point, because
  their objection was never about the balance sheet. Redistribution, they say, is
  sustained by a willingness to transfer resources to people you will never meet and
  never repay, and that willingness depends on a sense of shared fate that a formally
  two-tiered membership is precisely designed to undermine: the keyhole regime does
  not preserve solidarity, it institutionalises the idea that the welfare state is
  a club good for a bounded set of insiders, which corrodes support for it among the
  insiders themselves. So the first side says the second side is making a sociological
  claim it cannot cash out; the second side says the first side has answered a question
  nobody asked.


  What frustrates me is that this is not really an argument about the numbers, and
  the numbers are not in much dispute. Everyone in the room knows that the sign of
  a migrant cohort''s net fiscal contribution depends heavily on accounting conventions
  — whether you run the balance statically or over a lifetime horizon, whether you
  include descendants, how you allocate the cost of education and of shared public
  goods — and that the same underlying data can be reported as a modest net cost or
  a modest net gain depending on those choices. And on the solidarity question, the
  two sides read the same contested literature in opposite directions: one points
  to cross-country and cross-state correlations between ethnic fractionalisation and
  lower trust or lower support for redistribution, and to the comparative account
  of why the American welfare state is thinner than the European ones (Alesina and
  Glaeser being the standard reference); the other replies that these correlations
  are confounded, that the American case is explained by race-specific history, the
  timing of enfranchisement, and labour-market structure rather than by heterogeneity
  as such, that within-country time series find weak or no effects once you control
  properly, and that the original trust findings have not replicated cleanly. Neither
  side budges, and I have watched this happen three seminar cycles running, with each
  side accusing the other of moving the goalposts.


  My working hypothesis, which I want you to test rather than endorse, is that the
  impasse is not empirical at all: the two sides are using ''the welfare state'' in
  different senses — as a schedule of programmes, as a fiscal balance sheet, and as
  a moral community held together by expectations of reciprocity — and every time
  one side offers evidence in the first sense the other hears an argument in the third.
  Is that right? Or is the real fault line about standards of evidence (what would
  count as a test of the diversity-solidarity hypothesis, given that we cannot run
  the experiment and cannot observe the counterfactual regime of open borders plus
  universal benefits)? Or is it about the correct baseline, since the policy package
  under dispute has never been implemented anywhere and both sides are reasoning about
  a world nobody has seen? Or is it, underneath, a normative disagreement about who
  should bear the burden of proof and the risk of error when a state''s claim is that
  admitting people would destabilise the institutions protecting its existing members
  — that is, about the moral asymmetry between insiders and would-be entrants, disguised
  as a prediction? Please diagnose the structure of the disagreement rather than surveying
  the literature or taking a side: identify which of these candidates is doing the
  most work, say what turns on the choice, and tell me what would count as progress
  given your diagnosis — a conceptual distinction, a better identification strategy,
