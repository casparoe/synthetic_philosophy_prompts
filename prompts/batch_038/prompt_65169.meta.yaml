  \ requires absolute integrability; otherwise undefined.\n\n- Counter: some argue\
  \ the ordering IS privileged because it's fixed by the game's description (trial\
  \ index n). But then, why does the Altadena game, which differs only in labeling,\
  \ get a different value? The labeling is part of the game's specification, so the\
