  \ 4th → +4, ... The corresponding EV series is -1 + 1/2 - 1/3 + 1/4 - ... = -ln\
  \ 2? No wait: contribution for n=1 is (1/2)(-2) = -1; n=2: (1/4)(2) = 1/2; n=3:\
  \ (1/8)(-8/3) = -1/3; n=4: (1/16)(4)= 1/4. So sum = -1 + 1/2 - 1/3 + 1/4 - ... =\
  \ -(1 - 1/2 + 1/3 - ...) = -ln 2. Yes. And the rearrangement point: the Altadena\
