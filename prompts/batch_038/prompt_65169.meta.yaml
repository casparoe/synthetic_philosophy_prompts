  \ ≈ ln 2, which is suspiciously close — but Hájek would say the capped game is a\
  \ different game and the uncapped one still has no EV.\n\n- Another angle: measure-theoretic\
  \ — expectation is defined as the integral, and for a conditionally convergent series\
