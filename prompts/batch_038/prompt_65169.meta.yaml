  \ payoff functions — so they're genuinely different games, no contradiction; the\
  \ rearrangement worry is about whether the series representation is canonical, but\
  \ the map from outcomes to payoffs is canonical. Hmm, that's a real substantive\
  \ point: the EV of a random variable X is defined as sum over outcomes of p(ω)X(ω);\
  \ the \"series\" ordering is an artifact of enumerating outcomes, but the sum over\
  \ an uncountable/countable set is defined only if absolutely summable — otherwise\
