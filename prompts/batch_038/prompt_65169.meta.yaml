  \ Hmm, partial sums do converge. So that's not a good point.\n\nBetter Round 4 for\
  \ Bob: the real problem isn't the arithmetic but the concept of expected value:\
  \ EV is defined as the Lebesgue integral, and the Lebesgue integral of a real-valued\
  \ random variable exists only when E|X| is finite; for the Pasadena variable E|X|\
  \ = ∞ (harmonic series diverges), so ∫X is undefined — not \"undefined as a Riemann-type\
