  \ undefined. But that's a fact about a formal device, not about the decision. What\
  \ matters is the long run: if you play the game many times, the average payoff per\
  \ play converges in probability to ln 2 (weak law), even though the strong law fails.\
  \ So the game has a \"weak expectation\" of ln 2, and that's the right notion for\
