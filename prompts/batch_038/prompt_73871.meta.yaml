  \ Also the converse (coherence theorem) requires the agent to accept *all* favorable\
  \ bets, which is a strong assumption; if you can refuse bets, coherent agents can\
  \ still lose money.\n\n2. Conflating representation theorems with normative claims:\
  \ Savage's theorem says preferences satisfying axioms are *representable* as maximizing\
