  \ belief states are dominated in accuracy — there's always a coherent alternative\
  \ that's more accurate in every possible world. So there is no room left: to be\
  \ incoherent is to be wrong by definition, and the theorem does all the normative\
  \ work.\"\n\nSubtle errors to embed:\n1. Conflating dynamic (diachronic) Dutch book\
  \ vulnerability with static incoherence — a Dutch book exploits a *sequence* of\
  \ bets accepted at different times under changing evidence, not a snapshot of beliefs.\
  \ Actually, a synchronic Dutch book exploits a single set of bets accepted simultaneously;\
  \ the diachronic one exploits updating. The popularizer might conflate: \"if your\
  \ beliefs are not probabilities you can be forced to accept a combination of bets\
  \ that guarantees you lose money, no matter what happens\" — actually a key point:\
  \ the agent is only guaranteed a loss if they accept all the bets; also the standard\
  \ argument requires the agent to be disposed to accept any bet with non-negative\
  \ expected gain (or at least positive). Also there's a subtlety: the loss isn't\
  \ \"no matter what happens\" — it's a net loss relative to not betting at all; the\
  \ Dutch book theorem says incoherent agents are vulnerable to a set of bets each\
  \ of which they regard as individually fair/favorable but which jointly guarantee\
