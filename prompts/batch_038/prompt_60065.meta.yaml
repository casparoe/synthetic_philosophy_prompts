  I like: Ulysses contracts and constitutional precommitment + thought experiment
  to specifications. Because there''s a genuinely subtle issue: the standard puzzle
  is whether a later self''s changed preferences should be overridden. Jon Elster''s
  discussion distinguishes Ulysses (who binds himself against predictable temptation
  but retains his "true" preference) from cases where the person''s values genuinely
  change (the "self-binding against a future self who has become someone else"). Also
  constitutional precommitment raises the "dead hand" / intergenerational problem
  (Jefferson''s "the earth belongs to the living"), and the debate over whether a
  constitution can bind future generations, whether amendment is the safety valve,
  and whether precommitment is even possible (Holmes: "precommitment is a misnomer";
  a constitution that can be amended by the same majority isn''t a real constraint).
  Also Rubenfeld''s "democracy and disbelief" argument: precommitment is incoherent
  for a people because the "we" who commits and the "we" who is bound are not the
  same agent; and the response that self-government is diachronic.


