  Draft:


  ---


  I am drafting a section of a book chapter on constitutional precommitment, arguing
  that the "dead hand" objection is in fact two distinct objections that are routinely
  run together, and I need a case that pulls them apart. My readers are legal theorists
  and political philosophers who have already met every standard illustration — the
  mast and the sirens, Jefferson''s arithmetic about generations, sovereign debt,
  the waste repository, entrenched rights — so the case must not be a reskinning of
  any of them.


  Please construct a paired thought experiment to the following specification.


  First, the two accounts the case must adjudicate, as I am defining them for this
  purpose:


  - The continuity account: an earlier decision binds a later body as an exercise
  of self-government only if the later body is, in the relevant sense, the same agent
  — continuous membership, continuous projects, continuous identity. If that continuity
  has broken, enforcing the earlier decision is not the polity governing itself; it
  is one set of people governing another, and the fact that the first set is gone
  removes the legitimating force.

  - The revocability account: a precommitment is genuine self-binding only if the
  bound party retains the capacity to undo it by a decision of the same kind as the
  decision that made it. What matters is not who the members are but whether an exit
  of the same democratic type remains open. Delays, supermajority thresholds, and
  second votes are forms of the same decision and so are compatible with self-rule;
  a provision that no future decision of that type can reach is an imposition regardless
  of how stable the membership has been.


  Second, the scenario requirements:


  1. Setting: any small-scale public body at which the whole electorate could plausibly
  vote on a charter amendment — a water district, a transit authority, a soil and
  water conservation district, a public hospital district. Not a nation-state, not
  a crisis.

  2. The entrenched provision must be fiscal or procedural, not a substantive right,
  so that the case does not secretly become a debate about judicial review of rights.

  3. No court may enforce it. The provision must bite through the arrangement itself
  — a bond covenant, an interlocal agreement, a condition in the state enabling statute
  — so that the question is not who gets to invalidate what.

  4. The later majority must be reasonable. Their reasons for wanting reversal should
  look at least as good as the reasons for the original provision; no short-termist
  mob, no obvious villain.

  5. The original decision was well informed and aimed at a predictable failure —
  but the failure did not materialize as predicted, so the provision now binds for
  reasons its authors could not have endorsed. It should not have been foolish when
  adopted.

  6. In the base case the two accounts must give opposite verdicts on whether enforcement
  is legitimate.

  7. Then give a twin case that differs in exactly one feature, with everything else
  — setting, personnel, arithmetic, motives — held fixed, such that the revocability
  account changes its verdict while the continuity account does not. State in one
  sentence which feature was varied.


