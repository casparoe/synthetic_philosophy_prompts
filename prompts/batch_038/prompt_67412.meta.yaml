  Paragraph 1 (context + position):

  "Last month I sat through a workshop session in which a prison historian told the
  room that the archival record simply does not support the picture of the nineteenth-century
  penitentiary that most of us absorbed from Discipline and Punish: the timetables
  were honored in the breach, hierarchical observation was chronically understaffed,
  examinations were perfunctory, and the cellular regime spread for reasons of budget,
  overcrowding, and administrative convenience as often as for any logic of docility.
  My reply at the time was the one everyone gives — that Foucault''s claim is not
  that the machine ran smoothly, and that his account of delinquency explicitly treats
  the prison''s documented failures as part of what the apparatus accomplishes. Since
  then I have become less sure that this reply is a defense rather than a surrender,
  and I want the case against my position laid out properly.


  The position is this: Foucault''s account of disciplinary power is a general analytic,
  not a local history. Power on this picture is exercised rather than possessed, capillary
  rather than concentrated in a sovereign; it produces its objects (the delinquent,
  the hysteric, the schoolchild, the soldier) rather than repressing pre-existing
  ones; and the techniques that carry it — hierarchical observation, normalizing judgment,
  the examination, the distribution of bodies across space and time — travel promiscuously
  between the prison, the school, the barracks, the workshop, and the hospital. Knowledge
  of these populations and the mechanisms that act on them are mutually constitutive,
  so there is no neutral observational standpoint from which to describe them. Crucially,
  and this is the commitment I most want pressure applied to: institutional failure
  is not evidence against the analysis, because the gap between the reformers'' stated
  aims and the effects actually produced is precisely what the analysis was designed
  to expose."


  Paragraph 2 (the ask):

  "So: what would count against this? I want the map of exposure, not a survey of
  Foucault criticism. Concretely, please address (i) which historical or archival
  findings would be decisive as opposed to merely inconvenient — for instance, an
  institution that implemented the full diagnostic battery and generated neither new
  knowledges about its population nor any normalization of conduct, or a colonial
  prison system in which the metropolitan reform vocabulary was absent and the exploitative
  logic explicit, which seems to reintroduce just the interested agents the account
  is meant to dissolve; (ii) the conceptual defeaters, in particular whether the productivity
  thesis can be distinguished at all from the functionalist claim that whatever persists
  must have functioned, whether the power/knowledge coupling leaves Foucault any ground
  from which to treat his own archival findings as knowledge rather than as further
  effects, and whether the absence of a subject makes the account unfalsifiable in
  principle rather than merely difficult to test; (iii) what the disciplinary analysis
  predicts that its rivals do not — the juridical-sovereign model, the instrumentalist
  class account, the rational-choice story about reform as cost-efficiency, and the
  straightforward humanitarian-reformist narrative; and (iv) how much of the position
  has already been conceded by Foucault''s own later work, where governmentality and
  the conduct of conduct take over from discipline and the final volumes of the history
  of sexuality, published in 1984 shortly before his death, describe individuals working
  on themselves in ways that look a great deal like the agency the earlier account
