  Draft:


  "I am trying to pin down what I actually believe about the difference between several
  people doing one thing together and several people doing their own things alongside
  one another. I have read enough of the standard debate to know that the familiar
  accounts locate the difference inside the participants — a shared plan with meshing
  sub-plans, an irreducible intention with a plural subject, a we-intention held by
  each. My own instinct runs the other way, and I would like it tested rather than
  merely reported.


  My tentative principle: what makes an activity joint is not any state of anyone''s
  mind but a standing entitlement to repair. People act together just in case, when
  the shared course of action starts to come apart, each participant is entitled to
  require of each of the others that they get it back on track, and each is answerable
  to the others for their own part in its coming apart. Three things I mean by this,
  which I want examined rather than assumed: the entitlement is practical rather than
  moral (it is exercised by a look, a word, a shrug, a repeated phrase, an exasperated
  silence — and it need never actually be exercised); it must run in both directions,
  so that a party who can only be demanded of, or only make demands, is not a participant
  but an instrument or a superior; and it is directed at the maintenance of the activity,
  not at the value of its outcome.


  Here are my verdicts...


  Then numbered cases. Then the deliverable paragraph.


  Let me write the cases:


  1. Two strangers in a cafeteria both lunge for a tray a child has knocked off the
  counter; between them they steady it, the child''s milk survives, and they walk
  away without speaking. There was nothing beforehand and nothing afterward — the
  whole episode lasts four seconds, and neither could rebuke the other for anything,
  there being no time to come apart. I am certain this is two people doing one thing
  together.


  2. A faculty committee of nine issues a report whose central recommendation is one
  that, asked individually, no member would endorse; several privately think it wrong.
  Yet every one of them says, without strain, that we recommended it, and the chair
  routinely tells members who drift that the committee needs them back at the table.
  Clearly joint, and the most obvious case on my list for my principle.


  3. A couple have made Friday dinner together for twenty-two years. It has never
  been planned, agreed, or discussed; if one is not in the kitchen by six the other
  is surprised and mildly aggrieved. Joint, obviously; and here the entitlement to
  repair is real but has essentially never been exercised in words.


  4. A stadium crowd runs a wave. If I stay seated, my neighbors hiss, elbow me, and
  gesture for me to stand — the repair entitlement is exercised loudly and publicly.
  And yet I do not think the wave is an action of the crowd; I think it is sixty thousand
  separate amusements that happen to interlock. My principle appears to say otherwise,
  and I am not prepared to give up the verdict.


  5. A flash mob: three hundred strangers rehearse separately, by video, over six
  weeks, and perform once in a station concourse. At the moment of performance nobody
  present has any standing over anybody else, and afterward they disperse forever.
  I want to say the performance is joint action; my principle seems to have to locate
  the entitlement in the six weeks of rehearsal, which were not the action at all.


  6. Two climbers roped together on a face. One has decided that if the other slips
  he will cut the rope. Every outward mark of the entitlement is in place; the internal
  commitment is absent. My verdict is a disjunctive one that I suspect is unsound:
  it is joint action, but void, the way a promise made with the fingers crossed is
  a promise.


  7. A mob dragging a man from a jail. Mutual belief is total, everyone intends that
  we kill him, and the repair norms are ferocious: the man who hesitates is shoved,
  jeered, and named a coward. My principle says joint action, and I agree it is joint
  action. But I am not content, because the principle seems able to register the jointness
  only by treating the mob''s norms as legitimate entitlements, and I do not think
  they are legitimate at all. I want to know whether ''entitled'' in my principle
  is doing internal work (entitled by the participants'' own lights) and whether that
  is a flaw.


  8. A person drafting a document with a language model that never refuses, never
