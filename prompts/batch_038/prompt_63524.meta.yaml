  Structure:

  - Framing: I''m trying to work out what I actually believe about when a number of
  people do one thing together rather than doing their separate things side by side.
  I''ve arrived at a tentative principle of my own and a set of verdicts; I want the
  principle tested, repaired, or replaced.

  - The tentative principle stated precisely: repair-and-rebuke / maintenance-accountability
  account. Include the details: (i) the entitlement is practical not moral; (ii) it
  must be mutual; (iii) it must be exercisable — i.e., each participant must be someone
  on whom a demand can be made and by whom one can be made; (iv) it''s directed at
  maintenance of a course of action, not at outcomes.

  - The verdicts, numbered, concrete, with a note on which ones are shaky.

  - The explicit tension: cases 1 and 4 (or whichever) pull apart.

  - The deliverable: a principle (or two or three candidates), clause by clause, each
  clause tagged with the case(s) that force it; verdicts on unlisted cases I supply;
  and an honest list of verdicts that must be surrendered; plus a judgment about whether
  the simpler principle that costs me a verdict beats the baroque one that saves all.

  - Also ask: whether the principle has the resources to distinguish the fraudulent
  climber case, and whether the "entitlement" must be legitimate or merely mutually
  acknowledged (lynch mob).

  - Note: no bibliography needed; may name familiar accounts if useful.


