  expulsion from the union; a parent and a four-year-old playing pirates; and two
  people who have played one game of correspondence chess a week for thirty years
  and met only once. Say plainly which of my nine verdicts your account cannot keep,
  and for each, whether it must be overturned or merely re-described. Where I have
  asked for a disjunctive verdict (case 6) or for two verdicts that look like they
  should match (case 8), tell me whether the disjunction is sustainable or a symptom.


  Finally, make a judgment call I have not been able to make. There is a simple principle
  in this neighbourhood — something like: joint action requires that each participant''s
  contribution be governed by a standing expectation the others can enforce across
  a stretch of time in which the activity could degrade — and it costs me the cafeteria
  tray and probably the flash mob, while clearing up the wave and the chatbot in a
  single stroke. My baroque alternative saves more of my verdicts at the price of
  several clauses whose only justification seems to be the verdicts themselves. Tell
