  ---


  I audited a joint seminar between our philosophy of science group and a philosophy
  of biology group last term. Toward the end of one session, on Popper''s changing
  assessment of Darwinism, two participants — I''ll call them Miriam and Daniel —
  had an argument that went through several rounds, and I took notes because neither
  would concede anything. I''m reproducing the exchange as faithfully as I can, with
  the moves numbered.


  1. Daniel: Popper''s original objection was that the principle of natural selection
  is nearly tautological, because fitness is defined in terms of actual survival and
  reproductive success, so the principle amounts to saying that those who survive
  are those who survive. He withdrew that objection in the mid-1970s, conceding that
  the theory is testable, though difficult to test. Then, a few years later, he went
  back on the withdrawal and characterized Darwinism as a metaphysical research programme
  rather than a strictly testable theory. Daniel''s conclusion: the vacillation is
  the interesting datum. A demarcation criterion that yields three different verdicts
  on the same body of theory within a few decades, with no corresponding change in
  the biology, is not tracking anything.


  2. Miriam: This misreads Popper''s vocabulary... For Popper "metaphysical" is not
  a term of abuse; he spent his career rejecting the positivist equation of metaphysical
  with meaningless, and he repeatedly argued that unfalsifiable but fruitful programmes
  — atomism is his standard example — have driven science forward more than premature
  testability has. Testability also comes in degrees on his account, and can increase
  as auxiliary hypotheses accumulate. So the later characterization is not a demotion
  and not a reversion: it is a claim about the framework, while the retracted tautology
  charge was a claim about a principle. Two objects, two verdicts, no contradiction.


  3. Daniel: That distinction rescues the criterion at the cost of emptying it. If
  the framework is itself never testable and only the hypotheses generated within
  it are, then the framework has no content beyond being a name for a family of testable
  claims; and any theory whatsoever can be immunized by assigning the tested parts
  to "descendants" and the untestable residue to the "programme." He added a second
  charge: Miriam is sliding between two distinct objections. That natural selection
  is tautological is a semantic claim about how a term is defined. That it is unfalsifiable
  is a methodological claim about the absence of potential falsifiers. These come
  apart — a principle can be non-tautologous and yet untestable, and a tautologous
  schema can sit inside a highly testable research programme. Popper conflated them
  from the start, which is why his verdict kept moving.


  4. Miriam: The distinction is real, but it cuts against him. What made the tautology
  charge tempting was never a definition; it was an observation about the order in
  which evidence arrives. Adaptive explanations are often constructed after the outcome
  is known, so the attribution of function is calibrated to the result. Popper had
  exactly the notion needed: what matters is whether a prediction was made in advance
  and was risky. On that reading his late position is not a weakening at all — it
  says Darwinism is valuable as a machine for generating risky predictions, which
  is what he always valued metaphysical programmes for.


  5. Daniel: Then Popper has conceded the substance to the biologists who accused
  him of misreading them, and merely re-clothed the concession in his own terminology.
  He posed a challenge: name one empirical finding that would have led Popper to say
  Darwinism had been falsified rather than revised.


  6. Miriam: She said the honest answer is that there is no such finding, and that
  this is a feature of frameworks generally, not a defect peculiar to Darwinism. Daniel''s
  challenge, pressed consistently, would also demolish Newtonian mechanics, since
  no single experiment can falsify a theory without assumptions about initial conditions,
  instrument reliability, and background hypotheses absorbing the blow.


