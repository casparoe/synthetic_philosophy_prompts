  Move structure:


  (1) Daniel: Popper''s early objection was that the selection principle is close
  to tautological because fitness is defined by actual reproductive success, so the
  principle reduces to "those who survive, survive." He later withdrew that objection,
  conceding the theory is testable though hard to test. Then, late in his career,
  he reverted, describing Darwinism as a metaphysical research programme. Daniel says
  the final position shows the retraction was half-hearted, and that the whole sequence
  is evidence the falsifiability criterion cannot handle historical sciences — Popper
  kept flip-flopping because his criterion has no grip on this case.


  (2) Miriam: No — the sequence is not flip-flopping but a consistent view with a
  refined vocabulary. For Popper, being metaphysical is not a demerit; he explicitly
  rejected the positivist identification of metaphysical with meaningless, and he
  praised unfalsifiable-but-fruitful programmes (atomism being his stock example)
  as often more productive than prematurely testable ones. Also, Popper held that
  testability comes in degrees and that a theory''s status can change as auxiliary
  hypotheses develop. So calling Darwinism a research programme is compatible with
  calling parts of it severely testable. On her reading, the retraction and the reversion
  are about two different objects: the general framework versus the particular selectionist
  hypotheses generated within it.


  (3) Daniel: That distinction is a rescue. If the framework is never itself testable
  and only its descendants are, then the framework is doing no explanatory work —
  it''s a label for a family of testable claims. And Miriam''s reading makes Popper''s
  criterion empty: any theory can be saved by saying the tested parts are its descendants
  and the untested residue is a "programme." He also says: the tautology charge and
  the unfalsifiability charge are different, and Miriam is sliding between them. The
  tautology charge is a logical/semantic point about how fitness is defined; the unfalsifiability
  charge is methodological, about whether there are potential falsifiers. A theory
  could be non-tautologous yet untestable, or tautologous yet embedded in a testable
  framework. Popper conflated them from the start, and that''s why he kept changing
  his mind.


