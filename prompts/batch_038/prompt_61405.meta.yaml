  Draft:


  "Suppose an agent prefers A to B, B to C, and C to A. Suppose she begins holding
  A, and that a trader offers her a sequence of swaps, each costing a small fee ε:
  since C ≻ A she pays ε to swap A for C; since B ≻ C she pays ε to swap C for B;
  since A ≻ B she pays ε to swap B for A. She ends the sequence holding exactly what
  she started with, but with 3ε less. She has been made worse off, and worse, she
  has been made worse off by a series of choices each of which was, taken one at a
  time, exactly what her preferences called for. The outcome she reaches is dominated:
  there was an alternative — simply declining the first swap — that was better no
  matter what.


  Like the Dutch book theorem, the money pump is a consistency result rather than
  an empirical claim: it shows that cyclical preferences guarantee a loss whatever
  else the agent does. That is why it is usually taken to establish transitivity as
  a requirement of rationality and not merely as a piece of advice.


  There are, however, background assumptions. The pump needs the agent to prefer more
  money to less, and it needs the ε-fees to be the only costs of the swaps. It also
  assumes that her preference between two options is unaffected by which one she currently
  holds — an agent with a status-quo bias would decline the first swap, and would
  never enter the pump. And since ε can be made arbitrarily small, the pump shows
  that even a barely detectable cycle costs the agent almost nothing, which suggests
  that the argument cannot be doing the work its partisans want: a rationality requirement
  should track the seriousness of the error, and this one does not.


  The obvious response to the pump is foresight. A sophisticated agent, one who sees
  the whole sequence in advance and reasons backwards, declines the first swap, since
  she knows where it leads. So the money pump does not show that cyclical preferences
  are irrational; it shows only that cyclical preferences combined with myopia are
  exploitable. McClennen''s resolute agent reaches the same destination by a different
  route: she binds herself in advance to a plan, in the way Ulysses binds himself
  to the mast, and then carries the plan out at each node rather than choosing afresh.
  But the pump is stipulated so that no one can restrict the agent''s later options,
  so there is no device available to her, and resolute choice collapses into myopia
  with extra steps. Neither sophistication nor resolution, then, rescues the transitivity
  axiom; the pump only ever threatens an agent who cannot see what is coming."


