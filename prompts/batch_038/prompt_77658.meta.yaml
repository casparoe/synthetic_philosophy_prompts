  I''m the intake lead at a community mental health clinic and I''ve ended up on two
  committees now that revise our forms, and I''ve been trying to figure out when a
  diagnostic label actually changes the people it''s applied to versus when it''s
  just a change in what the paperwork says. I read some Hacking on looping years ago
  and it felt right but I can''t tell whether it''s tracking a real distinction in
  my own case list. Here are my verdicts, going by what I''ve actually seen.


  When Asperger''s got folded into autism spectrum disorder, a lot of adults who''d
  built an identity on the old word lost something real, and the term went underground
  and came back as a badge — that looped, the classification changed the people. When
  "mental retardation" became "intellectual disability," I don''t think anybody''s
  inner life moved an inch; it only changed what other people are allowed to say out
  loud. Those two are both euphemism cycles and they came out opposite, and that bothers
  me.


  Multiple personality in the 80s: the caseload exploded the moment clinicians started
  asking about alters, and I''ll say flat out the category made the condition. Depression
  in primary care once the pills and the screening questionnaires arrived: the numbers
  exploded just as hard, but I won''t say the category made the condition — those
  people were miserable before, we just started counting. Same epidemiological shape,
  opposite verdict from me, and I can''t defend the difference.


  PTSD: the diagnosis was pushed in by veterans'' advocacy, i.e. politically made,
  and still I think it fit what was there. So a loop can be a discovery rather than
  a distortion.


