  and nobody''s told. I think that loops, because the flag changes what we offer them
  and that changes what they turn into. But I also think if we ran the flag and never
  acted on it and never told anybody, nothing at all would happen. So it seems like
  self-consciousness isn''t the trigger, which surprises me.


