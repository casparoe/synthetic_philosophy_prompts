  time in school, a disability determination — I watch reported symptom profiles drift
  toward the criteria and I call that contamination: the measure stops measuring.
  When a label unlocks a community and a way of describing yourself — autism — I watch
  exactly the same drift and I call it people finally saying what was true all along.
  I don''t think I''m just being inconsistent for political reasons, but I can''t
  state what I''m keying on.


