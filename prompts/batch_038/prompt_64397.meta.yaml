  Type: "Ask why a debate has stalled and what kind of disagreement it really is."


  Structure:

  - Describe the debate concretely: SSA camp (Christiano-style) says the assumption
  is at least a reasonable working default and that it undercuts doomy stories in
  which a misaligned AI out-strategizes humanity; skeptics say it''s false in the
  cases that matter — alignment tax, humans can''t comprehend the strategy, coordination
  failures, asymmetric harms, one-time advantage.

  - The asker''s hypothesis: the impasse is a transfer failure — the name imports
  a load-bearing premise from combinatorial game theory (monotonicity: an extra move
  is never a disadvantage; symmetry of the players'' move sets; no draws) that is
  exactly what''s in dispute in the AI case, so the two camps are not disagreeing
  about a fact but about whether a proof schema''s hypotheses are satisfied — one
  camp treats them as approximately satisfied, the other treats each as an open empirical/computational
  question.

  - Ask: diagnose — is this a verbal dispute over "strategy" (a complete plan in a
  fully specified finite game vs. an institutional practice, a disposition, a research
  program), over "stealing" (comprehension + implementation + timing, not mere existence),
  over "analogous"? Is there a hidden empirical question (can the aligned side identify,
  comprehend, and execute within the relevant window)? Is one side answering "what
  should we work on" and the other "what is likely true"? What would count as progress
  — a stated set of conditions under which transfer is valid, a formalization, a case
  study?


  Keep it relatively short and formal. Maybe ~200-280 words. The example prompts are
  around 100-150 words. Mine can be a bit longer since it must describe the debate
  concretely. Let''s aim ~200 words.


