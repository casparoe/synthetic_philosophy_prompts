  Retired condensed-matter physicist here, 40 years doing thin films and transport
  measurements, and for the last two years I''ve been reading philosophy of mind for
  fun with an old friend who was a renal physiologist. We''ve hit a wall on the apparent-motion
  case that Dennett likes: two dots of different colors flashed a tenth of a second
  apart at different places on a screen, and people reliably report having seen a
  single dot travel between the two spots and change color somewhere in the middle
  of the trip — even though the middle of the trip was never on the screen at all.
  The two stories they tell about it are, as I understand them: (a) the brain holds
  off committing to what happened until the second dot shows up, and then produces
  a finished narrative in which the color changed mid-flight, so the subject never
  actually had an experience of the first color persisting through the gap; and (b)
  the subject did see the first color right up to the second dot, and the memory of
  that got overwritten afterwards, so the report is a false memory rather than a constructed
  content. The labels for these are Orwellian and Stalinesque, from Dennett and a
  neuroscientist named Kinsbourne, and the whole point of the pair is that no subject
  could ever tell them apart from the inside: both predict exactly the same report.
  Which seems to me like a strange place for an empirical dispute to be sitting.


  Here''s what I want to think about, and I''d like you to take the role of a philosopher
  of mind who has actually argued about the timing of experience, not someone summarizing
  a textbook. The dispute has been running for thirty-plus years and nobody has conceded
  anything. Each side accuses the other of either ignoring the data or of making a
  claim that no possible observation could touch, and both accusations seem to have
  some force. My working hypothesis — offered as a hypothesis, please try to break
  it — is that this isn''t a disagreement about timing at all. It''s a disagreement
