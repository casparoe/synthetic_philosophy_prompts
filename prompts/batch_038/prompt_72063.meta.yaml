  art seminar that spent a month on Tolstoy''s What Is Art?, and the month has done
  something to me I cannot undo. I now find myself largely convinced by his account
  — that art is the deliberate communication of a feeling the artist has experienced,
  that it succeeds to the degree that others are infected by it, that the strength
  of the infection depends on the individuality of the feeling, its clarity, and above
  all the artist''s sincerity, and that the value of art depends on which feelings
  it transmits and how many people can catch them. I am convinced by his rejection
  of beauty as the criterion, by his impatience with obscurity, and by his claim that
  an art addressed to a small cultivated class is a corrupted art. I am also aware
  that he applied these standards without mercy: he dismissed Shakespeare, Beethoven''s
  late symphonic writing, Wagner, and most of his own fiction, while praising Uncle
  Tom''s Cabin, Dickens, and peasant songs.


