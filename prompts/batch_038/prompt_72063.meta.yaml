  be admired by eleven people. Two of my professors, whose work I love and whose kindness
  to me I cannot repay, would fare no better under his criteria. So the address I
  have to give is, on the account I have come to hold, a ceremony honoring a great
  deal of bad art, funded by a collector whose prize rewards exactly the vices Tolstoy
