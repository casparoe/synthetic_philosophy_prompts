  The Meno problem: Socrates asks why knowledge is more valuable than true belief,
  since true belief is as good a guide as knowledge for action (the road to Larissa).
  Answer in the Meno: true beliefs are like the statues of Daedalus — they run away
  unless tethered by an account of the reason why (aitias logismos), so knowledge
  is more valuable because it''s more stable/permanent.


  Contemporary: Linda Zagzebski formulated the "swamping problem" using an analogy:
  a reliable coffee maker is not more valuable once you have good coffee — the value
  of the reliable source is "swamped" by the value of the product. Alvin Goldman and
  Erik Olsson responded with the "conditional probability solution": reliable processes
  raise the probability of future true beliefs, so reliabilism escapes swamping (that''s
  actually a response defending reliabilism''s value, arguing knowledge has instrumental
  value via future true beliefs). Jonathan Kvanvig argued the value problem is a pseudo-problem
  / that the value of true belief swamps, and proposed "value pluralism" — knowledge
  has a distinct kind of value (in terms of the whole, the "point" of our cognitive
  lives) not reducible. Duncan Pritchard: "epistemic value pluralism," distinguishing
  final value from instrumental value; he argues knowledge is finally valuable. Timothy
  Williamson: knowledge-first — knowledge is a sui generis mental state, not analyzable;
  its value may be explained by its role (action explanation: knowing is a reason
  for action, and knowledge is the norm of assertion). Wayne Riggs argued the swamping
  problem relies on a "value monism" assumption (that epistemic value is only the
  value of truth) and that once you allow non-instrumental value, reliabilism can
  explain the extra value. Also there''s the "secondary value problem" (Kvanvig/Meneses):
  why is knowledge better than merely reliably produced true belief? And Craig''s
  account in Knowledge and the State of Nature: the practical value of identifying
  reliable informants — knowing is tied to being a good informant.


  So the two camps for the adversarial collaboration:

  Camp 1: The "swamping" camp — think that, on the standard reliabilist/JTB-style
  analysis, the value problem cannot be solved: the value of true belief swamps the
  value of the process, so knowledge is no more valuable than mere true belief (or
  the question is malformed). E.g., Zagzebski''s diagnosis; Kvanvig''s deflationary
  diagnosis of the value problem as arising from a bad analytic project.

  Camp 2: The "knowledge-first" camp — Williamson-style: knowledge is not a composite
  of belief + truth + something; it''s a fundamental state whose value doesn''t inherit
  from parts, and it plays distinctive roles (norm of assertion, reason for action,
  explanation of action). So the swamping argument begs the question by assuming compositionality.


