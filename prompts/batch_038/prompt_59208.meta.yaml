  ---


  I''m a senior in an epistemology seminar on the value of knowledge, and our section
  has split into two camps that have spent six weeks talking past each other. Our
  professor has asked us to produce, in writing, the document an adversarial collaboration
  between the two camps should yield, and I''ve been given the job of drafting it.


  The two camps:


  Camp A — the dissolvers. They accept the swamping argument in its standard form:
  if a belief is true, the reliability of the process that produced it adds no further
  value, in the way that a good cup of coffee makes the reliability of the machine
  that brewed it beside the point. So they hold that the project of finding some extra
  value in knowledge over mere true belief is misconceived — either knowledge really
  is no more valuable than true belief, or the question is malformed because it presupposes
  that knowledge is a composite whose value should be built up out of the values of
  truth, belief, and a reliable source.


  Camp B — the knowledge-first camp. They hold that knowing is a state in its own
