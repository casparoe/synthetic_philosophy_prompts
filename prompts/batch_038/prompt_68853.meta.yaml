  You''re a philosopher of mind and animal ethicist who''s also comfortable with comparative
  neuroanatomy — the sort of person who can read a neuron-count table without getting
  bullied by it. Please think carefully. Before you give me the diagnosis, spend some
  words brainstorming: list the four or five distinct ways an argument of this shape
  usually fails (bad measure, scope shift, scalar/threshold confusion, invalid final
  inference, whatever else), check each against the steps, and only then commit to
  one diagnosis.


  Here''s the argument my reading group built. It''s supposed to show that brain size
  is morally relevant — that it should make us revise our view of which animals matter
  — but the person who built it says she doesn''t accept where it lands, and neither
  does anyone else, so we need to know where it breaks.


  (1) If some capacity C is what makes a being''s interests count for something, then
  any reliable measure of C inherits that moral significance, and we should weight
  moral status by the measure.

  (2) C is cognitive capacity: sentience, the ability to suffer, to have plans, social
  bonds, selfhood — take your pick, the argument is meant to run for all of them.

  (3) Absolute brain size is the best measure of cognitive capacity available across
  species, and the version of "size" that actually predicts behavioral flexibility,
  tool use, mirror self-recognition and so on is not gross mass but neuron count.

  (4) The data (putting it in here so nobody has to look it up): an African elephant''s
  brain weighs about 4.6 kg, roughly three times a human brain, and holds about 257
  billion neurons to our 86 billion — but 97.5% of those are in the cerebellum, and
  its cerebral cortex holds only about 5.6 billion, a third of the ~16 billion in
  a human cortex, even though the elephant cortex is about twice the mass. On encephalization
  quotient, humans score around 7–8, cetaceans around 3, African elephants around
  1.3. Parrots and corvids ace many of the same tests with walnut-sized brains.

  (5) So by mass, elephants and large whales outrank humans; by neuron count, humans
  outrank elephants; by EQ, humans outrank cetaceans and cetaceans outrank elephants;
  and any two of these rankings disagree about who matters more.

  (6) Whichever of them we use, moral status comes out as a scalar quantity that varies
  by species, and we are obliged to weight individual interests accordingly — so a
  wildlife management decision should count one elephant (or one whale) for more than
  one person, in proportion to the ranking.

  (7) Nobody in the group accepts (6), and certainly not the intra-species version,
  since (1) applies just as well to differences in cortical volume and neuron count
  between individual humans, which would have us ranking people by MRI.

  (8) Therefore brain size is not morally relevant after all, and (3) is false — none
  of these measures tracks anything morally significant.


  The thing I can''t shake: (8) feels like it fires at the wrong premise. I''d happily
  keep (4), it''s just data, and I''d rather keep (2) than (6). But if (8) is false,
  then brain size is relevant somehow, and I can''t say how without re-running the
