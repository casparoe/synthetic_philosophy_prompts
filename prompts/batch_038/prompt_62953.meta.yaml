  makes such a sentence true. But the practice of ascribing functions — I''ll argue
  from a real one, genomic annotation — writes them as four-place: function(T, F,
  S, H) — trait, capacity, containing system, history-index. Once you see that, the
  two theories aren''t rivals about the truth-conditions of one-place predicates;
  they''re two different ways of fixing the H slot. Etiology says H is filled by a
  lineage. Causal role says H is left blank/defaulted: it''s a claim about the system
  as it is now. That''s why they seem to conflict: they''re both being read as claims
  with H suppressed.


