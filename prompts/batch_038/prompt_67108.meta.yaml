  Conceptual problems the procedure must handle (this is where the "in the weeds"
  comes in):

  1. The numbers/scale problem: how to compare a welfare gain for 1.5 million salmon
  against one for 40 million shrimp, given very different per-capita evidence.

  2. The evidence–precaution problem: must not let uncertainty justify inaction, but
  also must not let precaution swallow all budget. So the procedure needs a rule for
  how much weight contested evidence gets, and a "no-regret" class of measures that
  are justified regardless of sentience (e.g., water quality, handling stress, avoiding
  chronic injury) — i.e., decouple "is it sentient?" from "should we do X?" for a
  subset of measures.

  3. The measurement problem: welfare indicators that are cheap to measure (mortality,
  growth, FCR, deformity rate) are confounded with productivity, so a procedure that
  ranks by measurable indicators will systematically favour interventions that also
  boost yield — and will thereby fail to detect genuinely welfarist costs of, e.g.,
  higher stocking density... wait, higher stocking density boosts yield but hurts
  welfare. Hmm. The confounding: interventions that improve welfare often improve
  productivity, so a company may fund them for the wrong reason; the procedure needs
  a step that identifies measures that are welfare-improving but productivity-negative
  (that''s where the real test of commitment is).

  4. The killing/end-of-life problem: for shrimp, slaughter at scale is often by ice-slurry
  immersion, which is slow and aversive for cold-intolerant tropical species; alternatives
  (electrical stunning in a brine bath, mechanical, chilling with care for temperate
  species) are contested. For salmon, percussive/electrical stunning is standard and
  better. The procedure should include a step on time-to-loss-of-sensibility and on
  species-appropriateness (what is humane for a temperate fish may be cruel for a
  tropical crustacean).

  5. The "who signs off" problem: which steps require a human decision on values (e.g.,
  the trade-off ratio between species, whether to accept a productivity loss).


