  \ quotes for a fictional person's phrasing is safe. The rule is about real texts.\
  \ Quoting an invented curator is fine.\n\nAlso: \"But they also shouldn't refer\
  \ super niche theories/ideas/facts that LLMs won't have properly memorized.\" I\
