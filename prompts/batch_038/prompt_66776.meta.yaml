  ---


  Okay so background: I work about 20 hours a week doing processing at a county records
  office — mostly rehousing stuff, writing finding aids, the usual — and last year
  our state board made every repository do this "representational adequacy self-assessment,"
  a 40 page compliance document where you''re supposed to score yourself on how well
  your holdings cover the communities you serve. Reading it was the weirdest experience
  of my archival career. It''s completely sincere and it''s also, structurally, a
  document in which an institution tries to measure its own blind spots using the
  exact instruments that produced the blind spots. Nobody involved seems to notice.
  I want to turn that feeling into a satire piece, and I think it needs to be written
  from inside the genre rather than about it.


  So: write me a mock internal compliance report — call it something like a Representational
  Adequacy Self-Assessment, Cycle 3 — from an invented county archive, maybe 850-1000
  words, formatted like the real thing: numbered sections, findings, a couple of scored
  indicators with last cycle''s numbers next to this cycle''s, a corrective action
  plan with owners and target dates, a sign-off block. Voice is completely deadpan,
  zero winking, no asides to the reader. The humour has to come from the content being
  exactly right. What I want it to dramatize, without ever naming any of it as a thesis:
  the idea that silencing happens at several distinct points — whether something gets
  written down at all, whether it gets kept, whether it gets described in a way that
  makes it findable, and whether anyone later decides it matters — and that an archive
  can only ever work on the last two, which is why its metrics keep coming out looking
  like progress. Also: that the records which survive about a poor or policed or enslaved
  or institutionalized community are overwhelmingly records made *by* the people administering
  them — intake books, ledgers, day books, schedules, case files — so "increasing
  representation" quietly means acquiring more surveillance paperwork; that description
  standards tell the archivist to reproduce the creator''s own arrangement and wording
  and forbid editorializing, so the finding aid ends up speaking in the voice of whoever
  made the file; that a community collecting drive requires donors to show up with
  provenance, dates, and rights they can clear, which filters out precisely the people
