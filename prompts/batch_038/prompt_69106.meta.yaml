  picture of the transaction was), Pressure (how much real room there was to refuse),
  and Capacity (how far the party''s decisional abilities were intact at the time)
  — each from 0 to 10. Three rival hypotheses about how validity relates to those
  scores should be live by the end of the session:

  - Additive: validity tracks a weighted sum; a deficit on one dial can be paid for
  out of surplus on another.

  - Floor: each dial has its own threshold, and falling below it invalidates consent
  no matter how high the others stand; above the floors, further surplus does no normative
  work.

  - Shifting floor: the thresholds are not constants but move with the stakes of the
  transaction and with the relationship between the parties, so the Capacity score
  that suffices for agreeing to be photographed does not suffice for agreeing to a
