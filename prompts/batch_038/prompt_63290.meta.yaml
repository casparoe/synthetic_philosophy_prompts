  theory, and then seemed to walk a lot of that back later when he wrote about natural
  selection and the emergence of mind and about the organism being active rather than
  passive, and in his last book on problem solving he was basically arguing that all
  of life is trial and error.


  So: what would that guy say about these four things?


  1. Population genomics. We can now read selection coefficients off DNA, watch allele
  frequencies move in real time, count selective sweeps, compare rates of change in
  protein-coding vs non-coding regions. Would he take that as fitness finally being
  measured independently of who survived — i.e. the circularity charge dead — or would
  he say the operationalisation just pushes the problem somewhere you can''t see it?


  2. Long-running lab evolution of bacteria, the ones that have been going for tens
  of thousands of generations in identical flasks, including the line that turned
  up able to use a nutrient its ancestors couldn''t. Repeatable, controlled, with
  some predictions made ahead of time. Does that count as a testable theory in his
  sense, and more to the point would he think it ever risks being falsified?


  3. Niche construction and the extended synthesis people — developmental bias, plasticity,
  epigenetic inheritance, organisms building the environments that then select on
  them. Popper''s late stuff sounds almost like a preprint of this. Would he embrace
  it as vindication and claim priority, or would he suspect it of sneaking instruction-from-the-environment
  back in through the side door?


  4. The drift/neutralist side: most molecular change being noise rather than selection.
  Would he see that as evidence the programme has real content, since bits of it can
  actually be knocked down?


