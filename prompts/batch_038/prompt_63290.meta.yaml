  Content of the prompt: Asker is a PhD student / blog writer / reading group organizer.
  Let''s set it up: someone in a philosophy-of-biology reading group is doing a "what
  would X say" session, or someone writing an essay. Casual voice.


  Key questions to put to the imagined Popper (post-1994 developments):

  1. Population genomics: we can now estimate selection coefficients from DNA sequence
  data, measure allele-frequency trajectories, detect selective sweeps, dN/dS ratios.
  Would he say the tautology worry is dissolved because fitness is now measured independently
  of survival — or that the operationalization of fitness as expected reproductive
  success just hides the circularity further down?

  2. The experimental evolution of bacteria in the lab over tens of thousands of generations
  (Lenski''s LTEE, including the population that evolved the ability to use citrate).
  Repeatable, controlled, predicted-ish. Does this turn natural selection into a testable
  theory in his sense, i.e., does it produce genuine refutations?

  3. Extended evolutionary synthesis: developmental bias, phenotypic plasticity, epigenetic
  inheritance, and above all niche construction — the idea that organisms modify their
  own selective environments and pass those modifications on. Popper''s late work
  stressed the active organism that searches and tries out new behaviors, and the
  Baldwin effect; he was sympathetic to the idea that organisms aren''t passive. Would
  he embrace niche construction as vindicating him, claim priority, or reject it as
  a smuggling-in of Lamarckism / as a challenge to the causal centrality of selection
  he still wants to keep?

  4. Cultural evolution / memetics / dual-inheritance theory, and the fact that human
  knowledge growth is his paradigm case of evolutionary epistemology: would he accept
  "instruction from the environment" framing or insist on the "selection from within"
  distinction he drew (Popper distinguished "instruction from the environment" vs
  "selection of the organism from within" — actually Popper''s phrase in All Life
  is Problem Solving is that evolution proceeds by "selection from within" rather
  than "instruction from the environment" — I''m fairly confident about that distinction;
  it''s a well-known Popperian line. I''ll mention it loosely as "his distinction
  between being instructed by the environment and the organism selecting from within"
  without quotes).

  5. Neutral theory / the fact that most molecular change is drift, plus genomic junk
  — would he think this is a genuine refutation of pan-selectionism and thus evidence
  that Darwinism as a research programme has empirical content (because parts of it
  can be knocked down)?


