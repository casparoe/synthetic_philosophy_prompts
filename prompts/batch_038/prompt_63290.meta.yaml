  creationists/ID proponents who love the tautology charge, which he hated (Popper
  was strongly opposed to using his views to attack evolution; he distanced himself
  from that use). That''s a good angle: the tautology charge got taken up by anti-evolution
  people and Popper objected. Would he now disown the whole episode?


