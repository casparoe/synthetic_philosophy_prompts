  **Entry 14**


  Deterministic chaos is usually reported as a refutation of Laplace, and I want to
  argue that the report is half right and half a confusion. Laplace''s picture has
  two parts that are almost always run together: that the state of the world at a
  time fixes its state at every later time, and that an intellect of sufficient power
  could read off the later states from the earlier one. Chaos leaves the first untouched
  and destroys the second. That is the whole of the result, and it is more interesting
  than the slogan.


  Lorenz''s 1963 model of atmospheric convection is a system of three ordinary differential
  equations with no stochastic term anywhere in it. Given an initial point, the solution
  is unique, and it is unique forever; nothing in the mathematics licenses a branch.
  What the model also has is a positive Lyapunov exponent: two trajectories started
  a distance ε apart separate, on average, like εe^{λt}. The consequences are worth
  stating precisely, because they are usually stated loosely. Poincaré had already
  found the phenomenon in celestial mechanics at the end of the nineteenth century,
  and Lorenz''s contribution was to exhibit it in a system small enough to be studied
  on the computers of the day. Instability is not universal: dissipative systems can
  contract onto attractors, integrable systems do not diverge exponentially at all,
  and a good deal of the world''s weather-relevant dynamics is neither. Where the
  exponent is positive, however, the practical ceiling on forecasting is severe, and
  there is a lovely feature of it that is rarely mentioned in popular writing: because
  the growth is exponential, buying ten times the precision in the initial data buys
  only a fixed additional interval of forecast lead time, namely ln(10)/λ. Improving
  your instruments by an order of magnitude does not extend your horizon by an order
  of magnitude; it extends it by a constant. That is why fifty years of better satellites
  have moved the medium-range forecast out by days rather than by decades-of-days.


  Now for the part that is usually gotten wrong. Laplace''s intellect was to be given
  the initial state exactly. In a chaotic system, specifying an initial state exactly
  requires an infinite number of digits: any finite description, however long, is
  compatible with a continuum of states whose futures separate from the described
  one within a bounded time. So the demon is not merely difficult to build; it is
  not a coherent object. The information it would need does not exist in a form any
  intellect could hold. And if no complete specification of the present can be had,
  then the present does not determine the future in any sense that could matter. The
  weather next month is not merely unknown; it is unsettled. Determinism, in the sense
  Laplace meant it, was an empirical hypothesis about the world''s intelligibility,
  and chaos falsifies it.


  One further consequence is often noted and then dropped too quickly. Chaotic systems
  generate sequences that are, for any observer, indistinguishable from random ones,
  and the probabilities we attach to their outcomes are therefore chances in the same
  sense as those of quantum mechanics: features of the world rather than measures
  of our ignorance. Weather forecasters who report a percentage are reporting something
  real.


  Finally, the free will problem. Compatibilists have long argued that what matters
  is not whether the future is fixed but whether it is fixed in the right way. But
  if the brain is a nonlinear dynamical system — and everything we know about neural
  tissue suggests it is — then its trajectories are unstable too, and no external
  observer can predict them. This is not a solution to the problem of free will, but
  it dissolves the part of the problem that was ever worrying: the sense of being
  readable from outside. An unpredictable agent is an agent whose conduct cannot be
  derived from a description of the world, and that is all the independence anyone
  ever wanted. The remaining question — whether unpredictability is enough — is a
  question about control, and control is exactly what chaos does not threaten.


