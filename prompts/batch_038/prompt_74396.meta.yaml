  Now write it formally and polished. Structure:


  Paragraph 1: purpose and task.

  Paragraph 2: scenario constraints (bulleted).

  Paragraph 3: analysis deliverables (numbered).

  Paragraph 4: format instruction (begin with the scenario, no preface; keep technical
  vocabulary out of the scenario; analysis in labeled sections; no citations/authors).


  Let me draft.


  ---


  "I am preparing a case for an upper-level epistemology seminar on the structure
  of justification. The pedagogical point I want it to make is that the disagreement
  between foundationalism and coherentism is not confined to exotic skeptical scenarios:
  it can change the verdict on an utterly ordinary perceptual belief held by a competent
  adult in a workplace. I also want to unsettle the caricature my students arrive
  with — that foundationalism is the restrictive view and coherentism the permissive
  one — by getting them to work through a case that runs the other way.


  Build me a single scenario in which a classical internalist foundationalist and
  a coherentist about justification disagree about whether the subject knows, in that
  direction: the foundationalist says she knows, the coherentist says she does not.


  The scenario must satisfy all of the following:

  - The subject is an ordinary, attentive, competent adult doing routine work; no
  philosophical training, no cognitive impairment, no culpable ignorance.

  - The target belief is formed on the spot by perception of an instrument or object
  directly in front of her, and is true.

  - That perceptual belief must be of a kind a classical foundationalist can countenance
  as basic: it is not the output of testimony, memory of testimony, or inference.

  - Every process involved is reliable; the subject possesses no belief that contradicts
  the target belief, none that specifically impugns the instrument or her senses,
  and no realistic opportunity within the scene to run a check that would reveal the
  tension.

  - The incoherence the coherentist relies on must be distributed rather than local:
  it arises from the target belief''s being rendered inexplicable by a substantial
  body of her other beliefs taken together, and removing any one of those background
  beliefs must not restore coherence. This is essential. A case in which the divergence
  is generated by an ordinary defeater that any theory would recognize does not meet
  the specification; I need the divergence to come from the global structure of the
  subject''s belief system.

  - Realistic setting — a plant, a clinic, a records office, a kitchen, a warehouse
  — and no science-fictional machinery: no demons, no simulation, no memory manipulation,
  no neurosurgery, no stipulated unreliable faculties.

  - One paragraph, under about 220 words, and containing no technical vocabulary of
  its own: the words justified, foundational, coherent, warrant, and knowledge must
  not appear in the scenario.


  Then, after the scenario, do the following in labeled sections:

  1. State the target belief and list the background beliefs that generate the tension.

  2. Give the foundationalist''s reasoning: why the basing relation is satisfied here,
  why the belief is basic, and why the incoherence does not defeat it. Do not simply
  assert the verdict; derive it from the view''s structural commitments.

  3. Give the coherentist''s reasoning on the same terms, explaining how a property
  of the system as a whole can bear on a belief whose immediate source is impeccable.

  4. Identify the single structural feature of the case that does the work, and report
  what happens to both verdicts if you remove it — in particular, state whether supplying
  her with a handful of further beliefs that connect the target belief to her system
  flips the coherentist without moving the foundationalist.

  5. Say whether infinitism lands with the coherentist or the foundationalist on this
  case, and whether it gets there for the same reason. If its diagnosis differs from
  the coherentist''s, say what the three-way comparison reveals about what the dispute
  between these views is actually a dispute about.

  6. Give the coherentist''s best two attacks on the case — one aimed at the design
  (arguing that I have not in fact held defeaters out), and one aimed at the diagnosis
  (arguing that the foundationalist has quietly relied on something other than the
  structure of justification). Neither attack may be a strawman; both must be ones
  a serious coherentist would actually press.


  Describe all three positions by their structural commitments rather than by reference
  to particular authors or texts; the case should stand on its own and I do not want
  attributions.


  Begin your response with the scenario paragraph itself — no preface, no restatement
  of the task, no commentary before or after the case other than the labeled sections
  requested. If you conclude that some constraint above cannot be satisfied without
  rigging the verdicts, complete the case as best you can and then say plainly, at
  the very end, which constraint fails and what the nearest acceptable alternative
  would be."


  Check: "no preamble and no restating of the question" — covered by the begin-with-scenario
  instruction.


  One issue: I mention "classical internalist foundationalist" — is that consistent
  with "every process involved is reliable"? Yes; reliability is extra, not required
  by internalism, but it prevents externalist escape and keeps the case clean. Also,
  an internalist foundationalist might insist on the subject having some internal
  access to the basing — fine.


  Another: could an internalist foundationalist accept a basic perceptual belief that''s
  wildly anomalous relative to the rest of her system? Classical foundationalists
