  Harsanyi''s Aggregation Theorem (1955, "Cardinal Welfare, Individualistic Ethics,
  and Interpersonal Comparisons of Utility", JPE): If individual preferences and social
  preference each satisfy the vNM axioms over a common set of lotteries, and social
  preference satisfies the Pareto indifference principle (if all individuals are indifferent
  between two lotteries, society is indifferent), then any vNM utility representation
  of social preference is a positive affine combination of individual vNM utility
  representations — and with a suitable normalization, a positive weighted sum. Harsanyi
  then argued for equal weights by a symmetry/impartial-observer argument, yielding
  classical utilitarianism.


  Key objections:

  1. Sen (1970s) and Weymark (1991): the theorem is about expected utility representations
  over lotteries, not about social welfare orderings over certain outcomes; Harsanyi''s
  "social preference" satisfying vNM axioms over lotteries is a strong assumption.
  Weymark: the theorem doesn''t establish utilitarianism as a theory of welfare; it
  establishes a result about the aggregation of expected utility functions.

  2. The Pareto indifference assumption is weaker than strong Pareto; if social preferences
  are only assumed to satisfy Pareto indifference plus vNM, you get the linear result.
  But the "Pareto" step only delivers that when all individuals are indifferent —
  Harsanyi''s original argument used Pareto indifference; the linear form then follows
  from the fact that social utility differences are proportional... Actually the standard
  proof: if all individuals indifferent between p and q then society indifferent;
  hence society''s utility function must be a function of the vector of individual
  utilities; combined with vNM structure on both sides and the Pareto condition, the
  function must be affine. There''s a well-known argument (Hammond, Mongin) that a
  Pareto indifference plus vNM implies linear aggregation. Some versions require "Pareto
  indifference" plus that individual vNM utilities are all defined on the same lottery
  space with common probability assignments.

  3. The zero-point/normalization problem: vNM utilities are unique only up to positive
  affine transformations, so the theorem''s weights are not invariant across different
  normalizations; interpersonal comparisons require fixing the zero and unit of each
  person''s utility. Harsanyi used a "reference level" argument. This is a genuine,
  often-overlooked technical issue: the theorem as such doesn''t yield interpersonal
  comparability, it assumes it (or presupposes it via the common zero point). Critics:
  Sen, and also the "utility comparison" literature.

  4. Risk aversion: Diamond (1967) — the equal-treatment-of-persons vs. equal-treatment-of-probabilities;
  the two-children/organ-transplant lottery example where society should be indifferent
  between two lotteries that give each child a 50% chance but Harsanyi-style aggregation
  ranks them differently. Also Broome (1991) reconstructs: the theorem aggregates
  expected utilities, so it treats society''s attitude toward risk as if it were a
  weighted average of individual attitudes — which conflicts with a plausible "fairness"
  intuition about ex ante equality.

  5. Non-expected-utility individuals: if individuals violate the independence axiom
  (e.g., ambiguity aversion, rank-dependent utility), the theorem''s premises fail.
  There are generalizations (e.g., by Grant, Kajii, Polak; by Chambers & Echenique
  on multiple priors; Mongin''s theorem on state-dependent? Mongin 1995 "Consistent
  Bayesian Aggregation" — the Bayesian aggregation theorem requires Pareto and yields
  linear pooling of probabilities, which faces similar issues). Also, Gilboa, Samet,
  Schmeidler on "utilitarian aggregation of beliefs and tastes."

  6. State-dependence: if individuals have state-dependent utility (they care about
  different states), linear aggregation with state-independent utilities fails.

  7. The welfarist reading: vNM utility is not welfare; a preference-satisfaction
  reading of utility makes utilitarianism a preference-aggregation view, not a welfare
  view. Also "the theorem says nothing about distributional concerns within a single
  life" — Parfit.

  8. Also: whether the theorem rules out prioritarianism. Prioritarianism applies
  a concave transform to individual welfare *before* summing, in the "certainty" case.
  Harsanyi''s theorem, applied to lotteries, does conflict with prioritarianism because
  prioritarianism violates the independence axiom over lotteries (it''s risk-averse
  with respect to others'' welfare). Similarly egalitarianism. So the theorem does
  rule those out — at the cost of assuming the independence axiom for social preferences
  over lotteries. And that''s exactly where the bite is: is social risk-aversion about
  distributive patterns irrational? Broome''s "equal treatment of persons" and Diamond''s
  objection.

  9. Also possible defeater: the theorem''s assumption that all individual and social
  preferences are defined on the same lottery space with the same probabilities ("objective
  chance") — if individuals disagree about probabilities, the theorem''s premise of
  common probability assignments fails. Bayesian aggregation results show pooling
  probabilities is even harder.

