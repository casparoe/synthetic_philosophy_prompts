  Draft:


  I''m a high school senior writing an extended independent research paper for my
  school''s philosophy seminar, and I''ve adopted a position I''d like stress-tested
  before I commit to it in print.


  My position, in three parts:


  1. Harsanyi''s aggregation theorem shows that if each individual''s preferences
  over lotteries satisfy the expected-utility axioms, and society''s preferences over
  the same lotteries satisfy those axioms too, and society is indifferent between
  any two lotteries to which every individual is indifferent, then social preference
  must be representable by a weighted sum of individual expected utilities, with positive
  weights.

  2. Therefore the theorem''s real philosophical content is negative: prioritarian
  and egalitarian views of distribution aren''t merely alternative value commitments,
  they are views that violate a requirement of rationality about how to combine attitudes
  toward risk. Any view that says a society should be risk-averse about the distribution
  of welfare — not about the level — is failing an axiom.

  3. The most common deflection, that the theorem is "only about preferences over
  lotteries and not about welfare," doesn''t rescue those views, because distributive
  questions are questions about choice under risk, and choice under risk is exactly
