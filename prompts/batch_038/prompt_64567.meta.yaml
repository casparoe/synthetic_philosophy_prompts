  1. First, a short preamble (five or six sentences) laying out the axes you are using.
  I have three in mind, but you may add or revise: whether the tie between rivals
  is temporary and will be broken by evidence or ingenuity not yet available, or permanent
  in principle; whether the tie arises between whole world-views or locally between
  a theory and the auxiliary assumptions needed to derive predictions from it; and
  whether anything beyond observational fit may be used to break the tie (simplicity,
  explanatory scope, coherence, the priors a scientist brings, the norms a community
  has adopted), and if so, whether that resource is permissive in a way that leaves
  multiple rivals equally warranted.


