  I''m in my final year of high school and writing an independent research essay about
  whether the success of a scientific theory is evidence that it is true, and I''ve
  hit a wall with my own case list. I want to know what principle my verdicts add
  up to, and which of them I have to give up.


  Here is what I actually think about a set of historical theories:


  1. Fresnel''s wave theory of light. It predicted a bright spot at the center of
  the shadow cast by a circular disc, a spot nobody expected, and the spot was observed.
  Its mechanism was an elastic solid ether filling space. Verdict: the theory was
  substantially right about light, even though the ether is nothing at all, and the
  surviving equations count as a genuine preservation.

  2. The caloric theory of heat. Carnot derived the maximum efficiency of a heat engine
  by treating heat as a fluid falling from a high to a low temperature, the way water
  falls through a wheel. That efficiency limit is still taught and still exactly right.
  Verdict: nevertheless, caloric was simply false, nothing was preserved, and the
  theory''s success is closer to a miracle than the ether case is. I know these two
  verdicts look inconsistent — that''s one of the things I want pressure on.

  3. Ptolemy''s astronomy... Verdict: not even partly true, though the machinery is
  arguably still with us...

  4. Newtonian mechanics: verdict — genuinely true within its domain, and it''s reasonable
  to keep believing it there. But I also think an astronomer in 1600 could have said
  the same sentence about epicycles with the same justification and been wrong, and
  I don''t think I''m allowed to claim my case is special. Second tension.

  5. Phlogiston: wholly false, nothing preserved, and the terms in it — "phlogiston,"
  "dephlogisticated air" — I think fail to refer, so statements made with them are
  neither true nor false rather than false. But: I think "water" said in 1750 and
  "water" said today refer to the same stuff, even though the theory of what water
  is changed completely. So I don''t apply the same treatment to "water" that I apply
  to "phlogiston," and I can''t say why.

  6. Bohr''s atom: predictions preserved (the Balmer wavelengths), but the successor
  theory doesn''t just lack orbits, it forbids them. Verdict: preserved predictions,
  and yet I want to say this theory is worse off than Fresnel''s, not equally well
  off.

  7. Electrons and quarks now: verdict — I''m confident these refer and will survive.
  But my confidence seems to rest on "our best instruments and our best equations
  are full of them," and in 1887 the best interferometers in the world were full of
  the ether.


  My tentative principle, which I can''t get to work: a discarded theory T is partly
  true just in case, for each of T''s successful predictions, there''s a derivation
  of that prediction in the successor theory S that mentions none of T''s discarded
