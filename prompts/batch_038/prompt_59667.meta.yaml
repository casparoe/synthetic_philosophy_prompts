  Concrete practice: the Swiss requirement of a double majority (majority of the popular
  vote AND majority of cantons) in referendums/initiatives. Or the fact that referendums
  are typically binary yes/no with a simple majority, and the practice of "no quorum"
  vs quorum. Or the Californian rule that a simple majority approves a ballot proposition
  that can only be amended by another vote of the people (initiative measures can''t
  be amended by the legislature without voter approval). That''s a rich, well-known-ish
  practice. The philosophical commitments: what view of "the people''s will," of democracy
  as aggregating preferences vs. deliberation, of majority legitimacy, of entrenchment,
  of representation.


  Another concrete practice: Switzerland''s Federal Council (the collegial executive)
  being forced to campaign against an initiative that passes — the "magic formula"
  and the fact that after a popular initiative passes, the government must implement
  it even though it opposed it; and the Federal Council issues official voting booklet
  (Bundesbüchlein) with the government''s recommendation and the text of the initiative,
  plus committee explanations — including the minority position. That''s a nice practice:
  the official referendum booklet gives space to both sides in proportion... Actually
  in the Swiss booklet, the Federal Council states its recommendation and the initiative
  committee states its position, each with roughly equal space. That presupposes a
  view of the state as a participant in public deliberation with a duty of evenhandedness
  — a very interesting tension: the government officially recommends a vote, which
  presupposes the government has a view that is not merely administrative; but equal
  space presupposes the debate is between two parties rather than between the state
  and citizens.


  Also California: the requirement of an impartial legislative analyst''s summary
  plus arguments pro and con, where the arguments must be written by designated parties
  and the ballot label "Rebuttal." And California''s rule that only the Attorney General
  writes the ballot title and summary, and proponents can''t change it. And the practice
  that a proposition passes with 50% + 1 even if turnout is 30% — presupposing that
  the electorate''s will is expressed by those who show up.


  Also interesting: the California rule that an initiative approved by voters can
  only be amended by the legislature if the initiative itself permits amendment and
  the legislature''s amendment furthers the initiative''s purpose. That presupposes
  a view of popular sovereignty as a superior lawmaking authority, an entrenchment
  logic, and a theory of statutory interpretation where "purpose" is discoverable.


  Also the Swiss practice: no referendum on the federal budget/taxes (financial referendum
  was rejected), and mandatory referendums for constitutional amendments but optional
  referendums only for statutes — presupposing hierarchy of norms and that constitutional
  change requires the people''s consent while ordinary law requires only that the
  people be able to veto. Also the rule that the people can only initiate constitutional
  amendments, not statutes — a peculiar design choice: the popular initiative must
  amend the constitution, so detailed policy is constitutionalized. That''s an excellent
  concrete practice with philosophical bite: why must an initiative be at constitutional
  level? Because of the hierarchy where the people are the constituent power; the
  effect is constitutional inflation.


