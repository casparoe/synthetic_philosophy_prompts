  Now, the format: a polished, formal first-person prompt. It should:

  1. Establish the asker''s identity and fluency in the target vocabulary.

  2. Establish the recent personal relevance.

  3. Ask for the faithful translation into that vocabulary.

  4. Ask for the residue report: what translates cleanly, what distorts, what has
  no expression.

  5. Ask for a verdict: is the residue a defect of the technical vocabulary or a sign
  the historian''s claim was vaguer than it looked?

  6. Inject a specific idea/claim to be evaluated (the archive''s sampling-rate point;
  the framework-relativity of "noise").

  7. Guard against smuggling: "don''t quietly convert her claims into ones my framework
  already accepts and call that a translation" — that''s a great instruction and matches
  the type notes.


