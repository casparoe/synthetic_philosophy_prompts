  I have spent fifteen years as a time-series analyst — first in macroeconomic forecasting
  at a central bank, and for the past eight years building models that project physical-climate
  variables decades forward for a reinsurer. My vocabulary is filters and spectra,
  stationarity and unit roots, structural breaks and regime shifts, impulse responses,
  signal-to-noise, and the whole apparatus of separating what persists from what passes.
  Two months ago I was made co-lead, with an environmental historian, on a project
  that has to justify our choice of reference period for long-horizon flood and heat
  projections. She has been pressing a case I cannot yet answer in my own terms, drawn
  from Braudel''s Mediterranean study and its three time-scales: a near-motionless
  history of human beings and their environment; a slower cyclical history of economies,
  populations, and societies; and event-based history at the scale of individuals.
  Her contention is that our practice — estimating a design baseline from a thirty-to-fifty-year
  historical record, treating departures from it as deviations to be filtered, and
  reporting extreme events as tail probabilities — presupposes a world in which the
  third scale is noise around a stable trend, and that this is exactly the picture
  Braudel''s first two scales deny.


  She has also made a sharper claim, which I want you to take seriously rather than
  wave away: that the archive has a sampling rate, and that a record''s resolution
  determines which time-scales it can represent at all. A port ledger, a sediment
  core, and a satellite series each pre-filter the past differently, so what a historian
  or a modeler can even see as an event is a property of the instrument as much as
  of the world.


