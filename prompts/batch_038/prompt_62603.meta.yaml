  Background facts I should get right (and not quote):

  - Frankfurt''s 1969 paper "Alternate Possibilities and Moral Responsibility" — Black/Jones
  case: Black wants Jones to do X; he''ll intervene if Jones shows a sign of not doing
  X, but Jones does X on his own, so Black never intervenes. Intuition: Jones is responsible,
  though he couldn''t have done otherwise.

  - The "prior sign" / "flickers of freedom" objection (Widerker, Kane, Ginet): the
  sign gives Jones a flicker of an alternative — he could have begun to decide otherwise,
  or shown the sign. So PAP might be saved in a revised form.

  - The Dilemma Defence: if the sign is a deterministic prior cause, Jones isn''t
  responsible for what follows; if it isn''t, then the sequence up to the choice isn''t
  determined and Jones might be responsible anyway / could have done otherwise. So
  Frankfurt cases either don''t defeat incompatibilism or don''t defeat PAP.

  - Mele & Robb''s "buffered" case: no prior sign; Black implants a device at birth
  that would deterministically cause the choice at time t, but if the agent makes
  an indeterministic choice on his own before t, the device is blocked... Actually
  Mele-Robb: the device would ensure the decision at t, but if the agent''s own indeterministic
  process produces the decision first, the device is inert. The agent can''t do otherwise
  (the device would fire), yet the actual sequence is indeterministic and undetermined.
  This is designed to avoid the dilemma.

  - Kane''s version: an indeterministic Frankfurt-style case where the intervener
  monitors nothing but is ready to act if the agent''s "effort of will" starts to
  go another way — Kane actually accepts that FSCs defeat PAP but argues they don''t
  defeat incompatibilism because responsibility requires "ultimate responsibility,"
  not PAP.

  - Pereboom''s "Tax Evasion 2": deterministic setting, a tax evader deliberates;
  a neuroscientist would intervene if he detected the right prior sign; Pereboom argues
  the agent is responsible even without alternative possibilities, and that the deterministic
  setting doesn''t undermine responsibility because what matters is whether the agent''s
  reasons-responsiveness... Actually Pereboom is a hard incompatibilist: he thinks
  FSCs show responsibility doesn''t need APs, but he denies responsibility anyway
  on other grounds (sourcehood).

  - "Flickers" — the tiny alternative possibilities that remain (e.g., beginning to
  decide, or a neurological sign).

  - The "responsibility-irrelevant alternatives" line (Fischer & Ravizza): alternative
  possibilities can be "robust" or "non-robust"; only robust alternatives (where the
  agent could have avoided responsibility) matter. Jones''s flicker of showing a sign
  isn''t robust because it wouldn''t have exculpated him.

  - The "counterfactual intervener" that never acts: does the agent''s ignorance of
  it matter? Fischer says no; but some argue that if Jones learned about Black afterward,
  nothing changes; some (e.g., "the presence of a manipulator changes the meaning
  of the action") dissent.

  - Also: cases where the intervener would have intervened but the agent did the act
  for a *different reason* than the intervener wanted — Frankfurt''s own note that
  Jones must do the act for the reason Black wants (e.g., Black wants Jones to decide
  to steal the car for the money, and if Jones were about to decide not to, Black
  would cause him to decide to do it — but if Jones decides to do it for a different
  reason, e.g., out of spite, does Black intervene? Fine detail).

  - Also, there''s the issue of "buffering" the agent''s decision vs. "pre-empting"
  it.

  - And the newer stuff: "Frankfurt cases and the principle of alternative possibilities"
  in the context of moral luck, "constitution" views, and Dana Nelkin''s work; also
  Sartorio''s "causes of absence" argument (Carolina Sartorio: the mere presence of
  a counterfactual intervener causes the absence of alternatives, and absences can
  be causes, so FSCs don''t refute PAP). That''s a nice in-the-weeds move.

  - Also: "the no-beginning problem" — if Black''s device would have taken over, and
  Jones decides on his own, is Jones''s decision really "his own"?

  - Also the "zombie"/"preemptive" vs "counterfactual" intervener distinction.

  - Also "indeterministic buffer" cases where the device could fail.


  Now, the journalist''s verdicts. I want a set that''s mostly sensible, with at least
  one hard-to-reconcile pair, so the answer must choose between complexity and overturning
  a verdict.


  Draft verdicts (in the journalist''s voice):

  1. Classic Black/Jones: Jones is blameworthy. Can''t do otherwise, still responsible.
  (Standard.)

  2. Same but Jones is told afterwards that Black was watching: still responsible,
  same degree. (Standard.)

  3. Same but Jones knows *in advance* that Black is there and will force him if he
  wavers — and he goes ahead anyway: journalist says still responsible, maybe *more*
  responsible (defiance). Hmm, but does he still lack alternatives? If he knows Black
  will intervene, arguably... interesting. Let''s say: he knows, does it anyway; journalist
  says responsible but feels the case is murkier — "it''s like someone who commits
  a crime knowing they''d have been forced to anyway."

  4. The "prior sign" version where Black reads a blush/neural marker a few seconds
  before the choice: journalist says responsibility *fades* — "if Black is already
  reading something in him that seals the outcome, then the bit where Jones ''decides''
  looks like the last turn of a screw someone else started." But:

  5. The buffered/no-sign version (device implanted at birth, fires at t if Jones
  hasn''t already decided; Jones decides indeterministically on his own just before
  t): journalist says this one is *worse* — less responsible — even though it was
  designed to be the cleanest. That''s a striking, hard-to-reconcile pair with (4):
  the case with a prior sign is the one where incompatibilists say PAP survives, yet
  the journalist says responsibility fades there; the no-sign case is where the agent
  is supposed to be maximally the source, yet journalist says it feels worse. This
  creates the tension the answer must resolve: is the journalist tracking "sourcehood"
  or "robustness of alternatives"? Both can''t be it.

  6. A case where the intervener would have made Jones do the *same act* but for a
  *different reason* (Black wants the car stolen for money; Jones steals it out of
  spite): journalist says responsible, but "responsible for something else" — the
  act is the same, the responsibility isn''t.

  7. Sartorio-style: journalist says the *presence* of Black in the room makes a difference
  even though he does nothing — "he''s the reason there was no other way out, and
  ''he never touched him'' isn''t the same as ''he wasn''t there.''" This is the "absences
  can be causes" intuition. And they''d say the same about a locked door that was
  never locked... hmm.

  8. A pair designed to be hard: (a) a machine that would intervene vs (b) a person
  (Black''s devoted assistant who loves Jones) who would intervene — journalist says
  (b) feels *less* exculpating/more... Actually maybe: journalist says with a person
  monitoring, they feel Jones gets some credit for the fact that the person never
  had to step in; with a machine, no. That''s a morally irrelevant difference — the
  principle will have to overturn it or explain it.

  9. A case where the intervener is faulty and would have failed: journalist says
  if the device would have malfunctioned, then Jones *could* have done otherwise,
  and responsibility is unthreatened — but they also say they don''t feel *more* responsible
  in the faulty case, which is odd because that''s the one where PAP is satisfied.
  This is a nice internal tension: PAP-satisfied case feels no better than PAP-violated
  case.

  10. Maybe a non-Frankfurt control case: ordinary deterministic manipulation (a neuroscientist
  who actually intervenes and causes the choice) — journalist says not responsible.
  And they say the difference between "actually intervened" and "would have intervened"
  is doing all the work, which they find suspicious.


