  Thesis: The fink/mask literature assumes that a disposition ascription is a claim
  about what would happen, and that interference cases are pathological exceptions
  to be handled by tightening the analysis. But an alternative diagnosis: finks and
  masks are just two species of a single phenomenon — the stimulus-to-manifestation
  link is never a two-place relation but always relative to a set of background conditions
  that can be interfered with, and there is no non-arbitrary way to pick out "the"
  background conditions. On that view, the correct conclusion isn''t a better conditional
  analysis but that dispositions are inherently idealising abstractions — like frictionless
  planes or point masses — whose ascriptions are true only relative to an idealisation,
  and the "problem" is the same problem idealisations pose in physics. Consequence:
  the realist about dispositions should stop trying to analyse them into conditionals
  and should treat the conditional as an explanatory idealisation. And then a further
  twist: this makes dispositions look like the theoretical entities that are defined
  by their role in cp-laws (Schrenk), which raises the question of whether the cp-clause
  is a hidden admission that there are no strict dispositional laws.


