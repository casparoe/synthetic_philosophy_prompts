  OK, the well-known problem case in the literature: **trumping preemption / late
  preemption applied to omissions**. Example (from the literature on omissions): Two
  nurses, one on the day shift, one on the night shift, each fail to give the patient
  a dose; the doctor''s order says either can give it; the drug would have saved the
  patient. Both omissions are but-for? If the day nurse had given it, patient saved
  → yes. If the night nurse had given it, patient saved → yes. So both are causes.
  Intuition says both are responsible but maybe only the first (the one whose window
  was earliest) "caused" it, or both. Not devastating.


  The genuinely devastating counterexamples for the counterfactual account of omissions
  are:

  (a) **Profligacy**: absences of absent agents. Obama not watering my plant.

  (b) **Omissions with no clear "should"**: cases where the counterfactual is true
  but there''s no reasonable expectation, e.g., a passerby who could have saved someone
  but had no duty; intuition: their failure didn''t *cause* the death, though it made
  a difference. (Hitchcock & Knobe''s point: norms matter.)

  (c) **Non-locality/finking**: Maya''s omission would have saved the day, but only
  because of a chain that seems too fragile.


  So the best crux for an exam question: the same physical structure, two different
  normative settings, and the counterfactual account gives the same verdict for both
  while intuitions differ — that''s Hitchcock & Knobe''s "Cause and Norm" insight
  (the case of the administrative assistant vs. the professor filling in a form...
  their famous example is about a computer/policy: "the professor''s secretary should
  have refilled the water" style). Their canonical example: two identical scenarios
  differing only in whether a norm was violated (the "pen" case: an administrative
  assistant is supposed to put a pen on the desk; a professor is not; the pen is missing;
  people judge differently about causation). Also the famous Hitchcock-Knobe example
  about the vending machine? Let me recall: In "Cause and Norm" (2009), they discuss
  a case where a person''s failure to perform an action is judged a cause when the
  action was expected/normatively required. Yes.


  Great — so a strong exam question design:


  Case A (norm in place): The warehouse rulebook requires the overnight guard to check
  the panel at 3:00 and 5:00. Maya skips 3:00. The freezer alarm had been disabled.
  The leak starts at 2:40. Insulin ruined. Intuition: Maya''s skipped check caused
  the loss.


  Case B (same physical facts, no norm): Maya is a temporary agency worker whose written
  assignment says nothing about panel checks — nobody told her, nobody expected her
  to, her job was to sit at the gate. Tomas, whose job description DOES include the
  4:00 walk, is asleep. Same leak, same loss. Intuition: Maya''s failure to check
  did not cause the loss (even though, physically, if she had checked, the loss wouldn''t
  have happened).


  Same counterfactual structure, different causal verdicts → so the counterfactual/difference-making
  account alone can''t track the difference; you need something about expectations,
  roles, or what counts as a relevant alternative. And then the cost: if norms do
  the work, then causal facts become norm-relative, which is uncomfortable (causation
  is supposed to be the mind-independent thing that grounds the norms, not the other
  way around). And it makes causation shift with the whims of a manager''s rulebook:
  if management deletes the rule, does it change what caused the loss? That''s a great
  objection for students to raise, and there are replies (the norm may only select
  among causes, not create them; or "causation" in the responsibility sense vs. the
  physics sense).


