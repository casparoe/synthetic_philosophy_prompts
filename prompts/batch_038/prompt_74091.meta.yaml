  Standard problems for counterfactual accounts of omission causation:

  1. Profligacy/abundance: far too many omissions qualify as causes (Obama''s failure
  to water my plant). This is the "wrong verdicts" problem — the account says too
  much.

  2. Symmetric overdetermination: two people each fail to do something that would
  have prevented the harm; each individually was sufficient. On the standard Lewisian
  account with the "closest world" analysis, in the closest world where Maya checks,
  the harm is prevented, so her omission is a but-for cause. Fine. The problem arises
  in cases where the backup would have kicked in: e.g., if Maya had checked at 3 and
  it wouldn''t have mattered because Tomas... no.


  The real symmetric overdetermination problem: suppose BOTH Maya and Tomas would
  have prevented it, and consider: is Maya''s omission a cause? But-for: if Maya had
  checked at 3, the insulin is saved. Yes — counterfactual holds, so it''s a cause.
  So both are but-for causes. That''s actually fine intuition-wise (both are responsible),
  though some think the counterfactual account handles it OK here. Hmm.


  The classic problem case for counterfactuals is preemptive overdetermination: if
  Maya had checked, would the insulin have been saved? Yes. If Tomas had walked at
  4? Yes. So both are causes. Intuition: both are blameworthy, and arguably both caused
  it. So this isn''t a devastating case.


  The more troubling case is: suppose the panel check would have revealed the leak,
  but there was ALSO an automatic alarm that would have gone off at 4:30 — and it
  did go off, but nobody responded. Hmm.


