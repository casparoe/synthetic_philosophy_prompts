  was also disabled/broken. Then the counterfactual: if Maya had checked at 3:00,
  would the insulin have been saved? Yes. So still a but-for cause.


  Hmm, symmetric omissions don''t break but-for. What breaks but-for for omissions
  is: if a *backup actor* would definitely have intervened. E.g., "If Maya hadn''t
  skipped the check, the insulin would have been saved" — true. So but-for says cause.
  What we need is a case where the counterfactual is FALSE but the omission still
  seems causal: that''s the preemption case — Maya''s check would have been redundant
  because someone else (a reliable, disposed person) would definitely have caught
  it later, but that person ALSO failed. In a "double prevention/preemption by another
  omission" case, the closest world where Maya checks is a world where the insulin
  is saved — so still true. The counterfactual "if Maya had checked, the harm would
  not have occurred" is true whenever her checking is sufficient. So it holds.


  The genuinely problematic direction for the counterfactual account of omissions
  is the opposite: cases where the counterfactual is TRUE (so the account says "cause")
  but intuitively it''s not a cause. E.g.: Maya skipped the 3:00 check. Had she checked,
  she would have caught the leak. But suppose Maya was, unbeknownst to everyone, already
  unconscious... no.


  Better: the counterfactual is true but the omission doesn''t seem causal — cases
  where the omission is "too distant" or where the counterfactual is true only via
  a bizarre route. E.g., "If I had been in the warehouse at 3:00 and checked the panel,
  the insulin would have been saved" — true, but my omission isn''t a cause (profligacy).
  Or: if Maya had checked the panel, she would have noticed the leak, called the tech,
  and the tech would have come and fixed it — but the nearest world where Maya checks
  is one where the tech doesn''t exist... etc.


  Actually, there IS a classic structure that breaks but-for for omissions: cases
  where the backup would have operated but ALSO failed, and where the two failures
  are of different kinds. Consider:


  Maya skips the 3:00 check. The rule also requires the day supervisor to review the
