  1. To say that since every historical outcome has indefinitely many causes, singling
  out "the" cause is just an arbitrary decision about where to start counting — so
  the structural/contingent debate is verbal, and both sides are describing the same
  network.

  2. To say that historical outcomes are routinely overdetermined, in the sense that
  plenty of independent sufficient causes were available, so the war would have happened
  anyway without the assassination.

  3. To say that counterfactual history is trivially permissive: since any small change
  ripples outward, any counterfactual you like is "true enough," and there is no fact
  of the matter about which ones matter.


