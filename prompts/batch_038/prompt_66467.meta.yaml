  Reflection principle (van Fraassen 1984, "Belief and the Will"; also in The Scientific
  Image / Laws and Symmetry context). Statement: If at time t you believe that at
  future time t'' your degree of belief in A will be p, then your current degree of
  belief in A should be p. Formally P_t(A | P_{t''}(A)=p) = p.


  Justification: Dutch book argument involving sequential bets — you now commit to
  a bet now and a bet later that your future self will accept given their credence.
  Also van Fraassen''s "rational bridge endorsement": you should regard your future
  opinion as a better-informed, more rational version of yourself — the "rope of future
  selves" / the metaphor of the person as a bundle of successive selves, and endorsing
  your future self.


  Known problems:

  1. Cases where you know your future self will be irrational or misled (drugged,
  sleep-deprived, hypnotized). Christensen (1991) "Clever Bookies and Coherent Beliefs"
  — argues Reflection fails for agents who know they will become irrational or forget
  evidence; the Dutch book requires that the future self''s beliefs be relevantly
  connected. Also Talbott.

  2. Forgetting/loss of evidence: If you will forget evidence, your future credence
  may be worse, so you shouldn''t defer.

  3. Cases where you expect to gain misleading evidence: e.g., you now know the drug
  will make you falsely believe you''re ill; the standard Bayesian treatment (conditionalization
  on evidence) — reflection can be violated because you expect your future credence
  to be distorted.

  4. Arntzenius''s "jellybean"/ "self-locating" cases; also "Sleeping Beauty"-style
  cases where Reflection conflicts.

  5. The "cable" case: you know you''ll be in a state where you''re unreliable.


