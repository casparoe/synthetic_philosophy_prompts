  Paradox of phenomenal judgment (PPJ): if consciousness is causally inert (epiphenomenalism),
  then our beliefs/reports about consciousness (including the belief that we are conscious,
  and our philosophical theorizing about it) are caused entirely by physical brain
  events, not by the conscious states themselves. So it''s a miracle/coincidence that
  our judgments about consciousness are accurate. Moreover — and this is the deeper
  version — the content of our beliefs about consciousness seems it could not be about
  consciousness at all if consciousness doesn''t cause them, so the judgment "I am
  conscious" wouldn''t even be about consciousness. Epiphenomenalism thus seems self-undermining:
  if true, we couldn''t know it, and arguably couldn''t even think it.


  Standard epiphenomenalist replies: (1) Acquaintance/knowledge by acquaintance doesn''t
  require causation (Russellian; the "constitutional" story — the conscious state
  is a constituent of the judgment, so no causal chain needed); (2) The judgments
  are caused by the *neural correlates*, which are nomologically linked to the experiences,
  so the correlation is enough for content-fixing (a "tracking" or nomic-dependence
  theory of content); (3) The self-fulfilling nature: the belief is produced by a
  process reliably correlated with the fact; (4) Chalmers'' "coherence" reply — epiphenomenalism
  is weird but the paradox is a reductio of nothing; also, physicalism faces a parallel
  problem (if the belief is caused by neural events, it''s not caused by the phenomenal
  fact either — but physicalists say the phenomenal fact IS the neural fact).


