  Draft:


  "Consider the conjunction J: epiphenomenalism about phenomenal consciousness is
  true — phenomenal states are nomically dependent on physical states but produce
  no physical effects whatsoever — and yet our judgments and reports about consciousness
  are genuinely about those phenomenal states and are substantially accurate rather
  than accidentally so. I would like your credence in J, expressed as a number, together
  with the decomposition that yields it.


  Please assign a probability to each of the following, with no more than two sentences
  of justification per term: (1) that there are phenomenal states at all, i.e., that
  illusionist or eliminativist accounts fail; (2) that epiphenomenalism is true, given
  that there are phenomenal states — this is where I expect the causal closure of
  the physical and the conceivability of zombies to do most of the work; (3) that
  the paradox of phenomenal judgment is genuinely fatal to epiphenomenalism rather
  than merely uncomfortable, which I want you to break down further into the probability
  that reference and knowledge require a causal history at all, the probability that
  some non-causal route such as acquaintance or constitution can do the job, and the
  probability that the objection is not equally damaging to physicalism; and (4) a
  term I think is usually skipped. Suppose the epiphenomenalist escapes the paradox
  by holding that content is fixed by nomic covariance rather than by causation. Covariance
  is symmetric and transitive in a way that causation is not: the experience covaries
  with its neural correlate, and the correlate is what causes the judgment. If nothing
  in that arrangement privileges the experience as the referent of our phenomenal
  talk, the escape route appears to deliver a world in which our judgments are about
  neural states after all — that is, it collapses epiphenomenalism into a kind of
  physicalism about the content of phenomenal concepts, and so fails to make J true.
  Assign a probability that this collapse argument succeeds.


  Then give me the combination: state explicitly how you are combining the terms —
  whether by multiplying, by treating some as non-independent and adjusting, and where
  you are double-counting — and give the final number. My own credence in J is 0.12,
  largely because I take term 4 to be close to 0.9, and I would like to know whether
  you think that is where a number like mine and a number like 0.35 are most likely
  to diverge. Finish by naming the single consideration that would move your total
