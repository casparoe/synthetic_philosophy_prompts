  Standard PPJ: conscious states cause no physical events, so reports aren''t caused
  by them; content and accuracy look miraculous.

  Asker''s twist ("the parity version"): The standard replies (nomic-correlation content-fixing,
  acquaintance, constitutional accounts) all aim to restore a link between experience
  and judgment *without* causation. But if such non-causal links are available, they
  are available to *any* nomologically co-varying state — including a purely physical
  duplicate state. So the replies prove too much: they would equally license the claim
  that a judgment is about a state that never occurs (in a world where the physical
  duplicate is present but the psychophysical laws fail). Formally: if P(experience
  E) and P(duplicate physical state N) both track judgment J with the same reliability,
  and only N is causally efficacious, then the non-causal link that saves reference
  to E must be a link that does no explanatory work — so the saving reply is either
  inert (leaving the paradox intact) or it makes reference to consciousness arbitrary.
  Ask: probability that the standard replies are "either inert or arbitrary."


