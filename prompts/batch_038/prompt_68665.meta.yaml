  (a) the tool''s score has to be predictive of our annual performance rating, and
  the same numeric cutoff gets applied to every applicant group; (b) the selection
  rate for each protected group has to come out at no less than four-fifths of the
  highest group''s; (c) among applicants who''d actually have performed well, the
  proportion we wrongly screen out has to be roughly equal across groups. When a tool
  fails (b) or (c) we first try to fix it upstream — drop features, retrain, tighten
  the validation sample. If that doesn''t work we set a different cutoff per group
  until everything lands inside tolerance, and we file a note saying the conflict
  has been ''managed''. The performance rating itself is never up for discussion;
  it''s treated as the ground truth the whole thing is anchored to.


