  impossibility results, though obviously they''re relevant — I want to know what
  the procedure commits us to that nobody ever says out loud. Specifically: what is
  fairness supposed to be a property of, the score, the decision, or the world the
  training data came from? Are the groups'' differing base rates treated as inputs
  we''re allowed to condition on, or as things justice is about? Does (c) plus the
  group-specific cutoffs actually sit inside (a), or does the remedy quietly abandon
  what (a) claims? And what does anchoring everything to the performance rating presuppose
  about merit — does the procedure need a view of merit to work, or would several
  rival views license it equally? Please separate what it strictly commits us to from
  what it merely fits nicely with, say where it''s philosophically underdetermined,
  and tell me which rival views of fairness it rules out without anyone deciding to.
  No bibliography needed, and please write in American English."


