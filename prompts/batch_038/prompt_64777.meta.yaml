  high probability to the truth, so does M; M''s predictions converge to μ''s in total
  variation almost surely under μ (Solomonoff''s convergence theorem). Not "proven
  to always find the truth" — it''s a domination/completeness result, not a guarantee
  of finite-time convergence or of correctness when the truth isn''t computably enumerable.

