  — that''s roughly OK up to constant. Also "explanation of your data is a program"
  — in Solomonoff''s setup, hypotheses are programs (monotone/prefix-free) generating
  the data, and the prior is over programs. Fine with caveats.


  2. "the weight falls off exponentially with complexity, which is exactly the bias
  you want" — fine, though "exactly the bias you want" begs the question.


  3. "Kolmogorov complexity is uncomputable in general, but that''s no obstacle in
  practice: you just run your data through a real compressor, and the compressed size
