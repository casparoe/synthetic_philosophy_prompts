  counterexamples — the normalized compression distance works for clustering but not
  for prediction. And a nice technical point: for a computable compressor, the compressed
  length can exceed K(x) by an unbounded amount, so it''s an upper bound of limited
  quality; and there are strings where gzip does worse than the identity.


