  I''m restructuring the second chapter of a dissertation on deflationary theories
  of consciousness, and I''ve realized that I have been running together two positions
  that my readers will not run together. The first is the user-illusion model: the
  thought, in the lineage that runs from Alan Kay''s coinage for the desktop metaphor
  through Nørretranders'' 1991 book to Dennett''s adoption of it, that conscious experience
  is a deliberately lossy, action-shaped summary of processes that are themselves
  nothing like experience — a dashboard, not a picture. The second is illusionism
  proper, as defended in recent analytic philosophy by Keith Frankish among others:
  the claim that introspection systematically misrepresents itself as presenting irreducibly
  phenomenal properties, and that therefore phenomenal properties so conceived do
  not exist. My committee''s predictable objection is that the first is a claim about
  representational format and need not commit anyone to the second; my own suspicion
  is that the two are much closer than that, but I want the closeness located precisely
  rather than asserted.


  To force the issue, here is a distinction I''ve drafted and would like pressure-tested.
  There seem to be at least three different things one could mean by saying the dashboard
  is an illusion. An illusion of content: the display misrepresents what is there,
  attributing properties to the system that the system lacks. An illusion of process:
  the display is accurate as far as it goes, but it hides the fact that it is being
  constructed at all — the rendering is invisible, so its output presents itself as
  simply given, and that self-concealment, not any error, is what generates the feeling
  of immediacy. An illusion of audience: a real graphical user interface is an interface
  for someone standing outside the machine, and if the metaphor is applied to a mind
  that is supposed to be nothing over and above the machinery, there is no one left
  outside to be fooled — the display is addressed to a user who does not exist. To
  make these concrete I''ve been using a pair of synthetic cases: two machine-vision
  agents whose control systems are identical, except that the first is given a coarse
  but strictly faithful telemetry summary of its own states, while the second is given
  the same summary plus a decorative gauge that corresponds to nothing in its architecture
  and whose readings it nonetheless uses to arbitrate behavior.


  Please compare the two theories against this apparatus. Specifically: (a) which
  of the three readings of "illusion" does the user-illusion model actually require,
  and can it get by with only the second, leaving qualia untouched and hence neutral
  as against illusionism? (b) which reading does illusionism require, and is the audience
  objection a problem for one theory, both, or neither — in particular, can a Dennett-style
