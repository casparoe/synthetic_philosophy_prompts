  Move 1 — Dana: Bell''s theorem shows that no theory satisfying both locality and
  the statistical independence of the hidden variables from the measurement settings
  can reproduce the quantum correlations; since experiments confirm the correlations,
  and since giving up statistical independence is tantamount to saying the universe
  conspires to hide its own workings, the honest conclusion is that nature is nonlocal
  — there are influences between spacelike separated events.


  Move 2 — Elliot: The second step smuggles in the conclusion. Statistical independence
  is not a locality assumption; it''s an assumption about how we may reason about
  interventions, and dropping it is exactly what a superdeterministic theory does.
  Calling that a "conspiracy" is rhetoric: a theory in which the hidden variables
  and the settings share a common cause in the past is not conspiring any more than
  a barometer and a storm are. And there''s a cleaner option — retrocausal models,
  in which the setting influences the hidden variable along the past light cone —
  which keeps every influence inside the light cone, so locality is preserved in the
  relativistic sense. Dana''s "honest conclusion" is only honest if you''ve already
  decided the alternatives are inadmissible.


  Move 3 — Dana: The retrocausal option is not cleaner, it''s the same move wearing
  a different hat. In both cases, λ at the moment of the experiment depends on which
  measurements will be performed; the difference is only whether you describe the
  dependence as a common past cause or as a future setting reaching back. And there''s
  a substantive cost either way: if λ depends on the settings, you can no longer treat
  the settings as independently variable, which means you can''t reason about what
  would happen if we chose a different measurement — you lose counterfactual reasoning
  about interventions, and that is not a small price; it''s the price of doing science
  at all. Any theory that pays it can accommodate any data, which makes it unfalsifiable
  in practice.


