  Marking scheme: 25 marks, must-hit points. Should separate A from B: an A answer
  must, e.g.:

  - Identify that the repetition rule buys determinacy of comparison at the cost of
  granularity, and that the unit choice is a semantic decision, not a presentational
  one (it fixes what proposition the chart expresses).

  - Note that a chart''s truth-conditions depend on the transformer''s decisions (grouping,
  unit, what is omitted), so the chart is not self-explanatory in the sense of interpretation-free;
  standardization standardizes symbols, not the content-selection.

  - Say what is needed for truth-apt representation: a determinate condition under
  which it would be wrong; ability to enter into relations of contradiction/entailment
  with other representations; compositional capacity for negation and generality (there''s
  no pictorial negation — a picture doesn''t say what is not the case; cf. Wittgenstein''s
  point in the Tractatus that a picture shows but does not say, and that it cannot
  represent its own pictorial form). An A answer might connect to Wittgenstein''s
  picture theory (Tractatus) — but careful, an A answer shouldn''t be *required* to
  name Wittgenstein; better to require the *move*: recognizing that pictorial representation
  lacks a negation/conditional and so cannot express general or counterfactual claims
  without verbal supplementation. That''s the standard crux and it''s real: pictures
  can''t say "not," "all," "if...then," or "probably."

  - Address Material A: distinguish foundationalism about justification from standardization
  of notation; a fixed vocabulary is revisable-in-principle, so the boat is consistent
  with standardization provided no symbol is epistemically privileged. But then the
  anti-foundationalist reply costs Neurath the neutrality claim: the symbols are conventions
  like words, learned by training, so "pictures unite" is a claim about the reach
  of a taught convention, not about natural representation. An A answer draws out
  that cost rather than just noting the consistency.

  - Also: the fractional case shows the rule generates an inexactness that is systematic
  rather than accidental — and that the slogan about remembering simplified pictures
  over forgetting accurate figures concedes that accuracy is traded for memorability,
  which is a decision about the audience, not about truth. So the chart can be true-ish
  but is optimized for retention: this makes the picture language an instrument of
  pedagogy/politics, and raises the question of who controls the transformation. An
  A answer might note Neurath''s own programme is explicitly political/social-democratic
  and that the "neutral" picture is never neutral — but must tie it to the epistemology
  rather than treating it as an aside.


