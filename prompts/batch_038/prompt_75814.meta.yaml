  Now, what''s the crux for the exam question? Something that isn''t regurgitable.
  Ideas:


  1. The "counting" problem: Isotype''s first rule (quantity by repetition of identical
  unit figures) supposedly makes charts self-explanatory and language-neutral. But
  to read a repetition chart you must count, and counting requires a numeral system
  / cardinal concepts — precisely a linguistic-mathematical competence. Moreover,
  Neurath''s own rationale is comparative accuracy, yet repetition is worse than a
  bar chart for comparing non-integer or large magnitudes, and it invites the reader
  to estimate by area/length when grouping. So the question: does the unit-repetition
  rule deliver on the promise of a language-independent picture statement, or does
  it covertly presuppose the very numerical literacy it aims to replace? And what
  does this imply about the claim "words divide, pictures unite"?


  2. The transformation problem: The "transformer" must decide which source data to
  simplify and how to group; simplification loses accuracy ("to remember simplified
  pictures is better than to forget accurate figures"). Who controls the transformation,
  and can a picture statement be false? This connects to Neurath''s physicalism and
  protocol-sentence debate: if pictures are to serve in the unified science of "International
  Encyclopedia of Unified Science," they must be translatable/intertranslatable with
  protocol statements. Is a picture capable of being a protocol statement? Neurath
  himself conceded it''s a "language-like technique," not a language. So the exam
  crux: what would have to be true of pictures for them to have truth-values and to
  enter into logical relations (contradiction, entailment) with sentences — and is
  Neurath''s own physicalism (all scientific statements are statements about physical
  things, hence intertranslatable) a resource for answering that, or does it just
  relocate the problem?


  3. The anti-foundationalism/boat connection: Neurath wanted a picture language that
  would be a stable international auxiliary for the encyclopedia of unified science,
  with a fixed symbol vocabulary maintained by convention. But his own epistemology
  says no plank can be laid down as a permanent foundation; revision is piecemeal
  and always uses the rest of the ship as support. Tension: a standardized pictorial
  vocabulary is exactly the kind of thing that seems to require authority/fixity (a
  "dictionary" of symbols maintained by an institute), yet Neurath''s fallibilism
  and his anti-foundationalist physicalism deny that any such fixed base is available.
  How does Neurath escape? Possible answer: standardization is not foundationalist
  — symbols are revisable planks; the picture language is itself part of the ship,
  and its authority is pragmatic (it works for teaching), not epistemic. But then
  the picture language can''t claim to be more "objective"/neutral than words; the
  claim "words divide, pictures unite" is a claim about convention, not about natural
  representation — pictures are conventions too, learned, historically contingent.
  And the fact that the same team had to retrain symbol sets for Soviet, Dutch, British,
  and American audiences shows this.


