  (e) the fact that after a scheduled refactor, records we merged this quarter would
  not classify as merged next quarter — is that a defect in the procedure or a feature?


  4. Transitivity: our tooling assumes "duplicate of" is an equivalence relation,
  so every report ends up in exactly one bucket and the counts add up. Cases (b) and
  (c) suggest it isn''t transitive. Tell me whether to abandon transitivity, what
  has to change downstream if we do, and if we shouldn''t, how the procedure should
  block the intransitive cases without pretending they aren''t there.


  5. Worked applications: run the procedure on three cases, including one where it
  tells us something we do not want to hear (e.g., that a cluster we closed last year
  as a single defect should have been four, which reopens a filing).


