  ---


  I run the defect triage desk at a company that builds patient-monitoring software;
  we take in roughly four hundred field, telemetry, and QA reports a week, and four
  analysts decide for each one whether it duplicates an existing defect record or
  opens a new one. The decisions are individually small and collectively load-bearing:
  merging too aggressively hides systemic faults and suppresses the counts that our
  regulatory team uses in filings, while splitting too finely buries analysts in near-identical
  records and makes every severity statistic meaningless. We currently operate with
  three informal tests that we apply inconsistently — what we call the fix test (two
  reports describe the same defect if a single code change would prevent both), the
  repro test (if the same steps reproduce both, they are the same defect), and the
  cause test (same root cause, same defect) — and they disagree with each other often
  enough that the desk has no principled way to break ties.


  I want you to turn the problem of universals into a procedure these analysts can
  actually run. ... etc.


  Let me structure the asks:


