  Hard cases to include:

  1. Two reports with different symptoms and different root causes, but one fix (a
  guard/validation at a boundary) would prevent both. Fix test says merge; cause test
  says split.

  2. Two reports with the same root cause but different fixes required (e.g., the
  same underlying defect manifests in two subsystems requiring two different patches).
  Fix test says split; cause test says merge.

  3. A cluster of six reports that pairwise resemble each other but have no single
  shared feature — imperfect community. (This is the classic objection to resemblance
  nominalism.) Do they form one bug?

  4. A defect that is real but only describable disjunctively: "the device enters
  state X when either the network drops or the battery is low" — is that one bug or
  two? And a "grue"-style worry: our categories are indexed to the current codebase;
  after a refactor, the same reports would classify differently. Is the classification
  mind-dependent/interest-relative? That matters because the analyst''s decision changes
  the numbers in a regulatory filing.

  5. Counterfactual/prospective cases: a report of a bug in code not yet shipped.


