  each, a fast path for routine reports, where it terminates in "duplicate," "distinct,"
  or "escalate," and which steps hand the decision to a human because the question
  is one of policy rather than fact.


  2. Which of the three tests should be primary, what becomes of the other two, and
  why — in terms that an engineer with no philosophy will accept.


  3. The hard cases, explicitly handled: (a) two reports, different root causes, one
