  The Pasadena paradox: Nover and Hajek. Pasadena game = St. Petersburg-like alternating-sign
  game with expected value conditionally convergent (the series 1 - 1/2 + 1/3 - 1/4
  ... = ln 2, but the value-weighted series diverges conditionally). Actually the
  Pasadena game: coin flipped until heads; payoff = (-1)^(n-1) * 2^n / n. The expected
  value series is the alternating harmonic series, conditionally convergent to ln
  2. But the Pasadena game''s expected value in the standard sense involves summing
  (-1)^(n-1) 2^n/n * 2^-n = (-1)^(n-1)/n, which converges conditionally to ln 2. Because
  conditional convergence means rearrangements can give any value, the expected value
  is undefined / not well-defined. Related: Altadena game (positive version), Arroyo
  game, Barcelona game. Also "St. Petersburg paradox" (Petersburg), "Pasadena" (Petersburg
  + alternating signs).


