  The Repugnant Conclusion is the claim that, for any large population living extremely
  well, there is a much larger imaginable population whose lives are worth living
  but of very much lower quality, and which would be better. It is repugnant because
  it says that a world of ten billion people with wonderful lives is worse — no: is
  not as good as — a world of hundreds of billions scraping by. On the total view
  this follows directly: what matters is the sum of welfare, so enough lives of low
  positive quality will always out-weigh a smaller number of excellent ones.


  Parfit''s mere addition paradox is supposed to show that the conclusion is hard
  to escape even for those who reject the total view. Start with A, ten billion very
  well-off people. Now add ten billion more whose lives are worth living, though less
  well, and who are divided from the first group so that nobody is affected: call
  this A+. Adding these people is a mere addition, so A+ is not worse than A. Then,
  holding the population fixed, redistribute: everyone now enjoys a high quality of
  life, slightly below that of the best-off group in A+ but far above that of the
  added group. Call this B. B is not worse than A+; it is more equal, and the people
  who were worst off are much better off. Repeat the two steps — add more people,
  then equalize — as often as we like. Each step is either a mere addition or a change
  that makes things at least no worse. So by the transitivity of the not-worse-than
  relation we arrive at Z, a vast population of lives barely worth living, and Z is
  better than A.


  Average utilitarianism avoids this. It tells us to maximize welfare per person rather
  than in total, so it will never recommend Z over A, since Z''s average is far lower.
  The price is that it can never recommend creating anyone: an extra person almost
  always drags the average down, so the view tells us to stop having children even
  when their lives would be splendid. That is why Parfit thinks the non-identity problem
  is the same difficulty: since no one in Z is harmed by being created, the objection
  cannot be that we have wronged them, and any principle that avoids harming actual
  people will end up at Z.


