  \ for the fish dying at that moment? No — that's not right either.\n\nLet's be careful.\
  \ A classic: overdetermination with a *guaranteed backup*. In such cases the individual\
  \ act is *not* a but-for cause of the harm (the backup ensures it happens anyway).\
  \ So causal efficacy in the \"making a difference\" sense is actually absent — which\
  \ is precisely the inefficacy objection's point. But if the backup is *conditional*\
  \ on your act, then your act is a but-for cause, and yet the harm would happen anyway\
