  \ and intuitively permissible\" — which is what the inefficacy defender wants, and\
  \ it defeats the \"but you're still participating/complicit\" response.\n\nCase\
  \ 2: the reverse — counterfactually decisive but causally \"remote/inert-feeling\"\
  \ and intuitively impermissible. Hmm, what would that be? Something like: your act\
