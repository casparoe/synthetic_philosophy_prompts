  \ complicity.\n\nA designed case: build a case where the inefficacy objection succeeds\
  \ against the act-utilitarian calculus but fails against a contractualist or virtue-based\
  \ account? Or: a case where an individual's contribution *does* causally make a\
  \ difference but is worse precisely because it makes a difference — so the \"it\
  \ makes a difference\" reply backfires.\n\nBetter idea: design a case where the\
  \ expected-harm reply (Kagan-style thresholds) generates a *perverse* verdict: the\
  \ agent whose act is causally inefficacious has a greater obligation than the one\
  \ whose act is efficacious. Hmm.\n\nAnother good one: isolate a single variable.\
  \ The classic case is \"harmless torturers\" (Parfit) — many torturers each adding\
  \ one unit, victim feels no difference from one but agony from all. And the reverse:\
  \ \"bad weather\" / single torturer. Parfit also discusses the case where the threshold\
  \ is such that a single act triggers the whole harm (the \"triggering\" case) —\
  \ e.g., the last vote, or the case where a chicken purchase triggers an order of\
  \ 25 chickens (Budolfson/Sneddon debate about whether food supply chains actually\
  \ have thresholds).\n\nA really good design spec: build a case where the *triggering*\
  \ structure makes an individual act efficacious but the expected-harm calculation\
  \ says the act is permissible, and vice versa — i.e., decouple causal efficacy from\
  \ expected disutility. Something like: a case where the individual act is *certain*\
  \ to make a difference (no probability discounting) yet intuitively permissible,\
  \ and a case where the act is certain to make *no* difference yet intuitively impermissible.\
  \ That's a clean design task, and it attacks the standard response (expected harm)\
  \ by showing that probability-weighting isn't the only lever.\n\nActually here's\
  \ a sharper, more interesting and specific design: the \"supply chain lumpy vs.\
  \ smooth\" debate (Bob Fischer, \"Moral obligation to be a vegetarian\" vs. Budolfson\
  \ \"Is it wrong to eat chicken?\" — the empirical claim that meat supply chains\
  \ are smooth/large-batch, so no thresholds). A thought experiment: design a market\
  \ where the supply chain is *deliberately* smooth (a large batch system) yet an\
  \ individual's purchase still matters because of information — e.g., each purchase\
  \ is recorded and aggregated into a forecast that shifts production a lot. Then\
  \ the inefficacy objection fails not via thresholds but via signal/epistemics. Hmm,\
  \ that's kind of a real thing.\n\nLet me think about what makes a great prompt here.\
  \ The type requires: jointly satisfiable but non-trivial specs, realistic (not trolley-like),\
  \ a paragraph, no forbidden device, plus demonstration each spec is met, plus honest\
  \ note about which feature does the work, plus how a defender of the badly-faring\
  \ theory would attack.\n\nDesign proposal:\n\n\"You're a moral philosopher designing\
  \ cases for a workshop on the inefficacy objection. Build me a case where an agent's\
  \ individual act is *certainly* causally efficacious — no probability, no expected-value\
  \ discounting, no thresholds — and yet it's intuitively *permissible*, while a second\
