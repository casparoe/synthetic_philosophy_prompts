  \ institutions, each scenario ≤150 words total... the causal facts must be stated\
  \ explicitly and checkable (no 'probably'), and the difference in verdict must not\
  \ come from differences in scale of harm (same total harm in both) or from the agents'\
  \ intentions/motives.\"\n\nThen: walk through what act consequentialism / expected-harm\
  \ (Kagan-style) says in each, what a virtue or integrity-based account says, identify\
  \ which structural feature does the work (e.g., in the efficacious-but-permissible\
