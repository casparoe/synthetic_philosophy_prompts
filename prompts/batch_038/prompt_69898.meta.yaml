  \ in the inert-but-impermissible case the harm is caused by a group of which the\
  \ agent is a member and the act is expressive/participatory). And then say what\
  \ happens if you remove that feature, and how a defender of the expected-harm view\
  \ attacks the case (e.g., by re-describing causal facts, invoking 'triviality of\
  \ harm' / act-token vs. act-type).\n\nHmm, that's a nice two-case design. But maybe\
  \ it's cleaner and more in the weeds to focus on a single mechanism: the \"already-caused\
  \ / preempted\" structure, where an individual's act is genuinely causally efficacious\
