  \ specific agent's act would have caused it (preemption) — so the expected-harm\
  \ view has to say it's fine, but a complicity/participation view says it's not.\
  \ And then the reverse.\n\nActually let me think of a real, crisp mechanism I can\
  \ specify well.\n\nMechanism A — \"Efficacious but permissible\": Preemption/backup.\
  \ E.g., a factory will dump its waste into a river regardless; there are two pipes,\
  \ and if pipe 1 (regulated, monitored) is closed, pipe 2 (illegal but always used\
