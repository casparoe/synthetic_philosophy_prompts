  numbers — correlation strength, annual catastrophe rates, how long a founding population
  could remain self-sustaining. Where a move depends on an empirical premise neither
  of them defended, say so and say which way it would cut if the premise turned out
  to be at the high or low end.


  (c) Tell me what both of them are missing. I noticed at least that neither said
  what "self-sustaining" is supposed to mean, and that neither asked whether the correlation
  the philosopher objects to could be deliberately engineered down — but I want your
  list, not mine, and I want to know which of the missing considerations would most
