  Setup (as Kavka framed it): an eccentric billionaire shows you a vial of toxin that
  would make you painfully ill for a day, with no risk to life and no lasting effects.
  He will pay you a million dollars tomorrow morning if, at midnight tonight, you
  intend to drink the toxin tomorrow afternoon. He stresses that you need not drink
  it to be paid: the money will be in your account hours before the drinking time
  arrives, and the presence or absence of the intention at midnight is determined
  by a brain scanner of his devising. You are entirely free to change your mind once
  paid.


  The exchange:


  1. Nora: The puzzle is not a puzzle about rationality but a piece of conceptual
  sleight of hand. You cannot intend to do what you believe you will not do; after
  midnight you will correctly believe there is no reason to drink; therefore the required
  intention is unavailable. Nothing irrational happens — there is simply nothing to
  be done.


  2. Dev: That is a diagnosis, not a rebuttal, and it concedes what makes the case
  interesting. If the intention is impossible, there must be a faulty step in the
  argument that it is possible and rational: the payoff for intending is enormous,
  the cost of drinking is trivial by comparison, and reasons for acting seem to transmit
  to intentions to act. Naming the conclusion "impossible" without locating the bad
  step is exactly what the puzzle challenges you to do.


  3. Nora: The bad step is the transmission principle. Reasons to intend are not thereby
  reasons to drink, and an intention is rational only relative to what the agent expects
  to have reason to do when the time comes. Since the million is secured by the intention
  alone, at the time of drinking there is nothing to be gained and something to be
  lost, so failing to intend is not a failure of rationality at all.


  4. Dev: That principle is too strong to be believed, because it would make ordinary
  promising impossible. The whole function of a promise is to bind yourself against
  your later inclinations: at the moment of performance, keeping a costly promise
  often serves no independent interest of yours. If you can intend to Φ only when
  you expect a reason to Φ at the time of Φ-ing, nobody could ever promise anything,
  and that is a reductio of your principle, not a defense of it.


  5. Nora: Promises are disanalogous in a principled way. Promising generates a new
  reason — one created by the act of promising and standing at the time of performance.
  The toxin generates no such reason: at the drinking hour the money is already yours,
  and the bare fact that you once intended to be ill is not a reason to be ill. So
  the transmission principle can be restricted to cases where the agent expects a
  reason at the time of action, and promising survives intact.


