  fight is about the *status* of the claim and about the lucid-dream evidence.


  Move 1 (Ruth): The denial is conceptual, not empirical. "Experience" gets its meaning
  from criteria available in waking life — you can ask what someone was doing, when
  it started, whether it went on; with dreams there are no such criteria, so no possible
  observation could show a dream to be an experience. Evidence about REM or reports
  is irrelevant; you can''t settle a question about what a word means by experiment.


  Move 2 (Ivan): That makes the conclusion unfalsifiable and thus worthless. Treat
  it as an empirical hypothesis instead: either (a) the dream happens during sleep
  and is then remembered, or (b) it doesn''t happen during sleep at all — the narrative
  is produced by the awakening/memory process. Hypothesis (b) is testable and predicts
