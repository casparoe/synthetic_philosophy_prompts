  \ are mutually incompatible using the \"Lady Chatterley's Lover\" example and the\
  \ \"nosy neighbor\"/prude example: person 1 (the prude) prefers that nobody read\
  \ the book; person 2 (the lascivious) prefers to read it himself; the social states:\
  \ (nobody reads), (person 1 reads), (person 2 reads). Preferences lead to a cycle:\
  \ with decisiveness over their own protected pair plus Pareto, you get a cycle —\
  \ a social preference that isn't acyclic, hence no best element.\n\nKey subtleties\
  \ to get right in the summary and audit:\n1. Sen's result is about social decision\
  \ functions / social preference formation (ranking), not about the existence of\
  \ legal rights per se. It's not \"rights are impossible.\"\n2. The result is an\
  \ impossibility of simultaneously satisfying three conditions — it's not an argument\
  \ that liberalism (in the political sense) is refuted, nor that Pareto efficiency\
  \ is impossible.\n3. \"Liberalism\" in Sen's sense is minimal liberalism: at least\
  \ two individuals each with at least one protected pair. It's about decisiveness\
  \ in the social choice function, not about side constraints or about individuals'\
  \ ability to act.\n4. Critiques: Nozick argued rights are side constraints, not\
  \ rankings to be aggregated — the right should be exercised by the individual choosing;\
  \ rights function as constraints on the set of feasible social states rather than\
  \ as inputs to a social welfare ordering. Gibbard (1974) generalized: any assignment\
  \ of decisive rights leads to paradoxes (\"A Pareto-consistent libertarian claim\"\
