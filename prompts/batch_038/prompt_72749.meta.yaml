  I teach a small grad seminar on how the French Revolution gets explained — class,
  ideology, contingency, the works — and every single year, without fail, somebody
  in week five reaches for the line everyone hands to Vergniaud on the way to the
  scaffold: the revolution is like Saturn, it devours its own children. It''s a beautiful
  line and I''ve come to distrust it, because in my seminar it gets used to do at
  least two different jobs and I can''t decide whether it can do either.


  Use one: a structuralist in the group says the devouring shows the Terror came out
  of the revolution''s own logic rather than out of Robespierre''s character or the
  war — that an event which eats the Girondins, then the Hébertists, then Danton and
  Desmoulins, then the man running the knife, has an appetite of its own, and that
  appetite is the explanans. Use two: another student says exactly the opposite —
  Saturn swallowed because of a prophecy he had good reason to credit, so the analogy
  shows the purges were defensive preemption by people who were, locally, being strategic
  rather than possessed. Same image, opposite historiographical payload.


  Plus a wrinkle from my best student, who reads the myth more closely than I do:
  the swallowed children are disgorged alive and go on to overthrow their father.
  She says that''s the part that makes the analogy worth anything — it predicts the
  return (Thermidor, the recalled Girondins, the rehabilitation of Danton) — and then
  she says, correctly I think, that an image which predicts both the devouring and
  the regurgitation can''t be wrong about anything, so it isn''t an explanation, it''s
