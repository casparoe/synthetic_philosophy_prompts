  making finite priors irrelevant — but then any god with infinite payoff beats all.
  Also the objection that Pascal''s wager requires you to be able to choose belief
  (doxastic involuntarism) — Pascal''s answer is the holy water / "abêtissez-vous"
  route (habituation). Also Hájek''s "mixed strategy" argument that Pascal''s wager
