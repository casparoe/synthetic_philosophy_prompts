  "tying commitments" vs "ladder commitments" — a ladder being what you hand the other
  side. That''s vivid and clearly the asker''s coinage. I like "ladder": a commitment
  that only ties your own hands vs. one that also lowers the other side''s cost of
  backing down (hands them a ladder). The Greek referendum was the former; and interestingly
  the referendum''s No vote arguably *removed* the ladder for the creditors.


