  I work on build infrastructure, and there''s a thing in our industry that I can''t
  make sense of, and I''d like someone to take it apart for me.


  Half of what I do is trying to make provenance irrelevant. The whole point of reproducible
  builds is that if you compile our source yourself, you should get the exact same
  bytes we ship — same hash. And when you do, we tell people that means nothing about
  us matters anymore: you don''t have to trust the vendor, you don''t have to trust
  the build server, you don''t have to trust who ran it. Identical bytes means identical
  artifact, full stop. We also do this with content-addressed storage everywhere:
  a package is named by the hash of its contents, so two independently produced copies
  of the same package literally are the same object in the store. Same idea with signatures:
  a commit signed by a stranger is fine as long as the hash matches what a trusted
  key signed.


  Then the other half of my job is treating provenance as the only thing that matters.
  Our license scanner flags a function that''s byte-identical to GPL code and makes
  us rip it out or relicence the whole product — but if I hire someone to write the
  *exact same function* from scratch, without looking, the scanner is silent and legal
  signs off, even though every user gets identical behavior and identical bytes. If
  an AI writes a chunk of code, we require disclosure and in some cases deletion,
  but if a junior dev retypes someone else''s code from a blog post character by character,
  that''s just "learning," no policy triggers. And in open source there''s a huge
  difference between "a fork" and "the original" even when the trees are identical
  and the maintainer is the same person who moved repos — a project that gets abandoned
  and picked up by the community under a new name is treated as a *different project*
  with a different reputation, even though the code and sometimes even the contributors
  are the same.


  So: same bytes, different worth, depending on where they came from — and in the
  build system, same bytes, same worth, full stop, regardless of where they came from.
  Both of these are official policy at my company and I''ve implemented both.


  What does each of them assume about what a piece of software *is*? Like, the first
  one seems to assume the artifact is just its content — a work is a bitstring and
  two bitstrings that match are the same work and equally valuable. The second one
  seems to assume a work is a something-plus-a-history — that who made it and how
  is part of the thing itself, not just extra metadata. Can both be true? Is one of
  them secretly the real commitment and the other just convenience? And what happens
  if you swap one of them out: if we made the license scanner content-only (so identical
  behavior from independent authorship is still a violation), or if we made the build
  system provenance-only (so a hash match from an untrusted builder doesn''t count
  as verification)? I want to know what the deeper view is that each policy is only
  a special case of, and where they actually collide rather than just look like they
  do.


