  Under Stalinesque, the brain withholds the "experience" until it has enough info;
  but the neural processing of the red spot still happens at its onset. So a neural
  measure at time t (before green appears) will show red-related activity under both
  hypotheses. The difference must be about a later signature: whether there is a stored,
  un-updated trace of the pre-green experience. But the Orwellian story says the trace
  gets overwritten, so it won''t be there either. Hence the neural measure also underdetermines
  — unless you specify what makes a neural state "the experience" rather than a precursor.
  The crux: both hypotheses are claims about which physical events are conscious events,
  and no third-person measurement settles that without a bridging principle. That''s
  a very good, deep answer — it gets to the heart of the issue and can''t be produced
  by reciting labels.


