  then memory rewritten) or did it "edit in" the color change before consciousness
  (Stalinesque: the experience was constructed with the change already in it, and
  the subject''s report is a faithful record)? Dennett & Kinsbourne argue the two
  are observationally equivalent and that the distinction collapses — "multiple drafts"
  model. The crux: the timing problem — when is the content of experience fixed? And
  the challenge: can a purely behavioral/verbal report distinguish them? The prompt
  could inject a new twist: e.g., a hypothetical experiment involving a delay plus
  a distractor task, or a "memory probe" design, and ask the student to construct
  a discriminating experiment.


