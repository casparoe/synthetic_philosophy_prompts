  Proposed exam question core:


  "Color phi: two spots, spatially separated, different colors, alternating with an
  interstimulus interval short enough (roughly 60–120 ms) that subjects report seeing
  a single dot moving smoothly between the two positions. Subjects also report that
  the dot changes color somewhere near the middle of its trajectory — before the second
  spot has appeared.


  Two explanations:

  - Orwellian: the subject really does experience the first spot''s color persisting
  along the whole path; then, after the second spot appears, the memory of that experience
  is rewritten, so the report is based on a tampered record.

  - Stalinesque: the experience of motion is not assembled until enough information
  has arrived; the color change is written into the experience before it is ever conscious,
  so the report faithfully records what it was like.


  It''s usually said that these two make identical predictions in the standard paradigm,
  since both are reconstructed from the same post hoc report, and that therefore the
  distinction is empty.


  Question: [inject twist]"


  The twist: propose a "probe" variant. Here''s my design. Let me think about which
  design is genuinely interesting and where the crux lies.


  Twist idea 1 (the report/behavior dissociation): Suppose subjects are required to
  make an online, speeded response — e.g., as soon as they see any green, press a
  key — versus a delayed judgment of where along the path the color changed. The Stalinesque
  story (experience constructed as a best guess from all available information at
  the time of construction) predicts that the online response can''t be faster than
  the physical onset of green (no precognition), whereas the delayed localization
  judgment shows the illusory midpoint change. The Orwellian story predicts a normal
  online response too, plus a rewritten memory. So this doesn''t discriminate — which
  is itself the point: the discriminating question isn''t about speed but about whether
  there''s a stored unrevised content.


  Twist idea 2 (the memory-probe / retro-cue): The real crux: to discriminate, you
  need a measure that samples the content of experience at a time after the second
  spot appears but through a channel that (on the Orwellian story) is not subject
  to the rewriting. Any such channel presupposes an account of what makes a channel
  revisable or not. And the deeper problem: the rewriting is supposed to happen to
  the memory trace; but if the experience itself was of red-all-the-way, then the
  rewriting must be triggered by the arrival of the second spot — which means the
  rewriting mechanism must compare present input to stored content. Now, if the subject
  is prevented from forming a memory at all (e.g., the second spot is followed by
  a masking stimulus / backward masking that abolishes retention of the green), then
  the Orwellian story predicts the report reverts to "red all the way" or no color
  change, while the Stalinesque story predicts... also no color change (since the
  experience is constructed from available information). Hmm.


  Actually here''s a cleaner discriminating design, and it''s the classic one: The
  Orwellian model requires that the revision be a revision of memory of an already-existing
  experience. So the two differ about what the experience was like at a time before
  the second spot appears. But you can''t ask then, because asking interrupts. However:
  you can make the second spot''s color unpredictable or you can sometimes omit the
  second spot entirely. In "catch trials" where the sequence is truncated (only the
  red spot appears, then nothing), the Orwellian story predicts the subject experienced
  red all the way and reported red all the way — no illusion. The Stalinesque story
  also predicts no illusion. Not discriminating.


  The genuinely interesting crux, and one Dennett & Kinsbourne emphasize, is that
  "Stalinesque" here means the delay: the conscious experience of the moving dot is
  delivered late, after the second spot arrives ("the brain waits for the postman").
  That makes a real prediction: the experience of the first spot''s onset is delayed
  until enough information arrives — which implies that in a sequence with many spots,
  the whole stream is delayed; and that with a long enough interval, the delay story
  becomes implausible (the brain can''t wait 2 seconds). There''s a real "timing"
  question: for how long can the brain wait before assembling experience? If the illusion
  persists at SOAs longer than any plausible assembly delay, Stalinesque is undermined.
  And that is a real empirical handle: the color phi illusion reportedly persists
  up to... hmm, I think it works up to maybe 200-300 ms? Actually with longer intervals
  you get "successiveness" and optimal motion around 60-80 ms. I should avoid asserting
  specific numbers I can''t verify.


  Better crux, and I like this one: the "which report?" problem. The distinction Orwellian/Stalinesque
  only becomes empirically contentful if you fix a theory of what the report is a
  report of. Under a "narrative" or judgment-based view of phenomenal content (what
  it was like = what the subject is disposed to judge/report), the Orwellian story
  is incoherent: if the record is rewritten before any judgment, then the rewritten
  record just is the experience. So the Orwellian model only makes sense if the content
  of experience is fixed by something prior to and independent of the reporting mechanism
  — e.g., by the neural state at the time, or by an inner "given." That gives the
  student a precise task: show that the empirical equivalence is not a mere limitation
  of the paradigm but follows from a substantive thesis about where phenomenal content
  is fixed; and then state what additional assumption would make them come apart,
  and whether that assumption is one that could be tested behaviorally or only neurally.


