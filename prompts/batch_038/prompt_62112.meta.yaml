  Candidate rules and their divergent verdicts:

  - Flexibility rule (ch. 25): he lacked virtù, because virtù is the capacity to vary
  one''s conduct with the times; his fall was deserved, and fortune only supplied
  the occasion.

  - Nature-unchangeable rule (ch. 25''s second half / Discourses): no man can depart
  from his natural bent; since his prudence was real but his nature fixed, the collapse
  is fortune''s malignity, and he retains the praise of virtù.

  - Self-reliance rule (ch. 6/12/13, Discourses on arms): virtù is measured by whether
  one''s power rests on one''s own arms and one''s own resources, not on others''
  or on luck; he scores high → praise.

  - Founding/order rule: virtù is judged by the durability and quality of the order
  one leaves; his order collapsed with him → mixed or negative (a sign he built on
  himself, not on laws/institutions — cf. Machiavelli''s claim that a state depending
  on one man''s life is weak; Discourses I.9 or the "one man for founding, many for
  maintaining" theme).

  - Success/glory rule: glory attaches to results and to how power was acquired.


