  Let me weigh: which produces the crispest "candidate rules that fit all earlier
  verdicts but diverge on the new case"? I like the Machiavelli one because fortune/virtù
  has several genuinely competing readings:

  - R1: virtù = ability to seize opportunity (occasione) that fortune provides; success
  is what matters; fortune supplies half, we govern the other half.

  - R2: virtù = self-reliance (own arms, own resources, own ability); depending on
  fortune or others'' arms is fatal regardless of skill.

  - R3: virtù = flexibility, the capacity to vary one''s conduct with the times (ch.
  25 / Discourses III.9).

  - R4: what matters for judgment is glory/fame, not mere success — and glory is denied
  to those who achieve power by criminal means even with ability.

  - R5: the common good/republican standard: virtù is judged by whether it founds
  or sustains a lasting order (a state, laws, institutions) rather than personal rule.


  A new case can separate these. E.g.: a leader who comes to power by a coup (criminal-ish
  means: betrayal of a benefactor), then rules with exceptional competence, builds
  lasting institutions and a citizen militia, and whose state outlives him by two
  generations — and who dies peacefully in bed. Under R4 (glory denied to criminal
  acquisition) → condemned or at best ambiguous; under R5 (lasting order, own arms)
  → praised; under R2 → praised (self-reliant thereafter); under R1 → praised (seized
  the occasion).


  Better: make the case where R2, R3 and R5 diverge sharply. Something like: a ruler
  who acquired power by his own arms and ability, institutionalized well, but whose
  methods were inflexible — he responded to a changed situation with the same cautious
  strategy that had worked, and lost everything. That separates R3 (flexibility is
  the essence of virtù → verdict: he lacked virtù, fortune rightly destroyed him)
  from R2/R5 (he was self-reliant and built lasting institutions → verdict: he had
  virtù; his fall was pure fortune, i.e., malignità di fortuna, like Cesare Borgia).


  Hmm, but Machiavelli''s own treatment of the "times change" case (Julius II, Fabius
  Maximus) says: the man who varies his conduct with the times is fortunate; and no
  man is found so prudent as to adapt himself, both because nature cannot be changed
  and because a man always follows the mode in which he has prospered. So Machiavelli
  holds that almost no one can adapt — which creates a genuine internal tension: if
  no one can change nature, then blaming the inflexible ruler collapses into blaming
  him for his nature, and the fall looks like fortune''s doing, not a failure of virtù.
  That''s a great, non-regurgitable angle: the new case is precisely one where the
  "flexibility thesis" and the "no one can change his nature" thesis pull in opposite
  directions about whether the agent is to be judged as lacking virtù or as a victim
  of fortune.


