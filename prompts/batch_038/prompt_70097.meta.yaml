  same statement of the result: if each individual''s preferences over prospects satisfy
  the von Neumann–Morgenstern axioms, if the social preference over those same prospects
  also satisfies them, and if Pareto indifference holds (whenever every individual
  is indifferent between two prospects, so is society), then the social utility function
  is a positively weighted sum of the individuals'' utility functions; and if in addition
  all individuals share the same subjective probability function over states of the
  world, those weights are unique up to a common positive affine transformation.


  Their exchange went as follows.


  1. Marcus: the theorem settles the question. It does not assume that utilities are
  interpersonally comparable and then aggregate them; it derives an aggregation. And
  the uniqueness clause shows the weights are not a free parameter: once the individuals''
  utility functions are fixed, there is a determinate fact about how much each person''s
  utility counts. A positively weighted sum of individual utilities with determinate
  weights just is utilitarianism in its technical form.


  2. Ingrid: two things are being run together. First, von Neumann–Morgenstern utility
  functions are each unique only up to a positive affine transformation, so which
  numbers the weights take depends on an arbitrary choice of zero point and unit for
  every person; the theorem fixes an ordering, not a scale on which the relative importance
  of persons can be read off. Second, the utilities being summed are defined over
  prospects — lotteries — not over consequences or levels of well-being. Summing them
  is a representation theorem about social preferences under uncertainty. Calling
  it utilitarianism requires the extra premise that these utility numbers measure
  well-being.


  3. Marcus: on the first point you''ve proved too much. Uniqueness up to a common
  positive affine transformation is exactly the standard vNM non-uniqueness of the
  social utility function, not a residual freedom in the weights. If the weights could
  be chosen at will, the theorem would say nothing: any weighting would do. What it
  says is that, relative to the individuals'' own utility functions — which their
  risk attitudes pin down — the social ordering depends on those utilities through
  one specific linear combination. That is a substantive cardinal result, and it is
  precisely a form of interpersonal comparability, obtained rather than presupposed.


  4. Ingrid: substantive, yes; utilitarian, no. Nothing in the axioms rules out social
  utility of the form u₁ + 100·u₂. Every one of them is satisfied. Equality of weights
  is the whole of the ethical content of utilitarianism, and the theorem is silent
  about it. To get equality you need an anonymity condition, which is an ethical premise,
  or the veil-of-ignorance argument, which is where Harsanyi actually tries to get
  it.


  5. Marcus: then take the veil argument. An agent who does not know whose place she
  will occupy and who assigns equal probability to occupying each of them, choosing
  rationally, will rank prospects by the average of the utilities of the positions.
  That''s not an ethical assumption; it''s individual expected-utility reasoning plus
  ignorance of one''s identity. So equality of weights is derived, and your objection
  is answered from within Harsanyi''s own framework.


