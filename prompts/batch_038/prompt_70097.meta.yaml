  Let me be careful about accuracy. Harsanyi''s Aggregation Theorem (1955, "Cardinal
  Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility", JPE).
  Setup: individual preference orderings over prospects (lotteries) satisfying vNM
  axioms, social preference ordering over prospects satisfying vNM axioms, and Pareto
  indifference/weak Pareto: if all individuals are indifferent between two prospects,
  so is society. Conclusion: there exist positive weights such that the social utility
  of any prospect is a weighted sum of individual utilities; if the same-beliefs assumption
  holds (all individuals have the same subjective probability function over states,
  so prospects can be represented as lotteries over outcomes with common probabilities),
  then the weights are unique up to a common positive affine transformation, and the
  social preference is utilitarian in form.


  Weymark (1991, "A Reinterpretation of Harsanyi''s Social Aggregation Theorem", Journal
  of Mathematical Economics) argued that the theorem should be interpreted as a representation
  theorem for social preferences over lotteries, and that it establishes that the
  social preference ordering is represented by a sum of individual vNM utility functions,
  but vNM utilities are defined over lotteries not over consequences, so it''s not
  a claim about aggregating well-being; hence it doesn''t by itself establish utilitarianism
  as an ethical doctrine. Harsanyi later (1990s) responded by appealing to the veil-of-ignorance
  argument, which does establish that the social preference is a weighted sum of individual
  utilities with equal weights, using the "equiprobability" assumption.


  The "spurious unanimity" objection: Pareto indifference plus same beliefs... Actually
  the spurious unanimity objection concerns the Pareto principle: if all individuals
  agree that prospect A is better than B, society should too — but agreement can be
  "spurious" if it arises from everyone having the same false beliefs. Harsanyi''s
  answer requires the same-beliefs assumption, so unanimity in that case is genuine.


  Other points: the theorem does not require interpersonal comparability of utility
  as an input; rather, it derives a form of it. Also the theorem is silent on whether
  the weights are equal — equality of weights requires a separate symmetry argument
  (anonymity). Also state-dependent utility / Savage-style representation: without
  common priors, one cannot define prospects as lotteries; and the "same beliefs"
  assumption is very demanding — people disagree.


