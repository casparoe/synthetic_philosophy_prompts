  "McMahan''s rejection of the moral equality of combatants is best read as a two-stage
  argument, and each stage is aimed at something in Walzer.


  The first stage is diagnostic. McMahan thinks the traditional theory treats war
  as a self-contained activity, rather like a duel or a sport, in which the ordinary
  moral rules about killing are switched off for both participants at once. On his
  reading, Walzer''s defence of the equality is fundamentally legalist: the law of
  armed conflict gives combatants on either side the same privilege to fight and the
  same immunity from prosecution afterwards, and it is this legal package that makes
  killing in war something other than murder. Walzer does add that the ordinary soldier
  is not responsible for the decision to go to war — he is often conscripted, and
  in any case the choice was made above his head — but on McMahan''s account this
  functions as a supporting consideration rather than as the ground of the equality,
  which rests on the fact that both sides'' soldiers stand in the same legal relation
  to their acts.


  The second stage is constructive. McMahan says the duel analogy fails, and that
  the only model we actually have for the permissible use of lethal force is the one
  we already apply in individual self-defence. There, whether you may kill someone
  depends on whether that person is culpable for an unjust threat against you: the
  armed attacker is liable to be killed, the innocent bystander is not. Applied to
  war, this generates an immediate asymmetry. The combatant who fights for a state
  with a just cause is in the position of the person defending himself, while the
  combatant who fights for an aggressor state is in the position of the attacker,
  and the fact that both wear uniforms and follow the same rules of engagement changes
  nothing morally. McMahan is explicit that the asymmetry does not track the combatant''s
  own beliefs: what matters is the objective justice of the side he fights for, so
  a conscript who is sincerely and reasonably convinced that his country has been
  wronged is in the same position as an attacker who is mistaken about his own case.


  Turning to part (c), McMahan is careful not to draw the inference that his readers
  expect. He holds that the moral asymmetry should not be written straight into the
  law of armed conflict, and that international law should go on treating combatants
  on both sides alike, extending prisoner-of-war status and immunity from prosecution
  for acts that comply with the laws of war. So the answer to the question posed at
  the end of the prompt is no: on his view, combatants who fight for an unjust cause
  should not be tried as murderers after capture. His reasons are practical and epistemic
  rather than moral. In the middle of a conflict it is frequently impossible to establish
  which side is in the right, and any tribunal that tried would be the tribunal of
  the winner. And a rule that made the justice of one''s cause a condition of immunity
  would remove the incentive for a losing army to surrender or to restrain its own
  conduct, since a soldier with nothing to lose by fighting on would have everything
  to lose by stopping.


  For part (d), I think the concession in (c) costs McMahan more than he admits. If
  the legal rules are to stay exactly as they are, and if the law is what actually
  determines how wars are fought, then the moral asymmetry is left with nothing to
  do. His revisionism therefore ends up back where Walzer started, only described
  in the vocabulary of liability instead of privilege: the two of them agree about
  what soldiers may permissibly do, and disagree only about the account to be given
  of it."


