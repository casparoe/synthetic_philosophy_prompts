  Draft student answer (~450 words):


  ---

  McMahan''s argument against the moral equality of combatants proceeds in two stages,
  and it is best understood as a rejection of what he takes to be Walzer''s central
  move in Just and Unjust Wars.


  First, the diagnostic stage. McMahan says the traditional view treats war as a self-contained
  activity, like a game or a duel, in which the normal moral constraints on killing
  are suspended for both participants equally. Walzer''s version of this is legalist
  in spirit: because the law of armed conflict grants combatants on both sides the
  same privilege to fight and the same immunity from prosecution afterwards, killing
  in war is not murder, and so the soldier fighting a just war and the soldier fighting
  an unjust one stand in the same moral relation to their acts.


  Second, the constructive stage. McMahan argues that the analogy with a duel or a
  game fails, and that the only workable model is the one we already use for individual
  self-defense. In ordinary life, whether you may kill someone depends on whether
  they are morally responsible for an unjust threat; a culpable attacker is liable
  to defensive force, and an innocent bystander is not. If we apply this to war, the
  combatant who fights for a state with a just cause is analogous to the victim of
  an attack, while the combatant who fights for an aggressor state is analogous to
  the attacker. The two are not symmetric, so the moral equality of combatants cannot
  be true. The asymmetry does not depend on the combatants'' own beliefs; what matters
  is the objective justice of the side they serve, so a soldier who is entirely convinced
  that his cause is just is in the same position as the attacker in a case of self-defense.


  On the law, McMahan is careful not to draw the inference many readers expect. He
  says that the moral asymmetry does not translate directly into legal asymmetry,
  and that international law should continue to treat combatants on both sides equally,
  granting prisoner-of-war status and immunity from prosecution for acts that comply
  with the laws of war. So the answer to the last part of the question is no: on McMahan''s
  view, soldiers who fight for an unjust cause should not be punished as murderers
  after capture. The reasons he gives are practical and epistemic: in the middle of
  a war it is often impossible to determine which side is in the right, and a legal
  rule that made the justice of one''s cause a precondition of immunity would remove
  any incentive for losing soldiers to surrender or to observe restraints on their
  own conduct.


  That said, the conclusion is more concessive than it first appears. If the legal
  rules are to remain exactly as they are, and if the law is what actually governs
  the conduct of war, then the moral asymmetry has nothing to do, and McMahan''s revisionism
  collapses back into Walzer''s position, restated in the vocabulary of liability
  rather than privilege. Both agree about what soldiers may do; they only disagree
  about the description under which those acts are justified.

