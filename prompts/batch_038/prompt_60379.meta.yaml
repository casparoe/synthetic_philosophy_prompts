  I have been reading the rationalist blogs and forums — Overcoming Bias, the old
  LessWrong sequences, the comment threads that went on for years about Sleeping Beauty
  and the Doomsday Argument — for about fifteen years, and over that time I have accumulated
  a fairly definite position on self-locating belief. A reading group I belong to
  has asked each member to write down their settled view in advance so the others
  can attack it, and before I circulate mine I would like a proper consistency check.
  I am not asking you to tell me what the right answer to Sleeping Beauty is, or to
  summarize the debate; assume I know all of it. I want to know whether the following
  package hangs together, and if it does not, where it comes apart and what the cheapest
  repair is.


  Here is the package:


  (1) On the standard Sleeping Beauty case, Beauty''s credence in heads upon waking
  is 1/3. I take the halfer''s insistence that she gains no relevant new evidence
  to be the mistake: she does gain evidence, of the centered kind, and it should move
  her.


  (2) I understand credence in the betting-odds sense. To say my credence in p is
  x is just to say that x is the odds at which I would take either side of a bet on
  p. I don''t think there is any further fact about belief behind that disposition.


  (3) I also reject any kind of stakes-relativity in belief. What an agent ought to
  believe is fixed entirely by their evidence; the reward structure of the decisions
  they might happen to face is not part of their evidence, and so it cannot change
  what they ought to believe. Two agents with the same evidence who differ only in
  what they stand to win or lose have the same credences.


  (4) In anthropics I am an SIA-type rather than an SSA-type: other things equal,
  a world containing more observers is more likely to be the actual one, simply because
  there is more of a chance of being one of them. I accept the Presumptuous Philosopher
  as a cost rather than a reductio; if that principle really licenses betting enormous
  sums on the cosmos being absurdly large, I''m willing to write the check.


  (5) The Doomsday Argument is bad reasoning, full stop, and I have never found a
  version of it I could accept.


  (6) I am a causal decision theorist. I think evidential betting — the picture on
  which you choose an act because it is good news — gets the structure of agency wrong,
  and I do not want my account of belief to depend on it.


  (7) On interpretation of quantum mechanics I am an Everettian, and I think many-worlds
  makes Beauty less mysterious rather than more: there is a branch weight, and credence
  should track it.


  What I want from you is an audit, not a lecture. Go through the pairwise relations,
  tell me which of these genuinely pull against one another and which merely look
  like they do, and order the genuine ones by severity rather than presenting them
  as an undifferentiated list. For each, say what would have to be given up or revised,
  how much that revision would cost me elsewhere in the package, and then tell me
  which single change would clean up the most damage. I would also like to be told
  where you think a tension is real but only shows up under a particular reading of
  one of the claims — I have a suspicion that at least one of them above is stated
  loosely enough that its content shifts depending on how you take it, but I cannot
  see which.


  Please answer in continuous prose: no headings, no bullet points, no numbered lists
  in the reply, no bold or italic emphasis, no tables — paragraphs only, the way you
  would write a long letter or email. Begin with your overall verdict in two or three
  sentences before you get into the details.


