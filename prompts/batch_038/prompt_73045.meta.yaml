  Let me be careful about one thing: is the phenomenon genuinely different from "self-fulfilling
  prophecy"? Merton''s self-fulfilling prophecy covers a false definition of a situation
  that evokes behavior which makes the false conception come true. Self-defeating
  prophecy is the mirror. Both are about beliefs causing their truth/falsity. The
  student''s point is subtler: it''s not that the belief becomes true; it''s that
  the quantity being forecast is not well-defined independently of whether and how
  it''s announced, so two forecasters who condition on different announcement-acts
  rationally assign different probabilities, and their public "disagreement" doesn''t
  violate Aumann because they''re not estimating the same variable. Also there''s
  a further wrinkle: the forecast''s effect depends on how many people hear it, so
  there''s a fixed-point problem — the target moves as you aim at it, and there may
  be no stable forecast at all (no fixed point), or multiple fixed points. That''s
  the "in the weeds" bit: does a "performative-stable" prediction exist here? That''s
  genuinely the ML notion of performativity stability. Nice.


