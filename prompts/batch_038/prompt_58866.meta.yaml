  reasons in some fixed background theory and, before committing to an irreversible
  action, generates a batch of candidate judgments about the action''s consequences.
  It then re-examines a randomly chosen subset of those judgments using a second,
  independent-seeming pass of the same procedure — different search order, different
  decomposition of the problem, but the same underlying inference rules and the same
