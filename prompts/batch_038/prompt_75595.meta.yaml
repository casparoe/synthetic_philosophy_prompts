  Draft:


  I''ve spent more years than I care to admit in rationalist comment threads about
  measurement, Goodhart''s law, and aggregation, and I''ve come to think the annual
  global happiness ranking is the single best-argued-about object in that whole literature
  — yet almost every argument I''ve seen stays at the level of "self-reports are noisy"
  or "adaptation is a problem," and never gets to what the apparatus actually assumes
  philosophically. I''d like you to do the deeper excavation, and I''d like you to
  commit to conclusions rather than hand me a menu.


  Here is the practice as I understand it. A polling organization asks nationally
  representative samples in some 150 countries a single evaluative question: imagine
  a ladder whose top rung, 10, stands for the best possible life for you and whose
  bottom rung, 0, stands for the worst possible life for you — where on the ladder
  do you stand today? The ranking that gets published each year is just the population-weighted
  mean of those numbers, averaged over three years of fieldwork, with no other input.
  Alongside it, the compilers run a pooled regression of national means on six national
  indicators — log GDP per capita, social support (having someone to count on in trouble),
  healthy life expectancy, freedom to make life choices, generosity (donated to charity
  recently), and perceptions of corruption — and report, for each country, how many
  points of its score each indicator accounts for relative to a hypothetical benchmark
  country assembled out of the world''s worst values on all six. Whatever is left
  over is labelled the residual. In the most recent edition the residual is not a
  rounding error: for one of the top-five countries it is somewhere above two points
  on the ten-point ladder, larger than the contribution of any single indicator. Separately,
  and since 2021, the same enterprise has promoted a policy metric, the WELLBY — a
  wellbeing-adjusted life year, modelled on the QALY but substituting life satisfaction
  for health-related quality of life — and recommends that policymakers aim to increase
  the WELLBYs of people alive today and of future generations.


  So: what theory of well-being does this apparatus presuppose, and what does it rule
  out? ... [then the specific questions]


  Then questions:

  1. The ladder question asks people to evaluate "the best possible life for you"
  — a personal, self-anchored standard. What does that presuppose about whose judgment
  counts, and does it presuppose a desire-satisfaction/life-satisfaction theory, or
