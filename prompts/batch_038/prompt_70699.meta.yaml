  Devlin''s core argument:

  - Society has the right to protect itself; a society is not just a political organisation
  but is held together by a community of ideas, including shared moral ideas — a "bond"
  (Devlin says society is held together by "an invisible bond"; if the bond is loosened,
  society disintegrates). He argued that the suppression of vice is as much the law''s
  business as the suppression of subversive activities: immorality is to society what
  treason is to the state.

  - There is no theoretical limit: the law may in principle enforce any part of the
  shared morality, though in practice there are limits of tolerance and expediency.

  - The test: the judgement of the reasonable/right-minded man; the feeling of "intolerance,
  indignation and disgust" — the man on the Clapham omnibus. Devlin said the moral
  judgement of society must be that of the reasonable man, not a mere count of opinion;
  and the jury is a good model of how that judgement is reached.

  - He emphasised that society should not be too eager to intervene; the law should
  be slow to change; maximum individual freedom consistent with the integrity of society;
  privacy should be respected as much as possible.

  - He distinguished between the law''s function and moral criticism: not every sin
  is a crime, but no conduct is in principle beyond the law''s reach.

  - Devlin was a positivist about which morality: the actual, positive morality of
  the society, not a "true" morality. He explicitly said he was not asserting the
  code is right.


  Hart''s criticisms (Law, Liberty and Morality, 1963):

  - Devlin''s "disintegration thesis" (Hart''s label) is either an a priori/conceptual
  claim (question-begging: defining society by its morality) or an empirical claim
  (unsupported by evidence; societies can undergo radical moral change without disintegrating
  — analogy with the US and divorce, etc.).

  - Hart distinguished between "shared morality necessary for existence of society"
  and "this particular morality necessary": Devlin slides between them. Hart''s analogy:
  the parallel with treason confuses the fact that a society''s moral code is part
  of its identity with the claim that its particular code is essential.

  - Hart objected to the conservatism implication: if a society''s morality is identified
  with its existence, then any change is treated as disintegrating.

  - Hart also argued that Devlin''s position, if accepted, would allow the enforcement
  of morality even in the absence of harm, and that moralism of this kind rests on
  repugnant premises; Hart defended a Millian/liberal approach modified; and he distinguished
  paternalism, moralism, and the offence principle.

  - Hart also criticised Devlin''s use of the reasonable man''s feelings of disgust
  as the criterion: disgust is not a reliable criterion, and it amounts to enforcing
  the majority''s tastes; also Hart''s point that Devlin conflates the moral feelings
  of a society with the existence of the society.

  - Hart''s own view: the "minimum content of natural law" and that a society''s survival
  requires only some very general moral principles (restraint on violence, honesty,
  etc.), not the whole detailed code.

  - Also, Hart noted Devlin''s view has a "conservative" implication: any moral change
  is presumptively a threat.


  Dworkin''s criticism (1966, "Lord Devlin and the Enforcement of Morals", Yale Law
  Journal): Dworkin argued Devlin''s argument is confused — that Devlin slides from
  the truism that a society''s identity depends on shared moral views (arg. from definition)
  to the empirical claim that change destroys society, and that Devlin''s empirical
  evidence (the "reasonable man''s" disgust) is not evidence for disintegration; Dworkin
  distinguished the "argument from definition" from the "argument from necessity".
  Dworkin''s key move: even granting that society is partly constituted by shared
  morality, it doesn''t follow that a change in morality is a change of society in
  the normative sense of "destroying society" — the loss would be a loss of a society,
  not of society; also, Dworkin: the fact that people feel disgust is not evidence
  that society will disintegrate.


