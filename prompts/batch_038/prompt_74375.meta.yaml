  how honor-debts can be paid by others; he notes that in the American Civil War,
  a draftee could hire a substitute; he draws on the idea that punishment is partly
  a matter of the community''s expression of reprobation (this is a bit like his discussion
  of "the law''s" or "the community''s" condemnation). He also talks about "penal
  substitution" being intelligible in a society where punishment is understood as
