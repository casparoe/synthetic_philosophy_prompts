  punishment deserved by the offender — is something we moderns reject in criminal
  justice, but we do accept analogous practices: paying someone''s debts, honor debts,
  a friend taking your place, the idea of "substitutes" in war (the Civil War draft
  allowed hiring a substitute), and the practice of accepting a friend''s help in
  paying off a debt of honor. Lewis argues that the concept of debt of honor, and
  the transferability of "debts," gives us the resources to make sense of penal substitution,
  and that retributive punishment is partly about the community''s condemnation. He
  suggests we do retain the intuition in contexts of honor and debt.


